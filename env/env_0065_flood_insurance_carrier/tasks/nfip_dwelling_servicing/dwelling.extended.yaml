events:
  # ---- contract writes on the policy record ----
  - type: dwelling_policy_issued
    target: dwelling_policies
    mutation: create
    meaning: A new NFIP Dwelling Form policy is issued on an application received with its full premium; it waits in pending_effective until its effective date.
    grain: one row per policy issued
    fields:
      policy_number: NFIP policy number assigned at issue.
      variant_name: Occupancy tier written, as the official full tier name.
      property_address: Address of the insured building or unit.
      flood_zone: FEMA flood zone shown for the building on the effective Flood Insurance Rate Map.
      primary_residence: Whether the policy is designated a primary residence.
      building_coverage: Building limit written.
      contents_coverage: Contents limit written.
      building_deductible: Building deductible elected.
      contents_deductible: Contents deductible elected.
      replacement_cost_value: Building replacement cost value stated on the application.
      application_date: Date the signed application and full premium were received.
      original_effective_date: Date coverage first attaches.
      term_start: Start of the first term (equal to the original effective date).
      term_end: End of the first term.
      waiting_period_basis: Which waiting rule set the effective date.
      loan_closing_date: Loan closing date when the purchase is in connection with a loan.
      map_revision_date: Effective date of the map revision when the map-revision exception is used.
      mortgage_required: Whether a federally regulated lender requires the coverage.
      mortgagee_name: First mortgagee of record.
      loan_number: Mortgagee's loan number.
      premium_payor: Who pays the premium.
      rated_risk_premium: Risk premium line produced by the Risk Rating 2.0 rating engine for the term.
      rated_icc_premium: ICC premium line produced by the rating engine for the term.
      rated_federal_policy_fee: Federal Policy Fee produced by the rating engine for the term.
      community_probation: Whether the community is on NFIP probation at issue.
    triggers:
      - event: dwelling:dwelling_premium_charged
        map: {term_start: term_start, charge_basis: NEW_BUSINESS}
      - event: dwelling:dwelling_premium_payment
        map: {term_start: term_start}
  - type: dwelling_policy_effective
    target: dwelling_policies
    mutation: {transition: {from: pending_effective, to: in_force}}
    meaning: Coverage attaches on the effective date once the waiting period has run.
    grain: one row per policy taking effect
    fields:
      original_effective_date: Date coverage attached.
    triggers: []
  - type: dwelling_term_renewed
    target: dwelling_policies
    mutation: update
    meaning: The renewal premium is received on or before expiration and the next term is booked on the same policy number.
    grain: one row per term renewed
    fields:
      term_start: Start of the renewed term (the prior term end).
      term_end: End of the renewed term.
      rated_risk_premium: Capped risk premium booked for the renewed term.
      rated_icc_premium: ICC premium line for the renewed term.
      rated_federal_policy_fee: Federal Policy Fee for the renewed term.
    triggers:
      - event: dwelling:dwelling_premium_charged
        map: {term_start: term_start, charge_basis: RENEWAL}
  - type: dwelling_grace_entered
    target: dwelling_policies
    mutation: {transition: {from: in_force, to: renewal_grace}}
    meaning: The term expires with the renewal premium unpaid and the renewal grace period starts.
    grain: one row per expiration
    fields:
      term_end: Expiration date that opened the grace period.
    triggers: []
  - type: dwelling_grace_renewed
    target: dwelling_policies
    mutation: {transition: {from: renewal_grace, to: in_force}}
    meaning: The full renewal premium arrives inside the grace period and the renewed term is booked from the prior expiration date.
    grain: one row per grace-period renewal
    fields:
      term_start: Start of the renewed term (the prior expiration date).
      term_end: End of the renewed term.
      rated_risk_premium: Capped risk premium booked for the renewed term.
      rated_icc_premium: ICC premium line for the renewed term.
      rated_federal_policy_fee: Federal Policy Fee for the renewed term.
    triggers:
      - event: dwelling:dwelling_premium_charged
        map: {term_start: term_start, charge_basis: RENEWAL}
  - type: dwelling_policy_lapsed
    target: dwelling_policies
    mutation: {transition: {from: renewal_grace, to: lapsed}}
    meaning: The grace period ends unpaid; coverage ended at the expiration date and a new policy would be needed.
    grain: one row per lapse
    fields:
      closed_date: Expiration date at which coverage ended.
    triggers: []
  - type: dwelling_policy_cancelled
    target: dwelling_policies
    mutation: {transition: [{from: pending_effective, to: cancelled}, {from: in_force, to: cancelled}]}
    meaning: The named insured's signed cancellation request takes effect and the policy ends on the cancellation effective date.
    grain: one row per policy cancelled
    fields:
      cancellation_reason: NFIP-aligned cancellation reason on the signed request.
      cancellation_effective_date: Date the cancellation takes effect.
      closed_date: Date the cancellation was processed.
    triggers:
      - event: dwelling:dwelling_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: dwelling_policy_nullified
    target: dwelling_policies
    mutation: {transition: [{from: pending_effective, to: nullified}, {from: in_force, to: nullified}]}
    meaning: Tidemark voids the policy from its inception because it should never have been issued.
    grain: one row per policy nullified
    fields:
      cancellation_reason: Nullification reason.
      cancellation_effective_date: The original effective date (a nullification always reaches back to inception).
      closed_date: Date the nullification was processed.
    triggers:
      - event: dwelling:dwelling_premium_credit
        map: {charge_basis: NULLIFICATION}
  - type: dwelling_rating_updated
    target: dwelling_policies
    mutation: update
    meaning: Rating facts on the policy change mid-term — an Elevation Certificate first floor height or a primary-residence designation — and the rating engine re-rates the term.
    grain: one row per rating change
    fields:
      ec_on_file: Whether an Elevation Certificate is on file.
      first_floor_height_ft: First floor height used for rating.
      primary_residence: Primary-residence designation after the change.
      rated_risk_premium: Re-rated risk premium for the full current term.
      rated_icc_premium: Re-rated ICC premium for the full current term.
    triggers: []
  - type: dwelling_coverage_updated
    target: dwelling_policies
    mutation: update
    meaning: An endorsement changes the limits, deductibles or mortgagee shown on the policy as of its effective date.
    grain: one row per endorsement applied
    fields:
      building_coverage: Building limit after the endorsement.
      contents_coverage: Contents limit after the endorsement.
      building_deductible: Building deductible after the endorsement.
      contents_deductible: Contents deductible after the endorsement.
      mortgagee_name: Mortgagee of record after the endorsement.
      loan_number: Loan number after the endorsement.
      mortgage_required: Whether coverage is mortgage-required after the endorsement.
      premium_payor: Premium payor after the endorsement.
      rated_risk_premium: Full-term risk premium for the policy as endorsed.
      rated_icc_premium: Full-term ICC premium for the policy as endorsed.
    triggers: []
  - type: dwelling_policy_assigned
    target: dwelling_policies
    mutation: update
    meaning: On the sale of the insured building the seller assigns the in-force policy to the buyer, who becomes the named insured from the title transfer date.
    grain: one row per assignment
    fields:
      customer_id: The buyer who becomes the named insured.
      mortgagee_name: The buyer's mortgagee of record.
      loan_number: The buyer's loan number.
      mortgage_required: Whether the buyer's lender requires the coverage.
      premium_payor: Premium payor for the buyer.
      primary_residence: Primary-residence designation for the buyer.
    triggers: []
  # ---- premium ledger ----
  - type: dwelling_premium_charged
    target: dwelling_billing
    meaning: One premium component is booked to the policy for a term — at new business, at renewal or by an endorsement.
    grain: one row per premium component per term per booking occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Start of the term the component belongs to.
      component: Premium component booked.
      charge_basis: Occasion of the booking.
      amount: Component amount, positive.
      posted_date: Date the component was booked.
      reference_id: The endorsement record that caused an endorsement booking; empty for new business and renewal.
    account: premium_balance
    direction: in
    triggers: []
  - type: dwelling_premium_payment
    target: dwelling_billing
    meaning: A premium payment is received and applied to the policy.
    grain: one row per payment item received
    distinguish_by: [payment_ref, term_start]
    fields:
      term_start: Term the payment is applied to.
      amount: Amount received, positive.
      posted_date: Date the payment was received.
      payment_ref: Check number, ACH trace or card authorization of the payment item.
      payment_method: How the payment was made.
    account: premium_balance
    direction: out
    triggers: []
  - type: dwelling_premium_credit
    target: dwelling_billing
    meaning: The returnable share of one premium component is credited back — on a cancellation, a nullification or a mid-term re-rate that lowers the term premium.
    grain: one row per credited component per crediting occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Term the credited component belongs to.
      component: Premium component credited.
      charge_basis: CANCELLATION, NULLIFICATION or RERATE.
      amount: Credited amount, positive.
      posted_date: Date the credit was booked.
      reference_id: The record that caused the credit — the cancellation request, the Elevation Certificate record, or the policy itself for a nullification.
    account: premium_balance
    direction: out
    triggers:
      - event: dwelling:dwelling_refund_disbursed
        map: {reference_id: reference_id}
  - type: dwelling_refund_disbursed
    target: dwelling_billing
    meaning: The credit balance created by a cancellation, nullification or overpayment is paid out to the payor of record.
    grain: one row per refund payment issued
    distinguish_by: [reference_id, payee]
    fields:
      amount: Refund paid, positive.
      posted_date: Date the refund was issued.
      reference_id: The cancellation request (or nullified policy) the refund settles.
      payee: Who receives the refund.
      payment_ref: Refund check or ACH reference.
    account: premium_balance
    direction: in
    triggers: []
  # ---- servicing documents ----
  - type: dwelling_endorsement_issued
    target: dwelling_changes
    meaning: A mid-term endorsement is recorded with its effective date — a coverage increase or decrease, a deductible change or a mortgagee change.
    grain: one row per endorsement request processed
    distinguish_by: [change_type, change_effective_date, recorded_date]
    fields:
      change_type: Kind of endorsement.
      change_effective_date: Date the endorsement takes effect.
      recorded_date: Date the endorsement was processed.
      new_building_coverage: Building limit requested.
      new_contents_coverage: Contents limit requested.
      new_building_deductible: Building deductible requested.
      new_contents_deductible: Contents deductible requested.
      new_mortgagee_name: Mortgagee requested.
      new_loan_number: Loan number requested.
      loan_closing_date: Closing date of the loan transaction tied to the endorsement, when any.
      rerated_risk_premium: Full-term risk premium the rating engine returns for the policy as endorsed.
      rerated_icc_premium: Full-term ICC premium the rating engine returns for the policy as endorsed.
    triggers:
      - event: dwelling:dwelling_coverage_updated
        map: {building_coverage: new_building_coverage, contents_coverage: new_contents_coverage, building_deductible: new_building_deductible, contents_deductible: new_contents_deductible, mortgagee_name: new_mortgagee_name, loan_number: new_loan_number, rated_risk_premium: rerated_risk_premium, rated_icc_premium: rerated_icc_premium}
      - event: dwelling:dwelling_premium_charged
        when: {change_type: [COVERAGE_INCREASE, DEDUCTIBLE_DECREASE]}
        map: {charge_basis: ENDORSEMENT}
  - type: dwelling_ec_received
    target: dwelling_changes
    meaning: An Elevation Certificate (FEMA Form 086-0-33) for the insured building is received and its certified elevations are recorded.
    grain: one row per certificate received
    distinguish_by: [ec_survey_date, recorded_date]
    fields:
      recorded_date: Date the certificate was received.
      change_effective_date: Date the rating change takes effect.
      ec_survey_date: Date the surveyor certified the elevations.
      ec_building_diagram: Building diagram number selected on the certificate.
      ec_first_floor_height_ft: First floor height certified on the certificate.
      ec_lowest_floor_elevation: Elevation of the top of the lowest floor.
      ec_base_flood_elevation: Base flood elevation at the building.
      ec_applied: Whether the certified first floor height lowers the term premium and is applied to rating.
      rerated_risk_premium: Full-term risk premium the rating engine returns with the certified first floor height.
      rerated_icc_premium: Full-term ICC premium the rating engine returns with the certified first floor height.
    triggers:
      - event: dwelling:dwelling_rating_updated
        when: {ec_applied: true}
        map: {first_floor_height_ft: ec_first_floor_height_ft, ec_on_file: true, rated_risk_premium: rerated_risk_premium, rated_icc_premium: rerated_icc_premium}
      - event: dwelling:dwelling_premium_credit
        when: {ec_applied: true}
        map: {charge_basis: RERATE}
  - type: dwelling_renewal_offered
    target: dwelling_changes
    meaning: The renewal bill for the coming term is issued, carrying the rating engine's indicated risk premium for that term.
    grain: one row per renewal bill issued
    distinguish_by: [renewal_term_start]
    fields:
      recorded_date: Date the renewal bill was issued.
      renewal_term_start: Start date of the term being offered.
      indicated_risk_premium: Full-risk premium the rating engine indicates for the coming term before the annual cap.
    triggers: []
  - type: dwelling_mortgagee_notice
    target: dwelling_changes
    meaning: Written notice of a cancellation or non-renewal is sent to the mortgagee of record.
    grain: one row per notice sent
    distinguish_by: [notice_reason, recorded_date]
    fields:
      recorded_date: Date the notice was sent.
      notice_reason: Why the mortgagee is being notified.
      new_mortgagee_name: Mortgagee the notice is addressed to.
    triggers: []
  # ---- claims ----
  - type: dwelling_claim_reported
    target: dwelling_claims
    meaning: A first notice of a flood loss is taken and a claim number is assigned.
    grain: one row per claim reported
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number assigned at first notice.
      date_of_loss: Date the flood loss occurred.
      event_date: Date the loss was reported.
    triggers: []
  - type: dwelling_adjuster_report
    target: dwelling_claims
    meaning: The assigned adjuster files a preliminary, final or supplemental report with the measured loss by coverage.
    grain: one row per adjuster report filed on a claim
    distinguish_by: [claim_number, report_type, event_date]
    fields:
      claim_number: Claim the report belongs to.
      date_of_loss: Date of loss on the claim.
      report_type: Kind of report.
      event_date: Date the report was filed.
      building_rcv_loss: Building loss measured at replacement cost.
      building_acv_loss: Building loss measured at actual cash value.
      contents_acv_loss: Contents loss measured at actual cash value.
      special_items_loss: Part of the contents loss that falls in the special-items class.
      total_loss: Whether the adjuster finds the building destroyed or not economically repairable.
    triggers: []
  - type: dwelling_proof_of_loss_filed
    target: dwelling_claims
    meaning: The insured's signed and sworn proof of loss for one coverage is received.
    grain: one row per proof of loss received for a coverage on a claim
    distinguish_by: [claim_number, coverage_part, event_date]
    fields:
      claim_number: Claim the proof of loss belongs to.
      date_of_loss: Date of loss on the claim.
      coverage_part: Coverage the proof of loss is for.
      claimed_amount: Amount sworn on the proof of loss.
      event_date: Date the proof of loss was received.
    triggers: []
  - type: dwelling_claim_paid
    target: dwelling_claims
    meaning: A claim payment for one coverage is issued.
    grain: one row per payment item issued
    distinguish_by: [claim_number, coverage_part, payment_ref]
    fields:
      claim_number: Claim the payment belongs to.
      coverage_part: Coverage the payment is for.
      payment_amount: Amount paid, positive.
      payment_ref: Claim check or ACH reference.
      payee: Payee line on the payment.
      event_date: Date the payment was issued.
    account: claim_paid
    direction: in
    triggers: []
  - type: dwelling_claim_payment_voided
    target: dwelling_claims
    meaning: An issued claim payment is voided (lost, stale-dated or issued to the wrong payee) before it is reissued.
    grain: one row per payment item voided
    distinguish_by: [payment_ref]
    fields:
      claim_number: Claim the voided payment belongs to.
      coverage_part: Coverage of the voided payment.
      payment_amount: Amount voided, positive.
      payment_ref: Reference of the payment item being voided.
      event_date: Date the payment was voided.
    account: claim_paid
    direction: out
    triggers: []
  - type: dwelling_claim_denied
    target: dwelling_claims
    meaning: Tidemark issues a written denial of all or part of a claim for one coverage.
    grain: one row per written denial per coverage on a claim
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim being denied.
      coverage_part: Coverage denied.
      denial_reason: Reason stated in the denial letter.
      event_date: Date of the written denial.
    triggers: []

measures:
  - id: dwelling_msr_term_claims_paid
    window: The current policy term of the policy, from term_start inclusive to term_end exclusive, judged by each claim's date_of_loss.
    measure: Count of distinct claim_number values with a date_of_loss inside the window whose net payment (sum of dwelling_claim_paid payment_amount minus dwelling_claim_payment_voided payment_amount on that claim) is above zero.
  - id: dwelling_msr_term_claims_open
    window: The current policy term of the policy, from term_start inclusive to term_end exclusive, judged by each claim's date_of_loss.
    measure: Count of distinct claim_number values reported (dwelling_claim_reported) with a date_of_loss inside the window that have neither a dwelling_claim_paid row nor a dwelling_claim_denied row on record.
  - id: dwelling_msr_claim_part_paid
    window: The whole life of one claim_number, for one coverage_part.
    measure: Sum of payment_amount on dwelling_claim_paid rows minus sum of payment_amount on dwelling_claim_payment_voided rows for that claim_number and coverage_part.

policies:
  - id: dwelling_agg_multi_holding
    subject: [dwelling_policy_issued]
    rule: >-
      A customer may hold any number of Dwelling Form policies, one for each insured building or residential unit
      they own or rent at a different property address; there is no per-customer cap. Each policy is a separate
      contract with its own policy number, limits, deductibles, premium and term, and nothing on one policy is
      combined with, pooled into or offset against another policy of the same customer.
    eligibility: []
    params:
      max_per_customer: null
  - id: dwelling_agg_one_policy_per_building
    subject: [dwelling_policy_issued, dwelling_policy_cancelled]
    rule: >-
      The National Flood Insurance Program allows only one NFIP policy with building coverage on a building, and
      only one NFIP contents policy per insured occupant of the same premises. A new building policy is issued only
      when no other Dwelling Form policy with building coverage at the same property address is in status
      pending_effective, in_force or renewal_grace. A tenant contents policy at a property address can coexist with
      the owner's building policy at that address because the insureds differ, and a condominium unit policy can
      coexist with the association's Residential Condominium Building Association Policy on the building, because
      the unit policy responds only to the unit owner's own interest. When two building policies on the same
      building are found in force, the one with the later original_effective_date is the duplicate and is cancelled
      under reason DUPLICATE_NFIP_POLICY; the earlier policy is never the one cancelled. Limits are never added
      across duplicate policies: a loss is adjusted only under the policy that remains.
    eligibility:
      - id: no_live_building_policy_at_address
        applies_to: [dwelling_policy_issued]
        kind: dedup
        condition: A new building policy is issued only when no other Dwelling Form policy with building coverage at the same property address is in status pending_effective, in_force or renewal_grace.
        evidence_fields: [dwelling_policies.property_address, dwelling_policies.status, dwelling_policies.building_coverage]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.property_address]
          action_bindings:
            dwelling_policies.property_address: property_address
        dedup_contract:
          table: dwelling_policies
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [pending_effective, in_force, renewal_grace]}
          distinct_fields: [variant_name]
  - id: dwelling_coverage_limits_deductibles
    subject: [dwelling_policy_issued, dwelling_endorsement_issued, dwelling_coverage_updated]
    rule: >-
      Building coverage may be written only on a tier whose building_coverage_available is true, and the building
      limit may not exceed that tier's max_building_coverage; the contents limit may not exceed max_contents_coverage.
      Both limits are written in whole multiples of coverage_increment, and for a residential condominium unit the
      building limit is further held to the building replacement cost value stated on the application. Each
      deductible must be one of the tier's listed options and may not exceed max_deductible. The minimum building
      deductible is min_building_deductible_up_to_threshold when the building limit is at or below
      deductible_limit_threshold, and min_building_deductible_over_threshold when the building limit is above it;
      the minimum contents deductible is min_contents_deductible. Building and contents deductibles are elected
      separately and may differ. An application or endorsement that elects no deductible takes the tier's
      default_building_deductible and default_contents_deductible, raised to the applicable minimum if the default
      falls below it. A limit or deductible outside these bounds is not written as requested: the request is
      written at the nearest permitted value only when the customer accepts that value, and otherwise it is not
      processed.
    eligibility: []
    params:
      per_tier:
        NFIP Dwelling Form – Tenant Contents: {max_building_coverage: =max_building_coverage, max_contents_coverage: =max_contents_coverage, min_building_deductible_over_threshold: =min_building_deductible_over_threshold}
        NFIP Dwelling Form – Residential Condominium Unit: {max_building_coverage: =max_building_coverage, max_contents_coverage: =max_contents_coverage, min_building_deductible_over_threshold: =min_building_deductible_over_threshold}
        NFIP Dwelling Form – Manufactured Home: {max_building_coverage: =max_building_coverage, max_contents_coverage: =max_contents_coverage, min_building_deductible_over_threshold: =min_building_deductible_over_threshold}
        NFIP Dwelling Form – Secondary Single-Family Home: {max_building_coverage: =max_building_coverage, max_contents_coverage: =max_contents_coverage, min_building_deductible_over_threshold: =min_building_deductible_over_threshold}
        NFIP Dwelling Form – Primary Single-Family Home: {max_building_coverage: =max_building_coverage, max_contents_coverage: =max_contents_coverage, min_building_deductible_over_threshold: =min_building_deductible_over_threshold}
        NFIP Dwelling Form – Two-to-Four Unit Building: {max_building_coverage: =max_building_coverage, max_contents_coverage: =max_contents_coverage, min_building_deductible_over_threshold: =min_building_deductible_over_threshold}
    formula:
      min_building_deductible: min_building_deductible_up_to_threshold if building_coverage <= deductible_limit_threshold else min_building_deductible_over_threshold
      building_limit_ok: building_coverage <= max_building_coverage
      contents_limit_ok: contents_coverage <= max_contents_coverage
  - id: dwelling_waiting_period
    subject: [dwelling_policy_issued, dwelling_policy_effective, dwelling_endorsement_issued, dwelling_policy_assigned]
    rule: >-
      New business and every mid-term coverage increase or deductible decrease take effect at 12:01 a.m. on the
      day that is standard_waiting_days calendar days after the date the signed application (or endorsement
      request) and the full premium are received, counted by adding the days to that receipt date on the calendar,
      and the waiting_period_basis recorded is STANDARD. Two statutory exceptions replace the standard wait, and
      only one basis is recorded per transaction. Loan transaction: the coverage is bought or increased in
      connection with making, increasing, extending or renewing a loan secured by the building. The loan-transaction
      exception applies only when the application and full premium are received no later than the date the loan
      closes; coverage then takes effect at the loan closing date, the waiting_period_basis is LOAN_TRANSACTION and
      loan_closing_date is recorded. Map revision: the building was newly placed in a Special Flood Hazard Area by
      a revision of the Flood Insurance Rate Map. The map-revision exception applies only when the application and
      full premium are received no later than map_revision_window_months calendar months after the map revision that placed the building in a
      Special Flood Hazard Area takes effect; coverage then takes effect at 12:01 a.m. on the day after receipt
      (map_revision_waiting_days), the waiting_period_basis is MAP_REVISION and map_revision_date is recorded. The
      window is counted by adding calendar months to the map revision effective date, falling back to the
      last day of the month when that day does not exist, and a receipt on the last day of the window qualifies.
      When both exceptions could apply, the one giving the earlier effective date is recorded. An assignment of an
      in-force policy to the buyer of the building carries no waiting period (assignment_waiting_days) and the
      basis is ASSIGNMENT. Coverage decreases and deductible increases are never effective mid-term; they are
      accepted only effective on a renewal date. A loss that begins before the effective date of the coverage, or
      of an increase, is not covered by that coverage or increase.
    eligibility:
      - id: loan_exception_received_by_closing
        applies_to: [dwelling_policy_issued, dwelling_endorsement_issued]
        kind: time
        condition: The loan-transaction exception applies only when the application and full premium are received no later than the date the loan closes; coverage then takes effect at the loan closing date, the waiting_period_basis is LOAN_TRANSACTION and loan_closing_date is recorded.
        evidence_fields: [dwelling_policies.loan_closing_date, dwelling_policies.application_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.loan_closing_date]
          action_bindings:
            dwelling_policies.loan_closing_date: loan_closing_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the loan closes
          anchor_source: dwelling_policies.loan_closing_date
          relation: not_after
          duration_source: variants.loan_transaction_waiting_days
          unit: calendar_days
          counting_rule: counted by adding the days to that receipt date on the calendar
          boundary: inclusive
      - id: map_revision_window
        applies_to: [dwelling_policy_issued, dwelling_endorsement_issued]
        kind: time
        condition: The map-revision exception applies only when the application and full premium are received no later than map_revision_window_months calendar months after the map revision that placed the building in a Special Flood Hazard Area takes effect; coverage then takes effect at 12:01 a.m. on the day after receipt (map_revision_waiting_days), the waiting_period_basis is MAP_REVISION and map_revision_date is recorded.
        evidence_fields: [dwelling_policies.map_revision_date, dwelling_policies.flood_zone]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.map_revision_date]
          action_bindings:
            dwelling_policies.map_revision_date: map_revision_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the map revision that placed the building in a Special Flood Hazard Area takes effect
          anchor_source: dwelling_policies.map_revision_date
          relation: not_after
          duration_source: variants.map_revision_window_months
          unit: calendar_months
          counting_rule: The window is counted by adding calendar months to the map revision effective date, falling back to the last day of the month when that day does not exist, and a receipt on the last day of the window qualifies.
          boundary: inclusive
  - id: dwelling_premium_components
    subject: [dwelling_premium_charged, dwelling_policy_issued, dwelling_term_renewed, dwelling_grace_renewed]
    rule: >-
      Every term's premium is booked as separate components. RISK_PREMIUM is the rated_risk_premium and
      ICC_PREMIUM is the rated_icc_premium that the Risk Rating 2.0 rating engine returned for the term, and
      FEDERAL_POLICY_FEE is the rated_federal_policy_fee it returned; the desk never recalculates these three.
      RESERVE_FUND_ASSESSMENT is reserve_fund_assessment_pct of the sum of the risk premium and ICC premium, rounded
      to the cent. HFIAA_SURCHARGE is hfiaa_surcharge_primary_residence when the tier's
      hfiaa_primary_residence_eligible is true and the policy is designated a primary residence, and
      hfiaa_surcharge_other in every other case. PROBATION_SURCHARGE is booked only when community_probation is
      true, at probation_surcharge per term. The HFIAA surcharge, the Federal Policy Fee and the probation surcharge
      are booked once per term at new business or renewal and never on an endorsement. A component of zero is not
      booked. The total term premium is the sum of the booked components and is shown to the customer as one
      amount due.
    eligibility: []
    params:
      per_tier:
        NFIP Dwelling Form – Tenant Contents: {hfiaa_primary_residence_eligible: =hfiaa_primary_residence_eligible}
        NFIP Dwelling Form – Residential Condominium Unit: {hfiaa_primary_residence_eligible: =hfiaa_primary_residence_eligible}
        NFIP Dwelling Form – Manufactured Home: {hfiaa_primary_residence_eligible: =hfiaa_primary_residence_eligible}
        NFIP Dwelling Form – Secondary Single-Family Home: {hfiaa_primary_residence_eligible: =hfiaa_primary_residence_eligible}
        NFIP Dwelling Form – Primary Single-Family Home: {hfiaa_primary_residence_eligible: =hfiaa_primary_residence_eligible}
        NFIP Dwelling Form – Two-to-Four Unit Building: {hfiaa_primary_residence_eligible: =hfiaa_primary_residence_eligible}
    formula:
      reserve_fund_assessment: round((rated_risk_premium + rated_icc_premium) * reserve_fund_assessment_pct / 100, 2)
      hfiaa_surcharge: hfiaa_surcharge_primary_residence if (hfiaa_primary_residence_eligible and primary_residence) else hfiaa_surcharge_other
      probation: probation_surcharge if community_probation else 0
      total_term_premium: rated_risk_premium + rated_icc_premium + reserve_fund_assessment + hfiaa_surcharge + rated_federal_policy_fee + probation
  - id: dwelling_payment_application
    subject: [dwelling_premium_payment, dwelling_refund_disbursed]
    rule: >-
      NFIP premium is payable in full for the term: full_premium_with_application is true and no installment plan
      exists. A payment is accepted only by one of the accepted_payment_methods and is applied to the policy and
      term named on the payment; it is never moved to another policy of the same customer. When a lender pays from
      escrow the payment_method is ESCROW_DISBURSEMENT and the policy's premium_payor is LENDER_ESCROW. When the
      amount received at application is less than the total term premium, Tidemark sends an underpayment notice
      and the policyholder has underpayment_cure_days calendar days from the notice to pay the difference; if the
      difference is not received, the limits are reduced to the amounts the premium received will buy and the
      difference is not pursued. When the amount received exceeds the total due, the excess is refunded to the
      payor in the same way as a cancellation refund. A dishonored payment is reversed and, when it was the
      application premium, the policy is nullified under PREMIUM_PAYMENT_DISHONORED. Every refund is paid to the
      payor of record: payee LENDER_ESCROW when premium_payor is LENDER_ESCROW, and payee INSURED otherwise.
    eligibility: []
    params:
      refund_payee_by_payor: {INSURED: INSURED, LENDER_ESCROW: LENDER_ESCROW}
  - id: dwelling_endorsement_premium
    subject: [dwelling_endorsement_issued, dwelling_premium_charged, dwelling_coverage_updated]
    rule: >-
      A mid-term endorsement is recorded as one of COVERAGE_INCREASE, DEDUCTIBLE_DECREASE, MORTGAGEE_CHANGE,
      COVERAGE_DECREASE_AT_RENEWAL or DEDUCTIBLE_INCREASE_AT_RENEWAL. An endorsement is processed only on a policy
      whose status is pending_effective or in_force. For a COVERAGE_INCREASE or DEDUCTIBLE_DECREASE the rating
      engine returns the full-term risk premium and ICC premium for the policy as endorsed, and the additional
      premium is booked as ENDORSEMENT components: the RISK_PREMIUM component is the increase in the full-term risk
      premium and the ICC_PREMIUM component is the increase in the full-term ICC premium, each multiplied by the
      days from the endorsement effective date to term_end divided by the days from term_start to term_end and
      rounded to the cent, and the RESERVE_FUND_ASSESSMENT component is reserve_fund_assessment_pct of those two
      pro rata amounts, rounded to the cent. The endorsement effective date follows the waiting-period rule. A
      MORTGAGEE_CHANGE takes effect on the date it is recorded and carries no premium. A
      COVERAGE_DECREASE_AT_RENEWAL or DEDUCTIBLE_INCREASE_AT_RENEWAL takes effect on the next term_start and
      changes premium only through the renewal booking; no mid-term credit is given for it.
    eligibility:
      - id: endorsable_status
        applies_to: [dwelling_endorsement_issued]
        kind: state
        condition: An endorsement is processed only on a policy whose status is pending_effective or in_force.
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.dwelling_policy_id]
          action_bindings:
            dwelling_policies.dwelling_policy_id: dwelling_policy_id
        state_contract:
          field: dwelling_policies.status
          allowed: [pending_effective, in_force]
    formula:
      days_remaining: term_end - change_effective_date
      term_days: term_end - term_start
      risk_component: round((rerated_risk_premium - rated_risk_premium) * days_remaining / term_days, 2)
      icc_component: round((rerated_icc_premium - rated_icc_premium) * days_remaining / term_days, 2)
      rfa_component: round((risk_component + icc_component) * reserve_fund_assessment_pct / 100, 2)
  - id: dwelling_ec_rating
    subject: [dwelling_ec_received, dwelling_rating_updated, dwelling_premium_credit]
    rule: >-
      Under Risk Rating 2.0 an Elevation Certificate is optional (ec_required_for_rating is false); the rating
      engine otherwise uses its own estimated first floor height. A certificate is accepted only on FEMA Form
      086-0-33, completed and sealed by a licensed land surveyor, engineer or architect, for the building as it
      currently stands. When ec_first_floor_height_used is true, the first floor height certified on an accepted
      certificate is submitted to the rating engine and the engine returns the full-term risk premium and ICC
      premium with that height. The certificate is applied (ec_applied true) only when the re-rated full-term
      risk premium plus ICC premium is lower than the rated figures on the policy; otherwise it is kept on file
      with ec_applied false and the rating is not changed. A certificate is applied only on a policy whose status
      is pending_effective or in_force. An applied certificate takes effect on the date it is received, and the
      reduction is credited as RERATE components: the RISK_PREMIUM credit is the fall in the full-term risk premium
      and the ICC_PREMIUM credit is the fall in the full-term ICC premium, each multiplied by the days from the
      receipt date to term_end divided by the days from term_start to term_end and rounded to the cent, and the
      RESERVE_FUND_ASSESSMENT credit is reserve_fund_assessment_pct of those two pro rata credits, rounded to the
      cent. The HFIAA surcharge and the Federal Policy Fee are not affected. The credit is refunded to the payor of
      record. From the next renewal the re-rated premium is the prior-term figure the annual cap is measured from.
    eligibility:
      - id: ec_applicable_status
        applies_to: [dwelling_rating_updated]
        kind: state
        condition: A certificate is applied only on a policy whose status is pending_effective or in_force.
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.dwelling_policy_id]
          action_bindings:
            dwelling_policies.dwelling_policy_id: dwelling_policy_id
        state_contract:
          field: dwelling_policies.status
          allowed: [pending_effective, in_force]
    formula:
      ec_applied: (rerated_risk_premium + rerated_icc_premium) < (rated_risk_premium + rated_icc_premium)
      days_remaining: term_end - change_effective_date
      term_days: term_end - term_start
      risk_credit: round((rated_risk_premium - rerated_risk_premium) * days_remaining / term_days, 2)
      icc_credit: round((rated_icc_premium - rerated_icc_premium) * days_remaining / term_days, 2)
      rfa_credit: round((risk_credit + icc_credit) * reserve_fund_assessment_pct / 100, 2)
  - id: dwelling_renewal
    subject: [dwelling_renewal_offered, dwelling_term_renewed, dwelling_grace_entered, dwelling_grace_renewed, dwelling_policy_lapsed]
    rule: >-
      Tidemark issues the renewal bill renewal_notice_days calendar days before term_end, and also sends it to the
      mortgagee of record when the policy is mortgage-required and renewal_bill_copy_to_mortgagee is true. The
      renewal bill carries the rating engine's indicated full-risk premium for the coming term. The risk premium
      booked for the renewed term is the lower of that indicated premium and the prior term's rated_risk_premium
      increased by annual_risk_premium_increase_cap_pct, rounded to the cent; the ICC premium and Federal Policy
      Fee are the engine's figures for the coming term, and the Reserve Fund Assessment, HFIAA surcharge and any
      probation surcharge are booked as for new business. When the full renewal premium is received on or before
      term_end the term is renewed on the same policy number with no break. When it is not, the policy enters
      renewal_grace at term_end. A grace-period renewal is booked only when the full renewal premium is received
      no later than renewal_grace_days calendar days after the policy term expires, counted by adding the days
      to term_end on the calendar, a receipt on the last grace day qualifying; the renewed term then starts on the
      prior term_end with no break in coverage. A loss that occurs during the grace period is covered only if the
      renewal premium is received inside the grace period. When the grace period ends unpaid the policy lapses
      with coverage ended at term_end; a payment received after that cannot renew the policy and is refunded, and
      coverage requires a new application subject to the waiting-period rule. A grace-period renewal is booked
      only on a policy whose status is renewal_grace, and leaves it in_force.
    eligibility:
      - id: grace_payment_window
        applies_to: [dwelling_grace_renewed]
        kind: time
        condition: A grace-period renewal is booked only when the full renewal premium is received no later than renewal_grace_days calendar days after the policy term expires, counted by adding the days to term_end on the calendar, a receipt on the last grace day qualifying; the renewed term then starts on the prior term_end with no break in coverage.
        evidence_fields: [dwelling_policies.term_end, dwelling_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.term_end]
          action_bindings:
            dwelling_policies.term_end: term_end
        temporal_basis:
          clock: frozen_time
          anchor_event: the policy term expires
          anchor_source: dwelling_policies.term_end
          relation: not_after
          duration_source: variants.renewal_grace_days
          unit: calendar_days
          counting_rule: counted by adding the days to term_end on the calendar, a receipt on the last grace day qualifying
          boundary: inclusive
      - id: grace_status
        applies_to: [dwelling_grace_renewed]
        kind: state
        condition: A grace-period renewal is booked only on a policy whose status is renewal_grace, and leaves it in_force.
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.dwelling_policy_id]
          action_bindings:
            dwelling_policies.dwelling_policy_id: dwelling_policy_id
        state_contract:
          field: dwelling_policies.status
          allowed: [renewal_grace, in_force]
    formula:
      capped_risk_premium: min(indicated_risk_premium, round(rated_risk_premium * (1 + annual_risk_premium_increase_cap_pct / 100), 2))
  - id: dwelling_cancellation_refund
    subject: [dwelling_policy_cancelled, dwelling_premium_credit, dwelling_refund_disbursed]
    rule: >-
      A cancellation is processed only on the named insured's signed cancellation request on file for the policy.
      The policy status must be pending_effective or in_force when the cancellation is processed, and it is
      cancelled once processed. Each reason carries its own documentation and effective date. BUILDING_SOLD needs the
      closing disclosure or settlement statement and takes effect on the title transfer date; BUILDING_REMOVED_OR_DEMOLISHED
      needs evidence of removal and takes effect on the removal date; CONTENTS_SOLD_OR_REMOVED (contents-only
      policies) takes effect on the date the contents left the premises; DUPLICATE_NFIP_POLICY needs the other
      policy's declarations and takes effect on the original_effective_date of the later-dated policy, which is
      the one cancelled; CLOSING_DID_NOT_OCCUR needs the lender's statement that the loan did not close and takes
      effect on the original_effective_date; REMOVED_FROM_SFHA_BY_LOMA_LOMR needs the FEMA Letter of Map Amendment
      or Revision and takes effect on the current term_start; MORTGAGE_PAID_OFF needs the payoff letter,
      VOLUNTARY_NOT_REQUIRED needs no document, and REPLACED_BY_PRIVATE_FLOOD needs the private policy's
      declarations; for these three the effective date may not be earlier than voluntary_backdate_days before the
      date the signed request is received, and for REPLACED_BY_PRIVATE_FLOOD it is the private policy's effective
      date when that is later. A cancellation for MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED, REPLACED_BY_PRIVATE_FLOOD
      or REMOVED_FROM_SFHA_BY_LOMA_LOMR on a mortgage-required policy needs the lender's written release on file.
      The refund method follows the reason: FULL_FROM_INCEPTION returns every component booked on the policy,
      fees included; CURRENT_TERM_FULL returns the current term's risk premium, ICC premium, Reserve Fund
      Assessment and HFIAA surcharge in full; PRO_RATA returns the same four components of the current term
      multiplied by the days from the cancellation effective date to term_end divided by the days from term_start
      to term_end. Each component is rounded half-up to refund_rounding_increment before the components are added.
      Under CURRENT_TERM_FULL and PRO_RATA the Federal Policy Fee and probation surcharge are fully earned
      (fees_refundable_on_pro_rata is false). No refund at all is due for the current term under the reasons in
      claim_bar_reasons when a claim with a date of loss in the current term has been paid
      (dwelling_msr_term_claims_paid above zero) or is still open (dwelling_msr_term_claims_open above zero); the
      cancellation still proceeds. Each refunded component is booked as a CANCELLATION credit referencing the
      cancellation request, and the total is refunded to the payor of record. When the policy is mortgage-required,
      the mortgagee of record is notified of the cancellation.
    eligibility:
      - id: signed_request_on_file
        applies_to: [dwelling_policy_cancelled]
        kind: authorization
        condition: A cancellation is processed only on the named insured's signed cancellation request on file for the policy.
        evidence_fields: [dwelling_requests.dwelling_request_id, dwelling_requests.outcome, dwelling_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_requests.dwelling_request_id]
          action_bindings:
            dwelling_requests.dwelling_request_id: dwelling_request_id
      - id: cancellable_status
        applies_to: [dwelling_policy_cancelled]
        kind: state
        condition: The policy status must be pending_effective or in_force when the cancellation is processed, and it is cancelled once processed.
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.dwelling_policy_id]
          action_bindings:
            dwelling_policies.dwelling_policy_id: dwelling_policy_id
        state_contract:
          field: dwelling_policies.status
          allowed: [pending_effective, in_force, cancelled]
      - id: lender_release_when_required
        applies_to: [dwelling_policy_cancelled]
        kind: authorization
        condition: A cancellation for MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED, REPLACED_BY_PRIVATE_FLOOD or REMOVED_FROM_SFHA_BY_LOMA_LOMR on a mortgage-required policy needs the lender's written release on file.
        evidence_fields: [dwelling_policies.mortgage_required, dwelling_requests.lender_release_on_file, dwelling_requests.dwelling_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_requests.dwelling_request_id]
          action_bindings:
            dwelling_requests.dwelling_request_id: dwelling_request_id
    params:
      refund_method_by_reason:
        BUILDING_SOLD: PRO_RATA
        BUILDING_REMOVED_OR_DEMOLISHED: PRO_RATA
        CONTENTS_SOLD_OR_REMOVED: PRO_RATA
        DUPLICATE_NFIP_POLICY: FULL_FROM_INCEPTION
        CLOSING_DID_NOT_OCCUR: FULL_FROM_INCEPTION
        REMOVED_FROM_SFHA_BY_LOMA_LOMR: CURRENT_TERM_FULL
        MORTGAGE_PAID_OFF: PRO_RATA
        VOLUNTARY_NOT_REQUIRED: PRO_RATA
        REPLACED_BY_PRIVATE_FLOOD: PRO_RATA
      claim_bar_reasons: [MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED, REPLACED_BY_PRIVATE_FLOOD, REMOVED_FROM_SFHA_BY_LOMA_LOMR]
      refundable_components_partial: [RISK_PREMIUM, ICC_PREMIUM, RESERVE_FUND_ASSESSMENT, HFIAA_SURCHARGE]
    measures: [dwelling_msr_term_claims_paid, dwelling_msr_term_claims_open]
    formula:
      days_unearned: term_end - cancellation_effective_date
      term_days: term_end - term_start
      pro_rata_component_refund: round(amount * days_unearned / term_days, 2)
  - id: dwelling_nullification
    subject: [dwelling_policy_nullified, dwelling_premium_credit]
    rule: >-
      Tidemark nullifies a policy, voiding it from inception as if it had never been issued, for NO_INSURABLE_INTEREST
      (the named insured never had an ownership or tenancy interest in the property), INELIGIBLE_PROPERTY (the
      building is not insurable under the NFIP, such as a building entirely over water or in a non-participating or
      suspended community at issue) or PREMIUM_PAYMENT_DISHONORED (the application premium was dishonored).
      Nullification is decided by Tidemark on its records, never on the customer's request, and is processed only on
      a policy whose status is pending_effective or in_force, which it leaves nullified. The cancellation_effective_date
      is the original_effective_date. Every component collected on the policy, the Federal Policy Fee and probation
      surcharge included, is credited as NULLIFICATION and refunded to the payor of record; under
      PREMIUM_PAYMENT_DISHONORED nothing was collected, so no credit or refund is booked. A claim on a nullified policy
      is not payable.
    eligibility:
      - id: nullifiable_status
        applies_to: [dwelling_policy_nullified]
        kind: state
        condition: Nullification is decided by Tidemark on its records, never on the customer's request, and is processed only on a policy whose status is pending_effective or in_force, which it leaves nullified.
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.dwelling_policy_id]
          action_bindings:
            dwelling_policies.dwelling_policy_id: dwelling_policy_id
        state_contract:
          field: dwelling_policies.status
          allowed: [pending_effective, in_force, nullified]
    params:
      nullification_reasons: [NO_INSURABLE_INTEREST, INELIGIBLE_PROPERTY, PREMIUM_PAYMENT_DISHONORED]
  - id: dwelling_assignment
    subject: [dwelling_policy_assigned]
    rule: >-
      When the insured building is sold, the seller may assign the in-force policy to the buyer instead of
      cancelling it. An assignment is processed only on the seller's signed assignment request on file naming the
      buyer, and only on a policy whose status is in_force. The buyer must already have a customer profile with
      Tidemark, becomes the named insured from the title transfer date, and keeps the policy number, term, limits and
      deductibles; there is no waiting period and no new premium at assignment. The buyer's mortgagee, loan number,
      mortgage requirement, premium payor and primary-residence designation are recorded at assignment. A tenant
      contents policy cannot be assigned. When the buyer's primary-residence designation differs from the seller's,
      the HFIAA surcharge for the current term stays as booked and the buyer's designation applies from the next
      renewal.
    eligibility:
      - id: signed_assignment_on_file
        applies_to: [dwelling_policy_assigned]
        kind: authorization
        condition: An assignment is processed only on the seller's signed assignment request on file naming the buyer, and only on a policy whose status is in_force.
        evidence_fields: [dwelling_requests.dwelling_request_id, dwelling_requests.outcome, dwelling_requests.assignee_customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_requests.dwelling_request_id]
          action_bindings:
            dwelling_requests.dwelling_request_id: dwelling_request_id
      - id: assignable_status
        applies_to: [dwelling_policy_assigned]
        kind: state
        condition: An assignment is processed only on the seller's signed assignment request on file naming the buyer, and only on a policy whose status is in_force.
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_policies.dwelling_policy_id]
          action_bindings:
            dwelling_policies.dwelling_policy_id: dwelling_policy_id
        state_contract:
          field: dwelling_policies.status
          allowed: [in_force]
    params:
      assignable_tiers: [NFIP Dwelling Form – Residential Condominium Unit, NFIP Dwelling Form – Manufactured Home, NFIP Dwelling Form – Secondary Single-Family Home, NFIP Dwelling Form – Primary Single-Family Home, NFIP Dwelling Form – Two-to-Four Unit Building]
  - id: dwelling_mortgagee_rights
    subject: [dwelling_mortgagee_notice, dwelling_coverage_updated]
    rule: >-
      A policy is mortgage-required when a federally regulated lender requires flood coverage as a condition of a
      loan secured by the building in a Special Flood Hazard Area; the first mortgagee and loan number are shown on
      the policy. A MORTGAGEE_CHANGE endorsement replaces the mortgagee of record and the loan number on the date it is
      recorded, and a mortgagee can be removed only with that mortgagee's written release or a payoff letter. When
      a mortgage-required policy is cancelled or is not renewed, Tidemark sends written notice to the mortgagee of
      record on the date the cancellation is processed or the grace period ends; the policy then continues for the
      benefit of the mortgagee only for mortgagee_protection_days calendar days after that notice. Building claim
      payments are issued jointly to the insured and the mortgagee of record when
      mortgagee_named_on_building_payment is true; contents, ICC and loss-avoidance payments go to the insured alone.
    eligibility: []
  - id: dwelling_claim_intake
    subject: [dwelling_claim_reported, dwelling_adjuster_report]
    rule: >-
      A claim is taken for direct physical loss by or from flood — a general and temporary condition of partial or
      complete inundation of two or more acres of normally dry land or of two or more properties, at least one of
      which is the insured's, from overflow of inland or tidal waters, unusual and rapid accumulation or runoff of
      surface waters, mudflow, or collapse of land along a shore caused by erosion or undermining from flood. A
      claim is covered only when the date of loss falls on or after the date the coverage took effect and before the
      policy's cancellation effective date or term_end, a loss in renewal_grace being covered only if the renewal
      premium is then received inside the grace period. The claim number is assigned at first notice, and the
      assigned adjuster contacts the insured within adjuster_contact_hours elapsed hours under Tidemark's servicing
      standard. Every adjuster report records the measured building loss at replacement cost and at actual cash
      value, the contents loss at actual cash value, the part of the contents loss in the special-items class and
      whether the building is a total loss. A FINAL report supersedes earlier reports on the claim, and a
      SUPPLEMENTAL report filed after it supersedes it for the coverages it measures.
    eligibility:
      - id: loss_inside_coverage_period
        applies_to: [dwelling_claim_reported]
        kind: caller_fact
        condition: A claim is covered only when the date of loss falls on or after the date the coverage took effect and before the policy's cancellation effective date or term_end, a loss in renewal_grace being covered only if the renewal premium is then received inside the grace period.
        evidence_fields: [dwelling_claims.date_of_loss, dwelling_policies.original_effective_date, dwelling_policies.term_end, dwelling_policies.cancellation_effective_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [dwelling_claims.date_of_loss]
          action_bindings:
            dwelling_claims.date_of_loss: date_of_loss
  - id: dwelling_proof_of_loss
    subject: [dwelling_proof_of_loss_filed, dwelling_claim_paid]
    rule: >-
      The insured must send a signed and sworn proof of loss for each coverage claimed. A proof of loss is accepted
      only when it is received no later than proof_of_loss_days calendar days after the date of loss, counted by
      adding the days to date_of_loss on the calendar, a receipt on the last day qualifying. Tidemark may accept the
      adjuster's report signed and sworn by the insured in lieu of a proof of loss. A proof of loss received after
      the deadline is not accepted and the coverage is denied as PROOF_OF_LOSS_NOT_TIMELY unless FEMA has issued a
      written extension of the deadline for the event, recorded on the claim. The loss is payable within
      claim_payment_days_after_pol calendar days after an accepted proof of loss, or within
      claim_payment_days_after_adjuster_report calendar days after an adjuster's report signed in lieu of it. A
      payment is never issued for more than the amount sworn on the proof of loss for that coverage.
    eligibility:
      - id: pol_deadline
        applies_to: [dwelling_proof_of_loss_filed]
        kind: time
        condition: A proof of loss is accepted only when it is received no later than proof_of_loss_days calendar days after the date of loss, counted by adding the days to date_of_loss on the calendar, a receipt on the last day qualifying.
        evidence_fields: [dwelling_claims.date_of_loss, dwelling_claims.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dwelling_claims.claim_number]
          action_bindings:
            dwelling_claims.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of loss
          anchor_source: dwelling_claims.date_of_loss
          relation: not_after
          duration_source: variants.proof_of_loss_days
          unit: calendar_days
          counting_rule: counted by adding the days to date_of_loss on the calendar, a receipt on the last day qualifying
          boundary: inclusive
  - id: dwelling_claim_settlement
    subject: [dwelling_claim_paid, dwelling_claim_payment_voided]
    rule: >-
      Each coverage is settled separately from the latest governing adjuster report on the claim, with its own
      deductible. Building losses are settled at replacement cost when the tier's rc_settlement_eligible is true, the
      policy is designated a primary residence and the building limit is at least the lower of
      rc_insurance_to_value_pct of the replacement_cost_value and max_building_coverage; a manufactured home
      designated a primary residence that the adjuster reports as a total loss is settled at the lower of its
      replacement cost loss and special_loss_settlement_acv_multiple times its actual cash value loss; every other
      building loss is settled at actual cash value. The building payable is the settlement basis less the building
      deductible, never below zero, capped at the building limit. Contents are always settled at actual cash value,
      the special-items part of the loss counting only up to contents_special_items_limit; the contents payable is
      that amount less the contents deductible, never below zero, capped at the contents limit. Increased Cost of
      Compliance is paid up to icc_limit without a deductible only on a community's substantial-damage
      determination, and loss-avoidance supplies up to loss_avoidance_limit without a deductible; neither erodes the
      building limit. A new payment on a coverage is the payable amount less what has already been paid net of voids
      on that claim and coverage (dwelling_msr_claim_part_paid), and is issued only when positive. The payee is set by
      the mortgagee rule. A void reverses one issued payment item in full by its payment reference and never
      changes the payable amount; the voided amount is reissued under a new payment reference.
    eligibility: []
    params:
      per_tier:
        NFIP Dwelling Form – Tenant Contents: {rc_settlement_eligible: =rc_settlement_eligible, special_loss_settlement_acv_multiple: =special_loss_settlement_acv_multiple, icc_limit: =icc_limit}
        NFIP Dwelling Form – Residential Condominium Unit: {rc_settlement_eligible: =rc_settlement_eligible, special_loss_settlement_acv_multiple: =special_loss_settlement_acv_multiple, icc_limit: =icc_limit}
        NFIP Dwelling Form – Manufactured Home: {rc_settlement_eligible: =rc_settlement_eligible, special_loss_settlement_acv_multiple: =special_loss_settlement_acv_multiple, icc_limit: =icc_limit}
        NFIP Dwelling Form – Secondary Single-Family Home: {rc_settlement_eligible: =rc_settlement_eligible, special_loss_settlement_acv_multiple: =special_loss_settlement_acv_multiple, icc_limit: =icc_limit}
        NFIP Dwelling Form – Primary Single-Family Home: {rc_settlement_eligible: =rc_settlement_eligible, special_loss_settlement_acv_multiple: =special_loss_settlement_acv_multiple, icc_limit: =icc_limit}
        NFIP Dwelling Form – Two-to-Four Unit Building: {rc_settlement_eligible: =rc_settlement_eligible, special_loss_settlement_acv_multiple: =special_loss_settlement_acv_multiple, icc_limit: =icc_limit}
    measures: [dwelling_msr_claim_part_paid]
    formula:
      rc_qualifies: rc_settlement_eligible and primary_residence and building_coverage >= min(replacement_cost_value * rc_insurance_to_value_pct / 100, max_building_coverage)
      building_basis: building_rcv_loss if rc_qualifies else (min(building_rcv_loss, special_loss_settlement_acv_multiple * building_acv_loss) if (special_loss_settlement_acv_multiple > 0 and primary_residence and total_loss) else building_acv_loss)
      building_payable: min(max(0, building_basis - building_deductible), building_coverage)
      contents_basis: contents_acv_loss - max(0, special_items_loss - contents_special_items_limit)
      contents_payable: min(max(0, contents_basis - contents_deductible), contents_coverage)
      new_payment: building_payable - dwelling_msr_claim_part_paid
  - id: dwelling_claim_denial
    subject: [dwelling_claim_denied]
    rule: >-
      Tidemark denies a coverage on a claim in writing, stating one denial_reason: NOT_A_FLOOD_EVENT when the damage
      did not result from flood as defined; LOSS_DURING_WAITING_PERIOD when the loss began before the coverage or
      increase took effect; NO_COVERAGE_ON_DATE_OF_LOSS when the policy was lapsed, cancelled or nullified on the date
      of loss; PROOF_OF_LOSS_NOT_TIMELY under the proof-of-loss rule; EXCLUDED_PROPERTY when the damaged items are not
      insured property (including basement contents beyond the listed basement items when basement_contents_covered
      is false); LOSS_BELOW_DEDUCTIBLE when the payable amount is zero after the deductible. A partial denial
      covers only the denied coverage and does not stop payment of the others. The denial letter informs the
      insured that an appeal may be filed with FEMA within appeal_window_days calendar days of the denial date and
      that suit must be filed within suit_limitation_months calendar months of the denial date; Tidemark does not
      decide FEMA appeals.
    eligibility: []

# ============================================================================
# extended_policies (nfip_dwelling_servicing)
# ============================================================================
extended_policies:
  - id: dwelling_ext_coverage_increase_charge
    base_policy_refs:
    - dwelling_endorsement_premium
    - dwelling_waiting_period
    - dwelling_ec_rating
    - dwelling_mortgagee_rights
    - dwelling_coverage_limits_deductibles
    - dwelling_premium_components
    overwrite:
    - base_policy: dwelling_endorsement_premium
      superseded_clause: the RISK_PREMIUM component is the increase in the full-term risk premium and the ICC_PREMIUM component is the increase in the full-term ICC premium
      replaced_by: 'For a pending increase of the building limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the increase on the risk premium line is measured as the rise rule of this policy states; a pending increase of the contents limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and every other COVERAGE_INCREASE or DEDUCTIBLE_DECREASE keeps the base measure: the RISK_PREMIUM component is the increase in the full-term risk premium and the ICC_PREMIUM component is the increase in the full-term ICC premium.'
    - base_policy: dwelling_waiting_period
      superseded_clause: New business and every mid-term coverage increase or deductible decrease take effect at 12:01 a.m. on the day that is standard_waiting_days calendar days after the date the signed application (or endorsement request) and the full premium are received
      replaced_by: For a pending increase of the building limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the change takes effect on the date the dating and limit rules of this policy give; a pending increase of the contents limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and new business and every other mid-term coverage increase or deductible decrease take effect at 12:01 a.m. on the day that is standard_waiting_days calendar days after the date the signed application (or endorsement request) and the full premium are received.
    - base_policy: dwelling_waiting_period
      superseded_clause: When both exceptions could apply, the one giving the earlier effective date is recorded.
      replaced_by: 'For a pending increase of the building limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the loan-transaction dating governs whenever it applies and the map-revision dating applies only to a request that neither the loan-transaction dating nor the renewal dating reaches; a pending increase of the contents limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and every other transaction keeps the base rule: When both exceptions could apply, the one giving the earlier effective date is recorded.'
    trigger: state_due
    subject:
    - dwelling_premium_charged
    - dwelling_coverage_updated
    computes: risk_premium_charge
    target_tool: bill_coverage_increase_e35332a0
    params:
      standard_wait_days: 30
      map_revision_wait_days: 1
      loan_wait_days: 0
      map_window_months: 13
      escrow_premium_window_days: 45
      other_premium_window_days: 30
      new_loan_window_days: 60
      same_loan_window_days: 30
      closing_quote_window_days: 60
      late_quote_window_days: 30
      eps: 1.0e-06
    rule: 'For a pending increase of the building limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the increase on the risk premium line is measured as the rise rule of this policy states; a pending increase of the contents limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and every other COVERAGE_INCREASE or DEDUCTIBLE_DECREASE keeps the base measure: the RISK_PREMIUM component is the increase in the full-term risk premium and the ICC_PREMIUM component is the increase in the full-term ICC premium. For a pending increase of the building limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the change takes effect on the date the dating and limit rules of this policy give; a pending increase of the contents limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and new business and every other mid-term coverage increase or deductible decrease take effect at 12:01 a.m. on the day that is standard_waiting_days calendar days after the date the signed application (or endorsement request) and the full premium are received. For a pending increase of the building limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the loan-transaction dating governs whenever it applies and the map-revision dating applies only to a request that neither the loan-transaction dating nor the renewal dating reaches; a pending increase of the contents limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and every other transaction keeps the base rule: When both exceptions could apply, the one giving the earlier effective date is recorded. The building-increase charge on the risk premium is the rise in the full-term risk premium multiplied by the days from the change''s effective date to the term end and divided by the days of the current term, rounded half-up to the cent; a change that would take effect after the term end is not charged on this term. The request billed is the policy''s pending coverage-increase request that leaves the contents limit on the policy unchanged with no effective date recorded yet, the most recently recorded such request is the one billed, and when it records no loan closing date it is not a request this policy bills and nothing is charged under this policy; the days of the current term run from the term start to the term end. The premium counts as received on the date of the latest premium payment on the policy when that payment was received on or after the request date, and the receipt date is the later of the request date and that payment date. The standard dating is 30 days after the receipt date, and the standard rise is the request''s full-term risk premium less the rated risk premium on the policy. The effective date is the latest of the dates the dating and limit rules of this policy give. The anchor rule gives the date the waiting period runs from: when the request records a loan closing date and the premium was received no later than that date, the anchor is the loan closing date; when the change was requested with the coming term''s renewal premium, the anchor is the coming term start; otherwise the anchor is the receipt date. The waiting days are 0 when the request records a loan closing date and the premium was received no later than that date, or when
      the change was requested with the coming term''s renewal premium; 1 when the policy''s recorded map revision placed the building in a Special Flood Hazard Area and the receipt date falls no later than 13 calendar months after that revision, counted by adding calendar months to the revision date with a receipt on the last day qualifying; and 30 otherwise. The premium window is measured from the request date to the payment date and is 45 days when the payment came from a lender''s escrow account, 30 days when it came by any other method, and no days when no payment was received; when the premium was not received within the window, the change may take effect no earlier than the standard dating. The transaction window is measured from the request date to the loan closing date and is 60 days when the request records a loan number other than the one on the policy, because the loan is being made or refinanced, 30 days when it records the loan number on the policy, because that loan is being increased, extended or renewed, and no days when it records no loan number; when the loan closing does not fall within the window, the change may take effect no earlier than the standard dating. The quote window is measured from the request date to the receipt date and is 60 days when the request records a loan closing date and the premium was received no later than that date, 30 days when it records a loan closing date and the premium came after it, and no days otherwise; when the receipt date falls outside the window, the change may take effect no earlier than the standard dating. The rise rule: when the request carries no full-term risk premium from the rating engine, there is no rise; otherwise, when a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded, the rise is the request''s full-term risk premium less the risk premium booked for the term at its start, because both figures stand on the rating basis the request was rated on; otherwise the rise is the request''s full-term risk premium less the rated risk premium on the policy. The change takes effect on the latest of the dates the dating and limit rules give, the policy takes the limits and deductibles on the request, and the rated risk premium on the policy is raised by the rise. The reserve fund charge is booked with the same request and is the reserve fund assessment percentage of the risk premium charge, rounded half-up to the cent. A request on a tier that carries ICC coverage is not handled by this schedule: it is referred to the underwriting desk and nothing is charged under this policy.'
    prerequisite: []
    cross_category: []
    compute:
    - request_date: LATEST('dwelling_changes', 'recorded_date', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', change_effective_date='', new_contents_coverage=F('contents_coverage'))
    - request_figure: LATEST('dwelling_changes', 'rerated_risk_premium', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', change_effective_date='', new_contents_coverage=F('contents_coverage'))
    - request_closing: LATEST('dwelling_changes', 'loan_closing_date', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', change_effective_date='', new_contents_coverage=F('contents_coverage'))
    - term_days: DAYS(F('term_start'), F('term_end'))
    - latest_payment: LATEST('dwelling_billing', 'posted_date', date_field='posted_date', event_type='dwelling_premium_payment')
    - premium_date: latest_payment if (latest_payment != None and request_date != None and latest_payment >= request_date) else None
    - receipt_date: premium_date if (premium_date != None and premium_date > request_date) else request_date
    - has_closing: request_closing != None and request_closing != '' and premium_date != None and premium_date <= request_closing
    - with_renewal: LATEST('dwelling_billing', 'posted_date', date_field='posted_date', event_type='dwelling_premium_payment', term_start=F('term_end')) != None and LATEST('dwelling_billing', 'posted_date', date_field='posted_date', event_type='dwelling_premium_payment', term_start=F('term_end')) >= request_date
    - anchor_days: DAYS(request_closing, F('term_end')) if has_closing else (DAYS(F('term_end'), F('term_end')) if with_renewal else DAYS(receipt_date, F('term_end')))
    - map_ok: F('map_revision_date') != None and F('map_revision_date') != '' and receipt_date >= F('map_revision_date') and MONTHS(receipt_date, F('map_revision_date')) >= 0 - K('map_window_months')
    - wait_days: K('loan_wait_days') if (has_closing or with_renewal) else (K('map_revision_wait_days') if map_ok else K('standard_wait_days'))
    - dated_days: MX(0, anchor_days - wait_days)
    - standard_days: MX(0, DAYS(receipt_date, F('term_end')) - K('standard_wait_days'))
    - latest_method: LATEST('dwelling_billing', 'payment_method', date_field='posted_date', event_type='dwelling_premium_payment')
    - premium_window: K('escrow_premium_window_days') if (premium_date != None and latest_method == 'ESCROW_DISBURSEMENT') else (K('other_premium_window_days') if premium_date != None else 0)
    - premium_limit: term_days if (premium_date != None and DAYS(request_date, premium_date) <= premium_window) else standard_days
    - request_loan: LATEST('dwelling_changes', 'new_loan_number', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', change_effective_date='', new_contents_coverage=F('contents_coverage'))
    - transaction_window: K('new_loan_window_days') if (request_loan != None and request_loan != '' and request_loan != F('loan_number')) else (K('same_loan_window_days') if (request_loan != None and request_loan != '') else 0)
    - transaction_limit: term_days if (request_closing != None and request_closing != '' and DAYS(request_date, request_closing) <= transaction_window) else standard_days
    - quote_window: K('closing_quote_window_days') if (LATEST('dwelling_changes', 'loan_closing_date', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', change_effective_date='', new_contents_coverage=F('contents_coverage')) != '' and has_closing) else (K('late_quote_window_days') if (request_closing != None and request_closing != '') else 0)
    - quote_limit: term_days if (request_date != None and DAYS(request_date, receipt_date) <= quote_window) else standard_days
    - rerate_after_request: LATEST('dwelling_billing', 'posted_date', date_field='posted_date', event_type='dwelling_premium_credit', charge_basis='RERATE', component='RISK_PREMIUM', term_start=F('term_start'))
    - booked_risk: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='RENEWAL', term_start=F('term_start')) + SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='NEW_BUSINESS', term_start=F('term_start'))
    - rise: 0 if (request_figure == None or request_figure <= 0) else (((request_figure - booked_risk) if (rerate_after_request != None and rerate_after_request > request_date) else (request_figure - F('rated_risk_premium'))))
    - charged_days: MN(dated_days, premium_limit, transaction_limit, quote_limit)
    - result: (RND(rise * charged_days / term_days + K('eps'), 2) if (request_closing != None and request_closing != '') else 0) if P('icc_available') == False else 0
    compute_basis:
      request_date: The request billed is the policy's pending coverage-increase request that leaves the contents limit on the policy unchanged with no effective date recorded yet, the most recently recorded such request is the one billed, and when it records no loan closing date it is not a request this policy bills and nothing is charged under this policy
      request_figure: the standard rise is the request's full-term risk premium less the rated risk premium on the policy
      request_closing: when the request records a loan closing date and the premium was received no later than that date
      term_days: the days of the current term run from the term start to the term end
      latest_payment: The premium counts as received on the date of the latest premium payment on the policy when that payment was received on or after the request date, and the receipt date is the later of the request date and that payment date.
      premium_date: The premium counts as received on the date of the latest premium payment on the policy when that payment was received on or after the request date, and the receipt date is the later of the request date and that payment date.
      receipt_date: the receipt date is the later of the request date and that payment date
      has_closing: when the request records a loan closing date and the premium was received no later than that date
      with_renewal: when the change was requested with the coming term's renewal premium
      anchor_days: 'The anchor rule gives the date the waiting period runs from: when the request records a loan closing date and the premium was received no later than that date, the anchor is the loan closing date; when the change was requested with the coming term''s renewal premium, the anchor is the coming term start; otherwise the anchor is the receipt date.'
      map_ok: 1 when the policy's recorded map revision placed the building in a Special Flood Hazard Area and the receipt date falls no later than 13 calendar months after that revision, counted by adding calendar months to the revision date with a receipt on the last day qualifying
      wait_days: The waiting days are 0 when the request records a loan closing date and the premium was received no later than that date, or when the change was requested with the coming term's renewal premium; 1 when the policy's recorded map revision placed the building in a Special Flood Hazard Area and the receipt date falls no later than 13 calendar months after that revision, counted by adding calendar months to the revision date with a receipt on the last day qualifying; and 30 otherwise.
      latest_method: 45 days when the payment came from a lender's escrow account, 30 days when it came by any other method
      premium_window: The premium window is measured from the request date to the payment date and is 45 days when the payment came from a lender's escrow account, 30 days when it came by any other method, and no days when no payment was received; when the premium was not received within the window, the change may take effect no earlier than the standard dating.
      request_loan: 60 days when the request records a loan number other than the one on the policy
      transaction_window: The transaction window is measured from the request date to the loan closing date and is 60 days when the request records a loan number other than the one on the policy, because the loan is being made or refinanced, 30 days when it records the loan number on the policy, because that loan is being increased, extended or renewed, and no days when it records no loan number; when the loan closing does not fall within the window, the change may take effect no earlier than the standard dating.
      quote_window: The quote window is measured from the request date to the receipt date and is 60 days when the request records a loan closing date and the premium was received no later than that date, 30 days when it records a loan closing date and the premium came after it, and no days otherwise; when the receipt date falls outside the window, the change may take effect no earlier than the standard dating.
      dated_days: The effective date is the latest of the dates the dating and limit rules of this policy give.
      rerate_after_request: when a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded
      booked_risk: the rise is the request's full-term risk premium less the risk premium booked for the term at its start
      rise: 'The rise rule: when the request carries no full-term risk premium from the rating engine, there is no rise; otherwise, when a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded, the rise is the request''s full-term risk premium less the risk premium booked for the term at its start, because both figures stand on the rating basis the request was rated on; otherwise the rise is the request''s full-term risk premium less the rated risk premium on the policy.'
      charged_days: The effective date is the latest of the dates the dating and limit rules of this policy give.
      result: The building-increase charge on the risk premium is the rise in the full-term risk premium multiplied by the days from the change's effective date to the term end and divided by the days of the current term, rounded half-up to the cent; a change that would take effect after the term end is not charged on this term.
      standard_days: The standard dating is 30 days after the receipt date
      premium_limit: when the premium was not received within the window, the change may take effect no earlier than the standard dating
      transaction_limit: when the loan closing does not fall within the window, the change may take effect no earlier than the standard dating
      quote_limit: when the receipt date falls outside the window, the change may take effect no earlier than the standard dating
    factors:
    - id: building_anchor
      effect: method
      decides: anchor_days
      bindings:
      - anchor_days
      ladder:
      - when: the request records a loan closing date and the premium was received no later than that date
        method: date the change from the loan closing date
      - when: the change was requested with the coming term's renewal premium
        method: date the change from the coming term start
      - when: otherwise
        method: date the change from the receipt date
      baseline:
        anchor_days: DAYS(receipt_date, F('term_end'))
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: building_wait
      effect: parameter
      decides: wait_days
      bindings:
      - map_ok
      - wait_days
      ladder:
      - when: the loan-transaction exception holds or the change was requested with the coming term's renewal premium
        value: K('loan_wait_days') (0 days)
      - when: the recorded map revision placed the building in a Special Flood Hazard Area no more than 13 calendar months before the receipt date
        value: K('map_revision_wait_days') (1 day)
      - when: otherwise
        value: K('standard_wait_days') (30 days)
      baseline:
        wait_days: K('standard_wait_days')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: building_premium_window
      effect: parameter
      decides: premium_window
      bindings:
      - latest_method
      - premium_window
      - premium_limit
      ladder:
      - when: the payment came from a lender's escrow account
        value: K('escrow_premium_window_days') (45 days)
      - when: it came by any other method
        value: K('other_premium_window_days') (30 days)
      - when: otherwise (no payment received)
        value: 0 days
      baseline:
        premium_window: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: building_transaction_window
      effect: parameter
      decides: transaction_window
      bindings:
      - request_loan
      - transaction_window
      - transaction_limit
      ladder:
      - when: the request records a loan number other than the one on the policy (a loan made or refinanced)
        value: K('new_loan_window_days') (60 days)
      - when: it records the loan number on the policy (that loan increased, extended or renewed)
        value: K('same_loan_window_days') (30 days)
      - when: otherwise (no loan number on the request)
        value: 0 days
      baseline:
        transaction_window: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: building_quote_window
      effect: parameter
      decides: quote_window
      bindings:
      - quote_window
      - quote_limit
      ladder:
      - when: the request records a loan closing date and the premium was received no later than that date
        value: K('closing_quote_window_days') (60 days)
      - when: it records a loan closing date and the premium came after it
        value: K('late_quote_window_days') (30 days)
      - when: otherwise
        value: 0 days
      baseline:
        quote_window: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: building_rise
      effect: method
      decides: rise
      bindings:
      - rerate_after_request
      - booked_risk
      - rise
      ladder:
      - when: the request carries no full-term risk premium from the rating engine
        method: no rise
      - when: a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded
        method: the request's full-term risk premium less the risk premium booked for the term at its start
      - when: otherwise
        method: the request's full-term risk premium less the rated risk premium on the policy
      baseline:
        rise: (request_figure - F('rated_risk_premium'))
      evidence:
      - history
      cross_difficulty: null
    baseline:
