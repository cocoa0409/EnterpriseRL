    - map_ok: F('map_revision_date') != None and F('map_revision_date') != '' and receipt_date >= F('map_revision_date') and MONTHS(receipt_date, F('map_revision_date')) >= 0 - K('map_window_months')
    - wait_days: K('loan_wait_days') if (has_closing or with_renewal) else (K('map_revision_wait_days') if map_ok else K('standard_wait_days'))
    - dated_days: MX(0, anchor_days - wait_days)
    - standard_days: MX(0, DAYS(receipt_date, F('term_end')) - K('standard_wait_days'))
    - latest_method: LATEST('dwelling_billing', 'payment_method', date_field='posted_date', event_type='dwelling_premium_payment')
    - premium_window: K('escrow_premium_window_days') if (premium_date != None and latest_method == 'ESCROW_DISBURSEMENT') else (K('other_premium_window_days') if premium_date != None else 0)
    - premium_limit: term_days if (premium_date != None and DAYS(request_date, premium_date) <= premium_window) else standard_days
    - request_loan: LATEST('dwelling_changes', 'new_loan_number', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', change_effective_date='', new_building_coverage=F('building_coverage'))
    - transaction_window: K('new_loan_window_days') if (request_loan != None and request_loan != '' and request_loan != F('loan_number')) else (K('same_loan_window_days') if (request_loan != None and request_loan != '') else 0)
    - transaction_limit: term_days if (request_closing != None and request_closing != '' and DAYS(request_date, request_closing) <= transaction_window) else standard_days
    - quote_window: K('closing_quote_window_days') if (LATEST('dwelling_changes', 'loan_closing_date', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', change_effective_date='', new_building_coverage=F('building_coverage')) != '' and has_closing) else (K('late_quote_window_days') if (request_closing != None and request_closing != '') else 0)
    - quote_limit: term_days if (request_date != None and DAYS(request_date, receipt_date) <= quote_window) else standard_days
    - prior_id: LATEST('dwelling_changes', 'dwelling_change_id', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', loan_closing_date=request_closing, new_contents_coverage=F('contents_coverage'))
    - prior_billed: COUNT('dwelling_billing', event_type='dwelling_premium_charged', charge_basis='ENDORSEMENT', reference_id=prior_id)
    - prior_figure: LATEST('dwelling_changes', 'rerated_risk_premium', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE', loan_closing_date=request_closing, new_contents_coverage=F('contents_coverage'))
    - rerate_after_request: LATEST('dwelling_billing', 'posted_date', date_field='posted_date', event_type='dwelling_premium_credit', charge_basis='RERATE', component='RISK_PREMIUM', term_start=F('term_start'))
    - booked_risk: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='RENEWAL', term_start=F('term_start')) + SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='NEW_BUSINESS', term_start=F('term_start'))
    - rise: 0 if (request_figure == None or request_figure <= 0) else ((request_figure - prior_figure) if prior_billed >= 1 else ((request_figure - booked_risk) if (rerate_after_request != None and rerate_after_request > request_date) else (request_figure - F('rated_risk_premium'))))
    - charged_days: MN(dated_days, premium_limit, transaction_limit, quote_limit)
    - result: (RND(rise * charged_days / term_days + K('eps'), 2) if (request_closing != None and request_closing != '') else 0) if P('icc_available') == False else 0
    compute_basis:
      request_date: The request billed is the policy's pending coverage-increase request that carries the building limit now on the policy with no effective date recorded yet, the most recently recorded such request is the one billed, and when it records no loan closing date it is not a request this policy bills and nothing is charged under this policy
      request_figure: the standard rise is the request's full-term risk premium less the rated risk premium on the policy
      request_closing: when the request records a loan closing date and the premium was received no later than that date
      term_days: the days of the current term run from the term start to the term end
      latest_payment: The premium counts as received on the date of the latest premium payment on the policy when that payment was received on or after the request date, and the receipt date is the later of the request date and that payment date.
      premium_date: The premium counts as received on the date of the latest premium payment on the policy when that payment was received on or after the request date, and the receipt date is the later of the request date and that payment date.
      receipt_date: the receipt date is the later of the request date and that payment date
      has_closing: when the request records a loan closing date and the premium was received no later than that date
      with_renewal: when the change was requested with the coming term's renewal premium
      anchor_days: 'The anchor rule gives the date the waiting period runs from: when the request records a loan closing date and the premium was received no later than that date, the anchor is the loan closing date; when the change was requested with the coming term''s renewal premium, the anchor is the coming term start; otherwise the anchor is the receipt date.'
      map_ok: 1 when the policy's recorded map revision placed the building in a Special Flood Hazard Area and the receipt date falls no later than 13 calendar months after that revision, counted by adding calendar months to the revision date with a receipt on the last day qualifying
      wait_days: The waiting days are 0 when the request records a loan closing date and the premium was received no later than that date, or when the change was requested with the coming term's renewal premium; 1 when the policy's recorded map revision placed the building in a Special Flood Hazard Area and the receipt date falls no later than 13 calendar months after that revision, counted by adding calendar months to the revision date with a receipt on the last day qualifying; and 30 otherwise.
      latest_method: 45 days when the payment came from a lender's escrow account, 30 days when it came by any other method
      premium_window: The premium window is measured from the request date to the payment date and is 45 days when the payment came from a lender's escrow account, 30 days when it came by any other method, and no days when no payment was received; when the premium was not received within the window, the change may take effect no earlier than the standard dating.
      request_loan: 60 days when the request records a loan number other than the one on the policy
      transaction_window: The transaction window is measured from the request date to the loan closing date and is 60 days when the request records a loan number other than the one on the policy, because the loan is being made or refinanced, 30 days when it records the loan number on the policy, because that loan is being increased, extended or renewed, and no days when it records no loan number; when the loan closing does not fall within the window, the change may take effect no earlier than the standard dating.
      quote_window: The quote window is measured from the request date to the receipt date and is 60 days when the request records a loan closing date and the premium was received no later than that date, 30 days when it records a loan closing date and the premium came after it, and no days otherwise; when the receipt date falls outside the window, the change may take effect no earlier than the standard dating.
      dated_days: The effective date is the latest of the dates the dating and limit rules of this policy give.
      prior_id: when the building-limit increase recorded for the same loan closing, one that leaves the contents limit on the policy unchanged, has been billed
      prior_billed: its endorsement charge being booked on the premium account
      prior_figure: the rise is the request's full-term risk premium less that increase's full-term risk premium, because this request was rated on top of it
      rerate_after_request: when a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded
      booked_risk: the rise is the request's full-term risk premium less the risk premium booked for the term at its start
      rise: 'The rise rule: when the request carries no full-term risk premium from the rating engine, there is no rise; otherwise, when the building-limit increase recorded for the same loan closing, one that leaves the contents limit on the policy unchanged, has been billed, its endorsement charge being booked on the premium account, the rise is the request''s full-term risk premium less that increase''s full-term risk premium, because this request was rated on top of it; otherwise, when a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded, the rise is the request''s full-term risk premium less the risk premium booked for the term at its start, because both figures stand on the rating basis the request was rated on; otherwise the rise is the request''s full-term risk premium less the rated risk premium on the policy.'
      charged_days: The effective date is the latest of the dates the dating and limit rules of this policy give.
      result: The contents-increase charge on the risk premium is the rise in the full-term risk premium multiplied by the days from the change's effective date to the term end and divided by the days of the current term, rounded half-up to the cent; a change that would take effect after the term end is not charged on this term.
      standard_days: The standard dating is 30 days after the receipt date
      premium_limit: when the premium was not received within the window, the change may take effect no earlier than the standard dating
      transaction_limit: when the loan closing does not fall within the window, the change may take effect no earlier than the standard dating
      quote_limit: when the receipt date falls outside the window, the change may take effect no earlier than the standard dating
    factors:
    - id: contents_anchor
      effect: method
      decides: anchor_days
      bindings:
      - anchor_days
      ladder:
      - when: the request records a loan closing date and the premium was received no later than that date
        method: date the change from the loan closing date
      - when: the change was requested with the coming term's renewal premium
        method: date the change from the coming term start
      - when: otherwise
        method: date the change from the receipt date
      baseline:
        anchor_days: DAYS(receipt_date, F('term_end'))
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: contents_wait
      effect: parameter
      decides: wait_days
      bindings:
      - map_ok
      - wait_days
      ladder:
      - when: the loan-transaction exception holds or the change was requested with the coming term's renewal premium
        value: K('loan_wait_days') (0 days)
      - when: the recorded map revision placed the building in a Special Flood Hazard Area no more than 13 calendar months before the receipt date
        value: K('map_revision_wait_days') (1 day)
      - when: otherwise
        value: K('standard_wait_days') (30 days)
      baseline:
        wait_days: K('standard_wait_days')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: contents_premium_window
      effect: parameter
      decides: premium_window
      bindings:
      - latest_method
      - premium_window
      - premium_limit
      ladder:
      - when: the payment came from a lender's escrow account
        value: K('escrow_premium_window_days') (45 days)
      - when: it came by any other method
        value: K('other_premium_window_days') (30 days)
      - when: otherwise (no payment received)
        value: 0 days
      baseline:
        premium_window: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: contents_transaction_window
      effect: parameter
      decides: transaction_window
      bindings:
      - request_loan
      - transaction_window
      - transaction_limit
      ladder:
      - when: the request records a loan number other than the one on the policy (a loan made or refinanced)
        value: K('new_loan_window_days') (60 days)
      - when: it records the loan number on the policy (that loan increased, extended or renewed)
        value: K('same_loan_window_days') (30 days)
      - when: otherwise (no loan number on the request)
        value: 0 days
      baseline:
        transaction_window: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: contents_quote_window
      effect: parameter
      decides: quote_window
      bindings:
      - quote_window
      - quote_limit
      ladder:
      - when: the request records a loan closing date and the premium was received no later than that date
        value: K('closing_quote_window_days') (60 days)
      - when: it records a loan closing date and the premium came after it
        value: K('late_quote_window_days') (30 days)
      - when: otherwise
        value: 0 days
      baseline:
        quote_window: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: contents_rise
      effect: method
      decides: rise
      bindings:
      - prior_id
      - prior_figure
      - prior_billed
      - rerate_after_request
      - booked_risk
      - rise
      ladder:
      - when: the request carries no full-term risk premium from the rating engine
        method: no rise
      - when: the building-limit increase recorded for the same loan closing, one that leaves the contents limit on the policy unchanged has been billed
        method: the request's full-term risk premium less that increase's full-term risk premium
      - when: a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded
        method: the request's full-term risk premium less the risk premium booked for the term at its start
      - when: otherwise
        method: the request's full-term risk premium less the rated risk premium on the policy
      baseline:
        rise: (request_figure - F('rated_risk_premium'))
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: 'For a pending increase of the contents limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the increase on the risk premium line is measured as the rise rule of this policy states; a pending increase of the building limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and every other COVERAGE_INCREASE or DEDUCTIBLE_DECREASE keeps the base measure: the RISK_PREMIUM component is the increase in the full-term risk premium and the ICC_PREMIUM component is the increase in the full-term ICC premium. The standard dating is 30 days after the receipt date, and the standard rise is the request''s full-term risk premium less the rated risk premium on the policy.'
      params: []
    inputs:
      history:
      - table: dwelling_billing
        aggregate: latest
        field: posted_date
        filters:
          event_type: dwelling_premium_payment
      - table: dwelling_changes
        aggregate: latest
        field: rerated_risk_premium
        filters:
          event_type: dwelling_endorsement_issued
      - table: dwelling_billing
        aggregate: sum
        field: amount
        filters:
          event_type: dwelling_premium_charged
          component: RISK_PREMIUM
      cross_category: []
