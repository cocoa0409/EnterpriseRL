    rule: 'For a pending increase of the contents limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the increase on the risk premium line is measured as the rise rule of this policy states; a pending increase of the building limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and every other COVERAGE_INCREASE or DEDUCTIBLE_DECREASE keeps the base measure: the RISK_PREMIUM component is the increase in the full-term risk premium and the ICC_PREMIUM component is the increase in the full-term ICC premium. For a pending increase of the contents limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the change takes effect on the date the dating and limit rules of this policy give; a pending increase of the building limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and new business and every other mid-term coverage increase or deductible decrease take effect at 12:01 a.m. on the day that is standard_waiting_days calendar days after the date the signed application (or endorsement request) and the full premium are received. For a pending increase of the contents limit recorded for a loan transaction on a tier that carries no ICC coverage, and only for such a request, the loan-transaction dating governs whenever it applies and the map-revision dating applies only to a request that neither the loan-transaction dating nor the renewal dating reaches; a pending increase of the building limit recorded for a loan transaction and a pending deductible decrease recorded for a loan transaction follow the rules written for them, a pending coverage increase the insured requested with no loan transaction follows the rules written for such requests, and every other transaction keeps the base rule: When both exceptions could apply, the one giving the earlier effective date is recorded. The contents-increase charge on the risk premium is the rise in the full-term risk premium multiplied by the days from the change''s effective date to the term end and divided by the days of the current term, rounded half-up to the cent; a change that would take effect after the term end is not charged on this term. The request billed is the policy''s pending coverage-increase request that carries the building limit now on the policy with no effective date recorded yet, the most recently recorded such request is the one billed, and when it records no loan closing date it is not a request this policy bills and nothing is charged under this policy; the days of the current term run from the term start to the term end. The contents-increase charge is fixed only after the policy shows the building limit that the same loan transaction raised. The premium counts as received on the date of the latest premium payment on the policy when that payment was received on or after the request date, and the receipt date is the later of the request date and that payment date. The standard dating is 30 days after the receipt date, and the standard rise is the request''s full-term risk premium less the rated risk premium on the policy. The effective date is the latest of the dates the dating and limit rules of this policy give. The anchor rule gives the date the waiting period runs from: when the request records a loan closing date and the premium was received no later than that date, the anchor is the loan closing date; when the change was requested with the coming term''s renewal premium, the anchor is the coming term start; otherwise the anchor is the receipt date. The waiting
      days are 0 when the request records a loan closing date and the premium was received no later than that date, or when the change was requested with the coming term''s renewal premium; 1 when the policy''s recorded map revision placed the building in a Special Flood Hazard Area and the receipt date falls no later than 13 calendar months after that revision, counted by adding calendar months to the revision date with a receipt on the last day qualifying; and 30 otherwise. The premium window is measured from the request date to the payment date and is 45 days when the payment came from a lender''s escrow account, 30 days when it came by any other method, and no days when no payment was received; when the premium was not received within the window, the change may take effect no earlier than the standard dating. The transaction window is measured from the request date to the loan closing date and is 60 days when the request records a loan number other than the one on the policy, because the loan is being made or refinanced, 30 days when it records the loan number on the policy, because that loan is being increased, extended or renewed, and no days when it records no loan number; when the loan closing does not fall within the window, the change may take effect no earlier than the standard dating. The quote window is measured from the request date to the receipt date and is 60 days when the request records a loan closing date and the premium was received no later than that date, 30 days when it records a loan closing date and the premium came after it, and no days otherwise; when the receipt date falls outside the window, the change may take effect no earlier than the standard dating. The rise rule: when the request carries no full-term risk premium from the rating engine, there is no rise; otherwise, when the building-limit increase recorded for the same loan closing, one that leaves the contents limit on the policy unchanged, has been billed, its endorsement charge being booked on the premium account, the rise is the request''s full-term risk premium less that increase''s full-term risk premium, because this request was rated on top of it; otherwise, when a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded, the rise is the request''s full-term risk premium less the risk premium booked for the term at its start, because both figures stand on the rating basis the request was rated on; otherwise the rise is the request''s full-term risk premium less the rated risk premium on the policy. The change takes effect on the latest of the dates the dating and limit rules give, the policy takes the limits and deductibles on the request, and the rated risk premium on the policy is raised by the rise. The reserve fund charge is booked with the same request and is the reserve fund assessment percentage of the risk premium charge, rounded half-up to the cent. A request on a tier that carries ICC coverage is not handled by this schedule: it is referred to the underwriting desk and nothing is charged under this policy.'
