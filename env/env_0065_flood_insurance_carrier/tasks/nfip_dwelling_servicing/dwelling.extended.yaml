    - backdate_window: K('clean_backdate_window_days') if reported_losses == 0 else (K('closed_loss_backdate_window_days') if (reported_losses >= 1 and latest_loss_closed) else 0)
    - backdate_limit: ''''' if (replacing_effective != None and replacing_effective != '''' and DAYS(replacing_effective, NOW) <= backdate_window) else signing_date'
    - lead_window: K('replacement_lead_days') if (replacing_basis == 'NFIP_REPLACEMENT' and replacing_applied != None) else (K('standard_lead_days') if (replacing_basis == 'STANDARD' and replacing_applied != None) else 0)
    - lead_limit: ''''' if (replacing_applied != None and replacing_effective != None and DAYS(replacing_applied, replacing_effective) <= lead_window) else signing_date'
