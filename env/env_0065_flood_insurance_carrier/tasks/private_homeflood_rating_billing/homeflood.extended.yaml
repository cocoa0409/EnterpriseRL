      address on the term start earns package_credit_pct for that term, decided at issue and at each renewal and
      not added or removed mid-term.
    nf_primary: >-
      The occupancy factor of the re-rated term premium follows the customer's NFIP record for the address: it is
      occ_primary when that record shows the home as the insured's primary residence, occ_secondary when it shows
      the home as not the primary residence, and 1 when Tidemark holds no NFIP record for the address.
    occupancy_factor: >-
      The occupancy factor of the re-rated term premium follows the customer's NFIP record for the address: it is
      occ_primary when that record shows the home as the insured's primary residence, occ_secondary when it shows
      the home as not the primary residence, and 1 when Tidemark holds no NFIP record for the address.
    nf_reason: >-
      The NFIP transfer factor of the re-rated term premium recognises a home moved from Tidemark's federal book:
      when the customer's NFIP record for the address was cancelled for REPLACED_BY_PRIVATE_FLOOD after running
      at least transfer_long_months whole months from its original effective date to its cancellation effective
      date, the factor is 1 minus transfer_long_pct percent; when it was so replaced after a shorter run, the factor
      is 1 minus transfer_short_pct percent; otherwise the factor is 1.
    nf_cxl_eff: >-
      The NFIP transfer factor of the re-rated term premium recognises a home moved from Tidemark's federal book:
      when the customer's NFIP record for the address was cancelled for REPLACED_BY_PRIVATE_FLOOD after running
      at least transfer_long_months whole months from its original effective date to its cancellation effective
      date, the factor is 1 minus transfer_long_pct percent; when it was so replaced after a shorter run, the factor
      is 1 minus transfer_short_pct percent; otherwise the factor is 1.
    transfer_factor: >-
      The NFIP transfer factor of the re-rated term premium recognises a home moved from Tidemark's federal book:
      when the customer's NFIP record for the address was cancelled for REPLACED_BY_PRIVATE_FLOOD after running
      at least transfer_long_months whole months from its original effective date to its cancellation effective
      date, the factor is 1 minus transfer_long_pct percent; when it was so replaced after a shorter run, the factor
      is 1 minus transfer_short_pct percent; otherwise the factor is 1.
    credit_pct: >-
      For the re-rated term premium of a certificate review, and only for it, the rate sum is multiplied by every
      factor this rule states and reduced once by every credit this rule states, the credits being added to one
      another, never multiplied, with their sum capped at max_combined_credit_pct; loss_of_use_premium is then added,
      the total is rounded to the cent once at the end, and it never falls below minimum_premium; for every other
      HomeFlood rating the rate sum is multiplied by the zone factor for the property's flood_zone from zone_factor_table,
      by the elevation factor and by the factor for the elected deductible from deductible_factor_table, and the
      total credit percent from the credit rule then reduces the result.
    result: >-
      For the re-rated term premium of a certificate review, and only for it, the rate sum is multiplied by every
      factor this rule states and reduced once by every credit this rule states, the credits being added to one
      another, never multiplied, with their sum capped at max_combined_credit_pct; loss_of_use_premium is then added,
      the total is rounded to the cent once at the end, and it never falls below minimum_premium; for every other
      HomeFlood rating the rate sum is multiplied by the zone factor for the property's flood_zone from zone_factor_table,
      by the elevation factor and by the factor for the elected deductible from deductible_factor_table, and the
      total credit percent from the credit rule then reduces the result. Every rounding to the cent this rule states
      takes the nearest cent, an amount lying exactly halfway between two cents going to the even cent.
  factors:
  - id: elev_survey_age
    effect: method
    decides: elev_factor
    bindings:
    - cert_months
    - elev_factor
    ladder:
    - when: the property is in zone X, B, C or D
      method: the elevation factor is no_ec_factor_non_sfha, whatever certificate is on file
    - when: >-
        the property is in any other zone and the certificate under review shows a base flood elevation and was
        surveyed fewer than fresh_survey_months whole months before Tidemark received it
      method: >-
        the elevation factor is the elevation_factor_table row for the elevation difference as certified
    - when: >-
        the property is in any other zone and the certificate under review shows a base flood elevation and was
        surveyed at least fresh_survey_months but fewer than ec_max_age_years times 12 whole months before Tidemark
        received it
      method: >-
        the elevation factor is the elevation_factor_table row for the elevation difference less one foot
    - when: otherwise
      method: the elevation factor is no_ec_factor_sfha
    baseline:
      elev_factor: P('no_ec_factor_non_sfha') if outside_sfha else P('no_ec_factor_sfha')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: vent_openings
    effect: parameter
    decides: vent_credit
    bindings:
    - vent_flag
    - vent_credit
    ladder:
    - when: >-
        the certificate under review is accepted for rating, certifies engineered flood openings and shows an elevation
        difference of zero or more
      value: K('vent_elevated_pct')
    - when: >-
        the certificate under review is accepted for rating, certifies engineered flood openings and shows a negative
        elevation difference or no base flood elevation
      value: P('mitigation_credit_pct')
    - when: >-
        otherwise (no engineered flood openings certified, or the certificate is not accepted for rating)
      value: '0'
    baseline:
      vent_credit: '0'
    evidence:
    - history
    cross_difficulty: null
