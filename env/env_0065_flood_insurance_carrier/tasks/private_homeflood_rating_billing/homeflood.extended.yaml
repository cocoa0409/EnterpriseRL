        component: TERM_PREMIUM
    - table: homeflood_claims
      aggregate: sum
      field: payment_amount
      within_months: 12
      filters:
        event_type: homeflood_claim_paid
    cross_category: []
- id: homeflood_ext_closing_payment
  base_policy_refs:
  - homeflood_payment_plans
  - homeflood_cancellation_refund
  overwrite:
  - base_policy: homeflood_cancellation_refund
    superseded_clause: >-
      The policy fee and installment fees are fully earned when policy_fee_refundable is false.
    replaced_by: >-
      The overdue-fee waiver of the closing payment gives back the overdue installment's installment_fee in full
      when that installment fell due after the request's effective date, whatever the reason, or when the request
      gives PROPERTY_SOLD with a settlement statement and that installment fell due on or before the request's effective
      date and no more than waiver_window_days days before it; it gives back half of it when the request gives REPLACED_COVERAGE
      with the replacing declarations and that installment fell due on or before the request's effective date and
      no more than waiver_window_days days before it; and it gives back nothing otherwise, including when no installment
      is overdue; for a closing payment under this rule, and only for it, the overdue installment's fee is given
      back as stated here; save it and the policy-fee return of a cancellation credit worked out under the cancellation
      rule, the policy fee and installment fees are fully earned when policy_fee_refundable is false.
  trigger: on_request
  subject:
  - homeflood_premium_payment
  computes: amount
  target_tool: pay_closing_balance_b53536cf
  params:
    later_share_quarterly: 20
    late_pct: 2
    late_long_days: 30
    late_flat: 10
    waiver_window_days: 30
    prompt_fast_pct: 1
    prompt_fast_days: 7
    prompt_slow_pct: 0.5
    prompt_slow_days: 30
    newhome_near: 25
    newhome_near_days: 60
    newhome_far: 10
    newhome_far_days: 180
    record_long: 15
    record_months: 60
    record_short: 5
  rule: >-
    When a cancelled HomeFlood policy still shows an amount owed, the named insured settles it themselves with one
    closing payment, recorded on the term it settles. The closing payment is fixed only after the account carries
    the CANCELLATION credit for the signed cancellation request on file. The request on file is the policy's signed
    cancellation request (the latest received, when more than one is signed; a withdrawn or unsigned request never
    counts), read for its reason, its effective date and its supporting document, and the overdue installment is
    the installment of the latest installment fee booked on the term when no payment with that installment number
    was received for the term; when that latest installment was paid, no installment is overdue. An installment's
    due date is the posted date of its installment fee, which is booked on the day the installment falls due under
    the plan. The payment date is the day the customer makes the closing payment, and every length of time this
    rule counts to the payment date ends on that day. The standard closing payment is the balance the account shows
    — every premium item charged and refund paid on the policy, less every payment received and credit given — rounded
    to the cent. The late charge of the closing payment is late_pct percent of the overdue installment's later-installment
    share (later_share_quarterly percent of the term's TERM_PREMIUM item) when that installment is more than late_long_days
    days past its due date on the payment date, a flat late_flat when it is past due by late_long_days days or fewer,
    and nothing when no installment is overdue. The overdue-fee waiver of the closing payment gives back the overdue
    installment's installment_fee in full when that installment fell due after the request's effective date, whatever
    the reason, or when the request gives PROPERTY_SOLD with a settlement statement and that installment fell due
    on or before the request's effective date and no more than waiver_window_days days before it; it gives back
    half of it when the request gives REPLACED_COVERAGE with the replacing declarations and that installment fell
    due on or before the request's effective date and no more than waiver_window_days days before it; and it gives
    back nothing otherwise, including when no installment is overdue; for a closing payment under this rule, and
    only for it, the overdue installment's fee is given back as stated here; save it and the policy-fee return of
    a cancellation credit worked out under the cancellation rule, the policy fee and installment fees are fully
    earned when policy_fee_refundable is false. The prompt-settlement credit of the closing payment is prompt_fast_pct
    percent of the account balance when the payment is made no more than prompt_fast_days days after the policy
    was closed, prompt_slow_pct percent when it is made later but no more than prompt_slow_days days after, and
    nothing later. The new-home courtesy of the closing payment is newhome_near when the customer holds a Tidemark
    NFIP Dwelling Form policy in force (status in_force) on their primary residence, that residence is at a different
    address and the policy's original effective date lies no more than newhome_near_days days from the request's
    effective date, newhome_far when that policy's original effective date lies more than newhome_near_days but
    no more than newhome_far_days days from it, and nothing otherwise. The payment-record courtesy of the closing
    payment is record_long when no notice of cancellation for NONPAYMENT was ever mailed on the policy and the policy
    had been in force for at least record_months whole months on the payment date, record_short when no such notice
    was mailed but the policy had been in force for a shorter time, and nothing when such a notice was mailed. The
    closing payment is the account balance adjusted by every charge, give-back, credit and courtesy this rule states,
    each percent taken of the base this rule names for it; it is rounded to the cent once at the end and is never
    below zero. Where this rule takes the latest or most recent of several records, it orders them by the date it
    names, and among records of the same date the one recorded first counts. Every rounding to the cent this rule
    states takes the nearest cent, an amount lying exactly halfway between two cents going to the even cent.
  prerequisite:
  - problem: homeflood_ext_sale_cancellation
    kind: value_input
    gate: acct_balance
    form: state
    policy_source: >-
      The closing payment is fixed only after the account carries the CANCELLATION credit for the signed cancellation
      request on file.
    condition: >-
      The policy's ledger carries a homeflood_premium_credit entry with charge_basis CANCELLATION referenced to
      the SIGNED homeflood_requests CANCELLATION entry.
    resolved_by: process_cancellation_request_bf9010ee
    effect: acct_balance falls by the cancellation credit, which sets the closing payment.
  cross_category:
  - category: dwelling
    as: branch
    reads:
    - original_effective_date
    - property_address
    note: >-
      the new-home courtesy reads the customer's NFIP Dwelling Form policy at a different address and its original
      effective date
  compute:
  - req_reason: >-
      LATEST('homeflood_requests', 'cancellation_reason', date_field='created_at', request_type='CANCELLATION',
      outcome='SIGNED')
  - req_eff: >-
      LATEST('homeflood_requests', 'requested_effective_date', date_field='created_at', request_type='CANCELLATION',
      outcome='SIGNED')
  - req_doc: >-
      LATEST('homeflood_requests', 'supporting_document', date_field='created_at', request_type='CANCELLATION',
      outcome='SIGNED')
  - acct_balance: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged') + SUM('homeflood_billing', 'amount',
      event_type='homeflood_refund_disbursed') - SUM('homeflood_billing', 'amount', event_type='homeflood_premium_payment')
      - SUM('homeflood_billing', 'amount', event_type='homeflood_premium_credit')
  - od_due: >-
      LATEST('homeflood_billing', 'posted_date', date_field='posted_date', event_type='homeflood_premium_charged',
      component='INSTALLMENT_FEE', term_start=F('term_start'))
  - od_num: >-
      LATEST('homeflood_billing', 'installment_number', date_field='posted_date', event_type='homeflood_premium_charged',
      component='INSTALLMENT_FEE', term_start=F('term_start'))
  - od_paid: >-
      COUNT('homeflood_billing', event_type='homeflood_premium_payment', installment_number=od_num, term_start=F('term_start'))
  - od_days: DAYS(od_due, NOW) if (od_due != None and od_paid == 0) else 0
  - od_share: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged', component='TERM_PREMIUM', term_start=F('term_start'))
      * K('later_share_quarterly') / 100
  - late_charge: >-
      K('late_pct') / 100 * od_share if od_days > K('late_long_days') else (K('late_flat') if od_days > 0 else 0)
  - waiver_gap: >-
      DAYS(od_due, req_eff) if (od_due != None and od_paid == 0 and req_eff != None) else 9999
  - fee_waiver: >-
      P('installment_fee') if ((waiver_gap < 0) or (req_reason == 'PROPERTY_SOLD' and req_doc == 'SETTLEMENT_STATEMENT'
      and waiver_gap <= K('waiver_window_days'))) else (P('installment_fee') / 2 if (req_reason == 'REPLACED_COVERAGE'
      and req_doc == 'REPLACEMENT_DECLARATIONS' and waiver_gap >= 0 and waiver_gap <= K('waiver_window_days')) else
      0)
  - closed_gap: DAYS(F('closed_date'), NOW) if F('closed_date') else 9999
  - prompt_pct: >-
      K('prompt_fast_pct') if closed_gap <= K('prompt_fast_days') else (K('prompt_slow_pct') if closed_gap <= K('prompt_slow_days')
      else 0)
  - nh_eff: >-
      CFIELD('dwelling', 'original_effective_date', status='in_force', primary_residence=True)
  - nh_addr: >-
      CFIELD('dwelling', 'property_address', status='in_force', primary_residence=True)
  - nh_gap: >-
      ABS(DAYS(nh_eff, req_eff)) if (nh_eff != None and nh_addr != F('property_address') and req_eff != None) else
      99999
  - newhome: >-
      K('newhome_near') if (nh_eff != None and nh_gap <= K('newhome_near_days')) else (K('newhome_far') if (nh_eff
      != None and nh_gap <= K('newhome_far_days')) else 0)
  - np_notices: >-
      COUNT('homeflood_changes', event_type='homeflood_notice_sent', notice_reason='NONPAYMENT')
  - record_courtesy: >-
      K('record_long') if (np_notices == 0 and MONTHS(F('effective_date'), NOW) >= K('record_months')) else (K('record_short')
      if np_notices == 0 else 0)
  - result: >-
      MX(0, RND(acct_balance + late_charge - fee_waiver - prompt_pct / 100 * acct_balance - newhome - record_courtesy,
      2))
