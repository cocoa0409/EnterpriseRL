  trigger: state_due
  subject:
  - homeflood_term_renewed
  computes: renewal_term_premium
  target_tool: book_renewal_term_27983a73
  params:
    early_long_days: 30
    early_long_pct: 3
    early_short_days: 8
    early_short_pct: 1.5
    notice_two_pct: 6
    notice_one_pct: 3
    loyalty_long_months: 180
    loyalty_long_pct: 5
    loyalty_short_months: 60
    loyalty_short_pct: 2
    household_long_pct: 3
    household_short_pct: 1.5
    autopay_full_pct: 2
    autopay_part_pct: 1
  rule: >-
    When the first payment of the coming term under the elected plan was received on or before term_end, the renewal
    is booked as the next term on the same policy number, running from the prior term_end to the same date one year
    later, with a TERM_PREMIUM item for the renewal term premium and a POLICY_FEE item of policy_fee, both with
    the charge basis RENEWAL. The renewal term premium is not fixed until every Elevation Certificate entry received
    after the renewal offer carries its re-rated term premium in place of 0.00. The coming term is booked only after
    every Elevation Certificate entry received during the expiring term carries a RERATE credit, save one kept on
    file for the next term with its re-rated term premium recorded. The booking date is the day the renewal is booked
    and recorded, and every window and length of time this rule counts to the booking date ends on that day. The
    renewal offer is the renewal offer entry for the coming term start. The standard renewal term premium is the
    premium on the renewal offer for the coming term, rounded to the cent and never below minimum_premium. The premium
    the renewal term premium starts from is the re-rated term premium of the latest Elevation Certificate entry
    recorded after the renewal offer when that entry carries a re-rated term premium, because that rating already
    uses the elevation the offer lacked; when there is no such certificate entry, it is the revised full-term premium
    of the latest endorsement entry recorded after the renewal offer, because the offer predates that change; and
    otherwise it is the premium on the renewal offer. The early-renewal credit of the renewal term premium is early_long_pct
    percent when the latest payment received for the coming term as its installment 1 was received at least early_long_days
    days before the coming term start, early_short_pct percent when it was received at least early_short_days but
    fewer than early_long_days days before, and nothing otherwise, including when no such payment is on record.
    The payment-history surcharge of the renewal term premium is notice_two_pct percent when two or more notices
    of cancellation for NONPAYMENT were mailed on the policy in the 12 whole months before the booking date, notice_one_pct
    percent when exactly one was, and nothing when none was. The loyalty credit of the renewal term premium follows
    how long Tidemark has insured the address, counted in whole months to the booking date from the original effective
    date of the customer's NFIP record for the address (the Tidemark NFIP Dwelling Form policy this HomeFlood policy
    replaced, the one whose policy number is the policy's replaced NFIP policy number) or, without one, from this
    policy's effective date: it is loyalty_long_pct percent from loyalty_long_months whole months, loyalty_short_pct
    percent from loyalty_short_months but fewer than loyalty_long_months whole months, and nothing below loyalty_short_months.
    The household credit of the renewal term premium follows the other Tidemark lines the household keeps: it is
    household_long_pct percent when the customer holds a Tidemark NFIP Dwelling Form policy in force (status in_force)
    on a residence that is not their primary residence and also a Tidemark Excess Flood policy in status active
    at the HomeFlood property address, household_short_pct percent when the customer holds such an NFIP policy but
    no such Excess Flood policy, and nothing when the customer holds no such NFIP policy. The autopay credit of
    the renewal term premium is autopay_full_pct percent when every premium payment received for the expiring term
    was made by ACH and there were at least 4 of them, autopay_part_pct percent when there were one to three of
    them and every one was made by ACH, and nothing when any of them was made another way. Every credit and surcharge
    this rule states is a percent of the premium the renewal term premium starts from; they are combined into one
    net percent, surcharges added and credits subtracted, which is applied once, and the result is rounded to the
    cent once at the end and never falls below minimum_premium; for a renewal booked under this rule, and only for
    it, this replaces the base way of fixing the term premium, and every other HomeFlood term premium is the credit-reduced
    factored amount plus loss_of_use_premium, rounded to the cent once at the end, and never less than minimum_premium.
    Where this rule takes the latest or most recent of several records, it orders them by the date it names, and
    among records of the same date the one recorded first counts. Every rounding to the cent this rule states takes
    the nearest cent, an amount lying exactly halfway between two cents going to the even cent.
  prerequisite:
  - problem: homeflood_ext_certificate_rerate
    kind: value_input
    gate: cert_prem
    form: state
    policy_source: >-
      The renewal term premium is not fixed until every Elevation Certificate entry received after the renewal offer
      carries its re-rated term premium in place of 0.00.
    condition: >-
      Every homeflood_ec_received entry recorded after the renewal offer for the coming term carries a revised_term_premium
      other than 0.00.
    resolved_by: apply_certificate_review_8d563756
    effect: >-
      cert_prem changes from 0.00 to the certificate's re-rated term premium, so the renewal term premium starts
      from that figure instead of the offered premium.
  - problem: homeflood_ext_rerate_credit
    kind: state_gate
    gate: homeflood_billing.charge_basis
    form: state
    policy_source: >-
      The coming term is booked only after every Elevation Certificate entry received during the expiring term carries
      a RERATE credit, save one kept on file for the next term with its re-rated term premium recorded.
    condition: >-
      Every homeflood_ec_received entry whose recorded_date falls within the expiring term (term_start to term_end),
      other than one showing ec_applied false with a revised_term_premium above 0.00, has a homeflood_premium_credit
      entry with charge_basis RERATE referenced to it.
    resolved_by: book_rerate_credit_70dc8da2
    effect: >-
      the certificate entry received during the expiring term then carries its RERATE credit, so the gate on booking
      the coming term holds.
  cross_category:
  - category: dwelling
    as: branch
    reads:
    - original_effective_date
    - property_address
    - status
    - primary_residence
    note: >-
      the loyalty credit reads the NFIP record's original effective date at the address and the household credit
      reads whether an in-force NFIP policy covers a non-primary residence
  - category: excess
    as: existence
    reads:
    - status
    - property_address
    note: >-
      the household credit reads whether an active Excess Flood policy sits at the HomeFlood address
  compute:
  - offer_prem: >-
      LATEST('homeflood_changes', 'revised_term_premium', date_field='recorded_date', event_type='homeflood_renewal_offered',
      renewal_term_start=F('term_end'))
  - offer_date: >-
      LATEST('homeflood_changes', 'recorded_date', date_field='recorded_date', event_type='homeflood_renewal_offered',
      renewal_term_start=F('term_end'))
  - cert_prem: >-
      LATEST('homeflood_changes', 'revised_term_premium', date_field='recorded_date', event_type='homeflood_ec_received')
  - cert_date: >-
      LATEST('homeflood_changes', 'recorded_date', date_field='recorded_date', event_type='homeflood_ec_received')
  - end_prem: >-
      LATEST('homeflood_changes', 'revised_term_premium', date_field='recorded_date', event_type='homeflood_endorsement_issued')
  - end_date: >-
      LATEST('homeflood_changes', 'recorded_date', date_field='recorded_date', event_type='homeflood_endorsement_issued')
  - start_premium: >-
      cert_prem if (cert_date != None and DAYS(offer_date, cert_date) > 0 and cert_prem > 0) else (end_prem if (end_date
      != None and DAYS(offer_date, end_date) > 0) else offer_prem)
  - deposit_date: >-
      LATEST('homeflood_billing', 'posted_date', date_field='posted_date', event_type='homeflood_premium_payment',
      installment_number=1, term_start=F('term_end'))
  - early_days: DAYS(deposit_date, F('term_end')) if deposit_date else -1
  - early_pct: >-
      K('early_long_pct') if early_days >= K('early_long_days') else (K('early_short_pct') if early_days >= K('early_short_days')
      else 0)
  - notices: >-
      COUNT('homeflood_changes', within_months=12, date_field='recorded_date', event_type='homeflood_notice_sent',
      notice_reason='NONPAYMENT')
  - notice_pct: >-
      K('notice_two_pct') if notices >= 2 else (K('notice_one_pct') if notices == 1 else 0)
  - nf_orig: >-
      CFIELD('dwelling', 'original_effective_date', policy_number=F('replaced_nfip_policy_number'))
  - insured_months: MONTHS(nf_orig if nf_orig else F('effective_date'), NOW)
  - loyalty_pct: >-
      K('loyalty_long_pct') if insured_months >= K('loyalty_long_months') else (K('loyalty_short_pct') if insured_months
      >= K('loyalty_short_months') else 0)
  - other_nfip: EXISTS('dwelling', status='in_force', primary_residence=False)
  - other_xs: EXISTS('excess', status='active', property_address=F('property_address'))
  - household_pct: >-
      K('household_long_pct') if (other_nfip and other_xs) else (K('household_short_pct') if other_nfip else 0)
  - pay_total: >-
      COUNT('homeflood_billing', event_type='homeflood_premium_payment', term_start=F('term_start'))
  - pay_ach: >-
      COUNT('homeflood_billing', event_type='homeflood_premium_payment', term_start=F('term_start'), payment_method='ACH')
  - autopay_pct: >-
      K('autopay_full_pct') if (pay_total == pay_ach and pay_ach >= 4) else (K('autopay_part_pct') if (pay_total
      == pay_ach and pay_ach > 0) else 0)
  - net_pct: notice_pct - early_pct - loyalty_pct - household_pct - autopay_pct
  - result: MX(P('minimum_premium'), RND(start_premium * (1 + net_pct / 100), 2))
