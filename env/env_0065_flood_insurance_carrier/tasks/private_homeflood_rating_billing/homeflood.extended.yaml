      standard cancellation credit takes the term premium booked for the term — the TERM_PREMIUM item plus any ENDORSEMENT_PREMIUM
      items, less the ENDORSEMENT and RERATE credits already given on the term — multiplies it by the days from
      the request's effective date to term_end divided by the days from term_start to term_end, returns short_rate_pct
      percent of that pro rata amount, takes off the exit fee exit_fee_standard, and rounds the credit to the cent.
    result: >-
      The cancellation credit is put together in this order: every share and percent this rule states is first applied
      to the part of the premium return it names, every amount this rule states is then added to or taken from that
      result, and the credit is rounded to the cent once at the end and is never below zero. Every rounding to the
      cent this rule states takes the nearest cent, an amount lying exactly halfway between two cents going to the
      even cent.
  factors:
  - id: earning_basis
    effect: method
    decides: earning_frac
    bindings:
    - req_reason
    - req_doc
    - earning_frac
    ladder:
    - when: the request's effective date is on or before term_start
      method: the whole term premium booked for the term is returned (flat cancellation)
    - when: >-
        the request gives PROPERTY_SOLD with a settlement statement or REPLACED_COVERAGE with the replacing policy's
        declarations on file, and the effective date is after term_start
      method: the pro rata amount itself is returned
    - when: otherwise
      method: short_rate_pct percent of the pro rata amount is returned (short rate)
    baseline:
      earning_frac: K('short_rate_pct') / 100 * pro_rata_frac
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lou_return
    effect: parameter
    decides: lou_pct
    bindings:
    - lou_paid
    - other_paid
    - lou_pct
    ladder:
    - when: >-
        a claim paid loss-of-use money, net of voids, for a loss dated fewer than 12 whole months before processing
      value: '0'
    - when: claims paid other coverages but no loss-of-use money for such losses
      value: K('lou_half_pct')
    - when: otherwise
      value: '100'
    baseline:
      lou_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: claim_share
    effect: parameter
    decides: claim_pct
    bindings:
    - claim_net
    - claim_pct
    ladder:
    - when: >-
        net claim payments for losses dated fewer than 12 whole months before the processing date total more than
        zero and at least claim_heavy_pct percent of the dwelling limit and personal property limit taken together
      value: '0'
    - when: they total more than zero but less than that
      value: K('claim_light_share')
    - when: otherwise (they total zero)
      value: '100'
    baseline:
      claim_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: policy_fee_return
    effect: parameter
    decides: fee_return
    bindings:
    - fee_return
    ladder:
    - when: the request's effective date is fewer than fee_flat_days days after term_start
      value: P('policy_fee')
    - when: it falls later but leaves at least fee_part_months whole months of the term
      value: K('fee_part_pct') / 100 * P('policy_fee')
    - when: otherwise
      value: '0'
    baseline:
      fee_return: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: exit_fee
    effect: parameter
    decides: exit_fee
    bindings:
    - exit_fee
    ladder:
    - when: >-
        the policy had been in force for at least exit_free_months whole months on the request's effective date
      value: '0'
    - when: >-
        it had been in force for at least exit_mid_months but fewer than exit_free_months whole months
      value: K('exit_fee_mid')
    - when: otherwise
      value: K('exit_fee_standard')
    baseline:
      exit_fee: K('exit_fee_standard')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The standard cancellation credit takes the term premium booked for the term — the TERM_PREMIUM item plus any
      ENDORSEMENT_PREMIUM items, less the ENDORSEMENT and RERATE credits already given on the term — multiplies
      it by the days from the request's effective date to term_end divided by the days from term_start to term_end,
      returns short_rate_pct percent of that pro rata amount, takes off the exit fee exit_fee_standard, and rounds
      the credit to the cent.
    params:
    - short_rate_pct
    - exit_fee_standard
  inputs:
    history:
    - table: homeflood_billing
      aggregate: sum
      field: amount
      filters:
