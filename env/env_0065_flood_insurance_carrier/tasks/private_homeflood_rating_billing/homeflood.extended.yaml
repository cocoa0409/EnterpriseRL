    decides: early_pct
    bindings:
    - deposit_date
    - early_days
    - early_pct
    ladder:
    - when: >-
        the coming term's first payment was received at least early_long_days days before the coming term start
      value: K('early_long_pct')
    - when: >-
        it was received at least early_short_days but fewer than early_long_days days before
      value: K('early_short_pct')
    - when: otherwise
      value: '0'
    baseline:
      early_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: payment_history
    effect: parameter
    decides: notice_pct
    bindings:
    - notices
    - notice_pct
    ladder:
    - when: >-
        two or more notices of cancellation for NONPAYMENT were mailed on the policy in the 12 whole months before
        the booking date
      value: K('notice_two_pct')
    - when: exactly one such notice was mailed in that window
      value: K('notice_one_pct')
    - when: otherwise
      value: '0'
    baseline:
      notice_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_loyalty
    effect: parameter
    decides: loyalty_pct
    bindings:
    - nf_orig
    - insured_months
    - loyalty_pct
    ladder:
    - when: >-
        Tidemark has insured the address for at least loyalty_long_months whole months, counted from the NFIP record's
        original effective date or this policy's effective date
      value: K('loyalty_long_pct')
    - when: >-
        Tidemark has insured the address for at least loyalty_short_months but fewer than loyalty_long_months whole
        months
      value: K('loyalty_short_pct')
    - when: otherwise
