      method: >-
        the renewal term premium starts from the re-rated term premium of the latest such certificate entry
    - when: >-
        no such certificate entry, and an endorsement entry was recorded after the renewal offer
      method: >-
        the renewal term premium starts from the revised full-term premium of the latest such endorsement
