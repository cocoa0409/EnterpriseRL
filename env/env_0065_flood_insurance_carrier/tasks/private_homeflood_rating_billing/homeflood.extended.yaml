- id: homeflood_ext_renewal_booking
  base_policy_refs:
  - homeflood_agg_property_combination
  - homeflood_premium_rating
  - homeflood_credits
  - homeflood_renewal
  overwrite:
  - base_policy: homeflood_premium_rating
    superseded_clause: >-
      The term premium is that reduced amount plus loss_of_use_premium, rounded to the cent once at the end, and
      never less than minimum_premium.
    replaced_by: >-
      The standard renewal term premium is the premium on the renewal offer for the coming term, rounded to the
      cent and never below minimum_premium. The premium the renewal term premium starts from is the re-rated term
      premium of the latest Elevation Certificate entry recorded after the renewal offer when that entry carries
      a re-rated term premium, because that rating already uses the elevation the offer lacked; when there is no
      such certificate entry, it is the revised full-term premium of the latest endorsement entry recorded after
      the renewal offer, because the offer predates that change; and otherwise it is the premium on the renewal
      offer. The early-renewal credit of the renewal term premium is early_long_pct percent when the latest payment
      received for the coming term as its installment 1 was received at least early_long_days days before the coming
      term start, early_short_pct percent when it was received at least early_short_days but fewer than early_long_days
      days before, and nothing otherwise, including when no such payment is on record. The payment-history surcharge
      of the renewal term premium is notice_two_pct percent when two or more notices of cancellation for NONPAYMENT
      were mailed on the policy in the 12 whole months before the booking date, notice_one_pct percent when exactly
      one was, and nothing when none was. The loyalty credit of the renewal term premium follows how long Tidemark
      has insured the address, counted in whole months to the booking date from the original effective date of the
