    - waiver_gap
    - fee_waiver
    ladder:
    - when: >-
        the overdue installment fell due after the request's effective date, or the request gives PROPERTY_SOLD
        with a settlement statement and that installment fell due on or before the effective date and no more than
        waiver_window_days days before it
      value: P('installment_fee')
    - when: >-
        the request gives REPLACED_COVERAGE with the replacing declarations and that installment fell due on or
        before the effective date and no more than waiver_window_days days before it
      value: P('installment_fee') / 2
    - when: otherwise, including when no installment is overdue
      value: '0'
    baseline:
      fee_waiver: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: prompt_settlement
    effect: parameter
    decides: prompt_pct
    bindings:
    - closed_gap
    - prompt_pct
    ladder:
    - when: paid no more than prompt_fast_days days after the policy was closed
      value: K('prompt_fast_pct')
    - when: paid later but no more than prompt_slow_days days after
      value: K('prompt_slow_pct')
    - when: otherwise
      value: '0'
    baseline:
      prompt_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: new_home_courtesy
    effect: parameter
    decides: newhome
    bindings:
    - nh_eff
    - nh_addr
    - nh_gap
    - newhome
    ladder:
    - when: >-
        the customer holds a Tidemark NFIP Dwelling Form policy in force on their primary residence, at a different
        address, whose original effective date lies no more than newhome_near_days days from the request's effective
        date
      value: K('newhome_near')
    - when: >-
        that policy's original effective date lies more than newhome_near_days but no more than newhome_far_days
        days from it
      value: K('newhome_far')
    - when: otherwise
      value: '0'
    baseline:
      newhome: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dwelling
  - id: payment_record
    effect: parameter
    decides: record_courtesy
    bindings:
    - np_notices
    - record_courtesy
    ladder:
    - when: >-
        no NONPAYMENT notice was ever mailed on the policy and it had been in force for at least record_months whole
        months
      value: K('record_long')
    - when: no such notice was mailed but it had been in force for a shorter time
      value: K('record_short')
    - when: otherwise
      value: '0'
    baseline:
      record_courtesy: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The standard closing payment is the balance the account shows — every premium item charged and refund paid
      on the policy, less every payment received and credit given — rounded to the cent.
    params: []
  inputs:
    history:
    - table: homeflood_billing
      aggregate: sum
      field: amount
      filters:
        event_type: homeflood_premium_payment
    cross_category:
    - dwelling
