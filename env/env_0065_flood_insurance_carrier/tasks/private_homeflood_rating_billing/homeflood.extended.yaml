- id: homeflood_ext_installment_payment
  base_policy_refs:
  - homeflood_payment_plans
  overwrite:
  - base_policy: homeflood_payment_plans
    superseded_clause: >-
      The policy fee is collected in full with the first payment, each installment after the first carries installment_fee,
      every installment is rounded to the cent and the last installment absorbs the rounding difference.
    replaced_by: >-
      The installments of that term are its first payment and, after it, three later installments due 3, 6 and 9
      calendar months after its start on QUARTERLY or one due 6 calendar months after its start on SEMI_ANNUAL;
      the installments still to come are those of the plan not yet received. The standard installment after the
      first is the later-installment share of the TERM_PREMIUM item booked for the term, later_share_quarterly percent
      on QUARTERLY and later_share_semi percent on SEMI_ANNUAL, plus installment_fee, rounded to the cent. The deposit
      difference of the term is the payments received for the term as its installment 1 less the sum of policy_fee
      and the plan's down share of the booked TERM_PREMIUM item (down_share_quarterly percent on QUARTERLY, down_share_semi
      percent on SEMI_ANNUAL); when three or more installments are still to come it is spread equally over them
      and this installment gives back one equal part, when one or two are still to come the next installment gives
      it back in full, and otherwise it is settled separately and not through an installment. The credit balance
      left on the policy's earlier terms taken together — their charges and refunds less their payments and credits,
      when below zero — is applied on QUARTERLY with two or more installments still to come by spreading it equally
      over them so that this installment takes one equal part, is applied in full to the next installment when the
      plan is SEMI_ANNUAL or only one installment is still to come, and otherwise is refunded separately and not
      taken into an installment. The installment fee of this installment is fee_autopay when every premium payment
      on the policy in the 12 whole months before the payment date was made by ACH and there were at least 4, fee_partial
      when there were one to three of them and every one was made by ACH, and installment_fee otherwise. The pay-ahead
      credit of this installment counts the months passed since the previous installment's due date as the whole
      calendar months from the term's start to the payment date less the months after the start at which that previous
      installment fell due (0 for the first payment, 3 or 6 on QUARTERLY): it is pay_ahead_long_pct percent of the
      later-installment share when fewer than one such month has passed, pay_ahead_short_pct percent when one but
      fewer than two have passed, and nothing later or when the policy has no first payment on record. The booking-delay
      credit of this installment is booking_delay_long_pct percent of the later-installment share when the term's
      TERM_PREMIUM item was booked more than booking_delay_long_days days after that term's start, booking_delay_short_pct
      percent when it was booked more than booking_delay_short_days but no more than booking_delay_long_days days
      after, and nothing when it was booked sooner or no term premium item is booked for that term. The Excess paid-up
      credit of this installment reads the customer's Tidemark Excess Flood policy in status active at the same
      address (the Excess Flood program allows only one live policy on an address): it is excess_paid_long_pct percent
      of the later-installment share when that policy exists and shows a premium balance of zero or less, excess_paid_short_pct
      percent when it is active but still shows a balance owed, and nothing when there is no active Excess Flood
      policy at the address. The installment due is the later-installment share adjusted by every amount, part and
      percent credit this rule states for this installment, each percent taken of the later-installment share; it
      is rounded to the cent once at the end and is never below zero; for an installment paid under this rule, and
      only for it, this replaces the base way of working out an installment, and for every other installment the
      policy fee is collected in full with the first payment, each installment after the first carries installment_fee,
      every installment is rounded to the cent and the last installment absorbs the rounding difference.
  trigger: on_request
  subject:
  - homeflood_premium_payment
  computes: amount
  target_tool: pay_installment_4d782e9d
  params:
    later_share_quarterly: 20
    later_share_semi: 50
    down_share_quarterly: 40
    down_share_semi: 50
    fee_autopay: 0
    fee_partial: 3
    pay_ahead_long_pct: 2
    pay_ahead_short_pct: 1
    booking_delay_long_days: 45
    booking_delay_long_pct: 3
    booking_delay_short_days: 30
    booking_delay_short_pct: 1.5
    excess_paid_long_pct: 1
    excess_paid_short_pct: 0.5
  rule: >-
    The customer pays the next installment under the elected plan themselves; the term that installment belongs
    to is the term of the latest first payment (installment 1) received on the policy, and the payment is recorded
    on that term with its installment number. The payment date is the day the customer makes the payment, and every
    window and length of time this rule counts to the payment date ends on that day. An installment after the first
    is not fixed until the term it belongs to carries its booked term premium item. The installment due is fixed
    only after every Elevation Certificate entry received during an earlier term carries a RERATE credit, save one
    kept on file for the next term with its re-rated term premium recorded. The installments of that term are its
    first payment and, after it, three later installments due 3, 6 and 9 calendar months after its start on QUARTERLY
    or one due 6 calendar months after its start on SEMI_ANNUAL; the installments still to come are those of the
    plan not yet received. The standard installment after the first is the later-installment share of the TERM_PREMIUM
    item booked for the term, later_share_quarterly percent on QUARTERLY and later_share_semi percent on SEMI_ANNUAL,
    plus installment_fee, rounded to the cent. The deposit difference of the term is the payments received for the
    term as its installment 1 less the sum of policy_fee and the plan's down share of the booked TERM_PREMIUM item
    (down_share_quarterly percent on QUARTERLY, down_share_semi percent on SEMI_ANNUAL); when three or more installments
    are still to come it is spread equally over them and this installment gives back one equal part, when one or
    two are still to come the next installment gives it back in full, and otherwise it is settled separately and
    not through an installment. The credit balance left on the policy's earlier terms taken together — their charges
    and refunds less their payments and credits, when below zero — is applied on QUARTERLY with two or more installments
    still to come by spreading it equally over them so that this installment takes one equal part, is applied in
    full to the next installment when the plan is SEMI_ANNUAL or only one installment is still to come, and otherwise
    is refunded separately and not taken into an installment. The installment fee of this installment is fee_autopay
    when every premium payment on the policy in the 12 whole months before the payment date was made by ACH and
    there were at least 4, fee_partial when there were one to three of them and every one was made by ACH, and installment_fee
    otherwise. The pay-ahead credit of this installment counts the months passed since the previous installment's
    due date as the whole calendar months from the term's start to the payment date less the months after the start
    at which that previous installment fell due (0 for the first payment, 3 or 6 on QUARTERLY): it is pay_ahead_long_pct
    percent of the later-installment share when fewer than one such month has passed, pay_ahead_short_pct percent
    when one but fewer than two have passed, and nothing later or when the policy has no first payment on record.
    The booking-delay credit of this installment is booking_delay_long_pct percent of the later-installment share
    when the term's TERM_PREMIUM item was booked more than booking_delay_long_days days after that term's start,
    booking_delay_short_pct percent when it was booked more than booking_delay_short_days but no more than booking_delay_long_days
    days after, and nothing when it was booked sooner or no term premium item is booked for that term. The Excess
    paid-up credit of this installment reads the customer's Tidemark Excess Flood policy in status active at the
    same address (the Excess Flood program allows only one live policy on an address): it is excess_paid_long_pct
    percent of the later-installment share when that policy exists and shows a premium balance of zero or less,
    excess_paid_short_pct percent when it is active but still shows a balance owed, and nothing when there is no
    active Excess Flood policy at the address. The installment due is the later-installment share adjusted by every
    amount, part and percent credit this rule states for this installment, each percent taken of the later-installment
    share; it is rounded to the cent once at the end and is never below zero; for an installment paid under this
    rule, and only for it, this replaces the base way of working out an installment, and for every other installment
    the policy fee is collected in full with the first payment, each installment after the first carries installment_fee,
    every installment is rounded to the cent and the last installment absorbs the rounding difference. Where this
    rule takes the latest or most recent of several records, it orders them by the date it names, and among records
    of the same date the one recorded first counts. Every rounding to the cent this rule states takes the nearest
    cent, an amount lying exactly halfway between two cents going to the even cent.
  prerequisite:
  - problem: homeflood_ext_renewal_booking
    kind: value_input
    gate: term_item
    form: state
    policy_source: >-
      An installment after the first is not fixed until the term it belongs to carries its booked term premium item.
    condition: >-
      The term_start of the latest homeflood_premium_payment with installment_number 1 on the policy carries a homeflood_premium_charged
      TERM_PREMIUM entry with that term_start.
    resolved_by: book_renewal_term_27983a73
    effect: >-
      term_item (the TERM_PREMIUM item of the installment's term) changes from 0.00 to the booked renewal term premium,
      which sets the later-installment share and the deposit difference.
  - problem: homeflood_ext_rerate_credit
    kind: value_input
    gate: closed_credit
    form: state
    policy_source: >-
      The installment due is fixed only after every Elevation Certificate entry received during an earlier term
      carries a RERATE credit, save one kept on file for the next term with its re-rated term premium recorded.
    condition: >-
      Every homeflood_ec_received entry recorded within a term earlier than the installment's term, other than one
      showing ec_applied false with a revised_term_premium above 0.00, has a homeflood_premium_credit entry with
      charge_basis RERATE referenced to it.
    resolved_by: book_rerate_credit_70dc8da2
    effect: >-
      closed_credit rises from 0.00 to the re-rate credit left on the earlier term, part of which this installment
      takes.
  cross_category:
  - category: excess
    as: branch
    reads:
    - status
    - premium_balance
    note: >-
      the Excess paid-up credit reads whether the Excess Flood policy at the address is active and paid up
  compute:
  - inst_term: >-
      LATEST('homeflood_billing', 'term_start', date_field='posted_date', event_type='homeflood_premium_payment',
      installment_number=1)
  - share_pct: >-
      K('later_share_quarterly') if F('payment_plan') == 'QUARTERLY' else (K('later_share_semi') if F('payment_plan')
      == 'SEMI_ANNUAL' else 0)
  - down_pct: >-
      K('down_share_quarterly') if F('payment_plan') == 'QUARTERLY' else (K('down_share_semi') if F('payment_plan')
      == 'SEMI_ANNUAL' else 100)
  - planned: >-
      4 if F('payment_plan') == 'QUARTERLY' else (2 if F('payment_plan') == 'SEMI_ANNUAL' else 1)
  - term_item: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged', component='TERM_PREMIUM', term_start=inst_term)
  - share: term_item * share_pct / 100
  - paid_count: >-
      COUNT('homeflood_billing', event_type='homeflood_premium_payment', term_start=inst_term)
  - remaining: planned - paid_count
  - deposit: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_payment', installment_number=1, term_start=inst_term)
  - deposit_diff: deposit - (term_item * down_pct / 100 + P('policy_fee'))
  - deposit_part: >-
      0 - deposit_diff / remaining if remaining >= 3 else (0 - deposit_diff if remaining >= 1 else 0)
  - all_balance: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged') + SUM('homeflood_billing', 'amount',
      event_type='homeflood_refund_disbursed') - SUM('homeflood_billing', 'amount', event_type='homeflood_premium_payment')
      - SUM('homeflood_billing', 'amount', event_type='homeflood_premium_credit')
  - cur_balance: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged', term_start=inst_term) - SUM('homeflood_billing',
      'amount', event_type='homeflood_premium_payment', term_start=inst_term) - SUM('homeflood_billing', 'amount',
      event_type='homeflood_premium_credit', term_start=inst_term)
  - closed_credit: MX(0, cur_balance - all_balance)
  - credit_part: >-
      0 - closed_credit / remaining if (F('payment_plan') == 'QUARTERLY' and remaining >= 2) else (0 - closed_credit
      if (F('payment_plan') == 'SEMI_ANNUAL' or remaining == 1) else 0)
  - pay12: >-
      COUNT('homeflood_billing', within_months=12, date_field='posted_date', event_type='homeflood_premium_payment')
  - ach12: >-
      COUNT('homeflood_billing', within_months=12, date_field='posted_date', event_type='homeflood_premium_payment',
      payment_method='ACH')
  - fee: >-
      K('fee_autopay') if (pay12 == ach12 and ach12 >= 4) else (K('fee_partial') if (pay12 == ach12 and ach12 >
      0) else P('installment_fee'))
  - prev_due_months: 3 * (paid_count - 1) if F('payment_plan') == 'QUARTERLY' else 0
  - since_prev: MONTHS(inst_term, NOW) - prev_due_months if inst_term else 99
  - pay_ahead_pct: >-
      K('pay_ahead_long_pct') if since_prev < 1 else (K('pay_ahead_short_pct') if since_prev < 2 else 0)
  - booked_on: >-
      LATEST('homeflood_billing', 'posted_date', date_field='posted_date', event_type='homeflood_premium_charged',
      component='TERM_PREMIUM', term_start=inst_term)
  - booking_lag: DAYS(inst_term, booked_on) if booked_on else 0
  - booking_pct: >-
      K('booking_delay_long_pct') if booking_lag > K('booking_delay_long_days') else (K('booking_delay_short_pct')
      if booking_lag > K('booking_delay_short_days') else 0)
  - xs_status: >-
      CFIELD('excess', 'status', status='active', property_address=F('property_address'))
  - xs_balance: >-
      CFIELD('excess', 'premium_balance', status='active', property_address=F('property_address'))
  - excess_pct: >-
      K('excess_paid_long_pct') if (xs_status == 'active' and xs_balance <= 0) else (K('excess_paid_short_pct')
      if xs_status == 'active' else 0)
  - result: >-
      MX(0, RND(share + fee - share * (pay_ahead_pct + booking_pct + excess_pct) / 100 + deposit_part + credit_part,
      2))
