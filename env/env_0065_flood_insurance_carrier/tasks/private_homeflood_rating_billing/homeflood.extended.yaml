      total credit percent from the credit rule then reduces the result.
  - base_policy: homeflood_premium_rating
    superseded_clause: >-
      The elevation factor is no_ec_factor_non_sfha for a property in zone X, B, C or D; for a property in any other
      zone it is the elevation_factor_table row for elevation_difference_ft when an accepted Elevation Certificate
      showing a base flood elevation is on file — a difference of 4 feet or more takes the "+4 or more" row and
      a difference of -2 feet or lower takes the "-2 or lower" row — and no_ec_factor_sfha when none is on file.
    replaced_by: >-
      For a property in zone X, B, C or D the elevation factor of the re-rated term premium is no_ec_factor_non_sfha,
      and for a property in any other zone it follows the age of the certificate under review, counted in whole
      calendar months from its survey date to the date Tidemark received it: a certificate that shows a base flood
      elevation and was surveyed fewer than fresh_survey_months whole months before receipt takes the elevation_factor_table
      row for its elevation difference as certified, a certificate that shows a base flood elevation and was surveyed
      at least fresh_survey_months but fewer than ec_max_age_years times 12 whole months before receipt takes the
      elevation_factor_table row for its elevation difference less one foot, because Tidemark rates an older survey
      one foot more conservatively, and any other case takes no_ec_factor_sfha; a difference of 4 feet or more takes
      the "+4 or more" row and one of -2 feet or lower takes the "-2 or lower" row; for every other HomeFlood rating
      the elevation factor is no_ec_factor_non_sfha for a property in zone X, B, C or D and, in any other zone,
      the elevation_factor_table row for elevation_difference_ft when an accepted Elevation Certificate showing
      a base flood elevation is on file and no_ec_factor_sfha when none is on file.
  - base_policy: homeflood_ec_rating
    superseded_clause: >-
      An Elevation Certificate is accepted for rating only when it is on FEMA Form 086-0-33, completed and sealed
      by a licensed land surveyor, engineer or architect, and its survey date is no more than ec_max_age_years before
      the date Tidemark receives it, with no alteration to the building since the survey.
    replaced_by: >-
      For a certificate review under this rule, and only for it, a certificate entry is accepted for rating when
      its survey date falls fewer than ec_max_age_years times 12 whole calendar months before the date Tidemark
      received it, Tidemark recording an Elevation Certificate entry only for a certificate on FEMA Form 086-0-33,
      completed and sealed by a licensed land surveyor, engineer or architect, for a building not altered since
      the survey; for every other use, a certificate is accepted for rating only when it is on FEMA Form 086-0-33,
      completed and sealed by a licensed land surveyor, engineer or architect, with no alteration to the building
      since the survey, and its survey date is no more than ec_max_age_years before the date Tidemark receives it.
  - base_policy: homeflood_credits
    superseded_clause: >-
      The mitigation credit of mitigation_credit_pct applies when the accepted certificate on file certifies engineered
      flood openings.
    replaced_by: >-
      The flood-vent credit of the re-rated term premium is vent_elevated_pct when the certificate under review
      is accepted for rating and certifies engineered flood openings and shows an elevation difference of zero or
      more, is mitigation_credit_pct when it is accepted for rating, certifies engineered flood openings and shows
      a negative elevation difference or no base flood elevation, and is nothing when it certifies no engineered
      flood openings or is not accepted for rating; for every other HomeFlood rating the mitigation credit of mitigation_credit_pct
      applies when the accepted certificate on file certifies engineered flood openings.
  - base_policy: homeflood_credits
    superseded_clause: >-
      The claims-free credit of claims_free_credit_pct applies when the customer has held Tidemark flood coverage
      on the property, under HomeFlood or an NFIP Dwelling Form policy, since a date on or before the start of the
      lookback period and no claim with a net payment above zero has a date of loss in the lookback period (homeflood_msr_paid_claims_lookback
      is zero).
    replaced_by: >-
      The loss-history credit of the re-rated term premium, which counts every window and length of time to the
      re-rating date (the day the certificate review is completed and recorded, neither the date Tidemark received
      the certificate nor the term start), looks at claim payments net of voided payments, by date of loss, under
      this HomeFlood policy and under the customer's NFIP record for the address, and at how long Tidemark has insured
      the address, counted in whole months to the re-rating date from the original effective date of that NFIP record
      or, without one, from this policy's effective date: it is loss_free_long_pct when the net payments for losses
      dated fewer than loss_free_long_months whole months before the re-rating date total zero under this policy
      and zero under the NFIP record and Tidemark has insured the address for at least loss_free_long_months whole
      months, it is claims_free_credit_pct when that longer condition is not met but the net payments for losses
      dated fewer than claims_free_years times 12 whole months before the re-rating date total zero under this policy
      and zero under the NFIP record and Tidemark has insured the address for at least claims_free_years times 12
      whole months, and otherwise there is no loss-history credit; for every other HomeFlood rating the claims-free
      credit of claims_free_credit_pct applies when the customer has held Tidemark flood coverage on the property
      since a date on or before the start of the lookback period and no claim with a net payment above zero has
      a date of loss in that period.
  - base_policy: homeflood_agg_property_combination
    superseded_clause: >-
      Holding a Tidemark Excess Flood policy in status active at the same property address on the term start earns
      the package credit for that term; the credit is decided at issue and at each renewal and is not added or removed
      mid-term.
    replaced_by: >-
      The layer credit of the re-rated term premium follows the customer's Tidemark Excess Flood policy in status
      active at the same property address (the Excess Flood program allows only one live policy on an address),
      which counts as in force on the term start when it took effect on or before the term start: such a policy
      with an excess building limit of at least layer_large_limit earns package_credit_pct, such a policy with a
      smaller excess building limit earns layer_small_pct, and without such a policy no layer credit applies; for
      every other HomeFlood rating, holding a Tidemark Excess Flood policy in status active at the same property
      address on the term start earns package_credit_pct for that term, decided at issue and at each renewal and
      not added or removed mid-term.
  - base_policy: homeflood_premium_rating
    superseded_clause: The total credit percent from the credit rule then reduces the result.
    replaced_by: >-
      For the re-rated term premium of a certificate review, and only for it, the rate sum is multiplied by every
      factor this rule states and reduced once by every credit this rule states, the credits being added to one
      another, never multiplied, with their sum capped at max_combined_credit_pct; loss_of_use_premium is then added,
      the total is rounded to the cent once at the end, and it never falls below minimum_premium; for every other
      HomeFlood rating the rate sum is multiplied by the zone factor for the property's flood_zone from zone_factor_table,
      by the elevation factor and by the factor for the elected deductible from deductible_factor_table, and the
      total credit percent from the credit rule then reduces the result.
  trigger: state_due
  subject:
  - homeflood_ec_received
  - homeflood_rating_updated
  computes: revised_term_premium
  target_tool: apply_certificate_review_8d563756
  params:
    zf_x_b_c: 0.35
    zf_d: 1.1
    zf_a99_ar: 0.65
    zf_a_ae_ah: 1.0
    zf_ao: 0.95
    zf_v_ve: 2.4
    ef_plus4: 0.35
    ef_plus3: 0.45
    ef_plus2: 0.58
    ef_plus1: 0.75
    ef_zero: 1.0
    ef_minus1: 1.4
    ef_minus2: 1.95
    df_500: 1.04
    df_1000: 1.0
    df_1500: 0.97
    df_2000: 0.94
    df_2500: 0.92
    df_5000: 0.85
    df_10000: 0.77
    df_25000: 0.66
    df_50000: 0.57
    fresh_survey_months: 60
    vent_elevated_pct: 5
    loss_free_long_months: 120
    loss_free_long_pct: 8
    layer_large_limit: 1000000
    layer_small_pct: 3
    occ_primary: 0.95
    occ_secondary: 1.1
    transfer_long_months: 120
    transfer_long_pct: 4
    transfer_short_pct: 2
  rule: >-
    When an Elevation Certificate entry on a HomeFlood policy still shows a re-rated full-term premium of 0.00,
    its review is completed by re-rating the policy's current term with that certificate, and the figure produced
    is the re-rated term premium recorded on the certificate entry. The certificate under review is the most recently
    received Elevation Certificate entry on the policy, read for its survey date, the date Tidemark received it,
    its base flood elevation, its elevation difference and its flood openings. The customer's NFIP record for the
    address is the Tidemark NFIP Dwelling Form policy this HomeFlood policy replaced, the one whose policy number
    is the policy's replaced NFIP policy number; a HomeFlood policy that replaced no NFIP policy has no NFIP record.
    The standard re-rating takes the dwelling limit divided by 100 times building_rate_per_100 plus the personal
    property limit divided by 100 times contents_rate_per_100, multiplies that sum by the zone factor for the flood
    zone from zone_factor_table, by the elevation factor no_ec_factor_sfha (no_ec_factor_non_sfha for a property
    in zone X, B, C or D) and by the deductible_factor_table row for the deductible on the policy, adds loss_of_use_premium,
    rounds the total to the cent once at the end, and never lets it fall below minimum_premium; the credit percent
    recorded on the policy for the term is not carried into the re-rating. For a certificate review under this rule,
    and only for it, a certificate entry is accepted for rating when its survey date falls fewer than ec_max_age_years
    times 12 whole calendar months before the date Tidemark received it, Tidemark recording an Elevation Certificate
    entry only for a certificate on FEMA Form 086-0-33, completed and sealed by a licensed land surveyor, engineer
    or architect, for a building not altered since the survey; for every other use, a certificate is accepted for
    rating only when it is on FEMA Form 086-0-33, completed and sealed by a licensed land surveyor, engineer or
    architect, with no alteration to the building since the survey, and its survey date is no more than ec_max_age_years
    before the date Tidemark receives it. For a property in zone X, B, C or D the elevation factor of the re-rated
    term premium is no_ec_factor_non_sfha, and for a property in any other zone it follows the age of the certificate
    under review, counted in whole calendar months from its survey date to the date Tidemark received it: a certificate
    that shows a base flood elevation and was surveyed fewer than fresh_survey_months whole months before receipt
    takes the elevation_factor_table row for its elevation difference as certified, a certificate that shows a base
    flood elevation and was surveyed at least fresh_survey_months but fewer than ec_max_age_years times 12 whole
    months before receipt takes the elevation_factor_table row for its elevation difference less one foot, because
    Tidemark rates an older survey one foot more conservatively, and any other case takes no_ec_factor_sfha; a difference
    of 4 feet or more takes the "+4 or more" row and one of -2 feet or lower takes the "-2 or lower" row; for every
    other HomeFlood rating the elevation factor is no_ec_factor_non_sfha for a property in zone X, B, C or D and,
    in any other zone, the elevation_factor_table row for elevation_difference_ft when an accepted Elevation Certificate
    showing a base flood elevation is on file and no_ec_factor_sfha when none is on file. The flood-vent credit
    of the re-rated term premium is vent_elevated_pct when the certificate under review is accepted for rating and
    certifies engineered flood openings and shows an elevation difference of zero or more, is mitigation_credit_pct
    when it is accepted for rating, certifies engineered flood openings and shows a negative elevation difference
    or no base flood elevation, and is nothing when it certifies no engineered flood openings or is not accepted
    for rating; for every other HomeFlood rating the mitigation credit of mitigation_credit_pct applies when the
    accepted certificate on file certifies engineered flood openings. The loss-history credit of the re-rated term
    premium, which counts every window and length of time to the re-rating date (the day the certificate review
    is completed and recorded, neither the date Tidemark received the certificate nor the term start), looks at
    claim payments net of voided payments, by date of loss, under this HomeFlood policy and under the customer's
    NFIP record for the address, and at how long Tidemark has insured the address, counted in whole months to the
    re-rating date from the original effective date of that NFIP record or, without one, from this policy's effective
    date: it is loss_free_long_pct when the net payments for losses dated fewer than loss_free_long_months whole
    months before the re-rating date total zero under this policy and zero under the NFIP record and Tidemark has
    insured the address for at least loss_free_long_months whole months, it is claims_free_credit_pct when that
    longer condition is not met but the net payments for losses dated fewer than claims_free_years times 12 whole
    months before the re-rating date total zero under this policy and zero under the NFIP record and Tidemark has
    insured the address for at least claims_free_years times 12 whole months, and otherwise there is no loss-history
    credit; for every other HomeFlood rating the claims-free credit of claims_free_credit_pct applies when the customer
    has held Tidemark flood coverage on the property since a date on or before the start of the lookback period
    and no claim with a net payment above zero has a date of loss in that period. The layer credit of the re-rated
    term premium follows the customer's Tidemark Excess Flood policy in status active at the same property address
    (the Excess Flood program allows only one live policy on an address), which counts as in force on the term start
    when it took effect on or before the term start: such a policy with an excess building limit of at least layer_large_limit
    earns package_credit_pct, such a policy with a smaller excess building limit earns layer_small_pct, and without
    such a policy no layer credit applies; for every other HomeFlood rating, holding a Tidemark Excess Flood policy
    in status active at the same property address on the term start earns package_credit_pct for that term, decided
    at issue and at each renewal and not added or removed mid-term. The occupancy factor of the re-rated term premium
    follows the customer's NFIP record for the address: it is occ_primary when that record shows the home as the
    insured's primary residence, occ_secondary when it shows the home as not the primary residence, and 1 when Tidemark
    holds no NFIP record for the address. The NFIP transfer factor of the re-rated term premium recognises a home
    moved from Tidemark's federal book: when the customer's NFIP record for the address was cancelled for REPLACED_BY_PRIVATE_FLOOD
    after running at least transfer_long_months whole months from its original effective date to its cancellation
    effective date, the factor is 1 minus transfer_long_pct percent; when it was so replaced after a shorter run,
    the factor is 1 minus transfer_short_pct percent; otherwise the factor is 1. For the re-rated term premium of
    a certificate review, and only for it, the rate sum is multiplied by every factor this rule states and reduced
    once by every credit this rule states, the credits being added to one another, never multiplied, with their
    sum capped at max_combined_credit_pct; loss_of_use_premium is then added, the total is rounded to the cent once
    at the end, and it never falls below minimum_premium; for every other HomeFlood rating the rate sum is multiplied
    by the zone factor for the property's flood_zone from zone_factor_table, by the elevation factor and by the
    factor for the elected deductible from deductible_factor_table, and the total credit percent from the credit
    rule then reduces the result. When the re-rated term premium is lower than the full-term premium in force, the
    certificate is applied (ec_applied true) with the capped credit percent it used, from the date it was received;
    when it is not lower, it is kept on file (ec_applied false) for the next term's rating. Where this rule takes
    the latest or most recent of several records, it orders them by the date it names, and among records of the
    same date the one recorded first counts. Every rounding to the cent this rule states takes the nearest cent,
    an amount lying exactly halfway between two cents going to the even cent.
  prerequisite: []
  cross_category:
  - category: dwelling
    as: history
    reads:
    - policy_number
    - dwelling_policy_id
    - original_effective_date
    - primary_residence
    - cancellation_reason
    - cancellation_effective_date
    - dwelling_claims.payment_amount
    note: >-
      the loss-history credit reads the NFIP record's net claim payments and start date; the occupancy and NFIP
      transfer factors read its primary-residence flag and its replacement cancellation
  - category: excess
    as: branch
    reads:
    - effective_date
    - status
    - property_address
    - excess_building_limit
    note: >-
      the layer credit reads the active Excess Flood policy at the address: its effective date and excess building
      limit
  compute:
  - base_rate_amount: >-
      F('building_coverage') / 100 * P('building_rate_per_100') + F('contents_coverage') / 100 * P('contents_rate_per_100')
  - outside_sfha: >-
      F('flood_zone') == 'X' or F('flood_zone') == 'B' or F('flood_zone') == 'C' or F('flood_zone') == 'D'
  - zone_factor: >-
      K('zf_x_b_c') if (F('flood_zone') == 'X' or F('flood_zone') == 'B' or F('flood_zone') == 'C') else (K('zf_d')
      if F('flood_zone') == 'D' else (K('zf_a99_ar') if (F('flood_zone') == 'A99' or F('flood_zone') == 'AR') else
      (K('zf_ao') if F('flood_zone') == 'AO' else (K('zf_v_ve') if (F('flood_zone') == 'V' or F('flood_zone') ==
      'VE') else K('zf_a_ae_ah')))))
  - deductible_factor: >-
      K('df_500') if F('deductible') == 500 else (K('df_1000') if F('deductible') == 1000 else (K('df_1500') if
      F('deductible') == 1500 else (K('df_2000') if F('deductible') == 2000 else (K('df_2500') if F('deductible')
      == 2500 else (K('df_5000') if F('deductible') == 5000 else (K('df_10000') if F('deductible') == 10000 else
      (K('df_25000') if F('deductible') == 25000 else K('df_50000'))))))))
  - cert_received: >-
      LATEST('homeflood_changes', 'recorded_date', date_field='recorded_date', event_type='homeflood_ec_received')
  - cert_survey: >-
      LATEST('homeflood_changes', 'ec_survey_date', date_field='recorded_date', event_type='homeflood_ec_received')
  - cert_bfe: >-
      LATEST('homeflood_changes', 'ec_base_flood_elevation', date_field='recorded_date', event_type='homeflood_ec_received')
  - cert_diff: >-
      LATEST('homeflood_changes', 'ec_elevation_difference_ft', date_field='recorded_date', event_type='homeflood_ec_received')
  - cert_months: MONTHS(cert_survey, cert_received) if cert_survey else 9999
  - elev_factor: >-
      P('no_ec_factor_non_sfha') if outside_sfha else ((K('ef_plus4') if cert_diff >= 4 else (K('ef_plus3') if cert_diff
      == 3 else (K('ef_plus2') if cert_diff == 2 else (K('ef_plus1') if cert_diff == 1 else (K('ef_zero') if cert_diff
      == 0 else (K('ef_minus1') if cert_diff == -1 else K('ef_minus2'))))))) if (cert_bfe != None and cert_bfe !=
      '' and cert_months < K('fresh_survey_months')) else ((K('ef_plus4') if (cert_diff - 1) >= 4 else (K('ef_plus3')
      if (cert_diff - 1) == 3 else (K('ef_plus2') if (cert_diff - 1) == 2 else (K('ef_plus1') if (cert_diff - 1)
      == 1 else (K('ef_zero') if (cert_diff - 1) == 0 else (K('ef_minus1') if (cert_diff - 1) == -1 else K('ef_minus2')))))))
      if (cert_bfe != None and cert_bfe != '' and cert_months < P('ec_max_age_years') * 12) else P('no_ec_factor_sfha')))
  - vent_flag: >-
      LATEST('homeflood_changes', 'ec_flood_openings', date_field='recorded_date', event_type='homeflood_ec_received')
      if (cert_survey and MONTHS(cert_survey, cert_received) < P('ec_max_age_years') * 12) else False
  - vent_credit: >-
      K('vent_elevated_pct') if (vent_flag == True and cert_bfe != None and cert_bfe != '' and cert_diff >= 0) else
      (P('mitigation_credit_pct') if vent_flag == True else 0)
  - nfip_id: >-
      CFIELD('dwelling', 'dwelling_policy_id', policy_number=F('replaced_nfip_policy_number'))
  - nfip_orig: >-
      CFIELD('dwelling', 'original_effective_date', policy_number=F('replaced_nfip_policy_number'))
  - insured_months: MONTHS(nfip_orig if nfip_orig else F('effective_date'), NOW)
  - hf_net_long: >-
      SUM('homeflood_claims', 'payment_amount', within_months=K('loss_free_long_months'), date_field='date_of_loss',
      event_type='homeflood_claim_paid') - SUM('homeflood_claims', 'payment_amount', within_months=K('loss_free_long_months'),
      date_field='date_of_loss', event_type='homeflood_claim_payment_voided')
  - nf_net_long: >-
      XSUM('dwelling', 'dwelling_claims', 'payment_amount', within_months=K('loss_free_long_months'), date_field='date_of_loss',
      event_type='dwelling_claim_paid', dwelling_policy_id=nfip_id) - XSUM('dwelling', 'dwelling_claims', 'payment_amount',
      within_months=K('loss_free_long_months'), date_field='date_of_loss', event_type='dwelling_claim_payment_voided',
      dwelling_policy_id=nfip_id)
  - hf_net_short: >-
      SUM('homeflood_claims', 'payment_amount', within_months=P('claims_free_years') * 12, date_field='date_of_loss',
      event_type='homeflood_claim_paid') - SUM('homeflood_claims', 'payment_amount', within_months=P('claims_free_years')
      * 12, date_field='date_of_loss', event_type='homeflood_claim_payment_voided')
  - nf_net_short: >-
      XSUM('dwelling', 'dwelling_claims', 'payment_amount', within_months=P('claims_free_years') * 12, date_field='date_of_loss',
      event_type='dwelling_claim_paid', dwelling_policy_id=nfip_id) - XSUM('dwelling', 'dwelling_claims', 'payment_amount',
      within_months=P('claims_free_years') * 12, date_field='date_of_loss', event_type='dwelling_claim_payment_voided',
      dwelling_policy_id=nfip_id)
  - loss_credit: >-
      K('loss_free_long_pct') if (hf_net_long == 0 and nf_net_long == 0 and insured_months >= K('loss_free_long_months'))
      else (P('claims_free_credit_pct') if (hf_net_short == 0 and nf_net_short == 0 and insured_months >= P('claims_free_years')
      * 12) else 0)
  - xs_eff: >-
      CFIELD('excess', 'effective_date', status='active', property_address=F('property_address'))
  - xs_limit: >-
      CFIELD('excess', 'excess_building_limit', status='active', property_address=F('property_address'))
  - xs_in_force: xs_eff != None and xs_eff != '' and DAYS(xs_eff, F('term_start')) >= 0
  - layer_credit: >-
      P('package_credit_pct') if (xs_in_force and xs_limit >= K('layer_large_limit')) else (K('layer_small_pct')
      if xs_in_force else 0)
  - nf_primary: >-
      CFIELD('dwelling', 'primary_residence', policy_number=F('replaced_nfip_policy_number'))
  - occupancy_factor: >-
      K('occ_primary') if nf_primary == True else (K('occ_secondary') if nf_primary == False else 1)
  - nf_reason: >-
      CFIELD('dwelling', 'cancellation_reason', policy_number=F('replaced_nfip_policy_number'))
  - nf_cxl_eff: >-
      CFIELD('dwelling', 'cancellation_effective_date', policy_number=F('replaced_nfip_policy_number'))
  - transfer_factor: >-
      1 - K('transfer_long_pct') / 100 if (nf_reason == 'REPLACED_BY_PRIVATE_FLOOD' and MONTHS(nfip_orig, nf_cxl_eff)
      >= K('transfer_long_months')) else (1 - K('transfer_short_pct') / 100 if nf_reason == 'REPLACED_BY_PRIVATE_FLOOD'
      else 1)
  - credit_pct: MN(P('max_combined_credit_pct'), vent_credit + loss_credit + layer_credit)
  - result: >-
      MX(P('minimum_premium'), RND(base_rate_amount * zone_factor * elev_factor * deductible_factor * occupancy_factor
      * transfer_factor * (1 - credit_pct / 100) + P('loss_of_use_premium'), 2))
  compute_basis:
    base_rate_amount: >-
      The standard re-rating takes the dwelling limit divided by 100 times building_rate_per_100 plus the personal
      property limit divided by 100 times contents_rate_per_100, multiplies that sum by the zone factor for the
      flood zone from zone_factor_table, by the elevation factor no_ec_factor_sfha (no_ec_factor_non_sfha for a
      property in zone X, B, C or D) and by the deductible_factor_table row for the deductible on the policy, adds
      loss_of_use_premium, rounds the total to the cent once at the end, and never lets it fall below minimum_premium;
      the credit percent recorded on the policy for the term is not carried into the re-rating.
    zone_factor: >-
      The standard re-rating takes the dwelling limit divided by 100 times building_rate_per_100 plus the personal
      property limit divided by 100 times contents_rate_per_100, multiplies that sum by the zone factor for the
      flood zone from zone_factor_table, by the elevation factor no_ec_factor_sfha (no_ec_factor_non_sfha for a
      property in zone X, B, C or D) and by the deductible_factor_table row for the deductible on the policy, adds
      loss_of_use_premium, rounds the total to the cent once at the end, and never lets it fall below minimum_premium;
      the credit percent recorded on the policy for the term is not carried into the re-rating.
    deductible_factor: >-
      The standard re-rating takes the dwelling limit divided by 100 times building_rate_per_100 plus the personal
      property limit divided by 100 times contents_rate_per_100, multiplies that sum by the zone factor for the
      flood zone from zone_factor_table, by the elevation factor no_ec_factor_sfha (no_ec_factor_non_sfha for a
      property in zone X, B, C or D) and by the deductible_factor_table row for the deductible on the policy, adds
      loss_of_use_premium, rounds the total to the cent once at the end, and never lets it fall below minimum_premium;
      the credit percent recorded on the policy for the term is not carried into the re-rating.
    outside_sfha: >-
      The standard re-rating takes the dwelling limit divided by 100 times building_rate_per_100 plus the personal
      property limit divided by 100 times contents_rate_per_100, multiplies that sum by the zone factor for the
      flood zone from zone_factor_table, by the elevation factor no_ec_factor_sfha (no_ec_factor_non_sfha for a
      property in zone X, B, C or D) and by the deductible_factor_table row for the deductible on the policy, adds
      loss_of_use_premium, rounds the total to the cent once at the end, and never lets it fall below minimum_premium;
      the credit percent recorded on the policy for the term is not carried into the re-rating.
    cert_received: >-
      The certificate under review is the most recently received Elevation Certificate entry on the policy, read
      for its survey date, the date Tidemark received it, its base flood elevation, its elevation difference and
      its flood openings. Where this rule takes the latest or most recent of several records, it orders them by
      the date it names, and among records of the same date the one recorded first counts.
    cert_survey: >-
      The certificate under review is the most recently received Elevation Certificate entry on the policy, read
      for its survey date, the date Tidemark received it, its base flood elevation, its elevation difference and
      its flood openings. Where this rule takes the latest or most recent of several records, it orders them by
      the date it names, and among records of the same date the one recorded first counts.
    cert_bfe: >-
      The certificate under review is the most recently received Elevation Certificate entry on the policy, read
      for its survey date, the date Tidemark received it, its base flood elevation, its elevation difference and
      its flood openings. Where this rule takes the latest or most recent of several records, it orders them by
      the date it names, and among records of the same date the one recorded first counts.
    cert_diff: >-
      The certificate under review is the most recently received Elevation Certificate entry on the policy, read
      for its survey date, the date Tidemark received it, its base flood elevation, its elevation difference and
      its flood openings. Where this rule takes the latest or most recent of several records, it orders them by
      the date it names, and among records of the same date the one recorded first counts.
    cert_months: >-
      For a property in zone X, B, C or D the elevation factor of the re-rated term premium is no_ec_factor_non_sfha,
      and for a property in any other zone it follows the age of the certificate under review, counted in whole
      calendar months from its survey date to the date Tidemark received it: a certificate that shows a base flood
      elevation and was surveyed fewer than fresh_survey_months whole months before receipt takes the elevation_factor_table
      row for its elevation difference as certified, a certificate that shows a base flood elevation and was surveyed
      at least fresh_survey_months but fewer than ec_max_age_years times 12 whole months before receipt takes the
      elevation_factor_table row for its elevation difference less one foot, because Tidemark rates an older survey
      one foot more conservatively, and any other case takes no_ec_factor_sfha; a difference of 4 feet or more takes
      the "+4 or more" row and one of -2 feet or lower takes the "-2 or lower" row; for every other HomeFlood rating
      the elevation factor is no_ec_factor_non_sfha for a property in zone X, B, C or D and, in any other zone,
      the elevation_factor_table row for elevation_difference_ft when an accepted Elevation Certificate showing
      a base flood elevation is on file and no_ec_factor_sfha when none is on file.
    elev_factor: >-
      For a property in zone X, B, C or D the elevation factor of the re-rated term premium is no_ec_factor_non_sfha,
      and for a property in any other zone it follows the age of the certificate under review, counted in whole
      calendar months from its survey date to the date Tidemark received it: a certificate that shows a base flood
      elevation and was surveyed fewer than fresh_survey_months whole months before receipt takes the elevation_factor_table
      row for its elevation difference as certified, a certificate that shows a base flood elevation and was surveyed
      at least fresh_survey_months but fewer than ec_max_age_years times 12 whole months before receipt takes the
      elevation_factor_table row for its elevation difference less one foot, because Tidemark rates an older survey
      one foot more conservatively, and any other case takes no_ec_factor_sfha; a difference of 4 feet or more takes
      the "+4 or more" row and one of -2 feet or lower takes the "-2 or lower" row; for every other HomeFlood rating
      the elevation factor is no_ec_factor_non_sfha for a property in zone X, B, C or D and, in any other zone,
      the elevation_factor_table row for elevation_difference_ft when an accepted Elevation Certificate showing
      a base flood elevation is on file and no_ec_factor_sfha when none is on file. For a certificate review under
      this rule, and only for it, a certificate entry is accepted for rating when its survey date falls fewer than
      ec_max_age_years times 12 whole calendar months before the date Tidemark received it, Tidemark recording an
      Elevation Certificate entry only for a certificate on FEMA Form 086-0-33, completed and sealed by a licensed
      land surveyor, engineer or architect, for a building not altered since the survey; for every other use, a
      certificate is accepted for rating only when it is on FEMA Form 086-0-33, completed and sealed by a licensed
      land surveyor, engineer or architect, with no alteration to the building since the survey, and its survey
      date is no more than ec_max_age_years before the date Tidemark receives it.
    vent_flag: >-
      The certificate under review is the most recently received Elevation Certificate entry on the policy, read
      for its survey date, the date Tidemark received it, its base flood elevation, its elevation difference and
      its flood openings. For a certificate review under this rule, and only for it, a certificate entry is accepted
      for rating when its survey date falls fewer than ec_max_age_years times 12 whole calendar months before the
      date Tidemark received it, Tidemark recording an Elevation Certificate entry only for a certificate on FEMA
      Form 086-0-33, completed and sealed by a licensed land surveyor, engineer or architect, for a building not
      altered since the survey; for every other use, a certificate is accepted for rating only when it is on FEMA
      Form 086-0-33, completed and sealed by a licensed land surveyor, engineer or architect, with no alteration
      to the building since the survey, and its survey date is no more than ec_max_age_years before the date Tidemark
      receives it. Where this rule takes the latest or most recent of several records, it orders them by the date
      it names, and among records of the same date the one recorded first counts.
    vent_credit: >-
      The flood-vent credit of the re-rated term premium is vent_elevated_pct when the certificate under review
      is accepted for rating and certifies engineered flood openings and shows an elevation difference of zero or
      more, is mitigation_credit_pct when it is accepted for rating, certifies engineered flood openings and shows
      a negative elevation difference or no base flood elevation, and is nothing when it certifies no engineered
      flood openings or is not accepted for rating; for every other HomeFlood rating the mitigation credit of mitigation_credit_pct
      applies when the accepted certificate on file certifies engineered flood openings.
    nfip_id: >-
      The customer's NFIP record for the address is the Tidemark NFIP Dwelling Form policy this HomeFlood policy
      replaced, the one whose policy number is the policy's replaced NFIP policy number; a HomeFlood policy that
      replaced no NFIP policy has no NFIP record.
    nfip_orig: >-
      The loss-history credit of the re-rated term premium, which counts every window and length of time to the
      re-rating date (the day the certificate review is completed and recorded, neither the date Tidemark received
      the certificate nor the term start), looks at claim payments net of voided payments, by date of loss, under
      this HomeFlood policy and under the customer's NFIP record for the address, and at how long Tidemark has insured
      the address, counted in whole months to the re-rating date from the original effective date of that NFIP record
      or, without one, from this policy's effective date: it is loss_free_long_pct when the net payments for losses
      dated fewer than loss_free_long_months whole months before the re-rating date total zero under this policy
      and zero under the NFIP record and Tidemark has insured the address for at least loss_free_long_months whole
      months, it is claims_free_credit_pct when that longer condition is not met but the net payments for losses
      dated fewer than claims_free_years times 12 whole months before the re-rating date total zero under this policy
      and zero under the NFIP record and Tidemark has insured the address for at least claims_free_years times 12
      whole months, and otherwise there is no loss-history credit; for every other HomeFlood rating the claims-free
      credit of claims_free_credit_pct applies when the customer has held Tidemark flood coverage on the property
      since a date on or before the start of the lookback period and no claim with a net payment above zero has
      a date of loss in that period.
    insured_months: >-
