      days after, and nothing when it was booked sooner or no term premium item is booked for that term.
    xs_status: >-
      The Excess paid-up credit of this installment reads the customer's Tidemark Excess Flood policy in status
      active at the same address (the Excess Flood program allows only one live policy on an address): it is excess_paid_long_pct
      percent of the later-installment share when that policy exists and shows a premium balance of zero or less,
      excess_paid_short_pct percent when it is active but still shows a balance owed, and nothing when there is
      no active Excess Flood policy at the address.
    xs_balance: >-
      The Excess paid-up credit of this installment reads the customer's Tidemark Excess Flood policy in status
      active at the same address (the Excess Flood program allows only one live policy on an address): it is excess_paid_long_pct
      percent of the later-installment share when that policy exists and shows a premium balance of zero or less,
      excess_paid_short_pct percent when it is active but still shows a balance owed, and nothing when there is
      no active Excess Flood policy at the address.
    excess_pct: >-
      The Excess paid-up credit of this installment reads the customer's Tidemark Excess Flood policy in status
      active at the same address (the Excess Flood program allows only one live policy on an address): it is excess_paid_long_pct
      percent of the later-installment share when that policy exists and shows a premium balance of zero or less,
      excess_paid_short_pct percent when it is active but still shows a balance owed, and nothing when there is
      no active Excess Flood policy at the address.
    result: >-
      The installment due is the later-installment share adjusted by every amount, part and percent credit this
      rule states for this installment, each percent taken of the later-installment share; it is rounded to the
      cent once at the end and is never below zero; for an installment paid under this rule, and only for it, this
      replaces the base way of working out an installment, and for every other installment the policy fee is collected
      in full with the first payment, each installment after the first carries installment_fee, every installment
      is rounded to the cent and the last installment absorbs the rounding difference. Every rounding to the cent
      this rule states takes the nearest cent, an amount lying exactly halfway between two cents going to the even
      cent.
  factors:
  - id: deposit_spread
    effect: method
    decides: deposit_part
    bindings:
    - deposit
    - deposit_diff
    - deposit_part
    ladder:
    - when: three or more installments of the term are still to come
      method: >-
        the deposit difference is spread equally over the installments still to come and this installment gives
        back one equal part
    - when: one or two installments are still to come
      method: the next installment gives back the whole deposit difference
    - when: otherwise
      method: the deposit difference is settled separately and not through an installment
    baseline:
      deposit_part: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: earlier_term_credit
    effect: method
    decides: credit_part
    bindings:
    - all_balance
    - cur_balance
    - closed_credit
    - credit_part
    ladder:
    - when: the plan is QUARTERLY and two or more installments are still to come
      method: >-
        the earlier-term credit balance is spread equally over the installments still to come and this installment
        takes one equal part
    - when: the plan is SEMI_ANNUAL, or only one installment is still to come
      method: the earlier-term credit balance is applied in full to the next installment
    - when: otherwise
      method: >-
        the earlier-term credit balance is refunded separately and not taken into an installment
    baseline:
      credit_part: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: autopay_fee
    effect: parameter
    decides: fee
    bindings:
    - pay12
    - ach12
    - fee
    ladder:
    - when: >-
        every premium payment on the policy in the 12 whole months before the payment date was made by ACH and there
        were at least 4
      value: K('fee_autopay')
    - when: >-
        there were one to three premium payments in those 12 whole months and every one was made by ACH
      value: K('fee_partial')
    - when: otherwise (no payment in the window, or any made another way)
      value: P('installment_fee')
    baseline:
      fee: P('installment_fee')
    evidence:
    - history
    cross_difficulty: null
  - id: pay_ahead
    effect: parameter
    decides: pay_ahead_pct
    bindings:
    - prev_due_months
    - since_prev
    - pay_ahead_pct
    ladder:
    - when: >-
        paid while fewer than one whole month has passed since the previous installment's due date
      value: K('pay_ahead_long_pct')
    - when: paid when at least one but fewer than two whole months have passed since it
      value: K('pay_ahead_short_pct')
    - when: otherwise
      value: '0'
    baseline:
      pay_ahead_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: booking_delay
    effect: parameter
    decides: booking_pct
    bindings:
    - booked_on
    - booking_lag
    - booking_pct
    ladder:
    - when: >-
        the term's TERM_PREMIUM item was booked more than booking_delay_long_days days after term_start
      value: K('booking_delay_long_pct')
    - when: >-
        it was booked more than booking_delay_short_days but no more than booking_delay_long_days days after term_start
      value: K('booking_delay_short_pct')
    - when: otherwise
      value: '0'
    baseline:
      booking_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: excess_paid_up
    effect: parameter
    decides: excess_pct
    bindings:
    - xs_status
    - xs_balance
    - excess_pct
    ladder:
    - when: >-
        the customer's Tidemark Excess Flood policy at the same address is active and shows a premium balance of
        zero or less
      value: K('excess_paid_long_pct')
    - when: it is active but still shows a balance owed
      value: K('excess_paid_short_pct')
    - when: otherwise
      value: '0'
    baseline:
      excess_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: excess
  baseline:
    rule: >-
      The standard installment after the first is the later-installment share of the TERM_PREMIUM item booked for
      the term, later_share_quarterly percent on QUARTERLY and later_share_semi percent on SEMI_ANNUAL, plus installment_fee,
      rounded to the cent.
    params:
    - installment_fee
    - later_share_quarterly
    - later_share_semi
  inputs:
    history:
    - table: homeflood_billing
      aggregate: sum
      field: amount
      filters:
        event_type: homeflood_premium_payment
    - table: homeflood_billing
      aggregate: count
      field: payment_method
      within_months: 12
      filters:
        event_type: homeflood_premium_payment
    cross_category:
    - excess
- id: homeflood_ext_sale_cancellation
  base_policy_refs:
  - homeflood_cancellation_refund
  - homeflood_ec_rating
  - homeflood_endorsements
  - homeflood_insurer_notices
  overwrite:
  - base_policy: homeflood_cancellation_refund
    superseded_clause: >-
      The refund follows cancellation_refund_method: the unearned share of the term premium and of any ENDORSEMENT_PREMIUM
      items, net of ENDORSEMENT and RERATE credits already given, is the full-term net amount multiplied by the
      days from the cancellation effective date to term_end divided by the days from term_start to term_end, rounded
      to the cent.
    replaced_by: >-
      The standard cancellation credit takes the term premium booked for the term — the TERM_PREMIUM item plus any
      ENDORSEMENT_PREMIUM items, less the ENDORSEMENT and RERATE credits already given on the term — multiplies
      it by the days from the request's effective date to term_end divided by the days from term_start to term_end,
      returns short_rate_pct percent of that pro rata amount, takes off the exit fee exit_fee_standard, and rounds
      the credit to the cent. For a cancellation processed under this rule, and only for it, the credit is worked
      out as this rule states, and every other cancellation credit is the unearned share of the term premium and
      of any ENDORSEMENT_PREMIUM items, net of ENDORSEMENT and RERATE credits already given, worked out by cancellation_refund_method
      as the full-term net amount multiplied by the days from the cancellation effective date to term_end divided
      by the days from term_start to term_end, rounded to the cent. The earning basis of the cancellation credit
      is a full return of the term premium booked for the term when the request's effective date is on or before
      term_start; it is the pro rata amount itself when the request gives PROPERTY_SOLD with a settlement statement
      or REPLACED_COVERAGE with the replacing policy's declarations on file; and otherwise it is short_rate_pct
      percent of the pro rata amount. The loss-of-use return of the cancellation credit — the part of the return
      that comes from loss_of_use_premium — is nothing when a claim on the policy paid loss-of-use money, net of
      voided payments, for a loss dated fewer than 12 whole months before the processing date, lou_half_pct percent
      when claims paid other coverages but no loss-of-use money for such losses, and the full share otherwise.
  - base_policy: homeflood_cancellation_refund
    superseded_clause: >-
      The policy fee and installment fees are fully earned when policy_fee_refundable is false.
    replaced_by: >-
      The policy-fee return of the cancellation credit is all of policy_fee when the request's effective date is
      fewer than fee_flat_days days after term_start, fee_part_pct percent of policy_fee when it falls later but
      leaves at least fee_part_months whole months of the term, and nothing otherwise; installment fees stay fully
      earned in the cancellation credit; this policy-fee return applies only to a cancellation credit worked out
      under this rule, and in every other cancellation credit the policy fee and installment fees are fully earned
      when policy_fee_refundable is false.
  - base_policy: homeflood_cancellation_refund
    superseded_clause: >-
      When no_refund_after_paid_claim is true and a claim with a date of loss in the current term has a net payment
      above zero (homeflood_msr_term_claims_paid above zero), the term premium is fully earned and no credit is
      booked.
    replaced_by: >-
      The paid-claim share of the premium return — the term-premium part and the loss-of-use part of the return,
      before any policy-fee return or exit fee — is nothing when the claim payments on the policy, net of voided
      payments, for losses dated fewer than 12 whole months before the processing date total more than zero and
      at least claim_heavy_pct percent of the policy's dwelling limit and personal property limit taken together,
      claim_light_share percent of it when they total more than zero but less than that, and all of it when they
      total zero; this share applies only to a cancellation credit worked out under this rule, and for every other
      cancellation, when no_refund_after_paid_claim is true and a claim with a date of loss in the current term
      has a net payment above zero, the term premium is fully earned and no credit is booked.
  trigger: state_due
  subject:
  - homeflood_policy_cancelled
  - homeflood_premium_credit
  computes: credit_amount
  target_tool: process_cancellation_request_bf9010ee
  params:
    short_rate_pct: 90
    lou_half_pct: 50
    claim_heavy_pct: 25
    claim_light_share: 50
    fee_flat_days: 30
    fee_part_pct: 50
    fee_part_months: 2
    exit_free_months: 60
    exit_mid_months: 12
    exit_fee_mid: 15
    exit_fee_standard: 35
  rule: >-
    A cancellation is processed only on the named insured's signed cancellation request on file for the policy and
    only on a policy whose status is pending_effective or active; processing leaves the policy cancelled with the
    request's reason and the request's effective date, and books the return of premium as one CANCELLATION credit
    of the TERM_PREMIUM item referenced to the request. The request on file is the policy's signed cancellation
    request (the latest received, when more than one is signed; a withdrawn or unsigned request never counts), read
    for its reason, its effective date and its supporting document. The processing date is the day the cancellation
    is processed and recorded, and every window this rule counts to the processing date ends on that day. The standard
    cancellation credit takes the term premium booked for the term — the TERM_PREMIUM item plus any ENDORSEMENT_PREMIUM
    items, less the ENDORSEMENT and RERATE credits already given on the term — multiplies it by the days from the
    request's effective date to term_end divided by the days from term_start to term_end, returns short_rate_pct
    percent of that pro rata amount, takes off the exit fee exit_fee_standard, and rounds the credit to the cent.
    For a cancellation processed under this rule, and only for it, the credit is worked out as this rule states,
    and every other cancellation credit is the unearned share of the term premium and of any ENDORSEMENT_PREMIUM
    items, net of ENDORSEMENT and RERATE credits already given, worked out by cancellation_refund_method as the
    full-term net amount multiplied by the days from the cancellation effective date to term_end divided by the
    days from term_start to term_end, rounded to the cent. The earning basis of the cancellation credit is a full
    return of the term premium booked for the term when the request's effective date is on or before term_start;
    it is the pro rata amount itself when the request gives PROPERTY_SOLD with a settlement statement or REPLACED_COVERAGE
    with the replacing policy's declarations on file; and otherwise it is short_rate_pct percent of the pro rata
    amount. The loss-of-use return of the cancellation credit — the part of the return that comes from loss_of_use_premium
    — is nothing when a claim on the policy paid loss-of-use money, net of voided payments, for a loss dated fewer
    than 12 whole months before the processing date, lou_half_pct percent when claims paid other coverages but no
    loss-of-use money for such losses, and the full share otherwise. The paid-claim share of the premium return
    — the term-premium part and the loss-of-use part of the return, before any policy-fee return or exit fee — is
    nothing when the claim payments on the policy, net of voided payments, for losses dated fewer than 12 whole
    months before the processing date total more than zero and at least claim_heavy_pct percent of the policy's
    dwelling limit and personal property limit taken together, claim_light_share percent of it when they total more
    than zero but less than that, and all of it when they total zero; this share applies only to a cancellation
    credit worked out under this rule, and for every other cancellation, when no_refund_after_paid_claim is true
    and a claim with a date of loss in the current term has a net payment above zero, the term premium is fully
    earned and no credit is booked. The policy-fee return of the cancellation credit is all of policy_fee when the
    request's effective date is fewer than fee_flat_days days after term_start, fee_part_pct percent of policy_fee
    when it falls later but leaves at least fee_part_months whole months of the term, and nothing otherwise; installment
    fees stay fully earned in the cancellation credit; this policy-fee return applies only to a cancellation credit
    worked out under this rule, and in every other cancellation credit the policy fee and installment fees are fully
    earned when policy_fee_refundable is false. The exit fee taken from the cancellation credit is nothing when
    the policy had been in force for at least exit_free_months whole months on the request's effective date, exit_fee_mid
    when it had been in force for at least exit_mid_months but fewer than exit_free_months whole months, and exit_fee_standard
    otherwise. The cancellation credit is put together in this order: every share and percent this rule states is
    first applied to the part of the premium return it names, every amount this rule states is then added to or
    taken from that result, and the credit is rounded to the cent once at the end and is never below zero. Where
    this rule takes the latest or most recent of several records, it orders them by the date it names, and among
    records of the same date the one recorded first counts. Every rounding to the cent this rule states takes the
    nearest cent, an amount lying exactly halfway between two cents going to the even cent.
  prerequisite: []
  cross_category: []
  compute:
  - req_reason: >-
      LATEST('homeflood_requests', 'cancellation_reason', date_field='created_at', request_type='CANCELLATION',
      outcome='SIGNED')
  - req_eff: >-
      LATEST('homeflood_requests', 'requested_effective_date', date_field='created_at', request_type='CANCELLATION',
      outcome='SIGNED')
  - req_doc: >-
      LATEST('homeflood_requests', 'supporting_document', date_field='created_at', request_type='CANCELLATION',
      outcome='SIGNED')
  - term_net: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged', term_start=F('term_start'), component='TERM_PREMIUM')
      + SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged', term_start=F('term_start'), component='ENDORSEMENT_PREMIUM')
      - SUM('homeflood_billing', 'amount', event_type='homeflood_premium_credit', term_start=F('term_start'), charge_basis='ENDORSEMENT')
      - SUM('homeflood_billing', 'amount', event_type='homeflood_premium_credit', term_start=F('term_start'), charge_basis='RERATE')
  - lou_part: P('loss_of_use_premium')
  - pro_rata_frac: DAYS(req_eff, F('term_end')) / DAYS(F('term_start'), F('term_end'))
  - earning_frac: >-
      1 if DAYS(req_eff, F('term_start')) >= 0 else (pro_rata_frac if ((req_reason == 'PROPERTY_SOLD' and req_doc
      == 'SETTLEMENT_STATEMENT') or (req_reason == 'REPLACED_COVERAGE' and req_doc == 'REPLACEMENT_DECLARATIONS'))
      else K('short_rate_pct') / 100 * pro_rata_frac)
  - lou_paid: >-
      SUM('homeflood_claims', 'payment_amount', event_type='homeflood_claim_paid', coverage_part="LOSS_OF_USE",
      within_months=12, date_field='date_of_loss') - SUM('homeflood_claims', 'payment_amount', event_type='homeflood_claim_payment_voided',
      coverage_part="LOSS_OF_USE", within_months=12, date_field='date_of_loss')
  - other_paid: >-
      SUM('homeflood_claims', 'payment_amount', event_type='homeflood_claim_paid', within_months=12, date_field='date_of_loss')
      - SUM('homeflood_claims', 'payment_amount', event_type='homeflood_claim_payment_voided', within_months=12,
      date_field='date_of_loss') - lou_paid
  - lou_pct: 0 if lou_paid > 0 else (K('lou_half_pct') if other_paid > 0 else 100)
  - claim_net: >-
      SUM('homeflood_claims', 'payment_amount', event_type='homeflood_claim_paid', within_months=12, date_field='date_of_loss')
      - SUM('homeflood_claims', 'payment_amount', event_type='homeflood_claim_payment_voided', within_months=12,
      date_field='date_of_loss')
  - claim_pct: >-
      0 if (claim_net > 0 and claim_net >= K('claim_heavy_pct') / 100 * (F('building_coverage') + F('contents_coverage')))
      else (K('claim_light_share') if claim_net > 0 else 100)
  - fee_return: >-
      P('policy_fee') if DAYS(F('term_start'), req_eff) < K('fee_flat_days') else (K('fee_part_pct') / 100 * P('policy_fee')
      if MONTHS(req_eff, F('term_end')) >= K('fee_part_months') else 0)
  - exit_fee: >-
      0 if MONTHS(F('effective_date'), req_eff) >= K('exit_free_months') else (K('exit_fee_mid') if MONTHS(F('effective_date'),
      req_eff) >= K('exit_mid_months') else K('exit_fee_standard'))
  - result: >-
      MX(0, RND((term_net - lou_part) * earning_frac * claim_pct / 100 + lou_part * earning_frac * lou_pct / 100
      * claim_pct / 100 + fee_return - exit_fee, 2))
