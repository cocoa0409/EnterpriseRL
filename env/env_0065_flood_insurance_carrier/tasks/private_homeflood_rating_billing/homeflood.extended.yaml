      not added or removed mid-term.
    layer_credit: >-
      The layer credit of the re-rated term premium follows the customer's Tidemark Excess Flood policy in status
      active at the same property address (the Excess Flood program allows only one live policy on an address),
      which counts as in force on the term start when it took effect on or before the term start: such a policy
      with an excess building limit of at least layer_large_limit earns package_credit_pct, such a policy with a
