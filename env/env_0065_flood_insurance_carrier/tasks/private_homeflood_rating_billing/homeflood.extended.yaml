- id: homeflood_ext_rerate_credit
  base_policy_refs:
  - homeflood_ec_rating
  - homeflood_endorsements
  - homeflood_cancellation_refund
  - homeflood_insurer_notices
  overwrite:
  - base_policy: homeflood_ec_rating
    superseded_clause: >-
      When the re-rated term premium is lower, the certificate is applied (ec_applied true) from the date it is
      received and the reduction is credited as a RERATE credit equal to the fall in the full-term premium multiplied
      by the days from the receipt date to term_end divided by the days from term_start to term_end, rounded to
      the cent.
    replaced_by: >-
      When a certificate review has re-rated the policy's current term lower than the full-term premium in force,
      the certificate is applied (ec_applied true) from the date it is received, and the reduction is credited to
      that term as one RERATE credit of the TERM_PREMIUM item, referenced to the certificate entry; for the re-rate
      credit of a certificate review, and only for it, the credit is worked out under this rule, and every other
      RERATE credit equals the fall in the full-term premium multiplied by the days from the receipt date to term_end
      divided by the days from term_start to term_end, rounded to the cent.
  trigger: state_due
  subject:
  - homeflood_premium_credit
  computes: credit_amount
  target_tool: book_rerate_credit_70dc8da2
  params:
    delay_long_days: 60
    delay_long_pct: 4
    delay_short_days: 30
    delay_short_pct: 2
    early_receipt_days: 30
    fresh_vent_pct: 10
    older_vent_pct: 5
    fresh_vent_months: 3
  rule: >-
    When a certificate review has re-rated the policy's current term lower than the full-term premium in force,
    the certificate is applied (ec_applied true) from the date it is received, and the reduction is credited to
    that term as one RERATE credit of the TERM_PREMIUM item, referenced to the certificate entry; for the re-rate
    credit of a certificate review, and only for it, the credit is worked out under this rule, and every other RERATE
    credit equals the fall in the full-term premium multiplied by the days from the receipt date to term_end divided
    by the days from term_start to term_end, rounded to the cent. The re-rate credit is worked out only once the
    certificate entry carries its re-rated term premium in place of 0.00. The certificate under review is the most
    recently received Elevation Certificate entry on the policy, read for the date Tidemark received it, its survey
    date, its flood openings and its re-rated term premium. The standard re-rate credit takes the fall from the
    full-term premium booked as the TERM_PREMIUM item for the term to the certificate's re-rated term premium, multiplies
    it by the days from the date Tidemark received the certificate to term_end and divides by the days from term_start
    to term_end, giving the pro rata amount, which is rounded to the cent. The start date of the re-rate credit
    is the term start when Tidemark received the certificate before the term start or no more than early_receipt_days
    days after it, because a certificate submitted with the term rates the whole term; it is the certificate's survey
    date when Tidemark received it more than early_receipt_days days after the term start and the survey date falls
    after the term start, because the certificate then documents mitigation completed during the term; and otherwise
    it is the date Tidemark received the certificate. The premium the re-rate credit is measured from is the revised
    full-term premium of the latest endorsement entry on the policy when that entry was recorded within the term
    (on or after term_start and before term_end), since every endorsement entry carries the full-term premium in
    force as endorsed; when it was not, it is the premium on the renewal offer for the term when the term began
    as a renewal; and otherwise it is the full-term premium booked as the TERM_PREMIUM item for the term. The review
    counts as completed on the day this re-rate credit is booked. The review-delay addition of the re-rate credit
    is delay_long_pct percent of the pro rata amount when the review is completed more than delay_long_days days
    after Tidemark received the certificate, delay_short_pct percent when it is completed more than delay_short_days
    but no more than delay_long_days days after, and nothing when it is completed sooner. The mitigation-survey
    addition of the re-rate credit is fresh_vent_pct percent of the pro rata amount when the certificate under review
    certifies engineered flood openings and was surveyed fewer than fresh_vent_months whole months before Tidemark
    received it, older_vent_pct percent when it certifies engineered flood openings and was surveyed fresh_vent_months
    or more whole months before receipt, and nothing when it certifies no engineered flood openings. Every addition
    this rule states is a percent of the unrounded pro rata amount, the additions are added to that amount, and
    the re-rate credit is rounded to the cent once at the end, and never more than the net premium booked for the
    term (its TERM_PREMIUM and ENDORSEMENT_PREMIUM items less the ENDORSEMENT and RERATE credits already given on
    it). Where this rule takes the latest or most recent of several records, it orders them by the date it names,
    and among records of the same date the one recorded first counts. Every rounding to the cent this rule states
    takes the nearest cent, an amount lying exactly halfway between two cents going to the even cent.
  prerequisite:
  - problem: homeflood_ext_certificate_rerate
    kind: value_input
    gate: new_premium
    form: state
    policy_source: >-
      The re-rate credit is worked out only once the certificate entry carries its re-rated term premium in place
      of 0.00.
    condition: >-
      The most recently received homeflood_ec_received entry on the policy carries a revised_term_premium other
      than 0.00.
    resolved_by: apply_certificate_review_8d563756
    effect: >-
      new_premium changes from 0.00 to the re-rated term premium the certificate review records, which sets the
      fall the re-rate credit is worked out from.
  cross_category: []
  compute:
  - cert_received: >-
      LATEST('homeflood_changes', 'recorded_date', date_field='recorded_date', event_type='homeflood_ec_received')
  - cert_survey: >-
      LATEST('homeflood_changes', 'ec_survey_date', date_field='recorded_date', event_type='homeflood_ec_received')
  - new_premium: >-
      LATEST('homeflood_changes', 'revised_term_premium', date_field='recorded_date', event_type='homeflood_ec_received')
  - term_days: DAYS(F('term_start'), F('term_end'))
  - credit_start: >-
      F('term_start') if DAYS(F('term_start'), cert_received) <= K('early_receipt_days') else (cert_survey if DAYS(F('term_start'),
      cert_survey) > 0 else cert_received)
  - end_prem: >-
      LATEST('homeflood_changes', 'revised_term_premium', date_field='recorded_date', event_type='homeflood_endorsement_issued')
  - end_date: >-
      LATEST('homeflood_changes', 'recorded_date', date_field='recorded_date', event_type='homeflood_endorsement_issued')
  - offer_prem: >-
      LATEST('homeflood_changes', 'revised_term_premium', date_field='recorded_date', event_type='homeflood_renewal_offered',
      renewal_term_start=F('term_start'))
  - item_prem: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged', component='TERM_PREMIUM', term_start=F('term_start'))
  - prior_premium: >-
      end_prem if (end_date != None and DAYS(F('term_start'), end_date) >= 0 and DAYS(end_date, F('term_end')) >
      0) else (offer_prem if offer_prem != None else item_prem)
  - pro_rata: (prior_premium - new_premium) * DAYS(credit_start, F('term_end')) / term_days
  - review_days: DAYS(cert_received, NOW)
  - delay_pct: >-
      K('delay_long_pct') if review_days > K('delay_long_days') else (K('delay_short_pct') if review_days > K('delay_short_days')
      else 0)
  - cert_vents: >-
      LATEST('homeflood_changes', 'ec_flood_openings', date_field='recorded_date', event_type='homeflood_ec_received')
  - first_pct: >-
      K('fresh_vent_pct') if (cert_vents == True and MONTHS(cert_survey, cert_received) < K('fresh_vent_months'))
      else (K('older_vent_pct') if cert_vents == True else 0)
  - term_net_booked: >-
      SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged', component='TERM_PREMIUM', term_start=F('term_start'))
      + SUM('homeflood_billing', 'amount', event_type='homeflood_premium_charged', component='ENDORSEMENT_PREMIUM',
      term_start=F('term_start')) - SUM('homeflood_billing', 'amount', event_type='homeflood_premium_credit', charge_basis='ENDORSEMENT',
      term_start=F('term_start')) - SUM('homeflood_billing', 'amount', event_type='homeflood_premium_credit', charge_basis='RERATE',
      term_start=F('term_start'))
  - result: MN(term_net_booked, RND(pro_rata * (1 + (delay_pct + first_pct) / 100), 2))
