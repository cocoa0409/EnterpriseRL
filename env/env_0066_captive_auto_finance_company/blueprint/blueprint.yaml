name: env_0066_captive_auto_finance_company
company: Kestrel Motor Acceptance Corporation

background: |
  Kestrel Motor Acceptance Corporation, doing business as Kestrel Financial Services, is the captive finance subsidiary of Kestrel Motor North America, the US arm of a vehicle manufacturer that sells cars, SUVs, pickups and commercial vans through about 1,450 franchised Kestrel dealers.
  It buys retail installment sale contracts and leases from those dealers, services roughly 1.9 million consumer and business accounts from customer service centers in Irving, Texas and Chandler, Arizona, and speaks to customers in a plain, courteous and precise voice.
  Consumers finance new Kestrel vehicles under the Kestrel New Vehicle Retail Installment Sale Contract, tiered by credit as Kestrel New Vehicle Retail Tier 5, Tier 4, Tier 3, Tier 2, Tier 1 and Tier 1+.
  Used and certified pre-owned vehicles are financed under the Kestrel Pre-Owned Retail Installment Sale Contract, tiered as Kestrel Pre-Owned Retail Tier 5 through Kestrel Pre-Owned Retail Tier 1+.
  Customers who want lower payments with a large final installment choose the Kestrel Advantage Balloon Retail Installment Sale Contract, tiered as Kestrel Advantage Balloon Tier 5 through Kestrel Advantage Balloon Tier 1+.
  All three are simple-interest contracts held for their term, booked as a stream of payments, fees, extensions, notices and, at the end, a payoff and a lien release, or in default a repossession and a sale.
  Lessees hold the Kestrel Closed-End Consumer Lease, tiered as Kestrel Lease Tier 5 through Kestrel Lease Tier 1+, which runs from funding through monthly payments to a turn-in, an early termination or a purchase, with inspections, wear items and end-of-term charges booked at the end.
  Businesses lease work trucks, vans and cars under the Kestrel Commercial Fleet Lease, placed in the program tiers Kestrel Business Advantage, Kestrel Fleet Select, Kestrel Fleet Preferred, Kestrel Fleet Premier, Kestrel Fleet Enterprise and Kestrel National Fleet, one unit schedule per vehicle under a master lease agreement billed with monthly rental invoices.
  Kestrel dealers themselves finance their inventory on the Kestrel Dealer Wholesale Floorplan Line, graded Kestrel Wholesale Risk Grade 6 through Kestrel Wholesale Risk Grade 1, with unit advances, payoffs, curtailments, interest bills and audits.
  Vehicle owners may also buy the Kestrel Care Vehicle Service Contract as Kestrel Care Powertrain, Gold, Gold Plus, Platinum, Platinum Plus or Platinum Elite, often financed inside their contract or lease, which books claims, transfers and cancellation refunds.
  Most callers are individual consumers holding one or two Kestrel contracts or leases, frequently a retail contract on one household vehicle and a lease on another, sometimes with a Kestrel Care plan attached.
  They bring histories of on-time and late payments, returned payments, late charges and courtesy waivers, earlier due-date changes or extensions, and occasionally a repossession, a reinstatement or an unpaid lease-end bill.
  Business callers are fleet managers or owners of small and mid-sized companies, some of whom also finance individual work vehicles on business-titled retail or balloon contracts, and dealers call about their wholesale lines.
  Every account is governed by the law of the state where it was written, and the state-specific limits that apply to it were recorded on the account when it was booked.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_log

difficulties:
  - name: retail_payment_servicing
    claim:
      categories: [retail]
      event_types: [retail_payment, retail_payment_returned, retail_returned_payment_fee, retail_late_charge, retail_fee_waiver, retail_fee_payment,
                    retail_due_date_change, retail_extension, retail_schedule_updated, retail_payment_restriction_updated]
    summary: >
      Customers holding a Kestrel New Vehicle Retail Installment Sale Contract call to make or correct payments, ask why a late charge or returned-payment fee was assessed, request a courtesy waiver, move their monthly due date, or ask to extend one or more installments when money is tight, and their situations vary by credit tier, by how many installments they have paid, by days past due, by prior extensions and due-date changes, and by whether they also hold another Kestrel contract or lease.
      The governing records are the retail contract with its schedule, balances, state limits recorded at booking and history counters, its posting history of payments, reversals, fees and waivers, the customer's other Kestrel holdings, and the signature requests the customer must complete; the rules are retail_payment_posting for cutoff, allocation and channel fees, retail_late_charges for the grace period and the capped late charge, retail_returned_payment for reversals, fees and the certified-funds restriction, retail_fee_waivers for tiered courtesy allowances, retail_due_date_changes for its interval, lifetime limit and relationship alignment, and retail_extensions for its tiered eligibility, blackout, relationship gate, good-faith payment, fee and signed agreement.
      Payments, waivers, due-date changes and extensions are posted by the agent after verification, while signing an extension agreement is an act only the customer can perform and is handed to the customer to complete.
      Requests that no retail rule decides, such as a customer in an active bankruptcy, a demand to rewrite the contract rate, a principal reduction or a settlement of a performing account, can only be routed to a human representative as POLICY_NOT_COVERED.

  - name: lease_end_servicing
    claim:
      categories: [lease]
      event_types: [lease_maturity_extension, lease_maturity_extended, lease_extension_updated, lease_vehicle_turned_in, lease_early_terminated, lease_purchased,
                    lease_return_credit, lease_inspection_completed, lease_inspection_recorded, lease_wear_item_assessed, lease_wear_item_adjusted,
                    lease_end_charge, lease_end_charge_waiver, lease_security_deposit_applied, lease_security_deposit_refund, lease_purchase_quote,
                    lease_end_of_term_payment]
    summary: >
      Lessees on a Kestrel Closed-End Consumer Lease call as their lease nears its end or just after it ends, to extend month to month, to arrange a turn-in or an early return, to buy the vehicle themselves or through a Kestrel dealer, to question excess mileage or wear charges after the inspection, or to pay or dispute the end-of-term bill, and their settings differ by lease tier, by how close they are to maturity, by mileage driven against the allowance, by wear items found, by any extension months already used, and by whether they have just signed another new Kestrel lease or contract.
      The records involved are the lease with its Regulation M disclosure fields, balances and dates, the inspection reports and wear items, the lease postings and the lessee's own signature requests, and the customer's other Kestrel contracts; the rules are lease_maturity_extensions, lease_turn_in_and_inspection, lease_inspection_dispute, lease_end_of_term_charges with its tiered forgiveness caps and loyalty waivers, lease_purchase_option with its maturity and early prices and franchised-dealer restriction, and lease_early_termination with its shortfall, fees and tiered pull-ahead.
      The agent quotes, grants extensions, records inspection outcomes, bills and waives charges and posts payments, whereas turning the vehicle in, returning it early, signing a purchase or a dealer purchase authorization, and filing an inspection dispute are the lessee's own acts handed to the lessee.
      Requests the lease rules do not decide, such as transferring the lease to another person, a buyout by an independent or other-brand dealer, a vehicle that was totalled or stolen, or a lessee in bankruptcy, can only be routed to a human representative as POLICY_NOT_COVERED.

  - name: preowned_repossession_recovery
    claim:
      categories: [preowned]
      event_types: [preowned_repo_recalled, preowned_voluntary_surrender, preowned_reinstated, preowned_redeemed, preowned_payment, preowned_payoff_quote,
                    preowned_repo_expense, preowned_notice_mailed, preowned_repo_record_updated, preowned_personal_property_release, preowned_schedule_updated]
    summary: >
      Borrowers on a Kestrel Pre-Owned Retail Installment Sale Contract call when their account has been assigned for repossession, after the vehicle has been taken, or when they want to surrender it, asking how to stop the recovery, how to get the car back, what they owe and by when, or how to retrieve belongings left in it, and their settings vary by credit tier, by days past due, by whether the recovery was involuntary or a voluntary surrender, by how many days have passed since repossession and the notice of intent to sell, by prior reinstatements and by the state rules recorded on the contract.
      The governing records are the pre-owned contract with its repossession dates, state cure, reinstatement and notice periods and counters, the postings of payments, notices and repossession expenses, the customer's other Kestrel accounts and their days past due, and the customer's own requests; the rules are preowned_repossession_assignment for recall and notices, preowned_repossession_charges for agency, transport, storage and condition-report expenses and the personal-property hold, preowned_reinstatement_and_redemption for the tiered reinstatement window and count, the relationship gate and the two amounts, and preowned_sale_and_deficiency for the sale timing that bounds them.
      The agent states amounts, posts certified-funds payments, recalls assignments, reinstates or redeems the contract, records notices and expenses and releases personal property, while surrendering the vehicle is an act only the customer can perform and is handed to the customer.
      Situations the recovery rules do not decide, such as a borrower who reports a bankruptcy filing, a claim that the vehicle was taken wrongfully or with a breach of the peace, a demand to waive the deficiency outright, or an offer to settle below the authorized percentage, can only be routed to a human representative as POLICY_NOT_COVERED.

  - name: balloon_maturity_and_title
    claim:
      categories: [balloon]
      event_types: [balloon_maturity_election, balloon_terms_modified, balloon_refinance, balloon_vehicle_returned, balloon_return_inspection, balloon_return_charge,
                    balloon_return_credit, balloon_payoff_quote, balloon_payment, balloon_paid_in_full, balloon_lien_release, balloon_title_status_updated,
                    balloon_closed, balloon_overpayment_refund]
    summary: >
      Customers on a Kestrel Advantage Balloon Retail Installment Sale Contract call as the balloon installment approaches or has just fallen due, to decide whether to pay it off, refinance it or return the vehicle, to get a payoff figure for themselves, a refinancing lender, a trading dealer or an insurer, and afterwards to find out when and to whom the lien will be released or the title mailed, and their settings vary by balloon tier, by days before or after maturity, by recent late-charge history, by mileage and wear against the return allowance, by how the final funds were paid and by whether the lien is electronic or on paper.
      The records involved are the balloon contract with its balloon amount, maturity, return option, mileage allowance and title fields, its postings of payments, quotes, elections, refinances, return inspections and charges and lien releases, the customer's other Kestrel contracts and leases, and the customer's own signature requests; the rules are balloon_maturity_options, balloon_refinancing with its window, history gate, tiered term and rate and relationship rate reduction, balloon_vehicle_return with its window, mileage, wear forgiveness and loyalty-waived return fee, balloon_payoff_and_refunds for per-diem quotes and credit-balance refunds, and balloon_lien_releases for the funds hold, the release method and the recipient.
      The agent records elections, refinances, quotes, payments, return charges, lien releases and refunds, while returning the vehicle and signing an alternate-address title release request are acts only the customer can perform and are handed to the customer.
      Requests the balloon rules do not decide, such as a second refinance, refinancing a balance other than the balloon, returning a vehicle where the contract carries no return option, or sending a title to a party who did not pay off the contract without the customer's signed request, can only be routed to a human representative as POLICY_NOT_COVERED.

  - name: fleet_business_servicing
    claim:
      categories: [fleet]
      event_types: [fleet_payment, fleet_late_charge, fleet_charge_waiver, fleet_credit_refund, fleet_termination_noticed, fleet_termination_withdrawn,
                    fleet_unit_turned_in, fleet_unit_charge, fleet_sale_settlement, fleet_trac_surplus_credit, fleet_trac_deficiency_charge,
                    fleet_purchase_quote, fleet_purchase_settlement, fleet_unit_purchased, fleet_title_transfer]
    summary: >
      Fleet managers and owners of businesses leasing units under the Kestrel Commercial Fleet Lease call about rental invoices and late charges, about turning units in or buying them out, and about the terminal rental adjustment after a unit is sold, and their settings vary by program tier, by lease type (TRAC open-end or closed-end commercial), by months in service against the minimum term, by book value against auction proceeds, by invoice due dates, and by how many units and business-titled retail or balloon contracts the business holds with Kestrel.
      The records involved are the unit schedules with their capitalized cost, depreciation and lease rates, book value and dates, the fleet postings of invoices, payments, charges, settlements and title transfers, the business's retail and balloon contracts, and the authorized signer's requests; the rules are fleet_billing_and_payments for terms, grace and the late charge, fleet_charge_waivers for annual courtesy allowances, fleet_termination for notice, the minimum-term charge and closed-end charges, fleet_trac_settlement for the surplus share and deficiency, fleet_purchase_option for the buyout price, tax and title transfer, and fleet_agg_program_tier_and_credit_line for how the business's whole relationship places it in a tier.
      The agent applies payments, bills and waives charges, records turn-ins, settlements, quotes, purchases and title transfers, while giving a termination notice and signing a purchase option are acts only a named authorized signer of the business can perform and are handed to that signer.
      Requests the fleet rules do not decide, such as renegotiating the lease rate on an existing schedule, adding a unit beyond the credit line, a non-signer instructing a termination, or a disputed auction result, can only be routed to a human representative as POLICY_NOT_COVERED.
