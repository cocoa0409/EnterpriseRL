        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
      Kestrel Advantage Balloon Tier 4:
        due_date_change_lifetime_max: =due_date_change_lifetime_max
        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
      Kestrel Advantage Balloon Tier 3:
        due_date_change_lifetime_max: =due_date_change_lifetime_max
        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
      Kestrel Advantage Balloon Tier 2:
