- type: balloon_refinance
  target: balloon_transactions
  meaning: The balloon is re-amortized over a refinance term.
  grain: one row per refinance
  distinguish_by:
  - txn_date
  fields:
    txn_date: effective date
    amount: amount refinanced
    refinance_term_months: term
    refinance_apr: APR
