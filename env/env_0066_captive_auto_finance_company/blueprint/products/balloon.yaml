        extension_max_installments_per_request: =extension_max_installments_per_request
        extension_lifetime_max_installments: =extension_lifetime_max_installments
        extension_fee: =extension_fee
        extension_good_faith_pct: =extension_good_faith_pct
      Kestrel Advantage Balloon Tier 3:
        extension_min_payments_made: =extension_min_payments_made
        extension_max_days_past_due: =extension_max_days_past_due
        extension_max_installments_per_request: =extension_max_installments_per_request
        extension_lifetime_max_installments: =extension_lifetime_max_installments
        extension_fee: =extension_fee
        extension_good_faith_pct: =extension_good_faith_pct
      Kestrel Advantage Balloon Tier 2:
