- id: balloon_vehicle_return
  subject:
  - balloon_vehicle_returned
  - balloon_return_inspection
  - balloon_return_charge
  - balloon_return_credit
  - balloon_return_settled
  - balloon_return_charged_off
  rule: Returning the vehicle is the customer's own act at a Kestrel dealer, who records the odometer and signs
    the vehicle in. The vehicle may be returned only when return_option_available is true, days_past_due is 0 apart
    from the balloon installment itself, and the return date is no earlier than return_window_days_before_maturity
    calendar days before maturity_date. The vehicle must be returned no later than return_grace_days_after_maturity
    after the balloon payment fell due. The period is counted in calendar days starting the day after maturity_date,
    and a return on the last day is timely. On return the balloon balance is satisfied by the vehicle, so the remaining
    principal_balance is credited out; every regular installment must already be paid. The return inspection records
    the odometer and the excess wear assessed under the Kestrel wear standard. excess_miles is the inspection odometer
    less odometer_at_contract less annual_mileage_allowance times term_months divided by 12, never below zero, and
    is charged at return_excess_mileage_rate per mile. The excess wear charge is wear_assessed_amount less return_wear_waiver_cap
    for the tier, never below zero. The return fee is return_option_fee for the tier, waived when the customer signs
    a new Kestrel retail contract or lease within return_fee_loyalty_days calendar days before or after the return
    date. Return charges can be billed only while the contract status is returned. Return charges may be billed
    only after return_inspection_dispute_days have fully elapsed from the date the vehicle was returned. The dispute
    period is counted in calendar days starting the day after return_date, so billing is permitted from the calendar
    day after return_date plus return_inspection_dispute_days. A dispute filed within the dispute period is resolved
    before billing; charges are due return_charges_due_days calendar days after billing, the account closes when
    they are paid, and charges still unpaid return_charge_off_days after the return are charged off.
  eligibility:
  - id: return_allowed
    applies_to:
    - balloon_vehicle_returned
    kind: authorization
    condition: The vehicle may be returned only when return_option_available is true, days_past_due is 0 apart from
      the balloon installment itself, and the return date is no earlier than return_window_days_before_maturity
      calendar days before maturity_date.
    evidence_fields:
    - balloon_contracts.return_option_available
    - balloon_contracts.days_past_due
    - balloon_contracts.maturity_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: return_deadline
    applies_to:
    - balloon_vehicle_returned
    kind: time
    condition: The vehicle must be returned no later than return_grace_days_after_maturity after the balloon payment
      fell due.
    evidence_fields:
    - balloon_contracts.maturity_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the balloon payment fell due
      anchor_source: balloon_contracts.maturity_date
      relation: not_after
      duration_source: variants.return_grace_days_after_maturity
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after maturity_date, and a return on
        the last day is timely.
      boundary: inclusive
  - id: charge_status
    applies_to:
    - balloon_return_charge
    - balloon_return_credit
    kind: state
    condition: Return charges can be billed only while the contract status is returned.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - returned
  - id: dispute_elapsed
    applies_to:
    - balloon_return_charge
    kind: time
    condition: Return charges may be billed only after return_inspection_dispute_days have fully elapsed from the
      date the vehicle was returned.
    evidence_fields:
    - balloon_contracts.return_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was returned
      anchor_source: balloon_contracts.return_date
      relation: not_before
      duration_source: variants.return_inspection_dispute_days
      unit: calendar_days
      counting_rule: The dispute period is counted in calendar days starting the day after return_date, so billing
        is permitted from the calendar day after return_date plus return_inspection_dispute_days.
      boundary: exclusive
  formula:
    excess_miles: max(0, inspection_odometer - odometer_at_contract - annual_mileage_allowance * term_months / 12)
    mileage_charge: round(excess_miles * return_excess_mileage_rate, 2)
    wear_charge: max(0, wear_assessed_amount - return_wear_waiver_cap)
  params:
    per_tier:
      Kestrel Advantage Balloon Tier 5:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 4:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 3:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 2:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 1:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 1+:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
    return_fee_loyalty_days: =return_fee_loyalty_days
    return_excess_mileage_rate: =return_excess_mileage_rate
    return_window_days_before_maturity: =return_window_days_before_maturity
    return_grace_days_after_maturity: =return_grace_days_after_maturity
    return_inspection_dispute_days: =return_inspection_dispute_days
    return_charge_off_days: =return_charge_off_days
    return_charges_due_days: =return_charges_due_days
