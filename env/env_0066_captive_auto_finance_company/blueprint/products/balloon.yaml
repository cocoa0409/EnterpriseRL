      action_bindings:
        balloon_requests.balloon_request_id: balloon_request_id
  params:
    lien_release_hold_business_days: =lien_release_hold_business_days
    elt_release_business_days: =elt_release_business_days
    paper_title_mail_business_days: =paper_title_mail_business_days
- id: balloon_repossession_assignment
  subject:
  - balloon_repo_assigned
  - balloon_repo_recalled
  - balloon_vehicle_recovered
  - balloon_voluntary_surrender
  - balloon_notice_mailed
  - balloon_repo_record_updated
  rule: An account may be assigned for repossession only when days_past_due is at least repo_assignment_min_days_past_due
    for the tier. Where the contract records right_to_cure_days greater than 0, assignment may occur only after
    a right-to-cure notice has been mailed and right_to_cure_days calendar days have run from right_to_cure_notice_date.
    While the account is repo_assigned, the assignment is recalled when the customer pays all past-due installments
    and all late charges due in certified funds before the vehicle is recovered; a partial payment or a promise
    to pay does not recall it. A customer may voluntarily surrender the vehicle at any time while the contract is
    active; the surrender is the customer's own act, scheduled at a location the company designates, and the voluntary
    agency fee applies instead of the involuntary fee. A notice can be mailed only while the contract status is
    active, repo_assigned, repossessed, deficiency or paid_in_full. The notice of intent to sell is mailed within
    nois_mail_business_days business days after the repossession date and states the scheduled sale date and the
    redemption and any reinstatement amount. A deficiency notice is mailed after a sale that leaves a balance and
    a surplus notice after a sale that leaves a surplus; mailing dates are recorded on the contract. When the customer
    reports an active bankruptcy filing, or bankruptcy_status on the profile is not none, no collection or repossession
    step is taken by the servicing desk.
  eligibility:
  - id: repo_dpd
    applies_to:
    - balloon_repo_assigned
    kind: authorization
    condition: An account may be assigned for repossession only when days_past_due is at least repo_assignment_min_days_past_due
      for the tier.
    evidence_fields:
    - balloon_contracts.days_past_due
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: right_to_cure
    applies_to:
    - balloon_repo_assigned
    kind: authorization
    condition: Where the contract records right_to_cure_days greater than 0, assignment may occur only after a right-to-cure
      notice has been mailed and right_to_cure_days calendar days have run from right_to_cure_notice_date.
    evidence_fields:
    - balloon_contracts.right_to_cure_days
    - balloon_contracts.right_to_cure_notice_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: notice_status
    applies_to:
    - balloon_notice_mailed
    kind: state
    condition: A notice can be mailed only while the contract status is active, repo_assigned, repossessed, deficiency
      or paid_in_full.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - active
      - repo_assigned
      - repossessed
      - deficiency
      - paid_in_full
  params:
    per_tier:
      Kestrel Advantage Balloon Tier 5:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Advantage Balloon Tier 4:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Advantage Balloon Tier 3:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Advantage Balloon Tier 2:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Advantage Balloon Tier 1:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Advantage Balloon Tier 1+:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
    nois_mail_business_days: =nois_mail_business_days
- id: balloon_repossession_charges
  subject:
  - balloon_repo_expense
  - balloon_personal_property_release
  rule: A repossession expense can be charged only while the contract status is repo_assigned or repossessed. The
    agency fee is repo_agency_fee_involuntary for an involuntary recovery and repo_agency_fee_voluntary for a voluntary
    surrender; a transport fee of repo_transport_fee applies only to an involuntary recovery; a condition report
    fee of condition_report_fee is charged once per repossession. Storage is charged at storage_daily_fee for each
    day the vehicle is stored beyond storage_free_days, counting from repossession_date to the release or sale date,
    and is billed when the vehicle leaves the lot. Personal property found in the vehicle is inventoried and held
    free of charge; the customer may collect it in person or have it shipped at the carrier's cost. Personal property
    may be disposed of only after personal_property_hold_days have fully elapsed from the date the vehicle was repossessed.
    The hold is counted in calendar days starting the day after repossession_date; disposal is permitted from the
    calendar day after repossession_date plus personal_property_hold_days. Expenses are booked to fees due and become
    part of any reinstatement, redemption or deficiency amount.
  eligibility:
  - id: expense_status
    applies_to:
    - balloon_repo_expense
    kind: state
    condition: A repossession expense can be charged only while the contract status is repo_assigned or repossessed.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - repo_assigned
      - repossessed
  - id: property_hold
    applies_to:
    - balloon_personal_property_release
    kind: time
    condition: Personal property may be disposed of only after personal_property_hold_days have fully elapsed from
      the date the vehicle was repossessed.
    evidence_fields:
    - balloon_contracts.repossession_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was repossessed
      anchor_source: balloon_contracts.repossession_date
      relation: not_before
      duration_source: variants.personal_property_hold_days
      unit: calendar_days
      counting_rule: The hold is counted in calendar days starting the day after repossession_date; disposal is
        permitted from the calendar day after repossession_date plus personal_property_hold_days.
      boundary: exclusive
  formula:
    storage_fee: storage_daily_fee * max(0, service_days - storage_free_days)
  params:
    repo_agency_fee_involuntary: =repo_agency_fee_involuntary
    repo_agency_fee_voluntary: =repo_agency_fee_voluntary
    repo_transport_fee: =repo_transport_fee
    condition_report_fee: =condition_report_fee
    storage_daily_fee: =storage_daily_fee
    storage_free_days: =storage_free_days
    personal_property_hold_days: =personal_property_hold_days
- id: balloon_reinstatement_and_redemption
  subject:
  - balloon_reinstated
  - balloon_redeemed
  - balloon_payment
  rule: After repossession and until the sale, the customer may get the vehicle back either by reinstating the contract
    or by redeeming the vehicle. A reinstatement must be completed no later than reinstatement_company_window_days
    after the vehicle was repossessed and before scheduled_sale_date. The window is counted in calendar days starting
    the day after repossession_date and completion on the last day is timely; where the contract records a state_reinstatement_days
    longer than the company window, that longer period is used in place of reinstatement_company_window_days in
    the same count. The contract must show reinstatements_used below reinstatement_max_per_contract for the tier,
    unless the contract records state_reinstatement_days greater than 0. The company does not offer a discretionary
    reinstatement while another Kestrel contract or lease of the customer shows days_past_due of reinstatement_relationship_dpd_limit
    or more; a reinstatement the contract's recorded state_reinstatement_days grants is still offered. The reinstatement
    amount is past_due_amount plus fees_due_balance, which includes late charges and every repossession expense
    booked; storage is billed up to the reinstatement date before the amount is stated. The redemption amount is
    principal_balance plus fees_due_balance plus accrued interest for balloon_msr_quote_interest_days at the per
    diem; redemption is available at any time before the sale regardless of prior reinstatements. Reinstatement
    and redemption funds are accepted only as cashiers_check, wire or moneygram; once the funds post the vehicle
    is released and, for a reinstatement, the original schedule resumes with next_due_date set to the next installment.
  eligibility:
  - id: reinstatement_window
    applies_to:
    - balloon_reinstated
    kind: time
    condition: A reinstatement must be completed no later than reinstatement_company_window_days after the vehicle
      was repossessed and before scheduled_sale_date.
    evidence_fields:
    - balloon_contracts.repossession_date
    - balloon_contracts.scheduled_sale_date
    - balloon_contracts.state_reinstatement_days
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was repossessed
      anchor_source: balloon_contracts.repossession_date
      relation: not_after
      duration_source: variants.reinstatement_company_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days starting the day after repossession_date and completion
        on the last day is timely; where the contract records a state_reinstatement_days longer than the company
        window, that longer period is used in place of reinstatement_company_window_days in the same count.
      boundary: inclusive
  - id: reinstatement_count
    applies_to:
    - balloon_reinstated
    kind: authorization
    condition: The contract must show reinstatements_used below reinstatement_max_per_contract for the tier, unless
      the contract records state_reinstatement_days greater than 0.
    evidence_fields:
    - balloon_contracts.reinstatements_used
    - balloon_contracts.state_reinstatement_days
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: reinstatement_relationship
    applies_to:
    - balloon_reinstated
    kind: authorization
    condition: The company does not offer a discretionary reinstatement while another Kestrel contract or lease
      of the customer shows days_past_due of reinstatement_relationship_dpd_limit or more; a reinstatement the contract's
      recorded state_reinstatement_days grants is still offered.
    evidence_fields:
    - balloon_contracts.customer_id
    - retail_contracts.days_past_due
    - preowned_contracts.days_past_due
    - lease_contracts.days_past_due
    - retail_contracts.customer_id
    - preowned_contracts.customer_id
    - lease_contracts.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.customer_id
      action_bindings:
        balloon_contracts.customer_id: customer_id
  measures:
  - balloon_msr_quote_interest_days
  formula:
    reinstatement_amount: past_due_amount + fees_due_balance
    redemption_amount: principal_balance + fees_due_balance + round(principal_balance * apr / 100 / per_diem_day_basis,
      2) * balloon_msr_quote_interest_days
  params:
    per_tier:
      Kestrel Advantage Balloon Tier 5:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Advantage Balloon Tier 4:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Advantage Balloon Tier 3:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Advantage Balloon Tier 2:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Advantage Balloon Tier 1:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Advantage Balloon Tier 1+:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
    reinstatement_relationship_dpd_limit: =reinstatement_relationship_dpd_limit
- id: balloon_sale_and_deficiency
  subject:
  - balloon_repo_sale
  - balloon_repo_sale_posted
  - balloon_charge_off
  - balloon_charged_off
  rule: A repossessed vehicle can be sold only while the contract status is repossessed. The sale may take place
    no earlier than company_min_days_nois_to_sale after the notice of intent to sell was mailed. The period is counted
    in calendar days starting the day after nois_mailed_date; where the contract records a nois_min_days longer
    than company_min_days_nois_to_sale, that longer period is used in the same count, and a sale on the first day
    after the period is permitted. Net proceeds are gross_proceeds less sale_expenses and are applied to principal;
    the contract moves to deficiency when principal_balance plus fees_due_balance remains above zero, and to paid_in_full
    when the net proceeds cover it. A surplus is refunded to the customer within surplus_refund_days calendar days
    of the sale together with a surplus notice. A deficiency balance may be settled for a lump sum of at least deficiency_settlement_min_pct
    percent of the deficiency, which pays the contract in full; a smaller offer is not within the servicing desk's
    authority. A deficiency can be charged off only while the contract status is deficiency. A deficiency may be
    charged off no earlier than deficiency_charge_off_days after the vehicle was sold. The period is counted in
    calendar days starting the day after scheduled_sale_date, and charge-off on the last day of the period is permitted.
  eligibility:
  - id: sale_status
    applies_to:
    - balloon_repo_sale
    kind: state
    condition: A repossessed vehicle can be sold only while the contract status is repossessed.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - repossessed
  - id: notice_period
    applies_to:
    - balloon_repo_sale
    kind: time
    condition: The sale may take place no earlier than company_min_days_nois_to_sale after the notice of intent
      to sell was mailed.
    evidence_fields:
    - balloon_contracts.nois_mailed_date
    - balloon_contracts.nois_min_days
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the notice of intent to sell was mailed
      anchor_source: balloon_contracts.nois_mailed_date
      relation: not_before
      duration_source: variants.company_min_days_nois_to_sale
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after nois_mailed_date; where the contract
        records a nois_min_days longer than company_min_days_nois_to_sale, that longer period is used in the same
        count, and a sale on the first day after the period is permitted.
      boundary: exclusive
  - id: chargeoff_status
    applies_to:
    - balloon_charge_off
    kind: state
    condition: A deficiency can be charged off only while the contract status is deficiency.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - deficiency
  - id: chargeoff_period
    applies_to:
    - balloon_charge_off
    kind: time
    condition: A deficiency may be charged off no earlier than deficiency_charge_off_days after the vehicle was
      sold.
    evidence_fields:
    - balloon_contracts.scheduled_sale_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was sold
      anchor_source: balloon_contracts.scheduled_sale_date
      relation: not_before
      duration_source: variants.deficiency_charge_off_days
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after scheduled_sale_date, and charge-off
        on the last day of the period is permitted.
      boundary: inclusive
  formula:
    amount: gross_proceeds - sale_expenses
  params:
    company_min_days_nois_to_sale: =company_min_days_nois_to_sale
    surplus_refund_days: =surplus_refund_days
    deficiency_settlement_min_pct: =deficiency_settlement_min_pct
    deficiency_charge_off_days: =deficiency_charge_off_days
- id: balloon_maturity_options
  subject:
  - balloon_maturity_election
  - balloon_contract_booked
  rule: The balloon installment is set at booking as the tier's balloon_pct_by_term percentage of vehicle_msrp for
    the contract term, and terms not listed for the tier cannot be booked as balloon contracts. A maturity options
    letter is mailed maturity_letter_days_before calendar days before maturity_date. A maturity election can be
    recorded only while the contract status is active. At maturity the customer may pay the balloon in full, refinance
    it under the balloon refinance rule, or, only where return_option_available is true, return the vehicle under
    the return rule. An election is a statement of intent and may be changed until the chosen option is completed;
    when no option is completed by maturity_date the balloon is an unpaid installment and the late charge rule applies
    to it like any other installment. Paying the balloon in full is a payoff and follows the payoff and lien release
    rules.
  eligibility:
  - id: election_status
    applies_to:
    - balloon_maturity_election
    kind: state
    condition: A maturity election can be recorded only while the contract status is active.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - active
  params:
    per_tier:
      Kestrel Advantage Balloon Tier 5:
        balloon_pct_by_term: =balloon_pct_by_term
      Kestrel Advantage Balloon Tier 4:
        balloon_pct_by_term: =balloon_pct_by_term
      Kestrel Advantage Balloon Tier 3:
        balloon_pct_by_term: =balloon_pct_by_term
      Kestrel Advantage Balloon Tier 2:
        balloon_pct_by_term: =balloon_pct_by_term
      Kestrel Advantage Balloon Tier 1:
        balloon_pct_by_term: =balloon_pct_by_term
      Kestrel Advantage Balloon Tier 1+:
        balloon_pct_by_term: =balloon_pct_by_term
    maturity_letter_days_before: =maturity_letter_days_before
- id: balloon_refinancing
  subject:
  - balloon_refinance
  - balloon_terms_modified
  rule: A balloon refinance can be completed only while the contract status is active. The request may be taken
    no earlier than refinance_window_open_days_before calendar days before maturity_date. A balloon refinance must
    be completed no later than refinance_window_close_days_after after the balloon payment fell due. The period
    is counted in calendar days starting the day after maturity_date, and completion on the last day is timely.
    The contract must show days_past_due of 0 apart from the balloon installment itself, and balloon_msr_late_charges_12m
    must not exceed refinance_max_late_charges_12m for the tier. The amount refinanced is the balloon_amount; any
    other amount due must be paid separately before the refinance. The refinance term may not exceed refinance_max_term_months
    for the tier, and the refinance APR is refinance_apr for the tier less relationship_refinance_rate_reduction_pct
    when the customer also holds another Kestrel retail or pre-owned contract in active status, or a Kestrel lease
    in active status, showing days_past_due of 0. The new installment is the level monthly payment that amortizes
    the amount refinanced over the refinance term at the refinance APR, rounded to the cent; balloon_amount becomes
    0.00 and the contract's apr and monthly_payment are replaced. A refinance may be completed only once per contract.
  eligibility:
  - id: refi_status
    applies_to:
    - balloon_refinance
    kind: state
    condition: A balloon refinance can be completed only while the contract status is active.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - active
  - id: refi_open
    applies_to:
    - balloon_refinance
    kind: authorization
    condition: The request may be taken no earlier than refinance_window_open_days_before calendar days before maturity_date.
    evidence_fields:
    - balloon_contracts.maturity_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: refi_close
    applies_to:
    - balloon_refinance
    kind: time
    condition: A balloon refinance must be completed no later than refinance_window_close_days_after after the balloon
      payment fell due.
    evidence_fields:
    - balloon_contracts.maturity_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the balloon payment fell due
      anchor_source: balloon_contracts.maturity_date
      relation: not_after
      duration_source: variants.refinance_window_close_days_after
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after maturity_date, and completion
        on the last day is timely.
      boundary: inclusive
  - id: refi_history
    applies_to:
    - balloon_refinance
    kind: authorization
    condition: The contract must show days_past_due of 0 apart from the balloon installment itself, and balloon_msr_late_charges_12m
      must not exceed refinance_max_late_charges_12m for the tier.
    evidence_fields:
    - balloon_contracts.days_past_due
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  measures:
  - balloon_msr_late_charges_12m
  formula:
    refinance_monthly_payment: round(amount * (refinance_apr / 1200) / (1 - (1 + refinance_apr / 1200) ** (0 - refinance_term_months)),
      2)
  params:
    per_tier:
      Kestrel Advantage Balloon Tier 5:
        refinance_max_term_months: =refinance_max_term_months
