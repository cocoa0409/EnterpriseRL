- id: balloon_extensions
  subject:
  - balloon_extension
  - balloon_schedule_updated
  rule: An extension can be granted only while the contract status is active. The contract must show payments_made_count
    of at least extension_min_payments_made, days_past_due of no more than extension_max_days_past_due, and extensions_used_lifetime
    plus the installments requested no greater than extension_lifetime_max_installments for the tier. No extension
    is granted when balloon_msr_remaining_installments is extension_blackout_final_installments or fewer. No extension
    is granted while any other Kestrel contract of the customer is repo_assigned, repossessed, deficiency or charged_off,
    or any Kestrel lease of the customer is repossessed or charged_off. An extension may take effect no earlier
    than extension_interval_months after the previous extension took effect. The interval is counted in calendar
    months from last_extension_date to the same day number of the later month, falling back to that month's last
    day when the day does not exist; a contract never extended has no interval to wait. One request may defer no
    more than extension_max_installments_per_request installments, always starting with the installment due on next_due_date.
    Before the extension is granted, a good-faith payment of at least extension_good_faith_pct percent of monthly_payment
    must have posted since the most recent installment due date; a tier whose percentage is 0 requires none. The
    agent sends the extension agreement for signature, and it expires if not completed within extension_agreement_return_days
    calendar days. The extension takes effect only after the customer has completed the signed extension agreement
    for this contract. The extension fee is extension_fee for the tier where the contract records extension_fee_permitted
    as true, and 0.00 where it is false; the fee is booked to fees due. On the effective date next_due_date and
    maturity_date each move later by one month per deferred installment, extensions_used_lifetime increases by the
    number deferred and last_extension_date is set; simple interest keeps accruing on principal throughout, so the
    final installment absorbs the extra interest. Late charges already assessed remain due, and no late charge is
    assessed on a deferred installment.
  eligibility:
  - id: x_status
    applies_to:
    - balloon_extension
    kind: state
    condition: An extension can be granted only while the contract status is active.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - active
  - id: x_counts
    applies_to:
    - balloon_extension
    kind: authorization
    condition: The contract must show payments_made_count of at least extension_min_payments_made, days_past_due
      of no more than extension_max_days_past_due, and extensions_used_lifetime plus the installments requested
      no greater than extension_lifetime_max_installments for the tier.
    evidence_fields:
    - balloon_contracts.payments_made_count
    - balloon_contracts.days_past_due
    - balloon_contracts.extensions_used_lifetime
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: x_blackout
    applies_to:
    - balloon_extension
    kind: authorization
    condition: No extension is granted when balloon_msr_remaining_installments is extension_blackout_final_installments
      or fewer.
    evidence_fields:
    - balloon_contracts.term_months
    - balloon_contracts.extensions_used_lifetime
    - balloon_contracts.payments_made_count
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: x_relationship
    applies_to:
    - balloon_extension
    kind: authorization
    condition: No extension is granted while any other Kestrel contract of the customer is repo_assigned, repossessed,
      deficiency or charged_off, or any Kestrel lease of the customer is repossessed or charged_off.
    evidence_fields:
    - balloon_contracts.customer_id
    - retail_contracts.status
    - preowned_contracts.status
    - lease_contracts.status
    - retail_contracts.customer_id
    - preowned_contracts.customer_id
    - lease_contracts.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.customer_id
      action_bindings:
        balloon_contracts.customer_id: customer_id
  - id: x_signed
    applies_to:
    - balloon_extension
    kind: authorization
    condition: The extension takes effect only after the customer has completed the signed extension agreement for
      this contract.
    evidence_fields:
    - balloon_requests.request_status
    - balloon_requests.request_type
    - balloon_requests.balloon_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_requests.balloon_request_id
      action_bindings:
        balloon_requests.balloon_request_id: balloon_request_id
  - id: x_interval
    applies_to:
    - balloon_extension
    kind: time
    condition: An extension may take effect no earlier than extension_interval_months after the previous extension
      took effect.
    evidence_fields:
    - balloon_contracts.last_extension_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the previous extension took effect
      anchor_source: balloon_contracts.last_extension_date
      relation: not_before
      duration_source: variants.extension_interval_months
      unit: calendar_months
      counting_rule: The interval is counted in calendar months from last_extension_date to the same day number
        of the later month, falling back to that month's last day when the day does not exist; a contract never
        extended has no interval to wait.
      boundary: inclusive
