  - id: dd_counts
    applies_to:
    - balloon_due_date_change
    kind: authorization
    condition: The contract must show days_past_due of 0, payments_made_count of at least due_date_change_min_payments_made
      and due_date_changes_used below due_date_change_lifetime_max for the tier.
    evidence_fields:
    - balloon_contracts.days_past_due
    - balloon_contracts.payments_made_count
    - balloon_contracts.due_date_changes_used
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: dd_interval
    applies_to:
    - balloon_due_date_change
    kind: time
    condition: A due-date change may take effect no earlier than due_date_change_interval_months after the last
      due-date change took effect.
    evidence_fields:
    - balloon_contracts.last_due_date_change_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
