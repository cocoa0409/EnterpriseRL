- id: care_claim_payment
  subject:
  - care_claim_paid
  - care_limit_exhausted
  rule: An authorized claim is paid under claim_payment_method within claim_payment_business_days business days
    after the repair order closes, never above aggregate_limit_remaining. Reimbursement claims from the holder must
    be filed within claim_filing_days_after_repair calendar days after the repair order closes. When aggregate_limit_remaining
    reaches zero the plan ends as limit_exhausted.
  eligibility: []
  params:
    claim_payment_method: =claim_payment_method
    claim_payment_business_days: =claim_payment_business_days
    claim_filing_days_after_repair: =claim_filing_days_after_repair
- id: care_cancellation
  subject:
  - care_contract_cancelled
  - care_cancellation_refund
  rule: 'A cancellation takes effect only when the holder has completed a signed cancellation request stating the
    current odometer. Within free_look_days of purchase_date the refund is the full contract_price provided no claim
    has been paid. After that the refund follows refund_method: contract_price times one minus care_msr_used_fraction,
    less cancellation_fee, and less claims_paid_total where claims_deducted_from_refund is true, never below zero.
    Where refund_to_lienholder_first is true and the plan was financed in a Kestrel account that is still open,
    the refund is sent to that account; otherwise it is paid to the holder.'
  eligibility:
  - id: signed
    applies_to:
    - care_contract_cancelled
    kind: authorization
    condition: A cancellation takes effect only when the holder has completed a signed cancellation request stating
      the current odometer.
    evidence_fields:
    - care_requests.request_type
    - care_requests.request_status
    - care_requests.care_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_requests.care_request_id
      action_bindings:
        care_requests.care_request_id: care_request_id
  measures:
  - care_msr_used_fraction
  formula:
    amount: max(0, round(contract_price * (1 - care_msr_used_fraction) - cancellation_fee - (claims_paid_total if
      claims_deducted_from_refund else 0), 2))
  params:
    per_tier:
      Kestrel Care Powertrain:
        claims_deducted_from_refund: =claims_deducted_from_refund
      Kestrel Care Gold:
        claims_deducted_from_refund: =claims_deducted_from_refund
      Kestrel Care Gold Plus:
        claims_deducted_from_refund: =claims_deducted_from_refund
      Kestrel Care Platinum:
        claims_deducted_from_refund: =claims_deducted_from_refund
      Kestrel Care Platinum Plus:
        claims_deducted_from_refund: =claims_deducted_from_refund
      Kestrel Care Platinum Elite:
        claims_deducted_from_refund: =claims_deducted_from_refund
    free_look_days: =free_look_days
    refund_method: =refund_method
    cancellation_fee: =cancellation_fee
    refund_to_lienholder_first: =refund_to_lienholder_first
- id: care_transfer
  subject:
  - care_transfer_fee
  - care_ownership_transferred
  rule: A transfer is possible only where transfer_allowed is true for the plan, the holder has completed a signed
    transfer request, and the vehicle was sold privately no more than transfer_window_days before the request. The
    transfer_fee for the plan is collected and the plan moves to the buyer with its remaining term and limit; transfers
    to a dealer are not allowed.
  eligibility:
  - id: transfer_ok
    applies_to:
    - care_transfer_fee
    kind: authorization
    condition: A transfer is possible only where transfer_allowed is true for the plan, the holder has completed
      a signed transfer request, and the vehicle was sold privately no more than transfer_window_days before the
      request.
    evidence_fields:
    - care_requests.request_type
    - care_requests.request_status
    - care_requests.care_request_id
    evidence_contract:
