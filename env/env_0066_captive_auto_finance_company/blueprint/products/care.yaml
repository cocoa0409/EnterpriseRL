events:
- type: care_contract_sold
  target: care_contracts
  mutation: create
  meaning: A Kestrel Care plan is sold on a vehicle.
  grain: one row per plan; this write changes that record
  fields:
    contract_number: as written on the plan
    variant_name: as written on the plan
    vin: as written on the plan
    vehicle_model: as written on the plan
    vehicle_year: as written on the plan
    purchase_date: as written on the plan
    odometer_at_purchase: as written on the plan
    term_months: as written on the plan
    term_miles: as written on the plan
    expiration_date: as written on the plan
    expiration_odometer: as written on the plan
    deductible: as written on the plan
    contract_price: as written on the plan
    selling_dealer_code: as written on the plan
    financed_with_category: as written on the plan
    financed_account_number: as written on the plan
  triggers: []
- type: care_contract_activated
  target: care_contracts
  mutation:
    transition:
      from: pending_activation
      to: active
  meaning: The dealer remits the plan and coverage is registered.
  grain: one row per plan; this write changes that record
  fields:
    aggregate_limit_remaining: limit established
  triggers:
  - event: care:care_limit_established
    map: {}
- type: care_contract_cancelled
  target: care_contracts
  mutation:
    transition:
    - from: pending_activation
      to: cancelled
    - from: active
      to: cancelled
  meaning: The plan is cancelled at the holder's request.
  grain: one row per plan; this write changes that record
  fields:
    cancellation_date: cancellation date
    cancellation_odometer: odometer stated
  triggers:
  - event: care:care_cancellation_refund
    map: {}
- type: care_contract_expired
  target: care_contracts
  mutation:
    transition:
      from: active
      to: expired
  meaning: The plan reaches the end of its time or mileage term.
  grain: one row per plan; this write changes that record
  fields:
    expiration_date: unchanged
  triggers: []
- type: care_limit_exhausted
  target: care_contracts
  mutation:
    transition:
      from: active
      to: limit_exhausted
  meaning: Claims paid reach the aggregate limit.
  grain: one row per plan; this write changes that record
  fields:
    aggregate_limit_remaining: '0.00'
  triggers: []
- type: care_ownership_transferred
  target: care_contracts
  mutation: update
  meaning: The plan is transferred to the private buyer of the vehicle.
  grain: one row per plan; this write changes that record
  fields:
    customer_id: new holder
    transfer_count: incremented by one
  triggers: []
- type: care_limit_established
  target: care_transactions
  meaning: The aggregate limit of liability is established at activation.
  grain: one row per plan
  distinguish_by:
  - txn_date
  fields:
    txn_date: activation date
    amount: limit
  account: aggregate_limit
  direction: in
  triggers: []
- type: care_cancellation_refund
  target: care_transactions
  meaning: A cancellation refund is computed and sent.
  grain: one row per cancellation
  distinguish_by:
  - txn_date
  fields:
    txn_date: refund date
    amount: refund
    refund_destination: destination
    refund_basis: basis
  triggers:
  - event: retail:retail_refund_credit
    when:
      refund_destination: retail
    map:
      amount: amount
      care_contract_id: care_contract_id
      txn_date: txn_date
  - event: preowned:preowned_refund_credit
    when:
      refund_destination: preowned
    map:
      amount: amount
      care_contract_id: care_contract_id
      txn_date: txn_date
  - event: balloon:balloon_refund_credit
    when:
      refund_destination: balloon
    map:
      amount: amount
      care_contract_id: care_contract_id
      txn_date: txn_date
  - event: lease:lease_refund_credit
    when:
      refund_destination: lease
    map:
      amount: amount
      care_contract_id: care_contract_id
      txn_date: txn_date
- type: care_transfer_fee
  target: care_transactions
  meaning: A transfer fee is collected.
  grain: one row per transfer
  distinguish_by:
  - txn_date
  - new_owner_name
  fields:
    txn_date: date
    amount: fee
    new_owner_name: buyer
  triggers:
  - event: care:care_ownership_transferred
    map: {}
- type: care_claim_opened
  target: care_claims
  meaning: A repair facility opens a claim on a repair order.
  grain: one row per repair order
  distinguish_by:
  - repair_order_number
  fields:
    repair_order_number: RO number
    claim_date: date
    claim_odometer: odometer
    component_group: failed group
    repair_facility_type: facility
    estimate_amount: estimate
  triggers: []
- type: care_claim_authorized
  target: care_claims
  meaning: A claim is authorized.
  grain: one row per authorization of a claim
  distinguish_by:
  - parent_claim_id
  fields:
    parent_claim_id: the claim
    claim_date: date
    authorized_amount: authorized
    deductible_applied: deductible
  triggers: []
- type: care_claim_denied
  target: care_claims
  meaning: A claim is denied.
  grain: one row per denial of a claim
  distinguish_by:
  - parent_claim_id
  fields:
    parent_claim_id: the claim
    claim_date: date
    denial_reason: reason
  triggers: []
- type: care_claim_paid
  target: care_claims
  meaning: An authorized claim is paid to the repair facility.
  grain: one row per claim payment
  distinguish_by:
  - parent_claim_id
  fields:
    parent_claim_id: the claim
    claim_date: date
    paid_amount: paid
  account: aggregate_limit
  direction: out
  triggers: []
measures:
- id: care_msr_used_fraction
  window: from purchase_date and odometer_at_purchase to the cancellation date and cancellation odometer
  measure: the greater of days elapsed divided by the term in days and miles driven divided by term_miles, capped
    at 1
policies:
- id: care_agg_multi_holding
  subject:
  - care_contract_sold
  rule: A customer may hold Kestrel Care plans on any number of vehicles, subject to one plan per vehicle.
  eligibility: []
  params:
