        coverage_type: =coverage_type
        covered_component_groups: =covered_component_groups
        hybrid_ev_components_covered: =hybrid_ev_components_covered
        electronics_covered: =electronics_covered
        seals_gaskets_covered: =seals_gaskets_covered
        selling_dealer_deductible_waiver: =selling_dealer_deductible_waiver
        rental_allowance_per_day: =rental_allowance_per_day
        rental_max_days: =rental_max_days
        towing_per_occurrence: =towing_per_occurrence
        trip_interruption_per_day: =trip_interruption_per_day
        trip_interruption_max_days: =trip_interruption_max_days
        roadside_assistance_included: =roadside_assistance_included
        key_replacement_limit: =key_replacement_limit
        oem_parts_only: =oem_parts_only
        independent_facility_allowed: =independent_facility_allowed
        max_claims_per_visit: =max_claims_per_visit
      Kestrel Care Gold:
        coverage_type: =coverage_type
