# Product charter: Kestrel Care Vehicle Service Contract
category: care
display_name: Kestrel Care Vehicle Service Contract
binding:
  holding_table: care_contracts
  event_tables:
  - care_transactions
  - care_claims
  intake_tables:
  - care_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    aggregate_limit_remaining: aggregate_limit
lifecycle:
  states:
  - pending_activation
  - active
  - cancelled
  - expired
  - limit_exhausted
  transitions:
  - from: pending_activation
    to: active
    by: system
    means: The selling dealer remits the contract and coverage is registered.
  - from: pending_activation
    to: cancelled
    by: user
    means: The contract holder cancels before activation.
  - from: active
    to: cancelled
    by: user
    means: The contract holder signs a cancellation request.
  - from: active
    to: expired
    by: system
    means: The term in months or miles runs out, whichever comes first.
  - from: active
    to: limit_exhausted
    by: system
    means: Claims paid reach the aggregate limit of liability.
accounts:
- key: aggregate_limit
  unit: USD
  meaning: 'Remaining aggregate limit of liability: established at activation, reduced by each claim paid, restored
    by a claim payment reversal.'
parameter_schema:
  coverage_type: stated_component (only listed parts) or exclusionary (everything except listed exclusions)
  covered_component_groups: component groups covered
  hybrid_ev_components_covered: whether hybrid and EV drive components are covered
  electronics_covered: whether infotainment, navigation and driver-assist electronics are covered
  seals_gaskets_covered: whether seals and gaskets of covered parts are covered
  max_vehicle_age_years_at_purchase: oldest vehicle (purchase year minus model year) the plan may be sold on; years
  max_odometer_at_purchase: highest odometer at purchase; miles
  term_options_months: terms in months that may be sold
  term_options_miles: mileage terms that may be sold; miles of coverage added to the odometer at purchase
  deductible_options: deductibles per repair visit that may be chosen; USD
  selling_dealer_deductible_waiver: whether the deductible is waived when the repair is done at the selling Kestrel
    dealer
  deductible_basis: unit to which one deductible applies
  rental_allowance_per_day: rental car reimbursement per day while a covered repair is performed; USD
  rental_max_days: maximum rental days per covered repair visit
  towing_per_occurrence: towing reimbursement per covered breakdown; USD
  trip_interruption_per_day: lodging and meals reimbursement per day when a covered breakdown occurs far from home;
    USD
  trip_interruption_max_days: maximum trip interruption days per breakdown
  trip_interruption_min_distance_miles: minimum distance from home for trip interruption benefits; miles
  roadside_assistance_included: whether 24-hour roadside assistance is included
  key_replacement_limit: reimbursement for a lost or damaged smart key per term; USD (0 = not covered)
  diagnostic_coverage: whether diagnostic time is paid when the failure is covered
  labor_rate_cap_pct_of_posted: labor paid as a percent of the repair facility's posted retail labor rate; percent
  oem_parts_only: whether repairs must use Kestrel genuine parts
  independent_facility_allowed: whether repairs may be performed at an ASE-certified independent facility
  waiting_period_days: calendar days after purchase before a claim may be made
  waiting_period_miles: miles after the odometer at purchase before a claim may be made
  prior_authorization_required: whether the repair facility must obtain authorization before starting a covered
    repair
  maintenance_records_required: whether maintenance records may be requested on a claim
  aggregate_limit_basis: basis of the aggregate limit of liability
  aggregate_limit_cap: maximum aggregate limit regardless of the purchase price; USD
  claim_payment_method: how covered repairs are paid
  claim_payment_business_days: business days after the repair order closes within which the claim is paid
  claim_filing_days_after_repair: calendar days after the repair order closes within which reimbursement claims
    must be filed
  free_look_days: calendar days after purchase during which cancellation brings a full refund
  cancellation_fee: fee deducted from a refund after the free-look period; USD
  refund_method: how the refund is computed after the free-look period
  claims_deducted_from_refund: whether claims paid are deducted from a cancellation refund
  refund_to_lienholder_first: whether a refund on a financed plan is paid to the Kestrel account that financed it
  transfer_allowed: whether the plan may be transferred to a private buyer of the vehicle
  transfer_fee: fee to transfer the plan to a private buyer; USD
  transfer_window_days: calendar days after the vehicle sale within which a transfer must be requested
  commercial_use_allowed: whether the plan may cover a vehicle used commercially
  min_contract_price: lowest retail price at which the plan is sold; USD
  max_contract_price: highest retail price at which the plan is sold; USD
  financing_allowed: whether the plan price may be included in a Kestrel retail contract or lease
  pre_existing_condition_excluded: whether failures that existed before purchase are excluded
  wear_items_excluded: wear and maintenance items never covered
  cosmetic_excluded: whether paint, trim and upholstery are excluded
  max_claims_per_visit: repair lines that may be claimed on one repair visit; count
