- id: care_claims_coverage
  subject:
  - care_claim_opened
  - care_claim_authorized
  - care_claim_denied
  rule: A claim can be authorized only while the plan status is active. No claim is payable for a failure occurring
    before waiting_period_days after purchase_date and before waiting_period_miles beyond odometer_at_purchase.
    A claim opening may be decided only once. A failure is covered when its component_group is within covered_component_groups
    for the plan, or, for an exclusionary plan, is not an excluded wear item, cosmetic item or group switched off
    by hybrid_ev_components_covered, electronics_covered or seals_gaskets_covered. Where prior_authorization_required
    is true a repair started before authorization is denied no_prior_authorization; pre-existing conditions are
    denied where pre_existing_condition_excluded is true, and documented neglect of scheduled maintenance is denied
    maintenance_neglect. Labor is paid at labor_rate_cap_pct_of_posted of the facility's posted rate, diagnostics
    are paid where diagnostic_coverage is true, Kestrel genuine parts are required where oem_parts_only is true,
    and an independent facility may be used only where independent_facility_allowed is true. One deductible applies
    per deductible_basis, waived at the selling dealer where selling_dealer_deductible_waiver is true; at most max_claims_per_visit
    repair lines are covered per visit. Rental is reimbursed at rental_allowance_per_day for up to rental_max_days,
    towing up to towing_per_occurrence, trip interruption at trip_interruption_per_day for up to trip_interruption_max_days
    when the breakdown is more than trip_interruption_min_distance_miles from home, and smart key replacement up
    to key_replacement_limit; roadside_assistance_included states whether roadside service is part of the plan.
  eligibility:
  - id: claim_status
    applies_to:
    - care_claim_authorized
    kind: state
    condition: A claim can be authorized only while the plan status is active.
    evidence_fields:
    - care_contracts.status
    - care_contracts.care_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_contracts.care_contract_id
      action_bindings:
        care_contracts.care_contract_id: care_contract_id
    state_contract:
      field: care_contracts.status
      allowed:
      - active
  - id: waiting_period
    applies_to:
    - care_claim_authorized
    kind: authorization
    condition: No claim is payable for a failure occurring before waiting_period_days after purchase_date and before
      waiting_period_miles beyond odometer_at_purchase.
    evidence_fields:
    - care_contracts.purchase_date
    - care_contracts.odometer_at_purchase
    - care_contracts.care_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_contracts.care_contract_id
      action_bindings:
        care_contracts.care_contract_id: care_contract_id
  - id: decide_once
    applies_to:
    - care_claim_authorized
    - care_claim_denied
    kind: dedup
    condition: A claim opening may be decided only once.
    evidence_fields:
    - care_claims.parent_claim_id
    - care_claims.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_claims.parent_claim_id
      action_bindings:
        care_claims.parent_claim_id: parent_claim_id
    dedup_contract:
      table: care_claims
      mode: separate_record
      object_bindings:
        parent_claim_id: parent_claim_id
      duplicate_filters:
        event_type:
        - care_claim_authorized
        - care_claim_denied
      distinct_fields: []
  params:
