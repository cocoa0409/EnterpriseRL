# Product charter: Kestrel Commercial Fleet Lease
category: fleet
display_name: Kestrel Commercial Fleet Lease
binding:
  holding_table: fleet_units
  event_tables:
  - fleet_transactions
  intake_tables:
  - fleet_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    book_value: book_value
    charges_due_balance: charges_due
lifecycle:
  states:
  - ordered
  - in_service
  - termination_requested
  - off_road
  - sold
  - purchased
  - defaulted
  - closed
  transitions:
  - from: ordered
    to: in_service
    by: user
    means: The business's authorized signer signs the delivery and acceptance certificate and the unit goes into
      service.
  - from: in_service
    to: termination_requested
    by: user
    means: The authorized signer gives written termination notice for the unit.
  - from: termination_requested
    to: in_service
    by: agent
    means: The termination notice is withdrawn before the unit is turned in.
  - from: termination_requested
    to: off_road
    by: system
    means: The unit is turned in to Kestrel's remarketing network.
  - from: off_road
    to: sold
    by: system
    means: The unit is sold at auction and the sale is settled against its book value.
  - from: sold
    to: closed
    by: system
    means: Any terminal rental adjustment is settled and the unit schedule closes.
  - from: in_service
    to: purchased
    by: user
    means: The business buys the unit under the purchase option.
  - from: termination_requested
    to: purchased
    by: user
    means: The business buys the unit instead of turning it in.
  - from: purchased
    to: closed
    by: system
    means: Title is transferred to the business and the unit schedule closes.
  - from: in_service
    to: defaulted
    by: system
    means: The unit schedule is declared in default after non-payment.
  - from: defaulted
    to: in_service
    by: agent
    means: The default is cured in full and the schedule resumes.
  - from: defaulted
    to: off_road
    by: system
    means: The unit is recovered after an uncured default.
accounts:
- key: book_value
  unit: USD
  meaning: 'Unamortized capitalized cost of the unit: capitalized cost less depreciation billed; retired at sale
    or purchase.'
- key: charges_due
  unit: USD
  meaning: Invoiced but unpaid rentals, late charges, terminal rental adjustment deficiencies and unit charges,
    less payments, surplus credits and waivers.
parameter_schema:
  min_fleet_units: fewest active units (fleet units plus business retail and balloon contracts) for the tier; count
  max_fleet_units: most active units for the tier; count
  min_years_in_business: minimum years the business has operated; years
  min_business_credit_score: minimum Kestrel commercial credit score (1-100) at the last annual review
  credit_line_limit: maximum combined capitalized cost of in-service fleet units plus business retail and balloon
    principal; USD
  personal_guaranty_required: whether a principal's personal guaranty is required on the master lease
  lease_rate_pct: annual lease rate applied to book value to compute the monthly lease charge; percent
  monthly_depreciation_pct_by_class: mapping of vehicle class -> monthly depreciation as a percent of capitalized
    cost for TRAC units; percent
  monthly_management_fee: per-unit monthly management fee added to each rental; USD
  minimum_term_months: months a TRAC unit must stay in service before it may be terminated without the minimum-term
    charge; months
  max_term_months: longest scheduled term for a unit; months
  trac_residual_min_pct: lowest TRAC residual (book value at scheduled term) as a percent of capitalized cost; percent
  max_upfit_pct_of_cap_cost: maximum upfit equipment cost as a percent of the chassis capitalized cost; percent
  invoice_day: day of the month on which consolidated rental invoices are issued
  payment_terms_days: calendar days after the invoice date by which a rental invoice is due; days
  late_charge_grace_days: calendar days after the invoice due date before a late charge applies; days
  late_charge_pct_of_past_due: late charge as a percent of the past-due invoice amount; percent
  late_charge_min: minimum late charge per past-due invoice; USD
  consolidated_billing: whether all units are billed on one consolidated invoice
  accepted_payment_channels: payment channels accepted from business customers
  payment_cutoff_time_ct: time of day (HH:MM, Central Time) by which a payment must be received on a business day
    to post that day
  courtesy_late_waivers_per_year: late charges that may be waived as a courtesy per calendar year per master agreement;
    count
  termination_notice_days: calendar days of written notice required before a unit is turned in; days
  turn_in_after_notice_max_days: calendar days after the notice within which the unit must be turned in or the notice
    lapses; days
  remarketing_fee: fee per unit sold through Kestrel remarketing; USD
  trac_surplus_share_pct: share of a sale surplus over book value credited to the business; percent
  trac_deficiency_payment_days: calendar days after the settlement invoice by which a deficiency is due; days
  closed_end_excess_mileage_rate_by_class: mapping of vehicle class -> excess mileage rate for closed-end commercial
    units; USD per mile
  closed_end_early_termination_fee: early termination fee for a closed-end commercial unit ended before its scheduled
    term; USD
  closed_end_wear_charge_cap_pct: cap on wear charges on a closed-end unit as a percent of capitalized cost; percent
  purchase_option_fee: fee added when the business buys a unit; USD
  purchase_quote_valid_days: calendar days a purchase quote is honoured
  title_transfer_business_days: business days after the purchase funds clear within which title is transferred
  title_transfer_fee: administrative fee for transferring title on a purchased unit, where the title state allows;
    USD
  default_days_past_due: days an invoice may remain unpaid before the unit schedule is declared in default; days
  default_cure_requires_all_units: whether curing a default requires every past-due invoice on the master agreement
    to be paid
  recovery_fee: fee charged when a unit is recovered after default; USD
  unit_order_max_per_request: most units one order request may include; count
  delivery_acceptance_days: calendar days after delivery within which the delivery and acceptance certificate must
    be signed; days
  rental_commencement_rule: how the first rental is charged after acceptance
  registration_renewal_service: whether Kestrel renews registrations and bills the fees at cost
  registration_admin_fee: administrative fee per registration renewal handled by Kestrel; USD
  insurance_min_liability: minimum combined single limit auto liability insurance the business must carry; USD
  insurance_lapse_force_place_fee: monthly fee charged per unit when Kestrel places insurance after a lapse; USD
  annual_review_month: month of the year in which the master agreement's credit is reviewed
  credit_line_overage_tolerance_pct: percent above credit_line_limit allowed for one in-transit order; percent
  authorized_signers_max: most authorized signers that may be named on the master agreement; count
  unit_substitution_allowed: whether a unit may be swapped for a replacement under the same schedule
  relationship_unit_counting: which holdings count as active units for tier placement
  surplus_offset_first: whether a TRAC surplus is applied first to other charges due on the master agreement
  refund_days: calendar days within which a remaining credit is refunded to the business; days
