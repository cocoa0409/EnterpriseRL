        min_years_in_business: =min_years_in_business
        min_business_credit_score: =min_business_credit_score
        personal_guaranty_required: =personal_guaranty_required
        credit_line_limit: =credit_line_limit
        credit_line_overage_tolerance_pct: =credit_line_overage_tolerance_pct
        unit_order_max_per_request: =unit_order_max_per_request
        authorized_signers_max: =authorized_signers_max
      Kestrel Fleet Preferred:
