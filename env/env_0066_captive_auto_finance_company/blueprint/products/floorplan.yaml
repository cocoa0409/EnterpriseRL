events:
- type: floorplan_line_opened
  target: floorplan_lines
  mutation: create
  meaning: A wholesale line is approved for a dealership.
  grain: one row per line; this write changes that record
  fields:
    dealer_number: as approved
    variant_name: as approved
    new_credit_line: as approved
    used_credit_line: as approved
    line_open_date: as approved
    current_rate_pct: as approved
  triggers: []
- type: floorplan_line_activated
  target: floorplan_lines
  mutation:
    transition:
      from: pending_documentation
      to: active
  meaning: Documentation completes and the line opens for advances.
  grain: one row per line; this write changes that record
  fields:
    line_open_date: activation date
  triggers: []
- type: floorplan_credit_hold_placed
  target: floorplan_lines
  mutation:
    transition:
      from: active
      to: credit_hold
  meaning: New advances are stopped.
  grain: one row per line; this write changes that record
  fields:
    last_audit_date: audit that triggered the hold
  triggers: []
- type: floorplan_credit_hold_released
  target: floorplan_lines
  mutation:
    transition:
      from: credit_hold
      to: active
  meaning: The hold is released.
  grain: one row per line; this write changes that record
  fields:
    current_rate_pct: rate after release
  triggers: []
- type: floorplan_wind_down_started
  target: floorplan_lines
  mutation:
    transition:
    - from: active
      to: wind_down
    - from: credit_hold
      to: wind_down
  meaning: The line enters wind-down.
  grain: one row per line; this write changes that record
  fields:
    closed_date: empty until closed
  triggers: []
- type: floorplan_line_closed
  target: floorplan_lines
  mutation:
    transition:
      from: wind_down
      to: closed
  meaning: The line closes.
  grain: one row per line; this write changes that record
  fields:
    closed_date: closing date
  triggers: []
- type: floorplan_line_terms_updated
  target: floorplan_lines
  mutation: update
  meaning: Line amounts, grade or rate change after a credit review.
  grain: one row per line; this write changes that record
  fields:
    new_credit_line: new line
    used_credit_line: used line
    current_rate_pct: rate
    last_audit_date: latest audit
  triggers: []
- type: floorplan_unit_advance
  target: floorplan_transactions
  meaning: A unit is floored and the advance paid to the manufacturer or seller.
  grain: one row per unit advance
  distinguish_by:
  - vin
  fields:
    txn_date: advance date
    amount: advance
    vin: VIN
    unit_condition: kind
  account: floorplan_principal
  direction: in
  triggers: []
- type: floorplan_unit_payoff
  target: floorplan_transactions
  meaning: A floored unit is paid off after sale.
  grain: one row per unit payoff
  distinguish_by:
  - vin
  fields:
    txn_date: payoff date
    amount: payoff
    vin: VIN
  account: floorplan_principal
  direction: out
  triggers: []
- type: floorplan_curtailment
  target: floorplan_transactions
  meaning: A scheduled curtailment is paid on an aged unit.
  grain: one row per unit curtailment
  distinguish_by:
  - vin
  - curtailment_number
  fields:
    txn_date: date
    amount: curtailment
    vin: VIN
    curtailment_number: sequence
  account: floorplan_principal
  direction: out
  triggers: []
- type: floorplan_interest_billed
  target: floorplan_transactions
  meaning: Monthly floorplan interest is billed.
  grain: one row per line per month
  distinguish_by:
  - billing_period
  fields:
    txn_date: billing date
    amount: interest
    billing_period: month
  account: interest_due
  direction: in
  triggers: []
- type: floorplan_fee_billed
  target: floorplan_transactions
  meaning: An audit, sold-out-of-trust or late interest fee is billed.
  grain: one row per fee
  distinguish_by:
  - fee_type
  - txn_date
  - vin
  fields:
    txn_date: date
    amount: fee
    fee_type: kind
    vin: VIN for a sold-out-of-trust fee
  account: interest_due
  direction: in
  triggers: []
- type: floorplan_interest_paid
  target: floorplan_transactions
  meaning: Interest and fees are paid.
  grain: one row per payment
  distinguish_by:
  - txn_date
  - amount
  fields:
    txn_date: date
    amount: paid
    billing_period: month paid
  account: interest_due
  direction: out
  triggers: []
- type: floorplan_audit_completed
  target: floorplan_transactions
  meaning: An unannounced inventory audit is completed.
  grain: one row per audit
  distinguish_by:
  - txn_date
  fields:
    txn_date: audit date
    units_counted: verified
    units_sold_out_of_trust: sold out of trust
  triggers:
  - event: floorplan:floorplan_line_terms_updated
    map:
      last_audit_date: txn_date
measures:
- id: floorplan_msr_unit_floor_days
  window: from a unit's advance date to today
  measure: calendar days the unit has been floored
policies:
- id: floorplan_agg_multi_holding
  subject:
  - floorplan_line_opened
  rule: A dealership holds one wholesale line; additional rooftops of the same owner each hold their own line under
    their own dealer number.
  eligibility: []
  params:
    max_per_customer: 1
- id: floorplan_line_approval
  subject:
  - floorplan_line_opened
  - floorplan_line_activated
  - floorplan_line_terms_updated
  rule: The grade is the one whose min_dealer_risk_score the dealership meets together with min_tangible_net_worth;
    the new line is new_line_multiple_of_monthly_sales times average monthly new unit sales and the used line used_line_pct_of_new_line
    of the new line. personal_guaranty_required, financial_statement_frequency, credit_review_months, insurance_min_inventory_coverage_pct
