# Product charter: Kestrel Dealer Wholesale Floorplan Line
category: floorplan
display_name: Kestrel Dealer Wholesale Floorplan Line
binding:
  holding_table: floorplan_lines
  event_tables:
  - floorplan_transactions
  status_field: status
  variant_field: variant_name
  quantity_fields:
    outstanding_principal: floorplan_principal
    interest_due_balance: interest_due
lifecycle:
  states:
  - pending_documentation
  - active
  - credit_hold
  - wind_down
  - closed
  transitions:
  - from: pending_documentation
    to: active
    by: system
    means: Credit agreement, guaranties and security filings are complete and advances may be made.
  - from: active
    to: credit_hold
    by: system
    means: New advances are stopped after a sold-out-of-trust finding or a payment default.
  - from: credit_hold
    to: active
    by: agent
    means: The hold is released after every exception is cleared.
  - from: active
    to: wind_down
    by: user
    means: The dealer gives notice to end the line, or sells or loses the franchise.
  - from: credit_hold
    to: wind_down
    by: system
    means: An uncleared hold is converted to a wind-down.
  - from: wind_down
    to: closed
    by: system
    means: Every financed unit is paid off and the line closes.
accounts:
- key: floorplan_principal
  unit: USD
  meaning: 'Outstanding wholesale principal on financed units: advances in, payoffs and curtailments out.'
- key: interest_due
  unit: USD
  meaning: Billed but unpaid floorplan interest and fees.
parameter_schema:
  min_dealer_risk_score: lowest Kestrel dealer risk score (1-100) for the grade
  min_tangible_net_worth: minimum dealership tangible net worth; USD
  new_line_multiple_of_monthly_sales: new-vehicle line as a multiple of average monthly new unit sales value; months
  used_line_pct_of_new_line: used-vehicle line as a percent of the new line; percent
  rate_spread_over_prime_pct: floorplan rate spread over the prime rate; percent
  rate_floor_pct: minimum floorplan rate regardless of prime; percent
  interest_day_basis: days in the year for floorplan interest; days
  interest_billing_day: day of the month on which interest for the prior month is billed
  interest_due_days: calendar days after billing by which interest is due
  new_advance_pct_of_invoice: advance on a new Kestrel vehicle as a percent of factory invoice; percent
  used_advance_pct_of_wholesale: advance on a used vehicle as a percent of wholesale book value; percent
  used_vehicle_max_age_years: oldest used vehicle that may be floored; years
  new_curtailment_start_days: days after advance when the first curtailment on a new unit falls due
  new_curtailment_pct: curtailment percent of the original advance on a new unit at each curtailment date; percent
  new_curtailment_interval_days: days between new-unit curtailments after the first
  used_curtailment_start_days: days after advance when the first curtailment on a used unit falls due
  used_curtailment_pct: curtailment percent of the original advance on a used unit at each curtailment date; percent
  used_curtailment_interval_days: days between used-unit curtailments
  used_max_floor_days: days after which a used unit must be paid in full; days
  payoff_business_days_after_sale: business days after a retail sale within which the unit must be paid off
  payoff_business_days_after_funding: business days after the retail contract is funded within which the unit must
    be paid off, whichever comes first
  audit_frequency_days: calendar days between unannounced floorplan audits
  audit_fee: fee per audit; USD
  sot_fee: fee per unit found sold out of trust; USD
  sot_hold_threshold_units: sold-out-of-trust units on one audit that place the line on credit hold; count
  missing_unit_cure_days: business days to produce a unit not found at audit before it is treated as sold out of
    trust
  late_interest_fee_pct: fee on interest billed but unpaid after its due date; percent of the unpaid interest
  late_interest_fee_min: minimum late interest fee; USD
  overline_tolerance_pct: percent over the line allowed for factory shipments already in transit; percent
  demo_unit_limit_pct: share of the new line that may be dealer demonstrators; percent
  demo_monthly_curtailment_pct: monthly curtailment on demonstrator units; percent of the original advance
  service_loaner_limit_units: maximum service loaner units that may be floored; count
  rental_unit_allowed: whether rental-fleet units may be floored
  personal_guaranty_required: whether the dealer principal's personal guaranty is required
  financial_statement_frequency: how often dealership financial statements must be submitted
  credit_review_months: months between full credit reviews of the line
  capital_loan_eligible: whether the dealer may also hold a Kestrel capital or real-estate loan
  rate_change_notice_days: calendar days of notice before a spread change takes effect
  wind_down_payoff_days: calendar days after wind-down begins by which every unit must be paid off
  advance_funding_cutoff_time_ct: time (HH:MM Central Time) by which a factory invoice must be received to be funded
    the same business day
  title_hold_on_used: whether Kestrel holds titles to floored used units
  title_release_on_payoff_business_days: business days after a used-unit payoff within which the title is released
    to the dealer
  insurance_min_inventory_coverage_pct: minimum dealer inventory insurance as a percent of the line; percent
  payment_channels: channels accepted for floorplan payoffs and interest
  auto_debit_payoffs: whether payoffs are debited automatically when the retail contract funds through Kestrel
  max_unit_advance: largest single-unit advance without senior credit approval; USD
  interest_rebate_pct_on_early_payoff: share of a month's interest rebated when a new unit is sold within the dealer's
    first 30 days of floor time; percent
  hold_release_requires_cash_payoff: whether a credit hold is released only after every sold-out-of-trust unit is
    paid in collected funds
