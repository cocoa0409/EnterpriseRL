    must not exceed new_credit_line plus used_credit_line, increased by overline_tolerance_pct for units already
    in transit from the factory. A new Kestrel unit is advanced at new_advance_pct_of_invoice of factory invoice;
    a used unit at used_advance_pct_of_wholesale of wholesale book value and only up to used_vehicle_max_age_years
    old; no single advance may exceed max_unit_advance without senior approval. Demonstrators may not exceed demo_unit_limit_pct
    of the new line, service loaners service_loaner_limit_units, and rental units are floored only where rental_unit_allowed
    is true; invoices received after advance_funding_cutoff_time_ct are funded the next business day.
