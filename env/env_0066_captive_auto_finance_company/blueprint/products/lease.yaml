      the current maturity_date and no later than the current maturity_date.
    evidence_fields:
    - lease_contracts.maturity_date
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
  params:
    per_tier:
      Kestrel Lease Tier 5:
        maturity_extension_max_months: =maturity_extension_max_months
      Kestrel Lease Tier 4:
        maturity_extension_max_months: =maturity_extension_max_months
      Kestrel Lease Tier 3:
        maturity_extension_max_months: =maturity_extension_max_months
      Kestrel Lease Tier 2:
        maturity_extension_max_months: =maturity_extension_max_months
      Kestrel Lease Tier 1:
        maturity_extension_max_months: =maturity_extension_max_months
      Kestrel Lease Tier 1+:
        maturity_extension_max_months: =maturity_extension_max_months
    maturity_extension_request_days_before: =maturity_extension_request_days_before
- id: lease_turn_in_and_inspection
  subject:
  - lease_vehicle_turned_in
  - lease_return_credit
  - lease_inspection_completed
  - lease_inspection_recorded
  - lease_notice_mailed
  - lease_wear_item_assessed
  rule: 'A lease-end options letter is mailed maturity_letter_days_before calendar days before maturity_date. Turning
    the vehicle in is the lessee''s own act at any Kestrel dealer, who records the odometer statement; the lessee
    must make that appointment. A turn-in counts as a scheduled-end turn-in only when the turn-in date is no earlier
    than turn_in_window_days_before_maturity calendar days before maturity_date; an earlier turn-in is an early
    termination unless it qualifies as a pull-ahead. When the vehicle comes back, the remaining adjusted lease balance
    is extinguished; under a closed-end lease the lessee does not owe the residual value. The lessee may have advance_inspections_included
    complimentary advance inspection performed within advance_inspection_window_days calendar days before maturity_date;
    it informs the lessee but the final inspection at turn-in governs the charges. A wear item can be recorded only
    while the lease status is active, maturity_extended, returned or early_terminated. An item is excess when it
    exceeds the Kestrel wear standard: dents or scratches of dent_scratch_standard_inches or longer, windshield
    chips of windshield_chip_standard_inches or larger or any in the driver''s view, any tire below min_tire_tread_32nds
    tread or mismatched, a damaged wheel, torn or burned upholstery, a missing key or equipment, or an inoperative
    light. Each excess item is charged at wear_charge_schedule for its category; items within the standard carry
    a charge of 0.00.'
  eligibility:
  - id: wear_status
    applies_to:
    - lease_wear_item_assessed
    kind: state
    condition: A wear item can be recorded only while the lease status is active, maturity_extended, returned or
      early_terminated.
    evidence_fields:
    - lease_contracts.status
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    state_contract:
      field: lease_contracts.status
      allowed:
      - active
      - maturity_extended
      - returned
      - early_terminated
  - id: scheduled_window
    applies_to:
    - lease_vehicle_turned_in
    kind: authorization
    condition: A turn-in counts as a scheduled-end turn-in only when the turn-in date is no earlier than turn_in_window_days_before_maturity
      calendar days before maturity_date; an earlier turn-in is an early termination unless it qualifies as a pull-ahead.
    evidence_fields:
    - lease_contracts.maturity_date
    - lease_contracts.turn_in_date
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
  params:
    maturity_letter_days_before: =maturity_letter_days_before
    turn_in_window_days_before_maturity: =turn_in_window_days_before_maturity
    advance_inspection_window_days: =advance_inspection_window_days
    advance_inspections_included: =advance_inspections_included
    wear_charge_schedule: =wear_charge_schedule
    dent_scratch_standard_inches: =dent_scratch_standard_inches
    windshield_chip_standard_inches: =windshield_chip_standard_inches
    min_tire_tread_32nds: =min_tire_tread_32nds
- id: lease_inspection_dispute
  subject:
  - lease_wear_item_adjusted
  rule: The lessee disputes the final inspection by completing an inspection dispute request. A dispute must be
    filed no later than inspection_dispute_days after the turn-in inspection was performed. The period is counted
    in calendar days starting the day after the final inspection's inspection_date, and a dispute filed on the last
    day is timely. Each assessed wear item may be adjusted only once. An item is removed_on_dispute when the lessee
    provides a repair invoice from a licensed repair facility dated on or before the turn-in date that covers that
    item's category and location; an item recorded with the wrong category is reduced_on_dispute to the schedule
    charge of the correct category. Photos, opinions and repairs after the turn-in date do not change an item; an
    adjustment never adds a new item.
  eligibility:
  - id: dispute_window
    applies_to:
    - lease_wear_item_adjusted
    kind: time
    condition: A dispute must be filed no later than inspection_dispute_days after the turn-in inspection was performed.
    evidence_fields:
    - lease_inspections.inspection_date
    - lease_inspections.lease_inspection_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_inspections.lease_inspection_id
      action_bindings:
        lease_inspections.lease_inspection_id: lease_inspection_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the turn-in inspection was performed
      anchor_source: lease_inspections.inspection_date
      relation: not_after
      duration_source: variants.inspection_dispute_days
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after the final inspection's inspection_date,
        and a dispute filed on the last day is timely.
      boundary: inclusive
  - id: adjust_once
    applies_to:
    - lease_wear_item_adjusted
    kind: dedup
    condition: Each assessed wear item may be adjusted only once.
    evidence_fields:
