        relationship_exposure_cap: =relationship_exposure_cap
- id: lease_origination_and_disclosure
  subject:
  - lease_contract_booked
  - lease_contract_funded
  - lease_funding
  rule: The tier is the one whose min_credit_score to max_credit_score band contains the lessee's credit score;
    with a co-lessee the higher score is used. The money factor is the tier's money_factor_sheet value for the term
    band plus any dealer markup of no more than max_money_factor_markup. The residual value is MSRP times residual_pct_by_term
    for the term plus the residual_mileage_adjustment_pct for the contracted allowance, rounded to the dollar; only
    the mileage_allowance_options may be contracted. term_months may not exceed max_term_months for the tier, gross_cap_cost
    may not exceed max_cap_cost_pct_of_msrp of MSRP, the capitalized cost reduction must be at least min_cap_cost_reduction_pct
    of MSRP, and total_monthly_payment may not exceed max_pti_pct of verified gross monthly income. The base monthly
    payment is the monthly depreciation, adjusted_cap_cost less residual_value divided by term_months, plus the
    monthly rent charge, adjusted_cap_cost plus residual_value times money_factor; monthly_use_tax is the base monthly
    payment times use_tax_rate_pct. The lease records excess_mileage_rate from excess_mileage_rate_by_class for
    the vehicle class, disposition_fee_standard as disposition_fee, purchase_option_fee_standard as purchase_option_fee,
    and purchase_option_price as residual_value plus purchase_option_fee; the acquisition fee is acquisition_fee.
    Where security_deposit_required is true the security deposit is one total monthly payment rounded up to the
    next security_deposit_rounding_increment; otherwise no deposit is taken. The lease may be funded only when the
    dealer delivers the complete lease package no later than funding_window_days calendar days after the date the
    lease was signed. The window is counted in calendar days starting the day after lease_date, and delivery on
    the last day is timely. On funding the adjusted capitalized cost is booked as the opening lease balance.
  eligibility:
  - id: funding_window
    applies_to:
    - lease_contract_funded
    kind: time
    condition: The lease may be funded only when the dealer delivers the complete lease package no later than funding_window_days
      calendar days after the date the lease was signed.
    evidence_fields:
    - lease_contracts.lease_date
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the lease was signed
      anchor_source: lease_contracts.lease_date
      relation: not_after
      duration_source: variants.funding_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days starting the day after lease_date, and delivery on the
        last day is timely.
      boundary: inclusive
  formula:
    base_monthly_payment: round((adjusted_cap_cost - residual_value) / term_months + (adjusted_cap_cost + residual_value)
      * money_factor, 2)
    monthly_use_tax: round(base_monthly_payment * use_tax_rate_pct / 100, 2)
    total_monthly_payment: base_monthly_payment + monthly_use_tax
  params:
    per_tier:
      Kestrel Lease Tier 5:
        min_credit_score: =min_credit_score
        max_credit_score: =max_credit_score
        money_factor_sheet: =money_factor_sheet
        max_term_months: =max_term_months
        max_cap_cost_pct_of_msrp: =max_cap_cost_pct_of_msrp
        max_pti_pct: =max_pti_pct
        min_cap_cost_reduction_pct: =min_cap_cost_reduction_pct
        security_deposit_required: =security_deposit_required
      Kestrel Lease Tier 4:
        min_credit_score: =min_credit_score
        max_credit_score: =max_credit_score
        money_factor_sheet: =money_factor_sheet
        max_term_months: =max_term_months
        max_cap_cost_pct_of_msrp: =max_cap_cost_pct_of_msrp
        max_pti_pct: =max_pti_pct
        min_cap_cost_reduction_pct: =min_cap_cost_reduction_pct
        security_deposit_required: =security_deposit_required
      Kestrel Lease Tier 3:
        min_credit_score: =min_credit_score
        max_credit_score: =max_credit_score
        money_factor_sheet: =money_factor_sheet
        max_term_months: =max_term_months
        max_cap_cost_pct_of_msrp: =max_cap_cost_pct_of_msrp
        max_pti_pct: =max_pti_pct
        min_cap_cost_reduction_pct: =min_cap_cost_reduction_pct
        security_deposit_required: =security_deposit_required
      Kestrel Lease Tier 2:
        min_credit_score: =min_credit_score
        max_credit_score: =max_credit_score
        money_factor_sheet: =money_factor_sheet
        max_term_months: =max_term_months
        max_cap_cost_pct_of_msrp: =max_cap_cost_pct_of_msrp
        max_pti_pct: =max_pti_pct
        min_cap_cost_reduction_pct: =min_cap_cost_reduction_pct
        security_deposit_required: =security_deposit_required
      Kestrel Lease Tier 1:
        min_credit_score: =min_credit_score
        max_credit_score: =max_credit_score
        money_factor_sheet: =money_factor_sheet
        max_term_months: =max_term_months
        max_cap_cost_pct_of_msrp: =max_cap_cost_pct_of_msrp
        max_pti_pct: =max_pti_pct
        min_cap_cost_reduction_pct: =min_cap_cost_reduction_pct
        security_deposit_required: =security_deposit_required
      Kestrel Lease Tier 1+:
        min_credit_score: =min_credit_score
        max_credit_score: =max_credit_score
        money_factor_sheet: =money_factor_sheet
        max_term_months: =max_term_months
        max_cap_cost_pct_of_msrp: =max_cap_cost_pct_of_msrp
        max_pti_pct: =max_pti_pct
        min_cap_cost_reduction_pct: =min_cap_cost_reduction_pct
        security_deposit_required: =security_deposit_required
    max_money_factor_markup: =max_money_factor_markup
    residual_pct_by_term: =residual_pct_by_term
    residual_mileage_adjustment_pct: =residual_mileage_adjustment_pct
    mileage_allowance_options: =mileage_allowance_options
    min_term_months: =min_term_months
    acquisition_fee: =acquisition_fee
    security_deposit_rounding_increment: =security_deposit_rounding_increment
    funding_window_days: =funding_window_days
    excess_mileage_rate_by_class: =excess_mileage_rate_by_class
    disposition_fee_standard: =disposition_fee_standard
    purchase_option_fee_standard: =purchase_option_fee_standard
- id: lease_payment_posting
  subject:
  - lease_payment
  - lease_fee_payment
  - lease_end_of_term_payment
  rule: 'A lease payment can be posted only while the lease status is active, maturity_extended, repossessed, returned
    or early_terminated. A payment received before payment_cutoff_time_ct Central Time on a business day posts that
    day; otherwise it posts the next business day. A monthly payment is applied in payment_allocation_order: monthly
    use tax, then the month''s rent charge, then the month''s depreciation, which reduces the adjusted lease balance,
    then term fees due. Payments toward end-of-term charges are booked against the end-of-term balance, never against
    the lease balance. The channel fee in payment_channel_fees is collected on top of the payment as convenience_fee;
    purchase and reinstatement funds are accepted only as cashiers_check, wire, moneygram or dealer_remittance and
    carry no channel fee.'
  eligibility:
  - id: payable
    applies_to:
    - lease_payment
    - lease_end_of_term_payment
    kind: state
    condition: A lease payment can be posted only while the lease status is active, maturity_extended, repossessed,
      returned or early_terminated.
    evidence_fields:
    - lease_contracts.status
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    state_contract:
      field: lease_contracts.status
      allowed:
      - active
      - maturity_extended
      - repossessed
      - returned
      - early_terminated
  formula:
    rent_charge_applied: round((adjusted_cap_cost + residual_value) * money_factor, 2)
    depreciation_applied: round((adjusted_cap_cost - residual_value) / term_months, 2)
  params:
    payment_cutoff_time_ct: =payment_cutoff_time_ct
    payment_allocation_order: =payment_allocation_order
    payment_channel_fees: =payment_channel_fees
- id: lease_late_and_returned_fees
  subject:
  - lease_late_charge
  - lease_returned_payment_fee
  - lease_payment_returned
  rule: A late charge can be assessed only while the lease status is active or maturity_extended. A late charge
    may be assessed only after the late_charge_grace_days grace period following the payment due date has fully
    elapsed. The grace period is counted in calendar days starting the day after the payment due date, weekends
    and holidays included, so the first permissible assessment date is the calendar day after the due date plus
    late_charge_grace_days. No more than one late charge may be assessed for the same payment due date. The late
    charge is late_charge_pct_of_unpaid_payment percent of lease_msr_unpaid_payment_portion, capped at the lower
    of late_charge_company_max and the lease's recorded late_charge_max_amount; nothing is assessed when the unpaid
    portion is below late_charge_min_unpaid_amount. A dishonoured payment is reversed in full against the payment
    it dishonours. Only one returned-payment fee may be assessed for the same dishonoured payment. The returned-payment
    fee is the lower of returned_payment_fee_company and the lease's recorded nsf_fee_max_amount, and is assessed
    only for insufficient_funds, account_closed or stop_payment returns.
  eligibility:
  - id: late_status
    applies_to:
    - lease_late_charge
    kind: state
    condition: A late charge can be assessed only while the lease status is active or maturity_extended.
    evidence_fields:
    - lease_contracts.status
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    state_contract:
      field: lease_contracts.status
      allowed:
      - active
      - maturity_extended
  - id: grace
    applies_to:
    - lease_late_charge
    kind: time
    condition: A late charge may be assessed only after the late_charge_grace_days grace period following the payment
      due date has fully elapsed.
    evidence_fields:
    - lease_contracts.next_due_date
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payment due date
      anchor_source: lease_contracts.next_due_date
      relation: not_before
      duration_source: variants.late_charge_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days starting the day after the payment due date, weekends
        and holidays included, so the first permissible assessment date is the calendar day after the due date plus
        late_charge_grace_days.
      boundary: exclusive
  - id: one_late
    applies_to:
    - lease_late_charge
    kind: dedup
    condition: No more than one late charge may be assessed for the same payment due date.
    evidence_fields:
    - lease_transactions.installment_due_date
    - lease_transactions.lease_contract_id
    - lease_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_transactions.lease_contract_id
        - lease_transactions.installment_due_date
      action_bindings:
        lease_transactions.lease_contract_id: lease_contract_id
        lease_transactions.installment_due_date: installment_due_date
    dedup_contract:
      table: lease_transactions
      mode: separate_record
      object_bindings:
        lease_contract_id: lease_contract_id
        installment_due_date: installment_due_date
      duplicate_filters:
        event_type:
        - lease_late_charge
      distinct_fields: []
  - id: one_nsf
    applies_to:
    - lease_returned_payment_fee
    kind: dedup
    condition: Only one returned-payment fee may be assessed for the same dishonoured payment.
    evidence_fields:
    - lease_transactions.reversed_txn_id
    - lease_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_transactions.reversed_txn_id
      action_bindings:
        lease_transactions.reversed_txn_id: reversed_txn_id
    dedup_contract:
      table: lease_transactions
      mode: separate_record
      object_bindings:
        reversed_txn_id: reversed_txn_id
      duplicate_filters:
        event_type:
        - lease_returned_payment_fee
      distinct_fields: []
  measures:
  - lease_msr_unpaid_payment_portion
  formula:
    amount: min(round(lease_msr_unpaid_payment_portion * late_charge_pct_of_unpaid_payment / 100, 2), late_charge_company_max,
      late_charge_max_amount)
  params:
    late_charge_grace_days: =late_charge_grace_days
    late_charge_pct_of_unpaid_payment: =late_charge_pct_of_unpaid_payment
    late_charge_company_max: =late_charge_company_max
    late_charge_min_unpaid_amount: =late_charge_min_unpaid_amount
    returned_payment_fee_company: =returned_payment_fee_company
- id: lease_fee_waivers
  subject:
  - lease_fee_waiver
  rule: A fee transaction may be waived only once. Term-fee waivers are always of the whole fee. A courtesy_on_time_history
    waiver applies only to a late charge and only when lease_msr_consecutive_on_time is at least courtesy_min_consecutive_on_time
    and lease_msr_courtesy_waivers_lookback is below courtesy_waivers_per_12_months for the tier; a tier whose allowance
    is 0 receives none. A servicing_error waiver applies to any term fee the company's records show it caused, without
