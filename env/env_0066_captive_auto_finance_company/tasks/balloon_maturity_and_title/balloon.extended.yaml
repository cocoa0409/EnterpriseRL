      anchor_event: the last due-date change took effect
      anchor_source: balloon_contracts.last_due_date_change_date
      relation: not_before
      duration_source: variants.due_date_change_interval_months
      unit: calendar_months
      counting_rule: The interval is counted in calendar months from last_due_date_change_date to the same day number
        of the later month, falling back to that month's last day when the day does not exist; a contract that has
        never changed its due date has no interval to wait.
      boundary: inclusive
  params:
