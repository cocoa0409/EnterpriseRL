    replaced_by: For the return fee billed on a returned balloon contract of a customer who holds at most one active Kestrel lease, at most one active Kestrel new-vehicle retail contract and at most one active Kestrel pre-owned retail contract, and only for that fee, the return fee is return_option_fee for the tier, it is still waived in full when the customer holds an active Kestrel lease, new-vehicle retail contract or pre-owned retail contract dated within return_fee_loyalty_days calendar days before or after the return date, and the further fee basis and reductions set out in this rule apply; a customer holding two or more active Kestrel leases, two or more active Kestrel new-vehicle retail contracts or two or more active Kestrel pre-owned retail contracts is outside this rule and its tool, and that customer's return fee stays under the base sentence, by which the return fee is return_option_fee for the tier, waived when the customer signs a new Kestrel retail contract or lease within return_fee_loyalty_days calendar days before or after the return date; the rest of the return rule, including the mileage and wear provisions, the return window and the billing timing, stays as the base states it.
