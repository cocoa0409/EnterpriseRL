    fee_autopay_reduction_high: 40.0
    fee_autopay_reduction_mid: 20.0
  rule: 'This rule sets the return fee billed once a balloon vehicle has come back under the return option. The return fee is return_option_fee for the tier, rounded to the cent. Calendar days from one date to another count the later date and not the earlier one; whole calendar months from one date to another are complete each time the later date reaches the earlier date''s day of the month, so a later date that falls earlier in its month (month-end included) leaves that month incomplete; a window of N calendar months ending on a date takes in the dates on or before that date that fall fewer than N whole calendar months before it. For the return fee billed on a returned balloon contract of a customer who holds at most one active Kestrel lease, at most one active Kestrel new-vehicle retail contract and at most one active Kestrel pre-owned retail contract, and only for that fee, the return fee is return_option_fee for the tier, it is still waived in full when the customer holds an active Kestrel lease, new-vehicle retail contract or pre-owned retail contract dated within return_fee_loyalty_days calendar days before or after the return date, and the further fee basis and reductions set out in this rule apply; a customer holding two or more active Kestrel leases, two or more active Kestrel new-vehicle retail contracts or two or more active Kestrel pre-owned retail contracts is outside this rule and its tool, and that customer''s return fee stays under the base sentence, by which the return fee is return_option_fee for the tier, waived when the customer signs a new Kestrel retail contract or lease within return_fee_loyalty_days calendar days before or after the return date; the rest of the return rule, including the mileage and wear provisions, the return window and the billing timing, stays as the base states it. Return fee basis: where the customer holds an active Kestrel lease, new-vehicle retail contract or pre-owned retail contract whose lease_date or contract_date falls within return_fee_loyalty_days calendar days before or after the return date, the return fee is waived and is zero; where the customer holds no such contract but holds an active Kestrel lease whose lease_date falls within fee_loyalty_extended_days calendar days before or after the return date, the return fee is the lower of return_option_fee for the tier and the disposition_fee of that lease; otherwise the return fee is return_option_fee for the tier. Return fee early-return reduction: where the vehicle came back at least fee_early_days_long calendar days before maturity_date, the return fee is reduced by fee_early_reduction_long; where it came back at least one but fewer than fee_early_days_long calendar days before maturity_date, it is reduced by fee_early_reduction_short; where it came back on or after maturity_date, there is no early-return reduction. Return fee multi-line reduction: a customer holding active Kestrel accounts in two or more of the lease, new-vehicle retail and pre-owned retail lines has the return fee reduced by fee_multi_line_reduction_two; one holding an active Kestrel account in exactly one of those lines has it reduced by fee_multi_line_reduction_one; a customer holding none has no multi-line reduction. Return fee payment-record reduction: a contract with no balloon late charge and no balloon returned payment in the fee_history_window_months calendar months ending on the billing date has the return fee reduced by fee_record_reduction_clean; a contract with exactly one balloon late charge and no balloon returned payment in those months has it reduced by fee_record_reduction_one_late; any other contract has no payment-record reduction. Return fee autopay reduction: where the balloon payments posted through autopay_ach in the fee_history_window_months calendar months ending on the billing date number at least fee_autopay_count_high, the return fee is reduced by fee_autopay_reduction_high; where they number at least fee_autopay_count_mid but fewer than fee_autopay_count_high, it is reduced by fee_autopay_reduction_mid; otherwise there is no autopay reduction. The basis of the return fee is set first and every reduction that applies is then subtracted from it; the return fee that remains never falls below zero and is rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: lease
    as: branch
    reads:
    - status
    - lease_date
    - disposition_fee
    note: The return fee basis is decided by an active Kestrel lease dated near the return date and reads that lease's disposition_fee; active leases also count toward the multi-line reduction.
  - category: retail
    as: branch
    reads:
    - status
    - contract_date
    note: An active new-vehicle retail contract dated near the return date waives the fee and an active one counts toward the multi-line reduction.
  - category: preowned
    as: branch
    reads:
    - status
    - contract_date
    note: An active pre-owned retail contract dated near the return date waives the fee and an active one counts toward the multi-line reduction.
  compute:
  - fee_lease_gap: ABS(DAYS(F('return_date'), CFIELD('lease', 'lease_date', status='active'))) if EXISTS('lease', status='active') else 99999
  - fee_retail_gap: ABS(DAYS(F('return_date'), CFIELD('retail', 'contract_date', status='active'))) if EXISTS('retail', status='active') else 99999
  - fee_preowned_gap: ABS(DAYS(F('return_date'), CFIELD('preowned', 'contract_date', status='active'))) if EXISTS('preowned', status='active') else 99999
  - fee_basis: 0 if MN(fee_lease_gap, fee_retail_gap, fee_preowned_gap) <= P('return_fee_loyalty_days') else (MN(P('return_option_fee'), CFIELD('lease', 'disposition_fee', status='active')) if fee_lease_gap <= K('fee_loyalty_extended_days') else P('return_option_fee'))
  - days_early: DAYS(F('return_date'), F('maturity_date'))
  - early_reduction: K('fee_early_reduction_long') if days_early >= K('fee_early_days_long') else (K('fee_early_reduction_short') if days_early >= 1 else 0)
  - active_lines: (1 if EXISTS('lease', status='active') else 0) + (1 if EXISTS('retail', status='active') else 0) + (1 if EXISTS('preowned', status='active') else 0)
  - multi_line_reduction: K('fee_multi_line_reduction_two') if active_lines >= 2 else (K('fee_multi_line_reduction_one') if active_lines == 1 else 0)
  - fee_late_window: COUNT('balloon_transactions', within_months=K('fee_history_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - fee_returned_window: COUNT('balloon_transactions', within_months=K('fee_history_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - record_reduction: K('fee_record_reduction_clean') if (fee_late_window == 0 and fee_returned_window == 0) else (K('fee_record_reduction_one_late') if (fee_late_window == 1 and fee_returned_window == 0) else 0)
  - autopay_count: COUNT('balloon_transactions', within_months=K('fee_history_window_months'), date_field='txn_date', event_type='balloon_payment', payment_channel='autopay_ach')
  - autopay_reduction: K('fee_autopay_reduction_high') if autopay_count >= K('fee_autopay_count_high') else (K('fee_autopay_reduction_mid') if autopay_count >= K('fee_autopay_count_mid') else 0)
  - result: RND(MX(0, fee_basis - early_reduction - multi_line_reduction - record_reduction - autopay_reduction), 2)
  compute_basis:
    fee_lease_gap: where the customer holds an active Kestrel lease, new-vehicle retail contract or pre-owned retail contract whose lease_date or contract_date falls within return_fee_loyalty_days calendar days before or after the return date
    fee_retail_gap: where the customer holds an active Kestrel lease, new-vehicle retail contract or pre-owned retail contract whose lease_date or contract_date falls within return_fee_loyalty_days calendar days before or after the return date
    fee_preowned_gap: where the customer holds an active Kestrel lease, new-vehicle retail contract or pre-owned retail contract whose lease_date or contract_date falls within return_fee_loyalty_days calendar days before or after the return date
    fee_basis: 'Return fee basis: where the customer holds an active Kestrel lease, new-vehicle retail contract or pre-owned retail contract whose lease_date or contract_date falls within return_fee_loyalty_days calendar days before or after the return date, the return fee is waived and is zero; where the customer holds no such contract but holds an active Kestrel lease whose lease_date falls within fee_loyalty_extended_days calendar days before or after the return date, the return fee is the lower of return_option_fee for the tier and the disposition_fee of that lease; otherwise the return fee is return_option_fee for the tier.'
    days_early: where the vehicle came back at least fee_early_days_long calendar days before maturity_date
    early_reduction: 'Return fee early-return reduction: where the vehicle came back at least fee_early_days_long calendar days before maturity_date, the return fee is reduced by fee_early_reduction_long; where it came back at least one but fewer than fee_early_days_long calendar days before maturity_date, it is reduced by fee_early_reduction_short; where it came back on or after maturity_date, there is no early-return reduction.'
    active_lines: a customer holding active Kestrel accounts in two or more of the lease, new-vehicle retail and pre-owned retail lines
    multi_line_reduction: 'Return fee multi-line reduction: a customer holding active Kestrel accounts in two or more of the lease, new-vehicle retail and pre-owned retail lines has the return fee reduced by fee_multi_line_reduction_two; one holding an active Kestrel account in exactly one of those lines has it reduced by fee_multi_line_reduction_one; a customer holding none has no multi-line reduction.'
    fee_late_window: a contract with no balloon late charge and no balloon returned payment in the fee_history_window_months calendar months ending on the billing date
    fee_returned_window: a contract with no balloon late charge and no balloon returned payment in the fee_history_window_months calendar months ending on the billing date
    record_reduction: 'Return fee payment-record reduction: a contract with no balloon late charge and no balloon returned payment in the fee_history_window_months calendar months ending on the billing date has the return fee reduced by fee_record_reduction_clean; a contract with exactly one balloon late charge and no balloon returned payment in those months has it reduced by fee_record_reduction_one_late; any other contract has no payment-record reduction.'
    autopay_count: where the balloon payments posted through autopay_ach in the fee_history_window_months calendar months ending on the billing date number at least fee_autopay_count_high
    autopay_reduction: 'Return fee autopay reduction: where the balloon payments posted through autopay_ach in the fee_history_window_months calendar months ending on the billing date number at least fee_autopay_count_high, the return fee is reduced by fee_autopay_reduction_high; where they number at least fee_autopay_count_mid but fewer than fee_autopay_count_high, it is reduced by fee_autopay_reduction_mid; otherwise there is no autopay reduction.'
    result: The basis of the return fee is set first and every reduction that applies is then subtracted from it; the return fee that remains never falls below zero and is rounded to the cent.
  factors:
  - id: fc_fee_basis
    effect: method
    decides: fee_basis
    bindings:
    - fee_lease_gap
    - fee_retail_gap
    - fee_preowned_gap
    - fee_basis
    ladder:
    - when: an active Kestrel lease, new-vehicle retail or pre-owned retail contract dated within return_fee_loyalty_days days of the return date
      method: the return fee is waived (zero)
    - when: no such contract, but an active Kestrel lease dated within fee_loyalty_extended_days days of the return date
      method: the return fee is the lower of return_option_fee for the tier and that lease's disposition_fee
    - when: otherwise
      method: the return fee is return_option_fee for the tier
    baseline:
      fee_basis: P('return_option_fee')
    evidence:
    - cross_category
    - date
    cross_difficulty: lease
  - id: fc_early_return
    effect: parameter
    decides: early_reduction
    bindings:
    - days_early
    - early_reduction
    ladder:
    - when: came back at least fee_early_days_long days before maturity_date
      value: K('fee_early_reduction_long')
    - when: came back at least one but fewer than fee_early_days_long days before maturity_date
      value: K('fee_early_reduction_short')
    - when: otherwise (on or after maturity_date)
      value: '0'
    baseline:
      early_reduction: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: fc_multi_line
    effect: parameter
    decides: multi_line_reduction
    bindings:
    - active_lines
    - multi_line_reduction
    ladder:
    - when: active Kestrel accounts in two or more of the lease, new-vehicle retail and pre-owned retail lines
      value: K('fee_multi_line_reduction_two')
    - when: an active Kestrel account in exactly one of those lines
      value: K('fee_multi_line_reduction_one')
    - when: otherwise
      value: '0'
    baseline:
      multi_line_reduction: '0'
    evidence:
    - cross_category
    cross_difficulty: lease
  - id: fc_payment_record
    effect: parameter
    decides: record_reduction
    bindings:
    - fee_late_window
    - fee_returned_window
    - record_reduction
    ladder:
    - when: no balloon late charge AND no balloon returned payment in the fee_history_window_months months ending on the billing date
      value: K('fee_record_reduction_clean')
    - when: exactly one balloon late charge AND no balloon returned payment in those months
      value: K('fee_record_reduction_one_late')
    - when: otherwise
      value: '0'
    baseline:
      record_reduction: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fc_autopay_record
    effect: parameter
    decides: autopay_reduction
    bindings:
    - autopay_count
    - autopay_reduction
    ladder:
    - when: at least fee_autopay_count_high balloon payments through autopay_ach in the fee_history_window_months months ending on the billing date
      value: K('fee_autopay_reduction_high')
    - when: at least fee_autopay_count_mid but fewer than fee_autopay_count_high such payments
      value: K('fee_autopay_reduction_mid')
    - when: otherwise
      value: '0'
    baseline:
      autopay_reduction: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The return fee is return_option_fee for the tier, rounded to the cent.
    params:
    - return_option_fee
  inputs:
    history:
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_late_charge
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_payment_returned
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_payment
        payment_channel: autopay_ach
    cross_category:
    - lease
    - retail
    - preowned
- id: balloon_ext_return_balance_plan
  base_policy_refs:
  - balloon_payment_posting
  - balloon_vehicle_return
  - balloon_reinstatement_and_redemption
  overwrite:
  - base_policy: balloon_payment_posting
    superseded_clause: A payment can be posted only while the contract status is active, repo_assigned, repossessed or deficiency.
    replaced_by: For a return balance payment on a balloon contract in returned status, and only for such a payment, the payment may be posted while the contract status is returned and is applied in payment_allocation_order, which on a returned contract carrying no principal and nothing past due places all of it on fees due; every other payment, which is posted outside this rule and its tool, remains bound by the base rule that a payment can be posted only while the contract status is active, repo_assigned, repossessed or deficiency.
  - base_policy: balloon_vehicle_return
    superseded_clause: charges are due return_charges_due_days calendar days after billing
    replaced_by: For return charges placed on a return balance plan under this rule, and only for those charges, the charges fall due in the monthly installments this rule sets, the first being the return balance payment; return charges not placed on a plan, whether settled in one return balance payment under this rule or not yet paid, stay due return_charges_due_days calendar days after billing, the account still closes when they are paid and unpaid charges are still charged off return_charge_off_days after the return, as the base states.
  trigger: on_request
  subject:
  - balloon_payment
  computes: amount
  target_tool: pay_return_balance_installment_2f123e0a
  params:
    plan_history_window_months: 12
    plan_recent_window_months: 6
    plan_long_window_months: 24
    plan_min_installment: 300.0
    plan_installments_floor: 2
    plan_installments_max: 4
    plan_installments_entry: 2
    prior_fee_share_clean: 0.0
    prior_fee_share_recovering: 0.5
    min_share_high: 0.5
    min_share_standard: 0.35
    relationship_deferral_two: 100.0
    relationship_deferral_one: 50.0
    returned_upfront_recent: 75.0
    returned_upfront_older: 40.0
  rule: 'This rule sets the return balance payment a customer makes, under the Kestrel return balance plan, on a balloon contract that has come back under the return option. The return balance payment is fixed only after the excess mileage charge for the return stands billed on the contract. The return balance payment is not fixed until the excess wear charge for the return stands billed on the contract. Before the return balance payment is fixed, the return fee for the return must stand billed on the contract. The return charges are the excess mileage charge, the excess wear charge and the return fee billed on the contract for the return. The fees standing from before the return are fees_due_balance less the return charges, never below zero. The return balance payment is the fees standing from before the return plus the return charges, paid in one payment and rounded to the cent. Calendar days from one date to another count the later date and not the earlier one; whole calendar months from one date to another are complete each time the later date reaches the earlier date''s day of the month, so a later date that falls earlier in its month (month-end included) leaves that month incomplete; a window of N calendar months ending on a date takes in the dates on or before that date that fall fewer than N whole calendar months before it. For a return balance payment on a balloon contract in returned status, and only for such a payment, the payment may be posted while the contract status is returned and is applied in payment_allocation_order, which on a returned contract carrying no principal and nothing past due places all of it on fees due; every other payment, which is posted outside this rule and its tool, remains bound by the base rule that a payment can be posted only while the contract status is active, repo_assigned, repossessed or deficiency. For return charges placed on a return balance plan under this rule, and only for those charges, the charges fall due in the monthly installments this rule sets, the first being the return balance payment; return charges not placed on a plan, whether settled in one return balance payment under this rule or not yet paid, stay due return_charges_due_days calendar days after billing, the account still closes when they are paid and unpaid charges are still charged off return_charge_off_days after the return, as the base states. Return balance plan length: a contract in Kestrel Advantage Balloon Tier 3, Tier 2, Tier 1 or Tier 1+ with no balloon returned payment in the plan_history_window_months calendar months ending on the payment date spreads its return charges over a number of monthly installments equal to the return charges divided by plan_min_installment, rounded down to a whole number and held between plan_installments_floor and plan_installments_max, and the part of the return charges paid now is the return charges divided by that number; a contract in Kestrel Advantage Balloon Tier 4 or Tier 5 with no balloon returned payment in those months spreads its return charges over plan_installments_entry monthly installments, the part paid now being the return charges divided by plan_installments_entry; any other contract pays its return charges in one payment. Return balance prior-fee share: where no balloon late charge and no balloon returned payment was assessed or posted in the plan_history_window_months calendar months ending on the payment date, prior_fee_share_clean of the fees standing from before the return is collected with the return balance payment; where one or more was assessed or posted in those months but none in the plan_recent_window_months calendar months ending on the payment date, prior_fee_share_recovering of those fees is collected with it; otherwise all of them are collected with it. Return balance minimum share: a contract with two or more balloon late charges assessed in the plan_long_window_months calendar months ending on the payment date pays at least min_share_high of its return charges with the return balance payment; a contract with exactly one balloon late charge in those months pays at least min_share_standard of them; a contract with no late charge in those months has no minimum share. Return balance relationship deferral: a customer holding both an active Kestrel lease showing days_past_due of 0 and an active Kestrel new-vehicle retail contract showing days_past_due of 0 has relationship_deferral_two of the return balance payment moved to the later installments; a customer holding only one of those two, an active Kestrel lease or an active Kestrel new-vehicle retail contract showing days_past_due of 0, has relationship_deferral_one moved; any other customer has no relationship deferral. Return balance upfront amount: where a balloon returned payment posted in the plan_history_window_months calendar months ending on the payment date, returned_upfront_recent is added to the return balance payment; where none posted in those months but one or more posted in the plan_long_window_months calendar months ending on the payment date, returned_upfront_older is added; otherwise nothing is added. Where more than one figure is set for the part of the return charges paid now, the larger is used; the collected part of the fees standing from before the return is added to it, every amount moved to later installments is then taken off and every amount added upfront is then added; the return balance payment never falls below zero, never exceeds fees_due_balance and is rounded to the cent.'
  prerequisite:
  - problem: balloon_ext_return_mileage_charge
    kind: value_input
    gate: mileage_billed
    form: state
    policy_source: The return balance payment is fixed only after the excess mileage charge for the return stands billed on the contract.
    condition: The returned contract carries a balloon_return_charge entry with fee_type excess_mileage_charge for the return, and fees_due_balance includes it.
    resolved_by: bill_excess_mileage_charge_7a491561
    effect: mileage_billed moves from 0.00 to the billed excess mileage charge, which raises the return charges and the part of them paid now.
  - problem: balloon_ext_return_wear_charge
    kind: value_input
    gate: wear_billed
    form: state
    policy_source: The return balance payment is not fixed until the excess wear charge for the return stands billed on the contract.
    condition: The returned contract carries a balloon_return_charge entry with fee_type excess_wear_charge for the return, and fees_due_balance includes it.
    resolved_by: bill_excess_wear_charge_ce1b5dd4
    effect: wear_billed moves from 0.00 to the billed excess wear charge, which raises the return charges and the part of them paid now.
  - problem: balloon_ext_return_fee
    kind: value_input
    gate: fee_billed
    form: state
    policy_source: Before the return balance payment is fixed, the return fee for the return must stand billed on the contract.
    condition: The returned contract carries a balloon_return_charge entry with fee_type return_fee for the return, and fees_due_balance includes it.
    resolved_by: bill_return_fee_2252d2f2
    effect: fee_billed moves from 0.00 to the billed return fee, which raises the return charges and the part of them paid now.
  cross_category:
  - category: lease
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship deferral is decided by whether the customer's active Kestrel lease shows days_past_due of 0.
  - category: retail
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship deferral is also decided by whether an active Kestrel new-vehicle retail contract shows days_past_due of 0.
  compute:
  - mileage_billed: SUM('balloon_transactions', 'amount', event_type='balloon_return_charge', fee_type='excess_mileage_charge')
  - wear_billed: SUM('balloon_transactions', 'amount', event_type='balloon_return_charge', fee_type='excess_wear_charge')
  - fee_billed: SUM('balloon_transactions', 'amount', event_type='balloon_return_charge', fee_type='return_fee')
  - return_charges: mileage_billed + wear_billed + fee_billed
  - prior_fees: MX(0, F('fees_due_balance') - return_charges)
  - plan_returned_window: COUNT('balloon_transactions', within_months=K('plan_history_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - plan_count: MX(K('plan_installments_floor'), MN(K('plan_installments_max'), int(return_charges / K('plan_min_installment'))))
  - spread_part: return_charges / plan_count if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 3' or F('variant_name') == 'Kestrel Advantage Balloon Tier 2' or F('variant_name') == 'Kestrel Advantage Balloon Tier 1' or F('variant_name') == 'Kestrel Advantage Balloon Tier 1+') and plan_returned_window == 0) else (return_charges / K('plan_installments_entry') if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 4' or F('variant_name') == 'Kestrel Advantage Balloon Tier 5') and plan_returned_window == 0) else return_charges)
  - prior_late_window: COUNT('balloon_transactions', within_months=K('plan_history_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - prior_returned_window: COUNT('balloon_transactions', within_months=K('plan_history_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - prior_late_recent: COUNT('balloon_transactions', within_months=K('plan_recent_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - prior_returned_recent: COUNT('balloon_transactions', within_months=K('plan_recent_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - prior_share: K('prior_fee_share_clean') if (prior_late_window == 0 and prior_returned_window == 0) else (K('prior_fee_share_recovering') if (prior_late_recent == 0 and prior_returned_recent == 0) else 1)
  - share_late_window: COUNT('balloon_transactions', within_months=K('plan_long_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - minimum_share: K('min_share_high') if share_late_window >= 2 else (K('min_share_standard') if share_late_window == 1 else 0)
  - lease_dpd: CFIELD('lease', 'days_past_due', status='active', days_past_due=0) if EXISTS('lease', status='active', days_past_due=0) else -1
  - retail_dpd: CFIELD('retail', 'days_past_due', status='active', days_past_due=0) if EXISTS('retail', status='active', days_past_due=0) else -1
  - relationship_deferral: K('relationship_deferral_two') if (lease_dpd == 0 and retail_dpd == 0) else (K('relationship_deferral_one') if (lease_dpd == 0 or retail_dpd == 0) else 0)
  - upfront_returned_window: COUNT('balloon_transactions', within_months=K('plan_history_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - upfront_returned_long: COUNT('balloon_transactions', within_months=K('plan_long_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - upfront_amount: K('returned_upfront_recent') if upfront_returned_window >= 1 else (K('returned_upfront_older') if upfront_returned_long >= 1 else 0)
  - charges_now: MX(spread_part, return_charges * minimum_share)
  - result: RND(MN(F('fees_due_balance'), MX(0, charges_now + prior_fees * prior_share - relationship_deferral + upfront_amount)), 2)
  compute_basis:
    mileage_billed: The return charges are the excess mileage charge, the excess wear charge and the return fee billed on the contract for the return.
    wear_billed: The return charges are the excess mileage charge, the excess wear charge and the return fee billed on the contract for the return.
    fee_billed: The return charges are the excess mileage charge, the excess wear charge and the return fee billed on the contract for the return.
    return_charges: The return charges are the excess mileage charge, the excess wear charge and the return fee billed on the contract for the return.
    prior_fees: The fees standing from before the return are fees_due_balance less the return charges, never below zero.
    plan_returned_window: with no balloon returned payment in the plan_history_window_months calendar months ending on the payment date
    plan_count: a number of monthly installments equal to the return charges divided by plan_min_installment, rounded down to a whole number and held between plan_installments_floor and plan_installments_max
    spread_part: 'Return balance plan length: a contract in Kestrel Advantage Balloon Tier 3, Tier 2, Tier 1 or Tier 1+ with no balloon returned payment in the plan_history_window_months calendar months ending on the payment date spreads its return charges over a number of monthly installments equal to the return charges divided by plan_min_installment, rounded down to a whole number and held between plan_installments_floor and plan_installments_max, and the part of the return charges paid now is the return charges divided by that number; a contract in Kestrel Advantage Balloon Tier 4 or Tier 5 with no balloon returned payment in those months spreads its return charges over plan_installments_entry monthly installments, the part paid now being the return charges divided by plan_installments_entry; any other contract pays its return charges in one payment.'
    prior_late_window: where no balloon late charge and no balloon returned payment was assessed or posted in the plan_history_window_months calendar months ending on the payment date
    prior_returned_window: where no balloon late charge and no balloon returned payment was assessed or posted in the plan_history_window_months calendar months ending on the payment date
    prior_late_recent: but none in the plan_recent_window_months calendar months ending on the payment date
    prior_returned_recent: but none in the plan_recent_window_months calendar months ending on the payment date
    prior_share: 'Return balance prior-fee share: where no balloon late charge and no balloon returned payment was assessed or posted in the plan_history_window_months calendar months ending on the payment date, prior_fee_share_clean of the fees standing from before the return is collected with the return balance payment; where one or more was assessed or posted in those months but none in the plan_recent_window_months calendar months ending on the payment date, prior_fee_share_recovering of those fees is collected with it; otherwise all of them are collected with it.'
    share_late_window: a contract with two or more balloon late charges assessed in the plan_long_window_months calendar months ending on the payment date
    minimum_share: 'Return balance minimum share: a contract with two or more balloon late charges assessed in the plan_long_window_months calendar months ending on the payment date pays at least min_share_high of its return charges with the return balance payment; a contract with exactly one balloon late charge in those months pays at least min_share_standard of them; a contract with no late charge in those months has no minimum share.'
    lease_dpd: a customer holding both an active Kestrel lease showing days_past_due of 0 and an active Kestrel new-vehicle retail contract showing days_past_due of 0
    retail_dpd: a customer holding both an active Kestrel lease showing days_past_due of 0 and an active Kestrel new-vehicle retail contract showing days_past_due of 0
    relationship_deferral: 'Return balance relationship deferral: a customer holding both an active Kestrel lease showing days_past_due of 0 and an active Kestrel new-vehicle retail contract showing days_past_due of 0 has relationship_deferral_two of the return balance payment moved to the later installments; a customer holding only one of those two, an active Kestrel lease or an active Kestrel new-vehicle retail contract showing days_past_due of 0, has relationship_deferral_one moved; any other customer has no relationship deferral.'
    upfront_returned_window: where a balloon returned payment posted in the plan_history_window_months calendar months ending on the payment date
    upfront_returned_long: but one or more posted in the plan_long_window_months calendar months ending on the payment date
    upfront_amount: 'Return balance upfront amount: where a balloon returned payment posted in the plan_history_window_months calendar months ending on the payment date, returned_upfront_recent is added to the return balance payment; where none posted in those months but one or more posted in the plan_long_window_months calendar months ending on the payment date, returned_upfront_older is added; otherwise nothing is added.'
    charges_now: Where more than one figure is set for the part of the return charges paid now, the larger is used
    result: the collected part of the fees standing from before the return is added to it, every amount moved to later installments is then taken off and every amount added upfront is then added; the return balance payment never falls below zero, never exceeds fees_due_balance and is rounded to the cent.
  factors:
  - id: rp_plan_length
    effect: method
    decides: spread_part
    bindings:
    - plan_returned_window
    - plan_count
    - spread_part
    ladder:
    - when: Tier 3, Tier 2, Tier 1 or Tier 1+ AND no balloon returned payment in the plan_history_window_months months ending on the payment date
      method: 'the return charges are divided by a balance-driven installment count: the return charges divided by plan_min_installment, rounded down and held between plan_installments_floor and plan_installments_max'
    - when: Tier 4 or Tier 5 AND no balloon returned payment in those months
      method: the return charges are divided by the fixed count plan_installments_entry
    - when: otherwise
      method: the return charges are paid in one payment
    baseline:
      spread_part: return_charges
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  - id: rp_prior_fee_share
    effect: parameter
    decides: prior_share
    bindings:
    - prior_late_window
    - prior_returned_window
    - prior_late_recent
    - prior_returned_recent
    - prior_share
    ladder:
    - when: no balloon late charge AND no balloon returned payment in the plan_history_window_months months ending on the payment date
      value: K('prior_fee_share_clean')
    - when: one or more in those months AND none in the plan_recent_window_months months ending on the payment date
      value: K('prior_fee_share_recovering')
    - when: otherwise
      value: '1'
    baseline:
      prior_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: rp_minimum_share
    effect: parameter
    decides: minimum_share
    bindings:
    - share_late_window
    - minimum_share
    ladder:
    - when: two or more balloon late charges in the plan_long_window_months months ending on the payment date
      value: K('min_share_high')
    - when: exactly one balloon late charge in those months
      value: K('min_share_standard')
    - when: otherwise (no late charge in those months)
      value: '0'
    baseline:
      minimum_share: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rp_relationship_deferral
    effect: parameter
    decides: relationship_deferral
    bindings:
    - lease_dpd
    - retail_dpd
    - relationship_deferral
    ladder:
    - when: an active Kestrel lease AND an active Kestrel new-vehicle retail contract, each at days_past_due 0
      value: K('relationship_deferral_two')
    - when: exactly one of them at days_past_due 0
      value: K('relationship_deferral_one')
    - when: otherwise
      value: '0'
    baseline:
      relationship_deferral: '0'
    evidence:
    - cross_category
    cross_difficulty: lease
  - id: rp_upfront_amount
    effect: parameter
    decides: upfront_amount
    bindings:
    - upfront_returned_window
    - upfront_returned_long
    - upfront_amount
    ladder:
    - when: a balloon returned payment posted in the plan_history_window_months months ending on the payment date
      value: K('returned_upfront_recent')
    - when: none in those months but one or more in the plan_long_window_months months ending on the payment date
      value: K('returned_upfront_older')
    - when: otherwise
      value: '0'
    baseline:
      upfront_amount: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The return charges are the excess mileage charge, the excess wear charge and the return fee billed on the contract for the return. The fees standing from before the return are fees_due_balance less the return charges, never below zero. The return balance payment is the fees standing from before the return plus the return charges, paid in one payment and rounded to the cent.
    params: []
  inputs:
    history:
    - table: balloon_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: balloon_return_charge
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_payment_returned
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 24
      filters:
        event_type: balloon_late_charge
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 24
      filters:
        event_type: balloon_payment_returned
    cross_category:
    - lease
    - retail
- id: balloon_ext_payoff_quote
  base_policy_refs:
  - balloon_payoff_and_refunds
  overwrite:
  - base_policy: balloon_payoff_and_refunds
    superseded_clause: The good-through date is payoff_quote_valid_days calendar days after the quote date unless the requester asks for an earlier date.
    replaced_by: For a customer payoff quote issued under this rule, and only for such a quote, the good-through date follows the quote good-through schedule below, which never sets it later than payoff_quote_valid_days calendar days after the quote date; every other payoff quote, which is issued outside this rule and its tool, keeps the base good-through date of payoff_quote_valid_days calendar days after the quote date unless the requester asks for an earlier date.
  - base_policy: balloon_payoff_and_refunds
    superseded_clause: The per diem is the principal_balance times apr divided by per_diem_day_basis, rounded to the cent, and the payoff amount is principal_balance plus fees_due_balance plus the per diem times balloon_msr_quote_interest_days.
    replaced_by: For a customer payoff quote issued under this rule, and only for such a quote, the per diem stays principal_balance times apr divided by 100 divided by per_diem_day_basis, rounded to the cent, and the payoff amount stays principal_balance plus fees_due_balance plus quote interest, but interest for days after maturity_date follows the post-maturity rate and the courtesy days set out below; every other payoff quote, which is issued outside this rule and its tool, keeps the base per diem and payoff amount as the base formula computes them, by which the per diem is principal_balance times apr divided by 100 divided by per_diem_day_basis, rounded to the cent, and the payoff amount is principal_balance plus fees_due_balance plus the per diem times balloon_msr_quote_interest_days.
  trigger: on_request
  subject:
  - balloon_payoff_quote
  computes: amount
  target_tool: issue_payoff_quote_72ecc9f3
  params:
    quote_short_window_days: 30
    election_lead_days: 30
    late_window_months: 12
    grace_days_clean: 7
    grace_days_some: 3
    relationship_days_two: 4
    relationship_days_one: 2
    autopay_count_high: 10
    autopay_count_mid: 6
    autopay_days_high: 2
    autopay_days_mid: 1
  rule: 'This rule sets the payoff amount on a customer payoff quote for a Kestrel Advantage balloon contract. The payoff amount is principal_balance plus fees_due_balance plus the per diem times the quote interest days, rounded to the cent. The per diem is principal_balance times apr divided by 100 divided by per_diem_day_basis, rounded to the cent. The good-through date is payoff_quote_valid_days calendar days after the quote date. The quote interest days run from the day after interest_paid_to_date through the good-through date, both inclusive. Of two maturity elections recorded the same day, the one recorded first is taken as the most recent. Calendar days from one date to another count the later date and not the earlier one; whole calendar months from one date to another are complete each time the later date reaches the earlier date''s day of the month, so a later date that falls earlier in its month (month-end included) leaves that month incomplete; a window of N calendar months ending on a date takes in the dates on or before that date that fall fewer than N whole calendar months before it. For a customer payoff quote issued under this rule, and only for such a quote, the good-through date follows the quote good-through schedule below, which never sets it later than payoff_quote_valid_days calendar days after the quote date; every other payoff quote, which is issued outside this rule and its tool, keeps the base good-through date of payoff_quote_valid_days calendar days after the quote date unless the requester asks for an earlier date. For a customer payoff quote issued under this rule, and only for such a quote, the per diem stays principal_balance times apr divided by 100 divided by per_diem_day_basis, rounded to the cent, and the payoff amount stays principal_balance plus fees_due_balance plus quote interest, but interest for days after maturity_date follows the post-maturity rate and the courtesy days set out below; every other payoff quote, which is issued outside this rule and its tool, keeps the base per diem and payoff amount as the base formula computes them, by which the per diem is principal_balance times apr divided by 100 divided by per_diem_day_basis, rounded to the cent, and the payoff amount is principal_balance plus fees_due_balance plus the per diem times balloon_msr_quote_interest_days. Quote good-through schedule: where the quote date falls after maturity_date, the quote is good through the quote date itself; where the quote date falls on or before maturity_date and maturity_date is no more than quote_short_window_days calendar days away, the quote is good through maturity_date; otherwise the quote is good through payoff_quote_valid_days calendar days after the quote date. The quote interest days after maturity_date are those that fall after maturity_date; the other quote interest days fall on or before it. Quote post-maturity rate: where the contract''s most recent maturity election is refinance and was recorded at least election_lead_days calendar days before maturity_date, each quote interest day after maturity_date is charged at a daily rate of principal_balance times refinance_apr for the tier divided by 100 divided by per_diem_day_basis, rounded to the cent; where the most recent maturity election is return_vehicle and was recorded at least election_lead_days calendar days before maturity_date, those days are charged at nothing; otherwise they are charged at the per diem. Quote grace courtesy: where no balloon late charge was assessed in the late_window_months calendar months ending on the quote date, grace_days_clean of the quote interest days after maturity_date are not charged; where one or two were, grace_days_some are not charged; otherwise none are waived for grace. Quote relationship courtesy: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines has relationship_days_two of the quote interest days after maturity_date not charged; one holding such an account in exactly one of those lines has relationship_days_one not charged; any other customer has none waived for relationship. Quote autopay courtesy: where at least autopay_count_high balloon payments posted through autopay_ach in the late_window_months calendar months ending on the quote date, autopay_days_high of the quote interest days after maturity_date is not charged; where at least autopay_count_mid but fewer than autopay_count_high did, autopay_days_mid is not charged; otherwise none is waived for autopay. Every courtesy day that applies is taken off the quote interest days after maturity_date, which never fall below zero; each quote interest day that remains is charged at the daily rate that applies to it, and the payoff amount is rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: retail
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship courtesy counts an active Kestrel new-vehicle retail contract at days_past_due 0.
  - category: preowned
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship courtesy counts an active Kestrel pre-owned retail contract at days_past_due 0.
  - category: lease
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship courtesy counts an active Kestrel lease at days_past_due 0.
  compute:
  - quote_days_to_maturity: DAYS(NOW, F('maturity_date'))
  - good_through_days: 0 if quote_days_to_maturity < 0 else (quote_days_to_maturity if quote_days_to_maturity <= K('quote_short_window_days') else P('payoff_quote_valid_days'))
  - per_diem: RND(F('principal_balance') * F('apr') / 100 / P('per_diem_day_basis'), 2)
  - quote_days: DAYS(F('interest_paid_to_date'), NOW) + good_through_days
  - pre_maturity_days: MN(quote_days, MX(0, DAYS(F('interest_paid_to_date'), F('maturity_date'))))
  - election_option: LATEST('balloon_transactions', 'maturity_option', date_field='txn_date', event_type='balloon_maturity_election')
  - election_lead: DAYS(LATEST('balloon_transactions', 'txn_date', date_field='txn_date', event_type='balloon_maturity_election'), F('maturity_date')) if COUNT('balloon_transactions', event_type='balloon_maturity_election') > 0 else -1
  - post_rate: P('refinance_apr') if (election_option == 'refinance' and election_lead >= K('election_lead_days')) else (0 if (election_option == 'return_vehicle' and election_lead >= K('election_lead_days')) else F('apr'))
  - quote_late_window: COUNT('balloon_transactions', within_months=K('late_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - grace_days: K('grace_days_clean') if quote_late_window == 0 else (K('grace_days_some') if quote_late_window <= 2 else 0)
  - current_lines: (1 if CFIELD('retail', 'days_past_due', status='active', days_past_due=0) == 0 else 0) + (1 if CFIELD('preowned', 'days_past_due', status='active', days_past_due=0) == 0 else 0) + (1 if CFIELD('lease', 'days_past_due', status='active', days_past_due=0) == 0 else 0)
  - relationship_days: K('relationship_days_two') if current_lines >= 2 else (K('relationship_days_one') if current_lines == 1 else 0)
  - quote_autopay_count: COUNT('balloon_transactions', within_months=K('late_window_months'), date_field='txn_date', event_type='balloon_payment', payment_channel='autopay_ach')
  - autopay_days: K('autopay_days_high') if quote_autopay_count >= K('autopay_count_high') else (K('autopay_days_mid') if quote_autopay_count >= K('autopay_count_mid') else 0)
  - post_maturity_days: MX(0, quote_days - pre_maturity_days - grace_days - relationship_days - autopay_days)
  - post_per_diem: RND(F('principal_balance') * post_rate / 100 / P('per_diem_day_basis'), 2)
  - result: RND(F('principal_balance') + F('fees_due_balance') + per_diem * pre_maturity_days + post_per_diem * post_maturity_days, 2)
  compute_basis:
    quote_days_to_maturity: where the quote date falls after maturity_date, the quote is good through the quote date itself; where the quote date falls on or before maturity_date and maturity_date is no more than quote_short_window_days calendar days away, the quote is good through maturity_date
    good_through_days: 'Quote good-through schedule: where the quote date falls after maturity_date, the quote is good through the quote date itself; where the quote date falls on or before maturity_date and maturity_date is no more than quote_short_window_days calendar days away, the quote is good through maturity_date; otherwise the quote is good through payoff_quote_valid_days calendar days after the quote date.'
    per_diem: The per diem is principal_balance times apr divided by 100 divided by per_diem_day_basis, rounded to the cent.
    quote_days: The quote interest days run from the day after interest_paid_to_date through the good-through date, both inclusive.
    pre_maturity_days: The quote interest days after maturity_date are those that fall after maturity_date; the other quote interest days fall on or before it.
    election_option: Of two maturity elections recorded the same day, the one recorded first is taken as the most recent.
    election_lead: where the contract's most recent maturity election is refinance and was recorded at least election_lead_days calendar days before maturity_date
    post_rate: 'Quote post-maturity rate: where the contract''s most recent maturity election is refinance and was recorded at least election_lead_days calendar days before maturity_date, each quote interest day after maturity_date is charged at a daily rate of principal_balance times refinance_apr for the tier divided by 100 divided by per_diem_day_basis, rounded to the cent; where the most recent maturity election is return_vehicle and was recorded at least election_lead_days calendar days before maturity_date, those days are charged at nothing; otherwise they are charged at the per diem.'
    quote_late_window: where no balloon late charge was assessed in the late_window_months calendar months ending on the quote date
    grace_days: 'Quote grace courtesy: where no balloon late charge was assessed in the late_window_months calendar months ending on the quote date, grace_days_clean of the quote interest days after maturity_date are not charged; where one or two were, grace_days_some are not charged; otherwise none are waived for grace.'
    current_lines: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines
    relationship_days: 'Quote relationship courtesy: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines has relationship_days_two of the quote interest days after maturity_date not charged; one holding such an account in exactly one of those lines has relationship_days_one not charged; any other customer has none waived for relationship.'
    quote_autopay_count: where at least autopay_count_high balloon payments posted through autopay_ach in the late_window_months calendar months ending on the quote date
    autopay_days: 'Quote autopay courtesy: where at least autopay_count_high balloon payments posted through autopay_ach in the late_window_months calendar months ending on the quote date, autopay_days_high of the quote interest days after maturity_date is not charged; where at least autopay_count_mid but fewer than autopay_count_high did, autopay_days_mid is not charged; otherwise none is waived for autopay.'
    post_maturity_days: Every courtesy day that applies is taken off the quote interest days after maturity_date, which never fall below zero
    post_per_diem: each quote interest day after maturity_date is charged at a daily rate of principal_balance times refinance_apr for the tier divided by 100 divided by per_diem_day_basis, rounded to the cent
    result: each quote interest day that remains is charged at the daily rate that applies to it, and the payoff amount is rounded to the cent.
  factors:
  - id: qt_good_through
    effect: method
    decides: good_through_days
    bindings:
    - quote_days_to_maturity
    - good_through_days
    ladder:
    - when: the quote date falls after maturity_date
      method: the quote is good through the quote date itself
    - when: the quote date is on or before maturity_date and maturity_date is no more than quote_short_window_days days away
      method: the quote is good through maturity_date
    - when: otherwise
      method: the quote is good through payoff_quote_valid_days days after the quote date
    baseline:
      good_through_days: P('payoff_quote_valid_days')
    evidence:
    - date
    cross_difficulty: null
  - id: qt_post_maturity_rate
    effect: parameter
    decides: post_per_diem
    bindings:
    - election_option
    - election_lead
    - post_rate
    - post_per_diem
    ladder:
    - when: most recent maturity election is refinance AND it was recorded at least election_lead_days days before maturity_date
      value: RND(F('principal_balance') * P('refinance_apr') / 100 / P('per_diem_day_basis'), 2) for each quote interest day after maturity_date
    - when: most recent maturity election is return_vehicle AND it was recorded at least election_lead_days days before maturity_date
      value: 0 for each quote interest day after maturity_date
    - when: otherwise
      value: per_diem (the per diem) for each quote interest day after maturity_date
    baseline:
      post_per_diem: per_diem
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: qt_grace_courtesy
    effect: parameter
    decides: grace_days
    bindings:
    - quote_late_window
    - grace_days
    ladder:
    - when: no balloon late charge in the late_window_months months ending on the quote date
      value: K('grace_days_clean')
    - when: one or two balloon late charges in those months
      value: K('grace_days_some')
    - when: otherwise
      value: '0'
    baseline:
      grace_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: qt_relationship_courtesy
    effect: parameter
    decides: relationship_days
    bindings:
    - current_lines
    - relationship_days
    ladder:
    - when: active Kestrel accounts at days_past_due 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines
      value: K('relationship_days_two')
    - when: such an account in exactly one of those lines
      value: K('relationship_days_one')
    - when: otherwise
      value: '0'
    baseline:
      relationship_days: '0'
    evidence:
    - cross_category
    cross_difficulty: retail
  - id: qt_autopay_courtesy
    effect: parameter
    decides: autopay_days
    bindings:
    - quote_autopay_count
    - autopay_days
    ladder:
    - when: at least autopay_count_high balloon payments through autopay_ach in the late_window_months months ending on the quote date
      value: K('autopay_days_high')
    - when: at least autopay_count_mid but fewer than autopay_count_high such payments
      value: K('autopay_days_mid')
    - when: otherwise
      value: '0'
    baseline:
      autopay_days: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The payoff amount is principal_balance plus fees_due_balance plus the per diem times the quote interest days, rounded to the cent. The per diem is principal_balance times apr divided by 100 divided by per_diem_day_basis, rounded to the cent. The good-through date is payoff_quote_valid_days calendar days after the quote date. The quote interest days run from the day after interest_paid_to_date through the good-through date, both inclusive.
    params:
    - payoff_quote_valid_days
    - per_diem_day_basis
  inputs:
    history:
    - table: balloon_transactions
      aggregate: latest
      field: maturity_option
      filters:
        event_type: balloon_maturity_election
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_late_charge
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_payment
        payment_channel: autopay_ach
    cross_category:
    - retail
    - preowned
    - lease
- id: balloon_ext_refinance_precondition_payment
  base_policy_refs:
  - balloon_payment_posting
  - balloon_reinstatement_and_redemption
  - balloon_refinancing
  overwrite:
  - base_policy: balloon_payment_posting
    superseded_clause: 'Each payment is applied in payment_allocation_order: first to simple interest accrued over balloon_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until balloon_msr_installments_due is satisfied, then to fees due, and any remainder to principal.'
    replaced_by: A payment the customer makes before a balloon refinance under this rule, and only such a payment, is held on the contract rather than applied in payment_allocation_order and is applied when the refinance is booked, accrued interest first, then fees due, then principal; every other payment, which is posted outside this rule and its tool, keeps the base order, first to simple interest accrued over balloon_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until balloon_msr_installments_due is satisfied, then to fees due, and any remainder to principal.
  trigger: on_request
  subject:
  - balloon_payment
  computes: amount
  target_tool: pay_refinance_precondition_amount_08a17076
  params:
    cp_history_window_months: 12
    cp_long_window_months: 24
    down_pct_watch: 7.5
    down_pct_subprime: 10.0
    age_long_months: 48
    age_mid_months: 36
    age_slope_start_months: 22
    age_slope_points: 0.1
    age_flat_points: 2.5
    returned_points_recent: 2.0
    returned_points_older: 1.0
    relationship_credit_two: 250.0
    relationship_credit_one: 150.0
    cp_autopay_count_high: 10
    cp_autopay_count_mid: 6
    autopay_credit_high: 100.0
    autopay_credit_mid: 50.0
  rule: 'This rule sets the payment a customer makes before a Kestrel Advantage balloon refinance is booked. The pre-refinance payment is not fixed until a payoff quote dated on the payment date stands on the contract. The other amounts due before a refinance are the payoff amount on the payoff quote dated on the payment date less balloon_amount, never below zero. Where more than one payoff quote is dated the payment date, the one issued first that day is used. Calendar days from one date to another count the later date and not the earlier one; whole calendar months from one date to another are complete each time the later date reaches the earlier date''s day of the month, so a later date that falls earlier in its month (month-end included) leaves that month incomplete; a window of N calendar months ending on a date takes in the dates on or before that date that fall fewer than N whole calendar months before it. The refinance down payment is the refinance down-payment percentage of balloon_amount, rounded to the cent, and the standard refinance down-payment percentage is zero. The pre-refinance payment is the other amounts due before a refinance plus the refinance down payment, rounded to the cent. A payment the customer makes before a balloon refinance under this rule, and only such a payment, is held on the contract rather than applied in payment_allocation_order and is applied when the refinance is booked, accrued interest first, then fees due, then principal; every other payment, which is posted outside this rule and its tool, keeps the base order, first to simple interest accrued over balloon_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until balloon_msr_installments_due is satisfied, then to fees due, and any remainder to principal. Refinance down-payment standing: a contract in Kestrel Advantage Balloon Tier 4 or Tier 5 carries down_pct_subprime percentage points; a contract in Kestrel Advantage Balloon Tier 2 or Tier 3 with at least one balloon late charge assessed in the cp_history_window_months calendar months ending on the payment date carries down_pct_watch percentage points; any other contract, that is a Tier 1 or Tier 1+ contract or a Tier 2 or Tier 3 contract with no late charge in those months, carries none for standing. Refinance down-payment vehicle age: where the whole calendar months from contract_date to the payment date number at least age_long_months, the contract carries age_slope_points percentage points for every month beyond age_slope_start_months; where they number at least age_mid_months but fewer than age_long_months, it carries a flat age_flat_points percentage points; otherwise it carries none for age. Refinance down-payment returned payments: where a balloon returned payment posted in the cp_history_window_months calendar months ending on the payment date, the contract carries returned_points_recent percentage points; where none posted in those months but one or more posted in the cp_long_window_months calendar months ending on the payment date, it carries returned_points_older; otherwise it carries none for returned payments. Refinance down-payment relationship credit: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines has relationship_credit_two taken off the refinance down payment; one holding such an account in exactly one of those lines has relationship_credit_one taken off; any other customer has no relationship credit. Refinance down-payment autopay credit: where at least cp_autopay_count_high balloon payments posted through autopay_ach in the cp_history_window_months calendar months ending on the payment date, autopay_credit_high is taken off the refinance down payment; where at least cp_autopay_count_mid but fewer than cp_autopay_count_high did, autopay_credit_mid is taken off; otherwise there is no autopay credit. Every percentage-point amount that applies is added into the refinance down-payment percentage, the refinance down payment is figured on balloon_amount and rounded to the cent, every credit that applies is then taken off, and the refinance down payment never falls below zero.'
  prerequisite:
  - problem: balloon_ext_payoff_quote
    kind: value_input
    gate: cp_quote_amount
    form: state
    policy_source: The pre-refinance payment is not fixed until a payoff quote dated on the payment date stands on the contract.
    condition: The contract carries a balloon_payoff_quote entry whose txn_date is the payment date.
    resolved_by: issue_payoff_quote_72ecc9f3
    effect: cp_quote_amount moves from nothing to the payoff amount quoted that day, which sets the other amounts due before a refinance.
  cross_category:
  - category: retail
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship credit counts an active Kestrel new-vehicle retail contract at days_past_due 0.
  - category: preowned
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship credit counts an active Kestrel pre-owned retail contract at days_past_due 0.
  - category: lease
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship credit counts an active Kestrel lease at days_past_due 0.
  compute:
  - cp_quote_amount: LATEST('balloon_transactions', 'amount', date_field='txn_date', event_type='balloon_payoff_quote', txn_date=NOW)
  - other_due: MX(0, cp_quote_amount - F('balloon_amount'))
  - cp_late_window: COUNT('balloon_transactions', within_months=K('cp_history_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - down_pct: K('down_pct_subprime') if (F('variant_name') == 'Kestrel Advantage Balloon Tier 4' or F('variant_name') == 'Kestrel Advantage Balloon Tier 5') else (K('down_pct_watch') if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 2' or F('variant_name') == 'Kestrel Advantage Balloon Tier 3') and cp_late_window >= 1) else 0)
  - months_in_service: MONTHS(F('contract_date'), NOW)
  - age_points: K('age_slope_points') * (months_in_service - K('age_slope_start_months')) if months_in_service >= K('age_long_months') else (K('age_flat_points') if months_in_service >= K('age_mid_months') else 0)
  - cp_returned_window: COUNT('balloon_transactions', within_months=K('cp_history_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - cp_returned_long: COUNT('balloon_transactions', within_months=K('cp_long_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - returned_points: K('returned_points_recent') if cp_returned_window >= 1 else (K('returned_points_older') if cp_returned_long >= 1 else 0)
  - cp_current_lines: (1 if CFIELD('retail', 'days_past_due', status='active', days_past_due=0) == 0 else 0) + (1 if CFIELD('preowned', 'days_past_due', status='active', days_past_due=0) == 0 else 0) + (1 if CFIELD('lease', 'days_past_due', status='active', days_past_due=0) == 0 else 0)
  - relationship_credit: K('relationship_credit_two') if cp_current_lines >= 2 else (K('relationship_credit_one') if cp_current_lines == 1 else 0)
  - cp_autopay_count: COUNT('balloon_transactions', within_months=K('cp_history_window_months'), date_field='txn_date', event_type='balloon_payment', payment_channel='autopay_ach')
  - autopay_credit: K('autopay_credit_high') if cp_autopay_count >= K('cp_autopay_count_high') else (K('autopay_credit_mid') if cp_autopay_count >= K('cp_autopay_count_mid') else 0)
  - down_payment: MX(0, RND(F('balloon_amount') * (down_pct + age_points + returned_points) / 100, 2) - relationship_credit - autopay_credit)
  - result: RND(other_due + down_payment, 2)
  compute_basis:
    cp_quote_amount: Where more than one payoff quote is dated the payment date, the one issued first that day is used.
    other_due: The other amounts due before a refinance are the payoff amount on the payoff quote dated on the payment date less balloon_amount, never below zero.
    cp_late_window: with at least one balloon late charge assessed in the cp_history_window_months calendar months ending on the payment date
    down_pct: 'Refinance down-payment standing: a contract in Kestrel Advantage Balloon Tier 4 or Tier 5 carries down_pct_subprime percentage points; a contract in Kestrel Advantage Balloon Tier 2 or Tier 3 with at least one balloon late charge assessed in the cp_history_window_months calendar months ending on the payment date carries down_pct_watch percentage points; any other contract, that is a Tier 1 or Tier 1+ contract or a Tier 2 or Tier 3 contract with no late charge in those months, carries none for standing.'
    months_in_service: where the whole calendar months from contract_date to the payment date number at least age_long_months
    age_points: 'Refinance down-payment vehicle age: where the whole calendar months from contract_date to the payment date number at least age_long_months, the contract carries age_slope_points percentage points for every month beyond age_slope_start_months; where they number at least age_mid_months but fewer than age_long_months, it carries a flat age_flat_points percentage points; otherwise it carries none for age.'
    cp_returned_window: where a balloon returned payment posted in the cp_history_window_months calendar months ending on the payment date
    cp_returned_long: but one or more posted in the cp_long_window_months calendar months ending on the payment date
    returned_points: 'Refinance down-payment returned payments: where a balloon returned payment posted in the cp_history_window_months calendar months ending on the payment date, the contract carries returned_points_recent percentage points; where none posted in those months but one or more posted in the cp_long_window_months calendar months ending on the payment date, it carries returned_points_older; otherwise it carries none for returned payments.'
    cp_current_lines: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines
    relationship_credit: 'Refinance down-payment relationship credit: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines has relationship_credit_two taken off the refinance down payment; one holding such an account in exactly one of those lines has relationship_credit_one taken off; any other customer has no relationship credit.'
    cp_autopay_count: where at least cp_autopay_count_high balloon payments posted through autopay_ach in the cp_history_window_months calendar months ending on the payment date
    autopay_credit: 'Refinance down-payment autopay credit: where at least cp_autopay_count_high balloon payments posted through autopay_ach in the cp_history_window_months calendar months ending on the payment date, autopay_credit_high is taken off the refinance down payment; where at least cp_autopay_count_mid but fewer than cp_autopay_count_high did, autopay_credit_mid is taken off; otherwise there is no autopay credit.'
    down_payment: Every percentage-point amount that applies is added into the refinance down-payment percentage, the refinance down payment is figured on balloon_amount and rounded to the cent, every credit that applies is then taken off, and the refinance down payment never falls below zero.
    result: The pre-refinance payment is the other amounts due before a refinance plus the refinance down payment, rounded to the cent.
  factors:
  - id: cp_down_standing
    effect: parameter
    decides: down_pct
    bindings:
    - cp_late_window
    - down_pct
    ladder:
    - when: Tier 4 or Tier 5
      value: K('down_pct_subprime')
    - when: Tier 2 or Tier 3 AND at least one balloon late charge in the cp_history_window_months months ending on the payment date
      value: K('down_pct_watch')
    - when: otherwise (Tier 1 or Tier 1+, or Tier 2 or Tier 3 with no late charge in those months)
      value: '0'
    baseline:
      down_pct: '0'
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  - id: cp_vehicle_age
    effect: method
    decides: age_points
    bindings:
    - months_in_service
    - age_points
    ladder:
    - when: at least age_long_months whole months from contract_date to the payment date
      method: age_slope_points percentage points for every month beyond age_slope_start_months (a sliding add-on)
    - when: at least age_mid_months but fewer than age_long_months such months
      method: a flat age_flat_points percentage points
    - when: otherwise
      method: no age add-on
    baseline:
      age_points: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: cp_returned_payments
    effect: parameter
    decides: returned_points
    bindings:
    - cp_returned_window
    - cp_returned_long
    - returned_points
    ladder:
    - when: a balloon returned payment in the cp_history_window_months months ending on the payment date
      value: K('returned_points_recent')
    - when: none in those months but one or more in the cp_long_window_months months ending on the payment date
      value: K('returned_points_older')
    - when: otherwise
      value: '0'
    baseline:
      returned_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: cp_relationship_credit
    effect: parameter
    decides: relationship_credit
    bindings:
    - cp_current_lines
    - relationship_credit
    ladder:
    - when: active Kestrel accounts at days_past_due 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines
      value: K('relationship_credit_two')
    - when: such an account in exactly one of those lines
      value: K('relationship_credit_one')
    - when: otherwise
      value: '0'
    baseline:
      relationship_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: retail
  - id: cp_autopay_credit
    effect: parameter
    decides: autopay_credit
    bindings:
    - cp_autopay_count
    - autopay_credit
    ladder:
    - when: at least cp_autopay_count_high balloon payments through autopay_ach in the cp_history_window_months months ending on the payment date
      value: K('autopay_credit_high')
    - when: at least cp_autopay_count_mid but fewer than cp_autopay_count_high such payments
      value: K('autopay_credit_mid')
    - when: otherwise
      value: '0'
    baseline:
      autopay_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The other amounts due before a refinance are the payoff amount on the payoff quote dated on the payment date less balloon_amount, never below zero. The refinance down payment is the refinance down-payment percentage of balloon_amount, rounded to the cent, and the standard refinance down-payment percentage is zero. The pre-refinance payment is the other amounts due before a refinance plus the refinance down payment, rounded to the cent.
    params: []
  inputs:
    history:
    - table: balloon_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: balloon_payoff_quote
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_late_charge
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 24
      filters:
        event_type: balloon_payment_returned
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_payment
        payment_channel: autopay_ach
    cross_category:
    - retail
    - preowned
    - lease
- id: balloon_ext_balloon_refinance
  base_policy_refs:
  - balloon_refinancing
  overwrite:
  - base_policy: balloon_refinancing
    superseded_clause: The amount refinanced is the balloon_amount; any other amount due must be paid separately before the refinance.
    replaced_by: For a balloon refinance booked under this rule, and only for such a refinance, the amount refinanced is the payoff amount on the payoff quote dated on the refinance date less every balloon payment posted on the refinance date, and every other amount due is still paid separately before the refinance.
  - base_policy: balloon_refinancing
    superseded_clause: The refinance term may not exceed refinance_max_term_months for the tier, and the refinance APR is refinance_apr for the tier less relationship_refinance_rate_reduction_pct when the customer also holds another Kestrel retail or pre-owned contract in active status, or a Kestrel lease in active status, showing days_past_due of 0.
    replaced_by: For a balloon refinance booked under this rule, and only for such a refinance, the refinance term follows the refinance term schedule below and never exceeds refinance_max_term_months for the tier, and the refinance APR is refinance_apr for the tier adjusted by the rate schedule below, which keeps relationship_refinance_rate_reduction_pct for a customer with exactly one such current account.
  - base_policy: balloon_refinancing
    superseded_clause: The contract must show days_past_due of 0 apart from the balloon installment itself, and balloon_msr_late_charges_12m must not exceed refinance_max_late_charges_12m for the tier.
    replaced_by: For a balloon refinance booked under this rule, and only for such a refinance, the days-past-due condition is met when a payment held on the contract with nothing yet applied covers every amount due other than the balloon installment, because a held payment is applied when the refinance is booked; balloon_msr_late_charges_12m must still not exceed refinance_max_late_charges_12m for the tier.
  trigger: on_request
  subject:
  - balloon_refinance
  - balloon_terms_modified
  computes: refinance_monthly_payment
  target_tool: complete_balloon_refinance_14b47e8c
  params:
    rate_reduction_two_lines: 0.5
    ri_history_window_months: 12
    late_addon_two: 0.5
    late_addon_one: 0.25
    ri_autopay_count_high: 10
    ri_autopay_count_mid: 6
    autopay_discount_high: 0.25
    autopay_discount_mid: 0.1
    term_long_months: 48
    term_mid_months: 36
    term_age_cut_months: 12
    term_floor_months: 6
    timing_long_days: 15
    timing_surcharge_long: 0.5
    timing_surcharge_short: 0.25
    completed_reduction_two: 0.25
    completed_reduction_one: 0.15
  rule: 'This rule sets the refinance installment when the balloon of a Kestrel Advantage balloon contract is refinanced. The refinance installment is fixed only after a payoff quote dated on the refinance date stands on the contract. The refinance installment is not fixed until a payment dated on the refinance date stands held on the contract with nothing yet applied to it. The amount refinanced is the payoff amount on the payoff quote dated on the refinance date less every balloon payment posted on the refinance date, rounded to the cent. Where more than one payoff quote is dated the refinance date, the one issued first that day is used. Calendar days from one date to another count the later date and not the earlier one; whole calendar months from one date to another are complete each time the later date reaches the earlier date''s day of the month, so a later date that falls earlier in its month (month-end included) leaves that month incomplete; a window of N calendar months ending on a date takes in the dates on or before that date that fall fewer than N whole calendar months before it. The refinance APR is refinance_apr for the tier. The refinance term is refinance_max_term_months for the tier. The refinance installment is the level monthly payment that amortizes the amount refinanced over the refinance term at the refinance APR, rounded to the cent. For a balloon refinance booked under this rule, and only for such a refinance, the amount refinanced is the payoff amount on the payoff quote dated on the refinance date less every balloon payment posted on the refinance date, and every other amount due is still paid separately before the refinance. For a balloon refinance booked under this rule, and only for such a refinance, the refinance term follows the refinance term schedule below and never exceeds refinance_max_term_months for the tier, and the refinance APR is refinance_apr for the tier adjusted by the rate schedule below, which keeps relationship_refinance_rate_reduction_pct for a customer with exactly one such current account. For a balloon refinance booked under this rule, and only for such a refinance, the days-past-due condition is met when a payment held on the contract with nothing yet applied covers every amount due other than the balloon installment, because a held payment is applied when the refinance is booked; balloon_msr_late_charges_12m must still not exceed refinance_max_late_charges_12m for the tier. Refinance rate relationship reduction: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines has the refinance APR reduced by rate_reduction_two_lines; one holding such an account in exactly one of those lines has it reduced by relationship_refinance_rate_reduction_pct; any other customer has no relationship reduction. Refinance rate late-charge add-on: where two or more balloon late charges were assessed, or a balloon returned payment posted, in the ri_history_window_months calendar months ending on the refinance date, the refinance APR is raised by late_addon_two; where exactly one late charge was assessed and no returned payment posted in those months, it is raised by late_addon_one; otherwise there is no late-charge add-on. Refinance rate autopay discount: where at least ri_autopay_count_high balloon payments posted through autopay_ach in the ri_history_window_months calendar months ending on the refinance date, the refinance APR is reduced by autopay_discount_high; where at least ri_autopay_count_mid but fewer than ri_autopay_count_high did, it is reduced by autopay_discount_mid; otherwise there is no autopay discount. Refinance rate timing surcharge: where the refinance date is more than timing_long_days calendar days after maturity_date, the refinance APR is raised by timing_surcharge_long; where it is one to timing_long_days calendar days after maturity_date, it is raised by timing_surcharge_short; where it is on or before maturity_date, there is no timing surcharge. Refinance rate completed-loan reduction: a customer with Kestrel accounts at paid_in_full or closed in both the new-vehicle retail and the pre-owned retail lines has the refinance APR reduced by completed_reduction_two; one with such an account in exactly one of those lines has it reduced by completed_reduction_one; any other customer has no completed-loan reduction. Refinance term schedule: where the whole calendar months from contract_date to the refinance date number at least term_long_months, the refinance term is refinance_max_term_months less term_age_cut_months and less one further month for each whole month in service at or beyond term_long_months, term_long_months itself counting as one, but never below term_floor_months; where they number at least term_mid_months but fewer than term_long_months, the refinance term is refinance_max_term_months less term_age_cut_months; otherwise the refinance term is refinance_max_term_months. Every rate adjustment that applies is added to or taken off refinance_apr for the tier together, the refinance APR is kept to two decimal places, and the refinance installment is then figured on the amount refinanced over the refinance term and rounded to the cent.'
  prerequisite:
  - problem: balloon_ext_payoff_quote
    kind: state_gate
    gate: balloon_transactions.event_type
    form: state
    policy_source: The refinance installment is fixed only after a payoff quote dated on the refinance date stands on the contract.
    condition: The contract carries a balloon_payoff_quote entry whose txn_date is the refinance date.
    resolved_by: issue_payoff_quote_72ecc9f3
    effect: A payoff quote dated the refinance date stands on the contract, so the amount refinanced has its starting payoff; because the held payment is figured from the same quote, the quoted figure itself cancels out of the amount refinanced, so the quote enables the refinance installment without moving its value.
  - problem: balloon_ext_refinance_precondition_payment
    kind: value_input
    gate: paid_on_refinance_date
    form: state
    policy_source: The refinance installment is not fixed until a payment dated on the refinance date stands held on the contract with nothing yet applied to it.
    condition: The contract carries a balloon_payment entry dated the refinance date whose interest_applied, principal_applied and fees_applied are all 0.00 (held on the contract).
    resolved_by: pay_refinance_precondition_amount_08a17076
    effect: paid_on_refinance_date moves from 0.00 to the pre-refinance payment, which lowers the amount refinanced by that payment and so lowers the refinance installment.
  cross_category:
  - category: retail
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship reduction counts an active Kestrel new-vehicle retail contract at days_past_due 0, and the completed-loan reduction a retail contract at paid_in_full or closed.
  - category: preowned
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship reduction counts an active pre-owned retail contract at days_past_due 0, and the completed-loan reduction a pre-owned contract at paid_in_full or closed.
  - category: lease
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship reduction counts an active Kestrel lease at days_past_due 0.
  compute:
  - ri_quote_amount: LATEST('balloon_transactions', 'amount', date_field='txn_date', event_type='balloon_payoff_quote', txn_date=NOW)
  - paid_on_refinance_date: SUM('balloon_transactions', 'amount', event_type='balloon_payment', txn_date=NOW)
  - amount_refinanced: RND(ri_quote_amount - paid_on_refinance_date, 2)
  - ri_current_lines: (1 if CFIELD('retail', 'days_past_due', status='active', days_past_due=0) == 0 else 0) + (1 if CFIELD('preowned', 'days_past_due', status='active', days_past_due=0) == 0 else 0) + (1 if CFIELD('lease', 'days_past_due', status='active', days_past_due=0) == 0 else 0)
  - relationship_reduction: K('rate_reduction_two_lines') if ri_current_lines >= 2 else (P('relationship_refinance_rate_reduction_pct') if ri_current_lines == 1 else 0)
  - ri_late_window: COUNT('balloon_transactions', within_months=K('ri_history_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - ri_returned_window: COUNT('balloon_transactions', within_months=K('ri_history_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - late_addon: K('late_addon_two') if (ri_late_window >= 2 or ri_returned_window >= 1) else (K('late_addon_one') if (ri_late_window == 1 and ri_returned_window == 0) else 0)
  - ri_autopay_count: COUNT('balloon_transactions', within_months=K('ri_history_window_months'), date_field='txn_date', event_type='balloon_payment', payment_channel='autopay_ach')
  - autopay_discount: K('autopay_discount_high') if ri_autopay_count >= K('ri_autopay_count_high') else (K('autopay_discount_mid') if ri_autopay_count >= K('ri_autopay_count_mid') else 0)
  - days_after_maturity: DAYS(F('maturity_date'), NOW)
  - timing_surcharge: K('timing_surcharge_long') if days_after_maturity > K('timing_long_days') else (K('timing_surcharge_short') if days_after_maturity >= 1 else 0)
  - completed_lines: (1 if (EXISTS('retail', status='paid_in_full') or EXISTS('retail', status='closed')) else 0) + (1 if (EXISTS('preowned', status='paid_in_full') or EXISTS('preowned', status='closed')) else 0)
  - completed_reduction: K('completed_reduction_two') if completed_lines >= 2 else (K('completed_reduction_one') if completed_lines == 1 else 0)
  - ri_months_in_service: MONTHS(F('contract_date'), NOW)
  - refinance_term: MX(K('term_floor_months'), P('refinance_max_term_months') - K('term_age_cut_months') - (ri_months_in_service - K('term_long_months') + 1)) if ri_months_in_service >= K('term_long_months') else ((P('refinance_max_term_months') - K('term_age_cut_months')) if ri_months_in_service >= K('term_mid_months') else P('refinance_max_term_months'))
  - refinance_apr_value: RND(P('refinance_apr') - relationship_reduction + late_addon - autopay_discount + timing_surcharge - completed_reduction, 2)
  - monthly_rate: refinance_apr_value / 1200
  - result: RND(amount_refinanced * monthly_rate / (1 - (1 + monthly_rate) ** (0 - refinance_term)), 2)
  compute_basis:
    ri_quote_amount: Where more than one payoff quote is dated the refinance date, the one issued first that day is used.
    paid_on_refinance_date: The amount refinanced is the payoff amount on the payoff quote dated on the refinance date less every balloon payment posted on the refinance date, rounded to the cent.
    amount_refinanced: The amount refinanced is the payoff amount on the payoff quote dated on the refinance date less every balloon payment posted on the refinance date, rounded to the cent.
    ri_current_lines: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines has the refinance APR reduced by rate_reduction_two_lines
    relationship_reduction: 'Refinance rate relationship reduction: a customer holding active Kestrel accounts showing days_past_due of 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines has the refinance APR reduced by rate_reduction_two_lines; one holding such an account in exactly one of those lines has it reduced by relationship_refinance_rate_reduction_pct; any other customer has no relationship reduction.'
    ri_late_window: where two or more balloon late charges were assessed, or a balloon returned payment posted, in the ri_history_window_months calendar months ending on the refinance date
    ri_returned_window: where two or more balloon late charges were assessed, or a balloon returned payment posted, in the ri_history_window_months calendar months ending on the refinance date
    late_addon: 'Refinance rate late-charge add-on: where two or more balloon late charges were assessed, or a balloon returned payment posted, in the ri_history_window_months calendar months ending on the refinance date, the refinance APR is raised by late_addon_two; where exactly one late charge was assessed and no returned payment posted in those months, it is raised by late_addon_one; otherwise there is no late-charge add-on.'
    ri_autopay_count: where at least ri_autopay_count_high balloon payments posted through autopay_ach in the ri_history_window_months calendar months ending on the refinance date
    autopay_discount: 'Refinance rate autopay discount: where at least ri_autopay_count_high balloon payments posted through autopay_ach in the ri_history_window_months calendar months ending on the refinance date, the refinance APR is reduced by autopay_discount_high; where at least ri_autopay_count_mid but fewer than ri_autopay_count_high did, it is reduced by autopay_discount_mid; otherwise there is no autopay discount.'
    days_after_maturity: where the refinance date is more than timing_long_days calendar days after maturity_date
    timing_surcharge: 'Refinance rate timing surcharge: where the refinance date is more than timing_long_days calendar days after maturity_date, the refinance APR is raised by timing_surcharge_long; where it is one to timing_long_days calendar days after maturity_date, it is raised by timing_surcharge_short; where it is on or before maturity_date, there is no timing surcharge.'
    completed_lines: a customer with Kestrel accounts at paid_in_full or closed in both the new-vehicle retail and the pre-owned retail lines
    completed_reduction: 'Refinance rate completed-loan reduction: a customer with Kestrel accounts at paid_in_full or closed in both the new-vehicle retail and the pre-owned retail lines has the refinance APR reduced by completed_reduction_two; one with such an account in exactly one of those lines has it reduced by completed_reduction_one; any other customer has no completed-loan reduction.'
    ri_months_in_service: where the whole calendar months from contract_date to the refinance date number at least term_long_months
    refinance_term: 'Refinance term schedule: where the whole calendar months from contract_date to the refinance date number at least term_long_months, the refinance term is refinance_max_term_months less term_age_cut_months and less one further month for each whole month in service at or beyond term_long_months, term_long_months itself counting as one, but never below term_floor_months; where they number at least term_mid_months but fewer than term_long_months, the refinance term is refinance_max_term_months less term_age_cut_months; otherwise the refinance term is refinance_max_term_months.'
    refinance_apr_value: Every rate adjustment that applies is added to or taken off refinance_apr for the tier together, the refinance APR is kept to two decimal places
    monthly_rate: The refinance installment is the level monthly payment that amortizes the amount refinanced over the refinance term at the refinance APR, rounded to the cent.
    result: the refinance installment is then figured on the amount refinanced over the refinance term and rounded to the cent.
  factors:
  - id: ri_relationship_rate
    effect: parameter
    decides: relationship_reduction
    bindings:
    - ri_current_lines
    - relationship_reduction
    ladder:
    - when: active Kestrel accounts at days_past_due 0 in two or more of the new-vehicle retail, pre-owned retail and lease lines
      value: K('rate_reduction_two_lines')
    - when: such an account in exactly one of those lines
      value: P('relationship_refinance_rate_reduction_pct')
    - when: otherwise
      value: '0'
    baseline:
      relationship_reduction: '0'
    evidence:
    - cross_category
    cross_difficulty: retail
  - id: ri_late_charge_addon
    effect: parameter
    decides: late_addon
    bindings:
    - ri_late_window
    - ri_returned_window
    - late_addon
    ladder:
    - when: two or more balloon late charges OR a balloon returned payment in the ri_history_window_months months ending on the refinance date
      value: K('late_addon_two')
    - when: exactly one late charge AND no returned payment in those months
      value: K('late_addon_one')
    - when: otherwise
      value: '0'
    baseline:
      late_addon: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: ri_autopay_discount
    effect: parameter
    decides: autopay_discount
    bindings:
    - ri_autopay_count
    - autopay_discount
    ladder:
    - when: at least ri_autopay_count_high balloon payments through autopay_ach in the ri_history_window_months months ending on the refinance date
      value: K('autopay_discount_high')
    - when: at least ri_autopay_count_mid but fewer than ri_autopay_count_high such payments
      value: K('autopay_discount_mid')
    - when: otherwise
      value: '0'
    baseline:
      autopay_discount: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: ri_timing_surcharge
    effect: parameter
    decides: timing_surcharge
    bindings:
    - days_after_maturity
    - timing_surcharge
    ladder:
    - when: the refinance date is more than timing_long_days days after maturity_date
      value: K('timing_surcharge_long')
    - when: it is one to timing_long_days days after maturity_date
      value: K('timing_surcharge_short')
    - when: otherwise (on or before maturity_date)
      value: '0'
    baseline:
      timing_surcharge: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: ri_completed_loans
    effect: parameter
    decides: completed_reduction
    bindings:
    - completed_lines
    - completed_reduction
    ladder:
    - when: Kestrel accounts at paid_in_full or closed in both the new-vehicle retail and the pre-owned retail lines
      value: K('completed_reduction_two')
    - when: such an account in exactly one of those lines
      value: K('completed_reduction_one')
    - when: otherwise
      value: '0'
    baseline:
      completed_reduction: '0'
    evidence:
    - cross_category
    cross_difficulty: preowned
  - id: ri_term_schedule
    effect: method
    decides: refinance_term
    bindings:
    - ri_months_in_service
    - refinance_term
    ladder:
    - when: at least term_long_months whole months from contract_date to the refinance date
      method: 'a sliding term: refinance_max_term_months less term_age_cut_months and one further month for each whole month in service at or beyond term_long_months (term_long_months itself counting as one), never below term_floor_months'
    - when: at least term_mid_months but fewer than term_long_months such months
      method: 'a fixed cut: refinance_max_term_months less term_age_cut_months'
    - when: otherwise
      method: the tier maximum refinance_max_term_months
    baseline:
      refinance_term: P('refinance_max_term_months')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The amount refinanced is the payoff amount on the payoff quote dated on the refinance date less every balloon payment posted on the refinance date, rounded to the cent. The refinance APR is refinance_apr for the tier. The refinance term is refinance_max_term_months for the tier. The refinance installment is the level monthly payment that amortizes the amount refinanced over the refinance term at the refinance APR, rounded to the cent.
    params:
    - refinance_apr
    - refinance_max_term_months
  inputs:
    history:
    - table: balloon_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: balloon_payoff_quote
    - table: balloon_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: balloon_payment
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_late_charge
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_payment
        payment_channel: autopay_ach
    cross_category:
    - retail
    - preowned
    - lease
