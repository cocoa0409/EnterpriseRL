- id: balloon_due_date_changes
  subject:
  - balloon_due_date_change
  - balloon_schedule_updated
  rule: 'A due-date change can be made only while the contract status is active. The contract must show days_past_due
    of 0, payments_made_count of at least due_date_change_min_payments_made and due_date_changes_used below due_date_change_lifetime_max
    for the tier. A due-date change may take effect no earlier than due_date_change_interval_months after the last
    due-date change took effect. The interval is counted in calendar months from last_due_date_change_date to the
    same day number of the later month, falling back to that month''s last day when the day does not exist; a contract
    that has never changed its due date has no interval to wait. The new due day must lie between due_day_earliest
    and due_day_latest of the month, and the first installment on the new due day may fall no more than due_date_change_max_shift_days
    calendar days after the current next_due_date and never before it. Exception: a change whose new due day equals
    the due_day of another open Kestrel retail, pre-owned or balloon contract, or of an active Kestrel lease, of
    the same customer is a relationship alignment and does not have to wait for the interval; it still counts toward
    the lifetime maximum. No fee is charged; simple interest continues to accrue daily, so a longer gap to the first
    installment on the new due day increases the interest portion of that installment. The change updates due_day,
    next_due_date, due_date_changes_used and last_due_date_change_date on the contract; maturity_date moves to the
    new due day in the final month.'
