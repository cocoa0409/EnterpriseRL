    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - paid_in_full
  - id: funds_hold
    applies_to:
    - balloon_lien_release
    kind: time
    condition: When the funds that brought the balance to zero were a personal check or an ACH debit, the lien may
      be released no earlier than lien_release_hold_business_days business days after the balance reached zero.
    evidence_fields:
    - balloon_contracts.paid_in_full_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the balance reached zero
      anchor_source: balloon_contracts.paid_in_full_date
      relation: not_before
      duration_source: variants.lien_release_hold_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding US federal holidays, counted from the first
        business day after paid_in_full_date, and release on the last day of the hold is permitted.
      boundary: inclusive
  - id: alt_address_signed
    applies_to:
    - balloon_lien_release
    kind: authorization
    condition: A paper title may be mailed to an address other than the address on file only after the customer
      has completed a signed alternate-address title release request.
    evidence_fields:
    - balloon_requests.request_status
    - balloon_requests.request_type
    - balloon_requests.alternate_address
    - balloon_requests.balloon_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
