- id: balloon_vehicle_return
  subject:
  - balloon_vehicle_returned
  - balloon_return_inspection
  - balloon_return_charge
  - balloon_return_credit
  - balloon_return_settled
  - balloon_return_charged_off
  rule: Returning the vehicle is the customer's own act at a Kestrel dealer, who records the odometer and signs
    the vehicle in. The vehicle may be returned only when return_option_available is true, days_past_due is 0 apart
    from the balloon installment itself, and the return date is no earlier than return_window_days_before_maturity
    calendar days before maturity_date. The vehicle must be returned no later than return_grace_days_after_maturity
    after the balloon payment fell due. The period is counted in calendar days starting the day after maturity_date,
    and a return on the last day is timely. On return the balloon balance is satisfied by the vehicle, so the remaining
    principal_balance is credited out; every regular installment must already be paid. The return inspection records
    the odometer and the excess wear assessed under the Kestrel wear standard. excess_miles is the inspection odometer
    less odometer_at_contract less annual_mileage_allowance times term_months divided by 12, never below zero, and
    is charged at return_excess_mileage_rate per mile. The excess wear charge is wear_assessed_amount less return_wear_waiver_cap
    for the tier, never below zero. The return fee is return_option_fee for the tier, waived when the customer signs
    a new Kestrel retail contract or lease within return_fee_loyalty_days calendar days before or after the return
    date. Return charges can be billed only while the contract status is returned. Return charges may be billed
    only after return_inspection_dispute_days have fully elapsed from the date the vehicle was returned. The dispute
    period is counted in calendar days starting the day after return_date, so billing is permitted from the calendar
    day after return_date plus return_inspection_dispute_days. A dispute filed within the dispute period is resolved
    before billing; charges are due return_charges_due_days calendar days after billing, the account closes when
    they are paid, and charges still unpaid return_charge_off_days after the return are charged off.
  eligibility:
  - id: return_allowed
    applies_to:
    - balloon_vehicle_returned
    kind: authorization
    condition: The vehicle may be returned only when return_option_available is true, days_past_due is 0 apart from
      the balloon installment itself, and the return date is no earlier than return_window_days_before_maturity
      calendar days before maturity_date.
    evidence_fields:
    - balloon_contracts.return_option_available
    - balloon_contracts.days_past_due
    - balloon_contracts.maturity_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
  - id: return_deadline
    applies_to:
    - balloon_vehicle_returned
    kind: time
    condition: The vehicle must be returned no later than return_grace_days_after_maturity after the balloon payment
      fell due.
    evidence_fields:
    - balloon_contracts.maturity_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the balloon payment fell due
      anchor_source: balloon_contracts.maturity_date
      relation: not_after
      duration_source: variants.return_grace_days_after_maturity
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after maturity_date, and a return on
        the last day is timely.
      boundary: inclusive
  - id: charge_status
    applies_to:
    - balloon_return_charge
    - balloon_return_credit
    kind: state
    condition: Return charges can be billed only while the contract status is returned.
    evidence_fields:
    - balloon_contracts.status
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    state_contract:
      field: balloon_contracts.status
      allowed:
      - returned
  - id: dispute_elapsed
    applies_to:
    - balloon_return_charge
    kind: time
    condition: Return charges may be billed only after return_inspection_dispute_days have fully elapsed from the
      date the vehicle was returned.
    evidence_fields:
    - balloon_contracts.return_date
    - balloon_contracts.balloon_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - balloon_contracts.balloon_contract_id
      action_bindings:
        balloon_contracts.balloon_contract_id: balloon_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was returned
      anchor_source: balloon_contracts.return_date
      relation: not_before
      duration_source: variants.return_inspection_dispute_days
      unit: calendar_days
      counting_rule: The dispute period is counted in calendar days starting the day after return_date, so billing
        is permitted from the calendar day after return_date plus return_inspection_dispute_days.
      boundary: exclusive
  formula:
    excess_miles: max(0, inspection_odometer - odometer_at_contract - annual_mileage_allowance * term_months / 12)
    mileage_charge: round(excess_miles * return_excess_mileage_rate, 2)
    wear_charge: max(0, wear_assessed_amount - return_wear_waiver_cap)
  params:
    per_tier:
      Kestrel Advantage Balloon Tier 5:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 4:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 3:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 2:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 1:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
      Kestrel Advantage Balloon Tier 1+:
        return_option_fee: =return_option_fee
        return_wear_waiver_cap: =return_wear_waiver_cap
    return_fee_loyalty_days: =return_fee_loyalty_days
    return_excess_mileage_rate: =return_excess_mileage_rate
    return_window_days_before_maturity: =return_window_days_before_maturity
    return_grace_days_after_maturity: =return_grace_days_after_maturity
    return_inspection_dispute_days: =return_inspection_dispute_days
    return_charge_off_days: =return_charge_off_days
    return_charges_due_days: =return_charges_due_days

extended_policies:
- id: balloon_ext_return_mileage_charge
  base_policy_refs:
  - balloon_vehicle_return
  overwrite:
  - base_policy: balloon_vehicle_return
    superseded_clause: excess_miles is the inspection odometer less odometer_at_contract less annual_mileage_allowance times term_months divided by 12, never below zero, and is charged at return_excess_mileage_rate per mile.
    replaced_by: For the excess mileage charge billed on a returned balloon contract of a customer who holds at most one active Kestrel lease and at most one active Kestrel new-vehicle retail contract, and only for that charge, the miles driven, the mileage allowance, the miles forgiven and the per-mile rate are those set out in this rule, the excess miles never fall below zero, and the charge is the excess miles times the per-mile rate; a customer holding two or more active Kestrel leases or two or more active Kestrel new-vehicle retail contracts is outside this rule and its tool, and that customer's excess mileage charge stays under the base sentence, by which excess_miles is the inspection odometer less odometer_at_contract less annual_mileage_allowance times term_months divided by 12, never below zero, and is charged at return_excess_mileage_rate per mile; the rest of the return rule, including the wear and return fee provisions, the return window and the billing timing, stays as the base states it.
  trigger: state_due
  subject:
  - balloon_return_charge
  computes: amount
  target_tool: bill_excess_mileage_charge_7a491561
  params:
    odometer_tolerance_miles: 100
    history_window_months: 24
    tolerance_miles_preferred: 1000
    tolerance_miles_standard: 500
    loyalty_window_days: 60
    loyalty_miles_lease: 1500
    loyalty_miles_retail: 1000
    election_lead_days_long: 30
    election_lead_days_short: 15
    election_miles_long: 300
    election_miles_short: 150
    rate_reduction_completed_loan: 0.05
    rate_reduction_active_account: 0.03
  rule: 'This rule sets the excess mileage charge billed once a balloon vehicle has come back under the return option and the return inspection is on file. The excess mileage charge is figured from the return inspection on file. Where more than one return inspection is on file the one with the latest inspection date is used, and of two dated the same day the one recorded first; a returned contract with no return inspection on file is outside this rule and its tool until one is recorded. Calendar days from one date to another count the later date and not the earlier one; whole calendar months from one date to another are complete each time the later date reaches the earlier date''s day of the month, so a later date that falls earlier in its month (month-end included) leaves that month incomplete; a window of N calendar months ending on a date takes in the dates on or before that date that fall fewer than N whole calendar months before it. The miles driven for the excess mileage charge are the inspection odometer less odometer_at_contract. The mileage allowance for the excess mileage charge is annual_mileage_allowance times term_months divided by 12, rounded to a whole mile. The excess miles are the miles driven less the mileage allowance, never below zero. The excess mileage charge is the excess miles times return_excess_mileage_rate for the tier, rounded to the cent. For the excess mileage charge billed on a returned balloon contract of a customer who holds at most one active Kestrel lease and at most one active Kestrel new-vehicle retail contract, and only for that charge, the miles driven, the mileage allowance, the miles forgiven and the per-mile rate are those set out in this rule, the excess miles never fall below zero, and the charge is the excess miles times the per-mile rate; a customer holding two or more active Kestrel leases or two or more active Kestrel new-vehicle retail contracts is outside this rule and its tool, and that customer''s excess mileage charge stays under the base sentence, by which excess_miles is the inspection odometer less odometer_at_contract less annual_mileage_allowance times term_months divided by 12, never below zero, and is charged at return_excess_mileage_rate per mile; the rest of the return rule, including the wear and return fee provisions, the return window and the billing timing, stays as the base states it. Mileage odometer reading: where the odometer the dealer recorded when signing the vehicle in (return_odometer) and the inspection odometer differ by at least one mile and by no more than odometer_tolerance_miles, the miles driven are measured from the lower of the two readings; where they differ by more than odometer_tolerance_miles, the miles driven are measured from the odometer the dealer recorded at sign-in, which is the signed odometer statement; where the two readings agree, the inspection odometer is used. Mileage allowance basis: where the vehicle came back before maturity_date, the mileage allowance is the full-term allowance (annual_mileage_allowance times term_months divided by 12) prorated by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date, rounded to a whole mile; where the vehicle came back after maturity_date on a contract with installments deferred by extension (extensions_used_lifetime above zero), the mileage allowance is annual_mileage_allowance times the sum of term_months and extensions_used_lifetime divided by 12, rounded to a whole mile; where the vehicle came back on maturity_date, or after it with no installment ever deferred, the full-term allowance applies. Mileage tolerance: a contract in Kestrel Advantage Balloon Tier 2, Tier 1 or Tier 1+ with at most one balloon late charge assessed in the history_window_months calendar months ending on the billing date has tolerance_miles_preferred miles forgiven; a contract in Kestrel Advantage Balloon Tier 3 or Tier 4 with at most one balloon late charge assessed in those months has tolerance_miles_standard miles forgiven; every other contract, that is a Tier 5 contract or any contract with two or more late charges in those months, has no tolerance miles. Mileage return-to-brand credit: a customer holding an active Kestrel lease whose lease_date falls within loyalty_window_days calendar days before or after the return date has loyalty_miles_lease miles forgiven; a customer holding no such lease but holding an active Kestrel new-vehicle retail contract whose contract_date falls within that span has loyalty_miles_retail miles forgiven; any other customer has no return-to-brand miles. Mileage advance-election credit: where the most recent maturity election recorded as return_vehicle was recorded at least election_lead_days_long calendar days before maturity_date, election_miles_long miles are forgiven; where it was recorded at least election_lead_days_short but fewer than election_lead_days_long calendar days before maturity_date, election_miles_short miles are forgiven; where it was recorded later, or no return election was recorded, no advance-election miles are forgiven. Mileage per-mile rate: a customer with a Kestrel new-vehicle retail or pre-owned retail contract that has reached paid_in_full or closed has return_excess_mileage_rate reduced by rate_reduction_completed_loan; a customer with no such contract but holding an active Kestrel lease or an active Kestrel new-vehicle retail contract has it reduced by rate_reduction_active_account; any other customer is charged return_excess_mileage_rate. Every mileage forgiveness that applies is subtracted from the miles driven less the mileage allowance, the excess miles that remain never fall below zero, and the excess miles are charged at the per-mile rate that applies, rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: lease
    as: branch
    reads:
    - status
    - lease_date
    note: The mileage return-to-brand credit is decided by whether the customer holds an active Kestrel lease dated near the return date.
  - category: retail
    as: branch
    reads:
    - status
    - contract_date
    note: The per-mile rate reduction and the retail branch of the return-to-brand credit are decided from the customer's Kestrel new-vehicle retail contracts.
  - category: preowned
    as: existence
    reads:
    - status
    note: A pre-owned retail contract paid in full or closed also qualifies for the completed-loan rate reduction.
  compute:
  - insp_odo: LATEST('balloon_transactions', 'inspection_odometer', date_field='txn_date', event_type='balloon_return_inspection')
  - signin_odo: F('return_odometer')
  - odo_gap: ABS(insp_odo - signin_odo)
  - odometer_used: MN(insp_odo, signin_odo) if (odo_gap >= 1 and odo_gap <= K('odometer_tolerance_miles')) else (signin_odo if odo_gap > K('odometer_tolerance_miles') else insp_odo)
  - miles_driven: odometer_used - F('odometer_at_contract')
  - held_days: DAYS(F('contract_date'), F('return_date'))
  - term_days: DAYS(F('contract_date'), F('maturity_date'))
  - allowance: RND(F('annual_mileage_allowance') * F('term_months') / 12 * held_days / term_days, 0) if F('return_date') < F('maturity_date') else (RND(F('annual_mileage_allowance') * (F('term_months') + F('extensions_used_lifetime')) / 12, 0) if (F('return_date') > F('maturity_date') and F('extensions_used_lifetime') > 0) else RND(F('annual_mileage_allowance') * F('term_months') / 12, 0))
  - late_charges_window: COUNT('balloon_transactions', within_months=K('history_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - tolerance_miles: K('tolerance_miles_preferred') if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 2' or F('variant_name') == 'Kestrel Advantage Balloon Tier 1' or F('variant_name') == 'Kestrel Advantage Balloon Tier 1+') and late_charges_window <= 1) else (K('tolerance_miles_standard') if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 3' or F('variant_name') == 'Kestrel Advantage Balloon Tier 4') and late_charges_window <= 1) else 0)
  - lease_gap: ABS(DAYS(F('return_date'), CFIELD('lease', 'lease_date', status='active'))) if EXISTS('lease', status='active') else 99999
  - retail_gap: ABS(DAYS(F('return_date'), CFIELD('retail', 'contract_date', status='active'))) if EXISTS('retail', status='active') else 99999
  - loyalty_miles: K('loyalty_miles_lease') if lease_gap <= K('loyalty_window_days') else (K('loyalty_miles_retail') if retail_gap <= K('loyalty_window_days') else 0)
  - election_lead: DAYS(LATEST('balloon_transactions', 'txn_date', date_field='txn_date', event_type='balloon_maturity_election', maturity_option='return_vehicle'), F('maturity_date')) if COUNT('balloon_transactions', event_type='balloon_maturity_election', maturity_option='return_vehicle') > 0 else -1
  - election_miles: K('election_miles_long') if election_lead >= K('election_lead_days_long') else (K('election_miles_short') if election_lead >= K('election_lead_days_short') else 0)
  - completed_loan: EXISTS('retail', status='paid_in_full') or EXISTS('retail', status='closed') or EXISTS('preowned', status='paid_in_full') or EXISTS('preowned', status='closed')
  - active_account: EXISTS('lease', status='active') or EXISTS('retail', status='active')
  - rate_reduction: K('rate_reduction_completed_loan') if completed_loan else (K('rate_reduction_active_account') if active_account else 0)
  - per_mile_rate: P('return_excess_mileage_rate') - rate_reduction
  - excess_miles: MX(0, miles_driven - allowance - tolerance_miles - loyalty_miles - election_miles)
  - result: RND(excess_miles * per_mile_rate, 2)
  compute_basis:
    insp_odo: Where more than one return inspection is on file the one with the latest inspection date is used, and of two dated the same day the one recorded first
    signin_odo: where the odometer the dealer recorded when signing the vehicle in (return_odometer) and the inspection odometer differ by at least one mile and by no more than odometer_tolerance_miles, the miles driven are measured from the lower of the two readings
    odo_gap: where the odometer the dealer recorded when signing the vehicle in (return_odometer) and the inspection odometer differ by at least one mile and by no more than odometer_tolerance_miles
    odometer_used: 'Mileage odometer reading: where the odometer the dealer recorded when signing the vehicle in (return_odometer) and the inspection odometer differ by at least one mile and by no more than odometer_tolerance_miles, the miles driven are measured from the lower of the two readings; where they differ by more than odometer_tolerance_miles, the miles driven are measured from the odometer the dealer recorded at sign-in, which is the signed odometer statement; where the two readings agree, the inspection odometer is used.'
    miles_driven: The miles driven for the excess mileage charge are the inspection odometer less odometer_at_contract.
    held_days: prorated by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date, rounded to a whole mile
    term_days: prorated by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date, rounded to a whole mile
    allowance: 'Mileage allowance basis: where the vehicle came back before maturity_date, the mileage allowance is the full-term allowance (annual_mileage_allowance times term_months divided by 12) prorated by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date, rounded to a whole mile; where the vehicle came back after maturity_date on a contract with installments deferred by extension (extensions_used_lifetime above zero), the mileage allowance is annual_mileage_allowance times the sum of term_months and extensions_used_lifetime divided by 12, rounded to a whole mile; where the vehicle came back on maturity_date, or after it with no installment ever deferred, the full-term allowance applies.'
    late_charges_window: with at most one balloon late charge assessed in the history_window_months calendar months ending on the billing date
    tolerance_miles: 'Mileage tolerance: a contract in Kestrel Advantage Balloon Tier 2, Tier 1 or Tier 1+ with at most one balloon late charge assessed in the history_window_months calendar months ending on the billing date has tolerance_miles_preferred miles forgiven; a contract in Kestrel Advantage Balloon Tier 3 or Tier 4 with at most one balloon late charge assessed in those months has tolerance_miles_standard miles forgiven; every other contract, that is a Tier 5 contract or any contract with two or more late charges in those months, has no tolerance miles.'
    lease_gap: a customer holding an active Kestrel lease whose lease_date falls within loyalty_window_days calendar days before or after the return date
    retail_gap: a customer holding no such lease but holding an active Kestrel new-vehicle retail contract whose contract_date falls within that span
    loyalty_miles: 'Mileage return-to-brand credit: a customer holding an active Kestrel lease whose lease_date falls within loyalty_window_days calendar days before or after the return date has loyalty_miles_lease miles forgiven; a customer holding no such lease but holding an active Kestrel new-vehicle retail contract whose contract_date falls within that span has loyalty_miles_retail miles forgiven; any other customer has no return-to-brand miles.'
    election_lead: where the most recent maturity election recorded as return_vehicle was recorded at least election_lead_days_long calendar days before maturity_date
    election_miles: 'Mileage advance-election credit: where the most recent maturity election recorded as return_vehicle was recorded at least election_lead_days_long calendar days before maturity_date, election_miles_long miles are forgiven; where it was recorded at least election_lead_days_short but fewer than election_lead_days_long calendar days before maturity_date, election_miles_short miles are forgiven; where it was recorded later, or no return election was recorded, no advance-election miles are forgiven.'
    completed_loan: a customer with a Kestrel new-vehicle retail or pre-owned retail contract that has reached paid_in_full or closed has return_excess_mileage_rate reduced by rate_reduction_completed_loan
    active_account: a customer with no such contract but holding an active Kestrel lease or an active Kestrel new-vehicle retail contract has it reduced by rate_reduction_active_account
    rate_reduction: 'Mileage per-mile rate: a customer with a Kestrel new-vehicle retail or pre-owned retail contract that has reached paid_in_full or closed has return_excess_mileage_rate reduced by rate_reduction_completed_loan; a customer with no such contract but holding an active Kestrel lease or an active Kestrel new-vehicle retail contract has it reduced by rate_reduction_active_account; any other customer is charged return_excess_mileage_rate.'
    per_mile_rate: the excess miles are charged at the per-mile rate that applies, rounded to the cent
    excess_miles: Every mileage forgiveness that applies is subtracted from the miles driven less the mileage allowance, the excess miles that remain never fall below zero
    result: the excess miles are charged at the per-mile rate that applies, rounded to the cent.
  factors:
  - id: mc_odometer_reading
    effect: method
    decides: odometer_used
    bindings:
    - insp_odo
    - signin_odo
    - odo_gap
    - odometer_used
    ladder:
    - when: the dealer's sign-in odometer and the inspection odometer differ by at least one mile and by no more than odometer_tolerance_miles
      method: the miles driven are measured from the lower of the two readings
    - when: the two readings differ by more than odometer_tolerance_miles
      method: the miles driven are measured from the dealer's sign-in odometer (the signed odometer statement)
    - when: otherwise (the two readings agree)
      method: the miles driven are measured from the inspection odometer
    baseline:
      odometer_used: insp_odo
    evidence:
    - history
    cross_difficulty: null
  - id: mc_allowance_basis
    effect: method
    decides: allowance
    bindings:
    - held_days
    - term_days
    - allowance
    ladder:
    - when: the vehicle came back before maturity_date
      method: the full-term allowance prorated by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date, rounded to a whole mile
    - when: the vehicle came back after maturity_date and extensions_used_lifetime is above zero
      method: annual_mileage_allowance times (term_months plus extensions_used_lifetime) divided by 12, rounded to a whole mile
    - when: otherwise (on maturity_date, or after it with no installment deferred)
      method: the full-term allowance, annual_mileage_allowance times term_months divided by 12
    baseline:
      allowance: RND(F('annual_mileage_allowance') * F('term_months') / 12, 0)
    evidence:
    - date
    cross_difficulty: null
  - id: mc_tolerance_miles
    effect: parameter
    decides: tolerance_miles
    bindings:
    - late_charges_window
    - tolerance_miles
    ladder:
    - when: Tier 2, Tier 1 or Tier 1+ AND at most one balloon late charge in the history_window_months months ending on the billing date
      value: K('tolerance_miles_preferred')
    - when: Tier 3 or Tier 4 AND at most one balloon late charge in those months
      value: K('tolerance_miles_standard')
    - when: otherwise (Tier 5, or two or more late charges in those months)
      value: '0'
    baseline:
      tolerance_miles: '0'
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  - id: mc_return_to_brand
    effect: parameter
    decides: loyalty_miles
    bindings:
    - lease_gap
    - retail_gap
    - loyalty_miles
    ladder:
    - when: an active Kestrel lease whose lease_date is within loyalty_window_days days of the return date
      value: K('loyalty_miles_lease')
    - when: no such lease, but an active Kestrel new-vehicle retail contract whose contract_date is within that span
      value: K('loyalty_miles_retail')
    - when: otherwise
      value: '0'
    baseline:
      loyalty_miles: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: lease
  - id: mc_advance_election
    effect: parameter
    decides: election_miles
    bindings:
    - election_lead
    - election_miles
    ladder:
    - when: the latest return_vehicle election was recorded at least election_lead_days_long days before maturity_date
      value: K('election_miles_long')
    - when: it was recorded at least election_lead_days_short but fewer than election_lead_days_long days before maturity_date
      value: K('election_miles_short')
    - when: otherwise (later, or no return election)
      value: '0'
    baseline:
      election_miles: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: mc_rate_relationship
    effect: parameter
    decides: rate_reduction
    bindings:
    - completed_loan
    - active_account
    - rate_reduction
    ladder:
    - when: a Kestrel new-vehicle retail or pre-owned retail contract at paid_in_full or closed
      value: K('rate_reduction_completed_loan')
    - when: no such contract, but an active Kestrel lease or active Kestrel new-vehicle retail contract
      value: K('rate_reduction_active_account')
    - when: otherwise
      value: '0'
    baseline:
      rate_reduction: '0'
    evidence:
    - cross_category
    cross_difficulty: retail
  baseline:
    rule: The excess mileage charge is figured from the return inspection on file. The miles driven for the excess mileage charge are the inspection odometer less odometer_at_contract. The mileage allowance for the excess mileage charge is annual_mileage_allowance times term_months divided by 12, rounded to a whole mile. The excess miles are the miles driven less the mileage allowance, never below zero. The excess mileage charge is the excess miles times return_excess_mileage_rate for the tier, rounded to the cent.
    params:
    - return_excess_mileage_rate
  inputs:
