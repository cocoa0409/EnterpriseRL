- id: balloon_ext_return_wear_charge
  base_policy_refs:
  - balloon_vehicle_return
  overwrite:
  - base_policy: balloon_vehicle_return
    superseded_clause: The excess wear charge is wear_assessed_amount less return_wear_waiver_cap for the tier, never below zero.
    replaced_by: For the excess wear charge billed on a returned balloon contract of a customer who holds at most one active Kestrel lease, at most one active Kestrel new-vehicle retail contract and at most one Kestrel new-vehicle retail contract at paid_in_full or closed, and only for that charge, the wear forgiveness, the wear credits and the share billed are those set out in this rule, the chargeable wear never falls below zero, and the wear_assessed_amount recorded by the return inspection remains the amount the charge starts from; a customer holding two or more active Kestrel leases, two or more active Kestrel new-vehicle retail contracts or two or more Kestrel new-vehicle retail contracts at paid_in_full or closed is outside this rule and its tool, and that customer's excess wear charge stays under the base sentence, by which the excess wear charge is wear_assessed_amount less return_wear_waiver_cap for the tier, never below zero; the rest of the return rule, including the mileage and return fee provisions, the return window and the billing timing, stays as the base states it.
  trigger: state_due
  subject:
  - balloon_return_charge
  computes: amount
  target_tool: bill_excess_wear_charge_ce1b5dd4
  params:
    wear_history_window_months: 12
    wear_standing_bonus_preferred: 250.0
    wear_standing_bonus_entry: 150.0
    wear_min_payments: 10
    wear_loyalty_window_days: 60
    wear_credit_lease: 400.0
    wear_credit_retail: 250.0
    wear_tenure_long_years: 8
    wear_tenure_mid_years: 4
    wear_credit_tenure_long: 150.0
    wear_credit_tenure_mid: 75.0
    wear_streak_long_months: 9
    wear_streak_mid_months: 6
    wear_credit_streak_long: 100.0
    wear_credit_streak_mid: 50.0
    wear_share_preferred: 0.5
    wear_share_standard: 0.75
  rule: 'This rule sets the excess wear charge billed once a balloon vehicle has come back under the return option and the return inspection is on file. The excess wear charge starts from the wear_assessed_amount on the return inspection on file. Where more than one return inspection is on file the one with the latest inspection date is used, and of two dated the same day the one recorded first; a returned contract with no return inspection on file is outside this rule and its tool until one is recorded. Of two balloon late charges assessed the same day, the one recorded first is taken as the most recent. Years between two dates are counted as whole calendar months divided by 12. Calendar days from one date to another count the later date and not the earlier one; whole calendar months from one date to another are complete each time the later date reaches the earlier date''s day of the month, so a later date that falls earlier in its month (month-end included) leaves that month incomplete; a window of N calendar months ending on a date takes in the dates on or before that date that fall fewer than N whole calendar months before it. The wear forgiveness is return_wear_waiver_cap for the tier. The chargeable wear is the wear_assessed_amount less the wear forgiveness, never below zero. The excess wear charge is the chargeable wear, rounded to the cent. For the excess wear charge billed on a returned balloon contract of a customer who holds at most one active Kestrel lease, at most one active Kestrel new-vehicle retail contract and at most one Kestrel new-vehicle retail contract at paid_in_full or closed, and only for that charge, the wear forgiveness, the wear credits and the share billed are those set out in this rule, the chargeable wear never falls below zero, and the wear_assessed_amount recorded by the return inspection remains the amount the charge starts from; a customer holding two or more active Kestrel leases, two or more active Kestrel new-vehicle retail contracts or two or more Kestrel new-vehicle retail contracts at paid_in_full or closed is outside this rule and its tool, and that customer''s excess wear charge stays under the base sentence, by which the excess wear charge is wear_assessed_amount less return_wear_waiver_cap for the tier, never below zero; the rest of the return rule, including the mileage and return fee provisions, the return window and the billing timing, stays as the base states it. Wear forgiveness by standing: a contract in Kestrel Advantage Balloon Tier 3, Tier 2, Tier 1 or Tier 1+ with no balloon returned payment and at least wear_min_payments balloon payments posted in the wear_history_window_months calendar months ending on the billing date has its wear forgiveness raised to return_wear_waiver_cap for its tier plus wear_standing_bonus_preferred; a contract in Kestrel Advantage Balloon Tier 4 or Tier 5 with no balloon returned payment and at least wear_min_payments balloon payments posted in those months has it raised to return_wear_waiver_cap for its tier plus wear_standing_bonus_entry; any other contract, including one with a returned payment or with fewer than wear_min_payments payments posted in those months, keeps return_wear_waiver_cap for its tier. Wear forgiveness proration: where the vehicle came back before maturity_date, the wear forgiveness is multiplied by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date and rounded to the cent; where it came back after maturity_date on a contract with installments deferred by extension (extensions_used_lifetime above zero), the wear forgiveness is multiplied by the sum of term_months and extensions_used_lifetime over term_months and rounded to the cent; where it came back on maturity_date, or after it with no installment ever deferred, the wear forgiveness is not prorated. Wear return-to-brand credit: a customer holding an active Kestrel lease whose lease_date falls within wear_loyalty_window_days calendar days before or after the return date receives a wear credit of wear_credit_lease; a customer holding no such lease but holding an active Kestrel new-vehicle retail contract whose contract_date falls within that span receives wear_credit_retail; any other customer receives no return-to-brand wear credit. Wear tenure credit: a customer whose Kestrel new-vehicle retail contract, now paid_in_full or closed, was signed at least wear_tenure_long_years years before the return date receives a wear credit of wear_credit_tenure_long; one whose such contract was signed at least wear_tenure_mid_years but fewer than wear_tenure_long_years years before the return date receives wear_credit_tenure_mid; any other customer receives no tenure wear credit. Wear on-time credit: where the whole calendar months from the due date of the installment that drew the most recent balloon late charge to the return date number at least wear_streak_long_months, or no balloon late charge has ever been assessed, the customer receives a wear credit of wear_credit_streak_long; where they number at least wear_streak_mid_months but fewer than wear_streak_long_months, the customer receives wear_credit_streak_mid; otherwise no on-time wear credit applies. Wear share billed: a contract in Kestrel Advantage Balloon Tier 2, Tier 1 or Tier 1+ with at most one balloon late charge assessed in the wear_history_window_months calendar months ending on the billing date is billed wear_share_preferred of the chargeable wear; a contract in Kestrel Advantage Balloon Tier 3 or Tier 4 with at most one balloon late charge in those months is billed wear_share_standard of it; every other contract, that is a Tier 5 contract or any contract with two or more late charges in those months, is billed the whole chargeable wear. Replacements of the wear forgiveness are made first and proration of it second; the wear forgiveness and every wear credit that applies are then subtracted together from the wear_assessed_amount, the chargeable wear that remains never falls below zero, and any share of it that applies is taken last, rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: lease
    as: branch
    reads:
    - status
    - lease_date
    note: The wear return-to-brand credit is decided by whether the customer holds an active Kestrel lease dated near the return date.
  - category: retail
    as: branch
    reads:
    - status
    - contract_date
    note: The wear tenure credit is decided from the signing date of the customer's completed Kestrel new-vehicle retail contract, and the retail branch of the return-to-brand credit from an active one.
  compute:
  - wear_assessed: LATEST('balloon_transactions', 'wear_assessed_amount', date_field='txn_date', event_type='balloon_return_inspection')
  - returned_window: COUNT('balloon_transactions', within_months=K('wear_history_window_months'), date_field='txn_date', event_type='balloon_payment_returned')
  - payments_window: COUNT('balloon_transactions', within_months=K('wear_history_window_months'), date_field='txn_date', event_type='balloon_payment')
  - forgiveness: P('return_wear_waiver_cap') + K('wear_standing_bonus_preferred') if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 3' or F('variant_name') == 'Kestrel Advantage Balloon Tier 2' or F('variant_name') == 'Kestrel Advantage Balloon Tier 1' or F('variant_name') == 'Kestrel Advantage Balloon Tier 1+') and returned_window == 0 and payments_window >= K('wear_min_payments')) else (P('return_wear_waiver_cap') + K('wear_standing_bonus_entry') if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 4' or F('variant_name') == 'Kestrel Advantage Balloon Tier 5') and returned_window == 0 and payments_window >= K('wear_min_payments')) else P('return_wear_waiver_cap'))
  - wear_held_days: DAYS(F('contract_date'), F('return_date'))
  - wear_term_days: DAYS(F('contract_date'), F('maturity_date'))
  - proration_share: wear_held_days / wear_term_days if F('return_date') < F('maturity_date') else ((F('term_months') + F('extensions_used_lifetime')) / F('term_months') if (F('return_date') > F('maturity_date') and F('extensions_used_lifetime') > 0) else 1)
  - wear_lease_gap: ABS(DAYS(F('return_date'), CFIELD('lease', 'lease_date', status='active'))) if EXISTS('lease', status='active') else 99999
  - wear_retail_gap: ABS(DAYS(F('return_date'), CFIELD('retail', 'contract_date', status='active'))) if EXISTS('retail', status='active') else 99999
  - brand_credit: K('wear_credit_lease') if wear_lease_gap <= K('wear_loyalty_window_days') else (K('wear_credit_retail') if wear_retail_gap <= K('wear_loyalty_window_days') else 0)
  - tenure_years: MONTHS(CFIELD('retail', 'contract_date', status='closed'), F('return_date')) / 12 if EXISTS('retail', status='closed') else (MONTHS(CFIELD('retail', 'contract_date', status='paid_in_full'), F('return_date')) / 12 if EXISTS('retail', status='paid_in_full') else 0)
  - tenure_credit: K('wear_credit_tenure_long') if tenure_years >= K('wear_tenure_long_years') else (K('wear_credit_tenure_mid') if tenure_years >= K('wear_tenure_mid_years') else 0)
  - last_late_due: LATEST('balloon_transactions', 'installment_due_date', date_field='txn_date', event_type='balloon_late_charge')
  - ontime_months: MONTHS(last_late_due, F('return_date')) if last_late_due else 9999
  - streak_credit: K('wear_credit_streak_long') if ontime_months >= K('wear_streak_long_months') else (K('wear_credit_streak_mid') if ontime_months >= K('wear_streak_mid_months') else 0)
  - late_window: COUNT('balloon_transactions', within_months=K('wear_history_window_months'), date_field='txn_date', event_type='balloon_late_charge')
  - billed_share: K('wear_share_preferred') if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 2' or F('variant_name') == 'Kestrel Advantage Balloon Tier 1' or F('variant_name') == 'Kestrel Advantage Balloon Tier 1+') and late_window <= 1) else (K('wear_share_standard') if ((F('variant_name') == 'Kestrel Advantage Balloon Tier 3' or F('variant_name') == 'Kestrel Advantage Balloon Tier 4') and late_window <= 1) else 1)
  - forgiveness_applied: RND(forgiveness * proration_share, 2)
  - chargeable_wear: MX(0, wear_assessed - forgiveness_applied - brand_credit - tenure_credit - streak_credit)
  - result: RND(chargeable_wear * billed_share, 2)
  compute_basis:
    wear_assessed: Where more than one return inspection is on file the one with the latest inspection date is used, and of two dated the same day the one recorded first
    returned_window: with no balloon returned payment and at least wear_min_payments balloon payments posted in the wear_history_window_months calendar months ending on the billing date
    payments_window: with no balloon returned payment and at least wear_min_payments balloon payments posted in the wear_history_window_months calendar months ending on the billing date
    forgiveness: 'Wear forgiveness by standing: a contract in Kestrel Advantage Balloon Tier 3, Tier 2, Tier 1 or Tier 1+ with no balloon returned payment and at least wear_min_payments balloon payments posted in the wear_history_window_months calendar months ending on the billing date has its wear forgiveness raised to return_wear_waiver_cap for its tier plus wear_standing_bonus_preferred; a contract in Kestrel Advantage Balloon Tier 4 or Tier 5 with no balloon returned payment and at least wear_min_payments balloon payments posted in those months has it raised to return_wear_waiver_cap for its tier plus wear_standing_bonus_entry; any other contract, including one with a returned payment or with fewer than wear_min_payments payments posted in those months, keeps return_wear_waiver_cap for its tier.'
    wear_held_days: multiplied by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date and rounded to the cent
    wear_term_days: multiplied by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date and rounded to the cent
    proration_share: 'Wear forgiveness proration: where the vehicle came back before maturity_date, the wear forgiveness is multiplied by the calendar days from contract_date to the return date over the calendar days from contract_date to maturity_date and rounded to the cent; where it came back after maturity_date on a contract with installments deferred by extension (extensions_used_lifetime above zero), the wear forgiveness is multiplied by the sum of term_months and extensions_used_lifetime over term_months and rounded to the cent; where it came back on maturity_date, or after it with no installment ever deferred, the wear forgiveness is not prorated.'
    wear_lease_gap: a customer holding an active Kestrel lease whose lease_date falls within wear_loyalty_window_days calendar days before or after the return date
    wear_retail_gap: a customer holding no such lease but holding an active Kestrel new-vehicle retail contract whose contract_date falls within that span
    brand_credit: 'Wear return-to-brand credit: a customer holding an active Kestrel lease whose lease_date falls within wear_loyalty_window_days calendar days before or after the return date receives a wear credit of wear_credit_lease; a customer holding no such lease but holding an active Kestrel new-vehicle retail contract whose contract_date falls within that span receives wear_credit_retail; any other customer receives no return-to-brand wear credit.'
    tenure_years: Years between two dates are counted as whole calendar months divided by 12.
    tenure_credit: 'Wear tenure credit: a customer whose Kestrel new-vehicle retail contract, now paid_in_full or closed, was signed at least wear_tenure_long_years years before the return date receives a wear credit of wear_credit_tenure_long; one whose such contract was signed at least wear_tenure_mid_years but fewer than wear_tenure_long_years years before the return date receives wear_credit_tenure_mid; any other customer receives no tenure wear credit.'
    last_late_due: Of two balloon late charges assessed the same day, the one recorded first is taken as the most recent.
    ontime_months: where the whole calendar months from the due date of the installment that drew the most recent balloon late charge to the return date number at least wear_streak_long_months, or no balloon late charge has ever been assessed
    streak_credit: 'Wear on-time credit: where the whole calendar months from the due date of the installment that drew the most recent balloon late charge to the return date number at least wear_streak_long_months, or no balloon late charge has ever been assessed, the customer receives a wear credit of wear_credit_streak_long; where they number at least wear_streak_mid_months but fewer than wear_streak_long_months, the customer receives wear_credit_streak_mid; otherwise no on-time wear credit applies.'
    late_window: with at most one balloon late charge assessed in the wear_history_window_months calendar months ending on the billing date
    billed_share: 'Wear share billed: a contract in Kestrel Advantage Balloon Tier 2, Tier 1 or Tier 1+ with at most one balloon late charge assessed in the wear_history_window_months calendar months ending on the billing date is billed wear_share_preferred of the chargeable wear; a contract in Kestrel Advantage Balloon Tier 3 or Tier 4 with at most one balloon late charge in those months is billed wear_share_standard of it; every other contract, that is a Tier 5 contract or any contract with two or more late charges in those months, is billed the whole chargeable wear.'
    forgiveness_applied: Replacements of the wear forgiveness are made first and proration of it second
    chargeable_wear: the wear forgiveness and every wear credit that applies are then subtracted together from the wear_assessed_amount, the chargeable wear that remains never falls below zero
    result: and any share of it that applies is taken last, rounded to the cent.
  factors:
  - id: wc_standing_forgiveness
    effect: parameter
    decides: forgiveness
    bindings:
    - returned_window
    - payments_window
    - forgiveness
    ladder:
    - when: Tier 3, Tier 2, Tier 1 or Tier 1+ AND no balloon returned payment AND at least wear_min_payments balloon payments in the wear_history_window_months months ending on the billing date
      value: P('return_wear_waiver_cap') + K('wear_standing_bonus_preferred')
    - when: Tier 4 or Tier 5 AND no balloon returned payment AND at least wear_min_payments balloon payments in those months
      value: P('return_wear_waiver_cap') + K('wear_standing_bonus_entry')
    - when: otherwise (a returned payment, or fewer than wear_min_payments payments, in those months)
      value: P('return_wear_waiver_cap')
    baseline:
      forgiveness: P('return_wear_waiver_cap')
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  - id: wc_forgiveness_proration
    effect: method
    decides: proration_share
    bindings:
    - wear_held_days
    - wear_term_days
    - proration_share
    ladder:
    - when: the vehicle came back before maturity_date
      method: the forgiveness is multiplied by the days from contract_date to the return date over the days from contract_date to maturity_date
    - when: the vehicle came back after maturity_date and extensions_used_lifetime is above zero
      method: the forgiveness is multiplied by (term_months plus extensions_used_lifetime) over term_months
    - when: otherwise
      method: the forgiveness is not prorated
    baseline:
      proration_share: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: wc_return_to_brand
    effect: parameter
    decides: brand_credit
    bindings:
    - wear_lease_gap
    - wear_retail_gap
    - brand_credit
    ladder:
    - when: an active Kestrel lease whose lease_date is within wear_loyalty_window_days days of the return date
      value: K('wear_credit_lease')
    - when: no such lease, but an active Kestrel new-vehicle retail contract whose contract_date is within that span
      value: K('wear_credit_retail')
    - when: otherwise
      value: '0'
    baseline:
      brand_credit: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: lease
  - id: wc_tenure_credit
    effect: parameter
    decides: tenure_credit
    bindings:
    - tenure_years
    - tenure_credit
    ladder:
    - when: a completed (paid_in_full or closed) Kestrel new-vehicle retail contract signed at least wear_tenure_long_years years before the return date
      value: K('wear_credit_tenure_long')
    - when: such a contract signed at least wear_tenure_mid_years but fewer than wear_tenure_long_years years before
      value: K('wear_credit_tenure_mid')
    - when: otherwise
      value: '0'
    baseline:
      tenure_credit: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: retail
  - id: wc_ontime_credit
    effect: parameter
    decides: streak_credit
    bindings:
    - last_late_due
    - ontime_months
    - streak_credit
    ladder:
    - when: at least wear_streak_long_months whole months from the due date of the most recently late-charged installment to the return date, or no late charge ever
      value: K('wear_credit_streak_long')
    - when: at least wear_streak_mid_months but fewer than wear_streak_long_months such months
      value: K('wear_credit_streak_mid')
    - when: otherwise
      value: '0'
    baseline:
      streak_credit: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: wc_share_billed
    effect: parameter
    decides: billed_share
    bindings:
    - late_window
    - billed_share
    ladder:
    - when: Tier 2, Tier 1 or Tier 1+ AND at most one balloon late charge in the wear_history_window_months months ending on the billing date
      value: K('wear_share_preferred')
    - when: Tier 3 or Tier 4 AND at most one balloon late charge in those months
      value: K('wear_share_standard')
    - when: otherwise (Tier 5, or two or more late charges in those months)
      value: '1'
    baseline:
      billed_share: '1'
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  baseline:
    rule: The excess wear charge starts from the wear_assessed_amount on the return inspection on file. The wear forgiveness is return_wear_waiver_cap for the tier. The chargeable wear is the wear_assessed_amount less the wear forgiveness, never below zero. The excess wear charge is the chargeable wear, rounded to the cent.
    params:
    - return_wear_waiver_cap
  inputs:
    history:
    - table: balloon_transactions
      aggregate: latest
      field: wear_assessed_amount
      filters:
        event_type: balloon_return_inspection
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_payment_returned
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_payment
    - table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      within_months: 12
      filters:
        event_type: balloon_late_charge
    - table: balloon_transactions
      aggregate: latest
      field: installment_due_date
      filters:
        event_type: balloon_late_charge
    cross_category:
    - lease
    - retail
- id: balloon_ext_return_fee
  base_policy_refs:
