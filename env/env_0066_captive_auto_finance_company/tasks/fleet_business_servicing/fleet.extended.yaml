- id: fleet_termination
  subject:
  - fleet_termination_noticed
  - fleet_termination_withdrawn
  - fleet_unit_turned_in
  - fleet_unit_charge
  rule: A termination notice takes effect only when a named authorized signer has completed the termination notice
    request for the unit. The unit may be turned in no earlier than termination_notice_days after the termination
    notice was received. The notice period is counted in calendar days starting the day after termination_notice_date,
    and turn-in on the last day of the period is permitted. A notice lapses, and the unit returns to in_service,
    when the unit is not turned in within turn_in_after_notice_max_days calendar days after the notice date; the
    business may withdraw a notice before turn-in. A TRAC unit turned in when fleet_msr_months_short_of_minimum
    is above zero is billed a minimum_term_charge equal to its monthly depreciation amount times fleet_msr_months_short_of_minimum.
    A closed-end commercial unit ended before scheduled_end_date is billed closed_end_early_termination_fee; at
    any end it is billed excess mileage at closed_end_excess_mileage_rate_by_class for miles above annual_mileage_allowance
    times months_in_service divided by 12, and wear charges capped at closed_end_wear_charge_cap_pct of capitalized_cost.
    Rentals continue to be invoiced through the month of turn-in.
  eligibility:
  - id: notice_signer
    applies_to:
    - fleet_termination_noticed
    kind: authorization
    condition: A termination notice takes effect only when a named authorized signer has completed the termination
      notice request for the unit.
    evidence_fields:
    - fleet_requests.request_type
    - fleet_requests.request_status
    - fleet_requests.fleet_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_requests.fleet_request_id
      action_bindings:
        fleet_requests.fleet_request_id: fleet_request_id
  - id: notice_period
    applies_to:
    - fleet_unit_turned_in
    kind: time
    condition: The unit may be turned in no earlier than termination_notice_days after the termination notice was
      received.
    evidence_fields:
    - fleet_units.termination_notice_date
    - fleet_units.fleet_unit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_units.fleet_unit_id
      action_bindings:
        fleet_units.fleet_unit_id: fleet_unit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the termination notice was received
      anchor_source: fleet_units.termination_notice_date
      relation: not_before
      duration_source: variants.termination_notice_days
      unit: calendar_days
      counting_rule: The notice period is counted in calendar days starting the day after termination_notice_date,
        and turn-in on the last day of the period is permitted.
      boundary: inclusive
  measures:
  - fleet_msr_months_short_of_minimum
  formula:
    minimum_term_charge: round(capitalized_cost * monthly_depreciation_pct / 100, 2) * fleet_msr_months_short_of_minimum
  params:
    per_tier:
      Kestrel Business Advantage:
        closed_end_early_termination_fee: =closed_end_early_termination_fee
        closed_end_wear_charge_cap_pct: =closed_end_wear_charge_cap_pct
      Kestrel Fleet Select:
        closed_end_early_termination_fee: =closed_end_early_termination_fee
        closed_end_wear_charge_cap_pct: =closed_end_wear_charge_cap_pct
      Kestrel Fleet Preferred:
        closed_end_early_termination_fee: =closed_end_early_termination_fee
        closed_end_wear_charge_cap_pct: =closed_end_wear_charge_cap_pct
      Kestrel Fleet Premier:
        closed_end_early_termination_fee: =closed_end_early_termination_fee
        closed_end_wear_charge_cap_pct: =closed_end_wear_charge_cap_pct
      Kestrel Fleet Enterprise:
        closed_end_early_termination_fee: =closed_end_early_termination_fee
        closed_end_wear_charge_cap_pct: =closed_end_wear_charge_cap_pct
      Kestrel National Fleet:
        closed_end_early_termination_fee: =closed_end_early_termination_fee
        closed_end_wear_charge_cap_pct: =closed_end_wear_charge_cap_pct
    termination_notice_days: =termination_notice_days
    turn_in_after_notice_max_days: =turn_in_after_notice_max_days
    minimum_term_months: =minimum_term_months
    closed_end_excess_mileage_rate_by_class: =closed_end_excess_mileage_rate_by_class
- id: fleet_trac_settlement
  subject:
  - fleet_unit_sold
  - fleet_sale_settlement
  - fleet_trac_surplus_credit
  - fleet_trac_deficiency_charge
  - fleet_unit_closed
  rule: 'A sale settlement can be posted only while the unit status is sold. Net proceeds are gross_sale_proceeds
    less sale_expenses less remarketing_fee for the tier, and the unit''s book value at the sale date is retired.
    For a TRAC unit, when net proceeds exceed book value the business is credited trac_surplus_share_pct percent
    of the excess, applied first to other charges due on the master agreement where surplus_offset_first is true;
    when they fall short the shortfall is billed as a deficiency due trac_deficiency_payment_days calendar days
    after the settlement invoice; the result is even when they are equal. For a closed-end commercial unit there
    is no terminal rental adjustment: trac_result is not_applicable and Kestrel keeps any gain or loss. The unit
    schedule closes once its charges due are zero.'
  eligibility:
  - id: settle_status
    applies_to:
    - fleet_sale_settlement
    kind: state
    condition: A sale settlement can be posted only while the unit status is sold.
    evidence_fields:
    - fleet_units.status
    - fleet_units.fleet_unit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_units.fleet_unit_id
      action_bindings:
        fleet_units.fleet_unit_id: fleet_unit_id
    state_contract:
      field: fleet_units.status
      allowed:
      - sold
  formula:
    net_proceeds: gross_sale_proceeds - sale_expenses - remarketing_fee
    surplus_credit: round(max(0, net_proceeds - book_value) * trac_surplus_share_pct / 100, 2)
    deficiency: max(0, book_value - net_proceeds)
  params:
    per_tier:
      Kestrel Business Advantage:
        remarketing_fee: =remarketing_fee
        trac_surplus_share_pct: =trac_surplus_share_pct
      Kestrel Fleet Select:
        remarketing_fee: =remarketing_fee
        trac_surplus_share_pct: =trac_surplus_share_pct
      Kestrel Fleet Preferred:
        remarketing_fee: =remarketing_fee
        trac_surplus_share_pct: =trac_surplus_share_pct
      Kestrel Fleet Premier:
        remarketing_fee: =remarketing_fee
        trac_surplus_share_pct: =trac_surplus_share_pct
      Kestrel Fleet Enterprise:
        remarketing_fee: =remarketing_fee
        trac_surplus_share_pct: =trac_surplus_share_pct
      Kestrel National Fleet:
        remarketing_fee: =remarketing_fee
        trac_surplus_share_pct: =trac_surplus_share_pct
    trac_deficiency_payment_days: =trac_deficiency_payment_days
    surplus_offset_first: =surplus_offset_first
- id: fleet_purchase_option
  subject:
  - fleet_purchase_quote
  - fleet_purchase_settlement
  - fleet_unit_purchased
  - fleet_title_transfer
  rule: A purchase quote can be issued only while the unit status is in_service or termination_requested. The purchase
    takes effect only when a named authorized signer has completed the purchase option request for the unit. The
    purchase price is book_value plus purchase_option_fee plus title_transfer_fee plus sales tax at the unit's purchase_sales_tax_rate_pct
    on book_value plus purchase_option_fee, plus any charges due. A quote is honoured through purchase_quote_valid_days
    calendar days after the quote date. Title is transferred within title_transfer_business_days business days after
    the purchase funds clear, electronically where the title state supports it and otherwise by mailing the signed-off
    title, and the schedule then closes.
  eligibility:
  - id: quote_status
    applies_to:
