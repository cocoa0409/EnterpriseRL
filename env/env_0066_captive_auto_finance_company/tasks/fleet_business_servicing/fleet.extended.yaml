    odometer_at_delivery: as written on the schedule
    delivery_date: as written on the schedule
    scheduled_end_date: as written on the schedule
    purchase_sales_tax_rate_pct: as written on the schedule
  triggers: []
- type: fleet_unit_accepted
  target: fleet_units
  mutation:
    transition:
      from: ordered
      to: in_service
  meaning: The authorized signer accepts delivery and the unit goes into service.
  grain: one row per unit schedule; this write changes that record
  fields:
    in_service_date: acceptance date
  triggers:
  - event: fleet:fleet_capitalization
    map: {}
- type: fleet_termination_noticed
  target: fleet_units
  mutation:
    transition:
      from: in_service
      to: termination_requested
  meaning: Written termination notice for the unit is received.
  grain: one row per unit schedule; this write changes that record
  fields:
    termination_notice_date: notice date
  triggers: []
- type: fleet_termination_withdrawn
  target: fleet_units
  mutation:
    transition:
      from: termination_requested
      to: in_service
  meaning: The termination notice is withdrawn.
  grain: one row per unit schedule; this write changes that record
  fields:
    termination_notice_date: cleared
  triggers: []
- type: fleet_unit_turned_in
  target: fleet_units
  mutation:
    transition:
      from: termination_requested
      to: off_road
  meaning: The unit is turned in for remarketing.
  grain: one row per unit schedule; this write changes that record
  fields:
    turn_in_date: turn-in date
    turn_in_odometer: odometer
  triggers: []
- type: fleet_unit_recovered
  target: fleet_units
  mutation:
    transition:
      from: defaulted
      to: off_road
  meaning: The unit is recovered after an uncured default.
  grain: one row per unit schedule; this write changes that record
  fields:
    turn_in_date: recovery date
    turn_in_odometer: odometer
  triggers:
  - event: fleet:fleet_unit_charge
    map:
      fee_type: recovery_fee
- type: fleet_unit_sold
  target: fleet_units
  mutation:
    transition:
      from: off_road
      to: sold
  meaning: The unit is sold at auction.
  grain: one row per unit schedule; this write changes that record
  fields:
    sale_date: sale date
  triggers:
  - event: fleet:fleet_sale_settlement
    map: {}
- type: fleet_unit_purchased
  target: fleet_units
  mutation:
    transition:
    - from: in_service
      to: purchased
    - from: termination_requested
      to: purchased
  meaning: The business buys the unit.
  grain: one row per unit schedule; this write changes that record
  fields:
    purchase_date: purchase date
  triggers:
  - event: fleet:fleet_title_transfer
    map: {}
- type: fleet_unit_closed
  target: fleet_units
  mutation:
    transition:
    - from: sold
      to: closed
    - from: purchased
      to: closed
  meaning: The unit schedule closes.
  grain: one row per unit schedule; this write changes that record
  fields:
    closed_date: closing date
  triggers: []
- type: fleet_unit_defaulted
  target: fleet_units
  mutation:
    transition:
      from: in_service
      to: defaulted
  meaning: The unit schedule is declared in default.
  grain: one row per unit schedule; this write changes that record
  fields:
    days_past_due: days past due at default
  triggers: []
- type: fleet_default_cured
  target: fleet_units
  mutation:
    transition:
      from: defaulted
      to: in_service
  meaning: The default is cured and the schedule resumes.
  grain: one row per unit schedule; this write changes that record
  fields:
    days_past_due: 0 after cure
  triggers: []
- type: fleet_capitalization
  target: fleet_transactions
  meaning: The unit's capitalized cost is booked as its opening book value.
  grain: one row per unit
  distinguish_by:
  - txn_date
  fields:
    txn_date: in-service date
    amount: capitalized cost
  account: book_value
  direction: in
  triggers: []
- type: fleet_rental_invoice
  target: fleet_transactions
  meaning: A monthly rental is invoiced for the unit.
  grain: one row per unit per rental month
  distinguish_by:
  - billing_period
  fields:
    txn_date: invoice date
    billing_period: rental month
    invoice_due_date: due date
    amount: total rental invoiced
    depreciation_amount: depreciation
    lease_charge_amount: lease charge
    management_fee_amount: management fee
    sales_tax_amount: sales tax
  account: charges_due
  direction: in
  triggers:
  - event: fleet:fleet_depreciation
    map:
      amount: depreciation_amount
      billing_period: billing_period
      txn_date: txn_date
- type: fleet_depreciation
  target: fleet_transactions
  meaning: The depreciation billed for a month reduces the unit's book value.
  grain: one row per unit per rental month
  distinguish_by:
  - billing_period
  fields:
    txn_date: invoice date
    billing_period: rental month
    amount: depreciation
  account: book_value
  direction: out
  triggers: []
- type: fleet_payment
  target: fleet_transactions
  meaning: A business payment is applied to the unit's charges.
  grain: one row per remittance applied to the unit
  distinguish_by:
  - txn_date
  - remittance_reference
  - amount
  fields:
    txn_date: posting date
    amount: amount applied
    payment_channel: channel
    remittance_reference: remittance reference
    billing_period: invoice month paid
  account: charges_due
  direction: out
  triggers: []
- type: fleet_late_charge
  target: fleet_transactions
  meaning: A late charge is assessed on a past-due rental invoice.
  grain: one row per past-due invoice month
  distinguish_by:
  - billing_period
  fields:
    txn_date: assessment date
    billing_period: invoice month
    amount: late charge
    fee_type: late_charge
  account: charges_due
  direction: in
  triggers: []
- type: fleet_unit_charge
  target: fleet_transactions
  meaning: A one-off unit charge is billed.
  grain: one row per charge type per unit and date
  distinguish_by:
  - fee_type
  - txn_date
  fields:
    txn_date: billing date
    amount: charge
    fee_type: charge type
    miles_over: miles over the allowance
  account: charges_due
  direction: in
  triggers: []
- type: fleet_charge_waiver
  target: fleet_transactions
  meaning: A charge is waived in whole.
  grain: one row per charge waived
  distinguish_by:
  - waived_txn_id
  fields:
    txn_date: waiver date
    amount: amount waived
    waived_txn_id: the charge waived
    waiver_reason: reason
  account: charges_due
  direction: out
  triggers: []
- type: fleet_sale_settlement
  target: fleet_transactions
  meaning: The auction sale is settled against the unit's book value.
  grain: one row per unit sale
  distinguish_by:
  - txn_date
  fields:
    txn_date: settlement date
    amount: book value retired
    gross_sale_proceeds: sale price
    sale_expenses: auction expenses
    trac_result: surplus, deficiency or even
  account: book_value
  direction: out
  triggers:
  - event: fleet:fleet_trac_surplus_credit
    when:
      trac_result: surplus
    map:
      txn_date: txn_date
  - event: fleet:fleet_trac_deficiency_charge
    when:
      trac_result: deficiency
    map:
      txn_date: txn_date
- type: fleet_trac_surplus_credit
  target: fleet_transactions
  meaning: The business's share of a sale surplus is credited.
  grain: one row per unit sale
  distinguish_by:
  - txn_date
  fields:
    txn_date: credit date
    amount: surplus share credited
  account: charges_due
  direction: out
  triggers: []
- type: fleet_trac_deficiency_charge
  target: fleet_transactions
  meaning: A sale shortfall below book value is billed to the business.
  grain: one row per unit sale
  distinguish_by:
  - txn_date
  fields:
    txn_date: billing date
    amount: deficiency billed
  account: charges_due
  direction: in
  triggers: []
- type: fleet_purchase_quote
  target: fleet_transactions
  meaning: A purchase quote is produced for the unit.
  grain: one row per quote
  distinguish_by:
  - txn_date
  fields:
    txn_date: quote date
    amount: purchase price
    sales_tax_amount: sales tax
    quote_good_through_date: good-through date
  triggers: []
- type: fleet_purchase_settlement
  target: fleet_transactions
  meaning: The purchase price is received and the book value retired.
  grain: one row per unit purchase
  distinguish_by:
  - txn_date
  fields:
    txn_date: settlement date
    amount: book value retired
    sales_tax_amount: sales tax collected
  account: book_value
  direction: out
  triggers:
  - event: fleet:fleet_unit_purchased
    map:
      purchase_date: txn_date
- type: fleet_title_transfer
  target: fleet_transactions
  meaning: Title to a purchased unit is transferred to the business.
  grain: one row per title transfer
  distinguish_by:
  - title_transfer_method
  fields:
    txn_date: transfer date
    title_transfer_method: method
  triggers:
  - event: fleet:fleet_unit_closed
    map:
      closed_date: txn_date
- type: fleet_credit_refund
  target: fleet_transactions
  meaning: A credit balance on the unit is refunded to the business.
  grain: one row per refund
  distinguish_by:
  - txn_date
  - amount
  fields:
    txn_date: refund date
    amount: refund
    payment_channel: refund channel
  account: charges_due
  direction: in
  triggers: []
measures:
- id: fleet_msr_active_units
  window: the customer's portfolio as of today
  measure: count of the customer's fleet units in ordered, in_service or termination_requested status plus the customer's
    retail and balloon contracts in active status
- id: fleet_msr_credit_exposure
  window: the customer's portfolio as of today
  measure: sum of capitalized_cost over fleet units in ordered, in_service or termination_requested status plus
    principal_balance over the customer's retail and balloon contracts in active status
- id: fleet_msr_courtesy_waivers_year
  window: the current calendar year to today
  measure: count of fleet_charge_waiver transactions with waiver_reason courtesy_annual on any unit of the same
    master agreement
- id: fleet_msr_past_due_invoice_amount
  window: one rental invoice month of the unit, as of the assessment date
  measure: the fleet_rental_invoice amount for that billing_period less fleet_payment amounts applied to that billing_period
- id: fleet_msr_months_short_of_minimum
  window: the unit as of the turn-in date
  measure: minimum_term_months less months_in_service, never below zero
policies:
- id: fleet_agg_multi_holding
  subject:
  - fleet_unit_ordered
  rule: A business may hold any number of unit schedules under its master lease agreement; the number is limited
    only by the credit line and the program tier rules. Consumer customers cannot hold fleet units.
  eligibility: []
  params:
    max_per_customer: null
- id: fleet_agg_program_tier_and_credit_line
  subject:
  - fleet_unit_ordered
  - fleet_unit_accepted
  rule: The program tier is the tier whose min_fleet_units to max_fleet_units band contains fleet_msr_active_units,
    which counts relationship_unit_counting; the business must also meet min_years_in_business and min_business_credit_score,
    and principals give a personal guaranty where personal_guaranty_required is true. The tier is re-set at the
    annual review in annual_review_month, and a new schedule is written at the tier then in force; schedules already
    written keep their pricing. fleet_msr_credit_exposure plus the capitalized cost of the units ordered must not
    exceed credit_line_limit for the tier, increased by credit_line_overage_tolerance_pct for a single order whose
    units are in transit. One order request may not include more than unit_order_max_per_request units. The master
    agreement may name at most authorized_signers_max authorized signers, and only a named signer can sign acceptance,
    termination and purchase documents.
  eligibility:
  - id: credit_line
    applies_to:
    - fleet_unit_ordered
    kind: authorization
    condition: fleet_msr_credit_exposure plus the capitalized cost of the units ordered must not exceed credit_line_limit
      for the tier, increased by credit_line_overage_tolerance_pct for a single order whose units are in transit.
    evidence_fields:
    - fleet_units.capitalized_cost
    - fleet_units.customer_id
    - retail_contracts.principal_balance
    - balloon_contracts.principal_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_units.customer_id
      action_bindings:
        fleet_units.customer_id: customer_id
  - id: order_size
    applies_to:
    - fleet_unit_ordered
    kind: authorization
    condition: One order request may not include more than unit_order_max_per_request units.
    evidence_fields:
    - fleet_units.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_units.customer_id
      action_bindings:
        fleet_units.customer_id: customer_id
  measures:
  - fleet_msr_active_units
  - fleet_msr_credit_exposure
  params:
