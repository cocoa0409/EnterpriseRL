- id: fleet_unit_pricing
  subject:
  - fleet_unit_ordered
  - fleet_capitalization
  - fleet_rental_invoice
  - fleet_depreciation
  - fleet_unit_charge
  rule: The schedule records monthly_depreciation_pct from monthly_depreciation_pct_by_class for the vehicle class,
    lease_rate_pct and monthly_management_fee for the tier, and a term no longer than max_term_months. upfit_cost
    may not exceed max_upfit_pct_of_cap_cost of chassis_cost, and the TRAC residual may not be lower than trac_residual_min_pct
    of capitalized_cost. Each month's rental is the depreciation, capitalized_cost times monthly_depreciation_pct,
    plus the lease charge, book_value before that month's depreciation times lease_rate_pct divided by 1200, plus
    monthly_management_fee, plus sales tax where the title state taxes rentals. The first rental follows rental_commencement_rule;
    invoices issue on invoice_day and are consolidated per master agreement where consolidated_billing is true.
    The capitalized cost is booked as book value when the unit goes into service, and each month's depreciation
    reduces it; registration renewals are handled for a registration_admin_fee only where registration_renewal_service
    is true, and a lapse below insurance_min_liability coverage brings insurance_lapse_force_place_fee each month
    until proof of coverage is received; unit_substitution_allowed governs whether a unit may be swapped under the
    same schedule.
  eligibility: []
  formula:
    depreciation_amount: round(capitalized_cost * monthly_depreciation_pct / 100, 2)
    lease_charge_amount: round(book_value * lease_rate_pct / 1200, 2)
    amount: depreciation_amount + lease_charge_amount + management_fee_amount + sales_tax_amount
  params:
    per_tier:
      Kestrel Business Advantage:
        lease_rate_pct: =lease_rate_pct
        monthly_management_fee: =monthly_management_fee
        max_term_months: =max_term_months
        max_upfit_pct_of_cap_cost: =max_upfit_pct_of_cap_cost
        consolidated_billing: =consolidated_billing
        registration_renewal_service: =registration_renewal_service
        registration_admin_fee: =registration_admin_fee
        insurance_min_liability: =insurance_min_liability
        unit_substitution_allowed: =unit_substitution_allowed
      Kestrel Fleet Select:
        lease_rate_pct: =lease_rate_pct
        monthly_management_fee: =monthly_management_fee
        max_term_months: =max_term_months
        max_upfit_pct_of_cap_cost: =max_upfit_pct_of_cap_cost
        consolidated_billing: =consolidated_billing
        registration_renewal_service: =registration_renewal_service
        registration_admin_fee: =registration_admin_fee
        insurance_min_liability: =insurance_min_liability
        unit_substitution_allowed: =unit_substitution_allowed
      Kestrel Fleet Preferred:
        lease_rate_pct: =lease_rate_pct
        monthly_management_fee: =monthly_management_fee
        max_term_months: =max_term_months
        max_upfit_pct_of_cap_cost: =max_upfit_pct_of_cap_cost
        consolidated_billing: =consolidated_billing
        registration_renewal_service: =registration_renewal_service
        registration_admin_fee: =registration_admin_fee
        insurance_min_liability: =insurance_min_liability
        unit_substitution_allowed: =unit_substitution_allowed
      Kestrel Fleet Premier:
        lease_rate_pct: =lease_rate_pct
        monthly_management_fee: =monthly_management_fee
        max_term_months: =max_term_months
        max_upfit_pct_of_cap_cost: =max_upfit_pct_of_cap_cost
        consolidated_billing: =consolidated_billing
        registration_renewal_service: =registration_renewal_service
        registration_admin_fee: =registration_admin_fee
        insurance_min_liability: =insurance_min_liability
        unit_substitution_allowed: =unit_substitution_allowed
      Kestrel Fleet Enterprise:
        lease_rate_pct: =lease_rate_pct
        monthly_management_fee: =monthly_management_fee
        max_term_months: =max_term_months
        max_upfit_pct_of_cap_cost: =max_upfit_pct_of_cap_cost
        consolidated_billing: =consolidated_billing
        registration_renewal_service: =registration_renewal_service
        registration_admin_fee: =registration_admin_fee
        insurance_min_liability: =insurance_min_liability
        unit_substitution_allowed: =unit_substitution_allowed
      Kestrel National Fleet:
        lease_rate_pct: =lease_rate_pct
        monthly_management_fee: =monthly_management_fee
        max_term_months: =max_term_months
        max_upfit_pct_of_cap_cost: =max_upfit_pct_of_cap_cost
        consolidated_billing: =consolidated_billing
        registration_renewal_service: =registration_renewal_service
        registration_admin_fee: =registration_admin_fee
        insurance_min_liability: =insurance_min_liability
        unit_substitution_allowed: =unit_substitution_allowed
    monthly_depreciation_pct_by_class: =monthly_depreciation_pct_by_class
    trac_residual_min_pct: =trac_residual_min_pct
    invoice_day: =invoice_day
    rental_commencement_rule: =rental_commencement_rule
    insurance_lapse_force_place_fee: =insurance_lapse_force_place_fee
- id: fleet_delivery_acceptance
  subject:
  - fleet_unit_accepted
  rule: Acceptance takes effect only when a named authorized signer has completed the delivery acceptance request
    for the unit. The delivery and acceptance certificate must be signed no later than delivery_acceptance_days
    after the unit was delivered. The period is counted in calendar days starting the day after delivery_date, and
    signing on the last day is timely. A unit not accepted within the period stays ordered and the dealer is not
    paid until the business either accepts it or rejects it in writing.
  eligibility:
  - id: signer
    applies_to:
    - fleet_unit_accepted
    kind: authorization
    condition: Acceptance takes effect only when a named authorized signer has completed the delivery acceptance
      request for the unit.
    evidence_fields:
    - fleet_requests.request_type
    - fleet_requests.request_status
    - fleet_requests.fleet_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_requests.fleet_request_id
      action_bindings:
        fleet_requests.fleet_request_id: fleet_request_id
  - id: accept_window
    applies_to:
    - fleet_unit_accepted
    kind: time
    condition: The delivery and acceptance certificate must be signed no later than delivery_acceptance_days after
      the unit was delivered.
    evidence_fields:
    - fleet_units.delivery_date
    - fleet_units.fleet_unit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_units.fleet_unit_id
      action_bindings:
        fleet_units.fleet_unit_id: fleet_unit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the unit was delivered
      anchor_source: fleet_units.delivery_date
      relation: not_after
      duration_source: variants.delivery_acceptance_days
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after delivery_date, and signing on
        the last day is timely.
      boundary: inclusive
  params:
    delivery_acceptance_days: =delivery_acceptance_days
- id: fleet_billing_and_payments
  subject:
  - fleet_payment
  - fleet_late_charge
  - fleet_credit_refund
  rule: A business payment can be applied only while the unit status is in_service, termination_requested, off_road,
    sold, purchased or defaulted. Business payments are accepted only through accepted_payment_channels; card payments
    are not accepted. A payment received before payment_cutoff_time_ct Central Time on a business day posts that
    day, and is applied to the oldest unpaid invoice month first unless the remittance names the months it pays.
    Rental invoices are due payment_terms_days calendar days after the invoice date for the tier. A late charge
    may be assessed only after late_charge_grace_days have fully elapsed from the invoice due date. The invoice
    due date is the invoice_due_date on the rental invoice, which is the invoice date plus payment_terms_days calendar
    days; the grace is counted in calendar days starting the day after invoice_due_date, so the first permissible
    assessment date is the calendar day after invoice_due_date plus late_charge_grace_days. Only one late charge
    may be assessed for the same unit and invoice month. The late charge is late_charge_pct_of_past_due percent
    of fleet_msr_past_due_invoice_amount, but never less than late_charge_min. A credit balance left on a unit after
    it closes is refunded within refund_days calendar days.
  eligibility:
  - id: pay_status
    applies_to:
    - fleet_payment
    kind: state
    condition: A business payment can be applied only while the unit status is in_service, termination_requested,
      off_road, sold, purchased or defaulted.
    evidence_fields:
    - fleet_units.status
