      Kestrel Fleet Enterprise:
        default_days_past_due: =default_days_past_due
      Kestrel National Fleet:
        default_days_past_due: =default_days_past_due
    default_cure_requires_all_units: =default_cure_requires_all_units
    recovery_fee: =recovery_fee
extended_policies:
- id: fleet_ext_closed_end_termination_charge
  base_policy_refs:
  - fleet_termination
  - fleet_unit_pricing
  - fleet_default_and_recovery
  overwrite:
  - base_policy: fleet_termination
    superseded_clause: A closed-end commercial unit ended before scheduled_end_date is billed closed_end_early_termination_fee;
    replaced_by: For a closed-end commercial unit whose lease ended before its scheduled end date by a turn-in or by a recovery after an uncured default, and only for such a unit, the early termination charge billed is figured as this policy states; a closed-end commercial unit ended before its scheduled end date by a purchase is billed closed_end_early_termination_fee, as before, and this policy's figure does not apply to it.
  trigger: state_due
  subject:
  - fleet_unit_charge
  computes: amount
  target_tool: bill_early_termination_18cdd752
  params:
    short_remaining_multiplier: 0.5
    short_remaining_months: 6
    mid_remaining_months: 11
    months_per_year: 12
    upfit_load_medium_duty: 1.25
    upfit_load_vocational: 1.1
    upfit_share_threshold_pct: 10
    upfit_window_months: 36
    notice_long_days: 50
    notice_mid_days: 40
    notice_credit_long: 150.0
    notice_credit_mid: 75.0
    relationship_credit_both: 200.0
    relationship_credit_one: 100.0
    usage_high_miles_per_day: 82
    usage_mid_miles_per_day: 66
    usage_addition_high: 150.0
    usage_addition_mid: 75.0
    care_credit_upper: 120.0
    care_credit_platinum: 60.0
  rule: 'For a closed-end commercial unit whose lease ended before its scheduled end date by a turn-in or by a recovery after an uncured default, and only for such a unit, the early termination charge billed is figured as this policy states; a closed-end commercial unit ended before its scheduled end date by a purchase is billed closed_end_early_termination_fee, as before, and this policy''s figure does not apply to it. The turn-in date read below is the date the unit was turned in or recovered, as the unit records it. Whole months between two dates are counted from the earlier date to the later one and are one fewer where the later date''s day of the month is smaller than the earlier date''s; days between two dates count the later date but not the earlier one. The early termination charge starts from the termination fee, which is closed_end_early_termination_fee for the tier. The early termination charge is the termination fee, rounded to the nearest cent. A schedule below that replaces
    a standard figure applies first; any multiplier then applies to the charge so far; any credit is then subtracted, never taking the charge below zero; any addition comes last; and the charge is rounded to the nearest cent once, at the end. The termination fee follows the whole months remaining from the turn-in date to the scheduled end date: where 6 or fewer months remain, the termination fee is half of closed_end_early_termination_fee; where 7 to 11 months remain, it is closed_end_early_termination_fee times the months remaining divided by 12; where 12 or more months remain, it is closed_end_early_termination_fee. The termination upfit multiplier is 1.25 for a medium-duty chassis turned in fewer than 36 whole months after its in-service date, 1.10 for a unit of any other class whose upfit cost is more than 10 percent of its chassis cost and that was turned in fewer than 36 whole months after its in-service date, and 1 for every other unit. The termination notice credit is $150 where
    the written termination notice was received 50 or more days before the turn-in date, $75 where it was received 40 to 49 days before the turn-in date, and nothing where it was received fewer than 40 days before or no termination notice is recorded on the unit. The termination relationship credit is $200 where the business holds both an active Kestrel New Vehicle Retail Installment Sale Contract and an active Kestrel Advantage Balloon contract, $100 where it holds exactly one of the two, and nothing where it holds neither. The termination usage addition is $150 where the miles driven, the turn-in odometer less the odometer at delivery, exceed 82 miles for each day from the in-service date to the turn-in date, $75 where they exceed 66 but not 82 miles for each such day, and nothing where they do not exceed 66 miles a day. The termination maintenance credit is $120 where the unit''s VIN is covered by an active Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract, $60 where
    it is covered by an active Kestrel Care Platinum contract but by no active Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract, and nothing where no active Kestrel Care Platinum, Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract covers it.'
  prerequisite: []
  cross_category:
  - category: retail
    as: existence
    reads:
    - status
    note: The termination relationship credit tier turns on whether the business holds an active Kestrel New Vehicle Retail Installment Sale Contract.
  - category: balloon
    as: existence
    reads:
    - status
    note: The termination relationship credit tier turns on whether the business holds an active balloon contract.
  - category: care
    as: branch
    reads:
    - status
    - variant_name
    - vin
    note: The termination maintenance credit tier is read from the plan of any active Kestrel Care contract covering the unit's VIN.
  compute:
  - et_months_left: MONTHS(F('turn_in_date'), F('scheduled_end_date'))
  - et_fee: P('closed_end_early_termination_fee') * K('short_remaining_multiplier') if et_months_left <= K('short_remaining_months') else (P('closed_end_early_termination_fee') * et_months_left / K('months_per_year') if et_months_left <= K('mid_remaining_months') else P('closed_end_early_termination_fee'))
  - et_upfit_load: K('upfit_load_medium_duty') if F('vehicle_class') == 'medium_duty_chassis' and MONTHS(F('in_service_date'), F('turn_in_date')) < K('upfit_window_months') else (K('upfit_load_vocational') if F('upfit_cost') * 100 > K('upfit_share_threshold_pct') * F('chassis_cost') and MONTHS(F('in_service_date'), F('turn_in_date')) < K('upfit_window_months') else 1)
  - et_notice_credit: K('notice_credit_long') if F('termination_notice_date') != '' and DAYS(F('termination_notice_date'), F('turn_in_date')) >= K('notice_long_days') else (K('notice_credit_mid') if F('termination_notice_date') != '' and DAYS(F('termination_notice_date'), F('turn_in_date')) >= K('notice_mid_days') else 0)
  - et_relationship_credit: K('relationship_credit_both') if EXISTS('retail', status='active') and EXISTS('balloon', status='active') else (K('relationship_credit_one') if EXISTS('retail', status='active') or EXISTS('balloon', status='active') else 0)
  - et_usage_addition: K('usage_addition_high') if F('turn_in_odometer') - F('odometer_at_delivery') > K('usage_high_miles_per_day') * DAYS(F('in_service_date'), F('turn_in_date')) else (K('usage_addition_mid') if F('turn_in_odometer') - F('odometer_at_delivery') > K('usage_mid_miles_per_day') * DAYS(F('in_service_date'), F('turn_in_date')) else 0)
  - et_care_credit: K('care_credit_upper') if EXISTS('care', vin=F('vin'), status='active', variant_name='Kestrel Care Platinum Plus') or EXISTS('care', vin=F('vin'), status='active', variant_name='Kestrel Care Platinum Elite') else (K('care_credit_platinum') if EXISTS('care', vin=F('vin'), status='active', variant_name='Kestrel Care Platinum') else 0)
  - result: RND(MX(0, et_fee * et_upfit_load - et_notice_credit - et_relationship_credit - et_care_credit) + et_usage_addition, 2)
  compute_basis:
    et_months_left: The termination fee follows the whole months remaining from the turn-in date to the scheduled end date
    et_fee: where 6 or fewer months remain, the termination fee is half of closed_end_early_termination_fee; where 7 to 11 months remain, it is closed_end_early_termination_fee times the months remaining divided by 12; where 12 or more months remain, it is closed_end_early_termination_fee.
    et_upfit_load: The termination upfit multiplier is 1.25 for a medium-duty chassis turned in fewer than 36 whole months after its in-service date, 1.10 for a unit of any other class whose upfit cost is more than 10 percent of its chassis cost and that was turned in fewer than 36 whole months after its in-service date, and 1 for every other unit.
    et_notice_credit: The termination notice credit is $150 where the written termination notice was received 50 or more days before the turn-in date, $75 where it was received 40 to 49 days before the turn-in date, and nothing where it was received fewer than 40 days before or no termination notice is recorded on the unit.
    et_relationship_credit: The termination relationship credit is $200 where the business holds both an active Kestrel New Vehicle Retail Installment Sale Contract and an active Kestrel Advantage Balloon contract, $100 where it holds exactly one of the two, and nothing where it holds neither.
    et_usage_addition: The termination usage addition is $150 where the miles driven, the turn-in odometer less the odometer at delivery, exceed 82 miles for each day from the in-service date to the turn-in date, $75 where they exceed 66 but not 82 miles for each such day, and nothing where they do not exceed 66 miles a day.
    et_care_credit: The termination maintenance credit is $120 where the unit's VIN is covered by an active Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract, $60 where it is covered by an active Kestrel Care Platinum contract but by no active Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract, and nothing where no active Kestrel Care Platinum, Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract covers it.
    result: A schedule below that replaces a standard figure applies first; any multiplier then applies to the charge so far; any credit is then subtracted, never taking the charge below zero; any addition comes last; and the charge is rounded to the nearest cent once, at the end.
  factors:
  - id: et_remaining_term_basis
    effect: method
    decides: et_fee
    bindings:
    - et_months_left
    - et_fee
    ladder:
    - when: 6 or fewer whole months remain from the turn-in date to the scheduled end date
      method: the termination fee is half of closed_end_early_termination_fee
    - when: 7 to 11 whole months remain from the turn-in date to the scheduled end date
      method: the termination fee is closed_end_early_termination_fee times the months remaining divided by 12
    - when: otherwise (12 or more whole months remain)
      method: the termination fee is closed_end_early_termination_fee
    baseline:
      et_fee: P('closed_end_early_termination_fee')
    evidence:
    - date
    cross_difficulty: null
  - id: et_upfit_load_schedule
    effect: parameter
    decides: et_upfit_load
    bindings:
    - et_upfit_load
    ladder:
    - when: a medium-duty chassis turned in fewer than 36 whole months after its in-service date
      value: K('upfit_load_medium_duty')
    - when: a unit of any other class whose upfit cost is more than 10 percent of its chassis cost, turned in fewer than 36 whole months after its in-service date
      value: K('upfit_load_vocational')
    - when: otherwise
      value: '1'
    baseline:
      et_upfit_load: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: et_notice_lead_credit
    effect: parameter
    decides: et_notice_credit
    bindings:
    - et_notice_credit
    ladder:
    - when: the written termination notice was received 50 or more days before the turn-in date
      value: K('notice_credit_long')
    - when: the written termination notice was received 40 to 49 days before the turn-in date
      value: K('notice_credit_mid')
    - when: otherwise (fewer than 40 days before, or no notice recorded)
      value: '0'
    baseline:
      et_notice_credit: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: et_relationship_holdings_credit
    effect: parameter
    decides: et_relationship_credit
    bindings:
    - et_relationship_credit
    ladder:
    - when: the business holds an active Kestrel New Vehicle Retail Installment Sale Contract and an active Kestrel Advantage Balloon contract
      value: K('relationship_credit_both')
    - when: the business holds exactly one of an active Kestrel New Vehicle Retail Installment Sale Contract or an active balloon contract
      value: K('relationship_credit_one')
    - when: otherwise (neither)
      value: '0'
    baseline:
      et_relationship_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: retail
  - id: et_usage_intensity_addition
    effect: parameter
    decides: et_usage_addition
    bindings:
    - et_usage_addition
    ladder:
    - when: miles driven exceed 82 for each day from the in-service date to the turn-in date
      value: K('usage_addition_high')
    - when: miles driven exceed 66 but not 82 for each such day
      value: K('usage_addition_mid')
    - when: otherwise (no more than 66 miles a day)
      value: '0'
    baseline:
      et_usage_addition: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: et_care_coverage_credit
    effect: parameter
    decides: et_care_credit
    bindings:
    - et_care_credit
    ladder:
    - when: the unit's VIN is covered by an active Kestrel Care Platinum Plus or Platinum Elite contract
      value: K('care_credit_upper')
    - when: the unit's VIN is covered by an active Kestrel Care Platinum contract and by no active Platinum Plus or Platinum Elite contract
      value: K('care_credit_platinum')
    - when: otherwise (no active Kestrel Care Platinum, Platinum Plus or Platinum Elite contract covers the VIN)
      value: '0'
    baseline:
      et_care_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: care
  baseline:
    rule: The early termination charge starts from the termination fee, which is closed_end_early_termination_fee for the tier. The early termination charge is the termination fee, rounded to the nearest cent.
    params:
    - closed_end_early_termination_fee
  inputs:
    history: []
    cross_category:
    - retail
    - balloon
    - care
- id: fleet_ext_closed_end_mileage_charge
  base_policy_refs:
  - fleet_termination
  - fleet_unit_pricing
  - fleet_default_and_recovery
  overwrite:
  - base_policy: fleet_termination
    superseded_clause: at any end it is billed excess mileage at closed_end_excess_mileage_rate_by_class for miles above annual_mileage_allowance times months_in_service divided by 12
    replaced_by: For the excess mileage charge billed on a closed-end commercial unit whose lease ended by a turn-in or by a recovery after an uncured default, and only for that charge, the charge is figured as this policy states; a closed-end commercial unit ended by a purchase is billed excess mileage at closed_end_excess_mileage_rate_by_class for miles above annual_mileage_allowance times months_in_service divided by 12, as before, and this policy's figure does not apply to it; the wear charges of a closed-end unit remain under the base rule.
  trigger: state_due
  subject:
  - fleet_unit_charge
  computes: amount
  target_tool: bill_excess_mileage_e7ed45ad
  params:
    days_per_year: 365
    months_per_year: 12
    class_rate_standard: 0.25
    class_rate_sedan: 0.2
    class_rate_medium_duty: 0.35
    relationship_miles_long: 2000
    relationship_miles_mid: 1000
    relationship_long_months: 36
    relationship_mid_months: 12
    rate_reduction_full: 0.05
    rate_reduction_balloon: 0.03
    young_unit_months: 24
    mid_age_unit_months: 36
    age_addition_young: 0.05
    age_addition_mid: 0.02
    maintenance_multiplier_upper: 0.9
    maintenance_multiplier_platinum: 0.95
  rule: 'For the excess mileage charge billed on a closed-end commercial unit whose lease ended by a turn-in or by a recovery after an uncured default, and only for that charge, the charge is figured as this policy states; a closed-end commercial unit ended by a purchase is billed excess mileage at closed_end_excess_mileage_rate_by_class for miles above annual_mileage_allowance times months_in_service divided by 12, as before, and this policy''s figure does not apply to it; the wear charges of a closed-end unit remain under the base rule. The turn-in date and turn-in odometer read below are those the unit records for its turn-in or recovery. Whole months between two dates are counted from the earlier date to the later one and are one fewer where the later date''s day of the month is smaller than the earlier date''s; days between two dates count the later date but not the earlier one; a posting falls within the last N whole months when fewer than N whole months separate its date from today.
    The miles driven are the turn-in odometer less the odometer at delivery. The miles over are the miles driven less the mileage allowance earned, never below zero. The mileage allowance earned is annual_mileage_allowance times months_in_service divided by 12. The class rate is the rate for the unit''s vehicle class in closed_end_excess_mileage_rate_by_class: $0.25 a mile for a light-duty pickup, cargo van, passenger van or SUV, $0.20 a mile for a sedan and $0.35 a mile for a medium-duty chassis. The excess mileage charge is the priced amount, the miles over times the class rate, rounded to the nearest cent. Every adjustment below acts on the quantity it names, in the order those quantities are figured: first the miles over, then the per-mile rate, then the priced amount; the charge is rounded to the nearest cent once, at the end. The mileage allowance earned is figured by the days in service for a unit turned in before its scheduled end date after at least minimum_term_months whole months
    in service, as annual_mileage_allowance times the days from the in-service date to the turn-in date divided by 365; for a unit turned in on or after its scheduled end date it is annual_mileage_allowance times term_months divided by 12; every other unit earns annual_mileage_allowance times months_in_service divided by 12. The miles over are reduced by the mileage relationship allowance, never below zero: 2,000 miles where the business has a Kestrel New Vehicle Retail Installment Sale Contract, open or closed, funded 36 or more whole months before today, 1,000 miles where its earliest-funded Kestrel New Vehicle Retail Installment Sale Contract was funded 12 to 35 whole months before today, and none where it has no Kestrel New Vehicle Retail Installment Sale Contract funded at least 12 whole months before today. The class rate is reduced by the mileage rate reduction: $0.05 a mile where the business holds an active Kestrel Advantage Balloon contract with no days past due and an active Kestrel
    New Vehicle Retail Installment Sale Contract with no days past due, $0.03 a mile where it holds an active balloon contract with no days past due but no active Kestrel New Vehicle Retail Installment Sale Contract with no days past due, and nothing where it holds no active balloon contract with no days past due. The class rate is increased by the mileage unit-age addition: $0.05 a mile where the unit was turned in fewer than 24 whole months after its in-service date, $0.02 a mile where it was turned in 24 to 35 whole months after its in-service date, and nothing where it was turned in 36 or more whole months after it. The priced amount is multiplied by the mileage maintenance multiplier: 0.90 where the unit''s VIN is covered by an active Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract, 0.95 where it is covered by an active Kestrel Care Platinum contract but by no active Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract, and 1 where no active Kestrel
    Care Platinum, Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract covers it.'
  prerequisite: []
  cross_category:
  - category: retail
    as: history
    reads:
    - status
    - days_past_due
    - retail_transactions.event_type
    - retail_transactions.txn_date
    note: The mileage relationship allowance tier is read from the funding dates of the business's retail contracts, and the rate reduction tier from whether an active retail contract has no days past due.
  - category: balloon
    as: existence
    reads:
    - status
    - days_past_due
    note: The mileage rate reduction tier turns on whether the business holds an active balloon contract with no days past due.
  - category: care
    as: existence
    reads:
    - status
    - variant_name
    - vin
    note: The mileage maintenance multiplier tier is read from the plan of any active Kestrel Care contract covering the unit's VIN.
  compute:
  - em_driven: F('turn_in_odometer') - F('odometer_at_delivery')
  - em_class_rate: K('class_rate_sedan') if F('vehicle_class') == 'sedan' else (K('class_rate_medium_duty') if F('vehicle_class') == 'medium_duty_chassis' else K('class_rate_standard'))
  - em_allowance: F('annual_mileage_allowance') * DAYS(F('in_service_date'), F('turn_in_date')) / K('days_per_year') if DAYS(F('turn_in_date'), F('scheduled_end_date')) > 0 and MONTHS(F('in_service_date'), F('turn_in_date')) >= P('minimum_term_months') else (F('annual_mileage_allowance') * F('term_months') / K('months_per_year') if DAYS(F('turn_in_date'), F('scheduled_end_date')) <= 0 else F('annual_mileage_allowance') * F('months_in_service') / K('months_per_year'))
  - em_relationship_miles: K('relationship_miles_long') if XCOUNT('retail', 'retail_transactions', event_type='retail_funding') - XCOUNT('retail', 'retail_transactions', within_months=K('relationship_long_months'), date_field='txn_date', event_type='retail_funding') >= 1 else (K('relationship_miles_mid') if XCOUNT('retail', 'retail_transactions', event_type='retail_funding') - XCOUNT('retail', 'retail_transactions', within_months=K('relationship_mid_months'), date_field='txn_date', event_type='retail_funding') >= 1 else 0)
  - em_rate_reduction: K('rate_reduction_full') if EXISTS('balloon', status='active', days_past_due=0) and EXISTS('retail', status='active', days_past_due=0) else (K('rate_reduction_balloon') if EXISTS('balloon', status='active', days_past_due=0) and not EXISTS('retail', status='active', days_past_due=0) else 0)
  - em_age_addition: K('age_addition_young') if MONTHS(F('in_service_date'), F('turn_in_date')) < K('young_unit_months') else (K('age_addition_mid') if MONTHS(F('in_service_date'), F('turn_in_date')) < K('mid_age_unit_months') else 0)
  - em_maintenance: K('maintenance_multiplier_upper') if EXISTS('care', vin=F('vin'), status='active', variant_name='Kestrel Care Platinum Plus') or EXISTS('care', vin=F('vin'), status='active', variant_name='Kestrel Care Platinum Elite') else (K('maintenance_multiplier_platinum') if EXISTS('care', vin=F('vin'), status='active', variant_name='Kestrel Care Platinum') else 1)
  - result: RND(MX(0, em_driven - em_allowance - em_relationship_miles) * (em_class_rate - em_rate_reduction + em_age_addition) * em_maintenance, 2)
  compute_basis:
    em_driven: The miles driven are the turn-in odometer less the odometer at delivery.
    em_class_rate: 'The class rate is the rate for the unit''s vehicle class in closed_end_excess_mileage_rate_by_class: $0.25 a mile for a light-duty pickup, cargo van, passenger van or SUV, $0.20 a mile for a sedan and $0.35 a mile for a medium-duty chassis.'
    em_allowance: The mileage allowance earned is figured by the days in service for a unit turned in before its scheduled end date after at least minimum_term_months whole months in service, as annual_mileage_allowance times the days from the in-service date to the turn-in date divided by 365; for a unit turned in on or after its scheduled end date it is annual_mileage_allowance times term_months divided by 12; every other unit earns annual_mileage_allowance times months_in_service divided by 12.
    em_relationship_miles: 'The miles over are reduced by the mileage relationship allowance, never below zero: 2,000 miles where the business has a Kestrel New Vehicle Retail Installment Sale Contract, open or closed, funded 36 or more whole months before today, 1,000 miles where its earliest-funded Kestrel New Vehicle Retail Installment Sale Contract was funded 12 to 35 whole months before today, and none where it has no Kestrel New Vehicle Retail Installment Sale Contract funded at least 12 whole months before today.'
    em_rate_reduction: 'The class rate is reduced by the mileage rate reduction: $0.05 a mile where the business holds an active Kestrel Advantage Balloon contract with no days past due and an active Kestrel New Vehicle Retail Installment Sale Contract with no days past due, $0.03 a mile where it holds an active balloon contract with no days past due but no active Kestrel New Vehicle Retail Installment Sale Contract with no days past due, and nothing where it holds no active balloon contract with no days past due.'
    em_age_addition: 'The class rate is increased by the mileage unit-age addition: $0.05 a mile where the unit was turned in fewer than 24 whole months after its in-service date, $0.02 a mile where it was turned in 24 to 35 whole months after its in-service date, and nothing where it was turned in 36 or more whole months after it.'
    em_maintenance: 'The priced amount is multiplied by the mileage maintenance multiplier: 0.90 where the unit''s VIN is covered by an active Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract, 0.95 where it is covered by an active Kestrel Care Platinum contract but by no active Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract, and 1 where no active Kestrel Care Platinum, Kestrel Care Platinum Plus or Kestrel Care Platinum Elite contract covers it.'
    result: 'Every adjustment below acts on the quantity it names, in the order those quantities are figured: first the miles over, then the per-mile rate, then the priced amount; the charge is rounded to the nearest cent once, at the end.'
  factors:
  - id: em_allowance_proration
    effect: method
    decides: em_allowance
    bindings:
    - em_allowance
    ladder:
    - when: turned in before the scheduled end date after at least minimum_term_months whole months in service
      method: annual_mileage_allowance times the days from the in-service date to the turn-in date divided by 365
    - when: turned in on or after the scheduled end date
      method: annual_mileage_allowance times term_months divided by 12
    - when: otherwise (turned in early within minimum_term_months)
      method: annual_mileage_allowance times months_in_service divided by 12
    baseline:
      em_allowance: F('annual_mileage_allowance') * F('months_in_service') / K('months_per_year')
    evidence:
    - date
    cross_difficulty: null
  - id: em_relationship_free_miles
    effect: parameter
    decides: em_relationship_miles
    bindings:
    - em_relationship_miles
    ladder:
    - when: a Kestrel New Vehicle Retail Installment Sale Contract, open or closed, funded 36 or more whole months before today
      value: K('relationship_miles_long')
    - when: the earliest-funded Kestrel New Vehicle Retail Installment Sale Contract funded 12 to 35 whole months before today
      value: K('relationship_miles_mid')
    - when: otherwise (no Kestrel New Vehicle Retail Installment Sale Contract funded at least 12 whole months ago)
      value: '0'
    baseline:
      em_relationship_miles: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: retail
  - id: em_rate_relief
    effect: parameter
    decides: em_rate_reduction
    bindings:
    - em_rate_reduction
    ladder:
    - when: an active balloon contract with no days past due and an active Kestrel New Vehicle Retail Installment Sale Contract with no days past due
      value: K('rate_reduction_full')
    - when: an active balloon contract with no days past due and no active Kestrel New Vehicle Retail Installment Sale Contract with no days past due
      value: K('rate_reduction_balloon')
    - when: otherwise (no active balloon contract with no days past due)
      value: '0'
    baseline:
      em_rate_reduction: '0'
    evidence:
    - cross_category
    cross_difficulty: balloon
  - id: em_unit_age_addition
    effect: parameter
    decides: em_age_addition
    bindings:
    - em_age_addition
    ladder:
    - when: turned in fewer than 24 whole months after the in-service date
      value: K('age_addition_young')
    - when: turned in 24 to 35 whole months after the in-service date
      value: K('age_addition_mid')
    - when: otherwise (36 or more whole months)
      value: '0'
    baseline:
      em_age_addition: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: em_maintained_unit_scale
    effect: parameter
    decides: em_maintenance
    bindings:
    - em_maintenance
    ladder:
    - when: the VIN is covered by an active Kestrel Care Platinum Plus or Platinum Elite contract
      value: K('maintenance_multiplier_upper')
    - when: the VIN is covered by an active Kestrel Care Platinum contract and by no active Platinum Plus or Platinum Elite contract
      value: K('maintenance_multiplier_platinum')
    - when: otherwise (no active Kestrel Care Platinum, Platinum Plus or Platinum Elite contract covers the VIN)
      value: '1'
    baseline:
      em_maintenance: '1'
    evidence:
    - cross_category
    cross_difficulty: care
  baseline:
    rule: 'The miles driven are the turn-in odometer less the odometer at delivery. The miles over are the miles driven less the mileage allowance earned, never below zero. The mileage allowance earned is annual_mileage_allowance times months_in_service divided by 12. The class rate is the rate for the unit''s vehicle class in closed_end_excess_mileage_rate_by_class: $0.25 a mile for a light-duty pickup, cargo van, passenger van or SUV, $0.20 a mile for a sedan and $0.35 a mile for a medium-duty chassis. The excess mileage charge is the priced amount, the miles over times the class rate, rounded to the nearest cent.'
    params:
    - closed_end_excess_mileage_rate_by_class
    - class_rate_standard
    - class_rate_sedan
    - class_rate_medium_duty
  inputs:
    history:
    - category: retail
      table: retail_transactions
      aggregate: count
      field: retail_txn_id
      filters:
        event_type: retail_funding
    cross_category:
    - retail
    - balloon
    - care
- id: fleet_ext_latest_month_late_charge
  base_policy_refs:
  - fleet_billing_and_payments
  overwrite:
  - base_policy: fleet_billing_and_payments
    superseded_clause: The late charge is late_charge_pct_of_past_due percent of fleet_msr_past_due_invoice_amount, but never less than late_charge_min.
    replaced_by: For the late charge assessed on a unit's most recent rental invoice month, and only for that month, the charge is figured as this policy states; a late charge on any earlier invoice month is late_charge_pct_of_past_due percent of fleet_msr_past_due_invoice_amount, but never less than late_charge_min, as before.
  trigger: state_due
  subject:
  - fleet_late_charge
  computes: amount
  target_tool: assess_late_charge_6db1a799
  params:
    percent: 100
    final_month_days: 30
    rate_relationship_clean: 1.0
    rate_relationship_repeat: 1.25
    minimum_long_tenure: 15.0
    minimum_mid_tenure: 20.0
    long_tenure_months: 24
    mid_tenure_months: 12
    lateness_long_days: 30
    lateness_mid_days: 15
    lateness_multiplier_long: 1.25
    lateness_multiplier_mid: 1.1
    wind_down_turned_in: 0.75
    wind_down_noticed: 0.9
    delinquency_window_months: 6
    delinquency_addition_high: 15.0
    delinquency_addition_mid: 10.0
  rule: 'For the late charge assessed on a unit''s most recent rental invoice month, and only for that month, the charge is figured as this policy states; a late charge on any earlier invoice month is late_charge_pct_of_past_due percent of fleet_msr_past_due_invoice_amount, but never less than late_charge_min, as before. Whole months between two dates are counted from the earlier date to the later one and are one fewer where the later date''s day of the month is smaller than the earlier date''s; days between two dates count the later date but not the earlier one; a posting falls within the last N whole months when fewer than N whole months separate its date from today. The most recent rental invoice is the unit''s rental invoice with the latest invoice date; where two share that date, the one posted first is used. The business payments applied to an invoice month are the payments the unit''s ledger records against that month, each payment being recorded against the month it was applied to
    when it posted; a payment recorded against no invoice month is not counted. The late-charge base is the most recent rental invoice amount less the business payments applied to that invoice month, never below zero. The late-charge rate is late_charge_pct_of_past_due for the tier, and the late-charge minimum is late_charge_min for the tier. The late charge is the late-charge base times the late-charge rate divided by 100, but never less than the late-charge minimum, rounded to the nearest cent. A schedule below that replaces a standard figure applies first; any multiplier then applies to the charge after the minimum; any addition comes last; and the charge is rounded to the nearest cent once, at the end. The late-charge base is figured from the parts of the invoice: for an invoice dated on or before the turn-in date and no more than 30 days before it, it is that invoice''s depreciation and lease charge less the business payments applied to that month; for any other invoice that carries
    sales tax, it is the invoice amount less its sales tax and less the business payments applied to that month; for any other invoice that carries no sales tax, it is the invoice amount less the business payments applied to that month; in every case never below zero. The late-charge rate is 1.00 percent where the business holds an active Kestrel Advantage Balloon contract with no days past due and the unit''s ledger shows no late charge posted within the last 12 whole months, 1.25 percent where it holds such a balloon contract and the unit''s ledger shows one or more late charges posted within the last 12 whole months, and late_charge_pct_of_past_due where it holds no active balloon contract with no days past due. The late-charge minimum is $15 where the unit has been in service 24 or more whole months, counted from its in-service date to today, $20 where it has been in service 12 to 23 whole months, and late_charge_min where it has been in service fewer than 12 whole months. The charge
    after the minimum is multiplied by the late-charge lateness multiplier: 1.25 where 30 or more days have passed since the invoice due date, 1.10 where 15 to 29 days have passed, and 1 where fewer than 15 days have passed. The charge after the minimum is multiplied by the late-charge wind-down multiplier: 0.75 where the written termination notice for the unit was received before the invoice date and the unit has since been turned in, 0.90 where the notice was received before the invoice date and the unit has not been turned in, and 1 where no termination notice was received before the invoice date. A late-charge delinquency addition is added: $15 where two or more late charges were posted on the business''s Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months, $10 where exactly one was, and nothing where none was.'
  prerequisite: []
  cross_category:
  - category: balloon
    as: branch
    reads:
    - status
    - days_past_due
    note: The late-charge rate tier turns on whether the business holds an active balloon contract with no days past due.
  - category: retail
    as: history
    reads:
    - retail_transactions.event_type
    - retail_transactions.txn_date
    note: The late-charge delinquency addition tier is read from the count of retail late charges posted on the business's retail contracts within the last 6 whole months.
  compute:
  - lc_inv_date: LATEST('fleet_transactions', 'txn_date', date_field='txn_date', event_type='fleet_rental_invoice')
  - lc_inv_period: LATEST('fleet_transactions', 'billing_period', date_field='txn_date', event_type='fleet_rental_invoice')
  - lc_inv_amount: LATEST('fleet_transactions', 'amount', date_field='txn_date', event_type='fleet_rental_invoice')
  - lc_inv_tax: LATEST('fleet_transactions', 'sales_tax_amount', date_field='txn_date', event_type='fleet_rental_invoice')
  - lc_inv_dep: LATEST('fleet_transactions', 'depreciation_amount', date_field='txn_date', event_type='fleet_rental_invoice')
  - lc_inv_lease: LATEST('fleet_transactions', 'lease_charge_amount', date_field='txn_date', event_type='fleet_rental_invoice')
  - lc_inv_due: LATEST('fleet_transactions', 'invoice_due_date', date_field='txn_date', event_type='fleet_rental_invoice')
  - lc_paid: SUM('fleet_transactions', 'amount', event_type='fleet_payment', billing_period=lc_inv_period)
  - lc_base: MX(0, lc_inv_dep + lc_inv_lease - lc_paid) if F('turn_in_date') != '' and DAYS(lc_inv_date, F('turn_in_date')) >= 0 and DAYS(lc_inv_date, F('turn_in_date')) <= K('final_month_days') else (MX(0, lc_inv_amount - lc_inv_tax - lc_paid) if lc_inv_tax > 0 else MX(0, lc_inv_amount - lc_paid))
  - lc_rate: K('rate_relationship_clean') if EXISTS('balloon', status='active', days_past_due=0) and COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_late_charge') == 0 else (K('rate_relationship_repeat') if EXISTS('balloon', status='active', days_past_due=0) and COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_late_charge') >= 1 else P('late_charge_pct_of_past_due'))
  - lc_floor: K('minimum_long_tenure') if MONTHS(F('in_service_date'), NOW) >= K('long_tenure_months') else (K('minimum_mid_tenure') if MONTHS(F('in_service_date'), NOW) >= K('mid_tenure_months') else P('late_charge_min'))
  - lc_lateness: K('lateness_multiplier_long') if DAYS(lc_inv_due, NOW) >= K('lateness_long_days') else (K('lateness_multiplier_mid') if DAYS(lc_inv_due, NOW) >= K('lateness_mid_days') else 1)
  - lc_wind_down: K('wind_down_turned_in') if F('termination_notice_date') != '' and DAYS(F('termination_notice_date'), lc_inv_date) > 0 and F('turn_in_date') != '' else (K('wind_down_noticed') if F('termination_notice_date') != '' and DAYS(F('termination_notice_date'), lc_inv_date) > 0 and F('turn_in_date') == '' else 1)
  - lc_delinquency: K('delinquency_addition_high') if XCOUNT('retail', 'retail_transactions', within_months=K('delinquency_window_months'), date_field='txn_date', event_type='retail_late_charge') >= 2 else (K('delinquency_addition_mid') if XCOUNT('retail', 'retail_transactions', within_months=K('delinquency_window_months'), date_field='txn_date', event_type='retail_late_charge') == 1 else 0)
  - result: RND(MX(lc_floor, lc_base * lc_rate / K('percent')) * lc_lateness * lc_wind_down + lc_delinquency, 2)
  compute_basis:
    lc_inv_date: The most recent rental invoice is the unit's rental invoice with the latest invoice date; where two share that date, the one posted first is used.
    lc_inv_period: The most recent rental invoice is the unit's rental invoice with the latest invoice date; where two share that date, the one posted first is used.
    lc_inv_amount: The late-charge base is the most recent rental invoice amount less the business payments applied to that invoice month, never below zero.
    lc_inv_tax: for any other invoice that carries sales tax, it is the invoice amount less its sales tax and less the business payments applied to that month
    lc_inv_dep: for an invoice dated on or before the turn-in date and no more than 30 days before it, it is that invoice's depreciation and lease charge less the business payments applied to that month
    lc_inv_lease: for an invoice dated on or before the turn-in date and no more than 30 days before it, it is that invoice's depreciation and lease charge less the business payments applied to that month
    lc_inv_due: 1.25 where 30 or more days have passed since the invoice due date, 1.10 where 15 to 29 days have passed, and 1 where fewer than 15 days have passed.
    lc_paid: The business payments applied to an invoice month are the payments the unit's ledger records against that month, each payment being recorded against the month it was applied to when it posted; a payment recorded against no invoice month is not counted.
    lc_base: 'The late-charge base is figured from the parts of the invoice: for an invoice dated on or before the turn-in date and no more than 30 days before it, it is that invoice''s depreciation and lease charge less the business payments applied to that month; for any other invoice that carries sales tax, it is the invoice amount less its sales tax and less the business payments applied to that month; for any other invoice that carries no sales tax, it is the invoice amount less the business payments applied to that month; in every case never below zero.'
    lc_rate: The late-charge rate is 1.00 percent where the business holds an active Kestrel Advantage Balloon contract with no days past due and the unit's ledger shows no late charge posted within the last 12 whole months, 1.25 percent where it holds such a balloon contract and the unit's ledger shows one or more late charges posted within the last 12 whole months, and late_charge_pct_of_past_due where it holds no active balloon contract with no days past due.
    lc_floor: The late-charge minimum is $15 where the unit has been in service 24 or more whole months, counted from its in-service date to today, $20 where it has been in service 12 to 23 whole months, and late_charge_min where it has been in service fewer than 12 whole months.
    lc_lateness: 'The charge after the minimum is multiplied by the late-charge lateness multiplier: 1.25 where 30 or more days have passed since the invoice due date, 1.10 where 15 to 29 days have passed, and 1 where fewer than 15 days have passed.'
    lc_wind_down: 'The charge after the minimum is multiplied by the late-charge wind-down multiplier: 0.75 where the written termination notice for the unit was received before the invoice date and the unit has since been turned in, 0.90 where the notice was received before the invoice date and the unit has not been turned in, and 1 where no termination notice was received before the invoice date.'
    lc_delinquency: 'A late-charge delinquency addition is added: $15 where two or more late charges were posted on the business''s Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months, $10 where exactly one was, and nothing where none was.'
    result: A schedule below that replaces a standard figure applies first; any multiplier then applies to the charge after the minimum; any addition comes last; and the charge is rounded to the nearest cent once, at the end.
  factors:
  - id: lc_invoice_part_basis
    effect: method
    decides: lc_base
    bindings:
    - lc_inv_tax
    - lc_inv_dep
    - lc_inv_lease
    - lc_base
    ladder:
    - when: the invoice is dated on or before the turn-in date and no more than 30 days before it
      method: the invoice's depreciation and lease charge less the business payments applied to that month, never below zero
    - when: any other invoice that carries sales tax
      method: the invoice amount less its sales tax and less the business payments applied to that month, never below zero
    - when: otherwise (any other invoice carrying no sales tax)
      method: the invoice amount less the business payments applied to that month, never below zero
    baseline:
      lc_base: MX(0, lc_inv_amount - lc_paid)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lc_relationship_rate
    effect: parameter
    decides: lc_rate
    bindings:
    - lc_rate
    ladder:
    - when: an active balloon contract with no days past due and no late charge on the unit within the last 12 whole months
      value: K('rate_relationship_clean')
    - when: an active balloon contract with no days past due and one or more late charges on the unit within the last 12 whole months
      value: K('rate_relationship_repeat')
    - when: otherwise (no active balloon contract with no days past due)
      value: P('late_charge_pct_of_past_due')
    baseline:
      lc_rate: P('late_charge_pct_of_past_due')
    evidence:
    - cross_category
    - history
    cross_difficulty: balloon
  - id: lc_tenure_minimum
    effect: parameter
    decides: lc_floor
    bindings:
    - lc_floor
    ladder:
    - when: in service 24 or more whole months
      value: K('minimum_long_tenure')
    - when: in service 12 to 23 whole months
      value: K('minimum_mid_tenure')
    - when: otherwise (fewer than 12 whole months)
      value: P('late_charge_min')
    baseline:
      lc_floor: P('late_charge_min')
    evidence:
    - date
    cross_difficulty: null
  - id: lc_lateness_scale
    effect: parameter
    decides: lc_lateness
    bindings:
    - lc_inv_due
    - lc_lateness
    ladder:
    - when: 30 or more days since the invoice due date
      value: K('lateness_multiplier_long')
    - when: 15 to 29 days since the invoice due date
      value: K('lateness_multiplier_mid')
    - when: otherwise (fewer than 15 days)
      value: '1'
    baseline:
      lc_lateness: '1'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: lc_wind_down_scale
    effect: parameter
    decides: lc_wind_down
    bindings:
    - lc_wind_down
    ladder:
    - when: termination notice received before the invoice date and the unit since turned in
      value: K('wind_down_turned_in')
    - when: termination notice received before the invoice date and the unit not turned in
      value: K('wind_down_noticed')
    - when: otherwise (no termination notice received before the invoice date)
      value: '1'
    baseline:
      lc_wind_down: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: lc_cross_account_addition
    effect: parameter
    decides: lc_delinquency
    bindings:
    - lc_delinquency
    ladder:
    - when: two or more late charges posted on the business's Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months
      value: K('delinquency_addition_high')
    - when: exactly one such retail late charge within the last 6 whole months
      value: K('delinquency_addition_mid')
    - when: otherwise (none)
      value: '0'
    baseline:
      lc_delinquency: '0'
    evidence:
    - cross_category
    cross_difficulty: retail
  baseline:
    rule: The late-charge base is the most recent rental invoice amount less the business payments applied to that invoice month, never below zero. The late-charge rate is late_charge_pct_of_past_due for the tier, and the late-charge minimum is late_charge_min for the tier. The late charge is the late-charge base times the late-charge rate divided by 100, but never less than the late-charge minimum, rounded to the nearest cent.
    params:
    - late_charge_pct_of_past_due
    - late_charge_min
  inputs:
    history:
    - table: fleet_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: fleet_rental_invoice
    - table: fleet_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: fleet_payment
    - table: fleet_transactions
      aggregate: count
      field: fleet_txn_id
      within_months: 12
      filters:
        event_type: fleet_late_charge
    - category: retail
      table: retail_transactions
      aggregate: count
      field: retail_txn_id
      within_months: 6
      filters:
        event_type: retail_late_charge
    cross_category:
    - balloon
    - retail
- id: fleet_ext_turned_in_unit_refund
  base_policy_refs:
  - fleet_billing_and_payments
  overwrite:
  - base_policy: fleet_billing_and_payments
    superseded_clause: A credit balance left on a unit after it closes is refunded within refund_days calendar days.
    replaced_by: A credit balance standing on a unit that has been turned in is refunded before the unit closes, at the request of a named authorized signer of the business, in the amount this policy figures; a credit balance left on any other unit after it closes is refunded within refund_days calendar days, as before.
  trigger: on_request
  subject:
  - fleet_credit_refund
  computes: amount
  target_tool: request_credit_refund_a747b6b6
  params:
    reserve_window_months: 6
    delinquency_reserve_high: 1000.0
    delinquency_reserve_mid: 500.0
    toll_window_days: 60
    toll_holdback_listed: 250.0
    toll_holdback_other: 100.0
    reserve_share_window_days: 30
    reserve_flat_window_days: 60
    reserve_share_of_cap_pct: 10
    reserve_flat: 300.0
    percent: 100
    clearing_window_months: 1
    history_window_months: 12
    clearing_half_share: 0.5
  rule: 'A credit balance standing on a unit that has been turned in is refunded before the unit closes, at the request of a named authorized signer of the business, in the amount this policy figures; a credit balance left on any other unit after it closes is refunded within refund_days calendar days, as before. The refund is not made until the unit''s ledger carries the early termination charge owed for a closed-end unit turned in before its scheduled end date. Nor is the refund made until the unit''s ledger carries the excess mileage charge owed for the miles a turned-in closed-end unit was driven beyond its allowance. The refund is figured only after the unit''s ledger carries the late charge owed on the unit''s most recent rental invoice month once that month''s grace period has fully run out. Days between two dates count the later date but not the earlier one; a posting falls within the last N whole months when fewer than N whole months separate its date from today, a whole month being
    one fewer than the calendar months between the two dates where today''s day of the month is smaller than the posting''s. The credit balance is the unit''s charges due balance taken as a positive figure where it stands below zero, that is the amount by which the payments, credits and waivers posted to the unit exceed its rentals and charges. The refund is the whole credit balance, never below zero, rounded to the nearest cent. Every holdback below is subtracted from the credit balance, the refund never going below zero, and the refund is rounded to the nearest cent once, at the end. The refund delinquency reserve is $1,000 where two or more late charges were posted on the business''s Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months, $500 where exactly one was, and nothing where none was. The refund toll holdback is $250 where the unit was turned in 60 or fewer days before today and is titled in a state on Kestrel''s toll-authority billing list (California,
    Colorado, Florida, Georgia, Illinois, New Jersey, New York, North Carolina, Ohio, Pennsylvania, Texas, Virginia and Washington), $100 where it was turned in 60 or fewer days before today and is titled in any other state, and nothing where it was turned in more than 60 days before today. The refund condition reserve for a closed-end unit turned in 30 or fewer days before today is figured as 10 percent of its wear cap, the wear cap being closed_end_wear_charge_cap_pct percent of its capitalized cost; for a closed-end unit turned in 31 to 60 days before today it is a flat $300; for a TRAC unit, or a unit turned in more than 60 days before today, there is none. The refund clearing holdback covers the returnable remittances, the business checks and ACH debits posted to the unit within the last whole month: it is the whole of them where the unit''s ledger shows two or more late charges posted within the last 12 whole months, half of them where it shows exactly one, and nothing where it shows
    none.'
  prerequisite:
  - problem: fleet_ext_closed_end_termination_charge
    kind: value_input
    gate: rf_credit
    form: state
    policy_source: The refund is not made until the unit's ledger carries the early termination charge owed for a closed-end unit turned in before its scheduled end date.
    condition: For a closed-end unit turned in before its scheduled end date, the unit's ledger carries a unit charge with fee type early_termination_fee and the unit's charges due balance includes it.
    resolved_by: bill_early_termination_18cdd752
    effect: Posting the early termination charge raises the unit's charges due balance by that charge, so the credit balance the refund starts from falls by the same amount.
  - problem: fleet_ext_closed_end_mileage_charge
    kind: value_input
    gate: rf_credit
    form: state
    policy_source: Nor is the refund made until the unit's ledger carries the excess mileage charge owed for the miles a turned-in closed-end unit was driven beyond its allowance.
    condition: For a turned-in closed-end unit driven beyond its allowance, the unit's ledger carries a unit charge with fee type excess_mileage_charge and the unit's charges due balance includes it.
    resolved_by: bill_excess_mileage_e7ed45ad
    effect: Posting the excess mileage charge raises the unit's charges due balance by that charge, so the credit balance the refund starts from falls by the same amount.
  - problem: fleet_ext_latest_month_late_charge
    kind: value_input
    gate: rf_credit
    form: state
    policy_source: The refund is figured only after the unit's ledger carries the late charge owed on the unit's most recent rental invoice month once that month's grace period has fully run out.
    condition: Where the most recent rental invoice month went unpaid past its grace period, the unit's ledger carries a late charge for that billing period and the unit's charges due balance includes it.
    resolved_by: assess_late_charge_6db1a799
    effect: Assessing the late charge raises the unit's charges due balance by that charge, so the credit balance the refund starts from falls by the same amount, and it adds a late charge to the unit's 12-month late-charge history that the clearing holdback reads.
  cross_category:
  - category: retail
    as: history
    reads:
    - retail_transactions.event_type
    - retail_transactions.txn_date
    note: The refund delinquency reserve tier is read from the count of retail late charges posted on the business's retail contracts within the last 6 whole months.
  compute:
  - rf_credit: 0 - F('charges_due_balance')
  - rf_delinquency_reserve: K('delinquency_reserve_high') if XCOUNT('retail', 'retail_transactions', within_months=K('reserve_window_months'), date_field='txn_date', event_type='retail_late_charge') >= 2 else (K('delinquency_reserve_mid') if XCOUNT('retail', 'retail_transactions', within_months=K('reserve_window_months'), date_field='txn_date', event_type='retail_late_charge') == 1 else 0)
  - rf_toll: K('toll_holdback_listed') if DAYS(F('turn_in_date'), NOW) <= K('toll_window_days') and (F('title_state') == 'CA' or F('title_state') == 'CO' or F('title_state') == 'FL' or F('title_state') == 'GA' or F('title_state') == 'IL' or F('title_state') == 'NJ' or F('title_state') == 'NY' or F('title_state') == 'NC' or F('title_state') == 'OH' or F('title_state') == 'PA' or F('title_state') == 'TX' or F('title_state') == 'VA' or F('title_state') == 'WA') else (K('toll_holdback_other') if DAYS(F('turn_in_date'), NOW) <= K('toll_window_days') else 0)
  - rf_reserve: F('capitalized_cost') * P('closed_end_wear_charge_cap_pct') / K('percent') * K('reserve_share_of_cap_pct') / K('percent') if F('lease_type') == 'closed_end_commercial' and DAYS(F('turn_in_date'), NOW) <= K('reserve_share_window_days') else (K('reserve_flat') if F('lease_type') == 'closed_end_commercial' and DAYS(F('turn_in_date'), NOW) <= K('reserve_flat_window_days') else 0)
  - rf_returnable: SUM('fleet_transactions', 'amount', within_months=K('clearing_window_months'), date_field='txn_date', event_type='fleet_payment', payment_channel='business_check') + SUM('fleet_transactions', 'amount', within_months=K('clearing_window_months'), date_field='txn_date', event_type='fleet_payment', payment_channel='ach_debit')
  - rf_hold: rf_returnable if COUNT('fleet_transactions', within_months=K('history_window_months'), date_field='txn_date', event_type='fleet_late_charge') >= 2 else (rf_returnable * K('clearing_half_share') if COUNT('fleet_transactions', within_months=K('history_window_months'), date_field='txn_date', event_type='fleet_late_charge') == 1 else 0)
  - result: RND(MX(0, rf_credit - rf_delinquency_reserve - rf_toll - rf_reserve - rf_hold), 2)
  compute_basis:
    rf_credit: The credit balance is the unit's charges due balance taken as a positive figure where it stands below zero, that is the amount by which the payments, credits and waivers posted to the unit exceed its rentals and charges.
    rf_delinquency_reserve: The refund delinquency reserve is $1,000 where two or more late charges were posted on the business's Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months, $500 where exactly one was, and nothing where none was.
    rf_toll: The refund toll holdback is $250 where the unit was turned in 60 or fewer days before today and is titled in a state on Kestrel's toll-authority billing list (California, Colorado, Florida, Georgia, Illinois, New Jersey, New York, North Carolina, Ohio, Pennsylvania, Texas, Virginia and Washington), $100 where it was turned in 60 or fewer days before today and is titled in any other state, and nothing where it was turned in more than 60 days before today.
    rf_reserve: The refund condition reserve for a closed-end unit turned in 30 or fewer days before today is figured as 10 percent of its wear cap, the wear cap being closed_end_wear_charge_cap_pct percent of its capitalized cost; for a closed-end unit turned in 31 to 60 days before today it is a flat $300; for a TRAC unit, or a unit turned in more than 60 days before today, there is none.
    rf_returnable: The refund clearing holdback covers the returnable remittances, the business checks and ACH debits posted to the unit within the last whole month
    rf_hold: it is the whole of them where the unit's ledger shows two or more late charges posted within the last 12 whole months, half of them where it shows exactly one, and nothing where it shows none.
    result: Every holdback below is subtracted from the credit balance, the refund never going below zero, and the refund is rounded to the nearest cent once, at the end.
  factors:
  - id: rf_retail_delinquency_reserve
    effect: parameter
    decides: rf_delinquency_reserve
    bindings:
    - rf_delinquency_reserve
    ladder:
    - when: two or more late charges posted on the business's Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months
      value: K('delinquency_reserve_high')
    - when: exactly one such retail late charge within the last 6 whole months
      value: K('delinquency_reserve_mid')
    - when: otherwise (none)
      value: '0'
    baseline:
      rf_delinquency_reserve: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: retail
  - id: rf_toll_reserve
    effect: parameter
    decides: rf_toll
    bindings:
    - rf_toll
    ladder:
    - when: turned in 60 or fewer days before today and titled in a state on the toll-authority billing list
      value: K('toll_holdback_listed')
    - when: turned in 60 or fewer days before today and titled in any other state
      value: K('toll_holdback_other')
    - when: otherwise (turned in more than 60 days before today)
      value: '0'
    baseline:
      rf_toll: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: rf_condition_reserve
    effect: method
    decides: rf_reserve
    bindings:
    - rf_reserve
    ladder:
    - when: a closed-end unit turned in 30 or fewer days before today
      method: 10 percent of the wear cap, the wear cap being closed_end_wear_charge_cap_pct percent of the capitalized cost
    - when: a closed-end unit turned in 31 to 60 days before today
      method: a flat $300
    - when: otherwise (a TRAC unit, or turned in more than 60 days before today)
      method: no reserve
    baseline:
      rf_reserve: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: rf_clearing_holdback
    effect: parameter
    decides: rf_hold
    bindings:
    - rf_returnable
    - rf_hold
    ladder:
    - when: two or more late charges on the unit within the last 12 whole months
      value: the whole of the returnable remittances
    - when: exactly one late charge on the unit within the last 12 whole months
      value: half of the returnable remittances
    - when: otherwise (none)
      value: '0'
    baseline:
      rf_hold: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The credit balance is the unit's charges due balance taken as a positive figure where it stands below zero, that is the amount by which the payments, credits and waivers posted to the unit exceed its rentals and charges. The refund is the whole credit balance, never below zero, rounded to the nearest cent.
    params: []
  inputs:
    history:
    - table: fleet_transactions
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: fleet_payment
        payment_channel: business_check
    - table: fleet_transactions
      aggregate: count
      field: fleet_txn_id
      within_months: 12
      filters:
        event_type: fleet_late_charge
    - category: retail
      table: retail_transactions
      aggregate: count
      field: retail_txn_id
      within_months: 6
      filters:
        event_type: retail_late_charge
    cross_category:
    - retail
- id: fleet_ext_trac_shortfall_charge
  base_policy_refs:
  - fleet_trac_settlement
  overwrite:
  - base_policy: fleet_trac_settlement
    superseded_clause: Net proceeds are gross_sale_proceeds less sale_expenses less remarketing_fee for the tier
    replaced_by: For the deficiency billed when a TRAC unit's sale settlement falls short of its book value, and only for that deficiency, the charge is figured as this policy states; for a sale surplus, an even result or the sale of a closed-end commercial unit, net proceeds are gross_sale_proceeds less sale_expenses less remarketing_fee for the tier, as before, and this policy's figure does not apply to them.
  - base_policy: fleet_trac_settlement
    superseded_clause: when they fall short the shortfall is billed as a deficiency
    replaced_by: For the deficiency billed when a TRAC unit's sale settlement falls short of its book value, and only for that deficiency, the charge is figured as this policy states; for a sale surplus, an even result or the sale of a closed-end commercial unit, net proceeds are gross_sale_proceeds less sale_expenses less remarketing_fee for the tier, as before, and this policy's figure does not apply to them.
  trigger: state_due
  subject:
  - fleet_trac_deficiency_charge
  computes: amount
  target_tool: bill_trac_deficiency_eb6903d6
  params:
    percent: 100
    remarketing_fee_both: 150.0
    remarketing_fee_one: 250.0
    quick_sale_days: 30
    mid_sale_days: 60
    quick_sale_cap_pct: 5
    mid_sale_cap_pct: 8
    notice_long_days: 50
    notice_mid_days: 40
    notice_credit_long: 200.0
    notice_credit_mid: 100.0
    term_relief_full_pct: 10
    term_relief_long_pct: 5
    term_relief_long_months: 24
    history_credit_clean: 100.0
    history_credit_one: 50.0
    tenure_long_months: 36
    tenure_mid_months: 12
    tenure_credit_long: 100.0
    tenure_credit_mid: 50.0
  rule: 'For the deficiency billed when a TRAC unit''s sale settlement falls short of its book value, and only for that deficiency, the charge is figured as this policy states; for a sale surplus, an even result or the sale of a closed-end commercial unit, net proceeds are gross_sale_proceeds less sale_expenses less remarketing_fee for the tier, as before, and this policy''s figure does not apply to them. A settlement whose recorded result is a deficiency stays within this policy even where the figure below comes to nothing, and the deficiency charge is then booked at zero, which settles the terminal rental adjustment. Whole months between two dates are counted from the earlier date to the later one and are one fewer where the later date''s day of the month is smaller than the earlier date''s; days between two dates count the later date but not the earlier one; a posting falls within the last N whole months when fewer than N whole months separate its date from today. The sale settlement
    read is the unit''s sale settlement with the latest settlement date; where two share that date, the one posted first is used. The sale shortfall is the book value retired at the sale settlement less the net proceeds, never below zero. The net proceeds are the gross sale proceeds of the settlement less the sale expenses allowed less the deficiency remarketing fee. The sale expenses allowed are the actual sale expenses on the settlement, and the deficiency remarketing fee is remarketing_fee for the tier. The deficiency charge is the sale shortfall, rounded to the nearest cent. A schedule below that replaces a standard figure applies first; any relief percentage then reduces the shortfall so figured; any credit is then subtracted, never taking the charge below zero; and the charge is rounded to the nearest cent once, at the end. The deficiency remarketing fee is $150 where the business holds both an active Kestrel New Vehicle Retail Installment Sale Contract and an active Kestrel Advantage
    Balloon contract, $250 where it holds exactly one of the two, and remarketing_fee for the tier where it holds neither. The sale expenses allowed follow how soon the unit sold after its turn-in: for a sale 30 or fewer days after the turn-in date, the lesser of the actual sale expenses and 5 percent of the gross sale proceeds; for a sale 31 to 60 days after the turn-in date, the lesser of the actual sale expenses and 8 percent of the gross sale proceeds; for a later sale, the actual sale expenses. The deficiency term relief is 10 percent where the unit had been in service for at least its scheduled term in whole months when it was turned in, 5 percent where it had been in service 24 or more whole months but less than its scheduled term, and nothing where it had been in service fewer than 24 whole months. The deficiency notice credit is $200 where the written termination notice was received 50 or more days before the turn-in date, $100 where it was received 40 to 49 days before the turn-in
    date, and nothing where it was received fewer than 40 days before or no termination notice is on the unit. The deficiency payment-history credit is $100 where the unit''s ledger shows no late charge posted within the last 12 whole months, $50 where it shows exactly one, and nothing where it shows two or more. The deficiency relationship-tenure credit is $100 where the business has a Kestrel Advantage Balloon contract, open or closed, funded 36 or more whole months before today, $50 where its earliest-funded balloon contract was funded 12 to 35 whole months before today, and nothing where it has no balloon contract funded at least 12 whole months before today.'
  prerequisite: []
  cross_category:
  - category: retail
    as: existence
    reads:
    - status
    note: The deficiency remarketing fee tier turns on whether the business holds an active Kestrel New Vehicle Retail Installment Sale Contract.
  - category: balloon
    as: history
    reads:
    - status
    - balloon_transactions.event_type
    - balloon_transactions.txn_date
    note: The deficiency remarketing fee tier turns on whether the business holds an active balloon contract, and the relationship-tenure credit on the funding dates of its balloon contracts.
  compute:
  - d_book_retired: LATEST('fleet_transactions', 'amount', date_field='txn_date', event_type='fleet_sale_settlement')
  - d_gross: LATEST('fleet_transactions', 'gross_sale_proceeds', date_field='txn_date', event_type='fleet_sale_settlement')
  - d_expenses_actual: LATEST('fleet_transactions', 'sale_expenses', date_field='txn_date', event_type='fleet_sale_settlement')
  - d_remarketing_fee: K('remarketing_fee_both') if EXISTS('retail', status='active') and EXISTS('balloon', status='active') else (K('remarketing_fee_one') if EXISTS('retail', status='active') or EXISTS('balloon', status='active') else P('remarketing_fee'))
  - d_expenses_allowed: MN(d_expenses_actual, d_gross * K('quick_sale_cap_pct') / K('percent')) if DAYS(F('turn_in_date'), F('sale_date')) <= K('quick_sale_days') else (MN(d_expenses_actual, d_gross * K('mid_sale_cap_pct') / K('percent')) if DAYS(F('turn_in_date'), F('sale_date')) <= K('mid_sale_days') else d_expenses_actual)
  - d_term_relief: K('term_relief_full_pct') if MONTHS(F('in_service_date'), F('turn_in_date')) >= F('term_months') else (K('term_relief_long_pct') if MONTHS(F('in_service_date'), F('turn_in_date')) >= K('term_relief_long_months') else 0)
  - d_notice_credit: K('notice_credit_long') if F('termination_notice_date') != '' and DAYS(F('termination_notice_date'), F('turn_in_date')) >= K('notice_long_days') else (K('notice_credit_mid') if F('termination_notice_date') != '' and DAYS(F('termination_notice_date'), F('turn_in_date')) >= K('notice_mid_days') else 0)
  - d_history_credit: K('history_credit_clean') if COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_late_charge') == 0 else (K('history_credit_one') if COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_late_charge') == 1 else 0)
  - d_tenure_credit: K('tenure_credit_long') if XCOUNT('balloon', 'balloon_transactions', event_type='balloon_funding') - XCOUNT('balloon', 'balloon_transactions', within_months=K('tenure_long_months'), date_field='txn_date', event_type='balloon_funding') >= 1 else (K('tenure_credit_mid') if XCOUNT('balloon', 'balloon_transactions', event_type='balloon_funding') - XCOUNT('balloon', 'balloon_transactions', within_months=K('tenure_mid_months'), date_field='txn_date', event_type='balloon_funding') >= 1 else 0)
  - result: RND(MX(0, MX(0, d_book_retired - (d_gross - d_expenses_allowed - d_remarketing_fee)) * (1 - d_term_relief / K('percent')) - d_notice_credit - d_history_credit - d_tenure_credit), 2)
  compute_basis:
    d_book_retired: The sale settlement read is the unit's sale settlement with the latest settlement date; where two share that date, the one posted first is used.
    d_gross: The net proceeds are the gross sale proceeds of the settlement less the sale expenses allowed less the deficiency remarketing fee.
    d_expenses_actual: The sale expenses allowed are the actual sale expenses on the settlement, and the deficiency remarketing fee is remarketing_fee for the tier.
    d_remarketing_fee: The deficiency remarketing fee is $150 where the business holds both an active Kestrel New Vehicle Retail Installment Sale Contract and an active Kestrel Advantage Balloon contract, $250 where it holds exactly one of the two, and remarketing_fee for the tier where it holds neither.
    d_expenses_allowed: 'The sale expenses allowed follow how soon the unit sold after its turn-in: for a sale 30 or fewer days after the turn-in date, the lesser of the actual sale expenses and 5 percent of the gross sale proceeds; for a sale 31 to 60 days after the turn-in date, the lesser of the actual sale expenses and 8 percent of the gross sale proceeds; for a later sale, the actual sale expenses.'
    d_term_relief: The deficiency term relief is 10 percent where the unit had been in service for at least its scheduled term in whole months when it was turned in, 5 percent where it had been in service 24 or more whole months but less than its scheduled term, and nothing where it had been in service fewer than 24 whole months.
    d_notice_credit: The deficiency notice credit is $200 where the written termination notice was received 50 or more days before the turn-in date, $100 where it was received 40 to 49 days before the turn-in date, and nothing where it was received fewer than 40 days before or no termination notice is on the unit.
    d_history_credit: The deficiency payment-history credit is $100 where the unit's ledger shows no late charge posted within the last 12 whole months, $50 where it shows exactly one, and nothing where it shows two or more.
    d_tenure_credit: The deficiency relationship-tenure credit is $100 where the business has a Kestrel Advantage Balloon contract, open or closed, funded 36 or more whole months before today, $50 where its earliest-funded balloon contract was funded 12 to 35 whole months before today, and nothing where it has no balloon contract funded at least 12 whole months before today.
    result: A schedule below that replaces a standard figure applies first; any relief percentage then reduces the shortfall so figured; any credit is then subtracted, never taking the charge below zero; and the charge is rounded to the nearest cent once, at the end.
  factors:
  - id: d_relationship_remarketing
    effect: parameter
    decides: d_remarketing_fee
    bindings:
    - d_remarketing_fee
    ladder:
    - when: the business holds an active Kestrel New Vehicle Retail Installment Sale Contract and an active balloon contract
      value: K('remarketing_fee_both')
    - when: the business holds exactly one of an active Kestrel New Vehicle Retail Installment Sale Contract or an active balloon contract
      value: K('remarketing_fee_one')
    - when: otherwise (neither)
      value: P('remarketing_fee')
    baseline:
      d_remarketing_fee: P('remarketing_fee')
    evidence:
    - cross_category
    cross_difficulty: balloon
  - id: d_sale_expense_allowance
    effect: method
    decides: d_expenses_allowed
    bindings:
    - d_expenses_allowed
    ladder:
    - when: sold 30 or fewer days after the turn-in date
      method: the lesser of the actual sale expenses and 5 percent of the gross sale proceeds
    - when: sold 31 to 60 days after the turn-in date
      method: the lesser of the actual sale expenses and 8 percent of the gross sale proceeds
    - when: otherwise (sold later)
      method: the actual sale expenses
    baseline:
      d_expenses_allowed: d_expenses_actual
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: d_term_completion_relief
    effect: parameter
    decides: d_term_relief
    bindings:
    - d_term_relief
    ladder:
    - when: in service at least the scheduled term in whole months when turned in
      value: K('term_relief_full_pct')
    - when: in service 24 or more whole months but less than the scheduled term
      value: K('term_relief_long_pct')
    - when: otherwise (fewer than 24 whole months)
      value: '0'
    baseline:
      d_term_relief: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: d_notice_lead_credit
    effect: parameter
    decides: d_notice_credit
    bindings:
    - d_notice_credit
    ladder:
    - when: termination notice received 50 or more days before the turn-in date
      value: K('notice_credit_long')
    - when: termination notice received 40 to 49 days before the turn-in date
      value: K('notice_credit_mid')
    - when: otherwise (fewer than 40 days, or no notice on the unit)
      value: '0'
    baseline:
      d_notice_credit: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: d_payment_history_credit
    effect: parameter
    decides: d_history_credit
    bindings:
    - d_history_credit
    ladder:
    - when: no late charge on the unit within the last 12 whole months
      value: K('history_credit_clean')
    - when: exactly one late charge on the unit within the last 12 whole months
      value: K('history_credit_one')
    - when: otherwise (two or more)
      value: '0'
    baseline:
      d_history_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: d_balloon_tenure_credit
    effect: parameter
    decides: d_tenure_credit
    bindings:
    - d_tenure_credit
    ladder:
    - when: a balloon contract, open or closed, funded 36 or more whole months before today
      value: K('tenure_credit_long')
    - when: the earliest-funded balloon contract funded 12 to 35 whole months before today
      value: K('tenure_credit_mid')
    - when: otherwise (no balloon contract funded at least 12 whole months ago)
      value: '0'
    baseline:
      d_tenure_credit: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: balloon
  baseline:
    rule: The sale shortfall is the book value retired at the sale settlement less the net proceeds, never below zero. The net proceeds are the gross sale proceeds of the settlement less the sale expenses allowed less the deficiency remarketing fee. The sale expenses allowed are the actual sale expenses on the settlement, and the deficiency remarketing fee is remarketing_fee for the tier. The deficiency charge is the sale shortfall, rounded to the nearest cent.
    params:
    - remarketing_fee
  inputs:
    history:
    - table: fleet_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: fleet_sale_settlement
    - table: fleet_transactions
      aggregate: count
      field: fleet_txn_id
      within_months: 12
      filters:
        event_type: fleet_late_charge
    - category: balloon
      table: balloon_transactions
      aggregate: count
      field: balloon_txn_id
      filters:
        event_type: balloon_funding
    cross_category:
    - retail
    - balloon
- id: fleet_ext_deficiency_arrangement_payment
  base_policy_refs:
  - fleet_billing_and_payments
  - fleet_trac_settlement
  overwrite:
  - base_policy: fleet_trac_settlement
    superseded_clause: due trac_deficiency_payment_days calendar days after the settlement invoice
    replaced_by: 'A business may pay a TRAC deficiency under a Kestrel payment arrangement set up at its own request, and only such a deficiency: the first arrangement payment is made when the arrangement is set up and is figured as this policy states, and the rest of the arranged balance falls due in equal monthly arrangement payments; a deficiency paid without an arrangement is due trac_deficiency_payment_days calendar days after the settlement invoice, as before.'
  - base_policy: fleet_billing_and_payments
    superseded_clause: is applied to the oldest unpaid invoice month first unless the remittance names the months it pays
    replaced_by: An arrangement payment is booked on the unit against its charges due without being recorded against any rental invoice month, and is never applied to a rental invoice month; any other business payment is applied to the oldest unpaid invoice month first unless the remittance names the months it pays, as before.
  trigger: on_request
  subject:
  - fleet_payment
  computes: amount
  target_tool: remit_arrangement_payment_506aa8ae
  params:
    percent: 100
    max_months: 12
    fixed_months: 3
    share_long_pct: 10
    share_mid_pct: 20
    share_long_months: 24
    share_mid_months: 12
    minimum_high: 1000.0
    minimum_mid: 500.0
    deficiency_high: 5000.0
    deficiency_mid: 2500.0
    upfront_delinquent: 2
    delinquent_window_months: 6
  rule: 'A business may pay a TRAC deficiency under a Kestrel payment arrangement set up at its own request, and only such a deficiency: the first arrangement payment is made when the arrangement is set up and is figured as this policy states, and the rest of the arranged balance falls due in equal monthly arrangement payments; a deficiency paid without an arrangement is due trac_deficiency_payment_days calendar days after the settlement invoice, as before. An arrangement payment is booked on the unit against its charges due without being recorded against any rental invoice month, and is never applied to a rental invoice month; any other business payment is applied to the oldest unpaid invoice month first unless the remittance names the months it pays, as before. Whole months between two dates are counted from the earlier date to the later one and are one fewer where the later date''s day of the month is smaller than the earlier date''s, and are negative where the later date comes first;
    days between two dates count the later date but not the earlier one; a posting falls within the last N whole months when fewer than N whole months separate its date from today. The first arrangement payment is fixed only after the unit''s ledger carries the deficiency charge billed for its sale settlement. The arranged balance is the unit''s charges due balance. The arrangement down payment is the arranged balance times the down-payment share, which is 100 percent, but never less than the minimum down payment, which is nothing. The remainder of the arranged balance after the down payment is divided by the arrangement months, which is 1, to give each monthly arrangement payment. The first arrangement payment is the down payment plus the monthly arrangement payments collected up front, which is one, never more than the arranged balance, rounded to the nearest cent. A schedule below replaces only the standard figure it names; the down payment, monthly payment and first arrangement payment
    are then figured in the order the standard method sets out. The arrangement months are counted as follows: where the unit was turned in before its scheduled end date and the business holds an active Kestrel Advantage Balloon contract with no days past due, they are the whole months from today to the unit''s scheduled end date, never more than 12 and never fewer than 1, so a scheduled end date already passed gives 1; where the unit was turned in before its scheduled end date and the business holds no active balloon contract with no days past due, they are a fixed 3; otherwise they are 1. The down-payment share is 10 percent where the unit had been in service 24 or more whole months when it was turned in, 20 percent where it had been in service 12 to 23 whole months, and 100 percent where it had been in service fewer than 12 whole months. The minimum down payment is $1,000 where the deficiency charges billed on the unit total $5,000 or more, $500 where they total $2,500 or more but less
    than $5,000, and nothing where they total less than $2,500. The monthly arrangement payments collected up front are two where two or more late charges were posted on the business''s Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months, none where none was posted and the business holds an active Kestrel New Vehicle Retail Installment Sale Contract, and one in every other case.'
  prerequisite:
  - problem: fleet_ext_trac_shortfall_charge
    kind: value_input
    gate: pa_balance
    form: state
    policy_source: The first arrangement payment is fixed only after the unit's ledger carries the deficiency charge billed for its sale settlement.
    condition: For a TRAC unit whose sale settlement shows trac_result deficiency, the unit's ledger carries a fleet_trac_deficiency_charge posting and the unit's charges due balance includes it.
    resolved_by: bill_trac_deficiency_eb6903d6
    effect: Billing the deficiency charge raises the unit's charges due balance by the charge, which the arranged balance includes, and puts the minimum down payment on the tier the charge's size selects.
  cross_category:
  - category: balloon
    as: branch
    reads:
    - status
    - days_past_due
    note: The arrangement months tier turns on whether the business holds an active balloon contract with no days past due.
  - category: retail
    as: history
    reads:
    - status
    - retail_transactions.event_type
    - retail_transactions.txn_date
    note: The number of monthly arrangement payments collected up front is read from the count of retail late charges posted on the business's retail contracts within the last 6 whole months.
  compute:
  - pa_balance: F('charges_due_balance')
  - pa_months: MN(K('max_months'), MX(1, MONTHS(NOW, F('scheduled_end_date')))) if DAYS(F('turn_in_date'), F('scheduled_end_date')) > 0 and EXISTS('balloon', status='active', days_past_due=0) else (K('fixed_months') if DAYS(F('turn_in_date'), F('scheduled_end_date')) > 0 and not EXISTS('balloon', status='active', days_past_due=0) else 1)
  - pa_share: K('share_long_pct') if MONTHS(F('in_service_date'), F('turn_in_date')) >= K('share_long_months') else (K('share_mid_pct') if MONTHS(F('in_service_date'), F('turn_in_date')) >= K('share_mid_months') else K('percent'))
  - pa_minimum: K('minimum_high') if SUM('fleet_transactions', 'amount', event_type='fleet_trac_deficiency_charge') >= K('deficiency_high') else (K('minimum_mid') if SUM('fleet_transactions', 'amount', event_type='fleet_trac_deficiency_charge') >= K('deficiency_mid') else 0)
  - pa_upfront: K('upfront_delinquent') if XCOUNT('retail', 'retail_transactions', within_months=K('delinquent_window_months'), date_field='txn_date', event_type='retail_late_charge') >= 2 else (0 if XCOUNT('retail', 'retail_transactions', within_months=K('delinquent_window_months'), date_field='txn_date', event_type='retail_late_charge') == 0 and EXISTS('retail', status='active') else 1)
  - result: RND(MN(pa_balance, MX(pa_minimum, pa_balance * pa_share / K('percent')) + pa_upfront * (pa_balance - MX(pa_minimum, pa_balance * pa_share / K('percent'))) / pa_months), 2)
  compute_basis:
    pa_balance: The arranged balance is the unit's charges due balance.
    pa_months: 'The arrangement months are counted as follows: where the unit was turned in before its scheduled end date and the business holds an active Kestrel Advantage Balloon contract with no days past due, they are the whole months from today to the unit''s scheduled end date, never more than 12 and never fewer than 1, so a scheduled end date already passed gives 1; where the unit was turned in before its scheduled end date and the business holds no active balloon contract with no days past due, they are a fixed 3; otherwise they are 1.'
    pa_share: The down-payment share is 10 percent where the unit had been in service 24 or more whole months when it was turned in, 20 percent where it had been in service 12 to 23 whole months, and 100 percent where it had been in service fewer than 12 whole months.
    pa_minimum: The minimum down payment is $1,000 where the deficiency charges billed on the unit total $5,000 or more, $500 where they total $2,500 or more but less than $5,000, and nothing where they total less than $2,500.
    pa_upfront: The monthly arrangement payments collected up front are two where two or more late charges were posted on the business's Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months, none where none was posted and the business holds an active Kestrel New Vehicle Retail Installment Sale Contract, and one in every other case.
    result: The first arrangement payment is the down payment plus the monthly arrangement payments collected up front, which is one, never more than the arranged balance, rounded to the nearest cent.
  factors:
  - id: pa_term_months_rule
    effect: method
    decides: pa_months
    bindings:
    - pa_months
    ladder:
    - when: turned in before the scheduled end date and the business holds an active balloon contract with no days past due
      method: the whole months from today to the scheduled end date, never more than 12 and never fewer than 1
    - when: turned in before the scheduled end date and the business holds no active balloon contract with no days past due
      method: a fixed 3 months
    - when: otherwise
      method: 1 month (the balance is paid at once)
    baseline:
      pa_months: '1'
    evidence:
    - date
    - cross_category
    cross_difficulty: balloon
  - id: pa_down_share_schedule
    effect: parameter
    decides: pa_share
    bindings:
    - pa_share
    ladder:
    - when: in service 24 or more whole months when turned in
      value: K('share_long_pct')
    - when: in service 12 to 23 whole months when turned in
      value: K('share_mid_pct')
    - when: otherwise (fewer than 12 whole months)
      value: K('percent')
    baseline:
      pa_share: K('percent')
    evidence:
    - date
    cross_difficulty: null
  - id: pa_minimum_down_schedule
    effect: parameter
    decides: pa_minimum
    bindings:
    - pa_minimum
    ladder:
    - when: deficiency charges billed on the unit total $5,000 or more
      value: K('minimum_high')
    - when: deficiency charges billed on the unit total $2,500 or more but less than $5,000
      value: K('minimum_mid')
    - when: otherwise (less than $2,500)
      value: '0'
    baseline:
      pa_minimum: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: pa_upfront_count_schedule
    effect: parameter
    decides: pa_upfront
    bindings:
    - pa_upfront
    ladder:
    - when: two or more late charges posted on the business's Kestrel New Vehicle Retail Installment Sale Contracts within the last 6 whole months
      value: K('upfront_delinquent')
    - when: no such retail late charge within the last 6 whole months, and an active Kestrel New Vehicle Retail Installment Sale Contract held
      value: '0'
    - when: otherwise (exactly one such late charge, or no active Kestrel New Vehicle Retail Installment Sale Contract)
      value: '1'
    baseline:
      pa_upfront: '1'
    evidence:
    - cross_category
    cross_difficulty: retail
  baseline:
    rule: The arranged balance is the unit's charges due balance. The arrangement down payment is the arranged balance times the down-payment share, which is 100 percent, but never less than the minimum down payment, which is nothing. The remainder of the arranged balance after the down payment is divided by the arrangement months, which is 1, to give each monthly arrangement payment. The first arrangement payment is the down payment plus the monthly arrangement payments collected up front, which is one, never more than the arranged balance, rounded to the nearest cent.
    params: []
  inputs:
    history:
    - table: fleet_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: fleet_trac_deficiency_charge
    - category: retail
      table: retail_transactions
      aggregate: count
      field: retail_txn_id
      within_months: 6
      filters:
        event_type: retail_late_charge
    cross_category:
    - balloon
    - retail
