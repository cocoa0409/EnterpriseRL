    kind: state
    condition: A purchase quote can be issued only while the unit status is in_service or termination_requested.
    evidence_fields:
    - fleet_units.status
    - fleet_units.fleet_unit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_units.fleet_unit_id
      action_bindings:
        fleet_units.fleet_unit_id: fleet_unit_id
    state_contract:
      field: fleet_units.status
      allowed:
      - in_service
      - termination_requested
  - id: purchase_signer
    applies_to:
    - fleet_purchase_settlement
    kind: authorization
    condition: The purchase takes effect only when a named authorized signer has completed the purchase option request
      for the unit.
    evidence_fields:
    - fleet_requests.request_type
    - fleet_requests.request_status
    - fleet_requests.fleet_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fleet_requests.fleet_request_id
      action_bindings:
        fleet_requests.fleet_request_id: fleet_request_id
  formula:
    sales_tax_amount: round((book_value + purchase_option_fee) * purchase_sales_tax_rate_pct / 100, 2)
    amount: book_value + purchase_option_fee + title_transfer_fee + sales_tax_amount + charges_due_balance
  params:
    purchase_option_fee: =purchase_option_fee
    purchase_quote_valid_days: =purchase_quote_valid_days
    title_transfer_business_days: =title_transfer_business_days
    title_transfer_fee: =title_transfer_fee
- id: fleet_default_and_recovery
  subject:
