# Product charter: Kestrel Closed-End Consumer Lease
category: lease
display_name: Kestrel Closed-End Consumer Lease
binding:
  holding_table: lease_contracts
  event_tables:
  - lease_transactions
  - lease_inspections
  - lease_wear_items
  intake_tables:
  - lease_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    adjusted_lease_balance: lease_balance
    fees_due_balance: fees_due
    end_of_term_balance: end_of_term_due
lifecycle:
  states:
  - pending_funding
  - active
  - maturity_extended
  - returned
  - early_terminated
  - purchased
  - repossessed
  - charged_off
  - closed
  transitions:
  - from: pending_funding
    to: active
    by: system
    means: The dealer's lease package passes funding review and the dealer is paid.
  - from: active
    to: maturity_extended
    by: agent
    means: A month-to-month maturity extension is granted at the scheduled end of the lease.
  - from: active
    to: returned
    by: user
    means: The lessee turns the vehicle in at a Kestrel dealer within the scheduled turn-in window.
  - from: maturity_extended
    to: returned
    by: user
    means: The lessee turns the vehicle in during or at the end of a maturity extension.
  - from: active
    to: early_terminated
    by: user
    means: The lessee turns the vehicle in before the scheduled turn-in window.
  - from: active
    to: purchased
    by: user
    means: The lessee, or a Kestrel franchised dealer on the lessee's behalf, buys the vehicle under the purchase
      option.
  - from: maturity_extended
    to: purchased
    by: user
    means: The vehicle is bought under the purchase option during a maturity extension.
  - from: active
    to: repossessed
    by: system
    means: The vehicle is recovered after a payment default.
  - from: repossessed
    to: active
    by: agent
    means: The lease is reinstated and the vehicle released back to the lessee.
  - from: returned
    to: closed
    by: system
    means: End-of-term charges are settled and the lease closes.
  - from: early_terminated
    to: closed
    by: system
    means: Early termination charges are settled and the lease closes.
  - from: purchased
    to: closed
    by: system
    means: The title is transferred to the buyer and the lease closes.
  - from: repossessed
    to: closed
    by: system
    means: The repossessed vehicle is sold and the remaining balance is settled.
  - from: returned
    to: charged_off
    by: system
    means: Unpaid end-of-term charges are charged off.
  - from: early_terminated
    to: charged_off
    by: system
    means: Unpaid early termination charges are charged off.
  - from: repossessed
    to: charged_off
    by: system
    means: The balance left after the sale of a repossessed vehicle is charged off.
accounts:
- key: lease_balance
  unit: USD
  meaning: 'Adjusted lease balance: adjusted capitalized cost less the depreciation portion of payments made; equals
    the residual value at scheduled maturity.'
- key: fees_due
  unit: USD
  meaning: Assessed but unpaid late charges and returned-payment fees during the term.
- key: end_of_term_due
  unit: USD
  meaning: 'Charges owed when the lease ends: excess mileage, excess wear, disposition fee, early termination shortfall
    and fee, less waivers, deposit applied and payments.'
parameter_schema:
  min_credit_score: lowest credit score (FICO Auto Score 8) admitted to the tier; integer
  max_credit_score: highest credit score admitted to the tier; integer
  money_factor_sheet: mapping of term band in months -> base money factor (5 decimals) for the tier
  max_money_factor_markup: maximum dealer markup that may be added to the base money factor; money factor units
  residual_pct_by_term: mapping of lease term in months -> residual value as a percent of MSRP at the 12,000-mile
    allowance
  residual_mileage_adjustment_pct: mapping of annual mileage allowance -> percentage points added to the residual
    percent
  mileage_allowance_options: annual mileage allowances that may be contracted; miles per year
  min_term_months: shortest lease term; months
  max_term_months: longest lease term the tier may book; months
  max_cap_cost_pct_of_msrp: maximum gross capitalized cost as a percent of MSRP; percent
  max_pti_pct: maximum total monthly payment as a percent of verified gross monthly income; percent
  min_cap_cost_reduction_pct: minimum capitalized cost reduction as a percent of MSRP; percent
  acquisition_fee: lease acquisition fee capitalized or paid at signing; USD
  security_deposit_required: whether a refundable security deposit is required at signing
  security_deposit_rounding_increment: a required deposit equals one total monthly payment rounded up to this increment;
    USD
  relationship_exposure_cap: maximum combined Kestrel consumer exposure for the customer including the new lease;
    USD
  funding_window_days: calendar days after the lease date within which the dealer must deliver a complete package
    to be funded
  excess_mileage_rate_by_class: mapping of vehicle class -> excess mileage rate written into the lease; USD per
    mile
  disposition_fee_standard: disposition fee written into every lease at booking; USD
  purchase_option_fee_standard: purchase option fee written into every lease at booking; USD
  payment_cutoff_time_ct: time of day (HH:MM, Central Time) by which a payment must be received on a business day
    to post that day
  payment_allocation_order: ordered list of the buckets a lease payment is applied to
  payment_channel_fees: mapping of payment channel -> convenience fee collected on top of the payment; USD
  late_charge_grace_days: calendar days after a payment due date before a late charge may be assessed
  late_charge_pct_of_unpaid_payment: late charge as a percent of the unpaid portion of the total monthly payment;
    percent
  late_charge_company_max: company maximum late charge per payment before the lease's state maximum is applied;
    USD
  late_charge_min_unpaid_amount: unpaid payment portion below which no late charge is assessed; USD
  returned_payment_fee_company: company returned-payment fee before the lease's state maximum is applied; USD
  courtesy_waivers_per_12_months: courtesy late-charge waivers allowed in any 12 calendar months; count (0 = none)
  courtesy_min_consecutive_on_time: payments in a row without a late charge required for a courtesy waiver; count
  maturity_letter_days_before: calendar days before maturity_date on which the lease-end options letter is mailed
  maturity_extension_max_months: maximum total months a lease may be extended month to month past maturity; months
    (0 = none)
  maturity_extension_request_days_before: calendar days before maturity_date from which a maturity extension may
    be requested
  turn_in_window_days_before_maturity: calendar days before maturity_date from which a turn-in counts as a scheduled-end
    turn-in
  advance_inspection_window_days: calendar days before maturity_date within which the complimentary advance inspection
    may be performed
  advance_inspections_included: number of complimentary advance inspections per lease; count
  wear_charge_schedule: mapping of wear item category -> charge per item when it exceeds the wear standard; USD
  dent_scratch_standard_inches: dents and scratches shorter than this are within the wear standard; inches
  windshield_chip_standard_inches: windshield chips smaller than this and outside the driver's view are within the
    wear standard; inches
  min_tire_tread_32nds: minimum tread depth for a tire to be within the wear standard; 32nds of an inch
  inspection_dispute_days: calendar days after the turn-in inspection within which the lessee may dispute it
  wear_forgiveness_cap: excess wear forgiven at lease end without loyalty; USD
  loyalty_wear_forgiveness_cap: excess wear forgiven at lease end when the loyalty condition is met; USD
  loyalty_window_days: calendar days before or after the turn-in date within which a new Kestrel lease or retail
    contract qualifies for loyalty treatment
  loyalty_disposition_waiver: whether the disposition fee is waived when the loyalty condition is met
  end_of_term_payment_days: calendar days after the end-of-term invoice by which charges are due
  end_of_term_charge_off_days: calendar days after the turn-in date after which unpaid end-of-term charges are charged
    off
  security_deposit_refund_days: calendar days after closing within which an unapplied security deposit is refunded
  purchase_quote_valid_days: calendar days after the quote date through which a purchase or termination quote is
    honoured
  purchase_option_grace_days: calendar days after maturity_date (or the extended maturity) during which the maturity
    purchase price still applies
  third_party_purchase_fee: fee added to the purchase price when a Kestrel franchised dealer buys the vehicle on
    the lessee's behalf; USD
  early_termination_fee: early termination fee for a turn-in before the scheduled window; USD
  early_termination_min_payments: payments that must have been made before an early turn-in is accepted; count
  pull_ahead_max_remaining_payments: most remaining payments that a pull-ahead may waive; count (0 = no pull-ahead)
  repo_assignment_min_days_past_due: minimum days past due before a lease may be assigned for repossession; days
  reinstatement_company_window_days: calendar days after repossession within which a lease reinstatement must be
    completed
  reinstatement_max_per_contract: maximum lease reinstatements over the life of the lease; count
  repo_agency_fee_involuntary: repossession agency fee for an involuntary recovery of a leased vehicle; USD
  storage_daily_fee: storage charge per day for a repossessed leased vehicle; USD
