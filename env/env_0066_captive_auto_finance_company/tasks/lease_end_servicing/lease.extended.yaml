      Kestrel Lease Tier 1:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
      Kestrel Lease Tier 1+:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
- id: lease_maturity_extensions
  subject:
  - lease_maturity_extension
  - lease_maturity_extended
  - lease_extension_updated
  rule: A maturity extension can be granted only while the lease status is active or maturity_extended. The lease
    must show days_past_due of 0, and maturity_extension_months_used plus the months requested must not exceed maturity_extension_max_months
    for the tier. The request may be granted no earlier than maturity_extension_request_days_before calendar days
    before the current maturity_date and no later than the current maturity_date. Extensions are granted in whole
    months; each month moves maturity_date one month later on the same due day, and a tier whose maximum is 0 cannot
    extend. During the extension the lessee keeps paying total_monthly_payment on the same due day, each payment's
    depreciation portion keeps reducing the adjusted lease balance, and the mileage allowance grows by annual_mileage_allowance
    divided by 12 for each extension month. The lessee may end the extension at any time by turning the vehicle
    in or buying it.
  eligibility:
  - id: ext_status
    applies_to:
    - lease_maturity_extension
    kind: state
    condition: A maturity extension can be granted only while the lease status is active or maturity_extended.
    evidence_fields:
    - lease_contracts.status
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    state_contract:
      field: lease_contracts.status
      allowed:
      - active
      - maturity_extended
  - id: ext_limits
    applies_to:
    - lease_maturity_extension
    kind: authorization
    condition: The lease must show days_past_due of 0, and maturity_extension_months_used plus the months requested
      must not exceed maturity_extension_max_months for the tier.
    evidence_fields:
    - lease_contracts.days_past_due
    - lease_contracts.maturity_extension_months_used
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
  - id: ext_window
    applies_to:
