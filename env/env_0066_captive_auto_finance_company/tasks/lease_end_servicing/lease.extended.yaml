events:
- type: lease_contract_booked
  target: lease_contracts
  mutation: create
  meaning: A closed-end consumer lease written by a Kestrel dealer is booked for funding review.
  grain: one row per lease; this write changes that lease record
  fields:
    account_number: as disclosed on the lease
    variant_name: as disclosed on the lease
    vin: as disclosed on the lease
    vehicle_year: as disclosed on the lease
    vehicle_model: as disclosed on the lease
    vehicle_class: as disclosed on the lease
    lease_state: as disclosed on the lease
    lease_date: as disclosed on the lease
    first_payment_date: as disclosed on the lease
    maturity_date: as disclosed on the lease
    term_months: as disclosed on the lease
    msrp: as disclosed on the lease
    gross_cap_cost: as disclosed on the lease
    cap_cost_reduction: as disclosed on the lease
    adjusted_cap_cost: as disclosed on the lease
    residual_value: as disclosed on the lease
    money_factor: as disclosed on the lease
    base_monthly_payment: as disclosed on the lease
    monthly_use_tax: as disclosed on the lease
    total_monthly_payment: as disclosed on the lease
    use_tax_rate_pct: as disclosed on the lease
    annual_mileage_allowance: as disclosed on the lease
    excess_mileage_rate: as disclosed on the lease
    odometer_at_delivery: as disclosed on the lease
    disposition_fee: as disclosed on the lease
    purchase_option_fee: as disclosed on the lease
    purchase_option_price: as disclosed on the lease
    acquisition_fee: as disclosed on the lease
    security_deposit: as disclosed on the lease
    due_day: as disclosed on the lease
    late_charge_max_amount: as disclosed on the lease
    nsf_fee_max_amount: as disclosed on the lease
    title_state: as disclosed on the lease
  triggers: []
- type: lease_contract_funded
  target: lease_contracts
  mutation:
    transition:
      from: pending_funding
      to: active
  meaning: The lease passes funding review and the dealer is paid.
  grain: one row per lease; this write changes that lease record
  fields:
    next_due_date: first monthly payment due date
  triggers:
  - event: lease:lease_funding
    map: {}
- type: lease_maturity_extended
  target: lease_contracts
  mutation:
    transition:
      from: active
      to: maturity_extended
  meaning: A month-to-month maturity extension is granted.
  grain: one row per lease; this write changes that lease record
  fields:
    maturity_date: extended maturity
    maturity_extension_months_used: months granted so far
  triggers: []
- type: lease_extension_updated
  target: lease_contracts
  mutation: update
  meaning: Further extension months are added to a lease already in maturity extension.
  grain: one row per lease; this write changes that lease record
  fields:
    maturity_date: extended maturity
    maturity_extension_months_used: months granted so far
  triggers: []
- type: lease_vehicle_turned_in
  target: lease_contracts
  mutation:
    transition:
    - from: active
      to: returned
    - from: maturity_extended
      to: returned
  meaning: The lessee turns the vehicle in at or near the scheduled end.
  grain: one row per lease; this write changes that lease record
  fields:
    turn_in_date: turn-in date
    turn_in_odometer: odometer statement reading
    termination_type: scheduled_end or pull_ahead
  triggers:
  - event: lease:lease_return_credit
    map: {}
- type: lease_early_terminated
  target: lease_contracts
  mutation:
    transition:
      from: active
      to: early_terminated
  meaning: The lessee turns the vehicle in before the scheduled turn-in window.
  grain: one row per lease; this write changes that lease record
  fields:
    turn_in_date: turn-in date
    turn_in_odometer: odometer statement reading
    termination_type: early_termination
    realized_value: wholesale value realised
  triggers:
  - event: lease:lease_return_credit
    map: {}
- type: lease_purchased
  target: lease_contracts
  mutation:
    transition:
    - from: active
      to: purchased
    - from: maturity_extended
      to: purchased
  meaning: The purchase option is exercised and paid.
  grain: one row per lease; this write changes that lease record
  fields:
    purchase_date: purchase date
    termination_type: purchase
  triggers: []
- type: lease_repossessed
  target: lease_contracts
  mutation:
    transition:
      from: active
      to: repossessed
  meaning: The leased vehicle is recovered after default.
  grain: one row per lease; this write changes that lease record
  fields:
    repossession_date: recovery date
    termination_type: repossession
  triggers:
  - event: lease:lease_repo_expense
    map:
      fee_type: repossession_agency_fee
- type: lease_reinstated
  target: lease_contracts
  mutation:
    transition:
      from: repossessed
      to: active
  meaning: The lease is reinstated after repossession.
  grain: one row per lease; this write changes that lease record
  fields:
    reinstatements_used: incremented by one
    termination_type: none
  triggers: []
- type: lease_closed
  target: lease_contracts
  mutation:
    transition:
    - from: returned
      to: closed
    - from: early_terminated
      to: closed
    - from: purchased
      to: closed
    - from: repossessed
      to: closed
  meaning: The lease closes once nothing remains owed and title matters are complete.
  grain: one row per lease; this write changes that lease record
  fields:
    closed_date: closing date
  triggers: []
- type: lease_charged_off
  target: lease_contracts
  mutation:
    transition:
    - from: returned
      to: charged_off
    - from: early_terminated
      to: charged_off
    - from: repossessed
      to: charged_off
  meaning: Unpaid lease-end or post-sale balances are charged off.
  grain: one row per lease; this write changes that lease record
  fields:
    closed_date: charge-off date
  triggers: []
- type: lease_inspection_recorded
  target: lease_contracts
  mutation: update
  meaning: The date of the complimentary advance inspection is recorded on the lease.
  grain: one row per lease; this write changes that lease record
  fields:
    advance_inspection_date: inspection date
  triggers: []
- type: lease_funding
  target: lease_transactions
  meaning: The adjusted capitalized cost is booked as the opening lease balance.
  grain: one row per lease funding
  distinguish_by:
  - txn_date
  fields:
    txn_date: funding date
    amount: adjusted capitalized cost
  account: lease_balance
  direction: in
  triggers: []
- type: lease_payment
  target: lease_transactions
  meaning: A payment posts to the lease.
  grain: one row per payment received
  distinguish_by:
  - txn_date
  - amount
  - payment_channel
  - funding_account_last4
  - payment_purpose
  fields:
    txn_date: posting date
    amount: payment amount
    payment_channel: channel
    funding_account_last4: source account last four
    payment_purpose: purpose
    depreciation_applied: depreciation portion
    rent_charge_applied: rent charge portion
    tax_applied: tax portion
    fees_applied: fees portion
    convenience_fee: channel fee
    sales_tax_amount: sales tax on a purchase
  account: lease_balance
  direction: out
  triggers:
  - event: lease:lease_purchased
    when:
      payment_purpose: purchase
    map:
      purchase_date: txn_date
  - event: lease:lease_reinstated
    when:
      payment_purpose: reinstatement
    map: {}
  - event: lease:lease_fee_payment
    when:
      fees_applied:
        not: 0.0
    map:
      amount: fees_applied
      txn_date: txn_date
      payment_txn_id: lease_txn_id
- type: lease_payment_returned
  target: lease_transactions
  meaning: A posted payment is dishonoured and reversed.
  grain: one row per dishonoured payment
  distinguish_by:
  - reversed_txn_id
  fields:
    txn_date: return date
    amount: amount reversed
    reversed_txn_id: the dishonoured payment
    return_reason: bank reason
  account: lease_balance
  direction: in
  triggers:
  - event: lease:lease_returned_payment_fee
    when:
      return_reason:
      - insufficient_funds
      - account_closed
      - stop_payment
    map:
      reversed_txn_id: reversed_txn_id
      fee_type: returned_payment_fee
- type: lease_late_charge
  target: lease_transactions
  meaning: A late charge is assessed on a monthly payment not paid within the grace period.
  grain: one row per late monthly payment
  distinguish_by:
  - installment_due_date
  fields:
    txn_date: assessment date
    amount: late charge
    installment_due_date: the late payment
    fee_type: late_charge
  account: fees_due
  direction: in
  triggers: []
- type: lease_returned_payment_fee
  target: lease_transactions
  meaning: A returned-payment fee is assessed.
  grain: one row per dishonoured payment
  distinguish_by:
  - reversed_txn_id
  fields:
    txn_date: assessment date
    amount: fee
    reversed_txn_id: the dishonoured payment
    fee_type: returned_payment_fee
  account: fees_due
  direction: in
  triggers: []
- type: lease_fee_payment
  target: lease_transactions
  meaning: The fee portion of a payment is applied to term fees.
  grain: one row per payment carrying a fee portion
  distinguish_by:
  - payment_txn_id
  fields:
    txn_date: posting date
    amount: fee portion
    payment_txn_id: the payment
  account: fees_due
  direction: out
  triggers: []
- type: lease_fee_waiver
  target: lease_transactions
  meaning: A term fee is waived in whole.
  grain: one row per fee waived
  distinguish_by:
  - waived_txn_id
  fields:
    txn_date: waiver date
    amount: amount waived
    waived_txn_id: the fee waived
    waiver_reason: reason
    fee_type: type waived
  account: fees_due
  direction: out
  triggers: []
- type: lease_purchase_quote
  target: lease_transactions
  meaning: A purchase or early termination quote is produced.
  grain: one row per quote issued
  distinguish_by:
  - txn_date
  - quote_type
  - purchaser_type
  fields:
    txn_date: quote date
    amount: quoted amount
    quote_type: kind
    purchaser_type: buyer
    quote_good_through_date: good-through date
    sales_tax_amount: sales tax included
  triggers: []
- type: lease_return_credit
  target: lease_transactions
  meaning: The remaining lease balance is extinguished when the vehicle comes back.
  grain: one row per turn-in
  distinguish_by:
  - txn_date
  fields:
    txn_date: turn-in date
    amount: lease balance extinguished
  account: lease_balance
  direction: out
  triggers: []
- type: lease_end_charge
  target: lease_transactions
  meaning: An end-of-term or early termination charge is billed.
  grain: one row per charge type per lease end
  distinguish_by:
  - fee_type
  fields:
    txn_date: billing date
    amount: charge
    fee_type: charge type
    miles_over: miles over the allowance
  account: end_of_term_due
  direction: in
  triggers: []
- type: lease_end_charge_waiver
  target: lease_transactions
  meaning: An end-of-term charge is waived in whole or reduced by forgiveness.
  grain: one row per charge waived
  distinguish_by:
  - waived_txn_id
  - waiver_reason
  fields:
    txn_date: waiver date
    amount: amount waived
    waived_txn_id: the charge waived
    waiver_reason: reason
    qualifying_account_number: qualifying new account for loyalty
  account: end_of_term_due
  direction: out
  triggers: []
- type: lease_security_deposit_applied
  target: lease_transactions
  meaning: The security deposit is applied to end-of-term charges.
  grain: one row per lease end
  distinguish_by:
  - txn_date
  fields:
    txn_date: application date
    amount: deposit applied
  account: end_of_term_due
  direction: out
  triggers: []
- type: lease_security_deposit_refund
  target: lease_transactions
  meaning: The unapplied part of the security deposit is refunded.
  grain: one row per lease end
  distinguish_by:
  - txn_date
  fields:
    txn_date: refund date
    amount: deposit refunded
    payment_channel: refund channel
  triggers: []
- type: lease_end_of_term_payment
  target: lease_transactions
  meaning: A payment toward end-of-term charges posts.
  grain: one row per payment received
  distinguish_by:
  - txn_date
  - amount
  - payment_channel
  - funding_account_last4
  fields:
    txn_date: posting date
    amount: payment
    payment_channel: channel
    funding_account_last4: source account last four
  account: end_of_term_due
  direction: out
  triggers: []
- type: lease_refund_credit
  target: lease_transactions
  meaning: A financed Kestrel Care cancellation refund is credited to the lease balance.
  grain: one row per Care contract refund
  distinguish_by:
  - care_contract_id
  fields:
    txn_date: credit date
    amount: refund credited
    care_contract_id: the cancelled Care contract
  account: lease_balance
  direction: out
  triggers: []
- type: lease_repo_expense
  target: lease_transactions
  meaning: A repossession or storage expense is charged to a repossessed lease.
  grain: one row per expense item
  distinguish_by:
  - fee_type
  - txn_date
  fields:
    txn_date: service date
    amount: expense
    fee_type: expense kind
  account: fees_due
  direction: in
  triggers: []
- type: lease_notice_mailed
  target: lease_transactions
  meaning: A lease-end options letter, end-of-term invoice or intent-to-sell notice is mailed.
  grain: one row per notice
  distinguish_by:
  - notice_type
  - txn_date
  fields:
    txn_date: mailing date
    notice_type: notice kind
  triggers: []
- type: lease_maturity_extension
  target: lease_transactions
  meaning: A maturity extension grant is recorded.
  grain: one row per extension grant
  distinguish_by:
  - txn_date
  fields:
    txn_date: grant date
    extension_months: months granted
    new_maturity_date: maturity after the grant
  triggers:
  - event: lease:lease_extension_updated
    map:
      maturity_date: new_maturity_date
- type: lease_inspection_completed
  target: lease_inspections
  meaning: A vehicle inspection report is completed.
  grain: one row per inspection report
  distinguish_by:
  - inspection_type
  - inspection_date
  fields:
    inspection_type: advance or final
    inspection_date: date
    odometer_reading: odometer
    tire_tread_min_32nds: shallowest tread
    report_reference: report reference
  triggers:
  - event: lease:lease_inspection_recorded
    when:
      inspection_type: advance_complimentary
    map:
      advance_inspection_date: inspection_date
- type: lease_wear_item_assessed
  target: lease_wear_items
  meaning: One wear item is recorded on an inspection report.
  grain: one row per item per inspection report
  distinguish_by:
  - lease_inspection_id
  - item_category
  - item_location
  fields:
    lease_inspection_id: report
    item_category: category
    item_location: position
    severity: within standard or excess
    schedule_charge: scheduled charge
    item_status: assessed
  triggers: []
- type: lease_wear_item_adjusted
  target: lease_wear_items
  meaning: An assessed wear item is removed or reduced after a dispute review.
  grain: one row per adjusted item
  distinguish_by:
  - original_wear_item_id
  fields:
    original_wear_item_id: the item adjusted
    lease_inspection_id: report
    item_category: category
    item_location: position
    severity: revised severity
    schedule_charge: revised charge
    item_status: removed_on_dispute or reduced_on_dispute
  triggers: []
measures:
- id: lease_msr_unpaid_payment_portion
  window: the single monthly payment identified by its due date, as of the assessment date
  measure: total_monthly_payment less the payment amounts applied to that monthly payment
- id: lease_msr_consecutive_on_time
  window: payment due dates after the installment_due_date of the most recent lease_late_charge (or from first_payment_date
    when there is none) up to today
  measure: count of payment due dates in the window
- id: lease_msr_courtesy_waivers_lookback
  window: the 12 calendar months ending on today's date, inclusive
  measure: count of lease_fee_waiver transactions with waiver_reason courtesy_on_time_history in the window
- id: lease_msr_months_elapsed
  window: from lease_date to turn_in_date
  measure: number of whole months elapsed, counting a partial final month as a whole month
- id: lease_msr_miles_over
  window: the lease from delivery to turn-in
  measure: turn_in_odometer less odometer_at_delivery less the mileage allowance (annual_mileage_allowance times
    term_months plus maturity_extension_months_used, divided by 12; prorated by lease_msr_months_elapsed for an
    early termination or pull-ahead), never below zero
- id: lease_msr_excess_wear_total
  window: the turn_in_final inspection report of the lease
  measure: sum of schedule_charge over lease_wear_item_assessed rows with severity excess, after replacing each
    item that has a lease_wear_item_adjusted row with that adjustment's schedule_charge (0.00 when removed)
policies:
- id: lease_agg_multi_holding
  subject:
  - lease_contract_booked
  rule: A customer may be the lessee on at most max_per_customer open Kestrel leases at the same time. A lease counts
    as open in every status except closed and charged_off; a lease pending_funding counts. A booking over the cap
    is declined at funding review; retail, pre-owned and balloon contracts do not count toward this cap.
  eligibility: []
  params:
    max_per_customer: 3
- id: lease_agg_relationship_exposure
  subject:
  - lease_contract_booked
  - lease_contract_funded
  rule: Relationship exposure is the adjusted_lease_balance of every lease of the customer in active or maturity_extended
    status, plus principal_balance on every open retail, pre-owned and balloon contract of the customer, plus the
    adjusted_cap_cost of the lease being booked. Relationship exposure must not exceed the relationship_exposure_cap
    of the lease tier being booked. When it would, the lease is not funded and no partial approval is given.
  eligibility:
  - id: exposure_cap
    applies_to:
    - lease_contract_booked
    - lease_contract_funded
    kind: authorization
    condition: Relationship exposure must not exceed the relationship_exposure_cap of the lease tier being booked.
    evidence_fields:
    - lease_contracts.adjusted_cap_cost
    - lease_contracts.customer_id
    - retail_contracts.principal_balance
    - preowned_contracts.principal_balance
    - balloon_contracts.principal_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.customer_id
      action_bindings:
