extended_policies:
- id: lease_ext_wear_forgiveness
  base_policy_refs:
  - lease_end_of_term_charges
  - lease_turn_in_and_inspection
  - lease_inspection_dispute
  overwrite:
  - base_policy: lease_end_of_term_charges
    superseded_clause: wear_forgiveness_cap for the tier is then waived from it as wear_forgiveness, up to the amount
      billed.
    replaced_by: For the wear forgiveness waiver of a turn-in, and only for that waiver, the amount waived is figured
      as this rule states; the excess wear charge itself, the disposition fee and its loyalty waiver remain under
      the base rule.
  - base_policy: lease_end_of_term_charges
    superseded_clause: loyalty_wear_forgiveness_cap replaces wear_forgiveness_cap
    replaced_by: For the wear forgiveness waiver of a turn-in, and only for that waiver, the amount waived is figured
      as this rule states; the excess wear charge itself, the disposition fee and its loyalty waiver remain under
      the base rule.
  trigger: state_due
  subject:
  - lease_end_charge_waiver
  computes: amount
  target_tool: post_wear_forgiveness_925a15e3
  params:
    punctual_addition_clean: 150.0
    punctual_addition_one: 75.0
    tenure_long_payments: 48
    tenure_mid_payments: 24
    tenure_addition_long: 200.0
    tenure_addition_mid: 100.0
    low_mileage_margin_miles: 3000
    low_mileage_addition_high: 150.0
    low_mileage_addition_std: 75.0
    per_item_limit: 100.0
    per_item_threshold: 5
    forgiveness_share: 0.5
    half_cent_guard: 1.0e-06
  rule: 'A wear forgiveness waiver can be recorded only while the lease status is returned or early_terminated,
    only against the excess wear charge billed for the turn-in, and only once for that charge; it is booked as one
    waiver with waiver_reason wear_forgiveness that names the excess wear charge and carries a qualifying account
    number: when the wear forgiveness cap is the loyalty cap or the halfway cap below, it is the account_number
    of the contract that meets that cap''s conditions, an active Kestrel new-vehicle retail contract taking precedence
    over an active Kestrel balloon contract when both meet them; when the cap is the tier''s wear_forgiveness_cap
    the qualifying account number is left empty; when wear forgiveness figures to zero no waiver is booked. For
    the wear forgiveness waiver of a turn-in, and only for that waiver, the amount waived is figured as this rule
    states; the excess wear charge itself, the disposition fee and its loyalty waiver remain under the base rule.
    Wherever this rule reads a contract of another Kestrel product in a stated status, it reads the first contract
    in that status that the customer''s records for that product list. Wear forgiveness is the excess wear charge
    billed for the turn-in, never more than the tier''s wear_forgiveness_cap and never below zero, rounded to the
    nearest cent with a half cent rounded up. Where a schedule below applies to the customer, its cap or its forgiveness
    basis takes the place of the one in the standard method, and every amount a schedule adds is added to the cap
    before the forgiveness basis is applied against that total limit. The wear forgiveness cap is the tier''s loyalty_wear_forgiveness_cap
    when the customer holds an active Kestrel new-vehicle retail contract whose contract_date falls within loyalty_window_days
    calendar days before or after turn_in_date and that shows days_past_due of 0, or an active Kestrel balloon contract
    meeting the same two conditions; it is halfway between the tier''s wear_forgiveness_cap and its loyalty_wear_forgiveness_cap
    when no contract meets both conditions but an active Kestrel new-vehicle retail or balloon contract has its
    contract_date within that window; in every other case it is the tier''s wear_forgiveness_cap. The tier''s wear_forgiveness_cap
    and loyalty_wear_forgiveness_cap enter wear forgiveness only as this cap schedule assigns them; meeting the
    loyalty condition alone does not put the loyalty cap in place. The days between turn_in_date and a contract_date
    are counted in calendar days in either direction, the later date counted and the earlier one not. The wear forgiveness
    punctual-payment addition is the clean-record addition when no late charge was ever assessed on the lease, the
    one-late-charge addition when exactly one late charge was assessed on the lease, and nothing when two or more
    were, a late charge counting even if it was later waived. The wear forgiveness basis is per item when the lease''s
    complimentary advance inspection was performed and the lease''s turn-in_final inspection report records more
    than the per-item threshold of excess items: each excess item is forgiven up to the per-item limit, and the
    items'' forgiven amounts together never exceed the excess wear charge or the total limit; it is a share of the
    charge when no complimentary advance inspection was performed: the forgiveness share of the excess wear charge
    is forgiven, never more than the total limit; in every other case it is aggregate, the excess wear charge forgiven
    up to the total limit. The excess items counted are those recorded as assessed with severity excess on the turn-in_final
    report, an item removed on an inspection dispute not counted; where two turn-in_final reports share the latest
    inspection_date, the first one recorded is read, and a lease with no turn-in_final report counts no item. The
    wear forgiveness tenure addition is the long-tenure addition when the customer holds a paid-in-full Kestrel
    new-vehicle retail contract whose payments_made_count is at least the long-tenure payment count, the mid-tenure
    addition when that count is at least the mid-tenure payment count but below the long-tenure payment count, and
    nothing when the customer holds no paid-in-full Kestrel new-vehicle retail contract or its count is below the
    mid-tenure payment count. The wear forgiveness low-mileage addition is the high low-mileage addition when the
    miles driven, turn_in_odometer less odometer_at_delivery, fall short of the mileage allowance, annual_mileage_allowance
    times the sum of term_months and the extension months granted on the lease''s maturity extensions divided by
    12, by at least the low-mileage margin; it is the standard low-mileage addition when the miles driven fall short
    of that allowance by less than the low-mileage margin; it is nothing when the miles driven reach or exceed that
    allowance.'
  prerequisite: []
  cross_category:
  - category: retail
    as: branch
    reads:
    - contract_date
    - days_past_due
    - status
    - payments_made_count
    note: The wear forgiveness cap reads the active new-vehicle retail contract's date and days past due; the tenure
      addition reads a paid-in-full retail contract's payments_made_count.
  - category: balloon
    as: branch
    reads:
    - contract_date
    - days_past_due
    - status
    note: The wear forgiveness cap also qualifies an active balloon contract dated within the window.
  compute:
  - wear_charge: SUM('lease_transactions','amount', event_type='lease_end_charge', fee_type='excess_wear_charge')
  - retail_date: CFIELD('retail','contract_date', status='active')
  - retail_dpd: CFIELD('retail','days_past_due', status='active')
  - balloon_date: CFIELD('balloon','contract_date', status='active')
  - balloon_dpd: CFIELD('balloon','days_past_due', status='active')
  - retail_in_window: retail_date != None and ABS(DAYS(F('turn_in_date'), retail_date)) <= P('loyalty_window_days')
  - balloon_in_window: balloon_date != None and ABS(DAYS(F('turn_in_date'), balloon_date)) <= P('loyalty_window_days')
  - forgiveness_cap: P('loyalty_wear_forgiveness_cap') if ((retail_in_window and retail_dpd == 0) or (balloon_in_window
      and balloon_dpd == 0)) else ((P('wear_forgiveness_cap') + P('loyalty_wear_forgiveness_cap')) / 2 if (retail_in_window
      or balloon_in_window) else P('wear_forgiveness_cap'))
  - late_count: COUNT('lease_transactions', event_type='lease_late_charge')
  - punctual_addition: K('punctual_addition_clean') if late_count == 0 else (K('punctual_addition_one') if late_count
      == 1 else 0)
  - adv_date: LATEST('lease_inspections','inspection_date', date_field='inspection_date', inspection_type='advance_complimentary')
  - final_report: LATEST('lease_inspections','lease_inspection_id', date_field='inspection_date', inspection_type='turn_in_final')
  - excess_item_count: MX(0, COUNT('lease_wear_items', event_type='lease_wear_item_assessed', severity='excess',
      lease_inspection_id=final_report) - COUNT('lease_wear_items', event_type='lease_wear_item_adjusted', item_status='removed_on_dispute',
      lease_inspection_id=final_report))
  - forgivable_wear: MN(wear_charge, K('per_item_limit') * excess_item_count) if (adv_date != None and excess_item_count
      > K('per_item_threshold')) else (wear_charge * K('forgiveness_share') if adv_date == None else wear_charge)
  - tenure_payments: CFIELD('retail','payments_made_count', status='paid_in_full')
  - tenure_addition: K('tenure_addition_long') if (tenure_payments != None and tenure_payments >= K('tenure_long_payments'))
      else (K('tenure_addition_mid') if (tenure_payments != None and tenure_payments >= K('tenure_mid_payments'))
      else 0)
  - miles_driven: F('turn_in_odometer') - F('odometer_at_delivery')
  - mileage_allowance: F('annual_mileage_allowance') * (F('term_months') + SUM('lease_transactions','extension_months',
      event_type='lease_maturity_extension')) / 12
  - low_mileage_addition: K('low_mileage_addition_high') if mileage_allowance - miles_driven >= K('low_mileage_margin_miles')
      else (K('low_mileage_addition_std') if mileage_allowance - miles_driven > 0 else 0)
  - forgiveness_allowance: forgiveness_cap + punctual_addition + tenure_addition + low_mileage_addition
  - result: RND(MX(0, MN(forgivable_wear, forgiveness_allowance)) + K('half_cent_guard'), 2)
  compute_basis:
    wear_charge: the excess wear charge billed for the turn-in
    retail_date: Wherever this rule reads a contract of another Kestrel product in a stated status, it reads the
      first contract in that status that the customer's records for that product list.
    retail_dpd: and that shows days_past_due of 0
    balloon_date: or an active Kestrel balloon contract meeting the same two conditions
    balloon_dpd: or an active Kestrel balloon contract meeting the same two conditions
    retail_in_window: The days between turn_in_date and a contract_date are counted in calendar days in either direction,
      the later date counted and the earlier one not.
    balloon_in_window: The days between turn_in_date and a contract_date are counted in calendar days in either
      direction, the later date counted and the earlier one not.
    forgiveness_cap: The wear forgiveness cap is the tier's loyalty_wear_forgiveness_cap when the customer holds
      an active Kestrel new-vehicle retail contract whose contract_date falls within loyalty_window_days calendar
      days before or after turn_in_date and that shows days_past_due of 0, or an active Kestrel balloon contract
      meeting the same two conditions; it is halfway between the tier's wear_forgiveness_cap and its loyalty_wear_forgiveness_cap
      when no contract meets both conditions but an active Kestrel new-vehicle retail or balloon contract has its
      contract_date within that window; in every other case it is the tier's wear_forgiveness_cap.
    late_count: a late charge counting even if it was later waived
    punctual_addition: The wear forgiveness punctual-payment addition is the clean-record addition when no late
      charge was ever assessed on the lease, the one-late-charge addition when exactly one late charge was assessed
      on the lease, and nothing when two or more were
    adv_date: when no complimentary advance inspection was performed
    forgivable_wear: 'The wear forgiveness basis is per item when the lease''s complimentary advance inspection
      was performed and the lease''s turn-in_final inspection report records more than the per-item threshold of
      excess items: each excess item is forgiven up to the per-item limit, and the items'' forgiven amounts together
      never exceed the excess wear charge or the total limit; it is a share of the charge when no complimentary
      advance inspection was performed: the forgiveness share of the excess wear charge is forgiven, never more
      than the total limit; in every other case it is aggregate, the excess wear charge forgiven up to the total
      limit.'
    tenure_payments: Wherever this rule reads a contract of another Kestrel product in a stated status, it reads
      the first contract in that status that the customer's records for that product list.
    tenure_addition: The wear forgiveness tenure addition is the long-tenure addition when the customer holds a
      paid-in-full Kestrel new-vehicle retail contract whose payments_made_count is at least the long-tenure payment
      count, the mid-tenure addition when that count is at least the mid-tenure payment count but below the long-tenure
      payment count, and nothing when the customer holds no paid-in-full Kestrel new-vehicle retail contract or
      its count is below the mid-tenure payment count.
    miles_driven: the miles driven, turn_in_odometer less odometer_at_delivery
    mileage_allowance: the mileage allowance, annual_mileage_allowance times the sum of term_months and the extension
      months granted on the lease's maturity extensions divided by 12
    low_mileage_addition: The wear forgiveness low-mileage addition is the high low-mileage addition when the miles
      driven, turn_in_odometer less odometer_at_delivery, fall short of the mileage allowance, annual_mileage_allowance
      times the sum of term_months and the extension months granted on the lease's maturity extensions divided by
      12, by at least the low-mileage margin; it is the standard low-mileage addition when the miles driven fall
      short of that allowance by less than the low-mileage margin; it is nothing when the miles driven reach or
      exceed that allowance.
    forgiveness_allowance: every amount a schedule adds is added to the cap before the forgiveness basis is applied
      against that total limit
    result: Wear forgiveness is the excess wear charge billed for the turn-in, never more than the tier's wear_forgiveness_cap
      and never below zero, rounded to the nearest cent with a half cent rounded up.
    final_report: where two turn-in_final reports share the latest inspection_date, the first one recorded is read,
      and a lease with no turn-in_final report counts no item
    excess_item_count: The excess items counted are those recorded as assessed with severity excess on the turn-in_final
      report, an item removed on an inspection dispute not counted
  factors:
  - id: brand_return_cap
    effect: parameter
    decides: forgiveness_cap
    bindings:
    - retail_date
    - retail_dpd
    - balloon_date
    - balloon_dpd
    - retail_in_window
    - balloon_in_window
    - forgiveness_cap
    ladder:
    - when: an active Kestrel new-vehicle retail contract, or an active Kestrel balloon contract, dated within loyalty_window_days
        calendar days before or after turn_in_date AND showing days_past_due of 0
      value: P('loyalty_wear_forgiveness_cap')
    - when: no contract meets both conditions, but an active Kestrel new-vehicle retail or balloon contract is dated
        within that window
      value: (P('wear_forgiveness_cap') + P('loyalty_wear_forgiveness_cap')) / 2
    - when: otherwise
      value: P('wear_forgiveness_cap')
    baseline:
      forgiveness_cap: P('wear_forgiveness_cap')
    evidence:
    - cross_category
    - date
    cross_difficulty: retail
  - id: punctual_addition
    effect: parameter
    decides: punctual_addition
    bindings:
    - late_count
    - punctual_addition
    ladder:
    - when: no late charge was ever assessed on the lease
      value: K('punctual_addition_clean')
    - when: exactly one late charge was assessed on the lease
      value: K('punctual_addition_one')
    - when: otherwise (two or more late charges)
      value: '0'
    baseline:
      punctual_addition: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: forgiveness_basis
    effect: method
    decides: forgivable_wear
    bindings:
    - adv_date
    - final_report
    - excess_item_count
    - forgivable_wear
    ladder:
    - when: the complimentary advance inspection was performed AND the turn-in_final report records more than the
        per-item threshold of excess items
      method: 'per item: each excess item forgiven up to the per-item limit, together never more than the excess
        wear charge or the total limit'
    - when: no complimentary advance inspection was performed
      method: 'share of the charge: the forgiveness share of the excess wear charge, never more than the total limit'
    - when: otherwise
      method: 'aggregate: the excess wear charge forgiven up to the total limit'
    baseline:
      forgivable_wear: wear_charge
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: tenure_addition
    effect: parameter
    decides: tenure_addition
    bindings:
    - tenure_payments
    - tenure_addition
    ladder:
    - when: a paid-in-full Kestrel new-vehicle retail contract with payments_made_count at least the long-tenure
        payment count
      value: K('tenure_addition_long')
    - when: a paid-in-full Kestrel new-vehicle retail contract with payments_made_count at least the mid-tenure
        payment count but below the long-tenure count
      value: K('tenure_addition_mid')
    - when: otherwise
      value: '0'
    baseline:
      tenure_addition: '0'
    evidence:
    - cross_category
    cross_difficulty: retail
  - id: low_mileage_addition
    effect: parameter
    decides: low_mileage_addition
    bindings:
    - miles_driven
    - mileage_allowance
    - low_mileage_addition
    ladder:
    - when: the miles driven fall short of the mileage allowance by at least the low-mileage margin
      value: K('low_mileage_addition_high')
    - when: the miles driven fall short of the allowance by less than the margin
      value: K('low_mileage_addition_std')
    - when: otherwise (the miles driven reach or exceed the allowance)
      value: '0'
    baseline:
      low_mileage_addition: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: Wear forgiveness is the excess wear charge billed for the turn-in, never more than the tier's wear_forgiveness_cap
      and never below zero, rounded to the nearest cent with a half cent rounded up.
    params:
    - wear_forgiveness_cap
  inputs:
    history:
    - table: lease_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: lease_end_charge
        fee_type: excess_wear_charge
    - table: lease_transactions
      aggregate: count
      field: lease_txn_id
      filters:
        event_type: lease_late_charge
    - table: lease_inspections
      aggregate: latest
      field: inspection_date
      filters:
        inspection_type: advance_complimentary
    - table: lease_wear_items
      aggregate: sum
      field: schedule_charge
      filters:
        event_type: lease_wear_item_assessed
        severity: excess
    - table: lease_transactions
      aggregate: sum
      field: extension_months
      filters:
        event_type: lease_maturity_extension
    cross_category:
    - retail
    - balloon
- id: lease_ext_charge_off_hold
  base_policy_refs:
  - lease_end_of_term_charges
  - lease_payment_posting
  overwrite:
  - base_policy: lease_end_of_term_charges
    superseded_clause: a balance still unpaid end_of_term_charge_off_days after turn_in_date is charged off.
    replaced_by: For a lease whose end-of-term balance receives a hold payment, and only for such a lease, the balance
      left after the hold payment is not charged off until hold_period_days calendar days after the hold payment
      posts; a balance enrolled in a lease-end installment plan never receives a hold payment and is charged off
      as the installment plan rule states, and every other end-of-term balance still unpaid end_of_term_charge_off_days
      after turn_in_date is charged off.
  trigger: on_request
  subject:
  - lease_end_of_term_payment
  computes: amount
  target_tool: pay_end_of_term_hold_a939b773
  params:
    hold_start_days: 30
    early_stage_days: 45
    mid_stage_days: 60
    hold_rate_early: 0.25
    hold_rate_mid: 0.35
    hold_rate_standard: 0.5
    relationship_relief_full: 0.1
    relationship_relief_partial: 0.05
    returned_relief_clean: 0.05
    returned_relief_single: 0.02
    large_balance_payments: 2
    hold_period_days: 60
    half_cent_guard: 1.0e-06
  rule: A hold payment is the lessee's own payment toward the end-of-term balance of a lease whose end-of-term invoice's
    due date, its mailing date plus end_of_term_payment_days, passed more than the hold-start day count earlier
    and on which no end-of-term payment has posted since that invoice was mailed; it is made by the lessee through
    the self-service payment line from the lessee's own bank account and booked as one end-of-term payment. A lessee
    who asks to keep such a lease from being charged off without paying the whole balance is offered the hold payment;
    a lease outside that scope is outside this rule. For a lease whose end-of-term balance receives a hold payment,
    and only for such a lease, the balance left after the hold payment is not charged off until hold_period_days
    calendar days after the hold payment posts; a balance enrolled in a lease-end installment plan never receives
    a hold payment and is charged off as the installment plan rule states, and every other end-of-term balance still
    unpaid end_of_term_charge_off_days after turn_in_date is charged off. The days since the due date are counted
    from the day after the due date through today, and where the lease has more than one end-of-term invoice the
    latest mailing date is read. Wherever this rule reads a contract of another Kestrel product in a stated status,
    it reads the first contract in that status that the customer's records for that product list. The hold payment
    is fixed only after every excess wear charge billed for the turn-in carries the wear forgiveness waiver owed
    on it. The hold payment is the standard hold rate times the invoiced end-of-term balance, rounded to the nearest
    cent with a half cent rounded up. The invoiced end-of-term balance is the end-of-term charges billed on the
    day the end-of-term invoice was mailed, less every end-of-term charge waiver, security deposit application and
    end-of-term payment posted on the lease, a waiver of a term fee such as a late charge not being taken off; a
    charge billed on any other day is not part of it. Where a schedule below applies to the lessee, the rate or
    the shape it sets takes the place of the one in the standard method, and every relief a schedule grants is subtracted
    from the hold rate before the rate is applied. The hold rate set by the delinquency stage is the early-stage
    hold rate when the due date passed more than the hold-start day count but no more than the early-stage day count
    earlier; it is the mid-stage hold rate when the due date passed more than the early-stage day count but no more
    than the mid-stage day count earlier; it is the standard hold rate when the due date passed more than the mid-stage
    day count earlier. The hold rate relationship relief is the full relationship relief when the customer holds
    an active Kestrel new-vehicle retail or balloon contract that shows days_past_due of 0, the partial relationship
    relief when the customer holds no such contract but holds an active Kestrel pre-owned retail contract that shows
    days_past_due of 0, and nothing otherwise. The hold rate returned-payment relief is the clean returned-payment
    relief when no payment on the lease was ever returned, the single returned-payment relief when exactly one payment
    on the lease was returned, and nothing when two or more were. The shape of the hold payment is one total_monthly_payment
    plus the hold rate times the part of the invoiced end-of-term balance above one total_monthly_payment when that
    balance exceeds the large-balance payment count times total_monthly_payment; it is the whole invoiced end-of-term
    balance when that balance is no more than one total_monthly_payment; in every other case it is the hold rate
    times the invoiced end-of-term balance.
  prerequisite:
  - problem: lease_ext_wear_forgiveness
    kind: value_input
    gate: end_balance
    form: state
    policy_source: The hold payment is fixed only after every excess wear charge billed for the turn-in carries
      the wear forgiveness waiver owed on it.
    condition: Every lease_end_charge row with fee_type excess_wear_charge on the lease has a lease_end_charge_waiver
      row with waiver_reason wear_forgiveness whose waived_txn_id names it whenever the wear forgiveness rule figures
      a positive amount for it.
    resolved_by: post_wear_forgiveness_925a15e3
    effect: The waiver lowers end_of_term_balance by the wear forgiveness amount, so the end_balance binding (and
      with it the hold shape and amount) changes.
  cross_category:
  - category: retail
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship relief reads the customer's active new-vehicle retail contract's days past due.
  - category: balloon
    as: branch
    reads:
    - status
    - days_past_due
    note: The relationship relief also counts an active balloon contract with no days past due.
  - category: preowned
    as: branch
    reads:
    - status
    - days_past_due
    note: The partial relationship relief reads an active pre-owned retail contract's days past due.
  compute:
  - invoice_date: LATEST('lease_transactions','txn_date', date_field='txn_date', event_type='lease_notice_mailed',
      notice_type='end_of_term_invoice')
  - end_balance: SUM('lease_transactions','amount', event_type='lease_end_charge', txn_date=invoice_date) - SUM('lease_transactions','amount',
      event_type='lease_end_charge_waiver') - SUM('lease_transactions','amount', event_type='lease_security_deposit_applied')
      - SUM('lease_transactions','amount', event_type='lease_end_of_term_payment')
  - days_past_invoice_due: (DAYS(invoice_date, NOW) - P('end_of_term_payment_days')) if invoice_date != None else
      0
  - stage_rate: K('hold_rate_early') if days_past_invoice_due <= K('early_stage_days') else (K('hold_rate_mid')
      if days_past_invoice_due <= K('mid_stage_days') else K('hold_rate_standard'))
  - retail_dpd: CFIELD('retail','days_past_due', status='active')
  - balloon_dpd: CFIELD('balloon','days_past_due', status='active')
  - preowned_dpd: CFIELD('preowned','days_past_due', status='active')
  - relationship_relief: K('relationship_relief_full') if (retail_dpd == 0 or balloon_dpd == 0) else (K('relationship_relief_partial')
      if preowned_dpd == 0 else 0)
  - returned_count: COUNT('lease_transactions', event_type='lease_payment_returned')
  - returned_relief: K('returned_relief_clean') if returned_count == 0 else (K('returned_relief_single') if returned_count
      == 1 else 0)
  - hold_rate: stage_rate - relationship_relief - returned_relief
  - shape_balance: SUM('lease_transactions','amount', event_type='lease_end_charge', txn_date=invoice_date) - SUM('lease_transactions','amount',
      event_type='lease_end_charge_waiver') - SUM('lease_transactions','amount', event_type='lease_security_deposit_applied')
      - SUM('lease_transactions','amount', event_type='lease_end_of_term_payment')
  - hold_fixed_part: F('total_monthly_payment') if shape_balance > K('large_balance_payments') * F('total_monthly_payment')
      else (end_balance if shape_balance <= F('total_monthly_payment') else 0)
  - hold_rated_part: (end_balance - F('total_monthly_payment')) if shape_balance > K('large_balance_payments') *
      F('total_monthly_payment') else (0 if shape_balance <= F('total_monthly_payment') else end_balance)
  - result: RND(hold_fixed_part + hold_rate * hold_rated_part + K('half_cent_guard'), 2)
  compute_basis:
    end_balance: The invoiced end-of-term balance is the end-of-term charges billed on the day the end-of-term invoice
      was mailed, less every end-of-term charge waiver, security deposit application and end-of-term payment posted
      on the lease, a waiver of a term fee such as a late charge not being taken off; a charge billed on any other
      day is not part of it.
    invoice_date: where the lease has more than one end-of-term invoice the latest mailing date is read
    days_past_invoice_due: The days since the due date are counted from the day after the due date through today
    stage_rate: The hold rate set by the delinquency stage is the early-stage hold rate when the due date passed
      more than the hold-start day count but no more than the early-stage day count earlier; it is the mid-stage
      hold rate when the due date passed more than the early-stage day count but no more than the mid-stage day
      count earlier; it is the standard hold rate when the due date passed more than the mid-stage day count earlier.
    retail_dpd: Wherever this rule reads a contract of another Kestrel product in a stated status, it reads the
      first contract in that status that the customer's records for that product list.
    balloon_dpd: an active Kestrel new-vehicle retail or balloon contract that shows days_past_due of 0
    preowned_dpd: an active Kestrel pre-owned retail contract that shows days_past_due of 0
    relationship_relief: The hold rate relationship relief is the full relationship relief when the customer holds
      an active Kestrel new-vehicle retail or balloon contract that shows days_past_due of 0, the partial relationship
      relief when the customer holds no such contract but holds an active Kestrel pre-owned retail contract that
      shows days_past_due of 0, and nothing otherwise.
    returned_count: when no payment on the lease was ever returned
    returned_relief: The hold rate returned-payment relief is the clean returned-payment relief when no payment
      on the lease was ever returned, the single returned-payment relief when exactly one payment on the lease was
      returned, and nothing when two or more were.
    hold_rate: every relief a schedule grants is subtracted from the hold rate before the rate is applied
    hold_fixed_part: The shape of the hold payment is one total_monthly_payment plus the hold rate times the part
      of the invoiced end-of-term balance above one total_monthly_payment when that balance exceeds the large-balance
      payment count times total_monthly_payment; it is the whole invoiced end-of-term balance when that balance
      is no more than one total_monthly_payment; in every other case it is the hold rate times the invoiced end-of-term
      balance.
    hold_rated_part: The shape of the hold payment is one total_monthly_payment plus the hold rate times the part
      of the invoiced end-of-term balance above one total_monthly_payment when that balance exceeds the large-balance
      payment count times total_monthly_payment; it is the whole invoiced end-of-term balance when that balance
      is no more than one total_monthly_payment; in every other case it is the hold rate times the invoiced end-of-term
      balance.
    result: The hold payment is the standard hold rate times the invoiced end-of-term balance, rounded to the nearest
      cent with a half cent rounded up.
    shape_balance: the part of the invoiced end-of-term balance above one total_monthly_payment when that balance
      exceeds the large-balance payment count times total_monthly_payment
  factors:
  - id: stage_rate
    effect: parameter
    decides: stage_rate
    bindings:
    - days_past_invoice_due
    - stage_rate
    ladder:
    - when: the invoice due date passed more than the hold-start day count but no more than the early-stage day
        count earlier
      value: K('hold_rate_early')
    - when: the invoice due date passed more than the early-stage but no more than the mid-stage day count earlier
      value: K('hold_rate_mid')
    - when: otherwise (more than the mid-stage day count)
      value: K('hold_rate_standard')
    baseline:
      stage_rate: K('hold_rate_standard')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: relationship_relief
    effect: parameter
    decides: relationship_relief
    bindings:
    - retail_dpd
    - balloon_dpd
    - preowned_dpd
    - relationship_relief
    ladder:
    - when: an active Kestrel new-vehicle retail contract OR an active Kestrel balloon contract showing days_past_due
        of 0
      value: K('relationship_relief_full')
    - when: no such contract, but an active Kestrel pre-owned retail contract showing days_past_due of 0
      value: K('relationship_relief_partial')
    - when: otherwise
      value: '0'
    baseline:
      relationship_relief: '0'
    evidence:
    - cross_category
    cross_difficulty: retail
  - id: returned_relief
    effect: parameter
    decides: returned_relief
    bindings:
    - returned_count
    - returned_relief
    ladder:
    - when: no payment on the lease was ever returned
      value: K('returned_relief_clean')
    - when: exactly one payment on the lease was returned
      value: K('returned_relief_single')
    - when: otherwise (two or more)
      value: '0'
    baseline:
      returned_relief: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: hold_shape
    effect: method
    decides: hold_rated_part
    bindings:
    - shape_balance
    - hold_fixed_part
    - hold_rated_part
    ladder:
    - when: the invoiced end-of-term balance exceeds the large-balance payment count times total_monthly_payment
      method: one total_monthly_payment in full plus the hold rate times the part of the balance above one total_monthly_payment
    - when: the invoiced end-of-term balance is no more than one total_monthly_payment
      method: the whole end-of-term balance
    - when: otherwise
      method: the hold rate times the whole end-of-term balance
    baseline:
      hold_fixed_part: '0'
      hold_rated_part: end_balance
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The hold payment is the standard hold rate times the invoiced end-of-term balance, rounded to the nearest
      cent with a half cent rounded up. The invoiced end-of-term balance is the end-of-term charges billed on the
      day the end-of-term invoice was mailed, less every end-of-term charge waiver, security deposit application
      and end-of-term payment posted on the lease, a waiver of a term fee such as a late charge not being taken
      off; a charge billed on any other day is not part of it.
    params:
    - hold_rate_standard
  inputs:
    history:
    - table: lease_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: lease_end_charge
    - table: lease_transactions
      aggregate: latest
      field: txn_date
      filters:
        event_type: lease_notice_mailed
        notice_type: end_of_term_invoice
    - table: lease_transactions
      aggregate: count
      field: lease_txn_id
      filters:
        event_type: lease_payment_returned
    cross_category:
    - retail
    - balloon
    - preowned
- id: lease_ext_excess_mileage
  base_policy_refs:
  - lease_end_of_term_charges
  - lease_early_termination
  - lease_maturity_extensions
  - lease_turn_in_and_inspection
  overwrite:
  - base_policy: lease_end_of_term_charges
    superseded_clause: Excess mileage is lease_msr_miles_over charged at the lease's excess_mileage_rate per mile.
    replaced_by: For the excess mileage charge of a turn-in, and only for that charge, the miles charged and the
      rate are figured as this rule states; every other end-of-term charge keeps the amount the base rule gives
      it.
  - base_policy: lease_early_termination
    superseded_clause: 'For an early termination the mileage allowance is prorated: annual_mileage_allowance divided
      by 12 times lease_msr_months_elapsed.'
    replaced_by: For the excess mileage charge of a turn-in, and only for that charge, the miles charged and the
      rate are figured as this rule states; every other end-of-term charge keeps the amount the base rule gives
      it.
  - base_policy: lease_maturity_extensions
    superseded_clause: the mileage allowance grows by annual_mileage_allowance divided by 12 for each extension
      month.
    replaced_by: For the excess mileage charge of a turn-in, and only for that charge, the miles charged and the
      rate are figured as this rule states; every other end-of-term charge keeps the amount the base rule gives
      it.
  - base_policy: lease_end_of_term_charges
    superseded_clause: An end-of-term invoice is mailed when charges are billed
    replaced_by: An excess mileage charge billed under this rule is added to the lease-end account without a separate
      end-of-term invoice and falls due end_of_term_payment_days calendar days after the day it is billed, unless
      the balance is enrolled in a lease-end installment plan, whose installments then govern; an end-of-term invoice
      is mailed when any other end-of-term charge is billed.
  trigger: state_due
  subject:
  - lease_end_charge
  computes: amount
  target_tool: bill_excess_mileage_a1b25aac
  params:
    days_per_year: 365
    brand_miles_new: 3000
    brand_miles_preowned: 1500
    autopay_high_count: 24
    autopay_low_count: 12
    autopay_buffer_high: 1000
    autopay_buffer_low: 500
    high_allowance_miles: 15000
    standard_allowance_miles: 12000
    rate_relief_high: 0.05
    rate_relief_std: 0.02
    clean_wear_limit: 300.0
    clean_return_high: 1000
    clean_return_std: 500
    care_miles_financed: 1000
    care_miles_cash: 500
    half_cent_guard: 1.0e-06
  rule: 'An excess mileage charge can be billed only while the lease status is returned or early_terminated and
    only once the inspection dispute period after turn_in_date has fully elapsed; it is billed once for the turn-in
    as one charge with fee_type excess_mileage_charge whose miles_over is the miles charged, and when the miles
    charged are zero no excess mileage charge is billed. For the excess mileage charge of a turn-in, and only for
    that charge, the miles charged and the rate are figured as this rule states; every other end-of-term charge
    keeps the amount the base rule gives it. An excess mileage charge billed under this rule is added to the lease-end
    account without a separate end-of-term invoice and falls due end_of_term_payment_days calendar days after the
    day it is billed, unless the balance is enrolled in a lease-end installment plan, whose installments then govern;
    an end-of-term invoice is mailed when any other end-of-term charge is billed. Wherever this rule reads a contract
    of another Kestrel product, or a Kestrel Care plan, in a stated status, it reads the first one in that status
    that the customer''s records for that product list. The excess mileage charge is the miles driven, turn_in_odometer
    less odometer_at_delivery, less the mileage allowance, annual_mileage_allowance times the sum of term_months
    and maturity_extension_months_used divided by 12 and rounded down to a whole mile, never below zero, charged
    at the lease''s excess_mileage_rate per mile and rounded to the nearest cent with a half cent rounded up. Where
    a schedule below applies to the lease, the allowance method or the rate it sets takes the place of the one in
    the standard method, and every number of miles a schedule credits is added to the mileage allowance before the
    miles driven are compared with it. The mileage allowance of a lease that ended in a pull-ahead or an early termination
    runs by the whole month: annual_mileage_allowance divided by 12 times the whole months from lease_date to turn_in_date,
    rounded down to a whole mile, a month being counted only when the day of the month of turn_in_date is on or
    after that of lease_date; the mileage allowance of any other lease turned in during a maturity extension, before
    its current maturity_date, runs by the day: annual_mileage_allowance times the calendar days from lease_date
    to turn_in_date, counted from the day after lease_date through turn_in_date, divided by the days in a year,
    rounded down to a whole mile; every other lease keeps the standard allowance. The return-to-brand mileage credit
    is the new-vehicle return-to-brand miles when the customer holds an active Kestrel new-vehicle retail contract
    or an active Kestrel balloon contract whose contract_date falls within loyalty_window_days calendar days before
    or after turn_in_date; it is the pre-owned return-to-brand miles when no such contract exists but the customer
    holds an active Kestrel pre-owned retail contract whose contract_date falls within that window and that shows
    days_past_due of 0; otherwise there is no return-to-brand mileage credit. The days between turn_in_date and
    a contract_date are counted in calendar days in either direction, the later date counted and the earlier one
    not. The autopay mileage credit is the high autopay miles when the number of the lease''s monthly payments made
    through autopay_ach, less the number of payments on the lease that were returned, is at least the high autopay
    count; the low autopay miles when that number is at least the low autopay count but below the high autopay count;
    and nothing when it is below the low autopay count. The excess mileage rate is the lease''s excess_mileage_rate
    less the high-allowance rate relief when the lease ran at least term_months whole months from lease_date to
    turn_in_date, a month counted only when the day of the month of turn_in_date is on or after that of lease_date,
    and carries the high allowance of annual miles; it is the lease''s excess_mileage_rate less the standard rate
    relief when the lease ran at least term_months whole months and carries the standard allowance of annual miles;
    it is the lease''s excess_mileage_rate in every other case. The clean-return mileage credit is the high clean-return
    miles when no excess wear charge was billed for the turn-in and the lease''s turn-in_final inspection report
    records no excess missing key or missing equipment item other than one removed on an inspection dispute; it
    is the standard clean-return miles when an excess wear charge of no more than the clean-return wear limit was
    billed for the turn-in; it is nothing in every other case. Where two turn-in_final reports share the latest
    inspection_date, the first one recorded is read. The Kestrel Care mileage credit is the financed-plan miles
    when the customer holds an active Kestrel Care plan financed in a Kestrel contract or lease, the cash-plan miles
    when the customer''s active Kestrel Care plan was paid in cash, and nothing when the customer holds no active
    Kestrel Care plan.'
  prerequisite: []
  cross_category:
  - category: retail
    as: branch
    reads:
    - contract_date
    - status
    note: Return-to-brand mileage credit, new-vehicle tier.
  - category: balloon
    as: branch
    reads:
    - contract_date
    - status
    note: Return-to-brand mileage credit, new-vehicle tier (balloon).
  - category: preowned
    as: branch
    reads:
    - contract_date
    - status
    - days_past_due
    note: Return-to-brand mileage credit, pre-owned tier.
  - category: care
    as: branch
    reads:
    - status
    - financed_with_category
    note: Kestrel Care mileage credit.
  compute:
  - miles_driven: F('turn_in_odometer') - F('odometer_at_delivery')
  - lease_days: DAYS(F('lease_date'), F('turn_in_date'))
  - months_elapsed: MONTHS(F('lease_date'), F('turn_in_date'))
  - mid_extension: F('maturity_extension_months_used') > 0 and DAYS(F('turn_in_date'), F('maturity_date')) > 0
  - mileage_allowance: int(F('annual_mileage_allowance') * months_elapsed / 12) if (F('termination_type') == 'pull_ahead'
      or F('termination_type') == 'early_termination') else (int(F('annual_mileage_allowance') * lease_days / K('days_per_year'))
      if mid_extension else int(F('annual_mileage_allowance') * (F('term_months') + F('maturity_extension_months_used'))
      / 12))
  - retail_date: CFIELD('retail','contract_date', status='active')
  - balloon_date: CFIELD('balloon','contract_date', status='active')
  - preowned_date: CFIELD('preowned','contract_date', status='active')
  - preowned_dpd: CFIELD('preowned','days_past_due', status='active')
  - new_in_window: (retail_date != None and ABS(DAYS(F('turn_in_date'), retail_date)) <= P('loyalty_window_days'))
      or (balloon_date != None and ABS(DAYS(F('turn_in_date'), balloon_date)) <= P('loyalty_window_days'))
  - preowned_in_window: preowned_date != None and ABS(DAYS(F('turn_in_date'), preowned_date)) <= P('loyalty_window_days')
  - brand_miles: K('brand_miles_new') if new_in_window else (K('brand_miles_preowned') if (preowned_in_window and
      preowned_dpd == 0) else 0)
  - autopay_count: COUNT('lease_transactions', event_type='lease_payment', payment_purpose='monthly_payment', payment_channel='autopay_ach')
      - COUNT('lease_transactions', event_type='lease_payment_returned')
  - autopay_buffer: K('autopay_buffer_high') if autopay_count >= K('autopay_high_count') else (K('autopay_buffer_low')
      if autopay_count >= K('autopay_low_count') else 0)
  - months_run: MONTHS(F('lease_date'), F('turn_in_date'))
  - mileage_rate: (F('excess_mileage_rate') - K('rate_relief_high')) if (months_run >= F('term_months') and F('annual_mileage_allowance')
      == K('high_allowance_miles')) else ((F('excess_mileage_rate') - K('rate_relief_std')) if (months_run >= F('term_months')
      and F('annual_mileage_allowance') == K('standard_allowance_miles')) else F('excess_mileage_rate'))
  - wear_charge_count: COUNT('lease_transactions', event_type='lease_end_charge', fee_type='excess_wear_charge')
  - wear_billed: SUM('lease_transactions','amount', event_type='lease_end_charge', fee_type='excess_wear_charge')
  - final_report: LATEST('lease_inspections','lease_inspection_id', date_field='inspection_date', inspection_type='turn_in_final')
  - missing_count: MX(0, COUNT('lease_wear_items', event_type='lease_wear_item_assessed', severity='excess', item_category='missing_key',
      lease_inspection_id=final_report) + COUNT('lease_wear_items', event_type='lease_wear_item_assessed', severity='excess',
      item_category='missing_equipment', lease_inspection_id=final_report) - COUNT('lease_wear_items', event_type='lease_wear_item_adjusted',
      item_status='removed_on_dispute', item_category='missing_key', lease_inspection_id=final_report) - COUNT('lease_wear_items',
      event_type='lease_wear_item_adjusted', item_status='removed_on_dispute', item_category='missing_equipment',
      lease_inspection_id=final_report))
  - clean_return_miles: K('clean_return_high') if (wear_charge_count == 0 and missing_count == 0) else (K('clean_return_std')
      if (wear_charge_count > 0 and wear_billed <= K('clean_wear_limit')) else 0)
  - care_financing: CFIELD('care','financed_with_category', status='active')
  - care_holder_miles: K('care_miles_financed') if (care_financing != None and care_financing != 'cash') else (K('care_miles_cash')
      if care_financing == 'cash' else 0)
  - charged_miles: MX(0, miles_driven - (mileage_allowance + brand_miles + autopay_buffer + clean_return_miles +
      care_holder_miles))
  - result: RND(charged_miles * mileage_rate + K('half_cent_guard'), 2)
  compute_basis:
    miles_driven: the miles driven, turn_in_odometer less odometer_at_delivery
    lease_days: annual_mileage_allowance times the calendar days from lease_date to turn_in_date, counted from the
      day after lease_date through turn_in_date, divided by the days in a year, rounded down to a whole mile
    months_elapsed: a month being counted only when the day of the month of turn_in_date is on or after that of
      lease_date
    mid_extension: the mileage allowance of any other lease turned in during a maturity extension, before its current
      maturity_date, runs by the day
    mileage_allowance: 'The mileage allowance of a lease that ended in a pull-ahead or an early termination runs
      by the whole month: annual_mileage_allowance divided by 12 times the whole months from lease_date to turn_in_date,
      rounded down to a whole mile, a month being counted only when the day of the month of turn_in_date is on or
      after that of lease_date; the mileage allowance of any other lease turned in during a maturity extension,
      before its current maturity_date, runs by the day'
    retail_date: Wherever this rule reads a contract of another Kestrel product, or a Kestrel Care plan, in a stated
      status, it reads the first one in that status that the customer's records for that product list.
    balloon_date: an active Kestrel new-vehicle retail contract or an active Kestrel balloon contract whose contract_date
      falls within loyalty_window_days calendar days before or after turn_in_date
    preowned_date: an active Kestrel pre-owned retail contract whose contract_date falls within that window and
      that shows days_past_due of 0
    preowned_dpd: and that shows days_past_due of 0
    new_in_window: The days between turn_in_date and a contract_date are counted in calendar days in either direction,
      the later date counted and the earlier one not.
    preowned_in_window: an active Kestrel pre-owned retail contract whose contract_date falls within that window
    brand_miles: The return-to-brand mileage credit is the new-vehicle return-to-brand miles when the customer holds
      an active Kestrel new-vehicle retail contract or an active Kestrel balloon contract whose contract_date falls
      within loyalty_window_days calendar days before or after turn_in_date; it is the pre-owned return-to-brand
      miles when no such contract exists but the customer holds an active Kestrel pre-owned retail contract whose
      contract_date falls within that window and that shows days_past_due of 0; otherwise there is no return-to-brand
      mileage credit.
    autopay_count: the number of the lease's monthly payments made through autopay_ach, less the number of payments
      on the lease that were returned
    autopay_buffer: The autopay mileage credit is the high autopay miles when the number of the lease's monthly
      payments made through autopay_ach, less the number of payments on the lease that were returned, is at least
      the high autopay count; the low autopay miles when that number is at least the low autopay count but below
      the high autopay count; and nothing when it is below the low autopay count.
    months_run: when the lease ran at least term_months whole months from lease_date to turn_in_date, a month counted
      only when the day of the month of turn_in_date is on or after that of lease_date
    mileage_rate: The excess mileage rate is the lease's excess_mileage_rate less the high-allowance rate relief
      when the lease ran at least term_months whole months from lease_date to turn_in_date, a month counted only
      when the day of the month of turn_in_date is on or after that of lease_date, and carries the high allowance
      of annual miles; it is the lease's excess_mileage_rate less the standard rate relief when the lease ran at
      least term_months whole months and carries the standard allowance of annual miles; it is the lease's excess_mileage_rate
      in every other case.
    wear_charge_count: when no excess wear charge was billed for the turn-in
    wear_billed: when an excess wear charge of no more than the clean-return wear limit was billed for the turn-in
    missing_count: the lease's turn-in_final inspection report records no excess missing key or missing equipment
      item other than one removed on an inspection dispute
    clean_return_miles: The clean-return mileage credit is the high clean-return miles when no excess wear charge
      was billed for the turn-in and the lease's turn-in_final inspection report records no excess missing key or
      missing equipment item other than one removed on an inspection dispute; it is the standard clean-return miles
      when an excess wear charge of no more than the clean-return wear limit was billed for the turn-in; it is nothing
      in every other case.
    care_financing: Wherever this rule reads a contract of another Kestrel product, or a Kestrel Care plan, in a
      stated status, it reads the first one in that status that the customer's records for that product list.
    care_holder_miles: The Kestrel Care mileage credit is the financed-plan miles when the customer holds an active
      Kestrel Care plan financed in a Kestrel contract or lease, the cash-plan miles when the customer's active
      Kestrel Care plan was paid in cash, and nothing when the customer holds no active Kestrel Care plan.
    charged_miles: when the miles charged are zero no excess mileage charge is billed
    result: The excess mileage charge is the miles driven, turn_in_odometer less odometer_at_delivery, less the
      mileage allowance, annual_mileage_allowance times the sum of term_months and maturity_extension_months_used
      divided by 12 and rounded down to a whole mile, never below zero, charged at the lease's excess_mileage_rate
      per mile and rounded to the nearest cent with a half cent rounded up.
    final_report: Where two turn-in_final reports share the latest inspection_date, the first one recorded is read.
  factors:
  - id: allowance_convention
    effect: method
    decides: mileage_allowance
    bindings:
    - lease_days
    - months_elapsed
    - mid_extension
    - mileage_allowance
    ladder:
    - when: the lease ended in a pull-ahead or an early termination
      method: 'the allowance runs by the whole month: annual allowance over 12 times the whole months from lease_date
        to turn_in_date, rounded down'
    - when: any other lease turned in during a maturity extension, before its current maturity_date
      method: 'the allowance runs by the day: annual allowance times the calendar days from lease_date to turn_in_date
        over the days in a year, rounded down to a whole mile'
    - when: otherwise
      method: 'the standard allowance: annual allowance times (term_months plus extension months used) over 12,
        rounded down'
    baseline:
      mileage_allowance: int(F('annual_mileage_allowance') * (F('term_months') + F('maturity_extension_months_used'))
        / 12)
    evidence:
    - date
    cross_difficulty: null
  - id: brand_miles
    effect: parameter
    decides: brand_miles
    bindings:
    - retail_date
    - balloon_date
    - preowned_date
    - preowned_dpd
    - new_in_window
    - preowned_in_window
    - brand_miles
    ladder:
    - when: an active Kestrel new-vehicle retail contract OR an active Kestrel balloon contract dated within loyalty_window_days
        of turn_in_date
      value: K('brand_miles_new')
    - when: no such contract, but an active Kestrel pre-owned retail contract dated within that window AND showing
        days_past_due of 0
      value: K('brand_miles_preowned')
    - when: otherwise
      value: '0'
    baseline:
      brand_miles: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: preowned
  - id: autopay_buffer
    effect: parameter
    decides: autopay_buffer
    bindings:
    - autopay_count
    - autopay_buffer
    ladder:
    - when: autopay_ach monthly payments less returned payments at least the high autopay count
      value: K('autopay_buffer_high')
    - when: at least the low autopay count but fewer than the high autopay count
      value: K('autopay_buffer_low')
    - when: otherwise
      value: '0'
    baseline:
      autopay_buffer: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rate_schedule
    effect: parameter
    decides: mileage_rate
    bindings:
    - months_run
    - mileage_rate
    ladder:
    - when: the lease ran at least term_months whole months AND carries the high annual allowance
      value: F('excess_mileage_rate') - K('rate_relief_high')
    - when: the lease ran at least term_months whole months AND carries the standard annual allowance
      value: F('excess_mileage_rate') - K('rate_relief_std')
    - when: otherwise
      value: F('excess_mileage_rate')
    baseline:
      mileage_rate: F('excess_mileage_rate')
    evidence:
    - date
    cross_difficulty: null
  - id: clean_return_miles
    effect: parameter
    decides: clean_return_miles
    bindings:
    - wear_charge_count
    - wear_billed
    - final_report
    - missing_count
    - clean_return_miles
    ladder:
    - when: no excess wear charge billed for the turn-in AND no excess missing key or missing equipment item on
        the turn-in report (other than one removed on dispute)
      value: K('clean_return_high')
    - when: an excess wear charge was billed AND it is no more than the clean-return wear limit
      value: K('clean_return_std')
    - when: otherwise
      value: '0'
    baseline:
      clean_return_miles: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: care_holder_miles
    effect: parameter
    decides: care_holder_miles
    bindings:
    - care_financing
    - care_holder_miles
    ladder:
    - when: an active Kestrel Care plan financed in a Kestrel contract or lease
      value: K('care_miles_financed')
    - when: an active Kestrel Care plan paid in cash
      value: K('care_miles_cash')
    - when: otherwise
      value: '0'
    baseline:
      care_holder_miles: '0'
    evidence:
    - cross_category
    cross_difficulty: care
  baseline:
    rule: The excess mileage charge is the miles driven, turn_in_odometer less odometer_at_delivery, less the mileage
      allowance, annual_mileage_allowance times the sum of term_months and maturity_extension_months_used divided
      by 12 and rounded down to a whole mile, never below zero, charged at the lease's excess_mileage_rate per mile
      and rounded to the nearest cent with a half cent rounded up.
    params: []
  inputs:
    history:
    - table: lease_transactions
      aggregate: count
      field: lease_txn_id
      filters:
        event_type: lease_payment
        payment_channel: autopay_ach
    - table: lease_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: lease_end_charge
        fee_type: excess_wear_charge
    - table: lease_wear_items
      aggregate: count
      field: lease_wear_item_id
      filters:
        event_type: lease_wear_item_assessed
        severity: excess
    - table: lease_transactions
      aggregate: count
      field: lease_txn_id
      filters:
        event_type: lease_payment_returned
    cross_category:
    - retail
    - balloon
    - preowned
    - care
- id: lease_ext_end_installment_plan
  base_policy_refs:
  - lease_payment_posting
  - lease_end_of_term_charges
  overwrite:
  - base_policy: lease_end_of_term_charges
    superseded_clause: charges are due end_of_term_payment_days calendar days after the invoice
    replaced_by: For a lease whose end-of-term balance is enrolled in a lease-end installment plan, and only for
      such a lease, the end-of-term charges fall due as the plan's installments fall due and the balance is not
      charged off while every installment already due has been paid; a balance that received a hold payment is never
      enrolled in a plan and is charged off as the hold payment rule states, and for every other end-of-term balance
      the charges are due end_of_term_payment_days calendar days after the invoice, except an excess mileage charge
      billed without an invoice, which falls due as the excess mileage rule states, and a balance still unpaid end_of_term_charge_off_days
      after turn_in_date is charged off.
  - base_policy: lease_end_of_term_charges
    superseded_clause: a balance still unpaid end_of_term_charge_off_days after turn_in_date is charged off.
    replaced_by: For a lease whose end-of-term balance is enrolled in a lease-end installment plan, and only for
      such a lease, the end-of-term charges fall due as the plan's installments fall due and the balance is not
      charged off while every installment already due has been paid; a balance that received a hold payment is never
      enrolled in a plan and is charged off as the hold payment rule states, and for every other end-of-term balance
      the charges are due end_of_term_payment_days calendar days after the invoice, except an excess mileage charge
      billed without an invoice, which falls due as the excess mileage rule states, and a balance still unpaid end_of_term_charge_off_days
      after turn_in_date is charged off.
  trigger: on_request
  subject:
  - lease_end_of_term_payment
  computes: amount
  target_tool: start_lease_end_plan_44d05a38
  params:
    clean_installments: 4
    one_late_installments: 3
    standard_installments: 2
    relationship_new_installments: 2
    relationship_preowned_installments: 1
    completion_full_installments: 2
    completion_term_installments: 1
    tenure_long_payments: 48
    tenure_mid_payments: 24
    tenure_long_installments: 2
    tenure_mid_installments: 1
    setup_fee_standard: 35.0
    setup_fee_reduced: 15.0
    enrollment_window_days: 30
    large_plan_payments: 2
    half_cent_guard: 1.0e-06
  rule: 'A lease-end installment plan lets a lessee whose lease has ended pay the end-of-term balance in monthly
    installments. It is open to a lease whose end-of-term invoice''s due date, its mailing date plus end_of_term_payment_days,
    has not yet come or passed no more than the enrollment window of days earlier, the days since the due date being
    counted from the day after the due date through today, so that a due date not yet passed counts zero days, and
    on which no end-of-term payment has posted since that invoice was mailed; where the lease has more than one
    end-of-term invoice the latest mailing date is read, and a lease outside that scope is outside this rule. A
    lessee who asks to spread the end-of-term balance over several months is offered the plan, and the lessee enrolls
    by paying the first installment through the self-service payment line from the lessee''s own bank account, booked
    as one end-of-term payment, with each later installment falling due on the same day of each following month.
    For a lease whose end-of-term balance is enrolled in a lease-end installment plan, and only for such a lease,
    the end-of-term charges fall due as the plan''s installments fall due and the balance is not charged off while
    every installment already due has been paid; a balance that received a hold payment is never enrolled in a plan
    and is charged off as the hold payment rule states, and for every other end-of-term balance the charges are
    due end_of_term_payment_days calendar days after the invoice, except an excess mileage charge billed without
    an invoice, which falls due as the excess mileage rule states, and a balance still unpaid end_of_term_charge_off_days
    after turn_in_date is charged off. Wherever this rule reads a contract of another Kestrel product in a stated
    status, it reads the first contract in that status that the customer''s records for that product list. The first
    installment of a lease-end installment plan is not fixed until every excess mileage charge owed for the turn-in
    stands billed on the lease. The first installment is the plan balance divided by the standard number of installments,
    plus the standard plan setup fee, rounded to the nearest cent with a half cent rounded up. The plan balance
    is the end-of-term charges billed for the turn-in less the security deposit applied and less every end-of-term
    payment posted; a waiver posted on any of those charges is not taken off the plan balance at enrollment and
    is credited to the plan''s last installments instead. Where a schedule below applies to the lessee, the number
    of installments, the shape or the fee it sets takes the place of the one in the standard method, every number
    of installments a schedule adds is added to the plan''s number of installments before the balance is divided,
    and the fee is added last. The plan''s punctuality installments are the clean-record installments when no late
    charge was ever assessed on the lease, the one-late installments when exactly one late charge was assessed on
    the lease, and the standard number of installments when two or more were. The relationship installments added
    to a plan are the new-vehicle relationship installments when the customer holds an active Kestrel new-vehicle
    retail or balloon contract that shows days_past_due of 0, the pre-owned relationship installments when the customer
    holds no such contract but holds an active Kestrel pre-owned retail contract that shows days_past_due of 0,
    and none otherwise. The completion installments added to a plan are the full-completion installments when the
    number of the lease''s monthly payments, less the number of payments on the lease that were returned, is at
    least term_months plus maturity_extension_months_used, the term-completion installments when that number is
    at least term_months but below that sum, and none when it is below term_months. The balloon-tenure installments
    added to a plan are the long balloon-tenure installments when the customer holds a paid-in-full Kestrel balloon
    contract whose payments_made_count is at least the long balloon-tenure payment count, the mid balloon-tenure
    installments when that count is at least the mid balloon-tenure payment count but below the long one, and none
    when the customer holds no paid-in-full Kestrel balloon contract or its count is below the mid balloon-tenure
    payment count. The shape of the first installment follows the plan balance: when the plan balance exceeds the
    large-plan payment count times total_monthly_payment, it is one total_monthly_payment as a down payment plus
    the rest of the plan balance divided by the plan''s number of installments; when the plan balance is no more
    than one total_monthly_payment, it is the whole plan balance; in every other case it is the plan balance divided
    by the plan''s number of installments. The plan setup fee is waived when no payment on the lease was ever returned,
    is the reduced plan setup fee when exactly one payment on the lease was returned, and is the standard plan setup
    fee when two or more were.'
  prerequisite:
  - problem: lease_ext_excess_mileage
    kind: value_input
    gate: plan_balance
    form: state
    policy_source: The first installment of a lease-end installment plan is not fixed until every excess mileage
      charge owed for the turn-in stands billed on the lease.
    condition: When the miles driven exceed the mileage allowance as the excess mileage rule figures it, the lease
      carries one lease_end_charge row with fee_type excess_mileage_charge for the turn-in, and end_of_term_balance
      includes it.
    resolved_by: bill_excess_mileage_a1b25aac
    effect: The billed excess mileage charge raises end_of_term_balance, so the plan_balance binding, and with it
      every share of the first installment, changes.
  cross_category:
  - category: retail
    as: branch
    reads:
    - status
    - days_past_due
    note: Relationship installments, new-vehicle tier.
  - category: balloon
    as: branch
    reads:
    - status
    - days_past_due
    - payments_made_count
    note: Relationship installments (active balloon) and balloon-tenure installments (paid-in-full balloon payments).
  - category: preowned
    as: branch
    reads:
    - status
    - days_past_due
    note: Relationship installments, pre-owned tier.
  compute:
  - plan_balance: SUM('lease_transactions','amount', event_type='lease_end_charge') - SUM('lease_transactions','amount',
      event_type='lease_security_deposit_applied') - SUM('lease_transactions','amount', event_type='lease_end_of_term_payment')
  - late_count: COUNT('lease_transactions', event_type='lease_late_charge')
  - punctuality_installments: K('clean_installments') if late_count == 0 else (K('one_late_installments') if late_count
      == 1 else K('standard_installments'))
  - retail_dpd: CFIELD('retail','days_past_due', status='active')
  - balloon_dpd: CFIELD('balloon','days_past_due', status='active')
  - preowned_dpd: CFIELD('preowned','days_past_due', status='active')
  - relationship_installments: K('relationship_new_installments') if (retail_dpd == 0 or balloon_dpd == 0) else
      (K('relationship_preowned_installments') if preowned_dpd == 0 else 0)
  - monthly_payments: COUNT('lease_transactions', event_type='lease_payment', payment_purpose='monthly_payment')
      - COUNT('lease_transactions', event_type='lease_payment_returned')
  - completion_installments: K('completion_full_installments') if monthly_payments >= F('term_months') + F('maturity_extension_months_used')
      else (K('completion_term_installments') if monthly_payments >= F('term_months') else 0)
  - balloon_paid_count: CFIELD('balloon','payments_made_count', status='paid_in_full')
  - tenure_installments: K('tenure_long_installments') if (balloon_paid_count != None and balloon_paid_count >=
      K('tenure_long_payments')) else (K('tenure_mid_installments') if (balloon_paid_count != None and balloon_paid_count
      >= K('tenure_mid_payments')) else 0)
  - installments: punctuality_installments + relationship_installments + completion_installments + tenure_installments
  - shape_plan_balance: SUM('lease_transactions','amount', event_type='lease_end_charge') - SUM('lease_transactions','amount',
      event_type='lease_security_deposit_applied') - SUM('lease_transactions','amount', event_type='lease_end_of_term_payment')
  - down_part: F('total_monthly_payment') if shape_plan_balance > K('large_plan_payments') * F('total_monthly_payment')
      else (plan_balance if shape_plan_balance <= F('total_monthly_payment') else 0)
  - shared_part: (plan_balance - F('total_monthly_payment')) if shape_plan_balance > K('large_plan_payments') *
      F('total_monthly_payment') else (0 if shape_plan_balance <= F('total_monthly_payment') else plan_balance)
  - returned_count: COUNT('lease_transactions', event_type='lease_payment_returned')
  - setup_fee: 0 if returned_count == 0 else (K('setup_fee_reduced') if returned_count == 1 else K('setup_fee_standard'))
  - result: RND(down_part + shared_part / installments + setup_fee + K('half_cent_guard'), 2)
  compute_basis:
    plan_balance: The plan balance is the end-of-term charges billed for the turn-in less the security deposit applied
      and less every end-of-term payment posted; a waiver posted on any of those charges is not taken off the plan
      balance at enrollment and is credited to the plan's last installments instead.
    late_count: when no late charge was ever assessed on the lease
    punctuality_installments: The plan's punctuality installments are the clean-record installments when no late
      charge was ever assessed on the lease, the one-late installments when exactly one late charge was assessed
      on the lease, and the standard number of installments when two or more were.
    retail_dpd: Wherever this rule reads a contract of another Kestrel product in a stated status, it reads the
      first contract in that status that the customer's records for that product list.
    balloon_dpd: an active Kestrel new-vehicle retail or balloon contract that shows days_past_due of 0
    preowned_dpd: an active Kestrel pre-owned retail contract that shows days_past_due of 0
    relationship_installments: The relationship installments added to a plan are the new-vehicle relationship installments
      when the customer holds an active Kestrel new-vehicle retail or balloon contract that shows days_past_due
      of 0, the pre-owned relationship installments when the customer holds no such contract but holds an active
      Kestrel pre-owned retail contract that shows days_past_due of 0, and none otherwise.
    monthly_payments: the number of the lease's monthly payments, less the number of payments on the lease that
      were returned
    completion_installments: The completion installments added to a plan are the full-completion installments when
      the number of the lease's monthly payments, less the number of payments on the lease that were returned, is
      at least term_months plus maturity_extension_months_used, the term-completion installments when that number
      is at least term_months but below that sum, and none when it is below term_months.
    balloon_paid_count: a paid-in-full Kestrel balloon contract whose payments_made_count is at least the long balloon-tenure
      payment count
    tenure_installments: The balloon-tenure installments added to a plan are the long balloon-tenure installments
      when the customer holds a paid-in-full Kestrel balloon contract whose payments_made_count is at least the
      long balloon-tenure payment count, the mid balloon-tenure installments when that count is at least the mid
      balloon-tenure payment count but below the long one, and none when the customer holds no paid-in-full Kestrel
      balloon contract or its count is below the mid balloon-tenure payment count.
    installments: every number of installments a schedule adds is added to the plan's number of installments before
      the balance is divided
    returned_count: when no payment on the lease was ever returned
    setup_fee: The plan setup fee is waived when no payment on the lease was ever returned, is the reduced plan
      setup fee when exactly one payment on the lease was returned, and is the standard plan setup fee when two
      or more were.
    result: The first installment is the plan balance divided by the standard number of installments, plus the standard
      plan setup fee, rounded to the nearest cent with a half cent rounded up.
    down_part: 'The shape of the first installment follows the plan balance: when the plan balance exceeds the large-plan
      payment count times total_monthly_payment, it is one total_monthly_payment as a down payment plus the rest
      of the plan balance divided by the plan''s number of installments; when the plan balance is no more than one
      total_monthly_payment, it is the whole plan balance; in every other case it is the plan balance divided by
      the plan''s number of installments.'
    shared_part: 'The shape of the first installment follows the plan balance: when the plan balance exceeds the
      large-plan payment count times total_monthly_payment, it is one total_monthly_payment as a down payment plus
      the rest of the plan balance divided by the plan''s number of installments; when the plan balance is no more
      than one total_monthly_payment, it is the whole plan balance; in every other case it is the plan balance divided
      by the plan''s number of installments.'
    shape_plan_balance: The shape of the first installment follows the plan balance
  factors:
  - id: punctuality_installments
    effect: parameter
    decides: punctuality_installments
    bindings:
    - late_count
    - punctuality_installments
    ladder:
    - when: no late charge was ever assessed on the lease
      value: K('clean_installments')
    - when: exactly one late charge was assessed on the lease
      value: K('one_late_installments')
    - when: otherwise (two or more)
      value: K('standard_installments')
    baseline:
      punctuality_installments: K('standard_installments')
    evidence:
    - history
    cross_difficulty: null
  - id: relationship_installments
    effect: parameter
    decides: relationship_installments
    bindings:
    - retail_dpd
    - balloon_dpd
    - preowned_dpd
    - relationship_installments
    ladder:
    - when: an active Kestrel new-vehicle retail contract OR an active Kestrel balloon contract showing days_past_due
        of 0
      value: K('relationship_new_installments')
    - when: no such contract, but an active Kestrel pre-owned retail contract showing days_past_due of 0
      value: K('relationship_preowned_installments')
    - when: otherwise
      value: '0'
    baseline:
      relationship_installments: '0'
    evidence:
    - cross_category
    cross_difficulty: preowned
  - id: completion_installments
    effect: parameter
    decides: completion_installments
    bindings:
    - monthly_payments
    - completion_installments
    ladder:
    - when: monthly payments less returned payments at least term_months plus maturity_extension_months_used
      value: K('completion_full_installments')
    - when: at least term_months but fewer than that sum
      value: K('completion_term_installments')
    - when: otherwise
      value: '0'
    baseline:
      completion_installments: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_installments
    effect: parameter
    decides: tenure_installments
    bindings:
    - balloon_paid_count
    - tenure_installments
    ladder:
    - when: a paid-in-full Kestrel balloon contract with payments_made_count at least the long balloon-tenure count
      value: K('tenure_long_installments')
    - when: at least the mid balloon-tenure count but below the long one
      value: K('tenure_mid_installments')
    - when: otherwise
      value: '0'
    baseline:
      tenure_installments: '0'
    evidence:
    - cross_category
    cross_difficulty: balloon
  - id: first_shape
    effect: method
    decides: shared_part
    bindings:
    - shape_plan_balance
    - down_part
    - shared_part
    ladder:
    - when: the plan balance exceeds the large-plan payment count times total_monthly_payment
      method: one total_monthly_payment as a down payment plus the rest of the plan balance divided by the number
        of installments
    - when: the plan balance is no more than one total_monthly_payment
      method: the whole plan balance
    - when: otherwise
      method: the plan balance divided by the number of installments
    baseline:
      down_part: '0'
      shared_part: plan_balance
    evidence:
    - history
    cross_difficulty: null
  - id: setup_fee
    effect: parameter
    decides: setup_fee
    bindings:
    - returned_count
    - setup_fee
    ladder:
    - when: no payment on the lease was ever returned
      value: '0'
    - when: exactly one payment on the lease was returned
      value: K('setup_fee_reduced')
    - when: otherwise (two or more)
      value: K('setup_fee_standard')
    baseline:
      setup_fee: K('setup_fee_standard')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The first installment is the plan balance divided by the standard number of installments, plus the standard
      plan setup fee, rounded to the nearest cent with a half cent rounded up. The plan balance is the end-of-term
      charges billed for the turn-in less the security deposit applied and less every end-of-term payment posted;
      a waiver posted on any of those charges is not taken off the plan balance at enrollment and is credited to
      the plan's last installments instead.
    params:
    - standard_installments
    - setup_fee_standard
  inputs:
    history:
    - table: lease_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: lease_end_charge
    - table: lease_transactions
      aggregate: count
      field: lease_txn_id
      filters:
        event_type: lease_late_charge
    - table: lease_transactions
      aggregate: count
      field: lease_txn_id
      filters:
        event_type: lease_payment
        payment_purpose: monthly_payment
    - table: lease_transactions
      aggregate: count
      field: lease_txn_id
      filters:
        event_type: lease_payment_returned
    cross_category:
    - retail
    - balloon
    - preowned
