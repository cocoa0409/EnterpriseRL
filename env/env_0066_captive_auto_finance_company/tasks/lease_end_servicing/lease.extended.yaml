      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the leased vehicle was repossessed
      anchor_source: lease_contracts.repossession_date
      relation: not_after
      duration_source: variants.reinstatement_company_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days starting the day after repossession_date, and completion
        on the last day is timely.
      boundary: inclusive
  - id: reinstate_count
