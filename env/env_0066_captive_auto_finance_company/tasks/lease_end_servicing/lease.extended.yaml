        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
      Kestrel Lease Tier 3:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
      Kestrel Lease Tier 2:
