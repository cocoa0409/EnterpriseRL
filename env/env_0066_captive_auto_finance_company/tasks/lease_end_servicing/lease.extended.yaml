- id: lease_end_of_term_charges
  subject:
  - lease_end_charge
  - lease_end_charge_waiver
  - lease_security_deposit_applied
  - lease_security_deposit_refund
  - lease_closed
  - lease_charged_off
  rule: End-of-term charges can be billed only while the lease status is returned or early_terminated. End-of-term
    charges may be billed only after inspection_dispute_days have fully elapsed from the date the vehicle was turned
    in. The period is counted in calendar days starting the day after turn_in_date, so billing is permitted from
    the calendar day after turn_in_date plus inspection_dispute_days. Excess mileage is lease_msr_miles_over charged
    at the lease's excess_mileage_rate per mile. Excess wear is lease_msr_excess_wear_total from the final inspection,
    billed as one excess_wear_charge; wear_forgiveness_cap for the tier is then waived from it as wear_forgiveness,
    up to the amount billed. The loyalty condition is met when the customer signed a new Kestrel lease, a new-vehicle
    retail contract or a balloon contract whose lease_date or contract_date falls within loyalty_window_days calendar
    days before or after turn_in_date; pre-owned contracts do not qualify. When the loyalty condition is met, loyalty_wear_forgiveness_cap
    replaces wear_forgiveness_cap, and where loyalty_disposition_waiver is true for the tier the disposition fee
    is waived as loyalty_disposition_waiver; the waiver records the qualifying account number. The disposition fee
    is the lease's disposition_fee and is billed on every turn-in, scheduled or early, but never on a purchase.
    Each end-of-term charge may be waived only once for the same reason. Any security deposit is applied to the
    end-of-term balance first and any remainder is refunded within security_deposit_refund_days calendar days after
    the balance is settled. An end-of-term invoice is mailed when charges are billed; charges are due end_of_term_payment_days
    calendar days after the invoice, the lease closes when the end-of-term balance is zero, and a balance still
    unpaid end_of_term_charge_off_days after turn_in_date is charged off.
  eligibility:
  - id: bill_status
    applies_to:
    - lease_end_charge
    - lease_end_charge_waiver
    - lease_security_deposit_applied
    kind: state
    condition: End-of-term charges can be billed only while the lease status is returned or early_terminated.
    evidence_fields:
    - lease_contracts.status
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    state_contract:
      field: lease_contracts.status
      allowed:
      - returned
      - early_terminated
  - id: dispute_elapsed
    applies_to:
    - lease_end_charge
    kind: time
    condition: End-of-term charges may be billed only after inspection_dispute_days have fully elapsed from the
      date the vehicle was turned in.
    evidence_fields:
    - lease_contracts.turn_in_date
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was turned in
      anchor_source: lease_contracts.turn_in_date
      relation: not_before
      duration_source: variants.inspection_dispute_days
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after turn_in_date, so billing is permitted
        from the calendar day after turn_in_date plus inspection_dispute_days.
      boundary: exclusive
  - id: loyalty
    applies_to:
    - lease_end_charge_waiver
    kind: authorization
    condition: The loyalty condition is met when the customer signed a new Kestrel lease, a new-vehicle retail contract
      or a balloon contract whose lease_date or contract_date falls within loyalty_window_days calendar days before
      or after turn_in_date; pre-owned contracts do not qualify.
    evidence_fields:
    - lease_contracts.customer_id
    - lease_contracts.turn_in_date
    - lease_contracts.lease_date
    - retail_contracts.contract_date
    - retail_contracts.customer_id
    - balloon_contracts.contract_date
    - balloon_contracts.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.customer_id
      action_bindings:
        lease_contracts.customer_id: customer_id
  - id: waive_once
    applies_to:
    - lease_end_charge_waiver
    kind: dedup
    condition: Each end-of-term charge may be waived only once for the same reason.
    evidence_fields:
    - lease_transactions.waived_txn_id
    - lease_transactions.waiver_reason
    - lease_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_transactions.waived_txn_id
      action_bindings:
        lease_transactions.waived_txn_id: waived_txn_id
    dedup_contract:
      table: lease_transactions
      mode: separate_record
      object_bindings:
        waived_txn_id: waived_txn_id
      duplicate_filters:
        event_type:
        - lease_end_charge_waiver
      distinct_fields:
      - waiver_reason
  measures:
  - lease_msr_miles_over
  - lease_msr_excess_wear_total
  formula:
    mileage_charge: round(lease_msr_miles_over * excess_mileage_rate, 2)
    wear_waiver: min(lease_msr_excess_wear_total, wear_forgiveness_cap)
  params:
    per_tier:
      Kestrel Lease Tier 5:
        wear_forgiveness_cap: =wear_forgiveness_cap
        loyalty_wear_forgiveness_cap: =loyalty_wear_forgiveness_cap
        loyalty_disposition_waiver: =loyalty_disposition_waiver
      Kestrel Lease Tier 4:
        wear_forgiveness_cap: =wear_forgiveness_cap
        loyalty_wear_forgiveness_cap: =loyalty_wear_forgiveness_cap
        loyalty_disposition_waiver: =loyalty_disposition_waiver
      Kestrel Lease Tier 3:
        wear_forgiveness_cap: =wear_forgiveness_cap
        loyalty_wear_forgiveness_cap: =loyalty_wear_forgiveness_cap
        loyalty_disposition_waiver: =loyalty_disposition_waiver
      Kestrel Lease Tier 2:
        wear_forgiveness_cap: =wear_forgiveness_cap
        loyalty_wear_forgiveness_cap: =loyalty_wear_forgiveness_cap
        loyalty_disposition_waiver: =loyalty_disposition_waiver
      Kestrel Lease Tier 1:
        wear_forgiveness_cap: =wear_forgiveness_cap
        loyalty_wear_forgiveness_cap: =loyalty_wear_forgiveness_cap
        loyalty_disposition_waiver: =loyalty_disposition_waiver
      Kestrel Lease Tier 1+:
        wear_forgiveness_cap: =wear_forgiveness_cap
        loyalty_wear_forgiveness_cap: =loyalty_wear_forgiveness_cap
        loyalty_disposition_waiver: =loyalty_disposition_waiver
    inspection_dispute_days: =inspection_dispute_days
    loyalty_window_days: =loyalty_window_days
    security_deposit_refund_days: =security_deposit_refund_days
    end_of_term_payment_days: =end_of_term_payment_days
    end_of_term_charge_off_days: =end_of_term_charge_off_days
- id: lease_purchase_option
  subject:
  - lease_purchase_quote
  - lease_purchased
  rule: 'A purchase quote can be issued only while the lease status is active or maturity_extended. The vehicle
    may be sold under the purchase option only to the lessee or to a Kestrel franchised dealer that the lessee has
    authorized through a completed third-party purchase authorization; no other dealer, retailer or third party
    may buy it. A maturity purchase applies from turn_in_window_days_before_maturity calendar days before maturity_date
    through purchase_option_grace_days calendar days after it: the price is purchase_option_price plus past_due_amount
    plus fees_due_balance. Before that window, and during a maturity extension, the price is adjusted_lease_balance
    plus purchase_option_fee plus past_due_amount plus fees_due_balance. Sales tax is the price before past-due
    amounts and fees times use_tax_rate_pct, rounded to the cent, and is included in the quote; a Kestrel franchised
    dealer purchase adds third_party_purchase_fee to the price. A quote is honoured through purchase_quote_valid_days
    calendar days after the quote date; purchase funds must be certified funds or a dealer remittance, and the purchase
    completes when the full quoted amount posts, after which the title is transferred and the lease closes. No disposition
    fee is charged on a purchase.'
  eligibility:
  - id: quote_status
    applies_to:
    - lease_purchase_quote
    kind: state
    condition: A purchase quote can be issued only while the lease status is active or maturity_extended.
    evidence_fields:
    - lease_contracts.status
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
    state_contract:
      field: lease_contracts.status
      allowed:
      - active
      - maturity_extended
  - id: buyer
    applies_to:
    - lease_purchase_quote
    - lease_purchased
    kind: authorization
    condition: The vehicle may be sold under the purchase option only to the lessee or to a Kestrel franchised dealer
      that the lessee has authorized through a completed third-party purchase authorization; no other dealer, retailer
      or third party may buy it.
    evidence_fields:
    - lease_requests.request_type
    - lease_requests.request_status
    - lease_requests.purchaser_type
    - lease_requests.lease_request_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - lease_requests.lease_request_id
      action_bindings:
        lease_requests.lease_request_id: lease_request_id
  formula:
    maturity_price: purchase_option_price + past_due_amount + fees_due_balance
    early_price: adjusted_lease_balance + purchase_option_fee + past_due_amount + fees_due_balance
    sales_tax_amount: round((amount - past_due_amount - fees_due_balance) * use_tax_rate_pct / 100, 2)
  params:
    purchase_quote_valid_days: =purchase_quote_valid_days
    purchase_option_grace_days: =purchase_option_grace_days
    third_party_purchase_fee: =third_party_purchase_fee
    turn_in_window_days_before_maturity: =turn_in_window_days_before_maturity
- id: lease_early_termination
  subject:
  - lease_early_terminated
  - lease_end_charge
  - lease_vehicle_turned_in
  rule: 'An early termination is the lessee''s own act of returning the vehicle before the scheduled turn-in window.
    An early turn-in is accepted only when payments_made_count is at least early_termination_min_payments. The early
    termination charges are the shortfall, adjusted_lease_balance less realized_value and never below zero, plus
    early_termination_fee for the tier, plus the disposition fee, plus past_due_amount, plus excess mileage and
    excess wear under the end-of-term rule. For an early termination the mileage allowance is prorated: annual_mileage_allowance
    divided by 12 times lease_msr_months_elapsed. realized_value is the wholesale price the vehicle brings at Kestrel''s
    remarketing auction, net of no expenses. A pull-ahead applies only when remaining_payments is no more than pull_ahead_max_remaining_payments
    for the tier, days_past_due is 0, and the customer has signed a new Kestrel lease, a new-vehicle retail contract
    or a balloon contract whose lease_date or contract_date falls within loyalty_window_days calendar days before
    the turn-in date. A qualifying pull-ahead is recorded as a scheduled-end turn-in with termination_type pull_ahead:
    the remaining payments are waived, and no shortfall and no early termination fee is charged; mileage is prorated
    as for an early termination and wear and disposition follow the end-of-term rule. A tier whose pull_ahead_max_remaining_payments
    is 0 has no pull-ahead.'
  eligibility:
  - id: min_payments
    applies_to:
    - lease_early_terminated
    kind: authorization
    condition: An early turn-in is accepted only when payments_made_count is at least early_termination_min_payments.
    evidence_fields:
    - lease_contracts.payments_made_count
    - lease_contracts.lease_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.lease_contract_id
      action_bindings:
        lease_contracts.lease_contract_id: lease_contract_id
  - id: pull_ahead
    applies_to:
    - lease_vehicle_turned_in
    kind: authorization
    condition: A pull-ahead applies only when remaining_payments is no more than pull_ahead_max_remaining_payments
      for the tier, days_past_due is 0, and the customer has signed a new Kestrel lease, a new-vehicle retail contract
      or a balloon contract whose lease_date or contract_date falls within loyalty_window_days calendar days before
      the turn-in date.
    evidence_fields:
    - lease_contracts.remaining_payments
    - lease_contracts.days_past_due
    - lease_contracts.customer_id
    - retail_contracts.contract_date
    - retail_contracts.customer_id
    - balloon_contracts.contract_date
    - balloon_contracts.customer_id
    - lease_contracts.lease_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lease_contracts.customer_id
      action_bindings:
        lease_contracts.customer_id: customer_id
  measures:
  - lease_msr_months_elapsed
  - lease_msr_miles_over
  formula:
    shortfall: max(0, adjusted_lease_balance - realized_value)
  params:
    per_tier:
      Kestrel Lease Tier 5:
        early_termination_fee: =early_termination_fee
        pull_ahead_max_remaining_payments: =pull_ahead_max_remaining_payments
      Kestrel Lease Tier 4:
        early_termination_fee: =early_termination_fee
        pull_ahead_max_remaining_payments: =pull_ahead_max_remaining_payments
      Kestrel Lease Tier 3:
        early_termination_fee: =early_termination_fee
        pull_ahead_max_remaining_payments: =pull_ahead_max_remaining_payments
      Kestrel Lease Tier 2:
        early_termination_fee: =early_termination_fee
        pull_ahead_max_remaining_payments: =pull_ahead_max_remaining_payments
      Kestrel Lease Tier 1:
        early_termination_fee: =early_termination_fee
        pull_ahead_max_remaining_payments: =pull_ahead_max_remaining_payments
      Kestrel Lease Tier 1+:
        early_termination_fee: =early_termination_fee
        pull_ahead_max_remaining_payments: =pull_ahead_max_remaining_payments
    early_termination_min_payments: =early_termination_min_payments
    loyalty_window_days: =loyalty_window_days
- id: lease_repossession_and_reinstatement
  subject:
  - lease_repossessed
  - lease_reinstated
  - lease_repo_expense
  rule: 'A lease may be assigned for repossession only when days_past_due is at least repo_assignment_min_days_past_due
    for the tier. A repossession expense can be charged only while the lease status is repossessed. The agency fee
    is repo_agency_fee_involuntary and storage is storage_daily_fee per day from repossession_date until release
    or sale. A reinstatement must be completed no later than reinstatement_company_window_days after the leased
    vehicle was repossessed. The window is counted in calendar days starting the day after repossession_date, and
    completion on the last day is timely. The lease must show reinstatements_used below reinstatement_max_per_contract
    for the tier. The reinstatement amount is past_due_amount plus fees_due_balance, paid in certified funds; the
    lease then resumes on its original schedule. A repossessed lease that is not reinstated is terminated: the vehicle
    is sold and the early termination charges apply with the realised sale price as realized_value.'
