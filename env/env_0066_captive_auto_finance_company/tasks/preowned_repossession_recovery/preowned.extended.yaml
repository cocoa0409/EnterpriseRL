        max_odometer_miles: =max_odometer_miles
        cpo_apr_reduction_pct: =cpo_apr_reduction_pct
        non_kestrel_make_apr_adder_pct: =non_kestrel_make_apr_adder_pct
      Kestrel Pre-Owned Retail Tier 4:
        max_vehicle_age_years: =max_vehicle_age_years
        max_odometer_miles: =max_odometer_miles
        cpo_apr_reduction_pct: =cpo_apr_reduction_pct
        non_kestrel_make_apr_adder_pct: =non_kestrel_make_apr_adder_pct
      Kestrel Pre-Owned Retail Tier 3:
        max_vehicle_age_years: =max_vehicle_age_years
        max_odometer_miles: =max_odometer_miles
        cpo_apr_reduction_pct: =cpo_apr_reduction_pct
        non_kestrel_make_apr_adder_pct: =non_kestrel_make_apr_adder_pct
      Kestrel Pre-Owned Retail Tier 2:
        max_vehicle_age_years: =max_vehicle_age_years
        max_odometer_miles: =max_odometer_miles
