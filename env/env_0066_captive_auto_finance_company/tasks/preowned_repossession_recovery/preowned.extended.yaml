- id: preowned_ext_deficiency_quote
  base_policy_refs: [preowned_payoff_and_refunds, preowned_sale_and_deficiency, preowned_repossession_charges]
  overwrite:
  - base_policy: preowned_payoff_and_refunds
    superseded_clause: The per diem is the principal_balance times apr divided by per_diem_day_basis, rounded to the cent, and the payoff amount is principal_balance plus fees_due_balance plus the per diem times preowned_msr_quote_interest_days.
    replaced_by: >-
      For a deficiency quote this policy produces, and only for such a quote, the figure is worked out as this policy states; a redemption quote is figured under the redemption-quote schedule, and every other payoff quote is the principal balance plus the fees due balance plus the per diem, rounded to the cent, times the days from the day after the interest-paid-to date through the good-through date.
  - base_policy: preowned_sale_and_deficiency
    superseded_clause: Net proceeds are gross_proceeds less sale_expenses and are applied to principal
    replaced_by: >-
      The auction's net proceeds, the gross sale price less its sale expenses, stay applied to principal as posted; in a deficiency quote this policy produces, the auction's disposition expenses are allowed only up to a share of
      the gross sale price, and the part of those expenses above that share is credited against the figure, computed as
      the expenses less the share times the gross sale price, never below zero: for a voluntary surrender the share is
      the voluntary-surrender expense share; for an involuntary recovery whose gross sale price is below the low-value sale limit the share is the low-value expense share; otherwise the expenses stand as the auction deducted them and nothing is credited.
  - base_policy: preowned_repossession_charges
    superseded_clause: Storage is charged at storage_daily_fee for each day the vehicle is stored beyond storage_free_days, counting from repossession_date to the release or sale date, and is billed when the vehicle leaves the lot.
    replaced_by: >-
      For storage carried into a deficiency quote this policy produces, and only for such storage, the billed storage
      days on the most recent storage charge are capped when the company held the vehicle longer than the notice period
      before selling it, and the storage on the billed days above the cap is credited against the figure at the daily
      storage fee for the tier: where the state notice period recorded on the contract is longer than the company
      minimum notice period and the sale took place more days after the notice of intent to sell than that state period,
      the cap is the state period; where the state period recorded is not longer than the company minimum and the sale
      took place more days after the notice of intent to sell than the company minimum, the cap is the company minimum;
      otherwise, including a contract with no notice of intent to sell or no storage charge on record, there is no cap and nothing is credited. Storage is billed only for days the vehicle is on the storage lot, and each such day only once. The lot days of an involuntary recovery whose most recent condition report is dated after the repossession date run from the day after that lot-intake date, the nights before it being the agency's holding, billed on its transport charge and never as storage; the lot days of a voluntary surrender run from the repossession date itself; any other lot days run from the day after the repossession date. A lot day up to and including the latest statement date on which a storage charge was billed is billed by that charge, whatever the charge came to, and a lot day collected in a redemption figure or a reinstatement amount or counted into a deficiency quote is not billed again. Every other lot day through the release or sale date is charged at the daily storage fee once the free days are used up, and it is billed when the vehicle leaves the lot. The free days for that charge follow the recovery history: an involuntary recovery of a contract that shows an earlier reinstatement payment has none, a voluntary surrender of a contract that shows no reinstatement payment has the surrender free days, and any other recovery has the free days for the tier, in each case less any free days an earlier storage charge for the same repossession already set against its stored days.
  trigger: on_request
  subject: [preowned_payoff_quote]
  computes: amount
  target_tool: quote_deficiency_balance_4c162eac
  params:
    surrender_free_days: 7
    nonaccrual_days: 60
    notice_grace_days: 3
    relationship_share_long: 0.3
    relationship_share_short: 0.6
    relationship_min_lease_payments: 12
    voluntary_expense_share_pct: 6.0
    low_value_expense_share_pct: 10.0
    low_value_sale_limit: 15000.0
  rule: >-
    A deficiency quote states what a customer whose repossessed vehicle has been sold at auction still owes on the
    contract, as of the quote date; it is produced when the customer asks for the deficiency balance, and its
    good-through date is the quote validity period for the tier after the quote date. For a deficiency quote this policy produces, and only for such a quote, the figure is worked out as this policy states; a redemption quote is figured under the redemption-quote schedule, and every other payoff quote is the principal balance plus the fees due balance plus the per diem, rounded to the cent, times the days from the day after the interest-paid-to date through the good-through date. For an involuntary recovery, the deficiency figure is not stated until the account carries the transport charge for that recovery, dated on or after its repossession date. The standard deficiency figure is the principal
    balance plus the fees due balance plus interest, rounded to the cent; interest is the per diem times the days from
    the day after the interest-paid-to date through the good-through date, and the per diem is the principal balance
    times the contract rate divided by the day basis for the tier, rounded to the cent. The records the deficiency figure reads are the most recent of their kind on the contract (the auction sale, the deficiency notice and the storage charge), and where two records of a kind share a date the first one listed is read. The sale date is the sale date recorded on the contract. Each schedule below changes that standard on its own: the interest days are split at the sale date into the days up to and including the sale date,
    which keep the contract rate, and the days after it; credits are subtracted from the figure; and the figure is
    rounded to the cent once at the end. Interest after the sale date runs to an end that follows how the vehicle came
    back and how long ago it was sold: for a voluntary surrender no interest runs after the sale date; for an involuntary
    recovery sold at least the non-accrual period of days before the quote date, interest after the sale runs for the
    non-accrual period of days only; otherwise interest after the sale runs through the good-through date. Interest for
    the days after the sale date is figured at a post-sale annual rate that follows the customer's other Kestrel lease:
    where the customer holds more than one active Kestrel lease, the first one the lease lookup lists is the one read: where that active Kestrel lease shows no days past due and at least the relationship minimum of lease payments made, the post-sale rate is the long-relationship share of the contract rate, that is the contract rate times that share; where it shows no days past due and fewer lease payments made than that minimum, the post-sale rate is the short-relationship share of the contract rate; otherwise, including a customer with no active Kestrel lease, the post-sale rate is the contract rate; the post-sale per diem is the principal
    balance times that rate divided by the day basis for the tier, rounded to the cent. Days after the sale on which the
    customer had not yet been told of the deficiency carry no interest: where no deficiency notice has been mailed, every day after the sale date is interest-free; where the most recent deficiency notice was mailed more than the notice grace days after the sale date, the days after the sale date up to and including the notice mailing date are interest-free; otherwise no post-sale day is interest-free; the interest-free days are taken off the post-sale days, never below zero. The auction's net proceeds, the gross sale price less its sale expenses, stay applied to principal as posted; in a deficiency quote this policy produces, the auction's disposition expenses are allowed only up to a share of the gross
    sale price, and the part of those expenses above that share is credited against the figure, computed as the expenses
    less the share times the gross sale price, never below zero: for a voluntary surrender the share is the
    voluntary-surrender expense share; for an involuntary recovery whose gross sale price is below the low-value sale limit the share is the low-value expense share; otherwise the expenses stand as the auction deducted them and nothing is credited. For storage carried into a deficiency quote this policy produces, and only for such storage, the billed
    storage days on the most recent storage charge are capped when the company held the vehicle longer than the notice
    period before selling it, and the storage on the billed days above the cap is credited against the figure at the
    daily storage fee for the tier: where the state notice period recorded on the contract is longer than the company
    minimum notice period and the sale took place more days after the notice of intent to sell than that state period,
    the cap is the state period; where the state period recorded is not longer than the company minimum and the sale
    took place more days after the notice of intent to sell than the company minimum, the cap is the company minimum;
    otherwise, including a contract with no notice of intent to sell or no storage charge on record, there is no cap and nothing is credited. Storage is billed only for days the vehicle is on the storage lot, and each such day only once. The lot days of an involuntary recovery whose most recent condition report is dated after the repossession date run from the day after that lot-intake date, the nights before it being the agency's holding, billed on its transport charge and never as storage; the lot days of a voluntary surrender run from the repossession date itself; any other lot days run from the day after the repossession date. A lot day up to and including the latest statement date on which a storage charge was billed is billed by that charge, whatever the charge came to, and a lot day collected in a redemption figure or a reinstatement amount or counted into a deficiency quote is not billed again. Every other lot day through the release or sale date is charged at the daily storage fee once the free days are used up, and it is billed when the vehicle leaves the lot. The free days for that charge follow the recovery history: an involuntary recovery of a contract that shows an earlier reinstatement payment has none, a voluntary surrender of a contract that shows no reinstatement payment has the surrender free days, and any other recovery has the free days for the tier, in each case less any free days an earlier storage charge for the same repossession already set against its stored days.
  prerequisite:
  - problem: preowned_ext_recovery_transport_charge
    kind: value_input
    gate: fees_due
    form: state
    policy_source: >-
      For an involuntary recovery, the deficiency figure is not stated until the account carries the transport charge for that recovery, dated on or after its repossession date.
    condition: >-
      Where the repossession type recorded on the contract is involuntary, the contract's posting history holds a repossession expense of the transport kind dated on or after the repossession date recorded on the contract, and the fees due balance includes it; a voluntary surrender has no transport charge and the condition holds.
    resolved_by: book_recovery_transport_6b5d55b7
    effect: >-
      Once the transport charge is booked the fees due balance rises by that charge, and the fees due binding of the
      deficiency figure rises with it.
  cross_category:
  - category: lease
    as: branch
    reads: [status, days_past_due, payments_made_count]
    note: The post-sale interest rate tier is decided from the customer's active Kestrel lease, its days past due and its payments made.
  compute:
  - principal: "F('principal_balance')"
  - fees_due: "F('fees_due_balance')"
  - contract_rate: "F('apr')"
  - sale_date: "F('scheduled_sale_date')"
  - quote_validity_days: "P('payoff_quote_valid_days')"
  - pre_sale_days: "DAYS(F('interest_paid_to_date'), sale_date)"
  - post_sale_end_days: "0 if F('repossession_type') == 'voluntary_surrender' else (K('nonaccrual_days') if (F('repossession_type') == 'involuntary' and DAYS(sale_date, NOW) >= K('nonaccrual_days')) else DAYS(sale_date, NOW) + quote_validity_days)"
  - lease_days_past_due: "CFIELD('lease', 'days_past_due', status='active')"
  - lease_payments_made: "CFIELD('lease', 'payments_made_count', status='active')"
  - post_sale_rate: "contract_rate * K('relationship_share_long') if (lease_days_past_due == 0 and lease_payments_made >= K('relationship_min_lease_payments')) else (contract_rate * K('relationship_share_short') if (lease_days_past_due == 0 and lease_payments_made != None and lease_payments_made < K('relationship_min_lease_payments')) else contract_rate)"
  - deficiency_notice_date: "LATEST('preowned_transactions', 'txn_date', date_field='txn_date', event_type='preowned_notice_mailed', notice_type='deficiency_notice')"
  - interest_free_days: "DAYS(sale_date, NOW) + quote_validity_days if COUNT('preowned_transactions', event_type='preowned_notice_mailed', notice_type='deficiency_notice') == 0 else (DAYS(sale_date, deficiency_notice_date) if DAYS(sale_date, deficiency_notice_date) > K('notice_grace_days') else 0)"
  - post_sale_days: "MX(0, post_sale_end_days - interest_free_days)"
  - pre_sale_per_diem: "RND(principal * contract_rate / 100 / P('per_diem_day_basis'), 2)"
  - post_sale_per_diem: "RND(principal * post_sale_rate / 100 / P('per_diem_day_basis'), 2)"
  - interest: "pre_sale_per_diem * pre_sale_days + post_sale_per_diem * post_sale_days"
  - gross_sale: "LATEST('preowned_transactions', 'gross_proceeds', date_field='txn_date', event_type='preowned_repo_sale')"
  - sale_expense: "LATEST('preowned_transactions', 'sale_expenses', date_field='txn_date', event_type='preowned_repo_sale')"
  - expense_share_pct: "K('voluntary_expense_share_pct') if F('repossession_type') == 'voluntary_surrender' else (K('low_value_expense_share_pct') if (F('repossession_type') == 'involuntary' and LATEST('preowned_transactions', 'gross_proceeds', date_field='txn_date', event_type='preowned_repo_sale') < K('low_value_sale_limit')) else 100.0)"
  - disposition_credit: "MX(0, sale_expense - gross_sale * expense_share_pct / 100) if expense_share_pct < 100 else 0.0"
  - storage_billed_days: "LATEST('preowned_transactions', 'service_days', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') or 0"
  - notice_to_sale_days: "DAYS(F('nois_mailed_date'), sale_date) if F('nois_mailed_date') else 0"
  - storage_cap_days: "F('nois_min_days') if (F('nois_min_days') > P('company_min_days_nois_to_sale') and notice_to_sale_days > F('nois_min_days')) else (P('company_min_days_nois_to_sale') if (F('nois_min_days') <= P('company_min_days_nois_to_sale') and notice_to_sale_days > P('company_min_days_nois_to_sale')) else storage_billed_days)"
  - storage_credit: "MX(0, storage_billed_days - storage_cap_days) * P('storage_daily_fee')"
  - result: "RND(principal + fees_due - disposition_credit - storage_credit + interest, 2)"
  compute_basis:
    principal: "The standard deficiency figure is the principal balance plus the fees due balance plus interest, rounded to the cent"
    fees_due: "The standard deficiency figure is the principal balance plus the fees due balance plus interest, rounded to the cent"
    contract_rate: "the per diem is the principal balance times the contract rate divided by the day basis for the tier, rounded to the cent."
    sale_date: "The sale date is the sale date recorded on the contract."
    quote_validity_days: "its good-through date is the quote validity period for the tier after the quote date."
    pre_sale_days: "interest is the per diem times the days from the day after the interest-paid-to date through the good-through date"
    post_sale_end_days: "Interest after the sale date runs to an end that follows how the vehicle came back and how long ago it was sold: for a voluntary surrender no interest runs after the sale date; for an involuntary recovery sold at least the non-accrual period of days before the quote date, interest after the sale runs for the non-accrual period of days only; otherwise interest after the sale runs through the good-through date."
    lease_days_past_due: "where the customer holds more than one active Kestrel lease, the first one the lease lookup lists is the one read"
    lease_payments_made: "where the customer holds more than one active Kestrel lease, the first one the lease lookup lists is the one read"
    post_sale_rate: "where that active Kestrel lease shows no days past due and at least the relationship minimum of lease payments made, the post-sale rate is the long-relationship share of the contract rate, that is the contract rate times that share; where it shows no days past due and fewer lease payments made than that minimum, the post-sale rate is the short-relationship share of the contract rate; otherwise, including a customer with no active Kestrel lease, the post-sale rate is the contract rate"
    deficiency_notice_date: "Days after the sale on which the customer had not yet been told of the deficiency carry no interest"
    interest_free_days: "where no deficiency notice has been mailed, every day after the sale date is interest-free; where the most recent deficiency notice was mailed more than the notice grace days after the sale date, the days after the sale date up to and including the notice mailing date are interest-free; otherwise no post-sale day is interest-free"
    post_sale_days: "the interest-free days are taken off the post-sale days, never below zero."
    pre_sale_per_diem: "the per diem is the principal balance times the contract rate divided by the day basis for the tier, rounded to the cent."
    post_sale_per_diem: "the post-sale per diem is the principal balance times that rate divided by the day basis for the tier, rounded to the cent."
    interest: "the interest days are split at the sale date into the days up to and including the sale date, which keep the contract rate, and the days after it"
    gross_sale: "the part of those expenses above that share is credited against the figure, computed as the expenses less the share times the gross sale price, never below zero"
    sale_expense: "the part of those expenses above that share is credited against the figure, computed as the expenses less the share times the gross sale price, never below zero"
    expense_share_pct: "for a voluntary surrender the share is the voluntary-surrender expense share; for an involuntary recovery whose gross sale price is below the low-value sale limit the share is the low-value expense share; otherwise the expenses stand as the auction deducted them and nothing is credited."
    disposition_credit: "the part of those expenses above that share is credited against the figure, computed as the expenses less the share times the gross sale price, never below zero"
    storage_billed_days: "the billed storage days on the most recent storage charge are capped when the company held the vehicle longer than the notice period before selling it"
    notice_to_sale_days: "the sale took place more days after the notice of intent to sell than that state period"
    storage_cap_days: "where the state notice period recorded on the contract is longer than the company minimum notice period and the sale took place more days after the notice of intent to sell than that state period, the cap is the state period; where the state period recorded is not longer than the company minimum and the sale took place more days after the notice of intent to sell than the company minimum, the cap is the company minimum; otherwise, including a contract with no notice of intent to sell or no storage charge on record, there is no cap and nothing is credited"
    storage_credit: "the storage on the billed days above the cap is credited against the figure at the daily storage fee for the tier"
    result: "credits are subtracted from the figure; and the figure is rounded to the cent once at the end."
  factors:
  - id: post_sale_accrual_end
    effect: method
    decides: post_sale_end_days
    bindings: [post_sale_end_days]
    ladder:
    - when: "the vehicle came back by voluntary surrender"
      method: "interest stops at the sale date, so no day after the sale is counted"
    - when: "the recovery was involuntary and the sale date is at least the non-accrual period of days before the quote date"
      method: "post-sale interest is anchored to the sale date and runs for the non-accrual period of days only"
    - when: "otherwise"
      method: "post-sale interest runs from the day after the sale date through the good-through date"
    baseline:
      post_sale_end_days: "DAYS(sale_date, NOW) + quote_validity_days"
    evidence: [date]
    cross_difficulty: null
  - id: lease_relationship_rate
    effect: parameter
    decides: post_sale_rate
    bindings: [lease_days_past_due, lease_payments_made, post_sale_rate, post_sale_per_diem]
    ladder:
    - when: "the customer holds an active Kestrel lease with no days past due and at least the relationship minimum of lease payments made"
      value: "the contract rate times K('relationship_share_long')"
    - when: "the customer holds an active Kestrel lease with no days past due and fewer lease payments made than the relationship minimum"
      value: "the contract rate times K('relationship_share_short')"
    - when: "otherwise"
      value: "the contract rate"
    baseline:
      post_sale_rate: "contract_rate"
    evidence: [cross_category]
    cross_difficulty: lease
  - id: notice_delay_relief
    effect: parameter
    decides: interest_free_days
    bindings: [deficiency_notice_date, interest_free_days]
    ladder:
    - when: "the deficiency notice was mailed more than the notice grace days after the sale date"
      value: "the days from the sale date through the notice mailing date"
    - when: "no deficiency notice has been mailed"
      value: "every day after the sale date"
    - when: "otherwise"
      value: "0"
    baseline:
      interest_free_days: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: disposition_expense_share
    effect: parameter
    decides: expense_share_pct
    bindings: [gross_sale, sale_expense, expense_share_pct, disposition_credit]
    ladder:
    - when: "the vehicle came back by voluntary surrender"
      value: "K('voluntary_expense_share_pct')"
    - when: "the recovery was involuntary and the gross sale price is below the low-value sale limit"
      value: "K('low_value_expense_share_pct')"
    - when: "otherwise"
      value: "100 percent, the expenses as the auction deducted them"
    baseline:
      expense_share_pct: "100.0"
    evidence: [history]
    cross_difficulty: null
  - id: held_storage_cap
    effect: parameter
    decides: storage_cap_days
    bindings: [storage_billed_days, notice_to_sale_days, storage_cap_days, storage_credit]
    ladder:
    - when: "the state notice period recorded is longer than the company minimum and the sale came more days after the notice of intent to sell than that state period"
      value: "the state notice period recorded on the contract"
    - when: "the state notice period recorded is not longer than the company minimum and the sale came more days after the notice of intent to sell than the company minimum"
      value: "P('company_min_days_nois_to_sale')"
    - when: "otherwise"
      value: "the billed storage days, no cap"
    baseline:
      storage_cap_days: "storage_billed_days"
    evidence: [date, history]
    cross_difficulty: null
  baseline:
    rule: >-
