extended_policies:
- id: preowned_ext_recovery_transport_charge
  base_policy_refs: [preowned_repossession_charges]
  overwrite:
  - base_policy: preowned_repossession_charges
    superseded_clause: A repossession expense can be charged only while the contract status is repo_assigned or repossessed.
    replaced_by: >-
      For a transport charge this policy books, and only for such a charge, the charge may be booked while the contract
      is assigned for repossession, repossessed, or in deficiency after the recovered vehicle was sold; every other
      repossession expense can be charged only while the contract is assigned for repossession or repossessed.
  - base_policy: preowned_repossession_charges
    superseded_clause: a transport fee of repo_transport_fee applies only to an involuntary recovery
    replaced_by: >-
      An involuntary recovery carries one transport charge, for the recovery tow and the agency's holding of the vehicle
      until it reached the storage lot; a voluntary surrender carries no transport charge, because the customer delivers
      the vehicle, and none is booked.
  trigger: state_due
  subject: [preowned_repo_expense]
  computes: amount
  target_tool: book_recovery_transport_6b5d55b7
  params:
    routine_search_days: 7
    skip_trace_days: 14
    rate_extended_search: 160.0
    rate_skip_trace: 185.0
    repeat_second_surcharge: 30.0
    repeat_third_surcharge: 60.0
    sunday_surcharge: 70.0
    saturday_surcharge: 50.0
    yard_rate_per_night: 25.0
    yard_cap_nights: 7
    yard_long_hold_rate: 15.0
  rule: >-
    The towing work on a recovery is billed to the contract from the repossession agency's invoice as one transport charge per recovery, dated the lot-intake date, that is the date of the condition report taken when the vehicle reached the storage lot for this recovery, the most recent condition report, dated on or after the repossession date; it is owed from that date whether or not the customer calls; no transport charge is owed while no condition report dated on or after the repossession date is on record, because the vehicle has not yet reached the lot; and the delivery of a vehicle
    to an auction is an auction sale expense, not a transport charge. An involuntary recovery carries one transport
    charge, for the recovery tow and the agency's holding of the vehicle until it reached the storage lot; a voluntary
    surrender carries no transport charge, because the customer delivers the vehicle, and none is booked. For a
    transport charge this policy books, and only for such a charge, the charge may be booked while the contract is
    assigned for repossession, repossessed, or in deficiency after the recovered vehicle was sold; every other
    repossession expense can be charged only while the contract is assigned for repossession or repossessed. The
    standard transport charge for an involuntary recovery is the transport fee for the tier, rounded to the cent. Each
    schedule below replaces the standard tow rate or adds its own amount on its own: the replacement comes first, every
    added amount is then added once, and the charge is rounded to the cent once at the end. The tow rate follows how long
    the agency needed to find the vehicle, counted in calendar days from the assignment date to the repossession date
    recorded on the contract (the assignment date not counted, the repossession date counted): a recovery made more than
    the skip-trace threshold days after assignment is billed at the skip-trace rate; a recovery made more than the
    routine threshold days but no more than the skip-trace threshold days after assignment is billed at the
    extended-search rate; any other recovery, including one with no assignment date on record, is billed at the transport
    fee for the tier. A vehicle the agency has had to recover before carries a repeat-recovery surcharge, counted from
    the repossession agency fees posted on the contract: three or more agency fees carry the third-recovery surcharge;
    exactly two agency fees carry the second-recovery surcharge; a single agency fee, or none posted, carries none. A recovery made on a
    weekend carries a weekend surcharge, following the day of the week of the repossession date: a Sunday recovery
    carries the Sunday surcharge; a Saturday recovery carries the Saturday surcharge; a recovery on a Monday through
    Friday carries none. The agency's holding of the vehicle before lot intake is charged by the nights it held the
    vehicle, counted as the calendar days from the repossession date to the lot-intake date (the repossession date not
    counted, the lot-intake date counted), the lot-intake date being the date of the most recent condition report and,
    where two condition reports share that date, the first one listed: a hold of one night up to the yard cap nights is charged at the yard rate for each night; a hold of more than the yard cap nights is charged the yard rate for each of the first yard cap nights plus the long-hold rate for each further night, so the charge never falls as the hold grows; a vehicle taken to the lot on the day of the repossession, a contract whose most recent condition report is dated on or before the repossession date (no report yet taken for this recovery), or one with no condition report on record carries no holding charge.
  prerequisite: []
  cross_category: []
  compute:
  - search_days: "DAYS(F('repo_assigned_date'), F('repossession_date')) if F('repo_assigned_date') else 0"
  - tow_rate: "K('rate_skip_trace') if search_days > K('skip_trace_days') else (K('rate_extended_search') if search_days > K('routine_search_days') else P('repo_transport_fee'))"
  - agency_fees_posted: "COUNT('preowned_transactions', event_type='preowned_repo_expense', fee_type='repossession_agency_fee')"
  - repeat_surcharge: "K('repeat_third_surcharge') if agency_fees_posted >= 3 else (K('repeat_second_surcharge') if agency_fees_posted == 2 else 0.0)"
  - recovery_weekday: "DAYS('2024-01-07', F('repossession_date')) % 7"
  - weekend_surcharge: "K('sunday_surcharge') if recovery_weekday == 0 else (K('saturday_surcharge') if recovery_weekday == 6 else 0.0)"
  - lot_intake_date: "LATEST('preowned_transactions', 'txn_date', date_field='txn_date', event_type='preowned_repo_expense', fee_type='condition_report_fee')"
  - yard_nights: "DAYS(F('repossession_date'), lot_intake_date) if (lot_intake_date != None and lot_intake_date > F('repossession_date')) else 0"
  - yard_charge: "yard_nights * K('yard_rate_per_night') if (yard_nights >= 1 and yard_nights <= K('yard_cap_nights')) else (K('yard_cap_nights') * K('yard_rate_per_night') + (yard_nights - K('yard_cap_nights')) * K('yard_long_hold_rate') if yard_nights > K('yard_cap_nights') else 0.0)"
  - result: "0.0 if F('repossession_type') == 'voluntary_surrender' else RND(tow_rate + repeat_surcharge + weekend_surcharge + yard_charge, 2)"
  compute_basis:
    search_days: "counted in calendar days from the assignment date to the repossession date recorded on the contract (the assignment date not counted, the repossession date counted)"
    tow_rate: "a recovery made more than the skip-trace threshold days after assignment is billed at the skip-trace rate; a recovery made more than the routine threshold days but no more than the skip-trace threshold days after assignment is billed at the extended-search rate; any other recovery, including one with no assignment date on record, is billed at the transport fee for the tier."
    agency_fees_posted: "A vehicle the agency has had to recover before carries a repeat-recovery surcharge, counted from the repossession agency fees posted on the contract"
    repeat_surcharge: "three or more agency fees carry the third-recovery surcharge; exactly two agency fees carry the second-recovery surcharge; a single agency fee, or none posted, carries none."
    recovery_weekday: "A recovery made on a weekend carries a weekend surcharge, following the day of the week of the repossession date"
    weekend_surcharge: "a Sunday recovery carries the Sunday surcharge; a Saturday recovery carries the Saturday surcharge; a recovery on a Monday through Friday carries none."
    lot_intake_date: "the lot-intake date being the date of the most recent condition report and, where two condition reports share that date, the first one listed"
    yard_nights: "counted as the calendar days from the repossession date to the lot-intake date (the repossession date not counted, the lot-intake date counted)"
    yard_charge: "a hold of one night up to the yard cap nights is charged at the yard rate for each night; a hold of more than the yard cap nights is charged the yard rate for each of the first yard cap nights plus the long-hold rate for each further night, so the charge never falls as the hold grows; a vehicle taken to the lot on the day of the repossession, a contract whose most recent condition report is dated on or before the repossession date (no report yet taken for this recovery), or one with no condition report on record carries no holding charge."
    result: "the replacement comes first, every added amount is then added once, and the charge is rounded to the cent once at the end."
  factors:
  - id: agency_search_time
    effect: parameter
    decides: tow_rate
    bindings: [search_days, tow_rate]
    ladder:
    - when: "more than the skip-trace threshold days passed from assignment to repossession"
      value: "K('rate_skip_trace')"
    - when: "more than the routine threshold days but no more than the skip-trace threshold days passed from assignment to repossession"
      value: "K('rate_extended_search')"
    - when: "otherwise"
      value: "P('repo_transport_fee')"
    baseline:
      tow_rate: "P('repo_transport_fee')"
    evidence: [date]
    cross_difficulty: null
  - id: repeat_recovery
    effect: parameter
    decides: repeat_surcharge
    bindings: [agency_fees_posted, repeat_surcharge]
    ladder:
    - when: "three or more repossession agency fees are posted on the contract"
      value: "K('repeat_third_surcharge')"
    - when: "exactly two repossession agency fees are posted on the contract"
      value: "K('repeat_second_surcharge')"
    - when: "otherwise"
      value: "0.0"
    baseline:
      repeat_surcharge: "0.0"
    evidence: [history]
    cross_difficulty: null
  - id: weekend_recovery
    effect: parameter
    decides: weekend_surcharge
    bindings: [recovery_weekday, weekend_surcharge]
    ladder:
    - when: "the repossession date falls on a Sunday"
      value: "K('sunday_surcharge')"
    - when: "the repossession date falls on a Saturday"
      value: "K('saturday_surcharge')"
    - when: "otherwise"
      value: "0.0"
    baseline:
      weekend_surcharge: "0.0"
    evidence: [date]
    cross_difficulty: null
  - id: agency_yard_hold
    effect: method
    decides: yard_charge
    bindings: [lot_intake_date, yard_nights, yard_charge]
    ladder:
    - when: "the agency held the vehicle from one night up to the yard cap nights before lot intake"
      method: "single rate: the nights held times the yard rate per night"
    - when: "the agency held the vehicle more than the yard cap nights before lot intake"
      method: "tiered: the first yard cap nights at the yard rate plus every further night at the long-hold rate"
    - when: "otherwise"
      method: "no holding charge is computed"
    baseline:
      yard_charge: "0.0"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard transport charge for an involuntary recovery is the transport fee for the tier, rounded to the cent.
    params: [repo_transport_fee]
  inputs:
