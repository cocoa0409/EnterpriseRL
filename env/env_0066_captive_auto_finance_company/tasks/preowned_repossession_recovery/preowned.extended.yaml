- id: preowned_ext_deficiency_settlement
  base_policy_refs: [preowned_payment_posting, preowned_reinstatement_and_redemption, preowned_sale_and_deficiency]
  overwrite:
  - base_policy: preowned_payment_posting
    superseded_clause: A payment received before payment_cutoff_time_ct Central Time on a business day posts that day; a payment received later, or on a weekend or US federal holiday, posts the next business day.
    replaced_by: >-
      For a settlement payment this policy takes, and only for such a payment, the customer sends it by bank wire from the customer's own bank account, a certified-funds channel that is accepted while the contract takes certified funds only, and the wire is credited when it is received, whatever the hour: a wire sent on a Monday through Friday posts the same day, and one sent on a Saturday or a Sunday posts on the Monday that follows; a settlement is not taken on a US federal holiday or on a Saturday or Sunday before a Monday that is one. Every payment other than a deficiency settlement wire or reinstatement funds, both of which post on the day they are received or on the Monday after a weekend as the settlement and reinstatement terms state, keeps the standard posting: one received before the payment cutoff time Central Time on a business day posts that day, and one received later, or on a weekend or US federal holiday, posts the next business day.
  - base_policy: preowned_sale_and_deficiency
    superseded_clause: A deficiency balance may be settled for a lump sum of at least deficiency_settlement_min_pct percent of the deficiency, which pays the contract in full; a smaller offer is not within the servicing desk's authority.
    replaced_by: >-
      A deficiency left after a repossessed vehicle is sold may be settled by the customer with a single lump-sum
      payment that pays the contract in full; the desk states one settlement figure, worked out as this policy states,
      and an offer below that figure is not within the servicing desk's authority.
  trigger: on_request
  subject: [preowned_payment]
  computes: amount
  target_tool: remit_deficiency_settlement_2e6b8900
  params:
    recent_sale_days: 90
    mid_age_sale_days: 180
    recent_sale_pct: 80
    mid_age_sale_pct: 70
    long_history_installments: 24
    short_history_installments: 12
    long_history_points: 5
    short_history_points: 10
    relationship_min_lease_payments: 12
    relationship_points: 5
    delinquent_relationship_points: 5
    large_balance_amount: 3000.0
    small_balance_amount: 1000.0
    large_balance_points: 5
    small_balance_points: 10
  rule: >-
    A deficiency left after a repossessed vehicle is sold may be settled by the customer with a single lump-sum payment
    that pays the contract in full; the desk states one settlement figure, worked out as this policy states, and an offer
    below that figure is not within the servicing desk's authority. The settlement figure is fixed only after a
    deficiency quote dated the settlement date stands on the account. The standard settlement figure is the minimum settlement percentage for the tier applied to the amount of the most recent deficiency quote on the account (the first one listed where two share a date, and nothing where none stands), rounded to the cent; a deficiency quote is a payoff quote issued to the customer, and a quote produced for a redemption or for a third party is not one. Each schedule below changes that standard on its own: a schedule that replaces a figure of the standard does so first, percentage points the schedules add are added to the percentage next, the percentage is never below the minimum settlement percentage for the tier, and the figure is rounded to the cent once at the end. The age percentage follows how long ago the vehicle was sold,
    counted in calendar days from the sale date recorded on the contract to the settlement date, the day the settlement figure is stated: a sale no more than the recent-sale days ago uses
    the recent-sale percentage; a sale more than the recent-sale days but no more than the mid-age days ago uses the
    mid-age percentage; an older sale uses the minimum settlement percentage for the tier. The payment-history adjustment
    follows the installment payments and extensions posted on the contract: at least the long-history count of
    installment payments posted together with no extension ever posted lowers the percentage by the long-history points;
    fewer than the short-history count of installment payments posted raises it by the short-history points; any other
    history leaves it unchanged. The relationship adjustment follows the customer's active Kestrel lease, and where the customer holds more than one active Kestrel lease the first one the lease lookup lists is the one read: an active
    Kestrel lease with no days past due and at least the relationship minimum of lease payments made lowers the
    percentage by the relationship points; an active Kestrel lease with any days past due raises it by the
    delinquent-relationship points; otherwise it is unchanged. The balance-size adjustment follows the amount of the most recent deficiency quote, the first one listed where two share a date: a quote of at least the large-balance amount lowers the percentage by the large-balance
    points; a quote below the small-balance amount raises it by the small-balance points; any other quote leaves it
    unchanged. The settlement base follows the recovery history in the contract's posting record: where the contract
    shows an earlier reinstatement payment and its last recovery was involuntary, the percentage applies to the quoted
    amount less the fees due balance, and the fees due balance is added in full; where the contract shows no
    reinstatement payment and the vehicle came back by voluntary surrender, the percentage applies to the quoted amount
    less the fees due balance, and the fees due balance is not collected; otherwise the percentage applies to the whole
    quoted amount. For a settlement payment this policy takes, and only for such a payment, the customer sends it by bank wire from the customer's own bank account, a certified-funds channel that is accepted while the contract takes certified funds only, and the wire is credited when it is received, whatever the hour: a wire sent on a Monday through Friday posts the same day, and one sent on a Saturday or a Sunday posts on the Monday that follows; a settlement is not taken on a US federal holiday or on a Saturday or Sunday before a Monday that is one. Every payment other than a deficiency settlement wire or reinstatement funds, both of which post on the day they are received or on the Monday after a weekend as the settlement and reinstatement terms state, keeps the standard posting: one received before the payment cutoff time Central Time on a business day posts that day, and one received later, or on a weekend or US federal holiday, posts the next business day. The settlement is applied on its posting date as every payment is, first to the simple interest accrued since the interest-paid-to date, then to principal until the past-due amount is satisfied, then to fees due, and any remainder to principal; once it posts the contract is paid in full and whatever principal and fees remain are closed.
  prerequisite:
  - problem: preowned_ext_deficiency_quote
    kind: value_input
    gate: quote_amount
    form: state
    policy_source: >-
      The settlement figure is fixed only after a deficiency quote dated the settlement date stands on the account.
    condition: >-
      The contract's posting history holds a deficiency quote, a payoff quote issued to the customer, whose quote date is the settlement date, and it is the most recent such quote on the contract.
    resolved_by: quote_deficiency_balance_4c162eac
    effect: >-
      Once the deficiency quote dated the settlement date is posted, the quoted amount the settlement base and the
      balance-size adjustment read is that quote's amount instead of any earlier quote's.
  cross_category:
  - category: lease
    as: branch
    reads: [status, days_past_due, payments_made_count]
    note: The relationship adjustment tier is decided from the customer's active Kestrel lease, its days past due and its payments made.
  compute:
  - quote_amount: "LATEST('preowned_transactions', 'amount', date_field='txn_date', event_type='preowned_payoff_quote', quote_purpose='customer_payoff') or 0.0"
  - fees_due: "F('fees_due_balance')"
  - age_pct: "K('recent_sale_pct') if DAYS(F('scheduled_sale_date'), NOW) <= K('recent_sale_days') else (K('mid_age_sale_pct') if DAYS(F('scheduled_sale_date'), NOW) <= K('mid_age_sale_days') else P('deficiency_settlement_min_pct'))"
  - installment_payments_posted: "COUNT('preowned_transactions', event_type='preowned_payment', payment_purpose='installment')"
  - extensions_posted: "COUNT('preowned_transactions', event_type='preowned_extension')"
  - history_points: "0 - K('long_history_points') if (installment_payments_posted >= K('long_history_installments') and extensions_posted == 0) else (K('short_history_points') if installment_payments_posted < K('short_history_installments') else 0)"
  - lease_past_due_days: "CFIELD('lease', 'days_past_due', status='active')"
  - lease_payments_count: "CFIELD('lease', 'payments_made_count', status='active')"
  - relationship_points: "0 - K('relationship_points') if (lease_past_due_days == 0 and lease_payments_count >= K('relationship_min_lease_payments')) else (K('delinquent_relationship_points') if (lease_past_due_days != None and lease_past_due_days > 0) else 0)"
  - size_points: "0 - K('large_balance_points') if (LATEST('preowned_transactions', 'amount', date_field='txn_date', event_type='preowned_payoff_quote', quote_purpose='customer_payoff') or 0.0) >= K('large_balance_amount') else (K('small_balance_points') if (LATEST('preowned_transactions', 'amount', date_field='txn_date', event_type='preowned_payoff_quote', quote_purpose='customer_payoff') or 0.0) < K('small_balance_amount') else 0)"
  - reinstatement_payments_posted: "COUNT('preowned_transactions', event_type='preowned_payment', payment_purpose='reinstatement')"
  - settlement_base: "quote_amount - fees_due if ((reinstatement_payments_posted >= 1 and F('repossession_type') == 'involuntary') or (reinstatement_payments_posted == 0 and F('repossession_type') == 'voluntary_surrender')) else quote_amount"
  - outside_base_part: "fees_due if (reinstatement_payments_posted >= 1 and F('repossession_type') == 'involuntary') else 0.0"
  - settlement_pct: "MX(P('deficiency_settlement_min_pct'), age_pct + history_points + relationship_points + size_points)"
  - result: "RND(settlement_pct / 100 * settlement_base + outside_base_part, 2)"
  compute_basis:
    quote_amount: "The standard settlement figure is the minimum settlement percentage for the tier applied to the amount of the most recent deficiency quote on the account (the first one listed where two share a date, and nothing where none stands), rounded to the cent; a deficiency quote is a payoff quote issued to the customer, and a quote produced for a redemption or for a third party is not one."
    fees_due: "the percentage applies to the quoted amount less the fees due balance, and the fees due balance is added in full"
    age_pct: "The age percentage follows how long ago the vehicle was sold, counted in calendar days from the sale date recorded on the contract to the settlement date, the day the settlement figure is stated: a sale no more than the recent-sale days ago uses the recent-sale percentage; a sale more than the recent-sale days but no more than the mid-age days ago uses the mid-age percentage; an older sale uses the minimum settlement percentage for the tier."
    installment_payments_posted: "The payment-history adjustment follows the installment payments and extensions posted on the contract"
    extensions_posted: "The payment-history adjustment follows the installment payments and extensions posted on the contract"
    history_points: "at least the long-history count of installment payments posted together with no extension ever posted lowers the percentage by the long-history points; fewer than the short-history count of installment payments posted raises it by the short-history points; any other history leaves it unchanged."
    lease_past_due_days: "The relationship adjustment follows the customer's active Kestrel lease"
    lease_payments_count: "The relationship adjustment follows the customer's active Kestrel lease"
    relationship_points: "an active Kestrel lease with no days past due and at least the relationship minimum of lease payments made lowers the percentage by the relationship points; an active Kestrel lease with any days past due raises it by the delinquent-relationship points; otherwise it is unchanged."
    size_points: "The balance-size adjustment follows the amount of the most recent deficiency quote, the first one listed where two share a date: a quote of at least the large-balance amount lowers the percentage by the large-balance points; a quote below the small-balance amount raises it by the small-balance points; any other quote leaves it unchanged."
    reinstatement_payments_posted: "The settlement base follows the recovery history in the contract's posting record"
    settlement_base: "where the contract shows an earlier reinstatement payment and its last recovery was involuntary, the percentage applies to the quoted amount less the fees due balance, and the fees due balance is added in full; where the contract shows no reinstatement payment and the vehicle came back by voluntary surrender, the percentage applies to the quoted amount less the fees due balance, and the fees due balance is not collected; otherwise the percentage applies to the whole quoted amount."
    outside_base_part: "the percentage applies to the quoted amount less the fees due balance, and the fees due balance is added in full"
    settlement_pct: "percentage points the schedules add are added to the percentage next, the percentage is never below the minimum settlement percentage for the tier"
    result: "Each schedule below changes that standard on its own: a schedule that replaces a figure of the standard does so first, percentage points the schedules add are added to the percentage next, the percentage is never below the minimum settlement percentage for the tier, and the figure is rounded to the cent once at the end."
  factors:
