- id: preowned_ext_release_storage_charge
  base_policy_refs: [preowned_repossession_charges]
  overwrite:
  - base_policy: preowned_repossession_charges
    superseded_clause: Storage is charged at storage_daily_fee for each day the vehicle is stored beyond storage_free_days, counting from repossession_date to the release or sale date, and is billed when the vehicle leaves the lot.
    replaced_by: >-
      For storage this policy bills through a statement date, and only for such storage, the storage charge is worked out
      as this policy states. Storage is billed only for days the vehicle is on the storage lot, and each such day only once. The lot days of an involuntary recovery whose most recent condition report is dated after the repossession date run from the day after that lot-intake date, the nights before it being the agency's holding, billed on its transport charge and never as storage; the lot days of a voluntary surrender run from the repossession date itself; any other lot days run from the day after the repossession date. A lot day up to and including the latest statement date on which a storage charge was billed is billed by that charge, whatever the charge came to, and a lot day collected in a redemption figure or a reinstatement amount or counted into a deficiency quote is not billed again. Every other lot day through the release or sale date is charged at the daily storage fee once the free days are used up, and it is billed when the vehicle leaves the lot. The free days for that charge follow the recovery history: an involuntary recovery of a contract that shows an earlier reinstatement payment has none, a voluntary surrender of a contract that shows no reinstatement payment has the surrender free days, and any other recovery has the free days for the tier, in each case less any free days an earlier storage charge for the same repossession already set against its stored days.
  trigger: state_due
  subject: [preowned_repo_expense]
  computes: amount
  target_tool: bill_lot_storage_d761f3de
  params:
    surrender_free_days: 7
    statutory_rate: 12.0
    window_rate: 15.0
    oversize_newer_per_day: 10.0
    oversize_older_per_day: 6.0
    newer_model_years: 5
  rule: >-
    Storage on a repossessed vehicle is billed to the contract as one storage charge through a statement date whenever
    the company must state an amount the customer has to pay to get the vehicle back; the charge is owed once such an
    amount is owed, whether or not the customer calls, it records the billable days it covers, and it is booked even
    when it comes to 0.00. For storage this policy bills through a statement date, and only for such storage, the
    storage charge is worked out as this policy states. Storage is billed only for days the vehicle is on the storage lot, and each such day only once. The lot days of an involuntary recovery whose most recent condition report is dated after the repossession date run from the day after that lot-intake date, the nights before it being the agency's holding, billed on its transport charge and never as storage; the lot days of a voluntary surrender run from the repossession date itself; any other lot days run from the day after the repossession date. A lot day up to and including the latest statement date on which a storage charge was billed is billed by that charge, whatever the charge came to, and a lot day collected in a redemption figure or a reinstatement amount or counted into a deficiency quote is not billed again. Every other lot day through the release or sale date is charged at the daily storage fee once the free days are used up, and it is billed when the vehicle leaves the lot. The free days for that charge follow the recovery history: an involuntary recovery of a contract that shows an earlier reinstatement payment has none, a voluntary surrender of a contract that shows no reinstatement payment has the surrender free days, and any other recovery has the free days for the tier, in each case less any free days an earlier storage charge for the same repossession already set against its stored days. The standard storage charge is the daily storage fee for the tier times the billable days, where the billable
    days are the stored days less the free days for the tier, never below zero, and the stored days are counted from the
    day after the repossession date through the statement date, both included; the charge is rounded to the cent. Each
    schedule below replaces a standard figure or adds its own daily amount on its own: replacements come first, the
    daily amounts are then added together, their sum is multiplied by the billable days, and the charge is rounded to
    the cent once at the end. The free days follow the recovery history in the posting record: an involuntary recovery
    of a contract that shows an earlier reinstatement payment gets no free days; a voluntary surrender of a contract that
    shows no reinstatement payment gets the surrender free days; any other recovery gets the free days for the tier. The
    stored days follow where the vehicle has been held, the lot-intake date being the date of the most recent condition
    report, the first one listed where two share a date: for an involuntary recovery whose lot-intake date is after the
    repossession date, the agency held the vehicle until then and billed that holding on its transport charge, so the
    stored days are counted from the day after the lot-intake date through the statement date; for a voluntary surrender
    the surrender day itself counts, so the stored days are counted from the repossession date through the statement
    date, both included; otherwise, including a contract with no condition report on record, the stored days are counted
    from the day after the repossession date through the statement date. The daily rate follows the reinstatement period
    running on the statement date, counted in calendar days from the repossession date (not counted) to the statement
    date (counted): while the statement date is within a recorded state reinstatement period longer than the company
    reinstatement window for the tier, the statutory-period rate applies; while it is within the company reinstatement
    window for the tier and no longer state period is recorded, the window rate applies; otherwise the daily storage fee
    for the tier applies. Oversize vehicles carry a daily oversize surcharge that follows the vehicle description printed
    on the contract and the vehicle's age, the age being the whole years from January 1 of the model year to the
    statement date, a year counted only once it is complete: a heavy-duty model (HD) or a van no more than the
    newer-model years old is held in the secure oversize bay at the newer-model surcharge; an older heavy-duty model or
    van is held in the open oversize bay at the older-model surcharge; any other vehicle carries no oversize surcharge.
  prerequisite: []
  cross_category: []
  compute:
  - recovery_kind: "F('repossession_type')"
  - reinstatement_payments: "COUNT('preowned_transactions', event_type='preowned_payment', payment_purpose='reinstatement')"
  - free_days: "0 if (recovery_kind == 'involuntary' and reinstatement_payments >= 1) else (K('surrender_free_days') if (recovery_kind == 'voluntary_surrender' and reinstatement_payments == 0) else P('storage_free_days'))"
  - lot_intake_date: "LATEST('preowned_transactions', 'txn_date', date_field='txn_date', event_type='preowned_repo_expense', fee_type='condition_report_fee')"
  - stored_days: "DAYS(lot_intake_date, NOW) if (recovery_kind == 'involuntary' and lot_intake_date != None and lot_intake_date > F('repossession_date')) else (DAYS(F('repossession_date'), NOW) + 1 if recovery_kind == 'voluntary_surrender' else DAYS(F('repossession_date'), NOW))"
  - daily_rate: "K('statutory_rate') if (F('state_reinstatement_days') > P('reinstatement_company_window_days') and DAYS(F('repossession_date'), NOW) <= F('state_reinstatement_days')) else (K('window_rate') if (F('state_reinstatement_days') <= P('reinstatement_company_window_days') and DAYS(F('repossession_date'), NOW) <= P('reinstatement_company_window_days')) else P('storage_daily_fee'))"
  - vehicle_age_years: "MONTHS(F('vehicle_year') + '-01-01', NOW) // 12"
  - oversize_daily: "K('oversize_newer_per_day') if (('HD' in F('vehicle_model') or 'Van' in F('vehicle_model')) and vehicle_age_years <= K('newer_model_years')) else (K('oversize_older_per_day') if ('HD' in F('vehicle_model') or 'Van' in F('vehicle_model')) else 0.0)"
  - billable_days: "MX(0, stored_days - free_days)"
  - result: "RND((daily_rate + oversize_daily) * billable_days, 2)"
  compute_basis:
    recovery_kind: "The free days follow the recovery history in the posting record"
    reinstatement_payments: "an involuntary recovery of a contract that shows an earlier reinstatement payment gets no free days"
    free_days: "an involuntary recovery of a contract that shows an earlier reinstatement payment gets no free days; a voluntary surrender of a contract that shows no reinstatement payment gets the surrender free days; any other recovery gets the free days for the tier."
    lot_intake_date: "the lot-intake date being the date of the most recent condition report, the first one listed where two share a date"
    stored_days: "for an involuntary recovery whose lot-intake date is after the repossession date, the agency held the vehicle until then and billed that holding on its transport charge, so the stored days are counted from the day after the lot-intake date through the statement date; for a voluntary surrender the surrender day itself counts, so the stored days are counted from the repossession date through the statement date, both included; otherwise, including a contract with no condition report on record, the stored days are counted from the day after the repossession date through the statement date."
    daily_rate: "while the statement date is within a recorded state reinstatement period longer than the company reinstatement window for the tier, the statutory-period rate applies; while it is within the company reinstatement window for the tier and no longer state period is recorded, the window rate applies; otherwise the daily storage fee for the tier applies."
    vehicle_age_years: "the age being the whole years from January 1 of the model year to the statement date, a year counted only once it is complete"
    oversize_daily: "a heavy-duty model (HD) or a van no more than the newer-model years old is held in the secure oversize bay at the newer-model surcharge; an older heavy-duty model or van is held in the open oversize bay at the older-model surcharge; any other vehicle carries no oversize surcharge."
    billable_days: "the billable days are the stored days less the free days for the tier, never below zero"
    result: "replacements come first, the daily amounts are then added together, their sum is multiplied by the billable days, and the charge is rounded to the cent once at the end."
