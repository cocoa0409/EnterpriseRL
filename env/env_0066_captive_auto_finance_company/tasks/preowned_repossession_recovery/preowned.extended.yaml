    params: [payoff_quote_valid_days, per_diem_day_basis]
  inputs:
    history:
    - {table: preowned_transactions, aggregate: latest, field: txn_date, filters: {event_type: preowned_notice_mailed, notice_type: deficiency_notice}}
    - {table: preowned_transactions, aggregate: latest, field: gross_proceeds, filters: {event_type: preowned_repo_sale}}
    - {table: preowned_transactions, aggregate: latest, field: service_days, filters: {event_type: preowned_repo_expense, fee_type: storage_fee}}
