    kind: state
    condition: A notice can be mailed only while the contract status is active, repo_assigned, repossessed, deficiency
      or paid_in_full.
    evidence_fields:
    - preowned_contracts.status
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
    state_contract:
      field: preowned_contracts.status
      allowed:
      - active
      - repo_assigned
      - repossessed
      - deficiency
      - paid_in_full
  params:
    per_tier:
      Kestrel Pre-Owned Retail Tier 5:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Pre-Owned Retail Tier 4:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Pre-Owned Retail Tier 3:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Pre-Owned Retail Tier 2:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Pre-Owned Retail Tier 1:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel Pre-Owned Retail Tier 1+:
