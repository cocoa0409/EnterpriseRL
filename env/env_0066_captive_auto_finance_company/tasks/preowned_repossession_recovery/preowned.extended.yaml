      For storage a redemption figure this policy produces collects in advance, and only for such storage, the storage is worked out as this policy states. Storage is billed only for days the vehicle is on the storage lot, and each such day only once. The lot days of an involuntary recovery whose most recent condition report is dated after the repossession date run from the day after that lot-intake date, the nights before it being the agency's holding, billed on its transport charge and never as storage; the lot days of a voluntary surrender run from the repossession date itself; any other lot days run from the day after the repossession date. A lot day up to and including the latest statement date on which a storage charge was billed is billed by that charge, whatever the charge came to, and a lot day collected in a redemption figure or a reinstatement amount or counted into a deficiency quote is not billed again. Every other lot day through the release or sale date is charged at the daily storage fee once the free days are used up, and it is billed when the vehicle leaves the lot. The free days for that charge follow the recovery history: an involuntary recovery of a contract that shows an earlier reinstatement payment has none, a voluntary surrender of a contract that shows no reinstatement payment has the surrender free days, and any other recovery has the free days for the tier, in each case less any free days an earlier storage charge for the same repossession already set against its stored days.
  trigger: state_due
  subject: [preowned_payoff_quote]
  computes: amount
  target_tool: quote_redemption_amount_aa560e9a
  params:
    surrender_free_days: 7
    reconditioning_newer: 200.0
    reconditioning_older: 350.0
    newer_model_years: 5
  rule: >-
    A redemption quote states what the customer must pay to get a repossessed vehicle back by paying the contract off
    before the sale; it is owed whenever the company must state the redemption amount, whether or not the customer
    calls. For a redemption quote this policy produces, and only for such a quote, the figure and its good-through date
    are worked out as this policy states; a deficiency quote is figured under the deficiency-quote schedule, and every
    other payoff quote is the principal balance plus the fees due balance plus the per diem, rounded to the cent, times
    the days from the day after the interest-paid-to date through the good-through date, which is the quote validity
    period for the tier after the quote date unless the requester asks for an earlier date. The redemption figure is not
    stated until the account carries a storage charge billed for the current repossession on the quote date. The
    standard redemption figure is the principal balance plus the fees due balance plus interest, rounded to the cent;
    interest is the per diem times the days from the day after the interest-paid-to date through the good-through date,
    the good-through date is the quote validity period for the tier after the quote date, and the per diem is the
    principal balance times the contract rate divided by the day basis for the tier, rounded to the cent. Each schedule
    below replaces the standard interest end or adds or takes out its own amount on its own: the interest end is
    replaced first, amounts are then added to or taken from the figure, and the figure is rounded to the cent once at
    the end; the reinstatement periods below are counted in calendar days from the repossession date (not counted). The
    interest end follows the reinstatement period running on the quote date, and the quote is good through the same
    day: for an involuntary recovery with a recorded state reinstatement period longer than the company reinstatement
    window for the tier, still running, interest runs through and the quote is good through the last day of that state
    period; for an involuntary recovery with no such longer state period, while the company reinstatement window for
    the tier is still running, interest runs through and the quote is good through the last day of that window;
    otherwise interest runs through the good-through date of the standard figure. An involuntarily recovered vehicle
    carries the estimated cost of preparing it for the sale the redemption takes the place of, an expense of disposition
    the redemption must cover, following the vehicle's age, the whole years from January 1 of the model year to the
    quote date, a year counted only once it is complete: a vehicle more than the newer-model years old carries the
    older-model reconditioning estimate; a vehicle no more than that carries the newer-model reconditioning estimate; a
    voluntary surrender carries none. Storage still to accrue on the storage lot while the figure is good is added, at the daily amount of the most recent storage charge (its amount divided by its billable days; the first one listed where two share a date), or at the daily storage fee for the tier where that charge covers no billable day or no storage charge is on record, for the days after the quote date: for a vehicle on the storage lot, shown by a condition report dated on or after the repossession date (the most recent report, the first one listed where two share a date), while a recorded state reinstatement period longer than the
    company window is running, through the last day of that state period; for a vehicle on the storage lot while the
    company reinstatement window is running and no longer state period is recorded, through the last day of that window;
    otherwise no storage is projected. For storage a redemption figure this policy produces collects in advance, and only for such storage, the storage is worked out as this policy states. Storage is billed only for days the vehicle is on the storage lot, and each such day only once. The lot days of an involuntary recovery whose most recent condition report is dated after the repossession date run from the day after that lot-intake date, the nights before it being the agency's holding, billed on its transport charge and never as storage; the lot days of a voluntary surrender run from the repossession date itself; any other lot days run from the day after the repossession date. A lot day up to and including the latest statement date on which a storage charge was billed is billed by that charge, whatever the charge came to, and a lot day collected in a redemption figure or a reinstatement amount or counted into a deficiency quote is not billed again. Every other lot day through the release or sale date is charged at the daily storage fee once the free days are used up, and it is billed when the vehicle leaves the lot. The free days for that charge follow the recovery history: an involuntary recovery of a contract that shows an earlier reinstatement payment has none, a voluntary surrender of a contract that shows no reinstatement payment has the surrender free days, and any other recovery has the free days for the tier, in each case less any free days an earlier storage charge for the same repossession already set against its stored days. The company leaves out of a redemption figure fees it does not collect on a
    payoff made during a reinstatement period, counted from the fees posted after the same calendar day twelve months before the quote date, up to and including the quote date, and never more than the fees due balance: while the quote date is within a recorded state reinstatement period, returned-payment fees and extension fees are left out; while it is within the company reinstatement window and no state reinstatement period is running, returned-payment fees are left out; otherwise no fee is left out.
  prerequisite:
  - problem: preowned_ext_release_storage_charge
    kind: value_input
    gate: fees_due
    form: state
    policy_source: >-
      The redemption figure is not stated until the account carries a storage charge billed for the current repossession
      on the quote date.
    condition: >-
      The contract's posting history holds a repossession expense of the storage kind posted on the quote date, after
      the repossession date recorded on the contract, and the fees due balance includes it.
    resolved_by: bill_lot_storage_d761f3de
    effect: >-
      Once the storage charge is billed the fees due balance rises by it and the most recent storage charge carries the
      daily amount the projected storage reads, so the fees due binding and the projected storage both change.
  cross_category: []
  compute:
  - principal: "F('principal_balance')"
  - fees_due: "F('fees_due_balance')"
  - contract_rate: "F('apr')"
  - quote_validity_days: "P('payoff_quote_valid_days')"
  - recovery_kind: "F('repossession_type')"
  - interest_days: "DAYS(F('interest_paid_to_date'), F('repossession_date')) + F('state_reinstatement_days') if (recovery_kind == 'involuntary' and F('state_reinstatement_days') > P('reinstatement_company_window_days') and DAYS(F('repossession_date'), NOW) <= F('state_reinstatement_days')) else (DAYS(F('interest_paid_to_date'), F('repossession_date')) + P('reinstatement_company_window_days') if (recovery_kind == 'involuntary' and F('state_reinstatement_days') <= P('reinstatement_company_window_days') and DAYS(F('repossession_date'), NOW) <= P('reinstatement_company_window_days')) else DAYS(F('interest_paid_to_date'), NOW) + quote_validity_days)"
  - per_diem: "RND(principal * contract_rate / 100 / P('per_diem_day_basis'), 2)"
  - interest: "per_diem * interest_days"
  - vehicle_age_years: "MONTHS(F('vehicle_year') + '-01-01', NOW) // 12"
  - reconditioning: "K('reconditioning_older') if (recovery_kind == 'involuntary' and vehicle_age_years > K('newer_model_years')) else (K('reconditioning_newer') if (recovery_kind == 'involuntary' and vehicle_age_years <= K('newer_model_years')) else 0.0)"
  - lot_intake_date: "LATEST('preowned_transactions', 'txn_date', date_field='txn_date', event_type='preowned_repo_expense', fee_type='condition_report_fee')"
  - storage_daily_amount: "LATEST('preowned_transactions', 'amount', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') / LATEST('preowned_transactions', 'service_days', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') if (LATEST('preowned_transactions', 'service_days', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') != None and LATEST('preowned_transactions', 'service_days', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') >= 1) else P('storage_daily_fee')"
  - projected_storage_days: "MX(0, F('state_reinstatement_days') - DAYS(F('repossession_date'), NOW)) if (lot_intake_date != None and lot_intake_date >= F('repossession_date') and F('state_reinstatement_days') > P('reinstatement_company_window_days')) else (MX(0, P('reinstatement_company_window_days') - DAYS(F('repossession_date'), NOW)) if (lot_intake_date != None and lot_intake_date >= F('repossession_date')) else 0)"
  - projected_storage: "projected_storage_days * storage_daily_amount"
  - excluded_fees: "MN(fees_due, SUM('preowned_transactions', 'amount', within_months=12, date_field='txn_date', event_type='preowned_returned_payment_fee') + SUM('preowned_transactions', 'amount', within_months=12, date_field='txn_date', event_type='preowned_extension') if (F('state_reinstatement_days') > 0 and DAYS(F('repossession_date'), NOW) <= F('state_reinstatement_days')) else (SUM('preowned_transactions', 'amount', within_months=12, date_field='txn_date', event_type='preowned_returned_payment_fee') if DAYS(F('repossession_date'), NOW) <= P('reinstatement_company_window_days') else 0.0))"
  - result: "RND(principal + fees_due - excluded_fees + interest + reconditioning + projected_storage, 2)"
  compute_basis:
    principal: "The standard redemption figure is the principal balance plus the fees due balance plus interest, rounded to the cent"
    fees_due: "The standard redemption figure is the principal balance plus the fees due balance plus interest, rounded to the cent"
    contract_rate: "the per diem is the principal balance times the contract rate divided by the day basis for the tier, rounded to the cent."
    quote_validity_days: "the good-through date is the quote validity period for the tier after the quote date"
    recovery_kind: "The interest end follows the reinstatement period running on the quote date, and the quote is good through the same day"
    interest_days: "for an involuntary recovery with a recorded state reinstatement period longer than the company reinstatement window for the tier, still running, interest runs through and the quote is good through the last day of that state period; for an involuntary recovery with no such longer state period, while the company reinstatement window for the tier is still running, interest runs through and the quote is good through the last day of that window; otherwise interest runs through the good-through date of the standard figure."
    per_diem: "the per diem is the principal balance times the contract rate divided by the day basis for the tier, rounded to the cent."
    interest: "interest is the per diem times the days from the day after the interest-paid-to date through the good-through date"
    vehicle_age_years: "the whole years from January 1 of the model year to the quote date, a year counted only once it is complete"
    reconditioning: "a vehicle more than the newer-model years old carries the older-model reconditioning estimate; a vehicle no more than that carries the newer-model reconditioning estimate; a voluntary surrender carries none."
    lot_intake_date: "for a vehicle on the storage lot, shown by a condition report dated on or after the repossession date (the most recent report, the first one listed where two share a date)"
    storage_daily_amount: "at the daily amount of the most recent storage charge (its amount divided by its billable days; the first one listed where two share a date), or at the daily storage fee for the tier where that charge covers no billable day or no storage charge is on record"
    projected_storage_days: "for a vehicle on the storage lot, shown by a condition report dated on or after the repossession date (the most recent report, the first one listed where two share a date), while a recorded state reinstatement period longer than the company window is running, through the last day of that state period; for a vehicle on the storage lot while the company reinstatement window is running and no longer state period is recorded, through the last day of that window; otherwise no storage is projected."
    projected_storage: "Storage still to accrue on the storage lot while the figure is good is added"
    excluded_fees: "while the quote date is within a recorded state reinstatement period, returned-payment fees and extension fees are left out; while it is within the company reinstatement window and no state reinstatement period is running, returned-payment fees are left out; otherwise no fee is left out."
    result: "the interest end is replaced first, amounts are then added to or taken from the figure, and the figure is rounded to the cent once at the end"
  factors:
  - id: redemption_interest_end
    effect: method
    decides: interest_days
    bindings: [interest_days]
    ladder:
    - when: "the recovery was involuntary and a recorded state reinstatement period longer than the company window is still running"
      method: "interest days are anchored to the repossession date and run through the last day of the state reinstatement period"
    - when: "the recovery was involuntary, no longer state period is recorded and the company reinstatement window is still running"
      method: "interest days are anchored to the repossession date and run through the last day of the company reinstatement window"
    - when: "otherwise"
      method: "interest days run from the quote date through the quote validity period"
    baseline:
      interest_days: "DAYS(F('interest_paid_to_date'), NOW) + quote_validity_days"
    evidence: [date]
    cross_difficulty: null
  - id: reconditioning_estimate
    effect: parameter
    decides: reconditioning
    bindings: [vehicle_age_years, reconditioning]
    ladder:
    - when: "the recovery was involuntary and the vehicle is more than the newer-model years old"
      value: "K('reconditioning_older')"
    - when: "the recovery was involuntary and the vehicle is no more than the newer-model years old"
      value: "K('reconditioning_newer')"
    - when: "otherwise"
      value: "0.0"
    baseline:
      reconditioning: "0.0"
    evidence: [date]
    cross_difficulty: null
  - id: projected_lot_storage
    effect: parameter
    decides: projected_storage_days
    bindings: [lot_intake_date, storage_daily_amount, projected_storage_days, projected_storage]
    ladder:
    - when: "the most recent condition report is dated on or after the repossession date and a recorded state reinstatement period longer than the company window is running"
      value: "the days after the quote date through the last day of the state reinstatement period"
    - when: "the most recent condition report is dated on or after the repossession date and the company reinstatement window is running with no longer state period"
      value: "the days after the quote date through the last day of the company window, never below zero"
    - when: "otherwise"
      value: "0"
    baseline:
      projected_storage_days: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: payoff_fee_concession
    effect: parameter
    decides: excluded_fees
    bindings: [excluded_fees]
    ladder:
    - when: "the quote date is within a recorded state reinstatement period"
      value: "returned-payment fees and extension fees posted in the last twelve months"
    - when: "the quote date is within the company reinstatement window and no state reinstatement period is running"
      value: "returned-payment fees posted in the last twelve months"
    - when: "otherwise"
      value: "0"
    baseline:
      excluded_fees: "0.0"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard redemption figure is the principal balance plus the fees due balance plus interest, rounded to the
      cent; interest is the per diem times the days from the day after the interest-paid-to date through the
      good-through date, the good-through date is the quote validity period for the tier after the quote date, and the
      per diem is the principal balance times the contract rate divided by the day basis for the tier, rounded to the
      cent.
    params: [payoff_quote_valid_days, per_diem_day_basis]
  inputs:
    history:
    - {table: preowned_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: preowned_returned_payment_fee}}
    - {table: preowned_transactions, aggregate: latest, field: amount, filters: {event_type: preowned_repo_expense, fee_type: storage_fee}}
    cross_category: []
- id: preowned_ext_sale_notice_schedule
  base_policy_refs: [preowned_repossession_assignment, preowned_sale_and_deficiency]
  overwrite: []
  trigger: state_due
  subject: [preowned_notice_mailed, preowned_repo_record_updated]
  computes: days_to_sale
  target_tool: mail_sale_notice_3d21c42f
  params:
    long_standing_installments: 24
    long_standing_days: 10
    established_installments: 12
    established_days: 5
    current_relationship_days: 7
    past_due_relationship_days: 3
    newer_model_years: 5
    heavy_prep_newer_days: 7
    heavy_prep_older_days: 4
    lot_transfer_days: 2
    dealer_transfer_days: 4
  rule: >-
    When a vehicle has been repossessed, the notice of intent to sell is mailed within the notice mailing period after
    the repossession date, sets the scheduled sale date and states it with the redemption and any reinstatement amount;
    it is owed whether or not the customer calls. The notice of intent to sell is not mailed until a redemption quote
    dated the mailing date stands on the account. The scheduled sale date is stated as a number of calendar days after
    the mailing date. The standard sale date is the first day after the notice period, the notice period being the
    company minimum notice period or, where the state notice period recorded on the contract is longer, that state
    period; that is, the notice period plus one day after the mailing date. A sale date that falls on a Saturday or a Sunday moves to the following Monday, because the auction lanes run on business days. Each schedule below acts on its own: a
    schedule that anchors the sale to another day replaces the standard date only when that day is later, the days the
    other schedules add are then added to the later of the two, the anchors are compared before any days are added, and the move off a weekend comes last.
    The sale is not held while a reinstatement right is still running: where the state reinstatement period recorded on
    the contract is longer than the company reinstatement window for the tier, the sale is anchored to the day after the
    state period ends, counted from the repossession date; where it is not longer and the contract shows fewer
    reinstatement payments than the tier's maximum reinstatements, the sale is anchored to the day after the company
    window ends, counted the same way; otherwise there is no such anchor. Established customers get added days before
    the sale, following the installment payments posted on the contract: at least the long-standing count of installment
    payments together with no returned payment dated after the same calendar day twelve months before the mailing date, up to and including the mailing date adds the
    long-standing days; at least the established count of installment payments, where the long-standing condition is
    not met, adds the established days; otherwise no days are added. The customer's Kestrel New Vehicle retail contract adds relationship days, and where the customer holds more than one active retail contract the first one the retail lookup lists is the one read: an active retail contract with no days past due adds the current-relationship days; an
    active retail contract with days past due adds the past-due-relationship days; otherwise, including a customer with no active retail contract, no days are added. Heavy
    vehicles need more preparation before auction, following the vehicle description and its age, the whole years from January 1 of the model year to the mailing date, a year counted only once it is complete: a heavy-duty model (HD) or a van no more than the newer-model years
    old adds the newer heavy-preparation days; an older heavy-duty model or van adds the older heavy-preparation days;
    any other vehicle adds none. A vehicle that has to be moved to the auction adds transfer days: a vehicle held on the storage lot, shown by a condition report dated on or after the repossession date of an involuntary recovery (the most recent report, the first one listed where two share a date), adds the lot transfer days; a voluntary surrender, left at a designated Kestrel dealer, adds the dealer transfer days; a vehicle still at the agency's yard, with no condition report dated on or after the repossession date, adds none, because the agency delivers it to the auction.
  prerequisite:
  - problem: preowned_ext_redemption_quote
    kind: state_gate
    gate: preowned_transactions.quote_purpose
    form: state
    policy_source: >-
      The notice of intent to sell is not mailed until a redemption quote dated the mailing date stands on the account.
    condition: >-
      The contract's posting history holds a payoff quote for the redemption purpose whose quote date is the mailing
      date.
    resolved_by: quote_redemption_amount_aa560e9a
    effect: >-
      Once the redemption quote dated the mailing date is posted, the notice has the redemption amount it must state and
      may be mailed.
  cross_category:
  - category: retail
    as: branch
    reads: [status, days_past_due]
    note: The relationship-days tier is decided from the customer's active Kestrel New Vehicle retail contract and its days past due.
  compute:
  - notice_period_days: "MX(P('company_min_days_nois_to_sale'), F('nois_min_days')) + 1"
  - reinstatement_anchor_days: "DAYS(NOW, F('repossession_date')) + F('state_reinstatement_days') + 1 if F('state_reinstatement_days') > P('reinstatement_company_window_days') else (DAYS(NOW, F('repossession_date')) + P('reinstatement_company_window_days') + 1 if COUNT('preowned_transactions', event_type='preowned_payment', payment_purpose='reinstatement') < P('reinstatement_max_per_contract') else 0)"
  - installment_payments: "COUNT('preowned_transactions', event_type='preowned_payment', payment_purpose='installment')"
  - recent_returned_payments: "COUNT('preowned_transactions', within_months=12, date_field='txn_date', event_type='preowned_payment_returned')"
  - established_days: "K('long_standing_days') if (installment_payments >= K('long_standing_installments') and recent_returned_payments == 0) else (K('established_days') if installment_payments >= K('established_installments') else 0)"
  - retail_days_past_due: "CFIELD('retail', 'days_past_due', status='active')"
  - relationship_days: "K('current_relationship_days') if retail_days_past_due == 0 else (K('past_due_relationship_days') if (retail_days_past_due != None and retail_days_past_due > 0) else 0)"
  - vehicle_age_years: "MONTHS(F('vehicle_year') + '-01-01', NOW) // 12"
  - heavy_prep_days: "K('heavy_prep_newer_days') if (('HD' in F('vehicle_model') or 'Van' in F('vehicle_model')) and vehicle_age_years <= K('newer_model_years')) else (K('heavy_prep_older_days') if ('HD' in F('vehicle_model') or 'Van' in F('vehicle_model')) else 0)"
  - lot_intake_date: "LATEST('preowned_transactions', 'txn_date', date_field='txn_date', event_type='preowned_repo_expense', fee_type='condition_report_fee')"
  - transfer_days: "K('lot_transfer_days') if (F('repossession_type') == 'involuntary' and lot_intake_date != None and lot_intake_date >= F('repossession_date')) else (K('dealer_transfer_days') if F('repossession_type') == 'voluntary_surrender' else 0)"
  - scheduled_offset_days: "MX(notice_period_days, reinstatement_anchor_days) + established_days + relationship_days + heavy_prep_days + transfer_days"
  - result: "scheduled_offset_days + (1 if (DAYS('2024-01-07', NOW) + scheduled_offset_days) % 7 == 0 else (2 if (DAYS('2024-01-07', NOW) + scheduled_offset_days) % 7 == 6 else 0))"
  compute_basis:
    notice_period_days: "the notice period being the company minimum notice period or, where the state notice period recorded on the contract is longer, that state period; that is, the notice period plus one day after the mailing date."
    reinstatement_anchor_days: "where the state reinstatement period recorded on the contract is longer than the company reinstatement window for the tier, the sale is anchored to the day after the state period ends, counted from the repossession date; where it is not longer and the contract shows fewer reinstatement payments than the tier's maximum reinstatements, the sale is anchored to the day after the company window ends, counted the same way; otherwise there is no such anchor."
    installment_payments: "Established customers get added days before the sale, following the installment payments posted on the contract"
    recent_returned_payments: "together with no returned payment dated after the same calendar day twelve months before the mailing date, up to and including the mailing date"
    established_days: "at least the long-standing count of installment payments together with no returned payment dated after the same calendar day twelve months before the mailing date, up to and including the mailing date adds the long-standing days; at least the established count of installment payments, where the long-standing condition is not met, adds the established days; otherwise no days are added."
    retail_days_past_due: "where the customer holds more than one active retail contract the first one the retail lookup lists is the one read"
    relationship_days: "an active retail contract with no days past due adds the current-relationship days; an active retail contract with days past due adds the past-due-relationship days; otherwise, including a customer with no active retail contract, no days are added."
    vehicle_age_years: "its age, the whole years from January 1 of the model year to the mailing date"
    heavy_prep_days: "a heavy-duty model (HD) or a van no more than the newer-model years old adds the newer heavy-preparation days; an older heavy-duty model or van adds the older heavy-preparation days; any other vehicle adds none."
    lot_intake_date: "a vehicle held on the storage lot, shown by a condition report dated on or after the repossession date of an involuntary recovery (the most recent report, the first one listed where two share a date), adds the lot transfer days"
    transfer_days: "a vehicle held on the storage lot, shown by a condition report dated on or after the repossession date of an involuntary recovery (the most recent report, the first one listed where two share a date), adds the lot transfer days; a voluntary surrender, left at a designated Kestrel dealer, adds the dealer transfer days; a vehicle still at the agency's yard, with no condition report dated on or after the repossession date, adds none, because the agency delivers it to the auction."
    scheduled_offset_days: "a schedule that anchors the sale to another day replaces the standard date only when that day is later, the days the other schedules add are then added to the later of the two, the anchors are compared before any days are added, and the move off a weekend comes last."
    result: "A sale date that falls on a Saturday or a Sunday moves to the following Monday, because the auction lanes run on business days."
  factors:
  - id: reinstatement_right_anchor
    effect: method
    decides: reinstatement_anchor_days
    bindings: [reinstatement_anchor_days]
    ladder:
    - when: "the recorded state reinstatement period is longer than the company reinstatement window"
      method: "the sale is anchored to the day after the state reinstatement period ends, counted from the repossession date"
    - when: "the recorded state period is not longer and the contract shows fewer reinstatement payments than the tier maximum"
      method: "the sale is anchored to the day after the company reinstatement window ends, counted from the repossession date"
    - when: "otherwise"
      method: "no anchor; the sale date is counted from the mailing date only"
    baseline:
      reinstatement_anchor_days: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: established_customer_days
    effect: parameter
    decides: established_days
    bindings: [installment_payments, recent_returned_payments, established_days]
    ladder:
    - when: "at least the long-standing count of installment payments is posted and no payment was returned in the last twelve months"
      value: "K('long_standing_days')"
    - when: "at least the established count of installment payments is posted and the long-standing condition is not met"
      value: "K('established_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      established_days: "0"
    evidence: [history]
    cross_difficulty: null
  - id: retail_relationship_days
    effect: parameter
    decides: relationship_days
    bindings: [retail_days_past_due, relationship_days]
    ladder:
    - when: "the customer holds an active Kestrel New Vehicle retail contract with no days past due"
      value: "K('current_relationship_days')"
    - when: "the customer holds an active Kestrel New Vehicle retail contract with days past due"
      value: "K('past_due_relationship_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      relationship_days: "0"
    evidence: [cross_category]
    cross_difficulty: retail
  - id: heavy_vehicle_preparation
    effect: parameter
    decides: heavy_prep_days
    bindings: [vehicle_age_years, heavy_prep_days]
    ladder:
    - when: "the description names a heavy-duty model or a van and the vehicle is no more than the newer-model years old"
      value: "K('heavy_prep_newer_days')"
    - when: "the description names a heavy-duty model or a van and the vehicle is older"
      value: "K('heavy_prep_older_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      heavy_prep_days: "0"
    evidence: [date]
    cross_difficulty: null
  - id: auction_transfer_days
    effect: parameter
    decides: transfer_days
    bindings: [lot_intake_date, transfer_days]
    ladder:
    - when: "the recovery was involuntary and the most recent condition report is dated on or after the repossession date"
      value: "K('lot_transfer_days')"
    - when: "the vehicle came back by voluntary surrender"
      value: "K('dealer_transfer_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      transfer_days: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard sale date is the first day after the notice period, the notice period being the company minimum
      notice period or, where the state notice period recorded on the contract is longer, that state period; that is, the notice period plus one day after the mailing date. A sale date that falls on a Saturday or a Sunday moves to the following Monday, because the auction lanes run on business days.
    params: [company_min_days_nois_to_sale]
  inputs:
    history:
    - {table: preowned_transactions, aggregate: count, field: preowned_txn_id, filters: {event_type: preowned_payment, payment_purpose: installment}}
    - {table: preowned_transactions, aggregate: count, field: preowned_txn_id, within_months: 12, filters: {event_type: preowned_payment_returned}}
    cross_category: [retail]
- id: preowned_ext_reinstatement_funds
  base_policy_refs: [preowned_payment_posting, preowned_reinstatement_and_redemption, preowned_repossession_charges]
  overwrite:
  - base_policy: preowned_payment_posting
    superseded_clause: A payment received before payment_cutoff_time_ct Central Time on a business day posts that day; a payment received later, or on a weekend or US federal holiday, posts the next business day.
    replaced_by: >-
      For reinstatement funds this policy takes, and only for such funds, the funds are credited when they are received, whatever the hour: funds sent on a Monday through Friday post the same day, and funds sent on a Saturday or a Sunday post on the Monday that follows; reinstatement funds are not taken on a US federal holiday or on a Saturday or Sunday before a Monday that is one. Every payment other than a deficiency settlement wire or reinstatement funds, both of which post on the day they are received or on the Monday after a weekend as the settlement and reinstatement terms state, keeps the standard posting: one received before the payment cutoff time Central Time on a business day posts that day, and one received later, or on a weekend or US federal holiday, posts the next business day.
  - base_policy: preowned_reinstatement_and_redemption
    superseded_clause: The reinstatement amount is past_due_amount plus fees_due_balance, which includes late charges and every repossession expense booked; storage is billed up to the reinstatement date before the amount is stated.
    replaced_by: >-
      The reinstatement amount is fixed only after the account carries a storage charge billed for the current
      repossession on the statement date. The standard reinstatement amount is the past-due amount plus the fees due balance, which includes late charges and every repossession expense booked, less the fees a reinstatement the state period grants leaves out of its amount, rounded to the cent. A reinstatement the
      state reinstatement period recorded on the contract grants, on a statement date within that period counted in
      calendar days from the repossession date (not counted), is the customer's right, and the returned-payment fees and
      extension fees posted after the same calendar day twelve months before the statement date, up to and including the
      statement date, are left out of its amount, never more than the fees due balance. Every other reinstatement is one
      the company grants at its discretion, offered only while no other Kestrel contract or lease of the customer is the
      relationship limit days or more past due.
  - base_policy: preowned_repossession_charges
    superseded_clause: Storage is charged at storage_daily_fee for each day the vehicle is stored beyond storage_free_days, counting from repossession_date to the release or sale date, and is billed when the vehicle leaves the lot.
    replaced_by: >-
      For storage a reinstatement this policy handles collects for the days until its funds post, and only for such
      storage, the storage is worked out as this policy states. Storage is billed only for days the vehicle is on the storage lot, and each such day only once. The lot days of an involuntary recovery whose most recent condition report is dated after the repossession date run from the day after that lot-intake date, the nights before it being the agency's holding, billed on its transport charge and never as storage; the lot days of a voluntary surrender run from the repossession date itself; any other lot days run from the day after the repossession date. A lot day up to and including the latest statement date on which a storage charge was billed is billed by that charge, whatever the charge came to, and a lot day collected in a redemption figure or a reinstatement amount or counted into a deficiency quote is not billed again. Every other lot day through the release or sale date is charged at the daily storage fee once the free days are used up, and it is billed when the vehicle leaves the lot. The free days for that charge follow the recovery history: an involuntary recovery of a contract that shows an earlier reinstatement payment has none, a voluntary surrender of a contract that shows no reinstatement payment has the surrender free days, and any other recovery has the free days for the tier, in each case less any free days an earlier storage charge for the same repossession already set against its stored days.
  trigger: on_request
  subject: [preowned_payment, preowned_reinstated]
  computes: amount
  target_tool: remit_reinstatement_funds_62601f54
  params:
    surrender_free_days: 7
    pay_ahead_two_days_past_due: 90
    reserve_full_threshold_days: 15
    relationship_limit_days: 30
    returned_reserve_share: 0.25
  rule: >-
    A customer whose vehicle has been repossessed may get it back by reinstating the contract: the customer pays the
    reinstatement amount from the customer's own funds in certified funds (a cashier's check, a wire or a MoneyGram); the
    payment, the return to active and the counting of the reinstatement are recorded when the funds are sent and take
    effect on the posting date, and the vehicle is released once the funds post; For reinstatement funds this policy takes, and only for such funds, the funds are credited when they are received, whatever the hour: funds sent on a Monday through Friday post the same day, and funds sent on a Saturday or a Sunday post on the Monday that follows; reinstatement funds are not taken on a US federal holiday or on a Saturday or Sunday before a Monday that is one. Every payment other than a deficiency settlement wire or reinstatement funds, both of which post on the day they are received or on the Monday after a weekend as the settlement and reinstatement terms state, keeps the standard posting: one received before the payment cutoff time Central Time on a business day posts that day, and one received later, or on a weekend or US federal holiday, posts the next business day. Reinstatement funds are taken only after a notice of intent to sell
    for the current repossession is on the account. The reinstatement amount is fixed only after the account carries a
    storage charge billed for the current repossession on the statement date. The standard reinstatement amount is the past-due amount plus the fees due balance, which includes late charges and every repossession expense booked, less the fees a reinstatement the state period grants leaves out of its amount, rounded to the cent. A reinstatement the state reinstatement period recorded on the contract grants, on a statement date
    within that period counted in calendar days from the repossession date (not counted), is the customer's right, and
    the returned-payment fees and extension fees posted after the same calendar day twelve months before the statement
    date, up to and including the statement date, are left out of its amount, never more than the fees due balance. Every
    other reinstatement is one the company grants at its discretion, offered only while no other Kestrel contract or lease
    of the customer is the relationship limit days or more past due. For storage a reinstatement this policy handles
    collects for the days until its funds post, and only for such storage, the storage is worked out as this policy
    states. Storage is billed only for days the vehicle is on the storage lot, and each such day only once. The lot days of an involuntary recovery whose most recent condition report is dated after the repossession date run from the day after that lot-intake date, the nights before it being the agency's holding, billed on its transport charge and never as storage; the lot days of a voluntary surrender run from the repossession date itself; any other lot days run from the day after the repossession date. A lot day up to and including the latest statement date on which a storage charge was billed is billed by that charge, whatever the charge came to, and a lot day collected in a redemption figure or a reinstatement amount or counted into a deficiency quote is not billed again. Every other lot day through the release or sale date is charged at the daily storage fee once the free days are used up, and it is billed when the vehicle leaves the lot. The free days for that charge follow the recovery history: an involuntary recovery of a contract that shows an earlier reinstatement payment has none, a voluntary surrender of a contract that shows no reinstatement payment has the surrender free days, and any other recovery has the free days for the tier, in each case less any free days an earlier storage charge for the same repossession already set against its stored days. Each schedule below
    adds its own amount to the standard amount on its own, the amounts are added once, and the amount is rounded to the
    cent once at the end. A discretionary reinstatement of a contract that was reinstated before pays installments ahead,
    following its days past due at the last nightly cycle: a discretionary reinstatement of a contract that shows an
    earlier reinstatement payment and is at least the pay-ahead days past due adds two monthly installments; a
    discretionary reinstatement of a contract that shows an earlier reinstatement payment and is fewer days past due adds
    one monthly installment; any other reinstatement adds none. A discretionary reinstatement carries a relationship
    reserve that follows the customer's Kestrel New Vehicle retail contract, and where the customer holds more than one
    active retail contract the first one the retail lookup lists is the one read: where that active retail contract is at
    least the full-reserve days but fewer than the relationship limit days past due, the reserve is half of one monthly installment of this contract, rounded to the cent, plus that retail contract's own past-due amount; where it is past due by fewer than the full-reserve days, the reserve is half of one
    monthly installment of this contract, rounded to the cent; otherwise, including a customer with no active retail
    contract and any reinstatement the state period grants, no reserve is added. A discretionary reinstatement carries a
    returned-payment reserve, counting the payments returned by the customer's bank after the same calendar day twelve
    months before the statement date, up to and including the statement date: two or more returned payments add one
    monthly installment; exactly one returned payment adds the returned-payment reserve share of one monthly installment,
    rounded to the cent; no returned payment, or a reinstatement the state period grants, adds nothing. Storage keeps
    accruing until the funds post, and the days until the posting date follow the weekday of the statement date: on a
    Saturday the funds post on the Monday, two days later; on a Sunday they post on the Monday, one day later; on a Monday
    through Friday they post the same day and no day is added. Each such day is priced at the daily amount of the most
    recent storage charge, that is its amount divided by its billable days (the first one listed where two share a date),
    or at the daily storage fee for the tier where that charge covers no billable day or no storage charge is on record.
    Once the funds post they are applied as every payment is: first to the simple interest accrued since the
    interest-paid-to date, then to principal until the past-due amount is satisfied, then to fees due, and any remainder
    to principal; each whole monthly installment the interest and principal applied cover advances the next due date by
    one month and adds one to the installments satisfied.
  prerequisite:
  - problem: preowned_ext_release_storage_charge
    kind: value_input
    gate: fees_due
    form: state
    policy_source: >-
      The reinstatement amount is fixed only after the account carries a storage charge billed for the current
      repossession on the statement date.
    condition: >-
      The contract's posting history holds a repossession expense of the storage kind posted on the statement date,
      after the repossession date recorded on the contract, and the fees due balance includes it.
    resolved_by: bill_lot_storage_d761f3de
    effect: >-
      Once the storage charge is billed the fees due balance rises by it and the most recent storage charge carries the
      daily amount the storage until posting reads, so the fees due binding and that daily amount both change.
  - problem: preowned_ext_sale_notice_schedule
    kind: state_gate
    gate: preowned_contracts.nois_mailed_date
    form: state
    policy_source: >-
      Reinstatement funds are taken only after a notice of intent to sell for the current repossession is on the
      account.
    condition: >-
      The contract records a notice-of-intent-to-sell mailing date on or after its repossession date, and the posting
      history holds the matching notice.
    resolved_by: mail_sale_notice_3d21c42f
    effect: >-
      Once the notice of intent to sell is mailed, the reinstatement the notice offers may be paid.
  cross_category:
  - category: retail
    as: branch
    reads: [status, days_past_due, past_due_amount]
    note: The relationship reserve tier and its amount are decided from the customer's active Kestrel New Vehicle retail contract, its days past due and its past-due amount.
  compute:
  - past_due: "F('past_due_amount')"
  - fees_due: "F('fees_due_balance')"
  - installment: "F('monthly_payment')"
  - state_right_running: "F('state_reinstatement_days') > 0 and DAYS(F('repossession_date'), NOW) <= F('state_reinstatement_days')"
  - statutory_fee_exclusion: "MN(fees_due, SUM('preowned_transactions', 'amount', within_months=12, date_field='txn_date', event_type='preowned_returned_payment_fee') + SUM('preowned_transactions', 'amount', within_months=12, date_field='txn_date', event_type='preowned_extension')) if state_right_running else 0.0"
  - earlier_reinstatements: "COUNT('preowned_transactions', event_type='preowned_payment', payment_purpose='reinstatement')"
  - pay_ahead_installments: "2 if (not state_right_running and earlier_reinstatements >= 1 and F('days_past_due') >= K('pay_ahead_two_days_past_due')) else (1 if (not state_right_running and earlier_reinstatements >= 1 and F('days_past_due') < K('pay_ahead_two_days_past_due')) else 0)"
  - retail_past_due_days: "CFIELD('retail', 'days_past_due', status='active')"
  - retail_past_due_amount: "CFIELD('retail', 'past_due_amount', status='active')"
  - relationship_reserve: "RND(installment / 2, 2) + retail_past_due_amount if (not state_right_running and retail_past_due_days != None and retail_past_due_days >= K('reserve_full_threshold_days') and retail_past_due_days < K('relationship_limit_days')) else (RND(installment / 2, 2) if (not state_right_running and retail_past_due_days != None and retail_past_due_days > 0 and retail_past_due_days < K('reserve_full_threshold_days')) else 0.0)"
  - returned_payments: "COUNT('preowned_transactions', within_months=12, date_field='txn_date', event_type='preowned_payment_returned')"
  - returned_reserve: "installment if (not state_right_running and returned_payments >= 2) else (RND(installment * K('returned_reserve_share'), 2) if (not state_right_running and returned_payments == 1) else 0.0)"
  - statement_weekday: "DAYS('2024-01-07', NOW) % 7"
  - posting_days: "2 if statement_weekday == 6 else (1 if statement_weekday == 0 else 0)"
  - storage_daily_amount: "LATEST('preowned_transactions', 'amount', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') / LATEST('preowned_transactions', 'service_days', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') if (LATEST('preowned_transactions', 'service_days', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') != None and LATEST('preowned_transactions', 'service_days', date_field='txn_date', event_type='preowned_repo_expense', fee_type='storage_fee') >= 1) else P('storage_daily_fee')"
  - posting_storage: "posting_days * storage_daily_amount"
  - result: "RND(past_due + fees_due - statutory_fee_exclusion + posting_storage + pay_ahead_installments * installment + relationship_reserve + returned_reserve, 2)"
  compute_basis:
    past_due: "The standard reinstatement amount is the past-due amount plus the fees due balance, which includes late charges and every repossession expense booked, less the fees a reinstatement the state period grants leaves out of its amount, rounded to the cent."
    fees_due: "The standard reinstatement amount is the past-due amount plus the fees due balance, which includes late charges and every repossession expense booked, less the fees a reinstatement the state period grants leaves out of its amount, rounded to the cent."
    installment: "adds two monthly installments"
    state_right_running: "A reinstatement the state reinstatement period recorded on the contract grants, on a statement date within that period counted in calendar days from the repossession date (not counted), is the customer's right"
    statutory_fee_exclusion: "the returned-payment fees and extension fees posted after the same calendar day twelve months before the statement date, up to and including the statement date, are left out of its amount, never more than the fees due balance."
    earlier_reinstatements: "A discretionary reinstatement of a contract that was reinstated before pays installments ahead, following its days past due at the last nightly cycle"
    pay_ahead_installments: "a discretionary reinstatement of a contract that shows an earlier reinstatement payment and is at least the pay-ahead days past due adds two monthly installments; a discretionary reinstatement of a contract that shows an earlier reinstatement payment and is fewer days past due adds one monthly installment; any other reinstatement adds none."
    retail_past_due_days: "where the customer holds more than one active retail contract the first one the retail lookup lists is the one read"
    retail_past_due_amount: "plus that retail contract's own past-due amount"
    relationship_reserve: "where that active retail contract is at least the full-reserve days but fewer than the relationship limit days past due, the reserve is half of one monthly installment of this contract, rounded to the cent, plus that retail contract's own past-due amount; where it is past due by fewer than the full-reserve days, the reserve is half of one monthly installment of this contract, rounded to the cent; otherwise, including a customer with no active retail contract and any reinstatement the state period grants, no reserve is added."
    returned_payments: "counting the payments returned by the customer's bank after the same calendar day twelve months before the statement date, up to and including the statement date"
    returned_reserve: "two or more returned payments add one monthly installment; exactly one returned payment adds the returned-payment reserve share of one monthly installment, rounded to the cent; no returned payment, or a reinstatement the state period grants, adds nothing."
    statement_weekday: "the days until the posting date follow the weekday of the statement date"
    posting_days: "on a Saturday the funds post on the Monday, two days later; on a Sunday they post on the Monday, one day later; on a Monday through Friday they post the same day and no day is added."
    storage_daily_amount: "Each such day is priced at the daily amount of the most recent storage charge, that is its amount divided by its billable days (the first one listed where two share a date), or at the daily storage fee for the tier where that charge covers no billable day or no storage charge is on record."
    posting_storage: "Storage keeps accruing until the funds post"
    result: "Each schedule below adds its own amount to the standard amount on its own, the amounts are added once, and the amount is rounded to the cent once at the end."
  factors:
  - id: second_reinstatement_pay_ahead
    effect: parameter
    decides: pay_ahead_installments
    bindings: [earlier_reinstatements, pay_ahead_installments]
    ladder:
    - when: "a discretionary reinstatement of a contract that shows an earlier reinstatement payment and is at least the pay-ahead days past due at the last nightly cycle"
      value: "2"
    - when: "a discretionary reinstatement of a contract that shows an earlier reinstatement payment and is fewer than the pay-ahead days past due at the last nightly cycle"
      value: "1"
    - when: "otherwise"
      value: "0"
    baseline:
      pay_ahead_installments: "0"
    evidence: [history]
    cross_difficulty: null
  - id: retail_relationship_reserve
    effect: method
    decides: relationship_reserve
    bindings: [retail_past_due_days, retail_past_due_amount, relationship_reserve]
    ladder:
    - when: "a discretionary reinstatement while an active Kestrel New Vehicle retail contract is at least the full-reserve days but fewer than the relationship limit days past due"
      method: "the reserve combines both accounts: half of this contract's monthly installment, rounded to the cent, plus the retail contract's own past-due amount read from the other account"
    - when: "a discretionary reinstatement while an active Kestrel New Vehicle retail contract is past due by fewer than the full-reserve days"
      method: "the reserve is derived from this contract: half of its monthly installment, rounded to the cent"
    - when: "otherwise"
      method: "no reserve is computed"
    baseline:
      relationship_reserve: "0.0"
    evidence: [cross_category]
    cross_difficulty: retail
  - id: returned_payment_reserve
    effect: parameter
    decides: returned_reserve
    bindings: [returned_payments, returned_reserve]
    ladder:
    - when: "a discretionary reinstatement with two or more payments returned in the counted twelve months"
      value: "one monthly installment"
    - when: "a discretionary reinstatement with exactly one payment returned in the counted twelve months"
      value: "the returned-payment reserve share K('returned_reserve_share') of one monthly installment"
    - when: "otherwise"
      value: "0"
    baseline:
      returned_reserve: "0.0"
    evidence: [history]
    cross_difficulty: null
  - id: weekend_posting_days
    effect: parameter
    decides: posting_days
    bindings: [statement_weekday, posting_days, storage_daily_amount, posting_storage]
    ladder:
    - when: "the statement date is a Saturday"
      value: "2"
    - when: "the statement date is a Sunday"
      value: "1"
    - when: "otherwise"
      value: "0"
    baseline:
      posting_days: "0"
    evidence: [date]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard reinstatement amount is the past-due amount plus the fees due balance, which includes late charges and every repossession expense booked, less the fees a reinstatement the state period grants leaves out of its amount, rounded to the cent.
    params: []
  inputs:
    history:
    - {table: preowned_transactions, aggregate: count, field: preowned_txn_id, filters: {event_type: preowned_payment, payment_purpose: reinstatement}}
    - {table: preowned_transactions, aggregate: count, field: preowned_txn_id, within_months: 12, filters: {event_type: preowned_payment_returned}}
    - {table: preowned_transactions, aggregate: latest, field: amount, filters: {event_type: preowned_repo_expense, fee_type: storage_fee}}
    cross_category: [retail]
