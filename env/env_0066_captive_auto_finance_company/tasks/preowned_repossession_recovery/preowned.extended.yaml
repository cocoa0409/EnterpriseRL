- id: preowned_reinstatement_and_redemption
  subject:
  - preowned_reinstated
  - preowned_redeemed
  - preowned_payment
  rule: After repossession and until the sale, the customer may get the vehicle back either by reinstating the contract
    or by redeeming the vehicle. A reinstatement must be completed no later than reinstatement_company_window_days
    after the vehicle was repossessed and before scheduled_sale_date. The window is counted in calendar days starting
    the day after repossession_date and completion on the last day is timely; where the contract records a state_reinstatement_days
    longer than the company window, that longer period is used in place of reinstatement_company_window_days in
    the same count. The contract must show reinstatements_used below reinstatement_max_per_contract for the tier,
    unless the contract records state_reinstatement_days greater than 0. The company does not offer a discretionary
    reinstatement while another Kestrel contract or lease of the customer shows days_past_due of reinstatement_relationship_dpd_limit
    or more; a reinstatement the contract's recorded state_reinstatement_days grants is still offered. The reinstatement
    amount is past_due_amount plus fees_due_balance, which includes late charges and every repossession expense
    booked; storage is billed up to the reinstatement date before the amount is stated. The redemption amount is
    principal_balance plus fees_due_balance plus accrued interest for preowned_msr_quote_interest_days at the per
    diem; redemption is available at any time before the sale regardless of prior reinstatements. Reinstatement
    and redemption funds are accepted only as cashiers_check, wire or moneygram; once the funds post the vehicle
    is released and, for a reinstatement, the original schedule resumes with next_due_date set to the next installment.
  eligibility:
  - id: reinstatement_window
    applies_to:
    - preowned_reinstated
    kind: time
    condition: A reinstatement must be completed no later than reinstatement_company_window_days after the vehicle
      was repossessed and before scheduled_sale_date.
    evidence_fields:
    - preowned_contracts.repossession_date
    - preowned_contracts.scheduled_sale_date
    - preowned_contracts.state_reinstatement_days
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was repossessed
      anchor_source: preowned_contracts.repossession_date
      relation: not_after
      duration_source: variants.reinstatement_company_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days starting the day after repossession_date and completion
        on the last day is timely; where the contract records a state_reinstatement_days longer than the company
        window, that longer period is used in place of reinstatement_company_window_days in the same count.
      boundary: inclusive
  - id: reinstatement_count
    applies_to:
    - preowned_reinstated
    kind: authorization
    condition: The contract must show reinstatements_used below reinstatement_max_per_contract for the tier, unless
      the contract records state_reinstatement_days greater than 0.
    evidence_fields:
    - preowned_contracts.reinstatements_used
    - preowned_contracts.state_reinstatement_days
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
  - id: reinstatement_relationship
    applies_to:
    - preowned_reinstated
    kind: authorization
    condition: The company does not offer a discretionary reinstatement while another Kestrel contract or lease
      of the customer shows days_past_due of reinstatement_relationship_dpd_limit or more; a reinstatement the contract's
      recorded state_reinstatement_days grants is still offered.
    evidence_fields:
    - preowned_contracts.customer_id
    - retail_contracts.days_past_due
    - balloon_contracts.days_past_due
    - lease_contracts.days_past_due
    - retail_contracts.customer_id
    - balloon_contracts.customer_id
    - lease_contracts.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.customer_id
      action_bindings:
        preowned_contracts.customer_id: customer_id
  measures:
  - preowned_msr_quote_interest_days
  formula:
    reinstatement_amount: past_due_amount + fees_due_balance
    redemption_amount: principal_balance + fees_due_balance + round(principal_balance * apr / 100 / per_diem_day_basis,
      2) * preowned_msr_quote_interest_days
  params:
    per_tier:
      Kestrel Pre-Owned Retail Tier 5:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Pre-Owned Retail Tier 4:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Pre-Owned Retail Tier 3:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Pre-Owned Retail Tier 2:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Pre-Owned Retail Tier 1:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
      Kestrel Pre-Owned Retail Tier 1+:
        reinstatement_company_window_days: =reinstatement_company_window_days
        reinstatement_max_per_contract: =reinstatement_max_per_contract
    reinstatement_relationship_dpd_limit: =reinstatement_relationship_dpd_limit
- id: preowned_sale_and_deficiency
  subject:
  - preowned_repo_sale
  - preowned_repo_sale_posted
  - preowned_charge_off
  - preowned_charged_off
  rule: A repossessed vehicle can be sold only while the contract status is repossessed. The sale may take place
    no earlier than company_min_days_nois_to_sale after the notice of intent to sell was mailed. The period is counted
    in calendar days starting the day after nois_mailed_date; where the contract records a nois_min_days longer
    than company_min_days_nois_to_sale, that longer period is used in the same count, and a sale on the first day
    after the period is permitted. Net proceeds are gross_proceeds less sale_expenses and are applied to principal;
    the contract moves to deficiency when principal_balance plus fees_due_balance remains above zero, and to paid_in_full
    when the net proceeds cover it. A surplus is refunded to the customer within surplus_refund_days calendar days
    of the sale together with a surplus notice. A deficiency balance may be settled for a lump sum of at least deficiency_settlement_min_pct
    percent of the deficiency, which pays the contract in full; a smaller offer is not within the servicing desk's
    authority. A deficiency can be charged off only while the contract status is deficiency. A deficiency may be
    charged off no earlier than deficiency_charge_off_days after the vehicle was sold. The period is counted in
    calendar days starting the day after scheduled_sale_date, and charge-off on the last day of the period is permitted.
  eligibility:
  - id: sale_status
    applies_to:
    - preowned_repo_sale
    kind: state
    condition: A repossessed vehicle can be sold only while the contract status is repossessed.
    evidence_fields:
    - preowned_contracts.status
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
    state_contract:
      field: preowned_contracts.status
      allowed:
      - repossessed
  - id: notice_period
    applies_to:
    - preowned_repo_sale
    kind: time
    condition: The sale may take place no earlier than company_min_days_nois_to_sale after the notice of intent
      to sell was mailed.
    evidence_fields:
    - preowned_contracts.nois_mailed_date
    - preowned_contracts.nois_min_days
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the notice of intent to sell was mailed
      anchor_source: preowned_contracts.nois_mailed_date
      relation: not_before
      duration_source: variants.company_min_days_nois_to_sale
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after nois_mailed_date; where the contract
        records a nois_min_days longer than company_min_days_nois_to_sale, that longer period is used in the same
        count, and a sale on the first day after the period is permitted.
      boundary: exclusive
  - id: chargeoff_status
    applies_to:
    - preowned_charge_off
    kind: state
    condition: A deficiency can be charged off only while the contract status is deficiency.
    evidence_fields:
    - preowned_contracts.status
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
    state_contract:
      field: preowned_contracts.status
      allowed:
      - deficiency
  - id: chargeoff_period
    applies_to:
    - preowned_charge_off
    kind: time
    condition: A deficiency may be charged off no earlier than deficiency_charge_off_days after the vehicle was
      sold.
    evidence_fields:
    - preowned_contracts.scheduled_sale_date
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was sold
      anchor_source: preowned_contracts.scheduled_sale_date
      relation: not_before
      duration_source: variants.deficiency_charge_off_days
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after scheduled_sale_date, and charge-off
        on the last day of the period is permitted.
      boundary: inclusive
  formula:
    amount: gross_proceeds - sale_expenses
  params:
    company_min_days_nois_to_sale: =company_min_days_nois_to_sale
    surplus_refund_days: =surplus_refund_days
    deficiency_settlement_min_pct: =deficiency_settlement_min_pct
    deficiency_charge_off_days: =deficiency_charge_off_days
- id: preowned_vehicle_eligibility
  subject:
  - preowned_contract_booked
  rule: Pre-owned contracts finance used vehicles sold by Kestrel dealers, of any make. The vehicle's age, the contract
    year minus vehicle_year, must not exceed max_vehicle_age_years and odometer_at_contract must not exceed max_odometer_miles
    for the tier. The contract APR starts from the tier's apr_rate_sheet; for a Kestrel Certified Pre-Owned vehicle
    cpo_apr_reduction_pct is subtracted, and for a vehicle that is not a Kestrel make non_kestrel_make_apr_adder_pct
    is added; the two adjustments never apply together because certification is available only on Kestrel makes.
    The adjusted APR is the rate disclosed on the contract and is never changed after booking.
  eligibility:
  - id: vehicle_age_mileage
    applies_to:
    - preowned_contract_booked
    kind: authorization
    condition: The vehicle's age, the contract year minus vehicle_year, must not exceed max_vehicle_age_years and
      odometer_at_contract must not exceed max_odometer_miles for the tier.
    evidence_fields:
    - preowned_contracts.vehicle_year
    - preowned_contracts.odometer_at_contract
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
  formula:
    apr: apr - (cpo_apr_reduction_pct if certified_pre_owned else 0) + (0 if vehicle_make_kestrel else non_kestrel_make_apr_adder_pct)
  params:
    per_tier:
