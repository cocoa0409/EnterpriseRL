# Product charter: Kestrel Pre-Owned Retail Installment Sale Contract
category: preowned
display_name: Kestrel Pre-Owned Retail Installment Sale Contract
binding:
  holding_table: preowned_contracts
  event_tables:
  - preowned_transactions
  intake_tables:
  - preowned_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    principal_balance: principal_balance
    fees_due_balance: fees_due
lifecycle:
  states:
  - pending_funding
  - active
  - repo_assigned
  - repossessed
  - deficiency
  - charged_off
  - paid_in_full
  - closed
  transitions:
  - from: pending_funding
    to: active
    by: system
    means: The dealer's contract package passes funding review, the dealer is paid and servicing begins.
  - from: active
    to: repo_assigned
    by: system
    means: Collections assigns the defaulted account to a licensed repossession agency.
  - from: repo_assigned
    to: active
    by: agent
    means: The repossession assignment is recalled because the customer cured the default before the vehicle was
      recovered.
  - from: repo_assigned
    to: repossessed
    by: system
    means: The agency recovers the vehicle and delivers it to the storage lot.
  - from: active
    to: repossessed
    by: user
    means: The customer voluntarily surrenders the vehicle at a designated location.
  - from: repossessed
    to: active
    by: agent
    means: The customer pays the reinstatement amount and the vehicle is released back under the original contract.
  - from: repossessed
    to: paid_in_full
    by: agent
    means: The customer redeems the vehicle by paying the full redemption amount before the sale.
  - from: repossessed
    to: deficiency
    by: system
    means: The vehicle is sold and the net proceeds fall short of the balance owed.
  - from: repossessed
    to: paid_in_full
    by: system
    means: The vehicle is sold and the net proceeds cover the balance owed in full.
  - from: deficiency
    to: paid_in_full
    by: agent
    means: The remaining deficiency balance is paid or settled.
  - from: deficiency
    to: charged_off
    by: system
    means: The unpaid deficiency is charged off after the charge-off period.
  - from: active
    to: paid_in_full
    by: system
    means: The final installment or a full payoff is received and the balance reaches zero.
  - from: paid_in_full
    to: closed
    by: system
    means: The lien is released and the account is closed.
accounts:
- key: principal_balance
  unit: USD
  meaning: Unpaid principal of the simple-interest contract; booked in by funding, returned payments and overpayment
    refunds, and out by the principal portion of payments, refund credits, repossession sale proceeds and charge-off.
- key: fees_due
  unit: USD
  meaning: Assessed but unpaid late charges, returned-payment fees, extension fees and repossession expenses; booked
    in when assessed and out when paid or waived.
parameter_schema:
  min_credit_score: lowest credit score (FICO Auto Score 8, 250-900 scale) admitted to the tier; integer
  max_credit_score: highest credit score admitted to the tier; integer
  apr_rate_sheet: mapping of term band in months -> contract APR in percent (2 decimals), or not_offered where the
    tier cannot book that band
  min_term_months: shortest contract term the tier may book; months
  max_term_months: longest contract term the tier may book; months
  min_amount_financed: smallest amount financed the tier may book; USD
  max_amount_financed: largest amount financed the tier may book; USD
  max_ltv_pct: maximum advance as a percent of the vehicle value basis (MSRP for new, wholesale book value for pre-owned);
    percent
  max_pti_pct: maximum scheduled payment as a percent of verified gross monthly income; percent
  min_down_payment_pct: minimum cash or trade equity down payment as a percent of the selling price; percent
  funding_window_days: calendar days after the contract date within which the dealer must deliver a complete contract
    package to be funded
  relationship_exposure_cap: maximum combined Kestrel consumer exposure for the customer including the new contract;
    USD
  payment_cutoff_time_ct: time of day (HH:MM, Central Time) by which a payment must be received on a business day
    to post that day
  payment_allocation_order: ordered list of the buckets a payment is applied to
  per_diem_day_basis: number of days in the year used for daily simple interest; days
  payment_channel_fees: mapping of payment channel -> convenience fee collected on top of the payment; USD
  max_card_payments_per_month: maximum number of debit card payments accepted per calendar month; count
  debit_card_payment_max_amount: largest single debit card payment accepted; USD
  returned_payment_fee_company: company returned-payment fee before the contract's state maximum is applied; USD
  returned_payment_restriction_threshold: number of returned payments within the lookback that triggers the certified-funds
    restriction; count
  returned_payment_lookback_months: lookback window for counting returned payments; calendar months
  certified_funds_restriction_months: length of a certified-funds-only restriction; calendar months
  late_charge_grace_days: calendar days after an installment due date before a late charge may be assessed
  late_charge_pct_of_unpaid_installment: late charge as a percent of the unpaid portion of the installment; percent
  late_charge_company_max: company maximum late charge per installment before the contract's state maximum is applied;
    USD
  late_charge_min_unpaid_amount: unpaid installment portion below which no late charge is assessed; USD
  courtesy_waivers_per_12_months: number of courtesy late-charge waivers allowed in any 12 calendar months; count
    (0 = none)
  courtesy_min_consecutive_on_time: installments in a row without a late charge required for a courtesy waiver;
    count
  due_date_change_lifetime_max: maximum due-date changes over the life of the contract; count
  due_date_change_min_payments_made: installments that must have been satisfied before a due-date change; count
  due_date_change_max_shift_days: maximum calendar days the first installment on the new due day may fall after
    the current next due date
  due_day_earliest: earliest day of the month allowed as a due day
  due_day_latest: latest day of the month allowed as a due day
  due_date_change_interval_months: minimum calendar months between two due-date changes
  extension_min_payments_made: installments that must have been satisfied before an extension; count
  extension_max_days_past_due: maximum days past due at which an extension may be granted; days
  extension_max_installments_per_request: maximum installments one extension may defer; count
  extension_lifetime_max_installments: maximum installments deferred over the life of the contract; count
  extension_fee: fee per extension where the contract's state permits one; USD
  extension_good_faith_pct: good-faith payment required before an extension as a percent of the monthly payment;
    percent (0 = none)
  extension_interval_months: minimum calendar months between two extensions
  extension_blackout_final_installments: no extension when this many or fewer installments remain; count
  extension_agreement_return_days: calendar days the customer has to complete a signed extension agreement before
    it expires
  payoff_quote_valid_days: calendar days after the quote date through which a payoff quote is honoured
  overpayment_refund_min_amount: credit balance at or above which a refund is issued automatically; USD
  overpayment_refund_days: calendar days within which an automatic overpayment refund is mailed
  lien_release_hold_business_days: business days after payoff by personal check or ACH before the lien may be released
  elt_release_business_days: business days within which an electronic lien is released after the release becomes
    permissible
  paper_title_mail_business_days: business days within which a paper title is mailed after the release becomes permissible
  repo_assignment_min_days_past_due: minimum days past due before an account may be assigned for repossession; days
  nois_mail_business_days: business days after repossession within which the notice of intent to sell is mailed
  repo_agency_fee_involuntary: repossession agency fee charged for an involuntary recovery; USD
  repo_agency_fee_voluntary: agency fee charged for a voluntary surrender; USD
  repo_transport_fee: transport fee charged for an involuntary recovery; USD
  condition_report_fee: condition report fee charged once per repossession; USD
  storage_daily_fee: storage charge per day beyond the free days; USD
  storage_free_days: storage days not charged after repossession; days
  personal_property_hold_days: calendar days personal property is held before it may be disposed of
  reinstatement_company_window_days: calendar days after repossession within which a company reinstatement must
    be completed
  reinstatement_max_per_contract: maximum company-discretion reinstatements over the life of the contract; count
  reinstatement_relationship_dpd_limit: days past due on another Kestrel account at which discretionary reinstatement
    is withheld; days
  company_min_days_nois_to_sale: company minimum calendar days between the notice of intent to sell and the sale
  surplus_refund_days: calendar days after the sale within which a surplus is refunded
  deficiency_settlement_min_pct: minimum lump-sum settlement as a percent of the deficiency balance; percent
  deficiency_charge_off_days: calendar days after the sale before an unpaid deficiency is charged off
  max_vehicle_age_years: maximum vehicle age, contract year minus model year, the tier may finance; years
  max_odometer_miles: maximum odometer reading at contract the tier may finance; miles
  cpo_apr_reduction_pct: percentage points subtracted from the rate-sheet APR for a Kestrel Certified Pre-Owned
    vehicle; percent
  non_kestrel_make_apr_adder_pct: percentage points added to the rate-sheet APR for a used vehicle of another make;
    percent
