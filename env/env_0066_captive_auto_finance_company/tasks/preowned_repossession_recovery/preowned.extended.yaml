      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
  - id: right_to_cure
    applies_to:
    - preowned_repo_assigned
    kind: authorization
    condition: Where the contract records right_to_cure_days greater than 0, assignment may occur only after a right-to-cure
      notice has been mailed and right_to_cure_days calendar days have run from right_to_cure_notice_date.
    evidence_fields:
    - preowned_contracts.right_to_cure_days
    - preowned_contracts.right_to_cure_notice_date
    - preowned_contracts.preowned_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - preowned_contracts.preowned_contract_id
      action_bindings:
        preowned_contracts.preowned_contract_id: preowned_contract_id
  - id: notice_status
    applies_to:
