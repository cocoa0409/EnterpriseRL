    - months_on_books: "MONTHS(F('first_payment_date'), NOW)"
    - tenure_points: "K('tenure_points_long') if months_on_books >= K('tenure_long_months') else (K('tenure_points_mid') if months_on_books >= K('tenure_mid_months') else 0)"
    - extension_count: "COUNT('retail_transactions', event_type='retail_extension')"
    - due_change_count: "COUNT('retail_transactions', event_type='retail_due_date_change')"
    - hardship_points: "K('first_hardship_points_full') if (extension_count == 0 and due_change_count == 0) else (K('first_hardship_points_partial') if extension_count == 0 else 0)"
