    trigger: on_request
    subject: [retail_payment]
    computes: payment_amount
    target_tool: submit_extension_good_faith_payment_c7575c9b
    params:
      gf_pct_high: 75
      gf_pct_mid: 60
      lease_payment_count: 12
      lessee_points_full: 10
      lessee_points_partial: 5
      tenure_long_months: 18
      tenure_mid_months: 12
      tenure_points_long: 5
      tenure_points_mid: 2.5
      first_hardship_points_full: 5
      first_hardship_points_partial: 2.5
      long_term_months: 60
      long_term_points_low_tier: 7
      long_term_points_other: 2.5
      serious_dpd_days: 30
    rule: >-
      This policy figures the good-faith payment a customer makes in person, through Kestrel's automated payment line, toward an extension of a retail installment contract whose signed extension agreement is on file.
      For a good-faith payment made toward an extension, and only for such a payment, the amount the payment must reach is the good-faith amount figured below in place of extension_good_faith_pct percent of monthly_payment; before the extension is granted, a good-faith payment of at least that amount must still have posted since the most recent installment due date, and where the good-faith amount figured below is 0.00 no good-faith payment is required.
      The payment is posted under the payment posting rule: the contract must be in a payable status, the posting day follows the cutoff rule, and the channel fee of the automated phone line applies.
      For a good-faith payment toward an extension, and only for such a payment, the payment is recorded on the contract on its posting day with its amount, channel and purpose, and the nightly posting cycle that closes that day applies it in payment_allocation_order, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal; an arrears payment an agent takes toward an extension and a catch-up payment are recorded and applied the same way under their own policies, and every other payment is applied in payment_allocation_order when it posts, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal, and is not posted under this policy.
      The good-faith amount is figured only after the installment the contract's next due date shows, when a returned payment has re-opened it and its grace period has ended, carries its late charge on the contract.
      The good-faith amount is extension_good_faith_pct percent of the contract's monthly_payment, rounded to the cent.
      Delinquency-risk percentage: the percentage starts at gf_pct_high percent when the contract shows at least one returned payment and at least one late charge in the last 12 calendar months; it starts at gf_pct_mid percent when the contract shows a returned payment but no late charge, or a late charge but no returned payment, in the last 12 calendar months; in every other case it starts at extension_good_faith_pct percent.
      Lessee relationship points: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, lessee_points_full percentage points are taken off the good-faith percentage; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, lessee_points_partial points are taken off; in every other case no points are taken off.
      Contract tenure points: the months on the books are the whole calendar months from the contract's first_payment_date to today; when the months on the books are at least tenure_long_months, tenure_points_long percentage points are taken off the good-faith percentage; when they are at least tenure_mid_months but fewer than tenure_long_months, tenure_points_mid points are taken off; in every other case no points are taken off.
      First-hardship points: when the contract's ledger shows no extension and no due-date change, first_hardship_points_full percentage points are taken off the good-faith percentage; when it shows no extension but at least one due-date change, first_hardship_points_partial points are taken off; in every other case no points are taken off.
      Long-term exposure points: the contract length is the whole calendar months from the contract date to the contract's maturity_date; when the contract length is at least long_term_months and the contract is on Kestrel New Vehicle Retail Tier 4 or Kestrel New Vehicle Retail Tier 5, long_term_points_low_tier percentage points are added to the good-faith percentage; when the contract length is at least long_term_months on any other tier, long_term_points_other points are added; in every other case no points are added.
      Overdue interest cover: the per diem is the contract's principal_balance times its apr divided by 100 and by per_diem_day_basis, rounded to the cent; the days past due are the calendar days from the contract's next_due_date to today; when the days past due exceed serious_dpd_days, the good-faith amount also covers the per diem for each day past due beyond serious_dpd_days; when the days past due exceed late_charge_grace_days but not serious_dpd_days, it covers the per diem for half of the days past due beyond late_charge_grace_days, rounded down to a whole day; in every other case it covers no days of interest; the interest cover is the per diem times the days covered, rounded to the cent.
      The good-faith amount is assembled in this order: the percentage adjustments are first combined into one percentage, which is applied once to the monthly_payment and rounded to the cent; any amount a schedule below adds is then added; the amount is never below zero.
      Counting conventions: whole calendar months from one date to a later one are the difference in month numbers, less one when the later date's day number is smaller than the earlier date's, with no month-end adjustment; an entry lies in the last N calendar months when its date is not after today and fewer than N whole months run from its date to today, which is the same as being dated after the same day number N months before today.
      A count of calendar days from one date to another is the second date less the first, so the first date is not counted and the second is; the count is zero or negative when the second date is not after the first.
    prerequisite:
    - problem: retail_ext_returned_installment_late_charge
      kind: value_input
      gate: risk_pct
      form: state
      policy_source: >-
        The good-faith amount is figured only after the installment the contract's next due date shows, when a returned payment has re-opened it and its grace period has ended, carries its late charge on the contract.
      condition: >-
        When the installment the contract's next due date shows was re-opened by a returned payment and its grace period has ended, the contract's ledger carries a retail_late_charge transaction with that installment_due_date.
      resolved_by: assess_returned_installment_late_charge_34170c70
      effect: >-
        Booking the late charge on the re-opened installment adds a late charge dated today to the contract's 12-month ledger, which the delinquency-risk percentage reads, so the step that percentage takes can change.
    cross_category:
    - category: lease
      as: history
      reads: [status, lease_transactions.event_type, lease_transactions.txn_date]
      note: The lessee relationship points read the customer's active Kestrel lease and count its lease payments and lease late charges over the last 12 calendar months.
    compute:
    - returned_12: "COUNT('retail_transactions', within_months=12, date_field='txn_date', event_type='retail_payment_returned')"
    - late_12: "COUNT('retail_transactions', within_months=12, date_field='txn_date', event_type='retail_late_charge')"
    - risk_pct: "K('gf_pct_high') if (returned_12 >= 1 and late_12 >= 1) else (K('gf_pct_mid') if (returned_12 >= 1 or late_12 >= 1) else P('extension_good_faith_pct'))"
