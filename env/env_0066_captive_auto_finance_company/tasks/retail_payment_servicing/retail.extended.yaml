- id: retail_payment_posting
  subject:
  - retail_payment
  - retail_fee_payment
  - retail_payment_restriction_updated
  rule: 'A payment can be posted only while the contract status is active, repo_assigned, repossessed or deficiency.
    A payment received before payment_cutoff_time_ct Central Time on a business day posts that day; a payment received
    later, or on a weekend or US federal holiday, posts the next business day. Each payment is applied in payment_allocation_order:
    first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day
    year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder
    to principal. Because interest is satisfied first and fees last, an installment paid in full within its grace
    period is never treated as late merely because an earlier fee remains unpaid. A payment designated principal_only
    is accepted only when days_past_due is 0 and is applied to principal after accrued interest is satisfied; it
    never advances next_due_date. Payments in excess of the installment reduce principal and do not advance next_due_date
    unless the customer pays a full additional installment. The channel fee in payment_channel_fees is collected
    on top of the payment as convenience_fee and is never applied to the contract; the agent-assisted debit card
    fee is not charged when the payment is a reinstatement or redemption, which must be made in certified funds.
    Debit card payments are limited to max_card_payments_per_month per calendar month and to debit_card_payment_max_amount
    each. While certified_funds_only_until is on or after the posting date, only cashiers_check, wire or moneygram
    payments are accepted. When a payment carries a fee portion, that portion is booked as a fee payment against
    fees due; enrolling or unenrolling autopay is recorded on the contract.'
  eligibility:
  - id: payable_status
    applies_to:
    - retail_payment
    kind: state
    condition: A payment can be posted only while the contract status is active, repo_assigned, repossessed or deficiency.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - active
      - repo_assigned
      - repossessed
      - deficiency
  measures:
  - retail_msr_interest_accrual_days
  - retail_msr_installments_due
  formula:
    interest_applied: min(amount, round(principal_balance * apr / 100 / per_diem_day_basis * retail_msr_interest_accrual_days,
      2))
    fees_applied: min(fees_due_balance, max(0, amount - max(interest_applied, retail_msr_installments_due)))
    principal_applied: amount - interest_applied - fees_applied
  params:
    payment_cutoff_time_ct: =payment_cutoff_time_ct
    payment_allocation_order: =payment_allocation_order
    per_diem_day_basis: =per_diem_day_basis
    payment_channel_fees: =payment_channel_fees
    max_card_payments_per_month: =max_card_payments_per_month
    debit_card_payment_max_amount: =debit_card_payment_max_amount
- id: retail_returned_payment
  subject:
  - retail_payment_returned
  - retail_returned_payment_fee
  - retail_payment_restriction_updated
  rule: When the payer's bank dishonours a posted payment, the whole payment is reversed against the payment it
    dishonours, restoring the interest, principal and fee portions it had paid. A returned-payment fee equal to
    the lower of returned_payment_fee_company and the contract's recorded nsf_fee_max_amount is assessed when the
    return_reason is insufficient_funds, account_closed or stop_payment; no fee is assessed for unauthorized_debit
    or bank_error, and none where nsf_fee_max_amount is 0.00. Only one returned-payment fee may be assessed for
    the same dishonoured payment. When retail_msr_returned_payments_lookback reaches returned_payment_restriction_threshold,
    autopay is unenrolled and certified_funds_only_until is set to the date certified_funds_restriction_months calendar
    months after the latest return date. A returned payment re-opens the installment it had paid; late charges on
    that installment follow the late charge rule.
  eligibility:
  - id: one_fee_per_return
    applies_to:
    - retail_returned_payment_fee
    kind: dedup
    condition: Only one returned-payment fee may be assessed for the same dishonoured payment.
    evidence_fields:
    - retail_transactions.reversed_txn_id
    - retail_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_transactions.reversed_txn_id
      action_bindings:
        retail_transactions.reversed_txn_id: reversed_txn_id
    dedup_contract:
      table: retail_transactions
      mode: separate_record
      object_bindings:
        reversed_txn_id: reversed_txn_id
      duplicate_filters:
        event_type:
        - retail_returned_payment_fee
      distinct_fields: []
  measures:
  - retail_msr_returned_payments_lookback
  formula:
    when: return_reason in ["insufficient_funds", "account_closed", "stop_payment"]
    returned_payment_fee: min(returned_payment_fee_company, nsf_fee_max_amount)
  params:
    returned_payment_fee_company: =returned_payment_fee_company
    returned_payment_restriction_threshold: =returned_payment_restriction_threshold
    returned_payment_lookback_months: =returned_payment_lookback_months
    certified_funds_restriction_months: =certified_funds_restriction_months
- id: retail_late_charges
  subject:
  - retail_late_charge
  rule: A late charge can be assessed only while the contract status is active or repo_assigned. A late charge may
    be assessed only after the late_charge_grace_days grace period following the installment due date has fully
    elapsed. The grace period is counted in calendar days starting the day after the installment due date, weekends
    and holidays included, so the first permissible assessment date is the calendar day after the due date plus
    late_charge_grace_days. No more than one late charge may be assessed for the same installment due date. The
    late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped
    at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount. No late charge is
    assessed when the unpaid portion is less than late_charge_min_unpaid_amount, on an installment deferred by an
    extension, or on an installment that was paid in full within the grace period. A payment that posts after the
    cutoff on the last grace day posts the next business day and is late.
  eligibility:
  - id: late_status
    applies_to:
    - retail_late_charge
    kind: state
    condition: A late charge can be assessed only while the contract status is active or repo_assigned.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - active
      - repo_assigned
  - id: grace_elapsed
    applies_to:
    - retail_late_charge
    kind: time
    condition: A late charge may be assessed only after the late_charge_grace_days grace period following the installment
      due date has fully elapsed.
    evidence_fields:
    - retail_contracts.next_due_date
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the installment due date
      anchor_source: retail_contracts.next_due_date
      relation: not_before
      duration_source: variants.late_charge_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days starting the day after the installment due date,
        weekends and holidays included, so the first permissible assessment date is the calendar day after the due
        date plus late_charge_grace_days.
      boundary: exclusive
  - id: one_per_installment
    applies_to:
    - retail_late_charge
    kind: dedup
    condition: No more than one late charge may be assessed for the same installment due date.
    evidence_fields:
    - retail_transactions.installment_due_date
    - retail_transactions.event_type
    - retail_transactions.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_transactions.retail_contract_id
        - retail_transactions.installment_due_date
      action_bindings:
        retail_transactions.retail_contract_id: retail_contract_id
        retail_transactions.installment_due_date: installment_due_date
    dedup_contract:
      table: retail_transactions
      mode: separate_record
      object_bindings:
        retail_contract_id: retail_contract_id
        installment_due_date: installment_due_date
      duplicate_filters:
        event_type:
        - retail_late_charge
      distinct_fields: []
  measures:
  - retail_msr_unpaid_installment_portion
  formula:
    when: retail_msr_unpaid_installment_portion >= late_charge_min_unpaid_amount
    amount: min(round(retail_msr_unpaid_installment_portion * late_charge_pct_of_unpaid_installment / 100, 2), late_charge_company_max,
      late_charge_max_amount)
  params:
    late_charge_grace_days: =late_charge_grace_days
    late_charge_pct_of_unpaid_installment: =late_charge_pct_of_unpaid_installment
    late_charge_company_max: =late_charge_company_max
    late_charge_min_unpaid_amount: =late_charge_min_unpaid_amount
- id: retail_fee_waivers
  subject:
  - retail_fee_waiver
  rule: A fee can be waived only while the contract status is active, repo_assigned, repossessed or deficiency.
    A fee transaction may be waived only once. Waivers are always of the whole fee transaction; partial waivers
    are not granted. A courtesy_on_time_history waiver applies only to a late charge, and only when retail_msr_consecutive_on_time
    is at least courtesy_min_consecutive_on_time and retail_msr_courtesy_waivers_lookback is below courtesy_waivers_per_12_months
    for the tier; a tier whose allowance is 0 receives no courtesy waivers. A servicing_error waiver applies to
    any fee the company's own records show was caused by a company error, such as a payment posted late by Kestrel
    or an autopay draft taken on the wrong date, and is not limited in number. A bank_error_on_returned_payment
    waiver applies to a returned-payment fee when the customer's bank has confirmed in writing that the return was
    the bank's own error. Repossession, transport, storage and condition-report expenses and extension fees are
    never courtesy-waived.
  eligibility:
  - id: waivable_status
