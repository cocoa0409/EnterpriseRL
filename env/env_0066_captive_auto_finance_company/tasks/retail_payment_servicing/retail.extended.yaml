      late_12: "when the contract shows at least one returned payment and at least one late charge in the last 12 calendar months"
      risk_pct: "Delinquency-risk percentage: the percentage starts at gf_pct_high percent when the contract shows at least one returned payment and at least one late charge in the last 12 calendar months; it starts at gf_pct_mid percent when the contract shows a returned payment but no late charge, or a late charge but no returned payment, in the last 12 calendar months; in every other case it starts at extension_good_faith_pct percent."
      lease_active: "when the customer holds an active Kestrel lease"
      lease_payments_12: "the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
      lease_late_12: "the lease ledger shows no more than one lease late charge in the last 12 calendar months"
      lessee_points: "Lessee relationship points: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, lessee_points_full percentage points are taken off the good-faith percentage; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, lessee_points_partial points are taken off; in every other case no points are taken off."
      months_on_books: "the months on the books are the whole calendar months from the contract's first_payment_date to today"
      tenure_points: "Contract tenure points: the months on the books are the whole calendar months from the contract's first_payment_date to today; when the months on the books are at least tenure_long_months, tenure_points_long percentage points are taken off the good-faith percentage; when they are at least tenure_mid_months but fewer than tenure_long_months, tenure_points_mid points are taken off; in every other case no points are taken off."
      extension_count: "when the contract's ledger shows no extension and no due-date change"
      due_change_count: "when it shows no extension but at least one due-date change"
      hardship_points: "First-hardship points: when the contract's ledger shows no extension and no due-date change, first_hardship_points_full percentage points are taken off the good-faith percentage; when it shows no extension but at least one due-date change, first_hardship_points_partial points are taken off; in every other case no points are taken off."
      contract_length_months: "the contract length is the whole calendar months from the contract date to the contract's maturity_date"
      term_points: "Long-term exposure points: the contract length is the whole calendar months from the contract date to the contract's maturity_date; when the contract length is at least long_term_months and the contract is on Kestrel New Vehicle Retail Tier 4 or Kestrel New Vehicle Retail Tier 5, long_term_points_low_tier percentage points are added to the good-faith percentage; when the contract length is at least long_term_months on any other tier, long_term_points_other points are added; in every other case no points are added."
      per_diem: "the per diem is the contract's principal_balance times its apr divided by 100 and by per_diem_day_basis, rounded to the cent"
      overdue_days: "the days past due are the calendar days from the contract's next_due_date to today"
      cover_days: "the days past due are the calendar days from the contract's next_due_date to today; when the days past due exceed serious_dpd_days, the good-faith amount also covers the per diem for each day past due beyond serious_dpd_days; when the days past due exceed late_charge_grace_days but not serious_dpd_days, it covers the per diem for half of the days past due beyond late_charge_grace_days, rounded down to a whole day; in every other case it covers no days of interest; the interest cover is the per diem times the days covered, rounded to the cent."
      effective_pct: "the percentage adjustments are first combined into one percentage, which is applied once to the monthly_payment and rounded to the cent"
      pct_amount: "The good-faith amount is extension_good_faith_pct percent of the contract's monthly_payment, rounded to the cent."
      interest_cover: "the interest cover is the per diem times the days covered, rounded to the cent"
      result: "the amount is never below zero."
    factors:
    - id: gff_delinquency_risk
      effect: parameter
      decides: risk_pct
      bindings: [returned_12, late_12, risk_pct]
      ladder:
      - when: "at least one returned payment and at least one late charge on the contract in the last 12 calendar months"
        value: "K('gf_pct_high')"
      - when: "a returned payment but no late charge, or a late charge but no returned payment, in the last 12 calendar months"
        value: "K('gf_pct_mid')"
      - when: "otherwise"
        value: "P('extension_good_faith_pct')"
      baseline:
        risk_pct: "P('extension_good_faith_pct')"
      evidence: [history, tier_param]
      cross_difficulty: null
    - id: gff_lessee_points
      effect: parameter
      decides: lessee_points
      bindings: [lease_active, lease_payments_12, lease_late_12, lessee_points]
      ladder:
      - when: "an active Kestrel lease and at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
        value: "K('lessee_points_full')"
      - when: "an active Kestrel lease and no more than one lease late charge in the last 12 calendar months, the first condition not met"
        value: "K('lessee_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        lessee_points: "0"
      evidence: [cross_category, history]
      cross_difficulty: lease
    - id: gff_tenure_points
      effect: parameter
      decides: tenure_points
      bindings: [months_on_books, tenure_points]
      ladder:
      - when: "at least tenure_long_months whole months on the books"
        value: "K('tenure_points_long')"
      - when: "at least tenure_mid_months but fewer than tenure_long_months whole months on the books"
        value: "K('tenure_points_mid')"
      - when: "otherwise"
        value: "0"
      baseline:
        tenure_points: "0"
      evidence: [date]
      cross_difficulty: null
    - id: gff_first_hardship
      effect: parameter
      decides: hardship_points
      bindings: [extension_count, due_change_count, hardship_points]
      ladder:
      - when: "the ledger shows no extension and no due-date change"
        value: "K('first_hardship_points_full')"
      - when: "the ledger shows no extension but at least one due-date change"
        value: "K('first_hardship_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        hardship_points: "0"
      evidence: [history]
      cross_difficulty: null
    - id: gff_long_term
      effect: parameter
      decides: term_points
      bindings: [contract_length_months, term_points]
      ladder:
      - when: "Tier 4 or Tier 5 and a contract length of at least long_term_months whole months"
        value: "K('long_term_points_low_tier')"
      - when: "any other tier and a contract length of at least long_term_months whole months"
        value: "K('long_term_points_other')"
      - when: "otherwise"
        value: "0"
      baseline:
        term_points: "0"
      evidence: [date, tier_param]
      cross_difficulty: null
    - id: gff_overdue_interest
      effect: method
      decides: cover_days
      bindings: [overdue_days, cover_days]
      ladder:
      - when: "days past due exceed serious_dpd_days"
        method: "the per diem is covered for each day past due beyond serious_dpd_days"
      - when: "days past due exceed late_charge_grace_days but not serious_dpd_days"
        method: "the per diem is covered for half of the days past due beyond late_charge_grace_days, rounded down to a whole day"
      - when: "otherwise"
        method: "no days of interest are covered"
      baseline:
        cover_days: "0"
      evidence: [date]
      cross_difficulty: null
    baseline:
      rule: >-
        The good-faith amount is extension_good_faith_pct percent of the contract's monthly_payment, rounded to the cent.
      params: [extension_good_faith_pct]
    inputs:
      history:
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 12, filters: {event_type: retail_payment_returned}}
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 12, filters: {event_type: retail_late_charge}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_payment}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_late_charge}}
      cross_category: [lease]
  - id: retail_ext_extension_grant
    base_policy_refs: [retail_extensions]
    overwrite:
    - base_policy: retail_extensions
      superseded_clause: >-
        The extension fee is extension_fee for the tier where the contract records extension_fee_permitted as true, and 0.00 where it is false; the fee is booked to fees due.
      replaced_by: >-
        For an extension granted under this policy the extension fee is the extension fee figured below where the contract records extension_fee_permitted as true, and 0.00 where it is false; the fee is booked to fees due.
    trigger: on_request
    subject: [retail_extension]
    computes: extension_fee
    target_tool: grant_retail_extension_6a93006b
    params:
      history_reduction_full: 5
      history_reduction_partial: 2.5
      history_long_payments: 18
      history_mid_payments: 12
      history_mid_late_max: 2
      lease_payment_count: 12
      lessee_reduction_full: 5
      lessee_reduction_partial: 2.5
      first_extension_reduction_full: 3
      first_extension_reduction_partial: 1.5
    rule: >-
      This policy grants an extension of a retail installment contract whose customer has completed the signed extension agreement for this contract, deferring the installment due on the contract's next due date, and figures the extension fee booked with it.
      The status, installment count, days-past-due, lifetime, blackout, relationship, signed-agreement and interval conditions of the base extension rule apply as the base rule states them, and the schedule moves exactly as the base rule states.
      For an extension granted under this policy the extension fee is the extension fee figured below where the contract records extension_fee_permitted as true, and 0.00 where it is false; the fee is booked to fees due.
      The extension is not granted until the installment it defers, when a returned payment re-opened it and its grace period has ended, shows its late charge in the contract's ledger.
      The extension is granted only after a payment through the agent-assisted phone ACH channel has posted on the contract since its most recent installment due date.
      The extension fee is fixed only after the customer has made the good-faith payment toward the extension, wherever the good-faith amount for the extension is above 0.00.
      The extension fee is the tier's extension_fee.
      Fee method by recent payments: the recent payments are the payments posted on the contract after the same day of the previous calendar month; when the recent payments reach at least one monthly_payment, the tier's extension_fee is halved and the result rounded down to the whole dollar; when they reach at least half of one monthly_payment but less than one monthly_payment, the tier's extension_fee is multiplied by three quarters and the result rounded down to the whole dollar; in every other case the tier's extension_fee is used as it stands.
      Payment-history reduction: when the contract shows at least history_long_payments installments satisfied and no more than one late charge in the last 12 calendar months, history_reduction_full dollars are taken off the extension fee; when it shows at least history_mid_payments installments satisfied and no more than history_mid_late_max late charges in the last 12 calendar months, where the first condition is not met, history_reduction_partial dollars are taken off; in every other case nothing is taken off.
      Lessee fee reduction: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, lessee_reduction_full dollars are taken off the extension fee; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, lessee_reduction_partial dollars are taken off; in every other case nothing is taken off.
      First-extension reduction: when the contract's ledger shows no extension and no due-date change, first_extension_reduction_full dollars are taken off the extension fee; when it shows no extension but at least one due-date change, first_extension_reduction_partial dollars are taken off; in every other case nothing is taken off.
      The extension fee is assembled in this order: first any change of method is applied to the tier's extension_fee, then every reduction is subtracted from that figure; the fee is never below zero and is booked to the cent.
      Counting conventions: whole calendar months from one date to a later one are the difference in month numbers, less one when the later date's day number is smaller than the earlier date's, with no month-end adjustment; an entry lies in the last N calendar months when its date is not after today and fewer than N whole months run from its date to today, which is the same as being dated after the same day number N months before today.
    prerequisite:
    - problem: retail_ext_returned_installment_late_charge
      kind: state_gate
      gate: retail_transactions.installment_due_date
      form: state
      policy_source: >-
        The extension is not granted until the installment it defers, when a returned payment re-opened it and its grace period has ended, shows its late charge in the contract's ledger.
      condition: >-
        When the installment due on the contract's next due date, which the extension defers, was re-opened by a returned payment and its grace period has ended, the contract's ledger carries a retail_late_charge transaction with that installment_due_date.
      resolved_by: assess_returned_installment_late_charge_34170c70
      effect: >-
        Once the late charge on the re-opened installment is booked, the installment can be deferred without losing a late charge that was already owed, since no late charge is assessed on a deferred installment.
    - problem: retail_ext_arrears_payment
      kind: value_input
      gate: method_fee
      form: state
      policy_source: >-
        The extension is granted only after a payment through the agent-assisted phone ACH channel has posted on the contract since its most recent installment due date.
      condition: >-
        The contract's ledger carries a retail_payment through the phone_agent_ach channel posted after the most recent installment due date.
      resolved_by: post_arrears_payment_6321a7ae
      effect: >-
        The arrears payment adds to the recent payments the fee method reads, so the step of the fee method can change.
    - problem: retail_ext_good_faith_payment
      kind: value_input
      gate: method_fee
      form: action
      policy_source: >-
        The extension fee is fixed only after the customer has made the good-faith payment toward the extension, wherever the good-faith amount for the extension is above 0.00.
      fallback_reason: >-
        The good-faith payment leaves a self-service payment on the contract's ledger that the records do not tie to the extension: the catch-up payment the customer makes through the same automated payment line leaves the same kind of entry, so no record-visible state singles out the good-faith payment.
      condition: >-
        Where the good-faith amount for the extension is above 0.00, the contract's ledger carries the customer's good-faith retail_payment through the phone_ivr_ach channel posted after the most recent installment due date.
      resolved_by: submit_extension_good_faith_payment_c7575c9b
      effect: >-
        The good-faith payment adds to the recent payments the fee method reads, so the step of the fee method can change.
    cross_category:
    - category: lease
      as: history
      reads: [status, lease_transactions.event_type, lease_transactions.txn_date]
      note: The lessee fee reduction reads the customer's active Kestrel lease and counts its lease payments and lease late charges over the last 12 calendar months.
    compute:
    - recent_payments: "SUM('retail_transactions', 'amount', within_months=1, date_field='txn_date', event_type='retail_payment')"
    - method_fee: "int(P('extension_fee') / 2) if recent_payments >= F('monthly_payment') else (int(P('extension_fee') * 3 / 4) if recent_payments >= F('monthly_payment') / 2 else P('extension_fee'))"
    - late_12: "COUNT('retail_transactions', within_months=12, date_field='txn_date', event_type='retail_late_charge')"
    - history_reduction: "K('history_reduction_full') if (F('payments_made_count') >= K('history_long_payments') and late_12 <= 1) else (K('history_reduction_partial') if (F('payments_made_count') >= K('history_mid_payments') and late_12 <= K('history_mid_late_max')) else 0)"
    - lease_active: "EXISTS('lease', status='active')"
    - lease_payments_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_payment')"
    - lease_late_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_late_charge')"
    - lessee_reduction: "K('lessee_reduction_full') if (lease_active and lease_payments_12 >= K('lease_payment_count') and lease_late_12 == 0) else (K('lessee_reduction_partial') if (lease_active and lease_late_12 <= 1) else 0)"
    - prior_extensions: "COUNT('retail_transactions', event_type='retail_extension')"
    - prior_due_changes: "COUNT('retail_transactions', event_type='retail_due_date_change')"
    - first_reduction: "K('first_extension_reduction_full') if (prior_extensions == 0 and prior_due_changes == 0) else (K('first_extension_reduction_partial') if prior_extensions == 0 else 0)"
    - result: "RND(MX(0, method_fee - history_reduction - lessee_reduction - first_reduction), 2) if F('extension_fee_permitted') == True else 0"
    compute_basis:
      recent_payments: "the recent payments are the payments posted on the contract after the same day of the previous calendar month"
      method_fee: "Fee method by recent payments: the recent payments are the payments posted on the contract after the same day of the previous calendar month; when the recent payments reach at least one monthly_payment, the tier's extension_fee is halved and the result rounded down to the whole dollar; when they reach at least half of one monthly_payment but less than one monthly_payment, the tier's extension_fee is multiplied by three quarters and the result rounded down to the whole dollar; in every other case the tier's extension_fee is used as it stands."
      late_12: "when the contract shows at least history_long_payments installments satisfied and no more than one late charge in the last 12 calendar months"
      history_reduction: "Payment-history reduction: when the contract shows at least history_long_payments installments satisfied and no more than one late charge in the last 12 calendar months, history_reduction_full dollars are taken off the extension fee; when it shows at least history_mid_payments installments satisfied and no more than history_mid_late_max late charges in the last 12 calendar months, where the first condition is not met, history_reduction_partial dollars are taken off; in every other case nothing is taken off."
      lease_active: "when the customer holds an active Kestrel lease"
      lease_payments_12: "the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
      lease_late_12: "the lease ledger shows no more than one lease late charge in the last 12 calendar months"
      lessee_reduction: "Lessee fee reduction: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, lessee_reduction_full dollars are taken off the extension fee; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, lessee_reduction_partial dollars are taken off; in every other case nothing is taken off."
      prior_extensions: "when the contract's ledger shows no extension and no due-date change"
      prior_due_changes: "when it shows no extension but at least one due-date change"
      first_reduction: "First-extension reduction: when the contract's ledger shows no extension and no due-date change, first_extension_reduction_full dollars are taken off the extension fee; when it shows no extension but at least one due-date change, first_extension_reduction_partial dollars are taken off; in every other case nothing is taken off."
      result: "first any change of method is applied to the tier's extension_fee, then every reduction is subtracted from that figure; the fee is never below zero and is booked to the cent."
    factors:
    - id: xf_fee_method
      effect: method
      decides: method_fee
      bindings: [recent_payments, method_fee]
      ladder:
      - when: "recent payments of at least one monthly_payment"
        method: "the tier's extension_fee is halved and rounded down to the whole dollar"
      - when: "recent payments of at least half of one monthly_payment but less than one monthly_payment"
        method: "the tier's extension_fee is multiplied by three quarters and rounded down to the whole dollar"
      - when: "otherwise"
        method: "the tier's extension_fee is used as it stands"
      baseline:
        method_fee: "P('extension_fee')"
      evidence: [history, tier_param]
      cross_difficulty: null
    - id: xf_history_reduction
      effect: parameter
      decides: history_reduction
      bindings: [late_12, history_reduction]
      ladder:
      - when: "at least history_long_payments installments satisfied and no more than one late charge in the last 12 calendar months"
        value: "K('history_reduction_full')"
      - when: "at least history_mid_payments installments satisfied and no more than history_mid_late_max late charges in the last 12 calendar months, the first condition not met"
        value: "K('history_reduction_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        history_reduction: "0"
      evidence: [history]
      cross_difficulty: null
    - id: xf_lessee_reduction
      effect: parameter
      decides: lessee_reduction
      bindings: [lease_active, lease_payments_12, lease_late_12, lessee_reduction]
      ladder:
      - when: "an active Kestrel lease and at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
        value: "K('lessee_reduction_full')"
      - when: "an active Kestrel lease and no more than one lease late charge in the last 12 calendar months, the first condition not met"
        value: "K('lessee_reduction_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        lessee_reduction: "0"
      evidence: [cross_category, history]
      cross_difficulty: lease
    - id: xf_first_extension
      effect: parameter
      decides: first_reduction
      bindings: [prior_extensions, prior_due_changes, first_reduction]
      ladder:
      - when: "the ledger shows no extension and no due-date change"
        value: "K('first_extension_reduction_full')"
      - when: "the ledger shows no extension but at least one due-date change"
        value: "K('first_extension_reduction_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        first_reduction: "0"
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The extension fee is the tier's extension_fee.
      params: [extension_fee]
    inputs:
      history:
      - {table: retail_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: retail_payment}}
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 12, filters: {event_type: retail_late_charge}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_payment}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_late_charge}}
      cross_category: [lease]
  - id: retail_ext_unpaid_installment_late_charge
    base_policy_refs: [retail_late_charges]
    overwrite:
    - base_policy: retail_late_charges
      superseded_clause: >-
        The late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      replaced_by: >-
        For a late charge on an installment left unpaid past its grace period that no returned payment re-opened, and only for such a late charge, the charge is the unpaid installment late charge figured below, still capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount; a late charge on an installment re-opened by a returned payment and a late charge on an installment whose payment posted after its grace period follow the company's own schedules for those two cases, and any other late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount, and is not figured under this policy.
    trigger: state_due
    subject: [retail_late_charge]
    computes: late_charge_amount
    target_tool: assess_unpaid_installment_late_charge_51bb28dc
    params:
      unpaid_rate_long: 3.5
      unpaid_rate_mid: 4.25
      unpaid_long_payments: 30
      unpaid_mid_payments: 18
      lessee_rate_points_full: 0.5
      lessee_rate_points_partial: 0.25
      lease_payment_count: 12
      effort_points_full: 0.5
      effort_points_partial: 0.25
      schedule_points_full: 0.5
      schedule_points_partial: 0.25
      care_points_full: 0.5
      care_points_partial: 0.25
      graduated_short_days: 7
      graduated_mid_days: 14
    rule: >-
      This policy figures the late charge assessed on an installment left unpaid past its grace period: no payment, or only part of one, has reached the installment the contract's next due date shows, and no returned payment re-opened it.
      For a late charge on an installment left unpaid past its grace period that no returned payment re-opened, and only for such a late charge, the charge is the unpaid installment late charge figured below, still capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount; a late charge on an installment re-opened by a returned payment and a late charge on an installment whose payment posted after its grace period follow the company's own schedules for those two cases, and any other late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount, and is not figured under this policy.
      The grace period, the status the contract must be in and the limit of one late charge per installment due date apply exactly as the base late charge rule states them; no late charge is assessed when the unpaid installment portion is less than late_charge_min_unpaid_amount or on an installment an extension deferred.
      The unpaid installment portion is the unpaid portion, as of the assessment date, of the installment the contract's next due date shows: payments reach the oldest installment first, so every later past-due installment is wholly unpaid, and the unpaid installment portion is the past_due_amount less one monthly_payment for each whole monthly_payment contained in the past_due_amount less one cent, rounded to the cent.
      The unpaid installment late charge is late_charge_pct_of_unpaid_installment percent of the unpaid installment portion, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      Unpaid installment rate schedule: the rate starts at unpaid_rate_long percent when the contract shows at least unpaid_long_payments installments satisfied and no returned payment in the last 24 calendar months; it starts at unpaid_rate_mid percent when the contract shows at least unpaid_mid_payments installments satisfied and no more than one returned payment in the last 24 calendar months, where the first condition is not met; in every other case it starts at late_charge_pct_of_unpaid_installment percent.
      Lessee rate points: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, lessee_rate_points_full percentage points are taken off the unpaid installment rate; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, lessee_rate_points_partial points are taken off; in every other case no points are taken off.
      Partial-effort points: the recent payments are the payments posted on the contract after the same day of the previous calendar month; when the recent payments reach at least half of one monthly_payment, effort_points_full percentage points are taken off the unpaid installment rate; when they are above zero but less than half of one monthly_payment, effort_points_partial points are taken off; in every other case no points are taken off.
      Clean-schedule points: when the contract's ledger shows no extension and no due-date change, schedule_points_full percentage points are taken off the unpaid installment rate; when it shows no extension but at least one due-date change, schedule_points_partial points are taken off; in every other case no points are taken off.
      Care plan points: when the customer holds an active Kestrel Care plan financed in this contract, care_points_full percentage points are taken off the unpaid installment rate; when the customer holds an active Kestrel Care plan financed some other way, care_points_partial points are taken off; in every other case no points are taken off.
      Graduated charge: the days beyond grace are the calendar days from the contract's next_due_date to today less late_charge_grace_days; when the days beyond grace are from 1 through graduated_short_days, the charge figured at the rate is halved and the result rounded down to the whole dollar; when they are from graduated_short_days plus 1 through graduated_mid_days, the charge figured at the rate is multiplied by three quarters and the result rounded down to the whole dollar; in every other case the charge figured at the rate is kept to the cent.
      The unpaid installment late charge is assembled in this order: the rate adjustments are first combined into one rate, which is applied once to the unpaid installment portion and rounded to the cent; any change of method is then applied to that figure; the cap is applied last, and the charge is booked to the cent and is never below zero.
      Counting conventions: whole calendar months from one date to a later one are the difference in month numbers, less one when the later date's day number is smaller than the earlier date's, with no month-end adjustment; an entry lies in the last N calendar months when its date is not after today and fewer than N whole months run from its date to today, which is the same as being dated after the same day number N months before today.
      A count of calendar days from one date to another is the second date less the first, so the first date is not counted and the second is; the count is zero or negative when the second date is not after the first.
    prerequisite: []
    cross_category:
    - category: lease
      as: history
      reads: [status, lease_transactions.event_type, lease_transactions.txn_date]
      note: The lessee rate points read the customer's active Kestrel lease and count its lease payments and lease late charges over the last 12 calendar months.
    - category: care
      as: branch
      reads: [status, financed_account_number]
      note: The Care plan points read whether the customer's active Kestrel Care plan is financed in this contract.
    compute:
    - unpaid_portion: "RND(F('past_due_amount') - F('monthly_payment') * int((F('past_due_amount') - 0.01) / F('monthly_payment')), 2)"
    - returned_24: "COUNT('retail_transactions', within_months=24, date_field='txn_date', event_type='retail_payment_returned')"
    - unpaid_rate: "K('unpaid_rate_long') if (F('payments_made_count') >= K('unpaid_long_payments') and returned_24 == 0) else (K('unpaid_rate_mid') if (F('payments_made_count') >= K('unpaid_mid_payments') and returned_24 <= 1) else P('late_charge_pct_of_unpaid_installment'))"
    - lease_active: "EXISTS('lease', status='active')"
    - lease_payments_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_payment')"
    - lease_late_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_late_charge')"
    - lessee_rate_points: "K('lessee_rate_points_full') if (lease_active and lease_payments_12 >= K('lease_payment_count') and lease_late_12 == 0) else (K('lessee_rate_points_partial') if (lease_active and lease_late_12 <= 1) else 0)"
    - recent_payments: "SUM('retail_transactions', 'amount', within_months=1, date_field='txn_date', event_type='retail_payment')"
    - effort_points: "K('effort_points_full') if recent_payments >= F('monthly_payment') / 2 else (K('effort_points_partial') if recent_payments > 0 else 0)"
    - ext_entries: "COUNT('retail_transactions', event_type='retail_extension')"
    - due_change_entries: "COUNT('retail_transactions', event_type='retail_due_date_change')"
    - schedule_points: "K('schedule_points_full') if (ext_entries == 0 and due_change_entries == 0) else (K('schedule_points_partial') if ext_entries == 0 else 0)"
    - care_points: "K('care_points_full') if EXISTS('care', status='active', financed_account_number=F('account_number')) else (K('care_points_partial') if EXISTS('care', status='active') else 0)"
    - combined_rate: "unpaid_rate - lessee_rate_points - effort_points - schedule_points - care_points"
    - rate_figure: "RND(combined_rate / 100 * unpaid_portion, 2)"
    - days_beyond_grace: "DAYS(F('next_due_date'), NOW) - P('late_charge_grace_days')"
    - graduated_mode: "2 if (days_beyond_grace >= 1 and days_beyond_grace <= K('graduated_short_days')) else (1 if (days_beyond_grace > K('graduated_short_days') and days_beyond_grace <= K('graduated_mid_days')) else 0)"
    - graduated_figure: "int(rate_figure / 2) if graduated_mode == 2 else (int(rate_figure * 3 / 4) if graduated_mode == 1 else rate_figure)"
    - result: "RND(MX(0, MN(graduated_figure, MN(P('late_charge_company_max'), F('late_charge_max_amount')))), 2)"
    compute_basis:
      unpaid_portion: "The unpaid installment portion is the unpaid portion, as of the assessment date, of the installment the contract's next due date shows: payments reach the oldest installment first, so every later past-due installment is wholly unpaid, and the unpaid installment portion is the past_due_amount less one monthly_payment for each whole monthly_payment contained in the past_due_amount less one cent, rounded to the cent."
