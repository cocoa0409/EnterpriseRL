      unpaid_rate: "Unpaid installment rate schedule: the rate starts at unpaid_rate_long percent when the contract shows at least unpaid_long_payments installments satisfied and no returned payment in the last 24 calendar months; it starts at unpaid_rate_mid percent when the contract shows at least unpaid_mid_payments installments satisfied and no more than one returned payment in the last 24 calendar months, where the first condition is not met; in every other case it starts at late_charge_pct_of_unpaid_installment percent."
