- id: retail_sale_and_deficiency
  subject:
  - retail_repo_sale
  - retail_repo_sale_posted
  - retail_charge_off
  - retail_charged_off
  rule: A repossessed vehicle can be sold only while the contract status is repossessed. The sale may take place
    no earlier than company_min_days_nois_to_sale after the notice of intent to sell was mailed. The period is counted
    in calendar days starting the day after nois_mailed_date; where the contract records a nois_min_days longer
    than company_min_days_nois_to_sale, that longer period is used in the same count, and a sale on the first day
    after the period is permitted. Net proceeds are gross_proceeds less sale_expenses and are applied to principal;
    the contract moves to deficiency when principal_balance plus fees_due_balance remains above zero, and to paid_in_full
    when the net proceeds cover it. A surplus is refunded to the customer within surplus_refund_days calendar days
    of the sale together with a surplus notice. A deficiency balance may be settled for a lump sum of at least deficiency_settlement_min_pct
    percent of the deficiency, which pays the contract in full; a smaller offer is not within the servicing desk's
    authority. A deficiency can be charged off only while the contract status is deficiency. A deficiency may be
    charged off no earlier than deficiency_charge_off_days after the vehicle was sold. The period is counted in
    calendar days starting the day after scheduled_sale_date, and charge-off on the last day of the period is permitted.
  eligibility:
  - id: sale_status
    applies_to:
    - retail_repo_sale
    kind: state
    condition: A repossessed vehicle can be sold only while the contract status is repossessed.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - repossessed
  - id: notice_period
    applies_to:
    - retail_repo_sale
    kind: time
    condition: The sale may take place no earlier than company_min_days_nois_to_sale after the notice of intent
      to sell was mailed.
    evidence_fields:
    - retail_contracts.nois_mailed_date
    - retail_contracts.nois_min_days
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the notice of intent to sell was mailed
      anchor_source: retail_contracts.nois_mailed_date
      relation: not_before
      duration_source: variants.company_min_days_nois_to_sale
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after nois_mailed_date; where the contract
        records a nois_min_days longer than company_min_days_nois_to_sale, that longer period is used in the same
        count, and a sale on the first day after the period is permitted.
      boundary: exclusive
  - id: chargeoff_status
    applies_to:
    - retail_charge_off
    kind: state
    condition: A deficiency can be charged off only while the contract status is deficiency.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - deficiency
  - id: chargeoff_period
    applies_to:
    - retail_charge_off
    kind: time
    condition: A deficiency may be charged off no earlier than deficiency_charge_off_days after the vehicle was
      sold.
    evidence_fields:
    - retail_contracts.scheduled_sale_date
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was sold
      anchor_source: retail_contracts.scheduled_sale_date
      relation: not_before
      duration_source: variants.deficiency_charge_off_days
      unit: calendar_days
      counting_rule: The period is counted in calendar days starting the day after scheduled_sale_date, and charge-off
        on the last day of the period is permitted.
      boundary: inclusive
  formula:
    amount: gross_proceeds - sale_expenses
  params:
    company_min_days_nois_to_sale: =company_min_days_nois_to_sale
    surplus_refund_days: =surplus_refund_days
    deficiency_settlement_min_pct: =deficiency_settlement_min_pct
    deficiency_charge_off_days: =deficiency_charge_off_days
extended_policies:
  - id: retail_ext_returned_installment_late_charge
    base_policy_refs: [retail_late_charges]
    overwrite:
    - base_policy: retail_late_charges
      superseded_clause: >-
        The late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      replaced_by: >-
        For a late charge on an installment re-opened by a returned payment, and only for such a late charge, the charge is the re-opened installment late charge figured below, still capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount; a late charge on an installment left unpaid past its grace period and a late charge on an installment whose payment posted after its grace period follow the company's own schedules for those two cases, and any other late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount, and is not figured under this policy.
    trigger: state_due
    subject: [retail_late_charge]
    computes: late_charge_amount
    target_tool: assess_returned_installment_late_charge_34170c70
    params:
      rate_long_tenure: 3.0
      rate_mid_tenure: 4.0
      long_tenure_payments: 18
      mid_tenure_payments: 12
      lease_payment_count: 12
      rel_deduction_full: 3.0
      rel_deduction_partial: 1.5
      grace_lapse_full: 2.0
      grace_lapse_partial: 1.0
      grace_partial_after_days: 5
    rule: >-
      This policy figures the late charge assessed on an installment that a returned payment has re-opened: the payment that had paid the installment was dishonoured by the payer's bank and reversed, so the installment is again unpaid and is the installment the contract's next due date shows.
      For a late charge on an installment re-opened by a returned payment, and only for such a late charge, the charge is the re-opened installment late charge figured below, still capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount; a late charge on an installment left unpaid past its grace period and a late charge on an installment whose payment posted after its grace period follow the company's own schedules for those two cases, and any other late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount, and is not figured under this policy.
      The grace period, the status the contract must be in and the limit of one late charge per installment due date apply exactly as the base late charge rule states them.
      A re-opened installment is not an installment paid in full within the grace period: the reversal restores to it the amounts the dishonoured payment had applied, so it is again unpaid in the re-opened amount defined next, and no late charge is assessed on it when the re-opened amount is less than late_charge_min_unpaid_amount or when an extension has deferred it.
      The re-opened amount is the unpaid portion, as of the assessment date, of the installment the contract's next due date shows: payments reach the oldest installment first, so every later past-due installment is wholly unpaid, and the re-opened amount is the past_due_amount less one monthly_payment for each whole monthly_payment contained in the past_due_amount less one cent, rounded to the cent.
      The re-opened installment late charge is late_charge_pct_of_unpaid_installment percent of the re-opened amount, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      Re-opened installment rate schedule: the percentage applied to the re-opened amount is rate_long_tenure percent when the contract shows at least long_tenure_payments installments satisfied and no late charge was assessed on the contract in the last 12 calendar months; it is rate_mid_tenure percent when the contract shows at least mid_tenure_payments installments satisfied and no more than one late charge was assessed on the contract in the last 12 calendar months, where the first condition is not met; in every other case it is late_charge_pct_of_unpaid_installment percent.
      First-return relief: when the most recent returned payment is the only returned payment ever recorded on the contract and the contract has never been extended, the charge figured at the rate is halved and the result rounded down to the whole dollar; when it is the only returned payment ever recorded on the contract and the contract has been extended at least once, the charge figured at the rate is multiplied by three quarters and the result rounded down to the whole dollar; in every other case the charge figured at the rate is kept to the cent.
      Lessee relationship deduction: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, rel_deduction_full dollars are deducted from the re-opened installment late charge; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, rel_deduction_partial dollars are deducted; in every other case nothing is deducted.
      Lapsed-grace deduction: the return lag is the number of calendar days from the re-opened installment's due date to the date the most recent returned payment was recorded (returns recorded on the same date share that date); when the return lag is greater than late_charge_grace_days, so that the grace period had already ended before the customer learned of the return, grace_lapse_full dollars are deducted from the re-opened installment late charge; when the return lag is greater than grace_partial_after_days but not greater than late_charge_grace_days, grace_lapse_partial dollars are deducted; in every other case nothing is deducted.
      The re-opened installment late charge is assembled in this order: first the rate is applied to the re-opened amount, then any change of method is applied to that figure, then the cap is applied, and last any amount a schedule below deducts is subtracted; the charge is never below zero and is booked to the cent.
      Counting conventions: whole calendar months from one date to a later one are the difference in month numbers, less one when the later date's day number is smaller than the earlier date's, with no month-end adjustment; an entry lies in the last N calendar months when its date is not after today and fewer than N whole months run from its date to today, which is the same as being dated after the same day number N months before today.
      A count of calendar days from one date to another is the second date less the first, so the first date is not counted and the second is; the count is zero or negative when the second date is not after the first.
    prerequisite: []
    cross_category:
    - category: lease
      as: history
      reads: [status, lease_transactions.event_type, lease_transactions.txn_date]
      note: The lessee relationship deduction reads the customer's active Kestrel lease and counts its lease payments and lease late charges over the last 12 calendar months.
    compute:
    - reopened_amount: "RND(F('past_due_amount') - F('monthly_payment') * int((F('past_due_amount') - 0.01) / F('monthly_payment')), 2)"
    - late_count_12: "COUNT('retail_transactions', within_months=12, date_field='txn_date', event_type='retail_late_charge')"
    - reopen_rate: "K('rate_long_tenure') if (F('payments_made_count') >= K('long_tenure_payments') and late_count_12 == 0) else (K('rate_mid_tenure') if (F('payments_made_count') >= K('mid_tenure_payments') and late_count_12 <= 1) else P('late_charge_pct_of_unpaid_installment'))"
    - rate_figure: "RND(reopen_rate / 100 * reopened_amount, 2)"
    - returned_count_all: "COUNT('retail_transactions', event_type='retail_payment_returned')"
    - relief_mode: "2 if (returned_count_all == 1 and F('extensions_used_lifetime') == 0) else (1 if returned_count_all == 1 else 0)"
    - relief_figure: "int(rate_figure / 2) if relief_mode == 2 else (int(rate_figure * 3 / 4) if relief_mode == 1 else rate_figure)"
    - charge_cap: "MN(P('late_charge_company_max'), F('late_charge_max_amount'))"
    - capped_figure: "MN(relief_figure, charge_cap)"
    - lease_active: "EXISTS('lease', status='active')"
    - lease_payments_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_payment')"
    - lease_late_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_late_charge')"
    - rel_deduction: "K('rel_deduction_full') if (lease_active and lease_payments_12 >= K('lease_payment_count') and lease_late_12 == 0) else (K('rel_deduction_partial') if (lease_active and lease_late_12 <= 1) else 0)"
    - return_lag: "DAYS(F('next_due_date'), LATEST('retail_transactions', 'txn_date', date_field='txn_date', event_type='retail_payment_returned'))"
    - grace_deduction: "K('grace_lapse_full') if return_lag > P('late_charge_grace_days') else (K('grace_lapse_partial') if return_lag > K('grace_partial_after_days') else 0)"
    - result: "RND(MX(0, capped_figure - rel_deduction - grace_deduction), 2)"
    compute_basis:
      reopened_amount: "The re-opened amount is the unpaid portion, as of the assessment date, of the installment the contract's next due date shows: payments reach the oldest installment first, so every later past-due installment is wholly unpaid, and the re-opened amount is the past_due_amount less one monthly_payment for each whole monthly_payment contained in the past_due_amount less one cent, rounded to the cent."
      late_count_12: "it is rate_mid_tenure percent when the contract shows at least mid_tenure_payments installments satisfied and no more than one late charge was assessed on the contract in the last 12 calendar months, where the first condition is not met"
      reopen_rate: "Re-opened installment rate schedule: the percentage applied to the re-opened amount is rate_long_tenure percent when the contract shows at least long_tenure_payments installments satisfied and no late charge was assessed on the contract in the last 12 calendar months; it is rate_mid_tenure percent when the contract shows at least mid_tenure_payments installments satisfied and no more than one late charge was assessed on the contract in the last 12 calendar months, where the first condition is not met; in every other case it is late_charge_pct_of_unpaid_installment percent."
      rate_figure: "The re-opened installment late charge is late_charge_pct_of_unpaid_installment percent of the re-opened amount, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount."
      returned_count_all: "when the most recent returned payment is the only returned payment ever recorded on the contract and the contract has never been extended"
      relief_mode: "First-return relief: when the most recent returned payment is the only returned payment ever recorded on the contract and the contract has never been extended"
      relief_figure: "First-return relief: when the most recent returned payment is the only returned payment ever recorded on the contract and the contract has never been extended, the charge figured at the rate is halved and the result rounded down to the whole dollar; when it is the only returned payment ever recorded on the contract and the contract has been extended at least once, the charge figured at the rate is multiplied by three quarters and the result rounded down to the whole dollar; in every other case the charge figured at the rate is kept to the cent."
      charge_cap: "capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount"
      capped_figure: "first the rate is applied to the re-opened amount, then any change of method is applied to that figure, then the cap is applied, and last any amount a schedule below deducts is subtracted"
      lease_active: "when the customer holds an active Kestrel lease"
      lease_payments_12: "the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
      lease_late_12: "the lease ledger shows no more than one lease late charge in the last 12 calendar months"
      rel_deduction: "Lessee relationship deduction: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, rel_deduction_full dollars are deducted from the re-opened installment late charge; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, rel_deduction_partial dollars are deducted; in every other case nothing is deducted."
      return_lag: "the return lag is the number of calendar days from the re-opened installment's due date to the date the most recent returned payment was recorded (returns recorded on the same date share that date)"
      grace_deduction: "when the return lag is greater than late_charge_grace_days, so that the grace period had already ended before the customer learned of the return, grace_lapse_full dollars are deducted from the re-opened installment late charge; when the return lag is greater than grace_partial_after_days but not greater than late_charge_grace_days, grace_lapse_partial dollars are deducted; in every other case nothing is deducted."
      result: "the charge is never below zero and is booked to the cent."
    factors:
    - id: lrf_tenure_rate
      effect: parameter
      decides: reopen_rate
      bindings: [late_count_12, reopen_rate]
      ladder:
      - when: "at least long_tenure_payments installments satisfied and no late charge on the contract in the last 12 calendar months"
        value: "K('rate_long_tenure')"
      - when: "at least mid_tenure_payments installments satisfied and no more than one late charge in the last 12 calendar months, the first condition not met"
        value: "K('rate_mid_tenure')"
      - when: "otherwise"
        value: "P('late_charge_pct_of_unpaid_installment')"
      baseline:
        reopen_rate: "P('late_charge_pct_of_unpaid_installment')"
      evidence: [history, tier_param]
      cross_difficulty: null
    - id: lrf_first_return_relief
      effect: method
      decides: relief_mode
      bindings: [returned_count_all, relief_mode]
      ladder:
      - when: "the most recent returned payment is the only one ever recorded on the contract and the contract has never been extended"
        method: "the charge figured at the rate is halved and rounded down to the whole dollar"
      - when: "the only returned payment ever recorded on the contract and the contract has been extended at least once"
        method: "the charge figured at the rate is multiplied by three quarters and rounded down to the whole dollar"
      - when: "otherwise"
        method: "the charge figured at the rate is kept to the cent"
      baseline:
        relief_mode: "0"
      evidence: [history]
      cross_difficulty: null
    - id: lrf_lessee_deduction
      effect: parameter
      decides: rel_deduction
      bindings: [lease_active, lease_payments_12, lease_late_12, rel_deduction]
      ladder:
      - when: "an active Kestrel lease and at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
        value: "K('rel_deduction_full')"
      - when: "an active Kestrel lease and no more than one lease late charge in the last 12 calendar months, the first condition not met"
        value: "K('rel_deduction_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        rel_deduction: "0"
      evidence: [cross_category, history]
      cross_difficulty: lease
    - id: lrf_lapsed_grace
      effect: parameter
      decides: grace_deduction
      bindings: [return_lag, grace_deduction]
      ladder:
      - when: "the return lag is greater than late_charge_grace_days"
        value: "K('grace_lapse_full')"
      - when: "the return lag is greater than grace_partial_after_days but not greater than late_charge_grace_days"
        value: "K('grace_lapse_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        grace_deduction: "0"
      evidence: [date, history]
      cross_difficulty: null
    baseline:
      rule: >-
        The re-opened amount is the unpaid portion, as of the assessment date, of the installment the contract's next due date shows: payments reach the oldest installment first, so every later past-due installment is wholly unpaid, and the re-opened amount is the past_due_amount less one monthly_payment for each whole monthly_payment contained in the past_due_amount less one cent, rounded to the cent.
        The re-opened installment late charge is late_charge_pct_of_unpaid_installment percent of the re-opened amount, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      params: [late_charge_pct_of_unpaid_installment, late_charge_company_max]
    inputs:
      history:
      - {table: retail_transactions, aggregate: latest, field: amount, filters: {event_type: retail_payment_returned}}
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 12, filters: {event_type: retail_late_charge}}
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, filters: {event_type: retail_payment_returned}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_payment}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_late_charge}}
      cross_category: [lease]
  - id: retail_ext_arrears_payment
    base_policy_refs: [retail_payment_posting, retail_reinstatement_and_redemption]
    overwrite:
    - base_policy: retail_payment_posting
      superseded_clause: >-
        Each payment is applied in payment_allocation_order: first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal.
      replaced_by: >-
        For an arrears payment an agent takes toward an extension, and only for such a payment, the payment is recorded on the contract on its posting day with its amount, channel and purpose, and the nightly posting cycle that closes that day applies it in payment_allocation_order, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal; a good-faith payment toward an extension and a catch-up payment are recorded and applied the same way under their own policies, and every other payment is applied in payment_allocation_order when it posts, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal, and is not posted under this policy.
    trigger: on_request
    subject: [retail_payment]
    computes: payment_amount
    target_tool: post_arrears_payment_6321a7ae
    params:
      standard_share_pct: 100
      share_long_pct: 70
      share_mid_pct: 85
      share_long_payments: 18
      share_mid_payments: 12
      share_mid_late_max: 2
      lease_payment_count: 12
      lessee_share_points_full: 10
      lessee_share_points_partial: 5
      exposure_months: 36
      exposure_points_low_tier: 5
      exposure_points_other: 2.5
    rule: >-
      This policy figures the arrears payment a Kestrel agent takes by phone, from the customer's bank account, toward the past-due installments of a retail installment contract other than its oldest past-due installment, when the customer has asked for that oldest installment to be extended.
      The payment is posted under the payment posting rule: the contract must be in a payable status, the posting day follows the cutoff rule, and the agent-assisted ACH channel carries no channel fee.
      For an arrears payment an agent takes toward an extension, and only for such a payment, the payment is recorded on the contract on its posting day with its amount, channel and purpose, and the nightly posting cycle that closes that day applies it in payment_allocation_order, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal; a good-faith payment toward an extension and a catch-up payment are recorded and applied the same way under their own policies, and every other payment is applied in payment_allocation_order when it posts, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal, and is not posted under this policy.
      The arrears payment amount is worked out only once the late charge owed on the installment the contract's next due date shows, when a returned payment has re-opened it, stands on the contract.
      The other past-due amount is the contract's past_due_amount less one monthly_payment for each installment the most recent completed signed extension agreement on the contract defers, those being its oldest installments; when two completed agreements carry the same creation time, the one recorded first is read. This policy applies only where a completed signed extension agreement is on the contract; without one there is no arrears payment under this policy.
      The arrears share is standard_share_pct percent, and the arrears payment amount is the arrears share of the other past-due amount, rounded to the cent.
      Arrears share schedule: the arrears share is replaced by share_long_pct percent when the contract shows at least share_long_payments installments satisfied and no late charge in the last 12 calendar months, and by share_mid_pct percent when the contract shows at least share_mid_payments installments satisfied and no more than share_mid_late_max late charges in the last 12 calendar months, where the first condition is not met; in every other case it stays at standard_share_pct percent.
      Lessee share points: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, lessee_share_points_full percentage points are taken off the arrears share; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, lessee_share_points_partial points are taken off; in every other case no points are taken off.
      Exposure points: the months to maturity are the whole calendar months from today to the contract's maturity_date; when the months to maturity are at least exposure_months and the contract is on Kestrel New Vehicle Retail Tier 4 or Kestrel New Vehicle Retail Tier 5, exposure_points_low_tier percentage points are added to the arrears share; when the months to maturity are at least exposure_months on any other tier, exposure_points_other points are added; in every other case no points are added.
      Fee carry: when the contract shows a returned payment in the last 12 calendar months and its fees_due_balance is above zero, the arrears payment amount also includes an amount equal to the whole fees_due_balance; when the contract shows no returned payment in the last 12 calendar months and its fees_due_balance is above zero, it includes an amount equal to the fees_due_balance up to late_charge_company_max; in every other case it includes no amount for fees.
      The arrears payment amount is assembled in this order: any replacement of the arrears share comes first, then every addition to it or deduction from it, giving one share that is applied once to the other past-due amount and rounded to the cent; any amount a schedule below includes is then added; the amount is never below zero.
      Counting conventions: whole calendar months from one date to a later one are the difference in month numbers, less one when the later date's day number is smaller than the earlier date's, with no month-end adjustment; an entry lies in the last N calendar months when its date is not after today and fewer than N whole months run from its date to today, which is the same as being dated after the same day number N months before today.
    prerequisite:
    - problem: retail_ext_returned_installment_late_charge
      kind: value_input
      gate: fee_carry
      form: state
      policy_source: >-
        The arrears payment amount is worked out only once the late charge owed on the installment the contract's next due date shows, when a returned payment has re-opened it, stands on the contract.
      condition: >-
        When the installment the contract's next due date shows was re-opened by a returned payment and its grace period has ended, the contract's ledger carries a retail_late_charge transaction with that installment_due_date and the contract's fees_due_balance includes it.
      resolved_by: assess_returned_installment_late_charge_34170c70
      effect: >-
        Booking the late charge on the re-opened installment raises the fees_due_balance the fee carry reads and adds a late charge to the 12-month ledger the arrears share schedule reads, so both can change.
    cross_category:
    - category: lease
      as: history
      reads: [status, lease_transactions.event_type, lease_transactions.txn_date]
      note: The lessee share points read the customer's active Kestrel lease and count its lease payments and lease late charges over the last 12 calendar months.
    compute:
    - deferred_count: "LATEST('retail_requests', 'requested_installments', date_field='created_at', request_type='extension_agreement', request_status='completed')"
    - other_past_due: "F('past_due_amount') - F('monthly_payment') * deferred_count"
    - late_12: "COUNT('retail_transactions', within_months=12, date_field='txn_date', event_type='retail_late_charge')"
    - share_start: "K('share_long_pct') if (F('payments_made_count') >= K('share_long_payments') and late_12 == 0) else (K('share_mid_pct') if (F('payments_made_count') >= K('share_mid_payments') and late_12 <= K('share_mid_late_max')) else K('standard_share_pct'))"
    - lease_active: "EXISTS('lease', status='active')"
    - lease_payments_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_payment')"
    - lease_late_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_late_charge')"
    - lessee_share_points: "K('lessee_share_points_full') if (lease_active and lease_payments_12 >= K('lease_payment_count') and lease_late_12 == 0) else (K('lessee_share_points_partial') if (lease_active and lease_late_12 <= 1) else 0)"
    - months_to_maturity: "MONTHS(NOW, F('maturity_date'))"
    - exposure_points: "K('exposure_points_low_tier') if (months_to_maturity >= K('exposure_months') and (F('variant_name') == 'Kestrel New Vehicle Retail Tier 4' or F('variant_name') == 'Kestrel New Vehicle Retail Tier 5')) else (K('exposure_points_other') if months_to_maturity >= K('exposure_months') else 0)"
    - returned_12: "COUNT('retail_transactions', within_months=12, date_field='txn_date', event_type='retail_payment_returned')"
    - fee_carry: "F('fees_due_balance') if (returned_12 >= 1 and F('fees_due_balance') > 0) else (MN(F('fees_due_balance'), P('late_charge_company_max')) if (returned_12 == 0 and F('fees_due_balance') > 0) else 0)"
    - share_pct: "share_start - lessee_share_points + exposure_points"
    - share_amount: "RND(share_pct / 100 * other_past_due, 2)"
    - result: "RND(MX(0, share_amount + fee_carry), 2)"
    compute_basis:
      deferred_count: "one monthly_payment for each installment the most recent completed signed extension agreement on the contract defers"
      other_past_due: "The other past-due amount is the contract's past_due_amount less one monthly_payment for each installment the most recent completed signed extension agreement on the contract defers, those being its oldest installments; when two completed agreements carry the same creation time, the one recorded first is read. This policy applies only where a completed signed extension agreement is on the contract; without one there is no arrears payment under this policy."
      late_12: "when the contract shows at least share_long_payments installments satisfied and no late charge in the last 12 calendar months"
      share_start: "Arrears share schedule: the arrears share is replaced by share_long_pct percent when the contract shows at least share_long_payments installments satisfied and no late charge in the last 12 calendar months, and by share_mid_pct percent when the contract shows at least share_mid_payments installments satisfied and no more than share_mid_late_max late charges in the last 12 calendar months, where the first condition is not met; in every other case it stays at standard_share_pct percent."
      lease_active: "when the customer holds an active Kestrel lease"
      lease_payments_12: "the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
      lease_late_12: "the lease ledger shows no more than one lease late charge in the last 12 calendar months"
      lessee_share_points: "Lessee share points: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, lessee_share_points_full percentage points are taken off the arrears share; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, lessee_share_points_partial points are taken off; in every other case no points are taken off."
      months_to_maturity: "the months to maturity are the whole calendar months from today to the contract's maturity_date"
      exposure_points: "Exposure points: the months to maturity are the whole calendar months from today to the contract's maturity_date; when the months to maturity are at least exposure_months and the contract is on Kestrel New Vehicle Retail Tier 4 or Kestrel New Vehicle Retail Tier 5, exposure_points_low_tier percentage points are added to the arrears share; when the months to maturity are at least exposure_months on any other tier, exposure_points_other points are added; in every other case no points are added."
      returned_12: "when the contract shows a returned payment in the last 12 calendar months and its fees_due_balance is above zero"
      fee_carry: "Fee carry: when the contract shows a returned payment in the last 12 calendar months and its fees_due_balance is above zero, the arrears payment amount also includes an amount equal to the whole fees_due_balance; when the contract shows no returned payment in the last 12 calendar months and its fees_due_balance is above zero, it includes an amount equal to the fees_due_balance up to late_charge_company_max; in every other case it includes no amount for fees."
      share_pct: "any replacement of the arrears share comes first, then every addition to it or deduction from it, giving one share that is applied once to the other past-due amount and rounded to the cent"
      share_amount: "The arrears share is standard_share_pct percent, and the arrears payment amount is the arrears share of the other past-due amount, rounded to the cent."
      result: "any amount a schedule below includes is then added; the amount is never below zero."
    factors:
    - id: cuf_arrears_share
      effect: parameter
      decides: share_start
      bindings: [late_12, share_start]
      ladder:
      - when: "at least share_long_payments installments satisfied and no late charge in the last 12 calendar months"
        value: "K('share_long_pct')"
      - when: "at least share_mid_payments installments satisfied and no more than share_mid_late_max late charges in the last 12 calendar months, the first condition not met"
        value: "K('share_mid_pct')"
      - when: "otherwise"
        value: "K('standard_share_pct')"
      baseline:
        share_start: "K('standard_share_pct')"
      evidence: [history]
      cross_difficulty: null
    - id: cuf_lessee_share
      effect: parameter
      decides: lessee_share_points
      bindings: [lease_active, lease_payments_12, lease_late_12, lessee_share_points]
      ladder:
      - when: "an active Kestrel lease and at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
        value: "K('lessee_share_points_full')"
      - when: "an active Kestrel lease and no more than one lease late charge in the last 12 calendar months, the first condition not met"
        value: "K('lessee_share_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        lessee_share_points: "0"
      evidence: [cross_category, history]
      cross_difficulty: lease
    - id: cuf_exposure
      effect: parameter
      decides: exposure_points
      bindings: [months_to_maturity, exposure_points]
      ladder:
      - when: "at least exposure_months whole months to maturity on Tier 4 or Tier 5"
        value: "K('exposure_points_low_tier')"
      - when: "at least exposure_months whole months to maturity on any other tier"
        value: "K('exposure_points_other')"
      - when: "otherwise"
        value: "0"
      baseline:
        exposure_points: "0"
      evidence: [date, tier_param]
      cross_difficulty: null
    - id: cuf_fee_carry
      effect: method
      decides: fee_carry
      bindings: [returned_12, fee_carry]
      ladder:
      - when: "a returned payment in the last 12 calendar months and fees_due_balance above zero"
        method: "the amount includes the whole fees_due_balance"
      - when: "no returned payment in the last 12 calendar months and fees_due_balance above zero"
        method: "the amount includes the fees_due_balance up to late_charge_company_max"
      - when: "otherwise"
        method: "the amount includes nothing for fees"
      baseline:
        fee_carry: "0"
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The other past-due amount is the contract's past_due_amount less one monthly_payment for each installment the most recent completed signed extension agreement on the contract defers, those being its oldest installments; when two completed agreements carry the same creation time, the one recorded first is read. This policy applies only where a completed signed extension agreement is on the contract; without one there is no arrears payment under this policy.
        The arrears share is standard_share_pct percent, and the arrears payment amount is the arrears share of the other past-due amount, rounded to the cent.
      params: [standard_share_pct]
    inputs:
      history:
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 12, filters: {event_type: retail_late_charge}}
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 12, filters: {event_type: retail_payment_returned}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_payment}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_late_charge}}
      cross_category: [lease]
  - id: retail_ext_good_faith_payment
