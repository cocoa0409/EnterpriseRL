      due_shift_entries: "when it shows no extension but at least one due-date change"
      unchanged_points: "Unchanged-terms points: when the contract's ledger shows no extension and no due-date change, unchanged_points_full percentage points are taken off the late-posted rate; when it shows no extension but at least one due-date change, unchanged_points_partial points are taken off; in every other case no points are taken off."
      contract_age_months: "at least seasoned_months whole calendar months have passed from the contract date to today"
      seasoned_points: "Seasoned-contract points: when at least seasoned_months whole calendar months have passed from the contract date to today and the contract is on Kestrel New Vehicle Retail Tier 1+, Kestrel New Vehicle Retail Tier 1 or Kestrel New Vehicle Retail Tier 2, seasoned_points_prime percentage points are taken off the late-posted rate; when at least seasoned_months whole months have passed on any other tier, seasoned_points_other points are taken off; in every other case no points are taken off."
      posted_combined_rate: "the rate adjustments are first combined into one rate, which is applied once to one monthly_payment and rounded to the cent"
      posted_figure: "The late-posted installment late charge is late_charge_pct_of_unpaid_installment percent of one monthly_payment, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount."
      mailed_checks_2: "when the contract shows a payment by mailed check posted in the last 2 calendar months and the contract is not enrolled in autopay"
      float_mode: "when it shows such a mailed check payment and the contract is enrolled in autopay"
      float_figure: "Mail-float relief: when the contract shows a payment by mailed check posted in the last 2 calendar months and the contract is not enrolled in autopay, the charge figured at the rate is halved and the result rounded down to the whole dollar; when it shows such a mailed check payment and the contract is enrolled in autopay, the charge figured at the rate is multiplied by three quarters and the result rounded down to the whole dollar; in every other case the charge figured at the rate is kept to the cent."
      result: "any change of method is then applied to that figure; the cap is applied last, and the charge is booked to the cent and is never below zero."
    factors:
    - id: lpf_posted_rate
      effect: parameter
      decides: posted_rate
      bindings: [returned_24, posted_rate]
      ladder:
      - when: "at least posted_long_payments installments satisfied and no returned payment in the last 24 calendar months"
        value: "K('posted_rate_long')"
      - when: "at least posted_mid_payments installments satisfied and no more than one returned payment in the last 24 calendar months, the first condition not met"
        value: "K('posted_rate_mid')"
      - when: "otherwise"
        value: "P('late_charge_pct_of_unpaid_installment')"
      baseline:
        posted_rate: "P('late_charge_pct_of_unpaid_installment')"
      evidence: [history, tier_param]
      cross_difficulty: null
    - id: lpf_lessee_points
      effect: parameter
      decides: lessee_posted_points
      bindings: [lease_active, lease_payments_12, lease_late_12, lessee_posted_points]
      ladder:
      - when: "an active Kestrel lease and at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
        value: "K('lessee_posted_points_full')"
      - when: "an active Kestrel lease and no more than one lease late charge in the last 12 calendar months, the first condition not met"
        value: "K('lessee_posted_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        lessee_posted_points: "0"
      evidence: [cross_category, history]
      cross_difficulty: lease
    - id: lpf_care_holder
      effect: parameter
      decides: care_posted_points
      bindings: [care_posted_points]
      ladder:
      - when: "an active Kestrel Care plan financed in this contract"
        value: "K('care_posted_points_full')"
      - when: "an active Kestrel Care plan financed some other way"
        value: "K('care_posted_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        care_posted_points: "0"
      evidence: [cross_category]
      cross_difficulty: null
    - id: lpf_unchanged_terms
      effect: parameter
      decides: unchanged_points
      bindings: [extension_entries, due_shift_entries, unchanged_points]
      ladder:
      - when: "the ledger shows no extension and no due-date change"
        value: "K('unchanged_points_full')"
      - when: "the ledger shows no extension but at least one due-date change"
        value: "K('unchanged_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        unchanged_points: "0"
      evidence: [history]
      cross_difficulty: null
    - id: lpf_seasoned
      effect: parameter
      decides: seasoned_points
      bindings: [contract_age_months, seasoned_points]
      ladder:
      - when: "at least seasoned_months whole months since the contract date on Tier 1+, Tier 1 or Tier 2"
        value: "K('seasoned_points_prime')"
      - when: "at least seasoned_months whole months since the contract date on any other tier"
        value: "K('seasoned_points_other')"
      - when: "otherwise"
        value: "0"
      baseline:
        seasoned_points: "0"
      evidence: [date, tier_param]
      cross_difficulty: null
    - id: lpf_mail_float
      effect: method
      decides: float_mode
      bindings: [mailed_checks_2, float_mode]
      ladder:
      - when: "a mailed check payment in the last 2 calendar months and not enrolled in autopay"
        method: "the charge figured at the rate is halved and rounded down to the whole dollar"
      - when: "a mailed check payment in the last 2 calendar months and enrolled in autopay"
        method: "the charge figured at the rate is multiplied by three quarters and rounded down to the whole dollar"
      - when: "otherwise"
        method: "the charge figured at the rate is kept to the cent"
      baseline:
        float_mode: "0"
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The late-posted installment late charge is late_charge_pct_of_unpaid_installment percent of one monthly_payment, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      params: [late_charge_pct_of_unpaid_installment, late_charge_company_max]
    inputs:
      history:
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 24, filters: {event_type: retail_payment_returned}}
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 2, filters: {event_type: retail_payment, payment_channel: mail_check}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_payment}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_late_charge}}
      cross_category: [lease, care]
  - id: retail_ext_catch_up_payment
    base_policy_refs: [retail_payment_posting, retail_reinstatement_and_redemption]
    overwrite:
    - base_policy: retail_payment_posting
      superseded_clause: >-
        Each payment is applied in payment_allocation_order: first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal.
      replaced_by: >-
        For a catch-up payment, and only for such a payment, the payment is recorded on the contract on its posting day with its amount, channel and purpose, and the nightly posting cycle that closes that day applies it in payment_allocation_order, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal; an arrears payment an agent takes toward an extension and a good-faith payment toward an extension are recorded and applied the same way under their own policies, and every other payment is applied in payment_allocation_order when it posts, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal, and is not posted under this policy.
    trigger: on_request
    subject: [retail_payment]
    computes: payment_amount
    target_tool: submit_catch_up_payment_af77047e
    params:
      standard_pull_pct: 0
      pull_pct_repeat: 50
      pull_pct_single: 25
      pull_repeat_late_count: 2
      lessee_pull_pct_recent: 20
      lessee_pull_pct_year: 10
      lease_recent_months: 3
      interest_cover_min_days: 5
    rule: >-
      This policy figures the catch-up payment a customer makes in person, through Kestrel's automated payment line, to bring a past-due retail installment contract fully up to date.
      The payment is posted under the payment posting rule: the contract must be in a payable status, the posting day follows the cutoff rule, and the channel fee of the automated phone line applies.
      For a catch-up payment, and only for such a payment, the payment is recorded on the contract on its posting day with its amount, channel and purpose, and the nightly posting cycle that closes that day applies it in payment_allocation_order, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal; an arrears payment an agent takes toward an extension and a good-faith payment toward an extension are recorded and applied the same way under their own policies, and every other payment is applied in payment_allocation_order when it posts, first to simple interest accrued over retail_msr_interest_accrual_days at the contract apr on a per_diem_day_basis-day year, then to principal until retail_msr_installments_due is satisfied, then to fees due, and any remainder to principal, and is not posted under this policy.
      The catch-up amount is fixed only after the installment the contract's next due date shows, when it is left unpaid past its grace period and no returned payment re-opened it, carries its late charge on the contract.
      The catch-up amount is not fixed until the installment whose payment posted after its grace period ended shows its late charge in the contract's ledger.
      The pull-ahead share is standard_pull_pct percent, and the catch-up amount is the contract's past_due_amount plus the pull-ahead share of one monthly_payment, rounded to the cent.
      Fee settlement: when the contract shows a late charge assessed after the same day of the previous calendar month and is not enrolled in autopay, the catch-up amount also includes an amount equal to the whole fees_due_balance; when it shows such a late charge and is enrolled in autopay, it includes an amount equal to the fees_due_balance up to late_charge_company_max, the rest being left to the next autopay draft; in every other case it includes no amount for fees.
      Repeat-lateness pull-ahead: when the contract shows at least pull_repeat_late_count late charges in the last 12 calendar months and is not enrolled in autopay, pull_pct_repeat percentage points are added to the pull-ahead share; when it shows at least one late charge in the last 12 calendar months, where the first condition is not met, pull_pct_single points are added; in every other case nothing is added to it.
      Lease lateness pull-ahead: when the customer's Kestrel lease ledger shows a lease late charge in the last lease_recent_months calendar months, lessee_pull_pct_recent percentage points are added to the pull-ahead share; when it shows a lease late charge in the last 12 calendar months but none in the last lease_recent_months calendar months, lessee_pull_pct_year points are added; in every other case nothing is added to it.
      Overdue interest catch-up: the per diem is the contract's principal_balance times its apr divided by 100 and by per_diem_day_basis, rounded to the cent, and the days beyond grace are the calendar days from the contract's next_due_date to today less late_charge_grace_days; when the days beyond grace are at least interest_cover_min_days, the catch-up amount also carries the per diem for every day beyond grace; when they are from 1 to fewer than interest_cover_min_days, it carries the per diem for one day; in every other case it carries no interest; the interest carried is the per diem times those days, rounded to the cent.
      The catch-up amount is assembled in this order: every addition to the pull-ahead share is first combined with it into one share, which is applied once to one monthly_payment and rounded to the cent; that figure and every other amount a schedule below adds are then added to the contract's past_due_amount; the amount is never below zero.
      Counting conventions: whole calendar months from one date to a later one are the difference in month numbers, less one when the later date's day number is smaller than the earlier date's, with no month-end adjustment; an entry lies in the last N calendar months when its date is not after today and fewer than N whole months run from its date to today, which is the same as being dated after the same day number N months before today.
      A count of calendar days from one date to another is the second date less the first, so the first date is not counted and the second is; the count is zero or negative when the second date is not after the first.
    prerequisite:
    - problem: retail_ext_unpaid_installment_late_charge
      kind: value_input
      gate: fee_settlement
      form: state
      policy_source: >-
        The catch-up amount is fixed only after the installment the contract's next due date shows, when it is left unpaid past its grace period and no returned payment re-opened it, carries its late charge on the contract.
      condition: >-
        The installment the contract's next due date shows, left unpaid past its grace period, has a retail_late_charge transaction with that installment_due_date on the contract's ledger, included in fees_due_balance.
      resolved_by: assess_unpaid_installment_late_charge_51bb28dc
      effect: >-
        Booking the late charge on the unpaid installment raises the fees_due_balance the fee settlement adds and adds a late charge to the 12-month count the repeat-lateness pull-ahead reads.
    - problem: retail_ext_late_posted_installment_late_charge
      kind: value_input
      gate: fee_settlement
      form: state
      policy_source: >-
        The catch-up amount is not fixed until the installment whose payment posted after its grace period ended shows its late charge in the contract's ledger.
      condition: >-
        The installment satisfied by a payment posted after its grace period has a retail_late_charge transaction with that installment_due_date on the contract's ledger, included in fees_due_balance.
      resolved_by: assess_late_posted_installment_late_charge_04190f4f
      effect: >-
        Booking the late charge on the late-posted installment raises the fees_due_balance the fee settlement adds and adds a late charge to the 12-month count the repeat-lateness pull-ahead reads.
    cross_category:
    - category: lease
      as: history
      reads: [lease_transactions.event_type, lease_transactions.txn_date]
      note: The lease lateness pull-ahead counts the lease late charges on the customer's Kestrel lease ledger over the last 3 and the last 12 calendar months.
    compute:
    - recent_late_charges: "COUNT('retail_transactions', within_months=1, date_field='txn_date', event_type='retail_late_charge')"
    - fee_settlement: "F('fees_due_balance') if (recent_late_charges >= 1 and F('autopay_enrolled') == False) else (MN(F('fees_due_balance'), P('late_charge_company_max')) if recent_late_charges >= 1 else 0)"
    - late_12: "COUNT('retail_transactions', within_months=12, date_field='txn_date', event_type='retail_late_charge')"
    - repeat_pull_pct: "K('pull_pct_repeat') if (late_12 >= K('pull_repeat_late_count') and F('autopay_enrolled') == False) else (K('pull_pct_single') if late_12 >= 1 else 0)"
    - lease_late_recent: "XCOUNT('lease', 'lease_transactions', within_months=K('lease_recent_months'), date_field='txn_date', event_type='lease_late_charge')"
    - lease_late_12: "XCOUNT('lease', 'lease_transactions', within_months=12, date_field='txn_date', event_type='lease_late_charge')"
    - lease_pull_pct: "K('lessee_pull_pct_recent') if lease_late_recent >= 1 else (K('lessee_pull_pct_year') if lease_late_12 >= 1 else 0)"
    - per_diem: "RND(F('principal_balance') * F('apr') / 100 / P('per_diem_day_basis'), 2)"
    - beyond_grace_days: "DAYS(F('next_due_date'), NOW) - P('late_charge_grace_days')"
    - interest_days: "beyond_grace_days if beyond_grace_days >= K('interest_cover_min_days') else (1 if beyond_grace_days >= 1 else 0)"
    - pull_amount: "RND((K('standard_pull_pct') + repeat_pull_pct + lease_pull_pct) / 100 * F('monthly_payment'), 2)"
    - interest_carried: "RND(per_diem * interest_days, 2)"
    - result: "RND(MX(0, F('past_due_amount') + pull_amount + fee_settlement + interest_carried), 2)"
    compute_basis:
      recent_late_charges: "when the contract shows a late charge assessed after the same day of the previous calendar month and is not enrolled in autopay"
      fee_settlement: "Fee settlement: when the contract shows a late charge assessed after the same day of the previous calendar month and is not enrolled in autopay, the catch-up amount also includes an amount equal to the whole fees_due_balance; when it shows such a late charge and is enrolled in autopay, it includes an amount equal to the fees_due_balance up to late_charge_company_max, the rest being left to the next autopay draft; in every other case it includes no amount for fees."
      late_12: "when the contract shows at least pull_repeat_late_count late charges in the last 12 calendar months and is not enrolled in autopay"
      repeat_pull_pct: "Repeat-lateness pull-ahead: when the contract shows at least pull_repeat_late_count late charges in the last 12 calendar months and is not enrolled in autopay, pull_pct_repeat percentage points are added to the pull-ahead share; when it shows at least one late charge in the last 12 calendar months, where the first condition is not met, pull_pct_single points are added; in every other case nothing is added to it."
      lease_late_recent: "when the customer's Kestrel lease ledger shows a lease late charge in the last lease_recent_months calendar months"
      lease_late_12: "when it shows a lease late charge in the last 12 calendar months but none in the last lease_recent_months calendar months"
      lease_pull_pct: "Lease lateness pull-ahead: when the customer's Kestrel lease ledger shows a lease late charge in the last lease_recent_months calendar months, lessee_pull_pct_recent percentage points are added to the pull-ahead share; when it shows a lease late charge in the last 12 calendar months but none in the last lease_recent_months calendar months, lessee_pull_pct_year points are added; in every other case nothing is added to it."
      per_diem: "the per diem is the contract's principal_balance times its apr divided by 100 and by per_diem_day_basis, rounded to the cent"
      beyond_grace_days: "the days beyond grace are the calendar days from the contract's next_due_date to today less late_charge_grace_days"
      interest_days: "when the days beyond grace are at least interest_cover_min_days, the catch-up amount also carries the per diem for every day beyond grace; when they are from 1 to fewer than interest_cover_min_days, it carries the per diem for one day; in every other case it carries no interest; the interest carried is the per diem times those days, rounded to the cent."
      pull_amount: "every addition to the pull-ahead share is first combined with it into one share, which is applied once to one monthly_payment and rounded to the cent"
      interest_carried: "the interest carried is the per diem times those days, rounded to the cent."
      result: "that figure and every other amount a schedule below adds are then added to the contract's past_due_amount; the amount is never below zero."
    factors:
    - id: cpf_fee_settlement
      effect: method
      decides: fee_settlement
      bindings: [recent_late_charges, fee_settlement]
      ladder:
      - when: "a late charge assessed after the same day of the previous calendar month and not enrolled in autopay"
        method: "the amount includes the whole fees_due_balance"
      - when: "such a late charge and enrolled in autopay"
        method: "the amount includes the fees_due_balance up to late_charge_company_max"
      - when: "otherwise"
        method: "the amount includes nothing for fees"
      baseline:
        fee_settlement: "0"
      evidence: [history]
      cross_difficulty: null
    - id: cpf_repeat_pull
      effect: parameter
      decides: repeat_pull_pct
      bindings: [late_12, repeat_pull_pct]
      ladder:
      - when: "at least pull_repeat_late_count late charges in the last 12 calendar months and not enrolled in autopay"
        value: "K('pull_pct_repeat')"
      - when: "at least one late charge in the last 12 calendar months, the first condition not met"
        value: "K('pull_pct_single')"
      - when: "otherwise"
        value: "0"
      baseline:
        repeat_pull_pct: "0"
      evidence: [history]
      cross_difficulty: null
    - id: cpf_lease_pull
      effect: parameter
      decides: lease_pull_pct
      bindings: [lease_late_recent, lease_late_12, lease_pull_pct]
      ladder:
      - when: "a lease late charge in the last lease_recent_months calendar months"
        value: "K('lessee_pull_pct_recent')"
      - when: "a lease late charge in the last 12 calendar months but none in the last lease_recent_months calendar months"
        value: "K('lessee_pull_pct_year')"
      - when: "otherwise"
        value: "0"
      baseline:
        lease_pull_pct: "0"
      evidence: [cross_category, history]
      cross_difficulty: lease
    - id: cpf_overdue_interest
      effect: method
      decides: interest_days
      bindings: [beyond_grace_days, interest_days]
      ladder:
      - when: "days beyond grace at least interest_cover_min_days"
        method: "the per diem is carried for every day beyond grace"
      - when: "days beyond grace from 1 to fewer than interest_cover_min_days"
        method: "the per diem is carried for one day"
      - when: "otherwise"
        method: "no interest is carried"
      baseline:
        interest_days: "0"
      evidence: [date]
      cross_difficulty: null
    baseline:
      rule: >-
        The pull-ahead share is standard_pull_pct percent, and the catch-up amount is the contract's past_due_amount plus the pull-ahead share of one monthly_payment, rounded to the cent.
      params: [standard_pull_pct]
    inputs:
      history:
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 12, filters: {event_type: retail_late_charge}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_late_charge}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 3, filters: {event_type: lease_late_charge}}
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 1, filters: {event_type: retail_late_charge}}
      cross_category: [lease]
