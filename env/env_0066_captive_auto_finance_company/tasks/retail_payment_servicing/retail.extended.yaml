        - retail_fee_waiver
      distinct_fields: []
  measures:
  - retail_msr_consecutive_on_time
  - retail_msr_courtesy_waivers_lookback
  params:
    per_tier:
      Kestrel New Vehicle Retail Tier 5:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
      Kestrel New Vehicle Retail Tier 4:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
      Kestrel New Vehicle Retail Tier 3:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
      Kestrel New Vehicle Retail Tier 2:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
      Kestrel New Vehicle Retail Tier 1:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
      Kestrel New Vehicle Retail Tier 1+:
        courtesy_waivers_per_12_months: =courtesy_waivers_per_12_months
        courtesy_min_consecutive_on_time: =courtesy_min_consecutive_on_time
- id: retail_due_date_changes
  subject:
  - retail_due_date_change
  - retail_schedule_updated
  rule: 'A due-date change can be made only while the contract status is active. The contract must show days_past_due
    of 0, payments_made_count of at least due_date_change_min_payments_made and due_date_changes_used below due_date_change_lifetime_max
    for the tier. A due-date change may take effect no earlier than due_date_change_interval_months after the last
    due-date change took effect. The interval is counted in calendar months from last_due_date_change_date to the
    same day number of the later month, falling back to that month''s last day when the day does not exist; a contract
    that has never changed its due date has no interval to wait. The new due day must lie between due_day_earliest
    and due_day_latest of the month, and the first installment on the new due day may fall no more than due_date_change_max_shift_days
    calendar days after the current next_due_date and never before it. Exception: a change whose new due day equals
    the due_day of another open Kestrel retail, pre-owned or balloon contract, or of an active Kestrel lease, of
    the same customer is a relationship alignment and does not have to wait for the interval; it still counts toward
    the lifetime maximum. No fee is charged; simple interest continues to accrue daily, so a longer gap to the first
    installment on the new due day increases the interest portion of that installment. The change updates due_day,
    next_due_date, due_date_changes_used and last_due_date_change_date on the contract; maturity_date moves to the
    new due day in the final month.'
  eligibility:
  - id: dd_status
    applies_to:
    - retail_due_date_change
    kind: state
    condition: A due-date change can be made only while the contract status is active.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - active
  - id: dd_counts
    applies_to:
    - retail_due_date_change
    kind: authorization
    condition: The contract must show days_past_due of 0, payments_made_count of at least due_date_change_min_payments_made
      and due_date_changes_used below due_date_change_lifetime_max for the tier.
    evidence_fields:
    - retail_contracts.days_past_due
    - retail_contracts.payments_made_count
    - retail_contracts.due_date_changes_used
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
  - id: dd_interval
    applies_to:
    - retail_due_date_change
    kind: time
    condition: A due-date change may take effect no earlier than due_date_change_interval_months after the last
      due-date change took effect.
    evidence_fields:
    - retail_contracts.last_due_date_change_date
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the last due-date change took effect
      anchor_source: retail_contracts.last_due_date_change_date
      relation: not_before
      duration_source: variants.due_date_change_interval_months
      unit: calendar_months
      counting_rule: The interval is counted in calendar months from last_due_date_change_date to the same day number
        of the later month, falling back to that month's last day when the day does not exist; a contract that has
        never changed its due date has no interval to wait.
      boundary: inclusive
  params:
    per_tier:
      Kestrel New Vehicle Retail Tier 5:
        due_date_change_lifetime_max: =due_date_change_lifetime_max
        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
      Kestrel New Vehicle Retail Tier 4:
        due_date_change_lifetime_max: =due_date_change_lifetime_max
        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
      Kestrel New Vehicle Retail Tier 3:
        due_date_change_lifetime_max: =due_date_change_lifetime_max
        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
      Kestrel New Vehicle Retail Tier 2:
        due_date_change_lifetime_max: =due_date_change_lifetime_max
        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
      Kestrel New Vehicle Retail Tier 1:
        due_date_change_lifetime_max: =due_date_change_lifetime_max
        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
      Kestrel New Vehicle Retail Tier 1+:
        due_date_change_lifetime_max: =due_date_change_lifetime_max
        due_date_change_min_payments_made: =due_date_change_min_payments_made
        due_date_change_max_shift_days: =due_date_change_max_shift_days
    due_day_earliest: =due_day_earliest
    due_day_latest: =due_day_latest
    due_date_change_interval_months: =due_date_change_interval_months
- id: retail_extensions
  subject:
  - retail_extension
  - retail_schedule_updated
  rule: An extension can be granted only while the contract status is active. The contract must show payments_made_count
    of at least extension_min_payments_made, days_past_due of no more than extension_max_days_past_due, and extensions_used_lifetime
    plus the installments requested no greater than extension_lifetime_max_installments for the tier. No extension
    is granted when retail_msr_remaining_installments is extension_blackout_final_installments or fewer. No extension
    is granted while any other Kestrel contract of the customer is repo_assigned, repossessed, deficiency or charged_off,
    or any Kestrel lease of the customer is repossessed or charged_off. An extension may take effect no earlier
    than extension_interval_months after the previous extension took effect. The interval is counted in calendar
    months from last_extension_date to the same day number of the later month, falling back to that month's last
    day when the day does not exist; a contract never extended has no interval to wait. One request may defer no
    more than extension_max_installments_per_request installments, always starting with the installment due on next_due_date.
    Before the extension is granted, a good-faith payment of at least extension_good_faith_pct percent of monthly_payment
    must have posted since the most recent installment due date; a tier whose percentage is 0 requires none. The
    agent sends the extension agreement for signature, and it expires if not completed within extension_agreement_return_days
    calendar days. The extension takes effect only after the customer has completed the signed extension agreement
    for this contract. The extension fee is extension_fee for the tier where the contract records extension_fee_permitted
    as true, and 0.00 where it is false; the fee is booked to fees due. On the effective date next_due_date and
    maturity_date each move later by one month per deferred installment, extensions_used_lifetime increases by the
    number deferred and last_extension_date is set; simple interest keeps accruing on principal throughout, so the
    final installment absorbs the extra interest. Late charges already assessed remain due, and no late charge is
    assessed on a deferred installment.
  eligibility:
  - id: x_status
    applies_to:
    - retail_extension
    kind: state
    condition: An extension can be granted only while the contract status is active.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - active
  - id: x_counts
    applies_to:
    - retail_extension
    kind: authorization
    condition: The contract must show payments_made_count of at least extension_min_payments_made, days_past_due
      of no more than extension_max_days_past_due, and extensions_used_lifetime plus the installments requested
      no greater than extension_lifetime_max_installments for the tier.
    evidence_fields:
    - retail_contracts.payments_made_count
    - retail_contracts.days_past_due
    - retail_contracts.extensions_used_lifetime
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
  - id: x_blackout
    applies_to:
    - retail_extension
    kind: authorization
    condition: No extension is granted when retail_msr_remaining_installments is extension_blackout_final_installments
      or fewer.
    evidence_fields:
    - retail_contracts.term_months
    - retail_contracts.extensions_used_lifetime
    - retail_contracts.payments_made_count
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
  - id: x_relationship
    applies_to:
    - retail_extension
    kind: authorization
    condition: No extension is granted while any other Kestrel contract of the customer is repo_assigned, repossessed,
      deficiency or charged_off, or any Kestrel lease of the customer is repossessed or charged_off.
    evidence_fields:
    - retail_contracts.customer_id
    - preowned_contracts.status
    - balloon_contracts.status
    - lease_contracts.status
    - preowned_contracts.customer_id
    - balloon_contracts.customer_id
    - lease_contracts.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.customer_id
      action_bindings:
        retail_contracts.customer_id: customer_id
  - id: x_signed
    applies_to:
    - retail_extension
    kind: authorization
    condition: The extension takes effect only after the customer has completed the signed extension agreement for
      this contract.
    evidence_fields:
    - retail_requests.request_status
    - retail_requests.request_type
    - retail_requests.retail_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_requests.retail_request_id
      action_bindings:
        retail_requests.retail_request_id: retail_request_id
  - id: x_interval
    applies_to:
    - retail_extension
    kind: time
    condition: An extension may take effect no earlier than extension_interval_months after the previous extension
      took effect.
    evidence_fields:
    - retail_contracts.last_extension_date
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the previous extension took effect
      anchor_source: retail_contracts.last_extension_date
      relation: not_before
      duration_source: variants.extension_interval_months
      unit: calendar_months
      counting_rule: The interval is counted in calendar months from last_extension_date to the same day number
        of the later month, falling back to that month's last day when the day does not exist; a contract never
        extended has no interval to wait.
      boundary: inclusive
  measures:
