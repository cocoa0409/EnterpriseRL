events:
- type: retail_contract_booked
  target: retail_contracts
  mutation: create
  meaning: A new-vehicle retail installment sale contract purchased from a Kestrel dealer is booked for funding
    review.
  grain: one row per contract; this write changes that contract record
  fields:
    account_number: account number assigned at booking
    variant_name: credit tier assigned from the credit decision
    vin: vehicle identification number
    vehicle_year: model year
    vehicle_model: make, model and trim
    contract_state: governing state
    contract_date: contract signing date
    first_payment_date: first installment due date
    maturity_date: final installment due date
    term_months: number of installments
    apr: annual percentage rate from the tier rate sheet
    amount_financed: amount financed
    monthly_payment: scheduled installment
    due_day: day of month installments fall due
    late_charge_max_amount: state late-charge maximum recorded at booking
    nsf_fee_max_amount: state returned-payment fee maximum recorded at booking
    extension_fee_permitted: whether the state permits an extension fee
    right_to_cure_days: state right-to-cure period recorded at booking
    state_reinstatement_days: state reinstatement period recorded at booking
    nois_min_days: state minimum notice-to-sale period recorded at booking
    lien_type: electronic or paper lien
    title_state: titling state
  triggers: []
- type: retail_contract_funded
  target: retail_contracts
  mutation:
    transition:
      from: pending_funding
      to: active
  meaning: The contract passes funding review and the dealer is paid.
  grain: one row per contract; this write changes that contract record
  fields:
    next_due_date: set to the first installment due date
  triggers:
  - event: retail:retail_funding
    map: {}
- type: retail_repo_assigned
  target: retail_contracts
  mutation:
    transition:
      from: active
      to: repo_assigned
  meaning: The defaulted account is assigned to a repossession agency.
  grain: one row per contract; this write changes that contract record
  fields:
    repo_assigned_date: assignment date
  triggers: []
- type: retail_repo_recalled
  target: retail_contracts
  mutation:
    transition:
      from: repo_assigned
      to: active
  meaning: The repossession assignment is recalled after the default is cured.
  grain: one row per contract; this write changes that contract record
  fields:
    repo_assigned_date: cleared when the assignment is recalled
  triggers: []
- type: retail_vehicle_recovered
  target: retail_contracts
  mutation:
    transition:
      from: repo_assigned
      to: repossessed
  meaning: The agency recovers the vehicle.
  grain: one row per contract; this write changes that contract record
  fields:
    repossession_date: recovery date
    repossession_type: involuntary
  triggers:
  - event: retail:retail_repo_expense
    map:
      fee_type: repossession_agency_fee
- type: retail_voluntary_surrender
  target: retail_contracts
  mutation:
    transition:
      from: active
      to: repossessed
  meaning: The customer voluntarily surrenders the vehicle.
  grain: one row per contract; this write changes that contract record
  fields:
    repossession_date: surrender date
    repossession_type: voluntary_surrender
  triggers:
  - event: retail:retail_repo_expense
    map:
      fee_type: repossession_agency_fee
- type: retail_reinstated
  target: retail_contracts
  mutation:
    transition:
      from: repossessed
      to: active
  meaning: The contract is reinstated and the vehicle released to the customer.
  grain: one row per contract; this write changes that contract record
  fields:
    reinstatements_used: incremented by one
    repossession_date: kept as history
    next_due_date: next installment after reinstatement
  triggers: []
- type: retail_redeemed
  target: retail_contracts
  mutation:
    transition:
      from: repossessed
      to: paid_in_full
  meaning: The customer redeems the vehicle by paying the redemption amount.
  grain: one row per contract; this write changes that contract record
  fields:
    paid_in_full_date: redemption date
  triggers:
  - event: retail:retail_lien_release
    map: {}
- type: retail_repo_sale_posted
  target: retail_contracts
  mutation:
    transition:
    - from: repossessed
      to: deficiency
    - from: repossessed
      to: paid_in_full
  meaning: The auction result is posted and the contract moves to deficiency or paid in full.
  grain: one row per contract; this write changes that contract record
  fields:
    paid_in_full_date: set only when the proceeds cover the balance
  triggers: []
- type: retail_paid_in_full
  target: retail_contracts
  mutation:
    transition:
    - from: active
      to: paid_in_full
    - from: deficiency
      to: paid_in_full
  meaning: The balance reaches zero by final installment, payoff or deficiency settlement.
  grain: one row per contract; this write changes that contract record
  fields:
    paid_in_full_date: date the balance reached zero
  triggers:
  - event: retail:retail_lien_release
    map: {}
- type: retail_charged_off
  target: retail_contracts
  mutation:
    transition:
      from: deficiency
      to: charged_off
  meaning: The unpaid deficiency is charged off.
  grain: one row per contract; this write changes that contract record
  fields:
    closed_date: charge-off date
  triggers: []
- type: retail_closed
  target: retail_contracts
  mutation:
    transition:
      from: paid_in_full
      to: closed
  meaning: The account is closed after the lien release.
  grain: one row per contract; this write changes that contract record
  fields:
    closed_date: closing date
  triggers: []
- type: retail_schedule_updated
  target: retail_contracts
  mutation: update
  meaning: The payment schedule fields change after a due-date change, an extension or a reinstatement.
  grain: one row per contract; this write changes that contract record
  fields:
    due_day: new due day
    next_due_date: new next due date
    maturity_date: new maturity date
    extensions_used_lifetime: installments deferred to date
    last_extension_date: date of the latest extension
    due_date_changes_used: due-date changes to date
    last_due_date_change_date: date of the latest due-date change
  triggers: []
- type: retail_title_status_updated
  target: retail_contracts
  mutation: update
  meaning: The title status changes as a lien release is requested and completed.
  grain: one row per contract; this write changes that contract record
  fields:
    title_status: new title status
  triggers: []
- type: retail_repo_record_updated
  target: retail_contracts
  mutation: update
  meaning: Collections and recovery dates are recorded after a notice or auction scheduling.
  grain: one row per contract; this write changes that contract record
  fields:
    right_to_cure_notice_date: mailing date of the right-to-cure notice
    nois_mailed_date: mailing date of the notice of intent to sell
    scheduled_sale_date: auction date
  triggers: []
- type: retail_payment_restriction_updated
  target: retail_contracts
  mutation: update
  meaning: A certified-funds-only restriction or an autopay enrolment changes.
  grain: one row per contract; this write changes that contract record
  fields:
    certified_funds_only_until: restriction end date or empty
    autopay_enrolled: enrolment flag
  triggers: []
- type: retail_funding
  target: retail_transactions
  meaning: The amount financed is booked as principal when the dealer is funded.
  grain: one row per contract funding
  distinguish_by:
  - txn_date
  fields:
    txn_date: funding date
    amount: amount financed
  account: principal_balance
  direction: in
  triggers: []
- type: retail_payment
  target: retail_transactions
  meaning: A payment from the customer or a third party posts to the contract.
  grain: one row per payment received
  distinguish_by:
  - txn_date
  - amount
  - payment_channel
  - funding_account_last4
  - payment_purpose
  fields:
    txn_date: posting date
    amount: payment amount
    payment_channel: channel
    funding_account_last4: source account last four
    payment_purpose: purpose
    interest_applied: interest portion
    principal_applied: principal portion
    fees_applied: fees portion
    convenience_fee: channel fee
  account: principal_balance
  direction: out
  triggers:
  - event: retail:retail_reinstated
    when:
      payment_purpose: reinstatement
    map: {}
  - event: retail:retail_redeemed
    when:
      payment_purpose: redemption
    map: {}
  - event: retail:retail_paid_in_full
    when:
      payment_purpose:
      - payoff
      - deficiency
    map: {}
  - event: retail:retail_fee_payment
    when:
      fees_applied:
        not: 0.0
    map:
      amount: fees_applied
      txn_date: txn_date
      payment_txn_id: retail_txn_id
- type: retail_payment_returned
  target: retail_transactions
  meaning: A posted payment is dishonoured by the payer's bank and reversed.
  grain: one row per dishonoured payment
  distinguish_by:
  - reversed_txn_id
  fields:
    txn_date: return date
    amount: amount reversed
    reversed_txn_id: the dishonoured payment
    return_reason: bank return reason
  account: principal_balance
  direction: in
  triggers:
  - event: retail:retail_returned_payment_fee
    when:
      return_reason:
      - insufficient_funds
      - account_closed
      - stop_payment
    map:
      reversed_txn_id: reversed_txn_id
      fee_type: returned_payment_fee
- type: retail_late_charge
  target: retail_transactions
  meaning: A late charge is assessed on an installment not paid within the grace period.
  grain: one row per late installment
  distinguish_by:
  - installment_due_date
  fields:
    txn_date: assessment date
    amount: late charge
    installment_due_date: the late installment
    fee_type: late_charge
  account: fees_due
  direction: in
  triggers: []
- type: retail_returned_payment_fee
  target: retail_transactions
  meaning: A returned-payment fee is assessed for a dishonoured payment.
  grain: one row per dishonoured payment
  distinguish_by:
  - reversed_txn_id
  fields:
    txn_date: assessment date
    amount: fee
    reversed_txn_id: the dishonoured payment
    fee_type: returned_payment_fee
  account: fees_due
  direction: in
  triggers: []
- type: retail_fee_waiver
  target: retail_transactions
  meaning: An assessed fee is waived in whole.
  grain: one row per fee waived
  distinguish_by:
  - waived_txn_id
  fields:
    txn_date: waiver date
    amount: amount waived
    waived_txn_id: the fee transaction waived
    waiver_reason: reason
    fee_type: type of the fee waived
  account: fees_due
  direction: out
  triggers: []
- type: retail_fee_payment
  target: retail_transactions
  meaning: The fee portion of a payment is applied to fees due.
  grain: one row per payment that carried a fee portion
  distinguish_by:
  - payment_txn_id
  fields:
    txn_date: posting date
    amount: fee portion applied
    payment_txn_id: the payment
  account: fees_due
  direction: out
  triggers: []
- type: retail_due_date_change
  target: retail_transactions
  meaning: The monthly due day is moved.
  grain: one row per due-date change
  distinguish_by:
  - txn_date
  - new_due_day
  fields:
    txn_date: effective date
    old_due_day: previous due day
    new_due_day: new due day
    installment_due_date: first installment due on the new due day
  triggers:
  - event: retail:retail_schedule_updated
    map:
      due_day: new_due_day
      next_due_date: installment_due_date
- type: retail_extension
  target: retail_transactions
  meaning: One or more installments are deferred to the end of the term; any extension fee is booked to fees due.
  grain: one row per extension granted
  distinguish_by:
  - installment_due_date
  fields:
    txn_date: effective date
    amount: extension fee charged (0.00 when none)
    installments_deferred: installments deferred
    installment_due_date: first installment deferred
    new_maturity_date: maturity after the extension
    good_faith_amount: good-faith payment received
    fee_type: extension_fee
  account: fees_due
  direction: in
  triggers:
  - event: retail:retail_schedule_updated
    map:
      maturity_date: new_maturity_date
      last_extension_date: txn_date
- type: retail_payoff_quote
  target: retail_transactions
  meaning: A payoff quote is produced for the customer or a third party.
  grain: one row per quote issued
  distinguish_by:
  - txn_date
  - quote_purpose
  fields:
    txn_date: quote date
    amount: payoff amount as of the good-through date
    quote_good_through_date: good-through date
    per_diem: daily interest
    quote_purpose: purpose
  triggers: []
- type: retail_lien_release
  target: retail_transactions
  meaning: The company releases its lien electronically or mails the paper title.
  grain: one row per lien release
  distinguish_by:
  - release_method
  fields:
    txn_date: release date
    release_method: method
    release_recipient: recipient
    mailing_address_type: address used
  triggers:
  - event: retail:retail_title_status_updated
    when:
      release_method: electronic_lien_release
    map:
      title_status: released_electronic
  - event: retail:retail_title_status_updated
    when:
      release_method: paper_title_mailed
    map:
      title_status: released_paper_mailed
  - event: retail:retail_closed
    map: {}
- type: retail_refund_credit
  target: retail_transactions
  meaning: A cancellation refund from a financed Kestrel Care contract is credited to principal.
  grain: one row per Care contract refund
  distinguish_by:
  - care_contract_id
  fields:
    txn_date: credit date
    amount: refund credited
    care_contract_id: the cancelled Care contract
  account: principal_balance
  direction: out
  triggers: []
- type: retail_overpayment_refund
  target: retail_transactions
  meaning: A credit balance left after payoff is refunded to the payer.
  grain: one row per refund issued
  distinguish_by:
  - txn_date
  - amount
  fields:
    txn_date: refund date
    amount: refund amount
    payment_channel: refund channel
  account: principal_balance
  direction: in
  triggers: []
- type: retail_notice_mailed
  target: retail_transactions
  meaning: A right-to-cure, intent-to-sell, deficiency or surplus notice is mailed.
  grain: one row per notice mailed
  distinguish_by:
  - notice_type
  - txn_date
  fields:
    txn_date: mailing date
    notice_type: notice kind
  triggers:
  - event: retail:retail_repo_record_updated
    when:
      notice_type: right_to_cure
    map:
      right_to_cure_notice_date: txn_date
  - event: retail:retail_repo_record_updated
    when:
      notice_type: notice_of_intent_to_sell
    map:
      nois_mailed_date: txn_date
- type: retail_repo_expense
  target: retail_transactions
  meaning: A repossession, transport, storage or condition-report expense is charged to the account.
  grain: one row per expense item
  distinguish_by:
  - fee_type
  - txn_date
  fields:
    txn_date: service date
    amount: expense charged
    fee_type: expense kind
    service_days: storage days billed
  account: fees_due
  direction: in
  triggers: []
- type: retail_repo_sale
  target: retail_transactions
  meaning: The repossessed vehicle is sold at auction and the net proceeds applied.
  grain: one row per vehicle sale
  distinguish_by:
  - txn_date
  fields:
    txn_date: sale date
    amount: net proceeds applied
    gross_proceeds: gross sale price
    sale_expenses: sale expenses
  account: principal_balance
  direction: out
  triggers:
  - event: retail:retail_repo_sale_posted
    map: {}
- type: retail_personal_property_release
  target: retail_transactions
  meaning: Personal property found in a repossessed vehicle is released or disposed of.
  grain: one row per property release
  distinguish_by:
  - property_release_type
  - txn_date
  fields:
    txn_date: release date
    property_release_type: how released
    amount: shipping cost charged (0.00 when none)
  triggers: []
- type: retail_charge_off
  target: retail_transactions
  meaning: The unpaid deficiency principal is written off.
  grain: one row per charge-off
  distinguish_by:
  - txn_date
  fields:
    txn_date: charge-off date
    amount: principal written off
  account: principal_balance
  direction: out
  triggers:
  - event: retail:retail_charged_off
    map: {}
measures:
- id: retail_msr_interest_accrual_days
  window: from the day after interest_paid_to_date through the payment posting date, both inclusive
  measure: count of calendar days over which simple interest has accrued and is unpaid
- id: retail_msr_installments_due
  window: the contract as of the payment posting date
  measure: past_due_amount plus the monthly_payment of the installment due on next_due_date when that date falls
    within one month after the posting date; the amount a payment must reach before any part of it goes to fees
- id: retail_msr_quote_interest_days
  window: from the day after interest_paid_to_date through the quote good-through date (or the redemption payment
    date), both inclusive
  measure: count of calendar days of interest included in a payoff or redemption amount
- id: retail_msr_returned_payments_lookback
  window: the returned_payment_lookback_months calendar months ending on today's date, inclusive
  measure: count of retail_payment_returned transactions on the contract with txn_date in the window
- id: retail_msr_courtesy_waivers_lookback
  window: the 12 calendar months ending on today's date, inclusive
  measure: count of retail_fee_waiver transactions on the contract with waiver_reason courtesy_on_time_history and
    txn_date in the window
- id: retail_msr_consecutive_on_time
  window: installment due dates after the installment_due_date of the most recent retail_late_charge on the contract
    (or from first_payment_date when there is none) up to today
  measure: count of installment due dates in the window, i.e. installments in a row paid without a late charge
- id: retail_msr_unpaid_installment_portion
  window: the single installment identified by its due date, as of the assessment date
  measure: monthly_payment less the payment amounts applied to that installment
- id: retail_msr_remaining_installments
  window: the contract as of today
  measure: term_months plus extensions_used_lifetime minus payments_made_count
policies:
- id: retail_agg_multi_holding
  subject:
  - retail_contract_booked
  rule: A customer may hold at most max_per_customer open new-vehicle retail installment sale contracts at the same
    time. A contract counts as open in every status except paid_in_full, closed and charged_off; a contract still
    pending_funding counts. A booking that would exceed the cap is declined at funding review and is never booked;
    contracts held in other Kestrel products do not count toward this cap.
  eligibility: []
  params:
    max_per_customer: 3
- id: retail_agg_relationship_exposure
  subject:
  - retail_contract_booked
  - retail_contract_funded
  rule: Kestrel limits the total consumer credit it extends to one customer across products. Relationship exposure
    is the sum of principal_balance on every open retail, pre-owned and balloon contract of the customer, plus adjusted_lease_balance
    on every lease of the customer in active or maturity_extended status, plus the amount_financed of the contract
    being booked. Relationship exposure must not exceed the relationship_exposure_cap of the tier being booked.
    When it would, the contract is not funded; there is no partial approval and no override at the servicing desk.
    Business customers' fleet units are commercial credit and never count toward consumer relationship exposure.
  eligibility:
  - id: exposure_within_cap
    applies_to:
    - retail_contract_booked
    - retail_contract_funded
    kind: authorization
    condition: Relationship exposure must not exceed the relationship_exposure_cap of the tier being booked.
    evidence_fields:
    - retail_contracts.amount_financed
    - retail_contracts.customer_id
    - preowned_contracts.principal_balance
    - balloon_contracts.principal_balance
    - lease_contracts.adjusted_lease_balance
    - lease_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.customer_id
      action_bindings:
        retail_contracts.customer_id: customer_id
  params:
    per_tier:
      Kestrel New Vehicle Retail Tier 5:
        relationship_exposure_cap: =relationship_exposure_cap
      Kestrel New Vehicle Retail Tier 4:
        relationship_exposure_cap: =relationship_exposure_cap
      Kestrel New Vehicle Retail Tier 3:
        relationship_exposure_cap: =relationship_exposure_cap
      Kestrel New Vehicle Retail Tier 2:
        relationship_exposure_cap: =relationship_exposure_cap
      Kestrel New Vehicle Retail Tier 1:
        relationship_exposure_cap: =relationship_exposure_cap
      Kestrel New Vehicle Retail Tier 1+:
        relationship_exposure_cap: =relationship_exposure_cap
- id: retail_origination_tiering
  subject:
  - retail_contract_booked
  - retail_contract_funded
  - retail_funding
  rule: The credit tier is the tier whose min_credit_score to max_credit_score band contains the applicant's credit
    score on the credit decision; a co-applicant's score is not averaged in, the higher of the two scores is used.
    The contract APR is read from that tier's apr_rate_sheet for the term band containing term_months; a band marked
    not_offered cannot be booked on that tier. term_months must lie between min_term_months and max_term_months
    and amount_financed between min_amount_financed and max_amount_financed of the tier. The advance may not exceed
    max_ltv_pct of the vehicle's value basis, the scheduled payment may not exceed max_pti_pct of verified gross
    monthly income, and a cash or trade equity down payment of at least min_down_payment_pct of the selling price
    is required. The contract may be funded only when the dealer delivers the complete contract package no later
    than funding_window_days calendar days after the date the contract was signed. The window is counted in calendar
    days starting the day after the contract date, and delivery on the last day of the window is timely. On funding
    the amount_financed is booked to principal and servicing begins; the first installment falls due on first_payment_date.
  eligibility:
  - id: funding_window
    applies_to:
    - retail_contract_funded
    kind: time
    condition: The contract may be funded only when the dealer delivers the complete contract package no later than
      funding_window_days calendar days after the date the contract was signed.
    evidence_fields:
