  - id: retail_ext_late_posted_installment_late_charge
    base_policy_refs: [retail_late_charges]
    overwrite:
    - base_policy: retail_late_charges
      superseded_clause: >-
        The late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      replaced_by: >-
        For a late charge on an installment that no payment reached within its grace period, that a payment posted after the grace period has since satisfied and that no returned payment re-opened, and only for such a late charge, the charge is the late-posted installment late charge figured below on the installment as it stood when the grace period ended, still capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount; a late charge on an installment left unpaid past its grace period and a late charge on an installment re-opened by a returned payment follow the company's own schedules for those two cases, and any other late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount, and is not figured under this policy.
    - base_policy: retail_late_charges
      superseded_clause: >-
        No late charge is assessed when the unpaid portion is less than late_charge_min_unpaid_amount, on an installment deferred by an extension, or on an installment that was paid in full within the grace period.
      replaced_by: >-
        For an installment whose payment posted after its grace period had ended and that no returned payment re-opened, and only for such an installment, the unpaid portion compared with late_charge_min_unpaid_amount is the portion that stood when the grace period ended, so a late charge is assessed when that portion is at least late_charge_min_unpaid_amount even though a later payment has since satisfied the installment, and none is assessed on such an installment that an extension deferred; for every other installment, including one left unpaid past its grace period and one re-opened by a returned payment, no late charge is assessed when the unpaid portion as of the assessment date is less than late_charge_min_unpaid_amount, on an installment deferred by an extension, or on an installment that was paid in full within the grace period.
    trigger: state_due
    subject: [retail_late_charge]
    computes: late_charge_amount
    target_tool: assess_late_posted_installment_late_charge_04190f4f
    params:
      posted_rate_long: 3.0
      posted_rate_mid: 4.0
      posted_long_payments: 24
      posted_mid_payments: 12
      lease_payment_count: 12
      lessee_posted_points_full: 0.4
      lessee_posted_points_partial: 0.2
      care_posted_points_full: 0.5
      care_posted_points_partial: 0.25
      unchanged_points_full: 0.5
      unchanged_points_partial: 0.25
      seasoned_months: 24
      seasoned_points_prime: 0.5
      seasoned_points_other: 0.25
    rule: >-
      This policy figures the late charge owed on an installment whose payment posted after its grace period had ended, including a payment received after the cutoff on the last grace day that posted the next business day, where no late charge was booked for that installment.
      For a late charge on an installment that no payment reached within its grace period, that a payment posted after the grace period has since satisfied and that no returned payment re-opened, and only for such a late charge, the charge is the late-posted installment late charge figured below on the installment as it stood when the grace period ended, still capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount; a late charge on an installment left unpaid past its grace period and a late charge on an installment re-opened by a returned payment follow the company's own schedules for those two cases, and any other late charge is late_charge_pct_of_unpaid_installment percent of retail_msr_unpaid_installment_portion, capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount, and is not figured under this policy.
      The grace period, the status the contract must be in and the limit of one late charge per installment due date apply exactly as the base late charge rule states them.
      For an installment whose payment posted after its grace period had ended and that no returned payment re-opened, and only for such an installment, the unpaid portion compared with late_charge_min_unpaid_amount is the portion that stood when the grace period ended, so a late charge is assessed when that portion is at least late_charge_min_unpaid_amount even though a later payment has since satisfied the installment, and none is assessed on such an installment that an extension deferred; for every other installment, including one left unpaid past its grace period and one re-opened by a returned payment, no late charge is assessed when the unpaid portion as of the assessment date is less than late_charge_min_unpaid_amount, on an installment deferred by an extension, or on an installment that was paid in full within the grace period.
      Since no payment reached the installment within its grace period, the portion that stood when the grace period ended is one full monthly_payment.
      The late-posted installment late charge is late_charge_pct_of_unpaid_installment percent of one monthly_payment, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      Late-posted rate schedule: the rate starts at posted_rate_long percent when the contract shows at least posted_long_payments installments satisfied and no returned payment in the last 24 calendar months; it starts at posted_rate_mid percent when the contract shows at least posted_mid_payments installments satisfied and no more than one returned payment in the last 24 calendar months, where the first condition is not met; in every other case it starts at late_charge_pct_of_unpaid_installment percent.
      Lessee posting points: when the customer holds an active Kestrel lease and the customer's Kestrel lease ledger shows at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months, lessee_posted_points_full percentage points are taken off the late-posted rate; when the customer holds an active Kestrel lease and the lease ledger shows no more than one lease late charge in the last 12 calendar months, where the first condition is not met, lessee_posted_points_partial points are taken off; in every other case no points are taken off.
      Care holder points: when the customer holds an active Kestrel Care plan financed in this contract, care_posted_points_full percentage points are taken off the late-posted rate; when the customer holds an active Kestrel Care plan financed some other way, care_posted_points_partial points are taken off; in every other case no points are taken off.
      Unchanged-terms points: when the contract's ledger shows no extension and no due-date change, unchanged_points_full percentage points are taken off the late-posted rate; when it shows no extension but at least one due-date change, unchanged_points_partial points are taken off; in every other case no points are taken off.
      Seasoned-contract points: when at least seasoned_months whole calendar months have passed from the contract date to today and the contract is on Kestrel New Vehicle Retail Tier 1+, Kestrel New Vehicle Retail Tier 1 or Kestrel New Vehicle Retail Tier 2, seasoned_points_prime percentage points are taken off the late-posted rate; when at least seasoned_months whole months have passed on any other tier, seasoned_points_other points are taken off; in every other case no points are taken off.
      Mail-float relief: when the contract shows a payment by mailed check posted in the last 2 calendar months and the contract is not enrolled in autopay, the charge figured at the rate is halved and the result rounded down to the whole dollar; when it shows such a mailed check payment and the contract is enrolled in autopay, the charge figured at the rate is multiplied by three quarters and the result rounded down to the whole dollar; in every other case the charge figured at the rate is kept to the cent.
      The late-posted installment late charge is assembled in this order: the rate adjustments are first combined into one rate, which is applied once to one monthly_payment and rounded to the cent; any change of method is then applied to that figure; the cap is applied last, and the charge is booked to the cent and is never below zero.
      Counting conventions: whole calendar months from one date to a later one are the difference in month numbers, less one when the later date's day number is smaller than the earlier date's, with no month-end adjustment; an entry lies in the last N calendar months when its date is not after today and fewer than N whole months run from its date to today, which is the same as being dated after the same day number N months before today.
