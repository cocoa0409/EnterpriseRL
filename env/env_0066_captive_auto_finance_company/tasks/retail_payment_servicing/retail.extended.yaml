- id: retail_payoff_and_refunds
  subject:
  - retail_payoff_quote
  - retail_paid_in_full
  - retail_overpayment_refund
  - retail_refund_credit
  rule: A payoff quote can be issued only while the contract status is active, repo_assigned, repossessed or deficiency.
    The good-through date is payoff_quote_valid_days calendar days after the quote date unless the requester asks
    for an earlier date. The per diem is the principal_balance times apr divided by per_diem_day_basis, rounded
    to the cent, and the payoff amount is principal_balance plus fees_due_balance plus the per diem times retail_msr_quote_interest_days.
    Funds received on or before the good-through date in at least the quoted amount pay the contract in full; funds
    received later are applied as a payment and a new quote is needed. A quote for a refinance_lender, dealer_trade_in
    or insurance_total_loss purpose is issued to that third party only with the customer's verified authorization
    on the call. An overpayment refund can be issued only when the contract status is paid_in_full or closed. A
    credit balance of at least overpayment_refund_min_amount left after the balance reaches zero is refunded to
    the payer by check within overpayment_refund_days calendar days; a smaller credit balance is refunded only on
    request. A cancellation refund from a financed Kestrel Care contract is credited to principal_balance and does
    not advance next_due_date; when the contract is already paid_in_full or closed the refund is paid to the customer
    as an overpayment refund instead.
  eligibility:
  - id: quote_status
    applies_to:
    - retail_payoff_quote
    kind: state
    condition: A payoff quote can be issued only while the contract status is active, repo_assigned, repossessed
      or deficiency.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - active
      - repo_assigned
      - repossessed
      - deficiency
  - id: refund_status
    applies_to:
    - retail_overpayment_refund
    kind: state
    condition: An overpayment refund can be issued only when the contract status is paid_in_full or closed.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - paid_in_full
      - closed
  measures:
  - retail_msr_quote_interest_days
  formula:
    per_diem: round(principal_balance * apr / 100 / per_diem_day_basis, 2)
    amount: principal_balance + fees_due_balance + per_diem * retail_msr_quote_interest_days
  params:
    payoff_quote_valid_days: =payoff_quote_valid_days
    per_diem_day_basis: =per_diem_day_basis
    overpayment_refund_min_amount: =overpayment_refund_min_amount
    overpayment_refund_days: =overpayment_refund_days
- id: retail_lien_releases
  subject:
  - retail_lien_release
  - retail_title_status_updated
  - retail_closed
  rule: 'The lien can be released only when the contract status is paid_in_full. When the funds that brought the
    balance to zero were a personal check or an ACH debit, the lien may be released no earlier than lien_release_hold_business_days
    business days after the balance reached zero. Business days are Monday through Friday excluding US federal holidays,
    counted from the first business day after paid_in_full_date, and release on the last day of the hold is permitted.
    Payoffs by cashiers check, wire, dealer, lender or insurer remittance carry no hold. Where lien_type is elt
    the lien is released electronically to the title state within elt_release_business_days business days; where
    lien_type is paper the title is signed off and mailed within paper_title_mail_business_days business days. The
    recipient follows how the contract was paid off: a refinance_lender payoff goes to the new_lienholder, a dealer_trade_in
    payoff to the dealer, an insurance_total_loss payoff to the insurer, and every other payoff to the customer.
    A paper title may be mailed to an address other than the address on file only after the customer has completed
    a signed alternate-address title release request. Once the release is completed the title status is updated
    and the account is closed.'
  eligibility:
  - id: release_status
    applies_to:
    - retail_lien_release
    kind: state
    condition: The lien can be released only when the contract status is paid_in_full.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - paid_in_full
  - id: funds_hold
    applies_to:
    - retail_lien_release
    kind: time
    condition: When the funds that brought the balance to zero were a personal check or an ACH debit, the lien may
      be released no earlier than lien_release_hold_business_days business days after the balance reached zero.
    evidence_fields:
    - retail_contracts.paid_in_full_date
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the balance reached zero
      anchor_source: retail_contracts.paid_in_full_date
      relation: not_before
      duration_source: variants.lien_release_hold_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding US federal holidays, counted from the first
        business day after paid_in_full_date, and release on the last day of the hold is permitted.
      boundary: inclusive
  - id: alt_address_signed
    applies_to:
    - retail_lien_release
    kind: authorization
    condition: A paper title may be mailed to an address other than the address on file only after the customer
      has completed a signed alternate-address title release request.
    evidence_fields:
    - retail_requests.request_status
    - retail_requests.request_type
    - retail_requests.alternate_address
    - retail_requests.retail_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_requests.retail_request_id
      action_bindings:
        retail_requests.retail_request_id: retail_request_id
  params:
    lien_release_hold_business_days: =lien_release_hold_business_days
    elt_release_business_days: =elt_release_business_days
    paper_title_mail_business_days: =paper_title_mail_business_days
- id: retail_repossession_assignment
  subject:
  - retail_repo_assigned
  - retail_repo_recalled
  - retail_vehicle_recovered
  - retail_voluntary_surrender
  - retail_notice_mailed
  - retail_repo_record_updated
  rule: An account may be assigned for repossession only when days_past_due is at least repo_assignment_min_days_past_due
    for the tier. Where the contract records right_to_cure_days greater than 0, assignment may occur only after
    a right-to-cure notice has been mailed and right_to_cure_days calendar days have run from right_to_cure_notice_date.
    While the account is repo_assigned, the assignment is recalled when the customer pays all past-due installments
    and all late charges due in certified funds before the vehicle is recovered; a partial payment or a promise
    to pay does not recall it. A customer may voluntarily surrender the vehicle at any time while the contract is
    active; the surrender is the customer's own act, scheduled at a location the company designates, and the voluntary
    agency fee applies instead of the involuntary fee. A notice can be mailed only while the contract status is
    active, repo_assigned, repossessed, deficiency or paid_in_full. The notice of intent to sell is mailed within
    nois_mail_business_days business days after the repossession date and states the scheduled sale date and the
    redemption and any reinstatement amount. A deficiency notice is mailed after a sale that leaves a balance and
    a surplus notice after a sale that leaves a surplus; mailing dates are recorded on the contract. When the customer
    reports an active bankruptcy filing, or bankruptcy_status on the profile is not none, no collection or repossession
    step is taken by the servicing desk.
  eligibility:
  - id: repo_dpd
    applies_to:
    - retail_repo_assigned
    kind: authorization
    condition: An account may be assigned for repossession only when days_past_due is at least repo_assignment_min_days_past_due
      for the tier.
    evidence_fields:
    - retail_contracts.days_past_due
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
  - id: right_to_cure
    applies_to:
    - retail_repo_assigned
    kind: authorization
    condition: Where the contract records right_to_cure_days greater than 0, assignment may occur only after a right-to-cure
      notice has been mailed and right_to_cure_days calendar days have run from right_to_cure_notice_date.
    evidence_fields:
    - retail_contracts.right_to_cure_days
    - retail_contracts.right_to_cure_notice_date
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
  - id: notice_status
    applies_to:
    - retail_notice_mailed
    kind: state
    condition: A notice can be mailed only while the contract status is active, repo_assigned, repossessed, deficiency
      or paid_in_full.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - active
      - repo_assigned
      - repossessed
      - deficiency
      - paid_in_full
  params:
    per_tier:
      Kestrel New Vehicle Retail Tier 5:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel New Vehicle Retail Tier 4:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel New Vehicle Retail Tier 3:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel New Vehicle Retail Tier 2:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel New Vehicle Retail Tier 1:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
      Kestrel New Vehicle Retail Tier 1+:
        repo_assignment_min_days_past_due: =repo_assignment_min_days_past_due
    nois_mail_business_days: =nois_mail_business_days
- id: retail_repossession_charges
  subject:
  - retail_repo_expense
  - retail_personal_property_release
  rule: A repossession expense can be charged only while the contract status is repo_assigned or repossessed. The
    agency fee is repo_agency_fee_involuntary for an involuntary recovery and repo_agency_fee_voluntary for a voluntary
    surrender; a transport fee of repo_transport_fee applies only to an involuntary recovery; a condition report
    fee of condition_report_fee is charged once per repossession. Storage is charged at storage_daily_fee for each
    day the vehicle is stored beyond storage_free_days, counting from repossession_date to the release or sale date,
    and is billed when the vehicle leaves the lot. Personal property found in the vehicle is inventoried and held
    free of charge; the customer may collect it in person or have it shipped at the carrier's cost. Personal property
    may be disposed of only after personal_property_hold_days have fully elapsed from the date the vehicle was repossessed.
    The hold is counted in calendar days starting the day after repossession_date; disposal is permitted from the
    calendar day after repossession_date plus personal_property_hold_days. Expenses are booked to fees due and become
    part of any reinstatement, redemption or deficiency amount.
  eligibility:
  - id: expense_status
    applies_to:
    - retail_repo_expense
    kind: state
    condition: A repossession expense can be charged only while the contract status is repo_assigned or repossessed.
    evidence_fields:
    - retail_contracts.status
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - repo_assigned
      - repossessed
  - id: property_hold
    applies_to:
    - retail_personal_property_release
    kind: time
    condition: Personal property may be disposed of only after personal_property_hold_days have fully elapsed from
      the date the vehicle was repossessed.
    evidence_fields:
    - retail_contracts.repossession_date
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was repossessed
      anchor_source: retail_contracts.repossession_date
      relation: not_before
      duration_source: variants.personal_property_hold_days
      unit: calendar_days
      counting_rule: The hold is counted in calendar days starting the day after repossession_date; disposal is
        permitted from the calendar day after repossession_date plus personal_property_hold_days.
      boundary: exclusive
  formula:
    storage_fee: storage_daily_fee * max(0, service_days - storage_free_days)
  params:
    repo_agency_fee_involuntary: =repo_agency_fee_involuntary
    repo_agency_fee_voluntary: =repo_agency_fee_voluntary
    repo_transport_fee: =repo_transport_fee
    condition_report_fee: =condition_report_fee
    storage_daily_fee: =storage_daily_fee
    storage_free_days: =storage_free_days
    personal_property_hold_days: =personal_property_hold_days
- id: retail_reinstatement_and_redemption
  subject:
  - retail_reinstated
  - retail_redeemed
  - retail_payment
  rule: After repossession and until the sale, the customer may get the vehicle back either by reinstating the contract
    or by redeeming the vehicle. A reinstatement must be completed no later than reinstatement_company_window_days
    after the vehicle was repossessed and before scheduled_sale_date. The window is counted in calendar days starting
    the day after repossession_date and completion on the last day is timely; where the contract records a state_reinstatement_days
    longer than the company window, that longer period is used in place of reinstatement_company_window_days in
    the same count. The contract must show reinstatements_used below reinstatement_max_per_contract for the tier,
    unless the contract records state_reinstatement_days greater than 0. The company does not offer a discretionary
    reinstatement while another Kestrel contract or lease of the customer shows days_past_due of reinstatement_relationship_dpd_limit
    or more; a reinstatement the contract's recorded state_reinstatement_days grants is still offered. The reinstatement
    amount is past_due_amount plus fees_due_balance, which includes late charges and every repossession expense
    booked; storage is billed up to the reinstatement date before the amount is stated. The redemption amount is
    principal_balance plus fees_due_balance plus accrued interest for retail_msr_quote_interest_days at the per
    diem; redemption is available at any time before the sale regardless of prior reinstatements. Reinstatement
    and redemption funds are accepted only as cashiers_check, wire or moneygram; once the funds post the vehicle
    is released and, for a reinstatement, the original schedule resumes with next_due_date set to the next installment.
  eligibility:
  - id: reinstatement_window
    applies_to:
    - retail_reinstated
    kind: time
    condition: A reinstatement must be completed no later than reinstatement_company_window_days after the vehicle
      was repossessed and before scheduled_sale_date.
    evidence_fields:
    - retail_contracts.repossession_date
    - retail_contracts.scheduled_sale_date
    - retail_contracts.state_reinstatement_days
    - retail_contracts.retail_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was repossessed
      anchor_source: retail_contracts.repossession_date
      relation: not_after
      duration_source: variants.reinstatement_company_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days starting the day after repossession_date and completion
