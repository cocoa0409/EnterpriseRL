      schedule_points: "Clean-schedule points: when the contract's ledger shows no extension and no due-date change, schedule_points_full percentage points are taken off the unpaid installment rate; when it shows no extension but at least one due-date change, schedule_points_partial points are taken off; in every other case no points are taken off."
      care_points: "Care plan points: when the customer holds an active Kestrel Care plan financed in this contract, care_points_full percentage points are taken off the unpaid installment rate; when the customer holds an active Kestrel Care plan financed some other way, care_points_partial points are taken off; in every other case no points are taken off."
      combined_rate: "the rate adjustments are first combined into one rate, which is applied once to the unpaid installment portion and rounded to the cent"
      rate_figure: "The unpaid installment late charge is late_charge_pct_of_unpaid_installment percent of the unpaid installment portion, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount."
      days_beyond_grace: "the days beyond grace are the calendar days from the contract's next_due_date to today less late_charge_grace_days"
      graduated_mode: "Graduated charge: the days beyond grace are the calendar days from the contract's next_due_date to today less late_charge_grace_days"
      graduated_figure: "when the days beyond grace are from 1 through graduated_short_days, the charge figured at the rate is halved and the result rounded down to the whole dollar; when they are from graduated_short_days plus 1 through graduated_mid_days, the charge figured at the rate is multiplied by three quarters and the result rounded down to the whole dollar; in every other case the charge figured at the rate is kept to the cent."
      result: "any change of method is then applied to that figure; the cap is applied last, and the charge is booked to the cent and is never below zero."
    factors:
    - id: ucf_unpaid_rate
      effect: parameter
      decides: unpaid_rate
      bindings: [returned_24, unpaid_rate]
      ladder:
      - when: "at least unpaid_long_payments installments satisfied and no returned payment in the last 24 calendar months"
        value: "K('unpaid_rate_long')"
      - when: "at least unpaid_mid_payments installments satisfied and no more than one returned payment in the last 24 calendar months, the first condition not met"
        value: "K('unpaid_rate_mid')"
      - when: "otherwise"
        value: "P('late_charge_pct_of_unpaid_installment')"
      baseline:
        unpaid_rate: "P('late_charge_pct_of_unpaid_installment')"
      evidence: [history, tier_param]
      cross_difficulty: null
    - id: ucf_lessee_points
      effect: parameter
      decides: lessee_rate_points
      bindings: [lease_active, lease_payments_12, lease_late_12, lessee_rate_points]
      ladder:
      - when: "an active Kestrel lease and at least lease_payment_count lease payments and no lease late charge in the last 12 calendar months"
        value: "K('lessee_rate_points_full')"
      - when: "an active Kestrel lease and no more than one lease late charge in the last 12 calendar months, the first condition not met"
        value: "K('lessee_rate_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        lessee_rate_points: "0"
      evidence: [cross_category, history]
      cross_difficulty: lease
    - id: ucf_partial_effort
      effect: parameter
      decides: effort_points
      bindings: [recent_payments, effort_points]
      ladder:
      - when: "recent payments of at least half of one monthly_payment"
        value: "K('effort_points_full')"
      - when: "recent payments above zero but below half of one monthly_payment"
        value: "K('effort_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        effort_points: "0"
      evidence: [history]
      cross_difficulty: null
    - id: ucf_clean_schedule
      effect: parameter
      decides: schedule_points
      bindings: [ext_entries, due_change_entries, schedule_points]
      ladder:
      - when: "the ledger shows no extension and no due-date change"
        value: "K('schedule_points_full')"
      - when: "the ledger shows no extension but at least one due-date change"
        value: "K('schedule_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        schedule_points: "0"
      evidence: [history]
      cross_difficulty: null
    - id: ucf_care_plan
      effect: parameter
      decides: care_points
      bindings: [care_points]
      ladder:
      - when: "an active Kestrel Care plan financed in this contract"
        value: "K('care_points_full')"
      - when: "an active Kestrel Care plan financed some other way"
        value: "K('care_points_partial')"
      - when: "otherwise"
        value: "0"
      baseline:
        care_points: "0"
      evidence: [cross_category]
      cross_difficulty: null
    - id: ucf_graduated
      effect: method
      decides: graduated_mode
      bindings: [days_beyond_grace, graduated_mode]
      ladder:
      - when: "days beyond grace from 1 through graduated_short_days"
        method: "the charge figured at the rate is halved and rounded down to the whole dollar"
      - when: "days beyond grace from graduated_short_days plus 1 through graduated_mid_days"
        method: "the charge figured at the rate is multiplied by three quarters and rounded down to the whole dollar"
      - when: "otherwise"
        method: "the charge figured at the rate is kept to the cent"
      baseline:
        graduated_mode: "0"
      evidence: [date]
      cross_difficulty: null
    baseline:
      rule: >-
        The unpaid installment portion is the unpaid portion, as of the assessment date, of the installment the contract's next due date shows: payments reach the oldest installment first, so every later past-due installment is wholly unpaid, and the unpaid installment portion is the past_due_amount less one monthly_payment for each whole monthly_payment contained in the past_due_amount less one cent, rounded to the cent.
        The unpaid installment late charge is late_charge_pct_of_unpaid_installment percent of the unpaid installment portion, rounded to the cent, and that figure is capped at the lower of late_charge_company_max and the contract's recorded late_charge_max_amount.
      params: [late_charge_pct_of_unpaid_installment, late_charge_company_max]
    inputs:
      history:
      - {table: retail_transactions, aggregate: count, field: retail_txn_id, within_months: 24, filters: {event_type: retail_payment_returned}}
      - {table: retail_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: retail_payment}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_payment}}
      - {category: lease, table: lease_transactions, aggregate: count, field: lease_txn_id, within_months: 12, filters: {event_type: lease_late_charge}}
