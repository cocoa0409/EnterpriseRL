    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_contracts.retail_contract_id
      action_bindings:
        retail_contracts.retail_contract_id: retail_contract_id
    state_contract:
      field: retail_contracts.status
      allowed:
      - active
      - repo_assigned
      - repossessed
      - deficiency
  - id: waive_once
    applies_to:
    - retail_fee_waiver
    kind: dedup
    condition: A fee transaction may be waived only once.
    evidence_fields:
    - retail_transactions.waived_txn_id
    - retail_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_transactions.waived_txn_id
      action_bindings:
        retail_transactions.waived_txn_id: waived_txn_id
