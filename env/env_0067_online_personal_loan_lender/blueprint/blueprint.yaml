name: env_0067_online_personal_loan_lender
company: Larkspur Lending

background: |
  Larkspur Lending is a US online consumer lender, licensed state by state, that makes and services unsecured personal
  credit entirely through its website, mobile app and a phone-based customer care team; it serves about 410,000 borrowers
  and speaks to them in a plain, practical tone. Its core product line, Personal Loans, consists of fixed-rate,
  simple-interest installment loans with terms of 24 to 72 months, priced in seven rate grades: Personal Loan Grade A,
  Personal Loan Grade B, Personal Loan Grade C, Personal Loan Grade D, Personal Loan Grade E, Personal Loan Grade F and
  Personal Loan Grade G. Each loan is booked as a running account: disbursements at funding, monthly payments split
  between interest and principal, returned payments, late and returned-payment fees, fee waivers, due-date and AutoPay
  changes and payoff quotes. Borrowers who hit a rough patch can be placed in the Hardship Assistance Programs - Short-Term
  Payment Deferral, Reduced Payment Plan, Temporary Rate Reduction Plan, Term Extension Modification, Disaster Relief
  Deferral, Servicemember Rate Cap Benefit and Charged-Off Settlement Plan - each held as its own plan on one loan with a
  record of documents, deferred installments, plan installments and credited payments. Through enrolled dental,
  orthodontic, veterinary, vision, hearing, dermatology, cosmetic and fertility practices Larkspur offers PracticePay
  Patient Financing: the PracticePay 6-Month Deferred Interest Plan, PracticePay 6-Month No Interest Plan, PracticePay
  12-Month Deferred Interest Plan, PracticePay 12-Month No Interest Plan, PracticePay 24-Month Reduced APR Plan,
  PracticePay 48-Month Reduced APR Plan and PracticePay 60-Month Extended Plan, each a closed-end plan that books the
  treatment charge, provider refunds, payments, fees, interest and deferred interest. FlexLine Personal Lines of Credit
  come as FlexLine Starter, FlexLine Standard, FlexLine Plus, FlexLine Preferred, FlexLine Premier and FlexLine Elite,
  variable-rate lines that book draws, draw fees, monthly interest, annual fees, payments and fees, and that keep a record
  of credit-limit requests. Credit Builder Accounts - the Credit Builder 600 Plan, Credit Builder 1000 Plan, Credit
  Builder 1200 Plan, Credit Builder 1800 Plan, Credit Builder 2400 Plan and Credit Builder 3000 Plan - pair a small loan
  with a locked savings certificate that is released as the loan is repaid, and keep a record of early-closure requests.
  Borrowers can add Payment Protection to a personal loan as Payment Protection Life, Payment Protection Life and
  Disability, Payment Protection Complete, Joint Payment Protection Life, Joint Payment Protection Life and Disability or
  Joint Payment Protection Complete, which books monthly fees, refunds and benefits paid to the loan and keeps a record of
  claims. Larkspur Credit Cards round out the line-up: the Larkspur Secured Visa, Larkspur Classic Visa, Larkspur Cash
  Back Visa, Larkspur Balance Transfer Visa Platinum, Larkspur Cash Back Visa Signature and Larkspur Travel Rewards Visa
  Signature, which book purchases, merchant credits, cash advances, balance transfers, interest, fees, payments and cash
  back. Customers link checking or savings accounts that Larkspur uses for disbursements, AutoPay and one-time payments.
  The typical caller is a working adult in their 30s to 50s with one personal loan, often used to consolidate credit card
  debt, and frequently a second product such as a PracticePay plan, a FlexLine or a card. Callers bring months or years of
  history: on-time and late payments, AutoPay debits that bounced, fees charged and waived, earlier due-date changes,
  hardship plans that were completed or broken, and refunds or disputes from a provider.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: agent_handoffs

difficulties:
  - name: personal_loan_servicing
    claim:
      categories: [loan]
      event_types: [loan_application_submitted, loan_payment_posted, loan_payment_returned, loan_fee_paid, loan_fee_payment_reversed, loan_late_fee_assessed, loan_returned_payment_fee_assessed, loan_fee_waived, loan_due_date_change_recorded, loan_payment_schedule_updated, loan_autopay_enrolled, loan_autopay_cancelled, loan_autopay_terms_updated, loan_payoff_quote_issued, loan_paid_off, loan_account_status_updated]
    summary: >
      Borrowers call about the day-to-day running of their Personal Loans across all seven rate grades: making or
      disputing a payment, a returned AutoPay debit and the fee it triggered, a late fee they want waived, moving their due
      date, turning AutoPay on or off and what it does to their rate, a payoff quote for paying off early or for another
      lender, or replacing the loan with a Larkspur refinance; the setting varies by grade, by the state the loan was
      originated in, by whether the loan is current or past due, by a second loan in the portfolio, by an open hardship
      plan or Payment Protection benefit on the loan, and by the loan's history of on-time payments, earlier waivers,
      earlier due-date changes and returned debits. The records involved are the loan itself (grade, rates, due day, next
      due date, balances, amount past due, AutoPay account), its ledger of disbursements, payments, returns, fees, fee
      payments and waivers, its servicing records and payoff quotes, the customer's linked bank accounts and any hardship
      plan on the loan; the governing rules are loan_evt_payment_application for interest accrual and allocation,
      loan_evt_late_fee and loan_evt_returned_payment for fees under the state fee schedules, loan_evt_fee_waiver for
      waiver bases and the per-grade courtesy allowance, loan_evt_due_date_change, loan_evt_autopay, loan_evt_payoff_quote,
      loan_evt_payoff_and_closure and loan_evt_refinance with its seasoning and on-time requirements, while
      loan_agg_multi_holding, loan_agg_combined_exposure and loan_cmb_hardship_and_benefits bring the portfolio and other
      products into the decision. In the natural course of a loan, payments post and fees are assessed or waived against
      specific ledger lines, servicing changes update the schedule, and a payoff or refinance closes the loan. The agent
      verifies identity, reads the loan and its ledger, and books payments, fees, waivers, due-date changes, quotes and
      AutoPay changes as service actions, while authorizing a new recurring debit, consenting to a refinance offer or
      e-signing new terms is something only the borrower can do and is handed to the borrower. Requests no rule decides -
      refunding a fee that was already paid, re-pricing or re-grading a loan, cancelling a funded loan, or accepting a
      payment method Larkspur does not take - go to a human representative as POLICY_NOT_COVERED.

  - name: hardship_assistance_plans
    claim:
      categories: [hardship]
      event_types: [hardship_plan_requested, hardship_plan_offered, hardship_plan_declined, hardship_benefit_applied, hardship_plan_accepted, hardship_plan_cancelled, hardship_document_received, hardship_installment_deferred, hardship_plan_installment_scheduled, hardship_plan_end_date_set]
    summary: >
      Borrowers with a Larkspur personal loan call when something has gone wrong - a lost job, cut hours, a medical bill,
      a death or divorce in the household, a federally declared disaster, a call to military service, or a loan already
      charged off - and ask what help they can get, why an earlier request was declined, or how to leave a plan; the
      setting varies by program, by the loan's grade, status, days past due and seasoning, by the documents already on
      file, by earlier deferrals, completed, broken or cancelled plans on the same loan, and by a second loan that may
      also be in trouble. The records involved are the hardship plan (program, reason, dates, baseline installment, rate
      and balance, plan terms, declaration number, service start date), its history of documents, deferred installments,
      plan installments and credited loan payments, and the loan the plan sits on; the governing rules are
      hardship_program_eligibility and hardship_evt_documents_and_decision for entry and decisions,
      hardship_agg_multi_holding and hardship_agg_relief_limits for the limits across plans on a loan,
      hardship_evt_offer_terms for computing terms, hardship_evt_acceptance, hardship_evt_plan_installments and
      hardship_evt_deferral for running a plan, hardship_scra_benefit, hardship_disaster_relief and hardship_settlement for
      the special programs, and hardship_evt_fee_relief_and_exit for the fee and exit consequences. Naturally a request is
      recorded, its documents arrive, it is decided and either applied directly or offered, and once active the plan
      defers installments or schedules plan installments until it completes, breaks or is cancelled, changing the loan's
      terms along the way. The agent records requests and documents, decides and offers terms, applies benefits that need
      no acceptance and records the deferrals and plan installments, while accepting and e-signing offered terms or
      turning an offer down or leaving a plan is the borrower's own decision and is handed to the borrower. Requests no
      program covers - relief on a PracticePay plan, FlexLine or card, a settlement on a loan that is not charged off,
      forgiving principal outside a settlement, or terms outside a program's limits - go to a human representative as
      POLICY_NOT_COVERED.

  - name: practicepay_patient_financing
    claim:
      categories: [pos]
      event_types: [pos_payment_posted, pos_payment_returned, pos_late_fee_assessed, pos_returned_payment_fee_assessed, pos_fee_waived, pos_deferred_interest_billed, pos_deferred_interest_cleared, pos_plan_terms_updated, pos_plan_paid_off, pos_account_status_updated]
    summary: >
      Patients and responsible parties call about PracticePay plans opened at their dentist, orthodontist, veterinarian or
      other enrolled provider: how much they must pay to avoid deferred interest, why deferred interest was billed, why a
      provider refund did not cover this month's payment, a late or returned-payment fee, a disputed treatment charge, or
      paying the plan off; the setting varies by plan (deferred interest, no interest, reduced APR or extended), by where
      the plan is in its promotional period, by provider refunds and open or resolved billing disputes, by several open
      plans at once and by the customer's standing on a personal loan. The records involved are the plan (provider,
      purchase date, financed amount, promotional end date, monthly payment, balance, deferred interest memo, amount past
      due), its ledger of the financed charge, refunds, payments, returns, fees, waivers, interest and deferred interest,
      the provider record and the billing disputes; the governing rules are pos_plan_terms_and_interest,
      pos_deferred_interest with its payoff test, pos_evt_payments_and_fees, pos_evt_fee_waiver, pos_evt_provider_refunds,
      pos_evt_billing_disputes and pos_evt_closure_and_charge_off, with pos_agg_multi_holding and pos_agg_combined_exposure
      covering several plans and other Larkspur credit. In the natural course of a plan the treatment charge is financed,
      monthly payments and statement interest or deferred-interest accruals post, refunds and disputes adjust what is
      owed, and at the end of the promotion the deferred interest is either forgiven or billed. The agent posts payments,
      assesses or waives fees, records billing disputes, updates AutoPay and the due day and settles deferred interest at
      the end of the promotion, while a refund can come only from the provider and a dispute is raised on the patient's own
      word about their treatment. Requests no rule decides - a provider's refusal to refund over quality of care, moving a
      balance to a different plan, or extending a promotional period - go to a human representative as POLICY_NOT_COVERED.

  - name: flexline_credit_line
    claim:
      categories: [line]
      event_types: [line_draw_posted, line_draw_fee_assessed, line_payment_posted, line_payment_returned, line_late_fee_assessed, line_returned_payment_fee_assessed, line_fee_waived, line_unfrozen, line_limit_changed, line_closed_to_draws, line_closed, line_terms_updated, line_account_status_updated]
    summary: >
      FlexLine borrowers call to draw money to their bank account, ask why a draw was refused or the line is frozen, raise
      or lower their limit, question an annual fee, draw fee, late fee or returned-payment fee, change AutoPay or the due
      day, or close the line; the setting varies by tier, by whether the line is active, frozen, in repayment or closed, by
      the balance against the limit, by draws already made that day and cycle, by a recent returned payment, by the
      line's age and on-time history, and by the customer's personal loans counted against the combined unsecured cap.
      The records involved are the line (tier, limit, APR, draw period end, balance, minimum payment, next due date, amount
      past due, freeze reason), its ledger of draws, draw fees, interest, annual fees, payments, returns, fees and waivers,
      its credit-limit requests and the customer's linked bank accounts; the governing rules are line_evt_draws,
      line_evt_interest_and_annual_fee, line_evt_payments_and_fees, line_evt_fee_waiver, line_evt_freeze,
      line_evt_limit_changes, line_evt_draw_period_and_closure and line_evt_autopay_and_due_day, with
      line_agg_multi_holding and line_application_underwriting bounding the relationship with other Larkspur credit. In
      the natural course of a line, draws and their fees post during the draw period, statements charge interest and set
      the minimum payment, payments and returns move the balance, freezes come and go with delinquency, and the line ends
      in repayment and closure. The agent books draws, payments, fee assessments and waivers, lifts freezes whose
      conditions are met, records limit requests and applies their outcomes, and updates AutoPay and the due day, while
      closing the line is the borrower's own decision and is handed to the borrower. Requests no rule decides - moving to
      a different tier, a draw above the available credit, converting the balance into an installment loan, or lifting a
      fraud-review freeze - go to a human representative as POLICY_NOT_COVERED.

  - name: credit_builder_accounts
    claim:
      categories: [builder]
      event_types: [builder_payment_posted, builder_payment_returned, builder_fee_paid, builder_late_fee_assessed, builder_returned_payment_fee_assessed, builder_fee_waived, builder_terms_updated, builder_closed_early, builder_savings_applied_to_loan, builder_loan_satisfied_from_savings, builder_savings_released, builder_account_status_updated]
    summary: >
      Credit Builder customers, often people with thin or damaged credit, call about payments that build their history,
      a late or returned-payment fee, changing AutoPay or their due day, when their locked savings will be released, or
      closing the account early to get their money now; the setting varies by plan size and term, by how far into the term
      the account is, by the savings balance against what is still owed, by a missed or returned payment, by earlier fee
      waivers, by a pending or lapsed closure request, and by other Larkspur credit that may be charged off. The records
      involved are the account (plan, loan amount, APR, monthly payment, due day, loan balance, savings balance, unpaid
      fees, amount past due, linked account, maturity date), its ledger of the loan deposit, administration fee, payments,
      returns, fees, waivers, fee payments, dividends, savings applied at closing and releases, and its early-closure
      requests; the governing rules are builder_evt_payments, builder_evt_late_and_returned_fees, builder_evt_fee_waiver,
      builder_evt_savings, builder_evt_closing_and_release and builder_evt_early_closure_request, with
      builder_agg_multi_holding and builder_application_and_activation setting who can hold an account. In the natural
      course of an account, payments repay the loan month by month while the certificate earns dividends, and at maturity,
      early closure or delinquency closure the savings first settle what is owed and the rest is released. The agent posts
      payments, assesses or waives fees, updates AutoPay and the due day, registers early-closure requests and, once
      closure is confirmed, applies savings and releases the remainder, while confirming the early closure of their own
      savings is the borrower's decision and is handed to the borrower. Requests no rule decides - withdrawing savings
      while the account stays open, pausing payments for hardship, switching to a different plan size, or refunding the
      administration fee on an active account - go to a human representative as POLICY_NOT_COVERED.
