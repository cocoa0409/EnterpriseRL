# ---- data flow (every write is an event) ----
events:
  - type: card_application_submitted
    target: card_accounts
    mutation: create
    meaning: A customer applies for a Larkspur credit card.
    grain: One row per application.
    fields:
      customer_id: Applicant.
      variant_name: Card applied for.
      application_date: Date applied.
      security_deposit_amount: Deposit offered, for the secured card.
    triggers: []
  - type: card_account_opened
    target: card_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: The account opens.
    grain: One row per transaction.
    fields:
      open_date: Date opened.
      card_last4: Card number last four.
      credit_limit: Limit.
      purchase_apr: Purchase APR at opening.
      statement_closing_day: Statement closing day.
      payment_due_day: Payment due day.
      card_balance: 0.00 at opening.
      rewards_balance: 0.00 at opening.
    triggers: []
  - type: card_application_declined
    target: card_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: The application is declined.
    grain: One row per transaction.
    fields:
      status: Set to declined.
    triggers: []
  - type: card_account_suspended
    target: card_accounts
    mutation: {transition: {from: active, to: suspended}}
    meaning: Charging privileges are suspended.
    grain: One row per transaction.
    fields:
      status: Set to suspended.
    triggers: []
  - type: card_account_reinstated
    target: card_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: Charging privileges are restored.
    grain: One row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: card_account_closed
    target: card_accounts
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The account is closed to new transactions.
    grain: One row per transaction.
    fields:
      closed_date: Date closed.
      closure_reason: Why.
    triggers: []
  - type: card_account_charged_off
    target: card_accounts
    mutation: {transition: [{from: active, to: charged_off}, {from: suspended, to: charged_off}]}
    meaning: The account is charged off for delinquency.
    grain: One row per transaction.
    fields:
      closed_date: Date charged off.
      closure_reason: Set to charged_off.
    triggers: []
  - type: card_limit_changed
    target: card_accounts
    mutation: update
    meaning: The credit limit changes.
    grain: One row per transaction.
    fields:
      credit_limit: New limit.
    triggers: []
  - type: card_product_changed
    target: card_accounts
    mutation: update
    meaning: A secured card graduates to the Larkspur Classic Visa and the deposit is returned.
    grain: One row per transaction.
    fields:
      variant_name: New card product.
      security_deposit_amount: 0.00 after graduation.
    triggers: []
  - type: card_terms_updated
    target: card_accounts
    mutation: update
    meaning: The APR in force, the penalty APR flag, AutoPay or the due day changes.
    grain: One row per transaction.
    fields:
      purchase_apr: Purchase APR in force.
      penalty_apr_applied: Whether the penalty APR applies.
      autopay_enrolled: AutoPay on or off.
      payment_due_day: Due day.
    triggers: []
  - type: card_account_status_updated
    target: card_accounts
    mutation: update
    meaning: Balance, rewards and payment fields are refreshed after a ledger line posts or a statement closes.
    grain: One row per transaction.
    fields:
      card_balance: Amount owed.
      rewards_balance: Unredeemed rewards.
      minimum_payment_due: Minimum payment due.
      next_due_date: Payment due date.
      amount_past_due: Amount past due.
    triggers: []
  - type: card_purchase_posted
    target: card_transactions
    meaning: A purchase posts to the card.
    grain: One row per purchase.
    distinguish_by: [txn_date, merchant_name, amount]
    fields:
      txn_date: Posting date.
      amount: Purchase amount.
      merchant_name: Merchant descriptor.
      merchant_category: Rewards category.
      promo_code: Introductory offer it posted under, or NONE.
    account: card_balance
    direction: in
    triggers:
      - event: card:card_rewards_earned
        map: {related_txn_id: card_txn_id, txn_date: txn_date}
      - event: card:card_foreign_transaction_fee_assessed
        when: {merchant_category: foreign}
        map: {related_txn_id: card_txn_id, txn_date: txn_date}
      - event: card:card_account_status_updated
        map: {}
  - type: card_merchant_credit_posted
    target: card_transactions
    meaning: A merchant refund or credit posts against a purchase.
    grain: One row per merchant credit.
    distinguish_by: [related_txn_id, txn_date, amount]
    fields:
      txn_date: Posting date.
      amount: Credit amount.
      merchant_name: Merchant descriptor.
      related_txn_id: Purchase credited.
    account: card_balance
    direction: out
    triggers:
      - event: card:card_rewards_adjusted
        map: {related_txn_id: card_txn_id, txn_date: txn_date}
      - event: card:card_account_status_updated
        map: {}
  - type: card_cash_advance_posted
    target: card_transactions
    meaning: A cash advance posts.
    grain: One row per cash advance.
    distinguish_by: [txn_date, amount]
    fields:
      txn_date: Posting date.
      amount: Advance amount.
    account: card_balance
    direction: in
    triggers:
      - event: card:card_account_status_updated
        map: {}
  - type: card_balance_transfer_posted
    target: card_transactions
    meaning: A balance transfer from another creditor posts.
    grain: One row per transfer.
    distinguish_by: [txn_date, merchant_name, amount]
    fields:
      txn_date: Posting date.
      amount: Transfer amount.
      merchant_name: Creditor paid.
      promo_code: BT_INTRO when it posted under the introductory offer, NONE otherwise.
    account: card_balance
    direction: in
    triggers:
      - event: card:card_account_status_updated
        map: {}
  - type: card_interest_charged
    target: card_transactions
    meaning: Interest for one billing cycle is charged at statement closing.
    grain: One row per billing cycle.
    distinguish_by: [statement_month]
    fields:
      txn_date: Statement closing date.
      amount: Interest.
      statement_month: Billing cycle.
    account: card_balance
    direction: in
    triggers: []
  - type: card_annual_fee_assessed
    target: card_transactions
    meaning: The annual fee posts in the anniversary billing cycle.
    grain: One row per account year.
    distinguish_by: [statement_month]
    fields:
      txn_date: Posting date.
      amount: Annual fee.
      statement_month: Billing cycle.
    account: card_balance
    direction: in
    triggers: []
  - type: card_late_fee_assessed
    target: card_transactions
    meaning: A late fee posts because the minimum payment was not received by the due date.
    grain: One row per payment due date.
    distinguish_by: [installment_due_date]
    fields:
      txn_date: Posting date.
      amount: Late fee.
      installment_due_date: Due date missed.
    account: card_balance
    direction: in
    triggers: []
  - type: card_returned_payment_fee_assessed
    target: card_transactions
    meaning: A returned-payment fee posts for one returned payment.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Posting date.
      amount: Fee.
      related_txn_id: The return line.
    account: card_balance
    direction: in
    triggers: []
  - type: card_foreign_transaction_fee_assessed
    target: card_transactions
    meaning: A foreign transaction fee posts for one foreign purchase.
    grain: One row per foreign purchase.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Posting date.
      amount: Fee.
      related_txn_id: The foreign purchase.
    account: card_balance
    direction: in
    triggers: []
  - type: card_fee_reversed
    target: card_transactions
    meaning: A fee is reversed.
    grain: One row per fee reversed.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Reversal date.
      amount: Amount reversed.
      related_txn_id: Fee reversed.
      fee_reversal_reason: Basis.
    account: card_balance
    direction: out
    triggers: []
  - type: card_payment_posted
    target: card_transactions
    meaning: A payment is credited to the card.
    grain: One row per payment received.
    distinguish_by: [txn_date, payment_channel, amount]
    fields:
      txn_date: Effective date.
      amount: Payment.
      payment_channel: How paid.
      bank_account_id: Account debited, for ACH payments.
    account: card_balance
    direction: out
    triggers:
      - event: card:card_account_status_updated
        map: {}
  - type: card_payment_returned
    target: card_transactions
    meaning: A posted payment is returned unpaid and reversed.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Return date.
      amount: Amount returned.
      related_txn_id: Payment returned.
      return_code: Return reason code.
    account: card_balance
    direction: in
    triggers:
      - event: card:card_returned_payment_fee_assessed
        when: {return_code: [R01, R02, R03, R04, R08, R09, R16, R20]}
        map: {related_txn_id: card_txn_id, txn_date: txn_date}
      - event: card:card_account_status_updated
        map: {}
  - type: card_rewards_earned
    target: card_transactions
    meaning: Cash back is earned on one purchase.
    grain: One row per purchase.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Purchase posting date.
      amount: Cash back earned.
      related_txn_id: The purchase.
      merchant_category: Rewards category applied.
    account: rewards
    direction: in
    triggers: []
  - type: card_rewards_adjusted
    target: card_transactions
    meaning: Cash back is taken back for a merchant credit, or unredeemed rewards are forfeited at closing.
    grain: One row per merchant credit, or one row at closing.
    distinguish_by: [related_txn_id, txn_date]
    fields:
      txn_date: Adjustment date.
      amount: Cash back removed.
      related_txn_id: The merchant credit; empty for a forfeiture at closing.
    account: rewards
    direction: out
    triggers: []
  - type: card_rewards_redeemed
    target: card_transactions
    meaning: Cash back is redeemed as a statement credit or a deposit.
    grain: One row per redemption.
    distinguish_by: [txn_date, amount]
    fields:
      txn_date: Redemption date.
      amount: Amount redeemed.
      bank_account_id: Account credited, for a deposit; empty for a statement credit.
    account: rewards
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: card_msr_penalty_fees_6_cycles
    window: The six billing cycles before the cycle of the new fee.
    measure: Count of card_late_fee_assessed rows (for a late fee) or card_returned_payment_fee_assessed rows (for a returned-payment fee) on the account in the window, not reversed.
  - id: card_msr_consecutive_on_time_payments
    window: Payment due dates of the account, counted backwards from the latest due date on or before today.
    measure: Number of consecutive most recent due dates whose minimum payment was received by the due date and not returned.
  - id: card_msr_courtesy_reversals_12m
    window: Rolling 12 months ending today (today and the 364 days before it).
    measure: Count of card_fee_reversed rows on the account with fee_reversal_reason = courtesy and txn_date in the window.
  - id: card_msr_days_past_due
    window: As of today.
    measure: Calendar days from next_due_date to today when amount_past_due is above 0.00 and next_due_date is earlier than today; 0 otherwise.

# ---- policies ----
policies:
  - id: card_agg_multi_holding
    subject: [card_application_submitted]
    rule: >-
      A customer may hold at most max_per_customer Larkspur card accounts in applied, active or suspended status, and only one of them may be a Larkspur Secured Visa. The customer holds fewer than the maximum number of open card accounts, and at most one secured card.
      Closed, declined and charged-off accounts do not count, but a customer with a charged-off Larkspur card is declined.
    eligibility:
      - id: open_card_cap
        applies_to: [card_application_submitted]
        kind: authorization
        condition: The customer holds fewer than the maximum number of open card accounts, and at most one secured card.
        evidence_fields: [card_accounts.customer_id, card_accounts.status, card_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.customer_id]
          action_bindings:
            card_accounts.customer_id: customer_id
    params:
      max_per_customer: 2
      max_open_accounts_per_customer: "=max_open_accounts_per_customer"

  - id: card_agg_relationship_exposure
    subject: [card_account_opened, card_limit_changed]
    rule: >-
      Card limits are assessed together with the customer's other unsecured Larkspur credit. The sum of the customer's card limits, FlexLine limit and unpaid personal loan principal, after the new limit, may not exceed combined_unsecured_cap_usd.
      An unsecured card is not opened, and no limit is increased, while any Larkspur personal loan, FlexLine or PracticePay
      plan of the customer is more than 30 days past due or charged off. The secured card's limit is its deposit and is
      outside the cap.
    eligibility:
      - id: combined_cap
        applies_to: [card_account_opened, card_limit_changed]
        kind: authorization
        condition: The sum of the customer's card limits, FlexLine limit and unpaid personal loan principal, after the new limit, may not exceed combined_unsecured_cap_usd.
        evidence_fields: [card_accounts.credit_limit, card_accounts.customer_id, credit_lines.credit_limit, loans.principal_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.customer_id]
          action_bindings:
            card_accounts.customer_id: customer_id
    params:
      combined_unsecured_cap_usd: 100000.00
      relationship_max_days_past_due: 30

  - id: card_application_and_product
    subject: [card_application_submitted, card_account_opened, card_application_declined, card_product_changed]
    rule: >-
      An applicant is approved for the card applied for when they meet its minimum credit score and income, with a limit
      inside the card's limit range set by underwriting; otherwise they may be offered the next lower card they qualify
      for or declined. The Larkspur Secured Visa needs no minimum score; its limit equals the refundable deposit, between
      the minimum and maximum deposit. A secured account is reviewed graduation_review_months months after opening; it graduates to the Larkspur Classic Visa only when the account is in active status, has no amount past due and has made every payment on time.
      On graduation the deposit is returned, the limit stays the same, and the account keeps its history.
    eligibility:
      - id: graduation_standing
        applies_to: [card_product_changed]
        kind: state
        condition: A secured account is reviewed graduation_review_months months after opening; it graduates to the Larkspur Classic Visa only when the account is in active status, has no amount past due and has made every payment on time.
        evidence_fields: [card_accounts.status, card_accounts.card_account_id, card_accounts.amount_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active]
    params:
      per_tier:
        "Larkspur Secured Visa": {min_credit_score: "=min_credit_score", min_annual_income_usd: "=min_annual_income_usd", credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd", security_deposit_max_usd: "=security_deposit_max_usd", graduation_review_months: "=graduation_review_months"}
        "Larkspur Classic Visa": {min_credit_score: "=min_credit_score", min_annual_income_usd: "=min_annual_income_usd", credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd", security_deposit_max_usd: "=security_deposit_max_usd", graduation_review_months: "=graduation_review_months"}
        "Larkspur Cash Back Visa": {min_credit_score: "=min_credit_score", min_annual_income_usd: "=min_annual_income_usd", credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd", security_deposit_max_usd: "=security_deposit_max_usd", graduation_review_months: "=graduation_review_months"}
        "Larkspur Balance Transfer Visa Platinum": {min_credit_score: "=min_credit_score", min_annual_income_usd: "=min_annual_income_usd", credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd", security_deposit_max_usd: "=security_deposit_max_usd", graduation_review_months: "=graduation_review_months"}
        "Larkspur Cash Back Visa Signature": {min_credit_score: "=min_credit_score", min_annual_income_usd: "=min_annual_income_usd", credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd", security_deposit_max_usd: "=security_deposit_max_usd", graduation_review_months: "=graduation_review_months"}
        "Larkspur Travel Rewards Visa Signature": {min_credit_score: "=min_credit_score", min_annual_income_usd: "=min_annual_income_usd", credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd", security_deposit_max_usd: "=security_deposit_max_usd", graduation_review_months: "=graduation_review_months"}

  - id: card_evt_interest_and_aprs
    subject: [card_interest_charged, card_terms_updated]
    rule: >-
      Purchase and cash advance APRs are the Prime Rate plus the card's margins. Interest is charged at statement closing
      on the average daily balance of each balance type at its APR; purchases are interest-free when the previous statement
      balance was paid in full by its due date, while cash advances and balance transfers accrue interest from posting.
      Introductory APRs apply for the card's introductory cycles from opening, and to balance transfers only when they post
      within balance_transfer_intro_window_days days of opening. The penalty APR may apply to new transactions only after
      notice, and to existing balances only when a minimum payment is at least penalty_apr_trigger_days_late days late; it
      is removed from existing balances after penalty_apr_cure_on_time_payments consecutive on-time minimum payments.
      Interest is charged only on an account in active, suspended or closed status with a balance.
    eligibility:
      - id: interest_status
        applies_to: [card_interest_charged]
        kind: state
        condition: Interest is charged only on an account in active, suspended or closed status with a balance.
        evidence_fields: [card_accounts.status, card_accounts.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active, suspended, closed]
    params:
      cash_advance_apr_margin_percent: "=cash_advance_apr_margin_percent"
      penalty_apr_percent: "=penalty_apr_percent"
      penalty_apr_trigger_days_late: "=penalty_apr_trigger_days_late"
      penalty_apr_cure_on_time_payments: "=penalty_apr_cure_on_time_payments"
      balance_transfer_intro_window_days: "=balance_transfer_intro_window_days"
      purchase_grace_period_days: "=purchase_grace_period_days"
      per_tier:
        "Larkspur Secured Visa": {purchase_apr_margin_percent: "=purchase_apr_margin_percent", purchase_intro_apr_percent: "=purchase_intro_apr_percent", purchase_intro_months: "=purchase_intro_months", balance_transfer_intro_apr_percent: "=balance_transfer_intro_apr_percent", balance_transfer_intro_months: "=balance_transfer_intro_months"}
        "Larkspur Classic Visa": {purchase_apr_margin_percent: "=purchase_apr_margin_percent", purchase_intro_apr_percent: "=purchase_intro_apr_percent", purchase_intro_months: "=purchase_intro_months", balance_transfer_intro_apr_percent: "=balance_transfer_intro_apr_percent", balance_transfer_intro_months: "=balance_transfer_intro_months"}
        "Larkspur Cash Back Visa": {purchase_apr_margin_percent: "=purchase_apr_margin_percent", purchase_intro_apr_percent: "=purchase_intro_apr_percent", purchase_intro_months: "=purchase_intro_months", balance_transfer_intro_apr_percent: "=balance_transfer_intro_apr_percent", balance_transfer_intro_months: "=balance_transfer_intro_months"}
        "Larkspur Balance Transfer Visa Platinum": {purchase_apr_margin_percent: "=purchase_apr_margin_percent", purchase_intro_apr_percent: "=purchase_intro_apr_percent", purchase_intro_months: "=purchase_intro_months", balance_transfer_intro_apr_percent: "=balance_transfer_intro_apr_percent", balance_transfer_intro_months: "=balance_transfer_intro_months"}
        "Larkspur Cash Back Visa Signature": {purchase_apr_margin_percent: "=purchase_apr_margin_percent", purchase_intro_apr_percent: "=purchase_intro_apr_percent", purchase_intro_months: "=purchase_intro_months", balance_transfer_intro_apr_percent: "=balance_transfer_intro_apr_percent", balance_transfer_intro_months: "=balance_transfer_intro_months"}
        "Larkspur Travel Rewards Visa Signature": {purchase_apr_margin_percent: "=purchase_apr_margin_percent", purchase_intro_apr_percent: "=purchase_intro_apr_percent", purchase_intro_months: "=purchase_intro_months", balance_transfer_intro_apr_percent: "=balance_transfer_intro_apr_percent", balance_transfer_intro_months: "=balance_transfer_intro_months"}
    measures: [card_msr_consecutive_on_time_payments, card_msr_days_past_due]

  - id: card_evt_transaction_fees
    subject: [card_annual_fee_assessed, card_cash_advance_posted, card_balance_transfer_posted, card_foreign_transaction_fee_assessed, card_purchase_posted]
    rule: >-
      New purchases, cash advances and balance transfers post only on an account in active status. A cash advance carries a fee of cash_advance_fee_percent of
      the advance, not less than cash_advance_fee_min_usd, included in the advance line, and may not exceed the card's cash
      advance limit. A balance transfer carries the card's balance transfer fee percent of the transfer, not less than
      balance_transfer_fee_min_usd, and is not available on the secured card. Each purchase processed outside the United
      States carries the card's foreign transaction fee percent of the purchase, rounded to the cent, as its own line; none
      on cards with 0.00. The annual fee posts in the billing cycle of each account anniversary, except the first where the
      card waives it; no over-limit fee exists because transactions above the available credit are declined.
    eligibility:
      - id: active_for_new_transactions
        applies_to: [card_cash_advance_posted, card_balance_transfer_posted, card_purchase_posted]
        kind: state
        condition: New purchases, cash advances and balance transfers post only on an account in active status.
        evidence_fields: [card_accounts.status, card_accounts.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active]
    params:
      cash_advance_fee_percent: "=cash_advance_fee_percent"
      cash_advance_fee_min_usd: "=cash_advance_fee_min_usd"
      balance_transfer_fee_min_usd: "=balance_transfer_fee_min_usd"
      over_limit_fee_usd: "=over_limit_fee_usd"
      per_tier:
        "Larkspur Secured Visa": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", balance_transfer_fee_percent: "=balance_transfer_fee_percent", foreign_transaction_fee_percent: "=foreign_transaction_fee_percent", cash_advance_limit_percent: "=cash_advance_limit_percent"}
        "Larkspur Classic Visa": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", balance_transfer_fee_percent: "=balance_transfer_fee_percent", foreign_transaction_fee_percent: "=foreign_transaction_fee_percent", cash_advance_limit_percent: "=cash_advance_limit_percent"}
        "Larkspur Cash Back Visa": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", balance_transfer_fee_percent: "=balance_transfer_fee_percent", foreign_transaction_fee_percent: "=foreign_transaction_fee_percent", cash_advance_limit_percent: "=cash_advance_limit_percent"}
        "Larkspur Balance Transfer Visa Platinum": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", balance_transfer_fee_percent: "=balance_transfer_fee_percent", foreign_transaction_fee_percent: "=foreign_transaction_fee_percent", cash_advance_limit_percent: "=cash_advance_limit_percent"}
        "Larkspur Cash Back Visa Signature": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", balance_transfer_fee_percent: "=balance_transfer_fee_percent", foreign_transaction_fee_percent: "=foreign_transaction_fee_percent", cash_advance_limit_percent: "=cash_advance_limit_percent"}
        "Larkspur Travel Rewards Visa Signature": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", balance_transfer_fee_percent: "=balance_transfer_fee_percent", foreign_transaction_fee_percent: "=foreign_transaction_fee_percent", cash_advance_limit_percent: "=cash_advance_limit_percent"}
    formula:
      foreign_fee: round(amount * foreign_transaction_fee_percent / 100, 2)

  - id: card_evt_penalty_fees
    subject: [card_late_fee_assessed, card_returned_payment_fee_assessed, card_fee_reversed]
    rule: >-
      A late fee posts when the minimum payment is not received by the payment due date; it is late_fee_first_usd, or
      late_fee_repeat_usd when another late fee posted in the six previous billing cycles, and never more than the minimum
      payment due. A returned-payment fee follows the same first and repeat amounts and cap, for return codes R01, R02,
      R03, R04, R08, R09, R16 and R20 only. Only one penalty fee is charged for a single event: when a returned payment also makes the payment late, either the late fee or the returned-payment fee posts, not both, and any second fee is reversed as single_penalty_event.
      One late fee at most posts per payment due date.
    eligibility:
      - id: single_penalty_event
        applies_to: [card_late_fee_assessed, card_returned_payment_fee_assessed]
        kind: authorization
        condition: "Only one penalty fee is charged for a single event: when a returned payment also makes the payment late, either the late fee or the returned-payment fee posts, not both, and any second fee is reversed as single_penalty_event."
        evidence_fields: [card_transactions.event_type, card_transactions.installment_due_date, card_transactions.related_txn_id, card_transactions.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_account_id]
          action_bindings:
            card_transactions.card_account_id: card_account_id
      - id: one_late_fee_per_due_date
        applies_to: [card_late_fee_assessed]
        kind: dedup
        condition: One late fee at most posts per payment due date.
        evidence_fields: [card_transactions.card_account_id, card_transactions.installment_due_date, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_account_id, card_transactions.installment_due_date]
          action_bindings:
            card_transactions.card_account_id: card_account_id
            card_transactions.installment_due_date: installment_due_date
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {card_account_id: card_account_id, installment_due_date: installment_due_date}
          duplicate_filters: {event_type: [card_late_fee_assessed]}
          distinct_fields: []
    params:
      late_fee_first_usd: "=late_fee_first_usd"
      late_fee_repeat_usd: "=late_fee_repeat_usd"
      returned_payment_fee_first_usd: "=returned_payment_fee_first_usd"
      returned_payment_fee_repeat_usd: "=returned_payment_fee_repeat_usd"
    formula:
      late_fee: min(minimum_payment_due, late_fee_repeat_usd if card_msr_penalty_fees_6_cycles > 0 else late_fee_first_usd)
    measures: [card_msr_penalty_fees_6_cycles]

  - id: card_evt_payments
    subject: [card_payment_posted, card_payment_returned, card_account_status_updated]
    rule: >-
      Payments are accepted on an account in any status other than applied or declined. Each statement's minimum payment is min_payment_percent of the
      statement balance plus that cycle's interest and fees, not less than min_payment_floor_usd (or the full balance if
      smaller), plus any amount past due. The minimum payment is applied to the lowest-APR balance first and any amount
      above it to the highest-APR balance first. A returned payment is reversed in full. Payments by the due date count as
      on time; a statement balance paid in full by the due date keeps the purchase grace period.
    eligibility:
      - id: payable_status
        applies_to: [card_payment_posted]
        kind: state
        condition: Payments are accepted on an account in any status other than applied or declined.
        evidence_fields: [card_accounts.status, card_accounts.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active, suspended, closed, charged_off]
    params:
      min_payment_percent: "=min_payment_percent"
      min_payment_floor_usd: "=min_payment_floor_usd"
      payment_allocation_rule: "=payment_allocation_rule"
      statement_closing_to_due_days: "=statement_closing_to_due_days"
    formula:
      minimum_payment: min(card_balance, max(min_payment_floor_usd, round(card_balance * min_payment_percent / 100, 2))) + amount_past_due

  - id: card_evt_rewards
    subject: [card_rewards_earned, card_rewards_adjusted, card_rewards_redeemed, card_merchant_credit_posted]
    rule: >-
      Cash back is earned on each purchase at the card's rate for the purchase's rewards category (grocery, dining, gas,
      travel, or the base rate for any other and for foreign purchases), rounded to the cent; cash advances, balance
      transfers, fees and interest earn nothing. A merchant credit posts against the one purchase it refunds, reduces the
      balance on its posting date and is not a payment toward the minimum payment due. A merchant credit takes back the cash back earned on the credited amount at the rate of the original purchase.
      Rewards can be redeemed as a statement credit or a deposit to a verified linked bank account, in amounts of at least
      the card's minimum redemption, while the account is active. Unredeemed rewards are forfeited when the account is
      closed or charged off, recorded as one adjustment at closing.
    eligibility:
      - id: clawback_tied_to_purchase
        applies_to: [card_rewards_adjusted]
        kind: dedup
        condition: A merchant credit takes back the cash back earned on the credited amount at the rate of the original purchase.
        evidence_fields: [card_transactions.related_txn_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.related_txn_id]
          action_bindings:
            card_transactions.related_txn_id: related_txn_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [card_rewards_adjusted]}
          distinct_fields: []
    params:
      rewards_redemption_options: "=rewards_redemption_options"
      rewards_forfeited_on_close: "=rewards_forfeited_on_close"
      per_tier:
        "Larkspur Secured Visa": {base_cash_back_percent: "=base_cash_back_percent", grocery_cash_back_percent: "=grocery_cash_back_percent", dining_cash_back_percent: "=dining_cash_back_percent", gas_cash_back_percent: "=gas_cash_back_percent", travel_cash_back_percent: "=travel_cash_back_percent", rewards_min_redemption_usd: "=rewards_min_redemption_usd"}
        "Larkspur Classic Visa": {base_cash_back_percent: "=base_cash_back_percent", grocery_cash_back_percent: "=grocery_cash_back_percent", dining_cash_back_percent: "=dining_cash_back_percent", gas_cash_back_percent: "=gas_cash_back_percent", travel_cash_back_percent: "=travel_cash_back_percent", rewards_min_redemption_usd: "=rewards_min_redemption_usd"}
        "Larkspur Cash Back Visa": {base_cash_back_percent: "=base_cash_back_percent", grocery_cash_back_percent: "=grocery_cash_back_percent", dining_cash_back_percent: "=dining_cash_back_percent", gas_cash_back_percent: "=gas_cash_back_percent", travel_cash_back_percent: "=travel_cash_back_percent", rewards_min_redemption_usd: "=rewards_min_redemption_usd"}
        "Larkspur Balance Transfer Visa Platinum": {base_cash_back_percent: "=base_cash_back_percent", grocery_cash_back_percent: "=grocery_cash_back_percent", dining_cash_back_percent: "=dining_cash_back_percent", gas_cash_back_percent: "=gas_cash_back_percent", travel_cash_back_percent: "=travel_cash_back_percent", rewards_min_redemption_usd: "=rewards_min_redemption_usd"}
        "Larkspur Cash Back Visa Signature": {base_cash_back_percent: "=base_cash_back_percent", grocery_cash_back_percent: "=grocery_cash_back_percent", dining_cash_back_percent: "=dining_cash_back_percent", gas_cash_back_percent: "=gas_cash_back_percent", travel_cash_back_percent: "=travel_cash_back_percent", rewards_min_redemption_usd: "=rewards_min_redemption_usd"}
        "Larkspur Travel Rewards Visa Signature": {base_cash_back_percent: "=base_cash_back_percent", grocery_cash_back_percent: "=grocery_cash_back_percent", dining_cash_back_percent: "=dining_cash_back_percent", gas_cash_back_percent: "=gas_cash_back_percent", travel_cash_back_percent: "=travel_cash_back_percent", rewards_min_redemption_usd: "=rewards_min_redemption_usd"}

  - id: card_evt_fee_reversal
    subject: [card_fee_reversed]
    rule: >-
      A fee may be reversed once. A courtesy reversal of a late or returned-payment fee is granted on request when fewer than the card's courtesy reversals per 12 months have been granted on the account.
      Fees posted through a Larkspur error are reversed as lender_error, a second penalty fee for a single event as
      single_penalty_event, and fees tied to a billing error resolved in the cardholder's favor as dispute_resolved, without
      count limits. Annual fees are not reversed as a courtesy.
    eligibility:
      - id: once_per_fee
        applies_to: [card_fee_reversed]
        kind: dedup
        condition: A fee may be reversed once.
        evidence_fields: [card_transactions.related_txn_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.related_txn_id]
          action_bindings:
            card_transactions.related_txn_id: related_txn_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [card_fee_reversed]}
          distinct_fields: []
      - id: courtesy_count
        applies_to: [card_fee_reversed]
        kind: authorization
        condition: A courtesy reversal of a late or returned-payment fee is granted on request when fewer than the card's courtesy reversals per 12 months have been granted on the account.
        evidence_fields: [card_transactions.fee_reversal_reason, card_transactions.txn_date, card_transactions.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_account_id]
          action_bindings:
            card_transactions.card_account_id: card_account_id
    params:
      per_tier:
        "Larkspur Secured Visa": {courtesy_reversals_per_12_months: "=courtesy_reversals_per_12_months"}
        "Larkspur Classic Visa": {courtesy_reversals_per_12_months: "=courtesy_reversals_per_12_months"}
        "Larkspur Cash Back Visa": {courtesy_reversals_per_12_months: "=courtesy_reversals_per_12_months"}
        "Larkspur Balance Transfer Visa Platinum": {courtesy_reversals_per_12_months: "=courtesy_reversals_per_12_months"}
        "Larkspur Cash Back Visa Signature": {courtesy_reversals_per_12_months: "=courtesy_reversals_per_12_months"}
        "Larkspur Travel Rewards Visa Signature": {courtesy_reversals_per_12_months: "=courtesy_reversals_per_12_months"}
    measures: [card_msr_courtesy_reversals_12m]

  - id: card_evt_account_status
    subject: [card_account_suspended, card_account_reinstated, card_account_closed, card_account_charged_off, card_limit_changed, card_application_declined]
    rule: >-
      Charging privileges are suspended at suspend_days_past_due days past due or during a fraud review, and restored once
      the amount past due is 0.00 and any review is cleared. A cardholder may close the account at any time; the balance is
      still repaid under the account terms and unredeemed rewards are forfeited. Larkspur may close an account with a 0.00
      balance after inactivity_close_months months without transactions. An account is charged off once the current date is at least the charge-off days past due after the oldest unpaid due date.
      Days past due are counted in calendar days starting the day after the oldest unpaid due date.
      A limit increase is considered no sooner than credit_limit_increase_min_months months after opening or the last
      increase and never above the card's maximum limit; a cardholder-requested decrease takes effect at once but never
      below the balance or the card's minimum limit.
    eligibility:
      - id: charge_off_threshold
        applies_to: [card_account_charged_off]
        kind: time
        condition: An account is charged off once the current date is at least the charge-off days past due after the oldest unpaid due date.
        evidence_fields: [card_accounts.next_due_date, card_accounts.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the oldest unpaid due date
          anchor_source: card_accounts.next_due_date
          relation: not_before
          duration_source: variants.charge_off_days_past_due
          unit: calendar_days
          counting_rule: Days past due are counted in calendar days starting the day after the oldest unpaid due date.
          boundary: inclusive
    params:
      suspend_days_past_due: "=suspend_days_past_due"
      inactivity_close_months: "=inactivity_close_months"
      charge_off_days_past_due: "=charge_off_days_past_due"
      delinquency_reporting_days_past_due: "=delinquency_reporting_days_past_due"
      credit_limit_increase_min_months: "=credit_limit_increase_min_months"
    measures: [card_msr_days_past_due]
