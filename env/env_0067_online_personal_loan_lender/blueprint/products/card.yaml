# Larkspur Lending - credit card charter (Visa credit cards issued to Larkspur customers; open-end revolving credit).
category: card
display_name: Larkspur Credit Cards

binding:
  holding_table: card_accounts
  event_tables: [card_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {card_balance: card_balance, rewards_balance: rewards}

lifecycle:
  states: [applied, declined, active, suspended, closed, charged_off]
  transitions:
    - {from: applied, to: active, by: system, means: The application is approved (and for the secured card the deposit is funded) and the account opens.}
    - {from: applied, to: declined, by: system, means: The application is declined.}
    - {from: active, to: suspended, by: system, means: Charging privileges are suspended for serious delinquency or fraud review.}
    - {from: suspended, to: active, by: system, means: The suspension reason is cleared and charging privileges are restored.}
    - {from: active, to: closed, by: user, means: The cardholder closes the account; any balance is still repaid under the account terms.}
    - {from: active, to: closed, by: system, means: Larkspur closes the account for inactivity.}
    - {from: suspended, to: closed, by: system, means: A suspended account is closed with its balance still repaid under the account terms.}
    - {from: active, to: charged_off, by: system, means: Charged off for delinquency.}
    - {from: suspended, to: charged_off, by: system, means: Charged off for delinquency.}

accounts:
  - key: card_balance
    unit: USD
    meaning: Amount owed on the card. Credited (in) by purchases, cash advances, balance transfers, interest, fees and returned payments; debited (out) by payments, merchant credits and fee reversals.
  - key: rewards
    unit: USD
    meaning: Unredeemed cash-back rewards value. Credited (in) by rewards earned on purchases; debited (out) by rewards adjusted for merchant credits or forfeited, and by redemptions.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_credit_score: "Minimum FICO Score 8 at application; 'none' when no minimum applies."
  min_annual_income_usd: "Minimum stated gross annual income, USD."
  security_deposit_min_usd: "Minimum refundable security deposit, USD; it equals the credit limit (0 for unsecured cards)."
  security_deposit_max_usd: "Maximum security deposit, USD (0 for unsecured cards)."
  credit_limit_min_usd: "Lowest credit limit, USD."
  credit_limit_max_usd: "Highest credit limit, USD."
  annual_fee_usd: "Annual fee charged in the billing cycle of each account anniversary, USD."
  annual_fee_first_year_waived: "Whether the first annual fee is not charged."
  purchase_apr_margin_percent: "Percentage points added to the Prime Rate for the variable purchase APR."
  cash_advance_apr_margin_percent: "Percentage points added to the Prime Rate for the variable cash advance APR."
  penalty_apr_percent: "Penalty APR, percent."
  penalty_apr_trigger_days_late: "Days a minimum payment must be past due before the penalty APR may apply to existing balances."
  penalty_apr_cure_on_time_payments: "Consecutive on-time minimum payments after which the penalty APR is removed from existing balances."
  purchase_intro_apr_percent: "Introductory purchase APR, percent; 'not offered' when there is none."
  purchase_intro_months: "Billing cycles the introductory purchase APR lasts from opening; 'not offered' when there is none."
  balance_transfer_intro_apr_percent: "Introductory balance transfer APR, percent; 'not offered' when there is none."
  balance_transfer_intro_months: "Billing cycles the introductory balance transfer APR lasts from opening."
  balance_transfer_intro_window_days: "Calendar days after opening within which a balance transfer must post to get the introductory APR."
  balance_transfer_fee_percent: "Balance transfer fee, percent of each transfer; 'not offered' where transfers are not allowed."
  balance_transfer_fee_min_usd: "Minimum balance transfer fee, USD."
  cash_advance_fee_percent: "Cash advance fee, percent of each advance."
  cash_advance_fee_min_usd: "Minimum cash advance fee, USD."
  cash_advance_limit_percent: "Cash advance limit as a percent of the credit limit."
  foreign_transaction_fee_percent: "Fee on each transaction processed outside the United States, percent."
  purchase_grace_period_days: "Minimum days between statement closing and the payment due date; purchases are interest-free when the previous statement balance is paid in full by the due date."
  min_payment_percent: "Minimum payment percent of the statement balance, added to that cycle's interest and fees."
  min_payment_floor_usd: "Lowest minimum payment, USD (or the full balance if smaller)."
  payment_allocation_rule: "How payments are applied."
  late_fee_first_usd: "Late fee for a first late payment, USD, never more than the minimum payment due."
  late_fee_repeat_usd: "Late fee for another late payment within the next six billing cycles, USD, never more than the minimum payment due."
  returned_payment_fee_first_usd: "Returned-payment fee for a first returned payment, USD, never more than the minimum payment due."
  returned_payment_fee_repeat_usd: "Returned-payment fee for another returned payment within the next six billing cycles, USD, never more than the minimum payment due."
  over_limit_fee_usd: "Over-limit fee, USD (transactions over the limit are declined instead)."
  courtesy_reversals_per_12_months: "Courtesy reversals of a late or returned-payment fee per account in any rolling 12 months (integer)."
  base_cash_back_percent: "Cash back on purchases not in a bonus category, percent; 0 when the card earns no rewards."
  grocery_cash_back_percent: "Cash back on grocery purchases, percent."
  dining_cash_back_percent: "Cash back on dining purchases, percent."
  gas_cash_back_percent: "Cash back on gas purchases, percent."
  travel_cash_back_percent: "Cash back on travel purchases, percent."
  rewards_min_redemption_usd: "Smallest redemption, USD."
  rewards_redemption_options: "Ways rewards can be redeemed."
  rewards_forfeited_on_close: "Whether unredeemed rewards are forfeited when the account closes or is charged off."
  suspend_days_past_due: "Days past due at which charging privileges are suspended."
  charge_off_days_past_due: "Days past due at which the account is charged off."
  delinquency_reporting_days_past_due: "Days past due at which delinquency is reported to the credit bureaus."
  inactivity_close_months: "Months without any transaction, with a 0.00 balance, after which Larkspur may close the account."
  statement_closing_to_due_days: "Days from statement closing to the payment due date."
  graduation_review_months: "Months after opening at which a secured card is reviewed for an upgrade to the Larkspur Classic Visa; 'not offered' for other cards."
  credit_limit_increase_min_months: "Months after opening (or after the last increase) before a limit increase is considered."
  max_open_accounts_per_customer: "Most open card accounts a customer may hold (integer)."

