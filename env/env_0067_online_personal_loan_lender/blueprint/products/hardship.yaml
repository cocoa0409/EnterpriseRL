# ---- data flow (every write is an event) ----
events:
  - type: hardship_plan_requested
    target: hardship_plans
    mutation: create
    meaning: A borrower asks for help under one assistance program for one personal loan.
    grain: One row per request.
    fields:
      customer_id: Borrower.
      loan_id: Loan the request concerns.
      variant_name: Program requested.
      hardship_reason: Hardship reported.
      request_date: Date of the request.
      qualifying_event_date: FEMA declaration date (Disaster Relief) or end of military service if already ended (Servicemember); empty otherwise.
      disaster_declaration_number: FEMA declaration number, for Disaster Relief Deferral.
      military_service_start_date: Service start date from the orders, for Servicemember Rate Cap Benefit.
    triggers: []
  - type: hardship_plan_offered
    target: hardship_plans
    mutation: {transition: {from: requested, to: offered}}
    meaning: The program terms are set and presented to the borrower.
    grain: One row per transaction.
    fields:
      decision_date: Date the terms were offered.
      pre_plan_payment_amount: Loan installment before the plan.
      pre_plan_interest_rate: Loan rate before the plan.
      balance_at_request: Unpaid principal (charged-off balance for a settlement).
      remaining_months_at_request: Loan due dates left through maturity.
      start_date: First affected due date.
      end_date: Last affected due date.
      plan_months: Number of plan months.
      plan_payment_amount: Plan installment.
      plan_interest_rate: Plan rate, if the program sets one.
      deferred_installment_count: Installments to be deferred.
      term_extension_months: Months to be added on completion.
      settlement_amount: Total settlement amount.
    triggers: []
  - type: hardship_plan_declined
    target: hardship_plans
    mutation: {transition: {from: requested, to: declined}}
    meaning: The request is declined.
    grain: One row per transaction.
    fields:
      decision_date: Date declined.
      decline_reason: Why.
      closed_date: Same as decision_date.
    triggers: []
  - type: hardship_benefit_applied
    target: hardship_plans
    mutation: {transition: {from: requested, to: active}}
    meaning: A Disaster Relief Deferral or Servicemember Rate Cap Benefit is applied without an acceptance step.
    grain: One row per transaction.
    fields:
      decision_date: Date applied.
      pre_plan_payment_amount: Loan installment before the benefit.
      pre_plan_interest_rate: Loan rate before the benefit.
      balance_at_request: Unpaid principal.
      remaining_months_at_request: Loan due dates left through maturity.
      plan_payment_amount: Installment under the benefit (Servicemember); 0.00 for Disaster Relief.
      acceptance_date: Same as decision_date.
      start_date: First affected due date (Disaster Relief) or the service start date (Servicemember).
      end_date: Last affected due date; empty for Servicemember until the service end date is known.
      plan_months: Plan months; 0 for Servicemember until the service end date is known.
      plan_interest_rate: Rate cap, for Servicemember.
      deferred_installment_count: Installments deferred, for Disaster Relief.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
      - event: hardship:hardship_installment_deferred
        when: {deferred_installment_count: {not: 0}}
        map: {}
  - type: hardship_plan_accepted
    target: hardship_plans
    mutation: {transition: {from: offered, to: active}}
    meaning: The borrower accepts and e-signs the offered terms.
    grain: One row per transaction.
    fields:
      acceptance_date: Date accepted.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
  - type: hardship_offer_expired
    target: hardship_plans
    mutation: {transition: {from: offered, to: expired}}
    meaning: Offered terms lapse unaccepted.
    grain: One row per transaction.
    fields:
      closed_date: Date expired.
    triggers: []
  - type: hardship_plan_completed
    target: hardship_plans
    mutation: {transition: {from: active, to: completed}}
    meaning: The plan runs its course.
    grain: One row per transaction.
    fields:
      closed_date: Date completed.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
  - type: hardship_plan_broken
    target: hardship_plans
    mutation: {transition: {from: active, to: broken}}
    meaning: The plan ends because a plan installment was missed.
    grain: One row per transaction.
    fields:
      closed_date: Date broken.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
  - type: hardship_plan_cancelled
    target: hardship_plans
    mutation: {transition: [{from: offered, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The borrower turns down an offer or leaves an active plan early.
    grain: One row per transaction.
    fields:
      closed_date: Date cancelled.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
  - type: hardship_plan_end_date_set
    target: hardship_plans
    mutation: update
    meaning: The end of an open-ended benefit is recorded once known (the service end date for a Servicemember Rate Cap Benefit).
    grain: One row per transaction.
    fields:
      end_date: Last date the benefit applies.
      plan_months: Number of loan due dates covered.
    triggers: []
  - type: hardship_document_received
    target: hardship_plan_events
    meaning: A supporting document for the request or plan is received.
    grain: One row per document type per day received.
    distinguish_by: [document_type, event_date]
    fields:
      event_date: Date received.
      document_type: Kind of document.
      loan_id: Loan concerned.
    triggers: []
  - type: hardship_installment_deferred
    target: hardship_plan_events
    meaning: One loan installment is moved to the end of the term.
    grain: One row per loan due date deferred.
    distinguish_by: [installment_due_date]
    fields:
      event_date: Date recorded.
      installment_due_date: Loan due date deferred.
      amount: Scheduled installment amount deferred.
      loan_id: Loan concerned.
    triggers:
      - event: loan:loan_payment_schedule_updated
        map: {}
  - type: hardship_plan_installment_scheduled
    target: hardship_plan_events
    meaning: One plan installment falls due under an active plan.
    grain: One row per plan due date.
    distinguish_by: [installment_due_date]
    fields:
      event_date: Date recorded.
      installment_due_date: Plan due date (a loan due date).
      amount: Plan installment due.
      loan_id: Loan concerned.
    account: plan_amount_due
    direction: in
    triggers: []
  - type: hardship_plan_payment_credited
    target: hardship_plan_events
    meaning: A loan payment is credited toward a plan installment.
    grain: One row per loan payment per plan due date.
    distinguish_by: [loan_txn_id, installment_due_date]
    fields:
      event_date: Payment effective date.
      installment_due_date: Plan due date credited.
      amount: Amount credited.
      loan_txn_id: Loan payment credited.
      loan_id: Loan concerned.
    account: plan_amount_due
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: hardship_msr_deferred_installments_lifetime
    window: Life of the loan, all hardship plans on it.
    measure: Count of hardship_installment_deferred rows whose loan_id is the loan.
  - id: hardship_msr_relief_months_24m
    window: The 24 calendar months ending on the requested plan's first affected due date.
    measure: Number of loan due dates in the window that fall between start_date and end_date (inclusive) of plans on the loan whose program counts toward the relief limit and that became active (acceptance_date not empty), whatever their later status.
  - id: hardship_msr_program_uses
    window: Life of the loan.
    measure: Count of plans on the loan of the same program that became active (acceptance_date not empty).
  - id: hardship_msr_unpaid_plan_installments
    window: Plan due dates of the plan whose plan payment grace period has ended on or before today.
    measure: Count of those plan due dates where the hardship_plan_payment_credited amounts for the due date (net of credited payments later returned) total less than the hardship_plan_installment_scheduled amount.

# ---- policies ----
policies:
  - id: hardship_agg_multi_holding
    subject: [hardship_plan_requested]
    rule: >-
      Hardship assistance is arranged per loan. A borrower may have open plans (requested, offered or active) on at most
      max_per_customer loans at the same time, which is every personal loan the borrower can hold. No other hardship plan on the same loan is in requested, offered or active status.
      A borrower who wants a different program on the same loan first cancels the open request or plan; requests are
      never stacked on one loan.
    eligibility:
      - id: one_open_plan_per_loan
        applies_to: [hardship_plan_requested]
        kind: authorization
        condition: No other hardship plan on the same loan is in requested, offered or active status.
        evidence_fields: [hardship_plans.loan_id, hardship_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.loan_id]
          action_bindings:
            hardship_plans.loan_id: loan_id
    params:
      max_per_customer: 2

  - id: hardship_agg_relief_limits
    subject: [hardship_plan_requested, hardship_plan_offered, hardship_installment_deferred]
    rule: >-
      Relief on one loan is limited across all of its plans. Over the life of a loan at most
      max_deferred_installments_per_loan installments may be deferred, counting every program that defers installments;
      a deferral request is offered only for as many installments as remain under that limit. The months of plans whose
      program counts toward the relief limit may cover at most max_relief_months_24m loan due dates in the 24 calendar
      months ending on the new plan's first affected due date, and a counting plan is offered only for the months that
      fit. A program may be used on a loan no more often than its maximum uses per loan, and a new plan of the same
      program may start only once its minimum months between uses have passed since the earlier plan of that program
      ended. After a plan on the loan is broken, a new request (other than Disaster Relief Deferral or Servicemember
      Rate Cap Benefit) is taken only after the broken program's wait has passed. The request fits the program's lifetime uses, its spacing since the previous plan of the same program, and the wait after any broken plan on the loan.
      Disaster Relief Deferral and Servicemember Rate Cap Benefit never count toward the 24-month relief limit, but
      Disaster Relief deferrals do count toward the lifetime deferral limit. When a limit leaves no room, the request is
      declined with relief_limit_reached.
    eligibility:
      - id: program_usage_fits
        applies_to: [hardship_plan_requested]
        kind: authorization
        condition: The request fits the program's lifetime uses, its spacing since the previous plan of the same program, and the wait after any broken plan on the loan.
        evidence_fields: [hardship_plans.loan_id, hardship_plans.variant_name, hardship_plans.status, hardship_plans.acceptance_date, hardship_plans.closed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.loan_id]
          action_bindings:
            hardship_plans.loan_id: loan_id
    params:
      max_deferred_installments_per_loan: 6
      max_relief_months_24m: 12
      per_tier:
        Short-Term Payment Deferral: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Reduced Payment Plan: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Temporary Rate Reduction Plan: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Term Extension Modification: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Disaster Relief Deferral: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Servicemember Rate Cap Benefit: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Charged-Off Settlement Plan: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
    measures: [hardship_msr_deferred_installments_lifetime, hardship_msr_relief_months_24m, hardship_msr_program_uses]

  - id: hardship_program_eligibility
    subject: [hardship_plan_requested, hardship_plan_declined]
    rule: >-
      Each program has its own entry rules, applied as of the request date. The loan is in one of the program's eligible loan statuses (active for every program except Servicemember Rate Cap Benefit, which also accepts charged_off, and Charged-Off Settlement Plan, which accepts only charged_off).
      For programs with a minimum seasoning, the request is taken only when the current date is at least the program's minimum months after the loan's funding date.
      Months are counted as whole calendar months from the funding date, and when the later month has no matching day the last day of that month is used.
      The loan must also have at least the program's minimum installments paid since funding, no more than the
      program's maximum days past due, at least the program's minimum unpaid principal (charged-off balance for a
      settlement), and - for settlement - at least the minimum days since charge-off. The hardship reason must be one of
      the program's qualifying reasons, and where the program requires a minimum documented income drop the income
      documents must show it. A borrower who does not meet a program's rules may be considered for another program
      whose rules they meet; the agent never offers terms outside a program. A request that fails the rules is
      declined with not_eligible_program, loan_status_ineligible or no_qualifying_hardship as applicable.
    eligibility:
      - id: loan_status_fits
        applies_to: [hardship_plan_requested]
        kind: state
        condition: The loan is in one of the program's eligible loan statuses (active for every program except Servicemember Rate Cap Benefit, which also accepts charged_off, and Charged-Off Settlement Plan, which accepts only charged_off).
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active, charged_off]
      - id: seasoning
        applies_to: [hardship_plan_requested]
        kind: time
        condition: For programs with a minimum seasoning, the request is taken only when the current date is at least the program's minimum months after the loan's funding date.
        evidence_fields: [loans.funding_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the loan's funding date
          anchor_source: loans.funding_date
          relation: not_before
          duration_source: variants.min_months_since_funding
          unit: calendar_months
          counting_rule: Months are counted as whole calendar months from the funding date, and when the later month has no matching day the last day of that month is used.
          boundary: inclusive
    params:
      per_tier:
        Short-Term Payment Deferral: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Reduced Payment Plan: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Temporary Rate Reduction Plan: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Term Extension Modification: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Disaster Relief Deferral: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Servicemember Rate Cap Benefit: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Charged-Off Settlement Plan: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}

  - id: hardship_evt_documents_and_decision
    subject: [hardship_document_received, hardship_plan_declined, hardship_plan_offered]
    rule: >-
      A request is decided only on the documents the program requires, as recorded document lines on the plan; a
      borrower's description of a document is never a substitute for the recorded document. Documents may be received while the request is requested or offered, or while the plan is active.
      The decision is made within the program's decision business days once every required document is on file. A request missing required documents is declined for documents_not_received only when the current date is later than the request date plus the program's document due days.
      The document period is counted in calendar days starting the day after the request date, and a document received on the last day of the period is in time.
      A program that requires no documents is decided on the records alone. A request that meets the program and limit
      rules is offered (or applied directly when the program needs no acceptance); otherwise it is declined with the
      first applicable reason in the order loan_status_ineligible, no_qualifying_hardship, not_eligible_program,
      relief_limit_reached, documents_not_received.
    eligibility:
      - id: open_plan_for_documents
        applies_to: [hardship_document_received]
        kind: state
        condition: Documents may be received while the request is requested or offered, or while the plan is active.
        evidence_fields: [hardship_plans.status, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        state_contract:
          field: hardship_plans.status
          allowed: [requested, offered, active]
      - id: document_deadline
        applies_to: [hardship_plan_declined]
        kind: time
        condition: A request missing required documents is declined for documents_not_received only when the current date is later than the request date plus the program's document due days.
        evidence_fields: [hardship_plans.request_date, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the request date
          anchor_source: hardship_plans.request_date
          relation: not_before
          duration_source: variants.document_due_days
          unit: calendar_days
          counting_rule: The document period is counted in calendar days starting the day after the request date, and a document received on the last day of the period is in time.
          boundary: exclusive
    params:
      decline_reason_order: [loan_status_ineligible, no_qualifying_hardship, not_eligible_program, relief_limit_reached, documents_not_received]
      per_tier:
        Short-Term Payment Deferral: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Reduced Payment Plan: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Temporary Rate Reduction Plan: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Term Extension Modification: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Disaster Relief Deferral: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Servicemember Rate Cap Benefit: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Charged-Off Settlement Plan: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}

  - id: hardship_evt_offer_terms
    subject: [hardship_plan_offered, hardship_benefit_applied]
    rule: >-
      Plan terms are computed from the loan as it stands on the decision date, recorded on the plan as the pre-plan
      installment, pre-plan rate, unpaid principal and remaining months. The first affected due date follows the
      program's first plan due date rule. Short-Term Payment Deferral and Disaster Relief Deferral defer the number of
      installments the borrower asks for, from 1 up to the program's per-plan maximum and the lifetime limit, with no
      plan installment. Reduced Payment Plan sets a plan installment of reduced_payment_percent of the pre-plan
      installment, rounded to the cent and not below min_plan_payment_usd, for exactly the program's plan months.
      Temporary Rate Reduction Plan sets the plan rate for its plan months, and the plan installment is the level payment
      that amortizes the unpaid principal at the plan rate over the remaining months (not below min_plan_payment_usd).
      Term Extension Modification sets a modified rate of the pre-plan rate minus rate_reduction_points (not below
      modified_rate_floor_percent) and an extension of max_term_extension_months, shortened so the total term does not
      exceed max_total_term_months; the plan installment for each trial month is the level payment amortizing the unpaid
      principal at the modified rate over the remaining months plus the extension. Servicemember Rate Cap Benefit sets the
      plan rate to the lower of the pre-plan rate and the program's plan rate, and the installment is the level payment at
      that rate over the remaining months; it runs from the military service start date until the end of service is
      recorded. Charged-Off Settlement Plan sets the settlement amount at settlement_lump_sum_percent of the charged-off
      balance for one payment, or settlement_installment_percent for 2 to settlement_max_installments monthly
      installments (each the settlement amount divided by the number of installments, rounded to the cent, with the last
      absorbing the difference); the borrower chooses one. No program charges an enrollment fee.
    eligibility: []
    params:
      plan_fee_usd: "=plan_fee_usd"
      per_tier:
        Short-Term Payment Deferral: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Reduced Payment Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Temporary Rate Reduction Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Term Extension Modification: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Disaster Relief Deferral: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Servicemember Rate Cap Benefit: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Charged-Off Settlement Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
    formula:
      reduced_plan_payment: max(min_plan_payment_usd, round(pre_plan_payment_amount * reduced_payment_percent / 100, 2))
      plan_rate_monthly: plan_interest_rate / 1200
      level_plan_payment: round(balance_at_request * plan_rate_monthly / (1 - (1 + plan_rate_monthly) ** (0 - remaining_months_at_request)), 2)
      modified_rate: max(modified_rate_floor_percent, pre_plan_interest_rate - rate_reduction_points)
      scra_rate: min(pre_plan_interest_rate, plan_rate_percent)
      settlement_lump_sum: round(balance_at_request * settlement_lump_sum_percent / 100, 2)
      settlement_installment_total: round(balance_at_request * settlement_installment_percent / 100, 2)

  - id: hardship_evt_acceptance
    subject: [hardship_plan_accepted, hardship_offer_expired, hardship_plan_cancelled]
    rule: >-
      Offered terms take effect only when the borrower accepts and e-signs them; a representative cannot accept on the
      borrower's behalf. The borrower can accept the offered terms only when the current date is no later than the decision date plus the program's offer acceptance days.
      The acceptance period is counted in calendar days starting the day after the decision date, and acceptance on the last day is in time.
      An offer not accepted within the period expires. The borrower may turn an offer down at any time before it expires,
      which closes it as cancelled. Accepting a plan does not cancel AutoPay; for a plan with a plan installment the
      AutoPay debit amount becomes the plan installment, and for a deferral no debit is taken on a deferred due date.
    eligibility:
      - id: acceptance_window
        applies_to: [hardship_plan_accepted]
        kind: time
        condition: The borrower can accept the offered terms only when the current date is no later than the decision date plus the program's offer acceptance days.
        evidence_fields: [hardship_plans.decision_date, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the decision date
          anchor_source: hardship_plans.decision_date
          relation: not_after
          duration_source: variants.offer_acceptance_days
          unit: calendar_days
          counting_rule: The acceptance period is counted in calendar days starting the day after the decision date, and acceptance on the last day is in time.
          boundary: inclusive
    params:
      per_tier:
        Short-Term Payment Deferral: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Reduced Payment Plan: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Temporary Rate Reduction Plan: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Term Extension Modification: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Disaster Relief Deferral: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Servicemember Rate Cap Benefit: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Charged-Off Settlement Plan: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}

  - id: hardship_evt_plan_installments
    subject: [hardship_plan_installment_scheduled, hardship_plan_payment_credited, hardship_plan_completed, hardship_plan_broken]
    rule: >-
      For a plan with plan installments, one plan installment line is scheduled on each loan due date from the start
      date through the end date, for the plan installment amount. Plan installments are scheduled and credited only while the plan is active.
      Every loan payment of type hardship_plan_payment is credited toward the oldest plan installment not yet fully
      credited; a payment credited and later returned no longer counts. A plan installment that is not fully credited
      within the program's plan payment grace period after its due date counts as missed, and the program's number of
      missed plan installments breaks the plan: the plan closes as broken, the loan's original rate and installment
      resume from the next due date, unpaid amounts become past due under the loan's normal rules, and fees waived when
      the plan started are not re-charged. A plan completes when its end date has passed with no missed plan
      installment; a Term Extension Modification completes after its trial payments are all made, and only then do the
      modified rate, installment and extended maturity become the loan's permanent terms. A deferral or Disaster Relief
      plan completes the day after its last deferred due date, and a Servicemember benefit completes once the recorded end
      date has passed. A Charged-Off Settlement Plan completes when the settlement amount has been credited in full,
      which settles the loan.
    eligibility:
      - id: active_plan_only
        applies_to: [hardship_plan_installment_scheduled, hardship_plan_payment_credited]
        kind: state
        condition: Plan installments are scheduled and credited only while the plan is active.
        evidence_fields: [hardship_plans.status, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        state_contract:
          field: hardship_plans.status
          allowed: [active]
    params:
      per_tier:
        Short-Term Payment Deferral: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Reduced Payment Plan: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Temporary Rate Reduction Plan: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Term Extension Modification: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Disaster Relief Deferral: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Servicemember Rate Cap Benefit: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Charged-Off Settlement Plan: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
    formula:
      plan_installment_missed: amount < plan_payment_amount
    measures: [hardship_msr_unpaid_plan_installments]

  - id: hardship_evt_deferral
    subject: [hardship_installment_deferred]
    rule: >-
      Each deferred installment is recorded against the loan due date it replaces, starting at the plan's start date and
      continuing on consecutive due dates. An installment is deferred only once and only while the plan is active.
      A deferred installment is not owed on its due date, is not reported as missed and carries no late fee; it is added
      one month after the maturity date, so each deferral moves next_due_date and maturity_date one month later.
      Interest keeps accruing on unpaid principal during a deferral, so the first payment after the deferral pays the
      interest accrued over the deferred months first, under the loan's normal allocation. A due date that is already
      past due on the decision date can be deferred only under Disaster Relief Deferral.
    eligibility:
      - id: deferral_active_plan
        applies_to: [hardship_installment_deferred]
        kind: state
        condition: An installment is deferred only once and only while the plan is active.
        evidence_fields: [hardship_plans.status, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        state_contract:
          field: hardship_plans.status
          allowed: [active]
      - id: defer_once
        applies_to: [hardship_installment_deferred]
        kind: dedup
        condition: An installment is deferred only once and only while the plan is active.
        evidence_fields: [hardship_plan_events.loan_id, hardship_plan_events.installment_due_date, hardship_plan_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plan_events.loan_id, hardship_plan_events.installment_due_date]
          action_bindings:
            hardship_plan_events.loan_id: loan_id
            hardship_plan_events.installment_due_date: installment_due_date
        dedup_contract:
          table: hardship_plan_events
          mode: separate_record
          object_bindings: {loan_id: loan_id, installment_due_date: installment_due_date}
          duplicate_filters: {event_type: [hardship_installment_deferred]}
          distinct_fields: []
    params:
      per_tier:
        Short-Term Payment Deferral: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Reduced Payment Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Temporary Rate Reduction Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Term Extension Modification: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Disaster Relief Deferral: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Servicemember Rate Cap Benefit: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Charged-Off Settlement Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
    measures: [hardship_msr_deferred_installments_lifetime]

  - id: hardship_scra_benefit
    subject: [hardship_benefit_applied, hardship_plan_end_date_set]
    rule: >-
      The Servicemember Rate Cap Benefit carries out the Servicemembers Civil Relief Act for a borrower who entered
      military service after the loan was funded. Military orders are on file as a recorded military_orders document before the benefit is applied.
      The loan was funded before the military service start date shown on the orders.
      The request is made while the borrower is serving or no later than the program's request window after the end of military service.
      The window is counted in calendar days starting the day after the end of military service, and a request on the last day is in time.
      The benefit applies from the military service start date, even when the request comes later: from that date the
      rate is capped at the program's plan rate, counting interest, fees and charges together, interest above the cap is
      forgiven and never billed later, interest already paid above the cap since the service start date is credited to
      principal, and late and returned-payment fees assessed since the service start date are waived. The installment is
      lowered to the level payment at the capped rate. The benefit lasts until the end of military service, recorded on
      the plan as its end date once the borrower provides it; the borrower does not have to accept terms, and no credit
      reporting or collection consequence may follow from asking for it. A loan whose rate is already at or below the cap
      still gets the fee protection.
    eligibility:
      - id: orders_on_file
        applies_to: [hardship_benefit_applied]
        kind: authorization
        condition: Military orders are on file as a recorded military_orders document before the benefit is applied.
        evidence_fields: [hardship_plan_events.document_type, hardship_plan_events.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plan_events.hardship_plan_id]
          action_bindings:
            hardship_plan_events.hardship_plan_id: hardship_plan_id
      - id: pre_service_loan
        applies_to: [hardship_benefit_applied]
        kind: authorization
        condition: The loan was funded before the military service start date shown on the orders.
        evidence_fields: [loans.funding_date, loans.loan_id, hardship_plans.military_service_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
      - id: service_request_window
        applies_to: [hardship_benefit_applied]
        kind: time
        condition: The request is made while the borrower is serving or no later than the program's request window after the end of military service.
        evidence_fields: [hardship_plans.qualifying_event_date, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the end of military service
          anchor_source: hardship_plans.qualifying_event_date
          relation: not_after
          duration_source: variants.qualifying_event_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the end of military service, and a request on the last day is in time.
          boundary: inclusive
    params:
      per_tier:
        Short-Term Payment Deferral: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Reduced Payment Plan: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Temporary Rate Reduction Plan: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Term Extension Modification: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Disaster Relief Deferral: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Servicemember Rate Cap Benefit: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Charged-Off Settlement Plan: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}

  - id: hardship_disaster_relief
    subject: [hardship_plan_requested, hardship_benefit_applied]
    rule: >-
      Disaster Relief Deferral is for a borrower whose residence on the profile lies in a county covered by a FEMA major
      disaster declaration with Individual Assistance. The request records the declaration number exactly as published and
      the declaration date as the qualifying event date. A Disaster Relief Deferral request is taken only when the current date is no later than the declaration date plus the program's request window.
      The window is counted in calendar days starting the day after the declaration date, and a request on the last day is in time.
      A FEMA registration document must be on file before the deferral is applied; the borrower's word that they live in
      the affected area is not enough. The deferral is applied without an acceptance step for up to the program's
      maximum deferred installments, counted from the loan's next due date on the decision date even if that due date is
      already past due, and late and returned-payment fees assessed on or after the declaration's incident start are
      waived as disaster_relief. A second disaster declaration is a separate qualifying event.
    eligibility:
      - id: disaster_window
        applies_to: [hardship_plan_requested]
        kind: time
        condition: A Disaster Relief Deferral request is taken only when the current date is no later than the declaration date plus the program's request window.
        evidence_fields: [hardship_plans.qualifying_event_date, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the declaration date
          anchor_source: hardship_plans.qualifying_event_date
          relation: not_after
          duration_source: variants.qualifying_event_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the declaration date, and a request on the last day is in time.
          boundary: inclusive
      - id: fema_registration_on_file
        applies_to: [hardship_benefit_applied]
        kind: authorization
        condition: A FEMA registration document must be on file before the deferral is applied; the borrower's word that they live in the affected area is not enough.
        evidence_fields: [hardship_plan_events.document_type, hardship_plan_events.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plan_events.hardship_plan_id]
          action_bindings:
            hardship_plan_events.hardship_plan_id: hardship_plan_id
    params:
      per_tier:
        Short-Term Payment Deferral: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Reduced Payment Plan: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Temporary Rate Reduction Plan: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Term Extension Modification: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Disaster Relief Deferral: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Servicemember Rate Cap Benefit: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Charged-Off Settlement Plan: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}

  - id: hardship_settlement
    subject: [hardship_plan_offered, hardship_plan_completed, hardship_plan_broken]
    rule: >-
      A Charged-Off Settlement Plan resolves a charged-off loan for less than the full balance. A settlement is offered only when the current date is at least the program's minimum days after the loan's charge-off date.
      The days are counted in calendar days starting the day after the charge-off date.
      The borrower chooses a single payment at the lump-sum percent or monthly installments at the installment percent;
      settlement payments post to the loan as payments of type settlement_payment. When the settlement amount has been
      paid in full the plan completes and the loan becomes settled; the forgiven remainder is reported on Form 1099-C
      when it reaches the program's threshold. If a settlement installment is missed past the plan grace period the plan
      breaks, amounts paid stay credited to the balance, and the full remaining charged-off balance is owed again.
    eligibility:
      - id: days_since_charge_off
        applies_to: [hardship_plan_offered]
        kind: time
        condition: A settlement is offered only when the current date is at least the program's minimum days after the loan's charge-off date.
        evidence_fields: [loans.charged_off_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the loan's charge-off date
          anchor_source: loans.charged_off_date
          relation: not_before
