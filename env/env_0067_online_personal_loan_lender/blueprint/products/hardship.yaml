# Larkspur Lending - Hardship Assistance Programs charter (relief arrangements on Larkspur personal loans).
category: hardship
display_name: Hardship Assistance Programs

binding:
  holding_table: hardship_plans
  event_tables: [hardship_plan_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [requested, offered, declined, active, expired, completed, broken, cancelled]
  transitions:
    - {from: requested, to: offered, by: agent, means: The request is reviewed and the program terms are set and presented to the borrower for acceptance.}
    - {from: requested, to: declined, by: agent, means: The request does not meet the program rules or required documents were not received in time.}
    - {from: requested, to: active, by: agent, means: A benefit that needs no borrower acceptance (Disaster Relief Deferral, Servicemember Rate Cap Benefit) is applied directly once its evidence is on file.}
    - {from: offered, to: active, by: user, means: The borrower accepts and e-signs the offered terms.}
    - {from: offered, to: expired, by: system, means: The offer was not accepted within the acceptance window.}
    - {from: offered, to: cancelled, by: user, means: The borrower turns the offer down.}
    - {from: active, to: completed, by: system, means: Every plan month has passed with every plan installment paid, or the benefit period ended.}
    - {from: active, to: broken, by: system, means: A plan installment stayed unpaid past the plan payment grace period, so the plan ends and original terms resume.}
    - {from: active, to: cancelled, by: user, means: The borrower asks to leave the plan early and original terms resume.}

accounts:
  - key: plan_amount_due
    unit: USD
    meaning: Plan installments owed under an active plan and not yet satisfied. Credited (in) by each plan installment scheduled; debited (out) by each loan payment credited toward a plan installment.

# ---- category-level parameter dictionary ----
parameter_schema:
  eligible_loan_statuses: "Loan statuses in which the program can be requested (list of loans.status values)."
  qualifying_reasons: "Hardship reasons (hardship_plans.hardship_reason values) the program accepts."
  required_documents: "Documents (hardship_plan_events.document_type values) that must be received before a decision; any one of a list separated by 'or', all of a list otherwise."
  document_due_days: "Calendar days after the request date to provide required documents before the request is declined; 0 when no documents are required."
  min_months_since_funding: "Whole calendar months the loan must have been funded at the request date."
  min_installments_paid: "Scheduled installments that must have been paid in full since funding at the request date."
  max_days_past_due_at_request: "Highest days past due the loan may have at the request date; 'not applicable' for programs on charged-off loans."
  min_days_since_charge_off: "Calendar days that must have passed since charge-off; 0 for programs on active loans."
  min_documented_income_drop_percent: "Minimum documented drop in monthly household income versus before the hardship, percent; 0 when not required."
  min_principal_balance_usd: "Smallest unpaid principal (charged-off balance for settlement) eligible for the program, USD."
  requires_borrower_acceptance: "Whether the borrower must accept and e-sign offered terms (true) or the benefit is applied directly once its evidence is on file (false)."
  offer_acceptance_days: "Calendar days after the decision date during which offered terms can be accepted; 0 when applied without acceptance."
  decision_business_days: "Business days after all required documents are on file within which a decision is made."
  min_plan_months: "Fewest monthly due dates the plan may cover; 0 when the plan length is set by the benefit period."
  max_plan_months: "Most monthly due dates the plan may cover; 0 when the plan length is set by the benefit period."
  max_deferred_installments_per_plan: "Most installments one plan may move to the end of the term."
  reduced_payment_percent: "Plan installment as a percent of the scheduled installment; 0 when the program does not use a percentage payment."
  min_plan_payment_usd: "Smallest plan installment, USD; 0.00 when there are no plan installments."
  plan_rate_percent: "Fixed interest rate set during the plan, percent; 0 when the program leaves the rate unchanged."
  rate_reduction_points: "Percentage points the base interest rate is permanently reduced by on completion; 0 when not applicable."
  modified_rate_floor_percent: "Lowest rate a permanent modification can set, percent; 0 when not applicable."
  max_term_extension_months: "Most months a permanent modification may add to the remaining term; 0 when not applicable."
  max_total_term_months: "Longest total term (original plus extension) after a modification, months; 0 when not applicable."
  interest_during_plan: "How interest is treated during the plan."
  late_fees_suspended: "Whether late fees are suspended on installments falling due while the plan is active."
  fee_waiver_lookback_days: "Late and returned-payment fees assessed within this many calendar days before the request date are waived when the plan becomes active."
  plan_payment_grace_days: "Calendar days after a plan installment due date before an unpaid plan installment breaks the plan; 0 when there are no plan installments."
  missed_plan_installments_to_break: "Plan installments unpaid past the plan grace period that break the plan; 0 when there are no plan installments."
  counts_toward_relief_limit: "Whether the plan's months count toward the rolling 24-month relief limit."
  max_uses_per_loan: "Most plans of this program per loan over its life; 'no limit' when unlimited."
  min_months_between_uses: "Whole calendar months that must pass after a plan of the same program ends before another can start on the loan; 0 when none."
  rerequest_wait_after_broken_days: "Calendar days after a broken plan before any new request on the loan is taken (other than Disaster Relief or Servicemember benefits)."
  qualifying_event_request_window_days: "Calendar days after the qualifying event within which the request must be made: for Disaster Relief the FEMA declaration date, for Servicemember the end of military service; 0 when there is no window."
  benefit_effective_basis: "Date from which the benefit takes effect."
  first_plan_due_date_rule: "How the first affected due date is chosen."
  deferred_installment_placement: "Where deferred installments go."
  credit_reporting_treatment: "How the loan is reported to the credit bureaus during the plan."
  collections_contact_paused: "Whether collection calls and letters stop while the plan is active."
  autopay_discount_during_plan: "Whether an AutoPay discount keeps applying while the plan is active (plans that set their own rate replace it)."
  plan_fee_usd: "Fee charged to enroll in the program, USD."
  settlement_lump_sum_percent: "Percent of the charged-off balance accepted as a single settlement payment; 0 for other programs."
  settlement_installment_percent: "Percent of the charged-off balance accepted when paid in installments; 0 for other programs."
  settlement_max_installments: "Most monthly installments a settlement may be spread over; 0 for other programs."
  forgiven_balance_tax_form_threshold_usd: "Forgiven amount at or above which a Form 1099-C is issued, USD; 0 when nothing is forgiven."
  scra_fee_cap_included: "Whether fees count toward the program's rate cap (the cap covers interest, fees and charges together)."
  pre_service_obligation_required: "Whether the loan must have been funded before the service start date."
  disaster_declaration_type_required: "FEMA declaration type that must cover the borrower's county; 'not applicable' for other programs."
  request_channels: "Channels through which the program can be requested."
  max_plan_payment_ratio_percent: "Highest plan installment as a percent of the scheduled installment; 0 when not applicable."
  trial_payments_required: "Plan installments that must be paid before modified terms become permanent; 0 when not a modification."

