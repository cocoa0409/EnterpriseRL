# Larkspur Lending - FlexLine personal line of credit charter (unsecured, variable-rate, open-end line with a draw period and a repayment period).
category: line
display_name: FlexLine Personal Lines of Credit

binding:
  holding_table: credit_lines
  event_tables: [line_transactions]
  intake_tables: [line_limit_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {outstanding_balance: line_balance}

lifecycle:
  states: [applied, declined, active, frozen, repayment, closed, charged_off]
  transitions:
    - {from: applied, to: active, by: system, means: The application is approved and the line opens with its credit limit, APR and draw period.}
    - {from: applied, to: declined, by: system, means: The application is declined.}
    - {from: active, to: frozen, by: system, means: Draws are suspended because the line is past due, a payment was returned, fraud review, or at the borrower's request.}
    - {from: frozen, to: active, by: system, means: The freeze condition is cleared and draws are allowed again.}
    - {from: active, to: repayment, by: system, means: The draw period ends; no more draws and the balance is repaid in level payments.}
    - {from: frozen, to: repayment, by: system, means: The draw period ends while draws are frozen.}
    - {from: active, to: repayment, by: user, means: The borrower closes the line to new draws while a balance remains; it is repaid in level payments.}
    - {from: active, to: closed, by: user, means: The borrower closes a line with a 0.00 balance.}
    - {from: repayment, to: closed, by: system, means: The balance of a line in repayment is paid in full.}
    - {from: active, to: charged_off, by: system, means: Charged off for delinquency.}
    - {from: frozen, to: charged_off, by: system, means: Charged off for delinquency.}
    - {from: repayment, to: charged_off, by: system, means: Charged off for delinquency.}

accounts:
  - key: line_balance
    unit: USD
    meaning: Amount owed on the line. Credited (in) by draws, draw fees, interest, annual fees, late and returned-payment fees and returned payments; debited (out) by payments and fee waivers.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_credit_score: "Minimum FICO Score 8 at application (integer)."
  max_dti_percent: "Maximum debt-to-income ratio at application, counting a payment of 3% of the credit limit, percent."
  min_annual_income_usd: "Minimum verified gross annual income, USD."
  min_credit_limit_usd: "Lowest credit limit in the tier, USD; also the floor for a requested decrease."
  max_credit_limit_usd: "Highest credit limit in the tier, USD; also the ceiling for any increase."
  apr_margin_percent: "Percentage points added to the Prime Rate to set the variable APR."
  apr_floor_percent: "Lowest APR the line can carry, percent."
  apr_cap_percent: "Highest APR the line can carry, percent."
  rate_index: "Index the variable APR follows."
  rate_change_effective: "When an index change affects the APR."
  draw_period_months: "Whole calendar months from the open date during which draws are allowed."
  repayment_period_months: "Months over which the balance at the end of the draw period is repaid in level payments."
  min_draw_usd: "Smallest draw, USD."
  max_daily_draws_usd: "Most that may be drawn in one calendar day, USD."
  max_draws_per_billing_cycle: "Most draws per billing cycle (integer)."
  draw_fee_percent: "Draw fee as a percent of each draw."
  draw_fee_min_usd: "Minimum draw fee per draw, USD; 0.00 where there is no draw fee."
  draw_funding_business_days: "Business days after the draw request until funds reach the bank account (0 = same business day when requested by the cutoff)."
  same_day_draw_cutoff_time_et: "Eastern Time cutoff for a draw to be funded the same business day where same-day funding applies (HH:MM)."
  draw_channels: "Channels through which a draw can be requested."
  phone_draw_fee_usd: "Extra fee for a draw taken by a representative by phone, USD."
  annual_fee_usd: "Annual fee charged on each anniversary of the open date, USD."
  annual_fee_first_year_waived: "Whether the annual fee is not charged on the first anniversary."
  interest_method: "How interest is charged."
  statement_closing_days_before_due: "Calendar days before the due date that the billing cycle closes."
  min_payment_percent: "Draw-period minimum payment: percent of the statement balance (plus interest and fees billed in the cycle)."
  min_payment_floor_usd: "Lowest minimum payment in the draw period, USD (or the whole balance if smaller)."
  repayment_payment_method: "Payment once the line is in repayment."
  payment_allocation_order: "Order in which a payment is applied."
  late_fee_grace_days: "Calendar days after the due date before a late fee may be assessed on a minimum payment still unpaid."
  late_fee_usd: "Late fee per missed minimum payment, USD, never more than the minimum payment due."
  returned_payment_fee_usd: "Returned-payment fee per returned payment, USD, never more than the minimum payment due."
  fee_bearing_return_codes: "Return codes that carry a returned-payment fee."
  courtesy_waivers_per_12_months: "Courtesy waivers of a late or returned-payment fee per line in any rolling 12 months (integer)."
  fee_waiver_request_window_days: "Calendar days after a fee's assessment date within which a courtesy waiver may be requested."
  annual_fee_retention_waiver: "Whether an annual fee charged in the last 30 days is waived when the borrower asks to close over it and agrees to keep the line open."
  freeze_days_past_due: "Days past due at which draws are frozen."
  returned_payment_freeze_days: "Calendar days draws stay frozen after a returned payment, counted from the return date, even when the amount is repaid sooner."
  charge_off_days_past_due: "Days past due at which the line is charged off."
  delinquency_reporting_days_past_due: "Days past due at which delinquency is reported to the credit bureaus."
  limit_increase_min_months_open: "Whole calendar months the line must have been open before a limit increase request."
  limit_increase_min_on_time_payments: "Consecutive most recent minimum payments made on time required for an increase (integer)."
  limit_increase_max_percent: "Largest increase granted per request, percent of the current limit (and never above the tier maximum)."
  limit_requests_per_6_months: "Increase requests accepted per line in any rolling 6 months (integer)."
  limit_increase_hard_inquiry: "Whether a limit increase request uses a hard credit inquiry."
  autopay_options: "Amounts AutoPay can debit on each due date."
  autopay_rate_discount_percent: "APR reduction while AutoPay is active, percentage points."
  due_day_changes_per_12_months: "Due-day changes allowed per line in any rolling 12 months (integer)."
  over_limit_fee_usd: "Fee for exceeding the credit limit, USD (draws above available credit are refused instead)."
  prepayment_penalty_usd: "Penalty for paying the balance early, USD."

