# Larkspur Lending - PracticePay patient financing charter (closed-end installment plans used at enrolled healthcare and veterinary providers).
category: pos
display_name: PracticePay Patient Financing

binding:
  holding_table: pos_plans
  event_tables: [pos_transactions]
  intake_tables: [pos_billing_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {plan_balance: plan_balance, deferred_interest_memo: deferred_interest_memo}

lifecycle:
  states: [applied, approved, declined, expired, active, paid_off, cancelled, charged_off]
  transitions:
    - {from: applied, to: approved, by: system, means: The patient (or responsible party) is approved for an amount under the chosen plan at an enrolled provider.}
    - {from: applied, to: declined, by: system, means: The application is declined.}
    - {from: approved, to: expired, by: system, means: The provider did not submit a treatment charge before the approval expired.}
    - {from: approved, to: active, by: system, means: The provider submits the treatment charge and the plan is activated on the date of service.}
    - {from: active, to: paid_off, by: system, means: The plan balance reaches 0.00 through payments (and any refunds).}
    - {from: active, to: cancelled, by: system, means: The provider refunds the full financed amount, so the plan is cancelled.}
    - {from: active, to: charged_off, by: system, means: The plan is charged off after reaching the charge-off delinquency threshold.}
    - {from: charged_off, to: paid_off, by: system, means: The charged-off balance is recovered in full.}

accounts:
  - key: plan_balance
    unit: USD
    meaning: Amount owed on the plan. Credited (in) by the financed treatment charge, monthly interest, billed deferred interest, late and returned-payment fees and returned payments; debited (out) by payments, provider refunds and fee waivers.
  - key: deferred_interest_memo
    unit: USD
    meaning: Deferred interest accrued on a deferred-interest plan but not billed. Credited (in) by each monthly accrual; debited (out) when it is cleared - forgiven because the plan was paid in full within the promotional period, moved to the balance by billing, or removed by a full provider refund.

# ---- category-level parameter dictionary ----
parameter_schema:
  promo_type: "Promotional structure of the plan: deferred_interest, no_interest, reduced_apr or standard."
  promo_months: "Months of the promotional period counted from the purchase date; 0 when the plan has none."
  term_months: "Number of monthly payments in the plan."
  plan_apr_percent: "Plan APR, percent: the APR deferred interest accrues at on deferred-interest plans, the fixed APR on reduced-APR and standard plans, 0.00 on no-interest plans."
  min_credit_score: "Minimum FICO Score 8 of the applicant (integer)."
  min_financed_amount_usd: "Smallest treatment amount the plan finances, USD."
  max_financed_amount_usd: "Largest treatment amount the plan finances, USD."
  eligible_specialties: "Provider specialties (pos_merchants.specialty) that may offer the plan."
  approval_validity_days: "Calendar days after the approval date during which the provider can submit the treatment charge."
  max_charges_per_plan: "Treatment charges one plan may carry (integer); further treatment needs a new plan."
  payment_method: "How the monthly payment is set."
  payment_rounding: "Rounding of the monthly payment."
  min_monthly_payment_usd: "Smallest monthly payment for any plan, USD."
  deferred_interest_applies: "Whether interest accrued during the promotional period is billed if the plan is not paid in full by promo_end_date."
  deferred_interest_accrual_basis: "How deferred interest accrues."
  deferred_interest_billing_timing: "When unpaid-promo deferred interest is billed."
  promo_payoff_test: "Test for forgiving deferred interest."
  interest_method: "How interest is charged on interest-bearing plans."
  statement_closing_days_before_due: "Calendar days before each due date that the monthly statement closes."
  payment_allocation_order: "Order in which a payment is applied."
  excess_payment_treatment: "Treatment of any amount paid beyond the monthly payment due."
  same_day_cutoff_time_et: "Payments submitted by this Eastern Time on a business day are effective that day (HH:MM, 24-hour)."
  debit_card_payment_max_usd: "Largest single debit card payment, USD."
  late_fee_grace_days: "Calendar days after a due date before a late fee may be assessed on a monthly payment still unpaid."
  late_fee_usd: "Late fee per monthly payment missed, USD, never more than the unpaid part of that monthly payment."
  max_late_fees_per_due_date: "Most late fees for one monthly due date (integer)."
  returned_payment_fee_usd: "Fee per returned payment, USD."
  fee_bearing_return_codes: "Return codes that carry a returned-payment fee."
  courtesy_waivers_per_12_months: "Courtesy waivers of a late or returned-payment fee per plan in any rolling 12 months (integer)."
  fee_waiver_request_window_days: "Calendar days after a fee's assessment date within which a courtesy waiver may be requested."
  refund_treatment: "How a provider refund is applied."
  payment_recast_after_refund: "Whether the monthly payment is recalculated after a partial provider refund."
  full_refund_outcome: "Outcome when the provider refunds the full financed amount."
  credit_balance_refund_business_days: "Business days after a credit balance arises within which it is refunded to the patient."
  dispute_window_days: "Calendar days after the purchase date within which a patient can open a billing dispute on the treatment charge."
  dispute_late_fee_protection: "Whether the disputed amount is left out of the amount past due for late fees while the dispute is open."
  dispute_promo_protection: "Whether the disputed amount is left out of the promotional payoff test while the dispute is open."
  post_dispute_payment_days: "Calendar days after a dispute is resolved as no error within which the disputed amount can still be paid to satisfy the promotional payoff test."
  autopay_rate_discount_percent: "Rate discount for AutoPay on PracticePay plans, percentage points."
  due_day_changes_per_plan: "Due-day changes allowed over the life of a plan (integer)."
  prepayment_penalty_usd: "Penalty for paying off early, USD."
  delinquency_reporting_days_past_due: "Days past due at which delinquency is reported to the credit bureaus."
  charge_off_days_past_due: "Days past due at which the plan is charged off."
  responsible_party_allowed: "Whether a parent or guardian may apply as the borrower for a minor patient's or a pet's treatment."
  prequalification_soft_pull: "Whether checking the approved amount uses a soft credit inquiry before the patient accepts the plan."
  max_open_plans_counted_per_provider: "Open plans a patient may hold at the same provider at once (integer)."
  promo_expiration_notice_days: "Calendar days before promo_end_date that the reminder of the payoff amount needed to avoid deferred interest is sent."
  provider_refund_posting_business_days: "Business days after the provider submits a refund within which it posts to the plan."

