# ---- data flow (every write is an event) ----
events:
  - type: protection_enrolled
    target: protection_plans
    mutation: create
    meaning: The borrower enrolls a personal loan in a Payment Protection plan.
    grain: One row per enrollment.
    fields:
      customer_id: Primary borrower.
      loan_id: Protected loan.
      variant_name: Plan chosen.
      enrollment_date: Date enrolled.
      effective_date: Same as enrollment_date.
      free_look_end_date: Enrollment date plus the free-look days.
      joint_insured_name: Second covered person, for joint plans.
      insured_birth_date: Primary covered person's birth date.
    triggers: []
  - type: protection_activated
    target: protection_plans
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The free-look period ends with the plan in force.
    grain: One row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: protection_cancelled
    target: protection_plans
    mutation: {transition: [{from: enrolled, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The borrower cancels the plan.
    grain: One row per transaction.
    fields:
      cancellation_date: Date cancelled.
      closed_date: Same as cancellation_date.
    triggers:
      - event: protection:protection_fee_refunded
        map: {event_date: cancellation_date}
  - type: protection_terminated
    target: protection_plans
    mutation: {transition: [{from: enrolled, to: terminated}, {from: active, to: terminated}]}
    meaning: Coverage ends for a reason other than the borrower's cancellation.
    grain: One row per transaction.
    fields:
      termination_reason: Why coverage ended.
      closed_date: Date coverage ended.
    triggers: []
  - type: protection_fee_charged
    target: protection_events
    meaning: The monthly protection fee for one coverage month is charged.
    grain: One row per coverage month.
    distinguish_by: [coverage_month]
    fields:
      event_date: Loan due date the fee is charged on.
      amount: Fee.
      coverage_month: Coverage month.
      principal_basis: Unpaid principal the fee is computed on (capped).
      loan_id: Protected loan.
    account: protection_fees
    direction: in
    triggers: []
  - type: protection_fee_refunded
    target: protection_events
    meaning: All or the unearned part of one monthly fee is refunded.
    grain: One row per fee refunded.
    distinguish_by: [related_event_id]
    fields:
      event_date: Refund date.
      amount: Amount refunded.
      related_event_id: Fee refunded.
      refund_reason: Basis.
      loan_id: Protected loan.
    account: protection_fees
    direction: out
    triggers: []
  - type: protection_benefit_paid
    target: protection_events
    meaning: A benefit under an approved claim is paid to the protected loan.
    grain: One row per claim per coverage month (one row for a death benefit).
    distinguish_by: [protection_claim_id, coverage_month]
    fields:
      event_date: Loan due date (or the payoff date for a death benefit).
      amount: Benefit.
      coverage_month: Month covered.
      protection_claim_id: Approved claim.
      loan_id: Protected loan.
    account: benefits_paid
    direction: in
    triggers:
      - event: loan:loan_payment_posted
        map: {txn_date: event_date, amount: amount, payment_channel: internal_transfer, payment_type: protection_benefit}
  - type: protection_benefit_reversed
    target: protection_events
    meaning: A benefit paid for a month the covered person no longer qualified is reversed.
    grain: One row per benefit reversed.
    distinguish_by: [related_event_id]
    fields:
      event_date: Reversal date.
      amount: Amount reversed.
      related_event_id: Benefit reversed.
      protection_claim_id: Claim.
      loan_id: Protected loan.
    account: benefits_paid
    direction: out
    triggers: []
  - type: protection_claim_document_received
    target: protection_events
    meaning: A document supporting a claim is received.
    grain: One row per document type per claim per day.
    distinguish_by: [protection_claim_id, document_type, event_date]
    fields:
      event_date: Date received.
      document_type: Kind of document.
      protection_claim_id: Claim.
      loan_id: Protected loan.
    triggers: []

# ---- derived measures ----
measures:
  - id: protection_msr_benefit_months_claim
    window: Life of the claim.
    measure: Count of protection_benefit_paid rows for the claim (protection_claim_id) not reversed by a protection_benefit_reversed row.
  - id: protection_msr_benefit_months_lifetime
    window: Life of the plan.
    measure: Count of protection_benefit_paid rows on the plan for claims of the same claim type, not reversed.
  - id: protection_msr_covered_principal_per_person
    window: As of today.
    measure: Sum of principal_balance of the customer's loans that have a protection plan in enrolled or active status.

# ---- policies ----
policies:
  - id: protection_agg_multi_holding
    subject: [protection_enrolled]
    rule: >-
      Payment Protection is attached loan by loan: a borrower may hold plans on at most max_per_customer loans at once
      (every personal loan they can hold) and no loan may carry more than one plan. The loan has no other Payment Protection plan in enrolled or active status, and a plan cancelled on this loan is never re-enrolled.
    eligibility:
      - id: one_plan_per_loan
        applies_to: [protection_enrolled]
        kind: authorization
        condition: The loan has no other Payment Protection plan in enrolled or active status, and a plan cancelled on this loan is never re-enrolled.
        evidence_fields: [protection_plans.loan_id, protection_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_plans.loan_id]
          action_bindings:
            protection_plans.loan_id: loan_id
    params:
      max_per_customer: 2
      max_plans_per_loan: "=max_plans_per_loan"
      reenrollment_after_cancel: "=reenrollment_after_cancel"

  - id: protection_agg_coverage_limits
    subject: [protection_enrolled, protection_benefit_paid]
    rule: >-
      Coverage limits apply per covered person across all of the borrower's plans. The unpaid principal covered for one
      person across plans may not exceed max_covered_principal_usd; fees are charged, and death benefits paid, only on
      principal up to that amount, taking the older loan first. Lifetime limits on disability and unemployment benefit
      months are counted per plan and claim type; a benefit month that would exceed a per-claim or lifetime limit is not
      paid, and reaching the lifetime limits of every covered event ends the plan as maximum_benefits_paid.
    eligibility: []
    params:
      max_covered_principal_usd: "=max_covered_principal_usd"
      per_tier:
        "Payment Protection Life": {disability_max_months_per_claim: "=disability_max_months_per_claim", disability_max_months_lifetime: "=disability_max_months_lifetime", iu_max_months_per_claim: "=iu_max_months_per_claim", iu_max_months_lifetime: "=iu_max_months_lifetime"}
        "Payment Protection Life and Disability": {disability_max_months_per_claim: "=disability_max_months_per_claim", disability_max_months_lifetime: "=disability_max_months_lifetime", iu_max_months_per_claim: "=iu_max_months_per_claim", iu_max_months_lifetime: "=iu_max_months_lifetime"}
        "Payment Protection Complete": {disability_max_months_per_claim: "=disability_max_months_per_claim", disability_max_months_lifetime: "=disability_max_months_lifetime", iu_max_months_per_claim: "=iu_max_months_per_claim", iu_max_months_lifetime: "=iu_max_months_lifetime"}
        "Joint Payment Protection Life": {disability_max_months_per_claim: "=disability_max_months_per_claim", disability_max_months_lifetime: "=disability_max_months_lifetime", iu_max_months_per_claim: "=iu_max_months_per_claim", iu_max_months_lifetime: "=iu_max_months_lifetime"}
        "Joint Payment Protection Life and Disability": {disability_max_months_per_claim: "=disability_max_months_per_claim", disability_max_months_lifetime: "=disability_max_months_lifetime", iu_max_months_per_claim: "=iu_max_months_per_claim", iu_max_months_lifetime: "=iu_max_months_lifetime"}
        "Joint Payment Protection Complete": {disability_max_months_per_claim: "=disability_max_months_per_claim", disability_max_months_lifetime: "=disability_max_months_lifetime", iu_max_months_per_claim: "=iu_max_months_per_claim", iu_max_months_lifetime: "=iu_max_months_lifetime"}
    measures: [protection_msr_covered_principal_per_person, protection_msr_benefit_months_claim, protection_msr_benefit_months_lifetime]

  - id: protection_enrollment
    subject: [protection_enrolled, protection_activated]
    rule: >-
      Payment Protection is optional; it is never a condition of a loan and declining it never changes a loan's terms.
      The protected loan must be in active status. Enrollment is accepted only when the current date is no later than the loan's funding date plus the enrollment window.
      The enrollment window is counted in calendar days starting the day after the funding date, and enrollment on the last day is in time.
      The loan amount financed must be at least min_loan_amount_usd. Each covered person must be between the minimum and maximum enrollment ages on the enrollment date, counted in whole years from the birth date.
      For plans covering disability or unemployment, each covered person must work at least the plan's minimum hours per
      week on the enrollment date, which the borrower attests. A joint plan covers the borrower and one co-borrower or
      spouse named on the enrollment. The free-look period ends free_look_days calendar days after enrollment, after which
      the plan becomes active.
    eligibility:
      - id: loan_active
        applies_to: [protection_enrolled]
        kind: state
        condition: The protected loan must be in active status.
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active]
      - id: enrollment_window
        applies_to: [protection_enrolled]
        kind: time
        condition: Enrollment is accepted only when the current date is no later than the loan's funding date plus the enrollment window.
        evidence_fields: [loans.funding_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the loan's funding date
          anchor_source: loans.funding_date
          relation: not_after
          duration_source: variants.enrollment_window_days
          unit: calendar_days
          counting_rule: The enrollment window is counted in calendar days starting the day after the funding date, and enrollment on the last day is in time.
          boundary: inclusive
      - id: age_band
        applies_to: [protection_enrolled]
        kind: caller_fact
        condition: Each covered person must be between the minimum and maximum enrollment ages on the enrollment date, counted in whole years from the birth date.
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      min_loan_amount_usd: "=min_loan_amount_usd"
      free_look_days: "=free_look_days"
      voluntary_product: "=voluntary_product"
      min_enrollment_age: "=min_enrollment_age"
      max_enrollment_age: "=max_enrollment_age"
      enrollment_channels: "=enrollment_channels"
      per_tier:
        "Payment Protection Life": {coverage_life: "=coverage_life", coverage_disability: "=coverage_disability", coverage_involuntary_unemployment: "=coverage_involuntary_unemployment", joint_coverage: "=joint_coverage", min_hours_per_week: "=min_hours_per_week"}
        "Payment Protection Life and Disability": {coverage_life: "=coverage_life", coverage_disability: "=coverage_disability", coverage_involuntary_unemployment: "=coverage_involuntary_unemployment", joint_coverage: "=joint_coverage", min_hours_per_week: "=min_hours_per_week"}
        "Payment Protection Complete": {coverage_life: "=coverage_life", coverage_disability: "=coverage_disability", coverage_involuntary_unemployment: "=coverage_involuntary_unemployment", joint_coverage: "=joint_coverage", min_hours_per_week: "=min_hours_per_week"}
        "Joint Payment Protection Life": {coverage_life: "=coverage_life", coverage_disability: "=coverage_disability", coverage_involuntary_unemployment: "=coverage_involuntary_unemployment", joint_coverage: "=joint_coverage", min_hours_per_week: "=min_hours_per_week"}
        "Joint Payment Protection Life and Disability": {coverage_life: "=coverage_life", coverage_disability: "=coverage_disability", coverage_involuntary_unemployment: "=coverage_involuntary_unemployment", joint_coverage: "=joint_coverage", min_hours_per_week: "=min_hours_per_week"}
        "Joint Payment Protection Complete": {coverage_life: "=coverage_life", coverage_disability: "=coverage_disability", coverage_involuntary_unemployment: "=coverage_involuntary_unemployment", joint_coverage: "=joint_coverage", min_hours_per_week: "=min_hours_per_week"}

  - id: protection_evt_fees
    subject: [protection_fee_charged]
    rule: >-
      The fee for each coverage month is the plan's monthly fee per 1,000 USD times the loan's unpaid principal on the
      due date that starts the month (capped at the covered principal), divided by 1,000 and rounded to the cent half up. Fees are charged only while the plan is enrolled or active.
      No fee is charged for a coverage month in which a monthly benefit is paid, or for a due date deferred by a hardship
      plan. The fee is collected together with the installment and does not change the installment amount.
    eligibility:
      - id: plan_in_force
        applies_to: [protection_fee_charged]
        kind: state
        condition: Fees are charged only while the plan is enrolled or active.
        evidence_fields: [protection_plans.status, protection_plans.protection_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_plans.protection_plan_id]
          action_bindings:
            protection_plans.protection_plan_id: protection_plan_id
        state_contract:
          field: protection_plans.status
          allowed: [enrolled, active]
    params:
      fee_basis: "=fee_basis"
      fee_charge_timing: "=fee_charge_timing"
      fee_rounding: "=fee_rounding"
      fee_waived_during_benefit_months: "=fee_waived_during_benefit_months"
      per_tier:
        "Payment Protection Life": {monthly_fee_per_1000_usd: "=monthly_fee_per_1000_usd"}
        "Payment Protection Life and Disability": {monthly_fee_per_1000_usd: "=monthly_fee_per_1000_usd"}
        "Payment Protection Complete": {monthly_fee_per_1000_usd: "=monthly_fee_per_1000_usd"}
        "Joint Payment Protection Life": {monthly_fee_per_1000_usd: "=monthly_fee_per_1000_usd"}
        "Joint Payment Protection Life and Disability": {monthly_fee_per_1000_usd: "=monthly_fee_per_1000_usd"}
        "Joint Payment Protection Complete": {monthly_fee_per_1000_usd: "=monthly_fee_per_1000_usd"}
    formula:
      monthly_fee: round(min(principal_basis, max_covered_principal_usd) * monthly_fee_per_1000_usd / 1000, 2)

  - id: protection_evt_cancellation_and_refunds
    subject: [protection_cancelled, protection_fee_refunded]
    rule: >-
      The borrower may cancel at any time; cancelling is the borrower's own decision and is never done for them. A cancellation during the free-look period refunds every fee charged on the plan only when the current date is no later than the enrollment date plus the free-look days.
      The free-look period is counted in calendar days starting the day after the enrollment date, and a cancellation on the last day is in time.
      A later cancellation refunds only the unearned part of the current coverage month's fee, pro rata by the days left
      in that month (days after the cancellation date divided by the days in the coverage month), as one refund line
      against that month's fee. When coverage terminates for another reason the same pro rata refund applies, and every
      fee charged for a coverage month starting after a date of death is refunded in full. A fee charged in error is
      refunded in full as billing_error. Each fee is refunded at most once. Refunds are credited back the way the fee was collected. A cancelled plan cannot
      be re-enrolled.
    eligibility:
      - id: free_look_window
        applies_to: [protection_fee_refunded]
        kind: time
        condition: A cancellation during the free-look period refunds every fee charged on the plan only when the current date is no later than the enrollment date plus the free-look days.
        evidence_fields: [protection_plans.enrollment_date, protection_plans.protection_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_plans.protection_plan_id]
          action_bindings:
            protection_plans.protection_plan_id: protection_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the enrollment date
          anchor_source: protection_plans.enrollment_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: The free-look period is counted in calendar days starting the day after the enrollment date, and a cancellation on the last day is in time.
          boundary: inclusive
      - id: one_refund_per_fee
        applies_to: [protection_fee_refunded]
        kind: dedup
        condition: Each fee is refunded at most once.
        evidence_fields: [protection_events.related_event_id, protection_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_events.related_event_id]
          action_bindings:
            protection_events.related_event_id: related_event_id
        dedup_contract:
          table: protection_events
          mode: separate_record
          object_bindings: {related_event_id: related_event_id}
          duplicate_filters: {event_type: [protection_fee_refunded]}
          distinct_fields: []
    params:
      cancellation_refund_method: "=cancellation_refund_method"
      refund_on_termination: "=refund_on_termination"
      reenrollment_after_cancel: "=reenrollment_after_cancel"
      free_look_days: "=free_look_days"

  - id: protection_evt_termination
    subject: [protection_terminated, protection_activated]
    rule: >-
      Coverage terminates automatically, with no action by the borrower, when the protected loan is paid off, refinanced,
      settled or charged off (reason loan_paid_off or loan_charged_off), at the first due date after the primary covered
      person reaches coverage_end_age (age_limit_reached), when the lifetime benefit limits of every covered event are used
      (maximum_benefits_paid), or when a death benefit is paid (death_benefit_paid, which takes precedence over
      loan_paid_off when the death benefit is what paid the loan off). Benefits already approved for months before the
      termination date are still paid. A plan whose free look ends with the plan still enrolled becomes active.
    eligibility: []
    params:
      coverage_end_age: "=coverage_end_age"
      terminates_on_loan_closure: "=terminates_on_loan_closure"

  - id: protection_evt_claims_and_benefits
    subject: [protection_benefit_paid, protection_claim_document_received]
    rule: >-
      A benefit is paid only on an approved claim for a protected event the plan covers. Benefits are paid only while the plan is enrolled or active, for loss dates on or after the effective date.
      A claim must have been filed no later than claim_filing_window_days calendar days after its loss date, and its required documents (death certificate; physician statement; or unemployment benefit letter and employer separation notice) must be recorded within claim_document_due_days of filing, or the claim is denied.
      A disability benefit starts once the covered person has been continuously disabled for the elimination days and is
      then paid back to the first day of disability; a disability caused by a condition treated within the look-back
      before enrollment is excluded for the same number of days after enrollment. An unemployment benefit needs an
      involuntary job loss after the exclusion days following enrollment, at least iu_min_prior_employment_months of prior
      full-time work, and the elimination days of continuous unemployment, and is paid from the first due date after them.
      Each monthly benefit equals the loan's scheduled installment on the loss date, up to the maximum monthly benefit,
      and is paid on the loan due date as a loan payment; no benefit is paid for a due date deferred by a hardship plan.
      Continued disability or unemployment must be proved every continued_eligibility_proof_days days. A death benefit
      pays the unpaid principal and accrued interest on the date of death, up to the maximum death benefit, as one
      payment. On joint plans only one disability or unemployment benefit is paid at a time.
    eligibility:
      - id: plan_in_force
        applies_to: [protection_benefit_paid]
        kind: state
        condition: Benefits are paid only while the plan is enrolled or active, for loss dates on or after the effective date.
        evidence_fields: [protection_plans.status, protection_plans.protection_plan_id, protection_plans.effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_plans.protection_plan_id]
          action_bindings:
            protection_plans.protection_plan_id: protection_plan_id
        state_contract:
          field: protection_plans.status
          allowed: [enrolled, active]
      - id: claim_filed_and_documented
        applies_to: [protection_benefit_paid]
        kind: authorization
        condition: A claim must have been filed no later than claim_filing_window_days calendar days after its loss date, and its required documents (death certificate; physician statement; or unemployment benefit letter and employer separation notice) must be recorded within claim_document_due_days of filing, or the claim is denied.
        evidence_fields: [protection_claims.loss_date, protection_claims.filed_date, protection_claims.claim_status, protection_claims.protection_claim_id, protection_events.document_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_claims.protection_claim_id]
          action_bindings:
            protection_claims.protection_claim_id: protection_claim_id
    params:
      claim_filing_window_days: "=claim_filing_window_days"
      claim_document_due_days: "=claim_document_due_days"
      claim_decision_business_days: "=claim_decision_business_days"
      continued_eligibility_proof_days: "=continued_eligibility_proof_days"
      required_claim_documents: "=required_claim_documents"
      monthly_benefit_rule: "=monthly_benefit_rule"
      death_benefit_rule: "=death_benefit_rule"
      max_death_benefit_usd: "=max_death_benefit_usd"
      benefit_payment_timing: "=benefit_payment_timing"
      benefit_during_hardship_plan: "=benefit_during_hardship_plan"
      per_tier:
        "Payment Protection Life": {disability_elimination_days: "=disability_elimination_days", disability_benefit_start: "=disability_benefit_start", disability_preexisting_lookback_days: "=disability_preexisting_lookback_days", iu_elimination_days: "=iu_elimination_days", iu_benefit_start: "=iu_benefit_start", iu_exclusion_days_after_enrollment: "=iu_exclusion_days_after_enrollment", iu_min_prior_employment_months: "=iu_min_prior_employment_months", max_monthly_benefit_usd: "=max_monthly_benefit_usd", joint_benefit_rule: "=joint_benefit_rule"}
        "Payment Protection Life and Disability": {disability_elimination_days: "=disability_elimination_days", disability_benefit_start: "=disability_benefit_start", disability_preexisting_lookback_days: "=disability_preexisting_lookback_days", iu_elimination_days: "=iu_elimination_days", iu_benefit_start: "=iu_benefit_start", iu_exclusion_days_after_enrollment: "=iu_exclusion_days_after_enrollment", iu_min_prior_employment_months: "=iu_min_prior_employment_months", max_monthly_benefit_usd: "=max_monthly_benefit_usd", joint_benefit_rule: "=joint_benefit_rule"}
        "Payment Protection Complete": {disability_elimination_days: "=disability_elimination_days", disability_benefit_start: "=disability_benefit_start", disability_preexisting_lookback_days: "=disability_preexisting_lookback_days", iu_elimination_days: "=iu_elimination_days", iu_benefit_start: "=iu_benefit_start", iu_exclusion_days_after_enrollment: "=iu_exclusion_days_after_enrollment", iu_min_prior_employment_months: "=iu_min_prior_employment_months", max_monthly_benefit_usd: "=max_monthly_benefit_usd", joint_benefit_rule: "=joint_benefit_rule"}
        "Joint Payment Protection Life": {disability_elimination_days: "=disability_elimination_days", disability_benefit_start: "=disability_benefit_start", disability_preexisting_lookback_days: "=disability_preexisting_lookback_days", iu_elimination_days: "=iu_elimination_days", iu_benefit_start: "=iu_benefit_start", iu_exclusion_days_after_enrollment: "=iu_exclusion_days_after_enrollment", iu_min_prior_employment_months: "=iu_min_prior_employment_months", max_monthly_benefit_usd: "=max_monthly_benefit_usd", joint_benefit_rule: "=joint_benefit_rule"}
        "Joint Payment Protection Life and Disability": {disability_elimination_days: "=disability_elimination_days", disability_benefit_start: "=disability_benefit_start", disability_preexisting_lookback_days: "=disability_preexisting_lookback_days", iu_elimination_days: "=iu_elimination_days", iu_benefit_start: "=iu_benefit_start", iu_exclusion_days_after_enrollment: "=iu_exclusion_days_after_enrollment", iu_min_prior_employment_months: "=iu_min_prior_employment_months", max_monthly_benefit_usd: "=max_monthly_benefit_usd", joint_benefit_rule: "=joint_benefit_rule"}
        "Joint Payment Protection Complete": {disability_elimination_days: "=disability_elimination_days", disability_benefit_start: "=disability_benefit_start", disability_preexisting_lookback_days: "=disability_preexisting_lookback_days", iu_elimination_days: "=iu_elimination_days", iu_benefit_start: "=iu_benefit_start", iu_exclusion_days_after_enrollment: "=iu_exclusion_days_after_enrollment", iu_min_prior_employment_months: "=iu_min_prior_employment_months", max_monthly_benefit_usd: "=max_monthly_benefit_usd", joint_benefit_rule: "=joint_benefit_rule"}
    measures: [protection_msr_benefit_months_claim]

  - id: protection_evt_benefit_reversal
    subject: [protection_benefit_reversed]
    rule: >-
      A monthly benefit is reversed when it was paid for a coverage month in which the covered person had already returned
      to work or was no longer disabled, as shown by the proof of continued eligibility or by the employer or physician.
      A benefit is reversed at most once, and only a benefit actually paid can be reversed.
      The loan payment the benefit funded is returned with it, so the installment it covered becomes owed by the borrower
      again under the loan's normal rules; a returned benefit never carries a returned-payment fee. A death benefit is
      never reversed.
    eligibility:
      - id: reverse_once
        applies_to: [protection_benefit_reversed]
        kind: dedup
        condition: A benefit is reversed at most once, and only a benefit actually paid can be reversed.
        evidence_fields: [protection_events.related_event_id, protection_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_events.related_event_id]
          action_bindings:
            protection_events.related_event_id: related_event_id
        dedup_contract:
          table: protection_events
          mode: separate_record
          object_bindings: {related_event_id: related_event_id}
          duplicate_filters: {event_type: [protection_benefit_reversed]}
          distinct_fields: []
    params:
      benefit_overpayment_treatment: "=benefit_overpayment_treatment"
