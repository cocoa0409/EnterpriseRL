# Larkspur Lending - Payment Protection charter (optional debt cancellation and debt suspension agreements attached to personal loans).
category: protection
display_name: Payment Protection

binding:
  holding_table: protection_plans
  event_tables: [protection_events]
  intake_tables: [protection_claims]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [enrolled, active, cancelled, terminated]
  transitions:
    - {from: enrolled, to: active, by: system, means: The free-look period ends with the plan still in force.}
    - {from: enrolled, to: cancelled, by: user, means: The borrower cancels during the free-look period for a full refund of fees.}
    - {from: active, to: cancelled, by: user, means: The borrower cancels after the free-look period.}
    - {from: enrolled, to: terminated, by: system, means: Coverage ends during the free-look period because the loan closed or a death benefit was paid.}
    - {from: active, to: terminated, by: system, means: Coverage ends because the loan closed or was charged off, the age limit was reached, the maximum benefits were paid, or a death benefit was paid.}

accounts:
  - key: protection_fees
    unit: USD
    meaning: Protection fees billed on the plan, net of refunds. Credited (in) by each monthly fee charged; debited (out) by each fee refund.
  - key: benefits_paid
    unit: USD
    meaning: Benefits paid to the protected loan under the plan, net of reversals. Credited (in) by each benefit paid; debited (out) by each benefit reversed.

# ---- category-level parameter dictionary ----
parameter_schema:
  coverage_life: "Whether death of a covered person is a protected event."
  coverage_disability: "Whether disability of a covered person is a protected event."
  coverage_involuntary_unemployment: "Whether involuntary unemployment of a covered person is a protected event."
  joint_coverage: "Whether a second person (co-borrower or spouse) is covered."
  monthly_fee_per_1000_usd: "Monthly fee per 1,000 USD of unpaid principal, USD."
  fee_basis: "Balance the monthly fee is computed on."
  fee_charge_timing: "When the fee is charged."
  fee_rounding: "Rounding of the monthly fee."
  fee_waived_during_benefit_months: "Whether no fee is charged for a coverage month in which a benefit is paid."
  voluntary_product: "Payment Protection is optional and never a condition of getting or keeping a loan."
  min_enrollment_age: "Minimum age of each covered person at enrollment, years."
  max_enrollment_age: "Maximum age of each covered person at enrollment, years."
  coverage_end_age: "Coverage ends at the first due date after the primary covered person reaches this age, years."
  enrollment_window_days: "Calendar days after the loan's funding date during which the borrower may enroll."
  free_look_days: "Calendar days after enrollment during which cancelling refunds every fee charged."
  cancellation_refund_method: "Refund when cancelled after the free look."
  reenrollment_after_cancel: "Whether a cancelled plan can be re-enrolled on the same loan."
  min_loan_amount_usd: "Smallest loan amount financed eligible for a plan, USD."
  max_covered_principal_usd: "Largest unpaid principal a plan covers; principal above it is not cancelled or counted for fees, USD."
  max_death_benefit_usd: "Largest death benefit per plan, USD."
  death_benefit_rule: "What a death benefit pays."
  disability_elimination_days: "Continuous days of disability before benefits begin; 'not covered' where disability is not a protected event."
  disability_benefit_start: "From when disability benefits are paid once the elimination period is met."
  disability_max_months_per_claim: "Most monthly benefits per disability claim."
  disability_max_months_lifetime: "Most monthly disability benefits over the plan's life."
  disability_preexisting_lookback_days: "A condition treated within this many days before enrollment is excluded for the same number of days after enrollment."
  iu_elimination_days: "Continuous days of unemployment before benefits begin; 'not covered' where unemployment is not a protected event."
  iu_benefit_start: "From when unemployment benefits are paid once the elimination period is met."
  iu_max_months_per_claim: "Most monthly unemployment benefits per claim."
  iu_max_months_lifetime: "Most monthly unemployment benefits over the plan's life."
  iu_exclusion_days_after_enrollment: "Job losses within this many days after enrollment are not covered."
  iu_min_prior_employment_months: "Months of continuous full-time employment required before the job loss."
  min_hours_per_week: "Hours per week of work required at the loss date for disability or unemployment coverage; 'not covered' for life-only plans."
  monthly_benefit_rule: "Amount of one monthly disability or unemployment benefit."
  max_monthly_benefit_usd: "Largest monthly disability or unemployment benefit, USD."
  claim_filing_window_days: "Calendar days after the loss date within which a claim must be filed."
  claim_document_due_days: "Calendar days after filing within which the required claim documents must be received before the claim is denied."
  claim_decision_business_days: "Business days after all documents are received within which a claim is decided."
  continued_eligibility_proof_days: "Calendar days between proofs of continued disability or unemployment while benefits are paid."
  required_claim_documents: "Documents required by claim type."
  benefit_payment_timing: "When a monthly benefit is paid."
  benefit_overpayment_treatment: "Treatment of a benefit paid for a month the covered person was no longer disabled or unemployed."
  joint_benefit_rule: "How benefits work on joint plans."
  max_plans_per_loan: "Payment Protection plans allowed on one loan (integer)."
  terminates_on_loan_closure: "Whether coverage ends when the loan is paid off, refinanced, settled or charged off."
  refund_on_termination: "Refund when coverage terminates."
  enrollment_channels: "Channels through which a borrower can enroll."
  benefit_during_hardship_plan: "Whether a monthly benefit is paid for a due date deferred by a hardship plan (no installment is due then)."

