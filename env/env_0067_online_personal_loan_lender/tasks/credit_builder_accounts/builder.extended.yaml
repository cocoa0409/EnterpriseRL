# ---- data flow (every write is an event) ----
events:
  - type: builder_application_submitted
    target: builder_accounts
    mutation: create
    meaning: A customer applies for a Credit Builder account.
    grain: One row per application.
    fields:
      customer_id: Applicant.
      variant_name: Plan chosen.
      application_date: Date applied.
      bank_account_id: Linked checking account for payments and release.
    triggers: []
  - type: builder_account_activated
    target: builder_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: The account activates; the loan amount is deposited into the locked savings certificate.
    grain: One row per transaction.
    fields:
      open_date: Activation date.
      loan_amount: Loan amount.
      admin_fee_amount: Administration fee.
      builder_apr: APR.
      term_months: Term.
      monthly_payment_amount: Monthly payment.
      payment_due_day: Due day.
      next_due_date: First due date.
      maturity_date: Final due date.
    triggers:
      - event: builder:builder_loan_disbursed
        map: {txn_date: open_date, amount: loan_amount}
      - event: builder:builder_certificate_funded
        map: {txn_date: open_date, amount: loan_amount}
      - event: builder:builder_admin_fee_charged
        map: {txn_date: open_date, amount: admin_fee_amount}
  - type: builder_application_cancelled
    target: builder_accounts
    mutation: {transition: {from: applied, to: cancelled}}
    meaning: The application is cancelled before activation, by the applicant or because it lapsed.
    grain: One row per transaction.
    fields:
      closed_date: Date cancelled.
      closure_reason: Set to application_cancelled.
    triggers: []
  - type: builder_account_matured
    target: builder_accounts
    mutation: {transition: {from: active, to: matured}}
    meaning: The final payment is made and the account matures.
    grain: One row per transaction.
    fields:
      closed_date: Maturity closing date.
      closure_reason: Set to matured.
    triggers:
      - event: builder:builder_savings_released
        map: {txn_date: closed_date}
  - type: builder_closed_early
    target: builder_accounts
    mutation: {transition: {from: active, to: closed_early}}
    meaning: The borrower's confirmed early-closure request closes the account.
    grain: One row per transaction.
    fields:
      closed_date: Closing date.
      closure_reason: Set to borrower_early_close.
    triggers:
      - event: builder:builder_savings_applied_to_loan
        map: {txn_date: closed_date}
  - type: builder_closed_delinquent
    target: builder_accounts
    mutation: {transition: {from: active, to: closed_delinquent}}
    meaning: The account is closed for delinquency.
    grain: One row per transaction.
    fields:
      closed_date: Closing date.
      closure_reason: Set to delinquency_close.
    triggers:
      - event: builder:builder_savings_applied_to_loan
        map: {txn_date: closed_date}
  - type: builder_terms_updated
    target: builder_accounts
    mutation: update
    meaning: AutoPay, the due day or the linked payment account changes.
    grain: One row per transaction.
    fields:
      autopay_enrolled: AutoPay on or off.
      payment_due_day: Due day.
      next_due_date: Next due date.
      bank_account_id: Linked checking account.
    triggers: []
  - type: builder_account_status_updated
    target: builder_accounts
    mutation: update
    meaning: Balances and delinquency fields are refreshed after a ledger line posts.
    grain: One row per transaction.
    fields:
      loan_balance: Unpaid loan principal.
      savings_balance: Savings certificate balance.
      fees_balance: Unpaid fees.
      amount_past_due: Amount past due.
      next_due_date: Oldest unpaid due date.
    triggers: []
  - type: builder_loan_disbursed
    target: builder_transactions
    meaning: The loan amount is advanced at activation.
    grain: One row per account (once, at activation).
    distinguish_by: [txn_date]
    fields:
      txn_date: Activation date.
      amount: Loan amount.
    account: builder_loan
    direction: in
    triggers: []
  - type: builder_certificate_funded
    target: builder_transactions
    meaning: The loan amount is deposited into the locked savings certificate.
    grain: One row per account (once, at activation).
    distinguish_by: [txn_date]
    fields:
      txn_date: Activation date.
      amount: Loan amount.
    account: builder_savings
    direction: in
    triggers: []
  - type: builder_admin_fee_charged
    target: builder_transactions
    meaning: The one-time administration fee is collected from the linked account at activation.
    grain: One row per account (once, at activation).
    distinguish_by: [txn_date]
    fields:
      txn_date: Activation date.
      amount: Administration fee.
      bank_account_id: Account debited.
    triggers: []
  - type: builder_payment_posted
    target: builder_transactions
    meaning: A payment is credited to the loan.
    grain: One row per payment received.
    distinguish_by: [txn_date, payment_channel, amount]
    fields:
      txn_date: Effective date.
      amount: Payment.
      payment_channel: How paid.
      bank_account_id: Account debited, for ACH payments.
      interest_portion: Interest paid.
      principal_portion: Principal paid.
      installment_due_date: Oldest due date the payment is applied toward.
    account: builder_loan
    direction: out
    triggers:
      - event: builder:builder_account_status_updated
        map: {}
  - type: builder_payment_returned
    target: builder_transactions
    meaning: A posted payment is returned unpaid and reversed.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Return date.
      amount: Amount returned.
      related_txn_id: Payment returned.
      return_code: Return reason code.
      interest_portion: Interest reversed.
      principal_portion: Principal re-added.
    account: builder_loan
    direction: in
    triggers:
      - event: builder:builder_account_status_updated
        map: {}
      - event: builder:builder_returned_payment_fee_assessed
        when: {return_code: [R01, R02, R03, R04, R08, R09, R16, R20]}
        map: {related_txn_id: builder_txn_id, txn_date: txn_date}
  - type: builder_late_fee_assessed
    target: builder_transactions
    meaning: A late fee is charged for a payment unpaid past the grace period.
    grain: One row per due date.
    distinguish_by: [installment_due_date]
    fields:
      txn_date: Assessment date.
      amount: Fee.
      installment_due_date: Due date the fee is for.
    account: builder_fees_due
    direction: in
    triggers:
      - event: builder:builder_account_status_updated
        map: {}
  - type: builder_returned_payment_fee_assessed
    target: builder_transactions
    meaning: A returned-payment fee is charged for one returned payment.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Assessment date.
      amount: Fee.
      related_txn_id: The return line.
    account: builder_fees_due
    direction: in
    triggers:
      - event: builder:builder_account_status_updated
        map: {}
  - type: builder_fee_waived
    target: builder_transactions
    meaning: A fee is waived.
    grain: One row per fee waived.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Waiver date.
      amount: Amount waived.
      related_txn_id: Fee waived.
      waiver_reason: Basis.
    account: builder_fees_due
    direction: out
    triggers:
      - event: builder:builder_account_status_updated
        map: {}
  - type: builder_fee_paid
    target: builder_transactions
    meaning: Part of a payment, or of savings applied at closing, pays one fee.
    grain: One row per fee per paying line.
    distinguish_by: [related_txn_id, txn_date]
    fields:
      txn_date: Effective date.
      amount: Amount applied to the fee.
      related_txn_id: Fee paid.
    account: builder_fees_due
    direction: out
    triggers: []
  - type: builder_savings_interest_credited
    target: builder_transactions
    meaning: A monthly dividend is credited to the savings certificate.
    grain: One row per month.
    distinguish_by: [statement_month]
    fields:
      txn_date: Last day of the month.
      amount: Dividend.
      statement_month: Month covered.
    account: builder_savings
    direction: in
    triggers: []
  - type: builder_savings_applied_to_loan
    target: builder_transactions
    meaning: At an early or delinquency closing, savings are taken to pay what is owed on the loan.
    grain: One row per closing.
    distinguish_by: [txn_date]
    fields:
      txn_date: Closing date.
      amount: Savings applied (loan balance, closing interest and unpaid fees, capped at the savings balance).
    account: builder_savings
    direction: out
    triggers:
      - event: builder:builder_loan_satisfied_from_savings
        map: {related_txn_id: builder_txn_id, txn_date: txn_date}
  - type: builder_loan_satisfied_from_savings
    target: builder_transactions
    meaning: The loan principal is paid off from the savings applied at closing.
    grain: One row per closing.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Closing date.
      amount: Principal paid from savings.
      related_txn_id: The savings application line.
      interest_portion: Closing interest paid from savings.
      principal_portion: Principal paid from savings.
    account: builder_loan
    direction: out
    triggers: []
  - type: builder_savings_released
    target: builder_transactions
    meaning: The remaining savings are paid out to the borrower.
    grain: One row per release.
    distinguish_by: [txn_date, release_method]
    fields:
      txn_date: Release date.
      amount: Amount released.
      release_method: How paid out.
      bank_account_id: Account credited, for ACH.
    account: builder_savings
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: builder_msr_courtesy_waivers_12m
    window: Rolling 12 months ending today (today and the 364 days before it).
    measure: Count of builder_fee_waived rows on the account with waiver_reason = courtesy and txn_date in the window.
  - id: builder_msr_days_past_due
    window: As of today.
    measure: Calendar days from next_due_date to today when next_due_date is earlier than today and amount_past_due is above 0.00; 0 otherwise.
  - id: builder_msr_one_time_payments_this_month
    window: The calendar month of the payment effective date.
    measure: Count of builder_payment_posted rows on the account with payment_channel other than autopay_ach in that month.

# ---- policies ----
policies:
  - id: builder_agg_multi_holding
    subject: [builder_application_submitted]
    rule: >-
      A customer may hold max_per_customer Credit Builder account at a time. The customer has no other Credit Builder account in applied or active status.
      A customer whose earlier account was closed for delinquency may apply again only once reapply_wait_after_delinquency_close_days calendar days have passed after that closing date, and after an early closure only once the plan's early-close wait has passed.
    eligibility:
      - id: one_open_account
        applies_to: [builder_application_submitted]
        kind: authorization
        condition: The customer has no other Credit Builder account in applied or active status.
        evidence_fields: [builder_accounts.customer_id, builder_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_accounts.customer_id]
          action_bindings:
            builder_accounts.customer_id: customer_id
      - id: reapply_waits
        applies_to: [builder_application_submitted]
        kind: authorization
        condition: A customer whose earlier account was closed for delinquency may apply again only once reapply_wait_after_delinquency_close_days calendar days have passed after that closing date, and after an early closure only once the plan's early-close wait has passed.
        evidence_fields: [builder_accounts.customer_id, builder_accounts.status, builder_accounts.closed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_accounts.customer_id]
          action_bindings:
            builder_accounts.customer_id: customer_id
    params:
      max_per_customer: 1
      reapply_wait_after_delinquency_close_days: "=reapply_wait_after_delinquency_close_days"
      per_tier:
        "Credit Builder 600 Plan": {reapply_wait_after_early_close_days: "=reapply_wait_after_early_close_days"}
        "Credit Builder 1000 Plan": {reapply_wait_after_early_close_days: "=reapply_wait_after_early_close_days"}
        "Credit Builder 1200 Plan": {reapply_wait_after_early_close_days: "=reapply_wait_after_early_close_days"}
        "Credit Builder 1800 Plan": {reapply_wait_after_early_close_days: "=reapply_wait_after_early_close_days"}
        "Credit Builder 2400 Plan": {reapply_wait_after_early_close_days: "=reapply_wait_after_early_close_days"}
        "Credit Builder 3000 Plan": {reapply_wait_after_early_close_days: "=reapply_wait_after_early_close_days"}

  - id: builder_application_and_activation
    subject: [builder_application_submitted, builder_account_activated, builder_application_cancelled, builder_loan_disbursed, builder_certificate_funded, builder_admin_fee_charged]
    rule: >-
      Credit Builder has no minimum credit score; an applicant must meet the minimum age, the plan's minimum monthly income
      and identity verification, and must pay from a linked checking account of their own. The payment account is a linked checking account of the applicant whose verification status is verified.
      An applicant with a Larkspur personal loan, PracticePay plan or FlexLine in charged_off status is declined.
      The account activates activation_business_days business day after approval, once the administration fee is debited:
      the loan amount is advanced and deposited into the locked savings certificate on the same day, the first due date is
      the first due day at least 25 calendar days after activation, and the maturity date is the due date term_months
      payments later. Activation lines are written only for an account in active status. An application not completed
      within application_validity_days calendar days lapses as cancelled, and the applicant may cancel before activation
      at no cost; once active, the administration fee is not refundable.
    eligibility:
      - id: verified_checking
        applies_to: [builder_application_submitted]
        kind: state
        condition: The payment account is a linked checking account of the applicant whose verification status is verified.
        evidence_fields: [bank_accounts.verification_status, bank_accounts.account_type, bank_accounts.bank_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_accounts.bank_account_id]
          action_bindings:
            bank_accounts.bank_account_id: bank_account_id
        state_contract:
          field: bank_accounts.verification_status
          allowed: [verified]
      - id: no_charged_off_credit
        applies_to: [builder_application_submitted]
        kind: authorization
        condition: An applicant with a Larkspur personal loan, PracticePay plan or FlexLine in charged_off status is declined.
        evidence_fields: [loans.status, loans.customer_id, pos_plans.status, pos_plans.customer_id, credit_lines.status, credit_lines.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.customer_id]
          action_bindings:
            loans.customer_id: customer_id
      - id: activation_lines
        applies_to: [builder_loan_disbursed, builder_certificate_funded, builder_admin_fee_charged]
        kind: state
        condition: Activation lines are written only for an account in active status.
        evidence_fields: [builder_accounts.status, builder_accounts.builder_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_accounts.builder_account_id]
          action_bindings:
            builder_accounts.builder_account_id: builder_account_id
        state_contract:
          field: builder_accounts.status
          allowed: [active]
    params:
      min_age_years: "=min_age_years"
      application_validity_days: "=application_validity_days"
      activation_business_days: "=activation_business_days"
      admin_fee_payment_method: "=admin_fee_payment_method"
      first_due_date_min_days_after_activation: 25
      per_tier:
        "Credit Builder 600 Plan": {loan_amount_usd: "=loan_amount_usd", term_months: "=term_months", builder_apr_percent: "=builder_apr_percent", monthly_payment_usd: "=monthly_payment_usd", admin_fee_usd: "=admin_fee_usd", min_monthly_income_usd: "=min_monthly_income_usd"}
        "Credit Builder 1000 Plan": {loan_amount_usd: "=loan_amount_usd", term_months: "=term_months", builder_apr_percent: "=builder_apr_percent", monthly_payment_usd: "=monthly_payment_usd", admin_fee_usd: "=admin_fee_usd", min_monthly_income_usd: "=min_monthly_income_usd"}
        "Credit Builder 1200 Plan": {loan_amount_usd: "=loan_amount_usd", term_months: "=term_months", builder_apr_percent: "=builder_apr_percent", monthly_payment_usd: "=monthly_payment_usd", admin_fee_usd: "=admin_fee_usd", min_monthly_income_usd: "=min_monthly_income_usd"}
        "Credit Builder 1800 Plan": {loan_amount_usd: "=loan_amount_usd", term_months: "=term_months", builder_apr_percent: "=builder_apr_percent", monthly_payment_usd: "=monthly_payment_usd", admin_fee_usd: "=admin_fee_usd", min_monthly_income_usd: "=min_monthly_income_usd"}
        "Credit Builder 2400 Plan": {loan_amount_usd: "=loan_amount_usd", term_months: "=term_months", builder_apr_percent: "=builder_apr_percent", monthly_payment_usd: "=monthly_payment_usd", admin_fee_usd: "=admin_fee_usd", min_monthly_income_usd: "=min_monthly_income_usd"}
        "Credit Builder 3000 Plan": {loan_amount_usd: "=loan_amount_usd", term_months: "=term_months", builder_apr_percent: "=builder_apr_percent", monthly_payment_usd: "=monthly_payment_usd", admin_fee_usd: "=admin_fee_usd", min_monthly_income_usd: "=min_monthly_income_usd"}

  - id: builder_evt_payments
    subject: [builder_payment_posted, builder_payment_returned, builder_fee_paid, builder_terms_updated, builder_account_status_updated]
    rule: >-
      Payments are accepted only on an account in active status. Each payment pays the month's interest (loan balance times APR/1200, rounded to the cent),
      then the principal of the installment, then unpaid fees (each as a fee payment line), then additional principal; a
      monthly payment counts as made once payments credited toward it reach the monthly payment, and amounts beyond it
      reduce principal without advancing next_due_date. A returned payment is reversed in full and its installment is
      unpaid again. One-time payments must be at least one_time_payment_min_usd, debit card payments at most
      debit_card_payment_max_usd, and no more than max_payments_per_month one-time payments are taken per calendar month.
      AutoPay is available with no rate discount; the due day may be changed once per account, to a day from 1 to 28,
      with the first new due date the first date on the new day later than the current next due date. When the loan
      balance reaches 0.00 through payments the account matures.
    eligibility:
      - id: active_account
        applies_to: [builder_payment_posted]
        kind: state
        condition: Payments are accepted only on an account in active status.
        evidence_fields: [builder_accounts.status, builder_accounts.builder_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_accounts.builder_account_id]
          action_bindings:
            builder_accounts.builder_account_id: builder_account_id
        state_contract:
          field: builder_accounts.status
          allowed: [active]
    params:
      interest_method: "=interest_method"
      payment_allocation_order: "=payment_allocation_order"
      excess_payment_treatment: "=excess_payment_treatment"
      one_time_payment_min_usd: "=one_time_payment_min_usd"
      debit_card_payment_max_usd: "=debit_card_payment_max_usd"
      max_payments_per_month: "=max_payments_per_month"
      same_day_cutoff_time_et: "=same_day_cutoff_time_et"
      autopay_rate_discount_percent: "=autopay_rate_discount_percent"
      due_day_changes_per_account: "=due_day_changes_per_account"
      prepayment_penalty_usd: "=prepayment_penalty_usd"
    formula:
      interest_portion: round(loan_balance * builder_apr / 1200, 2)
      principal_portion: min(loan_balance, amount - interest_portion)
    measures: [builder_msr_one_time_payments_this_month]

  - id: builder_evt_late_and_returned_fees
    subject: [builder_late_fee_assessed, builder_returned_payment_fee_assessed]
    rule: >-
      A late fee may be assessed only when the current date is later than the payment due date plus the late-fee grace period.
      The grace period is counted in calendar days starting the day after the payment due date.
      The late fee is late_fee_percent of the monthly payment, rounded to the cent and not more than late_fee_max_usd, at
      most max_late_fees_per_due_date per due date, and only on an account in active status. A returned-payment fee of
      returned_payment_fee_usd is charged once per returned payment whose return code is in fee_bearing_return_codes,
      never for R07, R10, R29 or a chargeback. A missed payment is reported to the credit bureaus once it is
      delinquency_reporting_days_past_due days past due.
    eligibility:
      - id: grace_elapsed
        applies_to: [builder_late_fee_assessed]
        kind: time
        condition: A late fee may be assessed only when the current date is later than the payment due date plus the late-fee grace period.
        evidence_fields: [builder_accounts.next_due_date, builder_accounts.builder_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_accounts.builder_account_id]
          action_bindings:
            builder_accounts.builder_account_id: builder_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the payment due date
          anchor_source: builder_accounts.next_due_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the payment due date.
          boundary: exclusive
    params:
      late_fee_grace_days: "=late_fee_grace_days"
      late_fee_percent: "=late_fee_percent"
      late_fee_max_usd: "=late_fee_max_usd"
      max_late_fees_per_due_date: "=max_late_fees_per_due_date"
      returned_payment_fee_usd: "=returned_payment_fee_usd"
      fee_bearing_return_codes: "=fee_bearing_return_codes"
      delinquency_reporting_days_past_due: "=delinquency_reporting_days_past_due"
    formula:
      late_fee: min(late_fee_max_usd, round(monthly_payment_amount * late_fee_percent / 100, 2))
    measures: [builder_msr_days_past_due]

  - id: builder_evt_fee_waiver
    subject: [builder_fee_waived]
    rule: >-
      A fee may be waived once. A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
      A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
      The window is counted in calendar days starting the day after the fee's assessment date, and a request on the last day is in time.
      Fees caused by a Larkspur error, an unauthorized debit or a documented bank error are waived on those bases without
      window or count. The administration fee is never waived once the account is active.
    eligibility:
      - id: once_per_fee
        applies_to: [builder_fee_waived]
        kind: dedup
        condition: A fee may be waived once.
        evidence_fields: [builder_transactions.related_txn_id, builder_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_transactions.related_txn_id]
          action_bindings:
            builder_transactions.related_txn_id: related_txn_id
        dedup_contract:
          table: builder_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [builder_fee_waived]}
          distinct_fields: []
      - id: courtesy_count
        applies_to: [builder_fee_waived]
        kind: authorization
        condition: A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
        evidence_fields: [builder_transactions.waiver_reason, builder_transactions.txn_date, builder_transactions.builder_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_transactions.builder_account_id]
          action_bindings:
            builder_transactions.builder_account_id: builder_account_id
      - id: courtesy_window
        applies_to: [builder_fee_waived]
        kind: time
        condition: A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
        evidence_fields: [builder_transactions.txn_date, builder_transactions.builder_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_transactions.builder_txn_id]
          action_bindings:
            builder_transactions.builder_txn_id: related_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee's assessment date
          anchor_source: builder_transactions.txn_date
          relation: not_after
          duration_source: variants.fee_waiver_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the fee's assessment date, and a request on the last day is in time.
          boundary: inclusive
    params:
      fee_waiver_request_window_days: "=fee_waiver_request_window_days"
      per_tier:
        "Credit Builder 600 Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "Credit Builder 1000 Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "Credit Builder 1200 Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "Credit Builder 1800 Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "Credit Builder 2400 Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "Credit Builder 3000 Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
    measures: [builder_msr_courtesy_waivers_12m]

  - id: builder_evt_savings
    subject: [builder_savings_interest_credited]
    rule: >-
      The locked savings certificate earns savings_apy_percent APY, credited monthly on the last day of the month as the
      savings balance times the APY divided by 1200, rounded to the cent (nothing when it rounds to 0.00). Dividends are credited only while the account is active.
      Savings cannot be withdrawn, pledged elsewhere or used to make payments while the account is open; they leave the
      certificate only when the account closes.
    eligibility:
      - id: active_for_dividends
        applies_to: [builder_savings_interest_credited]
        kind: state
        condition: Dividends are credited only while the account is active.
        evidence_fields: [builder_accounts.status, builder_accounts.builder_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_accounts.builder_account_id]
          action_bindings:
            builder_accounts.builder_account_id: builder_account_id
        state_contract:
          field: builder_accounts.status
          allowed: [active]
    params:
      savings_apy_percent: "=savings_apy_percent"
      savings_dividend_method: "=savings_dividend_method"
      savings_withdrawal_before_close: "=savings_withdrawal_before_close"
    formula:
      dividend: round(savings_balance * savings_apy_percent / 1200, 2)

  - id: builder_evt_closing_and_release
    subject: [builder_account_matured, builder_closed_early, builder_closed_delinquent, builder_savings_applied_to_loan, builder_loan_satisfied_from_savings, builder_savings_released]
    rule: >-
      An account matures when its final payment brings the loan balance to 0.00; any unpaid fees are then deducted from the
      savings and the rest is released. A borrower may close early at any time: the early-closure request is registered
      first and the account closes only when the borrower confirms it; a request not confirmed within
      closure_confirmation_days calendar days lapses. An account is closed for delinquency once the current date is at least the plan's delinquency-close days past due after the oldest unpaid due date.
      Days past due are counted in calendar days starting the day after the oldest unpaid due date.
      At an early or delinquency closing the savings pay, in order, the closing interest (loan balance times APR/365 times
      the days from the last due date paid through the closing date, rounded to the cent), the loan balance and unpaid
      fees; savings are applied only up to the savings balance, and anything still owed remains a debt of the borrower.
      Savings leave the certificate only once the account has matured or closed. The remaining savings are released within the plan's release business days after the closing date by ACH to the linked
      verified checking account, or by mailed check when the borrower asks for one or the account is no longer verified,
      with no fee either way. A delinquency closing is reported to the credit bureaus; an early closure is reported as
      paid as agreed.
    eligibility:
      - id: delinquency_threshold
        applies_to: [builder_closed_delinquent]
        kind: time
        condition: An account is closed for delinquency once the current date is at least the plan's delinquency-close days past due after the oldest unpaid due date.
        evidence_fields: [builder_accounts.next_due_date, builder_accounts.builder_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_accounts.builder_account_id]
          action_bindings:
            builder_accounts.builder_account_id: builder_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the oldest unpaid due date
          anchor_source: builder_accounts.next_due_date
          relation: not_before
          duration_source: variants.delinquency_close_days_past_due
          unit: calendar_days
          counting_rule: Days past due are counted in calendar days starting the day after the oldest unpaid due date.
          boundary: inclusive
      - id: closed_before_release
        applies_to: [builder_savings_applied_to_loan, builder_savings_released]
        kind: state
        condition: Savings leave the certificate only once the account has matured or closed.
        evidence_fields: [builder_accounts.status, builder_accounts.builder_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_accounts.builder_account_id]
          action_bindings:
            builder_accounts.builder_account_id: builder_account_id
        state_contract:
          field: builder_accounts.status
          allowed: [matured, closed_early, closed_delinquent]
    params:
      closure_confirmation_days: "=closure_confirmation_days"
      closing_interest_method: "=closing_interest_method"
      release_methods: "=release_methods"
      mailed_check_fee_usd: "=mailed_check_fee_usd"
      early_close_allowed: "=early_close_allowed"
      per_tier:
        "Credit Builder 600 Plan": {release_business_days: "=release_business_days", delinquency_close_days_past_due: "=delinquency_close_days_past_due"}
        "Credit Builder 1000 Plan": {release_business_days: "=release_business_days", delinquency_close_days_past_due: "=delinquency_close_days_past_due"}
        "Credit Builder 1200 Plan": {release_business_days: "=release_business_days", delinquency_close_days_past_due: "=delinquency_close_days_past_due"}
        "Credit Builder 1800 Plan": {release_business_days: "=release_business_days", delinquency_close_days_past_due: "=delinquency_close_days_past_due"}
        "Credit Builder 2400 Plan": {release_business_days: "=release_business_days", delinquency_close_days_past_due: "=delinquency_close_days_past_due"}
        "Credit Builder 3000 Plan": {release_business_days: "=release_business_days", delinquency_close_days_past_due: "=delinquency_close_days_past_due"}
    formula:
      savings_applied: min(savings_balance, loan_balance + fees_balance)
      released: savings_balance - savings_applied

  - id: builder_evt_early_closure_request
    subject: [builder_closed_early]
    rule: >-
      Early closure is the borrower's own decision over their savings, so a representative registers the request and the
      borrower confirms it; the account is never closed early on a representative's say-so. The account closes early only when the borrower confirms a pending early-closure request no later than the closure confirmation days after the request date.
      The confirmation period is counted in calendar days starting the day after the request date, and a confirmation on the last day is in time.
      A request names where the remaining savings go: a verified linked checking account of the borrower, or a mailed
      check when none is named. Only one early-closure request may be pending on an account; a borrower who changes their
      mind withdraws it. A confirmed early closure closes the account on the confirmation date, and closing interest is
      counted through that date.
    eligibility:
      - id: confirmation_window
        applies_to: [builder_closed_early]
        kind: time
        condition: The account closes early only when the borrower confirms a pending early-closure request no later than the closure confirmation days after the request date.
        evidence_fields: [builder_closure_requests.request_date, builder_closure_requests.request_status, builder_closure_requests.builder_closure_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [builder_closure_requests.builder_closure_id]
          action_bindings:
            builder_closure_requests.builder_closure_id: builder_closure_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the request date
          anchor_source: builder_closure_requests.request_date
          relation: not_after
          duration_source: variants.closure_confirmation_days
          unit: calendar_days
          counting_rule: The confirmation period is counted in calendar days starting the day after the request date, and a confirmation on the last day is in time.
          boundary: inclusive
    params:
      closure_confirmation_days: "=closure_confirmation_days"
      max_pending_requests_per_account: 1

# ---- extended policies (credit_builder_accounts) ----
extended_policies:
  - id: builder_ext_late_fee_charge
    base_policy_refs: [builder_evt_late_and_returned_fees]
    overwrite:
      - base_policy: builder_evt_late_and_returned_fees
        superseded_clause: >-
          The late fee is late_fee_percent of the monthly payment, rounded to the cent and not more than late_fee_max_usd, at most max_late_fees_per_due_date per due date, and only on an account in active status.
        replaced_by: >-
          A Credit Builder late fee is charged at most once per due date, only for the account's oldest unpaid due date and only on an account in active status; for a late due date with no more than one debit card payment credited toward it, and only for such a due date, its amount is figured as this policy sets out rather than as a flat percentage of the monthly payment; every other late due date remains under the base clause: The late fee is late_fee_percent of the monthly payment, rounded to the cent and not more than late_fee_max_usd, at most max_late_fees_per_due_date per due date, and only on an account in active status.
    trigger: state_due
    subject: [builder_late_fee_assessed]
    computes: late_fee_amount
    target_tool: assess_late_fee_fbf509e1
    params:
      seasoned_first_late_percent: 3.0
      new_account_first_late_percent: 4.0
      seasoned_months: 12
      lookback_months: 12
      return_lookback_months: 3
      two_return_count: 2
      two_return_share: 0.75
      one_return_share: 0.9
      disaster_share: 0.25
      hardship_share: 0.5
      full_share: 1.0
    rule: >-
      A late fee is owed for the account's oldest unpaid due date once its grace period has ended with that installment still unpaid.
      A Credit Builder late fee is charged at most once per due date, only for the account's oldest unpaid due date and only on an account in active status; for a late due date with no more than one debit card payment credited toward it, and only for such a due date, its amount is figured as this policy sets out rather than as a flat percentage of the monthly payment; every other late due date remains under the base clause: The late fee is late_fee_percent of the monthly payment, rounded to the cent and not more than late_fee_max_usd, at most max_late_fees_per_due_date per due date, and only on an account in active status.
      A later due date that lapses while an older installment is still unpaid carries no late fee of its own, so no installment is charged a late fee only because an earlier one is unpaid; once the older installment is paid, the later due date becomes the oldest unpaid due date and its late fee is figured then.
      The late due date is the account's oldest unpaid due date, the next due date the account shows, and the late fee is figured for it.
      The late fee is the plan's late-fee percent of the plan's monthly payment, not more than the plan's late-fee maximum, rounded to the cent.
      Every adjustment below that applies acts on the unrounded fee, the adjustments are multiplied together in any order, and the fee is rounded to the nearest cent once, after all of them, and then held to the late-fee maximum.
      Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up.
      Where one debit card payment has been credited toward the late due date, the fee is figured on the monthly payment less that payment, never on less than zero, instead of on the monthly payment; when a return points at that payment (a chargeback, code CB, or any other return of it), the payment is not netted and the fee is figured on the monthly payment.
      Where no debit card payment has been credited toward the late due date and that due date is the account's maturity date, the fee is figured on the final installment instead, which is the loan balance plus one month of interest on it at the APR divided by 1200, that interest rounded to the nearest cent, a half cent or more rounding up.
      Where neither is the case, the fee is figured on the monthly payment.
      An account with no late fee charged in the 12 whole calendar months before the assessment date (a fee dated on the assessment date counts, and one dated on the same day of the month 12 months earlier falls outside them) that has been open 12 months or more pays the seasoned first-late percent instead of the plan's late-fee percent; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month.
      An account with no late fee charged in those 12 months that has been open fewer than 12 months (whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month) pays the new-account first-late percent instead.
      An account with one or more late fees charged in those 12 months pays the plan's late-fee percent.
      When the borrower has a Larkspur hardship plan in active status under the Disaster Relief Deferral program, the fee is multiplied by the disaster share.
      When the borrower has a Larkspur hardship plan in active status and none of them is under the Disaster Relief Deferral program, the fee is multiplied by the hardship share.
      When the borrower has no Larkspur hardship plan in active status, the fee is not reduced for hardship.
      When two or more payments on the account were returned in the 3 whole calendar months before the assessment date (a return dated on the assessment date counts, and one dated on the same day of the month 3 months earlier falls outside them), the fee is multiplied by the two-return share.
      When exactly one payment on the account was returned in those 3 months, the fee is multiplied by the one-return share.
      When no payment on the account was returned in those 3 months, the fee is not reduced for returned payments.
      A late fee that comes to 0.00 is not charged, and the late due date then needs no late fee; nothing is charged when the late due date already carries its late fee.
    prerequisite: []
    cross_category:
      - category: hardship
        as: existence
        reads: [status, variant_name]
        note: "The hardship reduction tier is decided from the borrower's active Larkspur hardship plans and their program."
    compute:
      - lf_charged: "COUNT('builder_transactions', event_type='builder_late_fee_assessed', installment_due_date=F('next_due_date'))"
      - lf_dc_count: "COUNT('builder_transactions', event_type='builder_payment_posted', payment_channel='debit_card', installment_due_date=F('next_due_date'))"
      - lf_dc_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_posted', payment_channel='debit_card', installment_due_date=F('next_due_date'))"
      - lf_dc_cb: "0 if lf_dc_id == None else COUNT('builder_transactions', event_type='builder_payment_returned', related_txn_id=lf_dc_id)"
      - lf_dc_credit: "0 if (lf_dc_id == None or lf_dc_cb >= 1) else SUM('builder_transactions', 'amount', builder_txn_id=lf_dc_id)"
      - lf_final_gap: "DAYS(F('next_due_date'), F('maturity_date'))"
      - lf_base: "MX(0, F('monthly_payment_amount') - lf_dc_credit) if lf_dc_count >= 1 else ((F('loan_balance') + int((F('loan_balance') * F('builder_apr') / 1200) * 100 + 0.500001) / 100) if lf_final_gap == 0 else F('monthly_payment_amount'))"
      - lf_prior_late: "COUNT('builder_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='builder_late_fee_assessed')"
      - lf_months_open: "MONTHS(F('open_date'), NOW)"
      - lf_pct: "K('seasoned_first_late_percent') if (lf_prior_late == 0 and lf_months_open >= K('seasoned_months')) else (K('new_account_first_late_percent') if (lf_prior_late == 0 and lf_months_open < K('seasoned_months')) else P('late_fee_percent'))"
      - lf_disaster_plan: "EXISTS('hardship', status='active', variant_name='Disaster Relief Deferral')"
      - lf_any_plan: "EXISTS('hardship', status='active')"
      - lf_hardship: "K('disaster_share') if lf_disaster_plan else (K('hardship_share') if lf_any_plan else K('full_share'))"
      - lf_returns: "COUNT('builder_transactions', within_months=K('return_lookback_months'), date_field='txn_date', event_type='builder_payment_returned')"
      - lf_return_share: "K('two_return_share') if lf_returns >= K('two_return_count') else (K('one_return_share') if lf_returns == 1 else K('full_share'))"
      - result: "0 if lf_charged > 0 else (MN(P('late_fee_max_usd'), int((F('monthly_payment_amount') * P('late_fee_percent') / 100) * 100 + 0.500001) / 100) if lf_dc_count >= 2 else MN(P('late_fee_max_usd'), int((lf_base * lf_pct / 100 * lf_hardship * lf_return_share) * 100 + 0.500001) / 100))"
    compute_basis:
      lf_charged: "A Credit Builder late fee is charged at most once per due date, only for the account's oldest unpaid due date and only on an account in active status; for a late due date with no more than one debit card payment credited toward it, and only for such a due date, its amount is figured as this policy sets out rather than as a flat percentage of the monthly payment; every other late due date remains under the base clause: The late fee is late_fee_percent of the monthly payment, rounded to the cent and not more than late_fee_max_usd, at most max_late_fees_per_due_date per due date, and only on an account in active status. A late fee that comes to 0.00 is not charged, and the late due date then needs no late fee; nothing is charged when the late due date already carries its late fee."
      lf_dc_count: "A Credit Builder late fee is charged at most once per due date, only for the account's oldest unpaid due date and only on an account in active status; for a late due date with no more than one debit card payment credited toward it, and only for such a due date, its amount is figured as this policy sets out rather than as a flat percentage of the monthly payment; every other late due date remains under the base clause: The late fee is late_fee_percent of the monthly payment, rounded to the cent and not more than late_fee_max_usd, at most max_late_fees_per_due_date per due date, and only on an account in active status. Where one debit card payment has been credited toward the late due date, the fee is figured on the monthly payment less that payment, never on less than zero, instead of on the monthly payment; when a return points at that payment (a chargeback, code CB, or any other return of it), the payment is not netted and the fee is figured on the monthly payment."
      lf_dc_id: "The late due date is the account's oldest unpaid due date, the next due date the account shows, and the late fee is figured for it. Where one debit card payment has been credited toward the late due date, the fee is figured on the monthly payment less that payment, never on less than zero, instead of on the monthly payment; when a return points at that payment (a chargeback, code CB, or any other return of it), the payment is not netted and the fee is figured on the monthly payment."
      lf_dc_cb: "The late due date is the account's oldest unpaid due date, the next due date the account shows, and the late fee is figured for it. Where one debit card payment has been credited toward the late due date, the fee is figured on the monthly payment less that payment, never on less than zero, instead of on the monthly payment; when a return points at that payment (a chargeback, code CB, or any other return of it), the payment is not netted and the fee is figured on the monthly payment."
      lf_dc_credit: "The late due date is the account's oldest unpaid due date, the next due date the account shows, and the late fee is figured for it. Where one debit card payment has been credited toward the late due date, the fee is figured on the monthly payment less that payment, never on less than zero, instead of on the monthly payment; when a return points at that payment (a chargeback, code CB, or any other return of it), the payment is not netted and the fee is figured on the monthly payment."
      lf_final_gap: "Where no debit card payment has been credited toward the late due date and that due date is the account's maturity date, the fee is figured on the final installment instead, which is the loan balance plus one month of interest on it at the APR divided by 1200, that interest rounded to the nearest cent, a half cent or more rounding up."
      lf_base: "Where one debit card payment has been credited toward the late due date, the fee is figured on the monthly payment less that payment, never on less than zero, instead of on the monthly payment; when a return points at that payment (a chargeback, code CB, or any other return of it), the payment is not netted and the fee is figured on the monthly payment. Where no debit card payment has been credited toward the late due date and that due date is the account's maturity date, the fee is figured on the final installment instead, which is the loan balance plus one month of interest on it at the APR divided by 1200, that interest rounded to the nearest cent, a half cent or more rounding up. Where neither is the case, the fee is figured on the monthly payment. Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up."
      lf_prior_late: "An account with no late fee charged in the 12 whole calendar months before the assessment date (a fee dated on the assessment date counts, and one dated on the same day of the month 12 months earlier falls outside them) that has been open 12 months or more pays the seasoned first-late percent instead of the plan's late-fee percent; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month."
      lf_months_open: "An account with no late fee charged in the 12 whole calendar months before the assessment date (a fee dated on the assessment date counts, and one dated on the same day of the month 12 months earlier falls outside them) that has been open 12 months or more pays the seasoned first-late percent instead of the plan's late-fee percent; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month. An account with no late fee charged in those 12 months that has been open fewer than 12 months (whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month) pays the new-account first-late percent instead. An account with one or more late fees charged in those 12 months pays the plan's late-fee percent."
      lf_pct: "An account with no late fee charged in the 12 whole calendar months before the assessment date (a fee dated on the assessment date counts, and one dated on the same day of the month 12 months earlier falls outside them) that has been open 12 months or more pays the seasoned first-late percent instead of the plan's late-fee percent; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month. An account with no late fee charged in those 12 months that has been open fewer than 12 months (whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month) pays the new-account first-late percent instead. An account with one or more late fees charged in those 12 months pays the plan's late-fee percent."
      lf_disaster_plan: "When the borrower has a Larkspur hardship plan in active status under the Disaster Relief Deferral program, the fee is multiplied by the disaster share."
      lf_any_plan: "When the borrower has a Larkspur hardship plan in active status and none of them is under the Disaster Relief Deferral program, the fee is multiplied by the hardship share."
      lf_hardship: "When the borrower has a Larkspur hardship plan in active status under the Disaster Relief Deferral program, the fee is multiplied by the disaster share. When the borrower has a Larkspur hardship plan in active status and none of them is under the Disaster Relief Deferral program, the fee is multiplied by the hardship share. When the borrower has no Larkspur hardship plan in active status, the fee is not reduced for hardship."
      lf_returns: "When two or more payments on the account were returned in the 3 whole calendar months before the assessment date (a return dated on the assessment date counts, and one dated on the same day of the month 3 months earlier falls outside them), the fee is multiplied by the two-return share."
      lf_return_share: "When two or more payments on the account were returned in the 3 whole calendar months before the assessment date (a return dated on the assessment date counts, and one dated on the same day of the month 3 months earlier falls outside them), the fee is multiplied by the two-return share. When exactly one payment on the account was returned in those 3 months, the fee is multiplied by the one-return share. When no payment on the account was returned in those 3 months, the fee is not reduced for returned payments."
      result: "The late fee is the plan's late-fee percent of the plan's monthly payment, not more than the plan's late-fee maximum, rounded to the cent. Every adjustment below that applies acts on the unrounded fee, the adjustments are multiplied together in any order, and the fee is rounded to the nearest cent once, after all of them, and then held to the late-fee maximum. Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up. A late fee that comes to 0.00 is not charged, and the late due date then needs no late fee; nothing is charged when the late due date already carries its late fee. A Credit Builder late fee is charged at most once per due date, only for the account's oldest unpaid due date and only on an account in active status; for a late due date with no more than one debit card payment credited toward it, and only for such a due date, its amount is figured as this policy sets out rather than as a flat percentage of the monthly payment; every other late due date remains under the base clause: The late fee is late_fee_percent of the monthly payment, rounded to the cent and not more than late_fee_max_usd, at most max_late_fees_per_due_date per due date, and only on an account in active status."
    factors:
      - id: lf_base
        effect: method
        decides: lf_base
        bindings: [lf_dc_id, lf_dc_cb, lf_dc_credit, lf_final_gap, lf_base]
        ladder:
          - when: "one debit card payment has been credited toward the late due date"
            method: "the fee is figured on the monthly payment less that payment, not counted when a return points at it"
          - when: "no debit card payment has been credited toward the late due date and that due date is the account's maturity date"
            method: "the fee is figured on the final installment: the loan balance plus one month of interest on it at the APR divided by 1200, that interest rounded to the cent"
          - when: "otherwise"
            method: "the fee is figured on the monthly payment"
        baseline:
          lf_base: "F('monthly_payment_amount')"
        evidence: [history, date]
        cross_difficulty: null
      - id: lf_pct
        effect: parameter
        decides: lf_pct
        bindings: [lf_prior_late, lf_months_open, lf_pct]
        ladder:
          - when: "no late fee charged in the 12 months before the assessment date and the account open 12 months or more"
            value: "K('seasoned_first_late_percent')"
          - when: "no late fee charged in the 12 months before the assessment date and the account open fewer than 12 months"
            value: "K('new_account_first_late_percent')"
          - when: "otherwise (one or more late fees in those 12 months)"
            value: "P('late_fee_percent')"
        baseline:
          lf_pct: "P('late_fee_percent')"
        evidence: [history, date]
        cross_difficulty: null
      - id: lf_hardship
        effect: parameter
        decides: lf_hardship
        bindings: [lf_disaster_plan, lf_any_plan, lf_hardship]
        ladder:
          - when: "an active Larkspur hardship plan under the Disaster Relief Deferral program"
            value: "K('disaster_share')"
          - when: "an active Larkspur hardship plan, none under the Disaster Relief Deferral program"
            value: "K('hardship_share')"
          - when: "otherwise (no active Larkspur hardship plan)"
            value: "K('full_share')"
        baseline:
          lf_hardship: "K('full_share')"
        evidence: [cross_category]
        cross_difficulty: hardship
      - id: lf_return_share
        effect: parameter
        decides: lf_return_share
        bindings: [lf_returns, lf_return_share]
        ladder:
          - when: "two or more payments on the account returned in the 3 months before the assessment date"
            value: "K('two_return_share')"
          - when: "exactly one payment on the account returned in those 3 months"
            value: "K('one_return_share')"
          - when: "otherwise (no returned payment in those 3 months)"
            value: "K('full_share')"
        baseline:
          lf_return_share: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The late fee is the plan's late-fee percent of the plan's monthly payment, not more than the plan's late-fee maximum, rounded to the cent.
      params: [late_fee_percent, late_fee_max_usd, monthly_payment_usd]
    inputs:
      history:
        - {table: builder_transactions, aggregate: sum, field: amount, filters: {event_type: builder_payment_posted, payment_channel: debit_card}}
        - {table: builder_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: builder_late_fee_assessed}}
        - {table: builder_transactions, aggregate: count, field: txn_date, within_months: 3, filters: {event_type: builder_payment_returned}}
      cross_category: [hardship]
  - id: builder_ext_early_closure_settlement
    base_policy_refs: [builder_evt_closing_and_release, builder_evt_early_closure_request]
    overwrite:
      - base_policy: builder_evt_closing_and_release
        superseded_clause: >-
          At an early or delinquency closing the savings pay, in order, the closing interest (loan balance times APR/365 times the days from the last due date paid through the closing date, rounded to the cent), the loan balance and unpaid fees; savings are applied only up to the savings balance, and anything still owed remains a debt of the borrower.
        replaced_by: >-
          At an early closing, and only at an early closing, the savings applied to the loan are figured as this policy sets out; at a delinquency closing the savings still pay, in order, the closing interest (loan balance times APR/365 times the days from the last due date paid through the closing date, rounded to the cent), the loan balance and unpaid fees, applied only up to the savings balance, with anything still owed remaining a debt of the borrower.
    trigger: on_request
    subject: [builder_closed_early]
    computes: savings_applied_amount
    target_tool: confirm_early_closure_8372931d
    params:
      month_days: 30
      two_payments: 2
      payment_relief_share: 0.5
      other_relief_share: 0.75
      full_share: 1.0
      severe_cause_share: 0.8
      income_cause_share: 0.9
    rule: >-
      At an early closing, and only at an early closing, the savings applied to the loan are figured as this policy sets out; at a delinquency closing the savings still pay, in order, the closing interest (loan balance times APR/365 times the days from the last due date paid through the closing date, rounded to the cent), the loan balance and unpaid fees, applied only up to the savings balance, with anything still owed remaining a debt of the borrower.
      The savings applied at an early closing are fixed only after the account's oldest unpaid due date, once its grace period has ended with the installment still unpaid, carries its late fee, unless that late fee comes to 0.00.
      The early-closure settlement is not figured until the early-closure late-fee relief owed on the account, if any, has been granted.
      The savings applied at an early closing are fixed only once the early-closure returned-fee relief owed on the account, if any, has been granted.
      The savings applied are the closing interest, plus the loan balance, plus the unpaid fees, the total rounded to the cent and not more than the savings balance; the unpaid fees are every late and returned-payment fee charged on the account less every fee waiver and every fee payment booked against them.
      The closing interest is the loan balance times the APR divided by 100 times the interest days divided by 365, rounded to the cent; the interest days are 30 for the month before the oldest unpaid due date plus the calendar days after the oldest unpaid due date up to and including the closing date (the closing date less that due date), a negative count when that due date is still ahead.
      Any adjustment below acts on the unrounded closing interest: a rate below replaces the APR, a day count below replaces the 30 days for the month before the oldest unpaid due date, the interest days are never counted below zero, each share below multiplies the interest, and the closing interest is rounded to the nearest cent once, after all of them.
      Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up.
      When the most recent debit card payment credited toward the oldest unpaid due date has not been returned (no return points at that payment, whether a chargeback, code CB, or any other return), that payment has paid the installment's interest and the interest days count no month before the oldest unpaid due date; when two were posted on the same day, the one booked first counts as the most recent.
      When there is no such debit card payment and two or more whole monthly payments are past due, the interest days count, in place of the 30 days for the month before the oldest unpaid due date, 30 days for each whole monthly payment the account shows past due (the amount past due divided by the monthly payment, rounded down), the oldest unpaid installment included.
      When neither is the case, the interest days count 30 days for the month before the oldest unpaid due date.
      When the borrower has a Larkspur hardship plan in active status under the Servicemember Rate Cap Benefit, the closing interest uses the lower of the APR and that plan's interest rate.
      When the borrower has no such benefit but has a Larkspur hardship plan in active status under the Temporary Rate Reduction Plan, the closing interest uses that plan's interest rate instead of the APR.
      When the borrower has neither, the closing interest uses the APR.
      When the borrower has a Larkspur hardship plan in active status under the Reduced Payment Plan or the Short-Term Payment Deferral, the closing interest is multiplied by the payment-relief share.
      When the borrower has none of those but has a Larkspur hardship plan in active status under the Disaster Relief Deferral or the Term Extension Modification, the closing interest is multiplied by the other-relief share.
      When the borrower has none of those four programs active, the closing interest is not reduced for hardship.
      When the borrower has a Larkspur hardship plan in active status granted for the death of a household earner, a natural disaster or a medical hardship, the closing interest is multiplied by the severe-cause share, since for a Credit Builder borrower in hardship the early closure is the only relief the plan offers.
      When the borrower has none of those but has a Larkspur hardship plan in active status granted for job loss, reduced income or divorce or separation, the closing interest is multiplied by the income-cause share.
      When the borrower has no Larkspur hardship plan in active status granted for any of those causes, the closing interest is not reduced for the cause of hardship.
      A confirmed early closure closes the account on the confirmation date, and closing interest is counted through that date; the remaining savings are released on a business day after the closing date, never on the closing date itself.
      When the savings applied come to 0.00, the early closure is still confirmed with nothing applied to the loan.
    prerequisite:
      - problem: builder_ext_late_fee_charge
        kind: value_input
        gate: cc_fees
        form: state
        policy_source: >-
          The savings applied at an early closing are fixed only after the account's oldest unpaid due date, once its grace period has ended with the installment still unpaid, carries its late fee, unless that late fee comes to 0.00.
        condition: >-
          builder_transactions carries a builder_late_fee_assessed line for the account's next_due_date once its late-fee grace period has ended with the installment unpaid, unless the late fee figured for it comes to 0.00.
        resolved_by: assess_late_fee_fbf509e1
        effect: >-
          The late fee booked for the lapsed due date enters the unpaid fees, so the savings applied grow by that fee.
      - problem: builder_ext_closing_late_fee_relief
        kind: value_input
        gate: cc_fees
        form: action
        policy_source: >-
          The early-closure settlement is not figured until the early-closure late-fee relief owed on the account, if any, has been granted.
        fallback_reason: >-
          The relief is booked as a courtesy waiver against the late fee, the same record a goodwill credit leaves on a late fee, and a relief that is not owed or comes to 0.00 leaves no record at all, so no record-visible state singles out the completed relief.
        condition: >-
          Either a builder_fee_waived line granted by the early-closure late-fee relief points at the account's most recent late fee, or that relief is not owed (no late fee, the fee already waived or paid, or the relief comes to 0.00).
        resolved_by: relieve_late_fee_at_closing_c21c573e
        effect: >-
          The relief lowers the unpaid fees, so the savings applied fall by the relief.
      - problem: builder_ext_closing_returned_fee_relief
        kind: value_input
        gate: cc_fees
        form: action
        policy_source: >-
          The savings applied at an early closing are fixed only once the early-closure returned-fee relief owed on the account, if any, has been granted.
        fallback_reason: >-
          The relief is booked as a courtesy waiver against the returned-payment fee, the same record the made-good relief leaves, and a relief that is not owed or comes to 0.00 leaves no record at all, so no record-visible state singles out the completed relief.
        condition: >-
          Either a builder_fee_waived line granted by the early-closure returned-fee relief points at the returned-payment fee of the account's most recent returned payment, or that relief is not owed (the most recent return carries no fee, the fee already waived or paid, or the relief comes to 0.00).
        resolved_by: relieve_returned_fee_at_closing_90cd40e1
        effect: >-
          The relief lowers the unpaid fees, so the savings applied fall by the relief.
    cross_category:
      - category: hardship
        as: branch
        reads: [status, variant_name, plan_interest_rate, hardship_reason]
        note: "The closing-interest rate, the hardship share and the hardship-cause share are decided from the borrower's active Larkspur hardship plans, their programs, causes and plan rates."
    compute:
      - cc_fees: "SUM('builder_transactions', 'amount', event_type='builder_late_fee_assessed') + SUM('builder_transactions', 'amount', event_type='builder_returned_payment_fee_assessed') - SUM('builder_transactions', 'amount', event_type='builder_fee_waived') - SUM('builder_transactions', 'amount', event_type='builder_fee_paid')"
      - cc_dc_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_posted', payment_channel='debit_card', installment_due_date=F('next_due_date'))"
      - cc_dc_cb: "0 if cc_dc_id == None else COUNT('builder_transactions', event_type='builder_payment_returned', related_txn_id=cc_dc_id)"
      - cc_lead: "0 if (cc_dc_id != None and cc_dc_cb == 0) else ((int(F('amount_past_due') / F('monthly_payment_amount')) * K('month_days')) if F('amount_past_due') >= K('two_payments') * F('monthly_payment_amount') else K('month_days'))"
      - cc_scra: "CFIELD('hardship', 'plan_interest_rate', status='active', variant_name='Servicemember Rate Cap Benefit')"
      - cc_trr: "CFIELD('hardship', 'plan_interest_rate', status='active', variant_name='Temporary Rate Reduction Plan')"
      - cc_rate: "MN(F('builder_apr'), cc_scra) if cc_scra != None else (cc_trr if cc_trr != None else F('builder_apr'))"
      - cc_rpp: "EXISTS('hardship', status='active', variant_name='Reduced Payment Plan')"
      - cc_stpd: "EXISTS('hardship', status='active', variant_name='Short-Term Payment Deferral')"
      - cc_drd: "EXISTS('hardship', status='active', variant_name='Disaster Relief Deferral')"
      - cc_tem: "EXISTS('hardship', status='active', variant_name='Term Extension Modification')"
      - cc_hardship: "K('payment_relief_share') if (cc_rpp or cc_stpd) else (K('other_relief_share') if (cc_drd or cc_tem) else K('full_share'))"
      - cc_severe: "EXISTS('hardship', status='active', hardship_reason='death_of_household_earner') or EXISTS('hardship', status='active', hardship_reason='natural_disaster') or EXISTS('hardship', status='active', hardship_reason='medical_hardship')"
      - cc_income: "EXISTS('hardship', status='active', hardship_reason='job_loss') or EXISTS('hardship', status='active', hardship_reason='reduced_income') or EXISTS('hardship', status='active', hardship_reason='divorce_or_separation')"
      - cc_cause: "K('severe_cause_share') if cc_severe else (K('income_cause_share') if cc_income else K('full_share'))"
      - cc_interest: "int((F('loan_balance') * cc_rate / 100 * MX(0, cc_lead + DAYS(F('next_due_date'), NOW)) / 365 * cc_hardship * cc_cause) * 100 + 0.500001) / 100"
      - result: "MN(F('savings_balance'), int((cc_interest + F('loan_balance') + cc_fees) * 100 + 0.500001) / 100)"
