      rf_bearing: "A Credit Builder returned-payment fee is charged once per returned payment and only for the account's most recent returned payment and only when that payment's return code is one of the plan's fee-bearing return codes (R01, R02, R03, R04, R08, R09, R16 and R20 on every Credit Builder plan), never for R07, R10, R29 or a chargeback, and its amount is figured as this policy sets out rather than as the plan's flat returned-payment fee. Nothing is charged, and the returned payment needs no fee, when the account's most recent returned payment carries a code outside those fee-bearing codes, when a returned-payment fee has already been charged for it, or when the fee comes to 0.00."
      rf_charged: "Nothing is charged, and the returned payment needs no fee, when the account's most recent returned payment carries a code outside those fee-bearing codes, when a returned-payment fee has already been charged for it, or when the fee comes to 0.00."
