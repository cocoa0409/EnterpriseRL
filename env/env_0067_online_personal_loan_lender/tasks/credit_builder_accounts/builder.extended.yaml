        ladder:
          - when: "a PracticePay payment returned in the 12 whole calendar months before today"
            value: "K('pos_return_buffer')"
          - when: "no such return but a PracticePay late fee in those months"
            value: "K('pos_late_buffer')"
          - when: "otherwise"
            value: "K('no_buffer')"
        baseline:
          ad_pos_buf: "K('no_buffer')"
        evidence: [cross_category, history]
        cross_difficulty: pos
    baseline:
      rule: >-
        The due day stays the account's current due day.
      params: []
    inputs:
      history:
        - {table: builder_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: builder_payment_returned}}
        - {category: line, table: line_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: line_payment_returned}}
        - {category: loan, table: loan_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: loan_payment_returned}}
        - {category: pos, table: pos_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: pos_payment_returned}}
      cross_category: [line, loan, pos]
