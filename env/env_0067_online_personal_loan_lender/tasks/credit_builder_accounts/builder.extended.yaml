    compute:
      - rf_ret_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_returned')"
      - rf_bearing: "COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R01') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R02') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R03') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R04') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R08') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R09') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R16') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R20')"
      - rf_charged: "0 if rf_ret_id == None else COUNT('builder_transactions', event_type='builder_returned_payment_fee_assessed', related_txn_id=rf_ret_id)"
      - rf_amount: "0 if rf_ret_id == None else SUM('builder_transactions', 'amount', builder_txn_id=rf_ret_id)"
      - rf_base: "((MN(P('returned_payment_fee_usd'), rf_amount * K('small_payment_fee_percent') / 100) if rf_amount < F('monthly_payment_amount') else P('returned_payment_fee_usd')) if rf_amount >= P('returned_payment_fee_usd') else rf_amount)"
      - rf_other_returns: "COUNT('builder_transactions', within_months=K('return_lookback_months'), date_field='txn_date', event_type='builder_payment_returned') - 1"
      - rf_history: "K('first_return_share') if rf_other_returns <= 0 else (K('second_return_share') if rf_other_returns == 1 else K('full_share'))"
      - rf_line_month: "XCOUNT('line', 'line_transactions', within_months=K('line_recent_months'), date_field='txn_date', event_type='line_payment_returned')"
      - rf_line_quarter: "XCOUNT('line', 'line_transactions', within_months=K('line_quarter_months'), date_field='txn_date', event_type='line_payment_returned')"
      - rf_other_line: "K('same_month_other_line_share') if rf_line_month >= 1 else (K('same_quarter_other_line_share') if rf_line_quarter >= 1 else K('full_share'))"
      - rf_r09: "COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R09')"
      - rf_acct: "COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R02') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R03') + COUNT('builder_transactions', builder_txn_id=rf_ret_id, return_code='R04')"
      - rf_reason: "K('uncollected_funds_share') if rf_r09 >= 1 else (K('account_problem_share') if rf_acct >= 1 else K('full_share'))"
      - rf_months: "MONTHS(F('open_date'), NOW)"
      - rf_credited: "COUNT('builder_transactions', event_type='builder_payment_posted') - COUNT('builder_transactions', event_type='builder_payment_returned')"
      - rf_seasoning: "K('seasoned_share') if (rf_months >= K('seasoned_months') and rf_credited >= K('seasoned_payments')) else (K('established_share') if (rf_months >= K('established_months') and rf_credited >= K('established_payments')) else K('full_share'))"
      - result: "0 if (rf_ret_id == None or rf_bearing == 0 or rf_charged > 0) else int((rf_base * rf_history * rf_other_line * rf_reason * rf_seasoning) * 100 + 0.500001) / 100"
    compute_basis:
