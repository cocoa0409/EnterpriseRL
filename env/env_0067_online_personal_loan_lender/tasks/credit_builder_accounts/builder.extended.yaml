        - {table: builder_transactions, aggregate: latest, field: amount, filters: {event_type: builder_returned_payment_fee_assessed}}
        - {table: builder_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: builder_payment_returned}}
        - {table: builder_transactions, aggregate: count, field: txn_date, filters: {event_type: builder_payment_posted}}
        - {category: line, table: line_transactions, aggregate: count, field: txn_date, within_months: 6, filters: {event_type: line_payment_posted}}
      cross_category: [line]
  - id: builder_ext_goodwill_late_fee_credit
    base_policy_refs: [builder_evt_fee_waiver]
    overwrite:
      - base_policy: builder_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
        replaced_by: >-
          A goodwill credit on a late fee is a courtesy waiver granted on the borrower's request when fewer than the plan's courtesy waivers per 12 months have been granted on the account, and it credits the part of the late fee this policy sets out rather than the whole fee; a returned-payment fee relief once its payment has been made good and the early-closure late-fee and returned-fee reliefs each follow their own rule, and any other courtesy waiver is still granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
    trigger: on_request
    subject: [builder_fee_waived]
    computes: credit_amount
    target_tool: credit_goodwill_late_fee_43fbbd15
    params:
      base_goodwill_share: 0.2
      full_share: 1.0
      long_tenure_months: 24
      tenure_months: 12
      long_tenure_add: 0.1
      tenure_add: 0.05
      loan_clean_add: 0.05
      loan_late_add: 0.02
      clean_history_add: 0.05
      one_late_add: 0.02
      clean_autopay_add: 0.05
      autopay_add: 0.02
      autopay_return_months: 3
      prompt_request_add: 0.05
      later_request_add: 0.02
      prompt_request_days: 10
      later_request_days: 30
      lookback_months: 12
      return_month: 1
      no_add: 0.0
      waiver_lookback_months: 12
    rule: >-
      A goodwill credit on a late fee is a courtesy waiver granted on the borrower's request when fewer than the plan's courtesy waivers per 12 months have been granted on the account, and it credits the part of the late fee this policy sets out rather than the whole fee; a returned-payment fee relief once its payment has been made good and the early-closure late-fee and returned-fee reliefs each follow their own rule, and any other courtesy waiver is still granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
      The goodwill credit applies to the account's most recent late fee; when two late fees were charged on the same day, the one booked first counts as the most recent.
      The goodwill credit is not granted, and nothing is booked, when the account has no late fee, when its most recent late fee already carries a fee waiver or a fee payment, when the plan's courtesy waivers have all been granted on the account in the 12 whole calendar months before today (a waiver dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), when the request comes more than the fee waiver request window after the fee's assessment date (counted in calendar days from the day after it, a request on the last day being in time), or when the credit comes to 0.00.
      While the account has a pending early-closure request, the early-closure late-fee relief takes priority over a goodwill credit on the same late fee, and the goodwill credit is not granted.
      The goodwill credit is figured only once the account's most recent returned payment, when its return code carries a fee, shows its returned-payment fee on the account, unless that fee comes to 0.00.
      The goodwill credit is figured only after the made-good relief owed on the account, if any, has been granted.
      A goodwill credit for a borrower whose most recent AutoPay debit (the latest payment made through the AutoPay channel; when two were posted on the same day, the one booked first counts as the latest) was returned, the return line pointing at it being dated in the 3 whole calendar months before today (a return dated today counts, and one dated on the same day of the month 3 months earlier falls outside them), is not granted until the account is enrolled in AutoPay.
      The goodwill credit is the base goodwill share of the late fee, rounded to the cent.
      Every share addition below is added to the base goodwill share, the total share is never more than 100 percent, the total share is applied to the amount the rule on the credit's base sets, and the credit is rounded to the nearest cent once and is never more than the late fee.
      Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up.
      When a payment on the account was returned less than one whole calendar month before today (a return dated today counts, and one dated on the same day of the month one month earlier falls outside), the credit is figured on the account's unpaid fees, that is the late fee together with every other fee still unpaid.
      When no payment was returned in that month but an AutoPay debit (a payment made through the AutoPay channel) was posted toward the due date the late fee is for, the credit is figured on the late fee plus every returned-payment fee charged in the 3 whole calendar months before today (a fee dated today counts, and one dated on the same day of the month 3 months earlier falls outside them).
      Otherwise the credit is figured on the late fee.
      An account open 24 months or more adds the long-tenure addition; an account open at least 12 but fewer than 24 months adds the tenure addition; an account open fewer than 12 months adds nothing for tenure; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month.
      A borrower who holds a Larkspur personal loan in active status with no late fee charged on any Larkspur personal loan in the 12 whole calendar months before today (a line dated today counts, and one dated on the same day of the month 12 months earlier falls outside them) adds the clean-loan addition; one who holds such a loan with one or more such late fees adds the loan addition; a borrower with no active Larkspur personal loan adds nothing for a loan.
      When no late fee other than this one was charged on the account in the 12 whole calendar months before today (a line dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the clean-history addition is added; when exactly one other was, the one-late addition; when two or more were, nothing is added for late history.
      When the account is enrolled in AutoPay and no payment on it was returned in the 3 whole calendar months before today (a return dated today counts, and one dated on the same day of the month 3 months earlier falls outside them), the clean AutoPay addition is added; when it is enrolled in AutoPay and one or more payments were returned in those months, the AutoPay addition; when it is not enrolled, nothing is added for AutoPay.
      When the late fee was charged 10 or fewer calendar days before the request (the request date, which is today, less the fee's date), the prompt-request addition is added; when 11 to 30 days before, the later-request addition; when longer ago, nothing is added for promptness.
    prerequisite:
      - problem: builder_ext_returned_payment_fee_charge
        kind: value_input
        gate: gw_base
        form: state
        policy_source: >-
          The goodwill credit is figured only once the account's most recent returned payment, when its return code carries a fee, shows its returned-payment fee on the account, unless that fee comes to 0.00.
        condition: >-
          The account's most recent builder_payment_returned line, when its return code is fee-bearing, has a builder_returned_payment_fee_assessed line pointing at it, unless the fee figured for it comes to 0.00.
        resolved_by: assess_returned_payment_fee_1f748b6c
        effect: >-
          The returned-payment fee joins the unpaid fees the credit is figured on.
      - problem: builder_ext_returned_fee_relief
        kind: value_input
        gate: gw_base
        form: action
        policy_source: >-
          The goodwill credit is figured only after the made-good relief owed on the account, if any, has been granted.
        fallback_reason: >-
          The made-good relief is booked as a courtesy waiver against the returned-payment fee, the same record the early-closure returned-fee relief leaves, and a relief that is not owed or comes to 0.00 leaves no record at all, so no record-visible state singles out the completed relief.
        condition: >-
          Either a builder_fee_waived line granted by the made-good relief points at the returned-payment fee of the account's most recent returned payment, or that relief is not owed (no fee, not made good, the fee already waived or paid, the courtesy waivers used up, a pending early-closure request, or the relief comes to 0.00).
        resolved_by: relieve_returned_payment_fee_d8e21ef6
        effect: >-
          The relief lowers the unpaid fees the credit is figured on.
      - problem: builder_ext_autopay_reenrollment
        kind: state_gate
        gate: builder_accounts.autopay_enrolled
        form: state
        policy_source: >-
          A goodwill credit for a borrower whose most recent AutoPay debit (the latest payment made through the AutoPay channel; when two were posted on the same day, the one booked first counts as the latest) was returned, the return line pointing at it being dated in the 3 whole calendar months before today (a return dated today counts, and one dated on the same day of the month 3 months earlier falls outside them), is not granted until the account is enrolled in AutoPay.
        condition: >-
          builder_accounts.autopay_enrolled is true for an account whose most recent builder_payment_posted line with payment_channel autopay_ach has a builder_payment_returned line pointing at it, dated in the 3 whole calendar months before today.
        resolved_by: reenroll_autopay_5af065e7
        effect: >-
          The credit may be granted; the AutoPay addition then reads the enrolled account.
    cross_category:
      - category: loan
        as: history
        reads: [status, loan_transactions.event_type, loan_transactions.txn_date]
        note: "The loan addition is decided from the borrower's active personal loans and the late fees on the personal-loan ledger."
    compute:
      - gw_fee_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_late_fee_assessed')"
      - gw_fee: "0 if gw_fee_id == None else SUM('builder_transactions', 'amount', builder_txn_id=gw_fee_id)"
      - gw_fee_due: "None if gw_fee_id == None else LATEST('builder_transactions', 'installment_due_date', date_field='txn_date', builder_txn_id=gw_fee_id)"
      - gw_fee_date: "None if gw_fee_id == None else LATEST('builder_transactions', 'txn_date', date_field='txn_date', builder_txn_id=gw_fee_id)"
      - gw_settled: "0 if gw_fee_id == None else COUNT('builder_transactions', event_type='builder_fee_waived', related_txn_id=gw_fee_id) + COUNT('builder_transactions', event_type='builder_fee_paid', related_txn_id=gw_fee_id)"
      - gw_used: "COUNT('builder_transactions', within_months=K('waiver_lookback_months'), date_field='txn_date', event_type='builder_fee_waived', waiver_reason='courtesy')"
      - gw_pending: "COUNT('builder_closure_requests', request_status='pending_confirmation')"
      - gw_ap_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_posted', payment_channel='autopay_ach')"
      - gw_ap_returned: "0 if gw_ap_id == None else COUNT('builder_transactions', within_months=K('autopay_return_months'), date_field='txn_date', event_type='builder_payment_returned', related_txn_id=gw_ap_id)"
      - gw_owed: "gw_fee_id != None and gw_settled == 0 and gw_used < P('courtesy_waivers_per_12_months') and gw_pending == 0 and DAYS(gw_fee_date, NOW) <= P('fee_waiver_request_window_days') and (gw_ap_returned == 0 or F('autopay_enrolled') == True)"
      - gw_recent_return: "COUNT('builder_transactions', within_months=K('return_month'), date_field='txn_date', event_type='builder_payment_returned')"
      - gw_autopay_toward: "COUNT('builder_transactions', event_type='builder_payment_posted', payment_channel='autopay_ach', installment_due_date=gw_fee_due)"
      - gw_base: "0 if gw_fee_id == None else (F('fees_balance') if gw_recent_return >= 1 else ((gw_fee + SUM('builder_transactions', 'amount', within_months=K('autopay_return_months'), date_field='txn_date', event_type='builder_returned_payment_fee_assessed')) if gw_autopay_toward >= 1 else gw_fee))"
      - gw_months: "MONTHS(F('open_date'), NOW)"
      - gw_tenure: "K('long_tenure_add') if gw_months >= K('long_tenure_months') else (K('tenure_add') if gw_months >= K('tenure_months') else K('no_add'))"
      - gw_loan_active: "EXISTS('loan', status='active')"
      - gw_loan_late: "XCOUNT('loan', 'loan_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='loan_late_fee_assessed')"
      - gw_loan: "K('loan_clean_add') if (gw_loan_active and gw_loan_late == 0) else (K('loan_late_add') if (gw_loan_active and gw_loan_late >= 1) else K('no_add'))"
      - gw_other_late: "COUNT('builder_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='builder_late_fee_assessed') - 1"
      - gw_history: "K('clean_history_add') if gw_other_late <= 0 else (K('one_late_add') if gw_other_late == 1 else K('no_add'))"
      - gw_returns_3m: "COUNT('builder_transactions', within_months=K('autopay_return_months'), date_field='txn_date', event_type='builder_payment_returned')"
      - gw_autopay: "K('clean_autopay_add') if (F('autopay_enrolled') == True and gw_returns_3m == 0) else (K('autopay_add') if (F('autopay_enrolled') == True and gw_returns_3m >= 1) else K('no_add'))"
      - gw_fee_age: "None if gw_fee_date == None else DAYS(gw_fee_date, NOW)"
      - gw_speed: "K('no_add') if gw_fee_age == None else (K('prompt_request_add') if gw_fee_age <= K('prompt_request_days') else (K('later_request_add') if gw_fee_age <= K('later_request_days') else K('no_add')))"
      - result: "0 if not gw_owed else MN(gw_fee, int((gw_base * MN(K('full_share'), K('base_goodwill_share') + gw_tenure + gw_loan + gw_history + gw_autopay + gw_speed)) * 100 + 0.500001) / 100)"
