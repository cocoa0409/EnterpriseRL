        effect: parameter
        decides: cc_rate
        bindings: [cc_scra, cc_trr, cc_rate]
        ladder:
          - when: "an active Servicemember Rate Cap Benefit"
            value: "the lower of the APR and that plan's interest rate"
          - when: "no such benefit but an active Temporary Rate Reduction Plan"
            value: "that plan's interest rate"
          - when: "otherwise"
            value: "F('builder_apr')"
        baseline:
