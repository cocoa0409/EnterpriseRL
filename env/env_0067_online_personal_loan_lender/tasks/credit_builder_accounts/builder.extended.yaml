        bindings: [cc_dc_id, cc_dc_cb, cc_lead]
        ladder:
          - when: "the most recent debit card payment credited toward the oldest unpaid due date has not been returned (no return points at it)"
            method: "no month before the oldest unpaid due date is counted"
          - when: "no such debit card payment and two or more whole monthly payments past due"
            method: "30 days for each whole monthly payment past due"
          - when: "otherwise"
            method: "30 days for the month before the oldest unpaid due date"
        baseline:
