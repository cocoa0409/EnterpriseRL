    factors:
      - id: gw_base
        effect: method
        decides: gw_base
        bindings: [gw_fee_due, gw_recent_return, gw_autopay_toward, gw_base]
        ladder:
          - when: "a payment returned less than one whole calendar month before today"
            method: "the credit is figured on the account's unpaid fees"
          - when: "no return in that month but an AutoPay debit (made through the AutoPay channel) posted toward the late fee's due date"
            method: "the credit is figured on the late fee plus the returned-payment fees of the 3 whole calendar months before today"
          - when: "otherwise"
            method: "the credit is figured on the late fee"
        baseline:
          gw_base: "gw_fee"
        evidence: [history]
        cross_difficulty: null
      - id: gw_tenure
        effect: parameter
        decides: gw_tenure
        bindings: [gw_months, gw_tenure]
        ladder:
          - when: "open 24 months or more"
            value: "K('long_tenure_add')"
          - when: "open at least 12 but fewer than 24 months"
            value: "K('tenure_add')"
          - when: "otherwise"
            value: "K('no_add')"
        baseline:
          gw_tenure: "K('no_add')"
        evidence: [date]
        cross_difficulty: null
      - id: gw_loan
        effect: parameter
        decides: gw_loan
        bindings: [gw_loan_active, gw_loan_late, gw_loan]
        ladder:
          - when: "an active Larkspur personal loan and no personal-loan late fee in the 12 whole calendar months before today"
            value: "K('loan_clean_add')"
          - when: "an active personal loan and one or more such late fees"
            value: "K('loan_late_add')"
          - when: "otherwise (no active personal loan)"
            value: "K('no_add')"
        baseline:
          gw_loan: "K('no_add')"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: gw_history
        effect: parameter
        decides: gw_history
        bindings: [gw_other_late, gw_history]
        ladder:
          - when: "no other late fee in the 12 whole calendar months before today"
            value: "K('clean_history_add')"
          - when: "exactly one other"
            value: "K('one_late_add')"
          - when: "otherwise"
            value: "K('no_add')"
        baseline:
          gw_history: "K('no_add')"
        evidence: [history]
        cross_difficulty: null
      - id: gw_autopay
        effect: parameter
        decides: gw_autopay
        bindings: [gw_returns_3m, gw_autopay]
        ladder:
          - when: "enrolled in AutoPay and no payment returned in the 3 whole calendar months before today"
            value: "K('clean_autopay_add')"
          - when: "enrolled in AutoPay with one or more returns in those months"
            value: "K('autopay_add')"
          - when: "otherwise (not enrolled)"
            value: "K('no_add')"
        baseline:
          gw_autopay: "K('no_add')"
        evidence: [history]
        cross_difficulty: null
      - id: gw_speed
        effect: parameter
        decides: gw_speed
        bindings: [gw_fee_age, gw_speed]
        ladder:
          - when: "the late fee charged 10 or fewer calendar days before the request"
            value: "K('prompt_request_add')"
          - when: "11 to 30 days before"
            value: "K('later_request_add')"
          - when: "otherwise"
            value: "K('no_add')"
        baseline:
          gw_speed: "K('no_add')"
        evidence: [history, date]
