        effect: parameter
        decides: ad_reason_buf
        bindings: [ad_code, ad_reason_buf]
        ladder:
          - when: "most recent return code R09"
            value: "K('uncollected_buffer')"
          - when: "most recent return code R01"
            value: "K('funds_buffer')"
          - when: "otherwise"
            value: "K('no_buffer')"
