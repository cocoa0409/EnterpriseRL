  - id: builder_ext_returned_payment_fee_charge
    base_policy_refs: [builder_evt_late_and_returned_fees]
    overwrite:
      - base_policy: builder_evt_late_and_returned_fees
        superseded_clause: >-
          A returned-payment fee of returned_payment_fee_usd is charged once per returned payment whose return code is in fee_bearing_return_codes, never for R07, R10, R29 or a chargeback.
        replaced_by: >-
          A Credit Builder returned-payment fee is charged once per returned payment and only for the account's most recent returned payment and only when that payment's return code is one of the plan's fee-bearing return codes (R01, R02, R03, R04, R08, R09, R16 and R20 on every Credit Builder plan), never for R07, R10, R29 or a chargeback, and its amount is figured as this policy sets out rather than as the plan's flat returned-payment fee.
    trigger: state_due
    subject: [builder_returned_payment_fee_assessed]
    computes: returned_payment_fee_amount
    target_tool: assess_returned_payment_fee_1f748b6c
    params:
      small_payment_fee_percent: 10.0
      first_return_share: 0.5
      second_return_share: 0.75
      same_month_other_line_share: 0.5
      same_quarter_other_line_share: 0.75
      uncollected_funds_share: 0.75
      account_problem_share: 0.9
      seasoned_share: 0.8
      established_share: 0.9
      full_share: 1.0
      seasoned_months: 12
      seasoned_payments: 12
      established_months: 6
      established_payments: 6
      return_lookback_months: 12
      line_recent_months: 1
      line_quarter_months: 3
    rule: >-
      A returned-payment fee is owed for the account's most recent returned payment, when its return code carries a fee, as soon as the return is booked.
      A Credit Builder returned-payment fee is charged once per returned payment and only for the account's most recent returned payment and only when that payment's return code is one of the plan's fee-bearing return codes (R01, R02, R03, R04, R08, R09, R16 and R20 on every Credit Builder plan), never for R07, R10, R29 or a chargeback, and its amount is figured as this policy sets out rather than as the plan's flat returned-payment fee.
      An earlier returned payment that is followed by a newer return before its own fee is charged carries no fee of its own, so a run of returns booked before the fee is charged costs one returned-payment fee.
      The fee is figured for the account's most recent returned payment; when two payments were returned on the same day, the one booked first counts as the most recent.
      Nothing is charged, and the returned payment needs no fee, when the account's most recent returned payment carries a code outside those fee-bearing codes, when a returned-payment fee has already been charged for it, or when the fee comes to 0.00.
      The returned-payment fee is the plan's returned-payment fee, rounded to the cent.
      Every adjustment below that applies acts on the unrounded fee, the adjustments are multiplied together in any order, and the fee is rounded to the nearest cent once, after all of them.
      Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up.
      When the returned amount is at least the plan's returned-payment fee but less than the plan's monthly payment, the fee is the small-payment percent of the returned amount, not more than the plan's returned-payment fee.
      When the returned amount is less than the plan's returned-payment fee, the fee is the returned amount itself.
      When the returned amount is the plan's monthly payment or more, the fee is the plan's returned-payment fee.
      When no payment on the account other than this one was returned in the 12 whole calendar months before today (a return dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the fee is multiplied by the first-return share.
      When exactly one other payment on the account was returned in those 12 months, the fee is multiplied by the second-return share.
      When two or more other payments on the account were returned in those 12 months, the fee is not reduced for return history.
      When a payment on the borrower's Larkspur FlexLine was returned less than one whole calendar month before today (a return dated today counts, and one dated on the same day of the month one month earlier falls outside), the fee is multiplied by the same-month other-line share.
      When no FlexLine payment was returned in that month but one was returned less than three whole calendar months before today (a return dated today counts, and one dated on the same day of the month three months earlier falls outside), the fee is multiplied by the same-quarter other-line share.
      When no FlexLine payment was returned in those three months, the fee is not reduced for other Larkspur returns.
      When the return code is R09 (uncollected funds), the fee is multiplied by the uncollected-funds share.
      When the return code is R02, R03 or R04 (account closed, account not found or invalid account number), the fee is multiplied by the account-problem share.
      When the return code is any other fee-bearing code, the fee is not reduced for the return reason.
      An account open 12 months or more with 12 or more payments credited (payments posted to the account less payments returned on it) is a seasoned account, and its fee is multiplied by the seasoned share; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month.
      An account open at least 6 months with at least 6 payments credited, but either open fewer than 12 months or with fewer than 12 payments credited, is an established account, and its fee is multiplied by the established share.
      Any other account's fee is not reduced for seasoning.
    prerequisite: []
    cross_category:
      - category: line
        as: history
        reads: [line_transactions.event_type, line_transactions.txn_date]
