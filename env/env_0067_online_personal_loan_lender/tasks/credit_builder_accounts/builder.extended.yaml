        evidence: [history]
        cross_difficulty: null
      - id: ad_line_buf
        effect: parameter
        decides: ad_line_buf
        bindings: [ad_line_returns, ad_line_pd_active, ad_line_pd_frozen, ad_line_buf]
        ladder:
          - when: "a FlexLine payment returned in the 12 whole calendar months before today"
            value: "K('line_return_buffer')"
          - when: "no FlexLine return but the open FlexLine shows an amount past due"
            value: "K('line_past_due_buffer')"
          - when: "otherwise"
            value: "K('no_buffer')"
        baseline:
          ad_line_buf: "K('no_buffer')"
        evidence: [cross_category, history]
        cross_difficulty: line
      - id: ad_loan_buf
        effect: parameter
        decides: ad_loan_buf
        bindings: [ad_loan_returns, ad_loan_late, ad_loan_buf]
        ladder:
          - when: "a personal-loan payment returned in the 12 whole calendar months before today"
            value: "K('loan_return_buffer')"
          - when: "no such return but a personal-loan late fee in those months"
            value: "K('loan_late_buffer')"
          - when: "otherwise"
