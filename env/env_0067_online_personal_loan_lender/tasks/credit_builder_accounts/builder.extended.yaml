    compute:
      - rr_ret_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_returned')"
      - rr_ret_date: "None if rr_ret_id == None else LATEST('builder_transactions', 'txn_date', date_field='txn_date', builder_txn_id=rr_ret_id)"
      - rr_ret_pay: "None if rr_ret_id == None else LATEST('builder_transactions', 'related_txn_id', date_field='txn_date', builder_txn_id=rr_ret_id)"
      - rr_due: "None if rr_ret_pay == None else LATEST('builder_transactions', 'installment_due_date', date_field='txn_date', builder_txn_id=rr_ret_pay)"
      - rr_good_id: "None if rr_due == None else LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_posted', installment_due_date=rr_due)"
      - rr_good_date: "None if rr_good_id == None else LATEST('builder_transactions', 'txn_date', date_field='txn_date', builder_txn_id=rr_good_id)"
      - rr_good_ret: "0 if rr_good_id == None else COUNT('builder_transactions', event_type='builder_payment_returned', related_txn_id=rr_good_id)"
      - rr_fee_id: "None if rr_ret_id == None else LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_returned_payment_fee_assessed', related_txn_id=rr_ret_id)"
      - rr_fee: "0 if rr_fee_id == None else SUM('builder_transactions', 'amount', builder_txn_id=rr_fee_id)"
      - rr_settled: "0 if rr_fee_id == None else COUNT('builder_transactions', event_type='builder_fee_waived', related_txn_id=rr_fee_id) + COUNT('builder_transactions', event_type='builder_fee_paid', related_txn_id=rr_fee_id)"
      - rr_used: "COUNT('builder_transactions', within_months=K('waiver_lookback_months'), date_field='txn_date', event_type='builder_fee_waived', waiver_reason='courtesy')"
      - rr_pending: "COUNT('builder_closure_requests', request_status='pending_confirmation')"
      - rr_owed: "rr_fee_id != None and rr_good_date != None and rr_good_date > rr_ret_date and rr_good_ret == 0 and rr_settled == 0 and rr_used < P('courtesy_waivers_per_12_months') and rr_pending == 0"
      - rr_ret_amount: "0 if rr_ret_id == None else SUM('builder_transactions', 'amount', builder_txn_id=rr_ret_id)"
      - rr_ap: "0 if rr_ret_pay == None else COUNT('builder_transactions', builder_txn_id=rr_ret_pay, payment_channel='autopay_ach')"
      - rr_timing: "K('full_share') if (rr_ret_id == None or rr_good_date == None) else (MX(0, 1 - MX(0, DAYS(rr_ret_date, rr_good_date)) / K('decay_days')) if rr_ap >= 1 else (K('one_time_relief_factor') if rr_ret_amount < F('monthly_payment_amount') else K('full_share')))"
      - rr_other: "COUNT('builder_transactions', within_months=K('return_lookback_months'), date_field='txn_date', event_type='builder_payment_returned') - 1"
      - rr_first: "K('first_return_add') if rr_other <= 0 else (K('second_return_add') if rr_other == 1 else K('no_add'))"
      - rr_months: "MONTHS(F('open_date'), NOW)"
      - rr_credited: "COUNT('builder_transactions', event_type='builder_payment_posted') - COUNT('builder_transactions', event_type='builder_payment_returned')"
      - rr_season: "K('seasoned_add') if (rr_months >= K('seasoned_months') and rr_credited >= K('seasoned_payments')) else (K('established_add') if (rr_months >= K('established_months') and rr_credited >= K('established_payments')) else K('no_add'))"
      - rr_line_n: "XCOUNT('line', 'line_transactions', within_months=K('line_lookback_months'), date_field='txn_date', event_type='line_payment_posted')"
      - rr_line: "K('line_many_add') if rr_line_n >= K('line_many_count') else (K('line_some_add') if rr_line_n >= K('line_some_count') else K('no_add'))"
      - rr_acct: "COUNT('builder_transactions', builder_txn_id=rr_ret_id, return_code='R02') + COUNT('builder_transactions', builder_txn_id=rr_ret_id, return_code='R03') + COUNT('builder_transactions', builder_txn_id=rr_ret_id, return_code='R04')"
      - rr_funds: "COUNT('builder_transactions', builder_txn_id=rr_ret_id, return_code='R01') + COUNT('builder_transactions', builder_txn_id=rr_ret_id, return_code='R09')"
      - rr_reason: "K('account_change_add') if rr_acct >= 1 else (K('funds_add') if rr_funds >= 1 else K('no_add'))"
      - rr_fee_age: "None if rr_fee_id == None else DAYS(LATEST('builder_transactions', 'txn_date', date_field='txn_date', builder_txn_id=rr_fee_id), NOW)"
      - rr_age: "K('no_add') if rr_fee_age == None else (K('prompt_add') if rr_fee_age <= K('prompt_days') else (K('recent_add') if rr_fee_age <= K('recent_days') else K('no_add')))"
      - result: "0 if not rr_owed else MN(rr_fee, int((rr_fee * MN(K('full_share'), K('base_relief_share') + rr_first + rr_season + rr_line + rr_reason + rr_age) * rr_timing) * 100 + 0.500001) / 100)"
