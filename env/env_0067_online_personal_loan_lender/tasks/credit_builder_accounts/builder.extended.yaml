        - {table: builder_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: builder_late_fee_assessed}}
        - {table: builder_transactions, aggregate: count, field: txn_date, within_months: 3, filters: {event_type: builder_payment_returned}}
        - {category: loan, table: loan_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: loan_late_fee_assessed}}
      cross_category: [loan]
  - id: builder_ext_autopay_reenrollment
    base_policy_refs: [builder_evt_payments]
    overwrite:
      - base_policy: builder_evt_payments
        superseded_clause: >-
          the due day may be changed once per account, to a day from 1 to 28, with the first new due date the first date on the new day later than the current next due date.
        replaced_by: >-
          For an account whose AutoPay debit was returned and that turns AutoPay on again, and only for such an account, the due day is reset as this policy sets out to line the debit up with the borrower's funds, even when the account's one due-day change has already been used and without using it up, and a reset that moves the due day makes the first new due date the first date on the new day later than the current next due date, which falls in the same month because the new day is never earlier than the current one; for every other account the due day may be changed once per account, to a day from 1 to 28, with the first new due date the first date on the new day later than the current next due date.
    trigger: on_request
    subject: [builder_terms_updated]
    computes: payment_due_day
    target_tool: reenroll_autopay_5af065e7
    params:
      max_due_day: 28
      uncollected_buffer: 3
      funds_buffer: 2
      line_return_buffer: 2
      line_past_due_buffer: 1
      loan_return_buffer: 2
      loan_late_buffer: 1
      pos_return_buffer: 2
      pos_late_buffer: 1
      no_buffer: 0
      lookback_months: 12
      lag_extra_day: 1
      flat_return_buffer: 3
    rule: >-
      When a borrower whose AutoPay debit (a payment made through the AutoPay channel) was returned turns AutoPay on again, the borrower authorizes the recurring debit from their own linked checking account, and the due day is reset as this policy sets out.
      For an account whose AutoPay debit was returned and that turns AutoPay on again, and only for such an account, the due day is reset as this policy sets out to line the debit up with the borrower's funds, even when the account's one due-day change has already been used and without using it up, and a reset that moves the due day makes the first new due date the first date on the new day later than the current next due date, which falls in the same month because the new day is never earlier than the current one; for every other account the due day may be changed once per account, to a day from 1 to 28, with the first new due date the first date on the new day later than the current next due date.
      The due day stays the account's current due day.
      Every buffer below is added to the current due day, and the new due day is never later than day 28.
      When the buffers add to 0 days, or the day-28 limit leaves the due day where it already is, the due day is not changed: AutoPay is turned on with the current due day and the current next due date, and no due date moves.
      When the account shows an amount past due, the due day is not changed whatever the buffers: AutoPay is turned on with the current due day and the next due date stays the oldest unpaid due date, so no unpaid installment is moved later.
      When the account's most recent AutoPay debit (the latest payment made through the AutoPay channel; when two were posted on the same day, the one booked first counts as the latest) was returned in the 12 whole calendar months before today (a return line pointing at it dated today counts, and one dated on the same day of the month 12 months earlier falls outside them) and the borrower's own payment made it good within the late-fee grace period after that debit's due date (the payment looked at is the latest payment posted toward that due date, and when two were posted toward it on the same day the one booked first counts as the latest: it makes the debit good only when no return points at it, it is dated after the return and it is dated no more than the plan's late-fee grace days after the due date, counted as that payment's date less the due date; when a return points at that latest payment, the debit has not been made good), the buffer is those days plus one, so the new due day falls the day after the borrower's funds arrived.
      When that AutoPay debit was returned in those months but was made good only after the grace period, or has not been made good, the buffer is a flat 3 days.
      When it was not returned in those months, or the account has no AutoPay debit, there is no return buffer.
      When the account's most recent returned payment carries return code R09 (uncollected funds), the uncollected-funds buffer is added; when it carries R01 (insufficient funds), the funds buffer; for any other code no reason buffer is added; when two payments were returned on the same day, the one booked first counts as the most recent.
      When a payment on any of the borrower's Larkspur FlexLines was returned in the 12 whole calendar months before today (a line dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the FlexLine-return buffer is added; when none was returned but the borrower's FlexLine in active or frozen status shows an amount past due, the FlexLine past-due buffer; otherwise no FlexLine buffer.
      When a payment on any of the borrower's Larkspur personal loans was returned in the 12 whole calendar months before today (a line dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the loan-return buffer is added; when none was returned but a personal-loan late fee was charged in those months, the loan-late buffer; otherwise no loan buffer.
      When a payment on any of the borrower's PracticePay plans was returned in the 12 whole calendar months before today (a line dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the PracticePay-return buffer is added; when none was returned but a PracticePay late fee was charged in those months, the PracticePay-late buffer; otherwise no PracticePay buffer.
    prerequisite: []
    cross_category:
      - category: line
        as: history
        reads: [status, amount_past_due, line_transactions.event_type, line_transactions.txn_date]
        note: "The FlexLine buffer is decided from FlexLine returns and the open FlexLine's amount past due."
      - category: loan
        as: history
        reads: [loan_transactions.event_type, loan_transactions.txn_date]
        note: "The loan buffer is decided from returned payments and late fees on the personal-loan ledger."
      - category: pos
        as: history
        reads: [pos_transactions.event_type, pos_transactions.txn_date]
        note: "The PracticePay buffer is decided from returned payments and late fees on the PracticePay ledger."
    compute:
      - ad_ap_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_posted', payment_channel='autopay_ach')"
      - ad_ap_returns: "0 if ad_ap_id == None else COUNT('builder_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='builder_payment_returned', related_txn_id=ad_ap_id)"
      - ad_ap_due: "None if ad_ap_id == None else LATEST('builder_transactions', 'installment_due_date', date_field='txn_date', builder_txn_id=ad_ap_id)"
      - ad_ap_ret_date: "None if ad_ap_id == None else LATEST('builder_transactions', 'txn_date', date_field='txn_date', event_type='builder_payment_returned', related_txn_id=ad_ap_id)"
      - ad_good_id: "None if ad_ap_due == None else LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_posted', installment_due_date=ad_ap_due)"
      - ad_good_date: "None if ad_good_id == None else LATEST('builder_transactions', 'txn_date', date_field='txn_date', builder_txn_id=ad_good_id)"
      - ad_good_ret: "0 if ad_good_id == None else COUNT('builder_transactions', event_type='builder_payment_returned', related_txn_id=ad_good_id)"
      - ad_good_lag: "None if (ad_good_date == None or ad_good_ret >= 1 or ad_ap_ret_date == None or ad_good_date <= ad_ap_ret_date) else DAYS(ad_ap_due, ad_good_date)"
      - ad_return_buf: "(ad_good_lag + K('lag_extra_day')) if (ad_ap_returns >= 1 and ad_good_lag != None and ad_good_lag <= P('late_fee_grace_days')) else (K('flat_return_buffer') if ad_ap_returns >= 1 else K('no_buffer'))"
      - ad_code: "LATEST('builder_transactions', 'return_code', date_field='txn_date', event_type='builder_payment_returned')"
      - ad_reason_buf: "K('uncollected_buffer') if ad_code == 'R09' else (K('funds_buffer') if ad_code == 'R01' else K('no_buffer'))"
      - ad_line_returns: "XCOUNT('line', 'line_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='line_payment_returned')"
      - ad_line_pd_active: "CFIELD('line', 'amount_past_due', status='active')"
      - ad_line_pd_frozen: "CFIELD('line', 'amount_past_due', status='frozen')"
      - ad_line_buf: "K('line_return_buffer') if ad_line_returns >= 1 else (K('line_past_due_buffer') if ((ad_line_pd_active != None and ad_line_pd_active > 0) or (ad_line_pd_frozen != None and ad_line_pd_frozen > 0)) else K('no_buffer'))"
      - ad_loan_returns: "XCOUNT('loan', 'loan_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='loan_payment_returned')"
      - ad_loan_late: "XCOUNT('loan', 'loan_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='loan_late_fee_assessed')"
      - ad_loan_buf: "K('loan_return_buffer') if ad_loan_returns >= 1 else (K('loan_late_buffer') if ad_loan_late >= 1 else K('no_buffer'))"
      - ad_pos_returns: "XCOUNT('pos', 'pos_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='pos_payment_returned')"
      - ad_pos_late: "XCOUNT('pos', 'pos_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='pos_late_fee_assessed')"
      - ad_pos_buf: "K('pos_return_buffer') if ad_pos_returns >= 1 else (K('pos_late_buffer') if ad_pos_late >= 1 else K('no_buffer'))"
      - result: "F('payment_due_day') if F('amount_past_due') > 0 else MN(K('max_due_day'), F('payment_due_day') + ad_return_buf + ad_reason_buf + ad_line_buf + ad_loan_buf + ad_pos_buf)"
