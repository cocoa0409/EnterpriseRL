      rf_base: "When the returned amount is at least the plan's returned-payment fee but less than the plan's monthly payment, the fee is the small-payment percent of the returned amount, not more than the plan's returned-payment fee. When the returned amount is less than the plan's returned-payment fee, the fee is the returned amount itself. When the returned amount is the plan's monthly payment or more, the fee is the plan's returned-payment fee."
