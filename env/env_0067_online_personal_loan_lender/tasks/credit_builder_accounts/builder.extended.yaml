        The closing interest is the loan balance times the APR divided by 100 times the interest days divided by 365, rounded to the cent; the interest days are 30 for the month before the oldest unpaid due date plus the calendar days after the oldest unpaid due date up to and including the closing date (the closing date less that due date), a negative count when that due date is still ahead.
      params: [month_days, builder_apr_percent]
