      rf_history: "When no payment on the account other than this one was returned in the 12 whole calendar months before today (a return dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the fee is multiplied by the first-return share. When exactly one other payment on the account was returned in those 12 months, the fee is multiplied by the second-return share. When two or more other payments on the account were returned in those 12 months, the fee is not reduced for return history."
