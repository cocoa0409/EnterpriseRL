# Larkspur Lending - Credit Builder charter (small installment loans whose proceeds are held in a locked savings certificate and released as the loan is repaid).
category: builder
display_name: Credit Builder Accounts

binding:
  holding_table: builder_accounts
  event_tables: [builder_transactions]
  intake_tables: [builder_closure_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {loan_balance: builder_loan, savings_balance: builder_savings, fees_balance: builder_fees_due}

lifecycle:
  states: [applied, cancelled, active, matured, closed_early, closed_delinquent]
  transitions:
    - {from: applied, to: active, by: system, means: The application is approved, the administration fee is paid and the loan amount is deposited into the locked savings certificate.}
    - {from: applied, to: cancelled, by: user, means: The applicant cancels before the account activates.}
    - {from: applied, to: cancelled, by: system, means: The application lapses because it was not completed within the application validity period.}
    - {from: active, to: matured, by: system, means: The final payment is made; the loan is repaid and the savings are released.}
    - {from: active, to: closed_early, by: user, means: The borrower confirms an early-closure request; the savings pay off the loan and the remainder is released.}
    - {from: active, to: closed_delinquent, by: system, means: The account is closed for delinquency; the savings pay off the loan and any remainder is released.}

accounts:
  - key: builder_loan
    unit: USD
    meaning: Unpaid Credit Builder loan principal. Credited (in) by the loan deposit at activation and by principal re-added when a payment is returned; debited (out) by the principal portion of payments and by savings applied to the loan at closing.
  - key: builder_savings
    unit: USD
    meaning: Balance of the locked savings certificate. Credited (in) by the loan deposit at activation and by monthly dividends; debited (out) by savings applied to the loan at closing and by savings released to the borrower.
  - key: builder_fees_due
    unit: USD
    meaning: Unpaid late and returned-payment fees. Credited (in) by each fee assessed; debited (out) by fee payments and fee waivers.

# ---- category-level parameter dictionary ----
parameter_schema:
  loan_amount_usd: "Loan amount deposited into the locked savings certificate at activation, USD."
  term_months: "Number of monthly payments."
  builder_apr_percent: "Fixed APR of the loan, percent."
  monthly_payment_usd: "Monthly payment: the level payment repaying the loan amount at the APR over the term (monthly rate = APR/1200), rounded to the cent; the final payment absorbs the difference."
  total_of_payments_usd: "Monthly payment times the term, USD."
  admin_fee_usd: "One-time administration fee charged at activation, USD; not refundable once the account is active."
  credit_score_required: "Minimum credit score required."
  min_monthly_income_usd: "Minimum stated monthly income, USD (0 = no minimum)."
  payment_account_required: "Payment source required to open."
  min_age_years: "Minimum age at application, years (higher where the state's age of majority is higher: AL and NE 19, MS 21)."
  application_validity_days: "Calendar days after the application date to complete it (pay the administration fee and fund the certificate) before it lapses."
  activation_business_days: "Business days after approval until the account activates once the administration fee is paid."
  interest_method: "How interest is charged."
  payment_allocation_order: "Order in which a payment is applied."
  excess_payment_treatment: "Treatment of amounts paid beyond the monthly payment."
  one_time_payment_min_usd: "Smallest one-time payment, USD."
  debit_card_payment_max_usd: "Largest single debit card payment, USD."
  same_day_cutoff_time_et: "Payments submitted by this Eastern Time on a business day are effective that day (HH:MM)."
  statement_closing_days_before_due: "Calendar days before each due date that the monthly statement closes."
  autopay_rate_discount_percent: "APR reduction for AutoPay, percentage points."
  due_day_changes_per_account: "Due-day changes allowed over the life of the account (integer)."
  late_fee_grace_days: "Calendar days after a due date before a late fee may be assessed on a payment still unpaid."
  late_fee_percent: "Late fee as a percent of the monthly payment."
  late_fee_max_usd: "Highest late fee, USD."
  max_late_fees_per_due_date: "Most late fees per due date (integer)."
  returned_payment_fee_usd: "Fee per returned payment, USD."
  fee_bearing_return_codes: "Return codes that carry a returned-payment fee."
  courtesy_waivers_per_12_months: "Courtesy fee waivers per account in any rolling 12 months (integer)."
  fee_waiver_request_window_days: "Calendar days after a fee's assessment date within which a courtesy waiver may be requested."
  savings_apy_percent: "Annual percentage yield paid on the locked savings certificate, percent."
  savings_dividend_method: "How savings dividends are credited."
  savings_withdrawal_before_close: "Whether savings can be withdrawn before the account closes."
  bureaus_reported: "Credit bureaus the account is reported to every month."
  delinquency_reporting_days_past_due: "Days past due at which a missed payment is reported to the credit bureaus."
  delinquency_close_days_past_due: "Days past due at which the account is closed for delinquency."
  early_close_allowed: "Whether the borrower may close the account before maturity."
  closure_confirmation_days: "Calendar days a pending early-closure request waits for the borrower's confirmation before it lapses."
  release_business_days: "Business days after the closing date within which released savings are sent."
  release_methods: "Ways released savings can be paid out."
  mailed_check_fee_usd: "Fee for releasing savings by mailed check, USD."
  prepayment_penalty_usd: "Penalty for paying off early, USD."
  reapply_wait_after_delinquency_close_days: "Calendar days after a delinquency closure before a new Credit Builder application is taken."
  reapply_wait_after_early_close_days: "Calendar days after an early closure before a new Credit Builder application is taken."
  payment_deferral_available: "Whether payments can be deferred under a hardship program (Credit Builder has no hardship programs; a borrower in hardship may close early instead)."
  admin_fee_payment_method: "How the administration fee is paid."
  max_payments_per_month: "Most one-time payments per account per calendar month in addition to AutoPay (integer)."
  closing_interest_method: "Interest owed when savings pay off the loan at an early or delinquency closing."
  statement_delivery: "How monthly statements are delivered."

