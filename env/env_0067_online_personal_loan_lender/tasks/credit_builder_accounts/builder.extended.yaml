    factors:
      - id: ad_return_buf
        effect: method
        decides: ad_return_buf
        bindings: [ad_ap_id, ad_ap_returns, ad_ap_due, ad_ap_ret_date, ad_good_id, ad_good_date, ad_good_ret, ad_good_lag, ad_return_buf]
        ladder:
          - when: "the most recent AutoPay debit returned in the 12 whole calendar months before today and made good by the borrower's own payment, not itself returned, within the late-fee grace period after its due date"
            method: "the buffer is the days from that due date to the make-good payment plus one"
          - when: "returned in those months but made good only after the grace period, or not yet made good"
            method: "the buffer is a flat 3 days"
          - when: "not returned in those months, or no AutoPay debit"
            method: "no return buffer"
        baseline:
          ad_return_buf: "K('no_buffer')"
        evidence: [history]
        cross_difficulty: null
