  - id: builder_ext_returned_fee_relief
    base_policy_refs: [builder_evt_fee_waiver]
    overwrite:
      - base_policy: builder_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
        replaced_by: >-
          A returned-payment fee relief is granted without a request once its returned payment has been made good, is booked as a courtesy waiver that counts toward the plan's courtesy waivers per 12 months, and is granted only while fewer than that number have been granted on the account; a goodwill credit on a late fee and the early-closure late-fee and returned-fee reliefs each follow their own rule, and any other courtesy waiver is still granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
      - base_policy: builder_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
        replaced_by: >-
          Being granted without a request, the made-good relief is not held to the fee waiver request window, whatever the fee's age, and the early-closure late-fee relief and the early-closure returned-fee relief are likewise governed by their own rules; every other courtesy waiver must still be requested no later than the fee waiver request window after the fee's assessment date.
    trigger: state_due
    subject: [builder_fee_waived]
    computes: relief_amount
    target_tool: relieve_returned_payment_fee_d8e21ef6
    params:
      base_relief_share: 0.3
      full_share: 1.0
      first_return_add: 0.2
      second_return_add: 0.1
      seasoned_add: 0.15
      established_add: 0.05
      seasoned_months: 12
      seasoned_payments: 12
      established_months: 6
      established_payments: 6
      line_many_add: 0.1
      line_some_add: 0.05
      line_many_count: 6
      line_some_count: 3
      line_lookback_months: 6
      account_change_add: 0.1
      funds_add: 0.05
      prompt_add: 0.1
      recent_add: 0.05
      prompt_days: 15
      recent_days: 45
      return_lookback_months: 12
      decay_days: 60
      one_time_relief_factor: 0.5
      no_add: 0.0
      waiver_lookback_months: 12
    rule: >-
      A returned-payment fee relief is granted without a request once its returned payment has been made good, is booked as a courtesy waiver that counts toward the plan's courtesy waivers per 12 months, and is granted only while fewer than that number have been granted on the account; a goodwill credit on a late fee and the early-closure late-fee and returned-fee reliefs each follow their own rule, and any other courtesy waiver is still granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
      Being granted without a request, the made-good relief is not held to the fee waiver request window, whatever the fee's age, and the early-closure late-fee relief and the early-closure returned-fee relief are likewise governed by their own rules; every other courtesy waiver must still be requested no later than the fee waiver request window after the fee's assessment date.
      The made-good relief is not figured until the account's most recent returned payment, when its return code carries a fee, shows its returned-payment fee on the account, unless that fee comes to 0.00.
      The relief applies to the returned-payment fee charged for the account's most recent returned payment and is owed once that returned payment has been made good, that is once the most recent payment posted toward the due date the returned payment was meant to pay is dated after the return date and has not itself been returned (no return points at it; a payment posted on the return date does not make it good); when two payments were returned, or two were posted toward that due date, on the same day, the one booked first counts as the most recent.
      The relief is not owed, and nothing is booked, when the most recent returned payment carries no returned-payment fee or has not been made good, when that fee already carries a fee waiver or a fee payment, when the plan's courtesy waivers have all been granted on the account in the 12 whole calendar months before today (a waiver dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), or when the relief comes to 0.00.
      While the account has a pending early-closure request, the early-closure returned-fee relief takes priority over this relief on the same fee, and the made-good relief is not granted.
      The relief is the base relief share of the returned-payment fee, rounded to the cent.
      Every share addition below is added to the base relief share, the total share is never more than 100 percent, the total share is applied to the fee, the timing rule below then applies to that amount, and the relief is rounded to the nearest cent once, at the end and never more than the fee.
      Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up.
      When that returned payment was an AutoPay debit (the payment its return line points at was made through the AutoPay channel), the relief is reduced by one sixtieth for each calendar day after the return date up to and including the date of the payment that made it good, and never below zero.
      When the returned payment was any other payment for less than the monthly payment, the relief is halved.
      When the returned payment was any other payment for the monthly payment or more, the relief keeps its full amount.
      When no other payment on the account was returned in the 12 whole calendar months before today (a line dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the first-return addition is added to the share; when exactly one other was, the second-return addition; when two or more were, nothing is added for return history.
      An account open 12 months or more with 12 or more payments credited (payments posted to the account less payments returned on it) adds the seasoned addition; an account open at least 6 months with at least 6 payments credited, but either open fewer than 12 months or with fewer than 12 credited, adds the established addition; any other account adds nothing for seasoning; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month.
      When 6 or more payments were posted to the borrower's Larkspur FlexLine in the 6 whole calendar months before today (a payment dated today counts, and one dated on the same day of the month 6 months earlier falls outside them), the FlexLine addition for many payments is added; when 3 to 5 were, the FlexLine addition for some payments; when fewer than 3 were, nothing is added for the FlexLine.
      When the return code is R02, R03 or R04 (account closed, account not found or invalid account number), the account-change addition is added; when it is R01 or R09 (insufficient or uncollected funds), the funds addition; for any other fee-bearing code nothing is added for the return reason.
      When the returned-payment fee was charged 15 or fewer calendar days before today (today less the fee's date, so a fee charged today is 0 days old), the prompt addition is added; when 16 to 45 days before, the recent addition; when longer ago, nothing is added for the fee's age.
