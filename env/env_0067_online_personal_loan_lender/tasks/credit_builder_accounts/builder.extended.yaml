      hr_line_quarter: "When a payment on the borrower's Larkspur FlexLine was returned less than one whole calendar month before today (a return dated today counts, and one dated on the same day of the month one month earlier falls outside), the same-event addition is added; when none was returned in that month but one was returned less than three whole calendar months before today (a return dated today counts, and one dated on the same day of the month three months earlier falls outside), the quarter addition; otherwise nothing is added for the FlexLine."
      hr_line: "When a payment on the borrower's Larkspur FlexLine was returned less than one whole calendar month before today (a return dated today counts, and one dated on the same day of the month one month earlier falls outside), the same-event addition is added; when none was returned in that month but one was returned less than three whole calendar months before today (a return dated today counts, and one dated on the same day of the month three months earlier falls outside), the quarter addition; otherwise nothing is added for the FlexLine."
      hr_req_lag: "When the pending early-closure request was registered on the return date or 1 to 7 calendar days after it, the prompt-request addition is added; when 8 to 30 days after, the later-request addition; when later, or when the request was registered before the return date, nothing is added for promptness."
      hr_request: "When the pending early-closure request was registered on the return date or 1 to 7 calendar days after it, the prompt-request addition is added; when 8 to 30 days after, the later-request addition; when later, or when the request was registered before the return date, nothing is added for promptness."
      hr_other: "When no payment on the account other than this one was returned in the 12 whole calendar months before today (a return dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the first-return addition is added; when exactly one other was, the second-return addition; when two or more were, nothing is added for return history."
      hr_first: "When no payment on the account other than this one was returned in the 12 whole calendar months before today (a return dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the first-return addition is added; when exactly one other was, the second-return addition; when two or more were, nothing is added for return history."
      result: "The relief is the base relief share of the returned-payment fee, rounded to the cent. Every share addition below is added to the base relief share, the total share is never more than 100 percent, the total share is applied to the fee, the timing rule below then applies to that amount, and the relief is rounded to the nearest cent once, at the end and never more than the fee. Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up. The relief is not owed, and nothing is booked, when the account's most recent returned payment carries no returned-payment fee, when that fee already carries a fee waiver or a fee payment, or when the relief comes to 0.00; an older returned-payment fee gets no early-closure relief."
    factors:
