  - id: builder_ext_closing_late_fee_relief
    base_policy_refs: [builder_evt_fee_waiver]
    overwrite:
      - base_policy: builder_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
        replaced_by: >-
          An early-closure late-fee relief is granted without a request when a borrower with a pending early-closure request still owes the account's most recent late fee, and is booked as a courtesy waiver that counts toward the plan's courtesy waivers per 12 months but is granted however many have already been granted on the account; a goodwill credit on a late fee, a returned-payment fee relief once its payment has been made good and an early-closure returned-fee relief each follow their own rule, and any other courtesy waiver is still granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
      - base_policy: builder_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
        replaced_by: >-
          Being granted without a request, the early-closure late-fee relief is not held to the fee waiver request window, whatever the fee's age, and the early-closure returned-fee relief and the made-good relief are likewise governed by their own rules; every other courtesy waiver must still be requested no later than the fee waiver request window after the fee's assessment date.
    trigger: state_due
    subject: [builder_fee_waived]
    computes: relief_amount
    target_tool: relieve_late_fee_at_closing_c21c573e
    params:
      base_relief_share: 0.2
      full_share: 1.0
      half_share: 0.5
      payment_relief_add: 0.3
      hardship_add: 0.15
      first_late_add: 0.15
      second_late_add: 0.05
      seasoned_add: 0.1
      established_add: 0.05
      seasoned_months: 12
      seasoned_payments: 12
      established_months: 6
      established_payments: 6
      current_loan_add: 0.05
      past_due_loan_add: 0.02
      prompt_add: 0.05
      recent_add: 0.02
      prompt_days: 15
      recent_days: 45
      lookback_months: 12
      no_add: 0.0
    rule: >-
      An early-closure late-fee relief is granted without a request when a borrower with a pending early-closure request still owes the account's most recent late fee, and is booked as a courtesy waiver that counts toward the plan's courtesy waivers per 12 months but is granted however many have already been granted on the account; a goodwill credit on a late fee, a returned-payment fee relief once its payment has been made good and an early-closure returned-fee relief each follow their own rule, and any other courtesy waiver is still granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
      Being granted without a request, the early-closure late-fee relief is not held to the fee waiver request window, whatever the fee's age, and the early-closure returned-fee relief and the made-good relief are likewise governed by their own rules; every other courtesy waiver must still be requested no later than the fee waiver request window after the fee's assessment date.
      The early-closure late-fee relief is not figured until the account's oldest unpaid due date, once its grace period has ended with the installment still unpaid, carries its late fee, unless that late fee comes to 0.00.
      The relief applies to the account's most recent late fee; when two late fees were charged on the same day, the one booked first counts as the most recent.
      The relief is not owed, and nothing is booked, when the account has no late fee, when its most recent late fee already carries a fee waiver or a fee payment, or when the relief comes to 0.00; a late fee the borrower still owes is one carrying neither.
      While the account has a pending early-closure request, this relief takes priority over a goodwill credit on the same late fee, and no goodwill credit is granted on that fee.
      The relief is the base relief share of the late fee, rounded to the cent.
      Every share addition below is added to the base relief share, the total share is never more than 100 percent, the total share is applied to the fee, the paid-part rule below then applies to that amount, and the relief is rounded to the nearest cent once, at the end and never more than the fee.
      Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up.
      When a payment has been posted toward the oldest unpaid due date and the account shows an amount past due above zero but below the monthly payment, the relief is scaled by the part paid, that is the monthly payment less the amount past due, divided by the monthly payment.
      When the account shows an amount past due of the monthly payment or more, or an amount past due above zero with no payment posted toward the oldest unpaid due date, the relief is halved.
      When the account shows no amount past due, the relief keeps its full amount.
      When the borrower has a Larkspur hardship plan in active status under the Reduced Payment Plan or the Short-Term Payment Deferral, the payment-relief addition is added; when the borrower has none of those but has another Larkspur hardship plan in active status, the hardship addition; when the borrower has no Larkspur hardship plan in active status, nothing is added for hardship.
      When no late fee other than this one was charged on the account in the 12 whole calendar months before today (a fee dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the first-late addition is added; when exactly one other was, the second-late addition; when two or more were, nothing is added for late history.
      An account open 12 months or more with 12 or more payments credited (payments posted to the account less payments returned on it) adds the seasoned addition; one open at least 6 months with at least 6 payments credited, but either open fewer than 12 months or with fewer than 12 credited, adds the established addition; any other account adds nothing for seasoning; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month.
      When the borrower holds a Larkspur personal loan in active status with no amount past due, the current-loan addition is added; when every active Larkspur personal loan of the borrower shows an amount past due, the past-due-loan addition; when the borrower holds no active Larkspur personal loan, nothing is added for a loan.
      When the late fee was charged 15 or fewer calendar days before today (today less the fee's date, so a fee charged today is 0 days old), the prompt addition is added; when 16 to 45 days before, the recent addition; when longer ago, nothing is added for the fee's age.
    prerequisite:
      - problem: builder_ext_late_fee_charge
        kind: value_input
        gate: hl_fee
        form: state
        policy_source: >-
          The early-closure late-fee relief is not figured until the account's oldest unpaid due date, once its grace period has ended with the installment still unpaid, carries its late fee, unless that late fee comes to 0.00.
        condition: >-
          builder_transactions carries a builder_late_fee_assessed line for the account's next_due_date once its late-fee grace period has ended with the installment unpaid, unless the late fee figured for it comes to 0.00.
        resolved_by: assess_late_fee_fbf509e1
        effect: >-
          The late fee booked for the lapsed due date becomes the most recent late fee, the fee the relief is figured on.
    cross_category:
      - category: hardship
        as: existence
        reads: [status, variant_name]
        note: "The hardship addition is decided from the borrower's active Larkspur hardship plans and their programs."
      - category: loan
        as: branch
        reads: [status, amount_past_due]
        note: "The loan addition is decided from the borrower's active personal loans and their amounts past due."
    compute:
      - hl_fee_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_late_fee_assessed')"
      - hl_fee: "0 if hl_fee_id == None else SUM('builder_transactions', 'amount', builder_txn_id=hl_fee_id)"
      - hl_settled: "0 if hl_fee_id == None else COUNT('builder_transactions', event_type='builder_fee_waived', related_txn_id=hl_fee_id) + COUNT('builder_transactions', event_type='builder_fee_paid', related_txn_id=hl_fee_id)"
      - hl_toward: "COUNT('builder_transactions', event_type='builder_payment_posted', installment_due_date=F('next_due_date'))"
      - hl_paid: "((F('monthly_payment_amount') - F('amount_past_due')) / F('monthly_payment_amount')) if (hl_toward >= 1 and F('amount_past_due') > 0 and F('amount_past_due') < F('monthly_payment_amount')) else (K('half_share') if (F('amount_past_due') >= F('monthly_payment_amount') or (hl_toward == 0 and F('amount_past_due') > 0)) else K('full_share'))"
      - hl_rpp: "EXISTS('hardship', status='active', variant_name='Reduced Payment Plan')"
      - hl_stpd: "EXISTS('hardship', status='active', variant_name='Short-Term Payment Deferral')"
      - hl_any: "EXISTS('hardship', status='active')"
      - hl_program: "K('payment_relief_add') if (hl_rpp or hl_stpd) else (K('hardship_add') if hl_any else K('no_add'))"
      - hl_other_late: "COUNT('builder_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='builder_late_fee_assessed') - 1"
      - hl_first: "K('first_late_add') if hl_other_late <= 0 else (K('second_late_add') if hl_other_late == 1 else K('no_add'))"
      - hl_months: "MONTHS(F('open_date'), NOW)"
      - hl_credited: "COUNT('builder_transactions', event_type='builder_payment_posted') - COUNT('builder_transactions', event_type='builder_payment_returned')"
      - hl_season: "K('seasoned_add') if (hl_months >= K('seasoned_months') and hl_credited >= K('seasoned_payments')) else (K('established_add') if (hl_months >= K('established_months') and hl_credited >= K('established_payments')) else K('no_add'))"
      - hl_loan_current: "EXISTS('loan', status='active', amount_past_due=0.0)"
      - hl_loan_any: "EXISTS('loan', status='active')"
      - hl_loan: "K('current_loan_add') if hl_loan_current else (K('past_due_loan_add') if hl_loan_any else K('no_add'))"
      - hl_fee_age: "None if hl_fee_id == None else DAYS(LATEST('builder_transactions', 'txn_date', date_field='txn_date', builder_txn_id=hl_fee_id), NOW)"
      - hl_age: "K('no_add') if hl_fee_age == None else (K('prompt_add') if hl_fee_age <= K('prompt_days') else (K('recent_add') if hl_fee_age <= K('recent_days') else K('no_add')))"
      - result: "0 if (hl_fee_id == None or hl_settled > 0) else MN(hl_fee, int((hl_fee * MN(K('full_share'), K('base_relief_share') + hl_program + hl_first + hl_season + hl_loan + hl_age) * hl_paid) * 100 + 0.500001) / 100)"
    compute_basis:
      hl_fee_id: "The relief applies to the account's most recent late fee; when two late fees were charged on the same day, the one booked first counts as the most recent."
      hl_fee: "The relief is the base relief share of the late fee, rounded to the cent."
      hl_settled: "The relief is not owed, and nothing is booked, when the account has no late fee, when its most recent late fee already carries a fee waiver or a fee payment, or when the relief comes to 0.00; a late fee the borrower still owes is one carrying neither."
      hl_toward: "When a payment has been posted toward the oldest unpaid due date and the account shows an amount past due above zero but below the monthly payment, the relief is scaled by the part paid, that is the monthly payment less the amount past due, divided by the monthly payment. When the account shows an amount past due of the monthly payment or more, or an amount past due above zero with no payment posted toward the oldest unpaid due date, the relief is halved."
      hl_paid: "When a payment has been posted toward the oldest unpaid due date and the account shows an amount past due above zero but below the monthly payment, the relief is scaled by the part paid, that is the monthly payment less the amount past due, divided by the monthly payment. When the account shows an amount past due of the monthly payment or more, or an amount past due above zero with no payment posted toward the oldest unpaid due date, the relief is halved. When the account shows no amount past due, the relief keeps its full amount."
      hl_rpp: "When the borrower has a Larkspur hardship plan in active status under the Reduced Payment Plan or the Short-Term Payment Deferral, the payment-relief addition is added; when the borrower has none of those but has another Larkspur hardship plan in active status, the hardship addition; when the borrower has no Larkspur hardship plan in active status, nothing is added for hardship."
      hl_stpd: "When the borrower has a Larkspur hardship plan in active status under the Reduced Payment Plan or the Short-Term Payment Deferral, the payment-relief addition is added; when the borrower has none of those but has another Larkspur hardship plan in active status, the hardship addition; when the borrower has no Larkspur hardship plan in active status, nothing is added for hardship."
      hl_any: "When the borrower has a Larkspur hardship plan in active status under the Reduced Payment Plan or the Short-Term Payment Deferral, the payment-relief addition is added; when the borrower has none of those but has another Larkspur hardship plan in active status, the hardship addition; when the borrower has no Larkspur hardship plan in active status, nothing is added for hardship."
      hl_program: "When the borrower has a Larkspur hardship plan in active status under the Reduced Payment Plan or the Short-Term Payment Deferral, the payment-relief addition is added; when the borrower has none of those but has another Larkspur hardship plan in active status, the hardship addition; when the borrower has no Larkspur hardship plan in active status, nothing is added for hardship."
      hl_other_late: "When no late fee other than this one was charged on the account in the 12 whole calendar months before today (a fee dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the first-late addition is added; when exactly one other was, the second-late addition; when two or more were, nothing is added for late history."
      hl_first: "When no late fee other than this one was charged on the account in the 12 whole calendar months before today (a fee dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the first-late addition is added; when exactly one other was, the second-late addition; when two or more were, nothing is added for late history."
      hl_months: "An account open 12 months or more with 12 or more payments credited (payments posted to the account less payments returned on it) adds the seasoned addition; one open at least 6 months with at least 6 payments credited, but either open fewer than 12 months or with fewer than 12 credited, adds the established addition; any other account adds nothing for seasoning; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month."
      hl_credited: "An account open 12 months or more with 12 or more payments credited (payments posted to the account less payments returned on it) adds the seasoned addition; one open at least 6 months with at least 6 payments credited, but either open fewer than 12 months or with fewer than 12 credited, adds the established addition; any other account adds nothing for seasoning; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month."
      hl_season: "An account open 12 months or more with 12 or more payments credited (payments posted to the account less payments returned on it) adds the seasoned addition; one open at least 6 months with at least 6 payments credited, but either open fewer than 12 months or with fewer than 12 credited, adds the established addition; any other account adds nothing for seasoning; months open are whole calendar months from the open date, each complete on the day of the month matching the opening day or, in a month too short for that day, on the first day of the following month."
      hl_loan_current: "When the borrower holds a Larkspur personal loan in active status with no amount past due, the current-loan addition is added; when every active Larkspur personal loan of the borrower shows an amount past due, the past-due-loan addition; when the borrower holds no active Larkspur personal loan, nothing is added for a loan."
      hl_loan_any: "When the borrower holds a Larkspur personal loan in active status with no amount past due, the current-loan addition is added; when every active Larkspur personal loan of the borrower shows an amount past due, the past-due-loan addition; when the borrower holds no active Larkspur personal loan, nothing is added for a loan."
      hl_loan: "When the borrower holds a Larkspur personal loan in active status with no amount past due, the current-loan addition is added; when every active Larkspur personal loan of the borrower shows an amount past due, the past-due-loan addition; when the borrower holds no active Larkspur personal loan, nothing is added for a loan."
      hl_fee_age: "When the late fee was charged 15 or fewer calendar days before today (today less the fee's date, so a fee charged today is 0 days old), the prompt addition is added; when 16 to 45 days before, the recent addition; when longer ago, nothing is added for the fee's age."
      hl_age: "When the late fee was charged 15 or fewer calendar days before today (today less the fee's date, so a fee charged today is 0 days old), the prompt addition is added; when 16 to 45 days before, the recent addition; when longer ago, nothing is added for the fee's age."
      result: "The relief is the base relief share of the late fee, rounded to the cent. Every share addition below is added to the base relief share, the total share is never more than 100 percent, the total share is applied to the fee, the paid-part rule below then applies to that amount, and the relief is rounded to the nearest cent once, at the end and never more than the fee. Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up. The relief is not owed, and nothing is booked, when the account has no late fee, when its most recent late fee already carries a fee waiver or a fee payment, or when the relief comes to 0.00; a late fee the borrower still owes is one carrying neither."
    factors:
      - id: hl_paid
        effect: method
        decides: hl_paid
        bindings: [hl_toward, hl_paid]
        ladder:
          - when: "a payment posted toward the oldest unpaid due date and an amount past due above zero but below the monthly payment"
            method: "the relief is scaled by the part of the installment paid"
          - when: "an amount past due of the monthly payment or more, or above zero with no payment posted toward the oldest unpaid due date"
            method: "the relief is halved"
          - when: "otherwise (no amount past due)"
            method: "the relief keeps its full amount"
        baseline:
          hl_paid: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: hl_program
        effect: parameter
        decides: hl_program
        bindings: [hl_rpp, hl_stpd, hl_any, hl_program]
        ladder:
          - when: "an active Reduced Payment Plan or Short-Term Payment Deferral"
            value: "K('payment_relief_add')"
          - when: "none of those but another active Larkspur hardship plan"
            value: "K('hardship_add')"
          - when: "otherwise"
            value: "K('no_add')"
        baseline:
          hl_program: "K('no_add')"
        evidence: [cross_category]
        cross_difficulty: hardship
      - id: hl_first
        effect: parameter
        decides: hl_first
        bindings: [hl_other_late, hl_first]
        ladder:
          - when: "no other late fee in the 12 whole calendar months before today"
            value: "K('first_late_add')"
          - when: "exactly one other late fee in those months"
            value: "K('second_late_add')"
          - when: "otherwise"
            value: "K('no_add')"
        baseline:
          hl_first: "K('no_add')"
        evidence: [history]
        cross_difficulty: null
      - id: hl_season
        effect: parameter
        decides: hl_season
        bindings: [hl_months, hl_credited, hl_season]
        ladder:
          - when: "open 12 months or more and 12 or more payments credited"
            value: "K('seasoned_add')"
          - when: "open at least 6 months and at least 6 credited, but not both 12 or more"
            value: "K('established_add')"
          - when: "otherwise"
            value: "K('no_add')"
        baseline:
          hl_season: "K('no_add')"
        evidence: [history, date]
        cross_difficulty: null
      - id: hl_loan
        effect: parameter
        decides: hl_loan
        bindings: [hl_loan_current, hl_loan_any, hl_loan]
        ladder:
          - when: "an active Larkspur personal loan with no amount past due"
            value: "K('current_loan_add')"
          - when: "every active personal loan shows an amount past due"
            value: "K('past_due_loan_add')"
          - when: "otherwise (no active personal loan)"
            value: "K('no_add')"
        baseline:
          hl_loan: "K('no_add')"
        evidence: [cross_category]
        cross_difficulty: loan
      - id: hl_age
        effect: parameter
        decides: hl_age
        bindings: [hl_fee_age, hl_age]
        ladder:
          - when: "the late fee charged 15 or fewer calendar days before today"
            value: "K('prompt_add')"
          - when: "charged 16 to 45 days before today"
            value: "K('recent_add')"
          - when: "otherwise"
            value: "K('no_add')"
        baseline:
          hl_age: "K('no_add')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The relief is the base relief share of the late fee, rounded to the cent.
      params: [base_relief_share]
    inputs:
      history:
        - {table: builder_transactions, aggregate: latest, field: amount, filters: {event_type: builder_late_fee_assessed}}
        - {table: builder_transactions, aggregate: count, field: txn_date, within_months: 12, filters: {event_type: builder_late_fee_assessed}}
        - {table: builder_transactions, aggregate: count, field: txn_date, filters: {event_type: builder_payment_posted}}
      cross_category: [hardship, loan]
  - id: builder_ext_closing_returned_fee_relief
    base_policy_refs: [builder_evt_fee_waiver]
    overwrite:
      - base_policy: builder_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
        replaced_by: >-
          An early-closure returned-fee relief is granted without a request when a borrower with a pending early-closure request still owes the returned-payment fee of the account's most recent returned payment, and is booked as a courtesy waiver that counts toward the plan's courtesy waivers per 12 months but is granted however many have already been granted on the account; a goodwill credit on a late fee, a returned-payment fee relief once its payment has been made good and an early-closure late-fee relief each follow their own rule, and any other courtesy waiver is still granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
      - base_policy: builder_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
        replaced_by: >-
          Being granted without a request, the early-closure returned-fee relief is not held to the fee waiver request window, whatever the fee's age, and the early-closure late-fee relief and the made-good relief are likewise governed by their own rules; every other courtesy waiver must still be requested no later than the fee waiver request window after the fee's assessment date.
    trigger: state_due
    subject: [builder_fee_waived]
    computes: relief_amount
    target_tool: relieve_returned_fee_at_closing_90cd40e1
    params:
      base_relief_share: 0.2
      full_share: 1.0
      half_share: 0.5
      decay_days: 60
      uncollected_add: 0.15
      funds_add: 0.1
      same_event_add: 0.2
      quarter_event_add: 0.1
      line_month: 1
      line_quarter: 3
      prompt_request_add: 0.15
      later_request_add: 0.05
      prompt_request_days: 7
      later_request_days: 30
      first_return_add: 0.2
      second_return_add: 0.1
      lookback_months: 12
      no_add: 0.0
    rule: >-
      An early-closure returned-fee relief is granted without a request when a borrower with a pending early-closure request still owes the returned-payment fee of the account's most recent returned payment, and is booked as a courtesy waiver that counts toward the plan's courtesy waivers per 12 months but is granted however many have already been granted on the account; a goodwill credit on a late fee, a returned-payment fee relief once its payment has been made good and an early-closure late-fee relief each follow their own rule, and any other courtesy waiver is still granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the account.
      Being granted without a request, the early-closure returned-fee relief is not held to the fee waiver request window, whatever the fee's age, and the early-closure late-fee relief and the made-good relief are likewise governed by their own rules; every other courtesy waiver must still be requested no later than the fee waiver request window after the fee's assessment date.
      The relief applies to the returned-payment fee charged for the account's most recent returned payment; when two payments were returned on the same day, the one booked first counts as the most recent.
      The return looked at is that most recent returned payment: its return date is the date of its return line, and the request looked at is the account's pending early-closure request, dated the day it was registered.
      The relief is not owed, and nothing is booked, when the account's most recent returned payment carries no returned-payment fee, when that fee already carries a fee waiver or a fee payment, or when the relief comes to 0.00; an older returned-payment fee gets no early-closure relief.
      While the account has a pending early-closure request, this relief takes priority over the made-good relief on the same returned-payment fee, and no made-good relief is granted on that fee.
      The relief is the base relief share of the returned-payment fee, rounded to the cent.
      Every share addition below is added to the base relief share, the total share is never more than 100 percent, the total share is applied to the fee, the timing rule below then applies to that amount, and the relief is rounded to the nearest cent once, at the end and never more than the fee.
      Every rounding to the cent in this policy goes to the nearest cent, a half cent or more rounding up.
      When that returned payment was an AutoPay debit (the payment its return line points at was made through the AutoPay channel), the relief is reduced by one sixtieth for each calendar day after the return date up to and including the date of the pending early-closure request, a request registered before the return date counting no days, and never below zero.
      When it was any other payment for less than the monthly payment, the relief is halved.
      When it was any other payment for the monthly payment or more, the relief keeps its full amount.
      When the return code is R09 (uncollected funds), the uncollected-funds addition is added; when it is R01 (insufficient funds), the funds addition; for any other fee-bearing code nothing is added for the return reason.
      When a payment on the borrower's Larkspur FlexLine was returned less than one whole calendar month before today (a return dated today counts, and one dated on the same day of the month one month earlier falls outside), the same-event addition is added; when none was returned in that month but one was returned less than three whole calendar months before today (a return dated today counts, and one dated on the same day of the month three months earlier falls outside), the quarter addition; otherwise nothing is added for the FlexLine.
      When the pending early-closure request was registered on the return date or 1 to 7 calendar days after it, the prompt-request addition is added; when 8 to 30 days after, the later-request addition; when later, or when the request was registered before the return date, nothing is added for promptness.
      When no payment on the account other than this one was returned in the 12 whole calendar months before today (a return dated today counts, and one dated on the same day of the month 12 months earlier falls outside them), the first-return addition is added; when exactly one other was, the second-return addition; when two or more were, nothing is added for return history.
    prerequisite: []
    cross_category:
      - category: line
        as: history
        reads: [line_transactions.event_type, line_transactions.txn_date]
        note: "The same-event addition is decided from returned payments on the borrower's FlexLine ledger."
    compute:
      - hr_ret_id: "LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_payment_returned')"
      - hr_ret_date: "None if hr_ret_id == None else LATEST('builder_transactions', 'txn_date', date_field='txn_date', builder_txn_id=hr_ret_id)"
      - hr_ret_pay: "None if hr_ret_id == None else LATEST('builder_transactions', 'related_txn_id', date_field='txn_date', builder_txn_id=hr_ret_id)"
      - hr_req_date: "LATEST('builder_closure_requests', 'request_date', date_field='request_date', request_status='pending_confirmation')"
      - hr_fee_id: "None if hr_ret_id == None else LATEST('builder_transactions', 'builder_txn_id', date_field='txn_date', event_type='builder_returned_payment_fee_assessed', related_txn_id=hr_ret_id)"
      - hr_fee: "0 if hr_fee_id == None else SUM('builder_transactions', 'amount', builder_txn_id=hr_fee_id)"
      - hr_settled: "0 if hr_fee_id == None else COUNT('builder_transactions', event_type='builder_fee_waived', related_txn_id=hr_fee_id) + COUNT('builder_transactions', event_type='builder_fee_paid', related_txn_id=hr_fee_id)"
      - hr_ret_amount: "0 if hr_ret_id == None else SUM('builder_transactions', 'amount', builder_txn_id=hr_ret_id)"
      - hr_ap: "0 if hr_ret_pay == None else COUNT('builder_transactions', builder_txn_id=hr_ret_pay, payment_channel='autopay_ach')"
      - hr_timing: "K('full_share') if (hr_ret_id == None or hr_req_date == None) else (MX(0, 1 - MX(0, DAYS(hr_ret_date, hr_req_date)) / K('decay_days')) if hr_ap >= 1 else (K('half_share') if hr_ret_amount < F('monthly_payment_amount') else K('full_share')))"
      - hr_r09: "COUNT('builder_transactions', builder_txn_id=hr_ret_id, return_code='R09')"
      - hr_r01: "COUNT('builder_transactions', builder_txn_id=hr_ret_id, return_code='R01')"
      - hr_reason: "K('uncollected_add') if hr_r09 >= 1 else (K('funds_add') if hr_r01 >= 1 else K('no_add'))"
      - hr_line_month: "XCOUNT('line', 'line_transactions', within_months=K('line_month'), date_field='txn_date', event_type='line_payment_returned')"
      - hr_line_quarter: "XCOUNT('line', 'line_transactions', within_months=K('line_quarter'), date_field='txn_date', event_type='line_payment_returned')"
      - hr_line: "K('same_event_add') if hr_line_month >= 1 else (K('quarter_event_add') if hr_line_quarter >= 1 else K('no_add'))"
      - hr_req_lag: "None if (hr_ret_date == None or hr_req_date == None) else DAYS(hr_ret_date, hr_req_date)"
      - hr_request: "K('no_add') if hr_req_lag == None else (K('prompt_request_add') if (hr_req_lag >= 0 and hr_req_lag <= K('prompt_request_days')) else (K('later_request_add') if (hr_req_lag > K('prompt_request_days') and hr_req_lag <= K('later_request_days')) else K('no_add')))"
      - hr_other: "COUNT('builder_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='builder_payment_returned') - 1"
      - hr_first: "K('first_return_add') if hr_other <= 0 else (K('second_return_add') if hr_other == 1 else K('no_add'))"
      - result: "0 if (hr_fee_id == None or hr_settled > 0) else MN(hr_fee, int((hr_fee * MN(K('full_share'), K('base_relief_share') + hr_reason + hr_line + hr_request + hr_first) * hr_timing) * 100 + 0.500001) / 100)"
