  - id: line_ext_limit_review
    base_policy_refs: [line_evt_limit_changes]
    overwrite:
      - base_policy: line_evt_limit_changes
        superseded_clause: >-
          A borrower may ask to raise or lower the credit limit; each request is recorded and decided by credit review.
        replaced_by: >-
          A borrower may ask to raise or lower the credit limit; each request is recorded and decided by credit review; credit review also lowers, without a request, the limit of a line that the limit-review paragraph names, and records that review as a decided decrease, a limit change the limit-change record otherwise describes only for an approved increase or a requested decrease.
    trigger: state_due
    subject: [line_limit_changed]
    computes: reviewed_limit
    target_tool: apply_limit_review_5d0a2d8e
    params:
      review_min_days: 15
      base_cut_share: 0.10
      late_cut_days: 25
      late_cut_deep: 0.10
      late_cut_early: 0.05
      return_cut_repeat: 0.10
      return_cut_single: 0.05
      loan_cut_past_due: 0.10
      loan_cut_late_fee: 0.05
      relief_long_months: 48
      relief_mid_months: 24
      relief_long: 0.50
      relief_mid: 0.75
      full_share: 1.00
      protected_limit_ceiling_usd: 5000.00
      protected_base_usd: 1000.00
      graduated_first_usd: 5000.00
      limit_step_usd: 100.00
    rule: >-
      A borrower may ask to raise or lower the credit limit; each request is recorded and decided by credit review; credit review also lowers, without a request, the limit of a line that the limit-review paragraph names, and records that review as a decided decrease, a limit change the limit-change record otherwise describes only for an approved increase or a requested decrease.
      Besides deciding the borrower's own requests, credit review lowers the credit limit of an active line that is review_min_days or more days past due (the days from the line's next due date to the review date, while an amount is past due); the review is recorded as a decrease decided the day it is made, the reviewed limit takes effect at once, and a line already reviewed on or after its oldest unpaid due date is not reviewed again for that due date. The reviewed limit is never 0.00, since it is never below the tier's minimum credit limit; when it comes to the current credit limit the review is still recorded, at that limit, and the limit stays as it is.
      Every rounding to the cent in this paragraph takes an exact half cent to the even cent.
      For the limit review, whole calendar months are counted from a start date to an end date, a month counting only once the end date's day of the month reaches the start date's day of the month, and a window of the last 12 months takes the entries dated after the same day of the month 12 months before the review date.
      The reviewed limit is the credit limit less the standard review cut of base_cut_share of it, rounded down to the next limit_step_usd, never below the outstanding balance rounded up to the next limit_step_usd and never below the tier's minimum credit limit, and never above the credit limit before the review.
      The lateness cut is added to the review cut by the days past due on the review date: late_cut_days days or more add late_cut_deep; review_min_days to late_cut_days minus one days add late_cut_early; fewer days add nothing.
      The return cut is added to the review cut by the payments returned on the line in the last 12 months: two or more add return_cut_repeat; exactly one adds return_cut_single; none adds nothing.
      The loan cut is added to the review cut by the borrower's personal loans: an active personal loan when none of the borrower's active personal loans has an amount past due of 0.00 adds loan_cut_past_due; an active personal loan with an amount past due of 0.00 and one or more personal-loan late fees in the last 12 months adds loan_cut_late_fee; any other borrower adds nothing.
      The tenure relief scales the review cut by the age of the line from its open date: relief_long_months months or more give relief_long; relief_mid_months months or more but fewer than relief_long_months give relief_mid; a younger line gives full_share.
      The way the cut is applied follows the limit and the age of the line: on a credit limit of protected_limit_ceiling_usd or less on a line open relief_mid_months months or more, the first protected_base_usd of the limit is kept and the cut applies to the part above it; on a credit limit above protected_limit_ceiling_usd, the cut applies to the first graduated_first_usd and twice the cut applies to the part above it; on any other line the cut applies to the whole limit.
      The reviewed limit is assembled in this order: first the review cut is the standard review cut with every addition above, then multiplied by the tenure relief; then the cut is applied to the limit in the way that applies; then the result is rounded down to the next limit_step_usd; and then it is raised to the outstanding balance rounded up to the next limit_step_usd or to the tier's minimum credit limit if it is below either, but never above the credit limit before the review.
    prerequisite: []
    cross_category:
      - category: loan
        as: history
        reads: [status, amount_past_due, loan_transactions.event_type, loan_transactions.txn_date]
        note: The loan cut reads whether the borrower's active personal loans are current and counts personal-loan late fees in the last 12 months.
    compute:
      - review_limit_now: "F('credit_limit')"
      - review_balance: "F('outstanding_balance')"
      - review_days_late: "DAYS(F('next_due_date'), NOW) if F('amount_past_due') > 0 else 0"
      - lateness_cut: "K('late_cut_deep') if review_days_late >= K('late_cut_days') else (K('late_cut_early') if review_days_late >= K('review_min_days') else 0)"
      - review_returns_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_payment_returned')"
      - return_cut: "K('return_cut_repeat') if review_returns_12m >= 2 else (K('return_cut_single') if review_returns_12m == 1 else 0)"
      - review_loan_late_fees_12m: "XCOUNT('loan', 'loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - loan_cut: "K('loan_cut_past_due') if EXISTS('loan', status='active') and not EXISTS('loan', status='active', amount_past_due=0.0) else (K('loan_cut_late_fee') if EXISTS('loan', status='active', amount_past_due=0.0) and review_loan_late_fees_12m >= 1 else 0)"
      - review_line_age: "MONTHS(F('open_date'), NOW)"
      - tenure_relief: "K('relief_long') if review_line_age >= K('relief_long_months') else (K('relief_mid') if review_line_age >= K('relief_mid_months') else K('full_share'))"
      - cut_way: "1 if review_limit_now <= K('protected_limit_ceiling_usd') and MONTHS(F('open_date'), NOW) >= K('relief_mid_months') else (2 if review_limit_now > K('protected_limit_ceiling_usd') else 0)"
      - review_cut: "(K('base_cut_share') + lateness_cut + return_cut + loan_cut) * tenure_relief"
      - cut_limit: "K('protected_base_usd') + (review_limit_now - K('protected_base_usd')) * (1 - review_cut) if cut_way == 1 else (K('graduated_first_usd') * (1 - review_cut) + (review_limit_now - K('graduated_first_usd')) * (1 - 2 * review_cut) if cut_way == 2 else review_limit_now * (1 - review_cut))"
      - stepped_limit: "int(cut_limit / K('limit_step_usd')) * K('limit_step_usd')"
      - balance_floor: "-int(-float(review_balance) // K('limit_step_usd')) * K('limit_step_usd')"
      - result: "MN(review_limit_now, MX(stepped_limit, balance_floor, P('min_credit_limit_usd')))"
    compute_basis:
      review_limit_now: "The reviewed limit is the credit limit less the standard review cut of base_cut_share of it, rounded down to the next limit_step_usd, never below the outstanding balance rounded up to the next limit_step_usd and never below the tier's minimum credit limit, and never above the credit limit before the review."
      review_balance: "never below the outstanding balance rounded up to the next limit_step_usd"
      review_days_late: "the days from the line's next due date to the review date, while an amount is past due"
      lateness_cut: "late_cut_days days or more add late_cut_deep; review_min_days to late_cut_days minus one days add late_cut_early; fewer days add nothing."
      review_returns_12m: "The return cut is added to the review cut by the payments returned on the line in the last 12 months"
      return_cut: "two or more add return_cut_repeat; exactly one adds return_cut_single; none adds nothing."
      review_loan_late_fees_12m: "one or more personal-loan late fees in the last 12 months"
      loan_cut: "an active personal loan when none of the borrower's active personal loans has an amount past due of 0.00 adds loan_cut_past_due; an active personal loan with an amount past due of 0.00 and one or more personal-loan late fees in the last 12 months adds loan_cut_late_fee; any other borrower adds nothing."
      review_line_age: "The tenure relief scales the review cut by the age of the line from its open date"
      tenure_relief: "relief_long_months months or more give relief_long; relief_mid_months months or more but fewer than relief_long_months give relief_mid; a younger line gives full_share."
      cut_way: "on a credit limit of protected_limit_ceiling_usd or less on a line open relief_mid_months months or more, the first protected_base_usd of the limit is kept and the cut applies to the part above it; on a credit limit above protected_limit_ceiling_usd, the cut applies to the first graduated_first_usd and twice the cut applies to the part above it; on any other line the cut applies to the whole limit."
      review_cut: "first the review cut is the standard review cut with every addition above, then multiplied by the tenure relief"
      cut_limit: "then the cut is applied to the limit in the way that applies"
      stepped_limit: "then the result is rounded down to the next limit_step_usd"
      balance_floor: "never below the outstanding balance rounded up to the next limit_step_usd"
      result: "and then it is raised to the outstanding balance rounded up to the next limit_step_usd or to the tier's minimum credit limit if it is below either, but never above the credit limit before the review."
    factors:
      - id: lateness_cut
        effect: parameter
        decides: lateness_cut
        bindings: [review_days_late, lateness_cut]
        ladder:
          - when: "late_cut_days days or more past due on the review date"
            value: "K('late_cut_deep')"
          - when: "review_min_days to late_cut_days minus one days past due on the review date"
            value: "K('late_cut_early')"
          - when: "otherwise (fewer than review_min_days days past due)"
            value: "0"
        baseline:
