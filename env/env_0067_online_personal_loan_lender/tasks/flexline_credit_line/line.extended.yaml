# ---- data flow (every write is an event) ----
events:
  - type: line_application_submitted
    target: credit_lines
    mutation: create
    meaning: A customer applies for a FlexLine.
    grain: One row per application.
    fields:
      customer_id: Applicant.
      variant_name: Tier applied for.
      application_date: Date applied.
    triggers: []
  - type: line_opened
    target: credit_lines
    mutation: {transition: {from: applied, to: active}}
    meaning: The line is approved and opened.
    grain: One row per transaction.
    fields:
      variant_name: Tier approved.
      open_date: Date opened.
      credit_limit: Limit granted.
      line_apr: APR at opening.
      draw_period_end_date: Last day draws are allowed.
      payment_due_day: Due day.
      outstanding_balance: 0.00 at opening.
    triggers: []
  - type: line_application_declined
    target: credit_lines
    mutation: {transition: {from: applied, to: declined}}
    meaning: The application is declined.
    grain: One row per transaction.
    fields:
      status: Set to declined.
    triggers: []
  - type: line_frozen
    target: credit_lines
    mutation: {transition: {from: active, to: frozen}}
    meaning: Draws are suspended.
    grain: One row per transaction.
    fields:
      freeze_reason: Why.
    triggers: []
  - type: line_unfrozen
    target: credit_lines
    mutation: {transition: {from: frozen, to: active}}
    meaning: Draws are allowed again.
    grain: One row per transaction.
    fields:
      freeze_reason: Cleared (empty).
    triggers: []
  - type: line_draw_period_ended
    target: credit_lines
    mutation: {transition: [{from: active, to: repayment}, {from: frozen, to: repayment}]}
    meaning: The draw period ends and the line enters repayment.
    grain: One row per transaction.
    fields:
      minimum_payment_due: Level repayment-period payment.
    triggers: []
  - type: line_closed_to_draws
    target: credit_lines
    mutation: {transition: {from: active, to: repayment}}
    meaning: The borrower closes the line to new draws while a balance remains.
    grain: One row per transaction.
    fields:
      draw_period_end_date: Set to the closing request date.
      minimum_payment_due: Level repayment-period payment.
    triggers: []
  - type: line_closed
    target: credit_lines
    mutation: {transition: [{from: active, to: closed}, {from: repayment, to: closed}]}
    meaning: The line closes with a 0.00 balance.
    grain: One row per transaction.
    fields:
      closed_date: Date closed.
      closure_reason: borrower_request_zero_balance or repaid_after_draw_period.
    triggers: []
  - type: line_charged_off
    target: credit_lines
    mutation: {transition: [{from: active, to: charged_off}, {from: frozen, to: charged_off}, {from: repayment, to: charged_off}]}
    meaning: The line is charged off for delinquency.
    grain: One row per transaction.
    fields:
      closed_date: Date charged off.
      closure_reason: Set to charged_off.
    triggers: []
  - type: line_limit_changed
    target: credit_lines
    mutation: update
    meaning: The credit limit changes after an approved increase or a requested decrease.
    grain: One row per transaction.
    fields:
      credit_limit: New limit.
    triggers: []
  - type: line_terms_updated
    target: credit_lines
    mutation: update
    meaning: AutoPay, the due day or the APR in force changes.
    grain: One row per transaction.
    fields:
      autopay_enrolled: AutoPay on or off.
      payment_due_day: Due day.
      next_due_date: Next due date.
      line_apr: APR in force.
    triggers: []
  - type: line_account_status_updated
    target: credit_lines
    mutation: update
    meaning: Balance, minimum payment and delinquency fields are refreshed after a ledger line posts.
    grain: One row per transaction.
    fields:
      outstanding_balance: Amount owed.
      minimum_payment_due: Minimum payment due.
      amount_past_due: Amount past due.
      next_due_date: Oldest unpaid due date.
    triggers: []
  - type: line_draw_posted
    target: line_transactions
    meaning: Funds are drawn from the line to the borrower's linked bank account.
    grain: One row per draw.
    distinguish_by: [txn_date, amount, bank_account_id]
    fields:
      txn_date: Draw date.
      amount: Amount drawn.
      bank_account_id: Account funded.
    account: line_balance
    direction: in
    triggers:
      - event: line:line_draw_fee_assessed
        map: {related_txn_id: line_txn_id, txn_date: txn_date}
      - event: line:line_account_status_updated
        map: {}
  - type: line_draw_fee_assessed
    target: line_transactions
    meaning: The draw fee for one draw is charged.
    grain: One row per draw.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Draw date.
      amount: Draw fee.
      related_txn_id: The draw.
    account: line_balance
    direction: in
    triggers: []
  - type: line_interest_charged
    target: line_transactions
    meaning: Interest for one billing cycle is charged at statement closing.
    grain: One row per statement month.
    distinguish_by: [statement_month]
    fields:
      txn_date: Statement closing date.
      amount: Interest for the cycle.
      statement_month: Billing month.
    account: line_balance
    direction: in
    triggers:
      - event: line:line_account_status_updated
        map: {}
  - type: line_annual_fee_assessed
    target: line_transactions
    meaning: The annual fee is charged on the anniversary of the open date.
    grain: One row per anniversary.
    distinguish_by: [txn_date]
    fields:
      txn_date: Anniversary date.
      amount: Annual fee.
    account: line_balance
    direction: in
    triggers:
      - event: line:line_account_status_updated
        map: {}
  - type: line_payment_posted
    target: line_transactions
    meaning: A payment is credited to the line.
    grain: One row per payment received.
    distinguish_by: [txn_date, payment_channel, amount]
    fields:
      txn_date: Effective date.
      amount: Payment.
      payment_channel: How paid.
      bank_account_id: Account debited, for ACH payments.
    account: line_balance
    direction: out
    triggers:
      - event: line:line_account_status_updated
        map: {}
  - type: line_payment_returned
    target: line_transactions
    meaning: A posted payment is returned unpaid or charged back and reversed.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Return date.
      amount: Amount returned.
      related_txn_id: Payment returned.
      return_code: Return reason code.
      bank_account_id: Account of the original payment.
    account: line_balance
    direction: in
    triggers:
      - event: line:line_account_status_updated
        map: {}
      - event: line:line_returned_payment_fee_assessed
        when: {return_code: [R01, R02, R03, R04, R08, R09, R16, R20]}
        map: {related_txn_id: line_txn_id, txn_date: txn_date}
  - type: line_late_fee_assessed
    target: line_transactions
    meaning: A late fee is charged because a minimum payment stayed unpaid past the grace period.
    grain: One row per payment due date.
    distinguish_by: [installment_due_date]
    fields:
      txn_date: Assessment date.
      amount: Fee.
      installment_due_date: Due date the fee is for.
    account: line_balance
    direction: in
    triggers:
      - event: line:line_account_status_updated
        map: {}
  - type: line_returned_payment_fee_assessed
    target: line_transactions
    meaning: A returned-payment fee is charged for one returned payment.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Assessment date.
      amount: Fee.
      related_txn_id: The return line.
    account: line_balance
    direction: in
    triggers: []
  - type: line_fee_waived
    target: line_transactions
    meaning: A draw, annual, late or returned-payment fee is waived.
    grain: One row per fee waived.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Waiver date.
      amount: Amount waived.
      related_txn_id: Fee waived.
      waiver_reason: Basis.
    account: line_balance
    direction: out
    triggers:
      - event: line:line_account_status_updated
        map: {}

# ---- derived measures ----
measures:
  - id: line_msr_draws_today
    window: The calendar day of the draw request.
    measure: Sum of amount of line_draw_posted rows on the line with txn_date that day.
  - id: line_msr_draws_this_cycle
    window: The current billing cycle (from the day after the last statement closing date through today).
    measure: Count of line_draw_posted rows on the line in the window.
  - id: line_msr_consecutive_on_time_payments
    window: Payment due dates of the line from opening through the latest due date on or before today, counted backwards from the latest.
    measure: Number of consecutive most recent due dates whose minimum payment was paid in full (net of returned payments) by the due date.
  - id: line_msr_limit_requests_6m
    window: Rolling 6 months ending today.
    measure: Count of line_limit_requests rows on the line with request_type = increase and request_date in the window, whatever their decision.
  - id: line_msr_courtesy_waivers_12m
    window: Rolling 12 months ending today (today and the 364 days before it).
    measure: Count of line_fee_waived rows on the line with waiver_reason = courtesy and txn_date in the window.
  - id: line_msr_days_past_due
    window: As of today.
    measure: Calendar days from next_due_date to today when next_due_date is earlier than today and amount_past_due is above 0.00; 0 otherwise.

# ---- policies ----
policies:
  - id: line_agg_multi_holding
    subject: [line_application_submitted]
    rule: >-
      A customer may hold max_per_customer FlexLine at a time; a line in applied, active, frozen or repayment status
      blocks a new application, while a declined, closed or charged-off line does not. The customer has no other FlexLine in applied, active, frozen or repayment status.
      A customer whose earlier line was charged off cannot open a new one until that balance is paid or settled.
    eligibility:
      - id: one_open_line
        applies_to: [line_application_submitted]
        kind: authorization
        condition: The customer has no other FlexLine in applied, active, frozen or repayment status.
        evidence_fields: [credit_lines.customer_id, credit_lines.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.customer_id]
          action_bindings:
            credit_lines.customer_id: customer_id
    params:
      max_per_customer: 1

  - id: line_application_underwriting
    subject: [line_application_submitted, line_opened, line_application_declined]
    rule: >-
      An applicant is approved into the highest tier whose credit score, debt-to-income and income requirements they meet,
      with a limit inside that tier's limit range set by underwriting; an applicant who meets no tier is declined. A FlexLine is assessed together with the customer's Larkspur personal loans: the new credit limit plus the unpaid principal of the customer's active personal loans may not exceed combined_unsecured_cap_usd, and a customer with a personal loan in charged_off status or more than 30 days past due is declined.
      The limit is reduced to fit the combined cap and the application is declined if the reduced limit is below the
      tier's minimum. The APR at opening is the Prime Rate plus the tier margin, not below the tier floor and not above
      apr_cap_percent. The draw period ends draw_period_months whole calendar months after the open date (the last day of
      that month when the day does not exist).
    eligibility:
      - id: combined_unsecured_exposure
        applies_to: [line_opened]
        kind: authorization
        condition: "A FlexLine is assessed together with the customer's Larkspur personal loans: the new credit limit plus the unpaid principal of the customer's active personal loans may not exceed combined_unsecured_cap_usd, and a customer with a personal loan in charged_off status or more than 30 days past due is declined."
        evidence_fields: [loans.customer_id, loans.status, loans.principal_balance, loans.next_due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.customer_id]
          action_bindings:
            loans.customer_id: customer_id
    params:
      combined_unsecured_cap_usd: 75000.00
      apr_cap_percent: "=apr_cap_percent"
      rate_index: "=rate_index"
      per_tier:
        "FlexLine Starter": {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", draw_period_months: "=draw_period_months"}
        "FlexLine Standard": {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", draw_period_months: "=draw_period_months"}
        "FlexLine Plus": {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", draw_period_months: "=draw_period_months"}
        "FlexLine Preferred": {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", draw_period_months: "=draw_period_months"}
        "FlexLine Premier": {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", draw_period_months: "=draw_period_months"}
        "FlexLine Elite": {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", draw_period_months: "=draw_period_months"}

  - id: line_evt_draws
    subject: [line_draw_posted, line_draw_fee_assessed]
    rule: >-
      Draws are allowed only while the line is in active status. A draw is sent only to a linked bank account of the borrower whose verification status is verified.
      A draw must be at least the tier's minimum draw, may not exceed the available credit (credit limit minus outstanding
      balance), may not take the day's draws above the tier's daily maximum, and may not exceed the tier's draws per
      billing cycle; a draw that breaks any of these is refused, never partly funded, and no over-limit fee exists. Each
      draw carries a draw fee of the tier's draw fee percent of the draw, rounded to the cent and not less than the tier's
      minimum draw fee (no fee where the percent is 0.00), added to the balance on the draw date; the draw fee counts
      toward the balance but not toward the daily maximum. Funds arrive draw_funding_business_days business days after the
      request (same business day for 0 when requested by the cutoff). Draws by phone carry no extra fee.
    eligibility:
      - id: line_active
        applies_to: [line_draw_posted, line_draw_fee_assessed]
        kind: state
        condition: Draws are allowed only while the line is in active status.
        evidence_fields: [credit_lines.status, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.credit_line_id]
          action_bindings:
            credit_lines.credit_line_id: credit_line_id
        state_contract:
          field: credit_lines.status
          allowed: [active]
      - id: verified_account
        applies_to: [line_draw_posted]
        kind: state
        condition: A draw is sent only to a linked bank account of the borrower whose verification status is verified.
        evidence_fields: [bank_accounts.verification_status, bank_accounts.bank_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_accounts.bank_account_id]
          action_bindings:
            bank_accounts.bank_account_id: bank_account_id
        state_contract:
          field: bank_accounts.verification_status
          allowed: [verified]
    params:
      same_day_draw_cutoff_time_et: "=same_day_draw_cutoff_time_et"
      phone_draw_fee_usd: "=phone_draw_fee_usd"
      over_limit_fee_usd: "=over_limit_fee_usd"
      per_tier:
        "FlexLine Starter": {min_draw_usd: "=min_draw_usd", max_daily_draws_usd: "=max_daily_draws_usd", max_draws_per_billing_cycle: "=max_draws_per_billing_cycle", draw_fee_percent: "=draw_fee_percent", draw_fee_min_usd: "=draw_fee_min_usd", draw_funding_business_days: "=draw_funding_business_days"}
        "FlexLine Standard": {min_draw_usd: "=min_draw_usd", max_daily_draws_usd: "=max_daily_draws_usd", max_draws_per_billing_cycle: "=max_draws_per_billing_cycle", draw_fee_percent: "=draw_fee_percent", draw_fee_min_usd: "=draw_fee_min_usd", draw_funding_business_days: "=draw_funding_business_days"}
        "FlexLine Plus": {min_draw_usd: "=min_draw_usd", max_daily_draws_usd: "=max_daily_draws_usd", max_draws_per_billing_cycle: "=max_draws_per_billing_cycle", draw_fee_percent: "=draw_fee_percent", draw_fee_min_usd: "=draw_fee_min_usd", draw_funding_business_days: "=draw_funding_business_days"}
        "FlexLine Preferred": {min_draw_usd: "=min_draw_usd", max_daily_draws_usd: "=max_daily_draws_usd", max_draws_per_billing_cycle: "=max_draws_per_billing_cycle", draw_fee_percent: "=draw_fee_percent", draw_fee_min_usd: "=draw_fee_min_usd", draw_funding_business_days: "=draw_funding_business_days"}
        "FlexLine Premier": {min_draw_usd: "=min_draw_usd", max_daily_draws_usd: "=max_daily_draws_usd", max_draws_per_billing_cycle: "=max_draws_per_billing_cycle", draw_fee_percent: "=draw_fee_percent", draw_fee_min_usd: "=draw_fee_min_usd", draw_funding_business_days: "=draw_funding_business_days"}
        "FlexLine Elite": {min_draw_usd: "=min_draw_usd", max_daily_draws_usd: "=max_daily_draws_usd", max_draws_per_billing_cycle: "=max_draws_per_billing_cycle", draw_fee_percent: "=draw_fee_percent", draw_fee_min_usd: "=draw_fee_min_usd", draw_funding_business_days: "=draw_funding_business_days"}
    formula:
      available_credit: credit_limit - outstanding_balance
      draw_fee: max(draw_fee_min_usd, round(amount * draw_fee_percent / 100, 2)) * (draw_fee_percent > 0)
    measures: [line_msr_draws_today, line_msr_draws_this_cycle]

  - id: line_evt_interest_and_annual_fee
    subject: [line_interest_charged, line_annual_fee_assessed, line_terms_updated]
    rule: >-
      Interest is charged at each statement closing on the average daily balance of the cycle (draws accrue from the draw
      date with no grace period) times the APR divided by 365 times the days in the cycle, rounded to the cent. The APR
      follows the Prime Rate index plus the tier margin, within the tier floor and apr_cap_percent, changing from the first
      billing cycle after an index change; while AutoPay is active the APR is lowered by the tier's AutoPay discount. The annual fee is charged only on a line in active or frozen status.
      It is charged on each anniversary of the open date, except the first anniversary where the tier waives the first
      year, and not at all on tiers with a 0.00 fee; a line in repayment is no longer charged an annual fee.
    eligibility:
      - id: annual_fee_status
        applies_to: [line_annual_fee_assessed]
        kind: state
        condition: The annual fee is charged only on a line in active or frozen status.
        evidence_fields: [credit_lines.status, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.credit_line_id]
          action_bindings:
            credit_lines.credit_line_id: credit_line_id
        state_contract:
          field: credit_lines.status
          allowed: [active, frozen]
    params:
      interest_method: "=interest_method"
      rate_change_effective: "=rate_change_effective"
      per_tier:
        "FlexLine Starter": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Standard": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Plus": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Preferred": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Premier": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Elite": {annual_fee_usd: "=annual_fee_usd", annual_fee_first_year_waived: "=annual_fee_first_year_waived", apr_margin_percent: "=apr_margin_percent", apr_floor_percent: "=apr_floor_percent", autopay_rate_discount_percent: "=autopay_rate_discount_percent"}

  - id: line_evt_payments_and_fees
    subject: [line_payment_posted, line_payment_returned, line_late_fee_assessed, line_returned_payment_fee_assessed, line_account_status_updated]
    rule: >-
      Payments are accepted on a line in active, frozen, repayment or charged_off status. Each payment is applied to billed interest, then fees, then the
      remaining balance. During the draw period the minimum payment is the tier's minimum payment percent of the statement
      balance, but not less than the tier's floor (or the whole balance if smaller), plus any amount past due; in
      repayment it is the level repayment payment plus any amount past due. A late fee may be assessed only when the current date is later than the payment due date plus the late-fee grace period.
      The grace period is counted in calendar days starting the day after the payment due date.
      The late fee is late_fee_usd for a minimum payment not paid in full, at most one per due date and never more than
      that minimum payment. A returned payment is reversed in full; a returned-payment fee of returned_payment_fee_usd,
      never more than the minimum payment due, is charged once per returned payment whose return code is in
      fee_bearing_return_codes. Balances and the minimum payment are refreshed after every line.
    eligibility:
      - id: payable_status
        applies_to: [line_payment_posted]
        kind: state
        condition: Payments are accepted on a line in active, frozen, repayment or charged_off status.
        evidence_fields: [credit_lines.status, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.credit_line_id]
          action_bindings:
            credit_lines.credit_line_id: credit_line_id
        state_contract:
          field: credit_lines.status
          allowed: [active, frozen, repayment, charged_off]
      - id: late_fee_grace
        applies_to: [line_late_fee_assessed]
        kind: time
        condition: A late fee may be assessed only when the current date is later than the payment due date plus the late-fee grace period.
        evidence_fields: [credit_lines.next_due_date, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.credit_line_id]
          action_bindings:
            credit_lines.credit_line_id: credit_line_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the payment due date
          anchor_source: credit_lines.next_due_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the payment due date.
          boundary: exclusive
    params:
      payment_allocation_order: "=payment_allocation_order"
      repayment_payment_method: "=repayment_payment_method"
      late_fee_usd: "=late_fee_usd"
      returned_payment_fee_usd: "=returned_payment_fee_usd"
      fee_bearing_return_codes: "=fee_bearing_return_codes"
      statement_closing_days_before_due: "=statement_closing_days_before_due"
      prepayment_penalty_usd: "=prepayment_penalty_usd"
      per_tier:
        "FlexLine Starter": {min_payment_percent: "=min_payment_percent", min_payment_floor_usd: "=min_payment_floor_usd", late_fee_grace_days: "=late_fee_grace_days"}
        "FlexLine Standard": {min_payment_percent: "=min_payment_percent", min_payment_floor_usd: "=min_payment_floor_usd", late_fee_grace_days: "=late_fee_grace_days"}
        "FlexLine Plus": {min_payment_percent: "=min_payment_percent", min_payment_floor_usd: "=min_payment_floor_usd", late_fee_grace_days: "=late_fee_grace_days"}
        "FlexLine Preferred": {min_payment_percent: "=min_payment_percent", min_payment_floor_usd: "=min_payment_floor_usd", late_fee_grace_days: "=late_fee_grace_days"}
        "FlexLine Premier": {min_payment_percent: "=min_payment_percent", min_payment_floor_usd: "=min_payment_floor_usd", late_fee_grace_days: "=late_fee_grace_days"}
        "FlexLine Elite": {min_payment_percent: "=min_payment_percent", min_payment_floor_usd: "=min_payment_floor_usd", late_fee_grace_days: "=late_fee_grace_days"}
    formula:
      draw_period_minimum: min(outstanding_balance, max(min_payment_floor_usd, round(outstanding_balance * min_payment_percent / 100, 2))) + amount_past_due
      late_fee: min(late_fee_usd, minimum_payment_due)
      returned_fee: min(returned_payment_fee_usd, minimum_payment_due)
    measures: [line_msr_days_past_due]

  - id: line_evt_fee_waiver
    subject: [line_fee_waived]
    rule: >-
      A fee may be waived once. A courtesy waiver of a late or returned-payment fee is granted on request when fewer than the tier's courtesy waivers per 12 months have been granted on the line.
      A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
      The window is counted in calendar days starting the day after the fee's assessment date, and a request on the last day is in time.
      On tiers that offer it, an annual fee charged in the last retention_window_days days is waived as
      annual_fee_retention when the borrower asks about it and keeps the line open; a borrower who instead closes the line
      still owes the annual fee already charged.
      Fees caused by a Larkspur error, an unauthorized debit or a documented bank error are waived
      on those bases without window or count; draw fees are waived only for a Larkspur error.
    eligibility:
      - id: once_per_fee
        applies_to: [line_fee_waived]
        kind: dedup
        condition: A fee may be waived once.
        evidence_fields: [line_transactions.related_txn_id, line_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [line_transactions.related_txn_id]
          action_bindings:
            line_transactions.related_txn_id: related_txn_id
        dedup_contract:
          table: line_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [line_fee_waived]}
          distinct_fields: []
      - id: courtesy_count
        applies_to: [line_fee_waived]
        kind: authorization
        condition: A courtesy waiver of a late or returned-payment fee is granted on request when fewer than the tier's courtesy waivers per 12 months have been granted on the line.
        evidence_fields: [line_transactions.waiver_reason, line_transactions.txn_date, line_transactions.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [line_transactions.credit_line_id]
          action_bindings:
            line_transactions.credit_line_id: credit_line_id
      - id: courtesy_window
        applies_to: [line_fee_waived]
        kind: time
        condition: A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
        evidence_fields: [line_transactions.txn_date, line_transactions.line_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [line_transactions.line_txn_id]
          action_bindings:
            line_transactions.line_txn_id: related_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee's assessment date
          anchor_source: line_transactions.txn_date
          relation: not_after
          duration_source: variants.fee_waiver_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the fee's assessment date, and a request on the last day is in time.
          boundary: inclusive
    params:
      retention_window_days: 30
      per_tier:
        "FlexLine Starter": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", annual_fee_retention_waiver: "=annual_fee_retention_waiver"}
        "FlexLine Standard": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", annual_fee_retention_waiver: "=annual_fee_retention_waiver"}
        "FlexLine Plus": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", annual_fee_retention_waiver: "=annual_fee_retention_waiver"}
        "FlexLine Preferred": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", annual_fee_retention_waiver: "=annual_fee_retention_waiver"}
        "FlexLine Premier": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", annual_fee_retention_waiver: "=annual_fee_retention_waiver"}
        "FlexLine Elite": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", annual_fee_retention_waiver: "=annual_fee_retention_waiver"}
    measures: [line_msr_courtesy_waivers_12m]

  - id: line_evt_freeze
    subject: [line_frozen, line_unfrozen]
    rule: >-
      Draws are frozen automatically when the line reaches the tier's freeze days past due, when a payment on the line is
      returned, or while a fraud review is open; a borrower may also ask for a freeze on their own line. A line frozen for a returned payment is unfrozen only when the current date is later than the return date plus the returned-payment freeze days and the amount past due is 0.00.
      The freeze period is counted in calendar days starting the day after the return date.
      A line frozen for being past due is unfrozen once the amount past due is 0.00; a borrower-requested freeze is lifted
      at the borrower's request; a fraud-review freeze is lifted only by the fraud team. When several freeze reasons
      apply, the line stays frozen until every one is cleared, and freeze_reason shows the most recent one. Interest,
      payments and fees continue normally while frozen.
    eligibility:
      - id: returned_payment_freeze_period
        applies_to: [line_unfrozen]
        kind: time
        condition: A line frozen for a returned payment is unfrozen only when the current date is later than the return date plus the returned-payment freeze days and the amount past due is 0.00.
        evidence_fields: [line_transactions.txn_date, line_transactions.credit_line_id, credit_lines.amount_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [line_transactions.credit_line_id]
          action_bindings:
            line_transactions.credit_line_id: credit_line_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the return date
          anchor_source: line_transactions.txn_date
          relation: not_before
          duration_source: variants.returned_payment_freeze_days
          unit: calendar_days
          counting_rule: The freeze period is counted in calendar days starting the day after the return date.
          boundary: exclusive
    params:
      per_tier:
        "FlexLine Starter": {freeze_days_past_due: "=freeze_days_past_due", returned_payment_freeze_days: "=returned_payment_freeze_days"}
        "FlexLine Standard": {freeze_days_past_due: "=freeze_days_past_due", returned_payment_freeze_days: "=returned_payment_freeze_days"}
        "FlexLine Plus": {freeze_days_past_due: "=freeze_days_past_due", returned_payment_freeze_days: "=returned_payment_freeze_days"}
        "FlexLine Preferred": {freeze_days_past_due: "=freeze_days_past_due", returned_payment_freeze_days: "=returned_payment_freeze_days"}
        "FlexLine Premier": {freeze_days_past_due: "=freeze_days_past_due", returned_payment_freeze_days: "=returned_payment_freeze_days"}
        "FlexLine Elite": {freeze_days_past_due: "=freeze_days_past_due", returned_payment_freeze_days: "=returned_payment_freeze_days"}
    measures: [line_msr_days_past_due]

  - id: line_evt_limit_changes
    subject: [line_limit_changed]
    rule: >-
      A borrower may ask to raise or lower the credit limit; each request is recorded and decided by credit review. The limit can be changed only on a line in active status.
      An increase request is taken only when the current date is at least the tier's minimum months after the open date.
      Months are counted as whole calendar months from the open date, and when the later month has no matching day the last day of that month is used.
      An increase also needs at least limit_increase_min_on_time_payments consecutive on-time minimum payments and fewer
      than limit_requests_per_6_months increase requests in the last 6 months, uses a hard credit inquiry, and is granted
      for at most the tier's maximum increase percent of the current limit, never above the tier's maximum limit; the tier
      itself never changes. A decrease is granted as requested, effective immediately, but never below the outstanding
      balance or the tier's minimum limit. A request that does not meet these rules is declined.
    eligibility:
      - id: active_line
        applies_to: [line_limit_changed]
        kind: state
        condition: The limit can be changed only on a line in active status.
        evidence_fields: [credit_lines.status, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.credit_line_id]
          action_bindings:
            credit_lines.credit_line_id: credit_line_id
        state_contract:
          field: credit_lines.status
          allowed: [active]
      - id: seasoning
        applies_to: [line_limit_changed]
        kind: time
        condition: An increase request is taken only when the current date is at least the tier's minimum months after the open date.
        evidence_fields: [credit_lines.open_date, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.credit_line_id]
          action_bindings:
            credit_lines.credit_line_id: credit_line_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the open date
          anchor_source: credit_lines.open_date
          relation: not_before
          duration_source: variants.limit_increase_min_months_open
          unit: calendar_months
          counting_rule: Months are counted as whole calendar months from the open date, and when the later month has no matching day the last day of that month is used.
          boundary: inclusive
    params:
      limit_increase_min_on_time_payments: "=limit_increase_min_on_time_payments"
      limit_requests_per_6_months: "=limit_requests_per_6_months"
      limit_increase_hard_inquiry: "=limit_increase_hard_inquiry"
      per_tier:
        "FlexLine Starter": {limit_increase_max_percent: "=limit_increase_max_percent", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", limit_increase_min_months_open: "=limit_increase_min_months_open"}
        "FlexLine Standard": {limit_increase_max_percent: "=limit_increase_max_percent", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", limit_increase_min_months_open: "=limit_increase_min_months_open"}
        "FlexLine Plus": {limit_increase_max_percent: "=limit_increase_max_percent", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", limit_increase_min_months_open: "=limit_increase_min_months_open"}
        "FlexLine Preferred": {limit_increase_max_percent: "=limit_increase_max_percent", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", limit_increase_min_months_open: "=limit_increase_min_months_open"}
        "FlexLine Premier": {limit_increase_max_percent: "=limit_increase_max_percent", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", limit_increase_min_months_open: "=limit_increase_min_months_open"}
        "FlexLine Elite": {limit_increase_max_percent: "=limit_increase_max_percent", min_credit_limit_usd: "=min_credit_limit_usd", max_credit_limit_usd: "=max_credit_limit_usd", limit_increase_min_months_open: "=limit_increase_min_months_open"}
    formula:
      max_new_limit: min(max_credit_limit_usd, round(credit_limit * (1 + limit_increase_max_percent / 100), 2))
      min_decreased_limit: max(min_credit_limit_usd, outstanding_balance)
    measures: [line_msr_consecutive_on_time_payments, line_msr_limit_requests_6m]

  - id: line_evt_draw_period_and_closure
    subject: [line_draw_period_ended, line_closed_to_draws, line_closed, line_charged_off, line_application_declined]
    rule: >-
      When the draw period ends the line moves to repayment and the balance is repaid in level payments over the tier's
      repayment period at the APR in force. A borrower may close the line at any time: with a 0.00 balance it closes
      immediately, and with a balance it is closed to new draws and moves to repayment at once, then closes when repaid.
      A line in repayment closes as repaid_after_draw_period when its balance reaches 0.00. A line is charged off once the current date is at least the charge-off days past due after the oldest unpaid due date.
      Days past due are counted in calendar days starting the day after the oldest unpaid due date.
      Delinquency is reported once a line reaches delinquency_reporting_days_past_due days past due. A declined
      application leaves no line.
    eligibility:
      - id: charge_off_threshold
        applies_to: [line_charged_off]
        kind: time
        condition: A line is charged off once the current date is at least the charge-off days past due after the oldest unpaid due date.
        evidence_fields: [credit_lines.next_due_date, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.credit_line_id]
          action_bindings:
            credit_lines.credit_line_id: credit_line_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the oldest unpaid due date
          anchor_source: credit_lines.next_due_date
          relation: not_before
          duration_source: variants.charge_off_days_past_due
          unit: calendar_days
          counting_rule: Days past due are counted in calendar days starting the day after the oldest unpaid due date.
          boundary: inclusive
    params:
      delinquency_reporting_days_past_due: "=delinquency_reporting_days_past_due"
      charge_off_days_past_due: "=charge_off_days_past_due"
      per_tier:
        "FlexLine Starter": {repayment_period_months: "=repayment_period_months", draw_period_months: "=draw_period_months"}
        "FlexLine Standard": {repayment_period_months: "=repayment_period_months", draw_period_months: "=draw_period_months"}
        "FlexLine Plus": {repayment_period_months: "=repayment_period_months", draw_period_months: "=draw_period_months"}
        "FlexLine Preferred": {repayment_period_months: "=repayment_period_months", draw_period_months: "=draw_period_months"}
        "FlexLine Premier": {repayment_period_months: "=repayment_period_months", draw_period_months: "=draw_period_months"}
        "FlexLine Elite": {repayment_period_months: "=repayment_period_months", draw_period_months: "=draw_period_months"}

  - id: line_evt_autopay_and_due_day
    subject: [line_terms_updated]
    rule: >-
      AutoPay can debit the minimum payment, the statement balance or a fixed amount (at least the minimum payment) from a
      verified linked account on each due date; while it is active the APR is lowered by the tier's AutoPay discount from
      the next billing cycle, and the discount ends from the next billing cycle after AutoPay stops. The due day can be changed at most due_day_changes_per_12_months time in any rolling 12 months, to a day from 1 to 28, on a line with no amount past due.
      The first due date on the new day is the first date on that day later than the current next due date.
    eligibility:
      - id: due_day_change_limit
        applies_to: [line_terms_updated]
        kind: authorization
        condition: The due day can be changed at most due_day_changes_per_12_months time in any rolling 12 months, to a day from 1 to 28, on a line with no amount past due.
        evidence_fields: [credit_lines.amount_past_due, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_lines.credit_line_id]
          action_bindings:
            credit_lines.credit_line_id: credit_line_id
    params:
      autopay_options: "=autopay_options"
      due_day_changes_per_12_months: "=due_day_changes_per_12_months"
      per_tier:
        "FlexLine Starter": {autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Standard": {autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Plus": {autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Preferred": {autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Premier": {autopay_rate_discount_percent: "=autopay_rate_discount_percent"}
        "FlexLine Elite": {autopay_rate_discount_percent: "=autopay_rate_discount_percent"}

# ---- extended policies (flexline_credit_line) ----
extended_policies:
  - id: line_ext_close_to_draws_payment
    base_policy_refs: [line_evt_draw_period_and_closure, line_evt_payments_and_fees]
    overwrite:
      - base_policy: line_evt_payments_and_fees
        superseded_clause: >-
          in repayment it is the level repayment payment plus any amount past due.
        replaced_by: >-
          For a line the borrower closes to new draws while a balance remains, and only for such a line, the payment in repayment is the repayment payment this paragraph sets; a line whose draw period ends still pays, in repayment, the level repayment payment plus any amount past due.
      - base_policy: line_evt_draw_period_and_closure
        superseded_clause: >-
          When the draw period ends the line moves to repayment and the balance is repaid in level payments over the tier's repayment period at the APR in force.
        replaced_by: >-
          When the draw period ends the line moves to repayment and the balance is repaid in level payments over the tier's repayment period at the APR in force, the level payment that the tier's repayment payment method and the closing record's level repayment-period payment describe; for a line the borrower closes to new draws while a balance remains, and only for such a line, that level payment, that repayment payment method and that level repayment-period payment are replaced by the repayment payment this paragraph sets, which is what the closing records as the minimum payment due.
    trigger: on_request
    subject: [line_closed_to_draws]
    computes: repayment_payment
    target_tool: close_line_to_draws_7539d675
    params:
      small_balance_usd: 3000.00
      seasoned_months: 24
      term_short_months: 18
      term_mid_months: 24
      ext_payment_threshold_usd: 300.00
      ext_long_months: 6
      ext_short_months: 3
      high_use_share: 0.75
      active_draw_count: 4
      late_one_months: 3
      late_repeat_months: 6
      heavy_recent_draw_share: 0.50
      trim_long_months: 6
      trim_short_months: 3
      workout_days: 20
      workout_long_months: 6
      workout_short_months: 3
      min_term_months: 12
    rule: >-
      For a line the borrower closes to new draws while a balance remains, and only for such a line, the payment in repayment is the repayment payment this paragraph sets; a line whose draw period ends still pays, in repayment, the level repayment payment plus any amount past due.
      Every rounding to the cent in this paragraph takes an exact half cent to the even cent.
      When the draw period ends the line moves to repayment and the balance is repaid in level payments over the tier's repayment period at the APR in force, the level payment that the tier's repayment payment method and the closing record's level repayment-period payment describe; for a line the borrower closes to new draws while a balance remains, and only for such a line, that level payment, that repayment payment method and that level repayment-period payment are replaced by the repayment payment this paragraph sets, which is what the closing records as the minimum payment due.
      A borrower may close an active line to new draws, including a line that is past due but not frozen; the closing moves the line to repayment at once and records the repayment payment as the line's minimum payment due.
      For the repayment payment, whole calendar months are counted from a start date to an end date, a month counting only once the end date's day of the month reaches the start date's day of the month, and a window of the last N months takes the entries dated after the same day of the month N months before the closing date.
      The repayment payment is fixed only after a line fifteen or more days past due carries a credit-limit review decided on or after its oldest unpaid due date.
      The repayment payment of a past-due line is not fixed until the line carries a courtesy fee-waiver entry against one of its late fees dated on or after its oldest unpaid due date.
      Before the repayment payment is worked out, every due date whose minimum payment is still unpaid past the grace period must carry its late-fee entry.
      The repayment payment is the level payment that repays the outstanding balance, the amount past due included, over the tier's repayment period at the line's APR.
      The monthly rate is the line's APR divided by 1200, and the level payment is the amount repaid times the monthly rate, divided by one minus one plus the monthly rate raised to the power of minus the number of months.
      The repayment payment is rounded to the cent once, at the end.
      The conversion term follows the balance being repaid and the age of the line from its open date: a balance of small_balance_usd or less on a line open fewer than seasoned_months months is repaid over term_short_months months; a balance of small_balance_usd or less on a line open seasoned_months months or more is repaid over term_mid_months months; any other balance is repaid over the tier's repayment period.
      The affordability extension adds months by the borrower's Larkspur personal loans: when the borrower has an active personal loan with an amount past due of 0.00 and the largest scheduled installment payment ever posted on the borrower's personal loans is ext_payment_threshold_usd or more, ext_long_months months are added; when the borrower has such a current active personal loan and that largest installment is below ext_payment_threshold_usd, ext_short_months months are added; with no active personal loan whose amount past due is 0.00, nothing is added.
      The recent-draw trim takes months off by the draws posted on the line in the last 3 months: draws totalling heavy_recent_draw_share of the credit limit or more take off trim_long_months months; draws totalling less than that but more than 0.00 take off trim_short_months months; no draw in the last 3 months takes off nothing; the trim never takes the term below min_term_months.
      The workout extension adds months by how late the line is on the closing date, the days from the line's next due date to the closing date when an amount is past due: workout_days days or more add workout_long_months months; 1 to workout_days minus one days add workout_short_months months; a line with no amount past due adds nothing.
      The payment method follows how heavily the line is used: when the balance is more than high_use_share of the credit limit and active_draw_count or more draws posted on the line in the last 12 months, the payment is one equal share of the amount repaid (that amount divided by the number of months) plus one month of interest on the whole amount at the monthly rate; when the balance is more than high_use_share of the credit limit and fewer than active_draw_count draws posted in the last 12 months, the payment is the larger of the level payment and the current-cycle minimum (the minimum payment due less the amount past due); when the balance is high_use_share of the credit limit or less, the payment is the level payment.
      The late-history cut takes months off by the late-fee entries on the line in the last 12 months: two or more take off late_repeat_months months; exactly one takes off late_one_months months; none takes off nothing; the cut never takes the term below min_term_months.
      The repayment payment is assembled in this order: first the number of months is the term with every month change above applied, the months added before the months taken off; then the payment is figured on the outstanding balance, the amount past due included, at the line's APR over that number of months by the way of figuring that applies; nothing more is added for the amount past due, which is repaid inside the balance; and the payment is rounded to the cent.
      Whichever way it is figured, the repayment payment is one fixed amount, recorded at the closing as the minimum payment due and owed every month of repayment until the balance is repaid; with the equal-share payment the balance is repaid before the term runs out. A line with a 0.00 balance is not closed to new draws under this paragraph but closed outright, and no repayment payment is set.
    prerequisite:
      - problem: line_ext_late_fee
        kind: value_input
        gate: late_term_cut
        form: state
        policy_source: >-
          Before the repayment payment is worked out, every due date whose minimum payment is still unpaid past the grace period must carry its late-fee entry.
        condition: >-
          For the due date in next_due_date, whose minimum payment is still unpaid (amount_past_due above 0.00) more than late_fee_grace_days days later, a line_late_fee_assessed entry with that installment_due_date exists and outstanding_balance includes it.
        resolved_by: assess_late_fee_ba469c06
        effect: >-
          The late fee joins the balance and the line's late-fee entries in the last 12 months, so the late-history cut counts one more late-fee entry and conversion_balance rises by the fee.
      - problem: line_ext_limit_review
        kind: value_input
        gate: payment_method_code
        form: state
        policy_source: >-
          The repayment payment is fixed only after a line fifteen or more days past due carries a credit-limit review decided on or after its oldest unpaid due date.
        condition: >-
          When amount_past_due is above 0.00 and the closing date is fifteen or more days after next_due_date, a line_limit_requests entry with request_type decrease and decision_status approved has a decision_date on or after next_due_date, and credit_limit equals its approved_limit.
        resolved_by: apply_limit_review_5d0a2d8e
        effect: >-
          The reviewed limit replaces the credit limit, so the share of the limit in use rises and the payment method moves to the heavy-use tier.
      - problem: line_ext_workout_fee_relief
        kind: value_input
        gate: conversion_balance
        form: state
        policy_source: >-
          The repayment payment of a past-due line is not fixed until the line carries a courtesy fee-waiver entry against one of its late fees dated on or after its oldest unpaid due date.
        condition: >-
          When amount_past_due is above 0.00, a line_fee_waived entry with waiver_reason courtesy, txn_date on or after next_due_date and a line_late_fee_assessed entry as its related entry is on the line, and outstanding_balance reflects it.
        resolved_by: grant_workout_fee_relief_903cc630
        effect: >-
          The workout relief is taken off the outstanding balance, so conversion_balance falls by it.
    cross_category:
      - category: loan
        as: history
        reads: [status, amount_past_due, loan_transactions.event_type, loan_transactions.payment_type, loan_transactions.amount]
        note: The affordability extension reads whether the borrower has a current active personal loan and the largest scheduled installment payment posted on the borrower's personal loans.
    compute:
      - conversion_balance: "F('outstanding_balance')"
      - current_cycle_minimum: "MX(0, F('minimum_payment_due') - F('amount_past_due'))"
      - line_age_months: "MONTHS(F('open_date'), NOW)"
      - conversion_term_band: "K('term_short_months') if conversion_balance <= K('small_balance_usd') and line_age_months < K('seasoned_months') else (K('term_mid_months') if conversion_balance <= K('small_balance_usd') and line_age_months >= K('seasoned_months') else P('repayment_period_months'))"
      - largest_loan_installment: "XMAX('loan', 'loan_transactions', 'amount', event_type='loan_payment_posted', payment_type='scheduled_installment')"
      - affordability_months: "K('ext_long_months') if EXISTS('loan', status='active', amount_past_due=0.0) and largest_loan_installment >= K('ext_payment_threshold_usd') else (K('ext_short_months') if EXISTS('loan', status='active', amount_past_due=0.0) and largest_loan_installment < K('ext_payment_threshold_usd') else 0)"
      - recent_draw_total: "SUM('line_transactions', 'amount', within_months=3, date_field='txn_date', event_type='line_draw_posted')"
      - recent_draw_trim: "K('trim_long_months') if recent_draw_total >= F('credit_limit') * K('heavy_recent_draw_share') else (K('trim_short_months') if recent_draw_total > 0 else 0)"
      - days_late_at_closing: "DAYS(F('next_due_date'), NOW) if F('amount_past_due') > 0 else 0"
      - workout_months: "K('workout_long_months') if days_late_at_closing >= K('workout_days') else (K('workout_short_months') if days_late_at_closing >= 1 else 0)"
      - line_draws_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_draw_posted')"
      - payment_method_code: "2 if conversion_balance > F('credit_limit') * K('high_use_share') and line_draws_12m >= K('active_draw_count') else (1 if conversion_balance > F('credit_limit') * K('high_use_share') and line_draws_12m < K('active_draw_count') else 0)"
      - late_fee_entries_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - late_term_cut: "K('late_repeat_months') if late_fee_entries_12m >= 2 else (K('late_one_months') if late_fee_entries_12m == 1 else 0)"
      - term_after_trim: "MX(K('min_term_months'), conversion_term_band + affordability_months + workout_months - recent_draw_trim)"
      - conversion_term: "MX(K('min_term_months'), term_after_trim - late_term_cut)"
      - monthly_rate: "F('line_apr') / 1200"
      - level_payment: "conversion_balance * monthly_rate / (1 - (1 + monthly_rate) ** (-conversion_term))"
      - equal_share_payment: "conversion_balance / conversion_term + conversion_balance * monthly_rate"
      - method_payment: "equal_share_payment if payment_method_code == 2 else (max(level_payment, current_cycle_minimum) if payment_method_code == 1 else level_payment)"
      - result: "RND(method_payment, 2)"
    compute_basis:
      conversion_balance: "The repayment payment is the level payment that repays the outstanding balance, the amount past due included, over the tier's repayment period at the line's APR."
      current_cycle_minimum: "the current-cycle minimum (the minimum payment due less the amount past due)"
      line_age_months: "The conversion term follows the balance being repaid and the age of the line from its open date"
      conversion_term_band: "a balance of small_balance_usd or less on a line open fewer than seasoned_months months is repaid over term_short_months months; a balance of small_balance_usd or less on a line open seasoned_months months or more is repaid over term_mid_months months; any other balance is repaid over the tier's repayment period."
      largest_loan_installment: "the largest scheduled installment payment ever posted on the borrower's personal loans"
      affordability_months: "when the borrower has an active personal loan with an amount past due of 0.00 and the largest scheduled installment payment ever posted on the borrower's personal loans is ext_payment_threshold_usd or more, ext_long_months months are added; when the borrower has such a current active personal loan and that largest installment is below ext_payment_threshold_usd, ext_short_months months are added; with no active personal loan whose amount past due is 0.00, nothing is added."
      recent_draw_total: "The recent-draw trim takes months off by the draws posted on the line in the last 3 months"
      recent_draw_trim: "draws totalling heavy_recent_draw_share of the credit limit or more take off trim_long_months months; draws totalling less than that but more than 0.00 take off trim_short_months months; no draw in the last 3 months takes off nothing; the trim never takes the term below min_term_months."
      days_late_at_closing: "the days from the line's next due date to the closing date when an amount is past due"
      workout_months: "workout_days days or more add workout_long_months months; 1 to workout_days minus one days add workout_short_months months; a line with no amount past due adds nothing."
      line_draws_12m: "active_draw_count or more draws posted on the line in the last 12 months"
      payment_method_code: "when the balance is more than high_use_share of the credit limit and active_draw_count or more draws posted on the line in the last 12 months, the payment is one equal share of the amount repaid (that amount divided by the number of months) plus one month of interest on the whole amount at the monthly rate; when the balance is more than high_use_share of the credit limit and fewer than active_draw_count draws posted in the last 12 months, the payment is the larger of the level payment and the current-cycle minimum (the minimum payment due less the amount past due); when the balance is high_use_share of the credit limit or less, the payment is the level payment."
      late_fee_entries_12m: "The late-history cut takes months off by the late-fee entries on the line in the last 12 months"
      late_term_cut: "two or more take off late_repeat_months months; exactly one takes off late_one_months months; none takes off nothing; the cut never takes the term below min_term_months."
      term_after_trim: "the trim never takes the term below min_term_months."
      conversion_term: "first the number of months is the term with every month change above applied, the months added before the months taken off"
      monthly_rate: "The monthly rate is the line's APR divided by 1200"
      level_payment: "the level payment is the amount repaid times the monthly rate, divided by one minus one plus the monthly rate raised to the power of minus the number of months."
      equal_share_payment: "the payment is one equal share of the amount repaid (that amount divided by the number of months) plus one month of interest on the whole amount at the monthly rate"
      method_payment: "then the payment is figured on the outstanding balance, the amount past due included, at the line's APR over that number of months by the way of figuring that applies"
      result: "and the payment is rounded to the cent."
    factors:
      - id: conversion_term_band
        effect: parameter
        decides: conversion_term_band
        bindings: [line_age_months, conversion_term_band]
        ladder:
          - when: "the balance being repaid is small_balance_usd or less and the line has been open fewer than seasoned_months whole calendar months"
            value: "K('term_short_months')"
          - when: "the balance being repaid is small_balance_usd or less and the line has been open seasoned_months whole calendar months or more"
            value: "K('term_mid_months')"
          - when: "otherwise (a balance above small_balance_usd)"
            value: "P('repayment_period_months')"
        baseline:
          conversion_term_band: "P('repayment_period_months')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: affordability_extension
        effect: parameter
        decides: affordability_months
        bindings: [largest_loan_installment, affordability_months]
        ladder:
          - when: "an active personal loan with an amount past due of 0.00 and the largest scheduled installment payment ever posted on the borrower's personal loans ext_payment_threshold_usd or more"
            value: "K('ext_long_months')"
          - when: "an active personal loan with an amount past due of 0.00 and that largest scheduled installment below ext_payment_threshold_usd"
            value: "K('ext_short_months')"
          - when: "otherwise (no active personal loan with an amount past due of 0.00)"
            value: "0"
        baseline:
          affordability_months: "0"
        evidence: [cross_category]
        cross_difficulty: loan
      - id: recent_draw_trim
        effect: parameter
        decides: recent_draw_trim
        bindings: [recent_draw_total, recent_draw_trim]
        ladder:
          - when: "draws posted on the line in the last 3 months total heavy_recent_draw_share of the credit limit or more"
            value: "K('trim_long_months')"
          - when: "draws posted in the last 3 months total more than 0.00 but less than heavy_recent_draw_share of the credit limit"
            value: "K('trim_short_months')"
          - when: "otherwise (no draw in the last 3 months)"
            value: "0"
        baseline:
          recent_draw_trim: "0"
        evidence: [history]
        cross_difficulty: null
      - id: workout_extension
        effect: parameter
        decides: workout_months
        bindings: [days_late_at_closing, workout_months]
        ladder:
          - when: "an amount past due and workout_days days or more from the next due date to the closing date"
            value: "K('workout_long_months')"
          - when: "an amount past due and 1 to workout_days minus one days from the next due date to the closing date"
            value: "K('workout_short_months')"
          - when: "otherwise (no amount past due)"
            value: "0"
        baseline:
          workout_months: "0"
        evidence: [date]
        cross_difficulty: null
      - id: repayment_method_by_use
        effect: method
        decides: payment_method_code
        bindings: [line_draws_12m, payment_method_code]
        ladder:
          - when: "the balance is more than high_use_share of the credit limit and active_draw_count or more draws posted in the last 12 months"
            method: "one equal share of the amount repaid (amount divided by the number of months) plus one month of interest on the whole amount at the monthly rate"
          - when: "the balance is more than high_use_share of the credit limit and fewer than active_draw_count draws posted in the last 12 months"
            method: "the larger of the level payment and the current-cycle minimum (minimum payment due less amount past due)"
          - when: "otherwise (balance high_use_share of the credit limit or less)"
            method: "the level payment that repays the amount over the number of months"
        baseline:
          payment_method_code: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_history_term_cut
        effect: parameter
        decides: late_term_cut
        bindings: [late_fee_entries_12m, late_term_cut]
        ladder:
          - when: "two or more late-fee entries on the line in the last 12 months"
            value: "K('late_repeat_months')"
          - when: "exactly one late-fee entry on the line in the last 12 months"
            value: "K('late_one_months')"
          - when: "otherwise (no late-fee entry in the last 12 months)"
            value: "0"
        baseline:
          late_term_cut: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The repayment payment is the level payment that repays the outstanding balance, the amount past due included, over the tier's repayment period at the line's APR. The monthly rate is the line's APR divided by 1200, and the level payment is the amount repaid times the monthly rate, divided by one minus one plus the monthly rate raised to the power of minus the number of months. The repayment payment is rounded to the cent once, at the end.
      params: [repayment_period_months]
    inputs:
      history:
        - {table: line_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: line_draw_posted}}
        - {table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_draw_posted}}
        - {table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_late_fee_assessed}}
        - {category: loan, table: loan_transactions, aggregate: max, field: amount, filters: {event_type: loan_payment_posted, payment_type: scheduled_installment}}
      cross_category: [loan]
  - id: line_ext_late_fee
    base_policy_refs: [line_evt_payments_and_fees]
    overwrite:
      - base_policy: line_evt_payments_and_fees
        superseded_clause: >-
          The late fee is late_fee_usd for a minimum payment not paid in full, at most one per due date and never more than that minimum payment.
        replaced_by: >-
          For a due date whose minimum payment is still not paid in full when its late fee is booked, and only for such a due date, the late fee is the amount this paragraph sets in place of the flat late_fee_usd the tier's parameter describes, at most one per due date and never more than the unpaid part of that minimum payment; a late fee for a due date whose minimum payment was paid in full only after the grace period is still late_fee_usd, never more than that minimum payment.
    trigger: state_due
    subject: [line_late_fee_assessed]
    computes: fee_amount
    target_tool: assess_late_fee_ba469c06
    params:
      history_share_none: 0.80
      history_share_one: 0.90
      full_share: 1.00
      small_unpaid_usd: 100.00
      large_unpaid_usd: 250.00
      small_unpaid_percent: 25.0
      proportional_max_days: 30
      large_unpaid_percent: 5.0
      grace_share_half: 0.50
      grace_share_part: 0.90
      tenure_long_months: 48
      tenure_mid_months: 24
      tenure_share_long: 0.90
      tenure_share_mid: 0.95
      balance_small_usd: 500.00
      balance_mid_usd: 3000.00
      balance_share_small: 0.60
      balance_share_mid: 0.80
    rule: >-
      For a due date whose minimum payment is still not paid in full when its late fee is booked, and only for such a due date, the late fee is the amount this paragraph sets in place of the flat late_fee_usd the tier's parameter describes, at most one per due date and never more than the unpaid part of that minimum payment; a late fee for a due date whose minimum payment was paid in full only after the grace period is still late_fee_usd, never more than that minimum payment.
      Every rounding to the cent in this paragraph takes an exact half cent to the even cent.
      For the late fee, whole calendar months are counted from a start date to an end date, a month counting only once the end date's day of the month reaches the start date's day of the month, and a window of the last N months takes the entries dated after the same day of the month N months before the booking date.
      The fee is booked against the due date it is charged for, dated the day it is booked, and added to the outstanding balance. A late fee that computes to 0.00 is still booked, as a 0.00 entry for its due date.
      The late fee is the tier's late fee for the due date whose minimum payment is unpaid, never more than the unpaid part of that minimum payment, rounded to the cent.
      The unpaid part of the minimum payment is the line's amount past due on the booking date, and the due date charged is the line's next due date.
      The way the late fee is figured follows the unpaid part and the days from the due date to the booking date: below small_unpaid_usd on a line fewer than proportional_max_days days late, the figured fee is small_unpaid_percent percent of the unpaid part, rounded to the cent, but never more than the tier's late fee; large_unpaid_usd or more, the figured fee is the larger of the tier's late fee and large_unpaid_percent percent of the unpaid part, rounded to the cent; any other unpaid part below large_unpaid_usd (small_unpaid_usd or more, or below small_unpaid_usd on a line proportional_max_days days late or more) is figured at the tier's late fee.
      The late-history share follows the late-fee entries already on the line in the last 12 months: none gives history_share_none; exactly one gives history_share_one; two or more give full_share.
      The grace-payment share follows the line's latest payment (of two on the same date, the one recorded first) when it posted after the due date and no later than the last day of the grace period: a payment at least equal to the unpaid part gives grace_share_half; a smaller payment gives grace_share_part; no payment in that span gives full_share.
      The tenure share follows the age of the line from its open date: tenure_long_months months or more give tenure_share_long; tenure_mid_months months or more but fewer than tenure_long_months give tenure_share_mid; a younger line gives full_share.
      The balance-tier share follows the line's balance before the fee, its ledger entries added up (charges less payments and waivers): below balance_small_usd gives balance_share_small; balance_small_usd or more but below balance_mid_usd gives balance_share_mid; balance_mid_usd or more gives full_share.
      The late fee is assembled in this order: first the figured fee is set by the way that applies; then it is multiplied by every share above; then it is held to no more than the unpaid part of the minimum payment; and it is rounded to the cent.
    prerequisite: []
    cross_category: []
    compute:
      - unpaid_minimum: "F('amount_past_due')"
      - charged_due_date: "F('next_due_date')"
      - late_entries_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - late_history_share: "K('history_share_none') if late_entries_12m == 0 else (K('history_share_one') if late_entries_12m == 1 else K('full_share'))"
      - days_late_now: "DAYS(charged_due_date, NOW)"
      - unpaid_figuring_code: "1 if float(unpaid_minimum) < K('small_unpaid_usd') and days_late_now < K('proportional_max_days') else (2 if float(unpaid_minimum) >= K('large_unpaid_usd') else 0)"
      - grace_payment_date: "LATEST('line_transactions', 'txn_date', date_field='txn_date', event_type='line_payment_posted') or F('open_date')"
      - grace_payment_amount: "LATEST('line_transactions', 'amount', date_field='txn_date', event_type='line_payment_posted') or 0"
      - grace_payment_share: "K('grace_share_half') if grace_payment_date > charged_due_date and DAYS(charged_due_date, grace_payment_date) <= P('late_fee_grace_days') and float(grace_payment_amount) >= float(unpaid_minimum) else (K('grace_share_part') if grace_payment_date > charged_due_date and DAYS(charged_due_date, grace_payment_date) <= P('late_fee_grace_days') and float(grace_payment_amount) < float(unpaid_minimum) else K('full_share'))"
      - late_line_age: "MONTHS(F('open_date'), NOW)"
      - late_tenure_share: "K('tenure_share_long') if late_line_age >= K('tenure_long_months') else (K('tenure_share_mid') if late_line_age >= K('tenure_mid_months') else K('full_share'))"
      - fee_ledger_balance: "SUM('line_transactions', 'amount', event_type='line_draw_posted') + SUM('line_transactions', 'amount', event_type='line_draw_fee_assessed') + SUM('line_transactions', 'amount', event_type='line_interest_charged') + SUM('line_transactions', 'amount', event_type='line_annual_fee_assessed') + SUM('line_transactions', 'amount', event_type='line_payment_returned') + SUM('line_transactions', 'amount', event_type='line_late_fee_assessed') + SUM('line_transactions', 'amount', event_type='line_returned_payment_fee_assessed') - SUM('line_transactions', 'amount', event_type='line_payment_posted') - SUM('line_transactions', 'amount', event_type='line_fee_waived')"
      - balance_tier_share: "K('balance_share_small') if fee_ledger_balance < K('balance_small_usd') else (K('balance_share_mid') if fee_ledger_balance < K('balance_mid_usd') else K('full_share'))"
      - figured_late_fee: "min(P('late_fee_usd'), RND(float(unpaid_minimum) * K('small_unpaid_percent') / 100, 2)) if unpaid_figuring_code == 1 else (max(P('late_fee_usd'), RND(float(unpaid_minimum) * K('large_unpaid_percent') / 100, 2)) if unpaid_figuring_code == 2 else P('late_fee_usd'))"
      - result: "RND(MN(figured_late_fee * late_history_share * grace_payment_share * late_tenure_share * balance_tier_share, float(unpaid_minimum)), 2)"
    compute_basis:
      unpaid_minimum: "The unpaid part of the minimum payment is the line's amount past due on the booking date, and the due date charged is the line's next due date."
      charged_due_date: "The unpaid part of the minimum payment is the line's amount past due on the booking date, and the due date charged is the line's next due date."
      late_entries_12m: "The late-history share follows the late-fee entries already on the line in the last 12 months"
      late_history_share: "none gives history_share_none; exactly one gives history_share_one; two or more give full_share."
      days_late_now: "The way the late fee is figured follows the unpaid part and the days from the due date to the booking date"
      unpaid_figuring_code: "below small_unpaid_usd on a line fewer than proportional_max_days days late, the figured fee is small_unpaid_percent percent of the unpaid part, rounded to the cent, but never more than the tier's late fee; large_unpaid_usd or more, the figured fee is the larger of the tier's late fee and large_unpaid_percent percent of the unpaid part, rounded to the cent; any other unpaid part below large_unpaid_usd (small_unpaid_usd or more, or below small_unpaid_usd on a line proportional_max_days days late or more) is figured at the tier's late fee."
      grace_payment_date: "The grace-payment share follows the line's latest payment (of two on the same date, the one recorded first) when it posted after the due date and no later than the last day of the grace period"
      grace_payment_amount: "The grace-payment share follows the line's latest payment (of two on the same date, the one recorded first) when it posted after the due date and no later than the last day of the grace period"
      grace_payment_share: "a payment at least equal to the unpaid part gives grace_share_half; a smaller payment gives grace_share_part; no payment in that span gives full_share."
      late_line_age: "The tenure share follows the age of the line from its open date"
      late_tenure_share: "tenure_long_months months or more give tenure_share_long; tenure_mid_months months or more but fewer than tenure_long_months give tenure_share_mid; a younger line gives full_share."
      fee_ledger_balance: "The balance-tier share follows the line's balance before the fee, its ledger entries added up (charges less payments and waivers)"
      balance_tier_share: "below balance_small_usd gives balance_share_small; balance_small_usd or more but below balance_mid_usd gives balance_share_mid; balance_mid_usd or more gives full_share."
      figured_late_fee: "first the figured fee is set by the way that applies"
      result: "then it is multiplied by every share above; then it is held to no more than the unpaid part of the minimum payment; and it is rounded to the cent."
    factors:
      - id: late_history_share
        effect: parameter
        decides: late_history_share
        bindings: [late_entries_12m, late_history_share]
        ladder:
          - when: "no late-fee entry on the line in the last 12 months"
            value: "K('history_share_none')"
          - when: "exactly one late-fee entry on the line in the last 12 months"
            value: "K('history_share_one')"
          - when: "otherwise (two or more late-fee entries in the last 12 months)"
            value: "K('full_share')"
        baseline:
          late_history_share: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: unpaid_part_figuring
        effect: method
        decides: unpaid_figuring_code
        bindings: [days_late_now, unpaid_figuring_code]
        ladder:
          - when: "an unpaid part below small_unpaid_usd on a line fewer than proportional_max_days days late"
            method: "small_unpaid_percent percent of the unpaid part, rounded to the cent, never more than the tier's late fee (the smaller of the two)"
          - when: "an unpaid part of large_unpaid_usd or more"
            method: "the larger of the tier's late fee and large_unpaid_percent percent of the unpaid part"
          - when: "otherwise"
            method: "the tier's late fee as a flat amount"
        baseline:
          unpaid_figuring_code: "0"
        evidence: [date]
        cross_difficulty: null
      - id: grace_payment_share
        effect: parameter
        decides: grace_payment_share
        bindings: [grace_payment_date, grace_payment_amount, grace_payment_share]
        ladder:
          - when: "the latest payment posted after the due date, within the grace period, and at least equal to the unpaid part"
            value: "K('grace_share_half')"
          - when: "the latest payment posted after the due date, within the grace period, and smaller than the unpaid part"
            value: "K('grace_share_part')"
          - when: "otherwise (no payment between the due date and the end of the grace period)"
            value: "K('full_share')"
        baseline:
          grace_payment_share: "K('full_share')"
        evidence: [history, date]
        cross_difficulty: null
      - id: late_fee_tenure_share
        effect: parameter
        decides: late_tenure_share
        bindings: [late_line_age, late_tenure_share]
        ladder:
          - when: "the line open tenure_long_months whole calendar months or more"
            value: "K('tenure_share_long')"
          - when: "the line open tenure_mid_months whole calendar months or more but fewer than tenure_long_months"
            value: "K('tenure_share_mid')"
          - when: "otherwise (open fewer than tenure_mid_months months)"
            value: "K('full_share')"
        baseline:
          late_tenure_share: "K('full_share')"
        evidence: [date]
        cross_difficulty: null
      - id: balance_tier_share
        effect: parameter
        decides: balance_tier_share
        bindings: [fee_ledger_balance, balance_tier_share]
        ladder:
          - when: "a balance before the fee below balance_small_usd"
            value: "K('balance_share_small')"
          - when: "a balance before the fee of balance_small_usd or more but below balance_mid_usd"
            value: "K('balance_share_mid')"
          - when: "otherwise (balance_mid_usd or more)"
            value: "K('full_share')"
        baseline:
