        bindings: [review_loan_late_fees_12m, loan_cut]
        ladder:
          - when: "an active personal loan and none of the borrower's active personal loans current (amount past due 0.00)"
            value: "K('loan_cut_past_due')"
          - when: "an active personal loan that is current and one or more personal-loan late fees in the last 12 months"
            value: "K('loan_cut_late_fee')"
          - when: "otherwise (no active personal loan, or a current one with no late fee in the last 12 months)"
