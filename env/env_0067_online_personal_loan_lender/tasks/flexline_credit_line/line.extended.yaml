      - base_policy: line_evt_payments_and_fees
        superseded_clause: >-
          a returned-payment fee of returned_payment_fee_usd, never more than the minimum payment due, is charged once per returned payment whose return code is in fee_bearing_return_codes.
        replaced_by: >-
          A returned-payment fee is charged once per returned payment whose return code is in fee_bearing_return_codes, never more than the minimum payment due; for the line's most recent returned payment, and only for that return, the fee is the amount this paragraph sets in place of the flat returned_payment_fee_usd the tier's parameter describes, while a fee for any earlier return is still a flat returned_payment_fee_usd, and a return whose code is not in fee_bearing_return_codes carries no fee.
    trigger: state_due
    subject: [line_returned_payment_fee_assessed]
    computes: fee_amount
    target_tool: assess_returned_payment_fee_0fd8e99d
    params:
      history_share_clean: 0.85
      history_share_older: 0.95
      full_share: 1.00
      proportional_ceiling_usd: 1000.00
      proportional_percent: 2.5
      late_booking_share_two: 0.75
      late_booking_share_one: 0.90
      shared_event_share_fee: 0.75
      shared_event_share_nofee: 0.90
      tenure_long_months: 48
      tenure_mid_months: 24
      tenure_share_long: 0.90
      tenure_share_mid: 0.95
    rule: >-
      A returned-payment fee is charged once per returned payment whose return code is in fee_bearing_return_codes, never more than the minimum payment due; for the line's most recent returned payment, and only for that return, the fee is the amount this paragraph sets in place of the flat returned_payment_fee_usd the tier's parameter describes, while a fee for any earlier return is still a flat returned_payment_fee_usd, and a return whose code is not in fee_bearing_return_codes carries no fee.
      Every rounding to the cent in this paragraph takes an exact half cent to the even cent.
      For the returned-payment fee, whole calendar months are counted from a start date to an end date, a month counting only once the end date's day of the month reaches the start date's day of the month, and a window of the last N months takes the entries dated after the same day of the month N months before the booking date.
      The fee is booked against the return it is charged for, dated the day it is booked, and added to the outstanding balance. A returned-payment fee that computes to 0.00 is still booked, as a 0.00 entry against its return.
      The returned-payment fee is the tier's returned-payment fee for the return, never more than the minimum payment due, rounded to the cent.
      The most recent returned payment is the latest return on the line by return date (of two returns on the same date, the one recorded first).
      The way the fee is figured follows the amount and the code of that return: when the amount returned is below proportional_ceiling_usd and the return code is R01 or R09 (funds not available), the figured fee is proportional_percent percent of the amount returned, rounded to the cent, but never more than the tier's returned-payment fee; when the amount returned is proportional_ceiling_usd or more, the figured fee is the larger of the tier's returned-payment fee and proportional_percent percent of the amount returned, rounded to the cent; any other fee-bearing return below proportional_ceiling_usd is figured at the tier's returned-payment fee.
      The return-history share follows the payments returned on the line, the return being charged included: when it is the only return in the last 24 months the share is history_share_clean; when it is the only return in the last 12 months but another return falls in the last 24 months the share is history_share_older; when two or more payments were returned in the last 12 months the share is full_share.
      The late-booking share follows the whole calendar months from the return date to the booking date: two months or more give late_booking_share_two; one month gives late_booking_share_one; less than one month gives full_share.
      The shared-event share follows the borrower's personal loans on the return date: when a personal-loan payment was returned on the same date and a personal-loan returned-payment fee was booked that date, the share is shared_event_share_fee; when a personal-loan payment was returned on the same date with no such fee, the share is shared_event_share_nofee; with no personal-loan return on that date the share is full_share.
      The tenure share follows the age of the line from its open date: tenure_long_months months or more give tenure_share_long; tenure_mid_months months or more but fewer than tenure_long_months give tenure_share_mid; a younger line gives full_share.
      The fee is assembled in this order: first the figured fee is set by the way that applies; then it is multiplied by every share above; then it is held to no more than the minimum payment due; and it is rounded to the cent.
    prerequisite: []
    cross_category:
      - category: loan
        as: history
        reads: [loan_transactions.event_type, loan_transactions.txn_date]
        note: The shared-event share looks for a personal-loan payment returned, and a personal-loan returned-payment fee booked, on the line's return date.
    compute:
      - charged_return_date: "LATEST('line_transactions', 'txn_date', date_field='txn_date', event_type='line_payment_returned') or NOW"
      - charged_return_amount: "LATEST('line_transactions', 'amount', date_field='txn_date', event_type='line_payment_returned') or 0"
      - minimum_due_cap: "F('minimum_payment_due')"
      - returns_last_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_payment_returned')"
      - returns_last_24m: "COUNT('line_transactions', within_months=24, date_field='txn_date', event_type='line_payment_returned')"
      - return_history_share: "K('history_share_clean') if returns_last_24m == 1 else (K('history_share_older') if returns_last_12m == 1 and returns_last_24m >= 2 else K('full_share'))"
      - charged_return_code: "LATEST('line_transactions', 'return_code', date_field='txn_date', event_type='line_payment_returned')"
      - fee_figuring_code: "1 if float(charged_return_amount) < K('proportional_ceiling_usd') and (charged_return_code == 'R01' or charged_return_code == 'R09') else (2 if float(charged_return_amount) >= K('proportional_ceiling_usd') else 0)"
      - booking_lag_months: "MONTHS(charged_return_date, NOW)"
      - late_booking_share: "K('late_booking_share_two') if booking_lag_months >= 2 else (K('late_booking_share_one') if booking_lag_months == 1 else K('full_share'))"
      - loan_returns_same_day: "XCOUNT('loan', 'loan_transactions', event_type='loan_payment_returned', txn_date=charged_return_date)"
      - loan_return_fees_same_day: "XCOUNT('loan', 'loan_transactions', event_type='loan_returned_payment_fee_assessed', txn_date=charged_return_date)"
      - shared_event_share: "K('shared_event_share_fee') if loan_returns_same_day >= 1 and loan_return_fees_same_day >= 1 else (K('shared_event_share_nofee') if loan_returns_same_day >= 1 and loan_return_fees_same_day == 0 else K('full_share'))"
      - fee_line_age: "MONTHS(F('open_date'), NOW)"
      - tenure_share: "K('tenure_share_long') if fee_line_age >= K('tenure_long_months') else (K('tenure_share_mid') if fee_line_age >= K('tenure_mid_months') else K('full_share'))"
      - proportional_fee: "RND(float(charged_return_amount) * K('proportional_percent') / 100, 2)"
      - figured_fee: "min(P('returned_payment_fee_usd'), proportional_fee) if fee_figuring_code == 1 else (max(P('returned_payment_fee_usd'), proportional_fee) if fee_figuring_code == 2 else P('returned_payment_fee_usd'))"
      - result: "RND(MN(figured_fee * return_history_share * late_booking_share * shared_event_share * tenure_share, float(minimum_due_cap)), 2)"
    compute_basis:
      charged_return_date: "The most recent returned payment is the latest return on the line by return date (of two returns on the same date, the one recorded first)."
      charged_return_amount: "The way the fee is figured follows the amount and the code of that return"
      minimum_due_cap: "never more than the minimum payment due"
      returns_last_12m: "The return-history share follows the payments returned on the line, the return being charged included"
      returns_last_24m: "The return-history share follows the payments returned on the line, the return being charged included"
      return_history_share: "when it is the only return in the last 24 months the share is history_share_clean; when it is the only return in the last 12 months but another return falls in the last 24 months the share is history_share_older; when two or more payments were returned in the last 12 months the share is full_share."
      charged_return_code: "The way the fee is figured follows the amount and the code of that return"
      fee_figuring_code: "when the amount returned is below proportional_ceiling_usd and the return code is R01 or R09 (funds not available), the figured fee is proportional_percent percent of the amount returned, rounded to the cent, but never more than the tier's returned-payment fee; when the amount returned is proportional_ceiling_usd or more, the figured fee is the larger of the tier's returned-payment fee and proportional_percent percent of the amount returned, rounded to the cent; any other fee-bearing return below proportional_ceiling_usd is figured at the tier's returned-payment fee."
      booking_lag_months: "The late-booking share follows the whole calendar months from the return date to the booking date"
      late_booking_share: "two months or more give late_booking_share_two; one month gives late_booking_share_one; less than one month gives full_share."
      loan_returns_same_day: "The shared-event share follows the borrower's personal loans on the return date"
      loan_return_fees_same_day: "a personal-loan returned-payment fee was booked that date"
      shared_event_share: "when a personal-loan payment was returned on the same date and a personal-loan returned-payment fee was booked that date, the share is shared_event_share_fee; when a personal-loan payment was returned on the same date with no such fee, the share is shared_event_share_nofee; with no personal-loan return on that date the share is full_share."
      fee_line_age: "The tenure share follows the age of the line from its open date"
      tenure_share: "tenure_long_months months or more give tenure_share_long; tenure_mid_months months or more but fewer than tenure_long_months give tenure_share_mid; a younger line gives full_share."
      proportional_fee: "proportional_percent percent of the amount returned, rounded to the cent"
      figured_fee: "first the figured fee is set by the way that applies"
      result: "then it is multiplied by every share above; then it is held to no more than the minimum payment due; and it is rounded to the cent."
    factors:
      - id: return_history_share
        effect: parameter
        decides: return_history_share
        bindings: [returns_last_12m, returns_last_24m, return_history_share]
        ladder:
          - when: "the return being charged is the only payment returned on the line in the last 24 months"
            value: "K('history_share_clean')"
          - when: "it is the only return in the last 12 months and another return falls in the last 24 months"
            value: "K('history_share_older')"
          - when: "otherwise (two or more returns in the last 12 months)"
            value: "K('full_share')"
        baseline:
          return_history_share: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: returned_fee_figuring
        effect: method
        decides: fee_figuring_code
        bindings: [charged_return_code, fee_figuring_code]
        ladder:
          - when: "the amount returned is below proportional_ceiling_usd and the return code is R01 or R09"
            method: "proportional_percent percent of the amount returned, rounded to the cent, never more than the tier's returned-payment fee (the smaller of the two)"
          - when: "the amount returned is proportional_ceiling_usd or more"
            method: "the larger of the tier's returned-payment fee and proportional_percent percent of the amount returned"
          - when: "otherwise (a smaller return with another fee-bearing code)"
            method: "the tier's returned-payment fee as a flat amount"
        baseline:
          fee_figuring_code: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_booking_share
        effect: parameter
        decides: late_booking_share
        bindings: [booking_lag_months, late_booking_share]
        ladder:
          - when: "two or more whole calendar months from the return date to the booking date"
            value: "K('late_booking_share_two')"
          - when: "one whole calendar month from the return date to the booking date"
            value: "K('late_booking_share_one')"
          - when: "otherwise (booked within the month of the return)"
            value: "K('full_share')"
        baseline:
          late_booking_share: "K('full_share')"
        evidence: [date]
        cross_difficulty: null
      - id: shared_return_event
        effect: parameter
        decides: shared_event_share
        bindings: [loan_returns_same_day, loan_return_fees_same_day, shared_event_share]
        ladder:
          - when: "a personal-loan payment returned on the line's return date and a personal-loan returned-payment fee booked that date"
            value: "K('shared_event_share_fee')"
          - when: "a personal-loan payment returned on the line's return date and no personal-loan returned-payment fee booked that date"
            value: "K('shared_event_share_nofee')"
          - when: "otherwise (no personal-loan return on that date)"
            value: "K('full_share')"
        baseline:
          shared_event_share: "K('full_share')"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: line_tenure_share
        effect: parameter
        decides: tenure_share
        bindings: [fee_line_age, tenure_share]
        ladder:
          - when: "the line open tenure_long_months whole calendar months or more"
            value: "K('tenure_share_long')"
          - when: "the line open tenure_mid_months whole calendar months or more but fewer than tenure_long_months"
            value: "K('tenure_share_mid')"
          - when: "otherwise (open fewer than tenure_mid_months months)"
            value: "K('full_share')"
        baseline:
          tenure_share: "K('full_share')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The returned-payment fee is the tier's returned-payment fee for the return, never more than the minimum payment due, rounded to the cent.
      params: [returned_payment_fee_usd]
    inputs:
      history:
        - {table: line_transactions, aggregate: latest, field: amount, filters: {event_type: line_payment_returned}}
        - {table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_payment_returned}}
        - {table: line_transactions, aggregate: count, field: line_txn_id, within_months: 24, filters: {event_type: line_payment_returned}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, filters: {event_type: loan_payment_returned}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, filters: {event_type: loan_returned_payment_fee_assessed}}
      cross_category: [loan]
  - id: line_ext_backbilled_draw_fee
    base_policy_refs: [line_evt_draws]
    overwrite:
      - base_policy: line_evt_draws
        superseded_clause: >-
          Each draw carries a draw fee of the tier's draw fee percent of the draw, rounded to the cent and not less than the tier's minimum draw fee (no fee where the percent is 0.00), added to the balance on the draw date; the draw fee counts toward the balance but not toward the daily maximum.
        replaced_by: >-
          On a tier whose draw fee percent is above 0.00, when the line's most recent draw posted without its draw fee, and only for that draw, the draw fee is the back-billed amount this paragraph sets in place of the tier's draw fee percent of the draw, booked as its own entry against that draw, dated and added to the balance on the date it is booked rather than on the draw date the draw-fee record otherwise carries; every other draw still carries a draw fee of the tier's draw fee percent of the draw, rounded to the cent and not less than the tier's minimum draw fee (no fee where the percent is 0.00), added to the balance on the draw date, and the draw fee counts toward the balance but not toward the daily maximum.
      - base_policy: line_evt_draws
        superseded_clause: >-
          Draws are allowed only while the line is in active status.
        replaced_by: >-
          A draw fee back-billed for a draw already made is booked whatever the line's status at the time of booking; new draws themselves are still allowed only while the line is in active status.
    trigger: state_due
    subject: [line_draw_fee_assessed]
    computes: fee_amount
    target_tool: assess_draw_fee_4f046c6c
    params:
      large_draw_share: 0.25
      mid_draw_share: 0.05
      large_draw_points: 0.25
      mid_draw_points: 0.10
      frequent_draw_count: 6
      graduated_threshold_usd: 500.00
      fee_free_portion_usd: 100.00
      backbill_share_two: 0.75
      backbill_share_one: 0.90
      full_share: 1.00
      tenure_long_months: 48
      tenure_mid_months: 24
      tenure_points_long: 0.50
      tenure_points_mid: 0.25
      clean_points: 0.25
      one_late_points: 0.10
    rule: >-
      On a tier whose draw fee percent is above 0.00, when the line's most recent draw posted without its draw fee, and only for that draw, the draw fee is the back-billed amount this paragraph sets in place of the tier's draw fee percent of the draw, booked as its own entry against that draw, dated and added to the balance on the date it is booked rather than on the draw date the draw-fee record otherwise carries; every other draw still carries a draw fee of the tier's draw fee percent of the draw, rounded to the cent and not less than the tier's minimum draw fee (no fee where the percent is 0.00), added to the balance on the draw date, and the draw fee counts toward the balance but not toward the daily maximum.
      Every rounding to the cent in this paragraph takes an exact half cent to the even cent.
      A draw fee back-billed for a draw already made is booked whatever the line's status at the time of booking; new draws themselves are still allowed only while the line is in active status. On a tier whose draw fee percent is 0.00 no back-billed fee arises and nothing is booked; on any other tier the back-billed fee is never 0.00, since it is at least the tier's minimum draw fee times the back-billing share.
      For the back-billed draw fee, whole calendar months are counted from a start date to an end date, a month counting only once the end date's day of the month reaches the start date's day of the month, and a window of the last 12 months takes the entries dated after the same day of the month 12 months before the booking date.
      The back-billed draw fee is the tier's draw fee percent of the draw, rounded to the cent and not less than the tier's minimum draw fee.
      The draw being billed is the line's most recent draw by draw date (of two draws on the same date, the one recorded first).
      The draw-size points are taken off the tier's draw fee percent by the draw measured against the credit limit, so a larger draw billed late carries a smaller surprise: a draw of more than large_draw_share of the credit limit takes off large_draw_points percentage points; a draw of more than mid_draw_share and no more than large_draw_share of it takes off mid_draw_points percentage points; a draw of mid_draw_share of the credit limit or less takes off nothing.
      The tenure points are taken off the tier's draw fee percent by the age of the line from its open date: tenure_long_months months or more take off tenure_points_long percentage points; tenure_mid_months months or more but fewer than tenure_long_months take off tenure_points_mid; a younger line takes off nothing; the percent never goes below 0.00.
      The payment-record points are taken off the tier's draw fee percent by the late-fee entries on the line in the last 12 months: none takes off clean_points percentage points; exactly one takes off one_late_points percentage points; two or more take off nothing.
      The way the back-billed fee is figured follows how often the line is drawn and the size of the draw: on a line with frequent_draw_count or more draws posted in the last 12 months, a draw below graduated_threshold_usd is charged the percent on the part of the draw above fee_free_portion_usd only; on such a line, a draw of graduated_threshold_usd or more is charged the full percent on the first graduated_threshold_usd and half the percent on the rest; on a line with fewer than frequent_draw_count draws in the last 12 months the percent is charged on the whole draw.
      The back-billing share follows the whole calendar months from the draw date to the booking date: two months or more give backbill_share_two; one month gives backbill_share_one; less than one month gives full_share.
      The back-billed fee is assembled in this order: first the percent is the tier's draw fee percent less every point reduction above, never below 0.00; then the fee is figured on the draw at that percent in the way that applies and rounded to the cent; then that figure is raised to the tier's minimum draw fee if it is below it; then it is multiplied by the back-billing share; and it is rounded to the cent.
    prerequisite: []
    cross_category: []
    compute:
      - billed_draw_amount: "LATEST('line_transactions', 'amount', date_field='txn_date', event_type='line_draw_posted') or 0"
      - billed_draw_date: "LATEST('line_transactions', 'txn_date', date_field='txn_date', event_type='line_draw_posted') or NOW"
      - sized_draw_amount: "LATEST('line_transactions', 'amount', date_field='txn_date', event_type='line_draw_posted') or 0"
      - draw_size_points: "K('large_draw_points') if float(sized_draw_amount) > F('credit_limit') * K('large_draw_share') else (K('mid_draw_points') if float(sized_draw_amount) > F('credit_limit') * K('mid_draw_share') else 0)"
      - record_late_fees_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - record_points: "K('clean_points') if record_late_fees_12m == 0 else (K('one_late_points') if record_late_fees_12m == 1 else 0)"
      - fee_line_age: "MONTHS(F('open_date'), NOW)"
      - tenure_points: "K('tenure_points_long') if fee_line_age >= K('tenure_long_months') else (K('tenure_points_mid') if fee_line_age >= K('tenure_mid_months') else 0)"
      - draws_last_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_draw_posted')"
      - fee_figuring_way: "1 if draws_last_12m >= K('frequent_draw_count') and float(billed_draw_amount) < K('graduated_threshold_usd') else (2 if draws_last_12m >= K('frequent_draw_count') and float(billed_draw_amount) >= K('graduated_threshold_usd') else 0)"
      - backbill_lag_months: "MONTHS(billed_draw_date, NOW)"
      - backbill_share: "K('backbill_share_two') if backbill_lag_months >= 2 else (K('backbill_share_one') if backbill_lag_months == 1 else K('full_share'))"
      - applied_percent: "MX(0, P('draw_fee_percent') - draw_size_points - record_points - tenure_points)"
      - figured_draw_fee: "RND((float(billed_draw_amount) - K('fee_free_portion_usd')) * applied_percent / 100, 2) if fee_figuring_way == 1 else (RND(K('graduated_threshold_usd') * applied_percent / 100 + (float(billed_draw_amount) - K('graduated_threshold_usd')) * applied_percent / 200, 2) if fee_figuring_way == 2 else RND(float(billed_draw_amount) * applied_percent / 100, 2))"
      - floored_draw_fee: "max(figured_draw_fee, P('draw_fee_min_usd'))"
      - result: "RND(floored_draw_fee * backbill_share, 2) if P('draw_fee_percent') > 0 else 0"
    compute_basis:
      billed_draw_amount: "The draw being billed is the line's most recent draw by draw date (of two draws on the same date, the one recorded first)."
      billed_draw_date: "The draw being billed is the line's most recent draw by draw date (of two draws on the same date, the one recorded first)."
      sized_draw_amount: "The draw-size points are taken off the tier's draw fee percent by the draw measured against the credit limit"
      draw_size_points: "a draw of more than large_draw_share of the credit limit takes off large_draw_points percentage points; a draw of more than mid_draw_share and no more than large_draw_share of it takes off mid_draw_points percentage points; a draw of mid_draw_share of the credit limit or less takes off nothing."
      record_late_fees_12m: "The payment-record points are taken off the tier's draw fee percent by the late-fee entries on the line in the last 12 months"
      record_points: "none takes off clean_points percentage points; exactly one takes off one_late_points percentage points; two or more take off nothing."
      fee_line_age: "The tenure points are taken off the tier's draw fee percent by the age of the line from its open date"
      tenure_points: "tenure_long_months months or more take off tenure_points_long percentage points; tenure_mid_months months or more but fewer than tenure_long_months take off tenure_points_mid; a younger line takes off nothing; the percent never goes below 0.00."
      draws_last_12m: "on a line with frequent_draw_count or more draws posted in the last 12 months"
      fee_figuring_way: "on a line with frequent_draw_count or more draws posted in the last 12 months, a draw below graduated_threshold_usd is charged the percent on the part of the draw above fee_free_portion_usd only; on such a line, a draw of graduated_threshold_usd or more is charged the full percent on the first graduated_threshold_usd and half the percent on the rest; on a line with fewer than frequent_draw_count draws in the last 12 months the percent is charged on the whole draw."
      backbill_lag_months: "The back-billing share follows the whole calendar months from the draw date to the booking date"
      backbill_share: "two months or more give backbill_share_two; one month gives backbill_share_one; less than one month gives full_share."
      applied_percent: "first the percent is the tier's draw fee percent less every point reduction above, never below 0.00"
      figured_draw_fee: "then the fee is figured on the draw at that percent in the way that applies and rounded to the cent"
      floored_draw_fee: "then that figure is raised to the tier's minimum draw fee if it is below it"
      result: "then it is multiplied by the back-billing share; and it is rounded to the cent."
    factors:
      - id: draw_size_points
        effect: parameter
        decides: draw_size_points
        bindings: [sized_draw_amount, draw_size_points]
        ladder:
          - when: "the draw billed is more than large_draw_share of the credit limit"
            value: "K('large_draw_points')"
          - when: "the draw billed is more than mid_draw_share and no more than large_draw_share of the credit limit"
            value: "K('mid_draw_points')"
          - when: "otherwise (mid_draw_share of the credit limit or less)"
            value: "0"
        baseline:
          draw_size_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: payment_record_points
        effect: parameter
        decides: record_points
        bindings: [record_late_fees_12m, record_points]
        ladder:
          - when: "no late-fee entry on the line in the last 12 months"
            value: "K('clean_points')"
          - when: "exactly one late-fee entry on the line in the last 12 months"
            value: "K('one_late_points')"
          - when: "otherwise (two or more late-fee entries in the last 12 months)"
            value: "0"
        baseline:
          record_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: draw_fee_tenure_points
        effect: parameter
        decides: tenure_points
        bindings: [fee_line_age, tenure_points]
        ladder:
          - when: "the line open tenure_long_months whole calendar months or more"
            value: "K('tenure_points_long')"
          - when: "the line open tenure_mid_months whole calendar months or more but fewer than tenure_long_months"
            value: "K('tenure_points_mid')"
          - when: "otherwise (open fewer than tenure_mid_months months)"
            value: "0"
        baseline:
          tenure_points: "0"
        evidence: [date]
        cross_difficulty: null
      - id: frequent_drawer_figuring
        effect: method
        decides: fee_figuring_way
        bindings: [draws_last_12m, fee_figuring_way]
        ladder:
          - when: "frequent_draw_count or more draws posted in the last 12 months and a draw below graduated_threshold_usd"
            method: "the percent is charged only on the part of the draw above fee_free_portion_usd"
          - when: "frequent_draw_count or more draws posted in the last 12 months and a draw of graduated_threshold_usd or more"
            method: "the full percent on the first graduated_threshold_usd and half the percent on the rest of the draw"
          - when: "otherwise (fewer than frequent_draw_count draws in the last 12 months)"
            method: "the percent on the whole draw"
        baseline:
          fee_figuring_way: "0"
        evidence: [history]
        cross_difficulty: null
      - id: backbilling_share
        effect: parameter
        decides: backbill_share
        bindings: [backbill_lag_months, backbill_share]
        ladder:
          - when: "two or more whole calendar months from the draw date to the booking date"
            value: "K('backbill_share_two')"
          - when: "one whole calendar month from the draw date to the booking date"
            value: "K('backbill_share_one')"
          - when: "otherwise (booked within the month of the draw)"
            value: "K('full_share')"
        baseline:
          backbill_share: "K('full_share')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The back-billed draw fee is the tier's draw fee percent of the draw, rounded to the cent and not less than the tier's minimum draw fee.
      params: [draw_fee_percent, draw_fee_min_usd]
    inputs:
      history:
        - {table: line_transactions, aggregate: latest, field: amount, filters: {event_type: line_draw_posted}}
        - {table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_draw_posted}}
        - {table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_late_fee_assessed}}
      cross_category: []
  - id: line_ext_limit_increase
    base_policy_refs: [line_evt_limit_changes]
    overwrite:
      - base_policy: line_evt_limit_changes
        superseded_clause: >-
          An increase also needs at least limit_increase_min_on_time_payments consecutive on-time minimum payments and fewer than limit_requests_per_6_months increase requests in the last 6 months, uses a hard credit inquiry, and is granted for at most the tier's maximum increase percent of the current limit, never above the tier's maximum limit; the tier itself never changes.
        replaced_by: >-
          An increase also needs no minimum payment on the line paid 30 or more days after its due date in the last 12 months (in place of the run of limit_increase_min_on_time_payments consecutive on-time minimum payments the tier's parameter describes) and fewer than limit_requests_per_6_months other increase requests in the last 6 months besides the one being decided, uses a hard credit inquiry the borrower authorizes, and is granted in the amount this paragraph sets, never above the limit requested or the tier's maximum limit; the tier itself never changes.
    trigger: on_request
    subject: [line_limit_changed]
    computes: approved_limit
    target_tool: authorize_limit_increase_21546d5b
    params:
      graduated_first_usd: 5000.00
      graduated_limit_usd: 7500.00
      protected_base_usd: 1000.00
      protected_limit_ceiling_usd: 5000.00
      draw_heavy_share: 0.65
      draw_some_share: 0.40
      draw_share_heavy: 0.80
      draw_share_some: 0.90
      high_use_share: 0.80
      mid_use_share: 0.60
      use_share_high: 0.60
      use_share_mid: 0.80
      nsf_share_one: 0.75
      nsf_share_repeat: 0.50
      exposure_high_usd: 30000.00
      exposure_mid_usd: 15000.00
      exposure_share_high: 0.75
      exposure_share_mid: 0.90
      full_share: 1.00
      limit_step_usd: 100.00
    rule: >-
      An increase also needs no minimum payment on the line paid 30 or more days after its due date in the last 12 months (in place of the run of limit_increase_min_on_time_payments consecutive on-time minimum payments the tier's parameter describes) and fewer than limit_requests_per_6_months other increase requests in the last 6 months besides the one being decided, uses a hard credit inquiry the borrower authorizes, and is granted in the amount this paragraph sets, never above the limit requested or the tier's maximum limit; the tier itself never changes.
      Every rounding to the cent in this paragraph takes an exact half cent to the even cent.
      An increase request awaiting decision is decided once the borrower authorizes the hard credit inquiry in person; the decision is recorded on the request and the approved limit takes effect at once. The approved limit is never below the current credit limit and never 0.00; when it comes to the current credit limit the request is still recorded with that limit as the approved limit, and the line stays as it is.
      For the limit increase, whole calendar months are counted from a start date to an end date, a month counting only once the end date's day of the month reaches the start date's day of the month, and a window of the last N months takes the entries dated after the same day of the month N months before the decision date.
      The approved limit is fixed only after every returned payment on the line whose return code carries a fee shows its returned-payment fee entry.
      The approved limit is not fixed until each draw on the line carries a draw-fee entry, wherever the tier charges a draw fee.
      The approved limit is fixed only after the returned-payment fee of a return that has a replacement payment recorded against it carries a courtesy fee-waiver entry.
      The approved limit is the current credit limit plus the tier's maximum increase percent of it, rounded down to the next limit_step_usd, never above the limit requested or the tier's maximum limit.
      The draw-intensity share scales the increase by the draw charges posted on the line in the last 3 months, the draws and their draw-fee entries added up, measured against the current credit limit: draw_heavy_share of it or more gives draw_share_heavy; draw_some_share or more but less than draw_heavy_share gives draw_share_some; less than draw_some_share gives full_share.
      The usage share scales the increase by the outstanding balance (the line's ledger entries added up, charges less payments and waivers) measured against the current credit limit on the decision date: more than high_use_share of it gives use_share_high; more than mid_use_share and no more than high_use_share gives use_share_mid; mid_use_share or less gives full_share.
      The returned-fee share scales the increase by the returned-payment fee entries on the line in the last 12 months: exactly one gives nsf_share_one; two or more give nsf_share_repeat; none gives full_share.
      The exposure share scales the increase by the borrower's combined Larkspur unsecured credit, the current credit limit plus the unpaid principal of the borrower's active personal loan (the one recorded first when there are two): exposure_high_usd or more gives exposure_share_high; exposure_mid_usd or more but below exposure_high_usd gives exposure_share_mid; below exposure_mid_usd, or with no active personal loan, gives full_share.
      The way the increase is figured follows the current credit limit and its age: on a limit of graduated_limit_usd or more, the tier's maximum increase percent applies to the first graduated_first_usd and half that percent applies to the rest; on a limit of protected_limit_ceiling_usd or less on a line open 24 months or more, the percent applies only to the part of the limit above protected_base_usd; on any other limit the percent applies to the whole limit.
      The limit requested is the requested limit of the line's latest increase request awaiting decision (of two on the same date, the one recorded first), or the current credit limit when there is none.
      The approved limit is assembled in this order: first the increase is figured in the way that applies; then it is multiplied by every share above; then it is added to the current credit limit and the sum is rounded down to the next limit_step_usd; and then it is held to no more than the limit requested and the tier's maximum limit.
    prerequisite:
      - problem: line_ext_returned_payment_fee
        kind: value_input
        gate: returned_fee_share
        form: state
        policy_source: >-
          The approved limit is fixed only after every returned payment on the line whose return code carries a fee shows its returned-payment fee entry.
        condition: >-
          Every line_payment_returned entry on the line whose return code is in the tier's fee_bearing_return_codes is the related entry of a line_returned_payment_fee_assessed entry.
        resolved_by: assess_returned_payment_fee_0fd8e99d
        effect: >-
          The returned-payment fee entry joins the line's fee entries in the last 12 months, so the returned-fee share moves to the one-fee tier and the increase shrinks.
      - problem: line_ext_backbilled_draw_fee
        kind: value_input
        gate: recent_draw_charges
        form: state
        policy_source: >-
          The approved limit is not fixed until each draw on the line carries a draw-fee entry, wherever the tier charges a draw fee.
        condition: >-
          On a tier whose draw fee percent is above 0.00, every line_draw_posted entry on the line is the related entry of a line_draw_fee_assessed entry.
        resolved_by: assess_draw_fee_4f046c6c
        effect: >-
          The missing draw fee joins the draw charges of the last 3 months, so the draw-intensity share is read on the full charges of the draws.
      - problem: line_ext_returned_fee_relief
        kind: value_input
        gate: usage_balance
        form: state
        policy_source: >-
          The approved limit is fixed only after the returned-payment fee of a return that has a replacement payment recorded against it carries a courtesy fee-waiver entry.
        condition: >-
          When the line's most recent returned payment has a payment recorded against it as its replacement and a returned-payment fee booked against it, a line_fee_waived entry with waiver_reason courtesy whose related entry is that fee exists.
        resolved_by: grant_returned_fee_relief_6fbb0f32
        effect: >-
          The relief comes off the line's ledger, so the outstanding balance the usage share reads is the one after the relief.
    cross_category:
      - category: loan
        as: branch
        reads: [status, principal_balance]
        note: The exposure share adds the unpaid principal of the borrower's active personal loan to the line's credit limit.
    compute:
      - current_limit: "F('credit_limit')"
      - requested_limit_cap: "LATEST('line_limit_requests', 'requested_limit', date_field='request_date', request_type='increase', decision_status='pending_review') or F('credit_limit')"
      - recent_draw_charges: "SUM('line_transactions', 'amount', within_months=3, date_field='txn_date', event_type='line_draw_posted') + SUM('line_transactions', 'amount', within_months=3, date_field='txn_date', event_type='line_draw_fee_assessed')"
      - draw_intensity_scale: "K('draw_share_heavy') if recent_draw_charges >= current_limit * K('draw_heavy_share') else (K('draw_share_some') if recent_draw_charges >= current_limit * K('draw_some_share') else K('full_share'))"
      - usage_balance: "SUM('line_transactions', 'amount', event_type='line_draw_posted') + SUM('line_transactions', 'amount', event_type='line_draw_fee_assessed') + SUM('line_transactions', 'amount', event_type='line_interest_charged') + SUM('line_transactions', 'amount', event_type='line_annual_fee_assessed') + SUM('line_transactions', 'amount', event_type='line_payment_returned') + SUM('line_transactions', 'amount', event_type='line_late_fee_assessed') + SUM('line_transactions', 'amount', event_type='line_returned_payment_fee_assessed') - SUM('line_transactions', 'amount', event_type='line_payment_posted') - SUM('line_transactions', 'amount', event_type='line_fee_waived')"
      - usage_scale: "K('use_share_high') if usage_balance > current_limit * K('high_use_share') else (K('use_share_mid') if usage_balance > current_limit * K('mid_use_share') else K('full_share'))"
      - returned_fee_entries_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_returned_payment_fee_assessed')"
      - returned_fee_share: "K('nsf_share_one') if returned_fee_entries_12m == 1 else (K('nsf_share_repeat') if returned_fee_entries_12m >= 2 else K('full_share'))"
      - loan_principal_now: "CFIELD('loan', 'principal_balance', status='active')"
      - exposure_scale: "K('exposure_share_high') if loan_principal_now != None and current_limit + float(loan_principal_now) >= K('exposure_high_usd') else (K('exposure_share_mid') if loan_principal_now != None and current_limit + float(loan_principal_now) >= K('exposure_mid_usd') else K('full_share'))"
      - increase_way: "1 if current_limit >= K('graduated_limit_usd') else (2 if current_limit <= K('protected_limit_ceiling_usd') and MONTHS(F('open_date'), NOW) >= 24 else 0)"
      - figured_increase: "K('graduated_first_usd') * P('limit_increase_max_percent') / 100 + (current_limit - K('graduated_first_usd')) * P('limit_increase_max_percent') / 200 if increase_way == 1 else ((current_limit - K('protected_base_usd')) * P('limit_increase_max_percent') / 100 if increase_way == 2 else current_limit * P('limit_increase_max_percent') / 100)"
      - scaled_increase: "figured_increase * draw_intensity_scale * usage_scale * returned_fee_share * exposure_scale"
      - stepped_new_limit: "int((current_limit + scaled_increase) / K('limit_step_usd')) * K('limit_step_usd')"
      - result: "MX(current_limit, MN(stepped_new_limit, float(requested_limit_cap), P('max_credit_limit_usd')))"
    compute_basis:
      current_limit: "The approved limit is the current credit limit plus the tier's maximum increase percent of it, rounded down to the next limit_step_usd, never above the limit requested or the tier's maximum limit."
      requested_limit_cap: "The limit requested is the requested limit of the line's latest increase request awaiting decision (of two on the same date, the one recorded first), or the current credit limit when there is none."
      recent_draw_charges: "The draw-intensity share scales the increase by the draw charges posted on the line in the last 3 months, the draws and their draw-fee entries added up, measured against the current credit limit"
      draw_intensity_scale: "draw_heavy_share of it or more gives draw_share_heavy; draw_some_share or more but less than draw_heavy_share gives draw_share_some; less than draw_some_share gives full_share."
      usage_balance: "the outstanding balance (the line's ledger entries added up, charges less payments and waivers)"
      usage_scale: "more than high_use_share of it gives use_share_high; more than mid_use_share and no more than high_use_share gives use_share_mid; mid_use_share or less gives full_share."
      returned_fee_entries_12m: "The returned-fee share scales the increase by the returned-payment fee entries on the line in the last 12 months"
      returned_fee_share: "exactly one gives nsf_share_one; two or more give nsf_share_repeat; none gives full_share."
      loan_principal_now: "the unpaid principal of the borrower's active personal loan (the one recorded first when there are two)"
      exposure_scale: "exposure_high_usd or more gives exposure_share_high; exposure_mid_usd or more but below exposure_high_usd gives exposure_share_mid; below exposure_mid_usd, or with no active personal loan, gives full_share."
      increase_way: "on a limit of graduated_limit_usd or more, the tier's maximum increase percent applies to the first graduated_first_usd and half that percent applies to the rest; on a limit of protected_limit_ceiling_usd or less on a line open 24 months or more, the percent applies only to the part of the limit above protected_base_usd; on any other limit the percent applies to the whole limit."
      figured_increase: "first the increase is figured in the way that applies"
      scaled_increase: "then it is multiplied by every share above"
      stepped_new_limit: "then it is added to the current credit limit and the sum is rounded down to the next limit_step_usd"
      result: "and then it is held to no more than the limit requested and the tier's maximum limit."
    factors:
      - id: draw_intensity_scale
        effect: parameter
        decides: draw_intensity_scale
        bindings: [recent_draw_charges, draw_intensity_scale]
        ladder:
          - when: "draws and draw fees posted in the last 3 months total draw_heavy_share of the current credit limit or more"
            value: "K('draw_share_heavy')"
          - when: "they total draw_some_share or more but less than draw_heavy_share of the limit"
            value: "K('draw_share_some')"
          - when: "otherwise (less than draw_some_share of the limit)"
            value: "K('full_share')"
        baseline:
          draw_intensity_scale: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: increase_usage_scale
        effect: parameter
        decides: usage_scale
        bindings: [usage_balance, usage_scale]
        ladder:
          - when: "an outstanding balance of more than high_use_share of the current credit limit"
            value: "K('use_share_high')"
          - when: "an outstanding balance of more than mid_use_share and no more than high_use_share of the current credit limit"
            value: "K('use_share_mid')"
          - when: "otherwise (mid_use_share of the limit or less)"
            value: "K('full_share')"
        baseline:
          usage_scale: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: increase_returned_fee_scale
        effect: parameter
        decides: returned_fee_share
        bindings: [returned_fee_entries_12m, returned_fee_share]
        ladder:
          - when: "exactly one returned-payment fee entry on the line in the last 12 months"
            value: "K('nsf_share_one')"
          - when: "two or more returned-payment fee entries in the last 12 months"
            value: "K('nsf_share_repeat')"
          - when: "otherwise (none in the last 12 months)"
            value: "K('full_share')"
        baseline:
          returned_fee_share: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: combined_exposure_scale
        effect: parameter
        decides: exposure_scale
        bindings: [loan_principal_now, exposure_scale]
        ladder:
          - when: "the credit limit plus the active personal loan's unpaid principal is exposure_high_usd or more"
            value: "K('exposure_share_high')"
          - when: "the credit limit plus the active personal loan's unpaid principal is exposure_mid_usd or more but below exposure_high_usd"
            value: "K('exposure_share_mid')"
          - when: "otherwise (below exposure_mid_usd, or no active personal loan)"
            value: "K('full_share')"
        baseline:
          exposure_scale: "K('full_share')"
        evidence: [cross_category]
        cross_difficulty: loan
      - id: increase_figuring
        effect: method
        decides: increase_way
        bindings: [increase_way]
        ladder:
          - when: "a credit limit of graduated_limit_usd or more"
            method: "the maximum increase percent on the first graduated_first_usd and half of it on the rest of the limit"
          - when: "a credit limit of protected_limit_ceiling_usd or less on a line open 24 whole calendar months or more"
            method: "the maximum increase percent only on the part of the limit above protected_base_usd"
          - when: "otherwise"
            method: "the maximum increase percent on the whole limit"
        baseline:
          increase_way: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The approved limit is the current credit limit plus the tier's maximum increase percent of it, rounded down to the next limit_step_usd, never above the limit requested or the tier's maximum limit.
      params: [limit_increase_max_percent, limit_step_usd, max_credit_limit_usd]
    inputs:
      history:
        - {table: line_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: line_draw_fee_assessed}}
        - {table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_returned_payment_fee_assessed}}
        - {table: line_transactions, aggregate: sum, field: amount, filters: {event_type: line_draw_posted}}
      cross_category: [loan]
  - id: line_ext_returned_fee_relief
    base_policy_refs: [line_evt_fee_waiver]
    overwrite:
      - base_policy: line_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver of a late or returned-payment fee is granted on request when fewer than the tier's courtesy waivers per 12 months have been granted on the line.
        replaced_by: >-
          A courtesy waiver of a late or returned-payment fee is granted on request when fewer than the tier's courtesy waivers per 12 months have been granted on the line; workout relief on a past-due line closed to new draws and replacement relief on the fee of a replaced returned payment are courtesy waivers Larkspur grants without a request, each under its own paragraph, still only while fewer than the tier's courtesy waivers per 12 months have been granted on the line.
    trigger: state_due
    subject: [line_fee_waived]
    computes: relief_amount
    target_tool: grant_returned_fee_relief_6fbb0f32
    params:
      quick_days: 5
      slow_days: 15
      timing_share_mid: 0.80
      timing_share_late: 0.60
      half_cover_share: 0.50
      cover_share_part: 0.75
      cover_share_low: 0.50
      nsf_reason_share: 0.60
      closed_reason_share: 0.85
      late_share_one: 0.80
      late_share_repeat: 0.50
      full_share: 1.00
    rule: >-
      A courtesy waiver of a late or returned-payment fee is granted on request when fewer than the tier's courtesy waivers per 12 months have been granted on the line; workout relief on a past-due line closed to new draws and replacement relief on the fee of a replaced returned payment are courtesy waivers Larkspur grants without a request, each under its own paragraph, still only while fewer than the tier's courtesy waivers per 12 months have been granted on the line.
      Every rounding to the cent in this paragraph takes an exact half cent to the even cent.
      When a payment on the line was returned and the borrower has made a replacement payment recorded against that return, Larkspur grants replacement relief on the returned-payment fee of that return without a request, booked as one courtesy fee-waiver entry against the fee on the day it is granted, taken off the outstanding balance and counted as a courtesy waiver; the relief is never more than the fee it is booked against, and the window of the fee-waiver paragraph still applies. A relief that computes to 0.00 for a replaced return whose fee is booked is still booked, as a 0.00 entry against that fee; with no fee booked against the return, or no replacement payment recorded against it, there is nothing to book.
      For the replacement relief, whole calendar months are counted from a start date to an end date, a month counting only once the end date's day of the month reaches the start date's day of the month, a window of the last 12 months takes the entries dated after the same day of the month 12 months before the relief date, and days are counted in calendar days from the return date to the date of the replacement payment.
      Replacement relief is fixed only after the returned payment it is for carries its returned-payment fee entry.
      The replacement relief is the returned-payment fee booked against the line's most recent returned payment (the latest return by return date; of two returns on the same date, the one recorded first), waived in full; with no returned-payment fee booked against that return, or no payment recorded against it as its replacement, there is no relief.
      The timing share follows the days from the return date to the latest replacement payment recorded against the return (of two on the same date, the one recorded first): quick_days days or fewer give full_share; more than quick_days and no more than slow_days days give timing_share_mid; more than slow_days days give timing_share_late.
      The cover share follows the replacement payments recorded against the return, added up, measured against the amount returned: the whole amount returned or more gives full_share; half_cover_share of it or more but less than the whole gives cover_share_part; less than half_cover_share of it gives cover_share_low.
      The reason share follows the return code of that return: R01 or R09 (funds not available) give nsf_reason_share; R02, R03 or R04 (account closed, no account, invalid account) give closed_reason_share; any other code gives full_share.
      The late-history share follows the late-fee entries on the line in the last 12 months: exactly one gives late_share_one; two or more give late_share_repeat; none gives full_share.
      The relief basis follows the borrower's personal loans on the return date, so that one bank event earns relief once: when a personal-loan returned-payment fee booked on the line's return date (the one recorded first when there are two) already carries a personal-loan fee waiver, the basis is the line's fee less the amount waived on that loan fee, never below 0.00; when such a loan fee was booked and carries no waiver, the basis is the line's fee but no more than the tier's flat returned_payment_fee_usd; with no personal-loan returned-payment fee booked on that date, the basis is the line's fee.
      The replacement relief is assembled in this order: first the relief basis is set as above; then it is multiplied by every share above; and it is rounded to the cent.
    prerequisite:
      - problem: line_ext_returned_payment_fee
        kind: value_input
        gate: relieved_fee
        form: state
        policy_source: >-
          Replacement relief is fixed only after the returned payment it is for carries its returned-payment fee entry.
        condition: >-
          The line's most recent line_payment_returned entry, whose return code is in the tier's fee_bearing_return_codes, is the related entry of a line_returned_payment_fee_assessed entry.
        resolved_by: assess_returned_payment_fee_0fd8e99d
        effect: >-
          The fee booked for the return is the amount the relief basis starts from, so the relief can be figured and booked against it.
    cross_category:
      - category: loan
        as: history
        reads: [loan_transactions.event_type, loan_transactions.txn_date, loan_transactions.related_txn_id, loan_transactions.amount]
        note: The relief basis looks for a personal-loan returned-payment fee booked on the line's return date and any personal-loan fee waiver booked against it.
    compute:
      - relief_return_id: "LATEST('line_transactions', 'line_txn_id', date_field='txn_date', event_type='line_payment_returned')"
      - relief_return_date: "LATEST('line_transactions', 'txn_date', date_field='txn_date', event_type='line_payment_returned') or NOW"
      - relief_return_amount: "LATEST('line_transactions', 'amount', date_field='txn_date', event_type='line_payment_returned') or 0"
      - relieved_fee: "(LATEST('line_transactions', 'amount', date_field='txn_date', event_type='line_returned_payment_fee_assessed', related_txn_id=relief_return_id) or 0) if relief_return_id != None else 0"
      - replaced_amount: "SUM('line_transactions', 'amount', event_type='line_payment_posted', related_txn_id=relief_return_id) if relief_return_id != None else 0"
      - replacement_date: "LATEST('line_transactions', 'txn_date', date_field='txn_date', event_type='line_payment_posted', related_txn_id=relief_return_id) if relief_return_id != None else None"
      - replacement_days: "DAYS(relief_return_date, replacement_date) if replacement_date != None else 0"
      - timing_share: "K('full_share') if replacement_days <= K('quick_days') else (K('timing_share_mid') if replacement_days <= K('slow_days') else K('timing_share_late'))"
      - cover_replaced_total: "SUM('line_transactions', 'amount', event_type='line_payment_posted', related_txn_id=relief_return_id) if relief_return_id != None else 0"
      - cover_share: "K('full_share') if float(cover_replaced_total) >= float(relief_return_amount) else (K('cover_share_part') if float(cover_replaced_total) >= float(relief_return_amount) * K('half_cover_share') else K('cover_share_low'))"
      - relief_return_code: "LATEST('line_transactions', 'return_code', date_field='txn_date', event_type='line_payment_returned')"
      - reason_share: "K('nsf_reason_share') if relief_return_code == 'R01' or relief_return_code == 'R09' else (K('closed_reason_share') if relief_return_code == 'R02' or relief_return_code == 'R03' or relief_return_code == 'R04' else K('full_share'))"
      - relief_late_fees_12m: "COUNT('line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - relief_late_share: "K('late_share_one') if relief_late_fees_12m == 1 else (K('late_share_repeat') if relief_late_fees_12m >= 2 else K('full_share'))"
      - loan_fee_same_day_id: "XLATEST('loan', 'loan_transactions', 'loan_txn_id', date_field='txn_date', event_type='loan_returned_payment_fee_assessed', txn_date=relief_return_date)"
      - loan_fee_waived_amount: "XSUM('loan', 'loan_transactions', 'amount', event_type='loan_fee_waived', related_txn_id=loan_fee_same_day_id) if loan_fee_same_day_id != None else 0"
      - loan_fee_waiver_count: "XCOUNT('loan', 'loan_transactions', event_type='loan_fee_waived', related_txn_id=loan_fee_same_day_id) if loan_fee_same_day_id != None else 0"
      - relief_basis_way: "1 if loan_fee_same_day_id != None and loan_fee_waiver_count >= 1 else (2 if loan_fee_same_day_id != None else 0)"
      - relief_basis: "MX(0, float(relieved_fee) - loan_fee_waived_amount) if relief_basis_way == 1 else (MN(float(relieved_fee), P('returned_payment_fee_usd')) if relief_basis_way == 2 else float(relieved_fee))"
      - result: "RND(relief_basis * timing_share * cover_share * reason_share * relief_late_share, 2) if float(relieved_fee) > 0 and float(replaced_amount) > 0 else 0"
    compute_basis:
      relief_return_id: "the line's most recent returned payment (the latest return by return date; of two returns on the same date, the one recorded first)"
      relief_return_date: "The timing share follows the days from the return date to the latest replacement payment recorded against the return"
      relief_return_amount: "measured against the amount returned"
      relieved_fee: "The replacement relief is the returned-payment fee booked against the line's most recent returned payment (the latest return by return date; of two returns on the same date, the one recorded first), waived in full"
      replaced_amount: "The cover share follows the replacement payments recorded against the return, added up"
      replacement_date: "the latest replacement payment recorded against the return (of two on the same date, the one recorded first)"
      replacement_days: "The timing share follows the days from the return date to the latest replacement payment recorded against the return"
      timing_share: "quick_days days or fewer give full_share; more than quick_days and no more than slow_days days give timing_share_mid; more than slow_days days give timing_share_late."
      cover_replaced_total: "The cover share follows the replacement payments recorded against the return, added up, measured against the amount returned"
      cover_share: "the whole amount returned or more gives full_share; half_cover_share of it or more but less than the whole gives cover_share_part; less than half_cover_share of it gives cover_share_low."
      relief_return_code: "The reason share follows the return code of that return"
      reason_share: "R01 or R09 (funds not available) give nsf_reason_share; R02, R03 or R04 (account closed, no account, invalid account) give closed_reason_share; any other code gives full_share."
      relief_late_fees_12m: "The late-history share follows the late-fee entries on the line in the last 12 months"
      relief_late_share: "exactly one gives late_share_one; two or more give late_share_repeat; none gives full_share."
      loan_fee_same_day_id: "a personal-loan returned-payment fee booked on the line's return date (the one recorded first when there are two)"
      loan_fee_waived_amount: "already carries a personal-loan fee waiver, the basis is the line's fee less the amount waived on that loan fee, never below 0.00"
      loan_fee_waiver_count: "when a personal-loan returned-payment fee booked on the line's return date (the one recorded first when there are two) already carries a personal-loan fee waiver"
      relief_basis_way: "The relief basis follows the borrower's personal loans on the return date, so that one bank event earns relief once"
      relief_basis: "when a personal-loan returned-payment fee booked on the line's return date (the one recorded first when there are two) already carries a personal-loan fee waiver, the basis is the line's fee less the amount waived on that loan fee, never below 0.00; when such a loan fee was booked and carries no waiver, the basis is the line's fee but no more than the tier's flat returned_payment_fee_usd; with no personal-loan returned-payment fee booked on that date, the basis is the line's fee."
      result: "first the relief basis is set as above; then it is multiplied by every share above; and it is rounded to the cent."
    factors:
      - id: replacement_timing_share
        effect: parameter
        decides: timing_share
        bindings: [replacement_days, timing_share]
        ladder:
          - when: "the latest replacement payment dated more than quick_days and no more than slow_days days after the return date"
            value: "K('timing_share_mid')"
          - when: "the latest replacement payment dated more than slow_days days after the return date"
            value: "K('timing_share_late')"
          - when: "otherwise (quick_days days or fewer)"
            value: "K('full_share')"
        baseline:
          timing_share: "K('full_share')"
        evidence: [history, date]
        cross_difficulty: null
      - id: replacement_cover_share
        effect: parameter
        decides: cover_share
        bindings: [cover_replaced_total, cover_share]
        ladder:
          - when: "replacement payments adding up to half_cover_share of the amount returned or more but less than the whole"
            value: "K('cover_share_part')"
          - when: "replacement payments adding up to less than half_cover_share of the amount returned"
            value: "K('cover_share_low')"
          - when: "otherwise (the whole amount returned or more replaced)"
            value: "K('full_share')"
        baseline:
          cover_share: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: return_reason_share
        effect: parameter
        decides: reason_share
        bindings: [relief_return_code, reason_share]
        ladder:
          - when: "return code R01 or R09"
            value: "K('nsf_reason_share')"
          - when: "return code R02, R03 or R04"
            value: "K('closed_reason_share')"
          - when: "otherwise (any other code)"
            value: "K('full_share')"
        baseline:
          reason_share: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: relief_late_history
        effect: parameter
        decides: relief_late_share
        bindings: [relief_late_fees_12m, relief_late_share]
        ladder:
          - when: "exactly one late-fee entry on the line in the last 12 months"
            value: "K('late_share_one')"
          - when: "two or more late-fee entries on the line in the last 12 months"
            value: "K('late_share_repeat')"
          - when: "otherwise (none in the last 12 months)"
            value: "K('full_share')"
        baseline:
          relief_late_share: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: bank_event_relief_basis
        effect: method
        decides: relief_basis_way
        bindings: [loan_fee_same_day_id, loan_fee_waived_amount, loan_fee_waiver_count, relief_basis_way]
        ladder:
          - when: "a personal-loan returned-payment fee booked on the line's return date already carries a personal-loan fee waiver"
            method: "the line's fee less the amount waived on that loan fee, never below 0.00"
          - when: "a personal-loan returned-payment fee booked on the line's return date carries no waiver"
            method: "the smaller of the line's fee and the tier's flat returned-payment fee"
          - when: "otherwise (no personal-loan returned-payment fee booked on that date)"
            method: "the line's fee"
        baseline:
          relief_basis_way: "0"
        evidence: [cross_category, history]
        cross_difficulty: loan
    baseline:
      rule: >-
        The replacement relief is the returned-payment fee booked against the line's most recent returned payment (the latest return by return date; of two returns on the same date, the one recorded first), waived in full; with no returned-payment fee booked against that return, or no payment recorded against it as its replacement, there is no relief.
      params: []
    inputs:
      history:
        - {table: line_transactions, aggregate: latest, field: amount, filters: {event_type: line_returned_payment_fee_assessed}}
        - {table: line_transactions, aggregate: sum, field: amount, filters: {event_type: line_payment_posted}}
        - {table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_late_fee_assessed}}
        - {category: loan, table: loan_transactions, aggregate: sum, field: amount, filters: {event_type: loan_fee_waived}}
      cross_category: [loan]
