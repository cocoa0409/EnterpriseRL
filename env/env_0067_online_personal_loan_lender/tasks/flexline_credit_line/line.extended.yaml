          - when: "a credit limit above protected_limit_ceiling_usd"
            method: "the cut applies to the first graduated_first_usd and twice the cut to the part above it"
          - when: "otherwise (a limit of protected_limit_ceiling_usd or less on a line open fewer than relief_mid_months months)"
