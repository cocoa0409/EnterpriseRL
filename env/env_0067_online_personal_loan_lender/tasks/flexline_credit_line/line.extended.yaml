      tenure_young_months: 24
      tenure_mid_months: 36
      tenure_share_young: 0.75
      tenure_share_mid: 0.90
      retained_usd: 5.00
      full_share: 1.00
    rule: >-
      A courtesy waiver of a late or returned-payment fee is granted on request when fewer than the tier's courtesy waivers per 12 months have been granted on the line; workout relief on a past-due line closed to new draws and replacement relief on the fee of a replaced returned payment are courtesy waivers Larkspur grants without a request, each under its own paragraph, still only while fewer than the tier's courtesy waivers per 12 months have been granted on the line.
      Every rounding to the cent in this paragraph takes an exact half cent to the even cent.
      A courtesy waiver the borrower asks for must be requested no later than the fee waiver request window after the fee's assessment date; workout relief granted when a past-due line is closed to new draws, and only that relief, is not bound by that window.
      When the borrower closes a line to new draws while an amount is past due, Larkspur grants workout relief on one late fee of the line, booked as one courtesy fee-waiver entry against that late fee on the day it is granted and taken off the outstanding balance; the relief is never more than the fee it is booked against, and a relief that computes to 0.00 is still booked, as a 0.00 entry against that fee.
      For the workout relief, whole calendar months are counted from a start date to an end date, a month counting only once the end date's day of the month reaches the start date's day of the month, and a window of the last N months takes the entries dated after the same day of the month N months before the relief date.
      Workout relief is fixed only after every due date whose minimum payment is still unpaid past the grace period carries its late-fee entry.
      The workout relief is the largest late fee on the line (of equal amounts, the most recently booked), waived in full.
      The depth share follows the days the line is past due on the relief date: depth_deep_days days or more give depth_share_deep; depth_mid_days to depth_deep_days minus one days give depth_share_mid; fewer days give full_share.
      The prior-relief share follows the courtesy fee-waiver entries already on the line: one or more in the last 12 months give prior_share_recent; none in the last 12 months but one or more in the last 24 months give prior_share_older; none in the last 24 months gives full_share.
      The tenure share follows the age of the line from its open date: fewer than tenure_young_months months give tenure_share_young; tenure_young_months months or more but fewer than tenure_mid_months give tenure_share_mid; tenure_mid_months months or more give full_share.
      The way the relief is figured follows the late fees booked on the line in the last 12 months and the amount past due: when two or more late fees were booked in the last 12 months, the relief is the fee less retained_usd, which the borrower keeps paying, never below 0.00; when exactly one late fee was booked in the last 12 months and the amount past due is below the fee, the relief is the amount past due; otherwise the relief is the whole fee.
      The workout relief is assembled in this order: first the relief is figured from the fee in the way that applies; then it is multiplied by every share above; and it is rounded to the cent.
