# ---- data flow (every write is an event) ----
events:
  - type: hardship_plan_requested
    target: hardship_plans
    mutation: create
    meaning: A borrower asks for help under one assistance program for one personal loan.
    grain: One row per request.
    fields:
      customer_id: Borrower.
      loan_id: Loan the request concerns.
      variant_name: Program requested.
      hardship_reason: Hardship reported.
      request_date: Date of the request.
      qualifying_event_date: FEMA declaration date (Disaster Relief) or end of military service if already ended (Servicemember); empty otherwise.
      disaster_declaration_number: FEMA declaration number, for Disaster Relief Deferral.
      military_service_start_date: Service start date from the orders, for Servicemember Rate Cap Benefit.
    triggers: []
  - type: hardship_plan_offered
    target: hardship_plans
    mutation: {transition: {from: requested, to: offered}}
    meaning: The program terms are set and presented to the borrower.
    grain: One row per transaction.
    fields:
      decision_date: Date the terms were offered.
      pre_plan_payment_amount: Loan installment before the plan.
      pre_plan_interest_rate: Loan rate before the plan.
      balance_at_request: Unpaid principal (charged-off balance for a settlement).
      remaining_months_at_request: Loan due dates left through maturity.
      start_date: First affected due date.
      end_date: Last affected due date.
      plan_months: Number of plan months.
      plan_payment_amount: Plan installment.
      plan_interest_rate: Plan rate, if the program sets one.
      deferred_installment_count: Installments to be deferred.
      term_extension_months: Months to be added on completion.
      settlement_amount: Total settlement amount.
    triggers: []
  - type: hardship_plan_declined
    target: hardship_plans
    mutation: {transition: {from: requested, to: declined}}
    meaning: The request is declined.
    grain: One row per transaction.
    fields:
      decision_date: Date declined.
      decline_reason: Why.
      closed_date: Same as decision_date.
    triggers: []
  - type: hardship_benefit_applied
    target: hardship_plans
    mutation: {transition: {from: requested, to: active}}
    meaning: A Disaster Relief Deferral or Servicemember Rate Cap Benefit is applied without an acceptance step.
    grain: One row per transaction.
    fields:
      decision_date: Date applied.
      pre_plan_payment_amount: Loan installment before the benefit.
      pre_plan_interest_rate: Loan rate before the benefit.
      balance_at_request: Unpaid principal.
      remaining_months_at_request: Loan due dates left through maturity.
      plan_payment_amount: Installment under the benefit (Servicemember); 0.00 for Disaster Relief.
      acceptance_date: Same as decision_date.
      start_date: First affected due date (Disaster Relief) or the service start date (Servicemember).
      end_date: Last affected due date; empty for Servicemember until the service end date is known.
      plan_months: Plan months; 0 for Servicemember until the service end date is known.
      plan_interest_rate: Rate cap, for Servicemember.
      deferred_installment_count: Installments deferred, for Disaster Relief.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
      - event: hardship:hardship_installment_deferred
        when: {deferred_installment_count: {not: 0}}
        map: {}
  - type: hardship_plan_accepted
    target: hardship_plans
    mutation: {transition: {from: offered, to: active}}
    meaning: The borrower accepts and e-signs the offered terms.
    grain: One row per transaction.
    fields:
      acceptance_date: Date accepted.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
  - type: hardship_offer_expired
    target: hardship_plans
    mutation: {transition: {from: offered, to: expired}}
    meaning: Offered terms lapse unaccepted.
    grain: One row per transaction.
    fields:
      closed_date: Date expired.
    triggers: []
  - type: hardship_plan_completed
    target: hardship_plans
    mutation: {transition: {from: active, to: completed}}
    meaning: The plan runs its course.
    grain: One row per transaction.
    fields:
      closed_date: Date completed.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
  - type: hardship_plan_broken
    target: hardship_plans
    mutation: {transition: {from: active, to: broken}}
    meaning: The plan ends because a plan installment was missed.
    grain: One row per transaction.
    fields:
      closed_date: Date broken.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
  - type: hardship_plan_cancelled
    target: hardship_plans
    mutation: {transition: [{from: offered, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The borrower turns down an offer or leaves an active plan early.
    grain: One row per transaction.
    fields:
      closed_date: Date cancelled.
    triggers:
      - event: loan:loan_terms_modified
        map: {}
  - type: hardship_plan_end_date_set
    target: hardship_plans
    mutation: update
    meaning: The end of an open-ended benefit is recorded once known (the service end date for a Servicemember Rate Cap Benefit).
    grain: One row per transaction.
    fields:
      end_date: Last date the benefit applies.
      plan_months: Number of loan due dates covered.
    triggers: []
  - type: hardship_document_received
    target: hardship_plan_events
    meaning: A supporting document for the request or plan is received.
    grain: One row per document type per day received.
    distinguish_by: [document_type, event_date]
    fields:
      event_date: Date received.
      document_type: Kind of document.
      loan_id: Loan concerned.
    triggers: []
  - type: hardship_installment_deferred
    target: hardship_plan_events
    meaning: One loan installment is moved to the end of the term.
    grain: One row per loan due date deferred.
    distinguish_by: [installment_due_date]
    fields:
      event_date: Date recorded.
      installment_due_date: Loan due date deferred.
      amount: Scheduled installment amount deferred.
      loan_id: Loan concerned.
    triggers:
      - event: loan:loan_payment_schedule_updated
        map: {}
  - type: hardship_plan_installment_scheduled
    target: hardship_plan_events
    meaning: One plan installment falls due under an active plan.
    grain: One row per plan due date.
    distinguish_by: [installment_due_date]
    fields:
      event_date: Date recorded.
      installment_due_date: Plan due date (a loan due date).
      amount: Plan installment due.
      loan_id: Loan concerned.
    account: plan_amount_due
    direction: in
    triggers: []
  - type: hardship_plan_payment_credited
    target: hardship_plan_events
    meaning: A loan payment is credited toward a plan installment.
    grain: One row per loan payment per plan due date.
    distinguish_by: [loan_txn_id, installment_due_date]
    fields:
      event_date: Payment effective date.
      installment_due_date: Plan due date credited.
      amount: Amount credited.
      loan_txn_id: Loan payment credited.
      loan_id: Loan concerned.
    account: plan_amount_due
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: hardship_msr_deferred_installments_lifetime
    window: Life of the loan, all hardship plans on it.
    measure: Count of hardship_installment_deferred rows whose loan_id is the loan.
  - id: hardship_msr_relief_months_24m
    window: The 24 calendar months ending on the requested plan's first affected due date.
    measure: Number of loan due dates in the window that fall between start_date and end_date (inclusive) of plans on the loan whose program counts toward the relief limit and that became active (acceptance_date not empty), whatever their later status.
  - id: hardship_msr_program_uses
    window: Life of the loan.
    measure: Count of plans on the loan of the same program that became active (acceptance_date not empty).
  - id: hardship_msr_unpaid_plan_installments
    window: Plan due dates of the plan whose plan payment grace period has ended on or before today.
    measure: Count of those plan due dates where the hardship_plan_payment_credited amounts for the due date (net of credited payments later returned) total less than the hardship_plan_installment_scheduled amount.

# ---- policies ----
policies:
  - id: hardship_agg_multi_holding
    subject: [hardship_plan_requested]
    rule: >-
      Hardship assistance is arranged per loan. A borrower may have open plans (requested, offered or active) on at most
      max_per_customer loans at the same time, which is every personal loan the borrower can hold. No other hardship plan on the same loan is in requested, offered or active status.
      A borrower who wants a different program on the same loan first cancels the open request or plan; requests are
      never stacked on one loan.
    eligibility:
      - id: one_open_plan_per_loan
        applies_to: [hardship_plan_requested]
        kind: authorization
        condition: No other hardship plan on the same loan is in requested, offered or active status.
        evidence_fields: [hardship_plans.loan_id, hardship_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.loan_id]
          action_bindings:
            hardship_plans.loan_id: loan_id
    params:
      max_per_customer: 2

  - id: hardship_agg_relief_limits
    subject: [hardship_plan_requested, hardship_plan_offered, hardship_installment_deferred]
    rule: >-
      Relief on one loan is limited across all of its plans. Over the life of a loan at most
      max_deferred_installments_per_loan installments may be deferred, counting every program that defers installments;
      a deferral request is offered only for as many installments as remain under that limit. The months of plans whose
      program counts toward the relief limit may cover at most max_relief_months_24m loan due dates in the 24 calendar
      months ending on the new plan's first affected due date, and a counting plan is offered only for the months that
      fit. A program may be used on a loan no more often than its maximum uses per loan, and a new plan of the same
      program may start only once its minimum months between uses have passed since the earlier plan of that program
      ended. After a plan on the loan is broken, a new request (other than Disaster Relief Deferral or Servicemember
      Rate Cap Benefit) is taken only after the broken program's wait has passed. The request fits the program's lifetime uses, its spacing since the previous plan of the same program, and the wait after any broken plan on the loan.
      Disaster Relief Deferral and Servicemember Rate Cap Benefit never count toward the 24-month relief limit, but
      Disaster Relief deferrals do count toward the lifetime deferral limit. When a limit leaves no room, the request is
      declined with relief_limit_reached.
    eligibility:
      - id: program_usage_fits
        applies_to: [hardship_plan_requested]
        kind: authorization
        condition: The request fits the program's lifetime uses, its spacing since the previous plan of the same program, and the wait after any broken plan on the loan.
        evidence_fields: [hardship_plans.loan_id, hardship_plans.variant_name, hardship_plans.status, hardship_plans.acceptance_date, hardship_plans.closed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.loan_id]
          action_bindings:
            hardship_plans.loan_id: loan_id
    params:
      max_deferred_installments_per_loan: 6
      max_relief_months_24m: 12
      per_tier:
        Short-Term Payment Deferral: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Reduced Payment Plan: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Temporary Rate Reduction Plan: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Term Extension Modification: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Disaster Relief Deferral: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Servicemember Rate Cap Benefit: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
        Charged-Off Settlement Plan: {max_uses_per_loan: "=max_uses_per_loan", min_months_between_uses: "=min_months_between_uses", rerequest_wait_after_broken_days: "=rerequest_wait_after_broken_days", counts_toward_relief_limit: "=counts_toward_relief_limit"}
    measures: [hardship_msr_deferred_installments_lifetime, hardship_msr_relief_months_24m, hardship_msr_program_uses]

  - id: hardship_program_eligibility
    subject: [hardship_plan_requested, hardship_plan_declined]
    rule: >-
      Each program has its own entry rules, applied as of the request date. The loan is in one of the program's eligible loan statuses (active for every program except Servicemember Rate Cap Benefit, which also accepts charged_off, and Charged-Off Settlement Plan, which accepts only charged_off).
      For programs with a minimum seasoning, the request is taken only when the current date is at least the program's minimum months after the loan's funding date.
      Months are counted as whole calendar months from the funding date, and when the later month has no matching day the last day of that month is used.
      The loan must also have at least the program's minimum installments paid since funding, no more than the
      program's maximum days past due, at least the program's minimum unpaid principal (charged-off balance for a
      settlement), and - for settlement - at least the minimum days since charge-off. The hardship reason must be one of
      the program's qualifying reasons, and where the program requires a minimum documented income drop the income
      documents must show it. A borrower who does not meet a program's rules may be considered for another program
      whose rules they meet; the agent never offers terms outside a program. A request that fails the rules is
      declined with not_eligible_program, loan_status_ineligible or no_qualifying_hardship as applicable.
    eligibility:
      - id: loan_status_fits
        applies_to: [hardship_plan_requested]
        kind: state
        condition: The loan is in one of the program's eligible loan statuses (active for every program except Servicemember Rate Cap Benefit, which also accepts charged_off, and Charged-Off Settlement Plan, which accepts only charged_off).
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active, charged_off]
      - id: seasoning
        applies_to: [hardship_plan_requested]
        kind: time
        condition: For programs with a minimum seasoning, the request is taken only when the current date is at least the program's minimum months after the loan's funding date.
        evidence_fields: [loans.funding_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the loan's funding date
          anchor_source: loans.funding_date
          relation: not_before
          duration_source: variants.min_months_since_funding
          unit: calendar_months
          counting_rule: Months are counted as whole calendar months from the funding date, and when the later month has no matching day the last day of that month is used.
          boundary: inclusive
    params:
      per_tier:
        Short-Term Payment Deferral: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Reduced Payment Plan: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Temporary Rate Reduction Plan: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Term Extension Modification: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Disaster Relief Deferral: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Servicemember Rate Cap Benefit: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}
        Charged-Off Settlement Plan: {eligible_loan_statuses: "=eligible_loan_statuses", min_installments_paid: "=min_installments_paid", max_days_past_due_at_request: "=max_days_past_due_at_request", min_principal_balance_usd: "=min_principal_balance_usd", min_documented_income_drop_percent: "=min_documented_income_drop_percent", qualifying_reasons: "=qualifying_reasons", min_days_since_charge_off: "=min_days_since_charge_off"}

  - id: hardship_evt_documents_and_decision
    subject: [hardship_document_received, hardship_plan_declined, hardship_plan_offered]
    rule: >-
      A request is decided only on the documents the program requires, as recorded document lines on the plan; a
      borrower's description of a document is never a substitute for the recorded document. Documents may be received while the request is requested or offered, or while the plan is active.
      The decision is made within the program's decision business days once every required document is on file. A request missing required documents is declined for documents_not_received only when the current date is later than the request date plus the program's document due days.
      The document period is counted in calendar days starting the day after the request date, and a document received on the last day of the period is in time.
      A program that requires no documents is decided on the records alone. A request that meets the program and limit
      rules is offered (or applied directly when the program needs no acceptance); otherwise it is declined with the
      first applicable reason in the order loan_status_ineligible, no_qualifying_hardship, not_eligible_program,
      relief_limit_reached, documents_not_received.
    eligibility:
      - id: open_plan_for_documents
        applies_to: [hardship_document_received]
        kind: state
        condition: Documents may be received while the request is requested or offered, or while the plan is active.
        evidence_fields: [hardship_plans.status, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        state_contract:
          field: hardship_plans.status
          allowed: [requested, offered, active]
      - id: document_deadline
        applies_to: [hardship_plan_declined]
        kind: time
        condition: A request missing required documents is declined for documents_not_received only when the current date is later than the request date plus the program's document due days.
        evidence_fields: [hardship_plans.request_date, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the request date
          anchor_source: hardship_plans.request_date
          relation: not_before
          duration_source: variants.document_due_days
          unit: calendar_days
          counting_rule: The document period is counted in calendar days starting the day after the request date, and a document received on the last day of the period is in time.
          boundary: exclusive
    params:
      decline_reason_order: [loan_status_ineligible, no_qualifying_hardship, not_eligible_program, relief_limit_reached, documents_not_received]
      per_tier:
        Short-Term Payment Deferral: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Reduced Payment Plan: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Temporary Rate Reduction Plan: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Term Extension Modification: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Disaster Relief Deferral: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Servicemember Rate Cap Benefit: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}
        Charged-Off Settlement Plan: {required_documents: "=required_documents", document_due_days: "=document_due_days", decision_business_days: "=decision_business_days"}

  - id: hardship_evt_offer_terms
    subject: [hardship_plan_offered, hardship_benefit_applied]
    rule: >-
      Plan terms are computed from the loan as it stands on the decision date, recorded on the plan as the pre-plan
      installment, pre-plan rate, unpaid principal and remaining months. The first affected due date follows the
      program's first plan due date rule. Short-Term Payment Deferral and Disaster Relief Deferral defer the number of
      installments the borrower asks for, from 1 up to the program's per-plan maximum and the lifetime limit, with no
      plan installment. Reduced Payment Plan sets a plan installment of reduced_payment_percent of the pre-plan
      installment, rounded to the cent and not below min_plan_payment_usd, for exactly the program's plan months.
      Temporary Rate Reduction Plan sets the plan rate for its plan months, and the plan installment is the level payment
      that amortizes the unpaid principal at the plan rate over the remaining months (not below min_plan_payment_usd).
      Term Extension Modification sets a modified rate of the pre-plan rate minus rate_reduction_points (not below
      modified_rate_floor_percent) and an extension of max_term_extension_months, shortened so the total term does not
      exceed max_total_term_months; the plan installment for each trial month is the level payment amortizing the unpaid
      principal at the modified rate over the remaining months plus the extension. Servicemember Rate Cap Benefit sets the
      plan rate to the lower of the pre-plan rate and the program's plan rate, and the installment is the level payment at
      that rate over the remaining months; it runs from the military service start date until the end of service is
      recorded. Charged-Off Settlement Plan sets the settlement amount at settlement_lump_sum_percent of the charged-off
      balance for one payment, or settlement_installment_percent for 2 to settlement_max_installments monthly
      installments (each the settlement amount divided by the number of installments, rounded to the cent, with the last
      absorbing the difference); the borrower chooses one. No program charges an enrollment fee.
    eligibility: []
    params:
      plan_fee_usd: "=plan_fee_usd"
      per_tier:
        Short-Term Payment Deferral: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Reduced Payment Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Temporary Rate Reduction Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Term Extension Modification: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Disaster Relief Deferral: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Servicemember Rate Cap Benefit: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
        Charged-Off Settlement Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", reduced_payment_percent: "=reduced_payment_percent", min_plan_payment_usd: "=min_plan_payment_usd", plan_rate_percent: "=plan_rate_percent", rate_reduction_points: "=rate_reduction_points", modified_rate_floor_percent: "=modified_rate_floor_percent", max_term_extension_months: "=max_term_extension_months", max_total_term_months: "=max_total_term_months", min_plan_months: "=min_plan_months", max_plan_months: "=max_plan_months", settlement_lump_sum_percent: "=settlement_lump_sum_percent", settlement_installment_percent: "=settlement_installment_percent", settlement_max_installments: "=settlement_max_installments"}
    formula:
      reduced_plan_payment: max(min_plan_payment_usd, round(pre_plan_payment_amount * reduced_payment_percent / 100, 2))
      plan_rate_monthly: plan_interest_rate / 1200
      level_plan_payment: round(balance_at_request * plan_rate_monthly / (1 - (1 + plan_rate_monthly) ** (0 - remaining_months_at_request)), 2)
      modified_rate: max(modified_rate_floor_percent, pre_plan_interest_rate - rate_reduction_points)
      scra_rate: min(pre_plan_interest_rate, plan_rate_percent)
      settlement_lump_sum: round(balance_at_request * settlement_lump_sum_percent / 100, 2)
      settlement_installment_total: round(balance_at_request * settlement_installment_percent / 100, 2)

  - id: hardship_evt_acceptance
    subject: [hardship_plan_accepted, hardship_offer_expired, hardship_plan_cancelled]
    rule: >-
      Offered terms take effect only when the borrower accepts and e-signs them; a representative cannot accept on the
      borrower's behalf. The borrower can accept the offered terms only when the current date is no later than the decision date plus the program's offer acceptance days.
      The acceptance period is counted in calendar days starting the day after the decision date, and acceptance on the last day is in time.
      An offer not accepted within the period expires. The borrower may turn an offer down at any time before it expires,
      which closes it as cancelled. Accepting a plan does not cancel AutoPay; for a plan with a plan installment the
      AutoPay debit amount becomes the plan installment, and for a deferral no debit is taken on a deferred due date.
    eligibility:
      - id: acceptance_window
        applies_to: [hardship_plan_accepted]
        kind: time
        condition: The borrower can accept the offered terms only when the current date is no later than the decision date plus the program's offer acceptance days.
        evidence_fields: [hardship_plans.decision_date, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the decision date
          anchor_source: hardship_plans.decision_date
          relation: not_after
          duration_source: variants.offer_acceptance_days
          unit: calendar_days
          counting_rule: The acceptance period is counted in calendar days starting the day after the decision date, and acceptance on the last day is in time.
          boundary: inclusive
    params:
      per_tier:
        Short-Term Payment Deferral: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Reduced Payment Plan: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Temporary Rate Reduction Plan: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Term Extension Modification: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Disaster Relief Deferral: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Servicemember Rate Cap Benefit: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}
        Charged-Off Settlement Plan: {requires_borrower_acceptance: "=requires_borrower_acceptance", offer_acceptance_days: "=offer_acceptance_days"}

  - id: hardship_evt_plan_installments
    subject: [hardship_plan_installment_scheduled, hardship_plan_payment_credited, hardship_plan_completed, hardship_plan_broken]
    rule: >-
      For a plan with plan installments, one plan installment line is scheduled on each loan due date from the start
      date through the end date, for the plan installment amount. Plan installments are scheduled and credited only while the plan is active.
      Every loan payment of type hardship_plan_payment is credited toward the oldest plan installment not yet fully
      credited; a payment credited and later returned no longer counts. A plan installment that is not fully credited
      within the program's plan payment grace period after its due date counts as missed, and the program's number of
      missed plan installments breaks the plan: the plan closes as broken, the loan's original rate and installment
      resume from the next due date, unpaid amounts become past due under the loan's normal rules, and fees waived when
      the plan started are not re-charged. A plan completes when its end date has passed with no missed plan
      installment; a Term Extension Modification completes after its trial payments are all made, and only then do the
      modified rate, installment and extended maturity become the loan's permanent terms. A deferral or Disaster Relief
      plan completes the day after its last deferred due date, and a Servicemember benefit completes once the recorded end
      date has passed. A Charged-Off Settlement Plan completes when the settlement amount has been credited in full,
      which settles the loan.
    eligibility:
      - id: active_plan_only
        applies_to: [hardship_plan_installment_scheduled, hardship_plan_payment_credited]
        kind: state
        condition: Plan installments are scheduled and credited only while the plan is active.
        evidence_fields: [hardship_plans.status, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        state_contract:
          field: hardship_plans.status
          allowed: [active]
    params:
      per_tier:
        Short-Term Payment Deferral: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Reduced Payment Plan: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Temporary Rate Reduction Plan: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Term Extension Modification: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Disaster Relief Deferral: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Servicemember Rate Cap Benefit: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
        Charged-Off Settlement Plan: {plan_payment_grace_days: "=plan_payment_grace_days", missed_plan_installments_to_break: "=missed_plan_installments_to_break", trial_payments_required: "=trial_payments_required"}
    formula:
      plan_installment_missed: amount < plan_payment_amount
    measures: [hardship_msr_unpaid_plan_installments]

  - id: hardship_evt_deferral
    subject: [hardship_installment_deferred]
    rule: >-
      Each deferred installment is recorded against the loan due date it replaces, starting at the plan's start date and
      continuing on consecutive due dates. An installment is deferred only once and only while the plan is active.
      A deferred installment is not owed on its due date, is not reported as missed and carries no late fee; it is added
      one month after the maturity date, so each deferral moves next_due_date and maturity_date one month later.
      Interest keeps accruing on unpaid principal during a deferral, so the first payment after the deferral pays the
      interest accrued over the deferred months first, under the loan's normal allocation. A due date that is already
      past due on the decision date can be deferred only under Disaster Relief Deferral.
    eligibility:
      - id: deferral_active_plan
        applies_to: [hardship_installment_deferred]
        kind: state
        condition: An installment is deferred only once and only while the plan is active.
        evidence_fields: [hardship_plans.status, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        state_contract:
          field: hardship_plans.status
          allowed: [active]
      - id: defer_once
        applies_to: [hardship_installment_deferred]
        kind: dedup
        condition: An installment is deferred only once and only while the plan is active.
        evidence_fields: [hardship_plan_events.loan_id, hardship_plan_events.installment_due_date, hardship_plan_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plan_events.loan_id, hardship_plan_events.installment_due_date]
          action_bindings:
            hardship_plan_events.loan_id: loan_id
            hardship_plan_events.installment_due_date: installment_due_date
        dedup_contract:
          table: hardship_plan_events
          mode: separate_record
          object_bindings: {loan_id: loan_id, installment_due_date: installment_due_date}
          duplicate_filters: {event_type: [hardship_installment_deferred]}
          distinct_fields: []
    params:
      per_tier:
        Short-Term Payment Deferral: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Reduced Payment Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Temporary Rate Reduction Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Term Extension Modification: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Disaster Relief Deferral: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Servicemember Rate Cap Benefit: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
        Charged-Off Settlement Plan: {max_deferred_installments_per_plan: "=max_deferred_installments_per_plan", deferred_installment_placement: "=deferred_installment_placement", interest_during_plan: "=interest_during_plan"}
    measures: [hardship_msr_deferred_installments_lifetime]

  - id: hardship_scra_benefit
    subject: [hardship_benefit_applied, hardship_plan_end_date_set]
    rule: >-
      The Servicemember Rate Cap Benefit carries out the Servicemembers Civil Relief Act for a borrower who entered
      military service after the loan was funded. Military orders are on file as a recorded military_orders document before the benefit is applied.
      The loan was funded before the military service start date shown on the orders.
      The request is made while the borrower is serving or no later than the program's request window after the end of military service.
      The window is counted in calendar days starting the day after the end of military service, and a request on the last day is in time.
      The benefit applies from the military service start date, even when the request comes later: from that date the
      rate is capped at the program's plan rate, counting interest, fees and charges together, interest above the cap is
      forgiven and never billed later, interest already paid above the cap since the service start date is credited to
      principal, and late and returned-payment fees assessed since the service start date are waived. The installment is
      lowered to the level payment at the capped rate. The benefit lasts until the end of military service, recorded on
      the plan as its end date once the borrower provides it; the borrower does not have to accept terms, and no credit
      reporting or collection consequence may follow from asking for it. A loan whose rate is already at or below the cap
      still gets the fee protection.
    eligibility:
      - id: orders_on_file
        applies_to: [hardship_benefit_applied]
        kind: authorization
        condition: Military orders are on file as a recorded military_orders document before the benefit is applied.
        evidence_fields: [hardship_plan_events.document_type, hardship_plan_events.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plan_events.hardship_plan_id]
          action_bindings:
            hardship_plan_events.hardship_plan_id: hardship_plan_id
      - id: pre_service_loan
        applies_to: [hardship_benefit_applied]
        kind: authorization
        condition: The loan was funded before the military service start date shown on the orders.
        evidence_fields: [loans.funding_date, loans.loan_id, hardship_plans.military_service_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
      - id: service_request_window
        applies_to: [hardship_benefit_applied]
        kind: time
        condition: The request is made while the borrower is serving or no later than the program's request window after the end of military service.
        evidence_fields: [hardship_plans.qualifying_event_date, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the end of military service
          anchor_source: hardship_plans.qualifying_event_date
          relation: not_after
          duration_source: variants.qualifying_event_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the end of military service, and a request on the last day is in time.
          boundary: inclusive
    params:
      per_tier:
        Short-Term Payment Deferral: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Reduced Payment Plan: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Temporary Rate Reduction Plan: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Term Extension Modification: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Disaster Relief Deferral: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Servicemember Rate Cap Benefit: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}
        Charged-Off Settlement Plan: {plan_rate_percent: "=plan_rate_percent", scra_fee_cap_included: "=scra_fee_cap_included", pre_service_obligation_required: "=pre_service_obligation_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days", benefit_effective_basis: "=benefit_effective_basis"}

  - id: hardship_disaster_relief
    subject: [hardship_plan_requested, hardship_benefit_applied]
    rule: >-
      Disaster Relief Deferral is for a borrower whose residence on the profile lies in a county covered by a FEMA major
      disaster declaration with Individual Assistance. The request records the declaration number exactly as published and
      the declaration date as the qualifying event date. A Disaster Relief Deferral request is taken only when the current date is no later than the declaration date plus the program's request window.
      The window is counted in calendar days starting the day after the declaration date, and a request on the last day is in time.
      A FEMA registration document must be on file before the deferral is applied; the borrower's word that they live in
      the affected area is not enough. The deferral is applied without an acceptance step for up to the program's
      maximum deferred installments, counted from the loan's next due date on the decision date even if that due date is
      already past due, and late and returned-payment fees assessed on or after the declaration's incident start are
      waived as disaster_relief. A second disaster declaration is a separate qualifying event.
    eligibility:
      - id: disaster_window
        applies_to: [hardship_plan_requested]
        kind: time
        condition: A Disaster Relief Deferral request is taken only when the current date is no later than the declaration date plus the program's request window.
        evidence_fields: [hardship_plans.qualifying_event_date, hardship_plans.hardship_plan_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [hardship_plans.hardship_plan_id]
          action_bindings:
            hardship_plans.hardship_plan_id: hardship_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the declaration date
          anchor_source: hardship_plans.qualifying_event_date
          relation: not_after
          duration_source: variants.qualifying_event_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the declaration date, and a request on the last day is in time.
          boundary: inclusive
      - id: fema_registration_on_file
        applies_to: [hardship_benefit_applied]
        kind: authorization
        condition: A FEMA registration document must be on file before the deferral is applied; the borrower's word that they live in the affected area is not enough.
        evidence_fields: [hardship_plan_events.document_type, hardship_plan_events.hardship_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_plan_events.hardship_plan_id]
          action_bindings:
            hardship_plan_events.hardship_plan_id: hardship_plan_id
    params:
      per_tier:
        Short-Term Payment Deferral: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Reduced Payment Plan: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Temporary Rate Reduction Plan: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Term Extension Modification: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Disaster Relief Deferral: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Servicemember Rate Cap Benefit: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}
        Charged-Off Settlement Plan: {disaster_declaration_type_required: "=disaster_declaration_type_required", qualifying_event_request_window_days: "=qualifying_event_request_window_days"}

  - id: hardship_settlement
    subject: [hardship_plan_offered, hardship_plan_completed, hardship_plan_broken]
    rule: >-
      A Charged-Off Settlement Plan resolves a charged-off loan for less than the full balance. A settlement is offered only when the current date is at least the program's minimum days after the loan's charge-off date.
      The days are counted in calendar days starting the day after the charge-off date.
      The borrower chooses a single payment at the lump-sum percent or monthly installments at the installment percent;
      settlement payments post to the loan as payments of type settlement_payment. When the settlement amount has been
      paid in full the plan completes and the loan becomes settled; the forgiven remainder is reported on Form 1099-C
      when it reaches the program's threshold. If a settlement installment is missed past the plan grace period the plan
      breaks, amounts paid stay credited to the balance, and the full remaining charged-off balance is owed again.
    eligibility:
      - id: days_since_charge_off
        applies_to: [hardship_plan_offered]
        kind: time
        condition: A settlement is offered only when the current date is at least the program's minimum days after the loan's charge-off date.
        evidence_fields: [loans.charged_off_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the loan's charge-off date
          anchor_source: loans.charged_off_date
          relation: not_before
          duration_source: variants.min_days_since_charge_off
          unit: calendar_days
          counting_rule: The days are counted in calendar days starting the day after the charge-off date.
          boundary: inclusive
    params:
      per_tier:
        Short-Term Payment Deferral: {min_days_since_charge_off: "=min_days_since_charge_off", forgiven_balance_tax_form_threshold_usd: "=forgiven_balance_tax_form_threshold_usd"}
        Reduced Payment Plan: {min_days_since_charge_off: "=min_days_since_charge_off", forgiven_balance_tax_form_threshold_usd: "=forgiven_balance_tax_form_threshold_usd"}
        Temporary Rate Reduction Plan: {min_days_since_charge_off: "=min_days_since_charge_off", forgiven_balance_tax_form_threshold_usd: "=forgiven_balance_tax_form_threshold_usd"}
        Term Extension Modification: {min_days_since_charge_off: "=min_days_since_charge_off", forgiven_balance_tax_form_threshold_usd: "=forgiven_balance_tax_form_threshold_usd"}
        Disaster Relief Deferral: {min_days_since_charge_off: "=min_days_since_charge_off", forgiven_balance_tax_form_threshold_usd: "=forgiven_balance_tax_form_threshold_usd"}
        Servicemember Rate Cap Benefit: {min_days_since_charge_off: "=min_days_since_charge_off", forgiven_balance_tax_form_threshold_usd: "=forgiven_balance_tax_form_threshold_usd"}
        Charged-Off Settlement Plan: {min_days_since_charge_off: "=min_days_since_charge_off", forgiven_balance_tax_form_threshold_usd: "=forgiven_balance_tax_form_threshold_usd"}

  - id: hardship_evt_fee_relief_and_exit
    subject: [hardship_plan_accepted, hardship_benefit_applied, hardship_plan_cancelled]
    rule: >-
      When a plan becomes active, late and returned-payment fees on the loan assessed within the program's fee waiver
      lookback before the request date and still unpaid are waived as hardship_relief (Servicemember and Disaster Relief
      fees follow their own rules), collection contact stops where the program says so, and the loan is reported to the
      credit bureaus as the program's credit reporting treatment states. While the plan is active, late fees are
      suspended on installments falling due under it where the program suspends them. A borrower may leave an active plan
      at any time; the plan closes as cancelled, the loan's original rate and installment resume from the next due date,
      deferred installments already moved stay moved, and fees already waived stay waived. Leaving a Term Extension
      Modification before its trial ends means the modification never takes effect.
    eligibility: []
    params:
      per_tier:
        Short-Term Payment Deferral: {fee_waiver_lookback_days: "=fee_waiver_lookback_days", late_fees_suspended: "=late_fees_suspended", collections_contact_paused: "=collections_contact_paused", credit_reporting_treatment: "=credit_reporting_treatment", autopay_discount_during_plan: "=autopay_discount_during_plan"}
        Reduced Payment Plan: {fee_waiver_lookback_days: "=fee_waiver_lookback_days", late_fees_suspended: "=late_fees_suspended", collections_contact_paused: "=collections_contact_paused", credit_reporting_treatment: "=credit_reporting_treatment", autopay_discount_during_plan: "=autopay_discount_during_plan"}
        Temporary Rate Reduction Plan: {fee_waiver_lookback_days: "=fee_waiver_lookback_days", late_fees_suspended: "=late_fees_suspended", collections_contact_paused: "=collections_contact_paused", credit_reporting_treatment: "=credit_reporting_treatment", autopay_discount_during_plan: "=autopay_discount_during_plan"}
        Term Extension Modification: {fee_waiver_lookback_days: "=fee_waiver_lookback_days", late_fees_suspended: "=late_fees_suspended", collections_contact_paused: "=collections_contact_paused", credit_reporting_treatment: "=credit_reporting_treatment", autopay_discount_during_plan: "=autopay_discount_during_plan"}
        Disaster Relief Deferral: {fee_waiver_lookback_days: "=fee_waiver_lookback_days", late_fees_suspended: "=late_fees_suspended", collections_contact_paused: "=collections_contact_paused", credit_reporting_treatment: "=credit_reporting_treatment", autopay_discount_during_plan: "=autopay_discount_during_plan"}
        Servicemember Rate Cap Benefit: {fee_waiver_lookback_days: "=fee_waiver_lookback_days", late_fees_suspended: "=late_fees_suspended", collections_contact_paused: "=collections_contact_paused", credit_reporting_treatment: "=credit_reporting_treatment", autopay_discount_during_plan: "=autopay_discount_during_plan"}
        Charged-Off Settlement Plan: {fee_waiver_lookback_days: "=fee_waiver_lookback_days", late_fees_suspended: "=late_fees_suspended", collections_contact_paused: "=collections_contact_paused", credit_reporting_treatment: "=credit_reporting_treatment", autopay_discount_during_plan: "=autopay_discount_during_plan"}

# ---- extended policies (hardship_assistance_plans) ----
extended_policies:
  - id: hardship_ext_rpp_offer_payment
    base_policy_refs: [hardship_agg_relief_limits, hardship_evt_documents_and_decision, hardship_evt_offer_terms, hardship_settlement]
    overwrite:
      - base_policy: hardship_evt_offer_terms
        superseded_clause: >-
          Reduced Payment Plan sets a plan installment of reduced_payment_percent of the pre-plan installment, rounded to the cent and not below min_plan_payment_usd, for exactly the program's plan months.
        replaced_by: >-
          For a Reduced Payment Plan request, and only for such a request, the plan installment is set by this rule for exactly the program's plan months; every other program's terms remain under the general offer rule.
    trigger: state_due
    subject: [hardship_plan_offered]
    computes: plan_payment_amount
    target_tool: offer_reduced_payment_plan_00434f76
    params:
      reamortize_min_usd: 500.0
      pct_job_loss_notice: 40
      pct_income_statement: 45
      tenure_points_long: 2
      tenure_points_mid: 1
      grade_points_high: 3
      grade_points_mid: 1
      record_payments_long: 11
      record_payments_mid: 6
      record_points_long: 3
      record_points_mid: 1
      autopay_points_clean: 2
      autopay_points_returned: 1
    rule: >-
      For a Reduced Payment Plan request, and only for such a request, the plan installment is set by this rule for exactly the program's plan months; every other program's terms remain under the general offer rule.
      A Reduced Payment Plan request whose required documents are on file is decided within the program's decision business days, and the decision is owed whether or not the borrower calls.
      The Reduced Payment Plan installment is the scheduled installment of the loan on the decision date multiplied by the program's reduced_payment_percent.
      The Reduced Payment Plan installment is rounded to the cent once, on the final figure, and the rounded figure is then held to no more than the program's max_plan_payment_ratio_percent of the loan's own scheduled installment on the decision date (never of a payment base put in its place), rounded to the cent, and to no less than the program's min_plan_payment_usd.
      Because the installment is never set below the program's min_plan_payment_usd, a Reduced Payment Plan offer never carries an installment of 0.00.
      Payment base for a reduced payment: when the loan shows an amount past due on the decision date, the payment base is the scheduled installment plus that amount past due divided evenly over the program's plan months, so the arrears are carried inside the plan; when the loan shows no amount past due and additional-principal payments, less any of them returned, totaling at least reamortize_min_usd posted to it in the twelve months before the decision date, the payment base is the level installment that repays the unpaid principal at the loan's current interest rate over the due dates left from its next due date through its maturity date (at a zero rate, the unpaid principal divided by those due dates); for any other loan the payment base is the scheduled installment itself, an additional-principal payment counting as inside those twelve months when fewer than twelve whole calendar months separate its date from the decision date, and the due dates left being the whole calendar months from the next due date to the maturity date plus one.
      Documented-hardship percentage for a reduced payment: a request for job_loss with at least one termination notice recorded on it uses pct_job_loss_notice percent; a request for reduced_income with at least one income statement recorded on it uses pct_income_statement percent; any other request uses the program's reduced_payment_percent.
      Tenure points for a reduced payment: a loan funded at least 24 whole calendar months before the request date earns tenure_points_long points; a loan funded at least 12 but fewer than 24 whole calendar months before it earns tenure_points_mid points; a younger loan earns none, months being counted from the funding date with a month completed only when the later date reaches the funding day of the month.
      Grade points for a reduced payment: a loan in Personal Loan Grade E, F or G earns grade_points_high points; a loan in Personal Loan Grade C or D earns grade_points_mid points; a loan in Personal Loan Grade A or B earns none.
      Payment-record points for a reduced payment: a loan on which the scheduled-installment payments posted in the twelve calendar months before the decision date, less the scheduled-installment payments returned in those months, number at least record_payments_long earns record_points_long points; a loan on which they number at least record_payments_mid but fewer than record_payments_long earns record_points_mid point; any other loan earns none, a payment dated exactly twelve months before the decision date falling outside those months, a payment counting as inside those twelve months when fewer than twelve whole calendar months separate its date from the decision date.
      AutoPay points for a reduced payment: a loan with AutoPay enrolled on the decision date and no returned AutoPay debit in the six calendar months before it earns autopay_points_clean points; a loan with AutoPay enrolled and at least one returned AutoPay debit in those six months earns autopay_points_returned points; a loan without AutoPay earns none, a returned debit counting as inside those six months when fewer than six whole calendar months separate its date from the decision date.
      Where another rule of this policy replaces the scheduled installment or the program's reduced_payment_percent, the replacement takes its place; every point that applies is then subtracted from the percentage, and the percentage so reached is applied once to the installment figure.
    baseline:
      rule: >-
        The Reduced Payment Plan installment is the scheduled installment of the loan on the decision date multiplied by the program's reduced_payment_percent.
        The Reduced Payment Plan installment is rounded to the cent once, on the final figure, and the rounded figure is then held to no more than the program's max_plan_payment_ratio_percent of the loan's own scheduled installment on the decision date (never of a payment base put in its place), rounded to the cent, and to no less than the program's min_plan_payment_usd.
      params: [reduced_payment_percent, min_plan_payment_usd, max_plan_payment_ratio_percent]
    prerequisite: []
    cross_category:
      - category: loan
        as: history
        reads: [scheduled_payment_amount, amount_past_due, principal_balance, current_interest_rate, next_due_date, maturity_date, funding_date, variant_name, autopay_enrolled, loan_transactions.amount, loan_transactions.payment_type, loan_transactions.payment_channel]
        note: The payment base, tenure, grade, payment-record and AutoPay ladders read the loan and its payment ledger.
    compute:
      - pre_plan_installment: "CFIELD('loan', 'scheduled_payment_amount', loan_id=F('loan_id'))"
      - loan_past_due: "CFIELD('loan', 'amount_past_due', loan_id=F('loan_id'))"
      - extra_principal_12m: "XSUM('loan', 'loan_transactions', 'amount', within_months=12, date_field='txn_date', event_type='loan_payment_posted', payment_type='additional_principal', loan_id=F('loan_id')) - XSUM('loan', 'loan_transactions', 'amount', within_months=12, date_field='txn_date', event_type='loan_payment_returned', payment_type='additional_principal', loan_id=F('loan_id'))"
      - loan_principal: "CFIELD('loan', 'principal_balance', loan_id=F('loan_id'))"
      - loan_rate_monthly: "CFIELD('loan', 'current_interest_rate', loan_id=F('loan_id')) / 1200"
      - due_dates_left: "MONTHS(CFIELD('loan', 'next_due_date', loan_id=F('loan_id')), CFIELD('loan', 'maturity_date', loan_id=F('loan_id'))) + 1"
      - payment_base: "(pre_plan_installment + loan_past_due / P('max_plan_months')) if loan_past_due > 0 else ((loan_principal * loan_rate_monthly / (1 - (1 + loan_rate_monthly) ** (0 - due_dates_left)) if loan_rate_monthly > 0 else loan_principal / due_dates_left) if extra_principal_12m >= K('reamortize_min_usd') else pre_plan_installment)"
      - termination_notices: "COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='termination_notice')"
      - income_statements: "COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='income_statement')"
      - hardship_percent: "K('pct_job_loss_notice') if (F('hardship_reason') == 'job_loss' and termination_notices >= 1) else (K('pct_income_statement') if (F('hardship_reason') == 'reduced_income' and income_statements >= 1) else P('reduced_payment_percent'))"
      - tenure_months: "MONTHS(CFIELD('loan', 'funding_date', loan_id=F('loan_id')), F('request_date'))"
      - tenure_points: "K('tenure_points_long') if tenure_months >= 24 else (K('tenure_points_mid') if tenure_months >= 12 else 0)"
      - loan_grade: "CFIELD('loan', 'variant_name', loan_id=F('loan_id'))"
      - grade_points: "K('grade_points_high') if (loan_grade == 'Personal Loan Grade E' or loan_grade == 'Personal Loan Grade F' or loan_grade == 'Personal Loan Grade G') else (K('grade_points_mid') if (loan_grade == 'Personal Loan Grade C' or loan_grade == 'Personal Loan Grade D') else 0)"
      - record_payments_12m: "XCOUNT('loan', 'loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_posted', payment_type='scheduled_installment', loan_id=F('loan_id'))"
      - record_returns_12m: "XCOUNT('loan', 'loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned', payment_type='scheduled_installment', loan_id=F('loan_id'))"
      - record_points: "K('record_points_long') if record_payments_12m - record_returns_12m >= K('record_payments_long') else (K('record_points_mid') if record_payments_12m - record_returns_12m >= K('record_payments_mid') else 0)"
      - autopay_on: "CFIELD('loan', 'autopay_enrolled', loan_id=F('loan_id'))"
      - autopay_returns_6m: "XCOUNT('loan', 'loan_transactions', within_months=6, date_field='txn_date', event_type='loan_payment_returned', payment_channel='autopay_ach', loan_id=F('loan_id'))"
      - autopay_points: "K('autopay_points_clean') if (autopay_on == True and autopay_returns_6m == 0) else (K('autopay_points_returned') if (autopay_on == True and autopay_returns_6m >= 1) else 0)"
      - plan_percent: "hardship_percent - tenure_points - grade_points - record_points - autopay_points"
      - result: "MX(P('min_plan_payment_usd'), MN(RND(pre_plan_installment * P('max_plan_payment_ratio_percent') / 100, 2), RND(payment_base * plan_percent / 100, 2)))"
    compute_basis:
      pre_plan_installment: "The Reduced Payment Plan installment is the scheduled installment of the loan on the decision date multiplied by the program's reduced_payment_percent."
      loan_past_due: "when the loan shows an amount past due on the decision date, the payment base is the scheduled installment plus that amount past due divided evenly over the program's plan months, so the arrears are carried inside the plan"
      extra_principal_12m: "when the loan shows no amount past due and additional-principal payments, less any of them returned, totaling at least reamortize_min_usd posted to it in the twelve months before the decision date"
      loan_principal: "the payment base is the level installment that repays the unpaid principal at the loan's current interest rate over the due dates left from its next due date through its maturity date"
      loan_rate_monthly: "the payment base is the level installment that repays the unpaid principal at the loan's current interest rate over the due dates left from its next due date through its maturity date"
      due_dates_left: "over the due dates left from its next due date through its maturity date (at a zero rate, the unpaid principal divided by those due dates)"
      payment_base: "Payment base for a reduced payment: when the loan shows an amount past due on the decision date, the payment base is the scheduled installment plus that amount past due divided evenly over the program's plan months, so the arrears are carried inside the plan; when the loan shows no amount past due and additional-principal payments, less any of them returned, totaling at least reamortize_min_usd posted to it in the twelve months before the decision date, the payment base is the level installment that repays the unpaid principal at the loan's current interest rate over the due dates left from its next due date through its maturity date (at a zero rate, the unpaid principal divided by those due dates); for any other loan the payment base is the scheduled installment itself, an additional-principal payment counting as inside those twelve months when fewer than twelve whole calendar months separate its date from the decision date, and the due dates left being the whole calendar months from the next due date to the maturity date plus one."
      termination_notices: "a request for job_loss with at least one termination notice recorded on it uses pct_job_loss_notice percent"
      income_statements: "a request for reduced_income with at least one income statement recorded on it uses pct_income_statement percent"
      hardship_percent: "Documented-hardship percentage for a reduced payment: a request for job_loss with at least one termination notice recorded on it uses pct_job_loss_notice percent; a request for reduced_income with at least one income statement recorded on it uses pct_income_statement percent; any other request uses the program's reduced_payment_percent."
      tenure_months: "months being counted from the funding date with a month completed only when the later date reaches the funding day of the month"
      tenure_points: "Tenure points for a reduced payment: a loan funded at least 24 whole calendar months before the request date earns tenure_points_long points; a loan funded at least 12 but fewer than 24 whole calendar months before it earns tenure_points_mid points; a younger loan earns none"
      loan_grade: "Grade points for a reduced payment: a loan in Personal Loan Grade E, F or G earns grade_points_high points"
      grade_points: "Grade points for a reduced payment: a loan in Personal Loan Grade E, F or G earns grade_points_high points; a loan in Personal Loan Grade C or D earns grade_points_mid points; a loan in Personal Loan Grade A or B earns none."
      record_payments_12m: "a loan on which the scheduled-installment payments posted in the twelve calendar months before the decision date, less the scheduled-installment payments returned in those months, number at least record_payments_long earns record_points_long points"
      record_returns_12m: "less the scheduled-installment payments returned in those months"
      record_points: "Payment-record points for a reduced payment: a loan on which the scheduled-installment payments posted in the twelve calendar months before the decision date, less the scheduled-installment payments returned in those months, number at least record_payments_long earns record_points_long points; a loan on which they number at least record_payments_mid but fewer than record_payments_long earns record_points_mid point; any other loan earns none, a payment dated exactly twelve months before the decision date falling outside those months, a payment counting as inside those twelve months when fewer than twelve whole calendar months separate its date from the decision date."
      autopay_on: "a loan with AutoPay enrolled on the decision date and no returned AutoPay debit in the six calendar months before it earns autopay_points_clean points"
      autopay_returns_6m: "a returned debit counting as inside those six months when fewer than six whole calendar months separate its date from the decision date"
      autopay_points: "AutoPay points for a reduced payment: a loan with AutoPay enrolled on the decision date and no returned AutoPay debit in the six calendar months before it earns autopay_points_clean points; a loan with AutoPay enrolled and at least one returned AutoPay debit in those six months earns autopay_points_returned points; a loan without AutoPay earns none, a returned debit counting as inside those six months when fewer than six whole calendar months separate its date from the decision date."
      plan_percent: "Where another rule of this policy replaces the scheduled installment or the program's reduced_payment_percent, the replacement takes its place; every point that applies is then subtracted from the percentage, and the percentage so reached is applied once to the installment figure."
      result: "The Reduced Payment Plan installment is rounded to the cent once, on the final figure, and the rounded figure is then held to no more than the program's max_plan_payment_ratio_percent of the loan's own scheduled installment on the decision date (never of a payment base put in its place), rounded to the cent, and to no less than the program's min_plan_payment_usd."
    factors:
      - id: arrears_base
        effect: method
        decides: payment_base
        bindings: [loan_past_due, extra_principal_12m, loan_principal, loan_rate_monthly, due_dates_left, payment_base]
        ladder:
          - when: "the loan shows an amount past due on the decision date"
            method: "scheduled installment plus the amount past due divided evenly over the program's plan months"
          - when: "no amount past due and additional-principal payments of at least reamortize_min_usd in the twelve months before the decision date"
            method: "level installment repaying the unpaid principal at the current rate over the due dates left through maturity"
          - when: "otherwise"
            method: "the scheduled installment itself"
        baseline:
          payment_base: "pre_plan_installment"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: documented_hardship
        effect: parameter
        decides: hardship_percent
        bindings: [termination_notices, income_statements, hardship_percent]
        ladder:
          - when: "job_loss request AND a termination notice recorded on it"
            value: "K('pct_job_loss_notice')"
          - when: "reduced_income request AND an income statement recorded on it"
            value: "K('pct_income_statement')"
          - when: "otherwise"
            value: "P('reduced_payment_percent')"
        baseline:
          hardship_percent: "P('reduced_payment_percent')"
        evidence: [history]
        cross_difficulty: null
      - id: loan_tenure
        effect: parameter
        decides: tenure_points
        bindings: [tenure_months, tenure_points]
        ladder:
          - when: "funded at least 24 whole calendar months before the request date"
            value: "K('tenure_points_long')"
          - when: "funded at least 12 but fewer than 24 whole calendar months before the request date"
            value: "K('tenure_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_points: "0"
        evidence: [date, cross_category]
        cross_difficulty: loan
      - id: rate_grade
        effect: parameter
        decides: grade_points
        bindings: [loan_grade, grade_points]
        ladder:
          - when: "Personal Loan Grade E, F or G"
            value: "K('grade_points_high')"
          - when: "Personal Loan Grade C or D"
            value: "K('grade_points_mid')"
          - when: "otherwise (Grade A or B)"
            value: "0"
        baseline:
          grade_points: "0"
        evidence: [cross_category]
        cross_difficulty: loan
      - id: prehardship_record
        effect: parameter
        decides: record_points
        bindings: [record_payments_12m, record_returns_12m, record_points]
        ladder:
          - when: "scheduled-installment payments posted in the twelve months before the decision date, less those returned, number at least record_payments_long"
            value: "K('record_points_long')"
          - when: "that net number is at least record_payments_mid but fewer than record_payments_long"
            value: "K('record_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          record_points: "0"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: autopay_record
        effect: parameter
        decides: autopay_points
        bindings: [autopay_on, autopay_returns_6m, autopay_points]
        ladder:
          - when: "AutoPay enrolled AND no returned AutoPay debit in the six months before the decision date"
            value: "K('autopay_points_clean')"
          - when: "AutoPay enrolled AND at least one returned AutoPay debit in those six months"
            value: "K('autopay_points_returned')"
          - when: "otherwise"
            value: "0"
        baseline:
          autopay_points: "0"
        evidence: [cross_category, history]
        cross_difficulty: loan
    inputs:
      history:
        - {table: hardship_plan_events, aggregate: count, field: hardship_event_id, within_months: null, filters: {event_type: hardship_document_received}}
        - {category: loan, table: loan_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: loan_payment_posted, payment_type: additional_principal}}
        - {category: loan, table: loan_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: loan_payment_returned, payment_type: additional_principal}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 6, filters: {event_type: loan_payment_returned, payment_channel: autopay_ach}}
      cross_category: [loan]
  - id: hardship_ext_settlement_installment_term
    base_policy_refs: [hardship_scra_benefit, hardship_evt_offer_terms]
    overwrite:
      - base_policy: hardship_evt_offer_terms
        superseded_clause: >-
          for 2 to settlement_max_installments monthly installments
        replaced_by: >-
          For a Charged-Off Settlement Plan request, and only for such a request, the number of monthly installments the borrower may choose runs from 2 up to the settlement term worked out below instead of up to the program's settlement_max_installments; every other program keeps its own plan months.
    trigger: on_request
    subject: [hardship_plan_end_date_set]
    computes: plan_months
    target_tool: record_settlement_installments_ebffb995
    params:
      balance_per_installment_usd: 750.0
      proportional_term_max_basis: 6000.0
      aged_months: 18
      sale_review_months: 24
      cut_return_unrecovered: 2
      cut_return_recovered: 1
      cut_other_loan_30_days: 2
      cut_other_loan_recent: 1
      extend_severe_hardship: 2
      extend_income_hardship: 1
      min_settlement_installments: 2
    rule: >-
      For a Charged-Off Settlement Plan request, and only for such a request, the number of monthly installments the borrower may choose runs from 2 up to the settlement term worked out below instead of up to the program's settlement_max_installments; every other program keeps its own plan months.
      A borrower settling a charged-off loan records on the pending request, as its plan months, the number of monthly installments chosen: 1 for a single payment, or any number from 2 up to the settlement term, a borrower who asks for the longest term available recording the settlement term itself.
      The settlement term is the program's settlement_max_installments.
      Starting term for a settlement: the charged-off balance is the loan's unpaid principal plus its unpaid fees on the day the term is recorded; a charged-off balance under proportional_term_max_basis allows one installment for each full balance_per_installment_usd of that balance, any remainder below a full step being dropped; a charged-off balance of proportional_term_max_basis or more on a loan charged off at least aged_months whole calendar months earlier allows sale_review_months installments less the whole calendar months elapsed since the charge-off date, so that the term runs out near the account's sale review, a month counting as complete only when the later date reaches the charge-off day of the month and a loan with no charge-off date recorded counting no months since charge-off; any other charged-off balance allows the program's settlement_max_installments.
      Returned-payment cut for a settlement: a loan with a payment returned in the six calendar months before the term is recorded and no payment posted after the latest return loses cut_return_unrecovered installments; a loan with a payment returned in those six months and a payment posted after the latest return loses cut_return_recovered installment; any other loan loses none; a payment posted on the same day as the latest return does not count as posted after it, and a ledger row counts as inside those six months when fewer than six whole calendar months separate its date from the day the term is recorded, a row dated exactly six months before it falling outside them.
      Other-loan cut for a settlement: a borrower whose other active Larkspur personal loan has an amount past due and a next due date at least 30 calendar days before the day the term is recorded loses cut_other_loan_30_days installments; a borrower whose other active loan has an amount past due and a next due date fewer than 30 calendar days earlier loses cut_other_loan_recent installment; a borrower with no other active loan past due loses none, the borrower's other active loan being a single loan, because Larkspur lets a borrower hold at most two open personal loans at a time and takes no new loan application while any of the borrower's loans is charged off.
      Hardship extension for a settlement: a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it adds extend_severe_hardship installments; a request for job_loss or divorce_or_separation with a termination notice or a divorce decree recorded on it adds extend_income_hardship installment; any other request adds none.
      Where another rule of this policy replaces the program's settlement_max_installments, the replacement takes its place; every reduction that applies is then subtracted from it and every addition that applies added to it, in that order, and the result is held between min_settlement_installments and the program's settlement_max_installments. The bounds are the program's own min_settlement_installments and settlement_max_installments, never a starting term put in their place.
      Because the settlement term is held at or above min_settlement_installments, it never works out to 0 installments, and the borrower's recorded choice is never 0.
    baseline:
      rule: >-
        The settlement term is the program's settlement_max_installments.
      params: [settlement_max_installments]
    prerequisite: []
    cross_category:
      - category: loan
        as: history
        reads: [principal_balance, fees_balance, charged_off_date, status, amount_past_due, next_due_date, loan_transactions.txn_date]
        note: The starting-term ladder reads the charged-off loan; the returned-payment and other-loan cuts read the loan ledger and the borrower's other active loan.
    compute:
      - co_principal: "CFIELD('loan', 'principal_balance', loan_id=F('loan_id'))"
      - co_fees: "CFIELD('loan', 'fees_balance', loan_id=F('loan_id'))"
      - charged_off_balance: "co_principal + co_fees"
      - months_since_charge_off: "MONTHS(CFIELD('loan', 'charged_off_date', loan_id=F('loan_id')), NOW) if CFIELD('loan', 'charged_off_date', loan_id=F('loan_id')) else 0"
      - starting_term: "int(charged_off_balance / K('balance_per_installment_usd')) if charged_off_balance < K('proportional_term_max_basis') else ((K('sale_review_months') - months_since_charge_off) if months_since_charge_off >= K('aged_months') else P('settlement_max_installments'))"
      - returns_6m: "XCOUNT('loan', 'loan_transactions', within_months=6, date_field='txn_date', event_type='loan_payment_returned', loan_id=F('loan_id'))"
      - latest_return_date: "XLATEST('loan', 'loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_payment_returned', loan_id=F('loan_id'))"
      - latest_payment_date: "XLATEST('loan', 'loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_payment_posted', loan_id=F('loan_id'))"
      - return_cut: "K('cut_return_unrecovered') if (returns_6m >= 1 and latest_payment_date <= latest_return_date) else (K('cut_return_recovered') if (returns_6m >= 1 and latest_payment_date > latest_return_date) else 0)"
      - other_loan_due: "CFIELD('loan', 'next_due_date', status='active')"
      - other_loan_past_due: "CFIELD('loan', 'amount_past_due', status='active')"
      - other_loan_cut: "K('cut_other_loan_30_days') if (other_loan_past_due != None and other_loan_past_due > 0 and DAYS(other_loan_due, NOW) >= 30) else (K('cut_other_loan_recent') if (other_loan_past_due != None and other_loan_past_due > 0 and DAYS(other_loan_due, NOW) < 30) else 0)"
      - severe_documents: "COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='medical_bill') + COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='death_certificate')"
      - income_documents: "COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='termination_notice') + COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='divorce_decree')"
      - hardship_extension: "K('extend_severe_hardship') if ((F('hardship_reason') == 'medical_hardship' or F('hardship_reason') == 'death_of_household_earner') and severe_documents >= 1) else (K('extend_income_hardship') if ((F('hardship_reason') == 'job_loss' or F('hardship_reason') == 'divorce_or_separation') and income_documents >= 1) else 0)"
      - result: "MN(P('settlement_max_installments'), MX(K('min_settlement_installments'), starting_term - return_cut - other_loan_cut + hardship_extension))"
    compute_basis:
      co_principal: "the charged-off balance is the loan's unpaid principal plus its unpaid fees on the day the term is recorded"
      co_fees: "the charged-off balance is the loan's unpaid principal plus its unpaid fees on the day the term is recorded"
      charged_off_balance: "the charged-off balance is the loan's unpaid principal plus its unpaid fees on the day the term is recorded"
      months_since_charge_off: "a month counting as complete only when the later date reaches the charge-off day of the month and a loan with no charge-off date recorded counting no months since charge-off"
      starting_term: "a charged-off balance under proportional_term_max_basis allows one installment for each full balance_per_installment_usd of that balance, any remainder below a full step being dropped; a charged-off balance of proportional_term_max_basis or more on a loan charged off at least aged_months whole calendar months earlier allows sale_review_months installments less the whole calendar months elapsed since the charge-off date, so that the term runs out near the account's sale review, a month counting as complete only when the later date reaches the charge-off day of the month and a loan with no charge-off date recorded counting no months since charge-off; any other charged-off balance allows the program's settlement_max_installments."
      returns_6m: "a ledger row counts as inside those six months when fewer than six whole calendar months separate its date from the day the term is recorded, a row dated exactly six months before it falling outside them."
      latest_return_date: "no payment posted after the latest return"
      latest_payment_date: "a payment posted after the latest return loses cut_return_recovered installment"
      return_cut: "Returned-payment cut for a settlement: a loan with a payment returned in the six calendar months before the term is recorded and no payment posted after the latest return loses cut_return_unrecovered installments; a loan with a payment returned in those six months and a payment posted after the latest return loses cut_return_recovered installment; any other loan loses none; a payment posted on the same day as the latest return does not count as posted after it, and a ledger row counts as inside those six months when fewer than six whole calendar months separate its date from the day the term is recorded, a row dated exactly six months before it falling outside them."
      other_loan_due: "a borrower whose other active Larkspur personal loan has an amount past due and a next due date at least 30 calendar days before the day the term is recorded loses cut_other_loan_30_days installments"
      other_loan_past_due: "a borrower whose other active Larkspur personal loan has an amount past due"
      other_loan_cut: "Other-loan cut for a settlement: a borrower whose other active Larkspur personal loan has an amount past due and a next due date at least 30 calendar days before the day the term is recorded loses cut_other_loan_30_days installments; a borrower whose other active loan has an amount past due and a next due date fewer than 30 calendar days earlier loses cut_other_loan_recent installment; a borrower with no other active loan past due loses none, the borrower's other active loan being a single loan, because Larkspur lets a borrower hold at most two open personal loans at a time and takes no new loan application while any of the borrower's loans is charged off."
      severe_documents: "a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it adds extend_severe_hardship installments"
      income_documents: "a request for job_loss or divorce_or_separation with a termination notice or a divorce decree recorded on it adds extend_income_hardship installment"
      hardship_extension: "Hardship extension for a settlement: a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it adds extend_severe_hardship installments; a request for job_loss or divorce_or_separation with a termination notice or a divorce decree recorded on it adds extend_income_hardship installment; any other request adds none."
      result: "Where another rule of this policy replaces the program's settlement_max_installments, the replacement takes its place; every reduction that applies is then subtracted from it and every addition that applies added to it, in that order, and the result is held between min_settlement_installments and the program's settlement_max_installments. The bounds are the program's own min_settlement_installments and settlement_max_installments, never a starting term put in their place."
    factors:
      - id: balance_term
        effect: method
        decides: starting_term
        bindings: [co_principal, co_fees, charged_off_balance, months_since_charge_off, starting_term]
        ladder:
          - when: "charged-off balance under proportional_term_max_basis"
            method: "one installment per full balance_per_installment_usd of the charged-off balance, remainder dropped"
          - when: "charged-off balance of proportional_term_max_basis or more AND charged off at least aged_months whole calendar months earlier"
            method: "sale_review_months less the whole calendar months elapsed since the charge-off date (a countdown to the sale review)"
          - when: "otherwise"
            method: "the program's settlement_max_installments"
        baseline:
          starting_term: "P('settlement_max_installments')"
        evidence: [cross_category, date]
        cross_difficulty: loan
      - id: bounced_payment_cut
        effect: parameter
        decides: return_cut
        bindings: [returns_6m, latest_return_date, latest_payment_date, return_cut]
        ladder:
          - when: "a payment returned in the last six calendar months AND no payment posted after the latest return"
            value: "K('cut_return_unrecovered')"
          - when: "a payment returned in the last six calendar months AND a payment posted after the latest return"
            value: "K('cut_return_recovered')"
          - when: "otherwise"
            value: "0"
        baseline:
          return_cut: "0"
        evidence: [history, cross_category]
        cross_difficulty: loan
      - id: active_loan_arrears
        effect: parameter
        decides: other_loan_cut
        bindings: [other_loan_due, other_loan_past_due, other_loan_cut]
        ladder:
          - when: "other active loan past due AND its next due date at least 30 calendar days back"
            value: "K('cut_other_loan_30_days')"
          - when: "other active loan past due AND its next due date fewer than 30 calendar days back"
            value: "K('cut_other_loan_recent')"
          - when: "otherwise"
            value: "0"
        baseline:
          other_loan_cut: "0"
        evidence: [cross_category, date]
        cross_difficulty: loan
      - id: hardship_kind_extension
        effect: parameter
        decides: hardship_extension
        bindings: [severe_documents, income_documents, hardship_extension]
        ladder:
          - when: "medical_hardship or death_of_household_earner request AND a medical bill or death certificate recorded on it"
            value: "K('extend_severe_hardship')"
          - when: "job_loss or divorce_or_separation request AND a termination notice or divorce decree recorded on it"
            value: "K('extend_income_hardship')"
          - when: "otherwise"
            value: "0"
        baseline:
          hardship_extension: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: hardship_plan_events, aggregate: count, field: hardship_event_id, within_months: null, filters: {event_type: hardship_document_received}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 6, filters: {event_type: loan_payment_returned}}
        - {category: loan, table: loan_transactions, aggregate: latest, field: txn_date, within_months: null, filters: {event_type: loan_payment_posted}}
      cross_category: [loan]
  - id: hardship_ext_settlement_offer_amount
    base_policy_refs: [hardship_agg_relief_limits, hardship_evt_documents_and_decision, hardship_evt_offer_terms, hardship_settlement]
    overwrite:
      - base_policy: hardship_evt_offer_terms
        superseded_clause: >-
          Charged-Off Settlement Plan sets the settlement amount at settlement_lump_sum_percent of the charged-off balance for one payment, or settlement_installment_percent
        replaced_by: >-
          For a Charged-Off Settlement Plan request, and only for such a request, the settlement amount is the charged-off balance multiplied by the settlement percentage worked out below; every other program keeps its own terms.
      - base_policy: hardship_settlement
        superseded_clause: >-
          The borrower chooses a single payment at the lump-sum percent or monthly installments at the installment percent;
        replaced_by: >-
          The borrower's choice between a single payment and monthly installments is the one recorded on the request, and the settlement is priced on that recorded number of installments through the settlement percentage below rather than at a flat lump-sum or installment percent.
    trigger: on_request
    subject: [hardship_plan_offered]
    computes: settlement_amount
    target_tool: offer_charged_off_settlement_3f4a16ef
    params:
      per_installment_pct: 3
      linear_pricing_min_basis: 2000.0
      flat_pricing_max_basis: 1000.0
      age_points_aged: 15
      age_points_mid: 10
      goodfaith_points_clean: 6
      goodfaith_points_partial: 3
      relationship_points_current: 5
      relationship_points_recent: 2
      hardship_points_severe: 10
      hardship_points_income: 5
      history_points_long: 5
      history_points_mid: 2
      settlement_floor_pct: 30
    rule: >-
      For a Charged-Off Settlement Plan request, and only for such a request, the settlement amount is the charged-off balance multiplied by the settlement percentage worked out below; every other program keeps its own terms.
      The settlement amount is worked out only after the request records, as its plan months, the number of monthly installments the borrower has chosen.
      The settlement amount is not fixed until no Reduced Payment Plan request on the borrower's other Larkspur loan still stands in requested status.
      Where that Reduced Payment Plan request cannot be offered under its program's rules, the settlement request is handed to the hardship desk together with it instead of being priced in that contact.
      The borrower's choice between a single payment and monthly installments is the one recorded on the request, and the settlement is priced on that recorded number of installments through the settlement percentage below rather than at a flat lump-sum or installment percent.
      The charged-off balance is the loan's unpaid principal plus its unpaid fees on the decision date.
      The settlement percentage is the program's settlement_lump_sum_percent for a single payment and the program's settlement_installment_percent for two or more monthly installments.
      The settlement amount is the charged-off balance multiplied by the settlement percentage, rounded to the cent once on the final figure, and the settlement installment is that amount divided by the recorded number of installments, rounded to the cent, with the last installment absorbing the difference.
      Term pricing for a settlement: on a charged-off balance of linear_pricing_min_basis or more paid in two or more installments but fewer than the program's settlement_max_installments, the term price is the program's settlement_lump_sum_percent plus per_installment_pct points for every installment after the first; on a charged-off balance under flat_pricing_max_basis paid in two or more installments the term price is the program's settlement_lump_sum_percent however many installments are chosen; in every other case the term price is the program's settlement_lump_sum_percent for a single payment and the program's settlement_installment_percent for two or more installments.
      Charge-off age points for a settlement: a loan charged off at least 365 calendar days before the decision date earns age_points_aged points; a loan charged off at least 180 but fewer than 365 calendar days before it earns age_points_mid points; a more recent charge-off earns none, the days being counted from the day after the charge-off date through the decision date and a loan with no charge-off date recorded counting no days since charge-off.
      Good-faith points for a settlement: a loan with at least two payments posted in the six calendar months before the decision date and no payment return recorded in those six months earns goodfaith_points_clean points; a loan whose payments posted in those six months outnumber the payment returns recorded in them, with at least one return recorded in them, earns goodfaith_points_partial points; any other loan earns none, a payment or return dated exactly six months before the decision date falling outside those months.
      Relationship points for a settlement: a borrower whose other active Larkspur personal loan has no amount past due earns relationship_points_current points; a borrower whose other active loan has an amount past due and a next due date fewer than 30 calendar days before the decision date earns relationship_points_recent points; a borrower with no other active loan, or one 30 or more days past due, earns none, the borrower's other active loan being a single loan, because Larkspur lets a borrower hold at most two open personal loans at a time and takes no new loan application while any of the borrower's loans is charged off.
      Documented-hardship points for a settlement: a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it earns hardship_points_severe points; a request for job_loss or divorce_or_separation with a termination notice or a divorce decree recorded on it earns hardship_points_income points; any other request earns none.
      Payment-history points for a settlement: a loan on which the scheduled-installment payments ever posted, less the scheduled-installment payments returned, number at least 24 earns history_points_long points; a loan on which they number at least 12 but fewer than 24 earns history_points_mid points; a loan with fewer earns none.
      Where another rule of this policy replaces the settlement percentage, the replacement is taken first; every point that applies is then subtracted from it, and the percentage so reached, never below settlement_floor_pct percent, is applied once to the charged-off balance.
      Because a settlement request is taken only on a charged-off balance of at least the program's min_principal_balance_usd and the percentage is never below settlement_floor_pct percent, the settlement amount and its installments never work out to 0.00.
    baseline:
      rule: >-
        The charged-off balance is the loan's unpaid principal plus its unpaid fees on the decision date.
        The settlement percentage is the program's settlement_lump_sum_percent for a single payment and the program's settlement_installment_percent for two or more monthly installments.
        The settlement amount is the charged-off balance multiplied by the settlement percentage, rounded to the cent once on the final figure, and the settlement installment is that amount divided by the recorded number of installments, rounded to the cent, with the last installment absorbing the difference.
      params: [settlement_lump_sum_percent, settlement_installment_percent]
    prerequisite:
      - problem: hardship_ext_settlement_installment_term
        kind: value_input
        gate: chosen_installments
        form: state
        policy_source: >-
          The settlement amount is worked out only after the request records, as its plan months, the number of monthly installments the borrower has chosen.
        condition: >-
          The Charged-Off Settlement Plan request carries a plan_months value of 1 or more recorded by the borrower.
        resolved_by: record_settlement_installments_ebffb995
        effect: >-
          chosen_installments takes the recorded number of installments instead of falling back to a single payment, which moves the term price and so the settlement amount.
      - problem: hardship_ext_rpp_offer_payment
        kind: state_gate
        gate: hardship_plans.status
        form: state
        policy_source: >-
          The settlement amount is not fixed until no Reduced Payment Plan request on the borrower's other Larkspur loan still stands in requested status.
        condition: >-
          No hardship plan of the borrower on another loan with variant Reduced Payment Plan is in requested status.
        resolved_by: offer_reduced_payment_plan_00434f76
        effect: >-
          The other loan's Reduced Payment Plan request moves from requested to offered, so the settlement may be priced and offered.
    cross_category:
      - category: loan
        as: history
        reads: [principal_balance, fees_balance, charged_off_date, status, amount_past_due, next_due_date, loan_transactions.event_type, loan_transactions.payment_type]
        note: The charged-off balance, the age, good-faith, relationship and payment-history ladders read the borrower's personal loans and the charged-off loan's ledger.
    compute:
      - chosen_installments: "F('plan_months') or 1"
      - co_principal: "CFIELD('loan', 'principal_balance', loan_id=F('loan_id'))"
      - co_fees: "CFIELD('loan', 'fees_balance', loan_id=F('loan_id'))"
      - charged_off_balance: "co_principal + co_fees"
      - standard_percent: "P('settlement_lump_sum_percent') if chosen_installments <= 1 else P('settlement_installment_percent')"
      - pricing_balance: "CFIELD('loan', 'principal_balance', loan_id=F('loan_id')) + CFIELD('loan', 'fees_balance', loan_id=F('loan_id'))"
      - term_price: "(P('settlement_lump_sum_percent') + K('per_installment_pct') * (chosen_installments - 1)) if (pricing_balance >= K('linear_pricing_min_basis') and chosen_installments >= 2 and chosen_installments < P('settlement_max_installments')) else (P('settlement_lump_sum_percent') if (pricing_balance < K('flat_pricing_max_basis') and chosen_installments >= 2) else standard_percent)"
      - charge_off_days: "DAYS(CFIELD('loan', 'charged_off_date', loan_id=F('loan_id')), NOW) if CFIELD('loan', 'charged_off_date', loan_id=F('loan_id')) else 0"
      - age_points: "K('age_points_aged') if charge_off_days >= 365 else (K('age_points_mid') if charge_off_days >= 180 else 0)"
      - recent_payments: "XCOUNT('loan', 'loan_transactions', within_months=6, date_field='txn_date', event_type='loan_payment_posted', loan_id=F('loan_id'))"
      - recent_returns: "XCOUNT('loan', 'loan_transactions', within_months=6, date_field='txn_date', event_type='loan_payment_returned', loan_id=F('loan_id'))"
      - goodfaith_points: "K('goodfaith_points_clean') if (recent_payments >= 2 and recent_returns == 0) else (K('goodfaith_points_partial') if (recent_payments - recent_returns >= 1 and recent_returns >= 1) else 0)"
      - other_active_due: "CFIELD('loan', 'next_due_date', status='active')"
      - other_active_past_due: "CFIELD('loan', 'amount_past_due', status='active')"
      - relationship_points: "K('relationship_points_current') if (other_active_past_due != None and other_active_past_due == 0) else (K('relationship_points_recent') if (other_active_past_due != None and other_active_past_due > 0 and DAYS(other_active_due, NOW) < 30) else 0)"
      - severe_documents: "COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='medical_bill') + COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='death_certificate')"
      - income_documents: "COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='termination_notice') + COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='divorce_decree')"
      - hardship_points: "K('hardship_points_severe') if ((F('hardship_reason') == 'medical_hardship' or F('hardship_reason') == 'death_of_household_earner') and severe_documents >= 1) else (K('hardship_points_income') if ((F('hardship_reason') == 'job_loss' or F('hardship_reason') == 'divorce_or_separation') and income_documents >= 1) else 0)"
      - paid_installments: "XCOUNT('loan', 'loan_transactions', event_type='loan_payment_posted', payment_type='scheduled_installment', loan_id=F('loan_id')) - XCOUNT('loan', 'loan_transactions', event_type='loan_payment_returned', payment_type='scheduled_installment', loan_id=F('loan_id'))"
      - history_points: "K('history_points_long') if paid_installments >= 24 else (K('history_points_mid') if paid_installments >= 12 else 0)"
      - settlement_percent: "MX(K('settlement_floor_pct'), term_price - age_points - goodfaith_points - relationship_points - hardship_points - history_points)"
      - result: "RND(charged_off_balance * settlement_percent / 100, 2)"
    compute_basis:
      chosen_installments: "The borrower's choice between a single payment and monthly installments is the one recorded on the request, and the settlement is priced on that recorded number of installments through the settlement percentage below rather than at a flat lump-sum or installment percent."
      co_principal: "The charged-off balance is the loan's unpaid principal plus its unpaid fees on the decision date."
      co_fees: "The charged-off balance is the loan's unpaid principal plus its unpaid fees on the decision date."
      charged_off_balance: "The charged-off balance is the loan's unpaid principal plus its unpaid fees on the decision date."
      standard_percent: "The settlement percentage is the program's settlement_lump_sum_percent for a single payment and the program's settlement_installment_percent for two or more monthly installments."
      term_price: "Term pricing for a settlement: on a charged-off balance of linear_pricing_min_basis or more paid in two or more installments but fewer than the program's settlement_max_installments, the term price is the program's settlement_lump_sum_percent plus per_installment_pct points for every installment after the first; on a charged-off balance under flat_pricing_max_basis paid in two or more installments the term price is the program's settlement_lump_sum_percent however many installments are chosen; in every other case the term price is the program's settlement_lump_sum_percent for a single payment and the program's settlement_installment_percent for two or more installments."
      pricing_balance: "Term pricing for a settlement: on a charged-off balance of linear_pricing_min_basis or more paid in two or more installments but fewer than the program's settlement_max_installments"
      charge_off_days: "the days being counted from the day after the charge-off date through the decision date and a loan with no charge-off date recorded counting no days since charge-off."
      age_points: "Charge-off age points for a settlement: a loan charged off at least 365 calendar days before the decision date earns age_points_aged points; a loan charged off at least 180 but fewer than 365 calendar days before it earns age_points_mid points; a more recent charge-off earns none"
      recent_payments: "a loan with at least two payments posted in the six calendar months before the decision date and no payment return recorded in those six months earns goodfaith_points_clean points"
      recent_returns: "a loan whose payments posted in those six months outnumber the payment returns recorded in them, with at least one return recorded in them, earns goodfaith_points_partial points"
      goodfaith_points: "Good-faith points for a settlement: a loan with at least two payments posted in the six calendar months before the decision date and no payment return recorded in those six months earns goodfaith_points_clean points; a loan whose payments posted in those six months outnumber the payment returns recorded in them, with at least one return recorded in them, earns goodfaith_points_partial points; any other loan earns none, a payment or return dated exactly six months before the decision date falling outside those months."
      other_active_due: "a borrower whose other active loan has an amount past due and a next due date fewer than 30 calendar days before the decision date earns relationship_points_recent points"
      other_active_past_due: "a borrower whose other active Larkspur personal loan has no amount past due earns relationship_points_current points"
      relationship_points: "Relationship points for a settlement: a borrower whose other active Larkspur personal loan has no amount past due earns relationship_points_current points; a borrower whose other active loan has an amount past due and a next due date fewer than 30 calendar days before the decision date earns relationship_points_recent points; a borrower with no other active loan, or one 30 or more days past due, earns none, the borrower's other active loan being a single loan, because Larkspur lets a borrower hold at most two open personal loans at a time and takes no new loan application while any of the borrower's loans is charged off."
      severe_documents: "a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it earns hardship_points_severe points"
      income_documents: "a request for job_loss or divorce_or_separation with a termination notice or a divorce decree recorded on it earns hardship_points_income points"
      hardship_points: "Documented-hardship points for a settlement: a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it earns hardship_points_severe points; a request for job_loss or divorce_or_separation with a termination notice or a divorce decree recorded on it earns hardship_points_income points; any other request earns none."
      paid_installments: "a loan on which the scheduled-installment payments ever posted, less the scheduled-installment payments returned, number at least 24 earns history_points_long points"
      history_points: "Payment-history points for a settlement: a loan on which the scheduled-installment payments ever posted, less the scheduled-installment payments returned, number at least 24 earns history_points_long points; a loan on which they number at least 12 but fewer than 24 earns history_points_mid points; a loan with fewer earns none."
      settlement_percent: "Where another rule of this policy replaces the settlement percentage, the replacement is taken first; every point that applies is then subtracted from it, and the percentage so reached, never below settlement_floor_pct percent, is applied once to the charged-off balance."
      result: "The settlement amount is the charged-off balance multiplied by the settlement percentage, rounded to the cent once on the final figure"
    factors:
      - id: term_pricing
        effect: method
        decides: term_price
        bindings: [pricing_balance, term_price]
        ladder:
          - when: "charged-off balance of linear_pricing_min_basis or more AND two or more installments but fewer than settlement_max_installments"
            method: "settlement_lump_sum_percent plus per_installment_pct points for every installment after the first (a price linear in the term)"
          - when: "charged-off balance under flat_pricing_max_basis AND two or more installments"
            method: "settlement_lump_sum_percent however many installments are chosen (a price independent of the term)"
          - when: "otherwise"
            method: "settlement_lump_sum_percent for one payment, settlement_installment_percent for two or more (a two-step price)"
        baseline:
          term_price: "standard_percent"
        evidence: [cross_category]
        cross_difficulty: loan
      - id: charge_off_age
        effect: parameter
        decides: age_points
        bindings: [charge_off_days, age_points]
        ladder:
          - when: "charged off at least 365 calendar days before the decision date"
            value: "K('age_points_aged')"
          - when: "charged off at least 180 but fewer than 365 calendar days before the decision date"
            value: "K('age_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          age_points: "0"
        evidence: [date, cross_category]
        cross_difficulty: loan
      - id: good_faith_payments
        effect: parameter
        decides: goodfaith_points
        bindings: [recent_payments, recent_returns, goodfaith_points]
        ladder:
          - when: "at least two payments posted in the last six calendar months AND no payment return recorded in them"
            value: "K('goodfaith_points_clean')"
          - when: "payments posted in those six months outnumber the returns recorded in them AND at least one return recorded"
            value: "K('goodfaith_points_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          goodfaith_points: "0"
        evidence: [history, cross_category]
        cross_difficulty: loan
      - id: relationship_standing
        effect: parameter
        decides: relationship_points
        bindings: [other_active_due, other_active_past_due, relationship_points]
        ladder:
          - when: "other active Larkspur personal loan with no amount past due"
            value: "K('relationship_points_current')"
          - when: "other active loan with an amount past due AND its next due date fewer than 30 calendar days back"
            value: "K('relationship_points_recent')"
          - when: "otherwise (no other active loan, or one 30 or more days past due)"
            value: "0"
        baseline:
          relationship_points: "0"
        evidence: [cross_category]
        cross_difficulty: loan
      - id: documented_severity
        effect: parameter
        decides: hardship_points
        bindings: [severe_documents, income_documents, hardship_points]
        ladder:
          - when: "medical_hardship or death_of_household_earner request AND a medical bill or death certificate recorded on it"
            value: "K('hardship_points_severe')"
          - when: "job_loss or divorce_or_separation request AND a termination notice or divorce decree recorded on it"
            value: "K('hardship_points_income')"
          - when: "otherwise"
            value: "0"
        baseline:
          hardship_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: predefault_history
        effect: parameter
        decides: history_points
        bindings: [paid_installments, history_points]
        ladder:
          - when: "scheduled-installment payments ever posted, less those returned, number at least 24"
            value: "K('history_points_long')"
          - when: "that net number is at least 12 but fewer than 24"
            value: "K('history_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          history_points: "0"
        evidence: [history, cross_category]
        cross_difficulty: loan
    inputs:
      history:
        - {table: hardship_plan_events, aggregate: count, field: hardship_event_id, within_months: null, filters: {event_type: hardship_document_received}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 6, filters: {event_type: loan_payment_posted}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 6, filters: {event_type: loan_payment_returned}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: null, filters: {event_type: loan_payment_posted, payment_type: scheduled_installment}}
      cross_category: [loan]
  - id: hardship_ext_scra_service_end_months
    base_policy_refs: [hardship_scra_benefit, hardship_evt_offer_terms]
    overwrite:
      - base_policy: hardship_scra_benefit
        superseded_clause: >-
          The benefit lasts until the end of military service, recorded on the plan as its end date once the borrower provides it;
        replaced_by: >-
          For a Servicemember Rate Cap Benefit, and only for such a benefit, the benefit lasts through the end of military service and then through its graduated-return due dates, and its last graduated-return due date is recorded as its end date when the servicemember certifies the end of service; every other program keeps its own end.
      - base_policy: hardship_evt_offer_terms
        superseded_clause: >-
          it runs from the military service start date until the end of service is recorded.
        replaced_by: >-
          A Servicemember Rate Cap Benefit runs from the military service start date over its covered due dates and then its graduated-return due dates set out in this rule, and only that benefit is governed by this sentence.
    trigger: on_request
    subject: [hardship_plan_end_date_set]
    computes: plan_months
    target_tool: report_military_service_end_1d04825e
    params:
      record_clean_due_dates: 2
      record_restored_due_dates: 1
      step_large_percent: 10
      step_small_percent: 5
      step_percent_per_due_date: 5
      duty_long_days: 365
      duty_mid_days: 180
      duty_long_due_dates: 2
      duty_mid_due_dates: 1
      tenure_long_months: 36
      tenure_mid_months: 24
      tenure_long_due_dates: 2
      tenure_mid_due_dates: 1
    rule: >-
      For a Servicemember Rate Cap Benefit, and only for such a benefit, the benefit lasts through the end of military service and then through its graduated-return due dates, and its last graduated-return due date is recorded as its end date when the servicemember certifies the end of service; every other program keeps its own end.
      A Servicemember Rate Cap Benefit runs from the military service start date over its covered due dates and then its graduated-return due dates set out in this rule, and only that benefit is governed by this sentence.
      The end of military service is the release date captured from the servicemember's release orders as the benefit's qualifying event date; the servicemember certifies it personally, and the certification records the benefit's end date and its plan months, the number of loan due dates the benefit covers.
      The covered due dates are the loan due dates from the military service start date through the latest due date carrying a plan installment line on the benefit, counted as whole calendar months from the start date to that due date plus one, together with every loan due date after that line and on or before the end of military service, counted as whole calendar months from that due date to the end of military service; a month counts as complete only when the later date reaches the earlier date's day of the month, several lines on one due date count that due date once, and a benefit with no plan installment line covers no due date.
      The plan months recorded are the covered due dates.
      Graduated return by plan record: a benefit with at least one plan installment line whose lines are all fully credited once plan payments returned on its loan are taken off, and on whose loan plan payments were posted and none was ever returned, adds record_clean_due_dates graduated-return due dates; a benefit with at least one line, all fully credited once returned plan payments are taken off, on whose loan at least one plan payment was returned and made good adds record_restored_due_dates; any other benefit adds none.
      Graduated return by payment step: the payment step is the pre-plan installment recorded on the benefit less the installment now in force on the benefit's loan, as a percentage of the pre-plan installment; a step of at least step_large_percent percent adds one graduated-return due date for every full step_percent_per_due_date percent of the step, any remainder being dropped; a step of at least step_small_percent but under step_large_percent percent adds one; a smaller step, or a benefit missing its pre-plan installment, adds none.
      Graduated return by length of service: a servicemember whose military service, counted in calendar days from the service start date to the end of military service, lasted at least duty_long_days days adds duty_long_due_dates graduated-return due dates; one whose service lasted at least duty_mid_days but fewer than duty_long_days days adds duty_mid_due_dates; any other servicemember, including one whose benefit carries no captured end of military service, adds none.
      Graduated return by tenure: a loan funded at least tenure_long_months whole calendar months before the end of military service adds tenure_long_due_dates graduated-return due dates; one funded at least tenure_mid_months but fewer than tenure_long_months months before it adds tenure_mid_due_dates; a younger loan, or a benefit with no captured end of military service, adds none, a month counting as complete only when the later date reaches the funding day of the month.
      Every graduated-return due date that applies is added to the covered due dates; the graduated-return due dates follow the last covered due date one month apart, and the last of them is the end date recorded, while a benefit with no graduated-return due date records its last covered due date as its end date.
      A benefit with no plan installment line records no plan months at all, 0, whatever any other rule of this policy would add, and records the end of military service as its end date.
    baseline:
      rule: >-
        The covered due dates are the loan due dates from the military service start date through the latest due date carrying a plan installment line on the benefit, counted as whole calendar months from the start date to that due date plus one, together with every loan due date after that line and on or before the end of military service, counted as whole calendar months from that due date to the end of military service; a month counts as complete only when the later date reaches the earlier date's day of the month, several lines on one due date count that due date once, and a benefit with no plan installment line covers no due date.
        The plan months recorded are the covered due dates.
      params: []
    prerequisite: []
    cross_category:
      - category: loan
        as: history
        reads: [funding_date, scheduled_payment_amount, loan_transactions.amount, loan_transactions.payment_type]
        note: The tenure ladder reads the funding date of the benefit's loan, the payment-step ladder the installment in force on it, and the plan-record ladder its returned plan payments.
    compute:
      - latest_line_due: "LATEST('hardship_plan_events', 'installment_due_date', date_field='installment_due_date', event_type='hardship_plan_installment_scheduled')"
      - covered_due_dates: "0 if latest_line_due == None else MONTHS(F('military_service_start_date'), latest_line_due) + 1 + (MX(0, MONTHS(latest_line_due, F('qualifying_event_date'))) if F('qualifying_event_date') else 0)"
      - lines_due_total: "SUM('hardship_plan_events', 'amount', event_type='hardship_plan_installment_scheduled')"
      - lines_credited_total: "SUM('hardship_plan_events', 'amount', event_type='hardship_plan_payment_credited')"
      - plan_payments_returned: "XSUM('loan', 'loan_transactions', 'amount', event_type='loan_payment_returned', payment_type='hardship_plan_payment', loan_id=F('loan_id'))"
      - plan_returns: "XCOUNT('loan', 'loan_transactions', event_type='loan_payment_returned', payment_type='hardship_plan_payment', loan_id=F('loan_id'))"
      - plan_payments_posted: "XCOUNT('loan', 'loan_transactions', event_type='loan_payment_posted', payment_type='hardship_plan_payment', loan_id=F('loan_id'))"
      - record_due_dates: "K('record_clean_due_dates') if (lines_due_total > 0 and lines_credited_total - plan_payments_returned >= lines_due_total and plan_payments_posted >= 1 and plan_returns == 0) else (K('record_restored_due_dates') if (lines_due_total > 0 and lines_credited_total - plan_payments_returned >= lines_due_total and plan_returns >= 1) else 0)"
      - step_percent: "((F('pre_plan_payment_amount') - CFIELD('loan', 'scheduled_payment_amount', loan_id=F('loan_id'))) * 100 / F('pre_plan_payment_amount')) if (F('pre_plan_payment_amount') or 0) > 0 else 0"
      - step_due_dates: "int(step_percent / K('step_percent_per_due_date')) if step_percent >= K('step_large_percent') else (1 if step_percent >= K('step_small_percent') else 0)"
      - service_days: "DAYS(F('military_service_start_date'), F('qualifying_event_date')) if F('qualifying_event_date') else 0"
      - duty_due_dates: "K('duty_long_due_dates') if service_days >= K('duty_long_days') else (K('duty_mid_due_dates') if service_days >= K('duty_mid_days') else 0)"
      - tenure_months: "MONTHS(CFIELD('loan', 'funding_date', loan_id=F('loan_id')), F('qualifying_event_date')) if F('qualifying_event_date') else 0"
      - tenure_due_dates: "K('tenure_long_due_dates') if tenure_months >= K('tenure_long_months') else (K('tenure_mid_due_dates') if tenure_months >= K('tenure_mid_months') else 0)"
      - service_lines: "COUNT('hardship_plan_events', event_type='hardship_plan_installment_scheduled')"
      - result: "0 if service_lines == 0 else covered_due_dates + record_due_dates + step_due_dates + duty_due_dates + tenure_due_dates"
    compute_basis:
      latest_line_due: "through the latest due date carrying a plan installment line on the benefit"
      covered_due_dates: "The covered due dates are the loan due dates from the military service start date through the latest due date carrying a plan installment line on the benefit, counted as whole calendar months from the start date to that due date plus one, together with every loan due date after that line and on or before the end of military service, counted as whole calendar months from that due date to the end of military service; a month counts as complete only when the later date reaches the earlier date's day of the month, several lines on one due date count that due date once, and a benefit with no plan installment line covers no due date."
      lines_due_total: "a benefit with at least one plan installment line whose lines are all fully credited once plan payments returned on its loan are taken off"
      lines_credited_total: "whose lines are all fully credited once plan payments returned on its loan are taken off"
      plan_payments_returned: "once plan payments returned on its loan are taken off"
      plan_returns: "on whose loan at least one plan payment was returned and made good adds record_restored_due_dates"
      plan_payments_posted: "on whose loan plan payments were posted and none was ever returned"
      record_due_dates: "Graduated return by plan record: a benefit with at least one plan installment line whose lines are all fully credited once plan payments returned on its loan are taken off, and on whose loan plan payments were posted and none was ever returned, adds record_clean_due_dates graduated-return due dates; a benefit with at least one line, all fully credited once returned plan payments are taken off, on whose loan at least one plan payment was returned and made good adds record_restored_due_dates; any other benefit adds none."
      step_percent: "the payment step is the pre-plan installment recorded on the benefit less the installment now in force on the benefit's loan, as a percentage of the pre-plan installment;"
      step_due_dates: "Graduated return by payment step: the payment step is the pre-plan installment recorded on the benefit less the installment now in force on the benefit's loan, as a percentage of the pre-plan installment; a step of at least step_large_percent percent adds one graduated-return due date for every full step_percent_per_due_date percent of the step, any remainder being dropped; a step of at least step_small_percent but under step_large_percent percent adds one; a smaller step, or a benefit missing its pre-plan installment, adds none."
      service_days: "counted in calendar days from the service start date to the end of military service"
      duty_due_dates: "Graduated return by length of service: a servicemember whose military service, counted in calendar days from the service start date to the end of military service, lasted at least duty_long_days days adds duty_long_due_dates graduated-return due dates; one whose service lasted at least duty_mid_days but fewer than duty_long_days days adds duty_mid_due_dates; any other servicemember, including one whose benefit carries no captured end of military service, adds none."
      tenure_months: "a month counting as complete only when the later date reaches the funding day of the month."
      tenure_due_dates: "Graduated return by tenure: a loan funded at least tenure_long_months whole calendar months before the end of military service adds tenure_long_due_dates graduated-return due dates; one funded at least tenure_mid_months but fewer than tenure_long_months months before it adds tenure_mid_due_dates; a younger loan, or a benefit with no captured end of military service, adds none, a month counting as complete only when the later date reaches the funding day of the month."
      service_lines: "A benefit with no plan installment line records no plan months at all, 0, whatever any other rule of this policy would add, and records the end of military service as its end date."
      result: "Every graduated-return due date that applies is added to the covered due dates; the graduated-return due dates follow the last covered due date one month apart, and the last of them is the end date recorded, while a benefit with no graduated-return due date records its last covered due date as its end date."
    factors:
      - id: plan_record_return
        effect: parameter
        decides: record_due_dates
        bindings: [lines_due_total, lines_credited_total, plan_payments_returned, plan_returns, plan_payments_posted, record_due_dates]
        ladder:
          - when: "at least one line AND every line fully credited net of returned plan payments AND plan payments posted on the loan, none ever returned"
            value: "K('record_clean_due_dates')"
          - when: "at least one line AND every line fully credited net of returned plan payments AND at least one plan payment returned on the loan"
            value: "K('record_restored_due_dates')"
          - when: "otherwise"
            value: "0"
        baseline:
          record_due_dates: "0"
        evidence: [history, cross_category]
        cross_difficulty: loan
      - id: payment_step_return
        effect: method
        decides: step_due_dates
        bindings: [step_percent, step_due_dates]
        ladder:
          - when: "payment step of at least step_large_percent percent of the pre-plan installment"
            method: "one due date per full step_percent_per_due_date percent of the step, remainder dropped (proportional to the step)"
          - when: "payment step of at least step_small_percent but under step_large_percent percent"
            method: "a single due date whatever the step (flat)"
          - when: "otherwise"
            method: "no due date"
        baseline:
          step_due_dates: "0"
        evidence: [cross_category]
        cross_difficulty: loan
      - id: service_length_return
        effect: parameter
        decides: duty_due_dates
        bindings: [service_days, duty_due_dates]
        ladder:
          - when: "service of at least duty_long_days calendar days"
            value: "K('duty_long_due_dates')"
          - when: "service of at least duty_mid_days but fewer than duty_long_days days"
            value: "K('duty_mid_due_dates')"
          - when: "otherwise"
            value: "0"
        baseline:
          duty_due_dates: "0"
        evidence: [date]
        cross_difficulty: null
      - id: loan_tenure_return
        effect: parameter
        decides: tenure_due_dates
        bindings: [tenure_months, tenure_due_dates]
        ladder:
          - when: "loan funded at least tenure_long_months whole months before the end of service"
            value: "K('tenure_long_due_dates')"
          - when: "funded at least tenure_mid_months but fewer than tenure_long_months months before it"
            value: "K('tenure_mid_due_dates')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_due_dates: "0"
        evidence: [date, cross_category]
        cross_difficulty: loan
    inputs:
      history:
        - {table: hardship_plan_events, aggregate: latest, field: installment_due_date, within_months: null, filters: {event_type: hardship_plan_installment_scheduled}}
        - {table: hardship_plan_events, aggregate: sum, field: amount, within_months: null, filters: {event_type: hardship_plan_installment_scheduled}}
        - {table: hardship_plan_events, aggregate: sum, field: amount, within_months: null, filters: {event_type: hardship_plan_payment_credited}}
        - {category: loan, table: loan_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: loan_payment_returned, payment_type: hardship_plan_payment}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: null, filters: {event_type: loan_payment_returned, payment_type: hardship_plan_payment}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: null, filters: {event_type: loan_payment_posted, payment_type: hardship_plan_payment}}
      cross_category: [loan]
  - id: hardship_ext_scra_closing_installment
    base_policy_refs: [hardship_evt_plan_installments, hardship_scra_benefit, hardship_evt_offer_terms]
    overwrite:
      - base_policy: hardship_evt_plan_installments
        superseded_clause: >-
          For a plan with plan installments, one plan installment line is scheduled on each loan due date from the start date through the end date, for the plan installment amount.
        replaced_by: >-
          For a Servicemember Rate Cap Benefit with graduated-return due dates, and only for such a benefit, the line on each graduated-return due date is for the graduated-return installment worked out in this rule; every other plan, and every covered due date of that benefit, schedules one plan installment line on each loan due date from its start date through its end date, for the plan installment amount.
      - base_policy: hardship_scra_benefit
        superseded_clause: >-
          The installment is lowered to the level payment at the capped rate.
        replaced_by: >-
          For a Servicemember Rate Cap Benefit, and only for such a benefit, the installment owed on every covered due date is the plan installment recorded on the benefit when it was applied, and on a graduated-return due date it is the graduated-return installment worked out below; this sentence governs no other program.
      - base_policy: hardship_evt_offer_terms
        superseded_clause: >-
          and the installment is the level payment at that rate over the remaining months;
        replaced_by: >-
          For a Servicemember Rate Cap Benefit, and only for such a benefit, the plan installment recorded when the benefit is applied is the level payment at that rate over the remaining months, and it is the installment owed on every covered due date, a graduated-return due date carrying the graduated-return installment worked out in this rule instead; no other program is governed by this sentence.
    trigger: state_due
    subject: [hardship_plan_installment_scheduled]
    computes: amount
    target_tool: schedule_benefit_plan_installment_71e01653
    params:
      share_half: 50
      graduated_many_due_dates: 3
      autopay_points_clean: 4
      autopay_points_returned: 2
      prepay_large_usd: 500.0
      prepay_small_usd: 100.0
      prepay_points_large: 4
      prepay_points_small: 2
      grade_points_high: 4
      grade_points_mid: 2
      term_long_due_dates: 24
      term_mid_due_dates: 12
      term_points_long: 4
      term_points_mid: 2
    rule: >-
      For a Servicemember Rate Cap Benefit with graduated-return due dates, and only for such a benefit, the line on each graduated-return due date is for the graduated-return installment worked out in this rule; every other plan, and every covered due date of that benefit, schedules one plan installment line on each loan due date from its start date through its end date, for the plan installment amount.
      For a Servicemember Rate Cap Benefit, and only for such a benefit, the installment owed on every covered due date is the plan installment recorded on the benefit when it was applied, and on a graduated-return due date it is the graduated-return installment worked out below; this sentence governs no other program.
      For a Servicemember Rate Cap Benefit, and only for such a benefit, the plan installment recorded when the benefit is applied is the level payment at that rate over the remaining months, and it is the installment owed on every covered due date, a graduated-return due date carrying the graduated-return installment worked out in this rule instead; no other program is governed by this sentence.
      A graduated-return installment is worked out only after the benefit records its end date together with its plan months.
      A due date on or before the end of military service captured on the benefit, or any due date of a benefit with no end of military service captured, is a covered due date, and its line is for the plan installment recorded on the benefit, rounded to the cent.
      A graduated-return due date is a loan due date after the benefit's last covered due date and on or before its recorded end date; the line for it is owed as soon as that due date is the loan's next due date, whether or not the borrower calls, and it is scheduled for that due date.
      The line on a graduated-return due date is for the previous line's amount plus the whole step up from it to the pre-plan installment recorded on the benefit, so that the loan's pre-plan installment resumes on that due date; the previous line's amount is the amount of the plan installment lines on the latest due date already carrying one on the benefit, all of them taken together where several share that due date, or the plan installment recorded on the benefit where none exists, held to no more than the larger of the plan installment and the pre-plan installment recorded on the benefit, and the step up is the pre-plan installment less the previous line's amount, never below zero.
      The graduated-return installment is rounded to the cent once, on the final figure.
      A graduated-return installment that works out to 0.00 is still scheduled, for 0.00, so its due date carries its line.
      Step schedule: the graduated-return due dates still to come, counting the one the line is for, are the whole calendar months from the loan's next due date to the recorded end date plus one, none where the recorded end date is empty or falls before that due date; a benefit with at least graduated_many_due_dates of them still to come and at least one plan installment line, every one of its plan installment lines fully credited net of plan payments returned on the loan, charges an equal step, one part in the number still to come plus one, of the step up; a benefit with one or two still to come and the same clean line record charges a flat share_half percent of it; any other benefit, including one with a line not fully credited once returned plan payments are taken off, charges the whole step up.
      AutoPay relief: a loan with AutoPay enrolled, with at least one AutoPay debit posted and none returned in the twelve months before the line is scheduled, takes autopay_points_clean points off the share of the step up charged; a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off it; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none, a debit counting as inside those twelve months when fewer than twelve whole calendar months separate its date from the day the line is scheduled.
      Prepayment relief: a loan to which additional-principal payments, less any of them returned, totaling at least prepay_large_usd posted in the twelve months before the line is scheduled takes prepay_points_large points off the share; one to which such payments, less any returned, totaling at least prepay_small_usd but less than prepay_large_usd posted takes prepay_points_small points off it; any other loan takes none, a payment counting as inside those twelve months when fewer than twelve whole calendar months separate its date from the day the line is scheduled.
      Grade relief: a loan in Personal Loan Grade E, F or G takes grade_points_high points off the share; a loan in Personal Loan Grade C or D takes grade_points_mid points off it; a loan in Personal Loan Grade A or B takes none.
      Remaining-term relief: a loan with at least term_long_due_dates due dates left from its next due date through its maturity date takes term_points_long points off the share; one with at least term_mid_due_dates but fewer than term_long_due_dates due dates left takes term_points_mid points off it; a loan with fewer takes none, the due dates left being the whole calendar months from the next due date to the maturity date plus one.
      Where another rule of this policy replaces the share of the step up charged, the replacement takes its place; every point that applies is then subtracted from that share, never taking it below zero, and the share so reached is applied once to the step up and added to the previous line's amount.
    baseline:
      rule: >-
        The line on a graduated-return due date is for the previous line's amount plus the whole step up from it to the pre-plan installment recorded on the benefit, so that the loan's pre-plan installment resumes on that due date; the previous line's amount is the amount of the plan installment lines on the latest due date already carrying one on the benefit, all of them taken together where several share that due date, or the plan installment recorded on the benefit where none exists, held to no more than the larger of the plan installment and the pre-plan installment recorded on the benefit, and the step up is the pre-plan installment less the previous line's amount, never below zero.
        The graduated-return installment is rounded to the cent once, on the final figure.
      params: []
    prerequisite:
      - problem: hardship_ext_scra_service_end_months
        kind: value_input
        gate: remaining_due_dates
        form: state
        policy_source: >-
          A graduated-return installment is worked out only after the benefit records its end date together with its plan months.
        condition: >-
          The Servicemember Rate Cap Benefit carries a non-empty end_date and a plan_months value recorded with it.
        resolved_by: report_military_service_end_1d04825e
        effect: >-
          remaining_due_dates counts the months from the loan's next due date to the recorded end date instead of finding no end date, which moves the step schedule's share.
    cross_category:
      - category: loan
        as: history
        reads: [autopay_enrolled, variant_name, next_due_date, maturity_date, loan_transactions.amount, loan_transactions.payment_type, loan_transactions.payment_channel]
        note: The step-schedule, AutoPay, prepayment, grade and remaining-term ladders read the benefit's loan and its ledger.
    compute:
      - plan_installment: "F('plan_payment_amount') or 0"
      - prev_due: "LATEST('hardship_plan_events', 'installment_due_date', date_field='installment_due_date', event_type='hardship_plan_installment_scheduled')"
      - prev_line: "SUM('hardship_plan_events', 'amount', event_type='hardship_plan_installment_scheduled', installment_due_date=prev_due) if prev_due != None else None"
      - prev_amount: "plan_installment if prev_line == None else MN(prev_line, MX(plan_installment, F('pre_plan_payment_amount') or 0))"
      - step_up: "MX(0, (F('pre_plan_payment_amount') or 0) - prev_amount)"
      - next_due: "CFIELD('loan', 'next_due_date', loan_id=F('loan_id'))"
      - remaining_due_dates: "(MONTHS(next_due, F('end_date')) + 1) if (F('end_date') and next_due != None and DAYS(next_due, F('end_date')) >= 0) else 0"
      - lines_due_total: "SUM('hardship_plan_events', 'amount', event_type='hardship_plan_installment_scheduled')"
      - lines_credited_total: "SUM('hardship_plan_events', 'amount', event_type='hardship_plan_payment_credited')"
      - plan_payments_returned: "XSUM('loan', 'loan_transactions', 'amount', event_type='loan_payment_returned', payment_type='hardship_plan_payment', loan_id=F('loan_id'))"
      - step_share: "(100 / (remaining_due_dates + 1)) if (remaining_due_dates >= K('graduated_many_due_dates') and lines_due_total > 0 and lines_credited_total - plan_payments_returned >= lines_due_total) else (K('share_half') if (remaining_due_dates >= 1 and remaining_due_dates < K('graduated_many_due_dates') and lines_due_total > 0 and lines_credited_total - plan_payments_returned >= lines_due_total) else 100)"
      - autopay_on: "CFIELD('loan', 'autopay_enrolled', loan_id=F('loan_id'))"
      - autopay_debits_12m: "XCOUNT('loan', 'loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_posted', payment_channel='autopay_ach', loan_id=F('loan_id'))"
      - autopay_returns_12m: "XCOUNT('loan', 'loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned', payment_channel='autopay_ach', loan_id=F('loan_id'))"
      - autopay_points: "K('autopay_points_clean') if (autopay_on == True and autopay_debits_12m >= 1 and autopay_returns_12m == 0) else (K('autopay_points_returned') if (autopay_on == True and autopay_returns_12m >= 1) else 0)"
      - prepaid_12m: "XSUM('loan', 'loan_transactions', 'amount', within_months=12, date_field='txn_date', event_type='loan_payment_posted', payment_type='additional_principal', loan_id=F('loan_id')) - XSUM('loan', 'loan_transactions', 'amount', within_months=12, date_field='txn_date', event_type='loan_payment_returned', payment_type='additional_principal', loan_id=F('loan_id'))"
      - prepay_points: "K('prepay_points_large') if prepaid_12m >= K('prepay_large_usd') else (K('prepay_points_small') if prepaid_12m >= K('prepay_small_usd') else 0)"
      - loan_grade: "CFIELD('loan', 'variant_name', loan_id=F('loan_id'))"
      - grade_points: "K('grade_points_high') if (loan_grade == 'Personal Loan Grade E' or loan_grade == 'Personal Loan Grade F' or loan_grade == 'Personal Loan Grade G') else (K('grade_points_mid') if (loan_grade == 'Personal Loan Grade C' or loan_grade == 'Personal Loan Grade D') else 0)"
      - term_due_dates_left: "MONTHS(CFIELD('loan', 'next_due_date', loan_id=F('loan_id')), CFIELD('loan', 'maturity_date', loan_id=F('loan_id'))) + 1"
      - term_points: "K('term_points_long') if term_due_dates_left >= K('term_long_due_dates') else (K('term_points_mid') if term_due_dates_left >= K('term_mid_due_dates') else 0)"
      - share_applied: "MX(0, step_share - autopay_points - prepay_points - grade_points - term_points)"
      - covered_line: "((1 if DAYS(next_due, F('qualifying_event_date')) >= 0 else 0) if (F('qualifying_event_date') and next_due != None) else 1)"
      - result: "RND(plan_installment, 2) if covered_line == 1 else RND(prev_amount + step_up * share_applied / 100, 2)"
    compute_basis:
      plan_installment: "or the plan installment recorded on the benefit where none exists"
      prev_due: "the latest due date already carrying one on the benefit"
      prev_line: "the amount of the plan installment lines on the latest due date already carrying one on the benefit, all of them taken together where several share that due date"
      prev_amount: "the previous line's amount is the amount of the plan installment lines on the latest due date already carrying one on the benefit, all of them taken together where several share that due date, or the plan installment recorded on the benefit where none exists, held to no more than the larger of the plan installment and the pre-plan installment recorded on the benefit"
      step_up: "the step up is the pre-plan installment less the previous line's amount, never below zero."
      next_due: "the line for it is owed as soon as that due date is the loan's next due date"
      covered_line: "A due date on or before the end of military service captured on the benefit, or any due date of a benefit with no end of military service captured, is a covered due date, and its line is for the plan installment recorded on the benefit, rounded to the cent."
      remaining_due_dates: "the graduated-return due dates still to come, counting the one the line is for, are the whole calendar months from the loan's next due date to the recorded end date plus one, none where the recorded end date is empty or falls before that due date;"
      lines_due_total: "every one of its plan installment lines fully credited net of plan payments returned on the loan"
      lines_credited_total: "every one of its plan installment lines fully credited net of plan payments returned on the loan"
      plan_payments_returned: "including one with a line not fully credited once returned plan payments are taken off, charges the whole step up."
      step_share: "Step schedule: the graduated-return due dates still to come, counting the one the line is for, are the whole calendar months from the loan's next due date to the recorded end date plus one, none where the recorded end date is empty or falls before that due date; a benefit with at least graduated_many_due_dates of them still to come and at least one plan installment line, every one of its plan installment lines fully credited net of plan payments returned on the loan, charges an equal step, one part in the number still to come plus one, of the step up; a benefit with one or two still to come and the same clean line record charges a flat share_half percent of it; any other benefit, including one with a line not fully credited once returned plan payments are taken off, charges the whole step up."
      autopay_on: "a loan with AutoPay enrolled, with at least one AutoPay debit posted and none returned in the twelve months before the line is scheduled, takes autopay_points_clean points off the share of the step up charged; a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off it; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none"
      autopay_debits_12m: "with at least one AutoPay debit posted and none returned in the twelve months before the line is scheduled, takes autopay_points_clean points off the share of the step up charged; a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off it; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none"
      autopay_returns_12m: "a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off it; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none"
      autopay_points: "AutoPay relief: a loan with AutoPay enrolled, with at least one AutoPay debit posted and none returned in the twelve months before the line is scheduled, takes autopay_points_clean points off the share of the step up charged; a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off it; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none, a debit counting as inside those twelve months when fewer than twelve whole calendar months separate its date from the day the line is scheduled."
      prepaid_12m: "a loan to which additional-principal payments, less any of them returned, totaling at least prepay_large_usd posted in the twelve months before the line is scheduled takes prepay_points_large points off the share; one to which such payments, less any returned, totaling at least prepay_small_usd but less than prepay_large_usd posted takes prepay_points_small points off it; any other loan takes none"
      prepay_points: "Prepayment relief: a loan to which additional-principal payments, less any of them returned, totaling at least prepay_large_usd posted in the twelve months before the line is scheduled takes prepay_points_large points off the share; one to which such payments, less any returned, totaling at least prepay_small_usd but less than prepay_large_usd posted takes prepay_points_small points off it; any other loan takes none, a payment counting as inside those twelve months when fewer than twelve whole calendar months separate its date from the day the line is scheduled."
      loan_grade: "a loan in Personal Loan Grade E, F or G takes grade_points_high points off the share; a loan in Personal Loan Grade C or D takes grade_points_mid points off it; a loan in Personal Loan Grade A or B takes none."
      grade_points: "Grade relief: a loan in Personal Loan Grade E, F or G takes grade_points_high points off the share; a loan in Personal Loan Grade C or D takes grade_points_mid points off it; a loan in Personal Loan Grade A or B takes none."
      term_due_dates_left: "the due dates left being the whole calendar months from the next due date to the maturity date plus one."
      term_points: "Remaining-term relief: a loan with at least term_long_due_dates due dates left from its next due date through its maturity date takes term_points_long points off the share; one with at least term_mid_due_dates but fewer than term_long_due_dates due dates left takes term_points_mid points off it; a loan with fewer takes none, the due dates left being the whole calendar months from the next due date to the maturity date plus one."
      share_applied: "Where another rule of this policy replaces the share of the step up charged, the replacement takes its place; every point that applies is then subtracted from that share, never taking it below zero, and the share so reached is applied once to the step up and added to the previous line's amount."
      result: "Where another rule of this policy replaces the share of the step up charged, the replacement takes its place; every point that applies is then subtracted from that share, never taking it below zero, and the share so reached is applied once to the step up and added to the previous line's amount."
    factors:
      - id: step_schedule
        effect: method
        decides: step_share
        bindings:
        - remaining_due_dates
        - lines_due_total
        - lines_credited_total
        - plan_payments_returned
        - step_share
        ladder:
        - when: at least graduated_many_due_dates graduated-return due dates still to come AND every line fully credited net of returned plan payments
          method: 'equal step: 100 divided by (due dates still to come + 1) (falls with the schedule left)'
        - when: one or two graduated-return due dates still to come AND every line fully credited net of returned plan payments
          method: flat share_half percent whatever the schedule left
        - when: otherwise
          method: whole step up (100 percent)
        baseline:
          step_share: '100'
        evidence:
        - date
        - history
        - cross_category
        cross_difficulty: loan
      - id: autopay_relief
        effect: parameter
        decides: autopay_points
        bindings:
        - autopay_on
        - autopay_debits_12m
        - autopay_returns_12m
        - autopay_points
        ladder:
        - when: AutoPay enrolled AND at least one AutoPay debit posted AND none returned in the twelve months
          value: K('autopay_points_clean')
        - when: AutoPay enrolled AND at least one returned AutoPay debit in the twelve months
          value: K('autopay_points_returned')
        - when: otherwise
          value: '0'
        baseline:
          autopay_points: '0'
        evidence:
        - cross_category
        - history
        cross_difficulty: loan
      - id: prepayment_relief
        effect: parameter
        decides: prepay_points
        bindings:
        - prepaid_12m
        - prepay_points
        ladder:
        - when: additional principal of at least prepay_large_usd in the twelve months
          value: K('prepay_points_large')
        - when: at least prepay_small_usd but under prepay_large_usd
          value: K('prepay_points_small')
        - when: otherwise
          value: '0'
        baseline:
          prepay_points: '0'
        evidence:
        - history
        - cross_category
        cross_difficulty: loan
      - id: grade_relief
        effect: parameter
        decides: grade_points
        bindings:
        - loan_grade
        - grade_points
        ladder:
        - when: Personal Loan Grade E, F or G
          value: K('grade_points_high')
        - when: Personal Loan Grade C or D
          value: K('grade_points_mid')
        - when: otherwise
          value: '0'
        baseline:
          grade_points: '0'
        evidence:
        - cross_category
        cross_difficulty: loan
      - id: remaining_term_relief
        effect: parameter
        decides: term_points
        bindings:
        - term_due_dates_left
        - term_points
        ladder:
        - when: at least term_long_due_dates due dates left
          value: K('term_points_long')
        - when: at least term_mid_due_dates but fewer than term_long_due_dates left
          value: K('term_points_mid')
        - when: otherwise
          value: '0'
        baseline:
          term_points: '0'
        evidence:
        - date
        - cross_category
        cross_difficulty: loan
    inputs:
      history:
        - {table: hardship_plan_events, aggregate: latest, field: installment_due_date, within_months: null, filters: {event_type: hardship_plan_installment_scheduled}}
        - {table: hardship_plan_events, aggregate: sum, field: amount, within_months: null, filters: {event_type: hardship_plan_installment_scheduled}}
        - {table: hardship_plan_events, aggregate: sum, field: amount, within_months: null, filters: {event_type: hardship_plan_payment_credited}}
        - {category: loan, table: loan_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: loan_payment_returned, payment_type: hardship_plan_payment}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_posted, payment_channel: autopay_ach}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_returned, payment_channel: autopay_ach}}
        - {category: loan, table: loan_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: loan_payment_posted, payment_type: additional_principal}}
        - {category: loan, table: loan_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: loan_payment_returned, payment_type: additional_principal}}
      cross_category: [loan]
  - id: hardship_ext_trr_offer_payment
    base_policy_refs: [hardship_agg_relief_limits, hardship_evt_documents_and_decision, hardship_evt_offer_terms, hardship_program_eligibility, hardship_settlement]
    overwrite:
      - base_policy: hardship_evt_offer_terms
        superseded_clause: >-
          Temporary Rate Reduction Plan sets the plan rate for its plan months, and the plan installment is the level payment that amortizes the unpaid principal at the plan rate over the remaining months (not below min_plan_payment_usd).
        replaced_by: >-
          For a Temporary Rate Reduction Plan request, and only for such a request, the plan rate and the plan installment for its plan months are set by this rule; every other program's terms remain under the general offer rule.
    trigger: on_request
    subject: [hardship_plan_offered]
    computes: plan_payment_amount
    target_tool: offer_rate_reduction_plan_52a2ad4e
    params:
      rate_severe_documented: 2.99
      rate_income_documented: 3.99
      income_statements_needed: 2
      short_loan_due_dates: 12
      long_loan_due_dates: 36
      tenure_long_months: 24
      tenure_mid_months: 12
      tenure_points_long: 0.50
      tenure_points_mid: 0.25
      autopay_points_clean: 0.25
      autopay_points_returned: 0.10
      grade_points_high: 0.75
      grade_points_mid: 0.50
      plan_rate_floor: 1.99
    rule: >-
      For a Temporary Rate Reduction Plan request, and only for such a request, the plan rate and the plan installment for its plan months are set by this rule; every other program's terms remain under the general offer rule.
      A Temporary Rate Reduction Plan for a borrower whose other Larkspur loan carries an active Servicemember Rate Cap Benefit with the end of military service captured on it and with either no end date recorded on it or an end date recorded on or after that loan's next due date is not offered until that benefit carries a scheduled plan installment line for that loan's next due date.
      The income drop a Temporary Rate Reduction Plan request must show is read from the income statements recorded on it: the gross monthly pay on the earliest statement, from before the hardship, against the gross monthly pay on the latest, the drop being the difference as a percentage of the earlier pay; the borrower reads both figures from the statements when asked.
      The Temporary Rate Reduction Plan installment is the level installment that repays the loan's unpaid principal at the program's plan_rate_percent over the due dates left from the loan's next due date through its maturity date, counted as the whole calendar months from the next due date to the maturity date plus one and counting at least one due date.
      The Temporary Rate Reduction Plan installment is rounded to the cent once, on the final figure, and is never set below the program's min_plan_payment_usd.
      Because the installment is never set below the program's min_plan_payment_usd, it never works out to 0.00.
      The plan rate offered and recorded is the rate the installment is worked at.
      Documented-hardship rate: a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it uses rate_severe_documented percent; a request for reduced_income with at least income_statements_needed income statements recorded on it uses rate_income_documented percent; any other request uses the program's plan_rate_percent.
      Repayment shape: a loan with short_loan_due_dates or fewer due dates left from its next due date through its maturity date pays, on each plan due date, the principal part of its scheduled installment, being that installment less one month's interest on the unpaid principal at the loan's current rate and never below zero, plus one month's interest on the unpaid principal at the plan rate, so that the payment falls by exactly the interest the lower rate saves; a loan with more than long_loan_due_dates due dates left pays one month's interest on the unpaid principal at the plan rate and no principal; any other loan pays the level installment at the plan rate, the due dates left being the whole calendar months from the next due date to the maturity date plus one.
      Tenure points: a loan funded at least tenure_long_months whole calendar months before the request date takes tenure_points_long percentage points off the plan rate; a loan funded at least tenure_mid_months but fewer than tenure_long_months whole calendar months before it takes tenure_points_mid points off; a younger loan takes none, a month counting as complete only when the later date reaches the funding day of the month.
      AutoPay points: a loan with AutoPay enrolled, with at least one AutoPay debit posted and none returned in the twelve months before the offer date, takes autopay_points_clean percentage points off the plan rate; a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none, a debit counting as within them when fewer than twelve whole calendar months separate its date from the offer date.
      Grade points: a loan in Personal Loan Grade E, F or G takes grade_points_high percentage points off the plan rate; a loan in Personal Loan Grade C or D takes grade_points_mid points off; a loan in Personal Loan Grade A or B takes none.
      Where another rule of this policy replaces the program's plan_rate_percent or the level installment, the replacement takes its place; every point that applies is then subtracted from the plan rate, never taking it below plan_rate_floor percent, and the installment is worked once, at the rate so reached.
    baseline:
      rule: >-
        The Temporary Rate Reduction Plan installment is the level installment that repays the loan's unpaid principal at the program's plan_rate_percent over the due dates left from the loan's next due date through its maturity date, counted as the whole calendar months from the next due date to the maturity date plus one and counting at least one due date.
        The Temporary Rate Reduction Plan installment is rounded to the cent once, on the final figure, and is never set below the program's min_plan_payment_usd.
      params: [plan_rate_percent, min_plan_payment_usd]
    prerequisite:
      - problem: hardship_ext_scra_closing_installment
        kind: state_gate
        gate: hardship_plan_events.installment_due_date
        form: state
        policy_source: >-
          A Temporary Rate Reduction Plan for a borrower whose other Larkspur loan carries an active Servicemember Rate Cap Benefit with the end of military service captured on it and with either no end date recorded on it or an end date recorded on or after that loan's next due date is not offered until that benefit carries a scheduled plan installment line for that loan's next due date.
        condition: >-
          The borrower's active Servicemember Rate Cap Benefit on the other loan, which carries a captured end of military service and either no end_date or an end_date on or after that loan's next due date, has a hardship_plan_installment_scheduled line whose installment_due_date is that loan's next due date.
        resolved_by: schedule_benefit_plan_installment_71e01653
        effect: >-
          The line for the benefit loan's next due date stands on the benefit, so the rate reduction may be offered on the other loan.
    cross_category:
      - category: loan
        as: history
        reads: [principal_balance, next_due_date, maturity_date, current_interest_rate, scheduled_payment_amount, funding_date, variant_name, autopay_enrolled, loan_transactions.payment_channel]
        note: The installment, repayment-shape, tenure, AutoPay and grade ladders read the loan and its ledger.
    compute:
      - loan_principal: "CFIELD('loan', 'principal_balance', loan_id=F('loan_id'))"
      - due_dates_left: "MX(1, MONTHS(CFIELD('loan', 'next_due_date', loan_id=F('loan_id')), CFIELD('loan', 'maturity_date', loan_id=F('loan_id'))) + 1)"
      - scheduled_installment: "CFIELD('loan', 'scheduled_payment_amount', loan_id=F('loan_id'))"
      - current_rate_monthly: "CFIELD('loan', 'current_interest_rate', loan_id=F('loan_id')) / 1200"
      - income_statements: "COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='income_statement')"
      - severe_documents: "COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='medical_bill') + COUNT('hardship_plan_events', event_type='hardship_document_received', document_type='death_certificate')"
      - hardship_rate: "K('rate_severe_documented') if ((F('hardship_reason') == 'medical_hardship' or F('hardship_reason') == 'death_of_household_earner') and severe_documents >= 1) else (K('rate_income_documented') if (F('hardship_reason') == 'reduced_income' and income_statements >= K('income_statements_needed')) else P('plan_rate_percent'))"
      - shape_due_dates: "MONTHS(CFIELD('loan', 'next_due_date', loan_id=F('loan_id')), CFIELD('loan', 'maturity_date', loan_id=F('loan_id'))) + 1"
      - shape_code: "2 if shape_due_dates <= K('short_loan_due_dates') else (1 if shape_due_dates > K('long_loan_due_dates') else 0)"
      - tenure_months: "MONTHS(CFIELD('loan', 'funding_date', loan_id=F('loan_id')), F('request_date'))"
      - tenure_points: "K('tenure_points_long') if tenure_months >= K('tenure_long_months') else (K('tenure_points_mid') if tenure_months >= K('tenure_mid_months') else 0)"
      - autopay_on: "CFIELD('loan', 'autopay_enrolled', loan_id=F('loan_id'))"
      - autopay_debits_12m: "XCOUNT('loan', 'loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_posted', payment_channel='autopay_ach', loan_id=F('loan_id'))"
      - autopay_returns_12m: "XCOUNT('loan', 'loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned', payment_channel='autopay_ach', loan_id=F('loan_id'))"
      - autopay_points: "K('autopay_points_clean') if (autopay_on == True and autopay_debits_12m >= 1 and autopay_returns_12m == 0) else (K('autopay_points_returned') if (autopay_on == True and autopay_returns_12m >= 1) else 0)"
      - loan_grade: "CFIELD('loan', 'variant_name', loan_id=F('loan_id'))"
      - grade_points: "K('grade_points_high') if (loan_grade == 'Personal Loan Grade E' or loan_grade == 'Personal Loan Grade F' or loan_grade == 'Personal Loan Grade G') else (K('grade_points_mid') if (loan_grade == 'Personal Loan Grade C' or loan_grade == 'Personal Loan Grade D') else 0)"
      - plan_rate: "MX(K('plan_rate_floor'), hardship_rate - tenure_points - autopay_points - grade_points)"
      - plan_rate_monthly: "plan_rate / 1200"
      - result: "MX(P('min_plan_payment_usd'), RND((MX(0, scheduled_installment - loan_principal * current_rate_monthly) + loan_principal * plan_rate_monthly) if shape_code == 2 else ((loan_principal * plan_rate_monthly) if shape_code == 1 else (loan_principal * plan_rate_monthly / (1 - (1 + plan_rate_monthly) ** (0 - due_dates_left)))), 2))"
    compute_basis:
      loan_principal: "The Temporary Rate Reduction Plan installment is the level installment that repays the loan's unpaid principal at the program's plan_rate_percent over the due dates left from the loan's next due date through its maturity date, counted as the whole calendar months from the next due date to the maturity date plus one and counting at least one due date."
      due_dates_left: "The Temporary Rate Reduction Plan installment is the level installment that repays the loan's unpaid principal at the program's plan_rate_percent over the due dates left from the loan's next due date through its maturity date, counted as the whole calendar months from the next due date to the maturity date plus one and counting at least one due date."
      scheduled_installment: "the principal part of its scheduled installment, being that installment less one month's interest on the unpaid principal at the loan's current rate and never below zero, plus one month's interest on the unpaid principal at the plan rate, so that the payment falls by exactly the interest the lower rate saves; a loan with more than long_loan_due_dates due dates left pays one month's interest on the unpaid principal at the plan rate and no principal; any other loan pays the level installment at the plan rate"
      current_rate_monthly: "one month's interest on the unpaid principal at the loan's current rate and never below zero, plus one month's interest on the unpaid principal at the plan rate, so that the payment falls by exactly the interest the lower rate saves; a loan with more than long_loan_due_dates due dates left pays one month's interest on the unpaid principal at the plan rate and no principal; any other loan pays the level installment at the plan rate"
      income_statements: "a request for reduced_income with at least income_statements_needed income statements recorded on it uses rate_income_documented percent; any other request uses the program's plan_rate_percent."
      severe_documents: "a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it uses rate_severe_documented percent; a request for reduced_income with at least income_statements_needed income statements recorded on it uses rate_income_documented percent; any other request uses the program's plan_rate_percent."
      hardship_rate: "Documented-hardship rate: a request for medical_hardship or death_of_household_earner with a medical bill or a death certificate recorded on it uses rate_severe_documented percent; a request for reduced_income with at least income_statements_needed income statements recorded on it uses rate_income_documented percent; any other request uses the program's plan_rate_percent."
      shape_due_dates: "a loan with short_loan_due_dates or fewer due dates left from its next due date through its maturity date pays, on each plan due date, the principal part of its scheduled installment, being that installment less one month's interest on the unpaid principal at the loan's current rate and never below zero, plus one month's interest on the unpaid principal at the plan rate, so that the payment falls by exactly the interest the lower rate saves; a loan with more than long_loan_due_dates due dates left pays one month's interest on the unpaid principal at the plan rate and no principal; any other loan pays the level installment at the plan rate"
      shape_code: "Repayment shape: a loan with short_loan_due_dates or fewer due dates left from its next due date through its maturity date pays, on each plan due date, the principal part of its scheduled installment, being that installment less one month's interest on the unpaid principal at the loan's current rate and never below zero, plus one month's interest on the unpaid principal at the plan rate, so that the payment falls by exactly the interest the lower rate saves; a loan with more than long_loan_due_dates due dates left pays one month's interest on the unpaid principal at the plan rate and no principal; any other loan pays the level installment at the plan rate, the due dates left being the whole calendar months from the next due date to the maturity date plus one."
      tenure_months: "a month counting as complete only when the later date reaches the funding day of the month."
      tenure_points: "Tenure points: a loan funded at least tenure_long_months whole calendar months before the request date takes tenure_points_long percentage points off the plan rate; a loan funded at least tenure_mid_months but fewer than tenure_long_months whole calendar months before it takes tenure_points_mid points off; a younger loan takes none, a month counting as complete only when the later date reaches the funding day of the month."
      autopay_on: "a loan with AutoPay enrolled, with at least one AutoPay debit posted and none returned in the twelve months before the offer date, takes autopay_points_clean percentage points off the plan rate; a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none, a debit counting as within them when fewer than twelve whole calendar months separate its date from the offer date."
      autopay_debits_12m: "with at least one AutoPay debit posted and none returned in the twelve months before the offer date, takes autopay_points_clean percentage points off the plan rate; a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none, a debit counting as within them when fewer than twelve whole calendar months separate its date from the offer date."
      autopay_returns_12m: "a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none, a debit counting as within them when fewer than twelve whole calendar months separate its date from the offer date."
      autopay_points: "AutoPay points: a loan with AutoPay enrolled, with at least one AutoPay debit posted and none returned in the twelve months before the offer date, takes autopay_points_clean percentage points off the plan rate; a loan with AutoPay enrolled and at least one returned AutoPay debit in those twelve months takes autopay_points_returned points off; any other loan, including one enrolled with no AutoPay debit posted in those months, takes none, a debit counting as within them when fewer than twelve whole calendar months separate its date from the offer date."
      loan_grade: "a loan in Personal Loan Grade E, F or G takes grade_points_high percentage points off the plan rate; a loan in Personal Loan Grade C or D takes grade_points_mid points off; a loan in Personal Loan Grade A or B takes none."
      grade_points: "Grade points: a loan in Personal Loan Grade E, F or G takes grade_points_high percentage points off the plan rate; a loan in Personal Loan Grade C or D takes grade_points_mid points off; a loan in Personal Loan Grade A or B takes none."
      plan_rate: "Where another rule of this policy replaces the program's plan_rate_percent or the level installment, the replacement takes its place; every point that applies is then subtracted from the plan rate, never taking it below plan_rate_floor percent, and the installment is worked once, at the rate so reached."
      plan_rate_monthly: "The plan rate offered and recorded is the rate the installment is worked at."
      result: "Where another rule of this policy replaces the program's plan_rate_percent or the level installment, the replacement takes its place; every point that applies is then subtracted from the plan rate, never taking it below plan_rate_floor percent, and the installment is worked once, at the rate so reached."
    factors:
      - id: documented_rate
        effect: parameter
        decides: hardship_rate
        bindings: [income_statements, severe_documents, hardship_rate]
        ladder:
          - when: "medical_hardship or death_of_household_earner request AND a medical bill or death certificate recorded"
            value: "K('rate_severe_documented')"
          - when: "reduced_income request AND at least income_statements_needed income statements recorded"
            value: "K('rate_income_documented')"
          - when: "otherwise"
            value: "P('plan_rate_percent')"
        baseline:
          hardship_rate: "P('plan_rate_percent')"
        evidence: [history]
        cross_difficulty: null
      - id: repayment_shape
        effect: method
        decides: shape_code
        bindings: [scheduled_installment, current_rate_monthly, shape_due_dates, shape_code]
        ladder:
          - when: "short_loan_due_dates or fewer due dates left"
            method: "principal part of the scheduled installment plus one month's interest at the plan rate (code 2)"
          - when: "more than long_loan_due_dates due dates left"
            method: "one month's interest at the plan rate, no principal (code 1)"
          - when: "otherwise"
            method: "level installment at the plan rate (code 0)"
        baseline:
          shape_code: "0"
        evidence: [date, cross_category]
        cross_difficulty: loan
      - id: rate_tenure
        effect: parameter
        decides: tenure_points
        bindings: [tenure_months, tenure_points]
        ladder:
          - when: "funded at least tenure_long_months whole months before the request"
            value: "K('tenure_points_long')"
          - when: "funded at least tenure_mid_months but fewer than tenure_long_months months before it"
            value: "K('tenure_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_points: "0"
        evidence: [date, cross_category]
        cross_difficulty: loan
      - id: rate_autopay
        effect: parameter
        decides: autopay_points
        bindings: [autopay_on, autopay_debits_12m, autopay_returns_12m, autopay_points]
        ladder:
          - when: "AutoPay enrolled AND at least one AutoPay debit posted AND none returned in the twelve months"
            value: "K('autopay_points_clean')"
          - when: "AutoPay enrolled AND at least one returned AutoPay debit in the twelve months"
            value: "K('autopay_points_returned')"
          - when: "otherwise"
            value: "0"
        baseline:
          autopay_points: "0"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: rate_grade_relief
        effect: parameter
        decides: grade_points
        bindings: [loan_grade, grade_points]
        ladder:
          - when: "Personal Loan Grade E, F or G"
            value: "K('grade_points_high')"
          - when: "Personal Loan Grade C or D"
            value: "K('grade_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          grade_points: "0"
        evidence: [cross_category]
        cross_difficulty: loan
    inputs:
      history:
        - {table: hardship_plan_events, aggregate: count, field: hardship_event_id, within_months: null, filters: {event_type: hardship_document_received}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_posted, payment_channel: autopay_ach}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_returned, payment_channel: autopay_ach}}
      cross_category: [loan]
