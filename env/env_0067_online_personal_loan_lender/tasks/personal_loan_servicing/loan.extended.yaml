# ---- data flow (every write is an event) ----
events:
  - type: loan_application_submitted
    target: loans
    mutation: create
    meaning: An applicant submits a personal loan application (a new loan or a refinance of an existing Larkspur loan).
    grain: One row per application.
    fields:
      customer_id: Applicant.
      variant_name: Rate grade shown at prequalification; underwriting confirms or changes it at approval.
      loan_purpose: Purpose selected on the application.
      origination_state: State of residence on the application.
      application_date: Date submitted.
      term_months: Term requested.
      amount_financed: Loan amount requested, origination fee included.
      refinanced_from_loan_id: Existing Larkspur loan to be paid off, for a refinance application; empty otherwise.
    triggers: []
  - type: loan_approved
    target: loans
    mutation: {transition: {from: applied, to: approved}}
    meaning: Underwriting approves the application and fixes the grade and pricing of the offer.
    grain: One row per transaction.
    fields:
      variant_name: Final rate grade.
      approval_date: Date approved.
      base_interest_rate: Base rate after term adjustment and any direct-pay discount.
      current_interest_rate: Equal to base_interest_rate at approval.
      apr: Disclosed APR.
      origination_fee_amount: Origination fee.
      net_proceeds: Amount financed minus origination fee.
      scheduled_payment_amount: Monthly installment.
      direct_pay_discount_applied: Whether the direct-pay discount is in the base rate.
    triggers: []
  - type: loan_declined
    target: loans
    mutation: {transition: {from: applied, to: declined}}
    meaning: Underwriting declines the application.
    grain: One row per transaction.
    fields:
      status: Set to declined.
    triggers: []
  - type: loan_withdrawn
    target: loans
    mutation: {transition: [{from: applied, to: withdrawn}, {from: approved, to: withdrawn}]}
    meaning: The applicant withdraws the application or turns down the approved offer before signing.
    grain: One row per transaction.
    fields:
      status: Set to withdrawn.
    triggers: []
  - type: loan_offer_expired
    target: loans
    mutation: {transition: {from: approved, to: expired}}
    meaning: An approved offer lapses unsigned.
    grain: One row per transaction.
    fields:
      status: Set to expired.
    triggers: []
  - type: loan_funded
    target: loans
    mutation: {transition: {from: approved, to: active}}
    meaning: The signed loan is funded and becomes an active installment loan.
    grain: One row per transaction.
    fields:
      funding_date: Disbursement date; interest accrues from it.
      maturity_date: Final scheduled due date.
      payment_due_day: Day of month installments are due.
      next_due_date: First installment due date.
      interest_paid_through_date: Equal to funding_date at funding.
      principal_balance: Equal to amount_financed at funding.
      fees_balance: 0.00 at funding.
      amount_past_due: 0.00 at funding.
    triggers:
      - event: loan:loan_disbursement
        map: {txn_date: funding_date}
  - type: loan_disbursement
    target: loan_transactions
    meaning: One disbursement line at funding - the deposit to the borrower, a direct payment to a creditor, a transfer paying off a refinanced Larkspur loan, or the origination fee withheld.
    grain: One row per payee per funded loan.
    distinguish_by: [disbursement_type, payee_name]
    fields:
      txn_date: Funding date.
      amount: Amount of this line; the lines of one loan sum to amount_financed.
      disbursement_type: Kind of line.
      payee_name: Payee as printed.
      bank_account_id: Borrower's linked account for a borrower_deposit; empty otherwise.
    account: principal
    direction: in
    triggers:
      - event: loan:loan_payment_posted
        when: {disbursement_type: refinance_payoff_transfer}
        map: {txn_date: txn_date, amount: amount, payment_channel: internal_transfer, payment_type: payoff}
  - type: loan_payment_posted
    target: loan_transactions
    meaning: A payment from the borrower (or a transfer on the borrower's behalf) is credited to the loan and split between interest and principal (any part applied to unpaid fees is booked as a fee payment line).
    grain: One row per payment received.
    distinguish_by: [txn_date, payment_channel, payment_type, amount]
    fields:
      txn_date: Effective date of the payment.
      amount: Total payment.
      payment_channel: How it was paid.
      payment_type: What it was intended for.
      bank_account_id: Account debited, for ACH payments.
      interest_portion: Part applied to accrued interest.
      principal_portion: Part applied to principal.
      installment_due_date: Due date of the oldest installment the payment is applied toward; empty for additional_principal and payoff.
    account: principal
    direction: out
    triggers:
      - event: loan:loan_account_status_updated
        map: {}
      - event: hardship:hardship_plan_payment_credited
        when: {payment_type: hardship_plan_payment}
        map: {loan_txn_id: loan_txn_id, loan_id: loan_id, event_date: txn_date, amount: amount, installment_due_date: installment_due_date}
  - type: loan_payment_returned
    target: loan_transactions
    meaning: A previously posted payment is returned unpaid by the bank (ACH return) or reversed through a debit-card chargeback, and its interest and principal allocation is reversed.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Date the return was received.
      amount: Amount returned (equal to the original payment).
      related_txn_id: The payment returned.
      return_code: Return reason code.
      payment_channel: Channel of the original payment.
      bank_account_id: Account of the original payment.
      interest_portion: Interest allocation reversed.
      principal_portion: Principal re-added.
    account: principal
    direction: in
    triggers:
      - event: loan:loan_account_status_updated
        map: {}
      - event: loan:loan_returned_payment_fee_assessed
        when: {return_code: [R01, R02, R03, R04, R08, R09, R16, R20]}
        map: {related_txn_id: loan_txn_id, txn_date: txn_date}
  - type: loan_fee_paid
    target: loan_transactions
    meaning: The part of a posted payment applied to one unpaid fee.
    grain: One row per fee per funding payment.
    distinguish_by: [related_txn_id, source_txn_id]
    fields:
      txn_date: Effective date of the funding payment.
      amount: Amount applied to the fee.
      related_txn_id: Fee paid.
      source_txn_id: Payment that funded it.
    account: fees_due
    direction: out
    triggers:
      - event: loan:loan_account_status_updated
        map: {}
  - type: loan_interest_credit_applied
    target: loan_transactions
    meaning: Interest already paid that must be given back (interest above the Servicemember rate cap since the service start date, or interest charged through a Larkspur error) is credited to principal.
    grain: One row per credit per basis.
    distinguish_by: [txn_date, waiver_reason]
    fields:
      txn_date: Date credited.
      amount: Interest credited.
      waiver_reason: scra_benefit or lender_error.
    account: principal
    direction: out
    triggers:
      - event: loan:loan_account_status_updated
        map: {}
  - type: loan_fee_payment_reversed
    target: loan_transactions
    meaning: A fee payment line is reversed because the payment that funded it was returned, so the fee is unpaid again.
    grain: One row per fee payment line reversed.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Date the funding payment's return was received.
      amount: Amount of the fee payment line reversed.
      related_txn_id: Fee payment line reversed.
      source_txn_id: Return line that caused the reversal.
    account: fees_due
    direction: in
    triggers:
      - event: loan:loan_account_status_updated
        map: {}
  - type: loan_late_fee_assessed
    target: loan_transactions
    meaning: A late fee is charged because an installment remained unpaid past the grace period.
    grain: One row per installment due date.
    distinguish_by: [installment_due_date]
    fields:
      txn_date: Assessment date.
      amount: Fee amount under the applicable state fee schedule.
      installment_due_date: Installment the fee is for.
      fee_schedule: State fee schedule applied.
    account: fees_due
    direction: in
    triggers:
      - event: loan:loan_account_status_updated
        map: {}
  - type: loan_returned_payment_fee_assessed
    target: loan_transactions
    meaning: A returned-payment fee is charged for one returned payment.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Assessment date.
      amount: Fee amount under the applicable state fee schedule.
      related_txn_id: The return line the fee is charged for.
      fee_schedule: State fee schedule applied.
    account: fees_due
    direction: in
    triggers:
      - event: loan:loan_account_status_updated
        map: {}
  - type: loan_fee_waived
    target: loan_transactions
    meaning: All or the unpaid remainder of one late or returned-payment fee is waived.
    grain: One row per fee waived.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Waiver date.
      amount: Amount waived.
      related_txn_id: Fee waived.
      waiver_reason: Basis for the waiver.
    account: fees_due
    direction: out
    triggers:
      - event: loan:loan_account_status_updated
        map: {}
  - type: loan_due_date_change_recorded
    target: loan_servicing_events
    meaning: The borrower's monthly due day is changed.
    grain: One row per due-date change.
    distinguish_by: [event_date, new_due_day]
    fields:
      event_date: Date recorded.
      request_channel: Where it was requested.
      previous_due_day: Old due day.
      new_due_day: New due day.
      first_due_date_after_change: First due date on the new day.
    triggers:
      - event: loan:loan_payment_schedule_updated
        map: {payment_due_day: new_due_day, next_due_date: first_due_date_after_change}
  - type: loan_autopay_enrolled
    target: loan_servicing_events
    meaning: The borrower authorizes recurring AutoPay debits from a linked bank account.
    grain: One row per enrollment.
    distinguish_by: [event_date, bank_account_id]
    fields:
      event_date: Date authorized.
      request_channel: Where it was set up.
      bank_account_id: Account to be debited.
    triggers:
      - event: loan:loan_autopay_terms_updated
        map: {autopay_enrolled: true, autopay_bank_account_id: bank_account_id}
  - type: loan_autopay_cancelled
    target: loan_servicing_events
    meaning: Recurring AutoPay debits end.
    grain: One row per cancellation.
    distinguish_by: [event_date]
    fields:
      event_date: Date AutoPay ended.
      request_channel: Where the cancellation came from (system for automatic cancellations).
      autopay_cancel_reason: Why it ended.
    triggers:
      - event: loan:loan_autopay_terms_updated
        map: {autopay_enrolled: false}
  - type: loan_payoff_quote_issued
    target: loan_payoff_quotes
    meaning: A payoff quote is issued stating the amount that pays the loan in full through a good-through date.
    grain: One row per quote issued.
    distinguish_by: [quote_date, good_through_date, quote_purpose]
    fields:
      quote_date: Date issued.
      good_through_date: Last date the amount is valid.
      principal_amount: Unpaid principal.
      accrued_interest_amount: Interest through the good-through date.
      unpaid_fees_amount: Unpaid fees.
      payoff_amount: Total payoff.
      per_diem_amount: One day of interest.
      quote_purpose: Purpose of the quote.
    triggers: []
  - type: loan_payment_schedule_updated
    target: loans
    mutation: update
    meaning: The installment schedule fields of the loan change after a due-date change or a hardship deferral.
    grain: One row per transaction.
    fields:
      payment_due_day: New due day.
      next_due_date: New next due date.
      maturity_date: New final due date.
    triggers: []
  - type: loan_autopay_terms_updated
    target: loans
    mutation: update
    meaning: AutoPay status, the debited account and the rate in force change after an AutoPay enrollment or cancellation.
    grain: One row per transaction.
    fields:
      autopay_enrolled: AutoPay on or off.
      autopay_bank_account_id: Account debited, or empty.
      current_interest_rate: Rate in force after the discount is added or removed.
    triggers: []
  - type: loan_terms_modified
    target: loans
    mutation: update
    meaning: The rate, installment or maturity of the loan change because a hardship or servicemember benefit starts or ends.
    grain: One row per transaction.
    fields:
      current_interest_rate: Rate in force.
      scheduled_payment_amount: Installment in force.
      maturity_date: Final due date in force.
      next_due_date: Next due date in force.
    triggers: []
  - type: loan_account_status_updated
    target: loans
    mutation: update
    meaning: Balances and delinquency fields are refreshed after a monetary ledger line posts.
    grain: One row per transaction.
    fields:
      principal_balance: Unpaid principal.
      fees_balance: Unpaid fees.
      amount_past_due: Amount past due.
      next_due_date: Oldest unpaid due date.
      interest_paid_through_date: Date interest is paid through.
    triggers: []
  - type: loan_paid_off
    target: loans
    mutation: {transition: [{from: active, to: paid_off}, {from: charged_off, to: paid_off}]}
    meaning: The loan balance reaches zero and the loan closes.
    grain: One row per transaction.
    fields:
      closed_date: Date paid off.
      closure_reason: paid_as_scheduled, early_payoff, refinanced or paid_after_charge_off.
    triggers:
      - event: protection:protection_terminated
        map: {closed_date: closed_date}
  - type: loan_reinstated
    target: loans
    mutation: {transition: {from: paid_off, to: active}}
    meaning: A loan that was closed by a payment is reopened because that payment was returned unpaid.
    grain: One row per transaction.
    fields:
      closed_date: Cleared (empty) on reinstatement.
      closure_reason: Cleared (empty) on reinstatement.
    triggers: []
  - type: loan_charged_off
    target: loans
    mutation: {transition: {from: active, to: charged_off}}
    meaning: The loan is charged off for delinquency.
    grain: One row per transaction.
    fields:
      charged_off_date: Date charged off.
    triggers:
      - event: protection:protection_terminated
        map: {termination_reason: loan_charged_off}
  - type: loan_settled
    target: loans
    mutation: {transition: {from: charged_off, to: settled}}
    meaning: A charged-off loan is closed as settled for less than the full balance.
    grain: One row per transaction.
    fields:
      closed_date: Date settled.
      closure_reason: Set to settled.
    triggers: []

# ---- derived measures ----
measures:
  - id: loan_msr_on_time_installments_12m
    window: The 12 calendar months ending on the day before the reference date (the fee's assessment date for a courtesy waiver).
    measure: Count of this loan's installment due dates in the window that were on time - paid in full (payment amounts credited toward the installment, net of any later-returned payment, reaching scheduled_payment_amount) no later than the end of the late-fee grace period, with no loan_late_fee_assessed row for that installment_due_date.
  - id: loan_msr_consecutive_on_time_installments
    window: Installment due dates of this loan from funding through the latest due date on or before today, counted backwards from the latest.
    measure: Number of consecutive most recent installments that were on time (same on-time basis as loan_msr_on_time_installments_12m); a deferred installment under a hardship plan is skipped, neither breaking nor extending the run.
  - id: loan_msr_installments_paid_since_funding
    window: From the funding date through today.
    measure: Count of installment due dates of this loan that have been paid in full, net of returned payments, regardless of timeliness.
  - id: loan_msr_courtesy_waivers_12m
    window: Rolling 12 months ending today (today and the 364 days before it).
    measure: Count of loan_fee_waived rows on this loan with waiver_reason = courtesy and txn_date in the window.
  - id: loan_msr_due_date_changes_12m
    window: Rolling 12 months ending today (today and the 364 days before it).
    measure: Count of loan_due_date_change_recorded rows on this loan with event_date in the window.
  - id: loan_msr_due_date_changes_lifetime
    window: From the funding date through today.
    measure: Count of loan_due_date_change_recorded rows on this loan.
  - id: loan_msr_consecutive_autopay_returns
    window: AutoPay debits of this loan (loan_payment_posted with payment_channel = autopay_ach) since the latest loan_autopay_enrolled row, newest first.
    measure: Number of consecutive most recent AutoPay debits that have a loan_payment_returned row pointing at them.
  - id: loan_msr_returned_fees_this_month
    window: The calendar month containing the assessment date.
    measure: Count of loan_returned_payment_fee_assessed rows on this loan with txn_date in that calendar month.
  - id: loan_msr_card_payments_this_month
    window: The calendar month containing the payment effective date.
    measure: Count of loan_payment_posted rows on this loan with payment_channel = debit_card and txn_date in that calendar month, including returned ones.
  - id: loan_msr_days_past_due
    window: As of today.
    measure: Calendar days from next_due_date to today when next_due_date is earlier than today; 0 otherwise.

# ---- policies ----
policies:
  - id: loan_agg_multi_holding
    subject: [loan_application_submitted]
    rule: >-
      A borrower may hold at most max_per_customer Larkspur personal loans at the same time; loans in applied, approved or
      active status count toward the limit, while declined, withdrawn, expired, paid_off and settled loans do not. A
      refinance application does not count the active loan it will pay off, because that loan closes on the refinance
      funding date. The borrower holds fewer than the maximum number of open personal loans, not counting the loan a refinance application will pay off.
      No personal loan of the borrower is in charged_off status. An application that fails either condition is not
      taken, and the borrower is told which condition blocks it. The limit is counted per customer profile, not per
      household, address or bank account.
    eligibility:
      - id: open_loan_cap
        applies_to: [loan_application_submitted]
        kind: authorization
        condition: The borrower holds fewer than the maximum number of open personal loans, not counting the loan a refinance application will pay off.
        evidence_fields: [loans.customer_id, loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.customer_id]
          action_bindings:
            loans.customer_id: customer_id
      - id: no_charged_off_loan
        applies_to: [loan_application_submitted]
        kind: authorization
        condition: No personal loan of the borrower is in charged_off status.
        evidence_fields: [loans.customer_id, loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.customer_id]
          action_bindings:
            loans.customer_id: customer_id
    params:
      max_per_customer: 2

  - id: loan_agg_combined_exposure
    subject: [loan_application_submitted, loan_approved]
    rule: >-
      When a borrower who already holds an active personal loan applies for another, the loans are assessed together.
      The combined unpaid principal of the borrower's active loans plus the amount financed of the new loan may not
      exceed the combined principal cap of the new loan's grade; the principal of a loan that the new loan refinances is
      left out of the sum, and unpaid fees and accrued interest are never part of it. The existing active loan has an amount past due of 0.00.
      A second concurrent loan (one that does not refinance the existing loan) also requires that the existing loan has at least the second-loan number of consecutive on-time installments, counted under the grade of the existing loan.
      If the combined amount would exceed the cap, the new loan is approved only for the largest amount that fits under
      the cap, provided that amount is still at least the grade's minimum loan amount; otherwise the application is
      declined.
    eligibility:
      - id: existing_loan_current
        applies_to: [loan_application_submitted, loan_approved]
        kind: authorization
        condition: The existing active loan has an amount past due of 0.00.
        evidence_fields: [loans.amount_past_due, loans.customer_id, loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.customer_id]
          action_bindings:
            loans.customer_id: customer_id
      - id: second_loan_history
        applies_to: [loan_approved]
        kind: authorization
        condition: A second concurrent loan (one that does not refinance the existing loan) also requires that the existing loan has at least the second-loan number of consecutive on-time installments, counted under the grade of the existing loan.
        evidence_fields: [loans.loan_id, loans.variant_name, loan_transactions.installment_due_date, loan_transactions.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
    params:
      per_tier:
        Personal Loan Grade A: {combined_principal_cap_usd: "=combined_principal_cap_usd", second_loan_min_on_time_payments: "=second_loan_min_on_time_payments", min_loan_amount_usd: "=min_loan_amount_usd"}
        Personal Loan Grade B: {combined_principal_cap_usd: "=combined_principal_cap_usd", second_loan_min_on_time_payments: "=second_loan_min_on_time_payments", min_loan_amount_usd: "=min_loan_amount_usd"}
        Personal Loan Grade C: {combined_principal_cap_usd: "=combined_principal_cap_usd", second_loan_min_on_time_payments: "=second_loan_min_on_time_payments", min_loan_amount_usd: "=min_loan_amount_usd"}
        Personal Loan Grade D: {combined_principal_cap_usd: "=combined_principal_cap_usd", second_loan_min_on_time_payments: "=second_loan_min_on_time_payments", min_loan_amount_usd: "=min_loan_amount_usd"}
        Personal Loan Grade E: {combined_principal_cap_usd: "=combined_principal_cap_usd", second_loan_min_on_time_payments: "=second_loan_min_on_time_payments", min_loan_amount_usd: "=min_loan_amount_usd"}
        Personal Loan Grade F: {combined_principal_cap_usd: "=combined_principal_cap_usd", second_loan_min_on_time_payments: "=second_loan_min_on_time_payments", min_loan_amount_usd: "=min_loan_amount_usd"}
        Personal Loan Grade G: {combined_principal_cap_usd: "=combined_principal_cap_usd", second_loan_min_on_time_payments: "=second_loan_min_on_time_payments", min_loan_amount_usd: "=min_loan_amount_usd"}
    formula:
      combined_principal: principal_balance + amount_financed
      within_cap: combined_principal <= combined_principal_cap_usd
      largest_new_amount: combined_principal_cap_usd - principal_balance
    measures: [loan_msr_consecutive_on_time_installments]

  - id: loan_application_underwriting
    subject: [loan_application_submitted, loan_approved, loan_declined]
    rule: >-
      Larkspur does not lend to residents of the states listed in unavailable_states. The applicant's state of residence on the profile is not one of the unavailable states.
      The applicant's date of birth is at least the state's minimum age before the application date, using the minimum ages by state in minimum_age_years.
      An age of N years is counted as N times 12 calendar months from the date of birth, and a 29 February birthday falls on 28 February in a non-leap year.
      An application is approved into the highest grade whose entry requirements the applicant meets on every
      dimension - minimum credit score, maximum debt-to-income ratio, minimum verified income, minimum credit history
      and maximum recent inquiries; an applicant who meets no grade is declined and receives an adverse action notice.
      The amount financed must lie between the grade's minimum and maximum loan amounts and the term must be one of the
      grade's available terms; a 60-month or 72-month term also requires the amount financed to be at least the grade's
      minimum for that term. When the requested amount or term does not fit the approved grade, the offer is made at the
      largest allowed amount not above the request and at the closest allowed term (the shorter one on a tie), and the
      applicant may accept or withdraw. The grade on an application is only the prequalification grade; the grade set at
      approval is final, and a support representative never re-grades or re-prices a loan. A declined applicant may
      apply again once reapply_wait_days calendar days have passed after the decline.
    eligibility:
      - id: state_available
        applies_to: [loan_application_submitted]
        kind: authorization
        condition: The applicant's state of residence on the profile is not one of the unavailable states.
        evidence_fields: [customers.state, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: age_of_majority
        applies_to: [loan_application_submitted]
        kind: time
        condition: The applicant's date of birth is at least the state's minimum age before the application date, using the minimum ages by state in minimum_age_years.
        evidence_fields: [customers.date_of_birth, customers.state, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: applicant's date of birth
          anchor_source: customers.date_of_birth
          relation: not_before
          duration_source: params.minimum_age_years
          unit: calendar_months
          counting_rule: An age of N years is counted as N times 12 calendar months from the date of birth, and a 29 February birthday falls on 28 February in a non-leap year.
          boundary: inclusive
    params:
      unavailable_states: [IA, WV]
      minimum_age_years: {default: 18, AL: 19, NE: 19, MS: 21}
      reapply_wait_days: 30
      per_tier:
        Personal Loan Grade A: {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_loan_amount_usd: "=min_loan_amount_usd", max_loan_amount_usd: "=max_loan_amount_usd", available_terms_months: "=available_terms_months"}
        Personal Loan Grade B: {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_loan_amount_usd: "=min_loan_amount_usd", max_loan_amount_usd: "=max_loan_amount_usd", available_terms_months: "=available_terms_months"}
        Personal Loan Grade C: {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_loan_amount_usd: "=min_loan_amount_usd", max_loan_amount_usd: "=max_loan_amount_usd", available_terms_months: "=available_terms_months"}
        Personal Loan Grade D: {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_loan_amount_usd: "=min_loan_amount_usd", max_loan_amount_usd: "=max_loan_amount_usd", available_terms_months: "=available_terms_months"}
        Personal Loan Grade E: {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_loan_amount_usd: "=min_loan_amount_usd", max_loan_amount_usd: "=max_loan_amount_usd", available_terms_months: "=available_terms_months"}
        Personal Loan Grade F: {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_loan_amount_usd: "=min_loan_amount_usd", max_loan_amount_usd: "=max_loan_amount_usd", available_terms_months: "=available_terms_months"}
        Personal Loan Grade G: {min_credit_score: "=min_credit_score", max_dti_percent: "=max_dti_percent", min_annual_income_usd: "=min_annual_income_usd", min_loan_amount_usd: "=min_loan_amount_usd", max_loan_amount_usd: "=max_loan_amount_usd", available_terms_months: "=available_terms_months"}

  - id: loan_pricing_and_disbursement
    subject: [loan_approved, loan_funded, loan_disbursement]
    rule: >-
      Every Larkspur personal loan is a fixed-rate, simple-interest, fully amortizing installment loan. At approval the
      base interest rate is the 36-month rate the underwriting model set inside the grade's floor-to-ceiling band, plus
      the grade's term adjustment for the chosen term, minus the grade's direct-pay discount when the borrower elected to
      have at least direct_pay_min_share_percent of net proceeds paid directly to no more than max_direct_pay_creditors
      creditors. The origination fee is the grade's origination fee percent of the amount financed, rounded to the cent;
      on a refinance loan (loan purpose refinance_existing_loan) that percent is first reduced by the grade's refinance
      origination fee reduction, never below zero. The fee is withheld from the loan amount, so net proceeds equal the
      amount financed minus the fee, and interest accrues on the full amount financed. The monthly installment is the
      level payment that repays the amount financed over the term at the base interest rate (monthly rate = base rate
      divided by 1200), rounded to the cent, with any rounding difference absorbed by the final installment. If the APR
      including the origination fee would exceed max_apr_percent, the base rate is lowered until the APR equals
      max_apr_percent at most; if even the grade's rate floor cannot achieve this the application is declined.
      Disbursement lines are written only for a loan in active status on its funding date. At funding the loan amount is
      split into disbursement lines that sum exactly to the amount financed: one origination_fee_withheld line for the
      fee, one refinance_payoff_transfer line for the payoff amount of a refinance-purpose payoff quote good through the
      funding date (refinance loans only), one creditor_direct_pay line per creditor paid directly, and one
      borrower_deposit line for the remainder to the borrower's verified linked account (no line when the remainder is
      0.00). Funds are sent funding_business_days business days after signing.
    eligibility:
      - id: funded_loan_only
        applies_to: [loan_disbursement]
        kind: state
        condition: Disbursement lines are written only for a loan in active status on its funding date.
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active]
    params:
      per_tier:
        Personal Loan Grade A: {base_rate_floor_percent: "=base_rate_floor_percent", base_rate_ceiling_percent: "=base_rate_ceiling_percent", origination_fee_percent: "=origination_fee_percent", direct_pay_discount_percent: "=direct_pay_discount_percent", refinance_origination_fee_reduction_percent: "=refinance_origination_fee_reduction_percent"}
        Personal Loan Grade B: {base_rate_floor_percent: "=base_rate_floor_percent", base_rate_ceiling_percent: "=base_rate_ceiling_percent", origination_fee_percent: "=origination_fee_percent", direct_pay_discount_percent: "=direct_pay_discount_percent", refinance_origination_fee_reduction_percent: "=refinance_origination_fee_reduction_percent"}
        Personal Loan Grade C: {base_rate_floor_percent: "=base_rate_floor_percent", base_rate_ceiling_percent: "=base_rate_ceiling_percent", origination_fee_percent: "=origination_fee_percent", direct_pay_discount_percent: "=direct_pay_discount_percent", refinance_origination_fee_reduction_percent: "=refinance_origination_fee_reduction_percent"}
        Personal Loan Grade D: {base_rate_floor_percent: "=base_rate_floor_percent", base_rate_ceiling_percent: "=base_rate_ceiling_percent", origination_fee_percent: "=origination_fee_percent", direct_pay_discount_percent: "=direct_pay_discount_percent", refinance_origination_fee_reduction_percent: "=refinance_origination_fee_reduction_percent"}
        Personal Loan Grade E: {base_rate_floor_percent: "=base_rate_floor_percent", base_rate_ceiling_percent: "=base_rate_ceiling_percent", origination_fee_percent: "=origination_fee_percent", direct_pay_discount_percent: "=direct_pay_discount_percent", refinance_origination_fee_reduction_percent: "=refinance_origination_fee_reduction_percent"}
        Personal Loan Grade F: {base_rate_floor_percent: "=base_rate_floor_percent", base_rate_ceiling_percent: "=base_rate_ceiling_percent", origination_fee_percent: "=origination_fee_percent", direct_pay_discount_percent: "=direct_pay_discount_percent", refinance_origination_fee_reduction_percent: "=refinance_origination_fee_reduction_percent"}
        Personal Loan Grade G: {base_rate_floor_percent: "=base_rate_floor_percent", base_rate_ceiling_percent: "=base_rate_ceiling_percent", origination_fee_percent: "=origination_fee_percent", direct_pay_discount_percent: "=direct_pay_discount_percent", refinance_origination_fee_reduction_percent: "=refinance_origination_fee_reduction_percent"}
    formula:
      is_refinance: loan_purpose == "refinance_existing_loan"
      origination_fee_amount: round(amount_financed * max(0, origination_fee_percent - refinance_origination_fee_reduction_percent * is_refinance) / 100, 2)
      net_proceeds: amount_financed - origination_fee_amount
      scheduled_payment_amount: round(amount_financed * (base_interest_rate / 1200) / (1 - (1 + base_interest_rate / 1200) ** (0 - term_months)), 2)

  - id: loan_evt_payment_application
    subject: [loan_payment_posted, loan_fee_paid, loan_account_status_updated]
    rule: >-
      Payments are accepted on a loan in active or charged_off status. Interest accrues daily as simple interest on the
      unpaid principal at the current interest rate, on an actual/365 basis: the interest accrued at a payment equals
      principal_balance times current_interest_rate / 100 / 365 times the number of days from interest_paid_through_date
      to the payment's effective date (effective date minus paid-through date), rounded to the cent. Interest does not
      accrue on unpaid fees, and no interest accrues on a charged_off loan. Each payment is applied in the order accrued
      interest, then unpaid fees (oldest fee first, each as its own fee payment line), then principal; after the payment
      interest_paid_through_date is the effective date when the accrued interest was fully paid. An installment is treated
      as paid once the payment amounts credited toward it - counted in full, including any part applied to fees - reach
      the scheduled payment amount; each fully covered installment advances next_due_date by one month on the due day, and
      a payment never covers more than the installments already due plus the next one. Any amount beyond that is applied
      to principal and does not advance next_due_date. A payment's effective date is the business day it was submitted when
      submitted by the same-day cutoff Eastern Time, otherwise the next business day; a mailed check is effective on the
      business day it is received; business days follow the Federal Reserve holiday calendar. A one-time payment must be
      at least one_time_payment_min_usd unless it pays the loan off. A debit card payment is accepted only if it does not exceed the debit card maximum and fewer than the monthly maximum of debit card payments have posted on the loan in that calendar month.
      Payments taken by a representative by phone carry no fee. Balances and delinquency fields on the loan are refreshed
      after every payment, return, fee, fee payment and waiver.
    eligibility:
      - id: payable_status
        applies_to: [loan_payment_posted]
        kind: state
        condition: Payments are accepted on a loan in active or charged_off status.
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active, charged_off]
      - id: debit_card_limits
        applies_to: [loan_payment_posted]
        kind: authorization
        condition: A debit card payment is accepted only if it does not exceed the debit card maximum and fewer than the monthly maximum of debit card payments have posted on the loan in that calendar month.
        evidence_fields: [loan_transactions.payment_channel, loan_transactions.txn_date, loan_transactions.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.loan_id]
          action_bindings:
            loan_transactions.loan_id: loan_id
    params:
      debit_card_payment_max_usd: "=debit_card_payment_max_usd"
      debit_card_payments_per_month_max: "=debit_card_payments_per_month_max"
      same_day_cutoff_time_et: "=same_day_cutoff_time_et"
      one_time_payment_min_usd: "=one_time_payment_min_usd"
      agent_assisted_payment_fee_usd: "=agent_assisted_payment_fee_usd"
    formula:
      days_elapsed: txn_date - interest_paid_through_date
      accrued_interest: round(principal_balance * current_interest_rate / 100 / 365 * days_elapsed, 2)
      interest_portion: min(amount, accrued_interest)
      fee_part: min(amount - interest_portion, fees_balance)
      principal_portion: amount - interest_portion - fee_part
    measures: [loan_msr_card_payments_this_month]

  - id: loan_evt_late_fee
    subject: [loan_late_fee_assessed]
    rule: >-
      A late fee is charged on an installment that is still not paid in full when its grace period ends. The late fee may be assessed only when the current date is later than the installment due date plus the late-fee grace period.
      The grace period is counted in calendar days starting the day after the installment due date, so with a 15-day grace period an installment due on the 1st can first be charged a late fee on the 17th.
      At most max_late_fees_per_installment late fee is charged for one installment. Late fees are assessed only on a loan in active status.
      The amount depends on the state fee schedule fixed by the loan's origination_state (state_fee_schedule_map; states
      not listed use schedule_a), applied to the unpaid portion of that installment on the assessment date: schedule_a
      charges late_fee_schedule_a_percent of the unpaid portion but not less than late_fee_schedule_a_min_usd and not more
      than late_fee_schedule_a_max_usd; schedule_b charges late_fee_schedule_b_percent of the unpaid portion but not more
      than late_fee_schedule_b_max_usd; schedule_c charges late_fee_schedule_c_flat_usd. No schedule ever charges more than
      the unpaid portion itself. No late fee is charged when the installment is short only because part of an
      on-time, full payment was applied to an earlier late fee or returned-payment fee (late fees are never pyramided). No
      late fee is charged for an installment whose due date falls inside an active hardship plan on the loan, for an
      installment deferred by a hardship plan, or while a Servicemember Rate Cap Benefit is active on the loan. A borrower's
      move to another state does not change the schedule.
    eligibility:
      - id: grace_elapsed
        applies_to: [loan_late_fee_assessed]
        kind: time
        condition: The late fee may be assessed only when the current date is later than the installment due date plus the late-fee grace period.
        evidence_fields: [loans.next_due_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment due date
          anchor_source: loans.next_due_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the installment due date, so with a 15-day grace period an installment due on the 1st can first be charged a late fee on the 17th.
          boundary: exclusive
      - id: one_fee_per_installment
        applies_to: [loan_late_fee_assessed]
        kind: dedup
        condition: At most max_late_fees_per_installment late fee is charged for one installment.
        evidence_fields: [loan_transactions.loan_id, loan_transactions.installment_due_date, loan_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.loan_id, loan_transactions.installment_due_date]
          action_bindings:
            loan_transactions.loan_id: loan_id
            loan_transactions.installment_due_date: installment_due_date
        dedup_contract:
          table: loan_transactions
          mode: separate_record
          object_bindings: {loan_id: loan_id, installment_due_date: installment_due_date}
          duplicate_filters: {event_type: [loan_late_fee_assessed]}
          distinct_fields: []
      - id: active_loan_only
        applies_to: [loan_late_fee_assessed]
        kind: state
        condition: Late fees are assessed only on a loan in active status.
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active]
    params:
      max_late_fees_per_installment: "=max_late_fees_per_installment"
      late_fee_grace_days: "=late_fee_grace_days"
      state_fee_schedule_map: {schedule_b: [CA, CO, CT, MA, ME, MN, NY, VT], schedule_c: [MD, NC, WI], schedule_a: all other states where Larkspur lends}
      late_fee_schedule_a_percent: "=late_fee_schedule_a_percent"
      late_fee_schedule_a_min_usd: "=late_fee_schedule_a_min_usd"
      late_fee_schedule_a_max_usd: "=late_fee_schedule_a_max_usd"
      late_fee_schedule_b_percent: "=late_fee_schedule_b_percent"
      late_fee_schedule_b_max_usd: "=late_fee_schedule_b_max_usd"
      late_fee_schedule_c_flat_usd: "=late_fee_schedule_c_flat_usd"
    formula:
      unpaid_portion: min(scheduled_payment_amount, amount_past_due)
      fee_schedule_a: min(unpaid_portion, max(late_fee_schedule_a_min_usd, min(late_fee_schedule_a_max_usd, round(unpaid_portion * late_fee_schedule_a_percent / 100, 2))))
      fee_schedule_b: min(unpaid_portion, late_fee_schedule_b_max_usd, round(unpaid_portion * late_fee_schedule_b_percent / 100, 2))
      fee_schedule_c: min(unpaid_portion, late_fee_schedule_c_flat_usd)
    measures: [loan_msr_days_past_due]

  - id: loan_evt_returned_payment
    subject: [loan_payment_returned, loan_returned_payment_fee_assessed, loan_fee_payment_reversed, loan_reinstated]
    rule: >-
      When a posted payment comes back unpaid, the return reverses that payment exactly: its interest portion is restored
      to accrued interest (interest_paid_through_date returns to its value before the payment), its principal portion is
      re-added to principal, every fee payment line it funded is reversed so those fees are unpaid again, and any
      installment it had covered is unpaid again (next_due_date moves back). A return is recorded against the one payment
      it reverses, never against the loan in general. A returned-payment fee is charged once for each returned payment whose return code is R01, R02, R03, R04, R08, R09, R16 or R20.
      No returned-payment fee is charged for returns coded R07, R10 or R29 or for a debit card chargeback (CB); those are
      authorization disputes handled by the payments team. At most one returned-payment fee is charged per returned payment, and no more than max_returned_payment_fees_per_calendar_month returned-payment fees are charged on a loan in one calendar month.
      The fee amount follows the loan's state fee schedule (state_fee_schedule_map of loan_evt_late_fee):
      returned_payment_fee_schedule_a_usd, returned_payment_fee_schedule_b_usd or returned_payment_fee_schedule_c_usd;
      under schedule_c the fee is 0.00 and no fee line is written. A returned payment can also leave an installment unpaid
      past its grace period, in which case the late fee policy applies separately; the two fees are independent. Larkspur
      does not re-present a returned payment automatically. If the returned payment had paid the loan off, the loan is
      reinstated to active with its closing date and closure reason cleared. Returned AutoPay debits count toward
      automatic AutoPay cancellation under loan_evt_autopay.
    eligibility:
      - id: fee_bearing_code
        applies_to: [loan_returned_payment_fee_assessed]
        kind: authorization
        condition: A returned-payment fee is charged once for each returned payment whose return code is R01, R02, R03, R04, R08, R09, R16 or R20.
        evidence_fields: [loan_transactions.return_code, loan_transactions.loan_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.loan_txn_id]
          action_bindings:
            loan_transactions.loan_txn_id: related_txn_id
      - id: one_fee_per_return
        applies_to: [loan_returned_payment_fee_assessed]
        kind: dedup
        condition: At most one returned-payment fee is charged per returned payment, and no more than max_returned_payment_fees_per_calendar_month returned-payment fees are charged on a loan in one calendar month.
        evidence_fields: [loan_transactions.related_txn_id, loan_transactions.event_type, loan_transactions.txn_date, loan_transactions.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.related_txn_id]
          action_bindings:
            loan_transactions.related_txn_id: related_txn_id
        dedup_contract:
          table: loan_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [loan_returned_payment_fee_assessed]}
          distinct_fields: []
    params:
      fee_bearing_return_codes: [R01, R02, R03, R04, R08, R09, R16, R20]
      max_returned_payment_fees_per_calendar_month: "=max_returned_payment_fees_per_calendar_month"
      returned_payment_fee_schedule_a_usd: "=returned_payment_fee_schedule_a_usd"
      returned_payment_fee_schedule_b_usd: "=returned_payment_fee_schedule_b_usd"
      returned_payment_fee_schedule_c_usd: "=returned_payment_fee_schedule_c_usd"
    measures: [loan_msr_returned_fees_this_month]

  - id: loan_evt_fee_waiver
    subject: [loan_fee_waived]
    rule: >-
      A late fee or returned-payment fee may be waived only on one of the bases below, one waiver line per fee, for the
      part of the fee still unpaid (a fee already paid in full is not waived; a refund of a paid fee is outside this
      policy). Each fee can be waived at most once. A courtesy waiver is granted on the borrower's request when the loan had at least the grade's minimum number of on-time installments in the 12 months before the fee was assessed and fewer than the grade's courtesy waivers per 12 months have already been granted on the loan.
      For courtesy and bank_error_documented waivers, the waiver is requested no later than the fee waiver request window after the fee's assessment date.
      The window is counted in calendar days starting the day after the fee's assessment date, and a request on the last day of the window is in time.
      A bank_error_documented waiver needs a letter from the borrower's bank stating the return was the bank's error.
      A lender_error waiver applies whenever a Larkspur error (a duplicate debit, a debit on the wrong date or for the
      wrong amount, or a payment posted late by Larkspur) caused the fee, with no window or count limit, and an
      unauthorized_debit waiver applies to any fee arising from a debit the payments team has confirmed was not
      authorized. Fees on a loan whose borrower has an approved hardship assistance plan, an active Servicemember Rate Cap
      Benefit or an active Disaster Relief Deferral are waived as hardship_relief, scra_benefit or disaster_relief under
      the hardship program rules. Waivers on these other bases never use up the courtesy allowance. When a fee qualifies
      on more than one basis, the first basis in the order lender_error, unauthorized_debit, bank_error_documented,
      scra_benefit, disaster_relief, hardship_relief, courtesy is recorded.
    eligibility:
      - id: one_waiver_per_fee
        applies_to: [loan_fee_waived]
        kind: dedup
        condition: Each fee can be waived at most once.
        evidence_fields: [loan_transactions.related_txn_id, loan_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.related_txn_id]
          action_bindings:
            loan_transactions.related_txn_id: related_txn_id
        dedup_contract:
          table: loan_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [loan_fee_waived]}
          distinct_fields: []
      - id: courtesy_allowance
        applies_to: [loan_fee_waived]
        kind: authorization
        condition: A courtesy waiver is granted on the borrower's request when the loan had at least the grade's minimum number of on-time installments in the 12 months before the fee was assessed and fewer than the grade's courtesy waivers per 12 months have already been granted on the loan.
        evidence_fields: [loans.variant_name, loans.loan_id, loan_transactions.waiver_reason, loan_transactions.txn_date, loan_transactions.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
      - id: request_window
        applies_to: [loan_fee_waived]
        kind: time
        condition: For courtesy and bank_error_documented waivers, the waiver is requested no later than the fee waiver request window after the fee's assessment date.
        evidence_fields: [loan_transactions.txn_date, loan_transactions.loan_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.loan_txn_id]
          action_bindings:
            loan_transactions.loan_txn_id: related_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee's assessment date
          anchor_source: loan_transactions.txn_date
          relation: not_after
          duration_source: variants.fee_waiver_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the fee's assessment date, and a request on the last day of the window is in time.
          boundary: inclusive
    params:
      basis_priority: [lender_error, unauthorized_debit, bank_error_documented, scra_benefit, disaster_relief, hardship_relief, courtesy]
      per_tier:
        Personal Loan Grade A: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_on_time_payments: "=courtesy_waiver_min_on_time_payments"}
        Personal Loan Grade B: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_on_time_payments: "=courtesy_waiver_min_on_time_payments"}
        Personal Loan Grade C: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_on_time_payments: "=courtesy_waiver_min_on_time_payments"}
        Personal Loan Grade D: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_on_time_payments: "=courtesy_waiver_min_on_time_payments"}
        Personal Loan Grade E: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_on_time_payments: "=courtesy_waiver_min_on_time_payments"}
        Personal Loan Grade F: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_on_time_payments: "=courtesy_waiver_min_on_time_payments"}
        Personal Loan Grade G: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_on_time_payments: "=courtesy_waiver_min_on_time_payments"}
    measures: [loan_msr_on_time_installments_12m, loan_msr_courtesy_waivers_12m]

  - id: loan_evt_due_date_change
    subject: [loan_due_date_change_recorded, loan_payment_schedule_updated]
    rule: >-
      A borrower may move the monthly due day of an active loan. The due day can only be changed on a loan in active status.
      The loan has an amount past due of 0.00 and no hardship plan on the loan is in requested, offered or active status.
      At least the grade's minimum number of scheduled installments have been paid since funding, fewer than due_date_changes_per_12_months changes were recorded in the last 12 months, and fewer than due_date_changes_per_loan changes were recorded over the life of the loan.
      The change is requested no later than the due-date request lead days before the current next due date.
      The latest permitted request date is found by counting the lead days back in calendar days from the current next due date, and a request on that date is in time.
      The new due day must be a day from 1 to 28 and differ from the current one. The first due date under the new day is
      the first date falling on the new day that is later than the current next due date, so a change never makes a
      payment due sooner; that first due date may be at most due_date_max_shift_days calendar days after the current next
      due date, otherwise the change is not available. The maturity date moves the same way (the first date on the new
      day later than the old maturity date). The installment amount does not change; interest keeps accruing daily, so
      the extra days add interest that is collected through the normal allocation and any difference is absorbed by the
      final installment. No fee is charged for a due-date change. If AutoPay is active, the debit date follows the new due
      day automatically.
    eligibility:
      - id: active_loan
        applies_to: [loan_due_date_change_recorded, loan_payment_schedule_updated]
        kind: state
        condition: The due day can only be changed on a loan in active status.
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active]
      - id: current_and_no_hardship
        applies_to: [loan_due_date_change_recorded]
        kind: authorization
        condition: The loan has an amount past due of 0.00 and no hardship plan on the loan is in requested, offered or active status.
        evidence_fields: [loans.amount_past_due, loans.loan_id, hardship_plans.status, hardship_plans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
      - id: change_counts
        applies_to: [loan_due_date_change_recorded]
        kind: authorization
        condition: At least the grade's minimum number of scheduled installments have been paid since funding, fewer than due_date_changes_per_12_months changes were recorded in the last 12 months, and fewer than due_date_changes_per_loan changes were recorded over the life of the loan.
        evidence_fields: [loans.variant_name, loans.loan_id, loan_servicing_events.event_type, loan_servicing_events.event_date, loan_servicing_events.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
      - id: lead_time
        applies_to: [loan_due_date_change_recorded]
        kind: time
        condition: The change is requested no later than the due-date request lead days before the current next due date.
        evidence_fields: [loans.next_due_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the current next due date
          anchor_source: loans.next_due_date
          relation: not_after
          duration_source: variants.due_date_request_lead_days
          unit: calendar_days
          counting_rule: The latest permitted request date is found by counting the lead days back in calendar days from the current next due date, and a request on that date is in time.
          boundary: inclusive
    params:
      due_date_changes_per_12_months: "=due_date_changes_per_12_months"
      due_date_changes_per_loan: "=due_date_changes_per_loan"
      due_date_max_shift_days: "=due_date_max_shift_days"
      allowed_due_days: {first: 1, last: 28}
      per_tier:
        Personal Loan Grade A: {due_date_change_min_payments: "=due_date_change_min_payments"}
        Personal Loan Grade B: {due_date_change_min_payments: "=due_date_change_min_payments"}
        Personal Loan Grade C: {due_date_change_min_payments: "=due_date_change_min_payments"}
        Personal Loan Grade D: {due_date_change_min_payments: "=due_date_change_min_payments"}
        Personal Loan Grade E: {due_date_change_min_payments: "=due_date_change_min_payments"}
        Personal Loan Grade F: {due_date_change_min_payments: "=due_date_change_min_payments"}
        Personal Loan Grade G: {due_date_change_min_payments: "=due_date_change_min_payments"}
    measures: [loan_msr_installments_paid_since_funding, loan_msr_due_date_changes_12m, loan_msr_due_date_changes_lifetime]

  - id: loan_evt_autopay
    subject: [loan_autopay_enrolled, loan_autopay_cancelled, loan_autopay_terms_updated]
    rule: >-
      AutoPay is a recurring ACH debit of the scheduled installment on each due date, authorized by the borrower. AutoPay can be set up only on a loan in active status.
      The account to be debited is a linked bank account of the borrower whose verification status is verified.
      While AutoPay is active the current interest rate is the base interest rate minus the grade's AutoPay discount; the
      discount starts on the enrollment date and stops on the cancellation date, and interest for each day accrues at the
      rate in force that day. The AutoPay discount stacks with the direct-pay discount already built into the base rate,
      but it never applies on top of a rate set by an active hardship plan or Servicemember Rate Cap Benefit - while such a
      plan is active the plan rate governs, and the discounted rate resumes when the plan ends if AutoPay is still on. The
      installment amount does not change when the discount starts or stops. An enrollment made fewer than
      autopay_setup_lead_business_days business days before the next due date first debits the following installment; the
      borrower pays the current one another way. A borrower may cancel AutoPay at any time; a cancellation received fewer
      than autopay_cancel_notice_business_days business days before a scheduled debit does not stop that debit. AutoPay is
      cancelled automatically, with the discount removed the same day, when autopay_consecutive_returns_to_cancel
      consecutive AutoPay debits are returned (reason consecutive_returns), when a debit is returned R02, R03 or R04
      (reason bank_account_closed), or when the loan is paid off, settled or charged off (reason loan_closed). A borrower
      whose AutoPay was cancelled may enroll again at any time with a verified account, and the discount resumes from the
      new enrollment date. Changing the debited account is a cancellation followed by a new enrollment on the same day.
    eligibility:
      - id: active_loan
        applies_to: [loan_autopay_enrolled]
        kind: state
        condition: AutoPay can be set up only on a loan in active status.
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active]
      - id: verified_account
        applies_to: [loan_autopay_enrolled]
        kind: state
        condition: The account to be debited is a linked bank account of the borrower whose verification status is verified.
        evidence_fields: [bank_accounts.verification_status, bank_accounts.bank_account_id, bank_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_accounts.bank_account_id]
          action_bindings:
            bank_accounts.bank_account_id: bank_account_id
        state_contract:
          field: bank_accounts.verification_status
          allowed: [verified]
    params:
      autopay_setup_lead_business_days: "=autopay_setup_lead_business_days"
      autopay_cancel_notice_business_days: "=autopay_cancel_notice_business_days"
      autopay_consecutive_returns_to_cancel: "=autopay_consecutive_returns_to_cancel"
      per_tier:
        Personal Loan Grade A: {autopay_discount_percent: "=autopay_discount_percent"}
        Personal Loan Grade B: {autopay_discount_percent: "=autopay_discount_percent"}
        Personal Loan Grade C: {autopay_discount_percent: "=autopay_discount_percent"}
        Personal Loan Grade D: {autopay_discount_percent: "=autopay_discount_percent"}
        Personal Loan Grade E: {autopay_discount_percent: "=autopay_discount_percent"}
        Personal Loan Grade F: {autopay_discount_percent: "=autopay_discount_percent"}
        Personal Loan Grade G: {autopay_discount_percent: "=autopay_discount_percent"}
    formula:
      rate_with_autopay: base_interest_rate - autopay_discount_percent
      rate_without_autopay: base_interest_rate
    measures: [loan_msr_consecutive_autopay_returns]

  - id: loan_evt_payoff_quote
    subject: [loan_payoff_quote_issued]
    rule: >-
      A payoff quote states the single amount that pays an active loan in full if received by its good-through date. Payoff quotes are issued only for a loan in active status.
      The good-through date is the quote date plus payoff_quote_validity_days calendar days. The quoted principal is the
      unpaid principal on the quote date, the unpaid fees are fees_balance on the quote date, and the accrued interest is
      simple interest on that principal at the current interest rate for the days from interest_paid_through_date through
      the good-through date (good-through date minus paid-through date), actual/365, rounded to the cent. The per diem is
      one day of that interest, rounded to the cent. The payoff amount is principal plus accrued interest plus unpaid
      fees. There is no prepayment penalty. A quote does not change the loan; installments still fall due and AutoPay
      still debits until the payoff posts, and a payment received after the good-through date needs a new quote. A quote
      for another lender (third_party_lender) is issued only when the borrower authorizes it on the call. Only one quote per loan is issued for the same quote date and purpose.
      A quote for a refinance with Larkspur uses the purpose refinance. A charged-off balance is not quoted here.
    eligibility:
      - id: active_loan
        applies_to: [loan_payoff_quote_issued]
        kind: state
        condition: Payoff quotes are issued only for a loan in active status.
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        state_contract:
          field: loans.status
          allowed: [active]
      - id: one_quote_per_day_purpose
        applies_to: [loan_payoff_quote_issued]
        kind: dedup
        condition: Only one quote per loan is issued for the same quote date and purpose.
        evidence_fields: [loan_payoff_quotes.loan_id, loan_payoff_quotes.quote_date, loan_payoff_quotes.quote_purpose]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_payoff_quotes.loan_id, loan_payoff_quotes.quote_purpose]
          action_bindings:
            loan_payoff_quotes.loan_id: loan_id
            loan_payoff_quotes.quote_purpose: quote_purpose
        dedup_contract:
          table: loan_payoff_quotes
          mode: separate_record
          object_bindings: {loan_id: loan_id, quote_purpose: quote_purpose}
          duplicate_filters: {event_type: [loan_payoff_quote_issued]}
          distinct_fields: [quote_date]
    params:
      payoff_quote_validity_days: "=payoff_quote_validity_days"
      prepayment_penalty_usd: "=prepayment_penalty_usd"
    formula:
      principal_amount: principal_balance
      quote_days: good_through_date - interest_paid_through_date
      accrued_interest_amount: round(principal_balance * current_interest_rate / 100 / 365 * quote_days, 2)
      per_diem_amount: round(principal_balance * current_interest_rate / 100 / 365, 2)
      unpaid_fees_amount: fees_balance
      payoff_amount: principal_amount + accrued_interest_amount + unpaid_fees_amount

  - id: loan_evt_payoff_and_closure
    subject: [loan_paid_off, loan_payment_posted]
    rule: >-
      A loan closes as paid_off when a posted payment brings unpaid principal, accrued interest through the payment's
      effective date and unpaid fees to zero - either a payoff payment at least equal to the payoff amount of a quote good
      through the effective date, the final scheduled installment, or a refinance payoff transfer. The closure reason is
      refinanced for a refinance payoff transfer, paid_after_charge_off when the loan was charged_off, paid_as_scheduled
      when the closing payment is the installment due on the maturity date, and early_payoff otherwise. A payoff payment
      smaller than the amount needed is applied as an ordinary payment and the loan stays active. Any overpayment is
      refunded to the source account within overpayment_refund_business_days business days and is not left on the loan.
      On payoff, AutoPay ends (reason loan_closed) and any Payment Protection plan on the loan terminates. If the closing
      payment is later returned, loan_evt_returned_payment reinstates the loan.
    eligibility: []
    params:
      overpayment_refund_business_days: "=overpayment_refund_business_days"

  - id: loan_evt_refinance
    subject: [loan_application_submitted, loan_disbursement]
    rule: >-
      An existing borrower may replace an active Larkspur loan with a new Larkspur loan (loan purpose
      refinance_existing_loan, refinanced_from_loan_id naming the old loan) whose proceeds pay the old loan off. The loan being refinanced must be in active status.
      The application is taken only when the current date is at least the refinance minimum months after the funding date of the loan being refinanced.
      Months are counted as whole calendar months from the funding date, and when the later month has no matching day the last day of that month is used.
      The loan being refinanced has an amount past due of 0.00, no hardship plan on it is in requested, offered or active status, and its most recent consecutive on-time installments number at least the refinance minimum of its grade.
      The months and on-time counts are taken from the grade of the loan being refinanced. The new loan is underwritten,
      priced and capped like any new loan (its own grade, the reduced refinance origination fee, the combined principal cap
      without the old loan's principal), and its net proceeds must cover the payoff amount of a refinance-purpose payoff
      quote good through the expected funding date; otherwise the application is approved only if the borrower raises the
      requested amount within the grade's limits. At funding, one refinance_payoff_transfer disbursement line pays exactly
      that quote's payoff amount to the old loan, which posts there as a payoff payment through internal_transfer and
      closes the old loan as refinanced; any remainder goes to the borrower as a borrower_deposit. Only one refinance
      application per old loan may be open at a time. AutoPay on the old loan does not carry over; the borrower enrolls
      the new loan separately.
    eligibility:
      - id: old_loan_active
        applies_to: [loan_application_submitted]
        kind: authorization
        condition: The loan being refinanced must be in active status.
        evidence_fields: [loans.status, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: refinanced_from_loan_id
      - id: seasoning
        applies_to: [loan_application_submitted]
        kind: time
        condition: The application is taken only when the current date is at least the refinance minimum months after the funding date of the loan being refinanced.
        evidence_fields: [loans.funding_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: refinanced_from_loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the funding date of the loan being refinanced
          anchor_source: loans.funding_date
          relation: not_before
          duration_source: variants.refinance_min_months_since_funding
          unit: calendar_months
          counting_rule: Months are counted as whole calendar months from the funding date, and when the later month has no matching day the last day of that month is used.
          boundary: inclusive
      - id: old_loan_standing
        applies_to: [loan_application_submitted]
        kind: authorization
        condition: The loan being refinanced has an amount past due of 0.00, no hardship plan on it is in requested, offered or active status, and its most recent consecutive on-time installments number at least the refinance minimum of its grade.
        evidence_fields: [loans.amount_past_due, loans.variant_name, loans.loan_id, hardship_plans.status, hardship_plans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: refinanced_from_loan_id
    params:
      per_tier:
        Personal Loan Grade A: {refinance_min_months_since_funding: "=refinance_min_months_since_funding", refinance_min_on_time_payments: "=refinance_min_on_time_payments"}
        Personal Loan Grade B: {refinance_min_months_since_funding: "=refinance_min_months_since_funding", refinance_min_on_time_payments: "=refinance_min_on_time_payments"}
        Personal Loan Grade C: {refinance_min_months_since_funding: "=refinance_min_months_since_funding", refinance_min_on_time_payments: "=refinance_min_on_time_payments"}
        Personal Loan Grade D: {refinance_min_months_since_funding: "=refinance_min_months_since_funding", refinance_min_on_time_payments: "=refinance_min_on_time_payments"}
        Personal Loan Grade E: {refinance_min_months_since_funding: "=refinance_min_months_since_funding", refinance_min_on_time_payments: "=refinance_min_on_time_payments"}
        Personal Loan Grade F: {refinance_min_months_since_funding: "=refinance_min_months_since_funding", refinance_min_on_time_payments: "=refinance_min_on_time_payments"}
        Personal Loan Grade G: {refinance_min_months_since_funding: "=refinance_min_months_since_funding", refinance_min_on_time_payments: "=refinance_min_on_time_payments"}
    measures: [loan_msr_consecutive_on_time_installments]

  - id: loan_evt_offer_and_funding
    subject: [loan_declined, loan_withdrawn, loan_offer_expired, loan_funded]
    rule: >-
      An approved offer stays open for signing for offer_validity_days calendar days. The offer expires when the current date is later than the approval date plus the offer validity period.
      The validity period is counted in calendar days starting the day after the approval date, so the offer can still be signed on the last day of the period.
      An applicant may withdraw an application or turn down an offer at any time before funding; once the loan is
      funded it can only be closed by paying it off, and there is no cancellation of a funded loan. A signed loan is funded
      funding_business_days business days after signing, and the funding date starts interest accrual; the first due date
      is the first date on the chosen due day that is at least 25 calendar days after the funding date. Declined and
      withdrawn applications carry no fee.
    eligibility:
      - id: offer_lapsed
        applies_to: [loan_offer_expired]
        kind: time
        condition: The offer expires when the current date is later than the approval date plus the offer validity period.
        evidence_fields: [loans.approval_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the approval date
          anchor_source: loans.approval_date
          relation: not_before
          duration_source: variants.offer_validity_days
          unit: calendar_days
          counting_rule: The validity period is counted in calendar days starting the day after the approval date, so the offer can still be signed on the last day of the period.
          boundary: exclusive
    params:
      offer_validity_days: "=offer_validity_days"
      first_due_date_min_days_after_funding: 25
      per_tier:
        Personal Loan Grade A: {funding_business_days: "=funding_business_days"}
        Personal Loan Grade B: {funding_business_days: "=funding_business_days"}
        Personal Loan Grade C: {funding_business_days: "=funding_business_days"}
        Personal Loan Grade D: {funding_business_days: "=funding_business_days"}
        Personal Loan Grade E: {funding_business_days: "=funding_business_days"}
        Personal Loan Grade F: {funding_business_days: "=funding_business_days"}
        Personal Loan Grade G: {funding_business_days: "=funding_business_days"}

  - id: loan_evt_delinquency_and_charge_off
    subject: [loan_charged_off, loan_settled]
    rule: >-
      Days past due are counted from next_due_date (the oldest unpaid due date) to today. Delinquency is reported to the
      credit bureaus once a loan reaches delinquency_reporting_days_past_due days past due. A loan is charged off once the current date is at least the charge-off days past due after the oldest unpaid due date.
      Days past due are counted in calendar days starting the day after the oldest unpaid due date.
      A loan in an active hardship plan whose plan installments are paid is not charged off, because plan installments
      keep the loan's due dates current under the hardship rules. Interest stops accruing on charge-off; unpaid fees remain
      owed. A charged-off loan becomes settled only when a Charged-Off Settlement Plan on it is completed, and paid_off
      when the full charged-off balance is recovered.
    eligibility:
      - id: charge_off_threshold
        applies_to: [loan_charged_off]
        kind: time
        condition: A loan is charged off once the current date is at least the charge-off days past due after the oldest unpaid due date.
        evidence_fields: [loans.next_due_date, loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.loan_id]
          action_bindings:
            loans.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the oldest unpaid due date
          anchor_source: loans.next_due_date
          relation: not_before
          duration_source: variants.charge_off_days_past_due
          unit: calendar_days
          counting_rule: Days past due are counted in calendar days starting the day after the oldest unpaid due date.
          boundary: inclusive
    params:
      delinquency_reporting_days_past_due: "=delinquency_reporting_days_past_due"
      charge_off_days_past_due: "=charge_off_days_past_due"
    measures: [loan_msr_days_past_due]

  - id: loan_cmb_hardship_and_benefits
    subject: [loan_terms_modified, loan_payment_schedule_updated, loan_account_status_updated, loan_interest_credit_applied]
    rule: >-
      Holding a hardship assistance plan or a Payment Protection benefit changes how the loan is serviced. When a
      hardship plan on the loan becomes active, the loan's current interest rate, installment amount, next due date and
      maturity date are set to the plan's terms; deferred installments move next_due_date and maturity_date forward by
      one month each. When a temporary plan (Short-Term Payment Deferral, Reduced Payment Plan, Temporary Rate Reduction
      Plan, Disaster Relief Deferral, Servicemember Rate Cap Benefit) ends for any reason, the rate returns to the base
      interest rate minus the AutoPay discount if AutoPay is active and the installment returns to its pre-plan amount,
      while the moved maturity date stays; a Term Extension Modification is permanent. Payments credited toward a plan
      installment count as installments paid on time when the plan installment is paid in full. While a hardship plan on the loan is in requested, offered or active status, the loan cannot be refinanced and its due day cannot be changed.
      A Payment Protection benefit paid to the loan posts as a payment of type protection_benefit and is applied like any
      other payment. When a Servicemember Rate Cap Benefit is applied, the interest paid since the military service start
      date above the capped rate is credited to principal as one interest credit (scra_benefit); interest charged because
      of a Larkspur error is credited the same way (lender_error). An interest credit never pays out cash. A plan that sets its own rate (plan_interest_rate not empty) replaces the AutoPay-discounted rate while it
      is active; a plan that does not set a rate leaves the AutoPay-discounted rate in place.
    eligibility: []
    params:
      temporary_programs: [Short-Term Payment Deferral, Reduced Payment Plan, Temporary Rate Reduction Plan, Disaster Relief Deferral, Servicemember Rate Cap Benefit]

# ============================================================================
# extended_policies: the multi-factor calculation policies of personal_loan_servicing
# ============================================================================
extended_policies:
  - id: loan_ext_refi_payoff_quote
    base_policy_refs: [loan_evt_payoff_quote, loan_evt_refinance, loan_evt_autopay, loan_evt_payment_application]
    overwrite:
      - base_policy: loan_evt_payoff_quote
        superseded_clause: >-
          The good-through date is the quote date plus payoff_quote_validity_days calendar days.
        replaced_by: >-
          For a refinance-purpose quote this policy issues, and only for such a quote, the good-through date is the quote date plus the quote window set below; every other payoff quote, a refinance-purpose quote this policy does not issue included, stays good through the quote date plus payoff_quote_validity_days calendar days.
      - base_policy: loan_evt_payoff_quote
        superseded_clause: >-
          The quoted principal is the unpaid principal on the quote date, the unpaid fees are fees_balance on the quote date, and the accrued interest is simple interest on that principal at the current interest rate for the days from interest_paid_through_date through the good-through date (good-through date minus paid-through date), actual/365, rounded to the cent.
        replaced_by: >-
          For a refinance-purpose quote this policy issues, and only for such a quote, the quoted interest runs over the interest days and at the day rates set below; every other payoff quote, a refinance-purpose quote this policy does not issue included, accrues simple interest on the unpaid principal at the current interest rate from the interest paid-through date through its good-through date, actual/365, rounded to the cent, and carries the unpaid fees on the quote date.
      - base_policy: loan_evt_payoff_quote
        superseded_clause: >-
          The payoff amount is principal plus accrued interest plus unpaid fees.
        replaced_by: >-
          For a refinance-purpose quote this policy issues, and only for such a quote, the payoff amount also carries any amount added back for a payment still on hold as set below; every other payoff quote, a refinance-purpose quote this policy does not issue included, is principal plus accrued interest plus unpaid fees.
    trigger: on_request
    subject: [loan_payoff_quote_issued]
    computes: payoff_amount
    target_tool: issue_payoff_quote_88f1b45e
    params:
      hold_days_after_return: 10
      hold_days_standard: 5
      cushion_days_repeat: 3
      cushion_days_single: 1
    rule: >-
      A refinance-purpose payoff quote states the single amount that retires a loan when the payoff transfer from a
      Larkspur refinance loan arrives by the quote's good-through date; it is issued only for a loan in active status,
      at most one per loan for the same quote date, and it does not change the loan. This policy issues the
      refinance-purpose quote of a loan whose interest paid-through date is fewer than two whole calendar months (whole
      calendar months being the difference in calendar months, less one when the later date's day of the month is
      smaller than the earlier date's) before the quote date, whose AutoPay record shows at most one enrollment and at
      most one cancellation dated fewer than two whole calendar months before the quote date, and which has at most one
      payment of type additional_principal posted fewer than one whole calendar month before the quote date; a
      refinance-purpose quote on any other loan, one with a longer or busier recent record, is issued as an ordinary
      payoff quote under loan_evt_payoff_quote. For a refinance-purpose quote this policy issues, and only for such a
      quote, the good-through date is the quote date plus the quote window set below; every other payoff quote, a
      refinance-purpose quote this policy does not issue included, stays good through the quote date plus
      payoff_quote_validity_days calendar days. For a refinance-purpose quote this policy issues, and only for such a
      quote, the quoted interest runs over the interest days and at the day rates set below; every other payoff quote, a
      refinance-purpose quote this policy does not issue included, accrues simple interest on the unpaid principal at
      the current interest rate from the interest paid-through date through its good-through date, actual/365, rounded
      to the cent, and carries the unpaid fees on the quote date. For a refinance-purpose quote this policy issues, and
      only for such a quote, the payoff amount also carries any amount added back for a payment still on hold as set
      below; every other payoff quote, a refinance-purpose quote this policy does not issue included, is principal plus
      accrued interest plus unpaid fees. The quoted principal is the unpaid principal on the quote date. The quote
      window is the grade's payoff quote validity days, and the good-through date is the quote date plus the quote
      window. The quoted interest is simple interest on the quoted principal at the current interest rate, actual/365,
      for the interest days, which are the days from the interest paid-through date to the quote date (quote date minus
      paid-through date) plus the quote window, rounded to the cent. The payoff amount is the quoted principal plus the
      quoted interest plus the unpaid fees on the quote date. Each rule that follows changes only the one quantity it
      names, and the quoted interest is worked out once, on the total interest days and the rate each of those days
      carries, and rounded to the cent only at that point; an amount added back for a payment on hold is added to the
      payoff amount after the quoted interest is worked out and earns no quoted interest. A refinance-purpose payoff
      quote is issued only on a loan with unpaid principal, so its payoff amount is always above 0.00 and the quote is
      recorded in every case; a loan with no unpaid principal is not quoted. The quote window of a refinance-purpose
      quote follows the loan's next due date and its AutoPay: when AutoPay is on and the next due date falls 2 to
      payoff_quote_validity_days days after the quote date, the window ends the day before the next due date, when the
      AutoPay debit would otherwise take that installment, so the window is the days from the quote date to the next due
      date (a count of days between two dates being the later date minus the earlier) less one; when AutoPay is off and
      the next due date falls 1 to payoff_quote_validity_days days after the quote date, the window runs to the last day
      of that installment's late-fee grace period, so the window is the days from the quote date to the next due date
      plus the grade's late-fee grace days; in every other case the window is payoff_quote_validity_days days. The rate
      each interest day carries is the rate in force that day, read from the loan's latest AutoPay enrollment and latest
      AutoPay cancellation (when both fall on the same date the enrollment is the later record): when only the latest
      cancellation is dated after the interest paid-through date, the days from the paid-through date to the
      cancellation date (a count of days between two dates being the later date minus the earlier) carry the current
      interest rate less the grade's AutoPay discount; when only the latest enrollment is dated after the paid-through
      date, the days from the paid-through date to the enrollment date carry the current interest rate plus the grade's
      AutoPay discount; when both are dated after the paid-through date and the cancellation is the earlier record, the
      days from the cancellation date to the enrollment date carry the current interest rate plus the grade's AutoPay
      discount; when both are dated after the paid-through date and the enrollment is the earlier record, the days from
      the enrollment date to the cancellation date carry the current interest rate less the grade's AutoPay discount;
      every other interest day carries the current interest rate. An additional-principal payment that could still come
      back is held on the quote, looking at the latest payment of type additional_principal on the loan (on a tie of
      dates, the first one recorded): when that payment was made by online ACH, has not been returned, and a payment on
      the loan was returned fewer than 12 whole calendar months (whole calendar months being the difference in calendar
      months, less one when the later date's day of the month is smaller than the earlier date's) before the quote date,
      its hold runs hold_days_after_return days; when that payment was made by online ACH, has not been returned, and no
      payment on the loan was returned in those 12 months, its hold runs hold_days_standard days; when that payment was
      not made by online ACH, has already been returned (its return has already restored it to the loan), or there is
      none, nothing is held. A payment on hold, one whose effective date is fewer days before the quote date (a count of
      days between two dates being the later date minus the earlier) than its hold runs, has its whole amount added back
      to the payoff amount. Repeated refinance quotes carry a funding cushion of extra interest days, counting the
      refinance-purpose quotes already issued on the loan fewer than one whole calendar month (whole calendar months
      being the difference in calendar months, less one when the later date's day of the month is smaller than the
      earlier date's) before the quote date (quotes for any other purpose are not counted): two or more such quotes add
      cushion_days_repeat interest days; exactly one adds cushion_days_single interest day; none adds no day. Cushion
      days carry the current interest rate.
    prerequisite: []
    cross_category: []
    compute:
      - q_principal: "F('principal_balance')"
      - q_fees: "F('fees_balance')"
      - q_rate: "F('current_interest_rate')"
      - q_days_to_date: "DAYS(F('interest_paid_through_date'), NOW)"
      - q_days_to_next_due: "DAYS(NOW, F('next_due_date'))"
      - q_window_days: "(q_days_to_next_due - 1) if (F('autopay_enrolled') == True and q_days_to_next_due >= 2 and q_days_to_next_due <= P('payoff_quote_validity_days')) else ((q_days_to_next_due + P('late_fee_grace_days')) if (F('autopay_enrolled') != True and q_days_to_next_due >= 1 and q_days_to_next_due <= P('payoff_quote_validity_days')) else P('payoff_quote_validity_days'))"
      - q_last_enroll: "LATEST('loan_servicing_events', 'event_date', date_field='event_date', event_type='loan_autopay_enrolled')"
      - q_last_cancel: "LATEST('loan_servicing_events', 'event_date', date_field='event_date', event_type='loan_autopay_cancelled')"
      - q_cancel_after: "q_last_cancel != None and q_last_cancel > F('interest_paid_through_date')"
      - q_enroll_after: "q_last_enroll != None and q_last_enroll > F('interest_paid_through_date')"
      - q_rate_adjust: "((P('autopay_discount_percent') * DAYS(q_last_cancel, q_last_enroll)) if q_last_cancel <= q_last_enroll else (0 - P('autopay_discount_percent') * DAYS(q_last_enroll, q_last_cancel))) if (q_cancel_after and q_enroll_after) else ((0 - P('autopay_discount_percent') * DAYS(F('interest_paid_through_date'), q_last_cancel)) if q_cancel_after else ((P('autopay_discount_percent') * DAYS(F('interest_paid_through_date'), q_last_enroll)) if q_enroll_after else 0))"
      - q_returns_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned')"
      - q_extra_channel: "LATEST('loan_transactions', 'payment_channel', date_field='txn_date', event_type='loan_payment_posted', payment_type='additional_principal')"
      - q_extra_date: "LATEST('loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_payment_posted', payment_type='additional_principal')"
      - q_extra_amount: "LATEST('loan_transactions', 'amount', date_field='txn_date', event_type='loan_payment_posted', payment_type='additional_principal')"
      - q_extra_id: "LATEST('loan_transactions', 'loan_txn_id', date_field='txn_date', event_type='loan_payment_posted', payment_type='additional_principal')"
      - q_extra_returned: "COUNT('loan_transactions', date_field='txn_date', event_type='loan_payment_returned', related_txn_id=q_extra_id)"
      - q_held_amount: "((q_extra_amount if DAYS(q_extra_date, NOW) < K('hold_days_after_return') else 0) if (q_returns_12m > 0 and q_extra_channel == 'online_ach' and q_extra_returned == 0) else ((q_extra_amount if DAYS(q_extra_date, NOW) < K('hold_days_standard') else 0) if (q_returns_12m == 0 and q_extra_channel == 'online_ach' and q_extra_returned == 0) else 0))"
      - q_requotes: "COUNT('loan_payoff_quotes', within_months=1, date_field='quote_date', quote_purpose='refinance')"
      - q_cushion_days: "K('cushion_days_repeat') if q_requotes >= 2 else (K('cushion_days_single') if q_requotes == 1 else 0)"
      - q_interest_days: "q_days_to_date + q_window_days + q_cushion_days"
      - q_interest: "RND(q_principal * (q_rate * q_interest_days + q_rate_adjust) / 100 / 365, 2)"
      - q_pt_recent: "MONTHS(F('interest_paid_through_date'), NOW) < 2"
      - q_enroll_2m: "COUNT('loan_servicing_events', within_months=2, date_field='event_date', event_type='loan_autopay_enrolled')"
      - q_cancel_2m: "COUNT('loan_servicing_events', within_months=2, date_field='event_date', event_type='loan_autopay_cancelled')"
      - q_extra_1m: "COUNT('loan_transactions', within_months=1, date_field='txn_date', event_type='loan_payment_posted', payment_type='additional_principal')"
      - q_issued: "q_pt_recent and q_enroll_2m <= 1 and q_cancel_2m <= 1 and q_extra_1m <= 1"
      - q_ordinary_interest: "RND(q_principal * q_rate * (q_days_to_date + P('payoff_quote_validity_days')) / 100 / 365, 2)"
      - result: "RND(q_principal + q_interest + q_fees + q_held_amount, 2) if q_issued else RND(q_principal + q_ordinary_interest + q_fees, 2)"
    compute_basis:
      q_principal: "The quoted principal is the unpaid principal on the quote date."
      q_fees: "The payoff amount is the quoted principal plus the quoted interest plus the unpaid fees on the quote date."
      q_rate: "The quoted interest is simple interest on the quoted principal at the current interest rate, actual/365, for the interest days"
      q_days_to_date: "which are the days from the interest paid-through date to the quote date (quote date minus paid-through date) plus the quote window"
      q_days_to_next_due: "The quote window of a refinance-purpose quote follows the loan's next due date and its AutoPay"
      q_window_days: "when AutoPay is on and the next due date falls 2 to payoff_quote_validity_days days after the quote date, the window ends the day before the next due date, when the AutoPay debit would otherwise take that installment, so the window is the days from the quote date to the next due date (a count of days between two dates being the later date minus the earlier) less one; when AutoPay is off and the next due date falls 1 to payoff_quote_validity_days days after the quote date, the window runs to the last day of that installment's late-fee grace period, so the window is the days from the quote date to the next due date plus the grade's late-fee grace days; in every other case the window is payoff_quote_validity_days days."
      q_last_enroll: "The rate each interest day carries is the rate in force that day, read from the loan's latest AutoPay enrollment and latest AutoPay cancellation (when both fall on the same date the enrollment is the later record)"
      q_last_cancel: "The rate each interest day carries is the rate in force that day, read from the loan's latest AutoPay enrollment and latest AutoPay cancellation (when both fall on the same date the enrollment is the later record)"
      q_cancel_after: "when only the latest cancellation is dated after the interest paid-through date"
      q_enroll_after: "when only the latest enrollment is dated after the paid-through date"
      q_rate_adjust: "when only the latest cancellation is dated after the interest paid-through date, the days from the paid-through date to the cancellation date (a count of days between two dates being the later date minus the earlier) carry the current interest rate less the grade's AutoPay discount; when only the latest enrollment is dated after the paid-through date, the days from the paid-through date to the enrollment date carry the current interest rate plus the grade's AutoPay discount; when both are dated after the paid-through date and the cancellation is the earlier record, the days from the cancellation date to the enrollment date carry the current interest rate plus the grade's AutoPay discount; when both are dated after the paid-through date and the enrollment is the earlier record, the days from the enrollment date to the cancellation date carry the current interest rate less the grade's AutoPay discount; every other interest day carries the current interest rate."
      q_returns_12m: "a payment on the loan was returned fewer than 12 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's)"
      q_extra_channel: "looking at the latest payment of type additional_principal on the loan (on a tie of dates, the first one recorded)"
      q_extra_date: "looking at the latest payment of type additional_principal on the loan (on a tie of dates, the first one recorded)"
      q_extra_amount: "looking at the latest payment of type additional_principal on the loan (on a tie of dates, the first one recorded)"
      q_extra_id: "looking at the latest payment of type additional_principal on the loan (on a tie of dates, the first one recorded)"
      q_extra_returned: "has already been returned (its return has already restored it to the loan)"
      q_held_amount: "when that payment was made by online ACH, has not been returned, and a payment on the loan was returned fewer than 12 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the quote date, its hold runs hold_days_after_return days; when that payment was made by online ACH, has not been returned, and no payment on the loan was returned in those 12 months, its hold runs hold_days_standard days; when that payment was not made by online ACH, has already been returned (its return has already restored it to the loan), or there is none, nothing is held. A payment on hold, one whose effective date is fewer days before the quote date (a count of days between two dates being the later date minus the earlier) than its hold runs, has its whole amount added back to the payoff amount."
      q_requotes: "counting the refinance-purpose quotes already issued on the loan fewer than one whole calendar month (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the quote date (quotes for any other purpose are not counted)"
      q_cushion_days: "two or more such quotes add cushion_days_repeat interest days; exactly one adds cushion_days_single interest day; none adds no day. Cushion days carry the current interest rate."
      q_interest_days: "the quoted interest is worked out once, on the total interest days and the rate each of those days carries"
      q_interest: "and rounded to the cent only at that point"
      q_pt_recent: "whose interest paid-through date is fewer than two whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the quote date"
      q_enroll_2m: "whose AutoPay record shows at most one enrollment and at most one cancellation dated fewer than two whole calendar months before the quote date"
      q_cancel_2m: "whose AutoPay record shows at most one enrollment and at most one cancellation dated fewer than two whole calendar months before the quote date"
      q_extra_1m: "which has at most one payment of type additional_principal posted fewer than one whole calendar month before the quote date"
      q_issued: "a refinance-purpose quote on any other loan, one with a longer or busier recent record, is issued as an ordinary payoff quote under loan_evt_payoff_quote."
      q_ordinary_interest: "every other payoff quote, a refinance-purpose quote this policy does not issue included, accrues simple interest on the unpaid principal at the current interest rate from the interest paid-through date through its good-through date, actual/365, rounded to the cent"
      result: "an amount added back for a payment on hold is added to the payoff amount after the quoted interest is worked out and earns no quoted interest."
    factors:
      - id: window_anchor_rule
        effect: method
        decides: q_window_days
        bindings: [q_days_to_next_due, q_window_days]
        ladder:
          - when: "AutoPay is on and the next due date falls 2 to payoff_quote_validity_days days after the quote date"
            method: "the window ends the day before the next due date: days from the quote date to the next due date less one"
          - when: "AutoPay is off and the next due date falls 1 to payoff_quote_validity_days days after the quote date"
            method: "the window runs to the end of that installment's late-fee grace period: days to the next due date plus the grade's late-fee grace days"
          - when: "otherwise"
            method: "the window is payoff_quote_validity_days days"
        baseline:
          q_window_days: "P('payoff_quote_validity_days')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: day_rate_split
        effect: method
        decides: q_rate_adjust
        bindings: [q_last_enroll, q_last_cancel, q_cancel_after, q_enroll_after, q_rate_adjust]
        ladder:
          - when: "only the latest AutoPay cancellation is dated after the interest paid-through date"
            method: "days from the paid-through date to the cancellation carry the current rate less the grade's AutoPay discount; later days carry the current rate"
          - when: "only the latest AutoPay enrollment is dated after the interest paid-through date"
            method: "days from the paid-through date to the enrollment carry the current rate plus the grade's AutoPay discount; later days carry the current rate"
          - when: "both are dated after the interest paid-through date and the cancellation is the earlier record"
            method: "days from the cancellation to the enrollment carry the current rate plus the grade's AutoPay discount; every other day carries the current rate"
          - when: "both are dated after the interest paid-through date and the enrollment is the earlier record"
            method: "days from the enrollment to the cancellation carry the current rate less the grade's AutoPay discount; every other day carries the current rate"
          - when: "otherwise"
            method: "every interest day carries the current rate"
        baseline:
          q_rate_adjust: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: uncleared_payment_hold
        effect: parameter
        decides: q_held_amount
        bindings: [q_returns_12m, q_extra_channel, q_extra_date, q_extra_amount, q_extra_id, q_extra_returned, q_held_amount]
        ladder:
          - when: "the latest additional-principal payment was made by online ACH, has not been returned, and a payment on the loan was returned fewer than 12 whole months before the quote date"
            value: "K('hold_days_after_return')"
          - when: "the latest additional-principal payment was made by online ACH, has not been returned, and no payment on the loan was returned in those 12 months"
            value: "K('hold_days_standard')"
          - when: "otherwise"
            value: "no hold (nothing added back)"
        baseline:
          q_held_amount: "0"
        evidence: [history]
        cross_difficulty: null
      - id: requote_cushion
        effect: parameter
        decides: q_cushion_days
        bindings: [q_requotes, q_cushion_days]
        ladder:
          - when: "two or more refinance-purpose quotes issued on the loan in the month before the quote date"
            value: "K('cushion_days_repeat')"
          - when: "exactly one such quote"
            value: "K('cushion_days_single')"
          - when: "otherwise"
            value: "0"
        baseline:
          q_cushion_days: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The quoted principal is the unpaid principal on the quote date. The quote window is the grade's payoff quote
        validity days, and the good-through date is the quote date plus the quote window. The quoted interest is simple
        interest on the quoted principal at the current interest rate, actual/365, for the interest days, which are the
        days from the interest paid-through date to the quote date (quote date minus paid-through date) plus the quote
        window, rounded to the cent. The payoff amount is the quoted principal plus the quoted interest plus the unpaid fees on the quote date.
      params: [payoff_quote_validity_days]
    inputs:
      history:
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_returned}}
        - {table: loan_transactions, aggregate: latest, field: amount, filters: {event_type: loan_payment_posted, payment_type: additional_principal}}
        - {table: loan_servicing_events, aggregate: latest, field: event_date, filters: {event_type: loan_autopay_cancelled}}
        - {table: loan_payoff_quotes, aggregate: count, field: payoff_quote_id, within_months: 1, filters: {quote_purpose: refinance}}
      cross_category: []

  - id: loan_ext_refi_application
    base_policy_refs: [loan_agg_multi_holding, loan_agg_combined_exposure, loan_application_underwriting, loan_evt_refinance, loan_pricing_and_disbursement]
    overwrite:
      - base_policy: loan_pricing_and_disbursement
        superseded_clause: >-
          The origination fee is the grade's origination fee percent of the amount financed, rounded to the cent; on a refinance loan (loan purpose refinance_existing_loan) that percent is first reduced by the grade's refinance origination fee reduction, never below zero.
        replaced_by: >-
          For a refinance application this policy sizes, and only for such an application, the origination fee percent and the amount it is charged on are the ones set below; every other loan's origination fee is the grade's origination fee percent of the amount financed, rounded to the cent, first reduced on a refinance loan by the grade's refinance origination fee reduction, never below zero.
      - base_policy: loan_evt_refinance
        superseded_clause: >-
          The new loan is underwritten, priced and capped like any new loan (its own grade, the reduced refinance origination fee, the combined principal cap without the old loan's principal), and its net proceeds must cover the payoff amount of a refinance-purpose payoff quote good through the expected funding date; otherwise the application is approved only if the borrower raises the requested amount within the grade's limits.
        replaced_by: >-
          For a refinance application this policy sizes, and only for such an application, the refinance origination fee is the one set below; the new loan is otherwise underwritten, priced and capped like any new loan (its own grade, the combined principal cap without the old loan's principal), its net proceeds must cover the payoff amount of a refinance-purpose payoff quote good through the expected funding date, and otherwise the application is approved only if the borrower raises the requested amount within the grade's limits.
      - base_policy: loan_pricing_and_disbursement
        superseded_clause: >-
          The fee is withheld from the loan amount, so net proceeds equal the amount financed minus the fee, and interest accrues on the full amount financed.
        replaced_by: >-
          For a refinance application this policy sizes, and only for such an application, the fee is withheld from the amount financed or charged on the payoff to be covered and added on top as the sizing form sets below; every other loan's fee is withheld from the loan amount, so net proceeds equal the amount financed minus the fee, and on every loan interest accrues on the full amount financed.
    trigger: on_request
    subject: [loan_application_submitted]
    computes: amount_financed
    target_tool: submit_refinance_application_9ec5cb64
    params:
      term_credit_long: 0.5
      term_credit_mid: 0.25
      loyalty_credit_full: 0.5
      loyalty_credit_partial: 0.25
      autopay_credit_full: 0.25
      autopay_credit_partial: 0.1
      flexline_credit_full: 0.5
      flexline_credit_partial: 0.25
      builder_credit_matured: 0.25
      builder_credit_active: 0.1
    rule: >-
      An existing borrower may replace an active Larkspur loan with a Larkspur refinance loan whose proceeds pay the old
      loan off. The refinance application is the borrower's own consent and is submitted by the borrower personally; it
      names the loan being refinanced, is prequalified at that loan's grade, carries the state of residence on the
      borrower's profile and the term the borrower chooses from the grade's available terms, and requests the amount
      financed set below. The amount financed on a refinance application is fixed only after the loan being refinanced
      carries a refinance-purpose payoff quote dated on the application date. For a refinance application this policy
      sizes, and only for such an application, the origination fee percent and the amount it is charged on are the ones
      set below; every other loan's origination fee is the grade's origination fee percent of the amount financed,
      rounded to the cent, first reduced on a refinance loan by the grade's refinance origination fee reduction, never
      below zero. For a refinance application this policy sizes, and only for such an application, the refinance
      origination fee is the one set below; the new loan is otherwise underwritten, priced and capped like any new loan
      (its own grade, the combined principal cap without the old loan's principal), its net proceeds must cover the
      payoff amount of a refinance-purpose payoff quote good through the expected funding date, and otherwise the
      application is approved only if the borrower raises the requested amount within the grade's limits. For a
      refinance application this policy sizes, and only for such an application, the fee is withheld from the amount
      financed or charged on the payoff to be covered and added on top as the sizing form sets below; every other loan's
      fee is withheld from the loan amount, so net proceeds equal the amount financed minus the fee, and on every loan
      interest accrues on the full amount financed. The payoff to be covered is the payoff amount of the
      refinance-purpose payoff quote on the loan being refinanced dated on the application date. The refinance fee
      percent is the grade's origination fee percent less the grade's refinance origination fee reduction, never below
      zero. The origination fee is withheld from the amount financed, so the amount financed is the payoff to be covered
      divided by one minus the refinance fee percent over 100. That amount is rounded to the cent and then rounded up to
      a whole dollar (an amount already in whole dollars is kept as it is). Each rule that follows changes only the one
      quantity it names: the grade's reduction and every credit come off the grade's origination fee percent together,
      the refinance fee percent never going below zero, and the sizing form set below is then applied to that refinance
      fee percent before the cent and whole-dollar rounding. The amount financed is never below the payoff to be
      covered, so it is always above 0.00 and the application is recorded in every case that reaches sizing; a loan with
      no unpaid principal is not quoted and so is never sized. The sizing form follows whether the loan being refinanced
      was itself funded as a Larkspur refinance loan and how many whole calendar months (whole calendar months being the
      difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's)
      before the application date it was funded: a loan itself funded as a refinance fewer than 12 whole months before
      is not charged an origination fee again on money that only retires it, so the amount financed is the payoff to be
      covered; a loan itself funded as a refinance 12 to 23 whole months before is charged the fee on the payoff to be
      covered only, added on top rather than withheld, so the amount financed is the payoff to be covered times one plus
      the refinance fee percent over 100; any other loan is sized with the fee withheld from the amount financed. A
      remaining-term credit comes off the fee percent, counting the installments still to run on the loan being
      refinanced from its next due date through its maturity date with both dates counted: more than 24 remaining earn
      term_credit_long point; 13 to 24 remaining earn term_credit_mid point; 12 or fewer remaining earn no
      remaining-term credit. A payment-record credit comes off the fee percent, where the installment payments counted
      are the payments of type scheduled_installment posted on the loan less one for every payment returned on it,
      whatever it was for: 12 or more counted installment payments with no late fee charged on the loan fewer than 24
      whole months (whole calendar months being the difference in calendar months, less one when the later date's day of
      the month is smaller than the earlier date's) before the application date earn loyalty_credit_full point; 6 to 11
      counted installment payments with no such late fee earn loyalty_credit_partial point; any other loan earns no
      payment-record credit. An AutoPay credit comes off the fee percent, counting the AutoPay debits posted on the loan
      fewer than 12 whole months (whole calendar months being the difference in calendar months, less one when the later
      date's day of the month is smaller than the earlier date's) before the application date: 12 or more such debits
      with no AutoPay debit returned in those months earn autopay_credit_full point; 6 to 11 such debits with none
      returned earn autopay_credit_partial point; any other loan earns no AutoPay credit. An AutoPay debit is any
      payment AutoPay took on the loan, a hardship plan payment included, and an AutoPay debit returned is a return of
      such a payment. A FlexLine credit comes off the fee percent (a borrower holds at most one open FlexLine): a
      FlexLine of the borrower in active status opened 12 or more whole months (whole calendar months being the
      difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's)
      before the application date, with no FlexLine late fee charged fewer than 12 whole months before it, earns
      flexline_credit_full point; a FlexLine in active status opened fewer than 12 whole months before, with no such
      late fee, earns flexline_credit_partial point; a borrower with neither earns no FlexLine credit. A Credit Builder
      credit comes off the fee percent: a Credit Builder account of the borrower that reached matured status earns
      builder_credit_matured point; with no matured account, a Credit Builder account in active status with an amount
      past due of 0.00 earns builder_credit_active point; a borrower with neither earns no Credit Builder credit. Any
      one account meeting a tier's terms is enough for that tier. A borrower holds at most one Credit Builder account in
      active status, and its amount past due is compared as an amount, so 0, 0.0 and 0.00 are all nothing past due.
    prerequisite:
      - problem: loan_ext_refi_payoff_quote
        kind: value_input
        gate: r_payoff
        form: state
        policy_source: >-
          The amount financed on a refinance application is fixed only after the loan being refinanced carries a refinance-purpose payoff quote dated on the application date.
        condition: >-
          loan_payoff_quotes holds a row for the loan being refinanced with quote_purpose refinance and quote_date equal to the application date.
        resolved_by: issue_payoff_quote_88f1b45e
        effect: >-
          Once the refinance-purpose quote dated on the application date is recorded, the payoff to be covered is that quote's payoff amount, which the amount financed is sized from.
    cross_category:
      - category: line
        as: history
        reads: [status, open_date, line_transactions.event_type, line_transactions.txn_date]
        note: The FlexLine credit is decided from the borrower's active FlexLine's open date and its late fees in the last 12 months.
      - category: builder
        as: branch
        reads: [status, closed_date, amount_past_due]
        note: The Credit Builder credit is decided from a matured Credit Builder account, or an active one with nothing past due.
    compute:
      - r_payoff: "LATEST('loan_payoff_quotes', 'payoff_amount', date_field='quote_date', quote_purpose='refinance', quote_date=NOW)"
      - r_grade_fee: "P('origination_fee_percent')"
      - r_refi_age: "MONTHS(F('funding_date'), NOW)"
      - r_fee_form: "1 if (F('loan_purpose') == 'refinance_existing_loan' and r_refi_age < 12) else (2 if (F('loan_purpose') == 'refinance_existing_loan' and r_refi_age >= 12 and r_refi_age < 24) else 3)"
      - r_remaining: "MONTHS(F('next_due_date'), F('maturity_date')) + 1"
      - r_reduction: "P('refinance_origination_fee_reduction_percent')"
      - r_term_credit: "K('term_credit_long') if r_remaining > 24 else (K('term_credit_mid') if r_remaining >= 13 else 0)"
      - r_installments: "COUNT('loan_transactions', date_field='txn_date', event_type='loan_payment_posted', payment_type='scheduled_installment') - COUNT('loan_transactions', date_field='txn_date', event_type='loan_payment_returned')"
      - r_late_24m: "COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - r_loyalty: "K('loyalty_credit_full') if (r_installments >= 12 and r_late_24m == 0) else (K('loyalty_credit_partial') if (r_installments >= 6 and r_installments < 12 and r_late_24m == 0) else 0)"
      - r_ap_debits_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_posted', payment_channel='autopay_ach')"
      - r_ap_returns_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned', payment_channel='autopay_ach')"
      - r_autopay: "K('autopay_credit_full') if (r_ap_debits_12m >= 12 and r_ap_returns_12m == 0) else (K('autopay_credit_partial') if (r_ap_debits_12m >= 6 and r_ap_debits_12m < 12 and r_ap_returns_12m == 0) else 0)"
      - r_line_open: "CFIELD('line', 'open_date', status='active')"
      - r_line_late_12m: "XCOUNT('line', 'line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - r_flexline: "K('flexline_credit_full') if (r_line_open != None and MONTHS(r_line_open, NOW) >= 12 and r_line_late_12m == 0) else (K('flexline_credit_partial') if (r_line_open != None and MONTHS(r_line_open, NOW) < 12 and r_line_late_12m == 0) else 0)"
      - r_builder_matured: "CFIELD('builder', 'closed_date', status='matured')"
      - r_builder_active_pd: "CFIELD('builder', 'amount_past_due', status='active')"
      - r_builder_active_current: "r_builder_active_pd != None and r_builder_active_pd == 0"
      - r_builder: "K('builder_credit_matured') if r_builder_matured != None else (K('builder_credit_active') if r_builder_active_current else 0)"
      - r_fee_pct: "MX(0, r_grade_fee - r_reduction - r_term_credit - r_loyalty - r_autopay - r_flexline - r_builder)"
      - r_needed: "RND(r_payoff if r_fee_form == 1 else (r_payoff * (1 + r_fee_pct / 100) if r_fee_form == 2 else r_payoff / (1 - r_fee_pct / 100)), 2)"
      - result: "int(r_needed) + (1 if r_needed > int(r_needed) else 0)"
    compute_basis:
      r_payoff: "The payoff to be covered is the payoff amount of the refinance-purpose payoff quote on the loan being refinanced dated on the application date."
      r_grade_fee: "The refinance fee percent is the grade's origination fee percent less the grade's refinance origination fee reduction, never below zero."
      r_refi_age: "The sizing form follows whether the loan being refinanced was itself funded as a Larkspur refinance loan and how many whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's)"
      r_fee_form: "a loan itself funded as a refinance fewer than 12 whole months before is not charged an origination fee again on money that only retires it, so the amount financed is the payoff to be covered; a loan itself funded as a refinance 12 to 23 whole months before is charged the fee on the payoff to be covered only, added on top rather than withheld, so the amount financed is the payoff to be covered times one plus the refinance fee percent over 100; any other loan is sized with the fee withheld from the amount financed."
      r_remaining: "counting the installments still to run on the loan being refinanced from its next due date through its maturity date with both dates counted"
      r_reduction: "The refinance fee percent is the grade's origination fee percent less the grade's refinance origination fee reduction, never below zero."
      r_term_credit: "more than 24 remaining earn term_credit_long point; 13 to 24 remaining earn term_credit_mid point; 12 or fewer remaining earn no remaining-term credit."
      r_installments: "where the installment payments counted are the payments of type scheduled_installment posted on the loan less one for every payment returned on it, whatever it was for"
      r_late_24m: "with no late fee charged on the loan fewer than 24 whole months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the application date"
      r_loyalty: "12 or more counted installment payments with no late fee charged on the loan fewer than 24 whole months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the application date earn loyalty_credit_full point; 6 to 11 counted installment payments with no such late fee earn loyalty_credit_partial point; any other loan earns no payment-record credit."
      r_ap_debits_12m: "counting the AutoPay debits posted on the loan fewer than 12 whole months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the application date"
      r_ap_returns_12m: "with no AutoPay debit returned in those months"
      r_autopay: "12 or more such debits with no AutoPay debit returned in those months earn autopay_credit_full point; 6 to 11 such debits with none returned earn autopay_credit_partial point; any other loan earns no AutoPay credit."
      r_line_open: "a FlexLine of the borrower in active status opened 12 or more whole months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the application date"
      r_line_late_12m: "with no FlexLine late fee charged fewer than 12 whole months before it"
      r_flexline: "a FlexLine of the borrower in active status opened 12 or more whole months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the application date, with no FlexLine late fee charged fewer than 12 whole months before it, earns flexline_credit_full point; a FlexLine in active status opened fewer than 12 whole months before, with no such late fee, earns flexline_credit_partial point; a borrower with neither earns no FlexLine credit."
      r_builder_matured: "a Credit Builder account of the borrower that reached matured status earns builder_credit_matured point"
      r_builder_active_pd: "A borrower holds at most one Credit Builder account in active status"
      r_builder_active_current: "its amount past due is compared as an amount, so 0, 0.0 and 0.00 are all nothing past due."
      r_builder: "a Credit Builder account of the borrower that reached matured status earns builder_credit_matured point; with no matured account, a Credit Builder account in active status with an amount past due of 0.00 earns builder_credit_active point; a borrower with neither earns no Credit Builder credit."
      r_fee_pct: "the grade's reduction and every credit come off the grade's origination fee percent together, the refinance fee percent never going below zero"
      r_needed: "and the sizing form set below is then applied to that refinance fee percent before the cent and whole-dollar rounding."
      result: "That amount is rounded to the cent and then rounded up to a whole dollar (an amount already in whole dollars is kept as it is)."
    factors:
      - id: refi_sizing_form
        effect: method
        decides: r_fee_form
        bindings: [r_refi_age, r_fee_form]
        ladder:
          - when: "the loan being refinanced was itself funded as a refinance fewer than 12 whole months before the application date"
            method: "no fee on money that only retires it: the amount financed is the payoff to be covered"
          - when: "the loan being refinanced was itself funded as a refinance 12 to 23 whole months before the application date"
            method: "fee on the payoff only, added on top: payoff times one plus the refinance fee percent over 100"
          - when: "otherwise"
            method: "fee withheld from the amount financed: payoff divided by one minus the refinance fee percent over 100"
        baseline:
          r_fee_form: "3"
        evidence: [date, history]
        cross_difficulty: null
      - id: remaining_term_credit
        effect: parameter
        decides: r_term_credit
        bindings: [r_remaining, r_term_credit]
        ladder:
          - when: "more than 24 installments remain from the next due date through the maturity date"
            value: "K('term_credit_long')"
          - when: "13 to 24 installments remain"
            value: "K('term_credit_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_term_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: payment_record_credit
        effect: parameter
        decides: r_loyalty
        bindings: [r_installments, r_late_24m, r_loyalty]
        ladder:
          - when: "12 or more counted installment payments and no late fee on the loan in the 24 months before the application date"
            value: "K('loyalty_credit_full')"
          - when: "6 to 11 counted installment payments and no late fee on the loan in those 24 months"
            value: "K('loyalty_credit_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_loyalty: "0"
        evidence: [history]
        cross_difficulty: null
      - id: autopay_record_credit
        effect: parameter
        decides: r_autopay
        bindings: [r_ap_debits_12m, r_ap_returns_12m, r_autopay]
        ladder:
          - when: "12 or more AutoPay debits in the 12 months before the application date and none returned"
            value: "K('autopay_credit_full')"
          - when: "6 to 11 such AutoPay debits and none returned"
            value: "K('autopay_credit_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_autopay: "0"
        evidence: [history]
        cross_difficulty: null
      - id: flexline_standing_credit
        effect: parameter
        decides: r_flexline
        bindings: [r_line_open, r_line_late_12m, r_flexline]
        ladder:
          - when: "an active FlexLine opened 12 or more whole months before the application date and no FlexLine late fee in the 12 months before it"
            value: "K('flexline_credit_full')"
          - when: "an active FlexLine opened fewer than 12 whole months before and no FlexLine late fee in those 12 months"
            value: "K('flexline_credit_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_flexline: "0"
        evidence: [cross_category, date, history]
        cross_difficulty: line
      - id: credit_builder_credit
        effect: parameter
        decides: r_builder
        bindings: [r_builder_matured, r_builder_active_pd, r_builder_active_current, r_builder]
        ladder:
          - when: "a Credit Builder account of the borrower reached matured status"
            value: "K('builder_credit_matured')"
          - when: "no matured account, and a Credit Builder account in active status with an amount past due of 0.00"
            value: "K('builder_credit_active')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_builder: "0"
        evidence: [cross_category]
        cross_difficulty: builder
    baseline:
      rule: >-
        The payoff to be covered is the payoff amount of the refinance-purpose payoff quote on the loan being refinanced
        dated on the application date. The refinance fee percent is the grade's origination fee percent less the
        grade's refinance origination fee reduction, never below zero. The origination fee is withheld from the amount
        financed, so the amount financed is the payoff to be covered divided by one minus the refinance fee percent over
        100. That amount is rounded to the cent and then rounded up to a whole dollar (an amount already in whole dollars is kept as it is).
      params: [origination_fee_percent, refinance_origination_fee_reduction_percent]
    inputs:
      history:
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, filters: {event_type: loan_payment_posted, payment_type: scheduled_installment}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 24, filters: {event_type: loan_late_fee_assessed}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_posted, payment_channel: autopay_ach}}
        - {table: loan_payoff_quotes, aggregate: latest, field: payoff_amount, filters: {quote_purpose: refinance}}
        - {category: line, table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_late_fee_assessed}}
      cross_category: [line, builder]

  - id: loan_ext_late_fee
    base_policy_refs: [loan_evt_late_fee, loan_evt_returned_payment]
    overwrite:
      - base_policy: loan_evt_late_fee
        superseded_clause: >-
          schedule_a charges late_fee_schedule_a_percent of the unpaid portion but not less than late_fee_schedule_a_min_usd and not more than late_fee_schedule_a_max_usd; schedule_b charges late_fee_schedule_b_percent of the unpaid portion but not more than late_fee_schedule_b_max_usd; schedule_c charges late_fee_schedule_c_flat_usd.
        replaced_by: >-
          For a late fee this policy assesses, and only for such a fee, the late-fee figure is worked out as below, set from the schedule figure by the pay-cycle form on schedule_a and schedule_b and as the flat amount on schedule_c, and then reduced by the late-fee shares set below; schedule_a otherwise charges late_fee_schedule_a_percent of the unpaid portion but not less than late_fee_schedule_a_min_usd and not more than late_fee_schedule_a_max_usd, schedule_b late_fee_schedule_b_percent of the unpaid portion but not more than late_fee_schedule_b_max_usd, and schedule_c late_fee_schedule_c_flat_usd.
    trigger: state_due
    subject: [loan_late_fee_assessed]
    computes: amount
    target_tool: assess_late_fee_8eb98004
    params:
      late_fee_first_late_share_full: 0.8
      late_fee_first_late_share_partial: 0.9
      late_fee_modification_share_recent: 0.9
      late_fee_modification_share_older: 0.95
      late_fee_autopay_share_long: 0.95
      late_fee_autopay_share_mid: 0.97
      late_fee_tenure_share_long: 0.95
      late_fee_tenure_share_mid: 0.97
      pay_cycle_window_days: 15
      previous_cycle_window_days: 45
    rule: >-
      A late fee is charged on an installment of an active loan that is still not paid in full when its grace period
      ends, at most one per installment, and is assessed on the oldest unpaid installment (the loan's next due date)
      once the current date is later than that due date plus the late-fee grace period; no late fee is charged for an
      installment inside an active hardship plan, for a deferred installment or while a Servicemember Rate Cap Benefit
      is active. For a late fee this policy assesses, and only for such a fee, the late-fee figure is worked out as
      below, set from the schedule figure by the pay-cycle form on schedule_a and schedule_b and as the flat amount on
      schedule_c, and then reduced by the late-fee shares set below; schedule_a otherwise charges
      late_fee_schedule_a_percent of the unpaid portion but not less than late_fee_schedule_a_min_usd and not more than
      late_fee_schedule_a_max_usd, schedule_b late_fee_schedule_b_percent of the unpaid portion but not more than
      late_fee_schedule_b_max_usd, and schedule_c late_fee_schedule_c_flat_usd. The unpaid portion is the scheduled
      installment amount or the amount past due, whichever is smaller. The loan's fee schedule is fixed by its
      origination state: CA, CO, CT, MA, ME, MN, NY and VT use schedule_b, MD, NC and WI use schedule_c, and every other
      state uses schedule_a. The late fee is the schedule's percent of the unpaid portion, not less than the schedule's
      minimum and not more than its maximum (schedule_b has no minimum and schedule_c is its flat amount), never more
      than the unpaid portion itself, rounded to the cent. Each rule that follows changes only the one quantity it
      names: the pay-cycle form sets the late-fee figure of a schedule_a or schedule_b loan from the schedule figure,
      every late-fee share that applies multiplies that figure, the shares being multiplied together on the unrounded
      figure, and the result is held to no more than the unpaid portion and rounded to the cent once, at the end. A late
      fee that works out to 0.00 is not charged: no late-fee line is written for that installment, and it is not counted
      as a late fee charged on the loan. The pay-cycle form applies only to a loan on schedule_a or schedule_b; a loan
      on schedule_c takes no pay-cycle form, and its late-fee figure is its flat amount, late_fee_schedule_c_flat_usd,
      whatever the borrower's FlexLine shows. For a loan on schedule_a or schedule_b the form looks at the borrower's
      latest FlexLine late fee (on a tie of dates, the first one recorded) and the amount past due on the borrower's
      open FlexLine (active, frozen or in repayment; a borrower holds at most one): when that FlexLine late fee was
      charged for a FlexLine due date no more than pay_cycle_window_days days before or after the installment's due date
      (a count of days between two dates being the later date minus the earlier) and the open FlexLine still has an
      amount past due, the loan's own late fee is cut to the loan's part of the two amounts past due in that cycle (the
      FlexLine late fee itself is left as it stands), so the late-fee figure is the schedule figure times the unpaid
      portion divided by the unpaid portion plus the FlexLine's amount past due; when that FlexLine late fee was instead
      charged for a FlexLine due date more than pay_cycle_window_days but no more than previous_cycle_window_days days
      from the installment's due date, the loan's late fee is held so that it and that FlexLine late fee together stay
      within the maximum of the loan's own schedule, so the late-fee figure is the schedule figure or the loan's
      schedule maximum (late_fee_schedule_a_max_usd on schedule_a, late_fee_schedule_b_max_usd on schedule_b) less that
      FlexLine late fee, whichever is smaller, never below zero; in every other case the late-fee figure is the schedule
      figure. That FlexLine late fee is taken net of every FlexLine fee waiver applied to it: one waived in full counts
      as no FlexLine late fee, so the late-fee figure is the schedule figure, and one waived in part counts at its
      unwaived amount. A first-late share of the late fee applies, looking at the time fewer than 12 whole calendar
      months (whole calendar months being the difference in calendar months, less one when the later date's day of the
      month is smaller than the earlier date's) before the late fee's assessment date: no late fee charged on the loan
      in that time and 12 or more net installment payments in it (payments of type scheduled_installment posted, less
      one for every payment returned whatever it was for) give late_fee_first_late_share_full; no late fee in that time
      and fewer than 12 such payments give late_fee_first_late_share_partial; any other loan gives no late-fee share. A
      late-fee modification share applies to a loan whose Term Extension Modification was completed: completion fewer
      than 36 whole calendar months (whole calendar months being the difference in calendar months, less one when the
      later date's day of the month is smaller than the earlier date's) before the late fee's assessment date gives
      late_fee_modification_share_recent; completion 36 to 59 whole months before gives
      late_fee_modification_share_older; a loan with neither gives no late-fee share. An AutoPay-history share of the
      late fee applies, counting the AutoPay debits posted on the loan fewer than 24 whole calendar months (whole
      calendar months being the difference in calendar months, less one when the later date's day of the month is
      smaller than the earlier date's) before the late fee's assessment date less the AutoPay debits returned in those
      months: 20 or more give late_fee_autopay_share_long; 12 to 19 give late_fee_autopay_share_mid; fewer than 12 give
      no late-fee share. An AutoPay debit is any payment AutoPay took on the loan, a hardship plan payment included, and
      an AutoPay debit returned is a return of such a payment. A loan-tenure share of the late fee applies, counting
      whole calendar months (whole calendar months being the difference in calendar months, less one when the later
      date's day of the month is smaller than the earlier date's) from the loan's funding date to the late fee's
      assessment date: 48 or more give late_fee_tenure_share_long; 24 to 47 give late_fee_tenure_share_mid; fewer than
      24 give no late-fee share.
    prerequisite: []
    cross_category:
      - category: line
        as: history
        reads: [status, amount_past_due, line_transactions.event_type, line_transactions.txn_date, line_transactions.installment_due_date]
        note: The pay-cycle form is decided from the borrower's latest FlexLine late fee and the open FlexLine's amount past due.
      - category: hardship
        as: branch
        reads: [variant_name, status, closed_date]
        note: The late-fee modification share is decided from a completed Term Extension Modification on the loan.
    compute:
      - l_unpaid: "MN(F('scheduled_payment_amount'), F('amount_past_due'))"
      - l_is_b: "F('origination_state') == 'CA' or F('origination_state') == 'CO' or F('origination_state') == 'CT' or F('origination_state') == 'MA' or F('origination_state') == 'ME' or F('origination_state') == 'MN' or F('origination_state') == 'NY' or F('origination_state') == 'VT'"
      - l_is_c: "F('origination_state') == 'MD' or F('origination_state') == 'NC' or F('origination_state') == 'WI'"
      - l_pct: "P('late_fee_schedule_b_percent') if l_is_b else P('late_fee_schedule_a_percent')"
      - l_min: "0 if l_is_b else P('late_fee_schedule_a_min_usd')"
      - l_max: "P('late_fee_schedule_b_max_usd') if l_is_b else P('late_fee_schedule_a_max_usd')"
      - l_sched_fee: "P('late_fee_schedule_c_flat_usd') if l_is_c else MX(l_min, MN(l_max, l_pct * l_unpaid / 100))"
      - l_line_late_due: "XLATEST('line', 'line_transactions', 'installment_due_date', date_field='txn_date', event_type='line_late_fee_assessed')"
      - l_line_late_amount: "XLATEST('line', 'line_transactions', 'amount', date_field='txn_date', event_type='line_late_fee_assessed')"
      - l_line_late_id: "XLATEST('line', 'line_transactions', 'line_txn_id', date_field='txn_date', event_type='line_late_fee_assessed')"
      - l_line_late_waived: "XSUM('line', 'line_transactions', 'amount', event_type='line_fee_waived', related_txn_id=l_line_late_id) if l_line_late_id != None else 0"
      - l_line_late_net: "MX(0, l_line_late_amount - l_line_late_waived) if l_line_late_amount != None else 0"
      - l_line_pd_active: "CFIELD('line', 'amount_past_due', status='active')"
      - l_line_pd_frozen: "CFIELD('line', 'amount_past_due', status='frozen')"
      - l_line_pd_repay: "CFIELD('line', 'amount_past_due', status='repayment')"
      - l_line_pd: "l_line_pd_active if l_line_pd_active != None else (l_line_pd_frozen if l_line_pd_frozen != None else (l_line_pd_repay if l_line_pd_repay != None else 0))"
      - l_cycle_gap: "ABS(DAYS(l_line_late_due, F('next_due_date'))) if (l_line_late_due != None and l_line_late_net > 0) else 9999"
      - l_form_fee: "l_sched_fee if l_is_c else ((l_sched_fee * l_unpaid / (l_unpaid + l_line_pd)) if (l_cycle_gap <= K('pay_cycle_window_days') and l_line_pd > 0) else (MX(0, MN(l_sched_fee, (P('late_fee_schedule_b_max_usd') if l_is_b else P('late_fee_schedule_a_max_usd')) - l_line_late_net)) if (l_cycle_gap > K('pay_cycle_window_days') and l_cycle_gap <= K('previous_cycle_window_days')) else l_sched_fee))"
      - l_late_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - l_inst_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_posted', payment_type='scheduled_installment') - COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned')"
      - l_first_share: "K('late_fee_first_late_share_full') if (l_late_12m == 0 and l_inst_12m >= 12) else (K('late_fee_first_late_share_partial') if (l_late_12m == 0 and l_inst_12m < 12) else 1)"
      - l_tem_closed: "CFIELD('hardship', 'closed_date', variant_name='Term Extension Modification', status='completed', loan_id=HID)"
      - l_mod_share: "K('late_fee_modification_share_recent') if (l_tem_closed != None and MONTHS(l_tem_closed, NOW) < 36) else (K('late_fee_modification_share_older') if (l_tem_closed != None and MONTHS(l_tem_closed, NOW) >= 36 and MONTHS(l_tem_closed, NOW) < 60) else 1)"
      - l_ap_24m: "COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_payment_posted', payment_channel='autopay_ach') - COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_payment_returned', payment_channel='autopay_ach')"
      - l_ap_share: "K('late_fee_autopay_share_long') if l_ap_24m >= 20 else (K('late_fee_autopay_share_mid') if l_ap_24m >= 12 else 1)"
      - l_tenure: "MONTHS(F('funding_date'), NOW)"
      - l_tenure_share: "K('late_fee_tenure_share_long') if l_tenure >= 48 else (K('late_fee_tenure_share_mid') if l_tenure >= 24 else 1)"
      - result: "RND(MN(l_unpaid, l_form_fee * l_first_share * l_mod_share * l_ap_share * l_tenure_share), 2)"
    compute_basis:
      l_unpaid: "The unpaid portion is the scheduled installment amount or the amount past due, whichever is smaller."
      l_is_b: "CA, CO, CT, MA, ME, MN, NY and VT use schedule_b"
      l_is_c: "MD, NC and WI use schedule_c, and every other state uses schedule_a"
      l_pct: "The late fee is the schedule's percent of the unpaid portion"
      l_min: "not less than the schedule's minimum and not more than its maximum (schedule_b has no minimum and schedule_c is its flat amount)"
      l_max: "not less than the schedule's minimum and not more than its maximum (schedule_b has no minimum and schedule_c is its flat amount)"
      l_sched_fee: "The late fee is the schedule's percent of the unpaid portion, not less than the schedule's minimum and not more than its maximum (schedule_b has no minimum and schedule_c is its flat amount), never more than the unpaid portion itself, rounded to the cent."
      l_line_late_due: "looks at the borrower's latest FlexLine late fee (on a tie of dates, the first one recorded)"
      l_line_late_amount: "the late-fee figure is the schedule figure or the loan's schedule maximum (late_fee_schedule_a_max_usd on schedule_a, late_fee_schedule_b_max_usd on schedule_b) less that FlexLine late fee, whichever is smaller, never below zero"
      l_line_late_id: "That FlexLine late fee is taken net of every FlexLine fee waiver applied to it: one waived in full counts as no FlexLine late fee, so the late-fee figure is the schedule figure, and one waived in part counts at its unwaived amount."
      l_line_late_waived: "That FlexLine late fee is taken net of every FlexLine fee waiver applied to it: one waived in full counts as no FlexLine late fee, so the late-fee figure is the schedule figure, and one waived in part counts at its unwaived amount."
      l_line_late_net: "That FlexLine late fee is taken net of every FlexLine fee waiver applied to it: one waived in full counts as no FlexLine late fee, so the late-fee figure is the schedule figure, and one waived in part counts at its unwaived amount."
      l_line_pd_active: "the amount past due on the borrower's open FlexLine (active, frozen or in repayment; a borrower holds at most one)"
      l_line_pd_frozen: "the amount past due on the borrower's open FlexLine (active, frozen or in repayment; a borrower holds at most one)"
      l_line_pd_repay: "the amount past due on the borrower's open FlexLine (active, frozen or in repayment; a borrower holds at most one)"
      l_line_pd: "the amount past due on the borrower's open FlexLine (active, frozen or in repayment; a borrower holds at most one)"
      l_cycle_gap: "when that FlexLine late fee was charged for a FlexLine due date no more than pay_cycle_window_days days before or after the installment's due date"
      l_form_fee: "The pay-cycle form applies only to a loan on schedule_a or schedule_b; a loan on schedule_c takes no pay-cycle form, and its late-fee figure is its flat amount, late_fee_schedule_c_flat_usd, whatever the borrower's FlexLine shows. For a loan on schedule_a or schedule_b the form looks at the borrower's latest FlexLine late fee (on a tie of dates, the first one recorded) and the amount past due on the borrower's open FlexLine (active, frozen or in repayment; a borrower holds at most one): when that FlexLine late fee was charged for a FlexLine due date no more than pay_cycle_window_days days before or after the installment's due date (a count of days between two dates being the later date minus the earlier) and the open FlexLine still has an amount past due, the loan's own late fee is cut to the loan's part of the two amounts past due in that cycle (the FlexLine late fee itself is left as it stands), so the late-fee figure is the schedule figure times the unpaid portion divided by the unpaid portion plus the FlexLine's amount past due; when that FlexLine late fee was instead charged for a FlexLine due date more than pay_cycle_window_days but no more than previous_cycle_window_days days from the installment's due date, the loan's late fee is held so that it and that FlexLine late fee together stay within the maximum of the loan's own schedule, so the late-fee figure is the schedule figure or the loan's schedule maximum (late_fee_schedule_a_max_usd on schedule_a, late_fee_schedule_b_max_usd on schedule_b) less that FlexLine late fee, whichever is smaller, never below zero; in every other case the late-fee figure is the schedule figure."
      l_late_12m: "no late fee charged on the loan in that time"
      l_inst_12m: "12 or more net installment payments in it (payments of type scheduled_installment posted, less one for every payment returned whatever it was for)"
      l_first_share: "no late fee charged on the loan in that time and 12 or more net installment payments in it (payments of type scheduled_installment posted, less one for every payment returned whatever it was for) give late_fee_first_late_share_full; no late fee in that time and fewer than 12 such payments give late_fee_first_late_share_partial; any other loan gives no late-fee share."
      l_tem_closed: "A late-fee modification share applies to a loan whose Term Extension Modification was completed"
      l_mod_share: "completion fewer than 36 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the late fee's assessment date gives late_fee_modification_share_recent; completion 36 to 59 whole months before gives late_fee_modification_share_older; a loan with neither gives no late-fee share."
      l_ap_24m: "counting the AutoPay debits posted on the loan fewer than 24 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the late fee's assessment date less the AutoPay debits returned in those months"
      l_ap_share: "20 or more give late_fee_autopay_share_long; 12 to 19 give late_fee_autopay_share_mid; fewer than 12 give no late-fee share."
      l_tenure: "counting whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) from the loan's funding date to the late fee's assessment date"
      l_tenure_share: "48 or more give late_fee_tenure_share_long; 24 to 47 give late_fee_tenure_share_mid; fewer than 24 give no late-fee share."
      result: "every late-fee share that applies multiplies that figure, the shares being multiplied together on the unrounded figure, and the result is held to no more than the unpaid portion and rounded to the cent once, at the end."
    factors:
      - id: pay_cycle_form
        effect: method
        decides: l_form_fee
        bindings: [l_line_late_due, l_line_late_amount, l_line_late_id, l_line_late_waived, l_line_late_net, l_line_pd_active, l_line_pd_frozen, l_line_pd_repay, l_line_pd, l_cycle_gap, l_form_fee]
        ladder:
          - when: "the loan is on schedule_a or schedule_b, the latest FlexLine late fee, not waived in full, is for a FlexLine due date within pay_cycle_window_days days of the installment's due date and the open FlexLine still has an amount past due"
            method: "the loan's part of the cycle's two amounts past due: schedule figure times the unpaid portion over the unpaid portion plus the FlexLine's amount past due"
          - when: "the loan is on schedule_a or schedule_b and the latest FlexLine late fee, not waived in full, is for a FlexLine due date more than pay_cycle_window_days but no more than previous_cycle_window_days days from the installment's due date"
            method: "two cycles held within the loan's own schedule maximum: the smaller of the schedule figure and the schedule_a or schedule_b maximum less that FlexLine late fee net of its waivers, never below zero (a late fee of 0.00 is not charged)"
          - when: "otherwise, including every loan on schedule_c"
            method: "the schedule figure (on schedule_c, the flat amount)"
        baseline:
          l_form_fee: "l_sched_fee"
        evidence: [cross_category, history, date]
        cross_difficulty: line
      - id: first_late_relief
        effect: parameter
        decides: l_first_share
        bindings: [l_late_12m, l_inst_12m, l_first_share]
        ladder:
          - when: "no late fee on the loan fewer than 12 whole months before the late fee's assessment date and 12 or more net installment payments in that time"
            value: "K('late_fee_first_late_share_full')"
          - when: "no late fee in that time and fewer than 12 such payments"
            value: "K('late_fee_first_late_share_partial')"
          - when: "otherwise"
            value: "1 (no late-fee share)"
        baseline:
          l_first_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: modification_relief
        effect: parameter
        decides: l_mod_share
        bindings: [l_tem_closed, l_mod_share]
        ladder:
          - when: "the loan's Term Extension Modification was completed fewer than 36 whole months before the late fee's assessment date"
            value: "K('late_fee_modification_share_recent')"
          - when: "completed 36 to 59 whole months before the late fee's assessment date"
            value: "K('late_fee_modification_share_older')"
          - when: "otherwise"
            value: "1 (no late-fee share)"
        baseline:
          l_mod_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: hardship
      - id: autopay_history_relief
        effect: parameter
        decides: l_ap_share
        bindings: [l_ap_24m, l_ap_share]
        ladder:
          - when: "20 or more AutoPay debits, less those returned, fewer than 24 whole months before the late fee's assessment date"
            value: "K('late_fee_autopay_share_long')"
          - when: "12 to 19 such debits"
            value: "K('late_fee_autopay_share_mid')"
          - when: "otherwise"
            value: "1 (no late-fee share)"
        baseline:
          l_ap_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: loan_tenure_relief
        effect: parameter
        decides: l_tenure_share
        bindings: [l_tenure, l_tenure_share]
        ladder:
          - when: "48 or more whole months from the funding date to the late fee's assessment date"
            value: "K('late_fee_tenure_share_long')"
          - when: "24 to 47 whole months"
            value: "K('late_fee_tenure_share_mid')"
          - when: "otherwise"
            value: "1 (no late-fee share)"
        baseline:
          l_tenure_share: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The unpaid portion is the scheduled installment amount or the amount past due, whichever is smaller. The loan's
        fee schedule is fixed by its origination state: CA, CO, CT, MA, ME, MN, NY and VT use schedule_b, MD, NC and WI use
        schedule_c, and every other state uses schedule_a. The late fee is the schedule's percent of the unpaid portion,
        not less than the schedule's minimum and not more than its maximum (schedule_b has no minimum and schedule_c is
        its flat amount), never more than the unpaid portion itself, rounded to the cent.
      params: [late_fee_schedule_a_percent, late_fee_schedule_a_min_usd, late_fee_schedule_a_max_usd, late_fee_schedule_b_percent, late_fee_schedule_b_max_usd, late_fee_schedule_c_flat_usd]
    inputs:
      history:
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_late_fee_assessed}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 24, filters: {event_type: loan_payment_posted, payment_channel: autopay_ach}}
        - {category: line, table: line_transactions, aggregate: latest, field: installment_due_date, filters: {event_type: line_late_fee_assessed}}
      cross_category: [line, hardship]

  - id: loan_ext_returned_fee
    base_policy_refs: [loan_evt_returned_payment, loan_evt_late_fee]
    overwrite:
      - base_policy: loan_evt_returned_payment
        superseded_clause: >-
          The fee amount follows the loan's state fee schedule (state_fee_schedule_map of loan_evt_late_fee): returned_payment_fee_schedule_a_usd, returned_payment_fee_schedule_b_usd or returned_payment_fee_schedule_c_usd; under schedule_c the fee is 0.00 and no fee line is written.
        replaced_by: >-
          For the returned-payment fee owed on the latest returned payment on the loan (on a tie of dates, the first one recorded), and only for such a fee, the schedule amount is worked out by the bank-event form and reduced by the returned-fee shares set below; every other returned-payment fee, one owed on an earlier fee-bearing return included, remains under the base clause: the fee amount follows the loan's state fee schedule (state_fee_schedule_map of loan_evt_late_fee): returned_payment_fee_schedule_a_usd, returned_payment_fee_schedule_b_usd or returned_payment_fee_schedule_c_usd; under schedule_c the fee is 0.00 and no fee line is written.
    trigger: state_due
    subject: [loan_returned_payment_fee_assessed]
    computes: amount
    target_tool: assess_returned_payment_fee_e467aa52
    params:
      first_return_share_full: 0.75
      first_return_share_partial: 0.85
      returned_fee_modification_share_recent: 0.9
      returned_fee_modification_share_older: 0.95
      returned_fee_autopay_share_long: 0.9
      returned_fee_autopay_share_mid: 0.95
    rule: >-
      When a posted payment comes back unpaid with a return code that bears a fee (R01, R02, R03, R04, R08, R09, R16 or
      R20), one returned-payment fee is charged against that return, at most one per returned payment and no more than
      max_returned_payment_fees_per_calendar_month on a loan in one calendar month. This policy assesses the fee of the
      latest returned payment on the loan (on a tie of dates, the first one recorded), when its return code bears a fee;
      a fee owed on any earlier fee-bearing return is charged at the schedule amount, unreduced, because the bank-event
      form and the returned-fee shares weigh the bounce being handled now (the same-day FlexLine bounce, the other
      returns of the last 12 months, the borrower's standing at that bounce), and a fee for an earlier bounce that was
      not charged when it happened is a catch-up charge at the schedule amount. For the returned-payment fee owed on the
      latest returned payment on the loan (on a tie of dates, the first one recorded), and only for such a fee, the
      schedule amount is worked out by the bank-event form and reduced by the returned-fee shares set below; every other
      returned-payment fee, one owed on an earlier fee-bearing return included, remains under the base clause: the fee
      amount follows the loan's state fee schedule (state_fee_schedule_map of loan_evt_late_fee):
      returned_payment_fee_schedule_a_usd, returned_payment_fee_schedule_b_usd or returned_payment_fee_schedule_c_usd;
      under schedule_c the fee is 0.00 and no fee line is written. The returned-payment fee schedule follows the loan's
      origination state: schedule_b for CA, CO, CT, MA, ME, MN, NY and VT, schedule_c for MD, NC and WI, and schedule_a
      for every other state. The returned-payment fee is the schedule's amount (returned_payment_fee_schedule_a_usd,
      returned_payment_fee_schedule_b_usd or returned_payment_fee_schedule_c_usd), rounded to the cent. Each rule that
      follows changes only the one quantity it names: the bank-event form sets the schedule amount charged on the loan,
      each returned-fee share that applies multiplies it, the shares being multiplied together on the unrounded amount,
      and the fee is rounded to the cent once, at the end. A returned-payment fee that works out to 0.00, as it always
      does on schedule_c, is not charged: no fee line is written, and it does not count toward the returned-payment fees
      charged on the loan in that calendar month. The bank-event form looks at the borrower's latest FlexLine returned
      payment and the borrower's latest FlexLine returned-payment fee (each on a tie of dates the first one recorded):
      when that FlexLine returned payment was debited from the same bank account and returned on the same date as the
      loan's returned payment and that FlexLine fee is dated that same date, the loan's own fee is cut to the loan's
      part of that one bank event (the FlexLine fee itself is left as it stands), so the loan's amount is the schedule
      amount times the loan's returned payment divided by the two returned payments together; when that FlexLine fee is
      instead dated fewer than one whole calendar month (whole calendar months being the difference in calendar months,
      less one when the later date's day of the month is smaller than the earlier date's) before the assessment date and
      the two returns are not that one bank event, the loan's amount is the schedule amount less half that FlexLine fee,
      never below zero; in every other case the loan's amount is the schedule amount. That FlexLine returned-payment fee
      is taken net of every FlexLine fee waiver applied to it: one waived in full counts as no FlexLine fee, so the
      loan's amount is the schedule amount, and one waived in part counts at its unwaived amount. On schedule_c, whose
      schedule amount is returned_payment_fee_schedule_c_usd, every one of these forms gives that amount or less, never
      below zero. A first-return share applies, looking at the time fewer than 12 whole calendar months (whole calendar
      months being the difference in calendar months, less one when the later date's day of the month is smaller than
      the earlier date's) before the returned-payment fee's assessment date: no returned payment on the loan in that
      time other than the one being charged (the one being charged is left out of the count only when it falls in that
      time), and 12 or more net installment payments in it (payments of type scheduled_installment posted, less one for
      every payment returned whatever it was for), give first_return_share_full; no other returned payment and fewer
      than 12 such payments give first_return_share_partial; any other loan gives no returned-fee share. A returned-fee
      modification share applies to a loan whose Term Extension Modification was completed: completion fewer than 36
      whole calendar months (whole calendar months being the difference in calendar months, less one when the later
      date's day of the month is smaller than the earlier date's) before the returned-payment fee's assessment date
      gives returned_fee_modification_share_recent; completion 36 to 59 whole months before gives
      returned_fee_modification_share_older; any other loan gives no returned-fee share. A returned-fee AutoPay share
      applies, counting the AutoPay debits that cleared on the loan (posted less returned) fewer than 24 whole calendar
      months (whole calendar months being the difference in calendar months, less one when the later date's day of the
      month is smaller than the earlier date's) before the returned-payment fee's assessment date: 20 or more give
      returned_fee_autopay_share_long; 12 to 19 give returned_fee_autopay_share_mid; fewer than 12 give no returned-fee
      share. An AutoPay debit is any payment AutoPay took on the loan, a hardship plan payment included, and an AutoPay
      debit returned is a return of such a payment.
    prerequisite: []
    cross_category:
      - category: line
        as: history
        reads: [line_transactions.event_type, line_transactions.txn_date, line_transactions.amount, line_transactions.bank_account_id]
        note: The bank-event form is decided from the borrower's latest FlexLine returned payment and returned-payment fee.
      - category: hardship
        as: branch
        reads: [variant_name, status, closed_date]
        note: The returned-fee modification share is decided from a completed Term Extension Modification on the loan.
    compute:
      - f_is_b: "F('origination_state') == 'CA' or F('origination_state') == 'CO' or F('origination_state') == 'CT' or F('origination_state') == 'MA' or F('origination_state') == 'ME' or F('origination_state') == 'MN' or F('origination_state') == 'NY' or F('origination_state') == 'VT'"
      - f_is_c: "F('origination_state') == 'MD' or F('origination_state') == 'NC' or F('origination_state') == 'WI'"
      - f_sched_fee: "P('returned_payment_fee_schedule_c_usd') if f_is_c else (P('returned_payment_fee_schedule_b_usd') if f_is_b else P('returned_payment_fee_schedule_a_usd'))"
      - f_ret_date: "LATEST('loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_payment_returned')"
      - f_ret_amount: "LATEST('loan_transactions', 'amount', date_field='txn_date', event_type='loan_payment_returned')"
      - f_ret_bank: "LATEST('loan_transactions', 'bank_account_id', date_field='txn_date', event_type='loan_payment_returned')"
      - f_line_ret_date: "XLATEST('line', 'line_transactions', 'txn_date', date_field='txn_date', event_type='line_payment_returned')"
      - f_line_ret_amount: "XLATEST('line', 'line_transactions', 'amount', date_field='txn_date', event_type='line_payment_returned')"
      - f_line_ret_bank: "XLATEST('line', 'line_transactions', 'bank_account_id', date_field='txn_date', event_type='line_payment_returned')"
      - f_line_fee_date: "XLATEST('line', 'line_transactions', 'txn_date', date_field='txn_date', event_type='line_returned_payment_fee_assessed')"
      - f_line_fee_amount: "XLATEST('line', 'line_transactions', 'amount', date_field='txn_date', event_type='line_returned_payment_fee_assessed')"
      - f_line_fee_id: "XLATEST('line', 'line_transactions', 'line_txn_id', date_field='txn_date', event_type='line_returned_payment_fee_assessed')"
      - f_line_fee_waived: "XSUM('line', 'line_transactions', 'amount', event_type='line_fee_waived', related_txn_id=f_line_fee_id) if f_line_fee_id != None else 0"
      - f_line_fee_net: "MX(0, f_line_fee_amount - f_line_fee_waived) if f_line_fee_amount != None else 0"
      - f_same_event: "f_line_ret_date != None and f_line_ret_date == f_ret_date and f_line_ret_bank == f_ret_bank and f_line_fee_date == f_ret_date and f_line_fee_net > 0"
      - f_event_fee: "(f_sched_fee * f_ret_amount / (f_ret_amount + f_line_ret_amount)) if f_same_event else (MX(0, f_sched_fee - f_line_fee_net / 2) if (f_line_fee_date != None and f_line_fee_net > 0 and MONTHS(f_line_fee_date, NOW) < 1) else f_sched_fee)"
      - f_ret_in_12m: "f_ret_date != None and MONTHS(f_ret_date, NOW) >= 0 and MONTHS(f_ret_date, NOW) < 12"
      - f_other_returns_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned') - (1 if f_ret_in_12m else 0)"
      - f_inst_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_posted', payment_type='scheduled_installment') - COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned')"
      - f_first_share: "K('first_return_share_full') if (f_other_returns_12m == 0 and f_inst_12m >= 12) else (K('first_return_share_partial') if (f_other_returns_12m == 0 and f_inst_12m < 12) else 1)"
      - f_tem_closed: "CFIELD('hardship', 'closed_date', variant_name='Term Extension Modification', status='completed', loan_id=HID)"
      - f_mod_share: "K('returned_fee_modification_share_recent') if (f_tem_closed != None and MONTHS(f_tem_closed, NOW) < 36) else (K('returned_fee_modification_share_older') if (f_tem_closed != None and MONTHS(f_tem_closed, NOW) >= 36 and MONTHS(f_tem_closed, NOW) < 60) else 1)"
      - f_ap_24m: "COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_payment_posted', payment_channel='autopay_ach') - COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_payment_returned', payment_channel='autopay_ach')"
      - f_ap_share: "K('returned_fee_autopay_share_long') if f_ap_24m >= 20 else (K('returned_fee_autopay_share_mid') if f_ap_24m >= 12 else 1)"
      - result: "RND(f_event_fee * f_first_share * f_mod_share * f_ap_share, 2)"
    compute_basis:
      f_is_b: "schedule_b for CA, CO, CT, MA, ME, MN, NY and VT"
      f_is_c: "schedule_c for MD, NC and WI, and schedule_a for every other state"
      f_sched_fee: "The returned-payment fee is the schedule's amount (returned_payment_fee_schedule_a_usd, returned_payment_fee_schedule_b_usd or returned_payment_fee_schedule_c_usd), rounded to the cent."
      f_ret_date: "This policy assesses the fee of the latest returned payment on the loan (on a tie of dates, the first one recorded), when its return code bears a fee"
      f_ret_amount: "This policy assesses the fee of the latest returned payment on the loan (on a tie of dates, the first one recorded), when its return code bears a fee"
      f_ret_bank: "This policy assesses the fee of the latest returned payment on the loan (on a tie of dates, the first one recorded), when its return code bears a fee"
      f_line_ret_date: "The bank-event form looks at the borrower's latest FlexLine returned payment and the borrower's latest FlexLine returned-payment fee (each on a tie of dates the first one recorded)"
      f_line_ret_amount: "the loan's amount is the schedule amount times the loan's returned payment divided by the two returned payments together"
      f_line_ret_bank: "when that FlexLine returned payment was debited from the same bank account and returned on the same date as the loan's returned payment and that FlexLine fee is dated that same date"
      f_line_fee_date: "The bank-event form looks at the borrower's latest FlexLine returned payment and the borrower's latest FlexLine returned-payment fee (each on a tie of dates the first one recorded)"
      f_line_fee_amount: "the loan's amount is the schedule amount less half that FlexLine fee, never below zero"
      f_line_fee_id: "That FlexLine returned-payment fee is taken net of every FlexLine fee waiver applied to it: one waived in full counts as no FlexLine fee, so the loan's amount is the schedule amount, and one waived in part counts at its unwaived amount."
      f_line_fee_waived: "That FlexLine returned-payment fee is taken net of every FlexLine fee waiver applied to it: one waived in full counts as no FlexLine fee, so the loan's amount is the schedule amount, and one waived in part counts at its unwaived amount."
      f_line_fee_net: "That FlexLine returned-payment fee is taken net of every FlexLine fee waiver applied to it: one waived in full counts as no FlexLine fee, so the loan's amount is the schedule amount, and one waived in part counts at its unwaived amount."
      f_same_event: "when that FlexLine returned payment was debited from the same bank account and returned on the same date as the loan's returned payment and that FlexLine fee is dated that same date"
      f_event_fee: "when that FlexLine returned payment was debited from the same bank account and returned on the same date as the loan's returned payment and that FlexLine fee is dated that same date, the loan's own fee is cut to the loan's part of that one bank event (the FlexLine fee itself is left as it stands), so the loan's amount is the schedule amount times the loan's returned payment divided by the two returned payments together; when that FlexLine fee is instead dated fewer than one whole calendar month (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the assessment date and the two returns are not that one bank event, the loan's amount is the schedule amount less half that FlexLine fee, never below zero; in every other case the loan's amount is the schedule amount."
      f_ret_in_12m: "the one being charged is left out of the count only when it falls in that time"
      f_other_returns_12m: "no returned payment on the loan in that time other than the one being charged"
      f_inst_12m: "12 or more net installment payments in it (payments of type scheduled_installment posted, less one for every payment returned whatever it was for)"
      f_first_share: "no returned payment on the loan in that time other than the one being charged (the one being charged is left out of the count only when it falls in that time), and 12 or more net installment payments in it (payments of type scheduled_installment posted, less one for every payment returned whatever it was for), give first_return_share_full; no other returned payment and fewer than 12 such payments give first_return_share_partial; any other loan gives no returned-fee share."
      f_tem_closed: "A returned-fee modification share applies to a loan whose Term Extension Modification was completed"
      f_mod_share: "completion fewer than 36 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the returned-payment fee's assessment date gives returned_fee_modification_share_recent; completion 36 to 59 whole months before gives returned_fee_modification_share_older; any other loan gives no returned-fee share."
      f_ap_24m: "counting the AutoPay debits that cleared on the loan (posted less returned) fewer than 24 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the returned-payment fee's assessment date"
      f_ap_share: "20 or more give returned_fee_autopay_share_long; 12 to 19 give returned_fee_autopay_share_mid; fewer than 12 give no returned-fee share."
      result: "each returned-fee share that applies multiplies it, the shares being multiplied together on the unrounded amount, and the fee is rounded to the cent once, at the end."
    factors:
      - id: bank_event_form
        effect: method
        decides: f_event_fee
        bindings: [f_ret_amount, f_ret_bank, f_line_ret_date, f_line_ret_amount, f_line_ret_bank, f_line_fee_date, f_line_fee_amount, f_line_fee_id, f_line_fee_waived, f_line_fee_net, f_same_event, f_event_fee]
        ladder:
          - when: "the latest FlexLine returned payment came from the same bank account and was returned the same date as the loan's returned payment, and the latest FlexLine returned-payment fee, not waived in full, is dated that date"
            method: "the loan's part of the one bank event: schedule amount times the loan's returned payment over the two returned payments together"
          - when: "not that one bank event, and the latest FlexLine returned-payment fee, not waived in full, is fewer than one whole month old"
            method: "schedule amount less half that FlexLine fee net of its waivers, never below zero"
          - when: "otherwise"
            method: "the schedule amount"
        baseline:
          f_event_fee: "f_sched_fee"
        evidence: [cross_category, history]
        cross_difficulty: line
      - id: first_return_relief
        effect: parameter
        decides: f_first_share
        bindings: [f_ret_in_12m, f_other_returns_12m, f_inst_12m, f_first_share]
        ladder:
          - when: "no other returned payment on the loan fewer than 12 whole months before and 12 or more net installment payments in that time"
            value: "K('first_return_share_full')"
          - when: "no other returned payment and fewer than 12 such payments"
            value: "K('first_return_share_partial')"
          - when: "otherwise"
            value: "1 (no returned-fee share)"
        baseline:
          f_first_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: returned_fee_modification_relief
        effect: parameter
        decides: f_mod_share
        bindings: [f_tem_closed, f_mod_share]
        ladder:
          - when: "the loan's Term Extension Modification was completed fewer than 36 whole months before the returned-payment fee's assessment date"
            value: "K('returned_fee_modification_share_recent')"
          - when: "completed 36 to 59 whole months before the returned-payment fee's assessment date"
            value: "K('returned_fee_modification_share_older')"
          - when: "otherwise"
            value: "1 (no returned-fee share)"
        baseline:
          f_mod_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: hardship
      - id: returned_fee_autopay_relief
        effect: parameter
        decides: f_ap_share
        bindings: [f_ap_24m, f_ap_share]
        ladder:
          - when: "20 or more AutoPay debits cleared (posted less returned) fewer than 24 whole months before the returned-payment fee's assessment date"
            value: "K('returned_fee_autopay_share_long')"
          - when: "12 to 19 such cleared debits"
            value: "K('returned_fee_autopay_share_mid')"
          - when: "otherwise"
            value: "1 (no returned-fee share)"
        baseline:
          f_ap_share: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The returned-payment fee schedule follows the loan's origination state: schedule_b for CA, CO, CT, MA, ME, MN, NY
        and VT, schedule_c for MD, NC and WI, and schedule_a for every other state. The returned-payment fee is the
        schedule's amount (returned_payment_fee_schedule_a_usd, returned_payment_fee_schedule_b_usd or
        returned_payment_fee_schedule_c_usd), rounded to the cent.
      params: [returned_payment_fee_schedule_a_usd, returned_payment_fee_schedule_b_usd, returned_payment_fee_schedule_c_usd]
    inputs:
      history:
        - {table: loan_transactions, aggregate: latest, field: amount, filters: {event_type: loan_payment_returned}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_returned}}
        - {category: line, table: line_transactions, aggregate: latest, field: amount, filters: {event_type: line_payment_returned}}
        - {category: line, table: line_transactions, aggregate: latest, field: amount, filters: {event_type: line_returned_payment_fee_assessed}}
      cross_category: [line, hardship]

  - id: loan_ext_autopay_enroll
    base_policy_refs: [loan_evt_autopay, loan_cmb_hardship_and_benefits]
    overwrite:
      - base_policy: loan_evt_autopay
        superseded_clause: >-
          While AutoPay is active the current interest rate is the base interest rate minus the grade's AutoPay discount; the discount starts on the enrollment date and stops on the cancellation date, and interest for each day accrues at the rate in force that day.
        replaced_by: >-
          For an enrollment this policy sets, and only for such an enrollment, the rate in force from the enrollment date is the one set below from the loan's base interest rate, the grade's AutoPay discount and the AutoPay discount steps; on every other loan the current interest rate while AutoPay is active is the base interest rate minus the grade's AutoPay discount, and on every loan the discount starts on the enrollment date and stops on the cancellation date, and interest for each day accrues at the rate in force that day.
    trigger: on_request
    subject: [loan_autopay_enrolled, loan_autopay_terms_updated]
    computes: current_interest_rate
    target_tool: enroll_autopay_4dda8507
    params:
      autopay_step_tenure_long: 0.1
      autopay_step_tenure_mid: 0.05
      autopay_step_debits_long: 0.1
      autopay_step_debits_mid: 0.05
      autopay_step_builder_matured: 0.1
      autopay_step_builder_active: 0.05
      autopay_return_surcharge_percent: 0.25
    rule: >-
      AutoPay is a recurring ACH debit of the scheduled installment that only the borrower can authorize; the borrower
      enrolls personally, by phone, on a loan in active status, from a linked bank account of the borrower whose
      verification status is verified, and the enrollment records that account, turns AutoPay on and sets the rate in
      force from the enrollment date. For an enrollment this policy sets, and only for such an enrollment, the rate in force from the enrollment date is the one set below from the loan's base interest rate, the grade's AutoPay discount and the AutoPay discount steps; on every other loan the
      current interest rate while AutoPay is active is the base interest rate minus the grade's AutoPay discount, and on
      every loan the discount starts on the enrollment date and stops on the cancellation date, and interest for each
      day accrues at the rate in force that day. This policy sets the rate of an enrollment on a loan with no hardship
      plan in active status that sets its own rate (a plan interest rate on the plan; a Servicemember Rate Cap Benefit
      is such a plan), a loan holding at most one open hardship plan; on a loan whose active hardship plan sets its own
      rate the AutoPay discount never applies on top of that rate: while the plan is active the plan rate governs, so
      the rate in force from the enrollment date is the plan interest rate, and the discounted rate resumes when the
      plan ends if AutoPay is still on. The rate in force from the enrollment date is the loan's base interest rate less
      the grade's AutoPay discount, kept to two decimals. Each rule that follows changes only the one quantity it names: every AutoPay discount step that applies is added to the grade's AutoPay discount, the standard rate is the loan's base interest rate less that total discount, the enrollment rate form then sets the rate in force from the standard rate, and the rate is rounded to two decimals once, at the end. The enrollment is recorded in every case, and the rate it sets is always above 0.00,
      because no base interest rate and no modification floor rate is as low as the grade's AutoPay discount plus every AutoPay discount step. The enrollment rate form follows the loan's record: when the loan's Term Extension Modification was completed, the modification's rate reduction, its pre-plan interest rate less its plan interest rate, comes off the standard rate, never taking the rate below that program's modified_rate_floor_percent; otherwise, when an AutoPay debit on the loan was returned fewer than 3 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the enrollment date, autopay_return_surcharge_percent is added back to the standard rate, never taking it above the loan's base interest rate; in every other case the rate in force is the standard rate. A loan-age AutoPay discount step applies, counting whole calendar months (whole
      calendar months being the difference in calendar months, less one when the later date's day of the month is
      smaller than the earlier date's) from the funding date to the enrollment date: 36 or more add
      autopay_step_tenure_long; 24 to 35 add autopay_step_tenure_mid; fewer than 24 add no step. A debit-record AutoPay
      discount step applies, counting the AutoPay debits posted on the loan fewer than 24 whole calendar months (whole
      calendar months being the difference in calendar months, less one when the later date's day of the month is
      smaller than the earlier date's) before the enrollment date less the AutoPay debits returned in those months: 20
      or more add autopay_step_debits_long; 12 to 19 add autopay_step_debits_mid; fewer than 12 add no step. An AutoPay
      debit is any payment AutoPay took on the loan, a hardship plan payment included, and an AutoPay debit returned is
      a return of such a payment. A Credit Builder AutoPay discount step applies: for that AutoPay discount step, a
      Credit Builder account of the borrower in matured status adds autopay_step_builder_matured; with no matured one, a
      Credit Builder account in active status with an amount past due of 0.00 adds autopay_step_builder_active; a
      borrower with neither adds no step. Any one account meeting a tier's terms is enough for that tier. A borrower
      holds at most one Credit Builder account in active status, and its amount past due is compared as an amount, so 0,
      0.0 and 0.00 are all nothing past due.
    prerequisite: []
    cross_category:
      - category: hardship
        as: branch
        reads: [variant_name, status, plan_interest_rate, pre_plan_interest_rate]
        note: The enrollment rate form is decided from a completed Term Extension Modification's rates and its program's floor.
      - category: builder
        as: branch
        reads: [status, closed_date, amount_past_due]
        note: The Credit Builder AutoPay discount step is decided from a matured, or an active current, Credit Builder account.
    compute:
      - a_base_rate: "F('base_interest_rate')"
      - a_grade_discount: "P('autopay_discount_percent')"
      - a_tem_rate: "CFIELD('hardship', 'plan_interest_rate', variant_name='Term Extension Modification', status='completed', loan_id=HID)"
      - a_tem_pre_rate: "CFIELD('hardship', 'pre_plan_interest_rate', variant_name='Term Extension Modification', status='completed', loan_id=HID)"
      - a_loan_months: "MONTHS(F('funding_date'), NOW)"
      - a_step_tenure: "K('autopay_step_tenure_long') if a_loan_months >= 36 else (K('autopay_step_tenure_mid') if a_loan_months >= 24 else 0)"
      - a_debits_24m: "COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_payment_posted', payment_channel='autopay_ach') - COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_payment_returned', payment_channel='autopay_ach')"
      - a_step_debits: "K('autopay_step_debits_long') if a_debits_24m >= 20 else (K('autopay_step_debits_mid') if a_debits_24m >= 12 else 0)"
      - a_builder_matured: "CFIELD('builder', 'closed_date', status='matured')"
      - a_builder_active_pd: "CFIELD('builder', 'amount_past_due', status='active')"
      - a_builder_active_current: "a_builder_active_pd != None and a_builder_active_pd == 0"
      - a_step_builder: "K('autopay_step_builder_matured') if a_builder_matured != None else (K('autopay_step_builder_active') if a_builder_active_current else 0)"
      - a_plan_rate_active: "CFIELD('hardship', 'plan_interest_rate', status='active', loan_id=HID)"
      - a_tem_floor: "CPARAM('hardship', 'modified_rate_floor_percent', variant_name='Term Extension Modification', status='completed', loan_id=HID)"
      - a_tem_reduction: "(a_tem_pre_rate - a_tem_rate) if (a_tem_rate != None and a_tem_pre_rate != None) else 0"
      - a_ap_return_3m: "COUNT('loan_transactions', within_months=3, date_field='txn_date', event_type='loan_payment_returned', payment_channel='autopay_ach')"
      - a_rate_form: "1 if a_tem_rate != None else (2 if a_ap_return_3m > 0 else 3)"
      - a_total_discount: "a_grade_discount + a_step_tenure + a_step_debits + a_step_builder"
      - a_standard: "a_base_rate - a_total_discount"
      - result: "RND(a_plan_rate_active, 2) if (a_plan_rate_active != None and a_plan_rate_active != '') else RND(MX(a_tem_floor, a_standard - a_tem_reduction) if a_rate_form == 1 else (MN(a_base_rate, a_standard + K('autopay_return_surcharge_percent')) if a_rate_form == 2 else a_standard), 2)"
    compute_basis:
      a_base_rate: "The rate in force from the enrollment date is the loan's base interest rate less the grade's AutoPay discount, kept to two decimals."
      a_grade_discount: "The rate in force from the enrollment date is the loan's base interest rate less the grade's AutoPay discount, kept to two decimals."
      a_plan_rate_active: "on a loan whose active hardship plan sets its own rate the AutoPay discount never applies on top of that rate: while the plan is active the plan rate governs, so the rate in force from the enrollment date is the plan interest rate"
      a_tem_rate: "the modification's rate reduction, its pre-plan interest rate less its plan interest rate"
      a_tem_pre_rate: "the modification's rate reduction, its pre-plan interest rate less its plan interest rate"
      a_tem_floor: "never taking the rate below that program's modified_rate_floor_percent"
      a_tem_reduction: "the modification's rate reduction, its pre-plan interest rate less its plan interest rate, comes off the standard rate"
      a_ap_return_3m: "when an AutoPay debit on the loan was returned fewer than 3 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the enrollment date"
      a_rate_form: "The enrollment rate form follows the loan's record: when the loan's Term Extension Modification was completed, the modification's rate reduction, its pre-plan interest rate less its plan interest rate, comes off the standard rate, never taking the rate below that program's modified_rate_floor_percent; otherwise, when an AutoPay debit on the loan was returned fewer than 3 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the enrollment date, autopay_return_surcharge_percent is added back to the standard rate, never taking it above the loan's base interest rate; in every other case the rate in force is the standard rate."
      a_total_discount: "every AutoPay discount step that applies is added to the grade's AutoPay discount"
      a_standard: "the standard rate is the loan's base interest rate less that total discount"
      a_loan_months: "counting whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's)"
      a_step_tenure: "36 or more add autopay_step_tenure_long; 24 to 35 add autopay_step_tenure_mid; fewer than 24 add no step."
      a_debits_24m: "counting the AutoPay debits posted on the loan fewer than 24 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the enrollment date less the AutoPay debits returned in those months"
      a_step_debits: "20 or more add autopay_step_debits_long; 12 to 19 add autopay_step_debits_mid; fewer than 12 add no step."
      a_builder_matured: "for that AutoPay discount step, a Credit Builder account of the borrower in matured status adds autopay_step_builder_matured"
      a_builder_active_pd: "A borrower holds at most one Credit Builder account in active status"
      a_builder_active_current: "its amount past due is compared as an amount, so 0, 0.0 and 0.00 are all nothing past due."
      a_step_builder: "for that AutoPay discount step, a Credit Builder account of the borrower in matured status adds autopay_step_builder_matured; with no matured one, a Credit Builder account in active status with an amount past due of 0.00 adds autopay_step_builder_active; a borrower with neither adds no step."
      result: "the enrollment rate form then sets the rate in force from the standard rate, and the rate is rounded to two decimals once, at the end."
    factors:
      - id: enrollment_rate_form
        effect: method
        decides: a_rate_form
        bindings: [a_tem_rate, a_tem_pre_rate, a_tem_floor, a_tem_reduction, a_ap_return_3m, a_rate_form]
        ladder:
          - when: "the loan's Term Extension Modification was completed"
            method: "the modification's rate reduction (pre-plan rate less plan rate) comes off the standard rate, never below the program's modified_rate_floor_percent"
          - when: "no completed Term Extension Modification, and an AutoPay debit on the loan returned fewer than 3 whole months before the enrollment date"
            method: "autopay_return_surcharge_percent is added back to the standard rate, never above the base interest rate"
          - when: "otherwise"
            method: "the standard rate, unchanged"
        baseline:
          a_rate_form: "3"
        evidence: [cross_category, history]
        cross_difficulty: hardship
      - id: loan_age_step
        effect: parameter
        decides: a_step_tenure
        bindings: [a_loan_months, a_step_tenure]
        ladder:
          - when: "36 or more whole months from the funding date to the enrollment date"
            value: "K('autopay_step_tenure_long')"
          - when: "24 to 35 whole months"
            value: "K('autopay_step_tenure_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          a_step_tenure: "0"
        evidence: [date]
        cross_difficulty: null
      - id: debit_record_step
        effect: parameter
        decides: a_step_debits
        bindings: [a_debits_24m, a_step_debits]
        ladder:
          - when: "20 or more AutoPay debits fewer than 24 whole months before the enrollment date, less those returned"
            value: "K('autopay_step_debits_long')"
          - when: "12 to 19 such debits"
            value: "K('autopay_step_debits_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          a_step_debits: "0"
        evidence: [history]
        cross_difficulty: null
      - id: credit_builder_autopay_step
        effect: parameter
        decides: a_step_builder
        bindings: [a_builder_matured, a_builder_active_pd, a_builder_active_current, a_step_builder]
        ladder:
          - when: "for the AutoPay discount step, a Credit Builder account of the borrower in matured status"
            value: "K('autopay_step_builder_matured')"
          - when: "for the AutoPay discount step, no matured one, and a Credit Builder account in active status with an amount past due of 0.00"
            value: "K('autopay_step_builder_active')"
          - when: "otherwise"
            value: "0"
        baseline:
          a_step_builder: "0"
        evidence: [cross_category]
        cross_difficulty: builder
    baseline:
      rule: >-
        The rate in force from the enrollment date is the loan's base interest rate less the grade's AutoPay discount,
        kept to two decimals.
      params: [autopay_discount_percent]
    inputs:
      history:
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 24, filters: {event_type: loan_payment_posted, payment_channel: autopay_ach}}
      cross_category: [hardship, builder]

  - id: loan_ext_courtesy_waiver
    base_policy_refs: [loan_evt_fee_waiver]
    overwrite:
      - base_policy: loan_evt_fee_waiver
        superseded_clause: >-
          A late fee or returned-payment fee may be waived only on one of the bases below, one waiver line per fee, for the part of the fee still unpaid (a fee already paid in full is not waived; a refund of a paid fee is outside this policy).
        replaced_by: >-
          For a courtesy waiver of the latest late fee charged on the loan (on a tie of dates, the first one recorded) while no fee payment has posted against it, and only for such a fee, the amount waived is the one set below, never more than that fee's amount less every earlier waiver line applied to it; every other fee, an earlier late fee, a returned-payment fee and a latest late fee a fee payment has already reached included, remains under the base clause: a late fee or returned-payment fee may be waived only on one of the bases of loan_evt_fee_waiver, one waiver line per fee, for the part of the fee still unpaid (a fee already paid in full is not waived; a refund of a paid fee is outside this policy).
    trigger: on_request
    subject: [loan_fee_waived]
    computes: amount
    target_tool: waive_fee_courtesy_87326602
    params:
      repeat_courtesy_fraction: 0.9
      courtesy_share_base: 0.3
      repeat_courtesy_retained_usd: 5.0
      courtesy_point_autopay_restored: 0.3
      courtesy_point_autopay_on: 0.15
      courtesy_point_load_heavy: -0.2
      courtesy_point_load_double: -0.1
      courtesy_point_depth_long: 0.2
      courtesy_point_depth_mid: 0.1
      courtesy_point_practicepay_closed: 0.1
      courtesy_point_practicepay_current: 0.05
      courtesy_point_reason_account: 0.1
      courtesy_point_reason_funds: -0.1
    rule: >-
      A courtesy waiver is granted on the borrower's request when the loan had at least the grade's minimum number of
      on-time installments in the 12 months before the fee was assessed and fewer than the grade's courtesy waivers per
      12 months have already been granted on the loan, and it is requested no later than the fee waiver request window
      after the fee's assessment date; it is recorded as one waiver line, basis courtesy, against the one fee it waives.
      For a courtesy waiver of the latest late fee charged on the loan (on a tie of dates, the first one recorded) while
      no fee payment has posted against it, and only for such a fee, the amount waived is the one set below, never more
      than that fee's amount less every earlier waiver line applied to it; every other fee, an earlier late fee, a
      returned-payment fee and a latest late fee a fee payment has already reached included, remains under the base
      clause: a late fee or returned-payment fee may be waived only on one of the bases of loan_evt_fee_waiver, one
      waiver line per fee, for the part of the fee still unpaid (a fee already paid in full is not waived; a refund of a
      paid fee is outside this policy). A courtesy waiver of a late fee is worked out only after the loan's ledger
      carries the late fee owed for the oldest unpaid installment once that installment's grace period has ended, where
      that late fee works out above 0.00. A courtesy waiver amount is not fixed until the loan's ledger carries the
      returned-payment fee owed for the latest returned payment, where its return code bears one and that fee works out
      above 0.00. Where the loan's AutoPay ended through an automatic cancellation, a courtesy waiver of a late fee is
      fixed only once the loan's AutoPay record shows a new enrollment on a verified account. The fee waived is the
      latest late fee charged on the loan (on a tie of dates, the first one recorded). This policy's courtesy amount is
      set only for the latest late fee charged on the loan while no fee payment has posted against it, and its unpaid
      part is then its amount less every earlier waiver line applied to it. The amount waived is the unpaid part times the courtesy share, which is courtesy_share_base, rounded to the cent. A fee payment reaches a late fee only
      through the normal payment allocation, after the loan's accrued interest and every older unpaid fee are paid, so a
      late fee a fee payment has already reached is one the borrower is paying down; it stays under the standard
      courtesy clause of loan_evt_fee_waiver, which waives the whole part still unpaid, so that a fee the borrower has
      begun paying is cleared rather than left with a small remainder. Each rule that follows changes only the one quantity it names: the waiver form sets the figure the courtesy share is taken from in place of the unpaid part; every courtesy point that applies is added to the courtesy share, and the courtesy share is then held between zero and one; the amount waived is that figure times the courtesy share; and the amount waived is rounded to the cent once, at the end. A courtesy waiver that
      works out to 0.00 is not granted: no waiver line is written, so it uses none of the grade's courtesy waivers per
      12 months and is not the fee's one waiver; with no late fee on the loan there is nothing to waive. The waiver form
      follows the loan's latest earlier courtesy waiver, counted in whole calendar months (whole calendar months being
      the difference in calendar months, less one when the later date's day of the month is smaller than the earlier
      date's) before the request date: one fewer than 12 whole months before means the figure is the unpaid part less repeat_courtesy_retained_usd, never below zero; one 12 to 23 whole months before means the figure is repeat_courtesy_fraction of the unpaid part; none fewer than 24 whole months before means the figure is the whole unpaid part, as in the standard amount. An AutoPay courtesy point
      applies, looking at the loan's latest AutoPay enrollment and latest AutoPay cancellation (each on a tie of dates
      the first one recorded; an enrollment and a cancellation on the same date make the enrollment the later record):
      when the enrollment is on or after the cancellation, that cancellation was automatic (reason bank_account_closed
      or consecutive_returns) and the enrollment is fewer than 8 days before the request date (a count of days between
      two dates being the later date minus the earlier), courtesy_point_autopay_restored; when the enrollment is the
      later record in any other case, or there is no cancellation, courtesy_point_autopay_on; when AutoPay is off, no
      point. A fee-load courtesy point applies, counting the late fees and returned-payment fees charged on the loan
      fewer than 3 whole calendar months (whole calendar months being the difference in calendar months, less one when
      the later date's day of the month is smaller than the earlier date's) before the request date, the fee waived
      included: three or more give courtesy_point_load_heavy; exactly two give courtesy_point_load_double; one gives no
      point. An installment-record courtesy point applies, counting the net installment payments on the loan (payments
      of type scheduled_installment posted, less one for every payment returned whatever it was for): 36 or more give
      courtesy_point_depth_long; 24 to 35 give courtesy_point_depth_mid; fewer than 24 give no point. A PracticePay
      courtesy point applies: any PracticePay plan of the borrower closed as paid in full (closure reason paid_in_full
      or paid_in_full_within_promo) gives courtesy_point_practicepay_closed; with no such plan, a PracticePay plan in
      active status together with no PracticePay late fee charged on any of the borrower's plans fewer than 12 whole
      calendar months (whole calendar months being the difference in calendar months, less one when the later date's day
      of the month is smaller than the earlier date's) before the request date gives courtesy_point_practicepay_current;
      a borrower with neither gets no point. A return-reason courtesy point applies, looking at the latest returned
      payment on the loan (on a tie of dates, the first one recorded), when it is dated on or after the due date of the
      installment the waived fee was charged for: a return for a closed, missing or invalid account (return code R02,
      R03 or R04) gives courtesy_point_reason_account; a return for insufficient or uncollected funds (return code R01
      or R09) gives courtesy_point_reason_funds; no such return, or any other code, gives no point.
    prerequisite:
      - problem: loan_ext_late_fee
        kind: value_input
        gate: c_fee_amount
        form: state
        policy_source: >-
          A courtesy waiver of a late fee is worked out only after the loan's ledger carries the late fee owed for the oldest unpaid installment once that installment's grace period has ended, where that late fee works out above 0.00.
        condition: >-
          loan_transactions holds a loan_late_fee_assessed line whose installment_due_date is the oldest unpaid installment (loans.next_due_date), once the current date is later than that due date plus the late-fee grace period; a late fee that works out to 0.00 writes no line, and then nothing is waited on.
        resolved_by: assess_late_fee_8eb98004
        effect: >-
          Once the late fee for the unpaid installment is on the ledger, it is the latest late fee on the loan, and its unpaid part is the amount the courtesy waiver is taken from.
      - problem: loan_ext_returned_fee
        kind: value_input
        gate: c_ret_3m
        form: state
        policy_source: >-
          A courtesy waiver amount is not fixed until the loan's ledger carries the returned-payment fee owed for the latest returned payment, where its return code bears one and that fee works out above 0.00.
        condition: >-
          the latest loan_payment_returned line on the loan, when its return code is R01, R02, R03, R04, R08, R09, R16 or R20 and its fee works out above 0.00 (never so on MD, NC or WI, whose schedule_c charges 0.00), has a loan_returned_payment_fee_assessed line pointing at it; a fee that works out to 0.00 writes no line, and then nothing is waited on.
        resolved_by: assess_returned_payment_fee_e467aa52
        effect: >-
          Once the returned-payment fee is on the ledger it is counted among the fees charged in the last three whole months, which moves the fee-load courtesy point.
      - problem: loan_ext_autopay_enroll
        kind: value_input
        gate: c_last_enroll
        form: state
        policy_source: >-
          Where the loan's AutoPay ended through an automatic cancellation, a courtesy waiver of a late fee is fixed only once the loan's AutoPay record shows a new enrollment on a verified account.
        condition: >-
          the loan's latest loan_servicing_events AutoPay record is a loan_autopay_enrolled line on a verified bank account, dated on or after the latest automatic loan_autopay_cancelled line.
        resolved_by: enroll_autopay_4dda8507
        effect: >-
          Once the new enrollment is recorded the latest AutoPay record is an enrollment made after the automatic cancellation, which sets the AutoPay courtesy point.
    cross_category:
      - category: pos
        as: branch
        reads: [status, closure_reason, pos_transactions.event_type, pos_transactions.txn_date]
        note: The PracticePay courtesy point is decided from any PracticePay plan paid in full, or an active plan with no PracticePay late fee in the last 12 months.
    compute:
      - c_fee_id: "LATEST('loan_transactions', 'loan_txn_id', date_field='txn_date', event_type='loan_late_fee_assessed')"
      - c_fee_amount: "LATEST('loan_transactions', 'amount', date_field='txn_date', event_type='loan_late_fee_assessed')"
      - c_fee_due: "LATEST('loan_transactions', 'installment_due_date', date_field='txn_date', event_type='loan_late_fee_assessed')"
      - c_fee_waived: "SUM('loan_transactions', 'amount', date_field='txn_date', event_type='loan_fee_waived', related_txn_id=c_fee_id)"
      - c_unpaid: "RND(c_fee_amount - c_fee_waived, 2) if c_fee_amount != None else 0"
      - c_last_courtesy: "LATEST('loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_fee_waived', waiver_reason='courtesy')"
      - c_form: "1 if (c_last_courtesy != None and MONTHS(c_last_courtesy, NOW) < 12) else (2 if (c_last_courtesy != None and MONTHS(c_last_courtesy, NOW) >= 12 and MONTHS(c_last_courtesy, NOW) < 24) else 3)"
      - c_last_enroll: "LATEST('loan_servicing_events', 'event_date', date_field='event_date', event_type='loan_autopay_enrolled')"
      - c_last_cancel: "LATEST('loan_servicing_events', 'event_date', date_field='event_date', event_type='loan_autopay_cancelled')"
      - c_cancel_reason: "LATEST('loan_servicing_events', 'autopay_cancel_reason', date_field='event_date', event_type='loan_autopay_cancelled')"
      - c_pt_autopay: "K('courtesy_point_autopay_restored') if (c_last_enroll != None and c_last_cancel != None and c_last_enroll >= c_last_cancel and (c_cancel_reason == 'bank_account_closed' or c_cancel_reason == 'consecutive_returns') and DAYS(c_last_enroll, NOW) < 8) else (K('courtesy_point_autopay_on') if (c_last_enroll != None and (c_last_cancel == None or c_last_enroll >= c_last_cancel)) else 0)"
      - c_late_3m: "COUNT('loan_transactions', within_months=3, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - c_ret_3m: "COUNT('loan_transactions', within_months=3, date_field='txn_date', event_type='loan_returned_payment_fee_assessed')"
      - c_pt_load: "K('courtesy_point_load_heavy') if (c_late_3m + c_ret_3m) >= 3 else (K('courtesy_point_load_double') if (c_late_3m + c_ret_3m) == 2 else 0)"
      - c_inst: "COUNT('loan_transactions', date_field='txn_date', event_type='loan_payment_posted', payment_type='scheduled_installment') - COUNT('loan_transactions', date_field='txn_date', event_type='loan_payment_returned')"
      - c_pt_depth: "K('courtesy_point_depth_long') if c_inst >= 36 else (K('courtesy_point_depth_mid') if c_inst >= 24 else 0)"
      - c_pos_paid_full: "EXISTS('pos', status='paid_off', closure_reason='paid_in_full')"
      - c_pos_paid_promo: "EXISTS('pos', status='paid_off', closure_reason='paid_in_full_within_promo')"
      - c_pos_active: "EXISTS('pos', status='active')"
      - c_pos_late_12m: "XCOUNT('pos', 'pos_transactions', within_months=12, date_field='txn_date', event_type='pos_late_fee_assessed')"
      - c_pt_pos: "K('courtesy_point_practicepay_closed') if (c_pos_paid_full or c_pos_paid_promo) else (K('courtesy_point_practicepay_current') if (c_pos_active and c_pos_late_12m == 0) else 0)"
      - c_ret_date: "LATEST('loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_payment_returned')"
      - c_ret_code: "LATEST('loan_transactions', 'return_code', date_field='txn_date', event_type='loan_payment_returned')"
      - c_pt_reason: "K('courtesy_point_reason_account') if (c_ret_date != None and c_fee_due != None and c_ret_date >= c_fee_due and (c_ret_code == 'R02' or c_ret_code == 'R03' or c_ret_code == 'R04')) else (K('courtesy_point_reason_funds') if (c_ret_date != None and c_fee_due != None and c_ret_date >= c_fee_due and (c_ret_code == 'R01' or c_ret_code == 'R09')) else 0)"
      - c_form_figure: "MX(0, c_unpaid - K('repeat_courtesy_retained_usd')) if c_form == 1 else ((c_unpaid * K('repeat_courtesy_fraction')) if c_form == 2 else c_unpaid)"
      - c_share: "MN(1, MX(0, K('courtesy_share_base') + c_pt_autopay + c_pt_load + c_pt_depth + c_pt_pos + c_pt_reason))"
      - result: "RND(c_form_figure * c_share, 2)"
    compute_basis:
      c_fee_id: "The fee waived is the latest late fee charged on the loan (on a tie of dates, the first one recorded)."
      c_fee_amount: "The fee waived is the latest late fee charged on the loan (on a tie of dates, the first one recorded)."
      c_fee_due: "when it is dated on or after the due date of the installment the waived fee was charged for"
      c_fee_waived: "its unpaid part is then its amount less every earlier waiver line applied to it"
      c_unpaid: "This policy's courtesy amount is set only for the latest late fee charged on the loan while no fee payment has posted against it, and its unpaid part is then its amount less every earlier waiver line applied to it."
      c_last_courtesy: "counted in whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's)"
      c_form: "one fewer than 12 whole months before means the figure is the unpaid part less repeat_courtesy_retained_usd, never below zero; one 12 to 23 whole months before means the figure is repeat_courtesy_fraction of the unpaid part; none fewer than 24 whole months before means the figure is the whole unpaid part, as in the standard amount."
      c_last_enroll: "looking at the loan's latest AutoPay enrollment and latest AutoPay cancellation (each on a tie of dates the first one recorded; an enrollment and a cancellation on the same date make the enrollment the later record)"
      c_last_cancel: "looking at the loan's latest AutoPay enrollment and latest AutoPay cancellation (each on a tie of dates the first one recorded; an enrollment and a cancellation on the same date make the enrollment the later record)"
      c_cancel_reason: "that cancellation was automatic (reason bank_account_closed or consecutive_returns)"
      c_pt_autopay: "when the enrollment is on or after the cancellation, that cancellation was automatic (reason bank_account_closed or consecutive_returns) and the enrollment is fewer than 8 days before the request date (a count of days between two dates being the later date minus the earlier), courtesy_point_autopay_restored; when the enrollment is the later record in any other case, or there is no cancellation, courtesy_point_autopay_on; when AutoPay is off, no point."
      c_late_3m: "counting the late fees and returned-payment fees charged on the loan fewer than 3 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the request date, the fee waived included"
      c_ret_3m: "counting the late fees and returned-payment fees charged on the loan fewer than 3 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the request date, the fee waived included"
      c_pt_load: "three or more give courtesy_point_load_heavy; exactly two give courtesy_point_load_double; one gives no point."
      c_inst: "counting the net installment payments on the loan (payments of type scheduled_installment posted, less one for every payment returned whatever it was for)"
      c_pt_depth: "36 or more give courtesy_point_depth_long; 24 to 35 give courtesy_point_depth_mid; fewer than 24 give no point."
      c_pos_paid_full: "any PracticePay plan of the borrower closed as paid in full (closure reason paid_in_full or paid_in_full_within_promo) gives courtesy_point_practicepay_closed"
      c_pos_paid_promo: "any PracticePay plan of the borrower closed as paid in full (closure reason paid_in_full or paid_in_full_within_promo) gives courtesy_point_practicepay_closed"
      c_pos_active: "with no such plan, a PracticePay plan in active status together with no PracticePay late fee charged on any of the borrower's plans fewer than 12 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the request date gives courtesy_point_practicepay_current"
      c_pos_late_12m: "no PracticePay late fee charged on any of the borrower's plans fewer than 12 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the request date"
      c_pt_pos: "any PracticePay plan of the borrower closed as paid in full (closure reason paid_in_full or paid_in_full_within_promo) gives courtesy_point_practicepay_closed; with no such plan, a PracticePay plan in active status together with no PracticePay late fee charged on any of the borrower's plans fewer than 12 whole calendar months (whole calendar months being the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's) before the request date gives courtesy_point_practicepay_current; a borrower with neither gets no point."
      c_ret_date: "looking at the latest returned payment on the loan (on a tie of dates, the first one recorded), when it is dated on or after the due date of the installment the waived fee was charged for"
      c_ret_code: "looking at the latest returned payment on the loan (on a tie of dates, the first one recorded), when it is dated on or after the due date of the installment the waived fee was charged for"
      c_pt_reason: "a return for a closed, missing or invalid account (return code R02, R03 or R04) gives courtesy_point_reason_account; a return for insufficient or uncollected funds (return code R01 or R09) gives courtesy_point_reason_funds; no such return, or any other code, gives no point."
      c_share: "every courtesy point that applies is added to the courtesy share, and the courtesy share is then held between zero and one"
      result: "the amount waived is that figure times the courtesy share; and the amount waived is rounded to the cent once, at the end."
      c_form_figure: "the waiver form sets the figure the courtesy share is taken from in place of the unpaid part"
    factors:
      - id: courtesy_waiver_form
        effect: method
        decides: c_form
        bindings: [c_last_courtesy, c_form, c_form_figure]
        ladder:
          - when: "an earlier courtesy waiver on the loan fewer than 12 whole months before the request date"
            method: "the figure is the unpaid part less repeat_courtesy_retained_usd, never below zero (a waiver of 0.00 is not granted)"
          - when: "the latest earlier courtesy waiver 12 to 23 whole months before"
            method: "the figure is repeat_courtesy_fraction of the unpaid part"
          - when: "otherwise"
            method: "the figure is the whole unpaid part, as in the standard amount"
        baseline:
          c_form: "3"
        evidence: [history, date]
        cross_difficulty: null
      - id: autopay_restored_point
        effect: parameter
        decides: c_pt_autopay
        bindings: [c_last_enroll, c_last_cancel, c_cancel_reason, c_pt_autopay]
        ladder:
          - when: "the latest enrollment is on or after the latest cancellation, that cancellation was automatic, and the enrollment is fewer than 8 days before the request date"
            value: "K('courtesy_point_autopay_restored')"
          - when: "the latest enrollment is the later record in any other case, or there is no cancellation"
            value: "K('courtesy_point_autopay_on')"
          - when: "otherwise"
            value: "0"
        baseline:
          c_pt_autopay: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: fee_load_point
        effect: parameter
        decides: c_pt_load
        bindings: [c_late_3m, c_ret_3m, c_pt_load]
        ladder:
          - when: "three or more late and returned-payment fees fewer than 3 whole months before the request date"
            value: "K('courtesy_point_load_heavy')"
          - when: "exactly two"
            value: "K('courtesy_point_load_double')"
          - when: "otherwise"
            value: "0"
        baseline:
          c_pt_load: "0"
        evidence: [history]
        cross_difficulty: null
      - id: installment_record_point
        effect: parameter
        decides: c_pt_depth
        bindings: [c_inst, c_pt_depth]
        ladder:
          - when: "36 or more net installment payments on the loan"
            value: "K('courtesy_point_depth_long')"
          - when: "24 to 35"
            value: "K('courtesy_point_depth_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          c_pt_depth: "0"
        evidence: [history]
        cross_difficulty: null
      - id: practicepay_point
        effect: parameter
        decides: c_pt_pos
        bindings: [c_pos_paid_full, c_pos_paid_promo, c_pos_active, c_pos_late_12m, c_pt_pos]
        ladder:
          - when: "any PracticePay plan closed as paid in full"
            value: "K('courtesy_point_practicepay_closed')"
          - when: "no such plan, and an active PracticePay plan with no PracticePay late fee on any plan fewer than 12 whole months before the request date"
            value: "K('courtesy_point_practicepay_current')"
          - when: "otherwise"
            value: "0"
        baseline:
          c_pt_pos: "0"
        evidence: [cross_category, history]
        cross_difficulty: pos
      - id: return_reason_point
        effect: parameter
        decides: c_pt_reason
        bindings: [c_fee_due, c_ret_date, c_ret_code, c_pt_reason]
        ladder:
          - when: "the latest return on or after the waived fee's installment due date came back R02, R03 or R04"
            value: "K('courtesy_point_reason_account')"
          - when: "it came back R01 or R09"
            value: "K('courtesy_point_reason_funds')"
          - when: "otherwise"
            value: "0"
        baseline:
          c_pt_reason: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The fee waived is the latest late fee charged on the loan (on a tie of dates, the first one recorded). This policy's courtesy amount is set only for the latest late fee charged on the loan while no fee payment has posted against it, and its unpaid part is then its amount less every earlier waiver line applied to it. The amount waived is the unpaid part times the courtesy share, which is courtesy_share_base, rounded to the cent.
      params: [courtesy_share_base]
    inputs:
      history:
        - {table: loan_transactions, aggregate: latest, field: amount, filters: {event_type: loan_late_fee_assessed}}
        - {table: loan_transactions, aggregate: latest, field: txn_date, filters: {event_type: loan_fee_waived, waiver_reason: courtesy}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 3, filters: {event_type: loan_returned_payment_fee_assessed}}
        - {table: loan_servicing_events, aggregate: latest, field: event_date, filters: {event_type: loan_autopay_enrolled}}
        - {category: pos, table: pos_transactions, aggregate: count, field: pos_txn_id, within_months: 12, filters: {event_type: pos_late_fee_assessed}}
      cross_category: [pos]
