# Larkspur Lending - Personal Loans charter (unsecured, fixed-rate, simple-interest amortizing installment loans).
category: loan
display_name: Personal Loans

binding:
  holding_table: loans
  event_tables: [loan_transactions, loan_servicing_events, loan_payoff_quotes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance: principal, fees_balance: fees_due}

lifecycle:
  states: [applied, approved, declined, withdrawn, expired, active, paid_off, charged_off, settled]
  transitions:
    - {from: applied, to: approved, by: system, means: Underwriting approves the application and assigns the rate grade, base rate, APR and origination fee.}
    - {from: applied, to: declined, by: system, means: Underwriting declines the application and an adverse action notice is sent.}
    - {from: applied, to: withdrawn, by: user, means: The applicant withdraws the application before a decision.}
    - {from: approved, to: withdrawn, by: user, means: The applicant declines the approved offer before signing the loan agreement.}
    - {from: approved, to: expired, by: system, means: The approved offer lapses because the loan agreement was not signed within the offer validity period.}
    - {from: approved, to: active, by: system, means: The borrower has signed the loan agreement and the loan is funded; interest starts accruing on the funding date.}
    - {from: active, to: paid_off, by: system, means: Principal, accrued interest and fees reach zero through the final installment, a payoff payment or a refinance payoff transfer.}
    - {from: active, to: charged_off, by: system, means: The loan is charged off after reaching the charge-off delinquency threshold.}
    - {from: paid_off, to: active, by: system, means: The payment that paid the loan off is returned unpaid and the loan is reinstated with its balances restored.}
    - {from: charged_off, to: paid_off, by: system, means: The full charged-off balance is recovered.}
    - {from: charged_off, to: settled, by: system, means: A Charged-Off Settlement Plan is completed for less than the full balance and the remainder is forgiven.}

accounts:
  - key: principal
    unit: USD
    meaning: Unpaid principal of the loan. Credited (in) by each disbursement line at funding (whose sum is the amount financed, origination fee included) and by the principal portion re-added when a payment is returned; debited (out) by the principal portion of each posted payment and by each interest credit applied to principal.
  - key: fees_due
    unit: USD
    meaning: Unpaid late fees and returned-payment fees. Credited (in) by each fee assessed and by each fee payment line reversed because its funding payment was returned; debited (out) by each fee payment line and each fee waiver.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_credit_score: "Minimum FICO Score 8 at application for this grade (integer)."
  max_dti_percent: "Maximum debt-to-income ratio after the new payment, percent of verified gross monthly income (mortgage/rent included)."
  min_annual_income_usd: "Minimum verified gross annual income, USD."
  min_credit_history_years: "Minimum age of oldest tradeline on the credit report, whole years."
  max_inquiries_6_months: "Maximum hard credit inquiries in the 6 months before application (integer)."
  min_loan_amount_usd: "Smallest loan amount (amount financed) offered in this grade, USD."
  max_loan_amount_usd: "Largest loan amount (amount financed) offered in this grade, USD."
  available_terms_months: "Repayment terms offered in this grade, list of months."
  min_amount_for_60_month_term_usd: "Smallest loan amount eligible for a 60-month term, USD; 'not offered' when the grade has no 60-month term."
  min_amount_for_72_month_term_usd: "Smallest loan amount eligible for a 72-month term, USD; 'not offered' when the grade has no 72-month term."
  base_rate_floor_percent: "Lowest 36-month base interest rate in the grade, percent (before term adjustment and discounts)."
  base_rate_ceiling_percent: "Highest 36-month base interest rate in the grade, percent."
  term_rate_adjustment_24_month_percent: "Percentage points added to (negative: subtracted from) the 36-month base rate for a 24-month term."
  term_rate_adjustment_48_month_percent: "Percentage points added to the 36-month base rate for a 48-month term; 'not offered' when unavailable."
  term_rate_adjustment_60_month_percent: "Percentage points added to the 36-month base rate for a 60-month term; 'not offered' when unavailable."
  term_rate_adjustment_72_month_percent: "Percentage points added to the 36-month base rate for a 72-month term; 'not offered' when unavailable."
  origination_fee_percent: "Origination fee as a percent of the amount financed, deducted from proceeds at funding."
  max_apr_percent: "Highest APR Larkspur will disclose on any loan (base rate and origination fee combined), percent; offers that would exceed it are re-priced to the grade's rate floor or declined."
  autopay_discount_percent: "Percentage-point reduction of the interest rate while AutoPay is active."
  direct_pay_discount_percent: "Percentage-point reduction of the base rate granted at approval when debt consolidation proceeds are sent directly to creditors."
  direct_pay_min_share_percent: "Minimum share of net proceeds that must be disbursed directly to creditors for the direct-pay discount, percent."
  max_direct_pay_creditors: "Maximum number of creditors that can be paid directly from one loan (integer)."
  offer_validity_days: "Calendar days an approved offer stays open for signing, counted from the approval date."
  funding_business_days: "Business days after signing until funds are disbursed."
  interest_day_count_basis: "Simple-interest day count: actual days elapsed over a 365-day year (no leap-day adjustment)."
  payment_allocation_order: "Order in which every payment is applied."
  excess_payment_treatment: "Treatment of any amount paid beyond what is due."
  one_time_payment_min_usd: "Smallest one-time payment accepted, USD (a payoff payment may be smaller)."
  debit_card_payment_max_usd: "Largest single debit card payment accepted, USD."
  debit_card_payments_per_month_max: "Most debit card payments accepted per loan per calendar month (integer)."
  same_day_cutoff_time_et: "Payments submitted by this Eastern Time on a business day are effective that day; later or non-business-day submissions are effective the next business day (HH:MM, 24-hour)."
  agent_assisted_payment_fee_usd: "Fee for a payment taken by a representative by phone, USD."
  late_fee_grace_days: "Calendar days after a due date before a late fee may be assessed on an installment still unpaid."
  late_fee_schedule_a_percent: "State fee schedule A: late fee percent of the unpaid portion of the installment."
  late_fee_schedule_a_min_usd: "State fee schedule A: minimum late fee, USD."
  late_fee_schedule_a_max_usd: "State fee schedule A: maximum late fee, USD."
  late_fee_schedule_b_percent: "State fee schedule B: late fee percent of the unpaid portion of the installment."
  late_fee_schedule_b_max_usd: "State fee schedule B: maximum late fee, USD (no minimum)."
  late_fee_schedule_c_flat_usd: "State fee schedule C: flat late fee, USD."
  returned_payment_fee_schedule_a_usd: "State fee schedule A: returned-payment fee per returned payment, USD."
  returned_payment_fee_schedule_b_usd: "State fee schedule B: returned-payment fee per returned payment, USD."
  returned_payment_fee_schedule_c_usd: "State fee schedule C: returned-payment fee per returned payment, USD."
  max_late_fees_per_installment: "Most late fees that may be assessed for one installment (integer)."
  max_returned_payment_fees_per_calendar_month: "Most returned-payment fees that may be assessed on one loan in a calendar month (integer)."
  courtesy_waivers_per_12_months: "Courtesy fee waivers available per loan in any rolling 12 months (integer)."
  courtesy_waiver_min_on_time_payments: "Scheduled installments that must have been paid on time in the 12 months before the fee for a courtesy waiver (integer)."
  fee_waiver_request_window_days: "Calendar days after a fee's assessment date within which a courtesy or documented-error waiver may be requested."
  autopay_setup_lead_business_days: "Business days before a due date by which AutoPay must be set up to debit that installment."
  autopay_cancel_notice_business_days: "Business days before a scheduled debit by which an AutoPay cancellation must be received to stop that debit."
  autopay_consecutive_returns_to_cancel: "Consecutive returned AutoPay debits after which AutoPay is cancelled automatically (integer)."
  due_date_change_min_payments: "Scheduled installments that must have been paid since funding before the due day may be changed (integer)."
  due_date_changes_per_12_months: "Due-date changes allowed per loan in any rolling 12 months (integer)."
  due_date_changes_per_loan: "Due-date changes allowed over the life of a loan (integer)."
  due_date_max_shift_days: "Most calendar days the first due date under the new due day may fall after the current next due date."
  due_date_request_lead_days: "Calendar days before the current next due date by which a due-date change must be requested."
  payoff_quote_validity_days: "Calendar days after the quote date through which a payoff quote is good (good-through date = quote date + this)."
  prepayment_penalty_usd: "Penalty for paying off early, USD."
  overpayment_refund_business_days: "Business days after payoff within which any overpayment is refunded to the source account."
  refinance_min_months_since_funding: "Whole calendar months that must have passed since the funding date before the loan can be refinanced (integer)."
  refinance_min_on_time_payments: "Consecutive most recent scheduled installments paid on time required to refinance (integer)."
  refinance_origination_fee_reduction_percent: "Percentage points by which the origination fee of a Larkspur refinance loan is reduced for an existing borrower."
  combined_principal_cap_usd: "Highest combined unpaid principal across all of a borrower's active Larkspur personal loans, including the new loan's amount financed, USD."
  second_loan_min_on_time_payments: "Scheduled installments that must have been paid on time on the existing loan before a second concurrent loan is approved (integer)."
  delinquency_reporting_days_past_due: "Days past due at which delinquency is reported to the credit bureaus."
  charge_off_days_past_due: "Days past due at which the loan is charged off."

