    trigger: on_request
    subject: [pos_plan_terms_updated]
    computes: monthly_payment_amount
    target_tool: reset_monthly_payment_233e8b10
    params:
      reset_first_due_min_days: 25
      reset_loan_clean_cut: 2.0
      reset_loan_returned_cut: 1.0
      reset_line_clean_cut: 1.0
      reset_line_returned_cut: 0.5
      reset_clean_record_cut: 1.0
      reset_one_late_record_cut: 0.5
      reset_autopay_full_count: 5
      reset_autopay_partial_count: 3
      reset_autopay_full_cut: 0.5
      reset_autopay_partial_cut: 0.25
      reset_half_limit: 0.5
      reset_three_quarter_limit: 0.75
      reset_half_cut: 0.5
      reset_three_quarter_cut: 0.25
    rule: >-
      This reset schedule sets the monthly payment, and the plan APR that applies from then on, when a customer asks for
      a payment reset on the customer's own PracticePay plan; a reset changes the monthly payment and the plan APR and
      nothing else on the plan. If it fails, the whole memo - every period since the purchase date, not only the unpaid
      part - is billed to the balance on the day after promo_end_date and the plan continues for the rest of its term
      with monthly interest charged from then on, at the plan APR, or, for a plan whose customer has asked for a payment
      reset under the reset schedule, and only for such a plan, at the reset rate from the reset onward, interest then
      running on the plan balance excluding fees and excluding the part of the reset's deferred-interest part not yet
      repaid. AutoPay can be turned on or off at any time and carries no rate discount, except that a payment reset
      under the reset schedule counts the AutoPay debits already credited on the plan as that schedule sets. Each plan's
      monthly payment follows its payment method: at activation, a level payment that repays the financed amount at the
      plan APR over the term (monthly rate = plan APR divided by 1200) for deferred-interest, reduced-APR and standard
      plans, and the financed amount divided equally over the term for no-interest plans, a payment that stays in force
      until the customer asks for a payment reset under the reset schedule, which alone sets a new payment and plan APR
      from the reset onward. After a partial refund the monthly payment is recalculated only where the plan's payment
      recast rule says so, or where the customer asks for a payment reset under the reset schedule, which applies only
      to such a request; every other plan keeps the payment its payment recast rule leaves it. Each payment is applied
      to billed interest and billed deferred interest first, then fees, then the remaining plan balance, except on a
      plan whose customer has asked for a payment reset under the reset schedule, and only on such a plan, where the
      reset schedule itself allocates each payment from the reset onward: first the equal share of the reset's
      deferred-interest part that the reset payment carries, then interest billed since the reset, then fees, then the
      rest of the balance; every other plan applies its payments in the order first stated. A reset monthly payment is
      fixed only after the plan's ledger carries the returned-payment fee owed for the plan's latest returned payment.
      The plan's first due date is the first date on its due day at least reset_first_due_min_days calendar days after
      the purchase date, and the remaining payments are the due dates from the plan's next due date through its final
      due date, the final due date falling the term less one whole months after the first due date, so that the
      remaining payments are the term less the whole months from the first due date to the next due date, never fewer
      than one. The reset balance is the plan balance, fees owed included, less the plan's amount past due, which stays
      due as it stands; the reset payments are the remaining payments when the plan has no amount past due and, when it
      has one, the due dates after the latest due date before today, every installment due before today staying in the
      amount past due and an installment due today counting among the reset payments, never fewer than one, and the
      reset payment applies from the first due date among them. Under the standard method the reset rate is the plan
      APR, and the reset payment is the level payment that repays the reset balance at the reset rate over the reset
      payments (monthly rate = reset rate divided by 1200), or the reset balance divided equally over the reset payments
      when the reset rate is 0, rounded up to the next cent and never below min_monthly_payment_usd. A reset payment is
      never below min_monthly_payment_usd, so a reset that is made always sets a payment and never a payment of 0.00;
      when no reset is made the reset payment is 0.00 and nothing is written, and a reset that would leave both the
      monthly payment and the plan APR as they are makes no change and is not made. Where a rule of this reset schedule
      sets a different way of working out the payment or a rate cut, every rate cut is subtracted from the plan APR,
      never below 0, to give the reset rate, the payment is worked out once by that way at the reset rate, rounded up to
      the next cent and never below min_monthly_payment_usd, and the reset rate is stored as the plan APR from the reset
      onward. Under every way of working out the payment, the payment is that way's interest-free part divided equally
      over that way's payments plus the level payment that repays the rest of the reset balance at the reset rate over
      those payments (monthly rate = reset rate divided by 1200), or the rest divided equally over them when the reset
      rate is 0. Every reset payment method repays the reset balance with exactly the reset payments, the last reset
      payment taking only the rounding difference. A plan whose deferred interest was billed is reset under this
      schedule only once, only while no payment dated on or after the billing date has posted on it, and only before the
      first due date after the billing; a plan already reset, which is a plan whose monthly payment no longer equals the
      level payment its payment method set at activation, rounded up to the next cent and never below
      min_monthly_payment_usd, or whose plan APR no longer equals the plan APR of its plan, or a plan past either point
      is not reset, and its monthly payment and plan APR stay as they are, the due dates on or before a date being those
      from the first due date through that date. The reset payment method follows the plan's promotion and ledger: a
      no-interest plan is re-divided, its interest-free part being the whole reset balance and its payments the reset
      payments; an interest-bearing plan that carries a deferred-interest billing entry is set to a split payment, its
      interest-free part being the reset's deferred-interest part, which is the deferred interest billed on the plan but
      never more than the reset balance and bears no further interest, and its payments being the due dates after the
      deferred-interest billing date through the final due date; any other plan is re-amortized, with no interest-free
      part, over the reset payments. The personal-loan rate cut of a reset reads every Larkspur personal loan the
      customer has held: when the customer holds an active personal loan and no late fee and no returned payment were
      posted on any of the customer's personal loans within the last 12 months, the cut is reset_loan_clean_cut; when
      the customer holds an active personal loan and a returned payment but no late fee was posted on any of them within
      the last 12 months, the cut is reset_loan_returned_cut; in every other case the cut is 0; a window of the last N
      months here covering entries dated fewer than N whole months before the reset date, a month being whole once the
      reset date's day of the month has reached the entry's day of the month. The FlexLine rate cut of a reset reads
      every FlexLine the customer has held: when the customer holds an active FlexLine and no late fee and no returned
      payment were posted on any of the customer's FlexLines within the last 12 months, the cut is reset_line_clean_cut;
      when the customer holds an active FlexLine and a returned payment but no late fee was posted on any of them within
      the last 12 months, the cut is reset_line_returned_cut; in every other case the cut is 0; a window of the last N
      months here covering entries dated fewer than N whole months before the reset date, a month being whole once the
      reset date's day of the month has reached the entry's day of the month. The payment-record rate cut of a reset
      counts the late fees on the plan dated within the last 12 months: none gives reset_clean_record_cut, exactly one
      gives reset_one_late_record_cut, and two or more give 0; a window of the last N months here covering entries dated
      fewer than N whole months before the reset date, a month being whole once the reset date's day of the month has
      reached the entry's day of the month. The AutoPay-record rate cut of a reset counts the AutoPay debits credited on
      the plan that did not come back: reset_autopay_full_count or more gives reset_autopay_full_cut,
      reset_autopay_partial_count up to one below reset_autopay_full_count gives reset_autopay_partial_cut, and fewer
      gives 0. The paydown rate cut of a reset compares the principal left on the plan's ledger, the financed charge
      plus returned payments less payments and provider refunds, with the financed amount: no more than reset_half_limit
      of the financed amount gives reset_half_cut, above that but no more than reset_three_quarter_limit of it gives
      reset_three_quarter_cut, and more gives 0.
    prerequisite:
      - problem: pos_ext_returned_item_fee
        kind: value_input
        gate: reset_balance
        form: state
        policy_source: >-
          A reset monthly payment is fixed only after the plan's ledger carries the returned-payment fee owed for the
          plan's latest returned payment.
        condition: >-
          When a returned-payment fee above 0.00 is owed for the plan's latest returned payment under the returned-payment
          fee schedule, a pos_returned_payment_fee_assessed entry names that returned payment.
        resolved_by: assess_returned_payment_fee_f9ef5ea0
        effect: >-
          Booking the returned-payment fee raises the plan balance, which is the reset balance, so the re-amortized
          payment rises.
    cross_category:
      - category: loan
        as: history
        reads: [status, loan_transactions.event_type]
        note: The personal-loan rate cut is decided from whether the customer holds an active personal loan and from late fees and returned payments on all of the customer's personal loans within 12 months.
      - category: line
        as: history
        reads: [status, line_transactions.event_type]
        note: The FlexLine rate cut is decided from whether the customer holds an active FlexLine and from late fees and returned payments on all of the customer's FlexLines within 12 months.
    compute:
      - reset_balance: "F('plan_balance')"
      - purchase_month_index: "MONTHS('2000-01-01', F('purchase_date'))"
      - next_due_month_index: "MONTHS('2000-01-01', F('next_due_date'))"
      - months_purchase_to_next: "MONTHS(F('purchase_date'), F('next_due_date'))"
      - first_due_day_month: "purchase_month_index + (next_due_month_index - purchase_month_index - months_purchase_to_next)"
      - first_due_day_year: "first_due_day_month // 12"
      - first_due_day_mo: "first_due_day_month % 12 + 1"
      - first_due_day_ordinal: "365 * first_due_day_year + (first_due_day_year + 3) // 4 + (367 * first_due_day_mo - 362) // 12 - (0 if first_due_day_mo <= 2 else (1 if first_due_day_year % 4 == 0 else 2)) + int(F('payment_due_day')) - 1"
      - purchase_ordinal: "DAYS('2000-01-01', F('purchase_date'))"
      - months_first_due_to_next: "months_purchase_to_next - (1 if first_due_day_ordinal - purchase_ordinal < K('reset_first_due_min_days') else 0)"
      - first_due_skip: "1 if first_due_day_ordinal - purchase_ordinal < K('reset_first_due_min_days') else 0"
      - first_due_month: "first_due_day_month + first_due_skip"
      - di_bill_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_deferred_interest_billed')"
      - due_dates_to_billing: "MX(0, MONTHS('2000-01-01', di_bill_date) - first_due_month - (MONTHS('2000-01-01', di_bill_date) - next_due_month_index - MONTHS(F('next_due_date'), di_bill_date)) + 1) if di_bill_date != None else 0"
      - due_dates_to_today: "MX(0, MONTHS('2000-01-01', NOW) - first_due_month - (MONTHS('2000-01-01', NOW) - next_due_month_index - MONTHS(F('next_due_date'), NOW)) + 1)"
      - today_month: "MONTHS('2000-01-01', NOW)"
      - today_due_ordinal: "365 * (today_month // 12) + ((today_month // 12) + 3) // 4 + (367 * (today_month % 12 + 1) - 362) // 12 - (0 if today_month % 12 + 1 <= 2 else (1 if (today_month // 12) % 4 == 0 else 2)) + int(F('payment_due_day')) - 1"
      - today_is_due: "today_due_ordinal == DAYS('2000-01-01', NOW)"
      - due_dates_before_today: "due_dates_to_today - (1 if today_is_due else 0)"
      - activation_rate: "P('plan_apr_percent') / 1200"
      - activation_raw: "(F('financed_amount') * activation_rate / (1 - (1 + activation_rate) ** (0 - F('term_months')))) if activation_rate > 0 else F('financed_amount') / F('term_months')"
      - activation_cents: "RND(activation_raw * 100, 6)"
      - activation_payment: "MX(P('min_monthly_payment_usd'), (int(activation_cents) + (1 if activation_cents > int(activation_cents) else 0)) / 100)"
      - last_pay_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_payment_posted')"
      - di_bills: "COUNT('pos_transactions', event_type='pos_deferred_interest_billed')"
      - di_reset_barred: "di_bills >= 1 and (F('monthly_payment_amount') != activation_payment or F('plan_apr') != P('plan_apr_percent') or (last_pay_date != None and last_pay_date >= di_bill_date) or due_dates_to_today > due_dates_to_billing)"
      - remaining_payments: "MX(1, F('term_months') - months_first_due_to_next)"
      - past_due: "F('amount_past_due') or 0"
      - reset_amount: "reset_balance - past_due"
      - reset_payments: "MX(1, (F('term_months') - due_dates_before_today) if past_due > 0 else remaining_payments)"
      - loan_active: "EXISTS('loan', status='active')"
      - loan_late_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - loan_returns_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned')"
      - loan_cut: "K('reset_loan_clean_cut') if (loan_active and loan_late_12m == 0 and loan_returns_12m == 0) else (K('reset_loan_returned_cut') if (loan_active and loan_late_12m == 0 and loan_returns_12m >= 1) else 0)"
      - line_active: "EXISTS('line', status='active')"
      - line_late_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - line_returns_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_payment_returned')"
      - line_cut: "K('reset_line_clean_cut') if (line_active and line_late_12m == 0 and line_returns_12m == 0) else (K('reset_line_returned_cut') if (line_active and line_late_12m == 0 and line_returns_12m >= 1) else 0)"
      - late_fees_12m: "COUNT('pos_transactions', within_months=12, date_field='txn_date', event_type='pos_late_fee_assessed')"
      - record_cut: "K('reset_clean_record_cut') if late_fees_12m == 0 else (K('reset_one_late_record_cut') if late_fees_12m == 1 else 0)"
      - autopay_debits: "COUNT('pos_transactions', event_type='pos_payment_posted', payment_channel='autopay_ach') - COUNT('pos_transactions', event_type='pos_payment_returned', payment_channel='autopay_ach')"
      - autopay_cut: "K('reset_autopay_full_cut') if autopay_debits >= K('reset_autopay_full_count') else (K('reset_autopay_partial_cut') if autopay_debits >= K('reset_autopay_partial_count') else 0)"
      - principal_left: "SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_purchase_financed') + SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_returned') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_posted') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_merchant_refund_posted')"
      - paydown_ratio: "principal_left / F('financed_amount')"
      - paydown_cut: "K('reset_half_cut') if paydown_ratio <= K('reset_half_limit') else (K('reset_three_quarter_cut') if paydown_ratio <= K('reset_three_quarter_limit') else 0)"
      - reset_rate: "MX(0, F('plan_apr') - loan_cut - line_cut - record_cut - autopay_cut - paydown_cut)"
      - monthly_rate: "reset_rate / 1200"
      - di_billed_count: "COUNT('pos_transactions', event_type='pos_deferred_interest_billed')"
      - method_choice: "2 if P('promo_type') == 'no_interest' else (1 if di_billed_count >= 1 else 0)"
      - interest_free_part: "reset_amount if method_choice == 2 else (MN(SUM('pos_transactions','amount', event_type='pos_deferred_interest_billed'), reset_amount) if method_choice == 1 else 0)"
      - method_payments: "MX(1, F('term_months') - due_dates_to_billing) if method_choice == 1 else reset_payments"
      - method_amount: "interest_free_part / method_payments + ((((reset_amount - interest_free_part) * monthly_rate / (1 - (1 + monthly_rate) ** (0 - method_payments))) if monthly_rate > 0 else (reset_amount - interest_free_part) / method_payments) if reset_amount > interest_free_part else 0)"
      - cents: "RND(method_amount * 100, 6)"
      - rounded_up: "(int(cents) + (1 if cents > int(cents) else 0)) / 100"
      - new_payment: "MX(P('min_monthly_payment_usd'), rounded_up)"
      - no_change: "new_payment == F('monthly_payment_amount') and RND(reset_rate, 2) == F('plan_apr')"
      - stored_rate: "F('plan_apr') if (di_reset_barred or no_change) else RND(reset_rate, 2)"
      - result: "0 if (di_reset_barred or no_change) else new_payment"
