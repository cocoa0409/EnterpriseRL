      late_fees_6m: "or no late-fee entry names that due date but the plan shows a late fee dated within the last 6 months"
      relief_size: "The returned-payment-fee relief size follows the plan's late-fee record: when the late-fee entry that names the due date the payment that came back was credited toward already carries a waiver entry, so that the same missed payment has been relieved once, the relief size is the part of the returned-payment fee above returned_relief_keep_usd, never below 0.00 and never more than returned_relief_cap_usd; when that late-fee entry carries no waiver entry, or no late-fee entry names that due date but the plan shows a late fee dated within the last 6 months, the relief size is the part of the returned-payment fee above returned_relief_keep_usd, never below 0.00; in every other case the relief size is the returned-payment fee in full; a window of the last N months here covering entries dated fewer than N whole months before the relief date, a month being whole once the relief date's day of the month has reached the entry's day of the month."
      replace_days: "The replacement timing share of a returned-payment-fee relief counts the days from the return date to the replacement date"
      timing_share: "no more than returned_relief_quick_days days gives 1, more than returned_relief_quick_days and no more than returned_relief_slow_days days gives returned_relief_mid_timing_share, and more than returned_relief_slow_days days gives returned_relief_slow_timing_share"
      principal_left: "The principal share of a returned-payment-fee relief reads the principal left on the plan's ledger, the financed charge plus returned payments less payments and provider refunds"
      principal_share: "below returned_relief_low_principal_usd gives 1, at least returned_relief_low_principal_usd and below returned_relief_high_principal_usd gives returned_relief_mid_principal_share, and returned_relief_high_principal_usd or more gives returned_relief_high_principal_share."
      loan_late_12m: "a late fee posted on any of them within the last 12 months gives returned_relief_loan_late_share"
      loan_returns_12m: "a returned payment but no late fee posted on any of them within the last 12 months gives returned_relief_loan_returned_share"
      loan_share: "The personal-loan share of a returned-payment-fee relief reads every Larkspur personal loan the customer has held: a late fee posted on any of them within the last 12 months gives returned_relief_loan_late_share; a returned payment but no late fee posted on any of them within the last 12 months gives returned_relief_loan_returned_share; otherwise the share is 1; a window of the last N months here covering entries dated fewer than N whole months before the relief date, a month being whole once the relief date's day of the month has reached the entry's day of the month."
      line_late_12m: "a late fee posted on any of them within the last 12 months gives returned_relief_line_late_share"
      line_returns_12m: "a returned payment but no late fee posted on any of them within the last 12 months gives returned_relief_line_returned_share"
      line_share: "The FlexLine share of a returned-payment-fee relief reads every FlexLine the customer has held: a late fee posted on any of them within the last 12 months gives returned_relief_line_late_share; a returned payment but no late fee posted on any of them within the last 12 months gives returned_relief_line_returned_share; otherwise the share is 1; a window of the last N months here covering entries dated fewer than N whole months before the relief date, a month being whole once the relief date's day of the month has reached the entry's day of the month."
      relief_product: "Where a rule of the returned-payment-fee relief schedule sets a relief size or a share, the relief size takes the place of the full fee, every share multiplies it, all shares applying together, the product is never more than the part of the fee not already waived, and it is rounded half up to the nearest cent once, at the end."
      result: "A returned-payment-fee relief that works out to 0.00 is not owed, and nothing is booked for it."
    factors:
      - id: returned_relief_size_rule
        effect: method
        decides: relief_size
        bindings: [same_due_late_count, same_due_late_id, same_due_late_relieved, late_fees_6m, relief_size]
        ladder:
          - when: "the late fee of the due date the payment that came back was credited toward already carries a waiver entry"
            method: "capped keep-back: the part of the returned-payment fee above returned_relief_keep_usd, never below 0.00 and never more than returned_relief_cap_usd"
          - when: "that late fee carries no waiver entry, or no late fee names that due date but a late fee on the plan within the last 6 months"
            method: "keep-back: the part of the returned-payment fee above returned_relief_keep_usd, never below 0.00"
          - when: "otherwise"
            method: "whole: the returned-payment fee in full"
        baseline:
          relief_size: "rfee_amount"
        evidence: [history]
        cross_difficulty: null
      - id: returned_relief_timing_band
        effect: parameter
        decides: timing_share
        bindings: [replace_days, timing_share]
        ladder:
          - when: "replacement more than returned_relief_slow_days days after the return"
            value: "K('returned_relief_slow_timing_share') = 0.75"
          - when: "replacement more than returned_relief_quick_days and no more than returned_relief_slow_days days after the return"
            value: "K('returned_relief_mid_timing_share') = 0.9"
          - when: "otherwise (replacement no more than returned_relief_quick_days days after the return)"
            value: "1"
        baseline:
          timing_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: returned_relief_principal_band
        effect: parameter
        decides: principal_share
        bindings: [principal_left, principal_share]
        ladder:
          - when: "principal left returned_relief_high_principal_usd or more"
            value: "K('returned_relief_high_principal_share') = 0.9"
          - when: "principal left at least returned_relief_low_principal_usd and below returned_relief_high_principal_usd"
            value: "K('returned_relief_mid_principal_share') = 0.95"
          - when: "otherwise (principal left below returned_relief_low_principal_usd)"
            value: "1"
        baseline:
          principal_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: returned_relief_loan_record
        effect: parameter
        decides: loan_share
        bindings: [loan_late_12m, loan_returns_12m, loan_share]
        ladder:
          - when: "a late fee on any personal loan within 12 months"
            value: "K('returned_relief_loan_late_share') = 0.8"
          - when: "a returned payment but no late fee on any personal loan within 12 months"
            value: "K('returned_relief_loan_returned_share') = 0.9"
          - when: "otherwise"
            value: "1"
        baseline:
          loan_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: returned_relief_flexline_record
        effect: parameter
        decides: line_share
        bindings: [line_late_12m, line_returns_12m, line_share]
        ladder:
          - when: "a late fee on any FlexLine within 12 months"
            value: "K('returned_relief_line_late_share') = 0.85"
          - when: "a returned payment but no late fee on any FlexLine within 12 months"
            value: "K('returned_relief_line_returned_share') = 0.95"
          - when: "otherwise"
            value: "1"
        baseline:
          line_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: line
    baseline:
      rule: >-
        The returned-payment-fee relief is the returned-payment fee in full, rounded half up to the nearest cent.
        A returned-payment-fee relief that works out to 0.00 is not owed, and nothing is booked for it.
      params: [fee_waiver_request_window_days]
    inputs:
      history:
        - {table: pos_transactions, aggregate: latest, field: pos_txn_id, filters: {event_type: pos_payment_returned}}
        - {table: pos_transactions, aggregate: sum, field: amount, filters: {event_type: pos_returned_payment_fee_assessed, related_txn_id: that returned payment}}
        - {table: pos_transactions, aggregate: latest, field: txn_date, filters: {event_type: pos_payment_posted, installment_due_date: that due date}}
        - {table: pos_transactions, aggregate: count, field: pos_txn_id, within_months: 6, filters: {event_type: pos_late_fee_assessed}}
        - {table: pos_transactions, aggregate: sum, field: amount, filters: {event_type: financed, payments, returns, refunds}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_late_fee_assessed}}
        - {category: line, table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_payment_returned}}
      cross_category: [loan, line]

  - id: pos_ext_late_fee_schedule
    base_policy_refs: [pos_evt_payments_and_fees, pos_evt_billing_disputes, pos_agg_combined_exposure]
    overwrite:
      - base_policy: pos_evt_payments_and_fees
        superseded_clause: >-
          The late fee is late_fee_usd but never more than the unpaid part of that monthly payment, at most
          max_late_fees_per_due_date per due date, and the amount of an open billing dispute is left out of the unpaid
          part.
        replaced_by: >-
          For a monthly due date whose grace period has ended with part of that monthly payment still unpaid, and only
          for such a due date, one late fee is charged at the amount this fee schedule sets, never more than the unpaid
          part of that monthly payment and never more than max_late_fees_per_due_date late fee for that due date, with
          the amount of an open billing dispute left out of the unpaid part.
    trigger: state_due
    subject: [pos_late_fee_assessed]
    computes: fee_amount
    target_tool: assess_late_fee_02ab9d3a
    params:
      repeat_late_fee_usd: 35.0
      first_late_fee_usd: 20.0
      late_after_grace_floor_share: 0.5
      late_low_principal_limit_usd: 1000.0
      late_mid_principal_limit_usd: 3000.0
      late_low_principal_share: 0.8
      late_mid_principal_share: 0.9
      late_loan_clean_share: 0.9
      late_loan_returned_share: 0.95
      late_line_clean_share: 0.95
      late_line_returned_share: 0.98
    rule: >-
      For a monthly due date whose grace period has ended with part of that monthly payment still unpaid, and only for
      such a due date, one late fee is charged at the amount this fee schedule sets, never more than the unpaid part of
      that monthly payment and never more than max_late_fees_per_due_date late fee for that due date, with the amount of
      an open billing dispute left out of the unpaid part. The due date the late fee is for is the plan's oldest unpaid
      due date as the plan shows it. The unpaid part of that monthly payment is the smaller of the plan's monthly
      payment amount and its amount past due less the disputed amounts of the plan's billing disputes that are still
      open, never below zero. The late fee for that due date is the plan's standard late fee, late_fee_usd, never more
      than the unpaid part, rounded half up to the nearest cent. Where a rule of this fee schedule sets a different fee
      level or a share for the customer's situation, that fee level takes the place of the standard late fee and every
      share multiplies it; all shares apply together to that one fee level, the product is then capped at the unpaid
      part, and it is rounded half up to the nearest cent once, at the end. A late fee that works out to 0.00 is not
      owed, and nothing is booked for it. The late-fee level follows the plan's late-fee record: when the plan shows a
      late fee dated within the last 6 months, the late-fee level is repeat_late_fee_usd; when the plan shows no late
      fee dated within the last 12 months, the late-fee level is first_late_fee_usd; when the plan shows a late fee
      dated within the last 12 months but none within the last 6 months, the late-fee level is late_fee_usd; a window of
      the last N months here covering entries dated fewer than N whole months before the assessment date, a month being
      whole once the assessment date's day of the month has reached the entry's day of the month. The partial-payment
      share of a late fee looks at the latest payment entry credited toward that due date, the one recorded first where
      two share the latest date: when that payment has not come back as a returned payment and is dated no later than
      the last day of the grace period, the share is the unpaid part divided by the monthly payment amount; when it has
      not come back and is dated after the last day of the grace period, the share is the unpaid part divided by the
      monthly payment amount but never less than late_after_grace_floor_share; when it has come back, or no payment
      entry was credited toward that due date, the share is 1. The grace period's last day is the monthly due date plus
      late_fee_grace_days calendar days, counted from the day after the due date. The principal share of a late fee
      reads the principal left on the plan's ledger, which is the financed charge plus returned payments less payments
      and provider refunds: principal left below late_low_principal_limit_usd gives late_low_principal_share, at least
      late_low_principal_limit_usd and below late_mid_principal_limit_usd gives late_mid_principal_share, and
      late_mid_principal_limit_usd or more gives 1. The personal-loan share of a late fee reads every Larkspur personal
      loan the customer has held: when the customer holds an active personal loan and no late fee and no returned
      payment were posted on any of the customer's personal loans within the last 12 months, the share is
      late_loan_clean_share; when the customer holds an active personal loan and a returned payment but no late fee was
      posted on any of them within the last 12 months, the share is late_loan_returned_share; in every other case the
      share is 1; a window of the last N months here covering entries dated fewer than N whole months before the
      assessment date, a month being whole once the assessment date's day of the month has reached the entry's day of
      the month. The FlexLine share of a late fee reads every FlexLine the customer has held: when the customer holds an
      active FlexLine and no late fee and no returned payment were posted on any of the customer's FlexLines within the
      last 12 months, the share is late_line_clean_share; when the customer holds an active FlexLine and a returned
      payment but no late fee was posted on any of them within the last 12 months, the share is
      late_line_returned_share; in every other case the share is 1; a window of the last N months here covering entries
      dated fewer than N whole months before the assessment date, a month being whole once the assessment date's day of
      the month has reached the entry's day of the month.
    prerequisite: []
    cross_category:
      - category: loan
        as: history
        reads: [status, loan_transactions.event_type]
        note: The personal-loan share of a late fee is decided from whether the customer holds an active personal loan and from late fees and returned payments on all of the customer's personal loans within 12 months.
      - category: line
        as: history
        reads: [status, line_transactions.event_type]
        note: The FlexLine share of a late fee is decided from whether the customer holds an active FlexLine and from late fees and returned payments on all of the customer's FlexLines within 12 months.
    compute:
      - due_date: "F('next_due_date')"
      - monthly_due: "F('monthly_payment_amount')"
      - open_disputed: "SUM('pos_billing_disputes','disputed_amount', dispute_status='open')"
      - unpaid_part: "MX(0, MN(monthly_due, F('amount_past_due') - open_disputed))"
      - late_fees_6m: "COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_late_fee_assessed')"
      - late_fees_12m: "COUNT('pos_transactions', within_months=12, date_field='txn_date', event_type='pos_late_fee_assessed')"
      - late_fee_level: "K('repeat_late_fee_usd') if late_fees_6m >= 1 else (K('first_late_fee_usd') if late_fees_12m == 0 else P('late_fee_usd'))"
      - last_credit_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_payment_posted', installment_due_date=due_date)"
      - last_credit_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_payment_posted', installment_due_date=due_date)"
      - last_credit_returned: "COUNT('pos_transactions', event_type='pos_payment_returned', related_txn_id=last_credit_id) > 0"
      - credit_stands: "last_credit_id != None and not last_credit_returned"
      - credit_day_after_due: "DAYS(due_date, last_credit_date) if credit_stands else 0"
      - unpaid_ratio: "unpaid_part / monthly_due"
      - partial_share: "unpaid_ratio if (credit_stands and credit_day_after_due <= P('late_fee_grace_days')) else (MX(K('late_after_grace_floor_share'), unpaid_ratio) if credit_stands else 1)"
      - principal_left: "SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_purchase_financed') + SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_returned') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_posted') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_merchant_refund_posted')"
      - principal_share: "K('late_low_principal_share') if principal_left < K('late_low_principal_limit_usd') else (K('late_mid_principal_share') if principal_left < K('late_mid_principal_limit_usd') else 1)"
      - loan_active: "EXISTS('loan', status='active')"
      - loan_late_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - loan_returns_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned')"
      - loan_share: "K('late_loan_clean_share') if (loan_active and loan_late_12m == 0 and loan_returns_12m == 0) else (K('late_loan_returned_share') if (loan_active and loan_late_12m == 0 and loan_returns_12m >= 1) else 1)"
      - line_active: "EXISTS('line', status='active')"
      - line_late_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - line_returns_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_payment_returned')"
      - line_share: "K('late_line_clean_share') if (line_active and line_late_12m == 0 and line_returns_12m == 0) else (K('late_line_returned_share') if (line_active and line_late_12m == 0 and line_returns_12m >= 1) else 1)"
      - fee_before_cap: "late_fee_level * partial_share * principal_share * loan_share * line_share"
      - result: "int(RND((MN(fee_before_cap, unpaid_part)) * 100, 6) + 0.5) / 100"
    compute_basis:
      due_date: "The due date the late fee is for is the plan's oldest unpaid due date as the plan shows it."
      monthly_due: "The unpaid part of that monthly payment is the smaller of the plan's monthly payment amount and its amount past due less the disputed amounts of the plan's billing disputes that are still open, never below zero."
      open_disputed: "The unpaid part of that monthly payment is the smaller of the plan's monthly payment amount and its amount past due less the disputed amounts of the plan's billing disputes that are still open, never below zero."
      unpaid_part: "The unpaid part of that monthly payment is the smaller of the plan's monthly payment amount and its amount past due less the disputed amounts of the plan's billing disputes that are still open, never below zero."
      late_fees_6m: "when the plan shows a late fee dated within the last 6 months, the late-fee level is repeat_late_fee_usd"
      late_fees_12m: "when the plan shows no late fee dated within the last 12 months, the late-fee level is first_late_fee_usd"
      late_fee_level: "The late-fee level follows the plan's late-fee record: when the plan shows a late fee dated within the last 6 months, the late-fee level is repeat_late_fee_usd; when the plan shows no late fee dated within the last 12 months, the late-fee level is first_late_fee_usd; when the plan shows a late fee dated within the last 12 months but none within the last 6 months, the late-fee level is late_fee_usd; a window of the last N months here covering entries dated fewer than N whole months before the assessment date, a month being whole once the assessment date's day of the month has reached the entry's day of the month."
      last_credit_id: "The partial-payment share of a late fee looks at the latest payment entry credited toward that due date, the one recorded first where two share the latest date"
      last_credit_date: "The partial-payment share of a late fee looks at the latest payment entry credited toward that due date, the one recorded first where two share the latest date"
      last_credit_returned: "when it has come back, or no payment entry was credited toward that due date, the share is 1."
      credit_stands: "when that payment has not come back as a returned payment and is dated no later than the last day of the grace period"
      credit_day_after_due: "The grace period's last day is the monthly due date plus late_fee_grace_days calendar days, counted from the day after the due date."
      unpaid_ratio: "the share is the unpaid part divided by the monthly payment amount"
      partial_share: "when that payment has not come back as a returned payment and is dated no later than the last day of the grace period, the share is the unpaid part divided by the monthly payment amount; when it has not come back and is dated after the last day of the grace period, the share is the unpaid part divided by the monthly payment amount but never less than late_after_grace_floor_share; when it has come back, or no payment entry was credited toward that due date, the share is 1."
      principal_left: "The principal share of a late fee reads the principal left on the plan's ledger, which is the financed charge plus returned payments less payments and provider refunds"
      principal_share: "principal left below late_low_principal_limit_usd gives late_low_principal_share, at least late_low_principal_limit_usd and below late_mid_principal_limit_usd gives late_mid_principal_share, and late_mid_principal_limit_usd or more gives 1."
      loan_active: "when the customer holds an active personal loan and no late fee and no returned payment were posted on any of the customer's personal loans within the last 12 months, the share is late_loan_clean_share"
      loan_late_12m: "when the customer holds an active personal loan and no late fee and no returned payment were posted on any of the customer's personal loans within the last 12 months, the share is late_loan_clean_share"
      loan_returns_12m: "when the customer holds an active personal loan and a returned payment but no late fee was posted on any of them within the last 12 months, the share is late_loan_returned_share"
      loan_share: "The personal-loan share of a late fee reads every Larkspur personal loan the customer has held: when the customer holds an active personal loan and no late fee and no returned payment were posted on any of the customer's personal loans within the last 12 months, the share is late_loan_clean_share; when the customer holds an active personal loan and a returned payment but no late fee was posted on any of them within the last 12 months, the share is late_loan_returned_share; in every other case the share is 1; a window of the last N months here covering entries dated fewer than N whole months before the assessment date, a month being whole once the assessment date's day of the month has reached the entry's day of the month."
      line_active: "when the customer holds an active FlexLine and no late fee and no returned payment were posted on any of the customer's FlexLines within the last 12 months, the share is late_line_clean_share"
      line_late_12m: "when the customer holds an active FlexLine and no late fee and no returned payment were posted on any of the customer's FlexLines within the last 12 months, the share is late_line_clean_share"
      line_returns_12m: "when the customer holds an active FlexLine and a returned payment but no late fee was posted on any of them within the last 12 months, the share is late_line_returned_share"
      line_share: "The FlexLine share of a late fee reads every FlexLine the customer has held: when the customer holds an active FlexLine and no late fee and no returned payment were posted on any of the customer's FlexLines within the last 12 months, the share is late_line_clean_share; when the customer holds an active FlexLine and a returned payment but no late fee was posted on any of them within the last 12 months, the share is late_line_returned_share; in every other case the share is 1; a window of the last N months here covering entries dated fewer than N whole months before the assessment date, a month being whole once the assessment date's day of the month has reached the entry's day of the month."
      fee_before_cap: "Where a rule of this fee schedule sets a different fee level or a share for the customer's situation, that fee level takes the place of the standard late fee and every share multiplies it; all shares apply together to that one fee level, the product is then capped at the unpaid part, and it is rounded half up to the nearest cent once, at the end."
      result: "The late fee for that due date is the plan's standard late fee, late_fee_usd, never more than the unpaid part, rounded half up to the nearest cent."
    factors:
      - id: late_record_level
        effect: parameter
        decides: late_fee_level
        bindings: [late_fees_6m, late_fees_12m, late_fee_level]
        ladder:
          - when: "a late fee dated within the last 6 months"
            value: "K('repeat_late_fee_usd') = 35.00"
          - when: "no late fee dated within the last 12 months"
            value: "K('first_late_fee_usd') = 20.00"
          - when: "otherwise (a late fee within the last 12 months but none within the last 6 months)"
            value: "P('late_fee_usd') = 27.00"
        baseline:
          late_fee_level: "P('late_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: partial_payment_rule
        effect: method
        decides: partial_share
        bindings: [last_credit_id, last_credit_date, last_credit_returned, credit_stands, credit_day_after_due, unpaid_ratio, partial_share]
        ladder:
          - when: "the latest payment toward the due date has not come back and is dated no later than the last day of the grace period"
            method: "proportional: the share is the unpaid part divided by the monthly payment amount"
          - when: "the latest payment toward the due date has not come back and is dated after the last day of the grace period"
            method: "floored proportional: the unpaid part divided by the monthly payment amount, never less than late_after_grace_floor_share"
          - when: "otherwise (it came back, or nothing was credited toward the due date)"
            method: "flat: the fee is not scaled (share 1)"
        baseline:
          partial_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: late_principal_band
        effect: parameter
        decides: principal_share
        bindings: [principal_left, principal_share]
        ladder:
          - when: "principal left below late_low_principal_limit_usd"
            value: "K('late_low_principal_share') = 0.8"
          - when: "principal left at least late_low_principal_limit_usd and below late_mid_principal_limit_usd"
            value: "K('late_mid_principal_share') = 0.9"
          - when: "principal left late_mid_principal_limit_usd or more"
            value: "1"
        baseline:
          principal_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: late_fee_loan_record
        effect: parameter
        decides: loan_share
        bindings: [loan_active, loan_late_12m, loan_returns_12m, loan_share]
        ladder:
          - when: "an active personal loan, and no late fee and no returned payment on any personal loan within 12 months"
            value: "K('late_loan_clean_share') = 0.9"
          - when: "an active personal loan, and a returned payment but no late fee on any personal loan within 12 months"
            value: "K('late_loan_returned_share') = 0.95"
          - when: "otherwise"
            value: "1"
        baseline:
          loan_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: late_fee_flexline_record
        effect: parameter
        decides: line_share
        bindings: [line_active, line_late_12m, line_returns_12m, line_share]
        ladder:
          - when: "an active FlexLine, and no late fee and no returned payment on any FlexLine within 12 months"
            value: "K('late_line_clean_share') = 0.95"
          - when: "an active FlexLine, and a returned payment but no late fee on any FlexLine within 12 months"
            value: "K('late_line_returned_share') = 0.98"
          - when: "otherwise"
            value: "1"
        baseline:
          line_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: line
    baseline:
      rule: >-
        The due date the late fee is for is the plan's oldest unpaid due date as the plan shows it.
        The unpaid part of that monthly payment is the smaller of the plan's monthly payment amount and its amount past
        due less the disputed amounts of the plan's billing disputes that are still open, never below zero.
        The late fee for that due date is the plan's standard late fee, late_fee_usd, never more than the unpaid part,
        rounded half up to the nearest cent.
      params: [late_fee_usd]
    inputs:
      history:
        - {table: pos_transactions, aggregate: count, field: pos_txn_id, within_months: 12, filters: {event_type: pos_late_fee_assessed}}
        - {table: pos_transactions, aggregate: latest, field: txn_date, filters: {event_type: pos_payment_posted}}
        - {table: pos_billing_disputes, aggregate: sum, field: disputed_amount, filters: {dispute_status: open}}
        - {table: pos_transactions, aggregate: sum, field: amount, filters: {event_type: financed, payments, returns, refunds}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_late_fee_assessed}}
        - {category: line, table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_late_fee_assessed}}
      cross_category: [loan, line]

  - id: pos_ext_returned_item_fee
    base_policy_refs: [pos_evt_payments_and_fees, pos_agg_combined_exposure]
    overwrite:
      - base_policy: pos_evt_payments_and_fees
        superseded_clause: >-
          a returned-payment fee of returned_payment_fee_usd is charged once per returned payment whose return code is
          in fee_bearing_return_codes, never for R07, R10, R29 or a chargeback
        replaced_by: >-
          For a returned payment whose return code is a fee-bearing code, and only for such a returned payment, one
          returned-payment fee is charged, at the amount this fee schedule sets; a payment that came back for R07, R10,
          R29 or as a chargeback carries no returned-payment fee.
    trigger: state_due
    subject: [pos_returned_payment_fee_assessed]
    computes: fee_amount
    target_tool: assess_returned_payment_fee_f9ef5ea0
    params:
      repeat_item_fee_usd: 25.0
      first_item_fee_usd: 10.0
      low_balance_limit_usd: 1000.0
      mid_balance_limit_usd: 3000.0
      low_balance_share: 0.8
      mid_balance_share: 0.9
      loan_clean_share: 0.9
      loan_returned_share: 0.95
      line_clean_share: 0.95
      line_returned_share: 0.98
    rule: >-
      For a returned payment whose return code is a fee-bearing code, and only for such a returned payment, one
      returned-payment fee is charged, at the amount this fee schedule sets; a payment that came back for R07, R10, R29
      or as a chargeback carries no returned-payment fee. A returned-payment fee for a payment that was credited toward
      a monthly due date is decided once that due date's grace period has ended. A returned-payment fee for a payment
      that was credited toward the plan's oldest unpaid due date is set only after the plan's ledger carries the late
      fee owed for that due date. A returned-payment fee for a payment credited toward a due date that is not the plan's
      oldest unpaid due date waits on no late fee. The returned payment the fee is for is the latest returned-payment entry on the plan by return date; where
      two returned-payment entries share the latest return date, the one recorded first is taken. The payment that came
      back is the payment entry that returned-payment entry reverses, and the due date it was credited toward is the
      installment due date that payment entry names. When that latest returned payment came back for R07, R10, R29 or as
      a chargeback, or the plan has no returned-payment entry, the fee is 0.00. A returned-payment fee that works out to
      0.00 is not owed, and nothing is booked for it. The returned-payment fee for the plan's latest returned payment is
      the plan's standard returned-payment fee, returned_payment_fee_usd, never more than the amount of the payment that
      came back, rounded half up to the nearest cent. Where a rule of this fee schedule sets a different fee level, a
      share or a one-penalty limit, the fee level takes the place of the standard fee, every share multiplies it, all
      shares applying together, the one-penalty limit then applies to that product, the result is never more than the
      amount of the payment that came back, and it is rounded half up to the nearest cent once, at the end. The
      returned-item fee level follows the plan's returned-payment record: when the plan shows two or more
      returned-payment entries dated within the last 6 months and at least one late fee dated within the last 6 months,
      the returned-item fee level is repeat_item_fee_usd; when the plan shows exactly one returned-payment entry dated
      within the last 6 months and no late fee dated within the last 12 months, the returned-item fee level is
      first_item_fee_usd; for any other plan the returned-item fee level is returned_payment_fee_usd; a window of the
      last N months here covering entries dated fewer than N whole months before the assessment date, a month being
      whole once the assessment date's day of the month has reached the entry's day of the month. The one-penalty limit
      of a returned-payment fee follows the event the return belongs to: when the payment that came back was credited
      toward a monthly due date, is dated no later than the last day of that due date's grace period, and a late fee for
      that due date still stands on the plan after any waiver of it, the return and that late fee are one event, and the
      returned-payment fee is only the part of the product above that standing late fee, never below 0.00; when the
      payment that came back was credited toward a monthly due date and either is dated after the last day of that due
      date's grace period or no late fee for that due date still stands, the returned-payment fee is the product but
      never more than the plan's monthly payment amount; when the payment that came back was not credited toward any
      monthly due date, the product applies with no one-penalty limit; the grace period's last day being the due date
      plus late_fee_grace_days calendar days, counted from the day after the due date. The balance share of a
      returned-payment fee reads the plan's ledger balance, which is the financed charge plus monthly interest, billed
      deferred interest, late fees, returned-payment fees and returned payments, less payments, provider refunds and
      waivers: a ledger balance below low_balance_limit_usd gives low_balance_share, a ledger balance of at least
      low_balance_limit_usd and below mid_balance_limit_usd gives mid_balance_share, and a ledger balance of
      mid_balance_limit_usd or more gives 1. The personal-loan share of a returned-payment fee reads every Larkspur
      personal loan the customer has held: when the customer holds an active personal loan and no late fee and no
      returned payment were posted on any of the customer's personal loans within the last 12 months, the share is
      loan_clean_share; when the customer holds an active personal loan and a returned payment but no late fee was
      posted on any of them within the last 12 months, the share is loan_returned_share; in every other case the share
      is 1; a window of the last N months here covering entries dated fewer than N whole months before the assessment
      date, a month being whole once the assessment date's day of the month has reached the entry's day of the month.
      The FlexLine share of a returned-payment fee reads every FlexLine the customer has held: when the customer holds
      an active FlexLine and no late fee and no returned payment were posted on any of the customer's FlexLines within
      the last 12 months, the share is line_clean_share; when the customer holds an active FlexLine and a returned
      payment but no late fee was posted on any of them within the last 12 months, the share is line_returned_share; in
      every other case the share is 1; a window of the last N months here covering entries dated fewer than N whole
      months before the assessment date, a month being whole once the assessment date's day of the month has reached the
      entry's day of the month.
    prerequisite:
      - problem: pos_ext_late_fee_schedule
        kind: value_input
        gate: same_due_late
        form: state
        policy_source: >-
          A returned-payment fee for a payment that was credited toward the plan's oldest unpaid due date is set only after the plan's ledger carries the late fee owed for that due date.
        condition: >-
          When the due date the plan's latest returned payment was credited toward is the plan's oldest unpaid due date and has passed its grace period with
          part of that monthly payment unpaid beyond the amounts under open billing disputes, a pos_late_fee_assessed
          entry with that installment_due_date stands on the plan.
        resolved_by: assess_late_fee_02ab9d3a
        effect: >-
          Booking that late fee makes it the standing late fee of the same event, so the one-penalty limit charges only
          the part of the fee product above it, and it adds a late fee within the last 6 months to the plan's record,
          which can raise the returned-item fee level.
    cross_category:
      - category: loan
        as: history
        reads: [status, loan_transactions.event_type]
        note: The personal-loan share of a returned-payment fee is decided from whether the customer holds an active personal loan and from late fees and returned payments on all of the customer's personal loans within 12 months.
      - category: line
        as: history
        reads: [status, line_transactions.event_type]
        note: The FlexLine share of a returned-payment fee is decided from whether the customer holds an active FlexLine and from late fees and returned payments on all of the customer's FlexLines within 12 months.
    compute:
      - item_amount: "LATEST('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_returned')"
      - item_code: "LATEST('pos_transactions','return_code', date_field='txn_date', event_type='pos_payment_returned')"
      - fee_bearing_item: "item_amount != None and item_code != 'R07' and item_code != 'R10' and item_code != 'R29' and item_code != 'CB'"
      - returns_6m: "COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_payment_returned')"
      - late_fees_6m: "COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_late_fee_assessed')"
      - late_fees_12m: "COUNT('pos_transactions', within_months=12, date_field='txn_date', event_type='pos_late_fee_assessed')"
      - item_fee_level: "K('repeat_item_fee_usd') if (returns_6m >= 2 and late_fees_6m >= 1) else (K('first_item_fee_usd') if (returns_6m == 1 and late_fees_12m == 0) else P('returned_payment_fee_usd'))"
      - paid_id: "LATEST('pos_transactions','related_txn_id', date_field='txn_date', event_type='pos_payment_returned')"
      - item_due: "LATEST('pos_transactions','installment_due_date', date_field='txn_date', pos_txn_id=paid_id) if paid_id != None else None"
      - paid_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', pos_txn_id=paid_id) if paid_id != None else None"
      - credited_due: "item_due != None and item_due != ''"
      - within_grace: "DAYS(item_due, paid_date) <= P('late_fee_grace_days') if credited_due else False"
      - same_due_late_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_late_fee_assessed', installment_due_date=item_due) if credited_due else None"
      - same_due_late: "(SUM('pos_transactions','amount', event_type='pos_late_fee_assessed', installment_due_date=item_due) - SUM('pos_transactions','amount', event_type='pos_fee_waived', related_txn_id=same_due_late_id)) if same_due_late_id != None else 0"
      - one_event: "credited_due and within_grace and same_due_late > 0"
      - penalty_offset: "same_due_late if one_event else 0"
      - penalty_cap: "F('monthly_payment_amount') if (credited_due and not one_event) else item_amount"
      - ledger_balance: "SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_purchase_financed') + SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_interest_charged') + SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_deferred_interest_billed') + SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_late_fee_assessed') + SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_returned_payment_fee_assessed') + SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_returned') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_posted') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_merchant_refund_posted') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_fee_waived')"
      - balance_share: "K('low_balance_share') if ledger_balance < K('low_balance_limit_usd') else (K('mid_balance_share') if ledger_balance < K('mid_balance_limit_usd') else 1)"
      - loan_active: "EXISTS('loan', status='active')"
      - loan_late_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - loan_returns_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned')"
      - loan_share: "K('loan_clean_share') if (loan_active and loan_late_12m == 0 and loan_returns_12m == 0) else (K('loan_returned_share') if (loan_active and loan_late_12m == 0 and loan_returns_12m >= 1) else 1)"
      - line_active: "EXISTS('line', status='active')"
      - line_late_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - line_returns_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_payment_returned')"
      - line_share: "K('line_clean_share') if (line_active and line_late_12m == 0 and line_returns_12m == 0) else (K('line_returned_share') if (line_active and line_late_12m == 0 and line_returns_12m >= 1) else 1)"
      - fee_product: "item_fee_level * balance_share * loan_share * line_share"
      - result: "int(RND((MN(MX(0, fee_product - penalty_offset), penalty_cap, item_amount)) * 100, 6) + 0.5) / 100 if fee_bearing_item else 0"
    compute_basis:
      item_amount: "The returned payment the fee is for is the latest returned-payment entry on the plan by return date; where two returned-payment entries share the latest return date, the one recorded first is taken."
      item_code: "The returned payment the fee is for is the latest returned-payment entry on the plan by return date; where two returned-payment entries share the latest return date, the one recorded first is taken."
      fee_bearing_item: "When that latest returned payment came back for R07, R10, R29 or as a chargeback, or the plan has no returned-payment entry, the fee is 0.00."
      returns_6m: "when the plan shows two or more returned-payment entries dated within the last 6 months and at least one late fee dated within the last 6 months, the returned-item fee level is repeat_item_fee_usd"
      late_fees_6m: "when the plan shows two or more returned-payment entries dated within the last 6 months and at least one late fee dated within the last 6 months, the returned-item fee level is repeat_item_fee_usd"
      late_fees_12m: "when the plan shows exactly one returned-payment entry dated within the last 6 months and no late fee dated within the last 12 months, the returned-item fee level is first_item_fee_usd"
      item_fee_level: "The returned-item fee level follows the plan's returned-payment record: when the plan shows two or more returned-payment entries dated within the last 6 months and at least one late fee dated within the last 6 months, the returned-item fee level is repeat_item_fee_usd; when the plan shows exactly one returned-payment entry dated within the last 6 months and no late fee dated within the last 12 months, the returned-item fee level is first_item_fee_usd; for any other plan the returned-item fee level is returned_payment_fee_usd; a window of the last N months here covering entries dated fewer than N whole months before the assessment date, a month being whole once the assessment date's day of the month has reached the entry's day of the month."
      paid_id: "The payment that came back is the payment entry that returned-payment entry reverses, and the due date it was credited toward is the installment due date that payment entry names."
      item_due: "The payment that came back is the payment entry that returned-payment entry reverses, and the due date it was credited toward is the installment due date that payment entry names."
      paid_date: "when the payment that came back was credited toward a monthly due date, is dated no later than the last day of that due date's grace period, and a late fee for that due date still stands on the plan after any waiver of it, the return and that late fee are one event"
      credited_due: "when the payment that came back was not credited toward any monthly due date, the product applies with no one-penalty limit"
      within_grace: "the grace period's last day being the due date plus late_fee_grace_days calendar days, counted from the day after the due date"
      same_due_late_id: "a late fee for that due date still stands on the plan after any waiver of it"
      same_due_late: "a late fee for that due date still stands on the plan after any waiver of it"
      one_event: "when the payment that came back was credited toward a monthly due date, is dated no later than the last day of that due date's grace period, and a late fee for that due date still stands on the plan after any waiver of it, the return and that late fee are one event"
      penalty_offset: "the returned-payment fee is only the part of the product above that standing late fee, never below 0.00"
      penalty_cap: "when the payment that came back was credited toward a monthly due date and either is dated after the last day of that due date's grace period or no late fee for that due date still stands, the returned-payment fee is the product but never more than the plan's monthly payment amount"
      ledger_balance: "The balance share of a returned-payment fee reads the plan's ledger balance, which is the financed charge plus monthly interest, billed deferred interest, late fees, returned-payment fees and returned payments, less payments, provider refunds and waivers"
      balance_share: "a ledger balance below low_balance_limit_usd gives low_balance_share, a ledger balance of at least low_balance_limit_usd and below mid_balance_limit_usd gives mid_balance_share, and a ledger balance of mid_balance_limit_usd or more gives 1."
      loan_active: "when the customer holds an active personal loan and no late fee and no returned payment were posted on any of the customer's personal loans within the last 12 months, the share is loan_clean_share"
      loan_late_12m: "when the customer holds an active personal loan and no late fee and no returned payment were posted on any of the customer's personal loans within the last 12 months, the share is loan_clean_share"
      loan_returns_12m: "when the customer holds an active personal loan and a returned payment but no late fee was posted on any of them within the last 12 months, the share is loan_returned_share"
      loan_share: "The personal-loan share of a returned-payment fee reads every Larkspur personal loan the customer has held: when the customer holds an active personal loan and no late fee and no returned payment were posted on any of the customer's personal loans within the last 12 months, the share is loan_clean_share; when the customer holds an active personal loan and a returned payment but no late fee was posted on any of them within the last 12 months, the share is loan_returned_share; in every other case the share is 1; a window of the last N months here covering entries dated fewer than N whole months before the assessment date, a month being whole once the assessment date's day of the month has reached the entry's day of the month."
      line_active: "when the customer holds an active FlexLine and no late fee and no returned payment were posted on any of the customer's FlexLines within the last 12 months, the share is line_clean_share"
      line_late_12m: "when the customer holds an active FlexLine and no late fee and no returned payment were posted on any of the customer's FlexLines within the last 12 months, the share is line_clean_share"
      line_returns_12m: "when the customer holds an active FlexLine and a returned payment but no late fee was posted on any of them within the last 12 months, the share is line_returned_share"
      line_share: "The FlexLine share of a returned-payment fee reads every FlexLine the customer has held: when the customer holds an active FlexLine and no late fee and no returned payment were posted on any of the customer's FlexLines within the last 12 months, the share is line_clean_share; when the customer holds an active FlexLine and a returned payment but no late fee was posted on any of them within the last 12 months, the share is line_returned_share; in every other case the share is 1; a window of the last N months here covering entries dated fewer than N whole months before the assessment date, a month being whole once the assessment date's day of the month has reached the entry's day of the month."
      fee_product: "Where a rule of this fee schedule sets a different fee level, a share or a one-penalty limit, the fee level takes the place of the standard fee, every share multiplies it, all shares applying together, the one-penalty limit then applies to that product, the result is never more than the amount of the payment that came back, and it is rounded half up to the nearest cent once, at the end."
      result: "The returned-payment fee for the plan's latest returned payment is the plan's standard returned-payment fee, returned_payment_fee_usd, never more than the amount of the payment that came back, rounded half up to the nearest cent."
    factors:
      - id: returned_item_level
        effect: parameter
        decides: item_fee_level
        bindings: [returns_6m, late_fees_6m, late_fees_12m, item_fee_level]
        ladder:
          - when: "two or more returned-payment entries within the last 6 months and at least one late fee within the last 6 months"
            value: "K('repeat_item_fee_usd') = 25.00"
          - when: "exactly one returned-payment entry within the last 6 months and no late fee within the last 12 months"
            value: "K('first_item_fee_usd') = 10.00"
          - when: "otherwise"
            value: "P('returned_payment_fee_usd') = 15.00"
        baseline:
          item_fee_level: "P('returned_payment_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: one_penalty_limit_rule
        effect: method
        decides: penalty_offset
        bindings: [paid_id, item_due, paid_date, credited_due, within_grace, same_due_late_id, same_due_late, one_event, penalty_offset, penalty_cap]
        ladder:
          - when: "the payment that came back was credited toward a due date, is dated no later than the last day of that due date's grace period, and a late fee for that due date still stands"
            method: "one event: only the part of the fee product above the standing late fee is charged, never below 0.00"
          - when: "the payment that came back was credited toward a due date and either is dated after that due date's grace period or no late fee for that due date still stands"
            method: "capped: the fee product, never more than the plan's monthly payment amount"
          - when: "otherwise (the payment that came back was not credited toward any due date)"
            method: "unlimited: the fee product applies as it is"
        baseline:
          penalty_offset: "0"
          penalty_cap: "item_amount"
        evidence: [history, date]
        cross_difficulty: null
      - id: returned_fee_balance_band
        effect: parameter
        decides: balance_share
        bindings: [ledger_balance, balance_share]
        ladder:
          - when: "ledger balance below low_balance_limit_usd"
            value: "K('low_balance_share') = 0.8"
          - when: "ledger balance at least low_balance_limit_usd and below mid_balance_limit_usd"
            value: "K('mid_balance_share') = 0.9"
          - when: "ledger balance mid_balance_limit_usd or more"
            value: "1"
        baseline:
          balance_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: returned_fee_loan_record
        effect: parameter
        decides: loan_share
        bindings: [loan_active, loan_late_12m, loan_returns_12m, loan_share]
        ladder:
          - when: "an active personal loan, and no late fee and no returned payment on any personal loan within 12 months"
            value: "K('loan_clean_share') = 0.9"
          - when: "an active personal loan, and a returned payment but no late fee on any personal loan within 12 months"
            value: "K('loan_returned_share') = 0.95"
          - when: "otherwise"
            value: "1"
        baseline:
          loan_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: returned_fee_flexline_record
        effect: parameter
        decides: line_share
        bindings: [line_active, line_late_12m, line_returns_12m, line_share]
        ladder:
          - when: "an active FlexLine, and no late fee and no returned payment on any FlexLine within 12 months"
            value: "K('line_clean_share') = 0.95"
          - when: "an active FlexLine, and a returned payment but no late fee on any FlexLine within 12 months"
            value: "K('line_returned_share') = 0.98"
          - when: "otherwise"
            value: "1"
        baseline:
          line_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: line
    baseline:
      rule: >-
        The returned-payment fee for the plan's latest returned payment is the plan's standard returned-payment fee,
        returned_payment_fee_usd, never more than the amount of the payment that came back, rounded half up to the nearest cent.
      params: [returned_payment_fee_usd]
    inputs:
      history:
        - {table: pos_transactions, aggregate: latest, field: amount, filters: {event_type: pos_payment_returned}}
        - {table: pos_transactions, aggregate: latest, field: installment_due_date, filters: {pos_txn_id: the payment that came back}}
        - {table: pos_transactions, aggregate: sum, field: amount, filters: {event_type: pos_late_fee_assessed, installment_due_date: that due date}}
        - {table: pos_transactions, aggregate: count, field: pos_txn_id, within_months: 6, filters: {event_type: pos_payment_returned}}
        - {table: pos_transactions, aggregate: sum, field: amount, filters: {event_type: all ledger families}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_late_fee_assessed}}
        - {category: line, table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_payment_returned}}
      cross_category: [loan, line]

  - id: pos_ext_payment_reset
    base_policy_refs: [pos_plan_terms_and_interest, pos_deferred_interest, pos_evt_provider_refunds, pos_evt_payments_and_fees, pos_agg_combined_exposure]
    overwrite:
      - base_policy: pos_deferred_interest
        superseded_clause: >-
          If it fails, the whole memo - every period since the purchase date, not only the unpaid part - is billed to
          the balance on the day after promo_end_date and the plan continues at the plan APR for the rest of its term
          with monthly interest charged from then on.
        replaced_by: >-
          If it fails, the whole memo - every period since the purchase date, not only the unpaid part - is billed to
          the balance on the day after promo_end_date and the plan continues for the rest of its term with monthly
          interest charged from then on, at the plan APR, or, for a plan whose customer has asked for a payment reset
          under the reset schedule, and only for such a plan, at the reset rate from the reset onward, interest then running on the plan balance excluding fees and excluding the part of the reset's deferred-interest part not yet repaid.
      - base_policy: pos_plan_terms_and_interest
        superseded_clause: >-
          AutoPay can be turned on or off at any time and carries no rate discount.
        replaced_by: >-
          AutoPay can be turned on or off at any time and carries no rate discount, except that a payment reset under
          the reset schedule counts the AutoPay debits already credited on the plan as that schedule sets.
      - base_policy: pos_plan_terms_and_interest
        superseded_clause: >-
          a level payment that repays the financed amount at the plan APR over the term (monthly rate = plan APR divided
          by 1200) for deferred-interest, reduced-APR and standard plans, and the financed amount divided equally over
          the term for no-interest plans
        replaced_by: >-
          at activation, a level payment that repays the financed amount at the plan APR over the term (monthly rate =
          plan APR divided by 1200) for deferred-interest, reduced-APR and standard plans, and the financed amount
          divided equally over the term for no-interest plans, a payment that stays in force until the customer asks
          for a payment reset under the reset schedule, which alone sets a new payment and plan APR from the reset
          onward
      - base_policy: pos_evt_provider_refunds
