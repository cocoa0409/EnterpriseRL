      returned_payment_fee_usd: 15.0
      fee_bearing_return_codes: ["R01", "R02", "R03", "R04", "R08", "R09", "R16", "R20"]
      courtesy_waivers_per_12_months: 2
      fee_waiver_request_window_days: 45
      refund_treatment: "reduces the plan balance on the refund date; it is not a payment and does not satisfy or advance a monthly payment due"
      payment_recast_after_refund: "no; the term shortens"
      full_refund_outcome: "plan cancelled; interest and fees still owed on the plan are waived, the deferred interest memo is cleared, and payments already made are refunded to the patient"
      credit_balance_refund_business_days: 10
      dispute_window_days: 60
      dispute_late_fee_protection: true
      dispute_promo_protection: false
      post_dispute_payment_days: 0
      autopay_rate_discount_percent: 0.0
      due_day_changes_per_plan: 1
      prepayment_penalty_usd: 0.0
      delinquency_reporting_days_past_due: 30
      charge_off_days_past_due: 120
      responsible_party_allowed: true
      prequalification_soft_pull: true
      max_open_plans_counted_per_provider: 2
      promo_expiration_notice_days: 0
      provider_refund_posting_business_days: 3

# ---- data flow (every write is an event) ----
events:
  - type: pos_application_submitted
    target: pos_plans
    mutation: create
    meaning: A patient or responsible party applies for a PracticePay plan at an enrolled provider.
    grain: One row per application.
    fields:
      customer_id: Applicant (the borrower; the responsible party for a minor or a pet).
      merchant_id: Provider.
      variant_name: Plan chosen.
      application_date: Date applied.
    triggers: []
  - type: pos_application_approved
    target: pos_plans
    mutation: {transition: {from: applied, to: approved}}
    meaning: The application is approved for an amount under the chosen plan.
    grain: One row per transaction.
    fields:
      approval_date: Date approved.
      approval_expiration_date: Last date the provider can submit the charge.
      approved_amount: Amount approved.
      plan_apr: Plan APR.
    triggers: []
  - type: pos_application_declined
    target: pos_plans
    mutation: {transition: {from: applied, to: declined}}
    meaning: The application is declined.
    grain: One row per transaction.
    fields:
      status: Set to declined.
    triggers: []
  - type: pos_approval_expired
    target: pos_plans
    mutation: {transition: {from: approved, to: expired}}
    meaning: The approval lapses without a treatment charge.
    grain: One row per transaction.
    fields:
      status: Set to expired.
    triggers: []
  - type: pos_plan_activated
    target: pos_plans
    mutation: {transition: {from: approved, to: active}}
    meaning: The provider submits the treatment charge and the plan starts.
    grain: One row per transaction.
    fields:
      purchase_date: Date of service.
      financed_amount: Amount charged by the provider.
      promo_end_date: End of the promotional period, for promotional plans.
      term_months: Number of payments.
      monthly_payment_amount: Monthly payment.
      payment_due_day: Due day.
      next_due_date: First due date.
    triggers:
      - event: pos:pos_purchase_financed
        map: {txn_date: purchase_date, amount: financed_amount, merchant_id: merchant_id}
  - type: pos_purchase_financed
    target: pos_transactions
    meaning: The provider's treatment charge is financed under the plan.
    grain: One row per treatment charge.
    distinguish_by: [txn_date, amount]
    fields:
      txn_date: Date of service.
      amount: Amount financed.
      merchant_id: Provider.
    account: plan_balance
    direction: in
    triggers: []
  - type: pos_merchant_refund_posted
    target: pos_transactions
    meaning: The provider refunds all or part of a financed charge to the plan.
    grain: One row per provider refund.
    distinguish_by: [refund_reference]
    fields:
      txn_date: Date the refund posted.
      amount: Amount refunded.
      merchant_id: Provider.
      related_txn_id: Financed charge refunded.
      refund_reference: Provider's refund reference.
    account: plan_balance
    direction: out
    triggers:
      - event: pos:pos_account_status_updated
        map: {}
  - type: pos_payment_posted
    target: pos_transactions
    meaning: A payment from the patient is credited to the plan.
    grain: One row per payment received.
    distinguish_by: [txn_date, payment_channel, amount]
    fields:
      txn_date: Effective date.
      amount: Payment.
      payment_channel: How paid.
      bank_account_id: Account debited, for ACH payments.
      installment_due_date: Oldest monthly due date the payment is applied toward.
    account: plan_balance
    direction: out
    triggers:
      - event: pos:pos_account_status_updated
        map: {}
  - type: pos_payment_returned
    target: pos_transactions
    meaning: A posted payment is returned unpaid or charged back and is reversed.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Date the return was received.
      amount: Amount returned.
      related_txn_id: Payment returned.
      return_code: Return reason code.
      payment_channel: Channel of the original payment.
      bank_account_id: Account of the original payment.
    account: plan_balance
    direction: in
    triggers:
      - event: pos:pos_account_status_updated
        map: {}
      - event: pos:pos_returned_payment_fee_assessed
        when: {return_code: [R01, R02, R03, R04, R08, R09, R16, R20]}
        map: {related_txn_id: pos_txn_id, txn_date: txn_date}
  - type: pos_late_fee_assessed
    target: pos_transactions
    meaning: A late fee is charged because a monthly payment stayed unpaid past the grace period.
    grain: One row per monthly due date.
    distinguish_by: [installment_due_date]
    fields:
      txn_date: Assessment date.
      amount: Fee.
      installment_due_date: Monthly due date the fee is for.
    account: plan_balance
    direction: in
    triggers:
      - event: pos:pos_account_status_updated
        map: {}
  - type: pos_returned_payment_fee_assessed
    target: pos_transactions
    meaning: A returned-payment fee is charged for one returned payment.
    grain: One row per returned payment.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Assessment date.
      amount: Fee.
      related_txn_id: The return line.
    account: plan_balance
    direction: in
    triggers:
      - event: pos:pos_account_status_updated
        map: {}
  - type: pos_fee_waived
    target: pos_transactions
    meaning: A late or returned-payment fee, or an interest charge, is waived.
    grain: One row per fee or interest line waived.
    distinguish_by: [related_txn_id]
    fields:
      txn_date: Waiver date.
      amount: Amount waived.
      related_txn_id: Fee or interest line waived.
      waiver_reason: Basis.
    account: plan_balance
    direction: out
    triggers:
      - event: pos:pos_account_status_updated
        map: {}
  - type: pos_interest_charged
    target: pos_transactions
    meaning: Monthly interest is charged on a reduced-APR or standard plan at statement closing.
    grain: One row per statement month.
    distinguish_by: [statement_month]
    fields:
      txn_date: Statement closing date.
      amount: Interest for the statement period.
      statement_month: Billing month.
    account: plan_balance
    direction: in
    triggers:
      - event: pos:pos_account_status_updated
        map: {}
  - type: pos_deferred_interest_accrued
    target: pos_transactions
    meaning: Deferred interest for one statement period is posted to the memo of a deferred-interest plan.
    grain: One row per statement month.
    distinguish_by: [statement_month]
    fields:
      txn_date: Statement closing date.
      amount: Deferred interest accrued for the period.
      statement_month: Billing month.
    account: deferred_interest_memo
    direction: in
    triggers: []
  - type: pos_deferred_interest_billed
    target: pos_transactions
    meaning: All deferred interest in the memo is billed to the plan balance because the plan was not paid in full by the end of the promotional period.
    grain: One row per plan (it happens once).
    distinguish_by: [txn_date]
    fields:
      txn_date: The day after promo_end_date.
      amount: Deferred interest billed (the full memo).
    account: plan_balance
    direction: in
    triggers:
      - event: pos:pos_deferred_interest_cleared
        map: {txn_date: txn_date, amount: amount, clear_reason: billed_to_balance}
      - event: pos:pos_account_status_updated
        map: {}
  - type: pos_deferred_interest_cleared
    target: pos_transactions
    meaning: The deferred interest memo is cleared - forgiven, moved to the balance by billing, or removed by a full provider refund.
    grain: One row per plan (it happens once).
    distinguish_by: [clear_reason]
    fields:
      txn_date: Date cleared.
      amount: Memo amount cleared.
      clear_reason: Why it was cleared.
    account: deferred_interest_memo
    direction: out
    triggers: []
  - type: pos_plan_terms_updated
    target: pos_plans
    mutation: update
    meaning: The monthly payment, due day or AutoPay setting of the plan changes.
    grain: One row per transaction.
    fields:
      monthly_payment_amount: Monthly payment in force.
      payment_due_day: Due day in force.
      next_due_date: Next due date in force.
      autopay_enrolled: AutoPay on or off.
    triggers: []
  - type: pos_account_status_updated
    target: pos_plans
    mutation: update
    meaning: Balances and delinquency fields of the plan are refreshed after a ledger line posts.
    grain: One row per transaction.
    fields:
      plan_balance: Amount owed.
      deferred_interest_memo: Unbilled deferred interest.
      amount_past_due: Amount past due.
      next_due_date: Oldest unpaid due date.
    triggers: []
  - type: pos_plan_paid_off
    target: pos_plans
    mutation: {transition: [{from: active, to: paid_off}, {from: charged_off, to: paid_off}]}
    meaning: The plan balance reaches 0.00 and the plan closes.
    grain: One row per transaction.
    fields:
      closed_date: Date paid off.
      closure_reason: paid_in_full_within_promo when the promotional payoff test is met, paid_in_full otherwise.
    triggers:
      - event: pos:pos_deferred_interest_cleared
        when: {closure_reason: paid_in_full_within_promo}
        map: {txn_date: closed_date, clear_reason: forgiven_paid_within_promo}
  - type: pos_plan_cancelled
    target: pos_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The plan is cancelled because the provider refunded the full financed amount.
    grain: One row per transaction.
    fields:
      closed_date: Date cancelled.
      closure_reason: Set to merchant_full_refund.
    triggers:
      - event: pos:pos_deferred_interest_cleared
        map: {txn_date: closed_date, clear_reason: merchant_full_refund}
  - type: pos_plan_charged_off
    target: pos_plans
    mutation: {transition: {from: active, to: charged_off}}
    meaning: The plan is charged off for delinquency.
    grain: One row per transaction.
    fields:
      closed_date: Date charged off.
      closure_reason: Set to charged_off.
    triggers: []

# ---- derived measures ----
measures:
  - id: pos_msr_open_disputed_amount
    window: As of today.
    measure: Sum of disputed_amount of this plan's pos_billing_disputes rows with dispute_status = open.
  - id: pos_msr_courtesy_waivers_12m
    window: Rolling 12 months ending today (today and the 364 days before it).
    measure: Count of pos_fee_waived rows on this plan with waiver_reason = courtesy and txn_date in the window.
  - id: pos_msr_open_plans
    window: As of today.
    measure: Count of the customer's pos_plans in approved or active status, in total and at the same merchant_id.
  - id: pos_msr_open_plan_balances
    window: As of today.
    measure: Sum of plan_balance of the customer's pos_plans in active status plus approved_amount of those in approved status.
  - id: pos_msr_days_past_due
    window: As of today.
    measure: Calendar days from next_due_date to today when next_due_date is earlier than today; 0 otherwise.

# ---- policies ----
policies:
  - id: pos_agg_multi_holding
    subject: [pos_application_submitted]
    rule: >-
      A customer may hold at most max_per_customer PracticePay plans in approved or active status at the same time, and
      at one provider no more than the chosen plan's limit of open plans per provider. The customer holds fewer than the maximum number of open PracticePay plans, and fewer than the plan's per-provider limit at the chosen provider.
      Paid-off, cancelled, expired and declined plans do not count. Each new treatment needs its own plan.
    eligibility:
      - id: open_plan_cap
        applies_to: [pos_application_submitted]
        kind: authorization
        condition: The customer holds fewer than the maximum number of open PracticePay plans, and fewer than the plan's per-provider limit at the chosen provider.
        evidence_fields: [pos_plans.customer_id, pos_plans.status, pos_plans.merchant_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.customer_id]
          action_bindings:
            pos_plans.customer_id: customer_id
    params:
      max_per_customer: 3
      per_tier:
        "PracticePay 6-Month Deferred Interest Plan": {max_open_plans_counted_per_provider: "=max_open_plans_counted_per_provider"}
        "PracticePay 6-Month No Interest Plan": {max_open_plans_counted_per_provider: "=max_open_plans_counted_per_provider"}
        "PracticePay 12-Month Deferred Interest Plan": {max_open_plans_counted_per_provider: "=max_open_plans_counted_per_provider"}
        "PracticePay 12-Month No Interest Plan": {max_open_plans_counted_per_provider: "=max_open_plans_counted_per_provider"}
        "PracticePay 24-Month Reduced APR Plan": {max_open_plans_counted_per_provider: "=max_open_plans_counted_per_provider"}
        "PracticePay 48-Month Reduced APR Plan": {max_open_plans_counted_per_provider: "=max_open_plans_counted_per_provider"}
        "PracticePay 60-Month Extended Plan": {max_open_plans_counted_per_provider: "=max_open_plans_counted_per_provider"}
    measures: [pos_msr_open_plans]

  - id: pos_agg_combined_exposure
    subject: [pos_application_submitted, pos_application_approved, pos_application_declined]
    rule: >-
      PracticePay plans are assessed together with the customer's other Larkspur credit. The plan balances of the
      customer's active PracticePay plans plus the approved amounts of approved plans plus the new approved amount may
      not exceed combined_pos_cap_usd; a new approval is reduced to fit, and declined if what fits is below the plan's
      minimum financed amount. A customer whose Larkspur personal loan is charged off, or more than personal_loan_max_days_past_due days past due on the application date, is declined for a new PracticePay plan.
      A customer with an open billing dispute may still apply.
    eligibility:
      - id: personal_loan_standing
        applies_to: [pos_application_approved]
        kind: authorization
        condition: A customer whose Larkspur personal loan is charged off, or more than personal_loan_max_days_past_due days past due on the application date, is declined for a new PracticePay plan.
        evidence_fields: [loans.customer_id, loans.status, loans.next_due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loans.customer_id]
          action_bindings:
            loans.customer_id: customer_id
    params:
      combined_pos_cap_usd: 40000.00
      personal_loan_max_days_past_due: 30
    formula:
      within_cap: plan_balance + approved_amount <= combined_pos_cap_usd
    measures: [pos_msr_open_plan_balances]

  - id: pos_application_and_activation
    subject: [pos_application_submitted, pos_application_approved, pos_application_declined, pos_approval_expired, pos_plan_activated, pos_purchase_financed]
    rule: >-
      A PracticePay application is taken only at a provider whose enrollment status is active. The chosen plan must be offered for the provider's specialty.
      The applicant must meet the plan's minimum credit score; a parent or guardian may apply as the borrower for a minor
      patient or for a pet's treatment when responsible_party_allowed is true. The approved amount lies between the plan's minimum and maximum financed amounts.
      The approval stays usable until approval_expiration_date, the approval date plus the plan's approval validity days.
      The provider's treatment charge activates the plan only when the current date is no later than the approval expiration date, the approval date plus the plan's approval validity days.
      The validity period is counted in calendar days starting the day after the approval date, and a charge submitted on the last day is in time.
      An approval not used in time expires. The charge may not exceed the approved amount and may not be below the plan's minimum financed amount; a plan carries max_charges_per_plan charge. A treatment charge is financed only on a plan in active status, the status its activation gives it. On activation the purchase date is the date of service, the promotional period ends promo_months calendar months after the purchase date (the day before the same day of that month; the last day of the month when that day does not exist), the first due date is the first due day at least 25 calendar days after the purchase date, and the monthly payment follows the plan's payment method.
    eligibility:
      - id: provider_active
        applies_to: [pos_application_submitted, pos_plan_activated]
        kind: state
        condition: A PracticePay application is taken only at a provider whose enrollment status is active.
        evidence_fields: [pos_merchants.enrollment_status, pos_merchants.merchant_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_merchants.merchant_id]
          action_bindings:
            pos_merchants.merchant_id: merchant_id
        state_contract:
          field: pos_merchants.enrollment_status
          allowed: [active]
      - id: plan_for_specialty
        applies_to: [pos_application_submitted]
        kind: authorization
        condition: The chosen plan must be offered for the provider's specialty.
        evidence_fields: [pos_merchants.specialty, pos_merchants.merchant_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_merchants.merchant_id]
          action_bindings:
            pos_merchants.merchant_id: merchant_id
      - id: approval_in_time
        applies_to: [pos_plan_activated]
        kind: time
        condition: The provider's treatment charge activates the plan only when the current date is no later than the approval expiration date, the approval date plus the plan's approval validity days.
        evidence_fields: [pos_plans.approval_date, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the approval date
          anchor_source: pos_plans.approval_date
          relation: not_after
          duration_source: variants.approval_validity_days
          unit: calendar_days
          counting_rule: The validity period is counted in calendar days starting the day after the approval date, and a charge submitted on the last day is in time.
          boundary: inclusive
      - id: charge_on_active_plan
        applies_to: [pos_purchase_financed]
        kind: state
        condition: A treatment charge is financed only on a plan in active status, the status its activation gives it.
        evidence_fields: [pos_plans.status, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        state_contract:
          field: pos_plans.status
          allowed: [active]
    params:
      responsible_party_allowed: "=responsible_party_allowed"
      max_charges_per_plan: "=max_charges_per_plan"
      first_due_date_min_days_after_purchase: 25
      per_tier:
        "PracticePay 6-Month Deferred Interest Plan": {min_credit_score: "=min_credit_score", min_financed_amount_usd: "=min_financed_amount_usd", max_financed_amount_usd: "=max_financed_amount_usd", eligible_specialties: "=eligible_specialties", approval_validity_days: "=approval_validity_days", promo_months: "=promo_months", prequalification_soft_pull: "=prequalification_soft_pull"}
        "PracticePay 6-Month No Interest Plan": {min_credit_score: "=min_credit_score", min_financed_amount_usd: "=min_financed_amount_usd", max_financed_amount_usd: "=max_financed_amount_usd", eligible_specialties: "=eligible_specialties", approval_validity_days: "=approval_validity_days", promo_months: "=promo_months", prequalification_soft_pull: "=prequalification_soft_pull"}
        "PracticePay 12-Month Deferred Interest Plan": {min_credit_score: "=min_credit_score", min_financed_amount_usd: "=min_financed_amount_usd", max_financed_amount_usd: "=max_financed_amount_usd", eligible_specialties: "=eligible_specialties", approval_validity_days: "=approval_validity_days", promo_months: "=promo_months", prequalification_soft_pull: "=prequalification_soft_pull"}
        "PracticePay 12-Month No Interest Plan": {min_credit_score: "=min_credit_score", min_financed_amount_usd: "=min_financed_amount_usd", max_financed_amount_usd: "=max_financed_amount_usd", eligible_specialties: "=eligible_specialties", approval_validity_days: "=approval_validity_days", promo_months: "=promo_months", prequalification_soft_pull: "=prequalification_soft_pull"}
        "PracticePay 24-Month Reduced APR Plan": {min_credit_score: "=min_credit_score", min_financed_amount_usd: "=min_financed_amount_usd", max_financed_amount_usd: "=max_financed_amount_usd", eligible_specialties: "=eligible_specialties", approval_validity_days: "=approval_validity_days", promo_months: "=promo_months", prequalification_soft_pull: "=prequalification_soft_pull"}
        "PracticePay 48-Month Reduced APR Plan": {min_credit_score: "=min_credit_score", min_financed_amount_usd: "=min_financed_amount_usd", max_financed_amount_usd: "=max_financed_amount_usd", eligible_specialties: "=eligible_specialties", approval_validity_days: "=approval_validity_days", promo_months: "=promo_months", prequalification_soft_pull: "=prequalification_soft_pull"}
        "PracticePay 60-Month Extended Plan": {min_credit_score: "=min_credit_score", min_financed_amount_usd: "=min_financed_amount_usd", max_financed_amount_usd: "=max_financed_amount_usd", eligible_specialties: "=eligible_specialties", approval_validity_days: "=approval_validity_days", promo_months: "=promo_months", prequalification_soft_pull: "=prequalification_soft_pull"}

  - id: pos_plan_terms_and_interest
    subject: [pos_plan_activated, pos_interest_charged, pos_plan_terms_updated]
    rule: >-
      Each plan's monthly payment follows its payment method: a level payment that repays the financed amount at the
      plan APR over the term (monthly rate = plan APR divided by 1200) for deferred-interest, reduced-APR and standard
      plans, and the financed amount divided equally over the term for no-interest plans; payments are rounded up to the
      next cent and never below min_monthly_payment_usd, with the final payment absorbing the difference. A deferred-
      interest plan's payment does not by itself pay the plan off within the promotional period. On reduced-APR and
      standard plans interest is charged at each statement closing (statement_closing_days_before_due days before the due
      date) as simple daily interest at the plan APR on the plan balance excluding fees for the days of the statement
      period; no-interest plans never charge interest; deferred-interest plans accrue interest only to the memo. Interest is charged only on a plan in active status.
      AutoPay can be turned on or off at any time and carries no rate discount. The due day can be changed no more than the plan's due-day changes per plan, to a day from 1 to 28, with the first new due date the first date on the new day later than the current next due date; the payment amount does not change.
      There is no prepayment penalty.
    eligibility:
      - id: interest_on_active_plan
        applies_to: [pos_interest_charged]
        kind: state
        condition: Interest is charged only on a plan in active status.
        evidence_fields: [pos_plans.status, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        state_contract:
          field: pos_plans.status
          allowed: [active]
      - id: due_day_change_count
        applies_to: [pos_plan_terms_updated]
        kind: authorization
        condition: The due day can be changed no more than the plan's due-day changes per plan, to a day from 1 to 28, with the first new due date the first date on the new day later than the current next due date; the payment amount does not change.
        evidence_fields: [pos_plans.payment_due_day, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
    params:
      min_monthly_payment_usd: "=min_monthly_payment_usd"
      payment_rounding: "=payment_rounding"
      statement_closing_days_before_due: "=statement_closing_days_before_due"
      autopay_rate_discount_percent: "=autopay_rate_discount_percent"
      prepayment_penalty_usd: "=prepayment_penalty_usd"
      per_tier:
        "PracticePay 6-Month Deferred Interest Plan": {promo_type: "=promo_type", term_months: "=term_months", plan_apr_percent: "=plan_apr_percent", payment_method: "=payment_method", interest_method: "=interest_method", due_day_changes_per_plan: "=due_day_changes_per_plan"}
        "PracticePay 6-Month No Interest Plan": {promo_type: "=promo_type", term_months: "=term_months", plan_apr_percent: "=plan_apr_percent", payment_method: "=payment_method", interest_method: "=interest_method", due_day_changes_per_plan: "=due_day_changes_per_plan"}
        "PracticePay 12-Month Deferred Interest Plan": {promo_type: "=promo_type", term_months: "=term_months", plan_apr_percent: "=plan_apr_percent", payment_method: "=payment_method", interest_method: "=interest_method", due_day_changes_per_plan: "=due_day_changes_per_plan"}
        "PracticePay 12-Month No Interest Plan": {promo_type: "=promo_type", term_months: "=term_months", plan_apr_percent: "=plan_apr_percent", payment_method: "=payment_method", interest_method: "=interest_method", due_day_changes_per_plan: "=due_day_changes_per_plan"}
        "PracticePay 24-Month Reduced APR Plan": {promo_type: "=promo_type", term_months: "=term_months", plan_apr_percent: "=plan_apr_percent", payment_method: "=payment_method", interest_method: "=interest_method", due_day_changes_per_plan: "=due_day_changes_per_plan"}
        "PracticePay 48-Month Reduced APR Plan": {promo_type: "=promo_type", term_months: "=term_months", plan_apr_percent: "=plan_apr_percent", payment_method: "=payment_method", interest_method: "=interest_method", due_day_changes_per_plan: "=due_day_changes_per_plan"}
        "PracticePay 60-Month Extended Plan": {promo_type: "=promo_type", term_months: "=term_months", plan_apr_percent: "=plan_apr_percent", payment_method: "=payment_method", interest_method: "=interest_method", due_day_changes_per_plan: "=due_day_changes_per_plan"}
    formula:
      monthly_rate: plan_apr / 1200
      level_payment: max(min_monthly_payment_usd, financed_amount * monthly_rate / (1 - (1 + monthly_rate) ** (0 - term_months)))
      equal_payment: max(min_monthly_payment_usd, financed_amount / term_months)

  - id: pos_deferred_interest
    subject: [pos_deferred_interest_accrued, pos_deferred_interest_billed, pos_deferred_interest_cleared, pos_plan_paid_off]
    rule: >-
      On a deferred-interest plan, interest accrues from the purchase date as simple daily interest at the plan APR on the
      plan balance excluding fees, and is posted to the deferred interest memo at each statement closing; it is not owed
      unless the promotional payoff test fails. Deferred interest accrues only while the plan is active.
      The test passes when the plan balance, less amounts under billing disputes that are still open, is 0.00 at the end
      of promo_end_date; provider refunds count toward it, and a patient whose dispute was resolved as no error keeps the
      promotion if the disputed amount is paid within post_dispute_payment_days of the resolution. If the test passes,
      the memo is cleared as forgiven and the plan closes paid_in_full_within_promo when its balance is 0.00. If it fails,
      the whole memo - every period since the purchase date, not only the unpaid part - is billed to the balance on the day after promo_end_date and the plan continues at the plan APR for the rest of its term with monthly interest charged from then on.
      The billing date is promo_end_date plus billing_offset_days calendar days.
      A late payment does not cancel the promotion; only the payoff test does. A partial provider refund does not reduce
      deferred interest already posted to the memo; accrual continues on the lower balance. A full provider refund clears
      the memo.
    eligibility:
      - id: accrue_on_active_plan
        applies_to: [pos_deferred_interest_accrued, pos_deferred_interest_billed]
        kind: state
        condition: Deferred interest accrues only while the plan is active.
        evidence_fields: [pos_plans.status, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        state_contract:
          field: pos_plans.status
          allowed: [active]
      - id: billed_after_promo
        applies_to: [pos_deferred_interest_billed]
        kind: time
        condition: If it fails, the whole memo - every period since the purchase date, not only the unpaid part - is billed to the balance on the day after promo_end_date and the plan continues at the plan APR for the rest of its term with monthly interest charged from then on.
        evidence_fields: [pos_plans.promo_end_date, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day after promo_end_date
          anchor_source: pos_plans.promo_end_date
          relation: not_before
          duration_source: params.billing_offset_days
          unit: calendar_days
          counting_rule: The billing date is promo_end_date plus billing_offset_days calendar days.
          boundary: inclusive
    params:
      billing_offset_days: 1
      per_tier:
        "PracticePay 6-Month Deferred Interest Plan": {deferred_interest_applies: "=deferred_interest_applies", deferred_interest_accrual_basis: "=deferred_interest_accrual_basis", deferred_interest_billing_timing: "=deferred_interest_billing_timing", promo_payoff_test: "=promo_payoff_test", dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days", promo_expiration_notice_days: "=promo_expiration_notice_days"}
        "PracticePay 6-Month No Interest Plan": {deferred_interest_applies: "=deferred_interest_applies", deferred_interest_accrual_basis: "=deferred_interest_accrual_basis", deferred_interest_billing_timing: "=deferred_interest_billing_timing", promo_payoff_test: "=promo_payoff_test", dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days", promo_expiration_notice_days: "=promo_expiration_notice_days"}
        "PracticePay 12-Month Deferred Interest Plan": {deferred_interest_applies: "=deferred_interest_applies", deferred_interest_accrual_basis: "=deferred_interest_accrual_basis", deferred_interest_billing_timing: "=deferred_interest_billing_timing", promo_payoff_test: "=promo_payoff_test", dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days", promo_expiration_notice_days: "=promo_expiration_notice_days"}
        "PracticePay 12-Month No Interest Plan": {deferred_interest_applies: "=deferred_interest_applies", deferred_interest_accrual_basis: "=deferred_interest_accrual_basis", deferred_interest_billing_timing: "=deferred_interest_billing_timing", promo_payoff_test: "=promo_payoff_test", dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days", promo_expiration_notice_days: "=promo_expiration_notice_days"}
        "PracticePay 24-Month Reduced APR Plan": {deferred_interest_applies: "=deferred_interest_applies", deferred_interest_accrual_basis: "=deferred_interest_accrual_basis", deferred_interest_billing_timing: "=deferred_interest_billing_timing", promo_payoff_test: "=promo_payoff_test", dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days", promo_expiration_notice_days: "=promo_expiration_notice_days"}
        "PracticePay 48-Month Reduced APR Plan": {deferred_interest_applies: "=deferred_interest_applies", deferred_interest_accrual_basis: "=deferred_interest_accrual_basis", deferred_interest_billing_timing: "=deferred_interest_billing_timing", promo_payoff_test: "=promo_payoff_test", dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days", promo_expiration_notice_days: "=promo_expiration_notice_days"}
        "PracticePay 60-Month Extended Plan": {deferred_interest_applies: "=deferred_interest_applies", deferred_interest_accrual_basis: "=deferred_interest_accrual_basis", deferred_interest_billing_timing: "=deferred_interest_billing_timing", promo_payoff_test: "=promo_payoff_test", dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days", promo_expiration_notice_days: "=promo_expiration_notice_days"}
    formula:
      promo_test_balance: plan_balance - pos_msr_open_disputed_amount
      promo_test_passed: promo_test_balance <= 0
    measures: [pos_msr_open_disputed_amount]

  - id: pos_evt_payments_and_fees
    subject: [pos_payment_posted, pos_payment_returned, pos_late_fee_assessed, pos_returned_payment_fee_assessed, pos_account_status_updated]
    rule: >-
      Payments are accepted on a plan in active or charged_off status. Each payment is applied to billed interest and billed deferred interest first, then fees, then the
      remaining plan balance; a monthly payment counts as made once payments credited toward it reach the monthly payment
      amount, and amounts beyond the payments due reduce the balance without advancing next_due_date. Payments submitted
      by the same-day cutoff Eastern Time on a business day are effective that day; a debit card payment may not exceed
      debit_card_payment_max_usd. A late fee may be assessed only when the current date is later than the monthly due date plus the late-fee grace period.
      The grace period is counted in calendar days starting the day after the monthly due date.
      The late fee is late_fee_usd but never more than the unpaid part of that monthly payment, at most
      max_late_fees_per_due_date per due date, and the amount of an open billing dispute is left out of the unpaid part.
      A provider refund never counts as a payment toward a monthly payment due. A returned payment is reversed in full and
      the monthly payment it covered is unpaid again; a returned-payment fee of returned_payment_fee_usd is charged once per
      returned payment whose return code is in fee_bearing_return_codes, never for R07, R10, R29 or a chargeback.
      Balances and delinquency fields are refreshed after every line.
    eligibility:
      - id: payable_status
        applies_to: [pos_payment_posted]
        kind: state
        condition: Payments are accepted on a plan in active or charged_off status.
        evidence_fields: [pos_plans.status, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        state_contract:
          field: pos_plans.status
          allowed: [active, charged_off]
      - id: late_fee_grace
        applies_to: [pos_late_fee_assessed]
        kind: time
        condition: A late fee may be assessed only when the current date is later than the monthly due date plus the late-fee grace period.
        evidence_fields: [pos_plans.next_due_date, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the monthly due date
          anchor_source: pos_plans.next_due_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the monthly due date.
          boundary: exclusive
      - id: one_late_fee_per_due_date
        applies_to: [pos_late_fee_assessed]
        kind: dedup
        condition: The late fee is late_fee_usd but never more than the unpaid part of that monthly payment, at most max_late_fees_per_due_date per due date, and the amount of an open billing dispute is left out of the unpaid part.
        evidence_fields: [pos_transactions.pos_plan_id, pos_transactions.installment_due_date, pos_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_transactions.pos_plan_id, pos_transactions.installment_due_date]
          action_bindings:
            pos_transactions.pos_plan_id: pos_plan_id
            pos_transactions.installment_due_date: installment_due_date
        dedup_contract:
          table: pos_transactions
          mode: separate_record
          object_bindings: {pos_plan_id: pos_plan_id, installment_due_date: installment_due_date}
          duplicate_filters: {event_type: [pos_late_fee_assessed]}
          distinct_fields: []
    params:
      same_day_cutoff_time_et: "=same_day_cutoff_time_et"
      debit_card_payment_max_usd: "=debit_card_payment_max_usd"
      payment_allocation_order: "=payment_allocation_order"
      excess_payment_treatment: "=excess_payment_treatment"
      late_fee_grace_days: "=late_fee_grace_days"
      late_fee_usd: "=late_fee_usd"
      max_late_fees_per_due_date: "=max_late_fees_per_due_date"
      returned_payment_fee_usd: "=returned_payment_fee_usd"
      fee_bearing_return_codes: "=fee_bearing_return_codes"
    formula:
      unpaid_part: min(monthly_payment_amount, amount_past_due - pos_msr_open_disputed_amount)
      late_fee: min(late_fee_usd, unpaid_part)
    measures: [pos_msr_open_disputed_amount, pos_msr_days_past_due]

  - id: pos_evt_fee_waiver
    subject: [pos_fee_waived]
    rule: >-
      A late or returned-payment fee may be waived once. A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the plan.
      A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
      The window is counted in calendar days starting the day after the fee's assessment date, and a request on the last day is in time.
      Fees caused by a Larkspur error, a debit confirmed as unauthorized, or a bank error documented by the bank are waived
      on those bases without a window or count; fees caused by a disputed amount are waived as dispute_resolved when the
      dispute is resolved with a provider credit. When a full provider refund cancels the plan, every interest and fee line
      still owed is waived as merchant_full_refund.
    eligibility:
      - id: once_per_line
        applies_to: [pos_fee_waived]
        kind: dedup
        condition: A late or returned-payment fee may be waived once.
        evidence_fields: [pos_transactions.related_txn_id, pos_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_transactions.related_txn_id]
          action_bindings:
            pos_transactions.related_txn_id: related_txn_id
        dedup_contract:
          table: pos_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [pos_fee_waived]}
          distinct_fields: []
      - id: courtesy_count
        applies_to: [pos_fee_waived]
        kind: authorization
        condition: A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been granted on the plan.
        evidence_fields: [pos_transactions.waiver_reason, pos_transactions.txn_date, pos_transactions.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_transactions.pos_plan_id]
          action_bindings:
            pos_transactions.pos_plan_id: pos_plan_id
      - id: courtesy_window
        applies_to: [pos_fee_waived]
        kind: time
        condition: A courtesy waiver must be requested no later than the fee waiver request window after the fee's assessment date.
        evidence_fields: [pos_transactions.txn_date, pos_transactions.pos_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_transactions.pos_txn_id]
          action_bindings:
            pos_transactions.pos_txn_id: related_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee's assessment date
          anchor_source: pos_transactions.txn_date
          relation: not_after
          duration_source: variants.fee_waiver_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the fee's assessment date, and a request on the last day is in time.
          boundary: inclusive
    params:
      fee_waiver_request_window_days: "=fee_waiver_request_window_days"
      per_tier:
        "PracticePay 6-Month Deferred Interest Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "PracticePay 6-Month No Interest Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "PracticePay 12-Month Deferred Interest Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "PracticePay 12-Month No Interest Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "PracticePay 24-Month Reduced APR Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "PracticePay 48-Month Reduced APR Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        "PracticePay 60-Month Extended Plan": {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
    measures: [pos_msr_courtesy_waivers_12m]

  - id: pos_evt_provider_refunds
    subject: [pos_merchant_refund_posted, pos_plan_cancelled]
    rule: >-
      Only the provider can refund a financed charge; a patient's statement that a refund was promised is not a refund. A provider refund posts against the one financed charge it refunds, identified by the provider's refund reference.
      A refund reduces the plan balance on its posting date, provider_refund_posting_business_days business days after
      the provider submits it; it is not a payment and does not satisfy or advance a monthly payment due, so the patient
      must keep paying the monthly payment until the plan is paid off. After a partial refund the monthly payment is
      recalculated only where the plan's payment recast rule says so. When refunds equal the full financed amount, the
      plan is cancelled: interest and fees still owed are waived, the deferred interest memo is cleared, and payments the
      patient made are refunded as a credit balance within credit_balance_refund_business_days business days. A refund
      that leaves a credit balance on a plan that is otherwise paid off is refunded the same way.
    eligibility:
      - id: refund_tied_to_charge
        applies_to: [pos_merchant_refund_posted]
        kind: dedup
        condition: A provider refund posts against the one financed charge it refunds, identified by the provider's refund reference.
        evidence_fields: [pos_transactions.refund_reference, pos_transactions.related_txn_id, pos_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_transactions.related_txn_id, pos_transactions.refund_reference]
          action_bindings:
            pos_transactions.related_txn_id: related_txn_id
            pos_transactions.refund_reference: refund_reference
        dedup_contract:
          table: pos_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id, refund_reference: refund_reference}
          duplicate_filters: {event_type: [pos_merchant_refund_posted]}
          distinct_fields: []
    params:
      provider_refund_posting_business_days: "=provider_refund_posting_business_days"
      refund_treatment: "=refund_treatment"
      full_refund_outcome: "=full_refund_outcome"
      credit_balance_refund_business_days: "=credit_balance_refund_business_days"
      per_tier:
        "PracticePay 6-Month Deferred Interest Plan": {payment_recast_after_refund: "=payment_recast_after_refund"}
        "PracticePay 6-Month No Interest Plan": {payment_recast_after_refund: "=payment_recast_after_refund"}
        "PracticePay 12-Month Deferred Interest Plan": {payment_recast_after_refund: "=payment_recast_after_refund"}
        "PracticePay 12-Month No Interest Plan": {payment_recast_after_refund: "=payment_recast_after_refund"}
        "PracticePay 24-Month Reduced APR Plan": {payment_recast_after_refund: "=payment_recast_after_refund"}
        "PracticePay 48-Month Reduced APR Plan": {payment_recast_after_refund: "=payment_recast_after_refund"}
        "PracticePay 60-Month Extended Plan": {payment_recast_after_refund: "=payment_recast_after_refund"}

  - id: pos_evt_billing_disputes
    subject: [pos_late_fee_assessed, pos_deferred_interest_billed, pos_fee_waived]
    rule: >-
      A patient may dispute a provider's financed charge - service not rendered, incorrect amount, refund not received or
      duplicate charge - by opening a billing dispute on that charge. A billing dispute can be opened only when the current date is no later than the purchase date plus the dispute window.
      The dispute window is counted in calendar days starting the day after the purchase date, and a dispute opened on the last day is in time.
      A fee is waived as dispute_resolved only for a billing dispute opened no later than the purchase date plus the dispute window.
      One dispute may be open per charge at a time. While a dispute is open the disputed amount is left out of the amount
      past due for late fees and, on deferred-interest plans, out of the promotional payoff test; the patient still owes
      the undisputed monthly payment. The provider resolves the dispute: a provider credit posts as a provider refund and
      fees caused by the disputed amount are waived as dispute_resolved; a no-error outcome makes the disputed amount
      payable again, and on a deferred-interest plan whose promotion ended during the dispute the patient keeps the
      promotion by paying the disputed amount within the post-dispute payment period. Disputes about the quality of care
      that the provider will not credit are outside Larkspur's billing dispute process.
    eligibility:
      - id: dispute_window
        applies_to: [pos_fee_waived]
        kind: time
        condition: A fee is waived as dispute_resolved only for a billing dispute opened no later than the purchase date plus the dispute window.
        evidence_fields: [pos_plans.purchase_date, pos_plans.pos_plan_id, pos_billing_disputes.filed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase date
          anchor_source: pos_plans.purchase_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: The dispute window is counted in calendar days starting the day after the purchase date, and a dispute opened on the last day is in time.
          boundary: inclusive
    params:
      dispute_window_days: "=dispute_window_days"
      dispute_late_fee_protection: "=dispute_late_fee_protection"
      per_tier:
        "PracticePay 6-Month Deferred Interest Plan": {dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days"}
        "PracticePay 6-Month No Interest Plan": {dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days"}
        "PracticePay 12-Month Deferred Interest Plan": {dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days"}
        "PracticePay 12-Month No Interest Plan": {dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days"}
        "PracticePay 24-Month Reduced APR Plan": {dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days"}
        "PracticePay 48-Month Reduced APR Plan": {dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days"}
        "PracticePay 60-Month Extended Plan": {dispute_promo_protection: "=dispute_promo_protection", post_dispute_payment_days: "=post_dispute_payment_days"}
    measures: [pos_msr_open_disputed_amount]

  - id: pos_evt_closure_and_charge_off
    subject: [pos_plan_paid_off, pos_plan_charged_off, pos_application_declined, pos_approval_expired]
    rule: >-
      A plan closes as paid_off when its balance reaches 0.00, with closure reason paid_in_full_within_promo when it is a
      promotional plan that met its payoff test and paid_in_full otherwise. Overpayments become a credit balance refunded
      within credit_balance_refund_business_days business days. Delinquency is reported to the credit bureaus once a plan
      reaches delinquency_reporting_days_past_due days past due. A plan is charged off once the current date is at least the charge-off days past due after the oldest unpaid due date.
      Days past due are counted in calendar days starting the day after the oldest unpaid due date.
      A declined application or an expired approval carries no fee and leaves no balance.
    eligibility:
      - id: charge_off_threshold
        applies_to: [pos_plan_charged_off]
        kind: time
        condition: A plan is charged off once the current date is at least the charge-off days past due after the oldest unpaid due date.
        evidence_fields: [pos_plans.next_due_date, pos_plans.pos_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pos_plans.pos_plan_id]
          action_bindings:
            pos_plans.pos_plan_id: pos_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the oldest unpaid due date
          anchor_source: pos_plans.next_due_date
          relation: not_before
          duration_source: variants.charge_off_days_past_due
          unit: calendar_days
          counting_rule: Days past due are counted in calendar days starting the day after the oldest unpaid due date.
          boundary: inclusive
    params:
      credit_balance_refund_business_days: "=credit_balance_refund_business_days"
      delinquency_reporting_days_past_due: "=delinquency_reporting_days_past_due"
      charge_off_days_past_due: "=charge_off_days_past_due"
    measures: [pos_msr_days_past_due]

# ============================================================================
# extended_policies (practicepay_patient_financing)
# ============================================================================
extended_policies:
  - id: pos_ext_payoff_quote
    base_policy_refs: [pos_evt_payments_and_fees, pos_plan_terms_and_interest, pos_deferred_interest, pos_evt_billing_disputes, pos_evt_closure_and_charge_off, pos_agg_combined_exposure]
    overwrite: []
    trigger: on_request
    subject: [pos_payment_posted]
    computes: payment_amount
    target_tool: pay_off_plan_f18fb847
    params:
      standard_hold_days: 2
      payoff_first_due_min_days: 25
      repeat_return_hold_days: 10
      single_return_hold_days: 5
      account_problem_extra_days: 3
      funds_return_extra_days: 1
      loan_late_extra_days: 5
      loan_returned_extra_days: 2
      line_late_extra_days: 3
      line_returned_extra_days: 1
    rule: >-
      This rule sets the amount a patient pays, in one payment from a linked bank account, to pay a PracticePay plan off
      in full today; a payment of that amount is applied like any other payment, and any part of it that the plan's
      final interest posting does not use becomes a credit balance refunded under the credit balance rule. A payoff
      amount is worked out only after the plan's ledger carries the late-fee relief owed on the plan's latest late fee
      under the make-up relief schedules. A payoff amount is not worked out until the plan's ledger carries the
      returned-payment-fee relief owed on the fee of the plan's latest returned payment. A plan whose payoff amount
      works out to 0.00 owes nothing, and no payoff payment is taken. The fees still owed on the plan are the late fee
      charged for its oldest unpaid due date and the returned-payment fee charged for its latest returned payment when
      that payment came back after that due date, each less any waiver entry that names it; the latest returned payment
      is the latest returned-payment entry by return date, the one recorded first where two share that date; fees
      charged before that due date were met by the payments that satisfied the earlier due dates, since every payment is
      applied to fees before balance. The interest-bearing balance is the plan balance less those fees still owed and,
      on a plan reset to a split payment under the reset schedule, less the reset's deferred-interest part not yet
      repaid. A plan reset to a split payment is a plan whose deferred interest was billed and whose monthly payment no
      longer equals the level payment its payment method set at activation, rounded up to the next cent and never below
      min_monthly_payment_usd, or whose plan APR no longer equals the plan APR of its plan; its deferred-interest part
      not yet repaid is the deferred interest billed times the reset payments still due divided by the reset payments,
      but never more than the plan balance less those fees still owed, the reset payments being the due dates after the
      billing date through the final due date and those still due the due dates from the plan's next due date through
      the final due date, never more than the reset payments; the plan's first due date is the first date on its due day
      at least payoff_first_due_min_days calendar days after the purchase date, its final due date falls the term less
      one whole months after the first due date, and the due dates on or before a date are those from the first due date
      through that date. The plan's latest statement closing is the date of its latest monthly interest charge or, when
      the plan's deferred interest was billed after that date or no monthly interest charge has posted, the date its
      deferred interest was billed, monthly interest on a plan whose deferred interest was billed running from the
      billing date as the deferred-interest rule says. The daily interest rate is the plan APR divided by 36,500, and
      every span of days is counted from the day after its start date through its end date. The payoff amount is the
      plan balance plus simple interest on the interest-bearing balance from the plan's latest statement closing, or
      from the purchase date when the plan has none, through today, plus simple interest on the interest-bearing balance
      for standard_hold_days days of good-through period, rounded half up to the nearest cent. Where a rule of this
      payoff schedule sets a different way of charging the interest since the latest closing, different or additional
      good-through days, or an amount left out of the payoff, that way takes the place of the single-span interest, the
      good-through days are added together and accrue interest on the interest-bearing balance like the standard days,
      the amount left out is subtracted from the plan balance, and the payoff amount is rounded half up to the nearest
      cent once, at the end. The interest-since-closing rule of a payoff follows the plan's promotion and its latest
      payment: on a deferred-interest plan whose promo_end_date is today or later and which carries no deferred-interest
      billing entry, a payoff today meets the promotional payoff test and no interest is added, neither since the
      closing nor for any good-through day; otherwise, when the plan's latest payment entry, the one recorded first
      where two share the latest date, is dated after the latest statement closing and has not come back as a returned
      payment, interest runs from the closing to that payment's date on the interest-bearing balance plus the amounts of
      every payment entry dated that day and from that payment's date through today on the interest-bearing balance; in
      every other case interest runs as one span on the interest-bearing balance. The amount left out of a payoff for
      billing disputes follows their state: while a billing dispute on the plan is open, its disputed amount is left
      out; when no dispute is open but the disputed amounts of disputes the provider resolved with a credit exceed the provider refunds posted on the plan, the excess, the credit still to post, is left out; otherwise nothing is left out; the amount left out is subtracted from the payoff amount only, the interest-bearing balance and the interest it carries staying as they are. The return-record good-through days of a payoff replace the standard good-through period: two or more
      returned-payment entries on the plan dated within the last 6 months give repeat_return_hold_days, exactly one
      gives single_return_hold_days, and none gives standard_hold_days; a window of the last N months here covering
      entries dated fewer than N whole months before today, a month being whole once today's day of the month has
      reached the entry's day of the month. The return-reason extra good-through days of a payoff are
      account_problem_extra_days when a payment on the plan came back within the last 6 months with return code R02, R03
      or R04, funds_return_extra_days when none did but a payment came back within the last 6 months with return code
      R01 or R09, and 0 otherwise; a window of the last N months here covering entries dated fewer than N whole months
      before today, a month being whole once today's day of the month has reached the entry's day of the month. The
      personal-loan extra good-through days of a payoff read every Larkspur personal loan the customer has held: a
      payment that came back on any of them within the last 6 months together with a late fee posted on any of them
      within the last 12 months gives loan_late_extra_days, such a returned payment with no late fee within the last 12
      months gives loan_returned_extra_days, and no payment coming back on any of them within the last 6 months gives 0;
      a window of the last N months here covering entries dated fewer than N whole months before today, a month being
      whole once today's day of the month has reached the entry's day of the month. The FlexLine extra good-through days
      of a payoff read every FlexLine the customer has held: a payment that came back on any of them within the last 6
      months together with a late fee posted on any of them within the last 12 months gives line_late_extra_days, such a
      returned payment with no late fee within the last 12 months gives line_returned_extra_days, and no payment coming
      back on any of them within the last 6 months gives 0; a window of the last N months here covering entries dated
      fewer than N whole months before today, a month being whole once today's day of the month has reached the entry's
      day of the month.
    prerequisite:
      - problem: pos_ext_late_fee_relief
        kind: value_input
        gate: plan_bal
        form: state
        policy_source: >-
          A payoff amount is worked out only after the plan's ledger carries the late-fee relief owed on the plan's latest
          late fee under the make-up relief schedules.
        condition: >-
          When a late-fee relief above 0.00 is owed on the plan's latest pos_late_fee_assessed entry under the late-fee
          relief schedule, a pos_fee_waived entry names that late-fee entry.
        resolved_by: relieve_late_fee_b1a4bf3c
        effect: >-
          Booking the relief lowers the plan balance by the relief; the payoff amount falls by the relief and by the
          interest the relief would have carried through today and the good-through days.
      - problem: pos_ext_returned_fee_relief
        kind: value_input
        gate: plan_bal
        form: state
        policy_source: >-
          A payoff amount is not worked out until the plan's ledger carries the returned-payment-fee relief owed on the
          fee of the plan's latest returned payment.
        condition: >-
          When a returned-payment-fee relief above 0.00 is owed on the pos_returned_payment_fee_assessed entry that names
          the plan's latest returned payment, a pos_fee_waived entry names that fee entry.
        resolved_by: relieve_returned_payment_fee_3fbe4785
        effect: >-
          Booking the relief lowers the plan balance by the relief; the payoff amount falls by the relief and by the
          interest the relief would have carried through today and the good-through days.
    cross_category:
      - category: loan
        as: history
        reads: [loan_transactions.event_type]
        note: The personal-loan extra good-through days are decided from returned payments within 6 months and late fees within 12 months on all of the customer's personal loans.
      - category: line
        as: history
        reads: [line_transactions.event_type]
        note: The FlexLine extra good-through days are decided from returned payments within 6 months and late fees within 12 months on all of the customer's FlexLines.
    compute:
      - plan_bal: "F('plan_balance')"
      - due_date: "F('next_due_date')"
      - late_fee_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_late_fee_assessed', installment_due_date=due_date)"
      - late_owed: "SUM('pos_transactions','amount', event_type='pos_late_fee_assessed', installment_due_date=due_date) - SUM('pos_transactions','amount', event_type='pos_fee_waived', related_txn_id=late_fee_id)"
      - last_return_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_payment_returned')"
      - last_return_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_payment_returned')"
      - ret_fee_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_returned_payment_fee_assessed', related_txn_id=last_return_id)"
      - returned_fee_owed: "(SUM('pos_transactions','amount', event_type='pos_returned_payment_fee_assessed', related_txn_id=last_return_id) - SUM('pos_transactions','amount', event_type='pos_fee_waived', related_txn_id=ret_fee_id)) if (last_return_id != None and last_return_date > due_date) else 0"
      - pq_bill_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_deferred_interest_billed')"
      - pq_purchase_month: "MONTHS('2000-01-01', F('purchase_date'))"
      - pq_next_month: "MONTHS('2000-01-01', F('next_due_date'))"
      - pq_months_purchase_to_next: "MONTHS(F('purchase_date'), F('next_due_date'))"
      - pq_due_day_month: "pq_purchase_month + (pq_next_month - pq_purchase_month - pq_months_purchase_to_next)"
      - pq_due_day_year: "pq_due_day_month // 12"
      - pq_due_day_mo: "pq_due_day_month % 12 + 1"
      - pq_due_day_ordinal: "365 * pq_due_day_year + (pq_due_day_year + 3) // 4 + (367 * pq_due_day_mo - 362) // 12 - (0 if pq_due_day_mo <= 2 else (1 if pq_due_day_year % 4 == 0 else 2)) + int(F('payment_due_day')) - 1"
      - pq_first_due_skip: "1 if pq_due_day_ordinal - DAYS('2000-01-01', F('purchase_date')) < K('payoff_first_due_min_days') else 0"
      - pq_first_due_month: "pq_due_day_month + pq_first_due_skip"
      - pq_still_due: "MX(0, F('term_months') - (pq_months_purchase_to_next - pq_first_due_skip))"
      - pq_due_to_billing: "MX(0, MONTHS('2000-01-01', pq_bill_date) - pq_first_due_month - (MONTHS('2000-01-01', pq_bill_date) - pq_next_month - MONTHS(F('next_due_date'), pq_bill_date)) + 1) if pq_bill_date != None else 0"
      - pq_reset_payments: "MX(1, F('term_months') - pq_due_to_billing)"
      - pq_activation_rate: "P('plan_apr_percent') / 1200"
      - pq_activation_raw: "(F('financed_amount') * pq_activation_rate / (1 - (1 + pq_activation_rate) ** (0 - F('term_months')))) if pq_activation_rate > 0 else F('financed_amount') / F('term_months')"
      - pq_activation_cents: "RND(pq_activation_raw * 100, 6)"
      - pq_activation_payment: "MX(P('min_monthly_payment_usd'), (int(pq_activation_cents) + (1 if pq_activation_cents > int(pq_activation_cents) else 0)) / 100)"
      - reset_split_plan: "pq_bill_date != None and (F('monthly_payment_amount') != pq_activation_payment or F('plan_apr') != P('plan_apr_percent'))"
      - reset_di_unrepaid: "MN(SUM('pos_transactions','amount', event_type='pos_deferred_interest_billed') * MN(pq_reset_payments, pq_still_due) / pq_reset_payments, plan_bal - late_owed - returned_fee_owed) if reset_split_plan else 0"
      - interest_base: "plan_bal - late_owed - returned_fee_owed - reset_di_unrepaid"
      - daily_rate: "F('plan_apr') / 36500"
      - last_charge: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_interest_charged')"
      - di_bill_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_deferred_interest_billed')"
      - last_closing: "di_bill_date if (di_bill_date != None and (last_charge == None or di_bill_date > last_charge)) else last_charge"
      - span_start: "last_closing if last_closing != None else F('purchase_date')"
      - di_billed_count: "COUNT('pos_transactions', event_type='pos_deferred_interest_billed')"
      - promo_running: "F('promo_end_date') != None and F('promo_end_date') != '' and F('promo_end_date') >= NOW and di_billed_count == 0"
      - last_pay_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_payment_posted')"
      - last_pay_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_payment_posted')"
      - last_pay_amount: "SUM('pos_transactions','amount', event_type='pos_payment_posted', txn_date=last_pay_date) if last_pay_date != None else 0"
      - last_pay_returned: "COUNT('pos_transactions', event_type='pos_payment_returned', related_txn_id=last_pay_id) > 0"
      - stub_interest: "0 if promo_running else (((interest_base + last_pay_amount) * daily_rate * DAYS(last_closing, last_pay_date) + interest_base * daily_rate * DAYS(last_pay_date, NOW)) if (last_closing != None and last_pay_id != None and not last_pay_returned and last_pay_date > last_closing) else interest_base * daily_rate * DAYS(span_start, NOW))"
      - open_disputed: "SUM('pos_billing_disputes','disputed_amount', dispute_status='open')"
      - credited_disputed: "SUM('pos_billing_disputes','disputed_amount', dispute_status='resolved_merchant_credit')"
      - refunds_posted: "SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_merchant_refund_posted')"
      - amount_left_out: "open_disputed if open_disputed > 0 else (credited_disputed - refunds_posted if credited_disputed > refunds_posted else 0)"
      - returns_6m: "COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_payment_returned')"
      - return_hold_days: "K('repeat_return_hold_days') if returns_6m >= 2 else (K('single_return_hold_days') if returns_6m == 1 else K('standard_hold_days'))"
      - account_problem_returns_6m: "COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_payment_returned', return_code='R02') + COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_payment_returned', return_code='R03') + COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_payment_returned', return_code='R04')"
      - funds_returns_6m: "COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_payment_returned', return_code='R01') + COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_payment_returned', return_code='R09')"
      - reason_extra_days: "K('account_problem_extra_days') if account_problem_returns_6m >= 1 else (K('funds_return_extra_days') if funds_returns_6m >= 1 else 0)"
      - loan_returns_6m: "XCOUNT('loan','loan_transactions', within_months=6, date_field='txn_date', event_type='loan_payment_returned')"
      - loan_late_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - loan_extra_days: "K('loan_late_extra_days') if (loan_returns_6m >= 1 and loan_late_12m >= 1) else (K('loan_returned_extra_days') if (loan_returns_6m >= 1 and loan_late_12m == 0) else 0)"
      - line_returns_6m: "XCOUNT('line','line_transactions', within_months=6, date_field='txn_date', event_type='line_payment_returned')"
      - line_late_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - line_extra_days: "K('line_late_extra_days') if (line_returns_6m >= 1 and line_late_12m >= 1) else (K('line_returned_extra_days') if (line_returns_6m >= 1 and line_late_12m == 0) else 0)"
      - hold_accrual: "0 if promo_running else 1"
      - hold_interest: "interest_base * daily_rate * (return_hold_days + reason_extra_days + loan_extra_days + line_extra_days) * hold_accrual"
      - result: "int(RND((plan_bal - amount_left_out + stub_interest + hold_interest) * 100, 6) + 0.5) / 100"
    compute_basis:
