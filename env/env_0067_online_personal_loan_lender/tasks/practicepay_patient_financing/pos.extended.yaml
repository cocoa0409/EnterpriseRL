      last_pay_amount: "interest runs from the closing to that payment's date on the interest-bearing balance plus the amounts of every payment entry dated that day and from that payment's date through today on the interest-bearing balance"
      last_pay_returned: "is dated after the latest statement closing and has not come back as a returned payment"
      stub_interest: "The interest-since-closing rule of a payoff follows the plan's promotion and its latest payment: on a deferred-interest plan whose promo_end_date is today or later and which carries no deferred-interest billing entry, a payoff today meets the promotional payoff test and no interest is added, neither since the closing nor for any good-through day; otherwise, when the plan's latest payment entry, the one recorded first where two share the latest date, is dated after the latest statement closing and has not come back as a returned payment, interest runs from the closing to that payment's date on the interest-bearing balance plus the amounts of every payment entry dated that day and from that payment's date through today on the interest-bearing balance; in every other case interest runs as one span on the interest-bearing balance."
      open_disputed: "while a billing dispute on the plan is open, its disputed amount is left out"
      credited_disputed: "when no dispute is open but the disputed amounts of disputes the provider resolved with a credit exceed the provider refunds posted on the plan, the excess, the credit still to post, is left out"
      refunds_posted: "when no dispute is open but the disputed amounts of disputes the provider resolved with a credit exceed the provider refunds posted on the plan, the excess, the credit still to post, is left out"
      amount_left_out: "The amount left out of a payoff for billing disputes follows their state: while a billing dispute on the plan is open, its disputed amount is left out; when no dispute is open but the disputed amounts of disputes the provider resolved with a credit exceed the provider refunds posted on the plan, the excess, the credit still to post, is left out; otherwise nothing is left out; the amount left out is subtracted from the payoff amount only, the interest-bearing balance and the interest it carries staying as they are."
      returns_6m: "two or more returned-payment entries on the plan dated within the last 6 months give repeat_return_hold_days, exactly one gives single_return_hold_days, and none gives standard_hold_days"
      return_hold_days: "The return-record good-through days of a payoff replace the standard good-through period: two or more returned-payment entries on the plan dated within the last 6 months give repeat_return_hold_days, exactly one gives single_return_hold_days, and none gives standard_hold_days; a window of the last N months here covering entries dated fewer than N whole months before today, a month being whole once today's day of the month has reached the entry's day of the month."
      account_problem_returns_6m: "account_problem_extra_days when a payment on the plan came back within the last 6 months with return code R02, R03 or R04"
      funds_returns_6m: "funds_return_extra_days when none did but a payment came back within the last 6 months with return code R01 or R09"
      reason_extra_days: "The return-reason extra good-through days of a payoff are account_problem_extra_days when a payment on the plan came back within the last 6 months with return code R02, R03 or R04, funds_return_extra_days when none did but a payment came back within the last 6 months with return code R01 or R09, and 0 otherwise; a window of the last N months here covering entries dated fewer than N whole months before today, a month being whole once today's day of the month has reached the entry's day of the month."
      loan_returns_6m: "a payment that came back on any of them within the last 6 months together with a late fee posted on any of them within the last 12 months gives loan_late_extra_days"
      loan_late_12m: "such a returned payment with no late fee within the last 12 months gives loan_returned_extra_days"
      loan_extra_days: "The personal-loan extra good-through days of a payoff read every Larkspur personal loan the customer has held: a payment that came back on any of them within the last 6 months together with a late fee posted on any of them within the last 12 months gives loan_late_extra_days, such a returned payment with no late fee within the last 12 months gives loan_returned_extra_days, and no payment coming back on any of them within the last 6 months gives 0; a window of the last N months here covering entries dated fewer than N whole months before today, a month being whole once today's day of the month has reached the entry's day of the month."
      line_returns_6m: "a payment that came back on any of them within the last 6 months together with a late fee posted on any of them within the last 12 months gives line_late_extra_days"
      line_late_12m: "such a returned payment with no late fee within the last 12 months gives line_returned_extra_days"
      line_extra_days: "The FlexLine extra good-through days of a payoff read every FlexLine the customer has held: a payment that came back on any of them within the last 6 months together with a late fee posted on any of them within the last 12 months gives line_late_extra_days, such a returned payment with no late fee within the last 12 months gives line_returned_extra_days, and no payment coming back on any of them within the last 6 months gives 0; a window of the last N months here covering entries dated fewer than N whole months before today, a month being whole once today's day of the month has reached the entry's day of the month."
      hold_accrual: "a payoff today meets the promotional payoff test and no interest is added, neither since the closing nor for any good-through day"
      hold_interest: "the good-through days are added together and accrue interest on the interest-bearing balance like the standard days"
      result: "the amount left out is subtracted from the plan balance, and the payoff amount is rounded half up to the nearest cent once, at the end."
    factors:
      - id: interest_since_closing_rule
        effect: method
        decides: stub_interest
        bindings: [di_billed_count, promo_running, last_pay_id, last_pay_date, last_pay_amount, last_pay_returned, stub_interest, hold_accrual]
        ladder:
          - when: "a deferred-interest plan still inside its promotion with no deferred-interest billing entry"
            method: "no interest: the payoff meets the promotional payoff test"
          - when: "the latest payment entry is dated after the latest statement closing and has not come back"
            method: "split accrual: closing to payment date on the interest-bearing balance plus that payment, then payment date through today"
          - when: "otherwise"
            method: "one span on the interest-bearing balance"
        baseline:
          stub_interest: "interest_base * daily_rate * DAYS(span_start, NOW)"
          hold_accrual: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: dispute_carve_out_rule
        effect: method
        decides: amount_left_out
        bindings: [open_disputed, credited_disputed, refunds_posted, amount_left_out]
        ladder:
          - when: "a billing dispute on the plan is open"
            method: "read: the open disputed amount"
          - when: "no dispute open and provider-credited disputed amounts exceed the provider refunds posted"
            method: "difference: credited disputed amounts less refunds posted"
          - when: "otherwise"
            method: "nothing left out"
        baseline:
          amount_left_out: "0"
        evidence: [history]
        cross_difficulty: null
      - id: return_record_hold
        effect: parameter
        decides: return_hold_days
        bindings: [returns_6m, return_hold_days]
        ladder:
          - when: "two or more returned-payment entries within the last 6 months"
            value: "K('repeat_return_hold_days') = 10"
          - when: "exactly one returned-payment entry within the last 6 months"
            value: "K('single_return_hold_days') = 5"
          - when: "none"
            value: "K('standard_hold_days') = 2"
        baseline:
          return_hold_days: "K('standard_hold_days')"
        evidence: [history]
        cross_difficulty: null
      - id: return_reason_hold
        effect: parameter
        decides: reason_extra_days
        bindings: [account_problem_returns_6m, funds_returns_6m, reason_extra_days]
        ladder:
          - when: "a payment came back within 6 months with R02, R03 or R04"
            value: "K('account_problem_extra_days') = 3"
          - when: "none with R02, R03 or R04, but one came back within 6 months with R01 or R09"
            value: "K('funds_return_extra_days') = 1"
          - when: "otherwise"
            value: "0"
        baseline:
          reason_extra_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: personal_loan_return_hold
        effect: parameter
        decides: loan_extra_days
        bindings: [loan_returns_6m, loan_late_12m, loan_extra_days]
        ladder:
          - when: "a payment came back on any personal loan within 6 months and a late fee was posted on any of them within 12 months"
            value: "K('loan_late_extra_days') = 5"
          - when: "a payment came back on any personal loan within 6 months and no late fee within 12 months"
            value: "K('loan_returned_extra_days') = 2"
          - when: "no personal-loan payment came back within 6 months"
            value: "0"
        baseline:
          loan_extra_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: flexline_return_hold
        effect: parameter
        decides: line_extra_days
        bindings: [line_returns_6m, line_late_12m, line_extra_days]
        ladder:
          - when: "a payment came back on any FlexLine within 6 months and a late fee was posted on any of them within 12 months"
            value: "K('line_late_extra_days') = 3"
          - when: "a payment came back on any FlexLine within 6 months and no late fee within 12 months"
            value: "K('line_returned_extra_days') = 1"
          - when: "no FlexLine payment came back within 6 months"
            value: "0"
        baseline:
          line_extra_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: line
    baseline:
      rule: >-
        The fees still owed on the plan are the late fee charged for its oldest unpaid due date and the returned-payment
        fee charged for its latest returned payment when that payment came back after that due date, each less any
        waiver entry that names it; the latest returned payment is the latest returned-payment entry by return date, the
        one recorded first where two share that date; fees charged before that due date were met by the payments that
        satisfied the earlier due dates, since every payment is applied to fees before balance. The interest-bearing
        balance is the plan balance less those fees still owed and, on a plan reset to a split payment under the reset
        schedule, less the reset's deferred-interest part not yet repaid. A plan reset to a split payment is a plan
        whose deferred interest was billed and whose monthly payment no longer equals the level payment its payment
        method set at activation, rounded up to the next cent and never below min_monthly_payment_usd, or whose plan APR
        no longer equals the plan APR of its plan; its deferred-interest part not yet repaid is the deferred interest
        billed times the reset payments still due divided by the reset payments, but never more than the plan balance
        less those fees still owed, the reset payments being the due dates after the billing date through the final due
        date and those still due the due dates from the plan's next due date through the final due date, never more than
        the reset payments; the plan's first due date is the first date on its due day at least
        payoff_first_due_min_days calendar days after the purchase date, its final due date falls the term less one
        whole months after the first due date, and the due dates on or before a date are those from the first due date
        through that date. The plan's latest statement closing is the date of its latest monthly interest charge or,
        when the plan's deferred interest was billed after that date or no monthly interest charge has posted, the date
        its deferred interest was billed, monthly interest on a plan whose deferred interest was billed running from the
        billing date as the deferred-interest rule says. The daily interest rate is the plan APR divided by 36,500, and
        every span of days is counted from the day after its start date through its end date. The payoff amount is the
        plan balance plus simple interest on the interest-bearing balance from the plan's latest statement closing, or
        from the purchase date when the plan has none, through today, plus simple interest on the interest-bearing
        balance for standard_hold_days days of good-through period, rounded half up to the nearest cent.
      params: [standard_hold_days, plan_apr_percent]
    inputs:
      history:
        - {table: pos_transactions, aggregate: latest, field: txn_date, filters: {event_type: pos_interest_charged}}
        - {table: pos_transactions, aggregate: latest, field: amount, filters: {event_type: pos_payment_posted}}
        - {table: pos_transactions, aggregate: count, field: pos_txn_id, within_months: 6, filters: {event_type: pos_payment_returned}}
        - {table: pos_billing_disputes, aggregate: sum, field: disputed_amount, filters: {dispute_status: open}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 6, filters: {event_type: loan_payment_returned}}
        - {category: line, table: line_transactions, aggregate: count, field: line_txn_id, within_months: 6, filters: {event_type: line_payment_returned}}
      cross_category: [loan, line]

  - id: pos_ext_late_fee_relief
    base_policy_refs: [pos_evt_fee_waiver, pos_evt_billing_disputes, pos_evt_payments_and_fees, pos_agg_combined_exposure]
    overwrite:
      - base_policy: pos_evt_fee_waiver
        superseded_clause: >-
          A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been
          granted on the plan.
        replaced_by: >-
          A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been
          granted on the plan, and it is also granted without a request as a make-up relief, which is a late-fee relief
          or a returned-payment-fee relief under the make-up relief schedules, when fewer than that number have been granted; every make-up relief is booked on the courtesy basis and counts among those courtesy waivers, a fee whose make-up relief is owed is relieved under its schedule rather than waived on request.
    trigger: state_due
    subject: [pos_fee_waived]
    computes: relief_amount
    target_tool: relieve_late_fee_b1a4bf3c
    params:
      relief_clearing_days: 3
      late_relief_cap_usd: 10.0
      late_relief_keep_usd: 5.0
      late_relief_quick_days: 10
      late_relief_slow_days: 30
      late_relief_mid_timing_share: 0.9
      late_relief_slow_timing_share: 0.75
      late_relief_autopay_full_count: 5
      late_relief_autopay_some_count: 1
      late_relief_autopay_some_share: 0.95
      late_relief_autopay_none_share: 0.9
      late_relief_loan_late_share: 0.8
      late_relief_loan_returned_share: 0.9
      late_relief_line_late_share: 0.85
      late_relief_line_returned_share: 0.95
    rule: >-
      A courtesy waiver is granted on request when fewer than the plan's courtesy waivers per 12 months have been
      granted on the plan, and it is also granted without a request as a make-up relief, which is a late-fee relief or a
      returned-payment-fee relief under the make-up relief schedules, when fewer than that number have been granted;
      every make-up relief is booked on the courtesy basis and counts among those courtesy waivers, a fee whose make-up
      relief is owed is relieved under its schedule rather than waived on request. Under the late-fee relief schedule, a late
      fee is relieved once the monthly payment it was charged for has been made up after the fee and the make-up has
      cleared, as one courtesy-basis waiver of that late-fee entry, never more than the part of the fee not already
      waived. The late fee considered is the plan's latest late-fee entry by assessment date, the one recorded first
      where two share that date, and its due date is the installment due date it names. That monthly payment has been
      made up after the fee when the plan's next due date, its oldest unpaid due date, is later than that due date and
      the latest payment entry credited toward that due date, the one recorded first where two share that date, is dated
      after the fee's assessment date and has not come back, no returned-payment entry naming it; that latest payment's
      date is the make-up date, and the make-up has cleared once relief_clearing_days calendar days have passed since
      the make-up date. A late-fee relief is owed only when the make-up has cleared, today is no later than the fee
      waiver request window after the fee's assessment date, fewer than the plan's courtesy waivers per 12 months have
      been granted on the plan within the last 12 months, and the fee carries no waiver entry yet; otherwise nothing is
      relieved. A late-fee relief that works out to 0.00 is not owed, and nothing is booked for it. In the late-fee
      relief schedule the courtesy waivers granted within the last 12 months are those dated fewer than 12 whole months
      before the relief date, a month being whole once the relief date's day of the month has reached the entry's day of
      the month. The late-fee relief is the late fee in full, rounded half up to the nearest cent. Where a rule of the
      late-fee relief schedule sets a relief size or a share, the relief size takes the place of the full fee, every
      share multiplies it, all shares applying together, the product is never more than the part of the fee not already
      waived, and it is rounded half up to the nearest cent once, at the end. The late-fee relief size follows the
      plan's returned-payment record: when the plan shows two or more returned-payment entries dated within the last 6
      months, the relief size is the part of the late fee above late_relief_keep_usd, never below 0.00 and never more than late_relief_cap_usd; when it shows exactly one, the
      relief size is the part of the late fee above late_relief_keep_usd, never below 0.00; when it shows none, the
      relief size is the late fee in full; a window of the last N months here covering entries dated fewer than N whole
      months before the relief date, a month being whole once the relief date's day of the month has reached the entry's
      day of the month. The make-up timing share of a late-fee relief counts the days from the fee's assessment date to
      the make-up date: no more than late_relief_quick_days days gives 1, more than late_relief_quick_days and no more
      than late_relief_slow_days days gives late_relief_mid_timing_share, and more than late_relief_slow_days days gives
      late_relief_slow_timing_share; a span of days here being counted from the day after its start date through its end
      date. The AutoPay share of a late-fee relief counts the AutoPay debits credited on the plan that did not come
      back: fewer than late_relief_autopay_some_count gives late_relief_autopay_none_share,
      late_relief_autopay_some_count up to one below late_relief_autopay_full_count gives
      late_relief_autopay_some_share, and late_relief_autopay_full_count or more gives 1. The personal-loan share of a
      late-fee relief reads every Larkspur personal loan the customer has held: a late fee posted on any of them within
      the last 12 months gives late_relief_loan_late_share; a returned payment but no late fee posted on any of them
      within the last 12 months gives late_relief_loan_returned_share; otherwise the share is 1; a window of the last N
      months here covering entries dated fewer than N whole months before the relief date, a month being whole once the
      relief date's day of the month has reached the entry's day of the month. The FlexLine share of a late-fee relief
      reads every FlexLine the customer has held: a late fee posted on any of them within the last 12 months gives
      late_relief_line_late_share; a returned payment but no late fee posted on any of them within the last 12 months
      gives late_relief_line_returned_share; otherwise the share is 1; a window of the last N months here covering
      entries dated fewer than N whole months before the relief date, a month being whole once the relief date's day of
      the month has reached the entry's day of the month.
    prerequisite: []
    cross_category:
      - category: loan
        as: history
        reads: [loan_transactions.event_type]
        note: The personal-loan share of a late-fee relief is decided from late fees and returned payments on all of the customer's personal loans within 12 months.
      - category: line
        as: history
        reads: [line_transactions.event_type]
        note: The FlexLine share of a late-fee relief is decided from late fees and returned payments on all of the customer's FlexLines within 12 months.
    compute:
      - lfee_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_late_fee_assessed')"
      - lfee_amount: "LATEST('pos_transactions','amount', date_field='txn_date', event_type='pos_late_fee_assessed') if lfee_id != None else 0"
      - lfee_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_late_fee_assessed')"
      - lfee_due: "LATEST('pos_transactions','installment_due_date', date_field='txn_date', event_type='pos_late_fee_assessed')"
      - lfee_waived: "SUM('pos_transactions','amount', event_type='pos_fee_waived', related_txn_id=lfee_id) if lfee_id != None else 0"
      - make_up_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_payment_posted', installment_due_date=lfee_due) if lfee_id != None else None"
      - make_up_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_payment_posted', installment_due_date=lfee_due) if lfee_id != None else None"
      - make_up_returned: "(COUNT('pos_transactions', event_type='pos_payment_returned', related_txn_id=make_up_id) > 0) if make_up_id != None else False"
      - made_up: "lfee_id != None and make_up_date != None and not make_up_returned and F('next_due_date') > lfee_due and DAYS(lfee_date, make_up_date) > 0"
      - cleared: "made_up and DAYS(make_up_date, NOW) >= K('relief_clearing_days')"
      - in_window: "lfee_id != None and DAYS(lfee_date, NOW) <= P('fee_waiver_request_window_days')"
      - courtesy_12m: "COUNT('pos_transactions', within_months=12, date_field='txn_date', event_type='pos_fee_waived', waiver_reason='courtesy')"
      - relief_owed: "cleared and in_window and courtesy_12m < P('courtesy_waivers_per_12_months') and lfee_waived == 0"
      - returns_6m: "COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_payment_returned')"
      - relief_size: "MN(K('late_relief_cap_usd'), MX(0, lfee_amount - K('late_relief_keep_usd'))) if returns_6m >= 2 else (MX(0, lfee_amount - K('late_relief_keep_usd')) if returns_6m == 1 else lfee_amount)"
      - make_up_days: "DAYS(lfee_date, make_up_date) if made_up else 0"
      - timing_share: "K('late_relief_slow_timing_share') if make_up_days > K('late_relief_slow_days') else (K('late_relief_mid_timing_share') if make_up_days > K('late_relief_quick_days') else 1)"
      - autopay_debits: "COUNT('pos_transactions', event_type='pos_payment_posted', payment_channel='autopay_ach') - COUNT('pos_transactions', event_type='pos_payment_returned', payment_channel='autopay_ach')"
      - autopay_share: "K('late_relief_autopay_none_share') if autopay_debits < K('late_relief_autopay_some_count') else (K('late_relief_autopay_some_share') if autopay_debits < K('late_relief_autopay_full_count') else 1)"
      - loan_late_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - loan_returns_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned')"
      - loan_share: "K('late_relief_loan_late_share') if loan_late_12m >= 1 else (K('late_relief_loan_returned_share') if loan_returns_12m >= 1 else 1)"
      - line_late_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - line_returns_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_payment_returned')"
      - line_share: "K('late_relief_line_late_share') if line_late_12m >= 1 else (K('late_relief_line_returned_share') if line_returns_12m >= 1 else 1)"
      - relief_product: "relief_size * timing_share * autopay_share * loan_share * line_share"
      - result: "int(RND((MN(relief_product, lfee_amount - lfee_waived)) * 100, 6) + 0.5) / 100 if relief_owed else 0"
    compute_basis:
      lfee_id: "The late fee considered is the plan's latest late-fee entry by assessment date, the one recorded first where two share that date, and its due date is the installment due date it names."
      lfee_amount: "The late-fee relief is the late fee in full, rounded half up to the nearest cent."
      lfee_date: "The late fee considered is the plan's latest late-fee entry by assessment date, the one recorded first where two share that date, and its due date is the installment due date it names."
      lfee_due: "The late fee considered is the plan's latest late-fee entry by assessment date, the one recorded first where two share that date, and its due date is the installment due date it names."
      lfee_waived: "never more than the part of the fee not already waived"
      make_up_date: "that latest payment's date is the make-up date"
      make_up_id: "the latest payment entry credited toward that due date, the one recorded first where two share that date"
      make_up_returned: "has not come back, no returned-payment entry naming it"
      made_up: "That monthly payment has been made up after the fee when the plan's next due date, its oldest unpaid due date, is later than that due date and the latest payment entry credited toward that due date, the one recorded first where two share that date, is dated after the fee's assessment date and has not come back, no returned-payment entry naming it"
      cleared: "the make-up has cleared once relief_clearing_days calendar days have passed since the make-up date."
      in_window: "today is no later than the fee waiver request window after the fee's assessment date"
      courtesy_12m: "fewer than the plan's courtesy waivers per 12 months have been granted on the plan within the last 12 months"
      relief_owed: "A late-fee relief is owed only when the make-up has cleared, today is no later than the fee waiver request window after the fee's assessment date, fewer than the plan's courtesy waivers per 12 months have been granted on the plan within the last 12 months, and the fee carries no waiver entry yet; otherwise nothing is relieved."
      returns_6m: "The late-fee relief size follows the plan's returned-payment record"
      relief_size: "The late-fee relief size follows the plan's returned-payment record: when the plan shows two or more returned-payment entries dated within the last 6 months, the relief size is the part of the late fee above late_relief_keep_usd, never below 0.00 and never more than late_relief_cap_usd; when it shows exactly one, the relief size is the part of the late fee above late_relief_keep_usd, never below 0.00; when it shows none, the relief size is the late fee in full; a window of the last N months here covering entries dated fewer than N whole months before the relief date, a month being whole once the relief date's day of the month has reached the entry's day of the month."
      make_up_days: "The make-up timing share of a late-fee relief counts the days from the fee's assessment date to the make-up date"
      timing_share: "no more than late_relief_quick_days days gives 1, more than late_relief_quick_days and no more than late_relief_slow_days days gives late_relief_mid_timing_share, and more than late_relief_slow_days days gives late_relief_slow_timing_share"
      autopay_debits: "The AutoPay share of a late-fee relief counts the AutoPay debits credited on the plan that did not come back"
      autopay_share: "fewer than late_relief_autopay_some_count gives late_relief_autopay_none_share, late_relief_autopay_some_count up to one below late_relief_autopay_full_count gives late_relief_autopay_some_share, and late_relief_autopay_full_count or more gives 1."
      loan_late_12m: "a late fee posted on any of them within the last 12 months gives late_relief_loan_late_share"
      loan_returns_12m: "a returned payment but no late fee posted on any of them within the last 12 months gives late_relief_loan_returned_share"
      loan_share: "The personal-loan share of a late-fee relief reads every Larkspur personal loan the customer has held: a late fee posted on any of them within the last 12 months gives late_relief_loan_late_share; a returned payment but no late fee posted on any of them within the last 12 months gives late_relief_loan_returned_share; otherwise the share is 1; a window of the last N months here covering entries dated fewer than N whole months before the relief date, a month being whole once the relief date's day of the month has reached the entry's day of the month."
      line_late_12m: "a late fee posted on any of them within the last 12 months gives late_relief_line_late_share"
      line_returns_12m: "a returned payment but no late fee posted on any of them within the last 12 months gives late_relief_line_returned_share"
      line_share: "The FlexLine share of a late-fee relief reads every FlexLine the customer has held: a late fee posted on any of them within the last 12 months gives late_relief_line_late_share; a returned payment but no late fee posted on any of them within the last 12 months gives late_relief_line_returned_share; otherwise the share is 1; a window of the last N months here covering entries dated fewer than N whole months before the relief date, a month being whole once the relief date's day of the month has reached the entry's day of the month."
      relief_product: "Where a rule of the late-fee relief schedule sets a relief size or a share, the relief size takes the place of the full fee, every share multiplies it, all shares applying together, the product is never more than the part of the fee not already waived, and it is rounded half up to the nearest cent once, at the end."
      result: "A late-fee relief that works out to 0.00 is not owed, and nothing is booked for it."
    factors:
      - id: late_relief_size_rule
        effect: method
        decides: relief_size
        bindings: [returns_6m, relief_size]
        ladder:
          - when: "two or more returned-payment entries on the plan within the last 6 months"
            method: "capped keep-back: the part of the late fee above late_relief_keep_usd, never below 0.00 and never more than late_relief_cap_usd"
          - when: "exactly one returned-payment entry on the plan within the last 6 months"
            method: "keep-back: the part of the late fee above late_relief_keep_usd, never below 0.00"
          - when: "otherwise (no returned-payment entry within the last 6 months)"
            method: "whole: the late fee in full"
        baseline:
          relief_size: "lfee_amount"
        evidence: [history]
        cross_difficulty: null
      - id: late_relief_timing_band
        effect: parameter
        decides: timing_share
        bindings: [make_up_days, timing_share]
        ladder:
          - when: "make-up more than late_relief_slow_days days after the fee"
            value: "K('late_relief_slow_timing_share') = 0.75"
          - when: "make-up more than late_relief_quick_days and no more than late_relief_slow_days days after the fee"
            value: "K('late_relief_mid_timing_share') = 0.9"
          - when: "otherwise (make-up no more than late_relief_quick_days days after the fee)"
            value: "1"
        baseline:
          timing_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: late_relief_autopay_record
        effect: parameter
        decides: autopay_share
        bindings: [autopay_debits, autopay_share]
        ladder:
          - when: "fewer than late_relief_autopay_some_count AutoPay debits credited that did not come back"
            value: "K('late_relief_autopay_none_share') = 0.9"
          - when: "late_relief_autopay_some_count up to one below late_relief_autopay_full_count such debits"
            value: "K('late_relief_autopay_some_share') = 0.95"
          - when: "otherwise (late_relief_autopay_full_count or more such debits)"
            value: "1"
        baseline:
          autopay_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: late_relief_loan_record
        effect: parameter
        decides: loan_share
        bindings: [loan_late_12m, loan_returns_12m, loan_share]
        ladder:
          - when: "a late fee on any personal loan within 12 months"
            value: "K('late_relief_loan_late_share') = 0.8"
          - when: "a returned payment but no late fee on any personal loan within 12 months"
            value: "K('late_relief_loan_returned_share') = 0.9"
          - when: "otherwise"
            value: "1"
        baseline:
          loan_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: late_relief_flexline_record
        effect: parameter
        decides: line_share
        bindings: [line_late_12m, line_returns_12m, line_share]
        ladder:
          - when: "a late fee on any FlexLine within 12 months"
            value: "K('late_relief_line_late_share') = 0.85"
          - when: "a returned payment but no late fee on any FlexLine within 12 months"
            value: "K('late_relief_line_returned_share') = 0.95"
          - when: "otherwise"
            value: "1"
        baseline:
          line_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: line
    baseline:
      rule: >-
        The late fee considered is the plan's latest late-fee entry by assessment date, the one recorded first where two
        share that date, and its due date is the installment due date it names.
        The late-fee relief is the late fee in full, rounded half up to the nearest cent.
        A late-fee relief that works out to 0.00 is not owed, and nothing is booked for it.
      params: [fee_waiver_request_window_days]
    inputs:
      history:
        - {table: pos_transactions, aggregate: latest, field: amount, filters: {event_type: pos_late_fee_assessed}}
        - {table: pos_transactions, aggregate: sum, field: amount, filters: {event_type: pos_payment_posted, installment_due_date: that due date}}
        - {table: pos_transactions, aggregate: latest, field: txn_date, filters: {event_type: pos_payment_posted, installment_due_date: that due date}}
        - {table: pos_transactions, aggregate: count, field: pos_txn_id, within_months: 6, filters: {event_type: pos_payment_returned}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_late_fee_assessed}}
        - {category: line, table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_payment_returned}}
      cross_category: [loan, line]

  - id: pos_ext_returned_fee_relief
    base_policy_refs: [pos_evt_fee_waiver, pos_evt_billing_disputes, pos_evt_payments_and_fees, pos_agg_combined_exposure]
    overwrite: []
    trigger: state_due
    subject: [pos_fee_waived]
    computes: relief_amount
    target_tool: relieve_returned_payment_fee_3fbe4785
    params:
      returned_relief_clearing_days: 3
      returned_relief_cap_usd: 12.0
      returned_relief_keep_usd: 5.0
      returned_relief_quick_days: 2
      returned_relief_slow_days: 10
      returned_relief_mid_timing_share: 0.9
      returned_relief_slow_timing_share: 0.75
      returned_relief_low_principal_usd: 1000.0
      returned_relief_high_principal_usd: 3000.0
      returned_relief_mid_principal_share: 0.95
      returned_relief_high_principal_share: 0.9
      returned_relief_loan_late_share: 0.8
      returned_relief_loan_returned_share: 0.9
      returned_relief_line_late_share: 0.85
      returned_relief_line_returned_share: 0.95
    rule: >-
      Under the returned-payment-fee relief schedule, which is one of the make-up relief schedules the courtesy-waiver
      rule names, a returned-payment fee is relieved once the payment that came back has been replaced after the return
      and the replacement has cleared, as one courtesy-basis waiver of that returned-payment fee entry, never more than
      the part of the fee not already waived. The returned payment considered is the plan's latest returned-payment
      entry by return date, the one recorded first where two share that date; its fee is the returned-payment fee entry
      that names it, the payment that came back is the payment entry it reverses, and that payment's due date is the
      installment due date that payment entry names. The payment that came back has been replaced after the return when
      it was credited toward a monthly due date, the plan's next due date, its oldest unpaid due date, is later than
      that due date, and the latest payment entry credited toward that due date, the one recorded first where two share
      that date, is dated after the return date and has not come back, no returned-payment entry naming it; that latest
      payment's date is the replacement date, and the replacement has cleared once returned_relief_clearing_days
      calendar days have passed since the replacement date. A payment that came back without having been credited toward
      a monthly due date is never replaced, and its fee is not relieved under this schedule. Where only one courtesy
      waiver remains within the plan's courtesy waivers per 12 months in the rolling 12 months, the late-fee relief
      takes it only if one above 0.00 is owed on the plan's latest late fee, and otherwise the returned-payment-fee
      relief takes it. A returned-payment-fee relief is set only after the plan's ledger carries the late-fee relief
      owed on the plan's latest late fee, which takes a last remaining courtesy waiver first when it is above 0.00. A
      returned-payment-fee relief is owed only when the replacement has cleared, today is no later than the fee waiver
      request window after the fee's assessment date, fewer than the plan's courtesy waivers per 12 months have been
      granted on the plan within the last 12 months, and the fee carries no waiver entry yet; otherwise nothing is
      relieved. A returned-payment-fee relief that works out to 0.00 is not owed, and nothing is booked for it. In the
      returned-payment-fee relief schedule the courtesy waivers granted within the last 12 months are those dated fewer
      than 12 whole months before the relief date, a month being whole once the relief date's day of the month has
      reached the entry's day of the month. The returned-payment-fee relief is the returned-payment fee in full, rounded
      half up to the nearest cent. Where a rule of the returned-payment-fee relief schedule sets a relief size or a
      share, the relief size takes the place of the full fee, every share multiplies it, all shares applying together,
      the product is never more than the part of the fee not already waived, and it is rounded half up to the nearest
      cent once, at the end. The returned-payment-fee relief size follows the plan's late-fee record: when the late-fee
      entry that names the due date the payment that came back was credited toward already carries a waiver entry, so
      that the same missed payment has been relieved once, the relief size is the part of the returned-payment fee above
      returned_relief_keep_usd, never below 0.00 and never more than returned_relief_cap_usd; when that late-fee entry
      carries no waiver entry, or no late-fee entry names that due date but the plan shows a late fee dated within the
      last 6 months, the relief size is the part of the returned-payment fee above returned_relief_keep_usd, never below
      0.00; in every other case the relief size is the returned-payment fee in full; a window of the last N months here
      covering entries dated fewer than N whole months before the relief date, a month being whole once the relief
      date's day of the month has reached the entry's day of the month. The replacement timing share of a
      returned-payment-fee relief counts the days from the return date to the replacement date: no more than
      returned_relief_quick_days days gives 1, more than returned_relief_quick_days and no more than
      returned_relief_slow_days days gives returned_relief_mid_timing_share, and more than returned_relief_slow_days
      days gives returned_relief_slow_timing_share; a span of days here being counted from the day after its start date
      through its end date. The principal share of a returned-payment-fee relief reads the principal left on the plan's
      ledger, the financed charge plus returned payments less payments and provider refunds: below
      returned_relief_low_principal_usd gives 1, at least returned_relief_low_principal_usd and below
      returned_relief_high_principal_usd gives returned_relief_mid_principal_share, and
      returned_relief_high_principal_usd or more gives returned_relief_high_principal_share. The personal-loan share of
      a returned-payment-fee relief reads every Larkspur personal loan the customer has held: a late fee posted on any
      of them within the last 12 months gives returned_relief_loan_late_share; a returned payment but no late fee posted
      on any of them within the last 12 months gives returned_relief_loan_returned_share; otherwise the share is 1; a
      window of the last N months here covering entries dated fewer than N whole months before the relief date, a month
      being whole once the relief date's day of the month has reached the entry's day of the month. The FlexLine share
      of a returned-payment-fee relief reads every FlexLine the customer has held: a late fee posted on any of them
      within the last 12 months gives returned_relief_line_late_share; a returned payment but no late fee posted on any
      of them within the last 12 months gives returned_relief_line_returned_share; otherwise the share is 1; a window of
      the last N months here covering entries dated fewer than N whole months before the relief date, a month being
      whole once the relief date's day of the month has reached the entry's day of the month.
    prerequisite:
      - problem: pos_ext_late_fee_relief
        kind: value_input
        gate: same_due_late_relieved
        form: state
        policy_source: >-
          A returned-payment-fee relief is set only after the plan's ledger carries the late-fee relief owed on the plan's
          latest late fee, which takes a last remaining courtesy waiver first when it is above 0.00.
        condition: >-
          When a late-fee relief above 0.00 is owed on the plan's latest pos_late_fee_assessed entry under the late-fee
          relief schedule, a pos_fee_waived entry names that late-fee entry.
        resolved_by: relieve_late_fee_b1a4bf3c
        effect: >-
          Booking the late-fee relief puts a waiver on the late fee of the missed payment, which caps the
          returned-payment-fee relief size, and adds a courtesy waiver within the last 12 months; where it takes the
          plan's last remaining courtesy waiver, no returned-payment-fee relief is owed.
    cross_category:
      - category: loan
        as: history
        reads: [loan_transactions.event_type]
        note: The personal-loan share of a returned-payment-fee relief is decided from late fees and returned payments on all of the customer's personal loans within 12 months.
      - category: line
        as: history
        reads: [line_transactions.event_type]
        note: The FlexLine share of a returned-payment-fee relief is decided from late fees and returned payments on all of the customer's FlexLines within 12 months.
    compute:
      - ret_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_payment_returned')"
      - ret_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_payment_returned')"
      - ret_paid_id: "LATEST('pos_transactions','related_txn_id', date_field='txn_date', event_type='pos_payment_returned')"
      - rfee_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_returned_payment_fee_assessed', related_txn_id=ret_id) if ret_id != None else None"
      - rfee_amount: "SUM('pos_transactions','amount', event_type='pos_returned_payment_fee_assessed', related_txn_id=ret_id) if rfee_id != None else 0"
      - rfee_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_returned_payment_fee_assessed', related_txn_id=ret_id) if rfee_id != None else None"
      - rfee_waived: "SUM('pos_transactions','amount', event_type='pos_fee_waived', related_txn_id=rfee_id) if rfee_id != None else 0"
      - ret_due: "LATEST('pos_transactions','installment_due_date', date_field='txn_date', pos_txn_id=ret_paid_id) if ret_paid_id != None else None"
      - credited: "ret_due != None and ret_due != ''"
      - replace_date: "LATEST('pos_transactions','txn_date', date_field='txn_date', event_type='pos_payment_posted', installment_due_date=ret_due) if credited else None"
      - replace_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_payment_posted', installment_due_date=ret_due) if credited else None"
      - replace_returned: "(COUNT('pos_transactions', event_type='pos_payment_returned', related_txn_id=replace_id) > 0) if replace_id != None else False"
      - replaced: "credited and not replace_returned and rfee_id != None and replace_date != None and F('next_due_date') > ret_due and DAYS(ret_date, replace_date) > 0"
      - cleared: "replaced and DAYS(replace_date, NOW) >= K('returned_relief_clearing_days')"
      - in_window: "rfee_id != None and DAYS(rfee_date, NOW) <= P('fee_waiver_request_window_days')"
      - courtesy_12m: "COUNT('pos_transactions', within_months=12, date_field='txn_date', event_type='pos_fee_waived', waiver_reason='courtesy')"
      - relief_owed: "cleared and in_window and courtesy_12m < P('courtesy_waivers_per_12_months') and rfee_waived == 0"
      - same_due_late_count: "COUNT('pos_transactions', event_type='pos_late_fee_assessed', installment_due_date=ret_due) if credited else 0"
      - same_due_late_id: "LATEST('pos_transactions','pos_txn_id', date_field='txn_date', event_type='pos_late_fee_assessed', installment_due_date=ret_due) if credited else None"
      - same_due_late_relieved: "(SUM('pos_transactions','amount', event_type='pos_fee_waived', related_txn_id=same_due_late_id) > 0) if same_due_late_id != None else False"
      - late_fees_6m: "COUNT('pos_transactions', within_months=6, date_field='txn_date', event_type='pos_late_fee_assessed')"
      - relief_size: "MN(K('returned_relief_cap_usd'), MX(0, rfee_amount - K('returned_relief_keep_usd'))) if same_due_late_relieved else (MX(0, rfee_amount - K('returned_relief_keep_usd')) if (same_due_late_count >= 1 or late_fees_6m >= 1) else rfee_amount)"
      - replace_days: "DAYS(ret_date, replace_date) if replaced else 0"
      - timing_share: "K('returned_relief_slow_timing_share') if replace_days > K('returned_relief_slow_days') else (K('returned_relief_mid_timing_share') if replace_days > K('returned_relief_quick_days') else 1)"
      - principal_left: "SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_purchase_financed') + SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_returned') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_payment_posted') - SUM('pos_transactions','amount', date_field='txn_date', event_type='pos_merchant_refund_posted')"
      - principal_share: "K('returned_relief_high_principal_share') if principal_left >= K('returned_relief_high_principal_usd') else (K('returned_relief_mid_principal_share') if principal_left >= K('returned_relief_low_principal_usd') else 1)"
      - loan_late_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_fee_assessed')"
      - loan_returns_12m: "XCOUNT('loan','loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_returned')"
      - loan_share: "K('returned_relief_loan_late_share') if loan_late_12m >= 1 else (K('returned_relief_loan_returned_share') if loan_returns_12m >= 1 else 1)"
      - line_late_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_late_fee_assessed')"
      - line_returns_12m: "XCOUNT('line','line_transactions', within_months=12, date_field='txn_date', event_type='line_payment_returned')"
      - line_share: "K('returned_relief_line_late_share') if line_late_12m >= 1 else (K('returned_relief_line_returned_share') if line_returns_12m >= 1 else 1)"
      - relief_product: "relief_size * timing_share * principal_share * loan_share * line_share"
      - result: "int(RND((MN(relief_product, rfee_amount - rfee_waived)) * 100, 6) + 0.5) / 100 if relief_owed else 0"
    compute_basis:
      ret_id: "The returned payment considered is the plan's latest returned-payment entry by return date, the one recorded first where two share that date"
      ret_date: "The returned payment considered is the plan's latest returned-payment entry by return date, the one recorded first where two share that date"
      ret_paid_id: "the payment that came back is the payment entry it reverses, and that payment's due date is the installment due date that payment entry names."
      rfee_id: "its fee is the returned-payment fee entry that names it"
      rfee_amount: "The returned-payment-fee relief is the returned-payment fee in full, rounded half up to the nearest cent."
      rfee_date: "today is no later than the fee waiver request window after the fee's assessment date"
      rfee_waived: "never more than the part of the fee not already waived"
      ret_due: "the payment that came back is the payment entry it reverses, and that payment's due date is the installment due date that payment entry names."
      credited: "A payment that came back without having been credited toward a monthly due date is never replaced, and its fee is not relieved under this schedule."
      replace_date: "that latest payment's date is the replacement date"
      replace_id: "the latest payment entry credited toward that due date, the one recorded first where two share that date"
      replace_returned: "has not come back, no returned-payment entry naming it"
