      interest_free_part: "its interest-free part being the reset's deferred-interest part, which is the deferred interest billed on the plan but never more than the reset balance and bears no further interest"
      method_payments: "and its payments being the due dates after the deferred-interest billing date through the final due date"
      method_amount: "Under every way of working out the payment, the payment is that way's interest-free part divided equally over that way's payments plus the level payment that repays the rest of the reset balance at the reset rate over those payments (monthly rate = reset rate divided by 1200), or the rest divided equally over them when the reset rate is 0."
      cents: "rounded up to the next cent and never below min_monthly_payment_usd"
      rounded_up: "rounded up to the next cent and never below min_monthly_payment_usd"
      stored_rate: "the reset rate is stored as the plan APR from the reset onward."
      new_payment: "A reset payment is never below min_monthly_payment_usd, so a reset that is made always sets a payment and never a payment of 0.00"
      no_change: "a reset that would leave both the monthly payment and the plan APR as they are makes no change and is not made."
      result: "when no reset is made the reset payment is 0.00 and nothing is written"
    factors:
      - id: reset_payment_method
        effect: method
        decides: method_choice
        bindings: [di_billed_count, method_choice, interest_free_part, method_payments]
        ladder:
          - when: "a no-interest plan"
            method: "re-divide: the whole reset balance interest-free, divided equally over the reset payments"
          - when: "an interest-bearing plan that carries a deferred-interest billing entry"
            method: "split: the deferred-interest part interest-free and divided equally over the due dates after the billing date, plus the level payment that repays the rest of the reset balance at the reset rate over them"
          - when: "otherwise (any other interest-bearing plan)"
            method: "re-amortize: no interest-free part, the level payment that repays the reset balance at the reset rate over the reset payments"
        baseline:
          method_choice: "0"
          interest_free_part: "0"
          method_payments: "reset_payments"
        evidence: [history]
        cross_difficulty: null
      - id: reset_loan_record
        effect: parameter
        decides: loan_cut
        bindings: [loan_active, loan_late_12m, loan_returns_12m, loan_cut]
        ladder:
          - when: "an active personal loan, and no late fee and no returned payment on any personal loan within 12 months"
            value: "K('reset_loan_clean_cut') = 2.0"
          - when: "an active personal loan, and a returned payment but no late fee on any personal loan within 12 months"
            value: "K('reset_loan_returned_cut') = 1.0"
          - when: "otherwise"
            value: "0"
        baseline:
          loan_cut: "0"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: reset_flexline_record
        effect: parameter
        decides: line_cut
        bindings: [line_active, line_late_12m, line_returns_12m, line_cut]
        ladder:
          - when: "an active FlexLine, and no late fee and no returned payment on any FlexLine within 12 months"
            value: "K('reset_line_clean_cut') = 1.0"
          - when: "an active FlexLine, and a returned payment but no late fee on any FlexLine within 12 months"
            value: "K('reset_line_returned_cut') = 0.5"
          - when: "otherwise"
            value: "0"
        baseline:
          line_cut: "0"
        evidence: [cross_category, history]
        cross_difficulty: line
      - id: reset_payment_record
        effect: parameter
        decides: record_cut
        bindings: [late_fees_12m, record_cut]
        ladder:
          - when: "no late fee on the plan within the last 12 months"
            value: "K('reset_clean_record_cut') = 1.0"
          - when: "exactly one late fee on the plan within the last 12 months"
            value: "K('reset_one_late_record_cut') = 0.5"
          - when: "two or more late fees on the plan within the last 12 months"
            value: "0"
        baseline:
          record_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: reset_autopay_record
        effect: parameter
        decides: autopay_cut
        bindings: [autopay_debits, autopay_cut]
        ladder:
          - when: "reset_autopay_full_count or more AutoPay debits credited that did not come back"
            value: "K('reset_autopay_full_cut') = 0.5"
          - when: "reset_autopay_partial_count up to one below reset_autopay_full_count such debits"
            value: "K('reset_autopay_partial_cut') = 0.25"
          - when: "fewer such debits"
            value: "0"
        baseline:
          autopay_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: reset_paydown_band
        effect: parameter
        decides: paydown_cut
        bindings: [principal_left, paydown_ratio, paydown_cut]
        ladder:
          - when: "principal left no more than reset_half_limit of the financed amount"
            value: "K('reset_half_cut') = 0.5"
          - when: "principal left above reset_half_limit and no more than reset_three_quarter_limit of the financed amount"
            value: "K('reset_three_quarter_cut') = 0.25"
          - when: "principal left above reset_three_quarter_limit of the financed amount"
            value: "0"
        baseline:
          paydown_cut: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The reset balance is the plan balance, fees owed included, less the plan's amount past due, which stays due as
        it stands; the reset payments are the remaining payments when the plan has no amount past due and, when it has one, the due dates after the latest due date before today, every installment due before today staying in the amount past due and an installment due today counting among the reset payments, never fewer than one, and the reset payment applies from the first due date among them.
        Under the standard method the reset rate is the plan APR, and the reset payment is the level payment that repays the reset balance at the reset rate over the reset payments (monthly rate = reset rate divided by 1200), or the reset balance divided equally over the reset payments when the reset rate is 0, rounded up to the next cent and never below min_monthly_payment_usd.
        A reset payment is never below min_monthly_payment_usd, so a reset that is made always sets a payment and never a payment of 0.00; when no reset is made the reset payment is 0.00 and nothing is written, and a reset that would leave both the monthly payment and the plan APR as they are makes no change and is not made.
      params: [plan_apr_percent, term_months, min_monthly_payment_usd]
    inputs:
      history:
        - {table: pos_transactions, aggregate: count, field: pos_txn_id, filters: {event_type: pos_deferred_interest_billed}}
        - {table: pos_transactions, aggregate: count, field: pos_txn_id, within_months: 12, filters: {event_type: pos_late_fee_assessed}}
        - {table: pos_transactions, aggregate: count, field: pos_txn_id, filters: {event_type: pos_payment_posted, payment_channel: autopay_ach}}
        - {table: pos_transactions, aggregate: sum, field: amount, filters: {event_type: financed, payments, returns, refunds}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_returned}}
        - {category: line, table: line_transactions, aggregate: count, field: line_txn_id, within_months: 12, filters: {event_type: line_payment_returned}}
      cross_category: [loan, line]
