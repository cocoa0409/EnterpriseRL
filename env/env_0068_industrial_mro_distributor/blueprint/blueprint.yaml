name: env_0068_industrial_mro_distributor
company: Corbett Industrial Supply, Inc.

background: |
  Corbett Industrial Supply, Inc. is a broad-line maintenance, repair and operations (MRO) distributor headquartered in Columbus, Ohio, selling fasteners, cutting tools, abrasives, bearings and power transmission, electrical, lighting, motors, fluid power, plumbing, safety and PPE, janitorial, welding, material handling and test instruments to businesses only. It runs 146 branches and five distribution centers across the Midwest, Mid-Atlantic and Southeast, ships about 41,000 order lines a day and stocks roughly 310,000 items, with its Customer Care desk speaking in the plain, exact tone of an industrial supplier that bills to the cent.
  Every customer buys on account, and its commercial terms are held as a Commercial Credit Account at one of six terms tiers: Corbett Net 10 Starter Account, Corbett Net 30 Standard Account, Corbett Net 30 Preferred Account, Corbett Net 45 Business Account, Corbett Net 60 Corporate Account or Corbett Net 90 Strategic Account; invoices, payments, cash discounts, account charges, credit memos and disputes are booked against that account's receivable balance.
  Prices come from a Contract Pricing Agreement held at one of six levels: Corbett Account Price Schedule, Corbett Volume Discount Agreement, Corbett Category Contract, Corbett Net-Price Contract, Corbett Cost-Plus Contract or Corbett Strategic Supply Agreement; contract item prices, price claims and quarterly volume rebates are booked against the agreement.
  Each delivery location is a Ship-To Fulfillment Account at one of six service levels: Corbett Parcel Ship-To, Corbett Standard Ship-To, Corbett Priority Ship-To, Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To; order lines, shipments, backorders, cancellations, freight and service fees and returns are booked against the ship-to.
  Inventory management at the customer's site comes in two programs: the StockSmart Vendor-Managed Inventory Program, held per ship-to as StockSmart Self-Scan, StockSmart Monthly Service, StockSmart Biweekly Service, StockSmart Weekly Service, StockSmart Twice-Weekly Service or StockSmart Onsite Storeroom, which books service visits, bin replenishments, consigned stock, bin changes and program fees.
  The VendPoint Industrial Vending Program places badge-operated machines, each held as one of VendPoint Locker 12, VendPoint Locker 24, VendPoint Coil 40, VendPoint Coil 60, VendPoint Carousel 90 or VendPoint Smart Crib 300, and books restocks, vends, returns to the machine, vend error credits, monthly usage bills and machine fees.
  Corbett also sells the CalCare Tool Repair & Calibration Plan, held as CalCare Pay-Per-Service, CalCare Basic Plan, CalCare Standard Plan, CalCare Accredited Plan, CalCare Onsite Plan or CalCare Enterprise Plan, which books registered instruments, prepaid calibration units, calibrations, repairs and service charges.
  Employers fund protective footwear and prescription safety eyewear through the SafeStep Safety Footwear & Eyewear Program, held as SafeStep Voucher Basic, SafeStep Voucher Plus, SafeStep Footwear & Eyewear, SafeStep Mobile Fitting, SafeStep Premier or SafeStep Enterprise, which books the participant roster, allowance grants, redemptions, returns and employer bills.
  Ship-tos and programs bill their invoices to the customer's credit account, so one invoice history, one payment history and one set of credit memos tie the whole relationship together.
  Callers are buyers, maintenance planners, storeroom leads, accounts-payable clerks and plant managers at manufacturers, food and beverage plants, utilities, oil and gas operators, municipalities, hospitals, warehouses, contractors and school districts.
  A typical mid-sized customer holds a credit account, a pricing agreement, three or four ship-tos, a StockSmart program at its main plant and one or two VendPoint machines on the production floor, and calls about the paperwork those generate: an invoice that does not match the contract, a backorder that has slipped, a return, a fee on a monthly program bill, a vend that never dropped or a request to change terms.
  Long-standing accounts carry years of invoices, payments, claims, rebates, returns, visits and vends, while newer accounts arrive with a thin history and programs still inside their first terms.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: d1_credit_account_billing_and_credits
    claim:
      categories: [credit]
      event_types: [credit_payment_received, credit_cash_discount_taken, credit_charge_assessed, credit_memo_issued, credit_refund_issued, credit_small_balance_writeoff, credit_dispute_opened, credit_dispute_resolved, credit_limit_review_requested, credit_limit_review_decided, credit_limit_changed, credit_hold_released, credit_billing_preferences_updated, credit_account_closed]
    summary: >
      Accounts-payable clerks, controllers and buyers call about their Commercial Credit Account: an invoice they believe was billed twice or carries freight that should have been free, a cash discount the system did not honor, a finance charge or returned payment fee they want reversed, a card payment they want to make over the phone, a credit balance they want refunded, a higher or temporary credit limit for a shutdown, a credit hold that is stopping shipments, a switch to paper, EDI or consolidated invoicing, or closing the account.
      Their settings differ by terms tier (net days, discount windows, hold and collections thresholds, desk authority and courtesy waivers all vary across the six tiers), by account status (active, on_hold, in_collections or closed), by what the other holdings feed into the receivable ledger (shipments, program fees, return and price claim credits, rebate payouts), and by a payment, dispute and review history that decides counts such as returned payments in the lookback window, courtesy waivers already used and the on-time payment percentage.
      The governing rules are credit_terms_and_due_dates and credit_evt_cash_discount for what is owed and when, credit_evt_finance_charge, credit_evt_returned_payment and credit_evt_payment_methods for charges and payment handling, credit_evt_credit_memo and credit_evt_dispute for credits and disputes, credit_limit_review and credit_tier_review for limits and terms, credit_hold_and_collections for holds, and credit_evt_refund_and_writeoff, credit_billing_preferences and credit_account_closure for the rest; they turn on dated gates (invoice date windows, months since the last review, months after a returned payment), on state gates over the account status, on one-per-object rules and on the contract pricing tier that removes the cash discount on net-priced invoices.
      In the domain's natural order an invoice posts, payments, discounts and credits follow, unpaid balances age into charges and holds, and payments cure them; the agent records payments, discount lines, charges, credit memos, disputes, limit requests and decisions, refunds, write-offs, hold releases and billing preference changes, while closing the account is the customer's own act that the agent hands over for the customer to confirm.
      Requests no charter decides, such as extending a due date on one invoice, waiving a returned payment fee, settling a collections balance for less than owed or granting terms outside the tier ladder, have no policy route and go to a human representative as POLICY_NOT_COVERED.

  - name: d2_contract_pricing_claims_and_rebates
    claim:
      categories: [pricing]
      event_types: [pricing_agreement_signed, pricing_proposal_withdrawn, pricing_agreement_renewed, pricing_agreement_terminated, pricing_item_added, pricing_item_repriced, pricing_item_removed, pricing_claim_filed, pricing_claim_decided, pricing_rebate_paid, pricing_rebate_reversed]
    summary: >
      Buyers and procurement managers call about their Contract Pricing Agreement: an invoice line billed above the contract price, a quoted item they want added to the contract, an escalation notice they think is too early or too large, a competitor's quote they want matched, a quarterly rebate they expect to be paid or paid by check, a proposal they want to sign, a renewal, or an early termination.
      Their settings differ by agreement tier (list or category discounts, fixed net prices with locks and escalation caps, cost-plus markup, rebate ladders and payout minimums, claim windows and desk authority), by agreement status (proposed, active, renewal_pending, expired, terminated), by the dates on which items were priced, escalated or removed relative to the ship dates of the billed lines, and by the spend booked on invoices and return credits that drives rebates and anniversary reviews.
      The governing rules are pricing_price_basis for which price applies to a shipped line, pricing_evt_contract_items, pricing_evt_escalation and pricing_evt_competitive_match for changes to contract prices, pricing_evt_price_claim for overbilling claims and their credit, pricing_evt_rebate for accruals, payouts and clawbacks, and pricing_agreement_eligibility, pricing_renewal_and_termination and pricing_commitment_review for the agreement itself; they rest on ship-date pricing, dated windows anchored on invoice, quote, notice and effective dates, one-claim-per-line and one-accrual-per-period rules, and a credit account in good standing.
      In the domain's natural order an item is priced, lines ship and are invoiced, claims and rebates follow, and approved claims and rebate payouts become credit memos on the customer's credit account; the agent files and decides claims, adds and re-prices contract items, records rebate payouts and clawbacks, while signing a proposal or renewal and giving termination notice are the customer's own acts handed over for the customer to complete.
      Requests no charter decides, such as retroactively re-pricing past shipments outside a claim, matching a price on an item not on the contract, or paying a rebate on a tier that earns none, have no policy route and go to a human representative as POLICY_NOT_COVERED.

  - name: d3_ship_to_orders_backorders_and_returns
    claim:
      categories: [order]
      event_types: [order_line_booked, order_line_cancelled, order_backorder_cancelled, order_fee_charged, order_return_authorized, order_return_declined, order_return_received, order_return_closed_no_credit, order_ship_to_reactivated, order_service_level_changed, order_ship_to_closed]
    summary: >
      Maintenance planners, storeroom leads and buyers call about orders on one of their ship-tos: placing or cancelling a line, a backorder that is late or that they want cancelled or extended, a substitute they were offered, a freight, small order, expedite or special-order cancellation fee they question, and returning items that were wrong, damaged, defective, duplicated, ordered in error or no longer needed.
      Their settings differ by ship-to service level (free freight thresholds, minimums, included expedites, return windows, restocking and label fees, opened-item and special-order return rights), by ship-to status, by the customer's credit account status that decides whether lines ship, by item attributes such as stock status and handling class, and by the dated history of bookings, shipments, deliveries, backorders and earlier RMAs on the same order line.
      The governing rules are order_evt_booking_and_shipping and order_evt_freight_and_fees for orders and their charges, order_evt_backorder and order_evt_cancellation for backorders and cancellations, order_evt_returns for authorization, inspection and return credit, and order_ship_to_setup, order_agg_ship_to_portfolio and order_ship_to_lifecycle for the ship-to itself; they rest on ship-date pricing from the contract pricing charter, per-order and per-ship-to measures, dated windows counted from booking, ship and delivery records, and caps on returnable quantity.
      In the domain's natural order a line is booked, ships or is backordered, is invoiced on the credit account, and may later be returned with a credit memo; the agent books and cancels lines, charges fees, issues, declines, receives and closes RMAs and reactivates or re-levels ship-tos, while closing a ship-to is the customer's own act handed over for the customer to confirm.
      Requests no charter decides, such as crediting a hazmat item the customer simply no longer wants, paying a competitor's freight invoice or accepting a return of an item the customer bought elsewhere, have no policy route and go to a human representative as POLICY_NOT_COVERED.

  - name: d4_stocksmart_replenishment_and_program_billing
    claim:
      categories: [vmi]
      event_types: [vmi_pause_recorded, vmi_program_resumed, vmi_service_visit_completed, vmi_replenishment_delivered, vmi_replenishment_billed, vmi_program_fee_charged, vmi_bin_set, vmi_bin_removed, vmi_termination_noticed, vmi_consignment_withdrawn, vmi_buyback_billed]
    summary: >
      Storeroom leads, plant maintenance managers and purchasing call about their StockSmart program: a monthly minimum or onsite fee on the program bill, an emergency visit or trip charge, bins and par levels they want added, changed or removed, replenishment that stopped during a credit hold, a plant shutdown pause, the price or freight on a replenishment invoice, consigned stock and shrink, and ending the program with its buyback.
      Their settings differ by program tier (visit frequency, monthly minimum and fee, included bins and changes, emergency visits, consignment, credit hold service rule, minimum term and notice), by program status, by the served ship-to's freight terms, by the credit account status, by the contract price in effect on each delivery date, and by the month's billed replenishment, bin and change history and earlier pauses.
      The governing rules are vmi_enrollment and vmi_agg_program_portfolio for the program and how it is measured, vmi_evt_replenishment for deliveries and their billing, vmi_evt_consignment for consigned stock, vmi_evt_program_fees for every program fee, vmi_bins_and_par for bins, vmi_pause_and_resume for pauses and vmi_termination_and_buyback for ending the program; they rest on calendar-month and calendar-quarter counts, dated notice and pause windows, state gates over program and credit status and one-fee-per-type-per-month rules.
      In the domain's natural order a program goes live, visits replenish bins and bill them on the credit account, fees accrue monthly, and a notice leads to closure and buyback; the agent records pauses and resumptions, visits, replenishment billing, fees, bin changes, withdrawals and the buyback, while giving termination notice is the customer's own act handed over for the customer to complete.
      Requests no charter decides, such as a pause longer than the tier allows, Corbett buying back catalog stock the customer owns, or replenishing during a credit hold beyond what the tier's rule permits, have no policy route and go to a human representative as POLICY_NOT_COVERED.

  - name: d5_vendpoint_usage_and_machine_billing
    claim:
      categories: [vending]
      event_types: [vending_item_returned, vending_vend_error_credited, vending_usage_billed, vending_fee_charged, vending_selection_set, vending_selection_removed, vending_machine_unlocked, vending_machine_moved, vending_model_swapped, vending_removal_noticed]
    summary: >
      Safety managers, tool crib leads and accounts-payable clerks call about their VendPoint machines: a vend that did not drop, an unused item an employee wants to return to the machine, a shortfall, badge or cellular fee on the monthly bill, how usage was split across cost centers, items to add or remove from the planogram, a machine locked by a credit hold, moving or swapping a machine, and removing it.
      Their settings differ by machine model (minimum monthly usage, shortfall rate and cap, site pooling, ramp-up, return-to-machine rights, vend error authority, included badges and planogram changes, credit hold vending rule, minimum term and notice), by machine status, by the other machines at the same ship-to, by the credit account status, by contract prices on the vend dates, and by the month's vend, return, error and relocation history.
      The governing rules are vending_evt_usage_billing for vends and monthly bills, vending_evt_returns_and_errors for credits, vending_evt_fees and vending_agg_site_minimum for fees and pooled minimums, vending_planogram_management for selections, vending_credit_hold_lock for locks, and vending_placement and vending_removal_and_relocation for the placement itself; they rest on dated windows counted from vend dates and vend timestamps, calendar-month and rolling counts, one-credit-per-vend and one-bill-per-cost-center rules and state gates over machine and credit status.
      In the domain's natural order a machine is installed, restocked and vended from, each month's net vends and fees are billed to the credit account, and a notice leads to removal; the agent records returns, vend error credits, usage bills, fees, planogram changes, unlocks, relocations and swaps, while giving removal notice is the customer's own act handed over for the customer to complete.
      Requests no charter decides, such as crediting an item vended from a coil machine because it is unwanted, waiving a shortfall fee during ramp-down, or moving a machine to another company's site, have no policy route and go to a human representative as POLICY_NOT_COVERED.
