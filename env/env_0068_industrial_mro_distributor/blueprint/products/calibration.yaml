# Policy charter: CalCare Tool Repair & Calibration Plan (instrument registry, prepaid calibration units, calibration and repair service, plan renewals).
category: calibration
display_name: CalCare Tool Repair & Calibration Plan

binding:
  holding_table: calibration_plans
  event_tables: [calibration_assets, calibration_services]
  status_field: status
  variant_field: variant_name
  quantity_fields: {prepaid_units_balance: prepaid_units}

lifecycle:
  states: [pending, active, lapsed, cancelled]
  transitions:
    - {from: pending, to: active, by: system, means: "The plan year starts once the plan fee (if any) is billed and the instrument registry is loaded."}
    - {from: active, to: lapsed, by: system, means: "The plan year ends without renewal."}
    - {from: active, to: cancelled, by: user, means: "The customer cancels the plan by written notice."}
    - {from: pending, to: cancelled, by: user, means: "The customer cancels before the plan starts."}
    - {from: lapsed, to: active, by: agent, means: "A lapsed plan is reinstated for a new plan year at the customer's request."}

accounts:
  - key: prepaid_units
    unit: calibration units
    meaning: "Prepaid calibration units available on the plan: annual allotments, rollovers and purchased top-ups increase it; calibrations performed against the plan and year-end expiry decrease it."

# ---- category-level parameter dictionary ----
parameter_schema:
  annual_plan_fee_usd: "Annual plan fee, USD; 0.00 means no plan fee"
  plan_fee_billing: "When the plan fee is billed"
  prepaid_units_per_year: "Calibration units granted at the start of each plan year"
  unit_rollover_pct: "Percent of unused units (rounded down to whole units) carried into the next plan year; the rest expire"
  units_expire_at_year_end: "Whether unused units not rolled over expire at the plan year end"
  unit_topup_price_usd: "Price per prepaid unit bought mid-year, USD; 0.00 means top-ups are not offered"
  topup_min_units: "Smallest top-up purchase in units"
  standard_unit_price_usd: "Price per calibration unit when no prepaid unit is available, USD"
  instrument_class_units: "Mapping instrument class -> calibration units one standard calibration consumes"
  accredited_unit_multiplier: "Multiplier on the class units for an ISO/IEC 17025 accredited calibration"
  default_certificate_type: "Certificate issued when the customer does not ask for another"
  accredited_scope_classes: "Instrument classes inside Corbett's ISO/IEC 17025 accreditation scope"
  multi_point_surcharge_pct: "Surcharge, percent of the calibration price, for calibration at more test points than the standard procedure"
  as_found_data_included: "Whether as-found readings are reported with the certificate"
  adjustment_included: "Whether adjusting an out-of-tolerance instrument back into tolerance is included in the calibration"
  standard_turnaround_business_days: "Business days from receipt at the lab to return shipment"
  rush_turnaround_business_days: "Business days for a rush calibration"
  rush_fee_pct: "Rush fee, percent of the calibration price (at standard_unit_price_usd per unit)"
  rush_included_per_year: "Rush calibrations per plan year without the rush fee"
  late_turnaround_credit_pct: "Service credit, percent of the calibration price, when Corbett misses the turnaround"
  onsite_days_per_year: "Onsite calibration days included per plan year"
  onsite_day_fee_usd: "Fee per additional onsite calibration day, USD"
  onsite_min_instruments_per_day: "Smallest number of instruments to book an onsite day"
  pickup_delivery_included: "Whether Corbett picks up and returns instruments by route truck at no charge"
  pickup_fee_usd: "Fee per pickup when not included, USD"
  lab_shipping_label_included: "Whether a prepaid lab shipping label is provided"
  repair_labor_rate_usd_per_hour: "Repair labor rate, USD per hour"
  repair_parts_discount_pct: "Discount on repair parts list price, percent"
  repair_quote_threshold_usd: "Repair estimate, USD, above which the customer must approve a written quote before repair"
  repair_quote_validity_days: "Calendar days a repair quote stays open for the customer's decision"
  repair_warranty_days: "Days a completed repair is warranted"
  beyond_repair_evaluation_fee_usd: "Evaluation fee when an instrument is found beyond economical repair, USD"
  instrument_disposal_fee_usd: "Fee to dispose of a beyond-repair instrument at the customer's request, USD"
  out_of_tolerance_notice_business_days: "Business days within which the customer is notified of an out-of-tolerance as-found result"
  failed_cal_reperform_free_days: "Days after calibration within which an instrument found out of tolerance because of a Corbett calibration error is recalibrated free"
  certificate_reissue_fee_usd: "Fee to reissue a certificate with corrected customer data, USD"
  asset_registry_max: "Instruments registered without an additional asset fee"
  additional_asset_fee_usd: "Annual fee per registered instrument above the registry maximum, USD"
  loaner_fee_per_week_usd: "Fee per week for a loaner instrument while the customer's instrument is at the lab, USD"
  loaner_max_weeks: "Longest loaner period in weeks"
  default_interval_months: "Calibration interval assigned when the customer does not specify one"
  calibration_due_basis: "How the next due date is set"
  recall_reminder_days: "Days before an instrument's due date that the recall reminder is sent"
  plan_term_months: "Length of one plan year in months"
  auto_renew_default: "Whether the plan renews automatically for another plan year"
  renewal_price_increase_cap_pct: "Largest increase, percent, of the plan fee at renewal"
  cancellation_notice_days: "Calendar days of written notice to cancel the plan"
  plan_fee_refund_pct_unused: "Percent of the unused share of a prepaid plan fee refunded by credit memo on cancellation"

