# ---- data flow ----
events:
  - type: calibration_plan_enrolled
    target: calibration_plans
    mutation: create
    meaning: "The customer enrolls in a CalCare plan."
    grain: "One row per enrollment (one transaction)."
    fields: {customer_id: "Customer.", variant_name: "Plan tier.", plan_number: "Plan number (CAL-...)."}
    triggers: []
  - type: calibration_plan_activated
    target: calibration_plans
    mutation: {transition: {from: pending, to: active}}
    meaning: "The first plan year starts."
    grain: "One row per activation (one transaction)."
    fields: {plan_year_start: "First day of the plan year.", plan_year_end: "Last day of the plan year."}
    triggers: []
  - type: calibration_plan_renewed
    target: calibration_plans
    mutation: update
    meaning: "The plan renews for another plan year."
    grain: "One row per renewal (one transaction)."
    fields: {plan_year_start: "First day of the new plan year.", plan_year_end: "Last day of the new plan year."}
    triggers: []
  - type: calibration_plan_lapsed
    target: calibration_plans
    mutation: {transition: {from: active, to: lapsed}}
    meaning: "The plan year ends without renewal."
    grain: "One row per lapse (one transaction)."
    fields: {closed_date: "Day after the plan year end."}
    triggers: []
  - type: calibration_plan_reinstated
    target: calibration_plans
    mutation: {transition: {from: lapsed, to: active}}
    meaning: "A lapsed plan is reinstated for a new plan year."
    grain: "One row per reinstatement (one transaction)."
    fields: {plan_year_start: "First day of the new plan year.", plan_year_end: "Last day of the new plan year.", closed_date: "Cleared (left empty)."}
    triggers: []
  - type: calibration_plan_cancelled
    target: calibration_plans
    mutation: {transition: [{from: active, to: cancelled}, {from: pending, to: cancelled}]}
    meaning: "The customer cancels the plan."
    grain: "One row per cancellation (one transaction)."
    fields: {cancellation_notice_date: "Date the written notice was received.", closed_date: "Date the cancellation takes effect."}
    triggers: []
  - type: calibration_tier_changed
    target: calibration_plans
    mutation: update
    meaning: "The plan moves to another tier at renewal."
    grain: "One row per tier change (one transaction)."
    fields: {variant_name: "New tier."}
    triggers: []
  - type: calibration_asset_registered
    target: calibration_assets
    meaning: "An instrument is registered on the plan."
    grain: "One row per instrument registration."
    distinguish_by: [asset_tag, event_date]
    fields: {asset_tag: "Customer asset tag of the instrument.", instrument_class: "Instrument class.", manufacturer_model: "Manufacturer and model as on the nameplate.", interval_months: "Calibration interval in months.", event_date: "Registration date."}
    triggers: []
  - type: calibration_asset_retired
    target: calibration_assets
    meaning: "An instrument is retired from the plan."
    grain: "One row per retirement."
    distinguish_by: [asset_tag, event_date]
    fields: {asset_tag: "Asset tag.", retire_reason: "Why retired.", event_date: "Retirement date."}
    triggers: []
  - type: calibration_units_granted
    target: calibration_services
    meaning: "The plan year's unit allotment (plus any rollover) is granted."
    grain: "One row per plan year."
    distinguish_by: [service_reference]
    fields: {service_reference: "Plan year reference (CPY-...).", units: "Units granted including rollover.", event_date: "First day of the plan year."}
    account: prepaid_units
    direction: in
    triggers: []
  - type: calibration_units_purchased
    target: calibration_services
    meaning: "The customer buys a mid-year top-up of prepaid units."
    grain: "One row per top-up purchase."
    distinguish_by: [service_reference]
    fields: {service_reference: "Top-up reference (CTU-...).", units: "Units bought.", amount: "Price paid, USD.", event_date: "Purchase date."}
    account: prepaid_units
    direction: in
    triggers:
      - event: calibration:calibration_service_billed
        map: {service_reference: service_reference, charge_type: unit_topup, amount: amount}
  - type: calibration_units_expired
    target: calibration_services
    meaning: "Unused units not rolled over expire at the plan year end."
    grain: "One row per plan year end."
    distinguish_by: [service_reference]
    fields: {service_reference: "Plan year reference.", units: "Units expired.", event_date: "Last day of the plan year."}
    account: prepaid_units
    direction: out
    triggers: []
  - type: calibration_performed
    target: calibration_services
    meaning: "An instrument is calibrated at the lab or onsite and its certificate issued."
    grain: "One row per instrument calibration."
    distinguish_by: [service_reference, asset_tag]
    fields: {service_reference: "Calibration work order (CWO-...).", asset_tag: "Instrument calibrated.", certificate_type: "Certificate issued.", as_found_result: "As-found result.", units: "Prepaid units consumed (0 when billed per service).", rush: "Whether rush turnaround was ordered.", event_date: "Calibration date."}
    account: prepaid_units
    direction: out
    triggers: []
  - type: calibration_repair_quoted
    target: calibration_services
    meaning: "A written repair quote is issued for an instrument."
    grain: "One row per repair quote."
    distinguish_by: [service_reference]
    fields: {service_reference: "Repair quote (CRQ-...).", asset_tag: "Instrument.", amount: "Quoted repair price, USD.", event_date: "Quote date."}
    triggers: []
  - type: calibration_repair_decided
    target: calibration_services
    meaning: "The customer approves or declines a repair quote, or it expires."
    grain: "One row per decision on one quote."
    distinguish_by: [service_reference]
    fields: {service_reference: "Repair quote decided.", asset_tag: "Instrument.", quote_decision: "Decision.", event_date: "Decision date."}
    triggers: []
  - type: calibration_service_billed
    target: calibration_services
    meaning: "A calibration plan charge is billed: plan fee, overage units, rush, multi-point surcharge, pickup, loaner, repair, evaluation, disposal, certificate reissue, onsite day, additional assets or unit top-up."
    grain: "One row per charge type per work order or billing reference."
    distinguish_by: [service_reference, charge_type]
    fields: {service_reference: "Work order, quote or billing reference.", charge_type: "Kind of charge.", units: "Units the charge is computed on, 0 where not applicable.", amount: "Charge, USD.", event_date: "Billing date."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: amount, source_type: calibration_service, source_reference: service_reference}
  - type: calibration_service_credited
    target: calibration_services
    meaning: "A service credit is granted for a missed turnaround, or a plan fee refund on cancellation."
    grain: "One row per credit."
    distinguish_by: [service_reference, charge_type]
    fields: {service_reference: "Work order or plan reference credited.", charge_type: "Kind of charge credited.", amount: "Credit, USD.", event_date: "Credit date."}
    triggers:
      - event: credit:credit_memo_issued
        map: {amount: amount, source_type: program_billing_credit, source_reference: service_reference}

# ---- derived measures ----
measures:
  - id: calibration_msr_rush_in_plan_year
    window: "The current plan year, up to and including the calibration being charged."
    measure: "Count of calibration_performed rows with rush true dated in the plan year, in date then work order order."
  - id: calibration_msr_registered_assets
    window: "Point in time: the plan year start, or the registration date for a mid-year registration."
    measure: "Count of distinct asset_tag whose latest calibration_assets row is calibration_asset_registered."
  - id: calibration_msr_unused_units
    window: "Point in time: the last day of the plan year."
    measure: "The plan's prepaid_units balance (granted plus purchased less consumed and expired) on that day."

# ---- policies ----
policies:
  - id: calibration_agg_multi_holding
    subject: [calibration_plan_enrolled]
    rule: >-
      A customer holds at most one CalCare plan covering all of its registered instruments.
      A plan is not enrolled while the customer has a plan whose status is pending or active; a lapsed plan is reinstated rather than enrolled again.
    eligibility:
      - id: one_live_plan
        applies_to: [calibration_plan_enrolled]
        kind: dedup
        condition: "A plan is not enrolled while the customer has a plan whose status is pending or active"
        evidence_fields: [calibration_plans.customer_id, calibration_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[calibration_plans.customer_id]]
          action_bindings: {calibration_plans.customer_id: customer_id}
        dedup_contract:
          table: calibration_plans
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending, active]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: calibration_plan_enrollment
    subject: [calibration_plan_enrolled, calibration_plan_activated]
    rule: >-
      A plan is enrolled only for a customer whose Commercial Credit Account status is active.
      The tier is the one requested when the customer registers at least its minimum number of instruments, otherwise the highest tier met; the first plan year starts on activation and lasts plan_term_months months, and the plan fee of annual_plan_fee_usd is billed under plan_fee_billing.
    eligibility:
      - id: credit_active_for_plan
        applies_to: [calibration_plan_enrolled]
        kind: state
        condition: "A plan is enrolled only for a customer whose Commercial Credit Account status is active."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: calibration_evt_units
    subject: [calibration_units_granted, calibration_units_purchased, calibration_units_expired]
    rule: >-
      At the start of each plan year the plan is granted prepaid_units_per_year units plus the rollover from the year before.
      Each plan receives at most one unit grant for a plan year.
      At the plan year end unit_rollover_pct percent of the unused units, rounded down to whole units, roll into the next year if the plan renews, and where units_expire_at_year_end is true the rest expire; nothing rolls into a lapsed or cancelled plan.
      A top-up of at least topup_min_units units may be bought at unit_topup_price_usd per unit on a tier whose unit_topup_price_usd is above 0.00; purchased units expire with the plan year like granted units.
    eligibility:
      - id: one_grant_per_year
        applies_to: [calibration_units_granted]
        kind: dedup
        condition: "Each plan receives at most one unit grant for a plan year."
        evidence_fields: [calibration_services.calibration_plan_id, calibration_services.service_reference, calibration_services.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[calibration_services.calibration_plan_id, calibration_services.service_reference]]
          action_bindings: {calibration_services.calibration_plan_id: calibration_plan_id, calibration_services.service_reference: service_reference}
        dedup_contract:
          table: calibration_services
          mode: separate_record
          object_bindings: {calibration_plan_id: calibration_plan_id, service_reference: service_reference}
          duplicate_filters: {event_type: [calibration_units_granted]}
          distinct_fields: []
    measures: [calibration_msr_unused_units]

  - id: calibration_evt_service
    subject: [calibration_performed, calibration_service_billed]
    rule: >-
      Calibrations are performed only on a plan whose status is active; the CalCare Pay-Per-Service tier is a plan with no fee and no prepaid units, so every unit it uses is billed as overage.
      A standard calibration consumes the instrument class's units from instrument_class_units; an ISO/IEC 17025 accredited calibration consumes those units times accredited_unit_multiplier, rounded up to a whole unit, and is available only for classes in accredited_scope_classes; default_certificate_type applies when the customer names none.
      Prepaid units are used first; units not covered by the prepaid balance are billed at standard_unit_price_usd each as overage.
      A rush calibration beyond rush_included_per_year in the plan year, counted by calibration_msr_rush_in_plan_year, carries rush_fee_pct percent of the calibration price at standard_unit_price_usd per unit; calibration at more test points than the standard procedure carries multi_point_surcharge_pct percent of that price; a pickup carries pickup_fee_usd where pickup_delivery_included is false; a loaner carries loaner_fee_per_week_usd per started week up to loaner_max_weeks; a certificate reissue carries certificate_reissue_fee_usd.
      As-found readings are reported with the certificate where as_found_data_included is true.
      Adjustment of an out-of-tolerance instrument is included where adjustment_included is true, and the customer is notified of an out-of-tolerance as-found result within out_of_tolerance_notice_business_days business days.
      Onsite calibration is booked in days of at least onsite_min_instruments_per_day instruments; onsite_days_per_year days are included each plan year and each further day carries onsite_day_fee_usd.
      Instruments sent to the lab travel on a prepaid label where lab_shipping_label_included is true, and otherwise at the customer's cost.
      Each work order is billed at most once for each charge type.
    eligibility:
      - id: plan_active_for_service
        applies_to: [calibration_performed]
        kind: state
        condition: "Calibrations are performed only on a plan whose status is active"
        evidence_fields: [calibration_plans.status, calibration_plans.calibration_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[calibration_plans.calibration_plan_id]]
          action_bindings: {calibration_plans.calibration_plan_id: calibration_plan_id}
        state_contract:
          field: calibration_plans.status
          allowed: [active]
      - id: one_charge_per_type
        applies_to: [calibration_service_billed]
        kind: dedup
        condition: "Each work order is billed at most once for each charge type."
        evidence_fields: [calibration_services.service_reference, calibration_services.charge_type, calibration_services.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[calibration_services.service_reference, calibration_services.charge_type]]
          action_bindings: {calibration_services.service_reference: service_reference, calibration_services.charge_type: charge_type}
        dedup_contract:
          table: calibration_services
          mode: separate_record
          object_bindings: {service_reference: service_reference, charge_type: charge_type}
          duplicate_filters: {event_type: [calibration_service_billed]}
          distinct_fields: []
    measures: [calibration_msr_rush_in_plan_year]
    formula:
      overage_amount: "units * standard_unit_price_usd"

  - id: calibration_evt_repair
    subject: [calibration_repair_quoted, calibration_repair_decided, calibration_service_billed]
    rule: >-
      A repair estimated at or below repair_quote_threshold_usd is performed without a quote; above it Corbett issues a written quote and repairs only after the customer approves it.
      The customer's approval counts only when it is given no later than repair_quote_validity_days calendar days after the quote date.
      Count calendar days starting the day after the quote date; an approval on the last day counts, and an unanswered quote is decided expired on the day after and the instrument is returned unrepaired.
      Approving or declining a quote is the customer's own decision.
      Repair labor is billed at repair_labor_rate_usd_per_hour and parts at list less repair_parts_discount_pct percent; a completed repair is warranted for repair_warranty_days days, and a warranty repair is not billed.
      An instrument found beyond economical repair carries beyond_repair_evaluation_fee_usd, and instrument_disposal_fee_usd when the customer asks Corbett to dispose of it; a declined or expired quote carries the evaluation fee only when the instrument is beyond economical repair.
    eligibility:
      - id: approval_inside_quote_validity
        applies_to: [calibration_repair_decided]
        kind: time
        condition: "The customer's approval counts only when it is given no later than repair_quote_validity_days calendar days after the quote date."
        evidence_fields: [calibration_services.event_date, calibration_services.service_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[calibration_services.service_reference]]
          action_bindings: {calibration_services.service_reference: service_reference}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the quote date"
          anchor_source: calibration_services.event_date
          relation: not_after
          duration_source: variants.repair_quote_validity_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the quote date; an approval on the last day counts, and an unanswered quote is decided expired on the day after and the instrument is returned unrepaired."
          boundary: inclusive

  - id: calibration_evt_service_credits
    subject: [calibration_service_credited]
    rule: >-
      When Corbett returns an instrument later than standard_turnaround_business_days (or rush_turnaround_business_days for a rush) business days after receipt at the lab, the plan is credited late_turnaround_credit_pct percent of that calibration's price at standard_unit_price_usd per unit, rounded half up to the cent; delays caused by a pending repair quote do not count.
      An instrument found out of tolerance within failed_cal_reperform_free_days days after its calibration because of a Corbett calibration error is recalibrated with no units consumed and no charge.
      A cancellation refund under calibration_renewal_and_cancellation is credited by credit memo as charge_type plan_fee.
      Each work order receives at most one late turnaround credit.
    eligibility:
      - id: one_late_credit_per_order
        applies_to: [calibration_service_credited]
        kind: dedup
        condition: "Each work order receives at most one late turnaround credit."
        evidence_fields: [calibration_services.service_reference, calibration_services.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[calibration_services.service_reference]]
          action_bindings: {calibration_services.service_reference: service_reference}
        dedup_contract:
          table: calibration_services
          mode: separate_record
          object_bindings: {service_reference: service_reference}
          duplicate_filters: {event_type: [calibration_service_credited], charge_type: [late_turnaround_credit]}
          distinct_fields: []

  - id: calibration_asset_registry
    subject: [calibration_asset_registered, calibration_asset_retired, calibration_service_billed]
    rule: >-
      Instruments are registered with their class and interval; an instrument registered without an interval gets default_interval_months, and each next due date follows calibration_due_basis with a recall reminder recall_reminder_days days before it.
      Registered instruments above asset_registry_max, counted by calibration_msr_registered_assets at the plan year start, carry additional_asset_fee_usd each for the plan year; an instrument registered mid-year above the maximum carries the full annual fee.
      A retired instrument stays on the plan history and stops counting from the next plan year.
    eligibility: []
    measures: [calibration_msr_registered_assets]

  - id: calibration_renewal_and_cancellation
    subject: [calibration_plan_renewed, calibration_plan_lapsed, calibration_plan_cancelled, calibration_plan_reinstated, calibration_tier_changed]
    rule: >-
      Where auto_renew_default is true the plan renews for another plan year on the day after the plan year end unless cancelled; the renewed plan fee may rise by at most renewal_price_increase_cap_pct percent.
      A plan that does not renew lapses; a lapsed plan may be reinstated for a new plan year starting on the reinstatement date, with no rollover.
      Cancelling the plan is the customer's own act by written notice.
      A cancellation takes effect no earlier than cancellation_notice_days calendar days after the date the written cancellation notice is received.
      Count calendar days starting the day after the notice is received; the cancellation takes effect on the last day of the notice period or a later date the notice names.
      On cancellation remaining units expire, and plan_fee_refund_pct_unused percent of the unused share of a prepaid plan fee (by whole months remaining in the plan year) is refunded by credit memo.
      A tier change takes effect only at renewal.
    eligibility:
      - id: cancellation_notice_served
        applies_to: [calibration_plan_cancelled]
        kind: time
        condition: "A cancellation takes effect no earlier than cancellation_notice_days calendar days after the date the written cancellation notice is received."
        evidence_fields: [calibration_plans.cancellation_notice_date, calibration_plans.calibration_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[calibration_plans.calibration_plan_id]]
          action_bindings: {calibration_plans.calibration_plan_id: calibration_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the written cancellation notice is received"
          anchor_source: calibration_plans.cancellation_notice_date
          relation: not_before
          duration_source: variants.cancellation_notice_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the notice is received; the cancellation takes effect on the last day of the notice period or a later date the notice names."
          boundary: inclusive
    params:
      per_tier:
        CalCare Pay-Per-Service: {notice_days: "=cancellation_notice_days", refund_pct: "=plan_fee_refund_pct_unused"}
        CalCare Basic Plan: {notice_days: "=cancellation_notice_days", refund_pct: "=plan_fee_refund_pct_unused"}
        CalCare Standard Plan: {notice_days: "=cancellation_notice_days", refund_pct: "=plan_fee_refund_pct_unused"}
        CalCare Accredited Plan: {notice_days: "=cancellation_notice_days", refund_pct: "=plan_fee_refund_pct_unused"}
        CalCare Onsite Plan: {notice_days: "=cancellation_notice_days", refund_pct: "=plan_fee_refund_pct_unused"}
        CalCare Enterprise Plan: {notice_days: "=cancellation_notice_days", refund_pct: "=plan_fee_refund_pct_unused"}
