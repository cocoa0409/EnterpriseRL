# Policy charter: Contract Pricing Agreement (contract price files, price claims, escalations, competitive matches, volume rebates, renewals).
category: pricing
display_name: Contract Pricing Agreement

binding:
  holding_table: pricing_agreements
  event_tables: [pricing_items, pricing_claims, pricing_rebates]
  status_field: status
  variant_field: variant_name
  quantity_fields: {rebate_balance: rebate}

lifecycle:
  states: [proposed, active, renewal_pending, expired, terminated, withdrawn]
  transitions:
    - {from: proposed, to: active, by: user, means: "The customer's authorized signer signs the agreement and its pricing takes effect on the effective date."}
    - {from: proposed, to: withdrawn, by: system, means: "An unsigned proposal lapses when its validity period ends."}
    - {from: active, to: renewal_pending, by: system, means: "The renewal window opens the tier's renewal notice period before the expiration date."}
    - {from: renewal_pending, to: active, by: user, means: "The customer signs the renewal (or the agreement auto-renews where the tier auto-renews) and a new term begins."}
    - {from: renewal_pending, to: expired, by: system, means: "The term ends without a renewal; customer pricing reverts to Corbett list price less the Account Price Schedule discount."}
    - {from: active, to: terminated, by: user, means: "The customer terminates the agreement early by written notice."}
    - {from: renewal_pending, to: terminated, by: user, means: "The customer terminates during the renewal window by written notice."}

accounts:
  - key: rebate
    unit: USD
    meaning: "Volume rebate earned under the agreement and not yet paid out: quarterly accruals increase it; payouts, return clawbacks and forfeitures decrease it."

# ---- category-level parameter dictionary ----
parameter_schema:
  annual_spend_commitment_usd: "Annual net merchandise spend the customer commits to under the agreement, USD; 0 means no commitment"
  agreement_term_months: "Length of one agreement term in months from the effective date"
  proposal_validity_days: "Calendar days after the proposal date within which the customer must sign before the proposal lapses"
  list_discount_pct: "Flat discount off Corbett list price for catalog items with no category discount and no contract item price; 0 means not used"
  category_discount_schedule: "Mapping product_category -> discount percent off list for that category; categories not listed take list_discount_pct; empty mapping means no category discounts"
  category_discount_max_pct: "Largest category discount percent the tier may carry in its schedule"
  cost_plus_markup_pct: "Markup percent over Corbett's current supplier cost for every item priced on the cost-plus basis; 0 means the tier is not cost-plus"
  cost_plus_min_markup_per_unit_usd: "Minimum markup per unit on cost-plus items, USD; 0.0000 means not used"
  supplier_cost_change_notice_days: "Calendar days of notice before a supplier cost increase changes a cost-plus price; 0 means not used"
  fixed_net_items_min: "Smallest number of contract items (fixed net prices) the agreement carries"
  fixed_net_items_max: "Largest number of contract items (fixed net prices) the agreement may carry"
  contract_item_min_annual_units: "Minimum expected annual usage, in selling units, for an item to be added as a contract item"
  contract_item_removal_notice_days: "Calendar days of notice before a contract item removed by Corbett stops carrying its contract price"
  discontinued_item_price_protection_days: "Days a Corbett-approved substitute for a discontinued contract item is billed at the discontinued item's contract price"
  price_lock_months: "Months from the agreement effective date during which contract item prices cannot be escalated"
  annual_escalation_cap_pct: "Largest increase, percent of the prior contract price, in one escalation of a contract item"
  escalation_notice_days: "Calendar days between the escalation notice date and the date an escalated contract price may take effect"
  market_basket_review_months: "Months between scheduled market-basket reviews of contract items; 0 means no scheduled review"
  price_change_effective_basis: "Which date selects the price in effect for a billed line"
  unit_price_decimals: "Decimal places to which every contract and computed unit price is rounded (half up)"
  quantity_breaks_honored: "Whether Corbett list price quantity breaks apply before the discount on list-discount items"
  special_order_markup_pct: "Markup percent over supplier cost for non-stock special-order items not on the contract"
  special_pricing_request_business_days: "Business days to return a special pricing quote for an item not yet priced on the agreement"
  price_claim_window_days: "Calendar days after the invoice date within which a contract price claim is accepted"
  price_claim_min_usd: "Smallest claim amount, USD, processed; a smaller difference is not credited"
  price_claim_desk_authority_usd: "Largest claim amount, USD, the support desk approves without Pricing Desk review"
  price_claim_decision_business_days: "Business days within which a filed price claim is decided"
  competitive_match_allowed: "Whether the agreement allows a competitive price match on an existing contract item"
  competitive_match_max_reduction_pct: "Largest reduction, percent of the current contract price, a competitive match may grant"
  competitive_match_quote_max_age_days: "Largest age in calendar days of the competitor's written quote on the date of the match request"
  competitive_match_min_margin_pct: "Lowest gross margin percent (price minus supplier cost, over price) a matched price may carry"
  rebate_eligible: "Whether the agreement earns a quarterly volume rebate"
  rebate_ladder: "Ladder of quarterly qualifying spend brackets: list of {from_usd, rate_pct}; the rate of the highest bracket reached applies to the whole quarter's qualifying spend; empty list means no rebate"
  rebate_period: "Rebate measurement period"
  qualifying_spend_basis: "What counts toward rebate qualifying spend and commitment spend"
  rebate_excludes_special_orders: "Whether special-order lines are excluded from rebate qualifying spend"
  rebate_payout_days_after_period: "Calendar days after the end of the rebate period by which the rebate is paid"
  rebate_payout_methods: "Payout methods the customer may choose"
  rebate_min_payout_usd: "Smallest rebate balance, USD, paid out at a period end; a smaller balance carries forward"
  rebate_clawback_on_returns: "Whether returns of merchandise counted in a paid or accrued rebate period reduce the rebate"
  termination_rebate_forfeit: "Whether rebate accrued and unpaid is forfeited when the customer terminates early"
  shortfall_review_threshold_pct: "At each agreement anniversary, trailing 12 month qualifying spend below this percent of the commitment moves the agreement down one tier; 0 means no review"
  commitment_measurement_basis: "Window over which commitment spend is measured at an anniversary"
  early_termination_notice_days: "Calendar days of written notice before an early termination takes effect"
  renewal_notice_days: "Days before the expiration date at which the renewal window opens"
  auto_renew_default: "Whether the agreement renews automatically for auto_renew_term_months unless either party gives notice"
  auto_renew_term_months: "Length in months of a renewal term"
  special_pricing_quote_validity_days: "Calendar days a special pricing quote stays open for the customer to accept it as a contract item"

