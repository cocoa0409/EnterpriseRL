# Policy charter: SafeStep Safety Footwear & Eyewear Program (employer-paid allowances for compliant safety footwear and prescription safety eyewear).
category: safety
display_name: SafeStep Safety Footwear & Eyewear Program

binding:
  holding_table: safety_programs
  event_tables: [safety_participants, safety_redemptions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {allowance_pool_balance: allowance}

lifecycle:
  states: [enrolled, active, suspended, closed]
  transitions:
    - {from: enrolled, to: active, by: system, means: "The participant roster is loaded, allowances are granted and vouchers go live."}
    - {from: active, to: suspended, by: system, means: "Redemptions are suspended while the customer's credit account is on hold."}
    - {from: suspended, to: active, by: agent, means: "Redemptions resume after the credit hold is released."}
    - {from: active, to: closed, by: user, means: "The customer ends the program by written notice."}
    - {from: suspended, to: closed, by: user, means: "The customer ends a suspended program by written notice."}
    - {from: enrolled, to: closed, by: user, means: "The customer cancels before go-live."}

accounts:
  - key: allowance
    unit: USD
    meaning: "Employer-funded allowance available to the program's participants and not yet redeemed: annual grants and returned purchases increase it; redemptions (employer-paid portion) and expiries or forfeitures decrease it."

# ---- category-level parameter dictionary ----
parameter_schema:
  footwear_allowance_usd: "Employer-paid safety footwear allowance per participant per allowance year, USD"
  footwear_pairs_per_year: "Pairs of safety footwear a participant may redeem per allowance year"
  eyewear_allowance_usd: "Employer-paid prescription safety eyewear allowance per participant per allowance year, USD; 0.00 means not covered"
  eyewear_pairs_per_year: "Pairs of prescription safety eyewear a participant may redeem per allowance year"
  eligible_product_types: "Product types the allowance covers"
  eligible_line: "Footwear assortment participants choose from"
  overage_employee_discount_pct: "Discount off retail on the employee-paid amount above the allowance, percent"
  payroll_deduction_available: "Whether the employee-paid amount may be taken by payroll deduction"
  payroll_deduction_max_usd: "Largest employee-paid amount per purchase taken by payroll deduction, USD"
  employee_overage_payment_methods: "How a participant pays the amount above the allowance"
  allowance_year_basis: "Year over which allowances and pair counts run"
  allowance_grant_timing: "When the annual allowance is granted"
  new_hire_allowance_pct_by_quarter: "Percent of the annual allowance granted to a participant added in quarter 1, 2, 3 or 4 of the allowance year"
  new_hire_waiting_days: "Calendar days after the participant's hire date before the participant may be added"
  allowance_rollover_pct: "Percent of a participant's unused allowance carried into the next allowance year"
  footwear_standard: "Standard every covered footwear item must meet"
  eyewear_standard: "Standard every covered eyewear item must meet"
  job_class_footwear_rating: "Mapping job class -> footwear protection the covered pair must carry"
  metatarsal_upcharge_covered: "Whether the metatarsal guard upcharge for welders is covered on top of the allowance"
  orthotic_allowance_usd: "Extra allowance for prescribed orthotic inserts per allowance year, USD"
  accessories_allowance_usd: "Extra allowance for laces, insoles and toe guards per allowance year, USD"
  rx_age_max_months: "Largest age in months of the prescription used for prescription safety eyewear"
  rx_lens_options_included: "Lens options covered within the eyewear allowance"
  side_shields_required: "Whether prescription safety eyewear must carry permanent side shields"
  eye_exam_reimbursement_usd: "Reimbursement toward the participant's eye exam per allowance year, USD"
  mobile_fitting_visits_per_year: "Mobile shoe and eyewear fitting unit visits to the customer's site included per year"
  mobile_visit_fee_usd: "Fee per mobile visit beyond the included visits, USD"
  mobile_visit_min_participants: "Participants who must redeem at a mobile visit to avoid the low attendance fee"
  mobile_visit_short_fee_usd: "Low attendance fee for a mobile visit below the minimum, USD"
  mobile_visit_booking_notice_days: "Calendar days of notice needed to book a mobile visit"
  online_redemption_available: "Whether participants may redeem through the online store"
  online_shipping_fee_usd: "Shipping charged to the employer per online redemption, USD"
  voucher_validity_days: "Calendar days a participant voucher stays valid after issue"
  supervisor_approval_above_usd: "Retail amount, USD, above which a redemption needs the customer's program administrator approval"
  exchange_window_days: "Calendar days after purchase within which unworn items may be returned or exchanged"
  work_damage_replacement_days: "Days after purchase within which footwear damaged at work is replaced without using allowance; 0 means not offered"
  return_restores_allowance: "Whether a returned purchase restores the employer-paid amount to the participant's allowance"
  terminated_employee_allowance_forfeit: "Whether a removed participant's unused allowance is forfeited on removal"
  admin_fee_per_participant_usd: "Annual program administration fee per participant on the roster at the start of the allowance year, USD"
  min_annual_admin_fee_usd: "Minimum annual administration fee, USD"
  billing_frequency: "How redemptions are invoiced to the employer"
  redemption_dispute_window_days: "Calendar days after the invoice date within which the employer may dispute a billed redemption"
  participant_cap: "Largest roster size"
  participant_add_lead_business_days: "Business days to activate a participant added to the roster"
  min_term_months: "Minimum program term in months from go-live"
  termination_notice_days: "Calendar days of written notice to end the program"
  early_termination_fee_usd: "Fee when the program ends before the minimum term, USD"
  credit_hold_redemption_rule: "What happens to redemptions while the customer's credit account is on hold"

