# ---- data flow ----
events:
  - type: safety_program_enrolled
    target: safety_programs
    mutation: create
    meaning: "The customer enrolls in a SafeStep program for its employees."
    grain: "One row per enrollment (one transaction)."
    fields: {customer_id: "Customer.", variant_name: "Program tier.", program_number: "Program number (SS-...)."}
    triggers: []
  - type: safety_program_activated
    target: safety_programs
    mutation: {transition: {from: enrolled, to: active}}
    meaning: "The program goes live and the first allowance year starts."
    grain: "One row per activation (one transaction)."
    fields: {go_live_date: "Go-live date.", allowance_year_start: "First day of the current allowance year."}
    triggers: []
  - type: safety_program_suspended
    target: safety_programs
    mutation: {transition: {from: active, to: suspended}}
    meaning: "Redemptions are suspended under a credit hold."
    grain: "One row per suspension (one transaction)."
    fields: {suspended_date: "Date suspended."}
    triggers: []
  - type: safety_program_reinstated
    target: safety_programs
    mutation: {transition: {from: suspended, to: active}}
    meaning: "Redemptions resume."
    grain: "One row per reinstatement (one transaction)."
    fields: {suspended_date: "Cleared (left empty)."}
    triggers: []
  - type: safety_program_closed
    target: safety_programs
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}, {from: enrolled, to: closed}]}
    meaning: "The customer ends the program."
    grain: "One row per closure (one transaction)."
    fields: {termination_notice_date: "Date the written notice was received.", closed_date: "Closure date."}
    triggers: []
  - type: safety_allowance_year_rolled
    target: safety_programs
    mutation: update
    meaning: "A new allowance year starts on the program."
    grain: "One row per allowance year (one transaction)."
    fields: {allowance_year_start: "First day of the new allowance year."}
    triggers: []
  - type: safety_tier_changed
    target: safety_programs
    mutation: update
    meaning: "The program moves to another tier from the next allowance year."
    grain: "One row per tier change (one transaction)."
    fields: {variant_name: "New tier."}
    triggers: []
  - type: safety_participant_added
    target: safety_participants
    meaning: "An employee is added to the program roster."
    grain: "One row per roster addition."
    distinguish_by: [employee_number, event_date]
    fields: {employee_number: "Customer's employee number.", employee_name: "Employee name as on the roster.", job_class: "Job class.", hire_date: "Employee's hire date.", event_date: "Date added."}
    triggers: []
  - type: safety_participant_removed
    target: safety_participants
    meaning: "An employee is removed from the roster."
    grain: "One row per roster removal."
    distinguish_by: [employee_number, event_date]
    fields: {employee_number: "Employee number.", removal_reason: "Why removed.", event_date: "Date removed."}
    triggers: []
  - type: safety_allowance_granted
    target: safety_redemptions
    meaning: "A participant's allowance for a product type is granted for an allowance year."
    grain: "One row per participant per product type per allowance year."
    distinguish_by: [employee_number, product_type, allowance_year]
    fields: {employee_number: "Participant.", product_type: "Allowance product type.", allowance_year: "Allowance year (start date).", employer_amount: "Allowance granted, USD (after new-hire proration, plus rollover).", event_date: "Grant date."}
    account: allowance
    direction: in
    triggers: []
  - type: safety_purchase_redeemed
    target: safety_redemptions
    meaning: "A participant redeems the allowance on a covered purchase."
    grain: "One row per redemption (one receipt line)."
    distinguish_by: [redemption_reference]
    fields: {redemption_reference: "Receipt or voucher redemption number (SR-...).", employee_number: "Participant.", product_type: "Product type bought.", allowance_year: "Allowance year charged.", retail_amount: "Retail price, USD.", employer_amount: "Employer-paid portion drawn from the allowance, USD.", employee_amount: "Employee-paid portion after the overage discount, USD.", channel: "Where redeemed.", event_date: "Purchase date."}
    account: allowance
    direction: out
    triggers: []
  - type: safety_purchase_returned
    target: safety_redemptions
    meaning: "An unworn covered purchase is returned or exchanged and its employer-paid portion restored."
    grain: "One row per return of one redemption."
    distinguish_by: [redemption_reference]
    fields: {redemption_reference: "Return reference (SRR-...).", original_redemption_reference: "Redemption returned.", employee_number: "Participant.", product_type: "Product type.", allowance_year: "Allowance year restored.", employer_amount: "Employer-paid portion restored, USD.", event_date: "Return date."}
    account: allowance
    direction: in
    triggers: []
  - type: safety_allowance_expired
    target: safety_redemptions
    meaning: "Unused allowance expires at the allowance year end or is forfeited on removal."
    grain: "One row per participant per product type per allowance year."
    distinguish_by: [employee_number, product_type, allowance_year]
    fields: {employee_number: "Participant.", product_type: "Product type.", allowance_year: "Allowance year.", employer_amount: "Allowance expired or forfeited, USD.", event_date: "Expiry or forfeiture date."}
    account: allowance
    direction: out
    triggers: []
  - type: safety_redemptions_billed
    target: safety_redemptions
    meaning: "Employer-paid redemptions are invoiced to the customer, per redemption or monthly."
    grain: "One row per redemption billed (per_redemption) or per billing month (monthly_consolidated)."
    distinguish_by: [billing_period, redemption_reference]
    fields: {billing_period: "Billing month.", redemption_reference: "Redemption billed, or the billing month for a consolidated bill.", employer_amount: "Amount billed, USD.", event_date: "Invoice date."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: employer_amount, source_type: safety_program_billing, source_reference: redemption_reference}
  - type: safety_program_fee_charged
    target: safety_redemptions
    meaning: "A program fee is charged: annual administration, mobile visit, low attendance, online shipping or early termination."
    grain: "One row per fee occurrence."
    distinguish_by: [fee_type, fee_reference]
    fields: {fee_type: "Kind of fee.", fee_reference: "Visit, order, allowance year or termination reference.", billing_period: "Billing month.", employer_amount: "Fee, USD.", event_date: "Fee date."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: employer_amount, source_type: safety_program_billing, source_reference: fee_reference}

# ---- derived measures ----
measures:
  - id: safety_msr_participant_remaining
    window: "One participant, one product type, one allowance year, as of the purchase."
    measure: "Sum, USD, of employer_amount of the participant's safety_allowance_granted and safety_purchase_returned rows for the product type and year, less employer_amount of its safety_purchase_redeemed and safety_allowance_expired rows."
  - id: safety_msr_pairs_redeemed
    window: "One participant, one product type, one allowance year."
    measure: "Count of the participant's safety_purchase_redeemed rows for the product type and year less those returned (safety_purchase_returned referencing them)."
  - id: safety_msr_roster_size
    window: "Point in time: the date the count is taken."
    measure: "Count of distinct employee_number whose latest safety_participants row is safety_participant_added."
  - id: safety_msr_mobile_visits_year
    window: "The current program year (twelve months from the go-live anniversary), up to and including the visit being charged."
    measure: "Count of mobile fitting visits held, taken as distinct fee_reference values of safety_program_fee_charged rows plus included visits recorded as redemptions with channel mobile_unit on distinct dates, in date order."

# ---- policies ----
policies:
  - id: safety_agg_multi_holding
    subject: [safety_program_enrolled]
    rule: >-
      A customer holds at most one SafeStep program covering all of its participating employees across its sites.
      A program is not enrolled while the customer has a program whose status is enrolled, active or suspended.
    eligibility:
      - id: one_live_safety_program
        applies_to: [safety_program_enrolled]
        kind: dedup
        condition: "A program is not enrolled while the customer has a program whose status is enrolled, active or suspended."
        evidence_fields: [safety_programs.customer_id, safety_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safety_programs.customer_id]]
          action_bindings: {safety_programs.customer_id: customer_id}
        dedup_contract:
          table: safety_programs
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [enrolled, active, suspended]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: safety_enrollment
    subject: [safety_program_enrolled, safety_program_activated]
    rule: >-
      A program is enrolled only for a customer whose Commercial Credit Account status is active.
      The tier is the one requested when the roster meets its minimum participants, otherwise the highest tier met; the first allowance year starts on go-live under allowance_year_basis (a calendar_year program's first year ends on December 31 of the go-live year).
    eligibility:
      - id: credit_active_for_safety
        applies_to: [safety_program_enrolled]
        kind: state
        condition: "A program is enrolled only for a customer whose Commercial Credit Account status is active."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: safety_participant_roster
    subject: [safety_participant_added, safety_participant_removed]
    rule: >-
      The customer's program administrator adds and removes participants; the roster never exceeds participant_cap, counted by safety_msr_roster_size.
      An employee is added only when the date of addition is no earlier than new_hire_waiting_days calendar days after the employee's hire date.
      Count calendar days starting the day after the hire date; an addition on the last waiting day is allowed.
      A participant added after the allowance year started receives the share of each annual allowance given by new_hire_allowance_pct_by_quarter for the quarter of the allowance year in which the participant is added, rounded half up to the cent; additions take effect within participant_add_lead_business_days business days.
      A removed participant's unused allowance is forfeited on the removal date where terminated_employee_allowance_forfeit is true.
    eligibility:
      - id: waiting_period_served
        applies_to: [safety_participant_added]
        kind: time
        condition: "An employee is added only when the date of addition is no earlier than new_hire_waiting_days calendar days after the employee's hire date."
        evidence_fields: [safety_participants.hire_date, safety_participants.employee_number]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[safety_participants.employee_number]]
          action_bindings: {safety_participants.employee_number: employee_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the employee's hire date"
          anchor_source: safety_participants.hire_date
          relation: not_before
          duration_source: variants.new_hire_waiting_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the hire date; an addition on the last waiting day is allowed."
          boundary: inclusive
    measures: [safety_msr_roster_size]

  - id: safety_evt_allowance
    subject: [safety_allowance_granted, safety_allowance_expired, safety_allowance_year_rolled]
    rule: >-
      On the first day of each allowance year under allowance_grant_timing every participant on the roster is granted footwear_allowance_usd for safety footwear and, where the tier covers it, eyewear_allowance_usd for prescription safety eyewear, plus orthotic_allowance_usd and accessories_allowance_usd where above 0.00.
      Each participant receives at most one grant per product type for an allowance year.
      At the allowance year end allowance_rollover_pct percent of each participant's unused allowance per product type, rounded half up to the cent, is added to the next year's grant and the rest expires; on a tier whose rollover is 0 all unused allowance expires.
    eligibility:
      - id: one_grant_per_type_year
        applies_to: [safety_allowance_granted]
        kind: dedup
        condition: "Each participant receives at most one grant per product type for an allowance year."
        evidence_fields: [safety_redemptions.employee_number, safety_redemptions.product_type, safety_redemptions.allowance_year, safety_redemptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safety_redemptions.employee_number, safety_redemptions.product_type, safety_redemptions.allowance_year]]
          action_bindings: {safety_redemptions.employee_number: employee_number, safety_redemptions.product_type: product_type, safety_redemptions.allowance_year: allowance_year}
        dedup_contract:
          table: safety_redemptions
          mode: separate_record
          object_bindings: {employee_number: employee_number, product_type: product_type, allowance_year: allowance_year}
          duplicate_filters: {event_type: [safety_allowance_granted]}
          distinct_fields: [allowance_year]
    measures: [safety_msr_participant_remaining]

  - id: safety_evt_redemption
    subject: [safety_purchase_redeemed]
    rule: >-
      Redemptions are taken only on a program whose status is active, or, on a tier whose credit_hold_redemption_rule is honor_issued_vouchers, on a suspended program for vouchers issued before the suspension.
      A participant on the roster may redeem only product types in eligible_product_types from the eligible_line assortment; footwear must meet footwear_standard with the rating job_class_footwear_rating gives for the participant's job class, and eyewear must meet eyewear_standard with permanent side shields where side_shields_required is true and use a prescription no older than rx_age_max_months months with lens options in rx_lens_options_included.
      A participant redeems at most footwear_pairs_per_year pairs of footwear and eyewear_pairs_per_year pairs of eyewear in an allowance year, counted by safety_msr_pairs_redeemed; a voucher is valid voucher_validity_days days from issue; a purchase with retail above supervisor_approval_above_usd needs the program administrator's approval.
      The employer-paid portion is the lower of the retail price and safety_msr_participant_remaining; where metatarsal_upcharge_covered is true a welder's metatarsal upcharge is added to the employer-paid portion beyond the allowance.
      The employee pays the rest less overage_employee_discount_pct percent, rounded half up to the cent, by a method in employee_overage_payment_methods, with payroll deduction only where payroll_deduction_available is true and capped at payroll_deduction_max_usd per purchase.
      An eye exam receipt is reimbursed up to eye_exam_reimbursement_usd per allowance year, drawn from the participant's eyewear allowance.
      Online redemptions are available where online_redemption_available is true and carry online_shipping_fee_usd to the employer.
    eligibility:
      - id: program_can_redeem
        applies_to: [safety_purchase_redeemed]
        kind: state
        condition: "Redemptions are taken only on a program whose status is active, or, on a tier whose credit_hold_redemption_rule is honor_issued_vouchers, on a suspended program for vouchers issued before the suspension."
        evidence_fields: [safety_programs.status, safety_programs.safety_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safety_programs.safety_program_id]]
          action_bindings: {safety_programs.safety_program_id: safety_program_id}
        state_contract:
          field: safety_programs.status
          allowed: [active, suspended]
    measures: [safety_msr_participant_remaining, safety_msr_pairs_redeemed]
    params:
      per_tier:
        SafeStep Voucher Basic: {footwear: "=footwear_allowance_usd", eyewear: "=eyewear_allowance_usd"}
        SafeStep Voucher Plus: {footwear: "=footwear_allowance_usd", eyewear: "=eyewear_allowance_usd"}
        SafeStep Footwear & Eyewear: {footwear: "=footwear_allowance_usd", eyewear: "=eyewear_allowance_usd"}
        SafeStep Mobile Fitting: {footwear: "=footwear_allowance_usd", eyewear: "=eyewear_allowance_usd"}
        SafeStep Premier: {footwear: "=footwear_allowance_usd", eyewear: "=eyewear_allowance_usd"}
        SafeStep Enterprise: {footwear: "=footwear_allowance_usd", eyewear: "=eyewear_allowance_usd"}
    formula:
      employer_amount: "min(retail_amount, safety_msr_participant_remaining)"
      employee_amount: "round((retail_amount - min(retail_amount, safety_msr_participant_remaining)) * (1 - overage_employee_discount_pct / 100), 2)"

  - id: safety_evt_returns
    subject: [safety_purchase_returned]
    rule: >-
      An unworn item is returned or exchanged only when the return is made no later than exchange_window_days calendar days after the purchase date.
      Count calendar days starting the day after the purchase date; a return on the last day is accepted.
      Where return_restores_allowance is true the employer-paid portion is restored to the participant's allowance for the year of the original purchase and credited on the next employer bill; the employee-paid portion is refunded to the employee.
      Footwear damaged at work within work_damage_replacement_days days of purchase is replaced once without drawing on the allowance; normal wear is not work damage.
      Each redemption can be returned only once.
    eligibility:
      - id: inside_exchange_window
        applies_to: [safety_purchase_returned]
        kind: time
        condition: "An unworn item is returned or exchanged only when the return is made no later than exchange_window_days calendar days after the purchase date."
        evidence_fields: [safety_redemptions.event_date, safety_redemptions.redemption_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safety_redemptions.redemption_reference]]
          action_bindings: {safety_redemptions.redemption_reference: original_redemption_reference}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase date"
          anchor_source: safety_redemptions.event_date
          relation: not_after
          duration_source: variants.exchange_window_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the purchase date; a return on the last day is accepted."
          boundary: inclusive
      - id: one_return_per_redemption
        applies_to: [safety_purchase_returned]
        kind: dedup
        condition: "Each redemption can be returned only once."
        evidence_fields: [safety_redemptions.original_redemption_reference, safety_redemptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safety_redemptions.original_redemption_reference]]
          action_bindings: {safety_redemptions.original_redemption_reference: original_redemption_reference}
        dedup_contract:
          table: safety_redemptions
          mode: separate_record
          object_bindings: {original_redemption_reference: original_redemption_reference}
          duplicate_filters: {event_type: [safety_purchase_returned]}
          distinct_fields: []

  - id: safety_evt_billing_and_fees
    subject: [safety_redemptions_billed, safety_program_fee_charged]
    rule: >-
      Employer-paid redemptions are invoiced under billing_frequency: one invoice per redemption on its purchase date, or one invoice per calendar month dated its last day netting that month's returns.
      The employer may dispute a billed redemption within redemption_dispute_window_days calendar days of the invoice date through the Commercial Credit Account dispute process.
      At the start of each allowance year the administration fee is admin_fee_per_participant_usd times safety_msr_roster_size on that day, raised to min_annual_admin_fee_usd when lower.
      Mobile fitting visits are booked with mobile_visit_booking_notice_days days of notice; visits beyond mobile_fitting_visits_per_year in the program year, counted by safety_msr_mobile_visits_year, carry mobile_visit_fee_usd, and a visit at which fewer than mobile_visit_min_participants participants redeem carries mobile_visit_short_fee_usd.
      Each fee occurrence is charged once, and a fee whose tier amount is 0.00 is never charged.
    eligibility:
      - id: one_fee_per_occurrence
        applies_to: [safety_program_fee_charged]
        kind: dedup
        condition: "Each fee occurrence is charged once"
        evidence_fields: [safety_redemptions.fee_type, safety_redemptions.fee_reference, safety_redemptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safety_redemptions.fee_type, safety_redemptions.fee_reference]]
          action_bindings: {safety_redemptions.fee_type: fee_type, safety_redemptions.fee_reference: fee_reference}
        dedup_contract:
          table: safety_redemptions
          mode: separate_record
          object_bindings: {fee_type: fee_type, fee_reference: fee_reference}
          duplicate_filters: {event_type: [safety_program_fee_charged]}
          distinct_fields: []
    measures: [safety_msr_roster_size, safety_msr_mobile_visits_year]
    formula:
      admin_fee: "max(admin_fee_per_participant_usd * safety_msr_roster_size, min_annual_admin_fee_usd)"

  - id: safety_program_status
    subject: [safety_program_suspended, safety_program_reinstated, safety_program_closed, safety_tier_changed]
    rule: >-
      When the customer's Commercial Credit Account is placed on hold the program is suspended under credit_hold_redemption_rule, and it is reinstated when the account is active again.
      Ending the program is the customer's own act by written notice.
      The program closes no earlier than termination_notice_days calendar days after the date the written termination notice is received.
      Count calendar days starting the day after the notice is received; the program closes on the last day of the notice period or a later date the notice names.
      On closure all unused allowance expires, redemptions already made are billed, and early_termination_fee_usd applies once when closure falls before min_term_months months after go-live.
      A tier change takes effect from the next allowance year.
    eligibility:
      - id: safety_notice_served
        applies_to: [safety_program_closed]
        kind: time
        condition: "The program closes no earlier than termination_notice_days calendar days after the date the written termination notice is received."
        evidence_fields: [safety_programs.termination_notice_date, safety_programs.safety_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safety_programs.safety_program_id]]
          action_bindings: {safety_programs.safety_program_id: safety_program_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the written termination notice is received"
          anchor_source: safety_programs.termination_notice_date
          relation: not_before
          duration_source: variants.termination_notice_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the notice is received; the program closes on the last day of the notice period or a later date the notice names."
          boundary: inclusive
