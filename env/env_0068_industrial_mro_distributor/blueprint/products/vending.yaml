# ---- data flow ----
events:
  - type: vending_machine_requested
    target: vending_machines
    mutation: create
    meaning: "The customer requests a VendPoint machine for a ship-to."
    grain: "One row per machine request (one transaction)."
    fields: {customer_id: "Customer.", ship_to_id: "Ship-to where the machine will stand.", variant_name: "Machine model tier.", requested_date: "Request date.", network_connection: "How the machine will connect."}
    triggers: []
  - type: vending_machine_installed
    target: vending_machines
    mutation: {transition: {from: requested, to: active}}
    meaning: "The machine is installed and goes live."
    grain: "One row per installation (one transaction)."
    fields: {machine_serial: "Serial number of the installed machine.", installed_date: "Installation date (start of the minimum term)."}
    triggers: []
  - type: vending_machine_locked
    target: vending_machines
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The machine is locked under a credit hold."
    grain: "One row per lock (one transaction)."
    fields: {locked_date: "Date locked."}
    triggers: []
  - type: vending_machine_unlocked
    target: vending_machines
    mutation: {transition: {from: suspended, to: active}}
    meaning: "The machine is unlocked after the credit hold is released."
    grain: "One row per unlock (one transaction)."
    fields: {locked_date: "Cleared on unlock (left empty)."}
    triggers: []
  - type: vending_removal_noticed
    target: vending_machines
    mutation: {transition: [{from: active, to: removal_pending}, {from: suspended, to: removal_pending}]}
    meaning: "The customer gives written notice to remove the machine."
    grain: "One row per removal notice (one transaction)."
    fields: {termination_notice_date: "Date the written notice was received."}
    triggers: []
  - type: vending_machine_removed
    target: vending_machines
    mutation: {transition: [{from: removal_pending, to: removed}, {from: requested, to: removed}]}
    meaning: "The machine is de-installed, or the request is cancelled before installation."
    grain: "One row per removal (one transaction)."
    fields: {removed_date: "Removal or cancellation date."}
    triggers: []
  - type: vending_machine_relocated
    target: vending_machines
    mutation: update
    meaning: "The machine is moved to another ship-to of the customer."
    grain: "One row per relocation (one transaction)."
    fields: {ship_to_id: "New ship-to."}
    triggers: []
  - type: vending_model_swapped
    target: vending_machines
    mutation: update
    meaning: "The machine is swapped for another VendPoint model."
    grain: "One row per swap (one transaction)."
    fields: {variant_name: "New model tier.", machine_serial: "Serial of the replacement machine."}
    triggers: []
  - type: vending_machine_moved
    target: vending_transactions
    meaning: "A completed relocation of the machine is logged."
    grain: "One row per relocation."
    distinguish_by: [txn_reference]
    fields: {txn_reference: "Relocation work order (VRL-...).", ship_to_id: "Ship-to the machine moved to.", event_date: "Relocation date."}
    triggers:
      - event: vending:vending_machine_relocated
        map: {ship_to_id: ship_to_id}
  - type: vending_restocked
    target: vending_transactions
    meaning: "Consigned stock is loaded into a machine selection."
    grain: "One row per item loaded on one restock visit."
    distinguish_by: [txn_reference, sku]
    fields: {txn_reference: "Restock visit reference (VRS-...).", sku: "Item.", product_category: "Product category.", quantity: "Units loaded.", unit_price: "Contract unit price, USD.", extended_amount: "Value loaded, USD.", visit_type: "Scheduled or emergency restock.", event_date: "Restock date."}
    account: machine_stock
    direction: in
    triggers: []
  - type: vending_item_issued
    target: vending_transactions
    meaning: "An employee badge vends an item."
    grain: "One row per vend transaction."
    distinguish_by: [txn_reference]
    fields: {txn_reference: "Vend transaction number from the machine log (VT-...).", sku: "Item.", product_category: "Product category.", quantity: "Units vended.", unit_price: "Contract unit price on the vend date, USD.", extended_amount: "Vend value, USD.", employee_badge: "Badge number that vended.", cost_center: "Customer cost center the badge is assigned to.", vended_at: "Vend timestamp.", event_date: "Vend date."}
    account: machine_stock
    direction: out
    triggers: []
  - type: vending_item_returned
    target: vending_transactions
    meaning: "An unused vended item is returned into the machine for credit."
    grain: "One row per return transaction."
    distinguish_by: [txn_reference]
    fields: {txn_reference: "Return transaction number (VR-...).", original_txn_reference: "Vend transaction being returned.", sku: "Item.", product_category: "Product category.", quantity: "Units returned.", unit_price: "Vend unit price of the original vend, USD.", extended_amount: "Credit value, USD.", employee_badge: "Badge returning.", cost_center: "Cost center of the original vend.", event_date: "Return date."}
    account: machine_stock
    direction: in
    triggers: []
  - type: vending_vend_error_credited
    target: vending_transactions
    meaning: "A logged vend that did not dispense is reversed and credited."
    grain: "One row per vend error credited."
    distinguish_by: [txn_reference]
    fields: {txn_reference: "Error credit reference (VE-...).", original_txn_reference: "Vend transaction that failed.", sku: "Item.", quantity: "Units not dispensed.", unit_price: "Vend unit price, USD.", extended_amount: "Credit value, USD.", cost_center: "Cost center of the failed vend.", event_date: "Credit date."}
    account: machine_stock
    direction: in
    triggers: []
  - type: vending_shrink_billed
    target: vending_transactions
    meaning: "A cycle count shortage beyond tolerance is billed to the customer."
    grain: "One row per item short on one cycle count."
    distinguish_by: [txn_reference, sku]
    fields: {txn_reference: "Cycle count reference (VCN-...).", sku: "Item.", quantity: "Units short beyond tolerance.", unit_price: "Contract unit price, USD.", extended_amount: "Shrink billed, USD.", billing_period: "Billing month the shrink is billed in.", event_date: "Count date."}
    account: machine_stock
    direction: out
    triggers: []
  - type: vending_stock_withdrawn
    target: vending_transactions
    meaning: "Consigned stock is taken out of the machine (selection removed, overstock, machine removal)."
    grain: "One row per item withdrawn on one withdrawal."
    distinguish_by: [txn_reference, sku]
    fields: {txn_reference: "Withdrawal reference (VWS-...).", sku: "Item.", quantity: "Units withdrawn.", unit_price: "Contract unit price, USD.", extended_amount: "Value withdrawn, USD.", event_date: "Withdrawal date."}
    account: machine_stock
    direction: out
    triggers: []
  - type: vending_usage_billed
    target: vending_transactions
    meaning: "A billing month of net vends (vends less returns and vend errors, plus billed shrink) is invoiced, per cost center where cost center billing applies."
    grain: "One row per machine per billing month per cost center (a single row with cost center ALL where cost center billing does not apply)."
    distinguish_by: [billing_period, cost_center]
    fields: {billing_period: "Billing month.", cost_center: "Cost center billed, or ALL.", extended_amount: "Net value billed, USD.", event_date: "Last day of the billing month."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, source_type: vending_usage, source_reference: billing_period}
  - type: vending_fee_charged
    target: vending_transactions
    meaning: "A program fee is charged: shortfall, badge, cellular data, install, emergency restock, relocation, model swap, planogram change, replacement badge or early removal."
    grain: "One row per monthly fee per billing month, or per occurrence for event fees."
    distinguish_by: [fee_type, billing_period, txn_reference]
    fields: {fee_type: "Kind of fee.", billing_period: "Billing month the fee belongs to.", txn_reference: "Work order or request reference for event fees; the billing month for monthly fees.", quantity: "Count the fee is computed on, 1 for flat fees.", extended_amount: "Fee amount, USD.", event_date: "Fee date."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, source_type: vending_program_fee, source_reference: txn_reference}
  - type: vending_selection_set
    target: vending_planogram
    meaning: "An item is assigned to a machine selection or its par quantity changed."
    grain: "One row per selection change."
    distinguish_by: [slot_label, event_date, change_type]
    fields: {slot_label: "Selection (door, coil or bay) label.", sku: "Item.", product_category: "Product category.", par_qty: "Par quantity.", special_item: "Whether the item is a non-catalog special item.", change_type: "Add item or par change.", change_source: "Who asked for the change.", change_reference: "Request reference.", event_date: "Effective date."}
    triggers: []
  - type: vending_selection_removed
    target: vending_planogram
    meaning: "An item is removed from a selection."
    grain: "One row per selection removal."
    distinguish_by: [slot_label, event_date]
    fields: {slot_label: "Selection label.", sku: "Item removed.", change_source: "Who asked for the removal.", removal_reason: "Why removed.", change_reference: "Request reference.", event_date: "Effective date."}
    triggers: []

# ---- derived measures ----
measures:
  - id: vending_msr_month_net_usage
    window: "One calendar month (billing_period) of one machine."
    measure: "Sum, USD, of extended_amount of vending_item_issued rows dated in the month, less extended_amount of vending_item_returned and vending_vend_error_credited rows dated in the month; shrink and fees excluded."
  - id: vending_msr_site_pooled_usage
    window: "One calendar month, across the active machines at one ship-to."
    measure: "Sum of vending_msr_month_net_usage over every machine at the ship-to that was active or suspended during the month."
  - id: vending_msr_active_badges_month
    window: "One calendar month of one machine."
    measure: "Count of distinct employee_badge values with at least one vending_item_issued row dated in the month."
  - id: vending_msr_planogram_changes_quarter
    window: "The calendar quarter of the change, up to and including the change being charged."
    measure: "Count of vending_selection_set and vending_selection_removed rows with change_source customer dated in the quarter, in date then reference order."
  - id: vending_msr_relocations_12m
    window: "Rolling 12 calendar months ending on the relocation date, inclusive."
    measure: "Count of vending_machine_moved rows of the machine in the window, in date order, including the relocation being charged."

# ---- policies ----
policies:
  - id: vending_agg_multi_holding
    subject: [vending_machine_requested]
    rule: >-
      A customer may hold any number of VendPoint machines, including several at one ship-to; each machine is a separate placement with its own model tier, minimum term and fees.
      A machine is requested only for a ship-to whose status is active.
    eligibility:
      - id: ship_to_open_for_machine
        applies_to: [vending_machine_requested]
        kind: state
        condition: "A machine is requested only for a ship-to whose status is active."
        evidence_fields: [ship_to_accounts.status, ship_to_accounts.ship_to_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ship_to_accounts.ship_to_id]]
          action_bindings: {ship_to_accounts.ship_to_id: ship_to_id}
        state_contract:
          field: ship_to_accounts.status
          allowed: [active]
    params: {max_per_customer: null}

  - id: vending_agg_site_minimum
    subject: [vending_fee_charged]
    rule: >-
      The monthly minimum is tested per machine, except that when every machine at a ship-to that was active or suspended during the month has site_minimum_pooling true, the minimum is tested once for the site: vending_msr_site_pooled_usage against the sum of those machines' min_monthly_usage_usd.
      A pooled site shortfall fee is computed with the machine_shortfall_fee_pct and capped at the monthly_machine_fee_cap_usd of the machine with the largest minimum (on a tie, the lowest machine serial), and is charged once, on that machine.
      Machines still inside their ramp-up months are left out of the pool and are not tested; a single machine that does not allow pooling makes every machine at that site test on its own.
    eligibility: []
    measures: [vending_msr_site_pooled_usage]

  - id: vending_placement
    subject: [vending_machine_requested, vending_machine_installed]
    rule: >-
      A machine is placed only for a customer whose Commercial Credit Account status is active.
      The model requested is placed when its entry gate (projected monthly usage and badge users) is met, otherwise the largest model whose gate is met; installation follows within install_lead_business_days business days and the minimum term starts on the installation date.
      A model with install_fee_usd above 0.00 bills it once at installation; a machine connected by cellular data carries cellular_data_fee_usd every month it is installed.
      The customer may cancel a request before installation with no charge.
    eligibility:
      - id: credit_active_for_placement
        applies_to: [vending_machine_requested]
        kind: state
        condition: "A machine is placed only for a customer whose Commercial Credit Account status is active."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: vending_evt_usage_billing
    subject: [vending_item_issued, vending_usage_billed]
    rule: >-
      A machine vends only while its status is active or suspended, and while suspended only items in credit_hold_safety_categories on a model whose credit_hold_vending_rule is safety_items_only.
      Each vend is billed at the contract unit price pricing_price_basis gives for the vend date under vend_price_basis; title passes on the vend.
      A badge vends at most employee_daily_vend_limit_units units per day unless the customer has set another limit.
      A machine bills to at most max_cost_centers cost centers.
      Under vend_billing_cycle, net vends of a calendar month (vends less returns and vend errors dated in the month, plus shrink billed in the month) are billed on one invoice dated the last day of the month, split per cost center where cost_center_allocation_included is true and billed as one ALL invoice otherwise; a return or error credit is netted in the month it occurs even when the original vend was billed in an earlier month.
      Each machine is billed at most once per cost center for a billing month.
    eligibility:
      - id: machine_can_vend
        applies_to: [vending_item_issued]
        kind: state
        condition: "A machine vends only while its status is active or suspended"
        evidence_fields: [vending_machines.status, vending_machines.vending_machine_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_machines.vending_machine_id]]
          action_bindings: {vending_machines.vending_machine_id: vending_machine_id}
        state_contract:
          field: vending_machines.status
          allowed: [active, suspended]
      - id: one_usage_bill_per_cost_center
        applies_to: [vending_usage_billed]
        kind: dedup
        condition: "Each machine is billed at most once per cost center for a billing month."
        evidence_fields: [vending_transactions.vending_machine_id, vending_transactions.billing_period, vending_transactions.cost_center, vending_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.vending_machine_id, vending_transactions.billing_period, vending_transactions.cost_center]]
          action_bindings: {vending_transactions.vending_machine_id: vending_machine_id, vending_transactions.billing_period: billing_period, vending_transactions.cost_center: cost_center}
        dedup_contract:
          table: vending_transactions
          mode: separate_record
          object_bindings: {vending_machine_id: vending_machine_id, billing_period: billing_period, cost_center: cost_center}
          duplicate_filters: {event_type: [vending_usage_billed]}
          distinct_fields: [billing_period]
    measures: [vending_msr_month_net_usage]

  - id: vending_evt_returns_and_errors
    subject: [vending_item_returned, vending_vend_error_credited]
    rule: >-
      Coil machines (machine_type coil) cannot take items back. An unused item may be returned into the machine only on a model whose return_to_machine_allowed is true, in its original package, by the badge that vended it.
      A return is accepted only when it is made no later than return_to_machine_days calendar days after the vend date of the original vend.
      Count calendar days starting the day after the vend date; a return on the last day is accepted.
      A returned item is credited at return_credit_basis, the unit price of the original vend, for the units returned, never more than the units that vend issued.
      A vend error is credited only when it is reported no later than vend_error_report_hours hours after the failed vend.
      Count elapsed hours from the vend timestamp in the machine log to the time the error is reported; a report exactly at the limit is accepted.
      An error credit up to vend_error_credit_auto_max_usd is granted by the desk from the machine log; a larger one waits for the next restock visit to confirm the item is still in the selection, and is not credited by the desk.
      Each vend transaction may be returned or credited for a vend error only once.
    eligibility:
      - id: return_inside_window
        applies_to: [vending_item_returned]
        kind: time
        condition: "A return is accepted only when it is made no later than return_to_machine_days calendar days after the vend date of the original vend."
        evidence_fields: [vending_transactions.event_date, vending_transactions.txn_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.txn_reference]]
          action_bindings: {vending_transactions.txn_reference: original_txn_reference}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the vend date of the original vend"
          anchor_source: vending_transactions.event_date
          relation: not_after
          duration_source: variants.return_to_machine_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the vend date; a return on the last day is accepted."
          boundary: inclusive
      - id: error_reported_in_time
        applies_to: [vending_vend_error_credited]
        kind: time
        condition: "A vend error is credited only when it is reported no later than vend_error_report_hours hours after the failed vend."
        evidence_fields: [vending_transactions.vended_at, vending_transactions.txn_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.txn_reference]]
          action_bindings: {vending_transactions.txn_reference: original_txn_reference}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the failed vend"
          anchor_source: vending_transactions.vended_at
          relation: not_after
          duration_source: variants.vend_error_report_hours
          unit: elapsed_hours
          counting_rule: "Count elapsed hours from the vend timestamp in the machine log to the time the error is reported; a report exactly at the limit is accepted."
          boundary: inclusive
      - id: one_credit_per_vend
        applies_to: [vending_item_returned, vending_vend_error_credited]
        kind: dedup
        condition: "Each vend transaction may be returned or credited for a vend error only once."
        evidence_fields: [vending_transactions.original_txn_reference, vending_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.original_txn_reference]]
          action_bindings: {vending_transactions.original_txn_reference: original_txn_reference}
        dedup_contract:
          table: vending_transactions
          mode: separate_record
          object_bindings: {original_txn_reference: original_txn_reference}
          duplicate_filters: {event_type: [vending_item_returned, vending_vend_error_credited]}
          distinct_fields: []

  - id: vending_evt_restock_and_shrink
    subject: [vending_restocked, vending_shrink_billed, vending_stock_withdrawn]
    rule: >-
      Corbett restocks each machine restock_visits_per_week times a week, filling every selection at or below low_stock_trigger_pct percent of par back to par, without letting the machine stock value exceed machine_stock_cap_usd; an emergency restock on request is made within emergency_restock_response_hours hours.
      Machine stock stays Corbett-owned under consigned_inventory until vended.
      Every cycle_count_frequency_months months the stock is counted; where shrink_billed_to_customer is true the shortage value above shrink_tolerance_pct percent of the stock value counted is billed at shrink_billing_basis in that month's usage bill, and where it is false Corbett absorbs all shrink.
      Stock is withdrawn at no charge when a selection is removed, when overstock exceeds the cap, and when the machine is removed.
    eligibility: []

  - id: vending_evt_fees
    subject: [vending_fee_charged]
    rule: >-
      For each calendar month after the ramp_up_months full months following the installation month, a machine whose vending_msr_month_net_usage is below min_monthly_usage_usd is charged a shortfall fee of machine_shortfall_fee_pct percent of the shortfall, rounded half up to the cent and capped at monthly_machine_fee_cap_usd, unless the site is pooled under vending_agg_site_minimum; where credit_hold_minimum_applies is true, months the machine was locked under a credit hold are tested like any other month.
      Active badge users above badge_users_included, counted by vending_msr_active_badges_month, are charged additional_badge_fee_usd each for the month; a cellular-connected machine is charged cellular_data_fee_usd for the month.
      Each monthly fee type is charged at most once per machine per billing month.
      A relocation beyond relocations_included_per_year in the rolling 12 months counted by vending_msr_relocations_12m carries relocation_fee_usd; a model swap carries machine_swap_fee_usd; an emergency restock carries emergency_restock_fee_usd; a replacement badge card carries replacement_badge_card_fee_usd; a customer-requested selection change beyond planogram_changes_included_per_quarter in the quarter, counted by vending_msr_planogram_changes_quarter, carries planogram_change_fee_usd.
      A machine removed before min_term_months calendar months after its installation date carries early_removal_fee_usd once; a fee whose model amount is 0.00 is never charged.
    eligibility:
      - id: one_monthly_fee_per_machine
        applies_to: [vending_fee_charged]
        kind: dedup
        condition: "Each monthly fee type is charged at most once per machine per billing month."
        evidence_fields: [vending_transactions.vending_machine_id, vending_transactions.fee_type, vending_transactions.billing_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.vending_machine_id, vending_transactions.fee_type, vending_transactions.billing_period]]
          action_bindings: {vending_transactions.vending_machine_id: vending_machine_id, vending_transactions.fee_type: fee_type, vending_transactions.billing_period: billing_period}
        dedup_contract:
          table: vending_transactions
          mode: separate_record
          object_bindings: {vending_machine_id: vending_machine_id, fee_type: fee_type, billing_period: billing_period}
          duplicate_filters: {event_type: [vending_fee_charged], fee_type: [usage_shortfall_fee, badge_fee, cellular_data_fee]}
          distinct_fields: [txn_reference]
    measures: [vending_msr_month_net_usage, vending_msr_active_badges_month, vending_msr_relocations_12m, vending_msr_planogram_changes_quarter]
    params:
      per_tier:
        VendPoint Locker 12: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Locker 24: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Coil 40: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Coil 60: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Carousel 90: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Smart Crib 300: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
    formula:
      when_not: "vending_msr_month_net_usage >= min_monthly_usage_usd"
      shortfall_fee: "min(round((min_monthly_usage_usd - vending_msr_month_net_usage) * machine_shortfall_fee_pct / 100, 2), monthly_machine_fee_cap_usd)"

  - id: vending_planogram_management
    subject: [vending_selection_set, vending_selection_removed]
    rule: >-
      The customer may ask to add items, change par quantities or remove items at any time on an active machine; changes take effect at the next restock visit.
      A selection holds a non-catalog special item only while the machine's special items stay within special_item_slots_max, and the machine never holds more items than selection_capacity.
      At each planogram review, every planogram_review_months months, Corbett removes selections with no vend for slow_mover_removal_days days, with change_source corbett and removal_reason slow_mover; Corbett-initiated changes never count toward the included changes.
    eligibility: []

  - id: vending_credit_hold_lock
    subject: [vending_machine_locked, vending_machine_unlocked]
    rule: >-
      When the customer's Commercial Credit Account is placed on hold, every active machine of the customer is locked; on a model whose credit_hold_vending_rule is safety_items_only, items in credit_hold_safety_categories keep vending while locked, and on a model whose rule is lock_machine nothing vends.
      A machine is unlocked only when the customer's Commercial Credit Account status is active again.
      Locking never stops restocking of the items that keep vending, and never changes the minimum term.
    eligibility:
      - id: credit_restored_before_unlock
        applies_to: [vending_machine_unlocked]
        kind: state
        condition: "A machine is unlocked only when the customer's Commercial Credit Account status is active again."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: vending_removal_and_relocation
    subject: [vending_removal_noticed, vending_machine_removed, vending_machine_relocated, vending_model_swapped, vending_machine_moved]
    rule: >-
      Removing a machine is the customer's own act by written notice.
      A machine with a removal notice is removed no earlier than removal_notice_days calendar days after the date the written removal notice is received.
      Count calendar days starting the day after the notice is received; the machine is removed on the last day of the notice period or a later date the notice names.
      On removal the stock is withdrawn at no charge, the final month's usage is billed, and the early removal fee applies under vending_evt_fees when removal falls before the end of the minimum term.
      A machine may be relocated only to another active ship-to of the same customer, scheduled within relocation_lead_business_days business days; a relocation or model swap does not restart the minimum term, and a swap to a different model makes the new model's parameters apply from the swap date.
    eligibility:
      - id: removal_notice_served
        applies_to: [vending_machine_removed]
        kind: time
        condition: "A machine with a removal notice is removed no earlier than removal_notice_days calendar days after the date the written removal notice is received."
        evidence_fields: [vending_machines.termination_notice_date, vending_machines.vending_machine_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_machines.vending_machine_id]]
          action_bindings: {vending_machines.vending_machine_id: vending_machine_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the written removal notice is received"
          anchor_source: vending_machines.termination_notice_date
          relation: not_before
          duration_source: variants.removal_notice_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the notice is received; the machine is removed on the last day of the notice period or a later date the notice names."
          boundary: inclusive
    measures: [vending_msr_relocations_12m]
