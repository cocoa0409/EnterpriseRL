# Policy charter: VendPoint Industrial Vending Program (point-of-use vending machines, consigned machine stock, usage billing, minimums and fees).
category: vending
display_name: VendPoint Industrial Vending Program

binding:
  holding_table: vending_machines
  event_tables: [vending_transactions, vending_planogram]
  status_field: status
  variant_field: variant_name
  quantity_fields: {machine_stock_value: machine_stock}

lifecycle:
  states: [requested, active, suspended, removal_pending, removed]
  transitions:
    - {from: requested, to: active, by: system, means: "The machine is installed, loaded to planogram and switched on for badge vending."}
    - {from: active, to: suspended, by: system, means: "The machine is locked under a credit hold (except items the credit hold rule keeps vending)."}
    - {from: suspended, to: active, by: agent, means: "The agent unlocks the machine once the credit hold is released."}
    - {from: active, to: removal_pending, by: user, means: "The customer gives written notice to remove the machine."}
    - {from: suspended, to: removal_pending, by: user, means: "The customer gives written notice to remove a locked machine."}
    - {from: removal_pending, to: removed, by: system, means: "The notice period ends, stock is withdrawn and the machine is de-installed."}
    - {from: requested, to: removed, by: user, means: "The customer cancels the machine request before installation."}

accounts:
  - key: machine_stock
    unit: USD
    meaning: "Value, at contract unit price, of Corbett-owned consigned stock loaded in the machine: restocks and returns to the machine increase it; vends, shrink billed and withdrawals decrease it."

# ---- category-level parameter dictionary ----
parameter_schema:
  selection_capacity: "Number of item selections (doors, coils, carousel bays or crib positions) the machine holds"
  machine_type: "Dispensing technology of the machine"
  min_monthly_usage_usd: "Net vend value per calendar month, USD, below which the machine shortfall fee applies"
  machine_shortfall_fee_pct: "Shortfall fee, percent of the amount by which net vend value falls short of the minimum"
  monthly_machine_fee_cap_usd: "Largest shortfall fee for one machine-month (or for a pooled site-month), USD"
  site_minimum_pooling: "Whether the minimum may be tested once across all active machines at the ship-to when every one of them allows pooling"
  ramp_up_months: "Full calendar months after the installation month during which the minimum is not tested"
  credit_hold_minimum_applies: "Whether the minimum is still tested in months the machine was locked under a credit hold"
  install_fee_usd: "One-time installation fee, USD"
  install_lead_business_days: "Business days from request to installation"
  min_term_months: "Minimum placement term in months from installation"
  removal_notice_days: "Calendar days of written notice to remove the machine"
  early_removal_fee_usd: "Fee when the machine is removed before the minimum term ends, USD"
  relocation_fee_usd: "Fee to move the machine to another location or ship-to, USD"
  relocations_included_per_year: "Relocations per rolling 12 months without the fee"
  relocation_lead_business_days: "Business days to schedule a relocation"
  machine_swap_fee_usd: "Fee to swap the machine for another VendPoint model, USD"
  restock_visits_per_week: "Scheduled restock visits per week"
  low_stock_trigger_pct: "Selection fill level, percent of par, at or below which the selection is restocked at the next visit"
  emergency_restock_fee_usd: "Fee per emergency restock visit requested by the customer, USD"
  emergency_restock_response_hours: "Hours within which an emergency restock is made"
  consigned_inventory: "Whether machine stock stays Corbett-owned until vended"
  machine_stock_cap_usd: "Largest consigned stock value loaded in the machine, USD"
  vend_billing_cycle: "How vends are billed"
  vend_price_basis: "Price each vend is billed at"
  return_to_machine_allowed: "Whether unused items may be returned into the machine for credit"
  return_to_machine_days: "Calendar days after the vend within which an unused item may be returned to the machine; 0 means not allowed"
  return_credit_basis: "Price at which a returned item is credited"
  vend_error_report_hours: "Hours after a failed vend within which it must be reported for credit"
  vend_error_credit_auto_max_usd: "Largest vend error credit, USD, the desk grants from the machine log without a technician check"
  badge_users_included: "Active badge users without a badge fee"
  additional_badge_fee_usd: "Monthly fee per active badge user above the included number, USD"
  replacement_badge_card_fee_usd: "Fee per replacement badge card issued, USD"
  employee_daily_vend_limit_units: "Default units one badge may vend per day unless the customer sets another limit"
  cost_center_allocation_included: "Whether vends are billed separately per customer cost center"
  max_cost_centers: "Largest number of cost centers a machine may bill to; 0 means billing is per machine only"
  planogram_changes_included_per_quarter: "Selection changes per calendar quarter without a fee"
  planogram_change_fee_usd: "Fee per selection change beyond the included changes, USD"
  planogram_review_months: "Months between Corbett planogram reviews"
  slow_mover_removal_days: "Days without a vend after which a selection is removed at the planogram review"
  special_item_slots_max: "Selections that may hold non-catalog special items"
  shrink_billed_to_customer: "Whether cycle count shortages beyond tolerance are billed to the customer (coil machines dispense one unit per vend and carry no customer shrink)"
  shrink_tolerance_pct: "Cycle count shortage, percent of stock value counted, absorbed by Corbett"
  shrink_billing_basis: "Price at which billed shrink is valued"
  cycle_count_frequency_months: "Months between cycle counts of machine stock"
  credit_hold_vending_rule: "What the machine still vends while the customer's credit account is on hold"
  credit_hold_safety_categories: "Product categories that keep vending under the safety_items_only rule"
  cellular_data_fee_usd: "Monthly cellular data fee when the site provides no network connection, USD"

