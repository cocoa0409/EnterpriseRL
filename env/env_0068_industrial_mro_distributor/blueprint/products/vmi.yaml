# Policy charter: StockSmart Vendor-Managed Inventory Program (bin replenishment, consignment, program fees, pauses and termination buyback).
category: vmi
display_name: StockSmart Vendor-Managed Inventory Program

binding:
  holding_table: vmi_programs
  event_tables: [vmi_activity, vmi_bins]
  status_field: status
  variant_field: variant_name
  quantity_fields: {consigned_stock_value: consigned_stock}

lifecycle:
  states: [enrolled, active, paused, terminating, closed]
  transitions:
    - {from: enrolled, to: active, by: system, means: "Bins are labeled, par levels loaded and the program goes live at the ship-to."}
    - {from: active, to: paused, by: agent, means: "Service and minimum-spend measurement pause for a customer plant shutdown, or replenishment is suspended under a credit hold."}
    - {from: paused, to: active, by: agent, means: "Service resumes when the pause ends or the credit hold is released."}
    - {from: active, to: terminating, by: user, means: "The customer gives written notice to end the program."}
    - {from: paused, to: terminating, by: user, means: "The customer gives written notice to end a paused program."}
    - {from: terminating, to: closed, by: system, means: "The notice period ends, bins are removed, consigned stock is withdrawn and the special-stock buyback is billed."}
    - {from: enrolled, to: closed, by: user, means: "The customer cancels the enrollment before go-live."}

accounts:
  - key: consigned_stock
    unit: USD
    meaning: "Value, at contract unit price, of Corbett-owned consigned inventory sitting in the customer's bins under this program: consignment stocking increases it; consumption billed, shrink billed and withdrawals decrease it."

# ---- category-level parameter dictionary ----
parameter_schema:
  service_visits_per_month: "Scheduled Corbett service visits per calendar month (Onsite Storeroom: one per business day); 0 means the customer scans its own bins"
  scan_method: "Who counts the bins and triggers replenishment"
  replenishment_lead_business_days: "Business days from a scan or visit to delivery of the replenishment into the bins"
  auto_replenish_to: "Level each replenished bin is filled to"
  replenishment_pricing_basis: "Price at which replenished and consumed items are billed"
  replenishment_freight_basis: "How freight on replenishment is billed: under the served ship-to's freight terms, or included in the program"
  replenishment_invoice_grouping: "Unit billed by one replenishment invoice"
  min_monthly_program_spend_usd: "Billed replenishment and consumption per calendar month, USD, below which the monthly minimum fee applies"
  min_spend_measurement_basis: "What counts toward the monthly program minimum"
  monthly_minimum_fee_usd: "Program service fee for a calendar month whose program spend is below the minimum, USD"
  onsite_management_fee_usd: "Fixed monthly storeroom management fee, USD; 0.00 means none"
  onsite_hours_per_week: "Hours per week a dedicated Corbett associate staffs the storeroom; 0 means none"
  included_bins_max: "Bins managed without an additional bin fee"
  additional_bin_fee_usd: "Monthly fee per bin above included_bins_max, USD"
  setup_fee_usd: "One-time program setup fee billed at go-live, USD"
  go_live_business_days: "Business days from enrollment to go-live"
  bin_hardware_provided: "Storage hardware Corbett supplies at no charge"
  bin_adds_included_per_month: "New bins the customer may ask to add in a calendar month without a bin setup fee"
  bin_add_fee_usd: "Setup fee per new bin added beyond the monthly included adds, USD"
  par_changes_included_per_month: "Customer-requested par level changes per calendar month without a fee"
  par_change_fee_usd: "Fee per par level change beyond the included changes, USD"
  par_level_review_months: "Months between Corbett par level reviews; 0 means no scheduled review"
  non_moving_bin_removal_months: "Months without any replenishment or consumption after which a bin is removed at the par review"
  special_stock_sku_cap: "Non-catalog items Corbett stocks specially for the program"
  bin_replacement_fee_usd: "Fee per bin or label replaced because of customer damage, USD"
  emergency_visit_fee_usd: "Fee per unscheduled emergency visit requested by the customer, USD"
  emergency_visits_included_per_quarter: "Emergency visits per calendar quarter without the fee"
  emergency_response_hours: "Hours within which an emergency visit is made"
  visit_cancellation_notice_hours: "Hours of notice before a scheduled visit below which a customer cancellation carries a trip charge"
  trip_charge_usd: "Trip charge for a scheduled visit cancelled late or refused at the gate, USD"
  consignment_available: "Whether bins may hold Corbett-owned consigned stock billed on consumption"
  consigned_value_cap_usd: "Largest consigned stock value the program may carry, USD"
  consigned_title_transfer: "When title to consigned stock passes to the customer"
  consignment_billing_cycle: "How consumed consigned stock is billed"
  consignment_min_annual_turns: "Minimum annual turns of a consigned item; slower items are converted to customer-owned stock at the par review"
  cycle_count_frequency_months: "Months between cycle counts of consigned bins"
  shrink_tolerance_pct: "Cycle count shortage, percent of consigned value counted, that Corbett absorbs"
  shrink_billing_basis: "Price at which consigned shrink beyond tolerance is billed"
  pause_max_days: "Longest customer-requested pause in calendar days"
  pauses_per_year: "Customer-requested pauses allowed in a rolling 12 months"
  pause_minimum_waived: "Whether the monthly minimum and onsite fee are prorated away for paused days"
  credit_hold_service_rule: "What happens to replenishment while the customer's credit account is on hold"
  critical_item_replenishment_cap_usd: "Largest replenishment value per visit of bins flagged critical while on credit hold, USD"
  min_term_months: "Minimum program term in months from go-live"
  termination_notice_days: "Calendar days of written notice to end the program"
  early_exit_fee_usd: "Bin removal and early exit fee when the program ends before the minimum term, USD"
  buyback_required_special_stock: "Whether the customer buys the special (non-catalog) stock Corbett holds for the program when it ends"
  buyback_basis: "Price at which special stock is bought back"

