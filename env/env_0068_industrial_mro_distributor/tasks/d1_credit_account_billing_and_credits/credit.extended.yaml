# ---- data flow ----
events:
  - type: credit_application_submitted
    target: credit_accounts
    mutation: create
    meaning: "A customer submits a commercial credit application requesting a terms tier and an opening credit limit."
    grain: "One row per credit application (one transaction)."
    fields: {customer_id: "Applicant customer.", variant_name: "Terms tier requested on the application.", credit_limit: "Opening credit limit requested, USD.", invoice_delivery: "Invoice delivery channel elected on the application.", billing_cycle: "Billing cycle elected on the application."}
    triggers: []
  - type: credit_application_approved
    target: credit_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: "The Credit Department approves the application and opens the account on a terms tier with a credit limit."
    grain: "One row per approval (one transaction)."
    fields: {variant_name: "Terms tier granted (may be lower than requested).", credit_limit: "Opening credit limit granted, USD.", opened_date: "Approval date, the date the account opens.", last_review_date: "Set to the approval date (the approval is the first credit review)."}
    triggers: []
  - type: credit_application_declined
    target: credit_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: "The Credit Department declines the application."
    grain: "One row per decline (one transaction)."
    fields: {closed_date: "Decline date.", close_reason: "Set to application_declined."}
    triggers: []
  - type: credit_limit_changed
    target: credit_accounts
    mutation: update
    meaning: "The account's credit limit is changed by a credit review decision."
    grain: "One row per limit change (one transaction)."
    fields: {credit_limit: "New credit limit, USD.", last_review_date: "Date of the credit review that set the limit."}
    triggers: []
  - type: credit_tier_changed
    target: credit_accounts
    mutation: update
    meaning: "The account moves to a different terms tier at a credit review or on reinstatement."
    grain: "One row per tier change (one transaction)."
    fields: {variant_name: "New terms tier.", credit_limit: "Credit limit after the tier change, USD.", last_review_date: "Date of the review that changed the tier."}
    triggers: []
  - type: credit_billing_preferences_updated
    target: credit_accounts
    mutation: update
    meaning: "The account's invoice delivery channel or billing cycle is changed at the customer's request."
    grain: "One row per preference change (one transaction)."
    fields: {invoice_delivery: "New invoice delivery channel.", billing_cycle: "New billing cycle."}
    triggers: []
  - type: credit_hold_placed
    target: credit_accounts
    mutation: {transition: {from: active, to: on_hold}}
    meaning: "The account is placed on credit hold."
    grain: "One row per hold placement (one transaction)."
    fields: {hold_reason: "Why the hold was placed."}
    triggers:
      - event: vending:vending_machine_locked
      - event: safety:safety_program_suspended
  - type: credit_hold_released
    target: credit_accounts
    mutation: {transition: {from: on_hold, to: active}}
    meaning: "The credit hold is released after the hold condition is cured."
    grain: "One row per release (one transaction)."
    fields: {hold_reason: "Reset to none on release."}
    triggers:
      - event: vending:vending_machine_unlocked
      - event: safety:safety_program_reinstated
  - type: credit_referred_to_collections
    target: credit_accounts
    mutation: {transition: {from: on_hold, to: in_collections}}
    meaning: "An on-hold account is referred to Corbett Collections."
    grain: "One row per referral (one transaction)."
    fields: {hold_reason: "Set to collections_referral."}
    triggers: []
  - type: credit_reinstated
    target: credit_accounts
    mutation: {transition: {from: in_collections, to: active}}
    meaning: "A referred account whose referred balance is paid in full returns to open terms."
    grain: "One row per reinstatement (one transaction)."
    fields: {hold_reason: "Reset to none.", variant_name: "Tier on reinstatement (one tier lower than before referral, never below the lowest tier).", last_review_date: "Reinstatement date (a credit review)."}
    triggers:
      - event: vending:vending_machine_unlocked
      - event: safety:safety_program_reinstated
  - type: credit_account_closed
    target: credit_accounts
    mutation: {transition: [{from: active, to: closed}, {from: in_collections, to: closed}]}
    meaning: "The credit account is closed at the customer's request, for dormancy, or after a collections write-off."
    grain: "One row per closure (one transaction)."
    fields: {closed_date: "Closure date.", close_reason: "Why the account closed."}
    triggers: []
  - type: credit_invoice_posted
    target: credit_transactions
    meaning: "An invoice is posted to the account for goods shipped or services or program fees billed."
    grain: "One row per invoice."
    distinguish_by: [document_number]
    fields: {document_number: "Invoice number (INV-...).", txn_date: "Invoice date.", due_date: "Due date computed under the terms policy.", amount: "Invoice total, USD (merchandise + freight + tax).", merchandise_amount: "Merchandise or service subtotal, USD.", freight_amount: "Freight billed on the invoice, USD.", tax_amount: "Sales tax billed, USD.", source_type: "What the invoice bills.", source_reference: "Reference of the source business record (order number, visit or service reference, billing period reference)."}
    account: receivable
    direction: in
    triggers: []
  - type: credit_payment_received
    target: credit_transactions
    meaning: "A customer payment is received and applied to one invoice."
    grain: "One row per payment application to one invoice (a payment covering several invoices posts one row per invoice)."
    distinguish_by: [document_number, applied_invoice_number]
    fields: {document_number: "Payment reference (check number, ACH trace, wire reference or card authorization).", txn_date: "Date the payment was received.", amount: "Amount applied to the invoice, USD (positive).", payment_method: "How the customer paid.", applied_invoice_number: "Invoice the payment is applied to.", source_type: "Set to customer_payment."}
    account: receivable
    direction: out
    triggers:
      - event: credit:credit_charge_assessed
        when: {payment_method: commercial_card}
        map: {charge_type: card_surcharge, source_reference: document_number, source_type: account_charge}
  - type: credit_cash_discount_taken
    target: credit_transactions
    meaning: "A prompt-payment cash discount is booked against an invoice paid inside the discount window."
    grain: "One row per invoice discounted."
    distinguish_by: [applied_invoice_number]
    fields: {document_number: "Discount line reference.", txn_date: "Date of the qualifying payment.", amount: "Discount amount, USD (positive).", applied_invoice_number: "Invoice discounted.", source_reference: "Payment reference that earned the discount.", source_type: "Set to customer_payment."}
    account: receivable
    direction: out
    triggers: []
  - type: credit_payment_returned
    target: credit_transactions
    meaning: "A previously applied payment is returned unpaid by the bank (NSF, closed account, stop payment, card chargeback) and its application is reversed."
    grain: "One row per returned payment application."
    distinguish_by: [document_number, applied_invoice_number]
    fields: {document_number: "Bank return reference.", txn_date: "Date the return was received.", amount: "Amount reversed on the invoice, USD (positive, increases the balance): the returned application plus any cash discount that payment had earned.", payment_method: "Method of the original payment.", applied_invoice_number: "Invoice the returned payment had been applied to.", source_reference: "Reference of the original payment returned.", source_type: "Set to customer_payment."}
    account: receivable
    direction: in
    triggers:
      - event: credit:credit_charge_assessed
        map: {charge_type: returned_payment_fee, source_reference: source_reference, source_type: account_charge}
  - type: credit_charge_assessed
    target: credit_transactions
    meaning: "An account charge is assessed: a monthly late payment finance charge, a returned payment fee, a card convenience fee or a monthly paper invoice fee."
    grain: "One row per charge: finance and paper invoice charges once per account per billing month; returned payment and card fees once per payment."
    distinguish_by: [charge_type, billing_period, source_reference]
    fields: {document_number: "Charge reference.", txn_date: "Date assessed.", due_date: "Due date of the charge (same terms as invoices).", amount: "Charge amount, USD (positive).", charge_type: "Kind of charge.", billing_period: "Billing month YYYY-MM for finance and paper invoice charges; the month of the payment for per-payment fees.", source_reference: "Payment reference for per-payment fees; the billing month reference for monthly charges.", source_type: "Set to account_charge."}
    account: receivable
    direction: in
    triggers: []
  - type: credit_memo_issued
    target: credit_transactions
    meaning: "A credit memo is issued to the account (return credit, contract price correction, rebate payout, dispute resolution, finance charge courtesy waiver, program billing adjustment)."
    grain: "One row per credit memo."
    distinguish_by: [document_number]
    fields: {document_number: "Credit memo number (CM-...).", txn_date: "Memo date.", amount: "Credit amount, USD (positive, reduces the balance).", source_type: "Reason class of the credit.", source_reference: "Reference of the business record that produced the credit (RMA number, claim reference, rebate period reference, dispute reference, charge reference).", applied_invoice_number: "Invoice the credit is applied to; ON-ACCOUNT when held as an open credit."}
    account: receivable
    direction: out
    triggers: []
  - type: credit_refund_issued
    target: credit_transactions
    meaning: "A credit balance on the account is refunded to the customer by check or ACH."
    grain: "One row per refund."
    distinguish_by: [document_number]
    fields: {document_number: "Refund reference.", txn_date: "Refund date.", amount: "Refund amount, USD (positive, raises the balance toward zero).", payment_method: "Refund method.", source_type: "Set to account_adjustment."}
    account: receivable
    direction: in
    triggers: []
  - type: credit_small_balance_writeoff
    target: credit_transactions
    meaning: "A small residual invoice balance is written off."
    grain: "One row per invoice written off."
    distinguish_by: [applied_invoice_number]
    fields: {document_number: "Write-off reference.", txn_date: "Write-off date.", amount: "Amount written off, USD (positive).", applied_invoice_number: "Invoice whose residual is written off.", source_type: "Set to account_adjustment."}
    account: receivable
    direction: out
    triggers: []
  - type: credit_dispute_opened
    target: credit_disputes
    meaning: "The customer disputes all or part of one invoice."
    grain: "One row per dispute opened on one invoice."
    distinguish_by: [dispute_reference]
    fields: {dispute_reference: "Dispute reference (DSP-...).", invoice_number: "Invoice disputed.", dispute_reason: "Reason class stated by the customer.", disputed_amount: "Amount disputed, USD.", event_date: "Date the dispute was opened."}
    triggers: []
  - type: credit_dispute_resolved
    target: credit_disputes
    meaning: "An open dispute is resolved."
    grain: "One row per dispute resolution."
    distinguish_by: [dispute_reference]
    fields: {dispute_reference: "Dispute being resolved.", invoice_number: "Invoice disputed.", resolution: "Outcome.", disputed_amount: "Amount credited when credited; otherwise the amount that was disputed, USD.", event_date: "Resolution date."}
    triggers:
      - event: credit:credit_memo_issued
        when: {resolution: credited}
        map: {source_type: dispute_credit, source_reference: dispute_reference, applied_invoice_number: invoice_number, amount: disputed_amount}
  - type: credit_limit_review_requested
    target: credit_limit_reviews
    meaning: "The customer requests a permanent or temporary credit limit increase."
    grain: "One row per limit request."
    distinguish_by: [review_reference]
    fields: {review_reference: "Limit review reference (CLR-...).", request_date: "Date requested.", requested_limit: "Credit limit requested, USD.", change_type: "Permanent or temporary increase."}
    triggers: []
  - type: credit_limit_review_decided
    target: credit_limit_reviews
    meaning: "A limit request is decided."
    grain: "One row per decision on one request."
    distinguish_by: [review_reference]
    fields: {review_reference: "Request decided.", request_date: "Decision date.", requested_limit: "Credit limit that was requested, USD.", decision: "Outcome.", approved_limit: "Limit granted, USD (0.00 when declined or referred).", change_type: "Permanent or temporary.", expiry_date: "Last day of a temporary increase; empty for permanent."}
    triggers:
      - event: credit:credit_limit_changed
        when: {decision: [approved, approved_reduced]}
        map: {credit_limit: approved_limit, last_review_date: request_date}

# ---- derived measures ----
measures:
  - id: credit_msr_returned_payments_12m
    window: "Rolling window of returned_payment_lookback_months calendar months ending on the current date (frozen time), inclusive of both ends."
    measure: "Count of distinct original payments (source_reference) among credit_payment_returned rows on the account whose txn_date falls in the window."
  - id: credit_msr_courtesy_waivers_12m
    window: "Rolling 12 calendar months ending on the current date, inclusive."
    measure: "Count of credit_memo_issued rows on the account with source_type finance_charge_waiver whose txn_date falls in the window."
  - id: credit_msr_on_time_pct_12m
    window: "Invoices whose due_date falls in the 12 calendar months ending on the current date."
    measure: "Percentage (rounded down to a whole number) of those credit_invoice_posted rows whose balance was reduced to zero by payments, discounts and credit memos dated on or before the due date; an account with no such invoice counts as 100."
  - id: credit_msr_oldest_past_due_days
    window: "Point in time: the current date."
    measure: "Calendar days between the due_date of the oldest invoice with an open balance (excluding amounts under an open dispute where the tier's disputed_amount_excluded_from_hold is true) and the current date; 0 when no invoice is past due."
  - id: credit_msr_past_due_balance
    window: "Point in time: the current date."
    measure: "Sum, USD, of open balances of invoices and charges whose due_date is before the current date, excluding amounts under an open dispute where the tier's disputed_amount_excluded_from_hold is true."
  - id: credit_msr_eligible_past_due
    window: "Point in time: the last calendar day of the billing month being charged."
    measure: "Sum, USD, of open balances of credit_invoice_posted rows whose due_date plus finance_charge_grace_days is before that day, excluding finance charges themselves and, where the tier's disputed_amount_excluded_from_hold is true, amounts under an open dispute."
  - id: credit_msr_paper_invoices_month
    window: "One calendar billing month."
    measure: "Count of credit_invoice_posted rows with txn_date in the month while the account's invoice_delivery is paper."

# ---- policies ----
policies:
  - id: credit_agg_multi_holding
    subject: [credit_application_submitted]
    rule: >-
      A customer may hold only one Commercial Credit Account at a time; all ship-to locations, programs and agreements of the customer bill to that single account.
      A new credit application is not taken when the customer already has a credit account whose status is applied, active, on_hold or in_collections.
      A customer whose earlier account was declined or closed may submit a new application, and the new application is decided on its own merits under credit_application_decision.
    eligibility:
      - id: one_open_credit_account
        applies_to: [credit_application_submitted]
        kind: dedup
        condition: "A new credit application is not taken when the customer already has a credit account whose status is applied, active, on_hold or in_collections."
        evidence_fields: [credit_accounts.customer_id, credit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        dedup_contract:
          table: credit_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, on_hold, in_collections]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: credit_application_decision
    subject: [credit_application_submitted, credit_application_approved, credit_application_declined]
    rule: >-
      A credit application names the terms tier requested, the opening limit requested, the invoice delivery channel and the billing cycle; the application must carry the tier's trade_references_required supplier trade references.
      The Credit Department decides within the tier's application_decision_business_days business days (Monday to Friday excluding US federal holidays) and grants the highest tier, not above the tier requested, whose entry gate the applicant meets in full (years in business, PAYDEX score, trailing 12 month purchases with Corbett, personal guarantee where required, financial statements where required).
      The opening credit limit is the requested limit bounded below by the granted tier's credit_limit_floor_usd and above by its credit_limit_ceiling_usd.
      An applicant who meets no tier's entry gate, or who refuses the personal guarantee the Net 10 Starter tier requires while meeting no higher tier, is declined; a declined applicant buys by commercial card or prepayment.
      An application whose billing elections are not available on the granted tier is approved with per-shipment billing and email delivery.
    eligibility: []
    formula:
      opening_limit: "min(max(credit_limit, credit_limit_floor_usd), credit_limit_ceiling_usd)"

  - id: credit_terms_and_due_dates
    subject: [credit_invoice_posted]
    rule: >-
      An invoice posts only to a credit account whose status is active, on_hold or in_collections.
      Every invoice falls due net_terms_days calendar days after its invoice date; with monthly consolidated billing all shipments and services of a calendar month are billed on one invoice dated the last calendar day of that month and the due date is counted from that date.
      Counting starts the day after the invoice date and the due date is the date reached after the tier's net_terms_days days, with no adjustment for weekends or holidays.
      An invoice is past due from the day after its due date.
      The invoice total is merchandise_amount plus freight_amount plus tax_amount; freight and tax are billed exactly as the originating program or ship-to policy determines and are never re-priced on the credit account.
    eligibility:
      - id: account_can_be_billed
        applies_to: [credit_invoice_posted]
        kind: state
        condition: "An invoice posts only to a credit account whose status is active, on_hold or in_collections."
        evidence_fields: [credit_accounts.status, credit_accounts.credit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.credit_account_id]]
          action_bindings: {credit_accounts.credit_account_id: credit_account_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active, on_hold, in_collections]
    formula:
      amount: "merchandise_amount + freight_amount + tax_amount"

  - id: credit_evt_cash_discount
    subject: [credit_cash_discount_taken, credit_payment_received]
    rule: >-
      A payment earns the tier's cash_discount_pct prompt-payment discount on the merchandise subtotal of the invoice it pays, never on freight or sales tax.
      The payment is received no later than cash_discount_days calendar days after the invoice date.
      Counting starts the day after the invoice date; a payment received on the last day of the window qualifies, and a payment received later does not.
      Only payment of the full remaining invoice balance (less the discount) earns the discount, except that on a tier whose cash_discount_partial_payment is true a partial payment inside the window earns the discount pro rata on the merchandise share it pays.
      No discount is earned on an invoice billed under a Contract Pricing Agreement whose tier is listed in cash_discount_excluded_pricing_tiers and whose status is active on the invoice date, because those prices are already net.
      A tier whose cash_discount_days is 0 offers no discount. A customer who deducts a discount that was not earned has short-paid the invoice and the unpaid amount stays open on the invoice.
    eligibility:
      - id: paid_inside_discount_window
        applies_to: [credit_cash_discount_taken]
        kind: time
        condition: "The payment is received no later than cash_discount_days calendar days after the invoice date."
        evidence_fields: [credit_transactions.txn_date, credit_transactions.document_number, credit_transactions.applied_invoice_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_transactions.applied_invoice_number]]
          action_bindings: {credit_transactions.applied_invoice_number: applied_invoice_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the invoice date"
          anchor_source: credit_transactions.txn_date
          relation: not_after
          duration_source: variants.cash_discount_days
          unit: calendar_days
          counting_rule: "Counting starts the day after the invoice date; a payment received on the last day of the window qualifies, and a payment received later does not."
          boundary: inclusive
    formula:
      discount: "round(merchandise_amount * cash_discount_pct / 100, 2)"

  - id: credit_evt_finance_charge
    subject: [credit_charge_assessed]
    rule: >-
      A late payment finance charge is assessed once per billing month, dated the last calendar day of the month, on the eligible past-due balance measured by credit_msr_eligible_past_due.
      An invoice balance becomes eligible once it is more than finance_charge_grace_days days past its due date; finance charges themselves never accrue further finance charges (finance_charge_compounding is false for every tier), and on a tier whose disputed_amount_excluded_from_hold is true amounts under an open dispute are excluded.
      No finance charge is assessed when the eligible balance is below finance_charge_waiver_balance_usd.
      The charge is the eligible balance times finance_charge_monthly_pct percent, rounded to the cent, raised to finance_charge_min_usd when lower.
      Each account receives at most one finance charge for a billing month.
      Accounts in in_collections status continue to accrue the charge; closed and declined accounts do not.
    eligibility:
      - id: one_finance_charge_per_month
        applies_to: [credit_charge_assessed]
        kind: dedup
        condition: "Each account receives at most one finance charge for a billing month."
        evidence_fields: [credit_transactions.credit_account_id, credit_transactions.billing_period, credit_transactions.charge_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_transactions.credit_account_id, credit_transactions.billing_period]]
          action_bindings: {credit_transactions.credit_account_id: credit_account_id, credit_transactions.billing_period: billing_period}
        dedup_contract:
          table: credit_transactions
          mode: separate_record
          object_bindings: {credit_account_id: credit_account_id, billing_period: billing_period}
          duplicate_filters: {charge_type: [finance_charge]}
          distinct_fields: [billing_period]
    measures: [credit_msr_eligible_past_due]
    formula:
      when_not: "credit_msr_eligible_past_due < finance_charge_waiver_balance_usd"
      amount: "max(round(credit_msr_eligible_past_due * finance_charge_monthly_pct / 100, 2), finance_charge_min_usd)"

  - id: credit_evt_returned_payment
    subject: [credit_payment_returned, credit_charge_assessed]
    rule: >-
      When the bank returns a payment, every application of that payment is reversed on the invoice it paid, any cash discount earned by that payment is forfeited and is included in the amount reversed on that invoice, and one returned_payment_fee_usd fee is charged for the returned payment regardless of how many invoices it had paid.
      Only one returned payment fee is charged for a returned payment.
      Returned payments are counted over the rolling returned_payment_lookback_months months ending on the current date.
      When credit_msr_returned_payments_12m reaches returned_payments_hold_count the account is placed on hold with hold_reason returned_payments.
      For certified_funds_months_after_return months after the most recent returned payment the account pays only by ACH debit, wire or commercial card.
    eligibility:
      - id: one_fee_per_returned_payment
        applies_to: [credit_charge_assessed]
        kind: dedup
        condition: "Only one returned payment fee is charged for a returned payment."
        evidence_fields: [credit_transactions.source_reference, credit_transactions.charge_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_transactions.source_reference]]
          action_bindings: {credit_transactions.source_reference: source_reference}
        dedup_contract:
          table: credit_transactions
          mode: separate_record
          object_bindings: {source_reference: source_reference}
          duplicate_filters: {charge_type: [returned_payment_fee]}
          distinct_fields: []
    measures: [credit_msr_returned_payments_12m]

  - id: credit_evt_payment_methods
    subject: [credit_payment_received, credit_charge_assessed]
    rule: >-
      Payments are accepted by ACH credit, ACH debit, wire, check or commercial card.
      A single commercial card payment may not exceed card_payment_max_usd; a larger balance is paid by another method or in more than one card payment on different days.
      Every card payment carries a card convenience fee of card_surcharge_pct percent of the amount charged, rounded to the cent, assessed as its own charge; ACH, wire and check payments carry no fee.
      A payment by check is accepted only when it is received no earlier than certified_funds_months_after_return calendar months after the date of the most recent returned payment on the account.
      Add the months to the date of the most recent returned payment by calendar month; when the target month has no such day the boundary is the last day of that month, and a check received on the boundary date is accepted.
      A payment with remittance detail is applied to the invoices the remittance names; a payment without remittance detail is held unapplied for unapplied_cash_hold_business_days business days and then applied by payment_application_order, oldest due date first and within one due date oldest invoice number first.
    eligibility:
      - id: check_after_certified_funds_period
        applies_to: [credit_payment_received]
        kind: time
        condition: "A payment by check is accepted only when it is received no earlier than certified_funds_months_after_return calendar months after the date of the most recent returned payment on the account."
        evidence_fields: [credit_transactions.txn_date, credit_transactions.event_type, credit_transactions.credit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_transactions.credit_account_id]]
          action_bindings: {credit_transactions.credit_account_id: credit_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date of the most recent returned payment on the account"
          anchor_source: credit_transactions.txn_date
          relation: not_before
          duration_source: variants.certified_funds_months_after_return
          unit: calendar_months
          counting_rule: "Add the months to the date of the most recent returned payment by calendar month; when the target month has no such day the boundary is the last day of that month, and a check received on the boundary date is accepted."
          boundary: inclusive
    measures: [credit_msr_returned_payments_12m]
    formula:
      card_fee: "round(amount * card_surcharge_pct / 100, 2)"

  - id: credit_evt_credit_memo
    subject: [credit_memo_issued]
    rule: >-
      A credit memo posts only to a credit account whose status is active, on_hold or in_collections.
      A credit memo produced by a return, a contract price claim, a dispute or a finance charge waiver is applied to the invoice that billed the credited item or charge; a rebate payout memo and any credit whose invoice is already paid in full are held ON-ACCOUNT as an open credit that the next payment or refund draws on.
      The desk may reverse a late payment finance charge as a courtesy by credit memo of the full charge amount when credit_msr_courtesy_waivers_12m is below the tier's finance_charge_courtesy_waivers_per_year; returned payment fees, card convenience fees and paper invoice fees are never waived as a courtesy.
      Credits are never paid out in cash at the time they are issued; a credit balance is refunded only under credit_evt_refund_and_writeoff.
      A credit memo amount is exactly the credit determined by the policy that produced it and is never rounded further.
    eligibility:
      - id: account_can_take_credit
        applies_to: [credit_memo_issued]
        kind: state
        condition: "A credit memo posts only to a credit account whose status is active, on_hold or in_collections."
        evidence_fields: [credit_accounts.status, credit_accounts.credit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.credit_account_id]]
          action_bindings: {credit_accounts.credit_account_id: credit_account_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active, on_hold, in_collections]
    measures: [credit_msr_courtesy_waivers_12m]

  - id: credit_evt_dispute
    subject: [credit_dispute_opened, credit_dispute_resolved]
    rule: >-
      A customer may dispute an invoice for duplicate billing, freight billed in error, a quantity shortage against the shipment record, or goods billed but never shipped; a claim that a contract item was billed above its contract price is a contract price claim under the Contract Pricing Agreement charter and is not opened as an invoice dispute.
      The dispute is opened no later than dispute_filing_window_days calendar days after the invoice date.
      Count calendar days starting the day after the invoice date; a dispute opened on the last day of the window is accepted.
      An invoice may carry only one dispute record.
      The disputed amount is the amount the records show was overbilled, never the customer's estimate.
      A dispute whose disputed amount is at or below dispute_desk_credit_authority_usd and whose records substantiate it is resolved credited by the desk; a substantiated dispute above that amount is resolved referred_to_credit_department; a dispute the records contradict is resolved denied; the customer may withdraw an open dispute.
      An open dispute is resolved within dispute_resolution_business_days business days; while it is open, the disputed amount is treated under disputed_amount_excluded_from_hold.
    eligibility:
      - id: inside_dispute_window
        applies_to: [credit_dispute_opened]
        kind: time
        condition: "The dispute is opened no later than dispute_filing_window_days calendar days after the invoice date."
        evidence_fields: [credit_transactions.document_number, credit_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_transactions.document_number]]
          action_bindings: {credit_transactions.document_number: invoice_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the invoice date"
          anchor_source: credit_transactions.txn_date
          relation: not_after
          duration_source: variants.dispute_filing_window_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the invoice date; a dispute opened on the last day of the window is accepted."
          boundary: inclusive
      - id: one_dispute_per_invoice
        applies_to: [credit_dispute_opened]
        kind: dedup
        condition: "An invoice may carry only one dispute record."
        evidence_fields: [credit_disputes.invoice_number, credit_disputes.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_disputes.invoice_number]]
          action_bindings: {credit_disputes.invoice_number: invoice_number}
        dedup_contract:
          table: credit_disputes
          mode: separate_record
          object_bindings: {invoice_number: invoice_number}
          duplicate_filters: {event_type: [credit_dispute_opened]}
          distinct_fields: []

  - id: credit_limit_review
    subject: [credit_limit_review_requested, credit_limit_review_decided, credit_limit_changed]
    rule: >-
      Limit reviews are taken only on accounts whose status is active.
      A permanent increase request is decided only when at least limit_increase_min_months_since_review calendar months have passed since the account's last credit review date.
      Add the months to the last review date by calendar month; when the target month has no such day the boundary is the last day of that month, and a request dated on the boundary is decided.
      A permanent increase is approved when credit_msr_on_time_pct_12m is at least limit_increase_min_on_time_pct; the approved limit is the requested limit capped at the current limit increased by limit_increase_max_step_pct percent and at the tier's credit_limit_ceiling_usd, decided approved when nothing is capped and approved_reduced when a cap applies.
      When the increase granted (approved limit minus current limit) exceeds limit_increase_desk_approval_usd the request is decided referred_to_committee with approved limit 0.00 and the limit is unchanged.
      A temporary increase for a shutdown, turnaround or seasonal build is granted up to temporary_limit_increase_max_pct percent of the permanent limit for at most temporary_limit_increase_max_days days from the decision date, needs no minimum interval since the last review, and reverts automatically the day after its expiry date; a tier whose temporary_limit_increase_max_pct is 0 does not offer it.
      Every request is decided within limit_review_decision_business_days business days.
      An approved decision updates the account's limit and makes the decision date the account's last credit review date; a declined or referred decision changes neither.
    eligibility:
      - id: active_account_only
        applies_to: [credit_limit_review_requested]
        kind: state
        condition: "Limit reviews are taken only on accounts whose status is active."
        evidence_fields: [credit_accounts.status, credit_accounts.credit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.credit_account_id]]
          action_bindings: {credit_accounts.credit_account_id: credit_account_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]
      - id: review_interval_elapsed
        applies_to: [credit_limit_review_decided]
        kind: time
        condition: "A permanent increase request is decided only when at least limit_increase_min_months_since_review calendar months have passed since the account's last credit review date."
        evidence_fields: [credit_accounts.last_review_date, credit_accounts.credit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.credit_account_id]]
          action_bindings: {credit_accounts.credit_account_id: credit_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account's last credit review date"
          anchor_source: credit_accounts.last_review_date
          relation: not_before
          duration_source: variants.limit_increase_min_months_since_review
          unit: calendar_months
          counting_rule: "Add the months to the last review date by calendar month; when the target month has no such day the boundary is the last day of that month, and a request dated on the boundary is decided."
          boundary: inclusive
    measures: [credit_msr_on_time_pct_12m]
    formula:
      approved_limit: "min(requested_limit, round(credit_limit * (1 + limit_increase_max_step_pct / 100), 2), credit_limit_ceiling_usd)"

  - id: credit_hold_and_collections
    subject: [credit_hold_placed, credit_hold_released, credit_referred_to_collections, credit_reinstated]
    rule: >-
      An active account is placed on hold with hold_reason past_due when credit_msr_oldest_past_due_days reaches hold_trigger_days_past_due and credit_msr_past_due_balance is at least hold_trigger_min_past_due_usd; with hold_reason returned_payments when credit_msr_returned_payments_12m reaches returned_payments_hold_count; and with hold_reason over_limit when the receivable balance exceeds the credit limit increased by over_limit_tolerance_pct percent.
      While the account is on hold no new order lines, vending usage or replenishment may be shipped or billed on terms except what other charters expressly allow; invoices for goods already shipped still post.
      A hold is released only after the payments that cure it have been posted to the account.
      A past_due hold is cured when the past-due balance is paid in full, or, on a tier whose hold_release_full_past_due_required is false, when the remaining past-due balance is below hold_trigger_min_past_due_usd; a returned_payments hold is cured when every returned amount and returned payment fee is repaid; an over_limit hold is cured when the receivable balance is at or below the credit limit.
      An on-hold account is referred to collections when credit_msr_oldest_past_due_days reaches collections_referral_days_past_due and credit_msr_past_due_balance is at least collections_referral_min_usd.
      A referred account is reinstated only when the referred balance is paid in full, and is reinstated one tier lower than its tier at referral (the Net 10 Starter tier stays where it is), with its credit limit reset to the lower of its previous limit and the new tier's credit_limit_ceiling_usd.
    eligibility:
      - id: cure_payment_posted
        applies_to: [credit_hold_released, credit_reinstated]
        kind: authorization
        condition: "A hold is released only after the payments that cure it have been posted to the account."
        evidence_fields: [credit_transactions.credit_account_id, credit_transactions.event_type, credit_transactions.amount, credit_accounts.hold_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_transactions.credit_account_id]]
          action_bindings: {credit_transactions.credit_account_id: credit_account_id}
    measures: [credit_msr_oldest_past_due_days, credit_msr_past_due_balance, credit_msr_returned_payments_12m]

  - id: credit_evt_refund_and_writeoff
    subject: [credit_refund_issued, credit_small_balance_writeoff]
    rule: >-
      A refund is issued only when the account's receivable balance is a credit balance of at least credit_balance_refund_min_usd and no dispute on the account is open.
      The refund equals the whole credit balance and is paid by the tier's credit_balance_refund_method; a smaller credit balance stays on account and is drawn on by the next invoice.
      A residual invoice balance of credit_small_balance_writeoff_max_usd or less is written off once the invoice is more than small_balance_writeoff_min_age_days days past due; a residual above that amount is never written off and stays collectible, and a balance under an open dispute is never written off.
    eligibility:
      - id: refundable_credit_balance
        applies_to: [credit_refund_issued]
        kind: authorization
        condition: "A refund is issued only when the account's receivable balance is a credit balance of at least credit_balance_refund_min_usd and no dispute on the account is open."
        evidence_fields: [credit_accounts.ar_balance, credit_accounts.credit_account_id, credit_disputes.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.credit_account_id]]
          action_bindings: {credit_accounts.credit_account_id: credit_account_id}

  - id: credit_billing_preferences
    subject: [credit_billing_preferences_updated, credit_charge_assessed]
    rule: >-
      Invoices are delivered by email unless the account elects paper or EDI.
      Monthly consolidated billing or EDI delivery is set only on a tier whose consolidated_billing_available or edi_invoicing_available is true respectively.
      A change of billing cycle takes effect from the first day of the next calendar month; invoices already posted keep their dates and due dates.
      When the account's invoice_delivery is paper, a paper invoice fee of paper_invoice_fee_usd per invoice mailed is assessed once per billing month, measured by credit_msr_paper_invoices_month and dated the last calendar day of that month; a tier whose paper_invoice_fee_usd is 0.00 is not charged.
    eligibility:
      - id: election_available_on_tier
        applies_to: [credit_billing_preferences_updated]
        kind: authorization
        condition: "Monthly consolidated billing or EDI delivery is set only on a tier whose consolidated_billing_available or edi_invoicing_available is true respectively."
        evidence_fields: [credit_accounts.variant_name, credit_accounts.credit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.credit_account_id]]
          action_bindings: {credit_accounts.credit_account_id: credit_account_id}
    measures: [credit_msr_paper_invoices_month]
    formula:
      paper_fee: "credit_msr_paper_invoices_month * paper_invoice_fee_usd"

  - id: credit_tier_review
    subject: [credit_tier_changed]
    rule: >-
      Each account is reviewed every credit_review_cycle_months months, and a customer may request a terms upgrade at any time on an active account.
      An account moves up to a higher terms tier only when it meets that tier's entry gate in full and credit_msr_on_time_pct_12m is at least the higher tier's limit_increase_min_on_time_pct.
      On an upgrade the credit limit is raised to the new tier's credit_limit_floor_usd when it is below it and is otherwise unchanged; on a downgrade it is lowered to the new tier's credit_limit_ceiling_usd when it is above it.
      At a periodic review an account whose credit_msr_on_time_pct_12m is below its own tier's limit_increase_min_on_time_pct moves down one tier, except that the Net 10 Starter tier cannot move down.
      A tier change takes effect for invoices dated on or after the review date; invoices already posted keep their terms.
    eligibility:
      - id: upgrade_meets_entry_gate
        applies_to: [credit_tier_changed]
        kind: authorization
        condition: "An account moves up to a higher terms tier only when it meets that tier's entry gate in full and credit_msr_on_time_pct_12m is at least the higher tier's limit_increase_min_on_time_pct."
        evidence_fields: [credit_accounts.variant_name, credit_accounts.credit_account_id, credit_transactions.due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.credit_account_id]]
          action_bindings: {credit_accounts.credit_account_id: credit_account_id}
    measures: [credit_msr_on_time_pct_12m]
    params:
      per_tier:
        Corbett Net 10 Starter Account: {upgrade_target: "Corbett Net 30 Standard Account", downgrade_target: "Corbett Net 10 Starter Account"}
        Corbett Net 30 Standard Account: {upgrade_target: "Corbett Net 30 Preferred Account", downgrade_target: "Corbett Net 10 Starter Account"}
        Corbett Net 30 Preferred Account: {upgrade_target: "Corbett Net 45 Business Account", downgrade_target: "Corbett Net 30 Standard Account"}
        Corbett Net 45 Business Account: {upgrade_target: "Corbett Net 60 Corporate Account", downgrade_target: "Corbett Net 30 Preferred Account"}
        Corbett Net 60 Corporate Account: {upgrade_target: "Corbett Net 90 Strategic Account", downgrade_target: "Corbett Net 45 Business Account"}
        Corbett Net 90 Strategic Account: {upgrade_target: "Corbett Net 90 Strategic Account", downgrade_target: "Corbett Net 60 Corporate Account"}

  - id: credit_account_closure
    subject: [credit_account_closed]
    rule: >-
      A customer-requested closure is accepted only when the account's receivable balance is zero and no dispute on the account is open; a customer with a credit balance first receives the refund under credit_evt_refund_and_writeoff, and a customer with a debit balance first pays it.
      The closure is the customer's own act and is confirmed by the customer; the account stays active until then.
      An active account with a zero balance and no posted invoice for dormancy_close_months whole months is closed by the system with close_reason dormant.
      An account in collections whose referred balance Corbett Collections writes off is closed with close_reason collections_writeoff and cannot be reopened; the customer must apply again.
      Closing the credit account ends terms billing for every program and ship-to of the customer; any program that bills monthly must be on a different payment arrangement before closure, which is outside this charter.
    eligibility:
      - id: closure_zero_balance
        applies_to: [credit_account_closed]
        kind: authorization
        condition: "A customer-requested closure is accepted only when the account's receivable balance is zero and no dispute on the account is open"
        evidence_fields: [credit_accounts.ar_balance, credit_accounts.credit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.credit_account_id]]
          action_bindings: {credit_accounts.credit_account_id: credit_account_id}
    params:
      per_tier:
        Corbett Net 10 Starter Account: {dormancy_months: "=dormancy_close_months"}
        Corbett Net 30 Standard Account: {dormancy_months: "=dormancy_close_months"}
        Corbett Net 30 Preferred Account: {dormancy_months: "=dormancy_close_months"}
        Corbett Net 45 Business Account: {dormancy_months: "=dormancy_close_months"}
        Corbett Net 60 Corporate Account: {dormancy_months: "=dormancy_close_months"}
        Corbett Net 90 Strategic Account: {dormancy_months: "=dormancy_close_months"}

# ============================================================================
# extended_policies (d1_credit_account_billing_and_credits)
# ============================================================================
extended_policies:
  - id: credit_ext_window_discount_catchup
    base_policy_refs: [credit_evt_cash_discount]
    overwrite:
      - base_policy: credit_evt_cash_discount
        superseded_clause: >-
          A payment earns the tier's cash_discount_pct prompt-payment discount on the merchandise subtotal of the invoice it pays, never on freight or sales tax.
        replaced_by: >-
          For a payment on an invoice within this rule's scope the prompt-payment discount it earns is worked out under this rule, in place of the tier's prompt-payment discount percentage applied to the merchandise subtotal of the invoice it pays; every other invoice remains under the base cash-discount rule, which applies that percentage to the merchandise subtotal, and freight and sales tax never earn a discount.
      - base_policy: credit_evt_cash_discount
        superseded_clause: >-
          Only payment of the full remaining invoice balance (less the discount) earns the discount, except that on a tier whose cash_discount_partial_payment is true a partial payment inside the window earns the discount pro rata on the merchandise share it pays.
        replaced_by: >-
          A payment that leaves open on its invoice no more than the tier's prompt-payment discount percentage of that invoice's merchandise subtotal counts as payment of the full remaining balance, and for a payment on an invoice within this rule's scope the merchandise it pays for is set by the payment allocation of this rule, in place of the test of the full remaining balance less the discount and the pro rata share of a partial payment; every other invoice remains under the base cash-discount rule, under which only payment of the full remaining balance less the discount earns it, except that on a tier allowing partial-payment discounts a partial payment inside the window earns it pro rata on the merchandise share it pays.
      - base_policy: credit_evt_cash_discount
        superseded_clause: >-
          No discount is earned on an invoice billed under a Contract Pricing Agreement whose tier is listed in cash_discount_excluded_pricing_tiers and whose status is active on the invoice date, because those prices are already net.
        replaced_by: >-
          For a payment on an invoice within this rule's scope the contract share of the discount rate follows the tier recorded on the customer's live agreement, so an invoice dated inside that agreement's current term on a tier listed among the terms tier's cash-discount-excluded pricing tiers is net-priced and earns no discount; every other invoice remains under the base cash-discount rule, under which no discount is earned on an invoice billed under an agreement on such a tier whose status is active on the invoice date.
    trigger: state_due
    subject: [credit_cash_discount_taken]
    computes: discount_amount
    target_tool: book_cash_discount_2280b564
    params:
      record_withdraw_charges: 2
      record_share_one_charge: 50
      contract_share_discounted: 75
      whole_share: 100
    rule: >-
      A payment received inside the discount window of the invoice it is applied to earns the prompt-payment discount set out in this rule, and Corbett books that discount as a catch-up discount line when the account's most recent payment earned it and the invoice that payment is applied to carries no discount line.
      The payment concerned is the payment entry with the latest received date on the account and the invoice concerned is the invoice that entry is applied to; when more than one payment entry carries that latest received date, no catch-up discount is booked under this rule and the catch-up figure is nothing.
      The payment amount is the amount of the payment concerned applied to the invoice concerned, and the invoice total is the total of the invoice concerned.
      For a payment on an invoice within this rule's scope the prompt-payment discount it earns is worked out under this rule, in place of the tier's prompt-payment discount percentage applied to the merchandise subtotal of the invoice it pays; every other invoice remains under the base cash-discount rule, which applies that percentage to the merchandise subtotal, and freight and sales tax never earn a discount.
      A payment that leaves open on its invoice no more than the tier's prompt-payment discount percentage of that invoice's merchandise subtotal counts as payment of the full remaining balance, and for a payment on an invoice within this rule's scope the merchandise it pays for is set by the payment allocation of this rule, in place of the test of the full remaining balance less the discount and the pro rata share of a partial payment; every other invoice remains under the base cash-discount rule, under which only payment of the full remaining balance less the discount earns it, except that on a tier allowing partial-payment discounts a partial payment inside the window earns it pro rata on the merchandise share it pays.
      For a payment on an invoice within this rule's scope the contract share of the discount rate follows the tier recorded on the customer's live agreement, so an invoice dated inside that agreement's current term on a tier listed among the terms tier's cash-discount-excluded pricing tiers is net-priced and earns no discount; every other invoice remains under the base cash-discount rule, under which no discount is earned on an invoice billed under an agreement on such a tier whose status is active on the invoice date.
      The prompt-payment discount is the discount rate applied once to the merchandise the payment pays for, counted in the proportion that the discountable merchandise bears to the invoice's merchandise subtotal, rounded to the nearest cent only on that final figure.
      The discount rate is the tier's prompt-payment discount percentage, the discountable merchandise is the merchandise subtotal of the invoice the payment is applied to, never its freight or sales tax, and the merchandise the payment pays for is the whole of that merchandise subtotal.
      Every share of the discount rate this rule sets multiplies the tier's percentage, and the rate so reached is applied once; an invoice with no merchandise earns nothing.
      This rule covers only an invoice dated inside the current term, from its effective date through its expiration date, of the customer's live Contract Pricing Agreement, meaning its one agreement whose status is active or renewal pending; for every other invoice, including any invoice of a customer with no live agreement or with more than one, the catch-up line carries exactly the base cash-discount rule's figure: the tier's prompt-payment discount percentage of the invoice's merchandise subtotal when the payment leaves open no more than that discount, that figure in the proportion of the payment to the invoice total for a payment leaving more open on a tier allowing partial-payment discounts, and nothing for such a payment on any other tier or for an invoice billed under an agreement on a cash-discount-excluded pricing tier whose status is active on the invoice date, which the records show as the customer's live agreement recorded on such a tier with status active, the only agreement status and tier the records hold, rounded to the nearest cent.
      Whole months between a date and today are the difference in calendar months, less one when today's day of the month is earlier than that date's day of the month, with no move of a month-end date to a shorter month's last day.
      What is left open on the invoice is the invoice total less every payment, credit memo, discount line and write-off applied to it, plus every returned payment reversed on it, compared without rounding with the tier's prompt-payment discount percentage of the invoice's merchandise subtotal.
      When more is left open than the tier's prompt-payment discount percentage of the invoice's merchandise subtotal and the tier allows partial-payment discounts, the payment is taken to settle the invoice's freight and sales tax first, so the merchandise it pays for is the payment less the invoice's freight and sales tax, never below nothing; when more is left open than that and the tier does not allow partial-payment discounts, the merchandise it pays for is nothing; otherwise it pays for the whole merchandise subtotal.
      The payment-record share of the discount rate is nothing for an account charged two or more late payment finance charges dated less than twelve whole months before today, one half for an account charged exactly one such charge, and the whole rate for an account charged none.
      The contract share of the discount rate is nothing for a net-priced invoice, three quarters for an invoice dated inside the current term of a Corbett Category Contract or Corbett Volume Discount Agreement, and the whole rate otherwise.
      The discountable merchandise is the merchandise subtotal less the disputed amount when the dispute on the invoice is open, meaning its opening entry has no resolution entry, and was opened for a quantity shortage or for goods not shipped; when no such dispute is open but credit memos for returned merchandise are applied to the invoice, it is the merchandise subtotal less those return credits; otherwise it is the merchandise subtotal.
    prerequisite: []
    cross_category:
      - category: pricing
        as: branch
        reads: [variant_name, status, effective_date, expiration_date]
        note: The contract share of the discount rate is decided by the recorded tier of the customer's live agreement for an invoice inside its current term; outside that scope the live agreement's recorded tier and status decide the base figure's exclusion.
    compute:
      - pay_date: "LATEST('credit_transactions','txn_date', date_field='txn_date', event_type='credit_payment_received')"
      - pay_ties: "COUNT('credit_transactions', event_type='credit_payment_received', txn_date=pay_date)"
      - pay_ref: "LATEST('credit_transactions','document_number', date_field='txn_date', event_type='credit_payment_received')"
      - inv: "LATEST('credit_transactions','applied_invoice_number', date_field='txn_date', event_type='credit_payment_received')"
      - inv_merch: "SUM('credit_transactions','merchandise_amount', event_type='credit_invoice_posted', document_number=inv)"
      - pay_amt: "SUM('credit_transactions','amount', event_type='credit_payment_received', document_number=pay_ref, applied_invoice_number=inv)"
      - inv_total: "SUM('credit_transactions','amount', event_type='credit_invoice_posted', document_number=inv)"
      - inv_freight_tax: "SUM('credit_transactions','freight_amount', event_type='credit_invoice_posted', document_number=inv) + SUM('credit_transactions','tax_amount', event_type='credit_invoice_posted', document_number=inv)"
      - applied_out: "SUM('credit_transactions','amount', event_type='credit_payment_received', applied_invoice_number=inv) + SUM('credit_transactions','amount', event_type='credit_memo_issued', applied_invoice_number=inv) + SUM('credit_transactions','amount', event_type='credit_cash_discount_taken', applied_invoice_number=inv) + SUM('credit_transactions','amount', event_type='credit_small_balance_writeoff', applied_invoice_number=inv)"
      - returned_in: "SUM('credit_transactions','amount', event_type='credit_payment_returned', applied_invoice_number=inv)"
      - left_open: "inv_total - applied_out + returned_in"
      - full_rate_disc: "inv_merch * P('cash_discount_pct') / 100"
      - paid_merch: "MX(0, pay_amt - inv_freight_tax) if (left_open > full_rate_disc and P('cash_discount_partial_payment')) else (0 if (left_open > full_rate_disc and not P('cash_discount_partial_payment')) else inv_merch)"
      - fc12: "COUNT('credit_transactions', within_months=12, date_field='txn_date', event_type='credit_charge_assessed', charge_type='finance_charge')"
      - record_share: "0 if fc12 >= K('record_withdraw_charges') else (K('record_share_one_charge') if fc12 == 1 else K('whole_share'))"
      - inv_date: "LATEST('credit_transactions','txn_date', date_field='txn_date', event_type='credit_invoice_posted', document_number=inv)"
      - pa_tier: "CFIELD('pricing','variant_name', status='active') or CFIELD('pricing','variant_name', status='renewal_pending')"
      - pa_eff: "CFIELD('pricing','effective_date', status='active') or CFIELD('pricing','effective_date', status='renewal_pending')"
      - pa_end: "CFIELD('pricing','expiration_date', status='active') or CFIELD('pricing','expiration_date', status='renewal_pending')"
      - pa_in_force: "(DAYS(pa_eff, inv_date) >= 0 and DAYS(inv_date, pa_end) >= 0) if (inv_date and pa_eff and pa_end) else False"
      - contract_share: "0 if ((pa_in_force and pa_tier in P('cash_discount_excluded_pricing_tiers'))) else (K('contract_share_discounted') if (pa_in_force and (pa_tier == 'Corbett Category Contract' or pa_tier == 'Corbett Volume Discount Agreement')) else K('whole_share'))"
      - disp_open_n: "COUNT('credit_disputes', event_type='credit_dispute_opened', invoice_number=inv) - COUNT('credit_disputes', event_type='credit_dispute_resolved', invoice_number=inv)"
      - disp_goods_amt: "SUM('credit_disputes','disputed_amount', event_type='credit_dispute_opened', invoice_number=inv, dispute_reason='quantity_shortage') + SUM('credit_disputes','disputed_amount', event_type='credit_dispute_opened', invoice_number=inv, dispute_reason='goods_not_shipped')"
      - ret_credit: "SUM('credit_transactions','amount', event_type='credit_memo_issued', source_type='return_credit', applied_invoice_number=inv)"
      - disc_merch: "inv_merch - disp_goods_amt if (disp_open_n > 0 and disp_goods_amt > 0) else (inv_merch - ret_credit if ret_credit > 0 else inv_merch)"
      - disc_rate: "P('cash_discount_pct') * record_share / 100 * contract_share / 100"
      - live_n: "(1 if EXISTS('pricing', status='active') else 0) + (1 if EXISTS('pricing', status='renewal_pending') else 0)"
      - in_scope: "live_n == 1 and pa_in_force"
      - base_excluded: "EXISTS('pricing', status='active') and CFIELD('pricing','variant_name', status='active') in P('cash_discount_excluded_pricing_tiers')"
      - base_share: "1 if left_open <= full_rate_disc else (pay_amt / inv_total if P('cash_discount_partial_payment') else 0)"
      - base_figure: "0 if base_excluded else RND(inv_merch * P('cash_discount_pct') / 100 * base_share, 2)"
      - result: "0 if (pay_ties > 1 or inv_merch <= 0) else (RND(paid_merch * disc_merch / inv_merch * disc_rate / 100, 2) if in_scope else base_figure)"
    compute_basis:
      pay_date: "The payment concerned is the payment entry with the latest received date on the account and the invoice concerned is the invoice that entry is applied to"
      pay_ties: "when more than one payment entry carries that latest received date, no catch-up discount is booked under this rule and the catch-up figure is nothing."
      pay_ref: "The payment concerned is the payment entry with the latest received date on the account and the invoice concerned is the invoice that entry is applied to"
      inv: "The payment concerned is the payment entry with the latest received date on the account and the invoice concerned is the invoice that entry is applied to"
      inv_merch: "the discountable merchandise is the merchandise subtotal of the invoice the payment is applied to, never its freight or sales tax"
      pay_amt: "The payment amount is the amount of the payment concerned applied to the invoice concerned"
      inv_total: "the invoice total is the total of the invoice concerned."
      inv_freight_tax: "the payment is taken to settle the invoice's freight and sales tax first, so the merchandise it pays for is the payment less the invoice's freight and sales tax, never below nothing"
      applied_out: "What is left open on the invoice is the invoice total less every payment, credit memo, discount line and write-off applied to it, plus every returned payment reversed on it, compared without rounding"
      returned_in: "What is left open on the invoice is the invoice total less every payment, credit memo, discount line and write-off applied to it, plus every returned payment reversed on it, compared without rounding"
      left_open: "What is left open on the invoice is the invoice total less every payment, credit memo, discount line and write-off applied to it, plus every returned payment reversed on it, compared without rounding"
      full_rate_disc: "What is left open on the invoice is the invoice total less every payment, credit memo, discount line and write-off applied to it, plus every returned payment reversed on it, compared without rounding with the tier's prompt-payment discount percentage of the invoice's merchandise subtotal."
      paid_merch: "When more is left open than the tier's prompt-payment discount percentage of the invoice's merchandise subtotal and the tier allows partial-payment discounts, the payment is taken to settle the invoice's freight and sales tax first, so the merchandise it pays for is the payment less the invoice's freight and sales tax, never below nothing; when more is left open than that and the tier does not allow partial-payment discounts, the merchandise it pays for is nothing; otherwise it pays for the whole merchandise subtotal."
      fc12: "The payment-record share of the discount rate is nothing for an account charged two or more late payment finance charges dated less than twelve whole months before today, one half for an account charged exactly one such charge, and the whole rate for an account charged none."
      record_share: "The payment-record share of the discount rate is nothing for an account charged two or more late payment finance charges dated less than twelve whole months before today, one half for an account charged exactly one such charge, and the whole rate for an account charged none."
      inv_date: "This rule covers only an invoice dated inside the current term, from its effective date through its expiration date, of the customer's live Contract Pricing Agreement, meaning its one agreement whose status is active or renewal pending"
      pa_tier: "For a payment on an invoice within this rule's scope the contract share of the discount rate follows the tier recorded on the customer's live agreement"
      pa_eff: "This rule covers only an invoice dated inside the current term, from its effective date through its expiration date, of the customer's live Contract Pricing Agreement, meaning its one agreement whose status is active or renewal pending"
      pa_end: "This rule covers only an invoice dated inside the current term, from its effective date through its expiration date, of the customer's live Contract Pricing Agreement, meaning its one agreement whose status is active or renewal pending"
      pa_in_force: "This rule covers only an invoice dated inside the current term, from its effective date through its expiration date, of the customer's live Contract Pricing Agreement, meaning its one agreement whose status is active or renewal pending"
      contract_share: "The contract share of the discount rate is nothing for a net-priced invoice, three quarters for an invoice dated inside the current term of a Corbett Category Contract or Corbett Volume Discount Agreement, and the whole rate otherwise."
      disp_open_n: "The discountable merchandise is the merchandise subtotal less the disputed amount when the dispute on the invoice is open, meaning its opening entry has no resolution entry, and was opened for a quantity shortage or for goods not shipped"
      disp_goods_amt: "The discountable merchandise is the merchandise subtotal less the disputed amount when the dispute on the invoice is open, meaning its opening entry has no resolution entry, and was opened for a quantity shortage or for goods not shipped"
      ret_credit: "when no such dispute is open but credit memos for returned merchandise are applied to the invoice, it is the merchandise subtotal less those return credits; otherwise it is the merchandise subtotal."
      disc_merch: "The discountable merchandise is the merchandise subtotal less the disputed amount when the dispute on the invoice is open, meaning its opening entry has no resolution entry, and was opened for a quantity shortage or for goods not shipped; when no such dispute is open but credit memos for returned merchandise are applied to the invoice, it is the merchandise subtotal less those return credits; otherwise it is the merchandise subtotal."
      disc_rate: "Every share of the discount rate this rule sets multiplies the tier's percentage, and the rate so reached is applied once; an invoice with no merchandise earns nothing."
      live_n: "This rule covers only an invoice dated inside the current term, from its effective date through its expiration date, of the customer's live Contract Pricing Agreement, meaning its one agreement whose status is active or renewal pending"
      in_scope: "This rule covers only an invoice dated inside the current term, from its effective date through its expiration date, of the customer's live Contract Pricing Agreement, meaning its one agreement whose status is active or renewal pending"
      base_excluded: "for an invoice billed under an agreement on a cash-discount-excluded pricing tier whose status is active on the invoice date, which the records show as the customer's live agreement recorded on such a tier with status active, the only agreement status and tier the records hold"
      base_share: "the tier's prompt-payment discount percentage of the invoice's merchandise subtotal when the payment leaves open no more than that discount, that figure in the proportion of the payment to the invoice total for a payment leaving more open on a tier allowing partial-payment discounts"
      base_figure: "for every other invoice, including any invoice of a customer with no live agreement or with more than one, the catch-up line carries exactly the base cash-discount rule's figure: the tier's prompt-payment discount percentage of the invoice's merchandise subtotal when the payment leaves open no more than that discount, that figure in the proportion of the payment to the invoice total for a payment leaving more open on a tier allowing partial-payment discounts, and nothing for such a payment on any other tier or for an invoice billed under an agreement on a cash-discount-excluded pricing tier whose status is active on the invoice date, which the records show as the customer's live agreement recorded on such a tier with status active, the only agreement status and tier the records hold, rounded to the nearest cent."
      result: "The prompt-payment discount is the discount rate applied once to the merchandise the payment pays for, counted in the proportion that the discountable merchandise bears to the invoice's merchandise subtotal, rounded to the nearest cent only on that final figure."
    factors:
      - id: payment_allocation_to_merchandise
        effect: method
        decides: paid_merch
        bindings: [inv_freight_tax, paid_merch]
        ladder:
          - when: "more is left open on the invoice than the tier's full-rate discount on its merchandise AND the terms tier allows partial-payment discounts"
            method: "the payment settles freight and sales tax first; the merchandise paid for is the payment less the invoice's freight and sales tax, never below nothing"
          - when: "more is left open than that AND the terms tier does not allow partial-payment discounts"
            method: "no merchandise is paid for (a short payment earns nothing)"
          - when: "otherwise (no more left open than the full-rate discount)"
            method: "the whole merchandise subtotal is paid for"
        baseline:
          paid_merch: "inv_merch"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: payment_record_share_of_rate
        effect: parameter
        decides: record_share
        bindings: [fc12, record_share]
        ladder:
          - when: "two or more late payment finance charges dated less than twelve whole months before today"
            value: "nothing"
          - when: "exactly one such charge"
            value: "one half of the rate (K('record_share_one_charge'))"
          - when: "otherwise (none)"
            value: "the whole rate (K('whole_share'))"
        baseline:
          record_share: "K('whole_share')"
        evidence: [history]
        cross_difficulty: null
      - id: contract_share_of_rate
        effect: parameter
        decides: contract_share
        bindings: [pa_tier, contract_share]
        ladder:
          - when: "the invoice is net-priced: dated inside the current term of the customer's agreement and that agreement's recorded tier is listed among the cash-discount-excluded pricing tiers"
            value: "nothing"
          - when: "the invoice is dated inside the current term of a Corbett Category Contract or Corbett Volume Discount Agreement"
            value: "three quarters of the rate (K('contract_share_discounted'))"
          - when: "otherwise (an invoice that is not net-priced and not in the current term of a live Category or Volume agreement)"
            value: "the whole rate (K('whole_share'))"
        baseline:
          contract_share: "K('whole_share')"
        evidence: [cross_category, date]
        cross_difficulty: pricing
      - id: discountable_merchandise_deduction
        effect: parameter
        decides: disc_merch
        bindings: [disp_open_n, disp_goods_amt, ret_credit, disc_merch]
        ladder:
          - when: "the dispute on the invoice is open AND it was opened for a quantity shortage or goods not shipped"
            value: "the merchandise subtotal less the disputed amount"
          - when: "no such dispute is open AND return credit memos are applied to the invoice"
            value: "the merchandise subtotal less those return credits"
          - when: "otherwise"
            value: "the merchandise subtotal"
        baseline:
          disc_merch: "inv_merch"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The prompt-payment discount is the discount rate applied once to the merchandise the payment pays for, counted in the proportion that the discountable merchandise bears to the invoice's merchandise subtotal, rounded to the nearest cent only on that final figure.
        The discount rate is the tier's prompt-payment discount percentage, the discountable merchandise is the merchandise subtotal of the invoice the payment is applied to, never its freight or sales tax, and the merchandise the payment pays for is the whole of that merchandise subtotal.
      params: [cash_discount_pct]
    inputs:
      history:
        - {table: credit_transactions, aggregate: latest, field: applied_invoice_number, filters: {event_type: credit_payment_received}}
        - {table: credit_transactions, aggregate: sum, field: amount, filters: {applied_invoice_number: "<invoice concerned>"}}
        - {table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_charge_assessed, charge_type: finance_charge}}
        - {table: credit_disputes, aggregate: sum, field: disputed_amount, filters: {invoice_number: "<invoice concerned>"}}
      cross_category: [pricing]

  - id: credit_ext_backorder_room_payment
    base_policy_refs: [credit_evt_cash_discount, credit_evt_payment_methods, credit_hold_and_collections]
    overwrite: []
    trigger: on_request
    subject: [credit_payment_received]
    computes: payment_amount
    target_tool: pay_by_bank_debit_4d9f44ce
    params:
      whole_share: 100
      half_share: 50
      quarter_share: 25
      tenure_months: 120
      commit_large: 250000
      commit_mid: 25000
      points_large_commit: 5
      points_mid_commit: 2
      usage_months: 3
    rule: >-
      A customer who wants room on the credit line for backordered goods still to ship pays a room payment by bank debit, received on account without remittance detail, and the room payment is the amount that keeps the account within its room ceiling once those goods ship and the month-end program billing posts.
      The room payment is worked out only after the account's most recent payment carries a discount line on the invoice it is applied to, wherever a catch-up discount above nothing is owed for that payment under the prompt-payment discount rule; where none is owed, the room payment waits on no discount line.
      The room payment is the receivable balance plus the open backorder value counted, less the room ceiling, never below zero and rounded to the nearest cent only on that final figure.
      The open backorder value counted is the value at booked prices of the backorders on the customer's ship-tos still open, meaning the backordered value less the value filled or cancelled, and the room ceiling is the credit limit increased by the tolerance percentage used, which is the tier's over-limit tolerance percentage.
      Every amount a schedule in this rule adds is added to the receivable balance together with the open backorder value counted, every percentage point a schedule adds is added to the tolerance percentage used, and the tolerance percentage used never exceeds the tier's over-limit tolerance percentage, before the room payment is worked out.
      Whole months between a date and today are the difference in calendar months, less one when today's day of the month is earlier than that date's day of the month, with no move of a month-end date to a shorter month's last day.
      The share of the tier's over-limit tolerance percentage that enters the tolerance percentage used is nothing for an account opened less than ten whole years before today that carries a returned payment entry dated less than the tier's returned-payment lookback in whole months before today, one half for an account that meets exactly one of those two conditions, and the whole percentage for an account that meets neither.
      The open backorder value counted is grossed up by a sales-tax ratio: on an account billed monthly consolidated that was billed sales tax in the last twelve whole months the ratio is the sales tax to the merchandise subtotal of all invoices dated on the latest invoice date, on an account billed per shipment that was billed sales tax in the last twelve whole months it is the sales tax to the merchandise subtotal billed over those twelve months; on any other account the ratio is zero, and a ratio is zero wherever the merchandise compared is nothing.
      The StockSmart billing still to post is a share of the recurring program fees, meaning the monthly minimum and onsite management fees, charged across all the customer's StockSmart programs less than one whole month before today: the whole of them when such fees were charged in each of the months less than one whole month, one whole month and two whole months before today, one half of them when such fees were charged in exactly two of those three months, and one quarter of them otherwise.
      The tolerance percentage used gains five percentage points for a customer whose active Contract Pricing Agreement commits at least two hundred fifty thousand dollars of annual spend, two percentage points for one whose active agreement commits at least twenty-five thousand dollars but less than that, and none otherwise.
      The VendPoint billing still to post is read from the usage billed on all the customer's VendPoint machines and is nothing when no usage was billed on them in the last three whole months; otherwise it is a usage estimate plus the cellular data fees charged on those machines dated less than one whole month before today, where the estimate is the larger of the latest month's usage plus its rise over the month before and the largest monthly minimum usage among the customer's active VendPoint machines when usage was billed in each of the months less than one whole month, one whole month and two whole months before today and each of those months' usage exceeds the month before it, the usage of the last three whole months divided by three when usage was billed two whole months before today otherwise, and the usage of the latest month within the last two whole months that carries usage when usage was billed only within those two months.
    prerequisite:
      - problem: credit_ext_window_discount_catchup
        kind: value_input
        gate: recv
        form: state
        policy_source: >-
          The room payment is worked out only after the account's most recent payment carries a discount line on the invoice it is applied to, wherever a catch-up discount above nothing is owed for that payment under the prompt-payment discount rule; where none is owed, the room payment waits on no discount line.
        condition: >-
          Where the prompt-payment discount rule fixes a catch-up discount above nothing for the account's most recent credit_payment_received entry (one entry alone on the latest received date, inside its invoice's window, no discount line yet), a credit_cash_discount_taken entry stands on that invoice; where it fixes nothing (ties, short payment on a non-partial tier, no merchandise, a zero share, a zero-day tier) no entry is required.
        resolved_by: book_cash_discount_2280b564
        effect: >-
          The catch-up discount line lowers the account's receivable balance by the catch-up discount, so the receivable balance the room payment starts from falls by that amount.
    cross_category:
      - category: order
        as: history
        reads: [order_lines.extended_amount, order_lines.event_type]
        note: The open backorder value counted comes from the customer's backorder, fill and backorder-cancellation entries on its ship-tos.
      - category: vmi
        as: history
        reads: [vmi_activity.fee_type, vmi_activity.extended_amount, vmi_activity.event_date]
        note: The StockSmart billing still to post is the recurring fees charged across all the customer's programs in the last whole month.
      - category: pricing
        as: branch
        reads: [annual_spend_commitment, status]
        note: The tolerance points are decided by the annual spend committed on the customer's active Contract Pricing Agreement.
      - category: vending
        as: history
        reads: [vending_transactions.extended_amount, vending_transactions.event_type, vending_transactions.fee_type, vending_machines.status, vending_machines.variant_name]
        note: The VendPoint billing still to post is read from the usage and last month's cellular fees across all the customer's machines, and for rising usage from the active machines' model minimum usage.
    compute:
      - recv: "F('ar_balance')"
      - bo_open: "XSUM('order','order_lines','extended_amount', event_type='order_line_backordered') - XSUM('order','order_lines','extended_amount', event_type='order_backorder_filled') - XSUM('order','order_lines','extended_amount', event_type='order_backorder_cancelled')"
      - last_inv_date: "LATEST('credit_transactions','txn_date', date_field='txn_date', event_type='credit_invoice_posted')"
      - tax_last_day: "SUM('credit_transactions','tax_amount', event_type='credit_invoice_posted', txn_date=last_inv_date)"
      - merch_last_day: "SUM('credit_transactions','merchandise_amount', event_type='credit_invoice_posted', txn_date=last_inv_date)"
      - tax12: "SUM('credit_transactions','tax_amount', within_months=12, date_field='txn_date', event_type='credit_invoice_posted')"
      - merch12: "SUM('credit_transactions','merchandise_amount', within_months=12, date_field='txn_date', event_type='credit_invoice_posted')"
      - tax_ratio: "(tax_last_day / merch_last_day if merch_last_day > 0 else 0) if (F('billing_cycle') == 'monthly_consolidated' and tax12 > 0) else ((tax12 / merch12 if merch12 > 0 else 0) if (F('billing_cycle') == 'per_shipment' and tax12 > 0) else 0)"
      - bo_counted: "bo_open * (1 + tax_ratio)"
      - opened_m: "MONTHS(F('opened_date'), NOW)"
      - ret_n: "COUNT('credit_transactions', within_months=P('returned_payment_lookback_months'), date_field='txn_date', event_type='credit_payment_returned')"
      - tol_share: "0 if (opened_m < K('tenure_months') and ret_n > 0) else (K('half_share') if ((opened_m < K('tenure_months') and ret_n == 0) or (opened_m >= K('tenure_months') and ret_n > 0)) else K('whole_share'))"
      - pa_commit: "CFIELD('pricing','annual_spend_commitment', status='active') or 0"
      - tol_points: "K('points_large_commit') if pa_commit >= K('commit_large') else (K('points_mid_commit') if pa_commit >= K('commit_mid') else 0)"
      - tol_used: "MN(P('over_limit_tolerance_pct'), P('over_limit_tolerance_pct') * tol_share / 100 + tol_points)"
      - room_ceiling: "F('credit_limit') * (1 + tol_used / 100)"
      - vmi_rec0: "XSUM('vmi','vmi_activity','extended_amount', within_months=1, date_field='event_date', event_type='vmi_program_fee_charged', fee_type='monthly_minimum_fee') + XSUM('vmi','vmi_activity','extended_amount', within_months=1, date_field='event_date', event_type='vmi_program_fee_charged', fee_type='onsite_management_fee')"
      - vmi_c1: "XCOUNT('vmi','vmi_activity', within_months=1, date_field='event_date', event_type='vmi_program_fee_charged', fee_type='monthly_minimum_fee') + XCOUNT('vmi','vmi_activity', within_months=1, date_field='event_date', event_type='vmi_program_fee_charged', fee_type='onsite_management_fee')"
      - vmi_c2: "XCOUNT('vmi','vmi_activity', within_months=2, date_field='event_date', event_type='vmi_program_fee_charged', fee_type='monthly_minimum_fee') + XCOUNT('vmi','vmi_activity', within_months=2, date_field='event_date', event_type='vmi_program_fee_charged', fee_type='onsite_management_fee')"
      - vmi_c3: "XCOUNT('vmi','vmi_activity', within_months=3, date_field='event_date', event_type='vmi_program_fee_charged', fee_type='monthly_minimum_fee') + XCOUNT('vmi','vmi_activity', within_months=3, date_field='event_date', event_type='vmi_program_fee_charged', fee_type='onsite_management_fee')"
      - vmi_months: "(1 if vmi_c1 > 0 else 0) + (1 if vmi_c2 - vmi_c1 > 0 else 0) + (1 if vmi_c3 - vmi_c2 > 0 else 0)"
      - vmi_bill: "vmi_rec0 if vmi_months == 3 else (vmi_rec0 * K('half_share') / 100 if vmi_months == 2 else vmi_rec0 * K('quarter_share') / 100)"
      - vend_usage3: "XSUM('vending','vending_transactions','extended_amount', within_months=K('usage_months'), date_field='event_date', event_type='vending_usage_billed')"
      - vend_u0: "XSUM('vending','vending_transactions','extended_amount', within_months=1, date_field='event_date', event_type='vending_usage_billed')"
      - vend_u1: "XSUM('vending','vending_transactions','extended_amount', within_months=2, date_field='event_date', event_type='vending_usage_billed') - vend_u0"
      - vend_u2: "vend_usage3 - vend_u0 - vend_u1"
      - vend_has2: "XCOUNT('vending','vending_transactions', within_months=3, date_field='event_date', event_type='vending_usage_billed') - XCOUNT('vending','vending_transactions', within_months=2, date_field='event_date', event_type='vending_usage_billed')"
      - vend_cell1: "XSUM('vending','vending_transactions','extended_amount', within_months=1, date_field='event_date', event_type='vending_fee_charged', fee_type='cellular_data_fee')"
      - vend_floor: "MX((CPARAM('vending','min_monthly_usage_usd', status='active', variant_name='VendPoint Locker 12') or 0), (CPARAM('vending','min_monthly_usage_usd', status='active', variant_name='VendPoint Locker 24') or 0), (CPARAM('vending','min_monthly_usage_usd', status='active', variant_name='VendPoint Coil 40') or 0), (CPARAM('vending','min_monthly_usage_usd', status='active', variant_name='VendPoint Coil 60') or 0), (CPARAM('vending','min_monthly_usage_usd', status='active', variant_name='VendPoint Carousel 90') or 0), (CPARAM('vending','min_monthly_usage_usd', status='active', variant_name='VendPoint Smart Crib 300') or 0))"
      - vend_bill: "MX(vend_u0 + (vend_u0 - vend_u1), vend_floor) + vend_cell1 if (vend_has2 > 0 and vend_u2 > 0 and vend_u1 > vend_u2 and vend_u0 > vend_u1) else (vend_usage3 / K('usage_months') + vend_cell1 if vend_has2 > 0 else ((vend_u0 if vend_u0 > 0 else vend_u1) + vend_cell1 if vend_usage3 > 0 else 0))"
      - result: "MX(0, RND(recv + bo_counted + vmi_bill + vend_bill - room_ceiling, 2))"
    compute_basis:
      recv: "The room payment is the receivable balance plus the open backorder value counted, less the room ceiling, never below zero and rounded to the nearest cent only on that final figure."
      bo_open: "The open backorder value counted is the value at booked prices of the backorders on the customer's ship-tos still open, meaning the backordered value less the value filled or cancelled"
      last_inv_date: "on an account billed monthly consolidated that was billed sales tax in the last twelve whole months the ratio is the sales tax to the merchandise subtotal of all invoices dated on the latest invoice date"
      tax_last_day: "on an account billed monthly consolidated that was billed sales tax in the last twelve whole months the ratio is the sales tax to the merchandise subtotal of all invoices dated on the latest invoice date"
      merch_last_day: "on an account billed monthly consolidated that was billed sales tax in the last twelve whole months the ratio is the sales tax to the merchandise subtotal of all invoices dated on the latest invoice date"
      tax12: "on an account billed per shipment that was billed sales tax in the last twelve whole months it is the sales tax to the merchandise subtotal billed over those twelve months"
      merch12: "on an account billed per shipment that was billed sales tax in the last twelve whole months it is the sales tax to the merchandise subtotal billed over those twelve months"
      tax_ratio: "The open backorder value counted is grossed up by a sales-tax ratio: on an account billed monthly consolidated that was billed sales tax in the last twelve whole months the ratio is the sales tax to the merchandise subtotal of all invoices dated on the latest invoice date, on an account billed per shipment that was billed sales tax in the last twelve whole months it is the sales tax to the merchandise subtotal billed over those twelve months; on any other account the ratio is zero, and a ratio is zero wherever the merchandise compared is nothing."
      bo_counted: "The open backorder value counted is grossed up by a sales-tax ratio"
      opened_m: "nothing for an account opened less than ten whole years before today that carries a returned payment entry dated less than the tier's returned-payment lookback in whole months before today"
      ret_n: "nothing for an account opened less than ten whole years before today that carries a returned payment entry dated less than the tier's returned-payment lookback in whole months before today"
      tol_share: "The share of the tier's over-limit tolerance percentage that enters the tolerance percentage used is nothing for an account opened less than ten whole years before today that carries a returned payment entry dated less than the tier's returned-payment lookback in whole months before today, one half for an account that meets exactly one of those two conditions, and the whole percentage for an account that meets neither."
      pa_commit: "The tolerance percentage used gains five percentage points for a customer whose active Contract Pricing Agreement commits at least two hundred fifty thousand dollars of annual spend"
      tol_points: "The tolerance percentage used gains five percentage points for a customer whose active Contract Pricing Agreement commits at least two hundred fifty thousand dollars of annual spend, two percentage points for one whose active agreement commits at least twenty-five thousand dollars but less than that, and none otherwise."
      tol_used: "Every amount a schedule in this rule adds is added to the receivable balance together with the open backorder value counted, every percentage point a schedule adds is added to the tolerance percentage used, and the tolerance percentage used never exceeds the tier's over-limit tolerance percentage, before the room payment is worked out."
      room_ceiling: "the room ceiling is the credit limit increased by the tolerance percentage used, which is the tier's over-limit tolerance percentage."
      vmi_rec0: "the whole of them when such fees were charged in each of the months less than one whole month, one whole month and two whole months before today"
      vmi_c1: "the whole of them when such fees were charged in each of the months less than one whole month, one whole month and two whole months before today"
      vmi_c2: "the whole of them when such fees were charged in each of the months less than one whole month, one whole month and two whole months before today"
      vmi_c3: "the whole of them when such fees were charged in each of the months less than one whole month, one whole month and two whole months before today"
      vmi_months: "one half of them when such fees were charged in exactly two of those three months"
      vmi_bill: "The StockSmart billing still to post is a share of the recurring program fees, meaning the monthly minimum and onsite management fees, charged across all the customer's StockSmart programs less than one whole month before today: the whole of them when such fees were charged in each of the months less than one whole month, one whole month and two whole months before today, one half of them when such fees were charged in exactly two of those three months, and one quarter of them otherwise."
      vend_usage3: "the usage of the last three whole months divided by three when usage was billed two whole months before today otherwise"
      vend_u0: "the estimate is the larger of the latest month's usage plus its rise over the month before and the largest monthly minimum usage among the customer's active VendPoint machines when usage was billed in each of the months less than one whole month, one whole month and two whole months before today and each of those months' usage exceeds the month before it"
      vend_u1: "the estimate is the larger of the latest month's usage plus its rise over the month before and the largest monthly minimum usage among the customer's active VendPoint machines when usage was billed in each of the months less than one whole month, one whole month and two whole months before today and each of those months' usage exceeds the month before it"
      vend_u2: "the estimate is the larger of the latest month's usage plus its rise over the month before and the largest monthly minimum usage among the customer's active VendPoint machines when usage was billed in each of the months less than one whole month, one whole month and two whole months before today and each of those months' usage exceeds the month before it"
      vend_has2: "the usage of the last three whole months divided by three when usage was billed two whole months before today otherwise"
      vend_floor: "the estimate is the larger of the latest month's usage plus its rise over the month before and the largest monthly minimum usage among the customer's active VendPoint machines"
      vend_cell1: "otherwise it is a usage estimate plus the cellular data fees charged on those machines dated less than one whole month before today"
      vend_bill: "The VendPoint billing still to post is read from the usage billed on all the customer's VendPoint machines and is nothing when no usage was billed on them in the last three whole months; otherwise it is a usage estimate plus the cellular data fees charged on those machines dated less than one whole month before today, where the estimate is the larger of the latest month's usage plus its rise over the month before and the largest monthly minimum usage among the customer's active VendPoint machines when usage was billed in each of the months less than one whole month, one whole month and two whole months before today and each of those months' usage exceeds the month before it, the usage of the last three whole months divided by three when usage was billed two whole months before today otherwise, and the usage of the latest month within the last two whole months that carries usage when usage was billed only within those two months."
      result: "The room payment is the receivable balance plus the open backorder value counted, less the room ceiling, never below zero and rounded to the nearest cent only on that final figure."
    factors:
      - id: tolerance_share_by_tenure_and_returns
        effect: parameter
        decides: tol_share
        bindings: [opened_m, ret_n, tol_share]
        ladder:
          - when: "the account was opened less than ten whole years before today AND it carries a returned payment entry inside the tier's returned-payment lookback"
            value: "none of the tier's over-limit tolerance percentage"
          - when: "exactly one of those two conditions holds (opened less than ten years ago with no returned payment in the lookback, OR opened ten or more years ago with a returned payment in the lookback)"
            value: "one half of the tier's over-limit tolerance percentage (K('half_share'))"
          - when: "otherwise (opened ten or more years ago AND no returned payment in the lookback)"
            value: "the whole tier's over-limit tolerance percentage (K('whole_share'))"
        baseline:
          tol_share: "K('whole_share')"
        evidence: [date, history]
        cross_difficulty: null
      - id: backorder_sales_tax_ratio
        effect: parameter
        decides: tax_ratio
        bindings: [last_inv_date, tax_last_day, merch_last_day, tax12, merch12, tax_ratio]
        ladder:
          - when: "the account is billed monthly consolidated AND it was billed sales tax in the last twelve whole months"
            value: "the sales tax to merchandise ratio of all invoices dated on the latest invoice date"
          - when: "the account is billed per shipment AND it was billed sales tax in the last twelve whole months"
            value: "the sales tax to merchandise ratio over the last twelve whole months"
          - when: "otherwise (no sales tax billed in the last twelve whole months)"
            value: "zero"
        baseline:
          tax_ratio: "0"
        evidence: [history]
        cross_difficulty: null
      - id: stocksmart_month_end_billing
        effect: parameter
        decides: vmi_bill
        bindings: [vmi_rec0, vmi_c1, vmi_c2, vmi_c3, vmi_months, vmi_bill]
        ladder:
          - when: "recurring program fees (monthly minimum or onsite management) charged in each of the months less than one, one and two whole months before today"
            value: "the whole of the recurring fees charged less than one whole month before today"
          - when: "recurring fees charged in exactly two of those three months"
            value: "one half of the recurring fees charged less than one whole month before today (K('half_share'))"
          - when: "otherwise (recurring fees in at most one of those three months)"
            value: "one quarter of the recurring fees charged less than one whole month before today (K('quarter_share'))"
        baseline:
          vmi_bill: "0"
        evidence: [cross_category, history]
        cross_difficulty: vmi
      - id: contract_tolerance_points
        effect: parameter
        decides: tol_points
        bindings: [pa_commit, tol_points]
        ladder:
          - when: "the active Contract Pricing Agreement commits at least two hundred fifty thousand dollars of annual spend"
            value: "five percentage points (K('points_large_commit'))"
          - when: "the active agreement commits at least twenty-five thousand dollars but less than two hundred fifty thousand"
            value: "two percentage points (K('points_mid_commit'))"
          - when: "otherwise"
            value: "no points"
        baseline:
          tol_points: "0"
        evidence: [cross_category]
        cross_difficulty: pricing
      - id: vendpoint_month_end_billing
        effect: method
        decides: vend_bill
        bindings: [vend_usage3, vend_u0, vend_u1, vend_u2, vend_has2, vend_floor, vend_cell1, vend_bill]
        ladder:
          - when: "usage billed in each of the three months AND each month's usage above the month before it (rising)"
            method: "a floored trend projection: the larger of the latest month's usage plus its rise and the largest model monthly minimum usage among the active machines (tariff floor), plus last month's cellular fees"
          - when: "usage billed two whole months before today, not rising"
            method: "a three-month average: the usage of the last three whole months divided by three, plus last month's cellular fees"
          - when: "usage billed only within the last two whole months (new machines)"
            method: "a latest-month selection: the usage of the latest of those two months that carries usage, plus last month's cellular fees"
          - when: "otherwise (no usage billed in the last three whole months)"
            method: "nothing"
        baseline:
          vend_bill: "0"
        evidence: [cross_category, history]
        cross_difficulty: vending
    baseline:
      rule: >-
        The room payment is the receivable balance plus the open backorder value counted, less the room ceiling, never below zero and rounded to the nearest cent only on that final figure.
        The open backorder value counted is the value at booked prices of the backorders on the customer's ship-tos still open, meaning the backordered value less the value filled or cancelled, and the room ceiling is the credit limit increased by the tolerance percentage used, which is the tier's over-limit tolerance percentage.
      params: [over_limit_tolerance_pct]
    inputs:
      history:
        - {table: credit_transactions, aggregate: sum, field: tax_amount, within_months: 12, filters: {event_type: credit_invoice_posted}}
        - {table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_payment_returned}}
        - {category: order, table: order_lines, aggregate: sum, field: extended_amount, filters: {event_type: order_line_backordered}}
        - {category: vending, table: vending_transactions, aggregate: sum, field: extended_amount, within_months: 3, filters: {event_type: vending_usage_billed}}
      cross_category: [order, vmi, pricing, vending]

  - id: credit_ext_permanent_request_figure
    base_policy_refs: [credit_limit_review]
    overwrite: []
    trigger: on_request
    subject: [credit_limit_review_requested]
    computes: requested_limit
    target_tool: submit_limit_request_dcbbb504
    params:
      growth_ratio_pct: 150
      blend_ratio_pct: 120
      months_in_year: 12
      lag_consolidated_days: 60
      lag_paper_days: 40
      lag_standard_days: 30
      haircut_many_charges: 70
      haircut_some_charges: 85
      whole_share: 100
      many_charges: 3
      support_share_net_priced: 25
      support_share_discounted: 12.5
    rule: >-
      A customer asking Corbett for a higher permanent credit limit submits its own permanent limit request, and the limit the request names is the limit the account's purchasing supports, worked out under this rule.
      The supported limit is the monthly purchase base times the terms coverage, rounded to the nearest cent only on that final figure.
      Whole months between a date and today are the difference in calendar months, less one when today's day of the month is earlier than that date's day of the month, with no move of a month-end date to a shorter month's last day.
      The monthly purchase base is the invoice totals posted on the account in the last twelve whole months divided by twelve, and the terms coverage is the tier's net terms days plus thirty days, divided by thirty.
      Every amount a schedule in this rule adds is added to the monthly purchase base, and every percentage a schedule sets multiplies the supported limit, before the figure is rounded.
      The monthly purchase base is measured by how the account buys: for an account billed monthly consolidated whose latest statement, meaning the invoice totals posted on the latest invoice date, is at least one and a half times the twelve-month average month, it is that latest statement; for an account billed monthly consolidated whose latest statement is at least one and one fifth times the twelve-month average month but less than one and a half times it, it is the average of that latest statement and the twelve-month average month; otherwise it is the twelve-month average, and an account with no invoice has a monthly purchase base of nothing.
      The days added to the net terms days in the terms coverage are sixty for an account billed monthly consolidated, forty for an account billed per shipment on paper delivery that was charged paper invoice fees in the last twelve whole months, and thirty otherwise.
      The supported limit is reduced to seventy percent for an account charged three or more late payment finance charges dated less than twelve whole months before today, to eighty-five percent for an account charged one or two such charges, and kept whole for an account charged none.
      Contracted spend adds to the monthly purchase base one quarter of the monthly share of the annual spend committed on an active Corbett Net-Price Contract, Corbett Cost-Plus Contract or Corbett Strategic Supply Agreement, one eighth of that monthly share on an active Corbett Category Contract or Corbett Volume Discount Agreement, and nothing otherwise.
    prerequisite: []
    cross_category:
      - category: pricing
        as: branch
        reads: [variant_name, annual_spend_commitment, status]
        note: The contracted spend added to the monthly purchase base is decided by the tier and committed spend of the customer's active Contract Pricing Agreement.
    compute:
      - last_inv_date: "LATEST('credit_transactions','txn_date', date_field='txn_date', event_type='credit_invoice_posted')"
      - latest_stmt: "SUM('credit_transactions','amount', event_type='credit_invoice_posted', txn_date=last_inv_date)"
      - purch12: "SUM('credit_transactions','amount', within_months=12, date_field='txn_date', event_type='credit_invoice_posted')"
      - avg12: "purch12 / K('months_in_year')"
      - month_base: "latest_stmt if (F('billing_cycle') == 'monthly_consolidated' and latest_stmt >= avg12 * K('growth_ratio_pct') / 100) else ((latest_stmt + avg12) / 2 if (F('billing_cycle') == 'monthly_consolidated' and latest_stmt >= avg12 * K('blend_ratio_pct') / 100) else avg12)"
      - paper_fees12: "COUNT('credit_transactions', within_months=12, date_field='txn_date', event_type='credit_charge_assessed', charge_type='paper_invoice_fee')"
      - lag_days: "K('lag_consolidated_days') if F('billing_cycle') == 'monthly_consolidated' else (K('lag_paper_days') if (F('billing_cycle') == 'per_shipment' and F('invoice_delivery') == 'paper' and paper_fees12 > 0) else K('lag_standard_days'))"
      - coverage: "(P('net_terms_days') + lag_days) / 30"
      - fc12: "COUNT('credit_transactions', within_months=12, date_field='txn_date', event_type='credit_charge_assessed', charge_type='finance_charge')"
      - haircut: "K('haircut_many_charges') if fc12 >= K('many_charges') else (K('haircut_some_charges') if fc12 >= 1 else K('whole_share'))"
      - pa_tier: "CFIELD('pricing','variant_name', status='active')"
      - pa_commit: "CFIELD('pricing','annual_spend_commitment', status='active') or 0"
      - support: "pa_commit / 12 * K('support_share_net_priced') / 100 if (pa_tier == 'Corbett Net-Price Contract' or pa_tier == 'Corbett Cost-Plus Contract' or pa_tier == 'Corbett Strategic Supply Agreement') else (pa_commit / 12 * K('support_share_discounted') / 100 if (pa_tier == 'Corbett Category Contract' or pa_tier == 'Corbett Volume Discount Agreement') else 0)"
      - result: "RND((month_base + support) * coverage * haircut / 100, 2)"
    compute_basis:
      last_inv_date: "for an account billed monthly consolidated whose latest statement, meaning the invoice totals posted on the latest invoice date, is at least one and a half times the twelve-month average month, it is that latest statement"
      latest_stmt: "for an account billed monthly consolidated whose latest statement, meaning the invoice totals posted on the latest invoice date, is at least one and a half times the twelve-month average month, it is that latest statement"
      purch12: "The monthly purchase base is the invoice totals posted on the account in the last twelve whole months divided by twelve"
      avg12: "The monthly purchase base is the invoice totals posted on the account in the last twelve whole months divided by twelve"
      month_base: "The monthly purchase base is measured by how the account buys: for an account billed monthly consolidated whose latest statement, meaning the invoice totals posted on the latest invoice date, is at least one and a half times the twelve-month average month, it is that latest statement; for an account billed monthly consolidated whose latest statement is at least one and one fifth times the twelve-month average month but less than one and a half times it, it is the average of that latest statement and the twelve-month average month; otherwise it is the twelve-month average, and an account with no invoice has a monthly purchase base of nothing."
      paper_fees12: "forty for an account billed per shipment on paper delivery that was charged paper invoice fees in the last twelve whole months"
      lag_days: "The days added to the net terms days in the terms coverage are sixty for an account billed monthly consolidated, forty for an account billed per shipment on paper delivery that was charged paper invoice fees in the last twelve whole months, and thirty otherwise."
      coverage: "the terms coverage is the tier's net terms days plus thirty days, divided by thirty."
      fc12: "The supported limit is reduced to seventy percent for an account charged three or more late payment finance charges dated less than twelve whole months before today"
      haircut: "The supported limit is reduced to seventy percent for an account charged three or more late payment finance charges dated less than twelve whole months before today, to eighty-five percent for an account charged one or two such charges, and kept whole for an account charged none."
      pa_tier: "Contracted spend adds to the monthly purchase base one quarter of the monthly share of the annual spend committed on an active Corbett Net-Price Contract, Corbett Cost-Plus Contract or Corbett Strategic Supply Agreement"
      pa_commit: "Contracted spend adds to the monthly purchase base one quarter of the monthly share of the annual spend committed on an active Corbett Net-Price Contract, Corbett Cost-Plus Contract or Corbett Strategic Supply Agreement"
      support: "Contracted spend adds to the monthly purchase base one quarter of the monthly share of the annual spend committed on an active Corbett Net-Price Contract, Corbett Cost-Plus Contract or Corbett Strategic Supply Agreement, one eighth of that monthly share on an active Corbett Category Contract or Corbett Volume Discount Agreement, and nothing otherwise."
      result: "Every amount a schedule in this rule adds is added to the monthly purchase base, and every percentage a schedule sets multiplies the supported limit, before the figure is rounded."
    factors:
      - id: purchase_base_measure
        effect: method
        decides: month_base
        bindings: [last_inv_date, latest_stmt, month_base]
        ladder:
          - when: "the account is billed monthly consolidated AND its latest statement is at least one and a half times the twelve-month average month"
            method: "the latest statement alone (run rate)"
          - when: "the account is billed monthly consolidated AND its latest statement is at least one and one fifth but less than one and a half times the twelve-month average month"
            method: "a blend: the average of the latest statement and the twelve-month average month"
          - when: "otherwise"
            method: "the twelve-month average month (invoice totals of the last twelve whole months divided by twelve)"
        baseline:
          month_base: "avg12"
        evidence: [history]
        cross_difficulty: null
      - id: billing_lag_days
        effect: parameter
        decides: lag_days
        bindings: [paper_fees12, lag_days]
        ladder:
          - when: "the account is billed monthly consolidated"
            value: "sixty days (K('lag_consolidated_days'))"
          - when: "the account is billed per shipment on paper delivery AND was charged paper invoice fees in the last twelve whole months"
            value: "forty days (K('lag_paper_days'))"
          - when: "otherwise"
            value: "thirty days (K('lag_standard_days'))"
        baseline:
          lag_days: "K('lag_standard_days')"
        evidence: [history]
        cross_difficulty: null
      - id: finance_charge_haircut
        effect: parameter
        decides: haircut
        bindings: [fc12, haircut]
        ladder:
          - when: "three or more late payment finance charges dated less than twelve whole months before today"
            value: "seventy percent (K('haircut_many_charges'))"
          - when: "one or two such charges"
            value: "eighty-five percent (K('haircut_some_charges'))"
          - when: "otherwise (none)"
            value: "the whole figure (K('whole_share'))"
        baseline:
          haircut: "K('whole_share')"
        evidence: [history]
        cross_difficulty: null
      - id: contracted_spend_support
        effect: parameter
        decides: support
        bindings: [pa_tier, pa_commit, support]
        ladder:
          - when: "an active Corbett Net-Price Contract, Cost-Plus Contract or Strategic Supply Agreement"
            value: "one quarter of the monthly share of its committed annual spend (K('support_share_net_priced'))"
          - when: "an active Corbett Category Contract or Volume Discount Agreement"
            value: "one eighth of the monthly share of its committed annual spend (K('support_share_discounted'))"
          - when: "otherwise"
            value: "nothing"
        baseline:
          support: "0"
        evidence: [cross_category]
        cross_difficulty: pricing
    baseline:
      rule: >-
        The supported limit is the monthly purchase base times the terms coverage, rounded to the nearest cent only on that final figure.
        The monthly purchase base is the invoice totals posted on the account in the last twelve whole months divided by twelve, and the terms coverage is the tier's net terms days plus thirty days, divided by thirty.
      params: [net_terms_days, months_in_year, lag_standard_days]
    inputs:
      history:
        - {table: credit_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: credit_invoice_posted}}
        - {table: credit_transactions, aggregate: latest, field: amount, filters: {event_type: credit_invoice_posted}}
        - {table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_charge_assessed, charge_type: finance_charge}}
      cross_category: [pricing]

  - id: credit_ext_permanent_increase_grant
    base_policy_refs: [credit_limit_review]
    overwrite:
      - base_policy: credit_limit_review
        superseded_clause: >-
          A permanent increase is approved when credit_msr_on_time_pct_12m is at least limit_increase_min_on_time_pct; the approved limit is the requested limit capped at the current limit increased by limit_increase_max_step_pct percent and at the tier's credit_limit_ceiling_usd, decided approved when nothing is capped and approved_reduced when a cap applies.
        replaced_by: >-
          A permanent increase is approved when the account's trailing twelve-month on-time payment percentage is at least the tier's minimum for limit increases, and the granted limit is the requested limit capped at the step room and at the tier's credit limit ceiling, decided as approved when nothing is capped and as approved at a reduced limit when a cap applies; the step room replaces the tier's flat step percentage for every permanent request.
    trigger: on_request
    subject: [credit_limit_review_decided, credit_limit_changed]
    computes: approved_limit
    target_tool: decide_limit_request_85fdd39c
    params:
      step_both_marks_share: 50
      step_one_mark_share: 75
      review_points_long: 10
      review_points_mid: 5
      dispute_deduction_many: 10
      dispute_deduction_one: 5
      tenure_points_long: 5
      tenure_points_mid: 2
      months_two_years: 24
      months_one_year: 12
      months_fifteen_years: 180
      months_seven_years: 84
      vend_full_usage: 3000
      allowance_months: 3
      vending_half_share: 50
      vend_half_usage: 500
      vending_quarter_share: 25
    rule: >-
      A permanent increase is not decided until the account carries a permanent limit request with no decision recorded on it.
      The request decided is the permanent limit request with the latest request date on the account; when that request already carries a decision line, or when more than one permanent request carries that latest request date, nothing is decided under this rule and no limit is granted.
      A permanent increase is approved when the account's trailing twelve-month on-time payment percentage is at least the tier's minimum for limit increases, and the granted limit is the requested limit capped at the step room and at the tier's credit limit ceiling, decided as approved when nothing is capped and as approved at a reduced limit when a cap applies; the step room replaces the tier's flat step percentage for every permanent request.
      The step room is the current credit limit increased by the step percentage used, rounded to the nearest cent, and the step percentage used is the tier's largest permanent step percentage.
      Every percentage point a schedule in this rule adds to or takes from the step percentage used is applied to it before the current credit limit is increased, and every amount a schedule adds is added to the step room once it is rounded.
      The step percentage used starts from one half of the tier's largest permanent step percentage for an account that carries a returned payment entry dated less than the tier's returned-payment lookback in whole months before today and a limit request decided declined or referred to committee less than twenty-four whole months before today, from three quarters of it for an account that carries exactly one of those two marks, and from the whole of it for an account that carries neither.
      The step percentage used gains ten percentage points when the account's last credit review date is twenty-four or more whole months before today, five points when it is twelve to twenty-three whole months before today, and none otherwise.
      The step percentage used loses ten percentage points for an account with two or more disputes resolved denied less than twelve whole months before today, five points for an account with exactly one, and none otherwise.
      The step percentage used gains five percentage points for an account opened one hundred eighty or more whole months before today, two points for one opened eighty-four to one hundred seventy-nine whole months before today, and none otherwise.
      A StockSmart program allowance is added to the step room from the customer's StockSmart programs: when a program fee is dated two whole months before today, the allowance is the program fees billed across those programs in the last three whole months; when none is dated that far back but program fees were billed less than two whole months before today, it is the fees billed in that time plus one month's minimum commitment, the largest monthly minimum fee among the customer's active StockSmart programs; and when no program fee was billed in the last three whole months, it is the minimum commitment for those three months, three times that largest monthly minimum fee, which is nothing when the customer has no active StockSmart program.
      When the increase granted, the granted limit less the current credit limit, exceeds the tier's desk approval amount, the request is decided referred to committee, the granted figure is nothing and the limit is unchanged.
      Whole months between a date and today are the difference in calendar months, less one when today's day of the month is earlier than that date's day of the month, with no move of a month-end date to a shorter month's last day.
      A VendPoint allowance is added to the step room from the usage billed across all the customer's VendPoint machines less than one whole month before today: the whole of that usage when it is at least three thousand dollars, one half of it when it is at least five hundred dollars but less than three thousand, and one quarter of it when it is less than five hundred dollars.
    prerequisite:
      - problem: credit_ext_permanent_request_figure
        kind: value_input
        gate: req
        form: state
        policy_source: >-
          A permanent increase is not decided until the account carries a permanent limit request with no decision recorded on it.
        condition: >-
          The account's credit_limit_reviews carry a credit_limit_review_requested entry with change_type permanent whose review_reference has no credit_limit_review_decided entry.
        resolved_by: submit_limit_request_dcbbb504
        effect: >-
          The pending permanent request supplies the requested limit the granted limit is capped against and decides whether the decision is approved in full or at a reduced limit.
    cross_category:
      - category: vmi
        as: history
        reads: [vmi_activity.extended_amount, vmi_activity.event_type, vmi_activity.event_date, vmi_programs.status, vmi_programs.variant_name]
        note: The StockSmart program allowance is read from the program fees billed across all the customer's programs and how far back they reach, and from the monthly minimum fee of the active programs' tiers.
      - category: vending
        as: history
        reads: [vending_transactions.extended_amount, vending_transactions.event_type]
        note: The VendPoint allowance is decided by the usage billed across all the customer's machines in the last whole month.
    compute:
      - req_date: "LATEST('credit_limit_reviews','request_date', date_field='request_date', event_type='credit_limit_review_requested', change_type='permanent')"
      - req_ties: "COUNT('credit_limit_reviews', event_type='credit_limit_review_requested', change_type='permanent', request_date=req_date)"
      - req_ref: "LATEST('credit_limit_reviews','review_reference', date_field='request_date', event_type='credit_limit_review_requested', change_type='permanent')"
      - req_decided: "COUNT('credit_limit_reviews', event_type='credit_limit_review_decided', review_reference=req_ref)"
      - req: "(LATEST('credit_limit_reviews','requested_limit', date_field='request_date', event_type='credit_limit_review_requested', change_type='permanent') or 0) if (req_decided == 0 and req_ties <= 1) else 0"
      - ret12: "COUNT('credit_transactions', within_months=P('returned_payment_lookback_months'), date_field='txn_date', event_type='credit_payment_returned')"
      - dec24: "COUNT('credit_limit_reviews', within_months=K('months_two_years'), date_field='request_date', event_type='credit_limit_review_decided', decision='declined') + COUNT('credit_limit_reviews', within_months=K('months_two_years'), date_field='request_date', event_type='credit_limit_review_decided', decision='referred_to_committee')"
      - step_start: "P('limit_increase_max_step_pct') * K('step_both_marks_share') / 100 if (ret12 > 0 and dec24 > 0) else (P('limit_increase_max_step_pct') * K('step_one_mark_share') / 100 if ((ret12 > 0 and dec24 == 0) or (ret12 == 0 and dec24 > 0)) else P('limit_increase_max_step_pct'))"
      - rev_m: "MONTHS(F('last_review_date'), NOW)"
      - review_pts: "K('review_points_long') if rev_m >= K('months_two_years') else (K('review_points_mid') if rev_m >= K('months_one_year') else 0)"
      - denied12: "COUNT('credit_disputes', within_months=K('months_one_year'), date_field='event_date', event_type='credit_dispute_resolved', resolution='denied')"
      - dispute_ded: "K('dispute_deduction_many') if denied12 >= 2 else (K('dispute_deduction_one') if denied12 == 1 else 0)"
      - open_m: "MONTHS(F('opened_date'), NOW)"
      - tenure_pts: "K('tenure_points_long') if open_m >= K('months_fifteen_years') else (K('tenure_points_mid') if open_m >= K('months_seven_years') else 0)"
      - step_used: "step_start + review_pts - dispute_ded + tenure_pts"
      - vmi_fee3: "XSUM('vmi','vmi_activity','extended_amount', within_months=K('allowance_months'), date_field='event_date', event_type='vmi_program_fee_charged')"
      - vmi_m2: "XCOUNT('vmi','vmi_activity', within_months=K('allowance_months'), date_field='event_date', event_type='vmi_program_fee_charged') - XCOUNT('vmi','vmi_activity', within_months=2, date_field='event_date', event_type='vmi_program_fee_charged')"
      - vmi_fee2: "XSUM('vmi','vmi_activity','extended_amount', within_months=2, date_field='event_date', event_type='vmi_program_fee_charged')"
      - vmi_n2: "XCOUNT('vmi','vmi_activity', within_months=2, date_field='event_date', event_type='vmi_program_fee_charged')"
      - vmi_minfee: "MX((CPARAM('vmi','monthly_minimum_fee_usd', status='active', variant_name='StockSmart Self-Scan') or 0), (CPARAM('vmi','monthly_minimum_fee_usd', status='active', variant_name='StockSmart Monthly Service') or 0), (CPARAM('vmi','monthly_minimum_fee_usd', status='active', variant_name='StockSmart Biweekly Service') or 0), (CPARAM('vmi','monthly_minimum_fee_usd', status='active', variant_name='StockSmart Weekly Service') or 0), (CPARAM('vmi','monthly_minimum_fee_usd', status='active', variant_name='StockSmart Twice-Weekly Service') or 0), (CPARAM('vmi','monthly_minimum_fee_usd', status='active', variant_name='StockSmart Onsite Storeroom') or 0))"
      - vmi_allow: "vmi_fee3 if vmi_m2 > 0 else (vmi_fee2 + vmi_minfee if vmi_n2 > 0 else K('allowance_months') * vmi_minfee)"
      - vend_use1: "XSUM('vending','vending_transactions','extended_amount', within_months=1, date_field='event_date', event_type='vending_usage_billed')"
      - vend_allow: "vend_use1 if vend_use1 >= K('vend_full_usage') else (vend_use1 * K('vending_half_share') / 100 if vend_use1 >= K('vend_half_usage') else vend_use1 * K('vending_quarter_share') / 100)"
      - step_room: "RND(F('credit_limit') * (1 + step_used / 100), 2) + vmi_allow + vend_allow"
      - granted: "MN(req, step_room, P('credit_limit_ceiling_usd'))"
      - result: "0 if (granted - F('credit_limit')) > P('limit_increase_desk_approval_usd') else granted"
    compute_basis:
      req_ref: "The request decided is the permanent limit request with the latest request date on the account; when that request already carries a decision line, or when more than one permanent request carries that latest request date, nothing is decided under this rule and no limit is granted."
      req_decided: "The request decided is the permanent limit request with the latest request date on the account; when that request already carries a decision line, or when more than one permanent request carries that latest request date, nothing is decided under this rule and no limit is granted."
      req: "The request decided is the permanent limit request with the latest request date on the account; when that request already carries a decision line, or when more than one permanent request carries that latest request date, nothing is decided under this rule and no limit is granted."
      ret12: "The step percentage used starts from one half of the tier's largest permanent step percentage for an account that carries a returned payment entry dated less than the tier's returned-payment lookback in whole months before today and a limit request decided declined or referred to committee less than twenty-four whole months before today"
      dec24: "The step percentage used starts from one half of the tier's largest permanent step percentage for an account that carries a returned payment entry dated less than the tier's returned-payment lookback in whole months before today and a limit request decided declined or referred to committee less than twenty-four whole months before today"
      step_start: "The step percentage used starts from one half of the tier's largest permanent step percentage for an account that carries a returned payment entry dated less than the tier's returned-payment lookback in whole months before today and a limit request decided declined or referred to committee less than twenty-four whole months before today, from three quarters of it for an account that carries exactly one of those two marks, and from the whole of it for an account that carries neither."
      rev_m: "The step percentage used gains ten percentage points when the account's last credit review date is twenty-four or more whole months before today"
      review_pts: "The step percentage used gains ten percentage points when the account's last credit review date is twenty-four or more whole months before today, five points when it is twelve to twenty-three whole months before today, and none otherwise."
      denied12: "The step percentage used loses ten percentage points for an account with two or more disputes resolved denied less than twelve whole months before today"
      dispute_ded: "The step percentage used loses ten percentage points for an account with two or more disputes resolved denied less than twelve whole months before today, five points for an account with exactly one, and none otherwise."
      open_m: "The step percentage used gains five percentage points for an account opened one hundred eighty or more whole months before today"
      tenure_pts: "The step percentage used gains five percentage points for an account opened one hundred eighty or more whole months before today, two points for one opened eighty-four to one hundred seventy-nine whole months before today, and none otherwise."
      step_used: "Every percentage point a schedule in this rule adds to or takes from the step percentage used is applied to it before the current credit limit is increased, and every amount a schedule adds is added to the step room once it is rounded."
      vmi_fee3: "when a program fee is dated two whole months before today, the allowance is the program fees billed across those programs in the last three whole months"
      vmi_m2: "when a program fee is dated two whole months before today, the allowance is the program fees billed across those programs in the last three whole months"
      vmi_fee2: "when none is dated that far back but program fees were billed less than two whole months before today, it is the fees billed in that time plus one month's minimum commitment, the largest monthly minimum fee among the customer's active StockSmart programs"
      vmi_n2: "when none is dated that far back but program fees were billed less than two whole months before today, it is the fees billed in that time plus one month's minimum commitment, the largest monthly minimum fee among the customer's active StockSmart programs"
      vmi_minfee: "when none is dated that far back but program fees were billed less than two whole months before today, it is the fees billed in that time plus one month's minimum commitment, the largest monthly minimum fee among the customer's active StockSmart programs"
      vmi_allow: "A StockSmart program allowance is added to the step room from the customer's StockSmart programs: when a program fee is dated two whole months before today, the allowance is the program fees billed across those programs in the last three whole months; when none is dated that far back but program fees were billed less than two whole months before today, it is the fees billed in that time plus one month's minimum commitment, the largest monthly minimum fee among the customer's active StockSmart programs; and when no program fee was billed in the last three whole months, it is the minimum commitment for those three months, three times that largest monthly minimum fee, which is nothing when the customer has no active StockSmart program."
      vend_use1: "A VendPoint allowance is added to the step room from the usage billed across all the customer's VendPoint machines less than one whole month before today"
      vend_allow: "A VendPoint allowance is added to the step room from the usage billed across all the customer's VendPoint machines less than one whole month before today: the whole of that usage when it is at least three thousand dollars, one half of it when it is at least five hundred dollars but less than three thousand, and one quarter of it when it is less than five hundred dollars."
      step_room: "The step room is the current credit limit increased by the step percentage used, rounded to the nearest cent, and the step percentage used is the tier's largest permanent step percentage."
      req_date: "The request decided is the permanent limit request with the latest request date on the account"
      req_ties: "or when more than one permanent request carries that latest request date, nothing is decided under this rule and no limit is granted."
      granted: "the granted limit is the requested limit capped at the step room and at the tier's credit limit ceiling"
      result: "When the increase granted, the granted limit less the current credit limit, exceeds the tier's desk approval amount, the request is decided referred to committee, the granted figure is nothing and the limit is unchanged."
    factors:
      - id: step_start_by_payment_and_review_marks
        effect: parameter
        decides: step_start
        bindings: [ret12, dec24, step_start]
        ladder:
          - when: "a returned payment entry inside the lookback AND a limit request decided declined or referred less than twenty-four whole months ago"
            value: "one half of the tier's largest permanent step percentage (K('step_both_marks_share'))"
          - when: "exactly one of those two marks (returned payment without such a decision, OR such a decision without a returned payment)"
            value: "three quarters of the tier's largest permanent step percentage (K('step_one_mark_share'))"
          - when: "otherwise (neither mark)"
            value: "the tier's largest permanent step percentage"
        baseline:
          step_start: "P('limit_increase_max_step_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: review_age_points
        effect: parameter
        decides: review_pts
        bindings: [rev_m, review_pts]
        ladder:
          - when: "last credit review twenty-four or more whole months before today"
            value: "plus ten points"
          - when: "last credit review twelve to twenty-three whole months before today"
            value: "plus five points"
          - when: "otherwise"
            value: "no points"
        baseline:
          review_pts: "0"
        evidence: [date]
        cross_difficulty: null
      - id: denied_dispute_deduction
        effect: parameter
        decides: dispute_ded
        bindings: [denied12, dispute_ded]
        ladder:
          - when: "two or more disputes resolved denied less than twelve whole months before today"
            value: "minus ten points"
          - when: "exactly one such dispute"
            value: "minus five points"
          - when: "otherwise"
            value: "no deduction"
        baseline:
          dispute_ded: "0"
        evidence: [history]
        cross_difficulty: null
      - id: account_age_points
        effect: parameter
        decides: tenure_pts
        bindings: [open_m, tenure_pts]
        ladder:
          - when: "account opened one hundred eighty or more whole months before today"
            value: "plus five points"
          - when: "account opened eighty-four to one hundred seventy-nine whole months before today"
            value: "plus two points"
          - when: "otherwise"
            value: "no points"
        baseline:
          tenure_pts: "0"
        evidence: [date]
        cross_difficulty: null
      - id: stocksmart_program_allowance
        effect: method
        decides: vmi_allow
        bindings: [vmi_fee3, vmi_m2, vmi_fee2, vmi_n2, vmi_minfee, vmi_allow]
        ladder:
          - when: "a program fee on the customer's StockSmart programs is dated two whole months before today (established billing)"
            method: "billed-fee sum: the program fees billed in the last three whole months"
          - when: "none dated that far back AND program fees billed less than two whole months before today (new billing)"
            method: "billed-to-date plus forward commitment: the fees billed in the last two whole months plus one largest active monthly minimum fee"
          - when: "otherwise (no program fee billed in the last three whole months)"
            method: "commitment projection: three times the largest monthly minimum fee among the active programs (no active program: nothing)"
        baseline:
          vmi_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: vmi
      - id: vendpoint_model_allowance
        effect: parameter
        decides: vend_allow
        bindings: [vend_use1, vend_allow]
        ladder:
          - when: "usage billed across the customer's VendPoint machines less than one whole month before today is at least three thousand dollars"
            value: "the whole of that usage (K('vend_full_usage') threshold)"
          - when: "usage billed in that month at least five hundred dollars but under three thousand dollars"
            value: "one half of that usage (K('vending_half_share'))"
          - when: "otherwise (usage billed in that month under five hundred dollars)"
            value: "one quarter of that usage (K('vending_quarter_share'))"
        baseline:
          vend_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: vending
    baseline:
      rule: >-
        A permanent increase is approved when the account's trailing twelve-month on-time payment percentage is at least the tier's minimum for limit increases, and the granted limit is the requested limit capped at the step room and at the tier's credit limit ceiling, decided as approved when nothing is capped and as approved at a reduced limit when a cap applies; the step room replaces the tier's flat step percentage for every permanent request.
        The step room is the current credit limit increased by the step percentage used, rounded to the nearest cent, and the step percentage used is the tier's largest permanent step percentage.
      params: [limit_increase_max_step_pct, credit_limit_ceiling_usd]
    inputs:
      history:
        - {table: credit_limit_reviews, aggregate: latest, field: requested_limit, filters: {event_type: credit_limit_review_requested, change_type: permanent}}
        - {table: credit_limit_reviews, aggregate: count, field: credit_review_id, within_months: 24, filters: {event_type: credit_limit_review_decided, decision: declined}}
        - {table: credit_disputes, aggregate: count, field: credit_dispute_id, within_months: 12, filters: {event_type: credit_dispute_resolved, resolution: denied}}
        - {category: vmi, table: vmi_activity, aggregate: sum, field: extended_amount, within_months: 3, filters: {event_type: vmi_program_fee_charged}}
      cross_category: [vmi, vending]
