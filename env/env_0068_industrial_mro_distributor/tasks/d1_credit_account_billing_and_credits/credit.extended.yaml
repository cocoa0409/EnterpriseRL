# Policy charter: Commercial Credit Account (trade credit, net terms invoicing, payments, credits and collections).
category: credit
display_name: Commercial Credit Account

binding:
  holding_table: credit_accounts
  event_tables: [credit_transactions, credit_disputes, credit_limit_reviews]
  status_field: status
  variant_field: variant_name
  quantity_fields: {ar_balance: receivable}

lifecycle:
  states: [applied, active, on_hold, in_collections, declined, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "Corbett Credit Department approves the credit application, assigns the terms tier and opening credit limit, and the account opens for charging."}
    - {from: applied, to: declined, by: system, means: "Corbett Credit Department declines the credit application; the customer may continue to buy on credit card or prepayment only."}
    - {from: active, to: on_hold, by: system, means: "The account is placed on credit hold (past due, returned payments or over limit); new shipments on terms stop."}
    - {from: on_hold, to: active, by: agent, means: "The hold condition has been cured and the agent releases the credit hold."}
    - {from: on_hold, to: in_collections, by: system, means: "The past-due balance reaches the collections referral threshold and the account is referred to Corbett Collections."}
    - {from: in_collections, to: active, by: agent, means: "The referred balance is paid in full and the account is reinstated to open terms."}
    - {from: active, to: closed, by: user, means: "The customer closes the credit account at its own request once nothing is owed."}
    - {from: active, to: closed, by: system, means: "A dormant account with no invoice activity for the tier's dormancy period is closed automatically."}
    - {from: in_collections, to: closed, by: system, means: "An account whose referred balance is written off by Collections is closed permanently."}

accounts:
  - key: receivable
    unit: USD
    meaning: "The customer's open accounts-receivable balance on this credit account: posted invoices and charges increase it; payments, cash discounts, credit memos and write-offs decrease it; a negative value is a credit balance owed to the customer."

# ---- category-level parameter dictionary ----
parameter_schema:
  net_terms_days: "Days after the invoice date (statement date for consolidated billing) on which the invoice falls due; integer calendar days"
  cash_discount_pct: "Prompt-payment cash discount, percent of the invoice merchandise subtotal (never freight or sales tax); 0 means no discount offered"
  cash_discount_days: "Calendar days after the invoice date within which payment earns the cash discount; 0 means no discount window"
  cash_discount_partial_payment: "Whether a partial payment made inside the discount window earns the cash discount pro rata on the merchandise portion it pays (false means only payment of the full invoice balance earns it)"
  cash_discount_excluded_pricing_tiers: "List of Contract Pricing Agreement tier names whose net-priced invoices never earn the cash discount (prices are already net)"
  credit_limit_floor_usd: "Lowest permanent credit limit the tier can carry, USD"
  credit_limit_ceiling_usd: "Highest permanent credit limit the tier can carry, USD; a higher limit requires a tier change"
  over_limit_tolerance_pct: "Percent above the credit limit that open receivable may reach before the account is treated as over limit"
  temporary_limit_increase_max_pct: "Largest temporary credit limit increase (plant shutdown, turnaround or seasonal build), percent of the permanent limit; 0 means not offered"
  temporary_limit_increase_max_days: "Longest duration of a temporary limit increase in calendar days from the decision date; 0 means not offered"
  limit_increase_max_step_pct: "Largest permanent limit increase granted in one review, percent of the current permanent limit"
  limit_increase_min_months_since_review: "Minimum whole calendar months since the account's last credit review before a new limit increase request is decided"
  limit_increase_min_on_time_pct: "Minimum trailing-12-month on-time payment percentage required to approve a permanent limit increase"
  limit_increase_desk_approval_usd: "Largest increase amount (new limit minus current limit) the credit desk approves without a credit committee referral, USD"
  limit_review_decision_business_days: "Business days within which a limit review request is decided"
  credit_review_cycle_months: "Months between scheduled periodic credit reviews of the account"
  hold_trigger_days_past_due: "Days past the due date of the oldest open undisputed invoice at which a credit hold is placed"
  hold_trigger_min_past_due_usd: "Minimum undisputed past-due balance, USD, below which no past-due credit hold is placed"
  hold_release_full_past_due_required: "true = a past-due hold is released only when the whole past-due balance is paid; false = released once the remaining past-due balance is below hold_trigger_min_past_due_usd"
  disputed_amount_excluded_from_hold: "true = amounts under an open dispute are excluded from the past-due balance used for hold and finance charge decisions"
  returned_payments_hold_count: "Number of returned payments within the lookback window that places the account on hold"
  returned_payment_lookback_months: "Rolling lookback, in months ending on the current date, over which returned payments are counted"
  returned_payment_fee_usd: "Fee charged per returned (NSF, closed account or stopped) payment, USD"
  certified_funds_months_after_return: "Months after a returned payment during which payments are accepted only by ACH debit, wire or card (no checks)"
  collections_referral_days_past_due: "Days past due of the oldest open undisputed invoice at which an on-hold account is referred to Collections"
  collections_referral_min_usd: "Minimum undisputed past-due balance, USD, for a collections referral"
  finance_charge_monthly_pct: "Late payment finance charge, percent per month of the eligible past-due balance"
  finance_charge_grace_days: "Days past the due date before an invoice balance becomes eligible for the finance charge"
  finance_charge_min_usd: "Minimum finance charge when a charge applies, USD; 0.00 means the computed amount stands"
  finance_charge_waiver_balance_usd: "Eligible past-due balance, USD, below which no finance charge is assessed for the month"
  finance_charge_compounding: "Whether unpaid finance charges themselves accrue finance charges (false for every tier)"
  finance_charge_courtesy_waivers_per_year: "Number of finance charges the desk may reverse as a courtesy within a rolling 12 months"
  card_payment_max_usd: "Largest single payment accepted by commercial card, USD"
  card_surcharge_pct: "Card convenience fee, percent of the card payment amount"
  payment_application_order: "How a payment received without remittance detail is applied across open invoices"
  unapplied_cash_hold_business_days: "Business days a payment without remittance detail is held unapplied awaiting remittance before the default application order is used"
  dispute_filing_window_days: "Calendar days after the invoice date within which an invoice dispute is accepted"
  dispute_desk_credit_authority_usd: "Largest disputed amount, USD, the support desk may resolve by credit memo without Credit Department review"
  dispute_resolution_business_days: "Business days within which an opened dispute is resolved"
  credit_balance_refund_min_usd: "Smallest credit balance, USD, refunded on request; smaller balances stay on account"
  credit_balance_refund_method: "Method used to refund a credit balance"
  small_balance_writeoff_max_usd: "Largest residual invoice balance, USD, written off as a small balance"
  small_balance_writeoff_min_age_days: "Days past the invoice due date before a residual balance may be written off"
  paper_invoice_fee_usd: "Fee per invoice mailed on paper when the account elects paper delivery, USD"
  consolidated_billing_available: "Whether the account may elect monthly consolidated invoicing (one invoice per calendar month)"
  edi_invoicing_available: "Whether the account may receive invoices by EDI 810"
  dormancy_close_months: "Whole months without any posted invoice after which an active account with zero balance is closed as dormant"
  application_decision_business_days: "Business days within which a credit application for this tier is decided"
  trade_references_required: "Number of supplier trade references required with the application"

