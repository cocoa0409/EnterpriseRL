    factors:
      - id: returns_reserve_holdback
        effect: parameter
        decides: reserve_hold
        bindings: [n_ret, v_ret, reserve_hold]
        ladder:
          - when: "reserve_high_count or more return receipt lines in the reserve window and reserve_high_value or more of return credit on them"
            value: "K('reserve_high_pct')"
          - when: "at least one such line and at least reserve_low_value of return credit, without both higher thresholds"
            value: "K('reserve_low_pct')"
          - when: "otherwise"
            value: "0"
