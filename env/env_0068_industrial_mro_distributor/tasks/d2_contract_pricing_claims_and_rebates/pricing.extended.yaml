        decides: terms_hold
        bindings: [fc_count, terms_hold]
        ladder:
          - when: "terms_high_count or more late payment finance charges in the window"
            value: "K('terms_high_pct')"
          - when: "at least one and fewer than terms_high_count such charges"
            value: "K('terms_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          terms_hold: "0"
        evidence: [history, cross_category]
        cross_difficulty: credit
      - id: unexpired_term_administration
        effect: method
        decides: admin_hold
        bindings: [months_left, admin_hold]
        ladder:
