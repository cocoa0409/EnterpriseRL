        note: Merchandise invoiced in the window against the commitment decides the commitment reduction.
    compute:
      - disc_item: "XLATEST('order', 'order_lines', 'sku', event_type='order_line_backordered')"
      - clm: "LATEST('pricing_claims', 'claim_reference', event_type='pricing_claim_filed', sku=disc_item)"
      - clm_decided: "COUNT('pricing_claims', event_type='pricing_claim_decided', claim_reference=clm)"
      - clm_sku: "LATEST('pricing_claims', 'sku', event_type='pricing_claim_filed', claim_reference=clm)"
      - item_lines: "COUNT('pricing_items', sku=clm_sku)"
      - esc_reason: "LATEST('pricing_items', 'change_reason', date_field='effective_date', sku=clm_sku)"
      - esc_eff: "LATEST('pricing_items', 'effective_date', date_field='effective_date', sku=clm_sku)"
      - esc_prior: "LATEST('pricing_items', 'prior_unit_price', date_field='effective_date', sku=clm_sku) or 0"
      - last_ship: "XLATEST('order', 'order_lines', 'event_date', event_type='order_line_shipped', sku=clm_sku)"
      - new_item_lines: "COUNT('pricing_items', sku=clm_sku, change_reason='new_item')"
      - in_scope: "1 if (clm and clm_decided == 0 and esc_reason == 'annual_escalation' and item_lines == 2 and new_item_lines == 1 and esc_eff and last_ship and DAYS(esc_eff, last_ship) >= 0) else 0"
      - esc_cost: "LATEST('pricing_items', 'supplier_cost', date_field='effective_date', sku=clm_sku) or 0"
      - add_cost: "LATEST('pricing_items', 'supplier_cost', date_field='effective_date', sku=clm_sku, change_reason='new_item') or 0"
      - cost_pct: "(esc_cost / add_cost - 1) * 100 if add_cost > 0 else 0"
      - esc_list: "LATEST('pricing_items', 'list_price', date_field='effective_date', sku=clm_sku) or 0"
      - add_list: "LATEST('pricing_items', 'list_price', date_field='effective_date', sku=clm_sku, change_reason='new_item') or 0"
      - list_pct: "(esc_list / add_list - 1) * 100 if add_list > 0 else 0"
      - increase: "list_pct if (list_pct > 0 and list_pct < cost_pct) else (0 if (list_pct <= 0 and cost_pct > 0) else cost_pct)"
      - vol_units: "XSUM('order', 'order_lines', 'quantity', within_months=K('volume_window_months'), event_type='order_line_shipped', sku=clm_sku)"
      - vol_red: "K('volume_high_points') if vol_units >= K('volume_high_units') else (K('volume_mid_points') if vol_units >= K('volume_mid_units') else 0)"
      - inv_merch: "XSUM('credit', 'credit_transactions', 'merchandise_amount', within_months=K('commit_window_months'), date_field='txn_date', event_type='credit_invoice_posted')"
      - commit_ratio: "inv_merch / F('annual_spend_commitment') if (F('annual_spend_commitment') or 0) > 0 else 0"
      - commit_red: "K('commit_high_points') if commit_ratio >= K('commit_high_ratio') else (K('commit_mid_points') if commit_ratio >= 1 else 0)"
      - esc_notice: "LATEST('pricing_items', 'notice_date', date_field='effective_date', sku=clm_sku)"
      - extra_notice_days: "DAYS(esc_notice, esc_eff) - P('escalation_notice_days') if (esc_notice and esc_eff) else 0"
      - notice_red: "K('notice_tight_points') if extra_notice_days <= K('notice_tight_days') else (K('notice_mid_points') if extra_notice_days < K('notice_ample_days') else 0)"
      - items_carried: "COUNT('pricing_items', event_type='pricing_item_added') - COUNT('pricing_items', event_type='pricing_item_removed')"
      - breadth_red: "K('breadth_high_points') if items_carried >= K('breadth_high_items') else (K('breadth_mid_points') if items_carried >= K('breadth_mid_items') else 0)"
      - esc_count: "COUNT('pricing_items', within_months=K('load_window_months'), date_field='effective_date', event_type='pricing_item_repriced', change_reason='annual_escalation')"
      - load_red: "K('load_high_points') if esc_count >= K('load_high_count') else (K('load_mid_points') if esc_count >= 1 else 0)"
      - allowance: "MX(0, MN(increase, P('annual_escalation_cap_pct')) - (vol_red + commit_red + notice_red + breadth_red + load_red))"
      - result: "RND(in_scope * esc_prior * (1 + allowance / 100), 4)"
