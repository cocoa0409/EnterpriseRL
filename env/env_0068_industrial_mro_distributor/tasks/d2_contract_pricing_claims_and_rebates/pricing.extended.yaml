  - id: pricing_ext_open_claim_decision
    base_policy_refs: [pricing_evt_price_claim, pricing_evt_escalation, pricing_price_basis]
    overwrite:
      - base_policy: pricing_price_basis
        superseded_clause: >-
          The price of a billed line is the price in effect on the line's ship date under price_change_effective_basis, chosen in this order: first, the item's contract unit price from the latest pricing_items line for that sku effective on or before the ship date, unless that latest line is a removal; otherwise, on a cost-plus tier, Corbett's supplier cost on the ship date increased by cost_plus_markup_pct percent with at least cost_plus_min_markup_per_unit_usd markup per unit; otherwise, for a non-stock special-order item, supplier cost increased by special_order_markup_pct percent; otherwise, list price less the item category's discount from category_discount_schedule, or less list_discount_pct when the category is not in the schedule.
        replaced_by: >-
          For the claimed line of an escalation this policy reviews on a pending claim, and only for such a line, the price the agreement sets is the reviewed escalated price this rule works out; the price of every other billed line is still the price in effect on the line's ship date under price_change_effective_basis, chosen in this order: first, the item's contract unit price from the latest pricing_items line for that sku effective on or before the ship date, unless that latest line is a removal; otherwise, on a cost-plus tier, Corbett's supplier cost on the ship date increased by cost_plus_markup_pct percent with at least cost_plus_min_markup_per_unit_usd markup per unit; otherwise, for a non-stock special-order item, supplier cost increased by special_order_markup_pct percent; otherwise, list price less the item category's discount from category_discount_schedule, or less list_discount_pct when the category is not in the schedule.
      - base_policy: pricing_evt_escalation
        superseded_clause: >-
          An escalation raises a contract unit price by the percentage increase in Corbett's supplier cost for that item since the item's previous price line, capped at annual_escalation_cap_pct percent of the prior contract unit price, and each item is escalated at most once in any 12 months; a supplier cost decrease never lowers a fixed contract price.
        replaced_by: >-
          For an escalation this policy reviews on a pending claim, and only for such an escalation, the price the agreement sets is the reviewed escalated price this rule works out; every other escalation still raises a contract unit price by the percentage increase in Corbett's supplier cost for that item since the item's previous price line, capped at annual_escalation_cap_pct percent of the prior contract unit price, and each item is still escalated at most once in any 12 months; a supplier cost decrease still never lowers a fixed contract price.
    trigger: state_due
    subject: [pricing_claim_decided]
    computes: contract_unit_price
    target_tool: decide_pending_price_claim_4f6327a3
    params:
      volume_window_months: 12
      volume_high_units: 1000
      volume_mid_units: 400
      volume_high_points: 1.0
      volume_mid_points: 0.5
      commit_window_months: 12
      commit_high_ratio: 1.5
      commit_high_points: 0.5
      commit_mid_points: 0.25
      notice_tight_days: 5
      notice_ample_days: 30
      notice_tight_points: 0.5
      notice_mid_points: 0.25
      breadth_high_items: 50
      breadth_mid_items: 25
      breadth_high_points: 0.5
      breadth_mid_points: 0.25
      load_window_months: 12
      load_high_count: 10
      load_high_points: 0.25
      load_mid_points: 0.1
    rule: >-
      This policy decides, for the item of the latest backorder on the customer's ship-tos, the price claim most recently filed on the agreement for that item while no decision has been recorded for it, when the item's latest price line is an annual escalation, the item's only earlier price line is the line that added it (its new-item line), and the item's latest shipment to the customer's ship-tos is on or after the escalation's effective date; it records on the decision the unit price the agreement sets for the claimed line as this rule reviews that escalation.
      For the claimed line of an escalation this policy reviews on a pending claim, and only for such a line, the price the agreement sets is the reviewed escalated price this rule works out; the price of every other billed line is still the price in effect on the line's ship date under price_change_effective_basis, chosen in this order: first, the item's contract unit price from the latest pricing_items line for that sku effective on or before the ship date, unless that latest line is a removal; otherwise, on a cost-plus tier, Corbett's supplier cost on the ship date increased by cost_plus_markup_pct percent with at least cost_plus_min_markup_per_unit_usd markup per unit; otherwise, for a non-stock special-order item, supplier cost increased by special_order_markup_pct percent; otherwise, list price less the item category's discount from category_discount_schedule, or less list_discount_pct when the category is not in the schedule.
      For an escalation this policy reviews on a pending claim, and only for such an escalation, the price the agreement sets is the reviewed escalated price this rule works out; every other escalation still raises a contract unit price by the percentage increase in Corbett's supplier cost for that item since the item's previous price line, capped at annual_escalation_cap_pct percent of the prior contract unit price, and each item is still escalated at most once in any 12 months; a supplier cost decrease still never lowers a fixed contract price.
      The reviewed escalation increase is the percentage increase in supplier cost from the line that added the item (its new-item line) to its escalation line.
      The reviewed escalation allowance is the lesser of the reviewed escalation increase and the tier's annual_escalation_cap_pct.
      The unit price the agreement sets for the claimed line is the escalation line's prior unit price raised by the reviewed escalation allowance; it is rounded half up to four decimal places once, on the final figure.
      Whole months between two dates are the difference in calendar months between them, less one when the later date's day of the month is earlier than the earlier date's; calendar days from one date to another count the later date and not the earlier one; wherever this rule takes the latest or most recent record of a kind, it is the one with the latest date, and among records of the same date the one recorded first.
      Where Corbett's list price for the item rose between the two lines but by less than its supplier cost, the reviewed escalation increase is instead the percentage rise in list price; where the list price did not rise while the supplier cost did, the reviewed escalation increase is instead 0; in every other case it is the supplier cost increase.
      The volume reduction follows the units of the claimed item shipped to the customer's ship-tos less than volume_window_months whole months before the handling date: volume_high_units or more take volume_high_points percentage points off the reviewed escalation allowance, at least volume_mid_units and fewer than volume_high_units take volume_mid_points points off, and fewer take nothing off.
      The commitment reduction follows the merchandise invoiced on the customer's Commercial Credit Account less than commit_window_months whole months before the handling date divided by the agreement's annual spend commitment: commit_high_ratio or more takes commit_high_points points off, at least 1 and below commit_high_ratio takes commit_mid_points points off, and less, or an agreement with no commitment, takes nothing off.
      The notice reduction follows the extra notice of the escalation, which is the calendar days from its notice date to its effective date less the tier's escalation_notice_days: notice_tight_days or fewer extra days take notice_tight_points points off, more than notice_tight_days and fewer than notice_ample_days extra days take notice_mid_points points off, and notice_ample_days or more take nothing off.
      The breadth reduction follows the contract items the agreement carries, counted as its added item lines less its removal lines: breadth_high_items or more take breadth_high_points points off, at least breadth_mid_items and fewer than breadth_high_items take breadth_mid_points points off, and fewer take nothing off.
      The load reduction follows the annual escalation lines on the agreement whose effective date is less than load_window_months whole months before the handling date: load_high_count or more take load_high_points points off, at least one and fewer than load_high_count take load_mid_points points off, and none take nothing off.
      The reductions this policy sets are added together and taken off the reviewed escalation allowance once, before the prior unit price is raised by it, and the allowance never falls below 0.
      The decision is referred_to_pricing_desk when the overbilling, which is the claimed quantity times the difference between the billed unit price and that unit price, exceeds the tier's price_claim_desk_authority_usd, and denied when the billed unit price is at or below that unit price or the overbilling is below the tier's price_claim_min_usd; it records the claimed quantity, the billed unit price, that unit price and a claim amount of 0.00, and a claim the desk could approve is decided under the base claim rule instead.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_lines.event_date, order_lines.quantity]
        note: Units of the claimed item shipped in the window decide the volume reduction; the item's latest shipment date fixes the scope.
      - category: credit
        as: history
