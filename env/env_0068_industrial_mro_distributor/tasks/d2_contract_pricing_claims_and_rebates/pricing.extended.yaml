        bindings: [inv_merch, inv_tax, inv_disc, settle_mult]
        ladder:
          - when: "the invoice carried sales tax and earned a prompt-payment discount"
            method: "one plus the tax rate less the discount rate"
          - when: "the invoice carried sales tax without a discount"
            method: "one plus the tax rate"
          - when: "the invoice earned a discount without sales tax"
