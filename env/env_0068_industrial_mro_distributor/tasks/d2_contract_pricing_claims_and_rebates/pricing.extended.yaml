        - {category: order, table: order_lines, aggregate: latest, field: unit_price, filters: {event_type: order_line_shipped}}
        - {category: order, table: order_lines, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: order_line_shipped}}
        - {category: credit, table: credit_transactions, aggregate: count, field: document_number, within_months: 12, filters: {event_type: credit_cash_discount_taken}}
