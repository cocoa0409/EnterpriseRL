          - when: "the substitute's unit price on its latest regular shipment is below the ending price"
            method: "the protected price is the substitute's own unit price"
          - when: "that unit price is gap_share_from_pct percent or more above the ending price"
            method: "the protected price is the ending price plus the product of gap_share and the difference between the two"
          - when: "otherwise"
            method: "the protected price is the ending price"
        baseline:
          start_price: "ending"
        evidence: [cross_category]
        cross_difficulty: order
      - id: substitute_adoption_concession
        effect: parameter
        decides: adoption_off
        bindings: [adopt_units, adoption_off]
        ladder:
          - when: "adoption_high_units or more units of the substitute shipped or filled in the window"
            value: "K('adoption_high_pct')"
          - when: "at least one and fewer than adoption_high_units such units"
            value: "K('adoption_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          adoption_off: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: kept_program_concession
        effect: parameter
        decides: programs_off
        bindings: [has_stocksmart, has_vendpoint, programs_off]
        ladder:
          - when: "an active StockSmart program and an active VendPoint machine"
            value: "K('programs_both_pct')"
          - when: "an active StockSmart program or an active VendPoint machine, without the other"
            value: "K('programs_one_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          programs_off: "0"
        evidence: [cross_category]
        cross_difficulty: vmi
      - id: prompt_payment_concession
        effect: parameter
        decides: prompt_off
        bindings: [prompt_count, prompt_off]
        ladder:
          - when: "prompt_high_count or more prompt-payment cash discounts earned in the window"
            value: "K('prompt_high_pct')"
          - when: "at least one and fewer than prompt_high_count such discounts"
            value: "K('prompt_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          prompt_off: "0"
        evidence: [cross_category, history]
        cross_difficulty: credit
      - id: agreement_tenure_concession
        effect: parameter
        decides: tenure_off
        bindings: [tenure_months, tenure_off]
        ladder:
          - when: "tenure_long_months or more whole months from the agreement's proposal date"
            value: "K('tenure_long_pct')"
          - when: "at least tenure_mid_months and fewer than tenure_long_months such months"
            value: "K('tenure_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_off: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The protected price is the contract unit price that ends on the discontinued item's close-out line; it is rounded half up to four decimal places once, on the final figure.
