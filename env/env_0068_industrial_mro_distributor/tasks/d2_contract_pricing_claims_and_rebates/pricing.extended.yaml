# ---- data flow ----
events:
  - type: pricing_agreement_proposed
    target: pricing_agreements
    mutation: create
    meaning: "Corbett issues a contract pricing proposal to the customer at a tier with a commitment and term."
    grain: "One row per proposal (one transaction)."
    fields: {customer_id: "Customer proposed to.", variant_name: "Tier proposed.", agreement_number: "Agreement number assigned (CPA-...).", proposed_date: "Date the proposal was issued.", annual_spend_commitment: "Annual commitment proposed, USD.", auto_renew: "Whether the proposal auto-renews."}
    triggers: []
  - type: pricing_agreement_signed
    target: pricing_agreements
    mutation: {transition: {from: proposed, to: active}}
    meaning: "The customer signs the proposal and the agreement takes effect."
    grain: "One row per signature (one transaction)."
    fields: {effective_date: "First day the agreement pricing applies.", expiration_date: "Last day of the term."}
    triggers: []
  - type: pricing_proposal_withdrawn
    target: pricing_agreements
    mutation: {transition: {from: proposed, to: withdrawn}}
    meaning: "An unsigned proposal lapses."
    grain: "One row per lapse (one transaction)."
    fields: {closed_date: "Date the proposal lapsed."}
    triggers: []
  - type: pricing_renewal_opened
    target: pricing_agreements
    mutation: {transition: {from: active, to: renewal_pending}}
    meaning: "The renewal window opens ahead of the expiration date."
    grain: "One row per renewal window (one transaction)."
    fields: {expiration_date: "Expiration date of the current term (unchanged)."}
    triggers: []
  - type: pricing_agreement_renewed
    target: pricing_agreements
    mutation: {transition: {from: renewal_pending, to: active}}
    meaning: "The agreement renews for a new term."
    grain: "One row per renewal (one transaction)."
    fields: {effective_date: "First day of the new term.", expiration_date: "Last day of the new term."}
    triggers: []
  - type: pricing_agreement_expired
    target: pricing_agreements
    mutation: {transition: {from: renewal_pending, to: expired}}
    meaning: "The term ends without renewal."
    grain: "One row per expiry (one transaction)."
    fields: {closed_date: "Day after the expiration date."}
    triggers: []
  - type: pricing_agreement_terminated
    target: pricing_agreements
    mutation: {transition: [{from: active, to: terminated}, {from: renewal_pending, to: terminated}]}
    meaning: "The customer terminates the agreement early by written notice."
    grain: "One row per termination (one transaction)."
    fields: {termination_notice_date: "Date the customer's written termination notice was received.", closed_date: "Date the termination takes effect."}
    triggers: []
  - type: pricing_tier_changed
    target: pricing_agreements
    mutation: update
    meaning: "The agreement moves to another tier at an anniversary commitment review or by a signed amendment."
    grain: "One row per tier change (one transaction)."
    fields: {variant_name: "New tier.", annual_spend_commitment: "Commitment under the new tier, USD."}
    triggers: []
  - type: pricing_item_added
    target: pricing_items
    meaning: "An item is added to the agreement's contract item list at a contract unit price."
    grain: "One row per item price line taking effect."
    distinguish_by: [sku, effective_date, change_reason]
    fields: {sku: "Corbett item number.", product_category: "Product category of the item.", list_price: "Corbett list unit price on the effective date, USD.", supplier_cost: "Corbett supplier unit cost on the effective date, USD.", contract_unit_price: "Contract unit price set, USD to 4 decimals.", prior_unit_price: "Unit price the customer paid before this line (list less discount), USD.", quote_date: "Date of the Corbett special pricing quote being accepted.", effective_date: "First ship date the price applies.", change_reason: "Why the line was written.", change_reference: "Quote or change reference (SPQ-...)."}
    triggers: []
  - type: pricing_item_repriced
    target: pricing_items
    meaning: "A contract item's unit price changes by escalation, supplier cost change or competitive match."
    grain: "One row per item price change taking effect."
    distinguish_by: [sku, effective_date, change_reason]
    fields: {sku: "Corbett item number.", product_category: "Product category.", list_price: "List unit price on the effective date, USD.", supplier_cost: "Supplier unit cost on the effective date, USD.", contract_unit_price: "New contract unit price, USD to 4 decimals.", prior_unit_price: "Contract unit price before the change, USD.", competitor_unit_price: "Competitor's quoted unit price for a competitive match; 0.0000 otherwise.", quote_date: "Date of the competitor's written quote for a competitive match; empty otherwise.", notice_date: "Date the escalation or supplier cost change notice was sent to the customer; empty for a competitive match.", effective_date: "First ship date the new price applies.", change_reason: "Why the price changed.", change_reference: "Change reference."}
    triggers: []
  - type: pricing_item_removed
    target: pricing_items
    meaning: "An item is removed from the contract item list and reverts to the tier's discount basis."
    grain: "One row per item removal."
    distinguish_by: [sku, effective_date]
    fields: {sku: "Corbett item number.", product_category: "Product category.", contract_unit_price: "Contract unit price that ends, USD.", notice_date: "Date the removal notice was sent.", effective_date: "First ship date without the contract price.", change_reason: "Set to removal.", change_reference: "Change reference."}
    triggers: []
  - type: pricing_claim_filed
    target: pricing_claims
    meaning: "The customer claims that an invoiced line was billed above the price the agreement sets."
    grain: "One row per claim on one invoice line (invoice and item)."
    distinguish_by: [claim_reference]
    fields: {claim_reference: "Claim reference (PCL-...).", invoice_number: "Invoice billed.", sku: "Item billed.", quantity: "Quantity billed on the line.", billed_unit_price: "Unit price billed, USD.", contract_unit_price: "Unit price the agreement sets for the ship date, USD.", claim_amount: "Computed overbilling, USD.", event_date: "Date filed.", outcome: "Set to pending."}
    triggers: []
  - type: pricing_claim_decided
    target: pricing_claims
    meaning: "A price claim is decided."
    grain: "One row per decision on one claim."
    distinguish_by: [claim_reference]
    fields: {claim_reference: "Claim decided.", invoice_number: "Invoice billed.", sku: "Item billed.", quantity: "Quantity credited.", billed_unit_price: "Unit price billed, USD.", contract_unit_price: "Unit price the agreement sets, USD.", claim_amount: "Amount credited when approved, USD; 0.00 otherwise.", event_date: "Decision date.", outcome: "Decision."}
    triggers:
      - event: credit:credit_memo_issued
        when: {outcome: approved}
        map: {amount: claim_amount, source_type: price_claim_credit, source_reference: claim_reference, applied_invoice_number: invoice_number}
  - type: pricing_rebate_accrued
    target: pricing_rebates
    meaning: "The volume rebate earned for a completed rebate period is accrued to the agreement."
    grain: "One row per agreement per rebate period."
    distinguish_by: [rebate_period]
    fields: {rebate_period: "Rebate period YYYY-Qn.", qualifying_spend: "Qualifying spend in the period, USD.", rebate_rate_pct: "Ladder rate applied, percent.", amount: "Rebate accrued, USD.", event_date: "Accrual date (the day after the period ends).", source_reference: "Period reference."}
    account: rebate
    direction: in
    triggers: []
  - type: pricing_rebate_paid
    target: pricing_rebates
    meaning: "The rebate balance is paid out by credit memo or check."
    grain: "One row per payout."
    distinguish_by: [rebate_period, payout_method]
    fields: {rebate_period: "Rebate period whose payout this is.", amount: "Amount paid, USD.", payout_method: "Payout method.", event_date: "Payout date.", source_reference: "Payout reference."}
    account: rebate
    direction: out
    triggers:
      - event: credit:credit_memo_issued
        when: {payout_method: credit_memo}
        map: {amount: amount, source_type: rebate_payout, source_reference: rebate_period}
  - type: pricing_rebate_reversed
    target: pricing_rebates
    meaning: "Rebate is reduced for returns of merchandise counted in an earlier period, or forfeited on early termination."
    grain: "One row per return clawback (per RMA) or per forfeiture."
    distinguish_by: [rebate_period, source_reference]
    fields: {rebate_period: "Rebate period the reversal relates to.", qualifying_spend: "Merchandise value returned (negative qualifying spend) or 0.00 for a forfeiture, USD.", rebate_rate_pct: "Rate originally applied, percent.", amount: "Rebate reversed, USD (positive).", event_date: "Reversal date.", source_reference: "RMA number for a clawback, or the agreement number for a forfeiture.", payout_method: "Set to none."}
    account: rebate
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: pricing_msr_period_qualifying_spend
    window: "One calendar quarter (rebate period YYYY-Qn), by invoice date for invoices and by memo date for return credits."
    measure: "Sum, USD, of merchandise_amount of credit_invoice_posted rows with source_type order_shipment, vmi_replenishment or vending_usage, less the merchandise value of special-order lines shipped in the quarter, less the amount of credit_memo_issued rows with source_type return_credit dated in the quarter."
  - id: pricing_msr_trailing_12m_spend
    window: "The 12 calendar months ending on the day before the agreement anniversary."
    measure: "The same qualifying spend basis as pricing_msr_period_qualifying_spend summed over the window, USD."
  - id: pricing_msr_contract_item_count
    window: "Point in time: the date the item change takes effect."
    measure: "Count of distinct sku values whose latest pricing_items line effective on or before that date is pricing_item_added or pricing_item_repriced (not pricing_item_removed)."

# ---- policies ----
policies:
  - id: pricing_agg_multi_holding
    subject: [pricing_agreement_proposed]
    rule: >-
      A customer holds at most one Contract Pricing Agreement; every ship-to, VMI program and vending program of the customer buys at that agreement's prices.
      A new proposal is not issued while the customer has an agreement whose status is proposed, active or renewal_pending; a change of tier on a live agreement is made by pricing_tier_changed, never by a second agreement.
    eligibility:
      - id: one_live_agreement
        applies_to: [pricing_agreement_proposed]
        kind: dedup
        condition: "A new proposal is not issued while the customer has an agreement whose status is proposed, active or renewal_pending"
        evidence_fields: [pricing_agreements.customer_id, pricing_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pricing_agreements.customer_id]]
          action_bindings: {pricing_agreements.customer_id: customer_id}
        dedup_contract:
          table: pricing_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [proposed, active, renewal_pending]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: pricing_agreement_eligibility
    subject: [pricing_agreement_proposed, pricing_agreement_signed, pricing_proposal_withdrawn]
    rule: >-
      A proposal is issued at the highest tier whose entry gate the customer's trailing 12 month purchases with Corbett meet, or at a lower tier the customer asks for; the commitment written on it is the tier's annual_spend_commitment_usd.
      A tier above the Corbett Account Price Schedule is proposed only to a customer whose Commercial Credit Account status is active.
      The customer signs no later than proposal_validity_days calendar days after the proposal date.
      Count calendar days starting the day after the proposal date; a signature on the last day is accepted and a proposal not signed by then lapses as withdrawn.
      Signing is the customer's own act by its authorized signer; the agreement takes effect on the signature date and its first term ends agreement_term_months calendar months later, on the day before the same calendar day (month-end falling back to the last day of the month).
      A customer with no signed agreement buys at the Corbett Account Price Schedule, which applies without signature.
    eligibility:
      - id: credit_account_active
        applies_to: [pricing_agreement_proposed]
        kind: state
        condition: "A tier above the Corbett Account Price Schedule is proposed only to a customer whose Commercial Credit Account status is active."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]
      - id: signed_inside_validity
        applies_to: [pricing_agreement_signed]
        kind: time
        condition: "The customer signs no later than proposal_validity_days calendar days after the proposal date."
        evidence_fields: [pricing_agreements.proposed_date, pricing_agreements.pricing_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pricing_agreements.pricing_agreement_id]]
          action_bindings: {pricing_agreements.pricing_agreement_id: pricing_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the proposal date"
          anchor_source: pricing_agreements.proposed_date
          relation: not_after
          duration_source: variants.proposal_validity_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the proposal date; a signature on the last day is accepted and a proposal not signed by then lapses as withdrawn."
          boundary: inclusive

  - id: pricing_price_basis
    subject: [pricing_item_added, pricing_item_repriced, pricing_item_removed]
    rule: >-
      The price of a billed line is the price in effect on the line's ship date under price_change_effective_basis, chosen in this order: first, the item's contract unit price from the latest pricing_items line for that sku effective on or before the ship date, unless that latest line is a removal; otherwise, on a cost-plus tier, Corbett's supplier cost on the ship date increased by cost_plus_markup_pct percent with at least cost_plus_min_markup_per_unit_usd markup per unit; otherwise, for a non-stock special-order item, supplier cost increased by special_order_markup_pct percent; otherwise, list price less the item category's discount from category_discount_schedule, or less list_discount_pct when the category is not in the schedule.
      Where quantity_breaks_honored is true the list quantity-break price replaces list price before the discount.
      No category discount in a tier's schedule exceeds its category_discount_max_pct.
      Every unit price is rounded half up to unit_price_decimals decimal places; the extended line amount is the rounded unit price times the quantity, rounded half up to the cent.
      Only one basis ever applies to a line: discounts never stack on a contract unit price, and a contract unit price is never replaced by a lower discount-based price.
      An expired or terminated agreement's prices stop the day after its closing date; lines shipped from then on are priced at the Corbett Account Price Schedule.
    eligibility: []
    formula:
      list_basis_price: "round(list_price * (1 - list_discount_pct / 100), 4)"
      cost_plus_price: "round(max(supplier_cost * (1 + cost_plus_markup_pct / 100), supplier_cost + cost_plus_min_markup_per_unit_usd), 4)"

  - id: pricing_evt_contract_items
    subject: [pricing_item_added, pricing_item_removed]
    rule: >-
      Contract items are added only to an agreement whose status is active or renewal_pending.
      An item is added at the price of an accepted Corbett special pricing quote, returned within special_pricing_request_business_days business days of the request; the quote is accepted no later than special_pricing_quote_validity_days calendar days after the quote date.
      Count calendar days starting the day after the quote date; acceptance on the last day is valid, and a later acceptance needs a new quote.
      An item is added only when its expected annual usage is at least contract_item_min_annual_units selling units and only while pricing_msr_contract_item_count stays at or below fixed_net_items_max; a tier whose fixed_net_items_max is 0 carries no contract items.
      An agreement on a tier with contract items carries at least fixed_net_items_min of them, and its contract items are reviewed every market_basket_review_months months.
      Corbett removes an item only after giving contract_item_removal_notice_days calendar days of notice, counted from the notice date; a customer may ask for removal of an item effective the next ship date.
      When the manufacturer discontinues a contract item, the Corbett-approved substitute is billed at the discontinued item's contract unit price for discontinued_item_price_protection_days days from the discontinuation and is then added at its own quoted price or reverts to the discount basis.
    eligibility:
      - id: live_agreement_only
        applies_to: [pricing_item_added]
        kind: state
        condition: "Contract items are added only to an agreement whose status is active or renewal_pending."
        evidence_fields: [pricing_agreements.status, pricing_agreements.pricing_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pricing_agreements.pricing_agreement_id]]
          action_bindings: {pricing_agreements.pricing_agreement_id: pricing_agreement_id}
        state_contract:
          field: pricing_agreements.status
          allowed: [active, renewal_pending]
      - id: quote_still_valid
        applies_to: [pricing_item_added]
        kind: time
        condition: "the quote is accepted no later than special_pricing_quote_validity_days calendar days after the quote date"
        evidence_fields: [pricing_items.quote_date, pricing_items.change_reference]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[pricing_items.change_reference]]
          action_bindings: {pricing_items.change_reference: change_reference}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the quote date"
          anchor_source: pricing_items.quote_date
          relation: not_after
          duration_source: variants.special_pricing_quote_validity_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the quote date; acceptance on the last day is valid, and a later acceptance needs a new quote."
          boundary: inclusive
    measures: [pricing_msr_contract_item_count]

  - id: pricing_evt_escalation
    subject: [pricing_item_repriced]
    rule: >-
      No contract item is escalated with an effective date earlier than price_lock_months calendar months after the agreement effective date.
      Add the months to the agreement effective date by calendar month; when the target month has no such day the boundary is the last day of that month, and an escalation effective on the boundary date is allowed.
      An escalated price takes effect no earlier than escalation_notice_days calendar days after the escalation notice date.
      Count notice days starting the day after the escalation notice date; a price effective on the last notice day is allowed.
      An escalation raises a contract unit price by the percentage increase in Corbett's supplier cost for that item since the item's previous price line, capped at annual_escalation_cap_pct percent of the prior contract unit price, and each item is escalated at most once in any 12 months; a supplier cost decrease never lowers a fixed contract price.
      On the Cost-Plus tier there is no fixed price to escalate: a supplier cost increase changes the cost-plus price supplier_cost_change_notice_days calendar days after its notice date, and a supplier cost decrease changes it from the next ship date.
      A tier with no contract items has nothing to escalate; its prices follow Corbett list price changes from the list effective date.
    eligibility:
      - id: price_lock_elapsed
        applies_to: [pricing_item_repriced]
        kind: time
        condition: "No contract item is escalated with an effective date earlier than price_lock_months calendar months after the agreement effective date."
        evidence_fields: [pricing_agreements.effective_date, pricing_agreements.pricing_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pricing_agreements.pricing_agreement_id]]
          action_bindings: {pricing_agreements.pricing_agreement_id: pricing_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the agreement effective date"
          anchor_source: pricing_agreements.effective_date
          relation: not_before
          duration_source: variants.price_lock_months
          unit: calendar_months
          counting_rule: "Add the months to the agreement effective date by calendar month; when the target month has no such day the boundary is the last day of that month, and an escalation effective on the boundary date is allowed."
          boundary: inclusive

      - id: escalation_notice_given
        applies_to: [pricing_item_repriced]
        kind: time
        condition: "An escalated price takes effect no earlier than escalation_notice_days calendar days after the escalation notice date."
        evidence_fields: [pricing_items.notice_date, pricing_items.sku]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pricing_items.sku]]
          action_bindings: {pricing_items.sku: sku}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the escalation notice date"
          anchor_source: pricing_items.notice_date
          relation: not_before
          duration_source: variants.escalation_notice_days
          unit: calendar_days
          counting_rule: "Count notice days starting the day after the escalation notice date; a price effective on the last notice day is allowed."
          boundary: inclusive

  - id: pricing_evt_competitive_match
    subject: [pricing_item_repriced]
    rule: >-
      A competitive match is available only on a tier whose competitive_match_allowed is true, only for an item already on the contract item list, and only against a competitor's written quote for the same manufacturer part number in the same selling unit.
      A competitive match is considered only when the match request is made no later than competitive_match_quote_max_age_days calendar days after the competitor's written quote date.
      Count calendar days starting the day after the quote date; a request on the last day is considered.
      The matched contract unit price is the highest of the competitor's unit price, the current contract unit price reduced by competitive_match_max_reduction_pct percent, and the lowest price that keeps a gross margin of competitive_match_min_margin_pct percent over Corbett's supplier cost, rounded half up to four decimals; when that result is not below the current contract unit price, no match is made.
      A matched price takes effect from the next ship date and is not escalated before the item's next eligible escalation.
    eligibility:
      - id: quote_age_inside_limit
        applies_to: [pricing_item_repriced]
        kind: time
        condition: "A competitive match is considered only when the match request is made no later than competitive_match_quote_max_age_days calendar days after the competitor's written quote date."
        evidence_fields: [pricing_items.quote_date, pricing_items.sku]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[pricing_items.sku]]
          action_bindings: {pricing_items.sku: sku}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the competitor's written quote date"
          anchor_source: pricing_items.quote_date
          relation: not_after
          duration_source: variants.competitive_match_quote_max_age_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the quote date; a request on the last day is considered."
          boundary: inclusive
    formula:
      matched_price: "round(max(competitor_unit_price, prior_unit_price * (1 - competitive_match_max_reduction_pct / 100), supplier_cost / (1 - competitive_match_min_margin_pct / 100)), 4)"

  - id: pricing_evt_price_claim
    subject: [pricing_claim_filed, pricing_claim_decided]
    rule: >-
      A customer billed above the price pricing_price_basis sets for an invoiced line may file a contract price claim for that invoice line.
      The claim is filed no later than price_claim_window_days calendar days after the invoice date.
      Count calendar days starting the day after the invoice date; a claim filed on the last day is accepted.
      Each invoice line (invoice and item) may carry only one price claim.
      The claim amount is the billed unit price less the unit price the agreement sets for the line's ship date, times the quantity billed, rounded half up to the cent; the agreement in force is the one whose status covered the ship date, not the one in force on the claim date.
      A claim is decided approved when the claim amount is at least price_claim_min_usd and at most price_claim_desk_authority_usd; referred_to_pricing_desk when it exceeds the desk authority; and denied when the billed price is at or below the agreement price or the claim amount is below price_claim_min_usd.
      An approved claim is credited by a credit memo for the claim amount applied to the invoice; the claim never re-prices the item for future shipments.
      Claims are decided within price_claim_decision_business_days business days.
    eligibility:
      - id: inside_claim_window
        applies_to: [pricing_claim_filed]
        kind: time
        condition: "The claim is filed no later than price_claim_window_days calendar days after the invoice date."
        evidence_fields: [credit_transactions.document_number, credit_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_transactions.document_number]]
          action_bindings: {credit_transactions.document_number: invoice_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the invoice date"
          anchor_source: credit_transactions.txn_date
          relation: not_after
          duration_source: variants.price_claim_window_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the invoice date; a claim filed on the last day is accepted."
          boundary: inclusive
      - id: one_claim_per_line
        applies_to: [pricing_claim_filed]
        kind: dedup
        condition: "Each invoice line (invoice and item) may carry only one price claim."
        evidence_fields: [pricing_claims.invoice_number, pricing_claims.sku, pricing_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pricing_claims.invoice_number, pricing_claims.sku]]
          action_bindings: {pricing_claims.invoice_number: invoice_number, pricing_claims.sku: sku}
        dedup_contract:
          table: pricing_claims
          mode: separate_record
          object_bindings: {invoice_number: invoice_number, sku: sku}
          duplicate_filters: {event_type: [pricing_claim_filed]}
          distinct_fields: []
    formula:
      claim_amount: "round((billed_unit_price - contract_unit_price) * quantity, 2)"

  - id: pricing_evt_rebate
    subject: [pricing_rebate_accrued, pricing_rebate_paid, pricing_rebate_reversed]
    rule: >-
      Only a tier whose rebate_eligible is true earns a volume rebate, measured per rebate_period on qualifying_spend_basis by pricing_msr_period_qualifying_spend, with special-order lines excluded where rebate_excludes_special_orders is true.
      The rate is the rate_pct of the highest rebate_ladder bracket whose from_usd the period's qualifying spend reaches, applied to the whole period's qualifying spend (not marginally); spend below the first bracket earns nothing.
      Each agreement accrues at most one rebate for a rebate period, dated the day after the period ends; only periods during which the agreement was active or renewal_pending count, and a period the agreement covered only in part counts the qualifying spend shipped while it was in force.
      The rebate balance is paid within rebate_payout_days_after_period days after the period end by the payout method the customer chose from rebate_payout_methods; a balance below rebate_min_payout_usd carries forward to the next period instead of being paid.
      Where rebate_clawback_on_returns is true, a return credited after the period's rebate was accrued reduces the rebate by the returned merchandise value times the rate originally applied to that period, rounded half up to the cent, booked once per RMA.
      Where termination_rebate_forfeit is true, an early termination forfeits the whole unpaid rebate balance on the termination effective date; expiry at the end of a term forfeits nothing and the final period's rebate is paid normally.
    eligibility:
      - id: one_accrual_per_period
        applies_to: [pricing_rebate_accrued]
        kind: dedup
        condition: "Each agreement accrues at most one rebate for a rebate period, dated the day after the period ends"
        evidence_fields: [pricing_rebates.pricing_agreement_id, pricing_rebates.rebate_period, pricing_rebates.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pricing_rebates.pricing_agreement_id, pricing_rebates.rebate_period]]
          action_bindings: {pricing_rebates.pricing_agreement_id: pricing_agreement_id, pricing_rebates.rebate_period: rebate_period}
        dedup_contract:
          table: pricing_rebates
          mode: separate_record
          object_bindings: {pricing_agreement_id: pricing_agreement_id, rebate_period: rebate_period}
          duplicate_filters: {event_type: [pricing_rebate_accrued]}
          distinct_fields: [rebate_period]
    measures: [pricing_msr_period_qualifying_spend]
    params:
      per_tier:
        Corbett Account Price Schedule: {ladder: "=rebate_ladder", min_payout: "=rebate_min_payout_usd"}
        Corbett Volume Discount Agreement: {ladder: "=rebate_ladder", min_payout: "=rebate_min_payout_usd"}
        Corbett Category Contract: {ladder: "=rebate_ladder", min_payout: "=rebate_min_payout_usd"}
        Corbett Net-Price Contract: {ladder: "=rebate_ladder", min_payout: "=rebate_min_payout_usd"}
        Corbett Cost-Plus Contract: {ladder: "=rebate_ladder", min_payout: "=rebate_min_payout_usd"}
        Corbett Strategic Supply Agreement: {ladder: "=rebate_ladder", min_payout: "=rebate_min_payout_usd"}
    formula:
      amount: "round(qualifying_spend * rebate_rate_pct / 100, 2)"

  - id: pricing_renewal_and_termination
    subject: [pricing_renewal_opened, pricing_agreement_renewed, pricing_agreement_expired, pricing_agreement_terminated]
    rule: >-
      The renewal window opens renewal_notice_days days before the expiration date.
      Where auto_renew_default is true and the customer has not given notice, the agreement renews on the day after the expiration date for auto_renew_term_months months; otherwise it renews only when the customer signs the renewal before the expiration date, and expires the day after the expiration date if it does not.
      A renewal keeps the tier and contract items; contract unit prices carry into the new term and remain subject to pricing_evt_escalation.
      An early termination takes effect no earlier than early_termination_notice_days calendar days after the date the customer's written termination notice is received.
      Count calendar days starting the day after the notice is received; the termination takes effect on the last day of the notice period, or on a later date the notice names.
      Termination is the customer's own act; prices stay in force until the effective date, and from the next day lines are priced at the Corbett Account Price Schedule.
      An agreement is never terminated retroactively, and a termination notice may be withdrawn by the customer before its effective date.
    eligibility:
      - id: termination_notice_period
        applies_to: [pricing_agreement_terminated]
        kind: time
        condition: "An early termination takes effect no earlier than early_termination_notice_days calendar days after the date the customer's written termination notice is received."
        evidence_fields: [pricing_agreements.termination_notice_date, pricing_agreements.pricing_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pricing_agreements.pricing_agreement_id]]
          action_bindings: {pricing_agreements.pricing_agreement_id: pricing_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the customer's written termination notice is received"
          anchor_source: pricing_agreements.termination_notice_date
          relation: not_before
          duration_source: variants.early_termination_notice_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the notice is received; the termination takes effect on the last day of the notice period, or on a later date the notice names."
          boundary: inclusive

  - id: pricing_commitment_review
    subject: [pricing_tier_changed]
    rule: >-
      At each agreement anniversary the trailing 12 month qualifying spend measured by pricing_msr_trailing_12m_spend on commitment_measurement_basis is compared with the agreement's commitment.
      When it is below shortfall_review_threshold_pct percent of the commitment the agreement moves down one tier to the tier named by downgrade_target, effective on the anniversary, with that tier's commitment; contract items above the lower tier's fixed_net_items_max are removed with notice under pricing_evt_contract_items, and a lower tier with no contract items reverts every item to its discount basis.
      A tier whose shortfall_review_threshold_pct is 0 is never reviewed for shortfall.
      A move up to a higher tier is made only by a signed amendment when the customer's trailing 12 month spend meets that tier's entry gate; a tier change never restarts the term.
    eligibility: []
    measures: [pricing_msr_trailing_12m_spend]
    params:
      per_tier:
        Corbett Account Price Schedule: {downgrade_target: "Corbett Account Price Schedule"}
        Corbett Volume Discount Agreement: {downgrade_target: "Corbett Account Price Schedule"}
        Corbett Category Contract: {downgrade_target: "Corbett Volume Discount Agreement"}
        Corbett Net-Price Contract: {downgrade_target: "Corbett Category Contract"}
        Corbett Cost-Plus Contract: {downgrade_target: "Corbett Net-Price Contract"}
        Corbett Strategic Supply Agreement: {downgrade_target: "Corbett Net-Price Contract"}

# ---- extended policies (d2_contract_pricing_claims_and_rebates) ----
extended_policies:
  - id: pricing_ext_return_clawback
    base_policy_refs: [pricing_evt_rebate]
    overwrite:
      - base_policy: pricing_evt_rebate
        superseded_clause: >-
          Where rebate_clawback_on_returns is true, a return credited after the period's rebate was accrued reduces the rebate by the returned merchandise value times the rate originally applied to that period, rounded half up to the cent, booked once per RMA.
        replaced_by: >-
          For a return this policy books, and only for such a return, the clawback is worked out as this rule states; every other return credited after its period's rebate was accrued is still reduced by the returned merchandise value times the rate originally applied to that period, rounded half up to the cent, booked once per RMA.
    trigger: state_due
    subject: [pricing_rebate_reversed]
    computes: amount
    target_tool: book_rebate_return_clawback_ccd0c1e2
    params:
      ship_window_days: 90
      fulfilment_error_share: 0.0
      product_fault_share: 0.5
      ordering_error_share: 0.75
      size_waiver_below_usd: 500.0
      size_full_from_usd: 5000.0
      size_mid_share: 0.5
      freq_window_months: 12
      occasional_max: 4
      first_return_share: 0.5
      occasional_return_share: 0.75
    rule: >-
      This policy books the rebate clawback for one return: the customer's most recently received return, when its receipt covers a single order line, it was received after the agreement's latest rebate accrual, and the returned line shipped on one of the ship_window_days days before that accrual's date; such a return is clawed back against the latest accrued rebate period, and only where the tier's rebate_clawback_on_returns is true.
      For a return this policy books, and only for such a return, the clawback is worked out as this rule states; every other return credited after its period's rebate was accrued is still reduced by the returned merchandise value times the rate originally applied to that period, rounded half up to the cent, booked once per RMA.
      The returned line is the order line that the return's receipt names by sales order number and line number, and its ship date is the ship date of that line's latest shipment.
      The clawback's merchandise value is the return credit that the receipt determined for that return.
      The clawback's rebate rate is the rebate rate applied on the agreement's latest accrual.
      The clawback is the clawback's merchandise value times the clawback's rebate rate divided by 100.
      The clawback never exceeds the rebate accrued for the latest accrued period less the reversals already booked against that period, is never below 0.00, and is rounded half up to the cent once, on the final figure.
      Whole months between two dates are the difference in calendar months between them, less one when the later date's day of the month is earlier than the earlier date's; calendar days from one date to another count the later date and not the earlier one; wherever this rule takes the latest or most recent record of a kind, it is the one with the latest date, and among records of the same date the one recorded first.
      Where the receipt found the goods opened but unused, the clawback's merchandise value is instead the quantity received times the invoiced unit price; where the receipt found the goods unopened and resaleable and deducted a restocking fee, the clawback's merchandise value is instead the return credit plus that restocking fee; for every other return the clawback's merchandise value is the return credit.
      The clawback's reason share follows the return reason on the receipt: a wrong item shipped or a duplicate shipment carries fulfilment_error_share, a defective item or damage in transit carries product_fault_share, an item ordered in error carries ordering_error_share, and every other reason carries a reason share of 1.
      The clawback's size share follows the return credit: a return credit below size_waiver_below_usd carries a size share of 0, a return credit of at least size_waiver_below_usd and below size_full_from_usd carries size_mid_share, and a return credit of size_full_from_usd or more carries a size share of 1.
      The clawback's frequency share follows how many return receipt lines the customer's ship-tos received less than freq_window_months whole months before the handling date, this return included: one such line or none carries first_return_share, two to occasional_max lines carry occasional_return_share, and more lines carry a frequency share of 1.
      Every share this policy sets multiplies the unrounded clawback before that limit, that floor and that rounding are applied; a return outside this policy's scope carries no clawback under it.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_returns.rma_number, order_returns.event_date, order_returns.order_number, order_returns.line_number, order_returns.credit_amount, order_returns.item_condition, order_returns.quantity, order_returns.unit_price, order_returns.restocking_fee, order_returns.return_reason, order_lines.event_date]
        note: The customer's return receipts and the returned line's shipment on the Ship-To Fulfillment Account decide the scope, the merchandise value method, the reason share, the size share and the frequency share.
    compute:
      - acc_period: "LATEST('pricing_rebates', 'rebate_period', event_type='pricing_rebate_accrued')"
      - acc_rate: "LATEST('pricing_rebates', 'rebate_rate_pct', event_type='pricing_rebate_accrued')"
      - acc_date: "LATEST('pricing_rebates', 'event_date', event_type='pricing_rebate_accrued')"
      - rma: "XLATEST('order', 'order_returns', 'rma_number', event_type='order_return_received')"
      - ret_lines: "XCOUNT('order', 'order_returns', event_type='order_return_received', rma_number=rma)"
      - ret_date: "XLATEST('order', 'order_returns', 'event_date', event_type='order_return_received', rma_number=rma)"
      - ret_order: "XLATEST('order', 'order_returns', 'order_number', event_type='order_return_received', rma_number=rma)"
      - ret_line: "XLATEST('order', 'order_returns', 'line_number', event_type='order_return_received', rma_number=rma)"
      - ship_date: "XLATEST('order', 'order_lines', 'event_date', event_type='order_line_shipped', order_number=ret_order, line_number=ret_line)"
      - in_scope: "1 if (P('rebate_clawback_on_returns') == True and ret_lines == 1 and acc_date and ret_date and ship_date and DAYS(acc_date, ret_date) > 0 and DAYS(ship_date, acc_date) >= 1 and DAYS(ship_date, acc_date) <= K('ship_window_days')) else 0"
      - ret_credit: "XSUM('order', 'order_returns', 'credit_amount', event_type='order_return_received', rma_number=rma)"
      - ret_condition: "XLATEST('order', 'order_returns', 'item_condition', event_type='order_return_received', rma_number=rma)"
      - ret_qty: "XSUM('order', 'order_returns', 'quantity', event_type='order_return_received', rma_number=rma)"
      - ret_price: "XLATEST('order', 'order_returns', 'unit_price', event_type='order_return_received', rma_number=rma) or 0"
      - ret_restock: "XSUM('order', 'order_returns', 'restocking_fee', event_type='order_return_received', rma_number=rma)"
      - clawback_value: "ret_qty * ret_price if ret_condition == 'opened_unused' else (ret_credit + ret_restock if (ret_condition == 'unopened_resaleable' and ret_restock > 0) else ret_credit)"
      - ret_reason: "XLATEST('order', 'order_returns', 'return_reason', event_type='order_return_received', rma_number=rma)"
      - reason_share: "K('fulfilment_error_share') if (ret_reason == 'wrong_item_shipped' or ret_reason == 'duplicate_shipment') else (K('product_fault_share') if (ret_reason == 'defective' or ret_reason == 'damaged_in_transit') else (K('ordering_error_share') if ret_reason == 'ordered_in_error' else 1))"
      - size_credit: "XSUM('order', 'order_returns', 'credit_amount', event_type='order_return_received', rma_number=rma)"
      - size_share: "0 if size_credit < K('size_waiver_below_usd') else (K('size_mid_share') if size_credit < K('size_full_from_usd') else 1)"
      - ret_count: "XCOUNT('order', 'order_returns', within_months=K('freq_window_months'), event_type='order_return_received')"
      - freq_share: "K('first_return_share') if ret_count <= 1 else (K('occasional_return_share') if ret_count <= K('occasional_max') else 1)"
      - period_net: "SUM('pricing_rebates', 'amount', event_type='pricing_rebate_accrued', rebate_period=acc_period) - SUM('pricing_rebates', 'amount', event_type='pricing_rebate_reversed', rebate_period=acc_period)"
      - result: "RND(in_scope * MX(0, MN(period_net, clawback_value * (acc_rate or 0) / 100 * reason_share * size_share * freq_share)), 2)"
    compute_basis:
      acc_period: "such a return is clawed back against the latest accrued rebate period, and only where the tier's rebate_clawback_on_returns is true."
      acc_rate: "The clawback's rebate rate is the rebate rate applied on the agreement's latest accrual."
      acc_date: "it was received after the agreement's latest rebate accrual, and the returned line shipped on one of the ship_window_days days before that accrual's date"
      rma: "This policy books the rebate clawback for one return: the customer's most recently received return, when its receipt covers a single order line,"
      ret_lines: "when its receipt covers a single order line,"
      ret_date: "it was received after the agreement's latest rebate accrual,"
      ret_order: "The returned line is the order line that the return's receipt names by sales order number and line number, and its ship date is the ship date of that line's latest shipment."
      ret_line: "The returned line is the order line that the return's receipt names by sales order number and line number, and its ship date is the ship date of that line's latest shipment."
      ship_date: "The returned line is the order line that the return's receipt names by sales order number and line number, and its ship date is the ship date of that line's latest shipment."
      in_scope: "This policy books the rebate clawback for one return: the customer's most recently received return, when its receipt covers a single order line, it was received after the agreement's latest rebate accrual, and the returned line shipped on one of the ship_window_days days before that accrual's date; such a return is clawed back against the latest accrued rebate period, and only where the tier's rebate_clawback_on_returns is true."
      ret_credit: "The clawback's merchandise value is the return credit that the receipt determined for that return."
      ret_condition: "Where the receipt found the goods opened but unused, the clawback's merchandise value is instead the quantity received times the invoiced unit price;"
      ret_qty: "the clawback's merchandise value is instead the quantity received times the invoiced unit price;"
      ret_price: "the clawback's merchandise value is instead the quantity received times the invoiced unit price;"
      ret_restock: "where the receipt found the goods unopened and resaleable and deducted a restocking fee, the clawback's merchandise value is instead the return credit plus that restocking fee;"
      clawback_value: "Where the receipt found the goods opened but unused, the clawback's merchandise value is instead the quantity received times the invoiced unit price; where the receipt found the goods unopened and resaleable and deducted a restocking fee, the clawback's merchandise value is instead the return credit plus that restocking fee; for every other return the clawback's merchandise value is the return credit."
      ret_reason: "The clawback's reason share follows the return reason on the receipt:"
      reason_share: "The clawback's reason share follows the return reason on the receipt: a wrong item shipped or a duplicate shipment carries fulfilment_error_share, a defective item or damage in transit carries product_fault_share, an item ordered in error carries ordering_error_share, and every other reason carries a reason share of 1."
      size_share: "The clawback's size share follows the return credit: a return credit below size_waiver_below_usd carries a size share of 0, a return credit of at least size_waiver_below_usd and below size_full_from_usd carries size_mid_share, and a return credit of size_full_from_usd or more carries a size share of 1."
      ret_count: "The clawback's frequency share follows how many return receipt lines the customer's ship-tos received less than freq_window_months whole months before the handling date, this return included:"
      freq_share: "one such line or none carries first_return_share, two to occasional_max lines carry occasional_return_share, and more lines carry a frequency share of 1."
      size_credit: "The clawback's size share follows the return credit:"
      period_net: "The clawback never exceeds the rebate accrued for the latest accrued period less the reversals already booked against that period, is never below 0.00, and is rounded half up to the cent once, on the final figure."
      result: "Every share this policy sets multiplies the unrounded clawback before that limit, that floor and that rounding are applied; a return outside this policy's scope carries no clawback under it."
    factors:
      - id: merchandise_value_basis
        effect: method
        decides: clawback_value
        bindings: [ret_condition, ret_qty, ret_price, ret_restock, clawback_value]
        ladder:
          - when: "the receipt found the goods opened but unused"
            method: "the clawback's merchandise value is the quantity received times the invoiced unit price"
          - when: "the receipt found the goods unopened and resaleable and deducted a restocking fee"
            method: "the clawback's merchandise value is the return credit plus that restocking fee"
          - when: "otherwise"
            method: "the clawback's merchandise value is the return credit"
        baseline:
          clawback_value: "ret_credit"
        evidence: [cross_category]
        cross_difficulty: order
      - id: return_reason_share
        effect: parameter
        decides: reason_share
        bindings: [ret_reason, reason_share]
        ladder:
          - when: "the return reason is a wrong item shipped or a duplicate shipment"
            value: "K('fulfilment_error_share')"
          - when: "the return reason is a defective item or damage in transit"
            value: "K('product_fault_share')"
          - when: "the return reason is an item ordered in error"
            value: "K('ordering_error_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          reason_share: "1"
        evidence: [cross_category]
        cross_difficulty: order
      - id: credit_size_share
        effect: parameter
        decides: size_share
        bindings: [size_credit, size_share]
        ladder:
          - when: "the return credit is below size_waiver_below_usd"
            value: "0"
          - when: "the return credit is at least size_waiver_below_usd and below size_full_from_usd"
            value: "K('size_mid_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          size_share: "1"
        evidence: [cross_category]
        cross_difficulty: order
      - id: return_frequency_share
        effect: parameter
        decides: freq_share
        bindings: [ret_count, freq_share]
        ladder:
          - when: "one return receipt line, or none, received less than freq_window_months whole months before the handling date"
            value: "K('first_return_share')"
          - when: "two to occasional_max such lines"
            value: "K('occasional_return_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          freq_share: "1"
        evidence: [history, cross_category]
        cross_difficulty: order
    baseline:
      rule: >-
        The clawback's merchandise value is the return credit that the receipt determined for that return.
        The clawback's rebate rate is the rebate rate applied on the agreement's latest accrual.
        The clawback is the clawback's merchandise value times the clawback's rebate rate divided by 100.
        The clawback never exceeds the rebate accrued for the latest accrued period less the reversals already booked against that period, is never below 0.00, and is rounded half up to the cent once, on the final figure.
      params: []
    inputs:
      history:
        - {table: pricing_rebates, aggregate: latest, field: rebate_rate_pct, filters: {event_type: pricing_rebate_accrued}}
        - {category: order, table: order_returns, aggregate: latest, field: rma_number, filters: {event_type: order_return_received}}
        - {category: order, table: order_returns, aggregate: sum, field: credit_amount, filters: {event_type: order_return_received}}
        - {category: order, table: order_returns, aggregate: count, field: rma_number, within_months: 12, filters: {event_type: order_return_received}}
        - {category: order, table: order_lines, aggregate: latest, field: event_date, filters: {event_type: order_line_shipped}}
      cross_category: [order]
  - id: pricing_ext_termination_forfeiture
    base_policy_refs: [pricing_evt_rebate, pricing_renewal_and_termination]
    overwrite:
      - base_policy: pricing_evt_rebate
        superseded_clause: >-
          Where termination_rebate_forfeit is true, an early termination forfeits the whole unpaid rebate balance on the termination effective date; expiry at the end of a term forfeits nothing and the final period's rebate is paid normally.
        replaced_by: >-
          For an early termination this policy books, and only for such a termination, the termination forfeits only the termination period's net rebate less the reliefs this rule sets, and the unpaid rebate of every earlier rebate period stays on the rebate ledger unforfeited; every other early termination on such a tier still forfeits the whole unpaid rebate balance on the termination effective date, and expiry at the end of a term still forfeits nothing and the final period's rebate is paid normally.
    trigger: state_due
    subject: [pricing_rebate_reversed]
    computes: amount
    target_tool: book_termination_rebate_forfeiture_47cc59ce
    params:
      termination_window_days: 92
      attainment_window_months: 12
      high_attainment_from: 1.5
      high_attainment_relief: 0.3
      sliding_relief_factor: 0.6
      long_tenure_months: 30
      mid_tenure_months: 18
      long_tenure_share: 0.1
      mid_tenure_share: 0.05
      long_notice_extra_days: 90
      long_notice_share: 0.05
      short_notice_share: 0.025
      both_programs_share: 0.1
      one_program_share: 0.05
      late_period_days: 31
      period_end_share: 0.05
      late_period_share: 0.025
    rule: >-
      This policy books the rebate forfeiture of an agreement whose status is terminated after the customer's early termination, on a tier whose termination_rebate_forfeit is true, where the termination effective date falls on one of the termination_window_days days before the date of the agreement's latest rebate accrual, so that the latest accrued rebate period is the period in which the termination took effect (the termination period).
      For an early termination this policy books, and only for such a termination, the termination forfeits only the termination period's net rebate less the reliefs this rule sets, and the unpaid rebate of every earlier rebate period stays on the rebate ledger unforfeited; every other early termination on such a tier still forfeits the whole unpaid rebate balance on the termination effective date, and expiry at the end of a term still forfeits nothing and the final period's rebate is paid normally.
      The forfeiture is fixed only after the rebate ledger carries a clawback entry for the customer's most recently received return whenever that return is of termination-period merchandise received after the termination period's accrual.
      The termination period's net rebate is the rebate accrued for the termination period less every payout and every reversal already booked against that period.
      The forfeiture is the termination period's net rebate; it is never below 0.00 and is rounded half up to the cent once, on the final figure.
      Whole months between two dates are the difference in calendar months between them, less one when the later date's day of the month is earlier than the earlier date's; calendar days from one date to another count the later date and not the earlier one; wherever this rule takes the latest or most recent record of a kind, it is the one with the latest date, and among records of the same date the one recorded first.
      The commitment relief follows the agreement's commitment attainment, which is the qualifying spend on the agreement's rebate accruals dated less than attainment_window_months whole months before the handling date divided by the agreement's annual spend commitment (an agreement with no commitment has an attainment of 0): an attainment of high_attainment_from or more takes a commitment relief of high_attainment_relief times the termination period's net rebate; an attainment of at least 1 and below high_attainment_from takes a sliding commitment relief of the termination period's net rebate times the part of the attainment above 1 times sliding_relief_factor; a lower attainment takes no commitment relief.
      The tenure relief follows the whole months from the agreement effective date to the termination effective date: long_tenure_months or more takes long_tenure_share times the termination period's net rebate, at least mid_tenure_months and fewer than long_tenure_months takes mid_tenure_share times it, and fewer months take no tenure relief.
      The notice relief follows the extra notice, which is the calendar days from the date the customer's written termination notice was received to the termination effective date less the tier's early_termination_notice_days: long_notice_extra_days or more extra days take long_notice_share times the termination period's net rebate, at least 1 and fewer than long_notice_extra_days extra days take short_notice_share times it, and fewer than one extra day takes no notice relief.
      The program relief follows the programs the customer keeps with Corbett: an active StockSmart program together with an active VendPoint machine takes both_programs_share times the termination period's net rebate, an active StockSmart program or an active VendPoint machine without the other takes one_program_share times it, and neither takes no program relief.
      The alignment relief follows where the termination effective date sits in the termination period: a termination effective on the period's last day, so that the latest accrual is dated the next day, takes period_end_share times the termination period's net rebate; a termination effective on one of the late_period_days days before the date of the latest accrual other than the period's last day takes late_period_share times it; an earlier termination takes no alignment relief.
      The reliefs this policy sets are added together and subtracted once from the termination period's net rebate before that floor and that rounding are applied; an early termination outside this policy's scope is not booked under it.
    prerequisite:
      - problem: pricing_ext_return_clawback
        kind: value_input
        gate: term_net
        form: state
        policy_source: >-
          The forfeiture is fixed only after the rebate ledger carries a clawback entry for the customer's most recently received return whenever that return is of termination-period merchandise received after the termination period's accrual.
        condition: >-
          When the customer's most recently received return was received after the termination period's accrual for a line shipped within that period, a rebate reversal line on the agreement carries its RMA number against the termination period.
        resolved_by: book_rebate_return_clawback_ccd0c1e2
        effect: >-
          The clawback entry is a reversal booked against the termination period, so the termination period's net rebate (term_net) falls by the clawback amount and every relief and the forfeiture are worked out on the lower figure.
    cross_category:
      - category: vmi
        as: existence
        reads: [status]
        note: Whether the customer keeps an active StockSmart program decides the program relief.
      - category: vending
        as: existence
        reads: [status]
        note: Whether the customer keeps an active VendPoint machine decides the program relief.
    compute:
      - term_period: "LATEST('pricing_rebates', 'rebate_period', event_type='pricing_rebate_accrued')"
      - term_acc_date: "LATEST('pricing_rebates', 'event_date', event_type='pricing_rebate_accrued')"
      - term_accrued: "SUM('pricing_rebates', 'amount', event_type='pricing_rebate_accrued', rebate_period=term_period)"
      - term_reversed: "SUM('pricing_rebates', 'amount', event_type='pricing_rebate_reversed', rebate_period=term_period)"
      - term_paid: "SUM('pricing_rebates', 'amount', event_type='pricing_rebate_paid', rebate_period=term_period)"
      - term_net: "term_accrued - term_paid - term_reversed"
      - closed: "F('closed_date')"
      - end_gap: "DAYS(closed, term_acc_date) if (closed and term_acc_date) else 0"
      - in_scope: "1 if (F('status') == 'terminated' and P('termination_rebate_forfeit') == True and end_gap >= 1 and end_gap <= K('termination_window_days')) else 0"
      - att_spend: "SUM('pricing_rebates', 'qualifying_spend', within_months=K('attainment_window_months'), event_type='pricing_rebate_accrued')"
      - attainment: "att_spend / F('annual_spend_commitment') if (F('annual_spend_commitment') or 0) > 0 else 0"
      - commitment_relief: "term_net * K('high_attainment_relief') if attainment >= K('high_attainment_from') else (term_net * (attainment - 1) * K('sliding_relief_factor') if attainment >= 1 else 0)"
      - tenure_months: "MONTHS(F('effective_date'), closed) if (F('effective_date') and closed) else 0"
      - tenure_relief: "term_net * K('long_tenure_share') if tenure_months >= K('long_tenure_months') else (term_net * K('mid_tenure_share') if tenure_months >= K('mid_tenure_months') else 0)"
      - extra_notice: "DAYS(F('termination_notice_date'), closed) - P('early_termination_notice_days') if (F('termination_notice_date') and closed) else 0"
      - notice_relief: "term_net * K('long_notice_share') if extra_notice >= K('long_notice_extra_days') else (term_net * K('short_notice_share') if extra_notice >= 1 else 0)"
      - has_vmi: "EXISTS('vmi', status='active')"
      - has_vend: "EXISTS('vending', status='active')"
      - program_relief: "term_net * K('both_programs_share') if (has_vmi and has_vend) else (term_net * K('one_program_share') if (has_vmi or has_vend) else 0)"
      - align_gap: "DAYS(closed, term_acc_date) if (closed and term_acc_date) else 0"
      - alignment_relief: "term_net * K('period_end_share') if align_gap == 1 else (term_net * K('late_period_share') if (align_gap >= 2 and align_gap <= K('late_period_days')) else 0)"
      - relief_total: "commitment_relief + tenure_relief + notice_relief + program_relief + alignment_relief"
      - result: "RND(in_scope * MX(0, term_net - relief_total), 2)"
    compute_basis:
      term_period: "so that the latest accrued rebate period is the period in which the termination took effect (the termination period)."
      term_acc_date: "where the termination effective date falls on one of the termination_window_days days before the date of the agreement's latest rebate accrual,"
      term_accrued: "The termination period's net rebate is the rebate accrued for the termination period less every payout and every reversal already booked against that period."
      term_reversed: "The termination period's net rebate is the rebate accrued for the termination period less every payout and every reversal already booked against that period."
      term_paid: "The termination period's net rebate is the rebate accrued for the termination period less every payout and every reversal already booked against that period."
      term_net: "The termination period's net rebate is the rebate accrued for the termination period less every payout and every reversal already booked against that period."
      closed: "where the termination effective date falls on one of the termination_window_days days before the date of the agreement's latest rebate accrual,"
      end_gap: "where the termination effective date falls on one of the termination_window_days days before the date of the agreement's latest rebate accrual,"
      in_scope: "This policy books the rebate forfeiture of an agreement whose status is terminated after the customer's early termination, on a tier whose termination_rebate_forfeit is true, where the termination effective date falls on one of the termination_window_days days before the date of the agreement's latest rebate accrual, so that the latest accrued rebate period is the period in which the termination took effect (the termination period)."
      att_spend: "which is the qualifying spend on the agreement's rebate accruals dated less than attainment_window_months whole months before the handling date divided by the agreement's annual spend commitment (an agreement with no commitment has an attainment of 0):"
      attainment: "which is the qualifying spend on the agreement's rebate accruals dated less than attainment_window_months whole months before the handling date divided by the agreement's annual spend commitment (an agreement with no commitment has an attainment of 0):"
      commitment_relief: "an attainment of high_attainment_from or more takes a commitment relief of high_attainment_relief times the termination period's net rebate; an attainment of at least 1 and below high_attainment_from takes a sliding commitment relief of the termination period's net rebate times the part of the attainment above 1 times sliding_relief_factor; a lower attainment takes no commitment relief."
      tenure_months: "The tenure relief follows the whole months from the agreement effective date to the termination effective date:"
      tenure_relief: "long_tenure_months or more takes long_tenure_share times the termination period's net rebate, at least mid_tenure_months and fewer than long_tenure_months takes mid_tenure_share times it, and fewer months take no tenure relief."
      extra_notice: "The notice relief follows the extra notice, which is the calendar days from the date the customer's written termination notice was received to the termination effective date less the tier's early_termination_notice_days:"
      notice_relief: "long_notice_extra_days or more extra days take long_notice_share times the termination period's net rebate, at least 1 and fewer than long_notice_extra_days extra days take short_notice_share times it, and fewer than one extra day takes no notice relief."
      has_vmi: "an active StockSmart program together with an active VendPoint machine takes both_programs_share times the termination period's net rebate,"
      has_vend: "an active StockSmart program together with an active VendPoint machine takes both_programs_share times the termination period's net rebate,"
      program_relief: "The program relief follows the programs the customer keeps with Corbett: an active StockSmart program together with an active VendPoint machine takes both_programs_share times the termination period's net rebate, an active StockSmart program or an active VendPoint machine without the other takes one_program_share times it, and neither takes no program relief."
      align_gap: "The alignment relief follows where the termination effective date sits in the termination period:"
      alignment_relief: "a termination effective on the period's last day, so that the latest accrual is dated the next day, takes period_end_share times the termination period's net rebate; a termination effective on one of the late_period_days days before the date of the latest accrual other than the period's last day takes late_period_share times it; an earlier termination takes no alignment relief."
      relief_total: "The reliefs this policy sets are added together and subtracted once from the termination period's net rebate before that floor and that rounding are applied;"
      result: "The forfeiture is the termination period's net rebate; it is never below 0.00 and is rounded half up to the cent once, on the final figure."
    factors:
      - id: commitment_attainment_relief
        effect: method
        decides: commitment_relief
        bindings: [att_spend, attainment, commitment_relief]
        ladder:
          - when: "the commitment attainment is high_attainment_from or more"
            method: "a fixed relief of high_attainment_relief times the termination period's net rebate"
          - when: "the commitment attainment is at least 1 and below high_attainment_from"
            method: "a sliding relief of the termination period's net rebate times the part of the attainment above 1 times sliding_relief_factor"
          - when: "otherwise"
            method: "no commitment relief"
        baseline:
          commitment_relief: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: tenure_relief_share
        effect: parameter
        decides: tenure_relief
        bindings: [tenure_months, tenure_relief]
        ladder:
          - when: "long_tenure_months or more whole months from the agreement effective date to the termination effective date"
            value: "K('long_tenure_share')"
          - when: "at least mid_tenure_months and fewer than long_tenure_months such months"
            value: "K('mid_tenure_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_relief: "0"
        evidence: [date]
        cross_difficulty: null
      - id: extra_notice_relief
        effect: parameter
        decides: notice_relief
        bindings: [extra_notice, notice_relief]
        ladder:
          - when: "long_notice_extra_days or more extra notice days"
            value: "K('long_notice_share')"
          - when: "at least 1 and fewer than long_notice_extra_days extra notice days"
            value: "K('short_notice_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          notice_relief: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: kept_program_relief
        effect: parameter
        decides: program_relief
        bindings: [has_vmi, has_vend, program_relief]
        ladder:
          - when: "an active StockSmart program and an active VendPoint machine"
            value: "K('both_programs_share')"
          - when: "an active StockSmart program or an active VendPoint machine, without the other"
            value: "K('one_program_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          program_relief: "0"
        evidence: [cross_category]
        cross_difficulty: vmi
      - id: period_alignment_relief
        effect: parameter
        decides: alignment_relief
        bindings: [align_gap, alignment_relief]
        ladder:
          - when: "the termination is effective on the termination period's last day"
            value: "K('period_end_share')"
          - when: "the termination is effective on one of the late_period_days days before the latest accrual's date, other than the period's last day"
            value: "K('late_period_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          alignment_relief: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The termination period's net rebate is the rebate accrued for the termination period less every payout and every reversal already booked against that period.
        The forfeiture is the termination period's net rebate; it is never below 0.00 and is rounded half up to the cent once, on the final figure.
      params: []
    inputs:
      history:
        - {table: pricing_rebates, aggregate: sum, field: amount, filters: {event_type: pricing_rebate_accrued}}
        - {table: pricing_rebates, aggregate: sum, field: amount, filters: {event_type: pricing_rebate_reversed}}
        - {table: pricing_rebates, aggregate: sum, field: qualifying_spend, within_months: 12, filters: {event_type: pricing_rebate_accrued}}
      cross_category: [vmi, vending]
  - id: pricing_ext_final_rebate_check
    base_policy_refs: [pricing_evt_rebate]
    overwrite:
      - base_policy: pricing_evt_rebate
        superseded_clause: >-
          The rebate balance is paid within rebate_payout_days_after_period days after the period end by the payout method the customer chose from rebate_payout_methods; a balance below rebate_min_payout_usd carries forward to the next period instead of being paid.
        replaced_by: >-
          For a final check this policy issues, and only for such a check, the check pays the unpaid rebate balance less the holdbacks this rule sets, the amounts held back stay in the rebate balance, and a check below rebate_min_payout_usd is not issued; every other payout still pays the rebate balance within rebate_payout_days_after_period days after the period end by the payout method the customer chose from rebate_payout_methods, and a balance below rebate_min_payout_usd still carries forward to the next period instead of being paid.
    trigger: on_request
    subject: [pricing_rebate_paid]
    computes: amount
    target_tool: request_final_rebate_check_d4aa8dfe
    params:
      reserve_window_months: 3
      reserve_high_count: 3
      reserve_high_value: 5000.0
      reserve_low_value: 1000.0
      reserve_high_pct: 4.0
      reserve_low_pct: 2.0
      exposure_high_ratio: 0.9
      exposure_mid_ratio: 0.75
      exposure_high_pct: 5.0
      exposure_mid_pct: 2.5
      terms_window_months: 12
      terms_high_count: 3
      terms_high_pct: 3.0
      terms_low_pct: 1.5
      admin_flat_from_months: 6
      admin_flat_usd: 350.0
      admin_per_month_usd: 50.0
      open_fault_share: 0.5
      returned_window_months: 12
      returned_high_count: 2
      returned_high_pct: 3.0
      returned_low_pct: 1.0
    rule: >-
      This policy issues the final rebate check on an agreement whose status is terminated after the customer's early termination, on a tier whose rebate_payout_methods include check, when the customer asks for the unpaid rebate to be paid by check.
      For a final check this policy issues, and only for such a check, the check pays the unpaid rebate balance less the holdbacks this rule sets, the amounts held back stay in the rebate balance, and a check below rebate_min_payout_usd is not issued; every other payout still pays the rebate balance within rebate_payout_days_after_period days after the period end by the payout method the customer chose from rebate_payout_methods, and a balance below rebate_min_payout_usd still carries forward to the next period instead of being paid.
      On an agreement terminated early, the final rebate check is not issued until the rebate ledger carries the forfeiture entry for the rebate period in which the termination took effect.
      The final check pays the agreement's unpaid rebate balance, which is the rebate accrued on the agreement less every payout and every reversal on its rebate ledger.
      The final check is never below 0.00 and is rounded half up to the cent once, on the final figure.
      A final check below rebate_min_payout_usd is not issued and the balance carries forward.
      Whole months between two dates are the difference in calendar months between them, less one when the later date's day of the month is earlier than the earlier date's; calendar days from one date to another count the later date and not the earlier one; wherever this rule takes the latest or most recent record of a kind, it is the one with the latest date, and among records of the same date the one recorded first.
      The payout line of a final check is recorded against the agreement's latest accrued rebate period.
      The returns reserve follows the return receipt lines the customer's ship-tos received less than reserve_window_months whole months before the handling date and the return credit on them: reserve_high_count or more lines together with reserve_high_value or more of return credit hold back reserve_high_pct percent of the unpaid rebate balance; at least one line together with at least reserve_low_value of return credit, without both of the higher thresholds, holds back reserve_low_pct percent of it; anything less holds back no returns reserve.
      The exposure holdback follows the receivable balance of the customer's Commercial Credit Account (a customer holds one) as a share of its credit limit: a share of exposure_high_ratio or more holds back exposure_high_pct percent of the unpaid rebate balance; a share of at least exposure_mid_ratio and below exposure_high_ratio holds back exposure_mid_pct percent of it; a lower share, or no credit limit on record, holds back no exposure holdback.
      The terms holdback follows the late payment finance charges assessed on the Commercial Credit Account less than terms_window_months whole months before the handling date: terms_high_count or more such charges hold back terms_high_pct percent of the unpaid rebate balance; at least one and fewer than terms_high_count hold back terms_low_pct percent of it; none hold back no terms holdback.
      The administration holdback follows the whole months of the term that remained after the termination effective date, counted to the expiration date: admin_flat_from_months or more remaining months hold back the flat admin_flat_usd; at least one and fewer than admin_flat_from_months remaining months hold back admin_per_month_usd for each remaining month; no remaining month holds back no administration holdback.
      The open-return holdback follows the customer's most recently authorized return while no receipt, decline or no-credit closing has been recorded for it: when its reason is a customer reason (ordered in error or no longer needed) it holds back the authorized quantity times the invoiced unit price times the rebate rate of the agreement's latest accrual divided by 100; when its reason is a defective item or damage in transit it holds back open_fault_share times that figure; any other reason, a settled return or no authorized return holds back no open-return holdback.
      The returned-payment holdback follows the customer payments the bank returned on the Commercial Credit Account less than returned_window_months whole months before the handling date: returned_high_count or more hold back returned_high_pct percent of the unpaid rebate balance; at least one and fewer than returned_high_count hold back returned_low_pct percent of it; none hold back no returned-payment holdback.
      The holdbacks this policy sets are added together and subtracted once from the unpaid rebate balance before that floor, that rounding and that minimum are applied.
    prerequisite:
      - problem: pricing_ext_termination_forfeiture
        kind: value_input
        gate: bal
        form: state
        policy_source: >-
          On an agreement terminated early, the final rebate check is not issued until the rebate ledger carries the forfeiture entry for the rebate period in which the termination took effect.
        condition: >-
          The agreement's rebate ledger carries a reversal line whose source reference is the agreement number, booked against the rebate period in which the termination took effect.
        resolved_by: book_termination_rebate_forfeiture_47cc59ce
        effect: >-
          The forfeiture entry lowers the agreement's unpaid rebate balance (bal) by the forfeited amount, so every holdback and the check are worked out on the kept balance.
    cross_category:
      - category: order
        as: history
        reads: [order_returns.event_type, order_returns.credit_amount, order_returns.rma_number, order_returns.return_reason, order_returns.quantity, order_returns.unit_price]
        note: Return receipts in the reserve window decide the returns reserve; the latest authorization and its settlement lines decide the open-return holdback.
      - category: credit
        as: history
        reads: [ar_balance, credit_limit, credit_transactions.event_type, credit_transactions.charge_type]
        note: The receivable balance and credit limit decide the exposure holdback; finance charges and returned payments in the ledger decide the terms and returned-payment holdbacks.
    compute:
      - bal: "SUM('pricing_rebates', 'amount', event_type='pricing_rebate_accrued') - SUM('pricing_rebates', 'amount', event_type='pricing_rebate_paid') - SUM('pricing_rebates', 'amount', event_type='pricing_rebate_reversed')"
      - in_scope: "1 if (F('status') == 'terminated' and 'check' in P('rebate_payout_methods')) else 0"
      - n_ret: "XCOUNT('order', 'order_returns', within_months=K('reserve_window_months'), event_type='order_return_received')"
      - v_ret: "XSUM('order', 'order_returns', 'credit_amount', within_months=K('reserve_window_months'), event_type='order_return_received')"
      - reserve_hold: "bal * K('reserve_high_pct') / 100 if (n_ret >= K('reserve_high_count') and v_ret >= K('reserve_high_value')) else (bal * K('reserve_low_pct') / 100 if (n_ret >= 1 and v_ret >= K('reserve_low_value')) else 0)"
      - ar: "CFIELD('credit', 'ar_balance') or 0"
      - limit: "CFIELD('credit', 'credit_limit') or 0"
      - exposure: "ar / limit if limit > 0 else 0"
      - exposure_hold: "bal * K('exposure_high_pct') / 100 if exposure >= K('exposure_high_ratio') else (bal * K('exposure_mid_pct') / 100 if exposure >= K('exposure_mid_ratio') else 0)"
      - fc_count: "XCOUNT('credit', 'credit_transactions', within_months=K('terms_window_months'), date_field='txn_date', event_type='credit_charge_assessed', charge_type='finance_charge')"
      - terms_hold: "bal * K('terms_high_pct') / 100 if fc_count >= K('terms_high_count') else (bal * K('terms_low_pct') / 100 if fc_count >= 1 else 0)"
      - months_left: "MONTHS(F('closed_date'), F('expiration_date')) if (F('closed_date') and F('expiration_date')) else 0"
      - admin_hold: "K('admin_flat_usd') if months_left >= K('admin_flat_from_months') else (K('admin_per_month_usd') * months_left if months_left >= 1 else 0)"
      - open_rma: "XLATEST('order', 'order_returns', 'rma_number', event_type='order_return_authorized')"
      - open_settled: "XCOUNT('order', 'order_returns', rma_number=open_rma, event_type='order_return_received') + XCOUNT('order', 'order_returns', rma_number=open_rma, event_type='order_return_declined') + XCOUNT('order', 'order_returns', rma_number=open_rma, event_type='order_return_closed_no_credit')"
      - open_reason: "XLATEST('order', 'order_returns', 'return_reason', rma_number=open_rma, event_type='order_return_authorized')"
      - open_qty: "XSUM('order', 'order_returns', 'quantity', rma_number=open_rma, event_type='order_return_authorized')"
      - open_price: "XLATEST('order', 'order_returns', 'unit_price', rma_number=open_rma, event_type='order_return_authorized') or 0"
      - open_rate: "LATEST('pricing_rebates', 'rebate_rate_pct', event_type='pricing_rebate_accrued') or 0"
      - open_hold: "open_qty * open_price * open_rate / 100 if (open_rma and open_settled == 0 and (open_reason == 'ordered_in_error' or open_reason == 'no_longer_needed')) else (open_qty * open_price * open_rate / 100 * K('open_fault_share') if (open_rma and open_settled == 0 and (open_reason == 'defective' or open_reason == 'damaged_in_transit')) else 0)"
      - rp_count: "XCOUNT('credit', 'credit_transactions', within_months=K('returned_window_months'), date_field='txn_date', event_type='credit_payment_returned')"
      - returned_hold: "bal * K('returned_high_pct') / 100 if rp_count >= K('returned_high_count') else (bal * K('returned_low_pct') / 100 if rp_count >= 1 else 0)"
      - holds: "reserve_hold + exposure_hold + terms_hold + admin_hold + open_hold + returned_hold"
      - check_amt: "MX(0, bal - holds)"
      - result: "RND(in_scope * check_amt, 2) if RND(check_amt, 2) >= P('rebate_min_payout_usd') else 0"
    compute_basis:
      bal: "The final check pays the agreement's unpaid rebate balance, which is the rebate accrued on the agreement less every payout and every reversal on its rebate ledger."
      in_scope: "This policy issues the final rebate check on an agreement whose status is terminated after the customer's early termination, on a tier whose rebate_payout_methods include check, when the customer asks for the unpaid rebate to be paid by check."
