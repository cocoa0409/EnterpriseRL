        decides: exposure_hold
        bindings: [ar, limit, exposure, exposure_hold]
        ladder:
          - when: "the receivable balance is exposure_high_ratio or more of the credit limit"
            value: "K('exposure_high_pct')"
          - when: "the receivable balance is at least exposure_mid_ratio and below exposure_high_ratio of the credit limit"
            value: "K('exposure_mid_pct')"
          - when: "otherwise"
            value: "0"
