        replaced_by: >-
          For a substitute line this policy adds, and only for such a line, no special pricing quote is involved and the line is added at the protected price; every other item is still added at the price of an accepted Corbett special pricing quote, returned within special_pricing_request_business_days business days of the request, and the quote is still accepted no later than special_pricing_quote_validity_days calendar days after the quote date.
