  - id: pricing_ext_discontinued_closeout
    base_policy_refs: [pricing_evt_contract_items, pricing_price_basis]
    overwrite:
      - base_policy: pricing_evt_contract_items
        superseded_clause: >-
          Corbett removes an item only after giving contract_item_removal_notice_days calendar days of notice, counted from the notice date; a customer may ask for removal of an item effective the next ship date.
        replaced_by: >-
          For a discontinued item this policy closes out, and only for such an item, the removal takes effect on the discontinuation date without a notice period; every other removal by Corbett still takes effect only after contract_item_removal_notice_days calendar days of notice, counted from the notice date, and a customer may still ask for removal of an item effective the next ship date.
    trigger: state_due
    subject: [pricing_item_removed]
