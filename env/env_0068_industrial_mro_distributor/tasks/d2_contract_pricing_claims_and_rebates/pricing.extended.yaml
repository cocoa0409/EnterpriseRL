    target_tool: close_out_discontinued_item_dd8bcab8
    params:
      recent_escalation_days: 30
      usage_window_months: 12
      usage_high_units: 500
      usage_mid_units: 200
      usage_high_pct: 1.0
      usage_mid_pct: 0.5
      stranded_high_units: 100
      stranded_high_pct: 1.5
      stranded_low_pct: 0.75
      gap_high_pct: 15.0
      gap_low_pct: 5.0
      gap_high_off: 1.0
      gap_low_off: 0.5
    rule: >-
      This policy records the close-out of a contract item the manufacturer discontinued: the item of the latest backorder on the customer's ship-tos, when the agreement carries an added price line for that item, that backorder was filled with a Corbett-approved substitute of another item number and the agreement carries no removal line for the item yet; the discontinuation date is the ship date of that substitute fill.
      The close-out is a removal line effective on the discontinuation date that records, as the contract unit price that ends, the close-out price this rule works out.
      For a discontinued item this policy closes out, and only for such an item, the removal takes effect on the discontinuation date without a notice period; every other removal by Corbett still takes effect only after contract_item_removal_notice_days calendar days of notice, counted from the notice date, and a customer may still ask for removal of an item effective the next ship date.
      The close-out price of a discontinued item is fixed only after the price claim most recently filed on that item carries a decision.
      The close-out price is the contract unit price on the discontinued item's latest price line; it is rounded half up to four decimal places once, on the final figure.
      Whole months between two dates are the difference in calendar months between them, less one when the later date's day of the month is earlier than the earlier date's; calendar days from one date to another count the later date and not the earlier one; wherever this rule takes the latest or most recent record of a kind, it is the one with the latest date, and among records of the same date the one recorded first.
      Where the latest decision recorded on a price claim for the item, dated on or after the effective date of the item's latest price line, records the unit price the agreement sets, the close-out price is instead that decided price; where no such decision exists and the item's latest price line is an annual escalation that took effect on one of the recent_escalation_days days before the discontinuation date, the close-out price is instead that line's prior unit price; otherwise it is the contract unit price on the item's latest price line.
      The usage concession follows the units of the discontinued item shipped to the customer's ship-tos less than usage_window_months whole months before the handling date: usage_high_units or more take usage_high_pct percent off, at least usage_mid_units and fewer than usage_high_units take usage_mid_pct percent off, and fewer take nothing off.
      The stranded-order concession follows the quantity of the discontinued item's latest backorder that was filled with the substitute: stranded_high_units or more take stranded_high_pct percent off, at least one and fewer than stranded_high_units take stranded_low_pct percent off, and none take nothing off.
      The substitute-gap concession follows how far the substitute's unit price on its latest regular shipment stands above the contract unit price on the discontinued item's latest price line: gap_high_pct percent or more takes gap_high_off percent off, at least gap_low_pct and below gap_high_pct percent takes gap_low_off percent off, and less takes nothing off.
      The concessions this policy sets are added together and taken off the close-out price once, before that rounding; an item outside this policy's scope is not closed out under it.
