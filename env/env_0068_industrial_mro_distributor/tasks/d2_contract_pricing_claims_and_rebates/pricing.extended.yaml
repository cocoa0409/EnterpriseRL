  - id: pricing_ext_substitute_claim
    base_policy_refs: [pricing_evt_price_claim]
    overwrite:
      - base_policy: pricing_evt_price_claim
        superseded_clause: >-
          The claim amount is the billed unit price less the unit price the agreement sets for the line's ship date, times the quantity billed, rounded half up to the cent; the agreement in force is the one whose status covered the ship date, not the one in force on the claim date.
        replaced_by: >-
          For a substitute claim this policy works out, and only for such a claim, the claim amount is the one this rule works out; every other claim amount is still the billed unit price less the unit price the agreement sets for the line's ship date, times the quantity billed, rounded half up to the cent, and the agreement in force is still the one whose status covered the ship date, not the one in force on the claim date.
    trigger: on_request
    subject: [pricing_claim_filed]
    computes: claim_amount
    target_tool: file_contract_price_claim_992a36b2
    params:
      invoice_window_days: 30
      repeat_high_count: 2
      repeat_high_pct: 5.0
      repeat_low_pct: 2.5
      carry_long_days: 30
      carry_long_pct: 1.5
      carry_short_pct: 0.75
      prompt_claim_days: 30
      late_claim_days: 60
      prompt_claim_pct: 1.0
      late_claim_pct: 0.5
    rule: >-
      This policy works out the contract price claim the customer files, on the customer's most recent invoice, for the latest regular shipment of the Corbett-approved substitute that filled the latest backorder on the customer's ship-tos, when that invoice is dated on the shipment's ship date or within invoice_window_days days after it and the shipment's ship date falls on or after the effective date of the substitute's protection line and fewer than the tier's discontinued_item_price_protection_days days after it.
      For a substitute claim this policy works out, and only for such a claim, the claim amount is the one this rule works out; every other claim amount is still the billed unit price less the unit price the agreement sets for the line's ship date, times the quantity billed, rounded half up to the cent, and the agreement in force is still the one whose status covered the ship date, not the one in force on the claim date.
      A claim on a substitute line billed during its protection is fixed only after the records carry the substitute's protection line.
      The claim's overbilling per unit is the billed unit price on the shipment less the protected price on the substitute's protection line, never below 0.
      The claim quantity is the quantity billed on the shipment.
      The claim amount is the overbilling per unit times the claim quantity; it is rounded half up to the cent once, on the final figure.
      Calendar days from one date to another count the later date and not the earlier one; wherever this rule takes the latest or most recent record of a kind, it is the one with the latest date, and among records of the same date the one recorded first.
      Where a return receipt for the shipment's order line is on record, the claim quantity is instead the quantity billed less the quantity received back; where only a return authorization without a receipt is on record for that line, the claim quantity is instead the quantity billed less the quantity authorized; otherwise it is the quantity billed.
      The settlement multiplier follows how the invoice was billed and paid, with its tax rate being its sales tax over its merchandise subtotal and its discount rate being the prompt-payment cash discount earned on it over its merchandise subtotal: an invoice that carried sales tax and earned a discount takes one plus the tax rate less the discount rate, the discount having been earned on the merchandise only and never on the sales tax; one that carried sales tax without a discount takes one plus the tax rate; one that earned a discount without sales tax takes one less the discount rate; any other invoice takes 1.
      The repeat-overbilling credit follows the earlier price claims filed on the agreement for the substitute or for the discontinued item it replaced: repeat_high_count or more earlier claims take repeat_high_pct percent, at least one and fewer than repeat_high_count take repeat_low_pct percent, and none take no credit.
      The paid-invoice credit follows the payment of the invoice: an invoice whose payments, earned discount and applied credit memos cover its amount, with its latest payment carry_long_days or more days before the handling date, takes carry_long_pct percent; one covered with its latest payment fewer days before takes carry_short_pct percent; an invoice not yet covered, or covered without any customer payment on it, takes no credit.
      The prompt-claim credit follows the calendar days from the invoice date to the handling date: prompt_claim_days or fewer take prompt_claim_pct percent, more than prompt_claim_days and no more than late_claim_days take late_claim_pct percent, and more take no credit.
      The multiplier this policy sets multiplies the unrounded claim amount, and every credit this policy sets adds its percent of that same unrounded claim amount, before that rounding; a shipment outside this policy's scope is not claimed under it.
    prerequisite:
      - problem: pricing_ext_substitute_protection
        kind: value_input
        gate: prot_price
        form: state
        policy_source: >-
          A claim on a substitute line billed during its protection is fixed only after the records carry the substitute's protection line.
        condition: >-
          The agreement carries a pricing_item_added line for the substitute's item number whose change reason is the discontinued item's substitute, effective on or before the shipment's ship date.
        resolved_by: protect_substitute_price_656c6d72
        effect: >-
          The protection line supplies the protected price (prot_price) and its effective date; without it the overbilling per unit has no protected price to stand on and the shipment is outside the protection window.
    cross_category:
      - category: order
        as: history
        reads: [order_lines.sku, order_lines.backorder_reference, order_lines.event_date, order_lines.unit_price, order_lines.quantity, order_lines.order_number, order_lines.line_number, order_returns.quantity, order_returns.event_type]
        note: The substitute fill and its latest regular shipment fix the claimed line; its return receipt or authorization decides the claim quantity.
      - category: credit
        as: history
        reads: [credit_transactions.document_number, credit_transactions.txn_date, credit_transactions.amount, credit_transactions.merchandise_amount, credit_transactions.tax_amount, credit_transactions.event_type]
        note: The most recent invoice, its tax, its earned discount, its payments and memos decide the settlement multiplier, the paid-invoice credit and the prompt-claim credit.
    compute:
      - fill_item: "XLATEST('order', 'order_lines', 'sku', event_type='order_line_backordered')"
      - fill_reference: "XLATEST('order', 'order_lines', 'backorder_reference', event_type='order_line_backordered')"
      - claim_sku: "XLATEST('order', 'order_lines', 'sku', event_type='order_backorder_filled', backorder_reference=fill_reference)"
      - ship_date: "XLATEST('order', 'order_lines', 'event_date', event_type='order_line_shipped', sku=claim_sku)"
      - ship_order: "XLATEST('order', 'order_lines', 'order_number', event_type='order_line_shipped', sku=claim_sku)"
      - ship_line: "XLATEST('order', 'order_lines', 'line_number', event_type='order_line_shipped', sku=claim_sku)"
      - billed_price: "XLATEST('order', 'order_lines', 'unit_price', event_type='order_line_shipped', sku=claim_sku) or 0"
      - billed_qty: "XLATEST('order', 'order_lines', 'quantity', event_type='order_line_shipped', sku=claim_sku) or 0"
      - prot_price: "LATEST('pricing_items', 'contract_unit_price', date_field='effective_date', sku=claim_sku, change_reason='discontinued_substitute') or 0"
      - prot_eff: "LATEST('pricing_items', 'effective_date', date_field='effective_date', sku=claim_sku, change_reason='discontinued_substitute')"
      - inv_no: "XLATEST('credit', 'credit_transactions', 'document_number', date_field='txn_date', event_type='credit_invoice_posted')"
      - inv_date: "XLATEST('credit', 'credit_transactions', 'txn_date', date_field='txn_date', event_type='credit_invoice_posted')"
      - in_scope: "1 if (claim_sku and claim_sku != fill_item and ship_date and prot_eff and inv_date and DAYS(prot_eff, ship_date) >= 0 and DAYS(prot_eff, ship_date) < P('discontinued_item_price_protection_days') and DAYS(ship_date, inv_date) >= 0 and DAYS(ship_date, inv_date) <= K('invoice_window_days')) else 0"
      - per_unit: "MX(0, billed_price - prot_price)"
      - rcv_qty: "XSUM('order', 'order_returns', 'quantity', event_type='order_return_received', order_number=ship_order, line_number=ship_line)"
      - auth_qty: "XSUM('order', 'order_returns', 'quantity', event_type='order_return_authorized', order_number=ship_order, line_number=ship_line)"
      - claim_qty: "billed_qty - rcv_qty if rcv_qty > 0 else (billed_qty - auth_qty if auth_qty > 0 else billed_qty)"
      - inv_merch: "XSUM('credit', 'credit_transactions', 'merchandise_amount', event_type='credit_invoice_posted', document_number=inv_no)"
      - inv_tax: "XSUM('credit', 'credit_transactions', 'tax_amount', event_type='credit_invoice_posted', document_number=inv_no)"
      - inv_disc: "XSUM('credit', 'credit_transactions', 'amount', event_type='credit_cash_discount_taken', applied_invoice_number=inv_no)"
      - settle_mult: "(1 + inv_tax / inv_merch - inv_disc / inv_merch) if (inv_merch > 0 and inv_tax > 0 and inv_disc > 0) else ((1 + inv_tax / inv_merch) if (inv_merch > 0 and inv_tax > 0) else ((1 - inv_disc / inv_merch) if (inv_merch > 0 and inv_disc > 0) else 1))"
      - earlier_claims: "COUNT('pricing_claims', event_type='pricing_claim_filed', sku=claim_sku) + COUNT('pricing_claims', event_type='pricing_claim_filed', sku=fill_item)"
      - repeat_pct: "K('repeat_high_pct') if earlier_claims >= K('repeat_high_count') else (K('repeat_low_pct') if earlier_claims >= 1 else 0)"
      - inv_amount: "XSUM('credit', 'credit_transactions', 'amount', event_type='credit_invoice_posted', document_number=inv_no)"
      - inv_paid: "XSUM('credit', 'credit_transactions', 'amount', event_type='credit_payment_received', applied_invoice_number=inv_no) + XSUM('credit', 'credit_transactions', 'amount', event_type='credit_cash_discount_taken', applied_invoice_number=inv_no) + XSUM('credit', 'credit_transactions', 'amount', event_type='credit_memo_issued', applied_invoice_number=inv_no)"
      - last_pay: "XLATEST('credit', 'credit_transactions', 'txn_date', date_field='txn_date', event_type='credit_payment_received', applied_invoice_number=inv_no)"
      - carry_pct: "K('carry_long_pct') if (inv_amount > 0 and inv_paid >= inv_amount - 0.005 and last_pay and DAYS(last_pay, NOW) >= K('carry_long_days')) else (K('carry_short_pct') if (inv_amount > 0 and inv_paid >= inv_amount - 0.005 and last_pay) else 0)"
      - claim_age: "DAYS(inv_date, NOW) if inv_date else 0"
      - prompt_pct: "K('prompt_claim_pct') if claim_age <= K('prompt_claim_days') else (K('late_claim_pct') if claim_age <= K('late_claim_days') else 0)"
      - result: "RND(in_scope * (per_unit * claim_qty * settle_mult + per_unit * claim_qty * (repeat_pct + carry_pct + prompt_pct) / 100), 2)"
    compute_basis:
      fill_item: "the latest regular shipment of the Corbett-approved substitute that filled the latest backorder on the customer's ship-tos,"
      fill_reference: "the latest regular shipment of the Corbett-approved substitute that filled the latest backorder on the customer's ship-tos,"
      claim_sku: "the latest regular shipment of the Corbett-approved substitute that filled the latest backorder on the customer's ship-tos,"
      ship_date: "and the shipment's ship date falls on or after the effective date of the substitute's protection line and fewer than the tier's discontinued_item_price_protection_days days after it."
      ship_order: "Where a return receipt for the shipment's order line is on record,"
      ship_line: "Where a return receipt for the shipment's order line is on record,"
      billed_price: "The claim's overbilling per unit is the billed unit price on the shipment less the protected price on the substitute's protection line, never below 0."
      billed_qty: "The claim quantity is the quantity billed on the shipment."
      prot_price: "The claim's overbilling per unit is the billed unit price on the shipment less the protected price on the substitute's protection line, never below 0."
      prot_eff: "and the shipment's ship date falls on or after the effective date of the substitute's protection line and fewer than the tier's discontinued_item_price_protection_days days after it."
      inv_no: "the contract price claim the customer files, on the customer's most recent invoice,"
      inv_date: "when that invoice is dated on the shipment's ship date or within invoice_window_days days after it"
      in_scope: "This policy works out the contract price claim the customer files, on the customer's most recent invoice, for the latest regular shipment of the Corbett-approved substitute that filled the latest backorder on the customer's ship-tos, when that invoice is dated on the shipment's ship date or within invoice_window_days days after it and the shipment's ship date falls on or after the effective date of the substitute's protection line and fewer than the tier's discontinued_item_price_protection_days days after it."
      per_unit: "The claim's overbilling per unit is the billed unit price on the shipment less the protected price on the substitute's protection line, never below 0."
      rcv_qty: "Where a return receipt for the shipment's order line is on record, the claim quantity is instead the quantity billed less the quantity received back;"
      auth_qty: "where only a return authorization without a receipt is on record for that line, the claim quantity is instead the quantity billed less the quantity authorized;"
      claim_qty: "Where a return receipt for the shipment's order line is on record, the claim quantity is instead the quantity billed less the quantity received back; where only a return authorization without a receipt is on record for that line, the claim quantity is instead the quantity billed less the quantity authorized; otherwise it is the quantity billed."
      inv_merch: "with its tax rate being its sales tax over its merchandise subtotal and its discount rate being the prompt-payment cash discount earned on it over its merchandise subtotal:"
      inv_tax: "with its tax rate being its sales tax over its merchandise subtotal"
      inv_disc: "its discount rate being the prompt-payment cash discount earned on it over its merchandise subtotal:"
      settle_mult: "an invoice that carried sales tax and earned a discount takes one plus the tax rate less the discount rate, the discount having been earned on the merchandise only and never on the sales tax; one that carried sales tax without a discount takes one plus the tax rate; one that earned a discount without sales tax takes one less the discount rate; any other invoice takes 1."
      earlier_claims: "The repeat-overbilling credit follows the earlier price claims filed on the agreement for the substitute or for the discontinued item it replaced:"
      repeat_pct: "repeat_high_count or more earlier claims take repeat_high_pct percent, at least one and fewer than repeat_high_count take repeat_low_pct percent, and none take no credit."
      inv_amount: "an invoice whose payments, earned discount and applied credit memos cover its amount,"
      inv_paid: "an invoice whose payments, earned discount and applied credit memos cover its amount,"
      last_pay: "with its latest payment carry_long_days or more days before the handling date,"
      carry_pct: "an invoice whose payments, earned discount and applied credit memos cover its amount, with its latest payment carry_long_days or more days before the handling date, takes carry_long_pct percent; one covered with its latest payment fewer days before takes carry_short_pct percent; an invoice not yet covered, or covered without any customer payment on it, takes no credit."
      claim_age: "The prompt-claim credit follows the calendar days from the invoice date to the handling date:"
      prompt_pct: "prompt_claim_days or fewer take prompt_claim_pct percent, more than prompt_claim_days and no more than late_claim_days take late_claim_pct percent, and more take no credit."
      result: "The multiplier this policy sets multiplies the unrounded claim amount, and every credit this policy sets adds its percent of that same unrounded claim amount, before that rounding; a shipment outside this policy's scope is not claimed under it."
    factors:
      - id: returned_quantity_basis
        effect: method
        decides: claim_qty
        bindings: [ship_order, ship_line, rcv_qty, auth_qty, claim_qty]
        ladder:
          - when: "a return receipt for the shipment's order line is on record"
            method: "the claim quantity is the quantity billed less the quantity received back"
          - when: "only a return authorization without a receipt is on record for that line"
            method: "the claim quantity is the quantity billed less the quantity authorized"
          - when: "otherwise"
            method: "the claim quantity is the quantity billed"
