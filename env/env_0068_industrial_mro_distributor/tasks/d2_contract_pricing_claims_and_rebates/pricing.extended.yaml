    rule: >-
      This policy adds the price protection line of the Corbett-approved substitute that filled the latest backorder on the customer's ship-tos for a contract item of another item number (one for which the agreement carries an added price line), when the agreement carries no price line for the substitute's item number yet: a line for the substitute's item number, with the change reason of a discontinued item's substitute, effective on the discontinuation date (the ship date of that substitute fill), at the protected price this rule works out.
      For a substitute this policy protects, and only for such a substitute, the substitute is billed at the protected price this rule works out for discontinued_item_price_protection_days days from the discontinuation date and is then added at its own quoted price or reverts to the discount basis; every other substitute of a discontinued contract item is still billed at the discontinued item's contract unit price for discontinued_item_price_protection_days days from the discontinuation and is then added at its own quoted price or reverts to the discount basis.
      For a substitute line this policy adds, and only for such a line, no special pricing quote is involved and the line is added at the protected price; every other item is still added at the price of an accepted Corbett special pricing quote, returned within special_pricing_request_business_days business days of the request, and the quote is still accepted no later than special_pricing_quote_validity_days calendar days after the quote date.
      The substitute's protected price is not set until the records carry the close-out line of the discontinued item it replaces.
      The protected price is the contract unit price that ends on the discontinued item's close-out line; it is rounded half up to four decimal places once, on the final figure.
      Whole months between two dates are the difference in calendar months between them, less one when the later date's day of the month is earlier than the earlier date's; calendar days from one date to another count the later date and not the earlier one; wherever this rule takes the latest or most recent record of a kind, it is the one with the latest date, and among records of the same date the one recorded first.
      Where the substitute's unit price on its latest regular shipment is below that ending price, the protected price is instead the substitute's own unit price; where it is gap_share_from_pct percent or more above the ending price, the protected price is instead the ending price plus the product of gap_share and the difference between the two; otherwise, or where the substitute has no regular shipment, it is the ending price.
      The adoption concession follows the units of the substitute shipped or filled to the customer's ship-tos less than adoption_window_months whole months before the handling date: adoption_high_units or more take adoption_high_pct percent off, at least one and fewer than adoption_high_units take adoption_low_pct percent off, and none take nothing off.
      The program concession follows the programs the customer keeps with Corbett: an active StockSmart program together with an active VendPoint machine take programs_both_pct percent off, an active StockSmart program or an active VendPoint machine without the other takes programs_one_pct percent off, and neither takes nothing off.
      The prompt-payment concession follows the prompt-payment cash discounts earned on the customer's Commercial Credit Account less than prompt_window_months whole months before the handling date: prompt_high_count or more take prompt_high_pct percent off, at least one and fewer than prompt_high_count take prompt_low_pct percent off, and none take nothing off.
      The tenure concession follows the whole months from the agreement's proposal date to the handling date: tenure_long_months or more take tenure_long_pct percent off, at least tenure_mid_months and fewer than tenure_long_months take tenure_mid_pct percent off, and fewer take nothing off.
      The concessions this policy sets are added together and taken off the protected price once, before that rounding; a substitute outside this policy's scope is not protected under it.
