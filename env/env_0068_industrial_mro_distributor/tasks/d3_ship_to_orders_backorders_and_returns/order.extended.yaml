# Policy charter: Ship-To Fulfillment Account (ship-to locations, order booking and shipping, freight and service fees, backorders, cancellations and returns).
category: order
display_name: Ship-To Fulfillment Account

binding:
  holding_table: ship_to_accounts
  event_tables: [order_lines, order_returns]
  status_field: status
  variant_field: variant_name
  quantity_fields: {open_backorder_value: backorder}

lifecycle:
  states: [pending_setup, active, suspended, closed]
  transitions:
    - {from: pending_setup, to: active, by: system, means: "Corbett Customer Care validates the delivery address and route territory and the ship-to opens for orders."}
    - {from: active, to: suspended, by: system, means: "A ship-to with no order for the tier's inactivity period is suspended; it keeps its history but takes no orders."}
    - {from: suspended, to: active, by: agent, means: "The agent reactivates a suspended ship-to at the customer's request."}
    - {from: active, to: closed, by: user, means: "The customer closes a ship-to (site closed or moved) once nothing is open on it."}
    - {from: suspended, to: closed, by: user, means: "The customer closes a suspended ship-to."}
    - {from: pending_setup, to: closed, by: user, means: "The customer cancels a ship-to request before it opens."}

accounts:
  - key: backorder
    unit: USD
    meaning: "Value at booked unit price of order quantities on backorder and not yet shipped or cancelled at this ship-to: backordered quantities increase it; backorder fills and backorder cancellations decrease it."

# ---- category-level parameter dictionary ----
parameter_schema:
  free_freight_threshold_usd: "Order merchandise subtotal, USD, at or above which standard-method freight is free; 0.00 means standard-method freight is always free"
  standard_freight_flat_usd: "Flat standard-method freight charge per order shipment below the free freight threshold, USD"
  standard_ship_method: "Ship method used when the customer does not ask for another"
  free_freight_applies_to: "Ship methods to which the free freight threshold and route free delivery apply; other methods are always charged"
  consolidated_daily_shipment: "Whether all orders for the ship-to released on one business day ship together and count as one shipment for freight"
  minimum_order_usd: "Order merchandise subtotal, USD, below which the small order fee applies; 0.00 means no minimum"
  small_order_fee_usd: "Small order fee per order below the minimum, USD"
  expedite_next_day_fee_usd: "Corbett expedite fee per order shipped next day air, USD"
  expedite_second_day_fee_usd: "Corbett expedite fee per order shipped second day air, USD"
  expedites_included_per_month: "Number of expedited orders per calendar month per ship-to on which the expedite fee is not charged"
  same_day_cutoff_local_time: "Ship-to local time (HH:MM) by which a stocked order must be booked to ship the same business day"
  route_deliveries_per_week: "Scheduled route truck deliveries per week; 0 means no route service"
  will_call_hold_days: "Calendar days an order staged for branch will-call pickup is held before it is restocked and cancelled"
  liftgate_fee_usd: "Fee per LTL shipment needing a liftgate, USD"
  hazmat_fee_usd: "Hazardous materials handling fee per shipment containing hazmat items, USD"
  saturday_delivery_fee_usd: "Fee per Saturday delivery requested, USD"
  dropship_fee_usd: "Fee per order line shipped direct from the manufacturer, USD"
  after_hours_emergency_fee_usd: "Fee per after-hours emergency branch opening for an urgent pickup, USD"
  partial_shipment_freight_charged: "Whether a later shipment of backordered quantity is charged freight again (false means backorder fills ship freight-free)"
  backorder_expedite_free: "Whether a backorder fill ships by second day air at no expedite fee when the customer asks"
  backorder_notice_business_days: "Business days after booking within which the customer is told of a backorder and its expected date"
  backorder_auto_cancel_days: "Calendar days after the backorder date after which an unfilled backorder is cancelled unless extended"
  backorder_extension_days: "Calendar days a customer may extend an open backorder once, before it would auto-cancel"
  backorder_substitution_offer_days: "Calendar days after the backorder date by which, with no confirmed fill date, Corbett offers an approved substitute"
  substitute_billed_at_lower_price: "Whether an accepted substitute is billed at the lower of its own price and the original item's price"
  backorder_price_basis: "Which price a backorder fill is billed at"
  special_order_cancellation_free_hours: "Full hours after booking within which a special-order line may be cancelled with no fee"
  special_order_cancellation_fee_pct: "Cancellation fee, percent of the line's extended amount, for a special-order line cancelled after the free period"
  return_window_days: "Calendar days after the ship date within which a stocked item may be returned for a customer reason"
  restocking_fee_pct: "Restocking fee, percent of the returned extended amount, on customer-reason returns of stocked items"
  restocking_fee_min_usd: "Minimum restocking fee per return line when a restocking fee applies, USD"
  restocking_fee_waived_corbett_error: "Whether returns for wrong item shipped, damaged in transit, defective or duplicate shipment carry no restocking fee"
  special_order_return_allowed: "Whether a special-order item may be returned when the manufacturer accepts it"
  special_order_restocking_fee_pct: "Restocking fee, percent, on an accepted special-order return (manufacturer restocking passed through)"
  opened_item_return_allowed: "Whether an opened but unused stocked item may be returned for a customer reason"
  opened_item_credit_pct: "Percent of the returned extended amount credited for an opened unused item before any restocking fee"
  non_returnable_item_classes: "Item classes never returnable for a customer reason"
  defective_return_window_days: "Calendar days after the ship date within which a defective item may be returned through Corbett"
  damaged_in_transit_report_days: "Business days after delivery within which concealed shipping damage must be reported"
  rma_validity_days: "Calendar days after the RMA date within which the goods must arrive at Corbett"
  return_label_fee_usd: "Fee for a Corbett prepaid return label on a customer-reason return, deducted from the credit, USD"
  return_pickup_included: "Whether Corbett picks up customer-reason returns on the route truck at no charge"
  return_credit_issue_business_days: "Business days after receipt and inspection within which the return credit is issued"
  return_credit_basis: "Unit price on which return credit is computed"
  setup_business_days: "Business days to validate and open a new ship-to"
  inactivity_suspend_months: "Whole months without any booked order after which an active ship-to is suspended"
  downgrade_spend_pct: "At the ship-to's annual review, trailing 12 month spend below this percent of the tier's entry gate spend moves it down one tier; 0 means never"
  next_day_air_cutoff_local_time: "Ship-to local time (HH:MM) by which an order must be booked to leave the same day by next day air"
  backorder_ship_default: "How available quantity ships when part of an order is backordered, unless the customer asks for ship-complete on the order"

