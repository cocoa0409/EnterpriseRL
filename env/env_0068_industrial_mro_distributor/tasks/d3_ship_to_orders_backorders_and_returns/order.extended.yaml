# ---- data flow ----
events:
  - type: order_ship_to_requested
    target: ship_to_accounts
    mutation: create
    meaning: "The customer asks Corbett to open a new ship-to (delivery location) at a service level."
    grain: "One row per ship-to request (one transaction)."
    fields: {customer_id: "Customer.", variant_name: "Service level requested.", ship_to_number: "Ship-to number assigned (ST-...).", site_name: "Site name as the customer gives it.", ship_to_zip: "Delivery ZIP code.", opened_date: "Left empty until activation."}
    triggers: []
  - type: order_ship_to_activated
    target: ship_to_accounts
    mutation: {transition: {from: pending_setup, to: active}}
    meaning: "The ship-to is validated and opens for orders."
    grain: "One row per activation (one transaction)."
    fields: {opened_date: "Activation date.", variant_name: "Service level granted (the requested level if its entry gate is met, otherwise the highest level met)."}
    triggers: []
  - type: order_ship_to_suspended
    target: ship_to_accounts
    mutation: {transition: {from: active, to: suspended}}
    meaning: "An inactive ship-to is suspended."
    grain: "One row per suspension (one transaction)."
    fields: {last_order_date: "Date of the last booked order (unchanged, recorded for the suspension decision)."}
    triggers: []
  - type: order_ship_to_reactivated
    target: ship_to_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: "A suspended ship-to is reactivated."
    grain: "One row per reactivation (one transaction)."
    fields: {variant_name: "Service level on reactivation."}
    triggers: []
  - type: order_ship_to_closed
    target: ship_to_accounts
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}, {from: pending_setup, to: closed}]}
    meaning: "The customer closes a ship-to."
    grain: "One row per closure (one transaction)."
    fields: {closed_date: "Closure date."}
    triggers: []
  - type: order_service_level_changed
    target: ship_to_accounts
    mutation: update
    meaning: "The ship-to moves to another service level at review or on request."
    grain: "One row per service level change (one transaction)."
    fields: {variant_name: "New service level.", last_review_date: "Date of the change."}
    triggers: []
  - type: order_line_booked
    target: order_lines
    meaning: "An order line is booked for the ship-to."
    grain: "One row per order line booked."
    distinguish_by: [order_number, line_number]
    fields: {order_number: "Sales order number (SO-...).", line_number: "Line number on the order.", sku: "Corbett item number.", product_category: "Product category.", item_class: "Item class.", stock_status: "Stocked or non-stock special order.", quantity: "Quantity ordered.", unit_price: "Unit price per the pricing charter on the booking date (re-priced on the ship date when different).", extended_amount: "Quantity times unit price, USD.", ship_method: "Ship method requested.", booked_at: "Booking timestamp.", event_date: "Booking date.", customer_po: "Customer purchase order number."}
    triggers: []
  - type: order_line_shipped
    target: order_lines
    meaning: "Quantity on an order line ships from stock (or from the manufacturer for a drop ship)."
    grain: "One row per shipment of an order line."
    distinguish_by: [order_number, line_number, shipment_number]
    fields: {order_number: "Sales order number.", line_number: "Line number.", shipment_number: "Shipment (packing list) number.", sku: "Item.", product_category: "Product category.", item_class: "Item class.", stock_status: "Stocked or special order.", quantity: "Quantity shipped.", unit_price: "Unit price in effect on the ship date, USD.", extended_amount: "Quantity times unit price, USD.", ship_method: "Ship method used.", event_date: "Ship date.", delivered_date: "Date the carrier or route truck delivered the shipment; empty until delivered.", customer_po: "Customer PO."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, source_type: order_shipment, source_reference: order_number}
  - type: order_line_backordered
    target: order_lines
    meaning: "Ordered quantity that cannot ship from stock is placed on backorder."
    grain: "One row per backorder of an order line."
    distinguish_by: [order_number, line_number, backorder_reference]
    fields: {order_number: "Sales order number.", line_number: "Line number.", backorder_reference: "Backorder reference (BO-...).", sku: "Item.", product_category: "Product category.", item_class: "Item class.", stock_status: "Stocked or special order.", quantity: "Quantity backordered.", unit_price: "Booked unit price, USD.", extended_amount: "Backordered value at booked price, USD.", promise_date: "Expected fill date given to the customer.", event_date: "Backorder date."}
    account: backorder
    direction: in
    triggers: []
  - type: order_backorder_filled
    target: order_lines
    meaning: "Backordered quantity ships."
    grain: "One row per shipment against a backorder."
    distinguish_by: [backorder_reference, shipment_number]
    fields: {order_number: "Sales order number.", line_number: "Line number.", backorder_reference: "Backorder filled.", shipment_number: "Shipment number.", sku: "Item shipped (the substitute's number when a substitute was accepted).", product_category: "Product category.", item_class: "Item class.", stock_status: "Stocked or special order.", quantity: "Quantity shipped.", unit_price: "Unit price billed under backorder_price_basis and substitution rules, USD.", extended_amount: "Booked-price value relieved from the backorder, USD (the backorder account moves at booked price).", ship_method: "Ship method used.", event_date: "Ship date.", delivered_date: "Delivery date; empty until delivered."}
    account: backorder
    direction: out
    triggers:
      - event: credit:credit_invoice_posted
        map: {source_type: order_shipment, source_reference: order_number}
  - type: order_backorder_cancelled
    target: order_lines
    meaning: "Open backorder quantity is cancelled by the customer or by auto-cancel."
    grain: "One row per backorder cancellation."
    distinguish_by: [backorder_reference]
    fields: {order_number: "Sales order number.", line_number: "Line number.", backorder_reference: "Backorder cancelled.", sku: "Item.", quantity: "Quantity cancelled.", unit_price: "Booked unit price, USD.", extended_amount: "Value cancelled at booked price, USD.", cancel_source: "Who cancelled.", event_date: "Cancellation date."}
    account: backorder
    direction: out
    triggers: []
  - type: order_line_cancelled
    target: order_lines
    meaning: "An order line not yet shipped or backordered is cancelled."
    grain: "One row per line cancellation."
    distinguish_by: [order_number, line_number]
    fields: {order_number: "Sales order number.", line_number: "Line number.", sku: "Item.", stock_status: "Stocked or special order.", quantity: "Quantity cancelled.", unit_price: "Booked unit price, USD.", extended_amount: "Value cancelled, USD.", cancel_source: "Who cancelled.", booked_at: "Booking timestamp of the line (copied for the cancellation window).", event_date: "Cancellation date."}
    triggers:
      - event: order:order_fee_charged
        when: {stock_status: non_stock_special_order}
        map: {order_number: order_number, line_number: line_number, fee_type: special_order_cancellation}
  - type: order_fee_charged
    target: order_lines
    meaning: "A freight charge or service fee is billed on an order: standard freight, small order fee, expedite, liftgate, hazmat, Saturday delivery, drop ship, after-hours emergency or special-order cancellation."
    grain: "One row per fee type per order shipment (per order line for drop ship and special-order cancellation fees)."
    distinguish_by: [order_number, fee_type, shipment_number, line_number]
    fields: {order_number: "Sales order number.", line_number: "Line number for line-level fees; 0 for order-level fees.", shipment_number: "Shipment the fee belongs to; NONE for fees not tied to a shipment.", fee_type: "Kind of fee.", extended_amount: "Fee amount, USD (0.00 is never written; a waived fee is simply not charged).", event_date: "Fee date."}
    triggers:
      - event: credit:credit_invoice_posted
        when: {fee_type: standard_freight}
        map: {freight_amount: extended_amount, source_type: order_service_fee, source_reference: order_number}
      - event: credit:credit_invoice_posted
        when: {fee_type: {not: standard_freight}}
        map: {merchandise_amount: extended_amount, source_type: order_service_fee, source_reference: order_number}
  - type: order_return_authorized
    target: order_returns
    meaning: "A return material authorization (RMA) is issued for shipped quantity of an order line."
    grain: "One row per order line on an RMA."
    distinguish_by: [rma_number, order_number, line_number]
    fields: {rma_number: "RMA number (RMA-...).", order_number: "Sales order of the shipped line.", line_number: "Line number.", sku: "Item returned.", item_class: "Item class.", stock_status: "Stocked or special order.", quantity: "Quantity authorized for return.", unit_price: "Invoiced unit price of the shipped line, USD.", return_reason: "Reason class.", return_method: "How the goods come back.", event_date: "RMA date."}
    triggers: []
  - type: order_return_declined
    target: order_returns
    meaning: "A return request for an order line is declined."
    grain: "One row per order line on a declined request."
    distinguish_by: [rma_number, order_number, line_number]
    fields: {rma_number: "Request reference (RMA-... issued for the declined request).", order_number: "Sales order.", line_number: "Line number.", sku: "Item.", quantity: "Quantity requested.", return_reason: "Reason class stated.", decline_reason: "Why the request was declined.", event_date: "Decline date."}
    triggers: []
  - type: order_return_received
    target: order_returns
    meaning: "Returned goods arrive at Corbett, are inspected and accepted, and the return credit is determined."
    grain: "One row per order line received against an RMA."
    distinguish_by: [rma_number, order_number, line_number]
    fields: {rma_number: "RMA received.", order_number: "Sales order.", line_number: "Line number.", sku: "Item.", quantity: "Quantity received and accepted.", unit_price: "Invoiced unit price, USD.", return_reason: "Reason class.", item_condition: "Condition found at inspection.", restocking_fee: "Restocking fee deducted, USD.", label_fee: "Return label fee deducted, USD.", credit_amount: "Credit to be issued, USD.", event_date: "Receipt date."}
    triggers:
      - event: credit:credit_memo_issued
        map: {amount: credit_amount, source_type: return_credit, source_reference: rma_number}
  - type: order_return_closed_no_credit
    target: order_returns
    meaning: "An RMA line closes without credit: the goods failed inspection or never arrived inside the RMA validity period."
    grain: "One row per order line closed without credit."
    distinguish_by: [rma_number, order_number, line_number]
    fields: {rma_number: "RMA closed.", order_number: "Sales order.", line_number: "Line number.", sku: "Item.", quantity: "Quantity on the RMA.", item_condition: "Condition found, or not_received.", close_reason: "Why no credit.", event_date: "Closing date."}
    triggers: []

# ---- derived measures ----
measures:
  - id: order_msr_order_subtotal
    window: "One sales order (all lines of one order_number at the ship-to), as of the shipment being charged."
    measure: "Sum, USD, of extended_amount of the order's order_line_booked rows less its order_line_cancelled rows; with consolidated_daily_shipment, the sum over every order of the ship-to shipping on the same business day."
  - id: order_msr_expedites_in_month
    window: "The calendar month of the ship date, up to and including the shipment being charged."
    measure: "Count of distinct order_number at the ship-to shipped by next_day_air or second_day_air in the month, in ship date then order number order."
  - id: order_msr_trailing_12m_spend
    window: "The 12 calendar months ending on the review date."
    measure: "Sum, USD, of extended_amount of order_line_shipped and order_backorder_filled rows of the ship-to, less credit_amount of its order_return_received rows."
  - id: order_msr_returned_quantity
    window: "Lifetime of one order line."
    measure: "Sum of quantity on order_return_authorized rows for the order line whose RMA has not been closed without credit."

# ---- policies ----
policies:
  - id: order_agg_multi_holding
    subject: [order_ship_to_requested]
    rule: >-
      A customer may hold up to max_per_customer ship-to accounts, one per delivery location.
      A ship-to is not opened for a site that already has a ship-to of the customer whose status is pending_setup, active or suspended; a suspended ship-to is reactivated instead.
      Requests beyond the cap are referred to the customer's account manager and are not opened by the desk.
    eligibility:
      - id: one_ship_to_per_site
        applies_to: [order_ship_to_requested]
        kind: dedup
        condition: "A ship-to is not opened for a site that already has a ship-to of the customer whose status is pending_setup, active or suspended"
        evidence_fields: [ship_to_accounts.customer_id, ship_to_accounts.site_name, ship_to_accounts.ship_to_zip, ship_to_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ship_to_accounts.customer_id, ship_to_accounts.site_name, ship_to_accounts.ship_to_zip]]
          action_bindings: {ship_to_accounts.customer_id: customer_id, ship_to_accounts.site_name: site_name, ship_to_accounts.ship_to_zip: ship_to_zip}
        dedup_contract:
          table: ship_to_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id, site_name: site_name, ship_to_zip: ship_to_zip}
          duplicate_filters: {status: [pending_setup, active, suspended]}
          distinct_fields: []
    params: {max_per_customer: 25}

  - id: order_agg_ship_to_portfolio
    subject: [order_ship_to_requested, order_service_level_changed, order_fee_charged]
    rule: >-
      Each ship-to is its own service level: minimum order, free freight, expedites included, fees and return terms are applied per ship-to and per order, never pooled across the customer's ship-tos.
      Orders for different ship-tos never combine toward a free freight threshold or a minimum order, even when shipped the same day.
      Service level entry gates are measured on the ship-to's own trailing 12 month spend, except that a new ship-to of a customer whose other active ship-tos together had trailing 12 month spend of at least the requested level's entry gate may open at that level for its first 12 months.
      All ship-tos bill to the customer's single Commercial Credit Account; a ship-to never carries its own terms.
    eligibility: []

  - id: order_ship_to_setup
    subject: [order_ship_to_requested, order_ship_to_activated]
    rule: >-
      A new ship-to is opened only for a customer whose Commercial Credit Account status is active.
      The ship-to opens within setup_business_days business days at the requested service level when its entry gate is met (including the portfolio allowance in order_agg_ship_to_portfolio), otherwise at the highest level whose entry gate is met; Route Delivery, Premier Route and Dedicated Delivery levels are available only for a delivery ZIP code inside a Corbett branch route territory.
      A ship-to request may be cancelled by the customer before it opens.
    eligibility:
      - id: credit_account_in_good_standing
        applies_to: [order_ship_to_requested]
        kind: state
        condition: "A new ship-to is opened only for a customer whose Commercial Credit Account status is active."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: order_evt_booking_and_shipping
    subject: [order_line_booked, order_line_shipped]
    rule: >-
      Orders are booked only on a ship-to whose status is active.
      A line ships on terms only while the customer's Commercial Credit Account status is active; lines booked while the account is on hold, in collections or closed stay unshipped until the account is active again.
      Each line is priced under pricing_price_basis at the price in effect on its ship date; the booked price is an estimate and the shipped price governs the invoice.
      Orders ship by the tier's standard_ship_method unless the customer asks for another method, and route levels deliver on their route_deliveries_per_week scheduled route days.
      A stocked line booked by same_day_cutoff_local_time ships the same business day, and a line booked later ships the next business day; next day air orders must be booked by next_day_air_cutoff_local_time to leave the same day.
      Quantity that cannot ship from stock is backordered under order_evt_backorder and, under backorder_ship_default, the available quantity ships unless the customer asked for ship-complete on that order.
      Will-call orders are held at the branch for will_call_hold_days calendar days after staging and are then restocked and cancelled with no fee.
    eligibility:
      - id: ship_to_open
        applies_to: [order_line_booked]
        kind: state
        condition: "Orders are booked only on a ship-to whose status is active."
        evidence_fields: [ship_to_accounts.status, ship_to_accounts.ship_to_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ship_to_accounts.ship_to_id]]
          action_bindings: {ship_to_accounts.ship_to_id: ship_to_id}
        state_contract:
          field: ship_to_accounts.status
          allowed: [active]
      - id: credit_open_to_ship
        applies_to: [order_line_shipped]
        kind: state
        condition: "A line ships on terms only while the customer's Commercial Credit Account status is active"
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: order_evt_freight_and_fees
    subject: [order_fee_charged]
    rule: >-
      Standard freight of standard_freight_flat_usd is charged once per shipment of an order shipped by a method in free_freight_applies_to when order_msr_order_subtotal is below free_freight_threshold_usd; at or above the threshold, or on a tier whose threshold is 0.00, standard-method freight is free.
      Where consolidated_daily_shipment is true, all of the ship-to's orders shipping on one business day are one shipment and freight is charged at most once for that day.
      A later shipment of backordered quantity is charged freight again only where partial_shipment_freight_charged is true.
      A small order fee of small_order_fee_usd is charged once on an order whose order_msr_order_subtotal is below minimum_order_usd; backorder fills and will-call orders never carry it.
      An order shipped next day air or second day air carries expedite_next_day_fee_usd or expedite_second_day_fee_usd respectively, except that the first expedites_included_per_month expedited orders of the ship-to in a calendar month, counted by order_msr_expedites_in_month, carry no expedite fee, and a backorder fill shipped second day air at the customer's request carries none where backorder_expedite_free is true.
      When the service is used, liftgate_fee_usd is charged per LTL shipment needing a liftgate, hazmat_fee_usd per shipment containing hazmat items, saturday_delivery_fee_usd per Saturday delivery and after_hours_emergency_fee_usd per after-hours emergency branch opening, each once per shipment; dropship_fee_usd is charged once per drop-shipped line; a fee whose tier amount is 0.00 is not charged.
      Each order shipment carries at most one fee of each fee type.
    eligibility:
      - id: one_fee_type_per_shipment
        applies_to: [order_fee_charged]
        kind: dedup
        condition: "Each order shipment carries at most one fee of each fee type."
        evidence_fields: [order_lines.order_number, order_lines.fee_type, order_lines.shipment_number, order_lines.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[order_lines.order_number, order_lines.fee_type, order_lines.shipment_number]]
          action_bindings: {order_lines.order_number: order_number, order_lines.fee_type: fee_type, order_lines.shipment_number: shipment_number}
        dedup_contract:
          table: order_lines
          mode: separate_record
          object_bindings: {order_number: order_number, fee_type: fee_type, shipment_number: shipment_number}
          duplicate_filters: {event_type: [order_fee_charged]}
          distinct_fields: [line_number]
    measures: [order_msr_order_subtotal, order_msr_expedites_in_month]

  - id: order_evt_backorder
    subject: [order_line_backordered, order_backorder_filled, order_backorder_cancelled]
    rule: >-
      The customer is told of each backorder and its promise date within backorder_notice_business_days business days of booking.
      When a backorder has no confirmed fill date backorder_substitution_offer_days calendar days after the backorder date, Corbett offers an approved substitute; an accepted substitute ships against the same backorder and, where substitute_billed_at_lower_price is true, is billed at the lower of its own price and the original item's price.
      A backorder fill is billed under backorder_price_basis at the price in effect on its ship date, and its freight follows order_evt_freight_and_fees.
      The customer may cancel open backorder quantity of a stocked item at any time with no fee; open backorder quantity of a special-order item is cancelled under order_evt_cancellation.
      An open backorder is cancelled automatically once backorder_auto_cancel_days calendar days have passed since the backorder date.
      Count calendar days starting the day after the backorder date; the backorder is cancelled on the day after the last day of the period, and a backorder the customer extended once by backorder_extension_days days is cancelled on the day after the extended period instead.
      Each backorder may be extended only once.
    eligibility:
      - id: auto_cancel_period_elapsed
        applies_to: [order_backorder_cancelled]
        kind: time
        condition: "An open backorder is cancelled automatically once backorder_auto_cancel_days calendar days have passed since the backorder date."
        evidence_fields: [order_lines.event_date, order_lines.backorder_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[order_lines.backorder_reference]]
          action_bindings: {order_lines.backorder_reference: backorder_reference}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the backorder date"
          anchor_source: order_lines.event_date
          relation: not_before
          duration_source: variants.backorder_auto_cancel_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the backorder date; the backorder is cancelled on the day after the last day of the period, and a backorder the customer extended once by backorder_extension_days days is cancelled on the day after the extended period instead."
          boundary: exclusive

  - id: order_evt_cancellation
    subject: [order_line_cancelled, order_fee_charged]
    rule: >-
      A stocked line that has not shipped may be cancelled by the customer at any time with no fee; a shipped line is not cancelled but returned under order_evt_returns.
      A special-order line may be cancelled with no fee only when the cancellation is made no later than special_order_cancellation_free_hours full hours after the line was booked.
      Count elapsed hours from the booking timestamp to the cancellation timestamp; a cancellation exactly at the end of the free period is free, and any later cancellation carries the fee.
      A special-order line cancelled after the free period carries a cancellation fee of special_order_cancellation_fee_pct percent of its extended amount, rounded half up to the cent, charged once per line.
      A special-order line the manufacturer has already shipped to the customer cannot be cancelled.
    eligibility:
      - id: special_order_free_cancel_window
        applies_to: [order_line_cancelled]
        kind: time
        condition: "A special-order line may be cancelled with no fee only when the cancellation is made no later than special_order_cancellation_free_hours full hours after the line was booked."
        evidence_fields: [order_lines.booked_at, order_lines.order_number, order_lines.line_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[order_lines.order_number, order_lines.line_number]]
          action_bindings: {order_lines.order_number: order_number, order_lines.line_number: line_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the line was booked"
          anchor_source: order_lines.booked_at
          relation: not_after
          duration_source: variants.special_order_cancellation_free_hours
          unit: elapsed_hours
          counting_rule: "Count elapsed hours from the booking timestamp to the cancellation timestamp; a cancellation exactly at the end of the free period is free, and any later cancellation carries the fee."
          boundary: inclusive
    formula:
      cancellation_fee: "round(extended_amount * special_order_cancellation_fee_pct / 100, 2)"

  - id: order_evt_returns
    subject: [order_return_authorized, order_return_declined, order_return_received, order_return_closed_no_credit]
    rule: >-
      Returns are authorized per shipped order line by RMA, and the quantity authorized across all open RMAs of a line (order_msr_returned_quantity) never exceeds the quantity shipped on it.
      A customer-reason return (ordered_in_error or no_longer_needed) is authorized only when the request is made no later than return_window_days calendar days after the ship date of the returned line.
      Count calendar days starting the day after the ship date; a request on the last day is authorized.
      A customer-reason return is declined for an item class in non_returnable_item_classes, for a special-order item unless special_order_return_allowed is true and the manufacturer accepts it, and for an opened item unless opened_item_return_allowed is true.
      A defective item is returnable within defective_return_window_days calendar days after the ship date; a wrong item shipped or a duplicate shipment is returnable within return_window_days; damage in transit is returnable when reported within damaged_in_transit_report_days business days after the delivery date; these Corbett-error returns are accepted for every item class and stock status.
      Goods must arrive within rma_validity_days calendar days after the RMA date or the RMA line closes without credit as rma_expired; goods found used or damaged by the customer on a customer-reason return close without credit as failed_inspection.
      Return credit is computed on return_credit_basis: the returned extended amount is the quantity accepted times the invoiced unit price; an opened item is credited at opened_item_credit_pct percent of that amount.
      A customer-reason return carries a restocking fee of restocking_fee_pct percent of the returned extended amount (special_order_restocking_fee_pct for an accepted special-order return), rounded half up to the cent and raised to restocking_fee_min_usd when lower, and, when shipped on a Corbett prepaid label, a label fee of return_label_fee_usd; where return_pickup_included is true a route pickup carries no label fee.
      Where restocking_fee_waived_corbett_error is true a Corbett-error return carries no restocking fee and no label fee and is credited in full regardless of condition.
      The credit is the credited amount less the restocking fee and the label fee, never below 0.00, issued by credit memo within return_credit_issue_business_days business days of receipt.
    eligibility:
      - id: inside_return_window
        applies_to: [order_return_authorized]
        kind: time
        condition: "A customer-reason return (ordered_in_error or no_longer_needed) is authorized only when the request is made no later than return_window_days calendar days after the ship date of the returned line."
        evidence_fields: [order_lines.event_date, order_lines.order_number, order_lines.line_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[order_lines.order_number, order_lines.line_number]]
          action_bindings: {order_lines.order_number: order_number, order_lines.line_number: line_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the ship date of the returned line"
          anchor_source: order_lines.event_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the ship date; a request on the last day is authorized."
          boundary: inclusive
      - id: returnable_quantity
        applies_to: [order_return_authorized]
        kind: authorization
        condition: "Returns are authorized per shipped order line by RMA, and the quantity authorized across all open RMAs of a line (order_msr_returned_quantity) never exceeds the quantity shipped on it."
        evidence_fields: [order_lines.quantity, order_returns.quantity, order_returns.order_number, order_returns.line_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[order_returns.order_number, order_returns.line_number]]
          action_bindings: {order_returns.order_number: order_number, order_returns.line_number: line_number}
    measures: [order_msr_returned_quantity]
    params:
      per_tier:
        Corbett Parcel Ship-To: {restock_pct: "=restocking_fee_pct", window_days: "=return_window_days"}
        Corbett Standard Ship-To: {restock_pct: "=restocking_fee_pct", window_days: "=return_window_days"}
        Corbett Priority Ship-To: {restock_pct: "=restocking_fee_pct", window_days: "=return_window_days"}
        Corbett Route Delivery Ship-To: {restock_pct: "=restocking_fee_pct", window_days: "=return_window_days"}
        Corbett Premier Route Ship-To: {restock_pct: "=restocking_fee_pct", window_days: "=return_window_days"}
        Corbett Dedicated Delivery Ship-To: {restock_pct: "=restocking_fee_pct", window_days: "=return_window_days"}
    formula:
      restocking_fee: "max(round(quantity * unit_price * restocking_fee_pct / 100, 2), restocking_fee_min_usd)"
      credit_amount: "max(round(quantity * unit_price, 2) - restocking_fee - label_fee, 0)"

  - id: order_ship_to_lifecycle
    subject: [order_ship_to_suspended, order_ship_to_reactivated, order_ship_to_closed, order_service_level_changed]
    rule: >-
      An active ship-to with no booked order for inactivity_suspend_months whole months after its last order date is suspended by the system; a suspended ship-to takes no orders and is reactivated by the agent at the customer's request at its prior service level, provided the customer's Commercial Credit Account status is active.
      At each anniversary of its opening a ship-to whose order_msr_trailing_12m_spend is below downgrade_spend_pct percent of its tier's entry gate spend moves down one service level; a customer may ask to move up when the ship-to's trailing spend meets the higher level's entry gate, and a route level needs a delivery ZIP inside a route territory.
      A ship-to is closed only at the customer's request and only when it has no unshipped order line, no open backorder and no open RMA.
      Closing a ship-to cancels nothing automatically and does not affect other ship-tos, VMI or vending programs, which must be closed under their own charters.
    eligibility:
      - id: nothing_open_on_ship_to
        applies_to: [order_ship_to_closed]
        kind: authorization
        condition: "A ship-to is closed only at the customer's request and only when it has no unshipped order line, no open backorder and no open RMA."
        evidence_fields: [ship_to_accounts.open_backorder_value, ship_to_accounts.ship_to_id, order_lines.event_type, order_returns.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ship_to_accounts.ship_to_id]]
          action_bindings: {ship_to_accounts.ship_to_id: ship_to_id}
    measures: [order_msr_trailing_12m_spend]

extended_policies:
  - id: order_ext_anniversary_review
    base_policy_refs: [order_ship_to_lifecycle, order_agg_ship_to_portfolio]
    overwrite:
      - base_policy: order_ship_to_lifecycle
        superseded_clause: >-
          At each anniversary of its opening a ship-to whose order_msr_trailing_12m_spend is below downgrade_spend_pct percent of its tier's entry gate spend moves down one service level
        replaced_by: >-
          For the anniversary review of a ship-to, and only for that review, a ship-to that shipped order_line_shipped merchandise within the 12 months before the review date and whose review spend is below its review threshold moves down one service level, and every other ship-to keeps its level at the review, a ship-to with no such merchandise being left to the inactivity suspension; a move up on the customer's request remains under the rule for requested moves.
    trigger: state_due
    subject: [order_service_level_changed]
    computes: variant_name
    target_tool: record_anniversary_review_a2ef3cef
    params:
      gate_standard_usd: 5000
      gate_priority_usd: 25000
      gate_route_usd: 60000
      gate_premier_usd: 150000
      gate_dedicated_usd: 500000
      sparse_route_runs: 6
      light_route_runs: 12
      pct_sparse_route: 85
      pct_light_route: 80
      established_months: 60
      young_months: 24
      dropship_heavy_pct: 25
      dropship_heavy_share_pct: 0
      dropship_light_share_pct: 50
      willcall_heavy_pct: 30
      willcall_heavy_share_pct: 25
      willcall_light_share_pct: 50
    rule: >
      Every ship-to is reviewed once for each anniversary of its opening date, and the anniversary review settles the service level the ship-to holds from the review on; the review falls due on the anniversary and is recorded on the anniversary or, where it was not recorded that day, on the first later day the ship-to is handled; the review date is the day the review is recorded, and the review is for the most recent anniversary on or before the review date that has no review dated on or after it.
      For the anniversary review of a ship-to, and only for that review, a ship-to that shipped order_line_shipped merchandise within the 12 months before the review date and whose review spend is below its review threshold moves down one service level, and every other ship-to keeps its level at the review, a ship-to with no such merchandise being left to the inactivity suspension; a move up on the customer's request remains under the rule for requested moves.
      The review spend is the twelve-month spend: the extended_amount of the ship-to's order_line_shipped and order_backorder_filled lines dated within the 12 months before the review date, less the credit_amount of its order_return_received lines dated within the same 12 months, a line being within N months when fewer than N whole months separate its date from the review date.
      Whole months between two dates are the difference in calendar months between them, less one where the day of the month of the later date is smaller than the day of the month of the earlier date.
      The six-month spend is the same shipped and filled merchandise less return credits over the lines within the 6 months of the review date.
      The review threshold is downgrade_spend_pct percent of the entry gate spend of the level the ship-to holds, the entry gates being 0.00 for Corbett Parcel Ship-To, gate_standard_usd for Corbett Standard Ship-To, gate_priority_usd for Corbett Priority Ship-To, gate_route_usd for Corbett Route Delivery Ship-To, gate_premier_usd for Corbett Premier Route Ship-To and gate_dedicated_usd for Corbett Dedicated Delivery Ship-To.
      Moving down one service level takes Corbett Dedicated Delivery Ship-To to Corbett Premier Route Ship-To, Corbett Premier Route Ship-To to Corbett Route Delivery Ship-To, Corbett Route Delivery Ship-To to Corbett Priority Ship-To, Corbett Priority Ship-To to Corbett Standard Ship-To and Corbett Standard Ship-To to Corbett Parcel Ship-To, and a Corbett Parcel Ship-To keeps its level.
      The review spend and the review threshold are compared to the cent, without rounding either figure.
      The review threshold percent follows the route service the ship-to actually used: a ship-to holding Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To with fewer than sparse_route_runs order_line_shipped lines shipped by route_truck within the 12 months before the review date is reviewed at pct_sparse_route percent; a ship-to holding one of those three route levels with at least sparse_route_runs and fewer than light_route_runs such route_truck shipments is reviewed at pct_light_route percent; every other ship-to is reviewed at downgrade_spend_pct percent.
      The review spend follows how long the ship-to has been open on the review date, counted in whole months from its opened_date (0 months where the ship-to has no opened_date), and is set from the counted twelve-month figure and twice the counted six-month figure: for a ship-to open at least established_months months the review spend is the lower of the two; for a ship-to open fewer than young_months months it is the higher of the two; for every other ship-to it is the counted twelve-month figure.
      Drop-ship merchandise, the extended_amount of order_line_shipped lines shipped by manufacturer_dropship, counts at a share set by its weight in the ship-to's shipped merchandise of the last 12 months: where it is more than dropship_heavy_pct percent of the extended_amount of all the ship-to's order_line_shipped lines of the 12 months it counts at dropship_heavy_share_pct percent; where it is above 0.00 and at most dropship_heavy_pct percent it counts at dropship_light_share_pct percent; otherwise it counts in full.
      Will-call merchandise, the extended_amount of order_line_shipped lines shipped by will_call, counts at a share set by its weight in the ship-to's shipped merchandise of the last 12 months: where it is more than willcall_heavy_pct percent of the extended_amount of all the ship-to's order_line_shipped lines of the 12 months it counts at willcall_heavy_share_pct percent; where it is above 0.00 and at most willcall_heavy_pct percent it counts at willcall_light_share_pct percent; otherwise it counts in full.
      Where a share below full is set for a kind of merchandise, the uncounted part of that merchandise is taken out of the twelve-month and the six-month spend, each over its own months, giving the counted twelve-month and counted six-month figures (equal to the twelve- and six-month spend where every kind counts in full); the counted figures are formed first, and the review spend is then formed from them.
    compute:
      - held_level: "F('variant_name')"
      - held_gate: "K('gate_dedicated_usd') if held_level == 'Corbett Dedicated Delivery Ship-To' else (K('gate_premier_usd') if held_level == 'Corbett Premier Route Ship-To' else (K('gate_route_usd') if held_level == 'Corbett Route Delivery Ship-To' else (K('gate_priority_usd') if held_level == 'Corbett Priority Ship-To' else (K('gate_standard_usd') if held_level == 'Corbett Standard Ship-To' else 0.0))))"
      - level_below: "'Corbett Premier Route Ship-To' if held_level == 'Corbett Dedicated Delivery Ship-To' else ('Corbett Route Delivery Ship-To' if held_level == 'Corbett Premier Route Ship-To' else ('Corbett Priority Ship-To' if held_level == 'Corbett Route Delivery Ship-To' else ('Corbett Standard Ship-To' if held_level == 'Corbett Priority Ship-To' else 'Corbett Parcel Ship-To')))"
      - spend_12: "SUM('order_lines', 'extended_amount', within_months=12, event_type='order_line_shipped') + SUM('order_lines', 'extended_amount', within_months=12, event_type='order_backorder_filled') - SUM('order_returns', 'credit_amount', within_months=12, event_type='order_return_received')"
      - spend_6: "SUM('order_lines', 'extended_amount', within_months=6, event_type='order_line_shipped') + SUM('order_lines', 'extended_amount', within_months=6, event_type='order_backorder_filled') - SUM('order_returns', 'credit_amount', within_months=6, event_type='order_return_received')"
      - shipped_12: "SUM('order_lines', 'extended_amount', within_months=12, event_type='order_line_shipped')"
      - route_level_held: "held_level == 'Corbett Route Delivery Ship-To' or held_level == 'Corbett Premier Route Ship-To' or held_level == 'Corbett Dedicated Delivery Ship-To'"
      - route_runs_12: "COUNT('order_lines', within_months=12, event_type='order_line_shipped', ship_method='route_truck')"
      - review_pct: "K('pct_sparse_route') if (route_level_held and route_runs_12 < K('sparse_route_runs')) else (K('pct_light_route') if (route_level_held and route_runs_12 >= K('sparse_route_runs') and route_runs_12 < K('light_route_runs')) else P('downgrade_spend_pct'))"
      - months_open_review: "MONTHS(F('opened_date'), NOW) if F('opened_date') else 0"
      - review_basis: "1 if months_open_review >= K('established_months') else (2 if months_open_review < K('young_months') else 0)"
      - dropship_12: "SUM('order_lines', 'extended_amount', within_months=12, event_type='order_line_shipped', ship_method='manufacturer_dropship')"
      - dropship_6: "SUM('order_lines', 'extended_amount', within_months=6, event_type='order_line_shipped', ship_method='manufacturer_dropship')"
      - dropship_share: "K('dropship_heavy_share_pct') if (shipped_12 > 0 and dropship_12 > shipped_12 * K('dropship_heavy_pct') / 100) else (K('dropship_light_share_pct') if (dropship_12 > 0 and dropship_12 <= shipped_12 * K('dropship_heavy_pct') / 100) else 100)"
      - willcall_12: "SUM('order_lines', 'extended_amount', within_months=12, event_type='order_line_shipped', ship_method='will_call')"
      - willcall_6: "SUM('order_lines', 'extended_amount', within_months=6, event_type='order_line_shipped', ship_method='will_call')"
      - willcall_share: "K('willcall_heavy_share_pct') if (shipped_12 > 0 and willcall_12 > shipped_12 * K('willcall_heavy_pct') / 100) else (K('willcall_light_share_pct') if (willcall_12 > 0 and willcall_12 <= shipped_12 * K('willcall_heavy_pct') / 100) else 100)"
      - counted_12: "spend_12 - dropship_12 * (100 - dropship_share) / 100 - willcall_12 * (100 - willcall_share) / 100"
      - counted_6: "spend_6 - dropship_6 * (100 - dropship_share) / 100 - willcall_6 * (100 - willcall_share) / 100"
      - review_spend: "MN(counted_12, 2 * counted_6) if review_basis == 1 else (MX(counted_12, 2 * counted_6) if review_basis == 2 else counted_12)"
      - review_threshold: "held_gate * review_pct / 100"
      - result: "level_below if (shipped_12 > 0 and review_spend < review_threshold) else held_level"
    compute_basis:
      held_level: "The review threshold is downgrade_spend_pct percent of the entry gate spend of the level the ship-to holds"
      route_level_held: "a ship-to holding Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To with fewer than sparse_route_runs order_line_shipped lines shipped by route_truck within the 12 months before the review date is reviewed at pct_sparse_route percent"
      held_gate: "The review threshold is downgrade_spend_pct percent of the entry gate spend of the level the ship-to holds, the entry gates being 0.00 for Corbett Parcel Ship-To, gate_standard_usd for Corbett Standard Ship-To, gate_priority_usd for Corbett Priority Ship-To, gate_route_usd for Corbett Route Delivery Ship-To, gate_premier_usd for Corbett Premier Route Ship-To and gate_dedicated_usd for Corbett Dedicated Delivery Ship-To."
      level_below: "Moving down one service level takes Corbett Dedicated Delivery Ship-To to Corbett Premier Route Ship-To, Corbett Premier Route Ship-To to Corbett Route Delivery Ship-To, Corbett Route Delivery Ship-To to Corbett Priority Ship-To, Corbett Priority Ship-To to Corbett Standard Ship-To and Corbett Standard Ship-To to Corbett Parcel Ship-To, and a Corbett Parcel Ship-To keeps its level."
      spend_12: "The review spend is the twelve-month spend: the extended_amount of the ship-to's order_line_shipped and order_backorder_filled lines dated within the 12 months before the review date, less the credit_amount of its order_return_received lines dated within the same 12 months, a line being within N months when fewer than N whole months separate its date from the review date."
      spend_6: "The six-month spend is the same shipped and filled merchandise less return credits over the lines within the 6 months of the review date."
      shipped_12: "of the extended_amount of all the ship-to's order_line_shipped lines of the 12 months"
      route_runs_12: "with fewer than sparse_route_runs order_line_shipped lines shipped by route_truck within the 12 months before the review date"
      review_pct: "The review threshold percent follows the route service the ship-to actually used: a ship-to holding Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To with fewer than sparse_route_runs order_line_shipped lines shipped by route_truck within the 12 months before the review date is reviewed at pct_sparse_route percent; a ship-to holding one of those three route levels with at least sparse_route_runs and fewer than light_route_runs such route_truck shipments is reviewed at pct_light_route percent; every other ship-to is reviewed at downgrade_spend_pct percent."
      months_open_review: "The review spend follows how long the ship-to has been open on the review date, counted in whole months from its opened_date (0 months where the ship-to has no opened_date)"
      review_basis: "for a ship-to open at least established_months months the review spend is the lower of the two; for a ship-to open fewer than young_months months it is the higher of the two; for every other ship-to it is the counted twelve-month figure."
      dropship_12: "Drop-ship merchandise, the extended_amount of order_line_shipped lines shipped by manufacturer_dropship, counts at a share set by its weight in the ship-to's shipped merchandise of the last 12 months"
      dropship_6: "the uncounted part of that merchandise is taken out of the twelve-month and the six-month spend, each over its own months"
      dropship_share: "where it is more than dropship_heavy_pct percent of the extended_amount of all the ship-to's order_line_shipped lines of the 12 months it counts at dropship_heavy_share_pct percent; where it is above 0.00 and at most dropship_heavy_pct percent it counts at dropship_light_share_pct percent; otherwise it counts in full."
      willcall_12: "Will-call merchandise, the extended_amount of order_line_shipped lines shipped by will_call, counts at a share set by its weight in the ship-to's shipped merchandise of the last 12 months"
      willcall_6: "the uncounted part of that merchandise is taken out of the twelve-month and the six-month spend, each over its own months"
      willcall_share: "where it is more than willcall_heavy_pct percent of the extended_amount of all the ship-to's order_line_shipped lines of the 12 months it counts at willcall_heavy_share_pct percent; where it is above 0.00 and at most willcall_heavy_pct percent it counts at willcall_light_share_pct percent; otherwise it counts in full."
      counted_12: "Where a share below full is set for a kind of merchandise, the uncounted part of that merchandise is taken out of the twelve-month and the six-month spend, each over its own months, giving the counted twelve-month and counted six-month figures (equal to the twelve- and six-month spend where every kind counts in full)"
      counted_6: "Where a share below full is set for a kind of merchandise, the uncounted part of that merchandise is taken out of the twelve-month and the six-month spend, each over its own months, giving the counted twelve-month and counted six-month figures (equal to the twelve- and six-month spend where every kind counts in full)"
      review_spend: "and is set from the counted twelve-month figure and twice the counted six-month figure"
      review_threshold: "The review threshold is downgrade_spend_pct percent of the entry gate spend of the level the ship-to holds"
      result: "For the anniversary review of a ship-to, and only for that review, a ship-to that shipped order_line_shipped merchandise within the 12 months before the review date and whose review spend is below its review threshold moves down one service level, and every other ship-to keeps its level at the review, a ship-to with no such merchandise being left to the inactivity suspension; a move up on the customer's request remains under the rule for requested moves."
    factors:
      - id: review_route_use_pct
        effect: parameter
        decides: review_pct
        bindings: [route_level_held, route_runs_12, review_pct]
        ladder:
          - when: "the ship-to holds Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To AND fewer than sparse_route_runs of its order_line_shipped lines within the 12 months before the review date shipped by route_truck"
            value: "K('pct_sparse_route')"
          - when: "the ship-to holds one of those three route levels AND at least sparse_route_runs and fewer than light_route_runs such route_truck shipments"
            value: "K('pct_light_route')"
          - when: "otherwise"
            value: "P('downgrade_spend_pct')"
        baseline:
          review_pct: "P('downgrade_spend_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: review_tenure_basis
        effect: method
        decides: review_basis
        bindings: [months_open_review, review_basis]
        ladder:
          - when: "the ship-to has been open at least established_months whole months on the review date"
            method: "the review spend is the lower of the counted twelve-month figure and twice the counted six-month figure"
          - when: "the ship-to has been open fewer than young_months whole months"
            method: "the review spend is the higher of the counted twelve-month figure and twice the counted six-month figure"
          - when: "otherwise"
            method: "the review spend is the counted twelve-month figure"
        baseline:
          review_basis: "0"
        evidence: [date]
        cross_difficulty: null
      - id: review_dropship_share
        effect: parameter
        decides: dropship_share
        bindings: [dropship_12, dropship_6, dropship_share]
        ladder:
          - when: "drop-ship merchandise of the 12 months is more than dropship_heavy_pct percent of all shipped merchandise of the 12 months"
            value: "K('dropship_heavy_share_pct')"
          - when: "drop-ship merchandise of the 12 months is above 0.00 and at most dropship_heavy_pct percent of it"
            value: "K('dropship_light_share_pct')"
          - when: "otherwise"
            value: "100 (counted in full)"
        baseline:
          dropship_share: "100"
        evidence: [history]
        cross_difficulty: null
      - id: review_willcall_share
        effect: parameter
        decides: willcall_share
        bindings: [willcall_12, willcall_6, willcall_share]
        ladder:
          - when: "will-call merchandise of the 12 months is more than willcall_heavy_pct percent of all shipped merchandise of the 12 months"
            value: "K('willcall_heavy_share_pct')"
          - when: "will-call merchandise of the 12 months is above 0.00 and at most willcall_heavy_pct percent of it"
            value: "K('willcall_light_share_pct')"
          - when: "otherwise"
            value: "100 (counted in full)"
        baseline:
          willcall_share: "100"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        For the anniversary review of a ship-to, and only for that review, a ship-to that shipped order_line_shipped merchandise within the 12 months before the review date and whose review spend is below its review threshold moves down one service level, and every other ship-to keeps its level at the review, a ship-to with no such merchandise being left to the inactivity suspension; a move up on the customer's request remains under the rule for requested moves.
        The review spend is the twelve-month spend: the extended_amount of the ship-to's order_line_shipped and order_backorder_filled lines dated within the 12 months before the review date, less the credit_amount of its order_return_received lines dated within the same 12 months, a line being within N months when fewer than N whole months separate its date from the review date.
        Whole months between two dates are the difference in calendar months between them, less one where the day of the month of the later date is smaller than the day of the month of the earlier date.
        The six-month spend is the same shipped and filled merchandise less return credits over the lines within the 6 months of the review date.
        The review threshold is downgrade_spend_pct percent of the entry gate spend of the level the ship-to holds, the entry gates being 0.00 for Corbett Parcel Ship-To, gate_standard_usd for Corbett Standard Ship-To, gate_priority_usd for Corbett Priority Ship-To, gate_route_usd for Corbett Route Delivery Ship-To, gate_premier_usd for Corbett Premier Route Ship-To and gate_dedicated_usd for Corbett Dedicated Delivery Ship-To.
        Moving down one service level takes Corbett Dedicated Delivery Ship-To to Corbett Premier Route Ship-To, Corbett Premier Route Ship-To to Corbett Route Delivery Ship-To, Corbett Route Delivery Ship-To to Corbett Priority Ship-To, Corbett Priority Ship-To to Corbett Standard Ship-To and Corbett Standard Ship-To to Corbett Parcel Ship-To, and a Corbett Parcel Ship-To keeps its level.
        The review spend and the review threshold are compared to the cent, without rounding either figure.
      params: [downgrade_spend_pct, gate_standard_usd, gate_priority_usd, gate_route_usd, gate_premier_usd, gate_dedicated_usd]
    prerequisite: []
    cross_category: []
    inputs:
      history:
        - {table: order_lines, aggregate: sum, field: extended_amount, within_months: 12, filters: {event_type: order_line_shipped}}
        - {table: order_lines, aggregate: sum, field: extended_amount, within_months: 12, filters: {event_type: order_backorder_filled}}
        - {table: order_returns, aggregate: sum, field: credit_amount, within_months: 12, filters: {event_type: order_return_received}}
        - {table: order_lines, aggregate: count, field: order_line_id, within_months: 12, filters: {event_type: order_line_shipped, ship_method: route_truck}}
        - {table: order_lines, aggregate: sum, field: extended_amount, within_months: 12, filters: {event_type: order_line_shipped, ship_method: manufacturer_dropship}}
        - {table: order_lines, aggregate: sum, field: extended_amount, within_months: 12, filters: {event_type: order_line_shipped, ship_method: will_call}}
      cross_category: []
  - id: order_ext_stock_rotation_return
    base_policy_refs: [order_evt_returns]
    overwrite:
      - base_policy: order_evt_returns
        superseded_clause: >-
          A customer-reason return (ordered_in_error or no_longer_needed) is authorized only when the request is made no later than return_window_days calendar days after the ship date of the returned line.
        replaced_by: >-
          A customer-reason return (ordered_in_error or no_longer_needed) is authorized only when the request is made no later than return_window_days calendar days after the ship date of the returned line, except that a stock-rotation return, and only a stock-rotation return, is authorized after that window under the rotation allowance; every other customer-reason return stays inside the window.
    trigger: on_request
    subject: [order_return_authorized]
    computes: quantity
    target_tool: submit_stock_rotation_return_550cd403
    params:
      rotation_rate_pct: 5
      rotation_rate_route_pct: 10
      rotation_rate_mid_pct: 7
      rotation_tenure_months: 60
      rotation_standing_watch_pct: 50
      rotation_program_paused_pct: 50
      rotation_cap_usd: 1500
      rotation_cap_mid_usd: 4000
      rotation_cap_top_usd: 8000
      rotation_commit_mid_usd: 50000
      rotation_commit_top_usd: 250000
      aged_stock_months: 12
      aged_stock_markdown_pct: 15
    rule: >
      A stock-rotation return lets the customer send back unopened stocked merchandise of a returnable item class that has stopped moving, against a yearly rotation allowance; it takes up the ship-to's most recent order_return_declined line whose decline_reason is outside_return_window, the most recent being the one with the latest event_date, and the order line, the item and the quantity requested on that declined line are the line, the item and the requested quantity of the rotation return; a ship-to with no such declined line, or with more than one such declined line on that latest date, has no rotation return under this rule, its requested quantity counting as 0.
      A stock-rotation return covers only a line that shipped in exactly one order_line_shipped shipment and has no order_backorder_filled line, whose item has stock_status stocked and an item_class outside the ship-to level's non_returnable_item_classes, and whose goods the customer states are unopened; for any other line the returnable quantity counts as 0.
      A customer-reason return (ordered_in_error or no_longer_needed) is authorized only when the request is made no later than return_window_days calendar days after the ship date of the returned line, except that a stock-rotation return, and only a stock-rotation return, is authorized after that window under the rotation allowance; every other customer-reason return stays inside the window.
      The customer submits the stock-rotation return on its own account, as one RMA line for the rotation item with return_reason no_longer_needed and return_method customer_shipped, carrying the invoiced unit price of the line, the unit price of its one shipment; its receipt, inspection, restocking fee and credit then follow the return rules as for any customer-reason return.
      The stock-rotation allowance is fixed only after the review of the ship-to's service level for its most recent opening anniversary has been recorded.
      The quantity authorized is the smallest of the requested quantity, the returnable quantity and the allowance units.
      The returnable quantity is the quantity of the line's order_line_shipped lines less the quantity of its order_return_authorized lines, adding back the quantity of its order_return_closed_no_credit lines, and never below 0.
      The rotation purchase base is the extended_amount of all of the ship-to's order_line_shipped and order_backorder_filled lines dated within the 12 months before the request date, a line being within N months when fewer than N whole months separate its date from the request date.
      Whole months between two dates are the difference in calendar months between them, less one where the day of the month of the later date is smaller than the day of the month of the earlier date.
      The gross allowance is rotation_rate_pct percent of the rotation purchase base.
      Customer-reason return credits already taken, the credit_amount of the ship-to's order_return_received lines with return_reason ordered_in_error or no_longer_needed dated within the 12 months before the request date, are deducted from the gross allowance, never below 0.00, and what remains is capped at rotation_cap_usd to give the allowance, rounded half up to the cent.
      The allowance units are the allowance divided by the line's invoiced unit price, rounded down to a whole unit; a line with no invoiced unit price above 0.00 has no allowance units.
      Adjustments to the rotation purchase base are made before any percentage is applied, an adjustment that narrows the merchandise the base counts being made first and an addition to the base being made after it, on the narrowed figure; every percentage that sets the gross allowance multiplies the adjusted purchase base, all of them in one product that is the gross allowance; credits already taken are then deducted from that product, and the cap is applied last, before the division into units.
      The rotation rate follows the ship-to's level and tenure: rotation_rate_route_pct percent for a ship-to holding Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To whose opened_date is at least rotation_tenure_months whole months before the request date; rotation_rate_mid_pct percent for a ship-to holding Corbett Priority Ship-To or Corbett Standard Ship-To whose opened_date is at least rotation_tenure_months whole months before the request date; rotation_rate_pct percent for every other ship-to, including one with no opened_date.
      The rotation purchase base follows the customer's active Contract Pricing Agreement: under a Corbett Category Contract it is only the ship-to's shipped and filled merchandise whose product_category is that of the rotation item, within the 12 months; under a Corbett Net-Price Contract or a Corbett Cost-Plus Contract it is only the ship-to's shipped and filled merchandise of the rotation item's sku, within the 24 months before the request date; under any other agreement, or with no active agreement, it is all of the ship-to's shipped and filled merchandise within the 12 months.
      The gross allowance carries a standing share set by the customer's Commercial Credit Account, the share being one of the percentages of the gross allowance: 0 percent where the account status is not active or the customer has no such account; rotation_standing_watch_pct percent where the account is active and carries at least one credit_payment_returned line dated within the 12 months before the request date; 100 percent where the account is active and carries no such line.
      StockSmart replenishment, the extended_amount of the vmi_replenishment_billed lines dated within the 12 months before the request date of the StockSmart program serving the ship-to, is added to the rotation purchase base in full where that program's status is active, at rotation_program_paused_pct percent where its status is paused or terminating, and not at all where the ship-to has no program in one of those statuses.
      The rotation unit value follows the item's contract price and the age of the shipment: where the latest contract item price line for the rotation item's sku on the customer's active Contract Pricing Agreement, latest by effective_date and the only line for that sku with that effective_date, is not a removal, takes effect after the ship date of the line's shipment and sets a contract_unit_price below the invoiced unit price, the allowance is divided by that contract_unit_price; where that does not hold and the shipment is dated at least aged_stock_months whole months before the request date, the allowance is divided by the invoiced unit price reduced by aged_stock_markdown_pct percent, rounded half up to 4 decimals; otherwise, including where the sku has no price line on the active agreement or the customer has no active agreement, the allowance is divided by the invoiced unit price.
      The allowance is capped at rotation_cap_top_usd where the customer's active Contract Pricing Agreement carries an annual_spend_commitment of at least rotation_commit_top_usd, at rotation_cap_mid_usd where it carries at least rotation_commit_mid_usd and less than rotation_commit_top_usd, and at rotation_cap_usd otherwise.
    compute:
      - rot_date: "LATEST('order_returns', 'event_date', event_type='order_return_declined', decline_reason='outside_return_window')"
      - declined_that_day: "COUNT('order_returns', event_type='order_return_declined', decline_reason='outside_return_window', event_date=rot_date)"
      - rot_order: "LATEST('order_returns', 'order_number', event_type='order_return_declined', decline_reason='outside_return_window')"
      - rot_line: "LATEST('order_returns', 'line_number', event_type='order_return_declined', decline_reason='outside_return_window')"
      - rot_sku: "LATEST('order_returns', 'sku', event_type='order_return_declined', decline_reason='outside_return_window')"
      - rot_requested: "(LATEST('order_returns', 'quantity', event_type='order_return_declined', decline_reason='outside_return_window') or 0) if declined_that_day == 1 else 0"
      - line_shipments: "COUNT('order_lines', event_type='order_line_shipped', order_number=rot_order, line_number=rot_line)"
      - line_fills: "COUNT('order_lines', event_type='order_backorder_filled', order_number=rot_order, line_number=rot_line)"
      - line_stock_status: "LATEST('order_lines', 'stock_status', event_type='order_line_shipped', order_number=rot_order, line_number=rot_line)"
      - line_item_class: "LATEST('order_lines', 'item_class', event_type='order_line_shipped', order_number=rot_order, line_number=rot_line)"
      - line_in_scope: "line_shipments == 1 and line_fills == 0 and line_stock_status == 'stocked' and not (line_item_class in P('non_returnable_item_classes'))"
      - last_ship_price: "(LATEST('order_lines', 'unit_price', event_type='order_line_shipped', order_number=rot_order, line_number=rot_line) or 0) if line_in_scope else 0"
      - returnable_qty: "MX(0, SUM('order_lines', 'quantity', event_type='order_line_shipped', order_number=rot_order, line_number=rot_line) - SUM('order_returns', 'quantity', event_type='order_return_authorized', order_number=rot_order, line_number=rot_line) + SUM('order_returns', 'quantity', event_type='order_return_closed_no_credit', order_number=rot_order, line_number=rot_line)) if line_in_scope else 0"
      - credits_taken: "SUM('order_returns', 'credit_amount', within_months=12, event_type='order_return_received', return_reason='ordered_in_error') + SUM('order_returns', 'credit_amount', within_months=12, event_type='order_return_received', return_reason='no_longer_needed')"
      - route_level_now: "F('variant_name') == 'Corbett Route Delivery Ship-To' or F('variant_name') == 'Corbett Premier Route Ship-To' or F('variant_name') == 'Corbett Dedicated Delivery Ship-To'"
      - mid_level_now: "F('variant_name') == 'Corbett Priority Ship-To' or F('variant_name') == 'Corbett Standard Ship-To'"
      - months_open: "MONTHS(F('opened_date'), NOW) if F('opened_date') else 0"
      - rotation_rate_pct: "K('rotation_rate_route_pct') if (route_level_now and months_open >= K('rotation_tenure_months')) else (K('rotation_rate_mid_pct') if (mid_level_now and months_open >= K('rotation_tenure_months')) else K('rotation_rate_pct'))"
      - agreement_tier: "CFIELD('pricing', 'variant_name', status='active')"
      - all_merch_12: "SUM('order_lines', 'extended_amount', within_months=12, event_type='order_line_shipped') + SUM('order_lines', 'extended_amount', within_months=12, event_type='order_backorder_filled')"
      - rot_category: "LATEST('order_lines', 'product_category', event_type='order_line_shipped', order_number=rot_order, line_number=rot_line)"
      - category_merch_12: "SUM('order_lines', 'extended_amount', within_months=12, event_type='order_line_shipped', product_category=rot_category) + SUM('order_lines', 'extended_amount', within_months=12, event_type='order_backorder_filled', product_category=rot_category)"
      - item_merch_24: "SUM('order_lines', 'extended_amount', within_months=24, event_type='order_line_shipped', sku=rot_sku) + SUM('order_lines', 'extended_amount', within_months=24, event_type='order_backorder_filled', sku=rot_sku)"
      - purchase_base: "category_merch_12 if agreement_tier == 'Corbett Category Contract' else (item_merch_24 if (agreement_tier == 'Corbett Net-Price Contract' or agreement_tier == 'Corbett Cost-Plus Contract') else all_merch_12)"
      - credit_status: "CFIELD('credit', 'status')"
      - returned_payments_12: "XCOUNT('credit', 'credit_transactions', within_months=12, date_field='txn_date', event_type='credit_payment_returned')"
      - standing_pct: "0 if credit_status != 'active' else (K('rotation_standing_watch_pct') if (credit_status == 'active' and returned_payments_12 >= 1) else 100)"
      - program_active_id: "CFIELD('vmi', 'vmi_program_id', ship_to_id=HID, status='active')"
      - program_held_id: "CFIELD('vmi', 'vmi_program_id', ship_to_id=HID, status='paused') or CFIELD('vmi', 'vmi_program_id', ship_to_id=HID, status='terminating')"
      - program_billed_active: "XSUM('vmi', 'vmi_activity', 'extended_amount', within_months=12, event_type='vmi_replenishment_billed', vmi_program_id=program_active_id)"
      - program_billed_held: "XSUM('vmi', 'vmi_activity', 'extended_amount', within_months=12, event_type='vmi_replenishment_billed', vmi_program_id=program_held_id)"
      - program_added: "program_billed_active if program_active_id != None else (program_billed_held * K('rotation_program_paused_pct') / 100 if program_held_id != None else 0.0)"
      - last_ship_date: "LATEST('order_lines', 'event_date', event_type='order_line_shipped', order_number=rot_order, line_number=rot_line)"
      - agreement_id: "CFIELD('pricing', 'pricing_agreement_id', status='active')"
      - latest_price_event: "XLATEST('pricing', 'pricing_items', 'event_type', date_field='effective_date', sku=rot_sku, pricing_agreement_id=agreement_id)"
      - latest_price_date: "XLATEST('pricing', 'pricing_items', 'effective_date', date_field='effective_date', sku=rot_sku, pricing_agreement_id=agreement_id)"
      - latest_contract_price: "XLATEST('pricing', 'pricing_items', 'contract_unit_price', date_field='effective_date', sku=rot_sku, pricing_agreement_id=agreement_id)"
      - lines_that_date: "XCOUNT('pricing', 'pricing_items', sku=rot_sku, pricing_agreement_id=agreement_id, effective_date=latest_price_date)"
      - lower_contract_after_ship: "latest_price_event != None and lines_that_date == 1 and latest_price_event != 'pricing_item_removed' and last_ship_date != None and DAYS(last_ship_date, latest_price_date) > 0 and float(latest_contract_price or 0) < last_ship_price"
      - aged_shipment: "last_ship_date != None and MONTHS(last_ship_date, NOW) >= K('aged_stock_months')"
      - unit_value: "float(latest_contract_price) if lower_contract_after_ship else (RND(last_ship_price * (100 - K('aged_stock_markdown_pct')) / 100, 4) if (aged_shipment and not lower_contract_after_ship) else last_ship_price)"
      - commitment: "CFIELD('pricing', 'annual_spend_commitment', status='active') or 0"
      - allowance_cap: "K('rotation_cap_top_usd') if commitment >= K('rotation_commit_top_usd') else (K('rotation_cap_mid_usd') if (commitment >= K('rotation_commit_mid_usd') and commitment < K('rotation_commit_top_usd')) else K('rotation_cap_usd'))"
      - gross_allowance: "(purchase_base + program_added) * rotation_rate_pct / 100 * standing_pct / 100"
      - allowance: "RND(MN(MX(0, gross_allowance - credits_taken), allowance_cap), 2)"
      - allowance_units: "int(allowance / unit_value) if unit_value > 0 else 0"
      - result: "MN(rot_requested, returnable_qty, allowance_units)"
    compute_basis:
