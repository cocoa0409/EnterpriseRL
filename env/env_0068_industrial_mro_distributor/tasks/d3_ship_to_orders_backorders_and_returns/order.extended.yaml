    factors:
      - id: rotation_rate
        effect: parameter
        decides: rotation_rate_pct
        bindings: [route_level_now, mid_level_now, months_open, rotation_rate_pct]
        ladder:
          - when: "the ship-to holds Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To AND its opened_date is at least rotation_tenure_months whole months before the request date"
            value: "K('rotation_rate_route_pct')"
          - when: "the ship-to holds Corbett Priority Ship-To or Corbett Standard Ship-To AND its opened_date is at least rotation_tenure_months whole months before the request date"
            value: "K('rotation_rate_mid_pct')"
          - when: "otherwise"
            value: "K('rotation_rate_pct')"
        baseline:
          rotation_rate_pct: "K('rotation_rate_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: rotation_base_scope
        effect: method
        decides: purchase_base
        bindings: [agreement_tier, rot_category, category_merch_12, item_merch_24, purchase_base]
        ladder:
          - when: "the customer's active Contract Pricing Agreement is a Corbett Category Contract"
            method: "only shipped and filled merchandise in the rotation item's product_category within the 12 months"
          - when: "the customer's active Contract Pricing Agreement is a Corbett Net-Price Contract or a Corbett Cost-Plus Contract"
            method: "only shipped and filled merchandise of the rotation item's sku within the 24 months"
          - when: "otherwise (any other agreement, or no active agreement)"
            method: "all shipped and filled merchandise within the 12 months"
        baseline:
          purchase_base: "all_merch_12"
        evidence: [cross_category, history]
        cross_difficulty: pricing
      - id: rotation_standing
        effect: parameter
        decides: standing_pct
        bindings: [credit_status, returned_payments_12, standing_pct]
        ladder:
          - when: "the Commercial Credit Account status is not active"
            value: "0"
          - when: "the account is active AND it carries at least one credit_payment_returned line within the 12 months before the request date"
            value: "K('rotation_standing_watch_pct')"
          - when: "otherwise (active with no such line)"
            value: "100"
        baseline:
          standing_pct: "100"
        evidence: [cross_category, history]
        cross_difficulty: credit
      - id: rotation_program_share
        effect: parameter
        decides: program_added
        bindings: [program_active_id, program_held_id, program_billed_active, program_billed_held, program_added]
        ladder:
          - when: "the StockSmart program serving the ship-to is active"
            value: "the program's billed replenishment of the 12 months, in full"
          - when: "that program is paused or terminating"
            value: "that program's billed replenishment of the 12 months at K('rotation_program_paused_pct') percent"
          - when: "otherwise (no program in one of those statuses at the ship-to)"
            value: "0.00 (not added)"
        baseline:
          program_added: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: vmi
      - id: rotation_unit_value
        effect: parameter
        decides: unit_value
        bindings: [last_ship_date, agreement_id, latest_price_event, latest_price_date, latest_contract_price, lines_that_date, lower_contract_after_ship, aged_shipment, unit_value]
        ladder:
          - when: "the item's latest contract item price line on the active agreement (the only one on its effective_date) is not a removal AND it takes effect after the ship date of the line's shipment AND its contract_unit_price is below the invoiced unit price"
            value: "that later, lower contract_unit_price"
          - when: "that does not hold AND the shipment is dated at least aged_stock_months whole months before the request date"
            value: "the invoiced unit price reduced by K('aged_stock_markdown_pct') percent, rounded half up to 4 decimals"
          - when: "otherwise (including no price line on the active agreement, or no active agreement)"
            value: "the invoiced unit price"
        baseline:
          unit_value: "last_ship_price"
        evidence: [cross_category, history, date]
        cross_difficulty: pricing
      - id: rotation_cap
        effect: parameter
        decides: allowance_cap
        bindings: [commitment, allowance_cap]
        ladder:
          - when: "the active Contract Pricing Agreement carries an annual_spend_commitment of at least rotation_commit_top_usd"
            value: "K('rotation_cap_top_usd')"
          - when: "it carries at least rotation_commit_mid_usd and less than rotation_commit_top_usd"
            value: "K('rotation_cap_mid_usd')"
          - when: "otherwise"
            value: "K('rotation_cap_usd')"
        baseline:
          allowance_cap: "K('rotation_cap_usd')"
        evidence: [cross_category]
        cross_difficulty: pricing
    baseline:
      rule: >-
        A stock-rotation return lets the customer send back unopened stocked merchandise of a returnable item class that has stopped moving, against a yearly rotation allowance; it takes up the ship-to's most recent order_return_declined line whose decline_reason is outside_return_window, the most recent being the one with the latest event_date, and the order line, the item and the quantity requested on that declined line are the line, the item and the requested quantity of the rotation return; a ship-to with no such declined line, or with more than one such declined line on that latest date, has no rotation return under this rule, its requested quantity counting as 0.
        A stock-rotation return covers only a line that shipped in exactly one order_line_shipped shipment and has no order_backorder_filled line, whose item has stock_status stocked and an item_class outside the ship-to level's non_returnable_item_classes, and whose goods the customer states are unopened; for any other line the returnable quantity counts as 0.
        The quantity authorized is the smallest of the requested quantity, the returnable quantity and the allowance units.
        The returnable quantity is the quantity of the line's order_line_shipped lines less the quantity of its order_return_authorized lines, adding back the quantity of its order_return_closed_no_credit lines, and never below 0.
        The rotation purchase base is the extended_amount of all of the ship-to's order_line_shipped and order_backorder_filled lines dated within the 12 months before the request date, a line being within N months when fewer than N whole months separate its date from the request date.
        Whole months between two dates are the difference in calendar months between them, less one where the day of the month of the later date is smaller than the day of the month of the earlier date.
        The gross allowance is rotation_rate_pct percent of the rotation purchase base.
        Customer-reason return credits already taken, the credit_amount of the ship-to's order_return_received lines with return_reason ordered_in_error or no_longer_needed dated within the 12 months before the request date, are deducted from the gross allowance, never below 0.00, and what remains is capped at rotation_cap_usd to give the allowance, rounded half up to the cent.
        The allowance units are the allowance divided by the line's invoiced unit price, rounded down to a whole unit; a line with no invoiced unit price above 0.00 has no allowance units.
      params: [rotation_rate_pct, rotation_cap_usd]
    prerequisite:
      - problem: order_ext_anniversary_review
        kind: value_input
        gate: rotation_rate_pct
        form: action
        policy_source: >-
          The stock-rotation allowance is fixed only after the review of the ship-to's service level for its most recent opening anniversary has been recorded.
        fallback_reason: >-
          The review leaves the level held and the last review date on the ship-to, but a requested change of service level writes the same two fields, so no record-visible state singles out the anniversary review; the sentence therefore names the review itself.
        condition: >-
          The ship-to's last_review_date is on or after its most recent opening anniversary and its variant_name is the level that anniversary review settled.
        resolved_by: record_anniversary_review_a2ef3cef
        effect: >-
          Once the review is recorded the level the ship-to holds is the reviewed level, and the rotation rate is read from that level, so rotation_rate_pct takes the rate of the reviewed level.
    cross_category:
      - category: pricing
        as: branch
        reads: [pricing_agreement_id, variant_name, status, annual_spend_commitment, pricing_items.event_type, pricing_items.effective_date, pricing_items.contract_unit_price, pricing_items.pricing_agreement_id]
        note: The agreement tier decides the rotation purchase base scope, its commitment decides the cap, and the item's latest contract price line decides the unit value.
      - category: credit
        as: history
        reads: [status, credit_transactions.event_type, credit_transactions.txn_date]
        note: The credit account status and its returned payments of the last 12 months decide the standing share.
      - category: vmi
        as: history
        reads: [status, vmi_program_id, ship_to_id, vmi_activity.extended_amount, vmi_activity.event_type]
        note: The status of the StockSmart program at the ship-to decides how much of its billed replenishment joins the purchase base.
    inputs:
      history:
        - {table: order_lines, aggregate: sum, field: extended_amount, within_months: 12, filters: {event_type: order_line_shipped}}
        - {table: order_lines, aggregate: sum, field: extended_amount, within_months: 12, filters: {event_type: order_backorder_filled}}
        - {table: order_returns, aggregate: latest, field: order_number, filters: {event_type: order_return_declined, decline_reason: outside_return_window}}
        - {table: order_returns, aggregate: sum, field: credit_amount, within_months: 12, filters: {event_type: order_return_received}}
        - {category: credit, table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_payment_returned}}
        - {category: vmi, table: vmi_activity, aggregate: sum, field: extended_amount, within_months: 12, filters: {event_type: vmi_replenishment_billed}}
        - {category: pricing, table: pricing_items, aggregate: latest, field: contract_unit_price, filters: {}}
      cross_category: [pricing, credit, vmi]
  - id: order_ext_reactivation_level
    base_policy_refs: [order_ship_to_lifecycle]
    overwrite:
      - base_policy: order_ship_to_lifecycle
        superseded_clause: >-
          a suspended ship-to takes no orders and is reactivated by the agent at the customer's request at its prior service level, provided the customer's Commercial Credit Account status is active.
        replaced_by: >-
          A suspended ship-to takes no orders and is reactivated by the agent at the customer's request, provided the customer's Commercial Credit Account status is active, at its prior service level lowered by the level drops its reactivation carries, never below Corbett Parcel Ship-To.
    trigger: on_request
    subject: [order_ship_to_reactivated]
    computes: variant_name
    target_tool: reactivate_ship_to_971b9440
    params:
      dormancy_two_months: 30
      dormancy_one_months: 18
      long_tenure_months: 180
      mid_tenure_months: 96
      payment_marks_two: 2
      sparse_route_runs_active_year: 6
    rule: >
      A suspended ship-to takes no orders and is reactivated by the agent at the customer's request, provided the customer's Commercial Credit Account status is active, at its prior service level lowered by the level drops its reactivation carries, never below Corbett Parcel Ship-To.
      The prior service level is the level the suspended ship-to holds, and a reactivation that carries no level drop restores that level.
      The service levels rank from lowest to highest Corbett Parcel Ship-To, Corbett Standard Ship-To, Corbett Priority Ship-To, Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To and Corbett Dedicated Delivery Ship-To, and each level drop moves the reactivated level one place down that ranking.
      Every level drop a reactivation carries is added and every drop taken back is subtracted, all in one total taken as never below zero; any adjustment made to the total itself is made to that net total, and the adjusted total is the number of places the ship-to comes back below its prior level.
      Dormancy drops follow the whole months between the ship-to's last_order_date and the reactivation date: two drops where they are at least dormancy_two_months, one drop where they are at least dormancy_one_months and fewer than dormancy_two_months, and none where they are fewer than dormancy_one_months or the ship-to has no last_order_date.
      Route drops follow how much a ship-to holding Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To used its route service in its last active year, the lines dated at least D and fewer than D + 12 whole months before the reactivation date, D being the whole months from its last_order_date to the reactivation date: two drops for such a route-level ship-to with no order_line_shipped line shipped by route_truck in that year, one drop for such a route-level ship-to with at least one and fewer than sparse_route_runs_active_year such route_truck shipments, and none for every other ship-to, a ship-to with no last_order_date having no last active year and so no route drop.
      Whole months between two dates are the difference in calendar months between them, less one where the day of the month of the later date is smaller than the day of the month of the earlier date.
      Payment drops follow the customer's Commercial Credit Account: two drops where its credit_payment_returned lines and its credit_charge_assessed lines with charge_type finance_charge dated within the 12 months before the reactivation date number at least payment_marks_two together, one drop where they number exactly one, and none where there are none.
      A StockSmart program still serving the ship-to takes drops back, the program read being the ship-to's program whose status is active (a closed, paused, terminating or enrolled program is never read): two drops are taken back where that program is StockSmart Onsite Storeroom, one where it is at any other StockSmart tier, and none where the ship-to has no active program.
      The total is adjusted for the ship-to's tenure, measured in whole months from its opened_date to the reactivation date (0 months where the ship-to has no opened_date): for a ship-to open at least long_tenure_months months the total is halved and rounded down to a whole drop; for a ship-to open at least mid_tenure_months and fewer than long_tenure_months months one drop is taken off the total, never below zero; for every other ship-to the total stands as added.
    compute:
      - prior_level: "F('variant_name')"
      - prior_rank: "6 if prior_level == 'Corbett Dedicated Delivery Ship-To' else (5 if prior_level == 'Corbett Premier Route Ship-To' else (4 if prior_level == 'Corbett Route Delivery Ship-To' else (3 if prior_level == 'Corbett Priority Ship-To' else (2 if prior_level == 'Corbett Standard Ship-To' else 1))))"
      - dormant_months: "MONTHS(F('last_order_date'), NOW) if F('last_order_date') else 0"
      - dormancy_drops: "0 if not F('last_order_date') else (2 if MONTHS(F('last_order_date'), NOW) >= K('dormancy_two_months') else (1 if (MONTHS(F('last_order_date'), NOW) >= K('dormancy_one_months') and MONTHS(F('last_order_date'), NOW) < K('dormancy_two_months')) else 0))"
      - active_year_route_runs: "COUNT('order_lines', within_months=dormant_months + 12, event_type='order_line_shipped', ship_method='route_truck') - COUNT('order_lines', within_months=dormant_months, event_type='order_line_shipped', ship_method='route_truck')"
      - route_level_prior: "prior_level == 'Corbett Route Delivery Ship-To' or prior_level == 'Corbett Premier Route Ship-To' or prior_level == 'Corbett Dedicated Delivery Ship-To'"
      - route_drops: "0 if not F('last_order_date') else (2 if (route_level_prior and active_year_route_runs == 0) else (1 if (route_level_prior and active_year_route_runs >= 1 and active_year_route_runs < K('sparse_route_runs_active_year')) else 0))"
      - payment_marks_12: "XCOUNT('credit', 'credit_transactions', within_months=12, date_field='txn_date', event_type='credit_payment_returned') + XCOUNT('credit', 'credit_transactions', within_months=12, date_field='txn_date', event_type='credit_charge_assessed', charge_type='finance_charge')"
      - payment_drops: "2 if payment_marks_12 >= K('payment_marks_two') else (1 if payment_marks_12 == 1 else 0)"
      - program_tier_now: "CFIELD('vmi', 'variant_name', ship_to_id=HID, status='active')"
      - program_takeback: "2 if program_tier_now == 'StockSmart Onsite Storeroom' else (1 if (program_tier_now != None and program_tier_now != 'StockSmart Onsite Storeroom') else 0)"
      - drops_added: "MX(0, dormancy_drops + route_drops + payment_drops - program_takeback)"
      - months_open_now: "MONTHS(F('opened_date'), NOW) if F('opened_date') else 0"
      - tenure_rule: "2 if months_open_now >= K('long_tenure_months') else (1 if (months_open_now >= K('mid_tenure_months') and months_open_now < K('long_tenure_months')) else 0)"
      - drops_total: "int(drops_added / 2) if tenure_rule == 2 else (MX(0, drops_added - 1) if tenure_rule == 1 else drops_added)"
      - level_rank: "MX(1, prior_rank - drops_total)"
      - result: "'Corbett Dedicated Delivery Ship-To' if level_rank == 6 else ('Corbett Premier Route Ship-To' if level_rank == 5 else ('Corbett Route Delivery Ship-To' if level_rank == 4 else ('Corbett Priority Ship-To' if level_rank == 3 else ('Corbett Standard Ship-To' if level_rank == 2 else 'Corbett Parcel Ship-To'))))"
    compute_basis:
      prior_level: "The prior service level is the level the suspended ship-to holds, and a reactivation that carries no level drop restores that level."
      prior_rank: "The service levels rank from lowest to highest Corbett Parcel Ship-To, Corbett Standard Ship-To, Corbett Priority Ship-To, Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To and Corbett Dedicated Delivery Ship-To, and each level drop moves the reactivated level one place down that ranking."
      dormant_months: "D being the whole months from its last_order_date to the reactivation date"
      dormancy_drops: "Dormancy drops follow the whole months between the ship-to's last_order_date and the reactivation date: two drops where they are at least dormancy_two_months, one drop where they are at least dormancy_one_months and fewer than dormancy_two_months, and none where they are fewer than dormancy_one_months or the ship-to has no last_order_date."
      active_year_route_runs: "the lines dated at least D and fewer than D + 12 whole months before the reactivation date, D being the whole months from its last_order_date to the reactivation date"
      route_level_prior: "Route drops follow how much a ship-to holding Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To used its route service in its last active year"
      route_drops: "Route drops follow how much a ship-to holding Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To or Corbett Dedicated Delivery Ship-To used its route service in its last active year, the lines dated at least D and fewer than D + 12 whole months before the reactivation date, D being the whole months from its last_order_date to the reactivation date: two drops for such a route-level ship-to with no order_line_shipped line shipped by route_truck in that year, one drop for such a route-level ship-to with at least one and fewer than sparse_route_runs_active_year such route_truck shipments, and none for every other ship-to, a ship-to with no last_order_date having no last active year and so no route drop."
      payment_marks_12: "its credit_payment_returned lines and its credit_charge_assessed lines with charge_type finance_charge dated within the 12 months before the reactivation date"
      payment_drops: "Payment drops follow the customer's Commercial Credit Account: two drops where its credit_payment_returned lines and its credit_charge_assessed lines with charge_type finance_charge dated within the 12 months before the reactivation date number at least payment_marks_two together, one drop where they number exactly one, and none where there are none."
      program_tier_now: "the program read being the ship-to's program whose status is active (a closed, paused, terminating or enrolled program is never read)"
      program_takeback: "A StockSmart program still serving the ship-to takes drops back, the program read being the ship-to's program whose status is active (a closed, paused, terminating or enrolled program is never read): two drops are taken back where that program is StockSmart Onsite Storeroom, one where it is at any other StockSmart tier, and none where the ship-to has no active program."
      drops_added: "Every level drop a reactivation carries is added and every drop taken back is subtracted, all in one total taken as never below zero"
      months_open_now: "The total is adjusted for the ship-to's tenure, measured in whole months from its opened_date to the reactivation date (0 months where the ship-to has no opened_date)"
      tenure_rule: "for a ship-to open at least long_tenure_months months the total is halved and rounded down to a whole drop; for a ship-to open at least mid_tenure_months and fewer than long_tenure_months months one drop is taken off the total, never below zero; for every other ship-to the total stands as added."
      drops_total: "any adjustment made to the total itself is made to that net total, and the adjusted total is the number of places the ship-to comes back below its prior level."
      level_rank: "at its prior service level lowered by the level drops its reactivation carries, never below Corbett Parcel Ship-To."
      result: "A suspended ship-to takes no orders and is reactivated by the agent at the customer's request, provided the customer's Commercial Credit Account status is active, at its prior service level lowered by the level drops its reactivation carries, never below Corbett Parcel Ship-To."
    factors:
      - id: dormancy_level_drops
        effect: parameter
        decides: dormancy_drops
        bindings: [dormancy_drops]
        ladder:
          - when: "at least dormancy_two_months whole months between the last_order_date and the reactivation date"
            value: "2"
          - when: "at least dormancy_one_months and fewer than dormancy_two_months whole months"
            value: "1"
          - when: "otherwise"
            value: "0"
        baseline:
          dormancy_drops: "0"
        evidence: [date]
        cross_difficulty: null
      - id: lost_route_drops
        effect: parameter
        decides: route_drops
        bindings: [dormant_months, active_year_route_runs, route_level_prior, route_drops]
        ladder:
          - when: "the ship-to holds a route level AND it had no route_truck shipment in its last active year"
            value: "2"
          - when: "the ship-to holds a route level AND it had at least one and fewer than sparse_route_runs_active_year route_truck shipments in its last active year"
            value: "1"
          - when: "otherwise (any other ship-to, or a ship-to with no last_order_date)"
            value: "0"
        baseline:
          route_drops: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: payment_level_drops
        effect: parameter
        decides: payment_drops
        bindings: [payment_marks_12, payment_drops]
        ladder:
          - when: "returned payments and finance charges within the 12 months number at least payment_marks_two together"
            value: "2"
          - when: "they number exactly one"
            value: "1"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          payment_drops: "0"
        evidence: [cross_category, history]
        cross_difficulty: credit
      - id: stocksmart_takeback
        effect: parameter
        decides: program_takeback
        bindings: [program_tier_now, program_takeback]
        ladder:
          - when: "the ship-to's active StockSmart program is StockSmart Onsite Storeroom"
            value: "2"
          - when: "the ship-to's active StockSmart program is at any other StockSmart tier"
            value: "1"
          - when: "otherwise (no active program)"
            value: "0"
        baseline:
          program_takeback: "0"
        evidence: [cross_category]
        cross_difficulty: vmi
      - id: tenure_adjustment
        effect: method
        decides: tenure_rule
        bindings: [months_open_now, tenure_rule]
        ladder:
          - when: "the ship-to has been open at least long_tenure_months whole months"
            method: "the added drops are halved and rounded down to a whole drop"
          - when: "it has been open at least mid_tenure_months and fewer than long_tenure_months whole months"
            method: "one drop is taken off the added drops, never below zero"
          - when: "otherwise"
            method: "the added drops stand as added"
        baseline:
          tenure_rule: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A suspended ship-to takes no orders and is reactivated by the agent at the customer's request, provided the customer's Commercial Credit Account status is active, at its prior service level lowered by the level drops its reactivation carries, never below Corbett Parcel Ship-To.
        The prior service level is the level the suspended ship-to holds, and a reactivation that carries no level drop restores that level.
        The service levels rank from lowest to highest Corbett Parcel Ship-To, Corbett Standard Ship-To, Corbett Priority Ship-To, Corbett Route Delivery Ship-To, Corbett Premier Route Ship-To and Corbett Dedicated Delivery Ship-To, and each level drop moves the reactivated level one place down that ranking.
      params: []
    prerequisite: []
    cross_category:
      - category: credit
        as: history
        reads: [credit_transactions.event_type, credit_transactions.charge_type, credit_transactions.txn_date]
        note: Returned payments and finance charges of the last 12 months on the customer's credit account decide the payment drops.
      - category: vmi
        as: branch
        reads: [status, variant_name, ship_to_id]
        note: The status and tier of the StockSmart program serving the ship-to decide how many drops are taken back.
    inputs:
      history:
        - {table: order_lines, aggregate: count, field: order_line_id, within_months: 40, filters: {event_type: order_line_shipped, ship_method: route_truck}}
        - {category: credit, table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_payment_returned}}
        - {category: credit, table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_charge_assessed, charge_type: finance_charge}}
      cross_category: [credit, vmi]
  - id: order_ext_requested_move_up
    base_policy_refs: [order_ship_to_lifecycle, order_agg_ship_to_portfolio]
    overwrite:
      - base_policy: order_ship_to_lifecycle
        superseded_clause: >-
          a customer may ask to move up when the ship-to's trailing spend meets the higher level's entry gate, and a route level needs a delivery ZIP inside a route territory.
        replaced_by: >-
          A customer may ask to move a ship-to up; for a ship-to holding Corbett Parcel Ship-To or Corbett Standard Ship-To, and only for such a ship-to, the move up to the next level is decided on the move-up measure against that next level's entry gate, while a ship-to holding Corbett Priority Ship-To or a route level that asks to move up stays under the trailing spend against the higher level's entry gate, a route level also needing a delivery ZIP inside a route territory, and keeps its level under this rule.
      - base_policy: order_agg_ship_to_portfolio
        superseded_clause: >-
          Service level entry gates are measured on the ship-to's own trailing 12 month spend, except that a new ship-to of a customer whose other active ship-tos together had trailing 12 month spend of at least the requested level's entry gate may open at that level for its first 12 months.
        replaced_by: >-
          Service level entry gates are measured on the ship-to's own trailing 12 month spend, except that a new ship-to of a customer whose other active ship-tos together had trailing 12 month spend of at least the requested level's entry gate may open at that level for its first 12 months, and except that a requested move up decided under this rule, and only such a move, is measured on the move-up measure against the next level's entry gate as applied under this rule.
    trigger: on_request
    subject: [order_service_level_changed]
    computes: variant_name
    target_tool: elect_service_level_move_6cd24a6d
    params:
      move_gate_standard_usd: 5000
      move_gate_priority_usd: 25000
      young_site_months: 12
      commit_top_usd: 150000
      commit_mid_usd: 60000
      gate_share_top_pct: 88
      gate_share_mid_pct: 94
      standing_gate_share_pct: 95
      standing_gate_recent_pct: 97
      terms_gate_long_pct: 90
      terms_gate_mid_pct: 94
      credit_long_months: 120
      credit_mid_months: 60
      credit_tenure_long_pct: 95
      credit_tenure_mid_pct: 97
    rule: >
      A customer may ask to move a ship-to up; for a ship-to holding Corbett Parcel Ship-To or Corbett Standard Ship-To, and only for such a ship-to, the move up to the next level is decided on the move-up measure against that next level's entry gate, while a ship-to holding Corbett Priority Ship-To or a route level that asks to move up stays under the trailing spend against the higher level's entry gate, a route level also needing a delivery ZIP inside a route territory, and keeps its level under this rule.
      A requested move up is not decided until the ship-to's status is active.
      Service level entry gates are measured on the ship-to's own trailing 12 month spend, except that a new ship-to of a customer whose other active ship-tos together had trailing 12 month spend of at least the requested level's entry gate may open at that level for its first 12 months, and except that a requested move up decided under this rule, and only such a move, is measured on the move-up measure against the next level's entry gate as applied under this rule.
      The next level is Corbett Standard Ship-To for a ship-to holding Corbett Parcel Ship-To, with entry gate move_gate_standard_usd, and Corbett Priority Ship-To for a ship-to holding Corbett Standard Ship-To, with entry gate move_gate_priority_usd.
      The move-up measure is the twelve-month site spend: the extended_amount of the ship-to's order_line_shipped and order_backorder_filled lines dated within the 12 months before the request date less the credit_amount of its order_return_received lines dated within the same 12 months, a line being within N months when fewer than N whole months separate its date from the request date.
      Whole months between two dates are the difference in calendar months between them, less one where the day of the month of the later date is smaller than the day of the month of the earlier date.
      A ship-to whose move-up measure is at or above the next level's entry gate moves up to the next level; a ship-to whose measure is below it keeps its level; the measure and the gate are compared to the cent without rounding.
      StockSmart replenishment never counts in the move-up measure, program spend not counting toward a ship-to's service level spend, and VendPoint usage does not count in it either.
      The move-up measure follows the ship-to's own ordering: for a ship-to with no order_line_shipped line within the 12 months, coming back to ordering, the measure is the same merchandise less return credits over its last active year, the lines dated at least D and fewer than D + 12 whole months before the request date, D being the whole months from its last_order_date to the request date, multiplied by 12 and divided by D + 12 (a ship-to with no last_order_date having no last active year and a measure of 0.00); for a ship-to with order_line_shipped lines within the 12 months that has been open fewer than young_site_months whole months, the measure is the twelve-month site spend multiplied by 12 and divided by its whole months open, counted as at least 1 (a ship-to with no opened_date counting as open 0 months); for every other ship-to the measure is the twelve-month site spend.
      The next level's entry gate is applied at a share set by the customer's active Contract Pricing Agreement: at gate_share_top_pct percent where its annual_spend_commitment is at least commit_top_usd, at gate_share_mid_pct percent where it is at least commit_mid_usd and less than commit_top_usd, and in full otherwise.
      The next level's entry gate is further applied at a share set by the customer's Commercial Credit Account payment record: at standing_gate_share_pct percent where the account is active and carries no credit_payment_returned line dated within the 24 months before the request date, at standing_gate_recent_pct percent where it is active and carries such a line within those 24 months but none within the 12 months before the request date, and in full otherwise.
      The next level's entry gate is further applied at a share set by the terms tier of the customer's Commercial Credit Account: at terms_gate_long_pct percent for a Corbett Net 60 Corporate Account or a Corbett Net 90 Strategic Account, at terms_gate_mid_pct percent for a Corbett Net 30 Preferred Account or a Corbett Net 45 Business Account, and in full for every other tier or where the customer has no such account.
      The next level's entry gate is further applied at a share set by how long the customer has held its Commercial Credit Account, in whole months from the account's opened_date to the request date: at credit_tenure_long_pct percent for at least credit_long_months months, at credit_tenure_mid_pct percent for at least credit_mid_months and fewer than credit_long_months months, and in full for a shorter tenure or where the customer has no such account or its account has no opened_date.
      The next level's entry gate is multiplied by every share that applies to it, the shares together in one product, and the move-up measure is compared with that product.
    compute:
      - held_level_now: "F('variant_name')"
      - next_level: "'Corbett Standard Ship-To' if held_level_now == 'Corbett Parcel Ship-To' else ('Corbett Priority Ship-To' if held_level_now == 'Corbett Standard Ship-To' else held_level_now)"
      - next_gate: "K('move_gate_standard_usd') if held_level_now == 'Corbett Parcel Ship-To' else (K('move_gate_priority_usd') if held_level_now == 'Corbett Standard Ship-To' else 0.0)"
      - own_12: "SUM('order_lines', 'extended_amount', within_months=12, event_type='order_line_shipped') + SUM('order_lines', 'extended_amount', within_months=12, event_type='order_backorder_filled') - SUM('order_returns', 'credit_amount', within_months=12, event_type='order_return_received')"
      - own_shipped_lines_12: "COUNT('order_lines', within_months=12, event_type='order_line_shipped')"
      - site_months_open: "MONTHS(F('opened_date'), NOW) if F('opened_date') else 0"
      - months_since_last_order: "MONTHS(F('last_order_date'), NOW) if F('last_order_date') else 0"
      - last_active_year_spend: "(SUM('order_lines', 'extended_amount', within_months=months_since_last_order + 12, event_type='order_line_shipped') - SUM('order_lines', 'extended_amount', within_months=months_since_last_order, event_type='order_line_shipped') + SUM('order_lines', 'extended_amount', within_months=months_since_last_order + 12, event_type='order_backorder_filled') - SUM('order_lines', 'extended_amount', within_months=months_since_last_order, event_type='order_backorder_filled') - SUM('order_returns', 'credit_amount', within_months=months_since_last_order + 12, event_type='order_return_received') + SUM('order_returns', 'credit_amount', within_months=months_since_last_order, event_type='order_return_received')) if F('last_order_date') else 0.0"
      - measure_basis: "1 if own_shipped_lines_12 == 0 else (2 if (own_shipped_lines_12 > 0 and site_months_open < K('young_site_months')) else 0)"
      - commitment_now: "CFIELD('pricing', 'annual_spend_commitment', status='active') or 0"
      - gate_share: "K('gate_share_top_pct') if commitment_now >= K('commit_top_usd') else (K('gate_share_mid_pct') if (commitment_now >= K('commit_mid_usd') and commitment_now < K('commit_top_usd')) else 100)"
      - site_credit_status: "CFIELD('credit', 'status')"
      - returned_24: "XCOUNT('credit', 'credit_transactions', within_months=24, date_field='txn_date', event_type='credit_payment_returned')"
      - returned_12: "XCOUNT('credit', 'credit_transactions', within_months=12, date_field='txn_date', event_type='credit_payment_returned')"
      - standing_share: "K('standing_gate_share_pct') if (site_credit_status == 'active' and returned_24 == 0) else (K('standing_gate_recent_pct') if (site_credit_status == 'active' and returned_24 > 0 and returned_12 == 0) else 100)"
      - terms_tier: "CFIELD('credit', 'variant_name')"
      - terms_share: "K('terms_gate_long_pct') if (terms_tier == 'Corbett Net 60 Corporate Account' or terms_tier == 'Corbett Net 90 Strategic Account') else (K('terms_gate_mid_pct') if (terms_tier == 'Corbett Net 30 Preferred Account' or terms_tier == 'Corbett Net 45 Business Account') else 100)"
      - credit_opened: "CFIELD('credit', 'opened_date')"
      - credit_months_held: "MONTHS(credit_opened, NOW) if credit_opened else 0"
      - tenure_share: "K('credit_tenure_long_pct') if (credit_opened and credit_months_held >= K('credit_long_months')) else (K('credit_tenure_mid_pct') if (credit_opened and credit_months_held >= K('credit_mid_months') and credit_months_held < K('credit_long_months')) else 100)"
      - move_measure: "last_active_year_spend * 12 / (months_since_last_order + 12) if measure_basis == 1 else (own_12 * 12 / MX(1, site_months_open) if measure_basis == 2 else own_12)"
      - applied_gate: "next_gate * gate_share / 100 * standing_share / 100 * terms_share / 100 * tenure_share / 100"
      - result: "next_level if (next_gate > 0 and move_measure >= applied_gate) else held_level_now"
    compute_basis:
      held_level_now: "for a ship-to holding Corbett Parcel Ship-To or Corbett Standard Ship-To, and only for such a ship-to, the move up to the next level is decided on the move-up measure against that next level's entry gate"
      next_level: "The next level is Corbett Standard Ship-To for a ship-to holding Corbett Parcel Ship-To, with entry gate move_gate_standard_usd, and Corbett Priority Ship-To for a ship-to holding Corbett Standard Ship-To, with entry gate move_gate_priority_usd."
      next_gate: "The next level is Corbett Standard Ship-To for a ship-to holding Corbett Parcel Ship-To, with entry gate move_gate_standard_usd, and Corbett Priority Ship-To for a ship-to holding Corbett Standard Ship-To, with entry gate move_gate_priority_usd."
      own_12: "The move-up measure is the twelve-month site spend: the extended_amount of the ship-to's order_line_shipped and order_backorder_filled lines dated within the 12 months before the request date less the credit_amount of its order_return_received lines dated within the same 12 months, a line being within N months when fewer than N whole months separate its date from the request date."
      own_shipped_lines_12: "for a ship-to with no order_line_shipped line within the 12 months, coming back to ordering"
      site_months_open: "divided by its whole months open, counted as at least 1 (a ship-to with no opened_date counting as open 0 months)"
      months_since_last_order: "D being the whole months from its last_order_date to the request date"
      last_active_year_spend: "the measure is the same merchandise less return credits over its last active year, the lines dated at least D and fewer than D + 12 whole months before the request date"
      measure_basis: "The move-up measure follows the ship-to's own ordering: for a ship-to with no order_line_shipped line within the 12 months, coming back to ordering, the measure is the same merchandise less return credits over its last active year, the lines dated at least D and fewer than D + 12 whole months before the request date, D being the whole months from its last_order_date to the request date, multiplied by 12 and divided by D + 12 (a ship-to with no last_order_date having no last active year and a measure of 0.00); for a ship-to with order_line_shipped lines within the 12 months that has been open fewer than young_site_months whole months, the measure is the twelve-month site spend multiplied by 12 and divided by its whole months open, counted as at least 1 (a ship-to with no opened_date counting as open 0 months); for every other ship-to the measure is the twelve-month site spend."
      commitment_now: "where its annual_spend_commitment is at least commit_top_usd"
      gate_share: "The next level's entry gate is applied at a share set by the customer's active Contract Pricing Agreement: at gate_share_top_pct percent where its annual_spend_commitment is at least commit_top_usd, at gate_share_mid_pct percent where it is at least commit_mid_usd and less than commit_top_usd, and in full otherwise."
      site_credit_status: "The next level's entry gate is further applied at a share set by the customer's Commercial Credit Account payment record"
      returned_24: "carries no credit_payment_returned line dated within the 24 months before the request date"
      returned_12: "carries such a line within those 24 months but none within the 12 months before the request date"
      standing_share: "The next level's entry gate is further applied at a share set by the customer's Commercial Credit Account payment record: at standing_gate_share_pct percent where the account is active and carries no credit_payment_returned line dated within the 24 months before the request date, at standing_gate_recent_pct percent where it is active and carries such a line within those 24 months but none within the 12 months before the request date, and in full otherwise."
      terms_tier: "The next level's entry gate is further applied at a share set by the terms tier of the customer's Commercial Credit Account"
      terms_share: "The next level's entry gate is further applied at a share set by the terms tier of the customer's Commercial Credit Account: at terms_gate_long_pct percent for a Corbett Net 60 Corporate Account or a Corbett Net 90 Strategic Account, at terms_gate_mid_pct percent for a Corbett Net 30 Preferred Account or a Corbett Net 45 Business Account, and in full for every other tier or where the customer has no such account."
      credit_opened: "in whole months from the account's opened_date to the request date"
      credit_months_held: "The next level's entry gate is further applied at a share set by how long the customer has held its Commercial Credit Account, in whole months from the account's opened_date to the request date"
      tenure_share: "The next level's entry gate is further applied at a share set by how long the customer has held its Commercial Credit Account, in whole months from the account's opened_date to the request date: at credit_tenure_long_pct percent for at least credit_long_months months, at credit_tenure_mid_pct percent for at least credit_mid_months and fewer than credit_long_months months, and in full for a shorter tenure or where the customer has no such account or its account has no opened_date."
      move_measure: "StockSmart replenishment never counts in the move-up measure, program spend not counting toward a ship-to's service level spend, and VendPoint usage does not count in it either."
      applied_gate: "The next level's entry gate is multiplied by every share that applies to it, the shares together in one product, and the move-up measure is compared with that product."
      result: "A ship-to whose move-up measure is at or above the next level's entry gate moves up to the next level; a ship-to whose measure is below it keeps its level; the measure and the gate are compared to the cent without rounding."
    factors:
      - id: site_ordering_basis
        effect: method
        decides: measure_basis
        bindings: [own_shipped_lines_12, site_months_open, months_since_last_order, last_active_year_spend, measure_basis]
        ladder:
          - when: "the ship-to has no order_line_shipped line within the 12 months (coming back to ordering)"
            method: "the measure is the ship-to's own spend over its last active year (the 12 months up to its last order) spread over the months from the start of that year to the request date: times 12, divided by D + 12"
          - when: "it has order_line_shipped lines within the 12 months AND it has been open fewer than young_site_months whole months"
            method: "the measure is the twelve-month site spend annualized over its whole months open (times 12, divided by the months, at least 1)"
          - when: "otherwise"
            method: "the measure is the twelve-month site spend"
        baseline:
          measure_basis: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: commitment_gate_share
        effect: parameter
        decides: gate_share
        bindings: [commitment_now, gate_share]
        ladder:
          - when: "the active agreement's annual_spend_commitment is at least commit_top_usd"
            value: "K('gate_share_top_pct')"
          - when: "it is at least commit_mid_usd and less than commit_top_usd"
            value: "K('gate_share_mid_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          gate_share: "100"
        evidence: [cross_category]
        cross_difficulty: pricing
      - id: standing_gate_share
        effect: parameter
        decides: standing_share
        bindings: [site_credit_status, returned_24, returned_12, standing_share]
        ladder:
          - when: "the Commercial Credit Account is active AND it carries no credit_payment_returned line within the 24 months"
            value: "K('standing_gate_share_pct')"
          - when: "the account is active AND it carries such a line within the 24 months but none within the 12 months"
            value: "K('standing_gate_recent_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          standing_share: "100"
        evidence: [cross_category, history]
        cross_difficulty: credit
      - id: terms_gate_share
        effect: parameter
        decides: terms_share
        bindings: [terms_tier, terms_share]
        ladder:
          - when: "the credit account is a Corbett Net 60 Corporate Account or a Corbett Net 90 Strategic Account"
            value: "K('terms_gate_long_pct')"
          - when: "it is a Corbett Net 30 Preferred Account or a Corbett Net 45 Business Account"
            value: "K('terms_gate_mid_pct')"
          - when: "otherwise (any other tier, or no account)"
            value: "100"
        baseline:
          terms_share: "100"
        evidence: [cross_category]
        cross_difficulty: credit
      - id: credit_tenure_gate_share
        effect: parameter
        decides: tenure_share
        bindings: [credit_opened, credit_months_held, tenure_share]
        ladder:
          - when: "the credit account has been held at least credit_long_months whole months"
            value: "K('credit_tenure_long_pct')"
          - when: "it has been held at least credit_mid_months and fewer than credit_long_months whole months"
            value: "K('credit_tenure_mid_pct')"
          - when: "otherwise (shorter tenure, no account, or no opened_date)"
            value: "100"
        baseline:
          tenure_share: "100"
        evidence: [cross_category, date]
        cross_difficulty: credit
    baseline:
      rule: >-
        A customer may ask to move a ship-to up; for a ship-to holding Corbett Parcel Ship-To or Corbett Standard Ship-To, and only for such a ship-to, the move up to the next level is decided on the move-up measure against that next level's entry gate, while a ship-to holding Corbett Priority Ship-To or a route level that asks to move up stays under the trailing spend against the higher level's entry gate, a route level also needing a delivery ZIP inside a route territory, and keeps its level under this rule.
        The next level is Corbett Standard Ship-To for a ship-to holding Corbett Parcel Ship-To, with entry gate move_gate_standard_usd, and Corbett Priority Ship-To for a ship-to holding Corbett Standard Ship-To, with entry gate move_gate_priority_usd.
        The move-up measure is the twelve-month site spend: the extended_amount of the ship-to's order_line_shipped and order_backorder_filled lines dated within the 12 months before the request date less the credit_amount of its order_return_received lines dated within the same 12 months, a line being within N months when fewer than N whole months separate its date from the request date.
        Whole months between two dates are the difference in calendar months between them, less one where the day of the month of the later date is smaller than the day of the month of the earlier date.
        A ship-to whose move-up measure is at or above the next level's entry gate moves up to the next level; a ship-to whose measure is below it keeps its level; the measure and the gate are compared to the cent without rounding.
        StockSmart replenishment never counts in the move-up measure, program spend not counting toward a ship-to's service level spend, and VendPoint usage does not count in it either.
      params: [move_gate_standard_usd, move_gate_priority_usd]
    prerequisite:
      - problem: order_ext_reactivation_level
        kind: value_input
        gate: held_level_now
        form: state
        policy_source: >-
          A requested move up is not decided until the ship-to's status is active.
        condition: >-
          The ship-to's status is active.
        resolved_by: reactivate_ship_to_971b9440
        effect: >-
          Once the ship-to is active again the level it holds is the level it was reactivated at, so held_level_now, the next level and the next level's entry gate are read from that level.
    cross_category:
      - category: pricing
        as: branch
        reads: [status, annual_spend_commitment]
        note: The active agreement's annual spend commitment decides one share of the entry gate applied.
      - category: credit
        as: history
        reads: [status, variant_name, opened_date, credit_transactions.event_type, credit_transactions.txn_date]
        note: Returned payments of the last 24 and 12 months, the terms tier and the account's tenure decide three shares of the entry gate.
    inputs:
      history:
        - {table: order_lines, aggregate: sum, field: extended_amount, within_months: 40, filters: {event_type: order_line_shipped}}
        - {table: order_lines, aggregate: count, field: order_line_id, within_months: 12, filters: {event_type: order_line_shipped}}
        - {table: order_returns, aggregate: sum, field: credit_amount, within_months: 12, filters: {event_type: order_return_received}}
        - {category: credit, table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 24, filters: {event_type: credit_payment_returned}}
      cross_category: [pricing, credit]
