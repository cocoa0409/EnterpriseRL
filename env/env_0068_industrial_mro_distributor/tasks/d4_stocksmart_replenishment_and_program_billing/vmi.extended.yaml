      restock_cover: 'The restock cover follows the program''s visits: a program whose tier schedules 20 or more visits a month and that completed 18 or more scheduled or onsite daily visits in the latest month takes a restock cover of 0.5 week; a program whose tier schedules 8 to 19 visits a month and that completed 6 or more such visits in the latest month takes 1 week; any other program takes the standard 2 weeks.'
