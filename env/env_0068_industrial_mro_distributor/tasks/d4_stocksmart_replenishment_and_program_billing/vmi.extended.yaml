    compute:
    - item: XLATEST('vending','vending_planogram','sku', event_type='vending_selection_removed', change_source='customer')
    - removal_date: XLATEST('vending','vending_planogram','event_date', event_type='vending_selection_removed', change_source='customer')
    - removal_machine: XLATEST('vending','vending_planogram','vending_machine_id', event_type='vending_selection_removed', change_source='customer')
    - same_day_removals: XCOUNT('vending','vending_planogram', event_type='vending_selection_removed', change_source='customer', event_date=removal_date)
    - net_1m: XSUM('vending','vending_transactions','quantity', within_months=1, event_type='vending_item_issued', sku=item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=1, event_type='vending_item_returned', sku=item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=1, event_type='vending_vend_error_credited', sku=item, vending_machine_id=removal_machine)
    - net_2m: XSUM('vending','vending_transactions','quantity', within_months=2, event_type='vending_item_issued', sku=item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=2, event_type='vending_item_returned', sku=item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=2, event_type='vending_vend_error_credited', sku=item, vending_machine_id=removal_machine)
    - net_3m: XSUM('vending','vending_transactions','quantity', within_months=3, event_type='vending_item_issued', sku=item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=3, event_type='vending_item_returned', sku=item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=3, event_type='vending_vend_error_credited', sku=item, vending_machine_id=removal_machine)
    - month_latest: net_1m
    - month_middle: net_2m - net_1m
    - month_earliest: net_3m - net_2m
    - weekly_usage: (month_latest + (month_latest - month_earliest) * K('half')) * K('months_per_year') / K('weeks_per_year') if month_latest > K('rising_ratio') * net_3m / K('window_months') else ((K('recent_weight') * month_latest + K('middle_weight') * month_middle + month_earliest) / K('weight_total') * K('months_per_year') / K('weeks_per_year') if month_latest < K('falling_ratio') * net_3m / K('window_months') else net_3m / K('standard_window_weeks'))
    - visits_done: COUNT('vmi_activity', within_months=1, event_type='vmi_service_visit_completed', visit_type='scheduled') + COUNT('vmi_activity', within_months=1, event_type='vmi_service_visit_completed', visit_type='onsite_daily')
    - restock_cover: K('cover_daily_weeks') if P('service_visits_per_month') >= K('daily_visits_min') and visits_done >= K('daily_done_min') else (K('cover_regular_weeks') if P('service_visits_per_month') >= K('regular_visits_min') and P('service_visits_per_month') < K('daily_visits_min') and visits_done >= K('regular_done_min') else K('cover_standard_weeks'))
    - route_days: CPARAM('order','route_deliveries_per_week', ship_to_id=F('ship_to_id')) if CPARAM('order','route_deliveries_per_week', ship_to_id=F('ship_to_id')) != None else K('route_unrecorded_per_week')
    - route_cover: K('route_none_weeks') if route_days == 0 else (K('route_light_weeks') if route_days <= K('route_light_max') else K('route_full_weeks'))
    - emergency_restocks: XCOUNT('vending','vending_transactions', within_months=3, event_type='vending_restocked', visit_type='emergency', sku=item, vending_machine_id=removal_machine)
    - safety_weeks: K('safety_high_weeks') if emergency_restocks >= K('safety_high_min') else (K('safety_low_weeks') if emergency_restocks == 1 else K('safety_none_weeks'))
    - net_12m: XSUM('vending','vending_transactions','quantity', within_months=12, event_type='vending_item_issued', sku=item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=12, event_type='vending_item_returned', sku=item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=12, event_type='vending_vend_error_credited', sku=item, vending_machine_id=removal_machine)
    - vend_price_date: XLATEST('vending','vending_transactions','event_date', event_type='vending_item_issued', sku=item, vending_machine_id=removal_machine)
    - vend_price: XMAX('vending','vending_transactions','unit_price', event_type='vending_item_issued', sku=item, vending_machine_id=removal_machine, event_date=vend_price_date) if vend_price_date != None else None
    - annual_value: net_12m * vend_price if vend_price != None else 0
    - abc_share: K('abc_a_share') if annual_value >= K('abc_a_min_usd') else (K('abc_b_share') if annual_value >= K('abc_b_min_usd') else K('abc_c_share'))
    - returned_payments: XCOUNT('credit','credit_transactions', within_months=12, date_field='txn_date', event_type='credit_payment_returned')
    - exposure_share: K('exposure_two_share') if returned_payments >= K('exposure_two_min') else (K('exposure_one_share') if returned_payments == 1 else K('exposure_none_share'))
    - cover_weeks: restock_cover + route_cover + safety_weeks
    - carried_share: abc_share * exposure_share
    - raw_level: weekly_usage * cover_weeks * carried_share
    - result: MX(0, int(-(-RND(raw_level, 6) // 1))) if same_day_removals == 1 and P('consignment_available') == True else 0
    compute_basis:
      item: The transferred item is the item of the customer's most recent VendPoint selection removal made at the customer's request, and the demand machine is the machine it was removed from; where two or more such removals carry that most recent effective date, or the customer has none, no fill-to level is set under this schedule.
