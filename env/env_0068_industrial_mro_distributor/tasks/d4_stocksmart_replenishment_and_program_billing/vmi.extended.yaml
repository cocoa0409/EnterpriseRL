  - id: vmi_ext_conversion_reorder_point
    base_policy_refs:
    - vmi_bins_and_par
    - vmi_evt_consignment
    overwrite: []
    trigger: state_due
    subject:
    - vmi_bin_set
    computes: min_qty
    target_tool: record_customer_owned_conversion_b1c25ecb
    params:
      days_per_year: 365
      month_days: 30
      no_visit_gap_days: 7
      open_bo_days: 2
      closed_bo_days: 1
      no_bo_days: 0
      route_none_days: 2
      route_light_days: 1
      route_full_days: 0
      route_light_max: 2
      hold_serious_days: 1
      hold_other_days: 0.5
      hold_none_days: 0
      spiky_ratio: 1.5
      uneven_ratio: 1.2
      half: 0.5
      value_a_usd: 30000.0
      value_b_usd: 10000.0
      value_a_share: 0.8
      value_b_share: 0.9
      value_c_share: 1.0
      no_safety_units: 0
      route_unrecorded_per_week: 7
    rule: 'When a slow-moving consigned item has been withdrawn from its bin at a par review, Corbett records the bin''s conversion entry under this schedule: a par level entry that shows the bin no longer consigned, keeps its item, its flags and its fill-to level, and sets its customer-owned reorder point. Corbett''s conversion entry for such a bin is recorded only after the bin''s entries of their latest date include the customer''s written request, a par level entry that names no reorder point and sets the customer-owned fill-to level. The converted item is the item of the program''s most recent consignment withdrawal; where two or more consignment withdrawals carry that most recent date, or there is none, no conversion reorder point is set under this schedule. A consignment withdrawal counts as a par-review conversion only where the converted item''s bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program,
      no conversion reorder point is set under this schedule. A row''s age in whole months is the number of calendar months from its date to today, less one when today''s day of the month is earlier than the row''s day of the month, and a window of the last three or the last twelve months holds rows of age below three or below twelve. As standard, the daily draw of the converted item is its consumption billed over the last twelve months divided by 365, and the standard days are the visit gap, 30 days divided by the visits the program''s tier schedules a month (7 days for a tier scheduling none), plus the tier''s replenishment lead business days counted as days. As standard, no further lead days are added, no safety units are added and the value share is the whole, 1. The conversion reorder point is worked out in this order: the daily draw is multiplied by the lead time in days, which is the standard days plus every further lead day added; the safety units are added to that product; and the
      sum is multiplied by the value share, taken to six decimal places and rounded up to the next whole unit. The converted item''s safety units follow the spread of its billed months: where its largest single billing month of consumption on record is 1.5 times its average billed month or more (its consumption of the last twelve months divided by the number of those months that billed it), the safety units are the difference between the largest month and the average billed month, multiplied by the standard days and then divided by 30; where the largest month is 1.2 times the average billed month or more but less than 1.5 times, the safety units are half of the product of the daily draw and the standard days; an item with steadier months, or with no consumption billed in the last twelve months, takes no safety units. Backorders of the converted item opened at the program''s ship-to in the last three months add further lead days: where more were opened than were filled or cancelled in those
      months, 2 days; where some were opened and as many or more were filled or cancelled in those months, 1 day; where none was opened, none. The route truck deliveries the service level of the program''s ship-to schedules each week add further lead days to the conversion reorder point: no route deliveries add 2 days, 1 or 2 a week add 1 day, and 3 or more add none; a ship-to whose service level is not on record adds none. A bin whose entries of their latest date include one flagging it critical while the customer''s Commercial Credit Account is on hold adds further lead days: 1 day where the hold reason is over limit or returned payments, 0.5 day for any other hold reason; a bin not so flagged, or an account not on hold, adds none. The converted item''s annual value, its consumption billed over the last twelve months times the contract unit price on its latest price line in the customer''s agreement (zero where it has none, or where two price lines share its latest effective date), sets
      the value share: 30,000.00 USD or more puts 0.8, 10,000.00 USD or more but below 30,000.00 USD puts 0.9, and less puts 1.'
    prerequisite:
    - problem: vmi_ext_converted_critical_fill
      kind: value_input
      gate: request_entries
      form: state
      policy_source: Corbett's conversion entry for such a bin is recorded only after the bin's entries of their latest date include the customer's written request, a par level entry that names no reorder point and sets the customer-owned fill-to level.
      condition: the converted item's bin carries, on the latest date of its entries, a vmi_bin_set par_change entry with min_qty 0 (the customer's own request, whether written before or after the conversion entry) carrying the customer-owned max_qty
      resolved_by: submit_critical_bin_request_f65e9169
      effect: the bin's latest-date entries then include the customer's request, so the conversion reorder point is set at all, and its critical flag adds the hold lead days under a credit hold
    cross_category:
    - category: order
      as: history
      reads:
      - order_lines.event_type
      - route_deliveries_per_week
      note: backorder_lead and delivery_lead read the ship-to order history and route service
    - category: credit
      as: branch
      reads:
      - status
      - hold_reason
      note: hold_lead reads the credit hold status and reason
    - category: pricing
      as: branch
      reads:
      - pricing_items.contract_unit_price
      note: value_class reads the contract unit price of the item latest price line
    compute:
    - conv_item: LATEST('vmi_activity','sku', event_type='vmi_consignment_withdrawn')
    - conv_date: LATEST('vmi_activity','event_date', event_type='vmi_consignment_withdrawn')
    - same_day_withdrawals: COUNT('vmi_activity', event_type='vmi_consignment_withdrawn', event_date=conv_date)
    - removal_entries: COUNT('vmi_bins', event_type='vmi_bin_removed', sku=conv_item)
    - conversion_withdrawal: same_day_withdrawals == 1 and removal_entries == 0 and F('status') != 'closed'
    - consumed_12m: SUM('vmi_activity','quantity', within_months=12, event_type='vmi_consignment_consumed', sku=conv_item)
    - consumed_months: COUNT('vmi_activity', within_months=12, event_type='vmi_consignment_consumed', sku=conv_item)
    - daily_draw: consumed_12m / K('days_per_year')
    - gap_days: K('month_days') / P('service_visits_per_month') if P('service_visits_per_month') > 0 else K('no_visit_gap_days')
    - lead_days: P('replenishment_lead_business_days')
    - standard_days: gap_days + lead_days
    - backorders: XCOUNT('order','order_lines', within_months=3, event_type='order_line_backordered', sku=conv_item, ship_to_id=F('ship_to_id'))
    - backorders_closed: XCOUNT('order','order_lines', within_months=3, event_type='order_backorder_filled', sku=conv_item, ship_to_id=F('ship_to_id')) + XCOUNT('order','order_lines', within_months=3, event_type='order_backorder_cancelled', sku=conv_item, ship_to_id=F('ship_to_id'))
    - backorder_days: K('open_bo_days') if backorders > backorders_closed else (K('closed_bo_days') if backorders > 0 else K('no_bo_days'))
    - route_deliveries: CPARAM('order','route_deliveries_per_week', ship_to_id=F('ship_to_id')) if CPARAM('order','route_deliveries_per_week', ship_to_id=F('ship_to_id')) != None else K('route_unrecorded_per_week')
    - route_days: K('route_none_days') if route_deliveries == 0 else (K('route_light_days') if route_deliveries <= K('route_light_max') else K('route_full_days'))
    - entry_date: LATEST('vmi_bins','event_date', event_type='vmi_bin_set', sku=conv_item)
    - critical_entries: COUNT('vmi_bins', event_type='vmi_bin_set', sku=conv_item, critical_item=True, event_date=entry_date)
    - request_entries: COUNT('vmi_bins', event_type='vmi_bin_set', change_type='par_change', sku=conv_item, min_qty=0, event_date=entry_date)
    - credit_status: CFIELD('credit','status')
    - hold_reason: CFIELD('credit','hold_reason')
    - hold_days: K('hold_serious_days') if critical_entries > 0 and credit_status == 'on_hold' and (hold_reason == 'over_limit' or hold_reason == 'returned_payments') else (K('hold_other_days') if critical_entries > 0 and credit_status == 'on_hold' else K('hold_none_days'))
    - reorder_days: standard_days + backorder_days + route_days + hold_days
    - lead_demand: daily_draw * reorder_days
    - largest_month: MAX('vmi_activity','quantity', event_type='vmi_consignment_consumed', sku=conv_item) if COUNT('vmi_activity', event_type='vmi_consignment_consumed', sku=conv_item) > 0 else 0
    - average_billed_month: consumed_12m / consumed_months if consumed_months > 0 else 0
    - safety_units: (largest_month - average_billed_month) * standard_days / K('month_days') if average_billed_month > 0 and largest_month >= K('spiky_ratio') * average_billed_month else (daily_draw * standard_days * K('half') if average_billed_month > 0 and largest_month >= K('uneven_ratio') * average_billed_month else K('no_safety_units'))
    - price_date: XLATEST('pricing','pricing_items','effective_date', date_field='effective_date', sku=conv_item)
    - lines_on_price_date: XCOUNT('pricing','pricing_items', sku=conv_item, effective_date=price_date)
    - contract_price: XLATEST('pricing','pricing_items','contract_unit_price', date_field='effective_date', sku=conv_item) if lines_on_price_date == 1 else None
    - annual_value: consumed_12m * contract_price if contract_price != None else 0
    - value_share: K('value_a_share') if annual_value >= K('value_a_usd') else (K('value_b_share') if annual_value >= K('value_b_usd') else K('value_c_share'))
    - raw_reorder: (lead_demand + safety_units) * value_share
    - result: int(-(-RND(raw_reorder, 6) // 1)) if conversion_withdrawal and request_entries > 0 else 0
    compute_basis:
      removal_entries: A consignment withdrawal counts as a par-review conversion only where the converted item's bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program, no conversion reorder point is set under this schedule.
      conversion_withdrawal: A consignment withdrawal counts as a par-review conversion only where the converted item's bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program, no conversion reorder point is set under this schedule.
      conv_item: The converted item is the item of the program's most recent consignment withdrawal; where two or more consignment withdrawals carry that most recent date, or there is none, no conversion reorder point is set under this schedule.
      conv_date: The converted item is the item of the program's most recent consignment withdrawal; where two or more consignment withdrawals carry that most recent date, or there is none, no conversion reorder point is set under this schedule.
      same_day_withdrawals: The converted item is the item of the program's most recent consignment withdrawal; where two or more consignment withdrawals carry that most recent date, or there is none, no conversion reorder point is set under this schedule.
      consumed_12m: As standard, the daily draw of the converted item is its consumption billed over the last twelve months divided by 365, and the standard days are the visit gap, 30 days divided by the visits the program's tier schedules a month (7 days for a tier scheduling none), plus the tier's replenishment lead business days counted as days.
      consumed_months: 'The converted item''s safety units follow the spread of its billed months: where its largest single billing month of consumption on record is 1.5 times its average billed month or more (its consumption of the last twelve months divided by the number of those months that billed it), the safety units are the difference between the largest month and the average billed month, multiplied by the standard days and then divided by 30; where the largest month is 1.2 times the average billed month or more but less than 1.5 times, the safety units are half of the product of the daily draw and the standard days; an item with steadier months, or with no consumption billed in the last twelve months, takes no safety units.'
      daily_draw: As standard, the daily draw of the converted item is its consumption billed over the last twelve months divided by 365, and the standard days are the visit gap, 30 days divided by the visits the program's tier schedules a month (7 days for a tier scheduling none), plus the tier's replenishment lead business days counted as days.
      gap_days: As standard, the daily draw of the converted item is its consumption billed over the last twelve months divided by 365, and the standard days are the visit gap, 30 days divided by the visits the program's tier schedules a month (7 days for a tier scheduling none), plus the tier's replenishment lead business days counted as days.
      lead_days: As standard, the daily draw of the converted item is its consumption billed over the last twelve months divided by 365, and the standard days are the visit gap, 30 days divided by the visits the program's tier schedules a month (7 days for a tier scheduling none), plus the tier's replenishment lead business days counted as days.
      standard_days: As standard, the daily draw of the converted item is its consumption billed over the last twelve months divided by 365, and the standard days are the visit gap, 30 days divided by the visits the program's tier schedules a month (7 days for a tier scheduling none), plus the tier's replenishment lead business days counted as days.
      backorders: 'Backorders of the converted item opened at the program''s ship-to in the last three months add further lead days: where more were opened than were filled or cancelled in those months, 2 days; where some were opened and as many or more were filled or cancelled in those months, 1 day; where none was opened, none.'
      backorders_closed: 'Backorders of the converted item opened at the program''s ship-to in the last three months add further lead days: where more were opened than were filled or cancelled in those months, 2 days; where some were opened and as many or more were filled or cancelled in those months, 1 day; where none was opened, none.'
      backorder_days: 'Backorders of the converted item opened at the program''s ship-to in the last three months add further lead days: where more were opened than were filled or cancelled in those months, 2 days; where some were opened and as many or more were filled or cancelled in those months, 1 day; where none was opened, none.'
      route_deliveries: 'The route truck deliveries the service level of the program''s ship-to schedules each week add further lead days to the conversion reorder point: no route deliveries add 2 days, 1 or 2 a week add 1 day, and 3 or more add none; a ship-to whose service level is not on record adds none.'
      route_days: 'The route truck deliveries the service level of the program''s ship-to schedules each week add further lead days to the conversion reorder point: no route deliveries add 2 days, 1 or 2 a week add 1 day, and 3 or more add none; a ship-to whose service level is not on record adds none.'
      entry_date: Corbett's conversion entry for such a bin is recorded only after the bin's entries of their latest date include the customer's written request, a par level entry that names no reorder point and sets the customer-owned fill-to level.
      request_entries: Corbett's conversion entry for such a bin is recorded only after the bin's entries of their latest date include the customer's written request, a par level entry that names no reorder point and sets the customer-owned fill-to level.
      critical_entries: 'A bin whose entries of their latest date include one flagging it critical while the customer''s Commercial Credit Account is on hold adds further lead days: 1 day where the hold reason is over limit or returned payments, 0.5 day for any other hold reason; a bin not so flagged, or an account not on hold, adds none.'
      credit_status: 'A bin whose entries of their latest date include one flagging it critical while the customer''s Commercial Credit Account is on hold adds further lead days: 1 day where the hold reason is over limit or returned payments, 0.5 day for any other hold reason; a bin not so flagged, or an account not on hold, adds none.'
      hold_reason: 'A bin whose entries of their latest date include one flagging it critical while the customer''s Commercial Credit Account is on hold adds further lead days: 1 day where the hold reason is over limit or returned payments, 0.5 day for any other hold reason; a bin not so flagged, or an account not on hold, adds none.'
      hold_days: 'A bin whose entries of their latest date include one flagging it critical while the customer''s Commercial Credit Account is on hold adds further lead days: 1 day where the hold reason is over limit or returned payments, 0.5 day for any other hold reason; a bin not so flagged, or an account not on hold, adds none.'
      reorder_days: 'The conversion reorder point is worked out in this order: the daily draw is multiplied by the lead time in days, which is the standard days plus every further lead day added; the safety units are added to that product; and the sum is multiplied by the value share, taken to six decimal places and rounded up to the next whole unit.'
      lead_demand: 'The conversion reorder point is worked out in this order: the daily draw is multiplied by the lead time in days, which is the standard days plus every further lead day added; the safety units are added to that product; and the sum is multiplied by the value share, taken to six decimal places and rounded up to the next whole unit.'
      largest_month: 'The converted item''s safety units follow the spread of its billed months: where its largest single billing month of consumption on record is 1.5 times its average billed month or more (its consumption of the last twelve months divided by the number of those months that billed it), the safety units are the difference between the largest month and the average billed month, multiplied by the standard days and then divided by 30; where the largest month is 1.2 times the average billed month or more but less than 1.5 times, the safety units are half of the product of the daily draw and the standard days; an item with steadier months, or with no consumption billed in the last twelve months, takes no safety units.'
      average_billed_month: 'The converted item''s safety units follow the spread of its billed months: where its largest single billing month of consumption on record is 1.5 times its average billed month or more (its consumption of the last twelve months divided by the number of those months that billed it), the safety units are the difference between the largest month and the average billed month, multiplied by the standard days and then divided by 30; where the largest month is 1.2 times the average billed month or more but less than 1.5 times, the safety units are half of the product of the daily draw and the standard days; an item with steadier months, or with no consumption billed in the last twelve months, takes no safety units.'
      safety_units: 'The converted item''s safety units follow the spread of its billed months: where its largest single billing month of consumption on record is 1.5 times its average billed month or more (its consumption of the last twelve months divided by the number of those months that billed it), the safety units are the difference between the largest month and the average billed month, multiplied by the standard days and then divided by 30; where the largest month is 1.2 times the average billed month or more but less than 1.5 times, the safety units are half of the product of the daily draw and the standard days; an item with steadier months, or with no consumption billed in the last twelve months, takes no safety units.'
      price_date: 'The converted item''s annual value, its consumption billed over the last twelve months times the contract unit price on its latest price line in the customer''s agreement (zero where it has none, or where two price lines share its latest effective date), sets the value share: 30,000.00 USD or more puts 0.8, 10,000.00 USD or more but below 30,000.00 USD puts 0.9, and less puts 1.'
      lines_on_price_date: 'The converted item''s annual value, its consumption billed over the last twelve months times the contract unit price on its latest price line in the customer''s agreement (zero where it has none, or where two price lines share its latest effective date), sets the value share: 30,000.00 USD or more puts 0.8, 10,000.00 USD or more but below 30,000.00 USD puts 0.9, and less puts 1.'
      contract_price: 'The converted item''s annual value, its consumption billed over the last twelve months times the contract unit price on its latest price line in the customer''s agreement (zero where it has none, or where two price lines share its latest effective date), sets the value share: 30,000.00 USD or more puts 0.8, 10,000.00 USD or more but below 30,000.00 USD puts 0.9, and less puts 1.'
      annual_value: 'The converted item''s annual value, its consumption billed over the last twelve months times the contract unit price on its latest price line in the customer''s agreement (zero where it has none, or where two price lines share its latest effective date), sets the value share: 30,000.00 USD or more puts 0.8, 10,000.00 USD or more but below 30,000.00 USD puts 0.9, and less puts 1.'
      value_share: 'The converted item''s annual value, its consumption billed over the last twelve months times the contract unit price on its latest price line in the customer''s agreement (zero where it has none, or where two price lines share its latest effective date), sets the value share: 30,000.00 USD or more puts 0.8, 10,000.00 USD or more but below 30,000.00 USD puts 0.9, and less puts 1.'
      raw_reorder: 'The conversion reorder point is worked out in this order: the daily draw is multiplied by the lead time in days, which is the standard days plus every further lead day added; the safety units are added to that product; and the sum is multiplied by the value share, taken to six decimal places and rounded up to the next whole unit.'
      result: 'The conversion reorder point is worked out in this order: the daily draw is multiplied by the lead time in days, which is the standard days plus every further lead day added; the safety units are added to that product; and the sum is multiplied by the value share, taken to six decimal places and rounded up to the next whole unit.'
    factors:
    - id: safety_basis
      effect: method
      decides: safety_units
      bindings:
      - consumed_months
      - largest_month
      - average_billed_month
      - safety_units
      ladder:
      - when: largest billing month on record 1.5 times the average billed month or more
        method: safety units = (largest month - average billed month) x standard days / 30, spread-based
      - when: 1.2 to below 1.5 times
        method: safety units = half of daily draw x standard days, proportional
      - when: otherwise (steadier, or nothing billed in twelve months)
        method: no safety units
      baseline:
        safety_units: K('no_safety_units')
      evidence:
      - history
      cross_difficulty: null
    - id: backorder_lead
      effect: parameter
      decides: backorder_days
      bindings:
      - backorders
      - backorders_closed
      - backorder_days
      ladder:
      - when: more backorders of the item opened at the ship-to in the last three months than filled or cancelled
        value: K('open_bo_days') = 2 days
      - when: some opened and as many or more filled or cancelled
        value: K('closed_bo_days') = 1 day
      - when: otherwise (none opened)
        value: K('no_bo_days') = none
      baseline:
        backorder_days: K('no_bo_days')
      evidence:
      - cross_category
      - history
      cross_difficulty: order
    - id: delivery_lead
      effect: parameter
      decides: route_days
      bindings:
      - route_deliveries
      - route_days
      ladder:
      - when: ship-to service level schedules no route deliveries
        value: K('route_none_days') = 2 days
      - when: 1 or 2 route deliveries a week
        value: K('route_light_days') = 1 day
      - when: otherwise (3 or more)
        value: K('route_full_days') = none
      baseline:
        route_days: K('route_full_days')
      evidence:
      - cross_category
      - tier_param
      cross_difficulty: order
    - id: hold_lead
      effect: parameter
      decides: hold_days
      bindings:
      - critical_entries
      - credit_status
      - hold_reason
      - hold_days
      ladder:
      - when: bin flagged critical on its latest-date entries and the account on hold for over limit or returned payments
        value: K('hold_serious_days') = 1 day
      - when: bin so flagged and the account on hold for any other reason
        value: K('hold_other_days') = 0.5 day
      - when: otherwise (not critical, or account not on hold)
        value: K('hold_none_days') = none
      baseline:
        hold_days: K('hold_none_days')
      evidence:
      - cross_category
      - history
      cross_difficulty: credit
    - id: value_class
      effect: parameter
      decides: value_share
      bindings:
      - price_date
      - lines_on_price_date
      - contract_price
      - annual_value
      - value_share
      ladder:
      - when: annual value 30,000.00 USD or more
        value: K('value_a_share') = 0.8
      - when: 10,000.00 to below 30,000.00 USD
        value: K('value_b_share') = 0.9
      - when: otherwise (below 10,000.00 USD)
        value: K('value_c_share') = 1
      baseline:
        value_share: K('value_c_share')
      evidence:
      - cross_category
      - history
      cross_difficulty: pricing
    baseline:
      rule: 'As standard, the daily draw of the converted item is its consumption billed over the last twelve months divided by 365, and the standard days are the visit gap, 30 days divided by the visits the program''s tier schedules a month (7 days for a tier scheduling none), plus the tier''s replenishment lead business days counted as days. As standard, no further lead days are added, no safety units are added and the value share is the whole, 1. The conversion reorder point is worked out in this order: the daily draw is multiplied by the lead time in days, which is the standard days plus every further lead day added; the safety units are added to that product; and the sum is multiplied by the value share, taken to six decimal places and rounded up to the next whole unit.'
      params:
      - days_per_year
      - month_days
      - no_visit_gap_days
      - no_bo_days
      - route_full_days
      - hold_none_days
      - no_safety_units
      - value_c_share
    inputs:
      history:
      - table: vmi_activity
        aggregate: sum
        field: quantity
        within_months: 12
        filters:
          event_type: vmi_consignment_consumed
      - category: order
        table: order_lines
        aggregate: count
        field: order_line_id
        within_months: 3
        filters:
          event_type: order_line_backordered
      cross_category:
      - order
      - credit
      - pricing
  - id: vmi_ext_hold_converted_fill
    base_policy_refs:
    - vmi_evt_replenishment
    - vmi_evt_consignment
    overwrite:
    - base_policy: vmi_evt_replenishment
      superseded_clause: and only up to critical_item_replenishment_cap_usd per visit (bins are filled in bin label order until the next bin would exceed the cap)
      replaced_by: While the customer's Commercial Credit Account is on hold, the first customer-owned fill of a converted critical bin, and only that fill, is measured against the visit allowance below instead of the tier's critical item replenishment cap, and it is not passed over when its whole fill would exceed what is left; every other replenishment during a hold stays capped at the tier's critical item replenishment cap per visit, with bins filled in bin label order until the next bin would exceed the cap.
    - base_policy: vmi_evt_replenishment
      superseded_clause: Every bin at or below its min level at a visit or self-scan is filled to its max level under auto_replenish_to
      replaced_by: That fill takes the bin from empty toward its fill-to level only as far as the visit allowance below reaches, so it may stop short of the fill-to level; every other bin at or below its min level at a visit or self-scan is still filled to its max level.
    trigger: on_request
    subject:
    - vmi_replenishment_delivered
    computes: quantity
    target_tool: book_converted_bin_fill_19b3cec5
    params:
      returned_share: 0.5
      over_limit_share: 0.75
      standard_share: 1.0
      same_day_release: 0.5
      recent_release: 0.25
      no_release: 0.0
      recent_release_days: 30
      payment_high_usd: 50000.0
      payment_low_usd: 10000.0
      payment_high_rate: 0.01
      payment_low_rate: 0.005
      payment_none_rate: 0.0
      open_ended_months: 1200
    rule: 'While the customer''s Commercial Credit Account is on hold, the first customer-owned fill of a bin converted from consignment at a par review is booked under this schedule as one replenishment line at the program''s latest service visit, filled from empty, on a program whose status is active or terminating, whose tier''s credit hold service rule is critical items only, and whose bin entries of their latest date include one flagging it critical; any other bin, and any bin while the account is active, is outside this schedule. While the customer''s Commercial Credit Account is on hold, the first customer-owned fill of a converted critical bin, and only that fill, is measured against the visit allowance below instead of the tier''s critical item replenishment cap, and it is not passed over when its whole fill would exceed what is left; every other replenishment during a hold stays capped at the tier''s critical item replenishment cap per visit, with bins filled in bin label order until
      the next bin would exceed the cap. That fill takes the bin from empty toward its fill-to level only as far as the visit allowance below reaches, so it may stop short of the fill-to level; every other bin at or below its min level at a visit or self-scan is still filled to its max level. That fill is not booked until the bin''s entries of their latest date include the customer''s written request for it, a par level entry that names no reorder point and sets the customer-owned fill-to level. That fill is booked only after the bin''s entries of their latest date include one showing it no longer consigned. The converted item is the item of the program''s most recent consignment withdrawal, and the bin''s fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked
      under this schedule. A consignment withdrawal counts as a par-review conversion only where the converted item''s bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program, no fill is booked under this schedule. The fill is the bin''s first customer-owned fill only while no replenishment line of the converted item has been booked on the program; once one has, the bin is outside this schedule. The item''s latest price line is its price line in the customer''s agreement with the latest effective date, and its kind is that line''s event: an addition, a repricing or a removal. A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer''s agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts
      the item''s category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order. As standard, the fill price is the list price on the item''s latest price line less the list discount of the customer''s pricing agreement, rounded half up to 4 decimal places, the allowance share is the whole, 1, and no release is added. The allowance left is worked out in this order: the tier''s critical item replenishment cap is multiplied by the allowance share, every release added is added to that product, and the value of critical replenishment already delivered at the same visit is subtracted; the fill is the lesser of the bin''s fill-to level and the whole units the allowance left buys at the fill price, taken to six decimal places and rounded down, never below zero. Where the item''s latest price line is the addition of a Corbett-approved substitute for a discontinued item and fewer days have passed since its effective date than the agreement''s discontinued
      item price protection days, the fill price is the line''s prior unit price, the discontinued item''s contract price; where the latest line is any other line that is not a removal, the fill price is its contract unit price; an item whose latest line is a removal takes the standard fill price. The hold reason on the customer''s Commercial Credit Account sets the allowance share: 0.5 for a hold for returned payments, 0.75 for a hold for over limit, and the standard whole, 1, for any other reason. Consigned stock of the converted item withdrawn the same day adds a release of half its withdrawn value, a withdrawal 1 to 30 days before today adds a quarter of that value, and an older withdrawal adds none. Payments the customer''s Commercial Credit Account received in the latest month (rows of age zero, a row''s age in whole months being the calendar months from its date to today, less one when today''s day of the month is earlier than its day) add a release of 1 percent of their total where
      that total is 50,000.00 USD or more, 0.5 percent where it is 10,000.00 USD or more but below 50,000.00 USD, and none below that.'
    prerequisite:
    - problem: vmi_ext_converted_critical_fill
      kind: state_gate
      gate: vmi_bins.min_qty
      form: state
      policy_source: That fill is not booked until the bin's entries of their latest date include the customer's written request for it, a par level entry that names no reorder point and sets the customer-owned fill-to level.
      condition: the converted bin carries, on the latest date of its entries, the customer's vmi_bin_set par_change request entry (min_qty 0, written before or after the conversion entry) with its customer-owned max_qty
      resolved_by: submit_critical_bin_request_f65e9169
      effect: the bin's latest-date entries then include the customer's own request with its fill-to level and critical flag, so the fill can be booked under the visit allowance
    - problem: vmi_ext_conversion_reorder_point
      kind: state_gate
      gate: vmi_bins.consigned
      form: state
      policy_source: That fill is booked only after the bin's entries of their latest date include one showing it no longer consigned.
      condition: the converted bin carries a vmi_bin_set par_change entry with consigned = false
      resolved_by: record_customer_owned_conversion_b1c25ecb
      effect: the bin stands as customer-owned, so a customer-owned replenishment line may be booked for it
    cross_category:
    - category: credit
      as: history
      reads:
      - status
      - hold_reason
      - credit_transactions.amount
      note: hold_share reads the hold reason, payment_release the payments of the latest month
    - category: pricing
      as: branch
      reads:
      - pricing_items.contract_unit_price
      - pricing_items.prior_unit_price
      - pricing_items.event_type
      - list_discount_pct
      - discontinued_item_price_protection_days
      note: fill_price_basis reads the item price line and the agreement tier
    - category: order
      as: existence
      reads:
      - order_lines.stock_status
      note: special-order scope guard
    compute:
    - conv_item: LATEST('vmi_activity','sku', event_type='vmi_consignment_withdrawn')
    - conv_date: LATEST('vmi_activity','event_date', event_type='vmi_consignment_withdrawn')
    - same_day_withdrawals: COUNT('vmi_activity', event_type='vmi_consignment_withdrawn', event_date=conv_date)
    - removal_entries: COUNT('vmi_bins', event_type='vmi_bin_removed', sku=conv_item)
    - conversion_withdrawal: same_day_withdrawals == 1 and removal_entries == 0 and F('status') != 'closed'
    - entry_date: LATEST('vmi_bins','event_date', event_type='vmi_bin_set', sku=conv_item)
    - fill_to: MAX('vmi_bins','max_qty', event_type='vmi_bin_set', sku=conv_item, event_date=entry_date) if COUNT('vmi_bins', event_type='vmi_bin_set', sku=conv_item, event_date=entry_date) > 0 else 0
    - critical_entries: COUNT('vmi_bins', event_type='vmi_bin_set', sku=conv_item, critical_item=True, event_date=entry_date)
    - request_entries: COUNT('vmi_bins', event_type='vmi_bin_set', change_type='par_change', sku=conv_item, min_qty=0, event_date=entry_date)
    - credit_status: CFIELD('credit','status')
    - credit_reason: CFIELD('credit','hold_reason')
    - hold_in_scope: (F('status') == 'active' or F('status') == 'terminating') and credit_status == 'on_hold' and P('credit_hold_service_rule') == 'critical_items_only' and critical_entries > 0
    - price_lines: XCOUNT('pricing','pricing_items', sku=conv_item)
    - price_lines_in_effect: XCOUNT('pricing','pricing_items', within_months=K('open_ended_months'), date_field='effective_date', sku=conv_item)
    - latest_effective: XLATEST('pricing','pricing_items','effective_date', date_field='effective_date', sku=conv_item)
    - lines_on_latest: XCOUNT('pricing','pricing_items', sku=conv_item, effective_date=latest_effective)
    - line_kind: XLATEST('pricing','pricing_items','event_type', date_field='effective_date', sku=conv_item)
    - line_reason: XLATEST('pricing','pricing_items','change_reason', date_field='effective_date', sku=conv_item)
    - line_category: XLATEST('pricing','pricing_items','product_category', date_field='effective_date', sku=conv_item)
    - contract_price: XLATEST('pricing','pricing_items','contract_unit_price', date_field='effective_date', sku=conv_item) if price_lines > 0 else 0
    - prior_price: XLATEST('pricing','pricing_items','prior_unit_price', date_field='effective_date', sku=conv_item) if price_lines > 0 else 0
    - list_price: XLATEST('pricing','pricing_items','list_price', date_field='effective_date', sku=conv_item) if price_lines > 0 else 0
    - list_discount: CPARAM('pricing','list_discount_pct') if CPARAM('pricing','list_discount_pct') != None else 0
    - protection_days: CPARAM('pricing','discontinued_item_price_protection_days') if CPARAM('pricing','discontinued_item_price_protection_days') != None else 0
    - line_age_days: DAYS(latest_effective, NOW) if latest_effective != None else 0
    - category_listed: line_category in CPARAM('pricing','category_discount_schedule') if price_lines > 0 and CPARAM('pricing','category_discount_schedule') != None else False
    - special_order_lines: XCOUNT('order','order_lines', event_type='order_line_booked', stock_status='non_stock_special_order', sku=conv_item, ship_to_id=F('ship_to_id'))
    - fill_price: prior_price if line_kind == 'pricing_item_added' and line_reason == 'discontinued_substitute' and line_age_days < protection_days else (contract_price if line_kind != 'pricing_item_removed' else RND(list_price * (1 - list_discount / 100), 4))
    - priced_in_scope: CPARAM('pricing','list_discount_pct') != None and price_lines > 0 and price_lines == price_lines_in_effect and lines_on_latest == 1 and (line_kind != 'pricing_item_removed' or (not category_listed and special_order_lines == 0 and CPARAM('pricing','quantity_breaks_honored') != True and CPARAM('pricing','cost_plus_markup_pct') == 0))
    - hold_share: K('returned_share') if credit_reason == 'returned_payments' else (K('over_limit_share') if credit_reason == 'over_limit' else K('standard_share'))
    - withdrawn_value: LATEST('vmi_activity','extended_amount', event_type='vmi_consignment_withdrawn', sku=conv_item) if conv_date != None else 0
    - withdrawn_days: DAYS(conv_date, NOW) if conv_date != None else K('open_ended_months')
    - release_value: withdrawn_value * K('same_day_release') if withdrawn_days == 0 else (withdrawn_value * K('recent_release') if withdrawn_days <= K('recent_release_days') else K('no_release'))
    - payments_month: XSUM('credit','credit_transactions','amount', within_months=1, date_field='txn_date', event_type='credit_payment_received')
    - payment_rate: K('payment_high_rate') if payments_month >= K('payment_high_usd') else (K('payment_low_rate') if payments_month >= K('payment_low_usd') else K('payment_none_rate'))
    - payment_release: payments_month * payment_rate
    - visit_ref: LATEST('vmi_activity','activity_reference', event_type='vmi_service_visit_completed')
    - visit_date: LATEST('vmi_activity','event_date', event_type='vmi_service_visit_completed')
    - visits_that_day: COUNT('vmi_activity', event_type='vmi_service_visit_completed', event_date=visit_date)
    - delivered_critical: SUM('vmi_activity','extended_amount', event_type='vmi_replenishment_delivered', activity_reference=visit_ref, critical_item=True)
    - allowance_left: P('critical_item_replenishment_cap_usd') * hold_share + release_value + payment_release - delivered_critical
    - fill_units: MN(fill_to, MX(0, int(RND(allowance_left / fill_price, 6) // 1))) if fill_price and fill_to else 0
    - customer_owned_entries: COUNT('vmi_bins', event_type='vmi_bin_set', sku=conv_item, consigned=False, event_date=entry_date)
    - earlier_fills: COUNT('vmi_activity', event_type='vmi_replenishment_delivered', sku=conv_item)
    - result: fill_units if conversion_withdrawal and hold_in_scope and priced_in_scope and visits_that_day == 1 and customer_owned_entries > 0 and request_entries > 0 and earlier_fills == 0 else 0
    compute_basis:
      customer_owned_entries: That fill is booked only after the bin's entries of their latest date include one showing it no longer consigned.
      earlier_fills: The fill is the bin's first customer-owned fill only while no replenishment line of the converted item has been booked on the program; once one has, the bin is outside this schedule.
      removal_entries: A consignment withdrawal counts as a par-review conversion only where the converted item's bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program, no fill is booked under this schedule.
      conversion_withdrawal: A consignment withdrawal counts as a par-review conversion only where the converted item's bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program, no fill is booked under this schedule.
      conv_item: The converted item is the item of the program's most recent consignment withdrawal, and the bin's fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked under this schedule.
      conv_date: The converted item is the item of the program's most recent consignment withdrawal, and the bin's fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked under this schedule.
      same_day_withdrawals: The converted item is the item of the program's most recent consignment withdrawal, and the bin's fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked under this schedule.
      entry_date: The converted item is the item of the program's most recent consignment withdrawal, and the bin's fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked under this schedule.
      fill_to: The converted item is the item of the program's most recent consignment withdrawal, and the bin's fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked under this schedule.
      critical_entries: While the customer's Commercial Credit Account is on hold, the first customer-owned fill of a bin converted from consignment at a par review is booked under this schedule as one replenishment line at the program's latest service visit, filled from empty, on a program whose status is active or terminating, whose tier's credit hold service rule is critical items only, and whose bin entries of their latest date include one flagging it critical; any other bin, and any bin while the account is active, is outside this schedule.
      request_entries: That fill is not booked until the bin's entries of their latest date include the customer's written request for it, a par level entry that names no reorder point and sets the customer-owned fill-to level.
      credit_status: While the customer's Commercial Credit Account is on hold, the first customer-owned fill of a bin converted from consignment at a par review is booked under this schedule as one replenishment line at the program's latest service visit, filled from empty, on a program whose status is active or terminating, whose tier's credit hold service rule is critical items only, and whose bin entries of their latest date include one flagging it critical; any other bin, and any bin while the account is active, is outside this schedule.
      credit_reason: 'The hold reason on the customer''s Commercial Credit Account sets the allowance share: 0.5 for a hold for returned payments, 0.75 for a hold for over limit, and the standard whole, 1, for any other reason.'
      hold_in_scope: While the customer's Commercial Credit Account is on hold, the first customer-owned fill of a bin converted from consignment at a par review is booked under this schedule as one replenishment line at the program's latest service visit, filled from empty, on a program whose status is active or terminating, whose tier's credit hold service rule is critical items only, and whose bin entries of their latest date include one flagging it critical; any other bin, and any bin while the account is active, is outside this schedule.
      price_lines: A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer's agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts the item's category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order.
      price_lines_in_effect: A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer's agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts the item's category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order.
      latest_effective: A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer's agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts the item's category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order.
      lines_on_latest: A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer's agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts the item's category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order.
      line_kind: 'The item''s latest price line is its price line in the customer''s agreement with the latest effective date, and its kind is that line''s event: an addition, a repricing or a removal.'
      line_reason: Where the item's latest price line is the addition of a Corbett-approved substitute for a discontinued item and fewer days have passed since its effective date than the agreement's discontinued item price protection days, the fill price is the line's prior unit price, the discontinued item's contract price; where the latest line is any other line that is not a removal, the fill price is its contract unit price; an item whose latest line is a removal takes the standard fill price.
      line_category: A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer's agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts the item's category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order.
      contract_price: Where the item's latest price line is the addition of a Corbett-approved substitute for a discontinued item and fewer days have passed since its effective date than the agreement's discontinued item price protection days, the fill price is the line's prior unit price, the discontinued item's contract price; where the latest line is any other line that is not a removal, the fill price is its contract unit price; an item whose latest line is a removal takes the standard fill price.
      prior_price: Where the item's latest price line is the addition of a Corbett-approved substitute for a discontinued item and fewer days have passed since its effective date than the agreement's discontinued item price protection days, the fill price is the line's prior unit price, the discontinued item's contract price; where the latest line is any other line that is not a removal, the fill price is its contract unit price; an item whose latest line is a removal takes the standard fill price.
      list_price: As standard, the fill price is the list price on the item's latest price line less the list discount of the customer's pricing agreement, rounded half up to 4 decimal places, the allowance share is the whole, 1, and no release is added.
      list_discount: As standard, the fill price is the list price on the item's latest price line less the list discount of the customer's pricing agreement, rounded half up to 4 decimal places, the allowance share is the whole, 1, and no release is added.
      protection_days: Where the item's latest price line is the addition of a Corbett-approved substitute for a discontinued item and fewer days have passed since its effective date than the agreement's discontinued item price protection days, the fill price is the line's prior unit price, the discontinued item's contract price; where the latest line is any other line that is not a removal, the fill price is its contract unit price; an item whose latest line is a removal takes the standard fill price.
      line_age_days: Where the item's latest price line is the addition of a Corbett-approved substitute for a discontinued item and fewer days have passed since its effective date than the agreement's discontinued item price protection days, the fill price is the line's prior unit price, the discontinued item's contract price; where the latest line is any other line that is not a removal, the fill price is its contract unit price; an item whose latest line is a removal takes the standard fill price.
      category_listed: A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer's agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts the item's category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order.
      special_order_lines: A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer's agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts the item's category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order.
      fill_price: Where the item's latest price line is the addition of a Corbett-approved substitute for a discontinued item and fewer days have passed since its effective date than the agreement's discontinued item price protection days, the fill price is the line's prior unit price, the discontinued item's contract price; where the latest line is any other line that is not a removal, the fill price is its contract unit price; an item whose latest line is a removal takes the standard fill price.
      priced_in_scope: A customer with no pricing agreement on record is outside this schedule, and so is an item with no price line in the customer's agreement, with a price line that takes effect after today, or with two price lines of its latest effective date, and so is an item whose latest price line is a removal where the agreement is cost-plus, discounts the item's category, honours list quantity breaks, or the item is booked at the ship-to as a non-stock special order.
      hold_share: 'The hold reason on the customer''s Commercial Credit Account sets the allowance share: 0.5 for a hold for returned payments, 0.75 for a hold for over limit, and the standard whole, 1, for any other reason.'
      withdrawn_value: Consigned stock of the converted item withdrawn the same day adds a release of half its withdrawn value, a withdrawal 1 to 30 days before today adds a quarter of that value, and an older withdrawal adds none.
      withdrawn_days: Consigned stock of the converted item withdrawn the same day adds a release of half its withdrawn value, a withdrawal 1 to 30 days before today adds a quarter of that value, and an older withdrawal adds none.
      release_value: Consigned stock of the converted item withdrawn the same day adds a release of half its withdrawn value, a withdrawal 1 to 30 days before today adds a quarter of that value, and an older withdrawal adds none.
      payments_month: Payments the customer's Commercial Credit Account received in the latest month (rows of age zero, a row's age in whole months being the calendar months from its date to today, less one when today's day of the month is earlier than its day) add a release of 1 percent of their total where that total is 50,000.00 USD or more, 0.5 percent where it is 10,000.00 USD or more but below 50,000.00 USD, and none below that.
      payment_rate: Payments the customer's Commercial Credit Account received in the latest month (rows of age zero, a row's age in whole months being the calendar months from its date to today, less one when today's day of the month is earlier than its day) add a release of 1 percent of their total where that total is 50,000.00 USD or more, 0.5 percent where it is 10,000.00 USD or more but below 50,000.00 USD, and none below that.
      payment_release: Payments the customer's Commercial Credit Account received in the latest month (rows of age zero, a row's age in whole months being the calendar months from its date to today, less one when today's day of the month is earlier than its day) add a release of 1 percent of their total where that total is 50,000.00 USD or more, 0.5 percent where it is 10,000.00 USD or more but below 50,000.00 USD, and none below that.
      visit_ref: While the customer's Commercial Credit Account is on hold, the first customer-owned fill of a bin converted from consignment at a par review is booked under this schedule as one replenishment line at the program's latest service visit, filled from empty, on a program whose status is active or terminating, whose tier's credit hold service rule is critical items only, and whose bin entries of their latest date include one flagging it critical; any other bin, and any bin while the account is active, is outside this schedule.
      visit_date: The converted item is the item of the program's most recent consignment withdrawal, and the bin's fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked under this schedule.
      visits_that_day: The converted item is the item of the program's most recent consignment withdrawal, and the bin's fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked under this schedule.
      delivered_critical: 'The allowance left is worked out in this order: the tier''s critical item replenishment cap is multiplied by the allowance share, every release added is added to that product, and the value of critical replenishment already delivered at the same visit is subtracted; the fill is the lesser of the bin''s fill-to level and the whole units the allowance left buys at the fill price, taken to six decimal places and rounded down, never below zero.'
      allowance_left: 'The allowance left is worked out in this order: the tier''s critical item replenishment cap is multiplied by the allowance share, every release added is added to that product, and the value of critical replenishment already delivered at the same visit is subtracted; the fill is the lesser of the bin''s fill-to level and the whole units the allowance left buys at the fill price, taken to six decimal places and rounded down, never below zero.'
      fill_units: 'The allowance left is worked out in this order: the tier''s critical item replenishment cap is multiplied by the allowance share, every release added is added to that product, and the value of critical replenishment already delivered at the same visit is subtracted; the fill is the lesser of the bin''s fill-to level and the whole units the allowance left buys at the fill price, taken to six decimal places and rounded down, never below zero.'
      result: The converted item is the item of the program's most recent consignment withdrawal, and the bin's fill-to level is the highest fill-to level among its entries of their latest date; where there is no consignment withdrawal or two or more carry that most recent date, where there is no service visit or two or more carry the latest visit date, or where the bin has no entry, no fill is booked under this schedule.
    factors:
    - id: fill_price_basis
      effect: method
      decides: fill_price
      bindings:
      - line_reason
      - contract_price
      - prior_price
      - list_price
      - list_discount
      - protection_days
      - line_age_days
      - fill_price
      ladder:
      - when: latest line adds a substitute for a discontinued item, inside the agreement's price protection days
        method: fill price = the line's prior unit price (the discontinued item's contract price)
      - when: latest line any other non-removal line
        method: fill price = its contract unit price
      - when: otherwise (latest line a removal)
        method: fill price = list price x (1 - list discount percent), 4 decimals
      baseline:
        fill_price: RND(list_price * (1 - list_discount / 100), 4)
      evidence:
      - cross_category
      - date
      cross_difficulty: pricing
    - id: hold_share
      effect: parameter
      decides: hold_share
      bindings:
      - credit_reason
      - hold_share
      ladder:
      - when: on hold for returned payments
        value: K('returned_share') = 0.5
      - when: on hold for over limit
        value: K('over_limit_share') = 0.75
      - when: otherwise
        value: K('standard_share') = 1
      baseline:
        hold_share: K('standard_share')
      evidence:
      - cross_category
      cross_difficulty: credit
    - id: conversion_release
      effect: parameter
      decides: release_value
      bindings:
      - withdrawn_value
      - withdrawn_days
      - release_value
      ladder:
      - when: consigned stock of the item withdrawn the same day
        value: K('same_day_release') = half the withdrawn value
      - when: withdrawn 1 to 30 days before today
        value: K('recent_release') = a quarter of the withdrawn value
      - when: otherwise
        value: K('no_release') = none
      baseline:
        release_value: K('no_release')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: payment_release
      effect: parameter
      decides: payment_release
      bindings:
      - payments_month
      - payment_rate
      - payment_release
      ladder:
      - when: payments received in the latest month total 50,000.00 USD or more
        value: K('payment_high_rate') = 1 percent of them
      - when: 10,000.00 USD or more but below 50,000.00 USD
        value: K('payment_low_rate') = 0.5 percent of them
      - when: otherwise
        value: K('payment_none_rate') = none
      baseline:
        payment_release: K('payment_none_rate')
      evidence:
      - cross_category
      - history
      cross_difficulty: credit
    baseline:
      rule: 'As standard, the fill price is the list price on the item''s latest price line less the list discount of the customer''s pricing agreement, rounded half up to 4 decimal places, the allowance share is the whole, 1, and no release is added. The allowance left is worked out in this order: the tier''s critical item replenishment cap is multiplied by the allowance share, every release added is added to that product, and the value of critical replenishment already delivered at the same visit is subtracted; the fill is the lesser of the bin''s fill-to level and the whole units the allowance left buys at the fill price, taken to six decimal places and rounded down, never below zero.'
      params:
      - standard_share
      - no_release
      - payment_none_rate
    inputs:
      history:
      - table: vmi_activity
        aggregate: sum
        field: extended_amount
        filters:
          event_type: vmi_replenishment_delivered
          critical_item: true
      - category: credit
        table: credit_transactions
        aggregate: sum
        field: amount
        within_months: 1
        filters:
          event_type: credit_payment_received
      cross_category:
      - credit
      - pricing
      - order
