    factors:
    - id: demand_rate
      effect: method
      decides: daily_usage
      bindings:
      - net_1m
      - net_2m
      - month_latest
      - month_middle
      - month_earliest
      - peak_month
      - low_month
      - daily_usage
      ladder:
      - when: net vends in each of the last three months and the highest month 1.4 times the lowest or more
        method: daily usage = highest month / 30, peak sizing
      - when: net vends in each of those months and the highest month 1.15 to below 1.4 times the lowest
        method: daily usage = (highest month + one third of three-month net vends) / 2 / 30, peak-and-mean blend
      - when: otherwise (steady, or a month without net vends)
        method: daily usage = three-month net vends / 91, the plain average
      baseline:
        daily_usage: net_3m / K('window_days')
      evidence:
      - cross_category
      - history
      cross_difficulty: vending
    - id: backorder_allowance
      effect: parameter
      decides: backorder_days
      bindings:
      - backorders
      - backorders_closed
      - backorder_days
      ladder:
      - when: more backorders of the item opened at the ship-to in the last three months than filled or cancelled
        value: K('open_bo_days') = 3 days
      - when: some opened and as many or more filled or cancelled
        value: K('closed_bo_days') = 1 day
      - when: otherwise (none opened)
        value: K('no_bo_days') = none
      baseline:
        backorder_days: K('no_bo_days')
      evidence:
      - cross_category
      - history
      cross_difficulty: order
    - id: rush_allowance
      effect: parameter
      decides: rush_days
      bindings:
      - rush_orders
      - rush_days
      ladder:
      - when: 2 or more next-day-air bookings of the item at the ship-to in the last six months
        value: K('exp_high_days') = 1 day
      - when: exactly 1
        value: K('exp_low_days') = 0.5 day
      - when: otherwise (none)
        value: K('exp_none_days') = none
      baseline:
        rush_days: K('exp_none_days')
      evidence:
      - cross_category
      - history
      cross_difficulty: order
    - id: route_allowance
      effect: parameter
      decides: route_days
      bindings:
      - route_deliveries
      - route_days
      ladder:
      - when: ship-to service level schedules no route deliveries
        value: K('route_none_days') = 2 days
      - when: 1 or 2 route deliveries a week
        value: K('route_light_days') = 1 day
      - when: otherwise (3 or more a week)
        value: K('route_full_days') = none
      baseline:
        route_days: K('route_full_days')
      evidence:
      - cross_category
      - tier_param
      cross_difficulty: order
    - id: draw_buffer
      effect: parameter
      decides: draw_buffer
      bindings:
      - largest_draw
      - draw_buffer
      ladder:
      - when: largest single vend at the demand machine 4 units or more
        value: K('buffer_large_units') = 2 units
      - when: largest single vend 2 or 3 units
        value: K('buffer_small_units') = 1 unit
      - when: otherwise (smaller, or no vend at the demand machine)
        value: K('buffer_none_units') = none
      baseline:
        draw_buffer: K('buffer_none_units')
      evidence:
      - cross_category
      - history
      cross_difficulty: vending
    - id: supply_allowance
      effect: parameter
      decides: supply_days
      bindings:
      - special_flag
      - special_orders
      - supply_days
      ladder:
      - when: any VendPoint selection-setting entry flags the item a special item
        value: K('special_days') = 4 days
      - when: not so flagged and booked at the ship-to as a non-stock special order
        value: K('nonstock_days') = 2 days
      - when: otherwise
        value: K('catalog_days') = none
      baseline:
        supply_days: K('catalog_days')
      evidence:
      - cross_category
      - history
      cross_difficulty: vending
    baseline:
      rule: As standard, the daily usage is the net vends of the last three months divided by 91. As standard, the visit gap is 30 days divided by the visits the program's tier schedules a month (7 days for a tier scheduling none), the lead days are the tier's replenishment lead business days counted as days, no allowance days are added and no draw buffer is added. The reorder point is the daily usage times the reorder days, which are the visit gap plus the lead days plus every allowance day added, taken to six decimal places and rounded up to the next whole unit, never below zero, plus the draw buffer in units.
      params:
      - window_days
      - month_days
      - no_visit_gap_days
      - no_bo_days
      - exp_none_days
      - route_full_days
      - buffer_none_units
      - catalog_days
    inputs:
      history:
      - category: vending
        table: vending_transactions
        aggregate: sum
        field: quantity
        within_months: 3
        filters:
          event_type: vending_item_issued
      - category: order
        table: order_lines
        aggregate: count
        field: order_line_id
        within_months: 3
        filters:
          event_type: order_line_backordered
      - category: order
        table: order_lines
        aggregate: count
        field: order_line_id
        within_months: 6
        filters:
          event_type: order_line_booked
          ship_method: next_day_air
      - category: vending
        table: vending_transactions
        aggregate: sum
        field: quantity
        within_months: 1
        filters:
          event_type: vending_item_issued
      cross_category:
      - vending
      - order
