      route_cover: 'The program''s ship-to adds cover weeks for the route truck deliveries its service level schedules each week: a ship-to with no route deliveries adds 1 week, a ship-to with 1 or 2 route deliveries a week adds 0.5 week, and a ship-to with 3 or more adds none; a ship-to whose service level is not on record adds none.'
