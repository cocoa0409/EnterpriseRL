      half: 0.5
      open_ended_months: 1200
    rule: 'Corbett books the opening consigned stock of a new consigned bin that takes over an item taken out of one of the customer''s VendPoint machines under this schedule, as one consigned-stocking line at the program''s service visit of that day, at the item''s contract unit price. A new consigned bin of this kind takes effect at the program''s service visit of the day its entries stand, and its opening stock is placed at that visit; every other bin change still takes effect from the next visit or scan. The opening stock is placed only while the program''s consigned stock value, with the opening stock added, stays at or below the consigned value cap of the program''s tier: the program''s consigned stock value is its consigned stockings less its consigned consumption, shrink and withdrawals, each at the value it was booked at; the opening stock is valued at the item''s contract unit price on its latest price line, which must be in effect today and alone on its effective date, and an item
      without such a line gets no opening stock under this schedule; where the opening stock worked out below would carry the consigned stock value above the cap, it is cut to the whole units that keep the value at or below the cap. The opening stock of such a bin is worked out only after its new-bin entry, flagged consigned and carrying its fill-to level, stands in the program''s bin history. The opening stock is not placed until the bin''s par level entries carry a reorder point above zero. The bin is the consigned bin with the most recent new-bin entry on the program, its fill-to level is the one on that new-bin entry, its reorder point is the highest reorder point any of its par level entries carries, and zero where it has none, and its item is the transferred item; where two or more consigned new-bin entries carry that most recent effective date, or there is none, no opening stock is set under this schedule. The demand machine is the machine of the customer''s most recent VendPoint selection
      removal of the transferred item made at the customer''s request; where two or more such removals of the item carry that most recent date, or there is none, no opening stock is set under this schedule. The opening stock is placed at the program''s service visit dated today; where no service visit is dated today, or two or more are, no opening stock is set under this schedule. A row''s age in whole months is the number of calendar months from its date to today, less one when today''s day of the month is earlier than the row''s day of the month, and a window of the last three or the last six months holds rows of age below three or below six. As standard, the opening level is the bin''s fill-to level and the carried share is the whole, 1. The opening stock is the opening level times the carried share, which is the product of every share that applies, taken to six decimal places and then rounded down to a whole unit. Where every vend of the transferred item recorded at the demand machine
      is of age below three months, the opening level is the bin''s reorder point; where every such vend is of age below six months but at least one is three months old or older, the opening level is half the sum of the bin''s reorder point and its fill-to level; an item with no vend there counts as having every vend below three months, and an item with any vend six months old or older takes the standard opening level. The receivable balance of the customer''s Commercial Credit Account divided by its credit limit puts a credit-room share into the carried share: 0.9 or more puts 0.7, 0.75 or more but below 0.9 puts 0.85, and less puts 1, an account with no credit limit, or no account on record, counting as 0.9 or more. Backorders of the transferred item opened at the program''s ship-to in the last three months put a supply share into the carried share: where more were opened than were filled or cancelled in those months, 0.6; where some were opened and as many or more were filled or cancelled
      in those months, 0.9; where none was opened, 1. The age in whole months of the program''s ship-to, from the date it was opened to today, puts a site share into the carried share: below 6 months puts 0.7, 6 to 11 months puts 0.9, and 12 months or more puts 1; a ship-to with no opening date on record counts as opened today. Units of the transferred item returned to the demand machine in the last three months, divided by the units vended there in those months, put a return share into the carried share: 0.1 or more puts 0.75, 0.05 or more but below 0.1 puts 0.9, and less, or no vends in those months, puts 1.'
    prerequisite:
    - problem: vmi_ext_vended_item_fill_level
      kind: value_input
      gate: fill_to
      form: state
      policy_source: The opening stock of such a bin is worked out only after its new-bin entry, flagged consigned and carrying its fill-to level, stands in the program's bin history.
      condition: a vmi_bin_set new_bin entry flagged consigned stands for the transferred item with its max_qty fill-to level
      resolved_by: submit_vended_item_bin_request_0334ff8e
      effect: fill_to takes the fill-to level of the customer's new-bin entry, and the opening level is worked from it
    - problem: vmi_ext_consigned_reorder_point
      kind: value_input
      gate: reorder_point
      form: state
      policy_source: The opening stock is not placed until the bin's par level entries carry a reorder point above zero.
      condition: the bin carries a vmi_bin_set par_change entry with min_qty above zero
      resolved_by: record_consigned_reorder_point_33b5bdc5
      effect: reorder_point takes Corbett's reorder point, which the trial opening level is worked from
    cross_category:
    - category: vending
      as: history
      reads:
      - vending_planogram.vending_machine_id
      - vending_transactions.quantity
      - vending_transactions.event_date
      note: trial_level and return_rate read the item vend ledger at the demand machine
    - category: credit
      as: branch
      reads:
      - ar_balance
      - credit_limit
      note: credit_room reads the credit account receivable and limit
    - category: order
      as: history
      reads:
      - opened_date
      - order_lines.event_type
      note: supply_check reads backorders of the item, site_age the ship-to opening date
    - category: pricing
      as: branch
      reads:
      - pricing_items.contract_unit_price
      - pricing_items.effective_date
      note: the consigned value cap check values the opening stock at the item contract unit price
    compute:
    - new_label: LATEST('vmi_bins','bin_label', event_type='vmi_bin_set', change_type='new_bin', consigned=True)
    - new_item: LATEST('vmi_bins','sku', event_type='vmi_bin_set', change_type='new_bin', consigned=True)
    - new_set_date: LATEST('vmi_bins','event_date', event_type='vmi_bin_set', change_type='new_bin', consigned=True)
    - same_day_new: COUNT('vmi_bins', event_type='vmi_bin_set', change_type='new_bin', consigned=True, event_date=new_set_date)
    - fill_to: LATEST('vmi_bins','max_qty', event_type='vmi_bin_set', change_type='new_bin', consigned=True) if new_set_date != None else 0
    - reorder_point: MAX('vmi_bins','min_qty', event_type='vmi_bin_set', change_type='par_change', bin_label=new_label) if COUNT('vmi_bins', event_type='vmi_bin_set', change_type='par_change', bin_label=new_label) > 0 else 0
    - removal_machine: XLATEST('vending','vending_planogram','vending_machine_id', event_type='vending_selection_removed', change_source='customer', sku=new_item)
    - removal_on: XLATEST('vending','vending_planogram','event_date', event_type='vending_selection_removed', change_source='customer', sku=new_item)
    - same_day_item_removals: XCOUNT('vending','vending_planogram', event_type='vending_selection_removed', change_source='customer', sku=new_item, event_date=removal_on)
    - vends_all: XCOUNT('vending','vending_transactions', event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine)
    - vends_3m: XCOUNT('vending','vending_transactions', within_months=3, event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine)
    - vends_6m: XCOUNT('vending','vending_transactions', within_months=6, event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine)
    - opening_target: reorder_point if vends_3m == vends_all else ((reorder_point + fill_to) * K('half') if vends_6m == vends_all else fill_to)
    - receivable: CFIELD('credit','ar_balance')
    - credit_limit: CFIELD('credit','credit_limit')
    - credit_use: receivable / credit_limit if credit_limit and receivable != None else 1
    - credit_share: K('credit_tight_share') if credit_use >= K('credit_tight_ratio') else (K('credit_busy_share') if credit_use >= K('credit_busy_ratio') else K('credit_clear_share'))
    - backorders: XCOUNT('order','order_lines', within_months=3, event_type='order_line_backordered', sku=new_item, ship_to_id=F('ship_to_id'))
    - backorders_closed: XCOUNT('order','order_lines', within_months=3, event_type='order_backorder_filled', sku=new_item, ship_to_id=F('ship_to_id')) + XCOUNT('order','order_lines', within_months=3, event_type='order_backorder_cancelled', sku=new_item, ship_to_id=F('ship_to_id'))
    - supply_share: K('supply_open_share') if backorders > backorders_closed else (K('supply_recent_share') if backorders > 0 else K('supply_clear_share'))
    - site_opened: CFIELD('order','opened_date', ship_to_id=F('ship_to_id'))
    - site_months: MONTHS(site_opened, NOW) if site_opened != None else 0
    - site_share: K('site_young_share') if site_months < K('site_young_months') else (K('site_settling_share') if site_months < K('site_settling_months') else K('site_settled_share'))
    - issued_units_3m: XSUM('vending','vending_transactions','quantity', within_months=3, event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine)
    - returned_units_3m: XSUM('vending','vending_transactions','quantity', within_months=3, event_type='vending_item_returned', sku=new_item, vending_machine_id=removal_machine)
    - return_rate: returned_units_3m / issued_units_3m if issued_units_3m > 0 else 0
    - return_share: K('returns_high_share') if return_rate >= K('returns_high_ratio') else (K('returns_some_share') if return_rate >= K('returns_some_ratio') else K('returns_low_share'))
    - raw_opening: opening_target * credit_share * supply_share * site_share * return_share
    - price_lines: XCOUNT('pricing','pricing_items', sku=new_item)
    - price_lines_in_effect: XCOUNT('pricing','pricing_items', within_months=K('open_ended_months'), date_field='effective_date', sku=new_item)
    - price_date: XLATEST('pricing','pricing_items','effective_date', date_field='effective_date', sku=new_item)
    - lines_on_price_date: XCOUNT('pricing','pricing_items', sku=new_item, effective_date=price_date)
    - item_price: XLATEST('pricing','pricing_items','contract_unit_price', date_field='effective_date', sku=new_item) if price_lines > 0 and price_lines == price_lines_in_effect and lines_on_price_date == 1 else 0
    - consigned_value: SUM('vmi_activity','extended_amount', event_type='vmi_consignment_stocked') - SUM('vmi_activity','extended_amount', event_type='vmi_consignment_consumed') - SUM('vmi_activity','extended_amount', event_type='vmi_shrink_billed') - SUM('vmi_activity','extended_amount', event_type='vmi_consignment_withdrawn')
    - cap_units: MX(0, int(RND((P('consigned_value_cap_usd') - consigned_value) / item_price, 6) // 1)) if item_price > 0 else 0
    - visits_today: COUNT('vmi_activity', event_type='vmi_service_visit_completed', event_date=NOW)
    - result: MN(int(RND(raw_opening, 6) // 1), cap_units) if same_day_new == 1 and same_day_item_removals == 1 and visits_today == 1 and reorder_point > 0 else 0
