  - id: vmi_ext_converted_critical_fill
    base_policy_refs:
    - vmi_bins_and_par
    - vmi_evt_consignment
    overwrite: []
    trigger: on_request
    subject:
    - vmi_bin_set
    computes: max_qty
    target_tool: submit_critical_bin_request_f65e9169
    params:
      weeks_per_year: 52
      months_per_year: 12
      lumpy_months_max: 4
      intermittent_months_max: 8
      daily_visits_min: 20
      daily_done_min: 18
      regular_visits_min: 8
      regular_done_min: 6
      cover_daily_weeks: 0.5
      cover_regular_weeks: 1.0
      cover_standard_weeks: 2.0
      emergency_high_min: 3
      emergency_high_weeks: 1.0
      emergency_low_weeks: 0.5
      emergency_none_weeks: 0.0
      rush_high_min: 2
      rush_high_weeks: 1.0
      rush_low_weeks: 0.5
      rush_none_weeks: 0.0
      special_weeks: 2.0
      backorder_weeks: 1.0
      plain_supply_weeks: 0.0
      over_limit_ratio: 1.0
      near_limit_ratio: 0.8
      over_limit_share: 0.75
      near_limit_share: 0.9
      clear_share: 1.0
      half: 0.5
    rule: 'When Corbett withdraws a slow-moving consigned item from its bin at a par review so that the bin is converted to customer-owned replenishment, the customer''s own written request for that bin sets the customer-owned fill-to level this schedule gives, and flags the bin critical where the customer asks for it. The converted item is the item of the program''s most recent consignment withdrawal, and its bin is the bin whose entries carry that item; where two or more consignment withdrawals carry that most recent date, or there is none, no fill-to level is set under this schedule. A consignment withdrawal counts as a par-review conversion only where the converted item''s bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program, no fill-to level is set under this schedule. A row''s age in whole months is the number of calendar months from its date to today, less one when today''s day of the month is earlier
      than the row''s day of the month; the latest month holds rows of age zero, and a window of the last six or the last twelve months holds rows of age below six or below twelve. As standard, the weekly draw of the converted item is its consumption billed over the last twelve months divided by 52. As standard, the storeroom cover is 2 weeks, no further cover weeks are added and the limit share is the whole, 1. The customer-owned fill-to level is the weekly draw times the cover in weeks, which is the storeroom cover plus every added cover week, times the limit share, taken to six decimal places and then rounded up to the next whole unit. Where the converted item''s consumption was billed in 4 or fewer of the last twelve billing months, its weekly draw is its largest single billing month of consumption on record times 12 divided by 52; where it was billed in 5 to 8 of those months, its weekly draw is the midpoint of its largest single billing month on record and its average month (its consumption
      of the last twelve months divided by 12), and that midpoint is then multiplied by 12 and divided by 52; an item billed in more months takes the standard weekly draw, and an item with no consumption on record has a weekly draw of zero. The storeroom cover follows the program''s service: a program whose tier schedules 20 or more visits a month and that completed 18 or more scheduled or onsite daily visits in the latest month takes 0.5 week; a program whose tier schedules 8 to 19 visits a month and that completed 6 or more such visits in the latest month takes 1 week; any other program takes the standard 2 weeks. Emergency visits completed on the program in the last six months add outage cover: 3 or more add 1 week, 1 or 2 add 0.5 week, and none adds none. Next-day-air bookings of the converted item at the program''s ship-to in the last six months add rush cover: 2 or more add 1 week, exactly 1 adds 0.5 week, and none adds none. The converted item''s supply adds cover: an item that any
      of its bin entries flags as special stock adds 2 weeks, any other item backordered at the program''s ship-to in the last six months adds 1 week, and any other item adds none. The receivable balance of the customer''s Commercial Credit Account divided by its credit limit sets the limit share: 1.0 or more puts 0.75, 0.8 or more but below 1.0 puts 0.9, and less puts 1, an account with no credit limit, or no account on record, counting as 1.0 or more.'
    prerequisite: []
    cross_category:
    - category: order
      as: history
      reads:
      - order_lines.ship_method
      - order_lines.event_type
      note: rush_cover and supply_cover read the item order history at the ship-to
    - category: credit
      as: branch
      reads:
      - ar_balance
      - credit_limit
      note: limit_share reads receivable over credit limit
    compute:
    - conv_item: LATEST('vmi_activity','sku', event_type='vmi_consignment_withdrawn')
    - conv_date: LATEST('vmi_activity','event_date', event_type='vmi_consignment_withdrawn')
    - same_day_withdrawals: COUNT('vmi_activity', event_type='vmi_consignment_withdrawn', event_date=conv_date)
    - removal_entries: COUNT('vmi_bins', event_type='vmi_bin_removed', sku=conv_item)
    - conversion_withdrawal: same_day_withdrawals == 1 and removal_entries == 0 and F('status') != 'closed'
    - consumed_12m: SUM('vmi_activity','quantity', within_months=12, event_type='vmi_consignment_consumed', sku=conv_item)
    - consumed_months: COUNT('vmi_activity', within_months=12, event_type='vmi_consignment_consumed', sku=conv_item)
    - largest_month: MAX('vmi_activity','quantity', event_type='vmi_consignment_consumed', sku=conv_item) if COUNT('vmi_activity', event_type='vmi_consignment_consumed', sku=conv_item) > 0 else 0
    - weekly_draw: largest_month * K('months_per_year') / K('weeks_per_year') if consumed_months <= K('lumpy_months_max') else ((largest_month + consumed_12m / K('months_per_year')) * K('half') * K('months_per_year') / K('weeks_per_year') if consumed_months <= K('intermittent_months_max') else consumed_12m / K('weeks_per_year'))
    - visits_done: COUNT('vmi_activity', within_months=1, event_type='vmi_service_visit_completed', visit_type='scheduled') + COUNT('vmi_activity', within_months=1, event_type='vmi_service_visit_completed', visit_type='onsite_daily')
    - restock_weeks: K('cover_daily_weeks') if P('service_visits_per_month') >= K('daily_visits_min') and visits_done >= K('daily_done_min') else (K('cover_regular_weeks') if P('service_visits_per_month') >= K('regular_visits_min') and P('service_visits_per_month') < K('daily_visits_min') and visits_done >= K('regular_done_min') else K('cover_standard_weeks'))
    - emergency_visits: COUNT('vmi_activity', within_months=6, event_type='vmi_service_visit_completed', visit_type='emergency')
    - emergency_weeks: K('emergency_high_weeks') if emergency_visits >= K('emergency_high_min') else (K('emergency_low_weeks') if emergency_visits >= 1 else K('emergency_none_weeks'))
    - rush_orders: XCOUNT('order','order_lines', within_months=6, event_type='order_line_booked', ship_method='next_day_air', sku=conv_item, ship_to_id=F('ship_to_id'))
    - rush_weeks: K('rush_high_weeks') if rush_orders >= K('rush_high_min') else (K('rush_low_weeks') if rush_orders == 1 else K('rush_none_weeks'))
    - special_flag: COUNT('vmi_bins', event_type='vmi_bin_set', special_stock=True, sku=conv_item) > 0
    - backorders_6m: XCOUNT('order','order_lines', within_months=6, event_type='order_line_backordered', sku=conv_item, ship_to_id=F('ship_to_id'))
    - supply_weeks: K('special_weeks') if special_flag else (K('backorder_weeks') if backorders_6m > 0 else K('plain_supply_weeks'))
    - receivable: CFIELD('credit','ar_balance')
    - credit_limit: CFIELD('credit','credit_limit')
    - limit_use: receivable / credit_limit if credit_limit and receivable != None else K('over_limit_ratio')
    - limit_share: K('over_limit_share') if limit_use >= K('over_limit_ratio') else (K('near_limit_share') if limit_use >= K('near_limit_ratio') else K('clear_share'))
    - cover_weeks: restock_weeks + emergency_weeks + rush_weeks + supply_weeks
    - raw_fill: weekly_draw * cover_weeks * limit_share
    - result: int(-(-RND(raw_fill, 6) // 1)) if conversion_withdrawal else 0
    compute_basis:
      removal_entries: A consignment withdrawal counts as a par-review conversion only where the converted item's bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program, no fill-to level is set under this schedule.
      conversion_withdrawal: A consignment withdrawal counts as a par-review conversion only where the converted item's bin carries no removal entry and the program is not closed; after a withdrawal that follows the removal of the bin or the end of the program, no fill-to level is set under this schedule.
      conv_item: The converted item is the item of the program's most recent consignment withdrawal, and its bin is the bin whose entries carry that item; where two or more consignment withdrawals carry that most recent date, or there is none, no fill-to level is set under this schedule.
      conv_date: The converted item is the item of the program's most recent consignment withdrawal, and its bin is the bin whose entries carry that item; where two or more consignment withdrawals carry that most recent date, or there is none, no fill-to level is set under this schedule.
      same_day_withdrawals: The converted item is the item of the program's most recent consignment withdrawal, and its bin is the bin whose entries carry that item; where two or more consignment withdrawals carry that most recent date, or there is none, no fill-to level is set under this schedule.
      consumed_12m: As standard, the weekly draw of the converted item is its consumption billed over the last twelve months divided by 52.
      consumed_months: Where the converted item's consumption was billed in 4 or fewer of the last twelve billing months, its weekly draw is its largest single billing month of consumption on record times 12 divided by 52; where it was billed in 5 to 8 of those months, its weekly draw is the midpoint of its largest single billing month on record and its average month (its consumption of the last twelve months divided by 12), and that midpoint is then multiplied by 12 and divided by 52; an item billed in more months takes the standard weekly draw, and an item with no consumption on record has a weekly draw of zero.
      largest_month: Where the converted item's consumption was billed in 4 or fewer of the last twelve billing months, its weekly draw is its largest single billing month of consumption on record times 12 divided by 52; where it was billed in 5 to 8 of those months, its weekly draw is the midpoint of its largest single billing month on record and its average month (its consumption of the last twelve months divided by 12), and that midpoint is then multiplied by 12 and divided by 52; an item billed in more months takes the standard weekly draw, and an item with no consumption on record has a weekly draw of zero.
      weekly_draw: Where the converted item's consumption was billed in 4 or fewer of the last twelve billing months, its weekly draw is its largest single billing month of consumption on record times 12 divided by 52; where it was billed in 5 to 8 of those months, its weekly draw is the midpoint of its largest single billing month on record and its average month (its consumption of the last twelve months divided by 12), and that midpoint is then multiplied by 12 and divided by 52; an item billed in more months takes the standard weekly draw, and an item with no consumption on record has a weekly draw of zero.
      visits_done: 'The storeroom cover follows the program''s service: a program whose tier schedules 20 or more visits a month and that completed 18 or more scheduled or onsite daily visits in the latest month takes 0.5 week; a program whose tier schedules 8 to 19 visits a month and that completed 6 or more such visits in the latest month takes 1 week; any other program takes the standard 2 weeks.'
      restock_weeks: 'The storeroom cover follows the program''s service: a program whose tier schedules 20 or more visits a month and that completed 18 or more scheduled or onsite daily visits in the latest month takes 0.5 week; a program whose tier schedules 8 to 19 visits a month and that completed 6 or more such visits in the latest month takes 1 week; any other program takes the standard 2 weeks.'
      emergency_visits: 'Emergency visits completed on the program in the last six months add outage cover: 3 or more add 1 week, 1 or 2 add 0.5 week, and none adds none.'
      emergency_weeks: 'Emergency visits completed on the program in the last six months add outage cover: 3 or more add 1 week, 1 or 2 add 0.5 week, and none adds none.'
      rush_orders: 'Next-day-air bookings of the converted item at the program''s ship-to in the last six months add rush cover: 2 or more add 1 week, exactly 1 adds 0.5 week, and none adds none.'
      rush_weeks: 'Next-day-air bookings of the converted item at the program''s ship-to in the last six months add rush cover: 2 or more add 1 week, exactly 1 adds 0.5 week, and none adds none.'
      special_flag: 'The converted item''s supply adds cover: an item that any of its bin entries flags as special stock adds 2 weeks, any other item backordered at the program''s ship-to in the last six months adds 1 week, and any other item adds none.'
      backorders_6m: 'The converted item''s supply adds cover: an item that any of its bin entries flags as special stock adds 2 weeks, any other item backordered at the program''s ship-to in the last six months adds 1 week, and any other item adds none.'
      supply_weeks: 'The converted item''s supply adds cover: an item that any of its bin entries flags as special stock adds 2 weeks, any other item backordered at the program''s ship-to in the last six months adds 1 week, and any other item adds none.'
      receivable: 'The receivable balance of the customer''s Commercial Credit Account divided by its credit limit sets the limit share: 1.0 or more puts 0.75, 0.8 or more but below 1.0 puts 0.9, and less puts 1, an account with no credit limit, or no account on record, counting as 1.0 or more.'
      credit_limit: 'The receivable balance of the customer''s Commercial Credit Account divided by its credit limit sets the limit share: 1.0 or more puts 0.75, 0.8 or more but below 1.0 puts 0.9, and less puts 1, an account with no credit limit, or no account on record, counting as 1.0 or more.'
      limit_use: 'The receivable balance of the customer''s Commercial Credit Account divided by its credit limit sets the limit share: 1.0 or more puts 0.75, 0.8 or more but below 1.0 puts 0.9, and less puts 1, an account with no credit limit, or no account on record, counting as 1.0 or more.'
      limit_share: 'The receivable balance of the customer''s Commercial Credit Account divided by its credit limit sets the limit share: 1.0 or more puts 0.75, 0.8 or more but below 1.0 puts 0.9, and less puts 1, an account with no credit limit, or no account on record, counting as 1.0 or more.'
      cover_weeks: The customer-owned fill-to level is the weekly draw times the cover in weeks, which is the storeroom cover plus every added cover week, times the limit share, taken to six decimal places and then rounded up to the next whole unit.
      raw_fill: The customer-owned fill-to level is the weekly draw times the cover in weeks, which is the storeroom cover plus every added cover week, times the limit share, taken to six decimal places and then rounded up to the next whole unit.
      result: The customer-owned fill-to level is the weekly draw times the cover in weeks, which is the storeroom cover plus every added cover week, times the limit share, taken to six decimal places and then rounded up to the next whole unit.
    factors:
    - id: draw_basis
      effect: method
      decides: weekly_draw
      bindings:
      - consumed_months
      - largest_month
      - weekly_draw
      ladder:
      - when: consumption billed in 4 or fewer of the last twelve billing months
        method: weekly draw = largest single billing month on record x 12 / 52
      - when: billed in 5 to 8 of those months
        method: weekly draw = midpoint of the largest billing month and the twelve-month average month, x 12 / 52
      - when: otherwise (9 or more months)
        method: weekly draw = twelve-month consumption / 52
      baseline:
        weekly_draw: consumed_12m / K('weeks_per_year')
      evidence:
      - history
      cross_difficulty: null
    - id: storeroom_cover
      effect: parameter
      decides: restock_weeks
      bindings:
      - visits_done
      - restock_weeks
      ladder:
      - when: tier schedules 20 or more visits a month and 18 or more scheduled or onsite daily visits were completed in the latest month
        value: K('cover_daily_weeks') = 0.5 week
      - when: tier schedules 8 to 19 visits a month and 6 or more such visits were completed in the latest month
        value: K('cover_regular_weeks') = 1 week
      - when: otherwise
        value: K('cover_standard_weeks') = 2 weeks
      baseline:
        restock_weeks: K('cover_standard_weeks')
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: outage_cover
      effect: parameter
      decides: emergency_weeks
      bindings:
      - emergency_visits
      - emergency_weeks
      ladder:
      - when: 3 or more emergency visits in the last six months
        value: K('emergency_high_weeks') = 1 week
      - when: 1 or 2 emergency visits
        value: K('emergency_low_weeks') = 0.5 week
      - when: otherwise (none)
        value: K('emergency_none_weeks') = none
      baseline:
        emergency_weeks: K('emergency_none_weeks')
      evidence:
      - history
      cross_difficulty: null
    - id: rush_cover
      effect: parameter
      decides: rush_weeks
      bindings:
      - rush_orders
      - rush_weeks
      ladder:
      - when: 2 or more next-day-air bookings of the item at the ship-to in the last six months
        value: K('rush_high_weeks') = 1 week
      - when: exactly 1
        value: K('rush_low_weeks') = 0.5 week
      - when: otherwise (none)
        value: K('rush_none_weeks') = none
      baseline:
        rush_weeks: K('rush_none_weeks')
      evidence:
      - cross_category
      - history
      cross_difficulty: order
    - id: supply_cover
      effect: parameter
      decides: supply_weeks
      bindings:
      - special_flag
      - backorders_6m
      - supply_weeks
      ladder:
      - when: any bin entry flags the item special stock
        value: K('special_weeks') = 2 weeks
      - when: not special and backordered at the ship-to in the last six months
        value: K('backorder_weeks') = 1 week
      - when: otherwise
        value: K('plain_supply_weeks') = none
      baseline:
        supply_weeks: K('plain_supply_weeks')
      evidence:
      - history
      - cross_category
      cross_difficulty: order
    - id: limit_share
      effect: parameter
      decides: limit_share
      bindings:
      - receivable
      - credit_limit
      - limit_use
      - limit_share
      ladder:
      - when: receivable at 1.0 or more of the credit limit
        value: K('over_limit_share') = 0.75
      - when: 0.8 or more but below 1.0
        value: K('near_limit_share') = 0.9
      - when: otherwise
        value: K('clear_share') = 1
      baseline:
        limit_share: K('clear_share')
      evidence:
      - cross_category
      cross_difficulty: credit
    baseline:
      rule: As standard, the weekly draw of the converted item is its consumption billed over the last twelve months divided by 52. As standard, the storeroom cover is 2 weeks, no further cover weeks are added and the limit share is the whole, 1. The customer-owned fill-to level is the weekly draw times the cover in weeks, which is the storeroom cover plus every added cover week, times the limit share, taken to six decimal places and then rounded up to the next whole unit.
      params:
      - weeks_per_year
      - cover_standard_weeks
      - emergency_none_weeks
      - rush_none_weeks
      - plain_supply_weeks
      - clear_share
    inputs:
      history:
      - table: vmi_activity
        aggregate: sum
        field: quantity
        within_months: 12
        filters:
          event_type: vmi_consignment_consumed
      - table: vmi_activity
        aggregate: count
        field: vmi_activity_id
        within_months: 6
        filters:
          event_type: vmi_service_visit_completed
          visit_type: emergency
      - category: order
        table: order_lines
        aggregate: count
        field: order_line_id
        within_months: 6
        filters:
