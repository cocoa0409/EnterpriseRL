# ---- data flow ----
events:
  - type: vmi_program_enrolled
    target: vmi_programs
    mutation: create
    meaning: "The customer enrolls one ship-to in a StockSmart program at a service tier."
    grain: "One row per enrollment (one transaction)."
    fields: {customer_id: "Customer.", ship_to_id: "Ship-to served by the program.", variant_name: "Program tier.", program_number: "Program number (VMI-...).", enrolled_date: "Enrollment date."}
    triggers: []
  - type: vmi_program_went_live
    target: vmi_programs
    mutation: {transition: {from: enrolled, to: active}}
    meaning: "The program goes live."
    grain: "One row per go-live (one transaction)."
    fields: {go_live_date: "Go-live date (start of the minimum term)."}
    triggers: []
  - type: vmi_program_paused
    target: vmi_programs
    mutation: {transition: {from: active, to: paused}}
    meaning: "Service pauses for a plant shutdown or a credit hold."
    grain: "One row per pause (one transaction)."
    fields: {pause_start_date: "First paused day.", pause_end_date: "Last paused day planned (empty for a credit hold pause, which ends on release).", pause_reason: "Why the program is paused."}
    triggers: []
  - type: vmi_program_resumed
    target: vmi_programs
    mutation: {transition: {from: paused, to: active}}
    meaning: "Service resumes."
    grain: "One row per resumption (one transaction)."
    fields: {pause_end_date: "Last paused day actually taken.", pause_reason: "Reset to none."}
    triggers: []
  - type: vmi_termination_noticed
    target: vmi_programs
    mutation: {transition: [{from: active, to: terminating}, {from: paused, to: terminating}]}
    meaning: "The customer gives written notice to end the program."
    grain: "One row per termination notice (one transaction)."
    fields: {termination_notice_date: "Date the written notice was received."}
    triggers: []
  - type: vmi_program_closed
    target: vmi_programs
    mutation: {transition: [{from: terminating, to: closed}, {from: enrolled, to: closed}]}
    meaning: "The program ends."
    grain: "One row per closure (one transaction)."
    fields: {closed_date: "Closure date."}
    triggers: []
  - type: vmi_service_level_changed
    target: vmi_programs
    mutation: update
    meaning: "The program moves to another tier at its annual review or on request."
    grain: "One row per tier change (one transaction)."
    fields: {variant_name: "New tier."}
    triggers: []
  - type: vmi_pause_recorded
    target: vmi_activity
    meaning: "A program pause is recorded with its reason and dates."
    grain: "One row per pause."
    distinguish_by: [activity_reference]
    fields: {activity_reference: "Pause reference (VPA-...).", pause_start_date: "First paused day.", pause_end_date: "Last paused day planned; empty for a credit hold pause.", pause_reason: "Why the program pauses.", event_date: "Date the pause was recorded."}
    triggers:
      - event: vmi:vmi_program_paused
        map: {pause_start_date: pause_start_date, pause_end_date: pause_end_date, pause_reason: pause_reason}
  - type: vmi_service_visit_completed
    target: vmi_activity
    meaning: "A scheduled, emergency or onsite service visit is completed, or a self-scan order is received."
    grain: "One row per visit or self-scan order."
    distinguish_by: [activity_reference]
    fields: {activity_reference: "Visit or scan order reference (VV-... / VSO-...).", visit_type: "Kind of visit.", event_date: "Visit or scan date."}
    triggers: []
  - type: vmi_replenishment_delivered
    target: vmi_activity
    meaning: "A customer-owned bin is replenished to its max level."
    grain: "One row per bin replenished on one visit or scan order."
    distinguish_by: [activity_reference, bin_label]
    fields: {activity_reference: "Visit or scan order.", bin_label: "Bin label.", sku: "Item.", quantity: "Quantity delivered.", unit_price: "Billing unit price, USD.", extended_amount: "Quantity times unit price, USD.", critical_item: "Whether the bin is flagged critical.", event_date: "Delivery date."}
    triggers: []
  - type: vmi_replenishment_billed
    target: vmi_activity
    meaning: "The replenishment of one visit or scan order is billed."
    grain: "One row per visit or scan order billed."
    distinguish_by: [activity_reference]
    fields: {activity_reference: "Visit or scan order billed.", extended_amount: "Total of its replenishment lines, USD.", freight_amount: "Freight billed under replenishment_freight_basis, USD.", event_date: "Billing date (the delivery date)."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, freight_amount: freight_amount, source_type: vmi_replenishment, source_reference: activity_reference}
  - type: vmi_consignment_stocked
    target: vmi_activity
    meaning: "Corbett-owned consigned stock is placed in a consigned bin."
    grain: "One row per consigned bin stocked on one visit."
    distinguish_by: [activity_reference, bin_label]
    fields: {activity_reference: "Visit.", bin_label: "Bin.", sku: "Item.", quantity: "Quantity stocked.", unit_price: "Contract unit price, USD.", extended_amount: "Value stocked, USD.", event_date: "Stocking date."}
    account: consigned_stock
    direction: in
    triggers: []
  - type: vmi_consignment_consumed
    target: vmi_activity
    meaning: "Consigned stock issued from bins during a billing month passes to the customer."
    grain: "One row per item per billing month."
    distinguish_by: [billing_period, sku]
    fields: {billing_period: "Billing month YYYY-MM.", sku: "Item.", quantity: "Quantity issued.", unit_price: "Contract unit price on the issue dates, USD.", extended_amount: "Value issued, USD.", event_date: "Last day of the billing month."}
    account: consigned_stock
    direction: out
    triggers: []
  - type: vmi_shrink_billed
    target: vmi_activity
    meaning: "A cycle count shortage of consigned stock beyond tolerance is billed to the customer."
    grain: "One row per item short on one cycle count."
    distinguish_by: [activity_reference, sku]
    fields: {activity_reference: "Cycle count reference (VCC-...).", sku: "Item.", quantity: "Quantity short beyond tolerance.", unit_price: "Contract unit price, USD.", extended_amount: "Shrink billed, USD.", billing_period: "Billing month the shrink is billed in.", event_date: "Count date."}
    account: consigned_stock
    direction: out
    triggers: []
  - type: vmi_consignment_withdrawn
    target: vmi_activity
    meaning: "Consigned stock is taken back into Corbett inventory (bin removed, slow mover converted, program end)."
    grain: "One row per item withdrawn on one withdrawal."
    distinguish_by: [activity_reference, sku]
    fields: {activity_reference: "Withdrawal reference (VWD-...).", sku: "Item.", quantity: "Quantity withdrawn.", unit_price: "Contract unit price, USD.", extended_amount: "Value withdrawn, USD.", event_date: "Withdrawal date."}
    account: consigned_stock
    direction: out
    triggers: []
  - type: vmi_consumption_billed
    target: vmi_activity
    meaning: "One billing month of consigned consumption and shrink is billed."
    grain: "One row per program per billing month."
    distinguish_by: [billing_period]
    fields: {billing_period: "Billing month.", extended_amount: "Consumption plus shrink billed, USD.", event_date: "Last day of the billing month."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, source_type: vmi_replenishment, source_reference: billing_period}
  - type: vmi_program_fee_charged
    target: vmi_activity
    meaning: "A program fee is charged: monthly minimum, onsite management, additional bins, setup, emergency visit, trip charge, bin add, par change, bin replacement or early exit."
    grain: "One row per monthly fee per billing month, or per occurrence for event fees."
    distinguish_by: [fee_type, billing_period, activity_reference]
    fields: {fee_type: "Kind of fee.", billing_period: "Billing month the fee belongs to.", activity_reference: "Visit, request or change reference for event fees; the billing month for monthly fees.", quantity: "Count the fee is computed on (bins, changes, visits), 1 for flat fees.", extended_amount: "Fee amount, USD.", event_date: "Fee date."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, source_type: vmi_program_fee, source_reference: activity_reference}
  - type: vmi_buyback_billed
    target: vmi_activity
    meaning: "Special stock held for the program is sold to the customer when the program ends."
    grain: "One row per program end."
    distinguish_by: [activity_reference]
    fields: {activity_reference: "Buyback reference (VBB-...).", quantity: "Units bought back.", extended_amount: "Buyback total at buyback_basis, USD.", event_date: "Buyback date."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, source_type: vmi_buyback, source_reference: activity_reference}
  - type: vmi_bin_set
    target: vmi_bins
    meaning: "A bin is added or its par levels changed."
    grain: "One row per bin added or par change."
    distinguish_by: [bin_label, event_date, change_type]
    fields: {bin_label: "Bin label.", sku: "Item.", special_stock: "Whether the item is non-catalog special stock.", critical_item: "Whether the bin is flagged critical.", consigned: "Whether the bin holds consigned stock.", min_qty: "Reorder point.", max_qty: "Fill-to level.", change_type: "New bin or par change.", change_reference: "Request reference.", event_date: "Effective date."}
    triggers: []
  - type: vmi_bin_removed
    target: vmi_bins
    meaning: "A bin is removed from the program."
    grain: "One row per bin removal."
    distinguish_by: [bin_label, event_date]
    fields: {bin_label: "Bin label.", sku: "Item.", removal_reason: "Why removed.", change_reference: "Request reference.", event_date: "Removal date."}
    triggers: []

# ---- derived measures ----
measures:
  - id: vmi_msr_month_program_spend
    window: "One calendar month (billing_period), prorated under pause_minimum_waived."
    measure: "Sum, USD, of extended_amount of vmi_replenishment_billed rows dated in the month and vmi_consumption_billed rows for the month; fees, freight and buyback are excluded."
  - id: vmi_msr_emergency_visits_quarter
    window: "The calendar quarter of the visit, up to and including the visit being charged."
    measure: "Count of vmi_service_visit_completed rows with visit_type emergency, in date then reference order."
  - id: vmi_msr_bin_changes_month
    window: "The calendar month of the change, up to and including the change being charged."
    measure: "Count of vmi_bin_set rows of the change_type being charged (new_bin or par_change) with event_date in the month, in date then reference order."
  - id: vmi_msr_active_bins
    window: "Point in time: the last day of the billing month."
    measure: "Count of distinct bin_label whose latest vmi_bins row is vmi_bin_set."
  - id: vmi_msr_shutdown_pauses_12m
    window: "Rolling 12 calendar months ending on the date of the new pause request."
    measure: "Count of vmi_pause_recorded rows with pause_reason plant_shutdown and event_date in the window."

# ---- policies ----
policies:
  - id: vmi_agg_multi_holding
    subject: [vmi_program_enrolled]
    rule: >-
      A customer may hold any number of StockSmart programs, but a ship-to is served by at most one program.
      A ship-to is not enrolled while it already has a program whose status is enrolled, active, paused or terminating.
    eligibility:
      - id: one_program_per_ship_to
        applies_to: [vmi_program_enrolled]
        kind: dedup
        condition: "A ship-to is not enrolled while it already has a program whose status is enrolled, active, paused or terminating."
        evidence_fields: [vmi_programs.ship_to_id, vmi_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vmi_programs.ship_to_id]]
          action_bindings: {vmi_programs.ship_to_id: ship_to_id}
        dedup_contract:
          table: vmi_programs
          mode: separate_record
          object_bindings: {ship_to_id: ship_to_id}
          duplicate_filters: {status: [enrolled, active, paused, terminating]}
          distinct_fields: []
    params: {max_per_customer: null}

  - id: vmi_agg_program_portfolio
    subject: [vmi_program_enrolled, vmi_program_fee_charged, vmi_service_level_changed]
    rule: >-
      Each program is measured on its own: the monthly minimum, included bins, included changes, emergency visits and fees apply per program and are never pooled across a customer's programs.
      Program spend does not count toward the served ship-to's order minimum, free freight threshold or service level spend, and order spend at the ship-to does not count toward the program minimum.
      A program's tier entry gate is measured on the program's own trailing 12 month program spend and its own bin count.
    eligibility: []

  - id: vmi_enrollment
    subject: [vmi_program_enrolled, vmi_program_went_live]
    rule: >-
      A program is enrolled only for a ship-to whose status is active.
      A program is enrolled only for a customer whose Commercial Credit Account status is active.
      The tier is the one requested when its entry gate (annual program spend and bin count) is met, otherwise the highest tier met; the program goes live within go_live_business_days business days and its minimum term starts on the go-live date.
      A tier with a setup_fee_usd above 0.00 bills it once at go-live; Corbett supplies bin_hardware_provided at no charge.
      The customer may cancel an enrollment before go-live with no charge.
    eligibility:
      - id: served_ship_to_active
        applies_to: [vmi_program_enrolled]
        kind: state
        condition: "A program is enrolled only for a ship-to whose status is active."
        evidence_fields: [ship_to_accounts.status, ship_to_accounts.ship_to_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ship_to_accounts.ship_to_id]]
          action_bindings: {ship_to_accounts.ship_to_id: ship_to_id}
        state_contract:
          field: ship_to_accounts.status
          allowed: [active]
      - id: credit_active_for_enrollment
        applies_to: [vmi_program_enrolled]
        kind: state
        condition: "A program is enrolled only for a customer whose Commercial Credit Account status is active."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: vmi_evt_replenishment
    subject: [vmi_service_visit_completed, vmi_replenishment_delivered, vmi_replenishment_billed]
    rule: >-
      Replenishment is delivered only on a program whose status is active or terminating.
      Replenishment is delivered only while the customer's Commercial Credit Account status is active or on_hold, and while it is on_hold only on a tier whose credit_hold_service_rule is critical_items_only, only for bins flagged critical, and only up to critical_item_replenishment_cap_usd per visit (bins are filled in bin label order until the next bin would exceed the cap); on a tier whose rule is suspend the program is paused with pause_reason credit_hold until the hold is released.
      Every bin at or below its min level at a visit or self-scan is filled to its max level under auto_replenish_to; each item is billed at the price pricing_price_basis gives for the delivery date under replenishment_pricing_basis.
      The replenishment of one visit or self-scan order is billed on one invoice under replenishment_invoice_grouping; where replenishment_freight_basis is ship_to_freight_terms the scan order is treated as an order of the served ship-to for standard freight under order_evt_freight_and_fees, and where it is included no freight is billed.
      Bins are counted under scan_method; the Onsite Storeroom is staffed onsite_hours_per_week hours a week; an emergency visit is made within emergency_response_hours hours of the request.
      Scheduled visits follow service_visits_per_month; deliveries reach the bins within replenishment_lead_business_days business days of the scan or visit.
    eligibility:
      - id: program_serviceable
        applies_to: [vmi_replenishment_delivered]
        kind: state
        condition: "Replenishment is delivered only on a program whose status is active or terminating."
        evidence_fields: [vmi_programs.status, vmi_programs.vmi_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vmi_programs.vmi_program_id]]
          action_bindings: {vmi_programs.vmi_program_id: vmi_program_id}
        state_contract:
          field: vmi_programs.status
          allowed: [active, terminating]
      - id: credit_status_allows_replenishment
        applies_to: [vmi_replenishment_delivered]
        kind: state
        condition: "Replenishment is delivered only while the customer's Commercial Credit Account status is active or on_hold"
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active, on_hold]

  - id: vmi_evt_consignment
    subject: [vmi_consignment_stocked, vmi_consignment_consumed, vmi_shrink_billed, vmi_consignment_withdrawn, vmi_consumption_billed]
    rule: >-
      Consigned bins are allowed only on a tier whose consignment_available is true, and consigned stock is placed only while the program's consigned stock value stays at or below consigned_value_cap_usd.
      Title to consigned stock passes to the customer under consigned_title_transfer when it is issued from the bin; issues during a calendar month are billed at the contract unit price in effect on the issue dates under consignment_billing_cycle, on one invoice dated the last day of the month together with that month's shrink.
      Each program is billed at most once for a billing month's consumption.
      At each cycle count, every cycle_count_frequency_months months, a shortage of consigned stock is absorbed by Corbett up to shrink_tolerance_pct percent of the consigned value counted; the shortage value above the tolerance is billed at shrink_billing_basis, allocated to the short items in descending order of their shortage value.
      At each par review a consigned item turning fewer than consignment_min_annual_turns times a year is withdrawn and converted to customer-owned replenishment; when a consigned bin is removed or the program ends, the stock still in it is withdrawn at no charge.
    eligibility:
      - id: one_consumption_bill_per_month
        applies_to: [vmi_consumption_billed]
        kind: dedup
        condition: "Each program is billed at most once for a billing month's consumption."
        evidence_fields: [vmi_activity.vmi_program_id, vmi_activity.billing_period, vmi_activity.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vmi_activity.vmi_program_id, vmi_activity.billing_period]]
          action_bindings: {vmi_activity.vmi_program_id: vmi_program_id, vmi_activity.billing_period: billing_period}
        dedup_contract:
          table: vmi_activity
          mode: separate_record
          object_bindings: {vmi_program_id: vmi_program_id, billing_period: billing_period}
          duplicate_filters: {event_type: [vmi_consumption_billed]}
          distinct_fields: [billing_period]

  - id: vmi_evt_program_fees
    subject: [vmi_program_fee_charged]
    rule: >-
      Program spend is measured on min_spend_measurement_basis. A monthly minimum fee of monthly_minimum_fee_usd is charged for a calendar month whose vmi_msr_month_program_spend is below min_monthly_program_spend_usd; where pause_minimum_waived is true both the minimum and the fee are prorated by the share of the month's calendar days the program was not paused, rounded half up to the cent, and a month paused throughout carries no fee.
      The Onsite Storeroom tier is charged onsite_management_fee_usd every month, prorated the same way for paused days.
      Bins above included_bins_max at month end, counted by vmi_msr_active_bins, are charged additional_bin_fee_usd each for that month.
      Each monthly fee type is charged at most once per program per billing month.
      An emergency visit beyond emergency_visits_included_per_quarter in the calendar quarter, counted by vmi_msr_emergency_visits_quarter, carries emergency_visit_fee_usd; a scheduled visit the customer cancels with less than visit_cancellation_notice_hours hours of notice, or refuses at the gate, carries trip_charge_usd.
      A new bin beyond bin_adds_included_per_month and a par change beyond par_changes_included_per_month in the calendar month, counted by vmi_msr_bin_changes_month, carry bin_add_fee_usd and par_change_fee_usd respectively; a bin or label replaced because of customer damage carries bin_replacement_fee_usd.
      A program closing before min_term_months calendar months after its go-live date carries early_exit_fee_usd once; a fee whose tier amount is 0.00 is never charged.
    eligibility:
      - id: one_monthly_fee_per_type
        applies_to: [vmi_program_fee_charged]
        kind: dedup
        condition: "Each monthly fee type is charged at most once per program per billing month."
        evidence_fields: [vmi_activity.vmi_program_id, vmi_activity.fee_type, vmi_activity.billing_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vmi_activity.vmi_program_id, vmi_activity.fee_type, vmi_activity.billing_period]]
          action_bindings: {vmi_activity.vmi_program_id: vmi_program_id, vmi_activity.fee_type: fee_type, vmi_activity.billing_period: billing_period}
        dedup_contract:
          table: vmi_activity
          mode: separate_record
          object_bindings: {vmi_program_id: vmi_program_id, fee_type: fee_type, billing_period: billing_period}
          duplicate_filters: {event_type: [vmi_program_fee_charged], fee_type: [monthly_minimum_fee, onsite_management_fee, additional_bin_fee]}
          distinct_fields: [activity_reference]
    measures: [vmi_msr_month_program_spend, vmi_msr_emergency_visits_quarter, vmi_msr_bin_changes_month, vmi_msr_active_bins]
    params:
      per_tier:
        StockSmart Self-Scan: {minimum: "=min_monthly_program_spend_usd", fee: "=monthly_minimum_fee_usd"}
        StockSmart Monthly Service: {minimum: "=min_monthly_program_spend_usd", fee: "=monthly_minimum_fee_usd"}
        StockSmart Biweekly Service: {minimum: "=min_monthly_program_spend_usd", fee: "=monthly_minimum_fee_usd"}
        StockSmart Weekly Service: {minimum: "=min_monthly_program_spend_usd", fee: "=monthly_minimum_fee_usd"}
        StockSmart Twice-Weekly Service: {minimum: "=min_monthly_program_spend_usd", fee: "=monthly_minimum_fee_usd"}
        StockSmart Onsite Storeroom: {minimum: "=min_monthly_program_spend_usd", fee: "=monthly_minimum_fee_usd"}
    formula:
      additional_bin_fee: "max(vmi_msr_active_bins - included_bins_max, 0) * additional_bin_fee_usd"

  - id: vmi_bins_and_par
    subject: [vmi_bin_set, vmi_bin_removed]
    rule: >-
      The customer may ask to add bins, change par levels or remove bins at any time on an active program; changes take effect from the next visit or scan.
      A bin holds special (non-catalog) stock only while the program's special stock items stay within special_stock_sku_cap; special stock is subject to buyback when the program ends.
      At each par review, every par_level_review_months months, Corbett removes bins with no replenishment or consumption for non_moving_bin_removal_months months, with removal_reason non_moving.
      A bin is flagged critical only at the customer's written request; critical flags matter only under a credit hold.
    eligibility: []

  - id: vmi_pause_and_resume
    subject: [vmi_pause_recorded, vmi_program_paused, vmi_program_resumed]
    rule: >-
      A customer may pause an active program for a plant shutdown; a plant shutdown pause is recorded only when vmi_msr_shutdown_pauses_12m is below pauses_per_year.
      A program paused for a plant shutdown resumes no later than pause_max_days calendar days after the first paused day.
      Count calendar days with the first paused day as day 1; the program resumes on or before the day after the last allowed paused day, and a longer shutdown requires a termination or an approved exception outside this charter.
      A program on a tier whose credit_hold_service_rule is suspend is paused with pause_reason credit_hold while the customer's Commercial Credit Account is on hold, and resumes on the day the hold is released; credit hold pauses do not count toward pauses_per_year.
      No visits, replenishment or consumption billing occur on paused days, and fees follow vmi_evt_program_fees.
    eligibility:
      - id: shutdown_pause_quota
        applies_to: [vmi_pause_recorded]
        kind: authorization
        condition: "a plant shutdown pause is recorded only when vmi_msr_shutdown_pauses_12m is below pauses_per_year"
        evidence_fields: [vmi_activity.event_type, vmi_activity.pause_reason, vmi_activity.event_date, vmi_activity.vmi_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vmi_activity.vmi_program_id]]
          action_bindings: {vmi_activity.vmi_program_id: vmi_program_id}
      - id: shutdown_pause_length
        applies_to: [vmi_program_resumed]
        kind: time
        condition: "A program paused for a plant shutdown resumes no later than pause_max_days calendar days after the first paused day."
        evidence_fields: [vmi_programs.pause_start_date, vmi_programs.vmi_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vmi_programs.vmi_program_id]]
          action_bindings: {vmi_programs.vmi_program_id: vmi_program_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the first paused day"
          anchor_source: vmi_programs.pause_start_date
          relation: not_after
          duration_source: variants.pause_max_days
          unit: calendar_days
          counting_rule: "Count calendar days with the first paused day as day 1; the program resumes on or before the day after the last allowed paused day, and a longer shutdown requires a termination or an approved exception outside this charter."
          boundary: inclusive
    measures: [vmi_msr_shutdown_pauses_12m]

  - id: vmi_termination_and_buyback
    subject: [vmi_termination_noticed, vmi_program_closed, vmi_buyback_billed]
    rule: >-
      Ending a program is the customer's own act by written notice; service continues during the notice period.
      A terminating program closes no earlier than termination_notice_days calendar days after the date the written termination notice is received.
      Count calendar days starting the day after the notice is received; the program closes on the last day of the notice period or a later date the notice names.
      On closure all bins are removed with removal_reason program_end, consigned stock is withdrawn at no charge, and, where buyback_required_special_stock is true, all special stock Corbett holds for the program is billed once at buyback_basis on one buyback invoice; catalog stock is never bought back.
      The early exit fee applies under vmi_evt_program_fees when closure falls before the end of the minimum term; a customer may withdraw a termination notice before the closing date only by enrolling again, which is outside this charter.
    eligibility:
      - id: notice_period_served
        applies_to: [vmi_program_closed]
        kind: time
        condition: "A terminating program closes no earlier than termination_notice_days calendar days after the date the written termination notice is received."
        evidence_fields: [vmi_programs.termination_notice_date, vmi_programs.vmi_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vmi_programs.vmi_program_id]]
          action_bindings: {vmi_programs.vmi_program_id: vmi_program_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the written termination notice is received"
          anchor_source: vmi_programs.termination_notice_date
          relation: not_before
          duration_source: variants.termination_notice_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the notice is received; the program closes on the last day of the notice period or a later date the notice names."
          boundary: inclusive

  - id: vmi_service_level_review
    subject: [vmi_service_level_changed]
    rule: >-
      At each anniversary of go-live the program's trailing 12 month program spend and bin count are compared with its tier's entry gate; a program meeting a higher tier's gate may move up at the customer's request, and a program below its own tier's gate moves down to the highest tier whose gate it meets, never below StockSmart Self-Scan.
      A tier change takes effect on the first day of the next calendar month and does not restart the minimum term.
    eligibility: []

# ---- extended policies (d4_stocksmart_replenishment_and_program_billing) ----
extended_policies:
  - id: vmi_ext_vended_item_fill_level
    base_policy_refs:
    - vmi_bins_and_par
    - vmi_evt_consignment
    overwrite: []
    trigger: on_request
    subject:
    - vmi_bin_set
    computes: max_qty
    target_tool: submit_vended_item_bin_request_0334ff8e
    params:
      rising_ratio: 1.25
      falling_ratio: 0.75
      months_per_year: 12
      weeks_per_year: 52
      window_months: 3
      standard_window_weeks: 13
      daily_visits_min: 20
      daily_done_min: 18
      regular_visits_min: 8
      regular_done_min: 6
      cover_daily_weeks: 0.5
      cover_regular_weeks: 1.0
      cover_standard_weeks: 2.0
      route_none_weeks: 1.0
      route_light_weeks: 0.5
      route_full_weeks: 0.0
      route_light_max: 2
      safety_high_weeks: 1.0
      safety_low_weeks: 0.5
      safety_none_weeks: 0.0
      safety_high_min: 2
      abc_a_min_usd: 5000.0
      abc_b_min_usd: 1000.0
      abc_a_share: 0.75
      abc_b_share: 0.9
      abc_c_share: 1.0
      exposure_two_share: 0.6
      exposure_one_share: 0.8
      exposure_none_share: 1.0
      exposure_two_min: 2
      half: 0.5
      recent_weight: 3
      middle_weight: 2
      weight_total: 6
      route_unrecorded_per_week: 7
    rule: 'A customer''s own written request for a new consigned bin that takes over an item the customer has had taken out of one of its VendPoint machines carries the fill-to level this schedule sets for that bin, and such a bin is consigned only on a program whose tier allows consigned bins; on any other tier no fill-to level is set under this schedule. The transferred item is the item of the customer''s most recent VendPoint selection removal made at the customer''s request, and the demand machine is the machine it was removed from; where two or more such removals carry that most recent effective date, or the customer has none, no fill-to level is set under this schedule. Net vends of the transferred item are the units of it vended at the demand machine less the units of it returned to that machine and the units of it credited there as vend errors; vends, returns and credits at any other machine are not counted, and an item with none of them has net vends of zero. A row''s age in whole
      months is the number of calendar months from its date to today, less one when today''s day of the month is earlier than the row''s day of the month; the latest month holds rows of age zero, the middle month rows of age one and the earliest month rows of age two, and a window of the last three or the last twelve months holds rows of age below three or below twelve. As standard, the weekly usage of the transferred item is its net vends of the last three months divided by 13. As standard, the restock cover is 2 weeks, no cover weeks are added to it, and the carried share is the whole, 1. The fill-to level is the weekly usage times the cover in weeks, which is the restock cover plus every added cover week, times the carried share, which is the product of every share that applies, taken to six decimal places and then rounded up to the next whole unit, never below zero. Where the transferred item''s net vends of the latest month exceed 1.25 times one third of its net vends of the last three
      months, its weekly usage is projected forward: its net vends of the latest month are first increased by half of the rise from the earliest month to the latest month, and that projected month is then multiplied by 12 and divided by 52; where its net vends of the latest month are below 0.75 times one third of its net vends of the last three months, its weekly usage is a weighted month: three times the latest month, twice the middle month and the earliest month are added together and the sum is divided by 6, and that weighted month is then multiplied by 12 and divided by 52; any other transferred item takes the standard weekly usage. The restock cover follows the program''s visits: a program whose tier schedules 20 or more visits a month and that completed 18 or more scheduled or onsite daily visits in the latest month takes a restock cover of 0.5 week; a program whose tier schedules 8 to 19 visits a month and that completed 6 or more such visits in the latest month takes 1 week; any other
      program takes the standard 2 weeks. The program''s ship-to adds cover weeks for the route truck deliveries its service level schedules each week: a ship-to with no route deliveries adds 1 week, a ship-to with 1 or 2 route deliveries a week adds 0.5 week, and a ship-to with 3 or more adds none; a ship-to whose service level is not on record adds none. Emergency restocks of the transferred item at the demand machine in the last three months add safety cover weeks: 2 or more add 1 week, exactly 1 adds 0.5 week, and none adds none. The transferred item''s annual usage value is its net vends of the last twelve months times its vend price, the highest unit price among its vends at the demand machine dated on its most recent vend date there, and zero where it has no vend there; an annual usage value of 5,000.00 USD or more puts a value-class share of 0.75 into the carried share, a value of 1,000.00 USD or more but below 5,000.00 USD puts 0.9, and a lower value puts 1. The customer''s returned
      payments with a transaction date in the last twelve months put a payment-record share into the carried share: 2 or more returned payments put 0.6, exactly 1 puts 0.8, and none puts 1.'
    prerequisite: []
    cross_category:
    - category: vending
      as: history
      reads:
      - vending_planogram.sku
      - vending_planogram.event_date
      - vending_planogram.vending_machine_id
      - vending_transactions.quantity
      - vending_transactions.unit_price
      note: usage_trend, vend_safety and abc_share read the transferred item ledger at the demand machine
    - category: order
