    factors:
    - id: trial_level
      effect: method
      decides: opening_target
      bindings:
      - vends_all
      - vends_3m
      - vends_6m
      - opening_target
      ladder:
      - when: every vend of the item at the demand machine is of age below three months (or there is none)
        method: opening level = the bin's reorder point
      - when: every such vend is below six months and at least one is three months old or older
        method: opening level = half of reorder point plus fill-to level
      - when: otherwise (a vend six months old or older)
        method: opening level = the bin's fill-to level
      baseline:
        opening_target: fill_to
      evidence:
      - cross_category
      - history
      - date
      cross_difficulty: vending
    - id: credit_room
      effect: parameter
      decides: credit_share
      bindings:
      - receivable
      - credit_limit
      - credit_use
      - credit_share
      ladder:
      - when: receivable balance at 0.9 or more of the credit limit
        value: K('credit_tight_share') = 0.7
      - when: 0.75 or more but below 0.9
        value: K('credit_busy_share') = 0.85
      - when: otherwise
        value: K('credit_clear_share') = 1
      baseline:
        credit_share: K('credit_clear_share')
      evidence:
      - cross_category
      cross_difficulty: credit
    - id: supply_check
      effect: parameter
      decides: supply_share
      bindings:
      - backorders
      - backorders_closed
      - supply_share
      ladder:
      - when: more backorders of the item opened at the ship-to in the last three months than filled or cancelled
        value: K('supply_open_share') = 0.6
      - when: some opened and as many or more filled or cancelled
        value: K('supply_recent_share') = 0.9
      - when: otherwise (none opened)
        value: K('supply_clear_share') = 1
      baseline:
        supply_share: K('supply_clear_share')
      evidence:
      - cross_category
      - history
      cross_difficulty: order
    - id: site_age
      effect: parameter
      decides: site_share
      bindings:
      - site_opened
      - site_months
      - site_share
      ladder:
      - when: ship-to opened less than 6 whole months ago
        value: K('site_young_share') = 0.7
      - when: opened 6 to 11 whole months ago
        value: K('site_settling_share') = 0.9
      - when: otherwise (12 or more)
        value: K('site_settled_share') = 1
      baseline:
        site_share: K('site_settled_share')
      evidence:
      - cross_category
      - date
      cross_difficulty: order
    - id: return_rate
      effect: parameter
      decides: return_share
      bindings:
