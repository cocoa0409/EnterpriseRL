      carried_share: The fill-to level is the weekly usage times the cover in weeks, which is the restock cover plus every added cover week, times the carried share, which is the product of every share that applies, taken to six decimal places and then rounded up to the next whole unit, never below zero.
      raw_level: The fill-to level is the weekly usage times the cover in weeks, which is the restock cover plus every added cover week, times the carried share, which is the product of every share that applies, taken to six decimal places and then rounded up to the next whole unit, never below zero.
      result: A customer's own written request for a new consigned bin that takes over an item the customer has had taken out of one of its VendPoint machines carries the fill-to level this schedule sets for that bin, and such a bin is consigned only on a program whose tier allows consigned bins; on any other tier no fill-to level is set under this schedule.
    factors:
    - id: usage_trend
      effect: method
      decides: weekly_usage
      bindings:
      - net_1m
      - net_2m
      - month_latest
      - month_middle
      - month_earliest
      - weekly_usage
      ladder:
      - when: latest-month net vends above 1.25 times one third of the last three months' net vends (rising)
        method: weekly usage = (latest month + half of (latest month - earliest month)) x 12 / 52, a forward projection
      - when: latest-month net vends below 0.75 times one third of the last three months' net vends (falling)
        method: weekly usage = (3 x latest + 2 x middle + earliest month) / 6 x 12 / 52, a recency-weighted month
      - when: otherwise
        method: weekly usage = net vends of the last three months / 13, the plain average
      baseline:
        weekly_usage: net_3m / K('standard_window_weeks')
      evidence:
      - history
      - cross_category
      cross_difficulty: vending
    - id: restock_cover
      effect: parameter
      decides: restock_cover
      bindings:
      - visits_done
      - restock_cover
      ladder:
      - when: tier schedules 20 or more visits a month and 18 or more scheduled or onsite daily visits were completed in the latest month
        value: K('cover_daily_weeks') = 0.5 week
      - when: tier schedules 8 to 19 visits a month and 6 or more scheduled or onsite daily visits were completed in the latest month
        value: K('cover_regular_weeks') = 1 week
      - when: otherwise
        value: K('cover_standard_weeks') = 2 weeks
      baseline:
        restock_cover: K('cover_standard_weeks')
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: route_cover
      effect: parameter
      decides: route_cover
      bindings:
      - route_days
      - route_cover
      ladder:
      - when: ship-to service level schedules no route deliveries
        value: K('route_none_weeks') = 1 week added
      - when: ship-to service level schedules 1 or 2 route deliveries a week
        value: K('route_light_weeks') = 0.5 week added
      - when: otherwise (3 or more route deliveries a week)
        value: K('route_full_weeks') = none added
      baseline:
        route_cover: K('route_full_weeks')
      evidence:
      - cross_category
      - tier_param
      cross_difficulty: order
    - id: vend_safety
      effect: parameter
      decides: safety_weeks
      bindings:
      - emergency_restocks
      - safety_weeks
      ladder:
      - when: 2 or more emergency restocks of the item at the demand machine in the last three months
        value: K('safety_high_weeks') = 1 week added
      - when: exactly 1 such emergency restock
        value: K('safety_low_weeks') = 0.5 week added
      - when: otherwise (none)
        value: K('safety_none_weeks') = none added
      baseline:
        safety_weeks: K('safety_none_weeks')
      evidence:
      - cross_category
      - history
      cross_difficulty: vending
    - id: abc_share
      effect: parameter
      decides: abc_share
      bindings:
      - net_12m
      - vend_price_date
      - vend_price
      - annual_value
      - abc_share
      ladder:
      - when: annual usage value 5,000.00 USD or more
        value: K('abc_a_share') = 0.75
      - when: annual usage value 1,000.00 USD or more and below 5,000.00 USD
        value: K('abc_b_share') = 0.9
      - when: otherwise (below 1,000.00 USD)
        value: K('abc_c_share') = 1
      baseline:
        abc_share: K('abc_c_share')
      evidence:
      - cross_category
      - history
      cross_difficulty: vending
    - id: payment_exposure
      effect: parameter
      decides: exposure_share
      bindings:
      - returned_payments
      - exposure_share
      ladder:
      - when: 2 or more returned payments dated in the last twelve months
        value: K('exposure_two_share') = 0.6
      - when: exactly 1 returned payment dated in the last twelve months
        value: K('exposure_one_share') = 0.8
      - when: otherwise (none)
        value: K('exposure_none_share') = 1
      baseline:
        exposure_share: K('exposure_none_share')
      evidence:
      - cross_category
      - history
      cross_difficulty: credit
    baseline:
      rule: As standard, the weekly usage of the transferred item is its net vends of the last three months divided by 13. As standard, the restock cover is 2 weeks, no cover weeks are added to it, and the carried share is the whole, 1. The fill-to level is the weekly usage times the cover in weeks, which is the restock cover plus every added cover week, times the carried share, which is the product of every share that applies, taken to six decimal places and then rounded up to the next whole unit, never below zero.
      params:
      - standard_window_weeks
      - cover_standard_weeks
      - route_full_weeks
      - safety_none_weeks
      - abc_c_share
      - exposure_none_share
    inputs:
      history:
      - category: vending
        table: vending_transactions
        aggregate: sum
        field: quantity
        within_months: 3
        filters:
          event_type: vending_item_issued
      - category: vending
        table: vending_transactions
        aggregate: count
        field: vending_txn_id
        within_months: 3
        filters:
          event_type: vending_restocked
          visit_type: emergency
      - table: vmi_activity
        aggregate: count
        field: vmi_activity_id
        within_months: 1
        filters:
          event_type: vmi_service_visit_completed
          visit_type: scheduled
      - category: credit
        table: credit_transactions
        aggregate: count
        field: credit_txn_id
        within_months: 12
        filters:
          event_type: credit_payment_returned
      cross_category:
      - vending
      - order
      - credit
  - id: vmi_ext_consigned_reorder_point
    base_policy_refs:
    - vmi_bins_and_par
    - vmi_evt_consignment
    overwrite: []
    trigger: state_due
    subject:
    - vmi_bin_set
    computes: min_qty
    target_tool: record_consigned_reorder_point_33b5bdc5
    params:
      window_months: 3
      window_days: 91
      month_days: 30
      open_bo_days: 3
      closed_bo_days: 1
      no_bo_days: 0
      exp_high_days: 1
      exp_low_days: 0.5
      exp_none_days: 0
      exp_high_min: 2
      route_none_days: 2
      route_light_days: 1
      route_full_days: 0
      route_light_max: 2
      buffer_large_units: 2
      buffer_small_units: 1
      buffer_none_units: 0
      buffer_large_min: 4
      buffer_small_min: 2
      special_days: 4
      nonstock_days: 2
      catalog_days: 0
      no_visit_gap_days: 7
      volatile_ratio: 1.4
      uneven_ratio: 1.15
      half: 0.5
      months_in_window: 3
      route_unrecorded_per_week: 7
    rule: 'When a customer''s written request for a new consigned bin that takes over an item taken out of one of its VendPoint machines stands on a program, Corbett records that bin''s reorder point under this schedule as a par level entry that keeps the bin consigned and keeps its item, its flags and its fill-to level. Corbett''s reorder point for such a bin is recorded only after the customer''s new-bin entry for it, flagged consigned, stands in the program''s bin history. The bin is the consigned bin with the most recent new-bin entry on the program and its item is the transferred item; where two or more consigned new-bin entries carry that most recent effective date, or there is none, no reorder point is set under this schedule. The demand machine is the machine of the customer''s most recent VendPoint selection removal of the transferred item made at the customer''s request, and net vends are the units of the item vended there less the units returned to it and the units credited there
      as vend errors; where two or more such removals of the item carry that most recent date, or there is none, no reorder point is set under this schedule. A row''s age in whole months is the number of calendar months from its date to today, less one when today''s day of the month is earlier than the row''s day of the month; the latest, middle and earliest month hold rows of age zero, one and two, and a window of the last three or the last six months holds rows of age below three or below six. As standard, the daily usage is the net vends of the last three months divided by 91. As standard, the visit gap is 30 days divided by the visits the program''s tier schedules a month (7 days for a tier scheduling none), the lead days are the tier''s replenishment lead business days counted as days, no allowance days are added and no draw buffer is added. The reorder point is the daily usage times the reorder days, which are the visit gap plus the lead days plus every allowance day added, taken to
      six decimal places and rounded up to the next whole unit, never below zero, plus the draw buffer in units. Where the transferred item had net vends in each of the latest, middle and earliest month and its highest of those months is 1.4 times its lowest or more, its daily usage is its highest month divided by 30; where it had net vends in each of those months and its highest month is 1.15 times its lowest or more but less than 1.4 times, its daily usage is a blend: its highest month and one third of its net vends of the last three months are added together, the sum is halved, and the result is divided by 30; any other transferred item, including one with a month without net vends, takes the standard daily usage. Backorders of the transferred item opened at the program''s ship-to in the last three months add allowance days: where more were opened than were filled or cancelled in those months, 3 days; where some were opened and as many or more were filled or cancelled in those months, 1
      day; where none was opened, none. Next-day-air bookings of the transferred item at the program''s ship-to in the last six months add allowance days: 2 or more add 1 day, exactly 1 adds 0.5 day, and none adds none. The route truck deliveries the service level of the program''s ship-to schedules each week add allowance days to the reorder point: no route deliveries add 2 days, 1 or 2 a week add 1 day, and 3 or more add none; a ship-to whose service level is not on record adds none. The largest single vend of the transferred item ever recorded at the demand machine sets the draw buffer: a largest vend of 4 units or more adds 2 units, a largest vend of 2 or 3 units adds 1 unit, and any smaller largest vend, or none at all, adds none. The supply of the transferred item adds allowance days: an item that any VendPoint selection-setting entry of the customer flags as a special item adds 4 days; an item never so flagged that the program''s ship-to has booked as a non-stock special order adds
      2 days; any other item adds none.'
    prerequisite:
    - problem: vmi_ext_vended_item_fill_level
      kind: value_input
      gate: new_item
      form: state
      policy_source: Corbett's reorder point for such a bin is recorded only after the customer's new-bin entry for it, flagged consigned, stands in the program's bin history.
      condition: the program's bin history carries a vmi_bin_set new_bin entry flagged consigned for the transferred item, written on the customer's own request
      resolved_by: submit_vended_item_bin_request_0334ff8e
      effect: the new consigned bin becomes the most recent consigned new-bin entry, so the item, the demand machine and every allowance are read for the transferred item; without it no bin is found and no reorder point is set
    cross_category:
    - category: vending
      as: history
      reads:
      - vending_planogram.vending_machine_id
      - vending_planogram.special_item
      - vending_transactions.quantity
      note: net vends, the draw buffer and the special-item flag of the transferred item
    - category: order
      as: history
      reads:
      - order_lines.event_type
      - order_lines.ship_method
      - order_lines.stock_status
      - route_deliveries_per_week
      note: backorder, rush and special-order history of the item at the ship-to and its route deliveries
    compute:
    - new_item: LATEST('vmi_bins','sku', event_type='vmi_bin_set', change_type='new_bin', consigned=True)
    - new_set_date: LATEST('vmi_bins','event_date', event_type='vmi_bin_set', change_type='new_bin', consigned=True)
    - same_day_new: COUNT('vmi_bins', event_type='vmi_bin_set', change_type='new_bin', consigned=True, event_date=new_set_date)
    - removal_machine: XLATEST('vending','vending_planogram','vending_machine_id', event_type='vending_selection_removed', change_source='customer', sku=new_item)
    - removal_on: XLATEST('vending','vending_planogram','event_date', event_type='vending_selection_removed', change_source='customer', sku=new_item)
    - same_day_item_removals: XCOUNT('vending','vending_planogram', event_type='vending_selection_removed', change_source='customer', sku=new_item, event_date=removal_on)
    - net_1m: XSUM('vending','vending_transactions','quantity', within_months=1, event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=1, event_type='vending_item_returned', sku=new_item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=1, event_type='vending_vend_error_credited', sku=new_item, vending_machine_id=removal_machine)
    - net_2m: XSUM('vending','vending_transactions','quantity', within_months=2, event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=2, event_type='vending_item_returned', sku=new_item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=2, event_type='vending_vend_error_credited', sku=new_item, vending_machine_id=removal_machine)
    - net_3m: XSUM('vending','vending_transactions','quantity', within_months=3, event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=3, event_type='vending_item_returned', sku=new_item, vending_machine_id=removal_machine) - XSUM('vending','vending_transactions','quantity', within_months=3, event_type='vending_vend_error_credited', sku=new_item, vending_machine_id=removal_machine)
    - month_latest: net_1m
    - month_middle: net_2m - net_1m
    - month_earliest: net_3m - net_2m
    - peak_month: MX(month_latest, month_middle, month_earliest)
    - low_month: MN(month_latest, month_middle, month_earliest)
    - daily_usage: peak_month / K('month_days') if low_month > 0 and peak_month >= K('volatile_ratio') * low_month else ((peak_month + net_3m / K('months_in_window')) * K('half') / K('month_days') if low_month > 0 and peak_month >= K('uneven_ratio') * low_month else net_3m / K('window_days'))
    - gap_days: K('month_days') / P('service_visits_per_month') if P('service_visits_per_month') > 0 else K('no_visit_gap_days')
    - lead_days: P('replenishment_lead_business_days')
    - backorders: XCOUNT('order','order_lines', within_months=3, event_type='order_line_backordered', sku=new_item, ship_to_id=F('ship_to_id'))
    - backorders_closed: XCOUNT('order','order_lines', within_months=3, event_type='order_backorder_filled', sku=new_item, ship_to_id=F('ship_to_id')) + XCOUNT('order','order_lines', within_months=3, event_type='order_backorder_cancelled', sku=new_item, ship_to_id=F('ship_to_id'))
    - backorder_days: K('open_bo_days') if backorders > backorders_closed else (K('closed_bo_days') if backorders > 0 else K('no_bo_days'))
    - rush_orders: XCOUNT('order','order_lines', within_months=6, event_type='order_line_booked', ship_method='next_day_air', sku=new_item, ship_to_id=F('ship_to_id'))
    - rush_days: K('exp_high_days') if rush_orders >= K('exp_high_min') else (K('exp_low_days') if rush_orders == 1 else K('exp_none_days'))
    - route_deliveries: CPARAM('order','route_deliveries_per_week', ship_to_id=F('ship_to_id')) if CPARAM('order','route_deliveries_per_week', ship_to_id=F('ship_to_id')) != None else K('route_unrecorded_per_week')
    - route_days: K('route_none_days') if route_deliveries == 0 else (K('route_light_days') if route_deliveries <= K('route_light_max') else K('route_full_days'))
    - largest_draw: XMAX('vending','vending_transactions','quantity', event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine) if XCOUNT('vending','vending_transactions', event_type='vending_item_issued', sku=new_item, vending_machine_id=removal_machine) > 0 else 0
    - draw_buffer: K('buffer_large_units') if largest_draw >= K('buffer_large_min') else (K('buffer_small_units') if largest_draw >= K('buffer_small_min') else K('buffer_none_units'))
    - special_flag: XCOUNT('vending','vending_planogram', event_type='vending_selection_set', special_item=True, sku=new_item) > 0
    - special_orders: XCOUNT('order','order_lines', event_type='order_line_booked', stock_status='non_stock_special_order', sku=new_item, ship_to_id=F('ship_to_id'))
    - supply_days: K('special_days') if special_flag else (K('nonstock_days') if special_orders > 0 else K('catalog_days'))
    - reorder_days: gap_days + lead_days + backorder_days + rush_days + route_days + supply_days
    - raw_reorder: daily_usage * reorder_days
    - result: MX(0, int(-(-RND(raw_reorder, 6) // 1))) + draw_buffer if same_day_new == 1 and same_day_item_removals == 1 else 0
