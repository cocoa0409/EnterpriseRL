# ---- data flow ----
events:
  - type: vending_machine_requested
    target: vending_machines
    mutation: create
    meaning: "The customer requests a VendPoint machine for a ship-to."
    grain: "One row per machine request (one transaction)."
    fields: {customer_id: "Customer.", ship_to_id: "Ship-to where the machine will stand.", variant_name: "Machine model tier.", requested_date: "Request date.", network_connection: "How the machine will connect."}
    triggers: []
  - type: vending_machine_installed
    target: vending_machines
    mutation: {transition: {from: requested, to: active}}
    meaning: "The machine is installed and goes live."
    grain: "One row per installation (one transaction)."
    fields: {machine_serial: "Serial number of the installed machine.", installed_date: "Installation date (start of the minimum term)."}
    triggers: []
  - type: vending_machine_locked
    target: vending_machines
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The machine is locked under a credit hold."
    grain: "One row per lock (one transaction)."
    fields: {locked_date: "Date locked."}
    triggers: []
  - type: vending_machine_unlocked
    target: vending_machines
    mutation: {transition: {from: suspended, to: active}}
    meaning: "The machine is unlocked after the credit hold is released."
    grain: "One row per unlock (one transaction)."
    fields: {locked_date: "Cleared on unlock (left empty)."}
    triggers: []
  - type: vending_removal_noticed
    target: vending_machines
    mutation: {transition: [{from: active, to: removal_pending}, {from: suspended, to: removal_pending}]}
    meaning: "The customer gives written notice to remove the machine."
    grain: "One row per removal notice (one transaction)."
    fields: {termination_notice_date: "Date the written notice was received."}
    triggers: []
  - type: vending_machine_removed
    target: vending_machines
    mutation: {transition: [{from: removal_pending, to: removed}, {from: requested, to: removed}]}
    meaning: "The machine is de-installed, or the request is cancelled before installation."
    grain: "One row per removal (one transaction)."
    fields: {removed_date: "Removal or cancellation date."}
    triggers: []
  - type: vending_machine_relocated
    target: vending_machines
    mutation: update
    meaning: "The machine is moved to another ship-to of the customer."
    grain: "One row per relocation (one transaction)."
    fields: {ship_to_id: "New ship-to."}
    triggers: []
  - type: vending_model_swapped
    target: vending_machines
    mutation: update
    meaning: "The machine is swapped for another VendPoint model."
    grain: "One row per swap (one transaction)."
    fields: {variant_name: "New model tier.", machine_serial: "Serial of the replacement machine."}
    triggers: []
  - type: vending_machine_moved
    target: vending_transactions
    meaning: "A completed relocation of the machine is logged."
    grain: "One row per relocation."
    distinguish_by: [txn_reference]
    fields: {txn_reference: "Relocation work order (VRL-...).", ship_to_id: "Ship-to the machine moved to.", event_date: "Relocation date."}
    triggers:
      - event: vending:vending_machine_relocated
        map: {ship_to_id: ship_to_id}
  - type: vending_restocked
    target: vending_transactions
    meaning: "Consigned stock is loaded into a machine selection."
    grain: "One row per item loaded on one restock visit."
    distinguish_by: [txn_reference, sku]
    fields: {txn_reference: "Restock visit reference (VRS-...).", sku: "Item.", product_category: "Product category.", quantity: "Units loaded.", unit_price: "Contract unit price, USD.", extended_amount: "Value loaded, USD.", visit_type: "Scheduled or emergency restock.", event_date: "Restock date."}
    account: machine_stock
    direction: in
    triggers: []
  - type: vending_item_issued
    target: vending_transactions
    meaning: "An employee badge vends an item."
    grain: "One row per vend transaction."
    distinguish_by: [txn_reference]
    fields: {txn_reference: "Vend transaction number from the machine log (VT-...).", sku: "Item.", product_category: "Product category.", quantity: "Units vended.", unit_price: "Contract unit price on the vend date, USD.", extended_amount: "Vend value, USD.", employee_badge: "Badge number that vended.", cost_center: "Customer cost center the badge is assigned to.", vended_at: "Vend timestamp.", event_date: "Vend date."}
    account: machine_stock
    direction: out
    triggers: []
  - type: vending_item_returned
    target: vending_transactions
    meaning: "An unused vended item is returned into the machine for credit."
    grain: "One row per return transaction."
    distinguish_by: [txn_reference]
    fields: {txn_reference: "Return transaction number (VR-...).", original_txn_reference: "Vend transaction being returned.", sku: "Item.", product_category: "Product category.", quantity: "Units returned.", unit_price: "Vend unit price of the original vend, USD.", extended_amount: "Credit value, USD.", employee_badge: "Badge returning.", cost_center: "Cost center of the original vend.", event_date: "Return date."}
    account: machine_stock
    direction: in
    triggers: []
  - type: vending_vend_error_credited
    target: vending_transactions
    meaning: "A logged vend that did not dispense is reversed and credited."
    grain: "One row per vend error credited."
    distinguish_by: [txn_reference]
    fields: {txn_reference: "Error credit reference (VE-...).", original_txn_reference: "Vend transaction that failed.", sku: "Item.", quantity: "Units not dispensed.", unit_price: "Vend unit price, USD.", extended_amount: "Credit value, USD.", cost_center: "Cost center of the failed vend.", event_date: "Credit date."}
    account: machine_stock
    direction: in
    triggers: []
  - type: vending_shrink_billed
    target: vending_transactions
    meaning: "A cycle count shortage beyond tolerance is billed to the customer."
    grain: "One row per item short on one cycle count."
    distinguish_by: [txn_reference, sku]
    fields: {txn_reference: "Cycle count reference (VCN-...).", sku: "Item.", quantity: "Units short beyond tolerance.", unit_price: "Contract unit price, USD.", extended_amount: "Shrink billed, USD.", billing_period: "Billing month the shrink is billed in.", event_date: "Count date."}
    account: machine_stock
    direction: out
    triggers: []
  - type: vending_stock_withdrawn
    target: vending_transactions
    meaning: "Consigned stock is taken out of the machine (selection removed, overstock, machine removal)."
    grain: "One row per item withdrawn on one withdrawal."
    distinguish_by: [txn_reference, sku]
    fields: {txn_reference: "Withdrawal reference (VWS-...).", sku: "Item.", quantity: "Units withdrawn.", unit_price: "Contract unit price, USD.", extended_amount: "Value withdrawn, USD.", event_date: "Withdrawal date."}
    account: machine_stock
    direction: out
    triggers: []
  - type: vending_usage_billed
    target: vending_transactions
    meaning: "A billing month of net vends (vends less returns and vend errors, plus billed shrink) is invoiced, per cost center where cost center billing applies."
    grain: "One row per machine per billing month per cost center (a single row with cost center ALL where cost center billing does not apply)."
    distinguish_by: [billing_period, cost_center]
    fields: {billing_period: "Billing month.", cost_center: "Cost center billed, or ALL.", extended_amount: "Net value billed, USD.", event_date: "Last day of the billing month."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, source_type: vending_usage, source_reference: billing_period}
  - type: vending_fee_charged
    target: vending_transactions
    meaning: "A program fee is charged: shortfall, badge, cellular data, install, emergency restock, relocation, model swap, planogram change, replacement badge or early removal."
    grain: "One row per monthly fee per billing month, or per occurrence for event fees."
    distinguish_by: [fee_type, billing_period, txn_reference]
    fields: {fee_type: "Kind of fee.", billing_period: "Billing month the fee belongs to.", txn_reference: "Work order or request reference for event fees; the billing month for monthly fees.", quantity: "Count the fee is computed on, 1 for flat fees.", extended_amount: "Fee amount, USD.", event_date: "Fee date."}
    triggers:
      - event: credit:credit_invoice_posted
        map: {merchandise_amount: extended_amount, source_type: vending_program_fee, source_reference: txn_reference}
  - type: vending_selection_set
    target: vending_planogram
    meaning: "An item is assigned to a machine selection or its par quantity changed."
    grain: "One row per selection change."
    distinguish_by: [slot_label, event_date, change_type]
    fields: {slot_label: "Selection (door, coil or bay) label.", sku: "Item.", product_category: "Product category.", par_qty: "Par quantity.", special_item: "Whether the item is a non-catalog special item.", change_type: "Add item or par change.", change_source: "Who asked for the change.", change_reference: "Request reference.", event_date: "Effective date."}
    triggers: []
  - type: vending_selection_removed
    target: vending_planogram
    meaning: "An item is removed from a selection."
    grain: "One row per selection removal."
    distinguish_by: [slot_label, event_date]
    fields: {slot_label: "Selection label.", sku: "Item removed.", change_source: "Who asked for the removal.", removal_reason: "Why removed.", change_reference: "Request reference.", event_date: "Effective date."}
    triggers: []

# ---- derived measures ----
measures:
  - id: vending_msr_month_net_usage
    window: "One calendar month (billing_period) of one machine."
    measure: "Sum, USD, of extended_amount of vending_item_issued rows dated in the month, less extended_amount of vending_item_returned and vending_vend_error_credited rows dated in the month; shrink and fees excluded."
  - id: vending_msr_site_pooled_usage
    window: "One calendar month, across the active machines at one ship-to."
    measure: "Sum of vending_msr_month_net_usage over every machine at the ship-to that was active or suspended during the month."
  - id: vending_msr_active_badges_month
    window: "One calendar month of one machine."
    measure: "Count of distinct employee_badge values with at least one vending_item_issued row dated in the month."
  - id: vending_msr_planogram_changes_quarter
    window: "The calendar quarter of the change, up to and including the change being charged."
    measure: "Count of vending_selection_set and vending_selection_removed rows with change_source customer dated in the quarter, in date then reference order."
  - id: vending_msr_relocations_12m
    window: "Rolling 12 calendar months ending on the relocation date, inclusive."
    measure: "Count of vending_machine_moved rows of the machine in the window, in date order, including the relocation being charged."

# ---- policies ----
policies:
  - id: vending_agg_multi_holding
    subject: [vending_machine_requested]
    rule: >-
      A customer may hold any number of VendPoint machines, including several at one ship-to; each machine is a separate placement with its own model tier, minimum term and fees.
      A machine is requested only for a ship-to whose status is active.
    eligibility:
      - id: ship_to_open_for_machine
        applies_to: [vending_machine_requested]
        kind: state
        condition: "A machine is requested only for a ship-to whose status is active."
        evidence_fields: [ship_to_accounts.status, ship_to_accounts.ship_to_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ship_to_accounts.ship_to_id]]
          action_bindings: {ship_to_accounts.ship_to_id: ship_to_id}
        state_contract:
          field: ship_to_accounts.status
          allowed: [active]
    params: {max_per_customer: null}

  - id: vending_agg_site_minimum
    subject: [vending_fee_charged]
    rule: >-
      The monthly minimum is tested per machine, except that when every machine at a ship-to that was active or suspended during the month has site_minimum_pooling true, the minimum is tested once for the site: vending_msr_site_pooled_usage against the sum of those machines' min_monthly_usage_usd.
      A pooled site shortfall fee is computed with the machine_shortfall_fee_pct and capped at the monthly_machine_fee_cap_usd of the machine with the largest minimum (on a tie, the lowest machine serial), and is charged once, on that machine.
      Machines still inside their ramp-up months are left out of the pool and are not tested; a single machine that does not allow pooling makes every machine at that site test on its own.
    eligibility: []
    measures: [vending_msr_site_pooled_usage]

  - id: vending_placement
    subject: [vending_machine_requested, vending_machine_installed]
    rule: >-
      A machine is placed only for a customer whose Commercial Credit Account status is active.
      The model requested is placed when its entry gate (projected monthly usage and badge users) is met, otherwise the largest model whose gate is met; installation follows within install_lead_business_days business days and the minimum term starts on the installation date.
      A model with install_fee_usd above 0.00 bills it once at installation; a machine connected by cellular data carries cellular_data_fee_usd every month it is installed.
      The customer may cancel a request before installation with no charge.
    eligibility:
      - id: credit_active_for_placement
        applies_to: [vending_machine_requested]
        kind: state
        condition: "A machine is placed only for a customer whose Commercial Credit Account status is active."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: vending_evt_usage_billing
    subject: [vending_item_issued, vending_usage_billed]
    rule: >-
      A machine vends only while its status is active or suspended, and while suspended only items in credit_hold_safety_categories on a model whose credit_hold_vending_rule is safety_items_only.
      Each vend is billed at the contract unit price pricing_price_basis gives for the vend date under vend_price_basis; title passes on the vend.
      A badge vends at most employee_daily_vend_limit_units units per day unless the customer has set another limit.
      A machine bills to at most max_cost_centers cost centers.
      Under vend_billing_cycle, net vends of a calendar month (vends less returns and vend errors dated in the month, plus shrink billed in the month) are billed on one invoice dated the last day of the month, split per cost center where cost_center_allocation_included is true and billed as one ALL invoice otherwise; a return or error credit is netted in the month it occurs even when the original vend was billed in an earlier month.
      Each machine is billed at most once per cost center for a billing month.
    eligibility:
      - id: machine_can_vend
        applies_to: [vending_item_issued]
        kind: state
        condition: "A machine vends only while its status is active or suspended"
        evidence_fields: [vending_machines.status, vending_machines.vending_machine_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_machines.vending_machine_id]]
          action_bindings: {vending_machines.vending_machine_id: vending_machine_id}
        state_contract:
          field: vending_machines.status
          allowed: [active, suspended]
      - id: one_usage_bill_per_cost_center
        applies_to: [vending_usage_billed]
        kind: dedup
        condition: "Each machine is billed at most once per cost center for a billing month."
        evidence_fields: [vending_transactions.vending_machine_id, vending_transactions.billing_period, vending_transactions.cost_center, vending_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.vending_machine_id, vending_transactions.billing_period, vending_transactions.cost_center]]
          action_bindings: {vending_transactions.vending_machine_id: vending_machine_id, vending_transactions.billing_period: billing_period, vending_transactions.cost_center: cost_center}
        dedup_contract:
          table: vending_transactions
          mode: separate_record
          object_bindings: {vending_machine_id: vending_machine_id, billing_period: billing_period, cost_center: cost_center}
          duplicate_filters: {event_type: [vending_usage_billed]}
          distinct_fields: [billing_period]
    measures: [vending_msr_month_net_usage]

  - id: vending_evt_returns_and_errors
    subject: [vending_item_returned, vending_vend_error_credited]
    rule: >-
      Coil machines (machine_type coil) cannot take items back. An unused item may be returned into the machine only on a model whose return_to_machine_allowed is true, in its original package, by the badge that vended it.
      A return is accepted only when it is made no later than return_to_machine_days calendar days after the vend date of the original vend.
      Count calendar days starting the day after the vend date; a return on the last day is accepted.
      A returned item is credited at return_credit_basis, the unit price of the original vend, for the units returned, never more than the units that vend issued.
      A vend error is credited only when it is reported no later than vend_error_report_hours hours after the failed vend.
      Count elapsed hours from the vend timestamp in the machine log to the time the error is reported; a report exactly at the limit is accepted.
      An error credit up to vend_error_credit_auto_max_usd is granted by the desk from the machine log; a larger one waits for the next restock visit to confirm the item is still in the selection, and is not credited by the desk.
      Each vend transaction may be returned or credited for a vend error only once.
    eligibility:
      - id: return_inside_window
        applies_to: [vending_item_returned]
        kind: time
        condition: "A return is accepted only when it is made no later than return_to_machine_days calendar days after the vend date of the original vend."
        evidence_fields: [vending_transactions.event_date, vending_transactions.txn_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.txn_reference]]
          action_bindings: {vending_transactions.txn_reference: original_txn_reference}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the vend date of the original vend"
          anchor_source: vending_transactions.event_date
          relation: not_after
          duration_source: variants.return_to_machine_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the vend date; a return on the last day is accepted."
          boundary: inclusive
      - id: error_reported_in_time
        applies_to: [vending_vend_error_credited]
        kind: time
        condition: "A vend error is credited only when it is reported no later than vend_error_report_hours hours after the failed vend."
        evidence_fields: [vending_transactions.vended_at, vending_transactions.txn_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.txn_reference]]
          action_bindings: {vending_transactions.txn_reference: original_txn_reference}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the failed vend"
          anchor_source: vending_transactions.vended_at
          relation: not_after
          duration_source: variants.vend_error_report_hours
          unit: elapsed_hours
          counting_rule: "Count elapsed hours from the vend timestamp in the machine log to the time the error is reported; a report exactly at the limit is accepted."
          boundary: inclusive
      - id: one_credit_per_vend
        applies_to: [vending_item_returned, vending_vend_error_credited]
        kind: dedup
        condition: "Each vend transaction may be returned or credited for a vend error only once."
        evidence_fields: [vending_transactions.original_txn_reference, vending_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.original_txn_reference]]
          action_bindings: {vending_transactions.original_txn_reference: original_txn_reference}
        dedup_contract:
          table: vending_transactions
          mode: separate_record
          object_bindings: {original_txn_reference: original_txn_reference}
          duplicate_filters: {event_type: [vending_item_returned, vending_vend_error_credited]}
          distinct_fields: []

  - id: vending_evt_restock_and_shrink
    subject: [vending_restocked, vending_shrink_billed, vending_stock_withdrawn]
    rule: >-
      Corbett restocks each machine restock_visits_per_week times a week, filling every selection at or below low_stock_trigger_pct percent of par back to par, without letting the machine stock value exceed machine_stock_cap_usd; an emergency restock on request is made within emergency_restock_response_hours hours.
      Machine stock stays Corbett-owned under consigned_inventory until vended.
      Every cycle_count_frequency_months months the stock is counted; where shrink_billed_to_customer is true the shortage value above shrink_tolerance_pct percent of the stock value counted is billed at shrink_billing_basis in that month's usage bill, and where it is false Corbett absorbs all shrink.
      Stock is withdrawn at no charge when a selection is removed, when overstock exceeds the cap, and when the machine is removed.
    eligibility: []

  - id: vending_evt_fees
    subject: [vending_fee_charged]
    rule: >-
      For each calendar month after the ramp_up_months full months following the installation month, a machine whose vending_msr_month_net_usage is below min_monthly_usage_usd is charged a shortfall fee of machine_shortfall_fee_pct percent of the shortfall, rounded half up to the cent and capped at monthly_machine_fee_cap_usd, unless the site is pooled under vending_agg_site_minimum; where credit_hold_minimum_applies is true, months the machine was locked under a credit hold are tested like any other month.
      Active badge users above badge_users_included, counted by vending_msr_active_badges_month, are charged additional_badge_fee_usd each for the month; a cellular-connected machine is charged cellular_data_fee_usd for the month.
      Each monthly fee type is charged at most once per machine per billing month.
      A relocation beyond relocations_included_per_year in the rolling 12 months counted by vending_msr_relocations_12m carries relocation_fee_usd; a model swap carries machine_swap_fee_usd; an emergency restock carries emergency_restock_fee_usd; a replacement badge card carries replacement_badge_card_fee_usd; a customer-requested selection change beyond planogram_changes_included_per_quarter in the quarter, counted by vending_msr_planogram_changes_quarter, carries planogram_change_fee_usd.
      A machine removed before min_term_months calendar months after its installation date carries early_removal_fee_usd once; a fee whose model amount is 0.00 is never charged.
    eligibility:
      - id: one_monthly_fee_per_machine
        applies_to: [vending_fee_charged]
        kind: dedup
        condition: "Each monthly fee type is charged at most once per machine per billing month."
        evidence_fields: [vending_transactions.vending_machine_id, vending_transactions.fee_type, vending_transactions.billing_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_transactions.vending_machine_id, vending_transactions.fee_type, vending_transactions.billing_period]]
          action_bindings: {vending_transactions.vending_machine_id: vending_machine_id, vending_transactions.fee_type: fee_type, vending_transactions.billing_period: billing_period}
        dedup_contract:
          table: vending_transactions
          mode: separate_record
          object_bindings: {vending_machine_id: vending_machine_id, fee_type: fee_type, billing_period: billing_period}
          duplicate_filters: {event_type: [vending_fee_charged], fee_type: [usage_shortfall_fee, badge_fee, cellular_data_fee]}
          distinct_fields: [txn_reference]
    measures: [vending_msr_month_net_usage, vending_msr_active_badges_month, vending_msr_relocations_12m, vending_msr_planogram_changes_quarter]
    params:
      per_tier:
        VendPoint Locker 12: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Locker 24: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Coil 40: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Coil 60: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Carousel 90: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
        VendPoint Smart Crib 300: {minimum: "=min_monthly_usage_usd", cap: "=monthly_machine_fee_cap_usd"}
    formula:
      when_not: "vending_msr_month_net_usage >= min_monthly_usage_usd"
      shortfall_fee: "min(round((min_monthly_usage_usd - vending_msr_month_net_usage) * machine_shortfall_fee_pct / 100, 2), monthly_machine_fee_cap_usd)"

  - id: vending_planogram_management
    subject: [vending_selection_set, vending_selection_removed]
    rule: >-
      The customer may ask to add items, change par quantities or remove items at any time on an active machine; changes take effect at the next restock visit.
      A selection holds a non-catalog special item only while the machine's special items stay within special_item_slots_max, and the machine never holds more items than selection_capacity.
      At each planogram review, every planogram_review_months months, Corbett removes selections with no vend for slow_mover_removal_days days, with change_source corbett and removal_reason slow_mover; Corbett-initiated changes never count toward the included changes.
    eligibility: []

  - id: vending_credit_hold_lock
    subject: [vending_machine_locked, vending_machine_unlocked]
    rule: >-
      When the customer's Commercial Credit Account is placed on hold, every active machine of the customer is locked; on a model whose credit_hold_vending_rule is safety_items_only, items in credit_hold_safety_categories keep vending while locked, and on a model whose rule is lock_machine nothing vends.
      A machine is unlocked only when the customer's Commercial Credit Account status is active again.
      Locking never stops restocking of the items that keep vending, and never changes the minimum term.
    eligibility:
      - id: credit_restored_before_unlock
        applies_to: [vending_machine_unlocked]
        kind: state
        condition: "A machine is unlocked only when the customer's Commercial Credit Account status is active again."
        evidence_fields: [credit_accounts.status, credit_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_accounts.customer_id]]
          action_bindings: {credit_accounts.customer_id: customer_id}
        state_contract:
          field: credit_accounts.status
          allowed: [active]

  - id: vending_removal_and_relocation
    subject: [vending_removal_noticed, vending_machine_removed, vending_machine_relocated, vending_model_swapped, vending_machine_moved]
    rule: >-
      Removing a machine is the customer's own act by written notice.
      A machine with a removal notice is removed no earlier than removal_notice_days calendar days after the date the written removal notice is received.
      Count calendar days starting the day after the notice is received; the machine is removed on the last day of the notice period or a later date the notice names.
      On removal the stock is withdrawn at no charge, the final month's usage is billed, and the early removal fee applies under vending_evt_fees when removal falls before the end of the minimum term.
      A machine may be relocated only to another active ship-to of the same customer, scheduled within relocation_lead_business_days business days; a relocation or model swap does not restart the minimum term, and a swap to a different model makes the new model's parameters apply from the swap date.
    eligibility:
      - id: removal_notice_served
        applies_to: [vending_machine_removed]
        kind: time
        condition: "A machine with a removal notice is removed no earlier than removal_notice_days calendar days after the date the written removal notice is received."
        evidence_fields: [vending_machines.termination_notice_date, vending_machines.vending_machine_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vending_machines.vending_machine_id]]
          action_bindings: {vending_machines.vending_machine_id: vending_machine_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the written removal notice is received"
          anchor_source: vending_machines.termination_notice_date
          relation: not_before
          duration_source: variants.removal_notice_days
          unit: calendar_days
          counting_rule: "Count calendar days starting the day after the notice is received; the machine is removed on the last day of the notice period or a later date the notice names."
          boundary: inclusive
    measures: [vending_msr_relocations_12m]

# ---- extended policies (d5_vendpoint_usage_and_machine_billing) ----
extended_policies:
  - id: vending_ext_startup_par_review
    base_policy_refs: [vending_planogram_management, vending_evt_restock_and_shrink]
    overwrite: []
    trigger: state_due
    subject: [vending_selection_set]
    computes: par_qty
    target_tool: resize_selection_par_58ce1bb4
    params:
      week_days: 7
      settling_days: 28
      ppe_allowance: 0.5
      wear_item_allowance: 0.25
      special_item_allowance: 0.5
      substitute_allowance: 0.25
      critical_bin_backup: 0.7
      plain_bin_backup: 0.85
      exposure_restricted: 0.5
      exposure_watch: 0.8
      order_heavy_share: 0.75
      order_light_share: 0.9
    rule: >-
      Corbett's start-up par review covers the item most recently added to a machine, which is the item whose add
      entry on the machine's selection history carries the highest planogram request reference (Corbett issues these
      references in sequence), for the three months after the date of that add entry: when that item runs empty
      between two scheduled restock visits, Corbett re-sizes the par of its selection and records a par change entry
      from Corbett dated the day of the review, which takes effect at the next restock visit like any other selection
      change; Corbett-initiated changes never count toward the included changes, and the customer may still ask for
      another par afterwards under the planogram rules.
      Whole months between two dates are counted as the difference in calendar months, less one when the day of the month of the later date is before the day of the month of the earlier date; a record counts in a stated number of months ending today when fewer whole months than that number, counted this way, separate its date from today.
      Any other item, and an item whose add entry is three or more whole months old, counted this way, keeps its par
      under the planogram rules.
      The item's units are the units of that item vended from the machine in the three months ending today, less the
      units of that item returned to the machine or credited for a vend error in the same three months, each record
      counted by its date.
      The item's days in the machine are the calendar days from the date of its add entry to today, counted as one
      when the add entry is dated today.
      The item's average per restock interval is its units divided by its days in the machine, multiplied by seven,
      and divided by the model's scheduled restock visits per week.
      The standard par is the item's average per restock interval divided by the model's low-stock trigger percentage taken as a fraction of one hundred, rounded up to a whole unit.
      The item's demand pattern can replace the average per restock interval in the standard par, where the item's largest single vend is the largest number of units of the item issued in one vend on the machine at any time and its starter par is the par on its add entry: when the item's largest single vend is at least its average per restock interval, the larger of the average per restock interval and the largest single vend replaces it; when the largest single vend is below the average per restock interval and the item has fewer days in the machine than the settling period, the larger of two figures, the average per restock interval and the product of the starter par and one less the low-stock trigger fraction, replaces it; otherwise the average per restock interval stands.
      The wear allowance follows the item's product category on its add entry: an item in the safety and PPE
      category carries the PPE wear allowance, an item in the cutting tools or the abrasives category carries the
      consumable wear allowance, and any other item carries none.
      The storeroom backup factor follows the StockSmart program whose status is active at the machine's ship-to:
      when that program carries a bin for the item, meaning its new-bin entries for the item outnumber its bin
      removal entries for the item, and the item's latest bin set entry on that program, new bin or par change, which
      is the one carrying the highest bin request reference since StockSmart issues those references in sequence, is
      flagged critical, the factor is the critical-bin backup factor; when that program carries a bin for the item
      and that latest bin set entry is not flagged critical, the factor is the plain-bin backup factor; otherwise the factor is one.
      The consigned exposure factor follows the customer's open Commercial Credit Account, the account with no
      closed date: when that account's status is on hold or in collections, or two or more payments were returned on
      the customer's account in the twelve months ending today, the factor is the restricted exposure factor; when
      the account's status is active and exactly one payment was returned in those twelve months, the factor is the
      watch exposure factor; otherwise the factor is one; returned payments are counted by return date.
      The lead allowance follows how the item is supplied: a non-catalog special item on its add entry carries the
      special-item lead allowance; a catalog item that carries, on the customer's agreement, a contract price line
      written as a Corbett-approved substitute for a discontinued item and no removal line for the item carries the
      substitute lead allowance; any other item carries none.
      The order channel factor follows the units of the item shipped on order lines to the machine's ship-to in the
      three months ending today: when those shipped units are above zero and at least the item's units, the factor
      is the heavy order share; when they are above zero and below the item's units, the factor is the light order
      share; otherwise the factor is one.
      To size the par, each method that applies first replaces the quantity of the standard par it names; the allowances that apply are then added together and added to one, the standard par before its rounding is multiplied by that sum and then by each share and factor that applies, and the result is rounded up to a whole unit only at the end.
    prerequisite: []
    cross_category:
      - category: vmi
        as: history
        reads: [vmi_program_id, status, vmi_bins.event_type, vmi_bins.change_type, vmi_bins.sku, vmi_bins.change_reference, vmi_bins.critical_item]
        note: The storeroom backup factor reads the active StockSmart program at the machine's ship-to and its bin entries for the item.
      - category: credit
        as: history
        reads: [status, closed_date, credit_transactions.event_type, credit_transactions.txn_date]
        note: The consigned exposure factor reads the open credit account's status and the returned payments of the last twelve months.
      - category: pricing
        as: history
        reads: [pricing_items.sku, pricing_items.change_reason, pricing_items.event_type]
        note: The lead allowance reads whether the item carries a substitute contract line and no removal line.
      - category: order
        as: history
        reads: [order_lines.event_type, order_lines.sku, order_lines.ship_to_id, order_lines.quantity, order_lines.event_date]
        note: The order channel factor reads the item's units shipped on order lines to the machine's ship-to in the last three months.
    compute:
      - item_sku: "LATEST('vending_planogram', 'sku', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - add_date: "LATEST('vending_planogram', 'event_date', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - item_category: "LATEST('vending_planogram', 'product_category', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - item_special: "LATEST('vending_planogram', 'special_item', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - starter_par: "LATEST('vending_planogram', 'par_qty', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - units_vended: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_item_issued', sku=item_sku)"
      - units_returned: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_item_returned', sku=item_sku)"
      - units_error: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_vend_error_credited', sku=item_sku)"
      - item_units: "units_vended - units_returned - units_error"
      - days_in_machine: "MX(DAYS(add_date, NOW), 1)"
      - avg_interval: "item_units / days_in_machine * K('week_days') / P('restock_visits_per_week')"
      - trigger_fraction: "P('low_stock_trigger_pct') / 100"
      - largest_vend: "MAX('vending_transactions', 'quantity', event_type='vending_item_issued', sku=item_sku)"
      - interval_usage: "MX(avg_interval, largest_vend) if largest_vend >= avg_interval else (MX(avg_interval, starter_par * (1 - trigger_fraction)) if (largest_vend < avg_interval and days_in_machine < K('settling_days')) else avg_interval)"
      - wear_allowance: "K('ppe_allowance') if item_category == 'safety_ppe' else (K('wear_item_allowance') if (item_category == 'cutting_tools' or item_category == 'abrasives') else 0.0)"
      - backup_program: "CFIELD('vmi', 'vmi_program_id', ship_to_id=F('ship_to_id'), status='active')"
      - bins_opened: "XCOUNT('vmi', 'vmi_bins', event_type='vmi_bin_set', change_type='new_bin', sku=item_sku, vmi_program_id=backup_program)"
      - bins_closed: "XCOUNT('vmi', 'vmi_bins', event_type='vmi_bin_removed', sku=item_sku, vmi_program_id=backup_program)"
      - bin_critical: "XLATEST('vmi', 'vmi_bins', 'critical_item', date_field='change_reference', event_type='vmi_bin_set', sku=item_sku, vmi_program_id=backup_program)"
      - backup_factor: "K('critical_bin_backup') if (bins_opened > bins_closed and bin_critical == True) else (K('plain_bin_backup') if (bins_opened > bins_closed and bin_critical != True) else 1.0)"
      - account_status: "CFIELD('credit', 'status', closed_date='')"
      - returned_12m: "XCOUNT('credit', 'credit_transactions', within_months=12, date_field='txn_date', event_type='credit_payment_returned')"
      - exposure_factor: "K('exposure_restricted') if (account_status == 'on_hold' or account_status == 'in_collections' or returned_12m >= 2) else (K('exposure_watch') if (account_status == 'active' and returned_12m == 1) else 1.0)"
      - substitute_lines: "XCOUNT('pricing', 'pricing_items', sku=item_sku, change_reason='discontinued_substitute')"
      - removal_lines: "XCOUNT('pricing', 'pricing_items', sku=item_sku, event_type='pricing_item_removed')"
      - lead_allowance: "K('special_item_allowance') if item_special == True else (K('substitute_allowance') if (item_special != True and substitute_lines > 0 and removal_lines == 0) else 0.0)"
      - order_units: "XSUM('order', 'order_lines', 'quantity', within_months=3, event_type='order_line_shipped', sku=item_sku, ship_to_id=F('ship_to_id'))"
      - channel_factor: "K('order_heavy_share') if (order_units > 0 and order_units >= item_units) else (K('order_light_share') if (order_units > 0 and order_units < item_units) else 1.0)"
      - sized_units: "interval_usage * (1 + wear_allowance + lead_allowance) * backup_factor * exposure_factor * channel_factor / trigger_fraction"
      - result: "int(-(-sized_units // 1))"
    compute_basis:
      item_sku: "Corbett's start-up par review covers the item most recently added to a machine, which is the item whose add entry on the machine's selection history carries the highest planogram request reference (Corbett issues these references in sequence)"
      add_date: "Corbett's start-up par review covers the item most recently added to a machine, which is the item whose add entry on the machine's selection history carries the highest planogram request reference (Corbett issues these references in sequence)"
      item_category: "The wear allowance follows the item's product category on its add entry"
      item_special: "a non-catalog special item on its add entry carries the special-item lead allowance"
      starter_par: "its starter par is the par on its add entry"
      units_vended: "The item's units are the units of that item vended from the machine in the three months ending today, less the units of that item returned to the machine or credited for a vend error in the same three months, each record counted by its date."
      units_returned: "less the units of that item returned to the machine or credited for a vend error in the same three months"
      units_error: "less the units of that item returned to the machine or credited for a vend error in the same three months"
      item_units: "The item's units are the units of that item vended from the machine in the three months ending today, less the units of that item returned to the machine or credited for a vend error in the same three months"
      days_in_machine: "The item's days in the machine are the calendar days from the date of its add entry to today, counted as one when the add entry is dated today."
      avg_interval: "The item's average per restock interval is its units divided by its days in the machine, multiplied by seven, and divided by the model's scheduled restock visits per week."
      trigger_fraction: "divided by the model's low-stock trigger percentage taken as a fraction of one hundred"
      largest_vend: "the item's largest single vend is the largest number of units of the item issued in one vend on the machine at any time"
      interval_usage: "The item's demand pattern can replace the average per restock interval in the standard par, where the item's largest single vend is the largest number of units of the item issued in one vend on the machine at any time and its starter par is the par on its add entry: when the item's largest single vend is at least its average per restock interval, the larger of the average per restock interval and the largest single vend replaces it; when the largest single vend is below the average per restock interval and the item has fewer days in the machine than the settling period, the larger of two figures, the average per restock interval and the product of the starter par and one less the low-stock trigger fraction, replaces it; otherwise the average per restock interval stands."
      wear_allowance: "The wear allowance follows the item's product category on its add entry: an item in the safety and PPE category carries the PPE wear allowance, an item in the cutting tools or the abrasives category carries the consumable wear allowance, and any other item carries none."
      backup_program: "The storeroom backup factor follows the StockSmart program whose status is active at the machine's ship-to"
      bins_opened: "when that program carries a bin for the item, meaning its new-bin entries for the item outnumber its bin removal entries for the item"
      bins_closed: "when that program carries a bin for the item, meaning its new-bin entries for the item outnumber its bin removal entries for the item"
      bin_critical: "the item's latest bin set entry on that program, new bin or par change, which is the one carrying the highest bin request reference since StockSmart issues those references in sequence, is flagged critical"
      backup_factor: "the factor is the critical-bin backup factor; when that program carries a bin for the item and that latest bin set entry is not flagged critical, the factor is the plain-bin backup factor; otherwise the factor is one."
      account_status: "The consigned exposure factor follows the customer's open Commercial Credit Account, the account with no closed date"
      returned_12m: "two or more payments were returned on the customer's account in the twelve months ending today"
      exposure_factor: "when that account's status is on hold or in collections, or two or more payments were returned on the customer's account in the twelve months ending today, the factor is the restricted exposure factor; when the account's status is active and exactly one payment was returned in those twelve months, the factor is the watch exposure factor; otherwise the factor is one; returned payments are counted by return date."
      substitute_lines: "a catalog item that carries, on the customer's agreement, a contract price line written as a Corbett-approved substitute for a discontinued item"
      removal_lines: "and no removal line for the item carries the substitute lead allowance"
      lead_allowance: "The lead allowance follows how the item is supplied: a non-catalog special item on its add entry carries the special-item lead allowance; a catalog item that carries, on the customer's agreement, a contract price line written as a Corbett-approved substitute for a discontinued item and no removal line for the item carries the substitute lead allowance; any other item carries none."
      order_units: "The order channel factor follows the units of the item shipped on order lines to the machine's ship-to in the three months ending today"
      channel_factor: "when those shipped units are above zero and at least the item's units, the factor is the heavy order share; when they are above zero and below the item's units, the factor is the light order share; otherwise the factor is one."
      sized_units: "To size the par, each method that applies first replaces the quantity of the standard par it names; the allowances that apply are then added together and added to one, the standard par before its rounding is multiplied by that sum and then by each share and factor that applies"
      result: "and the result is rounded up to a whole unit only at the end."
    factors:
      - id: demand_pattern_basis
        effect: method
        decides: interval_usage
        bindings: [largest_vend, starter_par, interval_usage]
        ladder:
          - when: "the item's largest single vend is at least its average per restock interval"
            method: "the larger of the average per restock interval and the largest single vend replaces the average per restock interval"
          - when: "the largest single vend is below the average per restock interval and the item has fewer days in the machine than the settling period"
            method: "the larger of two figures, the average per restock interval and the product of the starter par and one less the low-stock trigger fraction, replaces the average per restock interval"
          - when: "otherwise"
            method: "the average per restock interval stands"
        baseline:
          interval_usage: "avg_interval"
        evidence: [history, date]
        cross_difficulty: null
      - id: category_wear_allowance
        effect: parameter
        decides: wear_allowance
        bindings: [item_category, wear_allowance]
        ladder:
          - when: "the item's product category on its add entry is safety and PPE"
            value: "K('ppe_allowance')"
          - when: "the item's product category on its add entry is cutting tools or abrasives"
            value: "K('wear_item_allowance')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          wear_allowance: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: storeroom_bin_backup
        effect: parameter
        decides: backup_factor
        bindings: [backup_program, bins_opened, bins_closed, bin_critical, backup_factor]
        ladder:
          - when: "the active StockSmart program at the ship-to carries a bin for the item and the item's latest bin set entry is flagged critical"
            value: "K('critical_bin_backup')"
          - when: "the active StockSmart program at the ship-to carries a bin for the item and the item's latest bin set entry is not flagged critical"
            value: "K('plain_bin_backup')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          backup_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: vmi
      - id: consigned_exposure_limit
        effect: parameter
        decides: exposure_factor
        bindings: [account_status, returned_12m, exposure_factor]
        ladder:
          - when: "the open credit account is on hold or in collections, or two or more payments were returned in the last twelve months"
            value: "K('exposure_restricted')"
          - when: "the open credit account is active and exactly one payment was returned in the last twelve months"
            value: "K('exposure_watch')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          exposure_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: credit
      - id: supply_lead_allowance
        effect: parameter
        decides: lead_allowance
        bindings: [item_special, substitute_lines, removal_lines, lead_allowance]
        ladder:
          - when: "the item is a non-catalog special item on its add entry"
            value: "K('special_item_allowance')"
          - when: "the item is a catalog item carrying a contract line written as a substitute for a discontinued item and no removal line"
            value: "K('substitute_allowance')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          lead_allowance: "0.0"
        evidence: [history, cross_category]
        cross_difficulty: pricing
      - id: order_channel_share
        effect: parameter
        decides: channel_factor
        bindings: [order_units, channel_factor]
        ladder:
          - when: "units of the item shipped on order lines to the ship-to in the last three months are above zero and at least the item's units"
            value: "K('order_heavy_share')"
          - when: "units of the item shipped on order lines to the ship-to in the last three months are above zero and below the item's units"
            value: "K('order_light_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          channel_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: order
    baseline:
      rule: >-
        Whole months between two dates are counted as the difference in calendar months, less one when the day of the month of the later date is before the day of the month of the earlier date; a record counts in a stated number of months ending today when fewer whole months than that number, counted this way, separate its date from today.
        The item's units are the units of that item vended from the machine in the three months ending today, less the
        units of that item returned to the machine or credited for a vend error in the same three months, each record
        counted by its date.
        The item's days in the machine are the calendar days from the date of its add entry to today, counted as one
        when the add entry is dated today.
        The item's average per restock interval is its units divided by its days in the machine, multiplied by seven,
        and divided by the model's scheduled restock visits per week.
        The standard par is the item's average per restock interval divided by the model's low-stock trigger percentage taken as a fraction of one hundred, rounded up to a whole unit.
      params: [week_days, restock_visits_per_week, low_stock_trigger_pct]
    inputs:
      history:
        - {table: vending_planogram, aggregate: latest, field: sku, filters: {event_type: vending_selection_set, change_type: add_item}}
        - {table: vending_transactions, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: vending_item_issued}}
        - {table: vending_transactions, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: vending_item_returned}}
        - {table: vending_transactions, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: vending_vend_error_credited}}
        - {table: vending_transactions, aggregate: max, field: quantity, filters: {event_type: vending_item_issued}}
        - {category: vmi, table: vmi_bins, aggregate: count, field: vmi_bin_id, filters: {event_type: vmi_bin_set, change_type: new_bin}}
        - {category: credit, table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_payment_returned}}
        - {category: pricing, table: pricing_items, aggregate: count, field: contract_item_id, filters: {change_reason: discontinued_substitute}}
        - {category: order, table: order_lines, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: order_line_shipped}}
      cross_category: [vmi, credit, pricing, order]
  - id: vending_ext_startup_item_return
    base_policy_refs: [vending_evt_returns_and_errors]
    overwrite:
      - base_policy: vending_evt_returns_and_errors
        superseded_clause: "A returned item is credited at return_credit_basis, the unit price of the original vend, for the units returned, never more than the units that vend issued."
        replaced_by: "An unused unit of the item most recently added to the machine that is returned during its start-up months against that item's latest vend, and only such a unit, is credited at the start-up unit credit figured below for each unit returned, never more units than that vend issued; every other return stays credited at the unit price of its original vend for the units returned, never more than the units that vend issued."
    trigger: on_request
    subject: [vending_item_returned]
    computes: unit_credit
    target_tool: return_startup_item_units_bfc1c22c
    params:
      overstock_charge: 0.75
      near_full_share: 0.8
      near_full_credit: 0.95
      long_trial_days: 60
      mid_trial_days: 30
      long_trial_share: 0.95
      mid_trial_share: 0.97
      frequent_returns: 3
      frequent_share: 0.95
      some_returns_share: 0.98
      ppe_handling_share: 0.9
      consumable_handling_share: 0.97
    rule: >-
      An unused unit of the item most recently added to the machine that is returned during its start-up months
      against that item's latest vend, and only such a unit, is credited at the start-up unit credit figured below for
      each unit returned, never more units than that vend issued; every other return stays credited at the unit price
      of its original vend for the units returned, never more than the units that vend issued.
      The item most recently added is the item whose add entry on the machine's selection history carries the highest
      planogram request reference (Corbett issues these references in sequence), and its start-up months are the
      three months after the date of that add entry; the item's latest vend is its vend carrying the highest vend transaction number (the machine log numbers vends in sequence).
      The return is the customer's own act: the badge that vended the units returns them into the machine, and the
      return line carries the units returned, the unit price of the original vend and a credit value equal to the
      units returned multiplied by the start-up unit credit, rounded half up to the cent.
      Whole months between two dates are counted as the difference in calendar months, less one when the day of the
      month of the later date is before the day of the month of the earlier date; a record counts in a stated number
      of months ending today when fewer whole months than that number, counted this way, separate its date from
      today.
      The standard unit credit is the unit price of the item's latest vend, the price paid for the returned units, rounded half up to the cent.
      The price the credit is figured from is the unit price of the item's latest vend, the price paid for the returned
      units, whatever the item's contract price line says today; an item with no vend on the machine has no unit to return and no credit.
      The fill level can replace the price in the standard unit credit, following the item's stock ledger against the selection's par, where the item's stock ledger is its units loaded on restock visits, less its units vended, plus its units returned to the machine and credited for vend errors, less its units withdrawn and its units billed as shrink, over all of the machine's records, and the selection's par is the par on the item's selection entry carrying the highest planogram request reference: when the ledger stands at or above the par, the price less the overstock handling charge for each unit, never below zero, replaces it; when the ledger stands at or above the near-full share of the par but below the par, the price multiplied by the near-full credit share replaces it; otherwise the price stands.
      The trial share follows the calendar days from the date of the item's add entry to today: at least the long
      trial days give the long-trial share, at least the mid trial days but fewer than the long ones give the
      mid-trial share, and fewer give a share of one.
      The return-rate share follows the return lines on the machine in the three months ending today, counted by
      return date: at least the frequent-return count gives the frequent-return share, one or more but fewer give the
      some-returns share, and none gives a share of one.
      The handling share follows the product category on the item's add entry: an item in the safety and PPE category
      gives the PPE handling share, an item in the cutting tools or the abrasives category gives the consumable
      handling share, and any other item gives a share of one.
      To fix the start-up unit credit, each method that applies first replaces the quantity of the standard unit credit it names, so that a charge a method subtracts comes before any share; each share that applies then multiplies the figure, and the product is rounded half up to the cent only at the end.
      A return of a start-up item is not credited until the item's selection carries the start-up review par change
      entry from Corbett that its stockout between scheduled restock visits owes.
    prerequisite:
      - problem: vending_ext_startup_par_review
        kind: value_input
        gate: fill_tier
        form: state
        policy_source: "A return of a start-up item is not credited until the item's selection carries the start-up review par change entry from Corbett that its stockout between scheduled restock visits owes."
        condition: "When the item most recently added ran empty between two scheduled restock visits inside its start-up months, its selection carries a par change entry from Corbett dated on or after the day it ran empty."
        resolved_by: resize_selection_par_58ce1bb4
        effect: "Corbett's start-up review sets the selection's par from the item's usage, above the par the item was loaded to; a stock ledger that stood at the old par then stands below the new par, so the fill-level shape moves from the overstock handling charge to the near-full credit share when the ledger stays at or above the near-full share of the new par, or to the plain price when it falls below it."
    cross_category: []
    compute:
      - item_sku: "LATEST('vending_planogram', 'sku', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - add_date: "LATEST('vending_planogram', 'event_date', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - item_category: "LATEST('vending_planogram', 'product_category', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - latest_vend_price: "LATEST('vending_transactions', 'unit_price', date_field='txn_reference', event_type='vending_item_issued', sku=item_sku)"
      - units_loaded: "SUM('vending_transactions', 'quantity', event_type='vending_restocked', sku=item_sku)"
      - units_vended: "SUM('vending_transactions', 'quantity', event_type='vending_item_issued', sku=item_sku)"
      - units_back: "SUM('vending_transactions', 'quantity', event_type='vending_item_returned', sku=item_sku) + SUM('vending_transactions', 'quantity', event_type='vending_vend_error_credited', sku=item_sku)"
      - units_out: "SUM('vending_transactions', 'quantity', event_type='vending_stock_withdrawn', sku=item_sku) + SUM('vending_transactions', 'quantity', event_type='vending_shrink_billed', sku=item_sku)"
      - stock_ledger: "units_loaded - units_vended + units_back - units_out"
      - selection_par: "LATEST('vending_planogram', 'par_qty', date_field='change_reference', event_type='vending_selection_set', sku=item_sku)"
      - fill_tier: "1 if stock_ledger >= selection_par else (2 if stock_ledger >= K('near_full_share') * selection_par else 3)"
      - trial_days: "DAYS(add_date, NOW)"
      - trial_share: "K('long_trial_share') if trial_days >= K('long_trial_days') else (K('mid_trial_share') if trial_days >= K('mid_trial_days') else 1.0)"
      - machine_returns: "COUNT('vending_transactions', within_months=3, event_type='vending_item_returned')"
      - return_rate_share: "K('frequent_share') if machine_returns >= K('frequent_returns') else (K('some_returns_share') if machine_returns >= 1 else 1.0)"
      - handling_share: "K('ppe_handling_share') if item_category == 'safety_ppe' else (K('consumable_handling_share') if (item_category == 'cutting_tools' or item_category == 'abrasives') else 1.0)"
      - shaped_credit: "0.0 if latest_vend_price == None else (MX(0.0, latest_vend_price - K('overstock_charge')) if fill_tier == 1 else (latest_vend_price * K('near_full_credit') if fill_tier == 2 else latest_vend_price))"
      - result: "0.0 if latest_vend_price == None else RND(shaped_credit * trial_share * return_rate_share * handling_share, 2)"
    compute_basis:
      item_sku: "The item most recently added is the item whose add entry on the machine's selection history carries the highest planogram request reference (Corbett issues these references in sequence)"
      add_date: "its start-up months are the three months after the date of that add entry"
      item_category: "The handling share follows the product category on the item's add entry"
      latest_vend_price: "the item's latest vend is its vend carrying the highest vend transaction number (the machine log numbers vends in sequence)."
      units_loaded: "the item's stock ledger is its units loaded on restock visits"
      units_vended: "less its units vended"
      units_back: "plus its units returned to the machine and credited for vend errors"
      units_out: "less its units withdrawn and its units billed as shrink, over all of the machine's records"
      stock_ledger: "the item's stock ledger is its units loaded on restock visits, less its units vended, plus its units returned to the machine and credited for vend errors, less its units withdrawn and its units billed as shrink, over all of the machine's records"
      selection_par: "the selection's par is the par on the item's selection entry carrying the highest planogram request reference"
      fill_tier: "following the item's stock ledger against the selection's par"
      trial_days: "The trial share follows the calendar days from the date of the item's add entry to today"
      trial_share: "at least the long trial days give the long-trial share, at least the mid trial days but fewer than the long ones give the mid-trial share, and fewer give a share of one."
      machine_returns: "The return-rate share follows the return lines on the machine in the three months ending today, counted by return date"
      return_rate_share: "at least the frequent-return count gives the frequent-return share, one or more but fewer give the some-returns share, and none gives a share of one."
      shaped_credit: "The fill level can replace the price in the standard unit credit, following the item's stock ledger against the selection's par, where the item's stock ledger is its units loaded on restock visits, less its units vended, plus its units returned to the machine and credited for vend errors, less its units withdrawn and its units billed as shrink, over all of the machine's records, and the selection's par is the par on the item's selection entry carrying the highest planogram request reference: when the ledger stands at or above the par, the price less the overstock handling charge for each unit, never below zero, replaces it; when the ledger stands at or above the near-full share of the par but below the par, the price multiplied by the near-full credit share replaces it; otherwise the price stands."
      handling_share: "an item in the safety and PPE category gives the PPE handling share, an item in the cutting tools or the abrasives category gives the consumable handling share, and any other item gives a share of one."
      result: "To fix the start-up unit credit, each method that applies first replaces the quantity of the standard unit credit it names, so that a charge a method subtracts comes before any share; each share that applies then multiplies the figure, and the product is rounded half up to the cent only at the end."
    factors:
      - id: fill_level_shape
        effect: method
        decides: shaped_credit
        bindings: [units_loaded, units_vended, units_back, units_out, stock_ledger, selection_par, fill_tier, shaped_credit]
        ladder:
          - when: "the item's stock ledger stands at or above the selection's par"
            method: "the price less the overstock handling charge for each unit, never below zero, replaces the price"
          - when: "the item's stock ledger stands at or above the near-full share of the par but below the par"
            method: "the price multiplied by the near-full credit share replaces the price"
          - when: "otherwise"
            method: "the price stands"
        baseline:
          shaped_credit: "latest_vend_price"
        evidence: [history]
        cross_difficulty: null
      - id: trial_length_share
        effect: parameter
        decides: trial_share
        bindings: [add_date, trial_days, trial_share]
        ladder:
          - when: "at least the long trial days have passed since the date of the item's add entry"
            value: "K('long_trial_share')"
          - when: "at least the mid trial days but fewer than the long trial days have passed since the date of the item's add entry"
            value: "K('mid_trial_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          trial_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: machine_return_rate
        effect: parameter
        decides: return_rate_share
        bindings: [machine_returns, return_rate_share]
        ladder:
          - when: "the machine carries at least the frequent-return count of return lines in the three months ending today"
            value: "K('frequent_share')"
          - when: "the machine carries one or more return lines but fewer than the frequent-return count in the three months ending today"
            value: "K('some_returns_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          return_rate_share: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: item_handling_share
        effect: parameter
        decides: handling_share
        bindings: [item_category, handling_share]
        ladder:
          - when: "the item's add entry is in the safety and PPE category"
            value: "K('ppe_handling_share')"
          - when: "the item's add entry is in the cutting tools or the abrasives category"
            value: "K('consumable_handling_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          handling_share: "1.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard unit credit is the unit price of the item's latest vend, the price paid for the returned units, rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: vending_planogram, aggregate: latest, field: sku, filters: {event_type: vending_selection_set, change_type: add_item}}
        - {table: vending_planogram, aggregate: latest, field: par_qty, filters: {event_type: vending_selection_set}}
        - {table: vending_transactions, aggregate: sum, field: quantity, filters: {event_type: vending_restocked}}
        - {table: vending_transactions, aggregate: sum, field: quantity, filters: {event_type: vending_item_issued}}
        - {table: vending_transactions, aggregate: sum, field: quantity, filters: {event_type: vending_item_returned}}
        - {table: vending_transactions, aggregate: count, field: vending_txn_id, within_months: 3, filters: {event_type: vending_item_returned}}
        - {table: vending_transactions, aggregate: latest, field: unit_price, filters: {event_type: vending_item_issued}}
      cross_category: []
  - id: vending_ext_retired_item_vend_credit
    base_policy_refs: [vending_evt_returns_and_errors, vending_evt_restock_and_shrink]
    overwrite:
      - base_policy: vending_evt_returns_and_errors
        superseded_clause: "A vend error is credited only when it is reported no later than vend_error_report_hours hours after the failed vend."
        replaced_by: "A vend error is credited only when it is reported no later than vend_error_report_hours hours after the failed vend, except that the failed vend of a retired item that Corbett finds from the item's stock ledger, for a retired item whose shortfall is no more than the units of its latest vend and only for such a vend, is credited by Corbett without a report at the late-find share of what was billed for the units it did not dispense, as figured below."
    trigger: state_due
    subject: [vending_vend_error_credited]
    computes: credit_amount
    target_tool: credit_retired_item_vends_2f4f7780
    params:
      late_find_share: 0.5
      ppe_share: 0.25
      consumable_share: 0.1
      long_delay_days: 7
      long_delay_share: 0.1
      short_delay_share: 0.05
      no_program_share: 0.1
      no_bin_share: 0.05
    rule: >-
      The retired item is the item of the customer's contract price line written as a removal carrying the highest
      change reference on the customer's agreement (removal lines are change lines, whose references Corbett issues in
      sequence); once its contract price ends Corbett loads no more of it, and the machine may still log a vend of it
      after its stock has run out, a vend that dispenses fewer units than it logs.
      A vend error is credited only when it is reported no later than vend_error_report_hours hours after the
      failed vend, except that the failed vend of a retired item that Corbett finds from the item's stock ledger, for a
      retired item whose shortfall is no more than the units of its latest vend and only for such a vend, is credited
      by Corbett without a report at the late-find share of what was billed for the units it did not dispense, as
      figured below.
      The retired item's stock ledger is its units loaded on restock visits, less its units vended, plus its units
      returned to the machine and credited for vend errors, less its units withdrawn and its units billed as shrink,
      over all of the machine's records, and its shortfall is the amount by which that ledger stands below zero, or
      zero when it does not.
      The latest vend is the retired item's vend carrying the highest vend transaction number (the machine log numbers vends in sequence); when the shortfall is above zero and
      no more than the units of the latest vend, the latest vend is the only vend that dispensed fewer units than it
      logged, and it is the failed vend.
      While the shortfall is above zero and no more than the units of the latest vend, Corbett owes one vend error
      credit against the latest vend, recording the units it did not dispense, the unit price billed on that vend and
      the credit value figured below, credited once like any vend error; a retired item without a shortfall, or
      without a vend on the machine, is owed no credit, and a retired item whose shortfall is more than the units of
      its latest vend stays under the base vend error rules.
      A credit so figured that is no larger than the model's desk limit for vend error credits is recorded from the
      machine log; a larger one waits for the next restock visit, as any larger vend error credit does.
      The standard credit value is the units of the latest vend multiplied by the unit price billed on it and by the late-find share, rounded half up to the cent.
      How the machine dispenses can replace the units of the latest vend in the standard credit value with the units the failed vend did not dispense: on a carousel or a locker machine, where the vend opens a bay or door and the employee takes what it holds, the shortfall replaces them; on a smart crib, where the scale counts every unit, the shortfall less the model's shrink tolerance percentage of the retired item's units loaded, never below zero, replaces them; on any other machine, which issues a vend whole or not at all, the units of the latest vend stand.
      The category share follows the product category on the retired item's removal line: an item in the safety and
      PPE category carries the PPE share, an item in the cutting tools or the abrasives category carries the
      consumable share, and any other item carries none.
      The delay share follows the calendar days from the date of the latest vend to today: at least the long delay
      days give the long-delay share, one or more but fewer give the short-delay share, and none gives no share.
      The backup share follows the StockSmart program whose status is active at the machine's ship-to: when there is
      no such program, the share is the no-program share; when that program carries no bin for the retired item,
      meaning its new-bin entries for the item do not outnumber its bin removal entries for the item, the share is
      the no-bin share; otherwise there is no share.
      To fix the credit value, each method that applies first replaces the quantity of the standard credit value it names; the shares that apply are then added to the late-find share, that sum never above one, so that no credit exceeds what was billed for the units the vend did not dispense, and the product is rounded half up to the cent only at the end.
    prerequisite: []
    cross_category:
      - category: pricing
        as: history
        reads: [pricing_items.sku, pricing_items.event_type, pricing_items.product_category, pricing_items.change_reference]
        note: The retired item is read from the removal line with the highest change reference; its category sets the category share.
      - category: vmi
        as: history
        reads: [vmi_program_id, status, ship_to_id, vmi_bins.event_type, vmi_bins.change_type, vmi_bins.sku]
        note: The backup share reads the active StockSmart program at the machine's ship-to and its bin entries for the retired item.
    compute:
      - retired_sku: "XLATEST('pricing', 'pricing_items', 'sku', date_field='change_reference', event_type='pricing_item_removed')"
      - retired_category: "XLATEST('pricing', 'pricing_items', 'product_category', date_field='change_reference', event_type='pricing_item_removed')"
      - units_loaded: "SUM('vending_transactions', 'quantity', event_type='vending_restocked', sku=retired_sku)"
      - units_vended: "SUM('vending_transactions', 'quantity', event_type='vending_item_issued', sku=retired_sku)"
      - units_back: "SUM('vending_transactions', 'quantity', event_type='vending_item_returned', sku=retired_sku) + SUM('vending_transactions', 'quantity', event_type='vending_vend_error_credited', sku=retired_sku)"
      - units_out: "SUM('vending_transactions', 'quantity', event_type='vending_stock_withdrawn', sku=retired_sku) + SUM('vending_transactions', 'quantity', event_type='vending_shrink_billed', sku=retired_sku)"
      - retired_ledger: "units_loaded - units_vended + units_back - units_out"
      - shortfall: "MX(0, 0 - retired_ledger)"
      - last_vend_qty: "LATEST('vending_transactions', 'quantity', date_field='txn_reference', event_type='vending_item_issued', sku=retired_sku)"
      - last_vend_price: "LATEST('vending_transactions', 'unit_price', date_field='txn_reference', event_type='vending_item_issued', sku=retired_sku)"
      - last_vend_date: "LATEST('vending_transactions', 'event_date', date_field='txn_reference', event_type='vending_item_issued', sku=retired_sku)"
      - in_scope: "shortfall > 0 and last_vend_qty != None and shortfall <= last_vend_qty"
      - machine_kind: "P('machine_type')"
      - tolerance_units: "SUM('vending_transactions', 'quantity', event_type='vending_restocked', sku=retired_sku) * P('shrink_tolerance_pct') / 100"
      - units_short: "shortfall if (machine_kind == 'carousel' or machine_kind == 'locker') else (MX(0, shortfall - tolerance_units) if machine_kind == 'smart_crib' else last_vend_qty)"
      - category_share: "K('ppe_share') if retired_category == 'safety_ppe' else (K('consumable_share') if (retired_category == 'cutting_tools' or retired_category == 'abrasives') else 0.0)"
      - delay_days: "0 if last_vend_date == None else DAYS(last_vend_date, NOW)"
      - delay_share: "K('long_delay_share') if delay_days >= K('long_delay_days') else (K('short_delay_share') if delay_days >= 1 else 0.0)"
      - backup_program: "CFIELD('vmi', 'vmi_program_id', ship_to_id=F('ship_to_id'), status='active')"
      - bins_opened: "XCOUNT('vmi', 'vmi_bins', event_type='vmi_bin_set', change_type='new_bin', sku=retired_sku, vmi_program_id=backup_program)"
      - bins_closed: "XCOUNT('vmi', 'vmi_bins', event_type='vmi_bin_removed', sku=retired_sku, vmi_program_id=backup_program)"
      - backup_share: "K('no_program_share') if backup_program == None else (K('no_bin_share') if bins_opened <= bins_closed else 0.0)"
      - credit_share: "MN(1.0, K('late_find_share') + category_share + delay_share + backup_share)"
      - result: "RND(units_short * last_vend_price * credit_share, 2) if in_scope else 0.0"
    compute_basis:
      retired_sku: "The retired item is the item of the customer's contract price line written as a removal carrying the highest change reference on the customer's agreement (removal lines are change lines, whose references Corbett issues in sequence)"
      retired_category: "The category share follows the product category on the retired item's removal line"
      units_loaded: "The retired item's stock ledger is its units loaded on restock visits"
      units_vended: "less its units vended"
      units_back: "plus its units returned to the machine and credited for vend errors"
      units_out: "less its units withdrawn and its units billed as shrink, over all of the machine's records"
      retired_ledger: "The retired item's stock ledger is its units loaded on restock visits, less its units vended, plus its units returned to the machine and credited for vend errors, less its units withdrawn and its units billed as shrink, over all of the machine's records"
      shortfall: "its shortfall is the amount by which that ledger stands below zero, or zero when it does not."
      last_vend_qty: "The latest vend is the retired item's vend carrying the highest vend transaction number (the machine log numbers vends in sequence)"
      last_vend_price: "the unit price billed on that vend"
      last_vend_date: "The delay share follows the calendar days from the date of the latest vend to today"
      in_scope: "While the shortfall is above zero and no more than the units of the latest vend, Corbett owes one vend error credit against the latest vend"
      machine_kind: "How the machine dispenses can replace the units of the latest vend in the standard credit value"
      tolerance_units: "the model's shrink tolerance percentage of the retired item's units loaded"
      units_short: "on a carousel or a locker machine, where the vend opens a bay or door and the employee takes what it holds, the shortfall replaces them; on a smart crib, where the scale counts every unit, the shortfall less the model's shrink tolerance percentage of the retired item's units loaded, never below zero, replaces them; on any other machine, which issues a vend whole or not at all, the units of the latest vend stand."
      category_share: "an item in the safety and PPE category carries the PPE share, an item in the cutting tools or the abrasives category carries the consumable share, and any other item carries none."
      delay_days: "The delay share follows the calendar days from the date of the latest vend to today"
      delay_share: "at least the long delay days give the long-delay share, one or more but fewer give the short-delay share, and none gives no share."
      backup_program: "The backup share follows the StockSmart program whose status is active at the machine's ship-to"
      bins_opened: "meaning its new-bin entries for the item do not outnumber its bin removal entries for the item"
      bins_closed: "meaning its new-bin entries for the item do not outnumber its bin removal entries for the item"
      backup_share: "when there is no such program, the share is the no-program share; when that program carries no bin for the retired item, meaning its new-bin entries for the item do not outnumber its bin removal entries for the item, the share is the no-bin share; otherwise there is no share."
      credit_share: "the shares that apply are then added to the late-find share, that sum never above one, so that no credit exceeds what was billed for the units the vend did not dispense"
      result: "To fix the credit value, each method that applies first replaces the quantity of the standard credit value it names; the shares that apply are then added to the late-find share, that sum never above one, so that no credit exceeds what was billed for the units the vend did not dispense, and the product is rounded half up to the cent only at the end."
    factors:
      - id: dispense_unit_basis
        effect: method
        decides: units_short
        bindings: [machine_kind, tolerance_units, units_short]
        ladder:
          - when: "the machine is a carousel or a locker machine"
            method: "the shortfall replaces the units of the latest vend"
          - when: "the machine is a smart crib"
            method: "the shortfall less the model's shrink tolerance percentage of the retired item's units loaded, never below zero, replaces the units of the latest vend"
          - when: "otherwise"
            method: "the units of the latest vend stand"
        baseline:
          units_short: "last_vend_qty"
        evidence: [history]
        cross_difficulty: null
      - id: category_credit_share
        effect: parameter
        decides: category_share
        bindings: [retired_category, category_share]
        ladder:
          - when: "the retired item's removal line is in the safety and PPE category"
            value: "K('ppe_share')"
          - when: "the retired item's removal line is in the cutting tools or the abrasives category"
            value: "K('consumable_share')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          category_share: "0.0"
        evidence: [cross_category]
        cross_difficulty: pricing
      - id: credit_delay_share
        effect: parameter
        decides: delay_share
        bindings: [last_vend_date, delay_days, delay_share]
        ladder:
          - when: "at least the long delay days have passed since the date of the latest vend"
            value: "K('long_delay_share')"
          - when: "one or more days but fewer than the long delay days have passed since the date of the latest vend"
            value: "K('short_delay_share')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          delay_share: "0.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: storeroom_absence_share
        effect: parameter
        decides: backup_share
        bindings: [backup_program, bins_opened, bins_closed, backup_share]
        ladder:
          - when: "no StockSmart program is active at the machine's ship-to"
            value: "K('no_program_share')"
          - when: "the active StockSmart program at the ship-to carries no bin for the retired item"
            value: "K('no_bin_share')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          backup_share: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: vmi
    baseline:
      rule: >-
        The standard credit value is the units of the latest vend multiplied by the unit price billed on it and by the late-find share, rounded half up to the cent.
      params: [late_find_share]
    inputs:
      history:
        - {table: vending_transactions, aggregate: sum, field: quantity, filters: {event_type: vending_restocked}}
        - {table: vending_transactions, aggregate: sum, field: quantity, filters: {event_type: vending_item_issued}}
        - {table: vending_transactions, aggregate: latest, field: quantity, filters: {event_type: vending_item_issued}}
        - {category: pricing, table: pricing_items, aggregate: latest, field: sku, filters: {event_type: pricing_item_removed}}
        - {category: vmi, table: vmi_bins, aggregate: count, field: vmi_bin_id, filters: {event_type: vmi_bin_set, change_type: new_bin}}
      cross_category: [pricing, vmi]
  - id: vending_ext_substitute_placement
    base_policy_refs: [vending_planogram_management]
    overwrite: []
    trigger: state_due
    subject: [vending_selection_set]
    computes: par_qty
    target_tool: place_substitute_selection_72f4b244
    params:
      weeks_in_window: 13
      ppe_allowance: 0.5
      wear_item_allowance: 0.25
      dearer_ratio: 1.25
      cheaper_ratio: 0.8
      dearer_share: 0.8
      cheaper_share: 1.2
      critical_bin_backup: 0.7
      plain_bin_backup: 0.85
      exposure_restricted: 0.5
      exposure_watch: 0.8
      order_heavy_share: 0.75
      order_light_share: 0.9
    rule: >-
      The retired item is the item of the customer's contract price line written as a removal carrying the highest
      change reference on the customer's agreement, and its substitute is the item of the customer's contract price
      line written as a Corbett-approved substitute for a discontinued item carrying the highest change reference
      (both are change lines, whose references Corbett issues in sequence).
      When the retired item still stands in a selection of the machine, its selection entry carrying the highest
      planogram request reference being an add or a par change and not a removal, and the substitute stands in no
      selection of the machine, Corbett places the substitute in the retired item's selection: it records an add entry
      from Corbett dated the day of placement, under the retired item's selection label, for the substitute's product
      category, at the par figured below; the substitute takes the retired item's place in that selection at the next
      restock visit like any other selection change, and Corbett-initiated changes never count toward the included
      changes.
      The substitute's par is fixed only after the retired item's stock ledger stands at zero or above.
      Whole months between two dates are counted as the difference in calendar months, less one when the day of the
      month of the later date is before the day of the month of the earlier date; a record counts in a stated number
      of months ending today when fewer whole months than that number, counted this way, separate its date from
      today.
      The retired item's units are its units vended from the machine in the three months ending today, less its units returned to the machine or credited for a vend error in the same three months, each record counted by its date.
      The standard par is the retired item's par, the par on the retired item's selection entry carrying the highest planogram request reference.
      How much is known of the substitute's demand can replace the retired item's par in the standard par: when the retired item's units are above zero, its average per restock interval, those units divided by the weeks in that window and by the model's scheduled restock visits per week, divided by the model's low-stock trigger percentage taken as a fraction of one hundred, replaces it; when they are not but the retired item was ever vended on the machine, the larger of two figures, the retired item's par and the quotient of its largest single vend (the largest number of its units issued in one vend on the machine at any time) by the low-stock trigger fraction, replaces it; otherwise the retired item's par stands.
      The wear allowance follows the product category on the substitute's contract price line: an item in the safety
      and PPE category carries the PPE wear allowance, an item in the cutting tools or the abrasives category carries
      the consumable wear allowance, and any other item carries none.
      The list price step compares the list price on the substitute's contract price line with the list price on the retired item's contract price line written as a new item carrying the highest change reference (Corbett issues these references in sequence): when the substitute
      lists at or above the dearer ratio of the retired item, the share is the dearer share; when it lists at or below
      the cheaper ratio, the share is the cheaper share; otherwise, or when either line carries no list price or a list price of zero, the share is one.
      The storeroom backup factor follows the StockSmart program whose status is active at the machine's ship-to:
      when that program carries a bin for the substitute, meaning its new-bin entries for the substitute outnumber its
      bin removal entries for it, and the substitute's latest bin set entry on that program, the one carrying the
      highest bin request reference, is flagged critical, the factor is the critical-bin backup factor; when that
      program carries a bin for the substitute and that entry is not flagged critical, the factor is the plain-bin
      backup factor; otherwise the factor is one.
      The consigned exposure factor follows the customer's open Commercial Credit Account, the account with no closed
      date: when that account's status is on hold or in collections, or two or more payments were returned on the
      customer's account in the twelve months ending today, the factor is the restricted exposure factor; when the
      account's status is active and exactly one payment was returned in those twelve months, the factor is the watch
      exposure factor; otherwise the factor is one; returned payments are counted by return date.
      The order channel factor follows the units of the substitute shipped on order lines to the machine's ship-to in
      the three months ending today: when those units are above zero and at least the retired item's units, the
      factor is the heavy order share; when they are above zero and below the retired item's units, the factor is the
      light order share; otherwise the factor is one.
      To fix the substitute's par, each method that applies first replaces the quantity of the standard par it names; the standard par is then multiplied by one plus the allowance that applies and by each share and factor that applies, and the product is rounded up to a whole unit only at the end.
    prerequisite:
      - problem: vending_ext_retired_item_vend_credit
        kind: value_input
        gate: retired_units
        form: state
        policy_source: "The substitute's par is fixed only after the retired item's stock ledger stands at zero or above."
        condition: "The retired item's units loaded, plus its units returned and credited for vend errors, are at least its units vended plus its units withdrawn and billed as shrink."
        resolved_by: credit_retired_item_vends_2f4f7780
        effect: "Corbett's vend error credit for the units the failed vend did not dispense takes those units out of the retired item's units of the last three months, which lowers its average per restock interval and so the sized usage the substitute's par is built on; the sizing tier stays the one for retired units above zero."
    cross_category:
      - category: pricing
        as: history
        reads: [pricing_items.sku, pricing_items.event_type, pricing_items.change_reason, pricing_items.change_reference, pricing_items.product_category, pricing_items.list_price, pricing_items.effective_date]
        note: The retired item, the substitute, the substitute's category and both list prices come from the customer's contract price lines.
      - category: vmi
        as: history
        reads: [vmi_program_id, status, ship_to_id, vmi_bins.event_type, vmi_bins.change_type, vmi_bins.sku, vmi_bins.change_reference, vmi_bins.critical_item]
        note: The storeroom backup factor reads the active StockSmart program at the machine's ship-to and its bin entries for the substitute.
      - category: credit
        as: history
        reads: [status, closed_date, credit_transactions.event_type, credit_transactions.txn_date]
        note: The consigned exposure factor reads the open credit account's status and the returned payments of the last twelve months.
      - category: order
        as: history
        reads: [order_lines.event_type, order_lines.sku, order_lines.ship_to_id, order_lines.quantity, order_lines.event_date]
        note: The order channel factor reads the substitute's units shipped to the machine's ship-to in the last three months.
    compute:
      - retired_sku: "XLATEST('pricing', 'pricing_items', 'sku', date_field='change_reference', event_type='pricing_item_removed')"
      - sub_sku: "XLATEST('pricing', 'pricing_items', 'sku', date_field='change_reference', change_reason='discontinued_substitute')"
      - sub_category: "XLATEST('pricing', 'pricing_items', 'product_category', date_field='change_reference', change_reason='discontinued_substitute')"
      - sub_list: "XLATEST('pricing', 'pricing_items', 'list_price', date_field='change_reference', change_reason='discontinued_substitute')"
      - retired_list: "XLATEST('pricing', 'pricing_items', 'list_price', date_field='change_reference', change_reason='new_item', sku=retired_sku)"
      - units_vended: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_item_issued', sku=retired_sku)"
      - units_returned: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_item_returned', sku=retired_sku)"
      - units_error: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_vend_error_credited', sku=retired_sku)"
      - retired_units: "units_vended - units_returned - units_error"
      - avg_interval: "retired_units / K('weeks_in_window') / P('restock_visits_per_week')"
      - trigger_fraction: "P('low_stock_trigger_pct') / 100"
      - retired_par: "LATEST('vending_planogram', 'par_qty', date_field='change_reference', event_type='vending_selection_set', sku=retired_sku)"
      - sub_order_units: "XSUM('order', 'order_lines', 'quantity', within_months=3, event_type='order_line_shipped', sku=sub_sku, ship_to_id=F('ship_to_id'))"
      - retired_largest: "MAX('vending_transactions', 'quantity', event_type='vending_item_issued', sku=retired_sku)"
      - sized_usage: "avg_interval / trigger_fraction if retired_units > 0 else (MX(retired_par, retired_largest / trigger_fraction) if retired_largest > 0 else retired_par)"
      - wear_allowance: "K('ppe_allowance') if sub_category == 'safety_ppe' else (K('wear_item_allowance') if (sub_category == 'cutting_tools' or sub_category == 'abrasives') else 0.0)"
      - list_ratio: "1.0 if (sub_list == None or sub_list == 0 or retired_list == None or retired_list == 0) else sub_list / retired_list"
      - price_step: "K('dearer_share') if list_ratio >= K('dearer_ratio') else (K('cheaper_share') if list_ratio <= K('cheaper_ratio') else 1.0)"
      - backup_program: "CFIELD('vmi', 'vmi_program_id', ship_to_id=F('ship_to_id'), status='active')"
      - bins_opened: "XCOUNT('vmi', 'vmi_bins', event_type='vmi_bin_set', change_type='new_bin', sku=sub_sku, vmi_program_id=backup_program)"
      - bins_closed: "XCOUNT('vmi', 'vmi_bins', event_type='vmi_bin_removed', sku=sub_sku, vmi_program_id=backup_program)"
      - bin_critical: "XLATEST('vmi', 'vmi_bins', 'critical_item', date_field='change_reference', event_type='vmi_bin_set', sku=sub_sku, vmi_program_id=backup_program)"
      - backup_factor: "K('critical_bin_backup') if (bins_opened > bins_closed and bin_critical == True) else (K('plain_bin_backup') if (bins_opened > bins_closed and bin_critical != True) else 1.0)"
      - account_status: "CFIELD('credit', 'status', closed_date='')"
      - returned_12m: "XCOUNT('credit', 'credit_transactions', within_months=12, date_field='txn_date', event_type='credit_payment_returned')"
      - exposure_factor: "K('exposure_restricted') if (account_status == 'on_hold' or account_status == 'in_collections' or returned_12m >= 2) else (K('exposure_watch') if (account_status == 'active' and returned_12m == 1) else 1.0)"
      - channel_factor: "K('order_heavy_share') if (sub_order_units > 0 and sub_order_units >= retired_units) else (K('order_light_share') if (sub_order_units > 0 and sub_order_units < retired_units) else 1.0)"
      - sized_par: "sized_usage * (1 + wear_allowance) * price_step * backup_factor * exposure_factor * channel_factor"
      - result: "int(-(-sized_par // 1))"
    compute_basis:
      retired_sku: "The retired item is the item of the customer's contract price line written as a removal carrying the highest change reference on the customer's agreement"
      sub_sku: "its substitute is the item of the customer's contract price line written as a Corbett-approved substitute for a discontinued item carrying the highest change reference"
      sub_category: "The wear allowance follows the product category on the substitute's contract price line"
      sub_list: "The list price step compares the list price on the substitute's contract price line"
      retired_list: "with the list price on the retired item's contract price line written as a new item carrying the highest change reference (Corbett issues these references in sequence)"
      units_vended: "The retired item's units are its units vended from the machine in the three months ending today"
      units_returned: "less its units returned to the machine or credited for a vend error in the same three months, each record counted by its date"
      units_error: "less its units returned to the machine or credited for a vend error in the same three months, each record counted by its date"
      retired_units: "The retired item's units are its units vended from the machine in the three months ending today, less its units returned to the machine or credited for a vend error in the same three months, each record counted by its date."
      avg_interval: "its average per restock interval, those units divided by the weeks in that window and by the model's scheduled restock visits per week"
      trigger_fraction: "divided by the model's low-stock trigger percentage taken as a fraction of one hundred"
      retired_par: "The standard par is the retired item's par, the par on the retired item's selection entry carrying the highest planogram request reference."
      sub_order_units: "The order channel factor follows the units of the substitute shipped on order lines to the machine's ship-to in the three months ending today"
      retired_largest: "the largest number of its units issued in one vend on the machine at any time"
      sized_usage: "How much is known of the substitute's demand can replace the retired item's par in the standard par: when the retired item's units are above zero, its average per restock interval, those units divided by the weeks in that window and by the model's scheduled restock visits per week, divided by the model's low-stock trigger percentage taken as a fraction of one hundred, replaces it; when they are not but the retired item was ever vended on the machine, the larger of two figures, the retired item's par and the quotient of its largest single vend (the largest number of its units issued in one vend on the machine at any time) by the low-stock trigger fraction, replaces it; otherwise the retired item's par stands."
      wear_allowance: "an item in the safety and PPE category carries the PPE wear allowance, an item in the cutting tools or the abrasives category carries the consumable wear allowance, and any other item carries none."
      list_ratio: "The list price step compares the list price on the substitute's contract price line with the list price on the retired item's contract price line written as a new item carrying the highest change reference (Corbett issues these references in sequence)"
      price_step: "when the substitute lists at or above the dearer ratio of the retired item, the share is the dearer share; when it lists at or below the cheaper ratio, the share is the cheaper share; otherwise, or when either line carries no list price or a list price of zero, the share is one."
      backup_program: "The storeroom backup factor follows the StockSmart program whose status is active at the machine's ship-to"
      bins_opened: "meaning its new-bin entries for the substitute outnumber its bin removal entries for it"
      bins_closed: "meaning its new-bin entries for the substitute outnumber its bin removal entries for it"
      bin_critical: "the substitute's latest bin set entry on that program, the one carrying the highest bin request reference, is flagged critical"
      backup_factor: "the factor is the critical-bin backup factor; when that program carries a bin for the substitute and that entry is not flagged critical, the factor is the plain-bin backup factor; otherwise the factor is one."
      account_status: "The consigned exposure factor follows the customer's open Commercial Credit Account, the account with no closed date"
      returned_12m: "two or more payments were returned on the customer's account in the twelve months ending today"
      exposure_factor: "when that account's status is on hold or in collections, or two or more payments were returned on the customer's account in the twelve months ending today, the factor is the restricted exposure factor; when the account's status is active and exactly one payment was returned in those twelve months, the factor is the watch exposure factor; otherwise the factor is one; returned payments are counted by return date."
      channel_factor: "when those units are above zero and at least the retired item's units, the factor is the heavy order share; when they are above zero and below the retired item's units, the factor is the light order share; otherwise the factor is one."
      sized_par: "To fix the substitute's par, each method that applies first replaces the quantity of the standard par it names; the standard par is then multiplied by one plus the allowance that applies and by each share and factor that applies"
      result: "and the product is rounded up to a whole unit only at the end."
    factors:
      - id: substitute_demand_basis
        effect: method
        decides: sized_usage
        bindings: [avg_interval, trigger_fraction, retired_largest, sized_usage]
        ladder:
          - when: "the retired item's units in the three months ending today are above zero"
            method: "the retired item's average per restock interval divided by the low-stock trigger fraction replaces the retired item's par"
          - when: "the retired item has no units in the three months ending today but was vended on the machine before"
            method: "the larger of two figures, the retired item's par and the quotient of its largest single vend by the low-stock trigger fraction, replaces the retired item's par"
          - when: "otherwise"
            method: "the retired item's par stands"
        baseline:
          sized_usage: "retired_par"
        evidence: [history]
        cross_difficulty: null
      - id: substitute_wear_allowance
        effect: parameter
        decides: wear_allowance
        bindings: [sub_category, wear_allowance]
        ladder:
          - when: "the substitute's contract price line is in the safety and PPE category"
            value: "K('ppe_allowance')"
          - when: "the substitute's contract price line is in the cutting tools or the abrasives category"
            value: "K('wear_item_allowance')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          wear_allowance: "0.0"
        evidence: [cross_category]
        cross_difficulty: pricing
      - id: list_price_step
        effect: parameter
        decides: price_step
        bindings: [sub_list, retired_list, list_ratio, price_step]
        ladder:
          - when: "the substitute lists at or above the dearer ratio of the retired item's list price"
            value: "K('dearer_share')"
          - when: "the substitute lists at or below the cheaper ratio of the retired item's list price"
            value: "K('cheaper_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          price_step: "1.0"
        evidence: [cross_category]
        cross_difficulty: pricing
      - id: substitute_bin_backup
        effect: parameter
        decides: backup_factor
        bindings: [backup_program, bins_opened, bins_closed, bin_critical, backup_factor]
        ladder:
          - when: "the active StockSmart program at the ship-to carries a bin for the substitute and its latest bin set entry is flagged critical"
            value: "K('critical_bin_backup')"
          - when: "the active StockSmart program at the ship-to carries a bin for the substitute and its latest bin set entry is not flagged critical"
            value: "K('plain_bin_backup')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          backup_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: vmi
      - id: placement_exposure_limit
        effect: parameter
        decides: exposure_factor
        bindings: [account_status, returned_12m, exposure_factor]
        ladder:
          - when: "the open credit account is on hold or in collections, or two or more payments were returned in the last twelve months"
            value: "K('exposure_restricted')"
          - when: "the open credit account is active and exactly one payment was returned in the last twelve months"
            value: "K('exposure_watch')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          exposure_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: credit
      - id: placement_order_channel
        effect: parameter
        decides: channel_factor
        bindings: [sub_order_units, channel_factor]
        ladder:
          - when: "units of the substitute shipped on order lines to the ship-to in the last three months are above zero and at least the retired item's units"
            value: "K('order_heavy_share')"
          - when: "units of the substitute shipped on order lines to the ship-to in the last three months are above zero and below the retired item's units"
            value: "K('order_light_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          channel_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: order
    baseline:
      rule: >-
        The standard par is the retired item's par, the par on the retired item's selection entry carrying the highest planogram request reference.
      params: []
    inputs:
      history:
        - {table: vending_planogram, aggregate: latest, field: par_qty, filters: {event_type: vending_selection_set}}
        - {table: vending_transactions, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: vending_item_issued}}
        - {table: vending_transactions, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: vending_vend_error_credited}}
        - {category: pricing, table: pricing_items, aggregate: latest, field: sku, filters: {change_reason: discontinued_substitute}}
        - {category: vmi, table: vmi_bins, aggregate: count, field: vmi_bin_id, filters: {event_type: vmi_bin_set, change_type: new_bin}}
        - {category: credit, table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_payment_returned}}
        - {category: order, table: order_lines, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: order_line_shipped}}
      cross_category: [pricing, vmi, credit, order]
  - id: vending_ext_substitute_par_setting
    base_policy_refs: [vending_planogram_management]
    overwrite:
      - base_policy: vending_planogram_management
        superseded_clause: "The customer may ask to add items, change par quantities or remove items at any time on an active machine; changes take effect at the next restock visit."
        replaced_by: "The customer may ask to add items, change par quantities or remove items at any time on an active machine, except that a par change the customer asks for on the selection of a Corbett-placed substitute in its first three months, and only such a change, is set at the substitute settling par figured below rather than at a par the customer names; changes take effect at the next restock visit."
    trigger: on_request
    subject: [vending_selection_set]
    computes: par_qty
    target_tool: set_substitute_selection_par_5d8137ae
    params:
      weeks_in_window: 13
      settling_days: 28
      ppe_allowance: 0.5
      wear_item_allowance: 0.25
      critical_bin_backup: 0.7
      plain_bin_backup: 0.85
      exposure_restricted: 0.5
      exposure_watch: 0.8
      high_value_price: 25
      mid_value_price: 5
      high_value_share: 0.8
      mid_value_share: 0.9
      order_heavy_share: 0.75
      order_light_share: 0.9
    rule: >-
      The customer may ask to add items, change par quantities or remove items at any time on an active machine,
      except that a par change the customer asks for on the selection of a Corbett-placed substitute in its first
      three months, and only such a change, is set at the substitute settling par figured below rather than at a par
      the customer names; changes take effect at the next restock visit.
      The newest item is the item whose add entry on the machine's selection history carries the highest planogram
      request reference (Corbett issues these references in sequence); it is a Corbett-placed substitute when that add
      entry is from Corbett and the item carries, on the customer's agreement, a contract price line written as a
      Corbett-approved substitute for a discontinued item, and its first three months are the three months after the
      date of that add entry; the retired item it replaces is the item of the customer's contract price line written
      as a removal carrying the highest change reference (removal lines are change lines, whose references Corbett
      issues in sequence).
      The par change is the customer's own act: the customer records a par change entry from the customer on that
      selection, dated the day of the request, at the settling par, and it counts toward the included changes like
      any other change the customer asks for.
      A par change on the selection of a Corbett-placed substitute is fixed only after the substitute stands in the
      retired item's selection as an add entry from Corbett.
      Whole months between two dates are counted as the difference in calendar months, less one when the day of the
      month of the later date is before the day of the month of the earlier date; a record counts in a stated number
      of months ending today when fewer whole months than that number, counted this way, separate its date from
      today.
      The selection's units are the units of the substitute and of the retired item vended from the machine in the
      three months ending today, less the units of either returned to the machine or credited for a vend error in the
      same three months, each record counted by its date, and its average per restock interval is those units divided
      by the weeks in that window and by the model's scheduled restock visits per week.
      The selection's demand pattern can replace the average per restock interval in the standard par, where the substitute's starter par is the par on its add entry and the largest single vend is the largest number of units of the substitute or of the retired item issued in one vend on the machine at any time: when fewer calendar days than the settling period have passed since the date of the substitute's add entry, the larger of two figures, the average per restock interval and the product of the starter par and the low-stock trigger fraction, replaces it; when the settling period has passed and the largest single vend is at least the average per restock interval, the larger of the average per restock interval and the largest single vend replaces it; otherwise the average per restock interval stands.
      The wear allowance follows the product category on the substitute's add entry: an item in the safety and PPE
      category carries the PPE wear allowance, an item in the cutting tools or the abrasives category carries the
      consumable wear allowance, and any other item carries none.
      The storeroom backup factor follows the StockSmart program whose status is active at the machine's ship-to:
      when that program carries a bin for the substitute, meaning its new-bin entries for the substitute outnumber its
      bin removal entries for it, and the substitute's latest bin set entry on that program, the one carrying the
      highest bin request reference, is flagged critical, the factor is the critical-bin backup factor; when that
      program carries a bin for the substitute and that entry is not flagged critical, the factor is the plain-bin
      backup factor; otherwise the factor is one.
      The consigned exposure factor follows the customer's open Commercial Credit Account, the account with no closed
      date: when that account's status is on hold or in collections, or two or more payments were returned on the
      customer's account in the twelve months ending today, the factor is the restricted exposure factor; when the
      account's status is active and exactly one payment was returned in those twelve months, the factor is the watch
      exposure factor; otherwise the factor is one; returned payments are counted by return date.
      The stock value share follows the contract unit price on the substitute's contract price line written as a Corbett-approved substitute carrying the highest change reference: at or above the high value price the share is the
      high-value share, at or above the mid value price but below the high one the share is the mid-value share, and
      below it, or for an item with no such line, the share is one.
      The order channel factor follows the units of the substitute shipped on order lines to the machine's ship-to in
      the three months ending today: when those units are above zero and at least the selection's units, the factor
      is the heavy order share; when they are above zero and below the selection's units, the factor is the light
      order share; otherwise the factor is one.
      The standard par is the selection's average per restock interval divided by the model's low-stock trigger percentage taken as a fraction of one hundred, rounded up to a whole unit.
      To fix the settling par, each method that applies first replaces the quantity of the standard par it names; the standard par before its rounding is then multiplied by one plus the allowance that applies and by each share and factor that applies, and the result is rounded up to a whole unit only at the end.
    prerequisite:
      - problem: vending_ext_substitute_placement
        kind: value_input
        gate: interval_usage
        form: state
        policy_source: "A par change on the selection of a Corbett-placed substitute is fixed only after the substitute stands in the retired item's selection as an add entry from Corbett."
        condition: "The selection history carries an add entry from Corbett for the substitute under the retired item's selection label."
        resolved_by: place_substitute_selection_72f4b244
        effect: "Corbett's add entry makes the substitute the newest item, inside its settling period, with the placement's par as its starter par; the demand pattern moves to the settling tier, where the interval usage is the larger of two figures, the average per restock interval and the product of the starter par and the low-stock trigger fraction, and the starter par figure is the larger of the two."
    cross_category:
      - category: pricing
        as: history
        reads: [pricing_items.sku, pricing_items.event_type, pricing_items.change_reason, pricing_items.change_reference, pricing_items.contract_unit_price, pricing_items.effective_date]
        note: The retired item and the substitute's current contract unit price come from the customer's contract price lines.
      - category: vmi
        as: history
        reads: [vmi_program_id, status, ship_to_id, vmi_bins.event_type, vmi_bins.change_type, vmi_bins.sku, vmi_bins.change_reference, vmi_bins.critical_item]
        note: The storeroom backup factor reads the active StockSmart program at the machine's ship-to and its bin entries for the substitute.
      - category: credit
        as: history
        reads: [status, closed_date, credit_transactions.event_type, credit_transactions.txn_date]
        note: The consigned exposure factor reads the open credit account's status and the returned payments of the last twelve months.
      - category: order
        as: history
        reads: [order_lines.event_type, order_lines.sku, order_lines.ship_to_id, order_lines.quantity, order_lines.event_date]
        note: The order channel factor reads the substitute's units shipped to the machine's ship-to in the last three months.
    compute:
      - new_sku: "LATEST('vending_planogram', 'sku', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - add_date: "LATEST('vending_planogram', 'event_date', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - new_category: "LATEST('vending_planogram', 'product_category', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - starter_par: "LATEST('vending_planogram', 'par_qty', date_field='change_reference', event_type='vending_selection_set', change_type='add_item')"
      - retired_sku: "XLATEST('pricing', 'pricing_items', 'sku', date_field='change_reference', event_type='pricing_item_removed')"
      - units_vended: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_item_issued', sku=new_sku) + SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_item_issued', sku=retired_sku)"
      - units_returned: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_item_returned', sku=new_sku) + SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_item_returned', sku=retired_sku)"
      - units_error: "SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_vend_error_credited', sku=new_sku) + SUM('vending_transactions', 'quantity', within_months=3, event_type='vending_vend_error_credited', sku=retired_sku)"
      - selection_units: "units_vended - units_returned - units_error"
      - avg_interval: "selection_units / K('weeks_in_window') / P('restock_visits_per_week')"
      - trigger_fraction: "P('low_stock_trigger_pct') / 100"
      - days_since_add: "DAYS(add_date, NOW)"
      - largest_vend: "MX(MAX('vending_transactions', 'quantity', event_type='vending_item_issued', sku=new_sku), MAX('vending_transactions', 'quantity', event_type='vending_item_issued', sku=retired_sku))"
      - interval_usage: "MX(avg_interval, starter_par * trigger_fraction) if days_since_add < K('settling_days') else (MX(avg_interval, largest_vend) if largest_vend >= avg_interval else avg_interval)"
      - wear_allowance: "K('ppe_allowance') if new_category == 'safety_ppe' else (K('wear_item_allowance') if (new_category == 'cutting_tools' or new_category == 'abrasives') else 0.0)"
      - backup_program: "CFIELD('vmi', 'vmi_program_id', ship_to_id=F('ship_to_id'), status='active')"
      - bins_opened: "XCOUNT('vmi', 'vmi_bins', event_type='vmi_bin_set', change_type='new_bin', sku=new_sku, vmi_program_id=backup_program)"
      - bins_closed: "XCOUNT('vmi', 'vmi_bins', event_type='vmi_bin_removed', sku=new_sku, vmi_program_id=backup_program)"
      - bin_critical: "XLATEST('vmi', 'vmi_bins', 'critical_item', date_field='change_reference', event_type='vmi_bin_set', sku=new_sku, vmi_program_id=backup_program)"
      - backup_factor: "K('critical_bin_backup') if (bins_opened > bins_closed and bin_critical == True) else (K('plain_bin_backup') if (bins_opened > bins_closed and bin_critical != True) else 1.0)"
      - account_status: "CFIELD('credit', 'status', closed_date='')"
      - returned_12m: "XCOUNT('credit', 'credit_transactions', within_months=12, date_field='txn_date', event_type='credit_payment_returned')"
      - exposure_factor: "K('exposure_restricted') if (account_status == 'on_hold' or account_status == 'in_collections' or returned_12m >= 2) else (K('exposure_watch') if (account_status == 'active' and returned_12m == 1) else 1.0)"
      - sub_price: "XLATEST('pricing', 'pricing_items', 'contract_unit_price', date_field='change_reference', change_reason='discontinued_substitute', sku=new_sku)"
      - value_share: "K('high_value_share') if (sub_price != None and sub_price >= K('high_value_price')) else (K('mid_value_share') if (sub_price != None and sub_price >= K('mid_value_price')) else 1.0)"
      - order_units: "XSUM('order', 'order_lines', 'quantity', within_months=3, event_type='order_line_shipped', sku=new_sku, ship_to_id=F('ship_to_id'))"
      - channel_factor: "K('order_heavy_share') if (order_units > 0 and order_units >= selection_units) else (K('order_light_share') if (order_units > 0 and order_units < selection_units) else 1.0)"
      - sized_units: "interval_usage * (1 + wear_allowance) * backup_factor * exposure_factor * value_share * channel_factor / trigger_fraction"
      - result: "int(-(-sized_units // 1))"
    compute_basis:
      new_sku: "The newest item is the item whose add entry on the machine's selection history carries the highest planogram request reference (Corbett issues these references in sequence)"
      add_date: "fewer calendar days than the settling period have passed since the date of the substitute's add entry"
      new_category: "The wear allowance follows the product category on the substitute's add entry"
      starter_par: "the substitute's starter par is the par on its add entry"
      retired_sku: "the retired item it replaces is the item of the customer's contract price line written as a removal carrying the highest change reference (removal lines are change lines, whose references Corbett issues in sequence)."
      units_vended: "The selection's units are the units of the substitute and of the retired item vended from the machine in the three months ending today"
      units_returned: "less the units of either returned to the machine or credited for a vend error in the same three months, each record counted by its date"
      units_error: "less the units of either returned to the machine or credited for a vend error in the same three months, each record counted by its date"
      selection_units: "The selection's units are the units of the substitute and of the retired item vended from the machine in the three months ending today, less the units of either returned to the machine or credited for a vend error in the same three months, each record counted by its date"
      avg_interval: "its average per restock interval is those units divided by the weeks in that window and by the model's scheduled restock visits per week."
      trigger_fraction: "The standard par is the selection's average per restock interval divided by the model's low-stock trigger percentage taken as a fraction of one hundred"
      days_since_add: "fewer calendar days than the settling period have passed since the date of the substitute's add entry"
      largest_vend: "the largest single vend is the largest number of units of the substitute or of the retired item issued in one vend on the machine at any time"
      interval_usage: "The selection's demand pattern can replace the average per restock interval in the standard par, where the substitute's starter par is the par on its add entry and the largest single vend is the largest number of units of the substitute or of the retired item issued in one vend on the machine at any time: when fewer calendar days than the settling period have passed since the date of the substitute's add entry, the larger of two figures, the average per restock interval and the product of the starter par and the low-stock trigger fraction, replaces it; when the settling period has passed and the largest single vend is at least the average per restock interval, the larger of the average per restock interval and the largest single vend replaces it; otherwise the average per restock interval stands."
      wear_allowance: "an item in the safety and PPE category carries the PPE wear allowance, an item in the cutting tools or the abrasives category carries the consumable wear allowance, and any other item carries none."
      backup_program: "The storeroom backup factor follows the StockSmart program whose status is active at the machine's ship-to"
      bins_opened: "meaning its new-bin entries for the substitute outnumber its bin removal entries for it"
      bins_closed: "meaning its new-bin entries for the substitute outnumber its bin removal entries for it"
      bin_critical: "the substitute's latest bin set entry on that program, the one carrying the highest bin request reference, is flagged critical"
      backup_factor: "the factor is the critical-bin backup factor; when that program carries a bin for the substitute and that entry is not flagged critical, the factor is the plain-bin backup factor; otherwise the factor is one."
      account_status: "The consigned exposure factor follows the customer's open Commercial Credit Account, the account with no closed date"
      returned_12m: "two or more payments were returned on the customer's account in the twelve months ending today"
      exposure_factor: "when that account's status is on hold or in collections, or two or more payments were returned on the customer's account in the twelve months ending today, the factor is the restricted exposure factor; when the account's status is active and exactly one payment was returned in those twelve months, the factor is the watch exposure factor; otherwise the factor is one; returned payments are counted by return date."
      sub_price: "The stock value share follows the contract unit price on the substitute's contract price line written as a Corbett-approved substitute carrying the highest change reference"
      value_share: "at or above the high value price the share is the high-value share, at or above the mid value price but below the high one the share is the mid-value share, and below it, or for an item with no such line, the share is one."
      order_units: "The order channel factor follows the units of the substitute shipped on order lines to the machine's ship-to in the three months ending today"
      channel_factor: "when those units are above zero and at least the selection's units, the factor is the heavy order share; when they are above zero and below the selection's units, the factor is the light order share; otherwise the factor is one."
      sized_units: "To fix the settling par, each method that applies first replaces the quantity of the standard par it names; the standard par before its rounding is then multiplied by one plus the allowance that applies and by each share and factor that applies"
      result: "and the result is rounded up to a whole unit only at the end."
    factors:
      - id: settling_demand_basis
        effect: method
        decides: interval_usage
        bindings: [add_date, days_since_add, starter_par, largest_vend, interval_usage]
        ladder:
          - when: "fewer calendar days than the settling period have passed since the date of the substitute's add entry"
            method: "the larger of two figures, the average per restock interval and the product of the starter par and the low-stock trigger fraction, replaces the average per restock interval"
          - when: "the settling period has passed and the largest single vend is at least the average per restock interval"
            method: "the larger of the average per restock interval and the largest single vend replaces the average per restock interval"
          - when: "otherwise"
            method: "the average per restock interval stands"
        baseline:
          interval_usage: "avg_interval"
        evidence: [history, date]
        cross_difficulty: null
      - id: settling_wear_allowance
        effect: parameter
        decides: wear_allowance
        bindings: [new_category, wear_allowance]
        ladder:
          - when: "the substitute's add entry is in the safety and PPE category"
            value: "K('ppe_allowance')"
          - when: "the substitute's add entry is in the cutting tools or the abrasives category"
            value: "K('wear_item_allowance')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          wear_allowance: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: settling_bin_backup
        effect: parameter
        decides: backup_factor
        bindings: [backup_program, bins_opened, bins_closed, bin_critical, backup_factor]
        ladder:
          - when: "the active StockSmart program at the ship-to carries a bin for the substitute and its latest bin set entry is flagged critical"
            value: "K('critical_bin_backup')"
          - when: "the active StockSmart program at the ship-to carries a bin for the substitute and its latest bin set entry is not flagged critical"
            value: "K('plain_bin_backup')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          backup_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: vmi
      - id: settling_exposure_limit
        effect: parameter
        decides: exposure_factor
        bindings: [account_status, returned_12m, exposure_factor]
        ladder:
          - when: "the open credit account is on hold or in collections, or two or more payments were returned in the last twelve months"
            value: "K('exposure_restricted')"
          - when: "the open credit account is active and exactly one payment was returned in the last twelve months"
            value: "K('exposure_watch')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          exposure_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: credit
      - id: stock_value_share
        effect: parameter
        decides: value_share
        bindings: [sub_price, value_share]
        ladder:
          - when: "the contract unit price on the substitute's line is at or above the high value price"
            value: "K('high_value_share')"
          - when: "the contract unit price on the substitute's line is at or above the mid value price but below the high value price"
            value: "K('mid_value_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          value_share: "1.0"
        evidence: [cross_category]
        cross_difficulty: pricing
      - id: settling_order_channel
        effect: parameter
        decides: channel_factor
        bindings: [order_units, channel_factor]
        ladder:
          - when: "units of the substitute shipped on order lines to the ship-to in the last three months are above zero and at least the selection's units"
            value: "K('order_heavy_share')"
          - when: "units of the substitute shipped on order lines to the ship-to in the last three months are above zero and below the selection's units"
            value: "K('order_light_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          channel_factor: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: order
    baseline:
      rule: >-
        Whole months between two dates are counted as the difference in calendar months, less one when the day of the month of the later date is before the day of the month of the earlier date; a record counts in a stated number of months ending today when fewer whole months than that number, counted this way, separate its date from today.
        The selection's units are the units of the substitute and of the retired item vended from the machine in the
        three months ending today, less the units of either returned to the machine or credited for a vend error in the
        same three months, each record counted by its date, and its average per restock interval is those units divided
        by the weeks in that window and by the model's scheduled restock visits per week.
        The standard par is the selection's average per restock interval divided by the model's low-stock trigger percentage taken as a fraction of one hundred, rounded up to a whole unit.
      params: [weeks_in_window, restock_visits_per_week, low_stock_trigger_pct]
    inputs:
      history:
        - {table: vending_planogram, aggregate: latest, field: sku, filters: {event_type: vending_selection_set, change_type: add_item}}
        - {table: vending_transactions, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: vending_item_issued}}
        - {table: vending_transactions, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: vending_vend_error_credited}}
        - {table: vending_transactions, aggregate: max, field: quantity, filters: {event_type: vending_item_issued}}
        - {category: vmi, table: vmi_bins, aggregate: count, field: vmi_bin_id, filters: {event_type: vmi_bin_set, change_type: new_bin}}
        - {category: credit, table: credit_transactions, aggregate: count, field: credit_txn_id, within_months: 12, filters: {event_type: credit_payment_returned}}
        - {category: pricing, table: pricing_items, aggregate: latest, field: contract_unit_price, filters: {}}
        - {category: order, table: order_lines, aggregate: sum, field: quantity, within_months: 3, filters: {event_type: order_line_shipped}}
      cross_category: [vmi, credit, pricing, order]
