name: env_0069_managed_it_services_provider
company: Stratton Bay Technology Partners

background: |
  Stratton Bay Technology Partners is a managed IT and cybersecurity services provider headquartered in Richmond, Virginia, with branch offices in Raleigh and Baltimore, a 24x7 network operations center and a security operations center staffed by about 230 engineers, analysts and client success staff.
  It serves roughly 640 business clients across the Mid-Atlantic, mostly professional services firms, medical and dental practices, manufacturers, nonprofits and regional financial offices with 15 to 600 employees, and its client services desk speaks in a practical, plain-English tone to office managers, controllers and IT leads.
  The core relationship is a ClearPath Managed IT Services agreement, held per client and billed monthly per covered user seat on one of six tiers: ClearPath Monitor, ClearPath Essentials, ClearPath Standard, ClearPath Professional, ClearPath Premier and ClearPath Enterprise.
  Each ClearPath agreement keeps a seat ledger of named users onboarded and offboarded, a billing ledger of monthly fees, prorated seat charges, billable labor, service credits and payments, and a ticket history of every service desk request with its priority, first response and resolution.
  Security is sold as a Sentinel Managed Security subscription billed per enrolled workstation and server on the tiers Sentinel EDR Essentials, Sentinel MDR Standard, Sentinel MDR Advanced, Sentinel MDR Complete, Sentinel XDR Premier and Sentinel XDR Enterprise, with SOC incident records and an incident response hours ledger.
  Backup and disaster recovery is sold as a Continuum Backup & Recovery plan per protected server, workstation and Microsoft 365 user on the tiers Continuum Backup Basic, Continuum Backup Standard, Continuum Backup Plus, Continuum BDR, Continuum DRaaS and Continuum DRaaS Premier, recording restore jobs, failovers and failover server-days.
  As a Microsoft Cloud Solution Provider, Stratton Bay resells Microsoft 365 subscriptions under new-commerce terms in the plans Microsoft 365 Business Basic, Microsoft 365 F3, Microsoft 365 Business Standard, Microsoft 365 Business Premium, Microsoft 365 E3 (no Teams) and Microsoft 365 E5 (no Teams), each subscription carrying its own term, billing frequency, license quantity changes and billing cycles.
  Work outside an agreement can be prepaid through TimeBank Prepaid Service Hours, sold as the TimeBank 10-Hour Block, TimeBank 20-Hour Block, TimeBank 40-Hour Block, TimeBank 80-Hour Block, TimeBank 160-Hour Block and TimeBank 320-Hour Block, whose hours ledgers record grants, draws against tickets and statements of work, reversals, rollovers and forfeitures.
  Larger work is delivered as Professional Services Projects under statements of work classed as Assessment Engagement, Quick Start Project, Standard Project, Advanced Project, Major Project or Strategic Program, each engagement carrying milestones, logged time, change orders and its own invoices.
  Hardware Procurement handles quoted orders for one product line at a time, typed as Accessory & Peripheral Order, Standard Endpoint Order, Staged Endpoint Order, Network Equipment Order, Server & Storage Build Order or Special-Order Equipment, each moving from quote through approval, purchase order, shipment and delivery, with return and dead-on-arrival records.
  Every client keeps one profile with its legal name, primary authorized contact, registered phone and email, the last four digits of its federal EIN, a verbal support PIN, its billing state, any declared compliance framework and the date the relationship began.
  A typical client holds one ClearPath agreement and one Sentinel subscription, a handful of Microsoft 365 subscriptions on different plans and terms, a Continuum plan for its servers, often a TimeBank block, and a history of hardware orders and one or two projects.
  Callers are usually the authorized contact or an office manager phoning about new hires and departures, invoice lines they do not recognise, slow ticket responses, license counts, an upcoming renewal, a project change, or a laptop order that arrived wrong.
  They bring years of event history with them: seat changes and true-ups, partial payments and late fees, reprioritised tickets, earlier credits, renewed and upgraded subscriptions, rolled-over hours, signed and lapsed change orders, and returned or replaced equipment.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: managed_services_agreements
    claim:
      categories: [managed]
      event_types: [managed_seat_add, managed_seat_remove, managed_proration_charge, managed_monthly_fee, managed_billable_labor, managed_sla_credit, managed_credit_memo, managed_late_fee, managed_payment, managed_ticket_opened, managed_ticket_reprioritized, managed_ticket_first_response, managed_ticket_resolved, managed_tier_changed, managed_renewed, managed_notice_given, managed_notice_withdrawn, managed_early_termination_fee]
    summary: >
      Authorized contacts of ClearPath clients call about the per-seat agreement itself: onboarding a new hire or
      offboarding a departing employee, an invoice that seems to bill too many seats or a stray prorated line, labor
      charged on a ticket they thought was covered, a slow response they want credited, an upcoming renewal price, a tier
      upgrade, or a notice to leave; the setting varies with the tier held, the agreement's status (active, suspended,
      under notice, offboarding), the term position and seat commitment, other holdings such as a Sentinel subscription or
      an active TimeBank block, and a history of seat changes, partial payments, reprioritised tickets and earlier credits.
      The records involved are the agreement, its seat ledger, billing ledger, ticket milestones and contract change
      requests, governed by state gates on which statuses accept seat changes, fees, credits and tier changes
      (managed_seat_changes_and_proration, managed_monthly_fee_calc, managed_tier_change), by quantitative rules that vary
      by tier — the minimum-commitment floor and per-seat billing (managed_monthly_fee_calc), daily proration of added seats
      (managed_seat_changes_and_proration), coverage windows, rounding, after-hours multipliers, included onsite hours and
      the TimeBank route for billable labor (managed_billable_labor_rates), response targets, the claim window, per-breach
      percentage and monthly cap of service credits (managed_sla_response_credit), late fees, courtesy waivers and
      suspension thresholds (managed_late_fee_and_suspension), renewal uplift and notice deadlines
      (managed_renewal_and_uplift), and early termination fees (managed_early_termination_and_exit).
      In the natural order of the domain a user is onboarded under a ticket before the seat is added and prorated, a ticket
      is opened and first answered before any credit can be measured, a fee is invoiced before it can be paid or waived,
      and a notice is received before an effective date or fee exists.
      The agent verifies the caller, reads the agreement, ledgers and tickets, and itself posts seat changes, proration and
      labor charges, service credits, payments and courtesy credit memos, while notices of non-renewal or early
      termination, notice withdrawals and tier changes are the client's own contract commitments that the agent registers
      for the authorized contact's e-signature (managed_client_signed_changes) rather than applying itself.
      Requests no ClearPath rule decides — negotiating a custom rate or a credit for a missed resolution target beyond the
      charter, waiving an early termination fee outright, refunding unapplied service credits in cash, or disputing the
      service desk's scope or priority determination itself — are outside policy, and the only correct route for them is a
      POLICY_NOT_COVERED handoff.

  - name: microsoft_365_subscriptions
    claim:
      categories: [licensing]
      event_types: [licensing_subscription_purchased, licensing_licenses_added, licensing_licenses_removed, licensing_prorated_charge, licensing_refund_credit, licensing_cancelled_in_window, licensing_cycle_charge, licensing_renewal_settings_changed, licensing_renewed, licensing_expired, licensing_upgraded, licensing_admin_fee, licensing_payment, licensing_late_fee]
    summary: >
      Client contacts call about the Microsoft 365 subscriptions Stratton Bay resells: adding licenses for new staff,
      removing licenses bought by mistake, cancelling a subscription bought last week, lowering the count or switching the
      term at renewal, turning auto-renew off, upgrading a plan, or questioning a prorated charge or an administration fee;
      the setting varies with the plan, the term type and billing frequency of each subscription, how many subscriptions of
      which plans the tenant carries, whether the client's ClearPath tier covers Microsoft 365 administration, and a history
      of purchases, seat additions, renewals, upgrades and suspensions.
      The records involved are the subscriptions, their license quantity changes, billing ledger and order-form requests,
      governed by elapsed-hour windows anchored on the purchase or renewal moment and on each seat addition for any
      cancellation or reduction (licensing_cancellation_window), the renewal-change cutoff and current-price renewal
      (licensing_renewal_and_expiry), the tenant-wide cap per Business plan (licensing_agg_tenant_plan_cap), plan-specific
      prices with the monthly-term premium and monthly-billing surcharge and billing-cycle charges
      (licensing_purchase_and_pricing), daily proration over the billing cycle for additions and upgrades
      (licensing_seat_additions, licensing_upgrades), and the administration fee and its waiver (licensing_admin_fee_rules).
      In the natural order of the domain a subscription is purchased and provisioned before licenses can be added, a seat
      addition exists before its own reduction window can run, a renewal setting is saved before the renewal date that
      applies it, and a charge exists before it can be refunded.
      The agent verifies the caller and itself places seat additions and in-window reductions on a verified authorized
      contact's instruction and posts the corresponding charges and refunds, while new subscriptions, cancellations,
      renewal changes and upgrades commit the client's money and are registered as order forms for the authorized
      contact's signature (licensing_client_authorization).
      Requests outside every licensing rule — reducing committed licenses after the windows have closed, a partial-quantity
      upgrade, a mid-term downgrade, an exception to Microsoft's frontline-only or seat-cap terms, or restoring deleted
      tenant data — cannot be granted by policy, and the only correct route for them is a POLICY_NOT_COVERED handoff.

  - name: prepaid_service_hours
    claim:
      categories: [timebank]
      event_types: [timebank_block_ordered, timebank_block_invoice, timebank_block_activated, timebank_hours_granted, timebank_hours_drawn, timebank_overage_charge, timebank_draw_reversed, timebank_block_restored, timebank_block_depleted, timebank_hours_rolled_out, timebank_hours_rolled_in, timebank_block_expired, timebank_hours_forfeited, timebank_block_extended, timebank_extension_fee, timebank_settings_changed, timebank_order_cancelled, timebank_order_credit]
    summary: >
      Clients with prepaid TimeBank blocks call to buy or top up hours, to ask why a visit consumed more hours than the clock
      showed, to dispute a draw, to keep hours that are about to expire by extending a block or rolling them into a new one,
      to switch auto-replenish on or off, or about an overage invoice; the setting varies with the size of each block, how
      many blocks the client holds and their expiry dates and balances, whether the client also holds an active ClearPath
      agreement and at which tier, and a history of draws on service desk tickets and time-and-materials statements of work,
      earlier reversals, rollovers and depletions.
      The records involved are the blocks, their hours ledger, billing ledger and order-form requests, governed by the
      earliest-expiry-first draw order across blocks and overage billing with its monthly approval cap
      (timebank_agg_draw_order), the per-size conversion of worked minutes through rounding, minimums, resource ratios,
      time-band multipliers and trip hours (timebank_draw_conversion), the ClearPath discount and large-block eligibility
      (timebank_ordering_and_pricing), activation basis and validity (timebank_activation_and_validity), the dispute window
      and single reversal per draw (timebank_draw_disputes), and the rollover window, cap and extension fee
      (timebank_rollover_and_extension).
      In the natural order of the domain a block is ordered and invoiced before it is activated, activated before hours are
      granted and drawn, drawn before a draw can be disputed, and still unexpired when an extension or rollover is arranged.
      The agent verifies the caller and itself posts draws, reversals, rollovers, overage charges and activations under
      these rules, while new block orders, extensions, cancellations and auto-replenish changes are the client's own
      purchases that the agent registers for the authorized contact's signature.
      Requests that no TimeBank rule decides — refunding unused hours, converting hours into credit against monthly fees or
      hardware, reversing a draw outside its window, or disputing an overage invoice amount itself — are outside policy, and
      the only correct route for them is a POLICY_NOT_COVERED handoff.

  - name: project_engagements
    claim:
      categories: [project]
      event_types: [project_sow_issued, project_sow_signed, project_deposit_invoice, project_kickoff, project_milestone_completed, project_milestone_invoice, project_work_logged, project_tm_invoice, project_final_invoice, project_change_order_applied, project_change_order_fee, project_rescheduled, project_reschedule_fee, project_put_on_hold, project_resumed, project_remobilization_fee, project_acceptance_requested, project_acceptance_rejected, project_accepted, project_cancelled, project_cancellation_fee, project_credit_memo, project_assessment_credit, project_expense_charge]
    summary: >
      Client sponsors call about projects delivered under statements of work: signing a proposal before it lapses, when a
      signed project can start, a milestone or time-and-materials invoice that looks wrong, adding scope or moving dates,
      putting work on hold or resuming it, accepting or rejecting delivery, cancelling a project, or an expense line; the
      setting varies with the engagement class fixed at signature, fixed-fee versus time-and-materials pricing, the
      engagement's status, the client's other engagements and their payment standing, whether the client holds an active
      ClearPath agreement or a TimeBank block, and a history of milestones, logged time, change orders and holds.
      The records involved are the engagements, their billing ledger, milestones, work logs and change-order requests,
      governed by the signature validity window, deposit and kickoff conditions (project_signature_deposit_and_kickoff), the
      client-wide good-standing gate (project_agg_client_standing), per-class deposit, milestone and holdback schedules
      (project_fixed_fee_billing), rates, locked discounts, not-to-exceed limits and the TimeBank route
      (project_tm_billing), change-order fees, waivers and the cumulative change cap (project_change_orders), reschedule,
      hold and remobilization rules (project_schedule_and_holds), acceptance windows and warranty
      (project_acceptance_and_warranty), cancellation fees (project_cancellation), assessment credits
      (project_assessment_credit_rules) and expenses (project_expenses).
      In the natural order of the domain a statement of work is issued and signed before its deposit is invoiced, the
      deposit is paid before kickoff, milestones are completed before they are invoiced, change orders are signed before
      they change the value, and acceptance is requested before it is given or deemed.
      The agent verifies the caller and itself posts kickoffs, holds, resumptions, invoices, fees, expenses, credits and
      credit memos under these rules, while signing a statement of work, change orders, termination notices and acceptance
      sign-offs or rejections are the client's own commitments registered for the authorized contact's e-signature
      (project_client_signed_changes).
      Requests that no project rule decides — renegotiating a fixed fee without a change order, re-classing a signed
      engagement, billing time beyond a not-to-exceed amount without a signed change, or settling a dispute that has
      already exhausted its acceptance rejections — are outside policy, and the only correct route for them is a
      POLICY_NOT_COVERED handoff.

  - name: hardware_procurement_orders
    claim:
      categories: [hardware]
      event_types: [hardware_quote_issued, hardware_quote_approved, hardware_quote_expired, hardware_deposit_invoice, hardware_order_placed, hardware_order_cancelled, hardware_cancellation_fee, hardware_order_credit, hardware_shipped, hardware_delivered, hardware_final_invoice, hardware_return_authorized, hardware_return_received, hardware_return_credit, hardware_restocking_fee, hardware_doa_replacement_shipped, hardware_payment, hardware_late_fee]
    summary: >
      Client contacts call about hardware they buy through Stratton Bay: a quote price that differs from what a colleague
      paid, whether an approved order needs a deposit, cancelling an order, a delivery that has not arrived, returning
      laptops or docks they no longer need, a device that was dead out of the box, or a restocking fee they did not expect;
      the setting varies with the order type, the order's status and dates, the quantity and price on the quote, the
      client's other open orders and unpaid hardware invoices, whether it holds an active ClearPath agreement and at which
      tier, and a history of approvals, deposits, deliveries, returns and replacements.
      The records involved are the orders, their billing ledger, return milestones and client requests, governed by per-type
      markup with the ClearPath reduction, staging, handling and rush fees (hardware_quote_and_pricing), the quote validity
      window, deposit thresholds and the deposit-before-purchase-order gate (hardware_approval_and_purchase_order), the
      client-wide credit exposure limit (hardware_agg_credit_exposure), per-type cancellation rules
      (hardware_cancellation), the return window, condition requirements and restocking fees
      (hardware_returns_and_restocking), and the dead-on-arrival window and remedy (hardware_dead_on_arrival).
      In the natural order of the domain a quote is issued before it is approved, a required deposit is paid before the
      purchase order is placed, an order is delivered before its return or dead-on-arrival windows run, and a return is
      authorised and received before it is credited.
      The agent verifies the caller and itself places purchase orders, posts invoices, fees, credits and replacement
      shipments under these rules, while quote approvals, cancellations and return requests commit the client's money or
      dispose of its property and are registered for the authorized contact's e-signature (hardware_client_signed_requests).
      Requests that no hardware rule decides — returning special-order or damaged equipment for credit, a refund for a
      failure after the dead-on-arrival window instead of a manufacturer warranty claim, price matching another reseller, or
      waiving a restocking fee — are outside policy, and the only correct route for them is a POLICY_NOT_COVERED handoff.
