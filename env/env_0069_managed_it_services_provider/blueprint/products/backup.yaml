# Policy charter: Continuum Backup & Recovery (per-device backup, BDR and DRaaS plans).
category: backup
display_name: Continuum Backup & Recovery

binding:
  holding_table: backup_plans
  event_tables: [backup_device_changes, backup_billing, backup_recovery_events, backup_dr_ledger]
  intake_tables: [backup_change_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {protected_count: protected_devices, dr_days_balance: dr_days, balance_due_usd: receivable}

lifecycle:
  states: [ordered, seeding, active, suspended, notice_given, closed, cancelled]
  transitions:
    - {from: ordered, to: seeding, by: agent, means: "Initial full backups (seeding) of the protected devices begin."}
    - {from: seeding, to: active, by: agent, means: "Every contracted device has completed a verified full backup and the term starts."}
    - {from: ordered, to: cancelled, by: user, means: "The client cancels the order before seeding begins."}
    - {from: active, to: suspended, by: system, means: "New backups are paused for non-payment; existing restore points are retained."}
    - {from: suspended, to: active, by: agent, means: "Backups resume after the past-due balance is cleared."}
    - {from: active, to: notice_given, by: user, means: "The client gives signed notice of non-renewal or early termination."}
    - {from: notice_given, to: active, by: user, means: "The client withdraws the notice before its effective date."}
    - {from: notice_given, to: closed, by: system, means: "The effective date is reached; backups stop and retention runs out under the post-cancellation window."}
    - {from: suspended, to: closed, by: agent, means: "The plan is terminated for non-payment."}

accounts:
  - key: protected_devices
    unit: devices
    meaning: Servers, workstations and Microsoft 365 users currently protected under the plan.
  - key: dr_days
    unit: server-days
    meaning: Cloud failover server-days available in the current contract year.
  - key: receivable
    unit: USD
    meaning: Amount the client owes on the plan; charges increase it and payments reduce it.


# ---- category-level parameter dictionary ----
parameter_schema:
  server_rate_list_usd: List monthly fee per protected server (USD)
  workstation_rate_list_usd: List monthly fee per protected workstation (USD)
  m365_user_rate_list_usd: List monthly fee per protected Microsoft 365 user, covering mailbox, OneDrive, SharePoint and Teams (USD)
  min_protected_items: Minimum protected items at order (integer)
  min_server_commitment_pct: Minimum billed servers as a percent of contracted_servers, rounded up (percent)
  allowed_terms_months: Term lengths offered (list of months)
  term_discount_pct: Discount off list rates by term length (mapping months -> percent)
  clearpath_bundle_discount_pct: Discount off list rates when the client holds an active ClearPath agreement at or above clearpath_bundle_min_rank (percent)
  clearpath_bundle_min_rank: Lowest ClearPath tier rank that qualifies for the bundle discount (rank 1-6)
  onboarding_fee_per_server_usd: One-time onboarding fee per contracted server (USD)
  onboarding_fee_minimum_usd: Minimum one-time onboarding fee (USD)
  seeding_target_days: Target calendar days to complete seeding (integer days)
  included_storage_tb_per_server: Protected storage included per billed server per month (TB)
  storage_overage_rate_usd_per_tb: Monthly rate per TB of protected server storage above the pooled allowance (USD per TB)
  storage_overage_rounding_tb: Increment overage storage is rounded up to (TB)
  backup_frequency_minutes: Interval between scheduled server backups (integer minutes)
  retention_days: Days restore points are retained (integer days)
  immutable_copy: Whether an immutable cloud copy is kept (switch)
  local_appliance_included: Whether an on-site backup appliance is supplied (switch)
  cloud_virtualization: Whether protected servers can be run in the provider cloud during a disaster (switch)
  ransomware_anomaly_detection: Whether backup-stream anomaly detection is included (switch)
  backup_monitoring_24x7: Whether failed backups are triaged around the clock (switch)
  failed_backup_response_minutes: Time from a failed scheduled backup to technician remediation start (integer minutes)
  rto_target_hours: Target recovery time for a full server restore or failover (integer hours)
  rto_guaranteed: Whether the recovery time target is a guarantee backed by a fee refund (switch)
  rto_miss_refund_pct: Refund of the month's plan fee when a guaranteed recovery time is missed (percent)
  restore_response_minutes: Time from a restore request to technician start (integer minutes)
  restore_labor_included: Whether technician labor for restores is included (switch)
  restore_hourly_rate_usd: Hourly rate for restore labor that is not included (USD per hour)
  restore_billing_increment_minutes: Increment restore labor is rounded up to (integer minutes)
  test_restores_per_year: Verified test restores included per contract year (integer)
  dr_tests_per_year: Full disaster recovery tests included per contract year (integer)
  dr_days_included_annual: Cloud failover server-days granted at the start of each contract year (integer)
  dr_day_rate_usd: Rate per server-day of production failover beyond the balance (USD per server-day)
  dr_test_server_days_free: Whether server-days used during an included DR test are free of the balance (switch)
  expedited_drive_shipment_fee_usd: Fee for shipping a seeded recovery drive overnight (USD per shipment)
  post_cancellation_retention_days: Days restore points remain restorable after the plan closes (integer days)
  compliance_retention_supported: Frameworks whose retention requirement the tier meets (list of customers.compliance_framework values)
  backup_reports: Backup success report cadence (enum monthly / weekly / daily)
  notice_days: Calendar days of signed notice before term end for non-renewal, and minimum notice for early termination (integer days)
  renewal_term_months: Length of each automatic renewal term (months)
  renewal_uplift_cap_pct: Maximum rate increase at renewal (percent)
  early_termination_fee_pct: Early termination fee as a percent of committed monthly fees remaining (percent)
  invoice_due_days: Net payment terms (integer days)
  late_fee_pct_monthly: Monthly late fee on an invoice's unpaid balance past the grace period (percent)
  late_fee_grace_days: Calendar days after the due date before a late fee is assessed (integer days)
  suspension_days_past_due: Days past due of the oldest unpaid invoice at which new backups are paused (integer days)
  termination_for_nonpayment_days: Days in suspension after which the plan may be terminated (integer days)
  production_failover_requires_signature: Whether a production failover needs the authorized contact's signed authorization before it starts (switch)

