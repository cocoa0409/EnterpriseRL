events:
  - type: hardware_quote_issued
    target: hardware_orders
    mutation: create
    meaning: A quote for one product line is issued to the client.
    grain: One order record per quote.
    fields: {customer_id: Client organisation., variant_name: Order type., quote_number: Quote number., item_description: Product description., manufacturer_part_number: Part number., quantity: Units., unit_cost_usd: Distributor cost., unit_price_usd: Sell price after markup., quote_total_usd: Quoted total., rush_requested: Whether rush was quoted., quote_date: Quote date.}
    triggers: []
  - type: hardware_quote_approved
    target: hardware_orders
    mutation: {transition: {from: quoted, to: approved}}
    meaning: The authorized contact signs the quote.
    grain: One transaction per order.
    fields: {approved_date: Signature date., deposit_required: Whether a deposit applies under the deposit and credit-exposure rules on the approval date.}
    triggers:
      - event: hardware:hardware_deposit_invoice
        when: {deposit_required: true}
        map: {}
  - type: hardware_quote_expired
    target: hardware_orders
    mutation: {transition: {from: quoted, to: quote_expired}}
    meaning: The quote lapses unsigned.
    grain: One transaction per order.
    fields: {closed_date: Day after the validity period ended.}
    triggers: []
  - type: hardware_order_placed
    target: hardware_orders
    mutation: {transition: {from: approved, to: ordered}}
    meaning: The purchase order is placed with the distributor.
    grain: One transaction per order.
    fields: {distributor_po_number: Distributor PO., order_placed_date: PO date.}
    triggers: []
  - type: hardware_order_cancelled
    target: hardware_orders
    mutation: {transition: [{from: approved, to: cancelled}, {from: ordered, to: cancelled}]}
    meaning: The client's signed cancellation takes effect.
    grain: One transaction per order.
    fields: {cancellation_stage: before_po or after_po., cancelled_date: Cancellation date., closed_date: Equal to cancelled_date.}
    triggers:
      - event: hardware:hardware_cancellation_fee
        when: {cancellation_stage: after_po}
        map: {}
  - type: hardware_shipped
    target: hardware_orders
    mutation: {transition: {from: ordered, to: shipped}}
    meaning: The order ships.
    grain: One transaction per order.
    fields: {ship_date: Ship date., carrier_tracking: Tracking number.}
    triggers: []
  - type: hardware_delivered
    target: hardware_orders
    mutation: {transition: {from: shipped, to: delivered}}
    meaning: The carrier confirms delivery.
    grain: One transaction per order.
    fields: {delivered_date: Delivery date.}
    triggers:
      - event: hardware:hardware_final_invoice
        map: {}
  - type: hardware_closed
    target: hardware_orders
    mutation: {transition: {from: delivered, to: closed}}
    meaning: The order closes after its return window with nothing owed.
    grain: One transaction per order.
    fields: {closed_date: Closing date.}
    triggers: []
  - type: hardware_deposit_invoice
    target: hardware_billing
    meaning: The deposit is invoiced on approval.
    grain: One row per order.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Deposit., invoice_number: Invoice., posted_date: Approval date., billing_period: Month of approval.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_final_invoice
    target: hardware_billing
    meaning: The quote total less any deposit is invoiced on delivery.
    grain: One row per order.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Amount., invoice_number: Invoice., posted_date: Delivery date., billing_period: Month of delivery.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_cancellation_fee
    target: hardware_billing
    meaning: The fee for cancelling after the purchase order is invoiced.
    grain: One row per order.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee., invoice_number: Invoice., posted_date: Cancellation date., billing_period: Month of cancellation.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_restocking_fee
    target: hardware_billing
    meaning: The restocking fee on returned unwanted units is charged.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., amount_usd: Fee., invoice_number: Invoice of the order., posted_date: Receipt date., billing_period: Month received.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_return_credit
    target: hardware_billing
    meaning: Returned units are credited at their unit price.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., amount_usd: Credit., invoice_number: Invoice credited., posted_date: Receipt date., billing_period: Month received.}
    account: receivable
    direction: out
    triggers: []
  - type: hardware_order_credit
    target: hardware_billing
    meaning: A deposit is credited back when an order is cancelled before its purchase order, or offset against a cancellation fee.
    grain: One row per cancelled order.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Credit., invoice_number: Deposit invoice credited., posted_date: Cancellation date., billing_period: Month of cancellation.}
    account: receivable
    direction: out
    triggers: []
  - type: hardware_payment
    target: hardware_billing
    meaning: A payment is applied to an invoice.
    grain: One row per remittance per invoice.
    distinguish_by: [payment_reference, invoice_number]
    fields: {payment_reference: Remittance reference., amount_usd: Amount applied., invoice_number: Invoice paid., posted_date: Date received.}
    account: receivable
    direction: out
    triggers: []
  - type: hardware_late_fee
    target: hardware_billing
    meaning: A late fee is assessed on a past-due invoice.
    grain: One row per invoice per month assessed.
    distinguish_by: [invoice_number, billing_period]
    fields: {invoice_number: Past-due invoice., billing_period: Month assessed., amount_usd: Fee., posted_date: Assessment date.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_return_authorized
    target: hardware_returns
    meaning: A return authorization is issued for units of the order.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., return_type: unwanted or dead_on_arrival., qty: Units authorised., event_date: Authorization date.}
    triggers: []
  - type: hardware_return_received
    target: hardware_returns
    meaning: Returned units are received and inspected.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., return_type: Return type., qty: Units received., received_condition: Inspected condition., event_date: Receipt date.}
    triggers:
      - event: hardware:hardware_return_credit
        when: {received_condition: [unopened, opened_resaleable]}
        map: {rma_number: rma_number}
      - event: hardware:hardware_restocking_fee
        when: {received_condition: [unopened, opened_resaleable]}
        map: {rma_number: rma_number}
  - type: hardware_doa_replacement_shipped
    target: hardware_returns
    meaning: Replacement units for confirmed dead-on-arrival units are shipped, or credit is chosen instead.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., qty: Units replaced., event_date: Ship date of the replacement.}
    triggers: []


measures:
  - id: hardware_msr_open_exposure
    window: Point in time, immediately before the approval being decided, across every hardware order of the client.
    measure: Sum of quote_total_usd of the client's orders whose status is approved, ordered or shipped, plus balance_due_usd of its orders whose status is delivered.
  - id: hardware_msr_units_returned
    window: All return milestones of the order up to the decision.
    measure: Sum of qty of hardware_return_received rows of the order, by return_type.

policies:
  - id: hardware_agg_multi_holding
    subject: [hardware_quote_issued]
    rule: >-
      A client may hold any number of hardware orders; each quote covers one product line at one quantity and becomes its
      own order with its own price, deposit, delivery, return window and invoices.
    eligibility: []
    params:
      max_per_customer: null

  - id: hardware_agg_credit_exposure
    subject: [hardware_quote_approved, hardware_deposit_invoice]
    rule: >-
      The client's open hardware exposure (hardware_msr_open_exposure) plus the quote total of the order being approved is
      compared with its credit limit: credit_limit_with_clearpath_usd while the client holds a ClearPath agreement whose
      status is active, and credit_limit_without_clearpath_usd otherwise. When the sum exceeds the limit, the order is
      prepaid: its deposit becomes 100 percent of the quote total, whatever its order type's deposit_pct and
      deposit_threshold_usd say, and the purchase order waits for that payment. Orders within the limit follow the order
      type's normal deposit rule.
    eligibility: []
    measures: [hardware_msr_open_exposure]
    params:
      credit_limit_with_clearpath_usd: 50000.00
      credit_limit_without_clearpath_usd: 10000.00

  - id: hardware_quote_and_pricing
    subject: [hardware_quote_issued, hardware_quote_expired]
    rule: >-
      A quote is issued for one product line in the order type matching the product class. The unit price is unit_cost_usd
      times one plus the effective markup, rounded half up to the cent; the effective markup is markup_pct, reduced by
      clearpath_markup_reduction_pts when on the quote date the client holds a ClearPath agreement whose status is active and
      whose tier rank is at least clearpath_min_rank. The quote total is quantity times unit_price_usd, plus
      staging_fee_per_unit_usd times quantity, plus handling_fee_usd, plus rush_fee_usd when rush is requested where
      rush_available is true; it must reach min_order_value_usd and quantity may not exceed max_units_per_order. A deposit is
      required, as decided on the approval date, when deposit_pct is above 0 and the quote total is at least
      deposit_threshold_usd, or when the credit-exposure rule calls for prepayment. The quote may be signed at
      its price within quote_validity_days calendar days of quote_date; an unsigned quote then lapses, and where quote_revision_resets_validity is true a
      revised quote starts a new validity period. The entitlements asset_tagging_included, serial_capture_included,
      autopilot_registration_included, firmware_update_included, burn_in_test_hours, warranty_registration_included,
      eol_check_included and the configuration_sheet_required step belong to the order type; onsite installation is never
      part of an order (installation_included is false) and is done under ClearPath, TimeBank or a project.
    eligibility: []
    params:
      per_tier:
        Accessory & Peripheral Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Standard Endpoint Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Staged Endpoint Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Network Equipment Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Server & Storage Build Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Special-Order Equipment: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
    formula:
      unit_price_usd: round(unit_cost_usd * (1 + (markup_pct - clearpath_markup_reduction_pts) / 100), 2)
      quote_total_usd: round(quantity * unit_price_usd + staging_fee_per_unit_usd * quantity + handling_fee_usd + (rush_fee_usd if rush_requested else 0), 2)

  - id: hardware_approval_and_purchase_order
    subject: [hardware_quote_approved, hardware_deposit_invoice, hardware_order_placed]
    rule: >-
      A quote may be approved only by the authorized contact's signature within quote_validity_days calendar days after the
      quote was issued. The validity period is counted in calendar days from quote_date, that date being day 0, and a
      signature on the last day is in time. Where price_protection_after_approval is true the signed price holds even if the
      distributor cost changes before the purchase order. On approval a required deposit of deposit_pct percent of the quote
      total is invoiced, rounded half up to the cent, due on receipt (deposit_due). The purchase order may be placed only after any
      required deposit has been paid in full. Orders that need no deposit are placed on the approval date, and a configuration
      sheet must be signed before staging starts where configuration_sheet_required is true.
    eligibility:
      - id: approve_in_validity
        applies_to: [hardware_quote_approved]
        kind: time
        condition: A quote may be approved only by the authorized contact's signature within quote_validity_days calendar days after the quote was issued.
        evidence_fields: [hardware_orders.hardware_order_id, hardware_orders.quote_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_orders.hardware_order_id]]
          action_bindings: {hardware_orders.hardware_order_id: hardware_order_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the quote was issued
          anchor_source: hardware_orders.quote_date
          relation: not_after
          duration_source: variants.quote_validity_days
          unit: calendar_days
          counting_rule: The validity period is counted in calendar days from quote_date, that date being day 0, and a signature on the last day is in time.
          boundary: inclusive
      - id: deposit_before_po
        applies_to: [hardware_order_placed]
        kind: authorization
        condition: The purchase order may be placed only after any required deposit has been paid in full.
        evidence_fields: [hardware_billing.hardware_order_id, hardware_billing.event_type, hardware_billing.invoice_number, hardware_billing.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_billing.hardware_order_id]]
          action_bindings: {hardware_billing.hardware_order_id: hardware_order_id}
    formula:
      amount_usd: round(deposit_pct / 100 * quote_total_usd, 2)

  - id: hardware_fulfilment_and_invoicing
    subject: [hardware_shipped, hardware_delivered, hardware_final_invoice, hardware_closed]
    rule: >-
      Orders ship by shipping_method, with a signature on delivery where signature_on_delivery is true, and in partial lots
      only where partial_shipment_allowed is true; delivery_target_business_days is a target for in-stock items, not a
      guarantee. On delivery of the whole order the final invoice bills the quote total minus any deposit invoiced, due
      invoice_due_days calendar days later. The order closes on the day after the later of the end of its return window and
      its doa_window_days window, provided nothing is owed on it.
    eligibility: []

  - id: hardware_cancellation
    subject: [hardware_order_cancelled, hardware_cancellation_fee, hardware_order_credit]
    rule: >-
      An approved order may be cancelled free of charge before its purchase order is placed where cancel_before_po_free is
      true, any deposit invoiced being credited in full. After the purchase order is placed and before shipment, an order
      may be cancelled only where cancellable_after_po is true. Such a cancellation is charged cancellation_after_po_fee_pct
      percent of the quote total, rounded half up to the cent, and any deposit paid is applied against that fee by an order
      credit with the excess refunded by the accounting team. Special-Order Equipment is non-cancellable once approved,
      because cancel_before_po_free and cancellable_after_po are both false for it. A shipped order cannot be cancelled; its
      units can only come back under the return rules.
    eligibility:
      - id: cancellable_stage
        applies_to: [hardware_order_cancelled]
        kind: authorization
        condition: After the purchase order is placed and before shipment, an order may be cancelled only where cancellable_after_po is true.
        evidence_fields: [hardware_orders.hardware_order_id, hardware_orders.status, hardware_orders.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_orders.hardware_order_id]]
          action_bindings: {hardware_orders.hardware_order_id: hardware_order_id}
    formula:
      amount_usd: round(cancellation_after_po_fee_pct / 100 * quote_total_usd, 2)

  - id: hardware_returns_and_restocking
    subject: [hardware_return_authorized, hardware_return_received, hardware_return_credit, hardware_restocking_fee]
    rule: >-
      Unwanted units may be returned only within return_window_days calendar days after delivery. The window is counted in
      calendar days from delivered_date, that date being day 0, and a return authorized on the last day is in time. A return
      is authorized only on the authorized contact's signed return request, for no more units than were delivered less those
      already returned (hardware_msr_units_returned). Unwanted units must come back unopened, except where
      opened_returns_accepted is true, in which case opened resaleable units are also accepted. Orders whose non_returnable is
      true accept no unwanted returns at all. On receipt, unopened or accepted opened units are credited at unit_price_usd
      times the units received, and a restocking fee of unopened_restocking_fee_pct or opened_restocking_fee_pct percent of
      that amount is charged, each rounded half up to the cent; staging and handling fees are never credited because
      staging_fee_refundable and handling_fee_refundable are false. Units received damaged, or opened where that is not
      accepted, are not credited (damaged_returns_accepted is false) and are shipped back at the client's request. A return
      authorization is credited at most once.
    eligibility:
      - id: return_window
        applies_to: [hardware_return_authorized]
        kind: time
        condition: Unwanted units may be returned only within return_window_days calendar days after delivery.
        evidence_fields: [hardware_orders.hardware_order_id, hardware_orders.delivered_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_orders.hardware_order_id]]
          action_bindings: {hardware_orders.hardware_order_id: hardware_order_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: delivery
          anchor_source: hardware_orders.delivered_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days from delivered_date, that date being day 0, and a return authorized on the last day is in time.
          boundary: inclusive
      - id: credit_once
        applies_to: [hardware_return_credit]
        kind: dedup
        condition: A return authorization is credited at most once.
        evidence_fields: [hardware_billing.rma_number, hardware_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_billing.rma_number]]
          action_bindings: {hardware_billing.rma_number: rma_number}
        dedup_contract:
          table: hardware_billing
          mode: separate_record
          object_bindings: {rma_number: rma_number}
          duplicate_filters: {event_type: [hardware_return_credit]}
          distinct_fields: []
    measures: [hardware_msr_units_returned]
    formula:
      credit_amount: round(unit_price_usd * qty, 2)
      restocking_amount: round(credit_amount * unopened_restocking_fee_pct / 100, 2)

  - id: hardware_dead_on_arrival
    subject: [hardware_return_authorized, hardware_return_received, hardware_doa_replacement_shipped, hardware_return_credit]
    rule: >-
      A unit that fails out of the box is handled as dead on arrival only when it is reported within doa_window_days
      calendar days after delivery. The period is counted in calendar days from delivered_date, that date being day 0. A
      dead-on-arrival return is authorized for the failed units on the authorized contact's signed return request, even on
      non-returnable orders, and no restocking fee applies where doa_restocking_waived is true. When inspection confirms the
      failure (doa_confirmed) the units are replaced, or credited at unit_price_usd where doa_remedy is replace_or_credit and
      the client chooses credit; when inspection does not confirm it (doa_not_confirmed) the units are shipped back with no
      credit. A failure reported after the dead-on-arrival window goes to the manufacturer warranty (warranty_claim_route)
      and Stratton Bay neither replaces nor credits it.
    eligibility:
      - id: doa_window
        applies_to: [hardware_doa_replacement_shipped]
        kind: time
        condition: A unit that fails out of the box is handled as dead on arrival only when it is reported within doa_window_days calendar days after delivery.
        evidence_fields: [hardware_orders.hardware_order_id, hardware_orders.delivered_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_orders.hardware_order_id]]
          action_bindings: {hardware_orders.hardware_order_id: hardware_order_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: delivery
          anchor_source: hardware_orders.delivered_date
          relation: not_after
          duration_source: variants.doa_window_days
          unit: calendar_days
          counting_rule: The period is counted in calendar days from delivered_date, that date being day 0.
          boundary: inclusive

  - id: hardware_billing_and_collections
    subject: [hardware_payment, hardware_late_fee]
    rule: >-
      Deposits are due on receipt and other invoices invoice_due_days calendar days after posting. A payment is applied to
      the invoice its remittance names, otherwise to the oldest open invoice of the order first, one entry per invoice
      applied; card payments are accepted only for an invoice whose total does not exceed card_payment_max_usd. On the first
      day of each calendar month every invoice still unpaid more than late_fee_grace_days calendar days after its due date is
      assessed one late fee of late_fee_pct_monthly percent of its unpaid balance, or late_fee_minimum_usd if greater,
      rounded half up to the cent.
    eligibility: []

  - id: hardware_client_signed_requests
    subject: [hardware_quote_approved, hardware_order_cancelled, hardware_return_authorized]
    rule: >-
      Quote approvals, cancellations and return requests commit the client's money or dispose of its property and take
      effect only on the authorized contact's e-signature: the service desk registers each as a client request pending
      signature and never approves, cancels or returns on the client's behalf. A request may be registered only for the
      client's authorized contact after identity verification has passed.
    eligibility:
      - id: verified_contact
        applies_to: [hardware_quote_approved, hardware_order_cancelled, hardware_return_authorized]
        kind: authorization
        condition: A request may be registered only for the client's authorized contact after identity verification has passed.
        evidence_fields: [identity_verifications.customer_id, identity_verifications.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[identity_verifications.customer_id]]
          action_bindings: {identity_verifications.customer_id: customer_id}
