# Policy charter: ClearPath Managed IT Services (per-seat managed services agreements).
category: managed
display_name: ClearPath Managed IT Services

binding:
  holding_table: managed_agreements
  event_tables: [managed_seat_changes, managed_billing, managed_tickets]
  intake_tables: [managed_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {seat_count: seats, balance_due_usd: receivable}

lifecycle:
  states: [applied, onboarding, active, suspended, notice_given, offboarding, closed, cancelled]
  transitions:
    - {from: applied, to: onboarding, by: agent, means: "The onboarding project is kicked off once the signed agreement's onboarding fee is paid or waived."}
    - {from: onboarding, to: active, by: agent, means: "Onboarding is complete and the agreement goes live; the term starts on the go-live date."}
    - {from: applied, to: cancelled, by: user, means: "The client withdraws a signed agreement before onboarding has started."}
    - {from: active, to: suspended, by: system, means: "Service is suspended because an invoice reached the suspension threshold of days past due."}
    - {from: suspended, to: active, by: agent, means: "Service is reinstated after every past-due invoice and the reinstatement fee are paid."}
    - {from: active, to: notice_given, by: user, means: "The client gives written notice of non-renewal or early termination."}
    - {from: notice_given, to: active, by: user, means: "The client withdraws its notice before the termination effective date."}
    - {from: notice_given, to: offboarding, by: system, means: "The termination effective date is reached and the transition-out begins."}
    - {from: active, to: offboarding, by: system, means: "The term ends on an agreement whose auto_renew is false and no signed renewal is on file, and the transition-out begins."}
    - {from: suspended, to: offboarding, by: agent, means: "The agreement is terminated for non-payment after suspension and the transition-out begins."}
    - {from: offboarding, to: closed, by: agent, means: "Transition-out is complete, credentials are handed over and the agreement is closed."}

accounts:
  - key: seats
    unit: seats
    meaning: Number of named users currently covered under the agreement; every user onboarding adds seats and every user offboarding removes them.
  - key: receivable
    unit: USD
    meaning: Amount the client owes on this agreement; charges increase it and payments, SLA credits and credit memos reduce it.


# ---- category-level parameter dictionary ----
parameter_schema:
  seat_rate_list_usd: List monthly fee per seat in USD for a new agreement or a tier change, before any term discount (scalar, USD)
  min_seats: Minimum seats that may be contracted at signing or after a tier change (integer seats)
  min_seat_commitment_pct: Minimum monthly billed seats during a term as a percent of contracted_seats; the floor is contracted_seats x pct / 100 rounded up to a whole seat (percent)
  allowed_terms_months: Contract term lengths the tier may be signed or renewed for (list of integer months)
  term_discount_pct: Discount off seat_rate_list_usd by signed term length (mapping term months -> percent)
  onboarding_fee_per_seat_usd: One-time onboarding fee per contracted seat (USD per seat)
  onboarding_fee_minimum_usd: Minimum one-time onboarding fee regardless of seat count (USD)
  onboarding_fee_waiver_min_term_months: Initial term length at or above which the onboarding fee is waived (integer months)
  onboarding_target_business_days: Target business days from onboarding kickoff to go-live (integer business days)
  renewal_term_months: Length of each automatic renewal term (integer months)
  notice_days: Calendar days of signed written notice required before term end for non-renewal, and minimum notice for early termination (integer calendar days)
  renewal_uplift_cap_pct: Maximum increase of seat_rate_usd applied at a renewal, as a percent of the expiring term's rate (percent)
  early_termination_fee_pct: Early termination fee as a percent of the committed monthly fees remaining after the termination effective date (percent)
  true_up_snapshot_day: Day of each calendar month on which licensed directory users are reconciled against seat_count (day of month)
  new_user_lead_business_days: Business days of advance notice required for a new-user onboarding to be ready on the requested start date (integer business days)
  offboarding_same_day_cutoff: Time of day (US Eastern) before which an offboarding request received on a business day is completed the same day (HH:MM)
  helpdesk_remote_included: Whether covered remote help desk work during coverage hours is included in the seat fee (switch)
  remote_hourly_rate_usd: Hourly rate for billable remote labor during coverage hours (USD per hour)
  onsite_hourly_rate_usd: Hourly rate for billable onsite labor during coverage hours (USD per hour)
  included_onsite_hours_monthly: Onsite labor hours per calendar month included in the seat fee before onsite labor becomes billable (hours; unused hours do not carry over)
  onsite_trip_charge_usd: Flat charge per billable onsite visit (USD per visit)
  after_hours_multiplier: Multiplier applied to the hourly rate for billable labor outside coverage hours (factor)
  after_hours_remote_included: Whether covered remote work outside business hours is included in the seat fee (switch)
  p1_after_hours_included: Whether remote work on a P1 ticket outside coverage hours is included even when after-hours remote work is not (switch)
  billing_increment_minutes: Increment billable labor minutes are rounded up to (integer minutes)
  minimum_billable_minutes_remote: Minimum billable minutes per billable remote ticket (integer minutes)
  minimum_billable_minutes_onsite: Minimum billable minutes per billable onsite visit (integer minutes)
  coverage_days: Days of the week inside coverage hours (day range)
  coverage_start: Start of daily coverage hours, US Eastern (HH:MM)
  coverage_end: End of daily coverage hours, US Eastern (HH:MM; 24:00 means midnight)
  observed_holidays_excluded: Whether observed company holidays fall outside coverage hours (switch)
  observed_holiday_list: Company holidays observed by the service desk and excluded from business days (list of US holidays)
  response_target_minutes_p1: Guaranteed first-response time for a P1 ticket, counted in coverage minutes (integer minutes)
  response_target_minutes_p2: Guaranteed first-response time for a P2 ticket, counted in coverage minutes (integer minutes)
  response_target_minutes_p3: Guaranteed first-response time for a P3 ticket, counted in coverage minutes (integer minutes)
  response_target_minutes_p4: Guaranteed first-response time for a P4 ticket, counted in coverage minutes (integer minutes)
  resolution_target_hours_p1: Target (not guaranteed) resolution time for a P1 ticket, in coverage hours (integer hours)
  resolution_target_hours_p2: Target (not guaranteed) resolution time for a P2 ticket, in coverage hours (integer hours)
  p1_requires_phone: Whether a ticket must be reported by phone to be worked and measured as P1 (switch)
  sla_credits_eligible: Whether missed first-response guarantees earn service credits (switch)
  sla_credit_priorities: Priorities whose missed first-response guarantee earns a service credit (list)
  sla_credit_pct_per_breach: Service credit per breached ticket as a percent of the monthly fee billed for the ticket's service month (percent)
  sla_credit_cap_pct_monthly: Maximum total service credits per service month as a percent of that month's monthly fee (percent)
  sla_credit_claim_window_days: Calendar days after the ticket's first response within which the client must claim the credit (integer calendar days)
  invoice_due_days: Calendar days after the invoice posted date by which payment is due (net terms, integer days)
  late_fee_pct_monthly: Late fee per month on the unpaid balance of an invoice past due beyond the grace period (percent)
  late_fee_grace_days: Calendar days after the due date before a late fee is assessed (integer days)
  late_fee_minimum_usd: Minimum late fee per invoice per month (USD)
  suspension_days_past_due: Days past the due date of the oldest unpaid invoice at which service is suspended (integer days)
  suspension_warning_days: Calendar days before suspension that the written suspension warning is sent (integer days)
  termination_for_nonpayment_days: Calendar days in suspension after which the agreement may be terminated for non-payment (integer days)
  reinstatement_fee_usd: Flat fee to reinstate a suspended agreement (USD)
  vcio_reviews_per_year: Strategic technology business reviews with a virtual CIO included per contract year (integer)
  dedicated_account_manager: Whether a named client success manager is assigned (switch)
  technical_account_manager: Whether a named technical account manager is assigned (switch)
  transition_assistance_included_hours: Transition-out assistance hours included at offboarding (hours)
  transition_assistance_rate_usd: Hourly rate for transition-out assistance beyond the included hours (USD per hour)
  data_return_window_days: Calendar days after closing within which the client may request export of retained documentation and configurations (integer days)
  tier_downgrade_mid_term_allowed: Whether a move to a lower tier may take effect before the current term ends (switch)
  monthly_invoice_day: Day of month the monthly fee invoice is posted, in advance for that month (day of month)
  card_payment_max_usd: Largest invoice amount that may be paid by card; above it only ACH, wire or check are accepted (USD)
  security_awareness_training: Whether monthly security awareness training and phishing simulation for all seats is included (switch)
  m365_administration_included: Whether Microsoft 365 tenant administration (user, mailbox and license changes) is covered work (switch)
  vendor_management_included: Whether liaison with the client's line-of-business software vendors and ISP is covered work (switch)
  network_device_management_included: Whether firewall, switch and wireless configuration changes are covered work (switch)

