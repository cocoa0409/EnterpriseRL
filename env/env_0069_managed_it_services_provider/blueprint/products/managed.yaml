    coverage_days: Mon-Sun
    coverage_start: 00:00
    coverage_end: '24:00'
    observed_holidays_excluded: false
    observed_holiday_list:
    - New Year's Day
    - Memorial Day
    - Independence Day
    - Labor Day
    - Thanksgiving Day
    - Christmas Day
    response_target_minutes_p1: 15
    response_target_minutes_p2: 30
    response_target_minutes_p3: 120
    response_target_minutes_p4: 240
    resolution_target_hours_p1: 4
    resolution_target_hours_p2: 8
    p1_requires_phone: true
    sla_credits_eligible: true
    sla_credit_priorities:
    - P1
    - P2
    - P3
    sla_credit_pct_per_breach: 5.0
    sla_credit_cap_pct_monthly: 25.0
    sla_credit_claim_window_days: 60
    invoice_due_days: 45
    late_fee_pct_monthly: 1.5
    late_fee_grace_days: 15
    late_fee_minimum_usd: 50.0
    suspension_days_past_due: 75
    suspension_warning_days: 15
    termination_for_nonpayment_days: 60
    reinstatement_fee_usd: 750.0
    vcio_reviews_per_year: 12
    dedicated_account_manager: true
    technical_account_manager: true
    transition_assistance_included_hours: 40
    transition_assistance_rate_usd: 160.0
    data_return_window_days: 90
    tier_downgrade_mid_term_allowed: false
    monthly_invoice_day: 1
    card_payment_max_usd: 15000.0
    security_awareness_training: true
    m365_administration_included: true
    vendor_management_included: true
    network_device_management_included: true


# ---- data flow (every write is an event) ----
events:
  # -- holding writes --
  - type: managed_agreement_signed
    target: managed_agreements
    mutation: create
    meaning: The client signs a ClearPath managed services agreement for a tier, seat commitment and term.
    grain: One agreement record per signed agreement.
    fields:
      customer_id: Client organisation signing.
      variant_name: Official ClearPath tier signed.
      signed_date: Date of the client's signature.
      term_months: Initial term length signed (one of the tier's allowed_terms_months).
      contracted_seats: Seats committed at signing.
      seat_rate_usd: Contracted per-seat rate (list rate less the term discount).
      auto_renew: Whether the agreement renews automatically (true unless negotiated otherwise).
    triggers:
      - event: managed:managed_onboarding_fee
        when: {term_months: {not: [36, 60]}}
        map: {}
  - type: managed_onboarding_started
    target: managed_agreements
    mutation: {transition: {from: applied, to: onboarding}}
    meaning: The onboarding project (discovery, agent deployment, documentation) is kicked off.
    grain: One transaction per agreement.
    fields:
      onboarding_start_date: Kickoff date.
    triggers: []
  - type: managed_go_live
    target: managed_agreements
    mutation: {transition: {from: onboarding, to: active}}
    meaning: Onboarding completes and the agreement goes live; the initial term starts.
    grain: One transaction per agreement.
    fields:
      go_live_date: Date service went live.
      term_start_date: First day of the initial term (equal to go_live_date).
      term_end_date: Last day of the initial term (the day before the same calendar day term_months later).
    triggers:
      - event: managed:managed_seat_add
        map: {change_reason: initial_baseline}
  - type: managed_cancelled
    target: managed_agreements
    mutation: {transition: {from: applied, to: cancelled}}
    meaning: The client withdraws the signed agreement before onboarding starts.
    grain: One transaction per agreement.
    fields:
      closed_date: Date the cancellation took effect.
    triggers: []
  - type: managed_suspended
    target: managed_agreements
    mutation: {transition: {from: active, to: suspended}}
    meaning: Service is suspended for non-payment.
    grain: One transaction per suspension.
    fields:
      suspended_date: Date service was suspended.
    triggers: []
  - type: managed_reinstated
    target: managed_agreements
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended agreement is reinstated after the past-due balance is cleared.
    grain: One transaction per reinstatement.
    fields:
      reinstated_date: Date service was reinstated.
    triggers:
      - event: managed:managed_reinstatement_fee
        map: {}
  - type: managed_notice_given
    target: managed_agreements
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The client's signed written notice of non-renewal or early termination takes effect on the agreement.
    grain: One transaction per notice.
    fields:
      notice_type: non_renewal or early_termination.
      notice_received_date: Date the signed notice was received.
      termination_effective_date: Date the termination takes effect.
    triggers:
      - event: managed:managed_early_termination_fee
        when: {notice_type: early_termination}
        map: {}
  - type: managed_notice_withdrawn
    target: managed_agreements
    mutation: {transition: {from: notice_given, to: active}}
    meaning: The client withdraws its notice before the termination effective date.
    grain: One transaction per withdrawal.
    fields:
      notice_type: Reset to none.
      notice_received_date: Cleared.
      termination_effective_date: Cleared.
    triggers: []
  - type: managed_offboarding_started
    target: managed_agreements
    mutation: {transition: [{from: notice_given, to: offboarding}, {from: suspended, to: offboarding}, {from: active, to: offboarding}]}
    meaning: The transition-out begins at the termination effective date, at the end of a term that does not renew, or on termination for non-payment.
    grain: One transaction per agreement.
    fields:
      offboarding_start_date: Date the transition-out began.
    triggers: []
  - type: managed_closed
    target: managed_agreements
    mutation: {transition: {from: offboarding, to: closed}}
    meaning: Transition-out is complete and the agreement is closed.
    grain: One transaction per agreement.
    fields:
      closed_date: Date the agreement closed.
    triggers: []
  - type: managed_tier_changed
    target: managed_agreements
    mutation: update
    meaning: A signed tier change takes effect, re-pricing every seat.
    grain: One transaction per tier change.
    fields:
      variant_name: New official tier.
      seat_rate_usd: New per-seat rate.
      tier_change_effective_date: Date the new tier took effect.
    triggers: []
  - type: managed_renewed
    target: managed_agreements
    mutation: update
    meaning: The agreement rolls into a renewal term at term end.
    grain: One transaction per renewal term.
    fields:
      term_start_date: First day of the renewal term.
      term_end_date: Last day of the renewal term.
      term_months: Renewal term length.
      seat_rate_usd: Rate for the renewal term after any uplift.
      contracted_seats: Seat commitment for the renewal term.
      renewal_count: Incremented by one.
    triggers: []
  # -- seat ledger --
  - type: managed_seat_add
    target: managed_seat_changes
    meaning: Seats are added to the covered-user count (initial baseline at go-live, a named new user, or a monthly true-up).
    grain: One row per seat addition for one named user, one baseline, or one true-up reconciliation.
    distinguish_by: [effective_date, change_reason, user_principal]
    fields:
      seat_qty: Seats added.
      effective_date: Date the seats became covered.
      change_reason: initial_baseline, user_onboarding or monthly_true_up.
      user_principal: Named user's sign-in, empty for baseline and true-up rows.
      ticket_number: Onboarding ticket, empty for baseline and true-up rows.
    account: seats
    direction: in
    triggers:
      - event: managed:managed_proration_charge
        map: {managed_seat_change_id: managed_seat_change_id}
  - type: managed_seat_remove
    target: managed_seat_changes
    meaning: Seats are removed from the covered-user count (a named user offboarded or a true-up reduction).
    grain: One row per seat removal for one named user or one true-up reconciliation.
    distinguish_by: [effective_date, change_reason, user_principal]
    fields:
      seat_qty: Seats removed.
      effective_date: Date the seats stopped being covered.
      change_reason: user_offboarding or true_up_reduction.
      user_principal: Named user's sign-in, empty for true-up rows.
      ticket_number: Offboarding ticket, empty for true-up rows.
    account: seats
    direction: out
    triggers: []
  # -- billing ledger --
  - type: managed_monthly_fee
    target: managed_billing
    meaning: The monthly seat fee is invoiced in advance for a service month.
    grain: One row per agreement per service month.
    distinguish_by: [billing_period]
    fields: {amount_usd: Fee billed., invoice_number: Monthly invoice., billing_period: Service month., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_proration_charge
    target: managed_billing
    meaning: A partial-month charge for seats added after the start of a service month.
    grain: One row per seat addition billed.
    distinguish_by: [managed_seat_change_id]
    fields: {managed_seat_change_id: Seat addition billed., amount_usd: Prorated amount., invoice_number: Invoice carrying the charge., billing_period: Service month of the partial period., posted_date: Posting date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_onboarding_fee
    target: managed_billing
    meaning: The one-time onboarding fee is invoiced at signing.
    grain: One row per agreement.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee billed., invoice_number: Onboarding invoice., billing_period: Month of signing., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_billable_labor
    target: managed_billing
    meaning: Billable labor on a resolved ticket is invoiced.
    grain: One row per ticket per labor class.
    distinguish_by: [ticket_number, labor_class]
    fields: {ticket_number: Ticket the labor was performed on., labor_class: Labor class billed., billable_minutes: Billable minutes after rounding and minimums., amount_usd: Labor amount including any trip charge., invoice_number: Invoice carrying the charge., billing_period: Month the work was performed., posted_date: Posting date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_sla_credit
    target: managed_billing
    meaning: A service credit for a missed first-response guarantee is applied against an invoice.
    grain: One row per breached ticket credited.
    distinguish_by: [ticket_number]
    fields: {ticket_number: Breached ticket., amount_usd: Credit amount after the monthly cap., invoice_number: Invoice the credit is applied to., billing_period: Service month of the breached ticket., posted_date: Posting date.}
    account: receivable
    direction: out
    triggers: []
  - type: managed_payment
    target: managed_billing
    meaning: A client payment is received and applied to an invoice.
    grain: One row per remittance per invoice applied.
    distinguish_by: [payment_reference, invoice_number]
    fields: {payment_reference: Remittance reference., payment_method: Method of payment (ach / wire / check / card)., amount_usd: Amount applied., invoice_number: Invoice paid., posted_date: Date received.}
    account: receivable
    direction: out
    triggers: []
  - type: managed_late_fee
    target: managed_billing
    meaning: A late fee is assessed on an invoice past due beyond the grace period.
    grain: One row per invoice per month assessed.
    distinguish_by: [invoice_number, billing_period]
    fields: {invoice_number: Past-due invoice the fee is assessed on., billing_period: Month of assessment., amount_usd: Late fee., posted_date: Assessment date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_early_termination_fee
    target: managed_billing
    meaning: The early termination fee is invoiced when an early termination notice takes effect.
    grain: One row per early termination notice.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee billed., invoice_number: Termination invoice., billing_period: Month of the notice., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_reinstatement_fee
    target: managed_billing
    meaning: The reinstatement fee is invoiced when a suspended agreement is reinstated.
    grain: One row per reinstatement.
    distinguish_by: [posted_date]
    fields: {amount_usd: Fee billed., invoice_number: Invoice carrying the fee., billing_period: Month of reinstatement., posted_date: Reinstatement date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_credit_memo
    target: managed_billing
    meaning: A credit memo reverses one specific charge in whole or in part.
    grain: One row per charge reversed.
    distinguish_by: [original_billing_entry_id]
    fields: {original_billing_entry_id: The charge being reversed., amount_usd: Amount reversed., invoice_number: Invoice of the original charge., billing_period: Service month of the original charge., posted_date: Posting date.}
    account: receivable
    direction: out
    triggers: []
  # -- ticket milestones (documentary) --
  - type: managed_ticket_opened
    target: managed_tickets
    meaning: A ticket is logged by the service desk with its priority, category, channel and scope determination.
    grain: One row per ticket.
    distinguish_by: [ticket_number]
    fields: {ticket_number: Ticket number., event_at: Moment logged., priority: Priority assigned., issue_category: Issue classification., channel: Reporting channel., scope_class: Scope determination.}
    triggers: []
  - type: managed_ticket_reprioritized
    target: managed_tickets
    meaning: The service desk changes a ticket's priority.
    grain: One row per priority change.
    distinguish_by: [ticket_number, event_at]
    fields: {ticket_number: Ticket number., event_at: Moment of the change., priority: New priority.}
    triggers: []
  - type: managed_ticket_first_response
    target: managed_tickets
    meaning: A technician makes the first human response on a ticket (call-back, remote session or onsite arrival).
    grain: One row per ticket.
    distinguish_by: [ticket_number]
    fields: {ticket_number: Ticket number., event_at: Moment of first response., priority: Priority in force at first response.}
    triggers: []
  - type: managed_ticket_resolved
    target: managed_tickets
    meaning: A ticket is resolved, with the labor performed and how that labor is settled.
    grain: One row per ticket.
    distinguish_by: [ticket_number]
    fields: {ticket_number: Ticket number., event_at: Moment resolved., priority: Priority at resolution., labor_route: How the labor is settled (included / invoice / timebank)., labor_class: Class of labor performed., billable_minutes: Billable minutes after rounding and minimums.}
    triggers:
      - event: managed:managed_billable_labor
        when: {labor_route: invoice}
        map: {ticket_number: ticket_number, labor_class: labor_class, billable_minutes: billable_minutes}
      - event: timebank:timebank_hours_drawn
        when: {labor_route: timebank}
        map: {ticket_number: ticket_number}


# ---- derived measures ----
measures:
  - id: managed_msr_onsite_included_minutes_month
    window: The calendar month (US Eastern) in which the ticket being settled was resolved, up to but excluding that ticket.
    measure: Sum of billable_minutes on managed_ticket_resolved rows of the agreement whose labor_route is included and whose labor_class is onsite_business_hours or onsite_after_hours.
  - id: managed_msr_service_month_fee
    window: One service month (billing_period) of the agreement.
    measure: amount_usd of the managed_monthly_fee row for that billing_period; where no monthly fee exists for that month, amount_usd of the managed_proration_charge row billing the initial_baseline seat addition for that month.
  - id: managed_msr_sla_credits_month
    window: One service month (billing_period) of the agreement.
    measure: Sum of amount_usd over managed_sla_credit rows whose billing_period is that service month.
  - id: managed_msr_invoice_unpaid_balance
    window: One invoice_number of the agreement, as of the end of the day before the assessment day.
    measure: Sum of amount_usd of the charges billed on that invoice (monthly fee, proration, onboarding, labor, early termination and reinstatement entries) minus the amount_usd of payments, SLA credits and credit memos whose invoice_number is that invoice; late fees are excluded from both sides.
  - id: managed_msr_late_fee_waivers_12m
    window: The 365 calendar days ending on the day the waiver is requested, inclusive.
    measure: Count of managed_credit_memo rows of the agreement posted in the window whose original_billing_entry_id points at a managed_late_fee row.

# ---- policies ----
policies:
  - id: managed_agg_multi_holding
    subject: [managed_agreement_signed]
    rule: >-
      A client organisation holds at most one ClearPath agreement at a time; every user, site and device the client wants
      managed is covered under that single agreement, and a move between tiers is a tier change on the existing agreement,
      never a second agreement. A new agreement may be signed only when the client holds no other ClearPath agreement whose
      status is applied, onboarding, active, suspended, notice_given or offboarding. A closed or cancelled agreement does not
      block a new one; a returning client signs a new agreement with a new term and a new onboarding fee assessment.
    eligibility:
      - id: single_open_agreement
        applies_to: [managed_agreement_signed]
        kind: dedup
        condition: A new agreement may be signed only when the client holds no other ClearPath agreement whose status is applied, onboarding, active, suspended, notice_given or offboarding.
        evidence_fields: [managed_agreements.customer_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.customer_id]]
          action_bindings: {managed_agreements.customer_id: customer_id}
        dedup_contract:
          table: managed_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, onboarding, active, suspended, notice_given, offboarding]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: managed_signing_terms
    subject: [managed_agreement_signed, managed_onboarding_fee]
    rule: >-
      An agreement is signed for one tier, at a seat commitment no lower than that tier's min_seats and for a term listed in
      the tier's allowed_terms_months; a request for a seat commitment or term the tier does not offer cannot be signed on
      that tier. ClearPath Premier and ClearPath Enterprise may be signed only while the client holds a Sentinel Managed
      Security subscription whose status is active. The contracted seat_rate_usd is the tier's seat_rate_list_usd reduced by
      the tier's term_discount_pct for the signed term length, rounded half up to the cent. The onboarding fee equals
      onboarding_fee_per_seat_usd times contracted_seats, but never less than onboarding_fee_minimum_usd, and is invoiced on
      the signing date with payment due under the tier's invoice_due_days. The onboarding fee is waived entirely when the
      initial term is at least onboarding_fee_waiver_min_term_months months, in which case no onboarding fee is posted at all.
      Renewal terms and tier changes never generate an onboarding fee.
    eligibility:
      - id: premier_requires_sentinel
        applies_to: [managed_agreement_signed]
        kind: state
        condition: ClearPath Premier and ClearPath Enterprise may be signed only while the client holds a Sentinel Managed Security subscription whose status is active.
        evidence_fields: [security_subscriptions.customer_id, security_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_subscriptions.customer_id]]
          action_bindings: {security_subscriptions.customer_id: customer_id}
        state_contract:
          field: security_subscriptions.status
          allowed: [active]
    formula:
      seat_rate_usd: round(seat_rate_list_usd * (1 - term_discount_pct / 100), 2)
      when_not: term_months >= onboarding_fee_waiver_min_term_months
      amount_usd: max(onboarding_fee_per_seat_usd * contracted_seats, onboarding_fee_minimum_usd)

  - id: managed_onboarding_and_go_live
    subject: [managed_onboarding_started, managed_go_live, managed_cancelled]
    rule: >-
      Onboarding may be kicked off only after the onboarding fee invoice has been paid in full, or when no onboarding fee was
      posted because it was waived. The onboarding_target_business_days figure is a planning target, not a guarantee, and
      missing it earns no credit. Go-live is recorded when onboarding completes: the initial term starts on the go-live date,
      and term_end_date is the day before the same day of the month term_months calendar months later (when that day does
      not exist in the target month, the last day of the target month is used as the anniversary and the term ends the day
      before it). Go-live posts the initial seat baseline equal to contracted_seats. A signed agreement may be cancelled by
      the client only before onboarding is kicked off; once onboarding has started the agreement can be ended only by notice
      after go-live. On a cancellation, an onboarding fee that was posted is reversed in full by a credit memo against that
      fee, and any amount already paid is refunded by the accounting team.
    eligibility:
      - id: onboarding_fee_settled
        applies_to: [managed_onboarding_started]
        kind: authorization
        condition: Onboarding may be kicked off only after the onboarding fee invoice has been paid in full, or when no onboarding fee was posted because it was waived.
        evidence_fields: [managed_billing.managed_agreement_id, managed_billing.event_type, managed_billing.invoice_number, managed_billing.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.managed_agreement_id]]
          action_bindings: {managed_billing.managed_agreement_id: managed_agreement_id}

  - id: managed_seat_changes_and_proration
    subject: [managed_seat_add, managed_seat_remove, managed_proration_charge]
    rule: >-
      Seats are added and removed one named user at a time under a service desk user_onboarding or user_offboarding ticket,
      at go-live as the initial baseline, and on the true_up_snapshot_day of each month as a monthly true-up when the
      client's licensed directory users exceed or fall below seat_count. Seat changes may be posted only while the agreement
      status is active or notice_given. Business days are Monday through Friday excluding the observed_holiday_list. A
      new-user onboarding is ready on the requested start date only when the onboarding ticket was opened at least
      new_user_lead_business_days business days before that date; otherwise the account is enabled on the business day that
      is new_user_lead_business_days business days after the ticket was opened, and the seat's effective_date is the date the
      account was actually enabled. An offboarding request received on a business day before offboarding_same_day_cutoff (US
      Eastern) is completed that day, otherwise on the next business day, and the seat removal's effective_date is the
      completion date; an emergency offboarding for an involuntary termination is opened as a P1 security_concern and
      completed on receipt. Every seat addition is prorated: the proration charge equals seat_rate_usd times seat_qty times
      the number of calendar days from the effective_date through the last day of that calendar month inclusive, divided by
      the number of days in that month, rounded half up to the cent, and is billed on the next monthly invoice under the
      service month of the effective date. Seat removals never generate a credit or refund for the current service month:
      the removed seat stays billed through the end of the month in which it was removed and drops out of the monthly fee
      from the next service month. A seat removal may take seat_count below the minimum-commitment floor, but billing never
      falls below the floor.
    eligibility:
      - id: seat_change_live_agreement
        applies_to: [managed_seat_add, managed_seat_remove]
        kind: state
        condition: Seat changes may be posted only while the agreement status is active or notice_given.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, notice_given]

  - id: managed_monthly_fee_calc
    subject: [managed_monthly_fee]
    rule: >-
      The monthly fee for a service month is invoiced in advance on monthly_invoice_day of that month and equals seat_rate_usd
      times the billed seats, rounded half up to the cent. Billed seats are the greater of seat_count as it stood at the end
      of the last day of the previous month and the minimum-commitment floor, which is contracted_seats times
      min_seat_commitment_pct divided by 100, rounded up to a whole seat. Seats added on or after the first day of the service
      month are billed by proration, not by this fee. The first service month after go-live is billed by the baseline
      proration charge, and the monthly fee starts with the first calendar month that begins after the go-live date. A
      monthly fee may be invoiced only while the agreement status is active, suspended or notice_given. The fee continues
      during a suspension; no monthly fee is invoiced for a service month that begins after the termination effective date.
      Payment is due invoice_due_days calendar days after the posted date.
    eligibility:
      - id: billable_status
        applies_to: [managed_monthly_fee]
        kind: state
        condition: A monthly fee may be invoiced only while the agreement status is active, suspended or notice_given.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, suspended, notice_given]
    formula:
      floor_seats: contracted_seats * min_seat_commitment_pct / 100
      billed_seats: max(seat_count, floor_seats)
      amount_usd: round(seat_rate_usd * billed_seats, 2)

  - id: managed_ticket_priority_and_scope
    subject: [managed_ticket_opened, managed_ticket_reprioritized]
    rule: >-
      The service desk assigns priority from impact and urgency: P1 is a complete outage of a business-critical system or a
      confirmed security incident with no workaround; P2 is a business-critical system degraded or an outage affecting a
      single site or department with a workaround; P3 is a single user unable to work or a non-critical system down; P4 is a
      service request, how-to question or scheduled change. Where p1_requires_phone is true, a ticket is worked and measured
      as P1 only when it was reported by phone; an outage reported through the portal, email or chat is logged as P2 until
      the client calls it in, and a phoned-in escalation is recorded as a reprioritisation at the moment of the call. When a
      ticket's priority is raised, the first-response guarantee of the new priority is measured from the moment of the
      reprioritisation; when it is lowered, the guarantee of the lower priority is measured from the original opening; a
      reprioritisation after the first response does not change the priority used for the SLA. Scope is determined when the
      ticket is opened: help desk work is covered only where helpdesk_remote_included is true, Microsoft 365 tenant
      administration only where m365_administration_included is true, liaison with line-of-business vendors and the ISP only
      where vendor_management_included is true, and firewall, switch and wireless changes only where
      network_device_management_included is true; user_onboarding and user_offboarding tickets are covered wherever
      helpdesk_remote_included is true. Work outside those entitlements is billable_out_of_scope. Any single change whose
      estimated effort exceeds project_referral_threshold_hours, new deployments, migrations and office moves are
      project_referral and are quoted under a project statement of work instead of being billed as ticket labor. Strategic
      reviews (vcio_reviews_per_year), the named client success manager (dedicated_account_manager), the technical account
      manager (technical_account_manager) and security awareness training (security_awareness_training) are entitlements of
      the tier and are scheduled through the account team, never billed as ticket labor.
    eligibility: []
    params:
      project_referral_threshold_hours: 8

  - id: managed_billable_labor_rates
    subject: [managed_ticket_resolved, managed_billable_labor]
    rule: >-
      On resolution the labor on a ticket is settled as included, invoiced or drawn from a prepaid block. Coverage hours are
      the tier's coverage_days between coverage_start and coverage_end, US Eastern, excluding the observed_holiday_list where
      observed_holidays_excluded is true; labor is after-hours when it is performed outside coverage hours. Labor is included
      when the ticket's scope_class is covered and the labor is remote within coverage hours on a tier whose
      helpdesk_remote_included is true, remote after-hours on a tier whose after_hours_remote_included is true, remote
      after-hours on a P1 ticket on a tier whose p1_after_hours_included is true, or onsite while the onsite minutes already
      included in that calendar month (managed_msr_onsite_included_minutes_month) are below included_onsite_hours_monthly;
      when a visit's minutes exceed the included onsite minutes remaining for the month, only the excess is billable and the
      onsite minimum does not apply to that excess. All other labor on covered or billable_out_of_scope tickets is billable;
      project_referral tickets are never billed as labor. Billable minutes are the recorded minutes rounded up to
      billing_increment_minutes, and never less than minimum_billable_minutes_remote for remote work or
      minimum_billable_minutes_onsite for an onsite visit. The labor amount is billable minutes divided by 60 times
      remote_hourly_rate_usd or onsite_hourly_rate_usd, times after_hours_multiplier for after-hours labor, rounded half up
      to the cent, plus onsite_trip_charge_usd for each onsite visit that is wholly billable. When the client holds a
      TimeBank prepaid block whose status is active and whose remaining hours cover the billable minutes, the labor route is
      timebank and the hours are drawn from that block under the TimeBank rules instead of being invoiced; otherwise the
      labor route is invoice and the amount is billed on the next monthly invoice. Labor may be billed only on an agreement
      whose status is active, suspended, notice_given or offboarding.
    eligibility:
      - id: labor_billable_status
        applies_to: [managed_billable_labor]
        kind: state
        condition: Labor may be billed only on an agreement whose status is active, suspended, notice_given or offboarding.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, suspended, notice_given, offboarding]
    measures: [managed_msr_onsite_included_minutes_month]
    formula:
      hourly_rate: remote_hourly_rate_usd if labor_class in ("remote_business_hours", "remote_after_hours") else onsite_hourly_rate_usd
      multiplier: after_hours_multiplier if labor_class in ("remote_after_hours", "onsite_after_hours") else 1
      labor_amount: round(billable_minutes / 60 * hourly_rate * multiplier, 2)
      trip_charge: onsite_trip_charge_usd if labor_class in ("onsite_business_hours", "onsite_after_hours") else 0
      amount_usd: labor_amount + trip_charge

  - id: managed_sla_response_credit
    subject: [managed_ticket_first_response, managed_sla_credit]
    rule: >-
      A first-response guarantee is breached when the coverage minutes elapsed between the ticket's opening (or the raise of
      its priority) and its first response exceed the response target of the priority in force at first response
      (response_target_minutes_p1, response_target_minutes_p2,
      response_target_minutes_p3 or response_target_minutes_p4). Coverage minutes count only time inside the tier's
      coverage window and exclude observed holidays where observed_holidays_excluded is true. Resolution targets
      (resolution_target_hours_p1, resolution_target_hours_p2) are objectives and never earn credits. A breach earns a
      service credit only when the tier's sla_credits_eligible is true, the priority is listed in sla_credit_priorities, the
      ticket's scope_class is covered, and the client claims it. The credit must be claimed no later than
      sla_credit_claim_window_days calendar days after the first response is recorded on the ticket. The window is counted
      in calendar days from the date part of the first-response timestamp, that date being day 0, and a claim made on the
      last day of the window is timely. A ticket earns at most one service credit. Each credited ticket earns
      sla_credit_pct_per_breach percent of the fee billed for the service month in which the ticket was opened
      (managed_msr_service_month_fee), rounded half up to the cent; total credits for one service month never exceed
      sla_credit_cap_pct_monthly percent of that month's fee (managed_msr_sla_credits_month), and a credit that would pass the
      cap is reduced to the remaining headroom, none being posted once the cap is reached. The credit is applied to the
      next monthly invoice posted after the claim. A credit may be posted only while the agreement status is active,
      suspended, notice_given or offboarding. Credits are never paid out in cash and are forfeited when the agreement closes.
    eligibility:
      - id: claim_window
        applies_to: [managed_sla_credit]
        kind: time
        condition: The credit must be claimed no later than sla_credit_claim_window_days calendar days after the first response is recorded on the ticket.
        evidence_fields: [managed_tickets.ticket_number, managed_tickets.event_type, managed_tickets.event_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_tickets.ticket_number]]
          action_bindings: {managed_tickets.ticket_number: ticket_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the first response is recorded on the ticket
          anchor_source: managed_tickets.event_at
          relation: not_after
          duration_source: variants.sla_credit_claim_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days from the date part of the first-response timestamp, that date being day 0, and a claim made on the last day of the window is timely.
          boundary: inclusive
      - id: one_credit_per_ticket
        applies_to: [managed_sla_credit]
        kind: dedup
        condition: A ticket earns at most one service credit.
        evidence_fields: [managed_billing.ticket_number, managed_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.ticket_number]]
          action_bindings: {managed_billing.ticket_number: ticket_number}
        dedup_contract:
          table: managed_billing
          mode: separate_record
          object_bindings: {ticket_number: ticket_number}
          duplicate_filters: {event_type: [managed_sla_credit]}
          distinct_fields: []
      - id: credit_status
        applies_to: [managed_sla_credit]
        kind: state
        condition: A credit may be posted only while the agreement status is active, suspended, notice_given or offboarding.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, suspended, notice_given, offboarding]
    measures: [managed_msr_service_month_fee, managed_msr_sla_credits_month]
    params:
      per_tier:
        ClearPath Monitor: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Essentials: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Standard: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Professional: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Premier: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Enterprise: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
    formula:
      credit_raw: round(managed_msr_service_month_fee * sla_credit_pct_per_breach / 100, 2)
      headroom: managed_msr_service_month_fee * sla_credit_cap_pct_monthly / 100 - managed_msr_sla_credits_month
      amount_usd: max(min(credit_raw, round(headroom, 2)), 0)

  - id: managed_late_fee_and_suspension
    subject: [managed_late_fee, managed_suspended, managed_reinstated, managed_reinstatement_fee, managed_credit_memo]
    rule: >-
      An invoice falls due invoice_due_days calendar days after its posted date. On the first day of each calendar month,
      every invoice of the agreement that still has an unpaid balance and whose grace period has ended is assessed one late
      fee. A late fee may be assessed on an invoice only once more than late_fee_grace_days calendar days have passed since
      the invoice falls due. The grace period is counted in calendar days starting the day after the due date, which is the
      posted date plus invoice_due_days calendar days. Each late fee equals late_fee_pct_monthly percent of the invoice's
      unpaid balance on the assessment day (managed_msr_invoice_unpaid_balance), rounded half up to the cent, or late_fee_minimum_usd if that is greater; late
      fees are not themselves assessed late fees, and SLA credits are deducted from the invoice they were applied to before
      the unpaid balance is measured. On request of the authorized contact one late fee may be waived as a courtesy by a
      credit memo reversing that fee, provided the agreement's courtesy waivers in the preceding 365 days
      (managed_msr_late_fee_waivers_12m) are fewer than courtesy_waivers_per_12_months. Service may be suspended only once
      the oldest unpaid invoice is at least suspension_days_past_due calendar days past its due date. The accounting team
      sends the written warning suspension_warning_days before suspension. Suspension stops remote and onsite support but not
      monitoring or billing. Reinstatement may be recorded only after every invoice past its due date has been paid in full.
      The reinstatement fee of reinstatement_fee_usd is invoiced on the reinstatement date and falls due under the normal terms. An agreement that has
      stayed suspended for termination_for_nonpayment_days calendar days may be terminated for non-payment, which starts the
      transition-out; the past-due balance remains collectible and no early termination fee is charged on that path.
    eligibility:
      - id: late_fee_after_grace
        applies_to: [managed_late_fee]
        kind: time
        condition: A late fee may be assessed on an invoice only once more than late_fee_grace_days calendar days have passed since the invoice falls due.
        evidence_fields: [managed_billing.invoice_number, managed_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.invoice_number]]
          action_bindings: {managed_billing.invoice_number: invoice_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice falls due
          anchor_source: managed_billing.posted_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date, which is the posted date plus invoice_due_days calendar days.
          boundary: exclusive
      - id: suspension_threshold
        applies_to: [managed_suspended]
        kind: time
        condition: Service may be suspended only once the oldest unpaid invoice is at least suspension_days_past_due calendar days past its due date.
        evidence_fields: [managed_billing.invoice_number, managed_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.invoice_number]]
          action_bindings: {managed_billing.invoice_number: invoice_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: its due date
          anchor_source: managed_billing.posted_date
          relation: not_before
          duration_source: variants.suspension_days_past_due
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date, which is the posted date plus invoice_due_days calendar days.
          boundary: inclusive
      - id: reinstatement_paid_up
        applies_to: [managed_reinstated]
        kind: authorization
        condition: Reinstatement may be recorded only after every invoice past its due date has been paid in full.
        evidence_fields: [managed_billing.managed_agreement_id, managed_billing.invoice_number, managed_billing.event_type, managed_billing.amount_usd, managed_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.managed_agreement_id]]
          action_bindings: {managed_billing.managed_agreement_id: managed_agreement_id}
    measures: [managed_msr_late_fee_waivers_12m, managed_msr_invoice_unpaid_balance]
    params:
      courtesy_waivers_per_12_months: 1
    formula:
      amount_usd: max(round(late_fee_pct_monthly / 100 * managed_msr_invoice_unpaid_balance, 2), late_fee_minimum_usd)

  - id: managed_payment_application
    subject: [managed_payment]
    rule: >-
      A payment is applied to the invoice its remittance names; when the remittance names no invoice it is applied to the
      oldest open invoice first, by posted date and then by invoice number, and any remainder to the next oldest, posting one
      payment entry per invoice applied. Partial payments are accepted and leave the rest of the invoice open. An amount
      beyond every open invoice stays on the agreement as a credit balance against future invoices. Card payments are
      accepted only for an invoice whose total does not exceed card_payment_max_usd; larger invoices are paid by ACH, wire or
      check. A remittance reference is applied to a given invoice only once.
    eligibility:
      - id: one_application_per_invoice
        applies_to: [managed_payment]
        kind: dedup
        condition: A remittance reference is applied to a given invoice only once.
        evidence_fields: [managed_billing.payment_reference, managed_billing.invoice_number, managed_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.payment_reference, managed_billing.invoice_number]]
          action_bindings: {managed_billing.payment_reference: payment_reference, managed_billing.invoice_number: invoice_number}
        dedup_contract:
          table: managed_billing
          mode: separate_record
          object_bindings: {payment_reference: payment_reference, invoice_number: invoice_number}
          duplicate_filters: {event_type: [managed_payment]}
          distinct_fields: []

  - id: managed_renewal_and_uplift
    subject: [managed_renewed, managed_notice_given, managed_offboarding_started]
    rule: >-
      At the end of a term an agreement whose auto_renew is true renews for renewal_term_months unless a signed non-renewal
      notice stands. A non-renewal notice stops the next renewal only when it is received no later than notice_days calendar
      days before the current term ends. The notice deadline is term_end_date minus notice_days calendar days, and a notice
      received on the deadline itself is timely. A non-renewal notice received after the deadline does not stop the coming
      renewal; it is recorded with a termination_effective_date equal to the end of the renewal term that follows. A timely
      non-renewal notice carries a termination_effective_date equal to the current term_end_date and no fee. The renewal
      term starts the day after the expiring term_end_date. Its seat_rate_usd is the expiring seat_rate_usd increased by
      renewal_uplift_cap_pct percent, rounded half up to the cent, unless the tier's current seat_rate_list_usd reduced by
      its term_discount_pct for the renewal term length is lower, in which case the lower rate applies. Its contracted_seats
      equal seat_count on the expiring term_end_date, but never less than the tier's min_seats. A renewal may be recorded
      only while the agreement status is active or suspended. An agreement whose auto_renew is false and that has no signed
      renewal on file does not renew; at its term end it moves to the transition-out.
    eligibility:
      - id: timely_non_renewal
        applies_to: [managed_notice_given]
        kind: time
        condition: A non-renewal notice stops the next renewal only when it is received no later than notice_days calendar days before the current term ends.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.term_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the current term ends
          anchor_source: managed_agreements.term_end_date
          relation: not_after
          duration_source: variants.notice_days
          unit: calendar_days
          counting_rule: The notice deadline is term_end_date minus notice_days calendar days, and a notice received on the deadline itself is timely.
          boundary: inclusive
      - id: renewal_status
        applies_to: [managed_renewed]
        kind: state
        condition: A renewal may be recorded only while the agreement status is active or suspended.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, suspended]
    formula:
      uplifted_rate: round(seat_rate_usd * (1 + renewal_uplift_cap_pct / 100), 2)
      list_rate: round(seat_rate_list_usd * (1 - term_discount_pct / 100), 2)
      seat_rate_usd: min(uplifted_rate, list_rate)
      contracted_seats: max(seat_count, min_seats)

  - id: managed_early_termination_and_exit
    subject: [managed_notice_given, managed_early_termination_fee, managed_notice_withdrawn, managed_credit_memo, managed_offboarding_started, managed_closed]
    rule: >-
      A client may end the agreement before the term ends by a signed early termination notice. Its
      termination_effective_date is the later of the date the client asks for and the notice_received_date plus notice_days
      calendar days; a requested date after term_end_date is a non-renewal, not an early termination. The early termination
      fee equals early_termination_fee_pct percent of seat_rate_usd times the minimum-commitment floor seats times the number
      of service months that begin after the termination_effective_date and on or before term_end_date, rounded half up to
      the cent; it is invoiced on the date the notice takes effect on the agreement. Non-renewal notices carry no fee. A
      notice may be withdrawn by the client only before the termination effective date. Withdrawal is possible up to and
      including the day before termination_effective_date, counted in calendar days. On withdrawal of an early termination
      notice the early termination fee is reversed in full by a credit memo against that fee entry. A charge is reversed by
      credit memo at most once. At the termination effective date the transition-out begins: the tier's
      transition_assistance_included_hours are provided at no charge, and further transition assistance is quoted under a
      project statement of work at transition_assistance_rate_usd per hour. The agreement closes when the transition-out is
      complete; the client may request an export of retained documentation and configurations within
      data_return_window_days calendar days after closing. Unapplied service credits are forfeited at closing, and any
      balance due remains collectible.
    eligibility:
      - id: withdraw_before_effective
        applies_to: [managed_notice_withdrawn]
        kind: time
        condition: A notice may be withdrawn by the client only before the termination effective date.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.termination_effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the termination effective date
          anchor_source: managed_agreements.termination_effective_date
          relation: not_after
          duration_source: params.withdrawal_lead_days
          unit: calendar_days
          counting_rule: Withdrawal is possible up to and including the day before termination_effective_date, counted in calendar days.
          boundary: inclusive
      - id: one_reversal_per_charge
        applies_to: [managed_credit_memo]
        kind: dedup
        condition: A charge is reversed by credit memo at most once.
        evidence_fields: [managed_billing.original_billing_entry_id, managed_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.original_billing_entry_id]]
          action_bindings: {managed_billing.original_billing_entry_id: original_billing_entry_id}
        dedup_contract:
          table: managed_billing
          mode: separate_record
          object_bindings: {original_billing_entry_id: original_billing_entry_id}
          duplicate_filters: {event_type: [managed_credit_memo]}
          distinct_fields: []
    params:
      withdrawal_lead_days: 1

  - id: managed_tier_change
    subject: [managed_tier_changed]
    rule: >-
      A tier change takes effect only from the client's signed change request. An upgrade to a higher-ranked tier takes
      effect on the first day of the calendar month after the signature; a downgrade to a lower-ranked tier takes effect only
      on the first day of a renewal term, because tier_downgrade_mid_term_allowed is false on every tier. The new
      seat_rate_usd is the new tier's seat_rate_list_usd reduced by the new tier's term_discount_pct for the current
      term_months, rounded half up to the cent; when the new tier does not offer the current term length, the discount of the
      longest term it offers that does not exceed the current term applies, or none if there is no such term. seat_count on
      the effective date must meet the new tier's min_seats, and an upgrade to ClearPath Premier or ClearPath Enterprise
      needs an active Sentinel Managed Security subscription. A tier change neither restarts the term nor changes
      contracted_seats, generates no onboarding fee, and is never prorated: the monthly fee of the effective month onward
      uses the new rate. A tier change may take effect only while the agreement status is active.
    eligibility:
      - id: tier_change_active
        applies_to: [managed_tier_changed]
        kind: state
        condition: A tier change may take effect only while the agreement status is active.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active]
    formula:
      seat_rate_usd: round(seat_rate_list_usd * (1 - term_discount_pct / 100), 2)

  - id: managed_client_signed_changes
    subject: [managed_notice_given, managed_notice_withdrawn, managed_tier_changed, managed_cancelled]
    rule: >-
      Notices of non-renewal, early termination notices, withdrawals of a notice, tier changes and cancellations before
      onboarding change the client's contract and take effect only on the authorized contact's e-signature. The service desk
      registers each as a service request carrying the request type, the target tier for a tier change, and the effective
      date computed under this charter, pending the client's signature; it never applies the change itself. A contract
      change request may be registered only on behalf of the client's authorized contact after identity verification has
      passed. Once signed, the request takes effect through the matching agreement change; a request the client does not
      sign within the signature_validity_days calendar days after registration lapses as withdrawn.
    eligibility:
      - id: verified_contact
        applies_to: [managed_notice_given, managed_notice_withdrawn, managed_tier_changed, managed_cancelled]
        kind: authorization
        condition: A contract change request may be registered only on behalf of the client's authorized contact after identity verification has passed.
        evidence_fields: [identity_verifications.customer_id, identity_verifications.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[identity_verifications.customer_id]]
          action_bindings: {identity_verifications.customer_id: customer_id}
    params:
      signature_validity_days: 14
