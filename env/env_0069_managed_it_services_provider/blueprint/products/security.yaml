# ---- data flow ----
events:
  - type: security_subscription_ordered
    target: security_subscriptions
    mutation: create
    meaning: The client signs an order for a Sentinel tier, endpoint commitment and term.
    grain: One subscription record per signed order.
    fields:
      customer_id: Client organisation ordering.
      variant_name: Official Sentinel tier ordered.
      order_date: Date of signature.
      term_months: Term ordered.
      contracted_endpoints: Endpoint commitment.
      workstation_rate_usd: Contracted workstation rate after discounts.
      server_rate_usd: Contracted server rate after discounts.
    triggers: []
  - type: security_deployment_started
    target: security_subscriptions
    mutation: {transition: {from: ordered, to: deploying}}
    meaning: Agent deployment begins.
    grain: One transaction per subscription.
    fields: {deployment_start_date: Date deployment began.}
    triggers: []
  - type: security_activated
    target: security_subscriptions
    mutation: {transition: {from: deploying, to: active}}
    meaning: Monitoring goes live and the term starts.
    grain: One transaction per subscription.
    fields: {activation_date: Date monitoring went live., term_start_date: Equal to activation_date., term_end_date: Last day of the initial term.}
    triggers:
      - event: security:security_ir_hours_granted
        map: {grant_reason: contract_year_start}
  - type: security_order_cancelled
    target: security_subscriptions
    mutation: {transition: {from: ordered, to: cancelled}}
    meaning: The client cancels the order before deployment begins.
    grain: One transaction per subscription.
    fields: {closed_date: Date cancelled.}
    triggers: []
  - type: security_suspended
    target: security_subscriptions
    mutation: {transition: {from: active, to: suspended}}
    meaning: SOC monitoring is suspended for non-payment.
    grain: One transaction per suspension.
    fields: {suspended_date: Date suspended.}
    triggers: []
  - type: security_reinstated
    target: security_subscriptions
    mutation: {transition: {from: suspended, to: active}}
    meaning: Monitoring is reinstated after payment.
    grain: One transaction per reinstatement.
    fields: {suspended_date: Retained as the date of the suspension that ended.}
    triggers: []
  - type: security_notice_given
    target: security_subscriptions
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The client's signed notice of non-renewal or early termination takes effect.
    grain: One transaction per notice.
    fields: {notice_type: non_renewal or early_termination., notice_received_date: Date received., cancellation_effective_date: Date the subscription ends.}
    triggers:
      - event: security:security_early_termination_fee
        when: {notice_type: early_termination}
        map: {}
  - type: security_notice_withdrawn
    target: security_subscriptions
    mutation: {transition: {from: notice_given, to: active}}
    meaning: The client withdraws its notice before the effective date.
    grain: One transaction per withdrawal.
    fields: {notice_type: Reset to none., notice_received_date: Cleared., cancellation_effective_date: Cleared.}
    triggers: []
  - type: security_closed
    target: security_subscriptions
    mutation: {transition: [{from: notice_given, to: closed}, {from: suspended, to: closed}]}
    meaning: The subscription ends; agents are uninstalled and remaining IR hours lapse.
    grain: One transaction per subscription.
    fields: {closed_date: Date closed.}
    triggers:
      - event: security:security_ir_hours_forfeited
        map: {}
  - type: security_tier_changed
    target: security_subscriptions
    mutation: update
    meaning: A signed tier change takes effect.
    grain: One transaction per tier change.
    fields: {variant_name: New tier., workstation_rate_usd: New workstation rate., server_rate_usd: New server rate.}
    triggers: []
  - type: security_renewed
    target: security_subscriptions
    mutation: update
    meaning: The subscription rolls into a renewal term.
    grain: One transaction per renewal term.
    fields: {term_start_date: First day of the renewal term., term_end_date: Last day of the renewal term., term_months: Renewal term length., workstation_rate_usd: Renewal workstation rate., server_rate_usd: Renewal server rate., contracted_endpoints: Renewal endpoint commitment.}
    triggers: []
  - type: security_endpoints_enrolled
    target: security_endpoint_changes
    meaning: Endpoints are enrolled with the Sentinel agent.
    grain: One row per enrollment batch of one device class on one date for one reason.
    distinguish_by: [effective_date, device_class, change_reason]
    fields: {endpoint_qty: Endpoints enrolled., device_class: workstation or server., effective_date: Install date., change_reason: Reason.}
    account: endpoints
    direction: in
    triggers: []
  - type: security_endpoints_retired
    target: security_endpoint_changes
    meaning: Endpoints are retired and their agents uninstalled.
    grain: One row per retirement batch of one device class on one date for one reason.
    distinguish_by: [effective_date, device_class, change_reason]
    fields: {endpoint_qty: Endpoints retired., device_class: workstation or server., effective_date: Uninstall date., change_reason: Reason.}
    account: endpoints
    direction: out
    triggers: []
  - type: security_monthly_fee
    target: security_billing
    meaning: The monthly subscription fee is invoiced in advance.
    grain: One row per subscription per service month.
    distinguish_by: [billing_period]
    fields: {amount_usd: Fee., invoice_number: Invoice., billing_period: Service month., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: security_onboarding_fee
    target: security_billing
    meaning: The one-time onboarding fee is invoiced at order.
    grain: One row per subscription.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee., invoice_number: Invoice., billing_period: Month of order., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: security_ir_overage_charge
    target: security_billing
    meaning: Incident response hours beyond the available balance are invoiced.
    grain: One row per incident.
    distinguish_by: [incident_number]
    fields: {incident_number: Incident., billed_hours: Hours billed., amount_usd: Amount., invoice_number: Invoice., billing_period: Month of closure., posted_date: Posting date.}
    account: receivable
    direction: in
    triggers: []
  - type: security_service_credit
    target: security_billing
    meaning: A credit for a missed acknowledgement guarantee is applied.
    grain: One row per breached incident credited.
    distinguish_by: [incident_number]
    fields: {incident_number: Breached incident., amount_usd: Credit after cap., invoice_number: Invoice credited., billing_period: Service month of detection., posted_date: Posting date.}
    account: receivable
    direction: out
    triggers: []
  - type: security_payment
    target: security_billing
    meaning: A client payment is applied to an invoice.
    grain: One row per remittance per invoice.
    distinguish_by: [payment_reference, invoice_number]
    fields: {payment_reference: Remittance reference., amount_usd: Amount applied., invoice_number: Invoice paid., posted_date: Date received.}
    account: receivable
    direction: out
    triggers: []
  - type: security_late_fee
    target: security_billing
    meaning: A late fee is assessed on a past-due invoice.
    grain: One row per invoice per month assessed.
    distinguish_by: [invoice_number, billing_period]
    fields: {invoice_number: Past-due invoice., billing_period: Month assessed., amount_usd: Fee., posted_date: Assessment date.}
    account: receivable
    direction: in
    triggers: []
  - type: security_early_termination_fee
    target: security_billing
    meaning: The early termination fee is invoiced when an early termination notice takes effect.
    grain: One row per notice.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee., invoice_number: Invoice., billing_period: Month of notice., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: security_incident_detected
    target: security_incidents
    meaning: The SOC opens an incident from correlated alerts with a severity.
    grain: One row per incident.
    distinguish_by: [incident_number]
    fields: {incident_number: Incident number., severity: Severity at detection., event_at: Detection moment.}
    triggers: []
  - type: security_incident_acknowledged
    target: security_incidents
    meaning: An analyst acknowledges the incident and begins triage.
    grain: One row per incident.
    distinguish_by: [incident_number]
    fields: {incident_number: Incident number., severity: Severity at acknowledgement., event_at: Acknowledgement moment.}
    triggers: []
  - type: security_incident_closed
    target: security_incidents
    meaning: The incident is closed with any incident response time logged.
    grain: One row per incident.
    distinguish_by: [incident_number]
    fields: {incident_number: Incident number., severity: Final severity., event_at: Closure moment., ir_engaged: Whether IR was engaged., ir_hours_logged: IR hours logged.}
    triggers:
      - event: security:security_ir_hours_consumed
        when: {ir_engaged: true}
        map: {incident_number: incident_number}
  - type: security_ir_hours_granted
    target: security_ir_ledger
    meaning: Incident response hours are granted for a contract year (annual allotment or rollover).
    grain: One row per contract year per grant reason.
    distinguish_by: [contract_year_start, grant_reason]
    fields: {hours: Hours granted., contract_year_start: Contract year., grant_reason: contract_year_start or rollover.}
    account: ir_hours
    direction: in
    triggers: []
  - type: security_ir_hours_consumed
    target: security_ir_ledger
    meaning: Incident response hours are drawn for an engaged incident.
    grain: One row per incident.
    distinguish_by: [incident_number]
    fields: {hours: Hours drawn from the balance., contract_year_start: Contract year drawn from., incident_number: Incident.}
    account: ir_hours
    direction: out
    triggers: []
  - type: security_ir_hours_forfeited
    target: security_ir_ledger
    meaning: Unused hours lapse at contract-year end beyond the rollover allowance, or at closing.
    grain: One row per contract year lapsing.
    distinguish_by: [contract_year_start]
    fields: {hours: Hours forfeited., contract_year_start: Contract year lapsing.}
    account: ir_hours
    direction: out
    triggers: []


measures:
  - id: security_msr_service_month_fee
    window: One service month (billing_period) of the subscription.
    measure: amount_usd of the security_monthly_fee row for that billing_period.
  - id: security_msr_credits_month
    window: One service month (billing_period) of the subscription.
    measure: Sum of amount_usd over security_service_credit rows whose billing_period is that month.
  - id: security_msr_ir_balance_year
    window: The contract year containing the incident's closure (contract_year_start of the current year).
    measure: Sum of hours of security_ir_hours_granted rows minus security_ir_hours_consumed and security_ir_hours_forfeited rows for that contract_year_start.

policies:
  - id: security_agg_multi_holding
    subject: [security_subscription_ordered]
    rule: >-
      A client organisation holds at most one Sentinel subscription; every endpoint is enrolled under it, and running two
      endpoint agents on one device is not supported. A new subscription may be ordered only when the client holds no other
      Sentinel subscription whose status is ordered, deploying, active, suspended or notice_given.
    eligibility:
      - id: single_open_subscription
        applies_to: [security_subscription_ordered]
        kind: dedup
        condition: A new subscription may be ordered only when the client holds no other Sentinel subscription whose status is ordered, deploying, active, suspended or notice_given.
        evidence_fields: [security_subscriptions.customer_id, security_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_subscriptions.customer_id]]
          action_bindings: {security_subscriptions.customer_id: customer_id}
        dedup_contract:
          table: security_subscriptions
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [ordered, deploying, active, suspended, notice_given]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: security_ordering_and_pricing
    subject: [security_subscription_ordered, security_onboarding_fee]
    rule: >-
      An order is placed for one tier at an endpoint commitment no lower than min_endpoints and for a term listed in
      allowed_terms_months. Sentinel EDR Essentials is self-managed without SOC triage and cannot be ordered by a client whose
      ClearPath agreement is ClearPath Premier or ClearPath Enterprise, because those tiers require SOC-monitored coverage.
      The contracted workstation_rate_usd and server_rate_usd are the tier's list rates reduced by term_discount_pct for the
      ordered term and, when the client holds a ClearPath agreement whose status is active and whose tier rank is at least
      clearpath_bundle_min_rank, further reduced by clearpath_bundle_discount_pct; the two discounts are added together and
      applied once to the list rate, rounded half up to the cent. The onboarding fee equals onboarding_fee_per_endpoint_usd
      times contracted_endpoints but never less than onboarding_fee_minimum_usd, is invoiced on the order date, and is
      waived (not posted) when the bundle condition holds on the order date. Discounts are fixed at order and re-evaluated
      only at renewal or tier change.
    eligibility: []
    formula:
      total_discount_pct: term_discount_pct + clearpath_bundle_discount_pct
      workstation_rate_usd: round(workstation_rate_list_usd * (1 - total_discount_pct / 100), 2)
      server_rate_usd: round(server_rate_list_usd * (1 - total_discount_pct / 100), 2)
      amount_usd: max(onboarding_fee_per_endpoint_usd * contracted_endpoints, onboarding_fee_minimum_usd)

  - id: security_deployment_and_activation
    subject: [security_deployment_started, security_activated, security_order_cancelled]
    rule: >-
      Deployment begins once the order is signed. Monitoring is activated when at least activation_threshold_pct percent of
      contracted_endpoints report healthy agents; the term starts on the activation date and ends on the day before the same
      day of the month term_months calendar months later. deployment_target_business_days is a planning target, not a
      guarantee. Activation grants the first contract year's ir_hours_included_annual. An order may be cancelled by the
      client only before deployment begins; the onboarding fee is then reversed and no other charge applies.
    eligibility: []

  - id: security_endpoint_counting
    subject: [security_endpoints_enrolled, security_endpoints_retired, security_monthly_fee]
    rule: >-
      Endpoints are enrolled when an agent is installed and retired when it is uninstalled; servers and workstations are
      counted separately, and mobile devices are not endpoints on tiers whose mobile_device_coverage is true. Endpoint changes
      may be posted only while the subscription status is deploying, active, suspended or notice_given. On the
      true_up_snapshot_day of each month the enrolled workstations and servers are counted; the monthly fee for the next
      service month is invoiced in advance on its first day and equals workstation_rate_usd times the counted workstations
      plus server_rate_usd times the counted servers, where the combined billed endpoints are never fewer than
      contracted_endpoints times min_endpoint_commitment_pct divided by 100 rounded up (any shortfall billed at the
      workstation rate), rounded half up to the cent. There is no mid-month proration of additions and no credit for
      retirements. The first monthly fee is the service month after activation; no fee is invoiced for a service month that
      begins after the cancellation effective date.
    eligibility:
      - id: endpoint_change_status
        applies_to: [security_endpoints_enrolled, security_endpoints_retired]
        kind: state
        condition: Endpoint changes may be posted only while the subscription status is deploying, active, suspended or notice_given.
        evidence_fields: [security_subscriptions.security_subscription_id, security_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_subscriptions.security_subscription_id]]
          action_bindings: {security_subscriptions.security_subscription_id: security_subscription_id}
        state_contract:
          field: security_subscriptions.status
          allowed: [deploying, active, suspended, notice_given]

  - id: security_incident_handling
    subject: [security_incident_detected, security_incident_acknowledged, security_incident_closed]
    rule: >-
      The SOC assigns severity at detection: critical for active ransomware, confirmed data exfiltration or domain-admin
      compromise; high for a confirmed compromised host or account; medium for suspicious activity needing client
      confirmation; low for policy violations and informational findings. Acknowledgement targets are
      ack_target_minutes_critical, ack_target_minutes_high, ack_target_minutes_medium and ack_target_minutes_low on a
      24x7 clock; a value of 0 means the tier has no human
      triage (soc_monitoring_24x7 is false) and alerts are delivered to the client by email only.
      containment_target_minutes_critical is an objective, not a guarantee. The SOC isolates a host without first reaching
      the client only where host_isolation_preauthorized is true and disables an account only where
      account_disable_preauthorized is true; otherwise it calls the authorized contact first. threat_hunting, identity_threat_detection,
      email_security_included, dark_web_monitoring, vulnerability_scanning, phishing_simulations_per_year,
      security_reviews_per_year, the named_security_analyst, log_retention_days, the cyber_insurance_attestation letter and
      the ransomware_warranty_usd pass-through are entitlements of the tier and never billed per incident. Incident response
      engagement is requested by the authorized contact or declared by the SOC on a critical incident, with responders
      engaged within ir_engagement_target_minutes as a target; on closure the IR time is rounded up to
      ir_billing_increment_minutes and is never less than ir_minimum_hours_per_incident.
    eligibility: []

  - id: security_ir_hours_ledger
    subject: [security_ir_hours_granted, security_ir_hours_consumed, security_ir_hours_forfeited, security_ir_overage_charge, security_closed]
    rule: >-
      At activation and on each anniversary of term_start_date the subscription is granted ir_hours_included_annual hours for
      the new contract year. Hours logged on an engaged incident are drawn from the current contract year's balance
      (security_msr_ir_balance_year) up to what remains; hours beyond the balance are invoiced as an overage at
      ir_hourly_rate_usd per hour, rounded half up to the cent. At a contract year's end unused hours up to ir_rollover_pct
      percent of ir_hours_included_annual are granted into the next year as a rollover, and the rest are forfeited; rolled-
      over hours never roll a second time. At closing all remaining hours are forfeited and never refunded.
    eligibility: []
    measures: [security_msr_ir_balance_year]
    formula:
      overage_hours: max(ir_hours_logged - security_msr_ir_balance_year, 0)
      amount_usd: round(overage_hours * ir_hourly_rate_usd, 2)

  - id: security_service_credit_rules
    subject: [security_service_credit]
    rule: >-
      An acknowledgement guarantee is breached when the minutes between detection and acknowledgement exceed the target for
      the severity at acknowledgement. A breach earns a credit only where service_credit_eligible is true, the severity is in
      service_credit_severities, and the client claims it. A credit must be claimed no later than
      service_credit_claim_window_days calendar days after the incident is acknowledged. The window is counted in calendar
      days from the acknowledgement date, that date being day 0, and a claim on the last day is timely. An incident earns at
      most one credit. Each credit equals service_credit_pct_per_breach percent of the monthly fee of the month of detection
      (security_msr_service_month_fee), and credits for one month never exceed service_credit_cap_pct_monthly percent of that
      fee (security_msr_credits_month), excess being reduced to the remaining headroom. Credits apply to the next monthly
      invoice and are never paid in cash.
    eligibility:
      - id: credit_claim_window
        applies_to: [security_service_credit]
        kind: time
        condition: A credit must be claimed no later than service_credit_claim_window_days calendar days after the incident is acknowledged.
        evidence_fields: [security_incidents.incident_number, security_incidents.event_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_incidents.incident_number]]
          action_bindings: {security_incidents.incident_number: incident_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the incident is acknowledged
          anchor_source: security_incidents.event_at
          relation: not_after
          duration_source: variants.service_credit_claim_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days from the acknowledgement date, that date being day 0, and a claim on the last day is timely.
          boundary: inclusive
      - id: one_credit_per_incident
        applies_to: [security_service_credit]
        kind: dedup
        condition: An incident earns at most one credit.
        evidence_fields: [security_billing.incident_number, security_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_billing.incident_number]]
          action_bindings: {security_billing.incident_number: incident_number}
        dedup_contract:
          table: security_billing
          mode: separate_record
          object_bindings: {incident_number: incident_number}
          duplicate_filters: {event_type: [security_service_credit]}
          distinct_fields: []
    measures: [security_msr_service_month_fee, security_msr_credits_month]
    params:
      per_tier:
        Sentinel EDR Essentials: {credit_pct: =service_credit_pct_per_breach, cap_pct: =service_credit_cap_pct_monthly}
        Sentinel MDR Standard: {credit_pct: =service_credit_pct_per_breach, cap_pct: =service_credit_cap_pct_monthly}
        Sentinel MDR Advanced: {credit_pct: =service_credit_pct_per_breach, cap_pct: =service_credit_cap_pct_monthly}
        Sentinel MDR Complete: {credit_pct: =service_credit_pct_per_breach, cap_pct: =service_credit_cap_pct_monthly}
        Sentinel XDR Premier: {credit_pct: =service_credit_pct_per_breach, cap_pct: =service_credit_cap_pct_monthly}
        Sentinel XDR Enterprise: {credit_pct: =service_credit_pct_per_breach, cap_pct: =service_credit_cap_pct_monthly}
    formula:
      credit_raw: round(security_msr_service_month_fee * service_credit_pct_per_breach / 100, 2)
      headroom: security_msr_service_month_fee * service_credit_cap_pct_monthly / 100 - security_msr_credits_month
      amount_usd: max(min(credit_raw, round(headroom, 2)), 0)

  - id: security_billing_and_collections
    subject: [security_payment, security_late_fee, security_suspended, security_reinstated]
    rule: >-
      Invoices fall due invoice_due_days calendar days after posting. A payment is applied to the invoice its remittance
      names, otherwise to the oldest open invoice first, one entry per invoice applied; a remittance reference is applied to
      a given invoice only once. On the first day of each calendar month every invoice still unpaid more than
      late_fee_grace_days calendar days after its due date is assessed one late fee of late_fee_pct_monthly percent of its
      unpaid balance, rounded half up to the cent. SOC monitoring may be suspended once the oldest unpaid invoice is
      suspension_days_past_due days past due; endpoint agents keep enforcing local protection during suspension and the
      monthly fee continues. Monitoring is reinstated once every past-due invoice is paid in full, without a reinstatement
      fee. A subscription suspended for termination_for_nonpayment_days days may be terminated for non-payment and closes.
    eligibility:
      - id: one_application
        applies_to: [security_payment]
        kind: dedup
        condition: a remittance reference is applied to a given invoice only once.
        evidence_fields: [security_billing.payment_reference, security_billing.invoice_number, security_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_billing.payment_reference, security_billing.invoice_number]]
          action_bindings: {security_billing.payment_reference: payment_reference, security_billing.invoice_number: invoice_number}
        dedup_contract:
          table: security_billing
          mode: separate_record
          object_bindings: {payment_reference: payment_reference, invoice_number: invoice_number}
          duplicate_filters: {event_type: [security_payment]}
          distinct_fields: []

  - id: security_renewal_and_termination
    subject: [security_renewed, security_notice_given, security_notice_withdrawn, security_early_termination_fee, security_closed]
    rule: >-
      A subscription renews automatically at term end for renewal_term_months unless a signed non-renewal notice was received
      no later than notice_days calendar days before term_end_date; a late notice takes effect at the end of the following
      renewal term. The renewal rates are the expiring rates increased by renewal_uplift_cap_pct percent, rounded half up to
      the cent, unless the tier's current list rates less the applicable discounts are lower, in which case those apply; the
      renewal endpoint commitment equals endpoint_count on term_end_date but never less than min_endpoints. An early
      termination notice sets cancellation_effective_date to the later of the requested date and the notice date plus
      notice_days; the early termination fee is early_termination_fee_pct percent of the monthly fees on the minimum
      commitment for the service months beginning after the effective date through term_end_date. A notice may be withdrawn
      before its effective date, and the early termination fee is then reversed. A renewal may be recorded only while the
      subscription status is active or suspended.
    eligibility:
      - id: renewal_status
        applies_to: [security_renewed]
        kind: state
        condition: A renewal may be recorded only while the subscription status is active or suspended.
        evidence_fields: [security_subscriptions.security_subscription_id, security_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_subscriptions.security_subscription_id]]
          action_bindings: {security_subscriptions.security_subscription_id: security_subscription_id}
        state_contract:
          field: security_subscriptions.status
          allowed: [active, suspended]

  - id: security_tier_change_and_compliance
    subject: [security_tier_changed, security_subscription_ordered]
    rule: >-
      Upgrades take effect on the first day of the next calendar month after the client's signature and re-price both rates
      at the new tier's list rates less the discounts that apply on that date; downgrades take effect only at renewal. A
      client whose compliance_framework is not none receives compliance evidence reports only on a tier whose
      compliance_reporting_frameworks lists that framework; a client asking for evidence reports for its framework on a tier
      that does not list it must upgrade to the lowest tier that does. A tier change may take effect only while the
      subscription status is active. Notices, withdrawals, tier changes and order cancellations are registered as change
      requests pending the authorized contact's signature and take effect only once signed.
    eligibility:
      - id: tier_change_active
        applies_to: [security_tier_changed]
        kind: state
        condition: A tier change may take effect only while the subscription status is active.
        evidence_fields: [security_subscriptions.security_subscription_id, security_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_subscriptions.security_subscription_id]]
          action_bindings: {security_subscriptions.security_subscription_id: security_subscription_id}
        state_contract:
          field: security_subscriptions.status
          allowed: [active]
