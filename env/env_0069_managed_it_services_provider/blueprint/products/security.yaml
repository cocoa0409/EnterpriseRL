# Policy charter: Sentinel Managed Security (per-endpoint EDR / MDR / XDR subscriptions).
category: security
display_name: Sentinel Managed Security

binding:
  holding_table: security_subscriptions
  event_tables: [security_endpoint_changes, security_billing, security_incidents, security_ir_ledger]
  intake_tables: [security_change_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {endpoint_count: endpoints, ir_hours_balance: ir_hours, balance_due_usd: receivable}

lifecycle:
  states: [ordered, deploying, active, suspended, notice_given, closed, cancelled]
  transitions:
    - {from: ordered, to: deploying, by: agent, means: "Agent deployment to the client's endpoints begins."}
    - {from: deploying, to: active, by: agent, means: "Deployment reaches the activation threshold and monitoring goes live; the term starts."}
    - {from: ordered, to: cancelled, by: user, means: "The client cancels the order before deployment begins."}
    - {from: active, to: suspended, by: system, means: "SOC monitoring is suspended for non-payment; the agents keep enforcing local protection."}
    - {from: suspended, to: active, by: agent, means: "Monitoring is reinstated after the past-due balance is cleared."}
    - {from: active, to: notice_given, by: user, means: "The client gives signed notice of non-renewal or early termination."}
    - {from: notice_given, to: active, by: user, means: "The client withdraws its notice before the effective date."}
    - {from: notice_given, to: closed, by: system, means: "The cancellation effective date is reached; agents are uninstalled and the subscription closes."}
    - {from: suspended, to: closed, by: agent, means: "The subscription is terminated for non-payment."}

accounts:
  - key: endpoints
    unit: endpoints
    meaning: Number of workstations and servers enrolled with the Sentinel agent under the subscription.
  - key: ir_hours
    unit: hours
    meaning: Incident response retainer hours available in the current contract year.
  - key: receivable
    unit: USD
    meaning: Amount the client owes on the subscription; charges increase it and payments and service credits reduce it.


# ---- category-level parameter dictionary ----
parameter_schema:
  workstation_rate_list_usd: List monthly fee per enrolled workstation before discounts (USD)
  server_rate_list_usd: List monthly fee per enrolled server before discounts (USD)
  min_endpoints: Minimum endpoints that may be ordered (integer endpoints)
  min_endpoint_commitment_pct: Minimum billed endpoints as a percent of contracted_endpoints, rounded up to a whole endpoint (percent)
  allowed_terms_months: Term lengths the tier may be ordered or renewed for (list of months)
  term_discount_pct: Discount off list rates by term length (mapping months -> percent)
  clearpath_bundle_discount_pct: Additional discount off list rates when the client holds an active ClearPath agreement at or above clearpath_bundle_min_rank (percent)
  clearpath_bundle_min_rank: Lowest ClearPath tier rank that qualifies for the bundle discount and the onboarding fee waiver (rank 1-6)
  onboarding_fee_per_endpoint_usd: One-time onboarding fee per contracted endpoint (USD)
  onboarding_fee_minimum_usd: Minimum one-time onboarding fee (USD)
  deployment_target_business_days: Target business days from deployment start to activation (integer business days)
  activation_threshold_pct: Share of contracted_endpoints that must report healthy agents before monitoring is activated (percent)
  soc_monitoring_24x7: Whether alerts are triaged by the 24x7 security operations center (switch)
  threat_hunting: Whether proactive analyst-led threat hunting is included (switch)
  identity_threat_detection: Whether Microsoft 365 / Entra ID identity threat detection is included (switch)
  email_security_included: Whether inbound email security and phishing remediation is included (switch)
  mobile_device_coverage: Whether managed mobile devices are covered at no endpoint charge (switch)
  log_retention_days: Days security telemetry is retained and searchable (integer days)
  vulnerability_scanning: Internal vulnerability scanning cadence (enum none / quarterly / monthly / weekly / continuous)
  phishing_simulations_per_year: Phishing simulation campaigns included per contract year (integer)
  dark_web_monitoring: Whether credential exposure monitoring for the client's domains is included (switch)
  security_reviews_per_year: Security posture reviews with an analyst per contract year (integer)
  named_security_analyst: Whether a named lead analyst is assigned (switch)
  compliance_reporting_frameworks: Frameworks for which compliance evidence reports are produced (list of customers.compliance_framework values)
  cyber_insurance_attestation: Whether an annual controls attestation letter for cyber insurance renewals is provided (switch)
  ransomware_warranty_usd: Maximum reimbursement under the EDR vendor's ransomware warranty passed through to the client (USD per incident)
  host_isolation_preauthorized: Whether the SOC may isolate a compromised host without first reaching the client (switch)
  account_disable_preauthorized: Whether the SOC may disable a compromised user account without first reaching the client (switch)
  ack_target_minutes_critical: Guaranteed time from detection to analyst acknowledgement for a critical incident; 0 means no guarantee (integer minutes, 24x7)
  ack_target_minutes_high: Guaranteed acknowledgement time for a high incident; 0 means no guarantee (integer minutes)
  ack_target_minutes_medium: Guaranteed acknowledgement time for a medium incident; 0 means no guarantee (integer minutes)
  ack_target_minutes_low: Guaranteed acknowledgement time for a low incident; 0 means no guarantee (integer minutes)
  containment_target_minutes_critical: Target (not guaranteed) time from acknowledgement to containment of a critical incident (integer minutes)
  service_credit_eligible: Whether missed acknowledgement guarantees earn service credits (switch)
  service_credit_severities: Severities whose missed acknowledgement guarantee earns a credit (list)
  service_credit_pct_per_breach: Credit per breached incident as a percent of the monthly fee of the month the incident was detected (percent)
  service_credit_cap_pct_monthly: Maximum credits per service month as a percent of that month's monthly fee (percent)
  service_credit_claim_window_days: Calendar days after acknowledgement within which the credit must be claimed (integer days)
  ir_hours_included_annual: Incident response retainer hours granted at the start of each contract year (hours)
  ir_hourly_rate_usd: Rate for incident response hours beyond the available balance (USD per hour)
  ir_billing_increment_minutes: Increment incident response time is rounded up to (integer minutes)
  ir_minimum_hours_per_incident: Minimum incident response hours logged per engaged incident (hours)
  ir_engagement_target_minutes: Target time from the client's request to incident responder engagement (integer minutes)
  ir_rollover_pct: Share of the annual IR grant that may roll into the next contract year if unused (percent of ir_hours_included_annual)
  true_up_snapshot_day: Day of month enrolled endpoints are counted for the next month's fee (day of month)
  notice_days: Calendar days of signed notice required before term end for non-renewal, and minimum notice for early termination (integer days)
  renewal_term_months: Length of each automatic renewal term (months)
  renewal_uplift_cap_pct: Maximum rate increase at renewal (percent)
  early_termination_fee_pct: Early termination fee as a percent of committed monthly fees remaining after the effective date (percent)
  invoice_due_days: Net payment terms from the invoice posted date (integer days)
  late_fee_pct_monthly: Monthly late fee on an invoice's unpaid balance past the grace period (percent)
  late_fee_grace_days: Calendar days after the due date before a late fee is assessed (integer days)
  suspension_days_past_due: Days past due of the oldest unpaid invoice at which SOC monitoring is suspended (integer days)
  termination_for_nonpayment_days: Days in suspension after which the subscription may be terminated (integer days)

