# Policy charter: Hardware Procurement (quoted, approved and fulfilled hardware orders; one order per quote).
category: hardware
display_name: Hardware Procurement

binding:
  holding_table: hardware_orders
  event_tables: [hardware_billing, hardware_returns]
  intake_tables: [hardware_client_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due_usd: receivable}

lifecycle:
  states: [quoted, approved, ordered, shipped, delivered, closed, quote_expired, cancelled]
  transitions:
    - {from: quoted, to: approved, by: user, means: "The authorized contact signs the quote."}
    - {from: quoted, to: quote_expired, by: system, means: "The quote lapses unsigned at the end of its validity period."}
    - {from: approved, to: ordered, by: agent, means: "The purchase order is placed with the distributor once any deposit is paid."}
    - {from: approved, to: cancelled, by: user, means: "The client cancels the approved order before the purchase order is placed."}
    - {from: ordered, to: cancelled, by: user, means: "The client cancels after the purchase order is placed and before shipment."}
    - {from: ordered, to: shipped, by: system, means: "The distributor (or the staging bench) ships the order."}
    - {from: shipped, to: delivered, by: system, means: "The carrier confirms delivery to the client's site."}
    - {from: delivered, to: closed, by: system, means: "The return window has passed and the order is paid in full."}

accounts:
  - key: receivable
    unit: USD
    meaning: Amount the client owes on the order; invoices and fees increase it and payments and credits reduce it.


# ---- category-level parameter dictionary ----
parameter_schema:
  markup_pct: Markup on distributor unit cost (percent)
  clearpath_markup_reduction_pts: Percentage points taken off markup_pct when the client holds an active ClearPath agreement at or above clearpath_min_rank on the quote date (points)
  clearpath_min_rank: Lowest ClearPath tier rank that earns the markup reduction (rank 1-6)
  min_order_value_usd: Smallest quote total accepted for the order type (USD)
  quote_validity_days: Calendar days after the quote date within which the quote may be signed at its price (integer days)
  deposit_pct: Deposit invoiced on approval as a percent of the quote total when a deposit is required (percent)
  deposit_threshold_usd: Quote total at or above which a deposit is required (USD; 0 means always when deposit_pct is above 0)
  staging_fee_per_unit_usd: Staging fee per unit for imaging, enrollment, configuration or burn-in before shipment (USD per unit)
  handling_fee_usd: Handling fee per order covering receiving and shipping coordination (USD per order)
  rush_fee_usd: Fee for rush processing ahead of the queue (USD per order)
  rush_available: Whether rush processing can be quoted (switch)
  delivery_target_business_days: Target business days from purchase order to delivery for in-stock items (integer business days)
  asset_tagging_included: Whether units are asset-tagged and recorded in the client's inventory before delivery (switch)
  serial_capture_included: Whether serial numbers are recorded against the client's asset register (switch)
  autopilot_registration_included: Whether devices are registered for Windows Autopilot (switch)
  firmware_update_included: Whether firmware is updated to the current supported release before shipment (switch)
  burn_in_test_hours: Hours of burn-in testing before shipment (hours)
  warranty_registration_included: Whether the manufacturer warranty is registered in the client's name (switch)
  installation_included: Whether onsite installation is part of the order (switch; installation is otherwise work under ClearPath, TimeBank or a project)
  price_protection_after_approval: Whether the signed quote price is honoured even if distributor cost rises before the purchase order (switch)
  cancel_before_po_free: Whether an approved order may be cancelled free of charge before the purchase order is placed (switch)
  cancellation_after_po_fee_pct: Fee for cancelling after the purchase order and before shipment, as a percent of the quote total (percent)
  cancellable_after_po: Whether the order may be cancelled at all after the purchase order is placed (switch)
  return_window_days: Calendar days after delivery within which unwanted units may be returned (integer days)
  unopened_restocking_fee_pct: Restocking fee on unopened returned units, as a percent of their unit price (percent)
  opened_returns_accepted: Whether opened but resaleable units may be returned as unwanted (switch)
  opened_restocking_fee_pct: Restocking fee on opened resaleable returns where accepted, as a percent of unit price (percent)
  staging_fee_refundable: Whether the staging fee of returned units is credited (switch)
  handling_fee_refundable: Whether the handling fee is credited on a return (switch)
  non_returnable: Whether the order is non-cancellable and non-returnable except dead on arrival (switch)
  doa_window_days: Calendar days after delivery within which a unit failing out of the box is handled as dead on arrival (integer days)
  doa_remedy: Remedy for a confirmed dead-on-arrival unit (enum replace_or_credit / replace_only)
  doa_restocking_waived: Whether no restocking fee applies to confirmed dead-on-arrival units (switch)
  warranty_claim_route: Where a failure after the dead-on-arrival window is handled (enum manufacturer_warranty)
  damaged_returns_accepted: Whether units received back damaged are credited (switch)
  invoice_due_days: Net payment terms from the invoice posted date (integer days)
  deposit_due: When the deposit invoice falls due (enum on_receipt)
  late_fee_pct_monthly: Monthly late fee on an invoice's unpaid balance past the grace period (percent)
  late_fee_grace_days: Calendar days after the due date before a late fee is assessed (integer days)
  late_fee_minimum_usd: Minimum late fee per invoice per month (USD)
  card_payment_max_usd: Largest invoice that may be paid by card (USD)
  max_units_per_order: Most units one order may carry (integer units)
  partial_shipment_allowed: Whether the order may ship in partial lots (switch; the final invoice is still raised on full delivery)
  shipping_method: Standard shipping method (enum ground / ground_signature / freight)
  signature_on_delivery: Whether delivery requires a signature at the client site (switch)
  quote_revision_resets_validity: Whether a revised quote starts a new validity period (switch)
  eol_check_included: Whether the model is checked against the manufacturer's end-of-life schedule before quoting (switch)
  configuration_sheet_required: Whether a signed configuration sheet is needed before staging starts (switch)

