events:
  - type: hardware_quote_issued
    target: hardware_orders
    mutation: create
    meaning: A quote for one product line is issued to the client.
    grain: One order record per quote.
    fields: {customer_id: Client organisation., variant_name: Order type., quote_number: Quote number., item_description: Product description., manufacturer_part_number: Part number., quantity: Units., unit_cost_usd: Distributor cost., unit_price_usd: Sell price after markup., quote_total_usd: Quoted total., rush_requested: Whether rush was quoted., quote_date: Quote date.}
    triggers: []
  - type: hardware_quote_approved
    target: hardware_orders
    mutation: {transition: {from: quoted, to: approved}}
    meaning: The authorized contact signs the quote.
    grain: One transaction per order.
    fields: {approved_date: Signature date., deposit_required: Whether a deposit applies under the deposit and credit-exposure rules on the approval date.}
    triggers:
      - event: hardware:hardware_deposit_invoice
        when: {deposit_required: true}
        map: {}
  - type: hardware_quote_expired
    target: hardware_orders
    mutation: {transition: {from: quoted, to: quote_expired}}
    meaning: The quote lapses unsigned.
    grain: One transaction per order.
    fields: {closed_date: Day after the validity period ended.}
    triggers: []
  - type: hardware_order_placed
    target: hardware_orders
    mutation: {transition: {from: approved, to: ordered}}
    meaning: The purchase order is placed with the distributor.
    grain: One transaction per order.
    fields: {distributor_po_number: Distributor PO., order_placed_date: PO date.}
    triggers: []
  - type: hardware_order_cancelled
    target: hardware_orders
    mutation: {transition: [{from: approved, to: cancelled}, {from: ordered, to: cancelled}]}
    meaning: The client's signed cancellation takes effect.
    grain: One transaction per order.
    fields: {cancellation_stage: before_po or after_po., cancelled_date: Cancellation date., closed_date: Equal to cancelled_date.}
    triggers:
      - event: hardware:hardware_cancellation_fee
        when: {cancellation_stage: after_po}
        map: {}
  - type: hardware_shipped
    target: hardware_orders
    mutation: {transition: {from: ordered, to: shipped}}
    meaning: The order ships.
    grain: One transaction per order.
    fields: {ship_date: Ship date., carrier_tracking: Tracking number.}
    triggers: []
  - type: hardware_delivered
    target: hardware_orders
    mutation: {transition: {from: shipped, to: delivered}}
    meaning: The carrier confirms delivery.
    grain: One transaction per order.
    fields: {delivered_date: Delivery date.}
    triggers:
      - event: hardware:hardware_final_invoice
        map: {}
  - type: hardware_closed
    target: hardware_orders
    mutation: {transition: {from: delivered, to: closed}}
    meaning: The order closes after its return window with nothing owed.
    grain: One transaction per order.
    fields: {closed_date: Closing date.}
    triggers: []
  - type: hardware_deposit_invoice
    target: hardware_billing
    meaning: The deposit is invoiced on approval.
    grain: One row per order.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Deposit., invoice_number: Invoice., posted_date: Approval date., billing_period: Month of approval.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_final_invoice
    target: hardware_billing
    meaning: The quote total less any deposit is invoiced on delivery.
    grain: One row per order.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Amount., invoice_number: Invoice., posted_date: Delivery date., billing_period: Month of delivery.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_cancellation_fee
    target: hardware_billing
    meaning: The fee for cancelling after the purchase order is invoiced.
    grain: One row per order.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee., invoice_number: Invoice., posted_date: Cancellation date., billing_period: Month of cancellation.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_restocking_fee
    target: hardware_billing
    meaning: The restocking fee on returned unwanted units is charged.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., amount_usd: Fee., invoice_number: Invoice of the order., posted_date: Receipt date., billing_period: Month received.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_return_credit
    target: hardware_billing
    meaning: Returned units are credited at their unit price.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., amount_usd: Credit., invoice_number: Invoice credited., posted_date: Receipt date., billing_period: Month received.}
    account: receivable
    direction: out
    triggers: []
  - type: hardware_order_credit
    target: hardware_billing
    meaning: A deposit is credited back when an order is cancelled before its purchase order, or offset against a cancellation fee.
    grain: One row per cancelled order.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Credit., invoice_number: Deposit invoice credited., posted_date: Cancellation date., billing_period: Month of cancellation.}
    account: receivable
    direction: out
    triggers: []
  - type: hardware_payment
    target: hardware_billing
    meaning: A payment is applied to an invoice.
    grain: One row per remittance per invoice.
    distinguish_by: [payment_reference, invoice_number]
    fields: {payment_reference: Remittance reference., amount_usd: Amount applied., invoice_number: Invoice paid., posted_date: Date received.}
    account: receivable
    direction: out
    triggers: []
  - type: hardware_late_fee
    target: hardware_billing
    meaning: A late fee is assessed on a past-due invoice.
    grain: One row per invoice per month assessed.
    distinguish_by: [invoice_number, billing_period]
    fields: {invoice_number: Past-due invoice., billing_period: Month assessed., amount_usd: Fee., posted_date: Assessment date.}
    account: receivable
    direction: in
    triggers: []
  - type: hardware_return_authorized
    target: hardware_returns
    meaning: A return authorization is issued for units of the order.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., return_type: unwanted or dead_on_arrival., qty: Units authorised., event_date: Authorization date.}
    triggers: []
  - type: hardware_return_received
    target: hardware_returns
    meaning: Returned units are received and inspected.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., return_type: Return type., qty: Units received., received_condition: Inspected condition., event_date: Receipt date.}
    triggers:
      - event: hardware:hardware_return_credit
        when: {received_condition: [unopened, opened_resaleable]}
        map: {rma_number: rma_number}
      - event: hardware:hardware_restocking_fee
        when: {received_condition: [unopened, opened_resaleable]}
        map: {rma_number: rma_number}
  - type: hardware_doa_replacement_shipped
    target: hardware_returns
    meaning: Replacement units for confirmed dead-on-arrival units are shipped, or credit is chosen instead.
    grain: One row per return authorization.
    distinguish_by: [rma_number]
    fields: {rma_number: Return authorization., qty: Units replaced., event_date: Ship date of the replacement.}
    triggers: []


measures:
  - id: hardware_msr_open_exposure
    window: Point in time, immediately before the approval being decided, across every hardware order of the client.
    measure: Sum of quote_total_usd of the client's orders whose status is approved, ordered or shipped, plus balance_due_usd of its orders whose status is delivered.
  - id: hardware_msr_units_returned
    window: All return milestones of the order up to the decision.
    measure: Sum of qty of hardware_return_received rows of the order, by return_type.

policies:
  - id: hardware_agg_multi_holding
    subject: [hardware_quote_issued]
    rule: >-
      A client may hold any number of hardware orders; each quote covers one product line at one quantity and becomes its
      own order with its own price, deposit, delivery, return window and invoices.
    eligibility: []
    params:
      max_per_customer: null

  - id: hardware_agg_credit_exposure
    subject: [hardware_quote_approved, hardware_deposit_invoice]
    rule: >-
      The client's open hardware exposure (hardware_msr_open_exposure) plus the quote total of the order being approved is
      compared with its credit limit: credit_limit_with_clearpath_usd while the client holds a ClearPath agreement whose
      status is active, and credit_limit_without_clearpath_usd otherwise. When the sum exceeds the limit, the order is
      prepaid: its deposit becomes 100 percent of the quote total, whatever its order type's deposit_pct and
      deposit_threshold_usd say, and the purchase order waits for that payment. Orders within the limit follow the order
      type's normal deposit rule.
    eligibility: []
    measures: [hardware_msr_open_exposure]
    params:
      credit_limit_with_clearpath_usd: 50000.00
      credit_limit_without_clearpath_usd: 10000.00

  - id: hardware_quote_and_pricing
    subject: [hardware_quote_issued, hardware_quote_expired]
    rule: >-
      A quote is issued for one product line in the order type matching the product class. The unit price is unit_cost_usd
      times one plus the effective markup, rounded half up to the cent; the effective markup is markup_pct, reduced by
      clearpath_markup_reduction_pts when on the quote date the client holds a ClearPath agreement whose status is active and
      whose tier rank is at least clearpath_min_rank. The quote total is quantity times unit_price_usd, plus
      staging_fee_per_unit_usd times quantity, plus handling_fee_usd, plus rush_fee_usd when rush is requested where
      rush_available is true; it must reach min_order_value_usd and quantity may not exceed max_units_per_order. A deposit is
      required, as decided on the approval date, when deposit_pct is above 0 and the quote total is at least
      deposit_threshold_usd, or when the credit-exposure rule calls for prepayment. The quote may be signed at
      its price within quote_validity_days calendar days of quote_date; an unsigned quote then lapses, and where quote_revision_resets_validity is true a
      revised quote starts a new validity period. The entitlements asset_tagging_included, serial_capture_included,
      autopilot_registration_included, firmware_update_included, burn_in_test_hours, warranty_registration_included,
      eol_check_included and the configuration_sheet_required step belong to the order type; onsite installation is never
      part of an order (installation_included is false) and is done under ClearPath, TimeBank or a project.
    eligibility: []
    params:
      per_tier:
        Accessory & Peripheral Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Standard Endpoint Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Staged Endpoint Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Network Equipment Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Server & Storage Build Order: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
        Special-Order Equipment: {markup: =markup_pct, reduction: =clearpath_markup_reduction_pts, staging: =staging_fee_per_unit_usd}
    formula:
      unit_price_usd: round(unit_cost_usd * (1 + (markup_pct - clearpath_markup_reduction_pts) / 100), 2)
      quote_total_usd: round(quantity * unit_price_usd + staging_fee_per_unit_usd * quantity + handling_fee_usd + (rush_fee_usd if rush_requested else 0), 2)

  - id: hardware_approval_and_purchase_order
    subject: [hardware_quote_approved, hardware_deposit_invoice, hardware_order_placed]
    rule: >-
      A quote may be approved only by the authorized contact's signature within quote_validity_days calendar days after the
      quote was issued. The validity period is counted in calendar days from quote_date, that date being day 0, and a
      signature on the last day is in time. Where price_protection_after_approval is true the signed price holds even if the
      distributor cost changes before the purchase order. On approval a required deposit of deposit_pct percent of the quote
      total is invoiced, rounded half up to the cent, due on receipt (deposit_due). The purchase order may be placed only after any
      required deposit has been paid in full. Orders that need no deposit are placed on the approval date, and a configuration
      sheet must be signed before staging starts where configuration_sheet_required is true.
    eligibility:
      - id: approve_in_validity
        applies_to: [hardware_quote_approved]
        kind: time
        condition: A quote may be approved only by the authorized contact's signature within quote_validity_days calendar days after the quote was issued.
        evidence_fields: [hardware_orders.hardware_order_id, hardware_orders.quote_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_orders.hardware_order_id]]
          action_bindings: {hardware_orders.hardware_order_id: hardware_order_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the quote was issued
          anchor_source: hardware_orders.quote_date
          relation: not_after
          duration_source: variants.quote_validity_days
          unit: calendar_days
          counting_rule: The validity period is counted in calendar days from quote_date, that date being day 0, and a signature on the last day is in time.
          boundary: inclusive
      - id: deposit_before_po
        applies_to: [hardware_order_placed]
        kind: authorization
        condition: The purchase order may be placed only after any required deposit has been paid in full.
        evidence_fields: [hardware_billing.hardware_order_id, hardware_billing.event_type, hardware_billing.invoice_number, hardware_billing.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_billing.hardware_order_id]]
          action_bindings: {hardware_billing.hardware_order_id: hardware_order_id}
    formula:
      amount_usd: round(deposit_pct / 100 * quote_total_usd, 2)

  - id: hardware_fulfilment_and_invoicing
    subject: [hardware_shipped, hardware_delivered, hardware_final_invoice, hardware_closed]
    rule: >-
      Orders ship by shipping_method, with a signature on delivery where signature_on_delivery is true, and in partial lots
      only where partial_shipment_allowed is true; delivery_target_business_days is a target for in-stock items, not a
      guarantee. On delivery of the whole order the final invoice bills the quote total minus any deposit invoiced, due
      invoice_due_days calendar days later. The order closes on the day after the later of the end of its return window and
      its doa_window_days window, provided nothing is owed on it.
    eligibility: []

  - id: hardware_cancellation
    subject: [hardware_order_cancelled, hardware_cancellation_fee, hardware_order_credit]
    rule: >-
      An approved order may be cancelled free of charge before its purchase order is placed where cancel_before_po_free is
      true, any deposit invoiced being credited in full. After the purchase order is placed and before shipment, an order
      may be cancelled only where cancellable_after_po is true. Such a cancellation is charged cancellation_after_po_fee_pct
      percent of the quote total, rounded half up to the cent, and any deposit paid is applied against that fee by an order
      credit with the excess refunded by the accounting team. Special-Order Equipment is non-cancellable once approved,
      because cancel_before_po_free and cancellable_after_po are both false for it. A shipped order cannot be cancelled; its
      units can only come back under the return rules.
    eligibility:
      - id: cancellable_stage
        applies_to: [hardware_order_cancelled]
        kind: authorization
        condition: After the purchase order is placed and before shipment, an order may be cancelled only where cancellable_after_po is true.
        evidence_fields: [hardware_orders.hardware_order_id, hardware_orders.status, hardware_orders.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_orders.hardware_order_id]]
          action_bindings: {hardware_orders.hardware_order_id: hardware_order_id}
    formula:
      amount_usd: round(cancellation_after_po_fee_pct / 100 * quote_total_usd, 2)

  - id: hardware_returns_and_restocking
    subject: [hardware_return_authorized, hardware_return_received, hardware_return_credit, hardware_restocking_fee]
    rule: >-
      Unwanted units may be returned only within return_window_days calendar days after delivery. The window is counted in
      calendar days from delivered_date, that date being day 0, and a return authorized on the last day is in time. A return
      is authorized only on the authorized contact's signed return request, for no more units than were delivered less those
      already returned (hardware_msr_units_returned). Unwanted units must come back unopened, except where
      opened_returns_accepted is true, in which case opened resaleable units are also accepted. Orders whose non_returnable is
      true accept no unwanted returns at all. On receipt, unopened or accepted opened units are credited at unit_price_usd
      times the units received, and a restocking fee of unopened_restocking_fee_pct or opened_restocking_fee_pct percent of
      that amount is charged, each rounded half up to the cent; staging and handling fees are never credited because
      staging_fee_refundable and handling_fee_refundable are false. Units received damaged, or opened where that is not
      accepted, are not credited (damaged_returns_accepted is false) and are shipped back at the client's request. A return
      authorization is credited at most once.
    eligibility:
      - id: return_window
        applies_to: [hardware_return_authorized]
        kind: time
        condition: Unwanted units may be returned only within return_window_days calendar days after delivery.
        evidence_fields: [hardware_orders.hardware_order_id, hardware_orders.delivered_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_orders.hardware_order_id]]
          action_bindings: {hardware_orders.hardware_order_id: hardware_order_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: delivery
          anchor_source: hardware_orders.delivered_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days from delivered_date, that date being day 0, and a return authorized on the last day is in time.
          boundary: inclusive
      - id: credit_once
        applies_to: [hardware_return_credit]
        kind: dedup
        condition: A return authorization is credited at most once.
        evidence_fields: [hardware_billing.rma_number, hardware_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_billing.rma_number]]
          action_bindings: {hardware_billing.rma_number: rma_number}
        dedup_contract:
          table: hardware_billing
          mode: separate_record
          object_bindings: {rma_number: rma_number}
          duplicate_filters: {event_type: [hardware_return_credit]}
          distinct_fields: []
    measures: [hardware_msr_units_returned]
    formula:
      credit_amount: round(unit_price_usd * qty, 2)
      restocking_amount: round(credit_amount * unopened_restocking_fee_pct / 100, 2)

  - id: hardware_dead_on_arrival
    subject: [hardware_return_authorized, hardware_return_received, hardware_doa_replacement_shipped, hardware_return_credit]
    rule: >-
      A unit that fails out of the box is handled as dead on arrival only when it is reported within doa_window_days
      calendar days after delivery. The period is counted in calendar days from delivered_date, that date being day 0. A
      dead-on-arrival return is authorized for the failed units on the authorized contact's signed return request, even on
      non-returnable orders, and no restocking fee applies where doa_restocking_waived is true. When inspection confirms the
      failure (doa_confirmed) the units are replaced, or credited at unit_price_usd where doa_remedy is replace_or_credit and
      the client chooses credit; when inspection does not confirm it (doa_not_confirmed) the units are shipped back with no
      credit. A failure reported after the dead-on-arrival window goes to the manufacturer warranty (warranty_claim_route)
      and Stratton Bay neither replaces nor credits it.
    eligibility:
      - id: doa_window
        applies_to: [hardware_doa_replacement_shipped]
        kind: time
        condition: A unit that fails out of the box is handled as dead on arrival only when it is reported within doa_window_days calendar days after delivery.
        evidence_fields: [hardware_orders.hardware_order_id, hardware_orders.delivered_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hardware_orders.hardware_order_id]]
          action_bindings: {hardware_orders.hardware_order_id: hardware_order_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: delivery
          anchor_source: hardware_orders.delivered_date
          relation: not_after
          duration_source: variants.doa_window_days
          unit: calendar_days
          counting_rule: The period is counted in calendar days from delivered_date, that date being day 0.
          boundary: inclusive

  - id: hardware_billing_and_collections
    subject: [hardware_payment, hardware_late_fee]
    rule: >-
      Deposits are due on receipt and other invoices invoice_due_days calendar days after posting. A payment is applied to
      the invoice its remittance names, otherwise to the oldest open invoice of the order first, one entry per invoice
      applied; card payments are accepted only for an invoice whose total does not exceed card_payment_max_usd. On the first
      day of each calendar month every invoice still unpaid more than late_fee_grace_days calendar days after its due date is
      assessed one late fee of late_fee_pct_monthly percent of its unpaid balance, or late_fee_minimum_usd if greater,
      rounded half up to the cent.
    eligibility: []

  - id: hardware_client_signed_requests
    subject: [hardware_quote_approved, hardware_order_cancelled, hardware_return_authorized]
    rule: >-
      Quote approvals, cancellations and return requests commit the client's money or dispose of its property and take
      effect only on the authorized contact's e-signature: the service desk registers each as a client request pending
      signature and never approves, cancels or returns on the client's behalf. A request may be registered only for the
      client's authorized contact after identity verification has passed.
    eligibility:
      - id: verified_contact
        applies_to: [hardware_quote_approved, hardware_order_cancelled, hardware_return_authorized]
        kind: authorization
        condition: A request may be registered only for the client's authorized contact after identity verification has passed.
        evidence_fields: [identity_verifications.customer_id, identity_verifications.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[identity_verifications.customer_id]]
          action_bindings: {identity_verifications.customer_id: customer_id}


extended_policies:
  - id: hardware_ext_endpoint_cancellation_fee
    base_policy_refs: [hardware_cancellation, hardware_client_signed_requests]
    overwrite:
      - base_policy: hardware_cancellation
        superseded_clause: >-
          Such a cancellation is charged cancellation_after_po_fee_pct percent of the quote total, rounded half up to
          the cent, and any deposit paid is applied against that fee by an order credit with the excess refunded by the
          accounting team.
        replaced_by: >-
          For a Standard Endpoint Order cancelled after its purchase order, and only for such an order, the
          cancellation fee is figured as this paragraph states instead of a flat cancellation_after_po_fee_pct percent
          of the quote total; any deposit paid on it still being applied against that fee by an order credit with the excess refunded by the accounting team; a Network Equipment Order or Server & Storage Build Order is settled under the infrastructure cancellation and deposit-credit schedules, and every other order type's cancellation after its purchase order stays charged cancellation_after_po_fee_pct percent of the quote total, rounded half up to the cent, with any deposit paid applied against that fee by an order credit and the excess refunded by the accounting team.
    trigger: on_request
    subject: [hardware_order_cancelled, hardware_cancellation_fee]
    computes: fee_usd
    target_tool: sign_order_cancellation_55862425
    params:
      unallocated_within_days: 1
      allocated_after_days: 7
      admin_per_unit_usd: 20.0
      freight_per_unit_usd: 12.0
      rate_premier_pct: 6.0
      rate_core_pct: 8.0
      admin_two_usd: 50.0
      admin_one_usd: 25.0
    rule: >-
      This policy settles the fee charged when the authorized contact's e-signed cancellation of a Standard Endpoint
      Order takes effect after the order's purchase order was placed and before it shipped; the signature records the
      cancellation and its fee together. For a Standard Endpoint Order cancelled after its purchase order, and only for
      such an order, the cancellation fee is figured as this paragraph states instead of a flat
      cancellation_after_po_fee_pct percent of the quote total; any deposit paid on it still being applied against that
      fee by an order credit with the excess refunded by the accounting team; a Network Equipment Order or Server &
      Storage Build Order is settled under the infrastructure cancellation and deposit-credit schedules, and every other
      order type's cancellation after its purchase order stays charged cancellation_after_po_fee_pct percent of the quote
      total, rounded half up to the cent, with any deposit paid applied against that fee by an order credit and the excess
      refunded by the accounting team.
      The standard endpoint cancellation fee is cancellation_after_po_fee_pct percent of the order's quote total. The
      endpoint cancellation fee is rounded half up to the cent once, on the final amount.
      The adjustments below replace parts of that standard fee and are applied in one fixed order: the percentage and the
      way the fee is built are settled first, and any fixed charge is then added to the built fee.
      The build of the endpoint cancellation fee follows the age of the purchase order, counted in calendar days from the
      order's purchase order date to the day the cancellation is recorded. A purchase order at most
      unallocated_within_days day old has no units allocated yet, and the endpoint cancellation fee is built as
      admin_per_unit_usd for each unit ordered with no percentage of the quote total; a purchase order at least
      allocated_after_days days old has its units allocated or in transit, and the endpoint cancellation fee is built as
      the fee percentage of the quote total plus a return freight of freight_per_unit_usd for each unit ordered; a
      purchase order of any other age builds the endpoint cancellation fee as the fee percentage of the quote total alone.
      The fee percentage of an endpoint cancellation is rate_premier_pct percent when the client holds a ClearPath
      agreement whose status is active on the ClearPath Premier or ClearPath Enterprise tier, rate_core_pct percent when
      that active agreement is on the ClearPath Standard or ClearPath Professional tier, and
      cancellation_after_po_fee_pct percent for every other client, including one whose ClearPath agreement is closed or
      cancelled and one on the ClearPath Monitor or ClearPath Essentials tier.
      The rush processing an order is worked under starts on the day its quote is approved, and what it has cost is
      kept in the endpoint cancellation fee: the order type's rush_fee_usd when the order was quoted with rush and its
      quote was approved at least one calendar day before the day the cancellation is recorded, half of it when such a
      quote was approved on that same day, and nothing for an order quoted without rush.
      An administration charge is added to the endpoint cancellation fee by the ClearPath late fees posted on the client's
      ClearPath billing fewer than twelve whole months before the day the cancellation is recorded: admin_two_usd for two
      or more such late fees, admin_one_usd for exactly one, and nothing when there is none; late fees on any other
      Stratton Bay account do not count.
    compute:
      - b_po_age_days: "DAYS(F('order_placed_date'), NOW)"
      - f_fee_build: "2 if b_po_age_days >= K('allocated_after_days') else (1 if b_po_age_days <= K('unallocated_within_days') else 0)"
      - b_cp_tier: "CFIELD('managed', 'variant_name', status='active')"
      - f_fee_pct: "K('rate_premier_pct') if (b_cp_tier == 'ClearPath Premier' or b_cp_tier == 'ClearPath Enterprise') else (K('rate_core_pct') if (b_cp_tier == 'ClearPath Standard' or b_cp_tier == 'ClearPath Professional') else P('cancellation_after_po_fee_pct'))"
      - b_exp_approval_age: "DAYS(F('approved_date'), NOW)"
      - f_expedite: "P('rush_fee_usd') if (F('rush_requested') and b_exp_approval_age >= 1) else (P('rush_fee_usd') / 2 if F('rush_requested') else 0)"
      - b_cp_late_fees: "XCOUNT('managed', 'managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')"
      - f_admin_charge: "K('admin_two_usd') if b_cp_late_fees >= 2 else (K('admin_one_usd') if b_cp_late_fees == 1 else 0)"
      - b_units: "F('quantity')"
      - b_quote_total: "F('quote_total_usd')"
      - result: "RND((K('admin_per_unit_usd') * b_units if f_fee_build == 1 else (f_fee_pct / 100 * b_quote_total + (K('freight_per_unit_usd') * b_units if f_fee_build == 2 else 0))) + f_expedite + f_admin_charge, 2)"
    compute_basis:
      b_po_age_days: "The build of the endpoint cancellation fee follows the age of the purchase order, counted in calendar days from the order's purchase order date to the day the cancellation is recorded."
      f_fee_build: "A purchase order at most unallocated_within_days day old has no units allocated yet, and the endpoint cancellation fee is built as admin_per_unit_usd for each unit ordered with no percentage of the quote total; a purchase order at least allocated_after_days days old has its units allocated or in transit, and the endpoint cancellation fee is built as the fee percentage of the quote total plus a return freight of freight_per_unit_usd for each unit ordered; a purchase order of any other age builds the endpoint cancellation fee as the fee percentage of the quote total alone."
      b_cp_tier: "when the client holds a ClearPath agreement whose status is active on the ClearPath Premier or ClearPath Enterprise tier"
      f_fee_pct: "The fee percentage of an endpoint cancellation is rate_premier_pct percent when the client holds a ClearPath agreement whose status is active on the ClearPath Premier or ClearPath Enterprise tier, rate_core_pct percent when that active agreement is on the ClearPath Standard or ClearPath Professional tier, and cancellation_after_po_fee_pct percent for every other client"
      b_exp_approval_age: "The rush processing an order is worked under starts on the day its quote is approved"
      f_expedite: "the order type's rush_fee_usd when the order was quoted with rush and its quote was approved at least one calendar day before the day the cancellation is recorded, half of it when such a quote was approved on that same day, and nothing for an order quoted without rush."
      b_cp_late_fees: "An administration charge is added to the endpoint cancellation fee by the ClearPath late fees posted on the client's ClearPath billing fewer than twelve whole months before the day the cancellation is recorded"
      f_admin_charge: "admin_two_usd for two or more such late fees, admin_one_usd for exactly one, and nothing when there is none; late fees on any other Stratton Bay account do not count."
      result: "the percentage and the way the fee is built are settled first, and any fixed charge is then added to the built fee."
    factors:
      - id: po_age_build
        effect: method
        decides: f_fee_build
        bindings: [b_po_age_days, f_fee_build]
        ladder:
          - when: "the purchase order is at least allocated_after_days days old on the day the cancellation is recorded"
            method: "the fee percentage of the quote total plus freight_per_unit_usd return freight for each unit ordered"
          - when: "the purchase order is at most unallocated_within_days day old"
            method: "admin_per_unit_usd for each unit ordered, with no percentage of the quote total"
          - when: "otherwise"
            method: "the fee percentage of the quote total alone"
        baseline:
          f_fee_build: "0"
        evidence: [date]
        cross_difficulty: null
      - id: tier_fee_rate
        effect: parameter
        decides: f_fee_pct
        bindings: [b_cp_tier, f_fee_pct]
        ladder:
          - when: "an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier"
            value: "K('rate_premier_pct')"
          - when: "an active ClearPath agreement on the ClearPath Standard or ClearPath Professional tier"
            value: "K('rate_core_pct')"
          - when: "otherwise"
            value: "P('cancellation_after_po_fee_pct')"
        baseline:
          f_fee_pct: "P('cancellation_after_po_fee_pct')"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: expedite_forfeit
        effect: parameter
        decides: f_expedite
        bindings: [b_exp_approval_age, f_expedite]
        ladder:
          - when: "quoted with rush and the quote was approved at least one calendar day before the cancellation day"
            value: "P('rush_fee_usd')"
          - when: "quoted with rush and the quote was approved on the cancellation day"
            value: "half of P('rush_fee_usd')"
          - when: "otherwise (quoted without rush)"
            value: "0"
        baseline:
          f_expedite: "0"
        evidence: [date]
        cross_difficulty: null
      - id: arrears_admin_charge
        effect: parameter
        decides: f_admin_charge
        bindings: [b_cp_late_fees, f_admin_charge]
        ladder:
          - when: "two or more ClearPath late fees posted fewer than twelve whole months ago"
            value: "K('admin_two_usd')"
          - when: "exactly one such ClearPath late fee"
            value: "K('admin_one_usd')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          f_admin_charge: "0"
        evidence: [cross_category, history]
        cross_difficulty: managed
    baseline:
      rule: >-
        The standard endpoint cancellation fee is cancellation_after_po_fee_pct percent of the order's quote total. The
        endpoint cancellation fee is rounded half up to the cent once, on the final amount.
      params: [cancellation_after_po_fee_pct]
    prerequisite: []
    cross_category:
      - category: managed
        as: history
        reads: [status, variant_name, managed_billing.event_type, managed_billing.posted_date]
        note: The ClearPath tier sets the fee percentage and the ClearPath late-fee ledger sets the administration charge.
    inputs:
      history:
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 12, filters: {event_type: managed_late_fee}}
      cross_category: [managed]

  - id: hardware_ext_staged_requote_total
    base_policy_refs: [hardware_quote_and_pricing, hardware_agg_multi_holding]
    overwrite:
      - base_policy: hardware_quote_and_pricing
        superseded_clause: >-
          The unit price is unit_cost_usd times one plus the effective markup, rounded half up to the cent
        replaced_by: >-
          For a staged re-quote of a cancelled endpoint line, and only for such a re-quote, the unit price is the
          cancelled order's unit_price_usd carried over unchanged instead of unit_cost_usd times one plus the effective
          markup; a re-issue of a lapsed infrastructure quote follows the re-issue schedule, and every other quote's unit price stays unit_cost_usd times one plus the effective markup, rounded half up to the cent.
      - base_policy: hardware_quote_and_pricing
        superseded_clause: >-
          The quote total is quantity times unit_price_usd, plus staging_fee_per_unit_usd times quantity, plus
          handling_fee_usd, plus rush_fee_usd when rush is requested where rush_available is true
        replaced_by: >-
          For a staged re-quote of a cancelled endpoint line, and only for such a re-quote, the quote total is figured
          as this paragraph states instead of quantity times unit_price_usd plus staging_fee_per_unit_usd times
          quantity plus handling_fee_usd plus rush_fee_usd; a re-issue of a lapsed infrastructure quote follows the re-issue schedule, and every other quote's total stays quantity times unit_price_usd, plus staging_fee_per_unit_usd times quantity, plus handling_fee_usd, plus rush_fee_usd when rush is requested where rush_available is true.
    trigger: on_request
    subject: [hardware_quote_issued]
    computes: quote_total_usd
    target_tool: revise_staged_quote_eb003c71
    params:
      imaging_per_unit_usd: 95.0
      autopilot_managed_usd: 55.0
      autopilot_unmanaged_usd: 70.0
      staged_handling_usd: 25.0
      handling_free_months: 36
      handling_mid_months: 12
      handling_mid_usd: 15.0
      staged_rush_usd: 150.0
      rush_core_usd: 75.0
      credit_full_days: 2
      credit_cap_days: 7
      credit_cap_per_unit_usd: 25.0
      edr_standard_usd: 15.0
      edr_essentials_usd: 8.0
    rule: >-
      This policy prices the revision of a client's Staged Endpoint Order quote for the same part number and
      quantity as a Standard Endpoint Order that was cancelled after its purchase order, when the client switches that
      line to the staged quote so the units ship imaged and enrolled; the revision keeps the staged quote's number,
      re-dates it to the revision day so a new validity period starts, and replaces its total, and only such a staged
      re-quote of a cancelled endpoint line is priced here.
      A re-quote of a cancelled endpoint line is priced only after the order it re-quotes shows status cancelled and its
      ledger carries the cancellation fee charged on it.
      For a staged re-quote of a cancelled endpoint line, and only for such a re-quote, the unit price is the
      cancelled order's unit_price_usd carried over unchanged instead of unit_cost_usd times one plus the effective
      markup; a re-issue of a lapsed infrastructure quote follows the re-issue schedule, and every other quote's unit price stays unit_cost_usd times one plus the effective markup, rounded half up to the cent.
      For a staged re-quote of a cancelled endpoint line, and only for such a re-quote, the quote total is figured as
      this paragraph states instead of quantity times unit_price_usd plus staging_fee_per_unit_usd times quantity plus
      handling_fee_usd plus rush_fee_usd; a re-issue of a lapsed infrastructure quote follows the re-issue schedule, and every other quote's total stays quantity times unit_price_usd, plus staging_fee_per_unit_usd times quantity, plus handling_fee_usd, plus rush_fee_usd when rush is requested where rush_available is true.
      The standard staged re-quote total is the units of the cancelled line times the carried-over unit price, plus an
      imaging charge of imaging_per_unit_usd for each unit, plus a staged handling charge of staged_handling_usd, plus a
      staged rush charge of staged_rush_usd when the cancelled order was quoted with rush, plus a security preparation
      charge of edr_standard_usd for each unit, with nothing deducted. The staged re-quote total is rounded half up to
      the cent once, on the final amount.
      The adjustments below replace parts of that standard total, and they are combined in one fixed order: every
      charge of the re-quote is figured and summed first, and any credit is deducted from that sum last.
      For a staged re-quote, the client's Microsoft 365 plan is read once from its Microsoft 365 subscriptions whose
      status is active: it holds an E5 plan when it has an active Microsoft 365 E5 (no Teams) subscription, and a Premium or E3 plan when it has an
      active Microsoft 365 Business Premium or Microsoft 365 E3 (no Teams) subscription; a subscription in any other
      status gives it neither.
      The staging charge per unit of a staged re-quote is autopilot_managed_usd when the client holds an E5 plan or a
      Premium or E3 plan and an active ClearPath agreement, autopilot_unmanaged_usd when it holds such a plan and no
      active ClearPath agreement, and imaging_per_unit_usd for every other client.
      The staged handling charge follows the client's ClearPath tenure, the whole months from the go-live date of its
      active ClearPath agreement to the re-quote date, a month completing only once the day of the month reaches the
      go-live date's day number: nothing for at least handling_free_months months, handling_mid_usd for at least
      handling_mid_months months and fewer than handling_free_months, and staged_handling_usd for fewer than
      handling_mid_months months or with no active ClearPath agreement.
      The staged rush charge, owed only when the cancelled order was quoted with rush, is nothing for a client whose
      active ClearPath agreement is on the ClearPath Premier or ClearPath Enterprise tier, rush_core_usd when that
      active agreement is on the ClearPath Standard or ClearPath Professional tier, and staged_rush_usd for every other
      client.
      The cancellation-fee credit on a staged re-quote follows the calendar days from the cancelled order's
      cancellation date to the re-quote date: re-quoted within credit_full_days days by a client with no ClearPath late
      fee posted on its ClearPath billing fewer than twelve whole months before the re-quote date, the whole
      cancellation fee charged on the cancelled order is credited; re-quoted within credit_cap_days days in any other case, the credit is the lesser of
      that cancellation fee and credit_cap_per_unit_usd for each unit; re-quoted later, nothing is credited.
      The security preparation charge per unit of a staged re-quote follows the client's Microsoft 365 plans, an E5 plan deciding when the client holds both an E5 plan and a Premium or E3 plan: nothing for a client holding an E5 plan whose active ClearPath agreement covers Microsoft 365 tenant administration, Stratton Bay then pushing its Defender for Endpoint Plan 2 onboarding by policy; edr_essentials_usd for any other client holding an E5 plan or a Premium or E3 plan, whose Defender onboarding package the bench applies to each unit; and edr_standard_usd for every other client, whose units the bench hardens by hand.
    compute:
      - b_lic_e5: "EXISTS('licensing', status='active', variant_name='Microsoft 365 E5 (no Teams)')"
      - b_lic_bp_e3: "EXISTS('licensing', status='active', variant_name='Microsoft 365 Business Premium') or EXISTS('licensing', status='active', variant_name='Microsoft 365 E3 (no Teams)')"
      - b_cp_active: "EXISTS('managed', status='active')"
      - f_staging_per_unit: "K('autopilot_managed_usd') if ((b_lic_e5 or b_lic_bp_e3) and b_cp_active) else (K('autopilot_unmanaged_usd') if ((b_lic_e5 or b_lic_bp_e3) and not b_cp_active) else K('imaging_per_unit_usd'))"
      - b_rq_go_live: "CFIELD('managed', 'go_live_date', status='active')"
      - b_rq_tenure: "MONTHS(b_rq_go_live, NOW) if b_rq_go_live else 0"
      - f_handling: "0 if b_rq_tenure >= K('handling_free_months') else (K('handling_mid_usd') if b_rq_tenure >= K('handling_mid_months') else K('staged_handling_usd'))"
      - b_rush_tier: "CFIELD('managed', 'variant_name', status='active')"
      - f_rush_charge: "0 if (b_rush_tier == 'ClearPath Premier' or b_rush_tier == 'ClearPath Enterprise') else (K('rush_core_usd') if (b_rush_tier == 'ClearPath Standard' or b_rush_tier == 'ClearPath Professional') else K('staged_rush_usd'))"
      - b_days_since_cancel: "DAYS(F('cancelled_date'), NOW) if F('cancelled_date') else 9999"
      - b_credit_late_fees: "XCOUNT('managed', 'managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')"
      - f_credit_basis: "2 if (b_days_since_cancel <= K('credit_full_days') and b_credit_late_fees == 0) else (1 if b_days_since_cancel <= K('credit_cap_days') else 0)"
      - b_def_tenant_admin: "CPARAM('managed', 'm365_administration_included', status='active')"
      - f_edr_per_unit: "0 if (b_lic_e5 and b_def_tenant_admin) else (K('edr_essentials_usd') if (b_lic_e5 or b_lic_bp_e3) else K('edr_standard_usd'))"
      - b_cancel_fee: "SUM('hardware_billing', 'amount_usd', event_type='hardware_cancellation_fee')"
      - b_rush_quoted: "F('rush_requested')"
      - b_units: "F('quantity')"
      - b_unit_price: "F('unit_price_usd')"
      - result: "RND(b_units * b_unit_price + b_units * f_staging_per_unit + f_handling + (f_rush_charge if b_rush_quoted else 0) + b_units * f_edr_per_unit - (b_cancel_fee if f_credit_basis == 2 else (MN(b_cancel_fee, K('credit_cap_per_unit_usd') * b_units) if f_credit_basis == 1 else 0)), 2)"
    compute_basis:
      b_lic_e5: "it holds an E5 plan when it has an active Microsoft 365 E5 (no Teams) subscription"
      b_lic_bp_e3: "a Premium or E3 plan when it has an active Microsoft 365 Business Premium or Microsoft 365 E3 (no Teams) subscription; a subscription in any other status gives it neither."
      b_cp_active: "and an active ClearPath agreement"
      f_staging_per_unit: "The staging charge per unit of a staged re-quote is autopilot_managed_usd when the client holds an E5 plan or a Premium or E3 plan and an active ClearPath agreement, autopilot_unmanaged_usd when it holds such a plan and no active ClearPath agreement, and imaging_per_unit_usd for every other client."
      b_rq_go_live: "the whole months from the go-live date of its active ClearPath agreement to the re-quote date"
      b_rq_tenure: "a month completing only once the day of the month reaches the go-live date's day number"
      f_handling: "nothing for at least handling_free_months months, handling_mid_usd for at least handling_mid_months months and fewer than handling_free_months, and staged_handling_usd for fewer than handling_mid_months months or with no active ClearPath agreement."
      b_rush_tier: "for a client whose active ClearPath agreement is on the ClearPath Premier or ClearPath Enterprise tier"
      f_rush_charge: "The staged rush charge, owed only when the cancelled order was quoted with rush, is nothing for a client whose active ClearPath agreement is on the ClearPath Premier or ClearPath Enterprise tier, rush_core_usd when that active agreement is on the ClearPath Standard or ClearPath Professional tier, and staged_rush_usd for every other client."
      b_days_since_cancel: "The cancellation-fee credit on a staged re-quote follows the calendar days from the cancelled order's cancellation date to the re-quote date"
      b_credit_late_fees: "by a client with no ClearPath late fee posted on its ClearPath billing fewer than twelve whole months before the re-quote date"
      f_credit_basis: "re-quoted within credit_full_days days by a client with no ClearPath late fee posted on its ClearPath billing fewer than twelve whole months before the re-quote date, the whole cancellation fee charged on the cancelled order is credited; re-quoted within credit_cap_days days in any other case, the credit is the lesser of that cancellation fee and credit_cap_per_unit_usd for each unit; re-quoted later, nothing is credited."
      b_def_tenant_admin: "whose active ClearPath agreement covers Microsoft 365 tenant administration"
      f_edr_per_unit: "The security preparation charge per unit of a staged re-quote follows the client's Microsoft 365 plans, an E5 plan deciding when the client holds both an E5 plan and a Premium or E3 plan: nothing for a client holding an E5 plan whose active ClearPath agreement covers Microsoft 365 tenant administration, Stratton Bay then pushing its Defender for Endpoint Plan 2 onboarding by policy; edr_essentials_usd for any other client holding an E5 plan or a Premium or E3 plan, whose Defender onboarding package the bench applies to each unit; and edr_standard_usd for every other client, whose units the bench hardens by hand."
      b_cancel_fee: "A re-quote of a cancelled endpoint line is priced only after the order it re-quotes shows status cancelled and its ledger carries the cancellation fee charged on it."
      b_rush_quoted: "owed only when the cancelled order was quoted with rush"
      b_unit_price: "the unit price is the cancelled order's unit_price_usd carried over unchanged"
      result: "every charge of the re-quote is figured and summed first, and any credit is deducted from that sum last."
    factors:
      - id: autopilot_staging_rate
        effect: parameter
        decides: f_staging_per_unit
        bindings: [b_cp_active, f_staging_per_unit]
        ladder:
          - when: "an E5 plan or a Premium or E3 plan and an active ClearPath agreement"
            value: "K('autopilot_managed_usd')"
          - when: "such a plan and no active ClearPath agreement"
            value: "K('autopilot_unmanaged_usd')"
          - when: "otherwise"
            value: "K('imaging_per_unit_usd')"
        baseline:
          f_staging_per_unit: "K('imaging_per_unit_usd')"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: tenure_handling
        effect: parameter
        decides: f_handling
        bindings: [b_rq_go_live, b_rq_tenure, f_handling]
        ladder:
          - when: "at least handling_free_months whole months since the active ClearPath agreement's go-live date"
            value: "0"
          - when: "at least handling_mid_months and fewer than handling_free_months whole months"
            value: "K('handling_mid_usd')"
          - when: "otherwise (fewer months, or no active ClearPath agreement)"
            value: "K('staged_handling_usd')"
        baseline:
          f_handling: "K('staged_handling_usd')"
        evidence: [cross_category, date]
        cross_difficulty: managed
      - id: tier_rush_rate
        effect: parameter
        decides: f_rush_charge
        bindings: [b_rush_tier, f_rush_charge]
        ladder:
          - when: "an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier"
            value: "0"
          - when: "an active ClearPath agreement on the ClearPath Standard or ClearPath Professional tier"
            value: "K('rush_core_usd')"
          - when: "otherwise"
            value: "K('staged_rush_usd')"
        baseline:
          f_rush_charge: "K('staged_rush_usd')"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: fee_credit_basis
        effect: method
        decides: f_credit_basis
        bindings: [b_days_since_cancel, b_credit_late_fees, f_credit_basis]
        ladder:
          - when: "re-quoted within credit_full_days days of the cancellation by a client with no ClearPath late fee posted fewer than twelve whole months before the re-quote date"
            method: "the whole cancellation fee charged on the cancelled order is deducted"
          - when: "re-quoted within credit_cap_days days of the cancellation in any other case"
            method: "the lesser of that cancellation fee and credit_cap_per_unit_usd for each unit is deducted"
          - when: "otherwise"
            method: "nothing is deducted"
        baseline:
          f_credit_basis: "0"
        evidence: [date, cross_category, history]
        cross_difficulty: managed
      - id: defender_onboarding_rate
        effect: parameter
        decides: f_edr_per_unit
        bindings: [b_def_tenant_admin, f_edr_per_unit]
        ladder:
          - when: "an E5 plan and an active ClearPath agreement that covers Microsoft 365 tenant administration"
            value: "0"
          - when: "otherwise an E5 plan or a Premium or E3 plan"
            value: "K('edr_essentials_usd')"
          - when: "otherwise"
            value: "K('edr_standard_usd')"
        baseline:
          f_edr_per_unit: "K('edr_standard_usd')"
        evidence: [cross_category]
        cross_difficulty: managed
    baseline:
      rule: >-
        The standard staged re-quote total is the units of the cancelled line times the carried-over unit price, plus an
        imaging charge of imaging_per_unit_usd for each unit, plus a staged handling charge of staged_handling_usd, plus a
        staged rush charge of staged_rush_usd when the cancelled order was quoted with rush, plus a security preparation
        charge of edr_standard_usd for each unit, with nothing deducted. The staged re-quote total is rounded half up to
        the cent once, on the final amount.
      params: [imaging_per_unit_usd, staged_handling_usd, staged_rush_usd, edr_standard_usd]
    prerequisite:
      - problem: hardware_ext_endpoint_cancellation_fee
        kind: value_input
        gate: b_cancel_fee
        form: state
        policy_source: >-
          A re-quote of a cancelled endpoint line is priced only after the order it re-quotes shows status cancelled and
          its ledger carries the cancellation fee charged on it.
        condition: >-
          The Standard Endpoint Order being re-quoted has status cancelled with cancellation_stage after_po, and its
          hardware billing ledger carries one hardware_cancellation_fee entry.
        resolved_by: sign_order_cancellation_55862425
        effect: >-
          b_cancel_fee moves from 0 to the fee booked with the cancellation, and the credit basis deducts that fee in
          whole or up to its per-unit cap from the re-quote total.
    cross_category:
      - category: licensing
        as: existence
        reads: [status, variant_name]
        note: The client's active Microsoft 365 plans, read once, feed the Autopilot staging charge (with an active ClearPath agreement) and the security preparation charge (with the agreement's tenant-administration coverage).
      - category: managed
        as: branch
        reads: [status, variant_name, go_live_date, m365_administration_included, managed_billing.event_type, managed_billing.posted_date]
        note: An active ClearPath agreement sets the staging tier, its tier the rush charge, its tenant-administration coverage the security preparation tier, its late-fee ledger the credit basis, and its go-live date the tenure for the handling charge.
    inputs:
      history:
        - {table: hardware_billing, aggregate: sum, field: amount_usd, filters: {event_type: hardware_cancellation_fee}}
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 12, filters: {event_type: managed_late_fee}}
      cross_category: [licensing, managed]

  - id: hardware_ext_endpoint_approval_deposit
    base_policy_refs: [hardware_approval_and_purchase_order, hardware_agg_credit_exposure, hardware_client_signed_requests, hardware_quote_and_pricing]
    overwrite:
      - base_policy: hardware_approval_and_purchase_order
        superseded_clause: >-
          On approval a required deposit of deposit_pct percent of the quote total is invoiced, rounded half up to the
          cent, due on receipt (deposit_due).
        replaced_by: >-
          For a Standard Endpoint Order or Staged Endpoint Order approved within the client's credit limit, and only for
          such an order, the required deposit is figured as this paragraph states instead of deposit_pct percent of the
          quote total; it is still invoiced on approval, rounded half up to the cent and due on receipt (deposit_due); a Network Equipment Order or Server & Storage Build Order approved within the client's credit limit follows the infrastructure deposit schedule; and every other order, including any order whose approval would take the client over its credit limit, keeps the deposit of the base rule: a required deposit of deposit_pct percent of the quote total, or 100 percent of the quote total whatever deposit_pct and deposit_threshold_usd say when the approval would take the client over its credit limit, invoiced on approval, rounded half up to the cent and due on receipt (deposit_due).
    trigger: on_request
    subject: [hardware_quote_approved, hardware_deposit_invoice]
    computes: deposit_usd
    target_tool: sign_quote_approval_0590c0d2
    params:
      share_premier_pct: 10.0
      share_core_pct: 20.0
      arrears_two_pts: 15.0
      arrears_one_pts: 5.0
      spend_high_pts: 4.0
      spend_mid_pts: 2.0
      spend_high_ratio: 0.5
      spend_mid_ratio: 0.25
      build_new_months: 36
    rule: >-
      This policy fixes the deposit invoiced when the authorized contact e-signs a Standard Endpoint Order or Staged
      Endpoint Order quote whose approval keeps the client within its hardware credit limit; the signature records the
      approval and the deposit invoice together. A quote whose approval would take the client over its credit limit is
      prepaid under the credit-exposure rule and is not priced here.
      The deposit on a staged quote that takes over a plain endpoint line cancelled after its purchase order is
      not fixed until that staged quote carries a quote date no earlier than the cancellation date of the line it
      takes over.
      For a Standard Endpoint Order or Staged Endpoint Order approved within the client's credit limit, and only for
      such an order, the required deposit is figured as this paragraph states instead of deposit_pct percent of the
      quote total; it is still invoiced on approval, rounded half up to the cent and due on receipt (deposit_due); a Network Equipment Order or Server & Storage Build Order approved within the client's credit limit follows the infrastructure deposit schedule; and every other order, including any order whose approval would take the client over its credit limit, keeps the deposit of the base rule: a required deposit of deposit_pct percent of the quote total, or 100 percent of the quote total whatever deposit_pct and deposit_threshold_usd say when the approval would take the client over its credit limit, invoiced on approval, rounded half up to the cent and due on receipt (deposit_due).
      A deposit is required on an endpoint approval when the quote total is at least deposit_threshold_usd, and the
      standard endpoint deposit is then deposit_pct percent of the quote total; no deposit is invoiced on a quote total
      below deposit_threshold_usd. The endpoint deposit is rounded half up to the cent once, on the final amount.
      The adjustments below replace parts of that standard deposit and are applied in one fixed order: the deposit-required test on the quote total comes first and no adjustment changes it; the deposit percentage is then settled; and the way the deposit is built from that percentage and the quote comes last.
      The endpoint deposit share is share_premier_pct percent for a client whose active ClearPath agreement is on the
      ClearPath Premier or ClearPath Enterprise tier, share_core_pct percent for a client whose active ClearPath
      agreement is on the ClearPath Standard or ClearPath Professional tier, and deposit_pct percent for every other
      client.
      Late-payment points are added to the endpoint deposit percentage from the ClearPath late fees posted on the
      client's ClearPath billing fewer than twelve whole months before the approval date: arrears_two_pts points for
      two or more such late fees, arrears_one_pts points for exactly one, and none when there is none.
      Managed-spend relief points are taken off the endpoint deposit percentage by the client's monthly ClearPath seat billing, the seat_rate_usd times the seat_count of its active ClearPath agreement, measured against the quote total: spend_high_pts points when that monthly billing is at least spend_high_ratio times the quote total, spend_mid_pts points when it is at least spend_mid_ratio times the quote total and less than spend_high_ratio times it, and none for a lower monthly billing or no active ClearPath agreement.
      The endpoint deposit is built by the client's ClearPath relationship: a client with no active ClearPath agreement
      pays a deposit equal to the distributor cost of the units, unit_cost_usd times the quantity, whatever the
      percentage; a client whose active ClearPath agreement went live fewer than build_new_months whole months before
      the approval date pays the order's service charges, the quote total less the quantity times the unit price, in
      full plus the deposit percentage of the quantity times the unit price; every other client pays the deposit
      percentage of the quote total. Whole months are counted from the go-live date, a month completing only once the
      day of the month reaches the go-live date's day number.
    compute:
      - b_quote_total: "F('quote_total_usd')"
      - b_units: "F('quantity')"
      - b_unit_price: "F('unit_price_usd')"
      - b_unit_cost: "F('unit_cost_usd')"
      - b_deposit_required: "1 if b_quote_total >= P('deposit_threshold_usd') else 0"
      - b_dep_tier: "CFIELD('managed', 'variant_name', status='active')"
      - f_deposit_share: "K('share_premier_pct') if (b_dep_tier == 'ClearPath Premier' or b_dep_tier == 'ClearPath Enterprise') else (K('share_core_pct') if (b_dep_tier == 'ClearPath Standard' or b_dep_tier == 'ClearPath Professional') else P('deposit_pct'))"
      - b_dep_late_fees: "XCOUNT('managed', 'managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')"
      - f_arrears_pts: "K('arrears_two_pts') if b_dep_late_fees >= 2 else (K('arrears_one_pts') if b_dep_late_fees == 1 else 0)"
      - b_dep_monthly: "(CFIELD('managed', 'seat_rate_usd', status='active') or 0) * (CFIELD('managed', 'seat_count', status='active') or 0)"
      - f_relief_pts: "K('spend_high_pts') if b_dep_monthly >= K('spend_high_ratio') * F('quote_total_usd') else (K('spend_mid_pts') if b_dep_monthly >= K('spend_mid_ratio') * F('quote_total_usd') else 0)"
      - b_dep_go_live: "CFIELD('managed', 'go_live_date', status='active')"
      - b_dep_tenure: "MONTHS(b_dep_go_live, NOW) if b_dep_go_live else 0"
      - f_deposit_build: "2 if not b_dep_go_live else (1 if b_dep_tenure < K('build_new_months') else 0)"
      - result: "RND(0 if b_deposit_required == 0 else (b_unit_cost * b_units if f_deposit_build == 2 else (((b_quote_total - b_units * b_unit_price) + (f_deposit_share + f_arrears_pts - f_relief_pts) / 100 * b_units * b_unit_price) if f_deposit_build == 1 else (f_deposit_share + f_arrears_pts - f_relief_pts) / 100 * b_quote_total)), 2)"
    compute_basis:
      b_quote_total: "The deposit on a staged quote that takes over a plain endpoint line cancelled after its purchase order is not fixed until that staged quote carries a quote date no earlier than the cancellation date of the line it takes over."
      b_deposit_required: "A deposit is required on an endpoint approval when the quote total is at least deposit_threshold_usd, and the standard endpoint deposit is then deposit_pct percent of the quote total; no deposit is invoiced on a quote total below deposit_threshold_usd."
      b_dep_tier: "for a client whose active ClearPath agreement is on the ClearPath Premier or ClearPath Enterprise tier"
      f_deposit_share: "The endpoint deposit share is share_premier_pct percent for a client whose active ClearPath agreement is on the ClearPath Premier or ClearPath Enterprise tier, share_core_pct percent for a client whose active ClearPath agreement is on the ClearPath Standard or ClearPath Professional tier, and deposit_pct percent for every other client."
      b_dep_late_fees: "Late-payment points are added to the endpoint deposit percentage from the ClearPath late fees posted on the client's ClearPath billing fewer than twelve whole months before the approval date"
      f_arrears_pts: "arrears_two_pts points for two or more such late fees, arrears_one_pts points for exactly one, and none when there is none."
      b_dep_monthly: "by the client's monthly ClearPath seat billing, the seat_rate_usd times the seat_count of its active ClearPath agreement, measured against the quote total"
      f_relief_pts: "spend_high_pts points when that monthly billing is at least spend_high_ratio times the quote total, spend_mid_pts points when it is at least spend_mid_ratio times the quote total and less than spend_high_ratio times it, and none for a lower monthly billing or no active ClearPath agreement."
      b_dep_go_live: "a client whose active ClearPath agreement went live fewer than build_new_months whole months before the approval date"
      b_dep_tenure: "Whole months are counted from the go-live date, a month completing only once the day of the month reaches the go-live date's day number."
      f_deposit_build: "a client with no active ClearPath agreement pays a deposit equal to the distributor cost of the units, unit_cost_usd times the quantity, whatever the percentage; a client whose active ClearPath agreement went live fewer than build_new_months whole months before the approval date pays the order's service charges, the quote total less the quantity times the unit price, in full plus the deposit percentage of the quantity times the unit price; every other client pays the deposit percentage of the quote total."
      result: "the deposit-required test on the quote total comes first and no adjustment changes it; the deposit percentage is then settled; and the way the deposit is built from that percentage and the quote comes last."
    factors:
      - id: tier_deposit_share
        effect: parameter
        decides: f_deposit_share
        bindings: [b_dep_tier, f_deposit_share]
        ladder:
          - when: "an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier"
            value: "K('share_premier_pct')"
          - when: "an active ClearPath agreement on the ClearPath Standard or ClearPath Professional tier"
            value: "K('share_core_pct')"
          - when: "otherwise"
            value: "P('deposit_pct')"
        baseline:
          f_deposit_share: "P('deposit_pct')"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: arrears_deposit_points
        effect: parameter
        decides: f_arrears_pts
        bindings: [b_dep_late_fees, f_arrears_pts]
        ladder:
          - when: "two or more ClearPath late fees posted fewer than twelve whole months before the approval date"
            value: "K('arrears_two_pts')"
          - when: "exactly one such ClearPath late fee"
            value: "K('arrears_one_pts')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          f_arrears_pts: "0"
        evidence: [cross_category, history]
        cross_difficulty: managed
      - id: managed_spend_relief
        effect: parameter
        decides: f_relief_pts
        bindings: [b_dep_monthly, f_relief_pts]
        ladder:
          - when: "monthly ClearPath seat billing at least spend_high_ratio times the quote total"
            value: "K('spend_high_pts')"
          - when: "at least spend_mid_ratio and less than spend_high_ratio times the quote total"
            value: "K('spend_mid_pts')"
          - when: "otherwise (lower, or no active ClearPath agreement)"
            value: "0"
        baseline:
          f_relief_pts: "0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: tenure_deposit_build
        effect: method
        decides: f_deposit_build
        bindings: [b_dep_go_live, b_dep_tenure, f_deposit_build]
        ladder:
          - when: "no active ClearPath agreement"
            method: "the deposit is the distributor cost of the units, unit_cost_usd times the quantity"
          - when: "an active ClearPath agreement that went live fewer than build_new_months whole months before the approval date"
            method: "the service charges (quote total less quantity times unit price) in full plus the deposit percentage of quantity times unit price"
          - when: "otherwise"
            method: "the deposit percentage of the quote total"
        baseline:
          f_deposit_build: "0"
        evidence: [cross_category, date]
        cross_difficulty: managed
    baseline:
      rule: >-
        A deposit is required on an endpoint approval when the quote total is at least deposit_threshold_usd, and the
        standard endpoint deposit is then deposit_pct percent of the quote total; no deposit is invoiced on a quote total
        below deposit_threshold_usd. The endpoint deposit is rounded half up to the cent once, on the final amount.
      params: [deposit_pct, deposit_threshold_usd]
    prerequisite:
      - problem: hardware_ext_staged_requote_total
        kind: value_input
        gate: b_quote_total
        form: state
        policy_source: >-
          The deposit on a staged quote that takes over a plain endpoint line cancelled after its purchase order is
          not fixed until that staged quote carries a quote date no earlier than the cancellation date of the line it
          takes over.
        condition: >-
          The quoted Staged Endpoint Order for the same part number and quantity has a quote_date on or after the
          cancelled_date of the Standard Endpoint Order whose line it takes over, carrying the revised quote_total_usd.
        resolved_by: revise_staged_quote_eb003c71
        effect: >-
          The staged quote's quote_total_usd is replaced by the revised total, so b_quote_total (and the service
          charges it implies) is the revised staged total the deposit is built on.
    cross_category:
      - category: managed
        as: history
        reads: [status, variant_name, go_live_date, seat_rate_usd, seat_count, managed_billing.event_type, managed_billing.posted_date]
        note: The ClearPath tier sets the deposit share, the late-fee ledger the late-payment points, the seat billing the managed-spend relief and the go-live date the deposit build.
    inputs:
      history:
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 12, filters: {event_type: managed_late_fee}}
      cross_category: [managed]

  - id: hardware_ext_infrastructure_cancellation_fee
    base_policy_refs: [hardware_cancellation, hardware_client_signed_requests]
    overwrite:
      - base_policy: hardware_cancellation
        superseded_clause: >-
          Such a cancellation is charged cancellation_after_po_fee_pct percent of the quote total, rounded half up to
          the cent, and any deposit paid is applied against that fee by an order credit with the excess refunded by the
          accounting team.
        replaced_by: >-
          For a Network Equipment Order or Server & Storage Build Order cancelled after its purchase order, and only for
          such an order, the infrastructure cancellation fee is figured as this paragraph states instead of a flat
          cancellation_after_po_fee_pct percent of the quote total, and its paid deposit is returned under the
          infrastructure deposit-credit schedule; a Standard Endpoint Order is settled under the endpoint cancellation
          schedule, and every other order type's cancellation after its purchase order stays charged
          cancellation_after_po_fee_pct percent of the quote total, rounded half up to the cent, with any deposit paid
          applied against that fee by an order credit and the excess refunded by the accounting team.
    trigger: on_request
    subject: [hardware_order_cancelled, hardware_cancellation_fee]
    computes: fee_usd
    target_tool: sign_infrastructure_cancellation_1779b7d3
    params:
      unallocated_within_days: 1
      bench_after_days: 7
      admin_per_unit_usd: 40.0
      rate_premier_pct: 9.0
      rate_core_pct: 12.0
      project_major_pts: 2.0
      project_minor_pts: 1.0
      arrears_two_pts: 3.0
      arrears_one_pts: 1.0
      seat_large: 25
      seat_mid: 10
      seat_large_pts: 1.5
      seat_mid_pts: 0.5
      freight_per_unit_usd: 20.0
      loyalty_long_months: 48
      loyalty_mid_months: 24
      loyalty_long_pts: 1.5
      loyalty_mid_pts: 0.5
    rule: >-
      This policy settles the fee charged when the authorized contact's e-signed cancellation of a Network Equipment
      Order or Server & Storage Build Order takes effect after the order's purchase order was placed and before it
      shipped; the signature records the cancellation and its fee together.
      For a Network Equipment Order or Server & Storage Build Order cancelled after its purchase order, and only for
      such an order, the infrastructure cancellation fee is figured as this paragraph states instead of a flat
      cancellation_after_po_fee_pct percent of the quote total, and its paid deposit is returned under the
      infrastructure deposit-credit schedule; a Standard Endpoint Order is settled under the endpoint cancellation
      schedule, and every other order type's cancellation after its purchase order stays charged
      cancellation_after_po_fee_pct percent of the quote total, rounded half up to the cent, with any deposit paid
      applied against that fee by an order credit and the excess refunded by the accounting team.
      The standard infrastructure cancellation fee is cancellation_after_po_fee_pct percent of the order's quote total.
      The infrastructure cancellation fee is rounded half up to the cent once, on the final amount.
      The adjustments below replace parts of that standard fee and are applied in one fixed order: the fee percentage is settled first; the fee is then built from that percentage, the quote total and the units ordered; and the built fee never exceeds the deposit paid on the order, the sum of the payments on its ledger counted up to the deposit invoiced.
      The build of the infrastructure cancellation fee follows the age of the purchase order, counted in calendar days
      from the order's purchase order date to the day the cancellation is recorded. A purchase order at most
      unallocated_within_days day old has no units allocated yet, and the fee is built as admin_per_unit_usd for each
      unit ordered with no percentage of the quote total; a purchase order at least bench_after_days days old has its units shipped to the staging bench, and the fee is built as the fee percentage of the quote total plus a return freight of freight_per_unit_usd for each unit ordered; a purchase order of any other age builds the fee as the fee percentage of the quote
      total alone.
      The tier rate of an infrastructure cancellation is rate_premier_pct percent when the client holds a ClearPath
      agreement whose status is active on the ClearPath Premier or ClearPath Enterprise tier, rate_core_pct percent when
      that active agreement is on the ClearPath Standard or ClearPath Professional tier, and
      cancellation_after_po_fee_pct percent for every other client.
      Project points come off the infrastructure fee percentage when the client holds one or more project engagements whose status is in_progress, the largest class among them deciding: project_major_pts points when any of them is classed Standard Project, Advanced Project, Major Project or Strategic Program, project_minor_pts points when every one of them is of a smaller class, and none without an in-progress engagement.
      Late-payment points are added to the infrastructure fee percentage from the ClearPath late fees posted on the
      client's ClearPath billing fewer than twelve whole months before the day the cancellation is recorded:
      arrears_two_pts points for two or more such late fees, arrears_one_pts points for exactly one, and none when there
      is none.
      Seat points come off the infrastructure fee percentage by the seats currently covered on the client's active
      ClearPath agreement: seat_large_pts points for at least seat_large seats, seat_mid_pts points for at least
      seat_mid and fewer than seat_large seats, and none for fewer seats or no active ClearPath agreement.
      Loyalty points come off the infrastructure fee percentage by the client's ClearPath tenure, the whole months from the go-live date of its active ClearPath agreement to the day the cancellation is recorded, a month completing only once the day of the month reaches the go-live date's day number: loyalty_long_pts points for at least loyalty_long_months months, loyalty_mid_pts points for at least loyalty_mid_months and fewer than loyalty_long_months months, and none for fewer months or no active ClearPath agreement.
    compute:
      - b_inf_po_age: "DAYS(F('order_placed_date'), NOW)"
      - f_inf_build: "2 if b_inf_po_age >= K('bench_after_days') else (1 if b_inf_po_age <= K('unallocated_within_days') else 0)"
      - b_inf_tier: "CFIELD('managed', 'variant_name', status='active')"
      - f_inf_rate: "K('rate_premier_pct') if (b_inf_tier == 'ClearPath Premier' or b_inf_tier == 'ClearPath Enterprise') else (K('rate_core_pct') if (b_inf_tier == 'ClearPath Standard' or b_inf_tier == 'ClearPath Professional') else P('cancellation_after_po_fee_pct'))"
      - b_inf_major_project: "EXISTS('project', status='in_progress', variant_name='Standard Project') or EXISTS('project', status='in_progress', variant_name='Advanced Project') or EXISTS('project', status='in_progress', variant_name='Major Project') or EXISTS('project', status='in_progress', variant_name='Strategic Program')"
      - b_inf_any_project: "EXISTS('project', status='in_progress')"
      - f_inf_project_pts: "K('project_major_pts') if b_inf_major_project else (K('project_minor_pts') if b_inf_any_project else 0)"
      - b_inf_late_fees: "XCOUNT('managed', 'managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')"
      - f_inf_arrears_pts: "K('arrears_two_pts') if b_inf_late_fees >= 2 else (K('arrears_one_pts') if b_inf_late_fees == 1 else 0)"
      - b_inf_seats: "CFIELD('managed', 'seat_count', status='active') or 0"
      - f_inf_seat_pts: "K('seat_large_pts') if b_inf_seats >= K('seat_large') else (K('seat_mid_pts') if b_inf_seats >= K('seat_mid') else 0)"
      - b_inf_go_live: "CFIELD('managed', 'go_live_date', status='active')"
      - b_inf_tenure: "MONTHS(b_inf_go_live, NOW) if b_inf_go_live else 0"
      - f_inf_loyalty_pts: "K('loyalty_long_pts') if b_inf_tenure >= K('loyalty_long_months') else (K('loyalty_mid_pts') if b_inf_tenure >= K('loyalty_mid_months') else 0)"
      - b_units: "F('quantity')"
      - b_quote_total: "F('quote_total_usd')"
      - b_inf_deposit_paid: "MN(SUM('hardware_billing', 'amount_usd', event_type='hardware_payment'), SUM('hardware_billing', 'amount_usd', event_type='hardware_deposit_invoice'))"
      - result: "RND(MN(K('admin_per_unit_usd') * b_units if f_inf_build == 1 else ((f_inf_rate - f_inf_project_pts + f_inf_arrears_pts - f_inf_seat_pts - f_inf_loyalty_pts) / 100 * b_quote_total + (K('freight_per_unit_usd') * b_units if f_inf_build == 2 else 0)), b_inf_deposit_paid), 2)"
    compute_basis:
      b_inf_po_age: "The build of the infrastructure cancellation fee follows the age of the purchase order, counted in calendar days from the order's purchase order date to the day the cancellation is recorded."
      f_inf_build: "A purchase order at most unallocated_within_days day old has no units allocated yet, and the fee is built as admin_per_unit_usd for each unit ordered with no percentage of the quote total; a purchase order at least bench_after_days days old has its units shipped to the staging bench, and the fee is built as the fee percentage of the quote total plus a return freight of freight_per_unit_usd for each unit ordered; a purchase order of any other age builds the fee as the fee percentage of the quote total alone."
      b_inf_tier: "when the client holds a ClearPath agreement whose status is active on the ClearPath Premier or ClearPath Enterprise tier"
      f_inf_rate: "The tier rate of an infrastructure cancellation is rate_premier_pct percent when the client holds a ClearPath agreement whose status is active on the ClearPath Premier or ClearPath Enterprise tier, rate_core_pct percent when that active agreement is on the ClearPath Standard or ClearPath Professional tier, and cancellation_after_po_fee_pct percent for every other client."
      b_inf_major_project: "project_major_pts points when any of them is classed Standard Project, Advanced Project, Major Project or Strategic Program"
      b_inf_any_project: "when the client holds one or more project engagements whose status is in_progress, the largest class among them deciding"
      f_inf_project_pts: "project_major_pts points when any of them is classed Standard Project, Advanced Project, Major Project or Strategic Program, project_minor_pts points when every one of them is of a smaller class, and none without an in-progress engagement."
      b_inf_late_fees: "Late-payment points are added to the infrastructure fee percentage from the ClearPath late fees posted on the client's ClearPath billing fewer than twelve whole months before the day the cancellation is recorded"
      f_inf_arrears_pts: "arrears_two_pts points for two or more such late fees, arrears_one_pts points for exactly one, and none when there is none."
      b_inf_seats: "Seat points come off the infrastructure fee percentage by the seats currently covered on the client's active ClearPath agreement"
      f_inf_seat_pts: "seat_large_pts points for at least seat_large seats, seat_mid_pts points for at least seat_mid and fewer than seat_large seats, and none for fewer seats or no active ClearPath agreement."
      b_inf_go_live: "the whole months from the go-live date of its active ClearPath agreement to the day the cancellation is recorded"
      b_inf_tenure: "a month completing only once the day of the month reaches the go-live date's day number"
      f_inf_loyalty_pts: "loyalty_long_pts points for at least loyalty_long_months months, loyalty_mid_pts points for at least loyalty_mid_months and fewer than loyalty_long_months months, and none for fewer months or no active ClearPath agreement."
      result: "the fee percentage is settled first; the fee is then built from that percentage, the quote total and the units ordered; and the built fee never exceeds the deposit paid on the order, the sum of the payments on its ledger counted up to the deposit invoiced."
    factors:
      - id: bench_stage_build
        effect: method
        decides: f_inf_build
        bindings: [b_inf_po_age, f_inf_build]
        ladder:
          - when: "the purchase order is at least bench_after_days days old on the day the cancellation is recorded"
            method: "the fee percentage of the quote total plus freight_per_unit_usd return freight for each unit ordered"
          - when: "the purchase order is at most unallocated_within_days day old"
            method: "admin_per_unit_usd for each unit ordered, with no percentage of the quote total"
          - when: "otherwise"
            method: "the fee percentage of the quote total alone"
        baseline:
          f_inf_build: "0"
        evidence: [date]
        cross_difficulty: null
      - id: infra_tier_rate
        effect: parameter
        decides: f_inf_rate
        bindings: [b_inf_tier, f_inf_rate]
        ladder:
          - when: "an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier"
            value: "K('rate_premier_pct')"
          - when: "an active ClearPath agreement on the ClearPath Standard or ClearPath Professional tier"
            value: "K('rate_core_pct')"
          - when: "otherwise"
            value: "P('cancellation_after_po_fee_pct')"
        baseline:
          f_inf_rate: "P('cancellation_after_po_fee_pct')"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: project_scope_points
        effect: parameter
        decides: f_inf_project_pts
        bindings: [b_inf_major_project, b_inf_any_project, f_inf_project_pts]
        ladder:
          - when: "any in-progress project engagement classed Standard Project, Advanced Project, Major Project or Strategic Program"
            value: "K('project_major_pts')"
          - when: "in-progress engagements, all of a smaller class"
            value: "K('project_minor_pts')"
          - when: "otherwise (no in-progress engagement)"
            value: "0"
        baseline:
          f_inf_project_pts: "0"
        evidence: [cross_category]
        cross_difficulty: project
      - id: arrears_fee_points
        effect: parameter
        decides: f_inf_arrears_pts
        bindings: [b_inf_late_fees, f_inf_arrears_pts]
        ladder:
          - when: "two or more ClearPath late fees posted fewer than twelve whole months before the cancellation day"
            value: "K('arrears_two_pts')"
          - when: "exactly one such ClearPath late fee"
            value: "K('arrears_one_pts')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          f_inf_arrears_pts: "0"
        evidence: [cross_category, history]
        cross_difficulty: managed
      - id: covered_seat_points
        effect: parameter
        decides: f_inf_seat_pts
        bindings: [b_inf_seats, f_inf_seat_pts]
        ladder:
          - when: "at least seat_large seats covered on the active ClearPath agreement"
            value: "K('seat_large_pts')"
          - when: "at least seat_mid and fewer than seat_large seats"
            value: "K('seat_mid_pts')"
          - when: "otherwise"
            value: "0"
        baseline:
          f_inf_seat_pts: "0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: tenure_loyalty_points
        effect: parameter
        decides: f_inf_loyalty_pts
        bindings: [b_inf_go_live, b_inf_tenure, f_inf_loyalty_pts]
        ladder:
          - when: "at least loyalty_long_months whole months since the active ClearPath agreement's go-live date"
            value: "K('loyalty_long_pts')"
          - when: "at least loyalty_mid_months and fewer than loyalty_long_months whole months"
            value: "K('loyalty_mid_pts')"
          - when: "otherwise (fewer months, or no active ClearPath agreement)"
            value: "0"
        baseline:
          f_inf_loyalty_pts: "0"
        evidence: [cross_category, date]
        cross_difficulty: managed
    baseline:
      rule: >-
        The standard infrastructure cancellation fee is cancellation_after_po_fee_pct percent of the order's quote total.
        The infrastructure cancellation fee is rounded half up to the cent once, on the final amount.
      params: [cancellation_after_po_fee_pct]
    prerequisite: []
    cross_category:
      - category: managed
        as: history
        reads: [status, variant_name, seat_count, go_live_date, managed_billing.event_type, managed_billing.posted_date]
        note: The ClearPath tier sets the tier rate, the covered seats the seat points, the go-live date the loyalty points and the late-fee ledger the late-payment points.
      - category: project
        as: branch
        reads: [status, variant_name]
        note: The largest class among in-progress project engagements sets the project points.
    inputs:
      history:
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 12, filters: {event_type: managed_late_fee}}
      cross_category: [managed, project]

  - id: hardware_ext_cancelled_deposit_credit
    base_policy_refs: [hardware_cancellation]
    overwrite:
      - base_policy: hardware_cancellation
        superseded_clause: >-
          any deposit paid is applied against that fee by an order credit with the excess refunded by the accounting
          team.
        replaced_by: >-
          For a Network Equipment Order or Server & Storage Build Order cancelled after its purchase order, and only for
          such an order, the order credit returning its paid deposit is figured as this paragraph states instead of the
          deposit being applied against the fee with the excess refunded; a Standard Endpoint Order's paid deposit is
          settled under the endpoint cancellation schedule, and on every other order cancelled after its purchase order
          any deposit paid is still applied against the cancellation fee by an order credit with the excess refunded by
          the accounting team.
    trigger: state_due
    subject: [hardware_order_credit]
    computes: credit_usd
    target_tool: post_deposit_credit_9245a342
    params:
      bench_free_days: 2
      bench_period_days: 14
      handling_full_months: 24
      handling_free_months: 48
      pm_minor_usd: 30.0
      pm_std_usd: 60.0
      goodwill_premier_usd: 100.0
      goodwill_core_usd: 50.0
    rule: >-
      This policy fixes the order credit that returns the paid deposit of a Network Equipment Order or Server & Storage
      Build Order cancelled after its purchase order; the credit is booked on the cancelled
      order against its deposit invoice, the cancellation fee stands against the credit balance it leaves, and what
      remains is refunded or carried by the accounting team.
      The deposit credit of a cancelled infrastructure order is fixed only after the order shows status cancelled and
      its ledger carries the cancellation fee charged on it.
      For a Network Equipment Order or Server & Storage Build Order cancelled after its purchase order, and only for
      such an order, the order credit returning its paid deposit is figured as this paragraph states instead of the
      deposit being applied against the fee with the excess refunded; a Standard Endpoint Order's paid deposit is
      settled under the endpoint cancellation schedule, and on every other order cancelled after its purchase order any
      deposit paid is still applied against the cancellation fee by an order credit with the excess refunded by the
      accounting team.
      The standard deposit credit of a cancelled infrastructure order returns the deposit paid less a bench retention of
      the order type's staging_fee_per_unit_usd for each unit ordered, the bench slot being booked when the purchase
      order is placed. The deposit paid is the sum of the payments on the order's ledger, counted up to the deposit
      invoiced. The deposit credit is rounded half up to the cent once, on the final amount.
      The adjustments below replace parts of that standard credit and are applied in one fixed order: the bench retention is settled first, every other adjustment is then applied to the deposit paid, and the credit is never less than zero.
      The bench retention of a deposit credit follows the calendar days from the order's purchase order date to its
      cancellation date, an order not yet cancelled counting none: for at most bench_free_days days the bench slot is
      released and nothing is retained; for more than bench_free_days and fewer than bench_period_days days the bench
      retention is the staging charge for the units ordered times those days divided by bench_period_days; for
      bench_period_days days or more the whole staging charge for the units ordered is retained.
      The handling retention of a deposit credit follows the client's ClearPath tenure, the whole months from the
      go-live date of its active ClearPath agreement to the credit day, a month completing only once the day of the
      month reaches the go-live date's day number: the order type's handling_fee_usd in full for fewer than
      handling_full_months months or with no active ClearPath agreement, half of it for at least handling_full_months and
      fewer than handling_free_months months, and nothing for at least handling_free_months months.
      The expedite retention of a deposit credit applies only to an order quoted with rush: the order type's
      rush_fee_usd when the purchase order is at least one day old on the credit day, half of it when the purchase order
      was placed that same day, and nothing for an order quoted without rush.
      The coordination retention of a deposit credit follows the client's in-progress project engagements, the largest
      class among them deciding: pm_std_usd when the client holds no in-progress engagement, pm_minor_usd when every
      in-progress engagement is classed Assessment Engagement or Quick Start Project, and nothing when any in-progress
      engagement is classed Standard Project, Advanced Project, Major Project or Strategic Program.
      A goodwill amount is added back to a deposit credit by the client's ClearPath tier: goodwill_premier_usd for an
      active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier, goodwill_core_usd for an active
      agreement on the ClearPath Standard or ClearPath Professional tier, and nothing for any other client.
    compute:
      - b_deposit_invoiced: "SUM('hardware_billing', 'amount_usd', event_type='hardware_deposit_invoice')"
      - b_deposit_paid: "MN(SUM('hardware_billing', 'amount_usd', event_type='hardware_payment'), b_deposit_invoiced)"
      - b_cancel_date: "F('cancelled_date')"
      - b_staging_charge: "P('staging_fee_per_unit_usd') * F('quantity')"
      - b_bench_days: "DAYS(F('order_placed_date'), F('cancelled_date')) if F('cancelled_date') else 0"
      - f_bench_basis: "1 if b_bench_days <= K('bench_free_days') else (2 if b_bench_days < K('bench_period_days') else 0)"
      - b_cr_go_live: "CFIELD('managed', 'go_live_date', status='active')"
      - b_cr_tenure: "MONTHS(b_cr_go_live, NOW) if b_cr_go_live else 0"
      - f_handling_ret: "P('handling_fee_usd') if b_cr_tenure < K('handling_full_months') else (P('handling_fee_usd') / 2 if b_cr_tenure < K('handling_free_months') else 0)"
      - b_cr_po_age: "DAYS(F('order_placed_date'), NOW)"
      - f_rush_ret: "P('rush_fee_usd') if (F('rush_requested') and b_cr_po_age >= 1) else (P('rush_fee_usd') / 2 if F('rush_requested') else 0)"
      - b_cr_major_project: "EXISTS('project', status='in_progress', variant_name='Standard Project') or EXISTS('project', status='in_progress', variant_name='Advanced Project') or EXISTS('project', status='in_progress', variant_name='Major Project') or EXISTS('project', status='in_progress', variant_name='Strategic Program')"
      - b_cr_any_project: "EXISTS('project', status='in_progress')"
      - f_coord_ret: "K('pm_std_usd') if not b_cr_any_project else (K('pm_minor_usd') if not b_cr_major_project else 0)"
      - b_cr_tier: "CFIELD('managed', 'variant_name', status='active')"
      - f_goodwill: "K('goodwill_premier_usd') if (b_cr_tier == 'ClearPath Premier' or b_cr_tier == 'ClearPath Enterprise') else (K('goodwill_core_usd') if (b_cr_tier == 'ClearPath Standard' or b_cr_tier == 'ClearPath Professional') else 0)"
      - result: "RND(MX(0, b_deposit_paid - (0 if f_bench_basis == 1 else (b_staging_charge * b_bench_days / K('bench_period_days') if f_bench_basis == 2 else b_staging_charge)) - f_handling_ret - f_rush_ret - f_coord_ret + f_goodwill), 2)"
    compute_basis:
      b_deposit_invoiced: "The deposit paid is the sum of the payments on the order's ledger, counted up to the deposit invoiced."
      b_deposit_paid: "The deposit paid is the sum of the payments on the order's ledger, counted up to the deposit invoiced."
      b_cancel_date: "The deposit credit of a cancelled infrastructure order is fixed only after the order shows status cancelled and its ledger carries the cancellation fee charged on it."
      b_staging_charge: "a bench retention of the order type's staging_fee_per_unit_usd for each unit ordered"
      b_bench_days: "The bench retention of a deposit credit follows the calendar days from the order's purchase order date to its cancellation date, an order not yet cancelled counting none"
      f_bench_basis: "for at most bench_free_days days the bench slot is released and nothing is retained; for more than bench_free_days and fewer than bench_period_days days the bench retention is the staging charge for the units ordered times those days divided by bench_period_days; for bench_period_days days or more the whole staging charge for the units ordered is retained."
      b_cr_go_live: "the whole months from the go-live date of its active ClearPath agreement to the credit day"
      b_cr_tenure: "a month completing only once the day of the month reaches the go-live date's day number"
      f_handling_ret: "the order type's handling_fee_usd in full for fewer than handling_full_months months or with no active ClearPath agreement, half of it for at least handling_full_months and fewer than handling_free_months months, and nothing for at least handling_free_months months."
      b_cr_po_age: "when the purchase order is at least one day old on the credit day"
      f_rush_ret: "The expedite retention of a deposit credit applies only to an order quoted with rush: the order type's rush_fee_usd when the purchase order is at least one day old on the credit day, half of it when the purchase order was placed that same day, and nothing for an order quoted without rush."
      b_cr_major_project: "nothing when any in-progress engagement is classed Standard Project, Advanced Project, Major Project or Strategic Program"
      b_cr_any_project: "pm_std_usd when the client holds no in-progress engagement"
      f_coord_ret: "The coordination retention of a deposit credit follows the client's in-progress project engagements, the largest class among them deciding: pm_std_usd when the client holds no in-progress engagement, pm_minor_usd when every in-progress engagement is classed Assessment Engagement or Quick Start Project, and nothing when any in-progress engagement is classed Standard Project, Advanced Project, Major Project or Strategic Program"
      b_cr_tier: "for an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier"
      f_goodwill: "A goodwill amount is added back to a deposit credit by the client's ClearPath tier: goodwill_premier_usd for an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier, goodwill_core_usd for an active agreement on the ClearPath Standard or ClearPath Professional tier, and nothing for any other client."
      result: "the bench retention is settled first, every other adjustment is then applied to the deposit paid, and the credit is never less than zero."
    factors:
      - id: bench_retention_basis
        effect: method
        decides: f_bench_basis
        bindings: [b_cancel_date, b_bench_days, f_bench_basis]
        ladder:
          - when: "at most bench_free_days days from the purchase order date to the cancellation date"
            method: "no bench retention"
          - when: "more than bench_free_days and fewer than bench_period_days days"
            method: "the staging charge for the units ordered times the days divided by bench_period_days"
          - when: "otherwise (bench_period_days days or more)"
            method: "the whole staging charge for the units ordered"
        baseline:
          f_bench_basis: "0"
        evidence: [date]
        cross_difficulty: null
      - id: tenure_handling_retention
        effect: parameter
        decides: f_handling_ret
        bindings: [b_cr_go_live, b_cr_tenure, f_handling_ret]
        ladder:
          - when: "fewer than handling_full_months whole months since the active ClearPath agreement's go-live date, or no active agreement"
            value: "P('handling_fee_usd')"
          - when: "at least handling_full_months and fewer than handling_free_months whole months"
            value: "half of P('handling_fee_usd')"
          - when: "otherwise (at least handling_free_months months)"
            value: "0"
        baseline:
          f_handling_ret: "0"
        evidence: [cross_category, date]
        cross_difficulty: managed
      - id: expedite_retention
        effect: parameter
        decides: f_rush_ret
        bindings: [b_cr_po_age, f_rush_ret]
        ladder:
          - when: "the order was quoted with rush and its purchase order is at least one day old on the credit day"
            value: "P('rush_fee_usd')"
          - when: "the order was quoted with rush and its purchase order was placed the same day"
            value: "half of P('rush_fee_usd')"
          - when: "otherwise (quoted without rush)"
            value: "0"
        baseline:
          f_rush_ret: "0"
        evidence: [date]
        cross_difficulty: null
      - id: project_coordination_retention
        effect: parameter
        decides: f_coord_ret
        bindings: [b_cr_major_project, b_cr_any_project, f_coord_ret]
        ladder:
          - when: "no in-progress project engagement"
            value: "K('pm_std_usd')"
          - when: "in-progress engagements, all classed Assessment Engagement or Quick Start Project"
            value: "K('pm_minor_usd')"
          - when: "otherwise (any in-progress engagement classed Standard Project or larger)"
            value: "0"
        baseline:
          f_coord_ret: "0"
        evidence: [cross_category]
        cross_difficulty: project
      - id: managed_goodwill_credit
        effect: parameter
        decides: f_goodwill
        bindings: [b_cr_tier, f_goodwill]
        ladder:
          - when: "an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier"
            value: "K('goodwill_premier_usd')"
          - when: "an active ClearPath agreement on the ClearPath Standard or ClearPath Professional tier"
            value: "K('goodwill_core_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          f_goodwill: "0"
        evidence: [cross_category]
        cross_difficulty: managed
    baseline:
      rule: >-
        The standard deposit credit of a cancelled infrastructure order returns the deposit paid less a bench retention of
        the order type's staging_fee_per_unit_usd for each unit ordered, the bench slot being booked when the purchase
        order is placed. The deposit paid is the sum of the payments on the order's ledger, counted up to the deposit
        invoiced. The deposit credit is rounded half up to the cent once, on the final amount.
      params: [staging_fee_per_unit_usd]
    prerequisite:
      - problem: hardware_ext_infrastructure_cancellation_fee
        kind: value_input
        gate: b_bench_days
        form: state
        policy_source: >-
          The deposit credit of a cancelled infrastructure order is fixed only after the order shows status cancelled and
          its ledger carries the cancellation fee charged on it.
        condition: >-
          The Network Equipment Order has status cancelled with cancellation_stage after_po and a cancelled_date, and its
          hardware billing ledger carries one hardware_cancellation_fee entry.
        resolved_by: sign_infrastructure_cancellation_1779b7d3
        effect: >-
          The cancellation date becomes the order's cancelled_date, so b_bench_days is the days from the purchase order
          date to the cancellation and the bench retention basis follows them; before it the order counts none and
          nothing is retained for the bench.
    cross_category:
      - category: managed
        as: branch
        reads: [status, variant_name, go_live_date]
        note: The ClearPath tier sets the goodwill amount and the active agreement's go-live date the handling retention.
      - category: project
        as: existence
        reads: [status, variant_name]
        note: The largest class among in-progress project engagements sets the coordination retention.
    inputs:
      history:
        - {table: hardware_billing, aggregate: sum, field: amount_usd, filters: {event_type: hardware_payment}}
        - {table: hardware_billing, aggregate: sum, field: amount_usd, filters: {event_type: hardware_deposit_invoice}}
      cross_category: [managed, project]

  - id: hardware_ext_lapsed_quote_reissue
    base_policy_refs: [hardware_quote_and_pricing, hardware_agg_multi_holding]
    overwrite:
      - base_policy: hardware_quote_and_pricing
        superseded_clause: >-
          The unit price is unit_cost_usd times one plus the effective markup, rounded half up to the cent; the effective
          markup is markup_pct, reduced by clearpath_markup_reduction_pts when on the quote date the client holds a
          ClearPath agreement whose status is active and whose tier rank is at least clearpath_min_rank.
        replaced_by: >-
          For a re-issue of a lapsed infrastructure quote, and only for such a re-issue, the unit is re-priced on the
          re-issue day at unit_cost_usd times one plus markup_pct less the re-issue markup reduction, rounded half up to the
          cent; a staged re-quote of a cancelled endpoint line follows the staged re-quote schedule, and every other quote's
          unit price stays unit_cost_usd times one plus the effective markup, rounded half up to the cent, the effective
          markup being markup_pct reduced by clearpath_markup_reduction_pts when on the quote date the client holds a
          ClearPath agreement whose status is active and whose tier rank is at least clearpath_min_rank.
      - base_policy: hardware_quote_and_pricing
        superseded_clause: >-
          The quote total is quantity times unit_price_usd, plus staging_fee_per_unit_usd times quantity, plus
          handling_fee_usd, plus rush_fee_usd when rush is requested where rush_available is true
        replaced_by: >-
          For a re-issue of a lapsed infrastructure quote, and only for such a re-issue, the quote total is figured as
          this paragraph states instead of quantity times unit_price_usd plus staging_fee_per_unit_usd times quantity plus
          handling_fee_usd plus rush_fee_usd; a staged re-quote of a cancelled endpoint line follows the staged re-quote
          schedule, and every other quote's total stays quantity times unit_price_usd, plus staging_fee_per_unit_usd
          times quantity, plus handling_fee_usd, plus rush_fee_usd when rush is requested where rush_available is true.
    trigger: on_request
    subject: [hardware_quote_issued]
    computes: quote_total_usd
    target_tool: reissue_lapsed_quote_93c9a091
    params:
      reduction_premier_pts: 5.0
      staging_project_usd: 95.0
      staging_managed_usd: 120.0
      reissue_handling_free_months: 48
      reissue_handling_mid_months: 24
      reissue_handling_mid_usd: 20.0
      reissue_rush_core_usd: 75.0
      free_lapse_days: 7
      late_lapse_days: 30
      reissue_pct: 1.5
      reissue_per_unit_usd: 60.0
    rule: >-
      This policy prices the re-issue of a client's Network Equipment Order or Server & Storage Build Order quote that
      has passed the last day of its validity period unsigned; the re-issue keeps the quote's number, part, quantity and
      distributor unit cost, re-prices the unit and re-dates the quote to the re-issue day so that a new validity period
      starts, and replaces its unit price and total. Only such a re-issue of a lapsed infrastructure quote is priced here.
      For a re-issue of a lapsed infrastructure quote, and only for such a re-issue, the unit is re-priced on the
      re-issue day at unit_cost_usd times one plus markup_pct less the re-issue markup reduction, rounded half up to the
      cent; a staged re-quote of a cancelled endpoint line follows the staged re-quote schedule, and every other quote's
      unit price stays unit_cost_usd times one plus the effective markup, rounded half up to the cent, the effective
      markup being markup_pct reduced by clearpath_markup_reduction_pts when on the quote date the client holds a
      ClearPath agreement whose status is active and whose tier rank is at least clearpath_min_rank.
      For a re-issue of a lapsed infrastructure quote, and only for such a re-issue, the quote total is figured as this
      paragraph states instead of quantity times unit_price_usd plus staging_fee_per_unit_usd times quantity plus
      handling_fee_usd plus rush_fee_usd; a staged re-quote of a cancelled endpoint line follows the staged re-quote
      schedule, and every other quote's total stays quantity times unit_price_usd, plus staging_fee_per_unit_usd times
      quantity, plus handling_fee_usd, plus rush_fee_usd when rush is requested where rush_available is true.
      The standard re-issue total is the quote's units times the unit re-priced at unit_cost_usd times one plus
      markup_pct, plus the order type's staging_fee_per_unit_usd for each unit, plus its handling_fee_usd, plus its
      rush_fee_usd when the quote carries rush, with no re-issue charge. The re-issued unit price is rounded half up to
      the cent, and the re-issue total is rounded half up to the cent once, on the final amount.
      The adjustments below replace parts of that standard total and are applied in one fixed order: the unit is
      re-priced first, every charge is then figured, and the units at the re-priced unit and the charges are summed last.
      The re-issue markup reduction comes off markup_pct by the client's ClearPath tier on the re-issue day:
      reduction_premier_pts points for an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise
      tier, the order type's clearpath_markup_reduction_pts points for an active agreement on the ClearPath Standard or
      ClearPath Professional tier, and none for any other client.
      The bench staging charge per unit of a re-issued infrastructure quote is staging_project_usd when the client's
      active ClearPath agreement covers firewall, switch and wireless configuration changes and the client holds an
      in-progress project engagement, staging_managed_usd when it holds
      such an active ClearPath agreement and no in-progress project engagement, and the order type's
      staging_fee_per_unit_usd for every other client.
      The re-issue handling charge follows the client's ClearPath tenure, the whole months from the go-live date of its
      active ClearPath agreement to the re-issue day, a month completing only once the day of the month reaches the
      go-live date's day number: nothing for at least reissue_handling_free_months months, reissue_handling_mid_usd for
      at least reissue_handling_mid_months and fewer than reissue_handling_free_months months, and the order type's
      handling_fee_usd for fewer months or with no active ClearPath agreement.
      The re-issue rush charge, owed only when the quote carries rush, is nothing for a client whose active ClearPath
      agreement assigns it a named technical account manager, who books the rush allocation with the distributor
      directly, reissue_rush_core_usd when that active agreement assigns it a named client success manager and no
      technical account manager, and the order type's rush_fee_usd for every other client.
      The re-issue charge follows the calendar days from the last day of the quote's validity period, quote_date plus
      quote_validity_days, to the re-issue day: for more than late_lapse_days days the distributor requalifies the units
      and the charge is reissue_per_unit_usd for each unit; for more than free_lapse_days and at most late_lapse_days days
      the distributor re-validates its price and the charge is reissue_pct percent of the units times unit_cost_usd; for
      at most free_lapse_days days there is no re-issue charge.
    compute:
      - b_ri_tier: "CFIELD('managed', 'variant_name', status='active')"
      - f_ri_reduction: "K('reduction_premier_pts') if (b_ri_tier == 'ClearPath Premier' or b_ri_tier == 'ClearPath Enterprise') else (P('clearpath_markup_reduction_pts') if (b_ri_tier == 'ClearPath Standard' or b_ri_tier == 'ClearPath Professional') else 0)"
      - b_ri_network_mgmt: "CPARAM('managed', 'network_device_management_included', status='active')"
      - b_ri_project: "EXISTS('project', status='in_progress')"
      - f_ri_staging: "K('staging_project_usd') if (b_ri_network_mgmt and b_ri_project) else (K('staging_managed_usd') if (b_ri_network_mgmt and not b_ri_project) else P('staging_fee_per_unit_usd'))"
      - b_ri_go_live: "CFIELD('managed', 'go_live_date', status='active')"
      - b_ri_tenure: "MONTHS(b_ri_go_live, NOW) if b_ri_go_live else 0"
      - f_ri_handling: "0 if b_ri_tenure >= K('reissue_handling_free_months') else (K('reissue_handling_mid_usd') if b_ri_tenure >= K('reissue_handling_mid_months') else P('handling_fee_usd'))"
      - b_ri_tam: "CPARAM('managed', 'technical_account_manager', status='active')"
      - b_ri_csm: "CPARAM('managed', 'dedicated_account_manager', status='active')"
      - f_ri_rush: "0 if b_ri_tam else (K('reissue_rush_core_usd') if b_ri_csm else P('rush_fee_usd'))"
      - b_ri_lapse_days: "DAYS(F('quote_date'), NOW) - P('quote_validity_days')"
      - f_ri_charge_basis: "2 if b_ri_lapse_days > K('late_lapse_days') else (1 if b_ri_lapse_days > K('free_lapse_days') else 0)"
      - b_rush_quoted: "F('rush_requested')"
      - b_units: "F('quantity')"
      - b_unit_cost: "F('unit_cost_usd')"
      - result: "RND(b_units * RND(b_unit_cost * (1 + (P('markup_pct') - f_ri_reduction) / 100), 2) + b_units * f_ri_staging + f_ri_handling + (f_ri_rush if b_rush_quoted else 0) + (K('reissue_per_unit_usd') * b_units if f_ri_charge_basis == 2 else (K('reissue_pct') / 100 * b_units * b_unit_cost if f_ri_charge_basis == 1 else 0)), 2)"
    compute_basis:
      b_ri_tier: "The re-issue markup reduction comes off markup_pct by the client's ClearPath tier on the re-issue day"
      f_ri_reduction: "reduction_premier_pts points for an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier, the order type's clearpath_markup_reduction_pts points for an active agreement on the ClearPath Standard or ClearPath Professional tier, and none for any other client."
      b_ri_network_mgmt: "active ClearPath agreement covers firewall, switch and wireless configuration changes"
      b_ri_project: "and the client holds an in-progress project engagement"
      f_ri_staging: "The bench staging charge per unit of a re-issued infrastructure quote is staging_project_usd when the client's active ClearPath agreement covers firewall, switch and wireless configuration changes and the client holds an in-progress project engagement, staging_managed_usd when it holds such an active ClearPath agreement and no in-progress project engagement, and the order type's staging_fee_per_unit_usd for every other client."
      b_ri_go_live: "the whole months from the go-live date of its active ClearPath agreement to the re-issue day"
      b_ri_tenure: "a month completing only once the day of the month reaches the go-live date's day number"
      f_ri_handling: "nothing for at least reissue_handling_free_months months, reissue_handling_mid_usd for at least reissue_handling_mid_months and fewer than reissue_handling_free_months months, and the order type's handling_fee_usd for fewer months or with no active ClearPath agreement."
      b_ri_tam: "nothing for a client whose active ClearPath agreement assigns it a named technical account manager"
      b_ri_csm: "reissue_rush_core_usd when that active agreement assigns it a named client success manager and no technical account manager"
      f_ri_rush: "The re-issue rush charge, owed only when the quote carries rush, is nothing for a client whose active ClearPath agreement assigns it a named technical account manager, who books the rush allocation with the distributor directly, reissue_rush_core_usd when that active agreement assigns it a named client success manager and no technical account manager, and the order type's rush_fee_usd for every other client."
      b_ri_lapse_days: "The re-issue charge follows the calendar days from the last day of the quote's validity period, quote_date plus quote_validity_days, to the re-issue day"
      f_ri_charge_basis: "for more than late_lapse_days days the distributor requalifies the units and the charge is reissue_per_unit_usd for each unit; for more than free_lapse_days and at most late_lapse_days days the distributor re-validates its price and the charge is reissue_pct percent of the units times unit_cost_usd; for at most free_lapse_days days there is no re-issue charge."
      b_rush_quoted: "owed only when the quote carries rush"
      b_unit_cost: "the unit is re-priced on the re-issue day at unit_cost_usd times one plus markup_pct less the re-issue markup reduction, rounded half up to the cent"
      result: "the unit is re-priced first, every charge is then figured, and the units at the re-priced unit and the charges are summed last."
    factors:
      - id: reissue_markup_reduction
        effect: parameter
        decides: f_ri_reduction
        bindings: [b_ri_tier, f_ri_reduction]
        ladder:
          - when: "an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier"
            value: "K('reduction_premier_pts')"
          - when: "an active ClearPath agreement on the ClearPath Standard or ClearPath Professional tier"
            value: "P('clearpath_markup_reduction_pts')"
          - when: "otherwise"
            value: "0"
        baseline:
          f_ri_reduction: "0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: managed_bench_staging_rate
        effect: parameter
        decides: f_ri_staging
        bindings: [b_ri_network_mgmt, b_ri_project, f_ri_staging]
        ladder:
          - when: "an active ClearPath agreement covering firewall, switch and wireless configuration changes and an in-progress project engagement"
            value: "K('staging_project_usd')"
          - when: "such an active ClearPath agreement and no in-progress project engagement"
            value: "K('staging_managed_usd')"
          - when: "otherwise"
            value: "P('staging_fee_per_unit_usd')"
        baseline:
          f_ri_staging: "P('staging_fee_per_unit_usd')"
        evidence: [cross_category]
        cross_difficulty: project
      - id: reissue_tenure_handling
        effect: parameter
        decides: f_ri_handling
        bindings: [b_ri_go_live, b_ri_tenure, f_ri_handling]
        ladder:
          - when: "at least reissue_handling_free_months whole months since the active ClearPath agreement's go-live date"
            value: "0"
          - when: "at least reissue_handling_mid_months and fewer than reissue_handling_free_months whole months"
            value: "K('reissue_handling_mid_usd')"
          - when: "otherwise (fewer months, or no active ClearPath agreement)"
            value: "P('handling_fee_usd')"
        baseline:
          f_ri_handling: "P('handling_fee_usd')"
        evidence: [cross_category, date]
        cross_difficulty: managed
      - id: reissue_account_rush
        effect: parameter
        decides: f_ri_rush
        bindings: [b_ri_tam, b_ri_csm, f_ri_rush]
        ladder:
          - when: "an active ClearPath agreement that assigns a named technical account manager"
            value: "0"
          - when: "an active ClearPath agreement that assigns a named client success manager and no technical account manager"
            value: "K('reissue_rush_core_usd')"
          - when: "otherwise"
            value: "P('rush_fee_usd')"
        baseline:
          f_ri_rush: "P('rush_fee_usd')"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: lapse_charge_basis
        effect: method
        decides: f_ri_charge_basis
        bindings: [b_ri_lapse_days, f_ri_charge_basis]
        ladder:
          - when: "more than late_lapse_days days after the last day of the validity period"
            method: "reissue_per_unit_usd for each unit (the distributor requalifies the units)"
          - when: "more than free_lapse_days and at most late_lapse_days days after it"
            method: "reissue_pct percent of the units times unit_cost_usd (the distributor re-validates its price)"
          - when: "otherwise (at most free_lapse_days days)"
            method: "no re-issue charge"
        baseline:
          f_ri_charge_basis: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard re-issue total is the quote's units times the unit re-priced at unit_cost_usd times one plus
        markup_pct, plus the order type's staging_fee_per_unit_usd for each unit, plus its handling_fee_usd, plus its
        rush_fee_usd when the quote carries rush, with no re-issue charge. The re-issued unit price is rounded half up to
        the cent, and the re-issue total is rounded half up to the cent once, on the final amount.
      params: [markup_pct, staging_fee_per_unit_usd, handling_fee_usd, rush_fee_usd]
    prerequisite: []
    cross_category:
      - category: managed
        as: branch
        reads: [status, variant_name, go_live_date, network_device_management_included, technical_account_manager, dedicated_account_manager]
        note: The ClearPath tier sets the markup reduction; the agreement's network-device coverage (with an in-progress project) sets the staging charge; its named technical account manager or client success manager sets the rush charge; the go-live date sets the handling charge.
      - category: project
        as: existence
        reads: [status]
        note: An in-progress project engagement, with an active ClearPath agreement covering network device configuration, sets the staging charge.
    inputs:
      history: []
      cross_category: [managed, project]

  - id: hardware_ext_infrastructure_approval_deposit
    base_policy_refs: [hardware_approval_and_purchase_order, hardware_agg_credit_exposure, hardware_client_signed_requests, hardware_quote_and_pricing]
    overwrite:
      - base_policy: hardware_approval_and_purchase_order
        superseded_clause: >-
          On approval a required deposit of deposit_pct percent of the quote total is invoiced, rounded half up to the
          cent, due on receipt (deposit_due).
        replaced_by: >-
          For a Network Equipment Order or Server & Storage Build Order approved within the client's credit limit, and
          only for such an order, the required deposit is figured as this paragraph states instead of deposit_pct percent
          of the quote total; it is still invoiced on approval, rounded half up to the cent and due on receipt
          (deposit_due); a Standard Endpoint Order or Staged Endpoint Order approved within the client's credit limit follows the endpoint deposit schedule; and every other order, including any order whose approval would take the client over its credit limit, keeps the deposit of the base rule: a required deposit of deposit_pct percent of the quote total, or 100 percent of the quote total whatever deposit_pct and deposit_threshold_usd say when the approval would take the client over its credit limit, invoiced on approval, rounded half up to the cent and due on receipt (deposit_due).
    trigger: on_request
    subject: [hardware_quote_approved, hardware_deposit_invoice]
    computes: deposit_usd
    target_tool: sign_build_approval_1b1ae884
    params:
      share_premier_pct: 35.0
      share_core_pct: 40.0
      arrears_two_pts: 10.0
      arrears_one_pts: 5.0
      spend_high_pts: 5.0
      spend_mid_pts: 2.0
      spend_high_ratio: 0.5
      spend_mid_ratio: 0.25
      project_major_pts: 5.0
      project_minor_pts: 2.0
      seat_large: 25
      seat_mid: 10
      seat_large_pts: 3.0
      seat_mid_pts: 1.0
      build_new_months: 48
    rule: >-
      This policy fixes the deposit invoiced when the authorized contact e-signs a Network Equipment Order or Server &
      Storage Build Order quote whose approval keeps the client within its hardware credit limit; the signature records
      the approval and the deposit invoice together. A quote whose approval would take the client over its credit limit
      is prepaid under the credit-exposure rule and is not priced here.
      The deposit of an infrastructure approval is fixed only after the quote being signed carries a quote date that
      keeps it within its validity period on the approval day.
      An infrastructure approval that takes over an ordered infrastructure order of the client is not recorded until the
      order it takes over carries an order credit returning its paid deposit.
      For a Network Equipment Order or Server & Storage Build Order approved within the client's credit limit, and only
      for such an order, the required deposit is figured as this paragraph states instead of deposit_pct percent of the
      quote total; it is still invoiced on approval, rounded half up to the cent and due on receipt (deposit_due); a
      Standard Endpoint Order or Staged Endpoint Order approved within the client's credit limit follows the endpoint deposit schedule; and every other order, including any order whose approval would take the client over its credit limit, keeps the deposit of the base rule: a required deposit of deposit_pct percent of the quote total, or 100 percent of the quote total whatever deposit_pct and deposit_threshold_usd say when the approval would take the client over its credit limit, invoiced on approval, rounded half up to the cent and due on receipt (deposit_due).
      A deposit is required on an infrastructure approval when the quote total is at least deposit_threshold_usd, and the
      standard infrastructure deposit is then deposit_pct percent of the quote total. The infrastructure deposit is
      rounded half up to the cent once, on the final amount.
      The adjustments below replace parts of that standard deposit and are applied in one fixed order: the deposit percentage is settled first; the way the deposit is built from that percentage and the quote comes last.
      The infrastructure deposit share is share_premier_pct percent for a client whose active ClearPath agreement is on
      the ClearPath Premier or ClearPath Enterprise tier, share_core_pct percent for a client whose active ClearPath
      agreement is on the ClearPath Standard or ClearPath Professional tier, and deposit_pct percent for every other
      client.
      Late-payment points are added to the infrastructure deposit percentage from the ClearPath late fees posted on the
      client's ClearPath billing fewer than twelve whole months before the approval day: arrears_two_pts points for two
      or more such late fees, arrears_one_pts points for exactly one, and none when there is none.
      Managed-spend relief points come off the infrastructure deposit percentage by the client's monthly ClearPath seat billing, the amount of the latest ClearPath monthly fee posted on its ClearPath billing while it holds an active ClearPath agreement, measured against the quote total: spend_high_pts points when that monthly billing is at least spend_high_ratio times the quote total, spend_mid_pts points when it is at least spend_mid_ratio times the quote total and less than spend_high_ratio times it, and none for a lower monthly billing or no active ClearPath agreement.
      Project relief points come off the infrastructure deposit percentage when the client holds one or more project engagements whose status is in_progress, the largest class among them deciding: project_major_pts points when any of them is classed Standard Project, Advanced Project, Major Project or Strategic Program, project_minor_pts points when every one of them is of a smaller class, and none without an in-progress engagement.
      Seat relief points come off the infrastructure deposit percentage by the seats currently covered on the client's
      active ClearPath agreement: seat_large_pts points for at least seat_large seats, seat_mid_pts points for at least
      seat_mid and fewer than seat_large seats, and none for fewer seats or no active ClearPath agreement.
      The infrastructure deposit is built by the client's ClearPath relationship: a client with no active ClearPath
      agreement pays a deposit equal to the distributor cost of the units, unit_cost_usd times the quantity, whatever the
      percentage; a client whose active ClearPath agreement went live fewer than build_new_months whole months before
      the approval day pays the order's service charges, the quote total less the quantity times the unit price, in full
      plus the deposit percentage of the quantity times the unit price; every other client pays the deposit percentage
      of the quote total. Whole months are counted from the go-live date, a month completing only once the day of the
      month reaches the go-live date's day number.
    compute:
      - b_quote_total: "F('quote_total_usd')"
      - b_units: "F('quantity')"
      - b_unit_price: "F('unit_price_usd')"
      - b_unit_cost: "F('unit_cost_usd')"
      - b_deposit_required: "1 if b_quote_total >= P('deposit_threshold_usd') else 0"
      - b_nd_tier: "CFIELD('managed', 'variant_name', status='active')"
      - f_nd_share: "K('share_premier_pct') if (b_nd_tier == 'ClearPath Premier' or b_nd_tier == 'ClearPath Enterprise') else (K('share_core_pct') if (b_nd_tier == 'ClearPath Standard' or b_nd_tier == 'ClearPath Professional') else P('deposit_pct'))"
      - b_nd_late_fees: "XCOUNT('managed', 'managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')"
      - f_nd_arrears_pts: "K('arrears_two_pts') if b_nd_late_fees >= 2 else (K('arrears_one_pts') if b_nd_late_fees == 1 else 0)"
      - b_nd_cp_active: "EXISTS('managed', status='active')"
      - b_nd_monthly: "(XLATEST('managed', 'managed_billing', 'amount_usd', date_field='posted_date', event_type='managed_monthly_fee') or 0) if b_nd_cp_active else 0"
      - f_nd_relief_pts: "K('spend_high_pts') if b_nd_monthly >= K('spend_high_ratio') * F('quote_total_usd') else (K('spend_mid_pts') if b_nd_monthly >= K('spend_mid_ratio') * F('quote_total_usd') else 0)"
      - b_nd_major_project: "EXISTS('project', status='in_progress', variant_name='Standard Project') or EXISTS('project', status='in_progress', variant_name='Advanced Project') or EXISTS('project', status='in_progress', variant_name='Major Project') or EXISTS('project', status='in_progress', variant_name='Strategic Program')"
      - b_nd_any_project: "EXISTS('project', status='in_progress')"
      - f_nd_project_pts: "K('project_major_pts') if b_nd_major_project else (K('project_minor_pts') if b_nd_any_project else 0)"
      - b_nd_seats: "CFIELD('managed', 'seat_count', status='active') or 0"
      - f_nd_seat_pts: "K('seat_large_pts') if b_nd_seats >= K('seat_large') else (K('seat_mid_pts') if b_nd_seats >= K('seat_mid') else 0)"
      - b_nd_go_live: "CFIELD('managed', 'go_live_date', status='active')"
      - b_nd_tenure: "MONTHS(b_nd_go_live, NOW) if b_nd_go_live else 0"
      - f_nd_build: "2 if not b_nd_go_live else (1 if b_nd_tenure < K('build_new_months') else 0)"
      - result: "RND(0 if b_deposit_required == 0 else (b_unit_cost * b_units if f_nd_build == 2 else (((b_quote_total - b_units * b_unit_price) + (f_nd_share + f_nd_arrears_pts - f_nd_relief_pts - f_nd_project_pts - f_nd_seat_pts) / 100 * b_units * b_unit_price) if f_nd_build == 1 else (f_nd_share + f_nd_arrears_pts - f_nd_relief_pts - f_nd_project_pts - f_nd_seat_pts) / 100 * b_quote_total)), 2)"
    compute_basis:
      b_quote_total: "The deposit of an infrastructure approval is fixed only after the quote being signed carries a quote date that keeps it within its validity period on the approval day."
      b_deposit_required: "A deposit is required on an infrastructure approval when the quote total is at least deposit_threshold_usd, and the standard infrastructure deposit is then deposit_pct percent of the quote total."
      b_nd_tier: "for a client whose active ClearPath agreement is on the ClearPath Premier or ClearPath Enterprise tier"
      f_nd_share: "The infrastructure deposit share is share_premier_pct percent for a client whose active ClearPath agreement is on the ClearPath Premier or ClearPath Enterprise tier, share_core_pct percent for a client whose active ClearPath agreement is on the ClearPath Standard or ClearPath Professional tier, and deposit_pct percent for every other client."
      b_nd_late_fees: "Late-payment points are added to the infrastructure deposit percentage from the ClearPath late fees posted on the client's ClearPath billing fewer than twelve whole months before the approval day"
      f_nd_arrears_pts: "arrears_two_pts points for two or more such late fees, arrears_one_pts points for exactly one, and none when there is none."
      b_nd_cp_active: "while it holds an active ClearPath agreement"
      b_nd_monthly: "by the client's monthly ClearPath seat billing, the amount of the latest ClearPath monthly fee posted on its ClearPath billing while it holds an active ClearPath agreement, measured against the quote total"
      f_nd_relief_pts: "spend_high_pts points when that monthly billing is at least spend_high_ratio times the quote total, spend_mid_pts points when it is at least spend_mid_ratio times the quote total and less than spend_high_ratio times it, and none for a lower monthly billing or no active ClearPath agreement."
      b_nd_major_project: "project_major_pts points when any of them is classed Standard Project, Advanced Project, Major Project or Strategic Program"
      b_nd_any_project: "when the client holds one or more project engagements whose status is in_progress, the largest class among them deciding"
      f_nd_project_pts: "project_major_pts points when any of them is classed Standard Project, Advanced Project, Major Project or Strategic Program, project_minor_pts points when every one of them is of a smaller class, and none without an in-progress engagement."
      b_nd_seats: "Seat relief points come off the infrastructure deposit percentage by the seats currently covered on the client's active ClearPath agreement"
      f_nd_seat_pts: "seat_large_pts points for at least seat_large seats, seat_mid_pts points for at least seat_mid and fewer than seat_large seats, and none for fewer seats or no active ClearPath agreement."
      b_nd_go_live: "a client whose active ClearPath agreement went live fewer than build_new_months whole months before the approval day"
      b_nd_tenure: "Whole months are counted from the go-live date, a month completing only once the day of the month reaches the go-live date's day number."
      f_nd_build: "a client with no active ClearPath agreement pays a deposit equal to the distributor cost of the units, unit_cost_usd times the quantity, whatever the percentage; a client whose active ClearPath agreement went live fewer than build_new_months whole months before the approval day pays the order's service charges, the quote total less the quantity times the unit price, in full plus the deposit percentage of the quantity times the unit price; every other client pays the deposit percentage of the quote total."
      result: "the deposit percentage is settled first; the way the deposit is built from that percentage and the quote comes last."
    factors:
      - id: infra_deposit_share
        effect: parameter
        decides: f_nd_share
        bindings: [b_nd_tier, f_nd_share]
        ladder:
          - when: "an active ClearPath agreement on the ClearPath Premier or ClearPath Enterprise tier"
            value: "K('share_premier_pct')"
          - when: "an active ClearPath agreement on the ClearPath Standard or ClearPath Professional tier"
            value: "K('share_core_pct')"
          - when: "otherwise"
            value: "P('deposit_pct')"
        baseline:
          f_nd_share: "P('deposit_pct')"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: infra_arrears_points
        effect: parameter
        decides: f_nd_arrears_pts
        bindings: [b_nd_late_fees, f_nd_arrears_pts]
        ladder:
          - when: "two or more ClearPath late fees posted fewer than twelve whole months before the approval day"
            value: "K('arrears_two_pts')"
          - when: "exactly one such ClearPath late fee"
            value: "K('arrears_one_pts')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          f_nd_arrears_pts: "0"
        evidence: [cross_category, history]
        cross_difficulty: managed
      - id: infra_spend_relief
        effect: parameter
        decides: f_nd_relief_pts
        bindings: [b_nd_cp_active, b_nd_monthly, f_nd_relief_pts]
        ladder:
          - when: "monthly ClearPath seat billing at least spend_high_ratio times the quote total"
            value: "K('spend_high_pts')"
          - when: "at least spend_mid_ratio and less than spend_high_ratio times the quote total"
            value: "K('spend_mid_pts')"
          - when: "otherwise (lower, or no active ClearPath agreement)"
            value: "0"
        baseline:
          f_nd_relief_pts: "0"
        evidence: [cross_category, history]
        cross_difficulty: managed
      - id: infra_project_relief
        effect: parameter
        decides: f_nd_project_pts
        bindings: [b_nd_major_project, b_nd_any_project, f_nd_project_pts]
        ladder:
          - when: "any in-progress project engagement classed Standard Project, Advanced Project, Major Project or Strategic Program"
            value: "K('project_major_pts')"
          - when: "in-progress engagements, all of a smaller class"
            value: "K('project_minor_pts')"
          - when: "otherwise (no in-progress engagement)"
            value: "0"
        baseline:
          f_nd_project_pts: "0"
        evidence: [cross_category]
        cross_difficulty: project
      - id: infra_seat_relief
        effect: parameter
        decides: f_nd_seat_pts
        bindings: [b_nd_seats, f_nd_seat_pts]
        ladder:
          - when: "at least seat_large seats covered on the active ClearPath agreement"
            value: "K('seat_large_pts')"
          - when: "at least seat_mid and fewer than seat_large seats"
            value: "K('seat_mid_pts')"
          - when: "otherwise"
            value: "0"
        baseline:
          f_nd_seat_pts: "0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: infra_relationship_build
        effect: method
        decides: f_nd_build
        bindings: [b_nd_go_live, b_nd_tenure, f_nd_build]
        ladder:
          - when: "no active ClearPath agreement"
            method: "the distributor cost of the units, unit_cost_usd times the quantity"
          - when: "an active ClearPath agreement that went live fewer than build_new_months whole months before the approval day"
            method: "the service charges (quote total less quantity times unit price) in full plus the deposit percentage of quantity times unit price"
          - when: "otherwise"
            method: "the deposit percentage of the quote total"
        baseline:
          f_nd_build: "0"
        evidence: [cross_category, date]
        cross_difficulty: managed
    baseline:
      rule: >-
        A deposit is required on an infrastructure approval when the quote total is at least deposit_threshold_usd, and the
        standard infrastructure deposit is then deposit_pct percent of the quote total. The infrastructure deposit is
        rounded half up to the cent once, on the final amount.
      params: [deposit_pct, deposit_threshold_usd]
    prerequisite:
      - problem: hardware_ext_lapsed_quote_reissue
        kind: value_input
        gate: b_quote_total
        form: state
        policy_source: >-
          The deposit of an infrastructure approval is fixed only after the quote being signed carries a quote date that
          keeps it within its validity period on the approval day.
        condition: >-
          The quoted Network Equipment Order being approved has a quote_date no more than quote_validity_days calendar
          days before the approval day, carrying the re-issued quote_total_usd.
        resolved_by: reissue_lapsed_quote_93c9a091
        effect: >-
          The re-issue re-dates the quote to the re-issue day and replaces its quote_total_usd, so b_quote_total (and the
          service charges it implies) is the re-issued total the deposit is built on.
      - problem: hardware_ext_cancelled_deposit_credit
        kind: state_gate
        gate: hardware_billing.event_type
        form: state
        policy_source: >-
          An infrastructure approval that takes over an ordered infrastructure order of the client is not recorded until
          the order it takes over carries an order credit returning its paid deposit.
        condition: >-
          The cancelled Network Equipment Order whose line the approval takes over carries a hardware_order_credit entry
          on its billing ledger.
        resolved_by: post_deposit_credit_9245a342
        effect: >-
          Once the replaced order carries its order credit, the client holds no live paid deposit on the order being
          replaced and the approval with its own deposit invoice may be recorded.
    cross_category:
      - category: managed
        as: history
        reads: [status, variant_name, seat_count, go_live_date, managed_billing.event_type, managed_billing.posted_date, managed_billing.amount_usd]
        note: The ClearPath tier sets the share, the late-fee ledger the late-payment points, the covered seats the seat relief, the latest monthly fee on the ClearPath billing the managed-spend relief and the go-live date the build.
      - category: project
        as: branch
        reads: [status, variant_name]
        note: The largest class among in-progress project engagements sets the project relief points.
    inputs:
      history:
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 12, filters: {event_type: managed_late_fee}}
        - {category: managed, table: managed_billing, aggregate: latest, field: amount_usd, filters: {event_type: managed_monthly_fee}}
      cross_category: [managed, project]
