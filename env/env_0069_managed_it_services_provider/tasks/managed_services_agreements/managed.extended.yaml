  - late_fees_window: COUNT('managed_billing', within_months=K('rate_window_months'), date_field='posted_date', event_type='managed_late_fee')
  - payments_window: COUNT('managed_billing', within_months=K('rate_window_months'), date_field='posted_date', event_type='managed_payment')
