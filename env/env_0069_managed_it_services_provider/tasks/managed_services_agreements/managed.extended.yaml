  rule: 'For the onsite business-hours labor of the agreement''s most recently resolved ticket whose labor class is onsite
    business-hours and whose labor route is invoice, when that visit is wholly billable (no included onsite minutes of its
    month remain for it) on a tier whose onsite_trip_charge_usd is above zero, and only for that visit, the labor amount
