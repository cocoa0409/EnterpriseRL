- id: managed_ext_essentials_upgrade_rate
  base_policy_refs:
  - managed_tier_change
  - managed_client_signed_changes
  overwrite:
  - base_policy: managed_tier_change
    superseded_clause: The new seat_rate_usd is the new tier's seat_rate_list_usd reduced by the new tier's term_discount_pct
      for the current term_months, rounded half up to the cent; when the new tier does not offer the current term length,
      the discount of the longest term it offers that does not exceed the current term applies, or none if there is no such
      term.
    replaced_by: 'For an upgrade from ClearPath Essentials to ClearPath Standard, and only for that upgrade, the new seat_rate_usd
      is set by the Essentials upgrade schedule of this paragraph; every other tier change remains under the base rule:
      the new seat_rate_usd is the new tier''s seat_rate_list_usd reduced by the new tier''s term_discount_pct for the current
      term_months, rounded half up to the cent, and when the new tier does not offer the current term length, the discount
      of the longest term it offers that does not exceed the current term applies, or none if there is no such term.'
  - base_policy: managed_client_signed_changes
    superseded_clause: The service desk registers each as a service request carrying the request type, the target tier for
      a tier change, and the effective date computed under this charter, pending the client's signature; it never applies
      the change itself.
    replaced_by: 'For an upgrade from ClearPath Essentials to ClearPath Standard that the authorized contact e-signs during
      a verified call, and only for that upgrade, no pending request is registered: the signed amendment itself records
      the tier change on the agreement; every other contract change, an early termination notice included, is registered
      by the service desk as a service request carrying the request type, the target tier for a tier change, and the effective
      date computed under this charter, pending the client''s signature, and is never applied by the service desk itself.'
  trigger: on_request
  subject:
  - managed_tier_changed
  computes: seat_rate_usd
  target_tool: sign_tier_upgrade_933f385b
  params:
    standard_list_rate_usd: 124.0
    standard_discount_12_pct: 0.0
    standard_discount_24_pct: 2.0
    standard_discount_36_pct: 4.0
    phase_tenure_months: 24
    phase_share_pct: 50
    volume_large_seats: 50
    volume_mid_seats: 25
    volume_large_pct: 4.0
    volume_mid_pct: 2.0
    commitment_long_months: 12
    commitment_mid_months: 6
    commitment_long_pct: 2.0
    commitment_mid_pct: 1.0
    standing_window_months: 12
    standing_clean_pct: 2.0
    standing_single_pct: 1.0
    training_full_simulations: 12
    training_full_pct: 3.0
    training_partial_pct: 1.5
    conversion_window_months: 3
    conversion_high_pct: 3.0
    conversion_mid_pct: 1.5
    conversion_high_share_pct: 25
    conversion_mid_share_pct: 10
    renewal_upgrade_cap_pct: 3.0
  rule: 'For an upgrade from ClearPath Essentials to ClearPath Standard, and only for that upgrade, the new seat_rate_usd
    is set by the Essentials upgrade schedule of this paragraph; every other tier change remains under the base rule: the
    new seat_rate_usd is the new tier''s seat_rate_list_usd reduced by the new tier''s term_discount_pct for the current
    term_months, rounded half up to the cent, and when the new tier does not offer the current term length, the discount
    of the longest term it offers that does not exceed the current term applies, or none if there is no such term. For an
    upgrade from ClearPath Essentials to ClearPath Standard that the authorized contact e-signs during a verified call,
    and only for that upgrade, no pending request is registered: the signed amendment itself records the tier change on
    the agreement; every other contract change, an early termination notice included, is registered by the service desk
    as a service request carrying the request type, the target tier for a tier change, and the effective date computed under
    this charter, pending the client''s signature, and is never applied by the service desk itself. The upgrade takes effect
    on the first day of the calendar month after the signature, and the amendment carries the new tier, the new seat_rate_usd
    and that effective date. The upgraded seat rate is fixed only after the ledger carries the late fee owed on the first
    day of the current month for every invoice then past its grace period. The upgraded seat rate is not fixed until the
    ledger carries the remote after-hours labor charge of every ticket resolved before the current month whose remote after-hours
    labor is settled by invoice. The upgraded seat rate is fixed only after the ledger carries the onsite visit charge of
    every ticket resolved before the current month whose onsite visit labor is settled by invoice. The standard upgraded
    rate is the ClearPath Standard list rate, standard_list_rate_usd, reduced by the ClearPath Standard term discount for
    the current term_months (standard_discount_12_pct, standard_discount_24_pct or standard_discount_36_pct for a 12-, 24-
    or 36-month term), rounded half up to the cent. How the upgraded rate is built follows the upgrade pricing rule, which
    reads renewal_count and the whole months from go_live_date to today: in the initial term (renewal_count 0) after phase_tenure_months
    or more months live, the step-up is phased and the rate is the current seat_rate_usd plus phase_share_pct percent of
    the gap between it and the standard upgraded rate, rounded half up to the cent; in a renewal term (renewal_count 1 or
    more) after phase_tenure_months or more months live, the rate is the current seat_rate_usd plus the difference between
    the ClearPath Standard list rate and the tier''s own seat_rate_list_usd, but never more than the standard upgraded rate
    less renewal_upgrade_cap_pct percent, rounded half up to the cent; otherwise the rate is the standard upgraded rate.
    The upgrade volume discount on the upgraded rate reads the covered seats on the seat ledger (every seat addition less
    every seat removal): the discount is graduated: each covered seat from the volume_mid_seats-th up to the volume_large_seats-th
    less one earns volume_mid_pct percent, each covered seat from the volume_large_seats-th up earns volume_large_pct percent,
    and the earned percentages are summed and divided by the covered seats to give the percentage taken off; with fewer
    than volume_mid_seats covered seats nothing is taken off. The term-commitment discount on the upgraded rate counts the
    whole months from today to term_end_date: commitment_long_months or more take commitment_long_pct percent off; commitment_mid_months
    up to commitment_long_months less one take commitment_mid_pct percent off; fewer take nothing off. The payment-standing
    discount on the upgraded rate counts the late fees posted on the agreement in the last standing_window_months months
    (a month window ending today): none takes standing_clean_pct percent off; exactly one takes standing_single_pct percent
    off; two or more take nothing off. The training-overlap discount on the upgraded rate reads the phishing simulations
    per year of the client''s active Sentinel Managed Security tier, which the ClearPath Standard security awareness training
    would otherwise duplicate: training_full_simulations or more take training_full_pct percent off; one up to training_full_simulations
    less one take training_partial_pct percent off; none, or no active subscription, takes nothing off. The labor-conversion
    discount on the upgraded rate compares the labor charges posted on the agreement in the last conversion_window_months
    months (a month window ending today) with the monthly seat charge, seat_rate_usd times seat_count: labor of at least
    conversion_high_share_pct percent of that charge takes conversion_high_pct percent off; labor of at least conversion_mid_share_pct
    percent but less than conversion_high_share_pct percent of it takes conversion_mid_pct percent off; less labor, or none,
    takes nothing off. A whole month between two dates is counted only once the later date reaches the same day of the month
    as the earlier one, and a month window of N months ending today takes the entries dated fewer than N whole months before
    today. The schedules of this paragraph change the standard upgraded rate in one fixed order: a value or a method a schedule
    selects replaces the standard one first; the percentage discounts are then added into one combined percentage, applied
    once, and the result is rounded half up to the cent.'
  compute:
  - standard_discount_pct: K('standard_discount_36_pct') if F('term_months') == 36 else (K('standard_discount_24_pct') if
      F('term_months') == 24 else K('standard_discount_12_pct'))
  - standard_rate: RND(K('standard_list_rate_usd') * (1 - standard_discount_pct / 100))
  - months_live: MONTHS(F('go_live_date'), NOW)
  - pricing_rule: 2 if (F('renewal_count') == 0 and months_live >= K('phase_tenure_months')) else (3 if (F('renewal_count')
      >= 1 and months_live >= K('phase_tenure_months')) else 1)
  - covered_seats: SUM('managed_seat_changes', 'seat_qty', event_type='managed_seat_add') - SUM('managed_seat_changes',
      'seat_qty', event_type='managed_seat_remove')
  - volume_pct: (K('volume_mid_pct') * (K('volume_large_seats') - K('volume_mid_seats')) + K('volume_large_pct') * (covered_seats
      - K('volume_large_seats') + 1)) / covered_seats if covered_seats >= K('volume_large_seats') else (K('volume_mid_pct')
      * (covered_seats - K('volume_mid_seats') + 1) / covered_seats if covered_seats >= K('volume_mid_seats') else 0)
  - months_left: MONTHS(NOW, F('term_end_date'))
  - commitment_pct: K('commitment_long_pct') if months_left >= K('commitment_long_months') else (K('commitment_mid_pct')
      if months_left >= K('commitment_mid_months') else 0)
  - late_fees_window: COUNT('managed_billing', within_months=K('standing_window_months'), date_field='posted_date', event_type='managed_late_fee')
  - standing_pct: K('standing_clean_pct') if late_fees_window == 0 else (K('standing_single_pct') if late_fees_window ==
      1 else 0)
  - simulations: CPARAM('security', 'phishing_simulations_per_year', status='active')
  - training_pct: K('training_full_pct') if (simulations != None and simulations >= K('training_full_simulations')) else
      (K('training_partial_pct') if (simulations != None and simulations >= 1) else 0)
  - labor_recent: SUM('managed_billing', 'amount_usd', within_months=K('conversion_window_months'), date_field='posted_date',
      event_type='managed_billable_labor')
  - conversion_pct: K('conversion_high_pct') if labor_recent * 100 >= K('conversion_high_share_pct') * F('seat_rate_usd')
      * F('seat_count') else (K('conversion_mid_pct') if labor_recent * 100 >= K('conversion_mid_share_pct') * F('seat_rate_usd')
      * F('seat_count') else 0)
  - result: RND((RND(F('seat_rate_usd') + (standard_rate - F('seat_rate_usd')) * K('phase_share_pct') / 100) if pricing_rule
      == 2 else (RND(MN(F('seat_rate_usd') + K('standard_list_rate_usd') - P('seat_rate_list_usd'), standard_rate * (1 -
      K('renewal_upgrade_cap_pct') / 100))) if pricing_rule == 3 else standard_rate)) * (1 - (volume_pct + commitment_pct
      + standing_pct + training_pct + conversion_pct) / 100))
  compute_basis:
    standard_discount_pct: reduced by the ClearPath Standard term discount for the current term_months (standard_discount_12_pct,
      standard_discount_24_pct or standard_discount_36_pct for a 12-, 24- or 36-month term), rounded half up to the cent.
    standard_rate: The standard upgraded rate is the ClearPath Standard list rate, standard_list_rate_usd, reduced by the
      ClearPath Standard term discount for the current term_months (standard_discount_12_pct, standard_discount_24_pct or
      standard_discount_36_pct for a 12-, 24- or 36-month term), rounded half up to the cent.
    months_live: How the upgraded rate is built follows the upgrade pricing rule, which reads renewal_count and the whole
      months from go_live_date to today
    pricing_rule: in the initial term (renewal_count 0) after phase_tenure_months or more months live, the step-up is phased
      and the rate is the current seat_rate_usd plus phase_share_pct percent of the gap between it and the standard upgraded
      rate, rounded half up to the cent; in a renewal term (renewal_count 1 or more) after phase_tenure_months or more months
      live, the rate is the current seat_rate_usd plus the difference between the ClearPath Standard list rate and the tier's
      own seat_rate_list_usd, but never more than the standard upgraded rate less renewal_upgrade_cap_pct percent, rounded
      half up to the cent; otherwise the rate is the standard upgraded rate.
    covered_seats: The upgrade volume discount on the upgraded rate reads the covered seats on the seat ledger (every seat
      addition less every seat removal)
    volume_pct: 'the discount is graduated: each covered seat from the volume_mid_seats-th up to the volume_large_seats-th
      less one earns volume_mid_pct percent, each covered seat from the volume_large_seats-th up earns volume_large_pct
      percent, and the earned percentages are summed and divided by the covered seats to give the percentage taken off;
      with fewer than volume_mid_seats covered seats nothing is taken off.'
    months_left: The term-commitment discount on the upgraded rate counts the whole months from today to term_end_date
    commitment_pct: commitment_long_months or more take commitment_long_pct percent off; commitment_mid_months up to commitment_long_months
      less one take commitment_mid_pct percent off; fewer take nothing off.
    late_fees_window: The payment-standing discount on the upgraded rate counts the late fees posted on the agreement in
      the last standing_window_months months (a month window ending today)
    standing_pct: none takes standing_clean_pct percent off; exactly one takes standing_single_pct percent off; two or more
      take nothing off.
    simulations: The training-overlap discount on the upgraded rate reads the phishing simulations per year of the client's
      active Sentinel Managed Security tier
    training_pct: training_full_simulations or more take training_full_pct percent off; one up to training_full_simulations
      less one take training_partial_pct percent off; none, or no active subscription, takes nothing off.
    conversion_pct: labor of at least conversion_high_share_pct percent of that charge takes conversion_high_pct percent
      off; labor of at least conversion_mid_share_pct percent but less than conversion_high_share_pct percent of it takes
      conversion_mid_pct percent off; less labor, or none, takes nothing off.
    result: 'The schedules of this paragraph change the standard upgraded rate in one fixed order: a value or a method a
      schedule selects replaces the standard one first; the percentage discounts are then added into one combined percentage,
      applied once, and the result is rounded half up to the cent.'
    labor_recent: The labor-conversion discount on the upgraded rate compares the labor charges posted on the agreement
      in the last conversion_window_months months (a month window ending today) with the monthly seat charge, seat_rate_usd
      times seat_count
  factors:
  - id: upgrade_pricing_rule
    effect: method
    decides: pricing_rule
    bindings:
    - months_live
    - pricing_rule
    ladder:
    - when: initial term (renewal_count 0) AND phase_tenure_months or more months live
      method: 'phased step-up: current seat_rate_usd plus phase_share_pct percent of the gap to the standard upgraded rate'
    - when: renewal term (renewal_count 1 or more) AND phase_tenure_months or more months live
      method: current seat_rate_usd plus the list-rate difference between the two tiers, never more than the standard upgraded
        rate less renewal_upgrade_cap_pct percent
    - when: otherwise
      method: the standard upgraded rate
    baseline:
      pricing_rule: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: upgrade_volume_discount
    effect: parameter
    decides: volume_pct
    bindings:
    - covered_seats
    - volume_pct
    ladder:
    - when: volume_large_seats or more covered seats
      value: 'graduated: volume_mid_pct per seat from the volume_mid_seats-th, volume_large_pct per seat from the volume_large_seats-th,
        averaged over the covered seats'
    - when: volume_mid_seats up to volume_large_seats less one covered seats
      value: 'graduated: volume_mid_pct per seat from the volume_mid_seats-th, averaged over the covered seats'
    - when: otherwise
      value: '0'
    baseline:
      volume_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: term_commitment_discount
    effect: parameter
    decides: commitment_pct
    bindings:
    - months_left
    - commitment_pct
    ladder:
    - when: commitment_long_months or more whole months left to term_end_date
      value: K('commitment_long_pct') off
    - when: commitment_mid_months up to commitment_long_months less one months left
      value: K('commitment_mid_pct') off
    - when: otherwise
      value: '0'
    baseline:
      commitment_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: upgrade_standing_discount
    effect: parameter
    decides: standing_pct
    bindings:
    - late_fees_window
    - standing_pct
    ladder:
    - when: no late fee in the last standing_window_months months
      value: K('standing_clean_pct') off
    - when: exactly one late fee in that window
      value: K('standing_single_pct') off
    - when: otherwise
      value: '0'
    baseline:
      standing_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: training_overlap_discount
    effect: parameter
    decides: training_pct
    bindings:
    - simulations
    - training_pct
    ladder:
    - when: active Sentinel tier with training_full_simulations or more phishing simulations a year
      value: K('training_full_pct') off
    - when: active Sentinel tier with one up to training_full_simulations less one simulations
      value: K('training_partial_pct') off
    - when: otherwise
      value: '0'
    baseline:
      training_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: security
  - id: labor_conversion_discount
    effect: parameter
    decides: conversion_pct
    bindings:
    - labor_recent
    - conversion_pct
    ladder:
    - when: labor charges in the last conversion_window_months months at least conversion_high_share_pct percent of the
        monthly seat charge
      value: K('conversion_high_pct') off
    - when: labor charges at least conversion_mid_share_pct but under conversion_high_share_pct percent of it
      value: K('conversion_mid_pct') off
    - when: otherwise
      value: '0'
    baseline:
      conversion_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The standard upgraded rate is the ClearPath Standard list rate, standard_list_rate_usd, reduced by the ClearPath
      Standard term discount for the current term_months (standard_discount_12_pct, standard_discount_24_pct or standard_discount_36_pct
      for a 12-, 24- or 36-month term), rounded half up to the cent.
    params:
    - standard_list_rate_usd
    - standard_discount_12_pct
    - standard_discount_24_pct
    - standard_discount_36_pct
  prerequisite:
  - problem: managed_ext_first_late_fee
    kind: value_input
    gate: standing_pct
    form: state
    policy_source: The upgraded seat rate is fixed only after the ledger carries the late fee owed on the first day of the
      current month for every invoice then past its grace period.
    condition: managed_billing holds a managed_late_fee entry, assessed for the current month, on every invoice whose grace
      period had ended with an unpaid balance on the first day of the current month.
    resolved_by: post_late_fee_96a9eef8
    effect: Once the owed late fee is posted, the late fees counted in the standing window include it and the payment-standing
      discount moves to the tier that count selects.
  - problem: managed_ext_after_hours_remote_labor
    kind: value_input
    gate: conversion_pct
    form: state
    policy_source: The upgraded seat rate is not fixed until the ledger carries the remote after-hours labor charge of every
      ticket resolved before the current month whose remote after-hours labor is settled by invoice.
    condition: managed_billing holds a managed_billable_labor entry of labor class remote_after_hours for every ticket resolved
      before the current month with labor_route invoice and labor_class remote_after_hours.
    resolved_by: post_remote_after_hours_labor_c0dca9e8
    effect: Once the after-hours remote labor charge is posted, the labor charges counted in the conversion window include
      it and the labor-conversion discount moves to the tier their total selects.
  - problem: managed_ext_onsite_visit_labor
    kind: value_input
    gate: conversion_pct
    form: state
    policy_source: The upgraded seat rate is fixed only after the ledger carries the onsite visit charge of every ticket
      resolved before the current month whose onsite visit labor is settled by invoice.
    condition: managed_billing holds a managed_billable_labor entry of labor class onsite_business_hours for every ticket
      resolved before the current month with labor_route invoice and labor_class onsite_business_hours.
    resolved_by: post_onsite_visit_labor_c7936621
    effect: Once the onsite visit charge is posted, the labor charges counted in the conversion window include it and the
      labor-conversion discount moves to the tier their total selects.
  cross_category:
  - category: security
    as: branch
    reads:
    - status
    - variant_name
    note: Training-overlap discount tier comes from the phishing simulations of the active Sentinel tier.
  inputs:
    history:
    - table: managed_seat_changes
      aggregate: sum
      field: seat_qty
      filters:
        event_type: managed_seat_add
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 12
      filters:
        event_type: managed_late_fee
    - table: managed_billing
      aggregate: sum
      field: amount_usd
      within_months: 3
      filters:
        event_type: managed_billable_labor
    cross_category:
    - security
