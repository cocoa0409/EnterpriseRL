    ticket of any other category takes visit_courtesy_other_pct percent off; a billable_out_of_scope ticket takes nothing
    off. A whole month between two dates is counted only once the later date reaches the same day of the month as the earlier
    one, and a month window of N months ending today takes the entries dated fewer than N whole months before today. The
    schedules of this paragraph change the standard onsite visit amount in one fixed order: a value or a method a schedule
    selects replaces the standard one first; the percentage reductions are then added into one combined percentage and applied
    once to the labor, rounded half up to the cent; flat charges are added last.'
  compute:
  - ticket: LATEST('managed_tickets', 'ticket_number', date_field='event_at', event_type='managed_ticket_resolved', labor_route='invoice',
