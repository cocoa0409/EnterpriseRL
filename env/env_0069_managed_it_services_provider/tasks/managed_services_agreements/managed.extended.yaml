- id: managed_ext_first_late_fee
  base_policy_refs:
  - managed_late_fee_and_suspension
  overwrite:
  - base_policy: managed_late_fee_and_suspension
    superseded_clause: Each late fee equals late_fee_pct_monthly percent of the invoice's unpaid balance on the assessment
      day (managed_msr_invoice_unpaid_balance), rounded half up to the cent, or late_fee_minimum_usd if that is greater;
    replaced_by: 'For the late fee assessed on the first day of a month, the assessment day, and posted that same day, on
      an invoice that is the agreement''s only invoice with any amount unpaid at the end of the day before the assessment
      day, its late fees included, so that every other invoice is settled in full together with any late fee it carries,
      no other invoice having been assessed a late fee on the day of that invoice''s most recent late fee, and only for
      such a fee, the late fee is set by the late-fee schedule of this paragraph; every other late fee remains under the
      base rule: late_fee_pct_monthly percent of the invoice''s unpaid balance on the assessment day (managed_msr_invoice_unpaid_balance),
      rounded half up to the cent, or late_fee_minimum_usd if that is greater.'
  trigger: state_due
  subject:
  - managed_late_fee
  computes: amount_usd
  target_tool: post_late_fee_96a9eef8
  params:
    rate_window_months: 12
    rate_payments_min: 10
    rate_reliable_pct: 1.0
    rate_clean_pct: 1.25
    minimum_long_months: 24
    minimum_mid_months: 12
    minimum_long_usd: 5.0
    minimum_mid_usd: 10.0
    band_low_usd: 1000
    band_high_usd: 5000
    courtesy_two_products_pct: 20.0
    courtesy_one_product_pct: 10.0
    recent_payment_short_months: 1
    recent_payment_long_months: 3
    recent_payment_short_pct: 25.0
    recent_payment_long_pct: 10.0
  rule: 'For the late fee assessed on the first day of a month, the assessment day, and posted that same day, on an invoice
    that is the agreement''s only invoice with any amount unpaid at the end of the day before the assessment day, its late
    fees included, so that every other invoice is settled in full together with any late fee it carries, no other invoice
    having been assessed a late fee on the day of that invoice''s most recent late fee, and only for such a fee, the late
    fee is set by the late-fee schedule of this paragraph; every other late fee remains under the base rule: late_fee_pct_monthly
    percent of the invoice''s unpaid balance on the assessment day (managed_msr_invoice_unpaid_balance), rounded half up
    to the cent, or late_fee_minimum_usd if that is greater. Such an invoice''s unpaid balance on the assessment day is
    its own balance as it stood at the end of the day before the assessment day: its own charge lines other than late-fee
    lines, a line added after its posting day and before its due date included, less every payment, service credit and credit
    memo applied to it by then, the payments counting in full against those lines; late fees are not themselves assessed
    late fees, so no late-fee line enters that balance. Every other invoice being settled in full with its late fees, that
    balance is every charge on the agreement''s billing ledger less every payment, service credit and credit memo on it,
    leaving out the entries posted on the assessment day itself, and less the late fees the assessed invoice carries, which
    are the late fees on the invoice carrying the agreement''s most recent late fee when that invoice still has an amount
    unpaid. The standard late fee is late_fee_pct_monthly percent of the unpaid balance, rounded half up to the cent, or
    late_fee_minimum_usd if that is greater. The late-fee rate of the late fee reads the late fees and the payments posted
    on the agreement in the last rate_window_months months (a month window ending today): with no late fee in that window
    and rate_payments_min or more payments, the rate is rate_reliable_pct percent; with no late fee in that window and fewer
    payments, rate_clean_pct percent; with a late fee in that window, late_fee_pct_monthly percent. The late-fee minimum
    of the late fee counts the whole months from go_live_date to today: minimum_long_months or more months take minimum_long_usd;
    minimum_mid_months up to minimum_long_months less one take minimum_mid_usd; fewer months take late_fee_minimum_usd.
    How the rate applies to the unpaid balance follows the balance band rule: an unpaid balance of band_high_usd or more
    is charged the rate on the first band_low_usd and half the rate on the part from band_low_usd up to band_high_usd, nothing
    on the part above; a balance of band_low_usd up to band_high_usd is charged the rate on the first band_low_usd and half
    the rate on the rest; a smaller balance is charged the rate on the whole balance. The relationship courtesy on the late
