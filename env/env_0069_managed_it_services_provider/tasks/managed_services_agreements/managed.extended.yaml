  - visit_courtesy_pct: K('visit_courtesy_service_pct') if (scope_class == 'covered' and (issue_category == 'outage' or
      issue_category == 'degraded_service' or issue_category == 'security_concern')) else (K('visit_courtesy_other_pct')
      if (scope_class == 'covered' and issue_category != 'outage' and issue_category != 'degraded_service' and issue_category
      != 'security_concern') else 0)
  - result: RND(RND((MX(recorded_minutes + K('next_day_block_minutes'), K('same_day_minimum_minutes')) if dispatch_rule
      == 2 else (recorded_minutes + K('next_day_block_minutes') if dispatch_rule == 3 else recorded_minutes)) / 60 * P('onsite_hourly_rate_usd')
      * (1 - (visit_tenure_pct + visit_courtesy_pct) / 100)) + trip_charge) if ticket != None else 0
  compute_basis:
    ticket: The visit priced is the one whose resolution milestone (labor class onsite business-hours, labor route invoice)
      is the latest by its event_at (the service desk platform never stamps two resolutions of one agreement with the same
      minute)
    recorded_minutes: its milestones supply the recorded billable minutes, the opening and resolution moments and the scope
      determination and issue category recorded when it was opened
    visits_recent: The shared-trip schedule of the onsite visit amount counts the agreement's resolved tickets of labor
      class onsite business-hours and labor route invoice in the last visit_window_months months (a month window ending
      today, this visit included)
    trip_charge: visits_waiver_count or more visits carry no trip charge; two up to visits_waiver_count less one carry trip_shared_pct
      percent of onsite_trip_charge_usd, rounded half up to the cent; a single visit carries onsite_trip_charge_usd.
    opened_at: How the minutes of the onsite visit amount are billed follows the dispatch rule, which counts the calendar
      days from the ticket's opening to its resolution
    resolved_at: How the minutes of the onsite visit amount are billed follows the dispatch rule, which counts the calendar
      days from the ticket's opening to its resolution
    dispatch_rule: a visit resolved the same day the ticket was opened bills the greater of the recorded minutes plus next_day_block_minutes
      and same_day_minimum_minutes; a visit resolved the next day bills the recorded minutes plus next_day_block_minutes;
      a visit resolved later bills the recorded minutes.
    months_live: The tenure visit discount on the onsite visit labor counts the whole months from go_live_date to today
    scope_class: The visit courtesy on the onsite visit labor reads the ticket's scope determination and issue category
    issue_category: The visit courtesy on the onsite visit labor reads the ticket's scope determination and issue category
    visit_courtesy_pct: a covered ticket whose category is outage, degraded_service or security_concern takes visit_courtesy_service_pct
      percent off the labor; a covered ticket of any other category takes visit_courtesy_other_pct percent off; a billable_out_of_scope
      ticket takes nothing off.
    result: 'The schedules of this paragraph change the standard onsite visit amount in one fixed order: a value or a method
      a schedule selects replaces the standard one first; the percentage reductions are then added into one combined percentage
      and applied once to the labor, rounded half up to the cent; flat charges are added last.'
    visit_tenure_pct: visit_tenure_long_months or more months take visit_tenure_long_pct percent off; visit_tenure_mid_months
      up to visit_tenure_long_months less one take visit_tenure_mid_pct percent off; fewer months take nothing off.
  factors:
  - id: shared_trip_schedule
    effect: parameter
    decides: trip_charge
    bindings:
    - visits_recent
    - trip_charge
    ladder:
    - when: visits_waiver_count or more onsite invoice-route visits in the last visit_window_months months
      value: '0'
    - when: two up to visits_waiver_count less one such visits
      value: K('trip_shared_pct') percent of P('onsite_trip_charge_usd')
    - when: otherwise
      value: P('onsite_trip_charge_usd')
    baseline:
      trip_charge: P('onsite_trip_charge_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: onsite_dispatch_rule
    effect: method
    decides: dispatch_rule
    bindings:
    - opened_at
    - resolved_at
    - dispatch_rule
    ladder:
    - when: visit resolved the same calendar day the ticket was opened
      method: the greater of the recorded minutes plus next_day_block_minutes and same_day_minimum_minutes
    - when: visit resolved the next calendar day
      method: the recorded minutes plus next_day_block_minutes
    - when: otherwise
      method: the recorded minutes
    baseline:
      dispatch_rule: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: tenure_visit_discount
    effect: parameter
    decides: visit_tenure_pct
    bindings:
    - months_live
    - visit_tenure_pct
    ladder:
    - when: visit_tenure_long_months or more whole months since go_live_date
      value: K('visit_tenure_long_pct') off
    - when: visit_tenure_mid_months up to visit_tenure_long_months less one months
      value: K('visit_tenure_mid_pct') off
    - when: otherwise
      value: '0'
    baseline:
      visit_tenure_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: onsite_visit_courtesy
    effect: parameter
    decides: visit_courtesy_pct
    bindings:
    - scope_class
    - issue_category
    - visit_courtesy_pct
    ladder:
    - when: covered scope AND issue category outage, degraded_service or security_concern
      value: K('visit_courtesy_service_pct') off
    - when: covered scope AND any other issue category
      value: K('visit_courtesy_other_pct') off
    - when: otherwise
      value: '0'
    baseline:
      visit_courtesy_pct: '0'
    evidence:
