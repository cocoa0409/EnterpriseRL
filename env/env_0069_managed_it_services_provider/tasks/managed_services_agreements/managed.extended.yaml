  - band_rule: 3 if band_charges >= K('band_high_usd') else (2 if band_charges >= K('band_low_usd') else 1)
  - security_active: CFIELD('security', 'status', status='active')
  - backup_active: CFIELD('backup', 'status', status='active')
  - relationship_pct: K('courtesy_two_products_pct') if (security_active != None and backup_active != None) else (K('courtesy_one_product_pct')
      if ((security_active != None and backup_active == None) or (security_active == None and backup_active != None)) else
      0)
  - payments_short: COUNT('managed_billing', within_months=K('recent_payment_short_months'), date_field='posted_date', event_type='managed_payment')
  - payments_long: COUNT('managed_billing', within_months=K('recent_payment_long_months'), date_field='posted_date', event_type='managed_payment')
  - recent_payment_pct: K('recent_payment_short_pct') if payments_short >= 1 else (K('recent_payment_long_pct') if payments_long
      >= 1 else 0)
  - result: MX(RND((fee_rate_pct / 100 * K('band_low_usd') + fee_rate_pct / 200 * (K('band_high_usd') - K('band_low_usd'))
      if band_rule == 3 else (fee_rate_pct / 100 * K('band_low_usd') + fee_rate_pct / 200 * (invoice_charges - K('band_low_usd'))
      if band_rule == 2 else fee_rate_pct / 100 * invoice_charges)) * (1 - (relationship_pct + recent_payment_pct) / 100)),
      fee_minimum)
  compute_basis:
    invoice_charges: 'Such an invoice''s unpaid balance on the assessment day is its own balance as it stood at the end
      of the day before the assessment day: its own charge lines other than late-fee lines, a line added after its posting
      day and before its due date included, less every payment, service credit and credit memo applied to it by then, the
      payments counting in full against those lines; late fees are not themselves assessed late fees, so no late-fee line
      enters that balance. Every other invoice being settled in full with its late fees, that balance is every charge on
      the agreement''s billing ledger less every payment, service credit and credit memo on it, leaving out the entries
      posted on the assessment day itself, and less the late fees the assessed invoice carries, which are the late fees
      on the invoice carrying the agreement''s most recent late fee when that invoice still has an amount unpaid.'
    band_charges: How the rate applies to the unpaid balance follows the balance band rule
    late_fees_window: The late-fee rate of the late fee reads the late fees and the payments posted on the agreement in
      the last rate_window_months months (a month window ending today)
    payments_window: The late-fee rate of the late fee reads the late fees and the payments posted on the agreement in the
      last rate_window_months months (a month window ending today)
    fee_rate_pct: with no late fee in that window and rate_payments_min or more payments, the rate is rate_reliable_pct
      percent; with no late fee in that window and fewer payments, rate_clean_pct percent; with a late fee in that window,
      late_fee_pct_monthly percent.
    months_live: The late-fee minimum of the late fee counts the whole months from go_live_date to today
    fee_minimum: minimum_long_months or more months take minimum_long_usd; minimum_mid_months up to minimum_long_months
      less one take minimum_mid_usd; fewer months take late_fee_minimum_usd.
    band_rule: an unpaid balance of band_high_usd or more is charged the rate on the first band_low_usd and half the rate
      on the part from band_low_usd up to band_high_usd, nothing on the part above; a balance of band_low_usd up to band_high_usd
      is charged the rate on the first band_low_usd and half the rate on the rest; a smaller balance is charged the rate
      on the whole balance.
    security_active: The relationship courtesy on the late fee reads the client's other managed services
    backup_active: The relationship courtesy on the late fee reads the client's other managed services
    relationship_pct: an active Sentinel Managed Security subscription together with an active Continuum Backup & Recovery
      plan takes courtesy_two_products_pct percent off; exactly one of the two takes courtesy_one_product_pct percent off;
      neither takes nothing off.
    payments_short: The recent-payment courtesy on the late fee counts the payments posted on the agreement
    payments_long: The recent-payment courtesy on the late fee counts the payments posted on the agreement
    recent_payment_pct: one or more in the last recent_payment_short_months month take recent_payment_short_pct percent
      off; none then but one or more in the last recent_payment_long_months months take recent_payment_long_pct percent
      off; none in that window takes nothing off.
    result: 'The schedules of this paragraph change the standard late fee in one fixed order: a value or a method a schedule
      selects replaces the standard one first; the percentage reductions are then added into one combined percentage, applied
      once and rounded half up to the cent; the late-fee minimum applies last, the greater of the two being the fee.'
  factors:
  - id: payment_record_rate
    effect: parameter
    decides: fee_rate_pct
    bindings:
    - late_fees_window
    - payments_window
    - fee_rate_pct
    ladder:
    - when: no late fee in the last rate_window_months months AND rate_payments_min or more payments in that window
      value: K('rate_reliable_pct')
    - when: no late fee in that window AND fewer payments
      value: K('rate_clean_pct')
    - when: otherwise
      value: P('late_fee_pct_monthly')
    baseline:
      fee_rate_pct: P('late_fee_pct_monthly')
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_late_fee_minimum
    effect: parameter
    decides: fee_minimum
    bindings:
    - months_live
    - fee_minimum
    ladder:
    - when: minimum_long_months or more whole months since go_live_date
      value: K('minimum_long_usd')
    - when: minimum_mid_months up to minimum_long_months less one months
      value: K('minimum_mid_usd')
    - when: otherwise
      value: P('late_fee_minimum_usd')
    baseline:
      fee_minimum: P('late_fee_minimum_usd')
    evidence:
    - date
    cross_difficulty: null
  - id: balance_band_rule
    effect: method
    decides: band_rule
    bindings:
    - band_charges
    - band_rule
    ladder:
    - when: unpaid balance band_high_usd or more
      method: the rate on the first band_low_usd, half the rate from band_low_usd up to band_high_usd, nothing above
    - when: unpaid balance band_low_usd up to band_high_usd
      method: the rate on the first band_low_usd and half the rate on the rest
    - when: otherwise
      method: the rate on the whole balance
    baseline:
      band_rule: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: relationship_courtesy
    effect: parameter
    decides: relationship_pct
    bindings:
    - security_active
    - backup_active
    - relationship_pct
    ladder:
    - when: active Sentinel subscription AND active Continuum plan
      value: K('courtesy_two_products_pct') off
    - when: (active Sentinel subscription AND no active Continuum plan) OR (no active Sentinel subscription AND active Continuum
        plan)
      value: K('courtesy_one_product_pct') off
    - when: otherwise
      value: '0'
    baseline:
      relationship_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: security
  - id: recent_payment_courtesy
    effect: parameter
    decides: recent_payment_pct
    bindings:
    - payments_short
    - payments_long
    - recent_payment_pct
    ladder:
    - when: one or more payments in the last recent_payment_short_months month
      value: K('recent_payment_short_pct') off
    - when: none in that month but one or more in the last recent_payment_long_months months
      value: K('recent_payment_long_pct') off
    - when: otherwise
      value: '0'
    baseline:
      recent_payment_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'Such an invoice''s unpaid balance on the assessment day is its own balance as it stood at the end of the day
      before the assessment day: its own charge lines other than late-fee lines, a line added after its posting day and
      before its due date included, less every payment, service credit and credit memo applied to it by then, the payments
      counting in full against those lines; late fees are not themselves assessed late fees, so no late-fee line enters
      that balance. Every other invoice being settled in full with its late fees, that balance is every charge on the agreement''s
      billing ledger less every payment, service credit and credit memo on it, leaving out the entries posted on the assessment
      day itself, and less the late fees the assessed invoice carries, which are the late fees on the invoice carrying the
      agreement''s most recent late fee when that invoice still has an amount unpaid. The standard late fee is late_fee_pct_monthly
      percent of the unpaid balance, rounded half up to the cent, or late_fee_minimum_usd if that is greater.'
    params:
    - late_fee_pct_monthly
    - late_fee_minimum_usd
  prerequisite: []
  cross_category:
  - category: security
    as: existence
    reads:
    - status
    note: Relationship courtesy tier comes from whether an active Sentinel subscription is held alongside the Continuum
      plan.
  - category: backup
    as: existence
    reads:
    - status
    note: Relationship courtesy tier comes from whether an active Continuum plan is held alongside the Sentinel subscription.
  inputs:
    history:
    - table: managed_billing
      aggregate: sum
      field: amount_usd
      filters:
        event_type: managed_monthly_fee
    - table: managed_billing
      aggregate: sum
      field: amount_usd
      filters:
        event_type: managed_payment
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 12
      filters:
        event_type: managed_late_fee
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 12
      filters:
        event_type: managed_payment
    cross_category:
    - security
