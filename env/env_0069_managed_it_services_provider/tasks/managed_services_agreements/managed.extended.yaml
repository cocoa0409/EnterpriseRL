    coverage_days: Mon-Sun
    coverage_start: 00:00
    coverage_end: '24:00'
    observed_holidays_excluded: false
    observed_holiday_list:
    - New Year's Day
    - Memorial Day
    - Independence Day
    - Labor Day
    - Thanksgiving Day
    - Christmas Day
    response_target_minutes_p1: 15
    response_target_minutes_p2: 30
    response_target_minutes_p3: 120
    response_target_minutes_p4: 240
    resolution_target_hours_p1: 4
    resolution_target_hours_p2: 8
    p1_requires_phone: true
    sla_credits_eligible: true
    sla_credit_priorities:
    - P1
    - P2
    - P3
    sla_credit_pct_per_breach: 5.0
    sla_credit_cap_pct_monthly: 25.0
    sla_credit_claim_window_days: 60
    invoice_due_days: 45
    late_fee_pct_monthly: 1.5
    late_fee_grace_days: 15
    late_fee_minimum_usd: 50.0
    suspension_days_past_due: 75
    suspension_warning_days: 15
    termination_for_nonpayment_days: 60
    reinstatement_fee_usd: 750.0
    vcio_reviews_per_year: 12
    dedicated_account_manager: true
    technical_account_manager: true
    transition_assistance_included_hours: 40
    transition_assistance_rate_usd: 160.0
    data_return_window_days: 90
    tier_downgrade_mid_term_allowed: false
    monthly_invoice_day: 1
    card_payment_max_usd: 15000.0
    security_awareness_training: true
    m365_administration_included: true
    vendor_management_included: true
    network_device_management_included: true


# ---- data flow (every write is an event) ----
events:
  # -- holding writes --
  - type: managed_agreement_signed
    target: managed_agreements
    mutation: create
    meaning: The client signs a ClearPath managed services agreement for a tier, seat commitment and term.
    grain: One agreement record per signed agreement.
    fields:
      customer_id: Client organisation signing.
      variant_name: Official ClearPath tier signed.
      signed_date: Date of the client's signature.
      term_months: Initial term length signed (one of the tier's allowed_terms_months).
      contracted_seats: Seats committed at signing.
      seat_rate_usd: Contracted per-seat rate (list rate less the term discount).
      auto_renew: Whether the agreement renews automatically (true unless negotiated otherwise).
    triggers:
      - event: managed:managed_onboarding_fee
        when: {term_months: {not: [36, 60]}}
        map: {}
  - type: managed_onboarding_started
    target: managed_agreements
    mutation: {transition: {from: applied, to: onboarding}}
    meaning: The onboarding project (discovery, agent deployment, documentation) is kicked off.
    grain: One transaction per agreement.
    fields:
      onboarding_start_date: Kickoff date.
    triggers: []
  - type: managed_go_live
    target: managed_agreements
    mutation: {transition: {from: onboarding, to: active}}
    meaning: Onboarding completes and the agreement goes live; the initial term starts.
    grain: One transaction per agreement.
    fields:
      go_live_date: Date service went live.
      term_start_date: First day of the initial term (equal to go_live_date).
      term_end_date: Last day of the initial term (the day before the same calendar day term_months later).
    triggers:
      - event: managed:managed_seat_add
        map: {change_reason: initial_baseline}
  - type: managed_cancelled
    target: managed_agreements
    mutation: {transition: {from: applied, to: cancelled}}
    meaning: The client withdraws the signed agreement before onboarding starts.
    grain: One transaction per agreement.
    fields:
      closed_date: Date the cancellation took effect.
    triggers: []
  - type: managed_suspended
    target: managed_agreements
    mutation: {transition: {from: active, to: suspended}}
    meaning: Service is suspended for non-payment.
    grain: One transaction per suspension.
    fields:
      suspended_date: Date service was suspended.
    triggers: []
  - type: managed_reinstated
    target: managed_agreements
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended agreement is reinstated after the past-due balance is cleared.
    grain: One transaction per reinstatement.
    fields:
      reinstated_date: Date service was reinstated.
    triggers:
      - event: managed:managed_reinstatement_fee
        map: {}
  - type: managed_notice_given
    target: managed_agreements
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The client's signed written notice of non-renewal or early termination takes effect on the agreement.
    grain: One transaction per notice.
    fields:
      notice_type: non_renewal or early_termination.
      notice_received_date: Date the signed notice was received.
      termination_effective_date: Date the termination takes effect.
    triggers:
      - event: managed:managed_early_termination_fee
        when: {notice_type: early_termination}
        map: {}
  - type: managed_notice_withdrawn
    target: managed_agreements
    mutation: {transition: {from: notice_given, to: active}}
    meaning: The client withdraws its notice before the termination effective date.
    grain: One transaction per withdrawal.
    fields:
      notice_type: Reset to none.
      notice_received_date: Cleared.
      termination_effective_date: Cleared.
    triggers: []
  - type: managed_offboarding_started
    target: managed_agreements
    mutation: {transition: [{from: notice_given, to: offboarding}, {from: suspended, to: offboarding}, {from: active, to: offboarding}]}
    meaning: The transition-out begins at the termination effective date, at the end of a term that does not renew, or on termination for non-payment.
    grain: One transaction per agreement.
    fields:
      offboarding_start_date: Date the transition-out began.
    triggers: []
  - type: managed_closed
    target: managed_agreements
    mutation: {transition: {from: offboarding, to: closed}}
    meaning: Transition-out is complete and the agreement is closed.
    grain: One transaction per agreement.
    fields:
      closed_date: Date the agreement closed.
    triggers: []
  - type: managed_tier_changed
    target: managed_agreements
    mutation: update
    meaning: A signed tier change takes effect, re-pricing every seat.
    grain: One transaction per tier change.
    fields:
      variant_name: New official tier.
      seat_rate_usd: New per-seat rate.
      tier_change_effective_date: Date the new tier took effect.
    triggers: []
  - type: managed_renewed
    target: managed_agreements
    mutation: update
    meaning: The agreement rolls into a renewal term at term end.
    grain: One transaction per renewal term.
    fields:
      term_start_date: First day of the renewal term.
      term_end_date: Last day of the renewal term.
      term_months: Renewal term length.
      seat_rate_usd: Rate for the renewal term after any uplift.
      contracted_seats: Seat commitment for the renewal term.
      renewal_count: Incremented by one.
    triggers: []
  # -- seat ledger --
  - type: managed_seat_add
    target: managed_seat_changes
    meaning: Seats are added to the covered-user count (initial baseline at go-live, a named new user, or a monthly true-up).
    grain: One row per seat addition for one named user, one baseline, or one true-up reconciliation.
    distinguish_by: [effective_date, change_reason, user_principal]
    fields:
      seat_qty: Seats added.
      effective_date: Date the seats became covered.
      change_reason: initial_baseline, user_onboarding or monthly_true_up.
      user_principal: Named user's sign-in, empty for baseline and true-up rows.
      ticket_number: Onboarding ticket, empty for baseline and true-up rows.
    account: seats
    direction: in
    triggers:
      - event: managed:managed_proration_charge
        map: {managed_seat_change_id: managed_seat_change_id}
  - type: managed_seat_remove
    target: managed_seat_changes
    meaning: Seats are removed from the covered-user count (a named user offboarded or a true-up reduction).
    grain: One row per seat removal for one named user or one true-up reconciliation.
    distinguish_by: [effective_date, change_reason, user_principal]
    fields:
      seat_qty: Seats removed.
      effective_date: Date the seats stopped being covered.
      change_reason: user_offboarding or true_up_reduction.
      user_principal: Named user's sign-in, empty for true-up rows.
      ticket_number: Offboarding ticket, empty for true-up rows.
    account: seats
    direction: out
    triggers: []
  # -- billing ledger --
  - type: managed_monthly_fee
    target: managed_billing
    meaning: The monthly seat fee is invoiced in advance for a service month.
    grain: One row per agreement per service month.
    distinguish_by: [billing_period]
    fields: {amount_usd: Fee billed., invoice_number: Monthly invoice., billing_period: Service month., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_proration_charge
    target: managed_billing
    meaning: A partial-month charge for seats added after the start of a service month.
    grain: One row per seat addition billed.
    distinguish_by: [managed_seat_change_id]
    fields: {managed_seat_change_id: Seat addition billed., amount_usd: Prorated amount., invoice_number: Invoice carrying the charge., billing_period: Service month of the partial period., posted_date: Posting date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_onboarding_fee
    target: managed_billing
    meaning: The one-time onboarding fee is invoiced at signing.
    grain: One row per agreement.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee billed., invoice_number: Onboarding invoice., billing_period: Month of signing., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_billable_labor
    target: managed_billing
    meaning: Billable labor on a resolved ticket is invoiced.
    grain: One row per ticket per labor class.
    distinguish_by: [ticket_number, labor_class]
    fields: {ticket_number: Ticket the labor was performed on., labor_class: Labor class billed., billable_minutes: Billable minutes after rounding and minimums., amount_usd: Labor amount including any trip charge., invoice_number: Invoice carrying the charge., billing_period: Month the work was performed., posted_date: Posting date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_sla_credit
    target: managed_billing
    meaning: A service credit for a missed first-response guarantee is applied against an invoice.
    grain: One row per breached ticket credited.
    distinguish_by: [ticket_number]
    fields: {ticket_number: Breached ticket., amount_usd: Credit amount after the monthly cap., invoice_number: Invoice the credit is applied to., billing_period: Service month of the breached ticket., posted_date: Posting date.}
    account: receivable
    direction: out
    triggers: []
  - type: managed_payment
    target: managed_billing
    meaning: A client payment is received and applied to an invoice.
    grain: One row per remittance per invoice applied.
    distinguish_by: [payment_reference, invoice_number]
    fields: {payment_reference: Remittance reference., payment_method: Method of payment (ach / wire / check / card)., amount_usd: Amount applied., invoice_number: Invoice paid., posted_date: Date received.}
    account: receivable
    direction: out
    triggers: []
  - type: managed_late_fee
    target: managed_billing
    meaning: A late fee is assessed on an invoice past due beyond the grace period.
    grain: One row per invoice per month assessed.
    distinguish_by: [invoice_number, billing_period]
    fields: {invoice_number: Past-due invoice the fee is assessed on., billing_period: Month of assessment., amount_usd: Late fee., posted_date: Assessment date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_early_termination_fee
    target: managed_billing
    meaning: The early termination fee is invoiced when an early termination notice takes effect.
    grain: One row per early termination notice.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee billed., invoice_number: Termination invoice., billing_period: Month of the notice., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_reinstatement_fee
    target: managed_billing
    meaning: The reinstatement fee is invoiced when a suspended agreement is reinstated.
    grain: One row per reinstatement.
    distinguish_by: [posted_date]
    fields: {amount_usd: Fee billed., invoice_number: Invoice carrying the fee., billing_period: Month of reinstatement., posted_date: Reinstatement date.}
    account: receivable
    direction: in
    triggers: []
  - type: managed_credit_memo
    target: managed_billing
    meaning: A credit memo reverses one specific charge in whole or in part.
    grain: One row per charge reversed.
    distinguish_by: [original_billing_entry_id]
    fields: {original_billing_entry_id: The charge being reversed., amount_usd: Amount reversed., invoice_number: Invoice of the original charge., billing_period: Service month of the original charge., posted_date: Posting date.}
    account: receivable
    direction: out
    triggers: []
  # -- ticket milestones (documentary) --
  - type: managed_ticket_opened
    target: managed_tickets
    meaning: A ticket is logged by the service desk with its priority, category, channel and scope determination.
    grain: One row per ticket.
    distinguish_by: [ticket_number]
    fields: {ticket_number: Ticket number., event_at: Moment logged., priority: Priority assigned., issue_category: Issue classification., channel: Reporting channel., scope_class: Scope determination.}
    triggers: []
  - type: managed_ticket_reprioritized
    target: managed_tickets
    meaning: The service desk changes a ticket's priority.
    grain: One row per priority change.
    distinguish_by: [ticket_number, event_at]
    fields: {ticket_number: Ticket number., event_at: Moment of the change., priority: New priority.}
    triggers: []
  - type: managed_ticket_first_response
    target: managed_tickets
    meaning: A technician makes the first human response on a ticket (call-back, remote session or onsite arrival).
    grain: One row per ticket.
    distinguish_by: [ticket_number]
    fields: {ticket_number: Ticket number., event_at: Moment of first response., priority: Priority in force at first response.}
    triggers: []
  - type: managed_ticket_resolved
    target: managed_tickets
    meaning: A ticket is resolved, with the labor performed and how that labor is settled.
    grain: One row per ticket.
    distinguish_by: [ticket_number]
    fields: {ticket_number: Ticket number., event_at: Moment resolved., priority: Priority at resolution., labor_route: How the labor is settled (included / invoice / timebank)., labor_class: Class of labor performed., billable_minutes: Billable minutes after rounding and minimums.}
    triggers:
      - event: managed:managed_billable_labor
        when: {labor_route: invoice}
        map: {ticket_number: ticket_number, labor_class: labor_class, billable_minutes: billable_minutes}
      - event: timebank:timebank_hours_drawn
        when: {labor_route: timebank}
        map: {ticket_number: ticket_number}


# ---- derived measures ----
measures:
  - id: managed_msr_onsite_included_minutes_month
    window: The calendar month (US Eastern) in which the ticket being settled was resolved, up to but excluding that ticket.
    measure: Sum of billable_minutes on managed_ticket_resolved rows of the agreement whose labor_route is included and whose labor_class is onsite_business_hours or onsite_after_hours.
  - id: managed_msr_service_month_fee
    window: One service month (billing_period) of the agreement.
    measure: amount_usd of the managed_monthly_fee row for that billing_period; where no monthly fee exists for that month, amount_usd of the managed_proration_charge row billing the initial_baseline seat addition for that month.
  - id: managed_msr_sla_credits_month
    window: One service month (billing_period) of the agreement.
    measure: Sum of amount_usd over managed_sla_credit rows whose billing_period is that service month.
  - id: managed_msr_invoice_unpaid_balance
    window: One invoice_number of the agreement, as of the end of the day before the assessment day.
    measure: Sum of amount_usd of the charges billed on that invoice (monthly fee, proration, onboarding, labor, early termination and reinstatement entries) minus the amount_usd of payments, SLA credits and credit memos whose invoice_number is that invoice; late fees are excluded from both sides.
  - id: managed_msr_late_fee_waivers_12m
    window: The 365 calendar days ending on the day the waiver is requested, inclusive.
    measure: Count of managed_credit_memo rows of the agreement posted in the window whose original_billing_entry_id points at a managed_late_fee row.

# ---- policies ----
policies:
  - id: managed_agg_multi_holding
    subject: [managed_agreement_signed]
    rule: >-
      A client organisation holds at most one ClearPath agreement at a time; every user, site and device the client wants
      managed is covered under that single agreement, and a move between tiers is a tier change on the existing agreement,
      never a second agreement. A new agreement may be signed only when the client holds no other ClearPath agreement whose
      status is applied, onboarding, active, suspended, notice_given or offboarding. A closed or cancelled agreement does not
      block a new one; a returning client signs a new agreement with a new term and a new onboarding fee assessment.
    eligibility:
      - id: single_open_agreement
        applies_to: [managed_agreement_signed]
        kind: dedup
        condition: A new agreement may be signed only when the client holds no other ClearPath agreement whose status is applied, onboarding, active, suspended, notice_given or offboarding.
        evidence_fields: [managed_agreements.customer_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.customer_id]]
          action_bindings: {managed_agreements.customer_id: customer_id}
        dedup_contract:
          table: managed_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, onboarding, active, suspended, notice_given, offboarding]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: managed_signing_terms
    subject: [managed_agreement_signed, managed_onboarding_fee]
    rule: >-
      An agreement is signed for one tier, at a seat commitment no lower than that tier's min_seats and for a term listed in
      the tier's allowed_terms_months; a request for a seat commitment or term the tier does not offer cannot be signed on
      that tier. ClearPath Premier and ClearPath Enterprise may be signed only while the client holds a Sentinel Managed
      Security subscription whose status is active. The contracted seat_rate_usd is the tier's seat_rate_list_usd reduced by
      the tier's term_discount_pct for the signed term length, rounded half up to the cent. The onboarding fee equals
      onboarding_fee_per_seat_usd times contracted_seats, but never less than onboarding_fee_minimum_usd, and is invoiced on
      the signing date with payment due under the tier's invoice_due_days. The onboarding fee is waived entirely when the
      initial term is at least onboarding_fee_waiver_min_term_months months, in which case no onboarding fee is posted at all.
      Renewal terms and tier changes never generate an onboarding fee.
    eligibility:
      - id: premier_requires_sentinel
        applies_to: [managed_agreement_signed]
        kind: state
        condition: ClearPath Premier and ClearPath Enterprise may be signed only while the client holds a Sentinel Managed Security subscription whose status is active.
        evidence_fields: [security_subscriptions.customer_id, security_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[security_subscriptions.customer_id]]
          action_bindings: {security_subscriptions.customer_id: customer_id}
        state_contract:
          field: security_subscriptions.status
          allowed: [active]
    formula:
      seat_rate_usd: round(seat_rate_list_usd * (1 - term_discount_pct / 100), 2)
      when_not: term_months >= onboarding_fee_waiver_min_term_months
      amount_usd: max(onboarding_fee_per_seat_usd * contracted_seats, onboarding_fee_minimum_usd)

  - id: managed_onboarding_and_go_live
    subject: [managed_onboarding_started, managed_go_live, managed_cancelled]
    rule: >-
      Onboarding may be kicked off only after the onboarding fee invoice has been paid in full, or when no onboarding fee was
      posted because it was waived. The onboarding_target_business_days figure is a planning target, not a guarantee, and
      missing it earns no credit. Go-live is recorded when onboarding completes: the initial term starts on the go-live date,
      and term_end_date is the day before the same day of the month term_months calendar months later (when that day does
      not exist in the target month, the last day of the target month is used as the anniversary and the term ends the day
      before it). Go-live posts the initial seat baseline equal to contracted_seats. A signed agreement may be cancelled by
      the client only before onboarding is kicked off; once onboarding has started the agreement can be ended only by notice
      after go-live. On a cancellation, an onboarding fee that was posted is reversed in full by a credit memo against that
      fee, and any amount already paid is refunded by the accounting team.
    eligibility:
      - id: onboarding_fee_settled
        applies_to: [managed_onboarding_started]
        kind: authorization
        condition: Onboarding may be kicked off only after the onboarding fee invoice has been paid in full, or when no onboarding fee was posted because it was waived.
        evidence_fields: [managed_billing.managed_agreement_id, managed_billing.event_type, managed_billing.invoice_number, managed_billing.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.managed_agreement_id]]
          action_bindings: {managed_billing.managed_agreement_id: managed_agreement_id}

  - id: managed_seat_changes_and_proration
    subject: [managed_seat_add, managed_seat_remove, managed_proration_charge]
    rule: >-
      Seats are added and removed one named user at a time under a service desk user_onboarding or user_offboarding ticket,
      at go-live as the initial baseline, and on the true_up_snapshot_day of each month as a monthly true-up when the
      client's licensed directory users exceed or fall below seat_count. Seat changes may be posted only while the agreement
      status is active or notice_given. Business days are Monday through Friday excluding the observed_holiday_list. A
      new-user onboarding is ready on the requested start date only when the onboarding ticket was opened at least
      new_user_lead_business_days business days before that date; otherwise the account is enabled on the business day that
      is new_user_lead_business_days business days after the ticket was opened, and the seat's effective_date is the date the
      account was actually enabled. An offboarding request received on a business day before offboarding_same_day_cutoff (US
      Eastern) is completed that day, otherwise on the next business day, and the seat removal's effective_date is the
      completion date; an emergency offboarding for an involuntary termination is opened as a P1 security_concern and
      completed on receipt. Every seat addition is prorated: the proration charge equals seat_rate_usd times seat_qty times
      the number of calendar days from the effective_date through the last day of that calendar month inclusive, divided by
      the number of days in that month, rounded half up to the cent, and is billed on the next monthly invoice under the
      service month of the effective date. Seat removals never generate a credit or refund for the current service month:
      the removed seat stays billed through the end of the month in which it was removed and drops out of the monthly fee
      from the next service month. A seat removal may take seat_count below the minimum-commitment floor, but billing never
      falls below the floor.
    eligibility:
      - id: seat_change_live_agreement
        applies_to: [managed_seat_add, managed_seat_remove]
        kind: state
        condition: Seat changes may be posted only while the agreement status is active or notice_given.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, notice_given]

  - id: managed_monthly_fee_calc
    subject: [managed_monthly_fee]
    rule: >-
      The monthly fee for a service month is invoiced in advance on monthly_invoice_day of that month and equals seat_rate_usd
      times the billed seats, rounded half up to the cent. Billed seats are the greater of seat_count as it stood at the end
      of the last day of the previous month and the minimum-commitment floor, which is contracted_seats times
      min_seat_commitment_pct divided by 100, rounded up to a whole seat. Seats added on or after the first day of the service
      month are billed by proration, not by this fee. The first service month after go-live is billed by the baseline
      proration charge, and the monthly fee starts with the first calendar month that begins after the go-live date. A
      monthly fee may be invoiced only while the agreement status is active, suspended or notice_given. The fee continues
      during a suspension; no monthly fee is invoiced for a service month that begins after the termination effective date.
      Payment is due invoice_due_days calendar days after the posted date.
    eligibility:
      - id: billable_status
        applies_to: [managed_monthly_fee]
        kind: state
        condition: A monthly fee may be invoiced only while the agreement status is active, suspended or notice_given.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, suspended, notice_given]
    formula:
      floor_seats: contracted_seats * min_seat_commitment_pct / 100
      billed_seats: max(seat_count, floor_seats)
      amount_usd: round(seat_rate_usd * billed_seats, 2)

  - id: managed_ticket_priority_and_scope
    subject: [managed_ticket_opened, managed_ticket_reprioritized]
    rule: >-
      The service desk assigns priority from impact and urgency: P1 is a complete outage of a business-critical system or a
      confirmed security incident with no workaround; P2 is a business-critical system degraded or an outage affecting a
      single site or department with a workaround; P3 is a single user unable to work or a non-critical system down; P4 is a
      service request, how-to question or scheduled change. Where p1_requires_phone is true, a ticket is worked and measured
      as P1 only when it was reported by phone; an outage reported through the portal, email or chat is logged as P2 until
      the client calls it in, and a phoned-in escalation is recorded as a reprioritisation at the moment of the call. When a
      ticket's priority is raised, the first-response guarantee of the new priority is measured from the moment of the
      reprioritisation; when it is lowered, the guarantee of the lower priority is measured from the original opening; a
      reprioritisation after the first response does not change the priority used for the SLA. Scope is determined when the
      ticket is opened: help desk work is covered only where helpdesk_remote_included is true, Microsoft 365 tenant
      administration only where m365_administration_included is true, liaison with line-of-business vendors and the ISP only
      where vendor_management_included is true, and firewall, switch and wireless changes only where
      network_device_management_included is true; user_onboarding and user_offboarding tickets are covered wherever
      helpdesk_remote_included is true. Work outside those entitlements is billable_out_of_scope. Any single change whose
      estimated effort exceeds project_referral_threshold_hours, new deployments, migrations and office moves are
      project_referral and are quoted under a project statement of work instead of being billed as ticket labor. Strategic
      reviews (vcio_reviews_per_year), the named client success manager (dedicated_account_manager), the technical account
      manager (technical_account_manager) and security awareness training (security_awareness_training) are entitlements of
      the tier and are scheduled through the account team, never billed as ticket labor.
    eligibility: []
    params:
      project_referral_threshold_hours: 8

  - id: managed_billable_labor_rates
    subject: [managed_ticket_resolved, managed_billable_labor]
    rule: >-
      On resolution the labor on a ticket is settled as included, invoiced or drawn from a prepaid block. Coverage hours are
      the tier's coverage_days between coverage_start and coverage_end, US Eastern, excluding the observed_holiday_list where
      observed_holidays_excluded is true; labor is after-hours when it is performed outside coverage hours. Labor is included
      when the ticket's scope_class is covered and the labor is remote within coverage hours on a tier whose
      helpdesk_remote_included is true, remote after-hours on a tier whose after_hours_remote_included is true, remote
      after-hours on a P1 ticket on a tier whose p1_after_hours_included is true, or onsite while the onsite minutes already
      included in that calendar month (managed_msr_onsite_included_minutes_month) are below included_onsite_hours_monthly;
      when a visit's minutes exceed the included onsite minutes remaining for the month, only the excess is billable and the
      onsite minimum does not apply to that excess. All other labor on covered or billable_out_of_scope tickets is billable;
      project_referral tickets are never billed as labor. Billable minutes are the recorded minutes rounded up to
      billing_increment_minutes, and never less than minimum_billable_minutes_remote for remote work or
      minimum_billable_minutes_onsite for an onsite visit. The labor amount is billable minutes divided by 60 times
      remote_hourly_rate_usd or onsite_hourly_rate_usd, times after_hours_multiplier for after-hours labor, rounded half up
      to the cent, plus onsite_trip_charge_usd for each onsite visit that is wholly billable. When the client holds a
      TimeBank prepaid block whose status is active and whose remaining hours cover the billable minutes, the labor route is
      timebank and the hours are drawn from that block under the TimeBank rules instead of being invoiced; otherwise the
      labor route is invoice and the amount is billed on the next monthly invoice. Labor may be billed only on an agreement
      whose status is active, suspended, notice_given or offboarding.
    eligibility:
      - id: labor_billable_status
        applies_to: [managed_billable_labor]
        kind: state
        condition: Labor may be billed only on an agreement whose status is active, suspended, notice_given or offboarding.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, suspended, notice_given, offboarding]
    measures: [managed_msr_onsite_included_minutes_month]
    formula:
      hourly_rate: remote_hourly_rate_usd if labor_class in ("remote_business_hours", "remote_after_hours") else onsite_hourly_rate_usd
      multiplier: after_hours_multiplier if labor_class in ("remote_after_hours", "onsite_after_hours") else 1
      labor_amount: round(billable_minutes / 60 * hourly_rate * multiplier, 2)
      trip_charge: onsite_trip_charge_usd if labor_class in ("onsite_business_hours", "onsite_after_hours") else 0
      amount_usd: labor_amount + trip_charge

  - id: managed_sla_response_credit
    subject: [managed_ticket_first_response, managed_sla_credit]
    rule: >-
      A first-response guarantee is breached when the coverage minutes elapsed between the ticket's opening (or the raise of
      its priority) and its first response exceed the response target of the priority in force at first response
      (response_target_minutes_p1, response_target_minutes_p2,
      response_target_minutes_p3 or response_target_minutes_p4). Coverage minutes count only time inside the tier's
      coverage window and exclude observed holidays where observed_holidays_excluded is true. Resolution targets
      (resolution_target_hours_p1, resolution_target_hours_p2) are objectives and never earn credits. A breach earns a
      service credit only when the tier's sla_credits_eligible is true, the priority is listed in sla_credit_priorities, the
      ticket's scope_class is covered, and the client claims it. The credit must be claimed no later than
      sla_credit_claim_window_days calendar days after the first response is recorded on the ticket. The window is counted
      in calendar days from the date part of the first-response timestamp, that date being day 0, and a claim made on the
      last day of the window is timely. A ticket earns at most one service credit. Each credited ticket earns
      sla_credit_pct_per_breach percent of the fee billed for the service month in which the ticket was opened
      (managed_msr_service_month_fee), rounded half up to the cent; total credits for one service month never exceed
      sla_credit_cap_pct_monthly percent of that month's fee (managed_msr_sla_credits_month), and a credit that would pass the
      cap is reduced to the remaining headroom, none being posted once the cap is reached. The credit is applied to the
      next monthly invoice posted after the claim. A credit may be posted only while the agreement status is active,
      suspended, notice_given or offboarding. Credits are never paid out in cash and are forfeited when the agreement closes.
    eligibility:
      - id: claim_window
        applies_to: [managed_sla_credit]
        kind: time
        condition: The credit must be claimed no later than sla_credit_claim_window_days calendar days after the first response is recorded on the ticket.
        evidence_fields: [managed_tickets.ticket_number, managed_tickets.event_type, managed_tickets.event_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_tickets.ticket_number]]
          action_bindings: {managed_tickets.ticket_number: ticket_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the first response is recorded on the ticket
          anchor_source: managed_tickets.event_at
          relation: not_after
          duration_source: variants.sla_credit_claim_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days from the date part of the first-response timestamp, that date being day 0, and a claim made on the last day of the window is timely.
          boundary: inclusive
      - id: one_credit_per_ticket
        applies_to: [managed_sla_credit]
        kind: dedup
        condition: A ticket earns at most one service credit.
        evidence_fields: [managed_billing.ticket_number, managed_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.ticket_number]]
          action_bindings: {managed_billing.ticket_number: ticket_number}
        dedup_contract:
          table: managed_billing
          mode: separate_record
          object_bindings: {ticket_number: ticket_number}
          duplicate_filters: {event_type: [managed_sla_credit]}
          distinct_fields: []
      - id: credit_status
        applies_to: [managed_sla_credit]
        kind: state
        condition: A credit may be posted only while the agreement status is active, suspended, notice_given or offboarding.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, suspended, notice_given, offboarding]
    measures: [managed_msr_service_month_fee, managed_msr_sla_credits_month]
    params:
      per_tier:
        ClearPath Monitor: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Essentials: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Standard: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Professional: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Premier: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
        ClearPath Enterprise: {credits_eligible: =sla_credits_eligible, credit_pct: =sla_credit_pct_per_breach, cap_pct: =sla_credit_cap_pct_monthly, claim_days: =sla_credit_claim_window_days}
    formula:
      credit_raw: round(managed_msr_service_month_fee * sla_credit_pct_per_breach / 100, 2)
      headroom: managed_msr_service_month_fee * sla_credit_cap_pct_monthly / 100 - managed_msr_sla_credits_month
      amount_usd: max(min(credit_raw, round(headroom, 2)), 0)

  - id: managed_late_fee_and_suspension
    subject: [managed_late_fee, managed_suspended, managed_reinstated, managed_reinstatement_fee, managed_credit_memo]
    rule: >-
      An invoice falls due invoice_due_days calendar days after its posted date. On the first day of each calendar month,
      every invoice of the agreement that still has an unpaid balance and whose grace period has ended is assessed one late
      fee. A late fee may be assessed on an invoice only once more than late_fee_grace_days calendar days have passed since
      the invoice falls due. The grace period is counted in calendar days starting the day after the due date, which is the
      posted date plus invoice_due_days calendar days. Each late fee equals late_fee_pct_monthly percent of the invoice's
      unpaid balance on the assessment day (managed_msr_invoice_unpaid_balance), rounded half up to the cent, or late_fee_minimum_usd if that is greater; late
      fees are not themselves assessed late fees, and SLA credits are deducted from the invoice they were applied to before
      the unpaid balance is measured. On request of the authorized contact one late fee may be waived as a courtesy by a
      credit memo reversing that fee, provided the agreement's courtesy waivers in the preceding 365 days
      (managed_msr_late_fee_waivers_12m) are fewer than courtesy_waivers_per_12_months. Service may be suspended only once
      the oldest unpaid invoice is at least suspension_days_past_due calendar days past its due date. The accounting team
      sends the written warning suspension_warning_days before suspension. Suspension stops remote and onsite support but not
      monitoring or billing. Reinstatement may be recorded only after every invoice past its due date has been paid in full.
      The reinstatement fee of reinstatement_fee_usd is invoiced on the reinstatement date and falls due under the normal terms. An agreement that has
      stayed suspended for termination_for_nonpayment_days calendar days may be terminated for non-payment, which starts the
      transition-out; the past-due balance remains collectible and no early termination fee is charged on that path.
    eligibility:
      - id: late_fee_after_grace
        applies_to: [managed_late_fee]
        kind: time
        condition: A late fee may be assessed on an invoice only once more than late_fee_grace_days calendar days have passed since the invoice falls due.
        evidence_fields: [managed_billing.invoice_number, managed_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.invoice_number]]
          action_bindings: {managed_billing.invoice_number: invoice_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice falls due
          anchor_source: managed_billing.posted_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date, which is the posted date plus invoice_due_days calendar days.
          boundary: exclusive
      - id: suspension_threshold
        applies_to: [managed_suspended]
        kind: time
        condition: Service may be suspended only once the oldest unpaid invoice is at least suspension_days_past_due calendar days past its due date.
        evidence_fields: [managed_billing.invoice_number, managed_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.invoice_number]]
          action_bindings: {managed_billing.invoice_number: invoice_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: its due date
          anchor_source: managed_billing.posted_date
          relation: not_before
          duration_source: variants.suspension_days_past_due
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date, which is the posted date plus invoice_due_days calendar days.
          boundary: inclusive
      - id: reinstatement_paid_up
        applies_to: [managed_reinstated]
        kind: authorization
        condition: Reinstatement may be recorded only after every invoice past its due date has been paid in full.
        evidence_fields: [managed_billing.managed_agreement_id, managed_billing.invoice_number, managed_billing.event_type, managed_billing.amount_usd, managed_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.managed_agreement_id]]
          action_bindings: {managed_billing.managed_agreement_id: managed_agreement_id}
    measures: [managed_msr_late_fee_waivers_12m, managed_msr_invoice_unpaid_balance]
    params:
      courtesy_waivers_per_12_months: 1
    formula:
      amount_usd: max(round(late_fee_pct_monthly / 100 * managed_msr_invoice_unpaid_balance, 2), late_fee_minimum_usd)

  - id: managed_payment_application
    subject: [managed_payment]
    rule: >-
      A payment is applied to the invoice its remittance names; when the remittance names no invoice it is applied to the
      oldest open invoice first, by posted date and then by invoice number, and any remainder to the next oldest, posting one
      payment entry per invoice applied. Partial payments are accepted and leave the rest of the invoice open. An amount
      beyond every open invoice stays on the agreement as a credit balance against future invoices. Card payments are
      accepted only for an invoice whose total does not exceed card_payment_max_usd; larger invoices are paid by ACH, wire or
      check. A remittance reference is applied to a given invoice only once.
    eligibility:
      - id: one_application_per_invoice
        applies_to: [managed_payment]
        kind: dedup
        condition: A remittance reference is applied to a given invoice only once.
        evidence_fields: [managed_billing.payment_reference, managed_billing.invoice_number, managed_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.payment_reference, managed_billing.invoice_number]]
          action_bindings: {managed_billing.payment_reference: payment_reference, managed_billing.invoice_number: invoice_number}
        dedup_contract:
          table: managed_billing
          mode: separate_record
          object_bindings: {payment_reference: payment_reference, invoice_number: invoice_number}
          duplicate_filters: {event_type: [managed_payment]}
          distinct_fields: []

  - id: managed_renewal_and_uplift
    subject: [managed_renewed, managed_notice_given, managed_offboarding_started]
    rule: >-
      At the end of a term an agreement whose auto_renew is true renews for renewal_term_months unless a signed non-renewal
      notice stands. A non-renewal notice stops the next renewal only when it is received no later than notice_days calendar
      days before the current term ends. The notice deadline is term_end_date minus notice_days calendar days, and a notice
      received on the deadline itself is timely. A non-renewal notice received after the deadline does not stop the coming
      renewal; it is recorded with a termination_effective_date equal to the end of the renewal term that follows. A timely
      non-renewal notice carries a termination_effective_date equal to the current term_end_date and no fee. The renewal
      term starts the day after the expiring term_end_date. Its seat_rate_usd is the expiring seat_rate_usd increased by
      renewal_uplift_cap_pct percent, rounded half up to the cent, unless the tier's current seat_rate_list_usd reduced by
      its term_discount_pct for the renewal term length is lower, in which case the lower rate applies. Its contracted_seats
      equal seat_count on the expiring term_end_date, but never less than the tier's min_seats. A renewal may be recorded
      only while the agreement status is active or suspended. An agreement whose auto_renew is false and that has no signed
      renewal on file does not renew; at its term end it moves to the transition-out.
    eligibility:
      - id: timely_non_renewal
        applies_to: [managed_notice_given]
        kind: time
        condition: A non-renewal notice stops the next renewal only when it is received no later than notice_days calendar days before the current term ends.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.term_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the current term ends
          anchor_source: managed_agreements.term_end_date
          relation: not_after
          duration_source: variants.notice_days
          unit: calendar_days
          counting_rule: The notice deadline is term_end_date minus notice_days calendar days, and a notice received on the deadline itself is timely.
          boundary: inclusive
      - id: renewal_status
        applies_to: [managed_renewed]
        kind: state
        condition: A renewal may be recorded only while the agreement status is active or suspended.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active, suspended]
    formula:
      uplifted_rate: round(seat_rate_usd * (1 + renewal_uplift_cap_pct / 100), 2)
      list_rate: round(seat_rate_list_usd * (1 - term_discount_pct / 100), 2)
      seat_rate_usd: min(uplifted_rate, list_rate)
      contracted_seats: max(seat_count, min_seats)

  - id: managed_early_termination_and_exit
    subject: [managed_notice_given, managed_early_termination_fee, managed_notice_withdrawn, managed_credit_memo, managed_offboarding_started, managed_closed]
    rule: >-
      A client may end the agreement before the term ends by a signed early termination notice. Its
      termination_effective_date is the later of the date the client asks for and the notice_received_date plus notice_days
      calendar days; a requested date after term_end_date is a non-renewal, not an early termination. The early termination
      fee equals early_termination_fee_pct percent of seat_rate_usd times the minimum-commitment floor seats times the number
      of service months that begin after the termination_effective_date and on or before term_end_date, rounded half up to
      the cent; it is invoiced on the date the notice takes effect on the agreement. Non-renewal notices carry no fee. A
      notice may be withdrawn by the client only before the termination effective date. Withdrawal is possible up to and
      including the day before termination_effective_date, counted in calendar days. On withdrawal of an early termination
      notice the early termination fee is reversed in full by a credit memo against that fee entry. A charge is reversed by
      credit memo at most once. At the termination effective date the transition-out begins: the tier's
      transition_assistance_included_hours are provided at no charge, and further transition assistance is quoted under a
      project statement of work at transition_assistance_rate_usd per hour. The agreement closes when the transition-out is
      complete; the client may request an export of retained documentation and configurations within
      data_return_window_days calendar days after closing. Unapplied service credits are forfeited at closing, and any
      balance due remains collectible.
    eligibility:
      - id: withdraw_before_effective
        applies_to: [managed_notice_withdrawn]
        kind: time
        condition: A notice may be withdrawn by the client only before the termination effective date.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.termination_effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the termination effective date
          anchor_source: managed_agreements.termination_effective_date
          relation: not_after
          duration_source: params.withdrawal_lead_days
          unit: calendar_days
          counting_rule: Withdrawal is possible up to and including the day before termination_effective_date, counted in calendar days.
          boundary: inclusive
      - id: one_reversal_per_charge
        applies_to: [managed_credit_memo]
        kind: dedup
        condition: A charge is reversed by credit memo at most once.
        evidence_fields: [managed_billing.original_billing_entry_id, managed_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_billing.original_billing_entry_id]]
          action_bindings: {managed_billing.original_billing_entry_id: original_billing_entry_id}
        dedup_contract:
          table: managed_billing
          mode: separate_record
          object_bindings: {original_billing_entry_id: original_billing_entry_id}
          duplicate_filters: {event_type: [managed_credit_memo]}
          distinct_fields: []
    params:
      withdrawal_lead_days: 1

  - id: managed_tier_change
    subject: [managed_tier_changed]
    rule: >-
      A tier change takes effect only from the client's signed change request. An upgrade to a higher-ranked tier takes
      effect on the first day of the calendar month after the signature; a downgrade to a lower-ranked tier takes effect only
      on the first day of a renewal term, because tier_downgrade_mid_term_allowed is false on every tier. The new
      seat_rate_usd is the new tier's seat_rate_list_usd reduced by the new tier's term_discount_pct for the current
      term_months, rounded half up to the cent; when the new tier does not offer the current term length, the discount of the
      longest term it offers that does not exceed the current term applies, or none if there is no such term. seat_count on
      the effective date must meet the new tier's min_seats, and an upgrade to ClearPath Premier or ClearPath Enterprise
      needs an active Sentinel Managed Security subscription. A tier change neither restarts the term nor changes
      contracted_seats, generates no onboarding fee, and is never prorated: the monthly fee of the effective month onward
      uses the new rate. A tier change may take effect only while the agreement status is active.
    eligibility:
      - id: tier_change_active
        applies_to: [managed_tier_changed]
        kind: state
        condition: A tier change may take effect only while the agreement status is active.
        evidence_fields: [managed_agreements.managed_agreement_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.managed_agreement_id]]
          action_bindings: {managed_agreements.managed_agreement_id: managed_agreement_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active]
    formula:
      seat_rate_usd: round(seat_rate_list_usd * (1 - term_discount_pct / 100), 2)

  - id: managed_client_signed_changes
    subject: [managed_notice_given, managed_notice_withdrawn, managed_tier_changed, managed_cancelled]
    rule: >-
      Notices of non-renewal, early termination notices, withdrawals of a notice, tier changes and cancellations before
      onboarding change the client's contract and take effect only on the authorized contact's e-signature. The service desk
      registers each as a service request carrying the request type, the target tier for a tier change, and the effective
      date computed under this charter, pending the client's signature; it never applies the change itself. A contract
      change request may be registered only on behalf of the client's authorized contact after identity verification has
      passed. Once signed, the request takes effect through the matching agreement change; a request the client does not
      sign within the signature_validity_days calendar days after registration lapses as withdrawn.
    eligibility:
      - id: verified_contact
        applies_to: [managed_notice_given, managed_notice_withdrawn, managed_tier_changed, managed_cancelled]
        kind: authorization
        condition: A contract change request may be registered only on behalf of the client's authorized contact after identity verification has passed.
        evidence_fields: [identity_verifications.customer_id, identity_verifications.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[identity_verifications.customer_id]]
          action_bindings: {identity_verifications.customer_id: customer_id}
    params:
      signature_validity_days: 14

# ============================================================================
# extended_policies (managed_services_agreements)
# ============================================================================
extended_policies:
- id: managed_ext_auto_renewal_rate
  base_policy_refs:
  - managed_renewal_and_uplift
  overwrite:
  - base_policy: managed_renewal_and_uplift
    superseded_clause: Its seat_rate_usd is the expiring seat_rate_usd increased by renewal_uplift_cap_pct percent, rounded
      half up to the cent, unless the tier's current seat_rate_list_usd reduced by its term_discount_pct for the renewal
      term length is lower, in which case the lower rate applies.
    replaced_by: 'For an automatic renewal, meaning an agreement whose auto_renew is true rolling into its renewal term
      at term end, and only for such a renewal, the renewal seat_rate_usd is set by the renewal pricing schedule of this
      paragraph; a renewal under a signed renewal on an agreement whose auto_renew is false remains under the base rule:
      its seat_rate_usd is the expiring seat_rate_usd increased by renewal_uplift_cap_pct percent, rounded half up to the
      cent, unless the tier''s current seat_rate_list_usd reduced by its term_discount_pct for the renewal term length is
      lower, in which case the lower rate applies.'
  trigger: state_due
  subject:
  - managed_renewed
  computes: seat_rate_usd
  target_tool: record_renewal_term_69c0d348
  params:
    first_renewal_uplift_reduction_pts: 2.0
    long_tenure_uplift_reduction_pts: 1.0
    rate_hold_min_tenure_months: 60
    growth_high_pct: 25
    growth_mid_pct: 10
    growth_high_adj_pct: 1.0
    growth_mid_adj_pct: 0.5
    sla_credits_high_count: 3
    sla_high_adj_pct: 1.5
    sla_mid_adj_pct: 0.75
    late_fees_high_count: 3
    standing_high_adj_pct: 1.0
    standing_mid_adj_pct: 0.5
    intensity_high_tickets_per_seat: 3
    intensity_high_adj_pct: 1.0
    intensity_low_adj_pct: 0.5
    loyalty_ceiling_pct: 2.0
  rule: 'For an automatic renewal, meaning an agreement whose auto_renew is true rolling into its renewal term at term end,
    and only for such a renewal, the renewal seat_rate_usd is set by the renewal pricing schedule of this paragraph; a renewal
    under a signed renewal on an agreement whose auto_renew is false remains under the base rule: its seat_rate_usd is the
    expiring seat_rate_usd increased by renewal_uplift_cap_pct percent, rounded half up to the cent, unless the tier''s
    current seat_rate_list_usd reduced by its term_discount_pct for the renewal term length is lower, in which case the
    lower rate applies. The renewal term is renewal_term_months long, and a 12-month renewal term carries no term discount
    on any tier. A whole month between two dates is counted only once the later date reaches the same day of the month as
    the earlier one, and a month window of N months ending today takes the entries dated fewer than N whole months before
    today. An agreement never suspended has no suspended_date and was not suspended during the expiring term. The uplifted
    renewal rate is the expiring seat_rate_usd increased by the renewal uplift percentage, rounded half up to the cent,
    and the renewal list rate is the tier''s current seat_rate_list_usd, rounded half up to the cent. The standard renewal
    uplift percentage is renewal_uplift_cap_pct, and the standard renewal rate is the lower of the uplifted renewal rate
    and the renewal list rate. The renewal uplift percentage follows the first-renewal and long-tenure uplift schedule:
    on the first renewal (renewal_count is 0) of an expiring term that runs 24 months or more, counted in whole months from
    term_start_date to term_end_date plus one, it is renewal_uplift_cap_pct less first_renewal_uplift_reduction_pts points;
    on an agreement with three or more renewals already recorded it is renewal_uplift_cap_pct less long_tenure_uplift_reduction_pts
    points; on any other renewal it is renewal_uplift_cap_pct. Which candidate becomes the renewal rate follows the renewal
    price-protection rule: when the agreement was suspended for non-payment during the expiring term (its suspended_date
    falls on or after term_start_date), price protection is lost and the renewal rate is the uplifted renewal rate with
    no list comparison; when the agreement was not suspended during the expiring term and has been live rate_hold_min_tenure_months
    months or more by term_end_date (whole months from go_live_date), the renewal rate is the lowest of the uplifted renewal
    rate, the renewal list rate and the expiring seat_rate_usd increased by loyalty_ceiling_pct percent, rounded half up
    to the cent; otherwise the renewal rate is the lower of the uplifted renewal rate and the renewal list rate. The seat-growth
    adjustment of the renewal rate compares the covered seats on the seat ledger (every seat addition less every seat removal)
    with contracted_seats: the adjustment is graduated: each covered seat from the first that is at least growth_mid_pct
    percent above contracted_seats earns growth_mid_adj_pct percent, each covered seat from the first that is at least growth_high_pct
    percent above earns growth_high_adj_pct percent instead, and the earned percentages are summed and divided by the covered
    seats to give the percentage taken off; with no covered seat that far above contracted_seats nothing is taken off. The
    service-level adjustment of the renewal rate counts the service credits posted on the agreement in the last 12 months
    (a month window ending today): sla_credits_high_count or more take sla_high_adj_pct percent off; one up to sla_credits_high_count
    less one take sla_mid_adj_pct percent off; none takes nothing off. The payment-standing adjustment of the renewal rate
    counts the late fees posted on the agreement in the last 12 months (a month window ending today): late_fees_high_count
    or more add standing_high_adj_pct percent; one up to late_fees_high_count less one add standing_mid_adj_pct percent;
    none adds nothing. The service-intensity adjustment of the renewal rate compares the tickets opened on the agreement
    in the last 12 months (a month window ending today) with seat_count: intensity_high_tickets_per_seat or more tickets
    per seat of seat_count add intensity_high_adj_pct percent; fewer tickets than seat_count take intensity_low_adj_pct
    percent off; anything between adds nothing. The schedules of this paragraph change the standard renewal rate in one
    fixed order: a value or a method a schedule selects replaces the standard one first; the percentage adjustments are
    then combined into one net percentage, additions positive and reductions negative, applied once and rounded half up
    to the cent; the cap applies last, the result never exceeding the expiring seat_rate_usd increased by renewal_uplift_cap_pct
    percent, rounded half up to the cent. The renewal is recorded at term end with term_start_date the day after the expiring
    term_end_date, term_months equal to renewal_term_months, contracted_seats equal to seat_count on the expiring term_end_date
    but never less than the tier''s min_seats, and renewal_count increased by one.'
  compute:
  - term_span_months: MONTHS(F('term_start_date'), F('term_end_date')) + 1
  - uplift_pct: (P('renewal_uplift_cap_pct') - K('first_renewal_uplift_reduction_pts')) if (F('renewal_count') == 0 and
      term_span_months >= 24) else ((P('renewal_uplift_cap_pct') - K('long_tenure_uplift_reduction_pts')) if F('renewal_count')
      >= 3 else P('renewal_uplift_cap_pct'))
  - suspended_in_term: F('suspended_date') != '' and DAYS(F('term_start_date'), F('suspended_date')) >= 0
  - live_months: MONTHS(F('go_live_date'), F('term_end_date'))
  - protection_rule: 2 if suspended_in_term else (3 if live_months >= K('rate_hold_min_tenure_months') else 1)
  - growth_mid_seat: int(-((0 - F('contracted_seats') * (100 + K('growth_mid_pct'))) // 100))
  - growth_high_seat: int(-((0 - F('contracted_seats') * (100 + K('growth_high_pct'))) // 100))
  - covered_seats: SUM('managed_seat_changes', 'seat_qty', event_type='managed_seat_add') - SUM('managed_seat_changes',
      'seat_qty', event_type='managed_seat_remove')
  - growth_adj: (K('growth_mid_adj_pct') * (growth_high_seat - growth_mid_seat) + K('growth_high_adj_pct') * (covered_seats
      - growth_high_seat + 1)) / covered_seats if covered_seats >= growth_high_seat else (K('growth_mid_adj_pct') * (covered_seats
      - growth_mid_seat + 1) / covered_seats if covered_seats >= growth_mid_seat else 0)
  - sla_credits_12m: COUNT('managed_billing', within_months=12, date_field='posted_date', event_type='managed_sla_credit')
  - sla_adj: K('sla_high_adj_pct') if sla_credits_12m >= K('sla_credits_high_count') else (K('sla_mid_adj_pct') if sla_credits_12m
      >= 1 else 0)
  - late_fees_12m: COUNT('managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')
  - standing_adj: K('standing_high_adj_pct') if late_fees_12m >= K('late_fees_high_count') else (K('standing_mid_adj_pct')
      if late_fees_12m >= 1 else 0)
  - tickets_12m: COUNT('managed_tickets', within_months=12, date_field='event_at', event_type='managed_ticket_opened')
  - intensity_adj: K('intensity_high_adj_pct') if tickets_12m >= K('intensity_high_tickets_per_seat') * F('seat_count')
      else ((0 - K('intensity_low_adj_pct')) if tickets_12m < F('seat_count') else 0)
  - list_rate: RND(P('seat_rate_list_usd'))
  - cap_rate: RND(F('seat_rate_usd') * (1 + P('renewal_uplift_cap_pct') / 100))
  - result: MN(RND((RND(F('seat_rate_usd') * (1 + uplift_pct / 100)) if protection_rule == 2 else (MN(RND(F('seat_rate_usd')
      * (1 + uplift_pct / 100)), list_rate, RND(F('seat_rate_usd') * (1 + K('loyalty_ceiling_pct') / 100))) if protection_rule
      == 3 else MN(RND(F('seat_rate_usd') * (1 + uplift_pct / 100)), list_rate))) * (1 + (standing_adj + intensity_adj -
      growth_adj - sla_adj) / 100)), cap_rate)
  compute_basis:
    term_span_months: on the first renewal (renewal_count is 0) of an expiring term that runs 24 months or more, counted
      in whole months from term_start_date to term_end_date plus one
    uplift_pct: 'The renewal uplift percentage follows the first-renewal and long-tenure uplift schedule: on the first renewal
      (renewal_count is 0) of an expiring term that runs 24 months or more, counted in whole months from term_start_date
      to term_end_date plus one, it is renewal_uplift_cap_pct less first_renewal_uplift_reduction_pts points; on an agreement
      with three or more renewals already recorded it is renewal_uplift_cap_pct less long_tenure_uplift_reduction_pts points;
      on any other renewal it is renewal_uplift_cap_pct.'
    suspended_in_term: when the agreement was suspended for non-payment during the expiring term (its suspended_date falls
      on or after term_start_date)
    live_months: has been live rate_hold_min_tenure_months months or more by term_end_date (whole months from go_live_date)
    protection_rule: 'Which candidate becomes the renewal rate follows the renewal price-protection rule: when the agreement
      was suspended for non-payment during the expiring term (its suspended_date falls on or after term_start_date), price
      protection is lost and the renewal rate is the uplifted renewal rate with no list comparison; when the agreement was
      not suspended during the expiring term and has been live rate_hold_min_tenure_months months or more by term_end_date
      (whole months from go_live_date), the renewal rate is the lowest of the uplifted renewal rate, the renewal list rate
      and the expiring seat_rate_usd increased by loyalty_ceiling_pct percent, rounded half up to the cent; otherwise the
      renewal rate is the lower of the uplifted renewal rate and the renewal list rate.'
    covered_seats: The seat-growth adjustment of the renewal rate compares the covered seats on the seat ledger (every seat
      addition less every seat removal) with contracted_seats
    growth_adj: 'the adjustment is graduated: each covered seat from the first that is at least growth_mid_pct percent above
      contracted_seats earns growth_mid_adj_pct percent, each covered seat from the first that is at least growth_high_pct
      percent above earns growth_high_adj_pct percent instead, and the earned percentages are summed and divided by the
      covered seats to give the percentage taken off; with no covered seat that far above contracted_seats nothing is taken
      off.'
    sla_credits_12m: The service-level adjustment of the renewal rate counts the service credits posted on the agreement
      in the last 12 months (a month window ending today)
    sla_adj: sla_credits_high_count or more take sla_high_adj_pct percent off; one up to sla_credits_high_count less one
      take sla_mid_adj_pct percent off; none takes nothing off.
    late_fees_12m: The payment-standing adjustment of the renewal rate counts the late fees posted on the agreement in the
      last 12 months (a month window ending today)
    standing_adj: late_fees_high_count or more add standing_high_adj_pct percent; one up to late_fees_high_count less one
      add standing_mid_adj_pct percent; none adds nothing.
    tickets_12m: The service-intensity adjustment of the renewal rate compares the tickets opened on the agreement in the
      last 12 months (a month window ending today) with seat_count
    intensity_adj: intensity_high_tickets_per_seat or more tickets per seat of seat_count add intensity_high_adj_pct percent;
      fewer tickets than seat_count take intensity_low_adj_pct percent off; anything between adds nothing.
    list_rate: the renewal list rate is the tier's current seat_rate_list_usd, rounded half up to the cent.
    cap_rate: the cap applies last, the result never exceeding the expiring seat_rate_usd increased by renewal_uplift_cap_pct
      percent, rounded half up to the cent.
    result: 'The schedules of this paragraph change the standard renewal rate in one fixed order: a value or a method a
      schedule selects replaces the standard one first; the percentage adjustments are then combined into one net percentage,
      additions positive and reductions negative, applied once and rounded half up to the cent; the cap applies last, the
      result never exceeding the expiring seat_rate_usd increased by renewal_uplift_cap_pct percent, rounded half up to
      the cent.'
    growth_mid_seat: each covered seat from the first that is at least growth_mid_pct percent above contracted_seats earns
      growth_mid_adj_pct percent
    growth_high_seat: each covered seat from the first that is at least growth_high_pct percent above earns growth_high_adj_pct
      percent instead
  factors:
  - id: first_renewal_uplift_schedule
    effect: parameter
    decides: uplift_pct
    bindings:
    - term_span_months
    - uplift_pct
    ladder:
    - when: first renewal (renewal_count 0) of an expiring term of 24 months or more
      value: renewal_uplift_cap_pct less K('first_renewal_uplift_reduction_pts')
    - when: three or more renewals already recorded
      value: renewal_uplift_cap_pct less K('long_tenure_uplift_reduction_pts')
    - when: otherwise
      value: P('renewal_uplift_cap_pct')
    baseline:
      uplift_pct: P('renewal_uplift_cap_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: price_protection_rule
    effect: method
    decides: protection_rule
    bindings:
    - suspended_in_term
    - live_months
    - protection_rule
    ladder:
    - when: suspended for non-payment during the expiring term
      method: the renewal rate is the uplifted renewal rate, with no list comparison
    - when: not suspended during the expiring term and live rate_hold_min_tenure_months months or more by term_end_date
      method: the lowest of the uplifted renewal rate, the renewal list rate and the expiring seat_rate_usd increased by
        loyalty_ceiling_pct percent
    - when: otherwise
      method: the renewal rate is the lower of the uplifted renewal rate and the renewal list rate
    baseline:
      protection_rule: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: seat_growth_adjustment
    effect: parameter
    decides: growth_adj
    bindings:
    - covered_seats
    - growth_adj
    ladder:
    - when: covered seats at least growth_high_pct percent above contracted_seats
      value: 'graduated: growth_high_adj_pct per covered seat from the first at least growth_high_pct percent above contracted_seats,
        plus growth_mid_adj_pct per seat in the band below, averaged over the covered seats'
    - when: covered seats at least growth_mid_pct but under growth_high_pct percent above contracted_seats
      value: 'graduated: growth_mid_adj_pct per covered seat from the first at least growth_mid_pct percent above contracted_seats,
        averaged over the covered seats'
    - when: otherwise
      value: '0'
    baseline:
      growth_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: service_level_renewal_adjustment
    effect: parameter
    decides: sla_adj
    bindings:
    - sla_credits_12m
    - sla_adj
    ladder:
    - when: sla_credits_high_count or more service credits posted in the last 12 months
      value: K('sla_high_adj_pct') off
    - when: one up to sla_credits_high_count less one service credits in the last 12 months
      value: K('sla_mid_adj_pct') off
    - when: otherwise
      value: '0'
    baseline:
      sla_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: payment_standing_renewal_adjustment
    effect: parameter
    decides: standing_adj
    bindings:
    - late_fees_12m
    - standing_adj
    ladder:
    - when: late_fees_high_count or more late fees posted in the last 12 months
      value: K('standing_high_adj_pct') added
    - when: one up to late_fees_high_count less one late fees in the last 12 months
      value: K('standing_mid_adj_pct') added
    - when: otherwise
      value: '0'
    baseline:
      standing_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: service_intensity_renewal_adjustment
    effect: parameter
    decides: intensity_adj
    bindings:
    - tickets_12m
    - intensity_adj
    ladder:
    - when: tickets opened in the last 12 months at least intensity_high_tickets_per_seat per seat of seat_count
      value: K('intensity_high_adj_pct') added
    - when: fewer tickets opened in the last 12 months than seat_count
      value: K('intensity_low_adj_pct') off
    - when: otherwise
      value: '0'
    baseline:
      intensity_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The renewal term is renewal_term_months long, and a 12-month renewal term carries no term discount on any tier.
      The uplifted renewal rate is the expiring seat_rate_usd increased by the renewal uplift percentage, rounded half up
      to the cent, and the renewal list rate is the tier's current seat_rate_list_usd, rounded half up to the cent. The
      standard renewal uplift percentage is renewal_uplift_cap_pct, and the standard renewal rate is the lower of the uplifted
      renewal rate and the renewal list rate.
    params:
    - renewal_uplift_cap_pct
    - seat_rate_list_usd
    - renewal_term_months
  prerequisite: []
  cross_category: []
  inputs:
    history:
    - table: managed_seat_changes
      aggregate: sum
      field: seat_qty
      filters:
        event_type: managed_seat_add
    - table: managed_seat_changes
      aggregate: sum
      field: seat_qty
      filters:
        event_type: managed_seat_remove
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 12
      filters:
        event_type: managed_sla_credit
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 12
      filters:
        event_type: managed_late_fee
    - table: managed_tickets
      aggregate: count
      field: managed_ticket_event_id
      within_months: 12
      filters:
        event_type: managed_ticket_opened
    cross_category: []
- id: managed_ext_current_month_fee
  base_policy_refs:
  - managed_monthly_fee_calc
  overwrite:
  - base_policy: managed_monthly_fee_calc
    superseded_clause: The monthly fee for a service month is invoiced in advance on monthly_invoice_day of that month and
      equals seat_rate_usd times the billed seats, rounded half up to the cent.
    replaced_by: 'For the monthly fee of the current service month (the calendar month of today''s date) on an agreement
      whose seat ledger records no seat change taking effect between the first day of that month and the day the fee is
      posted and whose client holds at most one active Microsoft 365 F3 subscription and at most one active Microsoft 365
      Business Premium subscription, and only for such a fee, the fee is invoiced in advance on monthly_invoice_day of that
      month and is the seat amount after the monthly seat-pricing schedule of this paragraph plus any server management
      fee; every other monthly fee remains under the base rule: it is invoiced in advance on monthly_invoice_day of that
      month and equals seat_rate_usd times the billed seats, rounded half up to the cent.'
  trigger: state_due
  subject:
  - managed_monthly_fee
  computes: amount_usd
  target_tool: post_monthly_fee_19cc11da
  params:
    volume_large_seats: 75
    volume_mid_seats: 40
    volume_large_pct: 4.0
    volume_mid_pct: 2.0
    security_long_term_months: 36
    security_full_pct: 3.0
    security_partial_pct: 1.5
    frontline_group_min: 10
    frontline_rate_pct: 50
    servers_volume_min: 5
    server_fee_volume_usd: 50.0
    server_fee_standard_usd: 60.0
    backup_appliance_pct: 2.0
    backup_cloud_pct: 1.0
    csp_full_pct: 1.5
    csp_partial_pct: 0.75
    frontline_user_fee_usd: 11.5
  rule: 'For the monthly fee of the current service month (the calendar month of today''s date) on an agreement whose seat
    ledger records no seat change taking effect between the first day of that month and the day the fee is posted and whose
    client holds at most one active Microsoft 365 F3 subscription and at most one active Microsoft 365 Business Premium
    subscription, and only for such a fee, the fee is invoiced in advance on monthly_invoice_day of that month and is the
    seat amount after the monthly seat-pricing schedule of this paragraph plus any server management fee; every other monthly
    fee remains under the base rule: it is invoiced in advance on monthly_invoice_day of that month and equals seat_rate_usd
    times the billed seats, rounded half up to the cent. The monthly fee of a service month is fixed only after the agreement''s
    current term covers the first day of that service month, its term end date falling on or after that day. The minimum-commitment
    floor is contracted_seats times min_seat_commitment_pct divided by 100, rounded up to a whole seat, and the billed seats
    are the greater of seat_count and that floor. The standard seat amount is seat_rate_usd times the billed seats, and
    the standard monthly fee is that seat amount rounded half up to the cent. The volume price break on the monthly fee
    reads the billed seats for the break, which are the covered seats on the seat ledger (every seat addition less every
    seat removal) or the minimum-commitment floor, whichever is greater: the break is graduated: each billed seat from the
    volume_mid_seats-th up to the volume_large_seats-th less one earns volume_mid_pct percent off, each billed seat from
    the volume_large_seats-th up earns volume_large_pct percent off, and the earned percentages are summed and divided by
    the billed seats to give the percentage taken off; with fewer than volume_mid_seats billed seats nothing is taken off.
    The Sentinel bundle credit on the monthly fee reads the client''s active Sentinel Managed Security subscription and
    the endpoints enrolled on the client''s Sentinel ledger (every enrollment less every retirement): an active subscription
    on a term of security_long_term_months months or more whose enrolled endpoints are at least seat_count takes security_full_pct
    percent off; any other active subscription, on a shorter term or with fewer enrolled endpoints than seat_count, takes
    security_partial_pct percent off; no active subscription takes nothing off. How frontline users are billed in the monthly
    fee follows the frontline seat rule, which reads the license_qty of the client''s active Microsoft 365 F3 subscription:
    with frontline_group_min or more F3 licenses, those seats are taken out of the billed seats, the remaining billed seats
    are billed at seat_rate_usd, each of the first frontline_group_min less one frontline users is billed frontline_user_fee_usd
    and each further frontline user is billed at frontline_rate_pct percent of seat_rate_usd; with one up to frontline_group_min
    less one F3 licenses, those seats are taken out of the billed seats, the remaining billed seats are billed at seat_rate_usd
    and each frontline user is billed frontline_user_fee_usd, never more than seat_rate_usd; with no active F3 subscription,
    every billed seat is billed at seat_rate_usd. The F3 seats so treated never exceed the billed seats. The server management
    fee added to the monthly fee reads the servers enrolled on the client''s Sentinel ledger (every server enrollment less
    every server retirement): servers_volume_min or more servers are charged server_fee_volume_usd each; one up to servers_volume_min
    less one are charged server_fee_standard_usd each; none are charged nothing. The Continuum bundle credit on the monthly
    fee reads the client''s active Continuum Backup & Recovery plan: a plan whose tier includes a local appliance takes
    backup_appliance_pct percent off; an active plan whose tier includes none takes backup_cloud_pct percent off; no active
    plan takes nothing off. The CSP licensing credit on the monthly fee reads the license_qty of the client''s active Microsoft
    365 Business Premium subscription: at least seat_count licenses take csp_full_pct percent off; one up to seat_count
    less one take csp_partial_pct percent off; no active Business Premium subscription takes nothing off. The schedules
    of this paragraph change the standard monthly fee in one fixed order: a value or a method a schedule selects replaces
    the standard one first; the percentage credits are then added into one combined percentage, applied once and rounded
    half up to the cent; flat charges are added last. Payment is due invoice_due_days calendar days after the posted date.'
  compute:
  - floor_seats: int(-((0 - F('contracted_seats') * P('min_seat_commitment_pct')) // 100))
  - billed_seats: MX(F('seat_count'), floor_seats)
  - covered_seats: SUM('managed_seat_changes', 'seat_qty', event_type='managed_seat_add') - SUM('managed_seat_changes',
      'seat_qty', event_type='managed_seat_remove')
  - volume_pct: (K('volume_mid_pct') * (K('volume_large_seats') - K('volume_mid_seats')) + K('volume_large_pct') * (MX(covered_seats,
      floor_seats) - K('volume_large_seats') + 1)) / MX(covered_seats, floor_seats) if MX(covered_seats, floor_seats) >=
      K('volume_large_seats') else (K('volume_mid_pct') * (MX(covered_seats, floor_seats) - K('volume_mid_seats') + 1) /
      MX(covered_seats, floor_seats) if MX(covered_seats, floor_seats) >= K('volume_mid_seats') else 0)
  - security_term: CFIELD('security', 'term_months', status='active')
  - security_endpoints: XSUM('security', 'security_endpoint_changes', 'endpoint_qty', event_type='security_endpoints_enrolled')
      - XSUM('security', 'security_endpoint_changes', 'endpoint_qty', event_type='security_endpoints_retired')
  - security_pct: K('security_full_pct') if (security_term != None and security_term >= K('security_long_term_months') and
      security_endpoints >= F('seat_count')) else (K('security_partial_pct') if (security_term != None and (security_term
      < K('security_long_term_months') or security_endpoints < F('seat_count'))) else 0)
  - f3_licenses: CFIELD('licensing', 'license_qty', status='active', variant_name='Microsoft 365 F3')
  - frontline_rule: 2 if (f3_licenses != None and f3_licenses >= K('frontline_group_min')) else (3 if (f3_licenses != None
      and f3_licenses >= 1) else 1)
  - servers: XSUM('security', 'security_endpoint_changes', 'endpoint_qty', event_type='security_endpoints_enrolled', device_class='server')
      - XSUM('security', 'security_endpoint_changes', 'endpoint_qty', event_type='security_endpoints_retired', device_class='server')
  - server_fee_each: K('server_fee_volume_usd') if servers >= K('servers_volume_min') else (K('server_fee_standard_usd')
      if servers >= 1 else 0)
  - backup_appliance: CPARAM('backup', 'local_appliance_included', status='active')
  - backup_pct: K('backup_appliance_pct') if backup_appliance == True else (K('backup_cloud_pct') if backup_appliance ==
      False else 0)
  - premium_licenses: CFIELD('licensing', 'license_qty', status='active', variant_name='Microsoft 365 Business Premium')
  - csp_pct: K('csp_full_pct') if (premium_licenses != None and premium_licenses >= F('seat_count')) else (K('csp_partial_pct')
      if (premium_licenses != None and premium_licenses >= 1) else 0)
  - result: RND(RND((F('seat_rate_usd') * (billed_seats - MN(f3_licenses, billed_seats)) + K('frontline_user_fee_usd') *
      MN(MN(f3_licenses, billed_seats), K('frontline_group_min') - 1) + F('seat_rate_usd') * MX(MN(f3_licenses, billed_seats)
      - K('frontline_group_min') + 1, 0) * K('frontline_rate_pct') / 100 if frontline_rule == 2 else (F('seat_rate_usd')
      * (billed_seats - MN(f3_licenses, billed_seats)) + MN(K('frontline_user_fee_usd'), F('seat_rate_usd')) * MN(f3_licenses,
      billed_seats) if frontline_rule == 3 else F('seat_rate_usd') * billed_seats)) * (1 - (volume_pct + security_pct +
      backup_pct + csp_pct) / 100)) + servers * server_fee_each)
  compute_basis:
    floor_seats: The minimum-commitment floor is contracted_seats times min_seat_commitment_pct divided by 100, rounded
      up to a whole seat
    billed_seats: the billed seats are the greater of seat_count and that floor.
    covered_seats: The volume price break on the monthly fee reads the billed seats for the break, which are the covered
      seats on the seat ledger (every seat addition less every seat removal) or the minimum-commitment floor, whichever
      is greater
    volume_pct: 'the break is graduated: each billed seat from the volume_mid_seats-th up to the volume_large_seats-th less
      one earns volume_mid_pct percent off, each billed seat from the volume_large_seats-th up earns volume_large_pct percent
      off, and the earned percentages are summed and divided by the billed seats to give the percentage taken off; with
      fewer than volume_mid_seats billed seats nothing is taken off.'
    security_term: The Sentinel bundle credit on the monthly fee reads the client's active Sentinel Managed Security subscription
    security_endpoints: the endpoints enrolled on the client's Sentinel ledger (every enrollment less every retirement)
    security_pct: an active subscription on a term of security_long_term_months months or more whose enrolled endpoints
      are at least seat_count takes security_full_pct percent off; any other active subscription, on a shorter term or with
      fewer enrolled endpoints than seat_count, takes security_partial_pct percent off; no active subscription takes nothing
      off.
    f3_licenses: How frontline users are billed in the monthly fee follows the frontline seat rule, which reads the license_qty
      of the client's active Microsoft 365 F3 subscription
    frontline_rule: with frontline_group_min or more F3 licenses, those seats are taken out of the billed seats, the remaining
      billed seats are billed at seat_rate_usd, each of the first frontline_group_min less one frontline users is billed
      frontline_user_fee_usd and each further frontline user is billed at frontline_rate_pct percent of seat_rate_usd; with
      one up to frontline_group_min less one F3 licenses, those seats are taken out of the billed seats, the remaining billed
      seats are billed at seat_rate_usd and each frontline user is billed frontline_user_fee_usd, never more than seat_rate_usd;
      with no active F3 subscription, every billed seat is billed at seat_rate_usd. The F3 seats so treated never exceed
      the billed seats.
    servers: The server management fee added to the monthly fee reads the servers enrolled on the client's Sentinel ledger
      (every server enrollment less every server retirement)
    server_fee_each: servers_volume_min or more servers are charged server_fee_volume_usd each; one up to servers_volume_min
      less one are charged server_fee_standard_usd each; none are charged nothing.
    backup_appliance: The Continuum bundle credit on the monthly fee reads the client's active Continuum Backup & Recovery
      plan
    backup_pct: a plan whose tier includes a local appliance takes backup_appliance_pct percent off; an active plan whose
      tier includes none takes backup_cloud_pct percent off; no active plan takes nothing off.
    premium_licenses: The CSP licensing credit on the monthly fee reads the license_qty of the client's active Microsoft
      365 Business Premium subscription
    csp_pct: at least seat_count licenses take csp_full_pct percent off; one up to seat_count less one take csp_partial_pct
      percent off; no active Business Premium subscription takes nothing off.
    result: 'The schedules of this paragraph change the standard monthly fee in one fixed order: a value or a method a schedule
      selects replaces the standard one first; the percentage credits are then added into one combined percentage, applied
      once and rounded half up to the cent; flat charges are added last.'
  factors:
  - id: seat_volume_price_break
    effect: parameter
    decides: volume_pct
    bindings:
    - covered_seats
    - volume_pct
    ladder:
    - when: volume_large_seats or more billed seats (covered seats or the floor if greater)
      value: 'graduated: volume_mid_pct for each billed seat from the volume_mid_seats-th, volume_large_pct for each billed
        seat from the volume_large_seats-th, averaged over the billed seats'
    - when: volume_mid_seats up to volume_large_seats less one billed seats
      value: 'graduated: volume_mid_pct for each billed seat from the volume_mid_seats-th, averaged over the billed seats'
    - when: otherwise
      value: '0'
    baseline:
      volume_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: sentinel_bundle_credit
    effect: parameter
    decides: security_pct
    bindings:
    - security_term
    - security_endpoints
    - security_pct
    ladder:
    - when: active Sentinel subscription on a term of security_long_term_months or more AND enrolled endpoints at least
        seat_count
      value: K('security_full_pct') off
    - when: active Sentinel subscription AND (shorter term OR enrolled endpoints below seat_count)
      value: K('security_partial_pct') off
    - when: otherwise
      value: '0'
    baseline:
      security_pct: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: security
  - id: frontline_seat_rule
    effect: method
    decides: frontline_rule
    bindings:
    - f3_licenses
    - frontline_rule
    ladder:
    - when: active Microsoft 365 F3 subscription with frontline_group_min or more licenses
      method: those seats taken out of the billed seats, the rest at seat_rate_usd, frontline_user_fee_usd for each of the
        first frontline_group_min less one frontline users and frontline_rate_pct percent of seat_rate_usd for each further
        one
    - when: active Microsoft 365 F3 subscription with one up to frontline_group_min less one licenses
      method: those seats taken out of the billed seats, the rest at seat_rate_usd, frontline_user_fee_usd for each frontline
        user, never more than seat_rate_usd
    - when: otherwise
      method: every billed seat at seat_rate_usd
    baseline:
      frontline_rule: '1'
    evidence:
    - cross_category
    cross_difficulty: licensing
  - id: server_management_charge
    effect: parameter
    decides: server_fee_each
    bindings:
    - servers
    - server_fee_each
    ladder:
    - when: servers_volume_min or more servers enrolled on the Sentinel ledger
      value: K('server_fee_volume_usd') per server
    - when: one up to servers_volume_min less one servers enrolled
      value: K('server_fee_standard_usd') per server
    - when: otherwise
      value: '0'
    baseline:
      server_fee_each: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: security
  - id: continuum_bundle_credit
    effect: parameter
    decides: backup_pct
    bindings:
    - backup_appliance
    - backup_pct
    ladder:
    - when: active Continuum plan whose tier includes a local appliance
      value: K('backup_appliance_pct') off
    - when: active Continuum plan whose tier includes no local appliance
      value: K('backup_cloud_pct') off
    - when: otherwise
      value: '0'
    baseline:
      backup_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: backup
  - id: csp_licensing_credit
    effect: parameter
    decides: csp_pct
    bindings:
    - premium_licenses
    - csp_pct
    ladder:
    - when: active Microsoft 365 Business Premium subscription with at least seat_count licenses
      value: K('csp_full_pct') off
    - when: active Microsoft 365 Business Premium subscription with one up to seat_count less one licenses
      value: K('csp_partial_pct') off
    - when: otherwise
      value: '0'
    baseline:
      csp_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: licensing
  baseline:
    rule: The minimum-commitment floor is contracted_seats times min_seat_commitment_pct divided by 100, rounded up to a
      whole seat, and the billed seats are the greater of seat_count and that floor. The standard seat amount is seat_rate_usd
      times the billed seats, and the standard monthly fee is that seat amount rounded half up to the cent.
    params:
    - min_seat_commitment_pct
  prerequisite:
  - problem: managed_ext_auto_renewal_rate
    kind: value_input
    gate: result
    form: state
    policy_source: The monthly fee of a service month is fixed only after the agreement's current term covers the first
      day of that service month, its term end date falling on or after that day.
    condition: managed_agreements.term_end_date is on or after the first day of the service month being invoiced, the renewal
      term having been recorded with its renewal seat_rate_usd and contracted_seats.
    resolved_by: record_renewal_term_69c0d348
    effect: Once the renewal term is recorded, seat_rate_usd carries the renewal rate and contracted_seats the renewal commitment,
      so the floor and every seat-amount tier are worked out on the term in force for the service month.
  cross_category:
  - category: security
    as: history
    reads:
    - status
    - term_months
    - security_endpoint_changes.endpoint_qty
    note: Sentinel bundle credit and server management charge tiers come from the active subscription and its endpoint ledger.
  - category: licensing
    as: branch
    reads:
    - status
    - variant_name
    - license_qty
    note: Frontline seat rule and CSP licensing credit tiers come from the active F3 and Business Premium subscriptions.
  - category: backup
    as: branch
    reads:
    - status
    - variant_name
    note: Continuum bundle credit tier comes from the active plan's tier.
  inputs:
    history:
    - table: managed_seat_changes
      aggregate: sum
      field: seat_qty
      filters:
        event_type: managed_seat_add
    - table: managed_seat_changes
      aggregate: sum
      field: seat_qty
      filters:
        event_type: managed_seat_remove
    - category: security
      table: security_endpoint_changes
      aggregate: sum
      field: endpoint_qty
      filters:
        event_type: security_endpoints_enrolled
    cross_category:
    - security
    - licensing
    - backup
- id: managed_ext_reinstatement_charge
  base_policy_refs:
  - managed_late_fee_and_suspension
  overwrite:
  - base_policy: managed_late_fee_and_suspension
    superseded_clause: The reinstatement fee of reinstatement_fee_usd is invoiced on the reinstatement date and falls due
      under the normal terms.
    replaced_by: For the reinstatement of an agreement suspended for non-payment, and for every such reinstatement, the
      reinstatement fee is the reinstatement schedule of this paragraph applied to reinstatement_fee_usd, invoiced on the
      reinstatement date and falling due under the normal terms.
  trigger: state_due
  subject:
  - managed_reinstated
  - managed_reinstatement_fee
  computes: reinstatement_fee_usd
  target_tool: record_reinstatement_be1b3a76
  params:
    relief_window_months: 24
    relief_payments_min: 9
    relief_payment_window_months: 12
    relief_tenured_share_pct: 50
    relief_new_share_pct: 75
    revalidation_long_days: 30
    revalidation_mid_days: 15
    revalidation_per_seat_usd: 2.5
    revalidation_flat_usd: 150.0
    cure_fast_days: 14
    cure_mid_days: 30
    cure_fast_pct: 25
    cure_mid_pct: 10
    monitoring_hunting_pct: 20
    monitoring_basic_pct: 10
  rule: 'For the reinstatement of an agreement suspended for non-payment, and for every such reinstatement, the reinstatement
    fee is the reinstatement schedule of this paragraph applied to reinstatement_fee_usd, invoiced on the reinstatement
    date and falling due under the normal terms. A whole month between two dates is counted only once the later date reaches
    the same day of the month as the earlier one, and a month window of N months ending today takes the entries dated fewer
    than N whole months before today. Reinstatement is recorded once every invoice past its due date has been paid in full;
    recording it returns the agreement to active, sets reinstated_date to the reinstatement date and invoices the reinstatement
    fee. The standard reinstatement fee is the tier''s reinstatement_fee_usd, rounded half up to the cent. The first-suspension
    relief on the reinstatement fee reads the reinstatement fees already posted on the agreement in the last relief_window_months
    months (a month window ending today) and the payments posted on the agreement in the last relief_payment_window_months
    months (a month window ending today): with no earlier reinstatement fee in that window and relief_payments_min or more
    payments, relief_tenured_share_pct percent of the fee is charged; with no earlier reinstatement fee in that window and
    fewer payments, relief_new_share_pct percent is charged; with an earlier reinstatement fee in that window the whole
    fee is charged. How the reinstatement fee is built follows the environment re-validation rule, which counts the calendar
    days from suspended_date to today: after revalidation_long_days days or more of suspension, the fee is reinstatement_fee_usd
    plus one flat revalidation_flat_usd plus revalidation_per_seat_usd for every seat of seat_count; after revalidation_mid_days
    up to revalidation_long_days less one days, it is reinstatement_fee_usd plus one flat revalidation_flat_usd; after a
    shorter suspension it is reinstatement_fee_usd alone. The cure-speed reduction of the reinstatement fee counts the calendar
    days from suspended_date to the posted date of the latest payment on the agreement: cure_fast_days days or fewer take
    cure_fast_pct percent off; more than cure_fast_days up to cure_mid_days days take cure_mid_pct percent off; a later
    cure, or no payment, takes nothing off, and a latest payment posted before suspended_date counts as no payment. The
    monitoring-continuity reduction of the reinstatement fee reads the client''s active Sentinel Managed Security subscription:
    one whose tier includes threat hunting takes monitoring_hunting_pct percent off; an active subscription whose tier does
    not takes monitoring_basic_pct percent off; no active subscription takes nothing off. The schedules of this paragraph
    change the standard reinstatement fee in one fixed order: a value or a method a schedule selects replaces the standard
    one first; the share of the fee to be charged is applied next; the percentage reductions are then added into one combined
    percentage, applied once, and the result is rounded half up to the cent.'
  compute:
  - prior_reinstatements: COUNT('managed_billing', within_months=K('relief_window_months'), date_field='posted_date', event_type='managed_reinstatement_fee')
  - payments_recent: COUNT('managed_billing', within_months=K('relief_payment_window_months'), date_field='posted_date',
      event_type='managed_payment')
  - relief_share_pct: K('relief_tenured_share_pct') if (prior_reinstatements == 0 and payments_recent >= K('relief_payments_min'))
      else (K('relief_new_share_pct') if (prior_reinstatements == 0 and payments_recent < K('relief_payments_min')) else
      100)
  - days_suspended: DAYS(F('suspended_date'), NOW)
  - revalidation_rule: 3 if days_suspended >= K('revalidation_long_days') else (2 if days_suspended >= K('revalidation_mid_days')
      else 1)
  - latest_payment_date: LATEST('managed_billing', 'posted_date', date_field='posted_date', event_type='managed_payment')
  - cure_days: DAYS(F('suspended_date'), latest_payment_date) if (latest_payment_date != None and DAYS(F('suspended_date'),
      latest_payment_date) >= 0) else 9999
  - cure_pct: K('cure_fast_pct') if cure_days <= K('cure_fast_days') else (K('cure_mid_pct') if cure_days <= K('cure_mid_days')
      else 0)
  - hunting: CPARAM('security', 'threat_hunting', status='active')
  - monitoring_pct: K('monitoring_hunting_pct') if hunting == True else (K('monitoring_basic_pct') if hunting == False else
      0)
  - result: RND((P('reinstatement_fee_usd') + K('revalidation_flat_usd') + K('revalidation_per_seat_usd') * F('seat_count')
      if revalidation_rule == 3 else (P('reinstatement_fee_usd') + K('revalidation_flat_usd') if revalidation_rule == 2
      else P('reinstatement_fee_usd'))) * relief_share_pct / 100 * (1 - (cure_pct + monitoring_pct) / 100))
  compute_basis:
    prior_reinstatements: The first-suspension relief on the reinstatement fee reads the reinstatement fees already posted
      on the agreement in the last relief_window_months months (a month window ending today)
    payments_recent: the payments posted on the agreement in the last relief_payment_window_months months (a month window
      ending today)
    relief_share_pct: with no earlier reinstatement fee in that window and relief_payments_min or more payments, relief_tenured_share_pct
      percent of the fee is charged; with no earlier reinstatement fee in that window and fewer payments, relief_new_share_pct
      percent is charged; with an earlier reinstatement fee in that window the whole fee is charged.
    days_suspended: How the reinstatement fee is built follows the environment re-validation rule, which counts the calendar
      days from suspended_date to today
    revalidation_rule: after revalidation_long_days days or more of suspension, the fee is reinstatement_fee_usd plus one
      flat revalidation_flat_usd plus revalidation_per_seat_usd for every seat of seat_count; after revalidation_mid_days
      up to revalidation_long_days less one days, it is reinstatement_fee_usd plus one flat revalidation_flat_usd; after
      a shorter suspension it is reinstatement_fee_usd alone.
    latest_payment_date: The cure-speed reduction of the reinstatement fee counts the calendar days from suspended_date
      to the posted date of the latest payment on the agreement
    cure_days: a later cure, or no payment, takes nothing off, and a latest payment posted before suspended_date counts
      as no payment.
    cure_pct: cure_fast_days days or fewer take cure_fast_pct percent off; more than cure_fast_days up to cure_mid_days
      days take cure_mid_pct percent off; a later cure, or no payment, takes nothing off
    hunting: The monitoring-continuity reduction of the reinstatement fee reads the client's active Sentinel Managed Security
      subscription
    monitoring_pct: one whose tier includes threat hunting takes monitoring_hunting_pct percent off; an active subscription
      whose tier does not takes monitoring_basic_pct percent off; no active subscription takes nothing off.
    result: 'The schedules of this paragraph change the standard reinstatement fee in one fixed order: a value or a method
      a schedule selects replaces the standard one first; the share of the fee to be charged is applied next; the percentage
      reductions are then added into one combined percentage, applied once, and the result is rounded half up to the cent.'
  factors:
  - id: first_suspension_relief
    effect: parameter
    decides: relief_share_pct
    bindings:
    - prior_reinstatements
    - payments_recent
    - relief_share_pct
    ladder:
    - when: no earlier reinstatement fee in the last relief_window_months months AND relief_payments_min or more payments
        in the last relief_payment_window_months months
      value: K('relief_tenured_share_pct') percent of the fee
    - when: no earlier reinstatement fee in the last relief_window_months months AND fewer payments in that payment window
      value: K('relief_new_share_pct') percent of the fee
    - when: otherwise
      value: 100 percent of the fee
    baseline:
      relief_share_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: environment_revalidation_rule
    effect: method
    decides: revalidation_rule
    bindings:
    - days_suspended
    - revalidation_rule
    ladder:
    - when: suspended revalidation_long_days days or more
      method: reinstatement_fee_usd plus one flat revalidation_flat_usd plus revalidation_per_seat_usd times seat_count
    - when: suspended revalidation_mid_days up to revalidation_long_days less one days
      method: reinstatement_fee_usd plus one flat revalidation_flat_usd
    - when: otherwise
      method: reinstatement_fee_usd alone
    baseline:
      revalidation_rule: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: cure_speed_reduction
    effect: parameter
    decides: cure_pct
    bindings:
    - latest_payment_date
    - cure_days
    - cure_pct
    ladder:
    - when: latest payment cure_fast_days days or fewer after suspended_date
      value: K('cure_fast_pct') percent off
    - when: latest payment more than cure_fast_days up to cure_mid_days days after suspended_date
      value: K('cure_mid_pct') percent off
    - when: otherwise
      value: '0'
    baseline:
      cure_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: monitoring_continuity_reduction
    effect: parameter
    decides: monitoring_pct
    bindings:
    - hunting
    - monitoring_pct
    ladder:
    - when: active Sentinel subscription whose tier includes threat hunting
      value: K('monitoring_hunting_pct') percent off
    - when: active Sentinel subscription whose tier does not include threat hunting
      value: K('monitoring_basic_pct') percent off
    - when: otherwise
      value: '0'
    baseline:
      monitoring_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: security
  baseline:
    rule: The standard reinstatement fee is the tier's reinstatement_fee_usd, rounded half up to the cent.
    params:
    - reinstatement_fee_usd
  prerequisite: []
  cross_category:
  - category: security
    as: branch
    reads:
    - status
    - variant_name
    note: Monitoring-continuity reduction tier comes from the active Sentinel subscription's tier (threat hunting included
      or not).
  inputs:
    history:
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 24
      filters:
        event_type: managed_reinstatement_fee
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 12
      filters:
        event_type: managed_payment
    - table: managed_billing
      aggregate: latest
      field: posted_date
      filters:
        event_type: managed_payment
    cross_category:
    - security
- id: managed_ext_signed_exit_fee
  base_policy_refs:
  - managed_renewal_and_uplift
  - managed_early_termination_and_exit
  - managed_client_signed_changes
  overwrite:
  - base_policy: managed_early_termination_and_exit
    superseded_clause: The early termination fee equals early_termination_fee_pct percent of seat_rate_usd times the minimum-commitment
      floor seats times the number of service months that begin after the termination_effective_date and on or before term_end_date,
      rounded half up to the cent; it is invoiced on the date the notice takes effect on the agreement.
    replaced_by: For the early termination fee of an early termination notice that the authorized contact signs on an agreement
      with exactly one early termination request awaiting signature, whose requested date is at least notice_days calendar
      days after the signing date and so is the later of the date the client asks for and the notice_received_date plus
      notice_days, and only for such a fee, the fee is the exit-fee schedule of this paragraph, invoiced on the date the
      signed notice takes effect on the agreement; every other early termination fee remains under the base rule, early_termination_fee_pct
      percent of seat_rate_usd times the minimum-commitment floor seats times the number of service months that begin after
      the termination_effective_date and on or before term_end_date, rounded half up to the cent, invoiced on the date the
      notice takes effect on the agreement.
  trigger: on_request
  subject:
  - managed_notice_given
  - managed_early_termination_fee
  computes: early_termination_fee_usd
  target_tool: sign_early_termination_notice_6477ae2a
  params:
    tenure_long_months: 36
    tenure_mid_months: 24
    tenure_long_reduction_pts: 20
    tenure_mid_reduction_pts: 10
    recent_fee_months: 3
    security_retention_long_days: 365
    security_retention_long_pct: 15.0
    security_retention_short_pct: 7.0
    sla_exit_months: 6
    sla_exit_high_count: 3
    sla_exit_high_pct: 25.0
    sla_exit_mid_pct: 10.0
    notice_lead_long_days: 120
    notice_lead_mid_days: 75
    notice_lead_long_pct: 10.0
    notice_lead_mid_pct: 5.0
    backup_retention_long_days: 365
    backup_retention_long_pct: 5.0
    backup_retention_short_pct: 2.5
  rule: 'For the early termination fee of an early termination notice that the authorized contact signs on an agreement
    with exactly one early termination request awaiting signature, whose requested date is at least notice_days calendar
    days after the signing date and so is the later of the date the client asks for and the notice_received_date plus notice_days,
    and only for such a fee, the fee is the exit-fee schedule of this paragraph, invoiced on the date the signed notice
    takes effect on the agreement; every other early termination fee remains under the base rule, early_termination_fee_pct
    percent of seat_rate_usd times the minimum-commitment floor seats times the number of service months that begin after
    the termination_effective_date and on or before term_end_date, rounded half up to the cent, invoiced on the date the
    notice takes effect on the agreement. The notice signed is the agreement''s early termination request awaiting the client''s
    signature; signing it marks the request signed, puts the notice on the agreement with notice_type early_termination,
    the signing date as notice_received_date and the request''s effective date as termination_effective_date, and invoices
    the fee; with no such request awaiting signature there is no notice to sign and no fee. A whole month between two dates
    is counted only once the later date reaches the same day of the month as the earlier one, and a month window of N months
    ending today takes the entries dated fewer than N whole months before today. An early termination notice is recorded
    only once the agreement''s status is active. The early termination fee is fixed only after the agreement carries the
    term in force on the day the notice is signed, its term end date falling on or after that day. The early termination
    fee is not worked out until the ledger carries the monthly fee of every service month begun before the notice is signed.
    The months charged are the term months remaining after the termination effective date: term_months less the term months
    begun on or before that date, which are the whole months from term_start_date to the termination effective date plus
    one, and never fewer than zero. The minimum-commitment floor is contracted_seats times min_seat_commitment_pct divided
    by 100, rounded up to a whole seat. The standard exit fee is early_termination_fee_pct percent of seat_rate_usd times
    the floor seats times the months charged, rounded half up to the cent. The exit-fee percentage of the early termination
    fee follows the tenure exit schedule, which counts the whole months from go_live_date to today: tenure_long_months or
    more months take tenure_long_reduction_pts points off early_termination_fee_pct; tenure_mid_months up to tenure_long_months
    less one months take tenure_mid_reduction_pts points off; fewer months leave early_termination_fee_pct as it is. The
    monthly basis of the early termination fee follows the exit billing-basis rule, which reads the monthly fees posted
    in the last recent_fee_months months (a month window ending today) and the covered seats on the seat ledger (every seat
    addition less every seat removal): when three or more monthly fees were posted in that window and the covered seats
    exceed the floor, the basis is the average of the monthly fees posted in that window, their sum divided by their number;
    when fewer than three were posted and the covered seats exceed the floor, the basis is seat_rate_usd times the covered
    seats; otherwise the basis is seat_rate_usd times the floor seats. The security-retention reduction of the early termination
    fee reads the term_end_date of the client''s active Sentinel Managed Security subscription and counts the calendar days
    from the termination effective date to it: security_retention_long_days days or more take security_retention_long_pct
    percent off; zero up to security_retention_long_days less one days take security_retention_short_pct percent off; a
    subscription ending before the termination effective date, or no active subscription, takes nothing off. The service-failure
    reduction of the early termination fee counts the service credits posted on the agreement in the last sla_exit_months
    months (a month window ending today): sla_exit_high_count or more take sla_exit_high_pct percent off; one up to sla_exit_high_count
    less one take sla_exit_mid_pct percent off; none takes nothing off. The notice-lead reduction of the early termination
    fee counts the calendar days from today to the termination effective date: notice_lead_long_days or more take notice_lead_long_pct
    percent off; notice_lead_mid_days up to notice_lead_long_days less one take notice_lead_mid_pct percent off; fewer take
    nothing off. The backup-retention reduction of the early termination fee reads the term_end_date of the client''s active
    Continuum Backup & Recovery plan and counts the calendar days from the termination effective date to it: backup_retention_long_days
    days or more take backup_retention_long_pct percent off; zero up to backup_retention_long_days less one days take backup_retention_short_pct
    percent off; a plan ending before the termination effective date, or no active plan, takes nothing off. The schedules
    of this paragraph change the standard exit fee in one fixed order: a value or a method a schedule selects replaces the
    standard one first; the percentage reductions are then added into one combined percentage, applied once, and the result
    is rounded half up to the cent.'
  compute:
  - effective_date: LATEST('managed_service_requests', 'requested_effective_date', date_field='created_at', request_type='early_termination_notice',
      request_status='pending_client_signature')
  - months_charged: MX(F('term_months') - (MONTHS(F('term_start_date'), effective_date) + 1), 0) if effective_date != None
      else 0
  - floor_seats: int(-((0 - F('contracted_seats') * P('min_seat_commitment_pct')) // 100))
  - months_live: MONTHS(F('go_live_date'), NOW)
  - exit_pct: (P('early_termination_fee_pct') - K('tenure_long_reduction_pts')) if months_live >= K('tenure_long_months')
      else ((P('early_termination_fee_pct') - K('tenure_mid_reduction_pts')) if months_live >= K('tenure_mid_months') else
      P('early_termination_fee_pct'))
  - recent_fee_count: COUNT('managed_billing', within_months=K('recent_fee_months'), date_field='posted_date', event_type='managed_monthly_fee')
  - ledger_seats: SUM('managed_seat_changes', 'seat_qty', event_type='managed_seat_add') - SUM('managed_seat_changes', 'seat_qty',
      event_type='managed_seat_remove')
  - basis_rule: 2 if (recent_fee_count >= 3 and ledger_seats > floor_seats) else (3 if (recent_fee_count < 3 and ledger_seats
      > floor_seats) else 1)
  - recent_fee_sum: SUM('managed_billing', 'amount_usd', within_months=K('recent_fee_months'), date_field='posted_date',
      event_type='managed_monthly_fee')
  - security_end: CFIELD('security', 'term_end_date', status='active')
  - security_days: DAYS(effective_date, security_end) if (security_end != None and effective_date != None) else -1
  - security_pct: K('security_retention_long_pct') if security_days >= K('security_retention_long_days') else (K('security_retention_short_pct')
      if security_days >= 0 else 0)
  - credits_recent: COUNT('managed_billing', within_months=K('sla_exit_months'), date_field='posted_date', event_type='managed_sla_credit')
  - sla_exit_pct: K('sla_exit_high_pct') if credits_recent >= K('sla_exit_high_count') else (K('sla_exit_mid_pct') if credits_recent
      >= 1 else 0)
  - lead_days: DAYS(NOW, effective_date) if effective_date != None else 0
  - lead_pct: K('notice_lead_long_pct') if lead_days >= K('notice_lead_long_days') else (K('notice_lead_mid_pct') if lead_days
      >= K('notice_lead_mid_days') else 0)
  - backup_end: CFIELD('backup', 'term_end_date', status='active')
  - backup_days: DAYS(effective_date, backup_end) if (backup_end != None and effective_date != None) else -1
  - backup_exit_pct: K('backup_retention_long_pct') if backup_days >= K('backup_retention_long_days') else (K('backup_retention_short_pct')
      if backup_days >= 0 else 0)
  - result: RND(exit_pct / 100 * (recent_fee_sum / recent_fee_count if basis_rule == 2 else (F('seat_rate_usd') * ledger_seats
      if basis_rule == 3 else F('seat_rate_usd') * floor_seats)) * months_charged * (1 - (security_pct + sla_exit_pct +
      lead_pct + backup_exit_pct) / 100))
  compute_basis:
    effective_date: the request's effective date as termination_effective_date
    months_charged: 'The months charged are the term months remaining after the termination effective date: term_months
      less the term months begun on or before that date, which are the whole months from term_start_date to the termination
      effective date plus one, and never fewer than zero.'
    floor_seats: The minimum-commitment floor is contracted_seats times min_seat_commitment_pct divided by 100, rounded
      up to a whole seat.
    months_live: The exit-fee percentage of the early termination fee follows the tenure exit schedule, which counts the
      whole months from go_live_date to today
    exit_pct: tenure_long_months or more months take tenure_long_reduction_pts points off early_termination_fee_pct; tenure_mid_months
      up to tenure_long_months less one months take tenure_mid_reduction_pts points off; fewer months leave early_termination_fee_pct
      as it is.
    recent_fee_count: The monthly basis of the early termination fee follows the exit billing-basis rule, which reads the
      monthly fees posted in the last recent_fee_months months (a month window ending today)
    ledger_seats: the covered seats on the seat ledger (every seat addition less every seat removal)
    basis_rule: when three or more monthly fees were posted in that window and the covered seats exceed the floor, the basis
      is the average of the monthly fees posted in that window, their sum divided by their number; when fewer than three
      were posted and the covered seats exceed the floor, the basis is seat_rate_usd times the covered seats; otherwise
      the basis is seat_rate_usd times the floor seats.
    recent_fee_sum: the basis is the average of the monthly fees posted in that window, their sum divided by their number
    security_end: The security-retention reduction of the early termination fee reads the term_end_date of the client's
      active Sentinel Managed Security subscription
    security_days: counts the calendar days from the termination effective date to it
    security_pct: security_retention_long_days days or more take security_retention_long_pct percent off; zero up to security_retention_long_days
      less one days take security_retention_short_pct percent off; a subscription ending before the termination effective
      date, or no active subscription, takes nothing off.
    credits_recent: The service-failure reduction of the early termination fee counts the service credits posted on the
      agreement in the last sla_exit_months months (a month window ending today)
    sla_exit_pct: sla_exit_high_count or more take sla_exit_high_pct percent off; one up to sla_exit_high_count less one
      take sla_exit_mid_pct percent off; none takes nothing off.
    lead_days: The notice-lead reduction of the early termination fee counts the calendar days from today to the termination
      effective date
    lead_pct: notice_lead_long_days or more take notice_lead_long_pct percent off; notice_lead_mid_days up to notice_lead_long_days
      less one take notice_lead_mid_pct percent off; fewer take nothing off.
    backup_end: The backup-retention reduction of the early termination fee reads the term_end_date of the client's active
      Continuum Backup & Recovery plan
    backup_days: counts the calendar days from the termination effective date to it
    backup_exit_pct: backup_retention_long_days days or more take backup_retention_long_pct percent off; zero up to backup_retention_long_days
      less one days take backup_retention_short_pct percent off; a plan ending before the termination effective date, or
      no active plan, takes nothing off.
    result: 'The schedules of this paragraph change the standard exit fee in one fixed order: a value or a method a schedule
      selects replaces the standard one first; the percentage reductions are then added into one combined percentage, applied
      once, and the result is rounded half up to the cent.'
  factors:
  - id: tenure_exit_schedule
    effect: parameter
    decides: exit_pct
    bindings:
    - months_live
    - exit_pct
    ladder:
    - when: tenure_long_months or more whole months since go_live_date
      value: early_termination_fee_pct less K('tenure_long_reduction_pts') points
    - when: tenure_mid_months up to tenure_long_months less one months since go_live_date
      value: early_termination_fee_pct less K('tenure_mid_reduction_pts') points
    - when: otherwise
      value: P('early_termination_fee_pct')
    baseline:
      exit_pct: P('early_termination_fee_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: exit_billing_basis_rule
    effect: method
    decides: basis_rule
    bindings:
    - recent_fee_count
    - ledger_seats
    - basis_rule
    ladder:
    - when: three or more monthly fees posted in the last recent_fee_months months AND covered seats above the floor
      method: average of the monthly fees posted in that window (their sum divided by their number)
    - when: fewer than three monthly fees in that window AND covered seats above the floor
      method: seat_rate_usd times the covered seats
    - when: otherwise
      method: seat_rate_usd times the floor seats
    baseline:
      basis_rule: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: security_retention_reduction
    effect: parameter
    decides: security_pct
    bindings:
    - security_end
    - security_days
    - security_pct
    ladder:
    - when: active Sentinel subscription ending security_retention_long_days days or more after the termination effective
        date
      value: K('security_retention_long_pct') off
    - when: active Sentinel subscription ending zero up to security_retention_long_days less one days after it
      value: K('security_retention_short_pct') off
    - when: otherwise
      value: '0'
    baseline:
      security_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: security
  - id: service_failure_exit_reduction
    effect: parameter
    decides: sla_exit_pct
    bindings:
    - credits_recent
    - sla_exit_pct
    ladder:
    - when: sla_exit_high_count or more service credits in the last sla_exit_months months
      value: K('sla_exit_high_pct') off
    - when: one up to sla_exit_high_count less one service credits in that window
      value: K('sla_exit_mid_pct') off
    - when: otherwise
      value: '0'
    baseline:
      sla_exit_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: notice_lead_reduction
    effect: parameter
    decides: lead_pct
    bindings:
    - lead_days
    - lead_pct
    ladder:
    - when: notice_lead_long_days or more days from today to the termination effective date
      value: K('notice_lead_long_pct') off
    - when: notice_lead_mid_days up to notice_lead_long_days less one days
      value: K('notice_lead_mid_pct') off
    - when: otherwise
      value: '0'
    baseline:
      lead_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: backup_retention_reduction
    effect: parameter
    decides: backup_exit_pct
    bindings:
    - backup_end
    - backup_days
    - backup_exit_pct
    ladder:
    - when: active Continuum plan ending backup_retention_long_days days or more after the termination effective date
      value: K('backup_retention_long_pct') off
    - when: active Continuum plan ending zero up to backup_retention_long_days less one days after it
      value: K('backup_retention_short_pct') off
    - when: otherwise
      value: '0'
    baseline:
      backup_exit_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: backup
  baseline:
    rule: 'The months charged are the term months remaining after the termination effective date: term_months less the term
      months begun on or before that date, which are the whole months from term_start_date to the termination effective
      date plus one, and never fewer than zero. The minimum-commitment floor is contracted_seats times min_seat_commitment_pct
      divided by 100, rounded up to a whole seat. The standard exit fee is early_termination_fee_pct percent of seat_rate_usd
      times the floor seats times the months charged, rounded half up to the cent.'
    params:
    - early_termination_fee_pct
    - min_seat_commitment_pct
  prerequisite:
  - problem: managed_ext_reinstatement_charge
    kind: state_gate
    gate: managed_agreements.status
    form: state
    policy_source: An early termination notice is recorded only once the agreement's status is active.
    condition: managed_agreements.status is active on the agreement the notice is signed on.
    resolved_by: record_reinstatement_be1b3a76
    effect: Once the suspended agreement is reinstated its status is active, so the notice can move it from active to notice_given.
  - problem: managed_ext_auto_renewal_rate
    kind: value_input
    gate: months_charged
    form: state
    policy_source: The early termination fee is fixed only after the agreement carries the term in force on the day the
      notice is signed, its term end date falling on or after that day.
    condition: managed_agreements.term_end_date is on or after the signing date, the renewal term having been recorded with
      its term dates, term_months and renewal seat_rate_usd.
    resolved_by: record_renewal_term_69c0d348
    effect: Once the renewal term is recorded, term_start_date, term_months, seat_rate_usd and contracted_seats describe
      the term in force, so months_charged counts the months remaining in that term.
  - problem: managed_ext_current_month_fee
    kind: value_input
    gate: basis_rule
    form: state
    policy_source: The early termination fee is not worked out until the ledger carries the monthly fee of every service
      month begun before the notice is signed.
    condition: managed_billing holds a managed_monthly_fee entry for every service month that began before the signing date,
      the current month included.
    resolved_by: post_monthly_fee_19cc11da
    effect: Once the current month's fee is posted, the monthly fees counted in the recent window include it, so the exit
      billing-basis rule selects its tier on the full count and, in the average tier, averages that fee in.
  cross_category:
  - category: security
    as: branch
    reads:
    - status
    - term_end_date
    note: Security-retention reduction tier comes from the active Sentinel subscription's term end.
  - category: backup
    as: branch
    reads:
    - status
    - term_end_date
    note: Backup-retention reduction tier comes from the active Continuum plan's term end.
  inputs:
    history:
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 3
      filters:
        event_type: managed_monthly_fee
    - table: managed_billing
      aggregate: sum
      field: amount_usd
      within_months: 3
      filters:
        event_type: managed_monthly_fee
    - table: managed_billing
      aggregate: count
      field: managed_billing_entry_id
      within_months: 6
      filters:
        event_type: managed_sla_credit
    - table: managed_seat_changes
      aggregate: sum
      field: seat_qty
      filters:
        event_type: managed_seat_add
    - table: managed_service_requests
      aggregate: latest
      field: requested_effective_date
      filters:
        request_type: early_termination_notice
        request_status: pending_client_signature
    cross_category:
    - security
    - backup
- id: managed_ext_after_hours_remote_labor
  base_policy_refs:
  - managed_billable_labor_rates
  overwrite:
  - base_policy: managed_billable_labor_rates
    superseded_clause: The labor amount is billable minutes divided by 60 times remote_hourly_rate_usd or onsite_hourly_rate_usd,
      times after_hours_multiplier for after-hours labor, rounded half up to the cent, plus onsite_trip_charge_usd for each
      onsite visit that is wholly billable.
    replaced_by: 'For the remote after-hours labor of the agreement''s most recently resolved ticket whose labor class is
      remote after-hours and whose labor route is invoice, and only for that labor, the labor amount is set by the after-hours
      remote schedule of this paragraph; the labor of the agreement''s most recently resolved onsite business-hours ticket
      whose labor route is invoice follows the onsite visit schedule when that visit is wholly billable on a tier whose
      onsite_trip_charge_usd is above zero, and every other labor amount remains under the base rule: billable minutes divided
      by 60 times remote_hourly_rate_usd or onsite_hourly_rate_usd, times after_hours_multiplier for after-hours labor,
      rounded half up to the cent, plus onsite_trip_charge_usd for each onsite visit that is wholly billable.'
  trigger: state_due
  subject:
  - managed_billable_labor
  computes: amount_usd
  target_tool: post_remote_after_hours_labor_c0dca9e8
  params:
    callout_p1_minutes: 60
    courtesy_service_pct: 15.0
    courtesy_other_pct: 5.0
    soc_hunting_pct: 10.0
    soc_basic_pct: 5.0
    frequency_window_months: 6
    frequency_high_count: 3
    frequency_high_pct: 5.0
    frequency_mid_pct: 2.5
    tenure_long_months: 24
    tenure_mid_months: 12
    tenure_long_pct: 5.0
    tenure_mid_pct: 2.5
    sunday_uplift: 0.5
    saturday_uplift: 0.25
    callout_increment_minutes: 15
  rule: 'For the remote after-hours labor of the agreement''s most recently resolved ticket whose labor class is remote
    after-hours and whose labor route is invoice, and only for that labor, the labor amount is set by the after-hours remote
    schedule of this paragraph; the labor of the agreement''s most recently resolved onsite business-hours ticket whose
    labor route is invoice follows the onsite visit schedule when that visit is wholly billable on a tier whose onsite_trip_charge_usd
    is above zero, and every other labor amount remains under the base rule: billable minutes divided by 60 times remote_hourly_rate_usd
    or onsite_hourly_rate_usd, times after_hours_multiplier for after-hours labor, rounded half up to the cent, plus onsite_trip_charge_usd
    for each onsite visit that is wholly billable. The ticket priced is the one whose resolution milestone (labor class
    remote after-hours, labor route invoice) is the latest by its event_at (the service desk platform never stamps two resolutions
    of one agreement with the same minute), and its milestones supply the recorded billable minutes, the priority at resolution,
    the scope determination and the issue category recorded when it was opened; with no such ticket there is no labor to
    price and the amount is zero. The charge is billed on the next monthly invoice after the resolution, under the month
    the work was performed. The standard after-hours remote amount is the recorded billable minutes divided by 60, times
    remote_hourly_rate_usd, times after_hours_multiplier, rounded half up to the cent. The after-hours day multiplier of
    the after-hours remote amount reads the day of the week of the resolution: Sunday takes after_hours_multiplier plus
    sunday_uplift, Saturday takes after_hours_multiplier plus saturday_uplift, and any other day takes after_hours_multiplier.
    The tenure labor discount on the after-hours remote amount counts the whole months from go_live_date to today: tenure_long_months
    or more months take tenure_long_pct percent off; tenure_mid_months up to tenure_long_months less one take tenure_mid_pct
    percent off; fewer months take nothing off. How the minutes of the after-hours remote amount are billed follows the
    after-hours call-out rule, which reads the priority at resolution: a P1 ticket bills the greater of the recorded minutes
    and callout_p1_minutes, plus callout_increment_minutes; a P2 ticket bills the recorded minutes plus callout_increment_minutes;
    a P3 or P4 ticket bills the recorded minutes. The scope courtesy on the after-hours remote amount reads the ticket''s
    scope determination and issue category: a covered ticket whose category is outage, degraded_service or security_concern
    takes courtesy_service_pct percent off; a covered ticket of any other category takes courtesy_other_pct percent off;
    a billable_out_of_scope ticket takes nothing off. The SOC overlap reduction of the after-hours remote amount reads the
    client''s active Sentinel Managed Security subscription: one whose tier includes threat hunting takes soc_hunting_pct
    percent off; an active subscription whose tier does not takes soc_basic_pct percent off; no active subscription takes
    nothing off. The after-hours frequency reduction of the after-hours remote amount counts the agreement''s resolved tickets
    of labor class remote after-hours and labor route invoice in the last frequency_window_months months (a month window
    ending today, this ticket included): frequency_high_count or more take frequency_high_pct percent off; two up to frequency_high_count
    less one take frequency_mid_pct percent off; one takes nothing off. A whole month between two dates is counted only
    once the later date reaches the same day of the month as the earlier one, and a month window of N months ending today
    takes the entries dated fewer than N whole months before today. The schedules of this paragraph change the standard
    after-hours remote amount in one fixed order: a value or a method a schedule selects replaces the standard one first;
    the percentage reductions are then added into one combined percentage, applied once, and the result is rounded half
    up to the cent.'
  compute:
  - ticket: LATEST('managed_tickets', 'ticket_number', date_field='event_at', event_type='managed_ticket_resolved', labor_route='invoice',
      labor_class='remote_after_hours')
  - recorded_minutes: LATEST('managed_tickets', 'billable_minutes', date_field='event_at', event_type='managed_ticket_resolved',
      ticket_number=ticket)
  - resolved_at: LATEST('managed_tickets', 'event_at', date_field='event_at', event_type='managed_ticket_resolved', ticket_number=ticket)
  - weekday_index: DAYS('2026-01-04', resolved_at) % 7
  - day_multiplier: P('after_hours_multiplier') + K('sunday_uplift') if weekday_index == 0 else (P('after_hours_multiplier')
      + K('saturday_uplift') if weekday_index == 6 else P('after_hours_multiplier'))
  - months_live: MONTHS(F('go_live_date'), NOW)
  - tenure_pct: K('tenure_long_pct') if months_live >= K('tenure_long_months') else (K('tenure_mid_pct') if months_live
      >= K('tenure_mid_months') else 0)
  - priority_at_resolution: LATEST('managed_tickets', 'priority', date_field='event_at', event_type='managed_ticket_resolved',
      ticket_number=ticket)
  - callout_rule: 2 if priority_at_resolution == 'P1' else (3 if priority_at_resolution == 'P2' else 1)
  - scope_class: LATEST('managed_tickets', 'scope_class', date_field='event_at', event_type='managed_ticket_opened', ticket_number=ticket)
  - issue_category: LATEST('managed_tickets', 'issue_category', date_field='event_at', event_type='managed_ticket_opened',
      ticket_number=ticket)
  - courtesy_pct: K('courtesy_service_pct') if (scope_class == 'covered' and (issue_category == 'outage' or issue_category
      == 'degraded_service' or issue_category == 'security_concern')) else (K('courtesy_other_pct') if (scope_class == 'covered'
      and issue_category != 'outage' and issue_category != 'degraded_service' and issue_category != 'security_concern')
      else 0)
  - hunting: CPARAM('security', 'threat_hunting', status='active')
  - soc_pct: K('soc_hunting_pct') if hunting == True else (K('soc_basic_pct') if hunting == False else 0)
  - after_hours_tickets: COUNT('managed_tickets', within_months=K('frequency_window_months'), date_field='event_at', event_type='managed_ticket_resolved',
      labor_route='invoice', labor_class='remote_after_hours')
  - frequency_pct: K('frequency_high_pct') if after_hours_tickets >= K('frequency_high_count') else (K('frequency_mid_pct')
      if after_hours_tickets >= 2 else 0)
  - result: RND((MX(recorded_minutes, K('callout_p1_minutes')) + K('callout_increment_minutes') if callout_rule == 2 else
      (recorded_minutes + K('callout_increment_minutes') if callout_rule == 3 else recorded_minutes)) / 60 * P('remote_hourly_rate_usd')
      * day_multiplier * (1 - (tenure_pct + courtesy_pct + soc_pct + frequency_pct) / 100)) if ticket != None else 0
  compute_basis:
    ticket: The ticket priced is the one whose resolution milestone (labor class remote after-hours, labor route invoice)
      is the latest by its event_at (the service desk platform never stamps two resolutions of one agreement with the same
      minute)
    recorded_minutes: its milestones supply the recorded billable minutes, the priority at resolution, the scope determination
      and the issue category recorded when it was opened
    resolved_at: The after-hours day multiplier of the after-hours remote amount reads the day of the week of the resolution
    weekday_index: The after-hours day multiplier of the after-hours remote amount reads the day of the week of the resolution
    day_multiplier: Sunday takes after_hours_multiplier plus sunday_uplift, Saturday takes after_hours_multiplier plus saturday_uplift,
      and any other day takes after_hours_multiplier.
    months_live: The tenure labor discount on the after-hours remote amount counts the whole months from go_live_date to
      today
    priority_at_resolution: How the minutes of the after-hours remote amount are billed follows the after-hours call-out
      rule, which reads the priority at resolution
    callout_rule: a P1 ticket bills the greater of the recorded minutes and callout_p1_minutes, plus callout_increment_minutes;
      a P2 ticket bills the recorded minutes plus callout_increment_minutes; a P3 or P4 ticket bills the recorded minutes.
    scope_class: The scope courtesy on the after-hours remote amount reads the ticket's scope determination and issue category
    issue_category: The scope courtesy on the after-hours remote amount reads the ticket's scope determination and issue
      category
    courtesy_pct: a covered ticket whose category is outage, degraded_service or security_concern takes courtesy_service_pct
      percent off; a covered ticket of any other category takes courtesy_other_pct percent off; a billable_out_of_scope
      ticket takes nothing off.
    hunting: The SOC overlap reduction of the after-hours remote amount reads the client's active Sentinel Managed Security
      subscription
    soc_pct: one whose tier includes threat hunting takes soc_hunting_pct percent off; an active subscription whose tier
      does not takes soc_basic_pct percent off; no active subscription takes nothing off.
    after_hours_tickets: The after-hours frequency reduction of the after-hours remote amount counts the agreement's resolved
      tickets of labor class remote after-hours and labor route invoice in the last frequency_window_months months (a month
      window ending today, this ticket included)
    frequency_pct: frequency_high_count or more take frequency_high_pct percent off; two up to frequency_high_count less
      one take frequency_mid_pct percent off; one takes nothing off.
    result: 'The schedules of this paragraph change the standard after-hours remote amount in one fixed order: a value or
      a method a schedule selects replaces the standard one first; the percentage reductions are then added into one combined
      percentage, applied once, and the result is rounded half up to the cent.'
    tenure_pct: tenure_long_months or more months take tenure_long_pct percent off; tenure_mid_months up to tenure_long_months
      less one take tenure_mid_pct percent off; fewer months take nothing off.
  factors:
  - id: after_hours_day_multiplier
    effect: parameter
    decides: day_multiplier
    bindings:
    - resolved_at
    - weekday_index
    - day_multiplier
    ladder:
    - when: resolution on a Sunday
      value: P('after_hours_multiplier') + K('sunday_uplift')
    - when: resolution on a Saturday
      value: P('after_hours_multiplier') + K('saturday_uplift')
    - when: otherwise
      value: P('after_hours_multiplier')
    baseline:
      day_multiplier: P('after_hours_multiplier')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: tenure_labor_discount
    effect: parameter
    decides: tenure_pct
    bindings:
    - months_live
    - tenure_pct
    ladder:
    - when: tenure_long_months or more whole months since go_live_date
      value: K('tenure_long_pct') off
    - when: tenure_mid_months up to tenure_long_months less one months
      value: K('tenure_mid_pct') off
    - when: otherwise
      value: '0'
    baseline:
      tenure_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: after_hours_callout_rule
    effect: method
    decides: callout_rule
    bindings:
    - priority_at_resolution
    - callout_rule
    ladder:
    - when: priority P1 at resolution
      method: the greater of the recorded minutes and callout_p1_minutes, plus callout_increment_minutes
    - when: priority P2 at resolution
      method: the recorded minutes plus callout_increment_minutes
    - when: otherwise
      method: the recorded minutes
    baseline:
      callout_rule: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: remote_scope_courtesy
    effect: parameter
    decides: courtesy_pct
    bindings:
    - scope_class
    - issue_category
    - courtesy_pct
    ladder:
    - when: covered scope AND issue category outage, degraded_service or security_concern
      value: K('courtesy_service_pct') off
    - when: covered scope AND any other issue category
      value: K('courtesy_other_pct') off
    - when: otherwise
      value: '0'
    baseline:
      courtesy_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: soc_overlap_reduction
    effect: parameter
    decides: soc_pct
    bindings:
    - hunting
    - soc_pct
    ladder:
    - when: active Sentinel subscription whose tier includes threat hunting
      value: K('soc_hunting_pct') off
    - when: active Sentinel subscription whose tier does not include threat hunting
      value: K('soc_basic_pct') off
    - when: otherwise
      value: '0'
    baseline:
      soc_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: security
  - id: after_hours_frequency_reduction
    effect: parameter
    decides: frequency_pct
    bindings:
    - after_hours_tickets
    - frequency_pct
    ladder:
    - when: frequency_high_count or more such tickets in the window
      value: K('frequency_high_pct') off
    - when: two up to frequency_high_count less one such tickets
      value: K('frequency_mid_pct') off
    - when: otherwise
      value: '0'
    baseline:
      frequency_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The standard after-hours remote amount is the recorded billable minutes divided by 60, times remote_hourly_rate_usd,
      times after_hours_multiplier, rounded half up to the cent.
    params:
    - remote_hourly_rate_usd
    - after_hours_multiplier
  prerequisite: []
  cross_category:
  - category: security
    as: branch
    reads:
    - status
    - variant_name
    note: SOC overlap reduction tier comes from the active Sentinel subscription's tier (threat hunting included or not).
  inputs:
    history:
    - table: managed_tickets
      aggregate: latest
      field: billable_minutes
      filters:
        event_type: managed_ticket_resolved
        labor_route: invoice
        labor_class: remote_after_hours
    - table: managed_tickets
      aggregate: count
      field: managed_ticket_event_id
      within_months: 6
      filters:
        event_type: managed_ticket_resolved
        labor_route: invoice
        labor_class: remote_after_hours
    cross_category:
    - security
- id: managed_ext_onsite_visit_labor
  base_policy_refs:
