      minutes of its month remain for it) on a tier whose onsite_trip_charge_usd is above zero, and only for that visit,
      the labor amount is set by the onsite visit schedule of this paragraph; the labor of the agreement''s most recently
      resolved remote after-hours ticket whose labor route is invoice follows the after-hours remote schedule, a partly
      included visit stays under the base rule (only the excess is billable and the onsite minimum does not apply to that
      excess), and every other labor amount remains under the base rule: billable minutes divided by 60 times remote_hourly_rate_usd
      or onsite_hourly_rate_usd, times after_hours_multiplier for after-hours labor, rounded half up to the cent, plus onsite_trip_charge_usd
      for each onsite visit that is wholly billable.'
  trigger: state_due
  subject:
  - managed_billable_labor
  computes: amount_usd
  target_tool: post_onsite_visit_labor_c7936621
  params:
    visit_window_months: 6
    visits_waiver_count: 3
