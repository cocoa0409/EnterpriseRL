    ticket whose labor route is invoice follows the after-hours remote schedule, a partly included visit stays under the
    base rule (only the excess is billable and the onsite minimum does not apply to that excess), and every other labor
    amount remains under the base rule: billable minutes divided by 60 times remote_hourly_rate_usd or onsite_hourly_rate_usd,
    times after_hours_multiplier for after-hours labor, rounded half up to the cent, plus onsite_trip_charge_usd for each
    onsite visit that is wholly billable. The visit priced is the one whose resolution milestone (labor class onsite business-hours,
    labor route invoice) is the latest by its event_at (the service desk platform never stamps two resolutions of one agreement
    with the same minute), and its milestones supply the recorded billable minutes, the opening and resolution moments and
    the scope determination and issue category recorded when it was opened; with no such ticket there is no visit to price
    and the amount is zero. The charge is billed on the next monthly invoice after the resolution, under the month the work
    was performed. The standard onsite visit amount is the recorded billable minutes divided by 60 times onsite_hourly_rate_usd,
    rounded half up to the cent, plus onsite_trip_charge_usd for the wholly billable visit. The shared-trip schedule of
    the onsite visit amount counts the agreement''s resolved tickets of labor class onsite business-hours and labor route
    invoice in the last visit_window_months months (a month window ending today, this visit included): visits_waiver_count
    or more visits carry no trip charge; two up to visits_waiver_count less one carry trip_shared_pct percent of onsite_trip_charge_usd,
    rounded half up to the cent; a single visit carries onsite_trip_charge_usd. How the minutes of the onsite visit amount
    are billed follows the dispatch rule, which counts the calendar days from the ticket''s opening to its resolution: a
    visit resolved the same day the ticket was opened bills the greater of the recorded minutes plus next_day_block_minutes
    and same_day_minimum_minutes; a visit resolved the next day bills the recorded minutes plus next_day_block_minutes;
    a visit resolved later bills the recorded minutes. The tenure visit discount on the onsite visit labor counts the whole
    months from go_live_date to today: visit_tenure_long_months or more months take visit_tenure_long_pct percent off; visit_tenure_mid_months
    up to visit_tenure_long_months less one take visit_tenure_mid_pct percent off; fewer months take nothing off. The visit
    courtesy on the onsite visit labor reads the ticket''s scope determination and issue category: a covered ticket whose
