  - visits_recent: COUNT('managed_tickets', within_months=K('visit_window_months'), date_field='event_at', event_type='managed_ticket_resolved',
      labor_route='invoice', labor_class='onsite_business_hours')
  - trip_charge: 0 if visits_recent >= K('visits_waiver_count') else (RND(P('onsite_trip_charge_usd') * K('trip_shared_pct')
      / 100) if visits_recent >= 2 else P('onsite_trip_charge_usd'))
  - opened_at: LATEST('managed_tickets', 'event_at', date_field='event_at', event_type='managed_ticket_opened', ticket_number=ticket)
  - resolved_at: LATEST('managed_tickets', 'event_at', date_field='event_at', event_type='managed_ticket_resolved', ticket_number=ticket)
  - dispatch_rule: 2 if DAYS(opened_at, resolved_at) == 0 else (3 if DAYS(opened_at, resolved_at) == 1 else 1)
  - months_live: MONTHS(F('go_live_date'), NOW)
  - visit_tenure_pct: K('visit_tenure_long_pct') if months_live >= K('visit_tenure_long_months') else (K('visit_tenure_mid_pct')
      if months_live >= K('visit_tenure_mid_months') else 0)
  - scope_class: LATEST('managed_tickets', 'scope_class', date_field='event_at', event_type='managed_ticket_opened', ticket_number=ticket)
  - issue_category: LATEST('managed_tickets', 'issue_category', date_field='event_at', event_type='managed_ticket_opened',
