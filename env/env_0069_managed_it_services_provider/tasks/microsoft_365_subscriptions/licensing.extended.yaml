# Policy charter: Microsoft 365 Cloud Subscriptions resold under the Microsoft Cloud Solution Provider (CSP) program,
# new-commerce (NCE) terms. Microsoft product names are used verbatim as the industry does.
category: licensing
display_name: Microsoft 365 Cloud Subscriptions (CSP)

binding:
  holding_table: licensing_subscriptions
  event_tables: [licensing_license_changes, licensing_billing]
  intake_tables: [licensing_change_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {license_qty: licenses, balance_due_usd: receivable}

lifecycle:
  states: [provisioning, active, suspended, expired, cancelled]
  transitions:
    - {from: provisioning, to: active, by: system, means: "The subscription is provisioned in Partner Center and the licenses become assignable in the client's tenant."}
    - {from: active, to: cancelled, by: user, means: "The client cancels the whole subscription inside the cancellation window, with a prorated refund."}
    - {from: active, to: suspended, by: agent, means: "The subscription is suspended in Partner Center for non-payment; charges for the commitment continue."}
    - {from: suspended, to: active, by: agent, means: "The suspended subscription is reactivated after the past-due balance is paid."}
    - {from: active, to: expired, by: system, means: "The term ends with auto-renew off and the subscription expires."}
    - {from: suspended, to: expired, by: system, means: "The term ends while the subscription is suspended and it expires."}

accounts:
  - key: licenses
    unit: licenses
    meaning: Number of licenses currently committed on the subscription.
  - key: receivable
    unit: USD
    meaning: Amount the client owes on the subscription; charges increase it and refunds and payments reduce it.


# ---- category-level parameter dictionary ----
parameter_schema:
  annual_price_usd: Price per license per month on a P1Y or P3Y term billed annually (USD per license per month)
  monthly_billing_surcharge_pct: Surcharge on annual_price_usd when a P1Y or P3Y term is billed monthly (percent)
  monthly_term_premium_pct: Premium on annual_price_usd for a P1M term (percent)
  allowed_term_types: Commitment terms offered (list of P1M / P1Y / P3Y)
  billing_frequencies_p1y_p3y: Billing frequencies offered on P1Y and P3Y terms (list)
  billing_frequency_p1m: Billing frequency of a P1M term (enum)
  max_licenses_per_tenant: Most licenses of this plan one tenant may hold across all its subscriptions (integer, or unlimited)
  min_licenses_per_order: Fewest licenses on a new subscription or a seat addition (integer)
  cancellation_window_hours: Hours after the window opens (purchase or renewal) within which the whole subscription may be cancelled or its quantity reduced (integer hours)
  added_seat_reduction_window_hours: Hours after a seat addition within which those added licenses may be reduced (integer hours)
  price_locked_for_term: Whether unit_price_usd is fixed for the whole term (switch)
  renewal_price_basis: Price applied at renewal (enum current_price_list)
  renewal_change_cutoff_days: Days before the renewal date by which scheduled renewal changes must be saved (integer days)
  auto_renew_default: Auto-renew setting on a new subscription unless the order form says otherwise (switch)
  upgrade_paths: Plans this plan may be upgraded to mid-term (list of official names)
  partial_upgrade_allowed: Whether an upgrade may move only part of a subscription's licenses (switch)
  downgrade_mid_term_allowed: Whether a move to a lower plan may take effect before term end (switch)
  expired_access_days: Days after expiry during which users keep access before the subscription is disabled (integer days)
  disabled_retention_days: Days after the access period during which only administrators can reach the data before deletion (integer days)
  suspension_charges_continue: Whether the commitment keeps being charged while suspended (switch)
  provisioning_target_hours: Target hours from purchase to licenses being assignable (integer hours)
  mailbox_size_gb: Exchange Online mailbox size per user (GB)
  archive_included: Whether Exchange Online Archiving is included (switch)
  litigation_hold_included: Whether mailbox litigation hold is available (switch)
  onedrive_storage_gb: OneDrive storage per user (GB)
  desktop_apps_included: Whether installable Microsoft 365 Apps for desktop are included (switch)
  desktop_app_installs_per_user: PCs or Macs on which each user may install the desktop apps (integer)
  intune_included: Whether Microsoft Intune device management is included (switch)
  entra_id_plan: Microsoft Entra ID plan included (enum Free / P1 / P2)
  defender_plan: Endpoint protection plan included (enum)
  windows_license: Windows licensing included (enum)
  teams_included: Whether Microsoft Teams is included (switch; the no-Teams plans need a separate Teams licence)
  frontline_workers_only: Whether the plan may be assigned only to frontline workers who do not use a dedicated computer (switch)
  admin_fee_usd: Stratton Bay license administration fee per license per month (USD)
  admin_fee_waived_with_clearpath_admin: Whether the administration fee is waived while the client's ClearPath agreement covers Microsoft 365 administration (switch)
  signed_order_form_required: Whether a new subscription, cancellation, renewal change or upgrade needs the authorized contact's signed order form (switch)
  seat_addition_by_verified_contact: Whether a seat addition may be placed on the instruction of a verified authorized contact without an order form (switch)
  invoice_due_days: Net payment terms from the invoice posted date (integer days)
  late_fee_pct_monthly: Monthly late fee on an invoice's unpaid balance past the grace period (percent)
  late_fee_grace_days: Calendar days after the due date before a late fee is assessed (integer days)
  late_fee_minimum_usd: Minimum late fee per invoice per month (USD)
  suspension_days_past_due: Days past due of the oldest unpaid invoice at which the subscription may be suspended (integer days)
  card_payment_max_usd: Largest invoice that may be paid by card (USD)
  proration_basis: How partial-cycle charges and refunds are computed (enum daily_over_billing_cycle)
  refund_on_window_reduction: Whether licenses reduced inside the window are refunded prorated (switch)
  monthly_term_turn_off_auto_renew: Whether a P1M term may be ended at its next cycle end by turning off auto-renew after the window (switch)
  triennial_price_lock: Whether a P3Y term keeps its unit price for all three years (switch)
  security_baseline_policies: Whether Stratton Bay deploys its conditional access and device compliance baseline for the plan (switch; needs Entra ID P1 and Intune)
  copilot_addon_eligible: Whether the plan qualifies as a base licence for the Microsoft 365 Copilot add-on (switch)

