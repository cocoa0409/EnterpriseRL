- id: licensing_ext_late_charge
  base_policy_refs:
  - licensing_billing_and_collections
  overwrite:
  - base_policy: licensing_billing_and_collections
    superseded_clause: On the first day of each calendar month every invoice still unpaid more than late_fee_grace_days calendar days after its due date is assessed one late fee of late_fee_pct_monthly percent of its unpaid balance, or late_fee_minimum_usd if greater, rounded half up to the cent.
    replaced_by: For the cycle invoice of a subscription billed annually, and only for such an invoice, the late charge assessed on the first day of each calendar month once the invoice is still unpaid more than late_fee_grace_days calendar days after its due date is worked out under this schedule; every other invoice is still assessed, on the first day of each calendar month on which it is still unpaid more than late_fee_grace_days calendar days after its due date, one late fee of late_fee_pct_monthly percent of its unpaid balance, or late_fee_minimum_usd if greater, rounded half up to the cent.
  trigger: state_due
  subject:
  - licensing_late_fee
  computes: amount_usd
  target_tool: assess_late_charge_e02563fc
  params:
    rate_long_pct: 1.0
    rate_new_pct: 1.25
    min_top: 50.0
    min_mid: 35.0
    prorata_days: 30
    catchup_days: 60
    esc_high: 1.5
    esc_mid: 1.25
    relief_major: 0.5
    relief_minor: 0.75
    relief_threshold_pct: 25
    size_large: 10000.0
    size_mid: 2500.0
    scale_large: 0.8
    scale_mid: 0.9
  rule: 'For the cycle invoice of a subscription billed annually, and only for such an invoice, the late charge assessed on the first day of each calendar month once the invoice is still unpaid more than late_fee_grace_days calendar days after its due date is worked out under this schedule; every other invoice is still assessed, on the first day of each calendar month on which it is still unpaid more than late_fee_grace_days calendar days after its due date, one late fee of late_fee_pct_monthly percent of its unpaid balance, or late_fee_minimum_usd if greater, rounded half up to the cent. The late charge on a cycle invoice is fixed only after the subscription''s latest in-window reduction carries its reduction credit line on the billing ledger. The invoice charged is the one carrying the subscription''s latest cycle charge by posting date; a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date. The invoice''s past-due balance is the cycle and prorated charges on that invoice less the credits and the payments applied to it; late charges already on the invoice are not part of it. Under the standard method the month''s late charge is late_fee_pct_monthly percent of the past-due balance, or late_fee_minimum_usd if greater, charged as a full month, rounded half up to the cent. The adjustments below change the standard late charge in this order: those that replace the monthly rate or the minimum act first, so the month''s charge is the percentage of the past-due balance or the minimum if greater; every multiplier then acts on that month''s charge; the product is rounded half up to the cent once, at the end. The monthly late-charge rate follows the subscription''s own late-charge record: when no late charge was posted on the subscription less than twelve whole months before the assessment date and the subscription has renewed at least twice, the rate is 1.0 percent; when no late charge was posted in that period and the subscription has renewed fewer than twice, the rate is 1.25 percent; otherwise the rate is late_fee_pct_monthly percent. A late charge posted on the same day of the month twelve months earlier is not less than twelve whole months before. The late-charge minimum follows the client''s ClearPath schedule: with an active ClearPath Premier or ClearPath Enterprise agreement the minimum is 50.00 USD; with an active ClearPath Standard or ClearPath Professional agreement it is 35.00 USD; otherwise it is late_fee_minimum_usd. The share of the month the late charge covers follows how late the invoice is, its days past due being the calendar days from its posting date to the assessment date less invoice_due_days: an invoice 30 or fewer days past due is charged pro rata, the month''s charge times its days past due divided by 30; an invoice more than 60 days past due that carries no late charge yet is caught up, the month''s charge times the whole 30-day periods it has been past due; any other invoice is charged a full month. The late charge is escalated for a client whose ClearPath account also ran late: when the ClearPath billing ledger shows two or more late fees posted less than twelve whole months before the assessment date, the charge is multiplied by 1.5; when it shows exactly one, by 1.25; otherwise by 1. A client who paid part of the invoice receives good-faith relief: when the payments applied to the invoice cover at least 25 percent of its cycle and prorated charges, the late charge is multiplied by 0.5; when they cover something but less than 25 percent, by 0.75; when nothing has been paid on it, by 1. Large annual invoices carry a scaled late charge: when the invoice''s cycle and prorated charges total 10,000.00 USD or more, the charge is multiplied by 0.8; when they total 2,500.00 USD or more but less than 10,000.00 USD, by 0.9; when they total less than 2,500.00 USD, by 1.'
  prerequisite:
  - problem: licensing_ext_reduction_credit
    kind: value_input
    gate: past_due_balance
    form: state
    policy_source: The late charge on a cycle invoice is fixed only after the subscription's latest in-window reduction carries its reduction credit line on the billing ledger.
    condition: the licensing_license_changes row with change_reason in_window_reduction and the latest effective_at on the subscription has a licensing_billing row with event_type licensing_refund_credit and charge_reason in_window_reduction carrying its licensing_license_change_id
    resolved_by: post_reduction_credit_23f8ed2c
    effect: the reduction credit lowers the invoice's past-due balance (credits applied to the invoice rise), so the month's charge and the late charge change
  cross_category:
  - category: managed
    as: history
    reads:
    - variant_name
    - managed_billing.event_type
    - managed_billing.posted_date
    note: The ClearPath tier sets the late-charge minimum and the ClearPath late fees of the last twelve months set the escalation.
  compute:
  - inv: LATEST('licensing_billing', 'invoice_number', date_field='posted_date', event_type='licensing_cycle_charge')
  - inv_posted: LATEST('licensing_billing', 'posted_date', date_field='posted_date', event_type='licensing_cycle_charge')
  - inv_charges: SUM('licensing_billing', 'amount_usd', event_type='licensing_cycle_charge', invoice_number=inv) + SUM('licensing_billing', 'amount_usd', event_type='licensing_prorated_charge', invoice_number=inv)
  - inv_credits: SUM('licensing_billing', 'amount_usd', event_type='licensing_refund_credit', invoice_number=inv)
  - inv_paid: SUM('licensing_billing', 'amount_usd', event_type='licensing_payment', invoice_number=inv)
  - past_due_balance: inv_charges - inv_credits - inv_paid
  - days_past_due: DAYS(inv_posted, NOW) - P('invoice_due_days')
  - prior_late_12m: COUNT('licensing_billing', within_months=12, date_field='posted_date', event_type='licensing_late_fee')
  - rate_pct: K('rate_long_pct') if (prior_late_12m == 0 and F('renewal_count') >= 2) else (K('rate_new_pct') if (prior_late_12m == 0 and F('renewal_count') < 2) else P('late_fee_pct_monthly'))
  - cp_tier_late: CFIELD('managed', 'variant_name', status='active')
  - min_charge: K('min_top') if (cp_tier_late == 'ClearPath Premier' or cp_tier_late == 'ClearPath Enterprise') else (K('min_mid') if (cp_tier_late == 'ClearPath Standard' or cp_tier_late == 'ClearPath Professional') else P('late_fee_minimum_usd'))
  - inv_late_count: COUNT('licensing_billing', event_type='licensing_late_fee', invoice_number=inv)
  - month_share: days_past_due / K('prorata_days') if days_past_due <= K('prorata_days') else (int(days_past_due / K('prorata_days')) if (days_past_due > K('catchup_days') and inv_late_count == 0) else 1)
  - cp_late_12m: XCOUNT('managed', 'managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')
  - escalation: K('esc_high') if cp_late_12m >= 2 else (K('esc_mid') if cp_late_12m == 1 else 1)
  - relief_paid: SUM('licensing_billing', 'amount_usd', event_type='licensing_payment', invoice_number=inv)
  - relief: K('relief_major') if relief_paid >= inv_charges * K('relief_threshold_pct') / 100 else (K('relief_minor') if relief_paid > 0 else 1)
  - size_total: SUM('licensing_billing', 'amount_usd', event_type='licensing_cycle_charge', invoice_number=inv) + SUM('licensing_billing', 'amount_usd', event_type='licensing_prorated_charge', invoice_number=inv)
  - size_scale: K('scale_large') if size_total >= K('size_large') else (K('scale_mid') if size_total >= K('size_mid') else 1)
  - result: RND(MX(past_due_balance * rate_pct / 100, min_charge) * month_share * escalation * relief * size_scale, 2)
  compute_basis:
    inv: The invoice charged is the one carrying the subscription's latest cycle charge by posting date; a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date.
    inv_posted: The invoice charged is the one carrying the subscription's latest cycle charge by posting date; a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date.
    inv_charges: The invoice's past-due balance is the cycle and prorated charges on that invoice less the credits and the payments applied to it; late charges already on the invoice are not part of it.
    inv_credits: The invoice's past-due balance is the cycle and prorated charges on that invoice less the credits and the payments applied to it; late charges already on the invoice are not part of it.
    inv_paid: The invoice's past-due balance is the cycle and prorated charges on that invoice less the credits and the payments applied to it; late charges already on the invoice are not part of it.
    past_due_balance: The invoice's past-due balance is the cycle and prorated charges on that invoice less the credits and the payments applied to it; late charges already on the invoice are not part of it.
    days_past_due: 'The share of the month the late charge covers follows how late the invoice is, its days past due being the calendar days from its posting date to the assessment date less invoice_due_days: an invoice 30 or fewer days past due is charged pro rata, the month''s charge times its days past due divided by 30; an invoice more than 60 days past due that carries no late charge yet is caught up, the month''s charge times the whole 30-day periods it has been past due; any other invoice is charged a full month.'
    prior_late_12m: 'The monthly late-charge rate follows the subscription''s own late-charge record: when no late charge was posted on the subscription less than twelve whole months before the assessment date and the subscription has renewed at least twice, the rate is 1.0 percent; when no late charge was posted in that period and the subscription has renewed fewer than twice, the rate is 1.25 percent; otherwise the rate is late_fee_pct_monthly percent. A late charge posted on the same day of the month twelve months earlier is not less than twelve whole months before.'
    rate_pct: 'The monthly late-charge rate follows the subscription''s own late-charge record: when no late charge was posted on the subscription less than twelve whole months before the assessment date and the subscription has renewed at least twice, the rate is 1.0 percent; when no late charge was posted in that period and the subscription has renewed fewer than twice, the rate is 1.25 percent; otherwise the rate is late_fee_pct_monthly percent. A late charge posted on the same day of the month twelve months earlier is not less than twelve whole months before.'
    cp_tier_late: 'The late-charge minimum follows the client''s ClearPath schedule: with an active ClearPath Premier or ClearPath Enterprise agreement the minimum is 50.00 USD; with an active ClearPath Standard or ClearPath Professional agreement it is 35.00 USD; otherwise it is late_fee_minimum_usd.'
    min_charge: 'The late-charge minimum follows the client''s ClearPath schedule: with an active ClearPath Premier or ClearPath Enterprise agreement the minimum is 50.00 USD; with an active ClearPath Standard or ClearPath Professional agreement it is 35.00 USD; otherwise it is late_fee_minimum_usd.'
    inv_late_count: 'The share of the month the late charge covers follows how late the invoice is, its days past due being the calendar days from its posting date to the assessment date less invoice_due_days: an invoice 30 or fewer days past due is charged pro rata, the month''s charge times its days past due divided by 30; an invoice more than 60 days past due that carries no late charge yet is caught up, the month''s charge times the whole 30-day periods it has been past due; any other invoice is charged a full month.'
    month_share: 'The share of the month the late charge covers follows how late the invoice is, its days past due being the calendar days from its posting date to the assessment date less invoice_due_days: an invoice 30 or fewer days past due is charged pro rata, the month''s charge times its days past due divided by 30; an invoice more than 60 days past due that carries no late charge yet is caught up, the month''s charge times the whole 30-day periods it has been past due; any other invoice is charged a full month.'
    cp_late_12m: 'The late charge is escalated for a client whose ClearPath account also ran late: when the ClearPath billing ledger shows two or more late fees posted less than twelve whole months before the assessment date, the charge is multiplied by 1.5; when it shows exactly one, by 1.25; otherwise by 1.'
    escalation: 'The late charge is escalated for a client whose ClearPath account also ran late: when the ClearPath billing ledger shows two or more late fees posted less than twelve whole months before the assessment date, the charge is multiplied by 1.5; when it shows exactly one, by 1.25; otherwise by 1.'
    relief_paid: 'A client who paid part of the invoice receives good-faith relief: when the payments applied to the invoice cover at least 25 percent of its cycle and prorated charges, the late charge is multiplied by 0.5; when they cover something but less than 25 percent, by 0.75; when nothing has been paid on it, by 1.'
    relief: 'A client who paid part of the invoice receives good-faith relief: when the payments applied to the invoice cover at least 25 percent of its cycle and prorated charges, the late charge is multiplied by 0.5; when they cover something but less than 25 percent, by 0.75; when nothing has been paid on it, by 1.'
    size_total: 'Large annual invoices carry a scaled late charge: when the invoice''s cycle and prorated charges total 10,000.00 USD or more, the charge is multiplied by 0.8; when they total 2,500.00 USD or more but less than 10,000.00 USD, by 0.9; when they total less than 2,500.00 USD, by 1.'
    size_scale: 'Large annual invoices carry a scaled late charge: when the invoice''s cycle and prorated charges total 10,000.00 USD or more, the charge is multiplied by 0.8; when they total 2,500.00 USD or more but less than 10,000.00 USD, by 0.9; when they total less than 2,500.00 USD, by 1.'
    result: 'The adjustments below change the standard late charge in this order: those that replace the monthly rate or the minimum act first, so the month''s charge is the percentage of the past-due balance or the minimum if greater; every multiplier then acts on that month''s charge; the product is rounded half up to the cent once, at the end.'
  factors:
  - id: courtesy_rate
    effect: parameter
    decides: rate_pct
    bindings:
    - prior_late_12m
    - rate_pct
    ladder:
    - when: no late charge posted on the subscription less than twelve whole months before the assessment date AND the subscription has renewed at least twice
      value: 1.0 percent (K('rate_long_pct'))
    - when: no late charge posted in that period AND the subscription has renewed fewer than twice
      value: 1.25 percent (K('rate_new_pct'))
    - when: otherwise
      value: late_fee_pct_monthly percent (P('late_fee_pct_monthly'))
    baseline:
      rate_pct: P('late_fee_pct_monthly')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: relationship_minimum
    effect: parameter
    decides: min_charge
    bindings:
    - cp_tier_late
    - min_charge
    ladder:
    - when: an active ClearPath Premier or ClearPath Enterprise agreement
      value: 50.00 USD (K('min_top'))
    - when: an active ClearPath Standard or ClearPath Professional agreement
      value: 35.00 USD (K('min_mid'))
    - when: otherwise
      value: late_fee_minimum_usd (P('late_fee_minimum_usd'))
    baseline:
      min_charge: P('late_fee_minimum_usd')
    evidence:
    - cross_category
    cross_difficulty: managed
  - id: first_period_accrual
    effect: method
    decides: month_share
    bindings:
    - days_past_due
    - inv_late_count
    - month_share
    ladder:
    - when: the invoice is 30 or fewer days past due
      method: 'pro rata: the month''s charge times the days past due divided by 30'
    - when: the invoice is more than 60 days past due and carries no late charge yet
      method: 'caught up: the month''s charge times the whole 30-day periods past due'
    - when: otherwise
      method: a full month's charge (standard method)
    baseline:
      month_share: '1'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: master_account_escalation
    effect: parameter
    decides: escalation
    bindings:
    - cp_late_12m
    - escalation
    ladder:
    - when: two or more ClearPath late fees posted less than twelve whole months before the assessment date
      value: 1.5 (K('esc_high'))
    - when: exactly one such ClearPath late fee
      value: 1.25 (K('esc_mid'))
    - when: otherwise
      value: '1'
    baseline:
      escalation: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: managed
  - id: good_faith_relief
    effect: parameter
    decides: relief
    bindings:
    - relief_paid
    - relief
    ladder:
    - when: payments applied to the invoice cover at least 25 percent of its cycle and prorated charges
      value: 0.5 (K('relief_major'))
    - when: payments cover something but less than 25 percent
      value: 0.75 (K('relief_minor'))
    - when: otherwise (nothing paid)
      value: '1'
    baseline:
      relief: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: invoice_size_scale
    effect: parameter
    decides: size_scale
    bindings:
    - size_total
    - size_scale
    ladder:
    - when: the invoice's cycle and prorated charges total 10,000.00 USD or more
      value: 0.8 (K('scale_large'))
    - when: they total 2,500.00 USD or more but less than 10,000.00 USD
      value: 0.9 (K('scale_mid'))
    - when: otherwise
      value: '1'
    baseline:
      size_scale: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The invoice charged is the one carrying the subscription's latest cycle charge by posting date; a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date. The invoice's past-due balance is the cycle and prorated charges on that invoice less the credits and the payments applied to it; late charges already on the invoice are not part of it. Under the standard method the month's late charge is late_fee_pct_monthly percent of the past-due balance, or late_fee_minimum_usd if greater, charged as a full month, rounded half up to the cent.
    params:
