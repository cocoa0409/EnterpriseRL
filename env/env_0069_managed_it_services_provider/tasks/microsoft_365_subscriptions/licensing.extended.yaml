  factors:
  - id: coverage_share
    effect: parameter
    decides: cover_pct
    bindings:
    - cov_active
    - cov_notice
    - cp_tier
    - cover_pct
    ladder:
    - when: admin_fee_waived_with_clearpath_admin true AND a ClearPath agreement with status active or notice_given on a tier whose m365_administration_included is true
      value: '0 percent: no fee is posted (K(''cover_none_pct''))'
    - when: admin_fee_waived_with_clearpath_admin true AND an active ClearPath Monitor agreement, whose tier does not include Microsoft 365 administration
      value: 50 percent (K('cover_half_pct'))
    - when: otherwise (any other client, or admin_fee_waived_with_clearpath_admin false)
      value: 100 percent (the whole fee)
    baseline:
      cover_pct: '100'
    evidence:
    - cross_category
    cross_difficulty: managed
  - id: commitment_term_adjust
    effect: parameter
    decides: term_pct
    bindings:
    - term_days
    - term_pct
    ladder:
    - when: a term of 1,000 days or more (P3Y)
      value: 90 percent (K('term_long_pct'))
    - when: a term of 31 days or fewer (P1M)
      value: 110 percent (K('term_short_pct'))
    - when: otherwise
      value: 100 percent
    baseline:
      term_pct: '100'
    evidence:
    - date
    cross_difficulty: null
  - id: tenant_volume_rate
    effect: parameter
    decides: vol_pct
    bindings:
    - vol_lic
    - vol_pct
    ladder:
    - when: 100 or more licenses counted
      value: 80 percent (K('vol_high_pct'))
    - when: 25 to 99 licenses counted
      value: 90 percent (K('vol_mid_pct'))
    - when: otherwise (fewer than 25)
      value: 100 percent
    baseline:
      vol_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: security_baseline_upkeep
    effect: parameter
    decides: upkeep
    bindings:
    - sentinel_idt
    - upkeep
    ladder:
    - when: the plan's security_baseline_policies is true AND an active Sentinel subscription on a tier with identity_threat_detection true
      value: 0.25 USD per license (K('upkeep_low'))
    - when: the plan's security_baseline_policies is true and no such Sentinel subscription
      value: 0.50 USD per license (K('upkeep_high'))
    - when: otherwise (security_baseline_policies false)
      value: nothing (0)
    baseline:
      upkeep: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: security
  - id: held_days_month_fraction
    effect: method
    decides: month_part
    bindings:
    - held_days
    - month_part
    ladder:
    - when: purchased fewer than 30 calendar days before the posting day
      method: the days from the purchase date up to the posting day (excluded) over a 30-day month
    - when: held 30 days or more and suspended when the fee posts
      method: 30 less the days from the suspension date up to the posting day, over 30 (the part of the month before the suspension)
    - when: otherwise
      method: the full month (standard method)
    baseline:
      month_part: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: backup_bundle_rate
    effect: parameter
    decides: bundle_pct
    bindings:
    - cont_status
    - cont_plan
    - m365_protected
    - bundle_pct
    ladder:
    - when: an active Continuum plan AND it protects at least as many Microsoft 365 users as the licenses counted
      value: 90 percent (K('bundle_full_pct'))
    - when: an active Continuum plan AND it protects at least one but fewer Microsoft 365 users
      value: 95 percent (K('bundle_part_pct'))
    - when: otherwise
      value: 100 percent
    baseline:
      bundle_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: backup
  baseline:
    rule: The licenses the administration fee counts are the licenses the subscription carries when the fee posts, that is the licenses its quantity changes have added less those they have removed. Under the standard method the administration fee is admin_fee_usd times the licenses the fee counts, charged as a full month, rounded half up to the cent.
    params:
    - admin_fee_usd
  inputs:
    history:
    - table: licensing_license_changes
      aggregate: sum
      field: qty
      filters:
        event_type: licensing_licenses_added
    - category: backup
      table: backup_device_changes
      aggregate: count
      field: backup_device_change_id
      filters:
        device_class: m365_user
    cross_category:
    - managed
    - security
    - backup
- id: licensing_ext_seat_partial_charge
  base_policy_refs:
  - licensing_seat_additions
  - licensing_upgrades
  overwrite:
  - base_policy: licensing_seat_additions
    superseded_clause: 'A seat addition is charged for the rest of the billing cycle in which it is submitted: unit_price_usd times qty times the number of calendar days from the date part of effective_at through the cycle''s last day inclusive, divided by the number of days in that cycle, rounded half up to the cent; later cycles include the added licenses in the cycle charge.'
    replaced_by: For a seat addition on a subscription whose billing cycle runs its whole term (a P1M term, or a P1Y term billed annually), and only for such a seat addition, the partial-cycle charge for the rest of the billing cycle in which it is submitted is worked out under this schedule and later cycles include the added licenses in the cycle charge; a seat addition on any other subscription is still charged for the rest of the billing cycle in which it is submitted unit_price_usd times qty times the calendar days from the date part of effective_at through the cycle's last day inclusive, divided by the days in that cycle, rounded half up to the cent, and later cycles include the added licenses in the cycle charge.
  trigger: state_due
  subject:
  - licensing_prorated_charge
  computes: amount_usd
  target_tool: post_seat_addition_charge_bba679a2
  params:
    order_days: 6
    tail_days: 7
    prov_standard: 6.0
    prov_low: 2.0
    prov_mid: 4.0
    hours_threshold: 10
    vol_high: 10
    vol_mid: 3
    vol_high_pct: 5.0
    vol_mid_pct: 2.0
    onboard_full_pct: 3.0
    onboard_part_pct: 1.5
  rule: 'For a seat addition on a subscription whose billing cycle runs its whole term (a P1M term, or a P1Y term billed annually), and only for such a seat addition, the partial-cycle charge for the rest of the billing cycle in which it is submitted is worked out under this schedule and later cycles include the added licenses in the cycle charge; a seat addition on any other subscription is still charged for the rest of the billing cycle in which it is submitted unit_price_usd times qty times the calendar days from the date part of effective_at through the cycle''s last day inclusive, divided by the days in that cycle, rounded half up to the cent, and later cycles include the added licenses in the cycle charge. The seat addition charged is the seat addition with the latest submission moment recorded on the subscription; a subscription records one quantity change per submission moment and reason, so two seat additions never share a submission moment, and the licenses added are that seat addition''s quantity. For the partial-cycle charge, the cycle is the current term, from term_start_date through term_end_date, its days are counted from the first day through the last day inclusive, and the addition''s cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually. Under the standard method the partial-cycle charge is the addition''s cycle amount per license times the licenses added times the calendar days from the date part of the seat addition''s submission moment through the last day of the cycle inclusive, divided by the days in the cycle, plus the standard provisioning fee of 6.00 USD per license added, rounded half up to the cent. The provisioning fee is Stratton Bay''s charge for license work outside a ClearPath agreement, so a client holding a ClearPath agreement whose status is active or notice_given and whose tier has m365_administration_included true pays no provisioning fee on any seat addition, that work being covered. The adjustments below change the standard partial-cycle charge in this order: those that change the days charged come first, discount percentages are then added together and taken once off the prorated amount, and amounts per license are added last; the result is rounded half up to the cent once, at the end, and a seat addition whose charge comes to nothing carries no partial-cycle charge line, there being nothing to charge. A seat addition on a subscription that has never renewed, submitted no more than six calendar days after the date the cancellation window opened, is billed with the order: the partial-cycle charge covers all the days of the cycle; when the seat addition is not part of the order and seven or fewer days run from its submission date through the last day of the cycle inclusive, no days are charged and the licenses are billed from the next cycle; any other seat addition is charged under the standard method. For license work not covered by ClearPath, the provisioning fee per license added to the partial-cycle charge is lower for a client holding prepaid TimeBank hours, which are the hours its TimeBank hours ledger has granted, rolled in and restored less those drawn, rolled out and forfeited, across all its blocks: with 10 or more such hours it is 2.00 USD; with some, but fewer than 10, it is 4.00 USD; with none it is the standard provisioning fee. Larger seat additions take an addition volume discount on the partial-cycle charge: 5 percent for 10 or more licenses added, 2 percent for 3 to 9 licenses added, and none for 1 or 2. The partial-cycle charge takes an onboarding discount set by the seats the active ClearPath agreement covers beyond its contracted seats: when those seats number at least the licenses added, the discount is 3 percent; when there is at least one such seat but fewer than the licenses added, 1.5 percent; when there is none, or no active ClearPath agreement, no discount.'
  prerequisite: []
  cross_category:
  - category: timebank
    as: history
    reads:
    - timebank_hours_ledger.event_type
    - timebank_hours_ledger.hours
    note: The client's remaining prepaid TimeBank hours across all blocks set the provisioning fee per license.
  - category: managed
    as: branch
    reads:
    - m365_administration_included
    - seat_count
    - contracted_seats
    note: ClearPath coverage of Microsoft 365 administration waives the provisioning fee; the seats the agreement covers beyond its contracted seats set the onboarding discount.
  compute:
  - add_at: LATEST('licensing_license_changes', 'effective_at', date_field='effective_at', change_reason='seat_addition')
  - add_qty: SUM('licensing_license_changes', 'qty', change_reason='seat_addition', effective_at=add_at)
  - cycle_days: DAYS(F('term_start_date'), F('term_end_date')) + 1
  - licence_cycle_amount: F('unit_price_usd') * (12 if F('billing_frequency') == 'annual' else 1)
  - remaining_days: DAYS(add_at, F('term_end_date')) + 1
  - covered_work: CPARAM('managed', 'm365_administration_included', status='active') == True or CPARAM('managed', 'm365_administration_included', status='notice_given') == True
  - order_lag: DAYS(F('window_opened_at'), add_at)
  - days_charged: cycle_days if (F('renewal_count') == 0 and order_lag <= K('order_days')) else (0 if remaining_days <= K('tail_days') else remaining_days)
  - tb_hours: XSUM('timebank', 'timebank_hours_ledger', 'hours', event_type='timebank_hours_granted') + XSUM('timebank', 'timebank_hours_ledger', 'hours', event_type='timebank_hours_rolled_in') + XSUM('timebank', 'timebank_hours_ledger', 'hours', event_type='timebank_draw_reversed') - XSUM('timebank', 'timebank_hours_ledger', 'hours', event_type='timebank_hours_drawn') - XSUM('timebank', 'timebank_hours_ledger', 'hours', event_type='timebank_hours_rolled_out') - XSUM('timebank', 'timebank_hours_ledger', 'hours', event_type='timebank_hours_forfeited')
  - prov_fee: K('prov_low') if tb_hours >= K('hours_threshold') else (K('prov_mid') if tb_hours > 0 else K('prov_standard'))
  - vol_qty: SUM('licensing_license_changes', 'qty', change_reason='seat_addition', effective_at=add_at)
  - vol_pct: K('vol_high_pct') if vol_qty >= K('vol_high') else (K('vol_mid_pct') if vol_qty >= K('vol_mid') else 0)
  - onboardings: (CFIELD('managed', 'seat_count', status='active') - CFIELD('managed', 'contracted_seats', status='active')) if CFIELD('managed', 'seat_count', status='active') != None else 0
  - onboard_pct: K('onboard_full_pct') if onboardings >= add_qty else (K('onboard_part_pct') if onboardings >= 1 else 0)
  - result: RND(licence_cycle_amount * add_qty * days_charged / cycle_days * (1 - (vol_pct + onboard_pct) / 100) + (0 if covered_work else prov_fee * add_qty), 2)
  compute_basis:
    add_at: The seat addition charged is the seat addition with the latest submission moment recorded on the subscription; a subscription records one quantity change per submission moment and reason, so two seat additions never share a submission moment, and the licenses added are that seat addition's quantity.
    add_qty: The seat addition charged is the seat addition with the latest submission moment recorded on the subscription; a subscription records one quantity change per submission moment and reason, so two seat additions never share a submission moment, and the licenses added are that seat addition's quantity.
    cycle_days: For the partial-cycle charge, the cycle is the current term, from term_start_date through term_end_date, its days are counted from the first day through the last day inclusive, and the addition's cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually.
    licence_cycle_amount: For the partial-cycle charge, the cycle is the current term, from term_start_date through term_end_date, its days are counted from the first day through the last day inclusive, and the addition's cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually.
    remaining_days: Under the standard method the partial-cycle charge is the addition's cycle amount per license times the licenses added times the calendar days from the date part of the seat addition's submission moment through the last day of the cycle inclusive, divided by the days in the cycle, plus the standard provisioning fee of 6.00 USD per license added, rounded half up to the cent.
    covered_work: The provisioning fee is Stratton Bay's charge for license work outside a ClearPath agreement, so a client holding a ClearPath agreement whose status is active or notice_given and whose tier has m365_administration_included true pays no provisioning fee on any seat addition, that work being covered.
    order_lag: 'A seat addition on a subscription that has never renewed, submitted no more than six calendar days after the date the cancellation window opened, is billed with the order: the partial-cycle charge covers all the days of the cycle; when the seat addition is not part of the order and seven or fewer days run from its submission date through the last day of the cycle inclusive, no days are charged and the licenses are billed from the next cycle; any other seat addition is charged under the standard method.'
    days_charged: 'A seat addition on a subscription that has never renewed, submitted no more than six calendar days after the date the cancellation window opened, is billed with the order: the partial-cycle charge covers all the days of the cycle; when the seat addition is not part of the order and seven or fewer days run from its submission date through the last day of the cycle inclusive, no days are charged and the licenses are billed from the next cycle; any other seat addition is charged under the standard method.'
    tb_hours: 'For license work not covered by ClearPath, the provisioning fee per license added to the partial-cycle charge is lower for a client holding prepaid TimeBank hours, which are the hours its TimeBank hours ledger has granted, rolled in and restored less those drawn, rolled out and forfeited, across all its blocks: with 10 or more such hours it is 2.00 USD; with some, but fewer than 10, it is 4.00 USD; with none it is the standard provisioning fee.'
    prov_fee: 'For license work not covered by ClearPath, the provisioning fee per license added to the partial-cycle charge is lower for a client holding prepaid TimeBank hours, which are the hours its TimeBank hours ledger has granted, rolled in and restored less those drawn, rolled out and forfeited, across all its blocks: with 10 or more such hours it is 2.00 USD; with some, but fewer than 10, it is 4.00 USD; with none it is the standard provisioning fee.'
    vol_qty: 'Larger seat additions take an addition volume discount on the partial-cycle charge: 5 percent for 10 or more licenses added, 2 percent for 3 to 9 licenses added, and none for 1 or 2.'
    vol_pct: 'Larger seat additions take an addition volume discount on the partial-cycle charge: 5 percent for 10 or more licenses added, 2 percent for 3 to 9 licenses added, and none for 1 or 2.'
    onboardings: 'The partial-cycle charge takes an onboarding discount set by the seats the active ClearPath agreement covers beyond its contracted seats: when those seats number at least the licenses added, the discount is 3 percent; when there is at least one such seat but fewer than the licenses added, 1.5 percent; when there is none, or no active ClearPath agreement, no discount.'
    onboard_pct: 'The partial-cycle charge takes an onboarding discount set by the seats the active ClearPath agreement covers beyond its contracted seats: when those seats number at least the licenses added, the discount is 3 percent; when there is at least one such seat but fewer than the licenses added, 1.5 percent; when there is none, or no active ClearPath agreement, no discount.'
    result: 'The adjustments below change the standard partial-cycle charge in this order: those that change the days charged come first, discount percentages are then added together and taken once off the prorated amount, and amounts per license are added last; the result is rounded half up to the cent once, at the end, and a seat addition whose charge comes to nothing carries no partial-cycle charge line, there being nothing to charge.'
  factors:
  - id: order_window_convention
    effect: method
    decides: days_charged
    bindings:
    - order_lag
    - days_charged
    ladder:
    - when: the subscription has never renewed AND the seat addition was submitted no more than six calendar days after the window opened
      method: all the days of the cycle are charged (billed as part of the order)
    - when: not part of the order and seven or fewer days remain through the last day of the cycle
      method: no days are charged; the licenses are billed from the next cycle
    - when: otherwise
      method: the days from the submission date through the last day of the cycle inclusive (standard method)
    baseline:
      days_charged: remaining_days
    evidence:
    - date
    cross_difficulty: null
  - id: prepaid_hours_provisioning
    effect: parameter
    decides: prov_fee
    bindings:
    - tb_hours
    - prov_fee
    ladder:
    - when: 10 or more prepaid TimeBank hours remaining across the client's blocks
      value: 2.00 USD per license (K('prov_low'))
    - when: some prepaid TimeBank hours remaining, but fewer than 10
      value: 4.00 USD per license (K('prov_mid'))
    - when: otherwise (no prepaid hours)
      value: the standard provisioning fee, 6.00 USD per license (K('prov_standard'))
    baseline:
      prov_fee: K('prov_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: timebank
  - id: addition_volume_discount
    effect: parameter
    decides: vol_pct
    bindings:
    - vol_qty
    - vol_pct
    ladder:
    - when: 10 or more licenses added
      value: 5 percent (K('vol_high_pct'))
    - when: 3 to 9 licenses added
      value: 2 percent (K('vol_mid_pct'))
    - when: otherwise (1 or 2)
      value: none (0)
    baseline:
      vol_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: onboarded_staff_discount
    effect: parameter
    decides: onboard_pct
    bindings:
    - onboardings
    - onboard_pct
    ladder:
    - when: the active ClearPath agreement covers seats beyond its contracted seats numbering at least the licenses added
      value: 3 percent (K('onboard_full_pct'))
    - when: at least one such seat but fewer than the licenses added
      value: 1.5 percent (K('onboard_part_pct'))
    - when: otherwise (none, or no active ClearPath agreement)
      value: none (0)
    baseline:
      onboard_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: managed
  baseline:
    rule: The seat addition charged is the seat addition with the latest submission moment recorded on the subscription; a subscription records one quantity change per submission moment and reason, so two seat additions never share a submission moment, and the licenses added are that seat addition's quantity. For the partial-cycle charge, the cycle is the current term, from term_start_date through term_end_date, its days are counted from the first day through the last day inclusive, and the addition's cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually. Under the standard method the partial-cycle charge is the addition's cycle amount per license times the licenses added times the calendar days from the date part of the seat addition's submission moment through the last day of the cycle inclusive, divided by the days in the cycle, plus the standard provisioning fee of 6.00 USD per license added, rounded half up to the cent. The provisioning fee is Stratton Bay's charge for license work outside a ClearPath agreement, so a client holding a ClearPath agreement whose status is active or notice_given and whose tier has m365_administration_included true pays no provisioning fee on any seat addition, that work being covered.
    params:
    - prov_standard
  inputs:
    history:
    - table: licensing_license_changes
      aggregate: sum
      field: qty
      filters:
        change_reason: seat_addition
    - category: timebank
      table: timebank_hours_ledger
      aggregate: sum
      field: hours
      filters: {}
    cross_category:
    - timebank
    - managed
- id: licensing_ext_window_cancellation
  base_policy_refs:
  - licensing_cancellation_window
  - licensing_client_authorization
  overwrite:
  - base_policy: licensing_cancellation_window
    superseded_clause: 'A cancellation or in-window reduction is refunded where refund_on_window_reduction is true: unit_price_usd times the licenses removed times the number of calendar days from the date part of effective_at through the last day of the current billing cycle inclusive, divided by the days in that cycle, rounded half up to the cent, credited to the next invoice.'
    replaced_by: For the cancellation of a whole subscription whose plan has refund_on_window_reduction true and whose billing cycle runs its whole term (a P1M term, or a P1Y term billed annually), and only for such a cancellation, the cancellation refund is worked out under this schedule; an in-window reduction is credited under its own reduction credit schedule, and the cancellation of any other subscription is still refunded, where refund_on_window_reduction is true, unit_price_usd times the licenses removed times the calendar days from the date part of effective_at through the last day of the current billing cycle inclusive, divided by the days in that cycle, rounded half up to the cent. Every whole-subscription cancellation refund is credited to the invoice that billed the cycle it refunds, not to the next invoice.
  trigger: on_request
  subject:
  - licensing_cancelled_in_window
  - licensing_refund_credit
  computes: refund_amount_usd
  target_tool: cancel_subscription_in_window_d46a60fb
  params:
    prompt_days: 3
    held_days_full: 7
    rev_large: 50.0
    rev_mid: 25.0
    rev_large_qty: 25
    rev_mid_qty: 10
    deprov_low: 0.5
    deprov_high: 1.0
    change_low: 5.0
    change_bulk: 4.0
    change_many: 3
    charge_cap_share: 0.5
  rule: 'For the cancellation of a whole subscription whose plan has refund_on_window_reduction true and whose billing cycle runs its whole term (a P1M term, or a P1Y term billed annually), and only for such a cancellation, the cancellation refund is worked out under this schedule; an in-window reduction is credited under its own reduction credit schedule, and the cancellation of any other subscription is still refunded, where refund_on_window_reduction is true, unit_price_usd times the licenses removed times the calendar days from the date part of effective_at through the last day of the current billing cycle inclusive, divided by the days in that cycle, rounded half up to the cent. Every whole-subscription cancellation refund is credited to the invoice that billed the cycle it refunds, not to the next invoice. A cancellation refund is not fixed until the administration fee line for the month just ended stands on its billing ledger, where the subscription was active at that month''s end, unless the plan waives the administration fee for clients whose ClearPath tier covers Microsoft 365 administration and the client holds an active or under-notice ClearPath agreement on a tier that includes Microsoft 365 administration. The cancellation refund is fixed only after the subscription''s latest seat addition carries its partial-cycle charge line on the billing ledger, unless the client holds an active or under-notice ClearPath agreement on a tier that includes Microsoft 365 administration and that seat addition was submitted with seven or fewer days left through the last day of its cycle, other than within six calendar days of the window opening of a subscription that has never renewed. For the cancellation refund, the cycle is the current term, from term_start_date through term_end_date, its days are counted from the first day through the last day inclusive, the refund''s cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually, and the licenses refunded are the licenses the subscription holds when it is cancelled. The charges billed for the cycle are the cycle charge and the partial-cycle charges whose cycle starts on term_start_date. Under the standard method the cancellation refund is the license refund, the refund''s cycle amount per license times the licenses refunded times the calendar days from the cancellation date through the last day of the cycle inclusive divided by the days in the cycle, never more than the charges billed for the cycle, rounded half up to the cent; Stratton Bay''s administration fee is left as billed. Charges deducted from a cancellation refund never take, together, more than half of the refund they are deducted from (the license refund with any amounts returned), so a cancellation always carries a refund above 0.00. Stratton Bay makes no license-work charge against the cancellation refund of a client holding a ClearPath agreement whose status is active or notice_given and whose tier has m365_administration_included true, that work being covered. The adjustments below change the standard cancellation refund in this order: those that change how the license refund is worked out come first and the cap on the license refund applies to their result; amounts returned are then added and charges subtracted; the result is rounded half up to the cent once, at the end. How the license refund is worked out follows how promptly the subscription is given up: when the cancellation date is no more than three calendar days after the date the cancellation window opened, the licenses are refunded as never used, the cycle amount per license times the licenses refunded with no day count; when the cancellation comes more than three days after the window opened but no more than three calendar days after the latest seat addition, and that seat addition carries a partial-cycle charge, the licenses it added are refunded as never used, their partial-cycle charge returned in full, and the other licenses held are refunded under the standard method; any other cancellation is refunded under the standard method. Stratton Bay''s administration fee billed on the cancelled subscription is returned according to the client''s ClearPath relationship: when the client holds an active ClearPath agreement and the subscription was purchased fewer than seven calendar days before the cancellation date, the administration fee billed is returned in full; when the client holds an active ClearPath agreement and the subscription was held seven days or more, it is returned pro rata, times the calendar days from the cancellation date through the last day of the cycle inclusive divided by the days in the cycle; without an active ClearPath agreement it is not returned. For license work not covered by ClearPath, reversing a large order deducts Stratton Bay''s order reversal fee from the cancellation refund: 50.00 USD when 25 or more licenses are cancelled, 25.00 USD when 10 to 24 are cancelled, and nothing when fewer than 10 are cancelled. Stratton Bay deducts a backup deprovisioning charge from the cancellation refund for each Microsoft 365 user taken off the client''s active Continuum plan, the users taken off being counted as the lesser of the licenses cancelled and that plan''s own protected Microsoft 365 users (its protections of Microsoft 365 users less its own removals): 0.50 USD per user under an active Continuum Backup Plus, Continuum BDR, Continuum DRaaS or Continuum DRaaS Premier plan, 1.00 USD per user under an active Continuum Backup Basic or Continuum Backup Standard plan, and nothing without an active Continuum plan or where that plan protects no Microsoft 365 user. For license work not covered by ClearPath, every seat addition recorded on the subscription is reversed with the cancellation as a separate Partner Center change and a seat change charge is deducted from the cancellation refund: 5.00 USD for each when there are one or two, 4.00 USD for each when there are three or more, and nothing when there are none.'
  prerequisite:
  - problem: licensing_ext_admin_fee
    kind: value_input
    gate: admin_return
    form: state
    policy_source: A cancellation refund is not fixed until the administration fee line for the month just ended stands on its billing ledger, where the subscription was active at that month's end, unless the plan waives the administration fee for clients whose ClearPath tier covers Microsoft 365 administration and the client holds an active or under-notice ClearPath agreement on a tier that includes Microsoft 365 administration.
    condition: where the subscription was active at the end of the month just ended, and unless admin_fee_waived_with_clearpath_admin is true for its plan and the client holds an active or notice_given ClearPath agreement whose tier has m365_administration_included true, its billing ledger carries a licensing_admin_fee row for that month
    resolved_by: post_admin_fee_5104ae31
    effect: the administration fee billed on the subscription rises, so the administration fee returned with the refund changes where an active ClearPath agreement is held
  - problem: licensing_ext_seat_partial_charge
    kind: value_input
    gate: billed_cycle
    form: state
    policy_source: The cancellation refund is fixed only after the subscription's latest seat addition carries its partial-cycle charge line on the billing ledger, unless the client holds an active or under-notice ClearPath agreement on a tier that includes Microsoft 365 administration and that seat addition was submitted with seven or fewer days left through the last day of its cycle, other than within six calendar days of the window opening of a subscription that has never renewed.
    condition: the licensing_license_changes row with change_reason seat_addition and the latest effective_at on the subscription has a licensing_billing row with event_type licensing_prorated_charge carrying its licensing_license_change_id, unless the client holds an active or notice_given ClearPath agreement whose tier has m365_administration_included true and that seat addition has seven or fewer days to run through its cycle's last day and is not within six days of the opening of a never-renewed subscription's window
    resolved_by: post_seat_addition_charge_bba679a2
    effect: the charges billed for the cycle rise, so the cap on the license refund changes wherever it binds
  cross_category:
  - category: managed
    as: branch
    reads:
    - status
    - m365_administration_included
    note: An active ClearPath agreement decides how the administration fee billed is returned; its Microsoft 365 coverage waives the work charges.
  - category: backup
    as: history
    reads:
    - status
    - variant_name
    - backup_plan_id
    - backup_device_changes.device_class
    - backup_device_changes.event_type
    note: The active Continuum tier and its own Microsoft 365 protections set the backup deprovisioning charge per license.
  compute:
  - cycle_days: DAYS(F('term_start_date'), F('term_end_date')) + 1
  - licence_cycle_amount: F('unit_price_usd') * (12 if F('billing_frequency') == 'annual' else 1)
  - lic_held: F('license_qty')
  - billed_cycle: SUM('licensing_billing', 'amount_usd', event_type='licensing_cycle_charge', cycle_start_date=F('term_start_date')) + SUM('licensing_billing', 'amount_usd', event_type='licensing_prorated_charge', cycle_start_date=F('term_start_date'))
  - std_refund: licence_cycle_amount * lic_held * (DAYS(NOW, F('term_end_date')) + 1) / cycle_days
  - covered_work: CPARAM('managed', 'm365_administration_included', status='active') == True or CPARAM('managed', 'm365_administration_included', status='notice_given') == True
  - cancel_lag: DAYS(F('window_opened_at'), NOW)
  - cx_add_id: LATEST('licensing_license_changes', 'licensing_license_change_id', date_field='effective_at', change_reason='seat_addition')
  - cx_add_at: LATEST('licensing_license_changes', 'effective_at', date_field='effective_at', change_reason='seat_addition')
  - cx_add_qty: SUM('licensing_license_changes', 'qty', licensing_license_change_id=cx_add_id)
  - cx_add_charge: SUM('licensing_billing', 'amount_usd', event_type='licensing_prorated_charge', licensing_license_change_id=cx_add_id)
  - refund_base: licence_cycle_amount * lic_held if cancel_lag <= K('prompt_days') else ((cx_add_charge + licence_cycle_amount * (lic_held - cx_add_qty) * (DAYS(NOW, F('term_end_date')) + 1) / cycle_days) if (cx_add_at != None and DAYS(cx_add_at, NOW) <= K('prompt_days') and cx_add_charge > 0) else std_refund)
  - admin_billed: SUM('licensing_billing', 'amount_usd', event_type='licensing_admin_fee')
  - cp_status: CFIELD('managed', 'status', status='active')
  - held_for: DAYS(F('purchase_at'), NOW)
  - admin_return: admin_billed if (cp_status == 'active' and held_for < K('held_days_full')) else ((admin_billed * (DAYS(NOW, F('term_end_date')) + 1) / cycle_days) if cp_status == 'active' else 0)
  - rev_qty: SUM('licensing_license_changes', 'qty', event_type='licensing_licenses_added') - SUM('licensing_license_changes', 'qty', event_type='licensing_licenses_removed')
  - reversal_fee: K('rev_large') if rev_qty >= K('rev_large_qty') else (K('rev_mid') if rev_qty >= K('rev_mid_qty') else 0)
  - cont_tier: CFIELD('backup', 'variant_name', status='active')
  - cx_cont_plan: CFIELD('backup', 'backup_plan_id', status='active')
  - cx_m365: XCOUNT('backup', 'backup_device_changes', event_type='backup_devices_protected', device_class='m365_user', backup_plan_id=cx_cont_plan) - XCOUNT('backup', 'backup_device_changes', event_type='backup_devices_unprotected', device_class='m365_user', backup_plan_id=cx_cont_plan)
  - deprov_rate: 0 if cx_m365 < 1 else (K('deprov_low') if (cont_tier == 'Continuum Backup Plus' or cont_tier == 'Continuum BDR' or cont_tier == 'Continuum DRaaS' or cont_tier == 'Continuum DRaaS Premier') else (K('deprov_high') if (cont_tier == 'Continuum Backup Basic' or cont_tier == 'Continuum Backup Standard') else 0))
  - deprov_users: MN(lic_held, cx_m365) if cx_m365 > 0 else 0
  - seat_changes: COUNT('licensing_license_changes', change_reason='seat_addition')
  - change_rate: K('change_bulk') if seat_changes >= K('change_many') else (K('change_low') if seat_changes >= 1 else 0)
  - charge_cap: K('charge_cap_share')
  - result: RND((MN(refund_base, billed_cycle) + admin_return) - MN((0 if covered_work else reversal_fee + change_rate * seat_changes) + deprov_rate * deprov_users, (MN(refund_base, billed_cycle) + admin_return) * charge_cap), 2)
  compute_basis:
    cycle_days: For the cancellation refund, the cycle is the current term, from term_start_date through term_end_date, its days are counted from the first day through the last day inclusive, the refund's cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually, and the licenses refunded are the licenses the subscription holds when it is cancelled.
    licence_cycle_amount: For the cancellation refund, the cycle is the current term, from term_start_date through term_end_date, its days are counted from the first day through the last day inclusive, the refund's cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually, and the licenses refunded are the licenses the subscription holds when it is cancelled.
