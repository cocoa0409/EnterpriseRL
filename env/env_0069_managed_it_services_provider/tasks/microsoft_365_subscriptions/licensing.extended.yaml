events:
  - type: licensing_subscription_purchased
    target: licensing_subscriptions
    mutation: create
    meaning: A signed order form is placed in Partner Center as a new subscription for one plan, term and billing frequency.
    grain: One subscription record per purchase.
    fields: {customer_id: Client organisation., variant_name: Plan purchased., tenant_domain: Tenant initial domain., term_type: P1M / P1Y / P3Y., billing_frequency: monthly or annual., purchase_at: Purchase moment., window_opened_at: Equal to purchase_at., term_start_date: Purchase date., term_end_date: Last day of the term., unit_price_usd: Locked price per license per month., auto_renew: Auto-renew setting.}
    triggers:
      - event: licensing:licensing_licenses_added
        map: {change_reason: initial_purchase}
  - type: licensing_provisioned
    target: licensing_subscriptions
    mutation: {transition: {from: provisioning, to: active}}
    meaning: Partner Center provisions the subscription and the licenses become assignable.
    grain: One transaction per subscription.
    fields: {term_start_date: Unchanged purchase date.}
    triggers:
      - event: licensing:licensing_cycle_charge
        map: {}
  - type: licensing_cancelled_in_window
    target: licensing_subscriptions
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The whole subscription is cancelled inside the cancellation window.
    grain: One transaction per subscription.
    fields: {closed_date: Cancellation date.}
    triggers:
      - event: licensing:licensing_licenses_removed
        map: {change_reason: cancellation}
  - type: licensing_suspended
    target: licensing_subscriptions
    mutation: {transition: {from: active, to: suspended}}
    meaning: The subscription is suspended for non-payment.
    grain: One transaction per suspension.
    fields: {suspended_date: Date suspended.}
    triggers: []
  - type: licensing_reactivated
    target: licensing_subscriptions
    mutation: {transition: {from: suspended, to: active}}
    meaning: The subscription is reactivated after payment.
    grain: One transaction per reactivation.
    fields: {suspended_date: Retained as the date of the suspension that ended.}
    triggers: []
  - type: licensing_expired
    target: licensing_subscriptions
    mutation: {transition: [{from: active, to: expired}, {from: suspended, to: expired}]}
    meaning: The term ends without renewal and the subscription expires.
    grain: One transaction per subscription.
    fields: {closed_date: Expiry date (the day after term_end_date).}
    triggers:
      - event: licensing:licensing_licenses_removed
        map: {change_reason: expiry}
  - type: licensing_renewed
    target: licensing_subscriptions
    mutation: update
    meaning: The subscription renews into a new term at the current price list with any scheduled changes applied.
    grain: One transaction per renewal.
    fields: {term_type: Term of the new term., term_start_date: Day after the old term_end_date., term_end_date: Last day of the new term., unit_price_usd: Price for the new term., window_opened_at: 00:00 on the new term_start_date., scheduled_renewal_qty: Reset to 0., scheduled_renewal_term_type: Reset to unchanged., renewal_count: Incremented.}
    triggers: []
  - type: licensing_renewal_settings_changed
    target: licensing_subscriptions
    mutation: update
    meaning: A signed renewal change schedules the next term's quantity or term, or turns auto-renew on or off.
    grain: One transaction per signed renewal change.
    fields: {auto_renew: New setting., scheduled_renewal_qty: Quantity scheduled for the next term., scheduled_renewal_term_type: Term scheduled for the next term.}
    triggers: []
  - type: licensing_upgraded
    target: licensing_subscriptions
    mutation: update
    meaning: A signed upgrade moves the whole subscription to a higher plan mid-term.
    grain: One transaction per upgrade.
    fields: {variant_name: New plan., unit_price_usd: New locked price for the rest of the term., upgraded_date: Date of the upgrade.}
    triggers:
      - event: licensing:licensing_prorated_charge
        map: {charge_reason: upgrade_difference}
  - type: licensing_licenses_added
    target: licensing_license_changes
    meaning: Licenses are added to the subscription (initial purchase quantity, a seat addition, or a renewal increase).
    grain: One row per quantity change submitted.
    distinguish_by: [effective_at, change_reason]
    fields: {qty: Licenses added., effective_at: Submission moment., change_reason: initial_purchase / seat_addition / renewal_increase.}
    account: licenses
    direction: in
    triggers:
      - event: licensing:licensing_prorated_charge
        when: {change_reason: seat_addition}
        map: {licensing_license_change_id: licensing_license_change_id, charge_reason: seat_addition}
  - type: licensing_licenses_removed
    target: licensing_license_changes
    meaning: Licenses are removed (an in-window reduction, a cancellation, a renewal reduction, or expiry).
    grain: One row per quantity change submitted.
    distinguish_by: [effective_at, change_reason]
    fields: {qty: Licenses removed., effective_at: Submission moment., change_reason: in_window_reduction / cancellation / renewal_reduction / expiry., source_change_id: The seat addition reduced when the reduction targets added licenses.}
    account: licenses
    direction: out
    triggers:
      - event: licensing:licensing_refund_credit
        when: {change_reason: [in_window_reduction, cancellation]}
        map: {licensing_license_change_id: licensing_license_change_id}
  - type: licensing_cycle_charge
    target: licensing_billing
    meaning: The commitment is invoiced for one billing cycle (a month for monthly billing, a term year for annual billing).
    grain: One row per subscription per billing cycle.
    distinguish_by: [cycle_start_date]
    fields: {amount_usd: Charge., invoice_number: Invoice., cycle_start_date: Cycle start., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: licensing_prorated_charge
    target: licensing_billing
    meaning: A partial-cycle charge for licenses added mid-cycle or for the price difference of an upgrade.
    grain: One row per seat addition, or per upgrade per cycle.
    distinguish_by: [charge_reason, licensing_license_change_id, cycle_start_date]
    fields: {charge_reason: seat_addition or upgrade_difference., licensing_license_change_id: Seat addition billed (empty for an upgrade)., amount_usd: Amount., invoice_number: Invoice., cycle_start_date: Cycle the charge falls in., posted_date: Posting date.}
    account: receivable
    direction: in
    triggers: []
  - type: licensing_refund_credit
    target: licensing_billing
    meaning: A prorated refund for licenses reduced or cancelled inside the window.
    grain: One row per reduction or cancellation.
    distinguish_by: [licensing_license_change_id]
    fields: {licensing_license_change_id: The reduction or cancellation refunded., charge_reason: in_window_reduction or cancellation., amount_usd: Refund., invoice_number: Invoice credited., cycle_start_date: Cycle refunded., posted_date: Posting date.}
    account: receivable
    direction: out
    triggers: []
  - type: licensing_admin_fee
    target: licensing_billing
    meaning: The Stratton Bay license administration fee for a calendar month.
    grain: One row per subscription per month.
    distinguish_by: [billing_period]
    fields: {amount_usd: Fee., invoice_number: Invoice., billing_period: Month., posted_date: Invoice date.}
    account: receivable
    direction: in
    triggers: []
  - type: licensing_payment
    target: licensing_billing
    meaning: A payment is applied to an invoice.
    grain: One row per remittance per invoice.
    distinguish_by: [payment_reference, invoice_number]
    fields: {payment_reference: Remittance reference., amount_usd: Amount applied., invoice_number: Invoice paid., posted_date: Date received.}
    account: receivable
    direction: out
    triggers: []
  - type: licensing_late_fee
    target: licensing_billing
    meaning: A late fee is assessed on a past-due invoice.
    grain: One row per invoice per month assessed.
    distinguish_by: [invoice_number, billing_period]
    fields: {invoice_number: Past-due invoice., billing_period: Month assessed., amount_usd: Fee., posted_date: Assessment date.}
    account: receivable
    direction: in
    triggers: []


measures:
  - id: licensing_msr_tenant_plan_licenses
    window: Point in time, immediately before the write being decided.
    measure: Sum of license_qty over the client's subscriptions of the same variant_name whose status is provisioning, active or suspended.

policies:
  - id: licensing_agg_multi_holding
    subject: [licensing_subscription_purchased]
    rule: >-
      A client's single Microsoft 365 tenant may carry any number of subscriptions: different plans, and the same plan on
      different terms or billing frequencies, each subscription holding one plan on one term with its own term dates, price
      and cancellation window. Licenses of different subscriptions are never pooled for pricing, proration, refunds or
      renewal; each subscription is decided on its own records, while the tenant-wide cap in licensing_agg_tenant_plan_cap
      is the only rule that adds them up.
    eligibility: []
    params:
      max_per_customer: null

  - id: licensing_agg_tenant_plan_cap
    subject: [licensing_subscription_purchased, licensing_licenses_added]
    rule: >-
      The licenses of one plan held by the tenant across all its subscriptions whose status is provisioning, active or
      suspended (licensing_msr_tenant_plan_licenses) plus the licenses being added may never exceed the plan's
      max_licenses_per_tenant; a plan marked unlimited has no cap. A new subscription or seat addition that would pass the
      cap cannot be placed, in whole or in part: the users beyond the cap must be licensed on a plan without a cap. Licenses
      on expired or cancelled subscriptions do not count toward the cap.
    eligibility: []
    measures: [licensing_msr_tenant_plan_licenses]
    formula:
      tenant_total_after: licensing_msr_tenant_plan_licenses + qty

  - id: licensing_purchase_and_pricing
    subject: [licensing_subscription_purchased, licensing_provisioned, licensing_cycle_charge]
    rule: >-
      A new subscription is placed for one plan, a term listed in allowed_term_types and a billing frequency the term offers
      (billing_frequency_p1m for P1M, billing_frequencies_p1y_p3y for P1Y and P3Y), with at least min_licenses_per_order
      licenses. A new subscription may be placed only from the authorized contact's signed order form. A plan whose frontline_workers_only is true,
      Microsoft 365 F3, may be assigned only to frontline workers who do not use a dedicated computer; a request to license office staff on it is
      refused. The locked unit_price_usd is annual_price_usd for a P1Y or P3Y term billed annually, annual_price_usd increased
      by monthly_billing_surcharge_pct percent for a P1Y or P3Y term billed monthly, and annual_price_usd increased by
      monthly_term_premium_pct percent for a P1M term, each rounded half up to the cent; because price_locked_for_term is true the price stays
      fixed for the term and only changes at renewal or upgrade, and where triennial_price_lock is true a P3Y term keeps it
      for all three years. A new subscription renews automatically unless the order form says otherwise, as
      auto_renew_default is true. The term starts on the purchase date and ends the day before the same day of
      the month one month (P1M), twelve months (P1Y) or thirty-six months (P3Y) later; when that day does not exist in the
      end month, the last day of that month is used as the anniversary. Billing cycles start on term_start_date and on the
      same day of each following month for monthly billing, or of each following year for annual billing, the last day of
      the month standing in when the day does not exist, and each cycle ends the day before the next one starts. Each cycle
      is invoiced on its first day: unit_price_usd times license_qty at the cycle start for a monthly cycle, and twelve times
      that for an annual cycle, rounded half up to the cent; the first cycle is invoiced when the subscription is
      provisioned. A cycle charge may be invoiced only while the subscription status is active or suspended.
    eligibility:
      - id: signed_order_form
        applies_to: [licensing_subscription_purchased]
        kind: authorization
        condition: A new subscription may be placed only from the authorized contact's signed order form.
        evidence_fields: [licensing_change_requests.licensing_request_id, licensing_change_requests.request_type, licensing_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_change_requests.licensing_request_id]]
          action_bindings: {licensing_change_requests.licensing_request_id: licensing_request_id}
      - id: cycle_charge_status
        applies_to: [licensing_cycle_charge]
        kind: state
        condition: A cycle charge may be invoiced only while the subscription status is active or suspended.
        evidence_fields: [licensing_subscriptions.licensing_subscription_id, licensing_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_subscriptions.licensing_subscription_id]]
          action_bindings: {licensing_subscriptions.licensing_subscription_id: licensing_subscription_id}
        state_contract:
          field: licensing_subscriptions.status
          allowed: [active, suspended]
    params:
      per_tier:
        Microsoft 365 Business Basic: {annual: =annual_price_usd, surcharge_pct: =monthly_billing_surcharge_pct, premium_pct: =monthly_term_premium_pct}
        Microsoft 365 F3: {annual: =annual_price_usd, surcharge_pct: =monthly_billing_surcharge_pct, premium_pct: =monthly_term_premium_pct}
        Microsoft 365 Business Standard: {annual: =annual_price_usd, surcharge_pct: =monthly_billing_surcharge_pct, premium_pct: =monthly_term_premium_pct}
        Microsoft 365 Business Premium: {annual: =annual_price_usd, surcharge_pct: =monthly_billing_surcharge_pct, premium_pct: =monthly_term_premium_pct}
        Microsoft 365 E3 (no Teams): {annual: =annual_price_usd, surcharge_pct: =monthly_billing_surcharge_pct, premium_pct: =monthly_term_premium_pct}
        Microsoft 365 E5 (no Teams): {annual: =annual_price_usd, surcharge_pct: =monthly_billing_surcharge_pct, premium_pct: =monthly_term_premium_pct}
    formula:
      unit_price_usd: round(annual_price_usd * (1 + (monthly_term_premium_pct if term_type == "P1M" else (monthly_billing_surcharge_pct if billing_frequency == "monthly" else 0)) / 100), 2)
      amount_usd: round(unit_price_usd * license_qty * (12 if billing_frequency == "annual" else 1), 2)

  - id: licensing_seat_additions
    subject: [licensing_licenses_added, licensing_prorated_charge]
    rule: >-
      Licenses may be added to a subscription at any time during its term; added licenses share the subscription's term end
      date and locked unit_price_usd. License additions may be posted only while the subscription status is provisioning or
      active. A seat addition is charged for the rest of the billing cycle in which it is submitted: unit_price_usd times qty
      times the number of calendar days from the date part of effective_at through the cycle's last day inclusive, divided
      by the number of days in that cycle, rounded half up to the cent; later cycles include the added licenses in the cycle
      charge. The initial purchase quantity is billed by the first cycle charge, not by proration. A renewal increase takes
      effect on the renewal date and is billed by the renewal term's cycle charges.
    eligibility:
      - id: addition_status
        applies_to: [licensing_licenses_added]
        kind: state
        condition: License additions may be posted only while the subscription status is provisioning or active.
        evidence_fields: [licensing_subscriptions.licensing_subscription_id, licensing_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_subscriptions.licensing_subscription_id]]
          action_bindings: {licensing_subscriptions.licensing_subscription_id: licensing_subscription_id}
        state_contract:
          field: licensing_subscriptions.status
          allowed: [provisioning, active]

  - id: licensing_cancellation_window
    subject: [licensing_cancelled_in_window, licensing_licenses_removed, licensing_refund_credit]
    rule: >-
      Under new-commerce terms a commitment can be undone only briefly. A subscription may be cancelled in full only within
      cancellation_window_hours hours after the cancellation window opens. A reduction that names no source seat addition
      must be submitted within cancellation_window_hours hours after the cancellation window opens. A reduction of licenses
      added by a seat addition, which names that seat addition as its source, must be submitted within
      added_seat_reduction_window_hours hours after that seat addition is submitted. Such a reduction may remove no more
      licenses than that addition added. The window is counted in elapsed hours from the opening moment, and a request submitted at the
      exact closing minute is inside it. The cancellation window opens at the purchase moment and again at 00:00 on the first
      day of every renewal term. After the windows close, licenses can be neither cancelled nor reduced until the term ends:
      the client may only schedule a lower renewal quantity or turn auto-renew off; a P1M term ends at its
      next cycle end when auto-renew is turned off, as monthly_term_turn_off_auto_renew allows. A cancellation or in-window reduction is
      refunded where refund_on_window_reduction is true: unit_price_usd times the licenses removed times the number of
      calendar days from the date part of effective_at through the last day of the current billing cycle inclusive, divided
      by the days in that cycle, rounded half up to the cent, credited to the next invoice. Licenses removed at expiry or by
      a renewal reduction are never refunded.
    eligibility:
      - id: cancel_in_window
        applies_to: [licensing_cancelled_in_window]
        kind: time
        condition: A subscription may be cancelled in full only within cancellation_window_hours hours after the cancellation window opens.
        evidence_fields: [licensing_subscriptions.licensing_subscription_id, licensing_subscriptions.window_opened_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_subscriptions.licensing_subscription_id]]
          action_bindings: {licensing_subscriptions.licensing_subscription_id: licensing_subscription_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cancellation window opens
          anchor_source: licensing_subscriptions.window_opened_at
          relation: not_after
          duration_source: variants.cancellation_window_hours
          unit: elapsed_hours
          counting_rule: The window is counted in elapsed hours from the opening moment, and a request submitted at the exact closing minute is inside it.
          boundary: inclusive
      - id: reduce_in_subscription_window
        applies_to: [licensing_licenses_removed]
        kind: time
        condition: A reduction that names no source seat addition must be submitted within cancellation_window_hours hours after the cancellation window opens.
        evidence_fields: [licensing_subscriptions.licensing_subscription_id, licensing_subscriptions.window_opened_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_subscriptions.licensing_subscription_id]]
          action_bindings: {licensing_subscriptions.licensing_subscription_id: licensing_subscription_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cancellation window opens
          anchor_source: licensing_subscriptions.window_opened_at
          relation: not_after
          duration_source: variants.cancellation_window_hours
          unit: elapsed_hours
          counting_rule: The window is counted in elapsed hours from the opening moment, and a request submitted at the exact closing minute is inside it.
          boundary: inclusive
      - id: reduce_added_seats_window
        applies_to: [licensing_licenses_removed]
        kind: time
        condition: A reduction of licenses added by a seat addition, which names that seat addition as its source, must be submitted within added_seat_reduction_window_hours hours after that seat addition is submitted.
        evidence_fields: [licensing_license_changes.licensing_license_change_id, licensing_license_changes.effective_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_license_changes.licensing_license_change_id]]
          action_bindings: {licensing_license_changes.licensing_license_change_id: source_change_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: that seat addition is submitted
          anchor_source: licensing_license_changes.effective_at
          relation: not_after
          duration_source: variants.added_seat_reduction_window_hours
          unit: elapsed_hours
          counting_rule: The window is counted in elapsed hours from the opening moment, and a request submitted at the exact closing minute is inside it.
          boundary: inclusive

  - id: licensing_renewal_and_expiry
    subject: [licensing_renewed, licensing_renewal_settings_changed, licensing_expired]
    rule: >-
      The renewal date is the day after term_end_date. A subscription whose auto_renew is true renews on the renewal date
      into a new term of scheduled_renewal_term_type (the current term_type when unchanged) at scheduled_renewal_qty licenses
      (the quantity held at term end when it is 0); the difference from the quantity held is posted as a renewal increase or
      renewal reduction on the renewal date. A subscription that is suspended on the renewal date renews at the quantity it
      holds, a scheduled increase being dropped. The renewal term is priced, as renewal_price_basis says, from the current price list for the plan, term and
      billing frequency under licensing_purchase_and_pricing, not from the expiring price, and a new cancellation window
      opens. Scheduled renewal changes must be saved no later than renewal_change_cutoff_days calendar days before the
      renewal date. The cutoff is the renewal date minus renewal_change_cutoff_days calendar days, and a change saved on the
      cutoff date itself is in time. A change saved after the cutoff applies only to the renewal after next. A subscription
      whose auto_renew is false expires on the renewal date: users keep access for expired_access_days days, then only
      administrators can reach the data for disabled_retention_days days, after which it is deleted; buying a new
      subscription of the same plan within those periods restores access. Renewal settings may be changed only while the
      subscription status is active or suspended.
    eligibility:
      - id: renewal_change_cutoff
        applies_to: [licensing_renewal_settings_changed]
        kind: time
        condition: Scheduled renewal changes must be saved no later than renewal_change_cutoff_days calendar days before the renewal date.
        evidence_fields: [licensing_subscriptions.licensing_subscription_id, licensing_subscriptions.term_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_subscriptions.licensing_subscription_id]]
          action_bindings: {licensing_subscriptions.licensing_subscription_id: licensing_subscription_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal date
          anchor_source: licensing_subscriptions.term_end_date
          relation: not_after
          duration_source: variants.renewal_change_cutoff_days
          unit: calendar_days
          counting_rule: The cutoff is the renewal date minus renewal_change_cutoff_days calendar days, and a change saved on the cutoff date itself is in time.
          boundary: inclusive
      - id: renewal_settings_status
        applies_to: [licensing_renewal_settings_changed]
        kind: state
        condition: Renewal settings may be changed only while the subscription status is active or suspended.
        evidence_fields: [licensing_subscriptions.licensing_subscription_id, licensing_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_subscriptions.licensing_subscription_id]]
          action_bindings: {licensing_subscriptions.licensing_subscription_id: licensing_subscription_id}
        state_contract:
          field: licensing_subscriptions.status
          allowed: [active, suspended]

  - id: licensing_upgrades
    subject: [licensing_upgraded, licensing_prorated_charge]
    rule: >-
      A subscription may be upgraded mid-term only to a plan listed in its plan's upgrade_paths that offers the
      subscription's term_type, and only for its whole license quantity because partial_upgrade_allowed is false; a client
      wanting to move only some users buys a new subscription of the higher plan and lowers the old one at renewal. An
      upgrade may take effect only while the subscription status is active. An upgrade needs the authorized contact's signed
      order form. The term, term end date, billing frequency, quantity and cancellation window stay as they are; the new
      unit_price_usd is the target plan's price for the same term_type and billing_frequency under
      licensing_purchase_and_pricing. The price difference (new unit_price_usd minus old unit_price_usd) times license_qty is
      charged for the rest of the current billing cycle, from the upgrade date through the cycle's last day inclusive divided
      by the days in the cycle, rounded half up to the cent; later cycles are charged at the new price. A move to a lower
      plan cannot take effect mid-term because downgrade_mid_term_allowed is false: the client buys the lower plan as a new
      subscription and turns off auto-renew or lowers the renewal quantity on the old one.
    eligibility:
      - id: upgrade_active
        applies_to: [licensing_upgraded]
        kind: state
        condition: An upgrade may take effect only while the subscription status is active.
        evidence_fields: [licensing_subscriptions.licensing_subscription_id, licensing_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_subscriptions.licensing_subscription_id]]
          action_bindings: {licensing_subscriptions.licensing_subscription_id: licensing_subscription_id}
        state_contract:
          field: licensing_subscriptions.status
          allowed: [active]
      - id: upgrade_signed
        applies_to: [licensing_upgraded]
        kind: authorization
        condition: An upgrade needs the authorized contact's signed order form.
        evidence_fields: [licensing_change_requests.licensing_request_id, licensing_change_requests.request_type, licensing_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[licensing_change_requests.licensing_request_id]]
          action_bindings: {licensing_change_requests.licensing_request_id: licensing_request_id}

  - id: licensing_admin_fee_rules
    subject: [licensing_admin_fee]
    rule: >-
      On the first day of each calendar month the license administration fee for the previous month is invoiced on every
      subscription whose status was active or suspended at the end of that month: admin_fee_usd times license_qty at the end
      of that month, rounded half up to the cent. Where admin_fee_waived_with_clearpath_admin is true, no fee is posted for a
      month in which the client held a ClearPath agreement whose status was active or notice_given on the last day of the
      month and whose tier has m365_administration_included true; a ClearPath Monitor agreement does not waive the fee.
      Expired and cancelled subscriptions carry no fee for the months after they ended.
    eligibility: []
    formula:
      amount_usd: round(admin_fee_usd * license_qty, 2)

  - id: licensing_billing_and_collections
    subject: [licensing_payment, licensing_late_fee, licensing_suspended, licensing_reactivated]
    rule: >-
      Invoices fall due invoice_due_days calendar days after posting. A payment is applied to the invoice its remittance
      names, otherwise to the oldest open invoice first, one entry per invoice applied; card payments are accepted only for
      an invoice whose total does not exceed card_payment_max_usd. On the first day of each calendar month every invoice still
      unpaid more than late_fee_grace_days calendar days after its due date is assessed one late fee of late_fee_pct_monthly
      percent of its unpaid balance, or late_fee_minimum_usd if greater, rounded half up to the cent. A subscription may be
      suspended once the oldest unpaid invoice on it is suspension_days_past_due days past due; because
      suspension_charges_continue is true, cycle charges keep being invoiced during suspension and the commitment is not
      reduced. The subscription is reactivated once every past-due invoice on it is paid in full.
    eligibility: []

  - id: licensing_client_authorization
    subject: [licensing_subscription_purchased, licensing_cancelled_in_window, licensing_renewal_settings_changed, licensing_upgraded, licensing_licenses_added, licensing_licenses_removed]
    rule: >-
      New subscriptions, cancellations, renewal changes and upgrades commit or release the client's money and, as
      signed_order_form_required says, need the authorized contact's signed order form: the service desk registers each as a change request carrying the plan, term,
      billing frequency, quantity or auto-renew setting asked for, pending signature, and Partner Center is changed only once
      it is signed. Seat additions and in-window reductions are placed on the instruction of a verified authorized contact
      where seat_addition_by_verified_contact is true. Any change to a subscription may be made only for the client's
      authorized contact after identity verification has passed. Stratton Bay deploys its conditional access and device
      compliance baseline only on plans whose security_baseline_policies is true; plans whose teams_included is false need a
      separate Microsoft Teams licence, and the Microsoft 365 Copilot add-on may be attached only to plans whose
      copilot_addon_eligible is true. Plan features (mailbox_size_gb, archive_included, litigation_hold_included,
      onedrive_storage_gb, desktop_apps_included, desktop_app_installs_per_user, intune_included, entra_id_plan,
      defender_plan, windows_license) are Microsoft's and decide which plan fits a requirement; provisioning_target_hours is
      a target only. Partial-cycle charges and refunds follow proration_basis, daily over the billing cycle.
    eligibility:
      - id: verified_contact
        applies_to: [licensing_subscription_purchased, licensing_cancelled_in_window, licensing_renewal_settings_changed, licensing_upgraded, licensing_licenses_added, licensing_licenses_removed]
        kind: authorization
        condition: Any change to a subscription may be made only for the client's authorized contact after identity verification has passed.
        evidence_fields: [identity_verifications.customer_id, identity_verifications.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[identity_verifications.customer_id]]
          action_bindings: {identity_verifications.customer_id: customer_id}

extended_policies:
- id: licensing_ext_reduction_credit
  base_policy_refs:
  - licensing_cancellation_window
  overwrite:
  - base_policy: licensing_cancellation_window
    superseded_clause: 'A cancellation or in-window reduction is refunded where refund_on_window_reduction is true: unit_price_usd times the licenses removed times the number of calendar days from the date part of effective_at through the last day of the current billing cycle inclusive, divided by the days in that cycle, rounded half up to the cent, credited to the next invoice.'
    replaced_by: For an in-window reduction on a subscription whose plan has refund_on_window_reduction true and whose billing cycle runs its whole term (a P1M term, or a P1Y term billed annually), and only for such a reduction, the reduction credit is worked out under this schedule; the cancellation of a whole subscription is refunded under its own cancellation schedule, and a reduction on any other subscription is still refunded, where refund_on_window_reduction is true, unit_price_usd times the licenses removed times the calendar days from the date part of effective_at through the last day of the current billing cycle inclusive, divided by the days in that cycle, rounded half up to the cent. Every in-window reduction is credited to the invoice that billed the cycle it refunds, not to the next invoice.
  trigger: state_due
  subject:
  - licensing_refund_credit
  computes: amount_usd
  target_tool: post_reduction_credit_23f8ed2c
  params:
    fee_standard: 25.0
    fee_monitor: 10.0
    fee_covered: 0.0
    early_lag_days: 2
    goodwill_long: 50.0
    goodwill_short: 25.0
    delay_long_days: 30
    delay_short_days: 8
    review_high_pct: 5.0
    review_mid_pct: 2.5
    vcio_high: 4
    vcio_mid: 1
    fee_cap_share: 0.5
  rule: 'For an in-window reduction on a subscription whose plan has refund_on_window_reduction true and whose billing cycle runs its whole term (a P1M term, or a P1Y term billed annually), and only for such a reduction, the reduction credit is worked out under this schedule; the cancellation of a whole subscription is refunded under its own cancellation schedule, and a reduction on any other subscription is still refunded, where refund_on_window_reduction is true, unit_price_usd times the licenses removed times the calendar days from the date part of effective_at through the last day of the current billing cycle inclusive, divided by the days in that cycle, rounded half up to the cent. Every in-window reduction is credited to the invoice that billed the cycle it refunds, not to the next invoice. The reduction credited is the in-window reduction with the latest submission moment recorded on the subscription; a subscription records one quantity change per submission moment and reason, so two in-window reductions never share a submission moment; the licenses removed are that reduction''s quantity, and a subscription with no in-window reduction is owed no reduction credit. For the reduction credit, the cycle is the current term, from term_start_date through term_end_date, and the days in the cycle are the calendar days from its first day through its last day inclusive. The reduction credit''s cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually. The standard reduction credit is the prorated amount, which is the reduction credit''s cycle amount per license times the licenses removed times the calendar days from the date part of the reduction''s submission moment through the last day of the cycle inclusive divided by the days in the cycle, less the standard license change fee of 25.00 USD, never more than half the prorated amount, so a reduction always carries a reduction credit above 0.00, rounded half up to the cent. The adjustments below change the standard reduction credit in this order: those that change how the prorated amount is worked out come first, percentage additions then act on that prorated amount, and fixed amounts are added or subtracted last; the result is rounded half up to the cent once, at the end. A reduction counts as made in a renewal window when the subscription has renewed at least once and the reduction was submitted at or after the moment the current cancellation window opened. How the prorated amount of the reduction credit is worked out follows what the reduction releases, the reduction''s opening lag being the calendar days from the date the cancellation window opened to the reduction''s submission date: when the reduction names no source seat addition, was made in a renewal window and has an opening lag of two days or fewer, the licenses are credited as never renewed and the prorated amount is the cycle amount per license times the licenses removed, with no day count; when the reduction names a source seat addition that carries a partial-cycle charge on the billing ledger, that charge is reversed in proportion, the prorated amount being that partial-cycle charge times the licenses removed divided by the licenses the seat addition added; any other reduction, including one naming a source seat addition with no partial-cycle charge or no record, is prorated under the standard method. The license change fee netted from a reduction credit follows the client''s ClearPath coverage: where the client holds a ClearPath agreement whose status is active or notice_given and whose tier has m365_administration_included true, the change is covered work and the fee is 0.00 USD; where the client holds an active ClearPath Monitor agreement, the fee is 10.00 USD; any other client pays the standard license change fee; whichever fee applies is netted, as under the standard method, never more than half the prorated amount. A reduction credit posted late carries Stratton Bay''s billing-delay goodwill: when more than 30 calendar days separate the reduction''s submission date and the posting date, 50.00 USD is added; when 8 to 30 calendar days separate them, 25.00 USD is added; when 7 days or fewer separate them, nothing is added. A reduction made in a renewal window carries Stratton Bay''s pre-renewal review goodwill on the reduction credit: when the client''s active ClearPath tier provides four or more vCIO reviews a year, 5 percent of the prorated amount is added; when it provides one to three vCIO reviews a year, 2.5 percent is added; a reduction outside a renewal window, a client whose active ClearPath tier provides no vCIO review, or a client with no active ClearPath agreement receives no review goodwill.'
