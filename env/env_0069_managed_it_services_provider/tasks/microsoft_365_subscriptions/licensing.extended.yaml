    note: The ClearPath agreement's status, tier and tier parameters decide the change fee and the review goodwill.
  compute:
  - red_at: LATEST('licensing_license_changes', 'effective_at', date_field='effective_at', change_reason='in_window_reduction')
  - red_src: LATEST('licensing_license_changes', 'source_change_id', date_field='effective_at', change_reason='in_window_reduction')
  - red_qty: SUM('licensing_license_changes', 'qty', change_reason='in_window_reduction', effective_at=red_at)
  - cycle_days: DAYS(F('term_start_date'), F('term_end_date')) + 1
  - licence_cycle_amount: F('unit_price_usd') * (12 if F('billing_frequency') == 'annual' else 1)
  - std_prorated: licence_cycle_amount * red_qty * (DAYS(red_at, F('term_end_date')) + 1) / cycle_days
  - in_renewal_window: F('renewal_count') >= 1 and red_at >= F('window_opened_at')
  - opening_lag: DAYS(F('window_opened_at'), red_at)
  - src_charge: SUM('licensing_billing', 'amount_usd', event_type='licensing_prorated_charge', licensing_license_change_id=red_src)
  - src_qty: SUM('licensing_license_changes', 'qty', licensing_license_change_id=red_src)
  - prorated: licence_cycle_amount * red_qty if ((red_src == None or red_src == '') and in_renewal_window and opening_lag <= K('early_lag_days')) else ((src_charge * red_qty / src_qty) if (src_charge > 0 and src_qty > 0) else std_prorated)
  - cov_active: CPARAM('managed', 'm365_administration_included', status='active')
  - cov_notice: CPARAM('managed', 'm365_administration_included', status='notice_given')
  - cp_tier: CFIELD('managed', 'variant_name', status='active')
  - change_fee: K('fee_covered') if (cov_active == True or cov_notice == True) else (K('fee_monitor') if cp_tier == 'ClearPath Monitor' else K('fee_standard'))
  - delay_days: DAYS(red_at, NOW)
  - delay_goodwill: K('goodwill_long') if delay_days > K('delay_long_days') else (K('goodwill_short') if delay_days >= K('delay_short_days') else 0)
  - vcio: CPARAM('managed', 'vcio_reviews_per_year', status='active')
  - review_pct: K('review_high_pct') if (in_renewal_window and vcio != None and vcio >= K('vcio_high')) else (K('review_mid_pct') if (in_renewal_window and vcio != None and vcio >= K('vcio_mid')) else 0)
