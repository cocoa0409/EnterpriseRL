  compute:
  - lic: SUM('licensing_license_changes', 'qty', event_type='licensing_licenses_added') - SUM('licensing_license_changes', 'qty', event_type='licensing_licenses_removed')
  - cov_active: CPARAM('managed', 'm365_administration_included', status='active')
  - cov_notice: CPARAM('managed', 'm365_administration_included', status='notice_given')
  - cp_tier: CFIELD('managed', 'variant_name', status='active')
  - cover_pct: 100 if P('admin_fee_waived_with_clearpath_admin') != True else (K('cover_none_pct') if (cov_active == True or cov_notice == True) else (K('cover_half_pct') if (cp_tier == 'ClearPath Monitor' and cov_active == False) else 100))
  - term_days: DAYS(F('term_start_date'), F('term_end_date')) + 1
  - term_pct: K('term_long_pct') if term_days >= K('term_long_days') else (K('term_short_pct') if term_days <= K('term_short_days') else 100)
  - vol_lic: SUM('licensing_license_changes', 'qty', event_type='licensing_licenses_added') - SUM('licensing_license_changes', 'qty', event_type='licensing_licenses_removed')
  - vol_pct: K('vol_high_pct') if vol_lic >= K('vol_high') else (K('vol_mid_pct') if vol_lic >= K('vol_mid') else 100)
  - sentinel_idt: CPARAM('security', 'identity_threat_detection', status='active')
  - upkeep: K('upkeep_low') if (P('security_baseline_policies') == True and sentinel_idt == True) else (K('upkeep_high') if P('security_baseline_policies') == True else 0)
  - held_days: DAYS(F('purchase_at'), NOW)
  - month_part: held_days / K('month_days') if held_days < K('month_days') else ((K('month_days') - MN(DAYS(F('suspended_date'), NOW), K('month_days'))) / K('month_days') if F('status') == 'suspended' else 1)
  - cont_status: CFIELD('backup', 'status', status='active')
  - cont_plan: CFIELD('backup', 'backup_plan_id', status='active')
  - m365_protected: XCOUNT('backup', 'backup_device_changes', event_type='backup_devices_protected', device_class='m365_user', backup_plan_id=cont_plan) - XCOUNT('backup', 'backup_device_changes', event_type='backup_devices_unprotected', device_class='m365_user', backup_plan_id=cont_plan)
  - bundle_pct: K('bundle_full_pct') if (cont_status == 'active' and m365_protected >= lic) else (K('bundle_part_pct') if (cont_status == 'active' and m365_protected >= 1) else 100)
  - result: RND((P('admin_fee_usd') * term_pct / 100 * vol_pct / 100 * bundle_pct / 100 + upkeep) * lic * cover_pct / 100 * month_part, 2)
