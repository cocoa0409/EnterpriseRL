  factors:
  - id: early_release_anchor
    effect: method
    decides: prorated
    bindings:
    - opening_lag
    - src_charge
    - src_qty
    - prorated
    ladder:
    - when: the reduction names no source seat addition AND was made in a renewal window with an opening lag of two days or fewer
      method: 'credited as never renewed: the cycle amount per license times the licenses removed, with no day count'
    - when: the reduction names a source seat addition AND that seat addition carries a partial-cycle charge
      method: 'the source seat addition''s partial-cycle charge reversed in proportion: that charge times the licenses removed divided by the licenses it added'
    - when: otherwise
      method: the standard prorated amount over the days from the reduction date through the end of the cycle
    baseline:
      prorated: std_prorated
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: clearpath_change_fee
    effect: parameter
    decides: change_fee
    bindings:
    - cov_active
    - cov_notice
    - cp_tier
    - change_fee
    ladder:
    - when: a ClearPath agreement with status active OR notice_given on a tier whose m365_administration_included is true
      value: 0.00 USD (K('fee_covered'))
    - when: an active ClearPath Monitor agreement
      value: 10.00 USD (K('fee_monitor'))
    - when: otherwise
      value: the standard license change fee, 25.00 USD (K('fee_standard'))
    baseline:
      change_fee: K('fee_standard')
    evidence:
    - cross_category
    cross_difficulty: managed
  - id: posting_delay_goodwill
    effect: parameter
    decides: delay_goodwill
    bindings:
    - delay_days
    - delay_goodwill
    ladder:
    - when: more than 30 calendar days between the reduction's submission date and the posting date
      value: 50.00 USD (K('goodwill_long'))
    - when: 8 to 30 calendar days between them
      value: 25.00 USD (K('goodwill_short'))
    - when: otherwise (7 days or fewer)
      value: nothing (0)
    baseline:
      delay_goodwill: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: review_miss_goodwill
    effect: parameter
    decides: review_pct
    bindings:
    - vcio
    - review_pct
    ladder:
    - when: the reduction was made in a renewal window AND the active ClearPath tier provides four or more vCIO reviews a year
      value: 5 percent of the prorated amount (K('review_high_pct'))
    - when: the reduction was made in a renewal window AND the active ClearPath tier provides one to three vCIO reviews a year
      value: 2.5 percent of the prorated amount (K('review_mid_pct'))
    - when: otherwise (outside a renewal window, no vCIO review, or no active ClearPath agreement)
      value: nothing (0)
    baseline:
      review_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: managed
  baseline:
    rule: For the reduction credit, the cycle is the current term, from term_start_date through term_end_date, and the days in the cycle are the calendar days from its first day through its last day inclusive. The reduction credit's cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually. The standard reduction credit is the prorated amount, which is the reduction credit's cycle amount per license times the licenses removed times the calendar days from the date part of the reduction's submission moment through the last day of the cycle inclusive divided by the days in the cycle, less the standard license change fee of 25.00 USD, never more than half the prorated amount, so a reduction always carries a reduction credit above 0.00, rounded half up to the cent.
    params:
    - fee_standard
    - fee_cap_share
  inputs:
