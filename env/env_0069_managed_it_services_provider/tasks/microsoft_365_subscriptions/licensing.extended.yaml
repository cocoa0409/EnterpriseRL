- id: licensing_ext_payment_arrangement
  base_policy_refs:
  - licensing_billing_and_collections
  overwrite: []
  trigger: on_request
  subject:
  - licensing_payment
  computes: amount_usd
  target_tool: pay_arrangement_instalment_a0d5f2e9
  params:
    n_long: 6
    n_active: 4
    n_standard: 3
    down_large_pct: 25.0
    down_mid_pct: 10.0
    down_large: 5000.0
    down_mid: 2500.0
    front_high: 1.5
    front_mid: 1.25
  rule: 'A client whose subscription carries a past-due cycle invoice may settle the subscription''s whole balance under a payment arrangement, the authorized contact paying the first instalment at once by card, applied to the past-due cycle invoice; the card payment limit of the invoice still applies, and an arrangement carries no fee. The first instalment of a payment arrangement is not set until the late charge owed for the current month on the subscription''s past-due cycle invoice stands on the billing ledger. The arrangement balance is the balance owed on the subscription when the arrangement is made. Under the standard arrangement the arrangement balance is settled in three equal monthly instalments with nothing due up front, so the first instalment is one third of the arrangement balance, rounded half up to the cent. The adjustments below change the standard arrangement in this order: amounts due up front are set aside from the arrangement balance first, together with any amount left out of the arrangement; what remains is divided into equal shares by the number of instalments; the first instalment is the amounts due up front plus the shares it carries, rounded half up to the cent once, at the end. The number of instalments follows the client''s ClearPath standing: with an active ClearPath agreement that has renewed at least twice and owes nothing (a balance of zero or a credit), the arrangement runs over six instalments; with an active ClearPath agreement that has renewed fewer than twice or owes a balance, over four; without an active ClearPath agreement, over three. A down payment on the first instalment is taken on larger past-due invoices, the arrangement''s invoice being the one carrying the subscription''s latest cycle charge by posting date (a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date): when the cycle charges on that invoice total 5,000.00 USD or more, 25 percent of the arrangement balance is due up front; when they total 2,500.00 USD or more but less than 5,000.00 USD, 10 percent of the arrangement balance; when they total less than 2,500.00 USD, no down payment is taken. A late charge posted on the subscription less than one whole month before the arrangement is handled by the client''s ClearPath service level: when the client''s active ClearPath tier has a dedicated account manager, that late charge is left out of the arrangement and stays on the invoice outside it, and a balance no greater than that late charge leaves nothing to arrange, so no arrangement is made; when no active ClearPath tier with a dedicated account manager is held, that late charge is due up front in full with the first instalment; when no late charge was posted in that month, nothing is set aside for it. A client with an earlier late-charge record carries a front-loaded first instalment: when two or more late charges were posted on the subscription less than twenty-four whole months before the arrangement, not counting those posted less than one whole month before the arrangement, the first instalment carries one and a half of the equal shares; when exactly one was, one and a quarter shares; otherwise one share.'
  prerequisite:
  - problem: licensing_ext_late_charge
    kind: value_input
    gate: month_late
    form: state
    policy_source: The first instalment of a payment arrangement is not set until the late charge owed for the current month on the subscription's past-due cycle invoice stands on the billing ledger.
    condition: the subscription's billing ledger carries a licensing_late_fee row for the current month on the latest cycle invoice whenever that invoice is past due beyond the grace period on the first of the month
    resolved_by: assess_late_charge_e02563fc
    effect: the month's late charge raises the arrangement balance and is the late charge set aside up front or left out, so the first instalment changes
  cross_category:
  - category: managed
    as: branch
    reads:
    - status
    - renewal_count
    - balance_due_usd
    - dedicated_account_manager
    note: The ClearPath agreement's renewal count and balance set the instalment count and its tier's dedicated account manager sets how the month's late charge is handled.
  compute:
  - bal: F('balance_due_usd')
  - inv: LATEST('licensing_billing', 'invoice_number', date_field='posted_date', event_type='licensing_cycle_charge')
  - cp_renewals: CFIELD('managed', 'renewal_count', status='active')
  - cp_owed: CFIELD('managed', 'balance_due_usd', status='active')
  - n_instal: K('n_long') if (cp_renewals != None and cp_renewals >= 2 and cp_owed <= 0) else (K('n_active') if (cp_renewals != None and (cp_renewals < 2 or cp_owed > 0)) else K('n_standard'))
  - inv_cycle_total: SUM('licensing_billing', 'amount_usd', event_type='licensing_cycle_charge', invoice_number=inv)
  - down_pct: K('down_large_pct') if inv_cycle_total >= K('down_large') else (K('down_mid_pct') if inv_cycle_total >= K('down_mid') else 0)
  - month_late: SUM('licensing_billing', 'amount_usd', within_months=1, date_field='posted_date', event_type='licensing_late_fee')
  - cp_manager: CPARAM('managed', 'dedicated_account_manager', status='active')
  - late_carved: month_late if (month_late > 0 and cp_manager == True) else 0
  - late_upfront: month_late if (month_late > 0 and cp_manager != True) else 0
  - late_24m: COUNT('licensing_billing', within_months=24, date_field='posted_date', event_type='licensing_late_fee') - COUNT('licensing_billing', within_months=1, date_field='posted_date', event_type='licensing_late_fee')
  - share_weight: K('front_high') if late_24m >= 2 else (K('front_mid') if late_24m == 1 else 1)
  - down_amt: bal * down_pct / 100
  - result: RND(down_amt + late_upfront + (bal - down_amt - late_upfront - late_carved) * share_weight / n_instal, 2)
  compute_basis:
    bal: The arrangement balance is the balance owed on the subscription when the arrangement is made.
    inv: 'A down payment on the first instalment is taken on larger past-due invoices, the arrangement''s invoice being the one carrying the subscription''s latest cycle charge by posting date (a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date): when the cycle charges on that invoice total 5,000.00 USD or more, 25 percent of the arrangement balance is due up front; when they total 2,500.00 USD or more but less than 5,000.00 USD, 10 percent of the arrangement balance; when they total less than 2,500.00 USD, no down payment is taken.'
    cp_renewals: 'The number of instalments follows the client''s ClearPath standing: with an active ClearPath agreement that has renewed at least twice and owes nothing (a balance of zero or a credit), the arrangement runs over six instalments; with an active ClearPath agreement that has renewed fewer than twice or owes a balance, over four; without an active ClearPath agreement, over three.'
    cp_owed: 'The number of instalments follows the client''s ClearPath standing: with an active ClearPath agreement that has renewed at least twice and owes nothing (a balance of zero or a credit), the arrangement runs over six instalments; with an active ClearPath agreement that has renewed fewer than twice or owes a balance, over four; without an active ClearPath agreement, over three.'
    n_instal: 'The number of instalments follows the client''s ClearPath standing: with an active ClearPath agreement that has renewed at least twice and owes nothing (a balance of zero or a credit), the arrangement runs over six instalments; with an active ClearPath agreement that has renewed fewer than twice or owes a balance, over four; without an active ClearPath agreement, over three.'
    inv_cycle_total: 'A down payment on the first instalment is taken on larger past-due invoices, the arrangement''s invoice being the one carrying the subscription''s latest cycle charge by posting date (a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date): when the cycle charges on that invoice total 5,000.00 USD or more, 25 percent of the arrangement balance is due up front; when they total 2,500.00 USD or more but less than 5,000.00 USD, 10 percent of the arrangement balance; when they total less than 2,500.00 USD, no down payment is taken.'
    down_pct: 'A down payment on the first instalment is taken on larger past-due invoices, the arrangement''s invoice being the one carrying the subscription''s latest cycle charge by posting date (a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date): when the cycle charges on that invoice total 5,000.00 USD or more, 25 percent of the arrangement balance is due up front; when they total 2,500.00 USD or more but less than 5,000.00 USD, 10 percent of the arrangement balance; when they total less than 2,500.00 USD, no down payment is taken.'
    month_late: 'A late charge posted on the subscription less than one whole month before the arrangement is handled by the client''s ClearPath service level: when the client''s active ClearPath tier has a dedicated account manager, that late charge is left out of the arrangement and stays on the invoice outside it, and a balance no greater than that late charge leaves nothing to arrange, so no arrangement is made; when no active ClearPath tier with a dedicated account manager is held, that late charge is due up front in full with the first instalment; when no late charge was posted in that month, nothing is set aside for it.'
    cp_manager: 'A late charge posted on the subscription less than one whole month before the arrangement is handled by the client''s ClearPath service level: when the client''s active ClearPath tier has a dedicated account manager, that late charge is left out of the arrangement and stays on the invoice outside it, and a balance no greater than that late charge leaves nothing to arrange, so no arrangement is made; when no active ClearPath tier with a dedicated account manager is held, that late charge is due up front in full with the first instalment; when no late charge was posted in that month, nothing is set aside for it.'
    late_carved: 'A late charge posted on the subscription less than one whole month before the arrangement is handled by the client''s ClearPath service level: when the client''s active ClearPath tier has a dedicated account manager, that late charge is left out of the arrangement and stays on the invoice outside it, and a balance no greater than that late charge leaves nothing to arrange, so no arrangement is made; when no active ClearPath tier with a dedicated account manager is held, that late charge is due up front in full with the first instalment; when no late charge was posted in that month, nothing is set aside for it.'
    late_upfront: 'A late charge posted on the subscription less than one whole month before the arrangement is handled by the client''s ClearPath service level: when the client''s active ClearPath tier has a dedicated account manager, that late charge is left out of the arrangement and stays on the invoice outside it, and a balance no greater than that late charge leaves nothing to arrange, so no arrangement is made; when no active ClearPath tier with a dedicated account manager is held, that late charge is due up front in full with the first instalment; when no late charge was posted in that month, nothing is set aside for it.'
    late_24m: 'A client with an earlier late-charge record carries a front-loaded first instalment: when two or more late charges were posted on the subscription less than twenty-four whole months before the arrangement, not counting those posted less than one whole month before the arrangement, the first instalment carries one and a half of the equal shares; when exactly one was, one and a quarter shares; otherwise one share.'
    share_weight: 'A client with an earlier late-charge record carries a front-loaded first instalment: when two or more late charges were posted on the subscription less than twenty-four whole months before the arrangement, not counting those posted less than one whole month before the arrangement, the first instalment carries one and a half of the equal shares; when exactly one was, one and a quarter shares; otherwise one share.'
    down_amt: 'A down payment on the first instalment is taken on larger past-due invoices, the arrangement''s invoice being the one carrying the subscription''s latest cycle charge by posting date (a subscription carries one cycle charge per cycle start, so no two cycle charges share a posting date): when the cycle charges on that invoice total 5,000.00 USD or more, 25 percent of the arrangement balance is due up front; when they total 2,500.00 USD or more but less than 5,000.00 USD, 10 percent of the arrangement balance; when they total less than 2,500.00 USD, no down payment is taken.'
    result: 'The adjustments below change the standard arrangement in this order: amounts due up front are set aside from the arrangement balance first, together with any amount left out of the arrangement; what remains is divided into equal shares by the number of instalments; the first instalment is the amounts due up front plus the shares it carries, rounded half up to the cent once, at the end.'
  factors:
  - id: instalment_count
    effect: parameter
    decides: n_instal
    bindings:
    - cp_renewals
    - cp_owed
    - n_instal
    ladder:
    - when: an active ClearPath agreement that has renewed at least twice and owes nothing (a balance of zero or a credit)
      value: 6 instalments (K('n_long'))
    - when: an active ClearPath agreement that has renewed fewer than twice or owes a balance
      value: 4 instalments (K('n_active'))
    - when: otherwise (no active ClearPath agreement)
      value: 3 instalments (K('n_standard'))
    baseline:
      n_instal: K('n_standard')
    evidence:
    - cross_category
    cross_difficulty: managed
  - id: down_payment_share
    effect: parameter
    decides: down_pct
    bindings:
    - inv
    - inv_cycle_total
    - down_pct
    - down_amt
    ladder:
    - when: the cycle charges on the arrangement's invoice total 5,000.00 USD or more
      value: 25 percent of the arrangement balance (K('down_large_pct'))
    - when: they total 2,500.00 USD or more but less than 5,000.00 USD
      value: 10 percent of the arrangement balance (K('down_mid_pct'))
    - when: otherwise
      value: no down payment (0)
    baseline:
      down_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: month_late_treatment
    effect: method
    decides: late_upfront
    bindings:
    - month_late
    - cp_manager
    - late_carved
    - late_upfront
    ladder:
    - when: a late charge posted less than one whole month before AND an active ClearPath tier with a dedicated account manager
      method: 'the month''s late charge is left out of the arrangement: neither spread nor collected now'
    - when: a late charge posted less than one whole month before AND no active ClearPath tier with a dedicated account manager
      method: the month's late charge is due up front in full with the first instalment and is not spread
    - when: otherwise (no late charge in that month)
      method: nothing is set aside; the whole arrangement balance is spread (standard arrangement)
    baseline:
      late_upfront: '0'
      late_carved: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: managed
  - id: front_loading
    effect: parameter
    decides: share_weight
    bindings:
    - late_24m
    - share_weight
    ladder:
    - when: two or more earlier late charges in the twenty-four whole months before the arrangement, not counting those posted less than one whole month before it
      value: 1.5 shares (K('front_high'))
    - when: exactly one such earlier late charge
      value: 1.25 shares (K('front_mid'))
    - when: otherwise
      value: 1 share
    baseline:
      share_weight: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
