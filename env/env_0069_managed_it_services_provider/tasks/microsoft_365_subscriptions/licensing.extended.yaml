      field: amount_usd
      within_months: 1
      filters:
        event_type: licensing_late_fee
    - table: licensing_billing
      aggregate: count
      field: licensing_billing_entry_id
      within_months: 24
      filters:
        event_type: licensing_late_fee
    cross_category:
    - managed
- id: licensing_ext_admin_fee
  base_policy_refs:
  - licensing_admin_fee_rules
  overwrite:
  - base_policy: licensing_admin_fee_rules
    superseded_clause: 'On the first day of each calendar month the license administration fee for the previous month is invoiced on every subscription whose status was active or suspended at the end of that month: admin_fee_usd times license_qty at the end of that month, rounded half up to the cent.'
    replaced_by: On the first day of each calendar month the license administration fee for the previous month is invoiced on every subscription whose status was active or suspended at the end of that month, worked out under this schedule from the licenses the subscription carries when the fee posts.
  - base_policy: licensing_admin_fee_rules
    superseded_clause: Where admin_fee_waived_with_clearpath_admin is true, no fee is posted for a month in which the client held a ClearPath agreement whose status was active or notice_given on the last day of the month and whose tier has m365_administration_included true; a ClearPath Monitor agreement does not waive the fee.
    replaced_by: 'Where admin_fee_waived_with_clearpath_admin is true, the share of the administration fee charged follows the client''s ClearPath coverage as it stands on the day the fee posts, which Stratton Bay takes for the month just ended: where the client holds a ClearPath agreement whose status is active or notice_given and whose tier has m365_administration_included true, no fee is posted; where the client holds an active ClearPath Monitor agreement, whose tier does not include Microsoft 365 administration, half the fee is charged; any other client, and every client where admin_fee_waived_with_clearpath_admin is false, is charged the whole fee.'
