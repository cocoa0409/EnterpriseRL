    bundle_full_pct: 90.0
    bundle_part_pct: 95.0
  rule: 'On the first day of each calendar month the license administration fee for the previous month is invoiced on every subscription whose status was active or suspended at the end of that month, worked out under this schedule from the licenses the subscription carries when the fee posts. The licenses the administration fee counts are the licenses the subscription carries when the fee posts, that is the licenses its quantity changes have added less those they have removed. Under the standard method the administration fee is admin_fee_usd times the licenses the fee counts, charged as a full month, rounded half up to the cent. The adjustments below change the standard administration fee in this order: percentages that act on the per-license rate come first, amounts per license are then added to that rate, the resulting rate is applied to the licenses counted, and shares of the fee or of the month act last; the result is rounded half up to the cent once, at the end. Where admin_fee_waived_with_clearpath_admin is true, the share of the administration fee charged follows the client''s ClearPath coverage as it stands on the day the fee posts, which Stratton Bay takes for the month just ended: where the client holds a ClearPath agreement whose status is active or notice_given and whose tier has m365_administration_included true, no fee is posted; where the client holds an active ClearPath Monitor agreement, whose tier does not include Microsoft 365 administration, half the fee is charged; any other client, and every client where admin_fee_waived_with_clearpath_admin is false, is charged the whole fee. The per-license administration rate is adjusted for the commitment: a term of 1,000 days or more from term_start_date through term_end_date inclusive (a P3Y term) takes 90 percent of the rate; a term of 31 days or fewer (a P1M term), administered month to month, takes 110 percent; any other term takes the whole rate. Larger subscriptions take a volume administration rate: with 100 or more licenses counted the rate is 80 percent; with 25 to 99 licenses, 90 percent; with fewer than 25, the whole rate. Plans on which Stratton Bay maintains its conditional access and device compliance baseline carry a baseline upkeep amount per license on the administration fee: 0.25 USD where the plan''s security_baseline_policies is true and the client holds an active Sentinel subscription on a tier whose identity_threat_detection is true; 0.50 USD where the plan''s security_baseline_policies is true and no such Sentinel subscription is held; nothing on a plan whose security_baseline_policies is false. The part of the month the administration fee charges follows how the subscription was held: a subscription purchased fewer than 30 calendar days before the posting day is charged for the days from its purchase date up to the posting day, that day excluded, over a 30-day month; a subscription held 30 days or more that is suspended when the fee posts is charged only for the part of the 30-day month before its suspension, 30 less the calendar days from its suspended_date up to the posting day, over 30, and one suspended 30 or more days before the posting day has no part of the month left to charge, so no fee is posted; any other subscription is charged the full month. Clients whose Continuum plan already protects their Microsoft 365 users take a bundle administration rate: with an active Continuum plan protecting at least as many Microsoft 365 users as the licenses counted, the rate is 90 percent; with an active Continuum plan protecting at least one Microsoft 365 user but fewer than the licenses counted, 95 percent; otherwise the whole rate. Microsoft 365 users protected are the active Continuum plan''s own protections of Microsoft 365 users less its own removals; protections recorded under any other Continuum plan of the client, open or closed, are not counted.'
  prerequisite: []
  cross_category:
  - category: managed
    as: branch
    reads:
    - status
    - variant_name
    - m365_administration_included
    note: The ClearPath agreement's status and tier decide the share of the fee charged.
  - category: security
    as: branch
    reads:
    - status
    - identity_threat_detection
    note: An active Sentinel subscription with identity threat detection lowers the baseline upkeep.
  - category: backup
