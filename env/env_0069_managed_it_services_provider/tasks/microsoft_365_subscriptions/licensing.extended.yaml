    cx_add_charge: 'How the license refund is worked out follows how promptly the subscription is given up: when the cancellation date is no more than three calendar days after the date the cancellation window opened, the licenses are refunded as never used, the cycle amount per license times the licenses refunded with no day count; when the cancellation comes more than three days after the window opened but no more than three calendar days after the latest seat addition, and that seat addition carries a partial-cycle charge, the licenses it added are refunded as never used, their partial-cycle charge returned in full, and the other licenses held are refunded under the standard method; any other cancellation is refunded under the standard method.'
    cx_add_qty: 'How the license refund is worked out follows how promptly the subscription is given up: when the cancellation date is no more than three calendar days after the date the cancellation window opened, the licenses are refunded as never used, the cycle amount per license times the licenses refunded with no day count; when the cancellation comes more than three days after the window opened but no more than three calendar days after the latest seat addition, and that seat addition carries a partial-cycle charge, the licenses it added are refunded as never used, their partial-cycle charge returned in full, and the other licenses held are refunded under the standard method; any other cancellation is refunded under the standard method.'
    cx_add_at: 'How the license refund is worked out follows how promptly the subscription is given up: when the cancellation date is no more than three calendar days after the date the cancellation window opened, the licenses are refunded as never used, the cycle amount per license times the licenses refunded with no day count; when the cancellation comes more than three days after the window opened but no more than three calendar days after the latest seat addition, and that seat addition carries a partial-cycle charge, the licenses it added are refunded as never used, their partial-cycle charge returned in full, and the other licenses held are refunded under the standard method; any other cancellation is refunded under the standard method.'
    cx_add_id: 'How the license refund is worked out follows how promptly the subscription is given up: when the cancellation date is no more than three calendar days after the date the cancellation window opened, the licenses are refunded as never used, the cycle amount per license times the licenses refunded with no day count; when the cancellation comes more than three days after the window opened but no more than three calendar days after the latest seat addition, and that seat addition carries a partial-cycle charge, the licenses it added are refunded as never used, their partial-cycle charge returned in full, and the other licenses held are refunded under the standard method; any other cancellation is refunded under the standard method.'
    cx_cont_plan: 'Stratton Bay deducts a backup deprovisioning charge from the cancellation refund for each Microsoft 365 user taken off the client''s active Continuum plan, the users taken off being counted as the lesser of the licenses cancelled and that plan''s own protected Microsoft 365 users (its protections of Microsoft 365 users less its own removals): 0.50 USD per user under an active Continuum Backup Plus, Continuum BDR, Continuum DRaaS or Continuum DRaaS Premier plan, 1.00 USD per user under an active Continuum Backup Basic or Continuum Backup Standard plan, and nothing without an active Continuum plan or where that plan protects no Microsoft 365 user.'
    cx_m365: 'Stratton Bay deducts a backup deprovisioning charge from the cancellation refund for each Microsoft 365 user taken off the client''s active Continuum plan, the users taken off being counted as the lesser of the licenses cancelled and that plan''s own protected Microsoft 365 users (its protections of Microsoft 365 users less its own removals): 0.50 USD per user under an active Continuum Backup Plus, Continuum BDR, Continuum DRaaS or Continuum DRaaS Premier plan, 1.00 USD per user under an active Continuum Backup Basic or Continuum Backup Standard plan, and nothing without an active Continuum plan or where that plan protects no Microsoft 365 user.'
    deprov_users: 'Stratton Bay deducts a backup deprovisioning charge from the cancellation refund for each Microsoft 365 user taken off the client''s active Continuum plan, the users taken off being counted as the lesser of the licenses cancelled and that plan''s own protected Microsoft 365 users (its protections of Microsoft 365 users less its own removals): 0.50 USD per user under an active Continuum Backup Plus, Continuum BDR, Continuum DRaaS or Continuum DRaaS Premier plan, 1.00 USD per user under an active Continuum Backup Basic or Continuum Backup Standard plan, and nothing without an active Continuum plan or where that plan protects no Microsoft 365 user.'
    charge_cap: Charges deducted from a cancellation refund never take, together, more than half of the refund they are deducted from (the license refund with any amounts returned), so a cancellation always carries a refund above 0.00.
  factors:
  - id: prompt_cancel_anchor
    effect: method
    decides: refund_base
    bindings:
    - cancel_lag
    - cx_add_id
    - cx_add_at
    - cx_add_qty
    - cx_add_charge
    - refund_base
    ladder:
    - when: the cancellation date is no more than three calendar days after the date the window opened
      method: 'refunded as never used: the cycle amount per license times the licenses refunded, no day count'
    - when: cancelled more than three days after the window opened AND no more than three calendar days after the latest seat addition, which carries a partial-cycle charge
      method: that seat addition's licenses refunded as never used (its partial-cycle charge in full) plus the other licenses under the standard day count
    - when: otherwise
      method: the days from the cancellation date through the last day of the cycle inclusive over the days in the cycle (standard method)
    baseline:
      refund_base: std_refund
    evidence:
    - date
    cross_difficulty: null
  - id: admin_fee_return
    effect: method
    decides: admin_return
    bindings:
    - admin_billed
    - cp_status
    - held_for
    - admin_return
    ladder:
    - when: an active ClearPath agreement AND the subscription was purchased fewer than seven calendar days before the cancellation date
      method: the administration fee billed is returned in full
    - when: an active ClearPath agreement AND the subscription was held seven days or more
      method: the administration fee billed is returned pro rata to the days from the cancellation date through the end of the cycle
    - when: otherwise
      method: the administration fee is left as billed (standard method)
    baseline:
      admin_return: '0'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: managed
  - id: order_reversal_fee
    effect: parameter
    decides: reversal_fee
    bindings:
    - rev_qty
    - reversal_fee
    ladder:
    - when: 25 or more licenses cancelled
      value: 50.00 USD (K('rev_large'))
    - when: 10 to 24 licenses cancelled
      value: 25.00 USD (K('rev_mid'))
    - when: otherwise (fewer than 10)
      value: nothing (0)
    baseline:
      reversal_fee: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: backup_deprovisioning
    effect: parameter
    decides: deprov_rate
    bindings:
    - cont_tier
    - cx_cont_plan
    - cx_m365
    - deprov_rate
    - deprov_users
    ladder:
    - when: an active Continuum Backup Plus, Continuum BDR, Continuum DRaaS or Continuum DRaaS Premier plan AND it protects at least one Microsoft 365 user
      value: 0.50 USD per user taken off (K('deprov_low'))
    - when: an active Continuum Backup Basic or Continuum Backup Standard plan AND it protects at least one Microsoft 365 user
      value: 1.00 USD per user taken off (K('deprov_high'))
    - when: otherwise (no active Continuum plan, or it protects no Microsoft 365 user)
      value: nothing (0)
    baseline:
      deprov_rate: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: backup
  - id: seat_change_reversals
    effect: parameter
    decides: change_rate
    bindings:
    - seat_changes
    - change_rate
    ladder:
    - when: one or two seat additions recorded on the subscription
      value: 5.00 USD for each (K('change_low'))
    - when: three or more seat additions recorded
      value: 4.00 USD for each (K('change_bulk'))
    - when: otherwise (none)
      value: nothing (0)
    baseline:
      change_rate: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: For the cancellation refund, the cycle is the current term, from term_start_date through term_end_date, its days are counted from the first day through the last day inclusive, the refund's cycle amount per license is unit_price_usd for a P1M term and twelve times unit_price_usd for a P1Y term billed annually, and the licenses refunded are the licenses the subscription holds when it is cancelled. The charges billed for the cycle are the cycle charge and the partial-cycle charges whose cycle starts on term_start_date. Under the standard method the cancellation refund is the license refund, the refund's cycle amount per license times the licenses refunded times the calendar days from the cancellation date through the last day of the cycle inclusive divided by the days in the cycle, never more than the charges billed for the cycle, rounded half up to the cent; Stratton Bay's administration fee is left as billed. Charges deducted from a cancellation refund never take, together, more than half of the refund they are deducted from (the license refund with any amounts returned), so a cancellation always carries a refund above 0.00. Stratton Bay makes no license-work charge against the cancellation refund of a client holding a ClearPath agreement whose status is active or notice_given and whose tier has m365_administration_included true, that work being covered.
    params:
    - charge_cap_share
  inputs:
    history:
    - table: licensing_billing
      aggregate: sum
      field: amount_usd
      filters:
        event_type: licensing_cycle_charge
    - table: licensing_billing
      aggregate: sum
      field: amount_usd
      filters:
        event_type: licensing_admin_fee
    - table: licensing_license_changes
      aggregate: count
      field: licensing_license_change_id
      filters:
        change_reason: seat_addition
    - category: backup
      table: backup_device_changes
      aggregate: count
      field: backup_device_change_id
      filters:
        device_class: m365_user
    cross_category:
    - managed
    - backup
