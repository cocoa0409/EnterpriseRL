      and only for such a group, the group is drawn for the summed logged minutes of its lines, which the statement of work
      already logs in billing_increment_minutes steps for every block size that may draw project work, adjusted only by
      the project minutes schedule below; the project time of a client holding no such engagement or two or more of them
      keeps, wholly and line by line, the standard minutes rule, its recorded minutes rounded up to billing_increment_minutes,
      and a remote session, a service visit, an installation visit and a travel entry keep their own minutes rules.
    pj_band_extra: >-
      Project band schedule: a group dated on a Saturday or Sunday has its summed minutes, raised to at least weekend_minimum_minutes,
      multiplied by holiday_multiplier; a weekday group with minutes logged in the after_hours band has those after-hours
      minutes, rounded up to the next multiple of 60, multiplied by after_hours_multiplier, its other minutes keeping a
      multiplier of 1; a weekday group logged only in business hours keeps a multiplier of 1.
    pj_dn_a: >-
      A group counts as drawn when the block's ledger carries a project-work draw recording its statement of work, date
      and level; when the client has no block-routed project time, or every group of that date is drawn, no project group
      is figured.
    pj_dn_s: >-
      A group counts as drawn when the block's ledger carries a project-work draw recording its statement of work, date
      and level; when the client has no block-routed project time, or every group of that date is drawn, no project group
      is figured.
    pj_dn_t: >-
      A group counts as drawn when the block's ledger carries a project-work draw recording its statement of work, date
      and level; when the client has no block-routed project time, or every group of that date is drawn, no project group
      is figured.
  factors:
  - id: project_minutes_basis
    effect: method
    decides: pj_minutes_basis
    bindings:
    - pj_mw_weekday
    - pj_mw_aft
    - pj_minutes_basis
    ladder:
    - when: the group is dated on a Saturday or Sunday
      method: >-
        a weekend cutover: the summed minutes raised to at least weekend_minimum_minutes (adds a max() floor)
    - when: a weekday group with minutes logged in the after_hours band
      method: >-
        a maintenance window: the after-hours minutes rounded up to the next multiple of 60 and added to the business-hours
        minutes (adds a ceiling on one part)
    - when: otherwise
      method: the summed minutes as logged
    baseline:
      pj_minutes_basis: pj_total
    evidence:
    - cross_category
    - date
    cross_difficulty: project
  - id: project_band_rate
    effect: parameter
    decides: pj_band_extra
    bindings:
    - pj_weekday
    - pj_band_aft
    - pj_band
    - pj_window
    - pj_band_extra
    ladder:
    - when: the group is dated on a Saturday or Sunday
      value: P('holiday_multiplier')
    - when: a weekday group with minutes logged in the after_hours band
      value: P('after_hours_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      pj_band_extra: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: project
  - id: project_level_ratio
    effect: parameter
    decides: pj_ratio
    bindings:
    - pj_ratio
    ladder:
    - when: the group is of architect lines
      value: P('architect_ratio')
    - when: the group is of senior engineer lines
      value: P('senior_engineer_ratio')
    - when: otherwise
      value: P('technician_ratio')
    baseline:
      pj_ratio: P('technician_ratio')
    evidence:
    - cross_category
    cross_difficulty: project
  - id: project_discount_band
    effect: parameter
    decides: pj_discount_rate
    bindings:
    - pj_discount
    - pj_discount_rate
    ladder:
    - when: the statement of work's locked rate discount is at least discount_band_high percent
      value: K('discount_rate_high')
    - when: the locked rate discount is above zero and below discount_band_high percent
      value: K('discount_rate_low')
    - when: otherwise
      value: '1'
    baseline:
      pj_discount_rate: '1'
    evidence:
    - cross_category
    cross_difficulty: project
  - id: project_class_rate
    effect: parameter
    decides: pj_class_rate
    bindings:
    - pj_class
    - pj_class_rate
    ladder:
    - when: the line is on a Major Project or Strategic Program engagement
      value: K('class_rate_major')
    - when: the line is on a Standard Project or Advanced Project engagement
      value: K('class_rate_mid')
    - when: otherwise
      value: '1'
    baseline:
      pj_class_rate: '1'
    evidence:
    - cross_category
    cross_difficulty: project
  baseline:
    rule: >-
      A project group draws its summed logged minutes divided by 60, at technician_ratio and with a multiplier of 1, rounded
      half up to draw_rounding_hours.
    params:
    - technician_ratio
    - draw_rounding_hours
  inputs:
    history:
    - table: timebank_hours_ledger
      aggregate: count
      field: hours
      filters:
        event_type: timebank_hours_drawn
        work_type: project_work
    - category: project
      table: project_work_logs
      aggregate: sum
      field: worked_minutes
      filters:
        billing_route: timebank
    cross_category:
    - project
- id: timebank_ext_extension_quote
  base_policy_refs:
  - timebank_rollover_and_extension
  overwrite:
  - base_policy: timebank_rollover_and_extension
    superseded_clause: >-
      The extension fee is extension_fee_pct percent of hours_balance valued at hourly_rate_usd, rounded half up to the
      cent, invoiced when the extension takes effect; a block whose hours were rolled out cannot be extended.
    replaced_by: >-
      For an extension bought on the authorized contact's signed order form, which is how every extension is bought, the
      fee is figured under the extension schedules below, rounded half up to the cent, and is invoiced when the extension
      takes effect on that signature; a block whose hours were rolled out still cannot be extended.
  trigger: on_request
  subject:
  - timebank_block_extended
  - timebank_extension_fee
  computes: quoted_amount_usd
  target_tool: sign_block_extension_cebc1113
  params:
    early_days_long: 60
    early_days_short: 30
    early_pct_long: 5.0
    early_pct_short: 6.0
    late_fee_points: 2.0
    late_pay_points: 1.0
    loyalty_top: 0.5
    loyalty_mid: 0.75
    recent_high_share: 0.25
    recent_high_rate: 0.8
    recent_mid_share: 0.1
    recent_mid_rate: 0.9
    project_routed_rate: 0.9
    project_open_rate: 0.95
  rule: >-
    For an extension bought on the authorized contact's signed order form, which is how every extension is bought, the fee
    is figured under the extension schedules below, rounded half up to the cent, and is invoiced when the extension takes
    effect on that signature; a block whose hours were rolled out still cannot be extended. The extension fee is extension_fee_pct
    percent of the block's hours_balance valued at hourly_rate_usd, rounded half up to the cent. The figures the extension
    schedules below select replace the standard percentage and hourly value or adjust the fee in this order: replacements
    of the percentage and of the value of an hour first, then additions of points to the percentage, then the multipliers
    of the fee, which multiply one another with no order between them; rounding to the cent happens once, at the end. Extension
    signing schedule: an extension signed at least early_days_long calendar days before the block's expiry_date is charged
    early_pct_long percent; one signed at least early_days_short and fewer than early_days_long days before it, early_pct_short
    percent; one signed later, the standard extension_fee_pct percent. Days are counted from the signing date to the expiry_date,
    the signing date not counted. Extension standing schedule: when a late fee has been assessed on the block in the twelve
    months before signing, meaning fees dated after the same day twelve months earlier, late_fee_points points are added
    to the percentage; when no such late fee was assessed but the block invoice was paid in full more than invoice_due_days
    days after it was posted, or still stands unpaid or only partly paid more than invoice_due_days days after it was posted,
    late_pay_points points are added; otherwise none. Only payments applied to the block invoice's own invoice number count
    toward it, and a payment completing the invoice dates its full payment. Extension valuation schedule: a block carrying
    hours rolled in from an earlier block values each hour at its invoiced block price divided by its hours purchased plus
    the hours rolled in, rounded half up to the cent; a block without rolled-in hours whose invoiced price is below block_list_price_usd
    values each hour at its invoiced price divided by its hours purchased, rounded half up to the cent; any other block
    values each hour at hourly_rate_usd. Extension loyalty schedule: a client whose ClearPath agreement is active at ClearPath
    Premier or ClearPath Enterprise and has renewed at least once has the fee multiplied by loyalty_top; a client whose
    ClearPath agreement is active at ClearPath Professional or ClearPath Standard and has renewed at least once, by loyalty_mid;
    any other client, by 1. Extension recent-use schedule: when the hours drawn on the block in the three months counted
    back from signing, meaning draws dated after the same day three months earlier, reach at least recent_high_share of
    its hours purchased, the fee is multiplied by recent_high_rate; when they reach at least recent_mid_share and less than
    recent_high_share, by recent_mid_rate; otherwise by 1. Extension project schedule: a client holding at least one time-and-materials
    engagement in progress, whatever other engagements it also holds, and with project time logged to the prepaid-block
    route in the month counted back from signing, has the fee multiplied by project_routed_rate; a client holding at least
    one time-and-materials engagement in progress and with no such time in that month, by project_open_rate; any other client,
    by 1. The extension fee is fixed only after the block's hours ledger carries the remote-support draw of the client's
    ticket most recently resolved to the prepaid-block route with remote labor. The extension fee is not worked out until
    the block's hours ledger carries the onsite-support draw of the client's ticket most recently resolved to the prepaid-block
    route with onsite labor, where that visit is an installation visit. Before the extension fee is worked out for a client
    holding exactly one live time-and-materials engagement, one signed and not yet accepted, closed or cancelled, the block's
    hours ledger must carry the project-work draws of every group of the client's most recently dated project time logged
    to the prepaid-block route, a group being that date's lines of one level; for any other client the extension fee does
    not wait on project time.
  prerequisite:
  - problem: timebank_ext_remote_session_draw
    kind: value_input
    gate: ext_balance
    form: state
    policy_source: >-
      The extension fee is fixed only after the block's hours ledger carries the remote-support draw of the client's ticket
      most recently resolved to the prepaid-block route with remote labor.
    condition: >-
      The client's latest ClearPath resolution with labor_route timebank and a remote labor class has a remote_support draw
      with the same ticket_number on the block.
    resolved_by: post_remote_session_draw_4c084c45
    effect: The remote-session draw lowers the block's hours_balance, the hours the extension fee is charged on.
  - problem: timebank_ext_install_visit_draw
    kind: value_input
    gate: ext_balance
    form: state
    policy_source: >-
      The extension fee is not worked out until the block's hours ledger carries the onsite-support draw of the client's
      ticket most recently resolved to the prepaid-block route with onsite labor, where that visit is an installation visit.
    condition: >-
      The client's latest ClearPath onsite resolution with labor_route timebank, when it qualifies as an installation visit,
      has an onsite_support draw with the same ticket_number on the block.
    resolved_by: post_install_visit_draw_14ae60a8
    effect: >-
      The installation-visit draw lowers the block's hours_balance, the hours the extension fee is charged on.
  - problem: timebank_ext_project_time_draw
    kind: value_input
    gate: ext_balance
    form: state
    policy_source: >-
      Before the extension fee is worked out for a client holding exactly one live time-and-materials engagement, one signed
      and not yet accepted, closed or cancelled, the block's hours ledger must carry the project-work draws of every group
      of the client's most recently dated project time logged to the prepaid-block route, a group being that date's lines
      of one level; for any other client the extension fee does not wait on project time.
    condition: >-
      When the client holds exactly one live time-and-materials engagement, every resource_level group of the client's latest-dated
      block-routed project_work_logs date has a project_work draw on the block with that sow_number, entry_date and resource_level.
    resolved_by: post_project_time_draw_e9603a55
    effect: Each project-group draw lowers the block's hours_balance, the hours the extension fee is charged on.
  cross_category:
  - category: managed
    as: branch
    reads:
    - status
    - variant_name
    - renewal_count
    note: The loyalty schedule reads the active ClearPath agreement's tier and renewals.
  - category: project
    as: history
    reads:
    - status
    - pricing_model
    - project_work_logs.work_date
    - project_work_logs.billing_route
    note: The project schedule reads the in-progress engagement and its block-routed time in the last month.
  compute:
  - ext_balance: F('hours_balance')
  - ext_days_left: DAYS(NOW, F('expiry_date'))
  - ext_pct: >-
      K('early_pct_long') if ext_days_left >= K('early_days_long') else (K('early_pct_short') if ext_days_left >= K('early_days_short')
      else P('extension_fee_pct'))
  - ext_late_fee_n: >-
      COUNT('timebank_billing', within_months=12, date_field='posted_date', event_type='timebank_late_fee')
  - ext_invoice_no: >-
      LATEST('timebank_billing', 'invoice_number', date_field='posted_date', event_type='timebank_block_invoice')
  - ext_invoice_date: >-
      LATEST('timebank_billing', 'posted_date', date_field='posted_date', event_type='timebank_block_invoice')
  - ext_invoice_amount: SUM('timebank_billing', 'amount_usd', event_type='timebank_block_invoice')
  - ext_paid_sum: SUM('timebank_billing', 'amount_usd', event_type='timebank_payment', invoice_number=ext_invoice_no)
  - ext_payment_date: >-
      LATEST('timebank_billing', 'posted_date', date_field='posted_date', event_type='timebank_payment', invoice_number=ext_invoice_no)
  - ext_paid_late: >-
      ext_invoice_date != None and ((ext_paid_sum >= ext_invoice_amount and ext_payment_date != None and DAYS(ext_invoice_date,
      ext_payment_date) > P('invoice_due_days')) or (ext_paid_sum < ext_invoice_amount and DAYS(ext_invoice_date, NOW) >
      P('invoice_due_days')))
  - ext_points: K('late_fee_points') if ext_late_fee_n >= 1 else (K('late_pay_points') if ext_paid_late else 0)
  - ext_rolled_in: SUM('timebank_hours_ledger', 'hours', event_type='timebank_hours_rolled_in')
  - ext_invoiced: SUM('timebank_billing', 'amount_usd', event_type='timebank_block_invoice')
  - ext_hour_value: >-
      RND(ext_invoiced / (F('hours_purchased') + ext_rolled_in), 2) if ext_rolled_in > 0 else (RND(ext_invoiced / F('hours_purchased'),
      2) if (ext_invoiced > 0 and ext_invoiced < P('block_list_price_usd')) else P('hourly_rate_usd'))
  - cp_status: CFIELD('managed', 'status', status='active')
  - ext_cp_tier: CFIELD('managed', 'variant_name', status='active')
  - ext_cp_renewals: CFIELD('managed', 'renewal_count', status='active') or 0
  - ext_loyalty: >-
      K('loyalty_top') if (cp_status == 'active' and (ext_cp_tier == 'ClearPath Premier' or ext_cp_tier == 'ClearPath Enterprise')
      and ext_cp_renewals >= 1) else (K('loyalty_mid') if (cp_status == 'active' and (ext_cp_tier == 'ClearPath Professional'
      or ext_cp_tier == 'ClearPath Standard') and ext_cp_renewals >= 1) else 1)
  - ext_recent_hours: >-
      SUM('timebank_hours_ledger', 'hours', within_months=3, date_field='entry_date', event_type='timebank_hours_drawn')
  - ext_recent_rate: >-
      K('recent_high_rate') if ext_recent_hours >= K('recent_high_share') * F('hours_purchased') else (K('recent_mid_rate')
      if ext_recent_hours >= K('recent_mid_share') * F('hours_purchased') else 1)
  - ext_pj_tm_n: XCOUNT('project', 'project_engagements', status='in_progress', pricing_model='time_and_materials')
  - ext_pj_routed: >-
      XCOUNT('project', 'project_work_logs', within_months=1, date_field='work_date', billing_route='timebank')
  - ext_pj_rate: >-
      K('project_routed_rate') if (ext_pj_tm_n >= 1 and ext_pj_routed >= 1) else (K('project_open_rate') if ext_pj_tm_n
      >= 1 else 1)
  - result: >-
      RND(ext_balance * ext_hour_value * (ext_pct + ext_points) / 100 * ext_loyalty * ext_recent_rate * ext_pj_rate, 2)
  compute_basis:
    ext_balance: >-
      The extension fee is extension_fee_pct percent of the block's hours_balance valued at hourly_rate_usd, rounded half
      up to the cent.
    ext_days_left: Days are counted from the signing date to the expiry_date, the signing date not counted.
    ext_pct: >-
      Extension signing schedule: an extension signed at least early_days_long calendar days before the block's expiry_date
      is charged early_pct_long percent; one signed at least early_days_short and fewer than early_days_long days before
      it, early_pct_short percent; one signed later, the standard extension_fee_pct percent.
    ext_late_fee_n: >-
      Extension standing schedule: when a late fee has been assessed on the block in the twelve months before signing, meaning
      fees dated after the same day twelve months earlier, late_fee_points points are added to the percentage
    ext_invoice_no: >-
      Only payments applied to the block invoice's own invoice number count toward it, and a payment completing the invoice
      dates its full payment.
    ext_invoice_date: >-
      when no such late fee was assessed but the block invoice was paid in full more than invoice_due_days days after it
      was posted, or still stands unpaid or only partly paid more than invoice_due_days days after it was posted, late_pay_points
      points are added; otherwise none.
    ext_invoice_amount: >-
      when no such late fee was assessed but the block invoice was paid in full more than invoice_due_days days after it
      was posted, or still stands unpaid or only partly paid more than invoice_due_days days after it was posted, late_pay_points
      points are added; otherwise none.
    ext_paid_sum: >-
      Only payments applied to the block invoice's own invoice number count toward it, and a payment completing the invoice
      dates its full payment.
    ext_payment_date: >-
      Only payments applied to the block invoice's own invoice number count toward it, and a payment completing the invoice
      dates its full payment.
    ext_paid_late: >-
      when no such late fee was assessed but the block invoice was paid in full more than invoice_due_days days after it
      was posted, or still stands unpaid or only partly paid more than invoice_due_days days after it was posted, late_pay_points
      points are added; otherwise none.
    ext_points: >-
      Extension standing schedule: when a late fee has been assessed on the block in the twelve months before signing, meaning
      fees dated after the same day twelve months earlier, late_fee_points points are added to the percentage; when no such
      late fee was assessed but the block invoice was paid in full more than invoice_due_days days after it was posted,
      or still stands unpaid or only partly paid more than invoice_due_days days after it was posted, late_pay_points points
      are added; otherwise none. Only payments applied to the block invoice's own invoice number count toward it, and a
      payment completing the invoice dates its full payment.
    ext_rolled_in: >-
      Extension valuation schedule: a block carrying hours rolled in from an earlier block values each hour at its invoiced
      block price divided by its hours purchased plus the hours rolled in, rounded half up to the cent
    ext_invoiced: >-
      a block without rolled-in hours whose invoiced price is below block_list_price_usd values each hour at its invoiced
      price divided by its hours purchased, rounded half up to the cent
    ext_hour_value: >-
      Extension valuation schedule: a block carrying hours rolled in from an earlier block values each hour at its invoiced
      block price divided by its hours purchased plus the hours rolled in, rounded half up to the cent; a block without
      rolled-in hours whose invoiced price is below block_list_price_usd values each hour at its invoiced price divided
      by its hours purchased, rounded half up to the cent; any other block values each hour at hourly_rate_usd.
    cp_status: any other client, by 1.
    ext_cp_tier: >-
      Extension loyalty schedule: a client whose ClearPath agreement is active at ClearPath Premier or ClearPath Enterprise
      and has renewed at least once has the fee multiplied by loyalty_top
    ext_cp_renewals: >-
      Extension loyalty schedule: a client whose ClearPath agreement is active at ClearPath Premier or ClearPath Enterprise
      and has renewed at least once has the fee multiplied by loyalty_top
    ext_loyalty: >-
      Extension loyalty schedule: a client whose ClearPath agreement is active at ClearPath Premier or ClearPath Enterprise
      and has renewed at least once has the fee multiplied by loyalty_top; a client whose ClearPath agreement is active
      at ClearPath Professional or ClearPath Standard and has renewed at least once, by loyalty_mid; any other client, by
      1.
    ext_recent_hours: >-
      Extension recent-use schedule: when the hours drawn on the block in the three months counted back from signing, meaning
      draws dated after the same day three months earlier, reach at least recent_high_share of its hours purchased, the
      fee is multiplied by recent_high_rate
    ext_recent_rate: >-
      Extension recent-use schedule: when the hours drawn on the block in the three months counted back from signing, meaning
      draws dated after the same day three months earlier, reach at least recent_high_share of its hours purchased, the
      fee is multiplied by recent_high_rate; when they reach at least recent_mid_share and less than recent_high_share,
      by recent_mid_rate; otherwise by 1.
    ext_pj_routed: >-
      Extension project schedule: a client holding at least one time-and-materials engagement in progress, whatever other
      engagements it also holds, and with project time logged to the prepaid-block route in the month counted back from
      signing, has the fee multiplied by project_routed_rate; a client holding at least one time-and-materials engagement
      in progress and with no such time in that month, by project_open_rate; any other client, by 1.
    ext_pj_rate: >-
      Extension project schedule: a client holding at least one time-and-materials engagement in progress, whatever other
      engagements it also holds, and with project time logged to the prepaid-block route in the month counted back from
      signing, has the fee multiplied by project_routed_rate; a client holding at least one time-and-materials engagement
      in progress and with no such time in that month, by project_open_rate; any other client, by 1.
    result: >-
      The figures the extension schedules below select replace the standard percentage and hourly value or adjust the fee
      in this order: replacements of the percentage and of the value of an hour first, then additions of points to the percentage,
      then the multipliers of the fee, which multiply one another with no order between them; rounding to the cent happens
      once, at the end.
    ext_pj_tm_n: >-
      Extension project schedule: a client holding at least one time-and-materials engagement in progress, whatever other
      engagements it also holds, and with project time logged to the prepaid-block route in the month counted back from
      signing, has the fee multiplied by project_routed_rate; a client holding at least one time-and-materials engagement
      in progress and with no such time in that month, by project_open_rate; any other client, by 1.
  factors:
  - id: signing_lead_rate
    effect: parameter
    decides: ext_pct
    bindings:
    - ext_days_left
    - ext_pct
    ladder:
    - when: signed at least early_days_long calendar days before the block's expiry_date
      value: K('early_pct_long')
    - when: signed at least early_days_short and fewer than early_days_long days before it
      value: K('early_pct_short')
    - when: otherwise
      value: P('extension_fee_pct')
    baseline:
      ext_pct: P('extension_fee_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: payment_standing_points
    effect: parameter
    decides: ext_points
    bindings:
    - ext_late_fee_n
    - ext_invoice_no
    - ext_invoice_date
    - ext_invoice_amount
    - ext_paid_sum
    - ext_payment_date
    - ext_paid_late
    - ext_points
    ladder:
    - when: a late fee assessed on the block in the last twelve months
      value: K('late_fee_points')
    - when: >-
        no such late fee AND the block invoice paid in full, or still unpaid or partly paid, more than invoice_due_days
        days after posting
      value: K('late_pay_points')
    - when: otherwise
      value: '0'
    baseline:
      ext_points: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: hour_valuation_basis
    effect: method
    decides: ext_hour_value
    bindings:
    - ext_rolled_in
    - ext_invoiced
    - ext_hour_value
    ladder:
    - when: the block carries hours rolled in from an earlier block
      method: the invoiced block price spread over the hours purchased plus the hours rolled in
    - when: no rolled-in hours AND the invoiced price is below block_list_price_usd
      method: the invoiced block price spread over the hours purchased
    - when: otherwise
      method: the size's hourly_rate_usd
    baseline:
      ext_hour_value: P('hourly_rate_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: clearpath_loyalty_rate
    effect: parameter
    decides: ext_loyalty
    bindings:
    - cp_status
    - ext_cp_tier
    - ext_cp_renewals
    - ext_loyalty
    ladder:
    - when: >-
        the ClearPath agreement is active at ClearPath Premier or ClearPath Enterprise AND has renewed at least once
      value: K('loyalty_top')
    - when: >-
        the ClearPath agreement is active at ClearPath Professional or ClearPath Standard AND has renewed at least once
      value: K('loyalty_mid')
    - when: otherwise
      value: '1'
    baseline:
      ext_loyalty: '1'
    evidence:
    - cross_category
    cross_difficulty: managed
  - id: recent_use_rate
    effect: parameter
    decides: ext_recent_rate
    bindings:
    - ext_recent_hours
    - ext_recent_rate
    ladder:
    - when: hours drawn in the three months counted back reach at least recent_high_share of hours purchased
      value: K('recent_high_rate')
    - when: they reach at least recent_mid_share and less than recent_high_share
      value: K('recent_mid_rate')
    - when: otherwise
      value: '1'
    baseline:
      ext_recent_rate: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: engagement_commitment_rate
    effect: parameter
    decides: ext_pj_rate
    bindings:
    - ext_pj_tm_n
    - ext_pj_routed
    - ext_pj_rate
    ladder:
    - when: >-
        the client holds at least one time-and-materials engagement in progress AND time logged to the prepaid-block route
        in the month counted back
      value: K('project_routed_rate')
    - when: >-
        the client holds at least one time-and-materials engagement in progress AND no such time in that month
      value: K('project_open_rate')
    - when: otherwise
      value: '1'
    baseline:
      ext_pj_rate: '1'
    evidence:
    - cross_category
    cross_difficulty: project
  baseline:
    rule: >-
      The extension fee is extension_fee_pct percent of the block's hours_balance valued at hourly_rate_usd, rounded half
      up to the cent.
    params:
    - extension_fee_pct
    - hourly_rate_usd
  inputs:
    history:
    - table: timebank_hours_ledger
      aggregate: sum
      field: hours
      within_months: 3
      filters:
        event_type: timebank_hours_drawn
    - table: timebank_billing
      aggregate: count
      field: amount_usd
      within_months: 12
      filters:
        event_type: timebank_late_fee
    - category: project
      table: project_work_logs
      aggregate: count
      field: worked_minutes
      within_months: 1
      filters:
        billing_route: timebank
    cross_category:
    - managed
    - project
