      labor_class='onsite_after_hours')
  - in_class: >-
      'onsite_after_hours' if (in_after_at != None and (in_after_at or '') >= (in_business_at or '')) else 'onsite_business_hours'
  - in_at: in_after_at if in_class == 'onsite_after_hours' else in_business_at
  - in_top_minutes: >-
      XMAX('managed', 'managed_tickets', 'billable_minutes', event_type='managed_ticket_resolved', labor_route='timebank',
      labor_class=in_class, event_at=in_at)
  - in_ticket: >-
      XLATEST('managed', 'managed_tickets', 'ticket_number', date_field='ticket_number', event_type='managed_ticket_resolved',
