  overwrite:
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      Worked minutes are the recorded minutes rounded up to billing_increment_minutes and never less than minimum_draw_minutes_remote
      for a remote session or minimum_draw_minutes_onsite for an onsite visit.
    replaced_by: >-
      For every service visit drawn from a block, and only for a service visit, the minutes drawn are the visit's minutes
      as the service-visit rule below takes them from the ticket's resolution, rounded up to billing_increment_minutes,
      never fewer than minimum_draw_minutes_onsite, and raised further where the call-out schedule below sets a floor; an
      installation visit, a remote session, a project time line and a travel entry keep their own minutes rules.
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      Converted block hours equal worked minutes divided by 60, times the resource ratio (technician_ratio, senior_engineer_ratio
      or architect_ratio), times the band multiplier (holiday_multiplier, emergency_multiplier or after_hours_multiplier,
      and 1 in business hours), rounded half up to draw_rounding_hours.
    replaced_by: >-
      For every service visit drawn from a block, and only for a service visit, the block hours are figured under the service-visit
      schedules below; an installation visit, a remote session, a project time line and a travel entry are figured under
      their own schedules, and every other draw keeps the standard conversion: converted block hours equal worked minutes
      divided by 60, times the resource ratio (technician_ratio, senior_engineer_ratio or architect_ratio), times the band
      multiplier (holiday_multiplier, emergency_multiplier or after_hours_multiplier, and 1 in business hours), rounded
      half up to draw_rounding_hours.
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      The time band is holiday on weekends and observed holidays, emergency for work dispatched outside business hours at
      the client's request to restore a down system, after_hours for other work outside business_hours_start to business_hours_end
      on business days (business_hours_days, excluding the observed_holiday_list), and business_hours otherwise; only one
      band applies to a session, in that order of precedence.
    replaced_by: >-
      For every service visit drawn from a block, and only for a service visit, the band is read from the service desk's
      resolution of the visit's ticket: holiday when the resolution falls on a Saturday or Sunday, emergency for a weekday
      call-out under the call-out schedule below, after_hours for any other weekday visit the desk resolved in the onsite
      after-hours class, and business_hours otherwise, a weekday observed holiday taking the band the resolution's class
      gives; an installation visit, a remote session, a project time line and a travel entry take their bands from their
      own rules, and every other draw keeps the standard time band: holiday on weekends and observed holidays, emergency
      for work dispatched outside business hours at the client's request to restore a down system, after_hours for other
      work outside business_hours_start to business_hours_end on business days (business_hours_days, excluding the observed_holiday_list),
      and business_hours otherwise; only one band applies to a session, in that order of precedence.
