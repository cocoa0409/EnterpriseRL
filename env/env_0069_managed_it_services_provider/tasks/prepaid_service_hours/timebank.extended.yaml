  rule: >-
    For a group of time-and-materials project time drawn from a block that is the TimeBank route of exactly one time-and-materials
    statement of work, meaning the client holds exactly one time-and-materials engagement whose status is signed, in_progress,
    on_hold or pending_acceptance, a group being the block-routed lines of that statement of work for one date and level,
    and only for such a group, the group is drawn for the summed logged minutes of its lines, which the statement of work
    already logs in billing_increment_minutes steps for every block size that may draw project work, adjusted only by the
    project minutes schedule below; the project time of a client holding no such engagement or two or more of them keeps,
    wholly and line by line, the standard minutes rule, its recorded minutes rounded up to billing_increment_minutes, and
    a remote session, a service visit, an installation visit and a travel entry keep their own minutes rules. For such a
    group, and only for such a group, the block hours are figured under the project-time schedules below; a remote session,
    a service visit, an installation visit and a travel entry are figured under their own schedules, and every other draw,
    the project time of a client holding no such engagement or two or more of them included, keeps the standard conversion:
    converted block hours equal worked minutes divided by 60, times the resource ratio (technician_ratio, senior_engineer_ratio
    or architect_ratio), times the band multiplier (holiday_multiplier, emergency_multiplier or after_hours_multiplier,
    and 1 in business hours), rounded half up to draw_rounding_hours. For such a group, and only for such a group, the band
    recorded is holiday for a group dated on a Saturday or Sunday, after_hours for a weekday group with minutes logged in
    the after_hours band, and business_hours otherwise, project work being scheduled and never an emergency, and a weekday
    observed holiday taking the band its lines are logged in; a remote session, a service visit, an installation visit and
    a travel entry take their bands from their own rules, and every other draw, the project time of a client holding no
    such engagement or two or more of them included, keeps the standard time band: holiday on weekends and observed holidays,
    emergency for work dispatched outside business hours at the client's request to restore a down system, after_hours for
    other work outside business_hours_start to business_hours_end on business days (business_hours_days, excluding the observed_holiday_list),
    and business_hours otherwise; only one band applies to a session, in that order of precedence. Whether a block's project
    time falls under this rule is decided by the client's engagement records alone, never by a timesheet line, so it does
    not change with what any engagement logs or with the order of drawing; inside that scope every group is priced by the
    schedules below from its own lines and the one statement of work alone, whatever order its lines were logged or drawn
    in. Project time of a work date is logged in full at the close of that date, before any of that date's groups is drawn
    and before any line of a later date is drawn, so a group is drawn once, for all its lines, and no earlier date is left
    waiting; no line is logged for a date after that date's groups are drawn. Project groups are drawn one at a time from
    the client's most recently dated block-routed project time: the group figured is the first group not yet drawn taking
    levels in the order architect, senior engineer, technician; within the scope above all block-routed time is on the one
    statement of work, so the date and level name the group and that order ends every tie. The group is drawn on its statement
    of work and level. A group counts as drawn when the block's ledger carries a project-work draw recording its statement
    of work, date and level; when the client has no block-routed project time, or every group of that date is drawn, no
    project group is figured. A project group draws its summed logged minutes divided by 60, at technician_ratio and with
    a multiplier of 1, rounded half up to draw_rounding_hours. The figures the project-time schedules below select replace
    or adjust the standard minutes, multiplier and ratio in this order: replacements of the minutes first, then the multipliers
    and the ratio, which multiply one another with no order between them, a multiplier that a schedule applies to part of
    the minutes leaving the rest at 1; the product is rounded half up to draw_rounding_hours once, at the end. Project minutes
    schedule: a group dated on a Saturday or Sunday is a weekend cutover and is drawn for at least weekend_minimum_minutes
    minutes; a weekday group with minutes logged in the after_hours band is drawn with those after-hours minutes in whole
    hours, rounded up to the next multiple of 60 as a scheduled maintenance window, and its business-hours minutes as logged;
    a weekday group logged only in business hours is drawn for its summed minutes. Project band schedule: a group dated
    on a Saturday or Sunday has its summed minutes, raised to at least weekend_minimum_minutes, multiplied by holiday_multiplier;
    a weekday group with minutes logged in the after_hours band has those after-hours minutes, rounded up to the next multiple
    of 60, multiplied by after_hours_multiplier, its other minutes keeping a multiplier of 1; a weekday group logged only
    in business hours keeps a multiplier of 1. Project level schedule: the block hours of a group of architect lines are
    figured at architect_ratio, those of a group of senior engineer lines at senior_engineer_ratio, and those of any other
    group at technician_ratio. Project discount schedule: the block hours of a group on a statement of work with a locked
    rate discount of at least discount_band_high percent are multiplied by discount_rate_high; those of a group on one with
    a locked discount above zero and below discount_band_high percent, by discount_rate_low; those of a group on one with
    no locked discount, by 1. Project class schedule: the block hours of a group on a Major Project or Strategic Program
    engagement are multiplied by class_rate_major, an engagement of that size drawing block time at the program rate; those
    of a group on a Standard Project or Advanced Project engagement, by class_rate_mid; those of a group on any other engagement,
    by 1. The draw is recorded in the band its pricing used, holiday for a weekend cutover, after_hours for a group with
    a maintenance window and business_hours otherwise, with the minutes the group is drawn for, after the floor or whole-hour
    rounding the minutes schedule applies, as its worked minutes.
  prerequisite: []
  cross_category:
  - category: project
    as: branch
    reads:
    - rate_discount_pct
    - sow_number
    - project_work_logs.work_date
    - project_work_logs.sow_number
    - project_work_logs.worked_minutes
    - project_work_logs.resource_level
    - project_work_logs.time_band
    - project_work_logs.billing_route
    note: >-
      The line, its minutes, level and band come from the project work log; the discount schedule reads the engagement of
      the line's statement of work.
  compute:
  - pj_tm_live: >-
      XCOUNT('project', 'project_engagements', pricing_model='time_and_materials', status='signed') + XCOUNT('project',
      'project_engagements', pricing_model='time_and_materials', status='in_progress') + XCOUNT('project', 'project_engagements',
      pricing_model='time_and_materials', status='on_hold') + XCOUNT('project', 'project_engagements', pricing_model='time_and_materials',
      status='pending_acceptance')
  - pj_date: >-
      XLATEST('project', 'project_work_logs', 'work_date', date_field='work_date', billing_route='timebank')
  - pj_s_a: >-
      XLATEST('project', 'project_work_logs', 'sow_number', date_field='sow_number', billing_route='timebank', work_date=pj_date,
      resource_level='architect')
  - pj_dn_a: >-
      COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='project_work', sow_number=pj_s_a, entry_date=pj_date,
      resource_level='architect')
  - pj_p_a: pj_s_a != None and pj_dn_a == 0
  - pj_s_s: >-
      XLATEST('project', 'project_work_logs', 'sow_number', date_field='sow_number', billing_route='timebank', work_date=pj_date,
      resource_level='senior_engineer')
  - pj_dn_s: >-
      COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='project_work', sow_number=pj_s_s, entry_date=pj_date,
      resource_level='senior_engineer')
  - pj_p_s: pj_s_s != None and pj_dn_s == 0
  - pj_s_t: >-
      XLATEST('project', 'project_work_logs', 'sow_number', date_field='sow_number', billing_route='timebank', work_date=pj_date,
      resource_level='technician')
  - pj_dn_t: >-
      COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='project_work', sow_number=pj_s_t, entry_date=pj_date,
      resource_level='technician')
  - pj_p_t: pj_s_t != None and pj_dn_t == 0
  - pj_level: '''architect'' if pj_p_a else (''senior_engineer'' if pj_p_s else (''technician'' if pj_p_t else None))'
  - pj_sow: >-
      pj_s_a if pj_level == 'architect' else (pj_s_s if pj_level == 'senior_engineer' else (pj_s_t if pj_level == 'technician'
      else None))
  - pj_bus: >-
      XSUM('project', 'project_work_logs', 'worked_minutes', billing_route='timebank', work_date=pj_date, sow_number=pj_sow,
      resource_level=pj_level, time_band='business_hours')
  - pj_aft: >-
      XSUM('project', 'project_work_logs', 'worked_minutes', billing_route='timebank', work_date=pj_date, sow_number=pj_sow,
      resource_level=pj_level, time_band='after_hours')
  - pj_total: pj_bus + pj_aft
  - pj_mw_weekday: DAYS('2023-01-01', pj_date) % 7 if pj_date != None else 3
  - pj_mw_aft: >-
      XSUM('project', 'project_work_logs', 'worked_minutes', billing_route='timebank', work_date=pj_date, sow_number=pj_sow,
      resource_level=pj_level, time_band='after_hours')
  - pj_minutes_basis: >-
      MX(pj_total, K('weekend_minimum_minutes')) if (pj_mw_weekday == 0 or pj_mw_weekday == 6) else (pj_bus + int((pj_mw_aft
      + 59) // 60) * 60 if pj_mw_aft > 0 else pj_total)
  - pj_weekday: DAYS('2023-01-01', pj_date) % 7 if pj_date != None else 3
  - pj_band_aft: >-
      XSUM('project', 'project_work_logs', 'worked_minutes', billing_route='timebank', work_date=pj_date, sow_number=pj_sow,
      resource_level=pj_level, time_band='after_hours')
  - pj_band: >-
      P('holiday_multiplier') if (pj_weekday == 0 or pj_weekday == 6) else (P('after_hours_multiplier') if pj_band_aft >
      0 else 1)
  - pj_window: >-
      MX(pj_total, K('weekend_minimum_minutes')) if (pj_weekday == 0 or pj_weekday == 6) else int((pj_band_aft + 59) //
      60) * 60
  - pj_band_extra: pj_window * (pj_band - 1)
  - pj_ratio: >-
      P('architect_ratio') if XLATEST('project', 'project_work_logs', 'resource_level', date_field='work_date', billing_route='timebank',
      work_date=pj_date, sow_number=pj_sow, resource_level=pj_level) == 'architect' else (P('senior_engineer_ratio') if
      XLATEST('project', 'project_work_logs', 'resource_level', date_field='work_date', billing_route='timebank', work_date=pj_date,
      sow_number=pj_sow, resource_level=pj_level) == 'senior_engineer' else P('technician_ratio'))
  - pj_discount: CFIELD('project', 'rate_discount_pct', sow_number=pj_sow) or 0
  - pj_discount_rate: >-
      K('discount_rate_high') if pj_discount >= K('discount_band_high') else (K('discount_rate_low') if pj_discount > 0
      else 1)
  - pj_class: CFIELD('project', 'variant_name', sow_number=pj_sow)
  - pj_class_rate: >-
      K('class_rate_major') if (pj_class == 'Major Project' or pj_class == 'Strategic Program') else (K('class_rate_mid')
      if (pj_class == 'Standard Project' or pj_class == 'Advanced Project') else 1)
  - result: >-
      RND((pj_minutes_basis + pj_band_extra) / 60 * pj_ratio * pj_discount_rate * pj_class_rate, 2) if (pj_tm_live == 1
      and pj_date != None and pj_level != None) else 0
