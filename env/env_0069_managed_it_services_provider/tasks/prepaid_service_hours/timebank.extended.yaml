events:
  - type: timebank_block_ordered
    target: timebank_blocks
    mutation: create
    meaning: A signed order form for a prepaid block is booked.
    grain: One block record per signed order.
    fields: {customer_id: Client organisation., variant_name: Block size., order_date: Signature date., hours_purchased: Equal to block_hours., block_price_usd: Price after any discount., auto_replenish: Auto-replenish setting on the order., rollover_source_block_id: Expiring block whose hours will roll in (empty if none).}
    triggers:
      - event: timebank:timebank_block_invoice
        map: {}
  - type: timebank_block_activated
    target: timebank_blocks
    mutation: {transition: {from: pending_payment, to: active}}
    meaning: The block is activated and its validity period starts.
    grain: One transaction per block.
    fields: {activation_date: Activation date., expiry_date: Last day of the validity period.}
    triggers:
      - event: timebank:timebank_hours_granted
        map: {}
  - type: timebank_order_cancelled
    target: timebank_blocks
    mutation: {transition: {from: pending_payment, to: cancelled}}
    meaning: The client cancels the order before activation.
    grain: One transaction per block.
    fields: {closed_date: Cancellation date.}
    triggers:
      - event: timebank:timebank_order_credit
        map: {}
  - type: timebank_block_depleted
    target: timebank_blocks
    mutation: {transition: {from: active, to: depleted}}
    meaning: The block's balance reaches zero.
    grain: One transaction per depletion.
    fields: {depleted_date: Date the balance reached zero.}
    triggers: []
  - type: timebank_block_restored
    target: timebank_blocks
    mutation: {transition: {from: depleted, to: active}}
    meaning: A draw reversal restores hours to a depleted block.
    grain: One transaction per restoration.
    fields: {depleted_date: Retained as the date of the depletion that ended.}
    triggers: []
  - type: timebank_block_expired
    target: timebank_blocks
    mutation: {transition: {from: active, to: expired}}
    meaning: The block passes its expiry date, or is retired early by a rollover; remaining hours not rolled are forfeited.
    grain: One transaction per block.
    fields: {closed_date: Day after the expiry date (or the rollover date when retired by a rollover).}
    triggers:
      - event: timebank:timebank_hours_forfeited
        map: {}
  - type: timebank_block_extended
    target: timebank_blocks
    mutation: update
    meaning: A signed paid extension moves the expiry date.
    grain: One transaction per extension.
    fields: {expiry_date: New expiry date., extension_count: Incremented.}
    triggers:
      - event: timebank:timebank_extension_fee
        map: {}
  - type: timebank_settings_changed
    target: timebank_blocks
    mutation: update
    meaning: A signed request turns auto-replenish on or off.
    grain: One transaction per change.
    fields: {auto_replenish: New setting.}
    triggers: []
  - type: timebank_hours_granted
    target: timebank_hours_ledger
    meaning: The block's purchased hours are granted at activation.
    grain: One row per block.
    distinguish_by: [entry_date]
    fields: {hours: Hours granted., entry_date: Activation date.}
    account: hours
    direction: in
    triggers: []
  - type: timebank_hours_drawn
    target: timebank_hours_ledger
    meaning: Hours are drawn for work performed on a ticket or a time-and-materials statement of work.
    grain: One row per work session per block (a session split across blocks gives one row per block).
    distinguish_by: [ticket_number, sow_number, entry_date, work_type, time_band, resource_level]
    fields: {hours: Converted block hours drawn from this block., entry_date: Date worked., work_type: Kind of work., time_band: Time band., resource_level: Who worked., worked_minutes: Minutes after rounding and minimums., ticket_number: Ticket (empty for project work)., sow_number: Statement of work (empty for tickets).}
    account: hours
    direction: out
    triggers: []
  - type: timebank_draw_reversed
    target: timebank_hours_ledger
    meaning: A disputed or mistaken draw is reversed in whole or in part.
    grain: One row per draw reversed.
    distinguish_by: [original_ledger_entry_id]
    fields: {original_ledger_entry_id: The draw reversed., hours: Hours restored., entry_date: Reversal date.}
    account: hours
    direction: in
    triggers: []
  - type: timebank_hours_rolled_out
    target: timebank_hours_ledger
    meaning: Unused hours leave an expiring block toward a new block.
    grain: One row per rollover.
    distinguish_by: [counterpart_block_id]
    fields: {hours: Hours rolled out., entry_date: Rollover date., counterpart_block_id: Receiving block.}
    account: hours
    direction: out
    triggers: []
  - type: timebank_hours_rolled_in
    target: timebank_hours_ledger
    meaning: Rolled-over hours arrive on the new block.
    grain: One row per rollover.
    distinguish_by: [counterpart_block_id]
    fields: {hours: Hours rolled in., entry_date: Rollover date., counterpart_block_id: Expiring block.}
    account: hours
    direction: in
    triggers: []
  - type: timebank_hours_forfeited
    target: timebank_hours_ledger
    meaning: Hours left on a block at expiry or beyond the rollover cap are forfeited.
    grain: One row per block.
    distinguish_by: [entry_date]
    fields: {hours: Hours forfeited., entry_date: Forfeiture date.}
    account: hours
    direction: out
    triggers: []
  - type: timebank_block_invoice
    target: timebank_billing
    meaning: The block price is invoiced on the order date.
    grain: One row per block.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Block price., invoice_number: Invoice., posted_date: Order date., billing_period: Month of order.}
    account: receivable
    direction: in
    triggers: []
  - type: timebank_overage_charge
    target: timebank_billing
    meaning: Work beyond every available balance is invoiced.
    grain: One row per work session in overage.
    distinguish_by: [ticket_number, sow_number, billing_period, overage_hours]
    fields: {overage_hours: Block hours in overage., amount_usd: Amount., invoice_number: Invoice., posted_date: Posting date., billing_period: Month worked., ticket_number: Ticket., sow_number: Statement of work.}
    account: receivable
    direction: in
    triggers: []
  - type: timebank_extension_fee
    target: timebank_billing
    meaning: The fee for a paid extension is invoiced.
    grain: One row per extension.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee., invoice_number: Invoice., posted_date: Extension date., billing_period: Month of extension.}
    account: receivable
    direction: in
    triggers: []
  - type: timebank_payment
    target: timebank_billing
    meaning: A payment is applied to an invoice.
    grain: One row per remittance per invoice.
    distinguish_by: [payment_reference, invoice_number]
    fields: {payment_reference: Remittance reference., amount_usd: Amount applied., invoice_number: Invoice paid., posted_date: Date received.}
    account: receivable
    direction: out
    triggers: []
  - type: timebank_late_fee
    target: timebank_billing
    meaning: A late fee is assessed on a past-due invoice.
    grain: One row per invoice per month assessed.
    distinguish_by: [invoice_number, billing_period]
    fields: {invoice_number: Past-due invoice., billing_period: Month assessed., amount_usd: Fee., posted_date: Assessment date.}
    account: receivable
    direction: in
    triggers: []
  - type: timebank_order_credit
    target: timebank_billing
    meaning: The block invoice is credited in full when an order is cancelled before activation.
    grain: One row per cancelled block.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Credit., invoice_number: Block invoice credited., posted_date: Cancellation date., billing_period: Month of cancellation.}
    account: receivable
    direction: out
    triggers: []


measures:
  - id: timebank_msr_overage_hours_month
    window: The calendar month (US Eastern) of the work session being decided, up to but excluding that session.
    measure: Sum of overage_hours over the client's timebank_overage_charge rows whose billing_period is that month.
  - id: timebank_msr_active_blocks_fefo
    window: Point in time, immediately before the draw being decided.
    measure: The client's blocks whose status is active, ordered by expiry_date ascending and then by activation_date ascending, each with its hours_balance.

policies:
  - id: timebank_agg_multi_holding
    subject: [timebank_block_ordered]
    rule: >-
      A client may hold any number of prepaid blocks, of the same or different sizes, at the same time; each block keeps its
      own price, validity period, balance and settings, and blocks are combined only by the draw order of
      timebank_agg_draw_order.
    eligibility: []
    params:
      max_per_customer: null

  - id: timebank_agg_draw_order
    subject: [timebank_hours_drawn, timebank_overage_charge, timebank_block_depleted]
    rule: >-
      Hours for a work session are drawn from the client's active block with the earliest expiry_date first, and on equal
      expiry dates from the block activated first (timebank_msr_active_blocks_fefo). When the session's converted hours
      exceed that block's balance, the block is drawn to zero and the remainder is drawn from the next block in the same
      order, one draw row per block. A block whose balance reaches zero moves to depleted on the same day. When every active
      block is exhausted, the remainder is billed as an overage at the overage_hourly_rate_usd of the last block drawn, or of
      the client's most recently activated block when no block had hours, rounded half up to the cent. Overage in one
      calendar month beyond that block's overage_cap_hours_monthly (timebank_msr_overage_hours_month) needs the authorized
      contact's written approval before further non-emergency work is scheduled; emergency work is never held for approval.
    eligibility: []
    measures: [timebank_msr_active_blocks_fefo, timebank_msr_overage_hours_month]
    formula:
      amount_usd: round(overage_hours * overage_hourly_rate_usd, 2)

  - id: timebank_ordering_and_pricing
    subject: [timebank_block_ordered, timebank_block_invoice]
    rule: >-
      A block is bought from the authorized contact's signed order form, except an auto-replenishment order, which the client
      pre-authorised by setting auto_replenish on the depleting block. The 160-hour and 320-hour blocks may be ordered only
      while the client holds a ClearPath agreement whose status is active. The block price is block_list_price_usd reduced by
      clearpath_discount_pct when, on the order date, the client holds a ClearPath agreement whose status is active and whose
      tier rank is at least clearpath_discount_min_rank, rounded half up to the cent; otherwise it is block_list_price_usd.
      The block price is invoiced on the order date and falls due invoice_due_days calendar days later (on receipt when 0).
    eligibility:
      - id: large_block_requires_clearpath
        applies_to: [timebank_block_ordered]
        kind: state
        condition: The 160-hour and 320-hour blocks may be ordered only while the client holds a ClearPath agreement whose status is active.
        evidence_fields: [managed_agreements.customer_id, managed_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[managed_agreements.customer_id]]
          action_bindings: {managed_agreements.customer_id: customer_id}
        state_contract:
          field: managed_agreements.status
          allowed: [active]
    params:
      per_tier:
        TimeBank 10-Hour Block: {list_price: =block_list_price_usd, discount_pct: =clearpath_discount_pct}
        TimeBank 20-Hour Block: {list_price: =block_list_price_usd, discount_pct: =clearpath_discount_pct}
        TimeBank 40-Hour Block: {list_price: =block_list_price_usd, discount_pct: =clearpath_discount_pct}
        TimeBank 80-Hour Block: {list_price: =block_list_price_usd, discount_pct: =clearpath_discount_pct}
        TimeBank 160-Hour Block: {list_price: =block_list_price_usd, discount_pct: =clearpath_discount_pct}
        TimeBank 320-Hour Block: {list_price: =block_list_price_usd, discount_pct: =clearpath_discount_pct}
    formula:
      amount_usd: round(block_list_price_usd * (1 - clearpath_discount_pct / 100), 2)

  - id: timebank_activation_and_validity
    subject: [timebank_block_activated, timebank_hours_granted, timebank_order_cancelled, timebank_order_credit, timebank_block_expired, timebank_hours_forfeited]
    rule: >-
      A block whose activation_basis is full_payment is activated only after its block invoice has been paid in full. A block
      whose activation_basis is signature is activated on the day its order is signed. Activation grants block_hours hours.
      The expiry_date is the day before the same day of the month validity_months calendar months after the activation date;
      when that day does not exist in the target month, the last day of the target month is used as the anniversary. Hours
      may be drawn for work performed on or before the expiry_date. On the day after the expiry_date a block that is still
      active expires and its remaining hours are forfeited unless they were rolled into a new block; a depleted block simply
      stays depleted. An order may be cancelled by the client only before activation, and its block invoice is then
      credited in full; once activated, unused hours are never refunded or converted into credit against other services
      because refundable_unused_hours is false.
    eligibility:
      - id: paid_before_activation
        applies_to: [timebank_block_activated]
        kind: authorization
        condition: A block whose activation_basis is full_payment is activated only after its block invoice has been paid in full.
        evidence_fields: [timebank_billing.timebank_block_id, timebank_billing.event_type, timebank_billing.invoice_number, timebank_billing.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[timebank_billing.timebank_block_id]]
          action_bindings: {timebank_billing.timebank_block_id: timebank_block_id}

  - id: timebank_draw_conversion
    subject: [timebank_hours_drawn]
    rule: >-
      A work session is drawn only for a work_type listed in the block's eligible_work_types; project_work is drawn only
      where project_work_eligible is true and only under a time-and-materials statement of work, never under a fixed-fee
      one. Work that the client's ClearPath agreement already includes, hardware, licences and monthly fees are never drawn
      from a block. Hours may be drawn only from a block whose status is active. Worked minutes are the recorded minutes
      rounded up to billing_increment_minutes and never less than minimum_draw_minutes_remote for a remote session or
      minimum_draw_minutes_onsite for an onsite visit. The time band is holiday on weekends and observed holidays, emergency
      for work dispatched outside business hours at the client's request to restore a down system, after_hours for other
      work outside business_hours_start to business_hours_end on business days (business_hours_days, excluding the
      observed_holiday_list), and business_hours otherwise; only one
      band applies to a session, in that order of precedence. Converted block hours equal worked minutes divided by 60, times
      the resource ratio (technician_ratio, senior_engineer_ratio or architect_ratio), times the band multiplier
      (holiday_multiplier, emergency_multiplier or after_hours_multiplier, and 1 in business hours), rounded half up to
      draw_rounding_hours. Each onsite visit additionally draws onsite_trip_hours as a separate travel row at the business
      hours band with no ratio applied.
    eligibility:
      - id: draw_active_block
        applies_to: [timebank_hours_drawn]
        kind: state
        condition: Hours may be drawn only from a block whose status is active.
        evidence_fields: [timebank_blocks.timebank_block_id, timebank_blocks.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[timebank_blocks.timebank_block_id]]
          action_bindings: {timebank_blocks.timebank_block_id: timebank_block_id}
        state_contract:
          field: timebank_blocks.status
          allowed: [active]
    formula:
      ratio: architect_ratio if resource_level == "architect" else (senior_engineer_ratio if resource_level == "senior_engineer" else technician_ratio)
      multiplier: holiday_multiplier if time_band == "holiday" else (emergency_multiplier if time_band == "emergency" else (after_hours_multiplier if time_band == "after_hours" else 1))
      hours: round(worked_minutes / 60 * ratio * multiplier, 2)

  - id: timebank_draw_disputes
    subject: [timebank_draw_reversed, timebank_block_restored]
    rule: >-
      A client may dispute a draw it believes was mistaken or over-converted. A draw may be disputed only within
      dispute_window_days calendar days after the draw's entry date. The window is counted in calendar days from the draw's
      entry_date, that date being day 0, and a dispute raised on the last day is in time. A draw is reversed at most once,
      and the hours restored never exceed the hours of that draw. The reversal restores the hours to the block the draw was
      taken from; a reversal can be posted only while that block's status is active or depleted, and a depleted block that
      regains hours before its expiry date returns to active. Disputes about overage charges are invoice disputes handled
      by the accounting team, not reversals.
    eligibility:
      - id: dispute_window
        applies_to: [timebank_draw_reversed]
        kind: time
        condition: A draw may be disputed only within dispute_window_days calendar days after the draw's entry date.
        evidence_fields: [timebank_hours_ledger.timebank_ledger_entry_id, timebank_hours_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[timebank_hours_ledger.timebank_ledger_entry_id]]
          action_bindings: {timebank_hours_ledger.timebank_ledger_entry_id: original_ledger_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the draw's entry date
          anchor_source: timebank_hours_ledger.entry_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days from the draw's entry_date, that date being day 0, and a dispute raised on the last day is in time.
          boundary: inclusive
      - id: one_reversal_per_draw
        applies_to: [timebank_draw_reversed]
        kind: dedup
        condition: A draw is reversed at most once, and the hours restored never exceed the hours of that draw.
        evidence_fields: [timebank_hours_ledger.original_ledger_entry_id, timebank_hours_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[timebank_hours_ledger.original_ledger_entry_id]]
          action_bindings: {timebank_hours_ledger.original_ledger_entry_id: original_ledger_entry_id}
        dedup_contract:
          table: timebank_hours_ledger
          mode: separate_record
          object_bindings: {original_ledger_entry_id: original_ledger_entry_id}
          duplicate_filters: {event_type: [timebank_draw_reversed]}
          distinct_fields: []
      - id: reversal_block_status
        applies_to: [timebank_draw_reversed]
        kind: state
        condition: a reversal can be posted only while that block's status is active or depleted
        evidence_fields: [timebank_blocks.timebank_block_id, timebank_blocks.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[timebank_blocks.timebank_block_id]]
          action_bindings: {timebank_blocks.timebank_block_id: timebank_block_id}
        state_contract:
          field: timebank_blocks.status
          allowed: [active, depleted]

  - id: timebank_rollover_and_extension
    subject: [timebank_hours_rolled_out, timebank_hours_rolled_in, timebank_block_extended, timebank_extension_fee, timebank_block_expired]
    rule: >-
      Where rollover_allowed is true on the expiring block, its unused hours may roll into a new block that the client
      orders as a rollover order. A new block qualifies to receive a rollover only when it is ordered within
      rollover_purchase_window_days calendar days before the expiring block's expiry date. The window opens
      rollover_purchase_window_days calendar days before the expiry_date and closes at the end of the expiry_date itself.
      Because rollover_requires_same_or_larger_block is true, the new block must be the same size or larger than
      the expiring block. The rollover is posted on the day the new
      block is activated: the expiring block's balance, capped at block_hours times rollover_cap_pct divided by 100 of the
      expiring block, rolls out of it and into the new block, any balance above the cap is forfeited, and the expiring
      block expires that day. Rolled-in hours share the new block's expiry date and, because rolled_hours_roll_again is
      false, never roll over a second time. Where
      extension_allowed is true, a block may instead be extended by extension_months, at most max_extensions_per_block
      times. An extension must be signed no later than the block's expiry date. The expiry date itself is the last day an
      extension can be signed. The extension fee is extension_fee_pct percent of hours_balance valued at hourly_rate_usd,
      rounded half up to the cent, invoiced when the extension takes effect; a block whose hours were rolled out cannot be
      extended.
    eligibility:
      - id: rollover_order_window
        applies_to: [timebank_hours_rolled_in]
        kind: time
        condition: A new block qualifies to receive a rollover only when it is ordered within rollover_purchase_window_days calendar days before the expiring block's expiry date.
        evidence_fields: [timebank_blocks.timebank_block_id, timebank_blocks.expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[timebank_blocks.timebank_block_id]]
          action_bindings: {timebank_blocks.timebank_block_id: rollover_source_block_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiring block's expiry date
          anchor_source: timebank_blocks.expiry_date
          relation: not_before
          duration_source: variants.rollover_purchase_window_days
          unit: calendar_days
          counting_rule: The window opens rollover_purchase_window_days calendar days before the expiry_date and closes at the end of the expiry_date itself.
          boundary: inclusive
      - id: extension_before_expiry
        applies_to: [timebank_block_extended]
        kind: time
        condition: An extension must be signed no later than the block's expiry date.
        evidence_fields: [timebank_blocks.timebank_block_id, timebank_blocks.expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[timebank_blocks.timebank_block_id]]
          action_bindings: {timebank_blocks.timebank_block_id: timebank_block_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the block's expiry date
          anchor_source: timebank_blocks.expiry_date
          relation: not_after
          duration_source: params.extension_lead_days
          unit: calendar_days
          counting_rule: The expiry date itself is the last day an extension can be signed.
          boundary: inclusive
    params:
      extension_lead_days: 0
    formula:
      rollover_hours: min(hours_balance, block_hours * rollover_cap_pct / 100)
      amount_usd: round(extension_fee_pct / 100 * hours_balance * hourly_rate_usd, 2)

  - id: timebank_low_balance_and_replenish
    subject: [timebank_settings_changed, timebank_block_ordered, timebank_block_depleted]
    rule: >-
      When a draw leaves a block's balance at or below low_balance_alert_pct percent of its block_hours, a low-balance notice
      is emailed to the authorized contact. If that block's auto_replenish is true and auto_replenish_available is true, the
      same draw also books one new block of the same size for the client, priced under timebank_ordering_and_pricing on the
      day of the draw, with no new order form; a block triggers auto-replenishment at most
      auto_replenish_max_per_block times. Auto-replenish is turned on
      or off only by the authorized contact's signed request.
    eligibility: []

  - id: timebank_billing_and_entitlements
    subject: [timebank_payment, timebank_late_fee, timebank_block_invoice]
    rule: >-
      A payment is applied to the invoice its remittance names, otherwise to the oldest open invoice first, one entry per
      invoice applied; card payments are accepted only for an invoice whose total does not exceed card_payment_max_usd. On
      the first day of each calendar month every invoice still unpaid more than late_fee_grace_days calendar days after its
      due date is assessed one late fee of late_fee_pct_monthly percent of its unpaid balance, or late_fee_minimum_usd if
      greater, rounded half up to the cent. For a block activated on signature whose invoice is more than
      draw_hold_days_past_due days past due, new draws are put on hold until it is paid and the work is billed as overage in
      the meantime. Hours statements are emailed on hours_statement_cadence; priority_scheduling and named_engineer are
      entitlements of the block size, not billed separately.
    eligibility: []


# ---- extended policies (prepaid_service_hours) ----
extended_policies:
- id: timebank_ext_repeat_order_quote
  base_policy_refs:
  - timebank_agg_multi_holding
  - timebank_ordering_and_pricing
  - timebank_low_balance_and_replenish
  - timebank_billing_and_entitlements
  overwrite:
  - base_policy: timebank_ordering_and_pricing
    superseded_clause: >-
      The block price is block_list_price_usd reduced by clearpath_discount_pct when, on the order date, the client holds
      a ClearPath agreement whose status is active and whose tier rank is at least clearpath_discount_min_rank, rounded
      half up to the cent; otherwise it is block_list_price_usd.
    replaced_by: >-
      For a repeat order, meaning a new block of the same size as a block the client currently holds and quoted on a signed
      order form against that current block, and only for such an order, the price is figured under the repeat-order schedule
      below; every other block order remains priced under the standard block price rule, which still reduces block_list_price_usd
      by clearpath_discount_pct for a client holding an active ClearPath agreement at or above clearpath_discount_min_rank
      on the order date, rounded half up to the cent, and is block_list_price_usd otherwise.
  trigger: on_request
  subject:
  - timebank_block_ordered
  - timebank_block_invoice
  computes: quoted_amount_usd
  target_tool: sign_repeat_block_order_5562f94d
  params:
    tenure_pct_per_year: 1.0
    tenure_cap_pct: 5.0
    tenure_flat_pct: 2.0
    tenure_min_months: 24
    usage_high_share: 0.9
    usage_high_pct: 4.0
    usage_mid_share: 0.7
    usage_mid_pct: 2.0
    prompt_pay_pct: 1.0
    prompt_partial_pct: 0.5
    seat_high_count: 50
    seat_high_pct: 2.0
    seat_mid_count: 25
    seat_mid_pct: 1.0
    lead_long_days: 90
    lead_long_pct: 1.0
    lead_short_days: 30
    lead_short_pct: 0.5
  rule: >-
    For a repeat order, meaning a new block of the same size as a block the client currently holds and quoted on a signed
    order form against that current block, and only for such an order, the price is figured under the repeat-order schedule
    below; every other block order remains priced under the standard block price rule, which still reduces block_list_price_usd
    by clearpath_discount_pct for a client holding an active ClearPath agreement at or above clearpath_discount_min_rank
    on the order date, rounded half up to the cent, and is block_list_price_usd otherwise. The repeat-order price starts
    from the block_list_price_usd of the current block's size. It is reduced by clearpath_discount_pct when, on the order
    date, the client holds a ClearPath agreement whose status is active and whose tier rank is at least clearpath_discount_min_rank.
    The price is rounded half up to the cent. Every percentage that one of the schedules below grants is added to that ClearPath
    percentage into one total, and the list price is reduced once by the total; no percentage acts on the price left by
    another, and the rounding to the cent happens once, on the reduced price. Repeat-order tenure schedule: a client whose
    ClearPath agreement is active at ClearPath Professional, ClearPath Premier or ClearPath Enterprise earns tenure_pct_per_year
    percent for every full year since that agreement's go-live date, never more than tenure_cap_pct percent in all; a client
    whose ClearPath agreement is active at any other tier and went live at least tenure_min_months whole months before the
    order date earns a flat tenure_flat_pct percent; any other client earns no tenure percentage. Whole months and years
    are counted from the go-live date to the order date, a month being complete only once the same day of the month is reached.
    Repeat-order usage schedule: the share of the current block's hours already used is its hours drawn less its hours reversed,
    divided by its hours purchased; a share of at least usage_high_share earns usage_high_pct percent, a share of at least
    usage_mid_share and below usage_high_share earns usage_mid_pct percent, and a lower share earns none. Repeat-order payment
    schedule: when no late fee has been assessed on the current block in the twelve months before the order date, meaning
    fees dated after the same day twelve months earlier, and its block invoice was paid in full on the day it was posted,
    the order earns prompt_pay_pct percent; when no such late fee was assessed and the invoice was paid in full on a later
    day, it earns prompt_partial_pct percent; when a late fee was assessed in those twelve months, or the invoice is not
    yet paid in full, it earns none. Only payments applied to the block invoice's own invoice number count, and the payment
    completing the invoice dates its full payment. Repeat-order seat schedule: a client whose active ClearPath agreement
    covers at least seat_high_count seats earns seat_high_pct percent, one whose active agreement covers at least seat_mid_count
    and fewer than seat_high_count seats earns seat_mid_pct percent, and any other client earns none. Repeat-order lead
    schedule: a repeat order placed while the current block still has at least lead_long_days calendar days to its expiry_date
    earns lead_long_pct percent, one placed with at least lead_short_days and fewer than lead_long_days days left earns
    lead_short_pct percent, and one placed later earns none; days are counted from the order date to the expiry_date, the
    order date not counted. The repeat-order price is fixed only after the current block's hours ledger carries the travel
    entry dated the resolution date of the client's ticket most recently resolved to the prepaid-block route with onsite
    labor, where that visit is a service visit, wherever the block's size draws travel hours. The repeat-order price is
    not fixed until the current block's hours ledger carries the onsite-support draw of the client's ticket most recently
    resolved to the prepaid-block route with onsite labor, dated that resolution's date, where that visit is a service visit.
    The order is invoiced on the order date at the price figured here and falls due invoice_due_days calendar days later,
    and the new block keeps every other term of its size.
  prerequisite:
  - problem: timebank_ext_visit_travel_entry
    kind: value_input
    gate: net_drawn_share
    form: state
    policy_source: >-
      The repeat-order price is fixed only after the current block's hours ledger carries the travel entry dated the resolution
      date of the client's ticket most recently resolved to the prepaid-block route with onsite labor, where that visit
      is a service visit, wherever the block's size draws travel hours.
    condition: >-
      On the current block, a travel draw is dated the resolution date of the client's latest onsite resolution routed to
      the block, when the visit is a service visit and the block's onsite_trip_hours is above zero.
    resolved_by: post_visit_travel_entry_8d0122c7
    effect: >-
      The travel entry adds its hours to the block's hours drawn, raising the used share that the repeat-order usage schedule
      reads.
  - problem: timebank_ext_service_visit_draw
    kind: value_input
    gate: net_drawn_share
    form: state
    policy_source: >-
      The repeat-order price is not fixed until the current block's hours ledger carries the onsite-support draw of the
      client's ticket most recently resolved to the prepaid-block route with onsite labor, dated that resolution's date,
      where that visit is a service visit.
    condition: >-
      On the current block, an onsite_support draw carries the ticket_number of the client's latest onsite resolution routed
      to the block and that resolution's date, when the visit is a service visit.
    resolved_by: post_service_visit_draw_abd20ee9
    effect: >-
      The visit draw adds its hours to the block's hours drawn, raising the used share that the repeat-order usage schedule
      reads.
  cross_category:
  - category: managed
    as: branch
    reads:
    - status
    - variant_name
    - go_live_date
    - seat_count
    note: >-
      The tenure and seat schedules and the ClearPath percentage read the client's active ClearPath agreement.
  compute:
  - cp_status: CFIELD('managed', 'status', status='active')
  - cp_tier: CFIELD('managed', 'variant_name', status='active')
  - cp_rank: >-
      (6 if cp_tier == 'ClearPath Enterprise' else (5 if cp_tier == 'ClearPath Premier' else (4 if cp_tier == 'ClearPath
      Professional' else (3 if cp_tier == 'ClearPath Standard' else (2 if cp_tier == 'ClearPath Essentials' else (1 if cp_tier
      == 'ClearPath Monitor' else 0))))))
  - clearpath_pct: >-
      P('clearpath_discount_pct') if (cp_status == 'active' and cp_rank >= P('clearpath_discount_min_rank')) else 0
  - cp_months: MONTHS(CFIELD('managed', 'go_live_date', status='active'), NOW) if cp_status == 'active' else 0
  - tenure_pct: >-
      MN(K('tenure_cap_pct'), K('tenure_pct_per_year') * (cp_months // 12)) if (cp_status == 'active' and (cp_tier == 'ClearPath
      Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise')) else (K('tenure_flat_pct')
      if (cp_status == 'active' and cp_months >= K('tenure_min_months')) else 0)
  - hours_drawn: SUM('timebank_hours_ledger', 'hours', event_type='timebank_hours_drawn')
  - hours_reversed: SUM('timebank_hours_ledger', 'hours', event_type='timebank_draw_reversed')
  - net_drawn_share: (hours_drawn - hours_reversed) / F('hours_purchased')
  - usage_pct: >-
      K('usage_high_pct') if net_drawn_share >= K('usage_high_share') else (K('usage_mid_pct') if net_drawn_share >= K('usage_mid_share')
      else 0)
  - late_fee_n: >-
      COUNT('timebank_billing', within_months=12, date_field='posted_date', event_type='timebank_late_fee')
  - pay_invoice_no: >-
      LATEST('timebank_billing', 'invoice_number', date_field='posted_date', event_type='timebank_block_invoice')
  - pay_invoice_date: >-
      LATEST('timebank_billing', 'posted_date', date_field='posted_date', event_type='timebank_block_invoice')
  - pay_invoice_amount: SUM('timebank_billing', 'amount_usd', event_type='timebank_block_invoice')
  - pay_applied: SUM('timebank_billing', 'amount_usd', event_type='timebank_payment', invoice_number=pay_invoice_no)
  - pay_last_date: >-
      LATEST('timebank_billing', 'posted_date', date_field='posted_date', event_type='timebank_payment', invoice_number=pay_invoice_no)
  - prompt_pct: >-
      K('prompt_pay_pct') if (late_fee_n == 0 and pay_invoice_amount > 0 and pay_applied >= pay_invoice_amount and DAYS(pay_invoice_date,
      pay_last_date) == 0) else (K('prompt_partial_pct') if (late_fee_n == 0 and pay_invoice_amount > 0 and pay_applied
      >= pay_invoice_amount) else 0)
  - seat_n: CFIELD('managed', 'seat_count', status='active') or 0
  - seat_pct: >-
      K('seat_high_pct') if (cp_status == 'active' and seat_n >= K('seat_high_count')) else (K('seat_mid_pct') if (cp_status
      == 'active' and seat_n >= K('seat_mid_count')) else 0)
  - lead_days: DAYS(NOW, F('expiry_date'))
  - lead_pct: >-
      K('lead_long_pct') if lead_days >= K('lead_long_days') else (K('lead_short_pct') if lead_days >= K('lead_short_days')
      else 0)
  - result: >-
      RND(P('block_list_price_usd') * (1 - (clearpath_pct + tenure_pct + usage_pct + prompt_pct + seat_pct + lead_pct) /
      100), 2)
  compute_basis:
    cp_status: >-
      It is reduced by clearpath_discount_pct when, on the order date, the client holds a ClearPath agreement whose status
      is active and whose tier rank is at least clearpath_discount_min_rank.
    cp_tier: >-
      It is reduced by clearpath_discount_pct when, on the order date, the client holds a ClearPath agreement whose status
      is active and whose tier rank is at least clearpath_discount_min_rank.
    cp_rank: >-
      It is reduced by clearpath_discount_pct when, on the order date, the client holds a ClearPath agreement whose status
      is active and whose tier rank is at least clearpath_discount_min_rank.
    clearpath_pct: >-
      It is reduced by clearpath_discount_pct when, on the order date, the client holds a ClearPath agreement whose status
      is active and whose tier rank is at least clearpath_discount_min_rank.
    cp_months: >-
      Whole months and years are counted from the go-live date to the order date, a month being complete only once the same
      day of the month is reached.
    tenure_pct: >-
      Repeat-order tenure schedule: a client whose ClearPath agreement is active at ClearPath Professional, ClearPath Premier
      or ClearPath Enterprise earns tenure_pct_per_year percent for every full year since that agreement's go-live date,
      never more than tenure_cap_pct percent in all; a client whose ClearPath agreement is active at any other tier and
      went live at least tenure_min_months whole months before the order date earns a flat tenure_flat_pct percent; any
      other client earns no tenure percentage.
    hours_drawn: >-
      the share of the current block's hours already used is its hours drawn less its hours reversed, divided by its hours
      purchased
    hours_reversed: >-
      the share of the current block's hours already used is its hours drawn less its hours reversed, divided by its hours
      purchased
    net_drawn_share: >-
      the share of the current block's hours already used is its hours drawn less its hours reversed, divided by its hours
      purchased
    usage_pct: >-
      a share of at least usage_high_share earns usage_high_pct percent, a share of at least usage_mid_share and below usage_high_share
      earns usage_mid_pct percent, and a lower share earns none.
    late_fee_n: >-
      Repeat-order payment schedule: when no late fee has been assessed on the current block in the twelve months before
      the order date, meaning fees dated after the same day twelve months earlier, and its block invoice was paid in full
      on the day it was posted, the order earns prompt_pay_pct percent
    pay_invoice_no: >-
      Only payments applied to the block invoice's own invoice number count, and the payment completing the invoice dates
      its full payment.
    pay_invoice_date: >-
      Repeat-order payment schedule: when no late fee has been assessed on the current block in the twelve months before
      the order date, meaning fees dated after the same day twelve months earlier, and its block invoice was paid in full
      on the day it was posted, the order earns prompt_pay_pct percent
    pay_invoice_amount: >-
      when no such late fee was assessed and the invoice was paid in full on a later day, it earns prompt_partial_pct percent;
      when a late fee was assessed in those twelve months, or the invoice is not yet paid in full, it earns none.
    pay_applied: >-
      Only payments applied to the block invoice's own invoice number count, and the payment completing the invoice dates
      its full payment.
    pay_last_date: >-
      Only payments applied to the block invoice's own invoice number count, and the payment completing the invoice dates
      its full payment.
    prompt_pct: >-
      when no such late fee was assessed and the invoice was paid in full on a later day, it earns prompt_partial_pct percent;
      when a late fee was assessed in those twelve months, or the invoice is not yet paid in full, it earns none.
    seat_n: >-
      Repeat-order seat schedule: a client whose active ClearPath agreement covers at least seat_high_count seats earns
      seat_high_pct percent
    seat_pct: >-
      Repeat-order seat schedule: a client whose active ClearPath agreement covers at least seat_high_count seats earns
      seat_high_pct percent, one whose active agreement covers at least seat_mid_count and fewer than seat_high_count seats
      earns seat_mid_pct percent, and any other client earns none.
    lead_days: days are counted from the order date to the expiry_date, the order date not counted.
    lead_pct: >-
      Repeat-order lead schedule: a repeat order placed while the current block still has at least lead_long_days calendar
      days to its expiry_date earns lead_long_pct percent, one placed with at least lead_short_days and fewer than lead_long_days
      days left earns lead_short_pct percent, and one placed later earns none; days are counted from the order date to the
      expiry_date, the order date not counted.
    result: >-
      Every percentage that one of the schedules below grants is added to that ClearPath percentage into one total, and
      the list price is reduced once by the total; no percentage acts on the price left by another, and the rounding to
      the cent happens once, on the reduced price.
  factors:
  - id: tenure_scale
    effect: method
    decides: tenure_pct
    bindings:
    - cp_months
    - tenure_pct
    ladder:
    - when: >-
        the client's ClearPath agreement is active AND its tier is ClearPath Professional, ClearPath Premier or ClearPath
        Enterprise
      method: >-
        tenure_pct_per_year percent times the number of full years since the agreement's go-live date, never more than tenure_cap_pct
        percent
    - when: >-
        the client's ClearPath agreement is active at another tier AND went live at least tenure_min_months whole months
        before the order date
      method: a flat tenure_flat_pct percent, whatever the length of service
    - when: otherwise
      method: no tenure percentage
    baseline:
      tenure_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: managed
  - id: usage_share_tier
    effect: parameter
    decides: usage_pct
    bindings:
    - hours_drawn
    - hours_reversed
    - net_drawn_share
    - usage_pct
    ladder:
    - when: >-
        the current block's hours drawn less hours reversed is at least usage_high_share of its hours purchased
      value: K('usage_high_pct')
    - when: that share is at least usage_mid_share and below usage_high_share
      value: K('usage_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      usage_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: prompt_payer_tier
    effect: parameter
    decides: prompt_pct
    bindings:
    - late_fee_n
    - pay_invoice_no
    - pay_invoice_date
    - pay_invoice_amount
    - pay_applied
    - pay_last_date
    - prompt_pct
    ladder:
    - when: >-
        no late fee on the current block in the last twelve months AND its block invoice paid in full on its posting day
      value: K('prompt_pay_pct')
    - when: >-
        no late fee on the current block in the last twelve months AND its block invoice paid in full on a later day
      value: K('prompt_partial_pct')
    - when: otherwise
      value: '0'
    baseline:
      prompt_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: seat_volume_tier
    effect: parameter
    decides: seat_pct
    bindings:
    - seat_n
    - seat_pct
    ladder:
    - when: the client's ClearPath agreement is active AND covers at least seat_high_count seats
      value: K('seat_high_pct')
    - when: >-
        the client's ClearPath agreement is active AND covers at least seat_mid_count and fewer than seat_high_count seats
      value: K('seat_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      seat_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: managed
  - id: renewal_lead_tier
    effect: parameter
    decides: lead_pct
    bindings:
    - lead_days
    - lead_pct
    ladder:
    - when: the current block has at least lead_long_days days to its expiry_date on the order date
      value: K('lead_long_pct')
    - when: it has at least lead_short_days and fewer than lead_long_days days left
      value: K('lead_short_pct')
    - when: otherwise
      value: '0'
    baseline:
      lead_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The repeat-order price starts from the block_list_price_usd of the current block's size. It is reduced by clearpath_discount_pct
      when, on the order date, the client holds a ClearPath agreement whose status is active and whose tier rank is at least
      clearpath_discount_min_rank. The price is rounded half up to the cent.
    params:
    - block_list_price_usd
    - clearpath_discount_pct
    - clearpath_discount_min_rank
  inputs:
    history:
    - table: timebank_hours_ledger
      aggregate: sum
      field: hours
      filters:
        event_type: timebank_hours_drawn
    - table: timebank_hours_ledger
      aggregate: sum
      field: hours
      filters:
        event_type: timebank_draw_reversed
    - table: timebank_billing
      aggregate: count
      field: amount_usd
      within_months: 12
      filters:
        event_type: timebank_late_fee
    - table: timebank_billing
      aggregate: sum
      field: amount_usd
      filters:
        event_type: timebank_payment
    cross_category:
    - managed
- id: timebank_ext_visit_travel_entry
  base_policy_refs:
  - timebank_agg_draw_order
  - timebank_draw_conversion
  overwrite:
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      Each onsite visit additionally draws onsite_trip_hours as a separate travel row at the business hours band with no
      ratio applied.
    replaced_by: >-
      For travel to the client's site drawn from a block, and only for travel, the travel is figured under the travel schedules
      below rather than as a flat onsite_trip_hours at the business hours band for each visit: the block draws one trip
      per onsite date, however many onsite visits carry that date and whether or not their tickets are resolved, dated that
      date and booked to the ticket of that date's onsite-support draw recording the most worked minutes, the higher ticket
      number ending a tie; a remote session, a service visit, an installation visit and a project time line keep their own
      rules, and every draw that is not a travel entry keeps its own rule.
  trigger: state_due
  subject:
  - timebank_hours_drawn
  computes: hours
  target_tool: post_visit_travel_entry_8d0122c7
  params:
    same_day_rate: 1.25
    next_day_rate: 1.15
  rule: >-
    For travel to the client's site drawn from a block, and only for travel, the travel is figured under the travel schedules
    below rather than as a flat onsite_trip_hours at the business hours band for each visit: the block draws one trip per
    onsite date, however many onsite visits carry that date and whether or not their tickets are resolved, dated that date
    and booked to the ticket of that date's onsite-support draw recording the most worked minutes, the higher ticket number
    ending a tie; a remote session, a service visit, an installation visit and a project time line keep their own rules,
    and every draw that is not a travel entry keeps its own rule. Every onsite date's trip is priced by the schedules below
    from that date's onsite-support draws, the ticket the trip is booked to and the client's agreement alone, and a date's
    trip is drawn once. Trips are figured one date at a time: the date figured is the date of the block's most recently
    dated onsite-support draw, a date's trip being posted at the close of that date and before any later date's visit is
    drawn, so no earlier date is left waiting for its trip. When the block's ledger carries no onsite-support draw, or it
    already carries a travel entry dated that date, no travel entry is figured. A date's travel entry is figured only after
    the block's hours ledger carries the onsite-support draws of that date's visits, the resolved visit's own draw among
    them. A travel entry draws the onsite_trip_hours of the block's size for the date's trip, with no ratio applied, rounded
    half up to draw_rounding_hours. A block whose size carries onsite_trip_hours of zero draws no travel, its trip being
    zero hours whatever the schedules below select, and a travel figure of zero means no travel entry is drawn for the date.
    The figures the travel schedules below select replace the standard trip or multiply it, with no order between the multipliers,
    and the product is rounded half up to draw_rounding_hours once, at the end. Travel trip-value schedule: for a client
    whose active ClearPath agreement charges an onsite trip charge of zero, the trip is zero hours, the agreement covering
    the travel; for a client whose active ClearPath agreement charges a trip charge above zero, the trip is that trip charge
    divided by the block's hourly_rate_usd, rounded half up to draw_rounding_hours, so that the block bears the agreement's
    own trip price; for a client without an active ClearPath agreement the trip stays onsite_trip_hours. Travel dispatch
    schedule: the travel hours of a date whose onsite-support draws include one recorded in the emergency band are multiplied
    by emergency_multiplier; those of a date whose draws include none in the emergency band but one in the after_hours or
    holiday band, by after_hours_multiplier; those of a date whose draws are all in the business_hours band, by 1. Travel
    level schedule: the travel hours of a date whose onsite-support draws include one at the architect level are multiplied
    by architect_ratio, travel time being drawn at the rate of the most senior person who travels; those of a date whose
    draws include none at the architect level but one at the senior_engineer level, by senior_engineer_ratio; those of any
    other date, by 1. Travel dispatch lead schedule: the travel hours of a date whose trip ticket, the ticket the trip is
    booked to, was opened that same day are multiplied by same_day_rate, a same-day dispatch; those of a date whose trip
    ticket was opened the day before, by next_day_rate, a next-day dispatch; those of any other date, by 1. The travel entry
    is recorded in the band whose multiplier the dispatch schedule applied: emergency for emergency_multiplier, after_hours
    for after_hours_multiplier, and business_hours for a multiplier of 1.
  prerequisite:
  - problem: timebank_ext_service_visit_draw
    kind: value_input
    gate: tv_visit_date
    form: state
    policy_source: >-
      A date's travel entry is figured only after the block's hours ledger carries the onsite-support draws of that date's
      visits, the resolved visit's own draw among them.
    condition: >-
      The block's hours ledger carries the onsite_support draw of the client's latest onsite resolution routed to the block,
      dated that resolution's date, so that date is the block's most recent onsite date and its trip is figured from that
      date's draws.
    resolved_by: post_service_visit_draw_abd20ee9
    effect: >-
      The visit's own draw makes its date the onsite date figured and supplies the band, level and trip ticket the travel
      schedules read.
  cross_category:
  - managed
  compute:
  - tv_visit_date: >-
      LATEST('timebank_hours_ledger', 'entry_date', date_field='entry_date', event_type='timebank_hours_drawn', work_type='onsite_support')
  - tv_top_minutes: >-
      MAX('timebank_hours_ledger', 'worked_minutes', event_type='timebank_hours_drawn', work_type='onsite_support', entry_date=tv_visit_date)
  - tv_ticket: >-
      LATEST('timebank_hours_ledger', 'ticket_number', date_field='ticket_number', event_type='timebank_hours_drawn', work_type='onsite_support',
      entry_date=tv_visit_date, worked_minutes=int(tv_top_minutes))
  - tv_travel_n: >-
      COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='travel', entry_date=tv_visit_date)
  - cp_status: CFIELD('managed', 'status', status='active')
  - tv_trip_charge: CPARAM('managed', 'onsite_trip_charge_usd', status='active')
  - tv_trip: >-
      0 if (cp_status == 'active' and tv_trip_charge == 0) else (RND(tv_trip_charge / P('hourly_rate_usd'), 2) if cp_status
      == 'active' else P('onsite_trip_hours'))
  - tv_emerg_n: >-
      COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='onsite_support', entry_date=tv_visit_date,
      time_band='emergency')
  - tv_after_n: >-
      COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='onsite_support', entry_date=tv_visit_date,
      time_band='after_hours') + COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='onsite_support',
      entry_date=tv_visit_date, time_band='holiday')
  - tv_dispatch: >-
      P('emergency_multiplier') if tv_emerg_n >= 1 else (P('after_hours_multiplier') if tv_after_n >= 1 else 1)
  - tv_arch_n: >-
      COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='onsite_support', entry_date=tv_visit_date,
      resource_level='architect')
  - tv_senior_n: >-
      COUNT('timebank_hours_ledger', event_type='timebank_hours_drawn', work_type='onsite_support', entry_date=tv_visit_date,
      resource_level='senior_engineer')
  - tv_level_ratio: P('architect_ratio') if tv_arch_n >= 1 else (P('senior_engineer_ratio') if tv_senior_n >= 1 else 1)
  - tv_opened_at: >-
      XLATEST('managed', 'managed_tickets', 'event_at', date_field='event_at', event_type='managed_ticket_opened', ticket_number=tv_ticket)
  - tv_lead_days: DAYS(tv_opened_at, tv_visit_date) if (tv_opened_at != None and tv_visit_date != None) else 99
  - tv_lead_rate: K('same_day_rate') if tv_lead_days == 0 else (K('next_day_rate') if tv_lead_days == 1 else 1)
  - result: >-
      RND(P('onsite_trip_hours') and tv_trip * tv_dispatch * tv_level_ratio * tv_lead_rate, 2) if (tv_visit_date != None
      and tv_ticket != None and tv_travel_n == 0) else 0
  compute_basis:
    tv_visit_date: >-
      Trips are figured one date at a time: the date figured is the date of the block's most recently dated onsite-support
      draw, a date's trip being posted at the close of that date and before any later date's visit is drawn, so no earlier
      date is left waiting for its trip.
    tv_top_minutes: >-
      For travel to the client's site drawn from a block, and only for travel, the travel is figured under the travel schedules
      below rather than as a flat onsite_trip_hours at the business hours band for each visit: the block draws one trip
      per onsite date, however many onsite visits carry that date and whether or not their tickets are resolved, dated that
      date and booked to the ticket of that date's onsite-support draw recording the most worked minutes, the higher ticket
      number ending a tie; a remote session, a service visit, an installation visit and a project time line keep their own
      rules, and every draw that is not a travel entry keeps its own rule.
    tv_ticket: >-
      For travel to the client's site drawn from a block, and only for travel, the travel is figured under the travel schedules
      below rather than as a flat onsite_trip_hours at the business hours band for each visit: the block draws one trip
      per onsite date, however many onsite visits carry that date and whether or not their tickets are resolved, dated that
      date and booked to the ticket of that date's onsite-support draw recording the most worked minutes, the higher ticket
      number ending a tie; a remote session, a service visit, an installation visit and a project time line keep their own
      rules, and every draw that is not a travel entry keeps its own rule.
    tv_travel_n: >-
      When the block's ledger carries no onsite-support draw, or it already carries a travel entry dated that date, no travel
      entry is figured.
    cp_status: >-
      Travel trip-value schedule: for a client whose active ClearPath agreement charges an onsite trip charge of zero, the
      trip is zero hours, the agreement covering the travel; for a client whose active ClearPath agreement charges a trip
      charge above zero, the trip is that trip charge divided by the block's hourly_rate_usd, rounded half up to draw_rounding_hours,
      so that the block bears the agreement's own trip price; for a client without an active ClearPath agreement the trip
      stays onsite_trip_hours.
    tv_trip_charge: >-
      Travel trip-value schedule: for a client whose active ClearPath agreement charges an onsite trip charge of zero, the
      trip is zero hours, the agreement covering the travel; for a client whose active ClearPath agreement charges a trip
      charge above zero, the trip is that trip charge divided by the block's hourly_rate_usd, rounded half up to draw_rounding_hours,
      so that the block bears the agreement's own trip price; for a client without an active ClearPath agreement the trip
      stays onsite_trip_hours.
    tv_trip: >-
      Travel trip-value schedule: for a client whose active ClearPath agreement charges an onsite trip charge of zero, the
      trip is zero hours, the agreement covering the travel; for a client whose active ClearPath agreement charges a trip
      charge above zero, the trip is that trip charge divided by the block's hourly_rate_usd, rounded half up to draw_rounding_hours,
      so that the block bears the agreement's own trip price; for a client without an active ClearPath agreement the trip
      stays onsite_trip_hours.
    tv_emerg_n: >-
      Travel dispatch schedule: the travel hours of a date whose onsite-support draws include one recorded in the emergency
      band are multiplied by emergency_multiplier; those of a date whose draws include none in the emergency band but one
      in the after_hours or holiday band, by after_hours_multiplier; those of a date whose draws are all in the business_hours
