# Policy charter: TimeBank Prepaid Service Hours (prepaid blocks of professional services hours).
category: timebank
display_name: TimeBank Prepaid Service Hours

binding:
  holding_table: timebank_blocks
  event_tables: [timebank_hours_ledger, timebank_billing]
  intake_tables: [timebank_orders]
  status_field: status
  variant_field: variant_name
  quantity_fields: {hours_balance: hours, balance_due_usd: receivable}

lifecycle:
  states: [pending_payment, active, depleted, expired, cancelled]
  transitions:
    - {from: pending_payment, to: active, by: agent, means: "The block is activated on its activation basis (full payment, or signature for blocks sold on terms) and its hours are granted."}
    - {from: pending_payment, to: cancelled, by: user, means: "The client cancels a block order before it is activated."}
    - {from: active, to: depleted, by: system, means: "The block's hour balance reaches zero."}
    - {from: depleted, to: active, by: agent, means: "A draw reversal restores hours to a depleted block before its expiry date."}
    - {from: active, to: expired, by: system, means: "The block passes its expiry date with hours left, which are forfeited."}
    - {from: active, to: expired, by: agent, means: "The block's remaining hours are rolled into a newly activated block and the rest forfeited, retiring the block before its expiry date."}

accounts:
  - key: hours
    unit: hours
    meaning: Prepaid service hours remaining on the block.
  - key: receivable
    unit: USD
    meaning: Amount the client owes on the block; charges increase it and payments and credits reduce it.


# ---- category-level parameter dictionary ----
parameter_schema:
  block_hours: Service hours granted by the block (hours)
  hourly_rate_usd: Effective prepaid rate per block hour (USD per hour)
  block_list_price_usd: List price of the block before any discount, block_hours times hourly_rate_usd (USD)
  clearpath_discount_pct: Discount off block_list_price_usd when the client holds an active ClearPath agreement at or above clearpath_discount_min_rank on the order date (percent)
  clearpath_discount_min_rank: Lowest ClearPath tier rank that qualifies for the block discount (rank 1-6)
  activation_basis: What activates the block (enum full_payment / signature)
  invoice_due_days: Calendar days after the block invoice posted date by which payment is due (integer days; 0 means due on receipt)
  validity_months: Months from activation during which hours may be drawn (integer months)
  extension_allowed: Whether the expiry date may be extended for a fee (switch)
  extension_months: Months added to the expiry date by one extension (integer months)
  extension_fee_pct: Extension fee as a percent of the remaining hours valued at hourly_rate_usd (percent)
  max_extensions_per_block: Most extensions one block may receive (integer)
  rollover_allowed: Whether unused hours may roll into a new block bought before expiry (switch)
  rollover_cap_pct: Most hours that may roll over, as a percent of the expiring block's block_hours (percent)
  rollover_purchase_window_days: Days before the expiring block's expiry date from which a new block qualifies to receive its rollover (integer days)
  rollover_requires_same_or_larger_block: Whether the receiving block must be the same size or larger than the expiring block (switch)
  low_balance_alert_pct: Balance, as a percent of block_hours, at or below which a low-balance notice is sent and auto-replenish fires (percent)
  auto_replenish_available: Whether the block may be set to auto-replenish (switch)
  business_hours_days: Days of the week that count as TimeBank business hours (day range)
  business_hours_start: Start of TimeBank business hours, US Eastern (HH:MM)
  business_hours_end: End of TimeBank business hours, US Eastern (HH:MM)
  observed_holiday_list: Holidays on which all work is drawn at holiday_multiplier (list)
  billing_increment_minutes: Increment worked minutes are rounded up to before conversion (integer minutes)
  minimum_draw_minutes_remote: Minimum minutes drawn per remote work session (integer minutes)
  minimum_draw_minutes_onsite: Minimum minutes drawn per onsite visit (integer minutes)
  onsite_trip_hours: Block hours drawn as travel for each onsite visit (hours per visit)
  after_hours_multiplier: Block hours drawn per worked hour outside business hours on a business day (factor)
  emergency_multiplier: Block hours drawn per worked hour on emergency work dispatched outside business hours at the client's request (factor)
  holiday_multiplier: Block hours drawn per worked hour on weekends and observed holidays (factor)
  senior_engineer_ratio: Block hours drawn per worked hour by a senior engineer (factor)
  architect_ratio: Block hours drawn per worked hour by a solutions architect (factor)
  technician_ratio: Block hours drawn per worked hour by a technician (factor)
  project_work_eligible: Whether time-and-materials project work may be drawn from the block (switch)
  eligible_work_types: Kinds of work that may be drawn from the block (list of work_type values)
  overage_hourly_rate_usd: Rate per block hour for work beyond every available balance (USD per hour)
  overage_cap_hours_monthly: Block hours of overage per calendar month beyond which further non-emergency work needs the authorized contact's written approval (hours)
  dispute_window_days: Calendar days after a draw's entry date within which the client may dispute it (integer days)
  hours_statement_cadence: How often an hours statement is emailed to the authorized contact (enum monthly / weekly)
  priority_scheduling: Whether block work is scheduled ahead of uncommitted time-and-materials requests (switch)
  named_engineer: Whether a named engineer is assigned to block work (switch)
  refundable_unused_hours: Whether unused hours are refundable or convertible to credit (switch)
  late_fee_pct_monthly: Monthly late fee on an unpaid block invoice past the grace period (percent)
  late_fee_grace_days: Calendar days after the due date before a late fee is assessed (integer days)
  late_fee_minimum_usd: Minimum late fee per invoice per month (USD)
  draw_hold_days_past_due: Days an invoice of a signature-activated block may be past due before draws are put on hold (integer days)
  card_payment_max_usd: Largest invoice that may be paid by card (USD)
  draw_rounding_hours: Precision converted block hours are rounded half up to (hours)
  auto_replenish_max_per_block: Most auto-replenishment orders a single block may trigger (integer)
  rolled_hours_roll_again: Whether hours that already rolled over may roll over a second time (switch)

