    tv_arch_n: >-
      Travel level schedule: the travel hours of a date whose onsite-support draws include one at the architect level are
      multiplied by architect_ratio, travel time being drawn at the rate of the most senior person who travels; those of
      a date whose draws include none at the architect level but one at the senior_engineer level, by senior_engineer_ratio;
      those of any other date, by 1.
    tv_senior_n: >-
      Travel level schedule: the travel hours of a date whose onsite-support draws include one at the architect level are
