  - in_opened_at: >-
      XLATEST('managed', 'managed_tickets', 'event_at', date_field='event_at', event_type='managed_ticket_opened', ticket_number=in_ticket)
  - in_billable: >-
      XLATEST('managed', 'managed_tickets', 'billable_minutes', date_field='event_at', event_type='managed_ticket_resolved',
      ticket_number=in_ticket) or 0
  - in_billable_basis: >-
      MX(int((in_billable + P('billing_increment_minutes') - 1) // P('billing_increment_minutes')) * P('billing_increment_minutes'),
      P('minimum_draw_minutes_onsite'))
  - hw_delivered: >-
      XLATEST('hardware', 'hardware_orders', 'delivered_date', date_field='delivered_date', status='delivered')
  - hw_units: XMAX('hardware', 'hardware_orders', 'quantity', status='delivered', delivered_date=hw_delivered)
  - hw_type: >-
      XLATEST('hardware', 'hardware_orders', 'variant_name', date_field='quote_number', status='delivered', delivered_date=hw_delivered,
      quantity=int(hw_units))
  - in_is_install: >-
      XLATEST('managed', 'managed_tickets', 'issue_category', date_field='event_at', event_type='managed_ticket_opened',
      ticket_number=in_ticket) == 'service_request' and hw_delivered != None and in_opened_at != None and DAYS(hw_delivered,
      in_opened_at) >= 0 and DAYS(hw_delivered, in_opened_at) <= K('install_window_days')
  - in_endpoint_install: in_is_install and (hw_type == 'Staged Endpoint Order' or hw_type == 'Standard Endpoint Order')
  - in_minutes: >-
      XMAX('hardware', 'hardware_orders', 'quantity', status='delivered', delivered_date=hw_delivered) * K('staged_minutes_per_unit')
      if (in_is_install and hw_type == 'Staged Endpoint Order') else (MX(in_billable_basis, XMAX('hardware', 'hardware_orders',
      'quantity', status='delivered', delivered_date=hw_delivered) * K('standard_minutes_per_unit')) if (in_is_install and
      hw_type == 'Standard Endpoint Order') else in_billable_basis)
  - in_weekday: DAYS('2023-01-01', in_at) % 7 if in_at != None else 3
  - in_band: >-
      P('holiday_multiplier') if (in_weekday == 0 or in_weekday == 6) else (P('after_hours_multiplier') if in_class == 'onsite_after_hours'
      else 1)
  - in_ratio: >-
      P('architect_ratio') if (in_is_install and XMAX('hardware', 'hardware_orders', 'quantity', status='delivered', delivered_date=hw_delivered)
      >= K('architect_units')) else (P('senior_engineer_ratio') if (in_is_install and XMAX('hardware', 'hardware_orders',
      'quantity', status='delivered', delivered_date=hw_delivered) >= K('senior_units')) else P('technician_ratio'))
  - cp_status: CFIELD('managed', 'status', status='active')
  - in_cp_tier: CFIELD('managed', 'variant_name', status='active')
  - in_cp_rate: >-
      K('cp_install_premier') if (cp_status == 'active' and (in_cp_tier == 'ClearPath Premier' or in_cp_tier == 'ClearPath
      Enterprise') and in_endpoint_install) else (K('cp_install_standard') if (cp_status == 'active' and (in_cp_tier ==
      'ClearPath Professional' or in_cp_tier == 'ClearPath Standard') and in_endpoint_install) else 1)
  - in_rush: >-
      XLATEST('hardware', 'hardware_orders', 'rush_requested', date_field='quote_number', status='delivered', delivered_date=hw_delivered,
      quantity=int(hw_units))
  - in_rush_rate: >-
      K('rush_same_day_rate') if (in_is_install and in_rush == True and DAYS(hw_delivered, in_at) == 0) else (K('rush_next_rate')
      if (in_is_install and in_rush == True and DAYS(hw_delivered, in_at) >= 1 and DAYS(hw_delivered, in_at) <= K('rush_install_days'))
      else 1)
  - result: >-
      RND(in_minutes / 60 * in_band * in_ratio * in_cp_rate * in_rush_rate, 2) if (in_ticket != None and in_is_install and
      in_done == 0) else 0
  compute_basis:
