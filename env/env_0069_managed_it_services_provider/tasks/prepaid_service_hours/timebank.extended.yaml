- id: timebank_ext_install_visit_draw
  base_policy_refs:
  - timebank_agg_draw_order
  - timebank_draw_conversion
  overwrite:
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      Worked minutes are the recorded minutes rounded up to billing_increment_minutes and never less than minimum_draw_minutes_remote
      for a remote session or minimum_draw_minutes_onsite for an onsite visit.
    replaced_by: >-
      For every installation visit drawn from a block, and only for an installation visit, the minutes drawn are set by
      the installation minutes schedule below; a service visit, a remote session, a project time line and a travel entry
      keep their own minutes rules.
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      Converted block hours equal worked minutes divided by 60, times the resource ratio (technician_ratio, senior_engineer_ratio
      or architect_ratio), times the band multiplier (holiday_multiplier, emergency_multiplier or after_hours_multiplier,
      and 1 in business hours), rounded half up to draw_rounding_hours.
    replaced_by: >-
      For every installation visit drawn from a block, and only for an installation visit, the block hours are figured under
      the installation schedules below; a service visit, a remote session, a project time line and a travel entry are figured
      under their own schedules, and every other draw keeps the standard conversion: converted block hours equal worked
      minutes divided by 60, times the resource ratio (technician_ratio, senior_engineer_ratio or architect_ratio), times
      the band multiplier (holiday_multiplier, emergency_multiplier or after_hours_multiplier, and 1 in business hours),
      rounded half up to draw_rounding_hours.
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      The time band is holiday on weekends and observed holidays, emergency for work dispatched outside business hours at
      the client's request to restore a down system, after_hours for other work outside business_hours_start to business_hours_end
      on business days (business_hours_days, excluding the observed_holiday_list), and business_hours otherwise; only one
      band applies to a session, in that order of precedence.
    replaced_by: >-
      For every installation visit drawn from a block, and only for an installation visit, the band is read from the service
      desk's resolution of the visit's ticket: holiday when the resolution falls on a Saturday or Sunday, after_hours for
      a weekday visit the desk resolved in the onsite after-hours class, and business_hours otherwise, an installation being
      scheduled work and never an emergency, and a weekday observed holiday taking the band the resolution's class gives;
      a service visit, a remote session, a project time line and a travel entry take their bands from their own rules, and
      every other draw keeps the standard time band: holiday on weekends and observed holidays, emergency for work dispatched
      outside business hours at the client's request to restore a down system, after_hours for other work outside business_hours_start
      to business_hours_end on business days (business_hours_days, excluding the observed_holiday_list), and business_hours
      otherwise; only one band applies to a session, in that order of precedence.
