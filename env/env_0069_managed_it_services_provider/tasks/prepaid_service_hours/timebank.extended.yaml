  rule: >-
    For every installation visit drawn from a block, and only for an installation visit, the minutes drawn are set by the
    installation minutes schedule below; a service visit, a remote session, a project time line and a travel entry keep
    their own minutes rules. For every installation visit drawn from a block, and only for an installation visit, the block
    hours are figured under the installation schedules below; a service visit, a remote session, a project time line and
    a travel entry are figured under their own schedules, and every other draw keeps the standard conversion: converted
    block hours equal worked minutes divided by 60, times the resource ratio (technician_ratio, senior_engineer_ratio or
    architect_ratio), times the band multiplier (holiday_multiplier, emergency_multiplier or after_hours_multiplier, and
    1 in business hours), rounded half up to draw_rounding_hours. For every installation visit drawn from a block, and only
    for an installation visit, the band is read from the service desk's resolution of the visit's ticket: holiday when the
    resolution falls on a Saturday or Sunday, after_hours for a weekday visit the desk resolved in the onsite after-hours
    class, and business_hours otherwise, an installation being scheduled work and never an emergency, and a weekday observed
    holiday taking the band the resolution's class gives; a service visit, a remote session, a project time line and a travel
    entry take their bands from their own rules, and every other draw keeps the standard time band: holiday on weekends
    and observed holidays, emergency for work dispatched outside business hours at the client's request to restore a down
    system, after_hours for other work outside business_hours_start to business_hours_end on business days (business_hours_days,
    excluding the observed_holiday_list), and business_hours otherwise; only one band applies to a session, in that order
    of precedence. A ticket's onsite labor is drawn once, when the service desk resolves the ticket, as one onsite-support
    draw dated the resolution's date for the minutes the resolution records. Every installation visit is priced by the schedules
    below from its own ticket's records and its order alone; the visit considered is the one on the client's ticket most
    recently resolved to the prepaid-block route with onsite labor, its date being that resolution's date. Resolutions are
    stamped to the minute; where a business-hours and an after-hours onsite resolution carry the same minute the after-hours
    one counts as more recent, where two onsite resolutions of one class carry the same minute the one with more billable
    minutes counts as more recent, and where they also record the same billable minutes the one on the higher ticket number
    counts as more recent; a ticket is resolved once, so the ticket number ends every tie. The visit is an installation
    visit when its ticket was opened in the service_request category on or after the delivered_date of the client's most
    recently delivered hardware order, meaning the latest delivered_date among the client's orders whose status is delivered,
    and no more than install_window_days calendar days after it, counting the delivery date as day 0. That order is the
    order the installation schedules below read; where two delivered orders carry that latest delivered_date, the one with
    more units is that order, and where they also carry the same units, the one with the higher quote_number, the quote
    number being unique to each order. A visit that is not an installation visit is a service visit and is drawn under the
    service-visit rule, not this one; when the client has no onsite resolution routed to the block, or the block's ledger
    already carries an onsite-support draw for that ticket, no installation visit is figured. An installation visit draws
    its billable minutes, rounded up to billing_increment_minutes and never fewer than minimum_draw_minutes_onsite, divided
    by 60, at technician_ratio and with a multiplier of 1, rounded half up to draw_rounding_hours. The figures the installation
    schedules below select replace the standard minutes, ratio and multiplier, and they multiply one another with no order
    between them; the product is rounded half up to draw_rounding_hours once, at the end. Installation minutes schedule:
    an installation visit for a Staged Endpoint Order is drawn at staged_minutes_per_unit minutes for each unit of the order,
    the units arriving imaged, whatever the ticket's billable minutes; an installation visit for a Standard Endpoint Order
    is drawn at the larger of its rounded billable minutes, with the onsite minimum, and standard_minutes_per_unit minutes
    for each unit, imaging being done on site; an installation visit for any other order type is drawn at its rounded billable
    minutes with the onsite minimum. Installation band schedule: the block hours of an installation visit resolved on a
    Saturday or Sunday are multiplied by holiday_multiplier; those of a weekday installation visit resolved in the onsite
    after-hours class, by after_hours_multiplier; those of a weekday business-hours installation visit, by 1. Installation
    lead schedule: the block hours of an installation visit for an order of at least architect_units units are figured at
    architect_ratio, a rollout of that size being led by a solutions architect; those of one for an order of at least senior_units
    and fewer than architect_units units, at senior_engineer_ratio; those of any other installation visit, at technician_ratio.
    The draw records that level. Installation ClearPath rate schedule: the block hours of an installation visit for a Staged
    Endpoint Order or Standard Endpoint Order of a client whose ClearPath agreement is active at ClearPath Premier or ClearPath
    Enterprise are multiplied by cp_install_premier; those of such a visit for a client whose ClearPath agreement is active
    at ClearPath Professional or ClearPath Standard, by cp_install_standard; those of any other installation visit, by 1.
    Installation rush schedule: the block hours of an installation visit for an order quoted with rush processing that the
    desk resolved on the order's delivered_date are multiplied by rush_same_day_rate; those of one for a rush order resolved
    one to rush_install_days calendar days after delivery, by rush_next_rate; those of any other installation visit, by
    1. The draw is recorded in the band its multiplier came from: holiday for the weekend multiplier, after_hours for the
    after-hours multiplier and business_hours otherwise.
  prerequisite: []
