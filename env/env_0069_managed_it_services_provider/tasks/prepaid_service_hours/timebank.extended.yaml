  overwrite:
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      Worked minutes are the recorded minutes rounded up to billing_increment_minutes and never less than minimum_draw_minutes_remote
      for a remote session or minimum_draw_minutes_onsite for an onsite visit.
    replaced_by: >-
      For a group of time-and-materials project time drawn from a block that is the TimeBank route of exactly one time-and-materials
      statement of work, meaning the client holds exactly one time-and-materials engagement whose status is signed, in_progress,
      on_hold or pending_acceptance, a group being the block-routed lines of that statement of work for one date and level,
      and only for such a group, the group is drawn for the summed logged minutes of its lines, which the statement of work
      already logs in billing_increment_minutes steps for every block size that may draw project work, adjusted only by
      the project minutes schedule below; the project time of a client holding no such engagement or two or more of them
      keeps, wholly and line by line, the standard minutes rule, its recorded minutes rounded up to billing_increment_minutes,
      and a remote session, a service visit, an installation visit and a travel entry keep their own minutes rules.
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      Converted block hours equal worked minutes divided by 60, times the resource ratio (technician_ratio, senior_engineer_ratio
      or architect_ratio), times the band multiplier (holiday_multiplier, emergency_multiplier or after_hours_multiplier,
      and 1 in business hours), rounded half up to draw_rounding_hours.
    replaced_by: >-
      For such a group, and only for such a group, the block hours are figured under the project-time schedules below; a
      remote session, a service visit, an installation visit and a travel entry are figured under their own schedules, and
      every other draw, the project time of a client holding no such engagement or two or more of them included, keeps the
      standard conversion: converted block hours equal worked minutes divided by 60, times the resource ratio (technician_ratio,
      senior_engineer_ratio or architect_ratio), times the band multiplier (holiday_multiplier, emergency_multiplier or
      after_hours_multiplier, and 1 in business hours), rounded half up to draw_rounding_hours.
  - base_policy: timebank_draw_conversion
    superseded_clause: >-
      The time band is holiday on weekends and observed holidays, emergency for work dispatched outside business hours at
      the client's request to restore a down system, after_hours for other work outside business_hours_start to business_hours_end
      on business days (business_hours_days, excluding the observed_holiday_list), and business_hours otherwise; only one
      band applies to a session, in that order of precedence.
    replaced_by: >-
      For such a group, and only for such a group, the band recorded is holiday for a group dated on a Saturday or Sunday,
      after_hours for a weekday group with minutes logged in the after_hours band, and business_hours otherwise, project
      work being scheduled and never an emergency, and a weekday observed holiday taking the band its lines are logged in;
      a remote session, a service visit, an installation visit and a travel entry take their bands from their own rules,
      and every other draw, the project time of a client holding no such engagement or two or more of them included, keeps
      the standard time band: holiday on weekends and observed holidays, emergency for work dispatched outside business
      hours at the client's request to restore a down system, after_hours for other work outside business_hours_start to
      business_hours_end on business days (business_hours_days, excluding the observed_holiday_list), and business_hours
      otherwise; only one band applies to a session, in that order of precedence.
