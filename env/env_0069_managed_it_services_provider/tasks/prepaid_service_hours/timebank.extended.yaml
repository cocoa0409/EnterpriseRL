    carry the same minute the after-hours one counts as more recent, where two onsite resolutions of one class carry the
    same minute the one with more billable minutes counts as more recent, and where they also record the same billable minutes
    the one on the higher ticket number counts as more recent; a ticket is resolved once, so the ticket number ends every
    tie. The visit is a service visit unless its ticket was opened in the service_request category on or after the delivered_date
