      the day before, by next_day_rate, a next-day dispatch; those of any other date, by 1.
    tv_lead_days: >-
      Travel dispatch lead schedule: the travel hours of a date whose trip ticket, the ticket the trip is booked to, was
      opened that same day are multiplied by same_day_rate, a same-day dispatch; those of a date whose trip ticket was opened
      the day before, by next_day_rate, a next-day dispatch; those of any other date, by 1.
    tv_lead_rate: >-
      Travel dispatch lead schedule: the travel hours of a date whose trip ticket, the ticket the trip is booked to, was
      opened that same day are multiplied by same_day_rate, a same-day dispatch; those of a date whose trip ticket was opened
      the day before, by next_day_rate, a next-day dispatch; those of any other date, by 1.
    result: >-
      The figures the travel schedules below select replace the standard trip or multiply it, with no order between the
      multipliers, and the product is rounded half up to draw_rounding_hours once, at the end.
  factors:
  - id: trip_value_basis
    effect: method
    decides: tv_trip
    bindings:
    - cp_status
    - tv_trip_charge
    - tv_trip
    ladder:
    - when: the client's ClearPath agreement is active AND its onsite trip charge is zero
      method: no trip (zero hours), the agreement covering travel
    - when: the client's ClearPath agreement is active AND its onsite trip charge is above zero
      method: the agreement's trip charge divided by the block's hourly_rate_usd (adds two inputs and a division)
    - when: otherwise
      method: the size's onsite_trip_hours
    baseline:
      tv_trip: P('onsite_trip_hours')
    evidence:
    - cross_category
    cross_difficulty: managed
  - id: dispatch_band_rate
    effect: parameter
    decides: tv_dispatch
    bindings:
    - tv_emerg_n
    - tv_after_n
    - tv_dispatch
    ladder:
    - when: the date's onsite-support draws include one recorded in the emergency band
      value: P('emergency_multiplier')
    - when: none is in the emergency band but one is in the after_hours or holiday band
      value: P('after_hours_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      tv_dispatch: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: travel_level_ratio
    effect: parameter
    decides: tv_level_ratio
    bindings:
    - tv_arch_n
    - tv_senior_n
    - tv_level_ratio
    ladder:
    - when: the date's onsite-support draws include one at the architect level
      value: P('architect_ratio')
    - when: none is at the architect level but one is at the senior_engineer level
      value: P('senior_engineer_ratio')
    - when: otherwise
      value: '1'
    baseline:
      tv_level_ratio: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: dispatch_lead_rate
    effect: parameter
    decides: tv_lead_rate
    bindings:
    - tv_opened_at
    - tv_lead_days
    - tv_lead_rate
    ladder:
    - when: the date's trip ticket was opened that same day
      value: K('same_day_rate')
    - when: the trip ticket was opened the day before
      value: K('next_day_rate')
    - when: otherwise
      value: '1'
    baseline:
      tv_lead_rate: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: managed
  baseline:
    rule: >-
      A travel entry draws the onsite_trip_hours of the block's size for the date's trip, with no ratio applied, rounded
      half up to draw_rounding_hours.
    params:
    - onsite_trip_hours
    - draw_rounding_hours
  inputs:
    history:
    - table: timebank_hours_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: timebank_hours_drawn
        work_type: onsite_support
    - table: timebank_hours_ledger
      aggregate: count
      field: hours
      filters:
        event_type: timebank_hours_drawn
        work_type: travel
    - category: managed
      table: managed_tickets
      aggregate: latest
      field: event_at
      filters:
        event_type: managed_ticket_opened
    cross_category:
    - managed
