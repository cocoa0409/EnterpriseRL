# Policy charter: Professional Services Projects delivered under statements of work (SOW).
category: project
display_name: Professional Services Projects

binding:
  holding_table: project_engagements
  event_tables: [project_billing, project_milestones, project_work_logs]
  intake_tables: [project_change_orders]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due_usd: receivable}

lifecycle:
  states: [proposed, signed, in_progress, on_hold, pending_acceptance, accepted, closed, cancelled, proposal_expired]
  transitions:
    - {from: proposed, to: signed, by: user, means: "The client's authorized contact signs the statement of work."}
    - {from: proposed, to: proposal_expired, by: system, means: "The statement of work lapses unsigned at the end of its validity period."}
    - {from: signed, to: in_progress, by: agent, means: "The project kicks off once the deposit is paid and the scheduled start date arrives."}
    - {from: signed, to: cancelled, by: user, means: "The client cancels the signed statement of work before kickoff."}
    - {from: in_progress, to: on_hold, by: agent, means: "Work is paused at the client's request, for an unmet client dependency, or for non-payment."}
    - {from: on_hold, to: in_progress, by: agent, means: "Work resumes after the cause of the hold is cleared."}
    - {from: on_hold, to: cancelled, by: user, means: "The client terminates the project while it is on hold."}
    - {from: in_progress, to: cancelled, by: user, means: "The client terminates the project for convenience after kickoff."}
    - {from: in_progress, to: pending_acceptance, by: agent, means: "Delivery is complete and acceptance is requested."}
    - {from: pending_acceptance, to: in_progress, by: user, means: "The client rejects acceptance citing documented defects against the statement of work."}
    - {from: pending_acceptance, to: accepted, by: user, means: "The client signs acceptance."}
    - {from: pending_acceptance, to: accepted, by: system, means: "The acceptance window closes without a signed rejection and the project is deemed accepted."}
    - {from: accepted, to: closed, by: system, means: "The warranty period ends and the engagement is closed."}

accounts:
  - key: receivable
    unit: USD
    meaning: Amount the client owes on the engagement; invoices increase it and payments and credit memos reduce it.


# ---- category-level parameter dictionary ----
parameter_schema:
  min_contract_value_usd: Lowest original contract value of the class (USD)
  max_contract_value_usd: Highest original contract value of the class (USD, or no_maximum)
  pricing_models_allowed: Pricing models the class may be signed under (list)
  sow_validity_days: Calendar days after issue within which the statement of work may be signed at its quoted price (integer days)
  deposit_pct: Deposit invoiced at signature as a percent of the original contract value (percent)
  milestone_pcts: Milestone invoices of a fixed-fee project, each as a percent of the contract value at milestone completion, in milestone order (list of percents)
  final_holdback_pct: Share of a fixed-fee contract value held back until acceptance (percent; the final invoice bills the remainder)
  kickoff_lead_business_days: Business days after the deposit is paid before the earliest possible kickoff (integer business days)
  technician_rate_usd: Time-and-materials hourly rate for a technician (USD per hour)
  senior_engineer_rate_usd: Time-and-materials hourly rate for a senior engineer (USD per hour)
  architect_rate_usd: Time-and-materials hourly rate for a solutions architect (USD per hour)
  after_hours_multiplier: Multiplier on the hourly rate for work in a scheduled after-hours window (factor)
  billing_increment_minutes: Increment logged minutes are rounded up to (integer minutes)
  minimum_onsite_hours: Minimum billable hours per onsite day on time-and-materials work (hours)
  clearpath_rate_discount_pct: Discount off time-and-materials rates for clients holding an active ClearPath agreement at or above clearpath_discount_min_rank at signature (percent)
  clearpath_discount_min_rank: Lowest ClearPath tier rank that earns the rate discount (rank 1-6)
  timebank_draw_allowed: Whether time-and-materials work may be drawn from an eligible prepaid TimeBank block (switch)
  nte_alert_pct: Share of the not-to-exceed amount consumed at which the client is notified (percent)
  nte_overrun_billable: Whether time-and-materials work beyond the not-to-exceed amount may be billed without a signed change order (switch)
  change_order_admin_fee_usd: Administration fee per signed scope or schedule change order (USD)
  change_order_fee_waiver_below_usd: Absolute value change below which no change order fee is charged (USD)
  max_cumulative_change_pct: Most the contract value may grow through change orders, as a percent of the original value, before a new statement of work is required (percent)
  change_order_signature_days: Calendar days a change order stays open for signature before it lapses (integer days)
  reschedule_notice_business_days: Business days of notice before the scheduled start at or beyond which the client may reschedule without a fee (integer business days)
  reschedule_fee_usd: Fee for a client reschedule with less notice than reschedule_notice_business_days (USD)
  cancellation_fee_pct_before_kickoff: Cancellation fee before kickoff as a percent of the contract value (percent)
  cancellation_fee_pct_after_kickoff: Cancellation fee after kickoff as a percent of the contract value not yet invoiced (percent)
  max_client_hold_days: Calendar days a client-caused hold may last before Stratton Bay may terminate or re-price (integer days)
  remobilization_threshold_days: Calendar days on hold after which resuming carries a remobilization fee (integer days)
  remobilization_fee_usd: Fee for resuming after a client-caused hold longer than remobilization_threshold_days (USD)
  acceptance_window_business_days: Business days after acceptance is requested within which the client must sign acceptance or a documented rejection, else acceptance is deemed (integer business days)
  max_acceptance_rejections: Documented rejections after which the dispute is escalated to the delivery director instead of another remediation cycle (integer)
  warranty_days: Calendar days after acceptance during which defects against the statement of work are fixed at no charge (integer days)
  expense_markup_pct: Markup on pass-through expenses other than mileage (percent)
  travel_included_radius_miles: Distance from the nearest Stratton Bay office within which travel is not billed (miles)
  mileage_rate_usd: Rate per mile for billable round-trip mileage beyond the included radius (USD per mile)
  expense_preapproval_above_usd: Single expense above which the authorized contact's written pre-approval is needed (USD)
  invoice_due_days: Net payment terms from the invoice posted date (integer days)
  late_fee_pct_monthly: Monthly late fee on an invoice's unpaid balance past the grace period (percent)
  late_fee_grace_days: Calendar days after the due date before a late fee is assessed (integer days)
  late_fee_minimum_usd: Minimum late fee per invoice per month (USD)
  work_stoppage_days_past_due: Days an engagement invoice may be past due before work is put on hold for non-payment (integer days)
  card_payment_max_usd: Largest invoice that may be paid by card (USD)
  dedicated_project_manager: Whether a named project manager runs the engagement (switch)
  status_report_cadence: How often written status reports are sent (enum at_completion / weekly)
  steering_committee_cadence: Executive steering meeting cadence (enum none / monthly / biweekly / weekly)
  deliverable_report_included: Whether a written findings report with remediation roadmap is a deliverable (switch)
  assessment_credit_pct: Share of an Assessment Engagement fee credited against an implementation statement of work signed within assessment_credit_days of its acceptance (percent)
  assessment_credit_days: Days after an assessment's acceptance within which its fee may be credited to a follow-on statement of work (integer days)
  observed_holiday_list: Company holidays excluded from business days (list of US holidays)

