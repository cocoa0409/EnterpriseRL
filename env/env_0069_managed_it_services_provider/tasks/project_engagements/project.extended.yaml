events:
  - type: project_sow_issued
    target: project_engagements
    mutation: create
    meaning: A statement of work is issued to the client for signature.
    grain: One engagement record per statement of work.
    fields: {customer_id: Client organisation., variant_name: Class from the original contract value., sow_number: SOW number., project_title: Title., pricing_model: fixed_fee or time_and_materials., original_value_usd: Quoted value or not-to-exceed amount., contract_value_usd: Equal to original_value_usd., rate_discount_pct: Discount locked for time-and-materials rates., issued_date: Issue date., scheduled_start_date: Proposed start., target_completion_date: Planned completion.}
    triggers: []
  - type: project_sow_signed
    target: project_engagements
    mutation: {transition: {from: proposed, to: signed}}
    meaning: The client signs the statement of work.
    grain: One transaction per engagement.
    fields: {signed_date: Signature date.}
    triggers:
      - event: project:project_deposit_invoice
        map: {}
  - type: project_proposal_expired
    target: project_engagements
    mutation: {transition: {from: proposed, to: proposal_expired}}
    meaning: The statement of work lapses unsigned.
    grain: One transaction per engagement.
    fields: {closed_date: Day after the validity period ended.}
    triggers: []
  - type: project_kickoff
    target: project_engagements
    mutation: {transition: {from: signed, to: in_progress}}
    meaning: Work starts.
    grain: One transaction per engagement.
    fields: {kickoff_date: Start date.}
    triggers: []
  - type: project_cancelled
    target: project_engagements
    mutation: {transition: [{from: signed, to: cancelled}, {from: in_progress, to: cancelled}, {from: on_hold, to: cancelled}]}
    meaning: The client's signed termination takes effect.
    grain: One transaction per engagement.
    fields: {cancellation_date: Effective date., closed_date: Equal to cancellation_date.}
    triggers: []
  - type: project_put_on_hold
    target: project_engagements
    mutation: {transition: {from: in_progress, to: on_hold}}
    meaning: Work is paused.
    grain: One transaction per hold.
    fields: {on_hold_date: Hold date., hold_reason: client_request / client_dependency / nonpayment.}
    triggers: []
  - type: project_resumed
    target: project_engagements
    mutation: {transition: {from: on_hold, to: in_progress}}
    meaning: Work resumes after a hold.
    grain: One transaction per resumption.
    fields: {resumed_date: Resume date., target_completion_date: Planned completion moved by the hold length.}
    triggers: []
  - type: project_acceptance_requested
    target: project_engagements
    mutation: {transition: {from: in_progress, to: pending_acceptance}}
    meaning: Delivery is complete and acceptance is requested.
    grain: One transaction per request.
    fields: {acceptance_requested_date: Request date.}
    triggers: []
  - type: project_acceptance_rejected
    target: project_engagements
    mutation: {transition: {from: pending_acceptance, to: in_progress}}
    meaning: The client signs a documented rejection and remediation starts.
    grain: One transaction per rejection.
    fields: {acceptance_rejection_count: Incremented.}
    triggers: []
  - type: project_accepted
    target: project_engagements
    mutation: {transition: {from: pending_acceptance, to: accepted}}
    meaning: The project is accepted by signature or deemed accepted.
    grain: One transaction per engagement.
    fields: {completion_date: Acceptance date., acceptance_basis: signed or deemed., warranty_end_date: Last day of the warranty.}
    triggers:
      - event: project:project_final_invoice
        map: {}
  - type: project_closed
    target: project_engagements
    mutation: {transition: {from: accepted, to: closed}}
    meaning: The warranty ends and the engagement closes.
    grain: One transaction per engagement.
    fields: {closed_date: Day after warranty_end_date.}
    triggers: []
  - type: project_change_order_applied
    target: project_engagements
    mutation: update
    meaning: A signed change order changes the contract value or schedule.
    grain: One transaction per signed change order.
    fields: {contract_value_usd: New contract value., target_completion_date: New planned completion., change_order_count: Incremented.}
    triggers:
      - event: project:project_change_order_fee
        map: {}
  - type: project_rescheduled
    target: project_engagements
    mutation: update
    meaning: The client moves the scheduled start before kickoff.
    grain: One transaction per reschedule.
    fields: {scheduled_start_date: New start date., target_completion_date: Planned completion shifted by the same number of days.}
    triggers: []
  - type: project_milestone_completed
    target: project_milestones
    meaning: The project manager records a milestone of the statement of work complete.
    grain: One row per milestone.
    distinguish_by: [milestone_number]
    fields: {milestone_number: Milestone position., milestone_name: Milestone name., completed_date: Completion date.}
    triggers:
      - event: project:project_milestone_invoice
        map: {milestone_number: milestone_number}
  - type: project_work_logged
    target: project_work_logs
    meaning: Time is logged against the statement of work.
    grain: One row per person-level per band per day.
    distinguish_by: [work_date, resource_level, time_band]
    fields: {sow_number: Statement of work., work_date: Date worked., resource_level: Level., time_band: Band., worked_minutes: Minutes after rounding., billing_route: fixed_fee_internal / invoice / timebank.}
    triggers:
      - event: timebank:timebank_hours_drawn
        when: {billing_route: timebank}
        map: {sow_number: sow_number}
  - type: project_deposit_invoice
    target: project_billing
    meaning: The deposit is invoiced at signature.
    grain: One row per engagement.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Deposit., invoice_number: Invoice., posted_date: Signature date., billing_period: Month of signature.}
    account: receivable
    direction: in
    triggers: []
  - type: project_milestone_invoice
    target: project_billing
    meaning: A fixed-fee milestone is invoiced on completion.
    grain: One row per milestone.
    distinguish_by: [milestone_number]
    fields: {milestone_number: Milestone billed., amount_usd: Amount., invoice_number: Invoice., posted_date: Posting date., billing_period: Month completed.}
    account: receivable
    direction: in
    triggers: []
  - type: project_tm_invoice
    target: project_billing
    meaning: Time-and-materials work of a calendar month is invoiced in arrears.
    grain: One row per engagement per work month.
    distinguish_by: [billing_period]
    fields: {billing_period: Work month., amount_usd: Amount., invoice_number: Invoice., posted_date: First day of the following month.}
    account: receivable
    direction: in
    triggers: []
  - type: project_final_invoice
    target: project_billing
    meaning: The remainder of a fixed-fee contract value is invoiced on acceptance.
    grain: One row per engagement.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Remainder., invoice_number: Invoice., posted_date: Acceptance date., billing_period: Month of acceptance.}
    account: receivable
    direction: in
    triggers: []
  - type: project_change_order_fee
    target: project_billing
    meaning: The change order administration fee is invoiced.
    grain: One row per change order.
    distinguish_by: [change_order_number]
    fields: {change_order_number: Change order., amount_usd: Fee., invoice_number: Invoice., posted_date: Posting date., billing_period: Month signed.}
    account: receivable
    direction: in
    triggers: []
  - type: project_expense_charge
    target: project_billing
    meaning: A pass-through expense is billed.
    grain: One row per receipt or mileage log.
    distinguish_by: [expense_reference]
    fields: {expense_reference: Receipt or log reference., expense_category: Category., amount_usd: Amount with markup., invoice_number: Invoice., posted_date: Posting date., billing_period: Month incurred.}
    account: receivable
    direction: in
    triggers: []
  - type: project_cancellation_fee
    target: project_billing
    meaning: The cancellation fee is invoiced when a termination takes effect.
    grain: One row per engagement.
    distinguish_by: [invoice_number]
    fields: {amount_usd: Fee., invoice_number: Invoice., posted_date: Cancellation date., billing_period: Month of cancellation.}
    account: receivable
    direction: in
    triggers: []
  - type: project_reschedule_fee
    target: project_billing
    meaning: A late-notice reschedule fee is invoiced.
    grain: One row per reschedule.
    distinguish_by: [posted_date]
    fields: {amount_usd: Fee., invoice_number: Invoice., posted_date: Reschedule date., billing_period: Month of reschedule.}
    account: receivable
    direction: in
    triggers: []
  - type: project_remobilization_fee
    target: project_billing
    meaning: A remobilization fee is invoiced when work resumes after a long client-caused hold.
    grain: One row per resumption.
    distinguish_by: [posted_date]
    fields: {amount_usd: Fee., invoice_number: Invoice., posted_date: Resume date., billing_period: Month resumed.}
    account: receivable
    direction: in
    triggers: []
  - type: project_assessment_credit
    target: project_billing
    meaning: An accepted assessment's fee is credited against a follow-on statement of work.
    grain: One row per assessment credited.
    distinguish_by: [source_engagement_id]
    fields: {source_engagement_id: Assessment credited., amount_usd: Credit., invoice_number: Follow-on invoice credited., posted_date: Posting date., billing_period: Month posted.}
    account: receivable
    direction: out
    triggers: []
  - type: project_payment
    target: project_billing
    meaning: A payment is applied to an invoice.
    grain: One row per remittance per invoice.
    distinguish_by: [payment_reference, invoice_number]
    fields: {payment_reference: Remittance reference., amount_usd: Amount applied., invoice_number: Invoice paid., posted_date: Date received.}
    account: receivable
    direction: out
    triggers: []
  - type: project_late_fee
    target: project_billing
    meaning: A late fee is assessed on a past-due invoice.
    grain: One row per invoice per month assessed.
    distinguish_by: [invoice_number, billing_period]
    fields: {invoice_number: Past-due invoice., billing_period: Month assessed., amount_usd: Fee., posted_date: Assessment date.}
    account: receivable
    direction: in
    triggers: []
  - type: project_credit_memo
    target: project_billing
    meaning: A credit memo reverses one specific charge in whole or part.
    grain: One row per charge reversed.
    distinguish_by: [original_billing_entry_id]
    fields: {original_billing_entry_id: Charge reversed., amount_usd: Amount., invoice_number: Invoice of the charge., posted_date: Posting date., billing_period: Month posted.}
    account: receivable
    direction: out
    triggers: []


measures:
  - id: project_msr_billed_to_date
    window: All billing entries of the engagement posted up to the decision.
    measure: Sum of amount_usd of project_deposit_invoice, project_milestone_invoice and project_tm_invoice rows of the engagement (labor and fee billings; expenses, fees for change orders, reschedules, remobilization and late payment excluded).
  - id: project_msr_tm_billed_to_date
    window: All billing entries of the engagement posted up to the decision.
    measure: Sum of amount_usd of project_tm_invoice rows of the engagement.
  - id: project_msr_client_past_due_days
    window: Point in time, across every engagement of the client.
    measure: The largest number of days any unpaid project invoice of the client is past its due date (posted_date plus that engagement class's invoice_due_days).

policies:
  - id: project_agg_multi_holding
    subject: [project_sow_issued]
    rule: >-
      A client may hold any number of engagements at once, each under its own statement of work, class, schedule and
      invoices; nothing is pooled between engagements except the client-standing rule of project_agg_client_standing and
      the assessment credit of project_assessment_credit_rules.
    eligibility: []
    params:
      max_per_customer: null

  - id: project_agg_client_standing
    subject: [project_kickoff, project_resumed]
    rule: >-
      Work on any engagement depends on the client's standing across all its engagements. A project may kick off or resume
      only while no engagement of the client has an invoice past due by more than that engagement's
      work_stoppage_days_past_due (project_msr_client_past_due_days). An engagement put on hold for non-payment resumes only
      once that condition holds again.
    eligibility:
      - id: client_in_good_standing
        applies_to: [project_kickoff, project_resumed]
        kind: authorization
        condition: A project may kick off or resume only while no engagement of the client has an invoice past due by more than that engagement's work_stoppage_days_past_due (project_msr_client_past_due_days).
        evidence_fields: [project_billing.customer_id, project_billing.invoice_number, project_billing.event_type, project_billing.amount_usd, project_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[project_billing.customer_id]]
          action_bindings: {project_billing.customer_id: customer_id}
    measures: [project_msr_client_past_due_days]

  - id: project_classification_and_pricing
    subject: [project_sow_issued, project_proposal_expired]
    rule: >-
      Every statement of work is classed by its original contract value between min_contract_value_usd and
      max_contract_value_usd; an assessment-only scope (discovery, security, network or cloud-readiness assessment with a
      findings report) is an Assessment Engagement, which is always fixed fee and includes the findings report
      (deliverable_report_included). The class is fixed at signature and never changes through change orders. A
      statement of work is priced fixed fee or time and materials as the class's pricing_models_allowed permit; a
      time-and-materials statement of work carries a not-to-exceed amount as its contract value. Its rate_discount_pct is
      clearpath_rate_discount_pct when, on the issue date, the client holds a ClearPath agreement whose status is active and
      whose tier rank is at least clearpath_discount_min_rank, and 0 otherwise. A statement of work not signed within
      sow_validity_days calendar days of its issue date lapses; work can then only be quoted on a new statement of work at
      current rates. A dedicated_project_manager, status_report_cadence and steering_committee_cadence are entitlements of
      the class.
    eligibility: []

  - id: project_signature_deposit_and_kickoff
    subject: [project_sow_signed, project_deposit_invoice, project_kickoff]
    rule: >-
      A statement of work may be signed only within sow_validity_days calendar days after it was issued. The validity
      period is counted in calendar days from issued_date, that date being day 0, and a signature on the last day is in
      time. On signature the deposit is invoiced: deposit_pct percent of original_value_usd, rounded half up to the cent.
      Business days are Monday through Friday excluding the observed_holiday_list. A project may kick off only after the
      deposit invoice is paid in full, no earlier than kickoff_lead_business_days business days after the day the deposit
      payment posted, and no earlier than scheduled_start_date. Kickoff happens on the
      later of those dates.
    eligibility:
      - id: signed_in_validity
        applies_to: [project_sow_signed]
        kind: time
        condition: A statement of work may be signed only within sow_validity_days calendar days after it was issued.
        evidence_fields: [project_engagements.project_engagement_id, project_engagements.issued_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[project_engagements.project_engagement_id]]
          action_bindings: {project_engagements.project_engagement_id: project_engagement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: it was issued
          anchor_source: project_engagements.issued_date
          relation: not_after
          duration_source: variants.sow_validity_days
          unit: calendar_days
          counting_rule: The validity period is counted in calendar days from issued_date, that date being day 0, and a signature on the last day is in time.
          boundary: inclusive
      - id: deposit_paid
        applies_to: [project_kickoff]
        kind: authorization
        condition: A project may kick off only after the deposit invoice is paid in full, no earlier than kickoff_lead_business_days business days after the day the deposit payment posted, and no earlier than scheduled_start_date.
        evidence_fields: [project_billing.project_engagement_id, project_billing.event_type, project_billing.invoice_number, project_billing.amount_usd, project_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[project_billing.project_engagement_id]]
          action_bindings: {project_billing.project_engagement_id: project_engagement_id}
    formula:
      amount_usd: round(deposit_pct / 100 * original_value_usd, 2)

  - id: project_assessment_credit_rules
    subject: [project_assessment_credit]
    rule: >-
      When a client signs an implementation statement of work after an Assessment Engagement of its own was accepted,
      assessment_credit_pct percent of the assessment's contract_value_usd is credited against the follow-on's deposit
      invoice, rounded half up to the cent and never more than that deposit. The follow-on must be signed within
      assessment_credit_days calendar days after the assessment was accepted. The period is counted in calendar days from
      the assessment's completion_date, that date being day 0. An assessment is credited at most once, to the first
      qualifying follow-on signed; a follow-on that is itself an Assessment Engagement earns no credit.
    eligibility:
      - id: follow_on_in_period
        applies_to: [project_assessment_credit]
        kind: time
        condition: The follow-on must be signed within assessment_credit_days calendar days after the assessment was accepted.
        evidence_fields: [project_engagements.project_engagement_id, project_engagements.completion_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[project_engagements.project_engagement_id]]
          action_bindings: {project_engagements.project_engagement_id: source_engagement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the assessment was accepted
          anchor_source: project_engagements.completion_date
          relation: not_after
          duration_source: variants.assessment_credit_days
          unit: calendar_days
          counting_rule: The period is counted in calendar days from the assessment's completion_date, that date being day 0.
          boundary: inclusive
      - id: credit_once
        applies_to: [project_assessment_credit]
        kind: dedup
        condition: An assessment is credited at most once, to the first qualifying follow-on signed; a follow-on that is itself an Assessment Engagement earns no credit.
        evidence_fields: [project_billing.source_engagement_id, project_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[project_billing.source_engagement_id]]
          action_bindings: {project_billing.source_engagement_id: source_engagement_id}
        dedup_contract:
          table: project_billing
          mode: separate_record
          object_bindings: {source_engagement_id: source_engagement_id}
          duplicate_filters: {event_type: [project_assessment_credit]}
          distinct_fields: []

  - id: project_fixed_fee_billing
    subject: [project_milestone_completed, project_milestone_invoice, project_final_invoice]
    rule: >-
      A fixed-fee engagement is billed by its deposit, by one invoice per milestone and by a final invoice. When a milestone
      is recorded complete, its invoice is milestone_pcts at that milestone's position times contract_value_usd at that
      moment, rounded half up to the cent. A milestone may be invoiced only while the engagement status is in_progress,
      on_hold or pending_acceptance. On acceptance the final invoice bills contract_value_usd minus everything already billed
      by deposit and milestone invoices (project_msr_billed_to_date), so that a fixed fee is billed exactly once in total;
      the holdback is final_holdback_pct percent of the contract value. A time-and-materials engagement has no milestone or
      final invoices; it is billed only by its deposit and its monthly time-and-materials invoices, and its deposit is
      applied against its last time-and-materials invoices. Time logged on a fixed-fee engagement is fixed_fee_internal and
      never billed.
    eligibility:
      - id: milestone_billable_status
        applies_to: [project_milestone_invoice]
        kind: state
        condition: A milestone may be invoiced only while the engagement status is in_progress, on_hold or pending_acceptance.
        evidence_fields: [project_engagements.project_engagement_id, project_engagements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[project_engagements.project_engagement_id]]
          action_bindings: {project_engagements.project_engagement_id: project_engagement_id}
        state_contract:
          field: project_engagements.status
          allowed: [in_progress, on_hold, pending_acceptance]
    measures: [project_msr_billed_to_date]
    params:
      per_tier:
        Assessment Engagement: {deposit_pct: =deposit_pct, milestones: =milestone_pcts, holdback_pct: =final_holdback_pct}
        Quick Start Project: {deposit_pct: =deposit_pct, milestones: =milestone_pcts, holdback_pct: =final_holdback_pct}
        Standard Project: {deposit_pct: =deposit_pct, milestones: =milestone_pcts, holdback_pct: =final_holdback_pct}
        Advanced Project: {deposit_pct: =deposit_pct, milestones: =milestone_pcts, holdback_pct: =final_holdback_pct}
        Major Project: {deposit_pct: =deposit_pct, milestones: =milestone_pcts, holdback_pct: =final_holdback_pct}
        Strategic Program: {deposit_pct: =deposit_pct, milestones: =milestone_pcts, holdback_pct: =final_holdback_pct}
    formula:
      amount_usd: round(contract_value_usd - project_msr_billed_to_date, 2)

  - id: project_tm_billing
    subject: [project_work_logged, project_tm_invoice]
    rule: >-
      Time-and-materials work is logged per person level, band and day with minutes rounded up to billing_increment_minutes,
      and an onsite day is never billed below minimum_onsite_hours. On the first day of each month the previous month's work
      is invoiced: worked minutes divided by 60 times technician_rate_usd, senior_engineer_rate_usd or architect_rate_usd,
      reduced by the engagement's rate_discount_pct, times after_hours_multiplier for scheduled after-hours work, rounded half
      up to the cent per log line and summed. Billing never takes time-and-materials billings
      (project_msr_tm_billed_to_date) above contract_value_usd, the not-to-exceed amount, because nte_overrun_billable is
      false: work beyond it needs a signed change order raising the amount, and the client is notified when billings reach
      nte_alert_pct percent of it. Where timebank_draw_allowed is true and the client holds a TimeBank block whose status is
      active and whose project_work_eligible is true, logged time is settled from the block (billing route timebank) under
      the TimeBank conversion rules instead of being invoiced, and only time beyond the block balance is invoiced.
    eligibility: []
    measures: [project_msr_tm_billed_to_date]
    formula:
      rate: architect_rate_usd if resource_level == "architect" else (senior_engineer_rate_usd if resource_level == "senior_engineer" else technician_rate_usd)
      multiplier: after_hours_multiplier if time_band == "after_hours" else 1
      line_amount: round(worked_minutes / 60 * rate * (1 - rate_discount_pct / 100) * multiplier, 2)

  - id: project_change_orders
    subject: [project_change_order_applied, project_change_order_fee]
    rule: >-
      Any change to scope, value or schedule takes effect only through a change order signed by the authorized contact. A
      change order may be applied only once the client has signed it. A change order not signed within
      change_order_signature_days calendar days lapses. A signed change order changes contract_value_usd by its value delta
      and moves target_completion_date as it states; a scope reduction can never take the contract value below what has
      already been billed. The change order administration fee is change_order_admin_fee_usd for each signed scope or
      schedule change, waived when the absolute value delta is below change_order_fee_waiver_below_usd (a pure schedule
      change with no value delta is charged the fee). The contract value may never exceed original_value_usd times one plus
      max_cumulative_change_pct divided by 100 through change orders; a change that would pass that limit needs a new
      statement of work. Change orders never re-class the engagement.
    eligibility:
      - id: change_order_signed
        applies_to: [project_change_order_applied]
        kind: authorization
        condition: A change order may be applied only once the client has signed it.
        evidence_fields: [project_change_orders.change_order_number, project_change_orders.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[project_change_orders.change_order_number]]
          action_bindings: {project_change_orders.change_order_number: change_order_number}
    formula:
      value_cap: original_value_usd * (1 + max_cumulative_change_pct / 100)
      amount_usd: change_order_admin_fee_usd

  - id: project_schedule_and_holds
    subject: [project_rescheduled, project_reschedule_fee, project_put_on_hold, project_resumed, project_remobilization_fee]
    rule: >-
      Before kickoff the client may move the scheduled start; a move requested at least reschedule_notice_business_days
      business days before the current scheduled_start_date is free, and a later one is charged reschedule_fee_usd. After
      kickoff, work is put on hold at the client's request, for an unmet client dependency, or when an invoice of the client
      is more than work_stoppage_days_past_due days past due. A client-caused hold (client_request, client_dependency or
      nonpayment) longer than max_client_hold_days lets Stratton Bay terminate the engagement as a client cancellation or
      re-price the remaining work by change order. On resumption, target_completion_date moves by the calendar days on hold,
      and when a client-caused hold lasted more than remobilization_threshold_days calendar days a remobilization fee of
      remobilization_fee_usd is invoiced.
    eligibility: []

  - id: project_acceptance_and_warranty
    subject: [project_acceptance_requested, project_acceptance_rejected, project_accepted, project_closed]
    rule: >-
      When delivery is complete the project manager requests acceptance against the statement of work's acceptance
      criteria. The client must sign acceptance, or sign a rejection listing defects against those criteria, within
      acceptance_window_business_days business days after the request; silence past that window is deemed acceptance on the
      day after the window closes. A rejection returns the project to remediation, and after max_acceptance_rejections
      rejections the dispute goes to the delivery director instead of another cycle. Acceptance starts a warranty of
      warranty_days calendar days during which defects against the statement of work are fixed at no charge; new
      requirements are change orders. The engagement closes the day after warranty_end_date.
    eligibility: []

  - id: project_cancellation
    subject: [project_cancelled, project_cancellation_fee, project_credit_memo]
    rule: >-
      A client ends an engagement only by a signed termination notice, effective on the day it is signed. Before kickoff
      the cancellation fee is cancellation_fee_pct_before_kickoff percent of contract_value_usd; after kickoff it is
      cancellation_fee_pct_after_kickoff percent of contract_value_usd minus everything already billed by deposit, milestone
      and time-and-materials invoices (project_msr_billed_to_date), and the work performed but not yet invoiced is billed as
      well (completed milestones not yet invoiced, and logged time-and-materials time). Each is rounded half up to the cent;
      a fee of zero is not posted. A paid deposit is applied to what the client owes on the engagement, and any paid amount
      above it is refunded by a credit memo against the deposit invoice. A charge is reversed by credit memo at most once.
      A termination by Stratton Bay after a hold longer than max_client_hold_days is treated as a client cancellation.
    eligibility:
      - id: one_reversal_per_charge
        applies_to: [project_credit_memo]
        kind: dedup
        condition: A charge is reversed by credit memo at most once.
        evidence_fields: [project_billing.original_billing_entry_id, project_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[project_billing.original_billing_entry_id]]
          action_bindings: {project_billing.original_billing_entry_id: original_billing_entry_id}
        dedup_contract:
          table: project_billing
          mode: separate_record
          object_bindings: {original_billing_entry_id: original_billing_entry_id}
          duplicate_filters: {event_type: [project_credit_memo]}
          distinct_fields: []
    measures: [project_msr_billed_to_date]
    formula:
      fee_before_kickoff: round(cancellation_fee_pct_before_kickoff / 100 * contract_value_usd, 2)
      fee_after_kickoff: round(cancellation_fee_pct_after_kickoff / 100 * (contract_value_usd - project_msr_billed_to_date), 2)

  - id: project_expenses
    subject: [project_expense_charge]
    rule: >-
      Travel within travel_included_radius_miles of the nearest Stratton Bay office is not billed. Beyond it, round-trip
      mileage is billed at mileage_rate_usd per mile without markup, and airfare, lodging, materials and shipping are billed
      at cost plus expense_markup_pct percent, rounded half up to the cent, each against its receipt or mileage log
      reference. A single expense above expense_preapproval_above_usd is billable only with the authorized contact's written
      pre-approval; without it the expense is absorbed. Each receipt or log is billed once.
    eligibility: []

  - id: project_billing_and_collections
    subject: [project_payment, project_late_fee]
    rule: >-
      Invoices fall due invoice_due_days calendar days after posting. A payment is applied to the invoice its remittance
      names, otherwise to the oldest open invoice of the engagement first, one entry per invoice applied; card payments are
      accepted only for an invoice whose total does not exceed card_payment_max_usd. On the first day of each calendar month
      every invoice still unpaid more than late_fee_grace_days calendar days after its due date is assessed one late fee of
      late_fee_pct_monthly percent of its unpaid balance, or late_fee_minimum_usd if greater, rounded half up to the cent.
    eligibility: []

  - id: project_client_signed_changes
    subject: [project_sow_signed, project_cancelled, project_accepted, project_acceptance_rejected, project_change_order_applied]
    rule: >-
      Signing a statement of work, change orders, termination notices, acceptance sign-off and acceptance rejections are the
      client's own commitments: the service desk registers each as a change request carrying the change order number, type,
      value delta and new target date, pending the authorized contact's e-signature, and never signs on the client's
      behalf. A contract change may be registered only for the client's authorized contact after identity verification has
      passed.
    eligibility:
      - id: verified_contact
        applies_to: [project_sow_signed, project_cancelled, project_accepted, project_acceptance_rejected, project_change_order_applied]
        kind: authorization
        condition: A contract change may be registered only for the client's authorized contact after identity verification has passed.
        evidence_fields: [identity_verifications.customer_id, identity_verifications.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[identity_verifications.customer_id]]
          action_bindings: {identity_verifications.customer_id: customer_id}

extended_policies:
  - id: project_ext_sow_signature_rate_lock
    base_policy_refs: [project_signature_deposit_and_kickoff, project_client_signed_changes, project_classification_and_pricing]
    overwrite:
      - base_policy: project_classification_and_pricing
        superseded_clause: >-
          Its rate_discount_pct is clearpath_rate_discount_pct when, on the issue date, the client holds a ClearPath
          agreement whose status is active and whose tier rank is at least clearpath_discount_min_rank, and 0 otherwise.
        replaced_by: >-
          Every statement of work carries from its issue date the rate discount figured on that date, which is clearpath_rate_discount_pct when, on the issue date, the client holds an active ClearPath agreement at or above clearpath_discount_min_rank and 0 otherwise; for a time-and-materials statement of work signed under this policy, and only for such a statement of work, that issue-date figure is provisional and the labor rate discount is locked on the signature date as this policy figures it, while a fixed-fee statement of work, and a time-and-materials statement of work that is not signed, keep the issue-date figure.
      - base_policy: project_client_signed_changes
        superseded_clause: >-
          the service desk registers each as a change request carrying the change order number, type, value delta and
          new target date, pending the authorized contact's e-signature, and never signs on the client's behalf.
        replaced_by: >-
          For the signature of every statement of work, fixed-fee or time-and-materials, and only for such a signature, no change request is registered: the authorized contact e-signs the issued statement of work itself, the service desk never signs on the client's behalf, and a fixed-fee statement of work signed this way keeps the rate discount figured on its issue date; change orders, termination notices, acceptance sign-offs and acceptance
          rejections are still registered by the service desk as change requests carrying the change order number, type, value delta and new target date, pending the authorized contact's e-signature, and the service desk never signs any of them on the client's behalf.
    trigger: on_request
    subject: [project_sow_signed]
    computes: rate_discount_pct
    target_tool: sign_statement_of_work_96bc6bf1
    params:
      premier_uplift_pct: 2.5
      term_36_pct: 1.0
      term_24_pct: 0.5
      seats_100_pct: 1.0
      seats_50_pct: 0.5
      tenure_3y_days: 1095
      tenure_2y_days: 730
      tenure_3y_pct: 1.0
      tenure_2y_pct: 0.5
      prepaid_full_hours: 80
      prepaid_full_pct: 1.5
    rule: >
      For the signature of every statement of work, fixed-fee or time-and-materials, and only for such a signature, no change request is registered: the authorized contact e-signs the issued statement of work itself, the service desk never signs on the client's behalf, and a fixed-fee statement of work signed this way keeps the rate discount figured on its issue date; change orders, termination notices, acceptance sign-offs and acceptance
      rejections are still registered by the service desk as change requests carrying the change order number, type, value delta and new target date, pending the authorized contact's e-signature, and the service desk never signs any of them on the client's behalf.
      Every statement of work carries from its issue date the rate discount figured on that date, which is clearpath_rate_discount_pct when, on the issue date, the client holds an active ClearPath agreement at or above clearpath_discount_min_rank and 0 otherwise; for a time-and-materials statement of work signed under this policy, and only for such a statement of work, that issue-date figure is provisional and the labor rate discount is locked on the signature date as this policy figures it, while a fixed-fee statement of work, and a time-and-materials statement of work that is not signed, keep the issue-date figure.
      A time-and-materials statement of work is signed at the class list rates (technician_rate_usd,
      senior_engineer_rate_usd and architect_rate_usd), and the standard rate discount locked at signature is 0.0 percent.
      The rate discount locked at signature is the sum of the discount components that apply, each figured on its own from
      the client's records as they stand on the signature date, rounded half up to one decimal place once the components are added; no component is figured
      on another component.
      The managed-services component of the rate discount locked at signature is clearpath_rate_discount_pct plus
      premier_uplift_pct for a client whose ClearPath agreement in active status is on the ClearPath Premier or ClearPath
      Enterprise tier, clearpath_rate_discount_pct for a client whose ClearPath agreement in active status is on the
      ClearPath Professional tier, and nothing for any other client, including one whose only ClearPath agreements are
      closed, cancelled, suspended, under notice or on a lower tier.
      The commitment component of the rate discount locked at signature is term_36_pct for a client whose active ClearPath
      agreement runs a 36-month term, term_24_pct for one whose active ClearPath agreement runs a 24-month term, and
      nothing for any other client.
      The seat-scale component of the rate discount locked at signature is seats_100_pct for a client whose active ClearPath
      agreement covers 100 or more seats, seats_50_pct for one covering 50 to 99 seats, and nothing for any other client.
      The tenure component of the rate discount locked at signature is tenure_3y_pct when tenure_3y_days or more calendar
      days have passed from the go-live date of the client's active ClearPath agreement to the signature date,
      tenure_2y_pct when tenure_2y_days to tenure_3y_days minus one calendar days have passed, and nothing when fewer have
      passed or the client holds no active ClearPath agreement.
      The prepaid-hours component of the rate discount locked at signature rests on the TimeBank hours granted to the client
      across all its TimeBank blocks in the twelve months before the signature date; a grant counts when fewer than twelve
      whole months separate its entry date from the signature date, a whole month being complete only on the same day
      number of a later month. A client granted prepaid_full_hours hours or more earns the flat prepaid_full_pct; a client
      granted fewer than prepaid_full_hours but more than zero hours earns prepaid_full_pct multiplied by its granted hours
      and divided by prepaid_full_hours, rounded down to one decimal place; a client granted no hours earns nothing.
    prerequisite: []
    cross_category:
      - category: managed
        as: branch
        reads: [status, variant_name, term_months, seat_count, go_live_date]
        note: The managed-services, commitment, seat-scale and tenure components are decided from the client's active ClearPath agreement.
      - category: timebank
        as: history
        reads: [timebank_hours_ledger.hours]
        note: The prepaid-hours component is decided from the TimeBank hours granted to the client in the last twelve months.
    compute:
      - cp_tier: "CFIELD('managed','variant_name', status='active')"
      - mgd_pct: "P('clearpath_rate_discount_pct') + K('premier_uplift_pct') if (cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise') else (P('clearpath_rate_discount_pct') if cp_tier == 'ClearPath Professional' else 0.0)"
      - cp_term: "CFIELD('managed','term_months', status='active')"
      - term_pct: "K('term_36_pct') if cp_term == 36 else (K('term_24_pct') if cp_term == 24 else 0.0)"
      - cp_seats: "CFIELD('managed','seat_count', status='active')"
      - seat_pct: "K('seats_100_pct') if cp_seats and cp_seats >= 100 else (K('seats_50_pct') if cp_seats and cp_seats >= 50 else 0.0)"
      - cp_golive: "CFIELD('managed','go_live_date', status='active')"
      - tenure_days: "DAYS(cp_golive, NOW) if cp_golive else 0"
      - tenure_pct: "K('tenure_3y_pct') if tenure_days >= K('tenure_3y_days') else (K('tenure_2y_pct') if tenure_days >= K('tenure_2y_days') else 0.0)"
      - tb_granted: "XSUM('timebank','timebank_hours_ledger','hours', within_months=12, date_field='entry_date', event_type='timebank_hours_granted')"
      - prepaid_pct: "K('prepaid_full_pct') if tb_granted >= K('prepaid_full_hours') else (int(K('prepaid_full_pct') * tb_granted / K('prepaid_full_hours') * 10) / 10 if tb_granted > 0 else 0.0)"
      - result: "RND(mgd_pct + term_pct + seat_pct + tenure_pct + prepaid_pct, 1)"
    compute_basis:
      cp_tier: "The managed-services component of the rate discount locked at signature is clearpath_rate_discount_pct plus premier_uplift_pct for a client whose ClearPath agreement in active status is on the ClearPath Premier or ClearPath Enterprise tier"
      mgd_pct: "The managed-services component of the rate discount locked at signature is clearpath_rate_discount_pct plus premier_uplift_pct for a client whose ClearPath agreement in active status is on the ClearPath Premier or ClearPath Enterprise tier, clearpath_rate_discount_pct for a client whose ClearPath agreement in active status is on the ClearPath Professional tier, and nothing for any other client, including one whose only ClearPath agreements are closed, cancelled, suspended, under notice or on a lower tier."
      cp_term: "The commitment component of the rate discount locked at signature is term_36_pct for a client whose active ClearPath agreement runs a 36-month term"
      term_pct: "The commitment component of the rate discount locked at signature is term_36_pct for a client whose active ClearPath agreement runs a 36-month term, term_24_pct for one whose active ClearPath agreement runs a 24-month term, and nothing for any other client."
      cp_seats: "The seat-scale component of the rate discount locked at signature is seats_100_pct for a client whose active ClearPath agreement covers 100 or more seats"
      seat_pct: "The seat-scale component of the rate discount locked at signature is seats_100_pct for a client whose active ClearPath agreement covers 100 or more seats, seats_50_pct for one covering 50 to 99 seats, and nothing for any other client."
      cp_golive: "The tenure component of the rate discount locked at signature is tenure_3y_pct when tenure_3y_days or more calendar days have passed from the go-live date of the client's active ClearPath agreement to the signature date"
      tenure_days: "tenure_2y_pct when tenure_2y_days to tenure_3y_days minus one calendar days have passed, and nothing when fewer have passed or the client holds no active ClearPath agreement."
      tenure_pct: "The tenure component of the rate discount locked at signature is tenure_3y_pct when tenure_3y_days or more calendar days have passed from the go-live date of the client's active ClearPath agreement to the signature date, tenure_2y_pct when tenure_2y_days to tenure_3y_days minus one calendar days have passed, and nothing when fewer have passed or the client holds no active ClearPath agreement."
      tb_granted: "The prepaid-hours component of the rate discount locked at signature rests on the TimeBank hours granted to the client across all its TimeBank blocks in the twelve months before the signature date; a grant counts when fewer than twelve whole months separate its entry date from the signature date, a whole month being complete only on the same day number of a later month."
      prepaid_pct: "A client granted prepaid_full_hours hours or more earns the flat prepaid_full_pct; a client granted fewer than prepaid_full_hours but more than zero hours earns prepaid_full_pct multiplied by its granted hours and divided by prepaid_full_hours, rounded down to one decimal place; a client granted no hours earns nothing."
      result: "The rate discount locked at signature is the sum of the discount components that apply, each figured on its own from the client's records as they stand on the signature date, rounded half up to one decimal place once the components are added; no component is figured on another component."
    factors:
      - id: managed_component
        effect: parameter
        decides: mgd_pct
        bindings: [cp_tier, mgd_pct]
        ladder:
          - when: "the client's ClearPath agreement in active status is on the ClearPath Premier or ClearPath Enterprise tier"
            value: "clearpath_rate_discount_pct plus premier_uplift_pct"
          - when: "the client's ClearPath agreement in active status is on the ClearPath Professional tier"
            value: "clearpath_rate_discount_pct"
          - when: "otherwise (no active ClearPath agreement, or one on a lower tier)"
            value: "nothing (0.0)"
        baseline:
          mgd_pct: "0.0"
        evidence: [cross_category, tier_param]
        cross_difficulty: managed
      - id: commitment_component
        effect: parameter
        decides: term_pct
        bindings: [cp_term, term_pct]
        ladder:
          - when: "the client's active ClearPath agreement runs a 36-month term"
            value: "term_36_pct"
          - when: "the client's active ClearPath agreement runs a 24-month term"
            value: "term_24_pct"
          - when: "otherwise"
            value: "nothing (0.0)"
        baseline:
          term_pct: "0.0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: seat_scale_component
        effect: parameter
        decides: seat_pct
        bindings: [cp_seats, seat_pct]
        ladder:
          - when: "the client's active ClearPath agreement covers 100 or more seats"
            value: "seats_100_pct"
          - when: "the client's active ClearPath agreement covers 50 to 99 seats"
            value: "seats_50_pct"
          - when: "otherwise"
            value: "nothing (0.0)"
        baseline:
          seat_pct: "0.0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: tenure_component
        effect: parameter
        decides: tenure_pct
        bindings: [cp_golive, tenure_days, tenure_pct]
        ladder:
          - when: "tenure_3y_days or more calendar days from the active ClearPath agreement's go-live date to the signature date"
            value: "tenure_3y_pct"
          - when: "tenure_2y_days to tenure_3y_days minus one calendar days"
            value: "tenure_2y_pct"
          - when: "otherwise, or no active ClearPath agreement"
            value: "nothing (0.0)"
        baseline:
          tenure_pct: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: managed
      - id: prepaid_hours_component
        effect: method
        decides: prepaid_pct
        bindings: [tb_granted, prepaid_pct]
        ladder:
          - when: "TimeBank hours granted to the client in the last twelve months total prepaid_full_hours or more"
            method: "a flat component of prepaid_full_pct, whatever the hours above the threshold"
          - when: "TimeBank hours granted in the last twelve months total more than zero but fewer than prepaid_full_hours"
            method: "a proportional component: prepaid_full_pct times granted hours divided by prepaid_full_hours, rounded down to one decimal place"
          - when: "no TimeBank hours granted in the last twelve months"
            method: "no component"
        baseline:
          prepaid_pct: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: timebank
    baseline:
      rule: >-
        A time-and-materials statement of work is signed at the class list rates (technician_rate_usd,
        senior_engineer_rate_usd and architect_rate_usd), and the standard rate discount locked at signature is 0.0
        percent.
      params: [technician_rate_usd, senior_engineer_rate_usd, architect_rate_usd]
    inputs:
      history:
        - {category: timebank, table: timebank_hours_ledger, aggregate: sum, field: hours, within_months: 12, filters: {event_type: timebank_hours_granted}}
      cross_category: [managed, timebank]

  - id: project_ext_signature_deposit
    base_policy_refs: [project_signature_deposit_and_kickoff, project_classification_and_pricing]
    overwrite:
      - base_policy: project_signature_deposit_and_kickoff
        superseded_clause: >-
          On signature the deposit is invoiced: deposit_pct percent of original_value_usd, rounded half up to the cent.
        replaced_by: >-
          On signature of a time-and-materials statement of work, and only of one, the deposit is invoiced as this policy
          figures it; the deposit of a fixed-fee statement of work remains deposit_pct percent of original_value_usd,
          rounded half up to the cent.
    trigger: state_due
    subject: [project_deposit_invoice]
    computes: amount_usd
    target_tool: post_deposit_invoice_06d795b1
    params:
      clean_off_pts: 10.0
      one_late_off_pts: 5.0
      hw_late_2_pts: 10.0
      hw_late_1_pts: 5.0
      rush_14_days: 14
      rush_30_days: 30
      rush_14_pts: 5.0
      rush_30_pts: 2.5
      ach_high_count: 6
      ach_mid_count: 3
      ach_high_pts: 5.0
      ach_mid_pts: 2.5
      exposure_full_pts: 5.0
      exposure_part_pts: 2.5
      long_days: 120
      long_window_days: 90
      short_days: 30
      min_deposit_pct: 5.0
    rule: >
      On signature of a time-and-materials statement of work, and only of one, the deposit is invoiced as this policy
      figures it; the deposit of a fixed-fee statement of work remains deposit_pct percent of original_value_usd, rounded
      half up to the cent.
      The deposit of a time-and-materials statement of work is fixed only after the engagement record carries the client's
      signature date and the rate discount locked at signature.
      The standard deposit of a time-and-materials statement of work is deposit_pct percent of its estimated fees, rounded
      half up to the cent, where the estimated fees are original_value_usd reduced by the rate discount locked at
      signature, that is original_value_usd multiplied by 100 minus rate_discount_pct and divided by 100.
      The adjustments below combine in one way only: percentage points are added to or taken from deposit_pct, the resulting deposit percentage, never below min_deposit_pct percent, is applied once to the deposit basis, which is the estimated fees unless an adjustment
      sets another basis, and the deposit is rounded half up to the cent only at the end.
      For a client whose ClearPath agreement in active status is on the ClearPath Professional, Premier or Enterprise tier
      and whose ClearPath billing shows no late fee posted in the twelve months before signature, clean_off_pts
      percentage points are taken off the deposit percentage; for a client on one of those tiers whose ClearPath billing
      shows exactly one late fee posted in those twelve months, one_late_off_pts points are taken off; for every other
      client no points are taken off.
      For a client whose Hardware Procurement billing shows two or more late fees posted in the twelve months before
      signature, hw_late_2_pts percentage points are added to the deposit percentage, hw_late_1_pts points for exactly one
      such late fee, and none for a client with no such late fee.
      When the scheduled start date is rush_14_days or fewer calendar days after the signature date, including a scheduled
      start date on or before the signature date, rush_14_pts percentage points are added to the deposit percentage,
      rush_30_pts points when it is more than rush_14_days but no more than rush_30_days calendar days after it, and none
      when it is later.
      For a client whose ClearPath billing shows ach_high_count or more payments received by ACH in the six months before
      signature, ach_high_pts percentage points are taken off the deposit percentage, ach_mid_pts points for one showing
      ach_mid_count or more but fewer than ach_high_count such payments, and none otherwise.
      When the balance due on the client's active ClearPath agreement is at least that agreement's monthly seat charge,
      seat_count multiplied by seat_rate_usd and rounded half up to the cent, exposure_full_pts percentage points are
      added to the deposit percentage, exposure_part_pts points when the balance due is above zero but below that charge,
      and none when nothing is due or the client holds no active ClearPath agreement.
      Where the planned duration of the engagement is the calendar days from scheduled_start_date to
      target_completion_date, an engagement planned to run long_days days or more has as its deposit basis its estimated
      fees multiplied by long_window_days and divided by its planned duration; an engagement planned to run fewer than
      short_days days has as its deposit basis the greater of its estimated fees and the class min_contract_value_usd;
      every other engagement has its estimated fees as its deposit basis.
      A late fee or payment counts toward a twelve-month or six-month window when fewer than twelve, or six, whole months
      separate its posted date from the signature date, which is the day the deposit is invoiced, a whole month being complete only on the same day number of a
      later month.
    prerequisite:
      - problem: project_ext_sow_signature_rate_lock
        kind: value_input
        gate: est_fees
        form: state
        policy_source: >-
          The deposit of a time-and-materials statement of work is fixed only after the engagement record carries the
          client's signature date and the rate discount locked at signature.
        condition: >-
          The engagement record carries a signature date and a rate_discount_pct holding the labor rate discount locked at
          signature rather than the provisional discount figured on the issue date.
        resolved_by: sign_statement_of_work_96bc6bf1
        effect: >-
          est_fees is figured on the rate discount locked at signature, so the deposit basis and the deposit move from
          the figures the provisional issue-date discount would give.
    cross_category:
      - category: managed
        as: history
        reads: [status, variant_name, balance_due_usd, seat_count, seat_rate_usd, managed_billing.event_type, managed_billing.payment_method]
        note: The client-standing, autopay and open-balance adjustments are decided from the client's active ClearPath agreement and its billing ledger.
      - category: hardware
        as: history
        reads: [hardware_billing.event_type]
        note: The hardware-exposure adjustment is decided from late fees on the client's Hardware Procurement billing.
    compute:
      - est_fees: "F('original_value_usd') * (100 - F('rate_discount_pct')) / 100"
      - cp_tier: "CFIELD('managed','variant_name', status='active')"
      - cp_late12: "XCOUNT('managed','managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')"
      - standing_off: "K('clean_off_pts') if ((cp_tier == 'ClearPath Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise') and cp_late12 == 0) else (K('one_late_off_pts') if ((cp_tier == 'ClearPath Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise') and cp_late12 == 1) else 0.0)"
      - hw_late12: "XCOUNT('hardware','hardware_billing', within_months=12, date_field='posted_date', event_type='hardware_late_fee')"
      - hw_pts: "K('hw_late_2_pts') if hw_late12 >= 2 else (K('hw_late_1_pts') if hw_late12 == 1 else 0.0)"
      - lead_days: "DAYS(F('signed_date'), F('scheduled_start_date')) if F('signed_date') else DAYS(NOW, F('scheduled_start_date'))"
      - rush_pts: "K('rush_14_pts') if lead_days <= K('rush_14_days') else (K('rush_30_pts') if lead_days <= K('rush_30_days') else 0.0)"
      - ach6: "XCOUNT('managed','managed_billing', within_months=6, date_field='posted_date', event_type='managed_payment', payment_method='ach')"
      - ach_pts: "K('ach_high_pts') if ach6 >= K('ach_high_count') else (K('ach_mid_pts') if ach6 >= K('ach_mid_count') else 0.0)"
      - cp_due: "CFIELD('managed','balance_due_usd', status='active')"
      - cp_monthly: "RND(CFIELD('managed','seat_count', status='active') * CFIELD('managed','seat_rate_usd', status='active'), 2) if cp_due != None else 0.0"
      - exp_pts: "K('exposure_full_pts') if cp_due != None and cp_due >= cp_monthly else (K('exposure_part_pts') if cp_due != None and cp_due > 0 else 0.0)"
      - dur: "DAYS(F('scheduled_start_date'), F('target_completion_date'))"
      - dep_basis: "est_fees * K('long_window_days') / dur if dur >= K('long_days') else (MX(est_fees, P('min_contract_value_usd')) if dur < K('short_days') else est_fees)"
      - result: "RND(MX(K('min_deposit_pct'), P('deposit_pct') - standing_off + hw_pts + rush_pts - ach_pts + exp_pts) * dep_basis / 100, 2)"
    compute_basis:
      est_fees: "the estimated fees are original_value_usd reduced by the rate discount locked at signature, that is original_value_usd multiplied by 100 minus rate_discount_pct and divided by 100."
      cp_tier: "For a client whose ClearPath agreement in active status is on the ClearPath Professional, Premier or Enterprise tier"
      cp_late12: "and whose ClearPath billing shows no late fee posted in the twelve months before signature"
      standing_off: "For a client whose ClearPath agreement in active status is on the ClearPath Professional, Premier or Enterprise tier and whose ClearPath billing shows no late fee posted in the twelve months before signature, clean_off_pts percentage points are taken off the deposit percentage; for a client on one of those tiers whose ClearPath billing shows exactly one late fee posted in those twelve months, one_late_off_pts points are taken off; for every other client no points are taken off."
      hw_late12: "For a client whose Hardware Procurement billing shows two or more late fees posted in the twelve months before signature"
      hw_pts: "For a client whose Hardware Procurement billing shows two or more late fees posted in the twelve months before signature, hw_late_2_pts percentage points are added to the deposit percentage, hw_late_1_pts points for exactly one such late fee, and none for a client with no such late fee."
      lead_days: "When the scheduled start date is rush_14_days or fewer calendar days after the signature date, including a scheduled start date on or before the signature date"
      rush_pts: "When the scheduled start date is rush_14_days or fewer calendar days after the signature date, including a scheduled start date on or before the signature date, rush_14_pts percentage points are added to the deposit percentage, rush_30_pts points when it is more than rush_14_days but no more than rush_30_days calendar days after it, and none when it is later."
      ach6: "For a client whose ClearPath billing shows ach_high_count or more payments received by ACH in the six months before signature"
      ach_pts: "For a client whose ClearPath billing shows ach_high_count or more payments received by ACH in the six months before signature, ach_high_pts percentage points are taken off the deposit percentage, ach_mid_pts points for one showing ach_mid_count or more but fewer than ach_high_count such payments, and none otherwise."
      cp_due: "When the balance due on the client's active ClearPath agreement is at least that agreement's monthly seat charge"
      cp_monthly: "that agreement's monthly seat charge, seat_count multiplied by seat_rate_usd and rounded half up to the cent"
      exp_pts: "When the balance due on the client's active ClearPath agreement is at least that agreement's monthly seat charge, seat_count multiplied by seat_rate_usd and rounded half up to the cent, exposure_full_pts percentage points are added to the deposit percentage, exposure_part_pts points when the balance due is above zero but below that charge, and none when nothing is due or the client holds no active ClearPath agreement."
      dur: "Where the planned duration of the engagement is the calendar days from scheduled_start_date to target_completion_date"
      dep_basis: "an engagement planned to run long_days days or more has as its deposit basis its estimated fees multiplied by long_window_days and divided by its planned duration; an engagement planned to run fewer than short_days days has as its deposit basis the greater of its estimated fees and the class min_contract_value_usd; every other engagement has its estimated fees as its deposit basis."
      result: "percentage points are added to or taken from deposit_pct, the resulting deposit percentage, never below min_deposit_pct percent, is applied once to the deposit basis, which is the estimated fees unless an adjustment sets another basis, and the deposit is rounded half up to the cent only at the end."
    factors:
      - id: client_standing
        effect: parameter
        decides: standing_off
        bindings: [cp_tier, cp_late12, standing_off]
        ladder:
          - when: "active ClearPath agreement on the Professional, Premier or Enterprise tier AND no ClearPath late fee posted in the twelve months before signature"
            value: "clean_off_pts taken off the deposit percentage"
          - when: "active ClearPath agreement on one of those tiers AND exactly one ClearPath late fee posted in those twelve months"
            value: "one_late_off_pts taken off the deposit percentage"
          - when: "otherwise"
            value: "no points"
        baseline:
          standing_off: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: managed
      - id: hardware_exposure
        effect: parameter
        decides: hw_pts
        bindings: [hw_late12, hw_pts]
        ladder:
          - when: "two or more Hardware Procurement late fees posted in the twelve months before signature"
            value: "hw_late_2_pts added to the deposit percentage"
          - when: "exactly one such late fee"
            value: "hw_late_1_pts added to the deposit percentage"
          - when: "otherwise"
            value: "no points"
        baseline:
          hw_pts: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: hardware
      - id: start_lead
        effect: parameter
        decides: rush_pts
        bindings: [lead_days, rush_pts]
        ladder:
          - when: "scheduled start rush_14_days or fewer calendar days after signature, or on or before the signature date"
            value: "rush_14_pts added to the deposit percentage"
          - when: "scheduled start more than rush_14_days but no more than rush_30_days calendar days after signature"
            value: "rush_30_pts added to the deposit percentage"
          - when: "otherwise"
            value: "no points"
        baseline:
          rush_pts: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: clearpath_autopay
        effect: parameter
        decides: ach_pts
        bindings: [ach6, ach_pts]
        ladder:
          - when: "ach_high_count or more ClearPath payments received by ACH in the six months before signature"
            value: "ach_high_pts taken off the deposit percentage"
          - when: "ach_mid_count or more but fewer than ach_high_count such payments"
            value: "ach_mid_pts taken off the deposit percentage"
          - when: "otherwise"
            value: "no points"
        baseline:
          ach_pts: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: managed
      - id: open_balance
        effect: parameter
        decides: exp_pts
        bindings: [cp_due, cp_monthly, exp_pts]
        ladder:
          - when: "balance due on the active ClearPath agreement at least its monthly seat charge"
            value: "exposure_full_pts added to the deposit percentage"
          - when: "balance due above zero but below the monthly seat charge"
            value: "exposure_part_pts added to the deposit percentage"
          - when: "otherwise, or no active ClearPath agreement"
            value: "no points"
        baseline:
          exp_pts: "0.0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: planned_duration
        effect: method
        decides: dep_basis
        bindings: [dur, dep_basis]
        ladder:
          - when: "planned duration long_days calendar days or more"
            method: "deposit basis = estimated fees x long_window_days / planned duration (the duration enters the formula)"
          - when: "planned duration fewer than short_days calendar days"
            method: "deposit basis = the greater of the estimated fees and min_contract_value_usd (a floor enters the formula)"
          - when: "otherwise"
            method: "deposit basis = the estimated fees"
        baseline:
          dep_basis: "est_fees"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard deposit of a time-and-materials statement of work is deposit_pct percent of its estimated fees,
        rounded half up to the cent, where the estimated fees are original_value_usd reduced by the rate discount locked at
        signature, that is original_value_usd multiplied by 100 minus rate_discount_pct and divided by 100.
      params: [deposit_pct]
    inputs:
      history:
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 12, filters: {event_type: managed_late_fee}}
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 6, filters: {event_type: managed_payment, payment_method: ach}}
        - {category: hardware, table: hardware_billing, aggregate: count, field: hardware_billing_entry_id, within_months: 12, filters: {event_type: hardware_late_fee}}
      cross_category: [managed, hardware]

  - id: project_ext_milestone_billing
    base_policy_refs: [project_fixed_fee_billing, project_change_orders]
    overwrite:
      - base_policy: project_fixed_fee_billing
        superseded_clause: >-
          When a milestone is recorded complete, its invoice is milestone_pcts at that milestone's position times
          contract_value_usd at that moment, rounded half up to the cent.
        replaced_by: >-
          A milestone of a fixed-fee engagement is still invoiced when it is recorded complete, but every such milestone invoice, which this policy figures, is figured as follows rather than as milestone_pcts at that milestone's position times contract_value_usd at the moment the milestone is recorded complete; no other fixed-fee billing is changed by this policy, and the final invoice on
          acceptance still bills contract_value_usd minus everything already billed, which releases every retainage.
    trigger: state_due
    subject: [project_milestone_invoice]
    computes: amount_usd
    target_tool: post_milestone_invoice_79b8c922
    params:
      rel_upper_pct: 5.0
      rel_lower_pct: 2.5
      cp_clean_pct: 2.5
      cp_one_pct: 1.0
      own_clean_pct: 2.5
      own_one_pct: 1.0
    rule: >
      A milestone of a fixed-fee engagement is still invoiced when it is recorded complete, but every such milestone invoice, which this policy figures, is figured as follows rather than as milestone_pcts at that milestone's position times contract_value_usd at the moment the milestone is recorded complete; no other fixed-fee billing is changed by this policy, and the final invoice on acceptance still
      bills contract_value_usd minus everything already billed, which releases every retainage.
      The milestone invoiced is the highest-numbered milestone recorded complete on the engagement; milestones are
      recorded complete in schedule order, so two completions recorded on the same day are invoiced in milestone-number
      order, the higher number last. An engagement with no milestone recorded complete has no milestone invoice.
      The standard milestone invoice is the milestone's schedule share of the engagement's contract_value_usd, which every
      signed change order moves by its value delta: milestone_pcts at that milestone's position, as a percent, times
      contract_value_usd, rounded half up to the cent; under every class schedule each milestone but the last carries the largest share in milestone_pcts and the last milestone the smallest, and a class schedule with no milestones has no milestone invoice.
      The adjustments below combine in one way only: the milestone invoice before retainage is the standard milestone invoice unless an adjustment figures it another way, it is never more than contract_value_usd less everything already billed by the deposit and milestone invoices, so that progress billing never exceeds the contract value, the retainage percentages that apply are added together and withheld once from it, and the milestone invoice is rounded half up to the cent only at the end; retainage is never
      a credit, because the final invoice on acceptance bills it.
      A signed scope addition is billed exactly once, in full, with the milestone that delivers it, and never through a schedule share. A milestone delivers at most one scope addition, the signed scope addition with the highest change order number, when that addition was registered after the date of the latest milestone invoice (or, before any milestone invoice, after the date of the deposit invoice) and no later than the date this milestone was recorded complete. Every other signed scope addition is billed exactly once as well: one that was the highest-numbered addition in an earlier milestone's window was billed in full with that milestone, and one that shared a milestone's window with a higher-numbered addition is not delivered by any milestone and is billed in full by the final invoice on acceptance, because no schedule share includes it. On an engagement carrying signed scope additions the milestone invoice before retainage is the milestone's schedule share of contract_value_usd less the value deltas of every signed scope addition, plus the value delta of the addition this milestone delivers, if any, in full; on an engagement carrying no signed scope addition it is the standard milestone invoice.
      A Major Project or Strategic Program engagement whose client holds a ClearPath agreement in active status on the
      ClearPath Professional, Premier or Enterprise tier has rel_upper_pct percent of the milestone invoice withheld as
      retainage until acceptance, a Major Project or Strategic Program engagement whose client holds no such agreement has
      rel_lower_pct percent withheld, and any other engagement none.
      Retainage is extended to clients in good standing on ClearPath: a client with ClearPath billing that shows no late fee posted in the twelve months before the invoice date has a further cp_clean_pct percent of the milestone invoice withheld as retainage, one whose ClearPath billing shows exactly one such late fee cp_one_pct percent, and any other client none, including a client with no ClearPath billing at all.
      An engagement whose own billing shows no late fee posted in the twelve months before the invoice date has a further
      own_clean_pct percent of the milestone invoice withheld as retainage, one whose billing shows exactly one such late
      fee own_one_pct percent, and any other engagement none.
      A late fee counts toward a twelve-month window when fewer than twelve whole months separate its posted date from
      the invoice date, a whole month being complete only on the same day number of a later month.
    prerequisite: []
    cross_category:
      - category: managed
        as: history
        reads: [status, variant_name, managed_billing.event_type]
        note: The relationship retainage reads the active ClearPath tier; the ClearPath good-standing retainage counts ClearPath late fees.
    compute:
      - cv_in_force: "F('contract_value_usd')"
      - ms_pos: "MAX('project_milestones','milestone_number')"
      - ms_last: "1 + (100 - P('deposit_pct') - P('final_holdback_pct') - min(P('milestone_pcts'))) / max(P('milestone_pcts')) if P('milestone_pcts') else 0"
      - ms_pct: "(min(P('milestone_pcts')) if ms_pos >= ms_last else max(P('milestone_pcts'))) if P('milestone_pcts') else 0"
      - ms_done: "LATEST('project_milestones','completed_date', date_field='completed_date')"
      - win_start: "LATEST('project_billing','posted_date', date_field='posted_date', event_type='project_milestone_invoice') if COUNT('project_billing', event_type='project_milestone_invoice') >= 1 else LATEST('project_billing','posted_date', date_field='posted_date', event_type='project_deposit_invoice')"
      - sa_at: "LATEST('project_change_orders','created_at', date_field='change_order_number', request_status='signed', change_type='scope_addition')"
      - sa_delta: "LATEST('project_change_orders','value_delta_usd', date_field='change_order_number', request_status='signed', change_type='scope_addition') if sa_at else 0.0"
      - add_sum: "SUM('project_change_orders','value_delta_usd', request_status='signed', change_type='scope_addition')"
      - pre_retainage: "ms_pct * (cv_in_force - add_sum) / 100 + sa_delta if (sa_at and win_start and ms_done and DAYS(win_start, sa_at) > 0 and DAYS(sa_at, ms_done) >= 0) else (ms_pct * (cv_in_force - add_sum) / 100 if sa_at else ms_pct * cv_in_force / 100)"
      - billed_to_date: "SUM('project_billing','amount_usd', event_type='project_deposit_invoice') + SUM('project_billing','amount_usd', event_type='project_milestone_invoice')"
      - billing_cap: "cv_in_force - billed_to_date"
      - cp_tier: "CFIELD('managed','variant_name', status='active')"
      - rel_ret: "K('rel_upper_pct') if ((F('variant_name') == 'Major Project' or F('variant_name') == 'Strategic Program') and (cp_tier == 'ClearPath Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise')) else (K('rel_lower_pct') if ((F('variant_name') == 'Major Project' or F('variant_name') == 'Strategic Program') and not (cp_tier == 'ClearPath Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise')) else 0.0)"
      - cp_late12: "XCOUNT('managed','managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')"
      - cp_billing: "XCOUNT('managed','managed_billing')"
      - cp_ret: "K('cp_clean_pct') if (cp_billing > 0 and cp_late12 == 0) else (K('cp_one_pct') if (cp_billing > 0 and cp_late12 == 1) else 0.0)"
      - own_late12: "COUNT('project_billing', within_months=12, date_field='posted_date', event_type='project_late_fee')"
      - own_ret: "K('own_clean_pct') if own_late12 == 0 else (K('own_one_pct') if own_late12 == 1 else 0.0)"
      - result: "RND(MN(pre_retainage, billing_cap) * (100 - rel_ret - cp_ret - own_ret) / 100, 2) if ms_pos >= 1 else 0.0"
    compute_basis:
      cv_in_force: "the engagement's contract_value_usd, which every signed change order moves by its value delta"
      ms_pos: "The milestone invoiced is the highest-numbered milestone recorded complete on the engagement; milestones are recorded complete in schedule order, so two completions recorded on the same day are invoiced in milestone-number order, the higher number last. An engagement with no milestone recorded complete has no milestone invoice."
      ms_last: "under every class schedule each milestone but the last carries the largest share in milestone_pcts and the last milestone the smallest, and a class schedule with no milestones has no milestone invoice."
      ms_pct: "milestone_pcts at that milestone's position, as a percent, times contract_value_usd, rounded half up to the cent; under every class schedule each milestone but the last carries the largest share in milestone_pcts and the last milestone the smallest, and a class schedule with no milestones has no milestone invoice."
      ms_done: "no later than the date this milestone was recorded complete"
      win_start: "when that addition was registered after the date of the latest milestone invoice (or, before any milestone invoice, after the date of the deposit invoice)"
      sa_at: "A milestone delivers at most one scope addition, the signed scope addition with the highest change order number"
      sa_delta: "plus the value delta of the addition this milestone delivers, if any, in full"
      add_sum: "less the value deltas of every signed scope addition"
      pre_retainage: "On an engagement carrying signed scope additions the milestone invoice before retainage is the milestone's schedule share of contract_value_usd less the value deltas of every signed scope addition, plus the value delta of the addition this milestone delivers, if any, in full; on an engagement carrying no signed scope addition it is the standard milestone invoice."
      billed_to_date: "it is never more than contract_value_usd less everything already billed by the deposit and milestone invoices"
      billing_cap: "it is never more than contract_value_usd less everything already billed by the deposit and milestone invoices, so that progress billing never exceeds the contract value"
      cp_tier: "whose client holds a ClearPath agreement in active status on the ClearPath Professional, Premier or Enterprise tier"
      rel_ret: "A Major Project or Strategic Program engagement whose client holds a ClearPath agreement in active status on the ClearPath Professional, Premier or Enterprise tier has rel_upper_pct percent of the milestone invoice withheld as retainage until acceptance, a Major Project or Strategic Program engagement whose client holds no such agreement has rel_lower_pct percent withheld, and any other engagement none."
      cp_late12: "a client with ClearPath billing that shows no late fee posted in the twelve months before the invoice date"
      cp_billing: "and any other client none, including a client with no ClearPath billing at all."
      cp_ret: "Retainage is extended to clients in good standing on ClearPath: a client with ClearPath billing that shows no late fee posted in the twelve months before the invoice date has a further cp_clean_pct percent of the milestone invoice withheld as retainage, one whose ClearPath billing shows exactly one such late fee cp_one_pct percent, and any other client none, including a client with no ClearPath billing at all."
      own_late12: "An engagement whose own billing shows no late fee posted in the twelve months before the invoice date"
      own_ret: "An engagement whose own billing shows no late fee posted in the twelve months before the invoice date has a further own_clean_pct percent of the milestone invoice withheld as retainage, one whose billing shows exactly one such late fee own_one_pct percent, and any other engagement none."
      result: "the milestone invoice before retainage is the standard milestone invoice unless an adjustment figures it another way, it is never more than contract_value_usd less everything already billed by the deposit and milestone invoices, so that progress billing never exceeds the contract value, the retainage percentages that apply are added together and withheld once from it, and the milestone invoice is rounded half up to the cent only at the end"
    factors:
      - id: scope_change_billing
        effect: method
        decides: pre_retainage
        bindings: [win_start, sa_at, sa_delta, add_sum, pre_retainage]
        ladder:
          - when: "the engagement carries signed scope additions AND the highest-numbered one was registered after the latest milestone (or deposit) invoice date and no later than this milestone's completion date"
            method: "schedule share of (contract_value_usd - sum of signed scope additions) + that addition's delta in full (the delta is added outright, once)"
          - when: "the engagement carries signed scope additions AND none was registered in this milestone's window"
            method: "schedule share of (contract_value_usd - sum of signed scope additions) (the additions' sum is subtracted)"
          - when: "otherwise"
            method: "schedule share of contract_value_usd"
        baseline:
          pre_retainage: "ms_pct * cv_in_force / 100"
        evidence: [history, date]
        cross_difficulty: null
      - id: relationship_retainage
        effect: parameter
        decides: rel_ret
        bindings: [cp_tier, rel_ret]
        ladder:
          - when: "Major Project or Strategic Program AND active ClearPath Professional, Premier or Enterprise"
            value: "rel_upper_pct of the milestone invoice withheld until acceptance"
          - when: "Major Project or Strategic Program AND no such ClearPath agreement"
            value: "rel_lower_pct of the milestone invoice withheld until acceptance"
          - when: "otherwise"
            value: "no retainage"
        baseline:
          rel_ret: "0.0"
        evidence: [cross_category, tier_param]
        cross_difficulty: managed
      - id: clearpath_good_standing
        effect: parameter
        decides: cp_ret
        bindings: [cp_billing, cp_late12, cp_ret]
        ladder:
          - when: "the client has ClearPath billing AND no ClearPath late fee posted in the twelve months before the invoice date"
            value: "cp_clean_pct of the milestone invoice withheld until acceptance"
          - when: "the client has ClearPath billing AND exactly one such late fee"
            value: "cp_one_pct of the milestone invoice withheld until acceptance"
          - when: "otherwise, including a client with no ClearPath billing"
            value: "no retainage"
        baseline:
          cp_ret: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: managed
      - id: engagement_good_standing
        effect: parameter
        decides: own_ret
        bindings: [own_late12, own_ret]
        ladder:
          - when: "no late fee on the engagement's billing in the twelve months before the invoice date"
            value: "own_clean_pct of the milestone invoice withheld until acceptance"
          - when: "exactly one"
            value: "own_one_pct of the milestone invoice withheld until acceptance"
          - when: "otherwise"
            value: "no retainage"
        baseline:
          own_ret: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard milestone invoice is the milestone's schedule share of the engagement's contract_value_usd, which
        every signed change order moves by its value delta: milestone_pcts at that milestone's position, as a percent,
        times contract_value_usd, rounded half up to the cent; under every class schedule each milestone but the last carries the largest share in milestone_pcts and the last milestone the smallest, and a class schedule with no milestones has no milestone invoice.
      params: [milestone_pcts]
    inputs:
      history:
        - {table: project_change_orders, aggregate: latest, field: value_delta_usd, filters: {request_status: signed, change_type: scope_addition}}
        - {table: project_milestones, aggregate: max, field: milestone_number, filters: {}}
        - {table: project_billing, aggregate: count, field: project_billing_entry_id, within_months: 12, filters: {event_type: project_late_fee}}
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 12, filters: {event_type: managed_late_fee}}
      cross_category: [managed]

  - id: project_ext_restart_repricing
    base_policy_refs: [project_change_orders, project_client_signed_changes, project_schedule_and_holds]
    overwrite:
      - base_policy: project_schedule_and_holds
        superseded_clause: >-
          A client-caused hold (client_request, client_dependency or nonpayment) longer than max_client_hold_days lets
          Stratton Bay terminate the engagement as a client cancellation or re-price the remaining work by change order.
        replaced_by: >-
          For a fixed-fee engagement whose client-caused hold lasted longer than max_client_hold_days and that is resumed
          rather than terminated, and only for such an engagement, the remaining work is re-priced by a change order the
          client signs, figured as this policy states; a client-caused hold is a hold for client_request, client_dependency or nonpayment; every engagement held longer than max_client_hold_days for a client cause may still be terminated by Stratton Bay as a client cancellation, and any other such engagement that resumes may still have its remaining work re-priced by change order.
    trigger: state_due
    subject: [project_change_order_applied]
    computes: value_delta_usd
    target_tool: sign_restart_change_order_602c3012
    params:
      std_uplift_pct: 4.0
      annual_escalation_pct: 9.0
      replanning_hours: 16
      lock_upper_pts: 2.0
      lock_lower_pts: 1.0
      growth_two_pts: 1.0
      growth_one_pts: 0.5
      repeat_two_pts: 1.0
      repeat_one_pts: 0.5
      phases_three_pts: 1.0
      phases_two_pts: 0.5
      clearpath_late_two_pts: 1.0
      clearpath_late_one_pts: 0.5
    rule: >
      For a fixed-fee engagement whose client-caused hold lasted longer than max_client_hold_days and that is resumed
      rather than terminated, and only for such an engagement, the remaining work is re-priced by a change order the
      client signs, figured as this policy states; a client-caused hold is a hold for client_request, client_dependency or nonpayment; every engagement held longer than max_client_hold_days for a client cause may still be terminated by Stratton Bay as a client cancellation, and any other such engagement that resumes may still have its remaining work re-priced by change order.
      The re-pricing is carried by the restart change order, the change order registered for the restart on or after the
      engagement's resumed_date, which the client signs at the value this policy figures; any value shown on it while it
      awaits signature is provisional, and its signature moves contract_value_usd by the signed value and adds one to
      change_order_count.
      The value of a restart re-pricing is fixed only after the engagement's billing carries a milestone invoice for every
      milestone recorded complete.
      The remaining value is the engagement's contract_value_usd, which every signed change order has moved by its value
      delta, less everything already billed by the deposit and milestone invoices.
      The standard restart re-pricing is std_uplift_pct percent of the remaining value, rounded half up to the cent.
      The adjustments below combine in one way only: the restart re-pricing is the standard restart re-pricing unless an adjustment figures it another way, the percentage points that apply are added together, points taken off counting as negative, that net percentage of the remaining value is added to it, and the restart re-pricing is rounded half up to the cent only at the end.
      For the hold, the restart re-pricing rests on the hold length, the calendar days from on_hold_date to resumed_date, and on the full months on hold counted the same way, a whole month being complete only on the same
      day number of a later month: a hold shorter than one and a half times max_client_hold_days keeps the standard restart re-pricing; a hold of one and a half times max_client_hold_days or longer adds to the standard restart re-pricing a re-planning block of replanning_hours hours at architect_rate_usd; a hold of twice max_client_hold_days or
      longer adds to both an escalation of annual_escalation_pct percent a year of the remaining value pro-rated by the full
      months on hold, so that a longer hold is never re-priced lower than a shorter one.
      For a client whose ClearPath agreement in active status is on the ClearPath Professional, Premier or Enterprise tier
      and covers 100 or more seats, lock_upper_pts points are taken off the restart re-pricing; for a client on one of
      those tiers covering fewer than 100 seats, lock_lower_pts points; for any other client none.
      When the client has signed two or more scope additions on the engagement, growth_two_pts points are added to the
      restart re-pricing, growth_one_pts points when it has signed exactly one, and none otherwise.
      When two or more remobilization fees were posted on the engagement in the twelve months before the re-pricing date,
      repeat_two_pts points are added to the restart re-pricing, repeat_one_pts points when exactly one was, and none
      otherwise, a fee counting when fewer than twelve whole months separate its posted date from the re-pricing date, the day the client signs the restart change order.
      Where the class schedule has milestones, they number one plus the shares left after deposit_pct and final_holdback_pct and the last milestone's share, divided by the largest milestone share, and a class schedule with no milestones has none, so that no milestone remains open and no points are added; phases_three_pts points are added to the
      restart re-pricing when three or more milestones are not yet recorded complete, phases_two_pts points when exactly
      two are not, and none otherwise.
      For a client whose ClearPath billing shows two or more late fees posted in the twelve months before the re-pricing
      date, clearpath_late_two_pts points are added to the restart re-pricing, clearpath_late_one_pts points for exactly
      one, and none otherwise.
    prerequisite:
      - problem: project_ext_milestone_billing
        kind: value_input
        gate: remaining_value
        form: state
        policy_source: >-
          The value of a restart re-pricing is fixed only after the engagement's billing carries a milestone invoice for
          every milestone recorded complete.
        condition: >-
          The engagement's billing carries a milestone invoice for every milestone recorded complete on the engagement.
        resolved_by: post_milestone_invoice_79b8c922
        effect: >-
          remaining_value falls by the milestone invoice the milestone billing posts, so the standard restart re-pricing, the re-planning and escalation terms and the points applied to the remaining value move.
    cross_category:
      - category: managed
        as: history
        reads: [status, variant_name, seat_count, managed_billing.event_type]
        note: The managed-rate points read the active ClearPath tier and seat count; the ClearPath-standing points count ClearPath late fees.
    compute:
      - remaining_value: "F('contract_value_usd') - SUM('project_billing','amount_usd', event_type='project_deposit_invoice') - SUM('project_billing','amount_usd', event_type='project_milestone_invoice')"
      - hold_days: "DAYS(F('on_hold_date'), F('resumed_date'))"
      - hold_months: "MONTHS(F('on_hold_date'), F('resumed_date'))"
      - base_repricing: "remaining_value * K('std_uplift_pct') / 100 + K('replanning_hours') * P('architect_rate_usd') + remaining_value * K('annual_escalation_pct') * hold_months / 12 / 100 if hold_days >= 2 * P('max_client_hold_days') else (remaining_value * K('std_uplift_pct') / 100 + K('replanning_hours') * P('architect_rate_usd') if hold_days >= 1.5 * P('max_client_hold_days') else remaining_value * K('std_uplift_pct') / 100)"
      - cp_tier: "CFIELD('managed','variant_name', status='active')"
      - cp_seats: "CFIELD('managed','seat_count', status='active')"
      - lock_pts: "K('lock_upper_pts') if ((cp_tier == 'ClearPath Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise') and cp_seats >= 100) else (K('lock_lower_pts') if ((cp_tier == 'ClearPath Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise') and cp_seats < 100) else 0.0)"
      - additions: "COUNT('project_change_orders', request_status='signed', change_type='scope_addition')"
      - growth_pts: "K('growth_two_pts') if additions >= 2 else (K('growth_one_pts') if additions == 1 else 0.0)"
      - remob12: "COUNT('project_billing', within_months=12, date_field='posted_date', event_type='project_remobilization_fee')"
      - repeat_pts: "K('repeat_two_pts') if remob12 >= 2 else (K('repeat_one_pts') if remob12 == 1 else 0.0)"
      - ms_total: "1 + (100 - P('deposit_pct') - P('final_holdback_pct') - min(P('milestone_pcts'))) / max(P('milestone_pcts')) if P('milestone_pcts') else 0"
      - ms_open: "ms_total - COUNT('project_milestones')"
      - phase_pts: "K('phases_three_pts') if ms_open >= 3 else (K('phases_two_pts') if ms_open >= 2 else 0.0)"
      - cp_late12: "XCOUNT('managed','managed_billing', within_months=12, date_field='posted_date', event_type='managed_late_fee')"
      - late_pts: "K('clearpath_late_two_pts') if cp_late12 >= 2 else (K('clearpath_late_one_pts') if cp_late12 == 1 else 0.0)"
      - result: "RND(base_repricing + remaining_value * (growth_pts + repeat_pts + phase_pts + late_pts - lock_pts) / 100, 2)"
    compute_basis:
      remaining_value: "The remaining value is the engagement's contract_value_usd, which every signed change order has moved by its value delta, less everything already billed by the deposit and milestone invoices."
      hold_days: "For the hold, the restart re-pricing rests on the hold length, the calendar days from on_hold_date to resumed_date"
      hold_months: "and on the full months on hold counted the same way, a whole month being complete only on the same day number of a later month"
      base_repricing: "a hold shorter than one and a half times max_client_hold_days keeps the standard restart re-pricing; a hold of one and a half times max_client_hold_days or longer adds to the standard restart re-pricing a re-planning block of replanning_hours hours at architect_rate_usd; a hold of twice max_client_hold_days or longer adds to both an escalation of annual_escalation_pct percent a year of the remaining value pro-rated by the full months on hold, so that a longer hold is never re-priced lower than a shorter one."
      cp_tier: "For a client whose ClearPath agreement in active status is on the ClearPath Professional, Premier or Enterprise tier"
      cp_seats: "and covers 100 or more seats, lock_upper_pts points are taken off the restart re-pricing; for a client on one of those tiers covering fewer than 100 seats"
      lock_pts: "For a client whose ClearPath agreement in active status is on the ClearPath Professional, Premier or Enterprise tier and covers 100 or more seats, lock_upper_pts points are taken off the restart re-pricing; for a client on one of those tiers covering fewer than 100 seats, lock_lower_pts points; for any other client none."
      additions: "When the client has signed two or more scope additions on the engagement"
      growth_pts: "When the client has signed two or more scope additions on the engagement, growth_two_pts points are added to the restart re-pricing, growth_one_pts points when it has signed exactly one, and none otherwise."
      remob12: "a fee counting when fewer than twelve whole months separate its posted date from the re-pricing date, the day the client signs the restart change order."
      repeat_pts: "When two or more remobilization fees were posted on the engagement in the twelve months before the re-pricing date, repeat_two_pts points are added to the restart re-pricing, repeat_one_pts points when exactly one was, and none otherwise"
      ms_total: "Where the class schedule has milestones, they number one plus the shares left after deposit_pct and final_holdback_pct and the last milestone's share, divided by the largest milestone share, and a class schedule with no milestones has none, so that no milestone remains open and no points are added"
      ms_open: "when three or more milestones are not yet recorded complete"
      phase_pts: "phases_three_pts points are added to the restart re-pricing when three or more milestones are not yet recorded complete, phases_two_pts points when exactly two are not, and none otherwise."
      cp_late12: "For a client whose ClearPath billing shows two or more late fees posted in the twelve months before the re-pricing date"
      late_pts: "For a client whose ClearPath billing shows two or more late fees posted in the twelve months before the re-pricing date, clearpath_late_two_pts points are added to the restart re-pricing, clearpath_late_one_pts points for exactly one, and none otherwise."
      result: "the restart re-pricing is the standard restart re-pricing unless an adjustment figures it another way, the percentage points that apply are added together, points taken off counting as negative, that net percentage of the remaining value is added to it, and the restart re-pricing is rounded half up to the cent only at the end."
    factors:
      - id: hold_length
        effect: method
        decides: base_repricing
        bindings: [hold_days, hold_months, base_repricing]
        ladder:
          - when: "hold of twice max_client_hold_days or longer"
            method: "std_uplift_pct of the remaining value + re-planning block (replanning_hours x architect_rate_usd) + annual_escalation_pct a year of the remaining value pro-rated by full months on hold (months enter the formula)"
          - when: "hold of one and a half times max_client_hold_days or longer but shorter than twice it"
            method: "std_uplift_pct of the remaining value + re-planning block (a tariff input enters the formula)"
          - when: "otherwise"
            method: "std_uplift_pct of the remaining value"
        baseline:
          base_repricing: "remaining_value * K('std_uplift_pct') / 100"
        evidence: [date]
        cross_difficulty: null
      - id: managed_rate
        effect: parameter
        decides: lock_pts
        bindings: [cp_tier, cp_seats, lock_pts]
        ladder:
          - when: "active ClearPath Professional, Premier or Enterprise AND 100 or more seats"
            value: "lock_upper_pts taken off the restart re-pricing"
          - when: "active ClearPath Professional, Premier or Enterprise AND fewer than 100 seats"
            value: "lock_lower_pts taken off the restart re-pricing"
          - when: "otherwise"
            value: "no points"
        baseline:
          lock_pts: "0.0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: scope_growth
        effect: parameter
        decides: growth_pts
        bindings: [additions, growth_pts]
        ladder:
          - when: "two or more signed scope additions on the engagement"
            value: "growth_two_pts added to the restart re-pricing"
          - when: "exactly one"
            value: "growth_one_pts added to the restart re-pricing"
          - when: "otherwise"
            value: "no points"
        baseline:
          growth_pts: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_pause
        effect: parameter
        decides: repeat_pts
        bindings: [remob12, repeat_pts]
        ladder:
          - when: "two or more remobilization fees posted on the engagement in the twelve months before the re-pricing date"
            value: "repeat_two_pts added to the restart re-pricing"
          - when: "exactly one"
            value: "repeat_one_pts added to the restart re-pricing"
          - when: "otherwise"
            value: "no points"
        baseline:
          repeat_pts: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: phases_remaining
        effect: parameter
        decides: phase_pts
        bindings: [ms_total, ms_open, phase_pts]
        ladder:
          - when: "three or more milestones not yet recorded complete"
            value: "phases_three_pts added to the restart re-pricing"
          - when: "exactly two not yet recorded complete"
            value: "phases_two_pts added to the restart re-pricing"
          - when: "otherwise"
            value: "no points"
        baseline:
          phase_pts: "0.0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: clearpath_standing
        effect: parameter
        decides: late_pts
        bindings: [cp_late12, late_pts]
        ladder:
          - when: "two or more ClearPath late fees posted in the twelve months before the re-pricing date"
            value: "clearpath_late_two_pts added to the restart re-pricing"
          - when: "exactly one"
            value: "clearpath_late_one_pts added to the restart re-pricing"
          - when: "otherwise"
            value: "no points"
        baseline:
          late_pts: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: managed
    baseline:
      rule: >-
        The remaining value is the engagement's contract_value_usd, which every signed change order has moved by its value
        delta, less everything already billed by the deposit and milestone invoices. The standard restart re-pricing is
        std_uplift_pct percent of the remaining value, rounded half up to the cent.
      params: [std_uplift_pct]
    inputs:
      history:
        - {table: project_billing, aggregate: sum, field: amount_usd, filters: {event_type: project_milestone_invoice}}
        - {table: project_billing, aggregate: count, field: project_billing_entry_id, within_months: 12, filters: {event_type: project_remobilization_fee}}
        - {table: project_change_orders, aggregate: count, field: project_change_order_id, filters: {request_status: signed, change_type: scope_addition}}
        - {category: managed, table: managed_billing, aggregate: count, field: managed_billing_entry_id, within_months: 12, filters: {event_type: managed_late_fee}}
      cross_category: [managed]

  - id: project_ext_restart_change_order_fee
    base_policy_refs: [project_change_orders]
    overwrite:
      - base_policy: project_change_orders
        superseded_clause: >-
          The change order administration fee is change_order_admin_fee_usd for each signed scope or schedule change,
          waived when the absolute value delta is below change_order_fee_waiver_below_usd (a pure schedule change with no
          value delta is charged the fee).
        replaced_by: >-
          For a restart change order, and only for such a change order, the administration fee is figured as this policy
          states; every other signed scope or schedule change carries change_order_admin_fee_usd, waived when the absolute
          value delta is below change_order_fee_waiver_below_usd, and a pure schedule change with no value delta is charged
          the fee.
    trigger: state_due
    subject: [project_change_order_fee]
    computes: amount_usd
    target_tool: post_change_order_fee_93724a4c
    params:
      large_multiple: 4
      restart_fee_pct: 2.5
      review_hours: 2
      first_co_factor: 0.5
      third_co_factor: 1.25
      premier_factor: 0.5
      professional_factor: 0.8
      window_short_days: 7
      window_long_days: 30
      window_short_factor: 0.75
      window_long_factor: 0.9
      growth_high_pct: 20
      growth_mid_pct: 5
      growth_high_factor: 1.25
      growth_mid_factor: 1.1
    rule: >
      For a restart change order, and only for such a change order, the administration fee is figured as this policy
      states; every other signed scope or schedule change carries change_order_admin_fee_usd, waived when the absolute
      value delta is below change_order_fee_waiver_below_usd, and a pure schedule change with no value delta is charged the
      fee.
      A restart change order is a signed change order of a fixed-fee engagement resumed after a client-caused hold longer
      than max_client_hold_days that was registered on or after the engagement's resumed_date; a change order registered
      before resumed_date is never a restart change order. Change orders are numbered in sequence as they are registered,
      so the restart change order whose fee is figured is the signed change order with the highest change order number,
      provided it was registered on or after resumed_date; an engagement with no restart change order is charged nothing
      under this policy.
      The administration fee of a restart change order is fixed only after the engagement's change orders carry that
      change order signed by the client.
      The standard administration fee of a restart change order is change_order_admin_fee_usd; a restart change order is
      never waived, so it always carries a fee.
      The adjustments below combine in one way only: the administration fee is the standard administration fee unless an adjustment figures it another way, the factors that apply are multiplied together and applied once to it, and the administration fee is rounded half up to the cent only at the end.
      For the size of the change, the administration fee of a restart change order is the standard administration fee when the absolute value delta is below change_order_fee_waiver_below_usd; when it is
      change_order_fee_waiver_below_usd or more, restart_fee_pct percent of the part of the absolute value delta above
      change_order_fee_waiver_below_usd is added to change_order_admin_fee_usd; when it is large_multiple times
      change_order_fee_waiver_below_usd or more, a change review of review_hours hours at architect_rate_usd is added as
      well, so that a larger change never carries a smaller fee.
      The administration fee of a restart change order is multiplied by first_co_factor when the change order is the engagement's first signed change order, by third_co_factor when it is the third or a later one, and left unchanged when it is the second, the count being the signed scope additions, scope reductions and schedule changes on the engagement,
      this one included, which change_order_count also records.
      The administration fee of a restart change order is multiplied by premier_factor for a client whose ClearPath agreement in active status is on the ClearPath Premier or ClearPath Enterprise tier, by professional_factor for one on the ClearPath Professional tier, and left unchanged for any other client.
      The administration fee of a restart change order registered window_short_days or fewer calendar days after the
      engagement's resumed_date is multiplied by window_short_factor, one registered more than window_short_days but no more than window_long_days days after it by window_long_factor, and any other is left unchanged.
      Where the growth is the value deltas of every change order the client has signed, this one included, which is
      contract_value_usd less original_value_usd, as a percent of original_value_usd, the administration fee of a restart change order is multiplied by growth_high_factor for a growth of growth_high_pct percent or more, by growth_mid_factor for growth_mid_pct percent or more but below growth_high_pct percent, and left unchanged for any smaller growth.
    prerequisite:
      - problem: project_ext_restart_repricing
        kind: value_input
        gate: delta_abs
        form: state
        policy_source: >-
          The administration fee of a restart change order is fixed only after the engagement's change orders carry that
          change order signed by the client.
        condition: >-
          The engagement's change orders carry the restart change order in signed status.
        resolved_by: sign_restart_change_order_602c3012
        effect: >-
          delta_abs becomes the signed restart re-pricing's absolute value delta, which sets the administration fee for the size of the change and raises the contract growth and change_order_count.
    cross_category:
      - category: managed
        as: branch
        reads: [status, variant_name]
        note: The managed-client factor is decided from the tier of the client's active ClearPath agreement.
    compute:
      - rco_num: "LATEST('project_change_orders','change_order_number', date_field='change_order_number', request_status='signed')"
      - rco_at: "LATEST('project_change_orders','created_at', date_field='change_order_number', request_status='signed')"
      - rco_ok: "1 if (rco_at and F('resumed_date') and F('on_hold_date') and DAYS(F('on_hold_date'), F('resumed_date')) > P('max_client_hold_days') and DAYS(F('resumed_date'), rco_at) >= 0) else 0"
      - delta_abs: "ABS(LATEST('project_change_orders','value_delta_usd', date_field='change_order_number', request_status='signed')) if rco_ok == 1 else 0.0"
      - base_fee: "P('change_order_admin_fee_usd') + K('restart_fee_pct') * (delta_abs - P('change_order_fee_waiver_below_usd')) / 100 + K('review_hours') * P('architect_rate_usd') if delta_abs >= K('large_multiple') * P('change_order_fee_waiver_below_usd') else (P('change_order_admin_fee_usd') + K('restart_fee_pct') * (delta_abs - P('change_order_fee_waiver_below_usd')) / 100 if delta_abs >= P('change_order_fee_waiver_below_usd') else P('change_order_admin_fee_usd'))"
      - co_seq: "COUNT('project_change_orders', request_status='signed', change_type='scope_addition') + COUNT('project_change_orders', request_status='signed', change_type='scope_reduction') + COUNT('project_change_orders', request_status='signed', change_type='schedule_change')"
      - seq_factor: "K('first_co_factor') if co_seq == 1 else (K('third_co_factor') if co_seq >= 3 else 1.0)"
      - cp_tier: "CFIELD('managed','variant_name', status='active')"
      - managed_factor: "K('premier_factor') if (cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise') else (K('professional_factor') if cp_tier == 'ClearPath Professional' else 1.0)"
      - since_resume: "DAYS(F('resumed_date'), rco_at) if (F('resumed_date') and rco_at) else 9999"
      - window_factor: "K('window_short_factor') if since_resume <= K('window_short_days') else (K('window_long_factor') if since_resume <= K('window_long_days') else 1.0)"
      - growth_pct: "SUM('project_change_orders','value_delta_usd', request_status='signed') * 100 / F('original_value_usd')"
      - growth_factor: "K('growth_high_factor') if growth_pct >= K('growth_high_pct') else (K('growth_mid_factor') if growth_pct >= K('growth_mid_pct') else 1.0)"
      - result: "RND(base_fee * seq_factor * managed_factor * window_factor * growth_factor, 2) if rco_ok == 1 else 0.0"
    compute_basis:
      rco_num: "Change orders are numbered in sequence as they are registered, so the restart change order whose fee is figured is the signed change order with the highest change order number, provided it was registered on or after resumed_date"
      rco_at: "the restart change order whose fee is figured is the signed change order with the highest change order number, provided it was registered on or after resumed_date"
      rco_ok: "A restart change order is a signed change order of a fixed-fee engagement resumed after a client-caused hold longer than max_client_hold_days that was registered on or after the engagement's resumed_date; a change order registered before resumed_date is never a restart change order."
      delta_abs: "the restart change order whose fee is figured is the signed change order with the highest change order number, provided it was registered on or after resumed_date; an engagement with no restart change order is charged nothing under this policy."
      base_fee: "For the size of the change, the administration fee of a restart change order is the standard administration fee when the absolute value delta is below change_order_fee_waiver_below_usd; when it is change_order_fee_waiver_below_usd or more, restart_fee_pct percent of the part of the absolute value delta above change_order_fee_waiver_below_usd is added to change_order_admin_fee_usd; when it is large_multiple times change_order_fee_waiver_below_usd or more, a change review of review_hours hours at architect_rate_usd is added as well, so that a larger change never carries a smaller fee."
      co_seq: "the count being the signed scope additions, scope reductions and schedule changes on the engagement, this one included, which change_order_count also records."
      seq_factor: "The administration fee of a restart change order is multiplied by first_co_factor when the change order is the engagement's first signed change order, by third_co_factor when it is the third or a later one, and left unchanged when it is the second, the count being the signed scope additions, scope reductions and schedule changes on the engagement, this one included, which change_order_count also records."
      cp_tier: "The administration fee of a restart change order is multiplied by premier_factor for a client whose ClearPath agreement in active status is on the ClearPath Premier or ClearPath Enterprise tier"
      managed_factor: "The administration fee of a restart change order is multiplied by premier_factor for a client whose ClearPath agreement in active status is on the ClearPath Premier or ClearPath Enterprise tier, by professional_factor for one on the ClearPath Professional tier, and left unchanged for any other client."
      since_resume: "The administration fee of a restart change order registered window_short_days or fewer calendar days after the engagement's resumed_date"
      window_factor: "The administration fee of a restart change order registered window_short_days or fewer calendar days after the engagement's resumed_date is multiplied by window_short_factor, one registered more than window_short_days but no more than window_long_days days after it by window_long_factor, and any other is left unchanged."
      growth_pct: "Where the growth is the value deltas of every change order the client has signed, this one included, which is contract_value_usd less original_value_usd, as a percent of original_value_usd"
      growth_factor: "the administration fee of a restart change order is multiplied by growth_high_factor for a growth of growth_high_pct percent or more, by growth_mid_factor for growth_mid_pct percent or more but below growth_high_pct percent, and left unchanged for any smaller growth."
      result: "the administration fee is the standard administration fee unless an adjustment figures it another way, the factors that apply are multiplied together and applied once to it, and the administration fee is rounded half up to the cent only at the end."
    factors:
      - id: fee_basis
        effect: method
        decides: base_fee
        bindings: [delta_abs, base_fee]
        ladder:
          - when: "absolute value delta large_multiple times change_order_fee_waiver_below_usd or more"
            method: "change_order_admin_fee_usd + restart_fee_pct of the delta above the waiver threshold + a change review of review_hours at architect_rate_usd (a tariff input enters the formula)"
          - when: "absolute value delta change_order_fee_waiver_below_usd or more but below large_multiple times it"
            method: "change_order_admin_fee_usd + restart_fee_pct of the delta above the waiver threshold (the delta enters the formula)"
          - when: "otherwise"
            method: "the flat change_order_admin_fee_usd"
        baseline:
          base_fee: "P('change_order_admin_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: sequence_factor
        effect: parameter
        decides: seq_factor
        bindings: [co_seq, seq_factor]
        ladder:
          - when: "first signed change order of the engagement"
            value: "first_co_factor multiplier on the administration fee"
          - when: "third or a later signed change order"
            value: "third_co_factor multiplier on the administration fee"
          - when: "otherwise (the second)"
            value: "no multiplier"
        baseline:
          seq_factor: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: managed_client_factor
        effect: parameter
        decides: managed_factor
        bindings: [cp_tier, managed_factor]
        ladder:
          - when: "active ClearPath Premier or Enterprise"
            value: "premier_factor multiplier on the administration fee"
          - when: "active ClearPath Professional"
            value: "professional_factor multiplier on the administration fee"
          - when: "otherwise"
            value: "no multiplier"
        baseline:
          managed_factor: "1.0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: restart_window
        effect: parameter
        decides: window_factor
        bindings: [since_resume, window_factor]
        ladder:
          - when: "registered window_short_days or fewer calendar days after resumed_date"
            value: "window_short_factor multiplier on the administration fee"
          - when: "more than window_short_days but no more than window_long_days days after"
            value: "window_long_factor multiplier on the administration fee"
          - when: "otherwise"
            value: "no multiplier"
        baseline:
          window_factor: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: contract_growth
        effect: parameter
        decides: growth_factor
        bindings: [growth_pct, growth_factor]
        ladder:
          - when: "growth of growth_high_pct percent or more"
            value: "growth_high_factor multiplier on the administration fee"
          - when: "growth_mid_pct percent or more but below growth_high_pct percent"
            value: "growth_mid_factor multiplier on the administration fee"
          - when: "otherwise"
            value: "no multiplier"
        baseline:
          growth_factor: "1.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard administration fee of a restart change order is change_order_admin_fee_usd; a restart change order is
        never waived, so it always carries a fee.
      params: [change_order_admin_fee_usd]
    inputs:
      history:
        - {table: project_change_orders, aggregate: latest, field: value_delta_usd, filters: {request_status: signed}}
      cross_category: [managed]

  - id: project_ext_restart_remobilization
    base_policy_refs: [project_schedule_and_holds]
    overwrite:
      - base_policy: project_schedule_and_holds
        superseded_clause: >-
          when a client-caused hold lasted more than remobilization_threshold_days calendar days a remobilization fee of
          remobilization_fee_usd is invoiced.
        replaced_by: >-
          For a fixed-fee engagement resumed after a client-caused hold longer than max_client_hold_days, and only for such
          a resumption, the remobilization fee is figured as this policy states; every other resumption after a client-caused hold (client_request, client_dependency or nonpayment) longer than remobilization_threshold_days calendar days is invoiced a remobilization fee of remobilization_fee_usd.
    trigger: state_due
    subject: [project_remobilization_fee]
    computes: amount_usd
    target_tool: post_remobilization_fee_508d4151
    params:
      months_per_quarter: 3
      reramp_week_usd: 250.0
      cont_upper_factor: 0.6
      cont_lower_factor: 0.8
      share_high_pct: 60
      share_mid_pct: 25
      share_high_factor: 1.25
      share_mid_factor: 1.1
      repeat_two_usd: 1000.0
      repeat_one_usd: 500.0
      architect_high_minutes: 2400
      architect_high_usd: 750.0
      architect_low_usd: 350.0
      afterhours_high_minutes: 960
      afterhours_high_usd: 400.0
      afterhours_low_usd: 200.0
    rule: >
      For a fixed-fee engagement resumed after a client-caused hold longer than max_client_hold_days, and only for such a
      resumption, the remobilization fee is figured as this policy states; every other resumption after a client-caused hold (client_request, client_dependency or nonpayment) longer than remobilization_threshold_days calendar days is invoiced a remobilization fee of remobilization_fee_usd.
      The restart change order is the signed change order with the highest change order number on the engagement,
      provided it was registered on or after resumed_date; change orders are numbered in sequence as they are registered.
      The remobilization fee of such a resumption is not invoiced until the engagement's billing carries the
      administration fee posted for the restart change order.
      The standard remobilization fee of such a resumption is remobilization_fee_usd less the administration fees posted on
      the engagement's billing for the restart change order, never below zero, rounded half up to the cent.
      The adjustments below combine in one way only: the remobilization fee before deduction is remobilization_fee_usd unless an adjustment figures it another way, the scaling factors that apply are multiplied together and applied once to it, the amounts that apply are then added, the administration fees posted for the restart change order are deducted last, the remobilization fee is never below zero, and it is rounded half up to the cent only at the end.
      For the hold, the remobilization fee rests on the hold length, the calendar days from on_hold_date to resumed_date, and on the full months on hold counted the same way, a whole month being complete only on the same
      day number of a later month: a hold shorter than one and a half times max_client_hold_days is charged
      remobilization_fee_usd; a hold of one and a half times max_client_hold_days or longer adds to that reramp_week_usd
      for every full week by which the hold exceeds max_client_hold_days; a hold of twice max_client_hold_days or longer
      adds to both a further remobilization_fee_usd for every months_per_quarter full months on hold, pro-rated by full
      months, so that a longer hold never costs less to restart than a shorter one.
      The remobilization fee is scaled by cont_upper_factor for a client whose ClearPath agreement in active status is on
      the ClearPath Professional, Premier or Enterprise tier and covers 100 or more seats, by cont_lower_factor for a client
      on one of those tiers covering fewer than 100 seats, and not at all for any other client.
      Where the remaining share is contract_value_usd, which every signed change order has moved by its value delta, less
      everything billed by the deposit and milestone invoices, as a percent of contract_value_usd, the remobilization fee
      is scaled by share_high_factor for a remaining share of share_high_pct percent or more, by share_mid_factor for
      share_mid_pct percent or more but below share_high_pct percent, and not at all for any smaller share.
      repeat_two_usd is added to the remobilization fee when two or more remobilization fees were posted on the engagement
      in the twelve months before the invoice date, repeat_one_usd when exactly one was, and nothing otherwise, a fee
      counting when fewer than twelve whole months separate its posted date from the invoice date.
      architect_high_usd is added to the remobilization fee when architect time logged on the engagement totals
      architect_high_minutes minutes or more, architect_low_usd when some but less architect time is logged, and nothing
      when none is.
      afterhours_high_usd is added to the remobilization fee when after-hours time logged on the engagement totals
      afterhours_high_minutes minutes or more, afterhours_low_usd when some but less is logged, and nothing when none is.
    prerequisite:
      - problem: project_ext_restart_change_order_fee
        kind: value_input
        gate: co_fee_net
        form: state
        policy_source: >-
          The remobilization fee of such a resumption is not invoiced until the engagement's billing carries the
          administration fee posted for the restart change order.
        condition: >-
          The engagement's billing carries an administration fee posted for the restart change order.
        resolved_by: post_change_order_fee_93724a4c
        effect: >-
          co_fee_net becomes the administration fee posted for the restart change order, which is deducted from the
          remobilization fee.
    cross_category:
      - category: managed
        as: branch
        reads: [status, variant_name, seat_count]
        note: The continuity scaling is decided from the tier and seat count of the client's active ClearPath agreement.
    compute:
      - hold_days: "DAYS(F('on_hold_date'), F('resumed_date'))"
      - hold_months: "MONTHS(F('on_hold_date'), F('resumed_date'))"
      - span_fee: "P('remobilization_fee_usd') + K('reramp_week_usd') * int((hold_days - P('max_client_hold_days')) / 7) + P('remobilization_fee_usd') * hold_months / K('months_per_quarter') if hold_days >= 2 * P('max_client_hold_days') else (P('remobilization_fee_usd') + K('reramp_week_usd') * int((hold_days - P('max_client_hold_days')) / 7) if hold_days >= 1.5 * P('max_client_hold_days') else P('remobilization_fee_usd'))"
      - cp_tier: "CFIELD('managed','variant_name', status='active')"
      - cp_seats: "CFIELD('managed','seat_count', status='active')"
      - cont_factor: "K('cont_upper_factor') if ((cp_tier == 'ClearPath Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise') and cp_seats >= 100) else (K('cont_lower_factor') if ((cp_tier == 'ClearPath Professional' or cp_tier == 'ClearPath Premier' or cp_tier == 'ClearPath Enterprise') and cp_seats < 100) else 1.0)"
      - share_pct: "(F('contract_value_usd') - SUM('project_billing','amount_usd', event_type='project_deposit_invoice') - SUM('project_billing','amount_usd', event_type='project_milestone_invoice')) * 100 / F('contract_value_usd')"
      - share_factor: "K('share_high_factor') if share_pct >= K('share_high_pct') else (K('share_mid_factor') if share_pct >= K('share_mid_pct') else 1.0)"
      - remob12: "COUNT('project_billing', within_months=12, date_field='posted_date', event_type='project_remobilization_fee')"
      - repeat_add: "K('repeat_two_usd') if remob12 >= 2 else (K('repeat_one_usd') if remob12 == 1 else 0.0)"
      - arch_min: "SUM('project_work_logs','worked_minutes', resource_level='architect')"
      - arch_add: "K('architect_high_usd') if arch_min >= K('architect_high_minutes') else (K('architect_low_usd') if arch_min > 0 else 0.0)"
      - ah_min: "SUM('project_work_logs','worked_minutes', time_band='after_hours')"
      - ah_add: "K('afterhours_high_usd') if ah_min >= K('afterhours_high_minutes') else (K('afterhours_low_usd') if ah_min > 0 else 0.0)"
      - rco_num: "LATEST('project_change_orders','change_order_number', date_field='change_order_number', request_status='signed')"
      - rco_at: "LATEST('project_change_orders','created_at', date_field='change_order_number', request_status='signed')"
      - co_fee_net: "SUM('project_billing','amount_usd', event_type='project_change_order_fee', change_order_number=rco_num) if (rco_at and DAYS(F('resumed_date'), rco_at) >= 0) else 0.0"
      - result: "RND(MX(0, span_fee * cont_factor * share_factor + repeat_add + arch_add + ah_add - co_fee_net), 2)"
    compute_basis:
      hold_days: "For the hold, the remobilization fee rests on the hold length, the calendar days from on_hold_date to resumed_date"
      hold_months: "and on the full months on hold counted the same way, a whole month being complete only on the same day number of a later month"
      span_fee: "a hold shorter than one and a half times max_client_hold_days is charged remobilization_fee_usd; a hold of one and a half times max_client_hold_days or longer adds to that reramp_week_usd for every full week by which the hold exceeds max_client_hold_days; a hold of twice max_client_hold_days or longer adds to both a further remobilization_fee_usd for every months_per_quarter full months on hold, pro-rated by full months, so that a longer hold never costs less to restart than a shorter one."
      cp_tier: "The remobilization fee is scaled by cont_upper_factor for a client whose ClearPath agreement in active status is on the ClearPath Professional, Premier or Enterprise tier"
      cp_seats: "and covers 100 or more seats, by cont_lower_factor for a client on one of those tiers covering fewer than 100 seats"
      cont_factor: "The remobilization fee is scaled by cont_upper_factor for a client whose ClearPath agreement in active status is on the ClearPath Professional, Premier or Enterprise tier and covers 100 or more seats, by cont_lower_factor for a client on one of those tiers covering fewer than 100 seats, and not at all for any other client."
      share_pct: "Where the remaining share is contract_value_usd, which every signed change order has moved by its value delta, less everything billed by the deposit and milestone invoices, as a percent of contract_value_usd"
      share_factor: "the remobilization fee is scaled by share_high_factor for a remaining share of share_high_pct percent or more, by share_mid_factor for share_mid_pct percent or more but below share_high_pct percent, and not at all for any smaller share."
      remob12: "a fee counting when fewer than twelve whole months separate its posted date from the invoice date."
      repeat_add: "repeat_two_usd is added to the remobilization fee when two or more remobilization fees were posted on the engagement in the twelve months before the invoice date, repeat_one_usd when exactly one was, and nothing otherwise"
      arch_min: "architect_high_usd is added to the remobilization fee when architect time logged on the engagement totals architect_high_minutes minutes or more"
      arch_add: "architect_high_usd is added to the remobilization fee when architect time logged on the engagement totals architect_high_minutes minutes or more, architect_low_usd when some but less architect time is logged, and nothing when none is."
      ah_min: "afterhours_high_usd is added to the remobilization fee when after-hours time logged on the engagement totals afterhours_high_minutes minutes or more"
      ah_add: "afterhours_high_usd is added to the remobilization fee when after-hours time logged on the engagement totals afterhours_high_minutes minutes or more, afterhours_low_usd when some but less is logged, and nothing when none is."
      rco_num: "The restart change order is the signed change order with the highest change order number on the engagement, provided it was registered on or after resumed_date; change orders are numbered in sequence as they are registered."
      rco_at: "provided it was registered on or after resumed_date"
      co_fee_net: "The standard remobilization fee of such a resumption is remobilization_fee_usd less the administration fees posted on the engagement's billing for the restart change order, never below zero, rounded half up to the cent."
      result: "the remobilization fee before deduction is remobilization_fee_usd unless an adjustment figures it another way, the scaling factors that apply are multiplied together and applied once to it, the amounts that apply are then added, the administration fees posted for the restart change order are deducted last, the remobilization fee is never below zero, and it is rounded half up to the cent only at the end."
    factors:
      - id: hold_span
        effect: method
        decides: span_fee
        bindings: [hold_days, hold_months, span_fee]
        ladder:
          - when: "hold of twice max_client_hold_days or longer"
            method: "remobilization_fee_usd + reramp_week_usd per full week beyond max_client_hold_days + remobilization_fee_usd per months_per_quarter full months on hold (months enter the formula)"
          - when: "hold of one and a half times max_client_hold_days or longer but shorter than twice it"
            method: "remobilization_fee_usd + reramp_week_usd per full week beyond max_client_hold_days (weeks enter the formula)"
          - when: "otherwise"
            method: "remobilization_fee_usd flat"
        baseline:
          span_fee: "P('remobilization_fee_usd')"
        evidence: [date]
        cross_difficulty: null
      - id: continuity
        effect: parameter
        decides: cont_factor
        bindings: [cp_tier, cp_seats, cont_factor]
        ladder:
          - when: "active ClearPath Professional, Premier or Enterprise AND 100 or more seats"
            value: "cont_upper_factor scaling of the remobilization fee"
          - when: "active ClearPath Professional, Premier or Enterprise AND fewer than 100 seats"
            value: "cont_lower_factor scaling of the remobilization fee"
          - when: "otherwise"
            value: "no scaling"
        baseline:
          cont_factor: "1.0"
        evidence: [cross_category]
        cross_difficulty: managed
      - id: remaining_work
        effect: parameter
        decides: share_factor
        bindings: [share_pct, share_factor]
        ladder:
          - when: "remaining share share_high_pct percent or more"
            value: "share_high_factor scaling of the remobilization fee"
          - when: "share_mid_pct percent or more but below share_high_pct percent"
            value: "share_mid_factor scaling of the remobilization fee"
          - when: "otherwise"
            value: "no scaling"
        baseline:
          share_factor: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_restart
        effect: parameter
        decides: repeat_add
        bindings: [remob12, repeat_add]
        ladder:
          - when: "two or more remobilization fees posted on the engagement in the twelve months before the invoice date"
            value: "repeat_two_usd added to the remobilization fee"
          - when: "exactly one"
            value: "repeat_one_usd added to the remobilization fee"
          - when: "otherwise"
            value: "nothing"
        baseline:
          repeat_add: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: architect_ramp
        effect: parameter
        decides: arch_add
        bindings: [arch_min, arch_add]
        ladder:
          - when: "architect time logged on the engagement totals architect_high_minutes minutes or more"
            value: "architect_high_usd added to the remobilization fee"
          - when: "some but less architect time logged"
            value: "architect_low_usd added to the remobilization fee"
          - when: "otherwise"
            value: "nothing"
        baseline:
          arch_add: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: after_hours_windows
        effect: parameter
        decides: ah_add
        bindings: [ah_min, ah_add]
        ladder:
          - when: "after-hours time logged on the engagement totals afterhours_high_minutes minutes or more"
            value: "afterhours_high_usd added to the remobilization fee"
          - when: "some but less after-hours time logged"
            value: "afterhours_low_usd added to the remobilization fee"
          - when: "otherwise"
            value: "nothing"
        baseline:
          ah_add: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The restart change order is the signed change order with the highest change order number on the engagement,
        provided it was registered on or after resumed_date; change orders are numbered in sequence as they are
        registered. The standard remobilization fee of such a resumption is remobilization_fee_usd less the administration
        fees posted on the engagement's billing for the restart change order, never below zero, rounded half up to the
        cent.
      params: [remobilization_fee_usd]
    inputs:
      history:
        - {table: project_work_logs, aggregate: sum, field: worked_minutes, filters: {resource_level: architect}}
        - {table: project_work_logs, aggregate: sum, field: worked_minutes, filters: {time_band: after_hours}}
        - {table: project_billing, aggregate: count, field: project_billing_entry_id, within_months: 12, filters: {event_type: project_remobilization_fee}}
        - {table: project_billing, aggregate: sum, field: amount_usd, filters: {event_type: project_change_order_fee}}
      cross_category: [managed]
