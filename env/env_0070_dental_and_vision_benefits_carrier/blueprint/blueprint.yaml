name: env_0070_dental_and_vision_benefits_carrier
company: Cascade Mutual Dental & Vision

background: |
  Cascade Mutual Dental & Vision is a member-owned specialty benefits carrier headquartered in Tacoma, Washington, insuring about 1.4 million members across seven western states through individual policies, the state health insurance exchanges and roughly 9,800 employer groups.
  Its member and provider services center answers calls from subscribers, employer benefits administrators and the dental and vision practices in its networks, in a plain-spoken, patient tone that explains benefits rather than recites them.
  Members hold Dental PPO Plans in six tiers: Cascade Dental PPO Preventive 750, Cascade Dental PPO Value 1000, Cascade Dental PPO Classic 1250, Cascade Dental PPO Plus 1500, Cascade Dental PPO Premier 2000 and Cascade Dental PPO Elite 2500, each held as one enrollment record per covered person that books claim lines, accumulator postings, pre-treatment estimates and appeals.
  Children and adults on eligible dental plans can add Orthodontic Benefit Riders, namely Cascade Ortho Rider Child 1000, Child 1500 and Child 2000 and Cascade Ortho Rider Family 1500, Family 2000 and Family 3000, under which an orthodontic case is established and paid as an initial payment followed by installments against a lifetime maximum.
  Vision Plans come as Cascade Vision Exam Plus, Cascade Vision Essential 100, Cascade Vision Select 130, Cascade Vision Select 150, Cascade Vision Choice 175 and Cascade Vision Premier 200, and book exam, lens, frame and contact-lens claims from independent optometrists and retail optical chains.
  Within its DHMO service area the company also sells Prepaid Dental HMO Plans, Cascade DentalCare DHMO 215, 315, 415, 515, 615 and 715, where each member is assigned to a primary care dentist and services are recorded as copay encounters, referrals and emergency reimbursements.
  For people who want savings rather than insurance it offers Dental and Vision Savings Memberships: Cascade Smile Savings Individual and Household, Cascade Smile & Sight Savings Individual and Household, and Cascade Smile & Sight Savings Plus Individual and Household.
  Every insured plan is funded through a Premium Billing Account held under one of seven arrangements, Cascade Individual Direct Bill Monthly, Cascade Individual AutoPay Monthly, Cascade Individual Quarterly Bill, Cascade Individual Annual Prepay, Cascade Exchange SADP Monthly, Cascade Group List Bill and Cascade Group Self-Administered Bill, whose ledger records invoices, payments, returned payments, fees, credits and refunds.
  Employers hold Employer Group Contracts sized as Cascade Group Dental & Vision 2-19, 20-49, 50-99, 100-249, 250-999 and 1000 Plus, and report member additions, terminations, continuation elections and census counts against them.
  Practices join the networks through Network Participation Agreements: the Cascade PPO Participating Dentist Agreement, the Cascade Premier Participating Dentist Agreement, the Cascade DHMO Primary Care Dentist Agreement, the Cascade DHMO Specialist Agreement, the Cascade Vision Network Provider Agreement and the Cascade Savings Network Participating Provider Agreement, each with a remittance, overpayment and dispute history.
  A typical individual caller is a subscriber with a dental PPO plan for the household, often a vision plan beside it and sometimes an orthodontic rider for a teenager, all funded by one billing account with a year or more of claims and payments behind it.
  Exchange enrollees usually receive an advance premium tax credit, and group members carry plans chosen by their employer, so the same family can appear in several markets over the years.
  Benefits administrators call about their group's enrollment and invoices, while office managers at practices call about credentialing, network status, remittances and overpayment notices.
  Many callers arrive mid-story: a crown denied for frequency, a returned bank draft, a dentist who just left the network, a braces case moving to a new orthodontist, or a pair of glasses ordered before the plan renewed.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: dental_ppo_member_services
    claim:
      categories: [dental]
      event_types: [dental_claim_line_paid, dental_claim_line_denied, dental_claim_line_adjusted, dental_max_posting, dental_max_reversal, dental_deductible_posting, dental_deductible_reversal, dental_rollover_draw, dental_estimate_issued, dental_estimate_voided, dental_appeal_filed, dental_cob_update, dental_tier_change, dental_terminate_voluntary, dental_free_look_cancel]
    summary: >
      Subscribers and dependents on the six Cascade Dental PPO plans call about claims that were denied or paid less than expected, pre-treatment estimates for crowns, implants and root canals, how much of the annual maximum and deductible is left, other coverage that should have paid first, and changing or ending their plan; the setting varies with the plan tier, the market (individual, exchange or group), how and when the person enrolled, documented prior coverage, the family's other enrollments on the same billing account and a claim history spread over several benefit years.
      The records involved are the enrollment, its claim lines, accumulator postings, estimates and appeals, together with the funding billing account and the treating practice's participation agreement; decisions follow a fixed order of eligibility on the date of service (dental_evt_eligibility_on_dos), timely filing (dental_evt_timely_filing), service class, waiting periods (dental_evt_waiting_periods), frequency and age limits (dental_evt_frequency_age_limits) and the missing-tooth clause (dental_evt_missing_tooth_clause) before the per-tier payment calculation of dental_evt_claim_adjudication, the family deductible of dental_agg_family_deductible, coordination of benefits in dental_evt_cob, rollover in dental_evt_rollover and the pediatric override in dental_evt_pediatric_ehb.
      In the domain's natural sequence a service is estimated, performed, adjudicated and posted to the accumulators, and an adverse determination may be appealed within the windows of dental_evt_appeals and reprocessed after a favorable decision, while plan changes, free-look returns and voluntary terminations follow dental_coverage_changes.
      The agent reprocesses lines, posts and reverses accumulators, issues and voids estimates and records other coverage as service actions, whereas filing an appeal and confirming a withdrawal, free-look return, termination or plan change are the subscriber's own acts handed over to them.
      Requests the rules do not decide, such as a retroactive termination or a mid-year plan change outside the allowed occasions, a third appeal level or external review of a dental decision, or a refund of months already covered, can only be handed to a human representative as not covered by policy.
  - name: orthodontic_benefits
    claim:
      categories: [ortho]
      event_types: [ortho_rider_enroll, ortho_case_established, ortho_case_transferred, ortho_case_closed, ortho_initial_payment, ortho_installment_payment, ortho_payment_reversal, ortho_rider_terminate_voluntary]
    summary: >
      Parents and adult members with a Cascade orthodontic rider call to add a rider, to find out whether braces or aligners are covered, how much will be paid up front and per installment, what happens when the family moves to another orthodontist, when coverage ends mid-treatment, or why a payment was taken back; the setting varies with the rider tier, the patient's age at banding, the waiting period counted from the rider's start, documented prior orthodontic coverage, whether treatment began under another carrier, and the person's orthodontic payments under earlier riders.
      The records involved are the rider and its attached dental enrollment, the case establishment, transfer and closure records, and the payment and reversal history, read together with the treating practice's participation agreement and any DHMO enrollment of the same person; the governing shapes are the rider entry rules of ortho_rider_eligibility, the case conditions of ortho_evt_case_eligibility, the per-tier case benefit and schedule of ortho_evt_benefit_calculation, the lifetime maximum of ortho_agg_lifetime_maximum, the installment conditions of ortho_evt_installments, and the transfer, closure and recovery rules of ortho_evt_case_transfer, ortho_evt_case_closure and ortho_evt_payment_reversal.
      In the natural course a rider is added with or after its dental enrollment, a case is established at banding or as a takeover, the initial payment and scheduled installments follow while the rider stays active, and the case closes when treatment ends, coverage ends or the maximum is reached.
      The agent adds riders, establishes, transfers and closes cases and issues or reverses payments as service actions, while withdrawing a rider application or ending a rider is the subscriber's own decision confirmed by them.
      Requests outside the rules, such as paying a second comprehensive case after a completed one, paying more than the case benefit for a longer treatment, or covering treatment fees of a practice that refuses to submit the case, can only be transferred to a human representative as not covered by policy.
  - name: vision_member_services
    claim:
      categories: [vision]
      event_types: [vision_exam_claim, vision_lens_claim, vision_frame_claim, vision_contacts_claim, vision_claim_reversal, vision_tier_change, vision_terminate_voluntary, vision_free_look_cancel, vision_reinstate]
    summary: >
      Members on the six Cascade vision plans call about what an exam, glasses or contact lenses will cost, why a frame or lens order was denied as too soon, whether contacts count instead of glasses, how much an out-of-network receipt will return, and changing, returning or reinstating their plan; the setting varies with the plan tier, whether frequencies are counted from the last service or by benefit period, the patient's age, the provider's network channel (independent practice, retail chain or out of network) and the household's service history across earlier enrollments.
      The records involved are the enrollment, its claim services and reversals, the funding billing account and the provider's agreement; frequencies follow vision_evt_frequency, in-network copays, allowances and discounts follow the per-tier vision_evt_in_network_benefits, out-of-network amounts follow vision_evt_oon_reimbursement, medically necessary contacts follow vision_evt_medically_necessary_contacts, eligibility and filing limits follow vision_evt_eligibility_timely_filing, and changes follow vision_coverage_changes and vision_reinstatement.
      In the natural course an exam precedes the eyewear order, each service uses its frequency, a service paid in error is reversed, and coverage ended for nonpayment can be reinstated only after the funding account is.
      The agent adjudicates and reverses services, reinstates coverage and carries out confirmed changes as service actions, while returning a plan, ending coverage and changing plans are the subscriber's own decisions confirmed by them.
      Requests outside the rules, such as replacing lost or broken glasses before the frequency allows, paying for non-prescription sunglasses, or taking back an order after it was placed, can only be transferred to a human representative as not covered by policy.
  - name: premium_billing_and_grace
    claim:
      categories: [billing]
      event_types: [billing_payment_received, billing_payment_returned, billing_returned_payment_fee, billing_premium_credit, billing_refund_issued, billing_grace_cured, billing_reinstate, billing_payment_method_change, billing_paid_through_update, billing_account_close]
    summary: >
      Individual subscribers, exchange enrollees and group benefits administrators call about what they owe, a payment that bounced and the fee that followed, being in a grace period, coverage that lapsed and whether it can be reinstated, credits and refunds after a cancellation or termination, switching how they pay and closing an account; the setting varies with the billing arrangement, whether an advance premium tax credit is received, the plans and coverage tiers the account funds, the paid-through date and a ledger of invoices, payments, returns and credits.
      The records involved are the billing account and its ledger, read together with the dental, vision, orthodontic and DHMO enrollments it funds and, for groups, the group contract; premium follows billing_evt_invoicing, payment application and the paid-through date follow billing_evt_payment_application, returns and fees follow the per-tier billing_evt_returned_payment, grace and lapse follow billing_grace_and_lapse, reinstatement follows billing_reinstatement, credits and refunds follow billing_credits_refunds and billing_agg_credit_application, and account changes follow billing_account_lifecycle.
      In the natural course an invoice is followed by a payment, an unpaid due date opens the grace period, an uncured grace period lapses the account and ends the funded coverage, and a timely full payment can reinstate it.
      The agent books payments, returns, fees, credits and refunds, advances the paid-through date, cures grace and reinstates accounts as service actions, while authorizing a new payment method and closing an account are the account holder's own decisions confirmed by them.
      Requests outside the rules, such as waiving premium for months already covered, reinstating an exchange account after its grace period, or extending a grace period, can only be transferred to a human representative as not covered by policy.
  - name: provider_network_services
    claim:
      categories: [provider]
      event_types: [provider_termination_notice, provider_notice_rescinded, provider_overpayment_recouped, provider_overpayment_refund_received, provider_overpayment_reduced, provider_dispute_filed, provider_panel_status_change, provider_recredentialed, provider_remittance_issued]
    summary: >
      Office managers and billing staff at dental and vision practices call about leaving or staying in a network, opening or closing a panel, recredentialing, late claim payments and interest, and overpayment notices they want to refund, dispute or see offset; the setting varies with the agreement type, the rendering provider's specialty and location type, the agreement's status and notice dates, the credentials on file and the practice's history of remittances, overpayments and disputes across all of its agreements.
      The records involved are the participation agreements, the payment and overpayment ledger and the dispute records, read together with the member claim lines, vision services and orthodontic payments an overpayment arose from; notice periods follow provider_termination_without_cause, credentialing follows provider_credentialing and provider_recredentialing, overpayments follow provider_evt_overpayment with practice-level offsetting in the per-tier provider_agg_practice_offset, disputes follow provider_evt_disputes, payments follow provider_evt_remittance, and panels and fees follow provider_fee_schedule_and_panel.
      In the natural course an overpayment notice opens refund and dispute windows, a dispute suspends offsetting until resolved, and only an undisputed balance past the refund window is offset against later remittances; a termination notice keeps the provider in network until the termination date.
      The agent records offsets, refunds, reductions, recredentialing, remittances and confirmed panel and notice changes as service actions, while giving or rescinding a termination notice and disputing an overpayment are the practice's own acts.
      Requests outside the rules, such as negotiating a practice-specific fee schedule, waiving a valid overpayment as a courtesy, or reinstating an agreement ended for cause before the re-application wait, can only be transferred to a human representative as not covered by policy.
