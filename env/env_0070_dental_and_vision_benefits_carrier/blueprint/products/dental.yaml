category: dental
display_name: Dental PPO Plans

binding:
  holding_table: dental_plans
  event_tables: [dental_claim_lines, dental_accumulator_postings, dental_pretreatment_estimates, dental_appeals]
  intake_tables: [dental_coverage_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [applied, active, terminated, cancelled]
  transitions:
    - {from: applied, to: active, by: system, means: "Coverage starts on the coverage effective date once the first (binder) premium for the funding billing account has been received."}
    - {from: applied, to: cancelled, by: user, means: "The applicant withdraws the application before the coverage effective date."}
    - {from: applied, to: cancelled, by: system, means: "The binder premium was not received by the binder deadline, so the application is cancelled and coverage never starts."}
    - {from: active, to: cancelled, by: user, means: "An individual-market subscriber returns the policy within the free-look period; coverage is void from the start."}
    - {from: active, to: terminated, by: user, means: "The subscriber asks to end coverage; it ends on the last day of the month in which the request is confirmed."}
    - {from: active, to: terminated, by: system, means: "Coverage ends because the funding billing account lapsed for nonpayment, the person lost eligibility (for example a child reaching the dependent age limit) or the sponsoring group contract ended."}
    - {from: terminated, to: active, by: agent, means: "Coverage ended for nonpayment is reinstated without a gap once the billing account is reinstated within the reinstatement window."}

accounts:
  - key: annual_maximum_used
    unit: USD
    meaning: Plan payments counted against the person's annual maximum in a benefit period.
  - key: deductible_satisfied
    unit: USD
    meaning: Allowed charges the person has applied to the deductible in a benefit period.
  - key: rollover_balance
    unit: USD
    meaning: Unused-maximum rollover dollars banked for the person that extend the annual maximum once it is exhausted (Premier and Elite plans only).
  - key: pediatric_oop_accumulated
    unit: USD
    meaning: Cost sharing paid by enrollees under age 19 on exchange-filed plans toward the pediatric out-of-pocket maximum in a benefit period.

parameter_schema:
  annual_maximum_per_person: "USD per person per benefit period; the most the plan pays for that person's covered services (subject to the preventive-exclusion switch and rollover)"
  deductible_individual: "USD per person per benefit period applied to basic and major services before coinsurance; 0.00 = no deductible"
  deductible_family_maximum: "USD per benefit period; once the enrollments of one subscriber have together applied this much to deductibles, no further deductible is taken for any of them; 0.00 = no deductible"
  deductible_waived_preventive: "boolean; true = no deductible is taken on preventive-class lines"
  coinsurance_preventive_in_network: "integer percent the plan pays on preventive-class lines at a participating practice"
  coinsurance_basic_in_network: "integer percent the plan pays on basic-class lines at a participating practice; 0 = class not covered"
  coinsurance_major_in_network: "integer percent the plan pays on major-class lines at a participating practice; 0 = class not covered"
  coinsurance_preventive_oon: "integer percent the plan pays on preventive-class lines at a non-participating practice"
  coinsurance_basic_oon: "integer percent the plan pays on basic-class lines at a non-participating practice; 0 = class not covered"
  coinsurance_major_oon: "integer percent the plan pays on major-class lines at a non-participating practice; 0 = class not covered"
  premier_network_access: "boolean; true = practices holding a Cascade Premier Participating Dentist Agreement count as in-network (in_network_premier) for this plan; false = they are paid as out-of-network"
  oon_reimbursement_basis: "enum string; allowance used for out-of-network lines: ppo_fee_schedule (Cascade PPO fee schedule for the practice ZIP), premier_fee_schedule, ucr_80th_percentile or ucr_90th_percentile (Cascade usual-and-customary table); the practice may balance-bill the difference"
  service_class_map: "mapping procedure_category -> service class (preventive/basic/major/not_covered) under this plan"
  annual_max_applies_to_preventive: "boolean; false = plan payments on preventive-class lines are not posted to the annual maximum and are still paid after the maximum is met"
  wait_basic_months_individual: "calendar months from coverage_effective_date before basic-class services are payable for individual and individual_exchange enrollments; 0 = none or class not covered"
  wait_major_months_individual: "calendar months from coverage_effective_date before major-class services are payable for individual and individual_exchange enrollments; 0 = none or class not covered"
  wait_basic_months_late_entrant: "calendar months from coverage_effective_date before basic-class services are payable for group late entrants; group enrollees entering at open enrollment, as new hires or by special enrollment have none"
  wait_major_months_late_entrant: "calendar months from coverage_effective_date before major-class services are payable for group late entrants"
  prior_coverage_credit_method: "enum string; none = documented prior coverage gives no credit; month_for_month = each documented month of prior coverage shortens every waiting period by one month"
  prior_coverage_max_gap_days: "calendar days; prior coverage earns waiting-period credit only if it ended no more than this many days before coverage_effective_date"
  upgrade_waiting_period_applies: "boolean; true = after an upgrade, benefits that are new or richer under the new plan carry the new plan's waiting periods counted from tier_change_effective_date, while benefits already payable under the prior plan stay payable at the prior plan's level until then"
  frequency_exam_per_benefit_year: "count of periodic, comprehensive or limited oral evaluations payable per person per benefit period"
  frequency_prophylaxis_per_benefit_year: "count of prophylaxis cleanings payable per person per benefit period"
  frequency_perio_cleanings_combined: "count of prophylaxis plus periodontal maintenance visits combined payable per person per benefit period; 0 = periodontal maintenance not covered"
  frequency_bitewing_interval_months: "months; one set of bitewing x-rays per this many months, counted from the last paid bitewing date of service"
  frequency_fmx_pano_interval_months: "months; one full-mouth series or panoramic film per this many months, counted from the last paid one"
  fluoride_age_limit_years: "age in years; topical fluoride is payable only for patients who have not reached this birthday on the date of service"
  frequency_fluoride_per_benefit_year: "count of topical fluoride applications payable per person per benefit period"
  sealant_age_limit_years: "age in years; sealants on permanent molars are payable only for patients who have not reached this birthday on the date of service"
  sealant_interval_months: "months; one sealant per tooth per this many months"
  srp_interval_months: "months; scaling and root planing payable once per quadrant per this many months; 0 = not covered"
  crown_replacement_interval_months: "months; a crown on the same tooth is payable once per this many months counted from the prior crown's date of service; 0 = crowns not covered"
  prosthetic_replacement_interval_months: "months; a bridge or denture replacing the same teeth is payable once per this many months; 0 = not covered"
  implant_interval_months: "months; one implant per tooth position per this many months; 0 = implants not covered"
  missing_tooth_clause_months: "months; a bridge, denture or implant replacing a tooth extracted before coverage_effective_date is not payable until the enrollment has been continuously active this many months; 0 = no missing-tooth clause"
  posterior_composite_alternate_benefit: "boolean; true = posterior composite fillings are paid on the amalgam allowance (alternate_allowed_amount)"
  molar_crown_alternate_benefit: "boolean; true = porcelain or ceramic crowns on molars are paid on the full-cast base-metal crown allowance (alternate_allowed_amount)"
  dependent_child_age_limit: "age in years; a child's enrollment ends at the end of the month in which the child reaches this birthday"
  pediatric_ehb_age_limit_years: "age in years; on individual_exchange enrollments a covered person who has not reached this birthday on the date of service receives the pediatric essential-health-benefit treatment (no annual maximum, out-of-pocket maximum applies)"
  pediatric_oop_max_one_child: "USD per benefit period; pediatric out-of-pocket maximum for one covered child on an individual_exchange enrollment; 0.00 = plan is not exchange-filed"
  pediatric_oop_max_two_plus: "USD per benefit period; combined pediatric out-of-pocket maximum when two or more children of the subscriber are enrolled on individual_exchange enrollments; 0.00 = plan is not exchange-filed"
  rollover_enabled: "boolean; true = the plan banks unused annual maximum into rollover_balance at the end of each benefit period"
  rollover_claims_threshold: "USD; a person qualifies for a rollover credit only if plan payments posted to the annual maximum for the benefit period are greater than 0.00 and no more than this amount; 0.00 when rollover is not offered"
  rollover_credit_amount: "USD credited to rollover_balance for each qualifying benefit period; 0.00 when rollover is not offered"
  rollover_balance_cap: "USD; rollover_balance may never exceed this amount (a credit is reduced to fit); 0.00 when rollover is not offered"
  rollover_min_months_enrolled: "calendar months the person must have been continuously active in the benefit period to earn a rollover credit; 0 when rollover is not offered"
  timely_filing_days_in_network: "calendar days after date_of_service within which a participating practice must submit a claim"
  timely_filing_days_oon: "calendar days after date_of_service within which a member or non-participating practice must submit a claim"
  estimate_recommended_threshold: "USD; pre-treatment estimates are recommended (not required) for proposed treatment whose proposed fee exceeds this amount"
  estimate_valid_days: "calendar days after issued_date through which an estimate applies (valid_through = issued_date + this value)"
  estimate_turnaround_business_days: "business days (Monday-Friday excluding federal holidays) from received_date within which an estimate is issued"
  appeal_filing_window_days: "calendar days after the adverse determination (adjudicated_date of the line, or issued_date of the estimate) within which a first-level appeal may be filed"
  second_level_filing_window_days: "calendar days after a first-level decision within which a second-level appeal may be filed (group enrollments only)"
  appeal_decision_days_post_service_group: "calendar days from filed_date to decide each level of a post-service appeal on a group enrollment"
  appeal_decision_days_post_service_individual: "calendar days from filed_date to decide the single-level post-service appeal on an individual or individual_exchange enrollment"
  appeal_decision_days_pre_service: "calendar days from filed_date to decide each level of a pre-service appeal"
  free_look_days: "calendar days after coverage_effective_date during which an individual or individual_exchange subscriber may return the policy for a full premium refund"
  reinstatement_window_days: "calendar days after termination_date within which coverage ended for nonpayment may be reinstated"
  reenrollment_lockout_months: "calendar months after a voluntary termination_date during which the same person may not re-enroll in any Cascade individual-market dental PPO plan"
  special_enrollment_window_days: "calendar days after a qualifying event (marriage, birth, adoption, loss of other coverage) within which a group special enrollment must be requested"
  special_enrollment_window_days_medicaid_chip: "calendar days after loss of Medicaid or CHIP coverage within which a group special enrollment must be requested"
  binder_deadline_days: "calendar days after coverage_effective_date by which the binder premium must be received before the application is cancelled"
  monthly_premium_member_only: "USD per month, individual-market rate for coverage_tier member_only"
  monthly_premium_member_spouse: "USD per month, individual-market rate for coverage_tier member_spouse"
  monthly_premium_member_children: "USD per month, individual-market rate for coverage_tier member_children"
  monthly_premium_family: "USD per month, individual-market rate for coverage_tier family"
  cob_method: "enum string; how this plan pays when secondary: non_duplication = pays its normal benefit minus the primary payment, never below 0.00; standard_cob = pays the lesser of its normal benefit and the remaining balance of the allowed amount after the primary payment"
  rounding_rule: "enum string; how computed amounts are rounded: half_up_cents = round each computed line amount to the nearest cent, halves rounded up"

