category: dhmo
display_name: Prepaid Dental HMO Plans

binding:
  holding_table: dhmo_plans
  event_tables: [dhmo_services]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [applied, active, terminated, cancelled]
  transitions:
    - {from: applied, to: active, by: system, means: "Coverage starts on the coverage effective date once the binder premium is received and a primary care dentist is assigned."}
    - {from: applied, to: cancelled, by: user, means: "The applicant withdraws before the coverage effective date."}
    - {from: active, to: terminated, by: user, means: "The subscriber ends coverage at the end of the month."}
    - {from: active, to: terminated, by: system, means: "Coverage ends for nonpayment, loss of eligibility, a move out of the service area or end of the group contract."}

accounts: []

parameter_schema:
  copay_office_visit: "USD per primary care office visit in addition to procedure copays"
  copay_periodic_exam: "USD per periodic or comprehensive exam"
  copay_prophylaxis_adult: "USD per adult cleaning"
  copay_prophylaxis_child: "USD per child cleaning"
  cleanings_per_year: "count of cleanings per benefit year at the scheduled copay; further cleanings at the provider's usual fee"
  copay_xray_full_mouth: "USD per full-mouth series or panoramic film"
  copay_fluoride_sealant: "USD per fluoride application or sealant per tooth for a child"
  copay_amalgam_one_surface: "USD per one-surface amalgam filling"
  copay_composite_anterior_one_surface: "USD per one-surface anterior composite filling"
  copay_composite_posterior_one_surface: "USD per one-surface posterior composite filling"
  copay_simple_extraction: "USD per simple extraction"
  copay_surgical_extraction: "USD per surgical extraction of an erupted tooth"
  copay_root_canal_anterior: "USD per anterior root canal"
  copay_root_canal_molar: "USD per molar root canal"
  copay_srp_per_quadrant: "USD per quadrant of scaling and root planing"
  copay_perio_maintenance: "USD per periodontal maintenance visit"
  copay_crown_porcelain_base_metal: "USD per porcelain-fused-to-base-metal crown"
  noble_metal_upcharge: "USD additional per crown or pontic using noble or high-noble metal"
  copay_complete_denture: "USD per complete upper or lower denture"
  implant_covered: "boolean; true = endosteal implants are covered at copay_implant"
  copay_implant: "USD per implant body when implant_covered; 0.00 when not covered"
  copay_emergency_palliative: "USD per palliative emergency treatment at the assigned primary care dentist"
  copay_missed_appointment: "USD the primary care dentist may charge for an appointment missed without 24 hours notice"
  ortho_child_copay: "USD member copay for comprehensive orthodontics for a patient under ortho_child_age_limit_years at banding, covering ortho_treatment_months of treatment"
  ortho_adult_copay: "USD member copay for comprehensive adult orthodontics"
  ortho_retention_copay: "USD copay for retention (retainers and retention visits) after active treatment"
  ortho_treatment_months: "months of active treatment covered by the orthodontic copay; each month beyond is at the orthodontist's monthly fee"
  ortho_child_age_limit_years: "age in years; child orthodontic copay applies when banding occurs before this birthday"
  specialist_copay_basis: "enum string; specialist services carry the same copays as the schedule (same_schedule)"
  referral_required: "boolean; true = specialist services are covered only with a valid referral from the assigned primary care dentist"
  referral_valid_days: "calendar days after the referral issue date through which it may be used"
  referral_turnaround_business_days: "business days to decide a routine referral request"
  pediatric_dentist_referral_age_limit: "age in years; a child may be referred to a pediatric dentist before this birthday"
  pcd_change_cutoff_day: "day of month; a primary care dentist change requested on or before this day takes effect on the first of the next month, later requests on the first of the month after"
  pcd_changes_per_benefit_year: "count of primary care dentist changes allowed per benefit year (changes forced by the dentist leaving the network do not count)"
  pcd_change_blocked_in_treatment: "boolean; true = a change is not processed while a multi-visit procedure (crown, bridge, denture, root canal) started by the current dentist is unfinished"
  emergency_oon_reimbursement_max: "USD most reimbursed per out-of-area emergency incident"
  emergency_oon_min_distance_miles: "miles; an out-of-network emergency is reimbursed only if it occurred more than this distance from the assigned primary care dentist"
  emergency_oon_claim_days: "calendar days after the emergency within which the member must submit the receipt"
  service_area_states: "list of states where DHMO coverage is offered; the subscriber must reside there"
  out_of_area_disenrollment: "enum string; end_of_month_after_notice = coverage ends on the last day of the month after the move is reported"
  waiting_period_months: "months before any service is covered; 0 = none"
  annual_maximum_applies: "boolean; false = no annual dollar maximum"
  deductible_amount: "USD deductible; 0.00 = none"
  monthly_premium_member_only: "USD per month individual rate, member_only"
  monthly_premium_member_spouse: "USD per month individual rate, member_spouse"
  monthly_premium_member_children: "USD per month individual rate, member_children"
  monthly_premium_family: "USD per month individual rate, family"
  reenrollment_lockout_months: "calendar months after a voluntary termination during which the person may not re-enroll in an individual DHMO"
  dependent_child_age_limit: "age in years; a child's enrollment ends at the end of the month of this birthday"
  cosmetic_covered: "boolean; false = cosmetic services (whitening, veneers) are not covered"

