events:
  - type: dhmo_enroll
    target: dhmo_plans
    mutation: create
    meaning: A DHMO application or election for one person is accepted with a primary care dentist assignment.
    grain: One row per enrolled person per continuous enrollment.
    fields:
      customer_id: Subscriber.
      billing_account_id: Funding billing account.
      group_contract_id: Group contract; empty for individual.
      variant_name: Plan elected.
      market_segment: Market.
      coverage_tier: Coverage tier.
      enrollee_name: Covered person.
      enrollee_date_of_birth: Date of birth.
      enrollee_relationship: Relationship.
      assigned_pcd_agreement_id: Primary care dentist chosen or assigned.
      pcd_effective_date: Same as coverage_effective_date.
      application_date: Receipt date.
      coverage_effective_date: First day of coverage.
    triggers: []
  - type: dhmo_activate
    target: dhmo_plans
    mutation: {transition: {from: applied, to: active}}
    meaning: Coverage starts on the effective date.
    grain: One row per transaction.
    fields:
      coverage_effective_date: Date coverage starts.
    triggers: []
  - type: dhmo_application_withdraw
    target: dhmo_plans
    mutation: {transition: {from: applied, to: cancelled}}
    meaning: The applicant withdraws before coverage starts.
    grain: One row per transaction.
    fields:
      termination_date: coverage_effective_date minus one day.
      termination_reason: application_withdrawn.
    triggers: []
  - type: dhmo_terminate_voluntary
    target: dhmo_plans
    mutation: {transition: {from: active, to: terminated}}
    meaning: The subscriber ends DHMO coverage.
    grain: One row per transaction.
    fields:
      termination_date: Last day of the month of the request.
      termination_reason: voluntary.
    triggers: []
  - type: dhmo_terminate_nonpayment
    target: dhmo_plans
    mutation: {transition: {from: active, to: terminated}}
    meaning: Coverage ends because the funding billing account lapsed.
    grain: One row per transaction.
    fields:
      termination_date: The billing account's paid-through date.
      termination_reason: nonpayment.
    triggers: []
  - type: dhmo_terminate_ineligible
    target: dhmo_plans
    mutation: {transition: {from: active, to: terminated}}
    meaning: Coverage ends for loss of eligibility, a move out of the service area or end of the group contract.
    grain: One row per transaction.
    fields:
      termination_date: Date per the termination rule.
      termination_reason: loss_of_eligibility, moved_out_of_service_area or group_terminated.
    triggers: []
  - type: dhmo_pcd_change
    target: dhmo_plans
    mutation: update
    meaning: The person's primary care dentist assignment changes.
    grain: One row per transaction.
    fields:
      assigned_pcd_agreement_id: New primary care dentist agreement.
      pcd_effective_date: Effective date of the new assignment.
    triggers: []
  - type: dhmo_pcd_service
    target: dhmo_services
    meaning: A service performed by the assigned primary care dentist is recorded with its scheduled copay.
    grain: One row per encounter line.
    distinguish_by: [encounter_number, line_number]
    fields:
      encounter_number: Encounter reference.
      line_number: Line.
      provider_agreement_id: Treating primary care dentist.
      cdt_code: Procedure.
      procedure_category: Schedule category.
      tooth_or_area: Tooth or area.
      date_of_service: Service date.
      member_copay: Scheduled copay.
      noble_metal_upcharge: Metal upcharge, if any.
      service_remark: COVERED_COPAY, NOT_COVERED or NOT_ASSIGNED_PCD.
    triggers: []
  - type: dhmo_specialist_referral
    target: dhmo_services
    meaning: The assigned primary care dentist requests a specialist referral and Cascade decides it.
    grain: One row per referral.
    distinguish_by: [encounter_number]
    fields:
      encounter_number: Referral reference.
      provider_agreement_id: Specialist referred to.
      cdt_code: Procedure referred.
      procedure_category: Schedule category.
      specialist_type: Specialty.
      tooth_or_area: Tooth or area.
      date_of_service: Referral issue date.
      referral_valid_through: Last date of use.
      service_remark: REFERRAL_APPROVED or REFERRAL_DENIED.
    triggers: []
  - type: dhmo_specialist_service
    target: dhmo_services
    meaning: A specialist service is recorded under a referral with its scheduled copay.
    grain: One row per specialist encounter line.
    distinguish_by: [encounter_number, line_number]
    fields:
      encounter_number: Encounter reference.
      line_number: Line.
      provider_agreement_id: Treating specialist.
      cdt_code: Procedure.
      procedure_category: Schedule category.
      specialist_type: Specialty.
      tooth_or_area: Tooth or area.
      date_of_service: Service date.
      member_copay: Scheduled copay.
      service_remark: COVERED_COPAY, NO_VALID_REFERRAL or NOT_COVERED.
      referral_service_id: Referral used.
    triggers: []
  - type: dhmo_emergency_reimbursement
    target: dhmo_services
    meaning: An out-of-area emergency treated by a non-network dentist is reimbursed to the member.
    grain: One row per emergency incident.
    distinguish_by: [encounter_number]
    fields:
      encounter_number: Reimbursement reference.
      cdt_code: Palliative procedure.
      procedure_category: emergency_palliative.
      date_of_service: Emergency date.
      distance_from_pcd_miles: Distance from the assigned dentist.
      reimbursed_amount: Amount reimbursed.
      service_remark: EMERGENCY_REIMBURSED or EMERGENCY_DENIED.
    triggers: []

measures:
  - id: dhmo_msr_pcd_changes_year
    window: The benefit year (calendar year for individual, plan year for group) containing the request.
    measure: Count of dhmo_pcd_change events for the person in the window that were requested by the member.
  - id: dhmo_msr_cleanings_year
    window: The benefit year containing the date of service.
    measure: Count of dhmo_pcd_service rows with procedure_category cleaning and remark COVERED_COPAY for the person.

policies:
  - id: dhmo_agg_multi_holding
    subject: [dhmo_enroll]
    rule: >-
      A subscriber may hold one DHMO enrollment per covered person, with no fixed cap per subscriber; a person may not have a second applied or active Cascade DHMO enrollment.
      Each covered person has an own primary care dentist assignment; family members may be assigned to different dentists.
    eligibility: []
    params:
      max_per_customer: null

  - id: dhmo_agg_plan_unit
    subject: [dhmo_enroll, dhmo_terminate_voluntary]
    rule: >-
      All DHMO enrollments of one subscriber on the same billing account form one plan unit with the same plan and coverage tier and are charged one monthly premium for the coverage tier.
      A voluntary termination of the subscriber's enrollment ends every enrollment of the unit on the same date; a dependent's enrollment may be ended alone, which changes the coverage tier and the premium from the first of the following month.
    eligibility: []
    params:
      per_tier:
        Cascade DentalCare DHMO 215: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade DentalCare DHMO 315: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade DentalCare DHMO 415: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade DentalCare DHMO 515: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade DentalCare DHMO 615: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade DentalCare DHMO 715: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}

  - id: dhmo_enrollment_eligibility
    subject: [dhmo_enroll, dhmo_activate]
    rule: >-
      A DHMO enrollment may be opened only for a subscriber residing in one of the service_area_states, for a plan whose entry gate admits the market, and with an assigned primary care dentist who holds an active Cascade DHMO Primary Care Dentist Agreement with an open panel in the subscriber's state.
      A person who holds an applied or active Cascade orthodontic rider may not enroll in a DHMO, because the rider and the DHMO orthodontic copay schedule are mutually exclusive.
      Individual applications take effect on the first of the month following receipt and group enrollments on the group's effective dates; there is no waiting period, deductible or annual maximum.
      Coverage starts on the coverage effective date once the binder premium is received on the funding billing account.
    eligibility:
      - id: no_open_ortho_rider
        applies_to: [dhmo_enroll]
        kind: state
        condition: A person who holds an applied or active Cascade orthodontic rider may not enroll in a DHMO, because the rider and the DHMO orthodontic copay schedule are mutually exclusive.
        evidence_fields: [ortho_riders.status, ortho_riders.enrollee_name, ortho_riders.enrollee_date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ortho_riders.enrollee_name, ortho_riders.enrollee_date_of_birth]
          action_bindings:
            ortho_riders.enrollee_name: enrollee_name
            ortho_riders.enrollee_date_of_birth: enrollee_date_of_birth
        state_contract:
          field: ortho_riders.status
          allowed: [terminated, cancelled]

  - id: dhmo_coverage_end
    subject: [dhmo_application_withdraw, dhmo_terminate_voluntary, dhmo_terminate_nonpayment, dhmo_terminate_ineligible]
    rule: >-
      Withdrawing an application and ending coverage are the subscriber's own decisions; an application may be withdrawn any time before the effective date, and a voluntary termination ends coverage on the last day of the month in which it is made, after which the re-enrollment lockout (reenrollment_lockout_months) applies to individual DHMO enrollment.
      Coverage ends for nonpayment on the funding billing account's paid-through date when the account lapses; a child's coverage ends at the end of the month of the dependent_child_age_limit birthday; a subscriber who moves out of the service area is disenrolled under out_of_area_disenrollment; group enrollments end with the group contract.
      Services after the termination date are at the dentist's usual fees, and an orthodontic case in progress continues only at the orthodontist's own fees.
    eligibility: []

  - id: dhmo_pcd_assignment
    subject: [dhmo_pcd_change]
    rule: >-
      A member may change primary care dentist up to pcd_changes_per_benefit_year times per benefit year (dhmo_msr_pcd_changes_year); a change requested on or before the pcd_change_cutoff_day of a month takes effect on the first day of the next month, and a later request on the first day of the month after.
      The new dentist must hold an active Cascade DHMO Primary Care Dentist Agreement with an open panel; a change is not processed while a multi-visit procedure started by the current dentist is unfinished when pcd_change_blocked_in_treatment is true.
      When the assigned dentist's agreement is ending, Cascade reassigns the member before its termination date and that change does not count toward the limit.
    eligibility:
      - id: new_pcd_active_open
        applies_to: [dhmo_pcd_change]
        kind: state
        condition: The new dentist must hold an active Cascade DHMO Primary Care Dentist Agreement with an open panel; a change is not processed while a multi-visit procedure started by the current dentist is unfinished when pcd_change_blocked_in_treatment is true.
        evidence_fields: [provider_agreements.status, provider_agreements.panel_status, provider_agreements.provider_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [provider_agreements.provider_agreement_id]
          action_bindings:
            provider_agreements.provider_agreement_id: assigned_pcd_agreement_id
        state_contract:
          field: provider_agreements.status
          allowed: [active]
    measures: [dhmo_msr_pcd_changes_year]

  - id: dhmo_evt_copay_schedule
    subject: [dhmo_pcd_service, dhmo_specialist_service]
    rule: >-
      Covered services are performed by the assigned primary care dentist (or by a specialist under a valid referral) and the member pays only the scheduled copay for the procedure category plus copay_office_visit per primary care visit; the dentist is paid by capitation and may not bill more.
      Crowns and pontics using noble or high-noble metal add noble_metal_upcharge; cleanings beyond cleanings_per_year in a benefit year (dhmo_msr_cleanings_year) and cosmetic services are at the dentist's usual fee; implants are covered at copay_implant only when implant_covered is true.
      A service by a network dentist who is not the member's assigned primary care dentist on the date of service, other than an emergency, is not covered (NOT_ASSIGNED_PCD).
      Comprehensive orthodontics costs the member ortho_child_copay when banding occurs before ortho_child_age_limit_years, otherwise ortho_adult_copay, for ortho_treatment_months of active treatment, plus ortho_retention_copay for retention; a missed appointment without notice may be charged copay_missed_appointment.
    eligibility: []
    params:
      per_tier:
        Cascade DentalCare DHMO 215: {crown: "=copay_crown_porcelain_base_metal", molar_endo: "=copay_root_canal_molar", ortho_child: "=ortho_child_copay"}
        Cascade DentalCare DHMO 315: {crown: "=copay_crown_porcelain_base_metal", molar_endo: "=copay_root_canal_molar", ortho_child: "=ortho_child_copay"}
        Cascade DentalCare DHMO 415: {crown: "=copay_crown_porcelain_base_metal", molar_endo: "=copay_root_canal_molar", ortho_child: "=ortho_child_copay"}
        Cascade DentalCare DHMO 515: {crown: "=copay_crown_porcelain_base_metal", molar_endo: "=copay_root_canal_molar", ortho_child: "=ortho_child_copay"}
        Cascade DentalCare DHMO 615: {crown: "=copay_crown_porcelain_base_metal", molar_endo: "=copay_root_canal_molar", ortho_child: "=ortho_child_copay"}
        Cascade DentalCare DHMO 715: {crown: "=copay_crown_porcelain_base_metal", molar_endo: "=copay_root_canal_molar", ortho_child: "=ortho_child_copay"}
    measures: [dhmo_msr_cleanings_year]

  - id: dhmo_evt_specialist_referral
    subject: [dhmo_specialist_referral, dhmo_specialist_service]
    rule: >-
      A specialist service is covered only under a referral requested by the assigned primary care dentist and approved by Cascade, to a specialist holding an active Cascade DHMO Specialist Agreement, and only if performed on or before the referral's valid-through date (issue date plus referral_valid_days).
      Routine referrals are decided within referral_turnaround_business_days; a referral is approved when the procedure is beyond the scope of general dentistry for the case, and a child may be referred to a pediatric dentist only before the pediatric_dentist_referral_age_limit birthday.
      A specialist service without a valid referral is NO_VALID_REFERRAL and the member owes the specialist's usual fee; the specialist copay follows specialist_copay_basis.
    eligibility: []

  - id: dhmo_evt_emergency
    subject: [dhmo_emergency_reimbursement]
    rule: >-
      Emergency palliative treatment by a non-network dentist is reimbursed to the member only when the emergency occurred more than emergency_oon_min_distance_miles from the assigned primary care dentist and the receipt is submitted within emergency_oon_claim_days calendar days; the reimbursement is the amount paid up to emergency_oon_reimbursement_max per incident.
      Follow-up and definitive treatment must be done by the assigned primary care dentist; an emergency within the distance is treated by the assigned dentist at copay_emergency_palliative and is not reimbursed.
    eligibility: []
