events:
  - type: group_contract_apply
    target: group_contracts
    mutation: create
    meaning: An employer's group application is accepted for underwriting.
    grain: One row per group contract.
    fields:
      customer_id: Employer.
      variant_name: Size segment by eligible employees.
      group_number: Group number assigned.
      situs_state: Situs state.
      contribution_type: Contribution type.
      employer_contribution_pct: Employer share.
      dental_variant_offered: Dental plan offered.
      vision_variant_offered: Vision plan offered.
      dental_rate_member_only: Quoted dental rate.
      dental_rate_member_spouse: Quoted dental rate.
      dental_rate_member_children: Quoted dental rate.
      dental_rate_family: Quoted dental rate.
      vision_rate_member_only: Quoted vision rate.
      vision_rate_family: Quoted vision rate.
      eligible_employees: Eligible employees on the census.
      new_hire_waiting_days: Employer's new-hire waiting period.
      effective_date: Requested effective date.
      renewal_date: First anniversary.
      rate_guarantee_end_date: End of the initial rate guarantee.
    triggers: []
  - type: group_contract_activate
    target: group_contracts
    mutation: {transition: {from: applied, to: active}}
    meaning: The contract takes effect.
    grain: One row per transaction.
    fields:
      effective_date: First day of the contract.
    triggers: []
  - type: group_contract_withdraw
    target: group_contracts
    mutation: {transition: {from: applied, to: cancelled}}
    meaning: The employer withdraws the application before the effective date.
    grain: One row per transaction.
    fields:
      termination_date: effective_date minus one day.
      termination_reason: application_withdrawn.
    triggers: []
  - type: group_contract_terminate
    target: group_contracts
    mutation: {transition: {from: active, to: terminated}}
    meaning: The employer ends the contract with written notice.
    grain: One row per transaction.
    fields:
      termination_date: Last day of the month in which the notice period ends.
      termination_reason: employer_request.
    triggers:
      - event: dental:dental_terminate_ineligible
        map: {termination_reason: group_terminated, termination_date: termination_date}
      - event: vision:vision_terminate_ineligible
        map: {termination_reason: group_terminated, termination_date: termination_date}
      - event: dhmo:dhmo_terminate_ineligible
        map: {termination_reason: group_terminated, termination_date: termination_date}
  - type: group_contract_terminate_system
    target: group_contracts
    mutation: {transition: {from: active, to: terminated}}
    meaning: The contract ends for nonpayment of the group account or failed participation at renewal.
    grain: One row per transaction.
    fields:
      termination_date: Paid-through date (nonpayment) or the day before the renewal date (participation).
      termination_reason: nonpayment or participation_failure.
    triggers:
      - event: dental:dental_terminate_ineligible
        map: {termination_reason: group_terminated, termination_date: termination_date}
      - event: vision:vision_terminate_ineligible
        map: {termination_reason: group_terminated, termination_date: termination_date}
      - event: dhmo:dhmo_terminate_ineligible
        map: {termination_reason: group_terminated, termination_date: termination_date}
  - type: group_renewal
    target: group_contracts
    mutation: update
    meaning: The contract renews on its anniversary with renewal rates and plan choices.
    grain: One row per transaction.
    fields:
      dental_variant_offered: Dental plan for the new plan year.
      vision_variant_offered: Vision plan for the new plan year.
      dental_rate_member_only: Renewal rate.
      dental_rate_member_spouse: Renewal rate.
      dental_rate_member_children: Renewal rate.
      dental_rate_family: Renewal rate.
      vision_rate_member_only: Renewal rate.
      vision_rate_family: Renewal rate.
      renewal_date: Next anniversary.
      rate_guarantee_end_date: End of the renewal rate guarantee.
    triggers: []
  - type: group_member_added
    target: group_eligibility_events
    meaning: The employer reports an employee (and dependents) to be added.
    grain: One row per employee addition.
    distinguish_by: [employee_name, employee_date_of_birth, event_effective_date]
    fields:
      employee_name: Employee.
      employee_date_of_birth: Employee date of birth.
      entry_reason: open_enrollment, new_hire, special_enrollment or late_entrant.
      coverage_tier: Tier elected.
      qualifying_event_date: Hire date or qualifying event date.
      event_effective_date: Coverage start.
      reported_date: Report date.
    triggers: []
  - type: group_member_terminated
    target: group_eligibility_events
    meaning: The employer reports an employee's coverage to end.
    grain: One row per employee termination.
    distinguish_by: [employee_name, employee_date_of_birth, event_effective_date]
    fields:
      employee_name: Employee.
      employee_date_of_birth: Employee date of birth.
      entry_reason: employment_ended, hours_reduced or dependent_aged_out.
      coverage_tier: Tier ended.
      qualifying_event_date: Last day of employment or event date.
      event_effective_date: Coverage end.
      reported_date: Report date.
    triggers: []
  - type: group_cobra_elected
    target: group_eligibility_events
    meaning: A former employee or dependent elects COBRA continuation.
    grain: One row per election.
    distinguish_by: [original_eligibility_event_id]
    fields:
      employee_name: Employee.
      employee_date_of_birth: Employee date of birth.
      entry_reason: cobra_continuation.
      coverage_tier: Tier continued.
      qualifying_event_date: Date coverage was lost.
      event_effective_date: Continuation start (the day after coverage ended).
      reported_date: Election date.
      original_eligibility_event_id: Termination continued.
    triggers: []
  - type: group_census_reported
    target: group_eligibility_events
    meaning: The employer reports its eligible and enrolled employee counts.
    grain: One row per census report.
    distinguish_by: [reported_date]
    fields:
      entry_reason: census.
      coverage_tier: not_applicable.
      reported_date: Report date.
      enrolled_employees: Enrolled employees.
      eligible_employees_reported: Eligible employees.
    triggers: []

measures:
  - id: group_msr_participation
    window: The latest group_census_reported row on or before the renewal measurement date.
    measure: enrolled_employees divided by eligible_employees_reported (after excluding valid waivers with other coverage), as an integer percent rounded down.

policies:
  - id: group_agg_multi_holding
    subject: [group_contract_apply]
    rule: >-
      An employer holds at most one applied or active Cascade group contract; a second contract is not issued while one is applied or active.
    eligibility:
      - id: one_open_group_contract
        applies_to: [group_contract_apply]
        kind: dedup
        condition: An employer holds at most one applied or active Cascade group contract; a second contract is not issued while one is applied or active.
        evidence_fields: [group_contracts.customer_id, group_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_contracts.customer_id]
          action_bindings:
            group_contracts.customer_id: customer_id
        dedup_contract:
          table: group_contracts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: group_underwriting
    subject: [group_contract_apply, group_contract_activate, group_contract_withdraw]
    rule: >-
      A group is placed in the segment whose min_eligible_employees and max_eligible_employees contain its eligible employees on the census, may be written only in situs_states_written, and must submit a complete application application_lead_days before the requested effective date, which is always the new_group_effective_day of a month.
      A contributory group must pay at least employer_min_contribution_pct of employee-only premium, and the group must meet the participation minimum for its contribution type (participation_min_pct_employer_paid, participation_min_pct_contributory, or participation_min_pct_voluntary together with voluntary_min_enrolled_lives).
      Rates are guaranteed for rate_guarantee_months_new; the contract becomes active on its effective date once the group account's binder is received, and the employer may withdraw before then.
    eligibility: []
    params:
      per_tier:
        Cascade Group Dental & Vision 2-19: {participation_contributory: "=participation_min_pct_contributory", guarantee_months: "=rate_guarantee_months_new"}
        Cascade Group Dental & Vision 20-49: {participation_contributory: "=participation_min_pct_contributory", guarantee_months: "=rate_guarantee_months_new"}
        Cascade Group Dental & Vision 50-99: {participation_contributory: "=participation_min_pct_contributory", guarantee_months: "=rate_guarantee_months_new"}
        Cascade Group Dental & Vision 100-249: {participation_contributory: "=participation_min_pct_contributory", guarantee_months: "=rate_guarantee_months_new"}
        Cascade Group Dental & Vision 250-999: {participation_contributory: "=participation_min_pct_contributory", guarantee_months: "=rate_guarantee_months_new"}
        Cascade Group Dental & Vision 1000 Plus: {participation_contributory: "=participation_min_pct_contributory", guarantee_months: "=rate_guarantee_months_new"}

  - id: group_renewal_rules
    subject: [group_renewal]
    rule: >-
      Renewal rates are sent renewal_notice_days before the renewal_date and take effect on it for rate_guarantee_months_renewal months; no increase exceeds renewal_rate_cap_pct, rates do not change during a guarantee (mid_term_rate_change_allowed false), and a group offering both Cascade dental and vision receives dental_vision_bundle_discount_pct off both.
      Renewal rates follow the segment's pooling_level, with the group's own claims experience used only when experience_rating_applies is true.
      Vision member_spouse and member_children rates are vision_rate_member_only times vision_ratio_member_spouse and vision_ratio_member_children, rounded half up to the cent.
      Plan choices for the new plan year are made at open enrollment and take effect on the renewal date.
    eligibility: []
    params:
      per_tier:
        Cascade Group Dental & Vision 2-19: {rate_cap: "=renewal_rate_cap_pct", bundle_discount: "=dental_vision_bundle_discount_pct"}
        Cascade Group Dental & Vision 20-49: {rate_cap: "=renewal_rate_cap_pct", bundle_discount: "=dental_vision_bundle_discount_pct"}
        Cascade Group Dental & Vision 50-99: {rate_cap: "=renewal_rate_cap_pct", bundle_discount: "=dental_vision_bundle_discount_pct"}
        Cascade Group Dental & Vision 100-249: {rate_cap: "=renewal_rate_cap_pct", bundle_discount: "=dental_vision_bundle_discount_pct"}
        Cascade Group Dental & Vision 250-999: {rate_cap: "=renewal_rate_cap_pct", bundle_discount: "=dental_vision_bundle_discount_pct"}
        Cascade Group Dental & Vision 1000 Plus: {rate_cap: "=renewal_rate_cap_pct", bundle_discount: "=dental_vision_bundle_discount_pct"}

  - id: group_census_participation
    subject: [group_census_reported]
    rule: >-
      The employer reports its eligible and enrolled employees every census_reporting_months months and with each renewal; employees who waive because they have other dental coverage are left out of the eligible count when waivers_with_other_coverage_excluded is true.
      Participation is measured participation_audit_timing on the latest census (group_msr_participation) against the minimum for the contribution type; a group below its minimum is told in the renewal notice and has participation_cure_days to cure, after which the contract is not renewed.
      A census showing eligible employees outside the segment's range moves the group to the matching segment at the next renewal.
    eligibility: []
    measures: [group_msr_participation]

  - id: group_member_eligibility
    subject: [group_member_added, group_member_terminated]
    rule: >-
      An employee is eligible when regularly working at least eligibility_min_hours_per_week hours and after completing the employer's new_hire_waiting_days; coverage starts the first of the month after the waiting period.
      An employee who enrolls within timely_enrollment_days of first becoming eligible, at open enrollment (open_enrollment_window_days before renewal) or by special enrollment enters normally; others enter as late entrants when late_entrant_rules_apply is true.
      Domestic partners may be enrolled when domestic_partner_eligible is true, and retirees may stay enrolled only when retiree_coverage_allowed is true.
    eligibility: []

  - id: group_member_reporting
    subject: [group_member_added, group_member_terminated]
    rule: >-
      The employer must report additions within member_add_reporting_days of the qualifying event; a later report takes effect only within the retroactive limits of the group billing arrangement.
      Coverage of a terminated employee ends on the last day of the month in which employment ended or hours were reduced, and a terminated employee of a group where cobra_applies is true receives a continuation election notice.
      Each addition or termination is reported once per employee and effective date; a correction is reported as a new event with the corrected effective date.
    eligibility: []

  - id: group_cobra_continuation
    subject: [group_cobra_elected]
    rule: >-
      When cobra_applies is true, an employee or dependent losing coverage because employment ended or hours were reduced may elect continuation within cobra_election_window_days after the later of coverage loss and the election notice; continuation lasts cobra_continuation_months (cobra_disability_extension_months with a disability determination, cobra_secondary_event_months for dependents after a second qualifying event).
      The election window is cobra_election_window_days counted in calendar days from the later of the coverage-loss date and the election notice date, and an election on the last day is timely.
      The first premium is due within cobra_initial_premium_days after the election and later premiums have cobra_subsequent_grace_days of grace; the premium is cobra_premium_pct of the group rate.
      The employer must notify Cascade within cobra_employer_notice_days; groups where cobra_applies is false offer no continuation under these rules.
    eligibility:
      - id: cobra_election_window
        applies_to: [group_cobra_elected]
        kind: time
        condition: When cobra_applies is true, an employee or dependent losing coverage because employment ended or hours were reduced may elect continuation within cobra_election_window_days after the later of coverage loss and the election notice; continuation lasts cobra_continuation_months (cobra_disability_extension_months with a disability determination, cobra_secondary_event_months for dependents after a second qualifying event).
        evidence_fields: [group_eligibility_events.event_effective_date, group_eligibility_events.group_eligibility_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_eligibility_events.group_eligibility_event_id]
          action_bindings:
            group_eligibility_events.group_eligibility_event_id: original_eligibility_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the later of coverage loss and the election notice
          anchor_source: group_eligibility_events.event_effective_date
          relation: not_after
          duration_source: variants.cobra_election_window_days
          unit: calendar_days
          counting_rule: The election window is cobra_election_window_days counted in calendar days from the later of the coverage-loss date and the election notice date, and an election on the last day is timely.
          boundary: inclusive

  - id: group_contract_termination
    subject: [group_contract_terminate, group_contract_terminate_system]
    rule: >-
      An employer may end the contract on termination_notice_days_employer days of written notice, effective at the end of the month in which the notice period ends (termination_effective_basis), including during a rate guarantee when early_termination_allowed is true.
      Cascade ends the contract when the group billing account lapses for nonpayment, and does not renew it when a participation shortfall is not cured.
      Every enrollment under the contract ends on the contract termination date, and COBRA continuation then ends as well because the group no longer offers coverage.
    eligibility: []
