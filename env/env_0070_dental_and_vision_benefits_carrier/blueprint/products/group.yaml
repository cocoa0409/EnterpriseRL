category: group
display_name: Employer Group Contracts

binding:
  holding_table: group_contracts
  event_tables: [group_eligibility_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [applied, active, terminated, cancelled]
  transitions:
    - {from: applied, to: active, by: system, means: "The contract takes effect on its effective date after underwriting approval and the binder."}
    - {from: applied, to: cancelled, by: user, means: "The employer withdraws the application before the effective date."}
    - {from: active, to: terminated, by: user, means: "The employer ends the contract with the required written notice."}
    - {from: active, to: terminated, by: system, means: "The contract ends for nonpayment or for failing participation requirements at renewal."}

accounts: []

parameter_schema:
  min_eligible_employees: "count; fewest eligible employees for the segment"
  max_eligible_employees: "count; most eligible employees for the segment; 0 = no maximum"
  participation_min_pct_employer_paid: "integer percent of eligible employees (excluding valid waivers) who must enroll when the employer pays all premium"
  participation_min_pct_contributory: "integer percent of eligible employees (excluding valid waivers) who must enroll on a contributory plan"
  participation_min_pct_voluntary: "integer percent of eligible employees who must enroll on a voluntary plan"
  voluntary_min_enrolled_lives: "count; fewest enrolled employees on a voluntary plan"
  waivers_with_other_coverage_excluded: "boolean; true = employees waiving because they have other dental coverage are excluded from the eligible count for participation"
  employer_min_contribution_pct: "integer percent of employee-only premium a contributory employer must pay"
  eligibility_min_hours_per_week: "hours; employees regularly working at least this many hours per week are eligible"
  domestic_partner_eligible: "boolean; true = domestic partners may be enrolled as dependents"
  retiree_coverage_allowed: "boolean; true = the group may keep retirees enrolled"
  new_hire_waiting_options: "list of new-hire eligibility waiting periods (days) the employer may choose"
  timely_enrollment_days: "calendar days after first becoming eligible within which an employee must enroll to avoid late-entrant status"
  member_add_reporting_days: "calendar days after the qualifying event within which the employer must report an addition for it to take effect on the normal date"
  late_entrant_rules_apply: "boolean; true = employees enrolling outside open enrollment, the new-hire window and special enrollment enter as late entrants"
  open_enrollment_window_days: "calendar days before the renewal date during which the annual open enrollment runs"
  new_group_effective_day: "day of month on which new contracts and changes take effect"
  application_lead_days: "calendar days before the requested effective date by which a complete group application must be received"
  underwriting_census_required: "boolean; true = an employee census is required to quote and issue"
  situs_states_written: "list of states where Cascade issues group contracts"
  minimum_contract_term_months: "months; initial contract term"
  rate_guarantee_months_new: "months rates are guaranteed from the effective date of a new contract"
  rate_guarantee_months_renewal: "months rates are guaranteed from a renewal"
  renewal_notice_days: "calendar days before the renewal date by which renewal rates are sent"
  renewal_rate_cap_pct: "integer percent; largest rate increase applied at a renewal under the company's schedule"
  rate_basis: "enum string; composite_four_tier = one rate per coverage tier for all employees"
  vision_ratio_member_spouse: "multiplier of vision_rate_member_only giving the member_spouse rate"
  vision_ratio_member_children: "multiplier of vision_rate_member_only giving the member_children rate"
  pooling_level: "enum string; how renewal rates are set: fully_pooled, blended or experience_rated"
  dental_vision_bundle_discount_pct: "integer percent off both rates when the group offers Cascade dental and vision together"
  participation_audit_timing: "enum string; participation is measured at_renewal on the census then on file"
  participation_cure_days: "calendar days after the renewal notice of a participation shortfall within which the group may cure it before non-renewal"
  census_reporting_months: "months between required census reports"
  termination_notice_days_employer: "calendar days of written notice the employer must give to end the contract"
  termination_effective_basis: "enum string; end_of_month_after_notice = the contract ends on the last day of the month in which the notice period ends"
  early_termination_allowed: "boolean; true = the employer may end the contract before the end of a rate guarantee on notice"
  cobra_applies: "boolean; true = federal COBRA continuation applies (20 or more employees)"
  cobra_continuation_months: "months of continuation after employment ends or hours are reduced"
  cobra_disability_extension_months: "months of continuation total when a qualified beneficiary is disabled"
  cobra_secondary_event_months: "months of continuation total for dependents after a second qualifying event"
  cobra_election_window_days: "calendar days after the later of coverage loss and the election notice within which continuation may be elected"
  cobra_initial_premium_days: "calendar days after the election within which the first continuation premium must be paid"
  cobra_subsequent_grace_days: "calendar days of grace for each later continuation premium"
  cobra_premium_pct: "integer percent of the group rate charged for continuation coverage"
  cobra_employer_notice_days: "calendar days after a qualifying event within which the employer must notify Cascade"
  experience_rating_applies: "boolean; true = the group's own claims experience affects renewal"
  mid_term_rate_change_allowed: "boolean; false = rates do not change during a rate guarantee except for a change in plans offered"
  rounding_rule: "enum string; amounts rounded half up to the cent"

