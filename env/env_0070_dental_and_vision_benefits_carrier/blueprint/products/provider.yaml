events:
  - type: provider_application
    target: provider_agreements
    mutation: create
    meaning: A practice's complete credentialing application for one provider, location and agreement type is received.
    grain: One row per agreement application.
    fields:
      customer_id: Practice.
      variant_name: Agreement type applied for.
      npi_number: Rendering provider NPI.
      rendering_provider_name: Rendering provider name.
      specialty: Specialty.
      location_type: Location type.
      service_state: Location state.
      application_date: Receipt date.
      license_expiration_date: License expiration on file.
      malpractice_expiration_date: Liability policy expiration on file.
      malpractice_per_occurrence: Per-occurrence limit on file.
      malpractice_aggregate: Aggregate limit on file.
      panel_status: open.
    triggers: []
  - type: provider_credentialing_approved
    target: provider_agreements
    mutation: {transition: {from: credentialing, to: active}}
    meaning: The committee approves the provider and the agreement takes effect.
    grain: One row per transaction.
    fields:
      credentialing_decision_date: Decision date.
      effective_date: First in-network day.
      recredential_due_date: Decision date plus the recredentialing cycle.
      fee_schedule_code: Fee schedule assigned.
    triggers: []
  - type: provider_credentialing_denied
    target: provider_agreements
    mutation: {transition: {from: credentialing, to: denied}}
    meaning: The committee denies the application.
    grain: One row per transaction.
    fields:
      credentialing_decision_date: Decision date.
    triggers: []
  - type: provider_termination_notice
    target: provider_agreements
    mutation: {transition: {from: active, to: termination_pending}}
    meaning: The practice gives written notice of termination without cause.
    grain: One row per transaction.
    fields:
      termination_notice_date: Notice receipt date.
      termination_date: Last day of the month in which the notice period ends.
      termination_reason: provider_notice.
    triggers: []
  - type: provider_carrier_termination_notice
    target: provider_agreements
    mutation: {transition: {from: active, to: termination_pending}}
    meaning: Cascade gives written notice of termination without cause.
    grain: One row per transaction.
    fields:
      termination_notice_date: Notice date.
      termination_date: Last day of the month in which the notice period ends.
      termination_reason: carrier_notice.
    triggers: []
  - type: provider_notice_rescinded
    target: provider_agreements
    mutation: {transition: {from: termination_pending, to: active}}
    meaning: The practice rescinds its own termination notice before the termination date.
    grain: One row per transaction.
    fields:
      termination_notice_date: Cleared.
      termination_date: Cleared.
      termination_reason: not_terminated.
    triggers: []
  - type: provider_terminated
    target: provider_agreements
    mutation: {transition: {from: termination_pending, to: terminated}}
    meaning: The notice period ends and the provider leaves the network.
    grain: One row per transaction.
    fields:
      termination_date: Last in-network day (unchanged from the notice).
    triggers: []
  - type: provider_terminated_for_cause
    target: provider_agreements
    mutation: {transition: {from: active, to: terminated}}
    meaning: The agreement ends immediately for cause, license action or lapse of credentialing.
    grain: One row per transaction.
    fields:
      termination_date: Date of the action (or the end of the applicable grace).
      termination_reason: for_cause, license_action or credentialing_lapse.
    triggers: []
  - type: provider_recredentialed
    target: provider_agreements
    mutation: update
    meaning: Recredentialing is completed and the credentials on file are refreshed.
    grain: One row per transaction.
    fields:
      credentialing_decision_date: Recredentialing decision date.
      recredential_due_date: Decision date plus the recredentialing cycle.
      license_expiration_date: Refreshed license expiration.
      malpractice_expiration_date: Refreshed liability expiration.
      malpractice_per_occurrence: Refreshed per-occurrence limit.
      malpractice_aggregate: Refreshed aggregate limit.
    triggers: []
  - type: provider_panel_status_change
    target: provider_agreements
    mutation: update
    meaning: The provider opens or closes the panel to new Cascade patients.
    grain: One row per transaction.
    fields:
      panel_status: New panel status.
    triggers: []
  - type: provider_fee_schedule_update
    target: provider_agreements
    mutation: update
    meaning: A new fee schedule is assigned to the agreement.
    grain: One row per transaction.
    fields:
      fee_schedule_code: New fee schedule.
    triggers: []
  - type: provider_remittance_issued
    target: provider_payment_events
    meaning: A payment run pays the practice claim payments, prompt-pay interest or capitation.
    grain: One row per remittance per component.
    distinguish_by: [remittance_number, remittance_component]
    fields:
      remittance_number: Remittance advice number.
      remittance_component: What is paid.
      amount: Amount paid for the component.
      event_date: Payment date.
    triggers: []
  - type: provider_overpayment_identified
    target: provider_payment_events
    meaning: Cascade identifies that a practice was overpaid on a member claim and issues an overpayment notice.
    grain: One row per overpayment case.
    distinguish_by: [overpayment_case_number]
    fields:
      overpayment_case_number: Case number on the notice.
      source_product: Product of the source claim.
      dental_claim_line_id: Source dental line, if any.
      vision_claim_id: Source vision service, if any.
      ortho_payment_id: Source orthodontic payment, if any.
      original_payment_date: Date the overpaid amount was paid.
      amount: Overpaid amount.
      event_date: Notice date.
    account: overpayment_receivable
    direction: in
    triggers: []
  - type: provider_overpayment_recouped
    target: provider_payment_events
    meaning: An overpayment is offset against a later remittance.
    grain: One row per overpayment case per offsetting remittance.
    distinguish_by: [original_payment_event_id, remittance_number]
    fields:
      remittance_number: Remittance offset against.
      overpayment_case_number: Case number.
      amount: Amount withheld.
      event_date: Offset date.
      original_payment_event_id: Overpayment settled.
    account: overpayment_receivable
    direction: out
    triggers: []
  - type: provider_overpayment_refund_received
    target: provider_payment_events
    meaning: The practice refunds an overpayment directly.
    grain: One row per refund received.
    distinguish_by: [original_payment_event_id, event_date]
    fields:
      overpayment_case_number: Case number.
      amount: Amount refunded.
      event_date: Receipt date.
      original_payment_event_id: Overpayment settled.
    account: overpayment_receivable
    direction: out
    triggers: []
  - type: provider_overpayment_reduced
    target: provider_payment_events
    meaning: An overpayment is reduced or withdrawn after a dispute, or written off below the recovery minimum.
    grain: One row per reduction of an overpayment case.
    distinguish_by: [original_payment_event_id, event_date]
    fields:
      overpayment_case_number: Case number.
      amount: Amount removed from the receivable.
      event_date: Reduction date.
      original_payment_event_id: Overpayment reduced.
    account: overpayment_receivable
    direction: out
    triggers: []
  - type: provider_dispute_filed
    target: provider_disputes
    meaning: The practice disputes an overpayment notice.
    grain: One row per dispute filing.
    distinguish_by: [provider_payment_event_id]
    fields:
      provider_payment_event_id: Overpayment disputed.
      dispute_basis: Ground stated.
      filed_date: Receipt date.
      resolution_due_date: filed_date plus the resolution period.
      outcome: pending.
    triggers: []
  - type: provider_dispute_resolved
    target: provider_disputes
    meaning: A dispute is resolved.
    grain: One row per resolved filing.
    distinguish_by: [original_dispute_id]
    fields:
      provider_payment_event_id: Overpayment disputed.
      dispute_basis: Ground stated.
      resolved_date: Resolution date.
      outcome: upheld_overpayment, overpayment_reduced or overpayment_withdrawn.
      upheld_amount: Amount that stands.
      original_dispute_id: Filing resolved.
    triggers:
      - event: provider:provider_overpayment_reduced
        when: {outcome: [overpayment_reduced, overpayment_withdrawn]}
        map: {original_payment_event_id: provider_payment_event_id, event_date: resolved_date}

measures:
  - id: provider_msr_open_overpayment
    window: Lifetime of one overpayment case.
    measure: Amount of the provider_overpayment_identified row minus the sum of provider_overpayment_recouped, provider_overpayment_refund_received and provider_overpayment_reduced rows referencing it.
  - id: provider_msr_practice_receivable
    window: Current, across every agreement of the same practice (customer_id).
    measure: Sum of provider_msr_open_overpayment over all open overpayment cases of the practice.

policies:
  - id: provider_agg_multi_holding
    subject: [provider_application]
    rule: >-
      A practice may hold many agreements, so there is no fixed cap: one agreement per rendering provider (NPI), service location type and agreement type.
      A new application may not be opened for an NPI and agreement type that already has an agreement in credentialing, active or termination_pending status.
      A provider may hold both a Cascade PPO Participating Dentist Agreement and a Cascade Premier Participating Dentist Agreement; where both are active on a date of service, PPO-network plans pay the line as in_network_ppo.
    eligibility:
      - id: one_open_agreement_per_npi_type
        applies_to: [provider_application]
        kind: dedup
        condition: A new application may not be opened for an NPI and agreement type that already has an agreement in credentialing, active or termination_pending status.
        evidence_fields: [provider_agreements.npi_number, provider_agreements.variant_name, provider_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [provider_agreements.npi_number, provider_agreements.variant_name]
          action_bindings:
            provider_agreements.npi_number: npi_number
            provider_agreements.variant_name: variant_name
        dedup_contract:
          table: provider_agreements
          mode: separate_record
          object_bindings: {npi_number: npi_number, variant_name: variant_name}
          duplicate_filters: {status: [credentialing, active, termination_pending]}
          distinct_fields: [location_type]
    params:
      max_per_customer: null

  - id: provider_agg_practice_offset
    subject: [provider_overpayment_recouped]
    rule: >-
      Overpayments are recovered at the level of the practice (the customer that holds the agreements): an open overpayment under one agreement may be offset against remittances under any active or termination_pending agreement of the same practice.
      Open overpayments of the practice are offset in recoupment_order (oldest notice first), and the total withheld from one remittance may not exceed recoupment_max_pct_per_remittance of that remittance's claim payments.
      Once every agreement of the practice has terminated, remaining open overpayments are billed to the practice for refund instead of offset.
    eligibility: []
    params:
      per_tier:
        Cascade Savings Network Participating Provider Agreement: {max_offset_pct: "=recoupment_max_pct_per_remittance"}
        Cascade Vision Network Provider Agreement: {max_offset_pct: "=recoupment_max_pct_per_remittance"}
        Cascade DHMO Specialist Agreement: {max_offset_pct: "=recoupment_max_pct_per_remittance"}
        Cascade DHMO Primary Care Dentist Agreement: {max_offset_pct: "=recoupment_max_pct_per_remittance"}
        Cascade Premier Participating Dentist Agreement: {max_offset_pct: "=recoupment_max_pct_per_remittance"}
        Cascade PPO Participating Dentist Agreement: {max_offset_pct: "=recoupment_max_pct_per_remittance"}
    measures: [provider_msr_practice_receivable]

  - id: provider_credentialing
    subject: [provider_application, provider_credentialing_approved, provider_credentialing_denied]
    rule: >-
      An application is accepted only for a specialty in specialties_allowed and a location type in location_types_allowed for the agreement type, with an active state license, a valid NPI and professional liability limits of at least malpractice_min_per_occurrence and malpractice_min_aggregate.
      A provider whose agreement ended for cause or by license action may apply again only after the for-cause re-application wait has run from the termination date of that earlier agreement.
      The wait is reapplication_wait_months_for_cause counted in calendar months from the termination_date, with the last day of the month used when the target day does not exist, and an application on or after the resulting date is accepted; after a termination without cause the shorter reapplication_wait_months_without_cause applies the same way.
      The committee decides within credentialing_turnaround_days of the complete application on primary-source verifications no older than verification_validity_days; agreements requiring a site visit (site_visit_required) are approved only after the office passes it.
      On approval the agreement takes effect on the first day of the month after the decision, recredential_due_date is the decision date plus recredentialing_cycle_months, and the fee schedule for the agreement type and service state is assigned; an application that does not meet the requirements is denied.
      No application fee is charged (credentialing_application_fee), and services rendered before the effective date are out of network.
    eligibility:
      - id: for_cause_reapplication_wait
        applies_to: [provider_application]
        kind: time
        condition: A provider whose agreement ended for cause or by license action may apply again only after the for-cause re-application wait has run from the termination date of that earlier agreement.
        evidence_fields: [provider_agreements.termination_date, provider_agreements.termination_reason, provider_agreements.npi_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [provider_agreements.npi_number]
          action_bindings:
            provider_agreements.npi_number: npi_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the termination date of that earlier agreement
          anchor_source: provider_agreements.termination_date
          relation: not_before
          duration_source: variants.reapplication_wait_months_for_cause
          unit: calendar_months
          counting_rule: The wait is reapplication_wait_months_for_cause counted in calendar months from the termination_date, with the last day of the month used when the target day does not exist, and an application on or after the resulting date is accepted; after a termination without cause the shorter reapplication_wait_months_without_cause applies the same way.
          boundary: inclusive

  - id: provider_recredentialing
    subject: [provider_recredentialed, provider_terminated_for_cause]
    rule: >-
      Every active agreement is recredentialed by its recredential_due_date; a completed recredentialing refreshes license, liability and decision dates and sets the next due date recredentialing_cycle_months after the new decision.
      An agreement whose recredentialing is not completed within recredentialing_grace_days after the due date ends with termination_reason credentialing_lapse on the last day of that grace.
      An agreement whose professional liability coverage expired ends for cause when proof of renewal is not received within malpractice_lapse_grace_days after the expiration; a license suspension, revocation or surrender ends it by license action on the action date when license_action_immediate_termination is true.
    eligibility: []

  - id: provider_termination_without_cause
    subject: [provider_termination_notice, provider_carrier_termination_notice, provider_notice_rescinded, provider_terminated]
    rule: >-
      Either party may end an agreement without cause by written notice: the practice with termination_notice_days_provider days of notice, Cascade with termination_notice_days_carrier days.
      The termination date is the last day of the month in which the notice period (notice date plus the notice days, in calendar days) ends; after a material fee schedule reduction the practice may instead give material_change_termination_days of notice if it gives notice within the fee_schedule_change_notice_days window before the reduction takes effect.
      A practice's own termination notice or rescission is the practice's decision, registered by the agent as a practice request and carried out only after the practice confirms it.
      A termination notice or rescission from the practice is carried out only once the practice's request for that agreement is confirmed.
      A practice may rescind its own notice while the agreement is termination_pending and before the termination date; a carrier notice can be withdrawn only by Cascade.
      The provider stays in network through the termination date; members' services are in or out of network according to the agreement status on the date of service (for multi-visit dental procedures, on the procedure start date, and for orthodontic cases, on the banding date), and assigned DHMO members are reassigned dhmo_member_reassignment_days before a primary care dentist's termination date.
    eligibility:
      - id: practice_request_confirmed
        applies_to: [provider_termination_notice, provider_notice_rescinded]
        kind: state
        condition: A termination notice or rescission from the practice is carried out only once the practice's request for that agreement is confirmed.
        evidence_fields: [provider_requests.request_status, provider_requests.provider_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [provider_requests.provider_agreement_id]
          action_bindings:
            provider_requests.provider_agreement_id: provider_agreement_id
        state_contract:
          field: provider_requests.request_status
          allowed: [confirmed]
    params:
      per_tier:
        Cascade Savings Network Participating Provider Agreement: {notice_provider: "=termination_notice_days_provider", notice_carrier: "=termination_notice_days_carrier"}
        Cascade Vision Network Provider Agreement: {notice_provider: "=termination_notice_days_provider", notice_carrier: "=termination_notice_days_carrier"}
        Cascade DHMO Specialist Agreement: {notice_provider: "=termination_notice_days_provider", notice_carrier: "=termination_notice_days_carrier"}
        Cascade DHMO Primary Care Dentist Agreement: {notice_provider: "=termination_notice_days_provider", notice_carrier: "=termination_notice_days_carrier"}
        Cascade Premier Participating Dentist Agreement: {notice_provider: "=termination_notice_days_provider", notice_carrier: "=termination_notice_days_carrier"}
        Cascade PPO Participating Dentist Agreement: {notice_provider: "=termination_notice_days_provider", notice_carrier: "=termination_notice_days_carrier"}

  - id: provider_termination_for_cause
    subject: [provider_terminated_for_cause]
    rule: >-
      Cascade ends an agreement immediately, without notice period, for fraud or intentional misrepresentation, for loss or restriction of license (license_action), for exclusion from a federal health program, for failure to keep the required professional liability coverage beyond its grace, or for credentialing lapse.
      The termination date is the action date (or the last day of the applicable grace), services after that date are out of network, open overpayments become due for refund, and the re-application wait for cause applies.
    eligibility: []

  - id: provider_evt_overpayment
    subject: [provider_overpayment_identified, provider_overpayment_recouped, provider_overpayment_refund_received, provider_overpayment_reduced]
    rule: >-
      An overpayment arises when a member claim paid to the practice is reprocessed to a lower payment (for example after a coordination-of-benefits correction, an eligibility back-out after a lapse, or a duplicate) or an orthodontic payment is reversed; the overpaid amount is the original payment minus the corrected payment.
      An overpayment notice may be issued only within the overpayment lookback after the original payment date of the overpaid claim.
      The lookback is overpayment_lookback_days counted in calendar days from the original_payment_date (the adjudicated_date of the source dental line or vision service, or the payment_date of the source orthodontic payment), and a notice dated on the last day is in time; overpayments arising from fraud are not limited when fraud_lookback_exception is true.
      Overpayments below overpayment_minimum_recovery are not pursued.
      The practice may refund within overpayment_refund_window_days calendar days after the notice; an overpayment may be offset against a remittance only after the refund window following the overpayment notice has passed and while no dispute of it is pending.
      The offset may start on the day after the notice date plus overpayment_refund_window_days calendar days.
      Each recovery references the overpayment it settles, and recoveries never exceed the open amount (provider_msr_open_overpayment).
    eligibility:
      - id: overpayment_lookback
        applies_to: [provider_overpayment_identified]
        kind: time
        condition: An overpayment notice may be issued only within the overpayment lookback after the original payment date of the overpaid claim.
        evidence_fields: [dental_claim_lines.adjudicated_date, dental_claim_lines.dental_claim_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dental_claim_lines.dental_claim_line_id]
          action_bindings:
            dental_claim_lines.dental_claim_line_id: dental_claim_line_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the original payment date of the overpaid claim
          anchor_source: dental_claim_lines.adjudicated_date
          relation: not_after
          duration_source: variants.overpayment_lookback_days
          unit: calendar_days
          counting_rule: The lookback is overpayment_lookback_days counted in calendar days from the original_payment_date (the adjudicated_date of the source dental line or vision service, or the payment_date of the source orthodontic payment), and a notice dated on the last day is in time; overpayments arising from fraud are not limited when fraud_lookback_exception is true.
          boundary: inclusive
      - id: refund_window_passed
        applies_to: [provider_overpayment_recouped]
        kind: time
        condition: an overpayment may be offset against a remittance only after the refund window following the overpayment notice has passed and while no dispute of it is pending.
        evidence_fields: [provider_payment_events.event_date, provider_payment_events.provider_payment_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [provider_payment_events.provider_payment_event_id]
          action_bindings:
            provider_payment_events.provider_payment_event_id: original_payment_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the overpayment notice
          anchor_source: provider_payment_events.event_date
          relation: not_before
          duration_source: variants.overpayment_refund_window_days
          unit: calendar_days
          counting_rule: The offset may start on the day after the notice date plus overpayment_refund_window_days calendar days.
          boundary: exclusive
    measures: [provider_msr_open_overpayment]

  - id: provider_evt_disputes
    subject: [provider_dispute_filed, provider_dispute_resolved]
    rule: >-
      A practice may dispute an overpayment no later than the dispute window after the overpayment notice date.
      The dispute window is overpayment_dispute_window_days counted in calendar days from the event_date of the identified overpayment, and a dispute received on the last day is timely.
      Each overpayment may be disputed dispute_levels time(s); a filing suspends offsetting of that overpayment until it is resolved, and the resolution_due_date is filed_date plus dispute_resolution_days.
      The resolution upholds, reduces or withdraws the overpayment; a reduction or withdrawal lowers the receivable by the difference between the open amount and upheld_amount, and offsetting of any upheld amount may resume on the day after the resolution.
    eligibility:
      - id: dispute_window
        applies_to: [provider_dispute_filed]
        kind: time
        condition: A practice may dispute an overpayment no later than the dispute window after the overpayment notice date.
        evidence_fields: [provider_payment_events.event_date, provider_payment_events.provider_payment_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [provider_payment_events.provider_payment_event_id]
          action_bindings:
            provider_payment_events.provider_payment_event_id: provider_payment_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the overpayment notice date
          anchor_source: provider_payment_events.event_date
          relation: not_after
          duration_source: variants.overpayment_dispute_window_days
          unit: calendar_days
          counting_rule: The dispute window is overpayment_dispute_window_days counted in calendar days from the event_date of the identified overpayment, and a dispute received on the last day is timely.
          boundary: inclusive
      - id: one_dispute_per_overpayment
        applies_to: [provider_dispute_filed]
        kind: dedup
        condition: Each overpayment may be disputed dispute_levels time(s); a filing suspends offsetting of that overpayment until it is resolved, and the resolution_due_date is filed_date plus dispute_resolution_days.
        evidence_fields: [provider_disputes.provider_payment_event_id, provider_disputes.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [provider_disputes.provider_payment_event_id]
          action_bindings:
            provider_disputes.provider_payment_event_id: provider_payment_event_id
        dedup_contract:
          table: provider_disputes
          mode: separate_record
          object_bindings: {provider_payment_event_id: provider_payment_event_id}
          duplicate_filters: {event_type: [provider_dispute_filed]}
          distinct_fields: []

  - id: provider_evt_remittance
    subject: [provider_remittance_issued]
    rule: >-
      Claim payments are issued in payment runs every remittance_cycle_days days (by electronic funds transfer when eft_enrollment_required is true); capitation for a DHMO primary care dentist is capitation_pmpm per assigned member, paid on the capitation_payment_day for the current month.
      A clean claim is paid within clean_claim_payment_days calendar days of receipt; when it is paid later, simple interest at prompt_pay_interest_annual_pct per year is paid for each day beyond that period as a separate prompt_pay_interest component, unless the interest is below prompt_pay_interest_minimum.
      A practice under a member-pays agreement (claims_payment_party member_pays_discounted_fee) receives no remittance.
    eligibility: []

  - id: provider_fee_schedule_and_panel
    subject: [provider_fee_schedule_update, provider_panel_status_change]
    rule: >-
      Fee schedules are updated on fee_schedule_update_cycle; a material change takes effect only after fee_schedule_change_notice_days of written notice, and the practice may then terminate on material_change_termination_days notice.
      A panel status change is the practice's request and takes effect panel_status_change_notice_days after confirmation; a DHMO primary care dentist may not close the panel while assigned members are below dhmo_panel_capacity when dhmo_minimum_open_panel is true.
      Closing a panel does not affect patients already treated by the provider.
    eligibility:
      - id: panel_change_confirmed
        applies_to: [provider_panel_status_change]
        kind: state
        condition: A panel status change is the practice's request and takes effect panel_status_change_notice_days after confirmation; a DHMO primary care dentist may not close the panel while assigned members are below dhmo_panel_capacity when dhmo_minimum_open_panel is true.
        evidence_fields: [provider_requests.request_status, provider_requests.provider_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [provider_requests.provider_agreement_id]
          action_bindings:
            provider_requests.provider_agreement_id: provider_agreement_id
        state_contract:
          field: provider_requests.request_status
          allowed: [confirmed]
