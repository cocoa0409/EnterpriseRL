category: provider
display_name: Network Participation Agreements

binding:
  holding_table: provider_agreements
  event_tables: [provider_payment_events, provider_disputes]
  intake_tables: [provider_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [credentialing, active, termination_pending, terminated, denied]
  transitions:
    - {from: credentialing, to: active, by: system, means: "The credentialing committee approves the provider and the agreement takes effect."}
    - {from: credentialing, to: denied, by: system, means: "The credentialing committee denies the application."}
    - {from: active, to: termination_pending, by: user, means: "The practice gives written notice of termination without cause."}
    - {from: active, to: termination_pending, by: system, means: "Cascade gives written notice of termination without cause."}
    - {from: termination_pending, to: active, by: user, means: "The practice rescinds its own notice before the termination date and Cascade accepts the rescission."}
    - {from: termination_pending, to: terminated, by: system, means: "The notice period ends and the provider leaves the network."}
    - {from: active, to: terminated, by: system, means: "The agreement ends immediately for cause, license action or lapse of credentialing."}

accounts:
  - key: overpayment_receivable
    unit: USD
    meaning: Overpaid claim amounts the practice owes back to Cascade and not yet recovered.

parameter_schema:
  member_products_served: "list of member products whose members are treated in network under this agreement"
  fee_basis: "enum string; how the practice is paid: member_pays_discount_schedule, vision_fee_schedule, dhmo_specialist_fee_schedule, capitation_plus_member_copay, premier_fee_schedule, ppo_fee_schedule"
  capitation_pmpm: "USD per assigned DHMO member per month paid to a primary care dentist; 0.00 when not capitated"
  capitation_payment_day: "day of the month capitation for that month is paid; 0 when not capitated"
  hold_harmless: "boolean; true = the practice may not bill the member more than the member's share of the agreement fee (no balance billing)"
  claims_payment_party: "enum string; who pays the practice for covered services"
  credentialing_turnaround_days: "calendar days from a complete application to the credentialing decision"
  verification_validity_days: "calendar days; primary-source verifications must be no older than this at the committee decision"
  recredentialing_cycle_months: "months between credentialing decisions; recredential_due_date = last decision date plus this value"
  recredentialing_grace_days: "calendar days after recredential_due_date during which an incomplete recredentialing does not yet end the agreement"
  malpractice_min_per_occurrence: "USD minimum per-occurrence professional liability limit"
  malpractice_min_aggregate: "USD minimum annual aggregate professional liability limit"
  malpractice_lapse_grace_days: "calendar days after malpractice_expiration_date to file proof of renewal before termination for cause"
  license_action_immediate_termination: "boolean; true = suspension, revocation or surrender of the license ends the agreement on the action date"
  site_visit_required: "boolean; true = an office site review must be passed before approval"
  termination_notice_days_provider: "calendar days of written notice the practice must give to terminate without cause"
  termination_notice_days_carrier: "calendar days of written notice Cascade must give to terminate without cause"
  termination_effective_alignment: "enum string; end_of_month_after_notice = the termination date is the last day of the month in which the notice period ends"
  material_change_termination_days: "calendar days of notice the practice may give instead of the full notice period when terminating within the fee-change notice window after a material fee schedule reduction"
  rescission_allowed: "boolean; true = a practice may rescind its own termination notice before the termination date"
  reapplication_wait_months_for_cause: "calendar months after a for-cause or license-action termination before a new application is accepted"
  reapplication_wait_months_without_cause: "calendar months after a termination without cause before a new application is accepted"
  dhmo_member_reassignment_days: "calendar days before a primary care dentist's termination date by which assigned DHMO members are notified and reassigned; 0 when not applicable"
  specialties_allowed: "list of specialties that may hold the agreement"
  location_types_allowed: "list of location types that may hold the agreement"
  panel_status_change_notice_days: "calendar days of notice before a panel closure takes effect"
  dhmo_minimum_open_panel: "boolean; true = a primary care dentist must keep the panel open while assigned members are below the panel capacity"
  dhmo_panel_capacity: "count of assigned DHMO members a primary care dentist must accept before the panel may close; 0 when not applicable"
  fee_schedule_change_notice_days: "calendar days of advance written notice Cascade gives before a material fee schedule change takes effect"
  fee_schedule_update_cycle: "enum string; regular fee schedule update timing"
  remittance_cycle_days: "calendar days between payment runs"
  clean_claim_payment_days: "calendar days after receipt of a clean claim within which Cascade pays it"
  prompt_pay_interest_annual_pct: "percent per year simple interest paid on a clean claim paid after clean_claim_payment_days, for each day late"
  prompt_pay_interest_minimum: "USD; interest below this amount is not paid"
  eft_enrollment_required: "boolean; true = payments are made only by electronic funds transfer"
  overpayment_lookback_days: "calendar days after original_payment_date within which an overpayment notice may be issued (fraud excepted)"
  fraud_lookback_exception: "boolean; true = overpayments arising from fraud or intentional misrepresentation have no lookback limit"
  overpayment_refund_window_days: "calendar days after the overpayment notice during which the practice may refund before Cascade offsets future payments"
  overpayment_dispute_window_days: "calendar days after the overpayment notice within which the practice may dispute it"
  dispute_resolution_days: "calendar days after filed_date within which a dispute is resolved"
  recoupment_max_pct_per_remittance: "integer percent of a single remittance that may be withheld to offset overpayments"
  overpayment_minimum_recovery: "USD; overpayments below this amount are not pursued"
  recoupment_order: "enum string; oldest_notice_first = open overpayments are offset in order of notice date"
  participation_term_months: "months of the initial agreement term"
  auto_renewal: "boolean; true = the agreement renews automatically for successive terms of the same length"
  dispute_levels: "count of dispute levels available to the practice for an overpayment (each overpayment may be disputed this many times)"
  credentialing_application_fee: "USD fee charged to apply; 0.00 = none"
  rounding_rule: "enum string; amounts rounded half up to the cent"

