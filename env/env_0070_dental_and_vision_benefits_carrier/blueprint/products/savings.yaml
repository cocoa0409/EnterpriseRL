category: savings
display_name: Dental and Vision Savings Memberships

binding:
  holding_table: savings_memberships
  event_tables: [savings_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {fee_balance: membership_fee_balance}

lifecycle:
  states: [pending_activation, active, cancelled, expired]
  transitions:
    - {from: pending_activation, to: active, by: system, means: "The membership activates once the first fee is paid and the activation period has passed."}
    - {from: pending_activation, to: cancelled, by: user, means: "The member cancels before activation."}
    - {from: active, to: cancelled, by: user, means: "The member cancels; the membership ends at the end of the paid period (immediately with a full refund within the money-back period)."}
    - {from: active, to: expired, by: system, means: "A renewal fee remained unpaid past the retry period."}
    - {from: expired, to: active, by: agent, means: "An expired membership is reactivated within the reactivation window after the fee is paid."}

accounts:
  - key: membership_fee_balance
    unit: USD
    meaning: Membership and activation fees owed by the member (negative when the member holds a credit).

parameter_schema:
  annual_fee: "USD membership fee per year when billed annually"
  monthly_fee: "USD membership fee per month when billed monthly"
  activation_fee: "USD one-time activation fee on monthly billing"
  activation_fee_waived_annual: "boolean; true = no activation fee on annual billing"
  household_max_members: "count of persons the membership may cover"
  money_back_days: "calendar days after enrollment_date during which the member may cancel for a full refund of all fees paid"
  activation_business_days: "business days after the first fee payment on which discounts become usable"
  discount_preventive_pct: "integer percent off the usual fee for preventive services at savings-network practices"
  discount_basic_pct: "integer percent off for basic restorative services"
  discount_major_pct: "integer percent off for major services (crowns, bridges, dentures)"
  discount_ortho_pct: "integer percent off orthodontic treatment"
  discount_specialist_pct: "integer percent off specialist services"
  discount_implant_pct: "integer percent off implant services"
  discount_cosmetic_pct: "integer percent off cosmetic services such as whitening"
  vision_included: "boolean; true = vision discounts are part of the membership"
  discount_vision_exam_pct: "integer percent off eye exams; 0 when vision is not included"
  discount_eyewear_pct: "integer percent off frames and lenses; 0 when vision is not included"
  discount_contacts_pct: "integer percent off contact lenses; 0 when vision is not included"
  oon_discount_pct: "integer percent off at practices outside the savings network (0 = no discount)"
  visit_limit_per_year: "count of discounted visits per year; 0 = unlimited"
  waiting_period_days: "days before discounts may be used beyond activation; 0 = none"
  preexisting_conditions_excluded: "boolean; false = no exclusion for conditions existing before enrollment"
  renewal_auto: "boolean; true = the membership renews automatically for the same term"
  renewal_notice_days: "calendar days before an annual renewal on which the renewal notice is sent"
  price_lock_term: "boolean; true = the fee is fixed for the current term"
  price_change_notice_days: "calendar days of notice before a fee change takes effect at renewal"
  cancellation_effective: "enum string; end_of_paid_period = after the money-back period a cancellation ends the membership on the last day of the period already paid"
  monthly_partial_refund: "boolean; false = no refund for the current month after the money-back period"
  annual_refund_basis: "enum string; unused_full_months_prorated = after the money-back period an annual member is refunded the annual fee times unused full months divided by twelve"
  refund_processing_business_days: "business days within which a refund is issued"
  failed_payment_retry_days: "calendar days after a failed renewal or monthly charge during which the charge is retried before the membership expires"
  reactivation_window_days: "calendar days after expiry within which the membership may be reactivated by paying the fee"
  reactivation_fee: "USD fee to reactivate; 0.00 = none"
  combine_with_insurance: "enum string; non_covered_services_only = discounts apply only to services the member's dental or vision insurance does not pay for, never to the member's share of a covered service"
  insurance_conversion_credit_days: "calendar days after enrollment_date within which a member who enrolls in a Cascade dental PPO or vision plan receives a credit of membership fees paid"
  insurance_conversion_credit_cap_months: "months of membership fee that the conversion credit can return at most"
  states_available: "list of states where the membership is sold (discount plan organization registrations)"
  dependent_age_limit: "age in years; household children are covered before this birthday"
  provider_network_required: "boolean; true = discounts are honored only at practices holding a savings-network agreement"
  fee_schedule_basis: "enum string; regional_discount_schedule = discounts apply to the practice's usual fee as filed for its ZIP region"
  visit_price_dispute_days: "calendar days after a visit within which the member may report a practice that did not honor the discount"
  not_insurance_disclosure_required: "boolean; true = every enrollment discloses that the membership is not insurance"
  duplicate_charge_credit: "boolean; true = a fee charged twice for the same period is credited in full"
  household_definition: "enum string; spouse_or_partner_and_children = the primary member, a spouse or domestic partner and children under dependent_age_limit living in the household"
  tier_change_timing: "enum string; next_renewal = a change of membership takes effect at the next renewal"
  activation_requires_first_payment: "boolean; true = a membership activates only after its first fee is paid in full"
  billing_frequency_options: "list of billing frequencies offered"
  rounding_rule: "enum string; amounts rounded half up to the cent"

