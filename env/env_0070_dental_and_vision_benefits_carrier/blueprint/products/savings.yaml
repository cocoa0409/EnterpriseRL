events:
  - type: savings_enroll
    target: savings_memberships
    mutation: create
    meaning: A savings membership is purchased.
    grain: One row per membership.
    fields:
      customer_id: Primary member.
      variant_name: Membership purchased.
      billing_frequency: annual or monthly.
      household_members: Persons covered.
      enrollment_date: Purchase date.
      activation_date: First usable day.
      renewal_date: First renewal date.
      fee_balance: 0.00 before the first fee is billed.
    triggers:
      - event: savings:savings_fee_billed
        map: {fee_component: membership_fee, txn_date: enrollment_date, fee_period_start: activation_date}
  - type: savings_activate
    target: savings_memberships
    mutation: {transition: {from: pending_activation, to: active}}
    meaning: Discounts become usable.
    grain: One row per transaction.
    fields:
      activation_date: Activation date.
    triggers: []
  - type: savings_cancel_pending
    target: savings_memberships
    mutation: {transition: {from: pending_activation, to: cancelled}}
    meaning: The member cancels before activation.
    grain: One row per transaction.
    fields:
      cancellation_date: Cancellation date.
    triggers: []
  - type: savings_cancel
    target: savings_memberships
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The member cancels an active membership.
    grain: One row per transaction.
    fields:
      cancellation_date: Last day of the membership.
    triggers: []
  - type: savings_expire
    target: savings_memberships
    mutation: {transition: {from: active, to: expired}}
    meaning: The membership expires because a fee stayed unpaid past the retry period.
    grain: One row per transaction.
    fields:
      cancellation_date: Last day of the last paid period.
    triggers: []
  - type: savings_reactivate
    target: savings_memberships
    mutation: {transition: {from: expired, to: active}}
    meaning: An expired membership is reactivated within the window.
    grain: One row per transaction.
    fields:
      cancellation_date: Cleared.
      renewal_date: Next renewal counted from reactivation.
    triggers: []
  - type: savings_renewal
    target: savings_memberships
    mutation: update
    meaning: The membership renews for another term.
    grain: One row per transaction.
    fields:
      renewal_date: Next renewal date.
    triggers:
      - event: savings:savings_fee_billed
        map: {fee_component: membership_fee}
  - type: savings_fee_billed
    target: savings_transactions
    meaning: A membership or activation fee is charged.
    grain: One row per fee component per period.
    distinguish_by: [fee_component, fee_period_start]
    fields:
      fee_component: membership_fee or activation_fee.
      fee_period_start: Period start.
      amount: Fee amount.
      txn_date: Charge date.
    account: membership_fee_balance
    direction: in
    triggers: []
  - type: savings_fee_paid
    target: savings_transactions
    meaning: A fee payment is received.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      fee_component: Fee paid.
      fee_period_start: Period paid.
      amount: Amount paid.
      txn_date: Payment date.
      payment_reference: Card confirmation.
    account: membership_fee_balance
    direction: out
    triggers: []
  - type: savings_fee_credited
    target: savings_transactions
    meaning: A fee is credited (money-back guarantee, unused months, duplicate charge, insurance conversion).
    grain: One row per credited fee.
    distinguish_by: [original_savings_txn_id, credit_reason]
    fields:
      fee_component: Fee credited.
      fee_period_start: Period of the credited fee.
      amount: Credit.
      txn_date: Credit date.
      credit_reason: Reason.
      original_savings_txn_id: Fee credited.
    account: membership_fee_balance
    direction: out
    triggers: []
  - type: savings_fee_refunded
    target: savings_transactions
    meaning: A credit balance is paid back to the member.
    grain: One row per refund.
    distinguish_by: [original_savings_txn_id]
    fields:
      amount: Refund.
      txn_date: Refund date.
      payment_reference: Refund trace.
      credit_reason: Reason of the credit refunded.
      original_savings_txn_id: Credit refunded.
    account: membership_fee_balance
    direction: in
    triggers: []
  - type: savings_visit_recorded
    target: savings_transactions
    meaning: A discounted visit at a savings-network practice is recorded.
    grain: One row per visit service.
    distinguish_by: [provider_agreement_id, txn_date, service_category]
    fields:
      provider_agreement_id: Practice's savings-network agreement.
      service_category: Discount category.
      usual_fee: Usual fee.
      discounted_fee: Fee paid by the member.
      amount: Savings (usual minus discounted).
      txn_date: Visit date.
    triggers: []

measures: []

policies:
  - id: savings_agg_multi_holding
    subject: [savings_enroll]
    rule: >-
      A primary member may hold only one savings membership at a time; a household membership covers the household instead of separate memberships.
    eligibility:
      - id: one_open_membership
        applies_to: [savings_enroll]
        kind: dedup
        condition: A primary member may hold only one savings membership at a time; a household membership covers the household instead of separate memberships.
        evidence_fields: [savings_memberships.customer_id, savings_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [savings_memberships.customer_id]
          action_bindings:
            savings_memberships.customer_id: customer_id
        dedup_contract:
          table: savings_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_activation, active]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: savings_enrollment
    subject: [savings_enroll, savings_activate]
    rule: >-
      A membership is sold only to a primary member at least the entry gate's minimum age residing in one of states_available, with no more persons than household_max_members (household members as defined by household_definition), and every enrollment carries the not-insurance disclosure.
      The membership activates activation_business_days business days after the first fee is paid in full; there is no waiting period, no visit limit and no exclusion for existing conditions.
    eligibility: []

  - id: savings_fees
    subject: [savings_fee_billed, savings_fee_paid, savings_renewal]
    rule: >-
      Annual billing charges annual_fee per term with no activation fee when activation_fee_waived_annual is true; monthly billing charges monthly_fee each month plus activation_fee once.
      The fee is fixed for the current term (price_lock_term) and a new fee applies only from a renewal after price_change_notice_days of notice; memberships renew automatically and annual members receive a renewal notice renewal_notice_days before the renewal date.
      A change to another membership takes effect at the next renewal.
    eligibility: []
    params:
      per_tier:
        Cascade Smile Savings Individual: {annual: "=annual_fee", monthly: "=monthly_fee"}
        Cascade Smile Savings Household: {annual: "=annual_fee", monthly: "=monthly_fee"}
        Cascade Smile & Sight Savings Individual: {annual: "=annual_fee", monthly: "=monthly_fee"}
        Cascade Smile & Sight Savings Household: {annual: "=annual_fee", monthly: "=monthly_fee"}
        Cascade Smile & Sight Savings Plus Individual: {annual: "=annual_fee", monthly: "=monthly_fee"}
        Cascade Smile & Sight Savings Plus Household: {annual: "=annual_fee", monthly: "=monthly_fee"}

  - id: savings_cancellation_refunds
    subject: [savings_cancel_pending, savings_cancel, savings_fee_credited, savings_fee_refunded]
    rule: >-
      Cancelling is the member's own decision and can be made at any time.
      After the money-back period a cancellation ends the membership at the end of the period already paid; a monthly member receives no partial refund, and an annual member is credited the annual fee times the unused full months divided by twelve, rounded half up to the cent (unused_months).
      A fee charged twice for the same period is credited in full (duplicate_charge); credits are refunded to the card within refund_processing_business_days.
    eligibility: []

  - id: savings_money_back_guarantee
    subject: [savings_cancel_pending, savings_cancel, savings_fee_credited]
    rule: >-
      A member may cancel for a full refund no later than the money-back period after the enrollment date of the membership.
      The money-back period is money_back_days counted in calendar days from the enrollment_date, and a cancellation on the last day is in time.
      Such a cancellation ends the membership immediately and credits every fee paid, including the activation fee, with credit_reason money_back_guarantee, whether or not discounts were used.
    eligibility:
      - id: money_back_window
        applies_to: [savings_fee_credited]
        kind: time
        condition: A member may cancel for a full refund no later than the money-back period after the enrollment date of the membership.
        evidence_fields: [savings_memberships.enrollment_date, savings_memberships.savings_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [savings_memberships.savings_membership_id]
          action_bindings:
            savings_memberships.savings_membership_id: savings_membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the enrollment date of the membership
          anchor_source: savings_memberships.enrollment_date
          relation: not_after
          duration_source: variants.money_back_days
          unit: calendar_days
          counting_rule: The money-back period is money_back_days counted in calendar days from the enrollment_date, and a cancellation on the last day is in time.
          boundary: inclusive

  - id: savings_expiration_reactivation
    subject: [savings_expire, savings_reactivate]
    rule: >-
      A failed renewal or monthly charge is retried for failed_payment_retry_days calendar days; when it is still unpaid the membership expires at the end of the last paid period.
      An expired membership may be reactivated within reactivation_window_days calendar days after expiry by paying the fee due, with reactivation_fee; later, a new membership must be purchased.
    eligibility:
      - id: reactivation_window
        applies_to: [savings_reactivate]
        kind: time
        condition: An expired membership may be reactivated within reactivation_window_days calendar days after expiry by paying the fee due, with reactivation_fee; later, a new membership must be purchased.
        evidence_fields: [savings_memberships.cancellation_date, savings_memberships.savings_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [savings_memberships.savings_membership_id]
          action_bindings:
            savings_memberships.savings_membership_id: savings_membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: expiry
          anchor_source: savings_memberships.cancellation_date
          relation: not_after
          duration_source: variants.reactivation_window_days
          unit: calendar_days
          counting_rule: An expired membership may be reactivated within reactivation_window_days calendar days after expiry by paying the fee due, with reactivation_fee; later, a new membership must be purchased.
          boundary: inclusive

  - id: savings_evt_visit_discounts
    subject: [savings_visit_recorded]
    rule: >-
      At a practice holding an active Cascade Savings Network Participating Provider Agreement the member pays the usual fee for the practice's ZIP region less the discount percentage for the service category (discount_preventive_pct, discount_basic_pct, discount_major_pct, discount_ortho_pct, discount_specialist_pct, discount_implant_pct, discount_cosmetic_pct, and, when vision_included is true, discount_vision_exam_pct, discount_eyewear_pct and discount_contacts_pct), rounded half up to the cent; Cascade pays nothing.
      Outside the savings network there is no discount (oon_discount_pct), and a member who reports within visit_price_dispute_days that a practice did not honor the discount is referred to provider relations.
    eligibility: []
    params:
      per_tier:
        Cascade Smile Savings Individual: {preventive: "=discount_preventive_pct", major: "=discount_major_pct", eyewear: "=discount_eyewear_pct"}
        Cascade Smile Savings Household: {preventive: "=discount_preventive_pct", major: "=discount_major_pct", eyewear: "=discount_eyewear_pct"}
        Cascade Smile & Sight Savings Individual: {preventive: "=discount_preventive_pct", major: "=discount_major_pct", eyewear: "=discount_eyewear_pct"}
        Cascade Smile & Sight Savings Household: {preventive: "=discount_preventive_pct", major: "=discount_major_pct", eyewear: "=discount_eyewear_pct"}
        Cascade Smile & Sight Savings Plus Individual: {preventive: "=discount_preventive_pct", major: "=discount_major_pct", eyewear: "=discount_eyewear_pct"}
        Cascade Smile & Sight Savings Plus Household: {preventive: "=discount_preventive_pct", major: "=discount_major_pct", eyewear: "=discount_eyewear_pct"}
    formula:
      amount: usual_fee - discounted_fee

  - id: savings_insurance_combination
    subject: [savings_visit_recorded, savings_fee_credited]
    rule: >-
      A member who also holds Cascade dental PPO, DHMO or vision coverage may use the savings discount only for services that coverage does not pay for (combine_with_insurance), never on the member's share of a covered service.
      A member who enrolls in a Cascade dental PPO or vision plan within insurance_conversion_credit_days calendar days after the membership enrollment_date and cancels the membership is credited the membership fees paid, up to insurance_conversion_credit_cap_months months of fee (insurance_conversion).
    eligibility: []
