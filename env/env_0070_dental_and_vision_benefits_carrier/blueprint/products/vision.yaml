category: vision
display_name: Vision Plans

binding:
  holding_table: vision_plans
  event_tables: [vision_claims]
  intake_tables: [vision_coverage_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [applied, active, terminated, cancelled]
  transitions:
    - {from: applied, to: active, by: system, means: "Coverage starts on the coverage effective date once the binder premium has been received."}
    - {from: applied, to: cancelled, by: user, means: "The applicant withdraws before the coverage effective date."}
    - {from: applied, to: cancelled, by: system, means: "The binder premium was not received by the binder deadline."}
    - {from: active, to: cancelled, by: user, means: "An individual subscriber returns the plan within the free-look period; coverage is void from the start."}
    - {from: active, to: terminated, by: user, means: "The subscriber ends coverage; it ends on the last day of the month in which the request is confirmed."}
    - {from: active, to: terminated, by: system, means: "Coverage ends for nonpayment, loss of eligibility or end of the group contract."}
    - {from: terminated, to: active, by: agent, means: "Coverage ended for nonpayment is reinstated without a gap within the reinstatement window."}

accounts: []

parameter_schema:
  exam_copay: "USD; member copay for a routine eye exam in network"
  exam_frequency_months: "months; one routine eye exam per this many months (counted under frequency_basis)"
  lens_benefit_included: "boolean; false = the plan has no spectacle-lens benefit (lenses are bought at the materials discount only)"
  frame_benefit_included: "boolean; false = the plan has no frame benefit"
  contacts_benefit_included: "boolean; false = the plan has no contact-lens benefit"
  materials_copay: "USD; one copay per materials purchase (lenses and frame bought together, or contact lenses) in network; 0.00 = none"
  lens_frequency_months: "months; one pair of spectacle lenses per this many months; 0 when lenses are not covered"
  child_lens_frequency_months: "months; for a patient under 19 on the date of service, one pair of spectacle lenses per this many months; 0 when lenses are not covered"
  frame_frequency_months: "months; one frame per this many months; 0 when frames are not covered"
  contacts_frequency_months: "months; one contact-lens benefit per this many months; 0 when contacts are not covered"
  frequency_basis: "enum string; months_from_last_service = a service becomes available again the stated months after the last paid date of service of the same kind; benefit_year = 12 months means once per benefit period and 24 months once per two consecutive benefit periods counted from the period of the last paid service"
  contacts_in_lieu_of_glasses: "boolean; true = an elective contact-lens benefit is used instead of both the lens and the frame benefit for the same frequency period"
  frame_allowance_private_practice: "USD; frame allowance at a participating independent practice"
  frame_allowance_retail_chain: "USD; frame allowance at a participating retail-chain location"
  frame_overage_discount_pct: "integer percent taken off the amount above the frame allowance at a participating independent practice (not at retail-chain locations)"
  contacts_allowance_elective: "USD; allowance for elective contact lenses and their fitting materials in network"
  contacts_medically_necessary_in_network: "enum string; covered_in_full = medically necessary contact lenses are covered in full in network after the materials copay; not_covered"
  medically_necessary_conditions: "list of qualifying conditions that make contact lenses medically necessary, certified by the provider"
  contact_fitting_standard_copay_max: "USD; most a member pays in network for a standard contact-lens fitting and evaluation"
  contact_fitting_specialty_allowance: "USD; allowance toward a specialty contact-lens fitting in network; 0.00 = no allowance"
  lens_copay_single_vision: "USD; copay for single-vision lenses in network beyond the materials copay"
  lens_copay_lined_bifocal: "USD; copay for lined bifocal lenses beyond the materials copay"
  lens_copay_lined_trifocal: "USD; copay for lined trifocal lenses beyond the materials copay"
  lens_copay_progressive_standard: "USD; copay for standard progressive lenses in network"
  lens_copay_progressive_premium: "USD; copay for premium progressive lenses in network"
  option_copay_polycarbonate_adult: "USD; copay for polycarbonate lenses for patients 19 and over"
  child_polycarbonate_covered: "boolean; true = polycarbonate lenses are covered in full for patients under 19"
  option_copay_scratch_coating: "USD; copay for scratch-resistant coating"
  option_copay_uv_coating: "USD; copay for UV protective coating"
  option_copay_anti_reflective_standard: "USD; copay for standard anti-reflective coating"
  option_copay_anti_reflective_premium: "USD; copay for premium anti-reflective coating"
  option_copay_photochromic: "USD; copay for photochromic lenses"
  option_copay_tint: "USD; copay for solid or gradient tint"
  materials_discount_pct: "integer percent off retail for eyewear bought in network without a materials benefit (no benefit on the plan, benefit already used, or additional pairs)"
  retinal_imaging_copay_max: "USD; most a member pays for routine retinal imaging with the exam in network"
  oon_exam_reimbursement: "USD; most reimbursed to the member for an out-of-network routine exam"
  oon_frame_reimbursement: "USD; most reimbursed for an out-of-network frame; 0.00 when frames are not covered"
  oon_single_vision_reimbursement: "USD; most reimbursed for out-of-network single-vision lenses"
  oon_bifocal_reimbursement: "USD; most reimbursed for out-of-network lined bifocal lenses"
  oon_trifocal_reimbursement: "USD; most reimbursed for out-of-network lined trifocal lenses"
  oon_progressive_reimbursement: "USD; most reimbursed for out-of-network progressive lenses (standard or premium)"
  oon_contacts_elective_reimbursement: "USD; most reimbursed for out-of-network elective contact lenses"
  oon_contacts_medically_necessary_reimbursement: "USD; most reimbursed for out-of-network medically necessary contact lenses"
  oon_lens_options_reimbursed: "boolean; false = lens options get no out-of-network reimbursement"
  timely_filing_days_in_network: "calendar days after date_of_service within which a participating provider must submit a claim"
  timely_filing_days_oon: "calendar days after date_of_service within which a member must submit an out-of-network claim"
  free_look_days: "calendar days after coverage_effective_date within which an individual subscriber may return the plan for a full refund"
  reinstatement_window_days: "calendar days after a nonpayment termination_date within which coverage may be reinstated"
  binder_deadline_days: "calendar days after coverage_effective_date by which the binder premium must be received"
  reenrollment_lockout_months: "calendar months after a voluntary termination_date during which the same person may not re-enroll in an individual vision plan"
  dependent_child_age_limit: "age in years; a child's enrollment ends at the end of the month of this birthday"
  child_age_limit_years: "age in years below which a patient receives child benefits (child lens frequency, child polycarbonate)"
  monthly_premium_member_only: "USD per month, individual rate for member_only"
  monthly_premium_member_spouse: "USD per month, individual rate for member_spouse"
  monthly_premium_member_children: "USD per month, individual rate for member_children"
  monthly_premium_family: "USD per month, individual rate for family"
  tier_change_occasion: "enum string; when an individual enrollment may change plan: benefit_period_start = only effective on the next benefit-period start"
  rounding_rule: "enum string; computed amounts are rounded half up to the cent"

