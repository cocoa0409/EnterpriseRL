      benefit category, where several such decisions share that latest decision date this rule is not used, and a request for a category with
      no such decision is figured under the base rules.
    e_allowed: >-
      The procedure, benefit category, tooth or area, network status, proposed fee and recorded allowance of the request are those of the
      person's most recently issued estimate line (its estimated allowed amount), and where several issued estimate lines share that latest
      issue date this rule is not used; the service class is the one recorded on the person's most recent claim-line decision for the same
      benefit category, where several such decisions share that latest decision date this rule is not used, and a request for a category with
      no such decision is figured under the base rules.
    e_class: >-
      The procedure, benefit category, tooth or area, network status, proposed fee and recorded allowance of the request are those of the
      person's most recently issued estimate line (its estimated allowed amount), and where several issued estimate lines share that latest
      issue date this rule is not used; the service class is the one recorded on the person's most recent claim-line decision for the same
      benefit category, where several such decisions share that latest decision date this rule is not used, and a request for a category with
      no such decision is figured under the base rules.
    e_year: >-
      The deductible taken on a requested estimate is the plan's individual deductible less the person's deductible postings net of deductible
      reversals for the issue date's benefit year, never below zero and never more than the allowance; a preventive-class service on a plan
      that waives the preventive deductible, or any service on a plan whose individual deductible is 0.00, takes none.
    e_ext: >-
      When the plan's missing-tooth clause months are above 0, a requested estimate for a bridge, denture or implant that replaces a tooth
      extracted before the coverage effective date is payable only once the months of continuous enrollment, counted in whole calendar months
      from the coverage effective date to the issue date, reach the clause months; the clause does not apply to group enrollments entered
      at open enrollment, as new hires or by special enrollment; the extraction date is the one recorded on the person's most recently decided
      claim line for that tooth, where several claim lines for that tooth share that latest decision date this rule is not used, and a request
      for a replaced tooth whose most recently decided claim line records no extraction date is figured under the base rules; an estimate
      the clause still bars has an estimated plan payment of 0.00.
    allow_e: >-
      The allowance a requested estimate is figured on is the lesser of the proposed fee and the allowance recorded on that estimate line.
    ped: >-
      The benefit limit on a requested estimate follows the person and the plan: for a person receiving the pediatric essential-health-benefit
      treatment (an individual_exchange enrollment and an issue date before the person's pediatric_ehb_age_limit_years birthday) no annual
      maximum applies, and on such a person's estimate from an in-network practice the estimated patient cost is never more than the pediatric
      out-of-pocket maximum for one child less the person's pediatric out-of-pocket postings net of reversals for the benefit year, and the
      estimated plan payment on such an estimate is then the allowance less that limited cost, so an estimate that crosses the pediatric out-of-pocket
      maximum pays the allowance minus the cost sharing still remaining; for a non-preventive service on a plan that banks rollover dollars,
      the estimated plan payment is never more than the remaining annual maximum plus the person's rollover balance (rollover credits less
      rollover draws); for a preventive service on a plan whose annual maximum does not apply to preventive services, no annual maximum applies;
      otherwise the estimated plan payment is never more than the remaining annual maximum; this modifies the estimated patient cost on a
      requested estimate.
    wait_len: >-
      A requested estimate is payable only when the issue date is at least its waiting period counted in whole calendar months from the coverage
      effective date (a month counting as whole when the day of the month of the issue date is not earlier than that of the coverage effective
      date, which always falls on the first of a month), where the waiting period is the one for the service class that applies to the enrollment
      (the plan's individual waiting period for individual and individual_exchange enrollments, its late-entrant waiting period for group
      enrollments with enrollment type late_entrant, and none for other group enrollments or for preventive services); otherwise its estimated
      plan payment is 0.00.
    clause_need: >-
      When the plan's missing-tooth clause months are above 0, a requested estimate for a bridge, denture or implant that replaces a tooth
      extracted before the coverage effective date is payable only once the months of continuous enrollment, counted in whole calendar months
      from the coverage effective date to the issue date, reach the clause months; the clause does not apply to group enrollments entered
      at open enrollment, as new hires or by special enrollment; the extraction date is the one recorded on the person's most recently decided
      claim line for that tooth, where several claim lines for that tooth share that latest decision date this rule is not used, and a request
      for a replaced tooth whose most recently decided claim line records no extraction date is figured under the base rules; an estimate
      the clause still bars has an estimated plan payment of 0.00.
    ded_room: >-
      The deductible taken on a requested estimate is the plan's individual deductible less the person's deductible postings net of deductible
      reversals for the issue date's benefit year, never below zero and never more than the allowance; a preventive-class service on a plan
      that waives the preventive deductible, or any service on a plan whose individual deductible is 0.00, takes none.
    room: >-
      The estimated plan payment on a requested estimate is never more than the person's remaining annual maximum for the issue date's benefit
      year, the plan's annual maximum less the person's maximum postings net of maximum reversals for that benefit year.
    oop_used: >-
      The benefit limit on a requested estimate follows the person and the plan: for a person receiving the pediatric essential-health-benefit
