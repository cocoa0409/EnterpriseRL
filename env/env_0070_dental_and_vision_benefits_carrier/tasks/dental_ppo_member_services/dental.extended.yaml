  factors:
  - id: priorlevel_dhmo_months
    effect: parameter
    decides: credit_months
    bindings:
    - ce_month
    - ce_first
    - ce_day
    - pv_first
    - day_before
    - dhmo_start
    - dhmo_end
    - doc_gap
    - credit_months
    ladder:
    - when: >-
        the plan credits prior coverage month for month AND the person has a terminated Cascade DHMO enrollment that ended on the day before
        this enrollment's coverage effective date
      value: the calendar months from the month that DHMO coverage took effect through the month it ended, both counted
    - when: >-
        the plan credits prior coverage month for month AND no such DHMO enrollment exists AND the enrollment shows documented prior coverage
        months ending no more than prior_coverage_max_gap_days days before the coverage effective date
      value: F('prior_coverage_months')
    - when: otherwise
      value: '0'
    baseline:
      credit_months: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dhmo
  - id: priorlevel_coinsurance
    effect: parameter
    decides: line_rate
    bindings:
    - rate_net
    - line_rate
    ladder:
    - when: a basic-class line from an out_of_network practice
      value: P('coinsurance_basic_oon')
    - when: a major-class line from an out_of_network practice
      value: P('coinsurance_major_oon')
    - when: otherwise
      value: the plan's in-network percentage for the line's service class
    baseline:
      line_rate: >-
        P('coinsurance_preventive_in_network') if t_class == 'preventive' else (P('coinsurance_basic_in_network') if t_class == 'basic' else
        P('coinsurance_major_in_network'))
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: priorlevel_allowance
    effect: parameter
    decides: line_allow
    bindings:
    - t_cat
    - t_cdt
    - t_tooth
    - t_alt
    - alt_case
    - allow_billed
    - line_allow
    ladder:
    - when: >-
        a posterior composite on a posterior-composite-alternate plan, or a porcelain or ceramic molar crown on a molar-crown-alternate plan,
        billed at or above its alternate allowance
      value: the alternate allowance
    - when: a line billed below the allowance that would otherwise apply
      value: the billed amount
    - when: otherwise
      value: the allowed amount
    baseline:
      line_allow: t_allowed
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: priorlevel_coordination
    effect: method
    decides: cob_less
    bindings:
    - cob_paid
    - cob_less
    - cob_limit
    ladder:
    - when: a primary payment above 0.00 is recorded AND the plan coordinates by non_duplication
      method: the normal benefit less the primary payment, never below zero
    - when: a primary payment above 0.00 is recorded AND the plan coordinates by standard_cob
      method: the payment limited to the allowed amount less the primary payment
    - when: otherwise
      method: no adjustment
    baseline:
      cob_less: '0'
      cob_limit: t_allowed
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: priorlevel_share_adjustment
    effect: method
    decides: share_less
    bindings:
    - oop_used
    - share_paid
    - share_less
    - share_cap
    ladder:
    - when: the person receives the pediatric essential-health-benefit treatment AND the line is from an in-network practice
      method: >-
        the share first limited to the one-child pediatric out-of-pocket maximum less the person's net pediatric out-of-pocket postings for
        the line's benefit year with any posting the replaced decision made to that year backed out, then less any recorded primary payment
        (the plan payment being the allowance less the limited share)
    - when: any other line with a primary payment above 0.00 recorded
      method: the share less the primary payment
    - when: otherwise
      method: the share unadjusted
    baseline:
      share_less: '0'
      share_cap: base_amt
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      A corrected prior-level decision is booked to the benefit year its date of service falls in, the calendar year of that date, whatever
      benefit year the replaced decision was booked to, and the deductible and annual-maximum counts it uses are those of that benefit year.
      The payment on a reprocessed prior-level line is figured on the line's allowed amount. The coinsurance on a reprocessed prior-level
      line is the plan's in-network percentage for the line's service class. A reprocessed prior-level line is payable at the plan's level
      only when its date of service is at least its waiting period counted in whole calendar months from the plan change date (a month counting
      as whole when the day of the month of the date of service is not earlier than that of the plan change date, which always falls on the
      first of a month), where the waiting period is the one for the line's service class that applies to the enrollment (the plan's individual
      waiting period for individual and individual_exchange enrollments, its late-entrant waiting period for group enrollments with enrollment
      type late_entrant, and none for other group enrollments or for preventive services); until then it is figured at the coinsurance percentage
      recorded on the decision it replaces. The deductible taken on a reprocessed prior-level line is the plan's individual deductible less
      the person's deductible postings net of deductible reversals for the line's benefit year, after any posting the replaced decision made
      to that benefit year is backed out, never below zero and never more than the allowance the payment is figured on; a preventive-class
      line on a plan that waives the preventive deductible, or any line on a plan whose individual deductible is 0.00, takes none. Because
      every Cascade plan's family deductible maximum is three times its individual deductible, on an account with no more than three enrolled
      persons the family limit never falls below the person's own remaining deductible, so a reprocessed prior-level line counts only the
      person's own deductible postings. The normal benefit on a reprocessed prior-level line is the allowance less the deductible taken, times
      the coinsurance, rounded to the cent with a half cent rounded up, and the plan payment and patient share are rounded to the cent the
      same way. The plan payment on a reprocessed prior-level line is never more than the person's remaining annual maximum for the line's
      benefit year, the plan's annual maximum less the person's maximum postings net of maximum reversals for that benefit year, after any
      posting the replaced decision made to that benefit year is backed out; for a person receiving the pediatric essential-health-benefit
      treatment (an individual_exchange enrollment and a date of service before the person's pediatric_ehb_age_limit_years birthday) no annual
      maximum applies. The patient share on a reprocessed prior-level line is the billed amount less the plan payment for a line from an out_of_network
      practice, and the allowed amount less the plan payment otherwise, never below zero.
    params:
    - deductible_individual
    - coinsurance_basic_in_network
    - coinsurance_major_in_network
    - wait_basic_months_individual
    - wait_major_months_individual
    - wait_basic_months_late_entrant
    - wait_major_months_late_entrant
    - annual_maximum_per_person
    - pediatric_ehb_age_limit_years
  inputs:
    history:
    - table: dental_claim_lines
      aggregate: latest
      field: dental_claim_line_id
      filters:
        event_type: dental_claim_line_paid
        service_class: basic
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_deductible_posting
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_max_posting
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_ped_oop_posting
    cross_category:
    - dhmo
- id: dental_ext_grace_denial_reprocess
  base_policy_refs:
  - dental_evt_claim_adjudication
  - dental_agg_family_deductible
  - dental_evt_cob
  - dental_evt_pediatric_ehb
  - dental_evt_waiting_periods
  - dental_evt_eligibility_on_dos
  - dental_evt_timely_filing
  - dental_evt_accumulators
  overwrite:
  - base_policy: dental_evt_waiting_periods
    superseded_clause: >-
      When the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months (never below
      zero); with none there is no credit.
    replaced_by: >-
      For a reprocessed grace-period line under this rule, and only for such a case, the months credited toward the waiting period follow
      the earlier-coverage credit stated in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule,
      the prior-level reprocessing rule, the estimate-request rule and the claim-appeal rule each follow their own rule, and every other case
      remains under the base rule: when the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months,
      never below zero, and with none there is no credit.
  - base_policy: dental_evt_claim_adjudication
    superseded_clause: >-
      The allowance is the allowed_amount for the billed procedure, replaced by the alternate_allowed_amount when an alternate benefit applies:
      a posterior composite filling when posterior_composite_alternate_benefit is true, or a porcelain or ceramic crown on a molar (a tooth
      listed in molar_teeth) when molar_crown_alternate_benefit is true; such a line is paid with remark PAID_ALTERNATE_BENEFIT.
    replaced_by: >-
      In every case, whether or not under this rule, a claim line paid on an alternate allowance carries remark PAID_ALTERNATE_BENEFIT, and
      a reprocessed decision of such a line carries the reprocessing remark ADJUSTED_REPROCESSED in its place. For a reprocessed grace-period
      line under this rule, and only for such a case, the allowance is figured as stated in this rule; cases under the initial-wait reprocessing
      rule, the new-plan-wait reprocessing rule, the prior-level reprocessing rule and the estimate-request rule each follow their own rule,
      and every other case remains under the base rule: the allowance is the allowed amount for the billed procedure, replaced by the alternate
      allowance when an alternate benefit applies (a posterior composite filling on a plan with the posterior-composite alternate benefit,
      or a porcelain or ceramic crown on a molar on a plan with the molar-crown alternate benefit), and such a line is paid with remark PAID_ALTERNATE_BENEFIT.
  - base_policy: dental_evt_claim_adjudication
    superseded_clause: >-
      For an in_network line the member owes the allowed_amount minus the plan payment and the practice may not bill more; for an out_of_network
      line the member owes the submitted_amount minus the plan payment.
    replaced_by: >-
      In every case, whether or not under this rule, the practice of an in-network line may not bill the member more than the allowed amount.
      For a reprocessed grace-period line under this rule, and only for such a case, the patient share is figured as stated in this rule;
      cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing rule and the estimate-request
      rule each follow their own rule, and every other case remains under the base rule: for an in-network line the member owes the allowed
      amount minus the plan payment and the practice may not bill more, and for an out-of-network line the submitted amount minus the plan
      payment.
  trigger: state_due
  subject:
  - dental_claim_line_adjusted
  computes: member_responsibility
  target_tool: reprocess_grace_denial_4c0e9d17
  params:
    molar_teeth: ',1,2,3,14,15,16,17,18,19,30,31,32,'
    porcelain_codes: ',D2740,D2750,D2751,D2752,D2783,'
  rule: >-
    This grace-period reprocessing rule fixes the corrected patient share when a line that stands denied DENIED_NOT_ELIGIBLE although its
    date of service falls within the enrollment's coverage (on or after the coverage effective date and, when a termination date is set, on
    or before it), the denial having been made while the funding billing account was in a premium grace period during which such a line is
    adjudicated normally, is reprocessed as a line adjudicated normally; a line of an enrollment whose plan changed that falls within the
    new waiting period for a service class the prior plan also covered, a line that a frequency or age limit would deny, a bridge, denture
    or implant replacing a tooth extracted before the coverage effective date, a line on a plan that banks rollover dollars whose payment
    would be limited by the remaining annual maximum, a line of a child whose subscriber has two or more children enrolled on individual_exchange
    enrollments, and a line on an account with more than three enrolled persons are reprocessed under the base rules. The line under reprocessing
    is the enrollment's most recently decided line whose event type is denied and whose remark is DENIED_NOT_ELIGIBLE, and where several such
    lines share that latest decision date this rule is not used and each is reprocessed under the base rules; where that line's date of service
    falls outside the enrollment's coverage it was rightly denied and this rule is not used. A corrected grace-period decision keeps the denied
    line's claim number, line number, practice, network status, procedure, service class, tooth, extraction date, dates, receipt date, benefit
    year, billed amount, allowed amount, alternate allowance and other-carrier payment. The payment on a reprocessed grace-period line is
    figured on the line's allowed amount. The coinsurance on a reprocessed grace-period line is the plan's in-network percentage for the line's
    service class. A reprocessed grace-period line is payable at the plan's level only when its date of service is at least its waiting period
    counted in whole calendar months from the plan change date when the line is dated on or after a plan change, and from the coverage effective
    date otherwise (a month counting as whole when the day of the month of the date of service is not earlier than that of the date counted
    from, which always falls on the first of a month), where the waiting period is the one for the line's service class that applies to the
    enrollment (the plan's individual waiting period for individual and individual_exchange enrollments, its late-entrant waiting period for
    group enrollments with enrollment type late_entrant, and none for other group enrollments or for preventive services); otherwise its plan
    payment is 0.00. A reprocessed grace-period line received later than its filing limit after its date of service (timely_filing_days_in_network
    calendar days for a line from an in-network practice, timely_filing_days_oon calendar days for any other line) is denied for timely filing
    and its plan payment is 0.00. The deductible taken on a reprocessed grace-period line is the plan's individual deductible less the person's
    deductible postings net of deductible reversals for the line's benefit year, never below zero and never more than the allowance the payment
    is figured on; a preventive-class line on a plan that waives the preventive deductible, or any line on a plan whose individual deductible
    is 0.00, takes none. Because every Cascade plan's family deductible maximum is three times its individual deductible, on an account with
    no more than three enrolled persons the family limit never falls below the person's own remaining deductible, so a reprocessed grace-period
    line counts only the person's own deductible postings. The normal benefit on a reprocessed grace-period line is the allowance less the
    deductible taken, times the coinsurance, rounded to the cent with a half cent rounded up, and the plan payment and patient share are rounded
    to the cent the same way. The plan payment on a reprocessed grace-period line is never more than the person's remaining annual maximum
    for the line's benefit year, the plan's annual maximum less the person's maximum postings net of maximum reversals for that benefit year;
    for a person receiving the pediatric essential-health-benefit treatment (an individual_exchange enrollment and a date of service before
    the person's pediatric_ehb_age_limit_years birthday) no annual maximum applies. The patient share on a reprocessed grace-period line is
    the allowed amount less the plan payment, never below zero. The adjustments below are applied to the standard amount in this order: the
    filing and waiting-period tests first, then the allowance and coinsurance replacements, which give the normal benefit; then the other-carrier
    deduction, never taking the payment below zero; then the other-carrier ceiling; then the annual-maximum ceiling, which gives the plan
    payment; the patient share is figured last from the plan payment, its limit applied before its reduction and its zero floor last. A reprocessed
    grace-period line's patient share is fixed only after the person's most recently decided paid basic- or major-class line, when it is booked
    to this line's benefit year although its date of service falls in an earlier one and was paid at a prior plan's coinsurance for a service
    whose new waiting period the person's earlier Cascade DHMO coverage has already served, has been reprocessed. The months a reprocessed
    grace-period line credits toward its waiting period follow the person's earlier coverage: when the plan credits prior coverage month for
    month and the person (matched by name and date of birth) has a terminated Cascade DHMO enrollment that ended on the day before this enrollment's
    coverage effective date (a move from the DHMO with no break in coverage), the credit is the calendar months from the month that DHMO coverage
    took effect through the month it ended, both months counted (DHMO coverage always takes effect on the first of a month); when the plan
    credits prior coverage month for month, no such DHMO enrollment exists, and the enrollment shows documented prior coverage months whose
    prior coverage end date is no more than prior_coverage_max_gap_days calendar days before the coverage effective date, the credit is those
    documented months; otherwise no months are credited; the months credited shorten that waiting period, never below zero; this modifies
    the patient share on a reprocessed grace-period line. The coinsurance a reprocessed grace-period line is figured at follows its network
    status: a basic-class line from an out_of_network practice is figured at the plan's out-of-network basic percentage; a major-class line
    from an out_of_network practice is figured at the plan's out-of-network major percentage; a preventive-class line from an out_of_network
    practice is figured at the plan's out-of-network preventive percentage; any other line is figured at the plan's in-network percentage
    for its service class; this modifies the patient share on a reprocessed grace-period line. The allowance a reprocessed grace-period line
    is figured on follows the billed procedure: a posterior composite filling on a plan with the posterior-composite alternate benefit, or
    a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth 1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and 32)
    on a plan with the molar-crown alternate benefit, whose billed amount is not below its alternate allowance, is figured on its alternate
    allowance; any line whose billed amount is below the allowance that would otherwise apply (the alternate allowance for such a filling
    or crown, the allowed amount otherwise) is figured on its billed amount; every remaining line is figured on its allowed amount; this modifies
    the patient share on a reprocessed grace-period line. The other-carrier adjustment of a reprocessed grace-period line follows the primary
    payment recorded on the decision it replaces: when that payment is above 0.00 and the plan coordinates by non-duplication, the normal
    benefit is reduced by it, never below zero; when it is above 0.00 and the plan coordinates by standard coordination of benefits, the payment
    is limited to the allowed amount less it; when none is recorded, no adjustment is made; this modifies the patient share on a reprocessed
    grace-period line. The amount the patient share on a reprocessed grace-period line starts from follows the network and the filing: for
    a line from an in-network practice received later than timely_filing_days_in_network calendar days after its date of service it is 0.00,
    the practice bearing the amount; for a line from an out_of_network practice it is the billed amount; for any other line it is the allowed
    amount; this modifies the patient share on a reprocessed grace-period line. The patient share on a reprocessed grace-period line follows
    the person and the other coverage: for a person receiving the pediatric essential-health-benefit treatment on a line from an in-network
    practice, the patient share is first limited to the pediatric out-of-pocket room (the pediatric out-of-pocket maximum for one child less
    the person's pediatric out-of-pocket postings net of reversals for the benefit year) and then reduced by any primary payment recorded
    on the line, and the plan payment on such a line is the allowance less that limited share, so the line that crosses the pediatric out-of-pocket
    maximum pays the allowance minus the cost sharing still remaining and a later line pays the full allowance; for any other line on which
    a primary payment above 0.00 is recorded, the patient share is reduced by that primary payment; otherwise the patient share is not adjusted;
    the patient share is never below zero; this modifies the patient share on a reprocessed grace-period line. For a reprocessed grace-period
    line under this rule, and only for such a case, the months credited toward the waiting period follow the earlier-coverage credit stated
    in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing rule,
    the estimate-request rule and the claim-appeal rule each follow their own rule, and every other case remains under the base rule: when
    the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months, never below zero,
    and with none there is no credit. In every case, whether or not under this rule, a claim line paid on an alternate allowance carries remark
    PAID_ALTERNATE_BENEFIT, and a reprocessed decision of such a line carries the reprocessing remark ADJUSTED_REPROCESSED in its place. For
    a reprocessed grace-period line under this rule, and only for such a case, the allowance is figured as stated in this rule; cases under
    the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing rule and the estimate-request rule
    each follow their own rule, and every other case remains under the base rule: the allowance is the allowed amount for the billed procedure,
    replaced by the alternate allowance when an alternate benefit applies (a posterior composite filling on a plan with the posterior-composite
    alternate benefit, or a porcelain or ceramic crown on a molar on a plan with the molar-crown alternate benefit), and such a line is paid
    with remark PAID_ALTERNATE_BENEFIT. In every case, whether or not under this rule, the practice of an in-network line may not bill the
    member more than the allowed amount. For a reprocessed grace-period line under this rule, and only for such a case, the patient share
    is figured as stated in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the prior-level
    reprocessing rule and the estimate-request rule each follow their own rule, and every other case remains under the base rule: for an in-network
    line the member owes the allowed amount minus the plan payment and the practice may not bill more, and for an out-of-network line the
    submitted amount minus the plan payment.
  prerequisite:
  - problem: dental_ext_upgrade_paid_reprocess
    kind: value_input
    gate: ded_room
    form: state
    policy_source: >-
      A reprocessed grace-period line's patient share is fixed only after the person's most recently decided paid basic- or major-class line,
      when it is booked to this line's benefit year although its date of service falls in an earlier one and was paid at a prior plan's coinsurance
      for a service whose new waiting period the person's earlier Cascade DHMO coverage has already served, has been reprocessed.
    condition: >-
      The person's most recently decided paid basic or major line, dated in the earlier benefit year but booked to the grace-period line's
      benefit year at the prior plan's coinsurance, has a reprocessed (adjusted) decision booked to the benefit year of its date of service,
      and the deductible and maximum postings the replaced decision made to the grace-period line's benefit year are reversed.
    resolved_by: reprocess_upgrade_paid_line_3fd2b6c9
    effect: >-
      The person's net deductible postings for the grace-period line's benefit year fall by the reversed deductible, so the deductible the
      grace-period line takes rises by that amount (up to its own remaining deductible).
  cross_category:
  - category: dhmo
    as: history
    reads:
    - status
    - enrollee_name
    - enrollee_date_of_birth
    - coverage_effective_date
    - termination_date
    note: the waiting-period credit reads the person's terminated DHMO enrollment that ended the day before this coverage
  compute:
  - tline: >-
      LATEST('dental_claim_lines', 'dental_claim_line_id', date_field='adjudicated_date', event_type='dental_claim_line_denied', remark_code='DENIED_NOT_ELIGIBLE')
  - t_class: LATEST('dental_claim_lines', 'service_class', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_dos: LATEST('dental_claim_lines', 'date_of_service', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_year: LATEST('dental_claim_lines', 'benefit_year', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_allowed: LATEST('dental_claim_lines', 'allowed_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_cat: LATEST('dental_claim_lines', 'procedure_category', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_cdt: LATEST('dental_claim_lines', 'cdt_code', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_tooth: LATEST('dental_claim_lines', 'tooth_or_area', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_billed: LATEST('dental_claim_lines', 'submitted_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_alt: LATEST('dental_claim_lines', 'alternate_allowed_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_other: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_received: LATEST('dental_claim_lines', 'received_date', date_field='adjudicated_date', dental_claim_line_id=tline)
  - ped: >-
      F('market_segment') == 'individual_exchange' and MONTHS(F('enrollee_date_of_birth'), t_dos) < 12 * P('pediatric_ehb_age_limit_years')
  - wait_from: >-
      F('tier_change_effective_date') if (F('tier_change_effective_date') and t_dos >= F('tier_change_effective_date')) else F('coverage_effective_date')
  - wait_len: >-
      0 if (t_class == 'preventive' or (F('market_segment') == 'group' and F('enrollment_type') != 'late_entrant')) else ((P('wait_basic_months_late_entrant')
      if t_class == 'basic' else P('wait_major_months_late_entrant')) if F('market_segment') == 'group' else (P('wait_basic_months_individual')
      if t_class == 'basic' else P('wait_major_months_individual')))
  - ded_room: >-
      0 if ((t_class == 'preventive' and P('deductible_waived_preventive')) or P('deductible_individual') == 0) else MX(0, P('deductible_individual')
      - (SUM('dental_accumulator_postings', 'amount', event_type='dental_deductible_posting', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_deductible_reversal', benefit_year=t_year)))
  - room: >-
      t_allowed if ped else MX(0, P('annual_maximum_per_person') - (SUM('dental_accumulator_postings', 'amount', event_type='dental_max_posting',
      benefit_year=t_year) - SUM('dental_accumulator_postings', 'amount', event_type='dental_max_reversal', benefit_year=t_year)))
  - oop_used: >-
      SUM('dental_accumulator_postings', 'amount', event_type='dental_ped_oop_posting', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_ped_oop_reversal', benefit_year=t_year)
  - late: >-
      DAYS(t_dos, t_received) > (P('timely_filing_days_in_network') if t_net != 'out_of_network' else P('timely_filing_days_oon'))
  - ce_month: MONTHS('2000-01-01', F('coverage_effective_date'))
  - ce_first: ('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-01'
  - ce_day: DAYS(ce_first, F('coverage_effective_date')) + 1
  - pv_first: ('%d' % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-01'
  - day_before: >-
      (('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-' + ('%02d' % (ce_day - 1))) if ce_day > 1 else (('%d'
      % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-' + ('%02d' % DAYS(pv_first, ce_first)))
  - dhmo_start: >-
      CFIELD('dhmo', 'coverage_effective_date', enrollee_name=F('enrollee_name'), enrollee_date_of_birth=F('enrollee_date_of_birth'), status='terminated',
      termination_date=day_before)
  - dhmo_end: >-
      CFIELD('dhmo', 'termination_date', enrollee_name=F('enrollee_name'), enrollee_date_of_birth=F('enrollee_date_of_birth'), status='terminated',
      termination_date=day_before)
  - doc_gap: DAYS(F('prior_coverage_end_date'), F('coverage_effective_date')) if F('prior_coverage_months') > 0 else 99999
  - credit_months: >-
      (MONTHS(dhmo_start, dhmo_end) + 1) if (dhmo_start != None and P('prior_coverage_credit_method') == 'month_for_month') else (F('prior_coverage_months')
      if (doc_gap <= P('prior_coverage_max_gap_days') and P('prior_coverage_credit_method') == 'month_for_month') else 0)
  - rate_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - line_rate: >-
      P('coinsurance_basic_oon') if (rate_net == 'out_of_network' and t_class == 'basic') else (P('coinsurance_major_oon') if (rate_net ==
      'out_of_network' and t_class == 'major') else (P('coinsurance_preventive_oon') if (rate_net == 'out_of_network' and t_class == 'preventive')
      else (P('coinsurance_preventive_in_network') if t_class == 'preventive' else (P('coinsurance_basic_in_network') if t_class == 'basic'
      else P('coinsurance_major_in_network')))))
  - alt_case: >-
      (t_cat == 'filling_composite_posterior' and P('posterior_composite_alternate_benefit')) or (t_cat == 'crown' and (',' + t_cdt + ',')
      in K('porcelain_codes') and (',' + t_tooth + ',') in K('molar_teeth') and P('molar_crown_alternate_benefit'))
  - allow_billed: LATEST('dental_claim_lines', 'submitted_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - line_allow: >-
      t_alt if (alt_case and allow_billed >= t_alt) else (allow_billed if allow_billed < (t_alt if alt_case else t_allowed) else t_allowed)
  - cob_paid: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - cob_less: cob_paid if (cob_paid > 0 and P('cob_method') == 'non_duplication') else 0
  - cob_limit: (t_allowed - cob_paid) if (cob_paid > 0 and P('cob_method') == 'standard_cob') else t_allowed
  - from_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - share_from: 0 if (from_net != 'out_of_network' and late) else (t_billed if from_net == 'out_of_network' else t_allowed)
  - share_paid: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - share_less: share_paid if ((ped and t_net != 'out_of_network') or share_paid > 0) else 0
  - share_cap: MX(0, P('pediatric_oop_max_one_child') - oop_used) if (ped and t_net != 'out_of_network') else MX(t_billed, t_allowed)
  - result: >-
      RND(MX(0, MN(share_cap, share_from - (MN(MN(MX(0, RND((line_allow - MN(line_allow, ded_room)) * line_rate / 100, 2) - cob_less), cob_limit),
      room) if ((not late) and MONTHS(wait_from, t_dos) >= MX(0, wait_len - credit_months)) else 0)) - share_less), 2)
  compute_basis:
    tline: >-
      The line under reprocessing is the enrollment's most recently decided line whose event type is denied and whose remark is DENIED_NOT_ELIGIBLE,
      and where several such lines share that latest decision date this rule is not used and each is reprocessed under the base rules; where
      that line's date of service falls outside the enrollment's coverage it was rightly denied and this rule is not used.
    t_class: >-
      A corrected grace-period decision keeps the denied line's claim number, line number, practice, network status, procedure, service class,
      tooth, extraction date, dates, receipt date, benefit year, billed amount, allowed amount, alternate allowance and other-carrier payment.
    t_dos: >-
      A corrected grace-period decision keeps the denied line's claim number, line number, practice, network status, procedure, service class,
      tooth, extraction date, dates, receipt date, benefit year, billed amount, allowed amount, alternate allowance and other-carrier payment.
    t_year: >-
      A corrected grace-period decision keeps the denied line's claim number, line number, practice, network status, procedure, service class,
      tooth, extraction date, dates, receipt date, benefit year, billed amount, allowed amount, alternate allowance and other-carrier payment.
    t_allowed: The payment on a reprocessed grace-period line is figured on the line's allowed amount.
    t_net: >-
      The coinsurance a reprocessed grace-period line is figured at follows its network status: a basic-class line from an out_of_network
      practice is figured at the plan's out-of-network basic percentage; a major-class line from an out_of_network practice is figured at
      the plan's out-of-network major percentage; a preventive-class line from an out_of_network practice is figured at the plan's out-of-network
      preventive percentage; any other line is figured at the plan's in-network percentage for its service class; this modifies the patient
      share on a reprocessed grace-period line.
    t_cat: >-
      The allowance a reprocessed grace-period line is figured on follows the billed procedure: a posterior composite filling on a plan with
      the posterior-composite alternate benefit, or a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth
      1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and 32) on a plan with the molar-crown alternate benefit, whose billed amount is not below its
      alternate allowance, is figured on its alternate allowance; any line whose billed amount is below the allowance that would otherwise
      apply (the alternate allowance for such a filling or crown, the allowed amount otherwise) is figured on its billed amount; every remaining
      line is figured on its allowed amount; this modifies the patient share on a reprocessed grace-period line.
