  factors:
  - id: initial_dhmo_months
    effect: parameter
    decides: credit_months
    bindings:
    - dhmo_start
    - dhmo_end
    - doc_gap
    - credit_months
    ladder:
    - when: >-
        the plan credits prior coverage month for month AND the person has an earlier DHMO enrollment (own terminated Cascade DHMO enrollment,
        matched by name and date of birth, ended the day before this coverage effective date)
      value: the calendar months from the month that DHMO coverage took effect through the month it ended, both counted
    - when: >-
        the plan credits prior coverage month for month AND no such DHMO enrollment exists AND the enrollment shows documented prior coverage
        months ending no more than prior_coverage_max_gap_days days before the coverage effective date
      value: F('prior_coverage_months')
    - when: otherwise
      value: '0'
    baseline:
      credit_months: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dhmo
  - id: initial_clause_months
    effect: parameter
    decides: clause_credit
    bindings:
    - ext_plan
    - ext_start
    - ext_end
    - clause_credit
    ladder:
    - when: >-
        the service records of the person's earlier DHMO enrollment show an extraction of the replaced tooth on the line's extraction date
      value: the calendar months of that DHMO enrollment, first and last month counted
    - when: >-
        no such DHMO extraction AND documented prior coverage months whose end date is on or after the extraction date and within prior_coverage_max_gap_days
        days of the coverage effective date
      value: F('prior_coverage_months')
    - when: otherwise
      value: '0'
    baseline:
      clause_credit: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: dhmo
  - id: initial_coinsurance
    effect: parameter
    decides: line_rate
    bindings:
    - rate_net
    - line_rate
    ladder:
    - when: a basic-class line from an out_of_network practice
      value: P('coinsurance_basic_oon')
    - when: a major-class line from an out_of_network practice
      value: P('coinsurance_major_oon')
    - when: otherwise
      value: the plan's in-network percentage for the line's service class
    baseline:
      line_rate: >-
        P('coinsurance_preventive_in_network') if t_class == 'preventive' else (P('coinsurance_basic_in_network') if t_class == 'basic' else
        P('coinsurance_major_in_network'))
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: initial_allowance
    effect: parameter
    decides: line_allow
    bindings:
    - t_cdt
    - t_alt
    - alt_case
    - allow_billed
    - line_allow
    ladder:
    - when: >-
        a posterior composite on a posterior-composite-alternate plan, or a porcelain or ceramic molar crown on a molar-crown-alternate plan,
        billed at or above its alternate allowance
      value: the alternate allowance
    - when: a line billed below the allowance that would otherwise apply
      value: the billed amount
    - when: otherwise
      value: the allowed amount
    baseline:
      line_allow: t_allowed
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: initial_maximum_limit
    effect: method
    decides: max_cap
    bindings:
    - roll_bal
    - max_cap
    ladder:
    - when: >-
        the person receives the pediatric essential-health-benefit treatment (individual_exchange AND before the pediatric_ehb_age_limit_years
        birthday)
      method: no annual maximum
    - when: the plan banks rollover dollars AND the person is not receiving that treatment
      method: payment limited to the remaining annual maximum plus the rollover balance, the excess paid from rollover
    - when: otherwise
      method: payment limited to the remaining annual maximum
    baseline:
      max_cap: room_std
    evidence:
    - history
    - tier_param
    - date
    cross_difficulty: null
  - id: initial_share_adjustment
    effect: method
    decides: share_less
    bindings:
    - oop_used
    - share_paid
    - share_less
    - share_cap
    ladder:
    - when: the person receives the pediatric essential-health-benefit treatment AND the line is from an in-network practice
      method: >-
        the share first limited to the one-child pediatric out-of-pocket maximum less the person's net pediatric out-of-pocket postings, then
        less any recorded primary payment (the plan payment being the allowance less the limited share)
    - when: any other line with a primary payment above 0.00 recorded
      method: the share less the primary payment
    - when: otherwise
      method: the share unadjusted
    baseline:
      share_less: '0'
      share_cap: base_amt
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The payment on a reprocessed initial-wait line is figured on the line's allowed amount. The coinsurance on a reprocessed initial-wait
      line is the plan's in-network percentage for the line's service class. A reprocessed initial-wait line is payable only when its date
      of service is at least its waiting period counted in whole calendar months from the coverage effective date (a month counting as whole
      when the day of the month of the date of service is not earlier than that of the coverage effective date, which always falls on the
      first of a month), where the waiting period is the one for the line's service class that applies to the enrollment (the plan's individual
      waiting period for individual and individual_exchange enrollments, its late-entrant waiting period for group enrollments with enrollment
      type late_entrant, and none for other group enrollments or for preventive services); otherwise its plan payment is 0.00. When the plan's
      missing-tooth clause months are above 0, a reprocessed initial-wait line for a bridge, denture or implant that replaces a tooth whose
      extraction date is before the coverage effective date is payable only once the months of continuous enrollment, counted in whole calendar
      months from the coverage effective date to the date of service, reach the clause months; the clause does not apply to group enrollments
      entered at open enrollment, as new hires or by special enrollment; a line the clause still bars has a plan payment of 0.00. The deductible
      taken on a reprocessed initial-wait line is the plan's individual deductible less the person's deductible postings net of deductible
      reversals for the line's benefit year, never below zero and never more than the allowance the payment is figured on; a preventive-class
      line on a plan that waives the preventive deductible, or any line on a plan whose individual deductible is 0.00, takes none. Because
      every Cascade plan's family deductible maximum is three times its individual deductible, on an account with no more than three enrolled
      persons the family limit never falls below the person's own remaining deductible, so a reprocessed initial-wait line counts only the
      person's own deductible postings. The normal benefit on a reprocessed initial-wait line is the allowance less the deductible taken,
      times the coinsurance, rounded to the cent with a half cent rounded up, and the plan payment and patient share are rounded to the cent
      the same way. The other-carrier adjustment of a reprocessed initial-wait line follows the plan's coordination method and the primary
      payment recorded on the denied line: with non-duplication the normal benefit is reduced by that payment, never below zero; with standard
      coordination of benefits the payment is limited to the allowed amount less that payment; when no primary payment is recorded no adjustment
      is made. The plan payment on a reprocessed initial-wait line is never more than the person's remaining annual maximum for the line's
      benefit year, the plan's annual maximum less the person's maximum postings net of maximum reversals for that benefit year. The patient
      share on a reprocessed initial-wait line is the billed amount less the plan payment for a line from an out_of_network practice, and
      the allowed amount less the plan payment otherwise, never below zero.
    params:
    - deductible_individual
    - coinsurance_basic_in_network
    - coinsurance_major_in_network
    - wait_basic_months_individual
    - wait_major_months_individual
    - wait_basic_months_late_entrant
    - wait_major_months_late_entrant
    - missing_tooth_clause_months
    - annual_maximum_per_person
    - pediatric_ehb_age_limit_years
  inputs:
    history:
    - table: dental_claim_lines
      aggregate: latest
      field: dental_claim_line_id
      filters:
        event_type: dental_claim_line_denied
        remark_code: DENIED_WAITING_PERIOD
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_deductible_posting
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_max_posting
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_ped_oop_posting
    - category: dhmo
      table: dhmo_services
      aggregate: latest
      field: dhmo_plan_id
      filters:
        procedure_category: extraction
    cross_category:
    - dhmo
- id: dental_ext_estimate_request
  base_policy_refs:
  - dental_evt_pretreatment_estimate
  - dental_evt_waiting_periods
  - dental_evt_frequency_age_limits
  - dental_evt_missing_tooth_clause
  - dental_evt_claim_adjudication
  - dental_agg_family_deductible
  - dental_evt_rollover
  - dental_evt_pediatric_ehb
  overwrite:
  - base_policy: dental_evt_waiting_periods
    superseded_clause: >-
      When the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months (never below
      zero); with none there is no credit.
    replaced_by: >-
      For a requested estimate under this rule, and only for such a case, the months credited toward the waiting period follow the earlier-coverage
      credit stated in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing
      rule, the grace-period reprocessing rule and the claim-appeal rule each follow their own rule, and every other case remains under the
      base rule: when the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months,
      never below zero, and with none there is no credit.
  - base_policy: dental_evt_claim_adjudication
    superseded_clause: >-
      The allowance is the allowed_amount for the billed procedure, replaced by the alternate_allowed_amount when an alternate benefit applies:
      a posterior composite filling when posterior_composite_alternate_benefit is true, or a porcelain or ceramic crown on a molar (a tooth
      listed in molar_teeth) when molar_crown_alternate_benefit is true; such a line is paid with remark PAID_ALTERNATE_BENEFIT.
    replaced_by: >-
      In every case, whether or not under this rule, a claim line paid on an alternate allowance carries remark PAID_ALTERNATE_BENEFIT, and
      a reprocessed decision of such a line carries the reprocessing remark ADJUSTED_REPROCESSED in its place. For a requested estimate under
      this rule, and only for such a case, the allowance is figured as stated in this rule; cases under the initial-wait reprocessing rule,
      the new-plan-wait reprocessing rule, the prior-level reprocessing rule and the grace-period reprocessing rule each follow their own
      rule, and every other case remains under the base rule: the allowance is the allowed amount for the billed procedure, replaced by the
      alternate allowance when an alternate benefit applies (a posterior composite filling on a plan with the posterior-composite alternate
      benefit, or a porcelain or ceramic crown on a molar on a plan with the molar-crown alternate benefit), and such a line is paid with
      remark PAID_ALTERNATE_BENEFIT.
  - base_policy: dental_evt_claim_adjudication
    superseded_clause: >-
      For an in_network line the member owes the allowed_amount minus the plan payment and the practice may not bill more; for an out_of_network
      line the member owes the submitted_amount minus the plan payment.
    replaced_by: >-
      In every case, whether or not under this rule, the practice of an in-network line may not bill the member more than the allowed amount.
      For a requested estimate under this rule, and only for such a case, the patient share is figured as stated in this rule; cases under
      the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing rule and the grace-period reprocessing
      rule each follow their own rule, and every other case remains under the base rule: for an in-network line the member owes the allowed
      amount minus the plan payment and the practice may not bill more, and for an out-of-network line the submitted amount minus the plan
      payment.
  - base_policy: dental_evt_missing_tooth_clause
    superseded_clause: >-
      The clause does not apply to group enrollments entered at open enrollment, as new hires or by special enrollment, and it does not apply
      when the person shows prior_coverage_months that cover the extraction date.
    replaced_by: >-
      For a requested estimate under this rule, and only for such a case, earlier coverage counts toward the missing-tooth clause as the clause
      credit stated in this rule; cases under the initial-wait reprocessing rule follow their own rule, and every other case remains under
      the base rule: the clause does not apply to group enrollments entered at open enrollment, as new hires or by special enrollment, or
      when the person shows prior coverage months that cover the extraction date.
  - base_policy: dental_evt_frequency_age_limits
    superseded_clause: >-
      Interval limits are counted back in calendar months from the date of service to the date of service of the last paid service of the
      same kind: bitewings once per frequency_bitewing_interval_months, a full-mouth series or panoramic film once per frequency_fmx_pano_interval_months,
      sealants once per tooth per sealant_interval_months, scaling and root planing once per quadrant per srp_interval_months, crowns once
      per tooth per crown_replacement_interval_months, bridges and dentures once per tooth span per prosthetic_replacement_interval_months,
      implants once per tooth position per implant_interval_months; the service is payable when its date of service is on or after the last
      date of service plus the interval.
    replaced_by: >-
      For a requested estimate under this rule, and only for such a case, implant services of the same kind are those with the same procedure
      code on the same tooth position, so an implant body, its abutment and its implant-supported crown each run their own implant interval;
      every other case remains under the base rule: interval limits are counted back in calendar months from the date of service to the date
      of service of the last paid service of the same kind: bitewings once per frequency_bitewing_interval_months, a full-mouth series or
      panoramic film once per frequency_fmx_pano_interval_months, sealants once per tooth per sealant_interval_months, scaling and root planing
      once per quadrant per srp_interval_months, crowns once per tooth per crown_replacement_interval_months, bridges and dentures once per
      tooth span per prosthetic_replacement_interval_months, implants once per tooth position per implant_interval_months, and the service
      is payable when its date of service is on or after the last date of service plus the interval.
  trigger: on_request
  subject:
  - dental_estimate_issued
  computes: estimated_member_cost
  target_tool: submit_estimate_request_d87add4f
  params:
    prosthesis_categories: ',bridge,denture,implant,'
  rule: >-
    This estimate-request rule figures the estimated patient cost of a pre-treatment estimate that the member requests anew for a procedure
    the person's most recently issued estimate line already priced, on an enrollment whose benefit period starts on 01-01, as if the procedure
    were performed on the issue date; an estimate on an enrollment whose plan has changed, an estimate that a frequency or age limit would
    decline, an estimate for a child whose subscriber has two or more children enrolled on individual_exchange enrollments, and an estimate
    on an account with more than three enrolled persons are figured under the base rules. For the frequency test of a requested estimate,
    an earlier paid or reprocessed implant line of the person counts against the implant interval only when it carries the same procedure
    code on the same tooth position, so an implant body, its abutment and its implant-supported crown each run their own interval. The procedure,
    benefit category, tooth or area, network status, proposed fee and recorded allowance of the request are those of the person's most recently
    issued estimate line (its estimated allowed amount), and where several issued estimate lines share that latest issue date this rule is
    not used; the service class is the one recorded on the person's most recent claim-line decision for the same benefit category, where several
    such decisions share that latest decision date this rule is not used, and a request for a category with no such decision is figured under
    the base rules. The allowance a requested estimate is figured on is the lesser of the proposed fee and the allowance recorded on that
    estimate line. The coinsurance on a requested estimate is the plan's out-of-network percentage for the procedure's service class. A requested
    estimate is payable only when the issue date is at least its waiting period counted in whole calendar months from the coverage effective
    date (a month counting as whole when the day of the month of the issue date is not earlier than that of the coverage effective date, which
    always falls on the first of a month), where the waiting period is the one for the service class that applies to the enrollment (the plan's
    individual waiting period for individual and individual_exchange enrollments, its late-entrant waiting period for group enrollments with
    enrollment type late_entrant, and none for other group enrollments or for preventive services); otherwise its estimated plan payment is
    0.00. When the plan's missing-tooth clause months are above 0, a requested estimate for a bridge, denture or implant that replaces a tooth
    extracted before the coverage effective date is payable only once the months of continuous enrollment, counted in whole calendar months
    from the coverage effective date to the issue date, reach the clause months; the clause does not apply to group enrollments entered at
    open enrollment, as new hires or by special enrollment; the extraction date is the one recorded on the person's most recently decided
    claim line for that tooth, where several claim lines for that tooth share that latest decision date this rule is not used, and a request
    for a replaced tooth whose most recently decided claim line records no extraction date is figured under the base rules; an estimate the
    clause still bars has an estimated plan payment of 0.00. The deductible taken on a requested estimate is the plan's individual deductible
    less the person's deductible postings net of deductible reversals for the issue date's benefit year, never below zero and never more than
    the allowance; a preventive-class service on a plan that waives the preventive deductible, or any service on a plan whose individual deductible
    is 0.00, takes none. Because every Cascade plan's family deductible maximum is three times its individual deductible, on an account with
    no more than three enrolled persons the family limit never falls below the person's own remaining deductible, so a requested estimate
    counts only the person's own deductible postings. The estimated normal benefit is the allowance less the deductible taken, times the coinsurance,
    rounded to the cent with a half cent rounded up, and the estimated plan payment and patient cost are rounded to the cent the same way.
    The estimated plan payment on a requested estimate is never more than the person's remaining annual maximum for the issue date's benefit
    year, the plan's annual maximum less the person's maximum postings net of maximum reversals for that benefit year. The estimated patient
    cost on a requested estimate is the proposed fee less the estimated plan payment for an out_of_network practice, and the allowance less
    the estimated plan payment otherwise, never below zero; no other coverage is assumed to pay. The adjustments below are applied to the
    standard amount in this order: the waiting-period and missing-tooth tests first, then the coinsurance replacement, which gives the estimated
    normal benefit; then the benefit limit on the estimated plan payment; the estimated patient cost is figured last from it, its own limit
    applied last. An estimate's figures are worked out only after the person's most recently decided claim line that was denied for the waiting
    period counted from the coverage effective date, a waiting period the person's earlier DHMO enrollment has already served, has been reprocessed.
    The person's earlier DHMO enrollment is the person's own terminated Cascade DHMO enrollment, matched by name and date of birth, that ended
    on the day before this enrollment's coverage effective date (a move from the DHMO with no break in coverage); the person's DHMO services
    are read only from that enrollment's own service records, never from another enrollment of the same subscriber. The months a requested
    estimate credits toward its waiting period follow the person's earlier coverage: when the plan credits prior coverage month for month
    and the person has an earlier DHMO enrollment, the estimate credit is the calendar months from the month that DHMO coverage took effect
    through the month it ended, both months counted (DHMO coverage always takes effect on the first of a month); when the plan credits prior
    coverage month for month, no such DHMO enrollment exists, and the enrollment shows documented prior coverage months whose prior coverage
    end date is no more than prior_coverage_max_gap_days calendar days before the coverage effective date, the estimate credit is those documented
    months; otherwise no months are credited; the months credited shorten that waiting period, never below zero; this modifies the estimated
    patient cost on a requested estimate. The months a requested estimate credits toward the missing-tooth clause follow where the replaced
    tooth was lost: when the service records of the person's earlier DHMO enrollment show an extraction of that tooth on that extraction date,
    the clause credit is the calendar months from the month that DHMO coverage took effect through the month it ended, both months counted;
    when they show no such extraction and the enrollment shows documented prior coverage months whose prior coverage end date is on or after
    the extraction date and no more than prior_coverage_max_gap_days calendar days before the coverage effective date, the clause credit is
    those documented months; otherwise no months are credited; the months credited are added to the months of continuous enrollment; this
    modifies the estimated patient cost on a requested estimate. The coinsurance a requested estimate is figured at follows the requesting
    practice's network: a major-class service from an in_network_ppo or in_network_premier practice is figured at the plan's in-network major
    percentage; a basic-class service from such a practice is figured at the plan's in-network basic percentage; a preventive-class service
    from such a practice is figured at the plan's in-network preventive percentage; a service from any other practice is figured at the plan's
    out-of-network percentage for its service class; this modifies the estimated patient cost on a requested estimate. The benefit limit on
    a requested estimate follows the person and the plan: for a person receiving the pediatric essential-health-benefit treatment (an individual_exchange
    enrollment and an issue date before the person's pediatric_ehb_age_limit_years birthday) no annual maximum applies, and on such a person's
    estimate from an in-network practice the estimated patient cost is never more than the pediatric out-of-pocket maximum for one child less
    the person's pediatric out-of-pocket postings net of reversals for the benefit year, and the estimated plan payment on such an estimate
    is then the allowance less that limited cost, so an estimate that crosses the pediatric out-of-pocket maximum pays the allowance minus
    the cost sharing still remaining; for a non-preventive service on a plan that banks rollover dollars, the estimated plan payment is never
    more than the remaining annual maximum plus the person's rollover balance (rollover credits less rollover draws); for a preventive service
    on a plan whose annual maximum does not apply to preventive services, no annual maximum applies; otherwise the estimated plan payment
    is never more than the remaining annual maximum; this modifies the estimated patient cost on a requested estimate. For a requested estimate
    under this rule, and only for such a case, the months credited toward the waiting period follow the earlier-coverage credit stated in
    this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing rule, the
    grace-period reprocessing rule and the claim-appeal rule each follow their own rule, and every other case remains under the base rule:
    when the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months, never below
    zero, and with none there is no credit. In every case, whether or not under this rule, a claim line paid on an alternate allowance carries
    remark PAID_ALTERNATE_BENEFIT, and a reprocessed decision of such a line carries the reprocessing remark ADJUSTED_REPROCESSED in its place.
    For a requested estimate under this rule, and only for such a case, the allowance is figured as stated in this rule; cases under the initial-wait
    reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing rule and the grace-period reprocessing rule each
    follow their own rule, and every other case remains under the base rule: the allowance is the allowed amount for the billed procedure,
    replaced by the alternate allowance when an alternate benefit applies (a posterior composite filling on a plan with the posterior-composite
    alternate benefit, or a porcelain or ceramic crown on a molar on a plan with the molar-crown alternate benefit), and such a line is paid
    with remark PAID_ALTERNATE_BENEFIT. In every case, whether or not under this rule, the practice of an in-network line may not bill the
    member more than the allowed amount. For a requested estimate under this rule, and only for such a case, the patient share is figured
    as stated in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing
    rule and the grace-period reprocessing rule each follow their own rule, and every other case remains under the base rule: for an in-network
    line the member owes the allowed amount minus the plan payment and the practice may not bill more, and for an out-of-network line the
    submitted amount minus the plan payment. For a requested estimate under this rule, and only for such a case, earlier coverage counts toward
    the missing-tooth clause as the clause credit stated in this rule; cases under the initial-wait reprocessing rule follow their own rule,
    and every other case remains under the base rule: the clause does not apply to group enrollments entered at open enrollment, as new hires
    or by special enrollment, or when the person shows prior coverage months that cover the extraction date. For a requested estimate under
    this rule, and only for such a case, implant services of the same kind are those with the same procedure code on the same tooth position,
    so an implant body, its abutment and its implant-supported crown each run their own implant interval; every other case remains under the
    base rule: interval limits are counted back in calendar months from the date of service to the date of service of the last paid service
    of the same kind: bitewings once per frequency_bitewing_interval_months, a full-mouth series or panoramic film once per frequency_fmx_pano_interval_months,
    sealants once per tooth per sealant_interval_months, scaling and root planing once per quadrant per srp_interval_months, crowns once per
    tooth per crown_replacement_interval_months, bridges and dentures once per tooth span per prosthetic_replacement_interval_months, implants
    once per tooth position per implant_interval_months, and the service is payable when its date of service is on or after the last date
    of service plus the interval.
  prerequisite:
  - problem: dental_ext_initial_wait_reprocess
    kind: value_input
    gate: room
    form: state
    policy_source: >-
      An estimate's figures are worked out only after the person's most recently decided claim line that was denied for the waiting period
      counted from the coverage effective date, a waiting period the person's earlier DHMO enrollment has already served, has been reprocessed.
    condition: >-
      The person's most recently decided line denied DENIED_WAITING_PERIOD on this never-changed enrollment has a reprocessed (adjusted) decision
      as its latest decision, with that decision's postings booked.
    resolved_by: reprocess_wait_denial_e5c18a2f
    effect: >-
      The person's net maximum postings for the benefit year rise by the corrected payment, so the remaining annual maximum the estimate's
      limit starts from falls by the same amount.
  cross_category:
  - category: dhmo
    as: history
    reads:
    - dhmo_plan_id
    - status
    - enrollee_name
    - enrollee_date_of_birth
    - coverage_effective_date
    - termination_date
    - dhmo_services.dhmo_plan_id
    - dhmo_services.date_of_service
    - dhmo_services.tooth_or_area
    - dhmo_services.procedure_category
    note: >-
      the estimate credit reads the DHMO enrollment that ended the day before this coverage; the clause credit and the extraction date read
      the DHMO extraction service of the replaced tooth and its enrollment
  compute:
  - e_id: >-
      LATEST('dental_pretreatment_estimates', 'dental_estimate_id', date_field='issued_date', event_type='dental_estimate_issued')
  - e_cat: LATEST('dental_pretreatment_estimates', 'procedure_category', date_field='issued_date', dental_estimate_id=e_id)
  - e_tooth: LATEST('dental_pretreatment_estimates', 'tooth_or_area', date_field='issued_date', dental_estimate_id=e_id)
  - e_net: LATEST('dental_pretreatment_estimates', 'network_status', date_field='issued_date', dental_estimate_id=e_id)
  - e_fee: LATEST('dental_pretreatment_estimates', 'proposed_fee', date_field='issued_date', dental_estimate_id=e_id)
  - e_allowed: LATEST('dental_pretreatment_estimates', 'estimated_allowed', date_field='issued_date', dental_estimate_id=e_id)
  - e_class: LATEST('dental_claim_lines', 'service_class', date_field='adjudicated_date', procedure_category=e_cat)
  - e_year: '''%d'' % (2000 + MONTHS(''2000-01-01'', NOW) // 12)'
  - e_ext: LATEST('dental_claim_lines', 'extraction_date', date_field='adjudicated_date', tooth_or_area=e_tooth)
  - allow_e: MN(e_fee, e_allowed)
  - ped: >-
      F('market_segment') == 'individual_exchange' and MONTHS(F('enrollee_date_of_birth'), NOW) < 12 * P('pediatric_ehb_age_limit_years')
  - wait_len: >-
      0 if (e_class == 'preventive' or (F('market_segment') == 'group' and F('enrollment_type') != 'late_entrant')) else ((P('wait_basic_months_late_entrant')
      if e_class == 'basic' else P('wait_major_months_late_entrant')) if F('market_segment') == 'group' else (P('wait_basic_months_individual')
      if e_class == 'basic' else P('wait_major_months_individual')))
  - clause_need: >-
      P('missing_tooth_clause_months') > 0 and (',' + e_cat + ',') in K('prosthesis_categories') and e_ext and e_ext < F('coverage_effective_date')
      and not (F('market_segment') == 'group' and F('enrollment_type') != 'late_entrant')
  - ded_room: >-
      0 if ((e_class == 'preventive' and P('deductible_waived_preventive')) or P('deductible_individual') == 0) else MX(0, P('deductible_individual')
      - (SUM('dental_accumulator_postings', 'amount', event_type='dental_deductible_posting', benefit_year=e_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_deductible_reversal', benefit_year=e_year)))
  - room: >-
      MX(0, P('annual_maximum_per_person') - (SUM('dental_accumulator_postings', 'amount', event_type='dental_max_posting', benefit_year=e_year)
      - SUM('dental_accumulator_postings', 'amount', event_type='dental_max_reversal', benefit_year=e_year)))
  - oop_used: >-
      SUM('dental_accumulator_postings', 'amount', event_type='dental_ped_oop_posting', benefit_year=e_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_ped_oop_reversal', benefit_year=e_year)
  - cost_base: e_fee if e_net == 'out_of_network' else allow_e
  - ce_month: MONTHS('2000-01-01', F('coverage_effective_date'))
  - ce_first: ('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-01'
  - ce_day: DAYS(ce_first, F('coverage_effective_date')) + 1
  - pv_first: ('%d' % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-01'
  - day_before: >-
      (('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-' + ('%02d' % (ce_day - 1))) if ce_day > 1 else (('%d'
      % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-' + ('%02d' % DAYS(pv_first, ce_first)))
  - dhmo_id: >-
      CFIELD('dhmo', 'dhmo_plan_id', enrollee_name=F('enrollee_name'), enrollee_date_of_birth=F('enrollee_date_of_birth'), status='terminated',
      termination_date=day_before)
  - dhmo_start: CFIELD('dhmo', 'coverage_effective_date', dhmo_plan_id=dhmo_id) if dhmo_id else None
  - dhmo_end: CFIELD('dhmo', 'termination_date', dhmo_plan_id=dhmo_id) if dhmo_id else None
  - doc_gap: DAYS(F('prior_coverage_end_date'), F('coverage_effective_date')) if F('prior_coverage_months') > 0 else 99999
  - credit_months: >-
      (MONTHS(dhmo_start, dhmo_end) + 1) if (dhmo_start != None and P('prior_coverage_credit_method') == 'month_for_month') else (F('prior_coverage_months')
      if (doc_gap <= P('prior_coverage_max_gap_days') and P('prior_coverage_credit_method') == 'month_for_month') else 0)
  - ext_plan: >-
      XLATEST('dhmo', 'dhmo_services', 'dhmo_plan_id', date_field='date_of_service', dhmo_plan_id=dhmo_id, procedure_category='extraction',
      tooth_or_area=e_tooth, date_of_service=e_ext) if (e_ext and dhmo_id) else None
  - ext_start: CFIELD('dhmo', 'coverage_effective_date', dhmo_plan_id=ext_plan, status='terminated') if ext_plan else None
  - ext_end: CFIELD('dhmo', 'termination_date', dhmo_plan_id=ext_plan, status='terminated') if ext_plan else None
  - clause_credit: >-
      (MONTHS(ext_start, ext_end) + 1) if ext_start != None else (F('prior_coverage_months') if (e_ext and F('prior_coverage_months') > 0
      and F('prior_coverage_end_date') >= e_ext and DAYS(F('prior_coverage_end_date'), F('coverage_effective_date')) <= P('prior_coverage_max_gap_days'))
      else 0)
  - rate_net: LATEST('dental_pretreatment_estimates', 'network_status', date_field='issued_date', dental_estimate_id=e_id)
  - line_rate: >-
      P('coinsurance_major_in_network') if (rate_net != 'out_of_network' and e_class == 'major') else (P('coinsurance_basic_in_network') if
      (rate_net != 'out_of_network' and e_class == 'basic') else (P('coinsurance_preventive_in_network') if (rate_net != 'out_of_network'
      and e_class == 'preventive') else (P('coinsurance_preventive_oon') if e_class == 'preventive' else (P('coinsurance_basic_oon') if e_class
      == 'basic' else P('coinsurance_major_oon')))))
  - roll_bal: >-
      SUM('dental_accumulator_postings', 'amount', event_type='dental_rollover_credit') - SUM('dental_accumulator_postings', 'amount', event_type='dental_rollover_draw')
  - lim_cap: >-
      allow_e if ped else ((room + roll_bal) if (P('rollover_enabled') and e_class != 'preventive') else (allow_e if (e_class == 'preventive'
      and not P('annual_max_applies_to_preventive')) else room))
  - lim_cost: MX(0, P('pediatric_oop_max_one_child') - oop_used) if (ped and e_net != 'out_of_network') else cost_base
  - result: >-
      RND(MN(lim_cost, MX(0, cost_base - (MN(RND((allow_e - MN(allow_e, ded_room)) * line_rate / 100, 2), lim_cap) if ((MONTHS(F('coverage_effective_date'),
      NOW) >= MX(0, wait_len - credit_months)) and ((not clause_need) or (MONTHS(F('coverage_effective_date'), NOW) + clause_credit >= P('missing_tooth_clause_months'))))
      else 0))), 2)
  compute_basis:
    e_id: >-
      The procedure, benefit category, tooth or area, network status, proposed fee and recorded allowance of the request are those of the
      person's most recently issued estimate line (its estimated allowed amount), and where several issued estimate lines share that latest
      issue date this rule is not used; the service class is the one recorded on the person's most recent claim-line decision for the same
      benefit category, where several such decisions share that latest decision date this rule is not used, and a request for a category with
      no such decision is figured under the base rules.
    e_cat: >-
      The procedure, benefit category, tooth or area, network status, proposed fee and recorded allowance of the request are those of the
