events:
- type: dental_enroll
  target: dental_plans
  mutation: create
  meaning: An application or group election for one person is accepted and an enrollment record is opened in applied status.
  grain: One row per enrolled person per continuous enrollment.
  fields:
    customer_id: Subscriber who owns the enrollment.
    billing_account_id: Billing account that will fund the premium.
    group_contract_id: Sponsoring group contract; empty for individual-market enrollments.
    variant_name: Plan elected, official full name.
    market_segment: Market the enrollment is sold in.
    coverage_tier: Coverage tier elected by the subscriber.
    enrollee_name: Covered person's full name.
    enrollee_date_of_birth: Covered person's date of birth.
    enrollee_relationship: Relationship to the subscriber.
    enrollment_type: Entry route (individual application, open enrollment, new hire, special enrollment, late entrant).
    application_date: Date the application or election was received.
    coverage_effective_date: First day of coverage, per the enrollment rule.
    prior_coverage_months: Documented months of continuous prior dental coverage.
    prior_coverage_end_date: End of the documented prior coverage.
    benefit_period_start_mmdd: Benefit-period reset day.
  triggers: []
- type: dental_activate
  target: dental_plans
  mutation:
    transition:
      from: applied
      to: active
  meaning: Coverage begins on the coverage effective date after the binder premium was received.
  grain: One row per transaction.
  fields:
    coverage_effective_date: Date coverage starts.
  triggers: []
- type: dental_application_withdraw
  target: dental_plans
  mutation:
    transition:
      from: applied
      to: cancelled
  meaning: The applicant withdraws before coverage starts.
  grain: One row per transaction.
  fields:
    termination_date: Set equal to coverage_effective_date minus one day so no coverage day exists.
    termination_reason: application_withdrawn.
  triggers:
  - event: ortho:ortho_rider_withdraw
    map: {}
- type: dental_binder_lapse
  target: dental_plans
  mutation:
    transition:
      from: applied
      to: cancelled
  meaning: The binder premium was not received by the binder deadline and the application is cancelled.
  grain: One row per transaction.
  fields:
    termination_date: coverage_effective_date minus one day.
    termination_reason: binder_not_paid.
  triggers: []
- type: dental_free_look_cancel
  target: dental_plans
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: An individual-market subscriber returns the policy within the free-look period; coverage is void from the start.
  grain: One row per transaction.
  fields:
    termination_date: coverage_effective_date minus one day.
    termination_reason: free_look.
  triggers:
  - event: billing:billing_premium_credit
    map:
      credit_reason: free_look_refund
  - event: ortho:ortho_rider_terminate
    map:
      termination_reason: base_plan_ended
- type: dental_terminate_voluntary
  target: dental_plans
  mutation:
    transition:
      from: active
      to: terminated
  meaning: Coverage ends at the subscriber's confirmed request.
  grain: One row per transaction.
  fields:
    termination_date: Last day of the month in which the request was confirmed.
    termination_reason: voluntary.
  triggers:
  - event: ortho:ortho_rider_terminate
    map:
      termination_reason: base_plan_ended
- type: dental_terminate_nonpayment
  target: dental_plans
  mutation:
    transition:
      from: active
      to: terminated
  meaning: Coverage ends because the funding billing account lapsed for nonpayment.
  grain: One row per transaction.
  fields:
    termination_date: The billing account's paid-through date.
    termination_reason: nonpayment.
  triggers:
  - event: ortho:ortho_rider_terminate
    map:
      termination_reason: base_plan_ended
- type: dental_terminate_ineligible
  target: dental_plans
  mutation:
    transition:
      from: active
      to: terminated
  meaning: Coverage ends because the person lost eligibility or the sponsoring group contract ended.
  grain: One row per transaction.
  fields:
    termination_date: Last day of the month in which eligibility ended, or the group contract's termination date.
    termination_reason: loss_of_eligibility or group_terminated.
  triggers:
  - event: ortho:ortho_rider_terminate
    map:
      termination_reason: base_plan_ended
- type: dental_reinstate
  target: dental_plans
  mutation:
    transition:
      from: terminated
      to: active
  meaning: Coverage ended for nonpayment is restored without a gap after the billing account is reinstated within the window.
  grain: One row per transaction.
  fields:
    termination_date: Cleared (empty).
    termination_reason: not_terminated.
  triggers: []
- type: dental_tier_change
  target: dental_plans
  mutation: update
  meaning: The enrollment moves to another dental PPO plan at the allowed change date.
  grain: One row per transaction.
  fields:
    variant_name: New plan, official full name.
    prior_variant_name: Plan held before the change.
    tier_change_effective_date: Date the new plan takes effect.
  triggers: []
- type: dental_cob_update
  target: dental_plans
  mutation: update
  meaning: Other dental coverage information used for coordination of benefits is recorded or removed.
  grain: One row per transaction.
  fields:
    cob_order: primary, secondary or none.
    other_carrier_name: Other carrier name verbatim, or empty when cob_order is none.
  triggers: []
- type: dental_claim_line_paid
  target: dental_claim_lines
  meaning: >-
    A claim service line is adjudicated with a plan payment (in full, at an alternate benefit, reduced by the remaining maximum, or from rollover
    dollars).
  grain: One row per claim line decision.
  distinguish_by:
  - claim_number
  - line_number
  fields:
    claim_number: Claim number on the EOB.
    line_number: Line position.
    provider_agreement_id: Treating practice's agreement, if any.
    network_status: Network fixed on procedure_start_date.
    cdt_code: Procedure code.
    procedure_category: Benefit category.
    service_class: Class under the plan.
    tooth_or_area: Tooth or area.
    date_of_service: Completion date.
    procedure_start_date: Start date of a multi-visit procedure.
    extraction_date: Extraction date of a replaced tooth.
    received_date: Claim receipt date.
    adjudicated_date: Decision date.
    benefit_year: Benefit period counted.
    submitted_amount: Billed fee.
    allowed_amount: Allowance for the billed procedure.
    alternate_allowed_amount: Alternate-benefit allowance.
    deductible_applied: Deductible taken.
    coinsurance_pct: Coinsurance applied.
    cob_other_paid: Primary carrier payment when secondary.
    plan_paid: Plan payment.
    member_responsibility: Patient share.
    remark_code: PAID, PAID_ALTERNATE_BENEFIT, PAID_REDUCED_ANNUAL_MAX or PAID_ROLLOVER.
    original_claim_line_id: Pended line being released, if any.
    dental_estimate_id: Estimate the service was performed under, if any.
  triggers:
  - event: dental:dental_max_posting
    map:
      dental_claim_line_id: dental_claim_line_id
      benefit_year: benefit_year
      amount: plan_paid
      posted_date: adjudicated_date
  - event: dental:dental_deductible_posting
    when:
      deductible_applied:
        not: '0.00'
    map:
      dental_claim_line_id: dental_claim_line_id
      benefit_year: benefit_year
      amount: deductible_applied
      posted_date: adjudicated_date
  - event: dental:dental_rollover_draw
    when:
      remark_code: PAID_ROLLOVER
    map:
      dental_claim_line_id: dental_claim_line_id
      benefit_year: benefit_year
      posted_date: adjudicated_date
- type: dental_claim_line_denied
  target: dental_claim_lines
  meaning: A claim service line is adjudicated with no plan payment for a stated reason.
  grain: One row per claim line decision.
  distinguish_by:
  - claim_number
  - line_number
  fields:
    claim_number: Claim number on the EOB.
    line_number: Line position.
    provider_agreement_id: Treating practice's agreement, if any.
    network_status: Network fixed on procedure_start_date.
    cdt_code: Procedure code.
    procedure_category: Benefit category.
    service_class: Class under the plan (not_covered when excluded).
    tooth_or_area: Tooth or area.
    date_of_service: Completion date.
    procedure_start_date: Start date.
    extraction_date: Extraction date of a replaced tooth.
    received_date: Claim receipt date.
    adjudicated_date: Decision date (adverse-determination notice date).
    benefit_year: Benefit period.
    submitted_amount: Billed fee.
    allowed_amount: Allowance.
    plan_paid: 0.00.
    member_responsibility: Patient share (the full allowed amount for in-network denials, the billed fee otherwise).
    remark_code: One DENIED_* code.
    original_claim_line_id: Pended line being finally denied, if any.
  triggers: []
- type: dental_claim_line_pended
  target: dental_claim_lines
  meaning: >-
    A claim line with a date of service in the second or third month of an exchange grace period is held without payment until the grace period
    resolves.
  grain: One row per claim line decision.
  distinguish_by:
  - claim_number
  - line_number
  fields:
    claim_number: Claim number.
    line_number: Line position.
    provider_agreement_id: Treating practice's agreement, if any.
    network_status: Network status.
    cdt_code: Procedure code.
    procedure_category: Benefit category.
    service_class: Class under the plan.
    tooth_or_area: Tooth or area.
    date_of_service: Completion date.
    procedure_start_date: Start date.
    received_date: Receipt date.
    adjudicated_date: Date the pend notice was issued.
    benefit_year: Benefit period.
    submitted_amount: Billed fee.
    allowed_amount: Allowance.
    plan_paid: 0.00.
    remark_code: PENDED_PREMIUM_GRACE.
  triggers: []
- type: dental_claim_line_adjusted
  target: dental_claim_lines
  meaning: >-
    A previously paid or denied line is reprocessed (after an appeal decision, a coordination-of-benefits correction or a claims error) and
    the corrected decision replaces the original.
  grain: One row per reprocessing of one original line.
  distinguish_by:
  - original_claim_line_id
  - dental_appeal_id
  - adjudicated_date
  fields:
    claim_number: Claim number of the original line.
    line_number: Line position of the original line.
    provider_agreement_id: Treating practice's agreement, if any.
    network_status: Corrected network status.
    cdt_code: Procedure code.
    procedure_category: Benefit category.
    service_class: Corrected service class.
    tooth_or_area: Tooth or area.
    date_of_service: Completion date.
    procedure_start_date: Start date.
    received_date: Receipt date of the original claim.
    adjudicated_date: Reprocessing date.
    benefit_year: Benefit period of the original line.
    submitted_amount: Billed fee.
    allowed_amount: Corrected allowance.
    alternate_allowed_amount: Corrected alternate allowance.
    deductible_applied: Corrected deductible taken.
    coinsurance_pct: Corrected coinsurance.
    cob_other_paid: Corrected primary payment.
    plan_paid: Corrected total plan payment for the line (not the difference).
    member_responsibility: Corrected patient share.
    remark_code: ADJUSTED_REPROCESSED.
    original_claim_line_id: Line being replaced.
    dental_appeal_id: Appeal decision that caused the reprocessing, if any.
  triggers:
  - event: dental:dental_max_reversal
    map:
      dental_claim_line_id: original_claim_line_id
      benefit_year: benefit_year
      posted_date: adjudicated_date
  - event: dental:dental_max_posting
    map:
      dental_claim_line_id: dental_claim_line_id
      benefit_year: benefit_year
      amount: plan_paid
      posted_date: adjudicated_date
  - event: dental:dental_deductible_reversal
    map:
      dental_claim_line_id: original_claim_line_id
      benefit_year: benefit_year
      posted_date: adjudicated_date
  - event: dental:dental_deductible_posting
    when:
      deductible_applied:
        not: '0.00'
    map:
      dental_claim_line_id: dental_claim_line_id
      benefit_year: benefit_year
      amount: deductible_applied
      posted_date: adjudicated_date
- type: dental_max_posting
  target: dental_accumulator_postings
  meaning: A plan payment is counted against the person's annual maximum for the benefit period.
  grain: One row per paid or reprocessed claim line that posts to the maximum.
  distinguish_by:
  - dental_claim_line_id
  fields:
    dental_claim_line_id: Line whose payment is posted.
    benefit_year: Benefit period.
    amount: >-
      The line's plan_paid, less any part paid from rollover dollars and excluding preventive lines when the plan exempts them.
    posted_date: Posting date.
  account: annual_maximum_used
  direction: in
  triggers: []
- type: dental_max_reversal
  target: dental_accumulator_postings
  meaning: A previously posted payment is taken back off the annual maximum because its line was reprocessed.
  grain: One row per reprocessed original line.
  distinguish_by:
  - dental_claim_line_id
  fields:
    dental_claim_line_id: Original line whose posting is reversed.
    benefit_year: Benefit period of the original line.
    amount: Amount the original line had posted to the maximum.
    posted_date: Reversal date.
  account: annual_maximum_used
  direction: out
  triggers: []
- type: dental_deductible_posting
  target: dental_accumulator_postings
  meaning: Allowed charges applied to the deductible on a line are counted toward the person's (and the family's) deductible.
  grain: One row per line that applied deductible.
  distinguish_by:
  - dental_claim_line_id
  fields:
    dental_claim_line_id: Line that applied deductible.
    benefit_year: Benefit period.
    amount: The line's deductible_applied.
    posted_date: Posting date.
  account: deductible_satisfied
  direction: in
  triggers: []
- type: dental_deductible_reversal
  target: dental_accumulator_postings
  meaning: Deductible taken on a line is backed out because the line was reprocessed.
  grain: One row per reprocessed original line that had applied deductible.
  distinguish_by:
  - dental_claim_line_id
  fields:
    dental_claim_line_id: Original line.
    benefit_year: Benefit period of the original line.
    amount: Deductible the original line had applied.
    posted_date: Reversal date.
  account: deductible_satisfied
  direction: out
  triggers: []
- type: dental_rollover_credit
  target: dental_accumulator_postings
  meaning: At the close of a benefit period a qualifying person on a rollover plan is credited unused-maximum dollars.
  grain: One row per person per earning benefit period.
  distinguish_by:
  - benefit_year
  fields:
    benefit_year: Benefit period that earned the credit.
    amount: Credit, reduced so that rollover_balance does not exceed the cap.
    posted_date: First day of the next benefit period.
  account: rollover_balance
  direction: in
  triggers: []
- type: dental_rollover_draw
  target: dental_accumulator_postings
  meaning: Rollover dollars pay part or all of a line after the annual maximum is exhausted.
  grain: One row per line paid from rollover.
  distinguish_by:
  - dental_claim_line_id
  fields:
    dental_claim_line_id: Line paid from rollover.
    benefit_year: Benefit period of the line.
    amount: Part of the line's plan payment funded from rollover_balance.
    posted_date: Posting date.
  account: rollover_balance
  direction: out
  triggers: []
- type: dental_ped_oop_posting
  target: dental_accumulator_postings
  meaning: >-
    Cost sharing paid by an enrollee under age 19 on an exchange-filed plan is counted toward the pediatric out-of-pocket maximum.
  grain: One row per pediatric line with member cost sharing.
  distinguish_by:
  - dental_claim_line_id
  fields:
    dental_claim_line_id: Line.
    benefit_year: Benefit period.
    amount: The line's in-network member_responsibility.
    posted_date: Posting date.
  account: pediatric_oop_accumulated
  direction: in
  triggers: []
- type: dental_ped_oop_reversal
  target: dental_accumulator_postings
  meaning: Pediatric cost sharing posted for a line is backed out because the line was reprocessed.
  grain: One row per reprocessed pediatric original line.
  distinguish_by:
  - dental_claim_line_id
  fields:
    dental_claim_line_id: Original line.
    benefit_year: Benefit period.
    amount: Cost sharing the original line had posted.
    posted_date: Reversal date.
  account: pediatric_oop_accumulated
  direction: out
  triggers: []
- type: dental_estimate_issued
  target: dental_pretreatment_estimates
  meaning: A pre-treatment estimate is issued for one proposed procedure.
  grain: One row per proposed procedure line per estimate request.
  distinguish_by:
  - estimate_number
  - cdt_code
  - tooth_or_area
  fields:
    estimate_number: Estimate reference.
    provider_agreement_id: Requesting practice's agreement, if any.
    network_status: Network the estimate was computed under.
    cdt_code: Proposed procedure.
    procedure_category: Benefit category.
    tooth_or_area: Tooth or area.
    received_date: Request receipt date.
    issued_date: Issue date.
    valid_through: issued_date plus the plan's estimate validity.
    proposed_fee: Proposed fee.
    estimated_allowed: Allowance used.
    estimated_plan_payment: Estimated plan payment as of issued_date.
    estimated_member_cost: Estimated patient cost.
    estimate_remark: ESTIMATE_* outcome.
  triggers: []
- type: dental_estimate_voided
  target: dental_pretreatment_estimates
  meaning: An issued estimate is withdrawn because coverage ended or the practice withdrew the treatment plan.
  grain: One row per voided estimate line.
  distinguish_by:
  - original_estimate_id
  fields:
    estimate_number: Estimate reference of the voided line.
    cdt_code: Procedure of the voided line.
    tooth_or_area: Tooth or area of the voided line.
    issued_date: Void date.
    estimate_remark: VOID_COVERAGE_ENDED or VOID_PRACTICE_REQUEST.
    original_estimate_id: Estimate line voided.
  triggers: []
- type: dental_appeal_filed
  target: dental_appeals
  meaning: >-
    The member, an authorized representative or the practice on the member's behalf files an internal appeal of a claim denial/reduction or
    an adverse estimate.
  grain: One row per appeal filing per level per appealed line.
  distinguish_by:
  - dental_claim_line_id
  - dental_estimate_id
  - appeal_level
  fields:
    dental_claim_line_id: Appealed claim line, if a claim appeal.
    dental_estimate_id: Appealed estimate line, if a pre-service appeal.
    appeal_type: post_service or pre_service.
    appeal_level: first_level or second_level.
    filed_by: Who filed.
    filed_date: Receipt date.
    decision_due_date: filed_date plus the applicable decision period.
    outcome: pending.
    original_appeal_id: For a second-level filing, the first-level decision.
  triggers: []
- type: dental_appeal_decided
  target: dental_appeals
  meaning: An appeal level is decided.
  grain: One row per decided filing.
  distinguish_by:
  - original_appeal_id
  fields:
    dental_claim_line_id: Appealed claim line, if any.
    dental_estimate_id: Appealed estimate line, if any.
    appeal_type: Same as the filing.
    appeal_level: Same as the filing.
    decided_date: Decision date.
    outcome: overturned, partially_overturned or upheld.
    original_appeal_id: Filing decided.
  triggers:
  - event: dental:dental_claim_line_adjusted
    when:
      outcome:
      - overturned
      - partially_overturned
      appeal_type: post_service
    map:
      original_claim_line_id: dental_claim_line_id
      dental_appeal_id: dental_appeal_id
      adjudicated_date: decided_date
measures:
- id: dental_msr_max_used
  window: The benefit period containing the date of service (starts on benefit_period_start_mmdd, runs one year).
  measure: Sum of amount of dental_max_posting minus sum of amount of dental_max_reversal for the enrollment and benefit_year.
- id: dental_msr_deductible_person
  window: The benefit period containing the date of service.
  measure: Sum of amount of dental_deductible_posting minus dental_deductible_reversal for the enrollment and benefit_year.
- id: dental_msr_deductible_family
  window: The benefit period containing the date of service.
  measure: >-
    Sum of dental_msr_deductible_person across every enrollment of the same subscriber funded by the same billing_account_id under the same
    plan, for the benefit_year.
- id: dental_msr_procedure_count
  window: >-
    The benefit period containing the date of service, or, for interval limits, the stated number of months counted back from the date of
    service.
  measure: >-
    Count of dental_claim_line_paid and dental_claim_line_adjusted rows with plan_paid above 0.00 for the person, the procedure_category and
    (for per-tooth or per-quadrant limits) the same tooth_or_area, excluding original lines that were later reprocessed.
- id: dental_msr_rollover_balance
  window: Lifetime of the continuous enrollment.
  measure: Sum of amount of dental_rollover_credit minus sum of amount of dental_rollover_draw for the enrollment.
- id: dental_msr_ped_oop
  window: The benefit period containing the date of service.
  measure: >-
    Sum of dental_ped_oop_posting minus dental_ped_oop_reversal across the subscriber's individual_exchange enrollments of persons under the
    pediatric age limit, for the benefit_year.
policies:
- id: dental_agg_multi_holding
  subject:
  - dental_enroll
  rule: >-
    A subscriber may hold several dental PPO enrollments, one for each person covered under the subscriber's coverage tier (the subscriber
    and each enrolled spouse, domestic partner or child), so there is no fixed cap per subscriber. A person may not have a second applied
    or active Cascade dental PPO enrollment while one is already applied or active. Every enrollment of the same subscriber funded by the
    same billing account carries the same plan and the same coverage tier, and the persons enrolled must fit that tier: member_only covers
    the subscriber alone, member_spouse adds one spouse or domestic partner, member_children adds one or more children, and family adds one
    spouse or domestic partner and one or more children. A person is identified by enrollee_name together with enrollee_date_of_birth; a cancelled
    or terminated enrollment of the same person does not block a new one except as the re-enrollment lockout in dental_enrollment_eligibility
    provides.
  eligibility:
  - id: one_open_enrollment_per_person
    applies_to:
    - dental_enroll
    kind: dedup
    condition: A person may not have a second applied or active Cascade dental PPO enrollment while one is already applied or active.
    evidence_fields:
    - dental_plans.enrollee_name
    - dental_plans.enrollee_date_of_birth
    - dental_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.enrollee_name
        - dental_plans.enrollee_date_of_birth
      action_bindings:
        dental_plans.enrollee_name: enrollee_name
        dental_plans.enrollee_date_of_birth: enrollee_date_of_birth
    dedup_contract:
      table: dental_plans
      mode: separate_record
      object_bindings:
        enrollee_name: enrollee_name
        enrollee_date_of_birth: enrollee_date_of_birth
      duplicate_filters:
        status:
        - applied
        - active
      distinct_fields: []
  params:
    max_per_customer: null
- id: dental_agg_family_deductible
  subject:
  - dental_claim_line_paid
  - dental_claim_line_adjusted
  - dental_deductible_posting
  rule: >-
    The deductible is taken per person per benefit period and is capped for the family. On a basic or major line (and on a preventive line
    only when the plan does not waive the deductible for preventive services) the deductible applied is the smallest of: the line's alternate_allowed_amount,
    the person's remaining individual deductible (deductible_individual minus dental_msr_deductible_person), and the family's remaining deductible
    (deductible_family_maximum minus dental_msr_deductible_family), and never less than 0.00. The family is every enrollment of the same subscriber
    funded by the same billing account under the same plan, counted for the same benefit_year; when the plan was changed during a benefit
    period, deductible already satisfied under the prior plan in that benefit period still counts. Lines are taken in order of adjudicated_date,
    then claim_number, then line_number, so the line decided first absorbs the remaining deductible first. A denied or pended line applies
    no deductible; a reprocessed line reverses the original line's deductible and applies its own as if decided on its reprocessing date.
    A plan whose deductible_individual is 0.00 takes no deductible on any line.
  eligibility: []
  params:
    per_tier:
      Cascade Dental PPO Preventive 750:
        deductible_individual: =deductible_individual
        deductible_family_maximum: =deductible_family_maximum
        deductible_waived_preventive: =deductible_waived_preventive
      Cascade Dental PPO Value 1000:
        deductible_individual: =deductible_individual
        deductible_family_maximum: =deductible_family_maximum
        deductible_waived_preventive: =deductible_waived_preventive
      Cascade Dental PPO Classic 1250:
        deductible_individual: =deductible_individual
        deductible_family_maximum: =deductible_family_maximum
        deductible_waived_preventive: =deductible_waived_preventive
      Cascade Dental PPO Plus 1500:
        deductible_individual: =deductible_individual
        deductible_family_maximum: =deductible_family_maximum
        deductible_waived_preventive: =deductible_waived_preventive
      Cascade Dental PPO Premier 2000:
        deductible_individual: =deductible_individual
        deductible_family_maximum: =deductible_family_maximum
        deductible_waived_preventive: =deductible_waived_preventive
      Cascade Dental PPO Elite 2500:
        deductible_individual: =deductible_individual
        deductible_family_maximum: =deductible_family_maximum
        deductible_waived_preventive: =deductible_waived_preventive
  formula:
    when_not: service_class == "preventive" and deductible_waived_preventive
    deductible_applied: >-
      max(0, min(alternate_allowed_amount, deductible_individual - dental_msr_deductible_person, deductible_family_maximum - dental_msr_deductible_family))
  measures:
  - dental_msr_deductible_person
  - dental_msr_deductible_family
- id: dental_enrollment_eligibility
  subject:
  - dental_enroll
  rule: >-
    An enrollment may be opened only for a plan whose entry gate admits the market_segment (the Elite plan is sold to employer groups only,
    and only exchange-filed plans may be sold as individual_exchange), and for a group enrollment only when the sponsoring group contract
    is active. A child may be enrolled only if the child has not reached the dependent_child_age_limit birthday on the coverage effective
    date. For individual and individual_exchange applications the coverage effective date is the first day of the month following receipt
    when the application is received on or before the individual_receipt_cutoff_day of a month, and the first day of the second following
    month when received after that day. For group enrollments the coverage effective date is the group's open-enrollment effective date, the
    first of the month after a new hire completes the group's eligibility waiting period, the first of the month after a special enrollment
    request made within the special enrollment window (special_enrollment_window_days, or special_enrollment_window_days_medicaid_chip after
    loss of Medicaid or CHIP), or, for anyone else, the first of the month after the request as a late_entrant. Prior coverage is recorded
    in prior_coverage_months and prior_coverage_end_date only when documented by a certificate of coverage and only when it ended no more
    than prior_coverage_max_gap_days before the coverage effective date; otherwise prior_coverage_months is 0. A person whose individual-market
    dental enrollment ended by voluntary termination may not be enrolled in an individual-market plan until the re-enrollment lockout has
    run from the voluntary termination of the person's previous individual-market enrollment. The lockout is counted in calendar months from
    the termination_date of that enrollment; when the target day does not exist in the end month the last day of that month is used, and the
    new application date may fall on or after the resulting date. The lockout does not apply to group enrollments, to terminations for nonpayment
    (which follow the reinstatement and binder rules instead) or to enrollments cancelled in the free-look period.
  eligibility:
  - id: reenrollment_lockout
    applies_to:
    - dental_enroll
    kind: time
    condition: >-
      A person whose individual-market dental enrollment ended by voluntary termination may not be enrolled in an individual-market plan until
      the re-enrollment lockout has run from the voluntary termination of the person's previous individual-market enrollment.
    evidence_fields:
    - dental_plans.termination_date
    - dental_plans.termination_reason
    - dental_plans.enrollee_name
    - dental_plans.enrollee_date_of_birth
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.enrollee_name
        - dental_plans.enrollee_date_of_birth
      action_bindings:
        dental_plans.enrollee_name: enrollee_name
        dental_plans.enrollee_date_of_birth: enrollee_date_of_birth
    temporal_basis:
      clock: frozen_time
      anchor_event: the voluntary termination of the person's previous individual-market enrollment
      anchor_source: dental_plans.termination_date
      relation: not_before
      duration_source: variants.reenrollment_lockout_months
      unit: calendar_months
      counting_rule: >-
        The lockout is counted in calendar months from the termination_date of that enrollment; when the target day does not exist in the
        end month the last day of that month is used, and the new application date may fall on or after the resulting date.
      boundary: inclusive
  - id: group_contract_active
    applies_to:
    - dental_enroll
    kind: state
    condition: >-
      An enrollment may be opened only for a plan whose entry gate admits the market_segment (the Elite plan is sold to employer groups only,
      and only exchange-filed plans may be sold as individual_exchange), and for a group enrollment only when the sponsoring group contract
      is active.
    evidence_fields:
    - group_contracts.status
    - group_contracts.group_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - group_contracts.group_contract_id
      action_bindings:
        group_contracts.group_contract_id: group_contract_id
    state_contract:
      field: group_contracts.status
      allowed:
      - active
  params:
    individual_receipt_cutoff_day: 15
- id: dental_activation_binder
  subject:
  - dental_activate
  - dental_binder_lapse
  rule: >-
    An applied enrollment becomes active on its coverage effective date once the binder (first month's) premium has been received on the funding
    billing account; when the binder arrives after the effective date but within the binder deadline, coverage is activated retroactively
    to the coverage effective date. An applied enrollment may be cancelled for an unpaid binder only after the binder deadline has passed
    following the coverage effective date of the enrollment. The binder deadline is the coverage_effective_date plus binder_deadline_days
    counted in calendar days, and cancellation is allowed only on a day strictly after that date. A cancelled enrollment never had coverage:
    termination_date is set to the day before the coverage effective date and termination_reason to binder_not_paid, and any claim with a
    date of service on or after the effective date is denied as not eligible.
  eligibility:
  - id: binder_deadline_passed
    applies_to:
    - dental_binder_lapse
    kind: time
    condition: >-
      An applied enrollment may be cancelled for an unpaid binder only after the binder deadline has passed following the coverage effective
      date of the enrollment.
    evidence_fields:
    - dental_plans.coverage_effective_date
    - dental_plans.dental_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.dental_plan_id
      action_bindings:
        dental_plans.dental_plan_id: dental_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the coverage effective date of the enrollment
      anchor_source: dental_plans.coverage_effective_date
      relation: not_before
      duration_source: variants.binder_deadline_days
      unit: calendar_days
      counting_rule: >-
        The binder deadline is the coverage_effective_date plus binder_deadline_days counted in calendar days, and cancellation is allowed
        only on a day strictly after that date.
      boundary: exclusive
- id: dental_evt_claim_adjudication
  subject:
  - dental_claim_line_paid
  - dental_claim_line_denied
  - dental_claim_line_adjusted
  rule: >-
    Every claim line is decided in this fixed order, and the first step that fails decides the line: (1) coverage in force on the date of
    service and premium status (dental_evt_eligibility_on_dos); (2) timely filing (dental_evt_timely_filing); (3) service class from the plan's
    service_class_map, where a procedure mapped to not_covered, or to a class whose coinsurance is 0 for the line's network, is denied DENIED_NOT_COVERED;
    (4) waiting periods (dental_evt_waiting_periods); (5) frequency and age limits (dental_evt_frequency_age_limits); (6) the missing-tooth
    clause (dental_evt_missing_tooth_clause); then the payment calculation below. The network status of a line is fixed by the treating practice's
    agreements in force on the procedure_start_date, an agreement being in force on a date when its effective_date is on or before that date
    and its termination_date, if any, is on or after it (so a provider in termination_pending is still in network until its termination date):
    a Cascade PPO Participating Dentist Agreement in force gives in_network_ppo; otherwise a Cascade Premier Participating Dentist Agreement
    in force gives in_network_premier when the plan has premier_network_access and out_of_network when it does not; any other agreement type,
    an agreement not in force, or no agreement gives out_of_network. The allowance is the allowed_amount for the billed procedure, replaced
    by the alternate_allowed_amount when an alternate benefit applies: a posterior composite filling when posterior_composite_alternate_benefit
    is true, or a porcelain or ceramic crown on a molar (a tooth listed in molar_teeth) when molar_crown_alternate_benefit is true; such a
    line is paid with remark PAID_ALTERNATE_BENEFIT. The coinsurance is the plan's percentage for the line's service class and network (the
    in-network percentages for in_network_ppo and in_network_premier, the oon percentages for out_of_network). The normal benefit is the allowance
    minus the deductible applied (dental_agg_family_deductible), times the coinsurance percentage, rounded half up to the cent. The plan payment
    is the normal benefit limited to the person's remaining annual maximum (annual_maximum_per_person minus dental_msr_max_used for the benefit
    year); when the plan's annual_max_applies_to_preventive is false a preventive line is not limited and not posted to the maximum. When
    the remaining maximum is smaller than the normal benefit the line pays the remaining maximum with remark PAID_REDUCED_ANNUAL_MAX, and
    when the remaining maximum is 0.00 the line is denied DENIED_ANNUAL_MAX_MET, unless rollover dollars or the pediatric essential-health-benefit
    rule apply (dental_evt_rollover, dental_evt_pediatric_ehb). For an in_network line the member owes the allowed_amount minus the plan payment
    and the practice may not bill more; for an out_of_network line the member owes the submitted_amount minus the plan payment. A reprocessed
    line (dental_claim_line_adjusted) recomputes the whole line from step (1) on the corrected facts, with the accumulators as they stand
    after the original line's postings are reversed, and records the corrected total plan payment; when the corrected payment to a participating
    practice is lower than the original, the difference is an overpayment handled under the provider recovery rules.
  eligibility: []
  params:
    molar_teeth:
    - 1
    - 2
    - 3
    - 14
    - 15
    - 16
    - 17
    - 18
    - 19
    - 30
    - 31
    - 32
    per_tier:
      Cascade Dental PPO Preventive 750:
        annual_maximum: =annual_maximum_per_person
        coins_basic_in: =coinsurance_basic_in_network
        coins_major_in: =coinsurance_major_in_network
        coins_basic_oon: =coinsurance_basic_oon
        coins_major_oon: =coinsurance_major_oon
        max_on_preventive: =annual_max_applies_to_preventive
      Cascade Dental PPO Value 1000:
        annual_maximum: =annual_maximum_per_person
        coins_basic_in: =coinsurance_basic_in_network
        coins_major_in: =coinsurance_major_in_network
        coins_basic_oon: =coinsurance_basic_oon
        coins_major_oon: =coinsurance_major_oon
        max_on_preventive: =annual_max_applies_to_preventive
      Cascade Dental PPO Classic 1250:
        annual_maximum: =annual_maximum_per_person
        coins_basic_in: =coinsurance_basic_in_network
        coins_major_in: =coinsurance_major_in_network
        coins_basic_oon: =coinsurance_basic_oon
        coins_major_oon: =coinsurance_major_oon
        max_on_preventive: =annual_max_applies_to_preventive
      Cascade Dental PPO Plus 1500:
        annual_maximum: =annual_maximum_per_person
        coins_basic_in: =coinsurance_basic_in_network
        coins_major_in: =coinsurance_major_in_network
        coins_basic_oon: =coinsurance_basic_oon
        coins_major_oon: =coinsurance_major_oon
        max_on_preventive: =annual_max_applies_to_preventive
      Cascade Dental PPO Premier 2000:
        annual_maximum: =annual_maximum_per_person
        coins_basic_in: =coinsurance_basic_in_network
        coins_major_in: =coinsurance_major_in_network
        coins_basic_oon: =coinsurance_basic_oon
        coins_major_oon: =coinsurance_major_oon
        max_on_preventive: =annual_max_applies_to_preventive
      Cascade Dental PPO Elite 2500:
        annual_maximum: =annual_maximum_per_person
        coins_basic_in: =coinsurance_basic_in_network
        coins_major_in: =coinsurance_major_in_network
        coins_basic_oon: =coinsurance_basic_oon
        coins_major_oon: =coinsurance_major_oon
        max_on_preventive: =annual_max_applies_to_preventive
  formula:
    normal_benefit: round((alternate_allowed_amount - deductible_applied) * coinsurance_pct / 100, 2)
    remaining_maximum: max(0, annual_maximum_per_person - dental_msr_max_used)
    plan_paid: >-
      normal_benefit if (service_class == "preventive" and not annual_max_applies_to_preventive) else min(normal_benefit, remaining_maximum)
    member_responsibility: (allowed_amount - plan_paid) if network_status != "out_of_network" else (submitted_amount - plan_paid)
  measures:
  - dental_msr_max_used
- id: dental_evt_waiting_periods
  subject:
  - dental_claim_line_paid
  - dental_claim_line_denied
  - dental_estimate_issued
  rule: >-
    Preventive services have no waiting period. For basic and major services the waiting period depends on the enrollment: individual and
    individual_exchange enrollments use wait_basic_months_individual and wait_major_months_individual; group enrollments with enrollment_type
    late_entrant use wait_basic_months_late_entrant and wait_major_months_late_entrant; group enrollments entered at open enrollment, as new
    hires or by special enrollment have no waiting period. When the plan's prior_coverage_credit_method is month_for_month the waiting period
    is shortened by prior_coverage_months (never below zero); with none there is no credit. A service is payable when its date_of_service
    is on or after the coverage_effective_date plus the remaining waiting months, counted in calendar months with the last day of the month
    used when the target day does not exist; a line with an earlier date of service is denied DENIED_WAITING_PERIOD (on an estimate, ESTIMATE_WAITING_PERIOD).
    After an upgrade (tier_change_effective_date set and the new plan richer for the service), a service whose class is covered under the
    new plan but was not covered under prior_variant_name, or whose coinsurance is higher under the new plan, is paid at the new plan's level
    only once its new waiting period counted from tier_change_effective_date (with the same prior-coverage credit) has passed; before then
    it is paid at the prior plan's level if the prior plan covered it and its own waiting period had passed, and denied DENIED_WAITING_PERIOD
    if the prior plan did not cover it. A downgrade carries no new waiting period. Reinstatement without a gap does not restart waiting periods.
  eligibility: []
  params:
    per_tier:
      Cascade Dental PPO Preventive 750:
        wait_basic_individual: =wait_basic_months_individual
        wait_major_individual: =wait_major_months_individual
        wait_basic_late: =wait_basic_months_late_entrant
        wait_major_late: =wait_major_months_late_entrant
        credit: =prior_coverage_credit_method
      Cascade Dental PPO Value 1000:
        wait_basic_individual: =wait_basic_months_individual
        wait_major_individual: =wait_major_months_individual
        wait_basic_late: =wait_basic_months_late_entrant
        wait_major_late: =wait_major_months_late_entrant
        credit: =prior_coverage_credit_method
      Cascade Dental PPO Classic 1250:
        wait_basic_individual: =wait_basic_months_individual
        wait_major_individual: =wait_major_months_individual
        wait_basic_late: =wait_basic_months_late_entrant
        wait_major_late: =wait_major_months_late_entrant
        credit: =prior_coverage_credit_method
      Cascade Dental PPO Plus 1500:
        wait_basic_individual: =wait_basic_months_individual
        wait_major_individual: =wait_major_months_individual
        wait_basic_late: =wait_basic_months_late_entrant
        wait_major_late: =wait_major_months_late_entrant
        credit: =prior_coverage_credit_method
      Cascade Dental PPO Premier 2000:
        wait_basic_individual: =wait_basic_months_individual
        wait_major_individual: =wait_major_months_individual
        wait_basic_late: =wait_basic_months_late_entrant
        wait_major_late: =wait_major_months_late_entrant
        credit: =prior_coverage_credit_method
      Cascade Dental PPO Elite 2500:
        wait_basic_individual: =wait_basic_months_individual
        wait_major_individual: =wait_major_months_individual
        wait_basic_late: =wait_basic_months_late_entrant
        wait_major_late: =wait_major_months_late_entrant
        credit: =prior_coverage_credit_method
- id: dental_evt_frequency_age_limits
  subject:
  - dental_claim_line_paid
  - dental_claim_line_denied
  - dental_estimate_issued
  rule: >-
    Frequency limits are counted per person with dental_msr_procedure_count, including the line being decided: exams up to frequency_exam_per_benefit_year
    and prophylaxis up to frequency_prophylaxis_per_benefit_year per benefit period; prophylaxis and periodontal maintenance together up to
    frequency_perio_cleanings_combined per benefit period (periodontal maintenance is not covered when that value is 0); topical fluoride
    up to frequency_fluoride_per_benefit_year per benefit period. Interval limits are counted back in calendar months from the date of service
    to the date of service of the last paid service of the same kind: bitewings once per frequency_bitewing_interval_months, a full-mouth
    series or panoramic film once per frequency_fmx_pano_interval_months, sealants once per tooth per sealant_interval_months, scaling and
    root planing once per quadrant per srp_interval_months, crowns once per tooth per crown_replacement_interval_months, bridges and dentures
    once per tooth span per prosthetic_replacement_interval_months, implants once per tooth position per implant_interval_months; the service
    is payable when its date of service is on or after the last date of service plus the interval. Age limits compare the patient's age on
    the date of service: fluoride only before the fluoride_age_limit_years birthday and sealants only on permanent molars before the sealant_age_limit_years
    birthday; a line past the age limit is denied DENIED_AGE_LIMIT. A line over a frequency or interval limit is denied DENIED_FREQUENCY_LIMIT
    (on an estimate, ESTIMATE_FREQUENCY_LIMIT); services paid by a prior carrier do not count, and services paid under an earlier Cascade
    dental enrollment of the same person do count. Benefit-period counts reset on the benefit_period_start_mmdd; interval limits do not reset.
  eligibility: []
  measures:
  - dental_msr_procedure_count
- id: dental_evt_missing_tooth_clause
  subject:
  - dental_claim_line_paid
  - dental_claim_line_denied
  - dental_estimate_issued
  rule: >-
    When the plan has a missing_tooth_clause_months value above 0, a bridge, denture or implant that replaces a tooth whose extraction_date
    is before the coverage_effective_date is not payable until the enrollment has been continuously active for that many calendar months;
    the line is denied DENIED_MISSING_TOOTH (on an estimate, ESTIMATE_MISSING_TOOTH). A replacement of a tooth extracted on or after the coverage_effective_date,
    or of a tooth extracted before it once the clause period has run, is decided on its other rules. The clause does not apply to group enrollments
    entered at open enrollment, as new hires or by special enrollment, and it does not apply when the person shows prior_coverage_months that
    cover the extraction date.
  eligibility: []
- id: dental_evt_eligibility_on_dos
  subject:
  - dental_claim_line_paid
  - dental_claim_line_denied
  - dental_claim_line_pended
  rule: >-
    A line is payable only if the enrollment was active on its date_of_service: on or after the coverage_effective_date and, when a termination_date
    is set, on or before it; a line outside that span, or under a cancelled enrollment, is denied DENIED_NOT_ELIGIBLE. For a crown, bridge,
    denture or root canal the date of service is the completion date, so a procedure started while covered but completed after the termination
    date is denied, while one started before the coverage effective date and completed after it is payable. When the funding billing account
    is in grace_period and the enrollment is individual_exchange with advance premium tax credit, lines with a date of service in the first
    month of the grace period are adjudicated normally, and lines with a date of service in the second or third month are pended with PENDED_PREMIUM_GRACE.
    A line may be pended only while the funding billing account is in grace_period. When the grace period is cured by full payment, each pended
    line is released and adjudicated normally as a new decision referencing the pended line; when the account lapses instead, coverage ends
    on the last day of the first grace month and each pended line is denied DENIED_NOT_ELIGIBLE referencing the pended line. Lines with a
    date of service during the grace period of any other billing arrangement are adjudicated normally while the account is in grace_period,
    and are reprocessed as not eligible if the account later lapses with a paid-through date before the date of service.
  eligibility:
  - id: pend_only_in_grace
    applies_to:
    - dental_claim_line_pended
    kind: state
    condition: A line may be pended only while the funding billing account is in grace_period.
    evidence_fields:
    - billing_accounts.status
    - billing_accounts.billing_account_id
    - dental_plans.billing_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.billing_account_id
      action_bindings:
        dental_plans.billing_account_id: billing_account_id
    state_contract:
      field: billing_accounts.status
      allowed:
      - grace_period
- id: dental_evt_timely_filing
  subject:
  - dental_claim_line_paid
  - dental_claim_line_denied
  rule: >-
    A claim must be received within the filing limit counted in calendar days from the date of service: timely_filing_days_in_network for
    lines from a practice holding an active Cascade participation agreement, timely_filing_days_oon for member-submitted claims and claims
    from non-participating practices. A line whose received_date is later than date_of_service plus the applicable limit is denied DENIED_TIMELY_FILING;
    for an in-network line the practice, not the member, bears the denied amount and member_responsibility is 0.00. A claim first received
    in time by another carrier and forwarded under coordination of benefits counts as received on its first receipt date.
  eligibility: []
- id: dental_evt_cob
  subject:
  - dental_claim_line_paid
  - dental_claim_line_adjusted
  - dental_cob_update
  rule: >-
    Other dental coverage is recorded with cob_order and other_carrier_name; the order of benefit determination follows the NAIC model rules:
    the plan covering the person as an employee or subscriber pays before the plan covering the person as a dependent; for a child covered
    by both parents the plan of the parent whose birthday (month and day) falls earlier in the calendar year pays first; an active-employee
    plan pays before a COBRA or retiree plan; when none of these decides, the plan that has covered the person longer pays first. When this
    plan is primary it pays its normal benefit as if no other coverage existed. When this plan is secondary the primary payment is recorded
    in cob_other_paid and the plan pays according to cob_method: with non_duplication it pays its normal benefit minus cob_other_paid, never
    below 0.00; with standard_cob it pays the lesser of its normal benefit and the allowed_amount minus cob_other_paid; in both cases the
    payment is still limited by the remaining annual maximum, and only what this plan actually pays is posted to the maximum. A claim line
    adjudicated as primary while other coverage that should have paid first is later recorded is reprocessed as secondary once the primary
    payment is known.
  eligibility: []
  params:
    per_tier:
      Cascade Dental PPO Preventive 750:
        cob_method: =cob_method
      Cascade Dental PPO Value 1000:
        cob_method: =cob_method
      Cascade Dental PPO Classic 1250:
        cob_method: =cob_method
      Cascade Dental PPO Plus 1500:
        cob_method: =cob_method
      Cascade Dental PPO Premier 2000:
        cob_method: =cob_method
      Cascade Dental PPO Elite 2500:
        cob_method: =cob_method
  formula:
    when: cob_order == "secondary"
    normal_benefit: round((alternate_allowed_amount - deductible_applied) * coinsurance_pct / 100, 2)
    secondary_payment: >-
      max(0, normal_benefit - cob_other_paid) if cob_method == "non_duplication" else max(0, min(normal_benefit, allowed_amount - cob_other_paid))
- id: dental_evt_accumulators
  subject:
  - dental_max_posting
  - dental_max_reversal
  - dental_deductible_posting
  - dental_deductible_reversal
  - dental_ped_oop_posting
  - dental_ped_oop_reversal
  rule: >-
    Accumulators are moved only by claim decisions, on the decision date, for the benefit_year of the line. Each paid or reprocessed line
    posts its plan payment to the annual maximum, except the part paid from rollover dollars, preventive lines on plans whose annual_max_applies_to_preventive
    is false, and lines of a person receiving the pediatric essential-health-benefit treatment; a line paying 0.00 posts nothing. Each line
    that applied deductible posts that deductible. Each in-network line of a person receiving the pediatric essential-health-benefit treatment
    posts its member_responsibility to the pediatric out-of-pocket accumulator. When a line is reprocessed, every posting the original line
    made is reversed for the same amount and benefit year before the corrected line posts its own amounts. Denied and pended lines move no
    accumulator, and estimates never move an accumulator.
  eligibility: []
- id: dental_evt_rollover
  subject:
  - dental_rollover_credit
  - dental_rollover_draw
  - dental_claim_line_paid
  rule: >-
    Only plans with rollover_enabled bank rollover dollars. At the end of each benefit period a person qualifies for a credit when the enrollment
    was continuously active for at least rollover_min_months_enrolled calendar months of that benefit period, is still active on the first
    day of the next benefit period, and the plan payments posted to the annual maximum for the ending benefit period (dental_msr_max_used)
    are greater than 0.00 and no more than rollover_claims_threshold. The credit is rollover_credit_amount, reduced so that dental_msr_rollover_balance
    after the credit does not exceed rollover_balance_cap, and it is posted on the first day of the next benefit period with the ending benefit
    year. Rollover dollars are used only after the annual maximum for the benefit period is exhausted: the part of a line's normal benefit
    above the remaining annual maximum is paid from the rollover balance up to that balance, the line carries remark PAID_ROLLOVER, and the
    rollover part is drawn from rollover_balance instead of posted to the annual maximum. The rollover balance is forfeited when the enrollment
    terminates or is cancelled, or when the plan is changed to a plan without rollover; it is carried unchanged across a change between rollover
    plans and across a reinstatement without a gap.
  eligibility: []
  params:
    per_tier:
      Cascade Dental PPO Preventive 750:
        threshold: =rollover_claims_threshold
        credit: =rollover_credit_amount
        cap: =rollover_balance_cap
      Cascade Dental PPO Value 1000:
        threshold: =rollover_claims_threshold
        credit: =rollover_credit_amount
        cap: =rollover_balance_cap
      Cascade Dental PPO Classic 1250:
        threshold: =rollover_claims_threshold
        credit: =rollover_credit_amount
        cap: =rollover_balance_cap
      Cascade Dental PPO Plus 1500:
        threshold: =rollover_claims_threshold
        credit: =rollover_credit_amount
        cap: =rollover_balance_cap
      Cascade Dental PPO Premier 2000:
        threshold: =rollover_claims_threshold
        credit: =rollover_credit_amount
        cap: =rollover_balance_cap
      Cascade Dental PPO Elite 2500:
        threshold: =rollover_claims_threshold
        credit: =rollover_credit_amount
        cap: =rollover_balance_cap
  formula:
    when: rollover_enabled and dental_msr_max_used > 0 and dental_msr_max_used <= rollover_claims_threshold
    credit_amount: max(0, min(rollover_credit_amount, rollover_balance_cap - dental_msr_rollover_balance))
  measures:
  - dental_msr_max_used
  - dental_msr_rollover_balance
- id: dental_evt_pediatric_ehb
  subject:
  - dental_claim_line_paid
  - dental_claim_line_adjusted
  - dental_ped_oop_posting
  rule: >-
    On an individual_exchange enrollment, a covered person who has not reached the pediatric_ehb_age_limit_years birthday on the date of service
    receives the pediatric essential-health-benefit treatment, which overrides the annual maximum: no annual maximum applies to that person's
    lines and nothing is posted to annual_maximum_used. The person's in-network cost sharing accumulates toward the pediatric out-of-pocket
    maximum: pediatric_oop_max_one_child when one child of the subscriber is enrolled on individual_exchange enrollments, pediatric_oop_max_two_plus
    combined across the children when two or more are enrolled (dental_msr_ped_oop). Once the applicable out-of-pocket maximum is reached
    for the benefit period, in-network covered lines are paid at the full allowance with member_responsibility 0.00; the line that crosses
    the maximum pays the allowance minus the cost sharing still remaining. Out-of-network cost sharing and services the plan does not cover
    never count toward the pediatric out-of-pocket maximum, and the treatment ends with the line whose date of service is on or after the
    pediatric age-limit birthday. The deductible, coinsurance, waiting periods, frequency limits and service classes of the plan still apply.
  eligibility: []
  params:
    per_tier:
      Cascade Dental PPO Preventive 750:
        oop_one: =pediatric_oop_max_one_child
        oop_two_plus: =pediatric_oop_max_two_plus
      Cascade Dental PPO Value 1000:
        oop_one: =pediatric_oop_max_one_child
        oop_two_plus: =pediatric_oop_max_two_plus
      Cascade Dental PPO Classic 1250:
        oop_one: =pediatric_oop_max_one_child
        oop_two_plus: =pediatric_oop_max_two_plus
      Cascade Dental PPO Plus 1500:
        oop_one: =pediatric_oop_max_one_child
        oop_two_plus: =pediatric_oop_max_two_plus
      Cascade Dental PPO Premier 2000:
        oop_one: =pediatric_oop_max_one_child
        oop_two_plus: =pediatric_oop_max_two_plus
      Cascade Dental PPO Elite 2500:
        oop_one: =pediatric_oop_max_one_child
        oop_two_plus: =pediatric_oop_max_two_plus
  measures:
  - dental_msr_ped_oop
- id: dental_evt_pretreatment_estimate
  subject:
  - dental_estimate_issued
  - dental_estimate_voided
  rule: >-
    A participating or non-participating practice, or the member, may request a pre-treatment estimate for any proposed procedure; it is recommended
    when the proposed fee exceeds estimate_recommended_threshold and is never required for payment. An estimate may be issued only while the
    enrollment is active. The estimate is computed with the same steps as a claim line (dental_evt_claim_adjudication) as if the service were
    performed on the issued_date, using the accumulators as they stand on that date, and is issued within estimate_turnaround_business_days
    of received_date; valid_through is issued_date plus estimate_valid_days calendar days. An estimate is not a guarantee of payment: the
    claim for the service is adjudicated on the facts on its date of service (eligibility, remaining maximum, frequency and network status),
    and a service performed after valid_through is adjudicated the same way without regard to the estimate. An estimate is voided with VOID_COVERAGE_ENDED
    when the enrollment terminates or is cancelled, and with VOID_PRACTICE_REQUEST when the requesting practice withdraws the treatment plan;
    a void row references the voided estimate line and an estimate line can be voided once.
  eligibility:
  - id: estimate_requires_active
    applies_to:
    - dental_estimate_issued
    kind: state
    condition: An estimate may be issued only while the enrollment is active.
    evidence_fields:
    - dental_plans.status
    - dental_plans.dental_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.dental_plan_id
      action_bindings:
        dental_plans.dental_plan_id: dental_plan_id
    state_contract:
      field: dental_plans.status
      allowed:
      - active
  params:
    per_tier:
      Cascade Dental PPO Preventive 750:
        valid_days: =estimate_valid_days
        turnaround_business_days: =estimate_turnaround_business_days
      Cascade Dental PPO Value 1000:
        valid_days: =estimate_valid_days
        turnaround_business_days: =estimate_turnaround_business_days
      Cascade Dental PPO Classic 1250:
        valid_days: =estimate_valid_days
        turnaround_business_days: =estimate_turnaround_business_days
      Cascade Dental PPO Plus 1500:
        valid_days: =estimate_valid_days
        turnaround_business_days: =estimate_turnaround_business_days
      Cascade Dental PPO Premier 2000:
        valid_days: =estimate_valid_days
        turnaround_business_days: =estimate_turnaround_business_days
      Cascade Dental PPO Elite 2500:
        valid_days: =estimate_valid_days
        turnaround_business_days: =estimate_turnaround_business_days
- id: dental_evt_appeals
  subject:
  - dental_appeal_filed
  - dental_appeal_decided
  rule: >-
    An appeal is the member's own assertion of the right to review: it is filed by the member, by an authorized representative named in writing
    by the member, or by the treating practice on the member's behalf, and the agent records it only on the member's instruction. Only an
    adverse determination can be appealed: a line with a DENIED_* remark, a line paid with PAID_ALTERNATE_BENEFIT or PAID_REDUCED_ANNUAL_MAX,
    a reprocessed line, or an estimate line with an ESTIMATE_* remark other than ESTIMATE_COVERED. A first-level appeal may be filed no later
    than the appeal filing window after the adverse determination date shown on the Explanation of Benefits. The filing window is appeal_filing_window_days
    counted in calendar days from the adjudicated_date of the appealed line (or the issued_date of the appealed estimate line), and a filing
    received on the last day of the window is timely. A second-level appeal exists only for group enrollments, and may be filed no later than
    the second-level window after the first-level appeal decision. The second-level window is second_level_filing_window_days counted in calendar
    days from the decided_date of the first-level decision, and a filing received on the last day is timely. Only one filing per appealed
    line per level may exist. The decision_due_date is the filed_date plus, in calendar days, appeal_decision_days_pre_service for a pre-service
    appeal at either level, appeal_decision_days_post_service_group for each level of a post-service appeal on a group enrollment, and appeal_decision_days_post_service_individual
    for the single post-service level on an individual or individual_exchange enrollment. A decision row references the filing it decides;
    overturned or partially_overturned post-service decisions cause the appealed line to be reprocessed on the corrected facts, and an overturned
    pre-service decision is followed by a new estimate. A late filing, a filing on a non-adverse line, a third level, or a request for external
    review of a dental decision is not provided for by these rules.
  eligibility:
  - id: first_level_window
    applies_to:
    - dental_appeal_filed
    kind: time
    condition: >-
      A first-level appeal may be filed no later than the appeal filing window after the adverse determination date shown on the Explanation
      of Benefits.
    evidence_fields:
    - dental_claim_lines.adjudicated_date
    - dental_claim_lines.dental_claim_line_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_claim_lines.dental_claim_line_id
      action_bindings:
        dental_claim_lines.dental_claim_line_id: dental_claim_line_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the adverse determination date shown on the Explanation of Benefits
      anchor_source: dental_claim_lines.adjudicated_date
      relation: not_after
      duration_source: variants.appeal_filing_window_days
      unit: calendar_days
      counting_rule: >-
        The filing window is appeal_filing_window_days counted in calendar days from the adjudicated_date of the appealed line (or the issued_date
        of the appealed estimate line), and a filing received on the last day of the window is timely.
      boundary: inclusive
  - id: second_level_window
    applies_to:
    - dental_appeal_filed
    kind: time
    condition: >-
      A second-level appeal exists only for group enrollments, and may be filed no later than the second-level window after the first-level
      appeal decision.
    evidence_fields:
    - dental_appeals.decided_date
    - dental_appeals.dental_appeal_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_appeals.dental_appeal_id
      action_bindings:
        dental_appeals.dental_appeal_id: original_appeal_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the first-level appeal decision
      anchor_source: dental_appeals.decided_date
      relation: not_after
      duration_source: variants.second_level_filing_window_days
      unit: calendar_days
      counting_rule: >-
        The second-level window is second_level_filing_window_days counted in calendar days from the decided_date of the first-level decision,
        and a filing received on the last day is timely.
      boundary: inclusive
  - id: second_level_group_only
    applies_to:
    - dental_appeal_filed
    kind: state
    condition: >-
      A second-level appeal exists only for group enrollments, and may be filed no later than the second-level window after the first-level
      appeal decision.
    evidence_fields:
    - dental_plans.market_segment
    - dental_plans.dental_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.dental_plan_id
      action_bindings:
        dental_plans.dental_plan_id: dental_plan_id
    state_contract:
      field: dental_plans.market_segment
      allowed:
      - group
  - id: adverse_only
    applies_to:
    - dental_appeal_filed
    kind: state
    condition: >-
      Only an adverse determination can be appealed: a line with a DENIED_* remark, a line paid with PAID_ALTERNATE_BENEFIT or PAID_REDUCED_ANNUAL_MAX,
      a reprocessed line, or an estimate line with an ESTIMATE_* remark other than ESTIMATE_COVERED.
    evidence_fields:
    - dental_claim_lines.remark_code
    - dental_claim_lines.dental_claim_line_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_claim_lines.dental_claim_line_id
      action_bindings:
        dental_claim_lines.dental_claim_line_id: dental_claim_line_id
    state_contract:
      field: dental_claim_lines.remark_code
      allowed:
      - PAID_ALTERNATE_BENEFIT
      - PAID_REDUCED_ANNUAL_MAX
      - DENIED_FREQUENCY_LIMIT
      - DENIED_WAITING_PERIOD
      - DENIED_NOT_COVERED
      - DENIED_ANNUAL_MAX_MET
      - DENIED_NOT_ELIGIBLE
      - DENIED_TIMELY_FILING
      - DENIED_MISSING_TOOTH
      - DENIED_AGE_LIMIT
      - ADJUSTED_REPROCESSED
  - id: one_filing_per_level
    applies_to:
    - dental_appeal_filed
    kind: dedup
    condition: Only one filing per appealed line per level may exist.
    evidence_fields:
    - dental_appeals.dental_claim_line_id
    - dental_appeals.appeal_level
    - dental_appeals.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_appeals.dental_claim_line_id
        - dental_appeals.appeal_level
      action_bindings:
        dental_appeals.dental_claim_line_id: dental_claim_line_id
        dental_appeals.appeal_level: appeal_level
    dedup_contract:
      table: dental_appeals
      mode: separate_record
      object_bindings:
        dental_claim_line_id: dental_claim_line_id
        appeal_level: appeal_level
      duplicate_filters:
        event_type:
        - dental_appeal_filed
      distinct_fields: []
  params:
    per_tier:
      Cascade Dental PPO Preventive 750:
        filing_window_days: =appeal_filing_window_days
        second_level_days: =second_level_filing_window_days
      Cascade Dental PPO Value 1000:
        filing_window_days: =appeal_filing_window_days
        second_level_days: =second_level_filing_window_days
      Cascade Dental PPO Classic 1250:
        filing_window_days: =appeal_filing_window_days
        second_level_days: =second_level_filing_window_days
      Cascade Dental PPO Plus 1500:
        filing_window_days: =appeal_filing_window_days
        second_level_days: =second_level_filing_window_days
      Cascade Dental PPO Premier 2000:
        filing_window_days: =appeal_filing_window_days
        second_level_days: =second_level_filing_window_days
      Cascade Dental PPO Elite 2500:
        filing_window_days: =appeal_filing_window_days
        second_level_days: =second_level_filing_window_days
- id: dental_coverage_changes
  subject:
  - dental_application_withdraw
  - dental_free_look_cancel
  - dental_terminate_voluntary
  - dental_tier_change
  rule: >-
    Withdrawing an application, returning a policy in the free-look period, ending coverage and changing plans are the subscriber's own decisions:
    the agent registers a coverage-change request and the change is carried out only after the subscriber confirms it. A withdrawal, free-look
    cancellation, voluntary termination or plan change is carried out only once the subscriber's coverage-change request for that enrollment
    is confirmed. An application may be withdrawn at any time before the coverage effective date; it is void and any binder received is credited
    back in full. An individual or individual_exchange subscriber may return the policy no later than the free-look period after the coverage
    effective date of the enrollment. The free-look period is free_look_days counted in calendar days from the coverage_effective_date, and
    a request confirmed on the last day is in time. A free-look cancellation voids coverage from the start, credits back all premium paid
    for the enrollment, and is not available once any claim line has been paid under the enrollment; group enrollments have no free-look right.
    A voluntary termination ends coverage on the last day of the calendar month in which the request is confirmed; premium billed for any
    later month is credited back, earlier months are not refunded, and the re-enrollment lockout then applies to individual-market enrollments.
    A plan change on an individual or individual_exchange enrollment takes effect only on the next benefit_period_start_mmdd after the request
    is confirmed; a group enrollment changes plan only at the group's open-enrollment effective date or with a special enrollment, and only
    to plans the group contract offers. All enrollments of the subscriber on the same billing account change together, upgrades carry the
    waiting-period rule of dental_evt_waiting_periods, and the new monthly premium for the coverage tier applies from the change effective
    date. A request for a retroactive termination, for a mid-year plan change outside these occasions, or for a refund of months already covered
    is not provided for by these rules.
  eligibility:
  - id: request_confirmed
    applies_to:
    - dental_application_withdraw
    - dental_free_look_cancel
    - dental_terminate_voluntary
    - dental_tier_change
    kind: state
    condition: >-
      A withdrawal, free-look cancellation, voluntary termination or plan change is carried out only once the subscriber's coverage-change
      request for that enrollment is confirmed.
    evidence_fields:
    - dental_coverage_requests.request_status
    - dental_coverage_requests.dental_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_coverage_requests.dental_plan_id
      action_bindings:
        dental_coverage_requests.dental_plan_id: dental_plan_id
    state_contract:
      field: dental_coverage_requests.request_status
      allowed:
      - confirmed
  - id: free_look_window
    applies_to:
    - dental_free_look_cancel
    kind: time
    condition: >-
      An individual or individual_exchange subscriber may return the policy no later than the free-look period after the coverage effective
      date of the enrollment.
    evidence_fields:
    - dental_plans.coverage_effective_date
    - dental_plans.dental_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.dental_plan_id
      action_bindings:
        dental_plans.dental_plan_id: dental_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the coverage effective date of the enrollment
      anchor_source: dental_plans.coverage_effective_date
      relation: not_after
      duration_source: variants.free_look_days
      unit: calendar_days
      counting_rule: >-
        The free-look period is free_look_days counted in calendar days from the coverage_effective_date, and a request confirmed on the last
        day is in time.
      boundary: inclusive
- id: dental_system_terminations
  subject:
  - dental_terminate_nonpayment
  - dental_terminate_ineligible
  rule: >-
    When the funding billing account lapses for nonpayment, every active enrollment it funds is terminated for nonpayment with termination_date
    equal to the account's paid-through date (for an individual_exchange enrollment with advance premium tax credit, the last day of the first
    grace month). A child's enrollment ends for loss of eligibility on the last day of the month in which the child reaches the dependent_child_age_limit
    birthday; a spouse's or domestic partner's enrollment ends on the last day of the month in which divorce or dissolution is recorded. Every
    enrollment under a group contract ends with termination_reason group_terminated on the group contract's termination date. Termination
    of an enrollment voids its open estimates, forfeits its rollover balance and ends any orthodontic rider attached to it; claims with a
    date of service after the termination date are denied as not eligible. Termination of the subscriber's enrollment for nonpayment or group
    termination also ends the dependents' enrollments funded by the same billing account on the same date.
  eligibility: []
- id: dental_reinstatement
  subject:
  - dental_reinstate
  rule: >-
    Coverage may be reinstated only if it was terminated for nonpayment and the reinstatement is made no later than the reinstatement window
    after the termination date of the enrollment. The window is reinstatement_window_days counted in calendar days from the termination_date,
    and a reinstatement on the last day of the window is in time. Reinstatement is carried out only after the funding billing account has
    itself been reinstated to active under the billing reinstatement rules. A reinstated enrollment continues without a gap: termination_date
    is cleared, waiting periods and accumulators continue as if coverage had never ended, and claims denied as not eligible for dates of service
    in the gap are reprocessed. Coverage ended voluntarily, for loss of eligibility, by group termination or in the free-look period cannot
    be reinstated; a new enrollment under dental_enrollment_eligibility is the only route.
  eligibility:
  - id: reinstatement_window
    applies_to:
    - dental_reinstate
    kind: time
    condition: >-
      Coverage may be reinstated only if it was terminated for nonpayment and the reinstatement is made no later than the reinstatement window
      after the termination date of the enrollment.
    evidence_fields:
    - dental_plans.termination_date
    - dental_plans.termination_reason
    - dental_plans.dental_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.dental_plan_id
      action_bindings:
        dental_plans.dental_plan_id: dental_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the termination date of the enrollment
      anchor_source: dental_plans.termination_date
      relation: not_after
      duration_source: variants.reinstatement_window_days
      unit: calendar_days
      counting_rule: >-
        The window is reinstatement_window_days counted in calendar days from the termination_date, and a reinstatement on the last day of
        the window is in time.
      boundary: inclusive
  - id: billing_reinstated_first
    applies_to:
    - dental_reinstate
    kind: state
    condition: >-
      Reinstatement is carried out only after the funding billing account has itself been reinstated to active under the billing reinstatement
      rules.
    evidence_fields:
    - billing_accounts.status
    - billing_accounts.billing_account_id
    - dental_plans.billing_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - dental_plans.billing_account_id
      action_bindings:
        dental_plans.billing_account_id: billing_account_id
    state_contract:
      field: billing_accounts.status
      allowed:
      - active
extended_policies:
- id: dental_ext_initial_wait_reprocess
  base_policy_refs:
  - dental_evt_claim_adjudication
  - dental_agg_family_deductible
  - dental_evt_cob
  - dental_evt_pediatric_ehb
  - dental_evt_waiting_periods
  - dental_evt_missing_tooth_clause
  - dental_evt_accumulators
  - dental_evt_rollover
  overwrite:
  - base_policy: dental_evt_waiting_periods
    superseded_clause: >-
      When the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months (never below
      zero); with none there is no credit.
    replaced_by: >-
      For a reprocessed initial-wait line under this rule, and only for such a case, the months credited toward the waiting period follow
      the earlier-coverage credit stated in this rule; cases under the new-plan-wait reprocessing rule, the prior-level reprocessing rule,
      the grace-period reprocessing rule, the estimate-request rule and the claim-appeal rule each follow their own rule, and every other
      case remains under the base rule: when the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by
      prior_coverage_months, never below zero, and with none there is no credit.
  - base_policy: dental_evt_claim_adjudication
    superseded_clause: >-
      The allowance is the allowed_amount for the billed procedure, replaced by the alternate_allowed_amount when an alternate benefit applies:
      a posterior composite filling when posterior_composite_alternate_benefit is true, or a porcelain or ceramic crown on a molar (a tooth
      listed in molar_teeth) when molar_crown_alternate_benefit is true; such a line is paid with remark PAID_ALTERNATE_BENEFIT.
    replaced_by: >-
      In every case, whether or not under this rule, a claim line paid on an alternate allowance carries remark PAID_ALTERNATE_BENEFIT, and
      a reprocessed decision of such a line carries the reprocessing remark ADJUSTED_REPROCESSED in its place. For a reprocessed initial-wait
      line under this rule, and only for such a case, the allowance is figured as stated in this rule; cases under the new-plan-wait reprocessing
      rule, the prior-level reprocessing rule, the grace-period reprocessing rule and the estimate-request rule each follow their own rule,
      and every other case remains under the base rule: the allowance is the allowed amount for the billed procedure, replaced by the alternate
      allowance when an alternate benefit applies (a posterior composite filling on a plan with the posterior-composite alternate benefit,
      or a porcelain or ceramic crown on a molar on a plan with the molar-crown alternate benefit), and such a line is paid with remark PAID_ALTERNATE_BENEFIT.
  - base_policy: dental_evt_claim_adjudication
    superseded_clause: >-
      For an in_network line the member owes the allowed_amount minus the plan payment and the practice may not bill more; for an out_of_network
      line the member owes the submitted_amount minus the plan payment.
    replaced_by: >-
      In every case, whether or not under this rule, the practice of an in-network line may not bill the member more than the allowed amount.
      For a reprocessed initial-wait line under this rule, and only for such a case, the patient share is figured as stated in this rule;
      cases under the new-plan-wait reprocessing rule, the prior-level reprocessing rule, the grace-period reprocessing rule and the estimate-request
      rule each follow their own rule, and every other case remains under the base rule: for an in-network line the member owes the allowed
      amount minus the plan payment and the practice may not bill more, and for an out-of-network line the submitted amount minus the plan
      payment.
  - base_policy: dental_evt_missing_tooth_clause
    superseded_clause: >-
      The clause does not apply to group enrollments entered at open enrollment, as new hires or by special enrollment, and it does not apply
      when the person shows prior_coverage_months that cover the extraction date.
    replaced_by: >-
      For a reprocessed initial-wait line under this rule, and only for such a case, earlier coverage counts toward the missing-tooth clause
      as the clause credit stated in this rule; cases under the estimate-request rule follow their own rule, and every other case remains
      under the base rule: the clause does not apply to group enrollments entered at open enrollment, as new hires or by special enrollment,
      or when the person shows prior coverage months that cover the extraction date.
  trigger: state_due
  subject:
  - dental_claim_line_adjusted
  computes: member_responsibility
  target_tool: reprocess_wait_denial_e5c18a2f
  params:
    molar_teeth: ',1,2,3,14,15,16,17,18,19,30,31,32,'
    porcelain_codes: ',D2740,D2750,D2751,D2752,D2783,'
    prosthesis_categories: ',bridge,denture,implant,'
  rule: >-
    This initial-wait reprocessing rule fixes the corrected patient share when a line that stands denied DENIED_WAITING_PERIOD on an enrollment
    whose plan has never changed (no plan change date is recorded) is reprocessed on the person's earlier coverage; a line of an enrollment
    whose plan has changed, a line that a frequency or age limit would deny, a line of a child whose subscriber has two or more children enrolled
    on individual_exchange enrollments, and a line on an account with more than three enrolled persons are reprocessed under the base rules.
    The line under reprocessing is the enrollment's most recently decided line whose event type is denied and whose remark is DENIED_WAITING_PERIOD,
    and where several such lines share that latest decision date this rule is not used and each is reprocessed under the base rules; where
    the enrollment shows a plan change date this rule is not used. A corrected initial-wait decision keeps the denied line's claim number,
    line number, practice, network status, procedure, service class, tooth, extraction date, dates, benefit year, billed amount, allowed amount,
    alternate allowance and other-carrier payment. The payment on a reprocessed initial-wait line is figured on the line's allowed amount.
    The coinsurance on a reprocessed initial-wait line is the plan's in-network percentage for the line's service class. A reprocessed initial-wait
    line is payable only when its date of service is at least its waiting period counted in whole calendar months from the coverage effective
    date (a month counting as whole when the day of the month of the date of service is not earlier than that of the coverage effective date,
    which always falls on the first of a month), where the waiting period is the one for the line's service class that applies to the enrollment
    (the plan's individual waiting period for individual and individual_exchange enrollments, its late-entrant waiting period for group enrollments
    with enrollment type late_entrant, and none for other group enrollments or for preventive services); otherwise its plan payment is 0.00.
    When the plan's missing-tooth clause months are above 0, a reprocessed initial-wait line for a bridge, denture or implant that replaces
    a tooth whose extraction date is before the coverage effective date is payable only once the months of continuous enrollment, counted
    in whole calendar months from the coverage effective date to the date of service, reach the clause months; the clause does not apply to
    group enrollments entered at open enrollment, as new hires or by special enrollment; a line the clause still bars has a plan payment of
    0.00. The deductible taken on a reprocessed initial-wait line is the plan's individual deductible less the person's deductible postings
    net of deductible reversals for the line's benefit year, never below zero and never more than the allowance the payment is figured on;
    a preventive-class line on a plan that waives the preventive deductible, or any line on a plan whose individual deductible is 0.00, takes
    none. Because every Cascade plan's family deductible maximum is three times its individual deductible, on an account with no more than
    three enrolled persons the family limit never falls below the person's own remaining deductible, so a reprocessed initial-wait line counts
    only the person's own deductible postings. The normal benefit on a reprocessed initial-wait line is the allowance less the deductible
    taken, times the coinsurance, rounded to the cent with a half cent rounded up, and the plan payment and patient share are rounded to the
    cent the same way. The other-carrier adjustment of a reprocessed initial-wait line follows the plan's coordination method and the primary
    payment recorded on the denied line: with non-duplication the normal benefit is reduced by that payment, never below zero; with standard
    coordination of benefits the payment is limited to the allowed amount less that payment; when no primary payment is recorded no adjustment
    is made. The plan payment on a reprocessed initial-wait line is never more than the person's remaining annual maximum for the line's benefit
    year, the plan's annual maximum less the person's maximum postings net of maximum reversals for that benefit year. The patient share on
    a reprocessed initial-wait line is the billed amount less the plan payment for a line from an out_of_network practice, and the allowed
    amount less the plan payment otherwise, never below zero. The adjustments below are applied to the standard amount in this order: the
    waiting-period and missing-tooth tests first, then the allowance and coinsurance replacements, which give the normal benefit; then the
    other-carrier deduction, never taking the payment below zero; then the other-carrier ceiling; then the annual-maximum ceiling, which gives
    the plan payment; the patient share is figured last from the plan payment, its limit applied before its reduction and its zero floor last.
    The person's earlier DHMO enrollment is the person's own terminated Cascade DHMO enrollment, matched by name and date of birth, that ended
    on the day before this enrollment's coverage effective date (a move from the DHMO with no break in coverage); the person's DHMO services
    are read only from that enrollment's own service records, never from another enrollment of the same subscriber. The months a reprocessed
    initial-wait line credits toward its waiting period follow the person's earlier coverage: when the plan credits prior coverage month for
    month and the person has an earlier DHMO enrollment, the credit is the calendar months from the month that DHMO coverage took effect through
    the month it ended, both months counted (DHMO coverage always takes effect on the first of a month); when the plan credits prior coverage
    month for month, no such DHMO enrollment exists, and the enrollment shows documented prior coverage months whose prior coverage end date
    is no more than prior_coverage_max_gap_days calendar days before the coverage effective date, the credit is those documented months; otherwise
    no months are credited; the months credited shorten that waiting period, never below zero; this modifies the patient share on a reprocessed
    initial-wait line. The months a reprocessed initial-wait line credits toward the missing-tooth clause follow where the replaced tooth
    was lost: when the service records of the person's earlier DHMO enrollment show an extraction of that tooth on the line's extraction date,
    the clause credit is the calendar months from the month that DHMO coverage took effect through the month it ended, both months counted;
    when no such DHMO extraction is recorded and the enrollment shows documented prior coverage months whose prior coverage end date is on
    or after the extraction date and no more than prior_coverage_max_gap_days calendar days before the coverage effective date, the clause
    credit is those documented months; otherwise no months are credited; the months credited are added to the months of continuous enrollment;
    this modifies the patient share on a reprocessed initial-wait line. The coinsurance a reprocessed initial-wait line is figured at follows
    its network status: a basic-class line from an out_of_network practice is figured at the plan's out-of-network basic percentage; a major-class
    line from an out_of_network practice is figured at the plan's out-of-network major percentage; any other line is figured at the plan's
    in-network percentage for its service class; this modifies the patient share on a reprocessed initial-wait line. The allowance a reprocessed
    initial-wait line is figured on follows the billed procedure: a posterior composite filling on a plan with the posterior-composite alternate
    benefit, or a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth 1, 2, 3, 14, 15, 16, 17, 18, 19,
    30, 31 and 32) on a plan with the molar-crown alternate benefit, whose billed amount is not below its alternate allowance, is figured
    on its alternate allowance; any line whose billed amount is below the allowance that would otherwise apply (the alternate allowance for
    such a filling or crown, the allowed amount otherwise) is figured on its billed amount; every remaining line is figured on its allowed
    amount; this modifies the patient share on a reprocessed initial-wait line. The patient share on a reprocessed initial-wait line follows
    the person and the other coverage: for a person receiving the pediatric essential-health-benefit treatment on a line from an in-network
    practice, the patient share is first limited to the pediatric out-of-pocket room (the pediatric out-of-pocket maximum for one child less
    the person's pediatric out-of-pocket postings net of reversals for the benefit year) and then reduced by any primary payment recorded
    on the line, and the plan payment on such a line is the allowance less that limited share, so the line that crosses the pediatric out-of-pocket
    maximum pays the allowance minus the cost sharing still remaining and a later line pays the full allowance; for any other line on which
    a primary payment above 0.00 is recorded, the patient share is reduced by that primary payment; otherwise the patient share is not adjusted;
    the patient share is never below zero; this modifies the patient share on a reprocessed initial-wait line. The annual-maximum limit on
    a reprocessed initial-wait line follows the person and the plan: for a person receiving the pediatric essential-health-benefit treatment
    (an individual_exchange enrollment and a date of service before the person's pediatric_ehb_age_limit_years birthday) no annual maximum
    applies; on a plan that banks rollover dollars the plan payment is never more than the remaining annual maximum plus the person's rollover
    balance (rollover credits less rollover draws), the part above the remaining annual maximum being paid from that balance; otherwise the
    plan payment is never more than the remaining annual maximum; this modifies the patient share on a reprocessed initial-wait line. For
    a reprocessed initial-wait line under this rule, and only for such a case, the months credited toward the waiting period follow the earlier-coverage
    credit stated in this rule; cases under the new-plan-wait reprocessing rule, the prior-level reprocessing rule, the grace-period reprocessing
    rule, the estimate-request rule and the claim-appeal rule each follow their own rule, and every other case remains under the base rule:
    when the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months, never below
    zero, and with none there is no credit. In every case, whether or not under this rule, a claim line paid on an alternate allowance carries
    remark PAID_ALTERNATE_BENEFIT, and a reprocessed decision of such a line carries the reprocessing remark ADJUSTED_REPROCESSED in its place.
    For a reprocessed initial-wait line under this rule, and only for such a case, the allowance is figured as stated in this rule; cases
    under the new-plan-wait reprocessing rule, the prior-level reprocessing rule, the grace-period reprocessing rule and the estimate-request
    rule each follow their own rule, and every other case remains under the base rule: the allowance is the allowed amount for the billed
    procedure, replaced by the alternate allowance when an alternate benefit applies (a posterior composite filling on a plan with the posterior-composite
    alternate benefit, or a porcelain or ceramic crown on a molar on a plan with the molar-crown alternate benefit), and such a line is paid
    with remark PAID_ALTERNATE_BENEFIT. In every case, whether or not under this rule, the practice of an in-network line may not bill the
    member more than the allowed amount. For a reprocessed initial-wait line under this rule, and only for such a case, the patient share
    is figured as stated in this rule; cases under the new-plan-wait reprocessing rule, the prior-level reprocessing rule, the grace-period
    reprocessing rule and the estimate-request rule each follow their own rule, and every other case remains under the base rule: for an in-network
    line the member owes the allowed amount minus the plan payment and the practice may not bill more, and for an out-of-network line the
    submitted amount minus the plan payment. For a reprocessed initial-wait line under this rule, and only for such a case, earlier coverage
    counts toward the missing-tooth clause as the clause credit stated in this rule; cases under the estimate-request rule follow their own
    rule, and every other case remains under the base rule: the clause does not apply to group enrollments entered at open enrollment, as
    new hires or by special enrollment, or when the person shows prior coverage months that cover the extraction date.
  prerequisite: []
  cross_category:
  - category: dhmo
    as: history
    reads:
    - dhmo_plan_id
    - status
    - enrollee_name
    - enrollee_date_of_birth
    - coverage_effective_date
    - termination_date
    - dhmo_services.dhmo_plan_id
    - dhmo_services.date_of_service
    - dhmo_services.tooth_or_area
    - dhmo_services.procedure_category
    note: >-
      the waiting-period credit reads the person's DHMO enrollment that ended the day before this coverage; the clause credit reads the DHMO
      extraction service of the replaced tooth and its enrollment
  compute:
  - tline: >-
      LATEST('dental_claim_lines', 'dental_claim_line_id', date_field='adjudicated_date', event_type='dental_claim_line_denied', remark_code='DENIED_WAITING_PERIOD')
  - t_class: LATEST('dental_claim_lines', 'service_class', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_dos: LATEST('dental_claim_lines', 'date_of_service', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_year: LATEST('dental_claim_lines', 'benefit_year', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_allowed: LATEST('dental_claim_lines', 'allowed_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_cat: LATEST('dental_claim_lines', 'procedure_category', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_cdt: LATEST('dental_claim_lines', 'cdt_code', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_tooth: LATEST('dental_claim_lines', 'tooth_or_area', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_billed: LATEST('dental_claim_lines', 'submitted_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_alt: LATEST('dental_claim_lines', 'alternate_allowed_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_other: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_ext: LATEST('dental_claim_lines', 'extraction_date', date_field='adjudicated_date', dental_claim_line_id=tline)
  - ped: >-
      F('market_segment') == 'individual_exchange' and MONTHS(F('enrollee_date_of_birth'), t_dos) < 12 * P('pediatric_ehb_age_limit_years')
  - wait_len: >-
      0 if (t_class == 'preventive' or (F('market_segment') == 'group' and F('enrollment_type') != 'late_entrant')) else ((P('wait_basic_months_late_entrant')
      if t_class == 'basic' else P('wait_major_months_late_entrant')) if F('market_segment') == 'group' else (P('wait_basic_months_individual')
      if t_class == 'basic' else P('wait_major_months_individual')))
  - clause_need: >-
      P('missing_tooth_clause_months') > 0 and (',' + t_cat + ',') in K('prosthesis_categories') and t_ext != None and t_ext < F('coverage_effective_date')
      and not (F('market_segment') == 'group' and F('enrollment_type') != 'late_entrant')
  - ded_room: >-
      0 if ((t_class == 'preventive' and P('deductible_waived_preventive')) or P('deductible_individual') == 0) else MX(0, P('deductible_individual')
      - (SUM('dental_accumulator_postings', 'amount', event_type='dental_deductible_posting', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_deductible_reversal', benefit_year=t_year)))
  - room_std: >-
      MX(0, P('annual_maximum_per_person') - (SUM('dental_accumulator_postings', 'amount', event_type='dental_max_posting', benefit_year=t_year)
      - SUM('dental_accumulator_postings', 'amount', event_type='dental_max_reversal', benefit_year=t_year)))
  - cob_less: t_other if (t_other > 0 and P('cob_method') == 'non_duplication') else 0
  - cob_limit: (t_allowed - t_other) if (t_other > 0 and P('cob_method') == 'standard_cob') else t_allowed
  - oop_used: >-
      SUM('dental_accumulator_postings', 'amount', event_type='dental_ped_oop_posting', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_ped_oop_reversal', benefit_year=t_year)
  - base_amt: t_billed if t_net == 'out_of_network' else t_allowed
  - ce_month: MONTHS('2000-01-01', F('coverage_effective_date'))
  - ce_first: ('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-01'
  - ce_day: DAYS(ce_first, F('coverage_effective_date')) + 1
  - pv_first: ('%d' % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-01'
  - day_before: >-
      (('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-' + ('%02d' % (ce_day - 1))) if ce_day > 1 else (('%d'
      % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-' + ('%02d' % DAYS(pv_first, ce_first)))
  - dhmo_id: >-
      CFIELD('dhmo', 'dhmo_plan_id', enrollee_name=F('enrollee_name'), enrollee_date_of_birth=F('enrollee_date_of_birth'), status='terminated',
      termination_date=day_before)
  - dhmo_start: CFIELD('dhmo', 'coverage_effective_date', dhmo_plan_id=dhmo_id) if dhmo_id else None
  - dhmo_end: CFIELD('dhmo', 'termination_date', dhmo_plan_id=dhmo_id) if dhmo_id else None
  - doc_gap: DAYS(F('prior_coverage_end_date'), F('coverage_effective_date')) if F('prior_coverage_months') > 0 else 99999
  - credit_months: >-
      (MONTHS(dhmo_start, dhmo_end) + 1) if (dhmo_start != None and P('prior_coverage_credit_method') == 'month_for_month') else (F('prior_coverage_months')
      if (doc_gap <= P('prior_coverage_max_gap_days') and P('prior_coverage_credit_method') == 'month_for_month') else 0)
  - ext_plan: >-
      XLATEST('dhmo', 'dhmo_services', 'dhmo_plan_id', date_field='date_of_service', dhmo_plan_id=dhmo_id, procedure_category='extraction',
      tooth_or_area=t_tooth, date_of_service=t_ext) if (t_ext and dhmo_id) else None
  - ext_start: CFIELD('dhmo', 'coverage_effective_date', dhmo_plan_id=ext_plan, status='terminated') if ext_plan else None
  - ext_end: CFIELD('dhmo', 'termination_date', dhmo_plan_id=ext_plan, status='terminated') if ext_plan else None
  - clause_credit: >-
      (MONTHS(ext_start, ext_end) + 1) if ext_start != None else (F('prior_coverage_months') if (t_ext and F('prior_coverage_months') > 0
      and F('prior_coverage_end_date') >= t_ext and DAYS(F('prior_coverage_end_date'), F('coverage_effective_date')) <= P('prior_coverage_max_gap_days'))
      else 0)
  - rate_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - line_rate: >-
      P('coinsurance_basic_oon') if (rate_net == 'out_of_network' and t_class == 'basic') else (P('coinsurance_major_oon') if (rate_net ==
      'out_of_network' and t_class == 'major') else (P('coinsurance_preventive_in_network') if t_class == 'preventive' else (P('coinsurance_basic_in_network')
      if t_class == 'basic' else P('coinsurance_major_in_network'))))
  - alt_case: >-
      (t_cat == 'filling_composite_posterior' and P('posterior_composite_alternate_benefit')) or (t_cat == 'crown' and (',' + t_cdt + ',')
      in K('porcelain_codes') and (',' + t_tooth + ',') in K('molar_teeth') and P('molar_crown_alternate_benefit'))
  - allow_billed: LATEST('dental_claim_lines', 'submitted_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - line_allow: >-
      t_alt if (alt_case and allow_billed >= t_alt) else (allow_billed if allow_billed < (t_alt if alt_case else t_allowed) else t_allowed)
  - share_paid: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - share_less: share_paid if ((ped and t_net != 'out_of_network') or share_paid > 0) else 0
  - share_cap: MX(0, P('pediatric_oop_max_one_child') - oop_used) if (ped and t_net != 'out_of_network') else base_amt
  - roll_bal: >-
      SUM('dental_accumulator_postings', 'amount', event_type='dental_rollover_credit') - SUM('dental_accumulator_postings', 'amount', event_type='dental_rollover_draw')
  - max_cap: t_allowed if ped else ((room_std + roll_bal) if P('rollover_enabled') else room_std)
  - result: >-
      RND(MX(0, MN(share_cap, base_amt - (MN(MN(MX(0, RND((line_allow - MN(line_allow, ded_room)) * line_rate / 100, 2) - cob_less), cob_limit),
      max_cap) if ((MONTHS(F('coverage_effective_date'), t_dos) >= MX(0, wait_len - credit_months)) and ((not clause_need) or (MONTHS(F('coverage_effective_date'),
      t_dos) + clause_credit >= P('missing_tooth_clause_months')))) else 0)) - share_less), 2)
  compute_basis:
    tline: >-
      The line under reprocessing is the enrollment's most recently decided line whose event type is denied and whose remark is DENIED_WAITING_PERIOD,
      and where several such lines share that latest decision date this rule is not used and each is reprocessed under the base rules; where
      the enrollment shows a plan change date this rule is not used.
    t_class: >-
      A corrected initial-wait decision keeps the denied line's claim number, line number, practice, network status, procedure, service class,
      tooth, extraction date, dates, benefit year, billed amount, allowed amount, alternate allowance and other-carrier payment.
    t_dos: >-
      A corrected initial-wait decision keeps the denied line's claim number, line number, practice, network status, procedure, service class,
      tooth, extraction date, dates, benefit year, billed amount, allowed amount, alternate allowance and other-carrier payment.
    t_year: >-
      A corrected initial-wait decision keeps the denied line's claim number, line number, practice, network status, procedure, service class,
      tooth, extraction date, dates, benefit year, billed amount, allowed amount, alternate allowance and other-carrier payment.
    t_allowed: The payment on a reprocessed initial-wait line is figured on the line's allowed amount.
    t_net: >-
      The coinsurance a reprocessed initial-wait line is figured at follows its network status: a basic-class line from an out_of_network
      practice is figured at the plan's out-of-network basic percentage; a major-class line from an out_of_network practice is figured at
      the plan's out-of-network major percentage; any other line is figured at the plan's in-network percentage for its service class; this
      modifies the patient share on a reprocessed initial-wait line.
    t_cat: >-
      The allowance a reprocessed initial-wait line is figured on follows the billed procedure: a posterior composite filling on a plan with
      the posterior-composite alternate benefit, or a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth
      1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and 32) on a plan with the molar-crown alternate benefit, whose billed amount is not below its
      alternate allowance, is figured on its alternate allowance; any line whose billed amount is below the allowance that would otherwise
      apply (the alternate allowance for such a filling or crown, the allowed amount otherwise) is figured on its billed amount; every remaining
      line is figured on its allowed amount; this modifies the patient share on a reprocessed initial-wait line.
    t_cdt: >-
      The allowance a reprocessed initial-wait line is figured on follows the billed procedure: a posterior composite filling on a plan with
      the posterior-composite alternate benefit, or a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth
      1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and 32) on a plan with the molar-crown alternate benefit, whose billed amount is not below its
      alternate allowance, is figured on its alternate allowance; any line whose billed amount is below the allowance that would otherwise
      apply (the alternate allowance for such a filling or crown, the allowed amount otherwise) is figured on its billed amount; every remaining
      line is figured on its allowed amount; this modifies the patient share on a reprocessed initial-wait line.
    t_tooth: >-
      The allowance a reprocessed initial-wait line is figured on follows the billed procedure: a posterior composite filling on a plan with
      the posterior-composite alternate benefit, or a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth
      1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and 32) on a plan with the molar-crown alternate benefit, whose billed amount is not below its
      alternate allowance, is figured on its alternate allowance; any line whose billed amount is below the allowance that would otherwise
      apply (the alternate allowance for such a filling or crown, the allowed amount otherwise) is figured on its billed amount; every remaining
      line is figured on its allowed amount; this modifies the patient share on a reprocessed initial-wait line.
    t_billed: >-
      The patient share on a reprocessed initial-wait line is the billed amount less the plan payment for a line from an out_of_network practice,
      and the allowed amount less the plan payment otherwise, never below zero.
    t_alt: >-
      The allowance a reprocessed initial-wait line is figured on follows the billed procedure: a posterior composite filling on a plan with
      the posterior-composite alternate benefit, or a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth
      1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and 32) on a plan with the molar-crown alternate benefit, whose billed amount is not below its
      alternate allowance, is figured on its alternate allowance; any line whose billed amount is below the allowance that would otherwise
      apply (the alternate allowance for such a filling or crown, the allowed amount otherwise) is figured on its billed amount; every remaining
      line is figured on its allowed amount; this modifies the patient share on a reprocessed initial-wait line.
    t_other: >-
      The other-carrier adjustment of a reprocessed initial-wait line follows the plan's coordination method and the primary payment recorded
      on the denied line: with non-duplication the normal benefit is reduced by that payment, never below zero; with standard coordination
      of benefits the payment is limited to the allowed amount less that payment; when no primary payment is recorded no adjustment is made.
    t_ext: >-
      When the plan's missing-tooth clause months are above 0, a reprocessed initial-wait line for a bridge, denture or implant that replaces
      a tooth whose extraction date is before the coverage effective date is payable only once the months of continuous enrollment, counted
      in whole calendar months from the coverage effective date to the date of service, reach the clause months; the clause does not apply
      to group enrollments entered at open enrollment, as new hires or by special enrollment; a line the clause still bars has a plan payment
      of 0.00.
    ped: >-
      The plan payment on a reprocessed initial-wait line is never more than the person's remaining annual maximum for the line's benefit
      year, the plan's annual maximum less the person's maximum postings net of maximum reversals for that benefit year.
    wait_len: >-
      A reprocessed initial-wait line is payable only when its date of service is at least its waiting period counted in whole calendar months
      from the coverage effective date (a month counting as whole when the day of the month of the date of service is not earlier than that
      of the coverage effective date, which always falls on the first of a month), where the waiting period is the one for the line's service
      class that applies to the enrollment (the plan's individual waiting period for individual and individual_exchange enrollments, its late-entrant
      waiting period for group enrollments with enrollment type late_entrant, and none for other group enrollments or for preventive services);
      otherwise its plan payment is 0.00.
    clause_need: >-
      When the plan's missing-tooth clause months are above 0, a reprocessed initial-wait line for a bridge, denture or implant that replaces
      a tooth whose extraction date is before the coverage effective date is payable only once the months of continuous enrollment, counted
      in whole calendar months from the coverage effective date to the date of service, reach the clause months; the clause does not apply
      to group enrollments entered at open enrollment, as new hires or by special enrollment; a line the clause still bars has a plan payment
      of 0.00.
    ded_room: >-
      The deductible taken on a reprocessed initial-wait line is the plan's individual deductible less the person's deductible postings net
      of deductible reversals for the line's benefit year, never below zero and never more than the allowance the payment is figured on; a
      preventive-class line on a plan that waives the preventive deductible, or any line on a plan whose individual deductible is 0.00, takes
      none.
    room_std: >-
      The plan payment on a reprocessed initial-wait line is never more than the person's remaining annual maximum for the line's benefit
      year, the plan's annual maximum less the person's maximum postings net of maximum reversals for that benefit year.
    cob_less: >-
      The other-carrier adjustment of a reprocessed initial-wait line follows the plan's coordination method and the primary payment recorded
      on the denied line: with non-duplication the normal benefit is reduced by that payment, never below zero; with standard coordination
      of benefits the payment is limited to the allowed amount less that payment; when no primary payment is recorded no adjustment is made.
    cob_limit: >-
      The other-carrier adjustment of a reprocessed initial-wait line follows the plan's coordination method and the primary payment recorded
      on the denied line: with non-duplication the normal benefit is reduced by that payment, never below zero; with standard coordination
      of benefits the payment is limited to the allowed amount less that payment; when no primary payment is recorded no adjustment is made.
    oop_used: >-
      The patient share on a reprocessed initial-wait line follows the person and the other coverage: for a person receiving the pediatric
      essential-health-benefit treatment on a line from an in-network practice, the patient share is first limited to the pediatric out-of-pocket
      room (the pediatric out-of-pocket maximum for one child less the person's pediatric out-of-pocket postings net of reversals for the
      benefit year) and then reduced by any primary payment recorded on the line, and the plan payment on such a line is the allowance less
      that limited share, so the line that crosses the pediatric out-of-pocket maximum pays the allowance minus the cost sharing still remaining
      and a later line pays the full allowance; for any other line on which a primary payment above 0.00 is recorded, the patient share is
      reduced by that primary payment; otherwise the patient share is not adjusted; the patient share is never below zero; this modifies the
      patient share on a reprocessed initial-wait line.
    base_amt: >-
      The patient share on a reprocessed initial-wait line is the billed amount less the plan payment for a line from an out_of_network practice,
      and the allowed amount less the plan payment otherwise, never below zero.
