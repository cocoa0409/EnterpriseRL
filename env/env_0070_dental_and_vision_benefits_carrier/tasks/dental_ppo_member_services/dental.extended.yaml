    ext_plan: >-
      The months a requested estimate credits toward the missing-tooth clause follow where the replaced tooth was lost: when the service records
      of the person's earlier DHMO enrollment show an extraction of that tooth on that extraction date, the clause credit is the calendar
      months from the month that DHMO coverage took effect through the month it ended, both months counted; when they show no such extraction
      and the enrollment shows documented prior coverage months whose prior coverage end date is on or after the extraction date and no more
      than prior_coverage_max_gap_days calendar days before the coverage effective date, the clause credit is those documented months; otherwise
      no months are credited; the months credited are added to the months of continuous enrollment; this modifies the estimated patient cost
