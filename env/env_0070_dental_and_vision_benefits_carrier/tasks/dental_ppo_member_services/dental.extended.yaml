    wait_len: >-
      The payment requested on a claim appeal is figured at the plan's level only when the line's date of service is at least its new waiting
      period counted in whole calendar months from the plan change date (a month counting as whole when the day of the month of the date of
      service is not earlier than that of the plan change date, which always falls on the first of a month), where the waiting period is the
      one for the line's service class that applies to the enrollment (the plan's late-entrant waiting period for group enrollments with enrollment
      type late_entrant, and none for other group enrollments or for preventive services); otherwise the requested payment is 0.00.
    ded_req: >-
      The deductible of the payment requested on a claim appeal is the plan's individual deductible less the person's deductible postings
      net of deductible reversals for the line's benefit year, with the deductible posting of the decision under appeal backed out, never
      below zero and never more than the requested allowance; a preventive-class line on a plan that waives the preventive deductible, or
      any line on a plan whose individual deductible is 0.00, takes none.
    room: >-
      The payment requested on a claim appeal is never more than the person's remaining annual maximum for the line's benefit year, the plan's
      annual maximum less the person's maximum postings net of maximum reversals for that benefit year, with the maximum posting of the decision
      under appeal backed out.
    ce_month: >-
      The months the payment requested on a claim appeal credits toward its waiting period follow the person's earlier coverage: when the
      plan credits prior coverage month for month and the person (matched by name and date of birth) has a terminated Cascade DHMO enrollment
      that ended on the day before this enrollment's coverage effective date (a move from the DHMO with no break in coverage), the appeal
      credit is the calendar months from the month that DHMO coverage took effect through the month it ended, both months counted (DHMO coverage
      always takes effect on the first of a month); when the plan credits prior coverage month for month, no such DHMO enrollment exists,
      and the enrollment shows documented prior coverage months whose prior coverage end date is no more than prior_coverage_max_gap_days
      calendar days before the coverage effective date, the appeal credit is those documented months; otherwise no months are credited; the
      months credited shorten that waiting period, never below zero; this modifies the amount in dispute.
