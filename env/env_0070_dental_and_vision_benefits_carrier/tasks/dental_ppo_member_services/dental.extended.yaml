  factors:
  - id: estimate_dhmo_months
    effect: parameter
    decides: credit_months
    bindings:
    - dhmo_start
    - dhmo_end
    - doc_gap
    - credit_months
    ladder:
    - when: >-
        the plan credits prior coverage month for month AND the person has an earlier DHMO enrollment (own terminated Cascade DHMO enrollment,
        matched by name and date of birth, ended the day before this coverage effective date)
      value: the calendar months from the month that DHMO coverage took effect through the month it ended, both counted
    - when: >-
        the plan credits prior coverage month for month AND no such DHMO enrollment exists AND the enrollment shows documented prior coverage
        months ending no more than prior_coverage_max_gap_days days before the coverage effective date
      value: F('prior_coverage_months')
    - when: otherwise
      value: '0'
    baseline:
      credit_months: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dhmo
  - id: estimate_clause_months
    effect: parameter
    decides: clause_credit
    bindings:
    - ext_plan
    - ext_start
    - ext_end
    - clause_credit
    ladder:
    - when: >-
        the service records of the person's earlier DHMO enrollment show an extraction of the replaced tooth on the recorded extraction date
      value: the calendar months of that DHMO enrollment, first and last month counted
    - when: >-
        no such DHMO extraction AND documented prior coverage months whose end date is on or after the extraction date and within prior_coverage_max_gap_days
        days of the coverage effective date
      value: F('prior_coverage_months')
    - when: otherwise
      value: '0'
    baseline:
      clause_credit: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: dhmo
  - id: estimate_coinsurance
    effect: parameter
    decides: line_rate
    bindings:
    - rate_net
    - line_rate
    ladder:
    - when: a major-class service from an in_network_ppo or in_network_premier practice
      value: P('coinsurance_major_in_network')
    - when: a basic-class service from such a practice
      value: P('coinsurance_basic_in_network')
    - when: a preventive-class service from such a practice
      value: P('coinsurance_preventive_in_network')
    - when: otherwise
      value: the plan's out-of-network percentage for the service class
    baseline:
      line_rate: >-
        P('coinsurance_preventive_oon') if e_class == 'preventive' else (P('coinsurance_basic_oon') if e_class == 'basic' else P('coinsurance_major_oon'))
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: estimate_benefit_limit
    effect: method
    decides: lim_cap
    bindings:
    - ped
    - oop_used
    - roll_bal
    - lim_cap
    - lim_cost
    ladder:
    - when: >-
        the person receives the pediatric essential-health-benefit treatment (individual_exchange AND before the pediatric_ehb_age_limit_years
        birthday)
      method: >-
        no annual maximum; on an in-network estimate the patient cost is capped at the one-child pediatric out-of-pocket maximum less the
        person's net pediatric out-of-pocket postings, the plan payment being the allowance less the capped cost
    - when: a non-preventive service AND a plan that banks rollover dollars
      method: payment limited to the remaining annual maximum plus the rollover balance
    - when: a preventive service AND a plan whose annual maximum does not apply to preventive services
      method: no annual maximum
    - when: otherwise
      method: payment limited to the remaining annual maximum
    baseline:
      lim_cap: room
      lim_cost: cost_base
    evidence:
    - history
    - tier_param
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The procedure, benefit category, tooth or area, network status, proposed fee and recorded allowance of the request are those of the
      person's most recently issued estimate line (its estimated allowed amount), and where several issued estimate lines share that latest
      issue date this rule is not used; the service class is the one recorded on the person's most recent claim-line decision for the same
      benefit category, where several such decisions share that latest decision date this rule is not used, and a request for a category with
      no such decision is figured under the base rules. The allowance a requested estimate is figured on is the lesser of the proposed fee
      and the allowance recorded on that estimate line. The coinsurance on a requested estimate is the plan's out-of-network percentage for
      the procedure's service class. A requested estimate is payable only when the issue date is at least its waiting period counted in whole
      calendar months from the coverage effective date (a month counting as whole when the day of the month of the issue date is not earlier
      than that of the coverage effective date, which always falls on the first of a month), where the waiting period is the one for the service
      class that applies to the enrollment (the plan's individual waiting period for individual and individual_exchange enrollments, its late-entrant
      waiting period for group enrollments with enrollment type late_entrant, and none for other group enrollments or for preventive services);
      otherwise its estimated plan payment is 0.00. When the plan's missing-tooth clause months are above 0, a requested estimate for a bridge,
      denture or implant that replaces a tooth extracted before the coverage effective date is payable only once the months of continuous
      enrollment, counted in whole calendar months from the coverage effective date to the issue date, reach the clause months; the clause
      does not apply to group enrollments entered at open enrollment, as new hires or by special enrollment; the extraction date is the one
      recorded on the person's most recently decided claim line for that tooth, where several claim lines for that tooth share that latest
      decision date this rule is not used, and a request for a replaced tooth whose most recently decided claim line records no extraction
      date is figured under the base rules; an estimate the clause still bars has an estimated plan payment of 0.00. The deductible taken
      on a requested estimate is the plan's individual deductible less the person's deductible postings net of deductible reversals for the
      issue date's benefit year, never below zero and never more than the allowance; a preventive-class service on a plan that waives the
      preventive deductible, or any service on a plan whose individual deductible is 0.00, takes none. Because every Cascade plan's family
      deductible maximum is three times its individual deductible, on an account with no more than three enrolled persons the family limit
      never falls below the person's own remaining deductible, so a requested estimate counts only the person's own deductible postings. The
      estimated normal benefit is the allowance less the deductible taken, times the coinsurance, rounded to the cent with a half cent rounded
      up, and the estimated plan payment and patient cost are rounded to the cent the same way. The estimated plan payment on a requested
      estimate is never more than the person's remaining annual maximum for the issue date's benefit year, the plan's annual maximum less
      the person's maximum postings net of maximum reversals for that benefit year. The estimated patient cost on a requested estimate is
      the proposed fee less the estimated plan payment for an out_of_network practice, and the allowance less the estimated plan payment otherwise,
      never below zero; no other coverage is assumed to pay.
    params:
    - deductible_individual
    - coinsurance_basic_oon
    - coinsurance_major_oon
    - coinsurance_preventive_oon
    - wait_basic_months_individual
    - wait_major_months_individual
    - wait_basic_months_late_entrant
    - wait_major_months_late_entrant
    - missing_tooth_clause_months
    - annual_maximum_per_person
  inputs:
