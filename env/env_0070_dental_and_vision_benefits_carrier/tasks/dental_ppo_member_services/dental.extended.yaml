    cob_limit: >-
      The other-carrier adjustment of the payment requested on a claim appeal follows the primary payment recorded on the decision under appeal:
      when that payment is above 0.00 and the plan coordinates by non-duplication, the normal benefit is reduced by it, never below zero;
      when it is above 0.00 and the plan coordinates by standard coordination of benefits, the payment is limited to the allowed amount less
      it; when none is recorded, no adjustment is made; this modifies the amount in dispute.
    result: >-
      The adjustments below are applied to the standard amount in this order: the waiting-period test first, then the allowance and coinsurance
      replacements, which give the requested normal benefit; then the other-carrier deduction, never taking the payment below zero; then the
      other-carrier ceiling; then the annual-maximum ceiling, which gives the requested payment; the amount in dispute is figured last from
      it.
  factors:
  - id: appeal_requested_allowance
    effect: parameter
    decides: req_allow
    bindings:
    - req_billed
    - req_allow
    ladder:
    - when: >-
        a posterior composite on a posterior-composite-alternate plan, or a porcelain or ceramic molar crown on a molar-crown-alternate plan
      value: the lesser of the billed procedure's allowed amount and the billed amount
    - when: any other line billed below the allowance the decision under appeal used
      value: the billed amount
    - when: otherwise
      value: the allowance the decision under appeal used
    baseline:
      req_allow: d_used
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: appeal_requested_coinsurance
    effect: parameter
    decides: line_rate
    bindings:
    - rate_net
    - line_rate
    ladder:
    - when: a basic-class line from an out_of_network practice
      value: P('coinsurance_basic_oon')
    - when: a major-class line from an out_of_network practice
      value: P('coinsurance_major_oon')
    - when: otherwise
      value: the plan's in-network percentage for the line's service class
    baseline:
      line_rate: >-
        P('coinsurance_preventive_in_network') if t_class == 'preventive' else (P('coinsurance_basic_in_network') if t_class == 'basic' else
        P('coinsurance_major_in_network'))
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: appeal_requested_coordination
    effect: method
    decides: cob_less
    bindings:
    - cob_paid
    - cob_less
    - cob_limit
    ladder:
    - when: a primary payment above 0.00 is recorded AND the plan coordinates by non_duplication
      method: the normal benefit less the primary payment, never below zero
    - when: a primary payment above 0.00 is recorded AND the plan coordinates by standard_cob
      method: the payment limited to the allowed amount less the primary payment
    - when: otherwise
      method: no adjustment
    baseline:
      cob_less: '0'
      cob_limit: t_allowed
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: appeal_dhmo_months
    effect: parameter
    decides: credit_months
    bindings:
    - ce_month
    - ce_first
    - ce_day
    - pv_first
    - day_before
    - dhmo_start
    - dhmo_end
    - doc_gap
    - credit_months
    ladder:
    - when: >-
        the plan credits prior coverage month for month AND the person has a terminated Cascade DHMO enrollment that ended on the day before
        this enrollment's coverage effective date
      value: the calendar months from the month that DHMO coverage took effect through the month it ended, both counted
    - when: >-
        the plan credits prior coverage month for month AND no such DHMO enrollment exists AND the enrollment shows documented prior coverage
        months ending no more than prior_coverage_max_gap_days days before the coverage effective date
      value: F('prior_coverage_months')
    - when: otherwise
      value: '0'
    baseline:
      credit_months: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dhmo
  baseline:
    rule: >-
      The decision under appeal supplies the plan payment, the allowed amount, the alternate allowance, the billed amount, the network status,
      the procedure, the service class, the tooth, the date of service, the benefit year and the other-carrier payment that the requested
      payment is figured with. The payment requested on a claim appeal is figured on the allowance the decision under appeal used: its alternate
      allowance for a posterior composite filling on a plan with the posterior-composite alternate benefit or for a porcelain or ceramic crown
      (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth 1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and 32) on a plan with the molar-crown
      alternate benefit, and its allowed amount otherwise. The coinsurance of the payment requested on a claim appeal is the plan's in-network
      percentage for the line's service class. The payment requested on a claim appeal is figured at the plan's level only when the line's
      date of service is at least its new waiting period counted in whole calendar months from the plan change date (a month counting as whole
      when the day of the month of the date of service is not earlier than that of the plan change date, which always falls on the first of
      a month), where the waiting period is the one for the line's service class that applies to the enrollment (the plan's late-entrant waiting
      period for group enrollments with enrollment type late_entrant, and none for other group enrollments or for preventive services); otherwise
      the requested payment is 0.00. The deductible of the payment requested on a claim appeal is the plan's individual deductible less the
      person's deductible postings net of deductible reversals for the line's benefit year, with the deductible posting of the decision under
      appeal backed out, never below zero and never more than the requested allowance; a preventive-class line on a plan that waives the preventive
      deductible, or any line on a plan whose individual deductible is 0.00, takes none. Because every Cascade plan's family deductible maximum
      is three times its individual deductible, on an account with no more than three enrolled persons the family limit never falls below
      the person's own remaining deductible, so the payment requested on a claim appeal counts only the person's own deductible postings.
      The requested normal benefit is the allowance less that deductible, times the coinsurance, rounded to the cent with a half cent rounded
      up, and the amount in dispute is rounded to the cent the same way. The payment requested on a claim appeal is never more than the person's
      remaining annual maximum for the line's benefit year, the plan's annual maximum less the person's maximum postings net of maximum reversals
      for that benefit year, with the maximum posting of the decision under appeal backed out. The amount in dispute is the requested payment
      less the plan payment of the decision under appeal, never below zero.
    params:
    - coinsurance_basic_in_network
    - coinsurance_major_in_network
    - wait_basic_months_late_entrant
    - wait_major_months_late_entrant
    - annual_maximum_per_person
  inputs:
    history:
    - table: dental_appeals
      aggregate: latest
      field: dental_claim_line_id
      filters:
        event_type: dental_appeal_decided
        appeal_level: first_level
        outcome: upheld
    - table: dental_claim_lines
      aggregate: latest
      field: dental_claim_line_id
      filters: {}
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_max_posting
    cross_category:
    - dhmo
