    cost_base: >-
      The estimated patient cost on a requested estimate is the proposed fee less the estimated plan payment for an out_of_network practice,
      and the allowance less the estimated plan payment otherwise, never below zero; no other coverage is assumed to pay.
    ce_month: >-
