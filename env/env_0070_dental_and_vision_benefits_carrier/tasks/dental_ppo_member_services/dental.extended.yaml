    t_billed: >-
      The amount the patient share on a reprocessed grace-period line starts from follows the network and the filing: for a line from an in-network
      practice received later than timely_filing_days_in_network calendar days after its date of service it is 0.00, the practice bearing
      the amount; for a line from an out_of_network practice it is the billed amount; for any other line it is the allowed amount; this modifies
      the patient share on a reprocessed grace-period line.
    t_alt: >-
      The allowance a reprocessed grace-period line is figured on follows the billed procedure: a posterior composite filling on a plan with
      the posterior-composite alternate benefit, or a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth
