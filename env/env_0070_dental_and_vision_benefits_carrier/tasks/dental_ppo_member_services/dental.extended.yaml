    result: >-
      The adjustments below are applied to the standard amount in this order: the waiting-period and missing-tooth tests first, then the coinsurance
      replacement, which gives the estimated normal benefit; then the benefit limit on the estimated plan payment; the estimated patient cost
      is figured last from it, its own limit applied last.
    dhmo_id: >-
      The person's earlier DHMO enrollment is the person's own terminated Cascade DHMO enrollment, matched by name and date of birth, that
      ended on the day before this enrollment's coverage effective date (a move from the DHMO with no break in coverage); the person's DHMO
