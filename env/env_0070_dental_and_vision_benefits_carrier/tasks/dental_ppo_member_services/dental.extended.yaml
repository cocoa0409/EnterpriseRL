  factors:
  - id: newplan_dhmo_months
    effect: parameter
    decides: credit_months
    bindings:
    - ce_month
    - ce_first
    - ce_day
    - pv_first
    - day_before
    - dhmo_start
    - dhmo_end
    - doc_gap
    - credit_months
    ladder:
    - when: >-
        the plan credits prior coverage month for month AND the person has a terminated Cascade DHMO enrollment that ended on the day before
        this enrollment's coverage effective date
      value: the calendar months from the month that DHMO coverage took effect through the month it ended, both counted
    - when: >-
        the plan credits prior coverage month for month AND no such DHMO enrollment exists AND the enrollment shows documented prior coverage
        months ending no more than prior_coverage_max_gap_days days before the coverage effective date
      value: F('prior_coverage_months')
    - when: otherwise
      value: '0'
    baseline:
      credit_months: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dhmo
  - id: newplan_coinsurance
    effect: parameter
    decides: line_rate
    bindings:
    - rate_net
    - line_rate
    ladder:
    - when: a basic-class line from an out_of_network practice
      value: P('coinsurance_basic_oon')
    - when: a major-class line from an out_of_network practice
      value: P('coinsurance_major_oon')
    - when: otherwise
      value: the plan's in-network percentage for the line's service class
    baseline:
      line_rate: >-
        P('coinsurance_preventive_in_network') if t_class == 'preventive' else (P('coinsurance_basic_in_network') if t_class == 'basic' else
        P('coinsurance_major_in_network'))
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: newplan_allowance
    effect: parameter
    decides: line_allow
    bindings:
    - t_cat
    - t_cdt
    - t_tooth
    - t_alt
    - alt_case
    - allow_billed
    - line_allow
    ladder:
    - when: >-
        a posterior composite on a posterior-composite-alternate plan, or a porcelain or ceramic molar crown on a molar-crown-alternate plan,
        billed at or above its alternate allowance
      value: the alternate allowance
    - when: a line billed below the allowance that would otherwise apply
      value: the billed amount
    - when: otherwise
      value: the allowed amount
    baseline:
      line_allow: t_allowed
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: newplan_coordination
    effect: method
    decides: cob_less
    bindings:
    - cob_paid
    - cob_less
    - cob_limit
    ladder:
    - when: a primary payment above 0.00 is recorded AND the plan coordinates by non_duplication
      method: the normal benefit less the primary payment, never below zero
    - when: a primary payment above 0.00 is recorded AND the plan coordinates by standard_cob
      method: the payment limited to the allowed amount less the primary payment
    - when: otherwise
      method: no adjustment
    baseline:
      cob_less: '0'
      cob_limit: t_allowed
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: newplan_share_adjustment
    effect: method
    decides: share_less
    bindings:
    - oop_used
    - share_paid
    - share_less
    - share_cap
    ladder:
    - when: the person receives the pediatric essential-health-benefit treatment AND the line is from an in-network practice
      method: >-
        the share first limited to the one-child pediatric out-of-pocket maximum less the person's net pediatric out-of-pocket postings, then
        less any recorded primary payment (the plan payment being the allowance less the limited share)
    - when: any other line with a primary payment above 0.00 recorded
      method: the share less the primary payment
    - when: otherwise
      method: the share unadjusted
    baseline:
      share_less: '0'
      share_cap: base_amt
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The payment on a reprocessed new-plan-wait line is figured on the line's allowed amount. The coinsurance on a reprocessed new-plan-wait
      line is the plan's in-network percentage for the line's service class. A reprocessed new-plan-wait line is payable at the plan's level
      only when its date of service is at least its waiting period counted in whole calendar months from the plan change date (a month counting
      as whole when the day of the month of the date of service is not earlier than that of the plan change date, which always falls on the
      first of a month), where the waiting period is the one for the line's service class that applies to the enrollment (the plan's individual
      waiting period for individual and individual_exchange enrollments, its late-entrant waiting period for group enrollments with enrollment
      type late_entrant, and none for other group enrollments or for preventive services); until then the line remains denied and its plan
      payment is 0.00. The deductible taken on a reprocessed new-plan-wait line is the plan's individual deductible less the person's deductible
      postings net of deductible reversals for the line's benefit year, never below zero and never more than the allowance the payment is
      figured on; a preventive-class line on a plan that waives the preventive deductible, or any line on a plan whose individual deductible
      is 0.00, takes none. Because every Cascade plan's family deductible maximum is three times its individual deductible, on an account
      with no more than three enrolled persons the family limit never falls below the person's own remaining deductible, so a reprocessed
      new-plan-wait line counts only the person's own deductible postings. The normal benefit on a reprocessed new-plan-wait line is the allowance
      less the deductible taken, times the coinsurance, rounded to the cent with a half cent rounded up, and the plan payment and patient
      share are rounded to the cent the same way. The plan payment on a reprocessed new-plan-wait line is never more than the person's remaining
      annual maximum for the line's benefit year, the plan's annual maximum less the person's maximum postings net of maximum reversals for
      that benefit year; for a person receiving the pediatric essential-health-benefit treatment (an individual_exchange enrollment and a
      date of service before the person's pediatric_ehb_age_limit_years birthday) no annual maximum applies. The patient share on a reprocessed
      new-plan-wait line is the billed amount less the plan payment for a line from an out_of_network practice, and the allowed amount less
      the plan payment otherwise, never below zero.
    params:
    - deductible_individual
    - coinsurance_basic_in_network
    - coinsurance_major_in_network
    - wait_basic_months_individual
    - wait_major_months_individual
    - wait_basic_months_late_entrant
    - wait_major_months_late_entrant
    - annual_maximum_per_person
    - pediatric_ehb_age_limit_years
  inputs:
    history:
    - table: dental_claim_lines
      aggregate: latest
      field: dental_claim_line_id
      filters:
        event_type: dental_claim_line_denied
        remark_code: DENIED_WAITING_PERIOD
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_deductible_posting
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_max_posting
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_ped_oop_posting
    cross_category:
    - dhmo
- id: dental_ext_claim_appeal_dispute
  base_policy_refs:
  - dental_evt_appeals
  - dental_evt_claim_adjudication
  - dental_evt_cob
  - dental_evt_waiting_periods
  overwrite:
  - base_policy: dental_evt_waiting_periods
    superseded_clause: >-
      When the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months (never below
      zero); with none there is no credit.
    replaced_by: >-
      For the payment requested on a claim appeal under this rule, and only for such a case, the months credited toward the waiting period
      follow the earlier-coverage credit stated in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing
      rule, the prior-level reprocessing rule, the grace-period reprocessing rule and the estimate-request rule each follow their own rule,
      and every other case remains under the base rule: when the plan's prior_coverage_credit_method is month_for_month the waiting period
      is shortened by prior_coverage_months, never below zero, and with none there is no credit.
  trigger: on_request
  subject:
  - dental_appeal_filed
  computes: amount_in_dispute
  target_tool: file_claim_appeal_86dbcb40
  params:
    molar_teeth: ',1,2,3,14,15,16,17,18,19,30,31,32,'
    porcelain_codes: ',D2740,D2750,D2751,D2752,D2783,'
  rule: >-
    This claim-appeal rule fixes the amount in dispute that a member states when filing a second-level post-service appeal, on a group enrollment,
    of a claim-line decision upheld at the first level, for a line dated on or after the date the enrollment changed to a plan that covers
    the line's service class while the plan held before did not, on a plan that does not bank rollover dollars, on an account with no more
    than three enrolled persons; any other appeal states no amount under this rule. A second-level filing names the claim line its first-level
    filing named, even where that line has since been reprocessed; the first-level filing is the one decided by the enrollment's most recently
    decided first-level appeal decision with outcome upheld, and the decision under appeal is the latest decision on that line's claim number
    and line number, a reprocessed decision of it included. Where several upheld first-level decisions share that latest decided date, or
    several decisions on that claim number and line number share that latest decision date, this rule is not used and the appeal states no
    amount under it. The decision under appeal supplies the plan payment, the allowed amount, the alternate allowance, the billed amount,
    the network status, the procedure, the service class, the tooth, the date of service, the benefit year and the other-carrier payment that
    the requested payment is figured with. The payment requested on a claim appeal is figured on the allowance the decision under appeal used:
    its alternate allowance for a posterior composite filling on a plan with the posterior-composite alternate benefit or for a porcelain
    or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth 1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and 32) on a plan
    with the molar-crown alternate benefit, and its allowed amount otherwise. The coinsurance of the payment requested on a claim appeal is
    the plan's in-network percentage for the line's service class. The payment requested on a claim appeal is figured at the plan's level
    only when the line's date of service is at least its new waiting period counted in whole calendar months from the plan change date (a
    month counting as whole when the day of the month of the date of service is not earlier than that of the plan change date, which always
    falls on the first of a month), where the waiting period is the one for the line's service class that applies to the enrollment (the plan's
    late-entrant waiting period for group enrollments with enrollment type late_entrant, and none for other group enrollments or for preventive
    services); otherwise the requested payment is 0.00. The deductible of the payment requested on a claim appeal is the plan's individual
    deductible less the person's deductible postings net of deductible reversals for the line's benefit year, with the deductible posting
    of the decision under appeal backed out, never below zero and never more than the requested allowance; a preventive-class line on a plan
    that waives the preventive deductible, or any line on a plan whose individual deductible is 0.00, takes none. Because every Cascade plan's
    family deductible maximum is three times its individual deductible, on an account with no more than three enrolled persons the family
    limit never falls below the person's own remaining deductible, so the payment requested on a claim appeal counts only the person's own
    deductible postings. The requested normal benefit is the allowance less that deductible, times the coinsurance, rounded to the cent with
    a half cent rounded up, and the amount in dispute is rounded to the cent the same way. The payment requested on a claim appeal is never
    more than the person's remaining annual maximum for the line's benefit year, the plan's annual maximum less the person's maximum postings
    net of maximum reversals for that benefit year, with the maximum posting of the decision under appeal backed out. The amount in dispute
    is the requested payment less the plan payment of the decision under appeal, never below zero. The adjustments below are applied to the
    standard amount in this order: the waiting-period test first, then the allowance and coinsurance replacements, which give the requested
    normal benefit; then the other-carrier deduction, never taking the payment below zero; then the other-carrier ceiling; then the annual-maximum
    ceiling, which gives the requested payment; the amount in dispute is figured last from it. The amount in dispute on a claim appeal is
    fixed only after the decision under appeal no longer stands denied for the new waiting period that followed a plan change, where the person's
    earlier Cascade DHMO coverage has already served that waiting period. The months the payment requested on a claim appeal credits toward
    its waiting period follow the person's earlier coverage: when the plan credits prior coverage month for month and the person (matched
    by name and date of birth) has a terminated Cascade DHMO enrollment that ended on the day before this enrollment's coverage effective
    date (a move from the DHMO with no break in coverage), the appeal credit is the calendar months from the month that DHMO coverage took
    effect through the month it ended, both months counted (DHMO coverage always takes effect on the first of a month); when the plan credits
    prior coverage month for month, no such DHMO enrollment exists, and the enrollment shows documented prior coverage months whose prior
    coverage end date is no more than prior_coverage_max_gap_days calendar days before the coverage effective date, the appeal credit is those
    documented months; otherwise no months are credited; the months credited shorten that waiting period, never below zero; this modifies
    the amount in dispute. The allowance the payment requested on a claim appeal is figured on follows the reduction the member contests:
    for a posterior composite filling on a plan with the posterior-composite alternate benefit, or a porcelain or ceramic crown on a molar
    on a plan with the molar-crown alternate benefit, it is the lesser of the billed procedure's full allowed amount and the billed amount;
    for any other line whose billed amount is below the allowance the decision under appeal used, it is the billed amount; otherwise it is
    the allowance the decision under appeal used; this modifies the amount in dispute. The coinsurance the payment requested on a claim appeal
    is figured at follows its network status: a basic-class line from an out_of_network practice is figured at the plan's out-of-network basic
    percentage; a major-class line from an out_of_network practice is figured at the plan's out-of-network major percentage; any other line
    is figured at the plan's in-network percentage for its service class; this modifies the amount in dispute. The other-carrier adjustment
    of the payment requested on a claim appeal follows the primary payment recorded on the decision under appeal: when that payment is above
    0.00 and the plan coordinates by non-duplication, the normal benefit is reduced by it, never below zero; when it is above 0.00 and the
    plan coordinates by standard coordination of benefits, the payment is limited to the allowed amount less it; when none is recorded, no
    adjustment is made; this modifies the amount in dispute. For the payment requested on a claim appeal under this rule, and only for such
    a case, the months credited toward the waiting period follow the earlier-coverage credit stated in this rule; cases under the initial-wait
    reprocessing rule, the new-plan-wait reprocessing rule, the prior-level reprocessing rule, the grace-period reprocessing rule and the
    estimate-request rule each follow their own rule, and every other case remains under the base rule: when the plan's prior_coverage_credit_method
    is month_for_month the waiting period is shortened by prior_coverage_months, never below zero, and with none there is no credit.
  prerequisite:
  - problem: dental_ext_upgrade_denial_reprocess
    kind: value_input
    gate: d_paid
    form: state
    policy_source: >-
      The amount in dispute on a claim appeal is fixed only after the decision under appeal no longer stands denied for the new waiting period
      that followed a plan change, where the person's earlier Cascade DHMO coverage has already served that waiting period.
    condition: >-
      The latest decision on the appealed line's claim number and line number is a reprocessed (adjusted) decision, no longer the DENIED_WAITING_PERIOD
      denial.
    resolved_by: reprocess_upgrade_denial_9a74d03b
    effect: >-
      The plan payment of the decision under appeal becomes the corrected payment instead of 0.00, so the amount in dispute falls by that
      payment.
  cross_category:
  - category: dhmo
    as: history
    reads:
    - status
    - enrollee_name
    - enrollee_date_of_birth
    - coverage_effective_date
    - termination_date
    note: the appeal credit reads the person's terminated DHMO enrollment that ended the day before this coverage
  compute:
  - ap_line: >-
      LATEST('dental_appeals', 'dental_claim_line_id', date_field='decided_date', event_type='dental_appeal_decided', appeal_level='first_level',
      outcome='upheld')
  - a_claim: LATEST('dental_claim_lines', 'claim_number', date_field='adjudicated_date', dental_claim_line_id=ap_line)
  - a_lineno: LATEST('dental_claim_lines', 'line_number', date_field='adjudicated_date', dental_claim_line_id=ap_line)
  - tline: >-
      LATEST('dental_claim_lines', 'dental_claim_line_id', date_field='adjudicated_date', claim_number=a_claim, line_number=a_lineno)
  - t_class: LATEST('dental_claim_lines', 'service_class', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_dos: LATEST('dental_claim_lines', 'date_of_service', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_year: LATEST('dental_claim_lines', 'benefit_year', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_allowed: LATEST('dental_claim_lines', 'allowed_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_cat: LATEST('dental_claim_lines', 'procedure_category', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_cdt: LATEST('dental_claim_lines', 'cdt_code', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_tooth: LATEST('dental_claim_lines', 'tooth_or_area', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_billed: LATEST('dental_claim_lines', 'submitted_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_alt: LATEST('dental_claim_lines', 'alternate_allowed_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_other: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - d_paid: LATEST('dental_claim_lines', 'plan_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - alt_case: >-
      (t_cat == 'filling_composite_posterior' and P('posterior_composite_alternate_benefit')) or (t_cat == 'crown' and (',' + t_cdt + ',')
      in K('porcelain_codes') and (',' + t_tooth + ',') in K('molar_teeth') and P('molar_crown_alternate_benefit'))
  - d_used: t_alt if alt_case else t_allowed
  - wait_len: >-
      0 if (t_class == 'preventive' or F('enrollment_type') != 'late_entrant') else (P('wait_basic_months_late_entrant') if t_class == 'basic'
      else P('wait_major_months_late_entrant'))
  - ded_req: >-
      0 if ((t_class == 'preventive' and P('deductible_waived_preventive')) or P('deductible_individual') == 0) else MX(0, P('deductible_individual')
      - (SUM('dental_accumulator_postings', 'amount', event_type='dental_deductible_posting', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_deductible_reversal', benefit_year=t_year) - SUM('dental_accumulator_postings', 'amount', event_type='dental_deductible_posting',
      dental_claim_line_id=tline)))
  - room: >-
      MX(0, P('annual_maximum_per_person') - (SUM('dental_accumulator_postings', 'amount', event_type='dental_max_posting', benefit_year=t_year)
      - SUM('dental_accumulator_postings', 'amount', event_type='dental_max_reversal', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_max_posting', dental_claim_line_id=tline)))
  - ce_month: MONTHS('2000-01-01', F('coverage_effective_date'))
  - ce_first: ('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-01'
  - ce_day: DAYS(ce_first, F('coverage_effective_date')) + 1
  - pv_first: ('%d' % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-01'
  - day_before: >-
      (('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-' + ('%02d' % (ce_day - 1))) if ce_day > 1 else (('%d'
      % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-' + ('%02d' % DAYS(pv_first, ce_first)))
  - dhmo_start: >-
      CFIELD('dhmo', 'coverage_effective_date', enrollee_name=F('enrollee_name'), enrollee_date_of_birth=F('enrollee_date_of_birth'), status='terminated',
      termination_date=day_before)
  - dhmo_end: >-
      CFIELD('dhmo', 'termination_date', enrollee_name=F('enrollee_name'), enrollee_date_of_birth=F('enrollee_date_of_birth'), status='terminated',
      termination_date=day_before)
  - doc_gap: DAYS(F('prior_coverage_end_date'), F('coverage_effective_date')) if F('prior_coverage_months') > 0 else 99999
  - credit_months: >-
      (MONTHS(dhmo_start, dhmo_end) + 1) if (dhmo_start != None and P('prior_coverage_credit_method') == 'month_for_month') else (F('prior_coverage_months')
      if (doc_gap <= P('prior_coverage_max_gap_days') and P('prior_coverage_credit_method') == 'month_for_month') else 0)
  - req_billed: LATEST('dental_claim_lines', 'submitted_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - req_allow: MN(t_allowed, req_billed) if alt_case else (req_billed if req_billed < d_used else d_used)
  - rate_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - line_rate: >-
      P('coinsurance_basic_oon') if (rate_net == 'out_of_network' and t_class == 'basic') else (P('coinsurance_major_oon') if (rate_net ==
      'out_of_network' and t_class == 'major') else (P('coinsurance_preventive_in_network') if t_class == 'preventive' else (P('coinsurance_basic_in_network')
      if t_class == 'basic' else P('coinsurance_major_in_network'))))
  - cob_paid: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - cob_less: cob_paid if (cob_paid > 0 and P('cob_method') == 'non_duplication') else 0
  - cob_limit: (t_allowed - cob_paid) if (cob_paid > 0 and P('cob_method') == 'standard_cob') else t_allowed
  - result: >-
      RND(MX(0, (MN(MN(MX(0, RND((req_allow - MN(req_allow, ded_req)) * line_rate / 100, 2) - cob_less), cob_limit), room) if (MONTHS(F('tier_change_effective_date'),
      t_dos) >= MX(0, wait_len - credit_months)) else 0) - d_paid), 2)
  compute_basis:
