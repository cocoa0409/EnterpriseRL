      The adjustments below are applied to the standard amount in this order: the waiting-period and missing-tooth tests first, then the allowance
      and coinsurance replacements, which give the normal benefit; then the other-carrier deduction, never taking the payment below zero;
      then the other-carrier ceiling; then the annual-maximum ceiling, which gives the plan payment; the patient share is figured last from
