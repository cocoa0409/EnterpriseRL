- id: dental_ext_upgrade_paid_reprocess
  base_policy_refs:
  - dental_evt_claim_adjudication
  - dental_agg_family_deductible
  - dental_evt_cob
  - dental_evt_pediatric_ehb
  - dental_evt_waiting_periods
  - dental_evt_accumulators
  overwrite:
  - base_policy: dental_evt_waiting_periods
    superseded_clause: >-
      When the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months (never below
      zero); with none there is no credit.
    replaced_by: >-
      For a reprocessed prior-level line under this rule, and only for such a case, the months credited toward the waiting period follow the
      earlier-coverage credit stated in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the
      grace-period reprocessing rule, the estimate-request rule and the claim-appeal rule each follow their own rule, and every other case
      remains under the base rule: when the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months,
      never below zero, and with none there is no credit.
  - base_policy: dental_evt_claim_adjudication
    superseded_clause: >-
      The allowance is the allowed_amount for the billed procedure, replaced by the alternate_allowed_amount when an alternate benefit applies:
      a posterior composite filling when posterior_composite_alternate_benefit is true, or a porcelain or ceramic crown on a molar (a tooth
      listed in molar_teeth) when molar_crown_alternate_benefit is true; such a line is paid with remark PAID_ALTERNATE_BENEFIT.
    replaced_by: >-
      In every case, whether or not under this rule, a claim line paid on an alternate allowance carries remark PAID_ALTERNATE_BENEFIT, and
      a reprocessed decision of such a line carries the reprocessing remark ADJUSTED_REPROCESSED in its place. For a reprocessed prior-level
      line under this rule, and only for such a case, the allowance is figured as stated in this rule; cases under the initial-wait reprocessing
      rule, the new-plan-wait reprocessing rule, the grace-period reprocessing rule and the estimate-request rule each follow their own rule,
      and every other case remains under the base rule: the allowance is the allowed amount for the billed procedure, replaced by the alternate
      allowance when an alternate benefit applies (a posterior composite filling on a plan with the posterior-composite alternate benefit,
      or a porcelain or ceramic crown on a molar on a plan with the molar-crown alternate benefit), and such a line is paid with remark PAID_ALTERNATE_BENEFIT.
  - base_policy: dental_evt_claim_adjudication
    superseded_clause: >-
      For an in_network line the member owes the allowed_amount minus the plan payment and the practice may not bill more; for an out_of_network
      line the member owes the submitted_amount minus the plan payment.
    replaced_by: >-
      In every case, whether or not under this rule, the practice of an in-network line may not bill the member more than the allowed amount.
      For a reprocessed prior-level line under this rule, and only for such a case, the patient share is figured as stated in this rule; cases
      under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the grace-period reprocessing rule and the estimate-request
      rule each follow their own rule, and every other case remains under the base rule: for an in-network line the member owes the allowed
      amount minus the plan payment and the practice may not bill more, and for an out-of-network line the submitted amount minus the plan
      payment.
  trigger: state_due
  subject:
  - dental_claim_line_adjusted
  computes: member_responsibility
  target_tool: reprocess_upgrade_paid_line_3fd2b6c9
  params:
    molar_teeth: ',1,2,3,14,15,16,17,18,19,30,31,32,'
    porcelain_codes: ',D2740,D2750,D2751,D2752,D2783,'
  rule: >-
    This prior-level reprocessing rule fixes the corrected patient share when a paid basic- or major-class line, dated on or after the date
    the enrollment changed to a richer plan and within that change's new waiting period, that was paid at the coinsurance percentage of the
    plan held before, is reprocessed on the person's earlier coverage; a line paid at the current plan's percentage, a line with an appeal
    filed for it at any level (such a line is settled through the appeal), a line that a frequency or age limit would deny, a bridge, denture
    or implant replacing a tooth extracted before the coverage effective date, a line on a plan that banks rollover dollars whose payment
    would be limited by the remaining annual maximum, a line of an enrollment whose benefit period does not start on 01-01, a line of a child
    whose subscriber has two or more children enrolled on individual_exchange enrollments, and a line on an account with more than three enrolled
    persons are reprocessed under the base rules. The line under reprocessing is the enrollment's most recently decided line whose event type
    is paid and whose service class is basic or major (a reprocessed decision is never the line under reprocessing), and where several such
    lines share that latest decision date this rule is not used and each is reprocessed under the base rules. A corrected prior-level decision
    keeps the replaced decision's claim number, line number, practice, network status, procedure, service class, tooth, extraction date, dates,
    billed amount, allowed amount, alternate allowance and other-carrier payment. A corrected prior-level decision is booked to the benefit
    year its date of service falls in, the calendar year of that date, whatever benefit year the replaced decision was booked to, and the
    deductible and annual-maximum counts it uses are those of that benefit year. The payment on a reprocessed prior-level line is figured
    on the line's allowed amount. The coinsurance on a reprocessed prior-level line is the plan's in-network percentage for the line's service
    class. A reprocessed prior-level line is payable at the plan's level only when its date of service is at least its waiting period counted
    in whole calendar months from the plan change date (a month counting as whole when the day of the month of the date of service is not
    earlier than that of the plan change date, which always falls on the first of a month), where the waiting period is the one for the line's
    service class that applies to the enrollment (the plan's individual waiting period for individual and individual_exchange enrollments,
    its late-entrant waiting period for group enrollments with enrollment type late_entrant, and none for other group enrollments or for preventive
    services); until then it is figured at the coinsurance percentage recorded on the decision it replaces. The deductible taken on a reprocessed
    prior-level line is the plan's individual deductible less the person's deductible postings net of deductible reversals for the line's
    benefit year, after any posting the replaced decision made to that benefit year is backed out, never below zero and never more than the
    allowance the payment is figured on; a preventive-class line on a plan that waives the preventive deductible, or any line on a plan whose
    individual deductible is 0.00, takes none. Because every Cascade plan's family deductible maximum is three times its individual deductible,
    on an account with no more than three enrolled persons the family limit never falls below the person's own remaining deductible, so a
    reprocessed prior-level line counts only the person's own deductible postings. The normal benefit on a reprocessed prior-level line is
    the allowance less the deductible taken, times the coinsurance, rounded to the cent with a half cent rounded up, and the plan payment
    and patient share are rounded to the cent the same way. The plan payment on a reprocessed prior-level line is never more than the person's
    remaining annual maximum for the line's benefit year, the plan's annual maximum less the person's maximum postings net of maximum reversals
    for that benefit year, after any posting the replaced decision made to that benefit year is backed out; for a person receiving the pediatric
    essential-health-benefit treatment (an individual_exchange enrollment and a date of service before the person's pediatric_ehb_age_limit_years
    birthday) no annual maximum applies. The patient share on a reprocessed prior-level line is the billed amount less the plan payment for
    a line from an out_of_network practice, and the allowed amount less the plan payment otherwise, never below zero. The adjustments below
    are applied to the standard amount in this order: the waiting-period test first, which decides whether the new plan's coinsurance or the
    replaced decision's applies, then the allowance and coinsurance replacements, which give the normal benefit; then the other-carrier deduction,
    never taking the payment below zero; then the other-carrier ceiling; then the annual-maximum ceiling, which gives the plan payment; the
    patient share is figured last from the plan payment, its limit applied before its reduction and its zero floor last. The months a reprocessed
    prior-level line credits toward its waiting period follow the person's earlier coverage: when the plan credits prior coverage month for
    month and the person (matched by name and date of birth) has a terminated Cascade DHMO enrollment that ended on the day before this enrollment's
    coverage effective date (a move from the DHMO with no break in coverage), the credit is the calendar months from the month that DHMO coverage
    took effect through the month it ended, both months counted (DHMO coverage always takes effect on the first of a month); when the plan
    credits prior coverage month for month, no such DHMO enrollment exists, and the enrollment shows documented prior coverage months whose
    prior coverage end date is no more than prior_coverage_max_gap_days calendar days before the coverage effective date, the credit is those
    documented months; otherwise no months are credited; the months credited shorten that waiting period, never below zero; this modifies
    the patient share on a reprocessed prior-level line. The coinsurance a reprocessed prior-level line is figured at follows its network
    status: a basic-class line from an out_of_network practice is figured at the plan's out-of-network basic percentage; a major-class line
    from an out_of_network practice is figured at the plan's out-of-network major percentage; any other line is figured at the plan's in-network
    percentage for its service class; this modifies the patient share on a reprocessed prior-level line. The allowance a reprocessed prior-level
    line is figured on follows the billed procedure: a posterior composite filling on a plan with the posterior-composite alternate benefit,
    or a porcelain or ceramic crown (CDT D2740, D2750, D2751, D2752 or D2783) on a molar (teeth 1, 2, 3, 14, 15, 16, 17, 18, 19, 30, 31 and
    32) on a plan with the molar-crown alternate benefit, whose billed amount is not below its alternate allowance, is figured on its alternate
    allowance; any line whose billed amount is below the allowance that would otherwise apply (the alternate allowance for such a filling
    or crown, the allowed amount otherwise) is figured on its billed amount; every remaining line is figured on its allowed amount; this modifies
    the patient share on a reprocessed prior-level line. The other-carrier adjustment of a reprocessed prior-level line follows the primary
    payment recorded on the decision it replaces: when that payment is above 0.00 and the plan coordinates by non-duplication, the normal
    benefit is reduced by it, never below zero; when it is above 0.00 and the plan coordinates by standard coordination of benefits, the payment
    is limited to the allowed amount less it; when none is recorded, no adjustment is made; this modifies the patient share on a reprocessed
    prior-level line. The patient share on a reprocessed prior-level line follows the person and the other coverage: for a person receiving
    the pediatric essential-health-benefit treatment on a line from an in-network practice, the patient share is first limited to the pediatric
    out-of-pocket room (the pediatric out-of-pocket maximum for one child less the person's pediatric out-of-pocket postings net of reversals
    for the line's benefit year, after any pediatric out-of-pocket posting the replaced decision made to that benefit year is backed out)
    and then reduced by any primary payment recorded on the line, and the plan payment on such a line is the allowance less that limited share,
    so the line that crosses the pediatric out-of-pocket maximum pays the allowance minus the cost sharing still remaining and a later line
    pays the full allowance; for any other line on which a primary payment above 0.00 is recorded, the patient share is reduced by that primary
    payment; otherwise the patient share is not adjusted; the patient share is never below zero; this modifies the patient share on a reprocessed
    prior-level line. For a reprocessed prior-level line under this rule, and only for such a case, the months credited toward the waiting
    period follow the earlier-coverage credit stated in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing
    rule, the grace-period reprocessing rule, the estimate-request rule and the claim-appeal rule each follow their own rule, and every other
    case remains under the base rule: when the plan's prior_coverage_credit_method is month_for_month the waiting period is shortened by prior_coverage_months,
    never below zero, and with none there is no credit. In every case, whether or not under this rule, a claim line paid on an alternate allowance
    carries remark PAID_ALTERNATE_BENEFIT, and a reprocessed decision of such a line carries the reprocessing remark ADJUSTED_REPROCESSED
    in its place. For a reprocessed prior-level line under this rule, and only for such a case, the allowance is figured as stated in this
    rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule, the grace-period reprocessing rule and the
    estimate-request rule each follow their own rule, and every other case remains under the base rule: the allowance is the allowed amount
    for the billed procedure, replaced by the alternate allowance when an alternate benefit applies (a posterior composite filling on a plan
    with the posterior-composite alternate benefit, or a porcelain or ceramic crown on a molar on a plan with the molar-crown alternate benefit),
    and such a line is paid with remark PAID_ALTERNATE_BENEFIT. In every case, whether or not under this rule, the practice of an in-network
    line may not bill the member more than the allowed amount. For a reprocessed prior-level line under this rule, and only for such a case,
    the patient share is figured as stated in this rule; cases under the initial-wait reprocessing rule, the new-plan-wait reprocessing rule,
    the grace-period reprocessing rule and the estimate-request rule each follow their own rule, and every other case remains under the base
    rule: for an in-network line the member owes the allowed amount minus the plan payment and the practice may not bill more, and for an
    out-of-network line the submitted amount minus the plan payment.
  prerequisite: []
  cross_category:
  - category: dhmo
    as: history
    reads:
    - status
    - enrollee_name
    - enrollee_date_of_birth
    - coverage_effective_date
    - termination_date
    note: the waiting-period credit reads the person's terminated DHMO enrollment that ended the day before this coverage
  compute:
  - pb_id: >-
      LATEST('dental_claim_lines', 'dental_claim_line_id', date_field='adjudicated_date', event_type='dental_claim_line_paid', service_class='basic')
  - pm_id: >-
      LATEST('dental_claim_lines', 'dental_claim_line_id', date_field='adjudicated_date', event_type='dental_claim_line_paid', service_class='major')
  - pb_date: LATEST('dental_claim_lines', 'adjudicated_date', date_field='adjudicated_date', dental_claim_line_id=pb_id)
  - pm_date: LATEST('dental_claim_lines', 'adjudicated_date', date_field='adjudicated_date', dental_claim_line_id=pm_id)
  - tline: pb_id if (pm_id == None or (pb_id != None and pb_date >= pm_date)) else pm_id
  - t_class: LATEST('dental_claim_lines', 'service_class', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_dos: LATEST('dental_claim_lines', 'date_of_service', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_year: '''%d'' % (2000 + MONTHS(''2000-01-01'', t_dos) // 12)'
  - t_allowed: LATEST('dental_claim_lines', 'allowed_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_cat: LATEST('dental_claim_lines', 'procedure_category', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_cdt: LATEST('dental_claim_lines', 'cdt_code', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_tooth: LATEST('dental_claim_lines', 'tooth_or_area', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_billed: LATEST('dental_claim_lines', 'submitted_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_alt: LATEST('dental_claim_lines', 'alternate_allowed_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_other: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - t_pct: LATEST('dental_claim_lines', 'coinsurance_pct', date_field='adjudicated_date', dental_claim_line_id=tline)
  - ped: >-
      F('market_segment') == 'individual_exchange' and MONTHS(F('enrollee_date_of_birth'), t_dos) < 12 * P('pediatric_ehb_age_limit_years')
  - wait_from: F('tier_change_effective_date')
  - wait_len: >-
      0 if (t_class == 'preventive' or (F('market_segment') == 'group' and F('enrollment_type') != 'late_entrant')) else ((P('wait_basic_months_late_entrant')
      if t_class == 'basic' else P('wait_major_months_late_entrant')) if F('market_segment') == 'group' else (P('wait_basic_months_individual')
      if t_class == 'basic' else P('wait_major_months_individual')))
  - ded_room: >-
      0 if ((t_class == 'preventive' and P('deductible_waived_preventive')) or P('deductible_individual') == 0) else MX(0, P('deductible_individual')
      - (SUM('dental_accumulator_postings', 'amount', event_type='dental_deductible_posting', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_deductible_reversal', benefit_year=t_year) - SUM('dental_accumulator_postings', 'amount', event_type='dental_deductible_posting',
      benefit_year=t_year, dental_claim_line_id=tline)))
  - room: >-
      t_allowed if ped else MX(0, P('annual_maximum_per_person') - (SUM('dental_accumulator_postings', 'amount', event_type='dental_max_posting',
      benefit_year=t_year) - SUM('dental_accumulator_postings', 'amount', event_type='dental_max_reversal', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_max_posting', benefit_year=t_year, dental_claim_line_id=tline)))
  - oop_used: >-
      SUM('dental_accumulator_postings', 'amount', event_type='dental_ped_oop_posting', benefit_year=t_year) - SUM('dental_accumulator_postings',
      'amount', event_type='dental_ped_oop_reversal', benefit_year=t_year) - SUM('dental_accumulator_postings', 'amount', event_type='dental_ped_oop_posting',
      benefit_year=t_year, dental_claim_line_id=tline)
  - base_amt: t_billed if t_net == 'out_of_network' else t_allowed
  - ce_month: MONTHS('2000-01-01', F('coverage_effective_date'))
  - ce_first: ('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-01'
  - ce_day: DAYS(ce_first, F('coverage_effective_date')) + 1
  - pv_first: ('%d' % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-01'
  - day_before: >-
      (('%d' % (2000 + ce_month // 12)) + '-' + ('%02d' % (ce_month % 12 + 1)) + '-' + ('%02d' % (ce_day - 1))) if ce_day > 1 else (('%d'
      % (2000 + (ce_month - 1) // 12)) + '-' + ('%02d' % ((ce_month - 1) % 12 + 1)) + '-' + ('%02d' % DAYS(pv_first, ce_first)))
  - dhmo_start: >-
      CFIELD('dhmo', 'coverage_effective_date', enrollee_name=F('enrollee_name'), enrollee_date_of_birth=F('enrollee_date_of_birth'), status='terminated',
      termination_date=day_before)
  - dhmo_end: >-
      CFIELD('dhmo', 'termination_date', enrollee_name=F('enrollee_name'), enrollee_date_of_birth=F('enrollee_date_of_birth'), status='terminated',
      termination_date=day_before)
  - doc_gap: DAYS(F('prior_coverage_end_date'), F('coverage_effective_date')) if F('prior_coverage_months') > 0 else 99999
  - credit_months: >-
      (MONTHS(dhmo_start, dhmo_end) + 1) if (dhmo_start != None and P('prior_coverage_credit_method') == 'month_for_month') else (F('prior_coverage_months')
      if (doc_gap <= P('prior_coverage_max_gap_days') and P('prior_coverage_credit_method') == 'month_for_month') else 0)
  - rate_net: LATEST('dental_claim_lines', 'network_status', date_field='adjudicated_date', dental_claim_line_id=tline)
  - line_rate: >-
      P('coinsurance_basic_oon') if (rate_net == 'out_of_network' and t_class == 'basic') else (P('coinsurance_major_oon') if (rate_net ==
      'out_of_network' and t_class == 'major') else (P('coinsurance_preventive_in_network') if t_class == 'preventive' else (P('coinsurance_basic_in_network')
      if t_class == 'basic' else P('coinsurance_major_in_network'))))
  - alt_case: >-
      (t_cat == 'filling_composite_posterior' and P('posterior_composite_alternate_benefit')) or (t_cat == 'crown' and (',' + t_cdt + ',')
      in K('porcelain_codes') and (',' + t_tooth + ',') in K('molar_teeth') and P('molar_crown_alternate_benefit'))
  - allow_billed: LATEST('dental_claim_lines', 'submitted_amount', date_field='adjudicated_date', dental_claim_line_id=tline)
  - line_allow: >-
      t_alt if (alt_case and allow_billed >= t_alt) else (allow_billed if allow_billed < (t_alt if alt_case else t_allowed) else t_allowed)
  - cob_paid: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - cob_less: cob_paid if (cob_paid > 0 and P('cob_method') == 'non_duplication') else 0
  - cob_limit: (t_allowed - cob_paid) if (cob_paid > 0 and P('cob_method') == 'standard_cob') else t_allowed
  - share_paid: LATEST('dental_claim_lines', 'cob_other_paid', date_field='adjudicated_date', dental_claim_line_id=tline)
  - share_less: share_paid if ((ped and t_net != 'out_of_network') or share_paid > 0) else 0
  - share_cap: MX(0, P('pediatric_oop_max_one_child') - oop_used) if (ped and t_net != 'out_of_network') else base_amt
  - result: >-
