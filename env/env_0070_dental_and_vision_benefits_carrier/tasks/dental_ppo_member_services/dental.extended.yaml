    - table: dental_claim_lines
      aggregate: latest
      field: service_class
      filters: {}
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_max_posting
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_deductible_posting
    - table: dental_accumulator_postings
      aggregate: sum
      field: amount
      filters:
        event_type: dental_rollover_credit
    - category: dhmo
      table: dhmo_services
      aggregate: latest
      field: dhmo_plan_id
      filters:
        procedure_category: extraction
    - table: dental_claim_lines
      aggregate: latest
