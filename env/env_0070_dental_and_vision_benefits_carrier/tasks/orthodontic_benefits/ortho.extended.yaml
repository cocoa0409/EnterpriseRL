f_service', event_type='dental_claim_line_paid', cdt_code='D0150', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no))) >= 1) else (XSUM('dental', 'dental_claim_lines', 'allowed_amount', event_type='dental_claim_line_paid', cdt_code='D0150', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no), date_of_service=XLATEST('dental', 'dental_claim_lines', 'date_of_service', date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0150', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no))) if (LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no) != None and XLATEST('dental', 'dental_claim_lines', 'date_of_service', date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0150', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no)) != None) else 0)
