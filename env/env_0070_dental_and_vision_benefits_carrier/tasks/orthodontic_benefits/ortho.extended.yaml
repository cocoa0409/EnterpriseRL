        months remaining within the installment months cap counted from the month after the banding month, divided by three, rounded up, never fewer than one
    - when: otherwise
      method: the original-schedule count
    baseline:
      installment_count: original_count
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: first_period_share
