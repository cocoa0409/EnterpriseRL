extended_policies:
- id: ortho_ext_transfer_recognised_fee
  base_policy_refs:
  - ortho_evt_case_transfer
  - ortho_evt_benefit_calculation
  overwrite: []
  trigger: on_request
  subject:
  - ortho_case_transferred
  computes: allowed_case_fee
  target_tool: move_ortho_case_49ae8ecf
  params:
    aligner_start_share_pct: 40
    second_carry_pct: 90
    later_carry_pct: 80
    braces_retention_share_pct: 10
    aligner_retention_share_pct: 5
  rule: >-
    When an orthodontic case moves to a new orthodontist, Cascade fixes on the transfer entry of the case the fee it recognises for the remaining treatment, and that recognised remaining-treatment fee is what the rest of the case benefit is measured against at the new practice. The recognised remaining-treatment fee starts from the allowed case fee on the establishment entry of the case. By the standard measure the share of treatment still to come is the planned treatment months on the establishment entry less the whole calendar months from the banding date to the transfer date, divided by the planned treatment months and never below zero, a calendar month counting as whole only when the day of the month of the transfer date is on or after the day of the month of the banding date. The standard recognised remaining-treatment fee is that allowed case fee times the share of treatment still to come, rounded half up to the cent. For the recognised remaining-treatment fee, the part of the allowed case fee that the original practice earns at the start of treatment stays with that practice and is taken off the allowed case fee: for a new-start case treated with clear aligners it is the aligner start share percent of the allowed case fee, because the whole aligner series is made at the start; for a new-start case treated with fixed braces it is the rider's initial payment percentage of the allowed case fee; for a takeover case, a limited or interceptive case or any other case nothing is taken off. When Cascade has paid installments on the case, the share of treatment still to come in the recognised remaining-treatment fee is read from its own payment record instead: for a case on a monthly installment schedule with at least one installment issued and not reversed, it is the installments of the schedule not yet issued divided by the installments scheduled; for a case on a quarterly installment schedule with at least one installment issued and not reversed, it is the months after the banding month not yet covered by an issued quarter, three months for each issued installment and never below zero, divided by the months after the banding month; any other case keeps the standard calendar measure. The installments scheduled are the planned treatment months after the banding month, limited to the rider's installment months cap, divided by the length of one service period (one month on a monthly schedule, three months on a quarterly schedule) and rounded up to a whole installment; an installment counts as issued when it is an installment payment on the case that has not been reversed. Each new orthodontist repeats part of the start-up work of a case that has already moved once, so the recognised remaining-treatment fee is multiplied by a carry percentage: the later carry percent when the case's records already carry two or more transfer entries, the second carry percent when they carry exactly one transfer entry, and 100 percent when they carry none. The part of the allowed case fee that pays for the retention phase at the end of treatment is always still to come when a case moves, so in the recognised remaining-treatment fee it is kept whole and is not reduced by the share of treatment still to come: it is the braces retention share percent of the allowed case fee for a case treated with fixed braces, the aligner retention share percent of it for a case treated with clear aligners, and nothing for a limited or interceptive case or any other case. The adjustments are applied in one fixed order: every part taken off the allowed case fee and every part kept whole is first set aside from the allowed case fee, the rest is multiplied by the share of treatment still to come, every part kept whole is then added back, the sum is multiplied by every percentage that applies, and the result is rounded half up to the cent once, at the end, and is never below zero. The case is the one whose establishment entry is the latest establishment entry under the rider (when two establishment entries carry the same date, the one entered first counts as the latest), and its transfer entries and payments are those carrying its case number; a case with no establishment entry has a recognised remaining-treatment fee of zero, a case whose planned treatment months are zero has a share of treatment still to come of zero, and a case planned for a single month, or whose schedule has no installment, keeps the standard calendar measure.
  prerequisite: []
  cross_category: []
  compute:
  - case_no: LATEST('ortho_cases', 'case_number', event_type='ortho_case_established')
  - allowed_fee: LATEST('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established')
  - planned_months: LATEST('ortho_cases', 'treatment_months', event_type='ortho_case_established')
  - banding: LATEST('ortho_cases', 'banding_date', event_type='ortho_case_established')
  - elapsed_months: MONTHS(banding, NOW) if banding != None else 0
  - calendar_share: >-
      (MX(0, planned_months - elapsed_months) / planned_months) if (planned_months != None and planned_months > 0) else 0
  - start_pct: >-
      K('aligner_start_share_pct') if (LATEST('ortho_cases', 'appliance_type', event_type='ortho_case_established') == 'clear_aligners' and LATEST('ortho_cases', 'case_origin', event_type='ortho_case_established') == 'new_start') else (P('ortho_initial_payment_pct') if (LATEST('ortho_cases', 'appliance_type', event_type='ortho_case_established') == 'fixed_braces' and LATEST('ortho_cases', 'case_origin', event_type='ortho_case_established') == 'new_start') else 0)
  - period_len: 3 if P('ortho_installment_frequency') == 'quarterly' else 1
  - sched_count: >-
      -(-MN(MX(0, planned_months - 1), P('ortho_installment_months_cap')) // period_len) if planned_months != None else 0
  - issued_count: >-
      COUNT('ortho_payments', event_type='ortho_installment_payment', case_number=case_no) - (COUNT('ortho_payments', event_type='ortho_payment_reversal', case_number=case_no) - COUNT('ortho_payments', event_type='ortho_payment_reversal', case_number=case_no, installment_number=0))
  - remaining_share: >-
      ((sched_count - issued_count) / sched_count) if (period_len == 1 and issued_count >= 1 and sched_count >= 1) else ((MX(0, (planned_months - 1) - 3 * issued_count) / (planned_months - 1)) if (period_len == 3 and issued_count >= 1 and planned_months != None and planned_months > 1) else calendar_share)
  - transfer_entries: COUNT('ortho_cases', event_type='ortho_case_transferred', case_number=case_no)
  - carry_pct: >-
      K('later_carry_pct') if transfer_entries >= 2 else (K('second_carry_pct') if transfer_entries == 1 else 100)
  - ret_pct: >-
      K('braces_retention_share_pct') if LATEST('ortho_cases', 'appliance_type', event_type='ortho_case_established') == 'fixed_braces' else (K('aligner_retention_share_pct') if LATEST('ortho_cases', 'appliance_type', event_type='ortho_case_established') == 'clear_aligners' else 0)
  - result: >-
      MX(0, RND((allowed_fee * (100 - start_pct - ret_pct) / 100 * remaining_share + allowed_fee * ret_pct / 100) * carry_pct / 100, 2)) if allowed_fee != None else 0
  compute_basis:
    case_no: >-
      The recognised remaining-treatment fee starts from the allowed case fee on the establishment entry of the case.
    allowed_fee: >-
      The recognised remaining-treatment fee starts from the allowed case fee on the establishment entry of the case.
    planned_months: >-
      By the standard measure the share of treatment still to come is the planned treatment months on the establishment entry less the whole calendar months from the banding date to the transfer date, divided by the planned treatment months and never below zero, a calendar month counting as whole only when the day of the month of the transfer date is on or after the day of the month of the banding date.
    banding: >-
      By the standard measure the share of treatment still to come is the planned treatment months on the establishment entry less the whole calendar months from the banding date to the transfer date, divided by the planned treatment months and never below zero, a calendar month counting as whole only when the day of the month of the transfer date is on or after the day of the month of the banding date.
    elapsed_months: >-
      By the standard measure the share of treatment still to come is the planned treatment months on the establishment entry less the whole calendar months from the banding date to the transfer date, divided by the planned treatment months and never below zero, a calendar month counting as whole only when the day of the month of the transfer date is on or after the day of the month of the banding date.
    calendar_share: >-
      The case is the one whose establishment entry is the latest establishment entry under the rider (when two establishment entries carry the same date, the one entered first counts as the latest), and its transfer entries and payments are those carrying its case number; a case with no establishment entry has a recognised remaining-treatment fee of zero, a case whose planned treatment months are zero has a share of treatment still to come of zero, and a case planned for a single month, or whose schedule has no installment, keeps the standard calendar measure.
    start_pct: >-
      For the recognised remaining-treatment fee, the part of the allowed case fee that the original practice earns at the start of treatment stays with that practice and is taken off the allowed case fee: for a new-start case treated with clear aligners it is the aligner start share percent of the allowed case fee, because the whole aligner series is made at the start; for a new-start case treated with fixed braces it is the rider's initial payment percentage of the allowed case fee; for a takeover case, a limited or interceptive case or any other case nothing is taken off.
    period_len: >-
      The installments scheduled are the planned treatment months after the banding month, limited to the rider's installment months cap, divided by the length of one service period (one month on a monthly schedule, three months on a quarterly schedule) and rounded up to a whole installment; an installment counts as issued when it is an installment payment on the case that has not been reversed.
    sched_count: >-
      The installments scheduled are the planned treatment months after the banding month, limited to the rider's installment months cap, divided by the length of one service period (one month on a monthly schedule, three months on a quarterly schedule) and rounded up to a whole installment; an installment counts as issued when it is an installment payment on the case that has not been reversed.
    issued_count: >-
      The installments scheduled are the planned treatment months after the banding month, limited to the rider's installment months cap, divided by the length of one service period (one month on a monthly schedule, three months on a quarterly schedule) and rounded up to a whole installment; an installment counts as issued when it is an installment payment on the case that has not been reversed.
    remaining_share: >-
      When Cascade has paid installments on the case, the share of treatment still to come in the recognised remaining-treatment fee is read from its own payment record instead: for a case on a monthly installment schedule with at least one installment issued and not reversed, it is the installments of the schedule not yet issued divided by the installments scheduled; for a case on a quarterly installment schedule with at least one installment issued and not reversed, it is the months after the banding month not yet covered by an issued quarter, three months for each issued installment and never below zero, divided by the months after the banding month; any other case keeps the standard calendar measure.
    transfer_entries: >-
      Each new orthodontist repeats part of the start-up work of a case that has already moved once, so the recognised remaining-treatment fee is multiplied by a carry percentage: the later carry percent when the case's records already carry two or more transfer entries, the second carry percent when they carry exactly one transfer entry, and 100 percent when they carry none.
    carry_pct: >-
      Each new orthodontist repeats part of the start-up work of a case that has already moved once, so the recognised remaining-treatment fee is multiplied by a carry percentage: the later carry percent when the case's records already carry two or more transfer entries, the second carry percent when they carry exactly one transfer entry, and 100 percent when they carry none.
    result: >-
      The adjustments are applied in one fixed order: every part taken off the allowed case fee and every part kept whole is first set aside from the allowed case fee, the rest is multiplied by the share of treatment still to come, every part kept whole is then added back, the sum is multiplied by every percentage that applies, and the result is rounded half up to the cent once, at the end, and is never below zero.
    ret_pct: >-
      The part of the allowed case fee that pays for the retention phase at the end of treatment is always still to come when a case moves, so in the recognised remaining-treatment fee it is kept whole and is not reduced by the share of treatment still to come: it is the braces retention share percent of the allowed case fee for a case treated with fixed braces, the aligner retention share percent of it for a case treated with clear aligners, and nothing for a limited or interceptive case or any other case.
  factors:
  - id: start_share
    effect: parameter
    decides: start_pct
    bindings:
    - start_pct
    ladder:
    - when: a new-start case treated with clear aligners
      value: K('aligner_start_share_pct')
    - when: a new-start case treated with fixed braces
      value: P('ortho_initial_payment_pct')
    - when: otherwise (a takeover case, a limited or interceptive case or any other case)
      value: '0'
    baseline:
      start_pct: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: progress_measure
    effect: method
    decides: remaining_share
    bindings:
    - period_len
    - sched_count
    - issued_count
    - remaining_share
    ladder:
    - when: a monthly installment schedule AND at least one installment issued and not reversed
      method: installments of the schedule not yet issued divided by the installments scheduled
    - when: a quarterly installment schedule AND at least one installment issued and not reversed
      method: >-
        months after the banding month not yet covered by an issued quarter (three months per issued installment, never below zero) divided by the months after the banding month
    - when: otherwise
      method: >-
        the standard calendar measure: planned months less whole calendar months from banding to transfer, divided by planned months
    baseline:
      remaining_share: calendar_share
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: carry_percent
    effect: parameter
    decides: carry_pct
    bindings:
    - transfer_entries
    - carry_pct
    ladder:
    - when: the case's records already carry two or more transfer entries
      value: K('later_carry_pct')
    - when: the case's records carry exactly one transfer entry
      value: K('second_carry_pct')
    - when: otherwise (no transfer entry yet)
      value: '100'
    baseline:
      carry_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: retention_share
    effect: parameter
    decides: ret_pct
    bindings:
    - ret_pct
    ladder:
    - when: a case treated with fixed braces
      value: K('braces_retention_share_pct')
    - when: a case treated with clear aligners
      value: K('aligner_retention_share_pct')
    - when: otherwise (a limited or interceptive case or any other case)
      value: '0'
    baseline:
      ret_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The recognised remaining-treatment fee starts from the allowed case fee on the establishment entry of the case. By the standard measure the share of treatment still to come is the planned treatment months on the establishment entry less the whole calendar months from the banding date to the transfer date, divided by the planned treatment months and never below zero, a calendar month counting as whole only when the day of the month of the transfer date is on or after the day of the month of the banding date. The standard recognised remaining-treatment fee is that allowed case fee times the share of treatment still to come, rounded half up to the cent.
    params: []
