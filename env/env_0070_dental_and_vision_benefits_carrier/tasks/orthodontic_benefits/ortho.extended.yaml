events:
  - type: ortho_rider_enroll
    target: ortho_riders
    mutation: create
    meaning: A rider application or election for one person is accepted and attached to that person's dental PPO enrollment.
    grain: One row per person per continuous rider enrollment.
    fields:
      customer_id: Subscriber.
      dental_plan_id: Attached dental enrollment of the same person.
      billing_account_id: Billing account funding the rider premium.
      variant_name: Rider elected, official full name.
      enrollee_name: Covered person, copied from the dental enrollment.
      enrollee_date_of_birth: Covered person's date of birth.
      application_date: Receipt date.
      rider_effective_date: First day of rider coverage.
      prior_ortho_coverage_months: Documented prior orthodontic coverage months.
      lifetime_benefit_paid: 0.00 at opening.
    triggers: []
  - type: ortho_rider_activate
    target: ortho_riders
    mutation: {transition: {from: applied, to: active}}
    meaning: Rider coverage starts on its effective date with the attached dental enrollment active.
    grain: One row per transaction.
    fields:
      rider_effective_date: Date coverage starts.
    triggers: []
  - type: ortho_rider_withdraw
    target: ortho_riders
    mutation: {transition: {from: applied, to: cancelled}}
    meaning: The rider application is withdrawn before the effective date, by the subscriber or because the attached dental application was withdrawn or cancelled.
    grain: One row per transaction.
    fields:
      termination_date: rider_effective_date minus one day.
      termination_reason: application_withdrawn or base_plan_ended.
    triggers: []
  - type: ortho_rider_terminate
    target: ortho_riders
    mutation: {transition: {from: active, to: terminated}}
    meaning: The rider ends because the attached dental enrollment ended or was cancelled.
    grain: One row per transaction.
    fields:
      termination_date: The attached dental enrollment's termination_date.
      termination_reason: base_plan_ended.
    triggers:
      - event: ortho:ortho_case_closed
        map: {closure_reason: coverage_ended, event_date: termination_date}
  - type: ortho_rider_terminate_voluntary
    target: ortho_riders
    mutation: {transition: {from: active, to: terminated}}
    meaning: The subscriber ends the rider while keeping the dental enrollment.
    grain: One row per transaction.
    fields:
      termination_date: Last day of the month in which the request is confirmed.
      termination_reason: voluntary.
    triggers:
      - event: ortho:ortho_case_closed
        map: {closure_reason: coverage_ended, event_date: termination_date}
  - type: ortho_case_established
    target: ortho_cases
    meaning: An orthodontic case is accepted for payment under the rider (a new start at banding or a takeover of treatment already under way).
    grain: One row per case.
    distinguish_by: [case_number]
    fields:
      case_number: Case number.
      provider_agreement_id: Treating practice's agreement, if any.
      network_status: Network status on banding_date (new start) or on the event date (takeover).
      case_origin: new_start or takeover.
      appliance_type: Treatment type.
      banding_date: Appliance placement date.
      treatment_months: Planned active treatment months.
      months_remaining: Months remaining on the event date.
      total_case_fee: Orthodontist's fee.
      allowed_case_fee: Recognised fee.
      event_date: Establishment date.
      closure_reason: not_closed.
    triggers:
      - event: ortho:ortho_initial_payment
        when: {case_origin: new_start}
        map: {case_number: case_number, ortho_case_event_id: ortho_case_event_id, payment_date: event_date}
  - type: ortho_case_transferred
    target: ortho_cases
    meaning: The patient moves to a new orthodontist mid-treatment and the remaining case benefit follows to the new practice.
    grain: One row per transfer of a case.
    distinguish_by: [original_case_event_id, event_date]
    fields:
      case_number: Same case number.
      provider_agreement_id: New practice's agreement, if any.
      network_status: New practice's network status on the event date.
      case_origin: Same as at establishment.
      appliance_type: Treatment type.
      banding_date: Original banding date.
      treatment_months: Revised total planned months from banding_date.
      months_remaining: Months remaining on the transfer date.
      total_case_fee: New practice's fee for the remaining treatment.
      allowed_case_fee: Recognised fee for the remaining treatment.
      event_date: Transfer date.
      closure_reason: not_closed.
      original_case_event_id: Establishment row.
    triggers: []
  - type: ortho_case_closed
    target: ortho_cases
    meaning: The case ends because treatment was completed or discontinued, coverage ended, or the lifetime maximum was reached.
    grain: One row per closed case.
    distinguish_by: [original_case_event_id]
    fields:
      case_number: Case number.
      event_date: Closure date.
      closure_reason: completed, discontinued, coverage_ended or lifetime_maximum_reached.
      original_case_event_id: Establishment row.
    triggers: []
  - type: ortho_initial_payment
    target: ortho_payments
    meaning: The initial payment of a new_start case is issued at banding.
    grain: One row per case.
    distinguish_by: [ortho_case_event_id]
    fields:
      ortho_case_event_id: Establishment row.
      case_number: Case number.
      installment_number: 0.
      service_period: Banding month.
      payee: practice (in-network) or member.
      provider_agreement_id: Paid practice, if any.
      amount: Initial payment.
      payment_date: Issue date.
    account: ortho_lifetime_used
    direction: in
    triggers: []
  - type: ortho_installment_payment
    target: ortho_payments
    meaning: A scheduled installment of the case benefit is issued for one service period.
    grain: One row per case per service period.
    distinguish_by: [ortho_case_event_id, installment_number, service_period]
    fields:
      ortho_case_event_id: Establishment row.
      case_number: Case number.
      installment_number: Position in the schedule.
      service_period: Month or quarter covered.
      payee: practice or member.
      provider_agreement_id: Paid practice, if any.
      amount: Installment amount.
      payment_date: Issue date.
    account: ortho_lifetime_used
    direction: in
    triggers: []
  - type: ortho_payment_reversal
    target: ortho_payments
    meaning: A payment issued in error (for a service period beginning after coverage ended, a duplicate, or beyond the lifetime maximum) is reversed and recovered.
    grain: One row per reversed payment.
    distinguish_by: [original_ortho_payment_id]
    fields:
      ortho_case_event_id: Establishment row.
      case_number: Case number.
      installment_number: Installment number of the reversed payment.
      service_period: Service period of the reversed payment.
      payee: Payee of the reversed payment.
      provider_agreement_id: Practice the recovery is taken from, if any.
      amount: Amount of the reversed payment.
      payment_date: Reversal date.
      original_ortho_payment_id: Payment reversed.
    account: ortho_lifetime_used
    direction: out
    triggers: []

measures:
  - id: ortho_msr_lifetime_used_person
    window: Lifetime, across every Cascade orthodontic rider ever held by the same person (same enrollee_name and enrollee_date_of_birth).
    measure: Sum of amount of ortho_initial_payment and ortho_installment_payment minus sum of amount of ortho_payment_reversal over all those riders.
  - id: ortho_msr_case_paid
    window: Lifetime of one case (same case_number).
    measure: Sum of amount of ortho_initial_payment and ortho_installment_payment minus ortho_payment_reversal for the case.
  - id: ortho_msr_installments_paid
    window: Lifetime of one case.
    measure: Count of ortho_installment_payment rows for the case that have not been reversed.

policies:
  - id: ortho_agg_multi_holding
    subject: [ortho_rider_enroll]
    rule: >-
      A subscriber may hold one orthodontic rider for each person who has a Cascade dental PPO enrollment under the subscriber, so there is no fixed cap per subscriber.
      A person may have only one applied or active orthodontic rider at a time, and the rider must be attached to that person's own dental enrollment (same enrollee_name and enrollee_date_of_birth).
      All riders of the same subscriber on the same billing account carry the same rider plan.
    eligibility:
      - id: one_open_rider_per_person
        applies_to: [ortho_rider_enroll]
        kind: dedup
        condition: A person may have only one applied or active orthodontic rider at a time, and the rider must be attached to that person's own dental enrollment (same enrollee_name and enrollee_date_of_birth).
        evidence_fields: [ortho_riders.dental_plan_id, ortho_riders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ortho_riders.dental_plan_id]
          action_bindings:
            ortho_riders.dental_plan_id: dental_plan_id
        dedup_contract:
          table: ortho_riders
          mode: separate_record
          object_bindings: {dental_plan_id: dental_plan_id}
          duplicate_filters: {status: [applied, active]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: ortho_agg_lifetime_maximum
    subject: [ortho_initial_payment, ortho_installment_payment, ortho_payment_reversal]
    rule: >-
      The orthodontic lifetime maximum is per person and counts every orthodontic payment Cascade has made for that person under any rider, including riders that have since terminated (ortho_msr_lifetime_used_person); payments by other carriers do not count.
      The maximum that applies is the ortho_lifetime_maximum of the rider in force on the payment date; when a person moves to a rider with a higher maximum, earlier payments still count against the new maximum.
      No payment may take ortho_msr_lifetime_used_person above the applicable maximum: the payment that reaches it is reduced to the remaining amount, later installments are not paid, and the case is closed with lifetime_maximum_reached.
      A reversal restores the reversed amount to the remaining lifetime maximum.
    eligibility: []
    params:
      per_tier:
        Cascade Ortho Rider Child 1000: {lifetime_maximum: "=ortho_lifetime_maximum"}
        Cascade Ortho Rider Child 1500: {lifetime_maximum: "=ortho_lifetime_maximum"}
        Cascade Ortho Rider Child 2000: {lifetime_maximum: "=ortho_lifetime_maximum"}
        Cascade Ortho Rider Family 1500: {lifetime_maximum: "=ortho_lifetime_maximum"}
        Cascade Ortho Rider Family 2000: {lifetime_maximum: "=ortho_lifetime_maximum"}
        Cascade Ortho Rider Family 3000: {lifetime_maximum: "=ortho_lifetime_maximum"}
    formula:
      remaining_lifetime: max(0, ortho_lifetime_maximum - ortho_msr_lifetime_used_person)
      amount: min(amount, remaining_lifetime)
    measures: [ortho_msr_lifetime_used_person]

  - id: ortho_rider_eligibility
    subject: [ortho_rider_enroll]
    rule: >-
      A rider may be added only to a dental enrollment that is applied or active and whose plan is listed in the rider's entry gate base_plans, and only in a market the rider is sold in (riders flagged ortho_rider_markets_group_only are sold with group enrollments only, and a group may offer a rider only when it meets ortho_group_minimum_enrolled_lives).
      A rider may be added only on the occasions in ortho_add_occasions: together with a new dental enrollment (same effective date), or effective on the attached enrollment's next benefit-period start.
      A child-only rider (ortho_adult_eligible false) may be added only for a person who has not reached the ortho_age_limit_years birthday on the application date.
      A person who has an applied or active Cascade DHMO enrollment may not hold an orthodontic rider, because the DHMO orthodontic copay schedule applies instead.
      A person whose rider ended by voluntary termination may not add a rider again until ortho_reenrollment_lockout_months calendar months after that termination_date.
      Prior orthodontic coverage is recorded only when documented and ended no more than ortho_prior_coverage_max_gap_days before the rider effective date.
    eligibility:
      - id: base_plan_open
        applies_to: [ortho_rider_enroll]
        kind: state
        condition: A rider may be added only to a dental enrollment that is applied or active and whose plan is listed in the rider's entry gate base_plans, and only in a market the rider is sold in (riders flagged ortho_rider_markets_group_only are sold with group enrollments only, and a group may offer a rider only when it meets ortho_group_minimum_enrolled_lives).
        evidence_fields: [dental_plans.status, dental_plans.variant_name, dental_plans.market_segment, dental_plans.dental_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dental_plans.dental_plan_id]
          action_bindings:
            dental_plans.dental_plan_id: dental_plan_id
        state_contract:
          field: dental_plans.status
          allowed: [applied, active]
      - id: no_open_dhmo
        applies_to: [ortho_rider_enroll]
        kind: state
        condition: A person who has an applied or active Cascade DHMO enrollment may not hold an orthodontic rider, because the DHMO orthodontic copay schedule applies instead.
        evidence_fields: [dhmo_plans.status, dhmo_plans.enrollee_name, dhmo_plans.enrollee_date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dhmo_plans.enrollee_name, dhmo_plans.enrollee_date_of_birth]
          action_bindings:
            dhmo_plans.enrollee_name: enrollee_name
            dhmo_plans.enrollee_date_of_birth: enrollee_date_of_birth
        state_contract:
          field: dhmo_plans.status
          allowed: [terminated, cancelled]

  - id: ortho_rider_lifecycle
    subject: [ortho_rider_activate, ortho_rider_withdraw, ortho_rider_terminate, ortho_rider_terminate_voluntary]
    rule: >-
      A rider becomes active on its rider_effective_date once the attached dental enrollment is active; it never starts before the dental enrollment.
      Withdrawing a rider application and ending a rider are the subscriber's own decisions: the agent registers a rider change request and the change is carried out only after the subscriber confirms it.
      A rider withdrawal or voluntary rider termination is carried out only once the subscriber's rider change request for that rider is confirmed.
      An application may be withdrawn at any time before the rider effective date; once the rider is active it can only be terminated, and premium for months already covered is not refunded.
      A voluntary termination ends the rider on the last day of the month in which the request is confirmed, closes any open case as coverage_ended, and starts the re-enrollment lockout.
      When the attached dental enrollment is withdrawn or cancelled the applied rider is cancelled with it, and when the dental enrollment terminates or is cancelled the active rider terminates on the same termination_date; in both cases this follows automatically and needs no request.
      A reinstated dental enrollment does not reinstate a rider that ended for any reason other than the dental termination being reversed; when the dental termination for nonpayment is reversed by reinstatement, the rider is restored with it.
    eligibility:
      - id: rider_request_confirmed
        applies_to: [ortho_rider_terminate_voluntary]
        kind: state
        condition: A rider withdrawal or voluntary rider termination is carried out only once the subscriber's rider change request for that rider is confirmed.
        evidence_fields: [ortho_rider_requests.request_status, ortho_rider_requests.ortho_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ortho_rider_requests.ortho_rider_id]
          action_bindings:
            ortho_rider_requests.ortho_rider_id: ortho_rider_id
        state_contract:
          field: ortho_rider_requests.request_status
          allowed: [confirmed]

  - id: ortho_evt_case_eligibility
    subject: [ortho_case_established]
    rule: >-
      A case may be established only while the rider is active.
      A new_start case is covered only if its banding_date falls on or after the rider_effective_date plus the applicable waiting period, counted in calendar months with the last day of the month used when the target day does not exist: ortho_wait_months_individual_child or ortho_wait_months_individual_adult (by age on banding_date) for riders attached to individual-market enrollments, ortho_wait_months_group_late_entrant for group late entrants, none for other group riders; with ortho_prior_coverage_credit month_for_month the waiting period is shortened by prior_ortho_coverage_months.
      The patient must not have reached the ortho_age_limit_years birthday on the banding_date when the rider has an age limit; adult riders have none.
      Clear aligners are covered only when ortho_clear_aligners_covered is true, and limited_interceptive treatment only when ortho_limited_treatment_covered is true and its planned treatment_months do not exceed ortho_limited_treatment_max_months; a completed comprehensive case is never followed by a covered second comprehensive case when ortho_retreatment_covered is false.
      A takeover case (treatment begun before the rider effective date or under another carrier) is covered only when ortho_takeover_allowed is true and at least ortho_takeover_min_remaining_months planned months remain on the rider_effective_date; the waiting period and age limit do not apply to a takeover, but the lifetime maximum does.
      The case must be submitted within ortho_claim_filing_days calendar days after the banding_date (for a takeover, after the rider effective date).
      The network status is fixed by the treating practice's agreement in force on the banding_date for a new start and on the establishment date for a takeover (in force meaning its effective_date is on or before that date and its termination_date, if any, is on or after it): a Cascade PPO or Premier Participating Dentist Agreement in force whose specialty is orthodontist gives in_network, anything else out_of_network; on a transfer it is fixed the same way for the new practice on the transfer date.
      A case that fails any of these conditions is not established; the member is told the reason and may appeal under the dental appeal rules.
    eligibility:
      - id: rider_active_for_case
        applies_to: [ortho_case_established]
        kind: state
        condition: A case may be established only while the rider is active.
        evidence_fields: [ortho_riders.status, ortho_riders.ortho_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ortho_riders.ortho_rider_id]
          action_bindings:
            ortho_riders.ortho_rider_id: ortho_rider_id
        state_contract:
          field: ortho_riders.status
          allowed: [active]
    params:
      per_tier:
        Cascade Ortho Rider Child 1000: {age_limit: "=ortho_age_limit_years", wait_child: "=ortho_wait_months_individual_child", wait_adult: "=ortho_wait_months_individual_adult", takeover: "=ortho_takeover_allowed", aligners: "=ortho_clear_aligners_covered"}
        Cascade Ortho Rider Child 1500: {age_limit: "=ortho_age_limit_years", wait_child: "=ortho_wait_months_individual_child", wait_adult: "=ortho_wait_months_individual_adult", takeover: "=ortho_takeover_allowed", aligners: "=ortho_clear_aligners_covered"}
        Cascade Ortho Rider Child 2000: {age_limit: "=ortho_age_limit_years", wait_child: "=ortho_wait_months_individual_child", wait_adult: "=ortho_wait_months_individual_adult", takeover: "=ortho_takeover_allowed", aligners: "=ortho_clear_aligners_covered"}
        Cascade Ortho Rider Family 1500: {age_limit: "=ortho_age_limit_years", wait_child: "=ortho_wait_months_individual_child", wait_adult: "=ortho_wait_months_individual_adult", takeover: "=ortho_takeover_allowed", aligners: "=ortho_clear_aligners_covered"}
        Cascade Ortho Rider Family 2000: {age_limit: "=ortho_age_limit_years", wait_child: "=ortho_wait_months_individual_child", wait_adult: "=ortho_wait_months_individual_adult", takeover: "=ortho_takeover_allowed", aligners: "=ortho_clear_aligners_covered"}
        Cascade Ortho Rider Family 3000: {age_limit: "=ortho_age_limit_years", wait_child: "=ortho_wait_months_individual_child", wait_adult: "=ortho_wait_months_individual_adult", takeover: "=ortho_takeover_allowed", aligners: "=ortho_clear_aligners_covered"}

  - id: ortho_evt_benefit_calculation
    subject: [ortho_initial_payment, ortho_installment_payment]
    rule: >-
      The case benefit is the allowed_case_fee minus any unused ortho_lifetime_deductible, times the rider coinsurance for the case network (ortho_coinsurance_in_network or ortho_coinsurance_oon), rounded half up to the cent, and limited to the person's remaining lifetime maximum on the establishment date.
      For a takeover case the benefit so computed is prorated by months_remaining divided by treatment_months (rounded half up to the cent) and is paid in installments only, with no initial payment.
      For a new_start case the initial payment, issued at banding, is ortho_initial_payment_pct of the case benefit rounded half up to the cent; a case whose treatment_months do not exceed ortho_lump_sum_max_months is instead paid in full as the initial payment.
      The rest of the case benefit is paid in equal installments, one per service period at the ortho_installment_frequency (one month or one quarter), over the planned treatment months after the banding month limited to ortho_installment_months_cap; the number of installments is that number of months divided by the period length, rounded up; each installment is the remainder divided by the number of installments rounded half up to the cent, and the last installment absorbs the rounding difference.
      The first installment's service period begins ortho_first_installment_offset_months after the banding month (after the establishment month for a takeover), and each later one a period after the previous.
      Payments for in-network cases go to the practice and for out-of-network cases to the member.
    eligibility: []
    params:
      per_tier:
        Cascade Ortho Rider Child 1000: {coins_in: "=ortho_coinsurance_in_network", coins_oon: "=ortho_coinsurance_oon", initial_pct: "=ortho_initial_payment_pct", frequency: "=ortho_installment_frequency", months_cap: "=ortho_installment_months_cap", deductible: "=ortho_lifetime_deductible"}
        Cascade Ortho Rider Child 1500: {coins_in: "=ortho_coinsurance_in_network", coins_oon: "=ortho_coinsurance_oon", initial_pct: "=ortho_initial_payment_pct", frequency: "=ortho_installment_frequency", months_cap: "=ortho_installment_months_cap", deductible: "=ortho_lifetime_deductible"}
        Cascade Ortho Rider Child 2000: {coins_in: "=ortho_coinsurance_in_network", coins_oon: "=ortho_coinsurance_oon", initial_pct: "=ortho_initial_payment_pct", frequency: "=ortho_installment_frequency", months_cap: "=ortho_installment_months_cap", deductible: "=ortho_lifetime_deductible"}
        Cascade Ortho Rider Family 1500: {coins_in: "=ortho_coinsurance_in_network", coins_oon: "=ortho_coinsurance_oon", initial_pct: "=ortho_initial_payment_pct", frequency: "=ortho_installment_frequency", months_cap: "=ortho_installment_months_cap", deductible: "=ortho_lifetime_deductible"}
        Cascade Ortho Rider Family 2000: {coins_in: "=ortho_coinsurance_in_network", coins_oon: "=ortho_coinsurance_oon", initial_pct: "=ortho_initial_payment_pct", frequency: "=ortho_installment_frequency", months_cap: "=ortho_installment_months_cap", deductible: "=ortho_lifetime_deductible"}
        Cascade Ortho Rider Family 3000: {coins_in: "=ortho_coinsurance_in_network", coins_oon: "=ortho_coinsurance_oon", initial_pct: "=ortho_initial_payment_pct", frequency: "=ortho_installment_frequency", months_cap: "=ortho_installment_months_cap", deductible: "=ortho_lifetime_deductible"}
    formula:
      coins_pct: ortho_coinsurance_in_network if network_status == "in_network" else ortho_coinsurance_oon
      case_benefit: min(round((allowed_case_fee - ortho_lifetime_deductible) * coins_pct / 100, 2), max(0, ortho_lifetime_maximum - ortho_msr_lifetime_used_person))
      initial_payment: case_benefit if treatment_months <= ortho_lump_sum_max_months else round(case_benefit * ortho_initial_payment_pct / 100, 2)
    measures: [ortho_msr_lifetime_used_person]

  - id: ortho_evt_installments
    subject: [ortho_installment_payment]
    rule: >-
      Each installment is issued on the ortho_installment_due_day of the first month of its service period, following the schedule set at establishment (as revised by a transfer).
      An installment is payable only if the rider is active on the first day of its service period and the case has not been closed; no installment is paid for a service period beginning after the rider termination_date, and an installment that was not paid because coverage had lapsed is not paid later unless the coverage is reinstated without a gap.
      At most ortho_max_installments_per_service_period installment may be paid per case and service period, and installments stop once the case benefit has been paid in full (ortho_msr_case_paid) or the lifetime maximum is reached.
      When the treatment ends earlier than planned, remaining installments are not paid; when treatment runs longer than planned, no installment is added beyond the case benefit.
    eligibility:
      - id: one_installment_per_period
        applies_to: [ortho_installment_payment]
        kind: dedup
        condition: At most ortho_max_installments_per_service_period installment may be paid per case and service period, and installments stop once the case benefit has been paid in full (ortho_msr_case_paid) or the lifetime maximum is reached.
        evidence_fields: [ortho_payments.ortho_case_event_id, ortho_payments.service_period, ortho_payments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ortho_payments.ortho_case_event_id, ortho_payments.service_period]
          action_bindings:
            ortho_payments.ortho_case_event_id: ortho_case_event_id
            ortho_payments.service_period: service_period
        dedup_contract:
          table: ortho_payments
          mode: separate_record
          object_bindings: {ortho_case_event_id: ortho_case_event_id, service_period: service_period}
          duplicate_filters: {event_type: [ortho_installment_payment]}
          distinct_fields: []
    measures: [ortho_msr_case_paid, ortho_msr_installments_paid]

  - id: ortho_evt_case_transfer
    subject: [ortho_case_transferred]
    rule: >-
      When the patient changes orthodontist during active treatment and ortho_case_transfer_allowed is true, the case continues under the same case number: the unpaid part of the case benefit (case benefit minus ortho_msr_case_paid) is re-spread over the installments still due, paid to the new practice when it is in network and to the member otherwise.
      The case benefit itself is not recomputed upward for a higher fee charged by the new practice, and no separate benefit is paid for a transfer or records fee when ortho_transfer_reestablish_fee_covered is false; when the new practice's allowed fee for the remaining treatment is lower than the unpaid benefit divided by the rider coinsurance, the unpaid benefit is reduced to the coinsurance share of that lower fee.
      A transfer may be recorded only for a case that has not been closed, and only while the rider is active.
    eligibility:
      - id: transfer_rider_active
        applies_to: [ortho_case_transferred]
        kind: state
        condition: A transfer may be recorded only for a case that has not been closed, and only while the rider is active.
        evidence_fields: [ortho_riders.status, ortho_riders.ortho_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ortho_riders.ortho_rider_id]
          action_bindings:
            ortho_riders.ortho_rider_id: ortho_rider_id
        state_contract:
          field: ortho_riders.status
          allowed: [active]
    measures: [ortho_msr_case_paid]

  - id: ortho_evt_case_closure
    subject: [ortho_case_closed]
    rule: >-
      A case is closed as completed when the orthodontist reports appliance removal at the end of treatment, as discontinued when treatment stops early, as coverage_ended when the rider terminates, and as lifetime_maximum_reached when the person's lifetime maximum is exhausted.
      After closure no further installment is paid; payments already made for service periods that began while covered are not recovered when ortho_discontinued_recovery is false.
      A case closed as coverage_ended continues if, and only if, the rider is restored without a gap by a dental reinstatement, in which case the closure is superseded by a new establishment row with case_origin takeover for the remaining months.
    eligibility: []

  - id: ortho_evt_payment_reversal
    subject: [ortho_payment_reversal]
    rule: >-
      A payment is reversed when it was issued for a service period beginning after the rider termination_date, when it duplicates a payment for the same case and service period, or when it took lifetime benefits above the maximum; it is reversed for its full amount, or, for the last case, for the excess only.
      A reversal is made no later than ortho_recovery_lookback_days calendar days after the payment_date of the payment being reversed; a payment older than that stays paid.
      A reversal references the payment it reverses, recovers the amount from the payee (offset against future payments to a practice, or billed to the member), and each payment can be reversed once.
    eligibility:
      - id: recovery_lookback
        applies_to: [ortho_payment_reversal]
        kind: time
