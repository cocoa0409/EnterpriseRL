category: ortho
display_name: Orthodontic Benefit Riders

binding:
  holding_table: ortho_riders
  event_tables: [ortho_cases, ortho_payments]
  intake_tables: [ortho_rider_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {lifetime_benefit_paid: ortho_lifetime_used}

lifecycle:
  states: [applied, active, terminated, cancelled]
  transitions:
    - {from: applied, to: active, by: system, means: "The rider starts on its effective date once the attached dental enrollment is active."}
    - {from: applied, to: cancelled, by: user, means: "The subscriber withdraws the rider application before the effective date (also follows a withdrawal or binder cancellation of the attached dental application)."}
    - {from: active, to: terminated, by: system, means: "The rider ends because the attached dental enrollment ended or was cancelled."}
    - {from: active, to: terminated, by: user, means: "The subscriber ends the rider; it ends on the last day of the month in which the request is confirmed."}

accounts:
  - key: ortho_lifetime_used
    unit: USD
    meaning: Orthodontic benefit paid for the person under the rider, counted against the lifetime orthodontic maximum.

parameter_schema:
  ortho_lifetime_maximum: "USD per person, lifetime; the most Cascade pays for that person's orthodontic treatment across every Cascade orthodontic rider ever held"
  ortho_coinsurance_in_network: "integer percent of the allowed case fee the rider pays when the treating practice is participating"
  ortho_coinsurance_oon: "integer percent of the out-of-network allowed case fee the rider pays"
  ortho_oon_allowance_basis: "enum string; Cascade usual-and-customary percentile used as allowed_case_fee for a non-participating practice"
  ortho_lifetime_deductible: "USD per person, lifetime; taken once from the allowed case fee of the first case before coinsurance; 0.00 = none"
  ortho_age_limit_years: "age in years; appliances must be placed (banding_date) before the patient reaches this birthday; 0 = no age limit (adults covered)"
  ortho_adult_eligible: "boolean; true = persons aged 19 and over may be covered"
  ortho_wait_months_individual_child: "calendar months from rider_effective_date before banding is covered, individual market, patient under 19 at banding"
  ortho_wait_months_individual_adult: "calendar months from rider_effective_date before banding is covered, individual market, patient 19 or over at banding; 0 when adults are not eligible"
  ortho_wait_months_group_late_entrant: "calendar months from rider_effective_date before banding is covered for a group late entrant; group riders elected at open enrollment, as a new hire or by special enrollment have none"
  ortho_prior_coverage_credit: "enum string; none or month_for_month (each documented month of prior orthodontic coverage shortens the waiting period by one month)"
  ortho_prior_coverage_max_gap_days: "calendar days; prior orthodontic coverage earns credit only if it ended no more than this many days before rider_effective_date"
  ortho_initial_payment_pct: "integer percent of the case benefit paid as the initial payment on a new_start case at banding"
  ortho_installment_frequency: "enum string; monthly or quarterly installments after the initial payment"
  ortho_installment_months_cap: "months; installments are spread over the planned treatment months after the banding month, but never over more than this many months"
  ortho_clear_aligners_covered: "boolean; true = comprehensive clear-aligner treatment is covered on the same terms as fixed braces"
  ortho_limited_treatment_covered: "boolean; true = limited or interceptive (phase I) treatment is covered and counts toward the lifetime maximum"
  ortho_retention_included: "boolean; true = retainers and retention visits are part of the case fee and get no separate benefit"
  ortho_takeover_allowed: "boolean; true = treatment begun before the rider (or under another carrier) is covered for its remaining months"
  ortho_takeover_min_remaining_months: "months; a takeover case is accepted only if at least this many planned months of active treatment remain on the rider_effective_date; 0 when takeover is not allowed"
  ortho_case_transfer_allowed: "boolean; true = the remaining benefit follows the patient to a new orthodontist"
  ortho_payments_require_active_rider: "boolean; true = each installment is payable only if the rider is active on the first day of its service period"
  ortho_retreatment_covered: "boolean; false = a second course of comprehensive treatment after a completed case is not covered"
  ortho_records_toward_max: "boolean; true = pre-orthodontic records and diagnostic casts are paid inside the case benefit, not separately"
  ortho_monthly_premium_per_enrollee: "USD per covered person per month, individual-market rider rate (group rates per group contract)"
  ortho_dhmo_exclusive: "boolean; true = the rider cannot be held by a person who has an applied or active Cascade DHMO enrollment, whose orthodontic copay schedule applies instead"
  ortho_add_occasions: "enum string; occasions on which a rider may be added: with_dental_enrollment_or_benefit_period_start = only together with a new dental enrollment or effective on the attached enrollment's benefit-period start"
  ortho_reenrollment_lockout_months: "calendar months after a voluntary rider termination_date during which the same person may not add a rider again"
  ortho_first_installment_offset_months: "months after the banding month (new start) or after the establishment month (takeover) in which the first installment's service period begins"
  ortho_claim_filing_days: "calendar days after banding_date within which the case must be submitted to be established"
  ortho_installment_payee_in_network: "enum string; payee of in-network payments"
  ortho_installment_payee_oon: "enum string; payee of out-of-network payments (the practice only with an assignment of benefits on file)"
  ortho_installment_rounding: "enum string; installment amounts are rounded half up to the cent and the last installment absorbs the rounding remainder"
  ortho_age_basis: "enum string; date on which the patient's age is measured for the age limit"
  ortho_discontinued_recovery: "boolean; false = when treatment is discontinued early, payments already made for service periods that began while covered are not recovered"
  ortho_recovery_lookback_days: "calendar days after payment_date within which a payment made for a service period beginning after the rider termination_date is reversed and recovered"
  ortho_transfer_reestablish_fee_covered: "boolean; false = a new orthodontist's transfer or records fee gets no additional benefit beyond the remaining case benefit"
  ortho_installment_due_day: "day of month on which each installment is issued for its service period"
  ortho_estimate_recommended: "boolean; true = a pre-treatment estimate of the case is recommended before banding"
  ortho_takeover_basis: "enum string; how a takeover case benefit is computed: none, or remaining_months_prorated (case benefit times months_remaining divided by treatment_months, paid as installments only)"
  ortho_limited_treatment_max_months: "months; the most planned months for a limited/interceptive case to be paid as such; 0 when limited treatment is not covered"
  ortho_waiting_period_basis: "enum string; event compared with the waiting period end"
  ortho_dependent_age_end: "age in years at which a child's rider ends with the attached dental enrollment"
  ortho_benefit_basis: "enum string; case benefit equals the coinsurance share of the allowed case fee after deductible, limited to the remaining lifetime maximum"
  ortho_max_installments_per_service_period: "count; at most this many installments may be paid for one case and one service period"
  ortho_voluntary_termination_timing: "enum string; when a confirmed voluntary rider termination takes effect"
  ortho_rider_markets_group_only: "boolean; true = the rider is sold only with group dental enrollments"
  ortho_group_minimum_enrolled_lives: "count; a group may offer the rider only if at least this many employees are enrolled in its dental plan"
  ortho_lump_sum_max_months: "months; a new_start case whose planned treatment_months are at most this value is paid as one payment at banding (the initial payment equals the whole case benefit) with no installments"

