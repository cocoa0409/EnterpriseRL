        months before the month of the latest move at the new-start network's coinsurance and the rest at the latest transfer network's, weighted over the months remaining
    - when: >-
        rider coinsurances differ AND a superseding takeover not moved by its date AND its network differs from the new-start entry's
      method: the coinsurance for the new-start entry's network
    - when: otherwise
      method: the coinsurance for the takeover entry's network
    baseline:
      net_coins: (P('ortho_coinsurance_in_network') if est_network == 'in_network' else P('ortho_coinsurance_oon'))
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
