    evidence:
    - history
    cross_difficulty: null
  - id: takeover_installment_count
    effect: method
    decides: installment_count
    bindings:
    - installment_count
    ladder:
    - when: no more than the lump-sum months remaining on the takeover entry
      method: a single payment
    - when: a quarterly schedule AND more than the lump-sum months remaining
