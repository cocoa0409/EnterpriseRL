- id: ortho_ext_carried_first_payment
  base_policy_refs:
  - ortho_evt_case_transfer
  - ortho_evt_benefit_calculation
  - ortho_evt_installments
  - ortho_agg_lifetime_maximum
  overwrite:
  - base_policy: ortho_evt_case_transfer
    superseded_clause: >-
      When the patient changes orthodontist during active treatment and ortho_case_transfer_allowed is true, the case continues under the same case number: the unpaid part of the case benefit (case benefit minus ortho_msr_case_paid) is re-spread over the installments still due, paid to the new practice when it is in network and to the member otherwise.
    replaced_by: >-
      When the patient changes orthodontist during active treatment the case continues under the same case number and the unpaid part of the case benefit is re-spread over the payments still to come at the new practice; this rule fixes the first payment Cascade issues on the case after it has moved, each later payment of a moved case is the same share of the carried benefit as the first payment covers for one service period, every payment of a moved case goes to the new practice when it is in network and to the member otherwise, and every installment of a case that has not moved remains under the installment rules of the rider; this rule applies only to a person whose current rider is the only Cascade orthodontic rider the person has held, and for any other person the unpaid part of the case benefit (the case benefit less the payments made on the case) is re-spread over the installments still due, paid to the new practice when it is in network and to the member otherwise.
  - base_policy: ortho_evt_installments
    superseded_clause: >-
      Each installment is issued on the ortho_installment_due_day of the first month of its service period, following the schedule set at establishment (as revised by a transfer).
    replaced_by: >-
      Each installment is issued on the rider's installment due day of the first month of its service period, following the schedule set at establishment as revised by a transfer, except that once a paid dental claim line shows the patient at an orthodontist whose participation agreement is not the one named on the case's latest establishment or transfer entry, the installments whose service periods begin after that line was adjudicated are held and are paid only through the first carried payment once the case's transfer to that orthodontist is recorded.
  trigger: on_request
  subject:
  - ortho_installment_payment
  computes: amount
  target_tool: issue_ortho_carried_payment_56eb10f4
  params:
    braces_reserve_pct: 10
    aligner_reserve_pct: 5
    records_window_months: 6
  rule: >-
    When the patient changes orthodontist during active treatment the case continues under the same case number and the unpaid part of the case benefit is re-spread over the payments still to come at the new practice; this rule fixes the first payment Cascade issues on the case after it has moved, each later payment of a moved case is the same share of the carried benefit as the first payment covers for one service period, every payment of a moved case goes to the new practice when it is in network and to the member otherwise, and every installment of a case that has not moved remains under the installment rules of the rider; this rule applies only to a person whose current rider is the only Cascade orthodontic rider the person has held, and for any other person the unpaid part of the case benefit (the case benefit less the payments made on the case) is re-spread over the installments still due, paid to the new practice when it is in network and to the member otherwise. Each installment is issued on the rider's installment due day of the first month of its service period, following the schedule set at establishment as revised by a transfer, except that once a paid dental claim line shows the patient at an orthodontist whose participation agreement is not the one named on the case's latest establishment or transfer entry, the installments whose service periods begin after that line was adjudicated are held and are paid only through the first carried payment once the case's transfer to that orthodontist is recorded. The first carried payment is fixed only after the case's records carry a transfer entry dated on or after the patient's first visit at the orthodontist now treating the patient. By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases. The part of the deductible not yet used is the whole deductible when every establishment entry under the rider carries the case's case number, the deductible less the allowed case fees on the establishment entries of the other cases when those add up to less than the deductible, and nothing otherwise. The unpaid case benefit is that case benefit less every initial and installment payment on the case net of reversals, rounded half up to the cent and never below zero. The carried benefit is the unpaid case benefit, except that when the recognised remaining-treatment fee on the latest transfer entry is lower than the unpaid case benefit divided by the rider coinsurance for that entry's network status, the carried benefit is the coinsurance share of that fee, rounded half up to the cent; with no transfer entry on the case the carried benefit is the unpaid case benefit. The installments left on the original schedule are the planned treatment months after the banding month, limited to the rider's installment months cap and divided by the service-period length (one month, or three on a quarterly schedule) rounded up, less the installment payments on the case that have not been reversed, and never fewer than one. By the standard method the carried benefit is spread evenly over the installments left on the original schedule, and the first carried payment covers one service period and is one such share, rounded half up to the cent. For the first carried payment, the unpaid case benefit follows the network of the practice now treating the patient as fixed on the latest transfer entry, because the coinsurance for the remaining treatment follows the practice that renders it: on a rider whose in-network and out-of-network coinsurance differ, when the latest establishment entry is out of network and the latest transfer entry is in network, the unpaid case benefit is multiplied by the rider's in-network coinsurance divided by its out-of-network coinsurance, and when the latest establishment entry is in network and the latest transfer entry is out of network, it is multiplied by the out-of-network coinsurance divided by the in-network coinsurance; otherwise it is not changed; the fee recognised for the case is not recomputed. Orthodontic records are paid inside the case benefit, so records that the orthodontist now treating the patient took and that were paid under the patient's own dental enrollment are not paid a second time in the first carried payment: the records lines are the paid lines of that enrollment billed under the participation agreement named on the latest transfer entry with dates of service fewer than the records window months whole calendar months before today; when they include a comprehensive oral evaluation line (code D0150) and a panoramic image line (code D0330), the plan payments of all such lines come off the carried benefit; when they include such a panoramic line but no such evaluation line, the plan payments of the panoramic lines come off; otherwise, and always when the latest transfer entry names no agreement, nothing comes off. For the first carried payment a retention reserve is held back from the carried benefit and paid with the final payment of the case once appliance removal is reported: the braces reserve percent for a case treated with fixed braces, the aligner reserve percent for a case treated with clear aligners, and none for a limited or interceptive case or any other case. For the first carried payment, the number of payments the carried benefit is spread over follows the months remaining on the latest transfer entry, and no payment is added for treatment that runs longer than the original schedule: with no more than the lump-sum months remaining, a single payment; on a quarterly schedule with more months remaining, the months remaining divided by three and rounded up when that is fewer than the installments left on the original schedule; on a monthly schedule with more months remaining, the months remaining when that is fewer than the installments left; otherwise the installments left on the original schedule. For the first carried payment, service periods that have already begun since the latest installment issued on the case are paid at once: on a monthly schedule with two or more such periods, the first carried payment covers the whole calendar months from the first day of the latest installment's service period to today; on a quarterly schedule with two or more such periods, it covers those whole months divided by three and rounded down; otherwise it covers one service period; it never covers more periods than the payments the carried benefit is spread over. The first carried payment is assembled in one fixed order: every ratio that applies to the unpaid case benefit is applied first and the product is rounded half up to the cent and limited to the rider's lifetime maximum less every payment, net of reversals, made under the rider; the carried benefit then follows from that amount; every amount taken off the carried benefit comes off next, never below zero; every percentage held back comes off the rest; the remainder is divided by the number of payments it is spread over and rounded half up to the cent; and that share times the service periods the first carried payment covers is rounded half up to the cent to give the payment. The first carried payment takes the installment position that follows the installments issued and not reversed on the case, carries as its service period the one that starts one service period (one month, or three on a quarterly schedule) after the service period of the latest installment issued on the case, and is paid to the member when the latest transfer entry is out of network and to the practice named on that entry when it is in network. The case is the one whose establishment entry is the latest establishment entry under the rider, its payments and transfer entries are those carrying its case number, and the latest transfer entry is the one with the latest date; when two entries of one kind carry the same date, the one entered first counts as the latest, and a case with no installment payment counts the whole calendar months from the banding date itself, not from the first day of the banding month. A rider with no establishment entry has no case to carry, and its first carried payment is zero.
  prerequisite:
  - problem: ortho_ext_transfer_recognised_fee
    kind: value_input
    gate: tr_fee
    form: state
    policy_source: >-
      The first carried payment is fixed only after the case's records carry a transfer entry dated on or after the patient's first visit at the orthodontist now treating the patient.
    condition: >-
      The latest ortho_cases row with event_type ortho_case_transferred for the case has an event_date on or after the first date of service the patient has at the practice now treating them, so its network_status, months_remaining and allowed_case_fee describe that practice.
    resolved_by: move_ortho_case_49ae8ecf
    effect: >-
      The transfer entry written for the new orthodontist becomes the latest transfer entry: tr_fee, tr_network and tr_left take its recognised remaining-treatment fee, network status and months remaining, which enter the carried benefit and the payment spread.
  cross_category:
  - category: dental
    as: history
    reads:
    - dental_claim_lines.cdt_code
    - dental_claim_lines.plan_paid
    - dental_claim_lines.date_of_service
    - dental_claim_lines.provider_agreement_id
    - dental_claim_lines.event_type
    note: >-
      The records factor reads the paid D0150/D0330 lines of the patient's own dental enrollment billed under the agreement named on the latest transfer entry within the records window; the hold sentence reads the same lines.
  compute:
  - case_no: LATEST('ortho_cases', 'case_number', event_type='ortho_case_established')
  - allowed_fee: LATEST('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established')
  - planned_months: LATEST('ortho_cases', 'treatment_months', event_type='ortho_case_established')
  - est_network: LATEST('ortho_cases', 'network_status', event_type='ortho_case_established')
  - case_paid: >-
      SUM('ortho_payments', 'amount', event_type='ortho_initial_payment', case_number=case_no) + SUM('ortho_payments', 'amount', event_type='ortho_installment_payment', case_number=case_no) - SUM('ortho_payments', 'amount', event_type='ortho_payment_reversal', case_number=case_no)
  - rider_paid: >-
      SUM('ortho_payments', 'amount', event_type='ortho_initial_payment') + SUM('ortho_payments', 'amount', event_type='ortho_installment_payment') - SUM('ortho_payments', 'amount', event_type='ortho_payment_reversal')
  - tr_network: LATEST('ortho_cases', 'network_status', event_type='ortho_case_transferred', case_number=case_no)
  - tr_fee: LATEST('ortho_cases', 'allowed_case_fee', event_type='ortho_case_transferred', case_number=case_no)
  - tr_left: LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_transferred', case_number=case_no)
  - ded_amount: >-
      P('ortho_lifetime_deductible') if COUNT('ortho_cases', event_type='ortho_case_established') == COUNT('ortho_cases', event_type='ortho_case_established', case_number=case_no) else (MX(0, P('ortho_lifetime_deductible') - (SUM('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established') - SUM('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established', case_number=case_no))) if (COUNT('ortho_cases', event_type='ortho_case_established') > COUNT('ortho_cases', event_type='ortho_case_established', case_number=case_no) and SUM('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established') - SUM('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established', case_number=case_no) < P('ortho_lifetime_deductible')) else 0)
  - est_remaining: LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established')
  - est_origin: LATEST('ortho_cases', 'case_origin', event_type='ortho_case_established')
  - case_entries: COUNT('ortho_cases', event_type='ortho_case_established', case_number=case_no)
  - case_benefit: >-
      MN(RND(RND((P('ortho_coinsurance_in_network') if est_network == 'in_network' else P('ortho_coinsurance_oon')) * MX(0, allowed_fee - ded_amount) / 100, 2) * ((est_remaining / planned_months) if (est_origin == 'takeover' and case_entries == 1 and planned_months != None and planned_months > 0 and est_remaining != None) else 1), 2), MX(0, P('ortho_lifetime_maximum') - (rider_paid - case_paid))) if allowed_fee != None else 0
  - unpaid: MX(0, RND(case_benefit - case_paid, 2))
  - net_ratio: >-
      (P('ortho_coinsurance_in_network') / P('ortho_coinsurance_oon')) if (P('ortho_coinsurance_in_network') != P('ortho_coinsurance_oon') and LATEST('ortho_cases', 'network_status', event_type='ortho_case_established') == 'out_of_network' and LATEST('ortho_cases', 'network_status', event_type='ortho_case_transferred', case_number=case_no) == 'in_network') else ((P('ortho_coinsurance_oon') / P('ortho_coinsurance_in_network')) if (P('ortho_coinsurance_in_network') != P('ortho_coinsurance_oon') and LATEST('ortho_cases', 'network_status', event_type='ortho_case_established') == 'in_network' and LATEST('ortho_cases', 'network_status', event_type='ortho_case_transferred', case_number=case_no) == 'out_of_network') else 1)
  - reserve_pct: >-
      K('braces_reserve_pct') if LATEST('ortho_cases', 'appliance_type', event_type='ortho_case_established') == 'fixed_braces' else (K('aligner_reserve_pct') if LATEST('ortho_cases', 'appliance_type', event_type='ortho_case_established') == 'clear_aligners' else 0)
  - period_len: 3 if P('ortho_installment_frequency') == 'quarterly' else 1
  - left_original: >-
      (MX(1, -(-MN(MX(0, planned_months - 1), P('ortho_installment_months_cap')) // period_len) - (COUNT('ortho_payments', event_type='ortho_installment_payment', case_number=case_no) - (COUNT('ortho_payments', event_type='ortho_payment_reversal', case_number=case_no) - COUNT('ortho_payments', event_type='ortho_payment_reversal', case_number=case_no, installment_number=0))))) if planned_months != None else 1
  - payment_count: >-
      1 if (tr_left != None and tr_left <= P('ortho_lump_sum_max_months')) else ((-(-tr_left // 3)) if (tr_left != None and period_len == 3 and -(-tr_left // 3) < left_original) else (tr_left if (tr_left != None and period_len == 1 and tr_left < left_original) else left_original))
  - since_months: >-
      MONTHS(LATEST('ortho_payments', 'service_period', date_field='payment_date', event_type='ortho_installment_payment', case_number=case_no) + '-01', NOW) if COUNT('ortho_payments', event_type='ortho_installment_payment', case_number=case_no) >= 1 else (MONTHS(LATEST('ortho_cases', 'banding_date', event_type='ortho_case_established'), NOW) if LATEST('ortho_cases', 'banding_date', event_type='ortho_case_established') != None else 0)
  - catch_periods: >-
      since_months if (period_len == 1 and since_months >= 2) else ((since_months // 3) if (period_len == 3 and since_months // 3 >= 2) else 1)
  - records_paid: >-
      (XSUM('dental', 'dental_claim_lines', 'plan_paid', within_months=K('records_window_months'), date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0150', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no)) + XSUM('dental', 'dental_claim_lines', 'plan_paid', within_months=K('records_window_months'), date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0330', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no))) if (LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no) != None and XCOUNT('dental', 'dental_claim_lines', within_months=K('records_window_months'), date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0150', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no)) >= 1 and XCOUNT('dental', 'dental_claim_lines', within_months=K('records_window_months'), date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0330', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no)) >= 1) else (XSUM('dental', 'dental_claim_lines', 'plan_paid', within_months=K('records_window_months'), date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0330', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no)) if (LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no) != None and XCOUNT('dental', 'dental_claim_lines', within_months=K('records_window_months'), date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0330', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no)) >= 1 and XCOUNT('dental', 'dental_claim_lines', within_months=K('records_window_months'), date_field='date_of_service', event_type='dental_claim_line_paid', cdt_code='D0150', dental_plan_id=F('dental_plan_id'), provider_agreement_id=LATEST('ortho_cases', 'provider_agreement_id', event_type='ortho_case_transferred', case_number=case_no)) == 0) else 0)
  - result: >-
      RND(RND(MX(0, (MN(MN(RND(unpaid * net_ratio, 2), MX(0, P('ortho_lifetime_maximum') - rider_paid)), RND((P('ortho_coinsurance_in_network') if tr_network == 'in_network' else P('ortho_coinsurance_oon')) * tr_fee / 100, 2)) if tr_fee != None else MN(RND(unpaid * net_ratio, 2), MX(0, P('ortho_lifetime_maximum') - rider_paid))) - records_paid) * (100 - reserve_pct) / 100 / payment_count, 2) * MN(catch_periods, payment_count), 2) if allowed_fee != None else 0
  compute_basis:
    case_no: >-
      The case is the one whose establishment entry is the latest establishment entry under the rider, its payments and transfer entries are those carrying its case number, and the latest transfer entry is the one with the latest date; when two entries of one kind carry the same date, the one entered first counts as the latest, and a case with no installment payment counts the whole calendar months from the banding date itself, not from the first day of the banding month.
    allowed_fee: >-
      By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    planned_months: >-
      The installments left on the original schedule are the planned treatment months after the banding month, limited to the rider's installment months cap and divided by the service-period length (one month, or three on a quarterly schedule) rounded up, less the installment payments on the case that have not been reversed, and never fewer than one.
    est_network: >-
      By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    case_paid: >-
      The unpaid case benefit is that case benefit less every initial and installment payment on the case net of reversals, rounded half up to the cent and never below zero.
    rider_paid: >-
      By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    tr_network: >-
      The carried benefit is the unpaid case benefit, except that when the recognised remaining-treatment fee on the latest transfer entry is lower than the unpaid case benefit divided by the rider coinsurance for that entry's network status, the carried benefit is the coinsurance share of that fee, rounded half up to the cent; with no transfer entry on the case the carried benefit is the unpaid case benefit.
    tr_fee: >-
      The carried benefit is the unpaid case benefit, except that when the recognised remaining-treatment fee on the latest transfer entry is lower than the unpaid case benefit divided by the rider coinsurance for that entry's network status, the carried benefit is the coinsurance share of that fee, rounded half up to the cent; with no transfer entry on the case the carried benefit is the unpaid case benefit.
    tr_left: >-
      For the first carried payment, the number of payments the carried benefit is spread over follows the months remaining on the latest transfer entry, and no payment is added for treatment that runs longer than the original schedule: with no more than the lump-sum months remaining, a single payment; on a quarterly schedule with more months remaining, the months remaining divided by three and rounded up when that is fewer than the installments left on the original schedule; on a monthly schedule with more months remaining, the months remaining when that is fewer than the installments left; otherwise the installments left on the original schedule.
    ded_amount: >-
      The part of the deductible not yet used is the whole deductible when every establishment entry under the rider carries the case's case number, the deductible less the allowed case fees on the establishment entries of the other cases when those add up to less than the deductible, and nothing otherwise.
    case_benefit: >-
      By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    unpaid: >-
      The unpaid case benefit is that case benefit less every initial and installment payment on the case net of reversals, rounded half up to the cent and never below zero.
    net_ratio: >-
      For the first carried payment, the unpaid case benefit follows the network of the practice now treating the patient as fixed on the latest transfer entry, because the coinsurance for the remaining treatment follows the practice that renders it: on a rider whose in-network and out-of-network coinsurance differ, when the latest establishment entry is out of network and the latest transfer entry is in network, the unpaid case benefit is multiplied by the rider's in-network coinsurance divided by its out-of-network coinsurance, and when the latest establishment entry is in network and the latest transfer entry is out of network, it is multiplied by the out-of-network coinsurance divided by the in-network coinsurance; otherwise it is not changed; the fee recognised for the case is not recomputed.
    reserve_pct: >-
      For the first carried payment a retention reserve is held back from the carried benefit and paid with the final payment of the case once appliance removal is reported: the braces reserve percent for a case treated with fixed braces, the aligner reserve percent for a case treated with clear aligners, and none for a limited or interceptive case or any other case.
    period_len: >-
      The installments left on the original schedule are the planned treatment months after the banding month, limited to the rider's installment months cap and divided by the service-period length (one month, or three on a quarterly schedule) rounded up, less the installment payments on the case that have not been reversed, and never fewer than one.
    left_original: >-
      The installments left on the original schedule are the planned treatment months after the banding month, limited to the rider's installment months cap and divided by the service-period length (one month, or three on a quarterly schedule) rounded up, less the installment payments on the case that have not been reversed, and never fewer than one.
    payment_count: >-
      For the first carried payment, the number of payments the carried benefit is spread over follows the months remaining on the latest transfer entry, and no payment is added for treatment that runs longer than the original schedule: with no more than the lump-sum months remaining, a single payment; on a quarterly schedule with more months remaining, the months remaining divided by three and rounded up when that is fewer than the installments left on the original schedule; on a monthly schedule with more months remaining, the months remaining when that is fewer than the installments left; otherwise the installments left on the original schedule.
    since_months: >-
      For the first carried payment, service periods that have already begun since the latest installment issued on the case are paid at once: on a monthly schedule with two or more such periods, the first carried payment covers the whole calendar months from the first day of the latest installment's service period to today; on a quarterly schedule with two or more such periods, it covers those whole months divided by three and rounded down; otherwise it covers one service period; it never covers more periods than the payments the carried benefit is spread over.
    catch_periods: >-
      For the first carried payment, service periods that have already begun since the latest installment issued on the case are paid at once: on a monthly schedule with two or more such periods, the first carried payment covers the whole calendar months from the first day of the latest installment's service period to today; on a quarterly schedule with two or more such periods, it covers those whole months divided by three and rounded down; otherwise it covers one service period; it never covers more periods than the payments the carried benefit is spread over.
    result: >-
      The first carried payment is assembled in one fixed order: every ratio that applies to the unpaid case benefit is applied first and the product is rounded half up to the cent and limited to the rider's lifetime maximum less every payment, net of reversals, made under the rider; the carried benefit then follows from that amount; every amount taken off the carried benefit comes off next, never below zero; every percentage held back comes off the rest; the remainder is divided by the number of payments it is spread over and rounded half up to the cent; and that share times the service periods the first carried payment covers is rounded half up to the cent to give the payment.
    records_paid: >-
      Orthodontic records are paid inside the case benefit, so records that the orthodontist now treating the patient took and that were paid under the patient's own dental enrollment are not paid a second time in the first carried payment: the records lines are the paid lines of that enrollment billed under the participation agreement named on the latest transfer entry with dates of service fewer than the records window months whole calendar months before today; when they include a comprehensive oral evaluation line (code D0150) and a panoramic image line (code D0330), the plan payments of all such lines come off the carried benefit; when they include such a panoramic line but no such evaluation line, the plan payments of the panoramic lines come off; otherwise, and always when the latest transfer entry names no agreement, nothing comes off.
    est_remaining: >-
      By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    est_origin: >-
      By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    case_entries: >-
      By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
  factors:
  - id: practice_network_ratio
    effect: parameter
    decides: net_ratio
    bindings:
    - net_ratio
    ladder:
    - when: >-
        rider coinsurances differ AND the latest establishment entry is out of network AND the latest transfer entry is in network
      value: in-network coinsurance divided by out-of-network coinsurance
    - when: >-
        rider coinsurances differ AND the latest establishment entry is in network AND the latest transfer entry is out of network
      value: out-of-network coinsurance divided by in-network coinsurance
    - when: otherwise
      value: '1'
    baseline:
      net_ratio: '1'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: practice_records_offset
    effect: parameter
    decides: records_paid
    bindings:
    - records_paid
    ladder:
    - when: >-
        the latest transfer entry names an agreement AND that practice's paid D0150 and D0330 lines lie within the records window
      value: plan payments of all those lines
    - when: >-
        the latest transfer entry names an agreement AND that practice's paid D0330 lines but no D0150 line lie within the window
      value: plan payments of those D0330 lines
    - when: otherwise (including a transfer entry with no agreement)
      value: '0'
    baseline:
      records_paid: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dental
  - id: retention_reserve
    effect: parameter
    decides: reserve_pct
    bindings:
    - reserve_pct
    ladder:
    - when: a case treated with fixed braces
      value: K('braces_reserve_pct')
    - when: a case treated with clear aligners
      value: K('aligner_reserve_pct')
    - when: otherwise (a limited or interceptive case or any other case)
      value: '0'
    baseline:
      reserve_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: payment_spread
    effect: method
    decides: payment_count
    bindings:
    - left_original
    - payment_count
    ladder:
    - when: no more than the lump-sum months remaining on the latest transfer entry
      method: a single payment
    - when: >-
        a quarterly schedule AND the months remaining divided by three (rounded up) are fewer than the installments left
      method: months remaining divided by three, rounded up
    - when: a monthly schedule AND the months remaining are fewer than the installments left
      method: the months remaining
    - when: otherwise
      method: the installments left on the original schedule
    baseline:
      payment_count: left_original
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: begun_periods
    effect: method
    decides: catch_periods
    bindings:
    - since_months
    - catch_periods
    ladder:
    - when: a monthly schedule AND two or more service periods begun since the latest installment
      method: whole calendar months from the first day of the latest installment's service period to today
    - when: a quarterly schedule AND two or more service periods begun since the latest installment
      method: those whole months divided by three, rounded down
    - when: otherwise
      method: one service period
    baseline:
      catch_periods: '1'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      By the standard measure the case benefit follows the benefit rule of the rider: the allowed case fee on the latest establishment entry less the part of the rider's lifetime orthodontic deductible not yet used by the person, times the rider coinsurance for the network status on that entry, rounded half up to the cent; for a takeover entry that amount is then prorated by the months remaining divided by the planned treatment months on that entry and rounded half up to the cent, unless the takeover entry supersedes a new-start entry of the same case, whose fee already covers only the treatment from the start of coverage; and the result is limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases. The part of the deductible not yet used is the whole deductible when every establishment entry under the rider carries the case's case number, the deductible less the allowed case fees on the establishment entries of the other cases when those add up to less than the deductible, and nothing otherwise. The unpaid case benefit is that case benefit less every initial and installment payment on the case net of reversals, rounded half up to the cent and never below zero. The carried benefit is the unpaid case benefit, except that when the recognised remaining-treatment fee on the latest transfer entry is lower than the unpaid case benefit divided by the rider coinsurance for that entry's network status, the carried benefit is the coinsurance share of that fee, rounded half up to the cent; with no transfer entry on the case the carried benefit is the unpaid case benefit. The installments left on the original schedule are the planned treatment months after the banding month, limited to the rider's installment months cap and divided by the service-period length (one month, or three on a quarterly schedule) rounded up, less the installment payments on the case that have not been reversed, and never fewer than one. By the standard method the carried benefit is spread evenly over the installments left on the original schedule, and the first carried payment covers one service period and is one such share, rounded half up to the cent.
    params: []
  inputs:
    history:
    - table: ortho_payments
      aggregate: sum
      field: amount
      filters:
        event_type: ortho_installment_payment
    - table: ortho_cases
      aggregate: latest
      field: allowed_case_fee
      filters:
        event_type: ortho_case_transferred
    - category: dental
      table: dental_claim_lines
      aggregate: sum
      field: plan_paid
      within_months: 6
      filters:
        event_type: dental_claim_line_paid
    cross_category:
    - dental
- id: ortho_ext_waiting_takeover_fee
  base_policy_refs:
  - ortho_evt_case_eligibility
  - ortho_evt_benefit_calculation
  overwrite:
  - base_policy: ortho_evt_case_eligibility
    superseded_clause: >-
      A new_start case is covered only if its banding_date falls on or after the rider_effective_date plus the applicable waiting period, counted in calendar months with the last day of the month used when the target day does not exist: ortho_wait_months_individual_child or ortho_wait_months_individual_adult (by age on banding_date) for riders attached to individual-market enrollments, ortho_wait_months_group_late_entrant for group late entrants, none for other group riders; with ortho_prior_coverage_credit month_for_month the waiting period is shortened by prior_ortho_coverage_months.
    replaced_by: >-
      A new-start case is covered when its banding date falls on or after the day its coverage begins, which is the first day of the month that is the net waiting months after the rider effective date; the waiting months are those stated in this rule, the net waiting months are the waiting months less every reduction that applies and never below zero, prior orthodontic coverage recorded on the rider reduces the waiting months by one month for each documented month on a rider with month-for-month credit and by nothing otherwise, and months are counted in calendar months with the last day of the month used when the target day does not exist.
  - base_policy: ortho_evt_case_eligibility
    superseded_clause: >-
      A takeover case (treatment begun before the rider effective date or under another carrier) is covered only when ortho_takeover_allowed is true and at least ortho_takeover_min_remaining_months planned months remain on the rider_effective_date; the waiting period and age limit do not apply to a takeover, but the lifetime maximum does.
    replaced_by: >-
      A case established as a takeover from the start (treatment begun under another carrier or before the rider effective date) is covered when the rider allows takeovers and at least the rider's takeover minimum months of planned treatment remain on the rider effective date; the waiting period and age limit do not apply to such a takeover, but the lifetime maximum does; a case re-established under this rule is not re-established when fewer than the rider's takeover minimum months of treatment are still to come when its coverage begins, or when the rider does not allow takeovers.
  trigger: state_due
  subject:
  - ortho_case_established
  computes: allowed_case_fee
  target_tool: record_ortho_takeover_case_574129ed
  params:
    long_tenure_months: 6
    short_tenure_months: 3
    braces_start_share_pct: 15
    aligner_start_share_pct: 30
    braces_retention_share_pct: 10
    aligner_retention_share_pct: 5
  rule: >-
    A new-start case is covered when its banding date falls on or after the day its coverage begins, which is the first day of the month that is the net waiting months after the rider effective date; the waiting months are those stated in this rule, the net waiting months are the waiting months less every reduction that applies and never below zero, prior orthodontic coverage recorded on the rider reduces the waiting months by one month for each documented month on a rider with month-for-month credit and by nothing otherwise, and months are counted in calendar months with the last day of the month used when the target day does not exist. When a case was established as a new start although its appliances were placed before coverage of the case began, Cascade does not refuse the case: it re-establishes it as a takeover from the month coverage began, with a takeover establishment entry under the same case number that supersedes the new-start entry, and on that entry it fixes the months of treatment still to come when coverage begins and the fee it recognises for the treatment the rider covers; only such cases are re-established this way. A case established as a takeover from the start (treatment begun under another carrier or before the rider effective date) is covered when the rider allows takeovers and at least the rider's takeover minimum months of planned treatment remain on the rider effective date; the waiting period and age limit do not apply to such a takeover, but the lifetime maximum does; a case re-established under this rule is not re-established when fewer than the rider's takeover minimum months of treatment are still to come when its coverage begins, or when the rider does not allow takeovers. The waiting months follow the dental enrollment the rider is attached to: on a rider that covers adults, the rider's adult waiting months when that enrollment is in the individual market and the patient had reached the 19th birthday on the banding date; none when it is a group enrollment that did not enter as a late entrant; otherwise the rider's child waiting months for an individual-market patient under 19, or the rider's late-entrant waiting months for a group late entrant. The months of treatment before coverage are the net waiting months less the whole calendar months from the rider effective date to the banding date, less one for the month in which the appliances were placed, and never below zero; the months of treatment still to come when coverage begins are the planned treatment months on the new-start entry less the months of treatment before coverage, and never below zero. The standard recognised covered-treatment fee is the allowed case fee on the new-start entry times the months of treatment still to come when coverage begins, divided by the planned treatment months, rounded half up to the cent; a case with no planned treatment months, or a rider with no new-start entry, has a fee of zero. For the recognised covered-treatment fee, continuous Cascade dental coverage before the rider shortens the waiting months on any rider: by the long-tenure reduction when the attached dental enrollment's coverage began 24 or more whole calendar months before the rider effective date, by the short-tenure reduction when it began 12 to 23 whole calendar months before, and not at all otherwise; dental coverage is never counted as prior orthodontic coverage. Work done before coverage begins is not covered, so in the recognised covered-treatment fee the part of the fee for the start of treatment is taken off: the braces start share percent of it for a case with fixed braces, the aligner start share percent of it for a case with clear aligners, and nothing for a limited or interceptive case or any other case. The fee of the practice now treating the patient is, for a case that has moved, the lesser of the allowed case fee and the rate of the practice named on the latest transfer entry (its treatment fee on that entry divided by the months remaining on it and multiplied by the planned treatment months), and the allowed case fee otherwise; a case whose latest transfer entry has no months remaining is treated as a case that has not moved for this fee, for the payment shape and for the plan of the practice now treating the patient. Treatment after coverage begins includes the whole retention phase at the end of treatment, so in the recognised covered-treatment fee the part of the fee for retention is kept whole and is not reduced by the part of the planned treatment months that is covered: it is the braces retention share percent of the fee of the practice now treating the patient for a case with fixed braces, the aligner retention share percent of that fee for a case with clear aligners, and nothing for a limited or interceptive case or any other case. Records that the orthodontist now treating the patient took when the case moved to that practice are part of the case fee, so a records visit already allowed under the patient's own dental enrollment is not counted a second time in the recognised covered-treatment fee: the records visit is the date of the latest paid comprehensive oral evaluation line (code D0150) of that enrollment billed under the participation agreement named on the latest transfer entry; when that visit also has a paid panoramic image line (code D0330) under the same agreement, the allowed amounts of the evaluation and panoramic lines of that date are taken off; when it has only the evaluation line, its allowed amount is taken off; otherwise, and always when the latest transfer entry names no agreement, nothing is taken off. For the recognised covered-treatment fee, how the covered treatment is valued follows the payment shape the rider gives the case: a case planned for no more than the rider's lump-sum months is paid in one payment at banding, so for such a case no treatment after coverage begins is valued and the fee is zero; for a case that has moved, the covered months before the month of its latest move are valued at the allowed case fee and the covered months from that month on at the fee of the practice now treating the patient, however many moves came before; otherwise every covered month is valued at the allowed case fee. For the recognised covered-treatment fee, the covered months from the month of the latest move follow the plan of the practice now treating the patient: when the months remaining on the latest transfer entry are fewer than the months the new-start plan still had after the move (the planned treatment months less the whole calendar months from the banding date to the date of that entry), no more covered months from that month on are counted than the months remaining on that entry; when they are more, the covered months from that month on are counted in full but valued at the share that the months the new-start plan still had after the move form of the months remaining on that entry, because longer treatment adds no benefit; otherwise they are counted in full at full value. Whole calendar months between two dates count a month only when the day of the month of the later date is on or after the day of the month of the earlier date, with no special rule for the end of a month, and the 19th birthday is reached once 228 such months have passed since the date of birth. The recognised covered-treatment fee is assembled in one fixed order: the covered months are counted and valued as stated; every share taken off the fee and every part kept whole is first set aside from that value, and the rest is divided by the planned treatment months; every part kept whole is then added back as its share of the fee of the practice now treating the patient; every amount to be subtracted is then subtracted; and the result is rounded half up to the cent once, at the end, and is never below zero. The takeover establishment entry records the months of treatment still to come when coverage begins as its months remaining, carries the takeover origin, keeps the case number, banding date, appliance, planned treatment months and treatment fee of the new-start entry, and takes the network status and participation agreement fixed for the practice now treating the patient on the date of the takeover entry, a Cascade PPO or Premier Participating Dentist Agreement in force with the orthodontist specialty giving in network and anything else out of network; the new-start entry is the latest establishment entry under the rider, and when two establishment entries carry the same date the one entered first counts as the latest.
