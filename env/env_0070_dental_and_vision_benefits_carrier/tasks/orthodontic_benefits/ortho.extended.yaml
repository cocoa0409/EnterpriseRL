    - dental_claim_lines.event_type
    - dental_claim_lines.provider_agreement_id
    note: >-
      The progress-records factor reads the latest paid D0330 and D0150 lines of the patient's own dental enrollment billed under the agreement on the takeover entry, and their plan payments.
  compute:
  - case_no: LATEST('ortho_cases', 'case_number', event_type='ortho_case_established')
  - planned_months: LATEST('ortho_cases', 'treatment_months', event_type='ortho_case_established')
  - banding: LATEST('ortho_cases', 'banding_date', event_type='ortho_case_established')
  - est_network: LATEST('ortho_cases', 'network_status', event_type='ortho_case_established')
  - est_fee: LATEST('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established')
  - est_remaining: LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established')
  - case_paid: >-
      SUM('ortho_payments', 'amount', event_type='ortho_initial_payment', case_number=case_no) + SUM('ortho_payments', 'amount', event_type='ortho_installment_payment', case_number=case_no) - SUM('ortho_payments', 'amount', event_type='ortho_payment_reversal', case_number=case_no)
  - rider_paid: >-
      SUM('ortho_payments', 'amount', event_type='ortho_initial_payment') + SUM('ortho_payments', 'amount', event_type='ortho_installment_payment') - SUM('ortho_payments', 'amount', event_type='ortho_payment_reversal')
  - initial_amount: SUM('ortho_payments', 'amount', event_type='ortho_initial_payment', case_number=case_no)
  - period_len: 3 if P('ortho_installment_frequency') == 'quarterly' else 1
  - original_count: >-
      MX(1, -(-MN(MX(0, planned_months - 1), P('ortho_installment_months_cap')) // period_len)) if planned_months != None else 1
  - cover_index: (planned_months - est_remaining + 1) if (planned_months != None and est_remaining != None) else 1
  - start_index: >-
      (P('ortho_first_installment_offset_months') + period_len * ((cover_index - P('ortho_first_installment_offset_months')) // period_len)) if cover_index >= P('ortho_first_installment_offset_months') else P('ortho_first_installment_offset_months')
  - now_index: >-
      (MONTHS(F('rider_effective_date'), NOW) - MONTHS(F('rider_effective_date'), banding)) if banding != None else 0
  - begun_count: ((now_index - start_index) // period_len + 1) if now_index >= start_index else 0
  - case_entries: COUNT('ortho_cases', event_type='ortho_case_established', case_number=case_no)
  - ded_amount: >-
      P('ortho_lifetime_deductible') if COUNT('ortho_cases', event_type='ortho_case_established') == COUNT('ortho_cases', event_type='ortho_case_established', case_number=case_no) else (MX(0, P('ortho_lifetime_deductible') - (SUM('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established') - SUM('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established', case_number=case_no))) if (COUNT('ortho_cases', event_type='ortho_case_established') > COUNT('ortho_cases', event_type='ortho_case_established', case_number=case_no) and SUM('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established') - SUM('ortho_cases', 'allowed_case_fee', event_type='ortho_case_established', case_number=case_no) < P('ortho_lifetime_deductible')) else 0)
  - net_coins: >-
      (((P('ortho_coinsurance_in_network') if LATEST('ortho_cases', 'network_status', event_type='ortho_case_established', case_origin='new_start', case_number=case_no) == 'in_network' else P('ortho_coinsurance_oon')) * MN(LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established'), MX(0, (MONTHS(F('rider_effective_date'), LATEST('ortho_cases', 'event_date', event_type='ortho_case_transferred', case_number=case_no)) - MONTHS(F('rider_effective_date'), LATEST('ortho_cases', 'banding_date', event_type='ortho_case_established'))) - (LATEST('ortho_cases', 'treatment_months', event_type='ortho_case_established') - LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established') + 1))) + (P('ortho_coinsurance_in_network') if LATEST('ortho_cases', 'network_status', event_type='ortho_case_transferred', case_number=case_no) == 'in_network' else P('ortho_coinsurance_oon')) * (LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established') - MN(LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established'), MX(0, (MONTHS(F('rider_effective_date'), LATEST('ortho_cases', 'event_date', event_type='ortho_case_transferred', case_number=case_no)) - MONTHS(F('rider_effective_date'), LATEST('ortho_cases', 'banding_date', event_type='ortho_case_established'))) - (LATEST('ortho_cases', 'treatment_months', event_type='ortho_case_established') - LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established') + 1))))) / LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established')) if ((LATEST('ortho_cases', 'case_origin', event_type='ortho_case_established') == 'takeover' and COUNT('ortho_cases', event_type='ortho_case_established', case_number=case_no) >= 2 and LATEST('ortho_cases', 'network_status', event_type='ortho_case_established', case_origin='new_start', case_number=case_no) != None and P('ortho_coinsurance_in_network') != P('ortho_coinsurance_oon')) and COUNT('ortho_cases', event_type='ortho_case_transferred', case_number=case_no) >= 1 and LATEST('ortho_cases', 'event_date', event_type='ortho_case_transferred', case_number=case_no) <= LATEST('ortho_cases', 'event_date', event_type='ortho_case_established') and (MONTHS(F('rider_effective_date'), LATEST('ortho_cases', 'event_date', event_type='ortho_case_transferred', case_number=case_no)) - MONTHS(F('rider_effective_date'), LATEST('ortho_cases', 'banding_date', event_type='ortho_case_established'))) >= (LATEST('ortho_cases', 'treatment_months', event_type='ortho_case_established') - LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established') + 1) and LATEST('ortho_cases', 'network_status', event_type='ortho_case_established', case_origin='new_start', case_number=case_no) != LATEST('ortho_cases', 'network_status', event_type='ortho_case_transferred', case_number=case_no) and LATEST('ortho_cases', 'months_remaining', event_type='ortho_case_established') > 0) else ((P('ortho_coinsurance_in_network') if LATEST('ortho_cases', 'network_status', event_type='ortho_case_established', case_origin='new_start', case_number=case_no) == 'in_network' else P('ortho_coinsurance_oon')) if ((LATEST('ortho_cases', 'case_origin', event_type='ortho_case_established') == 'takeover' and COUNT('ortho_cases', event_type='ortho_case_established', case_number=case_no) >= 2 and LATEST('ortho_cases', 'network_status', event_type='ortho_case_established', case_origin='new_start', case_number=case_no) != None and P('ortho_coinsurance_in_network') != P('ortho_coinsurance_oon')) and (COUNT('ortho_cases', event_type='ortho_case_transferred', case_number=case_no) == 0 or LATEST('ortho_cases', 'event_date', event_type='ortho_case_transferred', case_number=case_no) > LATEST('ortho_cases', 'event_date', event_type='ortho_case_established')) and LATEST('ortho_cases', 'network_status', event_type='ortho_case_established', case_origin='new_start', case_number=case_no) != LATEST('ortho_cases', 'network_status', event_typ