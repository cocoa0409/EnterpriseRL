n before the first service period of the original schedule, that first service period, which it then covers in full, coverage having begun in the banding month plus the planned treatment months less the months remaining on the takeover entry plus one, and a takeover installment is payable to date once the first day of its service period has passed; by the standard method every payable installment is paid in full. The member repays the amount paid on the case less the takeover installments payable to date, never below zero and never more than the initial payment of the case.
