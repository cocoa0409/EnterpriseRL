      For the recognised covered-treatment fee, the covered months from the month of the latest move follow the plan of the practice now treating the patient: when the months remaining on the latest transfer entry are fewer than the months the new-start plan still had after the move (the planned treatment months less the whole calendar months from the banding date to the date of that entry), no more covered months from that month on are counted than the months remaining on that entry; when they are more, the covered months from that month on are counted in full but valued at the share that the months the new-start plan still had after the move form of the months remaining on that entry, because longer treatment adds no benefit; otherwise they are counted in full at full value.
    moved: >-
      The fee of the practice now treating the patient is, for a case that has moved, the lesser of the allowed case fee and the rate of the practice named on the latest transfer entry (its treatment fee on that entry divided by the months remaining on it and multiplied by the planned treatment months), and the allowed case fee otherwise; a case whose latest transfer entry has no months remaining is treated as a case that has not moved for this fee, for the payment shape and for the plan of the practice now treating the patient.
    move_rate: >-
      The fee of the practice now treating the patient is, for a case that has moved, the lesser of the allowed case fee and the rate of the practice named on the latest transfer entry (its treatment fee on that entry divided by the months remaining on it and multiplied by the planned treatment months), and the allowed case fee otherwise; a case whose latest transfer entry has no months remaining is treated as a case that has not moved for this fee, for the payment shape and for the plan of the practice now treating the patient.
    move_index: >-
      For the recognised covered-treatment fee, how the covered treatment is valued follows the payment shape the rider gives the case: a case planned for no more than the rider's lump-sum months is paid in one payment at banding, so for such a case no treatment after coverage begins is valued and the fee is zero; for a case that has moved, the covered months before the month of its latest move are valued at the allowed case fee and the covered months from that month on at the fee of the practice now treating the patient, however many moves came before; otherwise every covered month is valued at the allowed case fee.
    result: >-
      The recognised covered-treatment fee is assembled in one fixed order: the covered months are counted and valued as stated; every share taken off the fee and every part kept whole is first set aside from that value, and the rest is divided by the planned treatment months; every part kept whole is then added back as its share of the fee of the practice now treating the patient; every amount to be subtracted is then subtracted; and the result is rounded half up to the cent once, at the end, and is never below zero.
  factors:
  - id: dental_tenure
    effect: parameter
    decides: tenure_reduction
    bindings:
    - tenure_reduction
    ladder:
    - when: >-
        the attached dental enrollment's coverage began 24 or more whole months before the rider effective date
      value: K('long_tenure_months')
    - when: it began 12 to 23 whole months before
      value: K('short_tenure_months')
    - when: otherwise
      value: '0'
    baseline:
      tenure_reduction: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dental
  - id: start_work_share
    effect: parameter
    decides: start_pct
    bindings:
    - start_pct
    ladder:
    - when: a case with fixed braces
      value: K('braces_start_share_pct')
    - when: a case with clear aligners
      value: K('aligner_start_share_pct')
    - when: otherwise (limited or interceptive case, or any other case)
      value: '0'
    baseline:
      start_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: retention_part
    effect: parameter
    decides: ret_pct
    bindings:
    - ret_pct
    ladder:
    - when: a case with fixed braces
      value: K('braces_retention_share_pct')
    - when: a case with clear aligners
      value: K('aligner_retention_share_pct')
    - when: otherwise (a limited or interceptive case or any other case)
      value: '0'
    baseline:
      ret_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: practice_records_visit
    effect: parameter
    decides: records_amount
    bindings:
    - records_amount
    ladder:
    - when: >-
        the latest transfer entry names an agreement AND that practice's records visit has a paid D0150 and a paid D0330 line
      value: allowed amounts of both lines of that date
    - when: >-
        the latest transfer entry names an agreement AND that practice's records visit has only the D0150 line
      value: its allowed amount
    - when: otherwise (including a transfer entry with no agreement)
      value: '0'
    baseline:
      records_amount: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dental
  - id: covered_payment_shape
    effect: method
    decides: shape_code
    bindings:
    - shape_code
    ladder:
    - when: a case planned for no more than the lump-sum months
      method: 'nothing after coverage valued (single payment at banding): fee zero'
    - when: a case that has moved
      method: >-
        covered months before the month of the latest move at the allowed fee, the rest at the fee of the practice now treating the patient
    - when: otherwise
      method: every covered month at the allowed fee
    baseline:
      shape_code: '3'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: treating_practice_plan
    effect: parameter
    decides: post_cap
    bindings:
    - post_cap
    - post_scale
    ladder:
    - when: >-
        the latest transfer entry's months remaining are fewer than the months the new-start plan still had after the move
      value: those months remaining as the cap on covered months from the month of the move
    - when: they are more
      value: >-
        the new-start plan's months after the move over the entry's months remaining as the value share of those months
    - when: otherwise
      value: no cap and full value
    baseline:
      post_cap: '999'
      post_scale: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The waiting months follow the dental enrollment the rider is attached to: on a rider that covers adults, the rider's adult waiting months when that enrollment is in the individual market and the patient had reached the 19th birthday on the banding date; none when it is a group enrollment that did not enter as a late entrant; otherwise the rider's child waiting months for an individual-market patient under 19, or the rider's late-entrant waiting months for a group late entrant. The months of treatment before coverage are the net waiting months less the whole calendar months from the rider effective date to the banding date, less one for the month in which the appliances were placed, and never below zero; the months of treatment still to come when coverage begins are the planned treatment months on the new-start entry less the months of treatment before coverage, and never below zero. The standard recognised covered-treatment fee is the allowed case fee on the new-start entry times the months of treatment still to come when coverage begins, divided by the planned treatment months, rounded half up to the cent; a case with no planned treatment months, or a rider with no new-start entry, has a fee of zero.
    params: []
  inputs:
    history:
    - table: ortho_cases
      aggregate: max
      field: allowed_case_fee
      filters:
        event_type: ortho_case_established
        case_origin: new_start
    - category: dental
      table: dental_claim_lines
      aggregate: sum
      field: allowed_amount
      filters:
        event_type: dental_claim_line_paid
    cross_category:
    - dental
- id: ortho_ext_member_overpayment_return
  base_policy_refs:
  - ortho_evt_payment_reversal
  - ortho_agg_lifetime_maximum
  - ortho_evt_benefit_calculation
  overwrite:
  - base_policy: ortho_evt_payment_reversal
    superseded_clause: >-
      A payment is reversed when it was issued for a service period beginning after the rider termination_date, when it duplicates a payment for the same case and service period, or when it took lifetime benefits above the maximum; it is reversed for its full amount, or, for the last case, for the excess only.
    replaced_by: >-
      A payment is reversed for its full amount when it was issued for a service period beginning after the rider termination date or duplicates a payment for the same case and service period, and for the excess only when it took the person's lifetime benefits above the maximum, for every person; in addition, for a person whose current rider is the only Cascade orthodontic rider the person has held, when a case's latest establishment entry is a takeover entry and the payments made to the member on the case exceed what that takeover makes payable to date, the member returns the excess as stated below, recorded as a reversal of the case's initial payment and never more than that payment, while a case paid to a practice is recovered from the practice by offset.
  - base_policy: ortho_evt_benefit_calculation
    superseded_clause: >-
      For a takeover case the benefit so computed is prorated by months_remaining divided by treatment_months (rounded half up to the cent) and is paid in installments only, with no initial payment.
    replaced_by: >-
      For a takeover case the benefit so computed is prorated by the months remaining divided by the planned treatment months on its takeover entry, rounded half up to the cent, and is paid in installments only, with no initial payment, except that a takeover entry that supersedes a new-start entry of the same case is not prorated, because its fee already covers only the treatment from the start of coverage.
  - base_policy: ortho_evt_benefit_calculation
    superseded_clause: >-
      The case benefit is the allowed_case_fee minus any unused ortho_lifetime_deductible, times the rider coinsurance for the case network (ortho_coinsurance_in_network or ortho_coinsurance_oon), rounded half up to the cent, and limited to the person's remaining lifetime maximum on the establishment date.
    replaced_by: >-
      The case benefit is the allowed case fee less any unused part of the rider's lifetime orthodontic deductible, times the rider coinsurance for the network status on the establishment entry, rounded half up to the cent, and limited to the person's remaining lifetime maximum on the establishment date, the payments already made on a case not counting against the benefit of a takeover entry that supersedes that case's new-start entry.
  trigger: on_request
  subject:
  - ortho_payment_reversal
  computes: amount
  target_tool: repay_ortho_overpayment_ce1ed3cf
  params:
    braces_reserve_pct: 10
    aligner_reserve_pct: 5
  rule: >-
    A payment is reversed for its full amount when it was issued for a service period beginning after the rider termination date or duplicates a payment for the same case and service period, and for the excess only when it took the person's lifetime benefits above the maximum, for every person; in addition, for a person whose current rider is the only Cascade orthodontic rider the person has held, when a case's latest establishment entry is a takeover entry and the payments made to the member on the case exceed what that takeover makes payable to date, the member returns the excess as stated below, recorded as a reversal of the case's initial payment and never more than that payment, while a case paid to a practice is recovered from the practice by offset. The amount a member repays on a case is not fixed until the case's latest establishment entry is a takeover entry whenever the case's appliances were placed before its waiting period ended. The amount paid on the case is every initial and installment payment carrying the case number less every reversal carrying it. The case benefit is the allowed case fee less any unused part of the rider's lifetime orthodontic deductible, times the rider coinsurance for the network status on the establishment entry, rounded half up to the cent, and limited to the person's remaining lifetime maximum on the establishment date, the payments already made on a case not counting against the benefit of a takeover entry that supersedes that case's new-start entry. For a takeover case the benefit so computed is prorated by the months remaining divided by the planned treatment months on its takeover entry, rounded half up to the cent, and is paid in installments only, with no initial payment, except that a takeover entry that supersedes a new-start entry of the same case is not prorated, because its fee already covers only the treatment from the start of coverage. The part of the deductible not yet used is the whole deductible when every establishment entry under the rider carries the case's case number, the deductible less the allowed case fees on the establishment entries of the other cases when those add up to less than the deductible, and nothing otherwise. By the standard measure the takeover benefit is the allowed case fee on the latest establishment entry less the part of the deductible not yet used, times the rider coinsurance for the network status on that entry, rounded half up to the cent, prorated as the takeover sentence of this rule states, and limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases. By the standard method the takeover benefit is spread over the installments of the original schedule, that is the planned treatment months after the banding month limited to the rider's installment months cap, divided by the service-period length (one month, or three on a quarterly schedule) and rounded up, never fewer than one, and each takeover installment is the takeover benefit divided by that number, rounded half up to the cent. The takeover schedule keeps the original schedule's service periods, which start the rider's first-installment offset months after the banding month and follow one service period apart; the first takeover installment covers the service period in which coverage of the case began, or, when coverage began before the first service period of the original schedule, that first service period, which it then covers in full, coverage having begun in the banding month plus the planned treatment months less the months remaining on the takeover entry plus one, and a takeover installment is payable to date once the first day of its service period has passed; by the standard method every payable installment is paid in full. The member repays the amount paid on the case less the takeover installments payable to date, never below zero and never more than the initial payment of the case. For the member's repayment, the takeover benefit of a takeover entry that supersedes a new-start entry of the same case is valued at the coinsurance of the networks of the practices that render the covered treatment, on a rider whose in-network and out-of-network coinsurance differ: when the case moved, in or after the month its coverage began and no later than the takeover entry's date, to a practice of the network other than the new-start entry's, the covered months before the month of its latest move take the coinsurance for the network on the new-start entry, however many moves came before, and the rest the coinsurance for the network on the latest transfer entry, weighted by their months over the months remaining on the takeover entry; when the case had not moved by the takeover entry's date (it has no transfer entry, or its latest transfer entry is dated after the takeover entry) and the takeover entry's network differs from the new-start entry's, because the practice joined or left Cascade's network after the banding date, the coinsurance for the network on the new-start entry applies, a case in progress keeping the terms it began under; otherwise the coinsurance for the network on the takeover entry applies. Progress records taken during covered treatment are part of the case fee, so a records visit already paid under the patient's own dental enrollment is not paid a second time in the member's repayment: the progress records are the paid lines of that enrollment billed under the participation agreement named on the takeover entry and dated in or after the month coverage of the case began and after the latest transfer entry of the case, if any; when the latest such panoramic image line (code D0330) and the latest such comprehensive oral evaluation line (code D0150), latest by date of service and the one entered first when two share a date, are both progress records, the plan payments of both lines come off the takeover benefit; when only the latest such panoramic line is, its plan payment comes off; otherwise, and always when the takeover entry names no agreement, nothing comes off. For the member's repayment, the retention reserve held back from every takeover installment until appliance removal is reported is the braces reserve percent of the takeover benefit for a case treated with fixed braces, the aligner reserve percent for a case treated with clear aligners, and none for a limited or interceptive case or any other case. For the member's repayment, how many takeover installments the benefit is spread over follows the treatment left: with no more than the lump-sum months remaining on the takeover entry, a single payment; on a quarterly schedule with more months remaining, the months remaining that fall within the installment months cap counted from the month after the banding month (the cap less the months after the banding month before coverage began), divided by three and rounded up but never fewer than one; otherwise the original-schedule count of the standard method. For the member's repayment, the first takeover installment covers only the part of its service period that falls after coverage began: on a quarterly schedule, two thirds of it when coverage began in the second month of that quarter and one third when it began in the third month; otherwise all of it. The repayment is assembled in one fixed order: the fee comes down by every amount taken off it before coinsurance, the takeover benefit is set and limited as stated, every amount taken off the takeover benefit comes off next, every percentage held back comes off the rest, the remainder is divided into takeover installments rounded half up to the cent, the installments payable to date are added up with every part-period share applied and rounded half up to the cent, and the repayment is the amount paid on the case less that total, never below zero, never more than the initial payment and rounded half up to the cent. The repayment is recorded against the case's initial payment, keeping that payment's installment position, service period and payee; the case is the one whose establishment entries are the latest under the rider, and when two entries carry the same date the one entered first counts as the latest. No more takeover installments are payable to date than the number the takeover benefit is spread over, and a rider with no establishment entry has nothing to repay.
  prerequisite:
  - problem: ortho_ext_waiting_takeover_fee
    kind: value_input
    gate: est_fee
    form: state
    policy_source: >-
      The amount a member repays on a case is not fixed until the case's latest establishment entry is a takeover entry whenever the case's appliances were placed before its waiting period ended.
    condition: >-
      For a case whose banding_date precedes the end of its waiting period, the latest ortho_cases row with event_type ortho_case_established for the case has case_origin takeover (with its months_remaining and allowed_case_fee fixed at re-establishment).
    resolved_by: record_ortho_takeover_case_574129ed
    effect: >-
      The takeover establishment entry becomes the latest establishment entry: est_fee and est_remaining take its recognised covered-treatment fee and months remaining, which change the takeover benefit basis, the installment count, the coverage month and the first-period share.
  cross_category:
  - category: dental
    as: history
    reads:
