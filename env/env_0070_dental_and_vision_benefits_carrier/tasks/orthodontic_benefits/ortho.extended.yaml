  compute_basis:
    case_no: >-
      The repayment is recorded against the case's initial payment, keeping that payment's installment position, service period and payee; the case is the one whose establishment entries are the latest under the rider, and when two entries carry the same date the one entered first counts as the latest.
    planned_months: >-
      The takeover schedule keeps the original schedule's service periods, which start the rider's first-installment offset months after the banding month and follow one service period apart; the first takeover installment covers the service period in which coverage of the case began, or, when coverage began before the first service period of the original schedule, that first service period, which it then covers in full, coverage having begun in the banding month plus the planned treatment months less the months remaining on the takeover entry plus one, and a takeover installment is payable to date once the first day of its service period has passed; by the standard method every payable installment is paid in full.
    banding: >-
      The takeover schedule keeps the original schedule's service periods, which start the rider's first-installment offset months after the banding month and follow one service period apart; the first takeover installment covers the service period in which coverage of the case began, or, when coverage began before the first service period of the original schedule, that first service period, which it then covers in full, coverage having begun in the banding month plus the planned treatment months less the months remaining on the takeover entry plus one, and a takeover installment is payable to date once the first day of its service period has passed; by the standard method every payable installment is paid in full.
    est_network: >-
      By the standard measure the takeover benefit is the allowed case fee on the latest establishment entry less the part of the deductible not yet used, times the rider coinsurance for the network status on that entry, rounded half up to the cent, prorated as the takeover sentence of this rule states, and limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    est_fee: >-
      By the standard measure the takeover benefit is the allowed case fee on the latest establishment entry less the part of the deductible not yet used, times the rider coinsurance for the network status on that entry, rounded half up to the cent, prorated as the takeover sentence of this rule states, and limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    est_remaining: >-
      For a takeover case the benefit so computed is prorated by the months remaining divided by the planned treatment months on its takeover entry, rounded half up to the cent, and is paid in installments only, with no initial payment, except that a takeover entry that supersedes a new-start entry of the same case is not prorated, because its fee already covers only the treatment from the start of coverage.
    case_paid: >-
      The amount paid on the case is every initial and installment payment carrying the case number less every reversal carrying it.
    rider_paid: >-
      By the standard measure the takeover benefit is the allowed case fee on the latest establishment entry less the part of the deductible not yet used, times the rider coinsurance for the network status on that entry, rounded half up to the cent, prorated as the takeover sentence of this rule states, and limited to the rider's lifetime maximum less the payments, net of reversals, made under the rider for other cases.
    initial_amount: >-
      The member repays the amount paid on the case less the takeover installments payable to date, never below zero and never more than the initial payment of the case.
    period_len: >-
      By the standard method the takeover benefit is spread over the installments of the original schedule, that is the planned treatment months after the banding month limited to the rider's installment months cap, divided by the service-period length (one month, or three on a quarterly schedule) and rounded up, never fewer than one, and each takeover installment is the takeover benefit divided by that number, rounded half up to the cent.
    original_count: >-
      By the standard method the takeover benefit is spread over the installments of the original schedule, that is the planned treatment months after the banding month limited to the rider's installment months cap, divided by the service-period length (one month, or three on a quarterly schedule) and rounded up, never fewer than one, and each takeover installment is the takeover benefit divided by that number, rounded half up to the cent.
    cover_index: >-
      The takeover schedule keeps the original schedule's service periods, which start the rider's first-installment offset months after the banding month and follow one service period apart; the first takeover installment covers the service period in which coverage of the case began, or, when coverage began before the first service period of the original schedule, that first service period, which it then covers in full, coverage having begun in the banding month plus the planned treatment months less the months remaining on the takeover entry plus one, and a takeover installment is payable to date once the first day of its service period has passed; by the standard method every payable installment is paid in full.
    start_index: >-
      The takeover schedule keeps the original schedule's service periods, which start the rider's first-installment offset months after the banding month and follow one service period apart; the first takeover installment covers the service period in which coverage of the case began, or, when coverage began before the first service period of the original schedule, that first service period, which it then covers in full, coverage having begun in the banding month plus the planned treatment months less the months remaining on the takeover entry plus one, and a takeover installment is payable to date once the first day of its service period has passed; by the standard method every payable installment is paid in full.
    now_index: >-
      The takeover schedule keeps the original schedule's service periods, which start the rider's first-installment offset months after the banding month and follow one service period apart; the first takeover installment covers the service period in which coverage of the case began, or, when coverage began before the first service period of the original schedule, that first service period, which it then covers in full, coverage having begun in the banding month plus the planned treatment months less the months remaining on the takeover entry plus one, and a takeover installment is payable to date once the first day of its service period has passed; by the standard method every payable installment is paid in full.
    begun_count: >-
      No more takeover installments are payable to date than the number the takeover benefit is spread over, and a rider with no establishment entry has nothing to repay.
    case_entries: >-
      For a takeover case the benefit so computed is prorated by the months remaining divided by the planned treatment months on its takeover entry, rounded half up to the cent, and is paid in installments only, with no initial payment, except that a takeover entry that supersedes a new-start entry of the same case is not prorated, because its fee already covers only the treatment from the start of coverage.
    ded_amount: >-
      The part of the deductible not yet used is the whole deductible when every establishment entry under the rider carries the case's case number, the deductible less the allowed case fees on the establishment entries of the other cases when those add up to less than the deductible, and nothing otherwise.
    net_coins: >-
      For the member's repayment, the takeover benefit of a takeover entry that supersedes a new-start entry of the same case is valued at the coinsurance of the networks of the practices that render the covered treatment, on a rider whose in-network and out-of-network coinsurance differ: when the case moved, in or after the month its coverage began and no later than the takeover entry's date, to a practice of the network other than the new-start entry's, the covered months before the month of its latest move take the coinsurance for the network on the new-start entry, however many moves came before, and the rest the coinsurance for the network on the latest transfer entry, weighted by their months over the months remaining on the takeover entry; when the case had not moved by the takeover entry's date (it has no transfer entry, or its latest transfer entry is dated after the takeover entry) and the takeover entry's network differs from the new-start entry's, because the practice joined or left Cascade's network after the banding date, the coinsurance for the network on the new-start entry applies, a case in progress keeping the terms it began under; otherwise the coinsurance for the network on the takeover entry applies.
    progress_off: >-
      Progress records taken during covered treatment are part of the case fee, so a records visit already paid under the patient's own dental enrollment is not paid a second time in the member's repayment: the progress records are the paid lines of that enrollment billed under the participation agreement named on the takeover entry and dated in or after the month coverage of the case began and after the latest transfer entry of the case, if any; when the latest such panoramic image line (code D0330) and the latest such comprehensive oral evaluation line (code D0150), latest by date of service and the one entered first when two share a date, are both progress records, the plan payments of both lines come off the takeover benefit; when only the latest such panoramic line is, its plan payment comes off; otherwise, and always when the takeover entry names no agreement, nothing comes off.
    reserve_pct: >-
      For the member's repayment, the retention reserve held back from every takeover installment until appliance removal is reported is the braces reserve percent of the takeover benefit for a case treated with fixed braces, the aligner reserve percent for a case treated with clear aligners, and none for a limited or interceptive case or any other case.
    installment_count: >-
      For the member's repayment, how many takeover installments the benefit is spread over follows the treatment left: with no more than the lump-sum months remaining on the takeover entry, a single payment; on a quarterly schedule with more months remaining, the months remaining that fall within the installment months cap counted from the month after the banding month (the cap less the months after the banding month before coverage began), divided by three and rounded up but never fewer than one; otherwise the original-schedule count of the standard method.
    first_share: >-
      For the member's repayment, the first takeover installment covers only the part of its service period that falls after coverage began: on a quarterly schedule, two thirds of it when coverage began in the second month of that quarter and one third when it began in the third month; otherwise all of it.
    result: >-
      The repayment is assembled in one fixed order: the fee comes down by every amount taken off it before coinsurance, the takeover benefit is set and limited as stated, every amount taken off the takeover benefit comes off next, every percentage held back comes off the rest, the remainder is divided into takeover installments rounded half up to the cent, the installments payable to date are added up with every part-period share applied and rounded half up to the cent, and the repayment is the amount paid on the case less that total, never below zero, never more than the initial payment and rounded half up to the cent.
