category: billing
display_name: Premium Billing Accounts
binding:
  holding_table: billing_accounts
  event_tables:
  - billing_transactions
  intake_tables:
  - billing_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: premium_balance
lifecycle:
  states:
  - pending_binder
  - active
  - grace_period
  - lapsed
  - closed
  transitions:
  - from: pending_binder
    to: active
    by: system
    means: The binder (first premium) payment is received in full.
  - from: pending_binder
    to: closed
    by: system
    means: Every enrollment the account was opened for was cancelled for an unpaid binder.
  - from: active
    to: grace_period
    by: system
    means: A premium due date passed without full payment of the coverage month due.
  - from: grace_period
    to: active
    by: system
    means: All past-due premium is paid before the grace period ends.
  - from: grace_period
    to: lapsed
    by: system
    means: The grace period ended without full payment; the funded coverage terminates for nonpayment.
  - from: lapsed
    to: active
    by: agent
    means: >-
      The account is reinstated within the reinstatement window after full payment of all past-due premium.
  - from: lapsed
    to: closed
    by: system
    means: The reinstatement window ended without reinstatement.
  - from: active
    to: closed
    by: user
    means: >-
      The account holder closes the account after all funded coverage has ended and the balance is settled.
accounts:
- key: premium_balance
  unit: USD
  meaning: Premium owed by the account holder (negative when the account holds a credit).
parameter_schema:
  billing_frequency_months: months of coverage billed per invoice
  premium_due_day: >-
    day of the month on which the premium for a billing period is due (the first day of the period it covers)
  invoice_lead_days: calendar days before the due date on which the invoice is issued
  grace_period_days: >-
    calendar days after the due date during which coverage continues while premium is unpaid (non-APTC accounts); 0 when the account uses the APTC grace instead
  aptc_grace_period_months: >-
    consecutive calendar months of grace for an exchange account receiving advance premium tax credit that has paid its binder; 0 when not applicable
  aptc_eligible: boolean; true = the arrangement can receive advance premium tax credit from the exchange
  aptc_claims_pend_from_grace_month: >-
    month of the APTC grace period (1-based) from which claims are pended rather than paid; 0 when not applicable
  aptc_lapse_termination_basis: >-
    enum string; termination date when an APTC grace period ends unpaid: end_of_first_grace_month; not_applicable otherwise
  lapse_termination_basis: 'enum string; termination date when a non-APTC grace period ends unpaid: paid_through_date'
  premium_payment_threshold_pct: >-
    integer percent of the net premium due that counts as full payment for grace and lapse purposes (a shortfall within the threshold carries forward as a balance)
  group_underpayment_tolerance: >-
    USD; a group remittance short by no more than this amount counts as full payment and the shortfall carries forward; 0.00 for individual arrangements
  accepted_payment_methods: list of payment methods accepted on the arrangement
  autopay_required: boolean; true = the arrangement must keep an automatic draft (eft or card) on file
  autopay_discount_monthly: USD per billed month credited off the invoice for automatic draft
  prepay_discount_pct: integer percent off the twelve monthly premiums when billed annually in advance
  eft_represent_count: count of times a returned automatic draft is presented again before it is treated as unpaid
  eft_represent_business_days: business days after a return on which the draft is presented again; 0 when not applicable
  returned_payment_fee: >-
    USD fee booked when a check or bank draft is returned unpaid (insufficient funds, closed account); 0.00 = no fee
  returned_payment_fee_max_per_12_months: count; at most this many returned-payment fees in any rolling 12 months
  autopay_returns_before_removal: >-
    count of returned drafts within 12 months after which automatic draft is removed and the account must pay by check or card; 0 when not applicable
  autopay_removal_fallback: enum string; arrangement the account is moved to when automatic draft is removed
  payment_application_order: 'enum string; how a payment is applied: oldest_unpaid_month_first'
  paid_through_advance_basis: enum string; paid-through date advances only by whole coverage months fully paid (full_months_only)
  reinstatement_window_days: >-
    calendar days after the lapse (termination) date within which the account may be reinstated; 0 = no reinstatement
  reinstatement_max_per_12_months: count of reinstatements allowed in any rolling 12 months; 0 = none
  reinstatement_requires_full_past_due: boolean; true = all premium past due through the current month must be paid before reinstatement
  reinstatement_payment_methods: list of payment methods accepted for a reinstatement payment (certified funds rule)
  refund_minimum: USD; credit balances below this amount on a closed account are not refunded but written off
  refund_method: >-
    enum string; original_payment_method = refund to the method of the latest payment; credit_next_invoice = applied to the next group invoice, refunded only on closure
  refund_issue_business_days: business days after the credit is booked within which a refund is issued
  termination_credit_basis: >-
    enum string; credit on voluntary termination: full_months_after_termination = premium billed for coverage months after the termination month is credited; no partial-month refund
  prepay_unearned_basis: >-
    enum string; unearned premium on an annual prepay: unearned_months_at_discounted_rate = remaining full months times the discounted monthly rate
  retro_termination_limit_days: >-
    calendar days; a group may terminate a member retroactively no more than this many days before the date the termination is reported, and premium is credited only for those months; 0 for individual arrangements
  retro_addition_limit_days: >-
    calendar days; a group may add a member retroactively no more than this many days before the date reported; 0 for individual arrangements
  group_remittance_report_required: >-
    boolean; true = the group submits its own monthly enrollment and premium report instead of paying a carrier-built invoice
  group_reconciliation_months: >-
    months between carrier reconciliations of a self-administered group's reports against enrollment; 0 when not applicable
  binder_amount_basis: >-
    enum string; amount of the binder: first_billing_period = premium for the first billing period of the arrangement
  binder_payment_methods: list of payment methods accepted for the binder
  payment_method_change_lead_days: >-
    calendar days before the next draft date by which a payment-method change must be confirmed to apply to that draft
  closure_requires_zero_balance: >-
    boolean; true = an account can be closed only once its balance is 0.00 after credits, refunds and write-offs
  credit_transfer_allowed: >-
    boolean; true = a credit balance may be applied to past-due premium on another open account of the same customer before any refund
  aptc_return_months_on_lapse: >-
    enum string; advance premium tax credit for grace months after the first is returned to the exchange when an APTC account lapses (months_2_and_3); not_applicable otherwise
  statement_rounding: enum string; amounts are rounded half up to the cent
  late_fee: USD late fee on unpaid premium; 0.00 = none charged
  grace_notice_required: >-
    boolean; true = a grace notice is sent when the account enters grace (the grace period runs whether or not the notice is read)
  max_months_billed_in_advance: count of future coverage months that may be paid ahead; payments beyond it are refunded
  partial_month_billing: >-
    enum string; coverage always starts and ends on month boundaries, so no partial-month premium is billed (whole_months_only)
  group_invoice_basis: >-
    enum string; how group premium is computed: contract_rates_times_enrolled = the group contract's rate per coverage tier times enrolled subscribers in that tier on the first of the month; not_applicable for individual
  individual_invoice_basis: >-
    enum string; how individual premium is computed: filed_rates_by_coverage_tier = the plan's monthly premium for the coverage tier plus orthodontic rider premium per enrolled person; not_applicable for groups
