      LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_returned_payment_fee')
  - last_fee_amt: >-
      LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_returned_payment_fee')
  - fee_since_inv: last_fee_date != None and last_date != None and last_fee_date >= last_date
  - inv_window: 0 if last_date == None else MONTHS(last_date, NOW) + 1
  - rets_lb: >-
      COUNT('billing_transactions', within_months=K('renewal_relief_lookback_months'), date_field='txn_date', event_type='billing_payment_returned')
  - rets_inv: >-
      COUNT('billing_transactions', within_months=inv_window, date_field='txn_date', event_type='billing_payment_returned')
  - open_months: 0 if (F('opened_date') == None or F('opened_date') == '') else MONTHS(F('opened_date'), NOW)
