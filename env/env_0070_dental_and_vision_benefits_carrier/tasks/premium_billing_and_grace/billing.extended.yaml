      XLATEST('dhmo','dhmo_plans','coverage_tier', date_field='coverage_effective_date', billing_account_id=HID, enrollee_relationship='subscriber', termination_reason='not_terminated')
  - q_dh_plan: >-
      XLATEST('dhmo','dhmo_plans','variant_name', date_field='coverage_effective_date', billing_account_id=HID, enrollee_relationship='subscriber', termination_reason='not_terminated')
  - q_dh_app: >-
      XLATEST('dhmo','dhmo_plans','application_date', date_field='coverage_effective_date', billing_account_id=HID, enrollee_relationship='subscriber', termination_reason='not_terminated')
  - q_dh_rate: >-
      0 if (q_dh_app == None or last_inv_date == None or q_dh_app > last_inv_date) else (0 if (q_dh_tier == None or q_dh_plan == None) else (CPARAM('dhmo','monthly_premium_member_only', variant_name=q_dh_plan) if q_dh_tier == 'member_only' else (CPARAM('dhmo','monthly_premium_member_spouse', variant_name=q_dh_plan) if q_dh_tier == 'member_spouse' else (CPARAM('dhmo','monthly_premium_member_children', variant_name=q_dh_plan) if q_dh_tier == 'member_children' else CPARAM('dhmo','monthly_premium_family', variant_name=q_dh_plan)))))
  - q_vinv: >-
      0 if (cv_app == None or last_inv_date == None or cv_app > last_inv_date) else (0 if (cv_tier == None or cv_plan == None) else (CPARAM('vision','monthly_premium_member_only', variant_name=cv_plan) if cv_tier == 'member_only' else (CPARAM('vision','monthly_premium_member_spouse', variant_name=cv_plan) if cv_tier == 'member_spouse' else (CPARAM('vision','monthly_premium_member_children', variant_name=cv_plan) if cv_tier == 'member_children' else CPARAM('vision','monthly_premium_family', variant_name=cv_plan)))))
  - q_c_rid: RND(q_span * (cd_rate + r_rate + q_act_r + q_vinv + q_dh_rate) * disc, 2)
  - q_c_both: RND(q_span * (qd_old + r_rate + q_act_r + q_vinv + q_dh_rate) * disc, 2)
  - rebill_r: 0 if (r_end == None or last_inv_date == None) else DAYS(r_end, last_inv_date)
  - bills_rider: >-
      q_inscope and (r_end != None and last_inv_amt != None and (ABS(last_inv_amt - q_c_rid) < 0.005 or (qd_tier != None and ABS(last_inv_amt - q_c_both) < 0.005)))
  - rc_recover: >-
      K('rider_rebill_long') if (rebill_r >= K('rider_rebill_days') and bills_rider) else (K('rider_rebill_short') if (rebill_r >= 1 and bills_rider) else 0)
  - post_month: last_cov
  - book_months: MX(0, rc_months - prior_rmonths)
  - result: RND(MX(0, rc_basis * rc_months - rc_dup) + rc_int + rc_recover, 2)
  compute_basis:
    r_end: >-
      The ended rider is the orthodontic rider funded by the account whose status is terminated, and where more than one is on record, the one with the latest termination date (of two with the same date, the one recorded first); its rider premium is the rider plan's monthly premium per covered person.
    r_plan: its rider premium is the rider plan's monthly premium per covered person
    r_rate: its rider premium is the rider plan's monthly premium per covered person
    last_cov: the invoice issued last (of two issued on the same day, the one recorded first)
    last_span: that last month being the invoice's coverage month advanced by its months covered less one
    last_inv_date: >-
      when the invoice issued last was issued rider_rebill_days or more days after the rider's termination date
    last_inv_amt: The invoice billed the ended rider when its amount equals, to the cent, that premium
    paid_thru: being the whole calendar months from the rider's termination date to the account's paid-through date
    disc: the rider premium reduced by the arrangement's prepay discount percentage
    std_rmonths: >-
      The rider months billed after its end are the whole calendar months from the month after the month of the rider's termination date through the last coverage month of the invoice issued last (of two issued on the same day, the one recorded first), that last month being the invoice's coverage month advanced by its months covered less one; they are zero when no invoice or no ended rider is on record or when that last month is not later than the termination month.
    since_rend: >-
      a credit counting as booked since that month when the whole calendar months from its booking date to the credit date are no more than the whole calendar months from the rider's termination date to the credit date
    prior_rmonths: >-
      The rider months already credited are the months covered by termination credits on the rider line booked since the rider's termination month
    plan_units: counted as two plan units for its dental and vision plans plus one for each active orthodontic rider
    rc_months: >-
      The rider months are replaced by how the account is billed: on an arrangement that carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date, only the prepaid months count, being the whole calendar months from the rider's termination date to the account's paid-through date, because months beyond the paid-through date are corrected when the coming year is paid, an account with no paid-through date on record being taken under the cases that follow instead; on an account in a grace period, only the months already begun count, being the whole calendar months from the rider's termination date to the credit date plus one; otherwise the rider months stay the rider months billed after its end.
    drafts_12r: by regular automatic bank drafts collected within twelve months before the credit date
    rc_basis: >-
      The monthly amount is replaced by how the rider was billed: when the rider months were billed on AutoPay, which the account's arrangement shows either by carrying an AutoPay discount or, where the arrangement does not accept bank draft, by regular automatic bank drafts collected within twelve months before the credit date, which only the AutoPay arrangement the account has since left could have collected, the amount is the rider premium less the AutoPay arrangement's monthly discount (autopay_discount_basis) divided equally among the plan units the account bills, counted as two plan units for its dental and vision plans plus one for each active orthodontic rider; when the arrangement carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date, the amount is the rider premium reduced by the prepay discount percentage; otherwise the monthly amount stays the rider premium.
    prior_rterm: >-
      when termination credits on the rider line were booked since the rider's termination month, their total is deducted
    prior_rprepay: >-
      when none was but prepay-unearned credits on the rider line were booked since then, their total is deducted
    rc_dup: >-
      Rider credits already booked are deducted: when termination credits on the rider line were booked since the rider's termination month, their total is deducted; when none was but prepay-unearned credits on the rider line were booked since then, their total is deducted; otherwise nothing is deducted.
    rint_base: >-
      The rider interest base is the rider premium reduced by the arrangement's prepay discount percentage for each prepaid month after the rider's termination date that is not among the rider months already credited, counted as the whole calendar months from that termination date to the paid-through date less the rider months already credited (never fewer than zero, and zero where no paid-through date is on record), running for the days from that termination date to the credit date beyond rider_late_days_low, on an actual-days basis over 365.
    rlag_days: when the days from the rider's termination date to the credit date exceed rider_late_days_high
    rc_int: >-
      Interest is added when the rider is credited late: when the days from the rider's termination date to the credit date exceed rider_late_days_high, the interest is rider_rate_high percent a year of the rider interest base; when they exceed rider_late_days_low but not rider_late_days_high, it is rider_rate_mid percent a year of the rider interest base; otherwise no interest is added.
    cd_tier: >-
      its current tier being the coverage tier recorded on the subscriber's active dental enrollment funded by the account with the latest coverage effective date (of two, the one recorded first)
    cd_plan: >-
      its current tier being the coverage tier recorded on the subscriber's active dental enrollment funded by the account with the latest coverage effective date (of two, the one recorded first)
    cd_rate: >-
      the dental plan being priced at the subscriber's current tier or at the departed dependent's former tier
    cv_tier: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment
    cv_plan: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment
    rebill_r: >-
      when the invoice issued last was issued rider_rebill_days or more days after the rider's termination date
    bills_rider: >-
      The invoice billed the ended rider when its amount equals, to the cent, that premium with the ended rider priced in, the dental plan being priced at the subscriber's current tier or at the departed dependent's former tier, that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
    rc_recover: >-
      A rider re-billing amount is added when Cascade issued an invoice that still billed the ended rider: when the invoice issued last was issued rider_rebill_days or more days after the rider's termination date and billed the ended rider, the amount is rider_rebill_long; when it was issued one or more days but fewer than rider_rebill_days days after that date and billed it, the amount is rider_rebill_short; otherwise nothing is added.
    post_month: The credit is posted against the coverage month of the invoice issued last
    book_months: >-
      its months covered are the rider months counted above less the rider months already credited, never fewer than zero
    result: >-
      The adjustments below are applied to the standard rider credit in this order: the months it counts and the monthly amount it uses are replaced first, then the deduction below is taken from their product with the remainder floored at 0.00, then the additions below are made; the result is rounded half up to the cent once, at the end.
    ap_record_r: >-
      which the account's arrangement shows either by carrying an AutoPay discount or, where the arrangement does not accept bank draft, by regular automatic bank drafts collected within twelve months before the credit date
    annual_12: >-
      has issued a twelve-month invoice within twelve months before the credit date, only the prepaid months count
    cv_app: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment
    qd_tier: >-
      that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
    qd_old: >-
      the dental plan being priced at the subscriber's current tier or at the departed dependent's former tier
    q_span: its premium is its months covered times the monthly premiums of the plans priced
    q_act_r: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out
    q_vinv: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment
    q_c_rid: >-
      that premium with the ended rider priced in, the dental plan being priced at the subscriber's current tier
    q_c_both: >-
      the dental plan being priced at the subscriber's current tier or at the departed dependent's former tier
    q_dh_tier: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date
    q_dh_plan: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date
    q_dh_app: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date
    q_dh_rate: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date
    q_inscope: >-
      This reading of the invoice issued last is made only on an account on which, for each orthodontic rider plan, its active riders and, separately, its applied riders were either all applied for on or before the invoice's date or all applied for on one date
    qe_e_child: >-
      that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
    qe_t_child: >-
      that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
    qe_e_spouse: >-
      that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
    qe_t_spouse: >-
      that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
    qe_e_domestic_partner: >-
      that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
    qe_t_domestic_partner: >-
      that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
    qe_e_max: >-
      that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first))
  factors:
  - id: rc_months
    effect: method
    decides: rc_months
    bindings:
    - rc_months
    - book_months
    ladder:
    - when: >-
        the arrangement carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date
      method: >-
        count only the prepaid months: whole calendar months from the rider's termination date to the paid-through date
    - when: the account is in a grace period
      method: >-
        count only the months already begun: whole calendar months from the rider's termination date to the credit date, plus one
    - when: otherwise
      method: >-
        count the rider months billed after its end through the last coverage month of the invoice issued last
    baseline:
      rc_months: std_rmonths
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: rc_basis
    effect: parameter
    decides: rc_basis
    bindings:
    - drafts_12r
    - ap_record_r
    - rc_basis
    ladder:
    - when: >-
        the rider months were billed on AutoPay: the arrangement carries an AutoPay discount, or it does not accept bank draft and regular automatic drafts were collected within twelve months
      value: the rider premium less K('autopay_discount_basis') divided equally among the plan units
    - when: the arrangement carries a prepay discount and has issued a twelve-month invoice within twelve months
      value: the rider premium reduced by the prepay discount percentage
    - when: otherwise
      value: the rider premium
    baseline:
      rc_basis: r_rate
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: rc_dup
    effect: parameter
    decides: rc_dup
    bindings:
    - prior_rterm
    - prior_rprepay
    - rc_dup
    ladder:
    - when: termination credits on the rider line were booked since the rider's termination month
      value: the total of those termination credits
    - when: none was, but prepay-unearned credits on the rider line were booked since then
      value: the total of those prepay-unearned credits
    - when: otherwise
      value: '0.00'
    baseline:
      rc_dup: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rc_int
    effect: parameter
    decides: rc_int
    bindings:
    - rlag_days
    - rc_int
    ladder:
    - when: the days from the rider's termination date to the credit date exceed rider_late_days_high
      value: K('rider_rate_high') percent a year of the rider interest base
    - when: they exceed rider_late_days_low but not rider_late_days_high
      value: K('rider_rate_mid') percent a year of the rider interest base
    - when: otherwise
      value: no interest
    baseline:
      rc_int: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: null
  - id: rc_recover
    effect: parameter
    decides: rc_recover
    bindings:
    - cd_tier
    - cd_plan
    - cd_rate
    - cv_tier
    - cv_plan
    - cv_app
    - qe_e_child
    - qe_t_child
    - qe_e_spouse
    - qe_t_spouse
    - qe_e_domestic_partner
    - qe_t_domestic_partner
    - qe_e_max
    - qd_tier
    - qd_old
    - q_span
    - q_act_r
    - q_inscope
    - q_dh_tier
    - q_dh_plan
    - q_dh_app
    - q_dh_rate
    - q_vinv
    - q_c_rid
    - q_c_both
    - rebill_r
    - bills_rider
    - rc_recover
    ladder:
    - when: >-
        the invoice issued last came rider_rebill_days or more days after the rider's termination date and billed the ended rider
      value: K('rider_rebill_long')
    - when: it came one or more but fewer than rider_rebill_days days after that date and billed the ended rider
      value: K('rider_rebill_short')
    - when: otherwise
      value: '0.00'
    baseline:
      rc_recover: '0'
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: vision
  baseline:
    rule: >-
      The rider credit is the rider premium multiplied by the rider months billed after its end, rounded half up to the cent. The rider months billed after its end are the whole calendar months from the month after the month of the rider's termination date through the last coverage month of the invoice issued last (of two issued on the same day, the one recorded first), that last month being the invoice's coverage month advanced by its months covered less one; they are zero when no invoice or no ended rider is on record or when that last month is not later than the termination month. The ended rider is the orthodontic rider funded by the account whose status is terminated, and where more than one is on record, the one with the latest termination date (of two with the same date, the one recorded first); its rider premium is the rider plan's monthly premium per covered person.
    params: []
  inputs:
    history:
    - table: billing_transactions
      aggregate: latest
      field: coverage_month
      filters:
        event_type: billing_invoice_issued
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_premium_credit
        product_line: ortho_rider
    - category: ortho
      table: ortho_riders
      aggregate: latest
      field: termination_date
      filters:
        status: terminated
    cross_category:
    - ortho
    - dental
    - vision
    - dhmo
- id: billing_ext_renewal_payment
  base_policy_refs:
  - billing_evt_payment_application
  - billing_evt_invoicing
  - billing_evt_returned_payment
  - billing_credits_refunds
  overwrite:
  - base_policy: billing_evt_invoicing
    superseded_clause: >-
      Each invoice bills billing_frequency_months whole coverage months starting with the next unbilled month
    replaced_by: >-
      For a vision plan the account holder applies for on an Annual Prepay account after the account's renewal invoice is issued, and only for such a plan, the renewal payment collects its premium as set out below, the renewal year at the prepay discount when the plan starts on the first day of that year, and its months through the end of that year at its monthly premium when it starts later inside that year; every other invoice bills billing_frequency_months whole coverage months starting with the next unbilled month under the base rule.
  - base_policy: billing_evt_payment_application
    superseded_clause: >-
      a month counts as fully paid when the amount applied to it reaches premium_payment_threshold_pct of its net premium
    replaced_by: >-
      For the renewal payment of an Annual Prepay account whose renewal invoice is corrected under this policy, and only for that payment, a renewal month counts as fully paid when the amount applied to it reaches premium_payment_threshold_pct of its premium as corrected below; for every other payment a month counts as fully paid when the amount applied to it reaches premium_payment_threshold_pct of its net premium under the base rule.
  trigger: on_request
  subject:
  - billing_payment_received
  computes: payment_amount
  target_tool: submit_renewal_payment_53926ce3
  params:
    renewal_relief_lookback_months: 24
    renewal_tenure_long_months: 60
    renewal_tenure_mid_months: 36
    renewal_relief_half_pct: 50
  rule: >-
    For a vision plan the account holder applies for on an Annual Prepay account after the account's renewal invoice is issued, and only for such a plan, the renewal payment collects its premium as set out below, the renewal year at the prepay discount when the plan starts on the first day of that year, and its months through the end of that year at its monthly premium when it starts later inside that year; every other invoice bills billing_frequency_months whole coverage months starting with the next unbilled month under the base rule. For the renewal payment of an Annual Prepay account whose renewal invoice is corrected under this policy, and only for that payment, a renewal month counts as fully paid when the amount applied to it reaches premium_payment_threshold_pct of its premium as corrected below; for every other payment a month counts as fully paid when the amount applied to it reaches premium_payment_threshold_pct of its net premium under the base rule. The renewal payment is not
    fixed until the account's ledger carries a dental-line plan-change difference credit posted against the coverage month of the invoice issued last, whenever a dependent dental enrollment the account funds ended for loss of eligibility before that month. The renewal payment is fixed only after the account's ledger carries a rider-line termination credit posted against the coverage month of the invoice issued last, whenever an orthodontic rider the account funds ended before that month. The renewal payment is the account's balance due, rounded half up to the cent and never less than 0.00. The balance due is every invoice, returned payment, returned-payment fee and refund booked on the account, less every payment received and every premium credit booked. The renewal invoice is the invoice issued last (of two issued on the same day, the one recorded first); the renewal year is its coverage months, starting with its coverage month (the renewal start) and running for its months covered, and
    renewal premiums are reduced by the arrangement's prepay discount percentage. A record counts as falling within a number of months before the payment date when the whole calendar months from its date to the payment date, counted the way an anniversary is counted (a month is complete only when a later month reaches the same day number, and the last day of a shorter month does not complete it), are fewer than that number; a month count from one date to a later one is counted the same way. The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first), and the former tier is the coverage tier recorded on that enrollment; the subscriber's current dental tier and plan are those of the subscriber's
    active dental enrollment funded by the account with the latest coverage effective date (of two, the one recorded first), and the tier difference is that plan's monthly premium for the former tier less its premium for the current tier, never less than zero, and zero where no departed dependent or no active subscriber enrollment is on record. The ended rider is the orthodontic rider funded by the account whose status is terminated, the one with the latest termination date (of two with the same date, the one recorded first), and its premium is the rider plan's monthly premium per covered person. The subscriber's vision enrollment is the subscriber's vision enrollment funded by the account that is applied or active (neither terminated nor cancelled), the one with the latest coverage effective date (of two, the one recorded first), priced at the plan's monthly premium for its recorded coverage tier, and nothing where none is on record. The renewal invoice is read against the plans it could
    bill: its premium is its months covered times the monthly premiums of the plans priced, reduced by the prepay discount percentage and rounded half up to the cent, the plans priced being the subscriber's dental plan, each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the renewal invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the renewal invoice's date, and the subscriber's vision enrollment when it was applied for on or before the renewal invoice's date; it bills the former tier when its amount equals, to the cent, that premium with the dental plan priced at the former tier, with or without the ended rider priced in, and it bills the ended rider when its amount
    equals, to the cent, that premium with the ended rider priced in, the dental plan being priced at the current or the former tier. This reading of the renewal invoice is made only on an account on which, for each orthodontic rider plan, its active riders and, separately, its applied riders were either all applied for on or before the renewal invoice's date or all applied for on one date, so that the records show which riders were applied for after that date (when that one date is later, those riders); on any other account the renewal invoice is taken to bill neither the former tier nor the ended rider, so neither the dental saving nor the rider saving is deducted and the renewal payment is otherwise worked out as above. The adjustments below are applied to the standard payment in this order: the deductions below are taken first, then the additions below are made, then the relief below is deducted, and the total is floored at 0.00 and rounded half up to the cent once, at the end. A dental
    saving is deducted when the renewal invoice bills the former tier: when the departed dependent's termination date is before the renewal start, the saving is the renewal invoice's months covered times the tier difference; when that date falls inside the renewal year, the saving is the renewal year's months after the month of that date, being its months covered less the whole calendar months from the renewal start to that date less one, times the tier difference; either saving is reduced by the prepay discount percentage, and otherwise nothing is deducted. A rider saving is deducted when the renewal invoice bills the ended rider: when the rider's termination date is before the renewal start, the saving is the renewal invoice's months covered times the rider premium; when that date falls inside the renewal year, the saving is the renewal year's months after the month of that date, being its months covered less the whole calendar months from the renewal start to that date less one, times
    the rider premium; either saving is reduced by the prepay discount percentage, and otherwise nothing is deducted. The subscriber's vision enrollment is added by its start when it was applied for after the renewal invoice was issued: when it starts on the renewal start, the renewal invoice's months covered times its monthly premium, reduced by the prepay discount percentage, are added; when it starts later inside the renewal year, its months from its start through the renewal year's last month, being the renewal invoice's months covered less the whole calendar months from the renewal start to its start, are added at its monthly premium without the prepay discount, which applies only to a full prepaid year; otherwise nothing is added, an enrollment applied for on or before the renewal invoice's date being billed on that invoice. The returned-payment fee booked last is the fee booked last on the account (of two booked on the same day, the one recorded first), and it counts as booked since
    the renewal invoice when its date is on or after that invoice's date. A standing relief is deducted for an account whose returned payments within renewal_relief_lookback_months months before the payment date are no more than its returned payments within the whole calendar months from the renewal invoice's date to the payment date plus one, both counted the way a record counts as falling within a number of months before the payment date (so a return in the days before the renewal invoice inside the same whole-month count counts with the latter): when the account was opened renewal_tenure_long_months or more whole calendar months before the payment date and the returned-payment fee booked last counts as booked since the renewal invoice, the relief is that fee; when the account was opened at least renewal_tenure_mid_months but fewer than renewal_tenure_long_months whole calendar months before and that fee counts as booked since the renewal invoice, the relief is renewal_relief_half_pct
    percent of that fee; otherwise no relief is deducted. The payment is taken from the account holder by card, as the holder's own payment toward the coming prepaid year.
  prerequisite:
  - problem: billing_ext_dental_tier_credit
    kind: value_input
    gate: bal
    form: state
    policy_source: >-
      The renewal payment is not fixed until the account's ledger carries a dental-line plan-change difference credit posted against the coverage month of the invoice issued last, whenever a dependent dental enrollment the account funds ended for loss of eligibility before that month.
    condition: >-
      The account's billing ledger carries a billing_premium_credit row with product_line dental_ppo, credit_reason plan_change_difference and coverage_month equal to the coverage_month of the latest billing_invoice_issued row, whenever a dependent dental enrollment funded by the account ended for loss of eligibility before that month.
    resolved_by: book_dental_tier_credit_2a6e4a9b
    effect: >-
      Once the dental tier-difference credit is posted, the premium credits in the balance due grow by that credit, so the balance due, and with it the renewal payment, falls by the credit amount.
  - problem: billing_ext_rider_end_credit
    kind: value_input
    gate: bal
    form: state
    policy_source: >-
      The renewal payment is fixed only after the account's ledger carries a rider-line termination credit posted against the coverage month of the invoice issued last, whenever an orthodontic rider the account funds ended before that month.
    condition: >-
      The account's billing ledger carries a billing_premium_credit row with product_line ortho_rider, credit_reason termination_unearned and coverage_month equal to the coverage_month of the latest billing_invoice_issued row, whenever an orthodontic rider funded by the account ended before that month.
    resolved_by: book_rider_end_credit_fb22198c
    effect: >-
      Once the rider credit is posted, the premium credits in the balance due grow by that credit, so the balance due, and with it the renewal payment, falls by the credit amount.
  cross_category:
  - category: dental
    as: branch
    reads:
    - dental_plans.termination_date
    - dental_plans.termination_reason
    - dental_plans.coverage_tier
    - dental_plans.variant_name
    - dental_plans.enrollee_relationship
    note: >-
      The departed dependent's end and former tier and the subscriber's current tier decide the dental-saving tier and its amount.
  - category: ortho
    as: branch
    reads:
    - ortho_riders.termination_date
    - ortho_riders.status
    - ortho_riders.variant_name
    - ortho_riders.application_date
    note: >-
      The ended rider's date and plan and the active riders decide what the renewal invoice billed and the rider saving.
  - category: vision
    as: branch
    reads:
    - vision_plans.application_date
    - vision_plans.coverage_effective_date
    - vision_plans.coverage_tier
    - vision_plans.variant_name
    note: >-
      The subscriber's vision enrollment's application date and start decide the added amount; its recorded tier prices it.
  - category: dhmo
    as: branch
    reads:
    - dhmo_plans.coverage_tier
    - dhmo_plans.variant_name
    - dhmo_plans.application_date
    - dhmo_plans.coverage_effective_date
    - dhmo_plans.enrollee_relationship
    note: >-
      The subscriber's DHMO enrollment, when the account funds one, is priced among the plans the invoice issued last could bill.
