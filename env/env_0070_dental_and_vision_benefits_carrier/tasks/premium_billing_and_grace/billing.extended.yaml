    req_lead: was registered at least invoice_lead_days days before the unit's termination date
    vtc_recover: >-
      A service-recovery amount is added when Cascade billed after it had the termination request on file: when the confirmed voluntary-termination request for the unit's subscriber enrollment, taken as the one registered last (of two registered at the same moment, the one recorded first), was registered at least invoice_lead_days days before the unit's termination date and recover_long_invoices or more months were billed after the termination month, the amount is recover_long; when that request was registered that early and one or more months were billed after the termination month but fewer than recover_long_invoices, the amount is recover_short; otherwise, including where no confirmed request for that enrollment is on record, nothing is added.
    post_month: The credit is posted against the coverage month of the invoice issued last
    book_months: >-
      its months covered are the months counted above less the months already credited, never fewer than zero
    result: >-
      The adjustments below are applied to the standard credit in this order: the amount per month it uses and the months it counts are replaced first, then the deductions below are taken from the product of that amount and those months, with the remainder floored at 0.00, then the additions below are made; the result is rounded half up to the cent once, at the end.
    ap_record: >-
      which the account's arrangement shows either by carrying an AutoPay discount or, where the arrangement does not accept bank draft, by regular automatic bank drafts collected within twelve months before the credit date
    vtc_window: >-
      The months counted are replaced by how the account is billed: on an arrangement that carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date, only the prepaid months count, being the whole calendar months from the unit's termination date to the account's paid-through date, because months beyond the paid-through date are corrected when the coming year is paid, an account with no paid-through date on record being taken under the cases that follow instead; on an account in a grace period whose automatic draft, a returned payment by bank draft that had paid one, three or twelve coverage months, was returned on or after the grace-period start date, the automatic draft stays suspended and the invoice issued last is collected with the grace-cure payment, so every month billed after the termination month counts; otherwise the months counted stay the months billed after the termination month that have begun.
    std_begun: >-
      The months billed after the termination month that have begun are the whole calendar months from the unit's termination date to the credit date plus one, never fewer than zero and never more than the months billed after the termination month, a billed month not yet begun being credited once it begins.
    v_draft_ret: >-
      whose automatic draft, a returned payment by bank draft that had paid one, three or twelve coverage months, was returned on or after the grace-period start date
    v_draft_in_grace: >-
      whose automatic draft, a returned payment by bank draft that had paid one, three or twelve coverage months, was returned on or after the grace-period start date
    v_other: >-
      so the benefits paid are counted only when no vision enrollment of the subscriber other than one whose status is cancelled (an application withdrawn before its start, an application cancelled for an unpaid binder, or a plan returned in the free-look period) has ever been funded by another billing account
  factors:
  - id: vtc_month
    effect: parameter
    decides: vtc_month
    bindings:
    - drafts_12
    - ap_record
    - vtc_month
    ladder:
    - when: >-
        the months were billed on AutoPay: the arrangement carries an AutoPay discount, or it does not accept bank draft and regular automatic bank drafts were collected within twelve months
      value: the filed monthly premium less K('autopay_discount_basis') divided equally among the plan units
    - when: the arrangement carries a prepay discount and has issued a twelve-month invoice within twelve months
      value: the filed monthly premium reduced by the prepay discount percentage
    - when: otherwise
      value: the filed monthly premium
    baseline:
      vtc_month: vt_rate
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: vtc_window
    effect: method
    decides: vtc_window
    bindings:
    - v_draft_ret
    - v_draft_in_grace
    - vtc_window
    - book_months
    ladder:
    - when: >-
        the arrangement carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date
      method: >-
        count only the prepaid months: whole calendar months from the unit's termination date to the paid-through date
    - when: >-
        the account is in a grace period and an automatic draft that had paid coverage months was returned on or after the grace-period start date
      method: >-
        count every month billed after the termination month through the coverage month of the invoice issued last, that invoice being collected with the grace-cure payment
    - when: otherwise
      method: >-
        count the billed months that have begun: whole calendar months from the unit's termination date to the credit date, plus one, no more than the months billed
    baseline:
      vtc_window: std_begun
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: vtc_offset
    effect: method
    decides: vtc_offset
    bindings:
    - cov_window
    - after_window
    - v_other
    - ben_unit
    - ben_12
    - vtc_offset
    ladder:
    - when: >-
        coverage months at least one and no more than offset_first_window_months and benefits in the coverage window exceed the filed premium times the coverage months
      method: >-
        measure the offset over the whole coverage window: benefits there less the filed premium for the coverage months
    - when: >-
        coverage months more than offset_first_window_months and no more than offset_second_window_months and window benefits dated within twelve months exceed twelve months' filed premium
      method: >-
        measure the offset over the last twelve months of the window: those benefits less twelve months of filed premium
    - when: otherwise
      method: no offset is measured
    baseline:
      vtc_offset: '0'
    evidence:
    - cross_category
    - date
    - history
    cross_difficulty: vision
  - id: vtc_prior
    effect: parameter
    decides: vtc_prior
    bindings:
    - prior_term
    - prior_change
    - vtc_prior
    ladder:
    - when: termination credits on the vision line were booked since the unit's termination month
      value: the total of those termination credits
    - when: none was, but plan-change difference credits on the vision line were booked since then
      value: the total of those plan-change difference credits
    - when: otherwise
      value: '0.00'
    baseline:
      vtc_prior: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: vtc_int
    effect: parameter
    decides: vtc_int
    bindings:
    - days_late
    - vtc_int
    ladder:
    - when: the days from the unit's termination date to the credit date exceed late_days_high
      value: K('int_rate_high') percent a year of the interest base
    - when: they exceed late_days_low but not late_days_high
      value: K('int_rate_mid') percent a year of the interest base
    - when: otherwise
      value: no interest
    baseline:
      vtc_int: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: null
  - id: vtc_recover
    effect: parameter
    decides: vtc_recover
    bindings:
    - req_date
    - req_lead
    - vtc_recover
    ladder:
    - when: >-
        the unit's confirmed termination request was registered at least invoice_lead_days days before the termination date and recover_long_invoices or more months were billed after the termination month
      value: K('recover_long')
    - when: >-
        the request was registered that early and one or more but fewer than recover_long_invoices months were billed after the termination month
      value: K('recover_short')
    - when: otherwise
      value: '0.00'
    baseline:
      vtc_recover: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: vision
  baseline:
    rule: >-
      The termination credit for a vision plan unit is the unit's filed monthly premium multiplied by the months billed after its termination month that have begun, rounded half up to the cent. The months billed after the termination month are the whole calendar months from the month after the month of the unit's termination date through the latest coverage month billed on the account, where the latest coverage month billed is the coverage month of the invoice issued last (of two issued on the same day, the one recorded first); they are zero when the account carries no invoice or when that coverage month is not later than the termination month. The months billed after the termination month that have begun are the whole calendar months from the unit's termination date to the credit date plus one, never fewer than zero and never more than the months billed after the termination month, a billed month not yet begun being credited once it begins. The unit's filed monthly premium is the monthly
      premium of the unit's vision plan for the unit's coverage tier.
    params: []
  inputs:
    history:
    - table: billing_transactions
      aggregate: latest
      field: coverage_month
      filters:
        event_type: billing_invoice_issued
    - table: billing_transactions
      aggregate: count
      field: billing_txn_id
      within_months: 12
      filters:
        event_type: billing_payment_received
        payment_method: eft
        payment_purpose: regular
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_premium_credit
        product_line: vision
    - category: vision
      table: vision_claims
      aggregate: sum
      field: plan_paid
      filters:
        remark_code: PAID_OON_REIMBURSEMENT
    - category: vision
      table: vision_coverage_requests
      aggregate: latest
      field: created_at
      filters:
        request_type: voluntary_termination
        request_status: confirmed
    cross_category:
    - vision
    - ortho
- id: billing_ext_grace_cure_payment
  base_policy_refs:
  - billing_evt_invoicing
  - billing_evt_payment_application
  - billing_evt_returned_payment
  - billing_grace_and_lapse
  overwrite:
  - base_policy: billing_evt_invoicing
    superseded_clause: AutoPay accounts receive autopay_discount_monthly off each billed month
    replaced_by: >-
      When a grace-cure payment withdraws an AutoPay discount under this policy, the discount is added back to the months this policy names, being past-due months and the not-yet-begun month of the invoice issued last, and only to those months; every other billed month of an AutoPay account keeps its monthly AutoPay discount under the base rule.
  - base_policy: billing_evt_payment_application
    superseded_clause: A payment is applied to the oldest unpaid coverage month first
    replaced_by: >-
      For the grace-cure payment of an individual-market account in a grace period, and only for that payment, an earlier grace-cure payment by check or bank transfer that is still inside the clearing hold below is applied to the oldest unpaid coverage month only once it clears and is not counted toward the grace-cure payment; every other payment is applied to the oldest unpaid coverage month first under the base rule.
  trigger: on_request
  subject:
  - billing_payment_received
  computes: payment_amount
  target_tool: submit_grace_cure_payment_5521c4c8
  params:
    autopay_discount_withdrawn: 1.0
    hold_days_long: 10
    hold_days_short: 5
    hold_return_days: 60
    tenure_long_months: 60
    tenure_mid_months: 36
    relief_half_pct: 50
  rule: >-
    When a grace-cure payment withdraws an AutoPay discount under this policy, the discount is added back to the months this policy names, being past-due months and the not-yet-begun month of the invoice issued last, and only to those months; every other billed month of an AutoPay account keeps its monthly AutoPay discount under the base rule. For the grace-cure payment of an individual-market account in a grace period, and only for that payment, an earlier grace-cure payment by check or bank transfer that is still inside the clearing hold below is applied to the oldest unpaid coverage month only once it clears and is not counted toward the grace-cure payment; every other payment is applied to the oldest unpaid coverage month first under the base rule. The grace-cure payment is fixed only after the account's ledger carries a vision-line termination credit posted against the coverage month of the invoice issued last, whenever a vision plan unit the account funds ended by voluntary termination
    before that month. The grace-cure payment is the premium past due on the account for the coverage months that have begun, rounded half up to the cent. The premium past due for the coverage months that have begun is every invoice the account carries plus every returned payment and every refund, less every payment received and every premium credit booked, leaving out returned-payment fees and leaving out the invoice issued last when its coverage month has not yet begun (of two invoices issued on the same day, the one recorded first counts as issued last). A record counts as falling within a number of months before the payment date when the whole calendar months from its date to the payment date, counted the way an anniversary is counted (a month is complete only when a later month reaches the same day number, and the last day of a shorter month does not complete it), are fewer than that number. An automatic draft is a returned payment by bank draft that had paid one or more coverage months,
    whether one, three or twelve, its latest return being the one dated last; the returned-payment fee booked last is the fee booked last on the account (of two booked on the same day, the one recorded first), and it counts as booked in the grace period when its date is on or after the grace-period start date. The account left AutoPay when its arrangement carries no AutoPay discount and does not accept bank draft and the account nevertheless collected at least one regular automatic draft within twelve months before the payment date, which only the AutoPay arrangement it was moved from when automatic draft was removed could have collected. The adjustments below are applied to the standard payment in this order: the additions below are made first, then the deduction below is taken, and the total is floored at 0.00 and rounded half up to the cent once, at the end. The invoice issued last is added by how the grace period arose: when an automatic draft was returned on or after the grace-period
    start date and the invoice issued last is for a coverage month that has not yet begun, the automatic draft stays suspended until the grace period is cured and that invoice is added in full; when no automatic draft was returned on or after the grace-period start date, the arrangement carries an AutoPay discount, two or more payments taken as grace-cure payments are booked within twelve months before the payment date and the invoice issued last is for a coverage month that has not yet begun, that month is still drafted but the repeated grace-cure payments forfeit its AutoPay discount, so only the arrangement's monthly AutoPay discount on that invoice is added; otherwise nothing is added for it. An AutoPay discount is withdrawn and added: when two or more payments of the account by bank draft or card were returned within twelve months before the payment date, and the account left AutoPay, twice autopay_discount_withdrawn is added, for the oldest past-due month and the month after it, both
    billed with the discount; when the arrangement carries an AutoPay discount and a payment taken as a grace-cure payment was received on or after the grace-period start date, the arrangement's monthly AutoPay discount is added once, for the oldest past-due month; otherwise nothing is added. Returned-payment fees are collected according to how the account pays: when the account left AutoPay, every returned-payment fee booked within twelve months before the payment date is collected, because removal of automatic draft settles the returned items counted toward it; when the arrangement carries no AutoPay discount otherwise, the returned-payment fee booked last is collected when it counts as booked in the grace period; otherwise, on an arrangement that drafts, no fee is collected, the next automatic draft collecting it once the grace period is cured. A standing relief is deducted for an account whose returned payments within twenty-four months before the payment date are no more than its returned
    payments within the whole calendar months from the grace-period start date to the payment date plus one, both counted the way a record counts as falling within a number of months before the payment date (so a return in the last days of the month before the grace-period start counts with the latter, and one dated exactly twenty-four whole months before the payment date with neither): when the account was opened tenure_long_months or more whole calendar months before the payment date and the returned-payment fee booked last counts as booked in the grace period, the relief is that fee; when the account was opened at least tenure_mid_months but fewer than tenure_long_months whole calendar months before and that fee counts as booked in the grace period, the relief is relief_half_pct percent of that fee; otherwise no relief is deducted. A grace-cure payment by check or bank transfer is held until it clears, and a held payment is added back because it does not count: the hold is hold_days_long
    days when a payment of the account was returned within hold_return_days days before the payment date, hold_days_short days when the account has a returned payment on record but none within hold_return_days days, and no hold otherwise; the payment held is found this way: take the account's latest grace-cure payment by check and its latest grace-cure payment by bank transfer (of two of one kind on the same day, the one recorded first); set aside either one that a returned payment on the account names as the payment it returns, without taking an earlier payment of that kind in its place; of those not set aside, the later one is the payment held (of a check and a transfer on the same day, the check), and it is held when the days from its receipt to the payment date are fewer than the hold. The payment is taken from the account holder by card, as the holder's own payment, and is booked as a grace-cure payment.
  prerequisite:
  - problem: billing_ext_vision_term_credit
    kind: value_input
    gate: past_due
    form: state
    policy_source: >-
      The grace-cure payment is fixed only after the account's ledger carries a vision-line termination credit posted against the coverage month of the invoice issued last, whenever a vision plan unit the account funds ended by voluntary termination before that month.
    condition: >-
      The account's billing ledger carries a billing_premium_credit row with product_line vision, credit_reason termination_unearned and coverage_month equal to the coverage_month of the latest billing_invoice_issued row, whenever a subscriber vision enrollment funded by the account ended by voluntary termination before that month.
    resolved_by: book_vision_term_credit_956578a0
    effect: >-
      Once the vision termination credit is posted, the premium credits summed into the premium past due grow by that credit, so the past-due premium, and with it the grace-cure payment, falls by the credit amount.
  cross_category: []
  compute:
  - inv_all: SUM('billing_transactions','amount', event_type='billing_invoice_issued')
  - ret_all: SUM('billing_transactions','amount', event_type='billing_payment_returned')
  - ref_all: SUM('billing_transactions','amount', event_type='billing_refund_issued')
  - pay_all: SUM('billing_transactions','amount', event_type='billing_payment_received')
  - cred_all: SUM('billing_transactions','amount', event_type='billing_premium_credit')
  - last_cov: >-
      LATEST('billing_transactions','coverage_month', date_field='txn_date', event_type='billing_invoice_issued')
  - last_amt: LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_invoice_issued')
  - last_future: last_cov != None and last_cov > NOW
  - past_due: inv_all + ret_all + ref_all - pay_all - cred_all - (last_amt if last_future else 0)
  - gstart: F('grace_period_start_date')
  - last_fee: >-
      LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_returned_payment_fee')
  - last_fee_date: >-
      LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_returned_payment_fee')
  - fee_in_grace: last_fee_date != None and gstart != None and gstart != '' and DAYS(gstart, last_fee_date) >= 0
  - grace_window: 0 if (gstart == None or gstart == '') else MONTHS(gstart, NOW) + 1
  - last_draft_ret: >-
      MX((LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_returned', payment_method='eft', months_covered=1) or ''), (LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_returned', payment_method='eft', months_covered=3) or ''), (LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_returned', payment_method='eft', months_covered=12) or ''))
  - draft_ret_in_grace: last_draft_ret != '' and gstart != None and gstart != '' and DAYS(gstart, last_draft_ret) >= 0
  - cures_12: >-
      COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_received', payment_purpose='grace_cure')
  - g_next: >-
      last_amt if (draft_ret_in_grace and last_future) else ((P('autopay_discount_monthly')) if ((not draft_ret_in_grace) and P('autopay_discount_monthly') > 0 and cures_12 >= 2 and last_future) else 0)
  - bank_rets_12: >-
      COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_returned', payment_method='eft') + COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_returned', payment_method='card')
  - last_cure_pay: >-
      LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_received', payment_purpose='grace_cure')
  - cure_in_grace: last_cure_pay != None and gstart != None and gstart != '' and DAYS(gstart, last_cure_pay) >= 0
  - drafts_hist: >-
      COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_received', payment_method='eft', payment_purpose='regular')
  - left_ap: >-
      P('autopay_discount_monthly') == 0 and ('eft' not in P('accepted_payment_methods')) and drafts_hist >= 1
  - g_disc: >-
      (2 * K('autopay_discount_withdrawn')) if (bank_rets_12 >= 2 and left_ap) else (P('autopay_discount_monthly') if (P('autopay_discount_monthly') > 0 and cure_in_grace) else 0)
  - fees_12: >-
      SUM('billing_transactions','amount', within_months=12, date_field='txn_date', event_type='billing_returned_payment_fee')
  - g_fee: >-
      fees_12 if left_ap else ((last_fee if fee_in_grace else 0) if P('autopay_discount_monthly') == 0 else 0)
  - open_months: MONTHS(F('opened_date'), NOW)
  - rets_before: >-
      COUNT('billing_transactions', within_months=24, date_field='txn_date', event_type='billing_payment_returned') - COUNT('billing_transactions', within_months=grace_window, date_field='txn_date', event_type='billing_payment_returned')
  - g_relief: >-
      last_fee if (open_months >= K('tenure_long_months') and rets_before <= 0 and fee_in_grace) else ((last_fee * K('relief_half_pct') / 100) if (open_months >= K('tenure_mid_months') and open_months < K('tenure_long_months') and rets_before <= 0 and fee_in_grace) else 0)
  - any_ret: COUNT('billing_transactions', event_type='billing_payment_returned')
  - last_ret_any: >-
      LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_returned')
  - ret_days: 9999 if last_ret_any == None else DAYS(last_ret_any, NOW)
  - g_hold: >-
      K('hold_days_long') if (any_ret >= 1 and ret_days <= K('hold_return_days')) else (K('hold_days_short') if (any_ret >= 1 and ret_days > K('hold_return_days')) else 0)
  - hc_date: >-
      LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_received', payment_purpose='grace_cure', payment_method='check')
  - hc_amt: >-
      LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_payment_received', payment_purpose='grace_cure', payment_method='check')
  - hc_id: >-
      LATEST('billing_transactions','billing_txn_id', date_field='txn_date', event_type='billing_payment_received', payment_purpose='grace_cure', payment_method='check')
  - he_date: >-
      LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_received', payment_purpose='grace_cure', payment_method='eft')
  - he_amt: >-
      LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_payment_received', payment_purpose='grace_cure', payment_method='eft')
  - he_id: >-
      LATEST('billing_transactions','billing_txn_id', date_field='txn_date', event_type='billing_payment_received', payment_purpose='grace_cure', payment_method='eft')
  - hc_ok: >-
      hc_id != None and COUNT('billing_transactions', event_type='billing_payment_returned', original_billing_txn_id=hc_id) == 0
  - he_ok: >-
      he_id != None and COUNT('billing_transactions', event_type='billing_payment_returned', original_billing_txn_id=he_id) == 0
  - pick_check: hc_ok and ((not he_ok) or hc_date >= he_date)
  - held_amt: >-
      (hc_amt if DAYS(hc_date, NOW) < g_hold else 0) if pick_check else ((he_amt if DAYS(he_date, NOW) < g_hold else 0) if he_ok else 0)
  - result: RND(MX(0, past_due + g_next + g_disc + g_fee + held_amt - g_relief), 2)
  compute_basis:
    inv_all: >-
      every invoice the account carries plus every returned payment and every refund, less every payment received and every premium credit booked
    ret_all: plus every returned payment and every refund
    ref_all: plus every returned payment and every refund
    pay_all: less every payment received and every premium credit booked
    cred_all: less every payment received and every premium credit booked
    last_cov: (of two invoices issued on the same day, the one recorded first counts as issued last)
    last_amt: (of two invoices issued on the same day, the one recorded first counts as issued last)
    last_future: leaving out the invoice issued last when its coverage month has not yet begun
    past_due: >-
      The premium past due for the coverage months that have begun is every invoice the account carries plus every returned payment and every refund, less every payment received and every premium credit booked, leaving out returned-payment fees and leaving out the invoice issued last when its coverage month has not yet begun (of two invoices issued on the same day, the one recorded first counts as issued last).
    gstart: when an automatic draft was returned on or after the grace-period start date
    last_fee: >-
      the returned-payment fee booked last is the fee booked last on the account (of two booked on the same day, the one recorded first)
    last_fee_date: it counts as booked in the grace period when its date is on or after the grace-period start date
    fee_in_grace: it counts as booked in the grace period when its date is on or after the grace-period start date
    grace_window: within the whole calendar months from the grace-period start date to the payment date plus one
    last_draft_ret: >-
      An automatic draft is a returned payment by bank draft that had paid one or more coverage months, whether one, three or twelve, its latest return being the one dated last
    draft_ret_in_grace: when an automatic draft was returned on or after the grace-period start date
    cures_12: >-
      two or more payments taken as grace-cure payments are booked within twelve months before the payment date
    g_next: >-
      The invoice issued last is added by how the grace period arose: when an automatic draft was returned on or after the grace-period start date and the invoice issued last is for a coverage month that has not yet begun, the automatic draft stays suspended until the grace period is cured and that invoice is added in full; when no automatic draft was returned on or after the grace-period start date, the arrangement carries an AutoPay discount, two or more payments taken as grace-cure payments are booked within twelve months before the payment date and the invoice issued last is for a coverage month that has not yet begun, that month is still drafted but the repeated grace-cure payments forfeit its AutoPay discount, so only the arrangement's monthly AutoPay discount on that invoice is added; otherwise nothing is added for it.
    bank_rets_12: >-
      when two or more payments of the account by bank draft or card were returned within twelve months before the payment date
    drafts_hist: >-
      the account nevertheless collected at least one regular automatic draft within twelve months before the payment date
    last_cure_pay: a payment taken as a grace-cure payment was received on or after the grace-period start date
    cure_in_grace: a payment taken as a grace-cure payment was received on or after the grace-period start date
    g_disc: >-
      An AutoPay discount is withdrawn and added: when two or more payments of the account by bank draft or card were returned within twelve months before the payment date, and the account left AutoPay, twice autopay_discount_withdrawn is added, for the oldest past-due month and the month after it, both billed with the discount; when the arrangement carries an AutoPay discount and a payment taken as a grace-cure payment was received on or after the grace-period start date, the arrangement's monthly AutoPay discount is added once, for the oldest past-due month; otherwise nothing is added.
    open_months: when the account was opened tenure_long_months or more whole calendar months before the payment date
    rets_before: >-
      whose returned payments within twenty-four months before the payment date are no more than its returned payments within the whole calendar months from the grace-period start date to the payment date plus one
    g_relief: >-
      A standing relief is deducted for an account whose returned payments within twenty-four months before the payment date are no more than its returned payments within the whole calendar months from the grace-period start date to the payment date plus one, both counted the way a record counts as falling within a number of months before the payment date (so a return in the last days of the month before the grace-period start counts with the latter, and one dated exactly twenty-four whole months before the payment date with neither): when the account was opened tenure_long_months or more whole calendar months before the payment date and the returned-payment fee booked last counts as booked in the grace period, the relief is that fee; when the account was opened at least tenure_mid_months but fewer than tenure_long_months whole calendar months before and that fee counts as booked in the grace period, the relief is relief_half_pct percent of that fee; otherwise no relief is deducted.
    any_ret: >-
      hold_days_short days when the account has a returned payment on record but none within hold_return_days days
    last_ret_any: when a payment of the account was returned within hold_return_days days before the payment date
    ret_days: when a payment of the account was returned within hold_return_days days before the payment date
    g_hold: >-
      the hold is hold_days_long days when a payment of the account was returned within hold_return_days days before the payment date, hold_days_short days when the account has a returned payment on record but none within hold_return_days days, and no hold otherwise
    hc_date: >-
      take the account's latest grace-cure payment by check and its latest grace-cure payment by bank transfer (of two of one kind on the same day, the one recorded first)
    hc_amt: >-
      take the account's latest grace-cure payment by check and its latest grace-cure payment by bank transfer (of two of one kind on the same day, the one recorded first)
    he_date: >-
      take the account's latest grace-cure payment by check and its latest grace-cure payment by bank transfer (of two of one kind on the same day, the one recorded first)
    he_amt: >-
      take the account's latest grace-cure payment by check and its latest grace-cure payment by bank transfer (of two of one kind on the same day, the one recorded first)
    pick_check: >-
      of those not set aside, the later one is the payment held (of a check and a transfer on the same day, the check)
    held_amt: and it is held when the days from its receipt to the payment date are fewer than the hold
    result: >-
      The adjustments below are applied to the standard payment in this order: the additions below are made first, then the deduction below is taken, and the total is floored at 0.00 and rounded half up to the cent once, at the end.
    hc_ok: >-
      set aside either one that a returned payment on the account names as the payment it returns, without taking an earlier payment of that kind in its place
    he_ok: >-
      set aside either one that a returned payment on the account names as the payment it returns, without taking an earlier payment of that kind in its place
    left_ap: >-
      The account left AutoPay when its arrangement carries no AutoPay discount and does not accept bank draft and the account nevertheless collected at least one regular automatic draft within twelve months before the payment date, which only the AutoPay arrangement it was moved from when automatic draft was removed could have collected
    fees_12: every returned-payment fee booked within twelve months before the payment date is collected
    g_fee: >-
      Returned-payment fees are collected according to how the account pays: when the account left AutoPay, every returned-payment fee booked within twelve months before the payment date is collected, because removal of automatic draft settles the returned items counted toward it; when the arrangement carries no AutoPay discount otherwise, the returned-payment fee booked last is collected when it counts as booked in the grace period; otherwise, on an arrangement that drafts, no fee is collected, the next automatic draft collecting it once the grace period is cured.
    hc_id: >-
      take the account's latest grace-cure payment by check and its latest grace-cure payment by bank transfer (of two of one kind on the same day, the one recorded first)
    he_id: >-
      take the account's latest grace-cure payment by check and its latest grace-cure payment by bank transfer (of two of one kind on the same day, the one recorded first)
  factors:
  - id: g_next
    effect: method
    decides: g_next
    bindings:
    - last_draft_ret
    - draft_ret_in_grace
    - cures_12
    - g_next
    ladder:
    - when: >-
        an automatic draft was returned on or after the grace-period start date and the invoice issued last is for a coverage month that has not yet begun
      method: >-
        add the invoice issued last in full, the automatic draft staying suspended until the grace period is cured
    - when: >-
        no automatic draft was returned on or after the grace-period start date, the arrangement carries an AutoPay discount, two or more grace-cure payments are booked within twelve months, and the invoice issued last is for a coverage month that has not yet begun
      method: >-
        add only the arrangement's monthly AutoPay discount on the invoice issued last, the month itself still being drafted
    - when: otherwise
      method: add nothing for the invoice issued last
    baseline:
      g_next: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: g_disc
    effect: parameter
    decides: g_disc
    bindings:
    - bank_rets_12
    - last_cure_pay
    - cure_in_grace
    - g_disc
    ladder:
    - when: >-
        two or more bank-draft or card payments were returned within twelve months and the account left AutoPay
      value: 2 * K('autopay_discount_withdrawn')
    - when: >-
        the arrangement carries an AutoPay discount and a grace-cure payment was received on or after the grace-period start date
      value: P('autopay_discount_monthly')
    - when: otherwise
      value: '0.00'
    baseline:
      g_disc: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: g_fee
    effect: parameter
    decides: g_fee
    bindings:
    - fees_12
    - g_fee
    ladder:
    - when: the account left AutoPay
      value: every returned-payment fee booked within twelve months before the payment date
    - when: the arrangement carries no AutoPay discount otherwise
      value: the returned-payment fee booked last, when it counts as booked in the grace period
    - when: otherwise (an arrangement that drafts)
      value: '0.00'
    baseline:
      g_fee: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: g_relief
    effect: parameter
    decides: g_relief
    bindings:
    - open_months
    - rets_before
    - g_relief
    ladder:
    - when: >-
        no more returned payments within twenty-four months than within the grace window, the account opened tenure_long_months or more whole months before, and the fee booked last booked in the grace period
      value: the returned-payment fee booked last
    - when: >-
        no more returned payments within twenty-four months than within the grace window, the account opened at least tenure_mid_months but fewer than tenure_long_months whole months before, and that fee booked in the grace period
      value: relief_half_pct percent of the returned-payment fee booked last
    - when: otherwise
      value: '0.00'
    baseline:
      g_relief: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: g_hold
    effect: parameter
    decides: held_amt
    bindings:
    - any_ret
    - last_ret_any
    - ret_days
    - g_hold
    - hc_date
    - hc_amt
    - he_date
    - he_amt
    - hc_id
    - he_id
    - hc_ok
    - he_ok
    - pick_check
    - held_amt
    ladder:
    - when: a payment of the account was returned within hold_return_days days before the payment date
      value: K('hold_days_long') days
    - when: a returned payment is on record but none within hold_return_days days
      value: K('hold_days_short') days
    - when: otherwise
      value: no hold
    baseline:
      held_amt: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The grace-cure payment is the premium past due on the account for the coverage months that have begun, rounded half up to the cent. The premium past due for the coverage months that have begun is every invoice the account carries plus every returned payment and every refund, less every payment received and every premium credit booked, leaving out returned-payment fees and leaving out the invoice issued last when its coverage month has not yet begun (of two invoices issued on the same day, the one recorded first counts as issued last).
    params: []
  inputs:
    history:
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_invoice_issued
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_payment_received
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_premium_credit
    - table: billing_transactions
      aggregate: count
      field: billing_txn_id
      within_months: 12
      filters:
        event_type: billing_payment_returned
    - table: billing_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: billing_returned_payment_fee
    cross_category: []
- id: billing_ext_dental_tier_credit
  base_policy_refs:
  - billing_agg_credit_application
  - billing_credits_refunds
  overwrite:
  - base_policy: billing_credits_refunds
    superseded_clause: plan_change_difference credits the difference when a plan change lowers premium already billed
    replaced_by: >-
      For a dental plan unit whose coverage tier dropped because a dependent's dental enrollment ended for loss of eligibility, and only for such a drop, this policy settles the tier-difference credit; every other plan-change difference credit remains under the base rule, which credits the difference when a plan change lowers premium already billed.
  trigger: state_due
  subject:
  - billing_premium_credit
  computes: credit_amount
  target_tool: book_dental_tier_credit_2a6e4a9b
  params:
    lag_days_low: 30
    lag_days_high: 90
    lag_rate_mid: 10
    lag_rate_high: 15
    rebill_days_long: 60
    rebill_amount_long: 25.0
    rebill_amount_short: 10.0
  rule: >-
    For a dental plan unit whose coverage tier dropped because a dependent's dental enrollment ended for loss of eligibility, and only for such a drop, this policy settles the tier-difference credit; every other plan-change difference credit remains under the base rule, which credits the difference when a plan change lowers premium already billed. The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, and where more than one such enrollment is on record, the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first); the tier billed before the drop is the coverage tier recorded on that dependent's enrollment. The tier after the drop and the plan are those recorded on the subscriber's active dental enrollment funded by the account, taken as the one with the latest coverage effective
    date (of two with the same date, the one recorded first). The tier difference per month is the plan's monthly premium for the tier billed before the drop less its monthly premium for the tier after the drop, never less than zero; it is zero where no departed dependent or no active subscriber enrollment is on record. A record counts as falling within a number of months before the credit date when the whole calendar months from its date to the credit date, counted the way an anniversary is counted (a month is complete only when a later month reaches the same day number, and the last day of a shorter month does not complete it), are fewer than that number. The tier-difference credit is the tier difference per month multiplied by the months billed after the drop, rounded half up to the cent. The months billed after the drop are the whole calendar months from the month after the month of the departed dependent's termination date through the last coverage month of the invoice issued last (of
    two issued on the same day, the one recorded first), that last month being the invoice's coverage month advanced by its months covered less one; they are zero when no departed dependent or no invoice is on record, or when that last month is not later than the termination month. The months already credited are the months covered by plan-change difference credits on the dental line booked since the departed dependent's termination month, a credit counting as booked since that month when the whole calendar months from its booking date to the credit date are no more than the whole calendar months from the dependent's termination date to the credit date. The adjustments below are applied to the standard credit in this order: the amount per month it uses and the months it counts are replaced first, then the deduction below is taken from the product of that amount and those months with the remainder floored at 0.00, then the additions below are made; the result is rounded half up to the cent
    once, at the end. The months counted are replaced by how the account is billed: on an arrangement that carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date, only the prepaid months count, being the whole calendar months from the departed dependent's termination date to the account's paid-through date, because months beyond the paid-through date are corrected when the coming year is paid, an account with no paid-through date on record being taken under the cases that follow instead; on an account in a grace period, only the months already begun count, being the whole calendar months from the dependent's termination date to the credit date plus one; otherwise the months counted stay the months billed after the drop. The amount per month is replaced by how the months were billed: on an arrangement that carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date, the amount per month is
    the tier difference per month reduced by the prepay discount percentage, because the prepaid months were billed at that discount; on an exchange account that receives advance premium tax credit, the amount per month is the plan's premium for the tier billed before the drop less the account's monthly advance premium tax credit, never below zero, less its premium for the tier after the drop less that credit, never below zero, because each month was billed net of the credit; otherwise the amount per month stays the tier difference per month. Tier-difference credits already booked are deducted: when plan-change difference credits on the dental line were booked since the departed dependent's termination month, their total is deducted; when none was but termination credits on the dental line were booked since then, their total is deducted; otherwise nothing is deducted. The lag interest base is the tier difference per month reduced by the prepay discount percentage for each prepaid month after
    the dependent's termination date that is not among the months already credited, counted as the whole calendar months from that termination date to the paid-through date less the months already credited (never fewer than zero, and zero where no paid-through date is on record), running for the days from that termination date to the credit date beyond lag_days_low, on an actual-days basis over 365. Interest is added when the drop is credited late: when the days from the departed dependent's termination date to the credit date exceed lag_days_high, the interest is lag_rate_high percent a year of the lag interest base; when they exceed lag_days_low but not lag_days_high, it is lag_rate_mid percent a year of the lag interest base; otherwise no interest is added. The invoice issued last is read against the plans it could bill: its premium is its months covered times the monthly premiums of the plans priced, reduced by the prepay discount percentage and rounded half up to the cent, the plans
    priced being the subscriber's dental plan, each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date. The invoice billed the tier before the drop when its amount equals, to the cent, that premium with the dental plan priced at the tier billed before the drop, with or without the ended orthodontic rider (the account's terminated
    rider with the latest termination date, the one recorded first on a tie) priced in at its plan's monthly premium per covered person. This reading of the invoice issued last is made only on an account on which, for each orthodontic rider plan, its active riders and, separately, its applied riders were either all applied for on or before the invoice's date or all applied for on one date, so that the records show which riders were applied for after that date (when that one date is later, those riders); on any other account the invoice is not taken to have billed the tier before the drop and no re-billing amount is added, the credit being otherwise worked out as above. A re-billing amount is added when Cascade issued an invoice that still billed the dropped tier: when the invoice issued last was issued rebill_days_long or more days after the departed dependent's termination date and billed the tier before the drop, the amount is rebill_amount_long; when it was issued one or more days but
    fewer than rebill_days_long days after that date and billed that tier, the amount is rebill_amount_short; otherwise nothing is added. The credit is posted against the coverage month of the invoice issued last, and its months covered are the months counted above less the months already credited, never fewer than zero.
  prerequisite: []
  cross_category:
  - category: dental
    as: history
    reads:
    - dental_plans.coverage_tier
    - dental_plans.enrollee_relationship
    - dental_plans.termination_date
    - dental_plans.termination_reason
    - dental_plans.variant_name
    note: >-
      The departed dependent's end date and tier and the subscriber's tier and plan set the difference, the months and every lateness tier.
  - category: ortho
    as: branch
    reads:
    - ortho_riders.status
    - ortho_riders.variant_name
    - ortho_riders.termination_date
    - ortho_riders.application_date
    note: Active riders and the ended rider price the plans the invoice issued last could bill.
  - category: vision
    as: branch
    reads:
    - vision_plans.coverage_tier
    - vision_plans.variant_name
    - vision_plans.application_date
    - vision_plans.coverage_effective_date
    note: >-
      The subscriber's vision enrollment applied on or before the invoice's date prices the plans the invoice could bill.
  - category: dhmo
    as: branch
    reads:
    - dhmo_plans.coverage_tier
    - dhmo_plans.variant_name
    - dhmo_plans.application_date
    - dhmo_plans.coverage_effective_date
    - dhmo_plans.enrollee_relationship
    note: >-
      The subscriber's DHMO enrollment, when the account funds one, is priced among the plans the invoice issued last could bill.
  compute:
  - dl_e_child: >-
      XLATEST('dental','dental_plans','termination_date', date_field='termination_date', billing_account_id=HID, termination_reason='loss_of_eligibility', enrollee_relationship='child')
  - dl_t_child: >-
      XLATEST('dental','dental_plans','coverage_tier', date_field='termination_date', billing_account_id=HID, termination_reason='loss_of_eligibility', enrollee_relationship='child')
  - dl_e_spouse: >-
      XLATEST('dental','dental_plans','termination_date', date_field='termination_date', billing_account_id=HID, termination_reason='loss_of_eligibility', enrollee_relationship='spouse')
  - dl_t_spouse: >-
      XLATEST('dental','dental_plans','coverage_tier', date_field='termination_date', billing_account_id=HID, termination_reason='loss_of_eligibility', enrollee_relationship='spouse')
  - dl_e_domestic_partner: >-
      XLATEST('dental','dental_plans','termination_date', date_field='termination_date', billing_account_id=HID, termination_reason='loss_of_eligibility', enrollee_relationship='domestic_partner')
  - dl_t_domestic_partner: >-
      XLATEST('dental','dental_plans','coverage_tier', date_field='termination_date', billing_account_id=HID, termination_reason='loss_of_eligibility', enrollee_relationship='domestic_partner')
  - dl_e_max: MX((dl_e_child or ''), (dl_e_spouse or ''), (dl_e_domestic_partner or ''))
  - dep_end: None if dl_e_max == '' else dl_e_max
  - dep_tier: >-
      dl_t_child if (dl_e_child != None and dl_e_child == dl_e_max) else (dl_t_spouse if (dl_e_spouse != None and dl_e_spouse == dl_e_max) else (dl_t_domestic_partner if (dl_e_domestic_partner != None and dl_e_domestic_partner == dl_e_max) else None))
  - sub_tier: >-
      XLATEST('dental','dental_plans','coverage_tier', date_field='coverage_effective_date', billing_account_id=HID, enrollee_relationship='subscriber', status='active')
  - sub_plan: >-
      XLATEST('dental','dental_plans','variant_name', date_field='coverage_effective_date', billing_account_id=HID, enrollee_relationship='subscriber', status='active')
  - old_rate: >-
      0 if (dep_tier == None or sub_plan == None) else (CPARAM('dental','monthly_premium_member_only', variant_name=sub_plan) if dep_tier == 'member_only' else (CPARAM('dental','monthly_premium_member_spouse', variant_name=sub_plan) if dep_tier == 'member_spouse' else (CPARAM('dental','monthly_premium_member_children', variant_name=sub_plan) if dep_tier == 'member_children' else CPARAM('dental','monthly_premium_family', variant_name=sub_plan))))
  - new_rate: >-
      0 if (sub_tier == None or sub_plan == None) else (CPARAM('dental','monthly_premium_member_only', variant_name=sub_plan) if sub_tier == 'member_only' else (CPARAM('dental','monthly_premium_member_spouse', variant_name=sub_plan) if sub_tier == 'member_spouse' else (CPARAM('dental','monthly_premium_member_children', variant_name=sub_plan) if sub_tier == 'member_children' else CPARAM('dental','monthly_premium_family', variant_name=sub_plan))))
  - disc: (100 - P('prepay_discount_pct')) / 100
  - tier_diff: 0 if (dep_end == None or sub_tier == None or sub_plan == None) else MX(0, old_rate - new_rate)
  - aptc: F('aptc_monthly_amount') or 0
  - net_old: >-
      0 if dep_end == None else MX(0, (0 if (dep_tier == None or sub_plan == None) else (CPARAM('dental','monthly_premium_member_only', variant_name=sub_plan) if dep_tier == 'member_only' else (CPARAM('dental','monthly_premium_member_spouse', variant_name=sub_plan) if dep_tier == 'member_spouse' else (CPARAM('dental','monthly_premium_member_children', variant_name=sub_plan) if dep_tier == 'member_children' else CPARAM('dental','monthly_premium_family', variant_name=sub_plan))))) - aptc)
  - net_new: >-
      0 if dep_end == None else MX(0, (0 if (sub_tier == None or sub_plan == None) else (CPARAM('dental','monthly_premium_member_only', variant_name=sub_plan) if sub_tier == 'member_only' else (CPARAM('dental','monthly_premium_member_spouse', variant_name=sub_plan) if sub_tier == 'member_spouse' else (CPARAM('dental','monthly_premium_member_children', variant_name=sub_plan) if sub_tier == 'member_children' else CPARAM('dental','monthly_premium_family', variant_name=sub_plan))))) - aptc)
  - annual_12: >-
      COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_invoice_issued', months_covered=12)
  - month_diff: >-
      (tier_diff * disc) if (P('prepay_discount_pct') > 0 and annual_12 >= 1) else (MX(0, net_old - net_new) if (P('aptc_eligible') and aptc > 0) else tier_diff)
  - last_cov: >-
      LATEST('billing_transactions','coverage_month', date_field='txn_date', event_type='billing_invoice_issued')
  - last_span: >-
      LATEST('billing_transactions','months_covered', date_field='txn_date', event_type='billing_invoice_issued')
  - paid_thru: F('paid_through_date')
  - std_months: >-
      0 if (dep_end == None or last_cov == None) else MX(0, MONTHS(dep_end, last_cov + '-01') + int(last_span))
  - since_dep: 0 if dep_end == None else MONTHS(dep_end, NOW) + 1
  - prior_months: >-
      SUM('billing_transactions','months_covered', within_months=since_dep, date_field='txn_date', event_type='billing_premium_credit', product_line='dental_ppo', credit_reason='plan_change_difference')
  - dtc_window: >-
      MX(0, MONTHS(dep_end, paid_thru)) if (dep_end != None and paid_thru != None and paid_thru != '' and P('prepay_discount_pct') > 0 and annual_12 >= 1) else ((MX(0, MONTHS(dep_end, NOW) + 1)) if (dep_end != None and F('status') == 'grace_period') else std_months)
  - prior_change: >-
      SUM('billing_transactions','amount', within_months=since_dep, date_field='txn_date', event_type='billing_premium_credit', product_line='dental_ppo', credit_reason='plan_change_difference')
  - prior_term: >-
      SUM('billing_transactions','amount', within_months=since_dep, date_field='txn_date', event_type='billing_premium_credit', product_line='dental_ppo', credit_reason='termination_unearned')
  - dtc_dup: prior_change if prior_change > 0 else (prior_term if prior_term > 0 else 0)
  - lag_base: >-
      0 if (dep_end == None or paid_thru == None or paid_thru == '') else tier_diff * disc * MX(0, MONTHS(dep_end, paid_thru) - prior_months) * MX(0, DAYS(dep_end, NOW) - K('lag_days_low')) / 365
  - lag_days: 0 if dep_end == None else DAYS(dep_end, NOW)
  - dtc_int: >-
      (K('lag_rate_high') / 100 * lag_base) if lag_days > K('lag_days_high') else ((K('lag_rate_mid') / 100 * lag_base) if lag_days > K('lag_days_low') else 0)
  - last_inv_date: >-
      LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_invoice_issued')
  - last_inv_amt: LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_invoice_issued')
  - dr_plan: >-
      XLATEST('ortho','ortho_riders','variant_name', date_field='termination_date', billing_account_id=HID, status='terminated')
  - dr_rate: 0 if dr_plan == None else CPARAM('ortho','ortho_monthly_premium_per_enrollee', variant_name=dr_plan)
  - dv_tier: >-
      XLATEST('vision','vision_plans','coverage_tier', date_field='coverage_effective_date', billing_account_id=HID, enrollee_relationship='subscriber', termination_reason='not_terminated')
  - dv_plan: >-
