  - dh_plan: >-
      XLATEST('dhmo','dhmo_plans','variant_name', date_field='coverage_effective_date', billing_account_id=HID, enrollee_relationship='subscriber', termination_reason='not_terminated')
  - dh_app: >-
      XLATEST('dhmo','dhmo_plans','application_date', date_field='coverage_effective_date', billing_account_id=HID, enrollee_relationship='subscriber', termination_reason='not_terminated')
  - dh_rate: >-
      0 if (dh_app == None or last_date == None or dh_app > last_date) else (0 if (dh_tier == None or dh_plan == None) else (CPARAM('dhmo','monthly_premium_member_only', variant_name=dh_plan) if dh_tier == 'member_only' else (CPARAM('dhmo','monthly_premium_member_spouse', variant_name=dh_plan) if dh_tier == 'member_spouse' else (CPARAM('dhmo','monthly_premium_member_children', variant_name=dh_plan) if dh_tier == 'member_children' else CPARAM('dhmo','monthly_premium_family', variant_name=dh_plan)))))
  - vinv: >-
      0 if (v_app == None or last_date == None or v_app > last_date) else (0 if (v_tier == None or v_plan == None) else (CPARAM('vision','monthly_premium_member_only', variant_name=v_plan) if v_tier == 'member_only' else (CPARAM('vision','monthly_premium_member_spouse', variant_name=v_plan) if v_tier == 'member_spouse' else (CPARAM('vision','monthly_premium_member_children', variant_name=v_plan) if v_tier == 'member_children' else CPARAM('vision','monthly_premium_family', variant_name=v_plan)))))
  - c_old: RND(span * (dd_old + act_r + vinv + dh_rate) * disc, 2)
  - c_rid: RND(span * (ds_now + rr_rate + act_r + vinv + dh_rate) * disc, 2)
  - c_both: RND(span * (dd_old + rr_rate + act_r + vinv + dh_rate) * disc, 2)
  - bills_old: >-
      inscope and (dd_end != None and last_amt != None and (ABS(last_amt - c_old) < 0.005 or ABS(last_amt - c_both) < 0.005))
  - bills_rider: >-
      inscope and (rr_end != None and last_amt != None and (ABS(last_amt - c_rid) < 0.005 or ABS(last_amt - c_both) < 0.005))
  - r_dental: >-
      (span * tier_diff * disc) if (bills_old and renewal_start != '' and dd_end < renewal_start) else (((span - MONTHS(renewal_start, dd_end) - 1) * tier_diff * disc) if (bills_old and renewal_start != '' and dd_end >= renewal_start and MONTHS(renewal_start, dd_end) < span) else 0)
  - r_rider: >-
      (span * rr_rate * disc) if (bills_rider and renewal_start != '' and rr_end < renewal_start) else (((span - MONTHS(renewal_start, rr_end) - 1) * rr_rate * disc) if (bills_rider and renewal_start != '' and rr_end >= renewal_start and MONTHS(renewal_start, rr_end) < span) else 0)
  - v_after: v_app != None and last_date != None and v_app > last_date
  - r_vbinder: >-
      (span * v_rate * disc) if (v_after and v_eff == renewal_start) else (((span - MONTHS(renewal_start, v_eff)) * v_rate) if (v_after and renewal_start != '' and v_eff > renewal_start and MONTHS(renewal_start, v_eff) < span) else 0)
