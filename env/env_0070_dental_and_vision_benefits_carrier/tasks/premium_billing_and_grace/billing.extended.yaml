    last_span: that last month being the invoice's coverage month advanced by its months covered less one
    paid_thru: >-
      being the whole calendar months from the departed dependent's termination date to the account's paid-through date
    std_months: >-
      The months billed after the drop are the whole calendar months from the month after the month of the departed dependent's termination date through the last coverage month of the invoice issued last (of two issued on the same day, the one recorded first), that last month being the invoice's coverage month advanced by its months covered less one; they are zero when no departed dependent or no invoice is on record, or when that last month is not later than the termination month.
    since_dep: >-
      a credit counting as booked since that month when the whole calendar months from its booking date to the credit date are no more than the whole calendar months from the dependent's termination date to the credit date
    prior_months: >-
      The months already credited are the months covered by plan-change difference credits on the dental line booked since the departed dependent's termination month
    dtc_window: >-
      The months counted are replaced by how the account is billed: on an arrangement that carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date, only the prepaid months count, being the whole calendar months from the departed dependent's termination date to the account's paid-through date, because months beyond the paid-through date are corrected when the coming year is paid, an account with no paid-through date on record being taken under the cases that follow instead; on an account in a grace period, only the months already begun count, being the whole calendar months from the dependent's termination date to the credit date plus one; otherwise the months counted stay the months billed after the drop.
    prior_change: >-
      when plan-change difference credits on the dental line were booked since the departed dependent's termination month, their total is deducted
    prior_term: >-
      when none was but termination credits on the dental line were booked since then, their total is deducted
    dtc_dup: >-
      Tier-difference credits already booked are deducted: when plan-change difference credits on the dental line were booked since the departed dependent's termination month, their total is deducted; when none was but termination credits on the dental line were booked since then, their total is deducted; otherwise nothing is deducted.
    lag_base: >-
      The lag interest base is the tier difference per month reduced by the prepay discount percentage for each prepaid month after the dependent's termination date that is not among the months already credited, counted as the whole calendar months from that termination date to the paid-through date less the months already credited (never fewer than zero, and zero where no paid-through date is on record), running for the days from that termination date to the credit date beyond lag_days_low, on an actual-days basis over 365.
    lag_days: when the days from the departed dependent's termination date to the credit date exceed lag_days_high
    dtc_int: >-
      Interest is added when the drop is credited late: when the days from the departed dependent's termination date to the credit date exceed lag_days_high, the interest is lag_rate_high percent a year of the lag interest base; when they exceed lag_days_low but not lag_days_high, it is lag_rate_mid percent a year of the lag interest base; otherwise no interest is added.
    last_inv_date: >-
      when the invoice issued last was issued rebill_days_long or more days after the departed dependent's termination date
    last_inv_amt: The invoice billed the tier before the drop when its amount equals, to the cent, that premium
    rebill_days: >-
      when the invoice issued last was issued rebill_days_long or more days after the departed dependent's termination date
    billed_old: >-
      The invoice billed the tier before the drop when its amount equals, to the cent, that premium with the dental plan priced at the tier billed before the drop, with or without the ended orthodontic rider (the account's terminated rider with the latest termination date, the one recorded first on a tie) priced in at its plan's monthly premium per covered person
    dtc_recover: >-
      A re-billing amount is added when Cascade issued an invoice that still billed the dropped tier: when the invoice issued last was issued rebill_days_long or more days after the departed dependent's termination date and billed the tier before the drop, the amount is rebill_amount_long; when it was issued one or more days but fewer than rebill_days_long days after that date and billed that tier, the amount is rebill_amount_short; otherwise nothing is added.
    post_month: The credit is posted against the coverage month of the invoice issued last
    book_months: >-
      its months covered are the months counted above less the months already credited, never fewer than zero
    result: >-
      The adjustments below are applied to the standard credit in this order: the amount per month it uses and the months it counts are replaced first, then the deduction below is taken from the product of that amount and those months with the remainder floored at 0.00, then the additions below are made; the result is rounded half up to the cent once, at the end.
    dr_plan: >-
      the ended orthodontic rider (the account's terminated rider with the latest termination date, the one recorded first on a tie) priced in at its plan's monthly premium per covered person
    dr_rate: >-
      the ended orthodontic rider (the account's terminated rider with the latest termination date, the one recorded first on a tie) priced in at its plan's monthly premium per covered person
    dv_tier: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment
    dv_plan: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment
    dv_app: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment
    d_span: its premium is its months covered times the monthly premiums of the plans priced
    d_act_r: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out
    d_vinv: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment
    d_c_old: >-
      with the dental plan priced at the tier billed before the drop, with or without the ended orthodontic rider
    d_c_both: with or without the ended orthodontic rider
    d_dh_tier: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date
    d_dh_plan: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date
    d_dh_app: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date
    d_dh_rate: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date
    aptc: on an exchange account that receives advance premium tax credit
    annual_12: has issued a twelve-month invoice within twelve months before the credit date
    net_old: >-
      the plan's premium for the tier billed before the drop less the account's monthly advance premium tax credit, never below zero, less its premium for the tier after the drop less that credit, never below zero
    net_new: >-
      the plan's premium for the tier billed before the drop less the account's monthly advance premium tax credit, never below zero, less its premium for the tier after the drop less that credit, never below zero
    d_inscope: >-
      This reading of the invoice issued last is made only on an account on which, for each orthodontic rider plan, its active riders and, separately, its applied riders were either all applied for on or before the invoice's date or all applied for on one date
    dl_e_child: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, and where more than one such enrollment is on record, the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    dl_t_child: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, and where more than one such enrollment is on record, the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    dl_e_spouse: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, and where more than one such enrollment is on record, the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    dl_t_spouse: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, and where more than one such enrollment is on record, the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    dl_e_domestic_partner: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, and where more than one such enrollment is on record, the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    dl_t_domestic_partner: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, and where more than one such enrollment is on record, the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    dl_e_max: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, and where more than one such enrollment is on record, the one with the latest termination date (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
  factors:
  - id: dtc_basis
    effect: parameter
    decides: month_diff
    bindings:
    - aptc
    - net_old
    - net_new
    - month_diff
    ladder:
    - when: >-
        the arrangement carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date
      value: the tier difference per month reduced by the prepay discount percentage
    - when: the account is an exchange account that receives advance premium tax credit
      value: >-
        the former tier's premium net of the monthly credit (floored at zero) less the current tier's premium net of it (floored at zero)
    - when: otherwise
      value: the tier difference per month
    baseline:
      month_diff: tier_diff
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: null
  - id: dtc_window
    effect: method
    decides: dtc_window
    bindings:
    - dtc_window
    - book_months
    ladder:
    - when: >-
        the arrangement carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date
      method: >-
        count only the prepaid months: whole calendar months from the dependent's termination date to the paid-through date
    - when: the account is in a grace period
      method: >-
        count only the months already begun: whole calendar months from the dependent's termination date to the credit date, plus one
    - when: otherwise
      method: count the months billed after the drop through the last coverage month of the invoice issued last
    baseline:
      dtc_window: std_months
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: dtc_dup
    effect: parameter
    decides: dtc_dup
    bindings:
    - prior_change
    - prior_term
    - dtc_dup
    ladder:
    - when: >-
        plan-change difference credits on the dental line were booked since the dependent's termination month
      value: the total of those plan-change difference credits
    - when: none was, but termination credits on the dental line were booked since then
      value: the total of those termination credits
    - when: otherwise
      value: '0.00'
    baseline:
      dtc_dup: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: dtc_int
    effect: parameter
    decides: dtc_int
    bindings:
    - lag_days
    - dtc_int
    ladder:
    - when: the days from the dependent's termination date to the credit date exceed lag_days_high
      value: K('lag_rate_high') percent a year of the lag interest base
    - when: they exceed lag_days_low but not lag_days_high
      value: K('lag_rate_mid') percent a year of the lag interest base
    - when: otherwise
      value: no interest
    baseline:
      dtc_int: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: null
  - id: dtc_recover
    effect: parameter
    decides: dtc_recover
    bindings:
    - rebill_days
    - dr_plan
    - dr_rate
    - dv_tier
    - dv_plan
    - dv_app
    - d_span
    - d_act_r
    - d_inscope
    - d_dh_tier
    - d_dh_plan
    - d_dh_app
    - d_dh_rate
    - d_vinv
    - d_c_old
    - d_c_both
    - billed_old
    - dtc_recover
    ladder:
    - when: >-
        the invoice issued last came rebill_days_long or more days after the departed dependent's termination date and billed the tier before the drop
      value: K('rebill_amount_long')
    - when: it came one or more but fewer than rebill_days_long days after that date and billed that tier
      value: K('rebill_amount_short')
    - when: otherwise
      value: '0.00'
    baseline:
      dtc_recover: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The tier-difference credit is the tier difference per month multiplied by the months billed after the drop, rounded half up to the cent. The months billed after the drop are the whole calendar months from the month after the month of the departed dependent's termination date through the last coverage month of the invoice issued last (of two issued on the same day, the one recorded first), that last month being the invoice's coverage month advanced by its months covered less one; they are zero when no departed dependent or no invoice is on record, or when that last month is not later than the termination month. The tier difference per month is the plan's monthly premium for the tier billed before the drop less its monthly premium for the tier after the drop, never less than zero; it is zero where no departed dependent or no active subscriber enrollment is on record.
    params: []
  inputs:
    history:
    - table: billing_transactions
      aggregate: latest
      field: coverage_month
      filters:
        event_type: billing_invoice_issued
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_premium_credit
        product_line: dental_ppo
    - category: dental
      table: dental_plans
      aggregate: latest
      field: termination_date
      filters:
        termination_reason: loss_of_eligibility
    cross_category:
    - dental
    - ortho
    - vision
    - dhmo
- id: billing_ext_rider_end_credit
  base_policy_refs:
  - billing_agg_credit_application
  - billing_credits_refunds
  overwrite:
  - base_policy: billing_credits_refunds
    superseded_clause: >-
      termination_unearned credits premium billed for whole coverage months after the termination month (termination_credit_basis), never a partial month
    replaced_by: >-
      For an orthodontic rider funded by the account that has ended, and only for such a rider, this policy settles the rider credit; the termination credit for a vision plan unit ended by voluntary termination is settled by the vision termination credit policy, and every other termination credit remains under the base rule, which credits the premium billed for whole coverage months after the termination month and never a partial month.
  trigger: state_due
  subject:
  - billing_premium_credit
  computes: credit_amount
  target_tool: book_rider_end_credit_fb22198c
  params:
    autopay_discount_basis: 1.0
    rider_late_days_low: 30
    rider_late_days_high: 90
    rider_rate_mid: 10
    rider_rate_high: 15
    rider_rebill_days: 60
    rider_rebill_long: 10.0
    rider_rebill_short: 5.0
  rule: >-
    For an orthodontic rider funded by the account that has ended, and only for such a rider, this policy settles the rider credit; the termination credit for a vision plan unit ended by voluntary termination is settled by the vision termination credit policy, and every other termination credit remains under the base rule, which credits the premium billed for whole coverage months after the termination month and never a partial month. The ended rider is the orthodontic rider funded by the account whose status is terminated, and where more than one is on record, the one with the latest termination date (of two with the same date, the one recorded first); its rider premium is the rider plan's monthly premium per covered person. A record counts as falling within a number of months before the credit date when the whole calendar months from its date to the credit date, counted the way an anniversary is counted (a month is complete only when a later month reaches the same day number, and the last
    day of a shorter month does not complete it), are fewer than that number. The rider credit is the rider premium multiplied by the rider months billed after its end, rounded half up to the cent. The rider months billed after its end are the whole calendar months from the month after the month of the rider's termination date through the last coverage month of the invoice issued last (of two issued on the same day, the one recorded first), that last month being the invoice's coverage month advanced by its months covered less one; they are zero when no invoice or no ended rider is on record or when that last month is not later than the termination month. Where the account funds no ended orthodontic rider, the rider credit is 0.00. The rider months already credited are the months covered by termination credits on the rider line booked since the rider's termination month, a credit counting as booked since that month when the whole calendar months from its booking date to the credit date are
    no more than the whole calendar months from the rider's termination date to the credit date. The adjustments below are applied to the standard rider credit in this order: the months it counts and the monthly amount it uses are replaced first, then the deduction below is taken from their product with the remainder floored at 0.00, then the additions below are made; the result is rounded half up to the cent once, at the end. The rider months are replaced by how the account is billed: on an arrangement that carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date, only the prepaid months count, being the whole calendar months from the rider's termination date to the account's paid-through date, because months beyond the paid-through date are corrected when the coming year is paid, an account with no paid-through date on record being taken under the cases that follow instead; on an account in a grace period, only the months already begun
    count, being the whole calendar months from the rider's termination date to the credit date plus one; otherwise the rider months stay the rider months billed after its end. The monthly amount is replaced by how the rider was billed: when the rider months were billed on AutoPay, which the account's arrangement shows either by carrying an AutoPay discount or, where the arrangement does not accept bank draft, by regular automatic bank drafts collected within twelve months before the credit date, which only the AutoPay arrangement the account has since left could have collected, the amount is the rider premium less the AutoPay arrangement's monthly discount (autopay_discount_basis) divided equally among the plan units the account bills, counted as two plan units for its dental and vision plans plus one for each active orthodontic rider; when the arrangement carries a prepay discount and has issued a twelve-month invoice within twelve months before the credit date, the amount is the rider
    premium reduced by the prepay discount percentage; otherwise the monthly amount stays the rider premium. Rider credits already booked are deducted: when termination credits on the rider line were booked since the rider's termination month, their total is deducted; when none was but prepay-unearned credits on the rider line were booked since then, their total is deducted; otherwise nothing is deducted. The rider interest base is the rider premium reduced by the arrangement's prepay discount percentage for each prepaid month after the rider's termination date that is not among the rider months already credited, counted as the whole calendar months from that termination date to the paid-through date less the rider months already credited (never fewer than zero, and zero where no paid-through date is on record), running for the days from that termination date to the credit date beyond rider_late_days_low, on an actual-days basis over 365. Interest is added when the rider is credited late:
    when the days from the rider's termination date to the credit date exceed rider_late_days_high, the interest is rider_rate_high percent a year of the rider interest base; when they exceed rider_late_days_low but not rider_late_days_high, it is rider_rate_mid percent a year of the rider interest base; otherwise no interest is added. The invoice issued last is read against the plans it could bill: its premium is its months covered times the monthly premiums of the plans priced, reduced by the prepay discount percentage and rounded half up to the cent, the plans priced being the subscriber's dental plan, its current tier being the coverage tier recorded on the subscriber's active dental enrollment funded by the account with the latest coverage effective date (of two, the one recorded first), each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the invoice's date being left out, the subscriber's DHMO
    enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date, and the subscriber's vision enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the invoice's date. The invoice billed the ended rider when its amount equals, to the cent, that premium with the ended rider priced in, the dental plan being priced at the subscriber's current tier or at the departed dependent's former tier, that is the coverage tier recorded on the dental enrollment funded by the account of the subscriber's child, spouse or domestic partner that ended for loss of eligibility (the one with the latest termination date (of two with the same date,
    a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)). This reading of the invoice issued last is made only on an account on which, for each orthodontic rider plan, its active riders and, separately, its applied riders were either all applied for on or before the invoice's date or all applied for on one date, so that the records show which riders were applied for after that date (when that one date is later, those riders); on any other account the invoice is not taken to have billed the ended rider and no rider re-billing amount is added, the credit being otherwise worked out as above. A rider re-billing amount is added when Cascade issued an invoice that still billed the ended rider: when the invoice issued last was issued rider_rebill_days or more days after the rider's termination date and billed the ended rider, the amount is rider_rebill_long; when it was issued one or more days but fewer than rider_rebill_days days after that
    date and billed it, the amount is rider_rebill_short; otherwise nothing is added. The credit is posted against the coverage month of the invoice issued last, and its months covered are the rider months counted above less the rider months already credited, never fewer than zero.
  prerequisite: []
  cross_category:
  - category: ortho
    as: history
    reads:
    - ortho_riders.termination_date
    - ortho_riders.status
    - ortho_riders.variant_name
    - ortho_riders.application_date
    note: >-
      The ended rider's date and plan set the premium, the months and the lateness tiers; active riders set the plan units.
  - category: dental
    as: branch
    reads:
    - dental_plans.coverage_tier
    - dental_plans.variant_name
    - dental_plans.termination_date
    - dental_plans.termination_reason
    - dental_plans.enrollee_relationship
    note: >-
      The subscriber's current tier and the departed dependent's former tier price the plans the invoice issued last could bill.
  - category: vision
    as: branch
    reads:
    - vision_plans.coverage_tier
    - vision_plans.variant_name
    - vision_plans.application_date
    - vision_plans.coverage_effective_date
    note: >-
      The subscriber's vision enrollment applied on or before the invoice's date prices the plans the invoice could bill.
  - category: dhmo
    as: branch
    reads:
    - dhmo_plans.coverage_tier
    - dhmo_plans.variant_name
    - dhmo_plans.application_date
    - dhmo_plans.coverage_effective_date
    - dhmo_plans.enrollee_relationship
    note: >-
      The subscriber's DHMO enrollment, when the account funds one, is priced among the plans the invoice issued last could bill.
  compute:
  - r_end: >-
      XLATEST('ortho','ortho_riders','termination_date', date_field='termination_date', billing_account_id=HID, status='terminated')
  - r_plan: >-
      XLATEST('ortho','ortho_riders','variant_name', date_field='termination_date', billing_account_id=HID, status='terminated')
  - r_rate: 0 if r_plan == None else CPARAM('ortho','ortho_monthly_premium_per_enrollee', variant_name=r_plan)
  - last_cov: >-
      LATEST('billing_transactions','coverage_month', date_field='txn_date', event_type='billing_invoice_issued')
  - last_span: >-
      LATEST('billing_transactions','months_covered', date_field='txn_date', event_type='billing_invoice_issued')
  - last_inv_date: >-
      LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_invoice_issued')
  - last_inv_amt: LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_invoice_issued')
  - paid_thru: F('paid_through_date')
  - disc: (100 - P('prepay_discount_pct')) / 100
  - std_rmonths: >-
      0 if (r_end == None or last_cov == None) else MX(0, MONTHS(r_end, last_cov + '-01') + int(last_span))
  - since_rend: 0 if r_end == None else MONTHS(r_end, NOW) + 1
  - prior_rmonths: >-
      SUM('billing_transactions','months_covered', within_months=since_rend, date_field='txn_date', event_type='billing_premium_credit', product_line='ortho_rider', credit_reason='termination_unearned')
  - plan_units: 2 + XCOUNT('ortho','ortho_riders', billing_account_id=HID, status='active')
  - annual_12: >-
      COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_invoice_issued', months_covered=12)
  - rc_months: >-
      (MX(0, MONTHS(r_end, paid_thru))) if (r_end != None and paid_thru != None and paid_thru != '' and P('prepay_discount_pct') > 0 and annual_12 >= 1) else ((MX(0, MONTHS(r_end, NOW) + 1)) if (r_end != None and F('status') == 'grace_period') else std_rmonths)
  - drafts_12r: >-
      COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_received', payment_method='eft', payment_purpose='regular')
  - ap_record_r: >-
      (P('autopay_discount_monthly') > 0) or (('eft' not in P('accepted_payment_methods')) and drafts_12r >= 1)
  - rc_basis: >-
      (r_rate - K('autopay_discount_basis') / plan_units) if ap_record_r else ((r_rate * (100 - P('prepay_discount_pct')) / 100) if (P('prepay_discount_pct') > 0 and annual_12 >= 1) else r_rate)
  - prior_rterm: >-
      SUM('billing_transactions','amount', within_months=since_rend, date_field='txn_date', event_type='billing_premium_credit', product_line='ortho_rider', credit_reason='termination_unearned')
