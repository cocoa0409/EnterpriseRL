  - result: RND(MX(0, bal - r_dental - r_rider + r_vbinder - r_relief), 2)
  compute_basis:
    inv_all: every invoice, returned payment, returned-payment fee and refund booked on the account
    ret_all: every invoice, returned payment, returned-payment fee and refund booked on the account
    ref_all: every invoice, returned payment, returned-payment fee and refund booked on the account
    pay_all: less every payment received and every premium credit booked
    cred_all: less every payment received and every premium credit booked
    bal: >-
      The balance due is every invoice, returned payment, returned-payment fee and refund booked on the account, less every payment received and every premium credit booked.
    last_cov: >-
      The renewal invoice is the invoice issued last (of two issued on the same day, the one recorded first)
    last_span: running for its months covered
    last_date: >-
      The renewal invoice is the invoice issued last (of two issued on the same day, the one recorded first)
    last_amt: it bills the former tier when its amount equals, to the cent, that premium
    span: running for its months covered
    renewal_start: starting with its coverage month (the renewal start)
    disc: renewal premiums are reduced by the arrangement's prepay discount percentage
    dd_end: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    dd_tier: the former tier is the coverage tier recorded on that enrollment
    ds_tier: >-
      the subscriber's current dental tier and plan are those of the subscriber's active dental enrollment funded by the account with the latest coverage effective date (of two, the one recorded first)
    ds_plan: >-
      the subscriber's current dental tier and plan are those of the subscriber's active dental enrollment funded by the account with the latest coverage effective date (of two, the one recorded first)
    dd_old: >-
      the tier difference is that plan's monthly premium for the former tier less its premium for the current tier
    ds_now: >-
      the tier difference is that plan's monthly premium for the former tier less its premium for the current tier
    tier_diff: >-
      never less than zero, and zero where no departed dependent or no active subscriber enrollment is on record
    rr_end: >-
      The ended rider is the orthodontic rider funded by the account whose status is terminated, the one with the latest termination date (of two with the same date, the one recorded first)
    rr_plan: its premium is the rider plan's monthly premium per covered person
    rr_rate: its premium is the rider plan's monthly premium per covered person
    v_eff: >-
      The subscriber's vision enrollment is the subscriber's vision enrollment funded by the account that is applied or active (neither terminated nor cancelled), the one with the latest coverage effective date (of two, the one recorded first)
    v_app: >-
      The subscriber's vision enrollment is the subscriber's vision enrollment funded by the account that is applied or active (neither terminated nor cancelled), the one with the latest coverage effective date (of two, the one recorded first)
    v_tier: >-
      The subscriber's vision enrollment is the subscriber's vision enrollment funded by the account that is applied or active (neither terminated nor cancelled), the one with the latest coverage effective date (of two, the one recorded first)
    v_plan: >-
      The subscriber's vision enrollment is the subscriber's vision enrollment funded by the account that is applied or active (neither terminated nor cancelled), the one with the latest coverage effective date (of two, the one recorded first)
    v_rate: >-
      priced at the plan's monthly premium for its recorded coverage tier, and nothing where none is on record
    bills_old: >-
      it bills the former tier when its amount equals, to the cent, that premium with the dental plan priced at the former tier, with or without the ended rider priced in
    bills_rider: >-
      it bills the ended rider when its amount equals, to the cent, that premium with the ended rider priced in, the dental plan being priced at the current or the former tier
    r_dental: >-
      A dental saving is deducted when the renewal invoice bills the former tier: when the departed dependent's termination date is before the renewal start, the saving is the renewal invoice's months covered times the tier difference; when that date falls inside the renewal year, the saving is the renewal year's months after the month of that date, being its months covered less the whole calendar months from the renewal start to that date less one, times the tier difference; either saving is reduced by the prepay discount percentage, and otherwise nothing is deducted.
    r_rider: >-
      A rider saving is deducted when the renewal invoice bills the ended rider: when the rider's termination date is before the renewal start, the saving is the renewal invoice's months covered times the rider premium; when that date falls inside the renewal year, the saving is the renewal year's months after the month of that date, being its months covered less the whole calendar months from the renewal start to that date less one, times the rider premium; either saving is reduced by the prepay discount percentage, and otherwise nothing is deducted.
    v_after: when it was applied for after the renewal invoice was issued
    r_vbinder: >-
      The subscriber's vision enrollment is added by its start when it was applied for after the renewal invoice was issued: when it starts on the renewal start, the renewal invoice's months covered times its monthly premium, reduced by the prepay discount percentage, are added; when it starts later inside the renewal year, its months from its start through the renewal year's last month, being the renewal invoice's months covered less the whole calendar months from the renewal start to its start, are added at its monthly premium without the prepay discount, which applies only to a full prepaid year; otherwise nothing is added, an enrollment applied for on or before the renewal invoice's date being billed on that invoice.
    last_fee_date: >-
      The returned-payment fee booked last is the fee booked last on the account (of two booked on the same day, the one recorded first)
    last_fee_amt: >-
      The returned-payment fee booked last is the fee booked last on the account (of two booked on the same day, the one recorded first)
    fee_since_inv: it counts as booked since the renewal invoice when its date is on or after that invoice's date
    inv_window: within the whole calendar months from the renewal invoice's date to the payment date plus one
    rets_lb: whose returned payments within renewal_relief_lookback_months months before the payment date
    rets_inv: >-
      are no more than its returned payments within the whole calendar months from the renewal invoice's date to the payment date plus one
    open_months: >-
      when the account was opened renewal_tenure_long_months or more whole calendar months before the payment date
    r_relief: >-
      A standing relief is deducted for an account whose returned payments within renewal_relief_lookback_months months before the payment date are no more than its returned payments within the whole calendar months from the renewal invoice's date to the payment date plus one, both counted the way a record counts as falling within a number of months before the payment date (so a return in the days before the renewal invoice inside the same whole-month count counts with the latter): when the account was opened renewal_tenure_long_months or more whole calendar months before the payment date and the returned-payment fee booked last counts as booked since the renewal invoice, the relief is that fee; when the account was opened at least renewal_tenure_mid_months but fewer than renewal_tenure_long_months whole calendar months before and that fee counts as booked since the renewal invoice, the relief is renewal_relief_half_pct percent of that fee; otherwise no relief is deducted.
    result: >-
      The adjustments below are applied to the standard payment in this order: the deductions below are taken first, then the additions below are made, then the relief below is deducted, and the total is floored at 0.00 and rounded half up to the cent once, at the end.
    act_r: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the renewal invoice's date being left out
    vinv: >-
      each orthodontic rider the account funds that is active or applied at its plan's monthly premium per covered person, riders applied for after the renewal invoice's date being left out, the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the renewal invoice's date, and the subscriber's vision enrollment
    c_old: >-
      that premium with the dental plan priced at the former tier, with or without the ended rider priced in
    c_rid: >-
      that premium with the ended rider priced in, the dental plan being priced at the current or the former tier
    c_both: >-
      that premium with the ended rider priced in, the dental plan being priced at the current or the former tier
    dh_tier: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the renewal invoice's date
    dh_plan: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the renewal invoice's date
    dh_app: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the renewal invoice's date
    dh_rate: >-
      the subscriber's DHMO enrollment funded by the account that is applied or active (neither terminated nor cancelled) (the one with the latest coverage effective date, the one recorded first on a tie) at its recorded tier when it was applied for on or before the renewal invoice's date
    fee_all: every invoice, returned payment, returned-payment fee and refund booked on the account
    inscope: >-
      This reading of the renewal invoice is made only on an account on which, for each orthodontic rider plan, its active riders and, separately, its applied riders were either all applied for on or before the renewal invoice's date or all applied for on one date
    rl_e_child: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    rl_t_child: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    rl_e_spouse: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    rl_t_spouse: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    rl_e_domestic_partner: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    rl_t_domestic_partner: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
    rl_e_max: >-
      The departed dependent is the subscriber's child, spouse or domestic partner whose dental enrollment funded by the account ended for loss of eligibility, the one with the latest termination date where more than one is on record (of two with the same date, a child's before a spouse's or domestic partner's, and of two of one relationship the one recorded first)
  factors:
  - id: r_dental
    effect: parameter
    decides: r_dental
    bindings:
    - dd_end
    - tier_diff
    - bills_old
    - r_dental
    ladder:
    - when: >-
        the renewal invoice bills the former tier and the departed dependent's termination date is before the renewal start
      value: the renewal invoice's months covered times the tier difference, reduced by the prepay discount
    - when: the renewal invoice bills the former tier and that date falls inside the renewal year
      value: >-
        the renewal year's months after the month of that date times the tier difference, reduced by the prepay discount
    - when: otherwise
      value: '0.00'
    baseline:
      r_dental: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: r_rider
    effect: parameter
    decides: r_rider
    bindings:
    - rr_end
    - bills_rider
    - r_rider
    ladder:
    - when: >-
        the renewal invoice bills the ended rider and the rider's termination date is before the renewal start
      value: the renewal invoice's months covered times the rider premium, reduced by the prepay discount
    - when: the renewal invoice bills the ended rider and that date falls inside the renewal year
      value: >-
        the renewal year's months after the month of that date times the rider premium, reduced by the prepay discount
    - when: otherwise
      value: '0.00'
    baseline:
      r_rider: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ortho
  - id: r_vbinder
    effect: method
    decides: r_vbinder
    bindings:
    - v_eff
    - v_after
    - r_vbinder
    ladder:
    - when: >-
        the subscriber's vision enrollment was applied for after the renewal invoice was issued and starts on the renewal start
      method: add the renewal invoice's months covered times its monthly premium, reduced by the prepay discount
    - when: it was applied for after the renewal invoice was issued and starts later inside the renewal year
      method: >-
        add its months from its start through the renewal year's last month at its monthly premium, without the prepay discount
    - when: otherwise
      method: add nothing
    baseline:
      r_vbinder: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: vision
  - id: r_relief
    effect: parameter
    decides: r_relief
    bindings:
    - rets_lb
    - rets_inv
    - open_months
    - r_relief
    ladder:
    - when: >-
        no more returned payments within the lookback than within the renewal-invoice window, the account opened renewal_tenure_long_months or more whole months before, and the fee booked last booked since the renewal invoice
      value: the returned-payment fee booked last
    - when: >-
        no more returned payments within the lookback than within the renewal-invoice window, the account opened at least renewal_tenure_mid_months but fewer than renewal_tenure_long_months whole months before, and that fee booked since the renewal invoice
      value: renewal_relief_half_pct percent of the returned-payment fee booked last
    - when: otherwise
      value: '0.00'
    baseline:
      r_relief: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The renewal payment is the account's balance due, rounded half up to the cent and never less than 0.00. The balance due is every invoice, returned payment, returned-payment fee and refund booked on the account, less every payment received and every premium credit booked.
    params: []
  inputs:
    history:
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_invoice_issued
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_premium_credit
    - table: billing_transactions
      aggregate: latest
      field: coverage_month
      filters:
        event_type: billing_invoice_issued
    - table: billing_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: billing_returned_payment_fee
    - category: vision
      table: vision_plans
      aggregate: latest
      field: application_date
      filters:
        enrollee_relationship: subscriber
    cross_category:
    - dental
    - ortho
    - vision
    - dhmo
