  factors:
  - id: cap_aging_adj
    effect: method
    decides: aging_points
    bindings:
    - days_past_window
    - aging_points
    ladder:
    - when: the overpayment under recovery is more than aging_linear_after days past its refund window
      method: add one share point for every whole aging_step_days days past the window
    - when: the overpayment under recovery is more than aging_flat_after and at most aging_linear_after days past its refund window
      method: add a flat aging_flat_points share points
    - when: otherwise
      method: add nothing (standard share)
    baseline:
      aging_points: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: cap_panel_relief
    effect: parameter
    decides: panel_relief
    bindings:
    - panel_members
    - panel_relief
    ladder:
    - when: the capitation payment pays for dhmo_panel_capacity assigned members or more
      value: K('panel_relief_full')
    - when: it pays for panel_mid_members members or more but fewer than dhmo_panel_capacity
      value: K('panel_relief_mid')
    - when: otherwise
      value: '0'
    baseline:
      panel_relief: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: cap_exit_accel
    effect: parameter
    decides: exit_points
    bindings:
    - exit_days
    - exit_points
    ladder:
    - when: the agreement is termination_pending and its termination date is exit_near_days days or fewer after today
      value: K('exit_near_points')
    - when: the agreement is termination_pending and its termination date is more than exit_near_days days after today
      value: K('exit_far_points')
    - when: otherwise
      value: '0'
    baseline:
      exit_points: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: cap_tenure_relief
    effect: parameter
    decides: tenure_relief
    bindings:
    - tenure_months
    - tenure_relief
    ladder:
    - when: the agreement has been in force tenure_long_months whole months or more
      value: K('tenure_long_relief')
    - when: it has been in force tenure_mid_months whole months or more but fewer than tenure_long_months
      value: K('tenure_mid_relief')
    - when: otherwise
      value: '0'
    baseline:
      tenure_relief: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: cap_notice_size
    effect: parameter
    decides: size_points
    bindings:
    - notice_amount
    - size_points
    ladder:
    - when: the notice amount of the overpayment under recovery is at least twice the capitation amount
      value: K('size_full_points')
    - when: it is at least the capitation amount but less than twice it
      value: K('size_half_points')
    - when: otherwise
      value: '0'
    baseline:
      size_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: cap_small_practice
    effect: parameter
    decides: small_relief
    bindings:
    - small_contract
    - small_census
    - small_status
    - small_relief
    ladder:
    - when: the most recent census of the practice's own applied or active Cascade staff group contract documents fewer than small_staff_limit employees
      value: K('small_relief_high')
    - when: that census documents small_staff_limit up to group_small_max employees
      value: K('small_relief_mid')
    - when: 'otherwise (no census on file, contract ended, or a larger headcount): standard terms'
      value: '0'
    baseline:
      small_relief: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: group
  baseline:
    rule: 'The overpayment under recovery is the overpayment that the agreement''s most recent withholding was applied to, and its open amount is its notice amount less every withholding, refund and reduction booked against it. The capitation payment is the agreement''s most recent capitation payment, and the amount already withheld from it is the total of every withholding booked against its remittance number. As the standard method, the continuing capitation withholding share is recoupment_max_pct_per_remittance percent, the room in the capitation payment is the capitation amount times that share divided by one hundred, rounded half up to the cent, less the amount already withheld from it, and the continuing capitation withholding is the lesser of the open amount of the overpayment under recovery and that room, never below zero. When the agreement has no capitation payment on record, or none of its overpayments has yet had a withholding applied to it, there is no continuing capitation withholding and nothing is booked. A continuing capitation withholding is booked at most once against a capitation payment: once that payment carries a withholding for the overpayment under recovery, nothing more is owed from it under this policy.'
    params:
    - recoupment_max_pct_per_remittance
  inputs:
    history:
    - table: provider_payment_events
      aggregate: latest
      field: amount
      filters:
        event_type: provider_remittance_issued
        remittance_component: capitation
    - table: provider_payment_events
      aggregate: sum
      field: amount
      filters:
        event_type: provider_overpayment_recouped
    - category: group
      table: group_eligibility_events
      aggregate: latest
      field: eligible_employees_reported
      filters:
        event_type: group_census_reported
    cross_category:
    - group
- id: provider_ext_repayment_interest
  base_policy_refs:
  - provider_evt_remittance
  - provider_evt_disputes
  - provider_evt_overpayment
  overwrite:
  - base_policy: provider_evt_remittance
    superseded_clause: A clean claim is paid within clean_claim_payment_days calendar days of receipt; when it is paid later, simple interest at prompt_pay_interest_annual_pct per year is paid for each day beyond that period as a separate prompt_pay_interest component, unless the interest is below prompt_pay_interest_minimum.
    replaced_by: A clean claim is paid within clean_claim_payment_days calendar days of receipt, and when it is paid later simple interest at prompt_pay_interest_annual_pct per year is paid for each day beyond that period as a separate prompt_pay_interest component unless the interest is below prompt_pay_interest_minimum; a repayment of an over-recovery on a capitation agreement is not such a clean claim, and its interest is worked out under this policy and only under it.
  trigger: state_due
  subject:
  - provider_remittance_issued
  computes: interest_amount
  target_tool: pay_repayment_interest_bafa5446
  params:
    grace_small_days: 15
    grace_small_limit: 100
    esc_high_days: 90
    esc_low_days: 45
    esc_high_points: 6
    esc_low_points: 3
    repeat_high_points: 4
    repeat_low_points: 2
    min_long_months: 96
    min_long_amount: 1.0
  rule: 'This policy governs the prompt-pay interest Cascade pays on a repayment of an over-recovery on a Cascade DHMO Primary Care Dentist Agreement, an over-recovery being the amount by which a dispute decision lowered an overpayment below what had already been refunded or withheld on it, and only such repayment interest. A clean claim is paid within clean_claim_payment_days calendar days of receipt, and when it is paid later simple interest at prompt_pay_interest_annual_pct per year is paid for each day beyond that period as a separate prompt_pay_interest component unless the interest is below prompt_pay_interest_minimum; a repayment of an over-recovery on a capitation agreement is not such a clean claim, and its interest is worked out under this policy and only under it. The repayment is the agreement''s most recent claim payment remittance, which on a capitation agreement only ever repays an over-recovery, and its amount is the principal that bears interest. The dispute decision is the agreement''s most recent dispute decision, read for its resolved date, its resolution due date, its filing date and the overpayment it decided. For repayment interest, days are calendar days counted from the earlier date to the later date, the earlier date not counted and the later date counted, and whole months are the difference in calendar months, less one when the later date''s day of the month is smaller than the earlier date''s day of the month. For repayment interest, where two ledger entries or two dispute decisions a selection reads share the latest date, the one listed first on the agreement''s records is taken. As the standard method, the clock runs over the days from the dispute decision''s resolved date to the repayment date, the days held are those days less a grace of clean_claim_payment_days days, never below zero, the annual rate is prompt_pay_interest_annual_pct percent, the repayment interest is the principal times the annual rate divided by one hundred times the days held divided by 365, rounded half up to the cent, and repayment interest below prompt_pay_interest_minimum is not paid. When the agreement has no claim payment remittance or no dispute decision on record, or is not paid by capitation, no repayment interest is due under this policy. The adjustments set out below change the standard method as each of them states, and the order in which they are applied does not change the result. The clock start of the repayment interest is set by when the decision was made and when the practice paid: when the decision''s resolved date is after its resolution due date, the clock runs from the resolution due date; when the decision was made on or before its resolution due date and the practice''s latest refund on the decided overpayment is dated on or after the dispute''s filing date, the clock runs from that refund date; otherwise the clock runs from the decision''s resolved date. The grace of the repayment interest is set by the dispute and the size of the repayment: when the practice''s dispute of the decided overpayment stated that it had already been refunded, there is no grace; when the dispute stated any other ground and the repayment is less than grace_small_limit, the grace is grace_small_days days; otherwise the grace is clean_claim_payment_days days. The delay add-on to the repayment interest rate is set by the days from the decision''s resolved date to the repayment date: more than esc_high_days days adds esc_high_points points to the annual rate; more than esc_low_days and at most esc_high_days days adds esc_low_points points; esc_low_days days or fewer adds nothing. The repeat-repayment add-on to the repayment interest rate is set by the claim payment remittances on the agreement dated fewer than 24 whole months before today, the current repayment included: three or more add repeat_high_points points to the annual rate; exactly two add repeat_low_points points; only one adds nothing. The repayment interest minimum is set by the agreement''s status and tenure: for a termination_pending or terminated agreement repayment interest of any amount is paid; for any other agreement in force min_long_months whole months or more from its effective date the minimum is min_long_amount; otherwise the minimum is prompt_pay_interest_minimum.'
  prerequisite: []
  cross_category: []
  compute:
  - rep_amt: LATEST('provider_payment_events', 'amount', event_type='provider_remittance_issued', remittance_component='claim_payment')
  - rep_date: LATEST('provider_payment_events', 'event_date', event_type='provider_remittance_issued', remittance_component='claim_payment')
  - dec_date: LATEST('provider_disputes', 'resolved_date', date_field='resolved_date', event_type='provider_dispute_resolved')
  - dec_due: LATEST('provider_disputes', 'resolution_due_date', date_field='resolved_date', event_type='provider_dispute_resolved')
  - dec_filed: LATEST('provider_disputes', 'filed_date', date_field='resolved_date', event_type='provider_dispute_resolved')
  - dec_case: LATEST('provider_disputes', 'provider_payment_event_id', date_field='resolved_date', event_type='provider_dispute_resolved')
  - in_scope: 1 if rep_amt != None and dec_date != None and P('capitation_pmpm') > 0 else 0
  - clock_days: DAYS(dec_due, rep_date) if in_scope == 1 and DAYS(dec_due, dec_date) > 0 else (DAYS(LATEST('provider_payment_events', 'event_date', event_type='provider_overpayment_refund_received', original_payment_event_id=dec_case), rep_date) if in_scope == 1 and LATEST('provider_payment_events', 'event_date', event_type='provider_overpayment_refund_received', original_payment_event_id=dec_case) != None and DAYS(dec_filed, LATEST('provider_payment_events', 'event_date', event_type='provider_overpayment_refund_received', original_payment_event_id=dec_case)) >= 0 else (DAYS(dec_date, rep_date) if in_scope == 1 else 0))
  - grace_days: 0 if COUNT('provider_disputes', date_field='filed_date', event_type='provider_dispute_filed', provider_payment_event_id=dec_case, dispute_basis='already_refunded') > 0 else (K('grace_small_days') if rep_amt != None and rep_amt < K('grace_small_limit') else P('clean_claim_payment_days'))
  - esc_points: K('esc_high_points') if in_scope == 1 and DAYS(dec_date, rep_date) > K('esc_high_days') else (K('esc_low_points') if in_scope == 1 and DAYS(dec_date, rep_date) > K('esc_low_days') else 0)
  - repeat_points: K('repeat_high_points') if COUNT('provider_payment_events', within_months=24, event_type='provider_remittance_issued', remittance_component='claim_payment') >= 3 else (K('repeat_low_points') if COUNT('provider_payment_events', within_months=24, event_type='provider_remittance_issued', remittance_component='claim_payment') == 2 else 0)
  - min_interest: 0 if F('status') == 'termination_pending' or F('status') == 'terminated' else (K('min_long_amount') if MONTHS(F('effective_date'), NOW) >= K('min_long_months') else P('prompt_pay_interest_minimum'))
  - result: (RND(rep_amt * (P('prompt_pay_interest_annual_pct') + esc_points + repeat_points) / 100 * MX(0, clock_days - grace_days) / 365) if RND(rep_amt * (P('prompt_pay_interest_annual_pct') + esc_points + repeat_points) / 100 * MX(0, clock_days - grace_days) / 365) >= min_interest else 0) if in_scope == 1 else 0
  compute_basis:
    rep_amt: The repayment is the agreement's most recent claim payment remittance, which on a capitation agreement only ever repays an over-recovery, and its amount is the principal that bears interest.
    rep_date: The repayment is the agreement's most recent claim payment remittance, which on a capitation agreement only ever repays an over-recovery, and its amount is the principal that bears interest.
    dec_date: The dispute decision is the agreement's most recent dispute decision, read for its resolved date, its resolution due date, its filing date and the overpayment it decided.
    dec_due: The dispute decision is the agreement's most recent dispute decision, read for its resolved date, its resolution due date, its filing date and the overpayment it decided.
    dec_filed: The dispute decision is the agreement's most recent dispute decision, read for its resolved date, its resolution due date, its filing date and the overpayment it decided.
    dec_case: The dispute decision is the agreement's most recent dispute decision, read for its resolved date, its resolution due date, its filing date and the overpayment it decided.
    in_scope: When the agreement has no claim payment remittance or no dispute decision on record, or is not paid by capitation, no repayment interest is due under this policy.
    clock_days: 'The clock start of the repayment interest is set by when the decision was made and when the practice paid: when the decision''s resolved date is after its resolution due date, the clock runs from the resolution due date; when the decision was made on or before its resolution due date and the practice''s latest refund on the decided overpayment is dated on or after the dispute''s filing date, the clock runs from that refund date; otherwise the clock runs from the decision''s resolved date.'
    grace_days: 'The grace of the repayment interest is set by the dispute and the size of the repayment: when the practice''s dispute of the decided overpayment stated that it had already been refunded, there is no grace; when the dispute stated any other ground and the repayment is less than grace_small_limit, the grace is grace_small_days days; otherwise the grace is clean_claim_payment_days days.'
    esc_points: 'The delay add-on to the repayment interest rate is set by the days from the decision''s resolved date to the repayment date: more than esc_high_days days adds esc_high_points points to the annual rate; more than esc_low_days and at most esc_high_days days adds esc_low_points points; esc_low_days days or fewer adds nothing.'
    repeat_points: 'The repeat-repayment add-on to the repayment interest rate is set by the claim payment remittances on the agreement dated fewer than 24 whole months before today, the current repayment included: three or more add repeat_high_points points to the annual rate; exactly two add repeat_low_points points; only one adds nothing.'
    min_interest: 'The repayment interest minimum is set by the agreement''s status and tenure: for a termination_pending or terminated agreement repayment interest of any amount is paid; for any other agreement in force min_long_months whole months or more from its effective date the minimum is min_long_amount; otherwise the minimum is prompt_pay_interest_minimum.'
    result: As the standard method, the clock runs over the days from the dispute decision's resolved date to the repayment date, the days held are those days less a grace of clean_claim_payment_days days, never below zero, the annual rate is prompt_pay_interest_annual_pct percent, the repayment interest is the principal times the annual rate divided by one hundred times the days held divided by 365, rounded half up to the cent, and repayment interest below prompt_pay_interest_minimum is not paid.
  factors:
  - id: rep_clock_start
    effect: method
    decides: clock_days
    bindings:
    - clock_days
    ladder:
    - when: the decision's resolved date is after its resolution due date
      method: count the days from the resolution due date to the repayment date
    - when: the decision was made on or before its due date and the practice's latest refund on the decided overpayment is dated on or after the dispute's filing date
      method: count the days from that refund date to the repayment date
    - when: otherwise
      method: count the days from the decision's resolved date to the repayment date (standard)
    baseline:
      clock_days: DAYS(dec_date, rep_date) if in_scope == 1 else 0
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: rep_grace
    effect: parameter
    decides: grace_days
    bindings:
    - grace_days
    ladder:
    - when: the practice's dispute of the decided overpayment stated it had already been refunded
      value: '0'
    - when: the dispute stated any other ground and the repayment is less than grace_small_limit
      value: K('grace_small_days')
    - when: otherwise
      value: P('clean_claim_payment_days')
    baseline:
      grace_days: P('clean_claim_payment_days')
    evidence:
    - history
    cross_difficulty: null
  - id: rep_delay_addon
    effect: parameter
    decides: esc_points
    bindings:
    - esc_points
    ladder:
    - when: more than esc_high_days days from the decision to the repayment
      value: K('esc_high_points')
    - when: more than esc_low_days and at most esc_high_days days
      value: K('esc_low_points')
    - when: otherwise
      value: '0'
    baseline:
      esc_points: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: rep_repeat_addon
    effect: parameter
    decides: repeat_points
    bindings:
    - repeat_points
    ladder:
    - when: three or more claim payment remittances on the agreement fewer than 24 whole months before today
      value: K('repeat_high_points')
    - when: exactly two such remittances
      value: K('repeat_low_points')
    - when: otherwise
      value: '0'
    baseline:
      repeat_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rep_minimum
    effect: parameter
    decides: min_interest
    bindings:
    - min_interest
    ladder:
    - when: the agreement is termination_pending or terminated
      value: '0'
    - when: any other agreement in force min_long_months whole months or more from its effective date
      value: K('min_long_amount')
    - when: otherwise
      value: P('prompt_pay_interest_minimum')
    baseline:
      min_interest: P('prompt_pay_interest_minimum')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The repayment is the agreement's most recent claim payment remittance, which on a capitation agreement only ever repays an over-recovery, and its amount is the principal that bears interest. The dispute decision is the agreement's most recent dispute decision, read for its resolved date, its resolution due date, its filing date and the overpayment it decided. For repayment interest, days are calendar days counted from the earlier date to the later date, the earlier date not counted and the later date counted, and whole months are the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's day of the month. As the standard method, the clock runs over the days from the dispute decision's resolved date to the repayment date, the days held are those days less a grace of clean_claim_payment_days days, never below zero, the annual rate is prompt_pay_interest_annual_pct percent, the repayment interest is the principal times the annual rate divided by one hundred times the days held divided by 365, rounded half up to the cent, and repayment interest below prompt_pay_interest_minimum is not paid. When the agreement has no claim payment remittance or no dispute decision on record, or is not paid by capitation, no repayment interest is due under this policy.
    params:
    - clean_claim_payment_days
    - prompt_pay_interest_annual_pct
    - prompt_pay_interest_minimum
  inputs:
    history:
    - table: provider_payment_events
      aggregate: latest
      field: amount
      filters:
        event_type: provider_remittance_issued
        remittance_component: claim_payment
    - table: provider_disputes
      aggregate: latest
      field: resolved_date
      filters:
        event_type: provider_dispute_resolved
    - table: provider_payment_events
      aggregate: count
      field: provider_payment_event_id
      within_months: 24
      filters:
        event_type: provider_remittance_issued
        remittance_component: claim_payment
    cross_category: []
- id: provider_ext_exit_settlement
  base_policy_refs:
  - provider_evt_overpayment
  - provider_agg_practice_offset
  - provider_termination_without_cause
  - provider_evt_remittance
  overwrite: []
  trigger: on_request
  subject:
  - provider_overpayment_refund_received
  computes: settlement_amount
  target_tool: pay_exit_settlement_0b962b39
  params:
    share_low: 40
    haircut_high: 20
    haircut_low: 10
    tenure_long_months: 96
    tenure_mid_months: 48
    tenure_long_points: 10
    tenure_mid_points: 5
    large_high_points: 10
    large_low_points: 5
    near_days: 60
    far_days: 90
    near_high_points: 10
    near_low_points: 5
    share_mid: 45
  rule: 'This policy governs the exit settlement a practice pays directly to Cascade, at its own request, when its Cascade DHMO Primary Care Dentist Agreement is termination_pending, and only that settlement: the part of the agreement''s open receivable that the capitation payments still due before the termination date are not expected to recover. The open receivable is the total of the agreement''s overpayment notices less every withholding, refund and reduction booked against them, plus every claim payment remittance on the agreement, each of which repays an over-recovery on a capitation agreement. The capitation payments still due are the whole months from today to the termination date less one, never below zero, because assigned members are reassigned dhmo_member_reassignment_days before the termination date and no capitation is paid for the month in which they leave. The exit settlement is recorded as a refund received against the overpayment under recovery, the overpayment that the agreement''s most recent withholding was applied to, and it is never more than that overpayment''s open amount. For the exit settlement, days are calendar days counted from the earlier date to the later date, the earlier date not counted and the later date counted, and whole months are the difference in calendar months, less one when the later date''s day of the month is smaller than the earlier date''s day of the month. For the exit settlement, where two ledger entries or two panel requests a selection reads share the latest date or time, the one listed first on the agreement''s records is taken. As the standard method, each capitation payment still due is taken at the amount of the agreement''s most recent capitation payment, the exit recovery share is recoupment_max_pct_per_remittance percent, the expected recovery is the capitation payments still due times that payment amount times the exit recovery share divided by one hundred, rounded half up to the cent, and the exit settlement is the open receivable less the expected recovery, rounded half up to the cent and never below zero. When the agreement is not termination_pending, is not paid by capitation, or has no capitation payment on record, no exit settlement is worked out under this policy. An exit settlement is fixed only after the latest capitation payment carries the continuing capitation withholding owed on the overpayment under recovery. An exit settlement is not fixed until the records carry a prompt-pay interest payment for the agreement''s latest repayment of an over-recovery. The adjustments set out below change the standard method as each of them states; the exit recovery share they produce is never below zero, the expected recovery is still a single product rounded once, at the end, half up to the cent, and the order in which the adjustments are applied does not change the result. The exit payment projection is set by the agreement''s panel and its capitation trend, the trend being the average of its capitation payments made fewer than 3 whole months before today: when its most recent confirmed panel request closed the panel and the most recent capitation payment is below that average, each payment still due is projected at twice the most recent payment less that average; when its most recent confirmed panel request did not close the panel, or there is none, and the most recent payment is below that average, each payment still due is taken at that average; otherwise each payment still due is taken at the most recent payment. The base exit recovery share is set by the agreement''s dispute decisions dated fewer than 24 whole months before today, because an overpayment cannot be withheld while its dispute is pending and a practice that disputes delays recovery: two or more decisions give share_low percent; exactly one decision gives share_mid percent; none gives recoupment_max_pct_per_remittance percent. The exit competing-recovery haircut is set by the agreement''s overpayment notices dated fewer than 6 whole months before today: three or more lower the expected recovery by haircut_high percent; exactly two lower it by haircut_low percent; fewer than two lower it by nothing. The exit tenure points are set by the whole months from the agreement''s effective date to today: tenure_long_months months or more add tenure_long_points share points; tenure_mid_months months or more but fewer than tenure_long_months add tenure_mid_points share points; fewer than tenure_mid_months months add nothing. The exit balance points are set by the agreement''s overpayment notices dated fewer than 12 whole months before today against the most recent capitation payment: notices totalling at least twice that payment subtract large_high_points share points; notices totalling at least that payment but less than twice it subtract large_low_points share points; smaller totals subtract nothing. The exit timing points are set by the days from today to the termination date: near_days days or fewer subtract near_high_points share points; more than near_days and at most far_days days subtract near_low_points share points; more than far_days days subtract nothing.'
  prerequisite:
  - problem: provider_ext_capitation_continuation
    kind: value_input
    gate: recovered
    form: state
    policy_source: An exit settlement is fixed only after the latest capitation payment carries the continuing capitation withholding owed on the overpayment under recovery.
    condition: The agreement's most recent capitation payment carries a withholding entry for the overpayment under recovery booked against its remittance number at the continuing capitation withholding amount.
    resolved_by: book_capitation_withholding_57430a7a
    effect: recovered rises by the continuing capitation withholding, so the receivable falls by that amount and the exit settlement falls by the same amount (no other input of the settlement reads that withholding).
  - problem: provider_ext_repayment_interest
    kind: state_gate
    gate: provider_payment_events.remittance_component
    form: state
    policy_source: An exit settlement is not fixed until the records carry a prompt-pay interest payment for the agreement's latest repayment of an over-recovery.
    condition: A remittance entry with component prompt_pay_interest dated on or after the agreement's most recent claim payment remittance exists on the agreement.
    resolved_by: pay_repayment_interest_bafa5446
    effect: The wait on the exit settlement is satisfied once the interest payment is booked; the settlement amount itself is not changed by it.
  cross_category: []
  compute:
  - notices: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified')
  - recovered: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') + SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') + SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced')
  - repaid: SUM('provider_payment_events', 'amount', event_type='provider_remittance_issued', remittance_component='claim_payment')
  - receivable: notices - recovered + repaid
  - cap_latest: LATEST('provider_payment_events', 'amount', event_type='provider_remittance_issued', remittance_component='capitation')
  - in_scope: 1 if F('status') == 'termination_pending' and cap_latest != None and P('capitation_pmpm') > 0 else 0
  - payments_left: MX(0, MONTHS(NOW, F('termination_date')) - 1) if in_scope == 1 else 0
  - exit_case: LATEST('provider_payment_events', 'original_payment_event_id', event_type='provider_overpayment_recouped')
  - exit_case_open: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=exit_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', original_payment_event_id=exit_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received', original_payment_event_id=exit_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced', original_payment_event_id=exit_case)
  - cap_avg3: SUM('provider_payment_events', 'amount', within_months=3, event_type='provider_remittance_issued', remittance_component='capitation') / COUNT('provider_payment_events', within_months=3, event_type='provider_remittance_issued', remittance_component='capitation') if COUNT('provider_payment_events', within_months=3, event_type='provider_remittance_issued', remittance_component='capitation') > 0 else 0
  - panel_closed: 1 if LATEST('provider_requests', 'requested_panel_status', date_field='created_at', request_type='panel_status_change', request_status='confirmed') == 'closed' else 0
  - proj_payment: (2 * cap_latest - cap_avg3) if in_scope == 1 and panel_closed == 1 and cap_latest < cap_avg3 else (cap_avg3 if in_scope == 1 and panel_closed == 0 and cap_latest < cap_avg3 else (cap_latest if in_scope == 1 else 0))
  - exit_decisions: COUNT('provider_disputes', within_months=24, date_field='resolved_date', event_type='provider_dispute_resolved')
  - share_base: K('share_low') if exit_decisions >= 2 else (K('share_mid') if exit_decisions == 1 else P('recoupment_max_pct_per_remittance'))
  - haircut: K('haircut_high') if COUNT('provider_payment_events', within_months=6, event_type='provider_overpayment_identified') >= 3 else (K('haircut_low') if COUNT('provider_payment_events', within_months=6, event_type='provider_overpayment_identified') == 2 else 0)
  - tenure_points: K('tenure_long_points') if MONTHS(F('effective_date'), NOW) >= K('tenure_long_months') else (K('tenure_mid_points') if MONTHS(F('effective_date'), NOW) >= K('tenure_mid_months') else 0)
  - notices12: SUM('provider_payment_events', 'amount', within_months=12, event_type='provider_overpayment_identified')
  - large_points: K('large_high_points') if in_scope == 1 and notices12 >= 2 * LATEST('provider_payment_events', 'amount', event_type='provider_remittance_issued', remittance_component='capitation') else (K('large_low_points') if in_scope == 1 and notices12 >= LATEST('provider_payment_events', 'amount', event_type='provider_remittance_issued', remittance_component='capitation') else 0)
  - near_days_left: DAYS(NOW, F('termination_date')) if in_scope == 1 else 0
  - near_points: K('near_high_points') if in_scope == 1 and near_days_left <= K('near_days') else (K('near_low_points') if in_scope == 1 and near_days_left <= K('far_days') else 0)
  - result: RND(MX(0, MN(exit_case_open, receivable - RND(payments_left * proj_payment * MX(0, share_base + tenure_points - large_points - near_points) / 100 * (100 - haircut) / 100)))) if in_scope == 1 else 0
  compute_basis:
    notices: The open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them, plus every claim payment remittance on the agreement, each of which repays an over-recovery on a capitation agreement.
    recovered: The open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them, plus every claim payment remittance on the agreement, each of which repays an over-recovery on a capitation agreement.
    repaid: The open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them, plus every claim payment remittance on the agreement, each of which repays an over-recovery on a capitation agreement.
    receivable: The open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them, plus every claim payment remittance on the agreement, each of which repays an over-recovery on a capitation agreement.
    cap_latest: As the standard method, each capitation payment still due is taken at the amount of the agreement's most recent capitation payment, the exit recovery share is recoupment_max_pct_per_remittance percent, the expected recovery is the capitation payments still due times that payment amount times the exit recovery share divided by one hundred, rounded half up to the cent, and the exit settlement is the open receivable less the expected recovery, rounded half up to the cent and never below zero.
    in_scope: When the agreement is not termination_pending, is not paid by capitation, or has no capitation payment on record, no exit settlement is worked out under this policy.
    payments_left: The capitation payments still due are the whole months from today to the termination date less one, never below zero, because assigned members are reassigned dhmo_member_reassignment_days before the termination date and no capitation is paid for the month in which they leave.
    cap_avg3: 'The exit payment projection is set by the agreement''s panel and its capitation trend, the trend being the average of its capitation payments made fewer than 3 whole months before today: when its most recent confirmed panel request closed the panel and the most recent capitation payment is below that average, each payment still due is projected at twice the most recent payment less that average; when its most recent confirmed panel request did not close the panel, or there is none, and the most recent payment is below that average, each payment still due is taken at that average; otherwise each payment still due is taken at the most recent payment.'
    panel_closed: 'The exit payment projection is set by the agreement''s panel and its capitation trend, the trend being the average of its capitation payments made fewer than 3 whole months before today: when its most recent confirmed panel request closed the panel and the most recent capitation payment is below that average, each payment still due is projected at twice the most recent payment less that average; when its most recent confirmed panel request did not close the panel, or there is none, and the most recent payment is below that average, each payment still due is taken at that average; otherwise each payment still due is taken at the most recent payment.'
