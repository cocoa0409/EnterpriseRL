    exit_case: The exit settlement is recorded as a refund received against the overpayment under recovery, the overpayment that the agreement's most recent withholding was applied to, and it is never more than that overpayment's open amount.
    exit_case_open: The exit settlement is recorded as a refund received against the overpayment under recovery, the overpayment that the agreement's most recent withholding was applied to, and it is never more than that overpayment's open amount.
    exit_decisions: 'The base exit recovery share is set by the agreement''s dispute decisions dated fewer than 24 whole months before today, because an overpayment cannot be withheld while its dispute is pending and a practice that disputes delays recovery: two or more decisions give share_low percent; exactly one decision gives share_mid percent; none gives recoupment_max_pct_per_remittance percent.'
  factors:
  - id: exit_projection
    effect: method
    decides: proj_payment
    bindings:
    - cap_avg3
    - panel_closed
    - proj_payment
    ladder:
    - when: the most recent confirmed panel request closed the panel and the most recent capitation payment is below the 3-month average
      method: project each payment still due at twice the most recent payment less the 3-month average
    - when: the panel was not closed by such a request and the most recent payment is below the 3-month average
      method: take each payment still due at the 3-month average
    - when: otherwise
      method: take each payment still due at the most recent payment (standard)
    baseline:
      proj_payment: cap_latest if in_scope == 1 else 0
    evidence:
    - history
    cross_difficulty: null
  - id: exit_base_share
    effect: parameter
    decides: share_base
    bindings:
    - exit_decisions
    - share_base
    ladder:
    - when: two or more dispute decisions fewer than 24 whole months before today
      value: K('share_low')
    - when: exactly one such decision
