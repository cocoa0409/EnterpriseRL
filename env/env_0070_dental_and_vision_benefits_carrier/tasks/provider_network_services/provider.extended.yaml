  baseline:
    rule: The open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them, plus every claim payment remittance on the agreement, each of which repays an over-recovery on a capitation agreement. The capitation payments still due are the whole months from today to the termination date less one, never below zero, because assigned members are reassigned dhmo_member_reassignment_days before the termination date and no capitation is paid for the month in which they leave. For the exit settlement, days are calendar days counted from the earlier date to the later date, the earlier date not counted and the later date counted, and whole months are the difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's day of the month. As the standard method, each capitation payment still due is taken at the amount of the agreement's most recent capitation payment, the exit recovery share is recoupment_max_pct_per_remittance percent, the expected recovery is the capitation payments still due times that payment amount times the exit recovery share divided by one hundred, rounded half up to the cent, and the exit settlement is the open receivable less the expected recovery, rounded half up to the cent and never below zero. When the agreement is not termination_pending, is not paid by capitation, or has no capitation payment on record, no exit settlement is worked out under this policy.
    params:
    - recoupment_max_pct_per_remittance
    - dhmo_member_reassignment_days
  inputs:
    history:
    - table: provider_payment_events
      aggregate: sum
      field: amount
      filters:
        event_type: provider_overpayment_identified
    - table: provider_payment_events
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: provider_remittance_issued
        remittance_component: capitation
    - table: provider_disputes
      aggregate: count
      field: provider_dispute_id
      within_months: 24
      filters:
        event_type: provider_dispute_resolved
    cross_category: []
- id: provider_ext_run_continuation
  base_policy_refs:
  - provider_agg_practice_offset
  - provider_evt_overpayment
  - provider_evt_disputes
  - provider_evt_remittance
  overwrite:
  - base_policy: provider_agg_practice_offset
    superseded_clause: 'Overpayments are recovered at the level of the practice (the customer that holds the agreements): an open overpayment under one agreement may be offset against remittances under any active or termination_pending agreement of the same practice.'
    replaced_by: 'Overpayments are recovered at the level of the practice: an open overpayment under one agreement may be offset against remittances under any active or termination_pending agreement of the same practice, except that a continuing capitation withholding, a continuing run withholding, a post-decision withholding and a plan installment each select only among the overpayments of the agreement whose payment they are withheld from, and only those four do.'
  - base_policy: provider_agg_practice_offset
    superseded_clause: Open overpayments of the practice are offset in recoupment_order (oldest notice first), and the total withheld from one remittance may not exceed recoupment_max_pct_per_remittance of that remittance's claim payments.
    replaced_by: Open overpayments of the practice are offset oldest notice first, except that a continuing capitation withholding and a continuing run withholding go to the overpayment the agreement's most recent withholding was applied to, a post-decision withholding goes to the overpayment of the agreement's most recent dispute decision and a plan installment goes to the overpayment the plan down payment was recorded against, and only those four withholdings follow these selections instead of notice order; the total withheld from a claim payment run may not exceed recoupment_max_pct_per_remittance percent of that run's claim payments, while a withholding from a capitation payment is measured against the capitation amount itself, at recoupment_max_pct_per_remittance percent of it for the first withholding of an overpayment and at the continuing capitation withholding share for a continuing capitation withholding.
  trigger: state_due
  subject:
  - provider_overpayment_recouped
  computes: withheld_amount
  target_tool: book_run_withholding_d2ce9ec8
  params:
    aging_linear_after: 30
    aging_flat_after: 10
    aging_step_days: 3
    aging_flat_points: 4
    hard_high_ratio: 0.25
    hard_low_ratio: 0.1
    hard_high_relief: 25
    hard_low_relief: 15
    freq_high_count: 5
    freq_low_count: 3
    freq_high_points: 5
    freq_low_points: 3
    lost_high_points: 4
    lost_low_points: 2
    size_full_points: 8
    size_part_points: 5
    size_part_fraction: 0.4
    tenure_long_months: 96
    tenure_mid_months: 48
    tenure_long_relief: 15
    tenure_mid_relief: 8
  rule: 'This policy governs the withholding Cascade books against a claim payment run of an agreement that is paid by claim payments rather than by capitation, to continue the recovery of the overpayment that the agreement''s most recent withholding was applied to, and only such a continuing run withholding. Overpayments are recovered at the level of the practice: an open overpayment under one agreement may be offset against remittances under any active or termination_pending agreement of the same practice, except that a continuing capitation withholding, a continuing run withholding, a post-decision withholding and a plan installment each select only among the overpayments of the agreement whose payment they are withheld from, and only those four do. Open overpayments of the practice are offset oldest notice first, except that a continuing capitation withholding and a continuing run withholding go to the overpayment the agreement''s most recent withholding was applied to, a post-decision withholding goes to the overpayment of the agreement''s most recent dispute decision and a plan installment goes to the overpayment the plan down payment was recorded against, and only those four withholdings follow these selections instead of notice order; the total withheld from a claim payment run may not exceed recoupment_max_pct_per_remittance percent of that run''s claim payments, while a withholding from a capitation payment is measured against the capitation amount itself, at recoupment_max_pct_per_remittance percent of it for the first withholding of an overpayment and at the continuing capitation withholding share for a continuing capitation withholding. For a continuing run withholding, the overpayment under recovery is the overpayment that the agreement''s most recent withholding was applied to, and its open amount is its notice amount less every withholding, refund and reduction booked against it. The claim payment run is the agreement''s most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number. For the continuing run withholding, days are calendar days counted from the earlier date to the later date, the earlier date not counted and the later date counted, and whole months are the difference in calendar months, less one when the later date''s day of the month is smaller than the earlier date''s day of the month. For the continuing run withholding, where two ledger entries a selection reads share the latest date, the one listed first on the agreement''s ledger is taken. As the standard method, the continuing run withholding share is recoupment_max_pct_per_remittance percent, the room in the claim payment run is the run''s claim payment amount times that share divided by one hundred, rounded half up to the cent, less the amount already withheld from it, and the continuing run withholding is the lesser of the open amount of the overpayment under recovery and that room, never below zero. When the agreement is paid by capitation, has no claim payment remittance on record, or none of its overpayments has yet had a withholding applied to it, there is no continuing run withholding and nothing is booked. A continuing run withholding is booked at most once against a claim payment run, and it is the first entry the run carries: once the run carries any withholding or plan installment, nothing more is owed from that run under this policy, whatever happens to the receivable afterwards. The adjustments below are applied to the standard share by simple addition or subtraction as each states, so their order does not change the result, and the adjusted continuing run withholding share is never below zero and never above recoupment_max_pct_per_remittance percent; the room and the withholding are then worked out as in the standard method with the adjusted share. The run aging adjustment to the continuing run withholding share is set by the days the overpayment under recovery is past its refund window, being the days from its notice date to today less overpayment_refund_window_days: more than aging_linear_after days past adds one share point for every whole aging_step_days days past the window; more than aging_flat_after and at most aging_linear_after days past adds a flat aging_flat_points share points; aging_flat_after days past or fewer adds nothing. The run hardship relief to the continuing run withholding share is set by the agreement''s open receivable, its overpayment notices less every withholding, refund and reduction booked against them, against its claim payments in remittances dated fewer than 3 whole months before today: a receivable of at least hard_high_ratio times those claim payments subtracts hard_high_relief share points; a receivable of at least hard_low_ratio times them but less than hard_high_ratio times them subtracts hard_low_relief share points; a smaller receivable, or no such claim payments, subtracts nothing. The run notice-frequency adjustment to the continuing run withholding share is set by the agreement''s overpayment notices dated fewer than 12 whole months before today: freq_high_count or more add freq_high_points share points; freq_low_count or more but fewer than freq_high_count add freq_low_points share points; fewer than freq_low_count add nothing. The run dispute-history adjustment to the continuing run withholding share is set by the agreement''s dispute decisions that upheld the overpayment in full and are dated fewer than 24 whole months before today: two or more add lost_high_points share points; exactly one adds lost_low_points share points; none adds nothing. The run notice-size adjustment to the continuing run withholding share is set by the notice amount of the overpayment under recovery against the run''s claim payment amount: a notice amount of at least the run''s claim payment amount adds size_full_points share points; a notice amount of at least size_part_fraction times it but less than it adds size_part_points share points; a smaller notice amount adds nothing. The run tenure relief to the continuing run withholding share is set by the whole months from the agreement''s effective date to today: tenure_long_months months or more subtracts tenure_long_relief share points; tenure_mid_months months or more but fewer than tenure_long_months subtracts tenure_mid_relief share points; fewer than tenure_mid_months months subtracts nothing.'
