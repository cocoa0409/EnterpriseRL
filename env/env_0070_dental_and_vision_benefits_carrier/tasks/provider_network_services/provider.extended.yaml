  cross_category: []
  compute:
  - run_no: LATEST('provider_payment_events', 'remittance_number', event_type='provider_remittance_issued', remittance_component='claim_payment')
  - run_amt: LATEST('provider_payment_events', 'amount', event_type='provider_remittance_issued', remittance_component='claim_payment')
  - case_id: LATEST('provider_payment_events', 'original_payment_event_id', event_type='provider_overpayment_recouped')
  - in_scope: 1 if run_amt != None and case_id != None and P('capitation_pmpm') == 0 and COUNT('provider_payment_events', event_type='provider_overpayment_recouped', remittance_number=run_no) == 0 else 0
  - run_withheld: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', remittance_number=run_no) if in_scope == 1 else 0
  - case_open: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=case_id) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', original_payment_event_id=case_id) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received', original_payment_event_id=case_id) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced', original_payment_event_id=case_id) if in_scope == 1 else 0
  - days_past_window: DAYS(LATEST('provider_payment_events', 'event_date', event_type='provider_overpayment_identified', provider_payment_event_id=case_id), NOW) - P('overpayment_refund_window_days') if in_scope == 1 else 0
  - aging_points: int(days_past_window / K('aging_step_days')) if days_past_window > K('aging_linear_after') else (K('aging_flat_points') if days_past_window > K('aging_flat_after') else 0)
  - hard_ratio: (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced')) / SUM('provider_payment_events', 'amount', within_months=3, event_type='provider_remittance_issued', remittance_component='claim_payment') if SUM('provider_payment_events', 'amount', within_months=3, event_type='provider_remittance_issued', remittance_component='claim_payment') > 0 else 0
  - hard_relief: K('hard_high_relief') if hard_ratio >= K('hard_high_ratio') else (K('hard_low_relief') if hard_ratio >= K('hard_low_ratio') else 0)
  - freq_count: COUNT('provider_payment_events', within_months=12, event_type='provider_overpayment_identified')
  - freq_points: K('freq_high_points') if freq_count >= K('freq_high_count') else (K('freq_low_points') if freq_count >= K('freq_low_count') else 0)
  - lost_count: COUNT('provider_disputes', within_months=24, date_field='resolved_date', event_type='provider_dispute_resolved', outcome='upheld_overpayment')
  - lost_points: K('lost_high_points') if lost_count >= 2 else (K('lost_low_points') if lost_count == 1 else 0)
  - run_notice: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=case_id) if in_scope == 1 else 0
  - size_points: K('size_full_points') if in_scope == 1 and run_notice >= run_amt else (K('size_part_points') if in_scope == 1 and run_notice >= K('size_part_fraction') * run_amt else 0)
  - tenure_months: MONTHS(F('effective_date'), NOW)
  - tenure_relief: K('tenure_long_relief') if tenure_months >= K('tenure_long_months') else (K('tenure_mid_relief') if tenure_months >= K('tenure_mid_months') else 0)
  - result: RND(MX(0, MN(case_open, RND(run_amt * MX(0, MN(P('recoupment_max_pct_per_remittance'), P('recoupment_max_pct_per_remittance') + aging_points - hard_relief + freq_points + lost_points + size_points - tenure_relief)) / 100) - run_withheld))) if in_scope == 1 else 0
  compute_basis:
    run_no: The claim payment run is the agreement's most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    run_amt: The claim payment run is the agreement's most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    run_withheld: The claim payment run is the agreement's most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    case_id: For a continuing run withholding, the overpayment under recovery is the overpayment that the agreement's most recent withholding was applied to, and its open amount is its notice amount less every withholding, refund and reduction booked against it.
    case_open: For a continuing run withholding, the overpayment under recovery is the overpayment that the agreement's most recent withholding was applied to, and its open amount is its notice amount less every withholding, refund and reduction booked against it.
