    ladder:
    - when: the decision upheld the overpayment in full on a dispute stating the claim was correctly paid
      value: K('outcome_firm_points')
    - when: it upheld the overpayment in full on a dispute stating any other ground
      value: K('outcome_plain_points')
    - when: otherwise
      value: '0'
    baseline:
      outcome_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: dec_delay_relief
    effect: parameter
    decides: late_relief
    bindings:
    - late_days
    - late_relief
    ladder:
    - when: resolved more than late_long_days days after its resolution due date
      value: K('late_long_relief')
    - when: resolved one to late_long_days days after its due date
      value: K('late_short_relief')
    - when: otherwise
      value: '0'
    baseline:
      late_relief: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: dec_catch_up
    effect: method
    decides: catch_points
    bindings:
    - catch_days
    - catch_points
    ladder:
    - when: more than catch_linear_after days from the decision to the run
      method: add catch_step_points ceiling points for every whole 7 days
    - when: more than catch_flat_after and at most catch_linear_after days
      method: add a flat catch_flat_points ceiling points
    - when: otherwise
      method: add nothing (standard ceiling)
    baseline:
      catch_points: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: dec_refund_relief
    effect: parameter
    decides: refund_relief
    bindings:
    - refund_count
    - refund_relief
    ladder:
    - when: two or more refunds received from the practice fewer than 24 whole months before today
      value: K('refund_high_relief')
    - when: exactly one such refund
      value: K('refund_low_relief')
    - when: otherwise
      value: '0'
    baseline:
      refund_relief: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: dec_prompt_relief
    effect: parameter
    decides: source_relief
    bindings:
    - filing_days
    - source_relief
    ladder:
    - when: the decided dispute was filed prompt_fast_days days or fewer after the notice date
      value: K('prompt_fast_relief')
    - when: it was filed more than prompt_fast_days and at most prompt_mid_days days after the notice date
