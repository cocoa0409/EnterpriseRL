    large_points: 'The exit balance points are set by the agreement''s overpayment notices dated fewer than 12 whole months before today against the most recent capitation payment: notices totalling at least twice that payment subtract large_high_points share points; notices totalling at least that payment but less than twice it subtract large_low_points share points; smaller totals subtract nothing.'
    near_days_left: 'The exit timing points are set by the days from today to the termination date: near_days days or fewer subtract near_high_points share points; more than near_days and at most far_days days subtract near_low_points share points; more than far_days days subtract nothing.'
    near_points: 'The exit timing points are set by the days from today to the termination date: near_days days or fewer subtract near_high_points share points; more than near_days and at most far_days days subtract near_low_points share points; more than far_days days subtract nothing.'
