  - in_scope: 1 if run_amt != None and receivable > 0 and P('capitation_pmpm') == 0 else 0
  - plan_case: LATEST('provider_payment_events', 'original_payment_event_id', event_type='provider_overpayment_refund_received')
  - run_withheld: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', remittance_number=run_no) if in_scope == 1 else 0
  - pb_dec_case: LATEST('provider_disputes', 'provider_payment_event_id', date_field='resolved_date', event_type='provider_dispute_resolved')
  - pb_dec_days: DAYS(LATEST('provider_disputes', 'resolved_date', date_field='resolved_date', event_type='provider_dispute_resolved'), NOW) if pb_dec_case != None else 9999
  - pb_dec_open: (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=pb_dec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', original_payment_event_id=pb_dec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received', original_payment_event_id=pb_dec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced', original_payment_event_id=pb_dec_case)) if pb_dec_case != None else 0
  - pb_rec_case: LATEST('provider_payment_events', 'original_payment_event_id', event_type='provider_overpayment_recouped')
  - pb_rec_open: (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=pb_rec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', original_payment_event_id=pb_rec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received', original_payment_event_id=pb_rec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced', original_payment_event_id=pb_rec_case)) if pb_rec_case != None else 0
  - plan_balance: (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced')) - pb_dec_open if pb_dec_days <= K('plan_recent_decision_days') and pb_dec_open > 0 else ((SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced')) - MN(pb_rec_open, RND(run_amt * P('recoupment_max_pct_per_remittance') / 100)) if pb_rec_open > 0 and run_amt != None else (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced')))
  - base_runs: K('plan_runs_long') if (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced')) >= K('plan_len_high_from') else (K('plan_runs_mid') if (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced')) >= K('plan_len_low_from') else K('plan_runs_standard'))
  - tenure_runs: K('tenure_long_runs') if MONTHS(F('effective_date'), NOW) >= K('tenure_long_months') else (K('tenure_mid_runs') if MONTHS(F('effective_date'), NOW) >= K('tenure_mid_months') else 0)
  - small_contract: CFIELD('group', 'group_contract_id', termination_reason='not_terminated')
  - small_census: XLATEST('group', 'group_eligibility_events', 'eligible_employees_reported', date_field='reported_date', event_type='group_census_reported', group_contract_id=small_contract)
  - small_status: CFIELD('group', 'status', termination_reason='not_terminated')
  - small_runs: K('small_runs_high') if (small_census != None and (small_status == 'applied' or small_status == 'active')) and small_census < K('small_staff_limit') else (K('small_runs_mid') if (small_census != None and (small_status == 'applied' or small_status == 'active')) and small_census >= K('small_staff_limit') and small_census <= K('group_small_max') else 0)
  - freq_runs: K('freq_high_runs') if COUNT('provider_payment_events', within_months=12, event_type='provider_overpayment_identified') >= K('freq_high_count') else (K('freq_low_runs') if COUNT('provider_payment_events', within_months=12, event_type='provider_overpayment_identified') >= K('freq_low_count') else 0)
  - volume_runs: K('volume_high_runs') if SUM('provider_payment_events', 'amount', within_months=3, event_type='provider_remittance_issued', remittance_component='claim_payment') >= K('volume_high') else (K('volume_low_runs') if SUM('provider_payment_events', 'amount', within_months=3, event_type='provider_remittance_issued', remittance_component='claim_payment') >= K('volume_low') else 0)
  - result: RND(MX(0, MN(RND(plan_balance / MX(1, base_runs + tenure_runs + small_runs - freq_runs - volume_runs)), RND(run_amt * P('recoupment_max_pct_per_remittance') / 100) - run_withheld))) if in_scope == 1 and COUNT('provider_payment_events', event_type='provider_overpayment_recouped', remittance_number=run_no, original_payment_event_id=plan_case) == 0 else 0
  compute_basis:
    run_no: For a plan installment, the claim payment run is the agreement's most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    run_amt: For a plan installment, the claim payment run is the agreement's most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    receivable: For a plan installment, the open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them, the plan down payment included.
    in_scope: When the agreement is paid by capitation, has no claim payment remittance on record or has no open receivable, no plan installment is withheld. The first plan installment is taken after every other withholding the run carries and is the last entry booked against it. A remittance carries at most one withholding entry per overpayment, so when the run already carries any withholding entry for the overpayment the plan down payment was recorded against, nothing more is withheld from it under this policy.
    run_withheld: For a plan installment, the claim payment run is the agreement's most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    pb_dec_case: 'The plan balance measure is set by the agreement''s recovery records: when its most recent dispute decision is dated plan_recent_decision_days days or fewer before today and that decision''s overpayment is still open, the plan balance is the open receivable less that overpayment''s open amount, which stays on its own post-decision recovery; when there is no such decision and the overpayment the agreement''s most recent withholding was applied to is still open, the plan balance is the open receivable less the lesser of that overpayment''s open amount and the run''s standard room, recoupment_max_pct_per_remittance percent of the run''s claim payment amount rounded half up to the cent, which its next scheduled withholding is expected to take; otherwise the plan balance is the whole open receivable.'
    pb_dec_days: 'The plan balance measure is set by the agreement''s recovery records: when its most recent dispute decision is dated plan_recent_decision_days days or fewer before today and that decision''s overpayment is still open, the plan balance is the open receivable less that overpayment''s open amount, which stays on its own post-decision recovery; when there is no such decision and the overpayment the agreement''s most recent withholding was applied to is still open, the plan balance is the open receivable less the lesser of that overpayment''s open amount and the run''s standard room, recoupment_max_pct_per_remittance percent of the run''s claim payment amount rounded half up to the cent, which its next scheduled withholding is expected to take; otherwise the plan balance is the whole open receivable.'
    plan_balance: 'The plan balance measure is set by the agreement''s recovery records: when its most recent dispute decision is dated plan_recent_decision_days days or fewer before today and that decision''s overpayment is still open, the plan balance is the open receivable less that overpayment''s open amount, which stays on its own post-decision recovery; when there is no such decision and the overpayment the agreement''s most recent withholding was applied to is still open, the plan balance is the open receivable less the lesser of that overpayment''s open amount and the run''s standard room, recoupment_max_pct_per_remittance percent of the run''s claim payment amount rounded half up to the cent, which its next scheduled withholding is expected to take; otherwise the plan balance is the whole open receivable.'
    base_runs: 'The base plan run count is set by the size of the open receivable: plan_len_high_from or more gives plan_runs_long runs; plan_len_low_from or more but less than plan_len_high_from gives plan_runs_mid runs; a smaller receivable gives plan_runs_standard runs.'
    tenure_runs: 'The plan tenure addition to the plan run count is set by the whole months from the agreement''s effective date to today: tenure_long_months months or more adds tenure_long_runs runs; tenure_mid_months months or more but fewer than tenure_long_months adds tenure_mid_runs runs; fewer than tenure_mid_months months adds nothing.'
    freq_runs: 'The plan notice-frequency reduction of the plan run count is set by the agreement''s overpayment notices dated fewer than 12 whole months before today: freq_high_count or more remove freq_high_runs runs; freq_low_count or more but fewer than freq_high_count remove freq_low_runs runs; fewer than freq_low_count remove nothing.'
    volume_runs: 'The plan volume reduction of the plan run count is set by the agreement''s claim payments in remittances dated fewer than 3 whole months before today: volume_high or more removes volume_high_runs runs; volume_low or more but less than volume_high removes volume_low_runs runs; less than volume_low removes nothing.'
    result: As the standard method, the plan balance is the open receivable, the plan runs over plan_runs_standard payment runs, the plan installment is the plan balance divided by the number of plan runs, rounded half up to the cent, and the first plan installment withheld is the lesser of that installment and the room left in the claim payment run, the room being the run's claim payment amount times recoupment_max_pct_per_remittance divided by one hundred, rounded half up to the cent, less the amount already withheld from it, never below zero.
    pb_dec_open: 'The plan balance measure is set by the agreement''s recovery records: when its most recent dispute decision is dated plan_recent_decision_days days or fewer before today and that decision''s overpayment is still open, the plan balance is the open receivable less that overpayment''s open amount, which stays on its own post-decision recovery; when there is no such decision and the overpayment the agreement''s most recent withholding was applied to is still open, the plan balance is the open receivable less the lesser of that overpayment''s open amount and the run''s standard room, recoupment_max_pct_per_remittance percent of the run''s claim payment amount rounded half up to the cent, which its next scheduled withholding is expected to take; otherwise the plan balance is the whole open receivable.'
    pb_rec_case: 'The plan balance measure is set by the agreement''s recovery records: when its most recent dispute decision is dated plan_recent_decision_days days or fewer before today and that decision''s overpayment is still open, the plan balance is the open receivable less that overpayment''s open amount, which stays on its own post-decision recovery; when there is no such decision and the overpayment the agreement''s most recent withholding was applied to is still open, the plan balance is the open receivable less the lesser of that overpayment''s open amount and the run''s standard room, recoupment_max_pct_per_remittance percent of the run''s claim payment amount rounded half up to the cent, which its next scheduled withholding is expected to take; otherwise the plan balance is the whole open receivable.'
    pb_rec_open: 'The plan balance measure is set by the agreement''s recovery records: when its most recent dispute decision is dated plan_recent_decision_days days or fewer before today and that decision''s overpayment is still open, the plan balance is the open receivable less that overpayment''s open amount, which stays on its own post-decision recovery; when there is no such decision and the overpayment the agreement''s most recent withholding was applied to is still open, the plan balance is the open receivable less the lesser of that overpayment''s open amount and the run''s standard room, recoupment_max_pct_per_remittance percent of the run''s claim payment amount rounded half up to the cent, which its next scheduled withholding is expected to take; otherwise the plan balance is the whole open receivable.'
    small_census: 'The plan small-practice addition to the plan run count is set by the practice''s documented employee headcount: the only headcount documentation Cascade holds for a practice is the census report on the practice''s own Cascade staff group contract, so the headcount is the eligible employees on the most recent census report of that contract while it has not ended (status applied or active). A documented headcount of fewer than small_staff_limit employees adds small_runs_high runs; a documented headcount of small_staff_limit up to group_small_max employees adds small_runs_mid runs; a practice with no such census on file, whose contract has ended, or with a larger documented headcount is on the standard terms and adds nothing.'
    small_status: 'The plan small-practice addition to the plan run count is set by the practice''s documented employee headcount: the only headcount documentation Cascade holds for a practice is the census report on the practice''s own Cascade staff group contract, so the headcount is the eligible employees on the most recent census report of that contract while it has not ended (status applied or active). A documented headcount of fewer than small_staff_limit employees adds small_runs_high runs; a documented headcount of small_staff_limit up to group_small_max employees adds small_runs_mid runs; a practice with no such census on file, whose contract has ended, or with a larger documented headcount is on the standard terms and adds nothing.'
    small_runs: 'The plan small-practice addition to the plan run count is set by the practice''s documented employee headcount: the only headcount documentation Cascade holds for a practice is the census report on the practice''s own Cascade staff group contract, so the headcount is the eligible employees on the most recent census report of that contract while it has not ended (status applied or active). A documented headcount of fewer than small_staff_limit employees adds small_runs_high runs; a documented headcount of small_staff_limit up to group_small_max employees adds small_runs_mid runs; a practice with no such census on file, whose contract has ended, or with a larger documented headcount is on the standard terms and adds nothing.'
    plan_case: The first plan installment is taken after every other withholding the run carries and is the last entry booked against it. A remittance carries at most one withholding entry per overpayment, so when the run already carries any withholding entry for the overpayment the plan down payment was recorded against, nothing more is withheld from it under this policy.
    small_contract: 'The plan small-practice addition to the plan run count is set by the practice''s documented employee headcount: the only headcount documentation Cascade holds for a practice is the census report on the practice''s own Cascade staff group contract, so the headcount is the eligible employees on the most recent census report of that contract while it has not ended (status applied or active). A documented headcount of fewer than small_staff_limit employees adds small_runs_high runs; a documented headcount of small_staff_limit up to group_small_max employees adds small_runs_mid runs; a practice with no such census on file, whose contract has ended, or with a larger documented headcount is on the standard terms and adds nothing.'
  factors:
  - id: pl_balance_measure
    effect: method
    decides: plan_balance
    bindings:
    - pb_dec_case
    - pb_dec_days
    - pb_dec_open
    - pb_rec_case
    - pb_rec_open
    - plan_balance
    ladder:
    - when: the most recent dispute decision is dated plan_recent_decision_days days or fewer before today and its overpayment is still open
      method: open receivable less that overpayment's open amount
    - when: no such decision and the overpayment of the most recent withholding is still open
      method: open receivable less the lesser of that overpayment's open amount and the run's standard room
    - when: otherwise
      method: the whole open receivable (standard)
    baseline:
      plan_balance: (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced'))
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: pl_length
    effect: parameter
    decides: base_runs
    bindings:
    - base_runs
    ladder:
    - when: open receivable of plan_len_high_from or more
      value: K('plan_runs_long')
    - when: plan_len_low_from or more but less than plan_len_high_from
      value: K('plan_runs_mid')
    - when: otherwise
      value: K('plan_runs_standard')
    baseline:
      base_runs: K('plan_runs_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: pl_tenure_addition
    effect: parameter
    decides: tenure_runs
    bindings:
    - tenure_runs
    ladder:
    - when: the agreement has been in force tenure_long_months whole months or more
      value: K('tenure_long_runs')
    - when: tenure_mid_months whole months or more but fewer than tenure_long_months
      value: K('tenure_mid_runs')
    - when: otherwise
      value: '0'
    baseline:
      tenure_runs: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: pl_notice_frequency
    effect: parameter
    decides: freq_runs
    bindings:
    - freq_runs
    ladder:
    - when: freq_high_count or more notices fewer than 12 whole months before today
      value: K('freq_high_runs')
    - when: freq_low_count or more but fewer than freq_high_count
      value: K('freq_low_runs')
    - when: otherwise
      value: '0'
    baseline:
      freq_runs: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: pl_volume
    effect: parameter
    decides: volume_runs
    bindings:
    - volume_runs
    ladder:
    - when: claim payments of the last 3 whole months of volume_high or more
      value: K('volume_high_runs')
    - when: volume_low or more but less than volume_high
      value: K('volume_low_runs')
    - when: otherwise
      value: '0'
    baseline:
      volume_runs: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: pl_small_practice
    effect: parameter
    decides: small_runs
    bindings:
    - small_contract
    - small_census
    - small_status
    - small_runs
    ladder:
    - when: the most recent census of the practice's own applied or active Cascade staff group contract documents fewer than small_staff_limit employees
      value: K('small_runs_high')
    - when: that census documents small_staff_limit up to group_small_max employees
      value: K('small_runs_mid')
    - when: 'otherwise (no census on file, contract ended, or a larger headcount): standard terms'
      value: '0'
    baseline:
      small_runs: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: group
  baseline:
    rule: For a plan installment, the open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them, the plan down payment included. For a plan installment, the claim payment run is the agreement's most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number. As the standard method, the plan balance is the open receivable, the plan runs over plan_runs_standard payment runs, the plan installment is the plan balance divided by the number of plan runs, rounded half up to the cent, and the first plan installment withheld is the lesser of that installment and the room left in the claim payment run, the room being the run's claim payment amount times recoupment_max_pct_per_remittance divided by one hundred, rounded half up to the cent, less the amount already withheld from it, never below zero. When the agreement is paid by capitation, has no claim payment remittance on record or has no open receivable, no plan installment is withheld. The first plan installment is taken after every other withholding the run carries and is the last entry booked against it. A remittance carries at most one withholding entry per overpayment, so when the run already carries any withholding entry for the overpayment the plan down payment was recorded against, nothing more is withheld from it under this policy.
    params:
    - plan_runs_standard
    - recoupment_max_pct_per_remittance
  inputs:
    history:
    - table: provider_payment_events
      aggregate: sum
      field: amount
      filters:
        event_type: provider_overpayment_identified
    - table: provider_disputes
      aggregate: latest
      field: resolved_date
      filters:
        event_type: provider_dispute_resolved
    - category: group
      table: group_eligibility_events
      aggregate: latest
      field: eligible_employees_reported
      filters:
        event_type: group_census_reported
    cross_category:
    - group
