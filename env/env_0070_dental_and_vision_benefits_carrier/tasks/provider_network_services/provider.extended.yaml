  - in_scope: 1 if run_amt != None and dec_case != None and P('capitation_pmpm') == 0 and (dec_outcome == 'upheld_overpayment' or dec_outcome == 'overpayment_reduced') and COUNT('provider_payment_events', event_type='provider_overpayment_recouped', original_payment_event_id=dec_case) == 0 and DAYS(LATEST('provider_disputes', 'resolved_date', date_field='resolved_date', event_type='provider_dispute_resolved'), run_date) >= 1 else 0
  - run_withheld: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', remittance_number=run_no) if in_scope == 1 else 0
  - dec_open: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=dec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', original_payment_event_id=dec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received', original_payment_event_id=dec_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced', original_payment_event_id=dec_case) if in_scope == 1 else 0
  - outcome_points: K('outcome_firm_points') if in_scope == 1 and dec_outcome == 'upheld_overpayment' and LATEST('provider_disputes', 'dispute_basis', date_field='resolved_date', event_type='provider_dispute_resolved') == 'claim_correctly_paid' else (K('outcome_plain_points') if in_scope == 1 and dec_outcome == 'upheld_overpayment' else 0)
  - late_days: DAYS(LATEST('provider_disputes', 'resolution_due_date', date_field='resolved_date', event_type='provider_dispute_resolved'), LATEST('provider_disputes', 'resolved_date', date_field='resolved_date', event_type='provider_dispute_resolved')) if in_scope == 1 else 0
  - late_relief: K('late_long_relief') if late_days > K('late_long_days') else (K('late_short_relief') if late_days > 0 else 0)
  - catch_days: DAYS(LATEST('provider_disputes', 'resolved_date', date_field='resolved_date', event_type='provider_dispute_resolved'), run_date) if in_scope == 1 else 0
  - catch_points: K('catch_step_points') * int(catch_days / 7) if catch_days > K('catch_linear_after') else (K('catch_flat_points') if catch_days > K('catch_flat_after') else 0)
  - refund_count: COUNT('provider_payment_events', within_months=24, event_type='provider_overpayment_refund_received')
  - refund_relief: K('refund_high_relief') if refund_count >= 2 else (K('refund_low_relief') if refund_count == 1 else 0)
  - filing_days: DAYS(LATEST('provider_payment_events', 'event_date', event_type='provider_overpayment_identified', provider_payment_event_id=dec_case), LATEST('provider_disputes', 'filed_date', date_field='resolved_date', event_type='provider_dispute_resolved')) if in_scope == 1 else 9999
  - source_relief: K('prompt_fast_relief') if filing_days <= K('prompt_fast_days') else (K('prompt_late_relief') if filing_days <= K('prompt_mid_days') else 0)
  - age_days: DAYS(LATEST('provider_payment_events', 'event_date', event_type='provider_overpayment_identified', provider_payment_event_id=dec_case), run_date) if in_scope == 1 else 0
  - age_points: K('age_high_points') if age_days > K('age_high_days') else (K('age_low_points') if age_days > K('age_low_days') else 0)
  - result: RND(MX(0, MN(dec_open, RND(run_amt * MX(0, MN(P('recoupment_max_pct_per_remittance'), P('recoupment_max_pct_per_remittance') + outcome_points - late_relief + catch_points - refund_relief - source_relief + age_points)) / 100) - run_withheld))) if in_scope == 1 else 0
