  compute:
  - cap_no: LATEST('provider_payment_events', 'remittance_number', event_type='provider_remittance_issued', remittance_component='capitation')
  - cap_amt: LATEST('provider_payment_events', 'amount', event_type='provider_remittance_issued', remittance_component='capitation')
  - case_id: LATEST('provider_payment_events', 'original_payment_event_id', event_type='provider_overpayment_recouped')
  - in_scope: 1 if cap_amt != None and case_id != None and COUNT('provider_payment_events', event_type='provider_overpayment_recouped', remittance_number=cap_no, original_payment_event_id=case_id) == 0 else 0
  - run_withheld: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', remittance_number=cap_no) if in_scope == 1 else 0
  - case_open: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=case_id) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', original_payment_event_id=case_id) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received', original_payment_event_id=case_id) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced', original_payment_event_id=case_id) if in_scope == 1 else 0
  - days_past_window: DAYS(LATEST('provider_payment_events', 'event_date', event_type='provider_overpayment_identified', provider_payment_event_id=case_id), NOW) - P('overpayment_refund_window_days') if in_scope == 1 else 0
  - aging_points: int(days_past_window / K('aging_step_days')) if days_past_window > K('aging_linear_after') else (K('aging_flat_points') if days_past_window > K('aging_flat_after') else 0)
  - panel_members: LATEST('provider_payment_events', 'amount', event_type='provider_remittance_issued', remittance_component='capitation') / P('capitation_pmpm') if in_scope == 1 and P('capitation_pmpm') > 0 else 0
  - panel_relief: K('panel_relief_full') if panel_members >= P('dhmo_panel_capacity') else (K('panel_relief_mid') if panel_members >= K('panel_mid_members') else 0)
  - exit_days: DAYS(NOW, F('termination_date')) if F('status') == 'termination_pending' else 0
  - exit_points: K('exit_near_points') if F('status') == 'termination_pending' and exit_days <= K('exit_near_days') else (K('exit_far_points') if F('status') == 'termination_pending' and exit_days > K('exit_near_days') else 0)
  - tenure_months: MONTHS(F('effective_date'), NOW)
  - tenure_relief: K('tenure_long_relief') if tenure_months >= K('tenure_long_months') else (K('tenure_mid_relief') if tenure_months >= K('tenure_mid_months') else 0)
  - notice_amount: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=case_id) if in_scope == 1 else 0
  - size_points: K('size_full_points') if in_scope == 1 and notice_amount >= 2 * cap_amt else (K('size_half_points') if in_scope == 1 and notice_amount >= cap_amt else 0)
  - small_contract: CFIELD('group', 'group_contract_id', termination_reason='not_terminated')
  - small_census: XLATEST('group', 'group_eligibility_events', 'eligible_employees_reported', date_field='reported_date', event_type='group_census_reported', group_contract_id=small_contract)
  - small_status: CFIELD('group', 'status', termination_reason='not_terminated')
  - small_relief: K('small_relief_high') if (small_census != None and (small_status == 'applied' or small_status == 'active')) and small_census < K('small_staff_limit') else (K('small_relief_mid') if (small_census != None and (small_status == 'applied' or small_status == 'active')) and small_census >= K('small_staff_limit') and small_census <= K('group_small_max') else 0)
  - result: RND(MX(0, MN(case_open, RND(cap_amt * MN(K('share_ceiling'), P('recoupment_max_pct_per_remittance') + aging_points - panel_relief + exit_points - tenure_relief + size_points - small_relief) / 100) - run_withheld))) if in_scope == 1 else 0
  compute_basis:
    cap_no: The capitation payment is the agreement's most recent capitation payment, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    cap_amt: The capitation payment is the agreement's most recent capitation payment, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    run_withheld: The capitation payment is the agreement's most recent capitation payment, and the amount already withheld from it is the total of every withholding booked against its remittance number.
    case_id: The overpayment under recovery is the overpayment that the agreement's most recent withholding was applied to, and its open amount is its notice amount less every withholding, refund and reduction booked against it.
    case_open: The overpayment under recovery is the overpayment that the agreement's most recent withholding was applied to, and its open amount is its notice amount less every withholding, refund and reduction booked against it.
