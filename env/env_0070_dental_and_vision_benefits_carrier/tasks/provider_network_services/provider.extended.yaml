  rule: 'This policy governs the first withholding Cascade books against a claim payment run to recover an overpayment after a dispute decision upheld it in full or reduced it, and only that first post-decision withholding; later withholdings of the same overpayment are continuing run withholdings. Overpayments are recovered at the level of the practice: an open overpayment under one agreement may be offset against remittances under any active or termination_pending agreement of the same practice, except that a continuing capitation withholding, a continuing run withholding, a post-decision withholding and a plan installment each select only among the overpayments of the agreement whose payment they are withheld from, and only those four do. Open overpayments of the practice are offset oldest notice first, except that a continuing capitation withholding and a continuing run withholding go to the overpayment the agreement''s most recent withholding was applied to, a post-decision withholding goes to the overpayment of the agreement''s most recent dispute decision and a plan installment goes to the overpayment the plan down payment was recorded against, and only those four withholdings follow these selections instead of notice order; the total withheld from a claim payment run may not exceed recoupment_max_pct_per_remittance percent of that run''s claim payments, while a withholding from a capitation payment is measured against the capitation amount itself, at recoupment_max_pct_per_remittance percent of it for the first withholding of an overpayment and at the continuing capitation withholding share for a continuing capitation withholding. The decided overpayment is the overpayment of the agreement''s most recent dispute decision, read for its resolved date, its resolution due date, its outcome and its stated ground, and its open amount is its notice amount less every withholding, refund and reduction booked against it. For a post-decision withholding, the claim payment run is the agreement''s most recent claim payment remittance, read for its claim payment amount and its date, and the amount already withheld from it is the total of every withholding booked against its remittance number. A post-decision withholding is fixed only after the latest claim payment run carries the continuing run withholding owed on any overpayment under recovery whose notice is older than the decided overpayment''s notice. For the post-decision withholding, days are calendar days counted from the earlier date to the later date, the earlier date not counted and the later date counted, and whole months are the difference in calendar months, less one when the later date''s day of the month is smaller than the earlier date''s day of the month. For the post-decision withholding, where two ledger entries or two dispute decisions a selection reads share the latest date, the one listed first on the agreement''s records is taken. As the standard method, the post-decision withholding ceiling is recoupment_max_pct_per_remittance percent, the room in the claim payment run is the run''s claim payment amount times that ceiling divided by one hundred, rounded half up to the cent, less the amount already withheld from the run, and the post-decision withholding is the lesser of the decided overpayment''s open amount and that room, never below zero. When the agreement is paid by capitation or has no claim payment remittance or no dispute decision on record, when its most recent decision withdrew the overpayment, when the decided overpayment already carries a withholding (any later withholding of it is a continuing run withholding), or when the claim payment run is dated on or before the decision''s resolved date (offsetting resumes only on the day after the resolution), no post-decision withholding is booked. The adjustments below are applied to the standard ceiling by simple addition or subtraction as each states, so their order does not change the result, and the adjusted post-decision withholding ceiling is never below zero and never above recoupment_max_pct_per_remittance percent; the room and the withholding are then worked out as in the standard method with the adjusted ceiling. The decision-outcome adjustment to the post-decision withholding ceiling is set by the decision and the ground the practice stated: a decision that upheld the overpayment in full on a dispute stating the claim was correctly paid adds outcome_firm_points ceiling points; a decision that upheld it in full on a dispute stating any other ground adds outcome_plain_points ceiling points; a decision that reduced it adds nothing. The decision-delay relief to the post-decision withholding ceiling is set by the days from the decision''s resolution due date to its resolved date: more than late_long_days days subtracts late_long_relief ceiling points; one to late_long_days days subtracts late_short_relief ceiling points; a decision on or before its due date subtracts nothing. The post-decision catch-up of the post-decision withholding ceiling is set by the days from the decision''s resolved date to the run''s date: more than catch_linear_after days adds catch_step_points ceiling points for every whole 7 days; more than catch_flat_after and at most catch_linear_after days adds a flat catch_flat_points ceiling points; catch_flat_after days or fewer adds nothing. The refund-cooperation relief to the post-decision withholding ceiling is set by the refunds received from the practice on the agreement''s overpayments dated fewer than 24 whole months before today: two or more subtract refund_high_relief ceiling points; exactly one subtracts refund_low_relief ceiling points; none subtracts nothing. The prompt-dispute relief to the post-decision withholding ceiling is set by the days from the decided overpayment''s notice date to the date the practice filed the decided dispute: prompt_fast_days days or fewer subtracts prompt_fast_relief ceiling points; more than prompt_fast_days and at most prompt_mid_days days subtracts prompt_late_relief ceiling points; a later filing, at most overpayment_dispute_window_days days after the notice, subtracts nothing. The decided-notice age adjustment to the post-decision withholding ceiling is set by the days from the decided overpayment''s notice date to the run''s date: more than age_high_days days adds age_high_points ceiling points; more than age_low_days and at most age_high_days days adds age_low_points ceiling points; age_low_days days or fewer adds nothing.'
