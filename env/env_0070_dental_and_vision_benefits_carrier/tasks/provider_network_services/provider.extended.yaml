- id: provider_ext_plan_down_payment
  base_policy_refs:
  - provider_evt_overpayment
  - provider_recredentialing
  - provider_evt_remittance
  overwrite: []
  trigger: on_request
  subject:
  - provider_overpayment_refund_received
  computes: down_payment_amount
  target_tool: pay_plan_down_payment_331c146f
  params:
    down_standard_pct: 20
    shape_flat_below: 1000
    shape_flat_amount: 250
    shape_bracket_from: 2000
    shape_bracket_first_pct: 25
    shape_bracket_rest_pct: 10
    recred_near_months: 6
    recred_far_months: 12
    recred_near_points: 10
    recred_far_points: 5
    cover_near_days: 90
    cover_far_days: 180
    cover_near_points: 10
    cover_far_points: 5
    volume_high: 40000
    volume_low: 20000
    volume_high_relief: 15
    volume_low_relief: 8
    recent_high_points: 10
    recent_low_points: 5
    disp_high_points: 20
    disp_low_points: 10
  rule: 'This policy governs the down payment a practice pays directly to Cascade, at its own request, to place the open overpayments of an agreement in a repayment plan, and only that plan down payment. For a plan down payment, the open receivable is the total of the agreement''s overpayment notices less every withholding, refund and reduction booked against them. The plan down payment is recorded as a refund received against the agreement''s overpayment with the most recent notice date, and it is never more than the open receivable nor more than that overpayment''s open amount. A plan down payment is not fixed until the latest claim payment run carries the post-decision withholding owed on the overpayment of the agreement''s most recent dispute decision. For the plan down payment, days are calendar days counted from the earlier date to the later date, the earlier date not counted and the later date counted, and whole months are the difference in calendar months, less one when the later date''s day of the month is smaller than the earlier date''s day of the month. For the plan down payment, where two overpayments share the most recent notice date, the one listed first on the agreement''s ledger is taken. As the standard method, the plan down payment is down_standard_pct percent of the open receivable, rounded half up to the cent. When the agreement has no open receivable, there is no plan down payment. The adjustments set out below change the standard method as each of them states; the percentage points they add or subtract form one multiplier of one hundred percent plus or minus those points, never below zero, applied once before the single rounding half up to the cent, so the order in which they are applied does not change the result. The down payment shape is set by the size of the open receivable: a receivable below shape_flat_below gives a flat shape_flat_amount, or the whole receivable when that is smaller; a receivable of shape_bracket_from or more gives shape_bracket_first_pct percent of the first shape_bracket_from plus shape_bracket_rest_pct percent of the part above it; any other receivable gives down_standard_pct percent of the receivable. The down payment dispute-history points are set by the agreement''s dispute decisions that upheld an overpayment in full and are dated fewer than 24 whole months before today: two or more add disp_high_points percentage points; exactly one adds disp_low_points percentage points; none adds nothing. The down payment credentialing points are set by the whole months from today to the agreement''s recredentialing due date: fewer than recred_near_months months adds recred_near_points percentage points; recred_near_months months or more but fewer than recred_far_months adds recred_far_points percentage points; recred_far_months months or more adds nothing. The down payment liability-cover points are set by the days from today to the expiration of the professional liability policy on file: cover_near_days days or fewer adds cover_near_points percentage points; more than cover_near_days and at most cover_far_days days adds cover_far_points percentage points; more than cover_far_days days adds nothing. The down payment volume relief is set by the agreement''s claim payments in remittances dated fewer than 3 whole months before today: volume_high or more subtracts volume_high_relief percentage points; volume_low or more but less than volume_high subtracts volume_low_relief percentage points; less than volume_low subtracts nothing. The down payment recent-notice points are set by the agreement''s overpayment notices dated fewer than 6 whole months before today: three or more add recent_high_points percentage points; exactly two add recent_low_points percentage points; fewer than two add nothing.'
  prerequisite:
  - problem: provider_ext_decision_resumption
    kind: value_input
    gate: receivable
    form: state
    policy_source: A plan down payment is not fixed until the latest claim payment run carries the post-decision withholding owed on the overpayment of the agreement's most recent dispute decision.
    condition: The agreement's most recent claim payment remittance carries a withholding entry, at the post-decision withholding amount, for the overpayment of the agreement's most recent dispute decision.
    resolved_by: book_decision_withholding_431b56e1
    effect: receivable falls by the post-decision withholding, which lowers the shaped amount and so the plan down payment.
  cross_category: []
  compute:
  - receivable: SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced')
  - in_scope: 1 if receivable > 0 else 0
  - newest_case: LATEST('provider_payment_events', 'provider_payment_event_id', event_type='provider_overpayment_identified')
  - newest_open: (SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified', provider_payment_event_id=newest_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped', original_payment_event_id=newest_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received', original_payment_event_id=newest_case) - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced', original_payment_event_id=newest_case))
  - shape_recv: MX(0, SUM('provider_payment_events', 'amount', event_type='provider_overpayment_identified') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_recouped') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_refund_received') - SUM('provider_payment_events', 'amount', event_type='provider_overpayment_reduced'))
  - shape_amount: MN(K('shape_flat_amount'), shape_recv) if shape_recv < K('shape_flat_below') else (K('shape_bracket_first_pct') / 100 * K('shape_bracket_from') + K('shape_bracket_rest_pct') / 100 * (shape_recv - K('shape_bracket_from')) if shape_recv >= K('shape_bracket_from') else K('down_standard_pct') / 100 * shape_recv)
  - disp_count: COUNT('provider_disputes', within_months=24, date_field='resolved_date', event_type='provider_dispute_resolved', outcome='upheld_overpayment')
  - disp_points: K('disp_high_points') if disp_count >= 2 else (K('disp_low_points') if disp_count == 1 else 0)
  - recred_months: MONTHS(NOW, F('recredential_due_date'))
  - recred_points: K('recred_near_points') if recred_months < K('recred_near_months') else (K('recred_far_points') if recred_months < K('recred_far_months') else 0)
  - cover_days: DAYS(NOW, F('malpractice_expiration_date'))
  - cover_points: K('cover_near_points') if cover_days <= K('cover_near_days') else (K('cover_far_points') if cover_days <= K('cover_far_days') else 0)
  - claims3: SUM('provider_payment_events', 'amount', within_months=3, event_type='provider_remittance_issued', remittance_component='claim_payment')
  - volume_relief: K('volume_high_relief') if claims3 >= K('volume_high') else (K('volume_low_relief') if claims3 >= K('volume_low') else 0)
  - recent_points: K('recent_high_points') if COUNT('provider_payment_events', within_months=6, event_type='provider_overpayment_identified') >= 3 else (K('recent_low_points') if COUNT('provider_payment_events', within_months=6, event_type='provider_overpayment_identified') == 2 else 0)
  - result: RND(MX(0, MN(receivable, newest_open, shape_amount * MX(0, 100 + disp_points + recred_points + cover_points - volume_relief + recent_points) / 100))) if in_scope == 1 else 0
  compute_basis:
    receivable: For a plan down payment, the open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them.
    in_scope: When the agreement has no open receivable, there is no plan down payment.
    shape_recv: 'The down payment shape is set by the size of the open receivable: a receivable below shape_flat_below gives a flat shape_flat_amount, or the whole receivable when that is smaller; a receivable of shape_bracket_from or more gives shape_bracket_first_pct percent of the first shape_bracket_from plus shape_bracket_rest_pct percent of the part above it; any other receivable gives down_standard_pct percent of the receivable.'
    shape_amount: 'The down payment shape is set by the size of the open receivable: a receivable below shape_flat_below gives a flat shape_flat_amount, or the whole receivable when that is smaller; a receivable of shape_bracket_from or more gives shape_bracket_first_pct percent of the first shape_bracket_from plus shape_bracket_rest_pct percent of the part above it; any other receivable gives down_standard_pct percent of the receivable.'
    recred_months: 'The down payment credentialing points are set by the whole months from today to the agreement''s recredentialing due date: fewer than recred_near_months months adds recred_near_points percentage points; recred_near_months months or more but fewer than recred_far_months adds recred_far_points percentage points; recred_far_months months or more adds nothing.'
    recred_points: 'The down payment credentialing points are set by the whole months from today to the agreement''s recredentialing due date: fewer than recred_near_months months adds recred_near_points percentage points; recred_near_months months or more but fewer than recred_far_months adds recred_far_points percentage points; recred_far_months months or more adds nothing.'
    cover_days: 'The down payment liability-cover points are set by the days from today to the expiration of the professional liability policy on file: cover_near_days days or fewer adds cover_near_points percentage points; more than cover_near_days and at most cover_far_days days adds cover_far_points percentage points; more than cover_far_days days adds nothing.'
    cover_points: 'The down payment liability-cover points are set by the days from today to the expiration of the professional liability policy on file: cover_near_days days or fewer adds cover_near_points percentage points; more than cover_near_days and at most cover_far_days days adds cover_far_points percentage points; more than cover_far_days days adds nothing.'
    claims3: 'The down payment volume relief is set by the agreement''s claim payments in remittances dated fewer than 3 whole months before today: volume_high or more subtracts volume_high_relief percentage points; volume_low or more but less than volume_high subtracts volume_low_relief percentage points; less than volume_low subtracts nothing.'
    volume_relief: 'The down payment volume relief is set by the agreement''s claim payments in remittances dated fewer than 3 whole months before today: volume_high or more subtracts volume_high_relief percentage points; volume_low or more but less than volume_high subtracts volume_low_relief percentage points; less than volume_low subtracts nothing.'
    recent_points: 'The down payment recent-notice points are set by the agreement''s overpayment notices dated fewer than 6 whole months before today: three or more add recent_high_points percentage points; exactly two add recent_low_points percentage points; fewer than two add nothing.'
    result: The plan down payment is recorded as a refund received against the agreement's overpayment with the most recent notice date, and it is never more than the open receivable nor more than that overpayment's open amount.
    disp_count: 'The down payment dispute-history points are set by the agreement''s dispute decisions that upheld an overpayment in full and are dated fewer than 24 whole months before today: two or more add disp_high_points percentage points; exactly one adds disp_low_points percentage points; none adds nothing.'
    disp_points: 'The down payment dispute-history points are set by the agreement''s dispute decisions that upheld an overpayment in full and are dated fewer than 24 whole months before today: two or more add disp_high_points percentage points; exactly one adds disp_low_points percentage points; none adds nothing.'
    newest_case: The plan down payment is recorded as a refund received against the agreement's overpayment with the most recent notice date, and it is never more than the open receivable nor more than that overpayment's open amount.
    newest_open: The plan down payment is recorded as a refund received against the agreement's overpayment with the most recent notice date, and it is never more than the open receivable nor more than that overpayment's open amount.
  factors:
  - id: dp_shape
    effect: method
    decides: shape_amount
    bindings:
    - shape_recv
    - shape_amount
    ladder:
    - when: open receivable below shape_flat_below
      method: a flat shape_flat_amount, or the whole receivable when smaller
    - when: open receivable of shape_bracket_from or more
      method: shape_bracket_first_pct percent of the first shape_bracket_from plus shape_bracket_rest_pct percent of the part above it
    - when: otherwise
      method: down_standard_pct percent of the receivable (standard)
    baseline:
      shape_amount: K('down_standard_pct') / 100 * shape_recv
    evidence:
    - history
    cross_difficulty: null
  - id: dp_dispute_history
    effect: parameter
    decides: disp_points
    bindings:
    - disp_count
    - disp_points
    ladder:
    - when: two or more decisions upholding an overpayment in full fewer than 24 whole months before today
      value: K('disp_high_points')
    - when: exactly one such decision
      value: K('disp_low_points')
    - when: otherwise
      value: '0'
    baseline:
      disp_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: dp_credentialing
    effect: parameter
    decides: recred_points
    bindings:
    - recred_months
    - recred_points
    ladder:
    - when: fewer than recred_near_months whole months to the recredentialing due date
      value: K('recred_near_points')
    - when: recred_near_months or more but fewer than recred_far_months
      value: K('recred_far_points')
    - when: otherwise
      value: '0'
    baseline:
      recred_points: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: dp_liability_cover
    effect: parameter
    decides: cover_points
    bindings:
    - cover_days
    - cover_points
    ladder:
    - when: professional liability policy expires cover_near_days days or fewer after today
      value: K('cover_near_points')
    - when: it expires more than cover_near_days and at most cover_far_days days after today
      value: K('cover_far_points')
    - when: otherwise
      value: '0'
    baseline:
      cover_points: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: dp_volume_relief
    effect: parameter
    decides: volume_relief
    bindings:
    - claims3
    - volume_relief
    ladder:
    - when: claim payments of the last 3 whole months of volume_high or more
      value: K('volume_high_relief')
    - when: volume_low or more but less than volume_high
      value: K('volume_low_relief')
    - when: otherwise
      value: '0'
    baseline:
      volume_relief: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: dp_recent_notices
    effect: parameter
    decides: recent_points
    bindings:
    - recent_points
    ladder:
    - when: three or more overpayment notices fewer than 6 whole months before today
      value: K('recent_high_points')
    - when: exactly two such notices
      value: K('recent_low_points')
    - when: otherwise
      value: '0'
    baseline:
      recent_points: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: For a plan down payment, the open receivable is the total of the agreement's overpayment notices less every withholding, refund and reduction booked against them. As the standard method, the plan down payment is down_standard_pct percent of the open receivable, rounded half up to the cent. When the agreement has no open receivable, there is no plan down payment.
    params:
    - down_standard_pct
  inputs:
    history:
    - table: provider_payment_events
      aggregate: sum
      field: amount
      filters:
        event_type: provider_overpayment_identified
    - table: provider_payment_events
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: provider_remittance_issued
        remittance_component: claim_payment
    - table: provider_disputes
      aggregate: count
      field: provider_dispute_id
      within_months: 24
      filters:
        event_type: provider_dispute_resolved
        outcome: upheld_overpayment
    cross_category: []
- id: provider_ext_plan_installment
  base_policy_refs:
  - provider_agg_practice_offset
  - provider_evt_overpayment
  - provider_evt_disputes
  - provider_evt_remittance
  overwrite:
  - base_policy: provider_agg_practice_offset
    superseded_clause: 'Overpayments are recovered at the level of the practice (the customer that holds the agreements): an open overpayment under one agreement may be offset against remittances under any active or termination_pending agreement of the same practice.'
    replaced_by: 'Overpayments are recovered at the level of the practice: an open overpayment under one agreement may be offset against remittances under any active or termination_pending agreement of the same practice, except that a continuing capitation withholding, a continuing run withholding, a post-decision withholding and a plan installment each select only among the overpayments of the agreement whose payment they are withheld from, and only those four do.'
  - base_policy: provider_agg_practice_offset
    superseded_clause: Open overpayments of the practice are offset in recoupment_order (oldest notice first), and the total withheld from one remittance may not exceed recoupment_max_pct_per_remittance of that remittance's claim payments.
    replaced_by: Open overpayments of the practice are offset oldest notice first, except that a continuing capitation withholding and a continuing run withholding go to the overpayment the agreement's most recent withholding was applied to, a post-decision withholding goes to the overpayment of the agreement's most recent dispute decision and a plan installment goes to the overpayment the plan down payment was recorded against, and only those four withholdings follow these selections instead of notice order; the total withheld from a claim payment run may not exceed recoupment_max_pct_per_remittance percent of that run's claim payments, while a withholding from a capitation payment is measured against the capitation amount itself, at recoupment_max_pct_per_remittance percent of it for the first withholding of an overpayment and at the continuing capitation withholding share for a continuing capitation withholding.
  - base_policy: provider_evt_overpayment
    superseded_clause: The practice may refund within overpayment_refund_window_days calendar days after the notice; an overpayment may be offset against a remittance only after the refund window following the overpayment notice has passed and while no dispute of it is pending.
    replaced_by: The practice may refund within overpayment_refund_window_days calendar days after the notice; an overpayment may be offset against a remittance only after the refund window following the overpayment notice has passed and while no dispute of it is pending, except that a plan installment this policy governs may be withheld from an overpayment the practice has placed in its repayment plan before that overpayment's refund window has passed, and only such a plan installment; every other withholding remains bound by the refund window.
  - base_policy: provider_evt_overpayment
    superseded_clause: The offset may start on the day after the notice date plus overpayment_refund_window_days calendar days.
    replaced_by: The offset may start on the day after the notice date plus overpayment_refund_window_days calendar days, except that a plan installment this policy governs may be withheld from an overpayment of the plan whose refund window has not yet passed, and only such a plan installment; every other offset starts no earlier than that day.
  trigger: on_request
  subject:
  - provider_overpayment_recouped
  computes: installment_amount
  target_tool: book_plan_installment_e88126b0
  params:
    plan_runs_standard: 12
    plan_runs_mid: 18
    plan_runs_long: 26
    plan_len_low_from: 1000
    plan_len_high_from: 5000
    plan_recent_decision_days: 30
    tenure_long_months: 96
    tenure_mid_months: 48
    tenure_long_runs: 6
    tenure_mid_runs: 3
    freq_high_count: 5
    freq_low_count: 3
    freq_high_runs: 4
    freq_low_runs: 2
    volume_high: 40000
    volume_low: 20000
    volume_high_runs: 4
    volume_low_runs: 2
    small_staff_limit: 5
    group_small_max: 19
    small_runs_high: 6
    small_runs_mid: 3
  rule: 'This policy governs the first installment of a repayment plan that Cascade withholds from a claim payment run of an agreement paid by claim payments rather than by capitation, and only that first plan installment. Overpayments are recovered at the level of the practice: an open overpayment under one agreement may be offset against remittances under any active or termination_pending agreement of the same practice, except that a continuing capitation withholding, a continuing run withholding, a post-decision withholding and a plan installment each select only among the overpayments of the agreement whose payment they are withheld from, and only those four do. Open overpayments of the practice are offset oldest notice first, except that a continuing capitation withholding and a continuing run withholding go to the overpayment the agreement''s most recent withholding was applied to, a post-decision withholding goes to the overpayment of the agreement''s most recent dispute decision and a plan installment goes to the overpayment the plan down payment was recorded against, and only those four withholdings follow these selections instead of notice order; the total withheld from a claim payment run may not exceed recoupment_max_pct_per_remittance percent of that run''s claim payments, while a withholding from a capitation payment is measured against the capitation amount itself, at recoupment_max_pct_per_remittance percent of it for the first withholding of an overpayment and at the continuing capitation withholding share for a continuing capitation withholding. The practice may refund within overpayment_refund_window_days calendar days after the notice; an overpayment may be offset against a remittance only after the refund window following the overpayment notice has passed and while no dispute of it is pending, except that a plan installment this policy governs may be withheld from an overpayment the practice has placed in its repayment plan before that overpayment''s refund window has passed, and only such a plan installment; every other withholding remains bound by the refund window. The offset may start on the day after the notice date plus overpayment_refund_window_days calendar days, except that a plan installment this policy governs may be withheld from an overpayment of the plan whose refund window has not yet passed, and only such a plan installment; every other offset starts no earlier than that day. For a plan installment, the open receivable is the total of the agreement''s overpayment notices less every withholding, refund and reduction booked against them, the plan down payment included. For a plan installment, the claim payment run is the agreement''s most recent claim payment remittance, and the amount already withheld from it is the total of every withholding booked against its remittance number. The plan installment is booked against the overpayment the plan down payment was recorded against, the overpayment of the agreement''s most recent refund received. The first plan installment is withheld only after the practice''s down payment is recorded on the ledger against its open overpayments. For the plan installment, days are calendar days counted from the earlier date to the later date, the earlier date not counted and the later date counted, and whole months are the difference in calendar months, less one when the later date''s day of the month is smaller than the earlier date''s day of the month. For the plan installment, where two ledger entries or two dispute records a selection reads share the latest date, the one listed first on the agreement''s records is taken. As the standard method, the plan balance is the open receivable, the plan runs over plan_runs_standard payment runs, the plan installment is the plan balance divided by the number of plan runs, rounded half up to the cent, and the first plan installment withheld is the lesser of that installment and the room left in the claim payment run, the room being the run''s claim payment amount times recoupment_max_pct_per_remittance divided by one hundred, rounded half up to the cent, less the amount already withheld from it, never below zero. When the agreement is paid by capitation, has no claim payment remittance on record or has no open receivable, no plan installment is withheld. The first plan installment is taken after every other withholding the run carries and is the last entry booked against it. A remittance carries at most one withholding entry per overpayment, so when the run already carries any withholding entry for the overpayment the plan down payment was recorded against, nothing more is withheld from it under this policy. The adjustments set out below change the standard method as each of them states; the run count they produce is never below one, and the order in which they are applied does not change the result. The plan balance measure is set by the agreement''s recovery records: when its most recent dispute decision is dated plan_recent_decision_days days or fewer before today and that decision''s overpayment is still open, the plan balance is the open receivable less that overpayment''s open amount, which stays on its own post-decision recovery; when there is no such decision and the overpayment the agreement''s most recent withholding was applied to is still open, the plan balance is the open receivable less the lesser of that overpayment''s open amount and the run''s standard room, recoupment_max_pct_per_remittance percent of the run''s claim payment amount rounded half up to the cent, which its next scheduled withholding is expected to take; otherwise the plan balance is the whole open receivable. The base plan run count is set by the size of the open receivable: plan_len_high_from or more gives plan_runs_long runs; plan_len_low_from or more but less than plan_len_high_from gives plan_runs_mid runs; a smaller receivable gives plan_runs_standard runs. The plan tenure addition to the plan run count is set by the whole months from the agreement''s effective date to today: tenure_long_months months or more adds tenure_long_runs runs; tenure_mid_months months or more but fewer than tenure_long_months adds tenure_mid_runs runs; fewer than tenure_mid_months months adds nothing. The plan small-practice addition to the plan run count is set by the practice''s documented employee headcount: the only headcount documentation Cascade holds for a practice is the census report on the practice''s own Cascade staff group contract, so the headcount is the eligible employees on the most recent census report of that contract while it has not ended (status applied or active). A documented headcount of fewer than small_staff_limit employees adds small_runs_high runs; a documented headcount of small_staff_limit up to group_small_max employees adds small_runs_mid runs; a practice with no such census on file, whose contract has ended, or with a larger documented headcount is on the standard terms and adds nothing. The plan notice-frequency reduction of the plan run count is set by the agreement''s overpayment notices dated fewer than 12 whole months before today: freq_high_count or more remove freq_high_runs runs; freq_low_count or more but fewer than freq_high_count remove freq_low_runs runs; fewer than freq_low_count remove nothing. The plan volume reduction of the plan run count is set by the agreement''s claim payments in remittances dated fewer than 3 whole months before today: volume_high or more removes volume_high_runs runs; volume_low or more but less than volume_high removes volume_low_runs runs; less than volume_low removes nothing.'
  prerequisite:
  - problem: provider_ext_plan_down_payment
    kind: value_input
    gate: receivable
    form: state
    policy_source: The first plan installment is withheld only after the practice's down payment is recorded on the ledger against its open overpayments.
    condition: A refund-received entry for the plan down payment is booked on the agreement against its open overpayment with the most recent notice date.
    resolved_by: pay_plan_down_payment_331c146f
    effect: receivable and the plan balance fall by the down payment, which lowers the plan installment.
  cross_category:
