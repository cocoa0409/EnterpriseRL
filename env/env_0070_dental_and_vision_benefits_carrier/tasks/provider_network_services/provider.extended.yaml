    share_base: 'The base exit recovery share is set by the agreement''s dispute decisions dated fewer than 24 whole months before today, because an overpayment cannot be withheld while its dispute is pending and a practice that disputes delays recovery: two or more decisions give share_low percent; exactly one decision gives share_mid percent; none gives recoupment_max_pct_per_remittance percent.'
    haircut: 'The exit competing-recovery haircut is set by the agreement''s overpayment notices dated fewer than 6 whole months before today: three or more lower the expected recovery by haircut_high percent; exactly two lower it by haircut_low percent; fewer than two lower it by nothing.'
