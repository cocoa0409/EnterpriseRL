  factors:
  - id: eligibility_binder
    effect: method
    decides: g_mode
    bindings:
    - g_bid
    - g_bdate
    - g_bamt
    - g_bret
    - g_mode
    ladder:
    - when: the claim reached Cascade more than the filing limit in calendar days after the date of service
      method: 'denied DENIED_TIMELY_FILING: nothing reimbursed'
    - when: >-
        otherwise, the enrollment stands applied, the funding account's latest binder payment, not returned, is
        for at least the plan unit premium and reached it on or before the binder deadline, and the service is dated
        on or after the coverage_effective_date
      method: reimbursed, coverage starting retroactively
    - when: otherwise (the enrollment's own status and dates decide)
      method: >-
        reimbursed only when the enrollment was active on the date of service, else denied DENIED_NOT_ELIGIBLE with
        nothing reimbursed
    baseline:
      g_mode: '''record'''
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  - id: oon_lens_schedule
    effect: parameter
    decides: g_lamt
    bindings:
    - g_lamt
    ladder:
    - when: standard or premium progressive lenses
      value: P('oon_progressive_reimbursement')
    - when: lined trifocal lenses
      value: P('oon_trifocal_reimbursement')
    - when: lined bifocal lenses
      value: P('oon_bifocal_reimbursement')
    - when: otherwise (single-vision lenses)
      value: P('oon_single_vision_reimbursement')
    baseline:
      g_lamt: P('oon_single_vision_reimbursement')
    evidence:
    - history
    cross_difficulty: null
  - id: children_oon_frame
    effect: parameter
    decides: g_famt
    bindings:
    - g_famt
    ladder:
    - when: a plan without a frame benefit
      value: '0.00'
    - when: a patient under child_age_limit_years on the date of service
      value: K('oon_child_frame_reimbursement')
    - when: otherwise
      value: P('oon_frame_reimbursement')
    baseline:
      g_famt: P('oon_frame_reimbursement')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: oon_fitting_schedule
    effect: parameter
    decides: g_fit
    bindings:
    - g_fit
    ladder:
    - when: the claim carries a specialty contact-lens fitting line
      value: K('oon_fit_specialty_reimbursement')
    - when: the claim carries a standard contact-lens fitting line
      value: K('oon_fit_standard_reimbursement')
    - when: the claim carries no fitting line
      value: '0.00'
    baseline:
      g_fit: P('oon_exam_reimbursement')
    evidence:
    - history
    cross_difficulty: null
  - id: oon_glasses_in_lieu
    effect: method
    decides: g_lieu
    bindings:
    - g_lieu
    ladder:
    - when: a spectacle-lens or frame service of the same person counts in the benefit period of the claim
      method: the claim's contact-lens and fitting lines are not reimbursed (DENIED_CONTACTS_IN_LIEU)
    - when: otherwise, a contact-lens service of the same person counts in the benefit period of the claim
      method: the claim's spectacle-lens and frame lines are not reimbursed (DENIED_CONTACTS_IN_LIEU)
    - when: otherwise, the claim carries contact lenses and spectacle lenses or a frame
      method: >-
        only the larger of the contact-lens part (contact lenses with the fitting) and the glasses part is reimbursed,
        the glasses part on a tie; the other part is denied DENIED_CONTACTS_IN_LIEU
    - when: otherwise
      method: every line is reimbursed under its own amount
    baseline:
      g_lieu: '''none'''
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      A member's new out-of-network claim is one claim number of the enrollment whose lines are at providers without
      a Cascade agreement and carry no remark yet, the latest received such claim first; which rule settles it is
      fixed by its receipts alone, whatever either rule's amounts: when the retail charges of its spectacle-lens
      and frame lines together are at least the retail charges of its contact-lens and contact-lens fitting lines
      together, it is settled on its glasses part under the glasses claim rule, and otherwise it is settled on its
      contact-lens part under the contact-lens claim rule. The claim's date of service and received date are those
      of its lines, each line's receipt is its retail charge, and the patient's age is counted in whole years from
      the enrollee's date of birth to the date of service. An out-of-network claim settled on its glasses part is
      reimbursed only when the enrollment is active or terminated and the date of service is on or after its coverage_effective_date
      and on or before its termination_date when it has one; otherwise its lines are denied DENIED_NOT_ELIGIBLE
      and nothing is reimbursed. On an out-of-network claim settled on its glasses part, a lens line of a plan whose
      lens_benefit_included is false and a contact-lens or fitting line of a plan whose contacts_benefit_included
      is false, or whose contacts_medically_necessary_in_network is not_covered, are denied DENIED_NOT_COVERED and
      nothing is reimbursed for them. Each line of an out-of-network claim settled on its glasses part other than
      the fitting is reimbursed only when the benefit of its kind is available again (exam_frequency_months for
      a routine exam, lens_frequency_months or child_lens_frequency_months for a patient under child_age_limit_years
      for the lenses, frame_frequency_months for the frame, contacts_frequency_months for the contact lenses): the
      benefit of a kind is available again unless the latest service of that kind of the enrollment that stands
      PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency of twelve months
      is blocked by a latest service in the same benefit period and a frequency of twenty-four months by one in
      the same or the preceding benefit period (a latest service in a later benefit period blocks nothing), while
      under frequency_basis months_from_last_service it is blocked when fewer than the stated number of whole calendar
      months (a month being complete on the same day number) separate the two dates in either direction; when that
      latest service is the only paid or reimbursed service of its kind on its date and has been reversed, nothing
      blocks the benefit, while of several on that date a reversal of one leaves the benefit blocked; a line whose
      benefit is blocked is denied DENIED_FREQUENCY and nothing is reimbursed for it; the fitting is not limited
      separately. Each reimbursed line of an out-of-network claim settled on its glasses part receives the lesser
      of its receipt and its out-of-network amount: oon_exam_reimbursement for a routine exam and for a fitting,
      oon_single_vision_reimbursement for the lenses, oon_frame_reimbursement for the frame, oon_contacts_medically_necessary_reimbursement
      for contact lenses the provider certified as medically necessary and oon_contacts_elective_reimbursement for
      elective ones; copays are never deducted, lens options are never reimbursed (oon_lens_options_reimbursed),
      and the claim's reimbursement is the sum of its reimbursed lines. A claim settled on its contact-lens part
      is not settled under this rule, which records nothing for it (0.00 under this rule). A fitting line follows
      its claim's contact-lens line: when the contact-lens line receives no reimbursement (its benefit blocked by
      frequency or missing, its amount 0.00, or the line left out in lieu), the fitting line receives none either
      and carries the contact-lens line's remark; a fitting on a claim without contact lenses is reimbursed on its
      own. The reimbursement of an out-of-network claim settled on its glasses part is worked out in this order:
      first each line's amount is taken as the lesser of its receipt and its out-of-network amount, a line denied
      for frequency or lack of a benefit counting nothing; then contacts-in-lieu keeps or leaves out the contact-lens
      part and the glasses part; finally the routine exam line and the kept parts are added. The reimbursement is
      booked on the claim's first reimbursed line and rounded half up to the cent once, at the end.
    params:
    - oon_exam_reimbursement
    - oon_single_vision_reimbursement
    - oon_frame_reimbursement
    - oon_contacts_elective_reimbursement
    - timely_filing_days_oon
