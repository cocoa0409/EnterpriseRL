    c_camt: >-
      On an out-of-network claim settled on its contact-lens part the contact-lens line is settled as follows, a
      service of the other kind counting as the in-lieu sentence states: when a spectacle-lens or frame service
      of the same person counts in the claim's benefit period, the contact-lens line and its fitting line are not
      reimbursed and are denied DENIED_CONTACTS_IN_LIEU; otherwise the contact-lens line receives oon_contacts_medically_necessary_reimbursement
