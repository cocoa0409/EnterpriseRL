events:
  - type: vision_enroll
    target: vision_plans
    mutation: create
    meaning: An application or group election for one person is accepted and a vision enrollment is opened in applied status.
    grain: One row per enrolled person per continuous enrollment.
    fields:
      customer_id: Subscriber.
      billing_account_id: Funding billing account.
      group_contract_id: Sponsoring group contract; empty for individual.
      variant_name: Plan elected.
      market_segment: Market.
      coverage_tier: Coverage tier elected.
      enrollee_name: Covered person.
      enrollee_date_of_birth: Date of birth.
      enrollee_relationship: Relationship to the subscriber.
      application_date: Receipt date.
      coverage_effective_date: First day of coverage.
      benefit_period_start_mmdd: Benefit-period reset day.
    triggers: []
  - type: vision_activate
    target: vision_plans
    mutation: {transition: {from: applied, to: active}}
    meaning: Coverage starts on the effective date after the binder premium was received.
    grain: One row per transaction.
    fields:
      coverage_effective_date: Date coverage starts.
    triggers: []
  - type: vision_application_withdraw
    target: vision_plans
    mutation: {transition: {from: applied, to: cancelled}}
    meaning: The applicant withdraws before coverage starts.
    grain: One row per transaction.
    fields:
      termination_date: coverage_effective_date minus one day.
      termination_reason: application_withdrawn.
    triggers: []
  - type: vision_binder_lapse
    target: vision_plans
    mutation: {transition: {from: applied, to: cancelled}}
    meaning: The binder premium was not received by the binder deadline.
    grain: One row per transaction.
    fields:
      termination_date: coverage_effective_date minus one day.
      termination_reason: binder_not_paid.
    triggers: []
  - type: vision_free_look_cancel
    target: vision_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: An individual subscriber returns the plan within the free-look period.
    grain: One row per transaction.
    fields:
      termination_date: coverage_effective_date minus one day.
      termination_reason: free_look.
    triggers:
      - event: billing:billing_premium_credit
        map: {credit_reason: free_look_refund}
  - type: vision_terminate_voluntary
    target: vision_plans
    mutation: {transition: {from: active, to: terminated}}
    meaning: Coverage ends at the subscriber's confirmed request.
    grain: One row per transaction.
    fields:
      termination_date: Last day of the month of confirmation.
      termination_reason: voluntary.
    triggers: []
  - type: vision_terminate_nonpayment
    target: vision_plans
    mutation: {transition: {from: active, to: terminated}}
    meaning: Coverage ends because the funding billing account lapsed.
    grain: One row per transaction.
    fields:
      termination_date: The billing account's paid-through date.
      termination_reason: nonpayment.
    triggers: []
  - type: vision_terminate_ineligible
    target: vision_plans
    mutation: {transition: {from: active, to: terminated}}
    meaning: Coverage ends for loss of eligibility or end of the group contract.
    grain: One row per transaction.
    fields:
      termination_date: End of the month eligibility ended, or the group termination date.
      termination_reason: loss_of_eligibility or group_terminated.
    triggers: []
  - type: vision_reinstate
    target: vision_plans
    mutation: {transition: {from: terminated, to: active}}
    meaning: Coverage ended for nonpayment is restored without a gap.
    grain: One row per transaction.
    fields:
      termination_date: Cleared.
      termination_reason: not_terminated.
    triggers: []
  - type: vision_tier_change
    target: vision_plans
    mutation: update
    meaning: The enrollment moves to another vision plan at the allowed change date.
    grain: One row per transaction.
    fields:
      variant_name: New plan.
      tier_change_effective_date: Date the new plan takes effect.
    triggers: []
  - type: vision_exam_claim
    target: vision_claims
    meaning: An eye exam or contact-lens fitting is adjudicated.
    grain: One row per exam service per claim.
    distinguish_by: [claim_number, exam_type]
    fields:
      claim_number: Claim number.
      provider_agreement_id: Provider agreement, if any.
      network_channel: Network channel on the date of service.
      date_of_service: Exam date.
      received_date: Receipt date.
      adjudicated_date: Decision date.
      exam_type: routine_eye_exam or a fitting.
      retail_charge: Provider charge.
      allowance_applied: Fitting allowance, if any.
      copay_applied: Exam copay or fitting cost.
      plan_paid: Plan payment.
      member_paid: Member share.
      remark_code: Outcome.
    triggers: []
  - type: vision_lens_claim
    target: vision_claims
    meaning: A pair of spectacle lenses (with options) is adjudicated.
    grain: One row per lens order per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      provider_agreement_id: Provider agreement, if any.
      network_channel: Network channel.
      date_of_service: Order date.
      received_date: Receipt date.
      adjudicated_date: Decision date.
      lens_type: Lens type.
      lens_options: Options ordered.
      retail_charge: Provider charge.
      copay_applied: Materials copay (when not taken on the frame) plus lens type and option copays.
      plan_paid: Plan payment.
      member_paid: Member share.
      remark_code: Outcome.
    triggers: []
  - type: vision_frame_claim
    target: vision_claims
    meaning: A frame is adjudicated against the frame allowance.
    grain: One row per frame order per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      provider_agreement_id: Provider agreement, if any.
      network_channel: Network channel.
      date_of_service: Order date.
      received_date: Receipt date.
      adjudicated_date: Decision date.
      retail_charge: Frame retail price.
      allowance_applied: Frame allowance.
      copay_applied: Materials copay when lenses are not ordered on the same claim.
      overage_discount_applied: Discount on the amount above the allowance.
      plan_paid: Plan payment.
      member_paid: Member share.
      remark_code: Outcome.
    triggers: []
  - type: vision_contacts_claim
    target: vision_claims
    meaning: Contact lenses are adjudicated (elective against the allowance, or medically necessary).
    grain: One row per contact-lens order per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      provider_agreement_id: Provider agreement, if any.
      network_channel: Network channel.
      date_of_service: Order date.
      received_date: Receipt date.
      adjudicated_date: Decision date.
      contact_lens_reason: elective or medically_necessary.
      retail_charge: Provider charge.
      allowance_applied: Contacts allowance.
      copay_applied: Materials copay where applicable.
      plan_paid: Plan payment.
      member_paid: Member share.
      remark_code: Outcome.
    triggers: []
  - type: vision_claim_reversal
    target: vision_claims
    meaning: A paid service is reversed (duplicate, paid after coverage ended, or provider billing error) and its frequency is restored.
    grain: One row per reversed service.
    distinguish_by: [original_vision_claim_id]
    fields:
      claim_number: Claim number of the reversed service.
      provider_agreement_id: Provider of the reversed service.
      network_channel: Channel of the reversed service.
      date_of_service: Date of service of the reversed service.
      adjudicated_date: Reversal date.
      plan_paid: Amount reversed (the original plan_paid).
      remark_code: REVERSED.
      original_vision_claim_id: Service reversed.
    triggers: []

measures:
  - id: vision_msr_last_paid_service
    window: All paid services of the same person under any Cascade vision enrollment, looking back from the date of service.
    measure: Latest date_of_service among vision claims of the given service kind (exam, lenses, frame, elective contacts) with remark PAID or PAID_OON_REIMBURSEMENT that have not been reversed; an elective contact-lens service counts as both the lens and the frame service when contacts are in lieu of glasses.

policies:
  - id: vision_agg_multi_holding
    subject: [vision_enroll]
    rule: >-
      A subscriber may hold one vision enrollment for each person covered under the subscriber's coverage tier, so there is no fixed cap per subscriber; a person may not have a second applied or active Cascade vision enrollment while one is applied or active.
      The persons enrolled must fit the coverage tier in the same way as for dental PPO coverage tiers (member_only, member_spouse, member_children, family).
    eligibility:
      - id: one_open_vision_per_person
        applies_to: [vision_enroll]
        kind: dedup
        condition: A subscriber may hold one vision enrollment for each person covered under the subscriber's coverage tier, so there is no fixed cap per subscriber; a person may not have a second applied or active Cascade vision enrollment while one is applied or active.
        evidence_fields: [vision_plans.enrollee_name, vision_plans.enrollee_date_of_birth, vision_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_plans.enrollee_name, vision_plans.enrollee_date_of_birth]
          action_bindings:
            vision_plans.enrollee_name: enrollee_name
            vision_plans.enrollee_date_of_birth: enrollee_date_of_birth
        dedup_contract:
          table: vision_plans
          mode: separate_record
          object_bindings: {enrollee_name: enrollee_name, enrollee_date_of_birth: enrollee_date_of_birth}
          duplicate_filters: {status: [applied, active]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: vision_agg_shared_plan
    subject: [vision_enroll, vision_tier_change]
    rule: >-
      All vision enrollments of one subscriber funded by the same billing account form one plan unit: they carry the same plan and coverage tier, are opened with the same coverage effective date (a dependent added later by special enrollment starts on the first of the month after the request), and change plan together on the same tier_change_effective_date.
      The monthly premium is charged once per plan unit at the rate for its coverage tier, not per person, and a change of the persons enrolled that changes the coverage tier changes the premium from the first of the following month.
      Benefit frequencies, by contrast, are counted per person and never shared within the unit.
    eligibility: []
    params:
      per_tier:
        Cascade Vision Exam Plus: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade Vision Essential 100: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade Vision Select 130: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade Vision Select 150: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade Vision Choice 175: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}
        Cascade Vision Premier 200: {premium_member_only: "=monthly_premium_member_only", premium_family: "=monthly_premium_family"}

  - id: vision_enrollment_eligibility
    subject: [vision_enroll]
    rule: >-
      An enrollment may be opened only for a plan whose entry gate admits the market (the Premier 200 plan is sold to employer groups only), and for a group enrollment only when the sponsoring group contract is active.
      A child may be enrolled only before the dependent_child_age_limit birthday.
      Individual applications take effect on the first day of the month following receipt; group enrollments take effect on the group's open-enrollment or new-hire effective date, or the first of the month after a special enrollment request.
      A person whose individual vision enrollment ended by voluntary termination may not be enrolled in an individual vision plan until the re-enrollment lockout has run from the voluntary termination of the person's previous individual vision enrollment.
      The lockout is counted in calendar months from that termination_date, with the last day of the month used when the target day does not exist, and an application on or after the resulting date is allowed.
      Vision plans have no waiting periods.
    eligibility:
      - id: vision_reenrollment_lockout
        applies_to: [vision_enroll]
        kind: time
        condition: A person whose individual vision enrollment ended by voluntary termination may not be enrolled in an individual vision plan until the re-enrollment lockout has run from the voluntary termination of the person's previous individual vision enrollment.
        evidence_fields: [vision_plans.termination_date, vision_plans.termination_reason, vision_plans.enrollee_name, vision_plans.enrollee_date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_plans.enrollee_name, vision_plans.enrollee_date_of_birth]
          action_bindings:
            vision_plans.enrollee_name: enrollee_name
            vision_plans.enrollee_date_of_birth: enrollee_date_of_birth
        temporal_basis:
          clock: frozen_time
          anchor_event: the voluntary termination of the person's previous individual vision enrollment
          anchor_source: vision_plans.termination_date
          relation: not_before
          duration_source: variants.reenrollment_lockout_months
          unit: calendar_months
          counting_rule: The lockout is counted in calendar months from that termination_date, with the last day of the month used when the target day does not exist, and an application on or after the resulting date is allowed.
          boundary: inclusive

  - id: vision_activation_binder
    subject: [vision_activate, vision_binder_lapse]
    rule: >-
      An applied enrollment becomes active on its coverage effective date once the binder premium has been received, retroactively when the binder arrives after the effective date but within the binder deadline.
      An applied vision enrollment may be cancelled for an unpaid binder only after the binder deadline has passed following the coverage effective date of the vision enrollment.
      The binder deadline is the coverage_effective_date plus binder_deadline_days in calendar days, and cancellation is allowed only strictly after that date.
    eligibility:
      - id: vision_binder_deadline
        applies_to: [vision_binder_lapse]
        kind: time
        condition: An applied vision enrollment may be cancelled for an unpaid binder only after the binder deadline has passed following the coverage effective date of the vision enrollment.
        evidence_fields: [vision_plans.coverage_effective_date, vision_plans.vision_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_plans.vision_plan_id]
          action_bindings:
            vision_plans.vision_plan_id: vision_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the coverage effective date of the vision enrollment
          anchor_source: vision_plans.coverage_effective_date
          relation: not_before
          duration_source: variants.binder_deadline_days
          unit: calendar_days
          counting_rule: The binder deadline is the coverage_effective_date plus binder_deadline_days in calendar days, and cancellation is allowed only strictly after that date.
          boundary: exclusive

  - id: vision_evt_frequency
    subject: [vision_exam_claim, vision_lens_claim, vision_frame_claim, vision_contacts_claim]
    rule: >-
      Each benefit (exam, lenses, frame, contacts) is available once per its frequency: exam_frequency_months, lens_frequency_months (child_lens_frequency_months for a patient under child_age_limit_years on the date of service), frame_frequency_months and contacts_frequency_months.
      Under frequency_basis months_from_last_service the benefit is available again on the date that is the stated number of calendar months after the last paid date of service of the same kind (vision_msr_last_paid_service), the last day of the month being used when that day does not exist; under benefit_year a 12-month frequency allows one service per benefit period and a 24-month frequency one service per two consecutive benefit periods starting with the period of the last paid service.
      When contacts_in_lieu_of_glasses is true an elective contact-lens benefit uses both the lens and the frame benefit for their frequency periods, and lenses or a frame ordered while that benefit is used are denied DENIED_CONTACTS_IN_LIEU; medically necessary contacts are counted the same way.
      A service requested before its benefit is available again is denied DENIED_FREQUENCY and may be bought at materials_discount_pct off retail; a reversed service does not count.
      Services of a person under an earlier Cascade vision enrollment count; services paid by another carrier do not.
      A contact-lens fitting is part of the contacts benefit and is not limited separately.
    eligibility: []
    measures: [vision_msr_last_paid_service]

  - id: vision_evt_in_network_benefits
    subject: [vision_exam_claim, vision_lens_claim, vision_frame_claim, vision_contacts_claim]
    rule: >-
      In network the routine exam costs the member exam_copay and the plan pays the rest of the provider's contracted exam fee; a standard contact-lens fitting costs the member at most contact_fitting_standard_copay_max, and a specialty fitting receives contact_fitting_specialty_allowance with the member paying the rest.
      One materials_copay applies per materials purchase: when lenses and a frame are ordered on the same claim it is taken once on the lens service, when only a frame is ordered it is taken on the frame, and it is taken on elective contact lenses only when the plan's contacts allowance is used.
      Spectacle lenses are covered after the materials copay plus the copay for their lens_type and each ordered lens option; polycarbonate is covered in full for a patient under child_age_limit_years when child_polycarbonate_covered is true.
      The frame benefit pays up to frame_allowance_private_practice at a participating independent practice or frame_allowance_retail_chain at a participating retail-chain location; at an independent practice the member also receives frame_overage_discount_pct off the amount above the allowance, which is not given at retail-chain locations.
      Elective contact lenses receive contacts_allowance_elective; the member pays any amount above it with no discount.
      A plan without a lens, frame or contacts benefit (lens_benefit_included, frame_benefit_included or contacts_benefit_included false) denies that service DENIED_NOT_COVERED and the member may buy it at materials_discount_pct off retail.
      Amounts are rounded half up to the cent.
    eligibility: []
    params:
      per_tier:
        Cascade Vision Exam Plus: {frame_private: "=frame_allowance_private_practice", frame_retail: "=frame_allowance_retail_chain", contacts: "=contacts_allowance_elective", materials_copay: "=materials_copay"}
        Cascade Vision Essential 100: {frame_private: "=frame_allowance_private_practice", frame_retail: "=frame_allowance_retail_chain", contacts: "=contacts_allowance_elective", materials_copay: "=materials_copay"}
        Cascade Vision Select 130: {frame_private: "=frame_allowance_private_practice", frame_retail: "=frame_allowance_retail_chain", contacts: "=contacts_allowance_elective", materials_copay: "=materials_copay"}
        Cascade Vision Select 150: {frame_private: "=frame_allowance_private_practice", frame_retail: "=frame_allowance_retail_chain", contacts: "=contacts_allowance_elective", materials_copay: "=materials_copay"}
        Cascade Vision Choice 175: {frame_private: "=frame_allowance_private_practice", frame_retail: "=frame_allowance_retail_chain", contacts: "=contacts_allowance_elective", materials_copay: "=materials_copay"}
        Cascade Vision Premier 200: {frame_private: "=frame_allowance_private_practice", frame_retail: "=frame_allowance_retail_chain", contacts: "=contacts_allowance_elective", materials_copay: "=materials_copay"}
    formula:
      frame_allowance: frame_allowance_private_practice if network_channel == "in_network_private_practice" else frame_allowance_retail_chain
      overage_discount_applied: round(max(0, retail_charge - frame_allowance) * frame_overage_discount_pct / 100, 2) if network_channel == "in_network_private_practice" else 0
      frame_member_paid: max(0, retail_charge - frame_allowance) - overage_discount_applied + copay_applied

  - id: vision_evt_oon_reimbursement
    subject: [vision_exam_claim, vision_lens_claim, vision_frame_claim, vision_contacts_claim]
    rule: >-
      A service from a provider without a Cascade Vision Network Provider Agreement in force on the date of service is paid to the member as a reimbursement of the lesser of the member's paid receipt (retail_charge) and the plan's out-of-network amount for the service: oon_exam_reimbursement, oon_frame_reimbursement, the lens amount for the lens_type (progressive lenses of either kind use oon_progressive_reimbursement), oon_contacts_elective_reimbursement or oon_contacts_medically_necessary_reimbursement.
      Copays are not deducted from out-of-network reimbursements, lens options are not reimbursed when oon_lens_options_reimbursed is false, and frequency limits and contacts-in-lieu apply exactly as in network; the remark is PAID_OON_REIMBURSEMENT.
    eligibility: []
    formula:
      exam_reimbursement: min(retail_charge, oon_exam_reimbursement)
      frame_reimbursement: min(retail_charge, oon_frame_reimbursement)
      elective_contacts_reimbursement: min(retail_charge, oon_contacts_elective_reimbursement)

  - id: vision_evt_medically_necessary_contacts
    subject: [vision_contacts_claim]
    rule: >-
      Contact lenses are medically necessary only when the provider certifies one of the medically_necessary_conditions; they are then covered in full in network after the materials copay when contacts_medically_necessary_in_network is covered_in_full, and reimbursed up to oon_contacts_medically_necessary_reimbursement out of network.
      Without such a certification the contacts are elective; the member's own statement of a condition does not make them medically necessary.
      A plan with contacts_medically_necessary_in_network not_covered treats all contacts as not covered.
    eligibility:
      - id: certified_condition
        applies_to: [vision_contacts_claim]
        kind: authorization
        condition: Without such a certification the contacts are elective; the member's own statement of a condition does not make them medically necessary.
        evidence_fields: [vision_claims.contact_lens_reason, vision_claims.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_claims.claim_number]
          action_bindings:
            vision_claims.claim_number: claim_number

  - id: vision_evt_eligibility_timely_filing
    subject: [vision_exam_claim, vision_lens_claim, vision_frame_claim, vision_contacts_claim]
    rule: >-
      A service is payable only if the enrollment was active on its date_of_service (on or after coverage_effective_date and on or before any termination_date); otherwise it is denied DENIED_NOT_ELIGIBLE.
      Services with a date of service while the funding billing account is in grace_period are adjudicated normally; if the account then lapses with a paid-through date before the date of service, the paid service is reversed.
      A claim must be received within timely_filing_days_in_network (participating provider) or timely_filing_days_oon (member-submitted) calendar days after the date of service; a later claim is denied DENIED_TIMELY_FILING, and for a participating provider the member owes nothing for it.
      The network channel is fixed by the provider's agreement in force on the date of service (its effective_date on or before that date and its termination_date, if any, on or after it): a Cascade Vision Network Provider Agreement in force gives in_network_private_practice, or in_network_retail_chain when the agreement's location_type is retail_chain; anything else is out_of_network.
    eligibility: []

  - id: vision_evt_claim_reversal
    subject: [vision_claim_reversal]
    rule: >-
      A paid vision service is reversed when it duplicates a service already paid for the same person, kind and date of service, when it was paid for a date of service on which coverage was not in force (including after a lapse back-dated to the paid-through date), or when the provider reports a billing error.
      A reversal references the service it reverses, carries the original plan_paid, is recovered from the payee, and restores the frequency the service had used; each service can be reversed once.
      A reversal is not used to change the member's choice of eyewear after it was ordered; remakes for the same prescription are the provider's warranty matter and are not a new claim.
    eligibility:
      - id: one_reversal_per_service
        applies_to: [vision_claim_reversal]
        kind: dedup
        condition: A reversal references the service it reverses, carries the original plan_paid, is recovered from the payee, and restores the frequency the service had used; each service can be reversed once.
        evidence_fields: [vision_claims.original_vision_claim_id, vision_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_claims.original_vision_claim_id]
          action_bindings:
            vision_claims.original_vision_claim_id: original_vision_claim_id
        dedup_contract:
          table: vision_claims
          mode: separate_record
          object_bindings: {original_vision_claim_id: original_vision_claim_id}
          duplicate_filters: {event_type: [vision_claim_reversal]}
          distinct_fields: []

  - id: vision_coverage_changes
    subject: [vision_application_withdraw, vision_free_look_cancel, vision_terminate_voluntary, vision_tier_change]
    rule: >-
      Withdrawing an application, returning a plan in the free-look period, ending coverage and changing plans are the subscriber's own decisions, registered by the agent as a coverage-change request and carried out after the subscriber confirms it.
      A vision withdrawal, free-look cancellation, voluntary termination or plan change is carried out only once the subscriber's vision coverage-change request for that enrollment is confirmed.
      An individual subscriber may return the vision plan no later than the free-look period after the coverage effective date of the vision enrollment.
      The free-look period is free_look_days counted in calendar days from the coverage_effective_date, and a request confirmed on the last day is in time.
      A free-look cancellation voids coverage from the start and credits back all premium, and is not available once any vision service has been paid; group enrollments have no free-look right.
      A voluntary termination ends coverage on the last day of the calendar month in which the request is confirmed, with premium for later months credited back.
      An individual plan change takes effect only on the next benefit-period start after confirmation (tier_change_occasion); a group enrollment changes plan only at the group's open enrollment or with a special enrollment; frequencies already used continue to count after the change.
    eligibility:
      - id: vision_request_confirmed
        applies_to: [vision_application_withdraw, vision_free_look_cancel, vision_terminate_voluntary, vision_tier_change]
        kind: state
        condition: A vision withdrawal, free-look cancellation, voluntary termination or plan change is carried out only once the subscriber's vision coverage-change request for that enrollment is confirmed.
        evidence_fields: [vision_coverage_requests.request_status, vision_coverage_requests.vision_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_coverage_requests.vision_plan_id]
          action_bindings:
            vision_coverage_requests.vision_plan_id: vision_plan_id
        state_contract:
          field: vision_coverage_requests.request_status
          allowed: [confirmed]
      - id: vision_free_look_window
        applies_to: [vision_free_look_cancel]
        kind: time
        condition: An individual subscriber may return the vision plan no later than the free-look period after the coverage effective date of the vision enrollment.
        evidence_fields: [vision_plans.coverage_effective_date, vision_plans.vision_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_plans.vision_plan_id]
          action_bindings:
            vision_plans.vision_plan_id: vision_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the coverage effective date of the vision enrollment
          anchor_source: vision_plans.coverage_effective_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: The free-look period is free_look_days counted in calendar days from the coverage_effective_date, and a request confirmed on the last day is in time.
          boundary: inclusive

  - id: vision_system_terminations
    subject: [vision_terminate_nonpayment, vision_terminate_ineligible]
    rule: >-
      When the funding billing account lapses for nonpayment every active vision enrollment it funds terminates with termination_date equal to the account's paid-through date.
      A child's enrollment ends on the last day of the month in which the child reaches the dependent_child_age_limit birthday, and every enrollment under a group contract ends on the group contract's termination date with termination_reason group_terminated.
      Services with a date of service after the termination date are denied as not eligible, and services already paid for such dates are reversed.
    eligibility: []

  - id: vision_reinstatement
    subject: [vision_reinstate]
    rule: >-
      Vision coverage may be reinstated only if it was terminated for nonpayment and the reinstatement is made no later than the reinstatement window after the termination date of the vision enrollment.
      The window is reinstatement_window_days counted in calendar days from the termination_date, and the last day of the window is in time.
      Reinstatement is carried out only after the funding billing account has been reinstated to active.
      Coverage then continues without a gap and services denied as not eligible in the gap are reprocessed; coverage ended for any other reason cannot be reinstated.
    eligibility:
      - id: vision_reinstatement_window
        applies_to: [vision_reinstate]
        kind: time
        condition: Vision coverage may be reinstated only if it was terminated for nonpayment and the reinstatement is made no later than the reinstatement window after the termination date of the vision enrollment.
        evidence_fields: [vision_plans.termination_date, vision_plans.termination_reason, vision_plans.vision_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_plans.vision_plan_id]
          action_bindings:
            vision_plans.vision_plan_id: vision_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the termination date of the vision enrollment
          anchor_source: vision_plans.termination_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: The window is reinstatement_window_days counted in calendar days from the termination_date, and the last day of the window is in time.
          boundary: inclusive
      - id: vision_billing_reinstated
        applies_to: [vision_reinstate]
        kind: state
        condition: Reinstatement is carried out only after the funding billing account has been reinstated to active.
        evidence_fields: [billing_accounts.status, billing_accounts.billing_account_id, vision_plans.billing_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vision_plans.billing_account_id]
          action_bindings:
            vision_plans.billing_account_id: billing_account_id
        state_contract:
          field: billing_accounts.status
          allowed: [active]

extended_policies:
- id: vision_ext_exam_visit_payment
  base_policy_refs:
  - vision_evt_frequency
  - vision_evt_in_network_benefits
  - vision_evt_oon_reimbursement
  - vision_evt_eligibility_timely_filing
  - vision_activation_binder
  overwrite:
  - base_policy: vision_evt_in_network_benefits
    superseded_clause: >-
      In network the routine exam costs the member exam_copay and the plan pays the rest of the provider's contracted
      exam fee; a standard contact-lens fitting costs the member at most contact_fitting_standard_copay_max, and
      a specialty fitting receives contact_fitting_specialty_allowance with the member paying the rest.
    replaced_by: >-
      For exam visits this rule sets the scheduled exam and fitting fees, fee ratios and exam copay stated here,
      and only for exam visits; a fitting on a contact-lens order is settled by the contact-lens order rule, a stand-alone
      fitting by the stand-alone fitting rule, and every other service remains under the general in-network benefit
      rule.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Under frequency_basis months_from_last_service the benefit is available again on the date that is the stated
      number of calendar months after the last paid date of service of the same kind (vision_msr_last_paid_service),
      the last day of the month being used when that day does not exist; under benefit_year a 12-month frequency
      allows one service per benefit period and a 24-month frequency one service per two consecutive benefit periods
      starting with the period of the last paid service.
    replaced_by: >-
      For exam visits this rule counts frequency as stated in its frequency sentence (from the latest paid or reimbursed
      service of the kind of the current enrollment, a reversal counting only when it reverses the one service on
      that latest date, and a service requested before its benefit is available again settled as that sentence says),
      and only for exam visits; the sibling rules for eyeglasses orders; contact-lens orders; out-of-network claims
      settled on their glasses part; out-of-network claims settled on their contact-lens part; stand-alone contact-lens
      fittings count it the same way, and services paid by another carrier still do not count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      When contacts_in_lieu_of_glasses is true an elective contact-lens benefit uses both the lens and the frame
      benefit for their frequency periods, and lenses or a frame ordered while that benefit is used are denied DENIED_CONTACTS_IN_LIEU;
      medically necessary contacts are counted the same way.
    replaced_by: >-
      For exam visits this rule applies contacts-in-lieu as stated in its in-lieu sentence (reading the latest paid
      or reimbursed service of each kind of the other side and counting it only when it is dated in the same benefit
      period, whatever its order, a reversed latest service counting as that sentence states), and only for exam
      visits; the sibling rules for eyeglasses orders; contact-lens orders; out-of-network claims settled on their
      glasses part; out-of-network claims settled on their contact-lens part; stand-alone contact-lens fittings
      apply it the same way.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      A service requested before its benefit is available again is denied DENIED_FREQUENCY and may be bought at
      materials_discount_pct off retail; a reversed service does not count.
    replaced_by: >-
      For exam visits this rule counts frequency as stated in its frequency sentence (from the latest paid or reimbursed
      service of the kind of the current enrollment, a reversal counting only when it reverses the one service on
      that latest date, and a service requested before its benefit is available again settled as that sentence says),
      and only for exam visits; the sibling rules for eyeglasses orders; contact-lens orders; out-of-network claims
      settled on their glasses part; out-of-network claims settled on their contact-lens part; stand-alone contact-lens
      fittings count it the same way, and services paid by another carrier still do not count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Services of a person under an earlier Cascade vision enrollment count; services paid by another carrier do
      not.
    replaced_by: >-
      For exam visits this rule counts frequency as stated in its frequency sentence (from the latest paid or reimbursed
      service of the kind of the current enrollment, a reversal counting only when it reverses the one service on
      that latest date, and a service requested before its benefit is available again settled as that sentence says),
      and only for exam visits; the sibling rules for eyeglasses orders; contact-lens orders; out-of-network claims
      settled on their glasses part; out-of-network claims settled on their contact-lens part; stand-alone contact-lens
      fittings count it the same way, and services paid by another carrier still do not count.
  trigger: state_due
  subject:
  - vision_exam_claim
  computes: plan_paid
  target_tool: decide_exam_visit_80d2e33d
  params:
    exam_fee_private: 110.0
    exam_fee_chain: 95.0
    new_patient_ratio_private: 1.3
    new_patient_ratio_chain: 1.25
    peds_ratio_private: 1.15
    peds_ratio_chain: 1.1
    fit_fee_specialty: 120.0
    fit_fee_standard: 70.0
    child_copay_ratio: 0.5
  rule: >-
    An exam visit is the routine eye exam line of one claim of the enrollment, together with the claim's contact-lens
    fitting line when the claim carries no contact-lens line (a fitting on a claim with contact lenses belongs to
    the contact-lens order, and spectacle lenses or a frame on the claim to the eyeglasses order); the visit decided
    is the claim of the latest received routine eye exam line that carries no remark yet at a participating independent
    practice, or, when none does, at a participating retail-chain location (participating meaning under a Cascade
    Vision Network Provider Agreement), or, when none does, the claim of the latest received routine eye exam line
    that stands denied as not eligible at any location, an out-of-network visit already filed by the member and
    denied for eligibility being reprocessed the same way. The visit's date of service, received date, network channel
    and provider agreement are those of its lines, the billed charge of each line is its retail charge, and the
    patient's age is counted in whole years from the enrollee's date of birth to the date of service. Whether an
    exam visit is paid under the exam benefit is decided in this order: when its claim reached Cascade more than
    the filing limit (timely_filing_days_in_network at a participating location, timely_filing_days_oon out of network)
    calendar days after the date of service, nothing is paid for the visit (DENIED_TIMELY_FILING); otherwise, when
    the enrollment still stands applied and the latest binder payment the funding billing account received (its
    latest payment with payment purpose binder) was not returned, is for at least the plan unit's monthly premium
    for its coverage tier and was received on or before the binder deadline (the coverage_effective_date plus binder_deadline_days
    calendar days, a payment on the deadline day being in time), a service dated on or after the coverage_effective_date
    is paid under the exam benefit, coverage having started retroactively on that date; in every other case the
    enrollment's own status and dates decide. An exam visit is paid under the exam benefit only when the enrollment
    is active or terminated and the date of service is on or after its coverage_effective_date and on or before
    its termination_date when it has one; otherwise its lines are denied DENIED_NOT_ELIGIBLE and nothing is paid.
    The routine eye exam line is paid only when the exam benefit is available again (the benefit of a kind is available
    again unless the latest service of that kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT blocks
    it: under frequency_basis benefit_year a frequency of twelve months is blocked by a latest service in the same
    benefit period and a frequency of twenty-four months by one in the same or the preceding benefit period (a latest
    service in a later benefit period blocks nothing), while under frequency_basis months_from_last_service it is
    blocked when fewer than the stated number of whole calendar months (a month being complete on the same day number)
    separate the two dates in either direction; when that latest service is the only paid or reimbursed service
    of its kind on its date and has been reversed, nothing blocks the benefit, while of several on that date a reversal
    of one leaves the benefit blocked); an exam line whose benefit is blocked is denied DENIED_FREQUENCY and nothing
    is paid for it; a contact-lens fitting line is not limited separately. Under the exam benefit the scheduled
    exam fee is exam_fee_private, every fitting line is scheduled at that same exam fee, the exam copay is exam_copay,
    and the plan pays for each line the lesser of its billed charge and its scheduled fee, less the exam copay on
    the exam line. The scheduled exam fee follows the visit's network channel: exam_fee_chain at a participating
    retail-chain location, the out-of-network exam amount oon_exam_reimbursement out of network, and exam_fee_private
    at a participating independent practice. A new-patient fee ratio applies when the latest routine eye exam of
    the patient under the same provider agreement that stands PAID or PAID_OON_REIMBURSEMENT (when that latest one
    is the only such service on its date and has been reversed, there is taken to be none and no earlier one is
    looked at, while of several such services on that date a reversal of one leaves that date standing) is not dated
    on or before the visit and less than thirty-six whole calendar months before it: new_patient_ratio_private at
    an independent practice and new_patient_ratio_chain at a retail-chain location; an established patient, and
    every out-of-network visit, keeps a ratio of 1. A pediatric fee ratio applies to a patient under child_age_limit_years
    on the date of service: peds_ratio_private at an independent practice and peds_ratio_chain at a retail-chain
    location; everyone else, and every out-of-network visit, keeps a ratio of 1. The scheduled fee of the visit's
    contact-lens fitting follows the visit's lines: fit_fee_specialty when the routine exam comes with a specialty
    contact-lens fitting line, fit_fee_standard when it comes with a standard contact-lens fitting line, and no
    fitting fee (0.00) when the visit is a routine exam without a fitting line. The exam copay follows the patient
    and channel: none out of network, exam_copay times child_copay_ratio for a patient under child_age_limit_years
    at a participating location, and exam_copay for everyone else. Out of network the visit's fitting line, whatever
    its kind, is reimbursed at the lesser of its receipt and oon_exam_reimbursement. The plan's payment for an exam
    visit is worked out in this order: first the exam line's scheduled exam fee is multiplied once by the product
    of every fee ratio that applies, the lesser of the exam line's billed charge and that amount is taken and the
    exam copay is subtracted, never below 0.00; then the fitting line's lesser of its billed charge and its scheduled
    fitting fee is added, an out-of-network fitting line taking its out-of-network amount instead. The payment is
    booked on the visit's first paid line and is rounded half up to the cent once, at the end. For exam visits this
    rule sets the scheduled exam and fitting fees, fee ratios and exam copay stated here, and only for exam visits;
    a fitting on a contact-lens order is settled by the contact-lens order rule, a stand-alone fitting by the stand-alone
    fitting rule, and every other service remains under the general in-network benefit rule. For exam visits this
    rule counts frequency as stated in its frequency sentence (from the latest paid or reimbursed service of the
    kind of the current enrollment, a reversal counting only when it reverses the one service on that latest date,
    and a service requested before its benefit is available again settled as that sentence says), and only for exam
    visits; the sibling rules for eyeglasses orders; contact-lens orders; out-of-network claims settled on their
    glasses part; out-of-network claims settled on their contact-lens part; stand-alone contact-lens fittings count
    it the same way, and services paid by another carrier still do not count. For exam visits this rule applies
    contacts-in-lieu as stated in its in-lieu sentence (reading the latest paid or reimbursed service of each kind
    of the other side and counting it only when it is dated in the same benefit period, whatever its order, a reversed
    latest service counting as that sentence states), and only for exam visits; the sibling rules for eyeglasses
    orders; contact-lens orders; out-of-network claims settled on their glasses part; out-of-network claims settled
    on their contact-lens part; stand-alone contact-lens fittings apply it the same way.
  prerequisite: []
  cross_category: &id001
  - category: billing
    as: branch
    reads:
    - billing_txn_id
    - txn_date
    - amount
    - event_type
    - payment_purpose
    - original_billing_txn_id
    note: >-
      retroactive coverage of an applied enrollment follows the binder payment on the funding billing account ledger
  compute:
  - a_c1: >-
      LATEST('vision_claims', 'claim_number', date_field='received_date', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      network_channel='in_network_private_practice', remark_code='')
  - a_c2: >-
      LATEST('vision_claims', 'claim_number', date_field='received_date', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      network_channel='in_network_retail_chain', remark_code='')
  - a_c3: >-
      LATEST('vision_claims', 'claim_number', date_field='received_date', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      remark_code='DENIED_NOT_ELIGIBLE')
  - a_claim: a_c1 or a_c2 or a_c3
  - a_xid: >-
      LATEST('vision_claims', 'vision_claim_id', claim_number=a_claim, event_type='vision_exam_claim', exam_type='routine_eye_exam')
      or ''
  - a_ksid: >-
      LATEST('vision_claims', 'vision_claim_id', claim_number=a_claim, event_type='vision_exam_claim', exam_type='contact_lens_fitting_specialty')
      or ''
  - a_ktid: >-
      LATEST('vision_claims', 'vision_claim_id', claim_number=a_claim, event_type='vision_exam_claim', exam_type='contact_lens_fitting_standard')
      or ''
  - a_cid: >-
      LATEST('vision_claims', 'vision_claim_id', claim_number=a_claim, event_type='vision_contacts_claim') or ''
  - a_lid: >-
      LATEST('vision_claims', 'vision_claim_id', claim_number=a_claim, event_type='vision_lens_claim') or ''
  - a_fid: >-
      LATEST('vision_claims', 'vision_claim_id', claim_number=a_claim, event_type='vision_frame_claim') or ''
  - a_kid: (a_ksid or a_ktid) if a_cid == '' else ''
  - a_xr: float(LATEST('vision_claims', 'retail_charge', vision_claim_id=a_xid) or 0)
  - a_kr: float(LATEST('vision_claims', 'retail_charge', vision_claim_id=a_kid) or 0)
  - a_cr: float(LATEST('vision_claims', 'retail_charge', vision_claim_id=a_cid) or 0)
  - a_lr: float(LATEST('vision_claims', 'retail_charge', vision_claim_id=a_lid) or 0)
  - a_fr: float(LATEST('vision_claims', 'retail_charge', vision_claim_id=a_fid) or 0)
  - a_any: a_xid or a_kid or a_cid or a_lid or a_fid
  - a_dos: LATEST('vision_claims', 'date_of_service', vision_claim_id=a_any)
  - a_rcv: LATEST('vision_claims', 'received_date', vision_claim_id=a_any)
  - a_ch: LATEST('vision_claims', 'network_channel', vision_claim_id=a_any)
  - a_agr: LATEST('vision_claims', 'provider_agreement_id', vision_claim_id=a_any) or ''
  - a_age: int(MONTHS(F('enrollee_date_of_birth'), a_dos) / 12)
  - a_rec: >-
      (F('status') == 'active' or F('status') == 'terminated') and F('coverage_effective_date') <= a_dos and (F('termination_date')
      or '9999-12-31') >= a_dos
  - a_lim: P('timely_filing_days_oon') if a_ch == 'out_of_network' else P('timely_filing_days_in_network')
  - a_bid: >-
      XLATEST('billing', 'billing_transactions', 'billing_txn_id', date_field='txn_date', event_type='billing_payment_received',
      payment_purpose='binder', billing_account_id=F('billing_account_id'))
  - a_bdate: >-
      XLATEST('billing', 'billing_transactions', 'txn_date', date_field='txn_date', event_type='billing_payment_received',
      payment_purpose='binder', billing_account_id=F('billing_account_id')) or ''
  - a_bamt: >-
      XLATEST('billing', 'billing_transactions', 'amount', date_field='txn_date', event_type='billing_payment_received',
      payment_purpose='binder', billing_account_id=F('billing_account_id'))
  - a_bret: >-
      XCOUNT('billing', 'billing_transactions', event_type='billing_payment_returned', original_billing_txn_id=a_bid)
  - a_mode: >-
      'late' if DAYS(a_dos, a_rcv) > a_lim else ('binder' if (F('status') == 'applied' and a_bdate != '' and DAYS(F('coverage_effective_date'),
      a_bdate) <= P('binder_deadline_days') and a_bret == 0 and float(a_bamt or 0) >= P('monthly_premium_' + F('coverage_tier'))
      and a_dos >= F('coverage_effective_date')) else 'record')
  - a_lxa: >-
      LATEST('vision_claims', 'vision_claim_id', date_field='date_of_service', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      remark_code='PAID')
  - a_lxb: >-
      LATEST('vision_claims', 'vision_claim_id', date_field='date_of_service', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      remark_code='PAID_OON_REIMBURSEMENT')
  - a_lxad: LATEST('vision_claims', 'date_of_service', vision_claim_id=a_lxa) or ''
  - a_lxbd: LATEST('vision_claims', 'date_of_service', vision_claim_id=a_lxb) or ''
  - a_lxd: (a_lxad if a_lxad >= a_lxbd else a_lxbd)
  - a_lxi: a_lxa if a_lxad >= a_lxbd else a_lxb
  - a_lx: >-
      '' if (a_lxd != '' and COUNT('vision_claims', event_type='vision_claim_reversal', original_vision_claim_id=a_lxi)
      > 0 and (COUNT('vision_claims', event_type='vision_exam_claim', exam_type='routine_eye_exam', remark_code='PAID',
      date_of_service=a_lxd) + COUNT('vision_claims', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      remark_code='PAID_OON_REIMBURSEMENT', date_of_service=a_lxd)) == 1) else a_lxd
  - a_xok: >-
      a_xid != '' and (a_lx == '' or ((not (int(MONTHS('2000-' + F('benefit_period_start_mmdd'), a_lx) / 12) <=
      int(MONTHS('2000-' + F('benefit_period_start_mmdd'), a_dos) / 12) and int(MONTHS('2000-' + F('benefit_period_start_mmdd'),
      a_dos) / 12) - int(MONTHS('2000-' + F('benefit_period_start_mmdd'), a_lx) / 12) < int(P('exam_frequency_months')
      / 12))) if P('frequency_basis') == 'benefit_year' else (not (((a_lx <= a_dos) and MONTHS(a_lx, a_dos) < P('exam_frequency_months'))
      or ((a_lx > a_dos) and MONTHS(a_dos, a_lx) < P('exam_frequency_months'))))))
  - a_fee: >-
      K('exam_fee_chain') if LATEST('vision_claims', 'network_channel', vision_claim_id=a_any) == 'in_network_retail_chain'
      else (P('oon_exam_reimbursement') if LATEST('vision_claims', 'network_channel', vision_claim_id=a_any) ==
      'out_of_network' else K('exam_fee_private'))
  - a_npa: >-
      LATEST('vision_claims', 'vision_claim_id', date_field='date_of_service', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      provider_agreement_id=a_agr, remark_code='PAID')
  - a_npb: >-
      LATEST('vision_claims', 'vision_claim_id', date_field='date_of_service', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      provider_agreement_id=a_agr, remark_code='PAID_OON_REIMBURSEMENT')
  - a_npad: LATEST('vision_claims', 'date_of_service', vision_claim_id=a_npa) or ''
  - a_npbd: LATEST('vision_claims', 'date_of_service', vision_claim_id=a_npb) or ''
  - a_npd: >-
      (a_npad if a_npad >= a_npbd else a_npbd) if (COUNT('vision_claims', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      provider_agreement_id=a_agr, remark_code='PAID') + COUNT('vision_claims', event_type='vision_exam_claim',
      exam_type='routine_eye_exam', provider_agreement_id=a_agr, remark_code='PAID_OON_REIMBURSEMENT')) > 0 else
      ''
  - a_npi: a_npa if a_npad >= a_npbd else a_npb
  - a_np: >-
      '' if (a_npd != '' and COUNT('vision_claims', event_type='vision_claim_reversal', original_vision_claim_id=a_npi)
      > 0 and (COUNT('vision_claims', event_type='vision_exam_claim', exam_type='routine_eye_exam', provider_agreement_id=a_agr,
      remark_code='PAID', date_of_service=a_npd) + COUNT('vision_claims', event_type='vision_exam_claim', exam_type='routine_eye_exam',
      provider_agreement_id=a_agr, remark_code='PAID_OON_REIMBURSEMENT', date_of_service=a_npd)) == 1) else a_npd
  - a_npr: >-
      K('new_patient_ratio_private') if (not (a_np != '' and a_np <= a_dos and MONTHS(a_np, a_dos) < 36) and LATEST('vision_claims',
      'network_channel', vision_claim_id=a_any) == 'in_network_private_practice') else (K('new_patient_ratio_chain')
      if (not (a_np != '' and a_np <= a_dos and MONTHS(a_np, a_dos) < 36) and LATEST('vision_claims', 'network_channel',
      vision_claim_id=a_any) == 'in_network_retail_chain') else 1.0)
  - a_peds: >-
      K('peds_ratio_private') if (int(MONTHS(F('enrollee_date_of_birth'), a_dos) / 12) < P('child_age_limit_years')
      and LATEST('vision_claims', 'network_channel', vision_claim_id=a_any) == 'in_network_private_practice') else
      (K('peds_ratio_chain') if (int(MONTHS(F('enrollee_date_of_birth'), a_dos) / 12) < P('child_age_limit_years')
      and LATEST('vision_claims', 'network_channel', vision_claim_id=a_any) == 'in_network_retail_chain') else 1.0)
  - a_ffee: >-
      K('fit_fee_specialty') if LATEST('vision_claims', 'exam_type', vision_claim_id=a_kid) == 'contact_lens_fitting_specialty'
      else (K('fit_fee_standard') if LATEST('vision_claims', 'exam_type', vision_claim_id=a_kid) == 'contact_lens_fitting_standard'
      else 0.0)
  - a_cop: >-
      0.0 if LATEST('vision_claims', 'network_channel', vision_claim_id=a_any) == 'out_of_network' else (P('exam_copay')
      * K('child_copay_ratio') if int(MONTHS(F('enrollee_date_of_birth'), a_dos) / 12) < P('child_age_limit_years')
      else P('exam_copay'))
  - result: >-
      int((0.0 if (a_mode == 'late' or not (a_mode == 'binder' or a_rec)) else ((MX(0, MN(a_xr, a_fee * a_npr *
      a_peds) - a_cop) if a_xok else 0.0) + ((MN(a_kr, P('oon_exam_reimbursement')) if a_ch == 'out_of_network'
      else MN(a_kr, a_ffee)) if a_kid != '' else 0.0))) * 100 + 0.5) / 100
  compute_basis:
    a_c1: >-
