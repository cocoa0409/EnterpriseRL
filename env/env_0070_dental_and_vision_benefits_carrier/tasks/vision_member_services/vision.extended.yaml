    bindings:
    - x_bid
    - x_bdate
    - x_bamt
    - x_bret
    - x_mode
    ladder:
    - when: the claim reached Cascade more than the filing limit in calendar days after the date of service
      method: >-
        denied DENIED_TIMELY_FILING: nothing owed at a participating location, the whole receipt kept out of network
    - when: >-
        otherwise, the enrollment stands applied, the funding account's latest binder payment, not returned, is
        for at least the plan unit premium and reached it on or before the binder deadline, and the service is dated
        on or after the coverage_effective_date
      method: settled under the fitting benefit, coverage starting retroactively
    - when: otherwise (the enrollment's own status and dates decide)
      method: >-
        settled under the fitting benefit only when the enrollment was active on the date of service, else denied
        DENIED_NOT_ELIGIBLE at the whole billed charge
    baseline:
      x_mode: '''record'''
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  - id: tied_fitting_allowance
    effect: parameter
    decides: x_tie
    bindings:
    - x_tca
    - x_tcb
    - x_tcad
    - x_tcbd
    - x_tcd
    - x_tci
    - x_tc
    - x_tdays
    - x_tid
    - x_tie
    ladder:
    - when: the tied contact lenses were certified medically necessary
      value: K('mn_fit_allowance')
    - when: no paid or reimbursed contact lenses within the tie window
      value: '0.00'
    - when: otherwise (the tied contact lenses are elective)
      value: P('contact_fitting_specialty_allowance')
    baseline:
      x_tie: P('contact_fitting_specialty_allowance')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: new_wearer_allowance
    effect: parameter
    decides: x_new
    bindings:
    - x_wsa
    - x_wsb
    - x_wsad
    - x_wsbd
    - x_wsd
    - x_wsi
    - x_ws
    - x_wta
    - x_wtb
    - x_wtad
    - x_wtbd
    - x_wtd
    - x_wti
    - x_wt
    - x_ret
    - x_new
    ladder:
    - when: >-
        no paid or reimbursed fitting under the same provider agreement within thirty-six whole months before, at
        an independent practice
      value: K('new_fit_private')
    - when: no such fitting, at a retail-chain location
      value: K('new_fit_chain')
    - when: otherwise (a returning wearer, or out of network)
      value: '0.00'
    baseline:
      x_new: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: fit_cost_rule
    effect: method
    decides: x_fmode
    bindings:
    - x_fmode
    ladder:
    - when: a specialty fitting at an independent practice
      method: >-
        the contracted fee (the billed charge less premium_fit_discount_pct percent) less the combined fitting allowance,
        never below 0.00
    - when: a specialty fitting at a retail-chain location
      method: the contracted fee with no fitting allowance
    - when: otherwise
      method: >-
        the fitting benefit for its kind: the part above the combined fitting allowance, at most contact_fitting_standard_copay_max
        for a standard fitting
    baseline:
      x_fmode: '''benefit'''
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      A stand-alone fitting is the contact-lens fitting line of a claim of the enrollment that carries neither a
      routine eye exam line nor a contact-lens line; the fitting looked at is the claim of the latest received specialty
      fitting line that carries no remark yet at a participating independent practice, or, when none does, at a
      participating retail-chain location, or, when none does, of the latest received standard fitting line that
      carries no remark yet at a participating independent practice, or, when none does, at a participating retail-chain
      location, or, when none does, of the latest received specialty fitting line, and then standard fitting line,
      that stands denied as not eligible at any location. Its date of service, received date, network channel, provider
      agreement, billed charge and fitting kind are read from that line. A stand-alone fitting is settled under
      the fitting benefit only when the enrollment is active or terminated and the date of service is on or after
      its coverage_effective_date and on or before its termination_date when it has one; otherwise its lines are
      denied DENIED_NOT_ELIGIBLE and the member pays the whole billed charge. On a plan whose contacts_benefit_included
      is false a stand-alone fitting, being part of the contacts benefit, is denied DENIED_NOT_COVERED: at a participating
      location it is bought at materials_discount_pct percent off its charge, and out of network nothing is reimbursed
      and the member pays the whole receipt. On a plan with a contacts benefit an out-of-network stand-alone fitting
      is reimbursed the lesser of its receipt and oon_exam_reimbursement, the member paying the rest of the receipt;
      a fitting is not limited by frequency separately. Under the fitting benefit a stand-alone specialty fitting
      receives the fitting allowance contact_fitting_specialty_allowance and the member pays the part of the billed
      charge above the fitting allowances, never below 0.00, while a stand-alone standard fitting costs the member
      that same part but at most contact_fitting_standard_copay_max. When the claim of the fitting looked at also
      carries a routine eye exam line or a contact-lens line, its fitting belongs to the exam visit or the contact-lens
      order and this rule settles nothing for it (a member share of 0.00 under this rule). Every allowance that
      applies to a stand-alone fitting is added into one combined fitting allowance before the fitting's member
      share is taken as the sentences for its kind and location state, and the member share is rounded half up to
      the cent once, at the end.
    params:
    - contact_fitting_specialty_allowance
    - contact_fitting_standard_copay_max
    - timely_filing_days_in_network
  inputs:
    history:
    - table: vision_claims
      aggregate: latest
      field: date_of_service
      filters:
        event_type: vision_contacts_claim
    - *id002
    cross_category:
    - billing
