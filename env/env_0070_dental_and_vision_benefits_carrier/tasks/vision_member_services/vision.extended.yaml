    x_lim: >-
      Whether a stand-alone fitting is settled under the fitting benefit is decided in this order: when its claim
      reached Cascade more than the filing limit (timely_filing_days_in_network at a participating location, timely_filing_days_oon
      out of network) calendar days after the date of service, the member owes nothing for it at a participating
      location and keeps the whole receipt out of network (DENIED_TIMELY_FILING); otherwise, when the enrollment
      still stands applied and the latest binder payment the funding billing account received (its latest payment
      with payment purpose binder) was not returned, is for at least the plan unit's monthly premium for its coverage
      tier and was received on or before the binder deadline (the coverage_effective_date plus binder_deadline_days
      calendar days, a payment on the deadline day being in time), a service dated on or after the coverage_effective_date
      is settled under the fitting benefit, coverage having started retroactively on that date; in every other case
      the enrollment's own status and dates decide.
    x_fmode: >-
      How the member share of a stand-alone fitting is worked out depends on its kind and location: a specialty
      fitting at an independent practice is first priced at its contracted fee, the billed charge less premium_fit_discount_pct
      percent of it, and the member pays the part of that contracted fee above the combined fitting allowance, never
      below 0.00; a specialty fitting at a retail-chain location receives no fitting allowance and costs the member
      its contracted fee; every other fitting follows the fitting benefit as stated for its kind.
    result: >-
      When the claim of the fitting looked at also carries a routine eye exam line or a contact-lens line, its fitting
      belongs to the exam visit or the contact-lens order and this rule settles nothing for it (a member share of
      0.00 under this rule). Every allowance that applies to a stand-alone fitting is added into one combined fitting
      allowance before the fitting's member share is taken as the sentences for its kind and location state, and
      the member share is rounded half up to the cent once, at the end.
