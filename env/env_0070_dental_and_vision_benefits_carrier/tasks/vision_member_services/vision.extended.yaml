  factors:
  - id: eligibility_binder
    effect: method
    decides: k_mode
    bindings:
    - k_bid
    - k_bdate
    - k_bamt
    - k_bret
    - k_mode
    ladder:
    - when: the claim reached Cascade more than the filing limit in calendar days after the date of service
      method: >-
        denied DENIED_TIMELY_FILING: nothing owed at a participating location, the whole receipt kept out of network
    - when: >-
        otherwise, the enrollment stands applied, the funding account's latest binder payment, not returned, is
        for at least the plan unit premium and reached it on or before the binder deadline, and the service is dated
        on or after the coverage_effective_date
      method: settled under the contacts rules, coverage starting retroactively
    - when: otherwise (the enrollment's own status and dates decide)
      method: >-
        settled under the contacts rules only when the enrollment was active on the date of service, else denied
        DENIED_NOT_ELIGIBLE at the whole retail charge
    baseline:
      k_mode: '''record'''
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  - id: in_lieu_basis
    effect: method
    decides: k_basis
    bindings:
    - k_basis
    ladder:
    - when: >-
        a spectacle-lens or frame service of the same person counts in the benefit period of the order, or the order's
        own claim carries a spectacle-lens or frame line still open
      method: >-
        bought outside the benefit (DENIED_CONTACTS_IN_LIEU): the retail charge less the outside-benefit discount
        rate, or the whole receipt out of network
    - when: otherwise, the provider certified the contact lenses as medically necessary
      method: >-
        covered in full after the materials copay, or reimbursed up to the medically necessary out-of-network amount
    - when: otherwise (elective contact lenses)
      method: >-
        the materials copay plus the part above contacts_allowance_elective, or reimbursed up to the elective out-of-network
        amount
    baseline:
      k_basis: '''allowance'''
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: additional_pair_part
    effect: parameter
    decides: k_ppct
    bindings:
    - k_pfa
    - k_pfb
    - k_pfad
    - k_pfbd
    - k_pfd
    - k_pfi
    - k_pf
    - k_pagr
    - k_prun
    - k_ppct
    ladder:
    - when: >-
        the latest paid or reimbursed frame of the person, dated on or before the contact lenses with its frame
        frequency still running, came from the same provider agreement
      value: K('addl_pair_pct_same')
    - when: that frame came from any other provider, participating or not
      value: K('addl_pair_pct_other')
    - when: otherwise
      value: '0'
    baseline:
      k_ppct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: tied_fitting_allowance
    effect: parameter
    decides: k_tie
    bindings:
    - k_tca
    - k_tcb
    - k_tcad
    - k_tcbd
    - k_tcd
    - k_tci
    - k_tc
    - k_own
    - k_tdays
    - k_tid
    - k_tie
    ladder:
    - when: >-
        the tied contact lenses (the order's own contact lenses when this decision settles them under the contacts
        benefit, otherwise the latest paid or reimbursed contact lenses within the tie window) were certified medically
        necessary
      value: K('mn_fit_allowance')
    - when: >-
        the order's own contact lenses are not settled under the contacts benefit and no paid or reimbursed contact
        lenses are within the tie window
      value: '0.00'
    - when: otherwise (the tied contact lenses are elective)
      value: P('contact_fitting_specialty_allowance')
    baseline:
      k_tie: P('contact_fitting_specialty_allowance')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: new_wearer_allowance
    effect: parameter
    decides: k_new
    bindings:
    - k_wsa
    - k_wsb
    - k_wsad
    - k_wsbd
    - k_wsd
    - k_wsi
    - k_ws
    - k_wta
    - k_wtb
    - k_wtad
    - k_wtbd
    - k_wtd
    - k_wti
    - k_wt
    - k_ret
    - k_new
    ladder:
    - when: >-
        no paid or reimbursed fitting under the same provider agreement within thirty-six whole months before, at
        an independent practice
      value: K('new_fit_private')
    - when: no such fitting, at a retail-chain location
      value: K('new_fit_chain')
    - when: otherwise (a returning wearer, or out of network)
      value: '0.00'
    baseline:
      k_new: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: fit_cost_rule
    effect: method
    decides: k_fmode
    bindings:
    - k_fmode
    ladder:
    - when: a specialty fitting at an independent practice
      method: >-
        the contracted fee (the billed charge less premium_fit_discount_pct percent) less the combined fitting allowance,
        never below 0.00
    - when: a specialty fitting at a retail-chain location
      method: the contracted fee with no fitting allowance
    - when: otherwise
      method: >-
        the fitting benefit for its kind: the part above the combined fitting allowance, at most contact_fitting_standard_copay_max
        for a standard fitting
    baseline:
      k_fmode: '''benefit'''
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      A contact-lens order is the contact-lens line of one claim of the enrollment, together with the claim's contact-lens
      fitting line (a routine exam line of the claim belongs to the exam visit, and spectacle lenses or a frame
      to the eyeglasses order); the order decided is the claim of the latest received contact-lens line that carries
      no remark yet at a participating independent practice, or, when none does, at a participating retail-chain
      location, or, when none does, the claim of the latest received contact-lens line that stands denied as not
      eligible at any location, an out-of-network order already filed by the member and denied for eligibility being
      reprocessed the same way. The order's date of service, received date, network channel and provider agreement
      are those of its lines, each line's charge is its retail charge, and the contact-lens reason and the fitting's
      exam type are read from their lines. A contact-lens order is settled under the contacts rules only when the
      enrollment is active or terminated and the date of service is on or after its coverage_effective_date and
      on or before its termination_date when it has one; otherwise its lines are denied DENIED_NOT_ELIGIBLE and
      the member pays the whole retail charge. On a plan whose contacts_benefit_included is false, or whose contacts_medically_necessary_in_network
      is not_covered, the contact-lens and fitting lines are denied DENIED_NOT_COVERED: at a participating location
      the contact lenses are bought at the outside-benefit discount rate off their retail charge and the fitting
      at materials_discount_pct percent off its charge, and out of network nothing is reimbursed. The contact-lens
      line is settled under the contacts benefit only when that benefit is available again (contacts_frequency_months):
      the benefit of a kind is available again unless the latest service of that kind of the enrollment that stands
      PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency of twelve months
      is blocked by a latest service in the same benefit period and a frequency of twenty-four months by one in
      the same or the preceding benefit period (a latest service in a later benefit period blocks nothing), while
      under frequency_basis months_from_last_service it is blocked when fewer than the stated number of whole calendar
      months (a month being complete on the same day number) separate the two dates in either direction; when that
      latest service is the only paid or reimbursed service of its kind on its date and has been reversed, nothing
      blocks the benefit, while of several on that date a reversal of one leaves the benefit blocked; a contact-lens
      line whose benefit is blocked is denied DENIED_FREQUENCY, bought at the outside-benefit discount rate off
      its retail charge at a participating location and not reimbursed out of network; a fitting is not limited
      separately. Elective contact lenses take the contacts allowance contacts_allowance_elective: at a participating
      location the member pays the materials copay materials_copay plus the part of the retail charge above the
      allowance, with no discount, and out of network the member pays the receipt less the lesser of the receipt
      and oon_contacts_elective_reimbursement. A fitting at a participating location receives the fitting allowance
      contact_fitting_specialty_allowance; the member pays the part of its billed charge above its fitting allowances,
      never below 0.00, but at most contact_fitting_standard_copay_max for a standard fitting; out of network the
      member pays the fitting's receipt less the lesser of the receipt and oon_exam_reimbursement, or the whole
      receipt when the order's contact lenses are not reimbursed. Contact lenses bought outside the benefit at a
      participating location (on a plan without the benefit, blocked by frequency, or left out in lieu) are bought
      at their retail charge less the outside-benefit discount rate, which is materials_discount_pct percent. The
      member share of a contact-lens order is worked out in this order: first the contact-lens line's share is taken
      as its settlement states, every discount part that applies to it being added into one rate taken once off
      the retail charge; then every fitting allowance that applies is added into one combined fitting allowance
      and the fitting line's share is taken as the fitting sentences state; finally the two shares are added. The
      member share is booked on the order's first line and rounded half up to the cent once, at the end.
    params:
    - contacts_allowance_elective
    - materials_copay
    - contact_fitting_specialty_allowance
    - contact_fitting_standard_copay_max
    - materials_discount_pct
    - timely_filing_days_in_network
