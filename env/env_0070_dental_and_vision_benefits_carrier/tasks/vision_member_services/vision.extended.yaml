  overwrite:
  - base_policy: vision_evt_in_network_benefits
    superseded_clause: >-
      In network the routine exam costs the member exam_copay and the plan pays the rest of the provider's contracted
      exam fee; a standard contact-lens fitting costs the member at most contact_fitting_standard_copay_max, and
      a specialty fitting receives contact_fitting_specialty_allowance with the member paying the rest.
    replaced_by: >-
      For contact-lens orders this rule sets the fitting allowances, the fitting cost rule and the in-lieu settlement
      stated here, and only for contact-lens orders; a fitting of an exam visit is settled by the exam-visit rule,
      a stand-alone fitting by the stand-alone fitting rule, and every other service remains under the general in-network
      benefit rule.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Under frequency_basis months_from_last_service the benefit is available again on the date that is the stated
      number of calendar months after the last paid date of service of the same kind (vision_msr_last_paid_service),
      the last day of the month being used when that day does not exist; under benefit_year a 12-month frequency
      allows one service per benefit period and a 24-month frequency one service per two consecutive benefit periods
      starting with the period of the last paid service.
    replaced_by: >-
      For contact-lens orders this rule counts frequency as stated in its frequency sentence (from the latest paid
      or reimbursed service of the kind of the current enrollment, a reversal counting only when it reverses the
      one service on that latest date, and a service requested before its benefit is available again settled as
      that sentence says), and only for contact-lens orders; the sibling rules for exam visits; eyeglasses orders;
      out-of-network claims settled on their glasses part; out-of-network claims settled on their contact-lens part;
      stand-alone contact-lens fittings count it the same way, and services paid by another carrier still do not
      count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      When contacts_in_lieu_of_glasses is true an elective contact-lens benefit uses both the lens and the frame
      benefit for their frequency periods, and lenses or a frame ordered while that benefit is used are denied DENIED_CONTACTS_IN_LIEU;
      medically necessary contacts are counted the same way.
    replaced_by: >-
      For contact-lens orders this rule applies contacts-in-lieu as stated in its in-lieu sentence (reading the
      latest paid or reimbursed service of each kind of the other side and counting it only when it is dated in
      the same benefit period, whatever its order, a reversed latest service counting as that sentence states),
      and only for contact-lens orders; the sibling rules for exam visits; eyeglasses orders; out-of-network claims
      settled on their glasses part; out-of-network claims settled on their contact-lens part; stand-alone contact-lens
      fittings apply it the same way.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      A service requested before its benefit is available again is denied DENIED_FREQUENCY and may be bought at
      materials_discount_pct off retail; a reversed service does not count.
    replaced_by: >-
      For contact-lens orders this rule counts frequency as stated in its frequency sentence (from the latest paid
      or reimbursed service of the kind of the current enrollment, a reversal counting only when it reverses the
      one service on that latest date, and a service requested before its benefit is available again settled as
      that sentence says), and only for contact-lens orders; the sibling rules for exam visits; eyeglasses orders;
      out-of-network claims settled on their glasses part; out-of-network claims settled on their contact-lens part;
      stand-alone contact-lens fittings count it the same way, and services paid by another carrier still do not
      count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Services of a person under an earlier Cascade vision enrollment count; services paid by another carrier do
      not.
    replaced_by: >-
      For contact-lens orders this rule counts frequency as stated in its frequency sentence (from the latest paid
      or reimbursed service of the kind of the current enrollment, a reversal counting only when it reverses the
      one service on that latest date, and a service requested before its benefit is available again settled as
      that sentence says), and only for contact-lens orders; the sibling rules for exam visits; eyeglasses orders;
      out-of-network claims settled on their glasses part; out-of-network claims settled on their contact-lens part;
      stand-alone contact-lens fittings count it the same way, and services paid by another carrier still do not
      count.
