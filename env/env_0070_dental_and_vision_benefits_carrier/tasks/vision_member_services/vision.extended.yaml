  factors:
  - id: eligibility_binder
    effect: method
    decides: b_mode
    bindings:
    - b_bid
    - b_bdate
    - b_bamt
    - b_bret
    - b_mode
    ladder:
    - when: the claim reached Cascade more than the filing limit in calendar days after the date of service
      method: >-
        denied DENIED_TIMELY_FILING: nothing owed at a participating location, the whole receipt kept out of network
    - when: >-
        otherwise, the enrollment stands applied, the funding account's latest binder payment, not returned, is
        for at least the plan unit premium and reached it on or before the binder deadline, and the service is dated
        on or after the coverage_effective_date
      method: settled under the materials benefit, coverage starting retroactively
    - when: otherwise (the enrollment's own status and dates decide)
      method: >-
        settled under the materials benefit only when the enrollment was active on the date of service, else denied
        DENIED_NOT_ELIGIBLE at the whole retail charge
    baseline:
      b_mode: '''record'''
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  - id: lens_type_copay
    effect: parameter
    decides: b_tc
    bindings:
    - b_tc
    ladder:
    - when: premium progressive lenses
      value: P('lens_copay_progressive_premium')
    - when: standard progressive lenses
      value: P('lens_copay_progressive_standard')
    - when: otherwise (single vision, lined bifocal or lined trifocal)
      value: the copay of the order's own lens type
    baseline:
      b_tc: P('lens_copay_single_vision')
    evidence:
    - history
    cross_difficulty: null
  - id: anti_reflective_copay
    effect: parameter
    decides: b_ar
    bindings:
    - b_ar
    ladder:
    - when: the lens options list anti_reflective_premium
      value: P('option_copay_anti_reflective_premium')
    - when: the lens options list anti_reflective_standard without the premium coating
      value: P('option_copay_anti_reflective_standard')
    - when: otherwise
      value: '0.00'
    baseline:
      b_ar: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: light_control_copay
    effect: parameter
    decides: b_lc
    bindings:
    - b_lc
    ladder:
    - when: the lens options list photochromic
      value: P('option_copay_photochromic')
    - when: the lens options list tint without photochromic
      value: P('option_copay_tint')
    - when: otherwise
      value: '0.00'
    baseline:
      b_lc: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: materials_copay_band
    effect: parameter
    decides: b_mc
    bindings:
    - b_mc
    ladder:
    - when: out of network
      value: '0.00'
    - when: a participating location and a patient under child_age_limit_years
      value: P('materials_copay') * K('child_copay_ratio')
    - when: otherwise
      value: P('materials_copay')
    baseline:
      b_mc: P('materials_copay')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: exam_eyewear_lens_credit
    effect: parameter
    decides: b_ex
    bindings:
    - b_exs
    - b_xea
    - b_xeb
    - b_xead
    - b_xebd
    - b_xed
    - b_xei
    - b_xe
    - b_ex
    ladder:
    - when: a paid routine eye exam of the enrollment on the order date under the same provider agreement
      value: K('lens_exam_link_same')
    - when: >-
        otherwise, the latest paid or reimbursed routine eye exam dated on or before the order and less than twelve
        whole calendar months before it
      value: K('lens_exam_link_prior')
    - when: otherwise
      value: '0.00'
    baseline:
      b_ex: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      An eyeglasses order is the spectacle-lens line, the frame line or both of one claim of the enrollment (a routine
      exam line of the claim belongs to the exam visit, and contact lenses and their fitting to the contact-lens
      order); the order decided is the claim of the latest received spectacle-lens line that carries no remark yet
      at a participating independent practice, or, when none does, at a participating retail-chain location, or,
      when none does, of the latest received frame line that carries no remark yet at a participating independent
      practice, or, when none does, at a participating retail-chain location, or, when none does, of the latest
      received spectacle-lens line, and then frame line, that stands denied as not eligible at any location, an
      out-of-network order already filed by the member and denied for eligibility being reprocessed the same way.
      The order's date of service, received date, network channel and provider agreement are those of its lines,
      each line's charge is its retail charge, the lens line's lens type and lens options are read from it, and
      the patient's age is counted in whole years from the enrollee's date of birth to the date of service. An eyeglasses
      order is settled under the materials benefit only when the enrollment is active or terminated and the date
      of service is on or after its coverage_effective_date and on or before its termination_date when it has one;
      otherwise its lines are denied DENIED_NOT_ELIGIBLE and the member pays the whole retail charge. A lens line
      on a plan whose lens_benefit_included is false, or a frame line on a plan whose frame_benefit_included is
      false, is denied DENIED_NOT_COVERED: at a participating location it is bought at materials_discount_pct percent
      off its retail charge, and out of network nothing is reimbursed. Each line is settled under its benefit only
      when that benefit is available again (lens_frequency_months, or child_lens_frequency_months for a patient
      under child_age_limit_years, for the lenses; frame_frequency_months for the frame): the benefit of a kind
      is available again unless the latest service of that kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT
      blocks it: under frequency_basis benefit_year a frequency of twelve months is blocked by a latest service
      in the same benefit period and a frequency of twenty-four months by one in the same or the preceding benefit
      period (a latest service in a later benefit period blocks nothing), while under frequency_basis months_from_last_service
      it is blocked when fewer than the stated number of whole calendar months (a month being complete on the same
      day number) separate the two dates in either direction; when that latest service is the only paid or reimbursed
      service of its kind on its date and has been reversed, nothing blocks the benefit, while of several on that
      date a reversal of one leaves the benefit blocked; a line whose benefit is blocked is denied DENIED_FREQUENCY,
      bought at materials_discount_pct percent off its retail charge at a participating location and not reimbursed
      out of network. Contacts-in-lieu: when any contact-lens service of the same person counts in the benefit period
      of the order (a service of the other kind counts when it is the latest service of its kind of the enrollment
      that stands PAID or PAID_OON_REIMBURSEMENT (spectacle lenses, frames and contact lenses each being a kind
      of their own; when that latest one is the only such service on its date and has been reversed, there is taken
      to be none of that kind and no earlier one is looked at, while of several such services on that date a reversal
      of one leaves that date standing) and its date of service falls in the same benefit period as the service
      settled, whatever its order against it; a benefit period is the twelve-month period that starts each year
      on the enrollment's benefit_period_start_mmdd, and a latest service dated in another benefit period counts
      nothing), the order's lens and frame lines are denied DENIED_CONTACTS_IN_LIEU, bought at materials_discount_pct
      percent off their retail charges at a participating location and not reimbursed out of network. Under the
      materials benefit at a participating location the lens line costs the member the materials copay materials_copay
      plus the single-vision lens copay lens_copay_single_vision, polycarbonate costing nothing for a patient under
      child_age_limit_years when child_polycarbonate_covered is true and option_copay_polycarbonate_adult otherwise,
      plus the plan copay of each ordered uv_coating or scratch_coating; the frame line receives frame_allowance_private_practice
      at an independent practice or frame_allowance_retail_chain at a retail-chain location, and the member pays
      the part of its retail charge above the allowance, less frame_overage_discount_pct percent of that part at
      an independent practice only, plus the materials copay when the order carries no lens line. Out of network
      the member pays each receipt less the lesser of the receipt and its out-of-network amount (the lens amount
      for the lens type, progressive lenses of either kind using oon_progressive_reimbursement, and oon_frame_reimbursement),
      with no copay and no option reimbursed. The member share of an eyeglasses order is worked out in this order:
      first the lens line's materials copay, lens-type copay and every option copay that applies are added into
      one copay total and every lens credit that applies is taken off it, never below 0.00; then the frame line's
      share is added; a line denied for frequency, contacts-in-lieu or lack of a benefit counts at its discounted
      retail charge instead. The member share is booked on the order's first line and rounded half up to the cent
      once, at the end.
    params:
    - materials_copay
    - lens_copay_single_vision
    - frame_allowance_private_practice
    - frame_overage_discount_pct
    - materials_discount_pct
    - timely_filing_days_in_network
