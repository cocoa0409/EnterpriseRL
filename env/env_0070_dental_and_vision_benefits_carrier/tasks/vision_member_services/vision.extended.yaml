    a_rec: >-
      An exam visit is paid under the exam benefit only when the enrollment is active or terminated and the date
      of service is on or after its coverage_effective_date and on or before its termination_date when it has one;
      otherwise its lines are denied DENIED_NOT_ELIGIBLE and nothing is paid.
    a_cop: >-
      The exam copay follows the patient and channel: none out of network, exam_copay times child_copay_ratio for
      a patient under child_age_limit_years at a participating location, and exam_copay for everyone else.
    a_lim: >-
      Whether an exam visit is paid under the exam benefit is decided in this order: when its claim reached Cascade
      more than the filing limit (timely_filing_days_in_network at a participating location, timely_filing_days_oon
      out of network) calendar days after the date of service, nothing is paid for the visit (DENIED_TIMELY_FILING);
      otherwise, when the enrollment still stands applied and the latest binder payment the funding billing account
      received (its latest payment with payment purpose binder) was not returned, is for at least the plan unit's
      monthly premium for its coverage tier and was received on or before the binder deadline (the coverage_effective_date
      plus binder_deadline_days calendar days, a payment on the deadline day being in time), a service dated on
      or after the coverage_effective_date is paid under the exam benefit, coverage having started retroactively
      on that date; in every other case the enrollment's own status and dates decide.
    a_xok: >-
      The routine eye exam line is paid only when the exam benefit is available again (the benefit of a kind is
      available again unless the latest service of that kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT
      blocks it: under frequency_basis benefit_year a frequency of twelve months is blocked by a latest service
      in the same benefit period and a frequency of twenty-four months by one in the same or the preceding benefit
      period (a latest service in a later benefit period blocks nothing), while under frequency_basis months_from_last_service
      it is blocked when fewer than the stated number of whole calendar months (a month being complete on the same
      day number) separate the two dates in either direction; when that latest service is the only paid or reimbursed
      service of its kind on its date and has been reversed, nothing blocks the benefit, while of several on that
      date a reversal of one leaves the benefit blocked); an exam line whose benefit is blocked is denied DENIED_FREQUENCY
      and nothing is paid for it; a contact-lens fitting line is not limited separately.
    a_fee: >-
      The scheduled exam fee follows the visit's network channel: exam_fee_chain at a participating retail-chain
      location, the out-of-network exam amount oon_exam_reimbursement out of network, and exam_fee_private at a
      participating independent practice.
    a_npr: >-
      A new-patient fee ratio applies when the latest routine eye exam of the patient under the same provider agreement
      that stands PAID or PAID_OON_REIMBURSEMENT (when that latest one is the only such service on its date and
      has been reversed, there is taken to be none and no earlier one is looked at, while of several such services
      on that date a reversal of one leaves that date standing) is not dated on or before the visit and less than
      thirty-six whole calendar months before it: new_patient_ratio_private at an independent practice and new_patient_ratio_chain
      at a retail-chain location; an established patient, and every out-of-network visit, keeps a ratio of 1.
    a_peds: >-
      A pediatric fee ratio applies to a patient under child_age_limit_years on the date of service: peds_ratio_private
      at an independent practice and peds_ratio_chain at a retail-chain location; everyone else, and every out-of-network
      visit, keeps a ratio of 1.
    a_ffee: >-
      The scheduled fee of the visit's contact-lens fitting follows the visit's lines: fit_fee_specialty when the
      routine exam comes with a specialty contact-lens fitting line, fit_fee_standard when it comes with a standard
      contact-lens fitting line, and no fitting fee (0.00) when the visit is a routine exam without a fitting line.
    result: >-
      Out of network the visit's fitting line, whatever its kind, is reimbursed at the lesser of its receipt and
      oon_exam_reimbursement. The plan's payment for an exam visit is worked out in this order: first the exam line's
      scheduled exam fee is multiplied once by the product of every fee ratio that applies, the lesser of the exam
      line's billed charge and that amount is taken and the exam copay is subtracted, never below 0.00; then the
      fitting line's lesser of its billed charge and its scheduled fitting fee is added, an out-of-network fitting
      line taking its out-of-network amount instead. The payment is booked on the visit's first paid line and is
      rounded half up to the cent once, at the end.
