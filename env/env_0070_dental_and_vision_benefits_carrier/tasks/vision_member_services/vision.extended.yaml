      when none does, of the latest received frame line that carries no remark yet at a participating independent
      practice, or, when none does, at a participating retail-chain location, or, when none does, of the latest
      received spectacle-lens line, and then frame line, that stands denied as not eligible at any location, an
      out-of-network order already filed by the member and denied for eligibility being reprocessed the same way.
      The order's date of service, received date, network channel and provider agreement are those of its lines,
      each line's charge is its retail charge, the lens line's lens type and lens options are read from it, and
      the patient's age is counted in whole years from the enrollee's date of birth to the date of service.
