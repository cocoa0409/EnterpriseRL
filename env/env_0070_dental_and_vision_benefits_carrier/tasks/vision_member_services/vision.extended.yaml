    b_lim: >-
      Whether an eyeglasses order is settled under the materials benefit is decided in this order: when its claim
      reached Cascade more than the filing limit (timely_filing_days_in_network at a participating location, timely_filing_days_oon
      out of network) calendar days after the date of service, the member owes nothing for it at a participating
      location and keeps the whole receipt out of network (DENIED_TIMELY_FILING); otherwise, when the enrollment
      still stands applied and the latest binder payment the funding billing account received (its latest payment
      with payment purpose binder) was not returned, is for at least the plan unit's monthly premium for its coverage
      tier and was received on or before the binder deadline (the coverage_effective_date plus binder_deadline_days
      calendar days, a payment on the deadline day being in time), a service dated on or after the coverage_effective_date
      is settled under the materials benefit, coverage having started retroactively on that date; in every other
      case the enrollment's own status and dates decide.
    b_lok: >-
      Each line is settled under its benefit only when that benefit is available again (lens_frequency_months, or
      child_lens_frequency_months for a patient under child_age_limit_years, for the lenses; frame_frequency_months
      for the frame): the benefit of a kind is available again unless the latest service of that kind of the enrollment
      that stands PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency of twelve
      months is blocked by a latest service in the same benefit period and a frequency of twenty-four months by
      one in the same or the preceding benefit period (a latest service in a later benefit period blocks nothing),
      while under frequency_basis months_from_last_service it is blocked when fewer than the stated number of whole
      calendar months (a month being complete on the same day number) separate the two dates in either direction;
      when that latest service is the only paid or reimbursed service of its kind on its date and has been reversed,
      nothing blocks the benefit, while of several on that date a reversal of one leaves the benefit blocked; a
      line whose benefit is blocked is denied DENIED_FREQUENCY, bought at materials_discount_pct percent off its
      retail charge at a participating location and not reimbursed out of network.
    b_fok: >-
      Each line is settled under its benefit only when that benefit is available again (lens_frequency_months, or
      child_lens_frequency_months for a patient under child_age_limit_years, for the lenses; frame_frequency_months
      for the frame): the benefit of a kind is available again unless the latest service of that kind of the enrollment
      that stands PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency of twelve
      months is blocked by a latest service in the same benefit period and a frequency of twenty-four months by
      one in the same or the preceding benefit period (a latest service in a later benefit period blocks nothing),
      while under frequency_basis months_from_last_service it is blocked when fewer than the stated number of whole
      calendar months (a month being complete on the same day number) separate the two dates in either direction;
      when that latest service is the only paid or reimbursed service of its kind on its date and has been reversed,
      nothing blocks the benefit, while of several on that date a reversal of one leaves the benefit blocked; a
      line whose benefit is blocked is denied DENIED_FREQUENCY, bought at materials_discount_pct percent off its
      retail charge at a participating location and not reimbursed out of network.
    b_lieu: >-
      Contacts-in-lieu: when any contact-lens service of the same person counts in the benefit period of the order
      (a service of the other kind counts when it is the latest service of its kind of the enrollment that stands
      PAID or PAID_OON_REIMBURSEMENT (spectacle lenses, frames and contact lenses each being a kind of their own;
      when that latest one is the only such service on its date and has been reversed, there is taken to be none
      of that kind and no earlier one is looked at, while of several such services on that date a reversal of one
      leaves that date standing) and its date of service falls in the same benefit period as the service settled,
      whatever its order against it; a benefit period is the twelve-month period that starts each year on the enrollment's
      benefit_period_start_mmdd, and a latest service dated in another benefit period counts nothing), the order's
      lens and frame lines are denied DENIED_CONTACTS_IN_LIEU, bought at materials_discount_pct percent off their
      retail charges at a participating location and not reimbursed out of network.
    b_other: >-
      Under the materials benefit at a participating location the lens line costs the member the materials copay
      materials_copay plus the single-vision lens copay lens_copay_single_vision, polycarbonate costing nothing
      for a patient under child_age_limit_years when child_polycarbonate_covered is true and option_copay_polycarbonate_adult
      otherwise, plus the plan copay of each ordered uv_coating or scratch_coating; the frame line receives frame_allowance_private_practice
      at an independent practice or frame_allowance_retail_chain at a retail-chain location, and the member pays
      the part of its retail charge above the allowance, less frame_overage_discount_pct percent of that part at
      an independent practice only, plus the materials copay when the order carries no lens line. Out of network
      the member pays each receipt less the lesser of the receipt and its out-of-network amount (the lens amount
      for the lens type, progressive lenses of either kind using oon_progressive_reimbursement, and oon_frame_reimbursement),
      with no copay and no option reimbursed.
