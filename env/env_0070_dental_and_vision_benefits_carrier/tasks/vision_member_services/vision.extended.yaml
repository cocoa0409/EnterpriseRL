  overwrite:
  - base_policy: vision_evt_oon_reimbursement
    superseded_clause: >-
      A service from a provider without a Cascade Vision Network Provider Agreement in force on the date of service
      is paid to the member as a reimbursement of the lesser of the member's paid receipt (retail_charge) and the
      plan's out-of-network amount for the service: oon_exam_reimbursement, oon_frame_reimbursement, the lens amount
      for the lens_type (progressive lenses of either kind use oon_progressive_reimbursement), oon_contacts_elective_reimbursement
      or oon_contacts_medically_necessary_reimbursement.
    replaced_by: >-
      For out-of-network claims settled on their glasses part this rule sets the lens, frame and fitting amounts
      and the in-lieu settlement stated here, and only for such claims; an out-of-network claim settled on its contact-lens
      part is settled by the contact-lens claim rule, and every other out-of-network service remains under the general
      out-of-network reimbursement rule.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Under frequency_basis months_from_last_service the benefit is available again on the date that is the stated
      number of calendar months after the last paid date of service of the same kind (vision_msr_last_paid_service),
      the last day of the month being used when that day does not exist; under benefit_year a 12-month frequency
      allows one service per benefit period and a 24-month frequency one service per two consecutive benefit periods
      starting with the period of the last paid service.
    replaced_by: >-
      For out-of-network claims settled on their glasses part this rule counts frequency as stated in its frequency
      sentence (from the latest paid or reimbursed service of the kind of the current enrollment, a reversal counting
      only when it reverses the one service on that latest date, and a service requested before its benefit is available
      again settled as that sentence says), and only for out-of-network claims settled on their glasses part; the
      sibling rules for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on their
      contact-lens part; stand-alone contact-lens fittings count it the same way, and services paid by another carrier
      still do not count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      When contacts_in_lieu_of_glasses is true an elective contact-lens benefit uses both the lens and the frame
      benefit for their frequency periods, and lenses or a frame ordered while that benefit is used are denied DENIED_CONTACTS_IN_LIEU;
      medically necessary contacts are counted the same way.
    replaced_by: >-
      For out-of-network claims settled on their glasses part this rule applies contacts-in-lieu as stated in its
      in-lieu sentence (reading the latest paid or reimbursed service of each kind of the other side and counting
      it only when it is dated in the same benefit period, whatever its order, a reversed latest service counting
      as that sentence states), and only for out-of-network claims settled on their glasses part; the sibling rules
      for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on their contact-lens
      part; stand-alone contact-lens fittings apply it the same way.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      A service requested before its benefit is available again is denied DENIED_FREQUENCY and may be bought at
      materials_discount_pct off retail; a reversed service does not count.
    replaced_by: >-
      For out-of-network claims settled on their glasses part this rule counts frequency as stated in its frequency
      sentence (from the latest paid or reimbursed service of the kind of the current enrollment, a reversal counting
      only when it reverses the one service on that latest date, and a service requested before its benefit is available
      again settled as that sentence says), and only for out-of-network claims settled on their glasses part; the
      sibling rules for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on their
      contact-lens part; stand-alone contact-lens fittings count it the same way, and services paid by another carrier
      still do not count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Services of a person under an earlier Cascade vision enrollment count; services paid by another carrier do
      not.
    replaced_by: >-
      For out-of-network claims settled on their glasses part this rule counts frequency as stated in its frequency
      sentence (from the latest paid or reimbursed service of the kind of the current enrollment, a reversal counting
      only when it reverses the one service on that latest date, and a service requested before its benefit is available
      again settled as that sentence says), and only for out-of-network claims settled on their glasses part; the
      sibling rules for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on their
      contact-lens part; stand-alone contact-lens fittings count it the same way, and services paid by another carrier
      still do not count.
  trigger: on_request
  subject:
  - vision_exam_claim
  - vision_lens_claim
  - vision_frame_claim
  - vision_contacts_claim
  computes: plan_paid
  target_tool: file_oon_eyeglass_claim_2513bc70
  params:
    oon_child_frame_reimbursement: 90.0
    oon_fit_specialty_reimbursement: 100.0
    oon_fit_standard_reimbursement: 30.0
  rule: >-
    A member's new out-of-network claim is one claim number of the enrollment whose lines are at providers without
    a Cascade agreement and carry no remark yet, the latest received such claim first; which rule settles it is
    fixed by its receipts alone, whatever either rule's amounts: when the retail charges of its spectacle-lens and
    frame lines together are at least the retail charges of its contact-lens and contact-lens fitting lines together,
    it is settled on its glasses part under the glasses claim rule, and otherwise it is settled on its contact-lens
    part under the contact-lens claim rule. The claim's date of service and received date are those of its lines,
    each line's receipt is its retail charge, and the patient's age is counted in whole years from the enrollee's
    date of birth to the date of service. Whether an out-of-network claim settled on its glasses part is reimbursed
    is decided in this order: when its claim reached Cascade more than timely_filing_days_oon calendar days after
    the date of service, nothing on the claim is reimbursed (DENIED_TIMELY_FILING); otherwise, when the enrollment
    still stands applied and the latest binder payment the funding billing account received (its latest payment
    with payment purpose binder) was not returned, is for at least the plan unit's monthly premium for its coverage
    tier and was received on or before the binder deadline (the coverage_effective_date plus binder_deadline_days
    calendar days, a payment on the deadline day being in time), a service dated on or after the coverage_effective_date
    is reimbursed, coverage having started retroactively on that date; in every other case the enrollment's own
    status and dates decide. An out-of-network claim settled on its glasses part is reimbursed only when the enrollment
    is active or terminated and the date of service is on or after its coverage_effective_date and on or before
    its termination_date when it has one; otherwise its lines are denied DENIED_NOT_ELIGIBLE and nothing is reimbursed.
    On an out-of-network claim settled on its glasses part, a lens line of a plan whose lens_benefit_included is
    false and a contact-lens or fitting line of a plan whose contacts_benefit_included is false, or whose contacts_medically_necessary_in_network
    is not_covered, are denied DENIED_NOT_COVERED and nothing is reimbursed for them. Each line of an out-of-network
    claim settled on its glasses part other than the fitting is reimbursed only when the benefit of its kind is
    available again (exam_frequency_months for a routine exam, lens_frequency_months or child_lens_frequency_months
    for a patient under child_age_limit_years for the lenses, frame_frequency_months for the frame, contacts_frequency_months
    for the contact lenses): the benefit of a kind is available again unless the latest service of that kind of
    the enrollment that stands PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency
    of twelve months is blocked by a latest service in the same benefit period and a frequency of twenty-four months
    by one in the same or the preceding benefit period (a latest service in a later benefit period blocks nothing),
    while under frequency_basis months_from_last_service it is blocked when fewer than the stated number of whole
    calendar months (a month being complete on the same day number) separate the two dates in either direction;
    when that latest service is the only paid or reimbursed service of its kind on its date and has been reversed,
    nothing blocks the benefit, while of several on that date a reversal of one leaves the benefit blocked; a line
    whose benefit is blocked is denied DENIED_FREQUENCY and nothing is reimbursed for it; the fitting is not limited
    separately. Each reimbursed line of an out-of-network claim settled on its glasses part receives the lesser
    of its receipt and its out-of-network amount: oon_exam_reimbursement for a routine exam and for a fitting, oon_single_vision_reimbursement
    for the lenses, oon_frame_reimbursement for the frame, oon_contacts_medically_necessary_reimbursement for contact
    lenses the provider certified as medically necessary and oon_contacts_elective_reimbursement for elective ones;
    copays are never deducted, lens options are never reimbursed (oon_lens_options_reimbursed), and the claim's
