    are read from their lines. Whether a contact-lens order is settled under the contacts rules is decided in this
    order: when its claim reached Cascade more than the filing limit (timely_filing_days_in_network at a participating
    location, timely_filing_days_oon out of network) calendar days after the date of service, the member owes nothing
    for it at a participating location and keeps the whole receipt out of network (DENIED_TIMELY_FILING); otherwise,
    when the enrollment still stands applied and the latest binder payment the funding billing account received
    (its latest payment with payment purpose binder) was not returned, is for at least the plan unit's monthly premium
    for its coverage tier and was received on or before the binder deadline (the coverage_effective_date plus binder_deadline_days
    calendar days, a payment on the deadline day being in time), a service dated on or after the coverage_effective_date
    is settled under the contacts rules, coverage having started retroactively on that date; in every other case
    the enrollment's own status and dates decide. A contact-lens order is settled under the contacts rules only
    when the enrollment is active or terminated and the date of service is on or after its coverage_effective_date
    and on or before its termination_date when it has one; otherwise its lines are denied DENIED_NOT_ELIGIBLE and
    the member pays the whole retail charge. On a plan whose contacts_benefit_included is false, or whose contacts_medically_necessary_in_network
    is not_covered, the contact-lens and fitting lines are denied DENIED_NOT_COVERED: at a participating location
    the contact lenses are bought at the outside-benefit discount rate off their retail charge and the fitting at
    materials_discount_pct percent off its charge, and out of network nothing is reimbursed. The contact-lens line
    is settled under the contacts benefit only when that benefit is available again (contacts_frequency_months):
    the benefit of a kind is available again unless the latest service of that kind of the enrollment that stands
    PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency of twelve months is
    blocked by a latest service in the same benefit period and a frequency of twenty-four months by one in the same
    or the preceding benefit period (a latest service in a later benefit period blocks nothing), while under frequency_basis
    months_from_last_service it is blocked when fewer than the stated number of whole calendar months (a month being
    complete on the same day number) separate the two dates in either direction; when that latest service is the
    only paid or reimbursed service of its kind on its date and has been reversed, nothing blocks the benefit, while
    of several on that date a reversal of one leaves the benefit blocked; a contact-lens line whose benefit is blocked
    is denied DENIED_FREQUENCY, bought at the outside-benefit discount rate off its retail charge at a participating
    location and not reimbursed out of network; a fitting is not limited separately. Elective contact lenses take
    the contacts allowance contacts_allowance_elective: at a participating location the member pays the materials
    copay materials_copay plus the part of the retail charge above the allowance, with no discount, and out of network
    the member pays the receipt less the lesser of the receipt and oon_contacts_elective_reimbursement. A fitting
    at a participating location receives the fitting allowance contact_fitting_specialty_allowance; the member pays
    the part of its billed charge above its fitting allowances, never below 0.00, but at most contact_fitting_standard_copay_max
    for a standard fitting; out of network the member pays the fitting's receipt less the lesser of the receipt
    and oon_exam_reimbursement, or the whole receipt when the order's contact lenses are not reimbursed. How the
    contact-lens line is settled depends on the person's glasses and the certified reason: when any spectacle-lens
    or frame service of the same person counts in the benefit period of the order (a service of the other kind counts
    when it is the latest service of its kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT (spectacle
    lenses, frames and contact lenses each being a kind of their own; when that latest one is the only such service
    on its date and has been reversed, there is taken to be none of that kind and no earlier one is looked at, while
    of several such services on that date a reversal of one leaves that date standing) and its date of service falls
    in the same benefit period as the service settled, whatever its order against it; a benefit period is the twelve-month
    period that starts each year on the enrollment's benefit_period_start_mmdd, and a latest service dated in another
    benefit period counts nothing), or when the order's own claim carries a spectacle-lens or frame line that carries
    no remark yet or stands denied as not eligible (the eyeglasses order of the same claim being settled first),
    the glasses hold the period's materials benefit and the contact lenses are bought outside the benefit with the
    remark DENIED_CONTACTS_IN_LIEU, at the retail charge less the outside-benefit discount rate at a participating
    location and at the whole receipt out of network; otherwise, when the provider certified the contact lenses
    as medically necessary, they are covered in full after the materials copay at a participating location and reimbursed
    up to oon_contacts_medically_necessary_reimbursement out of network; otherwise they take the contacts allowance
    as elective contact lenses. An additional-pair part is added to the outside-benefit discount rate at a participating
    location when the person's latest frame that stands PAID or PAID_OON_REIMBURSEMENT (when that latest one is
    the only such service on its date and has been reversed, there is taken to be none and no earlier one is looked
    at, while of several such services on that date a reversal of one leaves that date standing) is dated on or
    before the contact lenses and its frame frequency (frame_frequency_months, counted as in the frequency sentence)
    still runs on their date: addl_pair_pct_same when that frame came from the same provider agreement, addl_pair_pct_other
    when it came from any other provider, participating or not; otherwise no additional-pair part. The fitting allowance
    follows the contact lenses the fitting serves: the order's own contact-lens line when this same decision settles
    it under the contacts benefit (the plan has a contacts benefit, the contacts benefit is available again as the
    frequency sentence states, and no spectacle-lens or frame service counts in the order's benefit period as the
    in-lieu sentence states), and otherwise the latest contact-lens service of the enrollment that stands PAID or
    PAID_OON_REIMBURSEMENT (when that latest one is the only such service on its date and has been reversed, there
    is taken to be none and no earlier one is looked at, while of several such services on that date a reversal
    of one leaves that date standing), when it is dated no more than tie_window_days calendar days before or after
    the fitting: mn_fit_allowance when the provider certified those contact lenses as medically necessary, no fitting
    allowance when no such contact lenses are on record, and contact_fitting_specialty_allowance otherwise, that
    is when they are elective. A new-wearer fitting allowance is added when neither the latest standard contact-lens
    fitting nor the latest specialty contact-lens fitting of the patient under the same provider agreement that
    stands PAID or PAID_OON_REIMBURSEMENT (each kind read on its own; when that latest one is the only such service
    on its date and has been reversed, there is taken to be none of that kind and no earlier one is looked at, while
    of several such services on that date a reversal of one leaves that date standing) is dated before the fitting
    and less than thirty-six whole calendar months before it: new_fit_private at an independent practice and new_fit_chain
    at a retail-chain location; a returning wearer, and every out-of-network fitting, receives none. How the fitting
    line's member share is worked out depends on its kind and location: a specialty fitting at an independent practice
    is first priced at its contracted fee, the billed charge less premium_fit_discount_pct percent of it, and the
    member pays the part of that contracted fee above the combined fitting allowance, never below 0.00; a specialty
    fitting at a retail-chain location receives no fitting allowance and costs the member its contracted fee; every
    other fitting follows the fitting benefit as stated for its kind. Contact lenses bought outside the benefit
    at a participating location (on a plan without the benefit, blocked by frequency, or left out in lieu) are bought
    at their retail charge less the outside-benefit discount rate, which is materials_discount_pct percent. The
    member share of a contact-lens order is worked out in this order: first the contact-lens line's share is taken
    as its settlement states, every discount part that applies to it being added into one rate taken once off the
    retail charge; then every fitting allowance that applies is added into one combined fitting allowance and the
    fitting line's share is taken as the fitting sentences state; finally the two shares are added. The member share
    is booked on the order's first line and rounded half up to the cent once, at the end. The member share of a
    contact-lens order is fixed only after no spectacle-lens line of the same person dated in the same benefit period
    still stands denied as not eligible. A contact-lens order's member share is not worked out until no frame line
    of the person on an out-of-network claim dated before the order still awaits its first decision. For contact-lens
    orders this rule sets the fitting allowances, the fitting cost rule and the in-lieu settlement stated here,
    and only for contact-lens orders; a fitting of an exam visit is settled by the exam-visit rule, a stand-alone
    fitting by the stand-alone fitting rule, and every other service remains under the general in-network benefit
    rule. For contact-lens orders this rule counts frequency as stated in its frequency sentence (from the latest
    paid or reimbursed service of the kind of the current enrollment, a reversal counting only when it reverses
    the one service on that latest date, and a service requested before its benefit is available again settled as
    that sentence says), and only for contact-lens orders; the sibling rules for exam visits; eyeglasses orders;
    out-of-network claims settled on their glasses part; out-of-network claims settled on their contact-lens part;
    stand-alone contact-lens fittings count it the same way, and services paid by another carrier still do not count.
    For contact-lens orders this rule applies contacts-in-lieu as stated in its in-lieu sentence (reading the latest
    paid or reimbursed service of each kind of the other side and counting it only when it is dated in the same
    benefit period, whatever its order, a reversed latest service counting as that sentence states), and only for
    contact-lens orders; the sibling rules for exam visits; eyeglasses orders; out-of-network claims settled on
    their glasses part; out-of-network claims settled on their contact-lens part; stand-alone contact-lens fittings
    apply it the same way.
