    b_c0: >-
      An eyeglasses order is the spectacle-lens line, the frame line or both of one claim of the enrollment (a routine
      exam line of the claim belongs to the exam visit, and contact lenses and their fitting to the contact-lens
      order); the order decided is the claim of the latest received spectacle-lens line that carries no remark yet
