    g_cv: >-
      On an out-of-network claim settled on its glasses part, a lens line of a plan whose lens_benefit_included
      is false and a contact-lens or fitting line of a plan whose contacts_benefit_included is false, or whose contacts_medically_necessary_in_network
      is not_covered, are denied DENIED_NOT_COVERED and nothing is reimbursed for them.
    g_camt: >-
      Each reimbursed line of an out-of-network claim settled on its glasses part receives the lesser of its receipt
      and its out-of-network amount: oon_exam_reimbursement for a routine exam and for a fitting, oon_single_vision_reimbursement
      for the lenses, oon_frame_reimbursement for the frame, oon_contacts_medically_necessary_reimbursement for
      contact lenses the provider certified as medically necessary and oon_contacts_elective_reimbursement for elective
      ones; copays are never deducted, lens options are never reimbursed (oon_lens_options_reimbursed), and the
      claim's reimbursement is the sum of its reimbursed lines.
    g_lamt: >-
      On an out-of-network claim settled on its glasses part the lens amount follows the lens type: oon_progressive_reimbursement
      for standard or premium progressive lenses, oon_trifocal_reimbursement for lined trifocals, oon_bifocal_reimbursement
      for lined bifocals and oon_single_vision_reimbursement for single-vision lenses.
    g_famt: >-
      On an out-of-network claim settled on its glasses part the frame amount follows the plan and the patient:
      nothing on a plan whose frame_benefit_included is false, the children's out-of-network frame amount oon_child_frame_reimbursement
      for a patient under child_age_limit_years on the date of service, and oon_frame_reimbursement for everyone
      else.
    g_fit: >-
      On an out-of-network claim settled on its glasses part the fitting amount follows the claim's lines: oon_fit_specialty_reimbursement
      when the claim carries a specialty contact-lens fitting line, oon_fit_standard_reimbursement when it carries
      a standard contact-lens fitting line, and no fitting amount (0.00) when it carries no fitting line.
    g_lieu: >-
      Contacts-in-lieu settles the materials of an out-of-network claim settled on its glasses part in this order,
      a service of the other kind counting as stated here (a service of the other kind counts when it is the latest
      service of its kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT (spectacle lenses, frames
      and contact lenses each being a kind of their own; when that latest one is the only such service on its date
      and has been reversed, there is taken to be none of that kind and no earlier one is looked at, while of several
      such services on that date a reversal of one leaves that date standing) and its date of service falls in the
      same benefit period as the service settled, whatever its order against it; a benefit period is the twelve-month
      period that starts each year on the enrollment's benefit_period_start_mmdd, and a latest service dated in
      another benefit period counts nothing): when a spectacle-lens or frame service of the same person counts in
      the claim's benefit period, the claim's contact-lens line and its fitting line are not reimbursed; otherwise,
      when a contact-lens service of the same person counts there, the claim's spectacle-lens and frame lines are
      not reimbursed; otherwise, when the claim carries contact lenses and spectacle lenses or a frame, only the
      larger of the contact-lens part (the contact-lens line together with the fitting line) and the glasses part
      (the spectacle-lens and frame lines) is reimbursed, the glasses part on a tie; a line left out this way is
      denied DENIED_CONTACTS_IN_LIEU.
    result: >-
      A claim settled on its contact-lens part is not settled under this rule, which records nothing for it (0.00
      under this rule). A fitting line follows its claim's contact-lens line: when the contact-lens line receives
      no reimbursement (its benefit blocked by frequency or missing, its amount 0.00, or the line left out in lieu),
      the fitting line receives none either and carries the contact-lens line's remark; a fitting on a claim without
      contact lenses is reimbursed on its own. The reimbursement of an out-of-network claim settled on its glasses
      part is worked out in this order: first each line's amount is taken as the lesser of its receipt and its out-of-network
      amount, a line denied for frequency or lack of a benefit counting nothing; then contacts-in-lieu keeps or
      leaves out the contact-lens part and the glasses part; finally the routine exam line and the kept parts are
      added. The reimbursement is booked on the claim's first reimbursed line and rounded half up to the cent once,
      at the end.
    g_bid: >-
      Whether an out-of-network claim settled on its glasses part is reimbursed is decided in this order: when its
      claim reached Cascade more than timely_filing_days_oon calendar days after the date of service, nothing on
      the claim is reimbursed (DENIED_TIMELY_FILING); otherwise, when the enrollment still stands applied and the
      latest binder payment the funding billing account received (its latest payment with payment purpose binder)
      was not returned, is for at least the plan unit's monthly premium for its coverage tier and was received on
      or before the binder deadline (the coverage_effective_date plus binder_deadline_days calendar days, a payment
      on the deadline day being in time), a service dated on or after the coverage_effective_date is reimbursed,
      coverage having started retroactively on that date; in every other case the enrollment's own status and dates
      decide.
