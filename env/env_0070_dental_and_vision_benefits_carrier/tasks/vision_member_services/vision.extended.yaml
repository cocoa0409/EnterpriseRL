  factors:
  - id: eligibility_binder
    effect: method
    decides: a_mode
    bindings:
    - a_bid
    - a_bdate
    - a_bamt
    - a_bret
    - a_mode
    ladder:
    - when: the claim reached Cascade more than the filing limit in calendar days after the date of service
      method: 'denied DENIED_TIMELY_FILING: nothing paid'
    - when: >-
        otherwise, the enrollment stands applied, the funding account's latest binder payment, not returned, is
        for at least the plan unit premium and reached it on or before the binder deadline, and the service is dated
        on or after the coverage_effective_date
      method: paid under the exam benefit, coverage starting retroactively
    - when: otherwise (the enrollment's own status and dates decide)
      method: >-
        paid under the exam benefit only when the enrollment was active on the date of service, else denied DENIED_NOT_ELIGIBLE
        with nothing paid
    baseline:
      a_mode: '''record'''
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  - id: channel_exam_fee
    effect: parameter
    decides: a_fee
    bindings:
    - a_fee
    ladder:
    - when: a participating retail-chain location
      value: K('exam_fee_chain')
    - when: out of network
      value: P('oon_exam_reimbursement')
    - when: otherwise (a participating independent practice)
      value: K('exam_fee_private')
    baseline:
      a_fee: K('exam_fee_private')
    evidence:
    - history
    cross_difficulty: null
  - id: new_patient_ratio
    effect: parameter
    decides: a_npr
    bindings:
    - a_npa
    - a_npb
    - a_npad
    - a_npbd
    - a_npd
    - a_npi
    - a_np
    - a_npr
    ladder:
    - when: >-
        no paid routine exam under the same provider agreement within thirty-six whole months before, at an independent
        practice
      value: K('new_patient_ratio_private')
    - when: no such exam, at a retail-chain location
      value: K('new_patient_ratio_chain')
    - when: otherwise (an established patient, or out of network)
      value: '1'
    baseline:
      a_npr: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: pediatric_fee_ratio
    effect: parameter
    decides: a_peds
    bindings:
    - a_peds
    ladder:
    - when: a patient under child_age_limit_years at an independent practice
      value: K('peds_ratio_private')
    - when: a patient under child_age_limit_years at a retail-chain location
      value: K('peds_ratio_chain')
    - when: otherwise
      value: '1'
    baseline:
      a_peds: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: fitting_type_fee
    effect: parameter
    decides: a_ffee
    bindings:
    - a_ffee
    ladder:
    - when: a routine exam with a specialty contact-lens fitting line
      value: K('fit_fee_specialty')
    - when: a routine exam with a standard contact-lens fitting line
      value: K('fit_fee_standard')
    - when: a routine exam without a fitting line
      value: '0.00'
    baseline:
      a_ffee: K('exam_fee_private')
    evidence:
    - history
    cross_difficulty: null
  - id: exam_copay_band
    effect: parameter
    decides: a_cop
    bindings:
    - a_cop
    ladder:
    - when: out of network
      value: '0.00'
    - when: a participating location and a patient under child_age_limit_years
      value: P('exam_copay') * K('child_copay_ratio')
    - when: otherwise
      value: P('exam_copay')
    baseline:
      a_cop: P('exam_copay')
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      An exam visit is the routine eye exam line of one claim of the enrollment, together with the claim's contact-lens
      fitting line when the claim carries no contact-lens line (a fitting on a claim with contact lenses belongs
      to the contact-lens order, and spectacle lenses or a frame on the claim to the eyeglasses order); the visit
      decided is the claim of the latest received routine eye exam line that carries no remark yet at a participating
      independent practice, or, when none does, at a participating retail-chain location (participating meaning
      under a Cascade Vision Network Provider Agreement), or, when none does, the claim of the latest received routine
      eye exam line that stands denied as not eligible at any location, an out-of-network visit already filed by
      the member and denied for eligibility being reprocessed the same way. The visit's date of service, received
      date, network channel and provider agreement are those of its lines, the billed charge of each line is its
      retail charge, and the patient's age is counted in whole years from the enrollee's date of birth to the date
      of service. An exam visit is paid under the exam benefit only when the enrollment is active or terminated
      and the date of service is on or after its coverage_effective_date and on or before its termination_date when
      it has one; otherwise its lines are denied DENIED_NOT_ELIGIBLE and nothing is paid. The routine eye exam line
      is paid only when the exam benefit is available again (the benefit of a kind is available again unless the
      latest service of that kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT blocks it: under
      frequency_basis benefit_year a frequency of twelve months is blocked by a latest service in the same benefit
      period and a frequency of twenty-four months by one in the same or the preceding benefit period (a latest
      service in a later benefit period blocks nothing), while under frequency_basis months_from_last_service it
      is blocked when fewer than the stated number of whole calendar months (a month being complete on the same
      day number) separate the two dates in either direction; when that latest service is the only paid or reimbursed
      service of its kind on its date and has been reversed, nothing blocks the benefit, while of several on that
      date a reversal of one leaves the benefit blocked); an exam line whose benefit is blocked is denied DENIED_FREQUENCY
      and nothing is paid for it; a contact-lens fitting line is not limited separately. Under the exam benefit
      the scheduled exam fee is exam_fee_private, every fitting line is scheduled at that same exam fee, the exam
      copay is exam_copay, and the plan pays for each line the lesser of its billed charge and its scheduled fee,
      less the exam copay on the exam line. Out of network the visit's fitting line, whatever its kind, is reimbursed
      at the lesser of its receipt and oon_exam_reimbursement. The plan's payment for an exam visit is worked out
      in this order: first the exam line's scheduled exam fee is multiplied once by the product of every fee ratio
      that applies, the lesser of the exam line's billed charge and that amount is taken and the exam copay is subtracted,
      never below 0.00; then the fitting line's lesser of its billed charge and its scheduled fitting fee is added,
      an out-of-network fitting line taking its out-of-network amount instead. The payment is booked on the visit's
      first paid line and is rounded half up to the cent once, at the end.
    params:
    - exam_fee_private
    - exam_copay
    - oon_exam_reimbursement
    - exam_frequency_months
    - timely_filing_days_in_network
  inputs:
    history:
    - table: vision_claims
      aggregate: latest
      field: date_of_service
      filters:
        event_type: vision_exam_claim
    - &id002
      category: billing
      table: billing_transactions
      aggregate: latest
      field: txn_date
      filters:
        event_type: billing_payment_received
        payment_purpose: binder
    cross_category:
    - billing
- id: vision_ext_eyeglasses_order
  base_policy_refs:
  - vision_evt_frequency
  - vision_evt_in_network_benefits
  - vision_evt_oon_reimbursement
  - vision_evt_eligibility_timely_filing
  - vision_activation_binder
  overwrite:
  - base_policy: vision_evt_in_network_benefits
    superseded_clause: >-
      Spectacle lenses are covered after the materials copay plus the copay for their lens_type and each ordered
      lens option; polycarbonate is covered in full for a patient under child_age_limit_years when child_polycarbonate_covered
      is true.
    replaced_by: >-
      For eyeglasses orders this rule replaces the general lens-coverage sentence with the copays, credits and channel
      settlement stated here, and only for eyeglasses orders; contact lenses, exams and fittings remain under their
      own rules.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Under frequency_basis months_from_last_service the benefit is available again on the date that is the stated
      number of calendar months after the last paid date of service of the same kind (vision_msr_last_paid_service),
      the last day of the month being used when that day does not exist; under benefit_year a 12-month frequency
      allows one service per benefit period and a 24-month frequency one service per two consecutive benefit periods
      starting with the period of the last paid service.
    replaced_by: >-
      For eyeglasses orders this rule counts frequency as stated in its frequency sentence (from the latest paid
      or reimbursed service of the kind of the current enrollment, a reversal counting only when it reverses the
      one service on that latest date, and a service requested before its benefit is available again settled as
      that sentence says), and only for eyeglasses orders; the sibling rules for exam visits; contact-lens orders;
      out-of-network claims settled on their glasses part; out-of-network claims settled on their contact-lens part;
      stand-alone contact-lens fittings count it the same way, and services paid by another carrier still do not
      count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      When contacts_in_lieu_of_glasses is true an elective contact-lens benefit uses both the lens and the frame
      benefit for their frequency periods, and lenses or a frame ordered while that benefit is used are denied DENIED_CONTACTS_IN_LIEU;
      medically necessary contacts are counted the same way.
    replaced_by: >-
      For eyeglasses orders this rule applies contacts-in-lieu as stated in its in-lieu sentence (reading the latest
      paid or reimbursed service of each kind of the other side and counting it only when it is dated in the same
      benefit period, whatever its order, a reversed latest service counting as that sentence states), and only
      for eyeglasses orders; the sibling rules for exam visits; contact-lens orders; out-of-network claims settled
      on their glasses part; out-of-network claims settled on their contact-lens part; stand-alone contact-lens
      fittings apply it the same way.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      A service requested before its benefit is available again is denied DENIED_FREQUENCY and may be bought at
      materials_discount_pct off retail; a reversed service does not count.
    replaced_by: >-
      For eyeglasses orders this rule counts frequency as stated in its frequency sentence (from the latest paid
      or reimbursed service of the kind of the current enrollment, a reversal counting only when it reverses the
      one service on that latest date, and a service requested before its benefit is available again settled as
      that sentence says), and only for eyeglasses orders; the sibling rules for exam visits; contact-lens orders;
      out-of-network claims settled on their glasses part; out-of-network claims settled on their contact-lens part;
      stand-alone contact-lens fittings count it the same way, and services paid by another carrier still do not
      count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Services of a person under an earlier Cascade vision enrollment count; services paid by another carrier do
      not.
    replaced_by: >-
      For eyeglasses orders this rule counts frequency as stated in its frequency sentence (from the latest paid
      or reimbursed service of the kind of the current enrollment, a reversal counting only when it reverses the
      one service on that latest date, and a service requested before its benefit is available again settled as
      that sentence says), and only for eyeglasses orders; the sibling rules for exam visits; contact-lens orders;
      out-of-network claims settled on their glasses part; out-of-network claims settled on their contact-lens part;
      stand-alone contact-lens fittings count it the same way, and services paid by another carrier still do not
      count.
  trigger: state_due
  subject:
  - vision_lens_claim
  - vision_frame_claim
  computes: member_paid
  target_tool: decide_eyeglasses_order_e7a7f40f
  params:
    child_copay_ratio: 0.5
    lens_exam_link_same: 15.0
    lens_exam_link_prior: 8.0
  rule: >-
    An eyeglasses order is the spectacle-lens line, the frame line or both of one claim of the enrollment (a routine
    exam line of the claim belongs to the exam visit, and contact lenses and their fitting to the contact-lens order);
    the order decided is the claim of the latest received spectacle-lens line that carries no remark yet at a participating
    independent practice, or, when none does, at a participating retail-chain location, or, when none does, of the
    latest received frame line that carries no remark yet at a participating independent practice, or, when none
    does, at a participating retail-chain location, or, when none does, of the latest received spectacle-lens line,
    and then frame line, that stands denied as not eligible at any location, an out-of-network order already filed
    by the member and denied for eligibility being reprocessed the same way. The order's date of service, received
    date, network channel and provider agreement are those of its lines, each line's charge is its retail charge,
    the lens line's lens type and lens options are read from it, and the patient's age is counted in whole years
    from the enrollee's date of birth to the date of service. Whether an eyeglasses order is settled under the materials
    benefit is decided in this order: when its claim reached Cascade more than the filing limit (timely_filing_days_in_network
    at a participating location, timely_filing_days_oon out of network) calendar days after the date of service,
    the member owes nothing for it at a participating location and keeps the whole receipt out of network (DENIED_TIMELY_FILING);
    otherwise, when the enrollment still stands applied and the latest binder payment the funding billing account
    received (its latest payment with payment purpose binder) was not returned, is for at least the plan unit's
    monthly premium for its coverage tier and was received on or before the binder deadline (the coverage_effective_date
    plus binder_deadline_days calendar days, a payment on the deadline day being in time), a service dated on or
    after the coverage_effective_date is settled under the materials benefit, coverage having started retroactively
    on that date; in every other case the enrollment's own status and dates decide. An eyeglasses order is settled
    under the materials benefit only when the enrollment is active or terminated and the date of service is on or
    after its coverage_effective_date and on or before its termination_date when it has one; otherwise its lines
    are denied DENIED_NOT_ELIGIBLE and the member pays the whole retail charge. A lens line on a plan whose lens_benefit_included
    is false, or a frame line on a plan whose frame_benefit_included is false, is denied DENIED_NOT_COVERED: at
    a participating location it is bought at materials_discount_pct percent off its retail charge, and out of network
    nothing is reimbursed. Each line is settled under its benefit only when that benefit is available again (lens_frequency_months,
    or child_lens_frequency_months for a patient under child_age_limit_years, for the lenses; frame_frequency_months
    for the frame): the benefit of a kind is available again unless the latest service of that kind of the enrollment
    that stands PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency of twelve
    months is blocked by a latest service in the same benefit period and a frequency of twenty-four months by one
    in the same or the preceding benefit period (a latest service in a later benefit period blocks nothing), while
    under frequency_basis months_from_last_service it is blocked when fewer than the stated number of whole calendar
    months (a month being complete on the same day number) separate the two dates in either direction; when that
    latest service is the only paid or reimbursed service of its kind on its date and has been reversed, nothing
    blocks the benefit, while of several on that date a reversal of one leaves the benefit blocked; a line whose
    benefit is blocked is denied DENIED_FREQUENCY, bought at materials_discount_pct percent off its retail charge
    at a participating location and not reimbursed out of network. Contacts-in-lieu: when any contact-lens service
    of the same person counts in the benefit period of the order (a service of the other kind counts when it is
    the latest service of its kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT (spectacle lenses,
    frames and contact lenses each being a kind of their own; when that latest one is the only such service on its
    date and has been reversed, there is taken to be none of that kind and no earlier one is looked at, while of
    several such services on that date a reversal of one leaves that date standing) and its date of service falls
