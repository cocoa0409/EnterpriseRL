    c_cok: >-
      Each line of an out-of-network claim settled on its contact-lens part other than the fitting is reimbursed
      only when the benefit of its kind is available again (exam_frequency_months for a routine exam, lens_frequency_months
      or child_lens_frequency_months for a patient under child_age_limit_years for the lenses, frame_frequency_months
