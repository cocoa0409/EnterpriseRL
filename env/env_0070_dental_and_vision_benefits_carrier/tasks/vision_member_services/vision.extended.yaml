  rule: >-
    A stand-alone fitting is the contact-lens fitting line of a claim of the enrollment that carries neither a routine
    eye exam line nor a contact-lens line; the fitting looked at is the claim of the latest received specialty fitting
    line that carries no remark yet at a participating independent practice, or, when none does, at a participating
    retail-chain location, or, when none does, of the latest received standard fitting line that carries no remark
    yet at a participating independent practice, or, when none does, at a participating retail-chain location, or,
    when none does, of the latest received specialty fitting line, and then standard fitting line, that stands denied
    as not eligible at any location. Its date of service, received date, network channel, provider agreement, billed
    charge and fitting kind are read from that line. Whether a stand-alone fitting is settled under the fitting
    benefit is decided in this order: when its claim reached Cascade more than the filing limit (timely_filing_days_in_network
    at a participating location, timely_filing_days_oon out of network) calendar days after the date of service,
    the member owes nothing for it at a participating location and keeps the whole receipt out of network (DENIED_TIMELY_FILING);
    otherwise, when the enrollment still stands applied and the latest binder payment the funding billing account
    received (its latest payment with payment purpose binder) was not returned, is for at least the plan unit's
    monthly premium for its coverage tier and was received on or before the binder deadline (the coverage_effective_date
    plus binder_deadline_days calendar days, a payment on the deadline day being in time), a service dated on or
    after the coverage_effective_date is settled under the fitting benefit, coverage having started retroactively
    on that date; in every other case the enrollment's own status and dates decide. A stand-alone fitting is settled
    under the fitting benefit only when the enrollment is active or terminated and the date of service is on or
    after its coverage_effective_date and on or before its termination_date when it has one; otherwise its lines
    are denied DENIED_NOT_ELIGIBLE and the member pays the whole billed charge. On a plan whose contacts_benefit_included
    is false a stand-alone fitting, being part of the contacts benefit, is denied DENIED_NOT_COVERED: at a participating
    location it is bought at materials_discount_pct percent off its charge, and out of network nothing is reimbursed
    and the member pays the whole receipt. On a plan with a contacts benefit an out-of-network stand-alone fitting
    is reimbursed the lesser of its receipt and oon_exam_reimbursement, the member paying the rest of the receipt;
    a fitting is not limited by frequency separately. Under the fitting benefit a stand-alone specialty fitting
    receives the fitting allowance contact_fitting_specialty_allowance and the member pays the part of the billed
    charge above the fitting allowances, never below 0.00, while a stand-alone standard fitting costs the member
    that same part but at most contact_fitting_standard_copay_max. The stand-alone fitting allowance follows the
    contact lenses the fitting serves, namely the latest contact-lens service of the enrollment that stands PAID
    or PAID_OON_REIMBURSEMENT (when that latest one is the only such service on its date and has been reversed,
    there is taken to be none and no earlier one is looked at, while of several such services on that date a reversal
    of one leaves that date standing), when it is dated no more than tie_window_days calendar days before or after
    the fitting: mn_fit_allowance when the provider certified those contact lenses as medically necessary, no fitting
    allowance when no such contact lenses are on record, and contact_fitting_specialty_allowance otherwise, that
    is when they are elective. A new-wearer allowance is added to a stand-alone fitting when neither the latest
    standard contact-lens fitting nor the latest specialty contact-lens fitting of the patient under the same provider
    agreement that stands PAID or PAID_OON_REIMBURSEMENT (each kind read on its own; when that latest one is the
    only such service on its date and has been reversed, there is taken to be none of that kind and no earlier one
    is looked at, while of several such services on that date a reversal of one leaves that date standing) is dated
    before the fitting and less than thirty-six whole calendar months before it: new_fit_private at an independent
    practice and new_fit_chain at a retail-chain location; a returning wearer, and every out-of-network fitting,
    receives none. How the member share of a stand-alone fitting is worked out depends on its kind and location:
    a specialty fitting at an independent practice is first priced at its contracted fee, the billed charge less
    premium_fit_discount_pct percent of it, and the member pays the part of that contracted fee above the combined
    fitting allowance, never below 0.00; a specialty fitting at a retail-chain location receives no fitting allowance
    and costs the member its contracted fee; every other fitting follows the fitting benefit as stated for its kind.
    When the claim of the fitting looked at also carries a routine eye exam line or a contact-lens line, its fitting
    belongs to the exam visit or the contact-lens order and this rule settles nothing for it (a member share of
    0.00 under this rule). Every allowance that applies to a stand-alone fitting is added into one combined fitting
    allowance before the fitting's member share is taken as the sentences for its kind and location state, and the
    member share is rounded half up to the cent once, at the end. The member share of a stand-alone fitting is fixed
    only after no contact-lens line of the patient on an out-of-network claim dated within sixty calendar days of
    the fitting still awaits its first decision. For stand-alone fittings this rule sets the fitting allowances
    and the fitting cost rule stated here, and only for stand-alone fittings; a fitting of an exam visit is settled
    by the exam-visit rule, a fitting of a contact-lens order by the contact-lens order rule, and every other service
    remains under the general in-network benefit rule. For stand-alone contact-lens fittings this rule counts frequency
    as stated in its frequency sentence (from the latest paid or reimbursed service of the kind of the current enrollment,
    a reversal counting only when it reverses the one service on that latest date, and a service requested before
    its benefit is available again settled as that sentence says), and only for stand-alone contact-lens fittings;
    the sibling rules for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on
    their glasses part; out-of-network claims settled on their contact-lens part count it the same way, and services
    paid by another carrier still do not count. For stand-alone contact-lens fittings this rule applies contacts-in-lieu
    as stated in its in-lieu sentence (reading the latest paid or reimbursed service of each kind of the other side
    and counting it only when it is dated in the same benefit period, whatever its order, a reversed latest service
    counting as that sentence states), and only for stand-alone contact-lens fittings; the sibling rules for exam
    visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on their glasses part; out-of-network
    claims settled on their contact-lens part apply it the same way.
