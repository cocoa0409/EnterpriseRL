    g_fxa: >-
      Each line of an out-of-network claim settled on its glasses part other than the fitting is reimbursed only
      when the benefit of its kind is available again (exam_frequency_months for a routine exam, lens_frequency_months
      or child_lens_frequency_months for a patient under child_age_limit_years for the lenses, frame_frequency_months
      for the frame, contacts_frequency_months for the contact lenses): the benefit of a kind is available again
      unless the latest service of that kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT blocks
      it: under frequency_basis benefit_year a frequency of twelve months is blocked by a latest service in the
      same benefit period and a frequency of twenty-four months by one in the same or the preceding benefit period
      (a latest service in a later benefit period blocks nothing), while under frequency_basis months_from_last_service
      it is blocked when fewer than the stated number of whole calendar months (a month being complete on the same
      day number) separate the two dates in either direction; when that latest service is the only paid or reimbursed
      service of its kind on its date and has been reversed, nothing blocks the benefit, while of several on that
      date a reversal of one leaves the benefit blocked; a line whose benefit is blocked is denied DENIED_FREQUENCY
      and nothing is reimbursed for it; the fitting is not limited separately.
