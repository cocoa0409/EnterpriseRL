    k_wsa: >-
      A new-wearer fitting allowance is added when neither the latest standard contact-lens fitting nor the latest
      specialty contact-lens fitting of the patient under the same provider agreement that stands PAID or PAID_OON_REIMBURSEMENT
      (each kind read on its own; when that latest one is the only such service on its date and has been reversed,
      there is taken to be none of that kind and no earlier one is looked at, while of several such services on
      that date a reversal of one leaves that date standing) is dated before the fitting and less than thirty-six
      whole calendar months before it: new_fit_private at an independent practice and new_fit_chain at a retail-chain
      location; a returning wearer, and every out-of-network fitting, receives none.
