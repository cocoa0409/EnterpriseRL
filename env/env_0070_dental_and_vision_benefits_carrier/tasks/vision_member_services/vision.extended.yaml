    c_rec: >-
      An out-of-network claim settled on its contact-lens part is reimbursed only when the enrollment is active
      or terminated and the date of service is on or after its coverage_effective_date and on or before its termination_date
      when it has one; otherwise its lines are denied DENIED_NOT_ELIGIBLE and nothing is reimbursed.
    c_ltype: >-
      A member's new out-of-network claim is one claim number of the enrollment whose lines are at providers without
      a Cascade agreement and carry no remark yet, the latest received such claim first; which rule settles it is
      fixed by its receipts alone, whatever either rule's amounts: when the retail charges of its spectacle-lens
      and frame lines together are at least the retail charges of its contact-lens and contact-lens fitting lines
