    b_tc: >-
      The lens-type copay follows the lens type ordered: lens_copay_progressive_premium for premium progressive
      lenses, lens_copay_progressive_standard for standard progressive lenses, and the copay of the order's own
      lens type (single vision, lined bifocal or lined trifocal) for every other lens.
    b_ar: >-
      An anti-reflective copay is added when the lens options list an anti-reflective coating: option_copay_anti_reflective_premium
      for anti_reflective_premium, option_copay_anti_reflective_standard for anti_reflective_standard without the
      premium coating, and nothing when neither is listed.
    b_lc: >-
      A light-control copay is added when the lens options list a light-control treatment: option_copay_photochromic
      for photochromic, option_copay_tint for tint without photochromic, and nothing when neither is listed.
    b_mc: >-
      The materials copay of an eyeglasses order follows the patient and channel: none out of network, materials_copay
      times child_copay_ratio at a participating location for a patient under child_age_limit_years, and materials_copay
      for everyone else.
    b_exs: >-
      An exam-and-eyewear lens credit is taken off the lens line's copays: lens_exam_link_same when a routine eye
      exam of the enrollment on the order's date of service under the same provider agreement stands PAID; otherwise
      lens_exam_link_prior when the latest routine eye exam of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT
      (when that latest one is the only such service on its date and has been reversed, there is taken to be none
      and no earlier one is looked at, while of several such services on that date a reversal of one leaves that
      date standing) is dated on or before the order and less than twelve whole calendar months before it; otherwise
      no credit.
    b_ex: >-
      An exam-and-eyewear lens credit is taken off the lens line's copays: lens_exam_link_same when a routine eye
      exam of the enrollment on the order's date of service under the same provider agreement stands PAID; otherwise
      lens_exam_link_prior when the latest routine eye exam of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT
      (when that latest one is the only such service on its date and has been reversed, there is taken to be none
      and no earlier one is looked at, while of several such services on that date a reversal of one leaves that
      date standing) is dated on or before the order and less than twelve whole calendar months before it; otherwise
      no credit.
    result: >-
      The member share of an eyeglasses order is worked out in this order: first the lens line's materials copay,
      lens-type copay and every option copay that applies are added into one copay total and every lens credit that
      applies is taken off it, never below 0.00; then the frame line's share is added; a line denied for frequency,
      contacts-in-lieu or lack of a benefit counts at its discounted retail charge instead. The member share is
      booked on the order's first line and rounded half up to the cent once, at the end.
    b_bid: >-
      Whether an eyeglasses order is settled under the materials benefit is decided in this order: when its claim
      reached Cascade more than the filing limit (timely_filing_days_in_network at a participating location, timely_filing_days_oon
      out of network) calendar days after the date of service, the member owes nothing for it at a participating
      location and keeps the whole receipt out of network (DENIED_TIMELY_FILING); otherwise, when the enrollment
      still stands applied and the latest binder payment the funding billing account received (its latest payment
      with payment purpose binder) was not returned, is for at least the plan unit's monthly premium for its coverage
      tier and was received on or before the binder deadline (the coverage_effective_date plus binder_deadline_days
      calendar days, a payment on the deadline day being in time), a service dated on or after the coverage_effective_date
      is settled under the materials benefit, coverage having started retroactively on that date; in every other
      case the enrollment's own status and dates decide.
