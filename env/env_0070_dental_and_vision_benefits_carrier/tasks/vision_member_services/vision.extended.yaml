      are those of its lines, each line's charge is its retail charge, and the contact-lens reason and the fitting's
      exam type are read from their lines.
    k_lim: >-
      Whether a contact-lens order is settled under the contacts rules is decided in this order: when its claim
      reached Cascade more than the filing limit (timely_filing_days_in_network at a participating location, timely_filing_days_oon
      out of network) calendar days after the date of service, the member owes nothing for it at a participating
      location and keeps the whole receipt out of network (DENIED_TIMELY_FILING); otherwise, when the enrollment
      still stands applied and the latest binder payment the funding billing account received (its latest payment
      with payment purpose binder) was not returned, is for at least the plan unit's monthly premium for its coverage
      tier and was received on or before the binder deadline (the coverage_effective_date plus binder_deadline_days
      calendar days, a payment on the deadline day being in time), a service dated on or after the coverage_effective_date
      is settled under the contacts rules, coverage having started retroactively on that date; in every other case
      the enrollment's own status and dates decide.
    k_cover: >-
      On a plan whose contacts_benefit_included is false, or whose contacts_medically_necessary_in_network is not_covered,
      the contact-lens and fitting lines are denied DENIED_NOT_COVERED: at a participating location the contact
      lenses are bought at the outside-benefit discount rate off their retail charge and the fitting at materials_discount_pct
      percent off its charge, and out of network nothing is reimbursed.
    k_cok: >-
      The contact-lens line is settled under the contacts benefit only when that benefit is available again (contacts_frequency_months):
      the benefit of a kind is available again unless the latest service of that kind of the enrollment that stands
      PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency of twelve months
      is blocked by a latest service in the same benefit period and a frequency of twenty-four months by one in
      the same or the preceding benefit period (a latest service in a later benefit period blocks nothing), while
      under frequency_basis months_from_last_service it is blocked when fewer than the stated number of whole calendar
      months (a month being complete on the same day number) separate the two dates in either direction; when that
      latest service is the only paid or reimbursed service of its kind on its date and has been reversed, nothing
      blocks the benefit, while of several on that date a reversal of one leaves the benefit blocked; a contact-lens
      line whose benefit is blocked is denied DENIED_FREQUENCY, bought at the outside-benefit discount rate off
      its retail charge at a participating location and not reimbursed out of network; a fitting is not limited
      separately.
    k_basis: >-
      How the contact-lens line is settled depends on the person's glasses and the certified reason: when any spectacle-lens
      or frame service of the same person counts in the benefit period of the order (a service of the other kind
      counts when it is the latest service of its kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT
      (spectacle lenses, frames and contact lenses each being a kind of their own; when that latest one is the only
      such service on its date and has been reversed, there is taken to be none of that kind and no earlier one
      is looked at, while of several such services on that date a reversal of one leaves that date standing) and
      its date of service falls in the same benefit period as the service settled, whatever its order against it;
      a benefit period is the twelve-month period that starts each year on the enrollment's benefit_period_start_mmdd,
      and a latest service dated in another benefit period counts nothing), or when the order's own claim carries
      a spectacle-lens or frame line that carries no remark yet or stands denied as not eligible (the eyeglasses
      order of the same claim being settled first), the glasses hold the period's materials benefit and the contact
      lenses are bought outside the benefit with the remark DENIED_CONTACTS_IN_LIEU, at the retail charge less the
      outside-benefit discount rate at a participating location and at the whole receipt out of network; otherwise,
      when the provider certified the contact lenses as medically necessary, they are covered in full after the
      materials copay at a participating location and reimbursed up to oon_contacts_medically_necessary_reimbursement
      out of network; otherwise they take the contacts allowance as elective contact lenses.
    result: >-
      Contact lenses bought outside the benefit at a participating location (on a plan without the benefit, blocked
      by frequency, or left out in lieu) are bought at their retail charge less the outside-benefit discount rate,
      which is materials_discount_pct percent. The member share of a contact-lens order is worked out in this order:
      first the contact-lens line's share is taken as its settlement states, every discount part that applies to
      it being added into one rate taken once off the retail charge; then every fitting allowance that applies is
      added into one combined fitting allowance and the fitting line's share is taken as the fitting sentences state;
      finally the two shares are added. The member share is booked on the order's first line and rounded half up
      to the cent once, at the end.
