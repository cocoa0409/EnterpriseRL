    evidence:
    - history
    cross_difficulty: null
  - id: contacts_basis
    effect: parameter
    decides: c_camt
    bindings:
    - c_camt
    ladder:
    - when: >-
        a spectacle-lens or frame service of the same person counts in the benefit period of the claim (the contact-lens
        line is denied DENIED_CONTACTS_IN_LIEU and its fitting follows it)
      value: '0.00'
    - when: otherwise, the provider certified the contact lenses as medically necessary
      value: P('oon_contacts_medically_necessary_reimbursement')
    - when: otherwise (elective contact lenses)
      value: P('oon_contacts_elective_reimbursement')
    baseline:
