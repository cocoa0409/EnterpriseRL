  rule: >-
    A member's new out-of-network claim is one claim number of the enrollment whose lines are at providers without
    a Cascade agreement and carry no remark yet, the latest received such claim first; which rule settles it is
    fixed by its receipts alone, whatever either rule's amounts: when the retail charges of its spectacle-lens and
    frame lines together are at least the retail charges of its contact-lens and contact-lens fitting lines together,
    it is settled on its glasses part under the glasses claim rule, and otherwise it is settled on its contact-lens
    part under the contact-lens claim rule. The claim's date of service, received date and channel are those of
    its lines, each line's receipt is its retail charge, the contact-lens reason and the fitting's exam type are
    read from their lines, and the patient's age is counted in whole years from the enrollee's date of birth to
    the date of service. Whether an out-of-network claim settled on its contact-lens part is reimbursed is decided
    in this order: when its claim reached Cascade more than timely_filing_days_oon calendar days after the date
    of service, nothing on the claim is reimbursed (DENIED_TIMELY_FILING); otherwise, when the enrollment still
    stands applied and the latest binder payment the funding billing account received (its latest payment with payment
    purpose binder) was not returned, is for at least the plan unit's monthly premium for its coverage tier and
    was received on or before the binder deadline (the coverage_effective_date plus binder_deadline_days calendar
    days, a payment on the deadline day being in time), a service dated on or after the coverage_effective_date
    is reimbursed, coverage having started retroactively on that date; in every other case the enrollment's own
    status and dates decide. An out-of-network claim settled on its contact-lens part is reimbursed only when the
    enrollment is active or terminated and the date of service is on or after its coverage_effective_date and on
    or before its termination_date when it has one; otherwise its lines are denied DENIED_NOT_ELIGIBLE and nothing
    is reimbursed. On an out-of-network claim settled on its contact-lens part, a lens line of a plan whose lens_benefit_included
    is false and a contact-lens or fitting line of a plan whose contacts_benefit_included is false, or whose contacts_medically_necessary_in_network
    is not_covered, are denied DENIED_NOT_COVERED and nothing is reimbursed for them. Each line of an out-of-network
    claim settled on its contact-lens part other than the fitting is reimbursed only when the benefit of its kind
    is available again (exam_frequency_months for a routine exam, lens_frequency_months or child_lens_frequency_months
    for a patient under child_age_limit_years for the lenses, frame_frequency_months for the frame, contacts_frequency_months
    for the contact lenses): the benefit of a kind is available again unless the latest service of that kind of
    the enrollment that stands PAID or PAID_OON_REIMBURSEMENT blocks it: under frequency_basis benefit_year a frequency
    of twelve months is blocked by a latest service in the same benefit period and a frequency of twenty-four months
    by one in the same or the preceding benefit period (a latest service in a later benefit period blocks nothing),
    while under frequency_basis months_from_last_service it is blocked when fewer than the stated number of whole
    calendar months (a month being complete on the same day number) separate the two dates in either direction;
    when that latest service is the only paid or reimbursed service of its kind on its date and has been reversed,
    nothing blocks the benefit, while of several on that date a reversal of one leaves the benefit blocked; a line
    whose benefit is blocked is denied DENIED_FREQUENCY and nothing is reimbursed for it; the fitting is not limited
    separately. Each reimbursed line of an out-of-network claim settled on its contact-lens part receives the lesser
    of its receipt and its amount: oon_exam_reimbursement for a routine exam and for the fitting, oon_contacts_elective_reimbursement
    for the contact lenses, the lens amount for the lens type (oon_progressive_reimbursement for progressive lenses
    of either kind, oon_trifocal_reimbursement, oon_bifocal_reimbursement or oon_single_vision_reimbursement) and
    the frame amount for the frame; copays are never deducted, lens options are never reimbursed (oon_lens_options_reimbursed),
    and the claim's reimbursement is the sum of its reimbursed lines. On an out-of-network claim settled on its
    contact-lens part the frame amount follows the plan and the patient: nothing on a plan whose frame_benefit_included
    is false, the children's out-of-network frame amount oon_child_frame_reimbursement for a patient under child_age_limit_years
    on the date of service, and oon_frame_reimbursement for everyone else. On an out-of-network claim settled on
    its contact-lens part the fitting amount follows the claim's lines: oon_fit_specialty_reimbursement when the
    claim carries a specialty contact-lens fitting line, oon_fit_standard_reimbursement when it carries a standard
    contact-lens fitting line, and no fitting amount (0.00) when it carries no fitting line. On an out-of-network
    claim settled on its contact-lens part the contact-lens line is settled as follows, a service of the other kind
    counting as the in-lieu sentence states: when a spectacle-lens or frame service of the same person counts in
    the claim's benefit period, the contact-lens line and its fitting line are not reimbursed and are denied DENIED_CONTACTS_IN_LIEU;
    otherwise the contact-lens line receives oon_contacts_medically_necessary_reimbursement when the provider certified
    the contact lenses as medically necessary, and oon_contacts_elective_reimbursement when they are elective. Contacts-in-lieu
    settles the materials of an out-of-network claim settled on its contact-lens part in this order, a service of
    the other kind counting as stated here (a service of the other kind counts when it is the latest service of
    its kind of the enrollment that stands PAID or PAID_OON_REIMBURSEMENT (spectacle lenses, frames and contact
    lenses each being a kind of their own; when that latest one is the only such service on its date and has been
    reversed, there is taken to be none of that kind and no earlier one is looked at, while of several such services
    on that date a reversal of one leaves that date standing) and its date of service falls in the same benefit
    period as the service settled, whatever its order against it; a benefit period is the twelve-month period that
    starts each year on the enrollment's benefit_period_start_mmdd, and a latest service dated in another benefit
    period counts nothing): when a contact-lens service of the same person counts in the claim's benefit period,
    the claim's spectacle-lens and frame lines are not reimbursed; otherwise, when the claim carries contact lenses
    and spectacle lenses or a frame, only the larger of the contact-lens part (the contact-lens line together with
    the fitting line, as the contact-lens settlement leaves them) and the glasses part (the spectacle-lens and frame
    lines) is reimbursed, the glasses part on a tie; otherwise every line is reimbursed under its own amount; a
    line left out this way is denied DENIED_CONTACTS_IN_LIEU. A claim settled on its glasses part is not settled
    under this rule, which records nothing for it (0.00 under this rule). A fitting line follows its claim's contact-lens
    line: when the contact-lens line receives no reimbursement (its benefit blocked by frequency or missing, its
    amount 0.00, or the line left out in lieu), the fitting line receives none either and carries the contact-lens
    line's remark; a fitting on a claim without contact lenses is reimbursed on its own. The reimbursement of an
    out-of-network claim settled on its contact-lens part is worked out in this order: first each line's amount
    is taken as the lesser of its receipt and its amount, a line denied for frequency or lack of a benefit, or left
    outside the benefit by the contact-lens settlement, counting nothing; then contacts-in-lieu keeps or leaves
    out the contact-lens part and the glasses part; finally the routine exam line and the kept parts are added.
    The reimbursement is booked on the claim's first reimbursed line and rounded half up to the cent once, at the
    end. For out-of-network claims settled on their contact-lens part this rule sets the fitting, contact-lens and
    frame amounts and the in-lieu settlement stated here, and only for such claims; an out-of-network claim settled
    on its glasses part is settled by the glasses claim rule, and every other out-of-network service remains under
    the general out-of-network reimbursement rule. For out-of-network claims settled on their contact-lens part
    this rule counts frequency as stated in its frequency sentence (from the latest paid or reimbursed service of
    the kind of the current enrollment, a reversal counting only when it reverses the one service on that latest
    date, and a service requested before its benefit is available again settled as that sentence says), and only
    for out-of-network claims settled on their contact-lens part; the sibling rules for exam visits; eyeglasses
    orders; contact-lens orders; out-of-network claims settled on their glasses part; stand-alone contact-lens fittings
    count it the same way, and services paid by another carrier still do not count. For out-of-network claims settled
    on their contact-lens part this rule applies contacts-in-lieu as stated in its in-lieu sentence (reading the
    latest paid or reimbursed service of each kind of the other side and counting it only when it is dated in the
    same benefit period, whatever its order, a reversed latest service counting as that sentence states), and only
    for out-of-network claims settled on their contact-lens part; the sibling rules for exam visits; eyeglasses
    orders; contact-lens orders; out-of-network claims settled on their glasses part; stand-alone contact-lens fittings
    apply it the same way.
