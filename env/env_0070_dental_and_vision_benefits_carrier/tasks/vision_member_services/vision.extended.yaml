  overwrite:
  - base_policy: vision_evt_oon_reimbursement
    superseded_clause: >-
      A service from a provider without a Cascade Vision Network Provider Agreement in force on the date of service
      is paid to the member as a reimbursement of the lesser of the member's paid receipt (retail_charge) and the
      plan's out-of-network amount for the service: oon_exam_reimbursement, oon_frame_reimbursement, the lens amount
      for the lens_type (progressive lenses of either kind use oon_progressive_reimbursement), oon_contacts_elective_reimbursement
      or oon_contacts_medically_necessary_reimbursement.
    replaced_by: >-
      For out-of-network claims settled on their contact-lens part this rule sets the fitting, contact-lens and
      frame amounts and the in-lieu settlement stated here, and only for such claims; an out-of-network claim settled
      on its glasses part is settled by the glasses claim rule, and every other out-of-network service remains under
      the general out-of-network reimbursement rule.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Under frequency_basis months_from_last_service the benefit is available again on the date that is the stated
      number of calendar months after the last paid date of service of the same kind (vision_msr_last_paid_service),
      the last day of the month being used when that day does not exist; under benefit_year a 12-month frequency
      allows one service per benefit period and a 24-month frequency one service per two consecutive benefit periods
      starting with the period of the last paid service.
    replaced_by: >-
      For out-of-network claims settled on their contact-lens part this rule counts frequency as stated in its frequency
      sentence (from the latest paid or reimbursed service of the kind of the current enrollment, a reversal counting
      only when it reverses the one service on that latest date, and a service requested before its benefit is available
      again settled as that sentence says), and only for out-of-network claims settled on their contact-lens part;
      the sibling rules for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on
      their glasses part; stand-alone contact-lens fittings count it the same way, and services paid by another
      carrier still do not count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      When contacts_in_lieu_of_glasses is true an elective contact-lens benefit uses both the lens and the frame
      benefit for their frequency periods, and lenses or a frame ordered while that benefit is used are denied DENIED_CONTACTS_IN_LIEU;
      medically necessary contacts are counted the same way.
    replaced_by: >-
      For out-of-network claims settled on their contact-lens part this rule applies contacts-in-lieu as stated
      in its in-lieu sentence (reading the latest paid or reimbursed service of each kind of the other side and
      counting it only when it is dated in the same benefit period, whatever its order, a reversed latest service
      counting as that sentence states), and only for out-of-network claims settled on their contact-lens part;
      the sibling rules for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on
      their glasses part; stand-alone contact-lens fittings apply it the same way.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      A service requested before its benefit is available again is denied DENIED_FREQUENCY and may be bought at
      materials_discount_pct off retail; a reversed service does not count.
    replaced_by: >-
      For out-of-network claims settled on their contact-lens part this rule counts frequency as stated in its frequency
      sentence (from the latest paid or reimbursed service of the kind of the current enrollment, a reversal counting
      only when it reverses the one service on that latest date, and a service requested before its benefit is available
      again settled as that sentence says), and only for out-of-network claims settled on their contact-lens part;
      the sibling rules for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on
      their glasses part; stand-alone contact-lens fittings count it the same way, and services paid by another
      carrier still do not count.
  - base_policy: vision_evt_frequency
    superseded_clause: >-
      Services of a person under an earlier Cascade vision enrollment count; services paid by another carrier do
      not.
    replaced_by: >-
      For out-of-network claims settled on their contact-lens part this rule counts frequency as stated in its frequency
      sentence (from the latest paid or reimbursed service of the kind of the current enrollment, a reversal counting
      only when it reverses the one service on that latest date, and a service requested before its benefit is available
      again settled as that sentence says), and only for out-of-network claims settled on their contact-lens part;
      the sibling rules for exam visits; eyeglasses orders; contact-lens orders; out-of-network claims settled on
      their glasses part; stand-alone contact-lens fittings count it the same way, and services paid by another
      carrier still do not count.
