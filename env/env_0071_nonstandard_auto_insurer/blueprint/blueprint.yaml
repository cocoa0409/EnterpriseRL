name: env_0071_nonstandard_auto_insurer
company: Cardinal Point Insurance Company

background: |
  Cardinal Point Insurance Company is a Tampa-based nonstandard personal auto insurer with about 410,000 policies in force, sold through independent agents, its own phone center and its website in Florida, Virginia, Texas, Georgia, Arizona and Ohio.
  It insures the drivers standard carriers decline or surcharge heavily: drivers with recent violations, at-fault accidents or DUI convictions, drivers coming off a lapse in insurance, newly or foreign-licensed drivers, and drivers whose state demands proof of financial responsibility.
  Its policy service and claims desk answers calls about policies, bills, state filings and physical damage claims in a plain, patient and unhurried tone.
  The core contract is the Owner Auto Policy, written in six-month terms (twelve-month terms on the upper packages) on one of six liability packages: Cardinal Point Minimum Limits Liability, Cardinal Point 50/100/50 Liability, Cardinal Point 100/200/50 Liability, Cardinal Point 100/300/50 Liability, Cardinal Point 100/300/100 Liability and Cardinal Point 250/500/100 Liability.
  Each owner term is its own record, renewal terms keep the policy number, and every term books written, additional and return premium and fully earned fees, along with its driver and vehicle changes, named driver exclusions, notices of cancellation, Statements of No Loss and nonrenewal notices.
  Drivers who own no vehicle carry the Named Non-Owner Policy on the Cardinal Point Non-Owner Minimum Limits, Non-Owner Minimum Limits with UM, Non-Owner 50/100/50, Non-Owner 100/200/50, Non-Owner 100/300/50 or Non-Owner 250/500/100 package, booked term by term in the same way, with the insured's signed Non-Owner Statements on file.
  Every policy term is billed on its own installment payment plan, the Cardinal Point Paid-in-Full Plan, Two-Pay Plan, Four-Pay Plan, Six-Pay Direct Bill Plan, Monthly EFT Plan or Monthly Card Autopay Plan, whose ledger books premium posted from the policy, installment and other fees, payments, returned payments, credits, write-offs and refunds against its invoices.
  When a state requires proof of insurance, the company files and maintains an SR-22 Owner, Operator or Owner-Operator Certificate, or in Florida and Virginia an FR-44 Owner, Operator or Owner-Operator Certificate, each a filing record of its own with its fees, its copies and its notices to the state.
  Vehicles on an owner policy may carry comprehensive and collision coverage on one of six deductible packages, from Cardinal Point Physical Damage $2,500 Deductible down to Cardinal Point Physical Damage $250 Comprehensive / $500 Collision Deductible, and claims on it are booked as claim file entries and claim payments.
  Optional per-vehicle Cardinal Point Rental Reimbursement packages ($20/$600 through $60/$1,800) and Cardinal Point Towing and Labor packages ($50 through $200) attach to the same vehicles and book their own premium and benefit payments.
  Callers are mostly named insureds in their twenties to forties, many on minimum-limit or liability-only packages paid monthly, and a large share carry an SR-22 or FR-44 certificate.
  A typical caller holds one owner or non-owner term, its payment plan and often a filing, while some add physical damage, rental and towing on a financed vehicle.
  Their histories show late and returned payments, notices of cancellation, cancellations followed by reinstatement after a lapse, excluded household drivers, filings re-sent after a reinstatement, renewals paid at the last minute, and the occasional collision, glass or theft claim.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: installment_billing_and_fees
    claim:
      categories: [billing]
      event_types: [billing_payment_received, billing_agent_payment_fee, billing_installment_billed, billing_installment_fee, billing_late_fee,
                    billing_payment_returned, billing_nsf_fee, billing_fee_waived, billing_delinquency_cured, billing_certified_funds_flagged,
                    billing_due_date_changed, billing_plan_switched, billing_recurring_payment_authorized, billing_recurring_payment_revoked]
    summary: >
      Callers are named insureds paying, disputing or rearranging the bill of an owner or non-owner term: they want to make a payment by phone, ask why a late, NSF or agent-assisted fee appeared, want a fee taken off, report a returned check or failed draft, or want a different due day or plan, and their setting varies by plan (from the Cardinal Point Paid-in-Full Plan to the Monthly Card Autopay Plan), by plan status (current, past_due, final_billed), by how many payments have come back across all of their plans, and by whether the policy term behind the plan is in force, pending cancellation or cancelled.
      The records are the plan, its invoices with due dates and minimum due, its ledger of charges, payments, returns and waivers, its recurring authorizations, and the policy term it bills; the governing rules are the installment fee per plan (billing_installment_fee_rule), the late fee with its grace period and once-per-invoice limit (billing_late_fee_rule), courtesy and error waivers bounded per term (billing_fee_waivers), the NSF fee and returned-draft consequences (billing_returned_payments), the cross-plan certified-funds restriction (billing_agg_returned_payments), payment application order, channel fee and single-payment cap (billing_payment_posting), due day changes (billing_due_date_change) and plan switches that need a signed recurring authorization (billing_plan_switch), with the policy's own notice and reinstatement rules reading the plan's state.
      In the natural course of the domain an invoice is issued, comes due, is paid on time or late or returned, and the plan moves between current and past_due as amounts are cured, while the policy's notice of cancellation follows its own clock.
      Posting fees, waivers, due-day changes and plan switches are service actions of the agent once identity is verified, whereas authorizing a one-time card or bank payment and signing a recurring draft authorization are the customer's own acts on their own accounts.
      Requests no rule decides, such as refunding an NSF fee because the customer says the bank erred without any bank return code to support it, splitting one payment across two policies' plans, waiving installment fees as a courtesy, or settling a balance already with the collection agency, go to a human representative as POLICY_NOT_COVERED.
  - name: sr22_fr44_filings
    claim:
      categories: [fr]
      event_types: [fr_filing_requested, fr_filing_fee_assessed, fr_filing_fee_waived, fr_filing_accepted, fr_filing_rejected, fr_filing_corrected,
                    fr_filing_withdrawn, fr_sr26_transmitted, fr_certificate_copy_issued, fr_release_requested]
    summary: >
      Callers are drivers whose state has ordered proof of financial responsibility, or the named insureds whose policy certifies them: they need an SR-22 or FR-44 sent to Florida, Virginia, Texas, Georgia, Arizona or Ohio, ask why the state rejected a filing or suspended their license, want a copy of the certificate, want the filing released at the end of the requirement, or ask what happens to the filing after their policy cancelled or was reinstated, and the setting varies by certificate form and type, by filing status, by the status and package of the backing owner or non-owner term, by the filing state against the garaging state, and by whether the driver is rated or excluded on the backing policy.
      The records are the filing with its driver data, state case number, dates and required-through date, its fee ledger and documents, the backing policy term with its limits, status, closing and reinstatement dates, and the driver changes on an owner term; the governing rules are certificate selection and backing limits per certificate (fr_filing_eligibility), one open filing per driver and state (fr_agg_multi_holding), the per-certificate fee charged once per request and reversed only in defined cases (fr_filing_fee_rule), transmission and the rejection correction window (fr_transmission), the SR-26 timing and the no-revival rule after reinstatement (fr_sr26_notice, fr_agg_backing_term), certificate copies (fr_certificate_copies) and releases (fr_release_request).
      In the natural order of the domain a filing is requested on an open backing term, transmitted, accepted or rejected and corrected, and receives an SR-26 when the backing coverage ends, after which a reinstated term needs a new filing rather than a revived one.
      Requesting, correcting, retransmitting, withdrawing and sending SR-26 notices and copies are the agent's service actions, while the filer's personal data comes verbatim from the customer's license or state letter and a release can only be asked for by the named insured or the filed driver.
      Requests no rule decides, such as ending a requirement whose state order gives no end date, asking the company to tell the state a lapse never happened, or filing for a driver in a state the company does not serve, go to a human representative as POLICY_NOT_COVERED.
  - name: cancellation_reinstatement_and_exclusions
    claim:
      categories: [auto]
      event_types: [auto_cancellation_notice, auto_cancellation_pending, auto_cancellation_rescinded, auto_cancelled_nonpayment, auto_reinstated,
                    auto_no_loss_statement, auto_reinstatement_fee, auto_additional_premium, auto_return_premium, auto_fee_waived,
                    auto_cancelled_insured_request, auto_exclusion_form_signed, auto_driver_excluded, auto_driver_added]
    summary: >
      Callers are named insureds of Owner Auto Policy terms who received a notice of cancellation for nonpayment, whose policy already cancelled and who want it back, who want to cancel on their own, or who want a household member excluded or added back, and the setting varies by liability package, by term status (in_force, pending_cancellation, cancelled), by how and when the last payments posted on the term's plan, by how many lapse reinstatements the term already had, by whether an SR-22 or FR-44 rests on the term, and by who lives in the household.
      The records are the owner term with its notice, cancellation, reinstatement and lapse dates, its premium and fee ledger, its driver changes and signed forms, the billing plan's invoices and payments, and the filings it backs; the governing rules are the notice timing, threshold and state notice days (auto_nonpayment_notice), rescission on a timely minimum payment (auto_notice_rescission), cancellation on the effective date (auto_cancellation_nonpayment), reinstatement with or without lapse with its per-package window and count, Statement of No Loss and postmark rule (auto_reinstatement, auto_lapse_attestation), fees (auto_fees), insured cancellation with its per-package short-rate retention (auto_insured_cancellation), pro rata premium arithmetic (auto_unearned_premium_return, auto_premium_charging), and named driver exclusions with their per-package cap and filer restriction (auto_driver_exclusion, auto_agg_household_drivers).
      In the natural order of the domain an unpaid installment leads to a notice, a pending cancellation, then either rescission or cancellation, after which a reinstatement can only follow the payment and the insured's attestation, while exclusions follow a signed form.
      Issuing notices, processing rescissions, cancellations, reinstatements, premium and fee transactions and endorsing exclusions are agent service actions, whereas signing the Statement of No Loss, signing the Named Driver Exclusion form and confirming a cancellation request are the named insured's own acts.
      Requests no rule decides, such as reinstating a term cancelled for an underwriting reason, backdating coverage over a lapse in which an accident occurred, or excluding the named insured, go to a human representative as POLICY_NOT_COVERED.
  - name: physical_damage_claims
    claim:
      categories: [physdam]
      event_types: [physdam_claim_reported, physdam_coverage_confirmed, physdam_coverage_denied, physdam_estimate_recorded, physdam_total_loss_declared,
                    physdam_repair_payment, physdam_total_loss_payment, physdam_tow_storage_payment, physdam_deductible_reimbursement,
                    physdam_subrogation_recovery, physdam_inspection_approved, physdam_coverage_removed]
    summary: >
      Callers are named insureds reporting a collision, glass, weather, animal, theft or vandalism loss on a vehicle with comprehensive and collision coverage, asking whether it is covered, what the deductible is, when the repair or total loss check will come, or why a lienholder is being paid, and the setting varies by deductible package, coverage status and inspection state, by the garaging state, by who was driving and how that person stands on the owner term, by whether the date of loss falls in a lapse or outside the coverage period, and by the size of the estimate against the vehicle's value.
      The records are the coverage with its vehicle, loss payee and inspection dates, the claim file entries and payments, the owner term's status, lapse dates and driver changes, and any rental or towing coverage on the same vehicle; the governing rules are claim intake (physdam_claim_reporting, physdam_agg_multi_vehicle_loss), coverage decisions with their ordered denial reasons (physdam_coverage_decision), state total loss tests (physdam_valuation), per-package deductibles, windshield and glass-repair treatment, tax and title in total loss settlements and the theft waiting period (physdam_settlement), recoveries and proportional deductible reimbursement (physdam_recoveries), and the inspection and loss payee rules (physdam_inspection_rule, physdam_eligibility).
      In the natural order of the domain a loss is reported, coverage is decided, an estimate is written and supplemented, the vehicle is repaired or declared a total loss, payments go out and recoveries come back.
      Opening claims, recording decisions, estimates and payments and approving inspections are agent service actions, whereas the account of who was driving, where and what happened, and any police report number, come only from the caller.
      Requests no rule decides, such as paying diminished value, paying for personal belongings in the car, paying a late-reported claim that must first go to the special investigations unit, or reopening a denial the caller disputes, go to a human representative as POLICY_NOT_COVERED.
  - name: nonowner_policies_and_renewals
    claim:
      categories: [nonowner]
      event_types: [nonowner_new_business, nonowner_statement_signed, nonowner_renewal_issued, nonowner_renewal_accepted, nonowner_renewal_not_taken,
                    nonowner_premium_written, nonowner_policy_fee, nonowner_no_loss_statement, nonowner_cancelled_conversion, nonowner_return_premium,
                    nonowner_cancelled_insured_request, nonowner_nonrenewal_notice]
    summary: >
      Callers are drivers without a vehicle who need a Named Non-Owner Policy, usually to back an SR-22 or FR-44 Operator certificate, or existing non-owner insureds asking about their renewal, paying it late, switching to an owner policy after buying a car, or cancelling, and the setting varies by package, by term status and renewal state, by the insured's points, by whether a household member owns a car the insured could use and how that car's policy treats the insured, and by the filing resting on the term.
      The records are the non-owner term with its dates, premium and fee ledger, its signed Non-Owner Statements, notices and Statements of No Loss, its billing plan's renewal bill and payments, the filings it backs, and any owner policy of the same insured or of the household; the governing rules are single-holding and owner-policy exclusivity (nonowner_agg_multi_holding), eligibility with the statement's freshness and the household-vehicle exception (nonowner_eligibility), the per-package renewal offer, re-tiering and late-renewal window (nonowner_renewal), nonrenewal notice timing (nonowner_nonrenewal), conversion to an owner policy without short rate (nonowner_conversion), insured cancellation with per-package retention (nonowner_insured_cancellation), and premium and fee arithmetic (nonowner_unearned_premium_return, nonowner_premium_charging, nonowner_fees).
      In the natural order of the domain a term is bound on a signed statement, renewed on a new statement and a renewal payment, possibly late with a lapse, and ends by expiration, nonpayment, the insured's request or replacement by an owner policy.
      Binding, issuing and accepting renewals, booking premium and fees and processing conversions are agent service actions, whereas signing the Non-Owner Statement and the Statement of No Loss and confirming a cancellation request are the insured's own acts.
      Requests no rule decides, such as covering a household car the insured drives every day, moving an Operator certificate onto another carrier's owner policy, or accepting another insurer's exclusion the desk cannot see, go to a human representative as POLICY_NOT_COVERED.
