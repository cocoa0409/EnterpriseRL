# Policy charter: Owner Auto Policy (category key: auto).
category: auto
display_name: Owner Auto Policy
binding:
  holding_table: auto_policies
  event_tables:
  - auto_premium_transactions
  - auto_policy_changes
  - auto_policy_documents
  intake_tables:
  - auto_cancellation_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    term_written_premium: written_premium
    term_fees_charged: policy_fees
lifecycle:
  states:
  - bound
  - renewal_offered
  - in_force
  - pending_cancellation
  - cancelled
  - expired
  - not_taken
  transitions:
  - from: bound
    to: in_force
    by: system
    means: The new-business term goes in force once the down payment clears.
  - from: bound
    to: cancelled
    by: agent
    means: The term is cancelled from inception because the down payment was dishonored.
  - from: renewal_offered
    to: in_force
    by: agent
    means: The renewal down payment is received (on time, or late within the late-renewal window) and
      the renewal term goes in force.
  - from: renewal_offered
    to: not_taken
    by: system
    means: The renewal offer closes unpaid after the late-renewal window.
  - from: in_force
    to: pending_cancellation
    by: agent
    means: A notice of cancellation for nonpayment has been mailed.
  - from: pending_cancellation
    to: in_force
    by: agent
    means: The minimum due is received in time and the notice is rescinded.
  - from: pending_cancellation
    to: cancelled
    by: agent
    means: The cancellation effective date arrives with the minimum due unpaid (or the insured's own request
      takes effect first).
  - from: in_force
    to: cancelled
    by: user
    means: The named insured's signed cancellation request takes effect.
  - from: in_force
    to: cancelled
    by: agent
    means: The company cancels for an underwriting reason after advance notice.
  - from: in_force
    to: expired
    by: system
    means: The term reaches its expiration date.
  - from: cancelled
    to: in_force
    by: agent
    means: A term cancelled for nonpayment is reinstated.
accounts:
- key: written_premium
  unit: USD
  meaning: 'Net premium written on the term: full-term premium and additional premium in, return premium
    out.'
- key: policy_fees
  unit: USD
  meaning: Fully earned fees charged on the term (policy fee, reinstatement fee) net of reversals.
parameter_schema:
  bi_per_person_limit: Bodily injury liability limit per person, USD; the value state_minimum means the
    garaging state's figure in state_minimum_limits.
  bi_per_accident_limit: Bodily injury liability limit per accident, USD; state_minimum means the garaging
    state's figure in state_minimum_limits.
  pd_per_accident_limit: Property damage liability limit per accident, USD; state_minimum means the garaging
    state's figure in state_minimum_limits.
  state_minimum_limits: Mapping garaging state -> the state's minimum financial responsibility limits
    (USD) and whether bodily injury liability must be carried even when no SR-22/FR-44 filing is required
    (Florida requires BI only for filers).
  fr44_required_limits: Mapping state -> the FR-44 financial responsibility limits (USD) a policy must
    carry to support an FR-44 certificate (Florida 100/300/50, Virginia twice the Virginia minimum, 100/200/50).
  fl_pip_limit: Florida Personal Injury Protection limit per person, USD (Florida garaged policies only).
  fl_pip_deductible: Florida PIP deductible carried by the package, USD (applies to the named insured
    and resident relatives).
  tx_pip_limit: Texas Personal Injury Protection limit per person, USD, included unless the named insured
    rejected PIP in writing (Texas garaged policies only).
  um_uim_bi_limit_basis: 'How the uninsured/underinsured motorist bodily injury limit is set: equal to
    the package''s BI limits unless lower limits or rejection were elected in writing where the state
    permits.'
  um_rejection_permitted_states: States in which the named insured may reject UM/UIM bodily injury in
    writing (Virginia requires UM/UIM, so it is absent).
  medpay_limit: Medical payments coverage limit per person, USD (0 = not included in the package).
  term_options_months: Policy term lengths the package is written for, in months.
  max_violation_points_new_business: Maximum company violation points (named insured and every rated driver,
    36-month MVR lookback) accepted when the package is bound or selected mid-term.
  max_violation_points_renewal: Maximum company violation points accepted for the package when a renewal
    term is offered.
  max_at_fault_accidents_36_months: Maximum chargeable at-fault accidents in the 36 months before binding,
    across all rated drivers.
  dui_within_60_months_accepted: Whether a rated driver with a DUI/DWI conviction in the past 60 months
    is acceptable in the package (true/false).
  min_years_licensed: Minimum years the named insured has held a valid license (any US state or foreign
    country).
  foreign_license_accepted: Whether a rated driver licensed only by a foreign country (not a US state)
    is acceptable (true/false).
  sr22_filing_accepted: Whether the package may back an SR-22 certificate (true/false).
  fr44_filing_states: States in which the package's limits are high enough to back an FR-44 certificate.
  max_vehicles: Maximum vehicles scheduled on one owner policy.
  max_rated_drivers: Maximum rated drivers on one owner policy.
  max_excluded_drivers: Maximum named excluded drivers on one owner policy at one time.
  new_business_underwriting_period_days_by_state: Mapping garaging state -> calendar days after the original
    effective date during which the company may cancel a new-business policy for any underwriting reason
    (company schedule).
  underwriting_cancel_notice_days_by_state: Mapping garaging state -> days of advance written notice the
    company gives before an underwriting (non-payment-unrelated) cancellation takes effect (company schedule).
  underwriting_cancel_reasons_after_period: Underwriting reasons for which an in-force policy may still
    be cancelled after the new-business underwriting period.
  policy_fee_new_business: Fully earned policy fee charged once when a new-business term is bound, USD.
  policy_fee_renewal: Fully earned policy fee charged once when a renewal term is accepted, USD.
  reinstatement_fee: Fully earned fee charged once for each reinstatement with a lapse in coverage, USD.
  fees_returned_on_cancellation: 'Whether fully earned fees are returned when a term cancels (false: never,
    except reversal of a fee that the company charged in error or on a term voided from inception for
    a dishonored down payment).'
  nonpay_notice_days_by_state: Mapping garaging state -> minimum calendar days between the mailing date
    of a notice of cancellation for nonpayment and the cancellation effective date (company schedule,
    not shorter than the state's minimum).
  nonpay_notice_issue_days_after_due: Calendar days after an installment due date, with the installment
    still unpaid, on which the notice of cancellation for nonpayment is mailed.
  nonpay_minimum_unpaid_amount: Smallest unpaid past-due amount, USD, for which a notice of cancellation
    for nonpayment is issued; below it no notice is issued and the amount rolls into the next bill.
  rescission_payment_basis: 'What must be received on or before the cancellation effective date to rescind
    a notice: the full minimum amount due stated on the notice.'
  cancellation_effective_time: Clock time on the cancellation effective date at which coverage ends.
  nonpay_cancel_refund_method: Return-premium method when a term cancels for nonpayment.
  underwriting_cancel_refund_method: Return-premium method when the company cancels for an underwriting
    reason.
  insured_cancel_short_rate_retention_pct: Percent of the unearned premium the company retains when the
    named insured requests cancellation (0.0 = pure pro rata refund).
  refund_issue_days: Calendar days after a cancellation is processed within which any unearned premium
    credit is applied to the billing plan.
  reinstatement_window_days: Calendar days after the cancellation effective date during which a policy
    cancelled for nonpayment may be reinstated with a lapse.
  max_lapse_reinstatements_per_term: Maximum reinstatements with a lapse in coverage allowed within one
    policy term.
  no_loss_statement_required: Whether a Statement of No Loss signed by the named insured is required before
    a reinstatement with a lapse (true/false).
  no_loss_statement_max_age_days: Maximum calendar days between the date the Statement of No Loss was
    signed and the date the reinstatement is processed.
  reinstatement_effective_offset_days: Calendar days added to the later of the reinstatement payment posting
    date and the Statement of No Loss signing date to give the reinstatement effective date (coverage
    resumes 12:01 a.m. that day).
  postmark_receipt_days: Calendar days after the cancellation effective date within which a mailed payment
    postmarked on or before the cancellation effective date must be received to be treated as received
    on time.
  household_listing_min_age: Minimum age at which a resident of the named insured's household must be
    listed on the policy as a rated driver or a named excluded driver.
  exclusion_effective_rule: How the effective date of a named driver exclusion is set.
  exclusion_return_premium_basis: How return premium is computed when a rated driver is excluded mid-term.
  additional_vehicle_reporting_days: Calendar days after acquisition within which an additional (not replacement)
    vehicle must be reported to receive coverage from its acquisition date.
  replacement_vehicle_reporting_days: Calendar days after acquisition within which a replacement vehicle
    must be reported to receive coverage from its acquisition date.
  midterm_change_premium_basis: How additional or return premium for a mid-term driver, vehicle or limits
    change is computed.
  renewal_offer_days_before_expiration: Calendar days before the expiration date on which the renewal
    offer (renewal term) is issued.
  nonrenewal_notice_days_by_state: Mapping garaging state -> minimum calendar days before expiration by
    which a company nonrenewal notice must be mailed (company schedule).
  late_renewal_window_days: Calendar days after the expiration date during which the renewal down payment
    is still accepted, renewing the term with a lapse from the expiration date to the payment date.
  renewal_tier_reassignment: How the package is reassigned at renewal when a driver no longer meets the
    package's renewal points maximum.
  term_days_basis: Day count used for pro rata arithmetic.
  premium_rounding: Rounding applied to every computed premium or refund.
