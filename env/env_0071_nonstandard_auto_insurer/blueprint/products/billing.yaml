    evidence_fields:
    - billing_transactions.related_payment_txn_id
    - billing_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_transactions.related_payment_txn_id
      action_bindings:
