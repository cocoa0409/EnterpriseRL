- id: billing_cancellation_settlement
  subject:
  - billing_final_billed
  - billing_final_bill
  - billing_referred_to_collections
  - billing_balance_written_off
  - billing_refund_issued
  - billing_plan_closed
  rule: A final bill is issued only after the policy term the plan bills has been cancelled (auto_policies.status,
    or nonowner_policies.status for a non-owner term, is cancelled). After the cancellation return premium
    is credited, a debit account_balance above small_balance_writeoff_max is final-billed with a due date
    final_bill_due_days calendar days after the final bill date and no installment fee; a debit balance
    at or below it is written off as small_balance and the plan closes. A final balance still unpaid collections_referral_days
    calendar days after the final bill due date is referred to the collection agency; a collection balance
    is closed when paid or when the agency returns it as uncollectible. A credit balance is refunded within
    credit_refund_days calendar days by refund_method and the plan closes. A plan whose term expired with
    a zero balance closes on the expiration date.
  eligibility:
  - id: term_cancelled
    applies_to:
    - billing_final_billed
    - billing_final_bill
    kind: state
    condition: A final bill is issued only after the policy term the plan bills has been cancelled (auto_policies.status,
      or nonowner_policies.status for a non-owner term, is cancelled).
    evidence_fields:
    - nonowner_policies.status
    - auto_policies.status
    - billing_plans.auto_policy_id
    - billing_plans.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
        - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
        billing_plans.nonowner_policy_id: nonowner_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - cancelled
  params:
    small_balance_writeoff_max: =small_balance_writeoff_max
    final_bill_due_days: =final_bill_due_days
    collections_referral_days: =collections_referral_days
    credit_refund_days: =credit_refund_days
    refund_method: =refund_method
- id: billing_reactivation
  subject:
  - billing_plan_reactivated
  rule: A final-billed plan is reactivated only after the policy term it bills (owner or non-owner) has
    been reinstated. On reactivation the premium re-written by the reinstatement is charged, the reinstatement
    fee is charged, unbilled installments keep their original due dates and amounts (an installment whose
    due date fell inside the lapse is billed on the next invoice), and the plan is current. The reinstatement
    payment itself must already have covered every past-due amount; a plan in in_collections or closed
    is never reactivated.
  eligibility:
  - id: term_reinstated
    applies_to:
    - billing_plan_reactivated
    kind: authorization
    condition: A final-billed plan is reactivated only after the policy term it bills (owner or non-owner)
      has been reinstated.
    evidence_fields:
    - auto_policies.status
    - auto_policies.reinstatement_date
    - nonowner_policies.status
    - nonowner_policies.reinstatement_date
    - billing_plans.auto_policy_id
    - billing_plans.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
        - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
        billing_plans.nonowner_policy_id: nonowner_policy_id
  params:
    reactivation_on_reinstatement: =reactivation_on_reinstatement
    reactivated_installment_rule: =reactivated_installment_rule
- id: billing_renewal_billing
  subject:
  - billing_renewal_bill
  rule: 'The renewal bill is issued with the renewal offer on the renewal term''s own plan: its premium
    portion is the renewal full-term premium multiplied by the plan''s renewal_down_pct and divided by
    100, rounded to the cent, its fees are the renewal policy fee and any filing fee due, and it is due
    on the expiration date of the expiring term. Only one renewal bill is issued per renewal term. On
    plans with renewal_auto_draft true the renewal down payment is drafted on the due date under the recurring
    authorization.'
  eligibility:
  - id: one_renewal_bill
    applies_to:
    - billing_renewal_bill
    kind: dedup
    condition: Only one renewal bill is issued per renewal term.
    evidence_fields:
    - billing_invoices.billing_plan_id
    - billing_invoices.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_invoices.billing_plan_id
      action_bindings:
        billing_invoices.billing_plan_id: billing_plan_id
    dedup_contract:
      table: billing_invoices
      mode: separate_record
      object_bindings:
        billing_plan_id: billing_plan_id
      duplicate_filters:
        event_type:
        - billing_renewal_bill
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Paid-in-Full Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Two-Pay Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Four-Pay Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Six-Pay Direct Bill Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Monthly EFT Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Monthly Card Autopay Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
- id: billing_premium_posting
  subject:
  - billing_premium_charged
  - billing_premium_credited
  rule: Every premium written and additional premium transaction of the billed term is posted as a charge,
    and every return premium transaction as a credit, for the same amount on the day the policy transaction
    is processed, referencing it. Each policy premium transaction is posted to the plan only once. Fully
    earned fees are charged with the policy transaction that produced them. Premium is never posted to
    a plan whose term it does not belong to.
  eligibility:
  - id: post_once
    applies_to:
    - billing_premium_charged
    - billing_premium_credited
    kind: dedup
    condition: Each policy premium transaction is posted to the plan only once.
    evidence_fields:
    - billing_transactions.source_auto_txn_id
    - billing_transactions.source_nonowner_txn_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_transactions.source_auto_txn_id
        - billing_transactions.source_nonowner_txn_id
      action_bindings:
        billing_transactions.source_auto_txn_id: source_auto_txn_id
        billing_transactions.source_nonowner_txn_id: source_nonowner_txn_id
    dedup_contract:
      table: billing_transactions
      mode: separate_record
      object_bindings:
        source_auto_txn_id: source_auto_txn_id
        source_nonowner_txn_id: source_nonowner_txn_id
      duplicate_filters:
        event_type:
        - billing_premium_charged
        - billing_premium_credited
      distinct_fields: []
  params:
    premium_posting_rule: =premium_posting_rule
