        nsf_fee: =nsf_fee
        returned_drafts: =returned_drafts_to_end_autopay
      Cardinal Point Six-Pay Direct Bill Plan:
        nsf_fee: =nsf_fee
        returned_drafts: =returned_drafts_to_end_autopay
      Cardinal Point Monthly EFT Plan:
        nsf_fee: =nsf_fee
        returned_drafts: =returned_drafts_to_end_autopay
      Cardinal Point Monthly Card Autopay Plan:
        nsf_fee: =nsf_fee
        returned_drafts: =returned_drafts_to_end_autopay
    nsf_fee_return_reasons: =nsf_fee_return_reasons
  measures:
