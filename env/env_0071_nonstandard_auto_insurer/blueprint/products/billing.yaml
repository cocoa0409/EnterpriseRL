      Cardinal Point Paid-in-Full Plan:
        agent_fee: =agent_assisted_payment_fee
        personal_check_accepted: =personal_check_accepted
      Cardinal Point Two-Pay Plan:
        agent_fee: =agent_assisted_payment_fee
        personal_check_accepted: =personal_check_accepted
      Cardinal Point Four-Pay Plan:
        agent_fee: =agent_assisted_payment_fee
        personal_check_accepted: =personal_check_accepted
      Cardinal Point Six-Pay Direct Bill Plan:
        agent_fee: =agent_assisted_payment_fee
        personal_check_accepted: =personal_check_accepted
      Cardinal Point Monthly EFT Plan:
        agent_fee: =agent_assisted_payment_fee
        personal_check_accepted: =personal_check_accepted
      Cardinal Point Monthly Card Autopay Plan:
        agent_fee: =agent_assisted_payment_fee
        personal_check_accepted: =personal_check_accepted
    max_single_payment: =max_single_payment
    payment_application_order: =payment_application_order
- id: billing_delinquency
  subject:
  - billing_became_past_due
  - billing_delinquency_cured
  - billing_paid_in_full
  rule: A plan moves to past_due only when an installment invoice's minimum due is unpaid at the end of
    its due date. A past_due plan returns to current only when payments cover every past-due amount, including
    late and NSF fees; a partial payment leaves it past_due. A plan moves to paid_in_full when account_balance
    is 0.00 or less and no installment remains to be billed. The policy's notice of cancellation for nonpayment
    follows its own rule.
  eligibility:
  - id: unpaid_at_due
    applies_to:
    - billing_became_past_due
    kind: authorization
    condition: A plan moves to past_due only when an installment invoice's minimum due is unpaid at the
      end of its due date.
    evidence_fields:
    - billing_invoices.due_date
    - billing_invoices.minimum_due
    - billing_transactions.amount
    - billing_invoices.billing_invoice_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_invoices.billing_invoice_id
      action_bindings:
        billing_invoices.billing_invoice_id: billing_invoice_id
- id: billing_due_date_change
  subject:
  - billing_due_date_changed
  rule: A due day change is made only on a plan whose status is current. The plan must allow it (due_date_change_allowed),
    due_date_changes_used must be below max_changes, and the new due day may move the next due date by
    no more than max_shift_days calendar days earlier or later. The request is made at least latest_days_before_due
    calendar days before the next installment due date. The change applies to every installment not yet
    invoiced; already issued invoices keep their due dates, and no fee is charged. The final installment
    must still fall due before the term expiration date.
  eligibility:
  - id: plan_current
    applies_to:
    - billing_due_date_changed
    kind: state
    condition: A due day change is made only on a plan whose status is current.
    evidence_fields:
    - billing_plans.status
    - billing_plans.billing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.billing_plan_id
      action_bindings:
        billing_plans.billing_plan_id: billing_plan_id
    state_contract:
      field: billing_plans.status
      allowed:
      - current
  - id: lead_time
    applies_to:
    - billing_due_date_changed
    kind: authorization
    condition: The request is made at least latest_days_before_due calendar days before the next installment
      due date.
    evidence_fields:
    - billing_invoices.due_date
    - billing_plans.billing_plan_id
    evidence_contract:
