        allowed: =due_date_change_allowed
        max_shift_days: =due_date_change_max_shift_days
        max_changes: =due_date_change_max_per_term
        latest_days_before_due: =due_date_change_latest_days_before_due
      Cardinal Point Two-Pay Plan:
        allowed: =due_date_change_allowed
        max_shift_days: =due_date_change_max_shift_days
        max_changes: =due_date_change_max_per_term
        latest_days_before_due: =due_date_change_latest_days_before_due
      Cardinal Point Four-Pay Plan:
        allowed: =due_date_change_allowed
        max_shift_days: =due_date_change_max_shift_days
        max_changes: =due_date_change_max_per_term
        latest_days_before_due: =due_date_change_latest_days_before_due
      Cardinal Point Six-Pay Direct Bill Plan:
        allowed: =due_date_change_allowed
        max_shift_days: =due_date_change_max_shift_days
        max_changes: =due_date_change_max_per_term
        latest_days_before_due: =due_date_change_latest_days_before_due
      Cardinal Point Monthly EFT Plan:
