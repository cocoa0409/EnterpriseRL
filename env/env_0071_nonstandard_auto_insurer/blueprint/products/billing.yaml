    courtesy_late_fee_waivers_per_term: 0
    nsf_fee: 25.0
    nsf_fee_return_reasons:
    - insufficient_funds
    - account_closed
    - stop_payment_by_payer
    nsf_lookback_months: 12
    nsf_returns_for_certified_funds: 2
    certified_funds_methods:
    - cashiers_check
    - money_order
    - debit_card
    - credit_card
    - cash
    returned_drafts_to_end_autopay: 0
    payment_channels_accepted:
    - online_portal
    - ivr_phone
    - agent_phone
    - mail
    - agent_office
    - eft_draft
    - card_autopay
    agent_assisted_payment_fee: 5.0
    max_single_payment: 5000.0
    down_payment_methods:
    - debit_card
    - credit_card
    - bank_ach
    - cash
    - money_order
    personal_check_accepted: true
    partial_payment_accepted: true
    payment_application_order:
    - past_due_invoices_oldest_first_fees_then_premium
    - unpaid_late_and_nsf_fees
    - current_invoice_fees_then_premium
    - future_installments_nearest_first
    overpayment_handling: credit_applied_to_future_installments_refunded_at_plan_close
    mail_payment_postmark_recorded: true
    credit_refund_days: 15
    refund_method: original_card_or_bank_account_else_check_to_mailing_address
    small_balance_writeoff_max: 10.0
    final_bill_due_days: 20
    collections_referral_days: 30
    installment_fee_on_final_bill: false
    payoff_waives_future_installment_fees: true
    reactivation_on_reinstatement: true
    reactivated_installment_rule: unbilled_installments_keep_original_due_dates
    due_date_change_allowed: false
    due_date_change_max_shift_days: 0
    due_date_change_max_per_term: 0
    due_date_change_latest_days_before_due: 0
    plan_switch_targets: []
    plan_switch_max_per_term: 0
    recurring_authorization_required: false
    recurring_method: none
    authorization_lead_days: 0
    renewal_bill_due_rule: expiration_date_of_expiring_term
    renewal_auto_draft: false
    premium_posting_rule: each_policy_transaction_posted_once_same_amount_same_day
    rounding: nearest_cent_half_up
