# Policy charter: Installment Payment Plans (category key: billing).
category: billing
display_name: Installment Payment Plans
binding:
  holding_table: billing_plans
  event_tables:
  - billing_transactions
  - billing_invoices
  - billing_authorizations
  status_field: status
  variant_field: variant_name
  quantity_fields:
    account_balance: account_balance
lifecycle:
  states:
  - enrolled
  - current
  - past_due
  - paid_in_full
  - final_billed
  - in_collections
  - closed
  transitions:
  - from: enrolled
    to: current
    by: system
    means: The down payment clears and installments remain.
  - from: enrolled
    to: paid_in_full
    by: system
    means: The down payment equal to the whole premium clears.
  - from: enrolled
    to: closed
    by: agent
    means: The down payment is dishonored and the term is voided.
  - from: current
    to: past_due
    by: system
    means: An installment is unpaid after its due date.
  - from: past_due
    to: current
    by: agent
    means: Every past-due amount is paid.
  - from: current
    to: paid_in_full
    by: agent
    means: The balance is paid off with no installment left.
  - from: past_due
    to: paid_in_full
    by: agent
    means: The whole balance including past-due amounts is paid.
  - from: current
    to: final_billed
    by: agent
    means: The term is cancelled and an earned balance remains.
  - from: past_due
    to: final_billed
    by: agent
    means: The term is cancelled and an earned balance remains.
  - from: final_billed
    to: current
    by: agent
    means: The term is reinstated and the plan reactivated.
  - from: final_billed
    to: in_collections
    by: system
    means: The final balance is unpaid past the collections referral date.
  - from: final_billed
    to: closed
    by: agent
    means: The final balance is paid, credited or written off.
  - from: in_collections
    to: closed
    by: agent
    means: The collection balance is paid or written off.
  - from: paid_in_full
    to: closed
    by: system
    means: The term ended or was cancelled and any credit refunded.
  - from: current
    to: closed
    by: agent
    means: The term is cancelled leaving a zero or credit balance, refunded.
accounts:
- key: account_balance
  unit: USD
  meaning: 'Amount the customer owes on the plan: premium and fees charged, returned payments and refunds
    in; payments, premium credits, waivers and write-offs out.'
parameter_schema:
  down_payment_pct_new_business: Down payment on a new-business term as a percent of the term premium
    billed (fully earned fees are added in full).
  down_payment_pct_renewal: Renewal down payment as a percent of the renewal term premium (renewal fees
    are added in full).
  installment_count: Number of installments after the down payment.
  first_installment_months_after_effective: Calendar months after the term effective date at which the
    first installment falls due (0 = no installments).
  installment_interval_months: Calendar months between consecutive installment due dates (0 = no further
    installments).
  installment_split_rule: How the premium after the down payment is spread over the installments.
  due_day_month_end_fallback: How a due day that does not exist in a month is handled.
  installment_fee: Installment fee added to each installment invoice, USD.
  invoice_lead_days: Calendar days before the due date on which an installment invoice (or draft notice)
    is issued.
  draft_date_rule: When an automatic payment is drafted (n/a for direct bill plans).
  late_fee: Late fee for an installment not paid in full within the grace period, USD.
  late_fee_grace_days: Calendar days after the due date during which a payment posts without a late fee.
  late_fee_max_per_installment: Maximum late fees for one installment invoice.
  courtesy_late_fee_waivers_per_term: Late fees that may be waived as a courtesy in one term when the
    customer has no returned payment in the NSF lookback.
  nsf_fee: Returned-payment (NSF) fee per dishonored payment, USD.
  nsf_fee_return_reasons: Bank return reasons for which the NSF fee is charged.
  nsf_lookback_months: Rolling months over which returned payments are counted, across every billing plan
    of the customer.
  nsf_returns_for_certified_funds: Returned payments in the lookback at which every open plan of the customer
    is restricted to certified funds.
  certified_funds_methods: Payment methods accepted while a plan is restricted to certified funds.
  returned_drafts_to_end_autopay: Returned automatic drafts in one term after which the recurring authorization
    is revoked and the plan becomes the Six-Pay Direct Bill Plan (0 = not applicable).
  payment_channels_accepted: Channels through which payments are accepted on the plan.
  agent_assisted_payment_fee: Fee for a one-time payment taken by a live representative by phone, USD
    (0.00 = none).
  max_single_payment: Largest amount accepted in one card or bank payment, USD.
  down_payment_methods: Methods accepted for a new-business down payment (personal checks are never accepted
    for a down payment).
  personal_check_accepted: Whether a personal check is accepted for an installment or renewal payment
    (true/false).
  partial_payment_accepted: Whether a payment smaller than the minimum due is accepted and applied (true/false).
  payment_application_order: Order in which a payment is applied to open charges.
  overpayment_handling: Treatment of a payment that exceeds every billed amount.
  mail_payment_postmark_recorded: Whether the postmark date of a mailed payment is recorded with the payment
    (true/false).
  credit_refund_days: Calendar days after a plan closes with a credit balance within which the refund
    is issued.
  refund_method: How a credit balance is refunded.
  small_balance_writeoff_max: Largest debit balance written off instead of final-billed after a cancellation,
    USD.
  final_bill_due_days: Calendar days after the final bill date on which the final bill is due.
  collections_referral_days: Calendar days after the final bill due date after which an unpaid final balance
    is referred to the collection agency.
  installment_fee_on_final_bill: Whether an installment fee is added to a final bill (true/false).
  payoff_waives_future_installment_fees: Whether paying the whole balance before an installment is invoiced
    avoids that installment's fee (true/false).
  reactivation_on_reinstatement: Whether a final-billed plan is reactivated when its policy term is reinstated
    (true/false).
  reactivated_installment_rule: How installments resume after reactivation.
  due_date_change_allowed: Whether the installment due day may be changed mid-term (true/false).
  due_date_change_max_shift_days: Largest number of calendar days a due day may move later or earlier
    in one change.
  due_date_change_max_per_term: Due day changes allowed per term.
  due_date_change_latest_days_before_due: Minimum calendar days between the change request and the next
    installment due date.
  plan_switch_targets: Plans this plan may be switched to mid-term.
  plan_switch_max_per_term: Mid-term plan switches allowed per term.
  recurring_authorization_required: Whether the plan requires a recurring payment authorization signed
    by the customer (true/false).
  recurring_method: Payment method of the recurring authorization.
  authorization_lead_days: Calendar days before a draft date by which a new or changed recurring authorization
    must be signed to apply to that draft.
  renewal_bill_due_rule: When the renewal down payment is due.
  renewal_auto_draft: Whether the renewal down payment is drafted automatically on its due date (true/false).
  premium_posting_rule: How policy premium transactions are posted to the plan.
  rounding: Rounding applied to every billed amount.
variants:
- name: Cardinal Point Paid-in-Full Plan
  rank: 1
  entry_gate:
