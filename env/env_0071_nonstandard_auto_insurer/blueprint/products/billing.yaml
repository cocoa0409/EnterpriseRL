    credit_refund_days: 15
    refund_method: original_card_or_bank_account_else_check_to_mailing_address
    small_balance_writeoff_max: 10.0
    final_bill_due_days: 20
    collections_referral_days: 30
    installment_fee_on_final_bill: false
    payoff_waives_future_installment_fees: true
    reactivation_on_reinstatement: true
    reactivated_installment_rule: unbilled_installments_keep_original_due_dates
    due_date_change_allowed: true
    due_date_change_max_shift_days: 10
    due_date_change_max_per_term: 1
    due_date_change_latest_days_before_due: 5
    plan_switch_targets:
    - Cardinal Point Paid-in-Full Plan
    - Cardinal Point Six-Pay Direct Bill Plan
    - Cardinal Point Monthly EFT Plan
    plan_switch_max_per_term: 2
    recurring_authorization_required: true
    recurring_method: card
    authorization_lead_days: 3
    renewal_bill_due_rule: expiration_date_of_expiring_term
    renewal_auto_draft: true
    premium_posting_rule: each_policy_transaction_posted_once_same_amount_same_day
    rounding: nearest_cent_half_up
events:
- type: billing_plan_enrolled
  target: billing_plans
  mutation: create
  meaning: An installment payment plan is set up for a new-business or renewal policy term.
  grain: one row per payment plan
  fields:
    customer_id: customer
    auto_policy_id: owner term billed
    nonowner_policy_id: non-owner term billed
    variant_name: plan selected
    plan_number: billing account number
    enrolled_date: set-up date
    term_effective_date: term start
    term_expiration_date: term end
    term_premium_billed: full-term premium
    down_payment_amount: down payment required
    installment_due_day: due day
    payment_method_on_file: recurring method
  triggers: []
- type: billing_down_payment_cleared
  target: billing_plans
  mutation:
    transition:
    - from: enrolled
      to: current
    - from: enrolled
      to: paid_in_full
  meaning: The down payment clears; the plan becomes current, or paid in full when the down payment was
    the whole premium.
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
  triggers: []
- type: billing_down_payment_dishonored
  target: billing_plans
  mutation:
    transition:
      from: enrolled
      to: closed
  meaning: The down payment is returned dishonored and the plan closes with the voided term.
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
    closed_date: date the plan closed
  triggers: []
- type: billing_became_past_due
  target: billing_plans
  mutation:
    transition:
      from: current
      to: past_due
  meaning: An installment remains unpaid after its due date.
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
  triggers: []
- type: billing_delinquency_cured
  target: billing_plans
  mutation:
    transition:
      from: past_due
      to: current
  meaning: Payments cover every past-due amount and the plan is current again.
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
  triggers: []
- type: billing_paid_in_full
  target: billing_plans
  mutation:
    transition:
    - from: current
      to: paid_in_full
    - from: past_due
      to: paid_in_full
  meaning: The balance reaches zero with no installment left to bill.
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
  triggers: []
- type: billing_final_billed
  target: billing_plans
  mutation:
    transition:
    - from: current
      to: final_billed
    - from: past_due
      to: final_billed
  meaning: The policy term is cancelled and the earned-premium balance left after return premium is final-billed.
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
  triggers:
  - event: billing:billing_final_bill
    map: {}
- type: billing_plan_reactivated
  target: billing_plans
  mutation:
    transition:
      from: final_billed
      to: current
  meaning: The cancelled policy term is reinstated and its plan resumes billing.
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
  triggers: []
- type: billing_referred_to_collections
  target: billing_plans
  mutation:
    transition:
      from: final_billed
      to: in_collections
  meaning: An unpaid final balance is referred to the collection agency.
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
  triggers: []
- type: billing_plan_closed
  target: billing_plans
  mutation:
    transition:
    - from: final_billed
      to: closed
    - from: in_collections
      to: closed
    - from: paid_in_full
      to: closed
    - from: current
      to: closed
  meaning: 'The plan closes: the term ended paid, or the final balance was paid, credited, refunded or
    written off.'
  grain: one row per payment plan
  fields:
    status: new lifecycle state of the plan
    closed_date: date the plan closed
  triggers: []
- type: billing_due_date_changed
  target: billing_plans
  mutation: update
  meaning: The installment due day is moved at the customer's request.
  grain: one row per payment plan
  fields:
    installment_due_day: new due day
    due_date_changes_used: incremented by 1
  triggers: []
- type: billing_plan_switched
  target: billing_plans
  mutation: update
  meaning: The plan is switched mid-term to another payment plan.
  grain: one row per payment plan
  fields:
    variant_name: new plan
    payment_method_on_file: recurring method of the new plan
    plan_switches_used: incremented by 1
  triggers: []
- type: billing_certified_funds_flagged
  target: billing_plans
  mutation: update
  meaning: The plan is restricted to certified funds after repeated returned payments.
  grain: one row per payment plan
  fields:
    certified_funds_only: set to true
    payment_method_on_file: set to none
  triggers: []
- type: billing_premium_charged
  target: billing_transactions
  meaning: A policy premium transaction (premium written or additional premium) is posted to the plan.
  grain: one row per posted policy premium transaction
  distinguish_by:
  - source_auto_txn_id
  - source_nonowner_txn_id
  fields:
    posted_date: posting date
    amount: positive amount
    source_auto_txn_id: owner premium transaction
    source_nonowner_txn_id: non-owner premium transaction
  account: account_balance
  direction: in
  triggers: []
- type: billing_premium_credited
  target: billing_transactions
  meaning: A policy return premium transaction is credited to the plan.
  grain: one row per credited return premium transaction
  distinguish_by:
  - source_auto_txn_id
  - source_nonowner_txn_id
  fields:
    posted_date: posting date
    amount: positive amount
    source_auto_txn_id: owner premium transaction
    source_nonowner_txn_id: non-owner premium transaction
  account: account_balance
  direction: out
  triggers: []
- type: billing_installment_fee
  target: billing_transactions
  meaning: The installment fee of an installment invoice is charged.
  grain: one row per installment invoice
  distinguish_by:
  - related_invoice_id
  fields:
    posted_date: posting date
    amount: positive amount
    installment_number: installment
    related_invoice_id: invoice
  account: account_balance
  direction: in
  triggers: []
- type: billing_late_fee
  target: billing_transactions
  meaning: A late fee is charged on an installment not paid in full within the grace period.
  grain: one row per late installment invoice
  distinguish_by:
  - related_invoice_id
  fields:
    posted_date: posting date
    amount: positive amount
    installment_number: installment
    related_invoice_id: late invoice
  account: account_balance
  direction: in
  triggers: []
- type: billing_nsf_fee
  target: billing_transactions
  meaning: The returned-payment fee is charged for a dishonored payment.
  grain: one row per returned payment
  distinguish_by:
  - related_payment_txn_id
  fields:
    posted_date: posting date
    amount: positive amount
    related_payment_txn_id: returned payment
  account: account_balance
  direction: in
  triggers: []
- type: billing_agent_payment_fee
  target: billing_transactions
  meaning: The agent-assisted payment fee is charged on a one-time payment taken by a live representative.
  grain: one row per agent-assisted payment
  distinguish_by:
  - related_payment_txn_id
  fields:
    posted_date: posting date
    amount: positive amount
    related_payment_txn_id: payment
  account: account_balance
  direction: in
  triggers: []
- type: billing_payment_received
  target: billing_transactions
  meaning: A payment from the customer is received and applied to the plan.
  grain: one row per payment
  distinguish_by:
  - confirmation_number
  fields:
    posted_date: posting date
    amount: positive amount
    payment_method: method
    payment_channel: channel
    postmark_date: postmark of mailed payment
    confirmation_number: confirmation number
    related_invoice_id: invoice paid first
  account: account_balance
  direction: out
  triggers: []
- type: billing_payment_returned
  target: billing_transactions
  meaning: A posted payment is returned by the bank and reversed.
  grain: one row per returned payment
  distinguish_by:
  - related_payment_txn_id
  fields:
    posted_date: posting date
    amount: positive amount
    related_payment_txn_id: payment reversed
    return_reason: bank return reason
  account: account_balance
  direction: in
  triggers:
  - event: billing:billing_nsf_fee
    when:
      return_reason:
      - insufficient_funds
      - account_closed
      - stop_payment_by_payer
    map:
      related_payment_txn_id: related_payment_txn_id
      posted_date: posted_date
- type: billing_fee_waived
  target: billing_transactions
  meaning: A fee charged on the plan is waived and reversed.
  grain: one row per waived fee
  distinguish_by:
  - reversed_fee_txn_id
  fields:
    posted_date: posting date
    amount: positive amount
    reversed_fee_txn_id: fee reversed
    waiver_reason: reason
  account: account_balance
  direction: out
  triggers: []
- type: billing_balance_written_off
  target: billing_transactions
  meaning: A remaining debit balance is written off.
  grain: one row per write-off
  distinguish_by:
  - writeoff_reason
  - posted_date
  fields:
    posted_date: posting date
    amount: positive amount
    writeoff_reason: reason
  account: account_balance
  direction: out
  triggers: []
- type: billing_refund_issued
  target: billing_transactions
  meaning: A credit balance is refunded to the customer.
  grain: one row per refund
  distinguish_by:
  - posted_date
  fields:
    posted_date: posting date
    amount: positive amount
    payment_method: refund method (original method or personal_check)
  account: account_balance
  direction: in
  triggers: []
- type: billing_installment_billed
  target: billing_invoices
  meaning: An installment invoice (or automatic draft notice) is issued.
  grain: one row per installment
  distinguish_by:
  - installment_number
  fields:
    invoice_date: issue date
    due_date: due date
    installment_number: installment
    premium_amount: installment premium
    fee_amount: installment fee
    past_due_amount: carried past due
    minimum_due: amount due
  triggers:
  - event: billing:billing_installment_fee
    map:
      installment_number: installment_number
      related_invoice_id: billing_invoice_id
      posted_date: invoice_date
      amount: fee_amount
- type: billing_final_bill
  target: billing_invoices
  meaning: The final bill for the earned-premium balance of a cancelled term is issued.
  grain: one row per plan
  distinguish_by:
  - invoice_date
  fields:
    invoice_date: issue date
    due_date: due date
    premium_amount: earned balance
    fee_amount: unpaid fees
    minimum_due: balance due
  triggers: []
- type: billing_renewal_bill
  target: billing_invoices
  meaning: The renewal down payment bill is issued with the renewal offer.
  grain: one row per renewal term
  distinguish_by:
  - invoice_date
  fields:
    invoice_date: issue date
    due_date: expiration date of expiring term
    premium_amount: renewal down payment premium
    fee_amount: renewal fees
    minimum_due: renewal down payment
  triggers: []
- type: billing_recurring_payment_authorized
  target: billing_authorizations
  meaning: The customer signs a recurring bank-draft or card authorization.
  grain: one row per authorization
  distinguish_by:
  - authorization_date
  - account_last4
  fields:
    authorization_date: signing date
    recurring_method: bank_ach or card
    account_last4: last four digits
  triggers: []
- type: billing_recurring_payment_revoked
  target: billing_authorizations
  meaning: A recurring authorization is revoked by the customer or by the returned-draft rule.
  grain: one row per revocation
  distinguish_by:
  - authorization_date
  - account_last4
  fields:
    authorization_date: revocation date
    recurring_method: method revoked
    account_last4: last four digits
  triggers: []
measures:
- id: billing_msr_nsf_returns_lookback
  window: rolling nsf_lookback_months calendar months ending today, by posted_date
  measure: count of billing_payment_returned rows whose return_reason is in nsf_fee_return_reasons, across
    every billing plan of the customer
- id: billing_msr_courtesy_waivers_in_term
  window: the current term of the plan (term_effective_date to term_expiration_date), by posted_date
  measure: count of billing_fee_waived rows with waiver_reason courtesy_late_fee on this billing_plan_id
- id: billing_msr_returned_drafts_in_term
  window: the current term of the plan, by posted_date
  measure: count of billing_payment_returned rows on this billing_plan_id whose related payment has payment_channel
    eft_draft or card_autopay
policies:
- id: billing_agg_multi_holding
  subject:
  - billing_plan_enrolled
  rule: A customer may hold any number of payment plans, one for each policy term they are responsible
    for, so max_per_customer is unlimited. Only one payment plan is set up per policy term. A renewal
    term gets its own new plan on the plan the customer selects for the renewal; the expiring term's plan
    is closed under its own rules. A plan bills exactly one term, either an Owner Auto Policy term or
    a Named Non-Owner Policy term, never both.
  eligibility:
  - id: one_plan_per_term
    applies_to:
    - billing_plan_enrolled
    kind: dedup
    condition: Only one payment plan is set up per policy term.
    evidence_fields:
    - billing_plans.auto_policy_id
    - billing_plans.nonowner_policy_id
    - billing_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
        - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
        billing_plans.nonowner_policy_id: nonowner_policy_id
    dedup_contract:
      table: billing_plans
      mode: separate_record
      object_bindings:
        auto_policy_id: auto_policy_id
        nonowner_policy_id: nonowner_policy_id
      duplicate_filters:
        status:
        - enrolled
        - current
        - past_due
        - paid_in_full
        - final_billed
        - in_collections
      distinct_fields: []
  params:
    max_per_customer: null
- id: billing_agg_returned_payments
  subject:
  - billing_certified_funds_flagged
  - billing_payment_received
  rule: Returned payments are counted across every billing plan of the customer, not plan by plan, over
    the rolling lookback measured by billing_msr_nsf_returns_lookback. A plan is restricted to certified
    funds only when billing_msr_nsf_returns_lookback has reached nsf_returns_for_certified_funds. When
    the threshold is reached, every open plan of the customer is flagged certified_funds_only on the same
    day, any recurring authorization on those plans is revoked, and a Monthly EFT or Monthly Card Autopay
    plan becomes the Six-Pay Direct Bill Plan. While a plan is restricted to certified funds, a payment
    is accepted on it only by a method in certified_funds_methods. Personal checks and bank ACH payments
    are refused while the restriction applies. The restriction stays on the flagged plans for the rest
    of their terms; a plan set up later for a renewal is enrolled without it only when the count is then
    below the threshold.
  eligibility:
  - id: nsf_threshold
    applies_to:
    - billing_certified_funds_flagged
    kind: authorization
    condition: A plan is restricted to certified funds only when billing_msr_nsf_returns_lookback has
      reached nsf_returns_for_certified_funds.
    evidence_fields:
    - billing_transactions.event_type
    - billing_transactions.return_reason
    - billing_transactions.posted_date
    - billing_plans.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.customer_id
      action_bindings:
        billing_plans.customer_id: customer_id
  - id: certified_method
    applies_to:
    - billing_payment_received
    kind: authorization
    condition: While a plan is restricted to certified funds, a payment is accepted on it only by a method
      in certified_funds_methods.
    evidence_fields:
    - billing_plans.certified_funds_only
    - billing_transactions.payment_method
    - billing_transactions.billing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_transactions.billing_plan_id
      action_bindings:
        billing_transactions.billing_plan_id: billing_plan_id
  params:
    nsf_returns_for_certified_funds: =nsf_returns_for_certified_funds
    certified_funds_methods: =certified_funds_methods
    nsf_lookback_months: =nsf_lookback_months
  measures:
  - billing_msr_nsf_returns_lookback
- id: billing_down_payment
  subject:
  - billing_plan_enrolled
  - billing_down_payment_cleared
  - billing_down_payment_dishonored
  rule: The down payment is the premium portion, term_premium_billed multiplied by the plan's down_pct
    for a new-business term or renewal_down_pct for a renewal term and divided by 100, rounded to the
    cent, plus every fully earned fee charged with the term (policy fee and any SR-22 or FR-44 filing
    fee) in full. An installment plan is available only when billing_msr_nsf_returns_lookback does not
    exceed the plan's entry gate max_nsf_returns_12_months. A customer who exceeds it is offered only
    the Cardinal Point Paid-in-Full Plan. A Monthly EFT or Monthly Card Autopay plan is set up only after
    the customer has signed a recurring payment authorization for it. A new-business down payment is accepted
    only by a method in down_payment_methods. When the down payment clears, the plan becomes current,
    or paid_in_full when the down payment was the whole premium. When the down payment is returned dishonored,
    the plan closes on that day, the NSF fee is charged, and the term is voided from inception under the
    policy's own rule.
  eligibility:
  - id: nsf_entry_gate
    applies_to:
    - billing_plan_enrolled
    kind: authorization
    condition: An installment plan is available only when billing_msr_nsf_returns_lookback does not exceed
      the plan's entry gate max_nsf_returns_12_months.
    evidence_fields:
    - billing_transactions.event_type
    - billing_transactions.return_reason
    - billing_plans.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.customer_id
      action_bindings:
        billing_plans.customer_id: customer_id
  - id: recurring_authorization
    applies_to:
    - billing_plan_enrolled
    kind: authorization
    condition: A Monthly EFT or Monthly Card Autopay plan is set up only after the customer has signed
      a recurring payment authorization for it.
    evidence_fields:
    - billing_authorizations.event_type
    - billing_authorizations.authorization_date
    - billing_authorizations.billing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_authorizations.billing_plan_id
      action_bindings:
        billing_authorizations.billing_plan_id: billing_plan_id
  - id: down_payment_method
    applies_to:
    - billing_down_payment_cleared
    kind: authorization
    condition: A new-business down payment is accepted only by a method in down_payment_methods.
    evidence_fields:
    - billing_transactions.payment_method
    - billing_transactions.installment_number
    - billing_transactions.billing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_transactions.billing_plan_id
      action_bindings:
        billing_transactions.billing_plan_id: billing_plan_id
  params:
    per_tier:
      Cardinal Point Paid-in-Full Plan:
        down_pct: =down_payment_pct_new_business
        renewal_down_pct: =down_payment_pct_renewal
      Cardinal Point Two-Pay Plan:
        down_pct: =down_payment_pct_new_business
        renewal_down_pct: =down_payment_pct_renewal
      Cardinal Point Four-Pay Plan:
        down_pct: =down_payment_pct_new_business
        renewal_down_pct: =down_payment_pct_renewal
      Cardinal Point Six-Pay Direct Bill Plan:
        down_pct: =down_payment_pct_new_business
        renewal_down_pct: =down_payment_pct_renewal
      Cardinal Point Monthly EFT Plan:
        down_pct: =down_payment_pct_new_business
        renewal_down_pct: =down_payment_pct_renewal
      Cardinal Point Monthly Card Autopay Plan:
        down_pct: =down_payment_pct_new_business
        renewal_down_pct: =down_payment_pct_renewal
    down_payment_methods: =down_payment_methods
  formula:
    down_payment_premium: round(term_premium_billed * down_pct / 100, 2)
- id: billing_installment_schedule
  subject:
  - billing_installment_billed
  rule: The premium remaining after the down payment premium is spread over installment_count equal installments
    rounded to the cent, the final installment absorbing any rounding difference. Installment 1 falls
    due first_installment_months_after_effective calendar months after the term effective date and each
    later installment installment_interval_months after the previous one, always on installment_due_day;
    in a month without that day the due date is the last calendar day of the month. Each invoice is issued
    invoice_lead_days calendar days before its due date and bills the installment premium, the plan's
    installment fee and every past-due amount still unpaid; its minimum_due is their sum. Only one installment
    invoice is issued per installment number of a plan. Credits on the plan reduce the next installments
    nearest first; an installment fully covered by credit before its invoice date is not invoiced. No
    installments exist on the Cardinal Point Paid-in-Full Plan.
  eligibility:
  - id: one_invoice_per_installment
    applies_to:
    - billing_installment_billed
    kind: dedup
    condition: Only one installment invoice is issued per installment number of a plan.
    evidence_fields:
    - billing_invoices.billing_plan_id
    - billing_invoices.installment_number
    - billing_invoices.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_invoices.billing_plan_id
      action_bindings:
        billing_invoices.billing_plan_id: billing_plan_id
    dedup_contract:
      table: billing_invoices
      mode: separate_record
      object_bindings:
        billing_plan_id: billing_plan_id
        installment_number: installment_number
      duplicate_filters:
        event_type:
        - billing_installment_billed
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Paid-in-Full Plan:
        installment_count: =installment_count
        first_installment_months: =first_installment_months_after_effective
        interval_months: =installment_interval_months
        invoice_lead_days: =invoice_lead_days
      Cardinal Point Two-Pay Plan:
        installment_count: =installment_count
        first_installment_months: =first_installment_months_after_effective
        interval_months: =installment_interval_months
        invoice_lead_days: =invoice_lead_days
      Cardinal Point Four-Pay Plan:
        installment_count: =installment_count
        first_installment_months: =first_installment_months_after_effective
        interval_months: =installment_interval_months
        invoice_lead_days: =invoice_lead_days
      Cardinal Point Six-Pay Direct Bill Plan:
        installment_count: =installment_count
        first_installment_months: =first_installment_months_after_effective
        interval_months: =installment_interval_months
        invoice_lead_days: =invoice_lead_days
      Cardinal Point Monthly EFT Plan:
        installment_count: =installment_count
        first_installment_months: =first_installment_months_after_effective
        interval_months: =installment_interval_months
        invoice_lead_days: =invoice_lead_days
      Cardinal Point Monthly Card Autopay Plan:
        installment_count: =installment_count
        first_installment_months: =first_installment_months_after_effective
        interval_months: =installment_interval_months
        invoice_lead_days: =invoice_lead_days
  formula:
    down_premium: round(term_premium_billed * down_pct / 100, 2)
    installment_premium: round((term_premium_billed - down_premium) / installment_count, 2)
- id: billing_installment_fee_rule
  subject:
  - billing_installment_fee
  rule: Each installment invoice carries the plan's installment_fee, charged on the invoice date. Only
    one installment fee is charged per installment invoice. No installment fee is charged on the down
    payment, on a final bill, on a renewal bill, on any plan without installments, or on an installment
    avoided by paying the whole balance before it was invoiced. After a mid-term plan switch, invoices
    issued from the switch date carry the new plan's fee; invoices already issued keep theirs.
  eligibility:
  - id: one_fee_per_invoice
    applies_to:
    - billing_installment_fee
    kind: dedup
    condition: Only one installment fee is charged per installment invoice.
    evidence_fields:
    - billing_transactions.related_invoice_id
    - billing_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_transactions.related_invoice_id
      action_bindings:
        billing_transactions.related_invoice_id: related_invoice_id
    dedup_contract:
      table: billing_transactions
      mode: separate_record
      object_bindings:
        related_invoice_id: related_invoice_id
      duplicate_filters:
        event_type:
        - billing_installment_fee
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Paid-in-Full Plan:
        installment_fee: =installment_fee
      Cardinal Point Two-Pay Plan:
        installment_fee: =installment_fee
      Cardinal Point Four-Pay Plan:
        installment_fee: =installment_fee
      Cardinal Point Six-Pay Direct Bill Plan:
        installment_fee: =installment_fee
      Cardinal Point Monthly EFT Plan:
        installment_fee: =installment_fee
      Cardinal Point Monthly Card Autopay Plan:
        installment_fee: =installment_fee
- id: billing_late_fee_rule
  subject:
  - billing_late_fee
  rule: A late fee is assessed only later than late_fee_grace_days calendar days after the due date of
    the installment, and only when that installment's minimum due is still not paid in full. Calendar
    days are counted from the due date as day 0; a payment posted on or before the due date plus the grace
    days is on time, and the fee may be assessed from the following day. No more than late_fee_max_per_installment
    late fee is charged for one installment invoice. Payment timeliness is judged by posted_date, except
    that a mailed payment whose postmark_date is on or before the due date plus the grace days counts
    as on time. No late fee is charged on the Cardinal Point Paid-in-Full Plan, on a final bill, or on
    an automatic draft that cleared on its draft date.
  eligibility:
  - id: after_grace
    applies_to:
    - billing_late_fee
    kind: time
    condition: A late fee is assessed only later than late_fee_grace_days calendar days after the due
      date of the installment, and only when that installment's minimum due is still not paid in full.
    evidence_fields:
    - billing_invoices.billing_invoice_id
    - billing_invoices.minimum_due
    - billing_invoices.due_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_invoices.billing_invoice_id
      action_bindings:
        billing_invoices.billing_invoice_id: billing_invoice_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the due date of the installment
      anchor_source: billing_invoices.due_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the due date as day 0; a payment posted on or before
        the due date plus the grace days is on time, and the fee may be assessed from the following day.
      boundary: exclusive
  - id: one_late_fee
    applies_to:
    - billing_late_fee
    kind: dedup
    condition: No more than late_fee_max_per_installment late fee is charged for one installment invoice.
    evidence_fields:
    - billing_transactions.related_invoice_id
    - billing_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_transactions.related_invoice_id
      action_bindings:
        billing_transactions.related_invoice_id: related_invoice_id
    dedup_contract:
      table: billing_transactions
      mode: separate_record
      object_bindings:
        related_invoice_id: related_invoice_id
      duplicate_filters:
        event_type:
        - billing_late_fee
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Paid-in-Full Plan:
        late_fee: =late_fee
        grace_days: =late_fee_grace_days
      Cardinal Point Two-Pay Plan:
        late_fee: =late_fee
        grace_days: =late_fee_grace_days
      Cardinal Point Four-Pay Plan:
        late_fee: =late_fee
        grace_days: =late_fee_grace_days
      Cardinal Point Six-Pay Direct Bill Plan:
        late_fee: =late_fee
        grace_days: =late_fee_grace_days
      Cardinal Point Monthly EFT Plan:
        late_fee: =late_fee
        grace_days: =late_fee_grace_days
      Cardinal Point Monthly Card Autopay Plan:
        late_fee: =late_fee
        grace_days: =late_fee_grace_days
    late_fee_max_per_installment: =late_fee_max_per_installment
- id: billing_fee_waivers
  subject:
  - billing_fee_waived
  rule: A waiver reverses one fee transaction for that fee's full amount and references it; partial waivers
    are not given. Each fee is waived at most once. courtesy_late_fee applies only to a late fee. A courtesy
    waiver is granted only while billing_msr_courtesy_waivers_in_term is below courtesy_waivers and billing_msr_nsf_returns_lookback
    is zero. postmark_on_time reverses a late fee charged on a mailed payment whose postmark was within
    the grace period; company_error reverses a fee charged contrary to these rules (for example a late
    fee on a payment posted within the grace period); duplicate_charge reverses a second charge of the
    same fee. Installment fees, NSF fees and agent-assisted payment fees are never waived as a courtesy.
  eligibility:
  - id: courtesy_limit
    applies_to:
    - billing_fee_waived
    kind: authorization
    condition: A courtesy waiver is granted only while billing_msr_courtesy_waivers_in_term is below courtesy_waivers
      and billing_msr_nsf_returns_lookback is zero.
    evidence_fields:
    - billing_transactions.waiver_reason
    - billing_transactions.event_type
    - billing_transactions.return_reason
    - billing_transactions.billing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_transactions.billing_plan_id
      action_bindings:
        billing_transactions.billing_plan_id: billing_plan_id
  - id: waive_once
    applies_to:
    - billing_fee_waived
    kind: dedup
    condition: Each fee is waived at most once.
    evidence_fields:
    - billing_transactions.reversed_fee_txn_id
    - billing_transactions.event_type
