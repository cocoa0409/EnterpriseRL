# Policy charter: Financial Responsibility Filings (SR-22 / FR-44) (category key: fr).
category: fr
display_name: Financial Responsibility Filings (SR-22 / FR-44)
binding:
  holding_table: fr_filings
  event_tables:
  - fr_filing_transactions
  - fr_filing_documents
  status_field: status
  variant_field: variant_name
  quantity_fields:
    fees_charged_total: filing_fees
lifecycle:
  states:
  - requested
  - filed
  - rejected
  - cancellation_filed
  - terminated
  - withdrawn
  transitions:
  - from: requested
    to: filed
    by: agent
    means: The certificate is transmitted and the state accepts it.
  - from: requested
    to: rejected
    by: system
    means: The state rejects the transmission.
  - from: rejected
    to: filed
    by: agent
    means: A corrected certificate is retransmitted and accepted.
  - from: requested
    to: withdrawn
    by: agent
    means: The request is withdrawn before acceptance.
  - from: rejected
    to: withdrawn
    by: agent
    means: A rejected request is not corrected in time or cannot be cured.
  - from: filed
    to: cancellation_filed
    by: agent
    means: An SR-26 is transmitted for the certificate.
  - from: cancellation_filed
    to: terminated
    by: system
    means: The certificate end date is reached.
accounts:
- key: filing_fees
  unit: USD
  meaning: Filing fees charged on the filing, net of reversals.
parameter_schema:
  certificate_form: State form the certificate is filed on.
  certificate_type: 'Coverage the certificate certifies: owner (scheduled vehicles), operator (the filer
    in non-owned vehicles) or owner_operator (both).'
  requirement_basis: Kind of state requirement the form answers.
  eligible_states: States with which the certificate can be filed.
  backing_policy_category: 'Product that must back the certificate: auto (Owner Auto Policy) or nonowner
    (Named Non-Owner Policy).'
  filer_must_be_named_insured: Whether the filed driver must be the named insured of the backing term
    (true/false).
  vehicle_scheduled_required: Whether the backing term must schedule at least one vehicle (true/false).
  covers_non_owned_vehicles: Whether the certificate certifies the filer while driving vehicles not scheduled
    on the backing term (true/false).
  required_limits_source: Schedule giving the BI per person/BI per accident/PD limits the backing term
    must carry for the filing state (single source in the Owner Auto Policy charter).
  minimum_backing_package_by_state: Mapping filing state -> lowest package of the backing product whose
    limits satisfy the requirement.
  filing_fee: Fee charged for one filing request, USD.
  fee_charged_filing_reasons: Filing reasons for which the filing fee is charged.
  fee_free_filing_reasons: Filing reasons for which no fee is charged.
  fee_waiver_reasons: Reasons for which a charged filing fee is reversed.
  fee_returned_on_cancellation: Whether a filing fee is returned when the backing term cancels after the
    certificate was transmitted (true/false).
  renewal_continuation_requires_new_filing: 'Whether a renewal of the backing policy needs a new filing
    (false: the certificate carries forward to the renewal term).'
  transmit_within_business_days: Business days after the filing request within which the certificate is
    transmitted to the state.
  business_day_calendar: Calendar used for business-day counts.
  transmission_method: How certificates and SR-26 notices reach the state.
  dmv_acknowledgment_business_days: Business days within which the state acknowledges (accepts or rejects)
    a transmission.
  rejection_correction_days: Calendar days after a state rejection within which a corrected filing must
    be transmitted; otherwise the request is withdrawn.
  correctable_rejection_reasons: State rejection reasons cured by correcting the filer data and retransmitting.
  limits_rejection_cure: How a policy_limits_insufficient rejection is cured.
  non_correctable_rejection_reasons: Rejection reasons that end the request (it is withdrawn).
  name_match_basis: Filer data that must match the state driver record exactly.
  filing_effective_date_rule: Effective date certified on the filing.
  sr26_trigger_events: Occurrences on which an SR-26 cancellation notice is transmitted.
  sr26_transmit_within_days: Calendar days after the triggering date within which the SR-26 is transmitted.
  sr26_never_before_trigger_date: Whether an SR-26 is never transmitted before the triggering date itself
    (true/false).
  certificate_runoff_days: Calendar days after the SR-26 transmission date on which the certificate stops
    certifying coverage with the state.
  release_requires_required_through_date_passed: Whether a release (requirement_completed SR-26) is transmitted
    only on or after required_through_date (true/false).
  release_requested_by: Who may request the release of a certificate at the end of the requirement.
  reinstatement_after_sr26_requires_new_filing: Whether a backing term reinstated after its SR-26 was
    transmitted needs a new filing (true/false).
  reinstatement_before_sr26_suppresses_sr26: Whether no SR-26 is sent when the backing term is reinstated
    (or the notice rescinded) before the SR-26 would be transmitted (true/false).
  filer_rated_required: Whether the filed driver must be a rated driver (never a named excluded driver)
    on an owner backing term (true/false).
  max_open_filings_per_driver_per_state: Open filings (requested, rejected, filed or cancellation_filed)
    allowed for one driver with one state.
  out_of_state_filing_allowed: Whether the filing state may differ from the garaging or residence state
    (true/false).
  out_of_state_limits_basis: Whose limits apply when the filing state differs from the garaging state.
  required_through_source: Where the end of the requirement period comes from.
  certificate_copy_fee: Fee for a copy of the filed certificate, USD.
  certificate_copy_channels: Channels through which a copy is delivered.
  certificate_copy_mail_business_days: Business days within which a mailed copy is sent.
  copy_available_statuses: Filing statuses in which a copy of the certificate may be issued.
  copy_recipients: Who may receive a copy.
  carrier_transfer_rule: Handling when the filer moves the requirement to this company from another carrier.
  fee_billing_rule: Where a filing fee is billed.
  filing_reason_codes: Controlled reasons a filing is requested.
  sr26_reason_codes: Controlled reasons for an SR-26.
variants:
- name: SR-22 Owner Certificate
  rank: 1
  entry_gate:
    filing_states: any served state
    backing_policy: Owner Auto Policy on which the filer is a rated driver
  parameters:
    certificate_form: SR-22
    certificate_type: owner
    requirement_basis: non_dui_financial_responsibility_requirement
    eligible_states:
    - FL
    - VA
    - TX
    - GA
    - AZ
    - OH
    backing_policy_category: auto
    filer_must_be_named_insured: false
    vehicle_scheduled_required: true
    covers_non_owned_vehicles: false
    required_limits_source: the Owner Auto Policy charter's state_minimum_limits
    minimum_backing_package_by_state:
      FL: Cardinal Point Minimum Limits Liability
      VA: Cardinal Point Minimum Limits Liability
      TX: Cardinal Point Minimum Limits Liability
      GA: Cardinal Point Minimum Limits Liability
      AZ: Cardinal Point Minimum Limits Liability
      OH: Cardinal Point Minimum Limits Liability
    filing_fee: 25.0
    fee_charged_filing_reasons:
    - new_requirement
    - reinstatement_refiling
    - state_change
    - carrier_transfer
    fee_free_filing_reasons:
    - corrected_refiling
    fee_waiver_reasons:
    - withdrawn_before_transmission
    - company_error
    - duplicate_request
    fee_returned_on_cancellation: false
    renewal_continuation_requires_new_filing: false
    transmit_within_business_days: 1
    business_day_calendar: monday_to_friday_excluding_new_years_memorial_independence_labor_thanksgiving_christmas
    transmission_method: electronic_state_interface
    dmv_acknowledgment_business_days: 3
    rejection_correction_days: 10
    correctable_rejection_reasons:
    - license_number_mismatch
    - name_mismatch
    - date_of_birth_mismatch
    limits_rejection_cure: backing_term_moved_to_minimum_backing_package_then_retransmitted
    non_correctable_rejection_reasons:
    - no_requirement_on_record
    name_match_basis:
    - filed_driver_name
    - filed_driver_license_number
    - filed_driver_date_of_birth
    filing_effective_date_rule: later_of_backing_term_effective_date_and_request_date
    sr26_trigger_events:
    - backing_term_cancelled
    - backing_term_expired_without_renewal
    - requirement_completed_release
    - filer_excluded_or_removed
    sr26_transmit_within_days: 3
    sr26_never_before_trigger_date: true
    certificate_runoff_days: 10
    release_requires_required_through_date_passed: true
    release_requested_by: named_insured_or_filed_driver
    reinstatement_after_sr26_requires_new_filing: true
    reinstatement_before_sr26_suppresses_sr26: true
    filer_rated_required: true
    max_open_filings_per_driver_per_state: 1
    out_of_state_filing_allowed: true
    out_of_state_limits_basis: filing_state_requirement
    required_through_source: state_order_recorded_as_required_through_date
    certificate_copy_fee: 0.0
    certificate_copy_channels:
    - email
    - mail
    - online_portal
    certificate_copy_mail_business_days: 2
    copy_available_statuses:
    - filed
    copy_recipients:
    - named_insured
    - filed_driver
    - court_or_attorney_designated_by_insured
    carrier_transfer_rule: new_filing_reason_carrier_transfer_prior_carrier_sends_its_own_sr26
    fee_billing_rule: on_the_backing_terms_billing_plan_with_the_down_payment_or_next_invoice
    filing_reason_codes:
    - new_requirement
    - reinstatement_refiling
    - state_change
    - carrier_transfer
    - corrected_refiling
    sr26_reason_codes:
    - policy_cancelled
    - policy_expired_not_renewed
    - requirement_completed
    - filer_excluded_or_removed
