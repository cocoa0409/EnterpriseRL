events:
- type: physdam_coverage_added
  target: physdam_coverages
  mutation: create
  meaning: Comprehensive and collision coverage is added for one scheduled vehicle of an owner term.
  grain: one row per vehicle coverage
  fields:
    customer_id: named insured
    auto_policy_id: owner term
    variant_name: deductible package
    vehicle_vin: VIN
    vehicle_description: vehicle
    vehicle_model_year: model year
    vehicle_value_at_binding: valuation
    loss_payee_name: loss payee
    loss_payee_type: loss payee kind
    opened_date: date added
    effective_date: first day
    expiration_date: owner term expiration
    inspection_due_date: inspection deadline
  triggers:
  - event: physdam:physdam_premium_written
    map:
      transaction_reason: coverage_added
- type: physdam_inspection_approved
  target: physdam_coverages
  mutation:
    transition:
      from: inspection_pending
      to: active
  meaning: The photo inspection is received and approved, or waived for a new vehicle.
  grain: one row per vehicle coverage
  fields:
    status: new lifecycle state
    inspection_completed_date: approval date (empty when waived)
    inspection_waived: waiver flag
  triggers: []
- type: physdam_coverage_removed
  target: physdam_coverages
  mutation:
    transition:
    - from: inspection_pending
      to: removed
    - from: active
      to: removed
  meaning: The coverage is removed for a missing inspection or at the named insured's request.
  grain: one row per vehicle coverage
  fields:
    status: new lifecycle state
    removal_reason: no_inspection or insured_request
    closed_date: removal effective date
  triggers:
  - event: physdam:physdam_premium_returned
    map:
      transaction_reason: removed_no_inspection
    when:
      removal_reason: no_inspection
  - event: physdam:physdam_premium_returned
    map:
      transaction_reason: coverage_removed
    when:
      removal_reason: insured_request
- type: physdam_coverage_terminated
  target: physdam_coverages
  mutation:
    transition:
    - from: active
      to: terminated
    - from: inspection_pending
      to: terminated
  meaning: The coverage ends because its owner term was cancelled.
  grain: one row per vehicle coverage
  fields:
    status: new lifecycle state
    closed_date: owner term cancellation effective date
  triggers:
  - event: physdam:physdam_premium_returned
    map:
      transaction_reason: owner_term_cancelled
- type: physdam_coverage_restored
  target: physdam_coverages
  mutation:
    transition:
      from: terminated
      to: active
  meaning: The coverage is restored because its owner term was reinstated.
  grain: one row per vehicle coverage
  fields:
    status: new lifecycle state
    closed_date: cleared
  triggers:
  - event: physdam:physdam_premium_written
    map:
      transaction_reason: owner_term_reinstated
- type: physdam_coverage_expired
  target: physdam_coverages
  mutation:
    transition:
      from: active
      to: expired
  meaning: The coverage expires with its owner term.
  grain: one row per vehicle coverage
  fields:
    status: new lifecycle state
    closed_date: expiration date
  triggers: []
- type: physdam_package_changed
  target: physdam_coverages
  mutation: update
  meaning: The deductible package or the loss payee of an open coverage is changed.
  grain: one row per vehicle coverage
  triggers: []
  fields:
    variant_name: new package
    loss_payee_name: loss payee
    loss_payee_type: kind
- type: physdam_premium_written
  target: physdam_premium_transactions
  meaning: Coverage premium is charged for the vehicle from the coverage effective date or restoration
    date.
  grain: one row per charge
  distinguish_by:
  - transaction_reason
  - effective_date
  fields:
    transaction_date: processing date
    effective_date: coverage date
    amount: positive amount
    vehicle_term_coverage_premium: full-term coverage premium
    premium_days: days
    owner_term_days: owner term days
    transaction_reason: reason
  account: coverage_premium
  direction: in
  triggers: []
- type: physdam_premium_returned
  target: physdam_premium_transactions
  meaning: Unearned coverage premium is returned on removal or termination.
  grain: one row per return
  distinguish_by:
  - transaction_reason
  - effective_date
  fields:
    transaction_date: processing date
    effective_date: coverage date
    amount: positive amount
    vehicle_term_coverage_premium: full-term coverage premium
    premium_days: days
    owner_term_days: owner term days
    transaction_reason: reason
  account: coverage_premium
  direction: out
  triggers: []
- type: physdam_claim_reported
  target: physdam_claim_events
  meaning: A comprehensive or collision loss is reported and a claim number assigned.
  grain: one row per claim
  distinguish_by:
  - claim_number
  fields:
    claim_number: claim number
    entry_date: entry date
    date_of_loss: date of loss
    loss_cause: cause
    auto_policy_id: owner term
    driver_name: operator
    driver_household_status: operator standing
    police_report_number: police report
    rideshare_use_at_loss: platform use
  triggers: []
- type: physdam_coverage_confirmed
  target: physdam_claim_events
  meaning: The claim is accepted as covered.
  grain: one row per claim decision
  distinguish_by:
  - claim_number
  fields:
    claim_number: claim number
    entry_date: entry date
    date_of_loss: date of loss
    loss_cause: cause
  triggers: []
- type: physdam_coverage_denied
  target: physdam_claim_events
  meaning: The claim is denied with a recorded reason.
  grain: one row per claim decision
  distinguish_by:
  - claim_number
  fields:
    claim_number: claim number
    entry_date: entry date
    date_of_loss: date of loss
    loss_cause: cause
    denial_reason: reason
  triggers: []
- type: physdam_estimate_recorded
  target: physdam_claim_events
  meaning: An appraisal estimate or supplement is recorded on the claim.
  grain: one row per estimate or supplement
  distinguish_by:
  - claim_number
  - estimate_sequence
  fields:
    claim_number: claim number
    entry_date: entry date
    date_of_loss: date of loss
    loss_cause: cause
    estimate_sequence: sequence
    repair_estimate_amount: cumulative repair estimate
    acv_amount: ACV
    salvage_value: salvage bid
  triggers: []
- type: physdam_total_loss_declared
  target: physdam_claim_events
  meaning: The vehicle is declared a total loss (or an unrecovered theft is settled as one).
  grain: one row per claim
  distinguish_by:
  - claim_number
  fields:
    claim_number: claim number
    entry_date: entry date
    date_of_loss: date of loss
    loss_cause: cause
    acv_amount: ACV
    salvage_value: salvage bid
    loss_payee_payoff_amount: payoff
  triggers: []
- type: physdam_repair_payment
  target: physdam_claim_payments
  meaning: A repair payment (first estimate or supplement) is issued.
  grain: one row per estimate or supplement paid
  distinguish_by:
  - claim_number
  - estimate_sequence
  fields:
    claim_number: claim
    payment_date: date
    amount: positive amount
    payee_type: payee
    deductible_applied: deductible
    estimate_sequence: estimate paid
  account: net_loss_paid
  direction: in
  triggers: []
- type: physdam_total_loss_payment
  target: physdam_claim_payments
  meaning: A total loss settlement payment is issued to a payee.
  grain: one row per payee of the settlement
  distinguish_by:
  - claim_number
  - payee_type
  fields:
    claim_number: claim
    payment_date: date
    amount: positive amount
    payee_type: payee
    deductible_applied: deductible
    sales_tax_amount: tax
    title_fee_amount: title fee
  account: net_loss_paid
  direction: in
  triggers: []
- type: physdam_tow_storage_payment
  target: physdam_claim_payments
  meaning: Towing from the scene or storage charges are paid.
  grain: one row per vendor invoice
  distinguish_by:
  - claim_number
  - payment_date
  fields:
    claim_number: claim
    payment_date: date
    amount: positive amount
    payee_type: payee
  account: net_loss_paid
  direction: in
  triggers: []
- type: physdam_deductible_reimbursement
  target: physdam_claim_payments
  meaning: The deductible share of a subrogation recovery is returned to the named insured.
  grain: one row per reimbursement
  distinguish_by:
  - claim_number
  - payment_date
  fields:
    claim_number: claim
    payment_date: date
    amount: positive amount
    payee_type: payee
  account: net_loss_paid
  direction: in
  triggers: []
- type: physdam_salvage_recovery
  target: physdam_claim_payments
  meaning: Salvage proceeds are received for a total-loss vehicle.
  grain: one row per salvage sale
  distinguish_by:
  - claim_number
  fields:
    claim_number: claim
    payment_date: date
    amount: positive amount
    payee_type: payee
  account: net_loss_paid
  direction: out
  triggers: []
- type: physdam_subrogation_recovery
  target: physdam_claim_payments
  meaning: A recovery is received from an at-fault party's insurer.
  grain: one row per recovery received
  distinguish_by:
  - claim_number
  - payment_date
  fields:
    claim_number: claim
    payment_date: date
    amount: positive amount
    payee_type: payee
  account: net_loss_paid
  direction: out
  triggers: []
measures:
- id: physdam_msr_paid_on_claim
  window: the life of the claim number
  measure: sum of amount of physdam_claim_payments rows with event_type physdam_repair_payment, physdam_total_loss_payment
    or physdam_tow_storage_payment on this claim_number
policies:
- id: physdam_agg_multi_holding
  subject:
  - physdam_coverage_added
  rule: A named insured may carry physical damage coverage on any number of vehicles, so max_per_customer
    is unlimited, one coverage per scheduled vehicle. A vehicle carries at most one physical damage coverage
    per owner term. The coverage belongs to one owner term; a renewal term carries its own coverage record
    for each vehicle renewed with it.
  eligibility:
  - id: one_per_vehicle_term
    applies_to:
    - physdam_coverage_added
    kind: dedup
    condition: A vehicle carries at most one physical damage coverage per owner term.
    evidence_fields:
    - physdam_coverages.vehicle_vin
    - physdam_coverages.status
    - physdam_coverages.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.auto_policy_id
      action_bindings:
        physdam_coverages.auto_policy_id: auto_policy_id
    dedup_contract:
      table: physdam_coverages
      mode: separate_record
      object_bindings:
        auto_policy_id: auto_policy_id
        vehicle_vin: vehicle_vin
      duplicate_filters:
        status:
        - inspection_pending
        - active
        - terminated
      distinct_fields: []
  params:
    max_per_customer: null
    max_coverages_per_vehicle: =max_coverages_per_vehicle
- id: physdam_agg_multi_vehicle_loss
  subject:
  - physdam_claim_reported
  - physdam_repair_payment
  - physdam_total_loss_payment
  rule: When one occurrence damages two or more vehicles covered for the same named insured (a hailstorm,
    a flood, or a collision between two of the household's own vehicles), the losses are handled vehicle
    by vehicle. Each damaged vehicle of one occurrence is its own claim with its own claim number and
    its own deductible under its own package. Deductibles are never combined or waived because several
    vehicles were damaged, and a collision between two of the named insured's own vehicles is a collision
    loss on each of them.
  eligibility:
  - id: per_vehicle_claim
    applies_to:
    - physdam_claim_reported
    kind: authorization
    condition: Each damaged vehicle of one occurrence is its own claim with its own claim number and its
      own deductible under its own package.
    evidence_fields:
    - physdam_claim_events.claim_number
    - physdam_claim_events.date_of_loss
    - physdam_claim_events.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.physdam_coverage_id
      action_bindings:
        physdam_claim_events.physdam_coverage_id: physdam_coverage_id
  params:
    deductible_application_rule: =deductible_application_rule
- id: physdam_eligibility
  subject:
  - physdam_coverage_added
  - physdam_package_changed
  rule: Coverage is added only to an owner term whose status is bound or in_force. The vehicle must be
    scheduled on that owner term. The vehicle's model year must be within the package's max_age model
    years and its value at binding between the package's min_value and max_value. A vehicle with a lienholder
    or lessor as loss payee may carry only a package whose deductibles do not exceed lienholder_max_deductible.
    Coverage added mid-term takes effect on the date requested, never earlier than the request; a package
    change takes effect on the date requested and is re-rated, and the same limits apply to it. Physical
    damage is never added to a Named Non-Owner Policy.
  eligibility:
  - id: owner_term_open
    applies_to:
    - physdam_coverage_added
    kind: state
    condition: Coverage is added only to an owner term whose status is bound or in_force.
    evidence_fields:
    - auto_policies.status
    - physdam_coverages.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.auto_policy_id
      action_bindings:
        physdam_coverages.auto_policy_id: auto_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - bound
      - in_force
  - id: vehicle_limits
    applies_to:
    - physdam_coverage_added
    - physdam_package_changed
    kind: authorization
    condition: The vehicle's model year must be within the package's max_age model years and its value
      at binding between the package's min_value and max_value.
    evidence_fields:
    - physdam_coverages.vehicle_model_year
    - physdam_coverages.vehicle_value_at_binding
    - physdam_coverages.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.physdam_coverage_id
      action_bindings:
        physdam_coverages.physdam_coverage_id: physdam_coverage_id
  - id: lienholder_deductible
    applies_to:
    - physdam_coverage_added
    - physdam_package_changed
    kind: authorization
    condition: A vehicle with a lienholder or lessor as loss payee may carry only a package whose deductibles
      do not exceed lienholder_max_deductible.
    evidence_fields:
    - physdam_coverages.loss_payee_type
    - physdam_coverages.variant_name
    - physdam_coverages.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.physdam_coverage_id
      action_bindings:
        physdam_coverages.physdam_coverage_id: physdam_coverage_id
  params:
    per_tier:
      Cardinal Point Physical Damage $2,500 Deductible:
        max_age: =max_vehicle_age_model_years
        min_value: =min_vehicle_value
        max_value: =max_vehicle_value
      Cardinal Point Physical Damage $2,000 Deductible:
        max_age: =max_vehicle_age_model_years
        min_value: =min_vehicle_value
        max_value: =max_vehicle_value
      Cardinal Point Physical Damage $1,500 Deductible:
        max_age: =max_vehicle_age_model_years
        min_value: =min_vehicle_value
        max_value: =max_vehicle_value
      Cardinal Point Physical Damage $1,000 Deductible:
        max_age: =max_vehicle_age_model_years
        min_value: =min_vehicle_value
        max_value: =max_vehicle_value
      Cardinal Point Physical Damage $500 Deductible:
        max_age: =max_vehicle_age_model_years
        min_value: =min_vehicle_value
        max_value: =max_vehicle_value
      Cardinal Point Physical Damage $250 Comprehensive / $500 Collision Deductible:
        max_age: =max_vehicle_age_model_years
        min_value: =min_vehicle_value
        max_value: =max_vehicle_value
    lienholder_max_deductible: =lienholder_max_deductible
- id: physdam_inspection_rule
  subject:
  - physdam_inspection_approved
  - physdam_coverage_removed
  rule: Every added coverage needs a photo inspection made of inspection_photo_set, except that it is
    waived for a new vehicle with a dealer bill of sale dated within 7 days of the coverage effective
    date. An inspection is approved no later than the inspection due date of the coverage. The inspection
    due date is the coverage effective date plus inspection_days calendar days, the effective date being
    day 0; approval on the due date itself qualifies. When no approved inspection is received by the due
    date, the coverage is removed effective 12:01 a.m. on the day after the due date and its premium from
    that date is returned. A loss before the inspection was approved is covered for the damage from that
    loss, but no payment is issued until the inspection photos are received. The named insured may also
    ask to remove the coverage at any time, effective no earlier than the request. A coverage with a loss
    payee is removed no earlier than loss_payee_notice_days calendar days after the loss payee was notified.
  eligibility:
  - id: inspection_on_time
    applies_to:
    - physdam_inspection_approved
    kind: time
    condition: An inspection is approved no later than the inspection due date of the coverage.
    evidence_fields:
    - physdam_coverages.effective_date
    - physdam_coverages.inspection_due_date
    - physdam_coverages.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.physdam_coverage_id
      action_bindings:
        physdam_coverages.physdam_coverage_id: physdam_coverage_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the inspection due date of the coverage
      anchor_source: physdam_coverages.inspection_due_date
      relation: not_after
      duration_source: params.inspection_due_lag_days
      unit: calendar_days
      counting_rule: The inspection due date is the coverage effective date plus inspection_days calendar
        days, the effective date being day 0; approval on the due date itself qualifies.
      boundary: inclusive
  - id: loss_payee_notice
    applies_to:
    - physdam_coverage_removed
    kind: authorization
    condition: A coverage with a loss payee is removed no earlier than loss_payee_notice_days calendar
      days after the loss payee was notified.
    evidence_fields:
    - physdam_coverages.loss_payee_type
    - physdam_coverages.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.physdam_coverage_id
      action_bindings:
        physdam_coverages.physdam_coverage_id: physdam_coverage_id
  params:
    per_tier:
      Cardinal Point Physical Damage $2,500 Deductible:
        inspection_days: =inspection_due_days
      Cardinal Point Physical Damage $2,000 Deductible:
        inspection_days: =inspection_due_days
      Cardinal Point Physical Damage $1,500 Deductible:
        inspection_days: =inspection_due_days
      Cardinal Point Physical Damage $1,000 Deductible:
        inspection_days: =inspection_due_days
      Cardinal Point Physical Damage $500 Deductible:
        inspection_days: =inspection_due_days
      Cardinal Point Physical Damage $250 Comprehensive / $500 Collision Deductible:
        inspection_days: =inspection_due_days
    inspection_due_lag_days: 0
    loss_payee_notice_days: =loss_payee_notice_days
    inspection_waiver_rule: =inspection_waiver_rule
- id: physdam_term_link
  subject:
  - physdam_coverage_terminated
  - physdam_coverage_restored
  - physdam_coverage_expired
  rule: The coverage follows its owner term. The coverage is terminated only when its owner term has been
    cancelled. It ends on the owner term's cancellation effective date, and its unearned premium is returned
    pro rata. The coverage is restored only when its owner term has been reinstated. A restored coverage
    has the same lapse as the owner term, with no coverage inside it; a reinstatement without lapse restores
    it from the cancellation date. The coverage expires on the owner term's expiration date.
  eligibility:
  - id: owner_cancelled
    applies_to:
    - physdam_coverage_terminated
    kind: state
    condition: The coverage is terminated only when its owner term has been cancelled.
    evidence_fields:
    - auto_policies.status
    - physdam_coverages.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.auto_policy_id
      action_bindings:
        physdam_coverages.auto_policy_id: auto_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - cancelled
  - id: owner_reinstated
    applies_to:
    - physdam_coverage_restored
    kind: authorization
    condition: The coverage is restored only when its owner term has been reinstated.
    evidence_fields:
    - auto_policies.reinstatement_date
    - auto_policies.status
    - physdam_coverages.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.auto_policy_id
      action_bindings:
        physdam_coverages.auto_policy_id: auto_policy_id
  params:
    coverage_follows_owner_term: =coverage_follows_owner_term
    restored_coverage_lapse_rule: =restored_coverage_lapse_rule
- id: physdam_premium_rule
  subject:
  - physdam_premium_written
  - physdam_premium_returned
  rule: Coverage premium is booked only while the coverage is inspection_pending, active, removed or terminated.
    The charge is vehicle_term_coverage_premium multiplied by the days from the coverage effective date
    (or restoration date) to the owner term expiration date and divided by owner_term_days (the owner
    term's term_days); a return uses the days from the removal or termination date to the expiration date.
    Amounts are rounded to the cent and billed on the owner term's billing plan.
  eligibility:
  - id: coverage_status
    applies_to:
    - physdam_premium_written
    - physdam_premium_returned
    kind: state
    condition: Coverage premium is booked only while the coverage is inspection_pending, active, removed
      or terminated.
    evidence_fields:
    - physdam_coverages.status
    - physdam_coverages.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_coverages.physdam_coverage_id
      action_bindings:
        physdam_coverages.physdam_coverage_id: physdam_coverage_id
    state_contract:
      field: physdam_coverages.status
      allowed:
      - inspection_pending
      - active
      - removed
      - terminated
  formula:
    prorated_premium: round(vehicle_term_coverage_premium * premium_days / owner_term_days, 2)
- id: physdam_claim_reporting
  subject:
  - physdam_claim_reported
  rule: A claim is reported by the named insured or a person acting for them and receives a claim number;
    the date of loss, the cause and the person operating the vehicle are recorded exactly as reported.
    Only one claim is opened per vehicle per occurrence. Hitting an animal is a comprehensive loss; any
    other impact with a vehicle or object is a collision loss. A theft or vandalism claim is opened only
    with a police report number. A claim reported more than late_report_review_days calendar days after
    the date of loss is referred to the special investigations unit before any coverage decision. Such
    a referral is a handoff, not a desk decision.
  eligibility:
  - id: one_claim
    applies_to:
    - physdam_claim_reported
    kind: dedup
    condition: Only one claim is opened per vehicle per occurrence.
    evidence_fields:
    - physdam_claim_events.date_of_loss
    - physdam_claim_events.event_type
    - physdam_claim_events.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.physdam_coverage_id
      action_bindings:
        physdam_claim_events.physdam_coverage_id: physdam_coverage_id
    dedup_contract:
      table: physdam_claim_events
      mode: separate_record
      object_bindings:
        physdam_coverage_id: physdam_coverage_id
        date_of_loss: date_of_loss
      duplicate_filters:
        event_type:
        - physdam_claim_reported
      distinct_fields: []
  - id: police_report
    applies_to:
    - physdam_claim_reported
    kind: caller_fact
    condition: A theft or vandalism claim is opened only with a police report number.
    evidence_fields:
    - physdam_claim_events.police_report_number
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
  - id: late_report
    applies_to:
    - physdam_claim_reported
    kind: authorization
    condition: A claim reported more than late_report_review_days calendar days after the date of loss
      is referred to the special investigations unit before any coverage decision.
    evidence_fields:
    - physdam_claim_events.date_of_loss
    - physdam_claim_events.entry_date
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
  params:
    late_report_review_days: =late_report_review_days
    animal_collision_classification: =animal_collision_classification
    theft_police_report_required: =theft_police_report_required
- id: physdam_coverage_decision
  subject:
  - physdam_coverage_confirmed
  - physdam_coverage_denied
  rule: 'A coverage decision is made once per claim, confirmed or denied, and every denial records the
    first reason that applies in this order: excluded_driver_operating, unlisted_resident_driver, loss_during_lapse,
    loss_outside_coverage_period, no_police_report, rideshare_delivery_use. The date of loss must fall
    on or after the coverage effective date and before the coverage closed_date. A loss whose date of
    loss falls inside a lapse of the owner term (from lapse_start_date through lapse_end_date) is not
    covered. The caller states who was operating the vehicle at the time of loss. A loss while a named
    excluded driver of the owner term operates the vehicle is not covered. The driver''s standing is read
    from the owner term''s driver changes as of the date of loss: the latest change on or before that
    date for that driver decides. A loss while a household resident who is neither a rated driver nor
    a named excluded driver operates the vehicle is not covered. A permissive user who does not live in
    the household is covered. A loss while the vehicle is used on a ride-hailing or delivery platform
    is not covered. A theft or vandalism claim without a police report is denied.'
  eligibility:
  - id: in_coverage_period
    applies_to:
    - physdam_coverage_confirmed
    kind: authorization
    condition: The date of loss must fall on or after the coverage effective date and before the coverage
      closed_date.
    evidence_fields:
    - physdam_coverages.effective_date
    - physdam_coverages.closed_date
    - physdam_claim_events.date_of_loss
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
  - id: not_in_lapse
    applies_to:
    - physdam_coverage_confirmed
    kind: authorization
    condition: A loss whose date of loss falls inside a lapse of the owner term (from lapse_start_date
      through lapse_end_date) is not covered.
    evidence_fields:
    - auto_policies.lapse_start_date
    - auto_policies.lapse_end_date
    - physdam_claim_events.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.auto_policy_id
      action_bindings:
        physdam_claim_events.auto_policy_id: auto_policy_id
  - id: operator_stated
    applies_to:
    - physdam_coverage_confirmed
    - physdam_coverage_denied
    kind: caller_fact
    condition: The caller states who was operating the vehicle at the time of loss.
    evidence_fields:
    - physdam_claim_events.driver_name
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
  - id: not_excluded_driver
    applies_to:
    - physdam_coverage_confirmed
    kind: authorization
    condition: A loss while a named excluded driver of the owner term operates the vehicle is not covered.
    evidence_fields:
    - auto_policy_changes.driver_name
    - auto_policy_changes.event_type
    - auto_policy_changes.change_effective_date
    - auto_policy_changes.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.auto_policy_id
      action_bindings:
        auto_policy_changes.auto_policy_id: auto_policy_id
  - id: not_unlisted_resident
    applies_to:
    - physdam_coverage_confirmed
    kind: authorization
    condition: A loss while a household resident who is neither a rated driver nor a named excluded driver
      operates the vehicle is not covered.
    evidence_fields:
    - physdam_claim_events.driver_household_status
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
  params:
    excluded_driver_loss_covered: =excluded_driver_loss_covered
    unlisted_resident_driver_loss_covered: =unlisted_resident_driver_loss_covered
    lapse_loss_covered: =lapse_loss_covered
    rideshare_delivery_use_covered: =rideshare_delivery_use_covered
- id: physdam_valuation
  subject:
  - physdam_estimate_recorded
  - physdam_total_loss_declared
  rule: Each estimate or supplement records the cumulative repair estimate, the actual cash value by acv_valuation_method
    and the salvage bid. A vehicle is declared a total loss only when the garaging state's test in total_loss_threshold_by_state
    is met by the latest estimate. An unrecovered stolen vehicle is declared a total loss at the end of
    the theft waiting period. A vehicle that is not a total loss is repaired, and supplements are recorded
    with the next estimate_sequence.
  eligibility:
  - id: threshold_met
    applies_to:
    - physdam_total_loss_declared
    kind: authorization
    condition: A vehicle is declared a total loss only when the garaging state's test in total_loss_threshold_by_state
      is met by the latest estimate.
    evidence_fields:
    - physdam_claim_events.repair_estimate_amount
    - physdam_claim_events.acv_amount
    - physdam_claim_events.salvage_value
    - auto_policies.garaging_state
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
  params:
    total_loss_threshold_by_state: =total_loss_threshold_by_state
    acv_valuation_method: =acv_valuation_method
    supplement_rule: =supplement_rule
- id: physdam_settlement
  subject:
  - physdam_repair_payment
  - physdam_total_loss_payment
  - physdam_tow_storage_payment
  rule: A claim payment is issued only after a coverage confirmation is recorded for the claim. The deductible
    is the package's collision_deductible for a collision cause and comprehensive_deductible for any comprehensive
    cause, applied once per claim; no deductible applies to windshield repair or replacement in windshield_zero_deductible_states,
    nor to glass that is repaired rather than replaced. A repair payment is the latest cumulative repair
    estimate less the deductible less repair payments already made on the claim. A total loss settlement
    is the actual cash value less the deductible, plus the garaging state's sales_tax_rate_by_state percent
    of the actual cash value and its title_fee_by_state, less the salvage value when the named insured
    keeps the vehicle; it is paid first to the loss payee up to the payoff amount and the rest to the
    named insured. An unrecovered theft is settled no earlier than theft_waiting_period_days calendar
    days after the theft was reported. Calendar days are counted from the report date as day 0; settlement
    on or after the report date plus the waiting days qualifies. Towing from the scene is paid up to tow_limit
    per loss and storage through storage_paid_through_days_after_notice days after the release notice.
    Payments are issued within payment_issue_days of agreement, and the total paid on a claim, measured
    by physdam_msr_paid_on_claim, never exceeds the total loss settlement amount plus towing and storage.
  eligibility:
  - id: confirmed_first
    applies_to:
    - physdam_repair_payment
    - physdam_total_loss_payment
    - physdam_tow_storage_payment
    kind: authorization
    condition: A claim payment is issued only after a coverage confirmation is recorded for the claim.
    evidence_fields:
    - physdam_claim_events.event_type
    - physdam_claim_events.claim_number
    - physdam_claim_payments.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_payments.claim_number
      action_bindings:
        physdam_claim_payments.claim_number: claim_number
  - id: theft_wait
    applies_to:
    - physdam_total_loss_payment
    kind: time
    condition: An unrecovered theft is settled no earlier than theft_waiting_period_days calendar days
      after the theft was reported.
    evidence_fields:
    - physdam_claim_events.loss_cause
    - physdam_claim_events.entry_date
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the theft was reported
      anchor_source: physdam_claim_events.entry_date
      relation: not_before
      duration_source: variants.theft_waiting_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the report date as day 0; settlement on or after the
        report date plus the waiting days qualifies.
      boundary: inclusive
  params:
    per_tier:
      Cardinal Point Physical Damage $2,500 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $2,000 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $1,500 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $1,000 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $500 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $250 Comprehensive / $500 Collision Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
    sales_tax_rate_by_state: =sales_tax_rate_by_state
    title_fee_by_state: =title_fee_by_state
    windshield_zero_deductible_states: =windshield_zero_deductible_states
  formula:
    repair_payment: round(max(0, repair_estimate_amount - deductible_applied), 2)
    total_loss_settlement: round(acv_amount - deductible_applied + acv_amount * sales_tax_rate_by_state
      / 100 + title_fee_by_state, 2)
  measures:
  - physdam_msr_paid_on_claim
- id: physdam_recoveries
  subject:
  - physdam_salvage_recovery
  - physdam_subrogation_recovery
  - physdam_deductible_reimbursement
  rule: Salvage proceeds and subrogation recoveries reduce the net loss paid. A deductible reimbursement
    is made only after a subrogation recovery has been received on the claim. The named insured's deductible
    is returned in proportion to the share of total damages (payments plus deductible) recovered, rounded
    to the cent, and in full when the recovery is full; a salvage sale never returns any deductible.
  eligibility:
  - id: recovery_first
    applies_to:
    - physdam_deductible_reimbursement
    kind: authorization
    condition: A deductible reimbursement is made only after a subrogation recovery has been received
      on the claim.
    evidence_fields:
    - physdam_claim_payments.event_type
    - physdam_claim_payments.amount
    - physdam_claim_payments.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_payments.claim_number
      action_bindings:
        physdam_claim_payments.claim_number: claim_number
  params:
    deductible_reimbursement_basis: =deductible_reimbursement_basis
