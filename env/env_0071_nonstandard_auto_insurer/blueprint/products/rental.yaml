# Policy charter: Rental Reimbursement Coverage (category key: rental).
category: rental
display_name: Rental Reimbursement Coverage
binding:
  holding_table: rental_coverages
  event_tables:
  - rental_premium_transactions
  - rental_benefit_transactions
  - rental_authorizations
  status_field: status
  variant_field: variant_name
  quantity_fields:
    term_coverage_premium: coverage_premium
    benefits_paid_total: rental_benefit
lifecycle:
  states:
  - scheduled
  - active
  - removed
  - terminated
  - expired
  transitions:
  - from: scheduled
    to: active
    by: system
    means: The effective date is reached.
  - from: scheduled
    to: removed
    by: agent
    means: The named insured removes it before it starts.
  - from: active
    to: removed
    by: agent
    means: The named insured removes it.
  - from: active
    to: terminated
    by: agent
    means: The physical damage coverage or owner term ended.
  - from: terminated
    to: active
    by: agent
    means: The physical damage coverage is restored.
  - from: active
    to: expired
    by: system
    means: The owner term expires.
accounts:
- key: coverage_premium
  unit: USD
  meaning: Net rental reimbursement premium on the vehicle coverage.
- key: rental_benefit
  unit: USD
  meaning: Rental benefits paid on the coverage net of reversals.
parameter_schema:
  daily_limit: Most paid for one rental day, USD (taxes on the rental included).
  max_per_loss: Most paid for one covered loss, USD.
  max_days_per_loss: Most rental days paid for one covered loss.
  covered_loss_types: Physical damage losses for which rental is paid.
  requires_physical_damage_coverage: Whether the vehicle must carry Cardinal Point physical damage coverage
    (true/false).
  requires_confirmed_physdam_claim: Whether rental is paid only on a physical damage claim confirmed as
    covered (true/false).
  theft_waiting_hours: Elapsed hours after a theft is reported to the company before rental for a stolen
    vehicle starts.
  non_theft_start_rule: First rental day for a loss other than theft.
  repair_end_rule: Last rental day for a repaired vehicle.
  total_loss_extra_days: Rental days still paid after the day the total loss settlement offer is made.
  theft_recovery_end_rule: Last rental day when a stolen vehicle is recovered.
  day_count_basis: How rental days are counted.
  partial_day_rule: Treatment of a partial rental day.
  network_direct_bill: Whether network rental agencies bill the company directly (true/false).
  authorization_required: Whether a rental authorization must be issued before a network rental starts
    (true/false).
  authorization_pickup_days: Calendar days after the authorization within which the rental must be picked
    up.
  non_network_receipt_days: Calendar days after the rental ends within which receipts for a non-network
    rental must be submitted.
  receipts_required: Whether itemized receipts are required for any reimbursement to the named insured
    (true/false).
  rideshare_or_transit_substitute_allowed: Whether ride-hailing or public transit fares are reimbursed
    instead of a rental, within the daily limit (true/false).
  mileage_charges_covered: Whether mileage charges are covered (false).
  fuel_covered: Whether fuel is covered (false).
  rental_damage_waiver_covered: Whether a rental company's damage waiver is covered (false).
  vehicle_class_rule: Class of rental vehicle paid.
  over_limit_handling: Handling of rental charges above the daily limit.
  parts_delay_extension: Whether days beyond max_days_per_loss are paid for parts delays (false).
  deductible: Deductible applied to rental benefits, USD.
  multiple_loss_rule: How separate losses are capped.
  benefit_payee_rule: Who is paid.
  benefit_reversal_reasons: Reasons a paid rental benefit is reversed.
  max_coverages_per_vehicle: Rental coverages per vehicle per owner term.
  coverage_follows_physdam: Whether the coverage ends and is restored with the vehicle's physical damage
    coverage (true/false).
  add_effective_rule: Effective date of a coverage added mid-term.
  removal_effective_rule: Effective date of a removal.
  loss_before_removal_rule: Treatment of a loss before the coverage was removed.
  lapse_loss_covered: Whether a loss inside a lapse of the owner term is covered (false).
  loss_before_add_covered: Whether a loss before the coverage effective date is covered (false).
  premium_basis: How premium is charged.
  premium_rounding: Rounding of premium and benefits.
  claim_number_required: Whether every benefit references the physical damage claim number (true/false).
  authorization_channels: Channels through which a rental authorization is issued.
  delivery_to_repair_facility: Whether a network agency may deliver the rental to the repair facility
    (true/false).
  reimbursement_issue_days: Calendar days after complete receipts within which a reimbursement is issued.
  one_rental_at_a_time: Whether only one rental vehicle is paid at a time per covered loss (true/false).
  rental_taxes_within_limit: Whether rental taxes and airport fees count within the daily limit (true/false).
  benefit_payment_cycle: How network rental invoices are paid.
  coverage_parts: Coverage parts provided.
  total_loss_offer_basis: Date that starts the total-loss extra days.
  excluded_driver_loss_covered: Whether rental is paid for a loss denied under physical damage (false).
variants:
- name: Cardinal Point Rental Reimbursement $20/$600
  rank: 1
  entry_gate: &id001
    requires: physical damage coverage on the same vehicle
    lowest_physical_damage_package: any
  parameters:
    daily_limit: 20.0
    max_per_loss: 600.0
    max_days_per_loss: 30
    covered_loss_types: &id002
    - collision
    - comprehensive
    requires_physical_damage_coverage: true
    requires_confirmed_physdam_claim: true
    theft_waiting_hours: 48
    non_theft_start_rule: date_the_vehicle_is_left_at_the_repair_facility_or_the_date_of_loss_when_not_drivable
    repair_end_rule: day_the_repair_facility_reports_the_vehicle_ready
    total_loss_extra_days: 3
    theft_recovery_end_rule: day_after_recovery_when_undamaged_otherwise_the_repair_end_rule
    day_count_basis: calendar_days_from_pick_up_date_through_the_day_before_return
    partial_day_rule: any_part_of_a_calendar_day_counts_as_one_day
    network_direct_bill: true
    authorization_required: true
    authorization_pickup_days: 7
    non_network_receipt_days: 60
    receipts_required: true
    rideshare_or_transit_substitute_allowed: true
    mileage_charges_covered: false
    fuel_covered: false
    rental_damage_waiver_covered: false
    vehicle_class_rule: comparable_to_the_damaged_vehicle_within_the_daily_limit
    over_limit_handling: customer_pays_the_difference_directly_to_the_rental_agency
    parts_delay_extension: false
    deductible: 0.0
    multiple_loss_rule: each_covered_loss_has_its_own_max_per_loss_and_max_days
    benefit_payee_rule: network_agency_directly_otherwise_named_insured_on_receipts
    benefit_reversal_reasons: &id003
    - duplicate_invoice
    - agency_credit
    - days_outside_the_eligible_period
    max_coverages_per_vehicle: 1
    coverage_follows_physdam: true
    add_effective_rule: date_requested_never_earlier
    removal_effective_rule: date_requested_never_earlier
    loss_before_removal_rule: still_covered_for_its_eligible_period
    lapse_loss_covered: false
    loss_before_add_covered: false
    premium_basis: vehicle_rental_premium_for_the_owner_term_prorated_from_the_effective_date
    premium_rounding: nearest_cent_half_up
    claim_number_required: true
    authorization_channels: &id004
    - phone
    - claims_portal
    delivery_to_repair_facility: true
    reimbursement_issue_days: 10
    one_rental_at_a_time: true
    rental_taxes_within_limit: true
    benefit_payment_cycle: weekly_invoices_for_the_days_used
    coverage_parts: &id005
    - transportation_expenses
    total_loss_offer_basis: date_the_settlement_offer_is_made_to_the_named_insured
    excluded_driver_loss_covered: false
