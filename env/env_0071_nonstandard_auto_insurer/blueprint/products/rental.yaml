events:
- type: rental_coverage_added
  target: rental_coverages
  mutation: create
  meaning: Rental reimbursement is added for a vehicle that carries physical damage coverage.
  grain: one row per vehicle coverage
  fields:
    customer_id: named insured
    auto_policy_id: owner term
    physdam_coverage_id: physical damage coverage
    variant_name: package
    vehicle_vin: VIN
    opened_date: date added
    effective_date: first day
    expiration_date: owner term expiration
  triggers:
  - event: rental:rental_premium_written
    map:
      transaction_reason: coverage_added
- type: rental_coverage_started
  target: rental_coverages
  mutation:
    transition:
      from: scheduled
      to: active
  meaning: The coverage reaches its effective date.
  grain: one row per vehicle coverage
  fields:
    status: active
  triggers: []
- type: rental_coverage_removed
  target: rental_coverages
  mutation:
    transition:
    - from: scheduled
      to: removed
    - from: active
      to: removed
  meaning: The coverage is removed at the named insured's request.
  grain: one row per vehicle coverage
  fields: &id006
    status: new state
    closed_date: end date or cleared
  triggers:
  - event: rental:rental_premium_returned
    map:
      transaction_reason: coverage_removed
- type: rental_coverage_terminated
  target: rental_coverages
  mutation:
    transition:
      from: active
      to: terminated
  meaning: The coverage ends because the vehicle's physical damage coverage or owner term ended.
  grain: one row per vehicle coverage
  fields: *id006
  triggers:
  - event: rental:rental_premium_returned
    map:
      transaction_reason: coverage_terminated
- type: rental_coverage_restored
  target: rental_coverages
  mutation:
    transition:
      from: terminated
      to: active
  meaning: The coverage is restored with the physical damage coverage.
  grain: one row per vehicle coverage
  fields: *id006
  triggers:
  - event: rental:rental_premium_written
    map:
      transaction_reason: coverage_restored
- type: rental_coverage_expired
  target: rental_coverages
  mutation:
    transition:
      from: active
      to: expired
  meaning: The coverage expires with the owner term.
  grain: one row per vehicle coverage
  fields: *id006
  triggers: []
- type: rental_package_changed
  target: rental_coverages
  mutation: update
  meaning: The rental package is changed mid-term.
  grain: one row per vehicle coverage
  fields:
    variant_name: new package
  triggers: []
- type: rental_premium_written
  target: rental_premium_transactions
  meaning: Rental premium is charged from the effective or restoration date.
  grain: one row per charge
  distinguish_by:
  - transaction_reason
  - effective_date
  fields: &id007
    transaction_date: date
    effective_date: coverage date
    amount: amount
    vehicle_term_rental_premium: full-term premium
    premium_days: days
    owner_term_days: owner term days
    transaction_reason: reason
  account: coverage_premium
  direction: in
  triggers: []
- type: rental_premium_returned
  target: rental_premium_transactions
  meaning: Unearned rental premium is returned.
  grain: one row per return
  distinguish_by:
  - transaction_reason
  - effective_date
  fields: *id007
  account: coverage_premium
  direction: out
  triggers: []
- type: rental_authorized
  target: rental_authorizations
  meaning: A rental authorization is issued on a covered claim.
  grain: one row per authorization
  distinguish_by:
  - claim_number
  - entry_date
  fields:
    claim_number: claim
    entry_date: issue date
    authorized_start_date: first day
    authorized_daily_rate: rate
    rental_channel: channel
  triggers: []
- type: rental_authorization_closed
  target: rental_authorizations
  meaning: A rental authorization is closed.
  grain: one row per closing
  distinguish_by:
  - claim_number
  - entry_date
  fields:
    claim_number: claim
    entry_date: closing date
    close_reason: reason
  triggers: []
- type: rental_benefit_paid
  target: rental_benefit_transactions
  meaning: Rental days are paid to a network agency or reimbursed to the named insured.
  grain: one row per invoice or receipt period
  distinguish_by:
  - claim_number
  - period_start_date
  fields:
    claim_number: claim
    rental_authorization_id: authorization
    payment_date: date
    period_start_date: first day
    period_end_date: last day
    days_paid: days
    amount: amount
    payee_type: payee
  account: rental_benefit
  direction: in
  triggers: []
- type: rental_benefit_reversed
  target: rental_benefit_transactions
  meaning: A paid rental benefit is reversed.
  grain: one row per reversal
  distinguish_by:
  - reversed_benefit_txn_id
  fields:
    claim_number: claim
    payment_date: date
    amount: amount
    reversed_benefit_txn_id: payment reversed
    reversal_reason: reason
  account: rental_benefit
  direction: out
  triggers: []
measures: []
policies:
- id: rental_agg_multi_holding
  subject:
  - rental_coverage_added
  rule: A named insured may carry rental reimbursement on any number of vehicles, so max_per_customer
    is unlimited. A vehicle carries at most one rental coverage per owner term.
  eligibility:
  - id: one_per_vehicle
    applies_to:
    - rental_coverage_added
    kind: dedup
    condition: A vehicle carries at most one rental coverage per owner term.
    evidence_fields:
    - rental_coverages.status
    - rental_coverages.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_coverages.physdam_coverage_id
      action_bindings:
        rental_coverages.physdam_coverage_id: physdam_coverage_id
    dedup_contract:
      table: rental_coverages
      mode: separate_record
      object_bindings:
        physdam_coverage_id: physdam_coverage_id
      duplicate_filters:
        status:
        - scheduled
        - active
        - terminated
      distinct_fields: []
  params:
    max_per_customer: null
- id: rental_agg_losses
  subject:
  - rental_benefit_paid
  - rental_authorized
  rule: When the named insured has several covered vehicles or several losses, rental is evaluated loss
    by loss and vehicle by vehicle. Each covered loss is capped separately, and only one rental is paid
    at a time for one loss. Benefits on one claim never use another claim's remaining maximum.
  eligibility:
  - id: per_loss
    applies_to:
    - rental_authorized
    kind: authorization
    condition: Each covered loss is capped separately, and only one rental is paid at a time for one loss.
    evidence_fields:
    - rental_authorizations.claim_number
    - rental_authorizations.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_authorizations.claim_number
      action_bindings:
        rental_authorizations.claim_number: claim_number
  params:
    multiple_loss_rule: =multiple_loss_rule
    one_rental_at_a_time: =one_rental_at_a_time
- id: rental_eligibility
  subject:
  - rental_coverage_added
  - rental_package_changed
  - rental_coverage_started
  rule: Rental coverage is added only to a vehicle whose physical damage coverage is inspection_pending
    or active. It is added effective the date requested, never earlier, and starts on its effective date;
    a package change takes effect on the date requested. Rental is never sold without physical damage
    coverage.
  eligibility:
  - id: physdam_open
    applies_to:
    - rental_coverage_added
    kind: state
    condition: Rental coverage is added only to a vehicle whose physical damage coverage is inspection_pending
      or active.
    evidence_fields:
    - physdam_coverages.status
    - rental_coverages.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_coverages.physdam_coverage_id
      action_bindings:
        rental_coverages.physdam_coverage_id: physdam_coverage_id
    state_contract:
      field: physdam_coverages.status
      allowed:
      - inspection_pending
      - active
  params:
    requires_physical_damage_coverage: =requires_physical_damage_coverage
    add_effective_rule: =add_effective_rule
- id: rental_term_link
  subject:
  - rental_coverage_terminated
  - rental_coverage_restored
  - rental_coverage_expired
  - rental_coverage_removed
  rule: The rental coverage is terminated only when the vehicle's physical damage coverage has been removed,
    terminated or expired. It is restored when that coverage is restored and expires with the owner term.
    A removal at the named insured's request takes effect on the date requested, never earlier; losses
    before the removal keep their eligible period.
  eligibility:
  - id: physdam_ended
    applies_to:
    - rental_coverage_terminated
    kind: state
    condition: The rental coverage is terminated only when the vehicle's physical damage coverage has
      been removed, terminated or expired.
    evidence_fields:
    - physdam_coverages.status
    - rental_coverages.physdam_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_coverages.physdam_coverage_id
      action_bindings:
        rental_coverages.physdam_coverage_id: physdam_coverage_id
    state_contract:
      field: physdam_coverages.status
      allowed:
      - removed
      - terminated
      - expired
  params:
    coverage_follows_physdam: =coverage_follows_physdam
    removal_effective_rule: =removal_effective_rule
- id: rental_premium_rule
  subject:
  - rental_premium_written
  - rental_premium_returned
  rule: Rental premium is booked only while the coverage is scheduled, active, removed or terminated.
    The amount is vehicle_term_rental_premium multiplied by premium_days and divided by owner_term_days,
    rounded to the cent.
  eligibility:
  - id: status_ok
    applies_to:
    - rental_premium_written
    - rental_premium_returned
    kind: state
    condition: Rental premium is booked only while the coverage is scheduled, active, removed or terminated.
    evidence_fields:
    - rental_coverages.status
    - rental_coverages.rental_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_coverages.rental_coverage_id
      action_bindings:
        rental_coverages.rental_coverage_id: rental_coverage_id
    state_contract:
      field: rental_coverages.status
      allowed:
      - scheduled
      - active
      - removed
      - terminated
  formula:
    prorated_premium: round(vehicle_term_rental_premium * premium_days / owner_term_days, 2)
- id: rental_authorization_rule
  subject:
  - rental_authorized
  - rental_authorization_closed
  rule: A rental is authorized only on a physical damage claim with a recorded coverage confirmation.
    The authorized daily rate never exceeds the package daily_limit; the start date follows non_theft_start_rule.
    Rental for a stolen vehicle starts no earlier than theft_waiting_hours after the theft was reported.
    The hours are elapsed hours counted from the report entry; the first eligible rental day is the calendar
    day on which the waiting hours end. The authorization closes when the vehicle is reported repaired,
    when total_loss_extra_days have passed after the settlement offer, when the per-loss maximum is reached,
    when a stolen vehicle is recovered, or when the customer declines.
  eligibility:
  - id: claim_confirmed
    applies_to:
    - rental_authorized
    kind: authorization
    condition: A rental is authorized only on a physical damage claim with a recorded coverage confirmation.
    evidence_fields:
    - physdam_claim_events.event_type
    - physdam_claim_events.claim_number
    - rental_authorizations.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_authorizations.claim_number
      action_bindings:
        rental_authorizations.claim_number: claim_number
  - id: theft_wait
    applies_to:
    - rental_authorized
    kind: time
    condition: Rental for a stolen vehicle starts no earlier than theft_waiting_hours after the theft
      was reported.
    evidence_fields:
    - physdam_claim_events.loss_cause
    - physdam_claim_events.entry_date
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the theft was reported
      anchor_source: physdam_claim_events.entry_date
      relation: not_before
      duration_source: variants.theft_waiting_hours
      unit: elapsed_hours
      counting_rule: The hours are elapsed hours counted from the report entry; the first eligible rental
        day is the calendar day on which the waiting hours end.
      boundary: inclusive
  params:
    per_tier:
      Cardinal Point Rental Reimbursement $20/$600:
        daily_limit: =daily_limit
      Cardinal Point Rental Reimbursement $25/$750:
        daily_limit: =daily_limit
      Cardinal Point Rental Reimbursement $30/$900:
        daily_limit: =daily_limit
      Cardinal Point Rental Reimbursement $40/$1,200:
        daily_limit: =daily_limit
      Cardinal Point Rental Reimbursement $50/$1,500:
        daily_limit: =daily_limit
      Cardinal Point Rental Reimbursement $60/$1,800:
        daily_limit: =daily_limit
    total_loss_extra_days: =total_loss_extra_days
    theft_waiting_hours: =theft_waiting_hours
- id: rental_benefit_rule
  subject:
  - rental_benefit_paid
  rule: Each rental day is paid at the lower of the actual daily charge and the package daily_limit; mileage,
    fuel and damage waivers are not paid, and charges above the limit are the customer's. The rental days
    paid on a claim, including this payment, never exceed max_days_per_loss and the amount never exceeds
    max_per_loss. Network agencies are paid directly on weekly invoices; other rentals and ride-hailing
    or transit fares are reimbursed to the named insured on itemized receipts submitted within non_network_receipt_days
    of the rental's end.
  eligibility:
  - id: caps
    applies_to:
    - rental_benefit_paid
    kind: authorization
    condition: The rental days paid on a claim, including this payment, never exceed max_days_per_loss
      and the amount never exceeds max_per_loss.
    evidence_fields:
    - rental_benefit_transactions.days_paid
    - rental_benefit_transactions.amount
    - rental_benefit_transactions.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_benefit_transactions.claim_number
      action_bindings:
        rental_benefit_transactions.claim_number: claim_number
  params:
    per_tier:
      Cardinal Point Rental Reimbursement $20/$600:
        daily_limit: =daily_limit
        max_per_loss: =max_per_loss
      Cardinal Point Rental Reimbursement $25/$750:
        daily_limit: =daily_limit
        max_per_loss: =max_per_loss
      Cardinal Point Rental Reimbursement $30/$900:
        daily_limit: =daily_limit
        max_per_loss: =max_per_loss
      Cardinal Point Rental Reimbursement $40/$1,200:
        daily_limit: =daily_limit
        max_per_loss: =max_per_loss
      Cardinal Point Rental Reimbursement $50/$1,500:
        daily_limit: =daily_limit
        max_per_loss: =max_per_loss
      Cardinal Point Rental Reimbursement $60/$1,800:
        daily_limit: =daily_limit
        max_per_loss: =max_per_loss
    max_days_per_loss: =max_days_per_loss
    non_network_receipt_days: =non_network_receipt_days
  formula:
    payment: round(min(daily_limit, authorized_daily_rate) * days_paid, 2)
- id: rental_benefit_reversal
  subject:
  - rental_benefit_reversed
  rule: A rental benefit payment is reversed at most once. A reversal is made for a duplicate invoice,
    an agency credit, or days outside the eligible period, for the amount of the days concerned.
  eligibility:
  - id: once
    applies_to:
    - rental_benefit_reversed
    kind: dedup
    condition: A rental benefit payment is reversed at most once.
    evidence_fields:
    - rental_benefit_transactions.event_type
    - rental_benefit_transactions.reversed_benefit_txn_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_benefit_transactions.reversed_benefit_txn_id
      action_bindings:
        rental_benefit_transactions.reversed_benefit_txn_id: reversed_benefit_txn_id
    dedup_contract:
      table: rental_benefit_transactions
      mode: separate_record
      object_bindings:
        reversed_benefit_txn_id: reversed_benefit_txn_id
      duplicate_filters:
        event_type:
        - rental_benefit_reversed
      distinct_fields: []
  params:
    benefit_reversal_reasons: =benefit_reversal_reasons
