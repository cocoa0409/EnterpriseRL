# Policy charter: Towing and Labor Coverage (category key: towing).
category: towing
display_name: Towing and Labor Coverage
binding:
  holding_table: towing_coverages
  event_tables:
  - towing_premium_transactions
  - towing_service_events
  - towing_benefit_transactions
  status_field: status
  variant_field: variant_name
  quantity_fields:
    term_coverage_premium: coverage_premium
    benefits_paid_total: towing_benefit
lifecycle:
  states:
  - scheduled
  - active
  - removed
  - terminated
  - expired
  transitions:
  - from: scheduled
    to: active
    by: system
    means: The effective date is reached.
  - from: scheduled
    to: removed
    by: agent
    means: The named insured removes it before it starts.
  - from: active
    to: removed
    by: agent
    means: The named insured removes it.
  - from: active
    to: terminated
    by: agent
    means: The owner term is cancelled.
  - from: terminated
    to: active
    by: agent
    means: The owner term is reinstated.
  - from: active
    to: expired
    by: system
    means: The owner term expires.
accounts:
- key: coverage_premium
  unit: USD
  meaning: Net towing and labor premium on the vehicle coverage.
- key: towing_benefit
  unit: USD
  meaning: Towing and labor benefits paid on the coverage net of reversals.
parameter_schema:
  per_disablement_limit: Most paid for one disablement (towing and labor together), USD.
  max_disablements_per_term: Disablements paid per vehicle per owner term.
  covered_services: Services paid under the coverage.
  labor_location_rule: Where labor is paid.
  labor_max_minutes: Most labor time paid at the place of disablement, minutes.
  tow_destination_rule: Where a tow is paid to.
  winch_distance_feet: Farthest distance from a paved road for which winching is paid, feet.
  fuel_cost_covered: 'Whether the cost of the fuel itself is paid (false: delivery service only).'
  parts_cost_covered: Whether parts (batteries, tires, keys) are paid (false).
  locksmith_key_cutting_covered: 'Whether key cutting or programming is paid (false: lockout opening only).'
  first_service_waiting_hours: Elapsed hours after the coverage effective date before the first service
    is eligible.
  dispatch_network_direct_pay: Whether network providers dispatched by the company are paid directly (true/false).
  dispatch_channels: Channels through which roadside service is dispatched.
  out_of_network_reimbursement: Whether a service the customer arranges is reimbursed on receipts (true/false).
  reimbursement_receipt_days: Calendar days after the disablement within which receipts must be submitted.
  receipt_requirements: What an out-of-network receipt must show.
  reimbursement_issue_days: Calendar days after complete receipts within which a reimbursement is issued.
  over_limit_handling: Charges above the limit.
  same_day_repeat_rule: Treatment of a second service for the same disablement on the same day.
  disablement_definition: What counts as one disablement.
  collision_tow_rule: Tows after a collision or comprehensive loss.
  rideshare_use_covered: Whether disablement during ride-hailing or delivery use is covered (false).
  commercial_tow_covered: Whether a vehicle over 10,000 lb gross weight is covered (false).
  impound_release_covered: Whether impound or police-ordered tows are paid (false).
  lapse_service_covered: Whether service during a lapse of the owner term is paid (false).
  excluded_driver_service_covered: Whether service while a named excluded driver was operating is paid
    (false).
  max_coverages_per_vehicle: Towing coverages per vehicle per owner term.
  coverage_follows_owner_term: Whether the coverage ends, is restored and expires with the owner term
    (true/false).
  add_effective_rule: Effective date when added mid-term.
  removal_effective_rule: Effective date of a removal.
  premium_basis: How premium is charged.
  premium_rounding: Rounding.
  service_reference_format: Format of a roadside service reference.
  dispatch_eta_target_minutes: Target arrival time quoted for a dispatched provider, minutes (service
    level, not a payment condition).
  benefit_reversal_reasons: Reasons a paid benefit is reversed.
  goa_fee_covered: Whether a provider's gone-on-arrival fee is paid when the customer was not with the
    vehicle (false).
  trip_interruption_covered: Whether lodging or meals after a breakdown are paid (false).
  territory: Where service is provided.
  count_basis: How disablements are counted against the term maximum.
  unpaid_dispatch_counts: Whether a dispatch later reversed in full counts toward the term maximum (false).
  vehicle_age_limit_model_years: Oldest vehicle eligible, model years before the current model year.
  requires_physical_damage: Whether physical damage coverage is required on the vehicle (false).
  multiple_vehicle_rule: How limits apply across vehicles.
  service_channel_for_reimbursement: Channels for submitting receipts.
  provider_payment_cycle: How network providers are paid.
  labor_overtime_covered: Whether labor beyond labor_max_minutes is paid (false).
  storage_covered: Whether storage after a tow is paid (false).
  coverage_parts: Coverage parts provided.
variants:
- name: Cardinal Point Towing and Labor $50
  rank: 1
  entry_gate:
    vehicle_scheduled_on_owner_term: true
    max_vehicle_age_model_years: 30
  parameters:
    per_disablement_limit: 50.0
    max_disablements_per_term: 3
    covered_services: &id001
    - tow
    - jump_start
    - lockout
    - flat_tire_change
    - fuel_delivery
    - winch_out
    labor_location_rule: labor_only_at_the_place_of_disablement
    labor_max_minutes: 60
    tow_destination_rule: nearest_qualified_repair_facility_or_a_facility_the_insured_chooses_within_the_limit
    winch_distance_feet: 100
    fuel_cost_covered: false
    parts_cost_covered: false
    locksmith_key_cutting_covered: false
    first_service_waiting_hours: 48
    dispatch_network_direct_pay: true
    dispatch_channels: &id002
    - phone
    - mobile_app
    out_of_network_reimbursement: true
    reimbursement_receipt_days: 60
    receipt_requirements: &id003
    - provider_name
    - service_date
    - service_location
    - itemized_charges
    reimbursement_issue_days: 10
    over_limit_handling: customer_pays_the_provider_directly
    same_day_repeat_rule: counts_as_the_same_disablement
    disablement_definition: one_breakdown_of_one_vehicle_at_one_place_and_time
    collision_tow_rule: paid_under_physical_damage_when_that_coverage_applies_otherwise_here
    rideshare_use_covered: false
    commercial_tow_covered: false
    impound_release_covered: false
    lapse_service_covered: false
    excluded_driver_service_covered: false
    max_coverages_per_vehicle: 1
    coverage_follows_owner_term: true
    add_effective_rule: date_requested_never_earlier
    removal_effective_rule: date_requested_never_earlier
    premium_basis: vehicle_towing_premium_for_the_owner_term_prorated_from_the_effective_date
    premium_rounding: nearest_cent_half_up
    service_reference_format: RSA-<8 digits>
    dispatch_eta_target_minutes: 90
    benefit_reversal_reasons: &id004
    - duplicate_invoice
    - service_not_performed
    - ineligible_service
    goa_fee_covered: false
    trip_interruption_covered: false
    territory: united_states_and_canada
    count_basis: each_dispatched_or_reimbursed_disablement_with_a_paid_benefit
    unpaid_dispatch_counts: false
    vehicle_age_limit_model_years: 30
    requires_physical_damage: false
    multiple_vehicle_rule: limits_and_counts_apply_per_vehicle
    service_channel_for_reimbursement: &id005
    - claims_portal
    - email
    - mail
    provider_payment_cycle: per_dispatch_invoice
    labor_overtime_covered: false
    storage_covered: false
    coverage_parts: &id006
    - towing_and_labor
