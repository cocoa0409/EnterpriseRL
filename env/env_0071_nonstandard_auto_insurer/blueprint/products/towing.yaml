events:
- type: towing_coverage_added
  target: towing_coverages
  mutation: create
  meaning: Towing and labor is added for a scheduled vehicle of an owner term.
  grain: one row per vehicle coverage
  fields:
    customer_id: named insured
    auto_policy_id: owner term
    variant_name: package
    vehicle_vin: VIN
    opened_date: date added
    effective_date: first day
    expiration_date: owner term expiration
  triggers:
  - event: towing:towing_premium_written
    map:
      transaction_reason: coverage_added
- type: towing_coverage_started
  target: towing_coverages
  mutation:
    transition:
      from: scheduled
      to: active
  meaning: The coverage reaches its effective date.
  grain: one row per vehicle coverage
  fields:
    status: active
  triggers: []
- type: towing_coverage_removed
  target: towing_coverages
  mutation:
    transition:
    - from: scheduled
      to: removed
    - from: active
      to: removed
  meaning: The coverage is removed at the named insured's request.
  grain: one row per vehicle coverage
  fields: &id007
    status: new state
    closed_date: end date or cleared
  triggers:
  - event: towing:towing_premium_returned
    map:
      transaction_reason: coverage_removed
- type: towing_coverage_terminated
  target: towing_coverages
  mutation:
    transition:
      from: active
      to: terminated
  meaning: The coverage ends because the owner term was cancelled.
  grain: one row per vehicle coverage
  fields: *id007
  triggers:
  - event: towing:towing_premium_returned
    map:
      transaction_reason: owner_term_cancelled
- type: towing_coverage_restored
  target: towing_coverages
  mutation:
    transition:
      from: terminated
      to: active
  meaning: The coverage is restored because the owner term was reinstated.
  grain: one row per vehicle coverage
  fields: *id007
  triggers:
  - event: towing:towing_premium_written
    map:
      transaction_reason: owner_term_reinstated
- type: towing_coverage_expired
  target: towing_coverages
  mutation:
    transition:
      from: active
      to: expired
  meaning: The coverage expires with the owner term.
  grain: one row per vehicle coverage
  fields: *id007
  triggers: []
- type: towing_package_changed
  target: towing_coverages
  mutation: update
  meaning: The towing package is changed mid-term.
  grain: one row per vehicle coverage
  fields:
    variant_name: new package
  triggers: []
- type: towing_premium_written
  target: towing_premium_transactions
  meaning: Towing premium is charged.
  grain: one row per charge
  distinguish_by:
  - transaction_reason
  - effective_date
  fields: &id008
    transaction_date: date
    effective_date: coverage date
    amount: amount
    vehicle_term_towing_premium: full-term premium
    premium_days: days
    owner_term_days: owner term days
    transaction_reason: reason
  account: coverage_premium
  direction: in
  triggers: []
- type: towing_premium_returned
  target: towing_premium_transactions
  meaning: Unearned towing premium is returned.
  grain: one row per return
  distinguish_by:
  - transaction_reason
  - effective_date
  fields: *id008
  account: coverage_premium
  direction: out
  triggers: []
- type: towing_service_dispatched
  target: towing_service_events
  meaning: A network provider is dispatched to a disabled covered vehicle.
  grain: one row per dispatch
  distinguish_by:
  - service_reference
  fields:
    service_reference: reference
    disablement_date: breakdown date
    entry_date: entry date
    service_type: service
    operator_name: operator
    disablement_location: location
  triggers: []
- type: towing_reimbursement_requested
  target: towing_service_events
  meaning: Receipts for a service the customer arranged are submitted.
  grain: one row per request
  distinguish_by:
  - service_reference
  fields:
    service_reference: reference
    disablement_date: breakdown date
    entry_date: entry date
    service_type: service
    operator_name: operator
    disablement_location: location
    receipt_amount: receipt amount
  triggers: []
- type: towing_benefit_paid
  target: towing_benefit_transactions
  meaning: A dispatched provider is paid or a receipt is reimbursed.
  grain: one row per service paid
  distinguish_by:
  - service_reference
  fields:
    service_reference: service
    payment_date: date
    amount: amount
    payee_type: payee
  account: towing_benefit
  direction: in
  triggers: []
- type: towing_benefit_reversed
  target: towing_benefit_transactions
  meaning: A paid towing benefit is reversed.
  grain: one row per reversal
  distinguish_by:
  - reversed_benefit_txn_id
  fields:
    service_reference: service
    payment_date: date
    amount: amount
    reversed_benefit_txn_id: payment reversed
    reversal_reason: reason
  account: towing_benefit
  direction: out
  triggers: []
measures:
- id: towing_msr_disablements_in_term
  window: the owner term of the coverage (effective_date to expiration_date), by disablement_date
  measure: count of distinct service_reference values on this towing_coverage_id with a towing_benefit_paid
    row not fully reversed
policies:
- id: towing_agg_multi_holding
  subject:
  - towing_coverage_added
  rule: A named insured may carry towing and labor on any number of scheduled vehicles, so max_per_customer
    is unlimited. A vehicle carries at most one towing coverage per owner term.
  eligibility:
  - id: one_per_vehicle
    applies_to:
    - towing_coverage_added
    kind: dedup
    condition: A vehicle carries at most one towing coverage per owner term.
    evidence_fields:
    - towing_coverages.status
    - towing_coverages.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_coverages.auto_policy_id
      action_bindings:
        towing_coverages.auto_policy_id: auto_policy_id
    dedup_contract:
      table: towing_coverages
      mode: separate_record
      object_bindings:
        auto_policy_id: auto_policy_id
        vehicle_vin: vehicle_vin
      duplicate_filters:
        status:
        - scheduled
        - active
        - terminated
      distinct_fields: []
  params:
    max_per_customer: null
- id: towing_agg_vehicle_counts
  subject:
  - towing_benefit_paid
  - towing_service_dispatched
  rule: When the named insured covers several vehicles, each vehicle has its own per-disablement limit
    and term maximum. Limits and disablement counts apply per vehicle and are never pooled across the
    named insured's vehicles.
  eligibility:
  - id: per_vehicle
    applies_to:
    - towing_service_dispatched
    kind: authorization
    condition: Limits and disablement counts apply per vehicle and are never pooled across the named insured's
      vehicles.
    evidence_fields:
    - towing_service_events.towing_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_service_events.towing_coverage_id
      action_bindings:
        towing_service_events.towing_coverage_id: towing_coverage_id
  params:
    multiple_vehicle_rule: =multiple_vehicle_rule
- id: towing_eligibility
  subject:
  - towing_coverage_added
  - towing_package_changed
  - towing_coverage_started
  rule: Towing coverage is added only to a vehicle of an owner term whose status is bound or in_force.
    The vehicle's model year must be within the package's vehicle_age_limit_model_years. It is added effective
    the date requested, never earlier, and starts on its effective date; a package change takes effect
    on the date requested.
  eligibility:
  - id: owner_open
    applies_to:
    - towing_coverage_added
    kind: state
    condition: Towing coverage is added only to a vehicle of an owner term whose status is bound or in_force.
    evidence_fields:
    - auto_policies.status
    - towing_coverages.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_coverages.auto_policy_id
      action_bindings:
        towing_coverages.auto_policy_id: auto_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - bound
      - in_force
  params:
    per_tier:
      Cardinal Point Towing and Labor $50:
        age_limit: =vehicle_age_limit_model_years
      Cardinal Point Towing and Labor $75:
        age_limit: =vehicle_age_limit_model_years
      Cardinal Point Towing and Labor $100:
        age_limit: =vehicle_age_limit_model_years
      Cardinal Point Towing and Labor $125:
        age_limit: =vehicle_age_limit_model_years
      Cardinal Point Towing and Labor $150:
        age_limit: =vehicle_age_limit_model_years
      Cardinal Point Towing and Labor $200:
        age_limit: =vehicle_age_limit_model_years
    add_effective_rule: =add_effective_rule
- id: towing_term_link
  subject:
  - towing_coverage_terminated
  - towing_coverage_restored
  - towing_coverage_expired
  - towing_coverage_removed
  rule: The towing coverage is terminated only when its owner term has been cancelled. It is restored
    when the owner term is reinstated and expires with it. A removal takes effect on the date requested,
    never earlier.
  eligibility:
  - id: owner_cancelled
    applies_to:
    - towing_coverage_terminated
    kind: state
    condition: The towing coverage is terminated only when its owner term has been cancelled.
    evidence_fields:
    - auto_policies.status
    - towing_coverages.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_coverages.auto_policy_id
      action_bindings:
        towing_coverages.auto_policy_id: auto_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - cancelled
  params:
    coverage_follows_owner_term: =coverage_follows_owner_term
    removal_effective_rule: =removal_effective_rule
- id: towing_premium_rule
  subject:
  - towing_premium_written
  - towing_premium_returned
  rule: Towing premium is booked only while the coverage is scheduled, active, removed or terminated.
    The amount is vehicle_term_towing_premium multiplied by premium_days and divided by owner_term_days,
    rounded to the cent.
  eligibility:
  - id: status_ok
    applies_to:
    - towing_premium_written
    - towing_premium_returned
    kind: state
    condition: Towing premium is booked only while the coverage is scheduled, active, removed or terminated.
    evidence_fields:
    - towing_coverages.status
    - towing_coverages.towing_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_coverages.towing_coverage_id
      action_bindings:
        towing_coverages.towing_coverage_id: towing_coverage_id
    state_contract:
      field: towing_coverages.status
      allowed:
      - scheduled
      - active
      - removed
      - terminated
  formula:
    prorated_premium: round(vehicle_term_towing_premium * premium_days / owner_term_days, 2)
- id: towing_service_rule
  subject:
  - towing_service_dispatched
  - towing_reimbursement_requested
  rule: Covered services are covered_services; labor is paid only at the place of disablement up to labor_max_minutes,
    winching only within winch_distance_feet of a paved road, and the cost of fuel, parts and key cutting
    is not paid. The caller states who was driving and where the vehicle is disabled. A service is eligible
    only when the disablement occurs no earlier than first_service_waiting_hours after the coverage took
    effect. Elapsed hours are counted from 12:01 a.m. on the coverage effective date; a disablement on
    or after the end of the waiting hours qualifies. The vehicle's paid disablements in the term, counted
    by towing_msr_disablements_in_term, must be below max_disablements before another is paid. No service
    is paid during a lapse of the owner term, while a named excluded driver was operating, during ride-hailing
    or delivery use, or for an impound tow. A tow after a covered collision or comprehensive loss is paid
    under physical damage instead. Out-of-network receipts are accepted within reimbursement_receipt_days
    of the disablement.
  eligibility:
  - id: caller_states
    applies_to:
    - towing_service_dispatched
    - towing_reimbursement_requested
    kind: caller_fact
    condition: The caller states who was driving and where the vehicle is disabled.
    evidence_fields:
    - towing_service_events.operator_name
    - towing_service_events.disablement_location
    - towing_service_events.service_reference
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - towing_service_events.service_reference
      action_bindings:
        towing_service_events.service_reference: service_reference
  - id: waiting_hours
    applies_to:
    - towing_service_dispatched
    - towing_reimbursement_requested
    kind: time
    condition: A service is eligible only when the disablement occurs no earlier than first_service_waiting_hours
      after the coverage took effect.
    evidence_fields:
    - towing_service_events.disablement_date
    - towing_coverages.effective_date
    - towing_coverages.towing_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_coverages.towing_coverage_id
      action_bindings:
        towing_coverages.towing_coverage_id: towing_coverage_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the coverage took effect
      anchor_source: towing_coverages.effective_date
      relation: not_before
      duration_source: variants.first_service_waiting_hours
      unit: elapsed_hours
      counting_rule: Elapsed hours are counted from 12:01 a.m. on the coverage effective date; a disablement
        on or after the end of the waiting hours qualifies.
      boundary: inclusive
  - id: term_count
    applies_to:
    - towing_service_dispatched
    - towing_reimbursement_requested
    kind: authorization
    condition: The vehicle's paid disablements in the term, counted by towing_msr_disablements_in_term,
      must be below max_disablements before another is paid.
    evidence_fields:
    - towing_benefit_transactions.service_reference
    - towing_benefit_transactions.towing_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_benefit_transactions.towing_coverage_id
      action_bindings:
        towing_benefit_transactions.towing_coverage_id: towing_coverage_id
  params:
    per_tier:
      Cardinal Point Towing and Labor $50:
        max_disablements: =max_disablements_per_term
      Cardinal Point Towing and Labor $75:
        max_disablements: =max_disablements_per_term
      Cardinal Point Towing and Labor $100:
        max_disablements: =max_disablements_per_term
      Cardinal Point Towing and Labor $125:
        max_disablements: =max_disablements_per_term
      Cardinal Point Towing and Labor $150:
        max_disablements: =max_disablements_per_term
      Cardinal Point Towing and Labor $200:
        max_disablements: =max_disablements_per_term
    labor_max_minutes: =labor_max_minutes
    winch_distance_feet: =winch_distance_feet
    reimbursement_receipt_days: =reimbursement_receipt_days
  measures:
  - towing_msr_disablements_in_term
- id: towing_benefit_rule
  subject:
  - towing_benefit_paid
  rule: A disablement is paid at the lower of the provider's or receipt's charges and the package's per_disablement_limit;
    a second service for the same disablement on the same day shares that limit, and charges above it
    are the customer's. Only one benefit payment is made per service reference. Network providers are
    paid on their dispatch invoice; out-of-network services are reimbursed to the named insured within
    reimbursement_issue_days of complete receipts.
  eligibility:
  - id: one_payment
    applies_to:
    - towing_benefit_paid
    kind: dedup
    condition: Only one benefit payment is made per service reference.
    evidence_fields:
    - towing_benefit_transactions.event_type
    - towing_benefit_transactions.service_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_benefit_transactions.service_reference
      action_bindings:
        towing_benefit_transactions.service_reference: service_reference
    dedup_contract:
      table: towing_benefit_transactions
      mode: separate_record
      object_bindings:
        service_reference: service_reference
      duplicate_filters:
        event_type:
        - towing_benefit_paid
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Towing and Labor $50:
        per_disablement_limit: =per_disablement_limit
      Cardinal Point Towing and Labor $75:
        per_disablement_limit: =per_disablement_limit
      Cardinal Point Towing and Labor $100:
        per_disablement_limit: =per_disablement_limit
      Cardinal Point Towing and Labor $125:
        per_disablement_limit: =per_disablement_limit
      Cardinal Point Towing and Labor $150:
        per_disablement_limit: =per_disablement_limit
      Cardinal Point Towing and Labor $200:
        per_disablement_limit: =per_disablement_limit
    reimbursement_issue_days: =reimbursement_issue_days
  formula:
    payment: round(min(receipt_amount, per_disablement_limit), 2)
- id: towing_benefit_reversal
  subject:
  - towing_benefit_reversed
  rule: A towing benefit payment is reversed at most once. Reversals are made for a duplicate invoice,
    a service not performed, or an ineligible service, for the full payment; a disablement reversed in
    full no longer counts toward the term maximum.
  eligibility:
  - id: once
    applies_to:
    - towing_benefit_reversed
    kind: dedup
    condition: A towing benefit payment is reversed at most once.
    evidence_fields:
    - towing_benefit_transactions.event_type
    - towing_benefit_transactions.reversed_benefit_txn_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - towing_benefit_transactions.reversed_benefit_txn_id
      action_bindings:
        towing_benefit_transactions.reversed_benefit_txn_id: reversed_benefit_txn_id
    dedup_contract:
      table: towing_benefit_transactions
      mode: separate_record
      object_bindings:
        reversed_benefit_txn_id: reversed_benefit_txn_id
      duplicate_filters:
        event_type:
        - towing_benefit_reversed
      distinct_fields: []
  params:
    benefit_reversal_reasons: =benefit_reversal_reasons
