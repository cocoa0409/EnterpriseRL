- id: auto_nonrenewal
  subject:
  - auto_nonrenewal_notice
  rule: The company nonrenews a term only for a reason in the nonrenewal_reason list, chiefly when no
    package's renewal points maximum is met. A nonrenewal notice is valid only when its mailing date is
    at least the garaging state's days in nonrenewal_notice_days_by_state before the expiration date.
    When the notice could not be mailed in time, the company issues the renewal in the highest package
    the drivers qualify for and may nonrenew at the next expiration. A nonrenewed term runs to its expiration
    date and moves to expired; no renewal term is issued.
  eligibility:
  - id: notice_lead
    applies_to:
    - auto_nonrenewal_notice
    kind: authorization
    condition: A nonrenewal notice is valid only when its mailing date is at least the garaging state's
      days in nonrenewal_notice_days_by_state before the expiration date.
    evidence_fields:
    - auto_policy_documents.document_date
    - auto_policies.expiration_date
    - auto_policies.garaging_state
    - auto_policy_documents.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_documents.auto_policy_id
      action_bindings:
        auto_policy_documents.auto_policy_id: auto_policy_id
  params:
    nonrenewal_notice_days_by_state: =nonrenewal_notice_days_by_state
- id: auto_lapse_attestation
  subject:
  - auto_no_loss_statement
  rule: A Statement of No Loss is taken only for a term cancelled for nonpayment that is being reinstated
    with a lapse, or for a renewal being accepted after its expiration date. The named insured personally
    attests whether any accident, loss or claim occurred during the lapse period. The statement covers
    the lapse from its first day (the cancellation effective date, or the expiration date for a late renewal)
    through the signing date, which is recorded as lapse_period_end. A claim on record with a date of
    loss inside the lapse period bars the statement regardless of the attestation. When the insured reports
    a loss in the lapse, no_loss_attested is recorded false and the statement cannot support a reinstatement
    or late renewal.
  eligibility:
  - id: insured_attests
    applies_to:
    - auto_no_loss_statement
    kind: caller_fact
    condition: The named insured personally attests whether any accident, loss or claim occurred during
      the lapse period.
    evidence_fields:
    - auto_policy_documents.no_loss_attested
    - auto_policy_documents.auto_policy_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - auto_policy_documents.auto_policy_id
      action_bindings:
        auto_policy_documents.auto_policy_id: auto_policy_id
  - id: no_claim_in_lapse
    applies_to:
    - auto_no_loss_statement
    kind: authorization
    condition: A claim on record with a date of loss inside the lapse period bars the statement regardless
      of the attestation.
    evidence_fields:
    - physdam_claim_events.auto_policy_id
    - physdam_claim_events.date_of_loss
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.auto_policy_id
      action_bindings:
        physdam_claim_events.auto_policy_id: auto_policy_id
  params:
    no_loss_statement_required: =no_loss_statement_required
- id: auto_underwriting_cancellation
  subject:
  - auto_cancelled_underwriting
  - auto_underwriting_cancel_notice
  rule: An underwriting cancellation for a reason not listed in underwriting_cancel_reasons_after_period
    is processed no later than the garaging state's new_business_underwriting_period_days_by_state calendar
    days after the original effective date of the policy. Calendar days are counted from the original
    effective date (term 1) as day 0, using the garaging state's figure. After that period an in-force
    policy is cancelled for underwriting only for a reason in underwriting_cancel_reasons_after_period.
    The cancellation effective date is at least the garaging state's underwriting_cancel_notice_days_by_state
    calendar days after the mailing date of the underwriting cancellation notice. Unearned premium is
    returned pro rata; fees are not returned. Nonpayment is never handled as an underwriting cancellation.
  eligibility:
  - id: underwriting_period
    applies_to:
    - auto_cancelled_underwriting
    kind: time
    condition: An underwriting cancellation for a reason not listed in underwriting_cancel_reasons_after_period
      is processed no later than the garaging state's new_business_underwriting_period_days_by_state calendar
      days after the original effective date of the policy.
    evidence_fields:
    - auto_policies.auto_policy_id
    - auto_policies.effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.auto_policy_id
      action_bindings:
        auto_policies.auto_policy_id: auto_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the original effective date of the policy
      anchor_source: auto_policies.effective_date
      relation: not_after
      duration_source: variants.new_business_underwriting_period_days_by_state
      unit: calendar_days
      counting_rule: Calendar days are counted from the original effective date (term 1) as day 0, using
        the garaging state's figure.
      boundary: inclusive
  - id: advance_notice
    applies_to:
    - auto_cancelled_underwriting
    kind: authorization
    condition: The cancellation effective date is at least the garaging state's underwriting_cancel_notice_days_by_state
      calendar days after the mailing date of the underwriting cancellation notice.
    evidence_fields:
    - auto_policy_documents.document_date
    - auto_policy_documents.notice_cancellation_effective_date
    - auto_policy_documents.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_documents.auto_policy_id
      action_bindings:
        auto_policy_documents.auto_policy_id: auto_policy_id
  params:
    underwriting_cancel_notice_days_by_state: =underwriting_cancel_notice_days_by_state
    underwriting_cancel_reasons_after_period: =underwriting_cancel_reasons_after_period
- id: auto_term_activation
  subject:
  - auto_term_effective
  - auto_cancelled_flat
  rule: 'A bound term goes in force only when the down payment on its billing plan has cleared. A term
    is cancelled from inception only when its down payment was returned dishonored. A term cancelled from
    inception never provided coverage: every premium written on it is returned, its policy fee is reversed,
    and cancellation_effective_date and closed_date equal the term effective date. A bound term whose
    down payment is still pending stays bound.'
  eligibility:
  - id: down_payment_cleared
    applies_to:
    - auto_term_effective
    kind: state
    condition: A bound term goes in force only when the down payment on its billing plan has cleared.
    evidence_fields:
    - billing_plans.auto_policy_id
    - billing_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
