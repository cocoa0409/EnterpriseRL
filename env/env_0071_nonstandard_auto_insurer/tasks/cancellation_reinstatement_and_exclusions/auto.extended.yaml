  factors:
  - id: ad_listing_start_rule
    effect: method
    decides: ad_days
    bindings:
    - ad_days
    ladder:
    - when: the resident's most recent entry is a driver-removed entry dated before the report date
      method: days from the later of the report date and the day after the date of loss
    - when: the resident's most recent entry is a driver-added entry dated after the date of loss
      method: nothing charged (already listed again)
    - when: otherwise
      method: days from the later of the processing date and the day after the date of loss
    baseline:
      ad_days: MN(DAYS(NOW, ad_exp), DAYS(ad_loss, ad_exp) - 1)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: ad_age_class_change_rel
    effect: parameter
    decides: ad_age_rel
    bindings:
    - ad_age_then
    - ad_age_now
    - ad_age_rel
    ladder:
    - when: a youth on the date of the last rating and young on the report date
      value: K('drv_age_rel_young') / K('drv_age_rel_youth')
    - when: a youth then and standard now
      value: 1.0 / K('drv_age_rel_youth')
    - when: a young driver then and standard now
      value: 1.0 / K('drv_age_rel_young')
    - when: otherwise (class unchanged)
      value: '1.0'
    baseline:
      ad_age_rel: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: ad_points_change_rel
    effect: parameter
    decides: ad_pts_rel
    bindings:
    - ad_pts_then
    - ad_pts_now
    - ad_tier_then
    - ad_tier_now
    - ad_pts_rel
    ladder:
    - when: low on the rating entry and mid now
      value: K('drv_pts_rel_mid')
    - when: low then and high now
      value: K('drv_pts_rel_high')
    - when: mid then and high now
      value: K('drv_pts_rel_high') / K('drv_pts_rel_mid')
    - when: mid then and low now
      value: 1.0 / K('drv_pts_rel_mid')
    - when: high then and mid now
      value: K('drv_pts_rel_mid') / K('drv_pts_rel_high')
    - when: high then and low now
      value: 1.0 / K('drv_pts_rel_high')
    - when: otherwise (tier unchanged)
      value: '1.0'
    baseline:
      ad_pts_rel: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: ad_accident_rel
    effect: parameter
    decides: ad_acc_rel
    bindings:
    - ad_coll
    - ad_acc_rel
    ladder:
    - when: at least two collision reports naming the resident while unlisted
      value: K('drv_acc_rel_two')
    - when: exactly one
      value: K('drv_acc_rel_one')
    - when: otherwise
      value: '1.0'
    baseline:
      ad_acc_rel: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: physdam
  - id: ad_platform_use_rel
    effect: parameter
    decides: ad_plat_rel
    bindings:
    - ad_plat
    - ad_plat_rel
    ladder:
    - when: at least two reports naming the resident while unlisted with platform use
      value: K('drv_platform_rel_two')
    - when: exactly one
      value: K('drv_platform_rel_one')
    - when: otherwise
      value: '1.0'
    baseline:
      ad_plat_rel: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: physdam
  baseline:
    rule: The standard re-listing share is the driver_term_premium recorded on the resident's most recent entry, and the standard listing effective date is the later of the processing date and the day after the reported date of loss. The standard re-listing premium is the re-listing share multiplied by the calendar days from the listing effective date to the expiration date, the effective date counted and the expiration date not counted, and divided by term_days; it is rounded once, at the end, to the nearest cent, half up.
    params: []
  inputs:
    history:
    - table: auto_policy_changes
      aggregate: latest
      field: driver_violation_points
      filters: {}
    - category: physdam
      table: physdam_claim_events
      aggregate: latest
      field: driver_name
      filters:
        event_type: physdam_claim_reported
        driver_household_status: unlisted_household_resident
    cross_category:
    - physdam
- id: auto_ext_exclusion_lift_premium
  base_policy_refs:
  - auto_driver_schedule
  - auto_agg_household_drivers
  - auto_premium_charging
  overwrite:
  - base_policy: auto_premium_charging
    superseded_clause: Additional premium for a rated driver added is driver_term_premium multiplied by the days from the change effective date to the expiration date and divided by term_days;
    replaced_by: For a lift of such a driver's exclusion, and only for that lift, the additional premium is the lift premium worked out below; the re-listing of the household resident on the term's latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term's latest Named Driver Exclusion form and the listing that precedes the exclusion of the resident named on the term's latest Named Driver Exclusion form by signing date, when that resident is reported operating a scheduled vehicle on a claim of the term while unlisted and carries no driver-added entry on the term keep their own rules, and every other driver added is still charged driver_term_premium multiplied by the days from the change effective date to the expiration date and divided by term_days.
  trigger: on_request
  subject:
  - auto_driver_added
  computes: additional_premium
  target_tool: lift_driver_exclusion_0b127d81
  params:
    drv_base_rate: 180.0
    pkg_rel_high: 1.25
    pkg_rel_mid: 1.1
    state_rel_high: 1.08
    state_rel_mid: 1.04
    drv_youth_age: 21
    drv_young_age: 25
    drv_age_rel_youth: 1.85
    drv_age_rel_young: 1.35
    drv_rel_relative: 1.05
    drv_rel_unrelated: 1.2
    drv_pts_high: 10
    drv_pts_mid: 5
    drv_pts_rel_high: 1.3
    drv_pts_rel_mid: 1.12
    drv_acc_rel_two: 1.45
    drv_acc_rel_one: 1.25
    drv_platform_rel_two: 1.3
    drv_platform_rel_one: 1.15
    lift_share_pct: 25.0
    occ_rel_two: 0.7
    occ_rel_one: 0.8
  rule: 'This rule settles the lift premium, the additional premium charged when the named insured lifts the exclusion of the driver on the term''s latest claim report recording a named excluded driver, and only for that driver; a lift for any other excluded driver is not decided by this rule. Lifting an exclusion is an add with prior_driver_status excluded, made on the named insured''s own signed request. A driver is added as a rated driver only when the driver''s violation points do not exceed the package''s max_points, and the rated drivers on the term may not exceed the package''s max_rated. A person excluded on one open policy may not be rated on another open policy of the same named insured. The additional premium for lifting a named driver exclusion is fixed only after the term''s latest Named Driver Exclusion form by signing date, when it names a household resident reported operating a scheduled vehicle on a claim of the term while unlisted who carries no driver-added entry on the term, has its exclusion endorsement recorded, apart from a form whose endorsement would take the currently excluded drivers past the package''s maximum number of excluded drivers while the driver being lifted is still counted among them. The additional premium for lifting a named driver exclusion is not fixed until the household resident on the term''s latest claim report recording an unlisted household resident, when rated earlier in the term by a driver-added entry and not named on the term''s latest Named Driver Exclusion form, carries a driver-added entry dated after that claim''s date of loss. For a lift of such a driver''s exclusion, and only for that lift, the additional premium is the lift premium worked out below; the re-listing of the household resident on the term''s latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term''s latest Named Driver Exclusion form and the listing that precedes the exclusion of the resident named on the term''s latest Named Driver Exclusion form by signing date, when that resident is reported operating a scheduled vehicle on a claim of the term while unlisted and carries no driver-added entry on the term keep their own rules, and every other driver added is still charged driver_term_premium multiplied by the days from the change effective date to the expiration date and divided by term_days. The driver concerned is the driver named on the claim report of the term with the latest report date that records the person operating the vehicle as a named excluded driver (when two such reports carry the same report date, the one entered first on the claim file is taken); the driver''s exclusion entry is the driver''s most recent driver-excluded entry on the term (when two of the driver''s entries share a change effective date, the one entered first is taken), and the lift takes effect on the processing date, the date the named insured''s signed request is made, never earlier. The lift share is the company''s filed driver rating of the driver as the driver now stands: the share basis below multiplied by the state relativity (state_rel_high for a term garaged in Florida or Georgia, state_rel_mid in Arizona, Texas or Virginia and 1 elsewhere), by the platform-use relativity of the company''s filed driver rating (drv_platform_rel_two for at least two claim reports of the term naming the driver as operator with the vehicle in use on a ride-hailing or delivery platform, drv_platform_rel_one for one and 1 for none) and by the age-class, relationship, violation-points, accident and occasional-operator relativities below, rounded to the cent; the entry named is the driver''s exclusion entry. The standard lift share is the term''s full_term_premium multiplied by lift_share_pct percent. The standard lift premium is the standard lift share multiplied by the state and platform-use relativities stated above and rounded to the cent, then multiplied by the calendar days from the lift effective date to the expiration date, the effective date counted and the expiration date not counted, and divided by term_days, with no other relativity; it is rounded once, at the end, to the nearest cent, half up. The adjustments below are applied to the standard lift premium in this order: an adjustment that replaces the standard lift share is applied first; the relativities below are then multiplied together with the result into the lift share, rounded to the cent; the lift premium is the lift share multiplied by the days from the lift effective date to the expiration date and divided by term_days, rounded once, at the end, to the nearest cent, half up; a lift premium of 0.00 is not booked, the lift itself still being recorded. Share basis of a lift: when the driver''s exclusion entry records prior_driver_status unlisted, the driver never having been rated on the term, the basis is drv_base_rate multiplied by the package relativity of the company''s filed driver rating, pkg_rel_high for a Cardinal Point 100/200/50, 100/300/50, 100/300/100 or 250/500/100 Liability package, pkg_rel_mid for the Cardinal Point 50/100/50 Liability package and 1 for any other; when the exclusion entry records prior_driver_status rated and a driver_term_premium above zero, the basis is that recorded driver_term_premium divided by the state, relationship, age-class and violation-points relativities as of the exclusion entry''s own change effective date, date of birth, relationship and points, so that the recorded rating is carried forward and only what changed since is re-rated; otherwise the basis is full_term_premium multiplied by lift_share_pct percent. Age-class relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the driver''s age in whole years on the processing date (a year is complete on the birthday, a 29 February birthday completing on 1 March), from the date of birth on the entry named above: under drv_youth_age takes drv_age_rel_youth; at least drv_youth_age and under drv_young_age takes drv_age_rel_young; any other age, or no such entry on the term, takes relativity 1. Violation-points relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the driver_violation_points on the entry named above: at least drv_pts_high takes drv_pts_rel_high; at least drv_pts_mid and fewer than drv_pts_high takes drv_pts_rel_mid; fewer than drv_pts_mid, or no such entry on the term, takes relativity 1. Accident relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the claim reports of the term naming the driver as operator with a collision_with_vehicle or collision_single_vehicle cause: at least two take drv_acc_rel_two; one takes drv_acc_rel_one; none takes relativity 1. Relationship relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the relationship on the entry named above: a child, sibling, parent or other_relative takes drv_rel_relative; an unrelated_household_member takes drv_rel_unrelated; a spouse or any other relationship, or no such entry on the term, takes relativity 1. Occasional-operator relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the rated drivers on the term once the lift is made against the term''s vehicle_count, every rated driver other than the named insured, a driver rated when the term was bound included, being carried by a driver-added entry: the rated drivers are counted as the named insured, plus one for each driver-added entry on the term, less one for each driver-removed or driver-excluded entry that records prior status rated, plus the lifted driver; rated drivers exceeding the vehicles by two or more rate the lifted driver, the last added, as an occasional operator at occ_rel_two; exceeding them by one, at occ_rel_one; any other count takes relativity 1.'
  prerequisite:
  - problem: auto_ext_reported_resident_exclusion
    kind: state_gate
    gate: auto_policy_changes.signed_form_id
    form: state
    policy_source: The additional premium for lifting a named driver exclusion is fixed only after the term's latest Named Driver Exclusion form by signing date, when it names a household resident reported operating a scheduled vehicle on a claim of the term while unlisted who carries no driver-added entry on the term, has its exclusion endorsement recorded, apart from a form whose endorsement would take the currently excluded drivers past the package's maximum number of excluded drivers while the driver being lifted is still counted among them.
    condition: When the term's latest auto_exclusion_form_signed document by document_date names a driver recorded as an unlisted household resident on a claim report of the term who has no auto_driver_added row on the term, an auto_policy_changes row with event_type auto_driver_excluded references it through signed_form_id, except a form whose endorsement would take the currently excluded drivers past max_excluded while the lifted driver still counts.
    resolved_by: exclude_reported_resident_5c3e91a4
    effect: Once the pending signed form has its exclusion endorsement, the lift's gate holds and the lift can be priced and booked.
  - problem: auto_ext_household_resident_relist
    kind: value_input
    gate: ab_occ_rel
    form: state
    policy_source: The additional premium for lifting a named driver exclusion is not fixed until the household resident on the term's latest claim report recording an unlisted household resident, when rated earlier in the term by a driver-added entry and not named on the term's latest Named Driver Exclusion form, carries a driver-added entry dated after that claim's date of loss.
    condition: When the driver named on the term's latest claim report (by report date) recording an unlisted household resident has an auto_driver_added row on the term and is not the excluded_driver_name of the term's latest auto_exclusion_form_signed document, auto_policy_changes carries an auto_driver_added row for that driver dated after that report's date of loss.
    resolved_by: relist_household_resident_37288c8c
    effect: Once the re-listing entry exists, the rated drivers counted for the occasional-operator relativity include the re-listed resident.
  cross_category:
  - category: physdam
    as: history
    reads:
    - physdam_claim_events.driver_name
    - physdam_claim_events.driver_household_status
    - physdam_claim_events.entry_date
    - physdam_claim_events.loss_cause
    - physdam_claim_events.rideshare_use_at_loss
    note: The claim report recording the excluded operator names the driver; his collision reports add accident points and his platform-use reports decide the platform relativity.
  compute:
  - ab_eff: F('effective_date')
  - ab_exp: F('expiration_date')
  - ab_tdays: F('term_days')
  - ab_full: F('full_term_premium')
  - ab_name: XLATEST('physdam','physdam_claim_events','driver_name', date_field='entry_date', auto_policy_id=HID, event_type='physdam_claim_reported', driver_household_status='named_excluded_driver') or ''
  - ab_ex_date: LATEST('auto_policy_changes','change_effective_date', date_field='change_effective_date', event_type='auto_driver_excluded', driver_name=ab_name) or ''
  - ab_days: DAYS(NOW, ab_exp)
  - ab_ex_share: LATEST('auto_policy_changes','driver_term_premium', date_field='change_effective_date', event_type='auto_driver_excluded', driver_name=ab_name) or 0.0
  - ab_ex_prior: LATEST('auto_policy_changes','prior_driver_status', date_field='change_effective_date', event_type='auto_driver_excluded', driver_name=ab_name) or ''
  - ab_dob: LATEST('auto_policy_changes','driver_date_of_birth', date_field='change_effective_date', event_type='auto_driver_excluded', driver_name=ab_name) or ''
  - ab_rel: LATEST('auto_policy_changes','driver_relationship', date_field='change_effective_date', event_type='auto_driver_excluded', driver_name=ab_name) or ''
  - ab_pts_entry: LATEST('auto_policy_changes','driver_violation_points', date_field='change_effective_date', event_type='auto_driver_excluded', driver_name=ab_name) or 0
  - ab_pkg: F('variant_name')
  - ab_pkg_rel: K('pkg_rel_high') if (ab_pkg == 'Cardinal Point 100/200/50 Liability' or ab_pkg == 'Cardinal Point 100/300/50 Liability' or ab_pkg == 'Cardinal Point 100/300/100 Liability' or ab_pkg == 'Cardinal Point 250/500/100 Liability') else (K('pkg_rel_mid') if ab_pkg == 'Cardinal Point 50/100/50 Liability' else 1.0)
  - ab_state: F('garaging_state')
  - ab_state_rel: K('state_rel_high') if (ab_state == 'FL' or ab_state == 'GA') else (K('state_rel_mid') if (ab_state == 'AZ' or ab_state == 'TX' or ab_state == 'VA') else 1.0)
  - ab_age: int(MONTHS(ab_dob, NOW) / 12) if ab_dob != '' else 99
  - ab_age_rel: K('drv_age_rel_youth') if ab_age < K('drv_youth_age') else (K('drv_age_rel_young') if ab_age < K('drv_young_age') else 1.0)
  - ab_relship: LATEST('auto_policy_changes','driver_relationship', date_field='change_effective_date', event_type='auto_driver_excluded', driver_name=ab_name) or ''
  - ab_rel_rel: K('drv_rel_relative') if (ab_relship == 'child' or ab_relship == 'sibling' or ab_relship == 'parent' or ab_relship == 'other_relative') else (K('drv_rel_unrelated') if ab_relship == 'unrelated_household_member' else 1.0)
  - ab_vpts: LATEST('auto_policy_changes','driver_violation_points', date_field='change_effective_date', event_type='auto_driver_excluded', driver_name=ab_name) or 0
  - ab_pts_rel: K('drv_pts_rel_high') if ab_vpts >= K('drv_pts_high') else (K('drv_pts_rel_mid') if ab_vpts >= K('drv_pts_mid') else 1.0)
  - ab_coll: XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ab_name, loss_cause='collision_with_vehicle') + XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ab_name, loss_cause='collision_single_vehicle')
  - ab_acc_rel: K('drv_acc_rel_two') if ab_coll >= 2 else (K('drv_acc_rel_one') if ab_coll == 1 else 1.0)
  - ab_plat: XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ab_name, rideshare_use_at_loss=True)
  - ab_plat_rel: K('drv_platform_rel_two') if ab_plat >= 2 else (K('drv_platform_rel_one') if ab_plat == 1 else 1.0)
  - ab_state_then: K('state_rel_high') if (F('garaging_state') == 'FL' or F('garaging_state') == 'GA') else (K('state_rel_mid') if (F('garaging_state') == 'AZ' or F('garaging_state') == 'TX' or F('garaging_state') == 'VA') else 1.0)
  - ab_rel_then: K('drv_rel_relative') if (ab_rel == 'child' or ab_rel == 'sibling' or ab_rel == 'parent' or ab_rel == 'other_relative') else (K('drv_rel_unrelated') if ab_rel == 'unrelated_household_member' else 1.0)
  - ab_age_then: int(MONTHS(ab_dob, ab_ex_date) / 12) if (ab_dob != '' and ab_ex_date != '') else 99
  - ab_age_rel_then: K('drv_age_rel_youth') if ab_age_then < K('drv_youth_age') else (K('drv_age_rel_young') if ab_age_then < K('drv_young_age') else 1.0)
  - ab_pts_then: K('drv_pts_rel_high') if ab_pts_entry >= K('drv_pts_high') else (K('drv_pts_rel_mid') if ab_pts_entry >= K('drv_pts_mid') else 1.0)
  - ab_basis: K('drv_base_rate') * ab_pkg_rel if ab_ex_prior == 'unlisted' else (ab_ex_share / (ab_state_then * ab_rel_then * ab_age_rel_then * ab_pts_then) if (ab_ex_prior == 'rated' and ab_ex_share > 0) else ab_full * K('lift_share_pct') / 100.0)
  - ab_rated_n: 1 + COUNT('auto_policy_changes', event_type='auto_driver_added') - COUNT('auto_policy_changes', event_type='auto_driver_removed', prior_driver_status='rated') - COUNT('auto_policy_changes', event_type='auto_driver_excluded', prior_driver_status='rated') + 1
  - ab_veh: F('vehicle_count') or 1
  - ab_occ_rel: K('occ_rel_two') if ab_rated_n - ab_veh >= 2 else (K('occ_rel_one') if ab_rated_n - ab_veh == 1 else 1.0)
  - ab_share: RND(ab_basis * ab_state_rel * ab_plat_rel * ab_rel_rel * ab_age_rel * ab_pts_rel * ab_acc_rel * ab_occ_rel, 2)
  - result: RND(MX(0, ab_share * ab_days / ab_tdays), 2)
  compute_basis:
    ab_name: The driver concerned is the driver named on the claim report of the term with the latest report date that records the person operating the vehicle as a named excluded driver
