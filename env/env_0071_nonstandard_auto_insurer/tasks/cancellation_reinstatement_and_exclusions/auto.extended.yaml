  rule: 'This rule settles the listing premium of the exclusion of a reported resident, the premium charged when the resident named on the term''s latest Named Driver Exclusion form by signing date, when that resident is reported operating a scheduled vehicle on a claim of the term while unlisted and carries no driver-added entry on the term, is listed as a rated driver from the date the company learned of the operation and excluded from the form''s effective date, and only that premium. A named driver exclusion is endorsed only on a Named Driver Exclusion form signed by the named insured that names the driver exactly as the driver is to be excluded. The named insured cannot be excluded, and a driver for whom an SR-22 or FR-44 certificate backed by this term is filed cannot be excluded. The number of currently excluded drivers on the term, counted by auto_msr_current_excluded_drivers, must be below max_excluded before another exclusion is endorsed. The resident named on the term''s latest Named Driver Exclusion form by signing date, when that resident is reported operating a scheduled vehicle on a claim of the term while unlisted and carries no driver-added entry on the term, is first listed as a rated driver and then excluded, in one endorsement, and is charged the listing premium worked out below for the days between; for any other driver, a resident once rated on the term by a driver-added entry included, when the driver was rated immediately before the exclusion, premium is returned as an auto_return_premium transaction, and when the driver was unlisted, there is no premium change, this rule charging no listing premium. For the exclusion of such a resident, and only for it, the exclusion takes effect on the date set below, never earlier than the signing date; the exclusion of any other driver still takes effect on the later of the date the form was signed and the requested effective date on the form, never earlier than the signing date. For the listing that precedes the exclusion of such a resident, and only for it, the premium is the listing premium worked out below; the re-listing of the household resident on the term''s latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term''s latest Named Driver Exclusion form, and the lift of the exclusion of the driver on the term''s latest claim report recording a named excluded driver, keep their own rules, and every other driver added is still charged driver_term_premium multiplied by the days from the change effective date to the expiration date and divided by term_days. For the listing that precedes the exclusion of such a resident, and only for it, the listing takes effect on the date set below; the re-listing of the household resident on the term''s latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term''s latest Named Driver Exclusion form, and the lift of the exclusion of the driver on the term''s latest claim report recording a named excluded driver, keep their own rules, and every other driver is still added effective the date the change is requested, never earlier. The form handled is the term''s latest Named Driver Exclusion form by signing date (when two forms share the latest signing date, the one entered first is taken), and the resident concerned is the driver named on it; the claim report handled is the latest report of the term recording that driver operating as an unlisted household resident (when two share the report date, the one entered first on the claim file is taken); the entry named is the driver''s most recent entry on the term (when two share a change effective date, the one entered first is taken). The resident''s listing share is the company''s filed driver rating of the resident, who carries no rated share on the term: drv_base_rate multiplied by the package relativity (pkg_rel_high for a Cardinal Point 100/200/50, 100/300/50, 100/300/100 or 250/500/100 Liability package, pkg_rel_mid for the Cardinal Point 50/100/50 Liability package and 1 for any other) and the state relativity (state_rel_high for a term garaged in Florida or Georgia, state_rel_mid in Arizona, Texas or Virginia and 1 elsewhere) and by the age-class, relationship, violation-points, accident and platform-use relativities below, rounded to the cent. The standard listing share is drv_base_rate multiplied by the package and state relativities, rounded to the cent; the standard listing effective date is the later of the processing date and the day after the reported date of loss. The standard listing premium is the listing share multiplied by the calendar days from the listing effective date to the exclusion effective date (the first counted, the second not, never below zero) and divided by term_days; it is rounded once, at the end, to the nearest cent, half up. The adjustments below are applied to the standard listing premium in this order: the relativities below are multiplied together with the standard listing share into the listing share, rounded to the cent; the listing effective date and the exclusion effective date are settled, giving the days charged; the listing premium is the listing share multiplied by the days charged and divided by term_days, rounded once, at the end, to the nearest cent, half up; a listing premium of 0.00 is not booked, the listing and the exclusion still being recorded. Listing effective date of such a resident: when the resident''s most recent entry on the term is dated before the report date, the listing takes effect on the later of the report date, the day the company learned the resident was operating a scheduled vehicle, and the day after the reported date of loss; when the resident has no entry on the term and the reported date of loss is on or after the term effective date, it takes effect on the day after the reported date of loss; otherwise it takes effect on the later of the processing date and the day after the reported date of loss. The listing never takes effect on or before the date of loss, so the coverage decision on that loss still reads the resident as unlisted. Exclusion effective date: when the form was delivered by mail, the exclusion takes effect on the later of the requested effective date and the date the company counts the form as received, the signing date plus mail_receipt_days days or the processing date when that is earlier, a form being processed only once it is received; otherwise it takes effect on the later of the signing date and the requested effective date. Age-class relativity of the resident''s rating share, under the company''s filed driver rating, by the driver''s age in whole years on the report date of the claim report handled (a year is complete on the birthday, a 29 February birthday completing on 1 March), from the date of birth on the entry named above: under drv_youth_age takes drv_age_rel_youth; at least drv_youth_age and under drv_young_age takes drv_age_rel_young; any other age, or no such entry on the term, takes relativity 1. Relationship relativity of the resident''s rating share, under the company''s filed driver rating, by the relationship on the entry named above: a child, sibling, parent or other_relative takes drv_rel_relative; an unrelated_household_member takes drv_rel_unrelated; a spouse or any other relationship, or no such entry on the term, takes relativity 1. Violation-points relativity of the resident''s rating share, under the company''s filed driver rating, by the driver_violation_points on the entry named above: at least drv_pts_high takes drv_pts_rel_high; at least drv_pts_mid and fewer than drv_pts_high takes drv_pts_rel_mid; fewer than drv_pts_mid, or no such entry on the term, takes relativity 1. Accident relativity of the resident''s rating share, under the company''s filed driver rating, by the claim reports of the term naming the driver as operator with a collision_with_vehicle or collision_single_vehicle cause: at least two take drv_acc_rel_two; one takes drv_acc_rel_one; none takes relativity 1. Platform-use relativity of the resident''s rating share, under the company''s filed driver rating, by the claim reports of the term naming the driver as operator with the vehicle in use on a ride-hailing or delivery platform: at least two take drv_platform_rel_two; one takes drv_platform_rel_one; none takes relativity 1.'
  prerequisite: []
  cross_category:
  - category: physdam
    as: history
    reads:
    - physdam_claim_events.driver_name
    - physdam_claim_events.driver_household_status
    - physdam_claim_events.entry_date
    - physdam_claim_events.date_of_loss
    - physdam_claim_events.loss_cause
    - physdam_claim_events.rideshare_use_at_loss
    note: The claim report recording the resident unlisted fixes the listing date and the date her age is rated on; her collision and platform-use reports decide two relativities.
  compute:
  - ex_exp: F('expiration_date')
  - ex_tdays: F('term_days')
  - ex_name: LATEST('auto_policy_documents','excluded_driver_name', date_field='document_date', event_type='auto_exclusion_form_signed') or ''
  - ex_sign: LATEST('auto_policy_documents','document_date', date_field='document_date', event_type='auto_exclusion_form_signed') or NOW
  - ex_req: LATEST('auto_policy_documents','requested_effective_date', date_field='document_date', event_type='auto_exclusion_form_signed') or NOW
  - ex_via: LATEST('auto_policy_documents','delivery_method', date_field='document_date', event_type='auto_exclusion_form_signed') or ''
  - ex_report: XLATEST('physdam','physdam_claim_events','entry_date', date_field='entry_date', auto_policy_id=HID, event_type='physdam_claim_reported', driver_household_status='unlisted_household_resident', driver_name=ex_name) or NOW
  - ex_loss: XLATEST('physdam','physdam_claim_events','date_of_loss', date_field='entry_date', auto_policy_id=HID, event_type='physdam_claim_reported', driver_household_status='unlisted_household_resident', driver_name=ex_name) or NOW
  - ex_last_date: LATEST('auto_policy_changes','change_effective_date', date_field='change_effective_date', driver_name=ex_name) or ''
  - ex_term_eff: F('effective_date')
  - ex_rep_start: XLATEST('physdam','physdam_claim_events','entry_date', date_field='entry_date', auto_policy_id=HID, event_type='physdam_claim_reported', driver_household_status='unlisted_household_resident', driver_name=ex_name) or NOW
  - ex_start_days: MN(DAYS(ex_rep_start, ex_exp), DAYS(ex_loss, ex_exp) - 1) if (ex_last_date != '' and ex_last_date < ex_rep_start) else ((DAYS(ex_loss, ex_exp) - 1 if ex_loss >= ex_term_eff else DAYS(NOW, ex_exp)) if ex_last_date == '' else MN(DAYS(NOW, ex_exp), DAYS(ex_loss, ex_exp) - 1))
  - ex_end_days: MX(0, MN(DAYS(ex_req, ex_exp), MX(DAYS(ex_sign, ex_exp) - K('mail_receipt_days'), DAYS(NOW, ex_exp)))) if ex_via == 'mail' else MX(0, MN(DAYS(ex_sign, ex_exp), DAYS(ex_req, ex_exp)))
  - ex_dob: LATEST('auto_policy_changes','driver_date_of_birth', date_field='change_effective_date', driver_name=ex_name) or ''
  - ex_pkg: F('variant_name')
  - ex_pkg_rel: K('pkg_rel_high') if (ex_pkg == 'Cardinal Point 100/200/50 Liability' or ex_pkg == 'Cardinal Point 100/300/50 Liability' or ex_pkg == 'Cardinal Point 100/300/100 Liability' or ex_pkg == 'Cardinal Point 250/500/100 Liability') else (K('pkg_rel_mid') if ex_pkg == 'Cardinal Point 50/100/50 Liability' else 1.0)
  - ex_state: F('garaging_state')
  - ex_state_rel: K('state_rel_high') if (ex_state == 'FL' or ex_state == 'GA') else (K('state_rel_mid') if (ex_state == 'AZ' or ex_state == 'TX' or ex_state == 'VA') else 1.0)
  - ex_plat: XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ex_name, rideshare_use_at_loss=True)
  - ex_plat_rel: K('drv_platform_rel_two') if ex_plat >= 2 else (K('drv_platform_rel_one') if ex_plat == 1 else 1.0)
  - ex_age: int(MONTHS(ex_dob, ex_report) / 12) if ex_dob != '' else 99
  - ex_age_rel: K('drv_age_rel_youth') if ex_age < K('drv_youth_age') else (K('drv_age_rel_young') if ex_age < K('drv_young_age') else 1.0)
  - ex_relship: LATEST('auto_policy_changes','driver_relationship', date_field='change_effective_date', driver_name=ex_name) or ''
  - ex_rel_rel: K('drv_rel_relative') if (ex_relship == 'child' or ex_relship == 'sibling' or ex_relship == 'parent' or ex_relship == 'other_relative') else (K('drv_rel_unrelated') if ex_relship == 'unrelated_household_member' else 1.0)
  - ex_last_type: LATEST('auto_policy_changes','event_type', date_field='change_effective_date', driver_name=ex_name) or ''
  - ex_vpts: SUM('auto_policy_changes','driver_violation_points', driver_name=ex_name, change_effective_date=ex_last_date, event_type=ex_last_type)
  - ex_pts_rel: K('drv_pts_rel_high') if ex_vpts >= K('drv_pts_high') else (K('drv_pts_rel_mid') if ex_vpts >= K('drv_pts_mid') else 1.0)
  - ex_coll: XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ex_name, loss_cause='collision_with_vehicle') + XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ex_name, loss_cause='collision_single_vehicle')
  - ex_acc_rel: K('drv_acc_rel_two') if ex_coll >= 2 else (K('drv_acc_rel_one') if ex_coll == 1 else 1.0)
  - ex_share: RND(K('drv_base_rate') * ex_pkg_rel * ex_state_rel * ex_plat_rel * ex_age_rel * ex_rel_rel * ex_pts_rel * ex_acc_rel, 2)
  - ex_days: MX(0, ex_start_days - ex_end_days)
  - ex_added_n: COUNT('auto_policy_changes', event_type='auto_driver_added', driver_name=ex_name)
  - result: 0.0 if ex_added_n > 0 else RND(MX(0, ex_share * ex_days / ex_tdays), 2)
