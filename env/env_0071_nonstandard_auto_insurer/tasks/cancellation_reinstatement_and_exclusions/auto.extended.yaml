- id: auto_ext_insured_request_cancel_return
  base_policy_refs:
  - auto_insured_cancellation
  - auto_unearned_premium_return
  overwrite:
  - base_policy: auto_insured_cancellation
    superseded_clause: The return premium is the pro rata unearned premium from the cancellation effective date reduced by the package's retention_pct of that unearned amount (short rate); fully earned fees are not returned.
    replaced_by: For a cancellation at the insured's request, and only for that cancellation, the premium returned is the insured-request return premium worked out below and fully earned fees are not returned; a cancellation for nonpayment keeps its own rule, and an underwriting cancellation keeps the transaction-by-transaction computation, for every premium written and additional premium row of the term, amount multiplied by the days from the cancellation effective date to the expiration date and divided by that row's premium_days (term_days for premium written), minus the same proportion of every earlier return premium row, rounded to the cent, returned in full pro rata.
  - base_policy: auto_unearned_premium_return
    superseded_clause: 'For a cancellation (nonpayment, underwriting or insured request) the unearned premium is computed transaction by transaction: for every premium written and additional premium row of the term, amount multiplied by the days from the cancellation effective date to the expiration date and divided by that row''s premium_days (term_days for premium written), minus the same proportion of every earlier return premium row, rounded to the cent; premium_days of the return row is the days from the cancellation effective date to the expiration date.'
    replaced_by: For a cancellation at the insured's request, and only for that cancellation, the premium returned is the insured-request return premium worked out below and fully earned fees are not returned; a cancellation for nonpayment keeps its own rule, and an underwriting cancellation keeps the transaction-by-transaction computation, for every premium written and additional premium row of the term, amount multiplied by the days from the cancellation effective date to the expiration date and divided by that row's premium_days (term_days for premium written), minus the same proportion of every earlier return premium row, rounded to the cent, returned in full pro rata.
  - base_policy: auto_unearned_premium_return
    superseded_clause: For an insured-request cancellation the result is then reduced by the package's insured_cancel_short_rate_retention_pct of itself;
    replaced_by: For a cancellation at the insured's request, and only for that cancellation, the premium returned is the insured-request return premium worked out below and fully earned fees are not returned; a cancellation for nonpayment keeps its own rule, and an underwriting cancellation keeps the transaction-by-transaction computation, for every premium written and additional premium row of the term, amount multiplied by the days from the cancellation effective date to the expiration date and divided by that row's premium_days (term_days for premium written), minus the same proportion of every earlier return premium row, rounded to the cent, returned in full pro rata.
  trigger: on_request
  subject:
  - auto_cancelled_insured_request
  computes: return_premium
  target_tool: confirm_cancellation_request_98c044dc
  params:
    ic_short_rate_days: 60
    ic_plan_direct: 15.0
    ic_plan_auto: 7.5
  rule: 'This rule settles the insured-request return premium, the premium returned when the named insured''s signed cancellation request takes effect, and only that return. A cancellation request confirmed by the named insured''s signature must be on file for the term, and a request with request_status received or withdrawn does not cancel the term; only confirmed_by_insured does. The cancellation never takes effect earlier than the date the request was received. The cancellation takes effect at 12:01 a.m. on the requested effective date when that date is on or after the date the request was received, and otherwise on the date the request was received; cancellations are never backdated, including when replacement insurance started earlier. A term in pending_cancellation may also be cancelled at the insured''s request when that date is earlier than the cancellation effective date on the notice; the earlier date governs and cancellation_reason is insured_request. Once a notice of cancellation for nonpayment on the term has reached its cancellation effective date with less than the minimum due paid by then, the return premium of a cancellation at the insured''s request is not fixed until the term''s records show it reinstated and back in force, with a reinstatement date after that cancellation effective date. For a cancellation at the insured''s request, and only for that cancellation, the premium returned is the insured-request return premium worked out below and fully earned fees are not returned; a cancellation for nonpayment keeps its own rule, and an underwriting cancellation keeps the transaction-by-transaction computation, for every premium written and additional premium row of the term, amount multiplied by the days from the cancellation effective date to the expiration date and divided by that row''s premium_days (term_days for premium written), minus the same proportion of every earlier return premium row, rounded to the cent, returned in full pro rata. The request handled is the term''s latest cancellation request with request_status received, by request_received_date (when two share that date, the one entered first is taken); its cancellation effective date is the later of its requested_effective_date and its request_received_date. For an insured-request return premium, the term''s current full-term rate is its recorded full_term_premium, the rating of the named insured and the scheduled vehicles, plus the driver_term_premium of every driver-added change and the vehicle_term_premium of every vehicle-added change recorded on the term, minus the driver_term_premium of every driver-excluded or driver-removed change and the vehicle_term_premium of every vehicle-removed change recorded on the term; every rated driver other than the named insured, a driver rated when the term was bound included, is carried by a driver-added change recording the share it adds, and a driver-removed or driver-excluded change records the share it takes off. Daily basis of an insured-request return premium: when the term''s recorded reinstatement_date is on or before the cancellation effective date and the term carries a re-written premium entry for a reinstatement effective on that date (the re-written entries effective on that date taken together), the daily basis is that entry''s amount divided by its premium_days, the remainder having been re-written at that rate; when the recorded reinstatement_date is after the cancellation effective date and the term carries the re-written premium entry for that reinstatement, the re-written days never having begun, that entry''s whole amount is unearned and is returned in place of the daily basis multiplied by the days returned; otherwise, a reinstatement whose re-written premium of 0.00 was not booked included, the daily basis is the current full-term rate divided by term_days. The standard insured-request return premium is the daily basis, the current full-term rate divided by term_days, multiplied by the days returned, the calendar days from the cancellation effective date to the expiration date (the cancellation effective date counted, the expiration date not counted), and then reduced by the package''s insured_cancel_short_rate_retention_pct percent of that unearned premium. In the standard insured-request return premium nothing is withheld, the amount is never below 0.00, and it is rounded once, at the end, to the nearest cent, half up. The adjustments below are applied to the standard insured-request return premium in this order: those that settle the daily basis and the days returned come first, an adjustment that replaces the standard days returned being applied before any that takes further days off them, never below zero, giving the unearned premium, the daily basis multiplied by the days returned, or the amount an adjustment returns in its place; those stated as a percentage then act once on that unearned premium; those stated as an amount are then subtracted together from that result; the amount is floored at 0.00 and rounded once, at the end, to the nearest cent, half up; a computed return of 0.00 is not booked. Percentage retained on a cancellation at the insured''s request, under the company''s filed short-rate table, by the request_reason on the request handled and the days from the term effective date to the cancellation effective date (the first counted, the second not): a request for moved_out_of_state, vehicle_sold_or_totaled or no_longer_driving retains nothing, the risk having ended, and is returned pro rata; any other request taking effect fewer than ic_short_rate_days days in retains the package''s insured_cancel_short_rate_retention_pct percent; any other request taking effect later retains half that percentage. Days returned on a cancellation at the insured''s request: every certificate backed by the term is read as it stood on the cancellation effective date, so an SR-26 transmitted after that date does not change the reading; a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it; when the term is written to back a certificate (its financial_responsibility_filing names sr22 or fr44) and a certificate backed by the term stood filed on the cancellation effective date, the days returned are the days from the cancellation effective date to the expiration date less certificate_runoff_days, because the company stays bound to the state until the SR-26 takes effect; when the term is written to back a certificate, none stood filed on that date and one has status cancellation_filed with its SR-26 transmitted, its sr26_date, on or before that date, they run from the later of the cancellation effective date and that certificate''s certificate_end_date (the certificate entered first when several have that status); otherwise they run from the cancellation effective date. SR-26 transmission days on a cancellation at the insured''s request, when a certificate backed by the term stood filed on the cancellation effective date, read as stated for the days returned: the company stays bound to the state until certificate_runoff_days after the SR-26, which goes out no earlier than the ending date and no later than sr26_transmit_within_days calendar days after it (the ending date counted as day 0), so the calendar days from the cancellation effective date to the processing date, at most sr26_transmit_within_days, are also kept: processed sr26_transmit_within_days or more days after the cancellation effective date, sr26_transmit_within_days days are kept; processed one or more but fewer days after it, those days are kept; processed on or before the cancellation effective date, or with no certificate standing filed on that date, none are. Installment-plan cancellation charge withheld on a cancellation at the insured''s request, charged each time a cancellation closes the term''s installment plan, a plan reactivated by a reinstatement being closed again, by the billing plan of the term (the plan entered first when the term has more than one): a Cardinal Point Two-Pay Plan, Cardinal Point Four-Pay Plan or Cardinal Point Six-Pay Direct Bill Plan has ic_plan_direct withheld; a Cardinal Point Monthly EFT Plan or Cardinal Point Monthly Card Autopay Plan has ic_plan_auto withheld; any other plan has nothing withheld.'
  prerequisite:
  - problem: auto_ext_lapse_reinstatement_rewrite
    kind: value_input
    gate: ic_rw_amt
    form: state
    policy_source: Once a notice of cancellation for nonpayment on the term has reached its cancellation effective date with less than the minimum due paid by then, the return premium of a cancellation at the insured's request is not fixed until the term's records show it reinstated and back in force, with a reinstatement date after that cancellation effective date.
    condition: On a term whose notice of cancellation for nonpayment reached its effective date with less than the minimum due paid, auto_policies.status is in_force with a reinstatement_date after that cancellation effective date.
    resolved_by: reinstate_lapsed_term_12128c9a
    effect: Once the term is back in force from a recorded reinstatement date, the insured-request cancellation can take effect, and its daily basis reads the re-written entry.
  cross_category:
  - category: fr
    as: branch
    reads:
    - status
    - sr26_date
    - filed_date
    - certificate_runoff_days
    - certificate_end_date
    - sr26_transmit_within_days
    note: The certificate backed by the term, as it stood on the transaction's own effective date, decides the run-off rule and the SR-26 transmission days kept.
  - category: billing
    as: branch
    reads:
    - variant_name
    note: The term's billing plan decides the installment-plan cancellation charge.
  compute:
  - ic_req_date: LATEST('auto_cancellation_requests','requested_effective_date', date_field='request_received_date', request_status='received') or NOW
  - ic_recv_date: LATEST('auto_cancellation_requests','request_received_date', date_field='request_received_date', request_status='received') or NOW
  - ic_eff: MX(ic_req_date, ic_recv_date)
  - ic_exp: F('expiration_date')
  - ic_tdays: F('term_days')
  - ic_rate: F('full_term_premium') + SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_added') - SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_excluded') - SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_removed') + SUM('auto_policy_changes','vehicle_term_premium', event_type='auto_vehicle_added') - SUM('auto_policy_changes','vehicle_term_premium', event_type='auto_vehicle_removed')
  - ic_rw_eff: F('reinstatement_date') or ''
  - ic_rw_amt: SUM('auto_premium_transactions','amount', event_type='auto_additional_premium', transaction_reason='reinstatement', effective_date=ic_rw_eff)
  - ic_rw_pd: SUM('auto_premium_transactions','premium_days', event_type='auto_additional_premium', transaction_reason='reinstatement', effective_date=ic_rw_eff)
  - ic_daily: ic_rw_amt / ic_rw_pd if (ic_rw_eff != '' and ic_rw_eff <= ic_eff and ic_rw_pd > 0) else (0.0 if (ic_rw_eff != '' and ic_rw_eff > ic_eff and ic_rw_amt > 0) else ic_rate / ic_tdays)
  - ic_whole: ic_rw_amt if (ic_rw_eff != '' and ic_rw_eff > ic_eff and ic_rw_amt > 0) else 0.0
  - ic_stamp: F('financial_responsibility_filing') or 'none'
  - ic_filed: ((CFIELD('fr','filed_date', auto_policy_id=HID, status='filed') or '9999-12-31') <= ic_eff or ((CFIELD('fr','filed_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31') <= ic_eff and (CFIELD('fr','sr26_date', auto_policy_id=HID, status='cancellation_filed') or '') > ic_eff))
  - ic_runoff: CPARAM('fr','certificate_runoff_days', auto_policy_id=HID, status='filed') or CPARAM('fr','certificate_runoff_days', auto_policy_id=HID, status='cancellation_filed') or 0
  - ic_cert_end: (CFIELD('fr','certificate_end_date', auto_policy_id=HID, status='cancellation_filed') or '') if (CFIELD('fr','sr26_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31') <= ic_eff else ''
  - ic_base_days: MX(0, DAYS(ic_eff, ic_exp) - ic_runoff) if (ic_stamp != 'none' and ic_filed) else (MX(0, DAYS(MX(ic_eff, ic_cert_end), ic_exp)) if (ic_stamp != 'none' and ic_cert_end != '') else DAYS(ic_eff, ic_exp))
  - ic_lag_raw: DAYS(ic_eff, NOW) if ((CFIELD('fr','filed_date', auto_policy_id=HID, status='filed') or '9999-12-31') <= ic_eff or ((CFIELD('fr','filed_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31') <= ic_eff and (CFIELD('fr','sr26_date', auto_policy_id=HID, status='cancellation_filed') or '') > ic_eff)) else 0
  - ic_lag_max: CPARAM('fr','sr26_transmit_within_days', auto_policy_id=HID, status='filed') or CPARAM('fr','sr26_transmit_within_days', auto_policy_id=HID, status='cancellation_filed') or 0
  - ic_lag: ic_lag_max if ic_lag_raw >= ic_lag_max else (ic_lag_raw if ic_lag_raw >= 1 else 0)
  - ic_days: MX(0, ic_base_days - ic_lag)
  - ic_reason: LATEST('auto_cancellation_requests','request_reason', date_field='request_received_date', request_status='received') or ''
  - ic_days_sr: DAYS(F('effective_date'), ic_eff)
  - ic_kept_pct: 0.0 if (ic_reason == 'moved_out_of_state' or ic_reason == 'vehicle_sold_or_totaled' or ic_reason == 'no_longer_driving') else (P('insured_cancel_short_rate_retention_pct') if ic_days_sr < K('ic_short_rate_days') else P('insured_cancel_short_rate_retention_pct') / 2.0)
  - ic_plan: CFIELD('billing','variant_name', auto_policy_id=HID) or ''
  - ic_plan_charge: K('ic_plan_direct') if (ic_plan == 'Cardinal Point Two-Pay Plan' or ic_plan == 'Cardinal Point Four-Pay Plan' or ic_plan == 'Cardinal Point Six-Pay Direct Bill Plan') else (K('ic_plan_auto') if (ic_plan == 'Cardinal Point Monthly EFT Plan' or ic_plan == 'Cardinal Point Monthly Card Autopay Plan') else 0.0)
  - ic_unearned: ic_whole + ic_daily * ic_days
  - result: RND(MX(0, ic_unearned * (1 - ic_kept_pct / 100.0) - ic_plan_charge), 2)
  compute_basis:
    ic_req_date: The request handled is the term's latest cancellation request with request_status received, by request_received_date (when two share that date, the one entered first is taken); its cancellation effective date is the later of its requested_effective_date and its request_received_date.
    ic_recv_date: the later of its requested_effective_date and its request_received_date
    ic_eff: its cancellation effective date is the later of its requested_effective_date and its request_received_date
    ic_stamp: when the term is written to back a certificate (its financial_responsibility_filing names sr22 or fr44)
    ic_filed: a certificate backed by the term stood filed on the cancellation effective date
    ic_runoff: less certificate_runoff_days
    ic_cert_end: that certificate's certificate_end_date (the certificate entered first when several have that status)
    ic_base_days: 'Days returned on a cancellation at the insured''s request: every certificate backed by the term is read as it stood on the cancellation effective date, so an SR-26 transmitted after that date does not change the reading; a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it; when the term is written to back a certificate (its financial_responsibility_filing names sr22 or fr44) and a certificate backed by the term stood filed on the cancellation effective date, the days returned are the days from the cancellation effective date to the expiration date less certificate_runoff_days, because the company stays bound to the state until the SR-26 takes effect; when the term is written to back a certificate, none stood filed on that date and one has status cancellation_filed with its SR-26 transmitted, its sr26_date, on or before that date, they run from the later of the cancellation effective date and that certificate''s certificate_end_date (the certificate entered first when several have that status); otherwise they run from the cancellation effective date.'
    ic_reason: by the request_reason on the request handled
    ic_kept_pct: 'Percentage retained on a cancellation at the insured''s request, under the company''s filed short-rate table, by the request_reason on the request handled and the days from the term effective date to the cancellation effective date (the first counted, the second not): a request for moved_out_of_state, vehicle_sold_or_totaled or no_longer_driving retains nothing, the risk having ended, and is returned pro rata; any other request taking effect fewer than ic_short_rate_days days in retains the package''s insured_cancel_short_rate_retention_pct percent; any other request taking effect later retains half that percentage.'
    ic_days_sr: 'Percentage retained on a cancellation at the insured''s request, under the company''s filed short-rate table, by the request_reason on the request handled and the days from the term effective date to the cancellation effective date (the first counted, the second not): a request for moved_out_of_state, vehicle_sold_or_totaled or no_longer_driving retains nothing, the risk having ended, and is returned pro rata; any other request taking effect fewer than ic_short_rate_days days in retains the package''s insured_cancel_short_rate_retention_pct percent; any other request taking effect later retains half that percentage.'
    ic_rate: For an insured-request return premium, the term's current full-term rate is its recorded full_term_premium, the rating of the named insured and the scheduled vehicles, plus the driver_term_premium of every driver-added change and the vehicle_term_premium of every vehicle-added change recorded on the term, minus the driver_term_premium of every driver-excluded or driver-removed change and the vehicle_term_premium of every vehicle-removed change recorded on the term; every rated driver other than the named insured, a driver rated when the term was bound included, is carried by a driver-added change recording the share it adds, and a driver-removed or driver-excluded change records the share it takes off.
    ic_rw_eff: 'Daily basis of an insured-request return premium: when the term''s recorded reinstatement_date is on or before the cancellation effective date and the term carries a re-written premium entry for a reinstatement effective on that date (the re-written entries effective on that date taken together), the daily basis is that entry''s amount divided by its premium_days, the remainder having been re-written at that rate; when the recorded reinstatement_date is after the cancellation effective date and the term carries the re-written premium entry for that reinstatement, the re-written days never having begun, that entry''s whole amount is unearned and is returned in place of the daily basis multiplied by the days returned; otherwise, a reinstatement whose re-written premium of 0.00 was not booked included, the daily basis is the current full-term rate divided by term_days.'
    ic_rw_amt: 'Daily basis of an insured-request return premium: when the term''s recorded reinstatement_date is on or before the cancellation effective date and the term carries a re-written premium entry for a reinstatement effective on that date (the re-written entries effective on that date taken together), the daily basis is that entry''s amount divided by its premium_days, the remainder having been re-written at that rate; when the recorded reinstatement_date is after the cancellation effective date and the term carries the re-written premium entry for that reinstatement, the re-written days never having begun, that entry''s whole amount is unearned and is returned in place of the daily basis multiplied by the days returned; otherwise, a reinstatement whose re-written premium of 0.00 was not booked included, the daily basis is the current full-term rate divided by term_days.'
    ic_rw_pd: 'Daily basis of an insured-request return premium: when the term''s recorded reinstatement_date is on or before the cancellation effective date and the term carries a re-written premium entry for a reinstatement effective on that date (the re-written entries effective on that date taken together), the daily basis is that entry''s amount divided by its premium_days, the remainder having been re-written at that rate; when the recorded reinstatement_date is after the cancellation effective date and the term carries the re-written premium entry for that reinstatement, the re-written days never having begun, that entry''s whole amount is unearned and is returned in place of the daily basis multiplied by the days returned; otherwise, a reinstatement whose re-written premium of 0.00 was not booked included, the daily basis is the current full-term rate divided by term_days.'
    ic_daily: 'Daily basis of an insured-request return premium: when the term''s recorded reinstatement_date is on or before the cancellation effective date and the term carries a re-written premium entry for a reinstatement effective on that date (the re-written entries effective on that date taken together), the daily basis is that entry''s amount divided by its premium_days, the remainder having been re-written at that rate; when the recorded reinstatement_date is after the cancellation effective date and the term carries the re-written premium entry for that reinstatement, the re-written days never having begun, that entry''s whole amount is unearned and is returned in place of the daily basis multiplied by the days returned; otherwise, a reinstatement whose re-written premium of 0.00 was not booked included, the daily basis is the current full-term rate divided by term_days.'
    ic_whole: 'Daily basis of an insured-request return premium: when the term''s recorded reinstatement_date is on or before the cancellation effective date and the term carries a re-written premium entry for a reinstatement effective on that date (the re-written entries effective on that date taken together), the daily basis is that entry''s amount divided by its premium_days, the remainder having been re-written at that rate; when the recorded reinstatement_date is after the cancellation effective date and the term carries the re-written premium entry for that reinstatement, the re-written days never having begun, that entry''s whole amount is unearned and is returned in place of the daily basis multiplied by the days returned; otherwise, a reinstatement whose re-written premium of 0.00 was not booked included, the daily basis is the current full-term rate divided by term_days.'
    ic_lag_raw: 'SR-26 transmission days on a cancellation at the insured''s request, when a certificate backed by the term stood filed on the cancellation effective date, read as stated for the days returned: the company stays bound to the state until certificate_runoff_days after the SR-26, which goes out no earlier than the ending date and no later than sr26_transmit_within_days calendar days after it (the ending date counted as day 0), so the calendar days from the cancellation effective date to the processing date, at most sr26_transmit_within_days, are also kept: processed sr26_transmit_within_days or more days after the cancellation effective date, sr26_transmit_within_days days are kept; processed one or more but fewer days after it, those days are kept; processed on or before the cancellation effective date, or with no certificate standing filed on that date, none are.'
    ic_lag_max: 'SR-26 transmission days on a cancellation at the insured''s request, when a certificate backed by the term stood filed on the cancellation effective date, read as stated for the days returned: the company stays bound to the state until certificate_runoff_days after the SR-26, which goes out no earlier than the ending date and no later than sr26_transmit_within_days calendar days after it (the ending date counted as day 0), so the calendar days from the cancellation effective date to the processing date, at most sr26_transmit_within_days, are also kept: processed sr26_transmit_within_days or more days after the cancellation effective date, sr26_transmit_within_days days are kept; processed one or more but fewer days after it, those days are kept; processed on or before the cancellation effective date, or with no certificate standing filed on that date, none are.'
    ic_lag: 'SR-26 transmission days on a cancellation at the insured''s request, when a certificate backed by the term stood filed on the cancellation effective date, read as stated for the days returned: the company stays bound to the state until certificate_runoff_days after the SR-26, which goes out no earlier than the ending date and no later than sr26_transmit_within_days calendar days after it (the ending date counted as day 0), so the calendar days from the cancellation effective date to the processing date, at most sr26_transmit_within_days, are also kept: processed sr26_transmit_within_days or more days after the cancellation effective date, sr26_transmit_within_days days are kept; processed one or more but fewer days after it, those days are kept; processed on or before the cancellation effective date, or with no certificate standing filed on that date, none are.'
    ic_days: 'The adjustments below are applied to the standard insured-request return premium in this order: those that settle the daily basis and the days returned come first, an adjustment that replaces the standard days returned being applied before any that takes further days off them, never below zero, giving the unearned premium, the daily basis multiplied by the days returned, or the amount an adjustment returns in its place; those stated as a percentage then act once on that unearned premium; those stated as an amount are then subtracted together from that result; the amount is floored at 0.00 and rounded once, at the end, to the nearest cent, half up; a computed return of 0.00 is not booked.'
    ic_plan: 'Installment-plan cancellation charge withheld on a cancellation at the insured''s request, charged each time a cancellation closes the term''s installment plan, a plan reactivated by a reinstatement being closed again, by the billing plan of the term (the plan entered first when the term has more than one): a Cardinal Point Two-Pay Plan, Cardinal Point Four-Pay Plan or Cardinal Point Six-Pay Direct Bill Plan has ic_plan_direct withheld; a Cardinal Point Monthly EFT Plan or Cardinal Point Monthly Card Autopay Plan has ic_plan_auto withheld; any other plan has nothing withheld.'
    ic_plan_charge: 'Installment-plan cancellation charge withheld on a cancellation at the insured''s request, charged each time a cancellation closes the term''s installment plan, a plan reactivated by a reinstatement being closed again, by the billing plan of the term (the plan entered first when the term has more than one): a Cardinal Point Two-Pay Plan, Cardinal Point Four-Pay Plan or Cardinal Point Six-Pay Direct Bill Plan has ic_plan_direct withheld; a Cardinal Point Monthly EFT Plan or Cardinal Point Monthly Card Autopay Plan has ic_plan_auto withheld; any other plan has nothing withheld.'
    ic_unearned: 'The adjustments below are applied to the standard insured-request return premium in this order: those that settle the daily basis and the days returned come first, an adjustment that replaces the standard days returned being applied before any that takes further days off them, never below zero, giving the unearned premium, the daily basis multiplied by the days returned, or the amount an adjustment returns in its place; those stated as a percentage then act once on that unearned premium; those stated as an amount are then subtracted together from that result; the amount is floored at 0.00 and rounded once, at the end, to the nearest cent, half up; a computed return of 0.00 is not booked.'
  factors:
  - id: ic_returned_days_runoff
    effect: method
    decides: ic_base_days
    bindings:
    - ic_filed
    - ic_runoff
    - ic_cert_end
    - ic_base_days
    ladder:
    - when: the term is written to back a certificate and a certificate backed by it stood filed on the cancellation effective date
      method: days returned = days to expiration less certificate_runoff_days
    - when: the term is written to back a certificate, none stood filed on that date and one has status cancellation_filed with its SR-26 transmitted on or before that date
      method: days returned run from the later of the cancellation date and that certificate's end date
    - when: otherwise
      method: days returned run from the cancellation date
    baseline:
      ic_base_days: DAYS(ic_eff, ic_exp)
    evidence:
    - cross_category
    - date
    cross_difficulty: fr
  - id: ic_sr26_transmission_days
    effect: parameter
    decides: ic_lag
    bindings:
    - ic_lag_raw
    - ic_lag_max
    - ic_lag
    ladder:
    - when: processed sr26_transmit_within_days or more days after the ending date, a certificate standing filed on that date
      value: sr26_transmit_within_days
    - when: processed one or more but fewer days after it
      value: the days elapsed
    - when: otherwise (processed on or before the ending date, or no certificate standing filed on that date)
      value: '0'
    baseline:
      ic_lag: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: fr
  - id: ic_retained_pct
    effect: parameter
    decides: ic_kept_pct
    bindings:
    - ic_reason
    - ic_days_sr
    - ic_kept_pct
    ladder:
    - when: request_reason moved_out_of_state, vehicle_sold_or_totaled or no_longer_driving
      value: '0.0'
    - when: any other reason, taking effect fewer than ic_short_rate_days days into the term
      value: P('insured_cancel_short_rate_retention_pct')
    - when: otherwise
      value: P('insured_cancel_short_rate_retention_pct') / 2.0
    baseline:
      ic_kept_pct: P('insured_cancel_short_rate_retention_pct')
    evidence:
    - intake
    - date
    cross_difficulty: null
  - id: ic_installment_plan_withheld
    effect: parameter
    decides: ic_plan_charge
    bindings:
    - ic_plan
    - ic_plan_charge
    ladder:
    - when: a Two-Pay, Four-Pay or Six-Pay Direct Bill plan
      value: K('ic_plan_direct')
    - when: a Monthly EFT or Monthly Card Autopay plan
      value: K('ic_plan_auto')
    - when: otherwise
      value: '0.0'
    baseline:
      ic_plan_charge: '0.0'
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: ic_daily_basis_rule
    effect: method
    decides: ic_daily
    bindings:
    - ic_rw_eff
    - ic_rw_amt
    - ic_rw_pd
    - ic_daily
    - ic_whole
    ladder:
    - when: the recorded reinstatement date is on or before the cancellation effective date and a re-written entry is effective on it
      method: unearned = entry amount / entry premium_days x days returned
    - when: the recorded reinstatement date is after the cancellation effective date and the re-written entry exists
      method: unearned = the re-written entry's whole amount
    - when: otherwise (no reinstatement, or no re-written entry booked)
      method: unearned = current full-term rate / term_days x days returned
    baseline:
      ic_daily: ic_rate / ic_tdays
      ic_whole: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The standard insured-request return premium is the daily basis, the current full-term rate divided by term_days, multiplied by the days returned, the calendar days from the cancellation effective date to the expiration date (the cancellation effective date counted, the expiration date not counted), and then reduced by the package's insured_cancel_short_rate_retention_pct percent of that unearned premium. In the standard insured-request return premium nothing is withheld, the amount is never below 0.00, and it is rounded once, at the end, to the nearest cent, half up.
    params:
    - insured_cancel_short_rate_retention_pct
  inputs:
    history:
    - table: auto_premium_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: auto_additional_premium
        transaction_reason: reinstatement
    - table: auto_cancellation_requests
      aggregate: latest
      field: request_received_date
      filters:
        request_status: received
    cross_category:
    - fr
    - billing
- id: auto_ext_reported_resident_exclusion
  base_policy_refs:
  - auto_driver_exclusion
  - auto_agg_household_drivers
  - auto_premium_charging
  - auto_driver_schedule
  overwrite:
  - base_policy: auto_driver_exclusion
    superseded_clause: When the driver was rated immediately before the exclusion, premium is returned as an auto_return_premium transaction; when the driver was unlisted, there is no premium change.
    replaced_by: The resident named on the term's latest Named Driver Exclusion form by signing date, when that resident is reported operating a scheduled vehicle on a claim of the term while unlisted and carries no driver-added entry on the term, is first listed as a rated driver and then excluded, in one endorsement, and is charged the listing premium worked out below for the days between; for any other driver, a resident once rated on the term by a driver-added entry included, when the driver was rated immediately before the exclusion, premium is returned as an auto_return_premium transaction, and when the driver was unlisted, there is no premium change, this rule charging no listing premium.
  - base_policy: auto_driver_exclusion
    superseded_clause: The exclusion takes effect on the later of the date the form was signed and the requested effective date on the form, never earlier than the signing date,
    replaced_by: For the exclusion of such a resident, and only for it, the exclusion takes effect on the date set below, never earlier than the signing date; the exclusion of any other driver still takes effect on the later of the date the form was signed and the requested effective date on the form, never earlier than the signing date.
  - base_policy: auto_premium_charging
    superseded_clause: Additional premium for a rated driver added is driver_term_premium multiplied by the days from the change effective date to the expiration date and divided by term_days;
    replaced_by: For the listing that precedes the exclusion of such a resident, and only for it, the premium is the listing premium worked out below; the re-listing of the household resident on the term's latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term's latest Named Driver Exclusion form, and the lift of the exclusion of the driver on the term's latest claim report recording a named excluded driver, keep their own rules, and every other driver added is still charged driver_term_premium multiplied by the days from the change effective date to the expiration date and divided by term_days.
  - base_policy: auto_driver_schedule
    superseded_clause: A driver is added effective the date the change is requested, never earlier;
    replaced_by: For the listing that precedes the exclusion of such a resident, and only for it, the listing takes effect on the date set below; the re-listing of the household resident on the term's latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term's latest Named Driver Exclusion form, and the lift of the exclusion of the driver on the term's latest claim report recording a named excluded driver, keep their own rules, and every other driver is still added effective the date the change is requested, never earlier.
  trigger: state_due
  subject:
  - auto_driver_excluded
  - auto_driver_added
  computes: listing_premium
  target_tool: exclude_reported_resident_5c3e91a4
  params:
    drv_base_rate: 180.0
    pkg_rel_high: 1.25
    pkg_rel_mid: 1.1
    state_rel_high: 1.08
    state_rel_mid: 1.04
    drv_youth_age: 21
    drv_young_age: 25
    drv_age_rel_youth: 1.85
    drv_age_rel_young: 1.35
    drv_rel_relative: 1.05
    drv_rel_unrelated: 1.2
    drv_pts_high: 10
    drv_pts_mid: 5
    drv_pts_rel_high: 1.3
    drv_pts_rel_mid: 1.12
    drv_acc_rel_two: 1.45
    drv_acc_rel_one: 1.25
    drv_platform_rel_two: 1.3
    drv_platform_rel_one: 1.15
