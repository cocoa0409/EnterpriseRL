    ab_pts_entry: 'Violation-points relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the driver_violation_points on the entry named above: at least drv_pts_high takes drv_pts_rel_high; at least drv_pts_mid and fewer than drv_pts_high takes drv_pts_rel_mid; fewer than drv_pts_mid, or no such entry on the term, takes relativity 1.'
