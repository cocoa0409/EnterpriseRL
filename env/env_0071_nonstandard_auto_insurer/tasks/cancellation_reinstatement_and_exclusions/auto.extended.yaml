  overwrite:
  - base_policy: auto_driver_schedule
    superseded_clause: A driver is added effective the date the change is requested, never earlier;
    replaced_by: For the household resident on the term's latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term's latest Named Driver Exclusion form, and only for that resident, the listing takes effect on the date set below and the additional premium is the re-listing premium worked out below; the lift of the exclusion of the driver on the term's latest claim report recording a named excluded driver and the listing that precedes the exclusion of the resident named on the term's latest Named Driver Exclusion form by signing date, when that resident is reported operating a scheduled vehicle on a claim of the term while unlisted and carries no driver-added entry on the term keep their own rules, and every other driver is still added effective the date the change is requested, never earlier, and charged driver_term_premium multiplied by the days from the change effective date to the expiration date and divided by term_days.
