  factors:
  - id: ex_listing_start_rule
    effect: method
    decides: ex_start_days
    bindings:
    - ex_loss
    - ex_rep_start
    - ex_start_days
    ladder:
    - when: the resident's most recent entry is dated before the report date
      method: listing from the later of the report date and the day after the date of loss
    - when: no entry on the term and the date of loss on or after the term effective date
      method: listing from the day after the date of loss
    - when: otherwise
      method: listing from the later of the processing date and the day after the date of loss
    baseline:
      ex_start_days: MN(DAYS(NOW, ex_exp), DAYS(ex_loss, ex_exp) - 1)
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: physdam
  - id: ex_age_class_rel
    effect: parameter
    decides: ex_age_rel
    bindings:
    - ex_age
    - ex_age_rel
    ladder:
    - when: age under drv_youth_age
      value: K('drv_age_rel_youth')
    - when: age at least drv_youth_age and under drv_young_age
      value: K('drv_age_rel_young')
    - when: otherwise
      value: '1.0'
    baseline:
      ex_age_rel: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: ex_relationship_rel
    effect: parameter
    decides: ex_rel_rel
    bindings:
    - ex_relship
    - ex_rel_rel
    ladder:
    - when: a child, sibling, parent or other_relative
      value: K('drv_rel_relative')
    - when: an unrelated household member
      value: K('drv_rel_unrelated')
    - when: otherwise
      value: '1.0'
    baseline:
      ex_rel_rel: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: ex_violation_points_rel
    effect: parameter
    decides: ex_pts_rel
    bindings:
    - ex_last_type
    - ex_vpts
    - ex_pts_rel
    ladder:
    - when: at least drv_pts_high points on the entry
      value: K('drv_pts_rel_high')
    - when: at least drv_pts_mid and fewer than drv_pts_high
      value: K('drv_pts_rel_mid')
    - when: otherwise
      value: '1.0'
    baseline:
      ex_pts_rel: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: ex_accident_rel
    effect: parameter
    decides: ex_acc_rel
    bindings:
    - ex_coll
    - ex_acc_rel
    ladder:
    - when: at least two collision reports naming the driver
      value: K('drv_acc_rel_two')
    - when: exactly one
      value: K('drv_acc_rel_one')
    - when: otherwise
      value: '1.0'
    baseline:
      ex_acc_rel: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: physdam
  - id: ex_platform_use_rel
    effect: parameter
    decides: ex_plat_rel
    bindings:
    - ex_plat
    - ex_plat_rel
    ladder:
    - when: at least two claim reports naming the driver with platform use
      value: K('drv_platform_rel_two')
    - when: exactly one
      value: K('drv_platform_rel_one')
    - when: otherwise
      value: '1.0'
    baseline:
      ex_plat_rel: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: physdam
  baseline:
    rule: The standard listing share is drv_base_rate multiplied by the package and state relativities, rounded to the cent; the standard listing effective date is the later of the processing date and the day after the reported date of loss. The standard listing premium is the listing share multiplied by the calendar days from the listing effective date to the exclusion effective date (the first counted, the second not, never below zero) and divided by term_days; it is rounded once, at the end, to the nearest cent, half up.
