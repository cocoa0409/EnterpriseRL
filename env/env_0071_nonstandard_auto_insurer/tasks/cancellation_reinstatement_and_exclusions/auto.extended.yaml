  rule: 'This rule settles the re-listing premium, the additional premium charged when the household resident on the term''s latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term''s latest Named Driver Exclusion form, is listed again as a rated driver, and only that premium. Every resident of the household at or above household_listing_min_age is listed as a rated driver or as a named excluded driver, and a household member who must be listed and is neither rated nor excluded must be added as a rated driver subject to package acceptability. A driver is added as a rated driver only when the driver''s violation points do not exceed the package''s max_points, and the rated drivers on the term may not exceed the package''s max_rated. A person excluded on one open policy may not be rated on another open policy of the same named insured. For the household resident on the term''s latest claim report recording an unlisted household resident, when that resident was rated earlier in the term by a driver-added entry and is not the resident named on the term''s latest Named Driver Exclusion form, and only for that resident, the listing takes effect on the date set below and the additional premium is the re-listing premium worked out below; the lift of the exclusion of the driver on the term''s latest claim report recording a named excluded driver and the listing that precedes the exclusion of the resident named on the term''s latest Named Driver Exclusion form by signing date, when that resident is reported operating a scheduled vehicle on a claim of the term while unlisted and carries no driver-added entry on the term keep their own rules, and every other driver is still added effective the date the change is requested, never earlier, and charged driver_term_premium multiplied by the days from the change effective date to the expiration date and divided by term_days. The resident concerned is the driver named on the claim report of the term with the latest report date that records the person operating the vehicle as an unlisted household resident; when two such reports carry the same report date, the one entered first on the claim file is taken; that report''s report date and date of loss, and the resident''s most recent entry on the term by change effective date (when two of the driver''s entries share a change effective date, the one entered first is taken), supply every date, date of birth, relationship and violation points read below. The resident named on the term''s latest Named Driver Exclusion form is not re-listed under this rule: the exclusion rule lists and excludes that resident when the resident carries no driver-added entry on the term, and otherwise the resident is excluded under the base clause, and the listing of a resident with no driver-added entry on the term is not decided by this rule, there being no recorded share to re-rate. The resident''s re-listing share is the driver_term_premium recorded on the resident''s most recent entry, the share the resident''s last rating on the term gave, multiplied by the relativities below for what has changed since that rating, rounded to the cent; that rating is the resident''s most recent driver-added entry. The standard re-listing share is the driver_term_premium recorded on the resident''s most recent entry, and the standard listing effective date is the later of the processing date and the day after the reported date of loss. The standard re-listing premium is the re-listing share multiplied by the calendar days from the listing effective date to the expiration date, the effective date counted and the expiration date not counted, and divided by term_days; it is rounded once, at the end, to the nearest cent, half up. The adjustments below are applied to the standard re-listing premium in this order: the relativities below are multiplied together with the recorded share into the re-listing share, which is rounded to the cent; the listing effective date is settled, giving the days charged; the re-listing premium is the re-listing share multiplied by the days charged and divided by term_days, rounded once, at the end, to the nearest cent, half up; a premium of 0.00 is not booked, the listing itself still being recorded. Listing effective date of a re-listed resident: when the resident''s most recent entry on the term is a driver-removed entry dated before the report date, the listing takes effect on the later of the report date, the day the company learned the resident was again operating a scheduled vehicle, and the day after the reported date of loss; when the resident''s most recent entry is a driver-added entry dated after the reported date of loss, the resident is already listed again and nothing is charged; otherwise the listing takes effect on the later of the processing date and the day after the reported date of loss. The listing never takes effect on or before the date of loss, so the coverage decision on that loss still reads the resident as unlisted. Age-class change of the re-listed resident, under the company''s filed driver rating, whose age classes are youth under drv_youth_age (relativity drv_age_rel_youth), young at least drv_youth_age and under drv_young_age (relativity drv_age_rel_young) and standard at any other age (relativity 1), by the resident''s age in whole years (a year is complete on the birthday, a 29 February birthday completing on 1 March) from the date of birth on the resident''s most recent entry, on the change effective date of the resident''s most recent driver-added entry, the date of that rating, and on the report date, the date the resident is rated again: a youth then and young now takes drv_age_rel_young divided by drv_age_rel_youth; a youth then and standard now takes 1 divided by drv_age_rel_youth; a young then and standard now takes 1 divided by drv_age_rel_young; an unchanged class takes relativity 1. Points change of the re-listed resident, under the company''s filed driver rating, whose points tiers are high at drv_pts_high points or more, mid at drv_pts_mid or more and fewer than drv_pts_high, and low below drv_pts_mid, by the driver_violation_points on the rating entry and on the resident''s most recent entry: low then and mid now takes drv_pts_rel_mid; low then and high now takes drv_pts_rel_high; mid then and high now takes drv_pts_rel_high divided by drv_pts_rel_mid; mid then and low now takes 1 divided by drv_pts_rel_mid; high then and mid now takes drv_pts_rel_mid divided by drv_pts_rel_high; high then and low now takes 1 divided by drv_pts_rel_high; an unchanged tier takes relativity 1. Accident relativity of the re-listed resident, under the company''s filed driver rating, by the claim reports of the term naming the resident as operator while an unlisted household resident with a collision_with_vehicle or collision_single_vehicle cause, which the recorded share, rated while the resident was listed, does not carry: at least two take drv_acc_rel_two; one takes drv_acc_rel_one; none takes relativity 1. Platform-use relativity of the re-listed resident, under the company''s filed driver rating, by the claim reports of the term naming the resident as operator while an unlisted household resident with the vehicle in use on a ride-hailing or delivery platform: at least two take drv_platform_rel_two; one takes drv_platform_rel_one; none takes relativity 1.'
  prerequisite: []
  cross_category:
  - category: physdam
    as: history
    reads:
    - physdam_claim_events.driver_name
    - physdam_claim_events.driver_household_status
    - physdam_claim_events.entry_date
    - physdam_claim_events.date_of_loss
    - physdam_claim_events.loss_cause
    - physdam_claim_events.rideshare_use_at_loss
    note: The claim report recording the unlisted resident names her and fixes the listing date; her collision reports add accident points and her platform-use reports decide the platform relativity.
  compute:
  - ad_exp: F('expiration_date')
  - ad_tdays: F('term_days')
  - ad_name: XLATEST('physdam','physdam_claim_events','driver_name', date_field='entry_date', auto_policy_id=HID, event_type='physdam_claim_reported', driver_household_status='unlisted_household_resident') or ''
  - ad_report: XLATEST('physdam','physdam_claim_events','entry_date', date_field='entry_date', auto_policy_id=HID, event_type='physdam_claim_reported', driver_household_status='unlisted_household_resident') or NOW
  - ad_loss: XLATEST('physdam','physdam_claim_events','date_of_loss', date_field='entry_date', auto_policy_id=HID, event_type='physdam_claim_reported', driver_household_status='unlisted_household_resident') or NOW
  - ad_last_date: LATEST('auto_policy_changes','change_effective_date', date_field='change_effective_date', driver_name=ad_name) or ''
  - ad_last_type: LATEST('auto_policy_changes','event_type', date_field='change_effective_date', driver_name=ad_name) or ''
  - ad_dob: LATEST('auto_policy_changes','driver_date_of_birth', date_field='change_effective_date', driver_name=ad_name) or ''
  - ad_days: MN(DAYS(ad_report, ad_exp), DAYS(ad_loss, ad_exp) - 1) if (ad_last_type == 'auto_driver_removed' and ad_last_date < ad_report) else (0 if (ad_last_type == 'auto_driver_added' and ad_last_date > ad_loss) else MN(DAYS(NOW, ad_exp), DAYS(ad_loss, ad_exp) - 1))
  - ad_form_name: LATEST('auto_policy_documents','excluded_driver_name', date_field='document_date', event_type='auto_exclusion_form_signed') or ''
  - ad_rec_share: SUM('auto_policy_changes','driver_term_premium', driver_name=ad_name, change_effective_date=ad_last_date, event_type=ad_last_type)
  - ad_rate_date: LATEST('auto_policy_changes','change_effective_date', date_field='change_effective_date', event_type='auto_driver_added', driver_name=ad_name) or ''
  - ad_age_then: int(MONTHS(ad_dob, ad_rate_date) / 12) if (ad_dob != '' and ad_rate_date != '') else 99
  - ad_age_now: int(MONTHS(ad_dob, ad_report) / 12) if ad_dob != '' else 99
  - ad_age_rel: (K('drv_age_rel_young') / K('drv_age_rel_youth') if (ad_age_then < K('drv_youth_age') and ad_age_now >= K('drv_youth_age') and ad_age_now < K('drv_young_age')) else (1.0 / K('drv_age_rel_youth') if (ad_age_then < K('drv_youth_age') and ad_age_now >= K('drv_young_age')) else (1.0 / K('drv_age_rel_young') if (ad_age_then >= K('drv_youth_age') and ad_age_then < K('drv_young_age') and ad_age_now >= K('drv_young_age')) else 1.0)))
  - ad_pts_then: SUM('auto_policy_changes','driver_violation_points', event_type='auto_driver_added', driver_name=ad_name, change_effective_date=ad_rate_date)
  - ad_pts_now: SUM('auto_policy_changes','driver_violation_points', driver_name=ad_name, change_effective_date=ad_last_date, event_type=ad_last_type)
  - ad_tier_then: ('high' if ad_pts_then >= K('drv_pts_high') else ('mid' if ad_pts_then >= K('drv_pts_mid') else 'low'))
  - ad_tier_now: ('high' if ad_pts_now >= K('drv_pts_high') else ('mid' if ad_pts_now >= K('drv_pts_mid') else 'low'))
  - ad_pts_rel: K('drv_pts_rel_mid') if (ad_tier_then == 'low' and ad_tier_now == 'mid') else (K('drv_pts_rel_high') if (ad_tier_then == 'low' and ad_tier_now == 'high') else (K('drv_pts_rel_high') / K('drv_pts_rel_mid') if (ad_tier_then == 'mid' and ad_tier_now == 'high') else (1.0 / K('drv_pts_rel_mid') if (ad_tier_then == 'mid' and ad_tier_now == 'low') else (K('drv_pts_rel_mid') / K('drv_pts_rel_high') if (ad_tier_then == 'high' and ad_tier_now == 'mid') else (1.0 / K('drv_pts_rel_high') if (ad_tier_then == 'high' and ad_tier_now == 'low') else 1.0)))))
  - ad_coll: XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ad_name, loss_cause='collision_with_vehicle', driver_household_status='unlisted_household_resident') + XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ad_name, loss_cause='collision_single_vehicle', driver_household_status='unlisted_household_resident')
  - ad_acc_rel: K('drv_acc_rel_two') if ad_coll >= 2 else (K('drv_acc_rel_one') if ad_coll == 1 else 1.0)
  - ad_plat: XCOUNT('physdam','physdam_claim_events', event_type='physdam_claim_reported', auto_policy_id=HID, driver_name=ad_name, rideshare_use_at_loss=True, driver_household_status='unlisted_household_resident')
  - ad_plat_rel: K('drv_platform_rel_two') if ad_plat >= 2 else (K('drv_platform_rel_one') if ad_plat == 1 else 1.0)
  - ad_share: 0.0 if (ad_name == ad_form_name or ad_rate_date == '') else RND(ad_rec_share * ad_age_rel * ad_pts_rel * ad_acc_rel * ad_plat_rel, 2)
  - result: RND(MX(0, ad_share * ad_days / ad_tdays), 2)
