extended_policies:
- id: auto_ext_nonpay_cancel_return
  base_policy_refs:
  - auto_cancellation_nonpayment
  - auto_unearned_premium_return
  overwrite:
  - base_policy: auto_cancellation_nonpayment
    superseded_clause: Unearned premium is returned pro rata from the cancellation effective date (auto_return_premium), and fully earned fees are not returned.
    replaced_by: For a term cancelled for nonpayment, and only for such a cancellation, the premium returned is the nonpayment return premium worked out below, and fully earned fees are not returned.
  - base_policy: auto_unearned_premium_return
    superseded_clause: 'For a cancellation (nonpayment, underwriting or insured request) the unearned premium is computed transaction by transaction: for every premium written and additional premium row of the term, amount multiplied by the days from the cancellation effective date to the expiration date and divided by that row''s premium_days (term_days for premium written), minus the same proportion of every earlier return premium row, rounded to the cent; premium_days of the return row is the days from the cancellation effective date to the expiration date.'
    replaced_by: For a cancellation for nonpayment, and only for that cancellation, the unearned premium is worked out from the term's current full-term rate as stated below, and premium_days of the return entry is the days returned; an underwriting cancellation keeps the transaction-by-transaction computation, for every premium written and additional premium row of the term, amount multiplied by the days from the cancellation effective date to the expiration date and divided by that row's premium_days (term_days for premium written), minus the same proportion of every earlier return premium row, rounded to the cent, with premium_days of the return row the days from the cancellation effective date to the expiration date; a cancellation at the insured's request keeps its own rule.
  - base_policy: auto_unearned_premium_return
    superseded_clause: nonpayment and underwriting cancellations are returned in full pro rata.
    replaced_by: An underwriting cancellation is still returned in full pro rata; a cancellation for nonpayment is returned as worked out below.
  trigger: state_due
  subject:
  - auto_cancelled_nonpayment
  computes: return_premium
  target_tool: cancel_term_for_nonpayment_77de57b0
  params:
    acq_days_early: 90
    acq_days_mid: 150
    acq_charge_early: 40.0
    acq_charge_mid: 20.0
    plan_charge_direct: 15.0
    plan_charge_auto: 7.5
  rule: 'This rule settles the nonpayment return premium, the premium returned when a term is cancelled for nonpayment, and only that return. The cancellation is processed no earlier than the cancellation effective date stated on the notice; the comparison is made on calendar dates, the processing date being on or after the cancellation effective date itself with processing_lag_days added. Here processing_lag_days is zero days, so the cancellation may be processed on the cancellation effective date itself. The cancellation proceeds only when payments posted on or before the cancellation effective date total less than the minimum due stated on the notice. Coverage ends at 12:01 a.m. on the cancellation effective date, which is also the closed_date, and cancellation_reason is nonpayment. For a term cancelled for nonpayment, and only for such a cancellation, the premium returned is the nonpayment return premium worked out below, and fully earned fees are not returned. For a cancellation for nonpayment, and only for that cancellation, the unearned premium is worked out from the term''s current full-term rate as stated below, and premium_days of the return entry is the days returned; an underwriting cancellation keeps the transaction-by-transaction computation, for every premium written and additional premium row of the term, amount multiplied by the days from the cancellation effective date to the expiration date and divided by that row''s premium_days (term_days for premium written), minus the same proportion of every earlier return premium row, rounded to the cent, with premium_days of the return row the days from the cancellation effective date to the expiration date; a cancellation at the insured''s request keeps its own rule. An underwriting cancellation is still returned in full pro rata; a cancellation for nonpayment is returned as worked out below. The term''s current full-term rate is its recorded full_term_premium, the rating of the named insured and the scheduled vehicles, plus the driver_term_premium of every driver-added change and the vehicle_term_premium of every vehicle-added change recorded on the term, minus the driver_term_premium of every driver-excluded or driver-removed change and the vehicle_term_premium of every vehicle-removed change recorded on the term; every rated driver other than the named insured, a driver rated when the term was bound included, is carried by a driver-added change recording the share it adds, and a driver-removed or driver-excluded change records the share it takes off. The standard nonpayment return premium is the current full-term rate multiplied by the days returned and divided by term_days, where the days returned are the calendar days from the cancellation effective date to the expiration date, the cancellation effective date counted and the expiration date not counted. In the standard nonpayment return premium nothing is retained or withheld, the amount is never below 0.00, and it is rounded once, at the end, to the nearest cent, half up. The adjustments below are applied to the standard nonpayment return premium in this order: those that settle the days returned come first, an adjustment that replaces the standard days returned being applied before any that takes further days off them, never below zero, giving the pro rata unearned premium, the current full-term rate multiplied by the days returned and divided by term_days; those stated as an amount are then subtracted together from it; the amount is floored at 0.00 and rounded once, at the end, to the nearest cent, half up; a computed return of 0.00 is not booked. Days returned on a cancellation for nonpayment: every certificate backed by the term is read as it stood on the cancellation effective date, so an SR-26 transmitted after that date does not change the reading; a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it; when the term is written to back a certificate (its financial_responsibility_filing names sr22 or fr44) and a certificate backed by the term stood filed on the cancellation effective date, the days returned are the calendar days from the cancellation effective date to the expiration date less certificate_runoff_days, because the company stays bound to the state until the SR-26 takes effect; when the term is written to back a certificate, none backed by it stood filed on that date and one has status cancellation_filed with its SR-26 transmitted, its sr26_date, on or before that date, the days returned run from the later of the cancellation effective date and that certificate''s certificate_end_date (the certificate entered first when several have that status) to the expiration date; otherwise the days returned run from the cancellation effective date to the expiration date. SR-26 transmission days on a cancellation for nonpayment, when a certificate backed by the term stood filed on the cancellation effective date, read as stated for the days returned: the company stays bound to the state until certificate_runoff_days after the SR-26, which goes out no earlier than the ending date and no later than sr26_transmit_within_days calendar days after it (the ending date counted as day 0), so the calendar days from the cancellation effective date to the processing date, at most sr26_transmit_within_days, are also kept: processed sr26_transmit_within_days or more days after the cancellation effective date, sr26_transmit_within_days days are kept; processed one or more but fewer days after it, those days are kept; processed on the cancellation effective date itself, or with no certificate standing filed on that date, none are. Acquisition expense withheld from the return on a cancellation for nonpayment, once on a term, at its first cancellation, counted in calendar days from the term effective date to the cancellation effective date (the effective date counted, the cancellation effective date not counted): on a new-business term (term_number 1) cancelled fewer than acq_days_early days in, acq_charge_early is withheld; on a new-business term cancelled at least acq_days_early and fewer than acq_days_mid days in, acq_charge_mid is withheld; otherwise nothing is withheld. Installment-plan cancellation charge withheld from the return on a cancellation for nonpayment, charged each time a cancellation closes the term''s installment plan, by the billing plan of the term (the plan entered first when the term has more than one): a Cardinal Point Two-Pay Plan, Cardinal Point Four-Pay Plan or Cardinal Point Six-Pay Direct Bill Plan has plan_charge_direct withheld; a Cardinal Point Monthly EFT Plan or Cardinal Point Monthly Card Autopay Plan has plan_charge_auto withheld; any other plan has nothing withheld.'
  prerequisite: []
  cross_category:
  - category: fr
    as: branch
    reads:
    - status
    - sr26_date
    - filed_date
    - certificate_end_date
    - certificate_runoff_days
    - sr26_transmit_within_days
    note: The certificate backed by the term, as it stood on the transaction's own effective date, decides the run-off rule and the SR-26 transmission days kept.
  - category: billing
    as: branch
    reads:
    - variant_name
    note: The term's billing plan decides the installment-plan cancellation charge.
  compute:
  - nc_eff: F('effective_date')
  - nc_ced: F('cancellation_effective_date')
  - nc_exp: F('expiration_date')
  - nc_tdays: F('term_days')
  - nc_rate: F('full_term_premium') + SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_added') - SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_excluded') - SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_removed') + SUM('auto_policy_changes','vehicle_term_premium', event_type='auto_vehicle_added') - SUM('auto_policy_changes','vehicle_term_premium', event_type='auto_vehicle_removed')
  - nc_stamp: F('financial_responsibility_filing') or 'none'
  - nc_filed: ((CFIELD('fr','filed_date', auto_policy_id=HID, status='filed') or '9999-12-31') <= nc_ced or ((CFIELD('fr','filed_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31') <= nc_ced and (CFIELD('fr','sr26_date', auto_policy_id=HID, status='cancellation_filed') or '') > nc_ced))
  - nc_runoff: CPARAM('fr','certificate_runoff_days', auto_policy_id=HID, status='filed') or CPARAM('fr','certificate_runoff_days', auto_policy_id=HID, status='cancellation_filed') or 0
  - nc_sr26_end: (CFIELD('fr','certificate_end_date', auto_policy_id=HID, status='cancellation_filed') or '') if (CFIELD('fr','sr26_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31') <= nc_ced else ''
  - nc_base_days: MX(0, DAYS(nc_ced, nc_exp) - nc_runoff) if (nc_stamp != 'none' and nc_filed) else (MX(0, DAYS(MX(nc_ced, nc_sr26_end), nc_exp)) if (nc_stamp != 'none' and nc_sr26_end != '') else DAYS(nc_ced, nc_exp))
  - nc_lag_raw: DAYS(nc_ced, NOW) if ((CFIELD('fr','filed_date', auto_policy_id=HID, status='filed') or '9999-12-31') <= nc_ced or ((CFIELD('fr','filed_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31') <= nc_ced and (CFIELD('fr','sr26_date', auto_policy_id=HID, status='cancellation_filed') or '') > nc_ced)) else 0
  - nc_lag_max: CPARAM('fr','sr26_transmit_within_days', auto_policy_id=HID, status='filed') or CPARAM('fr','sr26_transmit_within_days', auto_policy_id=HID, status='cancellation_filed') or 0
  - nc_lag: nc_lag_max if nc_lag_raw >= nc_lag_max else (nc_lag_raw if nc_lag_raw >= 1 else 0)
  - nc_days_returned: MX(0, nc_base_days - nc_lag)
  - nc_days_in: DAYS(nc_eff, nc_ced)
  - nc_prior_canc: COUNT('auto_premium_transactions', event_type='auto_return_premium', transaction_reason='cancellation_nonpayment') + COUNT('auto_premium_transactions', event_type='auto_return_premium', transaction_reason='cancellation_insured_request')
  - nc_acq: 0.0 if nc_prior_canc > 0 else (K('acq_charge_early') if (F('term_number') == 1 and nc_days_in < K('acq_days_early')) else (K('acq_charge_mid') if (F('term_number') == 1 and nc_days_in >= K('acq_days_early') and nc_days_in < K('acq_days_mid')) else 0.0))
  - nc_plan: CFIELD('billing','variant_name', auto_policy_id=HID) or ''
  - nc_plan_charge: K('plan_charge_direct') if (nc_plan == 'Cardinal Point Two-Pay Plan' or nc_plan == 'Cardinal Point Four-Pay Plan' or nc_plan == 'Cardinal Point Six-Pay Direct Bill Plan') else (K('plan_charge_auto') if (nc_plan == 'Cardinal Point Monthly EFT Plan' or nc_plan == 'Cardinal Point Monthly Card Autopay Plan') else 0.0)
  - result: RND(MX(0, nc_rate * nc_days_returned / nc_tdays - nc_acq - nc_plan_charge), 2)
  compute_basis:
    nc_ced: The cancellation is processed no earlier than the cancellation effective date stated on the notice
    nc_stamp: when the term is written to back a certificate (its financial_responsibility_filing names sr22 or fr44)
    nc_filed: a certificate backed by the term stood filed on the cancellation effective date
    nc_runoff: less certificate_runoff_days
    nc_sr26_end: that certificate's certificate_end_date (the certificate entered first when several have that status)
    nc_base_days: 'Days returned on a cancellation for nonpayment: every certificate backed by the term is read as it stood on the cancellation effective date, so an SR-26 transmitted after that date does not change the reading; a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it; when the term is written to back a certificate (its financial_responsibility_filing names sr22 or fr44) and a certificate backed by the term stood filed on the cancellation effective date, the days returned are the calendar days from the cancellation effective date to the expiration date less certificate_runoff_days, because the company stays bound to the state until the SR-26 takes effect; when the term is written to back a certificate, none backed by it stood filed on that date and one has status cancellation_filed with its SR-26 transmitted, its sr26_date, on or before that date, the days returned run from the later of the cancellation effective date and that certificate''s certificate_end_date (the certificate entered first when several have that status) to the expiration date; otherwise the days returned run from the cancellation effective date to the expiration date.'
    nc_rate: The term's current full-term rate is its recorded full_term_premium, the rating of the named insured and the scheduled vehicles, plus the driver_term_premium of every driver-added change and the vehicle_term_premium of every vehicle-added change recorded on the term, minus the driver_term_premium of every driver-excluded or driver-removed change and the vehicle_term_premium of every vehicle-removed change recorded on the term; every rated driver other than the named insured, a driver rated when the term was bound included, is carried by a driver-added change recording the share it adds, and a driver-removed or driver-excluded change records the share it takes off.
    nc_lag_raw: 'SR-26 transmission days on a cancellation for nonpayment, when a certificate backed by the term stood filed on the cancellation effective date, read as stated for the days returned: the company stays bound to the state until certificate_runoff_days after the SR-26, which goes out no earlier than the ending date and no later than sr26_transmit_within_days calendar days after it (the ending date counted as day 0), so the calendar days from the cancellation effective date to the processing date, at most sr26_transmit_within_days, are also kept: processed sr26_transmit_within_days or more days after the cancellation effective date, sr26_transmit_within_days days are kept; processed one or more but fewer days after it, those days are kept; processed on the cancellation effective date itself, or with no certificate standing filed on that date, none are.'
    nc_lag_max: 'SR-26 transmission days on a cancellation for nonpayment, when a certificate backed by the term stood filed on the cancellation effective date, read as stated for the days returned: the company stays bound to the state until certificate_runoff_days after the SR-26, which goes out no earlier than the ending date and no later than sr26_transmit_within_days calendar days after it (the ending date counted as day 0), so the calendar days from the cancellation effective date to the processing date, at most sr26_transmit_within_days, are also kept: processed sr26_transmit_within_days or more days after the cancellation effective date, sr26_transmit_within_days days are kept; processed one or more but fewer days after it, those days are kept; processed on the cancellation effective date itself, or with no certificate standing filed on that date, none are.'
    nc_lag: 'SR-26 transmission days on a cancellation for nonpayment, when a certificate backed by the term stood filed on the cancellation effective date, read as stated for the days returned: the company stays bound to the state until certificate_runoff_days after the SR-26, which goes out no earlier than the ending date and no later than sr26_transmit_within_days calendar days after it (the ending date counted as day 0), so the calendar days from the cancellation effective date to the processing date, at most sr26_transmit_within_days, are also kept: processed sr26_transmit_within_days or more days after the cancellation effective date, sr26_transmit_within_days days are kept; processed one or more but fewer days after it, those days are kept; processed on the cancellation effective date itself, or with no certificate standing filed on that date, none are.'
    nc_days_returned: 'The adjustments below are applied to the standard nonpayment return premium in this order: those that settle the days returned come first, an adjustment that replaces the standard days returned being applied before any that takes further days off them, never below zero, giving the pro rata unearned premium, the current full-term rate multiplied by the days returned and divided by term_days; those stated as an amount are then subtracted together from it; the amount is floored at 0.00 and rounded once, at the end, to the nearest cent, half up; a computed return of 0.00 is not booked.'
    nc_days_in: 'Acquisition expense withheld from the return on a cancellation for nonpayment, once on a term, at its first cancellation, counted in calendar days from the term effective date to the cancellation effective date (the effective date counted, the cancellation effective date not counted): on a new-business term (term_number 1) cancelled fewer than acq_days_early days in, acq_charge_early is withheld; on a new-business term cancelled at least acq_days_early and fewer than acq_days_mid days in, acq_charge_mid is withheld; otherwise nothing is withheld.'
    nc_prior_canc: 'Acquisition expense withheld from the return on a cancellation for nonpayment, once on a term, at its first cancellation, counted in calendar days from the term effective date to the cancellation effective date (the effective date counted, the cancellation effective date not counted): on a new-business term (term_number 1) cancelled fewer than acq_days_early days in, acq_charge_early is withheld; on a new-business term cancelled at least acq_days_early and fewer than acq_days_mid days in, acq_charge_mid is withheld; otherwise nothing is withheld.'
    nc_acq: 'Acquisition expense withheld from the return on a cancellation for nonpayment, once on a term, at its first cancellation, counted in calendar days from the term effective date to the cancellation effective date (the effective date counted, the cancellation effective date not counted): on a new-business term (term_number 1) cancelled fewer than acq_days_early days in, acq_charge_early is withheld; on a new-business term cancelled at least acq_days_early and fewer than acq_days_mid days in, acq_charge_mid is withheld; otherwise nothing is withheld.'
    nc_plan: 'Installment-plan cancellation charge withheld from the return on a cancellation for nonpayment, charged each time a cancellation closes the term''s installment plan, by the billing plan of the term (the plan entered first when the term has more than one): a Cardinal Point Two-Pay Plan, Cardinal Point Four-Pay Plan or Cardinal Point Six-Pay Direct Bill Plan has plan_charge_direct withheld; a Cardinal Point Monthly EFT Plan or Cardinal Point Monthly Card Autopay Plan has plan_charge_auto withheld; any other plan has nothing withheld.'
    nc_plan_charge: 'Installment-plan cancellation charge withheld from the return on a cancellation for nonpayment, charged each time a cancellation closes the term''s installment plan, by the billing plan of the term (the plan entered first when the term has more than one): a Cardinal Point Two-Pay Plan, Cardinal Point Four-Pay Plan or Cardinal Point Six-Pay Direct Bill Plan has plan_charge_direct withheld; a Cardinal Point Monthly EFT Plan or Cardinal Point Monthly Card Autopay Plan has plan_charge_auto withheld; any other plan has nothing withheld.'
  factors:
  - id: nc_returned_days_runoff
    effect: method
    decides: nc_base_days
    bindings:
    - nc_filed
    - nc_runoff
    - nc_sr26_end
    - nc_base_days
    ladder:
    - when: the term is written to back a certificate and a certificate backed by it stood filed on the cancellation effective date
      method: days returned = days from the cancellation effective date to expiration less certificate_runoff_days, never below zero
    - when: the term is written to back a certificate, none stood filed on that date and one has status cancellation_filed with its SR-26 transmitted on or before that date
      method: days returned run from the later of the cancellation effective date and that certificate's certificate_end_date
    - when: otherwise
      method: days returned run from the cancellation effective date to the expiration date
    baseline:
      nc_base_days: DAYS(nc_ced, nc_exp)
    evidence:
    - cross_category
    - date
    cross_difficulty: fr
  - id: nc_sr26_transmission_days
    effect: parameter
    decides: nc_lag
    bindings:
    - nc_lag_raw
    - nc_lag_max
    - nc_lag
    ladder:
    - when: processed sr26_transmit_within_days or more days after the ending date, a certificate standing filed on that date
      value: sr26_transmit_within_days
    - when: processed one or more but fewer days after it
      value: the days elapsed
    - when: otherwise (processed on the ending date, or no certificate standing filed on that date)
      value: '0'
    baseline:
      nc_lag: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: fr
  - id: nc_acquisition_withheld
    effect: parameter
    decides: nc_acq
    bindings:
    - nc_days_in
    - nc_prior_canc
    - nc_acq
    ladder:
    - when: first cancellation of a new-business term, fewer than acq_days_early days in
      value: K('acq_charge_early')
    - when: first cancellation of a new-business term, at least acq_days_early and fewer than acq_days_mid days in
      value: K('acq_charge_mid')
    - when: otherwise
      value: '0.0'
    baseline:
      nc_acq: '0.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: nc_installment_plan_withheld
    effect: parameter
    decides: nc_plan_charge
    bindings:
    - nc_plan
    - nc_plan_charge
    ladder:
    - when: a Two-Pay, Four-Pay or Six-Pay Direct Bill plan
      value: K('plan_charge_direct')
    - when: a Monthly EFT or Monthly Card Autopay plan
      value: K('plan_charge_auto')
    - when: otherwise
      value: '0.0'
    baseline:
      nc_plan_charge: '0.0'
    evidence:
    - cross_category
    cross_difficulty: billing
  baseline:
    rule: The standard nonpayment return premium is the current full-term rate multiplied by the days returned and divided by term_days, where the days returned are the calendar days from the cancellation effective date to the expiration date, the cancellation effective date counted and the expiration date not counted. In the standard nonpayment return premium nothing is retained or withheld, the amount is never below 0.00, and it is rounded once, at the end, to the nearest cent, half up.
    params: []
  inputs:
    history:
    - table: auto_premium_transactions
      aggregate: count
      field: auto_premium_txn_id
      filters:
        event_type: auto_return_premium
    cross_category:
    - fr
    - billing
- id: auto_ext_lapse_reinstatement_rewrite
  base_policy_refs:
  - auto_fees
  - auto_reinstatement
  overwrite:
  - base_policy: auto_reinstatement
    superseded_clause: The reinstatement effective date is the later of the posting date of the payment that completed the past-due amount and the Statement of No Loss signing date, plus reinstatement_effective_offset_days
    replaced_by: The reinstatement effective date is the later of the posting date of the latest payment posted to the term's billing plan (the plan entered first when the term has more than one; every payment posted on that latest date counts as posted that day) and the signing date of the latest Statement of No Loss on the term attesting no loss (when two of the statements share a signing date, the one entered first is taken), plus reinstatement_effective_offset_days; the lapse runs from the cancellation effective date through the day before it.
  - base_policy: auto_reinstatement
    superseded_clause: A reinstatement with lapse books the reinstatement fee and re-writes premium for the days from the reinstatement effective date to the expiration date, computed as the cancellation return premium multiplied by those days and divided by the premium_days of the cancellation return premium, rounded to the cent.
    replaced_by: For a reinstatement with lapse, and only for such a reinstatement, the reinstatement effective date is the date stated below, no loss occurring in the lapse is covered, the reinstatement fee is booked, and the premium re-written to the expiration date is the re-written premium worked out below; a reinstatement without lapse still restores the term from the cancellation effective date and re-writes the returned premium in full.
  - base_policy: auto_fees
    superseded_clause: The reinstatement fee is charged once for each reinstatement with a lapse, and never for a rescission or a reinstatement without lapse.
    replaced_by: For a reinstatement with lapse, and only for it, the reinstatement fee is charged once, at the amount worked out below under the company's state schedule; a rescission or a reinstatement without lapse is still charged none.
  trigger: state_due
  subject:
  - auto_reinstated
  computes: reinstatement_fee
  target_tool: reinstate_lapsed_term_12128c9a
  params:
    hist_notices_high: 3
    hist_notices_mid: 2
    hist_rel_high: 1.15
    hist_rel_mid: 1.08
    fee_pct: 15.0
    fee_floor: 30.0
    fee_lapse_days_long: 15
    fee_lapse_days_mid: 8
    fee_lapse_long: 10.0
    fee_lapse_mid: 5.0
    fee_continue: 5.0
    fee_form_fr44: 10.0
    fee_form_sr22: 5.0
    fee_type_owner_operator: 3.0
    fee_type_owner: 2.0
    fee_out_high: 10.0
    fee_out: 5.0
    fee_continue_part: 3.0
  rule: 'This rule settles the reinstatement fee of a reinstatement with lapse, the fee charged when a term cancelled for nonpayment is reinstated with a lapse in coverage, and states the re-written premium booked with it; a reinstatement without lapse keeps its own rule. Only a term whose cancellation_reason is nonpayment can be reinstated. A reinstatement with lapse is processed no later than reinstatement_window_days calendar days after the cancellation effective date; calendar days are counted from the cancellation effective date as day 0, so the last day of the window is the cancellation effective date plus the window days. Payments posted to the term''s billing plan after the cancellation effective date must cover every past-due amount on the plan, including installment, late and NSF fees. A Statement of No Loss with no_loss_attested true must be on file, and the reinstatement is processed no later than no_loss_statement_max_age_days calendar days after the Statement of No Loss was signed, counted from the signing date as day 0. The term must have fewer than max_lapse_reinstatements reinstatements with a lapse already, counted by auto_msr_lapse_reinstatements_in_term. The reinstatement fee of a reinstatement with lapse is fixed only after the term''s records show it cancelled for nonpayment and closed on the cancellation effective date. For a reinstatement with lapse, and only for such a reinstatement, the reinstatement effective date is the date stated below, no loss occurring in the lapse is covered, the reinstatement fee is booked, and the premium re-written to the expiration date is the re-written premium worked out below; a reinstatement without lapse still restores the term from the cancellation effective date and re-writes the returned premium in full. For a reinstatement with lapse, and only for it, the reinstatement fee is charged once, at the amount worked out below under the company''s state schedule; a rescission or a reinstatement without lapse is still charged none. For a re-written premium, the term''s current full-term rate is its recorded full_term_premium, the rating of the named insured and the scheduled vehicles, plus the driver_term_premium of every driver-added change and the vehicle_term_premium of every vehicle-added change recorded on the term, minus the driver_term_premium of every driver-excluded or driver-removed change and the vehicle_term_premium of every vehicle-removed change recorded on the term; every rated driver other than the named insured, a driver rated when the term was bound included, is carried by a driver-added change recording the share it adds, and a driver-removed or driver-excluded change records the share it takes off. The reinstatement effective date is the later of the posting date of the latest payment posted to the term''s billing plan (the plan entered first when the term has more than one; every payment posted on that latest date counts as posted that day) and the signing date of the latest Statement of No Loss on the term attesting no loss (when two of the statements share a signing date, the one entered first is taken), plus reinstatement_effective_offset_days; the lapse runs from the cancellation effective date through the day before it. The re-written premium is the current full-term rate multiplied by the nonpayment-history relativity below, divided by term_days and multiplied by the re-written days, the calendar days from the reinstatement effective date to the expiration date (the reinstatement effective date counted, the expiration date not counted) as limited below, rounded once, at the end, to the nearest cent, half up; no premium is charged for the days of the lapse, and a re-written premium of 0.00 is not booked. Re-written days of a reinstatement with lapse: when the term carries the return premium entry booked for its cancellation for nonpayment, the entry whose effective date is the term''s cancellation effective date (the one entered first when two share the latest transaction date), the re-written days are the fewer of the calendar days from the reinstatement effective date to the expiration date and that entry''s premium_days, because days the return kept, such as certificate run-off days, were never given back and are not charged again; when the term is recorded cancelled for nonpayment, closed on its cancellation effective date, but no such entry was booked, a return of 0.00 not being booked, nothing was given back and the re-written days are zero; otherwise they are the days from the reinstatement effective date to the expiration date. Nonpayment-history relativity of the re-written premium, under the company''s filed term rating, by the notices of cancellation for nonpayment issued on the term, the notice that led to the cancellation included: at least hist_notices_high notices take hist_rel_high; hist_notices_mid notices take hist_rel_mid; a single notice takes relativity 1. The standard reinstatement fee is the package''s reinstatement_fee. In the standard reinstatement fee nothing is added, and the fee is rounded once, at the end, to the nearest cent, half up. The adjustments below are applied to the standard reinstatement fee in this order: an adjustment that replaces the standard reinstatement fee is applied first; those stated as amounts are then added together to the result; the fee is rounded once, at the end, to the nearest cent, half up. Fee basis under the company''s state schedule, by the term''s garaging_state: Florida or Georgia set the fee at fee_pct percent of the re-written premium; Arizona, Texas or Virginia set it at the greater of the package''s reinstatement_fee and fee_floor; any other state keeps the package''s reinstatement_fee. Lapse charge, by how long coverage lapsed before it was restored, the calendar days from the cancellation effective date to the reinstatement effective date (the first counted, the second not): at least fee_lapse_days_long days add fee_lapse_long; at least fee_lapse_days_mid and fewer than fee_lapse_days_long days add fee_lapse_mid; fewer than fee_lapse_days_mid days add nothing. Every certificate backed by the term is read in this rule as it stood on the reinstatement effective date, so a certificate filed or an SR-26 transmitted after that date does not change the reading: a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it, and an SR-26 counts only when it was transmitted, its sr26_date, on or before that date. Certificate exposure charge, by how the certificate backed by the term stood with the state while coverage lapsed, a liability the lapse days carried no premium for and the certificate''s filing fee does not price: a certificate kept in force through the lapse, standing filed on the reinstatement effective date with no SR-26 transmitted on or before it, the company staying bound to the state for every lapse day, adds fee_continue; a certificate whose SR-26 was transmitted on or before the reinstatement effective date and whose certificate_end_date is on or after that date, the company staying bound for part of the lapse, adds fee_continue_part; a certificate that ended before coverage was restored, which a new filing charged under its own fee must replace, or no certificate, adds nothing. Certificate-form charge, by the form of the certificate backed by the term (the certificate entered first with status filed when its filed_date is on or before the reinstatement effective date, else the certificate entered first with status cancellation_filed when its filed_date is on or before that date): an FR-44 certificate adds fee_form_fr44; an SR-22 certificate adds fee_form_sr22; no such certificate adds nothing. Certificate-type charge, by the type of that certificate: an owner-operator certificate adds fee_type_owner_operator; an owner certificate adds fee_type_owner; no such certificate adds nothing. Out-of-state filing charge, by the filing_state of that certificate against the term''s garaging_state: a filing state that differs from the garaging state and is Florida or Virginia, where FR-44 certificates are also filed, adds fee_out_high; a filing state that differs from the garaging state and is any other state adds fee_out; a filing state equal to the garaging state, or no such certificate, adds nothing.'
  prerequisite:
  - problem: auto_ext_nonpay_cancel_return
    kind: state_gate
    gate: auto_policies.cancellation_reason
    form: state
    policy_source: The reinstatement fee of a reinstatement with lapse is fixed only after the term's records show it cancelled for nonpayment and closed on the cancellation effective date.
    condition: auto_policies.status is cancelled with cancellation_reason nonpayment and closed_date equal to cancellation_effective_date, with the nonpayment return entry (when one is due) booked with effective_date the cancellation effective date.
    resolved_by: cancel_term_for_nonpayment_77de57b0
    effect: Once the term is recorded cancelled for nonpayment, the reinstatement can be booked with its fee and its re-written premium.
  cross_category:
  - category: billing
    as: history
    reads:
    - billing_plan_id
    - billing_transactions.posted_date
    - billing_transactions.event_type
    note: The latest payment date fixes the reinstatement effective date and with it the lapse.
  - category: fr
    as: branch
    reads:
    - certificate_end_date
    - sr26_date
    - filed_date
    - certificate_form
    - certificate_type
    - filing_state
    - status
    note: The certificate backed by the term, as it stood on the transaction's own effective date, decides the certificate handling, form, type and out-of-state charges.
  compute:
  - rw_ced: F('cancellation_effective_date')
  - rw_exp: F('expiration_date')
  - rw_tdays: F('term_days')
  - rw_rate: F('full_term_premium') + SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_added') - SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_excluded') - SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_removed') + SUM('auto_policy_changes','vehicle_term_premium', event_type='auto_vehicle_added') - SUM('auto_policy_changes','vehicle_term_premium', event_type='auto_vehicle_removed')
  - rw_plan_id: CFIELD('billing','billing_plan_id', auto_policy_id=HID) or ''
  - rw_pay_date: XLATEST('billing','billing_transactions','posted_date', date_field='posted_date', event_type='billing_payment_received', billing_plan_id=rw_plan_id) or rw_ced
  - rw_snl_date: LATEST('auto_policy_documents','document_date', date_field='document_date', event_type='auto_no_loss_statement', no_loss_attested=True) or rw_ced
  - rw_reinst_days: DAYS(MX(rw_pay_date, rw_snl_date), rw_exp) - P('reinstatement_effective_offset_days')
  - rw_ret_pd: LATEST('auto_premium_transactions','premium_days', date_field='transaction_date', event_type='auto_return_premium', transaction_reason='cancellation_nonpayment', effective_date=rw_ced) or 0
  - rw_ret_n: COUNT('auto_premium_transactions', event_type='auto_return_premium', transaction_reason='cancellation_nonpayment', effective_date=rw_ced)
  - rw_cancelled: F('cancellation_reason') == 'nonpayment' and F('closed_date') == rw_ced
  - rw_days: MX(0, MN(rw_reinst_days, rw_ret_pd)) if rw_ret_n > 0 else (0 if rw_cancelled else MX(0, rw_reinst_days))
  - rw_notices: COUNT('auto_policy_documents', event_type='auto_cancellation_notice')
  - rw_hist_rel: K('hist_rel_high') if rw_notices >= K('hist_notices_high') else (K('hist_rel_mid') if rw_notices == K('hist_notices_mid') else 1.0)
  - rw_rewritten: RND(MX(0, rw_rate * rw_hist_rel / rw_tdays * rw_days), 2)
  - rw_fee_state: F('garaging_state')
  - rw_fee_rw: RND(MX(0, (F('full_term_premium') + SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_added') - SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_excluded') - SUM('auto_policy_changes','driver_term_premium', event_type='auto_driver_removed') + SUM('auto_policy_changes','vehicle_term_premium', event_type='auto_vehicle_added') - SUM('auto_policy_changes','vehicle_term_premium', event_type='auto_vehicle_removed')) * rw_hist_rel / rw_tdays * rw_days), 2)
  - rw_fee_basis: K('fee_pct') / 100.0 * rw_fee_rw if (rw_fee_state == 'FL' or rw_fee_state == 'GA') else (MX(P('reinstatement_fee'), K('fee_floor')) if (rw_fee_state == 'AZ' or rw_fee_state == 'TX' or rw_fee_state == 'VA') else P('reinstatement_fee'))
  - rw_lapse_days: DAYS(rw_ced, MX(rw_pay_date, rw_snl_date)) + P('reinstatement_effective_offset_days')
  - rw_fee_lapse: K('fee_lapse_long') if rw_lapse_days >= K('fee_lapse_days_long') else (K('fee_lapse_mid') if rw_lapse_days >= K('fee_lapse_days_mid') else 0.0)
  - rw_reinst_date_days: DAYS(MX(rw_pay_date, rw_snl_date), rw_exp) - P('reinstatement_effective_offset_days')
  - rw_cert_filed: (DAYS(CFIELD('fr','filed_date', auto_policy_id=HID, status='filed') or '9999-12-31', rw_exp) >= rw_reinst_date_days) or ((DAYS(CFIELD('fr','filed_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31', rw_exp) >= rw_reinst_date_days) and DAYS(CFIELD('fr','sr26_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31', rw_exp) < rw_reinst_date_days)
  - rw_cert_sent: EXISTS('fr', auto_policy_id=HID, status='cancellation_filed') and (DAYS(CFIELD('fr','sr26_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31', rw_exp) >= rw_reinst_date_days)
  - rw_cert_end: CFIELD('fr','certificate_end_date', auto_policy_id=HID, status='cancellation_filed') or ''
  - rw_fee_cert: K('fee_continue') if rw_cert_filed else (K('fee_continue_part') if (rw_cert_sent and rw_cert_end != '' and DAYS(rw_cert_end, rw_exp) <= rw_reinst_date_days) else 0.0)
  - rw_form_on: DAYS(MX(rw_pay_date, rw_snl_date), rw_exp) - P('reinstatement_effective_offset_days')
  - rw_form: (CPARAM('fr','certificate_form', auto_policy_id=HID, status='filed') if (DAYS(CFIELD('fr','filed_date', auto_policy_id=HID, status='filed') or '9999-12-31', rw_exp) >= rw_form_on) else '') or (CPARAM('fr','certificate_form', auto_policy_id=HID, status='cancellation_filed') if (DAYS(CFIELD('fr','filed_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31', rw_exp) >= rw_form_on) else '') or ''
  - rw_fee_form: K('fee_form_fr44') if rw_form == 'FR-44' else (K('fee_form_sr22') if rw_form == 'SR-22' else 0.0)
  - rw_type_on: DAYS(MX(rw_pay_date, rw_snl_date), rw_exp) - P('reinstatement_effective_offset_days')
  - rw_ctype: (CPARAM('fr','certificate_type', auto_policy_id=HID, status='filed') if (DAYS(CFIELD('fr','filed_date', auto_policy_id=HID, status='filed') or '9999-12-31', rw_exp) >= rw_type_on) else '') or (CPARAM('fr','certificate_type', auto_policy_id=HID, status='cancellation_filed') if (DAYS(CFIELD('fr','filed_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31', rw_exp) >= rw_type_on) else '') or ''
  - rw_fee_type: K('fee_type_owner_operator') if rw_ctype == 'owner_operator' else (K('fee_type_owner') if rw_ctype == 'owner' else 0.0)
  - rw_state_on: DAYS(MX(rw_pay_date, rw_snl_date), rw_exp) - P('reinstatement_effective_offset_days')
  - rw_fstate: (CFIELD('fr','filing_state', auto_policy_id=HID, status='filed') if (DAYS(CFIELD('fr','filed_date', auto_policy_id=HID, status='filed') or '9999-12-31', rw_exp) >= rw_state_on) else '') or (CFIELD('fr','filing_state', auto_policy_id=HID, status='cancellation_filed') if (DAYS(CFIELD('fr','filed_date', auto_policy_id=HID, status='cancellation_filed') or '9999-12-31', rw_exp) >= rw_state_on) else '') or ''
  - rw_fee_out: 0.0 if (rw_fstate == '' or rw_fstate == F('garaging_state')) else (K('fee_out_high') if (rw_fstate == 'FL' or rw_fstate == 'VA') else K('fee_out'))
  - result: RND(rw_fee_basis + rw_fee_lapse + rw_fee_cert + rw_fee_form + rw_fee_type + rw_fee_out, 2)
  compute_basis:
    rw_ced: the entry whose effective date is the term's cancellation effective date
    rw_pay_date: the posting date of the latest payment posted to the term's billing plan
    rw_snl_date: the signing date of the latest Statement of No Loss on the term attesting no loss
    rw_reinst_days: plus reinstatement_effective_offset_days
    rw_ret_pd: the entry whose effective date is the term's cancellation effective date
    rw_ret_n: when the term carries the return premium entry booked for its cancellation for nonpayment
    rw_cancelled: the term is recorded cancelled for nonpayment, closed on its cancellation effective date
    rw_days: 'Re-written days of a reinstatement with lapse: when the term carries the return premium entry booked for its cancellation for nonpayment, the entry whose effective date is the term''s cancellation effective date (the one entered first when two share the latest transaction date), the re-written days are the fewer of the calendar days from the reinstatement effective date to the expiration date and that entry''s premium_days, because days the return kept, such as certificate run-off days, were never given back and are not charged again; when the term is recorded cancelled for nonpayment, closed on its cancellation effective date, but no such entry was booked, a return of 0.00 not being booked, nothing was given back and the re-written days are zero; otherwise they are the days from the reinstatement effective date to the expiration date.'
    rw_plan_id: the latest payment posted to the term's billing plan (the plan entered first when the term has more than one; every payment posted on that latest date counts as posted that day)
    rw_hist_rel: 'Nonpayment-history relativity of the re-written premium, under the company''s filed term rating, by the notices of cancellation for nonpayment issued on the term, the notice that led to the cancellation included: at least hist_notices_high notices take hist_rel_high; hist_notices_mid notices take hist_rel_mid; a single notice takes relativity 1.'
    rw_notices: 'Nonpayment-history relativity of the re-written premium, under the company''s filed term rating, by the notices of cancellation for nonpayment issued on the term, the notice that led to the cancellation included: at least hist_notices_high notices take hist_rel_high; hist_notices_mid notices take hist_rel_mid; a single notice takes relativity 1.'
    rw_rate: For a re-written premium, the term's current full-term rate is its recorded full_term_premium, the rating of the named insured and the scheduled vehicles, plus the driver_term_premium of every driver-added change and the vehicle_term_premium of every vehicle-added change recorded on the term, minus the driver_term_premium of every driver-excluded or driver-removed change and the vehicle_term_premium of every vehicle-removed change recorded on the term; every rated driver other than the named insured, a driver rated when the term was bound included, is carried by a driver-added change recording the share it adds, and a driver-removed or driver-excluded change records the share it takes off.
    rw_rewritten: The re-written premium is the current full-term rate multiplied by the nonpayment-history relativity below, divided by term_days and multiplied by the re-written days, the calendar days from the reinstatement effective date to the expiration date (the reinstatement effective date counted, the expiration date not counted) as limited below, rounded once, at the end, to the nearest cent, half up; no premium is charged for the days of the lapse, and a re-written premium of 0.00 is not booked.
    rw_fee_state: 'Fee basis under the company''s state schedule, by the term''s garaging_state: Florida or Georgia set the fee at fee_pct percent of the re-written premium; Arizona, Texas or Virginia set it at the greater of the package''s reinstatement_fee and fee_floor; any other state keeps the package''s reinstatement_fee.'
    rw_fee_rw: 'Fee basis under the company''s state schedule, by the term''s garaging_state: Florida or Georgia set the fee at fee_pct percent of the re-written premium; Arizona, Texas or Virginia set it at the greater of the package''s reinstatement_fee and fee_floor; any other state keeps the package''s reinstatement_fee.'
    rw_fee_basis: 'Fee basis under the company''s state schedule, by the term''s garaging_state: Florida or Georgia set the fee at fee_pct percent of the re-written premium; Arizona, Texas or Virginia set it at the greater of the package''s reinstatement_fee and fee_floor; any other state keeps the package''s reinstatement_fee.'
    rw_lapse_days: 'Lapse charge, by how long coverage lapsed before it was restored, the calendar days from the cancellation effective date to the reinstatement effective date (the first counted, the second not): at least fee_lapse_days_long days add fee_lapse_long; at least fee_lapse_days_mid and fewer than fee_lapse_days_long days add fee_lapse_mid; fewer than fee_lapse_days_mid days add nothing.'
    rw_fee_lapse: 'Lapse charge, by how long coverage lapsed before it was restored, the calendar days from the cancellation effective date to the reinstatement effective date (the first counted, the second not): at least fee_lapse_days_long days add fee_lapse_long; at least fee_lapse_days_mid and fewer than fee_lapse_days_long days add fee_lapse_mid; fewer than fee_lapse_days_mid days add nothing.'
    rw_cert_filed: 'Every certificate backed by the term is read in this rule as it stood on the reinstatement effective date, so a certificate filed or an SR-26 transmitted after that date does not change the reading: a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it, and an SR-26 counts only when it was transmitted, its sr26_date, on or before that date. Certificate exposure charge, by how the certificate backed by the term stood with the state while coverage lapsed, a liability the lapse days carried no premium for and the certificate''s filing fee does not price: a certificate kept in force through the lapse, standing filed on the reinstatement effective date with no SR-26 transmitted on or before it, the company staying bound to the state for every lapse day, adds fee_continue; a certificate whose SR-26 was transmitted on or before the reinstatement effective date and whose certificate_end_date is on or after that date, the company staying bound for part of the lapse, adds fee_continue_part; a certificate that ended before coverage was restored, which a new filing charged under its own fee must replace, or no certificate, adds nothing.'
    rw_cert_sent: 'Every certificate backed by the term is read in this rule as it stood on the reinstatement effective date, so a certificate filed or an SR-26 transmitted after that date does not change the reading: a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it, and an SR-26 counts only when it was transmitted, its sr26_date, on or before that date. Certificate exposure charge, by how the certificate backed by the term stood with the state while coverage lapsed, a liability the lapse days carried no premium for and the certificate''s filing fee does not price: a certificate kept in force through the lapse, standing filed on the reinstatement effective date with no SR-26 transmitted on or before it, the company staying bound to the state for every lapse day, adds fee_continue; a certificate whose SR-26 was transmitted on or before the reinstatement effective date and whose certificate_end_date is on or after that date, the company staying bound for part of the lapse, adds fee_continue_part; a certificate that ended before coverage was restored, which a new filing charged under its own fee must replace, or no certificate, adds nothing.'
    rw_fee_cert: 'Every certificate backed by the term is read in this rule as it stood on the reinstatement effective date, so a certificate filed or an SR-26 transmitted after that date does not change the reading: a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it, and an SR-26 counts only when it was transmitted, its sr26_date, on or before that date. Certificate exposure charge, by how the certificate backed by the term stood with the state while coverage lapsed, a liability the lapse days carried no premium for and the certificate''s filing fee does not price: a certificate kept in force through the lapse, standing filed on the reinstatement effective date with no SR-26 transmitted on or before it, the company staying bound to the state for every lapse day, adds fee_continue; a certificate whose SR-26 was transmitted on or before the reinstatement effective date and whose certificate_end_date is on or after that date, the company staying bound for part of the lapse, adds fee_continue_part; a certificate that ended before coverage was restored, which a new filing charged under its own fee must replace, or no certificate, adds nothing.'
    rw_form: 'Certificate-form charge, by the form of the certificate backed by the term (the certificate entered first with status filed when its filed_date is on or before the reinstatement effective date, else the certificate entered first with status cancellation_filed when its filed_date is on or before that date): an FR-44 certificate adds fee_form_fr44; an SR-22 certificate adds fee_form_sr22; no such certificate adds nothing.'
    rw_fee_form: 'Certificate-form charge, by the form of the certificate backed by the term (the certificate entered first with status filed when its filed_date is on or before the reinstatement effective date, else the certificate entered first with status cancellation_filed when its filed_date is on or before that date): an FR-44 certificate adds fee_form_fr44; an SR-22 certificate adds fee_form_sr22; no such certificate adds nothing.'
    rw_ctype: 'Certificate-type charge, by the type of that certificate: an owner-operator certificate adds fee_type_owner_operator; an owner certificate adds fee_type_owner; no such certificate adds nothing.'
    rw_fee_type: 'Certificate-type charge, by the type of that certificate: an owner-operator certificate adds fee_type_owner_operator; an owner certificate adds fee_type_owner; no such certificate adds nothing.'
    rw_fstate: 'Out-of-state filing charge, by the filing_state of that certificate against the term''s garaging_state: a filing state that differs from the garaging state and is Florida or Virginia, where FR-44 certificates are also filed, adds fee_out_high; a filing state that differs from the garaging state and is any other state adds fee_out; a filing state equal to the garaging state, or no such certificate, adds nothing.'
    rw_fee_out: 'Out-of-state filing charge, by the filing_state of that certificate against the term''s garaging_state: a filing state that differs from the garaging state and is Florida or Virginia, where FR-44 certificates are also filed, adds fee_out_high; a filing state that differs from the garaging state and is any other state adds fee_out; a filing state equal to the garaging state, or no such certificate, adds nothing.'
    rw_cert_end: 'Every certificate backed by the term is read in this rule as it stood on the reinstatement effective date, so a certificate filed or an SR-26 transmitted after that date does not change the reading: a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it, and an SR-26 counts only when it was transmitted, its sr26_date, on or before that date. Certificate exposure charge, by how the certificate backed by the term stood with the state while coverage lapsed, a liability the lapse days carried no premium for and the certificate''s filing fee does not price: a certificate kept in force through the lapse, standing filed on the reinstatement effective date with no SR-26 transmitted on or before it, the company staying bound to the state for every lapse day, adds fee_continue; a certificate whose SR-26 was transmitted on or before the reinstatement effective date and whose certificate_end_date is on or after that date, the company staying bound for part of the lapse, adds fee_continue_part; a certificate that ended before coverage was restored, which a new filing charged under its own fee must replace, or no certificate, adds nothing.'
    rw_reinst_date_days: 'Every certificate backed by the term is read in this rule as it stood on the reinstatement effective date, so a certificate filed or an SR-26 transmitted after that date does not change the reading: a certificate stood filed on that date when the certificate entered first with status filed has its filed_date on or before that date, or the certificate entered first with status cancellation_filed has its filed_date on or before that date and its sr26_date after it, and an SR-26 counts only when it was transmitted, its sr26_date, on or before that date. Certificate exposure charge, by how the certificate backed by the term stood with the state while coverage lapsed, a liability the lapse days carried no premium for and the certificate''s filing fee does not price: a certificate kept in force through the lapse, standing filed on the reinstatement effective date with no SR-26 transmitted on or before it, the company staying bound to the state for every lapse day, adds fee_continue; a certificate whose SR-26 was transmitted on or before the reinstatement effective date and whose certificate_end_date is on or after that date, the company staying bound for part of the lapse, adds fee_continue_part; a certificate that ended before coverage was restored, which a new filing charged under its own fee must replace, or no certificate, adds nothing.'
    rw_form_on: when its filed_date is on or before the reinstatement effective date
    rw_type_on: when its filed_date is on or before the reinstatement effective date
    rw_state_on: when its filed_date is on or before the reinstatement effective date
  factors:
  - id: rw_fee_basis_rule
    effect: method
    decides: rw_fee_basis
    bindings:
    - rw_fee_state
    - rw_fee_rw
    - rw_fee_basis
    ladder:
    - when: garaged in Florida or Georgia
      method: fee = fee_pct percent of the re-written premium
    - when: garaged in Arizona, Texas or Virginia
      method: fee = the greater of the package's reinstatement_fee and fee_floor
    - when: otherwise
      method: fee = the package's reinstatement_fee
    baseline:
      rw_fee_basis: P('reinstatement_fee')
    evidence:
    - history
    - holding
    cross_difficulty: null
  - id: rw_lapse_charge
    effect: parameter
    decides: rw_fee_lapse
    bindings:
    - rw_lapse_days
    - rw_fee_lapse
    ladder:
    - when: a lapse of at least fee_lapse_days_long days
      value: K('fee_lapse_long')
    - when: at least fee_lapse_days_mid and fewer than fee_lapse_days_long days
      value: K('fee_lapse_mid')
    - when: otherwise (fewer than fee_lapse_days_mid days)
      value: '0.0'
    baseline:
      rw_fee_lapse: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: rw_certificate_exposure_charge
    effect: parameter
    decides: rw_fee_cert
    bindings:
    - rw_cert_filed
    - rw_cert_sent
    - rw_cert_end
    - rw_reinst_date_days
    - rw_fee_cert
    ladder:
    - when: a certificate kept in force through the lapse (standing filed on the reinstatement effective date, no SR-26 transmitted on or before it)
      value: K('fee_continue')
    - when: an SR-26 transmitted on or before the reinstatement effective date with the certificate end date on or after it
      value: K('fee_continue_part')
    - when: otherwise (the certificate ended before coverage was restored, or no certificate)
      value: '0.0'
    baseline:
      rw_fee_cert: '0.0'
    evidence:
    - cross_category
    cross_difficulty: fr
  - id: rw_certificate_form_charge
    effect: parameter
    decides: rw_fee_form
    bindings:
    - rw_form_on
    - rw_form
    - rw_fee_form
    ladder:
    - when: an FR-44 certificate
      value: K('fee_form_fr44')
    - when: an SR-22 certificate
      value: K('fee_form_sr22')
    - when: otherwise
      value: '0.0'
    baseline:
      rw_fee_form: '0.0'
    evidence:
    - cross_category
    cross_difficulty: fr
  - id: rw_certificate_type_charge
    effect: parameter
    decides: rw_fee_type
    bindings:
    - rw_type_on
    - rw_ctype
    - rw_fee_type
    ladder:
    - when: an owner-operator certificate
      value: K('fee_type_owner_operator')
    - when: an owner certificate
      value: K('fee_type_owner')
    - when: otherwise
      value: '0.0'
    baseline:
      rw_fee_type: '0.0'
    evidence:
    - cross_category
    cross_difficulty: fr
  - id: rw_out_of_state_charge
    effect: parameter
    decides: rw_fee_out
    bindings:
    - rw_state_on
    - rw_fstate
    - rw_fee_out
    ladder:
    - when: the filing state differs from the garaging state and is Florida or Virginia
      value: K('fee_out_high')
    - when: the filing state differs from the garaging state and is any other state
      value: K('fee_out')
    - when: otherwise
      value: '0.0'
    baseline:
      rw_fee_out: '0.0'
    evidence:
    - cross_category
    - holding
    cross_difficulty: fr
  baseline:
