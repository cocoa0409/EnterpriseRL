    ab_rel_then: 'Share basis of a lift: when the driver''s exclusion entry records prior_driver_status unlisted, the driver never having been rated on the term, the basis is drv_base_rate multiplied by the package relativity of the company''s filed driver rating, pkg_rel_high for a Cardinal Point 100/200/50, 100/300/50, 100/300/100 or 250/500/100 Liability package, pkg_rel_mid for the Cardinal Point 50/100/50 Liability package and 1 for any other; when the exclusion entry records prior_driver_status rated and a driver_term_premium above zero, the basis is that recorded driver_term_premium divided by the state, relationship, age-class and violation-points relativities as of the exclusion entry''s own change effective date, date of birth, relationship and points, so that the recorded rating is carried forward and only what changed since is re-rated; otherwise the basis is full_term_premium multiplied by lift_share_pct percent.'
    ab_age_then: 'Share basis of a lift: when the driver''s exclusion entry records prior_driver_status unlisted, the driver never having been rated on the term, the basis is drv_base_rate multiplied by the package relativity of the company''s filed driver rating, pkg_rel_high for a Cardinal Point 100/200/50, 100/300/50, 100/300/100 or 250/500/100 Liability package, pkg_rel_mid for the Cardinal Point 50/100/50 Liability package and 1 for any other; when the exclusion entry records prior_driver_status rated and a driver_term_premium above zero, the basis is that recorded driver_term_premium divided by the state, relationship, age-class and violation-points relativities as of the exclusion entry''s own change effective date, date of birth, relationship and points, so that the recorded rating is carried forward and only what changed since is re-rated; otherwise the basis is full_term_premium multiplied by lift_share_pct percent.'
    ab_age_rel_then: 'Share basis of a lift: when the driver''s exclusion entry records prior_driver_status unlisted, the driver never having been rated on the term, the basis is drv_base_rate multiplied by the package relativity of the company''s filed driver rating, pkg_rel_high for a Cardinal Point 100/200/50, 100/300/50, 100/300/100 or 250/500/100 Liability package, pkg_rel_mid for the Cardinal Point 50/100/50 Liability package and 1 for any other; when the exclusion entry records prior_driver_status rated and a driver_term_premium above zero, the basis is that recorded driver_term_premium divided by the state, relationship, age-class and violation-points relativities as of the exclusion entry''s own change effective date, date of birth, relationship and points, so that the recorded rating is carried forward and only what changed since is re-rated; otherwise the basis is full_term_premium multiplied by lift_share_pct percent.'
    ab_pts_then: 'Share basis of a lift: when the driver''s exclusion entry records prior_driver_status unlisted, the driver never having been rated on the term, the basis is drv_base_rate multiplied by the package relativity of the company''s filed driver rating, pkg_rel_high for a Cardinal Point 100/200/50, 100/300/50, 100/300/100 or 250/500/100 Liability package, pkg_rel_mid for the Cardinal Point 50/100/50 Liability package and 1 for any other; when the exclusion entry records prior_driver_status rated and a driver_term_premium above zero, the basis is that recorded driver_term_premium divided by the state, relationship, age-class and violation-points relativities as of the exclusion entry''s own change effective date, date of birth, relationship and points, so that the recorded rating is carried forward and only what changed since is re-rated; otherwise the basis is full_term_premium multiplied by lift_share_pct percent.'
    ab_share: 'The lift share is the company''s filed driver rating of the driver as the driver now stands: the share basis below multiplied by the state relativity (state_rel_high for a term garaged in Florida or Georgia, state_rel_mid in Arizona, Texas or Virginia and 1 elsewhere), by the platform-use relativity of the company''s filed driver rating (drv_platform_rel_two for at least two claim reports of the term naming the driver as operator with the vehicle in use on a ride-hailing or delivery platform, drv_platform_rel_one for one and 1 for none) and by the age-class, relationship, violation-points, accident and occasional-operator relativities below, rounded to the cent; the entry named is the driver''s exclusion entry.'
    ab_state: 'The lift share is the company''s filed driver rating of the driver as the driver now stands: the share basis below multiplied by the state relativity (state_rel_high for a term garaged in Florida or Georgia, state_rel_mid in Arizona, Texas or Virginia and 1 elsewhere), by the platform-use relativity of the company''s filed driver rating (drv_platform_rel_two for at least two claim reports of the term naming the driver as operator with the vehicle in use on a ride-hailing or delivery platform, drv_platform_rel_one for one and 1 for none) and by the age-class, relationship, violation-points, accident and occasional-operator relativities below, rounded to the cent; the entry named is the driver''s exclusion entry.'
    ab_state_rel: 'The lift share is the company''s filed driver rating of the driver as the driver now stands: the share basis below multiplied by the state relativity (state_rel_high for a term garaged in Florida or Georgia, state_rel_mid in Arizona, Texas or Virginia and 1 elsewhere), by the platform-use relativity of the company''s filed driver rating (drv_platform_rel_two for at least two claim reports of the term naming the driver as operator with the vehicle in use on a ride-hailing or delivery platform, drv_platform_rel_one for one and 1 for none) and by the age-class, relationship, violation-points, accident and occasional-operator relativities below, rounded to the cent; the entry named is the driver''s exclusion entry.'
    ab_relship: 'Relationship relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the relationship on the entry named above: a child, sibling, parent or other_relative takes drv_rel_relative; an unrelated_household_member takes drv_rel_unrelated; a spouse or any other relationship, or no such entry on the term, takes relativity 1.'
    ab_rel_rel: 'Relationship relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the relationship on the entry named above: a child, sibling, parent or other_relative takes drv_rel_relative; an unrelated_household_member takes drv_rel_unrelated; a spouse or any other relationship, or no such entry on the term, takes relativity 1.'
    ab_age: 'Age-class relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the driver''s age in whole years on the processing date (a year is complete on the birthday, a 29 February birthday completing on 1 March), from the date of birth on the entry named above: under drv_youth_age takes drv_age_rel_youth; at least drv_youth_age and under drv_young_age takes drv_age_rel_young; any other age, or no such entry on the term, takes relativity 1.'
    ab_age_rel: 'Age-class relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the driver''s age in whole years on the processing date (a year is complete on the birthday, a 29 February birthday completing on 1 March), from the date of birth on the entry named above: under drv_youth_age takes drv_age_rel_youth; at least drv_youth_age and under drv_young_age takes drv_age_rel_young; any other age, or no such entry on the term, takes relativity 1.'
    ab_vpts: 'Violation-points relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the driver_violation_points on the entry named above: at least drv_pts_high takes drv_pts_rel_high; at least drv_pts_mid and fewer than drv_pts_high takes drv_pts_rel_mid; fewer than drv_pts_mid, or no such entry on the term, takes relativity 1.'
    ab_pts_rel: 'Violation-points relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the driver_violation_points on the entry named above: at least drv_pts_high takes drv_pts_rel_high; at least drv_pts_mid and fewer than drv_pts_high takes drv_pts_rel_mid; fewer than drv_pts_mid, or no such entry on the term, takes relativity 1.'
    ab_coll: 'Accident relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the claim reports of the term naming the driver as operator with a collision_with_vehicle or collision_single_vehicle cause: at least two take drv_acc_rel_two; one takes drv_acc_rel_one; none takes relativity 1.'
    ab_acc_rel: 'Accident relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the claim reports of the term naming the driver as operator with a collision_with_vehicle or collision_single_vehicle cause: at least two take drv_acc_rel_two; one takes drv_acc_rel_one; none takes relativity 1.'
    ab_plat: 'The lift share is the company''s filed driver rating of the driver as the driver now stands: the share basis below multiplied by the state relativity (state_rel_high for a term garaged in Florida or Georgia, state_rel_mid in Arizona, Texas or Virginia and 1 elsewhere), by the platform-use relativity of the company''s filed driver rating (drv_platform_rel_two for at least two claim reports of the term naming the driver as operator with the vehicle in use on a ride-hailing or delivery platform, drv_platform_rel_one for one and 1 for none) and by the age-class, relationship, violation-points, accident and occasional-operator relativities below, rounded to the cent; the entry named is the driver''s exclusion entry.'
    ab_plat_rel: 'The lift share is the company''s filed driver rating of the driver as the driver now stands: the share basis below multiplied by the state relativity (state_rel_high for a term garaged in Florida or Georgia, state_rel_mid in Arizona, Texas or Virginia and 1 elsewhere), by the platform-use relativity of the company''s filed driver rating (drv_platform_rel_two for at least two claim reports of the term naming the driver as operator with the vehicle in use on a ride-hailing or delivery platform, drv_platform_rel_one for one and 1 for none) and by the age-class, relationship, violation-points, accident and occasional-operator relativities below, rounded to the cent; the entry named is the driver''s exclusion entry.'
    ab_rated_n: 'Occasional-operator relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the rated drivers on the term once the lift is made against the term''s vehicle_count, every rated driver other than the named insured, a driver rated when the term was bound included, being carried by a driver-added entry: the rated drivers are counted as the named insured, plus one for each driver-added entry on the term, less one for each driver-removed or driver-excluded entry that records prior status rated, plus the lifted driver; rated drivers exceeding the vehicles by two or more rate the lifted driver, the last added, as an occasional operator at occ_rel_two; exceeding them by one, at occ_rel_one; any other count takes relativity 1.'
    ab_veh: 'Occasional-operator relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the rated drivers on the term once the lift is made against the term''s vehicle_count, every rated driver other than the named insured, a driver rated when the term was bound included, being carried by a driver-added entry: the rated drivers are counted as the named insured, plus one for each driver-added entry on the term, less one for each driver-removed or driver-excluded entry that records prior status rated, plus the lifted driver; rated drivers exceeding the vehicles by two or more rate the lifted driver, the last added, as an occasional operator at occ_rel_two; exceeding them by one, at occ_rel_one; any other count takes relativity 1.'
    ab_occ_rel: 'Occasional-operator relativity of the lifted driver''s rating share, under the company''s filed driver rating, by the rated drivers on the term once the lift is made against the term''s vehicle_count, every rated driver other than the named insured, a driver rated when the term was bound included, being carried by a driver-added entry: the rated drivers are counted as the named insured, plus one for each driver-added entry on the term, less one for each driver-removed or driver-excluded entry that records prior status rated, plus the lifted driver; rated drivers exceeding the vehicles by two or more rate the lifted driver, the last added, as an occasional operator at occ_rel_two; exceeding them by one, at occ_rel_one; any other count takes relativity 1.'
  factors:
  - id: ab_lift_share_basis
    effect: method
    decides: ab_basis
    bindings:
    - ab_pkg
    - ab_pkg_rel
    - ab_state_then
    - ab_rel_then
    - ab_age_then
    - ab_age_rel_then
    - ab_pts_then
    - ab_basis
    ladder:
    - when: the exclusion entry records prior status unlisted
      method: basis = drv_base_rate x the package relativity
    - when: the exclusion entry records prior status rated and a share above zero
      method: basis = the recorded share divided by the state, relationship, age-class and violation-points relativities as of the exclusion entry
    - when: otherwise
      method: basis = full_term_premium x lift_share_pct
    baseline:
      ab_basis: ab_full * K('lift_share_pct') / 100.0
    evidence:
    - history
    cross_difficulty: null
  - id: ab_age_class_rel
    effect: parameter
    decides: ab_age_rel
    bindings:
    - ab_age
    - ab_age_rel
    ladder:
    - when: age under drv_youth_age
      value: K('drv_age_rel_youth')
    - when: age at least drv_youth_age and under drv_young_age
      value: K('drv_age_rel_young')
    - when: otherwise
      value: '1.0'
    baseline:
      ab_age_rel: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: ab_relationship_rel
    effect: parameter
    decides: ab_rel_rel
    bindings:
    - ab_relship
    - ab_rel_rel
    ladder:
    - when: a child, sibling, parent or other_relative
      value: K('drv_rel_relative')
    - when: an unrelated household member
      value: K('drv_rel_unrelated')
    - when: otherwise
      value: '1.0'
    baseline:
      ab_rel_rel: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: ab_violation_points_rel
    effect: parameter
    decides: ab_pts_rel
    bindings:
    - ab_vpts
    - ab_pts_rel
    ladder:
    - when: at least drv_pts_high points on the entry
      value: K('drv_pts_rel_high')
    - when: at least drv_pts_mid and fewer than drv_pts_high
      value: K('drv_pts_rel_mid')
    - when: otherwise
      value: '1.0'
    baseline:
      ab_pts_rel: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: ab_accident_rel
    effect: parameter
    decides: ab_acc_rel
    bindings:
    - ab_coll
    - ab_acc_rel
    ladder:
    - when: at least two collision reports naming the driver
      value: K('drv_acc_rel_two')
    - when: exactly one
      value: K('drv_acc_rel_one')
    - when: otherwise
      value: '1.0'
    baseline:
      ab_acc_rel: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: physdam
  - id: ab_occasional_operator_rel
    effect: parameter
    decides: ab_occ_rel
    bindings:
    - ab_rated_n
    - ab_veh
    - ab_occ_rel
    ladder:
    - when: rated drivers once the lift is made exceed the vehicles by two or more
      value: K('occ_rel_two')
    - when: they exceed the vehicles by one
      value: K('occ_rel_one')
    - when: otherwise
      value: '1.0'
    baseline:
      ab_occ_rel: '1.0'
    evidence:
    - history
    - holding
    cross_difficulty: null
  baseline:
    rule: The standard lift share is the term's full_term_premium multiplied by lift_share_pct percent. The standard lift premium is the standard lift share multiplied by the state and platform-use relativities stated above and rounded to the cent, then multiplied by the calendar days from the lift effective date to the expiration date, the effective date counted and the expiration date not counted, and divided by term_days, with no other relativity; it is rounded once, at the end, to the nearest cent, half up.
    params:
    - lift_share_pct
  inputs:
    history:
    - table: auto_policy_changes
      aggregate: latest
      field: change_effective_date
      filters:
        event_type: auto_driver_excluded
    - table: auto_policy_changes
      aggregate: count
      field: auto_change_id
      filters:
        event_type: auto_driver_added
    cross_category:
    - physdam
