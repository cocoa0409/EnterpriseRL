events:
- type: auto_new_business
  target: auto_policies
  mutation: create
  meaning: A new Owner Auto Policy term is bound on an application with its down payment.
  grain: one row per policy term
  fields:
    customer_id: named insured
    variant_name: package bound
    policy_number: new policy number
    garaging_state: garaging state
    term_months: term length
    term_number: always 1
    opened_date: binding date
    effective_date: first day of coverage
    expiration_date: end of term
    violation_points: points at binding
    vehicle_count: vehicles scheduled
    financial_responsibility_filing: certificate the policy backs
    full_term_premium: full-term premium
    term_days: days in the term
  triggers:
  - event: auto:auto_premium_written
    map:
      effective_date: effective_date
      transaction_reason: new_business
  - event: auto:auto_policy_fee
    map:
      effective_date: effective_date
      transaction_reason: new_business
- type: auto_renewal_issued
  target: auto_policies
  mutation: create
  meaning: The renewal term of an expiring term is issued as a renewal offer.
  grain: one row per policy term
  fields:
    customer_id: named insured
    variant_name: package offered after reassignment
    policy_number: same policy number
    garaging_state: garaging state
    term_months: term length
    term_number: prior term number + 1
    prior_term_policy_id: expiring term
    opened_date: date the offer was issued
    effective_date: expiration date of the prior term
    expiration_date: end of the renewal term
    violation_points: points at renewal rating
    vehicle_count: vehicles carried over
    financial_responsibility_filing: certificate carried over
    full_term_premium: renewal premium offered
    term_days: days in the renewal term
  triggers: []
- type: auto_term_effective
  target: auto_policies
  mutation:
    transition:
      from: bound
      to: in_force
  meaning: A bound new-business term goes in force once its down payment has cleared.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
  triggers: []
- type: auto_renewal_accepted
  target: auto_policies
  mutation:
    transition:
      from: renewal_offered
      to: in_force
  meaning: The renewal down payment is received and the renewal term goes in force.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    lapse_start_date: first day without coverage when renewed late (the prior expiration date); empty
      otherwise
    lapse_end_date: last day without coverage when renewed late; empty otherwise
  triggers:
  - event: auto:auto_premium_written
    map:
      transaction_reason: renewal
  - event: auto:auto_policy_fee
    map:
      transaction_reason: renewal
- type: auto_renewal_not_taken
  target: auto_policies
  mutation:
    transition:
      from: renewal_offered
      to: not_taken
  meaning: The renewal offer lapses unpaid after the late-renewal window.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    closed_date: date the offer was closed
  triggers: []
- type: auto_cancellation_pending
  target: auto_policies
  mutation:
    transition:
      from: in_force
      to: pending_cancellation
  meaning: An in-force term enters pending cancellation because a notice of cancellation for nonpayment
    was mailed.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    cancellation_notice_date: mailing date of the notice
    cancellation_effective_date: effective date stated on the notice
    minimum_due_on_notice: minimum due stated on the notice
  triggers: []
- type: auto_cancellation_rescinded
  target: auto_policies
  mutation:
    transition:
      from: pending_cancellation
      to: in_force
  meaning: The minimum due was received in time and the pending cancellation is rescinded with no lapse.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    cancellation_notice_date: cleared
    cancellation_effective_date: cleared
    minimum_due_on_notice: reset to 0.00
  triggers: []
- type: auto_cancelled_nonpayment
  target: auto_policies
  mutation:
    transition:
      from: pending_cancellation
      to: cancelled
  meaning: The term cancels for nonpayment on the cancellation effective date stated on the notice.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    cancellation_reason: nonpayment
    closed_date: the cancellation effective date
  triggers:
  - event: auto:auto_return_premium
    map:
      effective_date: cancellation_effective_date
      transaction_reason: cancellation_nonpayment
- type: auto_cancelled_flat
  target: auto_policies
  mutation:
    transition:
      from: bound
      to: cancelled
  meaning: A bound term is cancelled from inception because its down payment was dishonored.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    cancellation_reason: down_payment_dishonored
    cancellation_effective_date: the term effective date
    closed_date: the term effective date
  triggers:
  - event: auto:auto_return_premium
    map:
      effective_date: cancellation_effective_date
      transaction_reason: cancellation_flat
  - event: auto:auto_fee_waived
    map:
      effective_date: cancellation_effective_date
      transaction_reason: cancellation_flat
- type: auto_cancelled_insured_request
  target: auto_policies
  mutation:
    transition:
    - from: in_force
      to: cancelled
    - from: pending_cancellation
      to: cancelled
  meaning: The term cancels at the named insured's signed request.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    cancellation_reason: insured_request
    cancellation_effective_date: effective date of the cancellation
    closed_date: same date
  triggers:
  - event: auto:auto_return_premium
    map:
      effective_date: cancellation_effective_date
      transaction_reason: cancellation_insured_request
- type: auto_cancelled_underwriting
  target: auto_policies
  mutation:
    transition:
      from: in_force
      to: cancelled
  meaning: The company cancels an in-force term for an underwriting reason after advance notice.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    cancellation_reason: underwriting
    cancellation_effective_date: effective date of the cancellation
    closed_date: same date
  triggers:
  - event: auto:auto_return_premium
    map:
      effective_date: cancellation_effective_date
      transaction_reason: cancellation_underwriting
- type: auto_reinstated
  target: auto_policies
  mutation:
    transition:
      from: cancelled
      to: in_force
  meaning: A term cancelled for nonpayment is reinstated, with or without a lapse in coverage.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    reinstatement_date: reinstatement effective date
    reinstatement_type: with_lapse or without_lapse
    lapse_start_date: first day of the lapse (with_lapse only)
    lapse_end_date: last day of the lapse (with_lapse only)
    closed_date: cleared
  triggers:
  - event: auto:auto_reinstatement_fee
    when:
      reinstatement_type: with_lapse
    map:
      effective_date: reinstatement_date
      transaction_reason: reinstatement
  - event: auto:auto_additional_premium
    map:
      effective_date: reinstatement_date
      transaction_reason: reinstatement
- type: auto_term_expired
  target: auto_policies
  mutation:
    transition:
      from: in_force
      to: expired
  meaning: An in-force term reaches its expiration date.
  grain: one row per policy term
  fields:
    status: new lifecycle state of the term
    closed_date: the expiration date
  triggers: []
- type: auto_limits_changed
  target: auto_policies
  mutation: update
  meaning: The liability package of an in-force term is changed mid-term by endorsement.
  grain: one row per policy term
  fields:
    variant_name: new package
    violation_points: points at the re-rating
    full_term_premium: full-term premium of the new package as re-rated
  triggers: []
- type: auto_premium_written
  target: auto_premium_transactions
  meaning: Full-term premium is written for a new-business term or an accepted renewal term.
  grain: one row per term per writing (new business or renewal)
  distinguish_by:
  - transaction_reason
  - effective_date
  fields:
    transaction_date: processing date
    effective_date: coverage date the amount applies from
    amount: positive amount
    transaction_reason: reason code
    premium_days: days charged or returned
  account: written_premium
  direction: in
  triggers: []
- type: auto_additional_premium
  target: auto_premium_transactions
  meaning: Additional premium is charged for a mid-term change or a reinstatement.
  grain: one row per change or reinstatement producing additional premium
  distinguish_by:
  - transaction_reason
  - effective_date
  - source_change_id
  fields:
    transaction_date: processing date
    effective_date: coverage date the amount applies from
    amount: positive amount
    transaction_reason: reason code
    premium_days: days charged or returned
    source_change_id: driver/vehicle change it arises from
  account: written_premium
  direction: in
  triggers: []
- type: auto_return_premium
  target: auto_premium_transactions
  meaning: Unearned premium is returned for a cancellation or a mid-term reduction.
  grain: one row per cancellation or reduction producing return premium
  distinguish_by:
  - transaction_reason
  - effective_date
  - source_change_id
  fields:
    transaction_date: processing date
    effective_date: coverage date the amount applies from
    amount: positive amount
    transaction_reason: reason code
    premium_days: days charged or returned
    source_change_id: driver/vehicle change it arises from
  account: written_premium
  direction: out
  triggers: []
- type: auto_policy_fee
  target: auto_premium_transactions
  meaning: The fully earned policy fee is charged on a new-business or renewal term.
  grain: one row per term
  distinguish_by:
  - transaction_reason
  fields:
    transaction_date: processing date
    effective_date: coverage date the amount applies from
    amount: positive amount
    transaction_reason: reason code
    premium_days: days charged or returned
  account: policy_fees
  direction: in
  triggers: []
- type: auto_reinstatement_fee
  target: auto_premium_transactions
  meaning: The fully earned reinstatement fee is charged for a reinstatement with a lapse.
  grain: one row per reinstatement with a lapse
  distinguish_by:
  - effective_date
  fields:
    transaction_date: processing date
    effective_date: coverage date the amount applies from
    amount: positive amount
    transaction_reason: reason code
    premium_days: days charged or returned
  account: policy_fees
  direction: in
  triggers: []
- type: auto_fee_waived
  target: auto_premium_transactions
  meaning: A fee charged on the term is reversed (company error, postmark rule or voided term).
  grain: one row per reversed fee
  distinguish_by:
  - reversed_txn_id
  - transaction_reason
  fields:
    transaction_date: processing date
    effective_date: coverage date the amount applies from
    amount: positive amount
    transaction_reason: reason code
    premium_days: days charged or returned
    reversed_txn_id: fee transaction reversed
  account: policy_fees
  direction: out
  triggers: []
- type: auto_driver_added
  target: auto_policy_changes
  meaning: A household member is added as a rated driver (newly listed or with an exclusion lifted).
  grain: one row per driver per add
  distinguish_by:
  - driver_name
  - change_effective_date
  fields:
    change_effective_date: date the change takes effect
    driver_name: driver concerned
    driver_date_of_birth: driver DOB
    driver_relationship: relationship
    prior_driver_status: status before the change
    driver_violation_points: driver points
    driver_term_premium: driver's full-term premium share
  triggers:
  - event: auto:auto_additional_premium
    map:
      source_change_id: auto_change_id
      effective_date: change_effective_date
      transaction_reason: driver_added
- type: auto_driver_excluded
  target: auto_policy_changes
  meaning: A household member is made a named excluded driver by endorsement on a signed Named Driver
    Exclusion form.
  grain: one row per driver per exclusion
  distinguish_by:
  - driver_name
  - change_effective_date
  fields:
    change_effective_date: date the change takes effect
    driver_name: driver concerned
    driver_date_of_birth: driver DOB
    driver_relationship: relationship
    prior_driver_status: status before the change
    driver_violation_points: driver points
    driver_term_premium: driver's full-term premium share
    signed_form_id: signed exclusion form
  triggers:
  - event: auto:auto_return_premium
    when:
      prior_driver_status: rated
    map:
      source_change_id: auto_change_id
      effective_date: change_effective_date
