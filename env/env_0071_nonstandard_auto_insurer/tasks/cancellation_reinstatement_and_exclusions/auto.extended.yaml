measures:
- id: auto_msr_lapse_reinstatements_in_term
  window: the whole current term of the holding (from its effective_date to its expiration_date)
  measure: count of auto_premium_transactions rows with event_type auto_reinstatement_fee on this auto_policy_id
    (each reinstatement with a lapse books exactly one, waived or not)
- id: auto_msr_current_excluded_drivers
  window: the current term as of today
  measure: count of distinct driver_name values whose most recent auto_policy_changes row on this auto_policy_id
    with change_effective_date on or before today is an auto_driver_excluded row
policies:
- id: auto_agg_multi_holding
  subject:
  - auto_new_business
  - auto_renewal_issued
  rule: A named insured may hold at most max_per_customer Owner Auto Policy terms that are open at the
    same time, where open means a status of bound, in_force or pending_cancellation. A renewal_offered
    term of a policy number that already has an open term does not count separately, because it replaces
    that term on its effective date; expired, cancelled and not_taken terms never count. A second policy
    is written only for vehicles principally garaged at a different address of the named insured; vehicles
    garaged at the same address are scheduled on the existing policy. The named insured must not already
    hold the maximum number of open Owner Auto Policy terms. An application beyond the maximum is declined,
    and the vehicles are offered as an addition to an open policy instead.
  eligibility:
  - id: open_term_cap
    applies_to:
    - auto_new_business
    kind: authorization
    condition: The named insured must not already hold the maximum number of open Owner Auto Policy terms.
    evidence_fields:
    - auto_policies.customer_id
    - auto_policies.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.customer_id
      action_bindings:
        auto_policies.customer_id: customer_id
  params:
    max_per_customer: 2
- id: auto_agg_household_drivers
  subject:
  - auto_driver_added
  - auto_driver_excluded
  - auto_driver_removed
  rule: When a named insured holds more than one open owner policy, the household driver schedule is evaluated
    across all of them. Every resident of the household at or above household_listing_min_age must appear
    on each open policy either as a rated driver or as a named excluded driver. A person excluded on one
    open policy may not be rated on another open policy of the same named insured. The count of excluded
    drivers is evaluated per policy against that policy's own package maximum and is never summed across
    policies. A driver removed from one policy because they left the household is removed from every open
    policy of the named insured with the same change effective date.
  eligibility:
  - id: cross_policy_exclusion
    applies_to:
    - auto_driver_added
    kind: authorization
    condition: A person excluded on one open policy may not be rated on another open policy of the same
      named insured.
    evidence_fields:
    - auto_policy_changes.driver_name
    - auto_policy_changes.event_type
    - auto_policies.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.driver_name
      action_bindings:
        auto_policy_changes.driver_name: driver_name
  params:
    household_listing_min_age: =household_listing_min_age
- id: auto_underwriting_acceptability
  subject:
  - auto_new_business
  - auto_limits_changed
  rule: A package may be bound, or selected mid-term, only when every rated driver meets that package's
    acceptability limits. The company violation points of the highest-rated driver must not exceed the
    package's max_points. Chargeable at-fault accidents in the 36 months before the transaction, across
    all rated drivers, must not exceed max_accidents; a DUI/DWI conviction within 60 months is acceptable
    only where dui_accepted is true; the named insured must have been licensed at least min_years_licensed
    years; a driver licensed only by a foreign country is acceptable only where foreign_license_accepted
    is true. When an SR-22 certificate is required the package must have sr22_filing_accepted true, and
    when an FR-44 certificate is required the garaging state must appear in the package's fr44_filing_states.
    A mid-term change to a package that is not FR-44-capable in the garaging state is refused while an
    FR-44 certificate backed by the term is filed. When a driver fails a package's limits, the highest
    package below it whose limits are all met is offered instead; when no package is met the application
    is declined. A mid-term limits change takes effect on the date requested (never earlier than the request),
    re-rates full_term_premium, and books the difference between the new and old full-term premiums prorated
    by the days remaining over term_days as additional or return premium.
  eligibility:
  - id: package_points
    applies_to:
    - auto_new_business
    - auto_limits_changed
    kind: authorization
    condition: The company violation points of the highest-rated driver must not exceed the package's
      max_points.
    evidence_fields:
    - auto_policies.violation_points
    - auto_policies.variant_name
    - auto_policies.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.auto_policy_id
      action_bindings:
        auto_policies.auto_policy_id: auto_policy_id
  - id: fr44_capable
    applies_to:
    - auto_limits_changed
    kind: authorization
    condition: A mid-term change to a package that is not FR-44-capable in the garaging state is refused
      while an FR-44 certificate backed by the term is filed.
    evidence_fields:
    - fr_filings.auto_policy_id
    - fr_filings.variant_name
    - fr_filings.status
    - auto_policies.garaging_state
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.auto_policy_id
      action_bindings:
        fr_filings.auto_policy_id: auto_policy_id
  params:
    per_tier:
      Cardinal Point Minimum Limits Liability:
        max_points: =max_violation_points_new_business
        max_accidents: =max_at_fault_accidents_36_months
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        foreign_license_accepted: =foreign_license_accepted
        fr44_filing_states: =fr44_filing_states
      Cardinal Point 50/100/50 Liability:
        max_points: =max_violation_points_new_business
        max_accidents: =max_at_fault_accidents_36_months
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        foreign_license_accepted: =foreign_license_accepted
        fr44_filing_states: =fr44_filing_states
      Cardinal Point 100/200/50 Liability:
        max_points: =max_violation_points_new_business
        max_accidents: =max_at_fault_accidents_36_months
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        foreign_license_accepted: =foreign_license_accepted
        fr44_filing_states: =fr44_filing_states
      Cardinal Point 100/300/50 Liability:
        max_points: =max_violation_points_new_business
        max_accidents: =max_at_fault_accidents_36_months
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        foreign_license_accepted: =foreign_license_accepted
        fr44_filing_states: =fr44_filing_states
      Cardinal Point 100/300/100 Liability:
        max_points: =max_violation_points_new_business
        max_accidents: =max_at_fault_accidents_36_months
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        foreign_license_accepted: =foreign_license_accepted
        fr44_filing_states: =fr44_filing_states
      Cardinal Point 250/500/100 Liability:
        max_points: =max_violation_points_new_business
        max_accidents: =max_at_fault_accidents_36_months
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        foreign_license_accepted: =foreign_license_accepted
        fr44_filing_states: =fr44_filing_states
- id: auto_nonpayment_notice
  subject:
  - auto_cancellation_notice
  - auto_cancellation_pending
  rule: 'A notice of cancellation for nonpayment is mailed only when the billing plan of the term is past_due.
    The notice is mailed no earlier than nonpay_notice_issue_days_after_due calendar days after the due
    date of the unpaid installment. Days are counted as calendar days from the due date, the due date
    itself being day 0, so the earliest mailing date is the due date plus the stated number of days. The
    unpaid past-due amount on the billing plan must be at least nonpay_minimum_unpaid_amount. Only one
    notice of cancellation is issued per unpaid invoice. The cancellation effective date stated on the
    notice is the mailing date plus the garaging state''s days in nonpay_notice_days_by_state, counted
    in calendar days, and coverage ends at 12:01 a.m. on that date. The minimum due stated on the notice
    is every past-due amount on the billing plan as of the mailing date: unpaid installment premium and
    installment fees of invoices whose due date has passed, plus unpaid late and NSF fees; installments
    not yet due are excluded. The notice is sent by mail, and also by email when an email address is on
    the customer profile, and the term moves to pending_cancellation the same day with the notice''s dates
    and minimum due. No notice is issued for a bound term whose down payment has not cleared (a dishonored
    down payment voids the term from inception instead), for an amount below the threshold (it rolls into
    the next bill), or for a plan that is not past_due.'
  eligibility:
  - id: plan_past_due
    applies_to:
    - auto_cancellation_notice
    kind: state
    condition: A notice of cancellation for nonpayment is mailed only when the billing plan of the term
      is past_due.
    evidence_fields:
    - billing_plans.auto_policy_id
    - billing_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
    state_contract:
      field: billing_plans.status
      allowed:
      - past_due
  - id: notice_timing
    applies_to:
    - auto_cancellation_notice
    kind: time
    condition: The notice is mailed no earlier than nonpay_notice_issue_days_after_due calendar days after
      the due date of the unpaid installment.
    evidence_fields:
    - billing_invoices.billing_invoice_id
    - billing_invoices.due_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_invoices.billing_invoice_id
      action_bindings:
        billing_invoices.billing_invoice_id: billing_invoice_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the due date of the unpaid installment
      anchor_source: billing_invoices.due_date
      relation: not_before
      duration_source: variants.nonpay_notice_issue_days_after_due
      unit: calendar_days
      counting_rule: Days are counted as calendar days from the due date, the due date itself being day
        0, so the earliest mailing date is the due date plus the stated number of days.
      boundary: inclusive
  - id: minimum_unpaid
    applies_to:
    - auto_cancellation_notice
    kind: authorization
    condition: The unpaid past-due amount on the billing plan must be at least nonpay_minimum_unpaid_amount.
    evidence_fields:
    - billing_invoices.billing_invoice_id
    - billing_invoices.minimum_due
    - billing_transactions.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_invoices.billing_invoice_id
      action_bindings:
        billing_invoices.billing_invoice_id: billing_invoice_id
  - id: one_notice_per_invoice
    applies_to:
    - auto_cancellation_notice
    kind: dedup
    condition: Only one notice of cancellation is issued per unpaid invoice.
    evidence_fields:
    - auto_policy_documents.unpaid_invoice_id
    - auto_policy_documents.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_documents.unpaid_invoice_id
      action_bindings:
        auto_policy_documents.unpaid_invoice_id: unpaid_invoice_id
    dedup_contract:
      table: auto_policy_documents
      mode: separate_record
      object_bindings:
        unpaid_invoice_id: unpaid_invoice_id
      duplicate_filters:
        event_type:
        - auto_cancellation_notice
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Minimum Limits Liability:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point 50/100/50 Liability:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point 100/200/50 Liability:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point 100/300/50 Liability:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point 100/300/100 Liability:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point 250/500/100 Liability:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
    notice_days_by_state: =nonpay_notice_days_by_state
- id: auto_notice_rescission
  subject:
  - auto_cancellation_rescinded
  rule: 'A pending cancellation is rescinded only when payments posted to the term''s billing plan on
    or before the cancellation effective date total at least the minimum due stated on the notice. Payments
    are counted by their posting date on the billing plan; a mailed payment counts by its posting date
    here, and the postmark rule applies only after cancellation, as a reinstatement without lapse. A partial
    payment below the minimum due does not rescind the notice: the cancellation proceeds on its date and
    the payment stays on the billing plan. On rescission the term returns to in_force with no lapse, the
    notice dates are cleared and minimum_due_on_notice is reset to 0.00; no fee is charged for a rescission.'
  eligibility:
  - id: minimum_paid_in_time
    applies_to:
    - auto_cancellation_rescinded
    kind: authorization
    condition: A pending cancellation is rescinded only when payments posted to the term's billing plan
      on or before the cancellation effective date total at least the minimum due stated on the notice.
    evidence_fields:
    - billing_transactions.posted_date
    - billing_transactions.amount
    - billing_plans.auto_policy_id
    - auto_policies.cancellation_effective_date
    - auto_policies.minimum_due_on_notice
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
  params:
    rescission_payment_basis: =rescission_payment_basis
- id: auto_cancellation_nonpayment
  subject:
  - auto_cancelled_nonpayment
  rule: 'The cancellation is processed no earlier than the cancellation effective date stated on the notice.
    The comparison is made on calendar dates: the processing date must be on or after the cancellation
    effective date itself, with processing_lag_days added. The cancellation proceeds only when payments
    posted on or before the cancellation effective date total less than the minimum due stated on the
    notice. Coverage ends at 12:01 a.m. on the cancellation effective date, which is also the closed_date;
    cancellation_reason is nonpayment. Unearned premium is returned pro rata from the cancellation effective
    date (auto_return_premium), and fully earned fees are not returned. The billing plan''s earned-premium
    balance and any SR-22/FR-44 certificate backed by the term are handled under their own rules.'
  eligibility:
  - id: on_or_after_effective_date
    applies_to:
    - auto_cancelled_nonpayment
    kind: time
    condition: The cancellation is processed no earlier than the cancellation effective date stated on
      the notice.
    evidence_fields:
    - auto_policies.auto_policy_id
    - auto_policies.cancellation_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.auto_policy_id
      action_bindings:
        auto_policies.auto_policy_id: auto_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the cancellation effective date stated on the notice
      anchor_source: auto_policies.cancellation_effective_date
      relation: not_before
      duration_source: params.processing_lag_days
      unit: calendar_days
      counting_rule: 'The comparison is made on calendar dates: the processing date must be on or after
        the cancellation effective date itself, with processing_lag_days added.'
      boundary: inclusive
  - id: minimum_unpaid
    applies_to:
    - auto_cancelled_nonpayment
    kind: authorization
    condition: The cancellation proceeds only when payments posted on or before the cancellation effective
      date total less than the minimum due stated on the notice.
    evidence_fields:
    - billing_transactions.posted_date
    - billing_transactions.amount
    - billing_plans.auto_policy_id
    - auto_policies.minimum_due_on_notice
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
  params:
    processing_lag_days: 0
- id: auto_reinstatement
  subject:
  - auto_reinstated
  rule: 'Only a term whose cancellation_reason is nonpayment can be reinstated. A term cancelled at the
    insured''s request, for an underwriting reason or from inception for a dishonored down payment is
    never reinstated; coverage then requires a new application. A reinstatement without lapse requires
    a mailed payment of at least the minimum due postmarked on or before the cancellation effective date
    and posted no later than postmark_receipt_days calendar days after it, or a cancellation caused by
    a company posting error. A reinstatement without lapse restores the term from the cancellation effective
    date: no Statement of No Loss is needed, no reinstatement fee is charged, no lapse dates are recorded,
    and the premium returned at cancellation is re-written in full. Every other reinstatement is a reinstatement
    with lapse and requires all of the following. A reinstatement with lapse is processed no later than
    reinstatement_window_days calendar days after the cancellation effective date. Calendar days are counted
    from the cancellation effective date as day 0, so the last day of the window is the cancellation effective
    date plus the window days. Payments posted to the term''s billing plan after the cancellation effective
    date must cover every past-due amount on the plan, including installment, late and NSF fees. A Statement
    of No Loss with no_loss_attested true must be on file, and the reinstatement is processed no later
    than no_loss_statement_max_age_days calendar days after the Statement of No Loss was signed. Calendar
    days are counted from the signing date as day 0, and the reinstatement must be processed on or before
    the signing date plus the allowed days. The term must have fewer than max_lapse_reinstatements reinstatements
    with a lapse already, counted by auto_msr_lapse_reinstatements_in_term. The reinstatement effective
    date is the later of the posting date of the payment that completed the past-due amount and the Statement
    of No Loss signing date, plus reinstatement_effective_offset_days; the lapse runs from the cancellation
    effective date through the day before the reinstatement effective date, and no loss occurring in the
    lapse is covered. A reinstatement with lapse books the reinstatement fee and re-writes premium for
    the days from the reinstatement effective date to the expiration date, computed as the cancellation
    return premium multiplied by those days and divided by the premium_days of the cancellation return
    premium, rounded to the cent. When the named insured cannot attest no loss, when the window has closed
    or when the maximum is reached, the term is not reinstated and the insured may apply for a new-business
    policy. Reinstatement does not by itself restore an SR-22 or FR-44 certificate for which an SR-26
    cancellation notice has already been sent to the state; that certificate is re-established only by
    a new filing.'
  eligibility:
  - id: nonpayment_only
    applies_to:
    - auto_reinstated
    kind: authorization
    condition: Only a term whose cancellation_reason is nonpayment can be reinstated.
    evidence_fields:
    - auto_policies.cancellation_reason
    - auto_policies.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.auto_policy_id
      action_bindings:
        auto_policies.auto_policy_id: auto_policy_id
  - id: reinstatement_window
    applies_to:
    - auto_reinstated
    kind: time
    condition: A reinstatement with lapse is processed no later than reinstatement_window_days calendar
      days after the cancellation effective date.
    evidence_fields:
    - auto_policies.auto_policy_id
    - auto_policies.cancellation_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.auto_policy_id
      action_bindings:
        auto_policies.auto_policy_id: auto_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the cancellation effective date
      anchor_source: auto_policies.cancellation_effective_date
      relation: not_after
      duration_source: variants.reinstatement_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the cancellation effective date as day 0, so the last
        day of the window is the cancellation effective date plus the window days.
      boundary: inclusive
  - id: past_due_paid
    applies_to:
    - auto_reinstated
    kind: authorization
    condition: Payments posted to the term's billing plan after the cancellation effective date must cover
      every past-due amount on the plan, including installment, late and NSF fees.
    evidence_fields:
    - billing_transactions.posted_date
    - billing_transactions.amount
    - billing_invoices.minimum_due
    - billing_plans.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
  - id: no_loss_statement
    applies_to:
    - auto_reinstated
    kind: time
    condition: A Statement of No Loss with no_loss_attested true must be on file, and the reinstatement
      is processed no later than no_loss_statement_max_age_days calendar days after the Statement of No
      Loss was signed.
    evidence_fields:
    - auto_policy_documents.auto_document_id
    - auto_policy_documents.no_loss_attested
    - auto_policy_documents.event_type
    - auto_policy_documents.document_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_documents.auto_document_id
      action_bindings:
        auto_policy_documents.auto_document_id: auto_document_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the Statement of No Loss was signed
      anchor_source: auto_policy_documents.document_date
      relation: not_after
      duration_source: variants.no_loss_statement_max_age_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the signing date as day 0, and the reinstatement must
        be processed on or before the signing date plus the allowed days.
      boundary: inclusive
  - id: reinstatement_count
    applies_to:
    - auto_reinstated
    kind: authorization
    condition: The term must have fewer than max_lapse_reinstatements reinstatements with a lapse already,
      counted by auto_msr_lapse_reinstatements_in_term.
    evidence_fields:
    - auto_premium_transactions.event_type
    - auto_premium_transactions.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_premium_transactions.auto_policy_id
      action_bindings:
        auto_premium_transactions.auto_policy_id: auto_policy_id
  - id: postmark_rule
    applies_to:
    - auto_reinstated
    kind: authorization
    condition: A reinstatement without lapse requires a mailed payment of at least the minimum due postmarked
      on or before the cancellation effective date and posted no later than postmark_receipt_days calendar
      days after it, or a cancellation caused by a company posting error.
    evidence_fields:
    - billing_transactions.postmark_date
    - billing_transactions.posted_date
    - billing_transactions.amount
    - billing_plans.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
  params:
    per_tier:
      Cardinal Point Minimum Limits Liability:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point 50/100/50 Liability:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point 100/200/50 Liability:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point 100/300/50 Liability:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point 100/300/100 Liability:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point 250/500/100 Liability:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
    effective_offset_days: =reinstatement_effective_offset_days
    postmark_receipt_days: =postmark_receipt_days
  measures:
  - auto_msr_lapse_reinstatements_in_term
- id: auto_insured_cancellation
  subject:
  - auto_cancelled_insured_request
  rule: A cancellation request confirmed by the named insured's signature must be on file for the term.
    The cancellation never takes effect earlier than the date the request was received. The cancellation
    takes effect at 12:01 a.m. on the requested effective date when that date is on or after the date
    the request was received, and otherwise on the date the request was received; cancellations are never
    backdated, including when replacement insurance started earlier. A term in pending_cancellation may
    also be cancelled at the insured's request when that date is earlier than the cancellation effective
    date on the notice; the earlier date governs and cancellation_reason is insured_request. The return
    premium is the pro rata unearned premium from the cancellation effective date reduced by the package's
    retention_pct of that unearned amount (short rate); fully earned fees are not returned. A request
    with request_status received or withdrawn does not cancel the term; only confirmed_by_insured does.
  eligibility:
  - id: signed_request
    applies_to:
    - auto_cancelled_insured_request
    kind: authorization
    condition: A cancellation request confirmed by the named insured's signature must be on file for the
      term.
    evidence_fields:
    - auto_cancellation_requests.auto_cancel_request_id
    - auto_cancellation_requests.request_status
    - auto_cancellation_requests.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_cancellation_requests.auto_cancel_request_id
      action_bindings:
        auto_cancellation_requests.auto_cancel_request_id: auto_cancel_request_id
  - id: no_backdating
    applies_to:
    - auto_cancelled_insured_request
    kind: authorization
    condition: The cancellation never takes effect earlier than the date the request was received.
    evidence_fields:
    - auto_cancellation_requests.request_received_date
    - auto_cancellation_requests.requested_effective_date
    - auto_cancellation_requests.auto_cancel_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_cancellation_requests.auto_cancel_request_id
      action_bindings:
        auto_cancellation_requests.auto_cancel_request_id: auto_cancel_request_id
  params:
    per_tier:
      Cardinal Point Minimum Limits Liability:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point 50/100/50 Liability:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point 100/200/50 Liability:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point 100/300/50 Liability:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point 100/300/100 Liability:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point 250/500/100 Liability:
        retention_pct: =insured_cancel_short_rate_retention_pct
- id: auto_unearned_premium_return
  subject:
  - auto_return_premium
  rule: 'Return premium is booked only while the term is in_force, pending_cancellation or cancelled.
    For a cancellation (nonpayment, underwriting or insured request) the unearned premium is computed
    transaction by transaction: for every premium written and additional premium row of the term, amount
    multiplied by the days from the cancellation effective date to the expiration date and divided by
    that row''s premium_days (term_days for premium written), minus the same proportion of every earlier
    return premium row, rounded to the cent; premium_days of the return row is the days from the cancellation
    effective date to the expiration date. For an insured-request cancellation the result is then reduced
    by the package''s insured_cancel_short_rate_retention_pct of itself; nonpayment and underwriting cancellations
    are returned in full pro rata. For a term cancelled from inception every premium written on it is
    returned and premium_days is term_days. For an excluded or removed rated driver the return is driver_term_premium
    multiplied by the days from the change effective date to the expiration date and divided by term_days;
    for a removed vehicle the same with vehicle_term_premium. For a limits decrease the return is the
    full-term premium difference prorated the same way. Every amount is rounded to the nearest cent, half
    up; a computed return of 0.00 is not booked. Return premium is credited to the term''s billing plan
    within refund_issue_days calendar days.'
  eligibility:
  - id: term_status
    applies_to:
    - auto_return_premium
    kind: state
    condition: Return premium is booked only while the term is in_force, pending_cancellation or cancelled.
    evidence_fields:
    - auto_policies.auto_policy_id
    - auto_policies.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.auto_policy_id
      action_bindings:
        auto_policies.auto_policy_id: auto_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - in_force
      - pending_cancellation
      - cancelled
  params:
    refund_issue_days: =refund_issue_days
    premium_rounding: =premium_rounding
  formula:
    when: transaction_reason in ["driver_excluded", "driver_removed", "vehicle_removed"]
    driver_return: round(driver_term_premium * premium_days / term_days, 2)
    vehicle_return: round(vehicle_term_premium * premium_days / term_days, 2)
- id: auto_premium_charging
  subject:
  - auto_premium_written
  - auto_additional_premium
  rule: Premium is written only on a term whose status is bound, renewal_offered or in_force. Premium
    written equals the term's full_term_premium, booked once when a new-business term is bound and once
    when a renewal term is accepted, with premium_days 0. Additional premium for a rated driver added
    is driver_term_premium multiplied by the days from the change effective date to the expiration date
    and divided by term_days; for an added vehicle the same with vehicle_term_premium; for a limits increase
    the full-term premium difference prorated the same way. Additional premium for a reinstatement is
    computed under auto_reinstatement (re-written in full without lapse, prorated with lapse). Every amount
    is rounded to the nearest cent, half up, and is charged to the term's billing plan.
  eligibility:
  - id: term_status
    applies_to:
    - auto_premium_written
    - auto_additional_premium
    kind: state
    condition: Premium is written only on a term whose status is bound, renewal_offered or in_force.
    evidence_fields:
    - auto_policies.auto_policy_id
    - auto_policies.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.auto_policy_id
      action_bindings:
        auto_policies.auto_policy_id: auto_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - bound
      - renewal_offered
      - in_force
  params:
    midterm_change_premium_basis: =midterm_change_premium_basis
  formula:
    when: transaction_reason in ["driver_added", "vehicle_added"]
    driver_add: round(driver_term_premium * premium_days / term_days, 2)
    vehicle_add: round(vehicle_term_premium * premium_days / term_days, 2)
- id: auto_fees
  subject:
  - auto_policy_fee
  - auto_reinstatement_fee
  - auto_fee_waived
  rule: The policy fee is policy_fee_new_business on a new-business term and policy_fee_renewal on an
    accepted renewal term. Only one policy fee is charged per term. The reinstatement fee is charged once
    for each reinstatement with a lapse, and never for a rescission or a reinstatement without lapse.
    Fees are fully earned when charged and are not returned when a term cancels. Each fee transaction
    is reversed at most once. A fee is reversed only when the term is cancelled from inception for a dishonored
    down payment (the policy fee is reversed) or when the company charged it in error (a duplicate fee,
    or a reinstatement fee on a reinstatement that qualifies as without lapse under the postmark rule
    or a company posting error); the reversal carries the reversed fee's own amount and references it.
  eligibility:
  - id: one_policy_fee
    applies_to:
    - auto_policy_fee
    kind: dedup
    condition: Only one policy fee is charged per term.
    evidence_fields:
    - auto_premium_transactions.auto_policy_id
    - auto_premium_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_premium_transactions.auto_policy_id
      action_bindings:
        auto_premium_transactions.auto_policy_id: auto_policy_id
    dedup_contract:
      table: auto_premium_transactions
      mode: separate_record
      object_bindings:
        auto_policy_id: auto_policy_id
      duplicate_filters:
        event_type:
        - auto_policy_fee
      distinct_fields: []
  - id: one_reversal
    applies_to:
    - auto_fee_waived
    kind: dedup
    condition: Each fee transaction is reversed at most once.
    evidence_fields:
    - auto_premium_transactions.reversed_txn_id
    - auto_premium_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_premium_transactions.reversed_txn_id
      action_bindings:
        auto_premium_transactions.reversed_txn_id: reversed_txn_id
    dedup_contract:
      table: auto_premium_transactions
      mode: separate_record
      object_bindings:
        reversed_txn_id: reversed_txn_id
      duplicate_filters:
        event_type:
        - auto_fee_waived
      distinct_fields: []
  params:
    policy_fee_new_business: =policy_fee_new_business
    policy_fee_renewal: =policy_fee_renewal
    reinstatement_fee: =reinstatement_fee
    fees_returned_on_cancellation: =fees_returned_on_cancellation
- id: auto_driver_exclusion
  subject:
  - auto_exclusion_form_signed
  - auto_driver_excluded
  rule: The Named Driver Exclusion form is signed only by the named insured personally. A named driver
    exclusion is endorsed only on a Named Driver Exclusion form signed by the named insured that names
    the driver exactly as the driver is to be excluded. The named insured cannot be excluded, and a driver
    for whom an SR-22 or FR-44 certificate backed by this term is filed cannot be excluded. The number
    of currently excluded drivers on the term, counted by auto_msr_current_excluded_drivers, must be below
    max_excluded before another exclusion is endorsed. The exclusion takes effect on the later of the
    date the form was signed and the requested effective date on the form, never earlier than the signing
    date, and stays in force on the term and on every renewal until the driver is added back as a rated
    driver. When the driver was rated immediately before the exclusion, premium is returned as an auto_return_premium
    transaction; when the driver was unlisted, there is no premium change. While an excluded driver operates
    any vehicle, the policy provides no coverage of any kind for that use, and claims are decided accordingly.
    A household member who must be listed and is neither rated nor excluded must be added as a rated driver
    subject to package acceptability.
  eligibility:
  - id: insured_signs
    applies_to:
    - auto_exclusion_form_signed
    kind: caller_fact
    condition: The Named Driver Exclusion form is signed only by the named insured personally.
    evidence_fields:
    - auto_policy_documents.excluded_driver_name
    - auto_policy_documents.auto_policy_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - auto_policy_documents.auto_policy_id
      action_bindings:
        auto_policy_documents.auto_policy_id: auto_policy_id
  - id: signed_form
    applies_to:
    - auto_driver_excluded
    kind: authorization
    condition: A named driver exclusion is endorsed only on a Named Driver Exclusion form signed by the
      named insured that names the driver exactly as the driver is to be excluded.
    evidence_fields:
    - auto_policy_changes.signed_form_id
    - auto_policy_documents.excluded_driver_name
    - auto_policy_documents.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.signed_form_id
      action_bindings:
        auto_policy_changes.signed_form_id: signed_form_id
  - id: not_insured_or_filer
    applies_to:
    - auto_driver_excluded
    kind: authorization
    condition: The named insured cannot be excluded, and a driver for whom an SR-22 or FR-44 certificate
      backed by this term is filed cannot be excluded.
    evidence_fields:
    - fr_filings.auto_policy_id
    - fr_filings.filed_driver_name
    - fr_filings.status
    - auto_policy_changes.driver_relationship
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.auto_policy_id
      action_bindings:
        fr_filings.auto_policy_id: auto_policy_id
  - id: exclusion_cap
    applies_to:
    - auto_driver_excluded
    kind: authorization
    condition: The number of currently excluded drivers on the term, counted by auto_msr_current_excluded_drivers,
      must be below max_excluded before another exclusion is endorsed.
    evidence_fields:
    - auto_policy_changes.auto_policy_id
    - auto_policy_changes.event_type
    - auto_policy_changes.driver_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.auto_policy_id
      action_bindings:
        auto_policy_changes.auto_policy_id: auto_policy_id
  params:
    per_tier:
      Cardinal Point Minimum Limits Liability:
        max_excluded: =max_excluded_drivers
      Cardinal Point 50/100/50 Liability:
        max_excluded: =max_excluded_drivers
      Cardinal Point 100/200/50 Liability:
        max_excluded: =max_excluded_drivers
      Cardinal Point 100/300/50 Liability:
        max_excluded: =max_excluded_drivers
      Cardinal Point 100/300/100 Liability:
        max_excluded: =max_excluded_drivers
      Cardinal Point 250/500/100 Liability:
        max_excluded: =max_excluded_drivers
    exclusion_effective_rule: =exclusion_effective_rule
  measures:
  - auto_msr_current_excluded_drivers
- id: auto_driver_schedule
  subject:
  - auto_driver_added
  - auto_driver_removed
  rule: Every resident of the household at or above household_listing_min_age is listed as a rated driver
    or as a named excluded driver. A driver is added as a rated driver only when the driver's violation
    points do not exceed the package's max_points. The rated drivers on the term may not exceed the package's
    max_rated; a driver who would exceed either limit is offered exclusion, or the term moves to the highest
    lower package whose limits are met. A driver is added effective the date the change is requested,
    never earlier; lifting an exclusion is an add with prior_driver_status excluded. The named insured
    states that the driver no longer lives in the household and does not drive any scheduled vehicle.
    A removal takes effect on the date requested, never earlier than the request, and returns premium
    pro rata of driver_term_premium; the named insured is never removed.
  eligibility:
  - id: driver_points
    applies_to:
    - auto_driver_added
    kind: authorization
    condition: A driver is added as a rated driver only when the driver's violation points do not exceed
      the package's max_points.
    evidence_fields:
    - auto_policy_changes.driver_violation_points
    - auto_policies.variant_name
    - auto_policy_changes.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.auto_policy_id
      action_bindings:
        auto_policy_changes.auto_policy_id: auto_policy_id
  - id: left_household
    applies_to:
    - auto_driver_removed
    kind: caller_fact
    condition: The named insured states that the driver no longer lives in the household and does not
      drive any scheduled vehicle.
    evidence_fields:
    - auto_policy_changes.driver_name
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.driver_name
      action_bindings:
        auto_policy_changes.driver_name: driver_name
  params:
    per_tier:
      Cardinal Point Minimum Limits Liability:
        max_points: =max_violation_points_new_business
        max_rated: =max_rated_drivers
      Cardinal Point 50/100/50 Liability:
        max_points: =max_violation_points_new_business
        max_rated: =max_rated_drivers
      Cardinal Point 100/200/50 Liability:
        max_points: =max_violation_points_new_business
        max_rated: =max_rated_drivers
      Cardinal Point 100/300/50 Liability:
        max_points: =max_violation_points_new_business
        max_rated: =max_rated_drivers
      Cardinal Point 100/300/100 Liability:
        max_points: =max_violation_points_new_business
        max_rated: =max_rated_drivers
      Cardinal Point 250/500/100 Liability:
        max_points: =max_violation_points_new_business
        max_rated: =max_rated_drivers
- id: auto_vehicle_changes
  subject:
  - auto_vehicle_added
  - auto_vehicle_removed
  rule: Coverage for an added vehicle starts on the date the vehicle was acquired only when it is reported
    no later than additional_vehicle_reporting_days calendar days after the vehicle was acquired. Calendar
    days are counted from the acquisition date as day 0; a report on or before the acquisition date plus
    the reporting days qualifies. A replacement vehicle reported within replacement_vehicle_reporting_days
    calendar days of acquisition also starts on its acquisition date; any later report starts on the report
    date. Vehicles on the term may not exceed the package's max_vehicles. A vehicle is removed on the
    date requested, never earlier than the request date. Additional and return premium are the vehicle_term_premium
    prorated from the change effective date over term_days.
  eligibility:
  - id: reporting_window
    applies_to:
    - auto_vehicle_added
    kind: time
    condition: Coverage for an added vehicle starts on the date the vehicle was acquired only when it
      is reported no later than additional_vehicle_reporting_days calendar days after the vehicle was
      acquired.
    evidence_fields:
    - auto_policy_changes.auto_change_id
    - auto_policy_changes.vehicle_acquired_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.auto_change_id
      action_bindings:
        auto_policy_changes.auto_change_id: auto_change_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle was acquired
      anchor_source: auto_policy_changes.vehicle_acquired_date
      relation: not_after
      duration_source: variants.additional_vehicle_reporting_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the acquisition date as day 0; a report on or before
        the acquisition date plus the reporting days qualifies.
      boundary: inclusive
  params:
    per_tier:
      Cardinal Point Minimum Limits Liability:
        max_vehicles: =max_vehicles
      Cardinal Point 50/100/50 Liability:
        max_vehicles: =max_vehicles
      Cardinal Point 100/200/50 Liability:
        max_vehicles: =max_vehicles
      Cardinal Point 100/300/50 Liability:
        max_vehicles: =max_vehicles
      Cardinal Point 100/300/100 Liability:
        max_vehicles: =max_vehicles
      Cardinal Point 250/500/100 Liability:
        max_vehicles: =max_vehicles
    replacement_vehicle_reporting_days: =replacement_vehicle_reporting_days
- id: auto_renewal
  subject:
  - auto_renewal_issued
  - auto_renewal_accepted
  - auto_renewal_not_taken
  - auto_term_expired
  rule: The renewal term is issued offer_days calendar days before the expiration date of an in-force
    term that is not being nonrenewed, with term_number increased by 1, the same policy number and the
    expiring term as prior_term_policy_id. At renewal the package is kept when the highest-rated driver's
    points do not exceed its renewal_points; otherwise the renewal is offered in the highest lower package
    whose renewal_points are met, and when no package is met the term is nonrenewed instead. The renewal
    down payment required by the renewal billing plan must be posted before the renewal is accepted. A
    renewal is accepted no later than late_window_days calendar days after the expiration date of the
    expiring term. Calendar days are counted from the expiration date of the expiring term as day 0; acceptance
    on or before that date plus late_window_days qualifies. A renewal accepted after the expiration date
    also requires a Statement of No Loss covering the lapse. A renewal paid on or before the expiration
    date goes in force on that date with no lapse; a renewal paid later goes in force with a lapse from
    the expiration date through the payment posting date, and coverage begins on the posting date plus
    reinstatement_effective_offset_days. A renewal not accepted within the window is closed as not_taken
    on the day after the window ends. The expiring term moves to expired on its expiration date whether
    or not the renewal is accepted. Accepting the renewal books premium written equal to the renewal full_term_premium
    and the renewal policy fee.
  eligibility:
  - id: late_window
    applies_to:
    - auto_renewal_accepted
    kind: time
    condition: A renewal is accepted no later than late_window_days calendar days after the expiration
      date of the expiring term.
    evidence_fields:
    - auto_policies.auto_policy_id
    - auto_policies.effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.auto_policy_id
      action_bindings:
        auto_policies.auto_policy_id: auto_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the expiration date of the expiring term
      anchor_source: auto_policies.effective_date
      relation: not_after
      duration_source: variants.late_renewal_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the expiration date of the expiring term as day 0;
        acceptance on or before that date plus late_window_days qualifies.
      boundary: inclusive
  - id: renewal_down_payment
    applies_to:
