    ab_days: The standard lift premium is the standard lift share multiplied by the state and platform-use relativities stated above and rounded to the cent, then multiplied by the calendar days from the lift effective date to the expiration date, the effective date counted and the expiration date not counted, and divided by term_days, with no other relativity; it is rounded once, at the end, to the nearest cent, half up.
    ab_ex_share: the basis is that recorded driver_term_premium divided by
