  - result: (RND(MN(dn_unbilled, MX(0, dn_qty * (dn_base_pct + dn_return_pct + dn_points_pct + dn_package_pct + dn_state_pct) / 100 - dn_offset)), 2)) if dn_scope_ok else 0
