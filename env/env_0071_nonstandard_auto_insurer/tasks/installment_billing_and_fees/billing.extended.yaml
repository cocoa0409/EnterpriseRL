  - dn_ret_payment: LATEST('billing_transactions','related_payment_txn_id', date_field='posted_date', event_type='billing_payment_returned')
  - dn_ret_invoice: None if dn_ret_payment == None else LATEST('billing_transactions','related_invoice_id', date_field='posted_date', billing_txn_id=dn_ret_payment)
  - dn_ret_next: None if dn_ret_invoice == None else LATEST('billing_invoices','billing_invoice_id', date_field='invoice_date', event_type='billing_installment_billed', installment_number=(LATEST('billing_invoices','installment_number',
