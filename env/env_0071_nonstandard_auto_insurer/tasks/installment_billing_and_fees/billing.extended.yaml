  factors:
  - id: endorsement_spread
    effect: method
    decides: endorsement_share
    bindings:
    - spread_balance
    - endorsement_share
    ladder:
    - when: the endorsement premium not yet billed is more than spread_min_balance and at least two installments are unbilled at the notice
      method: 'add an equal share: the endorsement premium not yet billed divided by the installments unbilled at the notice, rounded half up to the cent'
    - when: the endorsement premium not yet billed is above zero and either at most spread_min_balance or the notice's installment is the only one unbilled
      method: add the whole endorsement premium not yet billed
    - when: otherwise (no endorsement premium is left unbilled)
      method: add no endorsement premium
    baseline:
      endorsement_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: auto
  - id: credit_spread
    effect: method
    decides: carried_amount
    bindings:
    - credit_held
    - credit_unbilled
    - carried_amount
    ladder:
    - when: the plan holds a credit of at least spread_min_credit and at least two installments are unbilled at the notice
      method: 'carry an equal share of the credit: the credit divided by the installments unbilled, rounded half up to the cent'
    - when: the plan holds a credit and the notice's installment is the only one unbilled
      method: carry the credit up to the notice's scheduled premium plus the plan's installment_fee
    - when: otherwise (a smaller credit with two or more unbilled, an unpaid earlier amount, or nothing)
      method: carry the standing balance as the standard notice does
    baseline:
      carried_amount: standing_balance
    evidence:
    - history
    - cross_category
    cross_difficulty: auto
  - id: filer_endorsement_advance
    effect: parameter
    decides: adv_filer_pct
    bindings:
    - adv_filer_stamp
    - adv_filer_pct
    ladder:
    - when: the owner term billed backs an FR-44 certificate (financial_responsibility_filing fr44)
      value: K('fr44_endorsement_advance_pct')
    - when: it backs an SR-22 certificate (financial_responsibility_filing sr22)
      value: K('sr22_endorsement_advance_pct')
    - when: otherwise (financial_responsibility_filing none)
      value: '0'
    baseline:
      adv_filer_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: points_endorsement_advance
    effect: parameter
    decides: adv_points_pct
    bindings:
    - adv_points
    - adv_points_pct
    ladder:
    - when: the owner term billed carries 8 or more violation points
      value: K('points_high_endorsement_advance_pct')
    - when: it carries 4 to 7 violation points
      value: K('points_mid_endorsement_advance_pct')
    - when: otherwise (3 or fewer)
      value: '0'
    baseline:
      adv_points_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: package_endorsement_advance
    effect: parameter
    decides: adv_package_pct
    bindings:
    - adv_package
    - adv_package_pct
    ladder:
    - when: the owner term billed carries the Minimum Limits Liability package
      value: K('package_min_endorsement_advance_pct')
    - when: it carries the 50/100/50 Liability package
      value: K('package_low_endorsement_advance_pct')
    - when: otherwise (a higher package)
      value: '0'
    baseline:
      adv_package_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  baseline:
    rule: 'The notice''s installment is the one after the installment invoices already issued on the plan, and the installments unbilled at the notice are the plan''s installment_count less the installment
      invoices already issued, the notice''s own installment included. The schedule''s down payment premium is the plan''s down_payment_amount less the fully earned fees it took: every policy fee booked
      on the term the plan bills, and every filing fee the filing ledger shows assessed on the day the plan was set up for a certificate whose backing term is the term the plan bills, whatever its present
      status (when every certificate the customer holds rests on that term, every filing fee of the customer''s assessed that day), so that a plan switched onto its present plan from another keeps the schedule
      it was enrolled on. When the term the plan bills backs two or more certificates while the customer also holds a certificate on another term, the records do not show which of that day''s filing fees
      the plan took, so its invoices are priced as the base installment schedule prices them, the schedule''s down payment premium being the one the base down payment rule sets (term_premium_billed times
      the plan''s down_payment_pct_new_business for the first term of the policy number it bills, or its down_payment_pct_renewal for a later term, divided by 100 and rounded half up to the cent) for a
      plan enrolled on its present plan, and, for a plan switched onto it from another, the scheduled installment premium being the premium recorded on its installment 1 invoice or, while no installment
      1 invoice exists, the down payment premium being the base down payment rule''s figure for its present plan. The scheduled installment premium is term_premium_billed less that down payment premium,
      divided by installment_count and rounded half up to the cent; when the notice''s installment is the only one unbilled, its scheduled premium is instead term_premium_billed less the down payment premium
      and less the scheduled installment premium of every earlier installment. The endorsement premium not yet billed is every additional premium transaction booked on the owner term billed, less the endorsement
      premium already billed, which is the premium billed on the plan''s installment invoices less the scheduled installment premium once for each of those invoices. The plan''s standing balance at the
      notice is its account_balance less the premium not yet billed on any invoice, that premium being the scheduled installment premium of every unbilled installment (term_premium_billed less the down
      payment premium less the scheduled installment premium for each invoice already issued) plus the endorsement premium not yet billed; a positive standing balance is an amount billed earlier and still
      unpaid, a negative one is a credit the plan holds. The draft notice bills the scheduled premium of its installment and a fee of the plan''s installment_fee together with the filing fee recorded on
      the filing ledger for the certificate recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan''s latest installment invoice was issued (or,
      before any invoice, after the plan was set up) and has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier
      amount added, a credit subtracted); its minimum due is their sum, never less than zero, rounded half up to the cent. Where an invoice bills a certificate filing fee, it bills the unbilled filing fee
      of the certificate recorded first among the filings whose backing term is the term the plan bills (the earliest of those entries in the filing records, whatever its present status); when that term
      backs more than one certificate, the unbilled filing fee of any further certificate is not billed on that invoice and is referred to the filings desk.'
    params:
    - installment_count
    - installment_fee
    - down_payment_pct_new_business
    - down_payment_pct_renewal
  inputs:
    history:
    - table: billing_invoices
      aggregate: sum
      field: premium_amount
      filters:
        event_type: billing_installment_billed
    - category: auto
      table: auto_premium_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: auto_additional_premium
    - category: fr
      table: fr_filing_transactions
      aggregate: latest
      field: posted_date
      filters:
        event_type: fr_filing_fee_assessed
    cross_category:
    - auto
    - fr
    - nonowner
- id: billing_ext_endorsement_deposit
  base_policy_refs:
  - billing_payment_posting
  - billing_agg_returned_payments
  overwrite:
  - base_policy: billing_payment_posting
    superseded_clause: The customer personally authorizes each one-time payment taken by a representative, stating the card or bank account to be charged and the amount.
    replaced_by: For an endorsement deposit, and only for such a payment, the named insured authorizes the payment personally by running it with the representative, choosing the payment method and confirming
      the amount the representative states; a returned-payment makeup and a switch down payment are each authorized as their own schedules state; every other one-time payment taken by a representative is
      authorized by the customer personally, stating the card or bank account to be charged and the amount.
  trigger: on_request
  subject:
  - billing_payment_received
  computes: amount
  target_tool: authorize_endorsement_deposit_3483f9bd
  params:
    deposit_pct: 20.0
    min_deposit: 25.0
    whole_balance_max: 50.0
    deposit_pct_under_21: 10.0
    deposit_pct_21_to_24: 5.0
    deposit_pct_points_high: 10.0
    deposit_pct_points_low: 5.0
    large_endorsement_min: 200.0
    mid_endorsement_min: 100.0
    deposit_pct_large: 5.0
    deposit_pct_mid: 2.5
    deposit_pct_window_short: 5.0
    deposit_pct_window_mid: 2.5
    deposit_pct_unrelated: 10.0
    deposit_pct_relative: 5.0
  rule: 'When the named insured of an Owner Auto Policy term billed on a Monthly EFT or Monthly Card Autopay plan asks to pay toward the additional premium an endorsement added to the term, the representative
    takes the endorsement deposit by a one-time card or bank payment the named insured authorizes; the deposit is held whole on the plan as a credit that its draft notices carry as their credit schedule
    sets and is never applied to a draft notice already issued. This schedule covers such a plan only while its most recent installment invoice has at most one payment posted against it and its owner term
    backs at most one certificate; an owner term billed on any other plan, or on such a plan whose most recent installment invoice has two or more payments posted against it or whose owner term backs two
    or more certificates, is outside this schedule: no endorsement deposit is figured for it (the schedule''s figure is 0.00), and a payment toward its additional premium is taken as every other one-time
    payment is, for the amount the customer states, and applied as every other payment on its plan is: on a Monthly EFT or Monthly Card Autopay plan billing an Owner Auto Policy term to past-due invoices
    oldest first (fees before premium), then to unpaid late and NSF fees, then to the current invoice, whatever it leaves being held on the plan as a credit that its draft notices carry as their credit
    schedule sets, and on any other plan in payment_application_order. For an endorsement deposit, and only for such a payment, the named insured authorizes the payment personally by running it with the
    representative, choosing the payment method and confirming the amount the representative states; a returned-payment makeup and a switch down payment are each authorized as their own schedules state;
    every other one-time payment taken by a representative is authorized by the customer personally, stating the card or bank account to be charged and the amount. The endorsement deposit is fixed only
    after every installment whose invoice date has arrived is invoiced on the plan. The installment premium of the plan''s schedule is term_premium_billed less its down payment premium, divided by installment_count
    and rounded half up to the cent, the down payment premium being the plan''s down_payment_amount less the fully earned fees it took (the policy fee booked on the owner term and every filing fee the filing
    ledger shows assessed on the day the plan was set up for the certificate whose backing term is the owner term, whatever that certificate''s present status). The endorsement balance the deposit is taken
    on is every additional premium transaction booked on the owner term, less the premium the plan''s installment invoices have billed beyond the schedule''s installment premium for each of them, and less
    any credit the plan holds beyond what its issued invoices carry (the amount by which its account_balance falls short of the premium not yet billed on any invoice plus what its most recent installment
    invoice still owes, its minimum due less the payment posted against it, if any, plus every amount the bank returned against that payment), never below zero. The standard endorsement deposit is deposit_pct
    percent of the endorsement balance, rounded half up to the cent, but never less than min_deposit; an endorsement deposit is never more than the endorsement balance, and when the endorsement balance
    is zero no deposit is taken. The schedules below adjust the standard deposit: the one that sets how the deposit is figured replaces the standard figure, each of the others adds its own percentage of
    the endorsement balance, none acts on another''s result, and the total, capped at the endorsement balance, is rounded half up to the cent once, at the end. Deposit by installments left: the installments
    still unbilled are the plan''s installment_count less the installment invoices already issued on the plan; when at most one is still unbilled, or the endorsement balance is at most whole_balance_max,
    the deposit is figured as the whole endorsement balance; when two or three are still unbilled and the balance is more than whole_balance_max, it is figured as one unbilled installment''s share of the
    balance, the endorsement balance divided by the installments still unbilled and rounded half up to the cent; when four or more are still unbilled and the balance is more than whole_balance_max, it is
    figured as the standard deposit. Deposit addition by the added driver''s age: when the most recent driver added to the owner term was under 21 on the change effective date, deposit_pct_under_21 percent
    of the endorsement balance is added to the endorsement deposit; when that driver was 21 or older but under 25, deposit_pct_21_to_24 percent is added; otherwise, or when no driver was added, nothing
    is added. Age is counted in whole calendar months from the driver''s date of birth to the change effective date, under 21 meaning fewer than 252 months and under 25 fewer than 300. The most recent driver
    added is the driver addition with the latest change effective date on the owner term; of two added on the same date, the one recorded first. Deposit addition by the added driver''s violation points:
    when the most recent driver added to the owner term carries 6 or more company violation points, deposit_pct_points_high percent of the endorsement balance is added to the endorsement deposit; 1 to 5
    points, deposit_pct_points_low percent; no points, or no driver added, nothing. Deposit addition by endorsement size: when the additional premium booked on the owner term totals at least large_endorsement_min,
    deposit_pct_large percent of the endorsement balance is added to the endorsement deposit; at least mid_endorsement_min but less than large_endorsement_min, deposit_pct_mid percent; less than mid_endorsement_min,
    nothing. Deposit addition by the coverage left after the change: when fewer than 120 days run from the most recent driver addition''s change effective date to the owner term''s expiration date (the
    expiration date counted, the change date not), deposit_pct_window_short percent of the endorsement balance is added to the endorsement deposit; 120 to 179 days, deposit_pct_window_mid percent; 180 days
    or more, or no driver added, nothing. Deposit addition by household relationship: when the most recent driver added to the owner term is an unrelated household member, deposit_pct_unrelated percent
    of the endorsement balance is added to the endorsement deposit; when that driver is the named insured''s sibling, parent or other relative, deposit_pct_relative percent; when the driver is the named
    insured or the named insured''s spouse or child, or no driver was added, nothing. A whole calendar month is complete only when the later date''s day number is at least the earlier date''s day number
    (so a month that starts on a day the later month lacks is not complete until the next month).'
  prerequisite:
  - problem: billing_ext_draft_notice
    kind: value_input
    gate: dep_endorsement_billed
    form: state
    policy_source: The endorsement deposit is fixed only after every installment whose invoice date has arrived is invoiced on the plan.
    condition: for every installment whose invoice date (its due date less invoice_lead_days) is on or before the handling date, an installment invoice stands on the plan
    resolved_by: issue_draft_notice_1682239d
    effect: the premium billed on the plan's installment invoices grows by the issued notice's premium, so dep_endorsement_billed rises by the endorsement share that notice bills and the endorsement balance
      and the installments still unbilled both fall
  cross_category:
  - category: auto
    as: history
    reads:
    - expiration_date
    - auto_premium_transactions.amount
    - auto_policy_changes.driver_date_of_birth
    - auto_policy_changes.change_effective_date
    - auto_policy_changes.driver_violation_points
    - auto_policy_changes.driver_relationship
    note: The owner term's additional premium and its most recent driver addition decide the endorsement balance and the age, points, size, coverage-window and relationship additions.
  - category: fr
    as: history
    reads:
    - auto_policy_id
    - fr_filing_transactions.amount
    - fr_filing_transactions.posted_date
    note: A certificate filing fee charged at enrollment is taken off the plan's down payment to give the schedule's down payment premium.
  compute:
  - dep_notices: COUNT('billing_invoices', event_type='billing_installment_billed')
  - dep_down_premium: RND(F('down_payment_amount') - XSUM('auto','auto_premium_transactions','amount', event_type='auto_policy_fee', auto_policy_id=F('auto_policy_id')) - (0 if XCOUNT('fr','fr_filings',
      auto_policy_id=F('auto_policy_id')) == 0 else (XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date')) if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id'))
      == XCOUNT('fr','fr_filings') else ((XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date'), fr_filing_id=CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))))
      if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) == 1 else 0))), 2)
  - dep_scheduled: (RND((F('term_premium_billed') - dep_down_premium) / P('installment_count'), 2)) if P('installment_count') > 0 else 0
  - dep_ap_total: XSUM('auto','auto_premium_transactions','amount', event_type='auto_additional_premium', auto_policy_id=F('auto_policy_id'))
  - dep_endorsement_billed: RND(SUM('billing_invoices','premium_amount', event_type='billing_installment_billed') - dep_scheduled * dep_notices, 2)
  - dep_unbilled_scheduled: RND(F('term_premium_billed') - dep_down_premium - dep_scheduled * dep_notices, 2)
  - dep_latest_unpaid: MX(0, RND((LATEST('billing_invoices','minimum_due', date_field='invoice_date', event_type='billing_installment_billed') or 0) - SUM('billing_transactions','amount', event_type='billing_payment_received',
      related_invoice_id=LATEST('billing_invoices','billing_invoice_id', date_field='invoice_date', event_type='billing_installment_billed')) + SUM('billing_transactions','amount', event_type='billing_payment_returned',
      related_payment_txn_id=LATEST('billing_transactions','billing_txn_id', date_field='posted_date', event_type='billing_payment_received', related_invoice_id=LATEST('billing_invoices','billing_invoice_id',
      date_field='invoice_date', event_type='billing_installment_billed'))), 2))
  - dep_credit: MX(0, RND(dep_unbilled_scheduled + dep_ap_total - dep_endorsement_billed + dep_latest_unpaid - F('account_balance'), 2))
  - dep_balance: MX(0, RND(dep_ap_total - dep_endorsement_billed - dep_credit, 2))
  - collect_unbilled: P('installment_count') - COUNT('billing_invoices', event_type='billing_installment_billed')
  - core_deposit: dep_balance if (collect_unbilled <= 1 or dep_balance <= K('whole_balance_max')) else (RND(dep_balance / collect_unbilled, 2) if collect_unbilled <= 3 else MN(dep_balance, MX(RND(dep_balance
      * K('deposit_pct') / 100, 2), K('min_deposit'))))
  - added_dob: XLATEST('auto','auto_policy_changes','driver_date_of_birth', date_field='change_effective_date', event_type='auto_driver_added', auto_policy_id=F('auto_policy_id'))
  - age_change_date: XLATEST('auto','auto_policy_changes','change_effective_date', date_field='change_effective_date', event_type='auto_driver_added', auto_policy_id=F('auto_policy_id'))
  - age_add_pct: K('deposit_pct_under_21') if (added_dob != None and MONTHS(added_dob, age_change_date) < 252) else (K('deposit_pct_21_to_24') if (added_dob != None and MONTHS(added_dob, age_change_date)
      < 300) else 0)
  - added_points: XLATEST('auto','auto_policy_changes','driver_violation_points', date_field='change_effective_date', event_type='auto_driver_added', auto_policy_id=F('auto_policy_id')) or 0
  - points_add_pct: K('deposit_pct_points_high') if added_points >= 6 else (K('deposit_pct_points_low') if added_points >= 1 else 0)
  - size_ap_total: XSUM('auto','auto_premium_transactions','amount', event_type='auto_additional_premium', auto_policy_id=F('auto_policy_id'))
  - size_add_pct: K('deposit_pct_large') if size_ap_total >= K('large_endorsement_min') else (K('deposit_pct_mid') if size_ap_total >= K('mid_endorsement_min') else 0)
  - window_change_date: XLATEST('auto','auto_policy_changes','change_effective_date', date_field='change_effective_date', event_type='auto_driver_added', auto_policy_id=F('auto_policy_id'))
  - window_expiration: CFIELD('auto','expiration_date', auto_policy_id=F('auto_policy_id'))
  - window_add_pct: K('deposit_pct_window_short') if (window_change_date != None and DAYS(window_change_date, window_expiration) < 120) else (K('deposit_pct_window_mid') if (window_change_date != None and
      DAYS(window_change_date, window_expiration) < 180) else 0)
  - added_relation: XLATEST('auto','auto_policy_changes','driver_relationship', date_field='change_effective_date', event_type='auto_driver_added', auto_policy_id=F('auto_policy_id'))
  - relation_add_pct: K('deposit_pct_unrelated') if added_relation == 'unrelated_household_member' else (K('deposit_pct_relative') if (added_relation == 'sibling' or added_relation == 'parent' or added_relation
      == 'other_relative') else 0)
  - dep_scope_ok: (F('variant_name') == 'Cardinal Point Monthly EFT Plan' or F('variant_name') == 'Cardinal Point Monthly Card Autopay Plan') and (F('auto_policy_id') != None and F('auto_policy_id') !=
      '') and COUNT('billing_transactions', event_type='billing_payment_received', related_invoice_id=LATEST('billing_invoices','billing_invoice_id', date_field='invoice_date', event_type='billing_installment_billed'))
      <= 1 and XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) <= 1
  - result: (RND(MN(dep_balance, core_deposit + dep_balance * (age_add_pct + points_add_pct + size_add_pct + window_add_pct + relation_add_pct) / 100), 2)) if dep_scope_ok else 0
  compute_basis:
    dep_notices: The endorsement balance the deposit is taken on is every additional premium transaction booked on the owner term, less the premium the plan's installment invoices have billed beyond the
      schedule's installment premium for each of them, and less any credit the plan holds beyond what its issued invoices carry (the amount by which its account_balance falls short of the premium not yet
      billed on any invoice plus what its most recent installment invoice still owes, its minimum due less the payment posted against it, if any, plus every amount the bank returned against that payment),
      never below zero.
    dep_down_premium: The installment premium of the plan's schedule is term_premium_billed less its down payment premium, divided by installment_count and rounded half up to the cent, the down payment
      premium being the plan's down_payment_amount less the fully earned fees it took (the policy fee booked on the owner term and every filing fee the filing ledger shows assessed on the day the plan was
      set up for the certificate whose backing term is the owner term, whatever that certificate's present status).
    dep_scheduled: The installment premium of the plan's schedule is term_premium_billed less its down payment premium, divided by installment_count and rounded half up to the cent, the down payment premium
      being the plan's down_payment_amount less the fully earned fees it took (the policy fee booked on the owner term and every filing fee the filing ledger shows assessed on the day the plan was set up
      for the certificate whose backing term is the owner term, whatever that certificate's present status).
    dep_ap_total: The endorsement balance the deposit is taken on is every additional premium transaction booked on the owner term, less the premium the plan's installment invoices have billed beyond the
      schedule's installment premium for each of them, and less any credit the plan holds beyond what its issued invoices carry (the amount by which its account_balance falls short of the premium not yet
      billed on any invoice plus what its most recent installment invoice still owes, its minimum due less the payment posted against it, if any, plus every amount the bank returned against that payment),
      never below zero.
    dep_endorsement_billed: The endorsement balance the deposit is taken on is every additional premium transaction booked on the owner term, less the premium the plan's installment invoices have billed
      beyond the schedule's installment premium for each of them, and less any credit the plan holds beyond what its issued invoices carry (the amount by which its account_balance falls short of the premium
      not yet billed on any invoice plus what its most recent installment invoice still owes, its minimum due less the payment posted against it, if any, plus every amount the bank returned against that
      payment), never below zero.
    dep_unbilled_scheduled: The endorsement balance the deposit is taken on is every additional premium transaction booked on the owner term, less the premium the plan's installment invoices have billed
      beyond the schedule's installment premium for each of them, and less any credit the plan holds beyond what its issued invoices carry (the amount by which its account_balance falls short of the premium
      not yet billed on any invoice plus what its most recent installment invoice still owes, its minimum due less the payment posted against it, if any, plus every amount the bank returned against that
      payment), never below zero.
    dep_credit: The endorsement balance the deposit is taken on is every additional premium transaction booked on the owner term, less the premium the plan's installment invoices have billed beyond the
      schedule's installment premium for each of them, and less any credit the plan holds beyond what its issued invoices carry (the amount by which its account_balance falls short of the premium not yet
      billed on any invoice plus what its most recent installment invoice still owes, its minimum due less the payment posted against it, if any, plus every amount the bank returned against that payment),
      never below zero.
    dep_balance: The endorsement balance the deposit is taken on is every additional premium transaction booked on the owner term, less the premium the plan's installment invoices have billed beyond the
      schedule's installment premium for each of them, and less any credit the plan holds beyond what its issued invoices carry (the amount by which its account_balance falls short of the premium not yet
      billed on any invoice plus what its most recent installment invoice still owes, its minimum due less the payment posted against it, if any, plus every amount the bank returned against that payment),
      never below zero.
    collect_unbilled: 'Deposit by installments left: the installments still unbilled are the plan''s installment_count less the installment invoices already issued on the plan; when at most one is still
      unbilled, or the endorsement balance is at most whole_balance_max, the deposit is figured as the whole endorsement balance; when two or three are still unbilled and the balance is more than whole_balance_max,
      it is figured as one unbilled installment''s share of the balance, the endorsement balance divided by the installments still unbilled and rounded half up to the cent; when four or more are still unbilled
      and the balance is more than whole_balance_max, it is figured as the standard deposit.'
    core_deposit: 'Deposit by installments left: the installments still unbilled are the plan''s installment_count less the installment invoices already issued on the plan; when at most one is still unbilled,
      or the endorsement balance is at most whole_balance_max, the deposit is figured as the whole endorsement balance; when two or three are still unbilled and the balance is more than whole_balance_max,
      it is figured as one unbilled installment''s share of the balance, the endorsement balance divided by the installments still unbilled and rounded half up to the cent; when four or more are still unbilled
      and the balance is more than whole_balance_max, it is figured as the standard deposit.'
    added_dob: The most recent driver added is the driver addition with the latest change effective date on the owner term; of two added on the same date, the one recorded first.
    age_change_date: The most recent driver added is the driver addition with the latest change effective date on the owner term; of two added on the same date, the one recorded first.
    age_add_pct: 'Deposit addition by the added driver''s age: when the most recent driver added to the owner term was under 21 on the change effective date, deposit_pct_under_21 percent of the endorsement
      balance is added to the endorsement deposit; when that driver was 21 or older but under 25, deposit_pct_21_to_24 percent is added; otherwise, or when no driver was added, nothing is added. Age is
      counted in whole calendar months from the driver''s date of birth to the change effective date, under 21 meaning fewer than 252 months and under 25 fewer than 300.'
    added_points: The most recent driver added is the driver addition with the latest change effective date on the owner term; of two added on the same date, the one recorded first.
    points_add_pct: 'Deposit addition by the added driver''s violation points: when the most recent driver added to the owner term carries 6 or more company violation points, deposit_pct_points_high percent
      of the endorsement balance is added to the endorsement deposit; 1 to 5 points, deposit_pct_points_low percent; no points, or no driver added, nothing.'
    size_ap_total: 'Deposit addition by endorsement size: when the additional premium booked on the owner term totals at least large_endorsement_min, deposit_pct_large percent of the endorsement balance
      is added to the endorsement deposit; at least mid_endorsement_min but less than large_endorsement_min, deposit_pct_mid percent; less than mid_endorsement_min, nothing.'
    size_add_pct: 'Deposit addition by endorsement size: when the additional premium booked on the owner term totals at least large_endorsement_min, deposit_pct_large percent of the endorsement balance
      is added to the endorsement deposit; at least mid_endorsement_min but less than large_endorsement_min, deposit_pct_mid percent; less than mid_endorsement_min, nothing.'
    window_change_date: The most recent driver added is the driver addition with the latest change effective date on the owner term; of two added on the same date, the one recorded first.
    window_expiration: 'Deposit addition by the coverage left after the change: when fewer than 120 days run from the most recent driver addition''s change effective date to the owner term''s expiration
      date (the expiration date counted, the change date not), deposit_pct_window_short percent of the endorsement balance is added to the endorsement deposit; 120 to 179 days, deposit_pct_window_mid percent;
      180 days or more, or no driver added, nothing.'
    window_add_pct: 'Deposit addition by the coverage left after the change: when fewer than 120 days run from the most recent driver addition''s change effective date to the owner term''s expiration date
      (the expiration date counted, the change date not), deposit_pct_window_short percent of the endorsement balance is added to the endorsement deposit; 120 to 179 days, deposit_pct_window_mid percent;
      180 days or more, or no driver added, nothing.'
    added_relation: The most recent driver added is the driver addition with the latest change effective date on the owner term; of two added on the same date, the one recorded first.
    relation_add_pct: 'Deposit addition by household relationship: when the most recent driver added to the owner term is an unrelated household member, deposit_pct_unrelated percent of the endorsement
      balance is added to the endorsement deposit; when that driver is the named insured''s sibling, parent or other relative, deposit_pct_relative percent; when the driver is the named insured or the named
      insured''s spouse or child, or no driver was added, nothing.'
    result: 'The schedules below adjust the standard deposit: the one that sets how the deposit is figured replaces the standard figure, each of the others adds its own percentage of the endorsement balance,
      none acts on another''s result, and the total, capped at the endorsement balance, is rounded half up to the cent once, at the end.'
    dep_latest_unpaid: The endorsement balance the deposit is taken on is every additional premium transaction booked on the owner term, less the premium the plan's installment invoices have billed beyond
      the schedule's installment premium for each of them, and less any credit the plan holds beyond what its issued invoices carry (the amount by which its account_balance falls short of the premium not
      yet billed on any invoice plus what its most recent installment invoice still owes, its minimum due less the payment posted against it, if any, plus every amount the bank returned against that payment),
      never below zero.
    dep_scope_ok: 'This schedule covers such a plan only while its most recent installment invoice has at most one payment posted against it and its owner term backs at most one certificate; an owner term
      billed on any other plan, or on such a plan whose most recent installment invoice has two or more payments posted against it or whose owner term backs two or more certificates, is outside this schedule:
      no endorsement deposit is figured for it (the schedule''s figure is 0.00), and a payment toward its additional premium is taken as every other one-time payment is, for the amount the customer states,
      and applied as every other payment on its plan is: on a Monthly EFT or Monthly Card Autopay plan billing an Owner Auto Policy term to past-due invoices oldest first (fees before premium), then to
      unpaid late and NSF fees, then to the current invoice, whatever it leaves being held on the plan as a credit that its draft notices carry as their credit schedule sets, and on any other plan in payment_application_order.'
  factors:
  - id: deposit_by_installments_left
    effect: method
    decides: core_deposit
    bindings:
    - collect_unbilled
    - core_deposit
    ladder:
    - when: at most one installment is still unbilled, or the endorsement balance is at most whole_balance_max
      method: the whole endorsement balance
    - when: two or three installments are still unbilled and the endorsement balance is more than whole_balance_max
      method: 'one unbilled installment share: the endorsement balance divided by the installments still unbilled, rounded half up to the cent'
    - when: otherwise (four or more still unbilled and the balance more than whole_balance_max)
      method: 'the standard deposit: deposit_pct percent of the balance, not less than min_deposit, not more than the balance'
    baseline:
      core_deposit: MN(dep_balance, MX(RND(dep_balance * K('deposit_pct') / 100, 2), K('min_deposit')))
    evidence:
    - history
    cross_difficulty: null
  - id: added_driver_age_addition
    effect: parameter
    decides: age_add_pct
    bindings:
    - added_dob
    - age_change_date
    - age_add_pct
    ladder:
    - when: the most recent driver added was under 21 on the change effective date
      value: K('deposit_pct_under_21')
    - when: the most recent driver added was 21 or older but under 25 on the change effective date
      value: K('deposit_pct_21_to_24')
    - when: otherwise (25 or older, or no driver added)
      value: '0'
    baseline:
      age_add_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: auto
  - id: added_driver_points_addition
    effect: parameter
    decides: points_add_pct
    bindings:
    - added_points
    - points_add_pct
    ladder:
    - when: the most recent driver added carries 6 or more company violation points
      value: K('deposit_pct_points_high')
    - when: the most recent driver added carries 1 to 5 company violation points
      value: K('deposit_pct_points_low')
    - when: otherwise (no points, or no driver added)
      value: '0'
    baseline:
      points_add_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: endorsement_size_addition
    effect: parameter
    decides: size_add_pct
    bindings:
    - size_ap_total
    - size_add_pct
    ladder:
    - when: the additional premium booked on the owner term totals at least large_endorsement_min
      value: K('deposit_pct_large')
    - when: it totals at least mid_endorsement_min but less than large_endorsement_min
      value: K('deposit_pct_mid')
    - when: otherwise (less than mid_endorsement_min)
      value: '0'
    baseline:
      size_add_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: coverage_window_addition
    effect: parameter
    decides: window_add_pct
    bindings:
    - window_change_date
    - window_expiration
    - window_add_pct
    ladder:
    - when: fewer than 120 days run from the most recent driver addition's change effective date to the term expiration date
      value: K('deposit_pct_window_short')
    - when: 120 to 179 days run from that change effective date to the term expiration date
      value: K('deposit_pct_window_mid')
    - when: otherwise (180 days or more, or no driver added)
      value: '0'
    baseline:
      window_add_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: auto
  - id: household_relationship_addition
    effect: parameter
    decides: relation_add_pct
    bindings:
    - added_relation
    - relation_add_pct
    ladder:
    - when: the most recent driver added is an unrelated household member
      value: K('deposit_pct_unrelated')
    - when: the most recent driver added is the named insured's sibling, parent or other relative
      value: K('deposit_pct_relative')
    - when: otherwise (the named insured, a spouse or child, or no driver added)
      value: '0'
    baseline:
      relation_add_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  baseline:
    rule: The installment premium of the plan's schedule is term_premium_billed less its down payment premium, divided by installment_count and rounded half up to the cent, the down payment premium being
      the plan's down_payment_amount less the fully earned fees it took (the policy fee booked on the owner term and every filing fee the filing ledger shows assessed on the day the plan was set up for
      the certificate whose backing term is the owner term, whatever that certificate's present status). The endorsement balance the deposit is taken on is every additional premium transaction booked on
      the owner term, less the premium the plan's installment invoices have billed beyond the schedule's installment premium for each of them, and less any credit the plan holds beyond what its issued invoices
      carry (the amount by which its account_balance falls short of the premium not yet billed on any invoice plus what its most recent installment invoice still owes, its minimum due less the payment posted
      against it, if any, plus every amount the bank returned against that payment), never below zero. The standard endorsement deposit is deposit_pct percent of the endorsement balance, rounded half up
      to the cent, but never less than min_deposit; an endorsement deposit is never more than the endorsement balance, and when the endorsement balance is zero no deposit is taken.
    params:
    - deposit_pct
    - min_deposit
    - installment_count
  inputs:
    history:
    - table: billing_invoices
      aggregate: sum
      field: premium_amount
      filters:
        event_type: billing_installment_billed
    - category: auto
      table: auto_premium_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: auto_additional_premium
    - category: auto
      table: auto_policy_changes
      aggregate: latest
      field: driver_date_of_birth
      filters:
        event_type: auto_driver_added
    cross_category:
    - auto
    - fr
- id: billing_ext_returned_draft_makeup
  base_policy_refs:
  - billing_payment_posting
  - billing_agg_returned_payments
  overwrite:
  - base_policy: billing_payment_posting
    superseded_clause: The customer personally authorizes each one-time payment taken by a representative, stating the card or bank account to be charged and the amount.
    replaced_by: For a returned-payment makeup, and only for such a payment, the named insured authorizes the payment personally by running it with the representative, choosing the payment method and confirming
      the amount the representative states; an endorsement deposit and a switch down payment are each authorized as their own schedules state; every other one-time payment taken by a representative is authorized
      by the customer personally, stating the card or bank account to be charged and the amount.
  trigger: state_due
  subject:
  - billing_payment_received
  computes: amount
  target_tool: authorize_makeup_payment_1af63ac0
  params:
    fr44_advance_pct: 10.0
    sr22_advance_pct: 5.0
    direct_bill_advance_pct: 10.0
    autopay_advance_pct: 5.0
    large_return_min: 500.0
    mid_return_min: 250.0
    large_return_advance_pct: 2.5
    mid_return_advance_pct: 1.0
  rule: 'This schedule covers a payment returned on a plan billing an Owner Auto Policy term that backs at most one certificate, a payment whose installment invoice, if it had paid one, has no other payment
    posted against it, and whose plan''s next installment invoice, if already issued, has at most one payment posted against it; a payment recorded against an invoice counts as another payment unless it
    is the returned payment itself or a makeup referencing it; for any other returned payment no makeup is figured (the schedule''s figure is 0.00), and it is made good as every other one-time payment is,
    for the amount the customer states, and applied as every other payment on its plan is: on a Monthly EFT or Monthly Card Autopay plan billing an Owner Auto Policy term to past-due invoices oldest first
    (fees before premium), then to unpaid late and NSF fees, then to the current invoice, whatever it leaves being held on the plan as a credit that its draft notices carry as their credit schedule sets,
    and on any other plan in payment_application_order. A returned payment against which a payment referencing it already stands has been made good, and no makeup is figured for it (the schedule''s figure
    is 0.00). When a payment so covered has not been made good and the named insured makes it good, the representative takes the makeup payment by a one-time card or bank payment the named insured authorizes,
    recorded against the invoice the returned payment had paid and referencing the returned payment; it is applied as the plan''s payment application sets, so it settles the returned installment and the
    fees standing against it first, and what it carries ahead is held as a credit for the installments not yet invoiced. For a returned-payment makeup, and only for such a payment, the named insured authorizes
    the payment personally by running it with the representative, choosing the payment method and confirming the amount the representative states; an endorsement deposit and a switch down payment are each
    authorized as their own schedules state; every other one-time payment taken by a representative is authorized by the customer personally, stating the card or bank account to be charged and the amount.
    The returned payment is the one most recently returned on the plan (of two returns posted the same day, the one recorded first), its returned amount the total returned against it; its invoice is the
    installment invoice that payment had paid. The fees owed with it are every NSF fee posted for the returned payment and every late fee posted for its invoice, less every waiver that reverses one of those
    fees. The standard makeup payment is the returned amount plus the fees owed with it; a makeup payment is never more than the plan''s account_balance. The schedules below adjust the standard makeup:
    the one that sets how the returned payment is re-collected replaces the returned amount, the one that sets an advance adds the figure it sets, each of the others adds its own percentage of the returned
    amount, none acts on another''s result, and the total, capped at the account balance, is rounded half up to the cent once. Re-collecting the returned payment: when the returned payment had paid more
    than its invoice''s minimum due (so it also prepaid installments not yet invoiced), the makeup re-collects only what that invoice still owes, its minimum due less the payments posted against it plus
    the returned amount; when it had paid no installment invoice, the makeup re-collects nothing for it and the installments it prepaid are billed as scheduled; otherwise the makeup re-collects the returned
    amount. Makeup advance when the drafted account cannot be drafted again: when the plan still bills by automatic draft (signed authorizations outnumbering revocations), the returned payment is coded
    account_closed or stop_payment_by_payer and an installment remains after the one its invoice billed but has not been invoiced, the makeup adds that next installment''s scheduled premium (term_premium_billed
    less the schedule''s down payment premium, divided by installment_count and rounded half up to the cent, the down payment premium being the plan''s down_payment_amount less the fully earned fees it
    took (the policy fee booked on the owner term and every filing fee the filing ledger shows assessed on the day the plan was set up for the certificate whose backing term is the owner term, whatever
    that certificate''s present status); for the final installment, term_premium_billed less the down payment premium and less that installment premium for every earlier installment); when the plan still
    so bills, the return is so coded and the next installment has already been invoiced, the makeup adds that invoice''s minimum due less the payment posted against it, if any, plus every amount the bank
    returned against that payment; when the plan no longer bills by automatic draft, when the return is coded otherwise, when the returned payment had paid no installment invoice, or when no installment
    remains, the makeup adds no advance. Makeup advance by financial responsibility filing: when the owner term billed is written to back an FR-44 certificate (its financial_responsibility_filing is fr44),
    fr44_advance_pct percent of the returned amount is added to the makeup; when it is written to back an SR-22 certificate (its financial_responsibility_filing is sr22), sr22_advance_pct percent; when
    it backs no certificate, nothing. Makeup advance by payment plan: when the plan is an installment plan billed directly (no recurring payment authorization in force and installment_count above zero),
    direct_bill_advance_pct percent of the returned amount is added to the makeup; when it is an installment plan that bills by automatic draft (signed authorizations outnumbering revocations and installment_count
    above zero), autopay_advance_pct percent; on the Cardinal Point Paid-in-Full Plan (installment_count zero), whatever its authorizations, nothing. Makeup advance by returned amount: when the returned
    amount is at least large_return_min, large_return_advance_pct percent of it is added to the makeup; when it is at least mid_return_min but less than large_return_min, mid_return_advance_pct percent;
    when it is less than mid_return_min, nothing.'
  prerequisite: []
  cross_category:
  - category: auto
    as: branch
    reads:
    - financial_responsibility_filing
    - auto_premium_transactions.amount
    note: The owner term's term number sets the down payment percentage behind the next installment's scheduled premium, and the certificate it is written to back sets the filing advance percentage.
  - category: fr
    as: history
    reads:
    - auto_policy_id
    - fr_filing_transactions.amount
    - fr_filing_transactions.posted_date
    note: A certificate filing fee charged at enrollment is taken off the plan's down payment to give the schedule's down payment premium.
  compute:
  - mk_returned_payment: LATEST('billing_transactions','related_payment_txn_id', date_field='posted_date', event_type='billing_payment_returned')
  - mk_returned_amount: SUM('billing_transactions','amount', event_type='billing_payment_returned', related_payment_txn_id=mk_returned_payment)
  - mk_returned_invoice: LATEST('billing_transactions','related_invoice_id', date_field='posted_date', billing_txn_id=mk_returned_payment)
  - mk_nsf_due: RND(SUM('billing_transactions','amount', event_type='billing_nsf_fee', related_payment_txn_id=mk_returned_payment) - (SUM('billing_transactions','amount', event_type='billing_fee_waived',
      reversed_fee_txn_id=LATEST('billing_transactions','billing_txn_id', date_field='posted_date', event_type='billing_nsf_fee', related_payment_txn_id=mk_returned_payment)) if LATEST('billing_transactions','billing_txn_id',
      date_field='posted_date', event_type='billing_nsf_fee', related_payment_txn_id=mk_returned_payment) != None else 0), 2)
  - mk_late_due: RND(SUM('billing_transactions','amount', event_type='billing_late_fee', related_invoice_id=mk_returned_invoice) - (SUM('billing_transactions','amount', event_type='billing_fee_waived',
      reversed_fee_txn_id=LATEST('billing_transactions','billing_txn_id', date_field='posted_date', event_type='billing_late_fee', related_invoice_id=mk_returned_invoice)) if LATEST('billing_transactions','billing_txn_id',
      date_field='posted_date', event_type='billing_late_fee', related_invoice_id=mk_returned_invoice) != None else 0), 2)
  - recollect_invoice_min: LATEST('billing_invoices','minimum_due', date_field='invoice_date', billing_invoice_id=LATEST('billing_transactions','related_invoice_id', date_field='posted_date', billing_txn_id=LATEST('billing_transactions','related_payment_txn_id',
      date_field='posted_date', event_type='billing_payment_returned')))
  - recollect: RND(recollect_invoice_min - SUM('billing_transactions','amount', event_type='billing_payment_received', related_invoice_id=mk_returned_invoice) + mk_returned_amount, 2) if (mk_returned_invoice
      != None and mk_returned_amount > recollect_invoice_min) else (0 if mk_returned_invoice == None else mk_returned_amount)
  - adv_reason: LATEST('billing_transactions','return_reason', date_field='posted_date', event_type='billing_payment_returned')
  - adv_inst: LATEST('billing_invoices','installment_number', date_field='invoice_date', billing_invoice_id=LATEST('billing_transactions','related_invoice_id', date_field='posted_date', billing_txn_id=LATEST('billing_transactions','related_payment_txn_id',
      date_field='posted_date', event_type='billing_payment_returned')))
  - adv_down: RND(F('down_payment_amount') - XSUM('auto','auto_premium_transactions','amount', event_type='auto_policy_fee', auto_policy_id=F('auto_policy_id')) - (0 if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id'))
      == 0 else (XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date')) if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) == XCOUNT('fr','fr_filings')
      else ((XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date'), fr_filing_id=CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))))
      if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) == 1 else 0))), 2)
  - adv_sched: RND((F('term_premium_billed') - adv_down) / P('installment_count'), 2) if P('installment_count') > 0 else 0
  - adv_next_sched: RND(F('term_premium_billed') - adv_down - adv_sched * (P('installment_count') - 1), 2) if (adv_inst != None and adv_inst + 1 == P('installment_count')) else adv_sched
  - adv_next_invoice: LATEST('billing_invoices','billing_invoice_id', date_field='invoice_date', event_type='billing_installment_billed', installment_number=(adv_inst or 0) + 1)
  - adv_auth: COUNT('billing_authorizations', event_type='billing_recurring_payment_authorized') > COUNT('billing_authorizations', event_type='billing_recurring_payment_revoked')
  - advance_core: adv_next_sched if (adv_auth and (adv_reason == 'account_closed' or adv_reason == 'stop_payment_by_payer') and adv_inst != None and adv_inst < P('installment_count') and adv_next_invoice
      == None) else (RND(LATEST('billing_invoices','minimum_due', date_field='invoice_date', billing_invoice_id=adv_next_invoice) - SUM('billing_transactions','amount', event_type='billing_payment_received',
      related_invoice_id=adv_next_invoice) + SUM('billing_transactions','amount', event_type='billing_payment_returned', related_payment_txn_id=LATEST('billing_transactions','billing_txn_id', date_field='posted_date',
      event_type='billing_payment_received', related_invoice_id=adv_next_invoice)), 2) if (adv_auth and (adv_reason == 'account_closed' or adv_reason == 'stop_payment_by_payer') and adv_inst != None and
      adv_inst < P('installment_count') and adv_next_invoice != None) else 0)
  - filer_stamp: CFIELD('auto','financial_responsibility_filing', auto_policy_id=F('auto_policy_id'))
  - filer_pct: K('fr44_advance_pct') if filer_stamp == 'fr44' else (K('sr22_advance_pct') if filer_stamp == 'sr22' else 0)
  - plan_auth: COUNT('billing_authorizations', event_type='billing_recurring_payment_authorized') > COUNT('billing_authorizations', event_type='billing_recurring_payment_revoked')
  - plan_pct: K('direct_bill_advance_pct') if (not plan_auth and P('installment_count') > 0) else (K('autopay_advance_pct') if (plan_auth and P('installment_count') > 0) else 0)
  - size_amount: SUM('billing_transactions','amount', event_type='billing_payment_returned', related_payment_txn_id=LATEST('billing_transactions','related_payment_txn_id', date_field='posted_date', event_type='billing_payment_returned'))
  - size_pct: K('large_return_advance_pct') if size_amount >= K('large_return_min') else (K('mid_return_advance_pct') if size_amount >= K('mid_return_min') else 0)
  - mk_scope_invoice_ok: mk_returned_invoice == None or COUNT('billing_transactions', event_type='billing_payment_received', related_invoice_id=mk_returned_invoice) - COUNT('billing_transactions', event_type='billing_payment_received',
      related_invoice_id=mk_returned_invoice, related_payment_txn_id=mk_returned_payment) <= 1
  - mk_scope_next: None if mk_returned_invoice == None else LATEST('billing_invoices','billing_invoice_id', date_field='invoice_date', event_type='billing_installment_billed', installment_number=(LATEST('billing_invoices','installment_number',
      date_field='invoice_date', billing_invoice_id=mk_returned_invoice) or 0) + 1)
  - mk_made_good: mk_returned_payment != None and COUNT('billing_transactions', event_type='billing_payment_received', related_payment_txn_id=mk_returned_payment) >= 1
  - mk_scope_ok: (F('auto_policy_id') != None and F('auto_policy_id') != '') and mk_scope_invoice_ok and (mk_scope_next == None or COUNT('billing_transactions', event_type='billing_payment_received', related_invoice_id=mk_scope_next)
      <= 1) and not mk_made_good and XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) <= 1
  - result: (RND(MN(F('account_balance'), recollect + mk_nsf_due + mk_late_due + advance_core + mk_returned_amount * (filer_pct + plan_pct + size_pct) / 100), 2)) if mk_scope_ok else 0
  compute_basis:
