  rule: 'When the named insured of an Owner Auto Policy term billed on the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan asks to move the plan off automatic draft to the
    Cardinal Point Six-Pay Direct Bill Plan, and neither the installment invoice that the payment most recently returned on the plan had paid nor its next installment invoice, if already issued, has two
    or more payments posted against it (a payment recorded against an invoice not counting when it is the returned payment itself or a makeup referencing it), and the owner term backs at most one certificate,
    the representative first takes the switch down payment that move requires, by a one-time card or bank payment the named insured authorizes; it is recorded on the plan toward the first installment not
    yet invoiced (carrying that installment''s number) and linked to no invoice, it is taken off the premium the move spreads again, and it is never applied to an invoice already issued. When the move is
    asked on any other plan, or outside these limits, no switch down payment is due (the schedule''s figure is 0.00). For a switch down payment, and only for such a payment, the named insured authorizes
    the payment personally by running it with the representative, choosing the payment method and confirming the amount the representative states; an endorsement deposit and a returned-payment makeup are
    each authorized as their own schedules state; every other one-time payment taken by a representative is authorized by the customer personally, stating the card or bank account to be charged and the
    amount. For the switch down payment, the installments already invoiced are the plan''s installment invoices; the plan''s own down payment premium is its down_payment_amount less the fully earned fees
    it took (the policy fee booked on the owner term and every filing fee the filing ledger shows assessed on the day the plan was set up for the certificate whose backing term is the owner term, whatever
    that certificate''s present status); its scheduled installment premium is term_premium_billed less that down payment premium, divided by installment_count and rounded half up to the cent; and the scheduled
    premium not yet invoiced is term_premium_billed less the plan''s own down payment premium and less that scheduled installment premium once for each installment already invoiced. The Six-Pay Direct Bill
    Plan''s down payment percentage is its down_payment_pct_new_business (direct_bill_down_pct_new) for the first term of a policy number and its down_payment_pct_renewal (direct_bill_down_pct_renewal)
    for a later term. The standard switch down payment refigures the down payment as if the term had been enrolled on the Six-Pay Direct Bill Plan: that percentage of term_premium_billed, divided by 100,
    less the plan''s own down payment premium, never below zero; a switch down payment is never more than the scheduled premium not yet invoiced, and when it comes to zero none is taken. The schedules below
    adjust the standard switch down payment: the one that sets the basis replaces the premium the percentage is applied to and what is taken off it, each of the others adds the percentage it sets to the
    down payment percentage, none acts on another''s result, and the amount is rounded half up to the cent once, at the end. Switch down payment basis by how far the term has been invoiced, the installments
    not yet invoiced being installment_count less the installment invoices already issued: when at least one installment has been invoiced and two or more are not yet invoiced, the percentage is applied
    to the scheduled premium not yet invoiced and nothing is taken off it; when only one installment is not yet invoiced, no switch down payment is taken; otherwise (no installment invoiced yet, or none
    left to invoice) the down payment is refigured as the standard switch down payment does. Switch down payment addition by returned payments: when the payment most recently returned on the plan posted
    no more than 90 days before the move (the move''s date counted, the return''s date not), returned_recent_pct is added to the down payment percentage; when it posted more than 90 days before the move
    and a payment has been returned on the plan in the last twelve months, returned_older_pct is added; when no payment has been returned on the plan in the last twelve months, nothing is added. A return
    counts while fewer than twelve whole calendar months separate its posting date from the move. Switch down payment addition by violation points: when the owner term billed carries 8 or more company violation
    points, points_high_pct is added to the down payment percentage; when it carries 4 to 7, points_mid_pct; when it carries 3 or fewer, nothing. Switch down payment addition by liability package: when
    the owner term billed carries the Cardinal Point Minimum Limits Liability package, package_min_pct is added to the down payment percentage; when it carries the Cardinal Point 50/100/50 Liability package,
    package_low_pct; when it carries any higher package, nothing. Switch down payment addition by garaging state, under the company''s own state schedule (no statute sets it): when the owner term billed
    is garaged in Florida, state_fl_pct is added to the down payment percentage; when it is garaged in Georgia or Texas, state_ga_tx_pct; when it is garaged in Virginia, Ohio or Arizona, nothing. Apart
    from the plan''s own schedule figures, only the switch down payment itself is rounded, half up to the cent. A whole calendar month is complete only when the later date''s day number is at least the
    earlier date''s day number (so a month that starts on a day the later month lacks is not complete until the next month).'
