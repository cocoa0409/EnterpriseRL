      is garaged in Virginia, Ohio or Arizona carries the plan''s installment_fee (direct_bill_installment_fee).'
    sw_fee: 'No installment fee is charged on an invoice whose installment was avoided by paying the whole balance before it was invoiced (the plan''s account_balance at the invoice is zero or less): the
      installment fee every invoice this schedule figures would carry is then 0.00, any certificate filing fee still being billed.'
