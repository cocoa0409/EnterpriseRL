- id: billing_payment_posting
  subject:
  - billing_payment_received
  - billing_agent_payment_fee
  rule: 'The customer personally authorizes each one-time payment taken by a representative, stating the
    card or bank account to be charged and the amount. A single card or bank payment may not exceed max_single_payment.
    Payments are applied in payment_application_order: past-due invoices oldest first (fees before premium),
    then unpaid late and NSF fees, then the current invoice, then future installments nearest first; any
    excess is a credit. A payment posts on the day it is received; a mailed payment also records its postmark
    date. A partial payment is accepted and applied in the same order. A personal check is refused on
    plans whose personal_check_accepted is false. The agent-assisted payment fee is charged only on a
    one-time payment taken through the agent_phone channel. The fee is the plan''s agent_fee and is not
    charged on payments made online, through the automated phone line, by mail, at an agent office or
    by automatic draft.'
  eligibility:
  - id: customer_authorizes
    applies_to:
    - billing_payment_received
    kind: caller_fact
    condition: The customer personally authorizes each one-time payment taken by a representative, stating
      the card or bank account to be charged and the amount.
