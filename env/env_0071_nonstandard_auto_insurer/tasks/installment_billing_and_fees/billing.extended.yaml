    sw_premium: Each schedule below replaces or adds to one part of that standard first invoice, its premium, its installment fee or the amount carried onto it, and works from the standard figures alone,
      never from another schedule's result, so the minimum due is the same in whatever order they are applied; what they add to its premium together never exceeds the endorsement premium left to bill.
    sw_fee_total: Each schedule below replaces or adds to one part of that standard first invoice, its premium, its installment fee or the amount carried onto it, and works from the standard figures alone,
