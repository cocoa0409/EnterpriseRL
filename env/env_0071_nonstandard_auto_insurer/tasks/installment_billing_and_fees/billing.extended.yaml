      Cardinal Point Monthly Card Autopay Plan:
        allowed: =due_date_change_allowed
        max_shift_days: =due_date_change_max_shift_days
        max_changes: =due_date_change_max_per_term
        latest_days_before_due: =due_date_change_latest_days_before_due
- id: billing_plan_switch
  subject:
  - billing_plan_switched
  - billing_recurring_payment_authorized
  rule: A plan is switched only to a plan listed in its plan_switch_targets. plan_switches_used must be
    below max_switches. A switch to a Monthly EFT or Monthly Card Autopay plan requires a recurring payment
    authorization signed by the customer at least authorization_lead_days calendar days before the next
    draft date. The customer personally signs a recurring payment authorization, stating the last four
    digits of the account or card. A plan restricted to certified funds can never be switched to a Monthly
    EFT or Monthly Card Autopay plan. A switch to the Cardinal Point Paid-in-Full Plan is made only when
    the whole account_balance is paid, and future installment fees are then avoided. Unbilled installments
    keep their amounts and due dates; invoices issued after the switch carry the new plan's installment
    fee.
