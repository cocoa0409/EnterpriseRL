- id: billing_cancellation_settlement
  subject:
  - billing_final_billed
  - billing_final_bill
  - billing_referred_to_collections
  - billing_balance_written_off
  - billing_refund_issued
  - billing_plan_closed
  rule: A final bill is issued only after the policy term the plan bills has been cancelled (auto_policies.status,
    or nonowner_policies.status for a non-owner term, is cancelled). After the cancellation return premium
    is credited, a debit account_balance above small_balance_writeoff_max is final-billed with a due date
    final_bill_due_days calendar days after the final bill date and no installment fee; a debit balance
    at or below it is written off as small_balance and the plan closes. A final balance still unpaid collections_referral_days
    calendar days after the final bill due date is referred to the collection agency; a collection balance
    is closed when paid or when the agency returns it as uncollectible. A credit balance is refunded within
    credit_refund_days calendar days by refund_method and the plan closes. A plan whose term expired with
    a zero balance closes on the expiration date.
  eligibility:
  - id: term_cancelled
    applies_to:
    - billing_final_billed
    - billing_final_bill
    kind: state
    condition: A final bill is issued only after the policy term the plan bills has been cancelled (auto_policies.status,
      or nonowner_policies.status for a non-owner term, is cancelled).
    evidence_fields:
    - nonowner_policies.status
    - auto_policies.status
    - billing_plans.auto_policy_id
    - billing_plans.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
        - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
        billing_plans.nonowner_policy_id: nonowner_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - cancelled
  params:
    small_balance_writeoff_max: =small_balance_writeoff_max
    final_bill_due_days: =final_bill_due_days
    collections_referral_days: =collections_referral_days
    credit_refund_days: =credit_refund_days
    refund_method: =refund_method
- id: billing_reactivation
  subject:
  - billing_plan_reactivated
  rule: A final-billed plan is reactivated only after the policy term it bills (owner or non-owner) has
    been reinstated. On reactivation the premium re-written by the reinstatement is charged, the reinstatement
    fee is charged, unbilled installments keep their original due dates and amounts (an installment whose
    due date fell inside the lapse is billed on the next invoice), and the plan is current. The reinstatement
    payment itself must already have covered every past-due amount; a plan in in_collections or closed
    is never reactivated.
  eligibility:
  - id: term_reinstated
    applies_to:
    - billing_plan_reactivated
    kind: authorization
    condition: A final-billed plan is reactivated only after the policy term it bills (owner or non-owner)
      has been reinstated.
    evidence_fields:
    - auto_policies.status
    - auto_policies.reinstatement_date
    - nonowner_policies.status
    - nonowner_policies.reinstatement_date
    - billing_plans.auto_policy_id
    - billing_plans.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.auto_policy_id
        - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.auto_policy_id: auto_policy_id
        billing_plans.nonowner_policy_id: nonowner_policy_id
  params:
    reactivation_on_reinstatement: =reactivation_on_reinstatement
    reactivated_installment_rule: =reactivated_installment_rule
- id: billing_renewal_billing
  subject:
  - billing_renewal_bill
  rule: 'The renewal bill is issued with the renewal offer on the renewal term''s own plan: its premium
    portion is the renewal full-term premium multiplied by the plan''s renewal_down_pct and divided by
    100, rounded to the cent, its fees are the renewal policy fee and any filing fee due, and it is due
    on the expiration date of the expiring term. Only one renewal bill is issued per renewal term. On
    plans with renewal_auto_draft true the renewal down payment is drafted on the due date under the recurring
    authorization.'
  eligibility:
  - id: one_renewal_bill
    applies_to:
    - billing_renewal_bill
    kind: dedup
    condition: Only one renewal bill is issued per renewal term.
    evidence_fields:
    - billing_invoices.billing_plan_id
    - billing_invoices.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_invoices.billing_plan_id
      action_bindings:
        billing_invoices.billing_plan_id: billing_plan_id
    dedup_contract:
      table: billing_invoices
      mode: separate_record
      object_bindings:
        billing_plan_id: billing_plan_id
      duplicate_filters:
        event_type:
        - billing_renewal_bill
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Paid-in-Full Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Two-Pay Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Four-Pay Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Six-Pay Direct Bill Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Monthly EFT Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
      Cardinal Point Monthly Card Autopay Plan:
        renewal_down_pct: =down_payment_pct_renewal
        renewal_auto_draft: =renewal_auto_draft
- id: billing_premium_posting
  subject:
  - billing_premium_charged
  - billing_premium_credited
  rule: Every premium written and additional premium transaction of the billed term is posted as a charge,
    and every return premium transaction as a credit, for the same amount on the day the policy transaction
    is processed, referencing it. Each policy premium transaction is posted to the plan only once. Fully
    earned fees are charged with the policy transaction that produced them. Premium is never posted to
    a plan whose term it does not belong to.
  eligibility:
  - id: post_once
    applies_to:
    - billing_premium_charged
    - billing_premium_credited
    kind: dedup
    condition: Each policy premium transaction is posted to the plan only once.
    evidence_fields:
    - billing_transactions.source_auto_txn_id
    - billing_transactions.source_nonowner_txn_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_transactions.source_auto_txn_id
        - billing_transactions.source_nonowner_txn_id
      action_bindings:
        billing_transactions.source_auto_txn_id: source_auto_txn_id
        billing_transactions.source_nonowner_txn_id: source_nonowner_txn_id
    dedup_contract:
      table: billing_transactions
      mode: separate_record
      object_bindings:
        source_auto_txn_id: source_auto_txn_id
        source_nonowner_txn_id: source_nonowner_txn_id
      duplicate_filters:
        event_type:
        - billing_premium_charged
        - billing_premium_credited
      distinct_fields: []
  params:
    premium_posting_rule: =premium_posting_rule
extended_policies:
- id: billing_ext_draft_notice
  base_policy_refs:
  - billing_installment_schedule
  - billing_installment_fee_rule
  - billing_payment_posting
  overwrite:
  - base_policy: billing_installment_schedule
    superseded_clause: Each invoice is issued invoice_lead_days calendar days before its due date and bills the installment premium, the plan's installment fee and every past-due amount still unpaid; its
      minimum_due is their sum.
    replaced_by: For a draft notice on a plan billing an Owner Auto Policy term, and only for such a notice, the notice is issued invoice_lead_days calendar days before its due date and bills what this
      schedule states; the first invoice after an owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the named insured's request is issued and billed as its own schedule states;
      any other invoice, a later invoice of a moved plan included, is issued invoice_lead_days calendar days before its due date and bills the installment premium, the plan's installment fee with that certificate
      filing fee, and every past-due amount still unpaid, its minimum_due being their sum.
  - base_policy: billing_installment_schedule
    superseded_clause: Credits on the plan reduce the next installments nearest first; an installment fully covered by credit before its invoice date is not invoiced.
    replaced_by: For a Monthly EFT or Monthly Card Autopay plan billing an Owner Auto Policy term, and only for such a plan, a credit on the plan is carried onto its draft notices as the credit schedule
      below sets, each installment is invoiced on its invoice date even when a credit covers it, and a credit still held when such a plan is moved off automatic draft to the Six-Pay Direct Bill Plan at
      the named insured's request is carried onto the first invoice after the move as that invoice's own schedule sets, that invoice being issued even when the credit covers it; on any other plan, and on
      a moved plan after its first invoice, credits on the plan reduce the next installments nearest first, and an installment fully covered by credit before its invoice date is not invoiced.
  - base_policy: billing_installment_fee_rule
    superseded_clause: Each installment invoice carries the plan's installment_fee, charged on the invoice date.
    replaced_by: For a draft notice on a plan billing an Owner Auto Policy term, and only for such a notice, the fee it bills is the plan's installment_fee together with any certificate filing fee this
      schedule bills, charged on the invoice date; the first invoice after an owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the named insured's request carries the fee its own
      schedule sets; any other installment invoice, a later invoice of a moved plan included, carries the plan's installment_fee unadjusted together with the unbilled filing fee of the certificate recorded
      first on the term the plan bills, which the filing charter bills on the backing term's plan, charged on the invoice date.
  - base_policy: billing_payment_posting
    superseded_clause: 'Payments are applied in payment_application_order: past-due invoices oldest first (fees before premium), then unpaid late and NSF fees, then the current invoice, then future installments
      nearest first; any excess is a credit.'
    replaced_by: 'On a Monthly EFT or Monthly Card Autopay plan billing an Owner Auto Policy term, and only on such a plan, a payment is applied to past-due invoices oldest first (fees before premium),
      then to unpaid late and NSF fees, then to the current invoice, and whatever it leaves is held on the plan as a credit that its draft notices, or the first invoice after a move off automatic draft
      the named insured asks for, carry as their credit schedules set, an endorsement deposit and a switch down payment being held as their own schedules state; on any other plan, payments are applied in
      payment_application_order: past-due invoices oldest first (fees before premium), then unpaid late and NSF fees, then the current invoice, then future installments nearest first, any excess being a
      credit.'
  trigger: state_due
  subject:
  - billing_installment_billed
  computes: minimum_due
  target_tool: issue_draft_notice_1682239d
  params:
    spread_min_balance: 100.0
    spread_min_credit: 100.0
    fr44_endorsement_advance_pct: 5.0
    sr22_endorsement_advance_pct: 2.5
    points_high_endorsement_advance_pct: 2.5
    points_mid_endorsement_advance_pct: 1.5
    package_min_endorsement_advance_pct: 2.5
    package_low_endorsement_advance_pct: 1.5
  rule: 'This schedule fixes the draft notice of an installment on a Monthly EFT or Monthly Card Autopay plan (a plan that bills by automatic draft) billing an Owner Auto Policy term that backs at most
    one certificate; a plan billing a Named Non-Owner Policy term, and any other plan it does not name, is outside it and its invoices follow the base installment schedule as the overwrites above restate
    it, each billing its scheduled installment premium, the plan''s installment_fee together with the certificate filing fee this schedule bills (read, as for a draft notice, from the certificate recorded
    first on the term the plan bills, owner or non-owner), and the standing balance (an unpaid earlier amount added, a credit subtracted), its minimum due never below zero, the endorsement premium not yet
    billed on a non-owner plan being reckoned from the additional premium booked on the non-owner term it bills; a plan with no installment left to invoice, the Paid-in-Full Plan included, has no installment
    invoice, so this schedule sets no figure for it (0.00); on a plan moved off automatic draft at the named insured''s request, every invoice after the move''s first bills as its scheduled installment
    premium the respread installment premium the move fixed (the scheduled premium left when the move was made, term_premium_billed less the schedule''s down payment premium and less its scheduled installment
    premium for each installment invoiced before the move, less the switch down payment recorded toward the move''s first installment, divided by the installments then left and rounded half up to the cent,
    the last installment billing what remains), its standing balance being reckoned on that respread schedule; and the first invoice after an owner plan is moved off automatic draft to the Six-Pay Direct
    Bill Plan at the named insured''s request is billed as its own schedule states. For a draft notice on a plan billing an Owner Auto Policy term, and only for such a notice, the notice is issued invoice_lead_days
    calendar days before its due date and bills what this schedule states; the first invoice after an owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the named insured''s request
    is issued and billed as its own schedule states; any other invoice, a later invoice of a moved plan included, is issued invoice_lead_days calendar days before its due date and bills the installment
    premium, the plan''s installment fee with that certificate filing fee, and every past-due amount still unpaid, its minimum_due being their sum. For a draft notice on a plan billing an Owner Auto Policy
    term, and only for such a notice, the fee it bills is the plan''s installment_fee together with any certificate filing fee this schedule bills, charged on the invoice date; the first invoice after an
    owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the named insured''s request carries the fee its own schedule sets; any other installment invoice, a later invoice of a moved
    plan included, carries the plan''s installment_fee unadjusted together with the unbilled filing fee of the certificate recorded first on the term the plan bills, which the filing charter bills on the
    backing term''s plan, charged on the invoice date. For a Monthly EFT or Monthly Card Autopay plan billing an Owner Auto Policy term, and only for such a plan, a credit on the plan is carried onto its
    draft notices as the credit schedule below sets, each installment is invoiced on its invoice date even when a credit covers it, and a credit still held when such a plan is moved off automatic draft
    to the Six-Pay Direct Bill Plan at the named insured''s request is carried onto the first invoice after the move as that invoice''s own schedule sets, that invoice being issued even when the credit
    covers it; on any other plan, and on a moved plan after its first invoice, credits on the plan reduce the next installments nearest first, and an installment fully covered by credit before its invoice
    date is not invoiced. On a Monthly EFT or Monthly Card Autopay plan billing an Owner Auto Policy term, and only on such a plan, a payment is applied to past-due invoices oldest first (fees before premium),
    then to unpaid late and NSF fees, then to the current invoice, and whatever it leaves is held on the plan as a credit that its draft notices, or the first invoice after a move off automatic draft the
    named insured asks for, carry as their credit schedules set, an endorsement deposit and a switch down payment being held as their own schedules state; on any other plan, payments are applied in payment_application_order:
    past-due invoices oldest first (fees before premium), then unpaid late and NSF fees, then the current invoice, then future installments nearest first, any excess being a credit. The notice''s installment
    is the one after the installment invoices already issued on the plan, and the installments unbilled at the notice are the plan''s installment_count less the installment invoices already issued, the
    notice''s own installment included. The schedule''s down payment premium is the plan''s down_payment_amount less the fully earned fees it took: every policy fee booked on the term the plan bills, and
    every filing fee the filing ledger shows assessed on the day the plan was set up for a certificate whose backing term is the term the plan bills, whatever its present status (when every certificate
    the customer holds rests on that term, every filing fee of the customer''s assessed that day), so that a plan switched onto its present plan from another keeps the schedule it was enrolled on. When
    the term the plan bills backs two or more certificates while the customer also holds a certificate on another term, the records do not show which of that day''s filing fees the plan took, so its invoices
    are priced as the base installment schedule prices them, the schedule''s down payment premium being the one the base down payment rule sets (term_premium_billed times the plan''s down_payment_pct_new_business
    for the first term of the policy number it bills, or its down_payment_pct_renewal for a later term, divided by 100 and rounded half up to the cent) for a plan enrolled on its present plan, and, for
    a plan switched onto it from another, the scheduled installment premium being the premium recorded on its installment 1 invoice or, while no installment 1 invoice exists, the down payment premium being
    the base down payment rule''s figure for its present plan. The scheduled installment premium is term_premium_billed less that down payment premium, divided by installment_count and rounded half up to
    the cent; when the notice''s installment is the only one unbilled, its scheduled premium is instead term_premium_billed less the down payment premium and less the scheduled installment premium of every
    earlier installment. The endorsement premium not yet billed is every additional premium transaction booked on the owner term billed, less the endorsement premium already billed, which is the premium
    billed on the plan''s installment invoices less the scheduled installment premium once for each of those invoices. The plan''s standing balance at the notice is its account_balance less the premium
    not yet billed on any invoice, that premium being the scheduled installment premium of every unbilled installment (term_premium_billed less the down payment premium less the scheduled installment premium
    for each invoice already issued) plus the endorsement premium not yet billed; a positive standing balance is an amount billed earlier and still unpaid, a negative one is a credit the plan holds. The
    draft notice bills the scheduled premium of its installment and a fee of the plan''s installment_fee together with the filing fee recorded on the filing ledger for the certificate recorded first on
    the owner term billed, whatever its present status, when that fee was assessed after the plan''s latest installment invoice was issued (or, before any invoice, after the plan was set up) and has not
    been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted); its minimum due is
    their sum, never less than zero, rounded half up to the cent. No installment fee is charged on an invoice whose installment was avoided by paying the whole balance before it was invoiced (the plan''s
    account_balance at the invoice is zero or less): the installment fee every invoice this schedule figures would carry is then 0.00, any certificate filing fee still being billed. Where an invoice bills
    a certificate filing fee, it bills the unbilled filing fee of the certificate recorded first among the filings whose backing term is the term the plan bills (the earliest of those entries in the filing
    records, whatever its present status); when that term backs more than one certificate, the unbilled filing fee of any further certificate is not billed on that invoice and is referred to the filings
    desk. The schedules below each replace or add to one named part of that standard notice (its premium or the amount carried onto it); the percentages of the advance schedules are added together and applied
    once to the endorsement premium not yet billed, that advance being rounded half up to the cent once, and what the schedules add to its premium together never exceeds the endorsement premium not yet
    billed; each acts on the standard figures and none on another''s result, so the order in which they are applied does not change the minimum due. Endorsement premium on a draft notice: when the endorsement
    premium not yet billed is more than spread_min_balance and at least two installments are unbilled at the notice, the notice adds to its premium an equal share of it, the endorsement premium not yet
    billed divided by the installments unbilled at the notice and rounded half up to the cent; when it is above zero and either is at most spread_min_balance or the notice''s installment is the only one
    unbilled, the notice adds all of it; when it is zero or less, the notice adds no endorsement premium. Credit carried onto a draft notice: when the plan holds a credit of at least spread_min_credit and
    at least two installments are unbilled at the notice, the notice carries an equal share of the credit, the credit divided by the installments unbilled at the notice and rounded half up to the cent,
    and the rest stays for the later notices; when it holds a credit and the notice''s installment is the only one unbilled, the notice carries the credit up to its scheduled premium plus the plan''s installment_fee,
    any rest being refunded when the plan closes; otherwise the notice carries the standing balance as the standard notice does. Endorsement premium billed ahead by the certificate the term backs, under
    the company''s own filed percentages: when the owner term billed is written to back an FR-44 certificate (its financial_responsibility_filing is fr44), the notice adds to its premium fr44_endorsement_advance_pct
    percent of the endorsement premium not yet billed; when it is written to back an SR-22 certificate (its financial_responsibility_filing is sr22), sr22_endorsement_advance_pct percent; when it backs
    no certificate, nothing. Endorsement premium billed ahead by violation points, under the company''s own filed percentages: when the owner term billed carries 8 or more company violation points, the
    notice adds to its premium points_high_endorsement_advance_pct percent of the endorsement premium not yet billed; when it carries 4 to 7, points_mid_endorsement_advance_pct percent; when it carries
    3 or fewer, nothing. Endorsement premium billed ahead by liability package, under the company''s own filed percentages: when the owner term billed carries the Cardinal Point Minimum Limits Liability
    package, the notice adds to its premium package_min_endorsement_advance_pct percent of the endorsement premium not yet billed; when it carries the Cardinal Point 50/100/50 Liability package, package_low_endorsement_advance_pct
    percent; when it carries any higher package, nothing. Apart from the schedule''s own figures (its down payment premium and scheduled installment premium), only the shares, the advance and the minimum
    due are rounded, each half up to the cent.'
  prerequisite: []
  cross_category:
  - category: auto
    as: branch
    reads:
    - financial_responsibility_filing
    - violation_points
    - variant_name
    - auto_premium_transactions.amount
    - term_number
    note: The owner term billed decides the down payment percentage and, by the certificate it backs, its violation points and its liability package, the endorsement premium billed ahead; its additional
      premium is the endorsement premium the notice spreads.
  - category: fr
    as: history
    reads:
    - auto_policy_id
    - fr_filing_transactions.amount
    - fr_filing_transactions.posted_date
    - nonowner_policy_id
    note: The filing fee ledger of the certificate filed on the owner term gives the recorded fee and whether it is still to be billed.
  - category: nonowner
    as: history
    reads:
    - nonowner_premium_transactions.amount
    - term_number
    note: On a plan billing a non-owner term, the policy fee and additional premium booked on that term give the schedule's down payment premium and the endorsement premium the base invoice reckons.
  compute:
  - notices_issued: COUNT('billing_invoices', event_type='billing_installment_billed')
  - unbilled_count: P('installment_count') - notices_issued
  - down_premium: (RND(F('term_premium_billed') * (P('down_payment_pct_new_business') if (CFIELD('auto','term_number', auto_policy_id=F('auto_policy_id')) if (F('auto_policy_id') != None and F('auto_policy_id')
      != '') else CFIELD('nonowner','term_number', nonowner_policy_id=F('nonowner_policy_id'))) == 1 else P('down_payment_pct_renewal')) / 100, 2) if (F('plan_switches_used') or 0) == 0 else ((RND(F('term_premium_billed')
      - LATEST('billing_invoices','premium_amount', date_field='invoice_date', event_type='billing_installment_billed', installment_number=1) * P('installment_count'), 2)) if LATEST('billing_invoices','premium_amount',
      date_field='invoice_date', event_type='billing_installment_billed', installment_number=1) != None else RND(F('term_premium_billed') * (P('down_payment_pct_new_business') if (CFIELD('auto','term_number',
      auto_policy_id=F('auto_policy_id')) if (F('auto_policy_id') != None and F('auto_policy_id') != '') else CFIELD('nonowner','term_number', nonowner_policy_id=F('nonowner_policy_id'))) == 1 else P('down_payment_pct_renewal'))
      / 100, 2))) if (((XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) >= 2 and XCOUNT('fr','fr_filings') > XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')))) if (F('auto_policy_id')
      != None and F('auto_policy_id') != '') else (XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id')) >= 2 and XCOUNT('fr','fr_filings') > XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id'))))
      else ((RND(F('down_payment_amount') - XSUM('auto','auto_premium_transactions','amount', event_type='auto_policy_fee', auto_policy_id=F('auto_policy_id')) - (0 if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id'))
      == 0 else (XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date')) if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) == XCOUNT('fr','fr_filings')
      else ((XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date'), fr_filing_id=CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))))
      if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) == 1 else 0))), 2)) if (F('auto_policy_id') != None and F('auto_policy_id') != '') else RND(F('down_payment_amount') - XSUM('nonowner','nonowner_premium_transactions','amount',
      event_type='nonowner_policy_fee', nonowner_policy_id=F('nonowner_policy_id')) - (0 if XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id')) == 0 else (XSUM('fr','fr_filing_transactions','amount',
      event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date')) if XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id')) == XCOUNT('fr','fr_filings') else ((XSUM('fr','fr_filing_transactions','amount',
      event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date'), fr_filing_id=CFIELD('fr','fr_filing_id', nonowner_policy_id=F('nonowner_policy_id')))) if XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id'))
      == 1 else 0))), 2))
  - scheduled_premium: RND((F('term_premium_billed') - down_premium) / P('installment_count'), 2) if P('installment_count') > 0 else 0
  - base_premium: RND(F('term_premium_billed') - down_premium - scheduled_premium * (P('installment_count') - 1), 2) if unbilled_count == 1 else scheduled_premium
  - ap_total: XSUM('auto','auto_premium_transactions','amount', event_type='auto_additional_premium', auto_policy_id=F('auto_policy_id'))
  - endorsement_billed: RND(SUM('billing_invoices','premium_amount', event_type='billing_installment_billed') - scheduled_premium * notices_issued, 2)
  - endorsement_balance: RND(ap_total - endorsement_billed, 2)
  - unbilled_scheduled: RND(F('term_premium_billed') - down_premium - scheduled_premium * notices_issued, 2)
  - standing_balance: RND(F('account_balance') - unbilled_scheduled - endorsement_balance, 2)
  - spread_balance: RND(XSUM('auto','auto_premium_transactions','amount', event_type='auto_additional_premium', auto_policy_id=F('auto_policy_id')) - (SUM('billing_invoices','premium_amount', event_type='billing_installment_billed')
      - scheduled_premium * COUNT('billing_invoices', event_type='billing_installment_billed')), 2)
  - endorsement_share: RND(spread_balance / unbilled_count, 2) if (spread_balance > K('spread_min_balance') and unbilled_count >= 2) else (spread_balance if (spread_balance > 0 and (spread_balance <= K('spread_min_balance')
      or unbilled_count == 1)) else 0)
  - credit_held: MX(0, RND((F('term_premium_billed') - down_premium - scheduled_premium * COUNT('billing_invoices', event_type='billing_installment_billed')) + XSUM('auto','auto_premium_transactions','amount',
      event_type='auto_additional_premium', auto_policy_id=F('auto_policy_id')) - (SUM('billing_invoices','premium_amount', event_type='billing_installment_billed') - scheduled_premium * COUNT('billing_invoices',
      event_type='billing_installment_billed')) - F('account_balance'), 2))
  - credit_unbilled: P('installment_count') - COUNT('billing_invoices', event_type='billing_installment_billed')
  - carried_amount: (0 - RND(credit_held / credit_unbilled, 2)) if (credit_held >= K('spread_min_credit') and credit_unbilled >= 2) else ((0 - MN(credit_held, base_premium + P('installment_fee'))) if (credit_held
      > 0 and credit_unbilled == 1) else standing_balance)
  - filing_fee_date: XLATEST('fr','fr_filing_transactions','posted_date', date_field='posted_date', event_type='fr_filing_fee_assessed', fr_filing_id=(CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))
      if (F('auto_policy_id') != None and F('auto_policy_id') != '') else CFIELD('fr','fr_filing_id', nonowner_policy_id=F('nonowner_policy_id'))))
  - filing_reversed: XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_waived', fr_filing_id=(CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id')) if (F('auto_policy_id')
      != None and F('auto_policy_id') != '') else CFIELD('fr','fr_filing_id', nonowner_policy_id=F('nonowner_policy_id'))))
  - filing_last_bill: LATEST('billing_invoices','invoice_date', date_field='invoice_date', event_type='billing_installment_billed') if LATEST('billing_invoices','invoice_date', date_field='invoice_date',
      event_type='billing_installment_billed') != None else F('enrolled_date')
  - filing_unbilled: filing_fee_date != None and filing_reversed == 0 and DAYS(filing_last_bill, filing_fee_date) > 0
  - filing_fee_amount: XLATEST('fr','fr_filing_transactions','amount', date_field='posted_date', event_type='fr_filing_fee_assessed', fr_filing_id=(CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))
      if (F('auto_policy_id') != None and F('auto_policy_id') != '') else CFIELD('fr','fr_filing_id', nonowner_policy_id=F('nonowner_policy_id'))))
  - filing_fee_billed: (filing_fee_amount or 0) if filing_unbilled else 0
  - adv_filer_stamp: CFIELD('auto','financial_responsibility_filing', auto_policy_id=F('auto_policy_id'))
  - adv_filer_pct: K('fr44_endorsement_advance_pct') if adv_filer_stamp == 'fr44' else (K('sr22_endorsement_advance_pct') if adv_filer_stamp == 'sr22' else 0)
  - adv_points: CFIELD('auto','violation_points', auto_policy_id=F('auto_policy_id'))
  - adv_points_pct: K('points_high_endorsement_advance_pct') if int(adv_points or 0) >= 8 else (K('points_mid_endorsement_advance_pct') if int(adv_points or 0) >= 4 else 0)
  - adv_package: CFIELD('auto','variant_name', auto_policy_id=F('auto_policy_id'))
  - adv_package_pct: K('package_min_endorsement_advance_pct') if adv_package == 'Cardinal Point Minimum Limits Liability' else (K('package_low_endorsement_advance_pct') if adv_package == 'Cardinal Point
      50/100/50 Liability' else 0)
  - notice_endorsement: MN(MX(0, endorsement_balance), endorsement_share + RND(MX(0, endorsement_balance) * (adv_filer_pct + adv_points_pct + adv_package_pct) / 100, 2))
  - notice_premium: RND(base_premium + notice_endorsement, 2)
  - notice_fee: RND((0 if F('account_balance') <= 0 else P('installment_fee')) + filing_fee_billed, 2)
  - mv_k: int(MAX('billing_transactions','installment_number', event_type='billing_payment_received', related_invoice_id=None, source_auto_txn_id=None))
  - mv_down: SUM('billing_transactions','amount', event_type='billing_payment_received', installment_number=mv_k, related_invoice_id=None) if mv_k >= 1 else 0
  - mv_left: RND(F('term_premium_billed') - down_premium - scheduled_premium * (mv_k - 1), 2)
  - mv_n: P('installment_count') - (mv_k - 1)
  - mv_respread: RND((mv_left - mv_down) / mv_n, 2) if (mv_k >= 1 and mv_n > 0) else 0
  - fb_premium: ((RND(mv_left - mv_down - mv_respread * (mv_n - 1), 2) if notices_issued + 1 == P('installment_count') else mv_respread) if mv_k >= 1 else base_premium)
  - fb_unbilled: RND(mv_left - mv_down - mv_respread * (notices_issued - (mv_k - 1)), 2) if mv_k >= 1 else unbilled_scheduled
  - fb_end_billed: RND(SUM('billing_invoices','premium_amount', event_type='billing_installment_billed') - scheduled_premium * (mv_k - 1) - mv_respread * (notices_issued - (mv_k - 1)), 2) if mv_k >= 1 else
      endorsement_billed
  - fb_ap: ap_total if (F('auto_policy_id') != None and F('auto_policy_id') != '') else XSUM('nonowner','nonowner_premium_transactions','amount', event_type='nonowner_additional_premium', nonowner_policy_id=F('nonowner_policy_id'))
  - fb_standing: RND(F('account_balance') - fb_unbilled - (fb_ap - fb_end_billed), 2)
  - notice_scope_ok: (F('variant_name') == 'Cardinal Point Monthly EFT Plan' or F('variant_name') == 'Cardinal Point Monthly Card Autopay Plan') and (F('auto_policy_id') != None and F('auto_policy_id')
      != '') and XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) <= 1
  - result: 0 if unbilled_count <= 0 else ((RND(MX(0, notice_premium + notice_fee + carried_amount), 2)) if notice_scope_ok else RND(MX(0, fb_premium + (0 if F('account_balance') <= 0 else P('installment_fee'))
      + filing_fee_billed + fb_standing), 2))
  compute_basis:
    notices_issued: The notice's installment is the one after the installment invoices already issued on the plan, and the installments unbilled at the notice are the plan's installment_count less the installment
      invoices already issued, the notice's own installment included.
    unbilled_count: The notice's installment is the one after the installment invoices already issued on the plan, and the installments unbilled at the notice are the plan's installment_count less the installment
      invoices already issued, the notice's own installment included.
    down_premium: 'The schedule''s down payment premium is the plan''s down_payment_amount less the fully earned fees it took: every policy fee booked on the term the plan bills, and every filing fee the
      filing ledger shows assessed on the day the plan was set up for a certificate whose backing term is the term the plan bills, whatever its present status (when every certificate the customer holds
      rests on that term, every filing fee of the customer''s assessed that day), so that a plan switched onto its present plan from another keeps the schedule it was enrolled on. When the term the plan
      bills backs two or more certificates while the customer also holds a certificate on another term, the records do not show which of that day''s filing fees the plan took, so its invoices are priced
      as the base installment schedule prices them, the schedule''s down payment premium being the one the base down payment rule sets (term_premium_billed times the plan''s down_payment_pct_new_business
      for the first term of the policy number it bills, or its down_payment_pct_renewal for a later term, divided by 100 and rounded half up to the cent) for a plan enrolled on its present plan, and, for
      a plan switched onto it from another, the scheduled installment premium being the premium recorded on its installment 1 invoice or, while no installment 1 invoice exists, the down payment premium
      being the base down payment rule''s figure for its present plan.'
    scheduled_premium: The scheduled installment premium is term_premium_billed less that down payment premium, divided by installment_count and rounded half up to the cent; when the notice's installment
      is the only one unbilled, its scheduled premium is instead term_premium_billed less the down payment premium and less the scheduled installment premium of every earlier installment.
    base_premium: The scheduled installment premium is term_premium_billed less that down payment premium, divided by installment_count and rounded half up to the cent; when the notice's installment is
      the only one unbilled, its scheduled premium is instead term_premium_billed less the down payment premium and less the scheduled installment premium of every earlier installment.
    ap_total: The endorsement premium not yet billed is every additional premium transaction booked on the owner term billed, less the endorsement premium already billed, which is the premium billed on
      the plan's installment invoices less the scheduled installment premium once for each of those invoices.
    endorsement_billed: The endorsement premium not yet billed is every additional premium transaction booked on the owner term billed, less the endorsement premium already billed, which is the premium
      billed on the plan's installment invoices less the scheduled installment premium once for each of those invoices.
    endorsement_balance: The endorsement premium not yet billed is every additional premium transaction booked on the owner term billed, less the endorsement premium already billed, which is the premium
      billed on the plan's installment invoices less the scheduled installment premium once for each of those invoices.
    unbilled_scheduled: The plan's standing balance at the notice is its account_balance less the premium not yet billed on any invoice, that premium being the scheduled installment premium of every unbilled
      installment (term_premium_billed less the down payment premium less the scheduled installment premium for each invoice already issued) plus the endorsement premium not yet billed; a positive standing
      balance is an amount billed earlier and still unpaid, a negative one is a credit the plan holds.
    standing_balance: The plan's standing balance at the notice is its account_balance less the premium not yet billed on any invoice, that premium being the scheduled installment premium of every unbilled
      installment (term_premium_billed less the down payment premium less the scheduled installment premium for each invoice already issued) plus the endorsement premium not yet billed; a positive standing
      balance is an amount billed earlier and still unpaid, a negative one is a credit the plan holds.
    spread_balance: The endorsement premium not yet billed is every additional premium transaction booked on the owner term billed, less the endorsement premium already billed, which is the premium billed
      on the plan's installment invoices less the scheduled installment premium once for each of those invoices.
    endorsement_share: 'Endorsement premium on a draft notice: when the endorsement premium not yet billed is more than spread_min_balance and at least two installments are unbilled at the notice, the notice
      adds to its premium an equal share of it, the endorsement premium not yet billed divided by the installments unbilled at the notice and rounded half up to the cent; when it is above zero and either
      is at most spread_min_balance or the notice''s installment is the only one unbilled, the notice adds all of it; when it is zero or less, the notice adds no endorsement premium.'
    credit_held: 'Credit carried onto a draft notice: when the plan holds a credit of at least spread_min_credit and at least two installments are unbilled at the notice, the notice carries an equal share
      of the credit, the credit divided by the installments unbilled at the notice and rounded half up to the cent, and the rest stays for the later notices; when it holds a credit and the notice''s installment
      is the only one unbilled, the notice carries the credit up to its scheduled premium plus the plan''s installment_fee, any rest being refunded when the plan closes; otherwise the notice carries the
      standing balance as the standard notice does.'
    credit_unbilled: 'Credit carried onto a draft notice: when the plan holds a credit of at least spread_min_credit and at least two installments are unbilled at the notice, the notice carries an equal
      share of the credit, the credit divided by the installments unbilled at the notice and rounded half up to the cent, and the rest stays for the later notices; when it holds a credit and the notice''s
      installment is the only one unbilled, the notice carries the credit up to its scheduled premium plus the plan''s installment_fee, any rest being refunded when the plan closes; otherwise the notice
      carries the standing balance as the standard notice does.'
    carried_amount: 'Credit carried onto a draft notice: when the plan holds a credit of at least spread_min_credit and at least two installments are unbilled at the notice, the notice carries an equal
      share of the credit, the credit divided by the installments unbilled at the notice and rounded half up to the cent, and the rest stays for the later notices; when it holds a credit and the notice''s
      installment is the only one unbilled, the notice carries the credit up to its scheduled premium plus the plan''s installment_fee, any rest being refunded when the plan closes; otherwise the notice
      carries the standing balance as the standard notice does.'
    filing_fee_date: The draft notice bills the scheduled premium of its installment and a fee of the plan's installment_fee together with the filing fee recorded on the filing ledger for the certificate
      recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued (or, before any invoice, after the plan was
      set up) and has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted);
      its minimum due is their sum, never less than zero, rounded half up to the cent.
    filing_reversed: The draft notice bills the scheduled premium of its installment and a fee of the plan's installment_fee together with the filing fee recorded on the filing ledger for the certificate
      recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued (or, before any invoice, after the plan was
      set up) and has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted);
      its minimum due is their sum, never less than zero, rounded half up to the cent.
    filing_last_bill: The draft notice bills the scheduled premium of its installment and a fee of the plan's installment_fee together with the filing fee recorded on the filing ledger for the certificate
      recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued (or, before any invoice, after the plan was
      set up) and has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted);
      its minimum due is their sum, never less than zero, rounded half up to the cent.
    filing_unbilled: The draft notice bills the scheduled premium of its installment and a fee of the plan's installment_fee together with the filing fee recorded on the filing ledger for the certificate
      recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued (or, before any invoice, after the plan was
      set up) and has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted);
      its minimum due is their sum, never less than zero, rounded half up to the cent.
    filing_fee_amount: The draft notice bills the scheduled premium of its installment and a fee of the plan's installment_fee together with the filing fee recorded on the filing ledger for the certificate
      recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued (or, before any invoice, after the plan was
      set up) and has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted);
      its minimum due is their sum, never less than zero, rounded half up to the cent.
    filing_fee_billed: The draft notice bills the scheduled premium of its installment and a fee of the plan's installment_fee together with the filing fee recorded on the filing ledger for the certificate
      recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued (or, before any invoice, after the plan was
      set up) and has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted);
      its minimum due is their sum, never less than zero, rounded half up to the cent.
    notice_fee: 'No installment fee is charged on an invoice whose installment was avoided by paying the whole balance before it was invoiced (the plan''s account_balance at the invoice is zero or less):
      the installment fee every invoice this schedule figures would carry is then 0.00, any certificate filing fee still being billed.'
    notice_premium: The draft notice bills the scheduled premium of its installment and a fee of the plan's installment_fee together with the filing fee recorded on the filing ledger for the certificate
      recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued (or, before any invoice, after the plan was
      set up) and has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted);
      its minimum due is their sum, never less than zero, rounded half up to the cent.
    notice_endorsement: The schedules below each replace or add to one named part of that standard notice (its premium or the amount carried onto it); the percentages of the advance schedules are added
      together and applied once to the endorsement premium not yet billed, that advance being rounded half up to the cent once, and what the schedules add to its premium together never exceeds the endorsement
      premium not yet billed; each acts on the standard figures and none on another's result, so the order in which they are applied does not change the minimum due.
    result: The draft notice bills the scheduled premium of its installment and a fee of the plan's installment_fee together with the filing fee recorded on the filing ledger for the certificate recorded
      first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued (or, before any invoice, after the plan was set up) and
      has not been reversed, a fee assessed on the day an invoice is issued being billed on that invoice; it carries the standing balance (an unpaid earlier amount added, a credit subtracted); its minimum
      due is their sum, never less than zero, rounded half up to the cent.
    adv_filer_stamp: 'Endorsement premium billed ahead by the certificate the term backs, under the company''s own filed percentages: when the owner term billed is written to back an FR-44 certificate (its
      financial_responsibility_filing is fr44), the notice adds to its premium fr44_endorsement_advance_pct percent of the endorsement premium not yet billed; when it is written to back an SR-22 certificate
      (its financial_responsibility_filing is sr22), sr22_endorsement_advance_pct percent; when it backs no certificate, nothing.'
    adv_filer_pct: 'Endorsement premium billed ahead by the certificate the term backs, under the company''s own filed percentages: when the owner term billed is written to back an FR-44 certificate (its
      financial_responsibility_filing is fr44), the notice adds to its premium fr44_endorsement_advance_pct percent of the endorsement premium not yet billed; when it is written to back an SR-22 certificate
      (its financial_responsibility_filing is sr22), sr22_endorsement_advance_pct percent; when it backs no certificate, nothing.'
    adv_points: 'Endorsement premium billed ahead by violation points, under the company''s own filed percentages: when the owner term billed carries 8 or more company violation points, the notice adds
      to its premium points_high_endorsement_advance_pct percent of the endorsement premium not yet billed; when it carries 4 to 7, points_mid_endorsement_advance_pct percent; when it carries 3 or fewer,
      nothing.'
    adv_points_pct: 'Endorsement premium billed ahead by violation points, under the company''s own filed percentages: when the owner term billed carries 8 or more company violation points, the notice adds
      to its premium points_high_endorsement_advance_pct percent of the endorsement premium not yet billed; when it carries 4 to 7, points_mid_endorsement_advance_pct percent; when it carries 3 or fewer,
      nothing.'
    adv_package: 'Endorsement premium billed ahead by liability package, under the company''s own filed percentages: when the owner term billed carries the Cardinal Point Minimum Limits Liability package,
      the notice adds to its premium package_min_endorsement_advance_pct percent of the endorsement premium not yet billed; when it carries the Cardinal Point 50/100/50 Liability package, package_low_endorsement_advance_pct
      percent; when it carries any higher package, nothing.'
    adv_package_pct: 'Endorsement premium billed ahead by liability package, under the company''s own filed percentages: when the owner term billed carries the Cardinal Point Minimum Limits Liability package,
      the notice adds to its premium package_min_endorsement_advance_pct percent of the endorsement premium not yet billed; when it carries the Cardinal Point 50/100/50 Liability package, package_low_endorsement_advance_pct
      percent; when it carries any higher package, nothing.'
    notice_scope_ok: This schedule fixes the draft notice of an installment on a Monthly EFT or Monthly Card Autopay plan (a plan that bills by automatic draft) billing an Owner Auto Policy term that backs
      at most one certificate; a plan billing a Named Non-Owner Policy term, and any other plan it does not name, is outside it and its invoices follow the base installment schedule as the overwrites above
      restate it, each billing its scheduled installment premium, the plan's installment_fee together with the certificate filing fee this schedule bills (read, as for a draft notice, from the certificate
      recorded first on the term the plan bills, owner or non-owner), and the standing balance (an unpaid earlier amount added, a credit subtracted), its minimum due never below zero, the endorsement premium
      not yet billed on a non-owner plan being reckoned from the additional premium booked on the non-owner term it bills; a plan with no installment left to invoice, the Paid-in-Full Plan included, has
      no installment invoice, so this schedule sets no figure for it (0.00); on a plan moved off automatic draft at the named insured's request, every invoice after the move's first bills as its scheduled
