    sw_ret_payment: When the named insured of an Owner Auto Policy term billed on the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan asks to stop the automatic drafts and
      pay by bill, and the move falls when at least one installment has been invoiced and two or more are not yet invoiced, and neither the installment invoice that the payment most recently returned on
