      for a later term. The standard switch down payment refigures the down payment as if the term had been enrolled on the Six-Pay Direct Bill Plan: that percentage of term_premium_billed, divided by 100,
      less the plan''s own down payment premium, never below zero; a switch down payment is never more than the scheduled premium not yet invoiced, and when it comes to zero none is taken.'
    params:
    - installment_count
    - direct_bill_down_pct_new
    - direct_bill_down_pct_renewal
  inputs:
    history:
    - table: billing_invoices
      aggregate: count
      field: billing_invoice_id
      filters:
        event_type: billing_installment_billed
    - table: billing_transactions
      aggregate: count
      field: billing_txn_id
      within_months: 12
      filters:
        event_type: billing_payment_returned
    cross_category:
    - auto
    - fr
- id: billing_ext_direct_bill_switch
  base_policy_refs:
  - billing_plan_switch
  - billing_installment_schedule
  - billing_installment_fee_rule
  - billing_returned_payments
  overwrite:
  - base_policy: billing_plan_switch
    superseded_clause: Unbilled installments keep their amounts and due dates; invoices issued after the switch carry the new plan's installment fee.
    replaced_by: For a move of a plan billing an Owner Auto Policy term off automatic draft to the Six-Pay Direct Bill Plan that the named insured asks for under this schedule, and only for such a move,
      the scheduled premium not yet invoiced, less the switch down payment the move took, is spread again in equal shares over the installments not yet invoiced, which keep their due dates, the last absorbing
      any rounding difference; that respread installment premium is what every later invoice of the moved plan bills as its installment premium under the base installment schedule, the first invoice after
      the move carries the fee this schedule sets and every later invoice carries the new plan's installment fee; on any other switch, a plan the returned-draft or certified-funds rules move to the Six-Pay
      Direct Bill Plan included, unbilled installments keep their amounts and due dates and invoices issued after the switch carry the new plan's installment fee.
  - base_policy: billing_installment_schedule
    superseded_clause: Each invoice is issued invoice_lead_days calendar days before its due date and bills the installment premium, the plan's installment fee and every past-due amount still unpaid; its
      minimum_due is their sum.
    replaced_by: For the first invoice after an owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the named insured's request, and only for that invoice, the invoice is issued on
      the move's day and bills what this schedule states; a draft notice on a plan billing an Owner Auto Policy term is issued and billed as its own schedule states; any other invoice, a later invoice of
      a moved plan included, is issued invoice_lead_days calendar days before its due date and bills the installment premium, the plan's installment fee with that certificate filing fee, and every past-due
      amount still unpaid, its minimum_due being their sum.
  - base_policy: billing_installment_fee_rule
    superseded_clause: Each installment invoice carries the plan's installment_fee, charged on the invoice date.
    replaced_by: The first invoice after an owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the named insured's request, and only that invoice, carries the installment fee the
      state fee schedule below sets, together with the certificate filing fee this schedule bills, charged on the invoice date; a draft notice on a plan billing an Owner Auto Policy term carries the fee
      its own schedule sets; any other installment invoice, a later invoice of a moved plan included, carries the plan's installment_fee unadjusted together with the unbilled filing fee of the certificate
      recorded first on the term the plan bills, which the filing charter bills on the backing term's plan, charged on the invoice date.
  - base_policy: billing_returned_payments
    superseded_clause: A customer may also revoke a recurring authorization at any time; the plan then becomes the Six-Pay Direct Bill Plan for its remaining installments.
    replaced_by: When the named insured of an Owner Auto Policy term billed by automatic draft asks to stop the drafts while at least one installment has been invoiced and two or more are not yet invoiced,
      and neither the installment invoice that the payment most recently returned on it had paid nor its next installment invoice, if already issued, has two or more payments posted against it (a payment
      recorded against an invoice not counting when it is the returned payment itself or a makeup referencing it), and the owner term backs at most one certificate, and only then, the revocation is recorded
      with the move this schedule sets, once its waits are met; any other customer may revoke a recurring authorization at any time, the plan then becoming the Six-Pay Direct Bill Plan for its remaining
      installments.
  - base_policy: billing_installment_fee_rule
    superseded_clause: After a mid-term plan switch, invoices issued from the switch date carry the new plan's fee; invoices already issued keep theirs.
    replaced_by: For the first invoice after an owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the named insured's request, and only for that invoice, the fee is the one the
      state fee schedule below sets; after any other mid-term plan switch, and on every later invoice of a moved plan, invoices issued from the switch date carry the new plan's fee, and invoices already
      issued keep theirs.
  trigger: on_request
  subject:
  - billing_plan_switched
  - billing_installment_billed
  - billing_recurring_payment_revoked
  computes: minimum_due
  target_tool: switch_to_direct_bill_b1ddc0c4
  params:
    switch_spread_min: 100.0
    direct_bill_installment_fee: 9.0
    fl_direct_bill_fee: 6.0
    ga_tx_direct_bill_fee: 7.5
    fr44_first_bill_advance_pct: 10.0
    sr22_first_bill_advance_pct: 5.0
  rule: 'When the named insured of an Owner Auto Policy term billed on the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan asks to stop the automatic drafts and pay by bill,
    and the move falls when at least one installment has been invoiced and two or more are not yet invoiced, and neither the installment invoice that the payment most recently returned on it had paid nor
    its next installment invoice, if already issued, has two or more payments posted against it (a payment recorded against an invoice not counting when it is the returned payment itself or a makeup referencing
    it), and the owner term backs at most one certificate, the representative moves the plan to the Cardinal Point Six-Pay Direct Bill Plan, records the named insured''s revocation of the plan''s recurring
    payment authorization, and issues the plan''s first invoice after the move on the move''s day for the first installment not yet invoiced, keeping that installment''s due date. A plan is moved off automatic
    draft only after the installment invoice that the payment most recently returned on it had paid is paid again in full. The first invoice after the move is figured only after the plan carries the switch
    down payment the move requires, a payment recorded toward the first installment not yet invoiced and linked to no invoice. When the move is asked on any other plan or outside these limits, this schedule
    and neither wait above apply: the revocation is recorded under the base rule, the plan becomes the Six-Pay Direct Bill Plan for its remaining installments, and its next invoice bills, as the base installment
    schedule states, that installment''s scheduled premium unchanged, the Six-Pay Direct Bill Plan''s installment_fee (direct_bill_installment_fee) together with the certificate filing fee the standard
    first invoice bills, and the standing balance, an unpaid earlier amount added and a credit subtracted, its minimum due never below zero. On a non-owner plan that base figure reads the non-owner term''s
    own policy fee, filing fees and additional premium, and a plan with no installment left to invoice, the Paid-in-Full Plan included, has no next installment invoice, so this schedule sets no figure for
    it (0.00). When the term the plan bills backs two or more certificates while the customer also holds a certificate on another term, the records do not show which of the set-up day''s filing fees the
    plan took, so that next invoice''s scheduled premium rests on the down payment premium the base down payment rule sets (term_premium_billed times the plan''s down_payment_pct_new_business for the first
    term of the policy number it bills, or its down_payment_pct_renewal for a later term, divided by 100 and rounded half up to the cent) for a plan enrolled on its present plan, and, for a plan switched
    onto it from another, on the scheduled installment premium recorded on its installment 1 invoice or, while no installment 1 invoice exists, on the base down payment rule''s figure for its present plan.
    For a move of a plan billing an Owner Auto Policy term off automatic draft to the Six-Pay Direct Bill Plan that the named insured asks for under this schedule, and only for such a move, the scheduled
    premium not yet invoiced, less the switch down payment the move took, is spread again in equal shares over the installments not yet invoiced, which keep their due dates, the last absorbing any rounding
    difference; that respread installment premium is what every later invoice of the moved plan bills as its installment premium under the base installment schedule, the first invoice after the move carries
    the fee this schedule sets and every later invoice carries the new plan''s installment fee; on any other switch, a plan the returned-draft or certified-funds rules move to the Six-Pay Direct Bill Plan
    included, unbilled installments keep their amounts and due dates and invoices issued after the switch carry the new plan''s installment fee. For the first invoice after an owner plan is moved off automatic
    draft to the Six-Pay Direct Bill Plan at the named insured''s request, and only for that invoice, the invoice is issued on the move''s day and bills what this schedule states; a draft notice on a plan
    billing an Owner Auto Policy term is issued and billed as its own schedule states; any other invoice, a later invoice of a moved plan included, is issued invoice_lead_days calendar days before its due
    date and bills the installment premium, the plan''s installment fee with that certificate filing fee, and every past-due amount still unpaid, its minimum_due being their sum. The first invoice after
    an owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the named insured''s request, and only that invoice, carries the installment fee the state fee schedule below sets, together
    with the certificate filing fee this schedule bills, charged on the invoice date; a draft notice on a plan billing an Owner Auto Policy term carries the fee its own schedule sets; any other installment
    invoice, a later invoice of a moved plan included, carries the plan''s installment_fee unadjusted together with the unbilled filing fee of the certificate recorded first on the term the plan bills,
    which the filing charter bills on the backing term''s plan, charged on the invoice date. For the first invoice after an owner plan is moved off automatic draft to the Six-Pay Direct Bill Plan at the
    named insured''s request, and only for that invoice, the fee is the one the state fee schedule below sets; after any other mid-term plan switch, and on every later invoice of a moved plan, invoices
    issued from the switch date carry the new plan''s fee, and invoices already issued keep theirs. When the named insured of an Owner Auto Policy term billed by automatic draft asks to stop the drafts
    while at least one installment has been invoiced and two or more are not yet invoiced, and neither the installment invoice that the payment most recently returned on it had paid nor its next installment
    invoice, if already issued, has two or more payments posted against it (a payment recorded against an invoice not counting when it is the returned payment itself or a makeup referencing it), and the
    owner term backs at most one certificate, and only then, the revocation is recorded with the move this schedule sets, once its waits are met; any other customer may revoke a recurring authorization
    at any time, the plan then becoming the Six-Pay Direct Bill Plan for its remaining installments. For the first invoice after the move, the installments left are installment_count less the installment
    invoices already issued on the plan, the first invoice''s own installment included; the premium left on the old schedule is term_premium_billed less the old schedule''s down payment premium (the plan''s
    down_payment_amount less the fully earned fees it took (the policy fee booked on the owner term and every filing fee the filing ledger shows assessed on the day the plan was set up for a certificate
    whose backing term is the owner term, whatever its present status, every filing fee of the customer''s assessed that day when every certificate the customer holds rests on that term)) and less the old
    schedule''s installment premium (term_premium_billed less that down payment premium, divided by installment_count and rounded half up to the cent) once for each installment already invoiced. The switch
    down payment the move took is every payment recorded on the plan toward the first installment not yet invoiced and linked to no invoice. The endorsement premium left to bill is every additional premium
    transaction booked on the owner term billed, less the premium the plan''s installment invoices have billed beyond the old schedule''s installment premium for each of them. The plan''s standing balance
    at the move is its account_balance less the premium left on the old schedule and less the endorsement premium left to bill, plus the switch down payment the move took; a positive standing balance is
    an amount billed earlier and still unpaid, a negative one a credit the plan holds. The standard first invoice after the move bills the respread installment premium (the premium left on the old schedule
    less the switch down payment the move took, divided by the installments left and rounded half up to the cent) with the Six-Pay Direct Bill Plan''s installment_fee (direct_bill_installment_fee) and the
    filing fee recorded on the filing ledger for the certificate recorded first on the owner term billed, whatever its present status, when that fee was assessed after the plan''s latest installment invoice
    was issued and has not been reversed (a fee assessed on the day an invoice is issued being billed on that invoice), and carries the standing balance, an unpaid earlier amount added and a credit subtracted;
    its minimum due is their sum, never less than zero, rounded half up to the cent. No installment fee is charged on an invoice whose installment was avoided by paying the whole balance before it was invoiced
    (the plan''s account_balance at the invoice is zero or less): the installment fee every invoice this schedule figures would carry is then 0.00, any certificate filing fee still being billed. Where an
    invoice bills a certificate filing fee, it bills the unbilled filing fee of the certificate recorded first among the filings whose backing term is the term the plan bills (the earliest of those entries
    in the filing records, whatever its present status); when that term backs more than one certificate, the unbilled filing fee of any further certificate is not billed on that invoice and is referred
    to the filings desk. Each schedule below replaces or adds to one part of that standard first invoice, its premium, its installment fee or the amount carried onto it, and works from the standard figures
    alone, never from another schedule''s result, so the minimum due is the same in whatever order they are applied; what they add to its premium together never exceeds the endorsement premium left to bill.
    Endorsement premium on the first invoice after the move: when the endorsement premium left to bill is more than switch_spread_min and two or more installments are left, the first invoice adds to its
    premium an equal share of it, that premium divided by the installments left and rounded half up to the cent; when it is above zero and either at most switch_spread_min or only one installment is left,
    the first invoice adds all of it; when it is zero or less, nothing is added. Credit carried onto the first invoice after the move: when the plan holds a credit (a negative standing balance) larger than
    the respread installment premium plus direct_bill_installment_fee and two or more installments are left, the first invoice carries an equal share of the credit, the credit divided by the installments
    left and rounded half up to the cent, and the rest stays for the later invoices; when it holds such a credit and only one installment is left, the first invoice carries the credit up to that respread
    premium plus direct_bill_installment_fee, any rest being refunded when the plan closes; otherwise the first invoice carries the standing balance as the standard first invoice does. Installment fee by
    garaging state, under the company''s own filed state schedule for direct-bill installments (no statute sets it): the first invoice after an owner plan is moved to the Six-Pay Direct Bill Plan, when
    the term is garaged in Florida carries fl_direct_bill_fee as its installment fee; one whose term is garaged in Georgia or Texas carries ga_tx_direct_bill_fee; one whose term is garaged in Virginia,
    Ohio or Arizona carries the plan''s installment_fee (direct_bill_installment_fee). Endorsement premium billed ahead on the first invoice after the move by the certificate the term backs, under the company''s
    own filed percentages: when the owner term billed is written to back an FR-44 certificate (its financial_responsibility_filing is fr44), the first invoice adds to its premium fr44_first_bill_advance_pct
    percent of the endorsement premium left to bill; when it is written to back an SR-22 certificate (its financial_responsibility_filing is sr22), sr22_first_bill_advance_pct percent; when it backs no
    certificate, nothing. Apart from the old schedule''s figures, only the shares, the advance and the minimum due are rounded, each half up to the cent.'
  prerequisite:
  - problem: billing_ext_returned_draft_makeup
    kind: value_input
    gate: sw_standing
    form: state
    policy_source: A plan is moved off automatic draft only after the installment invoice that the payment most recently returned on it had paid is paid again in full.
    condition: the installment invoice that the most recently returned payment on the plan had paid has payments posted against it, net of returned payments, at least equal to its minimum_due
    resolved_by: authorize_makeup_payment_1af63ac0
    effect: the makeup posts against that invoice, settles it and the fees standing with it and carries an advance, so sw_standing turns from the unpaid amount into a credit and the amount carried onto
      the first invoice changes
  - problem: billing_ext_switch_down_payment
    kind: value_input
    gate: sw_down_paid
    form: state
    policy_source: The first invoice after the move is figured only after the plan carries the switch down payment the move requires, a payment recorded toward the first installment not yet invoiced and
      linked to no invoice.
    condition: a billing_payment_received row whose installment_number is the first installment not yet invoiced on the plan and whose related_invoice_id is empty stands on the plan
    resolved_by: authorize_switch_down_payment_5d76e7dc
    effect: sw_down_paid rises from 0.00 to the switch down payment, so the respread installment premium falls by its share over the installments left
  cross_category:
  - category: auto
    as: history
    reads:
    - garaging_state
    - financial_responsibility_filing
    - auto_premium_transactions.amount
    - term_number
    note: The owner term billed decides the old schedule, the state fee and, by the certificate it backs, the endorsement premium billed ahead; its additional premium is the endorsement premium the first
      invoice bills.
  - category: fr
    as: history
    reads:
    - auto_policy_id
    - fr_filing_transactions.amount
    - fr_filing_transactions.posted_date
    - nonowner_policy_id
    note: The filing fee ledger of the certificate filed on the owner term gives the recorded fee and whether it is still to be billed.
  - category: nonowner
    as: history
    reads:
    - nonowner_premium_transactions.amount
    - term_number
    note: On a non-owner plan the base fallback reads the non-owner term's policy fee and additional premium.
  compute:
  - sw_issued: COUNT('billing_invoices', event_type='billing_installment_billed')
  - sw_left: P('installment_count') - sw_issued
  - sw_old_down: (RND(F('term_premium_billed') * (P('down_payment_pct_new_business') if (CFIELD('auto','term_number', auto_policy_id=F('auto_policy_id')) if (F('auto_policy_id') != None and F('auto_policy_id')
      != '') else CFIELD('nonowner','term_number', nonowner_policy_id=F('nonowner_policy_id'))) == 1 else P('down_payment_pct_renewal')) / 100, 2) if (F('plan_switches_used') or 0) == 0 else ((RND(F('term_premium_billed')
      - LATEST('billing_invoices','premium_amount', date_field='invoice_date', event_type='billing_installment_billed', installment_number=1) * P('installment_count'), 2)) if LATEST('billing_invoices','premium_amount',
      date_field='invoice_date', event_type='billing_installment_billed', installment_number=1) != None else RND(F('term_premium_billed') * (P('down_payment_pct_new_business') if (CFIELD('auto','term_number',
      auto_policy_id=F('auto_policy_id')) if (F('auto_policy_id') != None and F('auto_policy_id') != '') else CFIELD('nonowner','term_number', nonowner_policy_id=F('nonowner_policy_id'))) == 1 else P('down_payment_pct_renewal'))
      / 100, 2))) if (((XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) >= 2 and XCOUNT('fr','fr_filings') > XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')))) if (F('auto_policy_id')
      != None and F('auto_policy_id') != '') else (XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id')) >= 2 and XCOUNT('fr','fr_filings') > XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id'))))
      else ((RND(F('down_payment_amount') - XSUM('auto','auto_premium_transactions','amount', event_type='auto_policy_fee', auto_policy_id=F('auto_policy_id')) - (0 if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id'))
      == 0 else (XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date')) if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) == XCOUNT('fr','fr_filings')
      else ((XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date'), fr_filing_id=CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))))
      if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) == 1 else 0))), 2)) if (F('auto_policy_id') != None and F('auto_policy_id') != '') else RND(F('down_payment_amount') - XSUM('nonowner','nonowner_premium_transactions','amount',
      event_type='nonowner_policy_fee', nonowner_policy_id=F('nonowner_policy_id')) - (0 if XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id')) == 0 else (XSUM('fr','fr_filing_transactions','amount',
      event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date')) if XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id')) == XCOUNT('fr','fr_filings') else ((XSUM('fr','fr_filing_transactions','amount',
      event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date'), fr_filing_id=CFIELD('fr','fr_filing_id', nonowner_policy_id=F('nonowner_policy_id')))) if XCOUNT('fr','fr_filings', nonowner_policy_id=F('nonowner_policy_id'))
      == 1 else 0))), 2))
  - sw_old_sched: RND((F('term_premium_billed') - sw_old_down) / P('installment_count'), 2) if P('installment_count') > 0 else 0
  - sw_left_premium: RND(F('term_premium_billed') - sw_old_down - sw_old_sched * sw_issued, 2)
  - sw_down_paid: SUM('billing_transactions','amount', event_type='billing_payment_received', installment_number=sw_issued + 1, related_invoice_id=None)
  - sw_respread: (RND((sw_left_premium - sw_down_paid) / sw_left, 2)) if sw_left > 0 else 0
  - sw_end_left: RND((XSUM('auto','auto_premium_transactions','amount', event_type='auto_additional_premium', auto_policy_id=F('auto_policy_id')) if (F('auto_policy_id') != None and F('auto_policy_id')
      != '') else XSUM('nonowner','nonowner_premium_transactions','amount', event_type='nonowner_additional_premium', nonowner_policy_id=F('nonowner_policy_id'))) - (SUM('billing_invoices','premium_amount',
      event_type='billing_installment_billed') - sw_old_sched * sw_issued), 2)
  - sw_standing: RND(F('account_balance') - sw_left_premium - sw_end_left + sw_down_paid, 2)
  - sw_end_bal: RND(XSUM('auto','auto_premium_transactions','amount', event_type='auto_additional_premium', auto_policy_id=F('auto_policy_id')) - (SUM('billing_invoices','premium_amount', event_type='billing_installment_billed')
      - sw_old_sched * COUNT('billing_invoices', event_type='billing_installment_billed')), 2)
  - sw_end_share: RND(sw_end_bal / sw_left, 2) if (sw_end_bal > K('switch_spread_min') and sw_left >= 2) else (sw_end_bal if (sw_end_bal > 0 and (sw_end_bal <= K('switch_spread_min') or sw_left == 1)) else
      0)
  - sw_credit: MX(0, RND(sw_left_premium + sw_end_left - SUM('billing_transactions','amount', event_type='billing_payment_received', installment_number=COUNT('billing_invoices', event_type='billing_installment_billed')
      + 1, related_invoice_id=None) - F('account_balance'), 2))
  - sw_credit_left: P('installment_count') - COUNT('billing_invoices', event_type='billing_installment_billed')
  - sw_carried: (0 - RND(sw_credit / sw_credit_left, 2)) if (sw_credit > sw_respread + K('direct_bill_installment_fee') and sw_credit_left >= 2) else ((0 - MN(sw_credit, sw_respread + K('direct_bill_installment_fee')))
      if (sw_credit > sw_respread + K('direct_bill_installment_fee') and sw_credit_left == 1) else sw_standing)
  - sw_state: CFIELD('auto','garaging_state', auto_policy_id=F('auto_policy_id'))
  - sw_fee: 0 if F('account_balance') <= 0 else (K('fl_direct_bill_fee') if sw_state == 'FL' else (K('ga_tx_direct_bill_fee') if (sw_state == 'GA' or sw_state == 'TX') else K('direct_bill_installment_fee')))
  - sw_cert_date: XLATEST('fr','fr_filing_transactions','posted_date', date_field='posted_date', event_type='fr_filing_fee_assessed', fr_filing_id=(CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))
      if (F('auto_policy_id') != None and F('auto_policy_id') != '') else CFIELD('fr','fr_filing_id', nonowner_policy_id=F('nonowner_policy_id'))))
  - sw_cert_reversed: XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_waived', fr_filing_id=(CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id')) if (F('auto_policy_id')
      != None and F('auto_policy_id') != '') else CFIELD('fr','fr_filing_id', nonowner_policy_id=F('nonowner_policy_id'))))
  - sw_cert_last_bill: LATEST('billing_invoices','invoice_date', date_field='invoice_date', event_type='billing_installment_billed') if LATEST('billing_invoices','invoice_date', date_field='invoice_date',
      event_type='billing_installment_billed') != None else F('enrolled_date')
  - sw_cert_unbilled: sw_cert_date != None and sw_cert_reversed == 0 and DAYS(sw_cert_last_bill, sw_cert_date) > 0
  - sw_cert_fee: (XLATEST('fr','fr_filing_transactions','amount', date_field='posted_date', event_type='fr_filing_fee_assessed', fr_filing_id=(CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))
      if (F('auto_policy_id') != None and F('auto_policy_id') != '') else CFIELD('fr','fr_filing_id', nonowner_policy_id=F('nonowner_policy_id')))) or 0) if sw_cert_unbilled else 0
  - sw_filer_stamp: CFIELD('auto','financial_responsibility_filing', auto_policy_id=F('auto_policy_id'))
  - sw_filer_pct: K('fr44_first_bill_advance_pct') if sw_filer_stamp == 'fr44' else (K('sr22_first_bill_advance_pct') if sw_filer_stamp == 'sr22' else 0)
  - sw_premium: RND(sw_respread + MN(MX(0, sw_end_left), sw_end_share + RND(MX(0, sw_end_left) * sw_filer_pct / 100, 2)), 2)
  - sw_fee_total: RND(sw_fee + sw_cert_fee, 2)
  - sw_ret_payment: LATEST('billing_transactions','related_payment_txn_id', date_field='posted_date', event_type='billing_payment_returned')
  - sw_ret_invoice: None if sw_ret_payment == None else LATEST('billing_transactions','related_invoice_id', date_field='posted_date', billing_txn_id=sw_ret_payment)
  - sw_ret_next: None if sw_ret_invoice == None else LATEST('billing_invoices','billing_invoice_id', date_field='invoice_date', event_type='billing_installment_billed', installment_number=(LATEST('billing_invoices','installment_number',
      date_field='invoice_date', billing_invoice_id=sw_ret_invoice) or 0) + 1)
  - sw_pay_ok: (sw_ret_invoice == None or COUNT('billing_transactions', event_type='billing_payment_received', related_invoice_id=sw_ret_invoice) - COUNT('billing_transactions', event_type='billing_payment_received',
      related_invoice_id=sw_ret_invoice, related_payment_txn_id=sw_ret_payment) <= 1) and (sw_ret_next == None or COUNT('billing_transactions', event_type='billing_payment_received', related_invoice_id=sw_ret_next)
      <= 1)
  - sw_scope_ok: (F('variant_name') == 'Cardinal Point Monthly EFT Plan' or F('variant_name') == 'Cardinal Point Monthly Card Autopay Plan') and (F('auto_policy_id') != None and F('auto_policy_id') != '')
      and sw_issued >= 1 and sw_left >= 2 and sw_pay_ok and XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) <= 1
  - sw_base_sched: RND(F('term_premium_billed') - sw_old_down - sw_old_sched * (P('installment_count') - 1), 2) if sw_left == 1 else sw_old_sched
  - result: (RND(MX(0, sw_premium + sw_fee_total + sw_carried), 2)) if sw_scope_ok else (0 if (sw_left <= 0 or P('installment_count') == 0) else RND(MX(0, sw_base_sched + (0 if F('account_balance') <= 0
      else K('direct_bill_installment_fee')) + sw_cert_fee + sw_standing), 2))
  compute_basis:
    sw_issued: For the first invoice after the move, the installments left are installment_count less the installment invoices already issued on the plan, the first invoice's own installment included; the
      premium left on the old schedule is term_premium_billed less the old schedule's down payment premium (the plan's down_payment_amount less the fully earned fees it took (the policy fee booked on the
      owner term and every filing fee the filing ledger shows assessed on the day the plan was set up for a certificate whose backing term is the owner term, whatever its present status, every filing fee
      of the customer's assessed that day when every certificate the customer holds rests on that term)) and less the old schedule's installment premium (term_premium_billed less that down payment premium,
      divided by installment_count and rounded half up to the cent) once for each installment already invoiced.
    sw_left: For the first invoice after the move, the installments left are installment_count less the installment invoices already issued on the plan, the first invoice's own installment included; the
      premium left on the old schedule is term_premium_billed less the old schedule's down payment premium (the plan's down_payment_amount less the fully earned fees it took (the policy fee booked on the
      owner term and every filing fee the filing ledger shows assessed on the day the plan was set up for a certificate whose backing term is the owner term, whatever its present status, every filing fee
      of the customer's assessed that day when every certificate the customer holds rests on that term)) and less the old schedule's installment premium (term_premium_billed less that down payment premium,
      divided by installment_count and rounded half up to the cent) once for each installment already invoiced.
