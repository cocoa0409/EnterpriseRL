      or a makeup referencing it), and the owner term backs at most one certificate, the representative moves the plan to the Cardinal Point Six-Pay Direct Bill Plan, records the named insured's revocation
      of the plan's recurring payment authorization, and issues the plan's first invoice after the move on the move's day for the first installment not yet invoiced, keeping that installment's due date.
    sw_base_sched: 'When the move is asked on any other plan or outside these limits, this schedule and neither wait above apply: the revocation is recorded under the base rule, the plan becomes the Six-Pay
      Direct Bill Plan for its remaining installments, and its next invoice bills, as the base installment schedule states, that installment''s scheduled premium unchanged, the Six-Pay Direct Bill Plan''s
      installment_fee (direct_bill_installment_fee) together with the certificate filing fee the standard first invoice bills, and the standing balance, an unpaid earlier amount added and a credit subtracted,
      its minimum due never below zero. On a non-owner plan that base figure reads the non-owner term''s own policy fee, filing fees and additional premium, and a plan with no installment left to invoice,
      the Paid-in-Full Plan included, has no next installment invoice, so this schedule sets no figure for it (0.00). When the term the plan bills backs two or more certificates while the customer also
      holds a certificate on another term, the records do not show which of the set-up day''s filing fees the plan took, so that next invoice''s scheduled premium rests on the down payment premium the base
      down payment rule sets (term_premium_billed times the plan''s down_payment_pct_new_business for the first term of the policy number it bills, or its down_payment_pct_renewal for a later term, divided
      by 100 and rounded half up to the cent) for a plan enrolled on its present plan, and, for a plan switched onto it from another, on the scheduled installment premium recorded on its installment 1 invoice
      or, while no installment 1 invoice exists, on the base down payment rule''s figure for its present plan.'
  factors:
  - id: endorsement_respread_share
    effect: method
    decides: sw_end_share
    bindings:
    - sw_end_bal
    - sw_end_share
    ladder:
    - when: the endorsement premium left to bill is more than switch_spread_min and two or more installments are left
      method: add an equal share of it over the installments left
    - when: it is above zero and at most switch_spread_min, or only one installment is left
      method: add all of it
    - when: otherwise (no endorsement premium left to bill)
      method: add no endorsement premium
    baseline:
      sw_end_share: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: auto
  - id: switched_plan_credit_carry
    effect: method
    decides: sw_carried
    bindings:
    - sw_credit
    - sw_credit_left
    - sw_carried
    ladder:
    - when: a credit larger than the respread installment premium plus the plan fee, with two or more installments left
      method: carry an equal share of the credit over the installments left
    - when: such a credit with only one installment left
      method: carry the credit up to the respread premium plus the plan fee
    - when: otherwise (a smaller credit, an unpaid earlier amount, or nothing)
      method: carry the standing balance as the standard first invoice does
    baseline:
      sw_carried: sw_standing
    evidence:
    - history
  - id: direct_bill_state_fee
    effect: parameter
    decides: sw_fee
    bindings:
    - sw_state
    - sw_fee
    ladder:
    - when: the owner term billed is garaged in Florida
      value: K('fl_direct_bill_fee')
    - when: it is garaged in Georgia or Texas
      value: K('ga_tx_direct_bill_fee')
    - when: otherwise (Virginia, Ohio or Arizona)
      value: K('direct_bill_installment_fee')
    baseline:
      sw_fee: K('direct_bill_installment_fee')
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: filer_first_bill_advance
    effect: parameter
    decides: sw_filer_pct
    bindings:
    - sw_filer_stamp
    - sw_filer_pct
    ladder:
    - when: the owner term billed backs an FR-44 certificate (financial_responsibility_filing fr44)
      value: K('fr44_first_bill_advance_pct')
    - when: it backs an SR-22 certificate (financial_responsibility_filing sr22)
      value: K('sr22_first_bill_advance_pct')
    - when: otherwise (financial_responsibility_filing none)
      value: '0'
    baseline:
      sw_filer_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  baseline:
    rule: For the first invoice after the move, the installments left are installment_count less the installment invoices already issued on the plan, the first invoice's own installment included; the premium
      left on the old schedule is term_premium_billed less the old schedule's down payment premium (the plan's down_payment_amount less the fully earned fees it took (the policy fee booked on the owner
      term and every filing fee the filing ledger shows assessed on the day the plan was set up for a certificate whose backing term is the owner term, whatever its present status, every filing fee of the
      customer's assessed that day when every certificate the customer holds rests on that term)) and less the old schedule's installment premium (term_premium_billed less that down payment premium, divided
      by installment_count and rounded half up to the cent) once for each installment already invoiced. The switch down payment the move took is every payment recorded on the plan toward the first installment
      not yet invoiced and linked to no invoice. The endorsement premium left to bill is every additional premium transaction booked on the owner term billed, less the premium the plan's installment invoices
      have billed beyond the old schedule's installment premium for each of them. The plan's standing balance at the move is its account_balance less the premium left on the old schedule and less the endorsement
      premium left to bill, plus the switch down payment the move took; a positive standing balance is an amount billed earlier and still unpaid, a negative one a credit the plan holds. The standard first
      invoice after the move bills the respread installment premium (the premium left on the old schedule less the switch down payment the move took, divided by the installments left and rounded half up
      to the cent) with the Six-Pay Direct Bill Plan's installment_fee (direct_bill_installment_fee) and the filing fee recorded on the filing ledger for the certificate recorded first on the owner term
      billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued and has not been reversed (a fee assessed on the day an invoice is issued being
      billed on that invoice), and carries the standing balance, an unpaid earlier amount added and a credit subtracted; its minimum due is their sum, never less than zero, rounded half up to the cent.
      Where an invoice bills a certificate filing fee, it bills the unbilled filing fee of the certificate recorded first among the filings whose backing term is the term the plan bills (the earliest of
      those entries in the filing records, whatever its present status); when that term backs more than one certificate, the unbilled filing fee of any further certificate is not billed on that invoice
      and is referred to the filings desk.
    params:
    - installment_count
    - direct_bill_installment_fee
    - down_payment_pct_new_business
    - down_payment_pct_renewal
  inputs:
    history:
    - table: billing_invoices
      aggregate: sum
      field: premium_amount
      filters:
        event_type: billing_installment_billed
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_payment_received
    - category: auto
      table: auto_premium_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: auto_additional_premium
    - category: fr
      table: fr_filing_transactions
      aggregate: latest
      field: posted_date
      filters:
        event_type: fr_filing_fee_assessed
    cross_category:
    - auto
    - fr
    - nonowner
