  compute:
  - dn_issued: COUNT('billing_invoices', event_type='billing_installment_billed')
  - dn_first_term: CFIELD('auto','term_number', auto_policy_id=F('auto_policy_id')) == 1
  - dn_down_premium: RND(F('down_payment_amount') - XSUM('auto','auto_premium_transactions','amount', event_type='auto_policy_fee', auto_policy_id=F('auto_policy_id')) - (0 if XCOUNT('fr','fr_filings',
      auto_policy_id=F('auto_policy_id')) == 0 else (XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date')) if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id'))
      == XCOUNT('fr','fr_filings') else ((XSUM('fr','fr_filing_transactions','amount', event_type='fr_filing_fee_assessed', posted_date=F('enrolled_date'), fr_filing_id=CFIELD('fr','fr_filing_id', auto_policy_id=F('auto_policy_id'))))
      if XCOUNT('fr','fr_filings', auto_policy_id=F('auto_policy_id')) == 1 else 0))), 2)
  - dn_sched: (RND((F('term_premium_billed') - dn_down_premium) / P('installment_count'), 2)) if P('installment_count') > 0 else 0
  - dn_unbilled: RND(F('term_premium_billed') - dn_down_premium - dn_sched * dn_issued, 2)
  - dn_base_pct: K('direct_bill_down_pct_new') if dn_first_term else K('direct_bill_down_pct_renewal')
  - dn_basis_invoiced: COUNT('billing_invoices', event_type='billing_installment_billed')
  - dn_qty: dn_unbilled if (dn_basis_invoiced >= 1 and P('installment_count') - dn_basis_invoiced >= 2) else (0 if P('installment_count') - dn_basis_invoiced == 1 else F('term_premium_billed'))
  - dn_offset: 0 if (dn_basis_invoiced >= 1 and P('installment_count') - dn_basis_invoiced >= 2) else (0 if P('installment_count') - dn_basis_invoiced == 1 else dn_down_premium)
  - dn_last_return: LATEST('billing_transactions','posted_date', date_field='posted_date', event_type='billing_payment_returned')
  - dn_returns_12m: COUNT('billing_transactions', within_months=12, date_field='posted_date', event_type='billing_payment_returned')
  - dn_return_pct: K('returned_recent_pct') if (dn_last_return != None and DAYS(dn_last_return, NOW) <= 90) else (K('returned_older_pct') if dn_returns_12m >= 1 else 0)
  - dn_points: CFIELD('auto','violation_points', auto_policy_id=F('auto_policy_id'))
  - dn_points_pct: K('points_high_pct') if int(dn_points or 0) >= 8 else (K('points_mid_pct') if int(dn_points or 0) >= 4 else 0)
