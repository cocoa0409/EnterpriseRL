  factors:
  - id: returned_payment_recollection
    effect: method
    decides: recollect
    bindings:
    - recollect_invoice_min
    - recollect
    ladder:
    - when: the returned payment had paid more than its invoice's minimum due
      method: 're-collect only what that invoice still owes: its minimum due less the payments posted against it plus the returned amount'
    - when: the returned payment had paid no installment invoice
      method: re-collect nothing for it
    - when: otherwise
      method: re-collect the returned amount
    baseline:
      recollect: mk_returned_amount
    evidence:
    - history
    cross_difficulty: null
  - id: undraftable_account_advance
    effect: method
    decides: advance_core
    bindings:
    - adv_auth
    - adv_reason
    - adv_inst
    - adv_down
    - adv_sched
    - adv_next_sched
    - adv_next_invoice
    - advance_core
    ladder:
    - when: the plan still bills by automatic draft, the returned payment is coded account_closed or stop_payment_by_payer and the next installment remains but is not yet invoiced
      method: add the next installment's scheduled premium
    - when: the plan still bills by automatic draft, the return is so coded and the next installment is already invoiced
      method: add that invoice's minimum due less the payment posted against it, if any, plus every amount returned against that payment
    - when: otherwise (the plan no longer bills by automatic draft, any other return reason, the returned payment paid no installment invoice, or no installment remains)
      method: add no advance
    baseline:
      advance_core: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: auto
  - id: filing_status_advance
    effect: parameter
    decides: filer_pct
    bindings:
    - filer_stamp
    - filer_pct
    ladder:
    - when: the owner term billed is written to back an FR-44 certificate (financial_responsibility_filing fr44)
      value: K('fr44_advance_pct')
    - when: the owner term billed is written to back an SR-22 certificate (financial_responsibility_filing sr22)
      value: K('sr22_advance_pct')
    - when: otherwise (financial_responsibility_filing none)
      value: '0'
    baseline:
      filer_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: payment_plan_advance
    effect: parameter
    decides: plan_pct
    bindings:
    - plan_auth
    - plan_pct
    ladder:
    - when: the plan is an installment plan billed directly (no authorization in force)
      value: K('direct_bill_advance_pct')
    - when: the plan bills by automatic draft (authorizations outnumber revocations) and installment_count above zero
      value: K('autopay_advance_pct')
    - when: otherwise (the Paid-in-Full Plan)
      value: '0'
    baseline:
      plan_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: returned_amount_advance
    effect: parameter
    decides: size_pct
    bindings:
    - size_amount
    - size_pct
    ladder:
    - when: the returned amount is at least large_return_min
      value: K('large_return_advance_pct')
    - when: it is at least mid_return_min but less than large_return_min
      value: K('mid_return_advance_pct')
    - when: otherwise (less than mid_return_min)
      value: '0'
    baseline:
      size_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The returned payment is the one most recently returned on the plan (of two returns posted the same day, the one recorded first), its returned amount the total returned against it; its invoice
      is the installment invoice that payment had paid. The fees owed with it are every NSF fee posted for the returned payment and every late fee posted for its invoice, less every waiver that reverses
      one of those fees. The standard makeup payment is the returned amount plus the fees owed with it; a makeup payment is never more than the plan's account_balance.
    params: []
  inputs:
    history:
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_nsf_fee
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_late_fee
    - table: billing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: billing_fee_waived
    cross_category:
    - auto
    - fr
- id: billing_ext_switch_down_payment
  base_policy_refs:
  - billing_payment_posting
  - billing_agg_returned_payments
  - billing_plan_switch
  overwrite:
  - base_policy: billing_payment_posting
    superseded_clause: The customer personally authorizes each one-time payment taken by a representative, stating the card or bank account to be charged and the amount.
    replaced_by: For a switch down payment, and only for such a payment, the named insured authorizes the payment personally by running it with the representative, choosing the payment method and confirming
