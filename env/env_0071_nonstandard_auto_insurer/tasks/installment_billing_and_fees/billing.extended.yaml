  factors:
  - id: down_basis_by_invoicing_progress
    effect: method
    decides: dn_qty
    bindings:
    - dn_basis_invoiced
    - dn_qty
    - dn_offset
    ladder:
    - when: at least one installment invoiced and two or more not yet invoiced
      method: apply the percentage to the scheduled premium not yet invoiced, nothing taken off
    - when: only one installment not yet invoiced
      method: take no switch down payment
    - when: otherwise (no installment invoiced yet, or none left)
      method: 'refigure as if enrolled on the Six-Pay plan: the percentage of term_premium_billed less the plan''s own down payment premium'
    baseline:
      dn_qty: F('term_premium_billed')
      dn_offset: dn_down_premium
    evidence:
    - history
  - id: returned_payment_down_addition
    effect: parameter
    decides: dn_return_pct
    bindings:
    - dn_last_return
    - dn_returns_12m
    - dn_return_pct
    ladder:
    - when: the most recent return on the plan posted no more than 90 days before the move
      value: K('returned_recent_pct')
    - when: the most recent return posted more than 90 days before the move, with a return in the last twelve months
      value: K('returned_older_pct')
    - when: otherwise (no return in the last twelve months)
      value: '0'
    baseline:
      dn_return_pct: '0'
    evidence:
    - history
    - date
  - id: violation_points_down_addition
    effect: parameter
    decides: dn_points_pct
    bindings:
    - dn_points
    - dn_points_pct
    ladder:
    - when: the owner term billed carries 8 or more violation points
      value: K('points_high_pct')
    - when: it carries 4 to 7 violation points
      value: K('points_mid_pct')
    - when: otherwise (3 or fewer)
      value: '0'
    baseline:
      dn_points_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: liability_package_down_addition
    effect: parameter
    decides: dn_package_pct
    bindings:
    - dn_package
    - dn_package_pct
    ladder:
    - when: the owner term billed carries the Minimum Limits Liability package
      value: K('package_min_pct')
    - when: it carries the 50/100/50 Liability package
      value: K('package_low_pct')
    - when: otherwise (a higher package)
      value: '0'
    baseline:
      dn_package_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: garaging_state_down_addition
    effect: parameter
    decides: dn_state_pct
    bindings:
    - dn_state
    - dn_state_pct
    ladder:
    - when: the owner term billed is garaged in Florida
      value: K('state_fl_pct')
    - when: it is garaged in Georgia or Texas
      value: K('state_ga_tx_pct')
    - when: otherwise (Virginia, Ohio or Arizona)
      value: '0'
    baseline:
      dn_state_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
