      fee of the customer's assessed that day when every certificate the customer holds rests on that term)) and less the old schedule's installment premium (term_premium_billed less that down payment premium,
      divided by installment_count and rounded half up to the cent) once for each installment already invoiced.
    sw_old_sched: For the first invoice after the move, the installments left are installment_count less the installment invoices already issued on the plan, the first invoice's own installment included;
      the premium left on the old schedule is term_premium_billed less the old schedule's down payment premium (the plan's down_payment_amount less the fully earned fees it took (the policy fee booked on
      the owner term and every filing fee the filing ledger shows assessed on the day the plan was set up for a certificate whose backing term is the owner term, whatever its present status, every filing
      fee of the customer's assessed that day when every certificate the customer holds rests on that term)) and less the old schedule's installment premium (term_premium_billed less that down payment premium,
      divided by installment_count and rounded half up to the cent) once for each installment already invoiced.
    sw_left_premium: For the first invoice after the move, the installments left are installment_count less the installment invoices already issued on the plan, the first invoice's own installment included;
      the premium left on the old schedule is term_premium_billed less the old schedule's down payment premium (the plan's down_payment_amount less the fully earned fees it took (the policy fee booked on
      the owner term and every filing fee the filing ledger shows assessed on the day the plan was set up for a certificate whose backing term is the owner term, whatever its present status, every filing
      fee of the customer's assessed that day when every certificate the customer holds rests on that term)) and less the old schedule's installment premium (term_premium_billed less that down payment premium,
      divided by installment_count and rounded half up to the cent) once for each installment already invoiced.
    sw_down_paid: The switch down payment the move took is every payment recorded on the plan toward the first installment not yet invoiced and linked to no invoice.
    sw_respread: The standard first invoice after the move bills the respread installment premium (the premium left on the old schedule less the switch down payment the move took, divided by the installments
      left and rounded half up to the cent) with the Six-Pay Direct Bill Plan's installment_fee (direct_bill_installment_fee) and the filing fee recorded on the filing ledger for the certificate recorded
      first on the owner term billed, whatever its present status, when that fee was assessed after the plan's latest installment invoice was issued and has not been reversed (a fee assessed on the day
      an invoice is issued being billed on that invoice), and carries the standing balance, an unpaid earlier amount added and a credit subtracted; its minimum due is their sum, never less than zero, rounded
      half up to the cent.
    sw_end_left: The endorsement premium left to bill is every additional premium transaction booked on the owner term billed, less the premium the plan's installment invoices have billed beyond the old
      schedule's installment premium for each of them.
    sw_standing: The plan's standing balance at the move is its account_balance less the premium left on the old schedule and less the endorsement premium left to bill, plus the switch down payment the
      move took; a positive standing balance is an amount billed earlier and still unpaid, a negative one a credit the plan holds.
    sw_end_bal: 'Endorsement premium on the first invoice after the move: when the endorsement premium left to bill is more than switch_spread_min and two or more installments are left, the first invoice
      adds to its premium an equal share of it, that premium divided by the installments left and rounded half up to the cent; when it is above zero and either at most switch_spread_min or only one installment
      is left, the first invoice adds all of it; when it is zero or less, nothing is added.'
    sw_end_share: 'Endorsement premium on the first invoice after the move: when the endorsement premium left to bill is more than switch_spread_min and two or more installments are left, the first invoice
      adds to its premium an equal share of it, that premium divided by the installments left and rounded half up to the cent; when it is above zero and either at most switch_spread_min or only one installment
      is left, the first invoice adds all of it; when it is zero or less, nothing is added.'
    sw_credit: 'Credit carried onto the first invoice after the move: when the plan holds a credit (a negative standing balance) larger than the respread installment premium plus direct_bill_installment_fee
      and two or more installments are left, the first invoice carries an equal share of the credit, the credit divided by the installments left and rounded half up to the cent, and the rest stays for the
      later invoices; when it holds such a credit and only one installment is left, the first invoice carries the credit up to that respread premium plus direct_bill_installment_fee, any rest being refunded
      when the plan closes; otherwise the first invoice carries the standing balance as the standard first invoice does.'
    sw_carried: 'Credit carried onto the first invoice after the move: when the plan holds a credit (a negative standing balance) larger than the respread installment premium plus direct_bill_installment_fee
      and two or more installments are left, the first invoice carries an equal share of the credit, the credit divided by the installments left and rounded half up to the cent, and the rest stays for the
      later invoices; when it holds such a credit and only one installment is left, the first invoice carries the credit up to that respread premium plus direct_bill_installment_fee, any rest being refunded
      when the plan closes; otherwise the first invoice carries the standing balance as the standard first invoice does.'
