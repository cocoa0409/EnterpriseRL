      correlation_keys:
      - - billing_transactions.reversed_fee_txn_id
      action_bindings:
        billing_transactions.reversed_fee_txn_id: reversed_fee_txn_id
    dedup_contract:
      table: billing_transactions
      mode: separate_record
      object_bindings:
        reversed_fee_txn_id: reversed_fee_txn_id
      duplicate_filters:
        event_type:
        - billing_fee_waived
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Paid-in-Full Plan:
        courtesy_waivers: =courtesy_late_fee_waivers_per_term
      Cardinal Point Two-Pay Plan:
        courtesy_waivers: =courtesy_late_fee_waivers_per_term
      Cardinal Point Four-Pay Plan:
        courtesy_waivers: =courtesy_late_fee_waivers_per_term
      Cardinal Point Six-Pay Direct Bill Plan:
        courtesy_waivers: =courtesy_late_fee_waivers_per_term
      Cardinal Point Monthly EFT Plan:
        courtesy_waivers: =courtesy_late_fee_waivers_per_term
      Cardinal Point Monthly Card Autopay Plan:
        courtesy_waivers: =courtesy_late_fee_waivers_per_term
  measures:
  - billing_msr_courtesy_waivers_in_term
  - billing_msr_nsf_returns_lookback
- id: billing_returned_payments
  subject:
  - billing_payment_returned
  - billing_nsf_fee
  - billing_recurring_payment_revoked
  rule: A returned payment reverses the original payment for its full amount on the date the bank return
    posts, and the charges it had paid become unpaid again. An NSF fee is charged only for a returned
    payment whose return_reason is in nsf_fee_return_reasons. Only one NSF fee is charged per returned
    payment. The NSF fee is the plan's nsf_fee; returns coded bank_error or unauthorized_debit carry no
    fee. When billing_msr_returned_drafts_in_term reaches returned_drafts on a Monthly EFT or Monthly
    Card Autopay plan, the recurring authorization is revoked and the plan becomes the Cardinal Point
    Six-Pay Direct Bill Plan. A customer may also revoke a recurring authorization at any time; the plan
    then becomes the Six-Pay Direct Bill Plan for its remaining installments. A returned down payment
    closes the plan and voids the term.
  eligibility:
  - id: nsf_reason
    applies_to:
