      or a makeup referencing it), and the owner term backs at most one certificate, the representative moves the plan to the Cardinal Point Six-Pay Direct Bill Plan, records the named insured's revocation
      of the plan's recurring payment authorization, and issues the plan's first invoice after the move on the move's day for the first installment not yet invoiced, keeping that installment's due date.
    sw_ret_invoice: When the named insured of an Owner Auto Policy term billed on the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan asks to stop the automatic drafts and
      pay by bill, and the move falls when at least one installment has been invoiced and two or more are not yet invoiced, and neither the installment invoice that the payment most recently returned on
