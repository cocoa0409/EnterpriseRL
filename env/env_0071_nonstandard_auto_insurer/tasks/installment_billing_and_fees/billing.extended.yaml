      <= 1)
  - dn_scope_ok: (F('variant_name') == 'Cardinal Point Monthly EFT Plan' or F('variant_name') == 'Cardinal Point Monthly Card Autopay Plan') and (F('auto_policy_id') != None and F('auto_policy_id') != '')
