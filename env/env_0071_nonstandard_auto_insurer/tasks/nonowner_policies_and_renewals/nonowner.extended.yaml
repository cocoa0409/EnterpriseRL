        date on or before the cancellation effective date
      value: K('relief_requirement')
    - when: >-
        the request reason is replacement with other insurance AND no Operator certificate is on file
      value: K('relief_replaced')
    - when: otherwise
      value: '1.0'
    baseline:
      requirement_relief: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: fr
  - id: elapsed_term_scale
    effect: parameter
    decides: elapsed_term_scale
    bindings:
    - elapsed_share
    - elapsed_term_scale
    ladder:
    - when: under one quarter of the term's days run at the cancellation effective date
      value: K('scale_early')
    - when: one half or more of the term's days run
      value: K('scale_late')
    - when: otherwise (one quarter to under one half)
      value: '1.0'
    baseline:
      elapsed_term_scale: '1.0'
    evidence:
    - date
    cross_difficulty: null
  - id: term_origin_scale
    effect: parameter
    decides: term_origin_scale
    bindings:
    - term_origin_reason
    - term_origin_scale
    ladder:
    - when: a new-business term (latest premium-written entry reason new business)
      value: K('origin_new')
    - when: a renewal term (reason renewal) AND a lapse recorded on the term
      value: K('origin_late')
    - when: otherwise (renewal accepted on time, or no premium-written entry)
      value: '1.0'
    baseline:
      term_origin_scale: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: plan_retention_scale
    effect: parameter
    decides: plan_retention_scale
    bindings:
    - cancel_billing_plan
    - plan_retention_scale
    ladder:
    - when: the term is billed on the Cardinal Point Paid-in-Full Plan
      value: K('plan_pif')
    - when: on the Monthly EFT or Monthly Card Autopay Plan
      value: K('plan_autopay')
    - when: otherwise
      value: '1.0'
    baseline:
      plan_retention_scale: '1.0'
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: certificate_runoff
    effect: method
    decides: unearned_days
    bindings:
    - certificate_runoff
    - sent_certificate_end
    - unearned_days
    ladder:
    - when: the named insured has an Operator certificate on file
      method: >-
        the standard unearned days less the filing charter's SR-26 transmission days plus certificate run-off days
        for that certificate
    - when: the named insured's Operator certificate has had its SR-26 sent
      method: >-
        days from the later of the cancellation effective date and that certificate's end date to the expiration
        date
    - when: otherwise
      method: the standard unearned days
    baseline:
      unearned_days: standard_unearned_days
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: fr
  baseline:
    rule: >-
      The requested-cancellation unearned days run from the cancellation effective date to the term's expiration
      date, counting the cancellation effective date and not the expiration date; the cancellation effective date
      is the requested date on the signed request when that is on or after the date the request was received, and
      otherwise the received date. The requested-cancellation unearned premium is the premium written on the term
      multiplied by the requested-cancellation unearned days and divided by the days recorded on the latest premium-written
      entry (the term's days when that entry records none), plus the additional premium on the term multiplied by
      the same unearned days and divided by the days recorded on the latest additional-premium entry, less the earlier
      returns on the term multiplied by the same unearned days and divided by the days recorded on the latest return
      entry, each share being taken only where such entries exist; where two entries of a kind share the latest
      processing date, the one recorded first gives the days. The requested-cancellation retention percentage is
      the package's insured-cancellation retention percentage. The requested-cancellation return is the requested-cancellation
      unearned premium less the requested-cancellation retention percentage of itself, rounded half up to the cent
      on the final figure only; when the unearned days come to zero nothing is returned and the cancellation books
      no return entry; otherwise the return is booked as one return entry for the cancellation at the insured's
      request, dated from the cancellation effective date, with the unearned days used as its days.
    params:
    - insured_cancel_short_rate_retention_pct
  inputs:
    history:
    - table: nonowner_premium_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: nonowner_premium_written
    - table: nonowner_cancellation_requests
      aggregate: latest
      field: requested_effective_date
      filters:
        request_status: confirmed_by_insured
    cross_category:
    - billing
    - fr
- id: nonowner_ext_package_rerate
