    increase_rated_share: >-
      The increase adjustments below are applied to that standard figure in this order: an adjustment that changes
      how a quantity of the standard figure is worked out replaces that quantity first, then every adjustment stated
      as a relativity or credit is multiplied into one combined relativity that multiplies the increase rated premium
      once, before the increase deduction is subtracted, and the rounding to the cent comes last, on the final figure
      only.
