    late_lapse_attested_start: >-
      The late-renewal lapse relativity follows the lapse recorded on the renewal term, its days counted from the
      first lapse day attested on the latest Statement of No Loss signed for the renewal term (the one recorded
      first when two share the latest document date) through the last lapse day recorded on the renewal term, both
      included, a lapse with no such statement counting no days: six days or more carry 1.12, three to five days
      carry 1.06, and one or two days carry no late-renewal lapse relativity.
    late_lapse_days: >-
      The late-renewal lapse relativity follows the lapse recorded on the renewal term, its days counted from the
      first lapse day attested on the latest Statement of No Loss signed for the renewal term (the one recorded
      first when two share the latest document date) through the last lapse day recorded on the renewal term, both
      included, a lapse with no such statement counting no days: six days or more carry 1.12, three to five days
      carry 1.06, and one or two days carry no late-renewal lapse relativity.
    late_lapse_relativity: >-
