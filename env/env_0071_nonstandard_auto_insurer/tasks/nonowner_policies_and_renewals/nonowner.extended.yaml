  rule: >-
    The additional premium for a package change during the term is worked out by this rule and booked as one additional-premium
    entry whose reason names the direction of the change: limits_increase for a move to a package with a higher
    six-month base rate and limits_decrease for a move to a package with a lower one; a move to a lower base rate
    whose increase charge by this rule is above zero is charged as additional premium and not returned, and only
    such a move; every other move to a lower base rate still returns unearned premium as a return-premium entry
    for the limits decrease, and a reinstatement still re-writes premium under the reinstatement rule. The increase
    charge for a package change is worked out only after the term carries the package it moves to. The increase
    charge is not worked out until the term's premium ledger carries a re-written premium entry for every reinstatement
    with a lapse recorded on the term. The increase days run from the day of the change, which is included, to the
    term's expiration date, which is excluded. The increase rated premium is the increase base rate of the package
    the term carries multiplied by the state factor, by the increase points class factor and by the term's months
    over six. The standard increase charge is the increase rated premium multiplied by the increase days and divided
    by the term's days, less the increase deduction, the standard increase deduction being the premium written on
    the term multiplied by the increase days and divided by the term's days; a change made fewer than 15 days before
    the expiration date, or a charge that is not above zero, owes no increase charge and nothing is booked; otherwise
    the charge is rounded half up to the cent on the final figure only and booked as one additional-premium entry
    for the change, dated from the day of the change, with the increase days as its days. The increase base rate
    is the company's six-month base rate of the package rated: Cardinal Point Non-Owner Minimum Limits 520.00, Cardinal
    Point Non-Owner Minimum Limits with UM 610.00, Cardinal Point Non-Owner 50/100/50 760.00, Cardinal Point Non-Owner
    100/200/50 880.00, Cardinal Point Non-Owner 100/300/50 950.00, Cardinal Point Non-Owner 250/500/100 1180.00;
    the state factor is the residence state's: FL 1.00, VA 0.94, TX 1.08, GA 1.05, AZ 0.97, OH 0.88; the increase
    points class factor follows the named insured's violation points on the term: 10 or more points 1.50, 6 to 9
    points 1.28, 3 to 5 points 1.12, and 0 to 2 points 1.00. The increase adjustments below are applied to that
    standard figure in this order: an adjustment that changes how a quantity of the standard figure is worked out
    replaces that quantity first, then every adjustment stated as a relativity or credit is multiplied into one
    combined relativity that multiplies the increase rated premium once, before the increase deduction is subtracted,
    and the rounding to the cent comes last, on the final figure only. The increase filer class follows the named
    insured's Operator certificate requirement, an SR-22 Operator Certificate or FR-44 Operator Certificate filing
    of the named insured: for each form the filing read is its requested filing, otherwise its filed one, otherwise
    its rejected one, the one recorded first within a status, and that filing counts when its required-through date
    is on or after the day of the change or is not recorded, no other filing of the form being read when it does
    not; when both forms count the FR-44 one counts; withdrawn, terminated and cancellation_filed filings, Owner
    and Owner-Operator certificates, and the term's own record of the certificate it was written to back are not
    read: an FR-44 requirement with 6 or more violation points carries 1.35, an FR-44 requirement with fewer carries
    1.25, an SR-22 requirement with 6 or more violation points carries 1.15, an SR-22 requirement with fewer carries
    1.08, and a named insured with no such requirement carries no increase filer class. The increase lapse relativity
    follows the most recent lapse recorded on the term, its days counted from the first lapse day attested on the
    latest Statement of No Loss signed for the term (the one recorded first when two share the latest document date)
    through the last lapse day recorded on the term, both included, a lapse with no such statement counting no days,
    while its lapse window lasts, the window being the six whole months that follow that first lapse day, a month
    being complete on the same day of the following month: six days or more carry 1.12, three to five days carry
    1.06, and no lapse, a lapse of one or two days, or a lapse whose window ended before the day of the change carries
    no increase lapse relativity. The increase nonpayment relativity follows a cancellation for nonpayment recorded
    on the term, read from the nonpayment cancellation return booked on its premium ledger (the latest by processing
    date, the one recorded first when two share it) and counted in whole months from that return's effective date,
    the cancellation effective date, to the day of the change, a month being complete on the same day of the following
    month: fewer than three whole months carry 1.08, three to five whole months carry 1.04, and no such cancellation,
    or one six or more whole months before, carries no increase nonpayment relativity. The increase returned-payment
    relativity counts the payments returned unpaid on any billing plan of the named insured whose posting date lies
    fewer than twelve whole months before the processing date, a month being complete on the same day of the following
    month: two or more carry 1.08, exactly one carries 1.04, and none carries no increase returned-payment relativity.
    The increase plan credit follows the billing plan of the term: the Cardinal Point Paid-in-Full Plan carries
    0.94, the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan carries 0.97, and
    every other plan carries no increase plan credit. The increase deduction basis follows what the term's ledger
    already carries for the increase days: when the ledger carries a re-written premium entry for a reinstatement,
    the deduction is the premium written multiplied by the increase days and divided by its days (the term's days
    when it records none), less the earlier returns multiplied by the increase days and divided by the latest return's
    days, plus the re-written premium multiplied by the increase days and divided by the latest re-written entry's
    days, the entry recorded first giving the days where two share the latest processing date; when there is no
    such re-written entry but the premium written records more than zero days and fewer than the term's days, the
    deduction is the premium written multiplied by the increase days and divided by its days; otherwise the standard
    increase deduction stands.
  prerequisite:
  - problem: nonowner_ext_package_rerate
    kind: value_input
    gate: moved_package
    form: state
    policy_source: >-
      The increase charge for a package change is worked out only after the term carries the package it moves to.
    condition: the nonowner_policies row carries the package the change moves it to
    resolved_by: change_nonowner_package_67dc97ad
    effect: the package whose base rate the increase rated premium reads becomes the moved package
  - problem: nonowner_ext_reinstatement_rewritten
    kind: value_input
    gate: rewritten_on_term
    form: state
    policy_source: >-
      The increase charge is not worked out until the term's premium ledger carries a re-written premium entry for
      every reinstatement with a lapse recorded on the term.
    condition: >-
      nonowner_premium_transactions holds an additional-premium entry with reason reinstatement for the reinstatement
      with lapse recorded on the term
    resolved_by: book_reinstatement_rewritten_premium_bf43cbc7
    effect: >-
      the re-written premium on the ledger becomes the booked figure, which moves the increase onto the ledger unearned
      basis
  cross_category:
  - category: billing
    as: history
    reads:
    - billing_transactions.event_type
    - billing_transactions.posted_date
    - variant_name
    note: returned-payment relativity and plan credit
  - category: fr
    as: branch
    reads:
    - variant_name
    - status
    - filing_state
    - required_through_date
    note: the increase filer class reads the Operator certificate requirement
  compute:
  - increase_days: DAYS(NOW, F('expiration_date'))
  - moved_package: F('variant_name')
  - increase_base_rate: >-
      K('rate_min') if moved_package == 'Cardinal Point Non-Owner Minimum Limits' else (K('rate_min_um') if moved_package
      == 'Cardinal Point Non-Owner Minimum Limits with UM' else (K('rate_p50') if moved_package == 'Cardinal Point
      Non-Owner 50/100/50' else (K('rate_p100_200') if moved_package == 'Cardinal Point Non-Owner 100/200/50' else
      (K('rate_p100_300') if moved_package == 'Cardinal Point Non-Owner 100/300/50' else (K('rate_p250'))))))
  - increase_state_factor: >-
      K('state_fl') if F('resident_state') == 'FL' else (K('state_va') if F('resident_state') == 'VA' else (K('state_tx')
      if F('resident_state') == 'TX' else (K('state_ga') if F('resident_state') == 'GA' else (K('state_az') if F('resident_state')
      == 'AZ' else K('state_oh')))))
  - increase_points_class: >-
      K('class_points_high') if F('violation_points') >= K('points_high') else (K('class_points_mid') if F('violation_points')
      >= K('points_mid') else (K('class_points_low') if F('violation_points') >= K('points_low') else 1.0))
  - increase_fr44_active: >-
      1 if (((CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested') and (not
      CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate', status='requested') or CFIELD('fr','required_through_date',
      variant_name='FR-44 Operator Certificate', status='requested') >= NOW)) or (not CFIELD('fr','filing_state',
      variant_name='FR-44 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='FR-44
      Operator Certificate', status='filed') and (not CFIELD('fr','required_through_date', variant_name='FR-44 Operator
      Certificate', status='filed') or CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate',
      status='filed') >= NOW)) or (not CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested')
      and not CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='filed') and CFIELD('fr','filing_state',
      variant_name='FR-44 Operator Certificate', status='rejected') and (not CFIELD('fr','required_through_date',
      variant_name='FR-44 Operator Certificate', status='rejected') or CFIELD('fr','required_through_date', variant_name='FR-44
      Operator Certificate', status='rejected') >= NOW)))) else 0
  - increase_sr22_active: >-
      1 if (((CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='requested') and (not
      CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate', status='requested') or CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='requested') >= NOW)) or (not CFIELD('fr','filing_state',
      variant_name='SR-22 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='SR-22
      Operator Certificate', status='filed') and (not CFIELD('fr','required_through_date', variant_name='SR-22 Operator
      Certificate', status='filed') or CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate',
      status='filed') >= NOW)) or (not CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='requested')
      and not CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='filed') and CFIELD('fr','filing_state',
      variant_name='SR-22 Operator Certificate', status='rejected') and (not CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='rejected') or CFIELD('fr','required_through_date', variant_name='SR-22
      Operator Certificate', status='rejected') >= NOW))) and not increase_fr44_active) else 0
  - increase_filer_class: >-
      K('filer_fr44_high') if (increase_fr44_active and F('violation_points') >= K('filer_points')) else (K('filer_fr44_low')
      if (increase_fr44_active and F('violation_points') < K('filer_points')) else (K('filer_sr22_high') if (increase_sr22_active
      and F('violation_points') >= K('filer_points')) else (K('filer_sr22_low') if (increase_sr22_active and F('violation_points')
      < K('filer_points')) else 1.0)))
  - increase_lapse_attested_start: >-
      LATEST('nonowner_documents','lapse_period_start', date_field='document_date', event_type='nonowner_no_loss_statement')
  - increase_lapse_days: >-
      (DAYS(increase_lapse_attested_start, F('lapse_end_date')) + 1) if (COUNT('nonowner_documents', event_type='nonowner_no_loss_statement')
      and increase_lapse_attested_start and F('lapse_end_date')) else 0
  - increase_lapse_relativity: >-
      (K('rel_lapse_long') if increase_lapse_days >= K('lapse_long_days') else (K('rel_lapse_mid') if increase_lapse_days
      >= K('lapse_mid_days') else 1.0)) if (increase_lapse_days >= 1 and MONTHS(increase_lapse_attested_start, NOW)
      < K('lapse_window_months')) else 1.0
  - increase_nonpay_cancel_date: >-
      LATEST('nonowner_premium_transactions','effective_date', date_field='transaction_date', event_type='nonowner_return_premium',
      transaction_reason='cancellation_nonpayment')
  - increase_nonpay_months: >-
      MONTHS(increase_nonpay_cancel_date, NOW) if (COUNT('nonowner_premium_transactions', event_type='nonowner_return_premium',
      transaction_reason='cancellation_nonpayment') and increase_nonpay_cancel_date) else -1
  - increase_nonpay_relativity: >-
      K('rel_nonpay_recent') if (increase_nonpay_months >= 0 and increase_nonpay_months < K('nonpay_recent_months'))
      else (K('rel_nonpay_later') if (increase_nonpay_months >= K('nonpay_recent_months') and increase_nonpay_months
      < K('nonpay_window_months')) else 1.0)
  - increase_returns_in_window: >-
      XCOUNT('billing','billing_transactions', within_months=K('window_months'), date_field='posted_date', event_type='billing_payment_returned')
  - increase_return_relativity: >-
      K('rel_nsf_two') if increase_returns_in_window >= 2 else (K('rel_nsf_one') if increase_returns_in_window ==
      1 else 1.0)
  - increase_billing_plan: CFIELD('billing','variant_name', nonowner_policy_id=HID)
  - increase_plan_credit: >-
      K('credit_pif') if increase_billing_plan == 'Cardinal Point Paid-in-Full Plan' else (K('credit_autopay') if
      (increase_billing_plan == 'Cardinal Point Monthly EFT Plan' or increase_billing_plan == 'Cardinal Point Monthly
      Card Autopay Plan') else 1.0)
  - written_on_term: SUM('nonowner_premium_transactions','amount', event_type='nonowner_premium_written')
  - written_days_recorded: >-
      LATEST('nonowner_premium_transactions','premium_days', date_field='transaction_date', event_type='nonowner_premium_written')
  - returns_on_term: SUM('nonowner_premium_transactions','amount', event_type='nonowner_return_premium')
  - return_days_recorded: >-
      LATEST('nonowner_premium_transactions','premium_days', date_field='transaction_date', event_type='nonowner_return_premium')
  - rewritten_on_term: >-
      SUM('nonowner_premium_transactions','amount', event_type='nonowner_additional_premium', transaction_reason='reinstatement')
  - rewritten_days_recorded: >-
      LATEST('nonowner_premium_transactions','premium_days', date_field='transaction_date', event_type='nonowner_additional_premium',
      transaction_reason='reinstatement')
  - written_divisor: written_days_recorded if written_days_recorded else F('term_days')
  - increase_deduction: >-
      (written_on_term * increase_days / written_divisor - ((returns_on_term * increase_days / return_days_recorded)
      if (returns_on_term and return_days_recorded) else 0) + rewritten_on_term * increase_days / rewritten_days_recorded)
      if (rewritten_on_term and rewritten_days_recorded) else ((written_on_term * increase_days / written_days_recorded)
      if (written_days_recorded and written_days_recorded > 0 and written_days_recorded < F('term_days')) else written_on_term
      * increase_days / F('term_days'))
  - increase_rated_share: >-
      increase_base_rate * increase_state_factor * increase_points_class * F('term_months') / 6 * increase_filer_class
      * increase_lapse_relativity * increase_nonpay_relativity * increase_return_relativity * increase_plan_credit
      * increase_days / F('term_days')
  - result: >-
      RND(MX(0, increase_rated_share - increase_deduction), 2) if increase_days >= K('minimum_increase_days') else
      0.0
