  factors:
  - id: increase_filer_class
    effect: parameter
    decides: increase_filer_class
    bindings:
    - increase_fr44_active
    - increase_sr22_active
    - increase_filer_class
    ladder:
    - when: an FR-44 Operator requirement AND 6 or more violation points
      value: K('filer_fr44_high')
    - when: an FR-44 Operator requirement AND fewer than 6 violation points
      value: K('filer_fr44_low')
    - when: an SR-22 Operator requirement (no FR-44) AND 6 or more violation points
      value: K('filer_sr22_high')
    - when: an SR-22 Operator requirement (no FR-44) AND fewer than 6 violation points
      value: K('filer_sr22_low')
    - when: otherwise (no such requirement)
      value: '1.0'
    baseline:
      increase_filer_class: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: fr
  - id: increase_lapse_relativity
    effect: parameter
    decides: increase_lapse_relativity
    bindings:
    - increase_lapse_attested_start
    - increase_lapse_days
    - increase_lapse_relativity
    ladder:
    - when: a lapse of six days or more, both ends counted
      value: K('rel_lapse_long')
    - when: a lapse of three to five days
      value: K('rel_lapse_mid')
    - when: otherwise (no lapse, one or two days, or a lapse window already ended)
      value: '1.0'
    baseline:
      increase_lapse_relativity: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: increase_nonpay_relativity
    effect: parameter
    decides: increase_nonpay_relativity
    bindings:
    - increase_nonpay_cancel_date
    - increase_nonpay_months
    - increase_nonpay_relativity
    ladder:
    - when: a cancellation for nonpayment fewer than three whole months before the rating date
      value: K('rel_nonpay_recent')
    - when: one three to five whole months before
      value: K('rel_nonpay_later')
    - when: otherwise (none, or six or more whole months before)
      value: '1.0'
    baseline:
      increase_nonpay_relativity: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: increase_return_relativity
    effect: parameter
    decides: increase_return_relativity
    bindings:
    - increase_returns_in_window
    - increase_return_relativity
    ladder:
    - when: two or more payments returned unpaid within twelve whole months
      value: K('rel_nsf_two')
    - when: exactly one
      value: K('rel_nsf_one')
    - when: otherwise (none)
      value: '1.0'
    baseline:
      increase_return_relativity: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: billing
  - id: increase_plan_credit
    effect: parameter
    decides: increase_plan_credit
    bindings:
    - increase_billing_plan
    - increase_plan_credit
    ladder:
    - when: the term is billed on the Cardinal Point Paid-in-Full Plan
      value: K('credit_pif')
    - when: on the Monthly EFT or Monthly Card Autopay Plan
      value: K('credit_autopay')
    - when: otherwise
      value: '1.0'
    baseline:
      increase_plan_credit: '1.0'
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: increase_deduction_basis
    effect: method
    decides: increase_deduction
    bindings:
    - written_days_recorded
    - returns_on_term
    - return_days_recorded
    - rewritten_on_term
    - rewritten_days_recorded
    - written_divisor
    - increase_deduction
    ladder:
    - when: the ledger carries a re-written premium entry for a reinstatement
      method: >-
        entry by entry: written share less returns share plus re-written share for the increase days
    - when: >-
        no re-written entry AND the premium written records more than zero and fewer days than the term's days
      method: the premium written over its own days
    - when: otherwise
      method: the premium written over the term's days
    baseline:
      increase_deduction: written_on_term * increase_days / F('term_days')
    evidence:
    - history
    cross_difficulty: null
  baseline:
