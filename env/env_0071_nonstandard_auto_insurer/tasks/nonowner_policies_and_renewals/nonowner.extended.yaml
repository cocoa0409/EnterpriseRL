  rule: >-
    When a DUI-related FR-44 Operator certificate requirement of the named insured is recorded, an FR-44 Operator
    Certificate filing of the named insured whose status is requested, filed or rejected, while the term carries
    a package that does not accept a DUI or DWI conviction within 60 months, the term is realigned mid-term to Cardinal
    Point Non-Owner 100/300/50, the highest package that accepts such a conviction and lists both Florida and Virginia
    among its FR-44 states, provided the named insured's violation points do not exceed that package's new-business
    maximum of 12; its full-term premium is re-rated by this rule and the change takes effect on the day it is made
    and never earlier; every other mid-term package change still takes effect on the requested date, never earlier,
    and is still refused when it would leave an FR-44 Operator certificate backed by a package outside fr44_filing_states.
    The re-rated package full-term premium is the re-rated package base multiplied by the state factor, by the re-rated
    package points class factor and by the term's months over six, rounded half up to the cent on the final figure
    only; the standard re-rated package base is the base rate of Cardinal Point Non-Owner 100/300/50 for the whole
    term. The re-rated package base rate is the company's six-month base rate of the package rated: Cardinal Point
    Non-Owner Minimum Limits 520.00, Cardinal Point Non-Owner Minimum Limits with UM 610.00, Cardinal Point Non-Owner
    50/100/50 760.00, Cardinal Point Non-Owner 100/200/50 880.00, Cardinal Point Non-Owner 100/300/50 950.00, Cardinal
    Point Non-Owner 250/500/100 1180.00; the state factor is the residence state's: FL 1.00, VA 0.94, TX 1.08, GA
    1.05, AZ 0.97, OH 0.88; the re-rated package points class factor follows the named insured's violation points
    on the term: 10 or more points 1.50, 6 to 9 points 1.28, 3 to 5 points 1.12, and 0 to 2 points 1.00. The re-rated
    package adjustments below are applied to that standard figure in this order: an adjustment that changes how
    a quantity of the standard figure is worked out replaces that quantity first, then every adjustment stated as
    a relativity or credit is multiplied into one combined relativity that multiplies the figure once, and the rounding
    to the cent comes last, on the final figure only. The re-rated package filer class follows the named insured's
    Operator certificate requirement, an SR-22 Operator Certificate or FR-44 Operator Certificate filing of the
    named insured: for each form the filing read is its requested filing, otherwise its filed one, otherwise its
    rejected one, the one recorded first within a status, and that filing counts when its required-through date
    is on or after the day of the change or is not recorded, no other filing of the form being read when it does
    not; when both forms count the FR-44 one counts; withdrawn, terminated and cancellation_filed filings, Owner
    and Owner-Operator certificates, and the term's own record of the certificate it was written to back are not
    read: an FR-44 requirement with 6 or more violation points carries 1.35, an FR-44 requirement with fewer carries
    1.25, an SR-22 requirement with 6 or more violation points carries 1.15, an SR-22 requirement with fewer carries
    1.08, and a named insured with no such requirement carries no re-rated package filer class. The re-rated package
    lapse relativity follows the most recent lapse recorded on the term, its days counted from the first lapse day
    attested on the latest Statement of No Loss signed for the term (the one recorded first when two share the latest
    document date) through the last lapse day recorded on the term, both included, a lapse with no such statement
    counting no days, while its lapse window lasts, the window being the six whole months that follow that first
    lapse day, a month being complete on the same day of the following month: six days or more carry 1.12, three
    to five days carry 1.06, and no lapse, a lapse of one or two days, or a lapse whose window ended before the
    day of the change carries no re-rated package lapse relativity. The re-rated package nonpayment relativity follows
    a cancellation for nonpayment recorded on the term, read from the nonpayment cancellation return booked on its
    premium ledger (the latest by processing date, the one recorded first when two share it) and counted in whole
    months from that return's effective date, the cancellation effective date, to the day of the change, a month
    being complete on the same day of the following month: fewer than three whole months carry 1.08, three to five
    whole months carry 1.04, and no such cancellation, or one six or more whole months before, carries no re-rated
    package nonpayment relativity. The re-rated package returned-payment relativity counts the payments returned
    unpaid on any billing plan of the named insured whose posting date lies fewer than twelve whole months before
    the processing date, a month being complete on the same day of the following month: two or more carry 1.08,
    exactly one carries 1.04, and none carries no re-rated package returned-payment relativity. The re-rated package
    plan credit follows the billing plan of the term: the Cardinal Point Paid-in-Full Plan carries 0.94, the Cardinal
    Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan carries 0.97, and every other plan carries
    no re-rated package plan credit. The re-rated package base follows when in the term the realignment is made,
    the days run counting from the term's effective date, which is included, to the day of the change, which is
    excluded, and the days remaining from the day of the change, which is included, to the expiration date, which
    is excluded: a change made with fewer than 15 days remaining keeps for the whole term the higher of the current
    package's base rate and the new package's base rate; a change made more than 60 days after the effective date
    with 15 or more days remaining re-rates the term by the day, the base being the current package's base rate
    multiplied by the days run plus the new package's base rate multiplied by the days remaining, divided by the
    term's days; any other change re-rates the whole term on the new package's base rate.
  prerequisite: []
  cross_category:
  - category: fr
    as: branch
    reads:
    - variant_name
    - status
    - filing_state
    - required_through_date
    note: >-
      the FR-44 requirement makes the realignment due; the filer class reads the Operator certificate requirement
  - category: billing
    as: history
    reads:
    - billing_transactions.event_type
    - billing_transactions.posted_date
    - variant_name
    note: returned-payment relativity and plan credit
  compute:
  - realignment_fr44: >-
      CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested') or CFIELD('fr','filing_state',
      variant_name='FR-44 Operator Certificate', status='filed') or CFIELD('fr','filing_state', variant_name='FR-44
      Operator Certificate', status='rejected')
  - realignment_due: >-
      1 if (realignment_fr44 and P('dui_within_60_months_accepted') == False and F('violation_points') <= K('target_points_max'))
      else 0
  - rerate_state_factor: >-
      K('state_fl') if F('resident_state') == 'FL' else (K('state_va') if F('resident_state') == 'VA' else (K('state_tx')
      if F('resident_state') == 'TX' else (K('state_ga') if F('resident_state') == 'GA' else (K('state_az') if F('resident_state')
      == 'AZ' else K('state_oh')))))
  - rerate_points_class: >-
      K('class_points_high') if F('violation_points') >= K('points_high') else (K('class_points_mid') if F('violation_points')
      >= K('points_mid') else (K('class_points_low') if F('violation_points') >= K('points_low') else 1.0))
  - rerate_fr44_active: >-
      1 if (((CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested') and (not
      CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate', status='requested') or CFIELD('fr','required_through_date',
      variant_name='FR-44 Operator Certificate', status='requested') >= NOW)) or (not CFIELD('fr','filing_state',
      variant_name='FR-44 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='FR-44
      Operator Certificate', status='filed') and (not CFIELD('fr','required_through_date', variant_name='FR-44 Operator
      Certificate', status='filed') or CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate',
      status='filed') >= NOW)) or (not CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested')
      and not CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='filed') and CFIELD('fr','filing_state',
      variant_name='FR-44 Operator Certificate', status='rejected') and (not CFIELD('fr','required_through_date',
      variant_name='FR-44 Operator Certificate', status='rejected') or CFIELD('fr','required_through_date', variant_name='FR-44
      Operator Certificate', status='rejected') >= NOW)))) else 0
  - rerate_sr22_active: >-
      1 if (((CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='requested') and (not
      CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate', status='requested') or CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='requested') >= NOW)) or (not CFIELD('fr','filing_state',
      variant_name='SR-22 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='SR-22
      Operator Certificate', status='filed') and (not CFIELD('fr','required_through_date', variant_name='SR-22 Operator
      Certificate', status='filed') or CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate',
      status='filed') >= NOW)) or (not CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='requested')
      and not CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='filed') and CFIELD('fr','filing_state',
      variant_name='SR-22 Operator Certificate', status='rejected') and (not CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='rejected') or CFIELD('fr','required_through_date', variant_name='SR-22
      Operator Certificate', status='rejected') >= NOW))) and not rerate_fr44_active) else 0
  - rerate_filer_class: >-
      K('filer_fr44_high') if (rerate_fr44_active and F('violation_points') >= K('filer_points')) else (K('filer_fr44_low')
      if (rerate_fr44_active and F('violation_points') < K('filer_points')) else (K('filer_sr22_high') if (rerate_sr22_active
      and F('violation_points') >= K('filer_points')) else (K('filer_sr22_low') if (rerate_sr22_active and F('violation_points')
      < K('filer_points')) else 1.0)))
  - rerate_lapse_attested_start: >-
      LATEST('nonowner_documents','lapse_period_start', date_field='document_date', event_type='nonowner_no_loss_statement')
  - rerate_lapse_days: >-
      (DAYS(rerate_lapse_attested_start, F('lapse_end_date')) + 1) if (COUNT('nonowner_documents', event_type='nonowner_no_loss_statement')
      and rerate_lapse_attested_start and F('lapse_end_date')) else 0
  - rerate_lapse_relativity: >-
      (K('rel_lapse_long') if rerate_lapse_days >= K('lapse_long_days') else (K('rel_lapse_mid') if rerate_lapse_days
      >= K('lapse_mid_days') else 1.0)) if (rerate_lapse_days >= 1 and MONTHS(rerate_lapse_attested_start, NOW)
      < K('lapse_window_months')) else 1.0
  - rerate_nonpay_cancel_date: >-
      LATEST('nonowner_premium_transactions','effective_date', date_field='transaction_date', event_type='nonowner_return_premium',
      transaction_reason='cancellation_nonpayment')
  - rerate_nonpay_months: >-
      MONTHS(rerate_nonpay_cancel_date, NOW) if (COUNT('nonowner_premium_transactions', event_type='nonowner_return_premium',
      transaction_reason='cancellation_nonpayment') and rerate_nonpay_cancel_date) else -1
  - rerate_nonpay_relativity: >-
      K('rel_nonpay_recent') if (rerate_nonpay_months >= 0 and rerate_nonpay_months < K('nonpay_recent_months'))
      else (K('rel_nonpay_later') if (rerate_nonpay_months >= K('nonpay_recent_months') and rerate_nonpay_months
      < K('nonpay_window_months')) else 1.0)
  - rerate_returns_in_window: >-
      XCOUNT('billing','billing_transactions', within_months=K('window_months'), date_field='posted_date', event_type='billing_payment_returned')
  - rerate_return_relativity: >-
      K('rel_nsf_two') if rerate_returns_in_window >= 2 else (K('rel_nsf_one') if rerate_returns_in_window == 1
      else 1.0)
  - rerate_billing_plan: CFIELD('billing','variant_name', nonowner_policy_id=HID)
  - rerate_plan_credit: >-
      K('credit_pif') if rerate_billing_plan == 'Cardinal Point Paid-in-Full Plan' else (K('credit_autopay') if
      (rerate_billing_plan == 'Cardinal Point Monthly EFT Plan' or rerate_billing_plan == 'Cardinal Point Monthly
      Card Autopay Plan') else 1.0)
  - rerate_current_base: >-
      K('rate_min') if F('variant_name') == 'Cardinal Point Non-Owner Minimum Limits' else (K('rate_min_um') if
      F('variant_name') == 'Cardinal Point Non-Owner Minimum Limits with UM' else (K('rate_p50') if F('variant_name')
      == 'Cardinal Point Non-Owner 50/100/50' else (K('rate_p100_200') if F('variant_name') == 'Cardinal Point Non-Owner
      100/200/50' else (K('rate_p100_300') if F('variant_name') == 'Cardinal Point Non-Owner 100/300/50' else (K('rate_p250'))))))
  - rerate_days_run: DAYS(F('effective_date'), NOW)
  - rerate_days_remaining: DAYS(NOW, F('expiration_date'))
  - rerate_base: >-
      MX(rerate_current_base, K('rate_p100_300')) if rerate_days_remaining < K('kept_days') else ((rerate_current_base
      * rerate_days_run + K('rate_p100_300') * rerate_days_remaining) / F('term_days') if rerate_days_run > K('underwriting_days')
      else K('rate_p100_300'))
  - rerate_combined: >-
      rerate_filer_class * rerate_lapse_relativity * rerate_nonpay_relativity * rerate_return_relativity * rerate_plan_credit
  - result: >-
      RND(rerate_base * rerate_state_factor * rerate_points_class * F('term_months') / 6 * rerate_combined, 2) if
      realignment_due else F('full_term_premium')
