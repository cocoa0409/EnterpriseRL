    late_plan_change: >-
      The late-renewal plan change carries a change of billing plan since the offer, which was rated with the plan
      credit of the expiring term's billing plan: the plan credit is 0.94 for the Cardinal Point Paid-in-Full Plan,
      0.97 for the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan and 1.00 for
