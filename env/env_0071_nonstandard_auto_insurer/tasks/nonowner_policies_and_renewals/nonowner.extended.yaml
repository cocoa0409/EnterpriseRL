  factors:
  - id: late_filer_change
    effect: parameter
    decides: late_filer_change
    bindings:
    - late_fr44_active
    - late_sr22_active
    - late_counted_requested
    - late_filer_class
    - late_released_form
    - late_released_class
    - late_filer_change
    ladder:
    - when: the counted Operator requirement was requested after the renewal term's issue date
      value: late_filer_class / late_released_class
    - when: >-
        no requirement added AND an Operator certificate the offer carried had its SR-26 sent after the issue date
      value: 1.0 / late_released_class
    - when: otherwise (no change in the requirement since the issue date)
      value: '1.0'
    baseline:
      late_filer_change: '1.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: fr
  - id: late_lapse_relativity
    effect: parameter
    decides: late_lapse_relativity
    bindings:
    - late_lapse_attested_start
    - late_lapse_days
    - late_lapse_relativity
    ladder:
    - when: a lapse of six days or more, both ends counted
      value: K('rel_lapse_long')
    - when: a lapse of three to five days
      value: K('rel_lapse_mid')
    - when: otherwise (one or two days)
      value: '1.0'
    baseline:
      late_lapse_relativity: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: late_plan_change
    effect: parameter
    decides: late_plan_change
    bindings:
    - late_billing_plan
    - late_offer_plan
    - late_new_credit
    - late_offer_credit
    - late_plan_change
    ladder:
    - when: the renewal term's plan carries a larger credit than the expiring term's plan
      value: late_new_credit / late_offer_credit
    - when: the renewal term's plan carries a smaller credit than the expiring term's plan
      value: late_new_credit / late_offer_credit
    - when: otherwise (the same credit)
      value: '1.0'
    baseline:
      late_plan_change: '1.0'
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: late_charging_basis
    effect: method
    decides: late_charge_share
    bindings:
    - late_cert_pick
    - late_certificate_filed
    - late_cert_required_through
    - late_cert_end
    - late_certificate_through
    - late_charge_share
