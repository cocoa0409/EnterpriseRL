    late_rated_premium: >-
      The late-renewal rated premium is the renewal term's recorded full-term premium, the premium its renewal offer
      was issued at and rated on the records of the offer's issue date, the renewal term's opened date; what changed
      after that date is carried by the adjustments below.
    late_days_in_force: >-
      The late-renewal written premium is the late-renewal rated premium multiplied by the late-renewal charging
      share, rounded half up to the cent on the final figure only; the standard late-renewal charging share is the
      late-renewal days in force divided by the renewal term's days, the days in force running from the in-force
      date, the day after the last lapse day recorded on the renewal term, which is included, to the renewal term's
      expiration date, which is excluded; the premium is booked as one premium-written entry for the renewal dated
      from the in-force date with the days in force as its days.
    late_standard_share: >-
      The late-renewal written premium is the late-renewal rated premium multiplied by the late-renewal charging
      share, rounded half up to the cent on the final figure only; the standard late-renewal charging share is the
      late-renewal days in force divided by the renewal term's days, the days in force running from the in-force
      date, the day after the last lapse day recorded on the renewal term, which is included, to the renewal term's
      expiration date, which is excluded; the premium is booked as one premium-written entry for the renewal dated
      from the in-force date with the days in force as its days.
    late_certificate_filed: >-
      The late-renewal charging basis follows the company's exposure during the lapse, read from the named insured's
      SR-22 or FR-44 Operator certificate that was on file during the lapse: the FR-44 form is read before the SR-22
      form, and for a form the filings tried are, in this order, its filed filing recorded first, its cancellation_filed
      filing recorded first and its terminated filing recorded first, the first of these whose filing date is on
      or before the first lapse day being the one read; its certified-through date is the earlier of its required-through
      date and its certificate end date, a date not recorded leaving the other, and there is none when neither is
      recorded: when its certified-through date is on or after the last lapse day or there is none, the company
      stayed certified on every lapse day, the charging share is one, a flat full-term charge, and the entry is
      booked from the renewal term's effective date with the renewal term's days as its days; when its certified-through
      date is on or after the first lapse day but before the last lapse day, the company stayed certified only through
      that date, so the charged days are the renewal term's days less the lapse days after the certified-through
      date, those days running from the day after the certified-through date, which is included, to the last lapse
      day, which is included; the charging share is the charged days divided by the renewal term's days and the
      entry is booked from the renewal term's effective date with the charged days as its days; in every other case,
      including no such certificate, the standard charging share stands, so no lapse day is charged.
