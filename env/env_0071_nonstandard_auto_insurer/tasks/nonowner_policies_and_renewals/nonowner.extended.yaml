  rule: >-
    This rule prices the renewal offer issued for an in-force term not being nonrenewed whose named insured's points
    do not exceed the package's renewal points, so that the package is kept; the renewal term starts on the expiring
    term's expiration date and runs the same number of months; a renewal moved to a lower package keeps the base
    renewal rule and is not priced by this rule. The renewal offer premium is not fixed until the expiring term
    carries a package that accepts a DUI or DWI conviction within 60 months whenever the named insured has a DUI-related
    FR-44 Operator certificate requirement recorded. A renewal offer is not issued before any increase charge owed
    for a package change made on the expiring term has been booked. The renewal offer premium is the renewal offer
    base rate of the expiring term's package multiplied by the state factor, by the renewal offer points class factor,
    by the renewal term's months over six and by the standard renewal offer lapse relativity, rounded half up to
    the cent on the final figure only; the renewal term runs from the expiring term's expiration date, which is
    included, for the same number of months. The renewal offer base rate is the company's six-month base rate of
    the package rated: Cardinal Point Non-Owner Minimum Limits 520.00, Cardinal Point Non-Owner Minimum Limits with
    UM 610.00, Cardinal Point Non-Owner 50/100/50 760.00, Cardinal Point Non-Owner 100/200/50 880.00, Cardinal Point
    Non-Owner 100/300/50 950.00, Cardinal Point Non-Owner 250/500/100 1180.00; the state factor is the residence
    state's: FL 1.00, VA 0.94, TX 1.08, GA 1.05, AZ 0.97, OH 0.88; the renewal offer points class factor follows
    the named insured's violation points on the term: 10 or more points 1.50, 6 to 9 points 1.28, 3 to 5 points
    1.12, and 0 to 2 points 1.00. The standard renewal offer lapse relativity follows the most recent lapse recorded
    on the expiring term, its days counted from the first through the last lapse day, both included, and its lapse
    window, the six whole months that follow the first lapse day, a month being complete on the same day of the
    following month; the window's remaining months at the renewal are six less the whole months from the first lapse
    day to the renewal effective date: while that remaining count is above zero the relativity is 1.12 for a lapse
    of six days or more and 1.06 for one of three to five days, applied in full, and a lapse of one or two days,
    no lapse, or a remaining count of zero or less carries none. The renewal offer adjustments below are applied
    to that standard figure in this order: an adjustment that changes how a quantity of the standard figure is worked
    out replaces that quantity first, then every adjustment stated as a relativity or credit is multiplied into
    one combined relativity that multiplies the figure once, and the rounding to the cent comes last, on the final
    figure only. The renewal offer filer class follows the named insured's Operator certificate requirement, an
    SR-22 Operator Certificate or FR-44 Operator Certificate filing of the named insured: for each form the filing
    read is its requested filing, otherwise its filed one, otherwise its rejected one, the one recorded first within
    a status, and that filing counts when its required-through date is on or after the renewal effective date or
    is not recorded, no other filing of the form being read when it does not; when both forms count the FR-44 one
    counts; withdrawn, terminated and cancellation_filed filings, Owner and Owner-Operator certificates, and the
    term's own record of the certificate it was written to back are not read: an FR-44 requirement with 6 or more
    violation points carries 1.35, an FR-44 requirement with fewer carries 1.25, an SR-22 requirement with 6 or
    more violation points carries 1.15, an SR-22 requirement with fewer carries 1.08, and a named insured with no
    such requirement carries no renewal offer filer class. The renewal offer nonpayment relativity follows a cancellation
    for nonpayment recorded on the expiring term, read from the nonpayment cancellation return booked on its premium
    ledger (the latest by processing date, the one recorded first when two share it) and counted in whole months
    from that return's effective date, the cancellation effective date, to the renewal effective date, a month being
    complete on the same day of the following month: fewer than three whole months carry 1.08, three to five whole
    months carry 1.04, and no such cancellation, or one six or more whole months before, carries no renewal offer
    nonpayment relativity. The renewal offer returned-payment relativity counts the payments returned unpaid on
    any billing plan of the named insured whose posting date lies fewer than twelve whole months before the processing
    date, a month being complete on the same day of the following month: two or more carry 1.08, exactly one carries
    1.04, and none carries no renewal offer returned-payment relativity. The renewal offer plan credit follows the
    billing plan of the expiring term: the Cardinal Point Paid-in-Full Plan carries 0.94, the Cardinal Point Monthly
    EFT Plan or the Cardinal Point Monthly Card Autopay Plan carries 0.97, and every other plan carries no renewal
    offer plan credit. The renewal offer lapse window basis changes how the standard renewal offer lapse relativity
    applies when the window ends inside the renewal term, that is when its remaining count is above zero and below
    the renewal term's months: a lapse of three to five days then applies it by the share given by the remaining
    count over the renewal term's months, one plus the relativity less one multiplied by that share, and a lapse
    of six days or more applies it by that share but never by less than one half; in every other case the standard
    renewal offer lapse relativity stands.
  prerequisite:
  - problem: nonowner_ext_package_rerate
    kind: value_input
    gate: expiring_package
    form: state
    policy_source: >-
      The renewal offer premium is not fixed until the expiring term carries a package that accepts a DUI or DWI
      conviction within 60 months whenever the named insured has a DUI-related FR-44 Operator certificate requirement
      recorded.
    condition: >-
      the expiring nonowner_policies row carries a package whose dui_within_60_months_accepted is true whenever
      an FR-44 Operator Certificate filing of the named insured is requested, filed or rejected
    resolved_by: change_nonowner_package_67dc97ad
    effect: >-
      the expiring package the renewal offer is priced on becomes the realigned package, so the base rate read for
      it changes
  - problem: nonowner_ext_package_increase_premium
    kind: state_gate
    gate: nonowner_premium_transactions.event_type
    form: action
    policy_source: >-
      A renewal offer is not issued before any increase charge owed for a package change made on the expiring term
      has been booked.
    fallback_reason: >-
      The increase leaves an additional-premium entry, but nothing on the term records that or when a package was
      raised, so no record-visible state tells the reader that such an entry is missing; the dependency is stated
      as the booking itself.
    condition: >-
      nonowner_premium_transactions holds the additional-premium entry (reason limits_increase or limits_decrease)
      for the package change on the expiring term whenever that change owes an increase charge
    resolved_by: book_package_increase_premium_8b98e0ec
    effect: >-
      the renewal offer may be issued once the expiring term's ledger carries the booked increase charge
  cross_category:
  - category: fr
    as: branch
    reads:
    - variant_name
    - status
    - filing_state
    - required_through_date
    note: the renewal offer filer class reads the Operator certificate requirement
  - category: billing
    as: history
    reads:
    - billing_transactions.event_type
    - billing_transactions.posted_date
    - variant_name
    note: returned-payment relativity and plan credit
  compute:
  - expiring_package: F('variant_name')
  - offer_base_rate: >-
      K('rate_min') if expiring_package == 'Cardinal Point Non-Owner Minimum Limits' else (K('rate_min_um') if expiring_package
      == 'Cardinal Point Non-Owner Minimum Limits with UM' else (K('rate_p50') if expiring_package == 'Cardinal
      Point Non-Owner 50/100/50' else (K('rate_p100_200') if expiring_package == 'Cardinal Point Non-Owner 100/200/50'
      else (K('rate_p100_300') if expiring_package == 'Cardinal Point Non-Owner 100/300/50' else (K('rate_p250'))))))
  - offer_state_factor: >-
      K('state_fl') if F('resident_state') == 'FL' else (K('state_va') if F('resident_state') == 'VA' else (K('state_tx')
      if F('resident_state') == 'TX' else (K('state_ga') if F('resident_state') == 'GA' else (K('state_az') if F('resident_state')
      == 'AZ' else K('state_oh')))))
  - offer_points_class: >-
      K('class_points_high') if F('violation_points') >= K('points_high') else (K('class_points_mid') if F('violation_points')
      >= K('points_mid') else (K('class_points_low') if F('violation_points') >= K('points_low') else 1.0))
  - offer_fr44_active: >-
      1 if (((CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested') and (not
      CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate', status='requested') or CFIELD('fr','required_through_date',
      variant_name='FR-44 Operator Certificate', status='requested') >= F('expiration_date'))) or (not CFIELD('fr','filing_state',
      variant_name='FR-44 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='FR-44
      Operator Certificate', status='filed') and (not CFIELD('fr','required_through_date', variant_name='FR-44 Operator
      Certificate', status='filed') or CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate',
      status='filed') >= F('expiration_date'))) or (not CFIELD('fr','filing_state', variant_name='FR-44 Operator
      Certificate', status='requested') and not CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate',
      status='filed') and CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='rejected')
      and (not CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate', status='rejected')
      or CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate', status='rejected') >= F('expiration_date')))))
      else 0
  - offer_sr22_active: >-
      1 if (((CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='requested') and (not
      CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate', status='requested') or CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='requested') >= F('expiration_date'))) or (not CFIELD('fr','filing_state',
      variant_name='SR-22 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='SR-22
      Operator Certificate', status='filed') and (not CFIELD('fr','required_through_date', variant_name='SR-22 Operator
      Certificate', status='filed') or CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate',
      status='filed') >= F('expiration_date'))) or (not CFIELD('fr','filing_state', variant_name='SR-22 Operator
      Certificate', status='requested') and not CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate',
      status='filed') and CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='rejected')
      and (not CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate', status='rejected')
      or CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate', status='rejected') >= F('expiration_date'))))
      and not offer_fr44_active) else 0
  - offer_filer_class: >-
      K('filer_fr44_high') if (offer_fr44_active and F('violation_points') >= K('filer_points')) else (K('filer_fr44_low')
      if (offer_fr44_active and F('violation_points') < K('filer_points')) else (K('filer_sr22_high') if (offer_sr22_active
      and F('violation_points') >= K('filer_points')) else (K('filer_sr22_low') if (offer_sr22_active and F('violation_points')
      < K('filer_points')) else 1.0)))
  - offer_nonpay_cancel_date: >-
      LATEST('nonowner_premium_transactions','effective_date', date_field='transaction_date', event_type='nonowner_return_premium',
      transaction_reason='cancellation_nonpayment')
  - offer_nonpay_months: >-
      MONTHS(offer_nonpay_cancel_date, F('expiration_date')) if (COUNT('nonowner_premium_transactions', event_type='nonowner_return_premium',
      transaction_reason='cancellation_nonpayment') and offer_nonpay_cancel_date) else -1
  - offer_nonpay_relativity: >-
      K('rel_nonpay_recent') if (offer_nonpay_months >= 0 and offer_nonpay_months < K('nonpay_recent_months')) else
      (K('rel_nonpay_later') if (offer_nonpay_months >= K('nonpay_recent_months') and offer_nonpay_months < K('nonpay_window_months'))
      else 1.0)
  - offer_returns_in_window: >-
      XCOUNT('billing','billing_transactions', within_months=K('window_months'), date_field='posted_date', event_type='billing_payment_returned')
  - offer_return_relativity: >-
      K('rel_nsf_two') if offer_returns_in_window >= 2 else (K('rel_nsf_one') if offer_returns_in_window == 1 else
      1.0)
  - offer_billing_plan: CFIELD('billing','variant_name', nonowner_policy_id=HID)
  - offer_plan_credit: >-
      K('credit_pif') if offer_billing_plan == 'Cardinal Point Paid-in-Full Plan' else (K('credit_autopay') if (offer_billing_plan
      == 'Cardinal Point Monthly EFT Plan' or offer_billing_plan == 'Cardinal Point Monthly Card Autopay Plan')
      else 1.0)
  - offer_lapse_days: >-
      (DAYS(F('lapse_start_date'), F('lapse_end_date')) + 1) if (F('lapse_start_date') and F('lapse_end_date'))
      else 0
  - offer_lapse_value: >-
      K('rel_lapse_long') if offer_lapse_days >= K('lapse_long_days') else (K('rel_lapse_mid') if offer_lapse_days
      >= K('lapse_mid_days') else 1.0)
  - offer_window_left: >-
      (K('lapse_window_months') - MONTHS(F('lapse_start_date'), F('expiration_date'))) if offer_lapse_days >= 1
      else 0
  - offer_window_share: >-
      (MX(0, MN(K('lapse_window_months') - MONTHS(F('lapse_start_date'), F('expiration_date')), F('term_months')))
      / F('term_months')) if offer_lapse_days >= 1 else 0
  - offer_lapse_factor: >-
      (1 + (offer_lapse_value - 1) * offer_window_share) if (offer_lapse_days >= K('lapse_mid_days') and offer_lapse_days
      < K('lapse_long_days') and offer_window_left > 0 and offer_window_left < F('term_months')) else ((1 + (offer_lapse_value
      - 1) * MX(offer_window_share, K('window_floor_share'))) if (offer_lapse_days >= K('lapse_long_days') and offer_window_left
      > 0 and offer_window_left < F('term_months')) else (offer_lapse_value if offer_window_left > 0 else 1.0))
  - offer_combined: >-
      offer_filer_class * offer_nonpay_relativity * offer_return_relativity * offer_plan_credit * offer_lapse_factor
  - result: >-
      RND(offer_base_rate * offer_state_factor * offer_points_class * F('term_months') / 6 * offer_combined, 2)
  compute_basis:
    offer_fr44_active: >-
      The renewal offer filer class follows the named insured's Operator certificate requirement, an SR-22 Operator
      Certificate or FR-44 Operator Certificate filing of the named insured: for each form the filing read is its
      requested filing, otherwise its filed one, otherwise its rejected one, the one recorded first within a status,
      and that filing counts when its required-through date is on or after the renewal effective date or is not
      recorded, no other filing of the form being read when it does not; when both forms count the FR-44 one counts;
      withdrawn, terminated and cancellation_filed filings, Owner and Owner-Operator certificates, and the term's
      own record of the certificate it was written to back are not read: an FR-44 requirement with 6 or more violation
      points carries 1.35, an FR-44 requirement with fewer carries 1.25, an SR-22 requirement with 6 or more violation
      points carries 1.15, an SR-22 requirement with fewer carries 1.08, and a named insured with no such requirement
      carries no renewal offer filer class.
    offer_sr22_active: >-
      The renewal offer filer class follows the named insured's Operator certificate requirement, an SR-22 Operator
      Certificate or FR-44 Operator Certificate filing of the named insured: for each form the filing read is its
      requested filing, otherwise its filed one, otherwise its rejected one, the one recorded first within a status,
      and that filing counts when its required-through date is on or after the renewal effective date or is not
      recorded, no other filing of the form being read when it does not; when both forms count the FR-44 one counts;
      withdrawn, terminated and cancellation_filed filings, Owner and Owner-Operator certificates, and the term's
      own record of the certificate it was written to back are not read: an FR-44 requirement with 6 or more violation
      points carries 1.35, an FR-44 requirement with fewer carries 1.25, an SR-22 requirement with 6 or more violation
      points carries 1.15, an SR-22 requirement with fewer carries 1.08, and a named insured with no such requirement
      carries no renewal offer filer class.
    offer_filer_class: >-
      The renewal offer filer class follows the named insured's Operator certificate requirement, an SR-22 Operator
      Certificate or FR-44 Operator Certificate filing of the named insured: for each form the filing read is its
      requested filing, otherwise its filed one, otherwise its rejected one, the one recorded first within a status,
      and that filing counts when its required-through date is on or after the renewal effective date or is not
      recorded, no other filing of the form being read when it does not; when both forms count the FR-44 one counts;
      withdrawn, terminated and cancellation_filed filings, Owner and Owner-Operator certificates, and the term's
      own record of the certificate it was written to back are not read: an FR-44 requirement with 6 or more violation
      points carries 1.35, an FR-44 requirement with fewer carries 1.25, an SR-22 requirement with 6 or more violation
      points carries 1.15, an SR-22 requirement with fewer carries 1.08, and a named insured with no such requirement
      carries no renewal offer filer class.
    offer_nonpay_cancel_date: >-
      The renewal offer nonpayment relativity follows a cancellation for nonpayment recorded on the expiring term,
      read from the nonpayment cancellation return booked on its premium ledger (the latest by processing date,
      the one recorded first when two share it) and counted in whole months from that return's effective date, the
      cancellation effective date, to the renewal effective date, a month being complete on the same day of the
      following month: fewer than three whole months carry 1.08, three to five whole months carry 1.04, and no such
      cancellation, or one six or more whole months before, carries no renewal offer nonpayment relativity.
    offer_nonpay_months: >-
      The renewal offer nonpayment relativity follows a cancellation for nonpayment recorded on the expiring term,
      read from the nonpayment cancellation return booked on its premium ledger (the latest by processing date,
      the one recorded first when two share it) and counted in whole months from that return's effective date, the
      cancellation effective date, to the renewal effective date, a month being complete on the same day of the
      following month: fewer than three whole months carry 1.08, three to five whole months carry 1.04, and no such
      cancellation, or one six or more whole months before, carries no renewal offer nonpayment relativity.
    offer_nonpay_relativity: >-
      The renewal offer nonpayment relativity follows a cancellation for nonpayment recorded on the expiring term,
      read from the nonpayment cancellation return booked on its premium ledger (the latest by processing date,
      the one recorded first when two share it) and counted in whole months from that return's effective date, the
      cancellation effective date, to the renewal effective date, a month being complete on the same day of the
      following month: fewer than three whole months carry 1.08, three to five whole months carry 1.04, and no such
      cancellation, or one six or more whole months before, carries no renewal offer nonpayment relativity.
    offer_returns_in_window: >-
      The renewal offer returned-payment relativity counts the payments returned unpaid on any billing plan of the
      named insured whose posting date lies fewer than twelve whole months before the processing date, a month being
      complete on the same day of the following month: two or more carry 1.08, exactly one carries 1.04, and none
      carries no renewal offer returned-payment relativity.
    offer_return_relativity: >-
      The renewal offer returned-payment relativity counts the payments returned unpaid on any billing plan of the
      named insured whose posting date lies fewer than twelve whole months before the processing date, a month being
      complete on the same day of the following month: two or more carry 1.08, exactly one carries 1.04, and none
      carries no renewal offer returned-payment relativity.
    offer_billing_plan: >-
      The renewal offer plan credit follows the billing plan of the expiring term: the Cardinal Point Paid-in-Full
      Plan carries 0.94, the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan carries
      0.97, and every other plan carries no renewal offer plan credit.
    offer_plan_credit: >-
      The renewal offer plan credit follows the billing plan of the expiring term: the Cardinal Point Paid-in-Full
      Plan carries 0.94, the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan carries
      0.97, and every other plan carries no renewal offer plan credit.
    offer_lapse_days: >-
      The standard renewal offer lapse relativity follows the most recent lapse recorded on the expiring term, its
      days counted from the first through the last lapse day, both included, and its lapse window, the six whole
      months that follow the first lapse day, a month being complete on the same day of the following month; the
      window's remaining months at the renewal are six less the whole months from the first lapse day to the renewal
      effective date: while that remaining count is above zero the relativity is 1.12 for a lapse of six days or
      more and 1.06 for one of three to five days, applied in full, and a lapse of one or two days, no lapse, or
      a remaining count of zero or less carries none.
    offer_lapse_value: >-
      The standard renewal offer lapse relativity follows the most recent lapse recorded on the expiring term, its
      days counted from the first through the last lapse day, both included, and its lapse window, the six whole
      months that follow the first lapse day, a month being complete on the same day of the following month; the
      window's remaining months at the renewal are six less the whole months from the first lapse day to the renewal
      effective date: while that remaining count is above zero the relativity is 1.12 for a lapse of six days or
      more and 1.06 for one of three to five days, applied in full, and a lapse of one or two days, no lapse, or
      a remaining count of zero or less carries none.
    offer_window_left: >-
      The standard renewal offer lapse relativity follows the most recent lapse recorded on the expiring term, its
      days counted from the first through the last lapse day, both included, and its lapse window, the six whole
      months that follow the first lapse day, a month being complete on the same day of the following month; the
      window's remaining months at the renewal are six less the whole months from the first lapse day to the renewal
      effective date: while that remaining count is above zero the relativity is 1.12 for a lapse of six days or
      more and 1.06 for one of three to five days, applied in full, and a lapse of one or two days, no lapse, or
      a remaining count of zero or less carries none.
    offer_window_share: >-
      The renewal offer lapse window basis changes how the standard renewal offer lapse relativity applies when
      the window ends inside the renewal term, that is when its remaining count is above zero and below the renewal
      term's months: a lapse of three to five days then applies it by the share given by the remaining count over
      the renewal term's months, one plus the relativity less one multiplied by that share, and a lapse of six days
      or more applies it by that share but never by less than one half; in every other case the standard renewal
      offer lapse relativity stands.
    offer_lapse_factor: >-
      The renewal offer lapse window basis changes how the standard renewal offer lapse relativity applies when
      the window ends inside the renewal term, that is when its remaining count is above zero and below the renewal
      term's months: a lapse of three to five days then applies it by the share given by the remaining count over
      the renewal term's months, one plus the relativity less one multiplied by that share, and a lapse of six days
      or more applies it by that share but never by less than one half; in every other case the standard renewal
      offer lapse relativity stands.
    expiring_package: >-
      The renewal offer premium is the renewal offer base rate of the expiring term's package multiplied by the
      state factor, by the renewal offer points class factor, by the renewal term's months over six and by the standard
      renewal offer lapse relativity, rounded half up to the cent on the final figure only; the renewal term runs
      from the expiring term's expiration date, which is included, for the same number of months.
    offer_base_rate: >-
      The renewal offer base rate is the company's six-month base rate of the package rated: Cardinal Point Non-Owner
      Minimum Limits 520.00, Cardinal Point Non-Owner Minimum Limits with UM 610.00, Cardinal Point Non-Owner 50/100/50
      760.00, Cardinal Point Non-Owner 100/200/50 880.00, Cardinal Point Non-Owner 100/300/50 950.00, Cardinal Point
      Non-Owner 250/500/100 1180.00; the state factor is the residence state's: FL 1.00, VA 0.94, TX 1.08, GA 1.05,
      AZ 0.97, OH 0.88; the renewal offer points class factor follows the named insured's violation points on the
      term: 10 or more points 1.50, 6 to 9 points 1.28, 3 to 5 points 1.12, and 0 to 2 points 1.00.
    offer_state_factor: >-
      The renewal offer base rate is the company's six-month base rate of the package rated: Cardinal Point Non-Owner
      Minimum Limits 520.00, Cardinal Point Non-Owner Minimum Limits with UM 610.00, Cardinal Point Non-Owner 50/100/50
      760.00, Cardinal Point Non-Owner 100/200/50 880.00, Cardinal Point Non-Owner 100/300/50 950.00, Cardinal Point
      Non-Owner 250/500/100 1180.00; the state factor is the residence state's: FL 1.00, VA 0.94, TX 1.08, GA 1.05,
      AZ 0.97, OH 0.88; the renewal offer points class factor follows the named insured's violation points on the
      term: 10 or more points 1.50, 6 to 9 points 1.28, 3 to 5 points 1.12, and 0 to 2 points 1.00.
    offer_points_class: >-
      The renewal offer base rate is the company's six-month base rate of the package rated: Cardinal Point Non-Owner
      Minimum Limits 520.00, Cardinal Point Non-Owner Minimum Limits with UM 610.00, Cardinal Point Non-Owner 50/100/50
      760.00, Cardinal Point Non-Owner 100/200/50 880.00, Cardinal Point Non-Owner 100/300/50 950.00, Cardinal Point
      Non-Owner 250/500/100 1180.00; the state factor is the residence state's: FL 1.00, VA 0.94, TX 1.08, GA 1.05,
      AZ 0.97, OH 0.88; the renewal offer points class factor follows the named insured's violation points on the
      term: 10 or more points 1.50, 6 to 9 points 1.28, 3 to 5 points 1.12, and 0 to 2 points 1.00.
    offer_combined: >-
      The renewal offer adjustments below are applied to that standard figure in this order: an adjustment that
      changes how a quantity of the standard figure is worked out replaces that quantity first, then every adjustment
      stated as a relativity or credit is multiplied into one combined relativity that multiplies the figure once,
      and the rounding to the cent comes last, on the final figure only.
    result: >-
      The renewal offer premium is the renewal offer base rate of the expiring term's package multiplied by the
      state factor, by the renewal offer points class factor, by the renewal term's months over six and by the standard
      renewal offer lapse relativity, rounded half up to the cent on the final figure only; the renewal term runs
      from the expiring term's expiration date, which is included, for the same number of months.
  factors:
  - id: offer_filer_class
    effect: parameter
    decides: offer_filer_class
    bindings:
    - offer_fr44_active
    - offer_sr22_active
    - offer_filer_class
    ladder:
    - when: an FR-44 Operator requirement AND 6 or more violation points
      value: K('filer_fr44_high')
    - when: an FR-44 Operator requirement AND fewer than 6 violation points
      value: K('filer_fr44_low')
    - when: an SR-22 Operator requirement (no FR-44) AND 6 or more violation points
      value: K('filer_sr22_high')
    - when: an SR-22 Operator requirement (no FR-44) AND fewer than 6 violation points
      value: K('filer_sr22_low')
    - when: otherwise (no such requirement)
      value: '1.0'
    baseline:
      offer_filer_class: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: fr
  - id: offer_nonpay_relativity
    effect: parameter
    decides: offer_nonpay_relativity
    bindings:
    - offer_nonpay_cancel_date
    - offer_nonpay_months
    - offer_nonpay_relativity
    ladder:
    - when: a cancellation for nonpayment fewer than three whole months before the rating date
      value: K('rel_nonpay_recent')
    - when: one three to five whole months before
      value: K('rel_nonpay_later')
    - when: otherwise (none, or six or more whole months before)
      value: '1.0'
    baseline:
      offer_nonpay_relativity: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: offer_return_relativity
    effect: parameter
    decides: offer_return_relativity
    bindings:
    - offer_returns_in_window
    - offer_return_relativity
    ladder:
    - when: two or more payments returned unpaid within twelve whole months
      value: K('rel_nsf_two')
    - when: exactly one
      value: K('rel_nsf_one')
    - when: otherwise (none)
      value: '1.0'
    baseline:
      offer_return_relativity: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: billing
  - id: offer_plan_credit
    effect: parameter
    decides: offer_plan_credit
    bindings:
    - offer_billing_plan
    - offer_plan_credit
    ladder:
    - when: the term is billed on the Cardinal Point Paid-in-Full Plan
      value: K('credit_pif')
    - when: on the Monthly EFT or Monthly Card Autopay Plan
      value: K('credit_autopay')
    - when: otherwise
      value: '1.0'
    baseline:
      offer_plan_credit: '1.0'
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: offer_lapse_window
    effect: method
    decides: offer_lapse_factor
    bindings:
    - offer_window_share
    - offer_lapse_factor
    ladder:
    - when: a lapse of three to five days AND its window ends inside the renewal term
      method: relativity applied by the share of renewal months inside the window
    - when: a lapse of six days or more AND its window ends inside the renewal term
      method: relativity applied by that share floored at one half
    - when: otherwise (window lasting through the renewal term, ended, or no qualifying lapse)
      method: the standard renewal offer lapse relativity as it stands
    baseline:
      offer_lapse_factor: offer_lapse_value if offer_window_left > 0 else 1.0
    evidence:
    - date
    cross_difficulty: null
  baseline:
