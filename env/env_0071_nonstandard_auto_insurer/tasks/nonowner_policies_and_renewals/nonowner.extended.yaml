      recorded first when two share it) and counted in whole months from that return's effective date, the cancellation
      effective date, to the day of the change, a month being complete on the same day of the following month: fewer
      than three whole months carry 1.08, three to five whole months carry 1.04, and no such cancellation, or one
      six or more whole months before, carries no re-rated package nonpayment relativity.
    rerate_nonpay_months: >-
      The re-rated package nonpayment relativity follows a cancellation for nonpayment recorded on the term, read
      from the nonpayment cancellation return booked on its premium ledger (the latest by processing date, the one
      recorded first when two share it) and counted in whole months from that return's effective date, the cancellation
      effective date, to the day of the change, a month being complete on the same day of the following month: fewer
      than three whole months carry 1.08, three to five whole months carry 1.04, and no such cancellation, or one
      six or more whole months before, carries no re-rated package nonpayment relativity.
    rerate_nonpay_relativity: >-
      The re-rated package nonpayment relativity follows a cancellation for nonpayment recorded on the term, read
      from the nonpayment cancellation return booked on its premium ledger (the latest by processing date, the one
      recorded first when two share it) and counted in whole months from that return's effective date, the cancellation
      effective date, to the day of the change, a month being complete on the same day of the following month: fewer
      than three whole months carry 1.08, three to five whole months carry 1.04, and no such cancellation, or one
      six or more whole months before, carries no re-rated package nonpayment relativity.
    rerate_returns_in_window: >-
      The re-rated package returned-payment relativity counts the payments returned unpaid on any billing plan of
      the named insured whose posting date lies fewer than twelve whole months before the processing date, a month
      being complete on the same day of the following month: two or more carry 1.08, exactly one carries 1.04, and
      none carries no re-rated package returned-payment relativity.
    rerate_return_relativity: >-
      The re-rated package returned-payment relativity counts the payments returned unpaid on any billing plan of
      the named insured whose posting date lies fewer than twelve whole months before the processing date, a month
      being complete on the same day of the following month: two or more carry 1.08, exactly one carries 1.04, and
      none carries no re-rated package returned-payment relativity.
    rerate_billing_plan: >-
      The re-rated package plan credit follows the billing plan of the term: the Cardinal Point Paid-in-Full Plan
      carries 0.94, the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan carries
      0.97, and every other plan carries no re-rated package plan credit.
    rerate_plan_credit: >-
      The re-rated package plan credit follows the billing plan of the term: the Cardinal Point Paid-in-Full Plan
      carries 0.94, the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan carries
      0.97, and every other plan carries no re-rated package plan credit.
    realignment_fr44: >-
      When a DUI-related FR-44 Operator certificate requirement of the named insured is recorded, an FR-44 Operator
      Certificate filing of the named insured whose status is requested, filed or rejected, while the term carries
      a package that does not accept a DUI or DWI conviction within 60 months, the term is realigned mid-term to
      Cardinal Point Non-Owner 100/300/50, the highest package that accepts such a conviction and lists both Florida
      and Virginia among its FR-44 states, provided the named insured's violation points do not exceed that package's
      new-business maximum of 12; its full-term premium is re-rated by this rule and the change takes effect on
      the day it is made and never earlier; every other mid-term package change still takes effect on the requested
      date, never earlier, and is still refused when it would leave an FR-44 Operator certificate backed by a package
      outside fr44_filing_states.
    realignment_due: >-
      When a DUI-related FR-44 Operator certificate requirement of the named insured is recorded, an FR-44 Operator
      Certificate filing of the named insured whose status is requested, filed or rejected, while the term carries
      a package that does not accept a DUI or DWI conviction within 60 months, the term is realigned mid-term to
      Cardinal Point Non-Owner 100/300/50, the highest package that accepts such a conviction and lists both Florida
      and Virginia among its FR-44 states, provided the named insured's violation points do not exceed that package's
      new-business maximum of 12; its full-term premium is re-rated by this rule and the change takes effect on
      the day it is made and never earlier; every other mid-term package change still takes effect on the requested
      date, never earlier, and is still refused when it would leave an FR-44 Operator certificate backed by a package
      outside fr44_filing_states.
    rerate_state_factor: >-
      The re-rated package base rate is the company's six-month base rate of the package rated: Cardinal Point Non-Owner
      Minimum Limits 520.00, Cardinal Point Non-Owner Minimum Limits with UM 610.00, Cardinal Point Non-Owner 50/100/50
      760.00, Cardinal Point Non-Owner 100/200/50 880.00, Cardinal Point Non-Owner 100/300/50 950.00, Cardinal Point
      Non-Owner 250/500/100 1180.00; the state factor is the residence state's: FL 1.00, VA 0.94, TX 1.08, GA 1.05,
      AZ 0.97, OH 0.88; the re-rated package points class factor follows the named insured's violation points on
      the term: 10 or more points 1.50, 6 to 9 points 1.28, 3 to 5 points 1.12, and 0 to 2 points 1.00.
    rerate_points_class: >-
      The re-rated package base rate is the company's six-month base rate of the package rated: Cardinal Point Non-Owner
      Minimum Limits 520.00, Cardinal Point Non-Owner Minimum Limits with UM 610.00, Cardinal Point Non-Owner 50/100/50
      760.00, Cardinal Point Non-Owner 100/200/50 880.00, Cardinal Point Non-Owner 100/300/50 950.00, Cardinal Point
      Non-Owner 250/500/100 1180.00; the state factor is the residence state's: FL 1.00, VA 0.94, TX 1.08, GA 1.05,
      AZ 0.97, OH 0.88; the re-rated package points class factor follows the named insured's violation points on
      the term: 10 or more points 1.50, 6 to 9 points 1.28, 3 to 5 points 1.12, and 0 to 2 points 1.00.
    rerate_current_base: >-
      The re-rated package base follows when in the term the realignment is made, the days run counting from the
      term's effective date, which is included, to the day of the change, which is excluded, and the days remaining
      from the day of the change, which is included, to the expiration date, which is excluded: a change made with
      fewer than 15 days remaining keeps for the whole term the higher of the current package's base rate and the
      new package's base rate; a change made more than 60 days after the effective date with 15 or more days remaining
      re-rates the term by the day, the base being the current package's base rate multiplied by the days run plus
      the new package's base rate multiplied by the days remaining, divided by the term's days; any other change
      re-rates the whole term on the new package's base rate.
    rerate_days_run: >-
      The re-rated package base follows when in the term the realignment is made, the days run counting from the
      term's effective date, which is included, to the day of the change, which is excluded, and the days remaining
      from the day of the change, which is included, to the expiration date, which is excluded: a change made with
      fewer than 15 days remaining keeps for the whole term the higher of the current package's base rate and the
      new package's base rate; a change made more than 60 days after the effective date with 15 or more days remaining
      re-rates the term by the day, the base being the current package's base rate multiplied by the days run plus
      the new package's base rate multiplied by the days remaining, divided by the term's days; any other change
      re-rates the whole term on the new package's base rate.
    rerate_days_remaining: >-
      The re-rated package base follows when in the term the realignment is made, the days run counting from the
      term's effective date, which is included, to the day of the change, which is excluded, and the days remaining
      from the day of the change, which is included, to the expiration date, which is excluded: a change made with
      fewer than 15 days remaining keeps for the whole term the higher of the current package's base rate and the
      new package's base rate; a change made more than 60 days after the effective date with 15 or more days remaining
      re-rates the term by the day, the base being the current package's base rate multiplied by the days run plus
      the new package's base rate multiplied by the days remaining, divided by the term's days; any other change
      re-rates the whole term on the new package's base rate.
    rerate_base: >-
      The re-rated package base follows when in the term the realignment is made, the days run counting from the
      term's effective date, which is included, to the day of the change, which is excluded, and the days remaining
      from the day of the change, which is included, to the expiration date, which is excluded: a change made with
      fewer than 15 days remaining keeps for the whole term the higher of the current package's base rate and the
      new package's base rate; a change made more than 60 days after the effective date with 15 or more days remaining
      re-rates the term by the day, the base being the current package's base rate multiplied by the days run plus
      the new package's base rate multiplied by the days remaining, divided by the term's days; any other change
      re-rates the whole term on the new package's base rate.
    rerate_combined: >-
      The re-rated package adjustments below are applied to that standard figure in this order: an adjustment that
      changes how a quantity of the standard figure is worked out replaces that quantity first, then every adjustment
      stated as a relativity or credit is multiplied into one combined relativity that multiplies the figure once,
      and the rounding to the cent comes last, on the final figure only.
    result: >-
      The re-rated package full-term premium is the re-rated package base multiplied by the state factor, by the
      re-rated package points class factor and by the term's months over six, rounded half up to the cent on the
      final figure only; the standard re-rated package base is the base rate of Cardinal Point Non-Owner 100/300/50
      for the whole term.
  factors:
  - id: rerate_filer_class
    effect: parameter
    decides: rerate_filer_class
    bindings:
    - rerate_fr44_active
    - rerate_sr22_active
    - rerate_filer_class
    ladder:
    - when: an FR-44 Operator requirement AND 6 or more violation points
      value: K('filer_fr44_high')
    - when: an FR-44 Operator requirement AND fewer than 6 violation points
      value: K('filer_fr44_low')
    - when: an SR-22 Operator requirement (no FR-44) AND 6 or more violation points
      value: K('filer_sr22_high')
    - when: an SR-22 Operator requirement (no FR-44) AND fewer than 6 violation points
      value: K('filer_sr22_low')
    - when: otherwise (no such requirement)
      value: '1.0'
    baseline:
      rerate_filer_class: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: fr
  - id: rerate_lapse_relativity
    effect: parameter
    decides: rerate_lapse_relativity
    bindings:
    - rerate_lapse_attested_start
    - rerate_lapse_days
    - rerate_lapse_relativity
    ladder:
    - when: a lapse of six days or more, both ends counted
      value: K('rel_lapse_long')
    - when: a lapse of three to five days
      value: K('rel_lapse_mid')
    - when: otherwise (no lapse, one or two days, or a lapse window already ended)
      value: '1.0'
    baseline:
      rerate_lapse_relativity: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: rerate_nonpay_relativity
    effect: parameter
    decides: rerate_nonpay_relativity
    bindings:
    - rerate_nonpay_cancel_date
    - rerate_nonpay_months
    - rerate_nonpay_relativity
    ladder:
    - when: a cancellation for nonpayment fewer than three whole months before the rating date
      value: K('rel_nonpay_recent')
    - when: one three to five whole months before
      value: K('rel_nonpay_later')
    - when: otherwise (none, or six or more whole months before)
      value: '1.0'
    baseline:
      rerate_nonpay_relativity: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: rerate_return_relativity
    effect: parameter
    decides: rerate_return_relativity
    bindings:
    - rerate_returns_in_window
    - rerate_return_relativity
    ladder:
    - when: two or more payments returned unpaid within twelve whole months
      value: K('rel_nsf_two')
    - when: exactly one
      value: K('rel_nsf_one')
    - when: otherwise (none)
      value: '1.0'
    baseline:
      rerate_return_relativity: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: billing
  - id: rerate_plan_credit
    effect: parameter
    decides: rerate_plan_credit
    bindings:
    - rerate_billing_plan
    - rerate_plan_credit
    ladder:
    - when: the term is billed on the Cardinal Point Paid-in-Full Plan
      value: K('credit_pif')
    - when: on the Monthly EFT or Monthly Card Autopay Plan
      value: K('credit_autopay')
    - when: otherwise
      value: '1.0'
    baseline:
      rerate_plan_credit: '1.0'
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: rerate_change_basis
    effect: method
    decides: rerate_base
    bindings:
    - rerate_current_base
    - rerate_days_run
    - rerate_days_remaining
    - rerate_base
    ladder:
    - when: fewer than 15 days remaining
      method: the higher of the current and the new package's base rates, for the whole term
    - when: more than 60 days run AND 15 or more days remaining
      method: >-
        by the day: current base for the days run plus new base for the days remaining, over the term's days
    - when: otherwise (60 days or fewer run, 15 or more remaining)
      method: 'flat: the new package''s base rate for the whole term'
    baseline:
      rerate_base: K('rate_p100_300')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
