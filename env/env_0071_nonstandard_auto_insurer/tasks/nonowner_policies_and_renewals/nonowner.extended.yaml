  trigger: on_request
  subject:
  - nonowner_cancelled_insured_request
  - nonowner_return_premium
  computes: return_amount
  target_tool: cancel_nonowner_term_6aabad38
  params:
    relief_requirement: 0.5
    relief_replaced: 0.75
    scale_early: 1.5
    scale_late: 0.5
    share_early: 0.25
    share_late: 0.5
    origin_new: 1.25
    origin_late: 1.1
    plan_pif: 0.8
    plan_autopay: 0.9
  rule: >-
    The return on a cancellation at the named insured's request is the requested-cancellation unearned premium reduced
    by the requested-cancellation retention percentage of itself, and fees are not returned; for a nonpayment, underwriting
    or conversion cancellation the unearned premium is still computed transaction by transaction exactly as for
    the Owner Auto Policy, each premium written and additional premium row multiplied by the days from the cancellation
    effective date to expiration and divided by that row's premium_days (term_days for premium written), less the
    same share of earlier returns, with no retention, and a term voided from inception still returns everything
    written. The requested-cancellation return is fixed only after the term's premium ledger carries a premium-written
    entry for the term. The requested-cancellation unearned days run from the cancellation effective date to the
    term's expiration date, counting the cancellation effective date and not the expiration date; the cancellation
    effective date is the requested date on the signed request when that is on or after the date the request was
    received, and otherwise the received date. The requested-cancellation unearned premium is the premium written
    on the term multiplied by the requested-cancellation unearned days and divided by the days recorded on the latest
    premium-written entry (the term's days when that entry records none), plus the additional premium on the term
    multiplied by the same unearned days and divided by the days recorded on the latest additional-premium entry,
    less the earlier returns on the term multiplied by the same unearned days and divided by the days recorded on
    the latest return entry, each share being taken only where such entries exist; where two entries of a kind share
    the latest processing date, the one recorded first gives the days. The requested-cancellation retention percentage
    is the package's insured-cancellation retention percentage. The requested-cancellation return is the requested-cancellation
    unearned premium less the requested-cancellation retention percentage of itself, rounded half up to the cent
    on the final figure only; when the unearned days come to zero nothing is returned and the cancellation books
    no return entry; otherwise the return is booked as one return entry for the cancellation at the insured's request,
    dated from the cancellation effective date, with the unearned days used as its days. The requested-cancellation
    adjustments below are applied to these standard figures in this order: a changed count of unearned days replaces
    the standard count before the unearned premium is figured, and every retention multiplier is multiplied into
    the package's retention percentage before the reduction is taken. The named insured's Operator certificate on
    file is the SR-22 Operator Certificate or FR-44 Operator Certificate filing of the named insured whose status
    is filed, the FR-44 one when both are filed and the one recorded first when two of a form are filed; a certificate
    whose SR-26 has been sent has status cancellation_filed and is not on file; Owner and Owner-Operator certificates
    are not Operator certificates, and the term's own record of the certificate it was written to back is not read.
    The requirement-completion multiplier of the retention: a request whose reason is that the requirement ended,
    from a named insured whose Operator certificate on file carries a required-through date on or before the cancellation
    effective date, multiplies the retention by 0.5; a request whose reason is replacement with other insurance,
    from a named insured with no Operator certificate on file, multiplies it by 0.75; every other request leaves
    the retention unchanged. The elapsed-term multiplier of the retention follows the share of the term already
    run at the cancellation effective date, the days from the term's effective date to the cancellation effective
    date divided by the term's days: a share under one quarter multiplies the retention by 1.5, a share of one half
    or more multiplies it by 0.5, and a share from one quarter to under one half leaves it unchanged. The term-origin
    multiplier of the retention follows how the term was written, read from the reason on its latest premium-written
    entry, the one recorded first when two share the latest processing date: a new-business term multiplies the
    retention by 1.25; a renewal term on which a lapse is recorded, so that it was accepted after its expiring term's
    expiration, multiplies it by 1.10; a renewal accepted on time, or a term with no premium-written entry, leaves
    it unchanged. The plan multiplier of the retention follows the billing plan of the term: the Cardinal Point
    Paid-in-Full Plan multiplies the retention by 0.80, the Cardinal Point Monthly EFT Plan or the Cardinal Point
    Monthly Card Autopay Plan multiplies it by 0.90, and every other plan leaves it unchanged. The unearned days
    shorten while the company stays certified to the state: when the named insured has an Operator certificate on
    file, the unearned days are reduced by the filing charter's SR-26 transmission days plus its certificate run-off
    days for that certificate; when the named insured's Operator certificate has had its SR-26 sent (status cancellation_filed,
    the FR-44 one when both forms have), the unearned days run from the later of the cancellation effective date
    and that certificate's end date to the expiration date; with neither, the unearned days stand; in every case
    the unearned days are never fewer than zero.
  prerequisite:
  - problem: nonowner_ext_late_renewal_written
    kind: value_input
    gate: written_premium_on_term
    form: state
    policy_source: >-
      The requested-cancellation return is fixed only after the term's premium ledger carries a premium-written
      entry for the term.
    condition: >-
      nonowner_premium_transactions holds a row with event_type nonowner_premium_written for the term
    resolved_by: book_renewal_written_premium_ed68a083
    effect: >-
      the premium written on the term and the days recorded on the latest premium-written entry, which the unearned
      premium is figured from, take the booked entry's amount and days instead of nothing
  cross_category:
  - category: fr
    as: branch
    reads:
    - variant_name
    - status
    - required_through_date
    - certificate_end_date
    - sr26_transmit_within_days
    - certificate_runoff_days
    note: >-
      requirement-completion multiplier and the run-off method read the named insured's Operator certificate
  - category: billing
    as: branch
    reads:
    - variant_name
    - nonowner_policy_id
    note: plan multiplier of the retention reads the term's billing plan
  compute:
  - requested_date: >-
      LATEST('nonowner_cancellation_requests','requested_effective_date', date_field='request_received_date', request_status='confirmed_by_insured')
  - received_date: >-
      LATEST('nonowner_cancellation_requests','request_received_date', date_field='request_received_date', request_status='confirmed_by_insured')
  - request_reason: >-
      LATEST('nonowner_cancellation_requests','request_reason', date_field='request_received_date', request_status='confirmed_by_insured')
  - cancellation_date: MX(requested_date, received_date)
  - standard_unearned_days: DAYS(cancellation_date, F('expiration_date'))
  - operator_certificate_on_file: >-
      CFIELD('fr','variant_name', variant_name='FR-44 Operator Certificate', status='filed') or CFIELD('fr','variant_name',
      variant_name='SR-22 Operator Certificate', status='filed')
  - certificate_required_through: >-
      CFIELD('fr','required_through_date', variant_name=operator_certificate_on_file, status='filed') if operator_certificate_on_file
      else ''
  - requirement_relief: >-
      K('relief_requirement') if (request_reason == 'requirement_ended' and certificate_required_through and certificate_required_through
      <= cancellation_date) else (K('relief_replaced') if (request_reason == 'replaced_with_other_insurance' and
      not operator_certificate_on_file) else 1.0)
  - elapsed_share: DAYS(F('effective_date'), cancellation_date) / F('term_days')
  - elapsed_term_scale: >-
      K('scale_early') if elapsed_share < K('share_early') else (K('scale_late') if elapsed_share >= K('share_late')
      else 1.0)
  - certificate_runoff: >-
      (CPARAM('fr','sr26_transmit_within_days', variant_name=operator_certificate_on_file, status='filed') + CPARAM('fr','certificate_runoff_days',
      variant_name=operator_certificate_on_file, status='filed')) if operator_certificate_on_file else 0
  - sent_certificate_end: >-
      CFIELD('fr','certificate_end_date', variant_name='FR-44 Operator Certificate', status='cancellation_filed')
      or CFIELD('fr','certificate_end_date', variant_name='SR-22 Operator Certificate', status='cancellation_filed')
  - unearned_days: >-
      MX(0, (standard_unearned_days - certificate_runoff) if operator_certificate_on_file else (DAYS(MX(cancellation_date,
      sent_certificate_end), F('expiration_date')) if sent_certificate_end else standard_unearned_days))
  - written_premium_on_term: SUM('nonowner_premium_transactions','amount', event_type='nonowner_premium_written')
  - written_entry_days: >-
      LATEST('nonowner_premium_transactions','premium_days', date_field='transaction_date', event_type='nonowner_premium_written')
  - additional_on_term: SUM('nonowner_premium_transactions','amount', event_type='nonowner_additional_premium')
  - additional_entry_days: >-
      LATEST('nonowner_premium_transactions','premium_days', date_field='transaction_date', event_type='nonowner_additional_premium')
  - returns_on_term: SUM('nonowner_premium_transactions','amount', event_type='nonowner_return_premium')
  - return_entry_days: >-
      LATEST('nonowner_premium_transactions','premium_days', date_field='transaction_date', event_type='nonowner_return_premium')
  - unearned_premium: >-
      written_premium_on_term * unearned_days / (written_entry_days if written_entry_days else F('term_days')) +
      ((additional_on_term * unearned_days / additional_entry_days) if (additional_on_term and additional_entry_days)
      else 0) - ((returns_on_term * unearned_days / return_entry_days) if (returns_on_term and return_entry_days)
      else 0)
  - term_origin_reason: >-
      LATEST('nonowner_premium_transactions','transaction_reason', date_field='transaction_date', event_type='nonowner_premium_written')
  - term_origin_scale: >-
      K('origin_new') if term_origin_reason == 'new_business' else (K('origin_late') if (term_origin_reason == 'renewal'
      and F('lapse_start_date')) else 1.0)
  - cancel_billing_plan: CFIELD('billing','variant_name', nonowner_policy_id=HID)
  - plan_retention_scale: >-
      K('plan_pif') if cancel_billing_plan == 'Cardinal Point Paid-in-Full Plan' else (K('plan_autopay') if (cancel_billing_plan
      == 'Cardinal Point Monthly EFT Plan' or cancel_billing_plan == 'Cardinal Point Monthly Card Autopay Plan')
      else 1.0)
  - retention_pct: >-
      P('insured_cancel_short_rate_retention_pct') * requirement_relief * elapsed_term_scale * term_origin_scale
      * plan_retention_scale
  - result: RND(unearned_premium * (1 - retention_pct / 100), 2)
