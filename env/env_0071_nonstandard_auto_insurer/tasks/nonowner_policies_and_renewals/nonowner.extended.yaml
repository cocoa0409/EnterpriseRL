- id: nonowner_ext_reinstatement_rewritten
  base_policy_refs:
  - nonowner_reinstatement
  - nonowner_premium_charging
  overwrite:
  - base_policy: nonowner_reinstatement
    superseded_clause: >-
      Re-written premium is the cancellation return premium multiplied by the days from the reinstatement effective
      date to expiration and divided by that return's premium_days, rounded to the cent.
    replaced_by: >-
      The premium re-written on a reinstatement with a lapse is worked out by this rule; on a reinstatement without
      lapse the re-written premium is still the cancellation return premium multiplied by the days from the reinstatement
      effective date to expiration and divided by that return's premium_days, rounded to the cent.
  trigger: state_due
  subject:
  - nonowner_additional_premium
  computes: rewritten_amount
  target_tool: book_reinstatement_rewritten_premium_bf43cbc7
  params:
    lapse_long_days: 6
    lapse_mid_days: 3
    rel_lapse_long: 1.12
    rel_lapse_mid: 1.06
    rel_nsf_two: 1.08
    rel_nsf_one: 1.04
    credit_pif: 0.94
    credit_autopay: 0.97
    window_months: 12
  rule: >-
    The premium re-written on a reinstatement with a lapse is worked out by this rule; on a reinstatement without
    lapse the re-written premium is still the cancellation return premium multiplied by the days from the reinstatement
    effective date to expiration and divided by that return's premium_days, rounded to the cent. The reinstatement
    re-write premium is the nonpayment cancellation return booked on the term multiplied by the reinstatement re-write
    days and divided by the days recorded on that return, rounded half up to the cent on the final figure only;
    the reinstatement re-write days run from the reinstatement effective date, which is included, to the term's
    expiration date, which is excluded; where two such returns share the latest processing date the one recorded
    first gives the days, and a term with no nonpayment cancellation return booked owes no re-write, so nothing
    is booked; the premium is booked as one additional-premium entry for the reinstatement dated from the reinstatement
    effective date with the re-write days as its days. The reinstatement re-write adjustments below are applied
    to that standard figure in this order: an adjustment that changes how a quantity of the standard figure is worked
    out replaces that quantity first, then every adjustment stated as a relativity or credit is multiplied into
    one combined relativity that multiplies the figure once, and the rounding to the cent comes last, on the final
    figure only. The reinstatement re-write lapse relativity follows the lapse recorded on the term, its days counted
    from the first lapse day attested on the latest Statement of No Loss signed for the term (the one recorded first
    when two share the latest document date) through the last lapse day recorded on the term, both included, a lapse
    with no such statement counting no days: six days or more carry 1.12, three to five days carry 1.06, and one
    or two days carry no reinstatement re-write lapse relativity. The reinstatement re-write returned-payment relativity
    counts the payments returned unpaid on any billing plan of the named insured whose posting date lies fewer than
    twelve whole months before the processing date, a month being complete on the same day of the following month:
    two or more carry 1.08, exactly one carries 1.04, and none carries no reinstatement re-write returned-payment
    relativity. The reinstatement re-write plan credit follows the billing plan of the term: the Cardinal Point
    Paid-in-Full Plan carries 0.94, the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay
    Plan carries 0.97, and every other plan carries no reinstatement re-write plan credit. The reinstatement re-write
    basis follows the company's exposure during the lapse, read from the named insured's SR-22 or FR-44 Operator
    certificate that was on file during the lapse: the FR-44 form is read before the SR-22 form, and for a form
    the filings tried are, in this order, its filed filing recorded first, its cancellation_filed filing recorded
    first and its terminated filing recorded first, the first of these whose filing date is on or before the first
    lapse day being the one read; its certified-through date is the earlier of its required-through date and its
    certificate end date, a date not recorded leaving the other, and there is none when neither is recorded: when
    its certified-through date is on or after the last lapse day or there is none, the company stayed certified
    on every lapse day and the whole nonpayment cancellation return is re-written as a flat amount, booked from
    the cancellation effective date with that return's days as its days; when its certified-through date is on or
    after the first lapse day but before the last lapse day, the company stayed certified only through that date,
    so the charged days are the return's days less the lapse days after the certified-through date, those days running
    from the day after the certified-through date, which is included, to the last lapse day, which is included;
    the amount re-written is the return multiplied by the charged days and divided by the return's days, booked
    from the cancellation effective date with the charged days as its days; in every other case, including no such
    certificate, the per-day re-write stands, so no lapse day is re-written.
  prerequisite: []
  cross_category:
  - category: billing
    as: history
    reads:
    - billing_transactions.event_type
    - billing_transactions.posted_date
    - variant_name
    note: returned-payment relativity and plan credit
  - category: fr
    as: branch
    reads:
    - certificate_end_date
    - filed_date
    - filing_state
    - required_through_date
    - status
    - variant_name
    note: the re-write basis reads the Operator certificate on file
  compute:
  - lapse_reinstatement: 1 if (F('reinstatement_type') == 'with_lapse' and F('lapse_start_date')) else 0
  - nonpayment_return_booked: >-
      SUM('nonowner_premium_transactions','amount', event_type='nonowner_return_premium', transaction_reason='cancellation_nonpayment')
  - nonpayment_return_days: >-
      LATEST('nonowner_premium_transactions','premium_days', date_field='transaction_date', event_type='nonowner_return_premium',
      transaction_reason='cancellation_nonpayment')
  - days_from_reinstatement: DAYS(F('reinstatement_date'), F('expiration_date')) if F('reinstatement_date') else
      0
  - per_day_rewrite: >-
      (nonpayment_return_booked * days_from_reinstatement / nonpayment_return_days) if (nonpayment_return_booked
      and nonpayment_return_days) else 0
  - rewrite_lapse_attested_start: >-
      LATEST('nonowner_documents','lapse_period_start', date_field='document_date', event_type='nonowner_no_loss_statement')
  - rewrite_lapse_days: >-
      (DAYS(rewrite_lapse_attested_start, F('lapse_end_date')) + 1) if (COUNT('nonowner_documents', event_type='nonowner_no_loss_statement')
      and rewrite_lapse_attested_start and F('lapse_end_date')) else 0
  - rewrite_lapse_relativity: >-
      (K('rel_lapse_long') if rewrite_lapse_days >= K('lapse_long_days') else (K('rel_lapse_mid') if rewrite_lapse_days
      >= K('lapse_mid_days') else 1.0)) if (rewrite_lapse_days >= 1) else 1.0
  - rewrite_returns_in_window: >-
      XCOUNT('billing','billing_transactions', within_months=K('window_months'), date_field='posted_date', event_type='billing_payment_returned')
  - rewrite_return_relativity: >-
      K('rel_nsf_two') if rewrite_returns_in_window >= 2 else (K('rel_nsf_one') if rewrite_returns_in_window ==
      1 else 1.0)
  - rewrite_billing_plan: CFIELD('billing','variant_name', nonowner_policy_id=HID)
  - rewrite_plan_credit: >-
      K('credit_pif') if rewrite_billing_plan == 'Cardinal Point Paid-in-Full Plan' else (K('credit_autopay') if
      (rewrite_billing_plan == 'Cardinal Point Monthly EFT Plan' or rewrite_billing_plan == 'Cardinal Point Monthly
      Card Autopay Plan') else 1.0)
  - rewrite_cert_pick: >-
      1 if (CFIELD('fr','filed_date', variant_name='FR-44 Operator Certificate', status='filed') and CFIELD('fr','filed_date',
      variant_name='FR-44 Operator Certificate', status='filed') <= F('lapse_start_date')) else (2 if (CFIELD('fr','filed_date',
      variant_name='FR-44 Operator Certificate', status='cancellation_filed') and CFIELD('fr','filed_date', variant_name='FR-44
      Operator Certificate', status='cancellation_filed') <= F('lapse_start_date')) else (3 if (CFIELD('fr','filed_date',
      variant_name='FR-44 Operator Certificate', status='terminated') and CFIELD('fr','filed_date', variant_name='FR-44
      Operator Certificate', status='terminated') <= F('lapse_start_date')) else (4 if (CFIELD('fr','filed_date',
      variant_name='SR-22 Operator Certificate', status='filed') and CFIELD('fr','filed_date', variant_name='SR-22
      Operator Certificate', status='filed') <= F('lapse_start_date')) else (5 if (CFIELD('fr','filed_date', variant_name='SR-22
      Operator Certificate', status='cancellation_filed') and CFIELD('fr','filed_date', variant_name='SR-22 Operator
      Certificate', status='cancellation_filed') <= F('lapse_start_date')) else (6 if (CFIELD('fr','filed_date',
      variant_name='SR-22 Operator Certificate', status='terminated') and CFIELD('fr','filed_date', variant_name='SR-22
      Operator Certificate', status='terminated') <= F('lapse_start_date')) else 0)))))
  - rewrite_certificate_filed_on: >-
      CFIELD('fr','filed_date', variant_name=('FR-44 Operator Certificate' if rewrite_cert_pick <= 3 else 'SR-22
      Operator Certificate'), status=('filed' if (rewrite_cert_pick == 1 or rewrite_cert_pick == 4) else ('cancellation_filed'
      if (rewrite_cert_pick == 2 or rewrite_cert_pick == 5) else 'terminated'))) if rewrite_cert_pick else ''
  - rewrite_cert_required_through: >-
      CFIELD('fr','required_through_date', variant_name=('FR-44 Operator Certificate' if rewrite_cert_pick <= 3
      else 'SR-22 Operator Certificate'), status=('filed' if (rewrite_cert_pick == 1 or rewrite_cert_pick == 4)
      else ('cancellation_filed' if (rewrite_cert_pick == 2 or rewrite_cert_pick == 5) else 'terminated'))) if rewrite_cert_pick
      else ''
  - rewrite_cert_end: >-
      CFIELD('fr','certificate_end_date', variant_name=('FR-44 Operator Certificate' if rewrite_cert_pick <= 3 else
      'SR-22 Operator Certificate'), status=('filed' if (rewrite_cert_pick == 1 or rewrite_cert_pick == 4) else
      ('cancellation_filed' if (rewrite_cert_pick == 2 or rewrite_cert_pick == 5) else 'terminated'))) if rewrite_cert_pick
      else ''
  - rewrite_certificate_through: >-
      MN(rewrite_cert_required_through, rewrite_cert_end) if (rewrite_cert_required_through and rewrite_cert_end)
      else (rewrite_cert_required_through or rewrite_cert_end or '')
  - rewrite_amount_basis: >-
      (nonpayment_return_booked if (not rewrite_certificate_through or rewrite_certificate_through >= F('lapse_end_date'))
      else ((nonpayment_return_booked * (nonpayment_return_days - DAYS(rewrite_certificate_through, F('lapse_end_date')))
      / nonpayment_return_days) if (rewrite_certificate_through >= F('lapse_start_date') and nonpayment_return_days)
      else per_day_rewrite)) if (rewrite_certificate_filed_on and lapse_reinstatement and rewrite_certificate_filed_on
      <= F('lapse_start_date')) else per_day_rewrite
  - rewrite_combined: rewrite_lapse_relativity * rewrite_return_relativity * rewrite_plan_credit
  - result: >-
      RND(rewrite_amount_basis * rewrite_combined, 2) if lapse_reinstatement else RND(per_day_rewrite, 2)
  compute_basis:
    rewrite_lapse_attested_start: >-
      The reinstatement re-write lapse relativity follows the lapse recorded on the term, its days counted from
      the first lapse day attested on the latest Statement of No Loss signed for the term (the one recorded first
      when two share the latest document date) through the last lapse day recorded on the term, both included, a
      lapse with no such statement counting no days: six days or more carry 1.12, three to five days carry 1.06,
      and one or two days carry no reinstatement re-write lapse relativity.
