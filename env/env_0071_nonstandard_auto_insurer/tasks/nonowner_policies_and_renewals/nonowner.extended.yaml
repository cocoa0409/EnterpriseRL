    - billing_plans.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.nonowner_policy_id: nonowner_policy_id
    state_contract:
      field: billing_plans.status
      allowed:
      - current
      - paid_in_full
  - id: dishonored
    applies_to:
