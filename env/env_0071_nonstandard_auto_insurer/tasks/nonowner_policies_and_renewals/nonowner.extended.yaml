    rewrite_returns_in_window: >-
      The reinstatement re-write returned-payment relativity counts the payments returned unpaid on any billing
      plan of the named insured whose posting date lies fewer than twelve whole months before the processing date,
      a month being complete on the same day of the following month: two or more carry 1.08, exactly one carries
      1.04, and none carries no reinstatement re-write returned-payment relativity.
    rewrite_return_relativity: >-
      The reinstatement re-write returned-payment relativity counts the payments returned unpaid on any billing
      plan of the named insured whose posting date lies fewer than twelve whole months before the processing date,
