  factors:
  - id: rewrite_lapse_relativity
    effect: parameter
    decides: rewrite_lapse_relativity
    bindings:
    - rewrite_lapse_attested_start
    - rewrite_lapse_days
    - rewrite_lapse_relativity
    ladder:
    - when: a lapse of six days or more, both ends counted
      value: K('rel_lapse_long')
    - when: a lapse of three to five days
      value: K('rel_lapse_mid')
    - when: otherwise (one or two days)
      value: '1.0'
    baseline:
      rewrite_lapse_relativity: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: rewrite_return_relativity
    effect: parameter
    decides: rewrite_return_relativity
    bindings:
    - rewrite_returns_in_window
    - rewrite_return_relativity
    ladder:
    - when: two or more payments returned unpaid within twelve whole months
      value: K('rel_nsf_two')
    - when: exactly one
      value: K('rel_nsf_one')
    - when: otherwise (none)
      value: '1.0'
    baseline:
      rewrite_return_relativity: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: billing
  - id: rewrite_plan_credit
    effect: parameter
    decides: rewrite_plan_credit
    bindings:
    - rewrite_billing_plan
    - rewrite_plan_credit
    ladder:
    - when: the term is billed on the Cardinal Point Paid-in-Full Plan
      value: K('credit_pif')
    - when: on the Monthly EFT or Monthly Card Autopay Plan
      value: K('credit_autopay')
    - when: otherwise
      value: '1.0'
    baseline:
      rewrite_plan_credit: '1.0'
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: rewrite_exposure_basis
    effect: method
    decides: rewrite_amount_basis
    bindings:
    - rewrite_cert_pick
    - rewrite_certificate_filed_on
    - rewrite_cert_required_through
    - rewrite_cert_end
    - rewrite_certificate_through
    - rewrite_amount_basis
    ladder:
    - when: >-
        an Operator certificate on file during the lapse, filed on or before the first lapse day, AND its certified-through
        date on or after the last lapse day or none
      method: 'flat: the whole nonpayment cancellation return is re-written'
    - when: >-
        such a certificate AND its certified-through date on or after the first lapse day but before the last lapse
        day
      method: >-
        certified-days amount: return times the return's days less the lapse days after the certified-through date,
        over the return's days
    - when: otherwise
      method: 'per-day: return times re-write days over the return''s days'
    baseline:
      rewrite_amount_basis: per_day_rewrite
    evidence:
    - cross_category
    - date
    cross_difficulty: fr
