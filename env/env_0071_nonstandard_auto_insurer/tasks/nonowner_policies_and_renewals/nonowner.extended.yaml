    rewrite_billing_plan: >-
      The reinstatement re-write plan credit follows the billing plan of the term: the Cardinal Point Paid-in-Full
      Plan carries 0.94, the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan carries
      0.97, and every other plan carries no reinstatement re-write plan credit.
    rewrite_plan_credit: >-
