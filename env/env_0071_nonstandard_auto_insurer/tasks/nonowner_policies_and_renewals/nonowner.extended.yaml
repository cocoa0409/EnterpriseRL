  overwrite:
  - base_policy: nonowner_premium_charging
    superseded_clause: >-
      A limits increase charges the full-term premium difference prorated over term_days from its effective date;
      a reinstatement re-writes premium under nonowner_reinstatement.
    replaced_by: >-
      The additional premium for a package change during the term is worked out by this rule and booked as one additional-premium
      entry whose reason names the direction of the change: limits_increase for a move to a package with a higher
      six-month base rate and limits_decrease for a move to a package with a lower one; a move to a lower base rate
      whose increase charge by this rule is above zero is charged as additional premium and not returned, and only
      such a move; every other move to a lower base rate still returns unearned premium as a return-premium entry
      for the limits decrease, and a reinstatement still re-writes premium under the reinstatement rule.
