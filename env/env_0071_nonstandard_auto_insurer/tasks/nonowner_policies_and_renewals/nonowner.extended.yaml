- id: nonowner_lapse_attestation
  subject:
  - nonowner_no_loss_statement
  - nonowner_limits_changed
  rule: A Statement of No Loss is taken only for a nonpayment cancellation being reinstated with a lapse
    or a renewal accepted after expiration. The named insured personally attests whether any accident,
    loss or claim occurred during the lapse period. It covers the lapse from its first day through the
    signing date; when a loss is reported, no_loss_attested is false and the statement supports nothing.
    A mid-term package change takes effect on the requested date, never earlier, and is refused when it
    would leave an FR-44 Operator certificate backed by a package outside fr44_filing_states.
  eligibility:
  - id: attests
    applies_to:
    - nonowner_no_loss_statement
    kind: caller_fact
