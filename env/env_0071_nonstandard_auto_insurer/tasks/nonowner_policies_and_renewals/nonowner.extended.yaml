      the lapse period.
    evidence_fields:
    - nonowner_documents.no_loss_attested
    - nonowner_documents.nonowner_policy_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - nonowner_documents.nonowner_policy_id
      action_bindings:
        nonowner_documents.nonowner_policy_id: nonowner_policy_id
extended_policies:
- id: nonowner_ext_late_renewal_written
  base_policy_refs:
  - nonowner_premium_charging
  - nonowner_renewal
  - nonowner_lapse_attestation
  overwrite:
  - base_policy: nonowner_premium_charging
    superseded_clause: Premium written equals full_term_premium, once at binding and once at renewal acceptance.
    replaced_by: >-
      Premium written on a renewal term that goes in force after its expiring term's expiration date, so that a
      lapse is recorded on the renewal term, is worked out by this rule and only for such a renewal term; premium
      written at binding and on a renewal accepted on or before the expiring term's expiration date still equals
      full_term_premium, once at binding and once at renewal acceptance, and a renewal term with no lapse recorded
      keeps that figure.
  trigger: state_due
  subject:
  - nonowner_premium_written
  computes: written_amount
  target_tool: book_renewal_written_premium_ed68a083
  params:
    filer_fr44_high: 1.35
    filer_fr44_low: 1.25
    filer_sr22_high: 1.15
    filer_sr22_low: 1.08
    filer_points: 6
    lapse_long_days: 6
    lapse_mid_days: 3
    rel_lapse_long: 1.12
    rel_lapse_mid: 1.06
    credit_pif: 0.94
    credit_autopay: 0.97
  rule: >-
    Premium written on a renewal term that goes in force after its expiring term's expiration date, so that a lapse
    is recorded on the renewal term, is worked out by this rule and only for such a renewal term; premium written
    at binding and on a renewal accepted on or before the expiring term's expiration date still equals full_term_premium,
    once at binding and once at renewal acceptance, and a renewal term with no lapse recorded keeps that figure.
    The late-renewal rated premium is the renewal term's recorded full-term premium, the premium its renewal offer
    was issued at and rated on the records of the offer's issue date, the renewal term's opened date; what changed
    after that date is carried by the adjustments below. The late-renewal written premium is the late-renewal rated
    premium multiplied by the late-renewal charging share, rounded half up to the cent on the final figure only;
    the standard late-renewal charging share is the late-renewal days in force divided by the renewal term's days,
    the days in force running from the in-force date, the day after the last lapse day recorded on the renewal term,
    which is included, to the renewal term's expiration date, which is excluded; the premium is booked as one premium-written
    entry for the renewal dated from the in-force date with the days in force as its days. The late-renewal adjustments
    below are applied to that standard figure in this order: an adjustment that changes how a quantity of the standard
    figure is worked out replaces that quantity first, then every adjustment stated as a relativity or credit is
    multiplied into one combined relativity that multiplies the figure once, and the rounding to the cent comes
    last, on the final figure only. The late-renewal filer change carries the change in the named insured's Operator
    certificate requirement since the renewal term was issued, which the recorded premium does not carry. The requirement
    counted is the named insured's Operator certificate requirement, an SR-22 Operator Certificate or FR-44 Operator
    Certificate filing of the named insured: for each form the filing read is its requested filing, otherwise its
    filed one, otherwise its rejected one, the one recorded first within a status, and that filing counts when its
    required-through date is on or after the renewal term's effective date or is not recorded, no other filing of
    the form being read when it does not; when both forms count the FR-44 one counts; withdrawn, terminated and
    cancellation_filed filings, Owner and Owner-Operator certificates, and the term's own record of the certificate
    it was written to back are not counted; the class of a requirement is: an FR-44 requirement with 6 or more violation
    points carries 1.35, an FR-44 requirement with fewer carries 1.25, an SR-22 requirement with 6 or more violation
    points carries 1.15, an SR-22 requirement with fewer carries 1.08. When the counted requirement was requested
    after the renewal term's issue date, its class is added; when an SR-22 or FR-44 Operator certificate of the
    named insured that the offer carried had its SR-26 sent after the issue date, the class of its form at the named
    insured's violation points is removed, the FR-44 form being tested first and then the SR-22 form: for a form
    the certificate read is its cancellation_filed filing recorded first and, when that one does not qualify, its
    terminated filing recorded first, and a certificate read qualifies when it was requested on or before the issue
    date, its required-through date is on or after the renewal term's effective date or is not recorded, and its
    SR-26 date is after the issue date; the late-renewal filer change is the added class divided by the removed
    class, either being one when there is none, and a requirement counted that was requested on or before the issue
    date is already in the recorded premium and carries no late-renewal filer change. The late-renewal lapse relativity
    follows the lapse recorded on the renewal term, its days counted from the first lapse day attested on the latest
    Statement of No Loss signed for the renewal term (the one recorded first when two share the latest document
    date) through the last lapse day recorded on the renewal term, both included, a lapse with no such statement
    counting no days: six days or more carry 1.12, three to five days carry 1.06, and one or two days carry no late-renewal
    lapse relativity. The late-renewal plan change carries a change of billing plan since the offer, which was rated
    with the plan credit of the expiring term's billing plan: the plan credit is 0.94 for the Cardinal Point Paid-in-Full
    Plan, 0.97 for the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan and 1.00
    for every other plan, and the late-renewal plan change is the plan credit of the renewal term's billing plan
    divided by the plan credit of the expiring term's billing plan, the expiring term being the one the renewal
    term was issued from; the same credit carries no late-renewal plan change. The late-renewal charging basis follows
    the company's exposure during the lapse, read from the named insured's SR-22 or FR-44 Operator certificate that
    was on file during the lapse: the FR-44 form is read before the SR-22 form, and for a form the filings tried
    are, in this order, its filed filing recorded first, its cancellation_filed filing recorded first and its terminated
    filing recorded first, the first of these whose filing date is on or before the first lapse day being the one
    read; its certified-through date is the earlier of its required-through date and its certificate end date, a
    date not recorded leaving the other, and there is none when neither is recorded: when its certified-through
    date is on or after the last lapse day or there is none, the company stayed certified on every lapse day, the
    charging share is one, a flat full-term charge, and the entry is booked from the renewal term's effective date
    with the renewal term's days as its days; when its certified-through date is on or after the first lapse day
    but before the last lapse day, the company stayed certified only through that date, so the charged days are
    the renewal term's days less the lapse days after the certified-through date, those days running from the day
    after the certified-through date, which is included, to the last lapse day, which is included; the charging
    share is the charged days divided by the renewal term's days and the entry is booked from the renewal term's
    effective date with the charged days as its days; in every other case, including no such certificate, the standard
    charging share stands, so no lapse day is charged.
  prerequisite: []
  cross_category:
  - category: billing
    as: branch
    reads:
    - variant_name
    - nonowner_policy_id
    note: plan change reads the renewal and expiring terms' billing plans
  - category: fr
    as: branch
    reads:
    - certificate_end_date
    - filed_date
    - filing_state
    - requested_date
    - required_through_date
    - sr26_date
    - status
    - variant_name
    note: filer change and the charging basis read the Operator certificate
  compute:
  - lapse_recorded: 1 if (F('lapse_start_date') and F('lapse_end_date')) else 0
  - late_fr44_active: >-
      1 if (((CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested') and (not
      CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate', status='requested') or CFIELD('fr','required_through_date',
      variant_name='FR-44 Operator Certificate', status='requested') >= F('effective_date'))) or (not CFIELD('fr','filing_state',
      variant_name='FR-44 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='FR-44
      Operator Certificate', status='filed') and (not CFIELD('fr','required_through_date', variant_name='FR-44 Operator
      Certificate', status='filed') or CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate',
      status='filed') >= F('effective_date'))) or (not CFIELD('fr','filing_state', variant_name='FR-44 Operator
      Certificate', status='requested') and not CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate',
      status='filed') and CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='rejected')
      and (not CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate', status='rejected')
      or CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate', status='rejected') >= F('effective_date')))))
      else 0
  - late_sr22_active: >-
      1 if (((CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='requested') and (not
      CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate', status='requested') or CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='requested') >= F('effective_date'))) or (not CFIELD('fr','filing_state',
      variant_name='SR-22 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='SR-22
      Operator Certificate', status='filed') and (not CFIELD('fr','required_through_date', variant_name='SR-22 Operator
      Certificate', status='filed') or CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate',
      status='filed') >= F('effective_date'))) or (not CFIELD('fr','filing_state', variant_name='SR-22 Operator
      Certificate', status='requested') and not CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate',
      status='filed') and CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='rejected')
      and (not CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate', status='rejected')
      or CFIELD('fr','required_through_date', variant_name='SR-22 Operator Certificate', status='rejected') >= F('effective_date'))))
      and not late_fr44_active) else 0
  - late_counted_requested: >-
      ((late_fr44_active and CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested')
      and CFIELD('fr','requested_date', variant_name='FR-44 Operator Certificate', status='requested')) or (late_fr44_active
      and not CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='requested') and CFIELD('fr','filing_state',
      variant_name='FR-44 Operator Certificate', status='filed') and CFIELD('fr','requested_date', variant_name='FR-44
      Operator Certificate', status='filed')) or (late_fr44_active and not CFIELD('fr','filing_state', variant_name='FR-44
      Operator Certificate', status='requested') and not CFIELD('fr','filing_state', variant_name='FR-44 Operator
      Certificate', status='filed') and CFIELD('fr','filing_state', variant_name='FR-44 Operator Certificate', status='rejected')
      and CFIELD('fr','requested_date', variant_name='FR-44 Operator Certificate', status='rejected'))) or ((late_sr22_active
      and CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='requested') and CFIELD('fr','requested_date',
      variant_name='SR-22 Operator Certificate', status='requested')) or (late_sr22_active and not CFIELD('fr','filing_state',
      variant_name='SR-22 Operator Certificate', status='requested') and CFIELD('fr','filing_state', variant_name='SR-22
      Operator Certificate', status='filed') and CFIELD('fr','requested_date', variant_name='SR-22 Operator Certificate',
      status='filed')) or (late_sr22_active and not CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate',
      status='requested') and not CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='filed')
      and CFIELD('fr','filing_state', variant_name='SR-22 Operator Certificate', status='rejected') and CFIELD('fr','requested_date',
      variant_name='SR-22 Operator Certificate', status='rejected'))) or ''
  - late_filer_class: >-
      K('filer_fr44_high') if (late_fr44_active and F('violation_points') >= K('filer_points')) else (K('filer_fr44_low')
      if (late_fr44_active and F('violation_points') < K('filer_points')) else (K('filer_sr22_high') if (late_sr22_active
      and F('violation_points') >= K('filer_points')) else (K('filer_sr22_low') if (late_sr22_active and F('violation_points')
      < K('filer_points')) else 1.0)))
  - late_released_form: >-
      'FR-44 Operator Certificate' if ((CFIELD('fr','sr26_date', variant_name='FR-44 Operator Certificate', status='cancellation_filed')
      and CFIELD('fr','sr26_date', variant_name='FR-44 Operator Certificate', status='cancellation_filed') > F('opened_date')
      and CFIELD('fr','requested_date', variant_name='FR-44 Operator Certificate', status='cancellation_filed')
      <= F('opened_date') and (not CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate',
      status='cancellation_filed') or CFIELD('fr','required_through_date', variant_name='FR-44 Operator Certificate',
      status='cancellation_filed') >= F('effective_date'))) or (CFIELD('fr','sr26_date', variant_name='FR-44 Operator
      Certificate', status='terminated') and CFIELD('fr','sr26_date', variant_name='FR-44 Operator Certificate',
      status='terminated') > F('opened_date') and CFIELD('fr','requested_date', variant_name='FR-44 Operator Certificate',
      status='terminated') <= F('opened_date') and (not CFIELD('fr','required_through_date', variant_name='FR-44
      Operator Certificate', status='terminated') or CFIELD('fr','required_through_date', variant_name='FR-44 Operator
      Certificate', status='terminated') >= F('effective_date')))) else ('SR-22 Operator Certificate' if ((CFIELD('fr','sr26_date',
      variant_name='SR-22 Operator Certificate', status='cancellation_filed') and CFIELD('fr','sr26_date', variant_name='SR-22
      Operator Certificate', status='cancellation_filed') > F('opened_date') and CFIELD('fr','requested_date', variant_name='SR-22
      Operator Certificate', status='cancellation_filed') <= F('opened_date') and (not CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='cancellation_filed') or CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='cancellation_filed') >= F('effective_date'))) or (CFIELD('fr','sr26_date',
      variant_name='SR-22 Operator Certificate', status='terminated') and CFIELD('fr','sr26_date', variant_name='SR-22
      Operator Certificate', status='terminated') > F('opened_date') and CFIELD('fr','requested_date', variant_name='SR-22
      Operator Certificate', status='terminated') <= F('opened_date') and (not CFIELD('fr','required_through_date',
      variant_name='SR-22 Operator Certificate', status='terminated') or CFIELD('fr','required_through_date', variant_name='SR-22
      Operator Certificate', status='terminated') >= F('effective_date')))) else '')
  - late_released_class: >-
      K('filer_fr44_high') if (late_released_form == 'FR-44 Operator Certificate' and F('violation_points') >= K('filer_points'))
      else (K('filer_fr44_low') if (late_released_form == 'FR-44 Operator Certificate' and F('violation_points')
      < K('filer_points')) else (K('filer_sr22_high') if (late_released_form == 'SR-22 Operator Certificate' and
      F('violation_points') >= K('filer_points')) else (K('filer_sr22_low') if (late_released_form == 'SR-22 Operator
      Certificate' and F('violation_points') < K('filer_points')) else 1.0)))
  - late_filer_change: >-
      (late_filer_class if (late_counted_requested and late_counted_requested > F('opened_date')) else 1.0) / late_released_class
  - late_lapse_attested_start: >-
      LATEST('nonowner_documents','lapse_period_start', date_field='document_date', event_type='nonowner_no_loss_statement')
  - late_lapse_days: >-
      (DAYS(late_lapse_attested_start, F('lapse_end_date')) + 1) if (COUNT('nonowner_documents', event_type='nonowner_no_loss_statement')
      and late_lapse_attested_start and F('lapse_end_date')) else 0
  - late_lapse_relativity: >-
      (K('rel_lapse_long') if late_lapse_days >= K('lapse_long_days') else (K('rel_lapse_mid') if late_lapse_days
      >= K('lapse_mid_days') else 1.0)) if (late_lapse_days >= 1) else 1.0
  - late_billing_plan: CFIELD('billing','variant_name', nonowner_policy_id=HID)
  - late_offer_plan: CFIELD('billing','variant_name', nonowner_policy_id=F('prior_nonowner_term_id'))
  - late_new_credit: >-
      (K('credit_pif') if late_billing_plan == 'Cardinal Point Paid-in-Full Plan' else (K('credit_autopay') if (late_billing_plan
      == 'Cardinal Point Monthly EFT Plan' or late_billing_plan == 'Cardinal Point Monthly Card Autopay Plan') else
      1.0))
  - late_offer_credit: >-
      (K('credit_pif') if late_offer_plan == 'Cardinal Point Paid-in-Full Plan' else (K('credit_autopay') if (late_offer_plan
      == 'Cardinal Point Monthly EFT Plan' or late_offer_plan == 'Cardinal Point Monthly Card Autopay Plan') else
      1.0))
  - late_plan_change: late_new_credit / late_offer_credit
  - late_rated_premium: F('full_term_premium') * late_filer_change * late_lapse_relativity * late_plan_change
  - late_days_in_force: >-
      (DAYS(F('lapse_end_date'), F('expiration_date')) - 1) if lapse_recorded else F('term_days')
  - late_standard_share: late_days_in_force / F('term_days')
  - late_cert_pick: >-
      1 if (CFIELD('fr','filed_date', variant_name='FR-44 Operator Certificate', status='filed') and CFIELD('fr','filed_date',
      variant_name='FR-44 Operator Certificate', status='filed') <= F('lapse_start_date')) else (2 if (CFIELD('fr','filed_date',
      variant_name='FR-44 Operator Certificate', status='cancellation_filed') and CFIELD('fr','filed_date', variant_name='FR-44
      Operator Certificate', status='cancellation_filed') <= F('lapse_start_date')) else (3 if (CFIELD('fr','filed_date',
      variant_name='FR-44 Operator Certificate', status='terminated') and CFIELD('fr','filed_date', variant_name='FR-44
      Operator Certificate', status='terminated') <= F('lapse_start_date')) else (4 if (CFIELD('fr','filed_date',
      variant_name='SR-22 Operator Certificate', status='filed') and CFIELD('fr','filed_date', variant_name='SR-22
      Operator Certificate', status='filed') <= F('lapse_start_date')) else (5 if (CFIELD('fr','filed_date', variant_name='SR-22
      Operator Certificate', status='cancellation_filed') and CFIELD('fr','filed_date', variant_name='SR-22 Operator
      Certificate', status='cancellation_filed') <= F('lapse_start_date')) else (6 if (CFIELD('fr','filed_date',
      variant_name='SR-22 Operator Certificate', status='terminated') and CFIELD('fr','filed_date', variant_name='SR-22
      Operator Certificate', status='terminated') <= F('lapse_start_date')) else 0)))))
  - late_certificate_filed: >-
      CFIELD('fr','filed_date', variant_name=('FR-44 Operator Certificate' if late_cert_pick <= 3 else 'SR-22 Operator
      Certificate'), status=('filed' if (late_cert_pick == 1 or late_cert_pick == 4) else ('cancellation_filed'
      if (late_cert_pick == 2 or late_cert_pick == 5) else 'terminated'))) if late_cert_pick else ''
  - late_cert_required_through: >-
      CFIELD('fr','required_through_date', variant_name=('FR-44 Operator Certificate' if late_cert_pick <= 3 else
      'SR-22 Operator Certificate'), status=('filed' if (late_cert_pick == 1 or late_cert_pick == 4) else ('cancellation_filed'
      if (late_cert_pick == 2 or late_cert_pick == 5) else 'terminated'))) if late_cert_pick else ''
  - late_cert_end: >-
      CFIELD('fr','certificate_end_date', variant_name=('FR-44 Operator Certificate' if late_cert_pick <= 3 else
      'SR-22 Operator Certificate'), status=('filed' if (late_cert_pick == 1 or late_cert_pick == 4) else ('cancellation_filed'
      if (late_cert_pick == 2 or late_cert_pick == 5) else 'terminated'))) if late_cert_pick else ''
  - late_certificate_through: >-
      MN(late_cert_required_through, late_cert_end) if (late_cert_required_through and late_cert_end) else (late_cert_required_through
      or late_cert_end or '')
  - late_charge_share: >-
      (1.0 if (not late_certificate_through or late_certificate_through >= F('lapse_end_date')) else ((F('term_days')
      - DAYS(late_certificate_through, F('lapse_end_date'))) / F('term_days') if late_certificate_through >= F('lapse_start_date')
      else late_standard_share)) if (late_certificate_filed and lapse_recorded and late_certificate_filed <= F('lapse_start_date'))
      else late_standard_share
  - result: >-
      RND(late_rated_premium * late_charge_share, 2) if lapse_recorded else F('full_term_premium')
  compute_basis:
    lapse_recorded: >-
      Premium written on a renewal term that goes in force after its expiring term's expiration date, so that a
      lapse is recorded on the renewal term, is worked out by this rule and only for such a renewal term; premium
      written at binding and on a renewal accepted on or before the expiring term's expiration date still equals
      full_term_premium, once at binding and once at renewal acceptance, and a renewal term with no lapse recorded
      keeps that figure.
    late_fr44_active: >-
      The late-renewal filer change carries the change in the named insured's Operator certificate requirement since
      the renewal term was issued, which the recorded premium does not carry. The requirement counted is the named
      insured's Operator certificate requirement, an SR-22 Operator Certificate or FR-44 Operator Certificate filing
      of the named insured: for each form the filing read is its requested filing, otherwise its filed one, otherwise
      its rejected one, the one recorded first within a status, and that filing counts when its required-through
      date is on or after the renewal term's effective date or is not recorded, no other filing of the form being
      read when it does not; when both forms count the FR-44 one counts; withdrawn, terminated and cancellation_filed
      filings, Owner and Owner-Operator certificates, and the term's own record of the certificate it was written
      to back are not counted; the class of a requirement is: an FR-44 requirement with 6 or more violation points
      carries 1.35, an FR-44 requirement with fewer carries 1.25, an SR-22 requirement with 6 or more violation
      points carries 1.15, an SR-22 requirement with fewer carries 1.08. When the counted requirement was requested
      after the renewal term's issue date, its class is added; when an SR-22 or FR-44 Operator certificate of the
      named insured that the offer carried had its SR-26 sent after the issue date, the class of its form at the
      named insured's violation points is removed, the FR-44 form being tested first and then the SR-22 form: for
      a form the certificate read is its cancellation_filed filing recorded first and, when that one does not qualify,
      its terminated filing recorded first, and a certificate read qualifies when it was requested on or before
      the issue date, its required-through date is on or after the renewal term's effective date or is not recorded,
      and its SR-26 date is after the issue date; the late-renewal filer change is the added class divided by the
      removed class, either being one when there is none, and a requirement counted that was requested on or before
      the issue date is already in the recorded premium and carries no late-renewal filer change.
    late_sr22_active: >-
      The late-renewal filer change carries the change in the named insured's Operator certificate requirement since
      the renewal term was issued, which the recorded premium does not carry. The requirement counted is the named
      insured's Operator certificate requirement, an SR-22 Operator Certificate or FR-44 Operator Certificate filing
      of the named insured: for each form the filing read is its requested filing, otherwise its filed one, otherwise
      its rejected one, the one recorded first within a status, and that filing counts when its required-through
      date is on or after the renewal term's effective date or is not recorded, no other filing of the form being
      read when it does not; when both forms count the FR-44 one counts; withdrawn, terminated and cancellation_filed
      filings, Owner and Owner-Operator certificates, and the term's own record of the certificate it was written
      to back are not counted; the class of a requirement is: an FR-44 requirement with 6 or more violation points
      carries 1.35, an FR-44 requirement with fewer carries 1.25, an SR-22 requirement with 6 or more violation
      points carries 1.15, an SR-22 requirement with fewer carries 1.08. When the counted requirement was requested
      after the renewal term's issue date, its class is added; when an SR-22 or FR-44 Operator certificate of the
      named insured that the offer carried had its SR-26 sent after the issue date, the class of its form at the
      named insured's violation points is removed, the FR-44 form being tested first and then the SR-22 form: for
      a form the certificate read is its cancellation_filed filing recorded first and, when that one does not qualify,
      its terminated filing recorded first, and a certificate read qualifies when it was requested on or before
      the issue date, its required-through date is on or after the renewal term's effective date or is not recorded,
      and its SR-26 date is after the issue date; the late-renewal filer change is the added class divided by the
      removed class, either being one when there is none, and a requirement counted that was requested on or before
      the issue date is already in the recorded premium and carries no late-renewal filer change.
