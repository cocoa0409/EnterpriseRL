      after that date is carried by the adjustments below. The late-renewal written premium is the late-renewal
      rated premium multiplied by the late-renewal charging share, rounded half up to the cent on the final figure
      only; the standard late-renewal charging share is the late-renewal days in force divided by the renewal term's
      days, the days in force running from the in-force date, the day after the last lapse day recorded on the renewal
      term, which is included, to the renewal term's expiration date, which is excluded; the premium is booked as
      one premium-written entry for the renewal dated from the in-force date with the days in force as its days.
