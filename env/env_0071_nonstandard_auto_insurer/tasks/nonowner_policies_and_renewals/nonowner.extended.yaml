    lapse_reinstatement: >-
      The premium re-written on a reinstatement with a lapse is worked out by this rule; on a reinstatement without
      lapse the re-written premium is still the cancellation return premium multiplied by the days from the reinstatement
      effective date to expiration and divided by that return's premium_days, rounded to the cent.
    nonpayment_return_booked: >-
      The reinstatement re-write premium is the nonpayment cancellation return booked on the term multiplied by
      the reinstatement re-write days and divided by the days recorded on that return, rounded half up to the cent
      on the final figure only; the reinstatement re-write days run from the reinstatement effective date, which
      is included, to the term's expiration date, which is excluded; where two such returns share the latest processing
      date the one recorded first gives the days, and a term with no nonpayment cancellation return booked owes
      no re-write, so nothing is booked; the premium is booked as one additional-premium entry for the reinstatement
      dated from the reinstatement effective date with the re-write days as its days.
