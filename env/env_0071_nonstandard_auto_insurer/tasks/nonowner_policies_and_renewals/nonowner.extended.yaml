# Policy charter: Named Non-Owner Policy (category key: nonowner).
category: nonowner
display_name: Named Non-Owner Policy
binding:
  holding_table: nonowner_policies
  event_tables:
  - nonowner_premium_transactions
  - nonowner_documents
  intake_tables:
  - nonowner_cancellation_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    term_written_premium: written_premium
    term_fees_charged: policy_fees
lifecycle:
  states:
  - bound
  - renewal_offered
  - in_force
  - pending_cancellation
  - cancelled
  - expired
  - not_taken
  transitions:
  - from: bound
    to: in_force
    by: system
    means: The down payment clears.
  - from: bound
    to: cancelled
    by: agent
    means: The dishonored down payment voids the term from inception.
  - from: renewal_offered
    to: in_force
    by: agent
    means: The renewal down payment is received.
  - from: renewal_offered
    to: not_taken
    by: system
    means: The renewal offer closes unpaid.
  - from: in_force
    to: pending_cancellation
    by: agent
    means: A notice of cancellation for nonpayment is mailed.
  - from: pending_cancellation
    to: in_force
    by: agent
    means: The minimum due arrives in time.
  - from: pending_cancellation
    to: cancelled
    by: agent
    means: The notice takes effect, or an earlier conversion or insured request does.
  - from: in_force
    to: cancelled
    by: user
    means: The named insured's signed cancellation request takes effect.
  - from: in_force
    to: cancelled
    by: agent
    means: The term is replaced by an owner policy or cancelled for an underwriting reason.
  - from: in_force
    to: expired
    by: system
    means: The term reaches expiration.
  - from: cancelled
    to: in_force
    by: agent
    means: A nonpayment cancellation is reinstated.
accounts:
- key: written_premium
  unit: USD
  meaning: Net premium written on the non-owner term.
- key: policy_fees
  unit: USD
  meaning: Fully earned fees on the non-owner term net of reversals.
parameter_schema:
  bi_per_person_limit: Bodily injury liability limit per person, USD; state_minimum means the residence
    state's figure in the Owner Auto Policy charter's state_minimum_limits.
  bi_per_accident_limit: Bodily injury liability limit per accident, USD; state_minimum as above.
  pd_per_accident_limit: Property damage liability limit per accident, USD; state_minimum as above.
  state_minimum_source: Schedule the state_minimum value refers to (single source).
  fr44_limits_source: Schedule giving the FR-44 limits (single source).
  um_uim_bi_basis: How uninsured/underinsured motorist bodily injury is carried.
  medpay_limit: Medical payments limit per person, USD (0 = not included).
  coverage_basis: How the coverage responds when the named insured drives a non-owned vehicle.
  physical_damage_available: 'Whether damage to the vehicle driven is covered (false: liability-only product).'
  additional_drivers_allowed: 'Whether any driver other than the named insured is covered or listed (false:
    the named insured only).'
  rental_vehicle_max_days: Longest continuous rental of a car for which the policy responds, calendar
    days.
  rideshare_delivery_use_covered: Whether driving for a ride-hailing or delivery platform is covered (true/false).
  coverage_territory: Where the coverage applies.
  term_options_months: Term lengths written, in months.
  max_violation_points_new_business: Maximum company violation points of the named insured accepted at
    binding or on a mid-term package change.
  max_violation_points_renewal: Maximum company violation points accepted when a renewal is offered.
  dui_within_60_months_accepted: Whether a DUI/DWI conviction within 60 months is acceptable (true/false).
  min_years_licensed: Minimum years the named insured has held a license.
  license_status_accepted: License status accepted at binding.
  owned_vehicle_disqualifies: Whether owning, leasing or co-owning any registered vehicle makes the named
    insured ineligible (true/false).
  regular_use_days_per_week_max: A household or employer vehicle available to the named insured on more
    than this many days in a calendar week counts as regular use and makes the named insured ineligible.
  household_vehicle_exception: Condition under which a household-owned vehicle does not bar eligibility.
  non_owner_statement_required: Whether the Non-Owner Statement (no owned vehicle, no regular use) signed
    by the named insured is required at binding and at every renewal (true/false).
  non_owner_statement_max_age_days: Maximum calendar days between the signing of the Non-Owner Statement
    and the effective date of the term it supports.
  sr22_filing_accepted: Whether the package may back an SR-22 Operator certificate (true/false).
  fr44_filing_states: States in which the package may back an FR-44 Operator certificate.
  policy_fee_new_business: Fully earned policy fee on a new-business term, USD.
  policy_fee_renewal: Fully earned policy fee on an accepted renewal term, USD.
  reinstatement_fee: Fully earned fee for each reinstatement with a lapse, USD.
  nonpay_notice_days_source: Schedule of minimum notice days for cancellation for nonpayment (single source).
  nonpay_notice_issue_days_after_due: Calendar days after an unpaid installment's due date on which the
    notice of cancellation for nonpayment is mailed.
  nonpay_minimum_unpaid_amount: Smallest past-due amount for which a notice of cancellation is issued,
    USD.
  reinstatement_window_days: Calendar days after the cancellation effective date during which a nonpayment
    cancellation may be reinstated with a lapse.
  max_lapse_reinstatements_per_term: Maximum reinstatements with a lapse within one term.
  no_loss_statement_max_age_days: Maximum calendar days between the Statement of No Loss signing date
    and the processing of the reinstatement or late renewal.
  reinstatement_effective_offset_days: Days added to the later of the payment posting date and the Statement
    of No Loss signing date to give the reinstatement effective date.
  postmark_receipt_days: Calendar days after the cancellation effective date within which a payment postmarked
    on or before it must be received to count as on time.
  insured_cancel_short_rate_retention_pct: Percent of the unearned premium retained on a named-insured
    cancellation request (0.0 = pro rata).
  conversion_refund_method: Return-premium method when the term is cancelled because it is replaced by
    a Cardinal Point Owner Auto Policy.
  conversion_cancel_effective_rule: Cancellation date used when the term is replaced by an Owner Auto
    Policy.
  refund_issue_days: Calendar days after a cancellation within which unearned premium is credited to the
    billing plan.
  renewal_offer_days_before_expiration: Calendar days before expiration on which the renewal term is issued.
  late_renewal_window_days: Calendar days after expiration during which the renewal down payment is still
    accepted, renewing with a lapse.
  nonrenewal_notice_days_source: Schedule of minimum nonrenewal notice days (single source).
  underwriting_period_source: Schedule of new-business underwriting periods (single source).
  underwriting_notice_days_source: Schedule of advance notice days for underwriting cancellations (single
    source).
  underwriting_cancel_reasons_after_period: Underwriting reasons for which an in-force term may be cancelled
    after the underwriting period.
  term_days_basis: Day count for pro rata arithmetic.
  premium_rounding: Rounding of every premium or refund.
