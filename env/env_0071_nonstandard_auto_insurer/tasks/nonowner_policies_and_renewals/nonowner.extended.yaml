    nonowner_policy_id
policies:
- id: nonowner_agg_multi_holding
  subject:
  - nonowner_new_business
  - nonowner_renewal_issued
  rule: A named insured may hold only one Named Non-Owner Policy term that is open (bound, in_force or
    pending_cancellation); a renewal_offered term replaces its expiring term and does not count separately.
    The named insured must not already hold an open Named Non-Owner Policy term. A Named Non-Owner Policy
    is not bound while the named insured holds an open Owner Auto Policy term. Owning a vehicle and holding
    an owner policy are mutually exclusive with this product; the only overlap allowed is the conversion
    day, on which the non-owner term is cancelled effective the owner term's effective date.
  eligibility:
  - id: one_open_term
    applies_to:
    - nonowner_new_business
    kind: authorization
    condition: The named insured must not already hold an open Named Non-Owner Policy term.
    evidence_fields:
    - nonowner_policies.status
    - nonowner_policies.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.customer_id
      action_bindings:
        nonowner_policies.customer_id: customer_id
  - id: no_open_owner_policy
    applies_to:
    - nonowner_new_business
    kind: authorization
    condition: A Named Non-Owner Policy is not bound while the named insured holds an open Owner Auto
      Policy term.
    evidence_fields:
    - auto_policies.status
    - auto_policies.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policies.customer_id
      action_bindings:
        auto_policies.customer_id: customer_id
  params:
    max_per_customer: 1
- id: nonowner_eligibility
  subject:
  - nonowner_new_business
  - nonowner_statement_signed
  - nonowner_limits_changed
  rule: The Named Non-Owner Policy covers only the named insured, only while driving vehicles they do
    not own and do not regularly use, excess over any insurance on the vehicle driven. The named insured
    personally signs the Non-Owner Statement, answering whether they own, lease or co-own any registered
    vehicle and whether any household or employer vehicle is available to them on more than regular_use_days_per_week_max
    days in a calendar week. A term is bound only on a Non-Owner Statement with owns_or_leases_vehicle
    false, and no later than non_owner_statement_max_age_days calendar days after the Non-Owner Statement
    was signed. Calendar days are counted from the signing date as day 0; binding on or before the signing
    date plus the allowed days qualifies. When household_vehicle_regular_use is true, the term is bound
    only if the named insured is a named excluded driver on the policy insuring that household vehicle.
    When that household vehicle is insured on a Cardinal Point Owner Auto Policy, the exclusion is read
    from that policy's driver changes; otherwise the customer must show the other insurer's exclusion,
    which the desk cannot verify and refers. The named insured's violation points must not exceed the
    package's max_points. A DUI/DWI conviction within 60 months is acceptable only where dui_accepted
    is true, and the named insured must have been licensed min_years_licensed years. An SR-22 Operator
    certificate may be backed by any package with sr22_filing_accepted; an FR-44 Operator certificate
    only where the residence state is in fr44_filing_states. A mid-term package change meets the same
    limits.
  eligibility:
  - id: insured_signs
    applies_to:
    - nonowner_statement_signed
    kind: caller_fact
    condition: The named insured personally signs the Non-Owner Statement, answering whether they own,
      lease or co-own any registered vehicle and whether any household or employer vehicle is available
      to them on more than regular_use_days_per_week_max days in a calendar week.
    evidence_fields:
    - nonowner_documents.owns_or_leases_vehicle
    - nonowner_documents.household_vehicle_regular_use
    - nonowner_documents.nonowner_policy_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - nonowner_documents.nonowner_policy_id
      action_bindings:
        nonowner_documents.nonowner_policy_id: nonowner_policy_id
  - id: statement_fresh
    applies_to:
    - nonowner_new_business
    kind: time
    condition: A term is bound only on a Non-Owner Statement with owns_or_leases_vehicle false, and no
      later than non_owner_statement_max_age_days calendar days after the Non-Owner Statement was signed.
    evidence_fields:
    - nonowner_documents.owns_or_leases_vehicle
    - nonowner_documents.event_type
    - nonowner_documents.document_date
    - nonowner_documents.nonowner_document_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_documents.nonowner_document_id
      action_bindings:
        nonowner_documents.nonowner_document_id: nonowner_document_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the Non-Owner Statement was signed
      anchor_source: nonowner_documents.document_date
      relation: not_after
      duration_source: variants.non_owner_statement_max_age_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the signing date as day 0; binding on or before the
        signing date plus the allowed days qualifies.
      boundary: inclusive
  - id: household_exclusion
    applies_to:
    - nonowner_new_business
    kind: authorization
    condition: When household_vehicle_regular_use is true, the term is bound only if the named insured
      is a named excluded driver on the policy insuring that household vehicle.
    evidence_fields:
    - nonowner_documents.household_vehicle_regular_use
    - auto_policy_changes.driver_name
    - auto_policy_changes.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.driver_name
      action_bindings:
        auto_policy_changes.driver_name: driver_name
  - id: points
    applies_to:
    - nonowner_new_business
    - nonowner_limits_changed
    kind: authorization
    condition: The named insured's violation points must not exceed the package's max_points.
    evidence_fields:
    - nonowner_policies.violation_points
    - nonowner_policies.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.nonowner_policy_id
      action_bindings:
        nonowner_policies.nonowner_policy_id: nonowner_policy_id
  params:
    per_tier:
      Cardinal Point Non-Owner Minimum Limits:
        max_points: =max_violation_points_new_business
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        fr44_filing_states: =fr44_filing_states
      Cardinal Point Non-Owner Minimum Limits with UM:
        max_points: =max_violation_points_new_business
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        fr44_filing_states: =fr44_filing_states
      Cardinal Point Non-Owner 50/100/50:
        max_points: =max_violation_points_new_business
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        fr44_filing_states: =fr44_filing_states
      Cardinal Point Non-Owner 100/200/50:
        max_points: =max_violation_points_new_business
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        fr44_filing_states: =fr44_filing_states
      Cardinal Point Non-Owner 100/300/50:
        max_points: =max_violation_points_new_business
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        fr44_filing_states: =fr44_filing_states
      Cardinal Point Non-Owner 250/500/100:
        max_points: =max_violation_points_new_business
        dui_accepted: =dui_within_60_months_accepted
        min_years_licensed: =min_years_licensed
        fr44_filing_states: =fr44_filing_states
    regular_use_days_per_week_max: =regular_use_days_per_week_max
- id: nonowner_nonpayment_notice
  subject:
  - nonowner_cancellation_notice
  - nonowner_cancellation_pending
  rule: A notice of cancellation for nonpayment is mailed only when the billing plan of the term is past_due.
    The notice is mailed no earlier than nonpay_notice_issue_days_after_due calendar days after the due
    date of the unpaid installment. Days are counted as calendar days from the due date, the due date
    itself being day 0, so the earliest mailing date is the due date plus the stated number of days. The
    unpaid past-due amount must be at least nonpay_minimum_unpaid_amount; smaller amounts roll into the
    next bill. Only one notice of cancellation is issued per unpaid invoice. The cancellation effective
    date is the mailing date plus the residence state's days in the Owner Auto Policy charter's nonpay_notice_days_by_state,
    and the minimum due is every past-due amount on the plan as of the mailing date. The term moves to
    pending_cancellation the same day.
  eligibility:
  - id: plan_past_due
    applies_to:
    - nonowner_cancellation_notice
    kind: state
    condition: A notice of cancellation for nonpayment is mailed only when the billing plan of the term
      is past_due.
    evidence_fields:
    - billing_plans.status
    - billing_plans.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.nonowner_policy_id: nonowner_policy_id
    state_contract:
      field: billing_plans.status
      allowed:
      - past_due
  - id: notice_timing
    applies_to:
    - nonowner_cancellation_notice
    kind: time
    condition: The notice is mailed no earlier than nonpay_notice_issue_days_after_due calendar days after
      the due date of the unpaid installment.
    evidence_fields:
    - billing_invoices.due_date
    - billing_invoices.billing_invoice_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_invoices.billing_invoice_id
      action_bindings:
        billing_invoices.billing_invoice_id: billing_invoice_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the due date of the unpaid installment
      anchor_source: billing_invoices.due_date
      relation: not_before
      duration_source: variants.nonpay_notice_issue_days_after_due
      unit: calendar_days
      counting_rule: Days are counted as calendar days from the due date, the due date itself being day
        0, so the earliest mailing date is the due date plus the stated number of days.
      boundary: inclusive
  - id: one_notice_per_invoice
    applies_to:
    - nonowner_cancellation_notice
    kind: dedup
    condition: Only one notice of cancellation is issued per unpaid invoice.
    evidence_fields:
    - nonowner_documents.event_type
    - nonowner_documents.unpaid_invoice_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_documents.unpaid_invoice_id
      action_bindings:
        nonowner_documents.unpaid_invoice_id: unpaid_invoice_id
    dedup_contract:
      table: nonowner_documents
      mode: separate_record
      object_bindings:
        unpaid_invoice_id: unpaid_invoice_id
      duplicate_filters:
        event_type:
        - nonowner_cancellation_notice
      distinct_fields: []
  params:
    per_tier:
      Cardinal Point Non-Owner Minimum Limits:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point Non-Owner Minimum Limits with UM:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point Non-Owner 50/100/50:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point Non-Owner 100/200/50:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point Non-Owner 100/300/50:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
      Cardinal Point Non-Owner 250/500/100:
        issue_days_after_due: =nonpay_notice_issue_days_after_due
        minimum_unpaid_amount: =nonpay_minimum_unpaid_amount
    nonpay_notice_days_source: =nonpay_notice_days_source
- id: nonowner_nonpayment_outcome
  subject:
  - nonowner_cancellation_rescinded
  - nonowner_cancelled_nonpayment
  rule: 'A pending cancellation is rescinded only when payments posted to the term''s billing plan on
    or before the cancellation effective date total at least the minimum due stated on the notice. A partial
    payment does not rescind. The cancellation for nonpayment is processed no earlier than the cancellation
    effective date stated on the notice. The comparison is made on calendar dates: the processing date
    must be on or after the cancellation effective date itself, with processing_lag_days added. On that
    date, with the minimum due unpaid, coverage ends at 12:01 a.m., closed_date is the cancellation effective
    date, unearned premium is returned pro rata and fees are not returned.'
  eligibility:
  - id: minimum_paid
    applies_to:
    - nonowner_cancellation_rescinded
    kind: authorization
    condition: A pending cancellation is rescinded only when payments posted to the term's billing plan
      on or before the cancellation effective date total at least the minimum due stated on the notice.
    evidence_fields:
    - billing_transactions.posted_date
    - billing_transactions.amount
    - nonowner_policies.minimum_due_on_notice
    - billing_plans.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.nonowner_policy_id: nonowner_policy_id
  - id: on_effective_date
    applies_to:
    - nonowner_cancelled_nonpayment
    kind: time
    condition: The cancellation for nonpayment is processed no earlier than the cancellation effective
      date stated on the notice.
    evidence_fields:
    - nonowner_policies.cancellation_effective_date
    - nonowner_policies.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.nonowner_policy_id
      action_bindings:
        nonowner_policies.nonowner_policy_id: nonowner_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the cancellation effective date stated on the notice
      anchor_source: nonowner_policies.cancellation_effective_date
      relation: not_before
      duration_source: params.processing_lag_days
      unit: calendar_days
      counting_rule: 'The comparison is made on calendar dates: the processing date must be on or after
        the cancellation effective date itself, with processing_lag_days added.'
      boundary: inclusive
  params:
    processing_lag_days: 0
- id: nonowner_reinstatement
  subject:
  - nonowner_reinstated
  rule: 'Only a term whose cancellation_reason is nonpayment can be reinstated. A reinstatement without
    lapse applies only when a mailed payment of at least the minimum due was postmarked on or before the
    cancellation effective date and posted no later than postmark_receipt_days calendar days after it,
    or the cancellation came from a company posting error; it restores the term from the cancellation
    effective date with no fee and no lapse. Otherwise every past-due amount on the billing plan must
    have been paid after the cancellation, and: A reinstatement with lapse is processed no later than
    reinstatement_window_days calendar days after the cancellation effective date. Calendar days are counted
    from the cancellation effective date as day 0, so the last day of the window is the cancellation effective
    date plus the window days. A Statement of No Loss with no_loss_attested true must be on file, and
    the reinstatement is processed no later than no_loss_statement_max_age_days calendar days after the
    Statement of No Loss was signed. Calendar days are counted from the signing date as day 0, and the
    reinstatement must be processed on or before the signing date plus the allowed days. The term must
    have fewer than max_lapse_reinstatements reinstatements with a lapse already, counted by nonowner_msr_lapse_reinstatements_in_term.
    The reinstatement effective date is the later of the posting date of the completing payment and the
    statement signing date, plus reinstatement_effective_offset_days; the lapse runs from the cancellation
    effective date to the day before. Re-written premium is the cancellation return premium multiplied
    by the days from the reinstatement effective date to expiration and divided by that return''s premium_days,
    rounded to the cent. An SR-22 or FR-44 Operator certificate whose SR-26 was already transmitted is
    re-established only by a new filing.'
  eligibility:
  - id: nonpayment_only
    applies_to:
    - nonowner_reinstated
    kind: authorization
    condition: Only a term whose cancellation_reason is nonpayment can be reinstated.
    evidence_fields:
    - nonowner_policies.cancellation_reason
    - nonowner_policies.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.nonowner_policy_id
      action_bindings:
        nonowner_policies.nonowner_policy_id: nonowner_policy_id
  - id: window
    applies_to:
    - nonowner_reinstated
    kind: time
    condition: A reinstatement with lapse is processed no later than reinstatement_window_days calendar
      days after the cancellation effective date.
    evidence_fields:
    - nonowner_policies.cancellation_effective_date
    - nonowner_policies.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.nonowner_policy_id
      action_bindings:
        nonowner_policies.nonowner_policy_id: nonowner_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the cancellation effective date
      anchor_source: nonowner_policies.cancellation_effective_date
      relation: not_after
      duration_source: variants.reinstatement_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the cancellation effective date as day 0, so the last
        day of the window is the cancellation effective date plus the window days.
      boundary: inclusive
  - id: no_loss_statement
    applies_to:
    - nonowner_reinstated
    kind: time
    condition: A Statement of No Loss with no_loss_attested true must be on file, and the reinstatement
      is processed no later than no_loss_statement_max_age_days calendar days after the Statement of No
      Loss was signed.
    evidence_fields:
    - nonowner_documents.no_loss_attested
    - nonowner_documents.document_date
    - nonowner_documents.nonowner_document_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_documents.nonowner_document_id
      action_bindings:
        nonowner_documents.nonowner_document_id: nonowner_document_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the Statement of No Loss was signed
      anchor_source: nonowner_documents.document_date
      relation: not_after
      duration_source: variants.no_loss_statement_max_age_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the signing date as day 0, and the reinstatement must
        be processed on or before the signing date plus the allowed days.
      boundary: inclusive
  - id: count
    applies_to:
    - nonowner_reinstated
    kind: authorization
    condition: The term must have fewer than max_lapse_reinstatements reinstatements with a lapse already,
      counted by nonowner_msr_lapse_reinstatements_in_term.
    evidence_fields:
    - nonowner_premium_transactions.event_type
    - nonowner_premium_transactions.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_premium_transactions.nonowner_policy_id
      action_bindings:
        nonowner_premium_transactions.nonowner_policy_id: nonowner_policy_id
  params:
    per_tier:
      Cardinal Point Non-Owner Minimum Limits:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point Non-Owner Minimum Limits with UM:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point Non-Owner 50/100/50:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point Non-Owner 100/200/50:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point Non-Owner 100/300/50:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
      Cardinal Point Non-Owner 250/500/100:
        window_days: =reinstatement_window_days
        max_lapse_reinstatements: =max_lapse_reinstatements_per_term
    postmark_receipt_days: =postmark_receipt_days
    effective_offset_days: =reinstatement_effective_offset_days
  measures:
  - nonowner_msr_lapse_reinstatements_in_term
- id: nonowner_insured_cancellation
  subject:
  - nonowner_cancelled_insured_request
  rule: A cancellation request confirmed by the named insured's signature must be on file for the term.
    The cancellation never takes effect earlier than the date the request was received. It takes effect
    on the requested date when that is on or after the receipt date, otherwise on the receipt date. The
    return is the pro rata unearned premium reduced by retention_pct of itself; fees are not returned.
    A customer who is cancelling because they bought or leased a vehicle insured with Cardinal Point is
    handled as a conversion instead.
  eligibility:
  - id: signed_request
    applies_to:
    - nonowner_cancelled_insured_request
    kind: authorization
    condition: A cancellation request confirmed by the named insured's signature must be on file for the
      term.
    evidence_fields:
    - nonowner_cancellation_requests.request_status
    - nonowner_cancellation_requests.nonowner_cancel_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_cancellation_requests.nonowner_cancel_request_id
      action_bindings:
        nonowner_cancellation_requests.nonowner_cancel_request_id: nonowner_cancel_request_id
  - id: no_backdating
    applies_to:
    - nonowner_cancelled_insured_request
    kind: authorization
    condition: The cancellation never takes effect earlier than the date the request was received.
    evidence_fields:
    - nonowner_cancellation_requests.request_received_date
    - nonowner_cancellation_requests.requested_effective_date
    - nonowner_cancellation_requests.nonowner_cancel_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_cancellation_requests.nonowner_cancel_request_id
      action_bindings:
        nonowner_cancellation_requests.nonowner_cancel_request_id: nonowner_cancel_request_id
  params:
    per_tier:
      Cardinal Point Non-Owner Minimum Limits:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point Non-Owner Minimum Limits with UM:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point Non-Owner 50/100/50:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point Non-Owner 100/200/50:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point Non-Owner 100/300/50:
        retention_pct: =insured_cancel_short_rate_retention_pct
      Cardinal Point Non-Owner 250/500/100:
        retention_pct: =insured_cancel_short_rate_retention_pct
- id: nonowner_conversion
  subject:
  - nonowner_cancelled_conversion
  rule: 'When the named insured buys or leases a vehicle and insures it on a Cardinal Point Owner Auto
    Policy, the non-owner term is cancelled as a conversion. A conversion cancellation is processed only
    after an Owner Auto Policy term of the same named insured has been bound. The cancellation takes effect
    on the effective date of the replacing owner term (even when that date is earlier than the processing
    date), converted_to_auto_policy_id records that term, and the unearned premium is returned pro rata
    with no short-rate retention. An SR-22 or FR-44 Operator certificate on the non-owner term is not
    moved: the owner term needs its own Owner-Operator filing, and the operator certificate receives its
    SR-26 under the filing rules.'
  eligibility:
  - id: owner_term_bound
    applies_to:
    - nonowner_cancelled_conversion
    kind: state
    condition: A conversion cancellation is processed only after an Owner Auto Policy term of the same
      named insured has been bound.
    evidence_fields:
    - auto_policies.status
    - nonowner_policies.converted_to_auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.converted_to_auto_policy_id
      action_bindings:
        nonowner_policies.converted_to_auto_policy_id: converted_to_auto_policy_id
    state_contract:
      field: auto_policies.status
      allowed:
      - bound
      - in_force
  params:
    conversion_refund_method: =conversion_refund_method
    conversion_cancel_effective_rule: =conversion_cancel_effective_rule
- id: nonowner_unearned_premium_return
  subject:
  - nonowner_return_premium
  rule: 'Return premium is booked only while the term is in_force, pending_cancellation or cancelled.
    For a cancellation the unearned premium is computed transaction by transaction exactly as for the
    Owner Auto Policy: each premium written and additional premium row multiplied by the days from the
    cancellation effective date to expiration and divided by that row''s premium_days (term_days for premium
    written), less the same share of earlier returns; for a term with no mid-term change this is full_term_premium
    multiplied by premium_days and divided by term_days. An insured-request cancellation is reduced by
    insured_cancel_short_rate_retention_pct of itself; nonpayment, underwriting and conversion cancellations
    are not. A term voided from inception returns everything written. Amounts are rounded to the cent
    and credited to the billing plan within refund_issue_days.'
  eligibility:
  - id: term_status
    applies_to:
    - nonowner_return_premium
    kind: state
    condition: Return premium is booked only while the term is in_force, pending_cancellation or cancelled.
    evidence_fields:
    - nonowner_policies.status
    - nonowner_policies.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.nonowner_policy_id
      action_bindings:
        nonowner_policies.nonowner_policy_id: nonowner_policy_id
    state_contract:
      field: nonowner_policies.status
      allowed:
      - in_force
      - pending_cancellation
      - cancelled
  params:
    refund_issue_days: =refund_issue_days
  formula:
    when: transaction_reason in ["cancellation_nonpayment", "cancellation_underwriting", "cancellation_conversion"]
    simple_term_return: round(full_term_premium * premium_days / term_days, 2)
- id: nonowner_premium_charging
  subject:
  - nonowner_premium_written
  - nonowner_additional_premium
  rule: Premium is written only on a term whose status is bound, renewal_offered or in_force. Premium
    written equals full_term_premium, once at binding and once at renewal acceptance. A limits increase
    charges the full-term premium difference prorated over term_days from its effective date; a reinstatement
    re-writes premium under nonowner_reinstatement.
  eligibility:
  - id: term_status
    applies_to:
    - nonowner_premium_written
    - nonowner_additional_premium
    kind: state
    condition: Premium is written only on a term whose status is bound, renewal_offered or in_force.
    evidence_fields:
    - nonowner_policies.status
    - nonowner_policies.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.nonowner_policy_id
      action_bindings:
        nonowner_policies.nonowner_policy_id: nonowner_policy_id
    state_contract:
      field: nonowner_policies.status
      allowed:
      - bound
      - renewal_offered
      - in_force
- id: nonowner_fees
  subject:
  - nonowner_policy_fee
  - nonowner_reinstatement_fee
  - nonowner_fee_waived
  rule: The policy fee is policy_fee_new_business on new business and policy_fee_renewal on an accepted
    renewal. Only one policy fee is charged per term. The reinstatement fee is charged once per reinstatement
    with a lapse. Fees are fully earned and not returned on cancellation. Each fee transaction is reversed
    at most once. A fee is reversed only for a term voided from inception or a fee charged in error.
  eligibility:
  - id: one_policy_fee
    applies_to:
    - nonowner_policy_fee
    kind: dedup
    condition: Only one policy fee is charged per term.
    evidence_fields:
    - nonowner_premium_transactions.event_type
    - nonowner_premium_transactions.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_premium_transactions.nonowner_policy_id
      action_bindings:
        nonowner_premium_transactions.nonowner_policy_id: nonowner_policy_id
    dedup_contract:
      table: nonowner_premium_transactions
      mode: separate_record
      object_bindings:
        nonowner_policy_id: nonowner_policy_id
      duplicate_filters:
        event_type:
        - nonowner_policy_fee
      distinct_fields: []
  - id: one_reversal
    applies_to:
    - nonowner_fee_waived
    kind: dedup
    condition: Each fee transaction is reversed at most once.
    evidence_fields:
    - nonowner_premium_transactions.event_type
    - nonowner_premium_transactions.reversed_txn_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_premium_transactions.reversed_txn_id
      action_bindings:
        nonowner_premium_transactions.reversed_txn_id: reversed_txn_id
    dedup_contract:
      table: nonowner_premium_transactions
      mode: separate_record
      object_bindings:
        reversed_txn_id: reversed_txn_id
      duplicate_filters:
        event_type:
        - nonowner_fee_waived
      distinct_fields: []
  params:
    policy_fee_new_business: =policy_fee_new_business
    policy_fee_renewal: =policy_fee_renewal
    reinstatement_fee: =reinstatement_fee
- id: nonowner_renewal
  subject:
  - nonowner_renewal_issued
  - nonowner_renewal_accepted
  - nonowner_renewal_not_taken
  - nonowner_term_expired
  rule: The renewal term is issued offer_days calendar days before expiration of an in-force term not
    being nonrenewed; the package is kept when the named insured's points do not exceed its renewal_points,
    otherwise the highest lower package whose renewal_points are met is offered, and when none is met
    the term is nonrenewed. A renewal is accepted only on a new Non-Owner Statement signed for the renewal
    with owns_or_leases_vehicle false. The statement must be signed no more than non_owner_statement_max_age_days
    calendar days before the renewal effective date. The renewal down payment required by the renewal
    billing plan must be posted before the renewal is accepted. A renewal is accepted no later than late_window_days
    calendar days after the expiration date of the expiring term. Calendar days are counted from the expiration
    date of the expiring term as day 0; acceptance on or before that date plus late_window_days qualifies.
    A renewal paid after the expiration date also needs a Statement of No Loss for the lapse and goes
    in force on the posting date plus reinstatement_effective_offset_days, with the lapse recorded; a
    renewal not accepted in the window closes as not_taken the day after the window. The expiring term
    moves to expired on its expiration date. An SR-22 or FR-44 Operator certificate carries forward to
    an accepted renewal without a new filing.
  eligibility:
  - id: late_window
    applies_to:
    - nonowner_renewal_accepted
    kind: time
    condition: A renewal is accepted no later than late_window_days calendar days after the expiration
      date of the expiring term.
    evidence_fields:
    - nonowner_policies.effective_date
    - nonowner_policies.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.nonowner_policy_id
      action_bindings:
        nonowner_policies.nonowner_policy_id: nonowner_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the expiration date of the expiring term
      anchor_source: nonowner_policies.effective_date
      relation: not_after
      duration_source: variants.late_renewal_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the expiration date of the expiring term as day 0;
        acceptance on or before that date plus late_window_days qualifies.
      boundary: inclusive
  - id: renewal_statement
    applies_to:
    - nonowner_renewal_accepted
    kind: authorization
    condition: A renewal is accepted only on a new Non-Owner Statement signed for the renewal with owns_or_leases_vehicle
      false.
    evidence_fields:
    - nonowner_documents.owns_or_leases_vehicle
    - nonowner_documents.document_date
    - nonowner_documents.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_documents.nonowner_policy_id
      action_bindings:
        nonowner_documents.nonowner_policy_id: nonowner_policy_id
  - id: renewal_payment
    applies_to:
    - nonowner_renewal_accepted
    kind: authorization
    condition: The renewal down payment required by the renewal billing plan must be posted before the
      renewal is accepted.
    evidence_fields:
    - billing_transactions.posted_date
    - billing_transactions.event_type
    - billing_plans.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - billing_plans.nonowner_policy_id
      action_bindings:
        billing_plans.nonowner_policy_id: nonowner_policy_id
  params:
    per_tier:
      Cardinal Point Non-Owner Minimum Limits:
        offer_days: =renewal_offer_days_before_expiration
        late_window_days: =late_renewal_window_days
        renewal_points: =max_violation_points_renewal
      Cardinal Point Non-Owner Minimum Limits with UM:
        offer_days: =renewal_offer_days_before_expiration
        late_window_days: =late_renewal_window_days
        renewal_points: =max_violation_points_renewal
      Cardinal Point Non-Owner 50/100/50:
        offer_days: =renewal_offer_days_before_expiration
        late_window_days: =late_renewal_window_days
        renewal_points: =max_violation_points_renewal
      Cardinal Point Non-Owner 100/200/50:
        offer_days: =renewal_offer_days_before_expiration
        late_window_days: =late_renewal_window_days
        renewal_points: =max_violation_points_renewal
      Cardinal Point Non-Owner 100/300/50:
        offer_days: =renewal_offer_days_before_expiration
        late_window_days: =late_renewal_window_days
        renewal_points: =max_violation_points_renewal
      Cardinal Point Non-Owner 250/500/100:
        offer_days: =renewal_offer_days_before_expiration
        late_window_days: =late_renewal_window_days
        renewal_points: =max_violation_points_renewal
    non_owner_statement_max_age_days: =non_owner_statement_max_age_days
    reinstatement_effective_offset_days: =reinstatement_effective_offset_days
- id: nonowner_nonrenewal
  subject:
  - nonowner_nonrenewal_notice
  rule: The company nonrenews only for a reason in the nonrenewal_reason list. A nonrenewal notice is
    valid only when its mailing date is at least the residence state's days in the Owner Auto Policy charter's
    nonrenewal_notice_days_by_state before the expiration date. When it cannot be mailed in time the renewal
    is issued in the highest package the named insured qualifies for.
  eligibility:
  - id: notice_lead
    applies_to:
    - nonowner_nonrenewal_notice
    kind: authorization
    condition: A nonrenewal notice is valid only when its mailing date is at least the residence state's
      days in the Owner Auto Policy charter's nonrenewal_notice_days_by_state before the expiration date.
    evidence_fields:
    - nonowner_documents.document_date
    - nonowner_policies.expiration_date
    - nonowner_documents.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_documents.nonowner_policy_id
      action_bindings:
        nonowner_documents.nonowner_policy_id: nonowner_policy_id
  params:
    nonrenewal_notice_days_source: =nonrenewal_notice_days_source
- id: nonowner_underwriting_cancellation
  subject:
  - nonowner_cancelled_underwriting
  rule: An underwriting cancellation for a reason not listed in underwriting_cancel_reasons_after_period
    is processed no later than the residence state's underwriting period after the original effective
    date of the policy. Calendar days are counted from the original effective date (term 1) as day 0,
    using the residence state's figure in the Owner Auto Policy charter's new_business_underwriting_period_days_by_state.
    After that period the term is cancelled for underwriting only for a listed reason, typically that
    the named insured acquired a vehicle or regular use of one and did not convert; advance notice follows
    the residence state's days in underwriting_cancel_notice_days_by_state of the Owner Auto Policy charter.
    Unearned premium is returned pro rata.
  eligibility:
  - id: period
    applies_to:
    - nonowner_cancelled_underwriting
    kind: time
    condition: An underwriting cancellation for a reason not listed in underwriting_cancel_reasons_after_period
      is processed no later than the residence state's underwriting period after the original effective
      date of the policy.
    evidence_fields:
    - nonowner_policies.effective_date
    - nonowner_policies.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - nonowner_policies.nonowner_policy_id
      action_bindings:
        nonowner_policies.nonowner_policy_id: nonowner_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the original effective date of the policy
      anchor_source: nonowner_policies.effective_date
      relation: not_after
      duration_source: params.underwriting_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the original effective date (term 1) as day 0, using
        the residence state's figure in the Owner Auto Policy charter's new_business_underwriting_period_days_by_state.
      boundary: inclusive
  params:
    underwriting_period_days: =underwriting_period_source
    underwriting_cancel_reasons_after_period: =underwriting_cancel_reasons_after_period
- id: nonowner_term_activation
  subject:
