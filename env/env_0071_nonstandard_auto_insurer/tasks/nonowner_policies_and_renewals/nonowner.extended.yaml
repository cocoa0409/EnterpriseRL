- id: nonowner_ext_renewal_offer_premium
  base_policy_refs:
  - nonowner_renewal
  - nonowner_agg_multi_holding
  - nonowner_nonrenewal
  overwrite: []
  trigger: state_due
  subject:
  - nonowner_renewal_issued
  computes: renewal_full_term_premium
  target_tool: issue_nonowner_renewal_offer_23563ff0
  params:
    rate_min: 520.0
    rate_min_um: 610.0
    rate_p50: 760.0
    rate_p100_200: 880.0
    rate_p100_300: 950.0
    rate_p250: 1180.0
    state_fl: 1.0
    state_va: 0.94
    state_tx: 1.08
    state_ga: 1.05
    state_az: 0.97
    state_oh: 0.88
    points_high: 10
    points_mid: 6
    points_low: 3
    class_points_high: 1.5
    class_points_mid: 1.28
    class_points_low: 1.12
    filer_fr44_high: 1.35
    filer_fr44_low: 1.25
    filer_sr22_high: 1.15
    filer_sr22_low: 1.08
    filer_points: 6
