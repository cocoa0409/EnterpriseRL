    written_on_term: >-
      The increase days run from the day of the change, which is included, to the term's expiration date, which
      is excluded. The increase rated premium is the increase base rate of the package the term carries multiplied
      by the state factor, by the increase points class factor and by the term's months over six. The standard increase
      charge is the increase rated premium multiplied by the increase days and divided by the term's days, less
      the increase deduction, the standard increase deduction being the premium written on the term multiplied by
      the increase days and divided by the term's days; a change made fewer than 15 days before the expiration date,
      or a charge that is not above zero, owes no increase charge and nothing is booked; otherwise the charge is
      rounded half up to the cent on the final figure only and booked as one additional-premium entry for the change,
      dated from the day of the change, with the increase days as its days.
    written_days_recorded: >-
      The increase deduction basis follows what the term's ledger already carries for the increase days: when the
      ledger carries a re-written premium entry for a reinstatement, the deduction is the premium written multiplied
      by the increase days and divided by its days (the term's days when it records none), less the earlier returns
      multiplied by the increase days and divided by the latest return's days, plus the re-written premium multiplied
      by the increase days and divided by the latest re-written entry's days, the entry recorded first giving the
      days where two share the latest processing date; when there is no such re-written entry but the premium written
      records more than zero days and fewer than the term's days, the deduction is the premium written multiplied
      by the increase days and divided by its days; otherwise the standard increase deduction stands.
