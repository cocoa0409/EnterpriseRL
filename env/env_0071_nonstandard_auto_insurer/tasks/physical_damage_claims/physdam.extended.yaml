  - id: physdam_ext_totaled_coverage_return
    base_policy_refs: [physdam_inspection_rule, physdam_premium_rule]
    overwrite:
      - base_policy: physdam_premium_rule
        superseded_clause: >-
          a return uses the days from the removal or termination date to the expiration date.
        replaced_by: >-
          For a removal the named insured asks for, and only for such a removal, the return is the coverage return this rule sets out; every other return uses the days from the removal or termination date to the expiration date at the full-term rate divided by the owner term's days.
      - base_policy: physdam_inspection_rule
        superseded_clause: >-
          A coverage with a loss payee is removed no earlier than loss_payee_notice_days calendar days after the loss payee was notified.
        replaced_by: >-
          For the coverage of a vehicle declared a total loss, and only for such a coverage, the loss payee's notice period runs from the day of the total loss declaration, the loss payee being told of the total loss that day, and the coverage is removed no earlier than loss_payee_notice_days calendar days after it; any other coverage with a loss payee is removed no earlier than loss_payee_notice_days calendar days after the loss payee was notified.
