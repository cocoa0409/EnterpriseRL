    factors:
      - id: charge_rate_basis
        effect: parameter
        decides: return_rate
        bindings: [pc_count, pc_date, pc_rate, rest_count, rest_date, rest_rate, added_rate, return_rate]
        ladder:
          - when: "the coverage's latest premium charge is a package change"
            value: "the full-term rate on that package-change charge"
          - when: "the latest premium charge is a restoration after a reinstatement of the owner term"
            value: "the full-term rate on that restoration charge"
          - when: "otherwise (the only charge is the coverage-added charge)"
            value: "the full-term rate on the coverage-added charge"
        baseline:
          return_rate: "added_rate"
        evidence: [history]
        cross_difficulty: null
      - id: return_start
        effect: method
        decides: return_days
        bindings: [anchor_decl_count, anchor_insured_paid, anchor_loss_date, return_days]
        ladder:
          - when: "a declared total loss with a total loss payment to the named insured"
            method: "the days from the date of loss to the expiration date"
          - when: "the coverage is still awaiting its photo inspection and no total loss payment to the named insured stands"
            method: "the days from the coverage effective date to the expiration date"
          - when: "otherwise"
            method: "the days from today to the expiration date"
        baseline:
          return_days: "DAYS(NOW, F('expiration_date'))"
        evidence: [history, date]
        cross_difficulty: null
      - id: short_rate_share
        effect: parameter
        decides: short_rate_pct
        bindings: [sr_decl_count, sr_package_pct, sr_window, sr_vehicle_added_on, sr_added_days_ago, short_rate_pct]
        ladder:
          - when: "the latest claim records a total loss declaration"
            value: "0"
          - when: "no such declaration and the latest vehicle added to the owner term took effect from the package's replacement-vehicle reporting days before today through today, both days counted"
            value: "K('substitution_short_rate')"
          - when: "otherwise"
            value: "CPARAM('auto', 'insured_cancel_short_rate_retention_pct')"
        baseline:
          short_rate_pct: "sr_package_pct"
        evidence: [history, cross_category, date]
        cross_difficulty: auto
      - id: minimum_earned
        effect: parameter
        decides: minimum_earned_share
        bindings: [in_force_days, minimum_earned_share]
        ladder:
          - when: "the coverage has been in force at least the first minimum days but fewer than the second minimum days"
            value: "0.5"
          - when: "the coverage has been in force the second minimum days or more"
            value: "0"
          - when: "otherwise (in force fewer than the first minimum days)"
            value: "1"
        baseline:
          minimum_earned_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: plan_minimum_earned
        effect: parameter
        decides: minimum_earned_pct
        bindings: [plan_name, minimum_earned_pct]
        ladder:
          - when: "the owner term is billed on the Cardinal Point Paid-in-Full Plan"
            value: "K('paid_in_full_minimum_earned_pct')"
          - when: "the owner term is billed on the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan"
            value: "K('autopay_minimum_earned_pct')"
          - when: "otherwise (any other payment plan)"
            value: "K('standard_minimum_earned_pct')"
        baseline:
          minimum_earned_pct: "K('standard_minimum_earned_pct')"
        evidence: [cross_category]
        cross_difficulty: billing
      - id: minimum_earned_tenure
        effect: parameter
        decides: minimum_earned_renewal_share
        bindings: [tenure_term_number, minimum_earned_renewal_share]
        ladder:
          - when: "the owner term is a renewal term whose term number is at least the long-renewal term number"
            value: "0"
          - when: "the owner term is any other renewal term (term number two or more)"
            value: "0.5"
          - when: "otherwise (a new-business term)"
            value: "1"
        baseline:
          minimum_earned_renewal_share: "1"
        evidence: [cross_category]
        cross_difficulty: auto
    baseline:
      rule: >-
        The claim a coverage return looks to is the coverage's claim with the highest claim number, the number issued last.
        The coverage return starts from the full-term rate on the coverage-added premium charge times the return days divided by the owner term's days.
        The return days are the calendar days from today, the day the removal is asked for, to the coverage's expiration date, the expiration date counted and today not.
        The owner package's short-rate retention percent of that amount is kept by the company.
        A minimum-earned charge is taken off the coverage return: the minimum-earned percent of the full-term rate, times the time-in-force share of the minimum-earned charge, times the tenure share of the minimum-earned charge; at the standard the percent is the standard minimum-earned percent and both shares are one, the whole charge.
        The coverage return is the amount left, rounded to the nearest cent at the end and never below zero.
      params: [standard_minimum_earned_pct]
    inputs:
      history:
        - {table: physdam_premium_transactions, aggregate: latest, field: vehicle_term_coverage_premium, filters: {event_type: physdam_premium_written}}
        - {table: physdam_claim_payments, aggregate: count, field: physdam_payment_id, filters: {event_type: physdam_total_loss_payment, payee_type: named_insured}}
        - {category: auto, table: auto_policy_changes, aggregate: latest, field: change_effective_date, filters: {event_type: auto_vehicle_added}}
      cross_category: [auto, billing]
