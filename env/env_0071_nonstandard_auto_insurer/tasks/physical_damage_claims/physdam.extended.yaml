        - {table: physdam_claim_payments, aggregate: sum, field: deductible_applied, filters: {event_type: physdam_repair_payment}}
        - {table: physdam_claim_payments, aggregate: sum, field: amount, filters: {event_type: physdam_tow_storage_payment}}
        - {category: rental, table: rental_benefit_transactions, aggregate: sum, field: amount, filters: {event_type: rental_benefit_paid}}
      cross_category: [rental]
  - id: physdam_ext_lienholder_settlement
    base_policy_refs: [physdam_settlement, physdam_agg_multi_vehicle_loss]
    overwrite:
      - base_policy: physdam_settlement
        superseded_clause: >-
          A total loss settlement is the actual cash value less the deductible, plus the garaging state's sales_tax_rate_by_state percent of the actual cash value and its title_fee_by_state, less the salvage value when the named insured keeps the vehicle; it is paid first to the loss payee up to the payoff amount and the rest to the named insured.
        replaced_by: >-
          For a total loss of a vehicle whose coverage lists a loss payee, and only for such a loss, the vehicle value this rule sets out is paid in full to the loss payee, which applies it to its payoff and returns any excess to the named insured, while the sales tax and the title fee are paid to the named insured as the owner's tax-and-title payment under its own rule; a total loss of a vehicle with no loss payee remains settled as the actual cash value less the deductible, plus the garaging state's sales tax percent of the actual cash value and its title fee, less the salvage value when the named insured keeps the vehicle, all paid to the named insured.
      - base_policy: physdam_settlement
        superseded_clause: >-
          The deductible is the package's collision_deductible for a collision cause and comprehensive_deductible for any comprehensive cause, applied once per claim;
        replaced_by: >-
          For the vehicle value paid to a loss payee on a total loss, and only for that payment, the deductible it carries is the one this rule sets out, applied once per claim; a repair payment the named insured directs to the repair facility carries the deductible its own rule sets, and every other payment carries the package's collision deductible for a collision cause and its comprehensive deductible for any comprehensive cause, applied once per claim.
    trigger: on_request
    subject: [physdam_total_loss_payment]
    computes: amount
    target_tool: pay_loss_payee_settlement_0684ec8f
    params:
      report_spread_limit: 0.10
      theft_deductible_add: 250
      permissive_collision_add: 500
      permissive_comprehensive_add: 250
      recent_purchase_days: 180
      second_purchase_days: 365
      second_window_cap_factor: 1.10
      long_renewal_term: 3
      long_renewal_credit: 100
      renewal_credit: 50
      renewal_credit_max_points: 2
      condition_adjustment_cap_share: 0.25
    rule: >-
      The vehicle value paid to a loss payee is the total loss payment made to the loss payee listed on the coverage for a vehicle declared a total loss.
      For a total loss of a vehicle whose coverage lists a loss payee, and only for such a loss, the vehicle value this rule sets out is paid in full to the loss payee, which applies it to its payoff and returns any excess to the named insured, while the sales tax and the title fee are paid to the named insured as the owner's tax-and-title payment under its own rule; a total loss of a vehicle with no loss payee remains settled as the actual cash value less the deductible, plus the garaging state's sales tax percent of the actual cash value and its title fee, less the salvage value when the named insured keeps the vehicle, all paid to the named insured.
      For the vehicle value paid to a loss payee on a total loss, and only for that payment, the deductible it carries is the one this rule sets out, applied once per claim; a repair payment the named insured directs to the repair facility carries the deductible its own rule sets, and every other payment carries the package's collision deductible for a collision cause and its comprehensive deductible for any comprehensive cause, applied once per claim.
      The claim the vehicle value is figured for is the coverage's claim with the highest claim number, claim numbers being issued in sequence and never repeated.
      The vehicle value paid to a loss payee starts from the actual cash value recorded on the claim's total loss declaration.
      The deductible the vehicle value carries is the package's collision deductible.
      The vehicle value paid to a loss payee is that actual cash value less that deductible less any total loss payment already made to the loss payee on the claim, rounded to the nearest cent at the end and never below zero.
      A claim with neither a valuation report nor a total loss declaration has no vehicle value to pay, which is zero.
      Each adjustment below changes the starting value, caps it, takes damage off it, or changes the deductible, as it states, and the adjustments apply by kind: replacements first, then caps, then additions, then the amounts taken off, then the floor at zero and the rounding.
      The starting value of the vehicle value paid to a loss payee is chosen from the valuation reports, which are the estimate entries of the claim with the actual cash value each records: when the two entries with the highest estimate sequences differ by no more than the report spread limit times the lower of the two, their average; when they differ by more than that, the lower of the two; when the claim has fewer than two such entries, the actual cash value on the total loss declaration.
      A recent-purchase cap limits the vehicle value paid to a loss payee by the vehicle's original acquisition date, recorded on the vehicle-added change for the coverage's VIN on any of the named insured's owner terms (a renewal carries the vehicle over without a new change, so the change that first scheduled it is read, and of several such changes the one with the latest change effective date), counted in calendar days from that acquisition date to the date of loss (the date of loss counted, the acquisition date not): held fewer than the recent-purchase days, the cap is the coverage's value at binding; held at least the recent-purchase days but fewer than the second-window days, the cap is the value at binding times the second-window cap factor; held longer, or no acquisition date recorded, no cap.
      Unrepaired earlier damage is taken off the vehicle value paid to a loss payee as a condition adjustment; earlier damage is the repair payments made to the named insured (paid out in cash, not to a repair facility) on the coverage's earlier claims plus the deductibles taken from those payments, earlier claims being every claim on the coverage other than the claim being settled. When that earlier damage is no more than the condition-adjustment cap share of the actual cash value on the total loss declaration, the whole earlier damage is taken off; when it is more, only that cap share of the declared actual cash value is taken off; when there is no earlier damage, nothing is taken off.
      The deductible for the total loss's cause replaces the deductible the vehicle value carries as follows: for a theft cause, the package's comprehensive deductible plus the theft deductible add-on; for any other comprehensive cause, the package's comprehensive deductible; for a collision cause, the package's collision deductible.
      A permissive-operator surcharge is added to the deductible the vehicle value carries: when the operator recorded on the claim report is a permissive user who does not live in the household and the cause is a collision, the permissive-collision surcharge; when that operator is such a permissive user and the cause is comprehensive, the permissive-comprehensive surcharge; for any other operator no surcharge.
      A good-driver renewal credit is taken off the deductible the vehicle value carries, read from the owner term the coverage belongs to, as the company's filed deductible credit for renewal terms with a clean driving record: when that term's term number is at least the long-renewal term number and its violation points are zero, the long-renewal credit; when that term's term number is two or more, its violation points are at most the renewal-credit point limit, and it does not earn the long-renewal credit, the renewal credit; on a new-business term, or with more points than that limit, no credit.
    prerequisite: []
    cross_category:
      - category: auto
        as: branch
        reads: [term_number, violation_points, auto_policy_changes.vehicle_acquired_date]
        note: The good-driver renewal credit reads the owner term's term number and violation points; the recent-purchase cap reads the acquisition date on the vehicle-added change for the coverage's VIN on any of the named insured's owner terms.
    compute:
      - lp_claim: "LATEST('physdam_claim_events', 'claim_number', date_field='claim_number', event_type='physdam_claim_reported')"
      - declared_acv: "LATEST('physdam_claim_events', 'acv_amount', date_field='entry_date', event_type='physdam_total_loss_declared', claim_number=lp_claim)"
      - top_sequence: "LATEST('physdam_claim_events', 'estimate_sequence', date_field='estimate_sequence', event_type='physdam_estimate_recorded', claim_number=lp_claim)"
      - report_count: "COUNT('physdam_claim_events', event_type='physdam_estimate_recorded', claim_number=lp_claim)"
      - top_report: "LATEST('physdam_claim_events', 'acv_amount', date_field='estimate_sequence', event_type='physdam_estimate_recorded', claim_number=lp_claim)"
      - prior_report: "LATEST('physdam_claim_events', 'acv_amount', date_field='entry_date', event_type='physdam_estimate_recorded', claim_number=lp_claim, estimate_sequence=top_sequence - 1) if report_count >= 2 else None"
      - valuation_figure: "(top_report + prior_report) / 2 if (report_count >= 2 and ABS(top_report - prior_report) <= K('report_spread_limit') * MN(top_report, prior_report)) else (MN(top_report, prior_report) if (report_count >= 2 and ABS(top_report - prior_report) > K('report_spread_limit') * MN(top_report, prior_report)) else declared_acv)"
      - lp_loss_date: "LATEST('physdam_claim_events', 'date_of_loss', date_field='entry_date', event_type='physdam_claim_reported', claim_number=lp_claim)"
      - acquired_on: "XLATEST('auto', 'auto_policy_changes', 'vehicle_acquired_date', date_field='change_effective_date', event_type='auto_vehicle_added', vehicle_vin=F('vehicle_vin'))"
      - held_days: "DAYS(acquired_on, lp_loss_date) if (acquired_on != None and lp_loss_date != None) else 0"
      - purchase_cap: "F('vehicle_value_at_binding') if (acquired_on != None and held_days < K('recent_purchase_days')) else (F('vehicle_value_at_binding') * K('second_window_cap_factor') if (acquired_on != None and held_days < K('second_purchase_days')) else 0)"
      - lp_cash_all: "SUM('physdam_claim_payments', 'amount', event_type='physdam_repair_payment', payee_type='named_insured')"
      - lp_cash_this: "SUM('physdam_claim_payments', 'amount', event_type='physdam_repair_payment', payee_type='named_insured', claim_number=lp_claim)"
      - lp_ded_all: "SUM('physdam_claim_payments', 'deductible_applied', event_type='physdam_repair_payment', payee_type='named_insured')"
      - lp_ded_this: "SUM('physdam_claim_payments', 'deductible_applied', event_type='physdam_repair_payment', payee_type='named_insured', claim_number=lp_claim)"
      - earlier_damage: "(lp_cash_all - lp_cash_this) + (lp_ded_all - lp_ded_this)"
      - condition_cap: "K('condition_adjustment_cap_share') * declared_acv if declared_acv != None else 0"
      - lp_carveout: "earlier_damage if (earlier_damage > 0 and earlier_damage <= condition_cap) else (condition_cap if (earlier_damage > 0 and earlier_damage > condition_cap) else 0)"
      - lp_cause_for_deductible: "LATEST('physdam_claim_events', 'loss_cause', date_field='entry_date', event_type='physdam_claim_reported', claim_number=lp_claim)"
      - lp_cause_deductible: "P('comprehensive_deductible') + K('theft_deductible_add') if lp_cause_for_deductible == 'comprehensive_theft' else (P('comprehensive_deductible') if (lp_cause_for_deductible != 'collision_with_vehicle' and lp_cause_for_deductible != 'collision_single_vehicle') else P('collision_deductible'))"
      - lp_cause: "LATEST('physdam_claim_events', 'loss_cause', date_field='entry_date', event_type='physdam_claim_reported', claim_number=lp_claim)"
      - lp_operator: "LATEST('physdam_claim_events', 'driver_household_status', date_field='entry_date', event_type='physdam_claim_reported', claim_number=lp_claim)"
      - lp_surcharge: "K('permissive_collision_add') if (lp_operator == 'non_household_permissive_user' and (lp_cause == 'collision_with_vehicle' or lp_cause == 'collision_single_vehicle')) else (K('permissive_comprehensive_add') if (lp_operator == 'non_household_permissive_user' and lp_cause != 'collision_with_vehicle' and lp_cause != 'collision_single_vehicle') else 0)"
      - lp_paid_before: "SUM('physdam_claim_payments', 'amount', event_type='physdam_total_loss_payment', payee_type='loss_payee', claim_number=lp_claim)"
      - lp_term_number: "CFIELD('auto', 'term_number', auto_policy_id=F('auto_policy_id'))"
      - lp_term_points: "CFIELD('auto', 'violation_points', auto_policy_id=F('auto_policy_id'))"
      - lp_renewal_credit_amount: "K('long_renewal_credit') if (lp_term_number >= K('long_renewal_term') and lp_term_points == 0) else (K('renewal_credit') if (lp_term_number >= 2 and lp_term_points <= K('renewal_credit_max_points')) else 0)"
      - capped_value: "None if valuation_figure == None else (MN(valuation_figure, purchase_cap) if purchase_cap > 0 else valuation_figure)"
      - lp_deductible: "MX(0, lp_cause_deductible + lp_surcharge - lp_renewal_credit_amount)"
      - result: "0 if capped_value == None else MX(0, RND(capped_value - lp_carveout - lp_deductible - lp_paid_before, 2))"
