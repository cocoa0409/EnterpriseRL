            value: "F('vehicle_value_at_binding')"
          - when: "an acquisition date is recorded and the vehicle was held at least the recent-purchase days but fewer than the second-window days"
            value: "F('vehicle_value_at_binding') * K('second_window_cap_factor')"
          - when: "otherwise (held longer, or no acquisition date recorded)"
            value: "0 (no cap)"
        baseline:
