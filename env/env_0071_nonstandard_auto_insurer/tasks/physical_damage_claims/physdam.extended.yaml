        ladder:
          - when: "earlier damage paid in cash is recorded and is no more than the condition-adjustment cap share of the declared actual cash value"
            method: "take off the whole earlier damage"
          - when: "earlier damage paid in cash is recorded and is more than that cap share"
            method: "take off the cap share of the declared actual cash value"
          - when: "otherwise (no earlier damage paid in cash)"
            method: "take off nothing"
        baseline:
          lp_carveout: "0"
        evidence: [history]
        cross_difficulty: null
      - id: total_loss_cause
        effect: parameter
        decides: lp_cause_deductible
        bindings: [lp_cause_for_deductible, lp_cause_deductible]
        ladder:
          - when: "a theft cause"
            value: "P('comprehensive_deductible') + K('theft_deductible_add')"
          - when: "any other comprehensive cause"
            value: "P('comprehensive_deductible')"
          - when: "otherwise (a collision cause)"
            value: "P('collision_deductible')"
        baseline:
          lp_cause_deductible: "P('collision_deductible')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: lp_permissive_operator
        effect: parameter
        decides: lp_surcharge
        bindings: [lp_cause, lp_operator, lp_surcharge]
        ladder:
          - when: "the operator on the claim report is a permissive user who does not live in the household and the cause is a collision"
            value: "K('permissive_collision_add')"
          - when: "the operator on the claim report is such a permissive user and the cause is comprehensive"
            value: "K('permissive_comprehensive_add')"
          - when: "otherwise (any other operator)"
            value: "0"
        baseline:
          lp_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: lp_renewal_credit
        effect: parameter
        decides: lp_renewal_credit_amount
        bindings: [lp_term_number, lp_term_points, lp_renewal_credit_amount]
        ladder:
          - when: "the owner term's term number is at least the long-renewal term number and its violation points are zero"
            value: "K('long_renewal_credit')"
          - when: "the owner term's term number is two or more, its violation points are at most the renewal-credit point limit, and it does not earn the long-renewal credit"
            value: "K('renewal_credit')"
          - when: "otherwise (a new-business term, or more points than the limit)"
            value: "0"
        baseline:
          lp_renewal_credit_amount: "0"
        evidence: [cross_category]
        cross_difficulty: auto
    baseline:
      rule: >-
        The claim the vehicle value is figured for is the coverage's claim with the highest claim number, claim numbers being issued in sequence and never repeated.
        The vehicle value paid to a loss payee starts from the actual cash value recorded on the claim's total loss declaration.
        The deductible the vehicle value carries is the package's collision deductible.
        The vehicle value paid to a loss payee is that actual cash value less that deductible less any total loss payment already made to the loss payee on the claim, rounded to the nearest cent at the end and never below zero.
        A claim with neither a valuation report nor a total loss declaration has no vehicle value to pay, which is zero.
      params: [collision_deductible]
    inputs:
      history:
        - {table: physdam_claim_events, aggregate: latest, field: acv_amount, filters: {event_type: physdam_estimate_recorded}}
        - {table: physdam_claim_events, aggregate: latest, field: acv_amount, filters: {event_type: physdam_total_loss_declared}}
        - {table: physdam_claim_payments, aggregate: sum, field: amount, filters: {event_type: physdam_repair_payment, payee_type: named_insured}}
        - {category: auto, table: auto_policy_changes, aggregate: latest, field: vehicle_acquired_date, filters: {event_type: auto_vehicle_added}}
      cross_category: [auto]
  - id: physdam_ext_owner_tax_title
    base_policy_refs: [physdam_settlement, physdam_agg_multi_vehicle_loss]
    overwrite:
      - base_policy: physdam_settlement
        superseded_clause: >-
          A total loss settlement is the actual cash value less the deductible, plus the garaging state's sales_tax_rate_by_state percent of the actual cash value and its title_fee_by_state, less the salvage value when the named insured keeps the vehicle; it is paid first to the loss payee up to the payoff amount and the rest to the named insured.
        replaced_by: >-
          For a total loss of a vehicle whose coverage lists a loss payee, and only for such a loss, the named insured is paid the owner's tax-and-title payment this rule sets out, while the vehicle value is paid in full to the loss payee under the loss-payee settlement rule; a total loss of a vehicle with no loss payee remains settled as the actual cash value less the deductible, plus the garaging state's sales tax percent of the actual cash value and its title fee, less the salvage value when the named insured keeps the vehicle, all paid to the named insured.
    trigger: on_request
    subject: [physdam_total_loss_payment]
    computes: amount
    target_tool: accept_total_loss_settlement_6ed13516
    params:
      home_state_tax_rate: 6.0
      texas_tax_rate: 6.25
      georgia_tax_rate: 7.0
      arizona_tax_rate: 5.6
      ohio_tax_rate: 5.75
      virginia_tax_rate: 4.15
      home_state_title_fee: 77.75
      texas_title_fee: 33.0
      georgia_title_fee: 18.0
      arizona_title_fee: 4.0
      virginia_ohio_title_fee: 15.0
      lien_release_fee: 22.5
      lease_termination_fee: 40.0
      owner_storage_day_allowance: 5
      standard_storage_daily: 25
      florida_storage_daily: 40
      georgia_storage_daily: 35
      texas_arizona_storage_daily: 30
    rule: >-
      The owner's tax-and-title payment is the total loss payment made to the named insured, on a total loss of a vehicle whose coverage lists a loss payee, for the sales tax, the title fee and the owner's other settlement items.
      For a total loss of a vehicle whose coverage lists a loss payee, and only for such a loss, the named insured is paid the owner's tax-and-title payment this rule sets out, while the vehicle value is paid in full to the loss payee under the loss-payee settlement rule; a total loss of a vehicle with no loss payee remains settled as the actual cash value less the deductible, plus the garaging state's sales tax percent of the actual cash value and its title fee, less the salvage value when the named insured keeps the vehicle, all paid to the named insured.
      The claim the owner's tax-and-title payment is figured for is the coverage's claim with the highest claim number; claim numbers are issued in sequence and are never shared.
      The owner's tax-and-title payment on a claim whose total loss declaration records a payoff for the loss payee, and on which every actual cash value recorded on the claim's estimates and total loss declaration and the coverage's value at binding are each more than a quarter of the declared actual cash value plus the package's larger deductible, the theft deductible add-on and the permissive-collision surcharge, is not figured until a total loss payment to the loss payee stands on the claim.
      The sales tax of the owner's tax-and-title payment is the whole sales tax on the vehicle value recognised for the total loss, which is the total loss payment made to the loss payee plus the deductible it carries, at the company's home-state (Florida) sales tax rate.
      The title fee of the owner's tax-and-title payment is the company's home-state (Florida) title transfer fee.
      An owner's storage charge is taken off the owner's tax-and-title payment for storage after the release notice, the release notice being given on the day the total loss is declared: the owner's late storage days are the calendar days from the declaration date to today less the package's storage paid-through days, never below zero, and at the standard the owner's storage charge is those late storage days, never more than the owner's storage-day allowance, times the standard daily storage rate.
      The owner's tax-and-title payment is that sales tax plus that title fee less that storage charge, rounded to the nearest cent at the end and never less than the title fee, which the owner is always paid for retitling.
      Each adjustment below changes the tax base, the tax rate, the title fee, the owner's storage days or the daily storage rate, or adds an owner's item, as it states, and the adjustments apply by kind: replacements first, the sales tax being then the base times the rate divided by one hundred, then additions, then the amounts taken off, then the rounding and the floor at the title fee.
      The tax base of the owner's tax-and-title payment is replaced as follows: when the coverage's loss payee is a lessor, there is no tax base, since the lessor holds the title and the tax on a lease; when it is a lienholder and the vehicle value recognised is less than the actual cash value on the total loss declaration, the declared actual cash value; otherwise the vehicle value recognised.
      The sales tax rate of the owner's tax-and-title payment is the garaging state's rate of the owner term the coverage belongs to: Texas, the Texas rate; Georgia, the Georgia rate; Arizona, the Arizona rate; Ohio, the Ohio rate; Virginia, the Virginia rate; any other state (Florida), the home-state rate.
      The title fee of the owner's tax-and-title payment is the garaging state's title transfer fee instead: Texas, the Texas fee; Georgia, the Georgia fee; Arizona, the Arizona fee; Virginia or Ohio, the Virginia-Ohio fee; any other state (Florida), the home-state fee.
      A title-clearing fee is added to the owner's tax-and-title payment for the owner's cost of clearing the title: when the coverage's loss payee is a lessor, the lease termination fee; when it is a lienholder whose payoff on the total loss declaration is no more than the total loss payment made to it, the lien release fee; for a lienholder still owed after that payment, nothing.
      The owner's storage days charged follow where the vehicle waits: when a tow and storage payment to a towing or storage vendor stands on the claim (the vehicle sits at a storage yard, which charges for every day), all the late storage days; when no such payment stands and the claim records no estimate (the vehicle is with the owner), no days; otherwise (the vehicle sits at a repair facility), the late storage days, never more than the owner's storage-day allowance.
      The daily storage rate of the owner's storage charge follows the company's reasonable storage charge schedule for the garaging state of the owner term the coverage belongs to: Florida, the Florida daily storage rate; Georgia, the Georgia daily storage rate; Texas or Arizona, the Texas-Arizona daily storage rate; any other state (Virginia or Ohio), the standard daily storage rate.
    prerequisite:
      - problem: physdam_ext_lienholder_settlement
        kind: value_input
        gate: title_clearing_fee
        form: state
        policy_source: >-
          The owner's tax-and-title payment on a claim whose total loss declaration records a payoff for the loss payee, and on which every actual cash value recorded on the claim's estimates and total loss declaration and the coverage's value at binding are each more than a quarter of the declared actual cash value plus the package's larger deductible, the theft deductible add-on and the permissive-collision surcharge, is not figured until a total loss payment to the loss payee stands on the claim.
        condition: >-
          The claim's total loss declaration records a payoff for the loss payee, every actual cash value recorded on the claim's estimates and total loss declaration and the coverage's value at binding are each more than a quarter of the declared actual cash value plus the package's larger deductible, the theft deductible add-on and the permissive-collision surcharge, and the claim's payment ledger carries a total loss payment whose payee is the loss payee.
        resolved_by: pay_loss_payee_settlement_0684ec8f
        effect: >-
          Once the loss payee's payment stands, the title-clearing fee compares the declared payoff with that payment, and the vehicle value recognised becomes that payment plus the deductible it carries.
    cross_category:
      - category: auto
        as: branch
        reads: [garaging_state]
        note: The tax rate, the title fee and the daily storage rate read the owner term's garaging state.
    compute:
      - tt_claim: "LATEST('physdam_claim_events', 'claim_number', date_field='claim_number', event_type='physdam_claim_reported')"
      - tt_decl_acv: "LATEST('physdam_claim_events', 'acv_amount', date_field='entry_date', event_type='physdam_total_loss_declared', claim_number=tt_claim)"
      - tt_decl_date: "LATEST('physdam_claim_events', 'entry_date', date_field='entry_date', event_type='physdam_total_loss_declared', claim_number=tt_claim)"
      - recognised_paid: "SUM('physdam_claim_payments', 'amount', event_type='physdam_total_loss_payment', payee_type='loss_payee', claim_number=tt_claim)"
      - recognised_deductible: "SUM('physdam_claim_payments', 'deductible_applied', event_type='physdam_total_loss_payment', payee_type='loss_payee', claim_number=tt_claim)"
      - value_recognised: "recognised_paid + recognised_deductible"
      - tax_base: "0 if F('loss_payee_type') == 'lessor' else (tt_decl_acv if (F('loss_payee_type') == 'lienholder' and tt_decl_acv != None and value_recognised < tt_decl_acv) else value_recognised)"
      - tax_state: "CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id'))"
      - tax_rate: "K('texas_tax_rate') if tax_state == 'TX' else (K('georgia_tax_rate') if tax_state == 'GA' else (K('arizona_tax_rate') if tax_state == 'AZ' else (K('ohio_tax_rate') if tax_state == 'OH' else (K('virginia_tax_rate') if tax_state == 'VA' else K('home_state_tax_rate')))))"
      - title_state: "CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id'))"
      - title_fee: "K('texas_title_fee') if title_state == 'TX' else (K('georgia_title_fee') if title_state == 'GA' else (K('arizona_title_fee') if title_state == 'AZ' else (K('virginia_ohio_title_fee') if (title_state == 'VA' or title_state == 'OH') else K('home_state_title_fee'))))"
      - clearing_payoff: "LATEST('physdam_claim_events', 'loss_payee_payoff_amount', date_field='entry_date', event_type='physdam_total_loss_declared', claim_number=tt_claim)"
      - clearing_lp_paid: "SUM('physdam_claim_payments', 'amount', event_type='physdam_total_loss_payment', payee_type='loss_payee', claim_number=tt_claim)"
      - title_clearing_fee: "K('lease_termination_fee') if F('loss_payee_type') == 'lessor' else (K('lien_release_fee') if (F('loss_payee_type') == 'lienholder' and clearing_payoff != None and clearing_lp_paid > 0 and clearing_payoff <= clearing_lp_paid) else 0)"
      - tow_vendor_count: "COUNT('physdam_claim_payments', event_type='physdam_tow_storage_payment', payee_type='towing_storage_vendor', claim_number=tt_claim)"
      - storage_estimate_count: "COUNT('physdam_claim_events', event_type='physdam_estimate_recorded', claim_number=tt_claim)"
      - late_days: "MX(0, DAYS(tt_decl_date, NOW) - P('storage_paid_through_days_after_notice')) if tt_decl_date != None else 0"
      - owner_storage_days: "late_days if tow_vendor_count > 0 else (0 if storage_estimate_count == 0 else MN(late_days, K('owner_storage_day_allowance')))"
      - storage_rate_state: "CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id'))"
      - owner_storage_rate: "K('florida_storage_daily') if storage_rate_state == 'FL' else (K('georgia_storage_daily') if storage_rate_state == 'GA' else (K('texas_arizona_storage_daily') if (storage_rate_state == 'TX' or storage_rate_state == 'AZ') else K('standard_storage_daily')))"
      - owner_storage_charge: "owner_storage_days * owner_storage_rate"
      - sales_tax_paid: "tax_base * tax_rate / 100"
      - result: "MX(title_fee, RND(sales_tax_paid + title_fee + title_clearing_fee - owner_storage_charge, 2))"
    compute_basis:
