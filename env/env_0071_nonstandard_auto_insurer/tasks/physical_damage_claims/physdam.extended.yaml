      rental_reversed: "when rental benefits were paid on the claim, the benefits paid less those reversed plus the rental days not yet invoiced at the authorised daily rate, those days running from the day after the last day of the latest paid invoice period to the end of the rental, the end not counted;"
      rental_auth_rate: "The rental authorised on the claim is its authorisation with the latest entry date, the claim number and entry date identifying one authorisation so that no two share a date; its rate and start date are read from that authorisation,"
      rental_auth_start: "The rental authorised on the claim is its authorisation with the latest entry date, the claim number and entry date identifying one authorisation so that no two share a date; its rate and start date are read from that authorisation,"
      rental_auth_entry: "The rental authorised on the claim is its authorisation with the latest entry date,"
      rental_closed_on: "and the rental ends on the claim's latest closing entry when that closing is dated on or after that authorisation's entry date, and otherwise runs to today, since a closing dated before it belongs to an earlier authorisation."
      rental_paid_through: "those days running from the day after the last day of the latest paid invoice period to the end of the rental, the end not counted;"
      rental_end: "and the rental ends on the claim's latest closing entry when that closing is dated on or after that authorisation's entry date, and otherwise runs to today, since a closing dated before it belongs to an earlier authorisation."
      rental_part: "A rental part is added to the damages a refund is shared over, read from the vehicle's rental reimbursement coverage on the claim number: when rental benefits were paid on the claim, the benefits paid less those reversed plus the rental days not yet invoiced at the authorised daily rate, those days running from the day after the last day of the latest paid invoice period to the end of the rental, the end not counted; when no benefit has been paid but a rental was authorised on the claim, the authorised daily rate times the rental days from the authorised start date to the end of the rental, the start date counted and the end not, and no days when the rental ends on or before its start date; when no rental was authorised on the claim, nothing."
      tow_storage_paid: "when they are no more than that limit, the payments;"
      tow_part: "A tow part is added to the damages a refund is shared over, at the reasonable towing charge: when the tow and storage payments on the claim are more than the package's towing-from-scene limit, that limit; when they are no more than that limit, the payments; when the claim carries no tow and storage payment, nothing."
      refundable_deductible: "the adjustments apply by kind: replacements first, then additions, then the amounts taken off, then the floor at zero;"
      recoveries_shared: "The recoveries shared are the subrogation recoveries received on the claim."
      refund_damages: "Each adjustment below changes the deductible a refund is figured on or the damages it is shared over, as it states, and the adjustments apply by kind: replacements first, then additions, then the amounts taken off, then the floor at zero; the share is taken last."
      refunded_before: "less any deductible refund already made on the claim,"
      result: "The deductible refund is the deductible a refund is figured on times the recoveries shared divided by the damages, never more than that deductible, less any deductible refund already made on the claim, rounded to the nearest cent at the end and never below zero; when the damages are zero no refund is figured."
    factors:
      - id: refund_deductible_source
        effect: parameter
        decides: deductible_borne
        bindings: [source_repair_count, source_repair_ded, source_total_loss_ded, deductible_borne]
        ladder:
          - when: "repair payments on the claim carry a deductible"
            value: "the deductibles those repair payments carry"
          - when: "no repair payment on the claim carries one and total loss payments on it do"
            value: "the deductibles those total loss payments carry"
          - when: "otherwise (no payment on the claim carries a deductible)"
            value: "P('collision_deductible')"
        baseline:
          deductible_borne: "P('collision_deductible')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: surcharge_never_refunded
        effect: parameter
        decides: nonrefundable_surcharge
        bindings: [refund_cause, refund_operator, nonrefundable_surcharge]
        ladder:
          - when: "the operator on the claim report is a permissive user who does not live in the household and the cause is a collision"
            value: "K('permissive_collision_add')"
          - when: "the operator on the claim report is such a permissive user and the cause is comprehensive"
            value: "K('permissive_comprehensive_add')"
          - when: "otherwise (any other operator)"
            value: "0"
        baseline:
          nonrefundable_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: repair_part_measure
        effect: method
        decides: repair_damages
        bindings: [part_repair_count, refund_latest_estimate, declared_acv, declared_salvage, declaration_count, paid_repair, paid_total_loss, paid_repair_ded, paid_total_loss_ded, repair_damages]
        ladder:
          - when: "the claim carries a repair payment"
            method: "the claim's latest cumulative repair estimate"
          - when: "the claim carries no repair payment and records a total loss declaration"
            method: "the declared actual cash value less the declared salvage value"
          - when: "otherwise"
            method: "the repair and total loss payments made on the claim plus the deductibles taken from them"
        baseline:
          repair_damages: "paid_repair + paid_total_loss + paid_repair_ded + paid_total_loss_ded"
        evidence: [history]
        cross_difficulty: null
      - id: rental_part_measure
        effect: method
        decides: rental_part
        bindings: [rental_paid, rental_reversed, rental_paid_through, rental_auth_rate, rental_auth_start, rental_auth_entry, rental_closed_on, rental_end, rental_part]
        ladder:
          - when: "rental benefits were paid on the claim under the vehicle's rental reimbursement coverage"
            method: "the benefits paid less those reversed, plus the authorised rate times the days from the day after the latest paid invoice period to the end of the rental"
          - when: "no benefit has been paid but a rental was authorised on the claim"
            method: "the latest authorisation's daily rate times the rental days from its start date to the claim's latest closing dated on or after its entry date (or to today)"
          - when: "otherwise (no rental authorised on the claim)"
            method: "nothing"
        baseline:
          rental_part: "0"
        evidence: [cross_category, date]
        cross_difficulty: rental
      - id: tow_reasonable_charge
        effect: parameter
        decides: tow_part
        bindings: [tow_storage_paid, tow_part]
        ladder:
          - when: "the tow and storage payments on the claim are more than the package's towing-from-scene limit"
            value: "P('towing_from_scene_limit')"
          - when: "they are no more than that limit"
            value: "the tow and storage payments"
          - when: "otherwise (no tow and storage payment on the claim)"
            value: "0"
        baseline:
          tow_part: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
