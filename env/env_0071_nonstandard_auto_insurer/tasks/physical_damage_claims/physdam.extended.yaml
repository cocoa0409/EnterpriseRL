# Policy charter: Physical Damage Coverage (Comprehensive and Collision) (category key: physdam).
category: physdam
display_name: Physical Damage Coverage (Comprehensive and Collision)
binding:
  holding_table: physdam_coverages
  event_tables:
  - physdam_premium_transactions
  - physdam_claim_events
  - physdam_claim_payments
  status_field: status
  variant_field: variant_name
  quantity_fields:
    term_coverage_premium: coverage_premium
    net_loss_paid_total: net_loss_paid
lifecycle:
  states:
  - inspection_pending
  - active
  - removed
  - terminated
  - expired
  transitions:
  - from: inspection_pending
    to: active
    by: agent
    means: The inspection is approved or waived.
  - from: inspection_pending
    to: removed
    by: agent
    means: The inspection was not received by its due date, or the insured asked to remove the coverage.
  - from: active
    to: removed
    by: agent
    means: The named insured asks to remove the coverage.
  - from: active
    to: terminated
    by: agent
    means: The owner term is cancelled.
  - from: inspection_pending
    to: terminated
    by: agent
    means: The owner term is cancelled before the inspection.
  - from: terminated
    to: active
    by: agent
    means: The owner term is reinstated.
  - from: active
    to: expired
    by: system
    means: The owner term expires.
accounts:
- key: coverage_premium
  unit: USD
  meaning: Net comprehensive and collision premium charged on the vehicle coverage.
- key: net_loss_paid
  unit: USD
  meaning: Claim payments issued on the coverage net of salvage and subrogation recoveries.
parameter_schema:
  comprehensive_deductible: Deductible applied once per comprehensive (other than collision) loss per
    vehicle, USD.
  collision_deductible: Deductible applied once per collision loss per vehicle, USD.
  windshield_zero_deductible_states: Garaging states in which no deductible applies to windshield repair
    or replacement under comprehensive.
  glass_repair_deductible_waived: Whether the deductible is waived when damaged glass is repaired rather
    than replaced (true/false).
  max_vehicle_age_model_years: Oldest vehicle eligible, as model years before the current model year.
  min_vehicle_value: Lowest vehicle value at binding (clean retail valuation) eligible, USD.
  max_vehicle_value: Highest vehicle value at binding eligible, USD.
  lienholder_max_deductible: Highest deductible a lienholder or lessor accepts on a financed or leased
    vehicle, USD.
  loss_payee_notice_days: Calendar days of advance notice given to a listed loss payee before the coverage
    is removed or terminated.
  inspection_required: Whether a photo inspection of the vehicle is required after the coverage is added
    (true/false).
  inspection_due_days: Calendar days after the coverage effective date within which the photo inspection
    must be received.
  inspection_photo_set: Photos that make up a complete inspection.
  inspection_waiver_rule: When the photo inspection is waived.
  removal_for_no_inspection_rule: Effective date of the removal when the inspection is not received in
    time.
  pre_inspection_loss_rule: Treatment of a loss occurring before the inspection was approved.
  total_loss_threshold_by_state: Mapping garaging state -> test under which a damaged vehicle is declared
    a total loss.
  acv_valuation_method: How actual cash value is set.
  sales_tax_rate_by_state: Mapping garaging state -> motor vehicle sales or title tax rate (percent) added
    to a total loss settlement.
  title_fee_by_state: Mapping garaging state -> title transfer fee reimbursed in a total loss settlement,
    USD (company settlement schedule).
  owner_retained_salvage_allowed: Whether the named insured may keep a total-loss vehicle, the salvage
    value being deducted (true/false).
  loss_payee_paid_first: Whether a total loss payment goes first to the listed loss payee up to the payoff
    amount (true/false).
  theft_waiting_period_days: Calendar days after a theft is reported before an unrecovered vehicle is
    settled as a total loss.
  theft_police_report_required: Whether a police report number is required for a theft or vandalism claim
    (true/false).
  late_report_review_days: Calendar days after the date of loss after which a newly reported claim is
    referred to the special investigations unit before any coverage decision.
  animal_collision_classification: Coverage under which hitting an animal is handled.
  deductible_application_rule: How deductibles apply.
  deductible_reimbursement_basis: How the deductible is returned after a subrogation recovery.
  excluded_driver_loss_covered: 'Whether a loss while a named excluded driver operates the vehicle is
    covered (false: never).'
  unlisted_resident_driver_loss_covered: 'Whether a loss while a household resident who is neither rated
    nor excluded operates the vehicle is covered (false: unlisted resident driver exclusion).'
  lapse_loss_covered: 'Whether a loss with a date of loss inside a lapse in coverage of the owner term
    is covered (false: never).'
  rideshare_delivery_use_covered: Whether a loss while the vehicle is used for a ride-hailing or delivery
    platform is covered (true/false).
  towing_from_scene_limit: Most paid for towing a covered disabled vehicle from the loss scene to a repair
    facility or storage yard, USD per loss.
  storage_paid_through_days_after_notice: Calendar days after the company notifies the insured to release
    the vehicle through which storage charges are paid.
  custom_equipment_limit: Most paid for custom parts and equipment per loss, USD.
  personal_property_covered: Whether personal property in the vehicle is covered (false).
  diminished_value_covered: Whether diminished value is paid (false).
  payment_issue_days: Calendar days after the amount of a covered loss is agreed within which payment
    is issued.
  supplement_rule: How additional damage found during repair is handled.
  repair_payee_rule: Payee of a repair payment.
  premium_basis: How coverage premium is charged.
  premium_rounding: Rounding of premium and claim amounts.
  claim_number_format: Format of a claim number.
  coverage_follows_owner_term: Whether the coverage ends, is restored and expires with its owner term
    (true/false).
  restored_coverage_lapse_rule: Coverage restored on reinstatement of the owner term.
  max_coverages_per_vehicle: Physical damage coverages per scheduled vehicle per owner term.
  removal_request_rule: When the named insured may remove the coverage.
  siu_referral_indicators: Indicators that send a claim to the special investigations unit instead of
    a desk decision.
  coverage_parts: Coverage parts the package provides.
variants:
- name: Cardinal Point Physical Damage $2,500 Deductible
  rank: 1
  entry_gate:
    max_vehicle_age_model_years: 25
    min_vehicle_value: 1500
    max_vehicle_value: 40000
    available_with_loss_payee: false
    photo_inspection: required unless waived
  parameters:
    comprehensive_deductible: 2500
    collision_deductible: 2500
    windshield_zero_deductible_states:
    - FL
    glass_repair_deductible_waived: true
    max_vehicle_age_model_years: 25
    min_vehicle_value: 1500
    max_vehicle_value: 40000
    lienholder_max_deductible: 1000
    loss_payee_notice_days: 10
    inspection_required: true
    inspection_due_days: 5
    inspection_photo_set:
    - four_corners
    - odometer_reading
    - vin_plate
    - windshield
    inspection_waiver_rule: new_vehicle_with_dealer_bill_of_sale_dated_within_7_days_of_the_coverage_effective_date
    removal_for_no_inspection_rule: 12:01_am_on_the_day_after_the_inspection_due_date
    pre_inspection_loss_rule: covered_for_damage_from_that_loss_payment_held_until_inspection_photos_received
    total_loss_threshold_by_state:
      FL: repair_estimate_at_least_80_percent_of_acv
      VA: repair_estimate_at_least_75_percent_of_acv
      TX: repair_estimate_at_least_100_percent_of_acv
      GA: repair_estimate_plus_salvage_value_at_least_acv
      AZ: repair_estimate_plus_salvage_value_at_least_acv
      OH: repair_estimate_plus_salvage_value_at_least_acv
    acv_valuation_method: average_of_two_comparable_vehicle_valuation_reports_adjusted_for_mileage_and_condition
    sales_tax_rate_by_state:
      FL: 6.0
      VA: 4.15
      TX: 6.25
      GA: 7.0
      AZ: 5.6
      OH: 5.75
    title_fee_by_state:
      FL: 77.75
      VA: 15.0
      TX: 33.0
      GA: 18.0
      AZ: 4.0
      OH: 15.0
    owner_retained_salvage_allowed: true
    loss_payee_paid_first: true
    theft_waiting_period_days: 30
    theft_police_report_required: true
    late_report_review_days: 30
    animal_collision_classification: comprehensive
    deductible_application_rule: once_per_loss_per_vehicle_by_cause_collision_or_comprehensive
    deductible_reimbursement_basis: proportional_to_the_share_of_total_damages_recovered
    excluded_driver_loss_covered: false
    unlisted_resident_driver_loss_covered: false
    lapse_loss_covered: false
    rideshare_delivery_use_covered: false
    towing_from_scene_limit: 150.0
    storage_paid_through_days_after_notice: 3
    custom_equipment_limit: 1000
    personal_property_covered: false
    diminished_value_covered: false
    payment_issue_days: 10
    supplement_rule: supplemental_estimate_recorded_and_paid_as_a_further_repair_payment
    repair_payee_rule: repair_facility_when_the_insured_assigns_payment_otherwise_named_insured_and_loss_payee_jointly
    premium_basis: vehicle_coverage_premium_for_the_owner_term_prorated_from_the_coverage_effective_date
    premium_rounding: nearest_cent_half_up
    claim_number_format: CLM-<9 digits>
    coverage_follows_owner_term: true
    restored_coverage_lapse_rule: same_lapse_as_the_owner_term_no_coverage_inside_it
    max_coverages_per_vehicle: 1
    removal_request_rule: any_time_on_request_effective_no_earlier_than_the_request_and_not_before_loss_payee_notice_expires
    siu_referral_indicators:
    - reported_after_late_report_review_days
    - loss_within_inspection_window_without_photos
    - theft_with_keys_unaccounted
    coverage_parts:
    - collision
    - comprehensive
