    unlisted_resident_driver_loss_covered: =unlisted_resident_driver_loss_covered
    lapse_loss_covered: =lapse_loss_covered
    rideshare_delivery_use_covered: =rideshare_delivery_use_covered
- id: physdam_valuation
  subject:
  - physdam_estimate_recorded
  - physdam_total_loss_declared
  rule: Each estimate or supplement records the cumulative repair estimate, the actual cash value by acv_valuation_method
    and the salvage bid. A vehicle is declared a total loss only when the garaging state's test in total_loss_threshold_by_state
    is met by the latest estimate. An unrecovered stolen vehicle is declared a total loss at the end of
    the theft waiting period. A vehicle that is not a total loss is repaired, and supplements are recorded
    with the next estimate_sequence.
  eligibility:
  - id: threshold_met
    applies_to:
    - physdam_total_loss_declared
    kind: authorization
    condition: A vehicle is declared a total loss only when the garaging state's test in total_loss_threshold_by_state
      is met by the latest estimate.
    evidence_fields:
    - physdam_claim_events.repair_estimate_amount
    - physdam_claim_events.acv_amount
    - physdam_claim_events.salvage_value
    - auto_policies.garaging_state
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
  params:
    total_loss_threshold_by_state: =total_loss_threshold_by_state
    acv_valuation_method: =acv_valuation_method
    supplement_rule: =supplement_rule
- id: physdam_settlement
  subject:
  - physdam_repair_payment
  - physdam_total_loss_payment
  - physdam_tow_storage_payment
  rule: A claim payment is issued only after a coverage confirmation is recorded for the claim. The deductible
    is the package's collision_deductible for a collision cause and comprehensive_deductible for any comprehensive
    cause, applied once per claim; no deductible applies to windshield repair or replacement in windshield_zero_deductible_states,
    nor to glass that is repaired rather than replaced. A repair payment is the latest cumulative repair
    estimate less the deductible less repair payments already made on the claim. A total loss settlement
    is the actual cash value less the deductible, plus the garaging state's sales_tax_rate_by_state percent
    of the actual cash value and its title_fee_by_state, less the salvage value when the named insured
    keeps the vehicle; it is paid first to the loss payee up to the payoff amount and the rest to the
    named insured. An unrecovered theft is settled no earlier than theft_waiting_period_days calendar
    days after the theft was reported. Calendar days are counted from the report date as day 0; settlement
    on or after the report date plus the waiting days qualifies. Towing from the scene is paid up to tow_limit
    per loss and storage through storage_paid_through_days_after_notice days after the release notice.
    Payments are issued within payment_issue_days of agreement, and the total paid on a claim, measured
    by physdam_msr_paid_on_claim, never exceeds the total loss settlement amount plus towing and storage.
  eligibility:
  - id: confirmed_first
    applies_to:
    - physdam_repair_payment
    - physdam_total_loss_payment
    - physdam_tow_storage_payment
    kind: authorization
    condition: A claim payment is issued only after a coverage confirmation is recorded for the claim.
    evidence_fields:
    - physdam_claim_events.event_type
    - physdam_claim_events.claim_number
    - physdam_claim_payments.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_payments.claim_number
      action_bindings:
        physdam_claim_payments.claim_number: claim_number
  - id: theft_wait
    applies_to:
    - physdam_total_loss_payment
    kind: time
    condition: An unrecovered theft is settled no earlier than theft_waiting_period_days calendar days
      after the theft was reported.
    evidence_fields:
    - physdam_claim_events.loss_cause
    - physdam_claim_events.entry_date
    - physdam_claim_events.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_events.claim_number
      action_bindings:
        physdam_claim_events.claim_number: claim_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the theft was reported
      anchor_source: physdam_claim_events.entry_date
      relation: not_before
      duration_source: variants.theft_waiting_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the report date as day 0; settlement on or after the
        report date plus the waiting days qualifies.
      boundary: inclusive
  params:
    per_tier:
      Cardinal Point Physical Damage $2,500 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $2,000 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $1,500 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $1,000 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $500 Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
      Cardinal Point Physical Damage $250 Comprehensive / $500 Collision Deductible:
        collision_deductible: =collision_deductible
        comprehensive_deductible: =comprehensive_deductible
        tow_limit: =towing_from_scene_limit
    sales_tax_rate_by_state: =sales_tax_rate_by_state
    title_fee_by_state: =title_fee_by_state
    windshield_zero_deductible_states: =windshield_zero_deductible_states
  formula:
    repair_payment: round(max(0, repair_estimate_amount - deductible_applied), 2)
    total_loss_settlement: round(acv_amount - deductible_applied + acv_amount * sales_tax_rate_by_state
      / 100 + title_fee_by_state, 2)
  measures:
  - physdam_msr_paid_on_claim
- id: physdam_recoveries
  subject:
  - physdam_salvage_recovery
  - physdam_subrogation_recovery
  - physdam_deductible_reimbursement
  rule: Salvage proceeds and subrogation recoveries reduce the net loss paid. A deductible reimbursement
    is made only after a subrogation recovery has been received on the claim. The named insured's deductible
    is returned in proportion to the share of total damages (payments plus deductible) recovered, rounded
    to the cent, and in full when the recovery is full; a salvage sale never returns any deductible.
  eligibility:
  - id: recovery_first
    applies_to:
    - physdam_deductible_reimbursement
    kind: authorization
    condition: A deductible reimbursement is made only after a subrogation recovery has been received
      on the claim.
    evidence_fields:
    - physdam_claim_payments.event_type
    - physdam_claim_payments.amount
    - physdam_claim_payments.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - physdam_claim_payments.claim_number
      action_bindings:
        physdam_claim_payments.claim_number: claim_number
  params:
    deductible_reimbursement_basis: =deductible_reimbursement_basis

extended_policies:
  - id: physdam_ext_repair_assignment
    base_policy_refs: [physdam_settlement, physdam_agg_multi_vehicle_loss]
    overwrite:
      - base_policy: physdam_settlement
        superseded_clause: >-
          A repair payment is the latest cumulative repair estimate less the deductible less repair payments already made on the claim.
        replaced_by: >-
          For a repair payment the named insured directs to the repair facility, and only for such a payment, the payment is figured as this rule sets out; every other repair payment remains the latest cumulative repair estimate less the deductible less the repair payments already made on the claim.
      - base_policy: physdam_settlement
        superseded_clause: >-
          The deductible is the package's collision_deductible for a collision cause and comprehensive_deductible for any comprehensive cause, applied once per claim;
        replaced_by: >-
          For a repair payment the named insured directs to the repair facility, and only for such a payment, the deductible it carries is the one this rule sets out, applied once per claim; the vehicle value paid to a loss payee on a total loss carries the deductible its own rule sets, and every other payment carries the package's collision deductible for a collision cause and its comprehensive deductible for any comprehensive cause, applied once per claim.
    trigger: on_request
    subject: [physdam_repair_payment]
    computes: amount
    target_tool: assign_repair_payment_77b6ee43
    params:
      permissive_collision_add: 500
      permissive_comprehensive_add: 250
      long_renewal_term: 3
      long_renewal_credit: 100
      renewal_credit: 50
      renewal_credit_max_points: 2
      appraisal_free_days: 5
      storage_day_allowance: 5
      standard_storage_daily: 25
      florida_storage_daily: 40
      georgia_storage_daily: 35
      texas_arizona_storage_daily: 30
    rule: >-
      An assigned repair payment is the repair payment the named insured directs to the repair facility on a claim of the coverage.
      For a repair payment the named insured directs to the repair facility, and only for such a payment, the payment is figured as this rule sets out; every other repair payment remains the latest cumulative repair estimate less the deductible less the repair payments already made on the claim.
      For a repair payment the named insured directs to the repair facility, and only for such a payment, the deductible it carries is the one this rule sets out, applied once per claim; the vehicle value paid to a loss payee on a total loss carries the deductible its own rule sets, and every other payment carries the package's collision deductible for a collision cause and its comprehensive deductible for any comprehensive cause, applied once per claim.
      A glass repair (glass mended rather than replaced) is never paid as an assigned repair payment; on a glass loss an assigned repair payment pays a replacement.
      The claim an assigned repair payment is figured for is the coverage's claim with the highest claim number; claim numbers are issued in sequence and never repeat, so that is the claim reported last.
      The assigned repair payment starts from the claim's latest cumulative repair estimate, the estimate entry with the highest estimate sequence on that claim.
      The deductible the assigned repair payment carries is the package's collision deductible.
      The appraisal-wait storage the assigned repair payment carries is its storage days times the standard daily storage rate; at the standard its storage days are the days of the appraisal wait beyond the free appraisal days, never more than the storage-day allowance and never below zero. The appraisal wait of the assigned repair payment is counted in calendar days from the date the coverage confirmation was recorded on the claim to the date of the claim's first estimate (estimate sequence one), the first estimate's date counted and the confirmation date not counted, and it is zero days when either date is missing.
      The assigned repair payment is that estimate plus that storage less that deductible less the repair payments already made on the claim, rounded to the nearest cent at the end and never below zero.
      A claim with no recorded estimate has no assigned repair payment, which is zero.
      Each adjustment below changes the deductible, the storage days or the storage rate of the assigned repair payment, as it states, and the adjustments apply by kind: replacements first, then additions, then the amounts taken off, then the floor at zero; the storage is then the storage days times the storage rate.
      The deductible for the loss's cause replaces the deductible the assigned repair payment carries as follows: for a glass loss on a vehicle whose owner term is garaged in one of the package's windshield zero-deductible states, no deductible; for any other comprehensive cause, a glass loss garaged in any other state included, the package's comprehensive deductible; for a collision cause, the package's collision deductible.
      A permissive-operator surcharge is added to the deductible the assigned repair payment carries: when the operator recorded on the claim report is a permissive user who does not live in the household and the cause is a collision, the permissive-collision surcharge; when that operator is such a permissive user and the cause is comprehensive, the permissive-comprehensive surcharge; for any other operator (a rated driver, a named excluded driver, an unlisted household resident, or no driver) no surcharge.
      A good-driver renewal credit is taken off the deductible the assigned repair payment carries, read from the owner term the coverage belongs to: when that term's term number is at least the long-renewal term number and its violation points are zero, the long-renewal credit; when that term's term number is two or more, its violation points are at most the renewal-credit point limit, and it does not earn the long-renewal credit, the renewal credit; on a new-business term, or with more points than that limit, no credit.
      The storage days of the assigned repair payment follow what kept the vehicle at the repair facility: on a glass loss, no storage days, since a glass replacement does not hold the vehicle for the appraisal; when the loss is not a glass loss and a tow and storage payment stands on the claim (the vehicle was towed in, so it could not be taken home), every day of the appraisal wait beyond the free appraisal days, never below zero and with no allowance limit; otherwise (a vehicle driven in on any other loss), the days of the appraisal wait beyond the free appraisal days, never below zero and never more than the storage-day allowance.
      The storage rate of the assigned repair payment follows the company's reasonable storage charge schedule for the garaging state of the owner term the coverage belongs to: Florida, the Florida daily storage rate; Georgia, the Georgia daily storage rate; Texas or Arizona, the Texas-Arizona daily storage rate; any other state (Virginia or Ohio), the standard daily storage rate.
    prerequisite: []
    cross_category:
      - category: auto
        as: branch
        reads: [garaging_state, term_number, violation_points]
        note: The deductible for the loss's cause and the storage rate read the owner term's garaging state; the good-driver renewal credit reads its term number and violation points.
    compute:
      - repair_claim: "LATEST('physdam_claim_events', 'claim_number', date_field='claim_number', event_type='physdam_claim_reported')"
      - latest_estimate: "LATEST('physdam_claim_events', 'repair_estimate_amount', date_field='estimate_sequence', event_type='physdam_estimate_recorded', claim_number=repair_claim)"
      - repair_cause: "LATEST('physdam_claim_events', 'loss_cause', date_field='entry_date', event_type='physdam_claim_reported', claim_number=repair_claim)"
      - owner_garaging: "CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id'))"
      - cause_deductible_amount: "0 if (repair_cause == 'comprehensive_glass' and owner_garaging in P('windshield_zero_deductible_states')) else (P('comprehensive_deductible') if (repair_cause != 'collision_with_vehicle' and repair_cause != 'collision_single_vehicle') else P('collision_deductible'))"
      - repair_operator: "LATEST('physdam_claim_events', 'driver_household_status', date_field='entry_date', event_type='physdam_claim_reported', claim_number=repair_claim)"
      - permissive_surcharge: "K('permissive_collision_add') if (repair_operator == 'non_household_permissive_user' and (repair_cause == 'collision_with_vehicle' or repair_cause == 'collision_single_vehicle')) else (K('permissive_comprehensive_add') if (repair_operator == 'non_household_permissive_user' and repair_cause != 'collision_with_vehicle' and repair_cause != 'collision_single_vehicle') else 0)"
      - owner_term_number: "CFIELD('auto', 'term_number', auto_policy_id=F('auto_policy_id'))"
      - owner_points: "CFIELD('auto', 'violation_points', auto_policy_id=F('auto_policy_id'))"
      - renewal_credit_amount: "K('long_renewal_credit') if (owner_term_number >= K('long_renewal_term') and owner_points == 0) else (K('renewal_credit') if (owner_term_number >= 2 and owner_points <= K('renewal_credit_max_points')) else 0)"
      - confirmation_date: "LATEST('physdam_claim_events', 'entry_date', date_field='entry_date', event_type='physdam_coverage_confirmed', claim_number=repair_claim)"
      - first_estimate_date: "LATEST('physdam_claim_events', 'entry_date', date_field='entry_date', event_type='physdam_estimate_recorded', claim_number=repair_claim, estimate_sequence=1)"
      - appraisal_wait_days: "DAYS(confirmation_date, first_estimate_date) if (confirmation_date != None and first_estimate_date != None) else 0"
      - towed_in_count: "COUNT('physdam_claim_payments', event_type='physdam_tow_storage_payment', claim_number=repair_claim)"
      - storage_cause: "LATEST('physdam_claim_events', 'loss_cause', date_field='entry_date', event_type='physdam_claim_reported', claim_number=repair_claim)"
      - storage_days: "0 if storage_cause == 'comprehensive_glass' else (MX(0, appraisal_wait_days - K('appraisal_free_days')) if towed_in_count > 0 else MN(MX(0, appraisal_wait_days - K('appraisal_free_days')), K('storage_day_allowance')))"
      - storage_state: "CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id'))"
      - storage_rate: "K('florida_storage_daily') if storage_state == 'FL' else (K('georgia_storage_daily') if storage_state == 'GA' else (K('texas_arizona_storage_daily') if (storage_state == 'TX' or storage_state == 'AZ') else K('standard_storage_daily')))"
      - repair_paid_before: "SUM('physdam_claim_payments', 'amount', event_type='physdam_repair_payment', claim_number=repair_claim)"
      - assigned_deductible: "MX(0, cause_deductible_amount + permissive_surcharge - renewal_credit_amount)"
      - appraisal_storage: "storage_days * storage_rate"
      - result: "0 if latest_estimate == None else MX(0, RND(latest_estimate + appraisal_storage - assigned_deductible - repair_paid_before, 2))"
    compute_basis:
      repair_claim: "The claim an assigned repair payment is figured for is the coverage's claim with the highest claim number; claim numbers are issued in sequence and never repeat, so that is the claim reported last."
      latest_estimate: "The assigned repair payment starts from the claim's latest cumulative repair estimate, the estimate entry with the highest estimate sequence on that claim."
      repair_cause: "The deductible for the loss's cause replaces the deductible the assigned repair payment carries as follows:"
      owner_garaging: "for a glass loss on a vehicle whose owner term is garaged in one of the package's windshield zero-deductible states, no deductible;"
      cause_deductible_amount: "The deductible for the loss's cause replaces the deductible the assigned repair payment carries as follows: for a glass loss on a vehicle whose owner term is garaged in one of the package's windshield zero-deductible states, no deductible; for any other comprehensive cause, a glass loss garaged in any other state included, the package's comprehensive deductible; for a collision cause, the package's collision deductible."
      repair_operator: "when the operator recorded on the claim report is a permissive user who does not live in the household and the cause is a collision, the permissive-collision surcharge;"
      permissive_surcharge: "A permissive-operator surcharge is added to the deductible the assigned repair payment carries: when the operator recorded on the claim report is a permissive user who does not live in the household and the cause is a collision, the permissive-collision surcharge; when that operator is such a permissive user and the cause is comprehensive, the permissive-comprehensive surcharge; for any other operator (a rated driver, a named excluded driver, an unlisted household resident, or no driver) no surcharge."
      owner_term_number: "A good-driver renewal credit is taken off the deductible the assigned repair payment carries, read from the owner term the coverage belongs to:"
      owner_points: "A good-driver renewal credit is taken off the deductible the assigned repair payment carries, read from the owner term the coverage belongs to:"
      renewal_credit_amount: "when that term's term number is at least the long-renewal term number and its violation points are zero, the long-renewal credit; when that term's term number is two or more, its violation points are at most the renewal-credit point limit, and it does not earn the long-renewal credit, the renewal credit; on a new-business term, or with more points than that limit, no credit."
      confirmation_date: "The appraisal wait of the assigned repair payment is counted in calendar days from the date the coverage confirmation was recorded on the claim to the date of the claim's first estimate (estimate sequence one), the first estimate's date counted and the confirmation date not counted, and it is zero days when either date is missing."
      first_estimate_date: "The appraisal wait of the assigned repair payment is counted in calendar days from the date the coverage confirmation was recorded on the claim to the date of the claim's first estimate (estimate sequence one), the first estimate's date counted and the confirmation date not counted, and it is zero days when either date is missing."
      appraisal_wait_days: "The appraisal wait of the assigned repair payment is counted in calendar days from the date the coverage confirmation was recorded on the claim to the date of the claim's first estimate (estimate sequence one), the first estimate's date counted and the confirmation date not counted, and it is zero days when either date is missing."
      storage_cause: "on a glass loss, no storage days, since a glass replacement does not hold the vehicle for the appraisal;"
      towed_in_count: "when the loss is not a glass loss and a tow and storage payment stands on the claim (the vehicle was towed in, so it could not be taken home), every day of the appraisal wait beyond the free appraisal days, never below zero and with no allowance limit;"
      storage_days: "The storage days of the assigned repair payment follow what kept the vehicle at the repair facility: on a glass loss, no storage days, since a glass replacement does not hold the vehicle for the appraisal; when the loss is not a glass loss and a tow and storage payment stands on the claim (the vehicle was towed in, so it could not be taken home), every day of the appraisal wait beyond the free appraisal days, never below zero and with no allowance limit; otherwise (a vehicle driven in on any other loss), the days of the appraisal wait beyond the free appraisal days, never below zero and never more than the storage-day allowance."
      storage_state: "The storage rate of the assigned repair payment follows the company's reasonable storage charge schedule for the garaging state of the owner term the coverage belongs to:"
      storage_rate: "The storage rate of the assigned repair payment follows the company's reasonable storage charge schedule for the garaging state of the owner term the coverage belongs to: Florida, the Florida daily storage rate; Georgia, the Georgia daily storage rate; Texas or Arizona, the Texas-Arizona daily storage rate; any other state (Virginia or Ohio), the standard daily storage rate."
      repair_paid_before: "The assigned repair payment is that estimate plus that storage less that deductible less the repair payments already made on the claim, rounded to the nearest cent at the end and never below zero."
      assigned_deductible: "the adjustments apply by kind: replacements first, then additions, then the amounts taken off, then the floor at zero;"
      appraisal_storage: "the storage is then the storage days times the storage rate."
      result: "The assigned repair payment is that estimate plus that storage less that deductible less the repair payments already made on the claim, rounded to the nearest cent at the end and never below zero. A claim with no recorded estimate has no assigned repair payment, which is zero."
    factors:
      - id: cause_rate_ladder
        effect: parameter
        decides: cause_deductible_amount
        bindings: [owner_garaging, cause_deductible_amount]
        ladder:
          - when: "a glass loss on a vehicle whose owner term is garaged in one of the package's windshield zero-deductible states"
            value: "0"
          - when: "any other comprehensive cause, a glass loss garaged in any other state included"
            value: "P('comprehensive_deductible')"
          - when: "otherwise (a collision cause)"
            value: "P('collision_deductible')"
        baseline:
          cause_deductible_amount: "P('collision_deductible')"
        evidence: [history, cross_category, tier_param]
        cross_difficulty: auto
      - id: permissive_operator
        effect: parameter
        decides: permissive_surcharge
        bindings: [repair_operator, permissive_surcharge]
        ladder:
          - when: "the operator on the claim report is a permissive user who does not live in the household and the cause is a collision"
            value: "K('permissive_collision_add')"
          - when: "the operator on the claim report is such a permissive user and the cause is comprehensive"
            value: "K('permissive_comprehensive_add')"
          - when: "otherwise (any other operator)"
            value: "0"
        baseline:
          permissive_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: good_driver_renewal
        effect: parameter
        decides: renewal_credit_amount
        bindings: [owner_term_number, owner_points, renewal_credit_amount]
        ladder:
          - when: "the owner term's term number is at least the long-renewal term number and its violation points are zero"
            value: "K('long_renewal_credit')"
          - when: "the owner term's term number is two or more, its violation points are at most the renewal-credit point limit, and it does not earn the long-renewal credit"
            value: "K('renewal_credit')"
          - when: "otherwise (a new-business term, or more points than the limit)"
            value: "0"
        baseline:
          renewal_credit_amount: "0"
        evidence: [cross_category]
        cross_difficulty: auto
      - id: appraisal_wait
        effect: method
        decides: storage_days
        bindings: [confirmation_date, first_estimate_date, appraisal_wait_days, storage_cause, towed_in_count, storage_days]
        ladder:
          - when: "a glass loss"
            method: "no storage days"
          - when: "a loss other than glass on which a tow and storage payment stands"
            method: "every day of the appraisal wait beyond the free appraisal days, with no allowance limit"
          - when: "otherwise (a vehicle driven in on any other loss)"
            method: "the days of the appraisal wait beyond the free appraisal days, never more than the storage-day allowance"
        baseline:
          storage_days: "MN(MX(0, appraisal_wait_days - K('appraisal_free_days')), K('storage_day_allowance'))"
        evidence: [history, date]
        cross_difficulty: null
      - id: storage_market_rate
        effect: parameter
        decides: storage_rate
        bindings: [storage_state, storage_rate]
        ladder:
          - when: "the owner term is garaged in Florida"
            value: "K('florida_storage_daily')"
          - when: "the owner term is garaged in Georgia"
            value: "K('georgia_storage_daily')"
          - when: "the owner term is garaged in Texas or Arizona"
            value: "K('texas_arizona_storage_daily')"
          - when: "otherwise (Virginia or Ohio)"
            value: "K('standard_storage_daily')"
        baseline:
          storage_rate: "K('standard_storage_daily')"
        evidence: [cross_category]
        cross_difficulty: auto
    baseline:
      rule: >-
        The claim an assigned repair payment is figured for is the coverage's claim with the highest claim number; claim numbers are issued in sequence and never repeat, so that is the claim reported last.
        The assigned repair payment starts from the claim's latest cumulative repair estimate, the estimate entry with the highest estimate sequence on that claim.
        The deductible the assigned repair payment carries is the package's collision deductible.
        The appraisal-wait storage the assigned repair payment carries is its storage days times the standard daily storage rate; at the standard its storage days are the days of the appraisal wait beyond the free appraisal days, never more than the storage-day allowance and never below zero. The appraisal wait of the assigned repair payment is counted in calendar days from the date the coverage confirmation was recorded on the claim to the date of the claim's first estimate (estimate sequence one), the first estimate's date counted and the confirmation date not counted, and it is zero days when either date is missing.
        The assigned repair payment is that estimate plus that storage less that deductible less the repair payments already made on the claim, rounded to the nearest cent at the end and never below zero.
        A claim with no recorded estimate has no assigned repair payment, which is zero.
      params: [collision_deductible, standard_storage_daily, appraisal_free_days, storage_day_allowance]
    inputs:
      history:
        - {table: physdam_claim_events, aggregate: latest, field: repair_estimate_amount, filters: {event_type: physdam_estimate_recorded}}
        - {table: physdam_claim_events, aggregate: latest, field: entry_date, filters: {event_type: physdam_coverage_confirmed}}
        - {table: physdam_claim_payments, aggregate: sum, field: amount, filters: {event_type: physdam_repair_payment}}
        - {table: physdam_claim_payments, aggregate: count, field: physdam_payment_id, filters: {event_type: physdam_tow_storage_payment}}
      cross_category: [auto]
  - id: physdam_ext_deductible_refund
    base_policy_refs: [physdam_recoveries]
    overwrite:
      - base_policy: physdam_recoveries
        superseded_clause: >-
          The named insured's deductible is returned in proportion to the share of total damages (payments plus deductible) recovered, rounded to the cent, and in full when the recovery is full;
        replaced_by: >-
          For every deductible refund, the named insured's deductible is returned as this rule sets out, never more than the deductible a refund is figured on and so in full when the recoveries shared reach the damages.
    trigger: on_request
    subject: [physdam_deductible_reimbursement]
    computes: amount
    target_tool: issue_deductible_refund_f60554e2
    params:
      permissive_collision_add: 500
      permissive_comprehensive_add: 250
    rule: >-
      A deductible refund returns to the named insured the deductible's share of the subrogation recoveries received on a claim.
      For every deductible refund, the named insured's deductible is returned as this rule sets out, never more than the deductible a refund is figured on and so in full when the recoveries shared reach the damages.
      The claim a deductible refund is figured for is the coverage's claim with the highest claim number; claim numbers are issued in sequence and never repeat.
      The deductible refund on a claim that records no total loss declaration and whose latest recorded repair estimate is more than the repair payments made on the claim for its earlier estimates plus the package's larger deductible and the permissive-collision surcharge is figured only after a repair payment stands on the claim for its latest recorded estimate.
      The deductible a refund is figured on is the package's collision deductible.
      The recoveries shared are the subrogation recoveries received on the claim.
      The damages the recoveries are shared over are the repair and total loss payments made on the claim plus the deductibles taken from those payments.
      The deductible refund is the deductible a refund is figured on times the recoveries shared divided by the damages, never more than that deductible, less any deductible refund already made on the claim, rounded to the nearest cent at the end and never below zero; when the damages are zero no refund is figured.
      Each adjustment below changes the deductible a refund is figured on or the damages it is shared over, as it states, and the adjustments apply by kind: replacements first, then additions, then the amounts taken off, then the floor at zero; the share is taken last.
      The deductible a refund is figured on is replaced by the deductible taken from the claim's own payments: when repair payments on the claim carry a deductible, the deductibles those repair payments carry; when no repair payment on the claim carries one and total loss payments on it do, the deductibles those total loss payments carry; when no payment on the claim carries a deductible, the package's collision deductible.
      A permissive-operator surcharge is never refunded and is taken off the deductible a refund is figured on: when the operator recorded on the claim report is a permissive user who does not live in the household and the cause is a collision, the permissive-collision surcharge; when that operator is such a permissive user and the cause is comprehensive, the permissive-comprehensive surcharge; for any other operator nothing is taken off.
      The damages a refund is shared over are measured instead as follows: on a claim that carries a repair payment, the claim's latest cumulative repair estimate, the estimate entry with the highest estimate sequence; on a claim without a repair payment that records a total loss declaration, the declared actual cash value less the declared salvage value; on any other claim, the repair and total loss payments made on it plus the deductibles taken from those payments.
      A rental part is added to the damages a refund is shared over, read from the vehicle's rental reimbursement coverage on the claim number: when rental benefits were paid on the claim, the benefits paid less those reversed plus the rental days not yet invoiced at the authorised daily rate, those days running from the day after the last day of the latest paid invoice period to the end of the rental, the end not counted; when no benefit has been paid but a rental was authorised on the claim, the authorised daily rate times the rental days from the authorised start date to the end of the rental, the start date counted and the end not, and no days when the rental ends on or before its start date; when no rental was authorised on the claim, nothing. The rental authorised on the claim is its authorisation with the latest entry date, the claim number and entry date identifying one authorisation so that no two share a date; its rate and start date are read from that authorisation, and the rental ends on the claim's latest closing entry when that closing is dated on or after that authorisation's entry date, and otherwise runs to today, since a closing dated before it belongs to an earlier authorisation.
      A tow part is added to the damages a refund is shared over, at the reasonable towing charge: when the tow and storage payments on the claim are more than the package's towing-from-scene limit, that limit; when they are no more than that limit, the payments; when the claim carries no tow and storage payment, nothing.
    prerequisite:
      - problem: physdam_ext_repair_assignment
        kind: value_input
        gate: deductible_borne
        form: state
        policy_source: >-
          The deductible refund on a claim that records no total loss declaration and whose latest recorded repair estimate is more than the repair payments made on the claim for its earlier estimates plus the package's larger deductible and the permissive-collision surcharge is figured only after a repair payment stands on the claim for its latest recorded estimate.
        condition: >-
          The claim records no total loss declaration, its latest recorded repair estimate is more than the repair payments made on the claim for its earlier estimates plus the package's larger deductible and the permissive-collision surcharge, and its payment ledger carries a repair payment whose estimate sequence is the highest estimate sequence recorded on the claim.
        resolved_by: assign_repair_payment_77b6ee43
        effect: >-
          Once the repair payment stands, the deductible a refund is figured on becomes the deductible that repair payment carries instead of the package's collision deductible, and the damages the refund is shared over start from the latest cumulative repair estimate.
    cross_category:
      - category: rental
        as: history
        reads: [rental_benefit_transactions.amount, rental_benefit_transactions.period_end_date, rental_authorizations.authorized_daily_rate, rental_authorizations.authorized_start_date, rental_authorizations.entry_date]
        note: The rental part added to the damages reads the rental benefits paid and reversed, or the rental authorised, on the claim number.
    compute:
      - refund_claim: "LATEST('physdam_claim_events', 'claim_number', date_field='claim_number', event_type='physdam_claim_reported')"
      - source_repair_count: "COUNT('physdam_claim_payments', event_type='physdam_repair_payment', claim_number=refund_claim)"
      - source_repair_ded: "SUM('physdam_claim_payments', 'deductible_applied', event_type='physdam_repair_payment', claim_number=refund_claim)"
      - source_total_loss_ded: "SUM('physdam_claim_payments', 'deductible_applied', event_type='physdam_total_loss_payment', claim_number=refund_claim)"
      - deductible_borne: "source_repair_ded if (source_repair_count > 0 and source_repair_ded > 0) else (source_total_loss_ded if (source_repair_ded <= 0 and source_total_loss_ded > 0) else P('collision_deductible'))"
      - refund_cause: "LATEST('physdam_claim_events', 'loss_cause', date_field='entry_date', event_type='physdam_claim_reported', claim_number=refund_claim)"
      - refund_operator: "LATEST('physdam_claim_events', 'driver_household_status', date_field='entry_date', event_type='physdam_claim_reported', claim_number=refund_claim)"
      - nonrefundable_surcharge: "K('permissive_collision_add') if (refund_operator == 'non_household_permissive_user' and (refund_cause == 'collision_with_vehicle' or refund_cause == 'collision_single_vehicle')) else (K('permissive_comprehensive_add') if (refund_operator == 'non_household_permissive_user' and refund_cause != 'collision_with_vehicle' and refund_cause != 'collision_single_vehicle') else 0)"
      - part_repair_count: "COUNT('physdam_claim_payments', event_type='physdam_repair_payment', claim_number=refund_claim)"
      - refund_latest_estimate: "LATEST('physdam_claim_events', 'repair_estimate_amount', date_field='estimate_sequence', event_type='physdam_estimate_recorded', claim_number=refund_claim)"
      - declared_acv: "LATEST('physdam_claim_events', 'acv_amount', date_field='entry_date', event_type='physdam_total_loss_declared', claim_number=refund_claim)"
      - declared_salvage: "LATEST('physdam_claim_events', 'salvage_value', date_field='entry_date', event_type='physdam_total_loss_declared', claim_number=refund_claim)"
      - declaration_count: "COUNT('physdam_claim_events', event_type='physdam_total_loss_declared', claim_number=refund_claim)"
      - paid_repair: "SUM('physdam_claim_payments', 'amount', event_type='physdam_repair_payment', claim_number=refund_claim)"
      - paid_total_loss: "SUM('physdam_claim_payments', 'amount', event_type='physdam_total_loss_payment', claim_number=refund_claim)"
      - paid_repair_ded: "SUM('physdam_claim_payments', 'deductible_applied', event_type='physdam_repair_payment', claim_number=refund_claim)"
      - paid_total_loss_ded: "SUM('physdam_claim_payments', 'deductible_applied', event_type='physdam_total_loss_payment', claim_number=refund_claim)"
      - repair_damages: "refund_latest_estimate if (part_repair_count > 0 and refund_latest_estimate != None) else ((declared_acv - declared_salvage) if (part_repair_count == 0 and declaration_count > 0) else (paid_repair + paid_total_loss + paid_repair_ded + paid_total_loss_ded))"
      - rental_paid: "XSUM('rental', 'rental_benefit_transactions', 'amount', event_type='rental_benefit_paid', claim_number=refund_claim)"
      - rental_reversed: "XSUM('rental', 'rental_benefit_transactions', 'amount', event_type='rental_benefit_reversed', claim_number=refund_claim)"
      - rental_auth_rate: "XLATEST('rental', 'rental_authorizations', 'authorized_daily_rate', date_field='entry_date', event_type='rental_authorized', claim_number=refund_claim)"
      - rental_auth_start: "XLATEST('rental', 'rental_authorizations', 'authorized_start_date', date_field='entry_date', event_type='rental_authorized', claim_number=refund_claim)"
      - rental_auth_entry: "XLATEST('rental', 'rental_authorizations', 'entry_date', date_field='entry_date', event_type='rental_authorized', claim_number=refund_claim)"
      - rental_closed_on: "XLATEST('rental', 'rental_authorizations', 'entry_date', date_field='entry_date', event_type='rental_authorization_closed', claim_number=refund_claim)"
      - rental_paid_through: "XLATEST('rental', 'rental_benefit_transactions', 'period_end_date', date_field='period_end_date', event_type='rental_benefit_paid', claim_number=refund_claim)"
      - rental_end: "rental_closed_on if (rental_closed_on != None and rental_auth_entry != None and DAYS(rental_auth_entry, rental_closed_on) >= 0) else NOW"
      - rental_part: "(rental_paid - rental_reversed + (rental_auth_rate * MX(0, DAYS(rental_paid_through, rental_end) - 1) if (rental_auth_rate != None and rental_paid_through != None) else 0)) if rental_paid > 0 else ((rental_auth_rate * MX(0, DAYS(rental_auth_start, rental_end))) if rental_auth_rate != None else 0)"
      - tow_storage_paid: "SUM('physdam_claim_payments', 'amount', event_type='physdam_tow_storage_payment', claim_number=refund_claim)"
      - tow_part: "P('towing_from_scene_limit') if tow_storage_paid > P('towing_from_scene_limit') else (tow_storage_paid if tow_storage_paid > 0 else 0)"
      - refundable_deductible: "MX(0, deductible_borne - nonrefundable_surcharge)"
      - recoveries_shared: "SUM('physdam_claim_payments', 'amount', event_type='physdam_subrogation_recovery', claim_number=refund_claim)"
      - refund_damages: "repair_damages + rental_part + tow_part"
      - refunded_before: "SUM('physdam_claim_payments', 'amount', event_type='physdam_deductible_reimbursement', claim_number=refund_claim)"
      - result: "0 if refund_damages <= 0 else MX(0, RND(MN(refundable_deductible, refundable_deductible * recoveries_shared / refund_damages) - refunded_before, 2))"
    compute_basis:
      refund_claim: "The claim a deductible refund is figured for is the coverage's claim with the highest claim number; claim numbers are issued in sequence and never repeat."
      source_repair_count: "when repair payments on the claim carry a deductible, the deductibles those repair payments carry;"
      source_repair_ded: "when repair payments on the claim carry a deductible, the deductibles those repair payments carry;"
      source_total_loss_ded: "when no repair payment on the claim carries one and total loss payments on it do, the deductibles those total loss payments carry;"
      deductible_borne: "The deductible a refund is figured on is replaced by the deductible taken from the claim's own payments: when repair payments on the claim carry a deductible, the deductibles those repair payments carry; when no repair payment on the claim carries one and total loss payments on it do, the deductibles those total loss payments carry; when no payment on the claim carries a deductible, the package's collision deductible."
