    subject: [physdam_coverage_removed, physdam_premium_returned]
    computes: amount
    target_tool: remove_totaled_coverage_12b8272a
    params:
      substitution_short_rate: 5.0
      first_minimum_days: 90
      second_minimum_days: 180
      standard_minimum_earned_pct: 10
      autopay_minimum_earned_pct: 8
      paid_in_full_minimum_earned_pct: 5
      long_renewal_term: 3
    rule: >-
      The coverage return is the unearned comprehensive and collision premium returned when the named insured asks to remove a vehicle's physical damage coverage, the totaled vehicle's coverage included; the coverage is removed effective the day it is asked for.
      For a removal the named insured asks for, and only for such a removal, the return is the coverage return this rule sets out; every other return uses the days from the removal or termination date to the expiration date at the full-term rate divided by the owner term's days.
      For the coverage of a vehicle declared a total loss, and only for such a coverage, the loss payee's notice period runs from the day of the total loss declaration, the loss payee being told of the total loss that day, and the coverage is removed no earlier than loss_payee_notice_days calendar days after it; any other coverage with a loss payee is removed no earlier than loss_payee_notice_days calendar days after the loss payee was notified.
      The claim a coverage return looks to is the coverage's claim with the highest claim number, the number issued last.
      The coverage return on a vehicle whose latest claim records a total loss declaration is figured only after a total loss payment to the named insured stands on that claim.
      The coverage return starts from the full-term rate on the coverage-added premium charge times the return days divided by the owner term's days.
      The return days are the calendar days from today, the day the removal is asked for, to the coverage's expiration date, the expiration date counted and today not.
      The owner package's short-rate retention percent of that amount is kept by the company.
      A minimum-earned charge is taken off the coverage return: the minimum-earned percent of the full-term rate, times the time-in-force share of the minimum-earned charge, times the tenure share of the minimum-earned charge; at the standard the percent is the standard minimum-earned percent and both shares are one, the whole charge.
      The coverage return is the amount left, rounded to the nearest cent at the end and never below zero.
      Each adjustment below changes the full-term rate, the return days, the share kept, the minimum-earned percent, the time-in-force share or the tenure share of the minimum-earned charge, as it states, and the adjustments apply by kind: replacements first, the rate times the return days divided by the owner term's days less the share kept being then figured, then the amounts taken off, then the rounding and the floor at zero.
      The full-term rate of the coverage return replaces the coverage-added rate by the coverage's latest premium charge, latest by effective date: when that latest charge is a package change (a package change and a restoration sharing the latest effective date count as the package change), the full-term rate on that package-change charge; when it is a restoration after a reinstatement of the owner term, the full-term rate on that restoration charge; when the only charge is the coverage-added charge, its full-term rate.
      The return days of the coverage return start instead as follows: when the latest claim records a total loss declaration and a total loss payment to the named insured stands on it, from that claim's date of loss, since the totaled vehicle had no exposure after it; when the coverage is still awaiting its photo inspection and no total loss payment to the named insured stands on its latest claim, from the coverage effective date, so that every premium day charged comes back; otherwise from today.
      The share kept from the coverage return replaces the owner package's short-rate retention percent as follows: when the latest claim records a total loss declaration, nothing is kept; when it does not and the latest vehicle added to the owner term, latest by change effective date, took effect no earlier than the owner package's replacement-vehicle reporting days before today and no later than today, both of those days counted (a vehicle substitution), the substitution short-rate percent; otherwise the owner package's short-rate retention percent.
      The time-in-force share of the minimum-earned charge is replaced by how long the coverage has been in force, counted in calendar days from its effective date to today, today counted and the effective date not: at least the first minimum days but fewer than the second minimum days, one half; the second minimum days or more, zero; fewer than the first minimum days, one, the whole charge.
      The minimum-earned percent of the coverage return follows the payment plan billing the owner term the coverage belongs to, as the company's filed minimum-earned percents by payment plan: the Cardinal Point Paid-in-Full Plan, the paid-in-full minimum-earned percent; the Cardinal Point Monthly EFT Plan or the Cardinal Point Monthly Card Autopay Plan, the autopay minimum-earned percent; any other plan, the standard minimum-earned percent.
      The tenure share of the minimum-earned charge is replaced by the tenure of the owner term the coverage belongs to, as the company's filed minimum-earned rule for renewal business: on a renewal term whose term number is at least the long-renewal term number, zero; on any other renewal term (term number two or more), one half; otherwise (a new-business term), one, the whole charge.
    prerequisite:
      - problem: physdam_ext_owner_tax_title
        kind: value_input
        gate: return_days
        form: state
        policy_source: >-
          The coverage return on a vehicle whose latest claim records a total loss declaration is figured only after a total loss payment to the named insured stands on that claim.
        condition: >-
          The latest claim of the coverage records a total loss declaration and its payment ledger carries a total loss payment whose payee is the named insured.
        resolved_by: accept_total_loss_settlement_6ed13516
        effect: >-
          Once the named insured's total loss payment stands, the return days run from the claim's date of loss instead of from today.
    cross_category:
      - category: auto
        as: branch
        reads: [term_number, term_days, insured_cancel_short_rate_retention_pct, replacement_vehicle_reporting_days, auto_policy_changes.change_effective_date]
        note: The share kept reads the vehicles added to the owner term, the owner package's short-rate percent and reporting days; the tenure share of the minimum-earned charge reads the owner term's term number; the proration reads the term days.
      - category: billing
        as: branch
        reads: [variant_name]
        note: The minimum-earned percent reads the payment plan billing the owner term.
    compute:
      - ret_claim: "LATEST('physdam_claim_events', 'claim_number', date_field='claim_number', event_type='physdam_claim_reported')"
      - ret_term_days: "CFIELD('auto', 'term_days', auto_policy_id=F('auto_policy_id'))"
      - pc_count: "COUNT('physdam_premium_transactions', event_type='physdam_premium_written', transaction_reason='package_change')"
      - pc_date: "LATEST('physdam_premium_transactions', 'effective_date', date_field='effective_date', event_type='physdam_premium_written', transaction_reason='package_change')"
      - pc_rate: "LATEST('physdam_premium_transactions', 'vehicle_term_coverage_premium', date_field='effective_date', event_type='physdam_premium_written', transaction_reason='package_change')"
      - rest_count: "COUNT('physdam_premium_transactions', event_type='physdam_premium_written', transaction_reason='owner_term_reinstated')"
      - rest_date: "LATEST('physdam_premium_transactions', 'effective_date', date_field='effective_date', event_type='physdam_premium_written', transaction_reason='owner_term_reinstated')"
      - rest_rate: "LATEST('physdam_premium_transactions', 'vehicle_term_coverage_premium', date_field='effective_date', event_type='physdam_premium_written', transaction_reason='owner_term_reinstated')"
      - added_rate: "LATEST('physdam_premium_transactions', 'vehicle_term_coverage_premium', date_field='effective_date', event_type='physdam_premium_written', transaction_reason='coverage_added')"
      - return_rate: "pc_rate if (pc_count > 0 and (rest_count == 0 or DAYS(rest_date, pc_date) >= 0)) else (rest_rate if (rest_count > 0 and (pc_count == 0 or DAYS(pc_date, rest_date) > 0)) else added_rate)"
      - anchor_decl_count: "COUNT('physdam_claim_events', event_type='physdam_total_loss_declared', claim_number=ret_claim)"
      - anchor_insured_paid: "COUNT('physdam_claim_payments', event_type='physdam_total_loss_payment', payee_type='named_insured', claim_number=ret_claim)"
      - anchor_loss_date: "LATEST('physdam_claim_events', 'date_of_loss', date_field='entry_date', event_type='physdam_claim_reported', claim_number=ret_claim)"
      - return_days: "DAYS(anchor_loss_date, F('expiration_date')) if (anchor_decl_count > 0 and anchor_insured_paid > 0 and anchor_loss_date != None) else (DAYS(F('effective_date'), F('expiration_date')) if (F('status') == 'inspection_pending' and anchor_insured_paid == 0) else DAYS(NOW, F('expiration_date')))"
      - sr_decl_count: "COUNT('physdam_claim_events', event_type='physdam_total_loss_declared', claim_number=ret_claim)"
      - sr_package_pct: "CPARAM('auto', 'insured_cancel_short_rate_retention_pct', auto_policy_id=F('auto_policy_id'))"
      - sr_window: "CPARAM('auto', 'replacement_vehicle_reporting_days', auto_policy_id=F('auto_policy_id'))"
      - sr_vehicle_added_on: "XLATEST('auto', 'auto_policy_changes', 'change_effective_date', date_field='change_effective_date', event_type='auto_vehicle_added', auto_policy_id=F('auto_policy_id'))"
      - sr_added_days_ago: "DAYS(sr_vehicle_added_on, NOW) if sr_vehicle_added_on != None else -1"
      - short_rate_pct: "0 if sr_decl_count > 0 else (K('substitution_short_rate') if (sr_decl_count == 0 and sr_added_days_ago >= 0 and sr_added_days_ago <= sr_window) else sr_package_pct)"
      - in_force_days: "DAYS(F('effective_date'), NOW)"
      - minimum_earned_share: "1 if in_force_days < K('first_minimum_days') else (0.5 if in_force_days < K('second_minimum_days') else 0)"
      - plan_name: "CFIELD('billing', 'variant_name', auto_policy_id=F('auto_policy_id'))"
      - minimum_earned_pct: "K('paid_in_full_minimum_earned_pct') if plan_name == 'Cardinal Point Paid-in-Full Plan' else (K('autopay_minimum_earned_pct') if (plan_name == 'Cardinal Point Monthly EFT Plan' or plan_name == 'Cardinal Point Monthly Card Autopay Plan') else K('standard_minimum_earned_pct'))"
      - tenure_term_number: "CFIELD('auto', 'term_number', auto_policy_id=F('auto_policy_id'))"
      - minimum_earned_renewal_share: "0 if tenure_term_number >= K('long_renewal_term') else (0.5 if tenure_term_number >= 2 else 1)"
      - minimum_earned_charge: "return_rate * minimum_earned_pct / 100 * minimum_earned_share * minimum_earned_renewal_share"
      - prorated_return: "return_rate * return_days / ret_term_days"
      - result: "MX(0, RND(prorated_return * (1 - short_rate_pct / 100) - minimum_earned_charge, 2))"
