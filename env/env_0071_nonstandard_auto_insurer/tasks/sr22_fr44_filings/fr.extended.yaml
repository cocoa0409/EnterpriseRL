- id: fr_ext_cancellation_sr26_runoff
  base_policy_refs:
  - fr_sr26_notice
  - fr_agg_backing_term
  overwrite:
  - base_policy: fr_sr26_notice
    superseded_clause: The certificate end date is the SR-26 date plus certificate_runoff_days calendar days.
    replaced_by: For a cancellation SR-26 the certificate end date is the SR-26 date plus the cancellation run-off days
      worked out below; an SR-26 for a certificate whose backing term was cancelled and has since been reinstated with
      a lapse takes its run-off from the lapse SR-26 rule, and every other SR-26 keeps the certificate end date at the
      SR-26 date plus certificate_runoff_days calendar days.
  - base_policy: fr_sr26_notice
    superseded_clause: An SR-26 is transmitted no later than sr26_transmit_within_days calendar days after the date coverage
      under the backing term ended.
    replaced_by: 'For a cancellation SR-26 the window runs from the backing term''s closed_date: the SR-26 is transmitted
      no later than sr26_transmit_within_days calendar days after that date, counted from it as day 0; a cancellation
      SR-26 not transmitted by then is still owed, is transmitted at once on the day it is found owed, and its certificate
      end date is counted from the date it is actually transmitted; a lapse SR-26, for a backing term reinstated with
      a lapse, keeps the window the lapse SR-26 rule states, and every other SR-26 for an ended backing term is transmitted
      no later than sr26_transmit_within_days calendar days after the date coverage under the backing term ended.'
  trigger: state_due
  subject:
  - fr_sr26_transmitted
  computes: runoff_days
  target_tool: transmit_cancellation_sr26_eaec830f
  params:
    cancel_fr44_group_notice_days: 4
    cancel_south_group_notice_days: 2
    cancel_out_of_region_notice_days: 3
    cancel_in_region_notice_days: 1
    cancel_owner_operator_notice_days: 2
    cancel_operator_notice_days: 1
  rule: 'This rule fixes the run-off of the cancellation SR-26: the SR-26 transmitted for an SR-22 or FR-44 certificate
    of any type whose backing term, an Owner Auto Policy term or a Named Non-Owner term, was cancelled and has not been
    reinstated, for any cancellation_reason; the SR-26 reason is policy_cancelled, the ending date is the backing term''s
    closed_date (its cancellation effective date), and the SR-26 is transmitted no earlier than that date. For a cancellation
    SR-26 the window runs from the backing term''s closed_date: the SR-26 is transmitted no later than sr26_transmit_within_days
    calendar days after that date, counted from it as day 0; a cancellation SR-26 not transmitted by then is still owed,
    is transmitted at once on the day it is found owed, and its certificate end date is counted from the date it is actually
    transmitted; a lapse SR-26, for a backing term reinstated with a lapse, keeps the window the lapse SR-26 rule states,
    and every other SR-26 for an ended backing term is transmitted no later than sr26_transmit_within_days calendar days
    after the date coverage under the backing term ended. For a cancellation SR-26 the certificate end date is the SR-26
    date plus the cancellation run-off days worked out below; an SR-26 for a certificate whose backing term was cancelled
    and has since been reinstated with a lapse takes its run-off from the lapse SR-26 rule, and every other SR-26 keeps
    the certificate end date at the SR-26 date plus certificate_runoff_days calendar days. The standard cancellation
    run-off is the certificate''s certificate_runoff_days, counted in calendar days from the SR-26 date, and the cancellation
    run-off days are a whole number of days. The adjustments below make up Cardinal Point''s own SR-26 notice schedule
    for cancellations that were not reinstated. The adjustments below are applied to the standard cancellation run-off
    in this order: an adjustment that changes how the standard cancellation run-off is counted is applied first, and
    every adjustment that adds days is then added to that result; the cancellation run-off is never below zero days.
    Each dimension enters the schedule once. The counting of the standard cancellation run-off follows why and when the
    backing term ended, read from its cancellation_reason and closed_date. For a cancellation_reason of insured_request,
    the standard cancellation run-off is counted from the term''s closed_date, so the cancellation run-off days are the
    standard cancellation run-off less the calendar days from the closed_date to the SR-26 date (zero days when the closed_date
    is later), never below zero. For a cancellation_reason of nonpayment with no more than the package''s reinstatement_window_days
    calendar days from the closed_date to the SR-26 date, the cancellation run-off days are the larger of the standard
    cancellation run-off and the reinstatement_window_days less those calendar days. Otherwise the standard cancellation
    run-off is counted from the SR-26 date. The cancellation state notice days follows the state group of the backing
    term''s own state (the resident_state of a Named Non-Owner term, the garaging_state of an Owner Auto Policy term).
    Florida or Virginia adds cancel_fr44_group_notice_days; Texas or Georgia adds cancel_south_group_notice_days; Arizona
    or Ohio adds no cancellation state notice days. The cancellation out-of-state notice days follows whether the filing
    state differs from the backing term''s own state, and whether the two lie in the same state group, the state groups
    being Florida and Virginia, Texas and Georgia, and Arizona and Ohio. A filing state in a different state group from
    the backing term''s own state adds cancel_out_of_region_notice_days; a different filing state in the same state group
    adds cancel_in_region_notice_days; a filing state equal to the backing term''s own state adds no cancellation out-of-state
    notice days. The cancellation type notice days follows the certificate type, which fixes the kind of backing term
    it rests on. An Owner-Operator certificate on an Owner Auto Policy backing term adds cancel_owner_operator_notice_days;
    an Operator certificate on a Named Non-Owner backing term adds cancel_operator_notice_days; an Owner certificate
    adds no cancellation type notice days.'
  prerequisite: []
  cross_category:
  - category: nonowner
    as: branch
    reads:
    - resident_state
    - cancellation_reason
    - closed_date
    - financial_responsibility_filing
    - lapse_end_date
    - lapse_start_date
    - reinstatement_date
    - status
    - variant_name
    note: The cancellation run-off reads a Named Non-Owner backing term's dates, cancellation reason, resident state,
      record and the certificate it is written to back.
  - category: auto
    as: branch
    reads:
    - garaging_state
    - cancellation_reason
    - closed_date
    - financial_responsibility_filing
    - lapse_end_date
    - lapse_start_date
    - reinstatement_date
    - status
    - variant_name
    note: The cancellation run-off reads an Owner Auto Policy backing term's dates, cancellation reason, garaging state,
      record and the certificate it is written to back.
  compute:
  - std: P('certificate_runoff_days')
  - cancel_reason: (F('nonowner_policy_id') and CFIELD('nonowner', 'cancellation_reason', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'cancellation_reason', auto_policy_id=F('auto_policy_id')))
  - cancel_closed: (F('nonowner_policy_id') and CFIELD('nonowner', 'closed_date', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'closed_date', auto_policy_id=F('auto_policy_id')))
  - cancel_window: (F('nonowner_policy_id') and CPARAM('nonowner', 'reinstatement_window_days', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CPARAM('auto', 'reinstatement_window_days', auto_policy_id=F('auto_policy_id')))
  - cancel_counted: MX(0, std - MX(0, DAYS(cancel_closed, NOW))) if (cancel_reason == 'insured_request' and cancel_closed)
      else (MX(std, cancel_window - DAYS(cancel_closed, NOW)) if (cancel_reason == 'nonpayment' and cancel_closed and
      cancel_window and DAYS(cancel_closed, NOW) <= cancel_window) else std)
  - cancel_rating_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id')))
  - cancel_state: K('cancel_fr44_group_notice_days') if (cancel_rating_state == 'FL' or cancel_rating_state == 'VA')
      else (K('cancel_south_group_notice_days') if (cancel_rating_state == 'TX' or cancel_rating_state == 'GA') else
      0)
  - cancel_home_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id')))
  - cancel_out: K('cancel_in_region_notice_days') if (cancel_home_state and F('filing_state') != cancel_home_state and
      (((F('filing_state') == 'FL' or F('filing_state') == 'VA') and (cancel_home_state == 'FL' or cancel_home_state
      == 'VA')) or ((F('filing_state') == 'TX' or F('filing_state') == 'GA') and (cancel_home_state == 'TX' or cancel_home_state
      == 'GA')) or ((F('filing_state') == 'AZ' or F('filing_state') == 'OH') and (cancel_home_state == 'AZ' or cancel_home_state
      == 'OH')))) else (K('cancel_out_of_region_notice_days') if (cancel_home_state and F('filing_state') != cancel_home_state)
      else 0)
  - cancel_owner_term: CFIELD('auto', 'status', auto_policy_id=F('auto_policy_id'))
  - cancel_nonowner_term: CFIELD('nonowner', 'status', nonowner_policy_id=F('nonowner_policy_id'))
  - cancel_type: K('cancel_owner_operator_notice_days') if (P('certificate_type') == 'owner_operator' and cancel_owner_term)
      else (K('cancel_operator_notice_days') if (P('certificate_type') == 'operator' and cancel_nonowner_term) else 0)
  - result: int(MX(0, cancel_counted + cancel_state + cancel_out + cancel_type))
  compute_basis:
    std: The standard cancellation run-off is the certificate's certificate_runoff_days, counted in calendar days from
      the SR-26 date, and the cancellation run-off days are a whole number of days.
    cancel_rating_state: The cancellation state notice days follows the state group of the backing term's own state (the
      resident_state of a Named Non-Owner term, the garaging_state of an Owner Auto Policy term).
    cancel_state: Florida or Virginia adds cancel_fr44_group_notice_days; Texas or Georgia adds cancel_south_group_notice_days;
      Arizona or Ohio adds no cancellation state notice days.
    cancel_home_state: The cancellation out-of-state notice days follows whether the filing state differs from the backing
      term's own state, and whether the two lie in the same state group, the state groups being Florida and Virginia,
      Texas and Georgia, and Arizona and Ohio.
    cancel_out: A filing state in a different state group from the backing term's own state adds cancel_out_of_region_notice_days;
      a different filing state in the same state group adds cancel_in_region_notice_days; a filing state equal to the
      backing term's own state adds no cancellation out-of-state notice days.
    cancel_owner_term: The cancellation type notice days follows the certificate type, which fixes the kind of backing
      term it rests on.
    cancel_nonowner_term: The cancellation type notice days follows the certificate type, which fixes the kind of backing
      term it rests on.
    cancel_type: An Owner-Operator certificate on an Owner Auto Policy backing term adds cancel_owner_operator_notice_days;
      an Operator certificate on a Named Non-Owner backing term adds cancel_operator_notice_days; an Owner certificate
      adds no cancellation type notice days.
    result: 'The adjustments below are applied to the standard cancellation run-off in this order: an adjustment that
      changes how the standard cancellation run-off is counted is applied first, and every adjustment that adds days
      is then added to that result; the cancellation run-off is never below zero days. Each dimension enters the schedule
      once.'
    cancel_reason: The counting of the standard cancellation run-off follows why and when the backing term ended, read
      from its cancellation_reason and closed_date.
    cancel_closed: The counting of the standard cancellation run-off follows why and when the backing term ended, read
      from its cancellation_reason and closed_date.
    cancel_window: The counting of the standard cancellation run-off follows why and when the backing term ended, read
      from its cancellation_reason and closed_date.
    cancel_counted: For a cancellation_reason of insured_request, the standard cancellation run-off is counted from the
      term's closed_date, so the cancellation run-off days are the standard cancellation run-off less the calendar days
      from the closed_date to the SR-26 date (zero days when the closed_date is later), never below zero. For a cancellation_reason
      of nonpayment with no more than the package's reinstatement_window_days calendar days from the closed_date to the
      SR-26 date, the cancellation run-off days are the larger of the standard cancellation run-off and the reinstatement_window_days
      less those calendar days. Otherwise the standard cancellation run-off is counted from the SR-26 date.
  factors:
  - id: cancel_runoff_counting
    effect: method
    decides: cancel_counted
    bindings:
    - cancel_reason
    - cancel_closed
    - cancel_window
    - cancel_counted
    ladder:
    - when: the backing term's cancellation_reason is insured_request
      method: the standard cancellation run-off less the calendar days from the closed_date to the SR-26 date, never
        below zero
    - when: the cancellation_reason is nonpayment and no more than the package's reinstatement_window_days calendar days
        have passed from the closed_date to the SR-26 date
      method: the larger of the standard cancellation run-off and the reinstatement_window_days less those calendar days
    - when: otherwise
      method: the standard cancellation run-off counted from the SR-26 date
    baseline:
      cancel_counted: std
    evidence:
    - cross_category
    - date
    cross_difficulty: auto
  - id: cancel_state_notice
    effect: parameter
    decides: cancel_state
    bindings:
    - cancel_rating_state
    - cancel_state
    ladder:
    - when: the backing term's own state is Florida or Virginia
      value: K('cancel_fr44_group_notice_days')
    - when: it is Texas or Georgia
      value: K('cancel_south_group_notice_days')
    - when: otherwise (Arizona or Ohio)
      value: '0'
    baseline:
      cancel_state: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: cancel_out_of_state_notice
    effect: parameter
    decides: cancel_out
    bindings:
    - cancel_home_state
    - cancel_out
    ladder:
    - when: the filing state lies in a different state group from the backing term's own state
      value: K('cancel_out_of_region_notice_days')
    - when: the filing state differs from it but lies in the same state group
      value: K('cancel_in_region_notice_days')
    - when: otherwise (the filing state equals it)
      value: '0'
    baseline:
      cancel_out: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: cancel_type_notice
    effect: parameter
    decides: cancel_type
    bindings:
    - cancel_owner_term
    - cancel_nonowner_term
    - cancel_type
    ladder:
    - when: an Owner-Operator certificate on an Owner Auto Policy backing term
      value: K('cancel_owner_operator_notice_days')
    - when: an Operator certificate on a Named Non-Owner backing term
      value: K('cancel_operator_notice_days')
    - when: otherwise (an Owner certificate)
      value: '0'
    baseline:
      cancel_type: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: auto
  baseline:
    rule: The standard cancellation run-off is the certificate's certificate_runoff_days, counted in calendar days from
      the SR-26 date, and the cancellation run-off days are a whole number of days.
    params:
    - certificate_runoff_days
  inputs:
    history: []
    cross_category:
    - nonowner
    - auto
- id: fr_ext_unbilled_fee
  base_policy_refs:
  - fr_filing_fee_rule
  overwrite:
  - base_policy: fr_filing_fee_rule
    superseded_clause: The filing fee is the certificate's filing_fee, charged once when a filing is requested for a
      reason in fee_charged_filing_reasons and billed on the backing term's billing plan.
    replaced_by: For a filing requested for a reason in fee_charged_filing_reasons whose fee charges were all reversed
      in full as charged in error, and only for such a filing, the filing fee is charged again at the fee worked out
      below and billed on the backing term's billing plan; a reinstatement_refiling and a state_change refiling after
      a move are priced under their own rules, and every other filing requested for a reason in fee_charged_filing_reasons
      is charged the certificate's filing_fee, once, when it is requested, billed on the backing term's billing plan.
  - base_policy: fr_filing_fee_rule
    superseded_clause: Only one filing fee is charged per filing request.
    replaced_by: Only one filing fee is charged per filing request, except that a fee reversed in full as charged in
      error is charged again once, so that one fee stands on the request.
  trigger: state_due
  subject:
  - fr_filing_fee_assessed
  computes: fee_amount
  target_tool: post_unbilled_filing_fee_f14427ed
  params:
    minimum_recharge: 10.0
    recharge_base_fee: 25.0
    recharge_company_cancel_charge: 4.0
    recharge_insured_cancel_charge: 2.0
    recharge_fr44_group_charge: 6.0
    recharge_south_group_charge: 3.0
    recharge_out_of_region_charge: 8.0
    recharge_in_region_charge: 4.0
    recharge_owner_operator_charge: 4.0
    recharge_operator_charge: 2.0
    recharge_fr44_form_charge: 10.0
    recharge_sr22_form_charge: 2.0
  rule: 'This rule prices the fee charged again on a filing (an SR-22 or FR-44 certificate) requested for a reason in
    fee_charged_filing_reasons whose fee charges were all reversed in full with waiver_reason company_error, so that
    its fee ledger shows no fee standing, where the filing rests on an Owner Auto Policy term, or on a Named Non-Owner
    term whose status is not cancelled; the fee is booked on that filing with its own filing_reason as the fee reason.
    For a filing requested for a reason in fee_charged_filing_reasons whose fee charges were all reversed in full as
    charged in error, and only for such a filing, the filing fee is charged again at the fee worked out below and billed
    on the backing term''s billing plan; a reinstatement_refiling and a state_change refiling after a move are priced
    under their own rules, and every other filing requested for a reason in fee_charged_filing_reasons is charged the
    certificate''s filing_fee, once, when it is requested, billed on the backing term''s billing plan. Only one filing
    fee is charged per filing request, except that a fee reversed in full as charged in error is charged again once,
    so that one fee stands on the request. A fee charged again is not fixed until the filing it is charged on, when that
    filing''s Owner Auto Policy backing term has been cancelled, carries an SR-26 date and a certificate end date. The
    standard fee charged again is recharge_base_fee, Cardinal Point''s flat filing fee for a fee charged again, in US
    dollars to the cent. The adjustments below make up Cardinal Point''s own filing-fee schedule for a fee charged again.
    The adjustments below are applied to the standard fee of this rule in this order: an adjustment that replaces the
    standard fee is applied first, and every adjustment that adds an amount is then added to that result; that total
    is never below minimum_recharge, the fee charged again is then never more than the fees reversed on the filing less
    any fee still standing on it, and it is rounded to the cent, half up, once at the end. Each dimension enters the
    schedule once. The fees reversed on the filing are the amounts of its fee reversals, and the fee standing on it is
    its fee charges less its fee reversals, never below zero. The re-charge fee basis, which replaces the standard fee
    of this rule, follows how the filing''s coverage with the state ended, read from its sr26_date and certificate_end_date.
    When the filing carries an SR-26 date and its certificate end date is on or after the posting date, so that the state
    still treats the driver as certified, the re-charge fee basis is half the standard fee of this rule rounded up to
    the next whole dollar. When it carries an SR-26 date and its certificate end date is before the posting date, so
    that its certification with the state has lapsed, the re-charge fee basis is one and a half times the standard fee
    of this rule rounded down to the whole dollar. When it carries no SR-26 date, its backing coverage not having ended,
    the re-charge fee basis is the standard fee of this rule. The re-charge ending charge follows how the backing term''s
    coverage ended, read from its recorded cancellation_reason, which a term cancelled and since reinstated keeps. A
    backing term whose recorded cancellation_reason is nonpayment, underwriting or down_payment_dishonored, whether or
    not it has since been reinstated, adds recharge_company_cancel_charge; one whose recorded cancellation_reason is
    insured_request adds recharge_insured_cancel_charge; a backing term never cancelled, with no cancellation_reason
    recorded, adds no re-charge ending charge. The re-charge state charge follows the state group of the backing term''s
    own state (the resident_state of a Named Non-Owner term, the garaging_state of an Owner Auto Policy term). Florida
    or Virginia adds recharge_fr44_group_charge; Texas or Georgia adds recharge_south_group_charge; Arizona or Ohio adds
    no re-charge state charge. The re-charge out-of-state charge follows whether the filing state differs from the backing
    term''s own state, and whether the two lie in the same state group, the state groups being Florida and Virginia,
    Texas and Georgia, and Arizona and Ohio. A filing state in a different state group from the backing term''s own state
    adds recharge_out_of_region_charge; a different filing state in the same state group adds recharge_in_region_charge;
    a filing state equal to the backing term''s own state adds no re-charge out-of-state charge. The re-charge type charge
    follows the certificate type, which fixes the kind of backing term it rests on. An Owner-Operator certificate on
    an Owner Auto Policy backing term adds recharge_owner_operator_charge; an Operator certificate on a Named Non-Owner
    backing term adds recharge_operator_charge; an Owner certificate adds no re-charge type charge. The re-charge form
    charge follows the certificate form the backing term is written to back, its financial_responsibility_filing. A term
    written to back an FR-44 adds recharge_fr44_form_charge; a term written to back an SR-22 adds recharge_sr22_form_charge;
    a term recorded as backing none adds no re-charge form charge.'
  prerequisite:
  - problem: fr_ext_cancellation_sr26_runoff
    kind: value_input
    gate: recharge_basis
    form: state
    policy_source: A fee charged again is not fixed until the filing it is charged on, when that filing's Owner Auto
      Policy backing term has been cancelled, carries an SR-26 date and a certificate end date.
    condition: When the filing's own Owner Auto Policy backing term is cancelled, that filing's fr_filings row carries
      a non-empty sr26_date and certificate_end_date (status cancellation_filed) at the handling time of the fee charged
      again; for a term cancelled and not reinstated the cancellation SR-26 brings it about.
    resolved_by: transmit_cancellation_sr26_eaec830f
    effect: Once the cancellation SR-26 is transmitted the filing carries an SR-26 date and a certificate end date on
      or after the posting date, so the re-charge fee basis moves from the standard fee to half of it rounded up to the
      next whole dollar.
  cross_category:
  - category: auto
    as: branch
    reads:
    - cancellation_reason
    - garaging_state
    - status
    - financial_responsibility_filing
    note: The re-charge charges read an Owner Auto Policy backing term's cancellation reason, garaging state, record
      and the certificate it is written to back.
  - category: nonowner
    as: branch
    reads:
    - cancellation_reason
    - resident_state
    - status
    - financial_responsibility_filing
    note: The re-charge charges read a Named Non-Owner backing term's cancellation reason, resident state, record and
      the certificate it is written to back.
  compute:
  - std: K('recharge_base_fee')
  - recharge_end_gap: DAYS(F('certificate_end_date'), NOW) if (F('sr26_date') and F('certificate_end_date')) else None
  - recharge_basis: (int(std / 2) + (std / 2 > int(std / 2))) if (recharge_end_gap != None and recharge_end_gap <= 0)
      else (int(std * 3 / 2) if recharge_end_gap != None else std)
  - recharge_end_reason: (F('nonowner_policy_id') and CFIELD('nonowner', 'cancellation_reason', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'cancellation_reason', auto_policy_id=F('auto_policy_id')))
  - recharge_ending: K('recharge_company_cancel_charge') if (recharge_end_reason == 'nonpayment' or recharge_end_reason
      == 'underwriting' or recharge_end_reason == 'down_payment_dishonored') else (K('recharge_insured_cancel_charge')
      if recharge_end_reason == 'insured_request' else 0)
  - recharge_rating_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id')))
  - recharge_state: K('recharge_fr44_group_charge') if (recharge_rating_state == 'FL' or recharge_rating_state == 'VA')
      else (K('recharge_south_group_charge') if (recharge_rating_state == 'TX' or recharge_rating_state == 'GA') else
      0)
  - recharge_home_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id')))
  - recharge_out: K('recharge_in_region_charge') if (recharge_home_state and F('filing_state') != recharge_home_state
      and (((F('filing_state') == 'FL' or F('filing_state') == 'VA') and (recharge_home_state == 'FL' or recharge_home_state
      == 'VA')) or ((F('filing_state') == 'TX' or F('filing_state') == 'GA') and (recharge_home_state == 'TX' or recharge_home_state
      == 'GA')) or ((F('filing_state') == 'AZ' or F('filing_state') == 'OH') and (recharge_home_state == 'AZ' or recharge_home_state
      == 'OH')))) else (K('recharge_out_of_region_charge') if (recharge_home_state and F('filing_state') != recharge_home_state)
      else 0)
  - recharge_owner_term: CFIELD('auto', 'status', auto_policy_id=F('auto_policy_id'))
  - recharge_nonowner_term: CFIELD('nonowner', 'status', nonowner_policy_id=F('nonowner_policy_id'))
  - recharge_type: K('recharge_owner_operator_charge') if (P('certificate_type') == 'owner_operator' and recharge_owner_term)
      else (K('recharge_operator_charge') if (P('certificate_type') == 'operator' and recharge_nonowner_term) else 0)
  - recharge_term_filing: (F('nonowner_policy_id') and CFIELD('nonowner', 'financial_responsibility_filing', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'financial_responsibility_filing', auto_policy_id=F('auto_policy_id')))
  - recharge_form: K('recharge_fr44_form_charge') if recharge_term_filing == 'fr44' else (K('recharge_sr22_form_charge')
      if recharge_term_filing == 'sr22' else 0)
  - recharge_reversed: SUM('fr_filing_transactions', 'amount', event_type='fr_filing_fee_waived')
  - recharge_charged: SUM('fr_filing_transactions', 'amount', event_type='fr_filing_fee_assessed')
  - recharge_cap: MX(0, recharge_reversed - MX(0, recharge_charged - recharge_reversed))
  - recharge_floored: MX(K('minimum_recharge'), recharge_basis + recharge_ending + recharge_state + recharge_out + recharge_type
      + recharge_form)
  - result: RND(MN(recharge_cap, recharge_floored), 2)
  compute_basis:
    std: The standard fee charged again is recharge_base_fee, Cardinal Point's flat filing fee for a fee charged again,
      in US dollars to the cent.
    recharge_end_gap: The re-charge fee basis, which replaces the standard fee of this rule, follows how the filing's
      coverage with the state ended, read from its sr26_date and certificate_end_date.
    recharge_basis: When the filing carries an SR-26 date and its certificate end date is on or after the posting date,
      so that the state still treats the driver as certified, the re-charge fee basis is half the standard fee of this
      rule rounded up to the next whole dollar. When it carries an SR-26 date and its certificate end date is before
      the posting date, so that its certification with the state has lapsed, the re-charge fee basis is one and a half
      times the standard fee of this rule rounded down to the whole dollar. When it carries no SR-26 date, its backing
      coverage not having ended, the re-charge fee basis is the standard fee of this rule.
    recharge_rating_state: The re-charge state charge follows the state group of the backing term's own state (the resident_state
      of a Named Non-Owner term, the garaging_state of an Owner Auto Policy term).
    recharge_state: Florida or Virginia adds recharge_fr44_group_charge; Texas or Georgia adds recharge_south_group_charge;
      Arizona or Ohio adds no re-charge state charge.
    recharge_home_state: The re-charge out-of-state charge follows whether the filing state differs from the backing
      term's own state, and whether the two lie in the same state group, the state groups being Florida and Virginia,
      Texas and Georgia, and Arizona and Ohio.
    recharge_out: A filing state in a different state group from the backing term's own state adds recharge_out_of_region_charge;
      a different filing state in the same state group adds recharge_in_region_charge; a filing state equal to the backing
      term's own state adds no re-charge out-of-state charge.
    recharge_owner_term: The re-charge type charge follows the certificate type, which fixes the kind of backing term
      it rests on.
    recharge_nonowner_term: The re-charge type charge follows the certificate type, which fixes the kind of backing term
      it rests on.
    recharge_type: An Owner-Operator certificate on an Owner Auto Policy backing term adds recharge_owner_operator_charge;
      an Operator certificate on a Named Non-Owner backing term adds recharge_operator_charge; an Owner certificate adds
      no re-charge type charge.
    recharge_term_filing: The re-charge form charge follows the certificate form the backing term is written to back,
      its financial_responsibility_filing.
    recharge_form: A term written to back an FR-44 adds recharge_fr44_form_charge; a term written to back an SR-22 adds
      recharge_sr22_form_charge; a term recorded as backing none adds no re-charge form charge.
    recharge_end_reason: The re-charge ending charge follows how the backing term's coverage ended, read from its recorded
      cancellation_reason, which a term cancelled and since reinstated keeps.
    recharge_ending: A backing term whose recorded cancellation_reason is nonpayment, underwriting or down_payment_dishonored,
      whether or not it has since been reinstated, adds recharge_company_cancel_charge; one whose recorded cancellation_reason
      is insured_request adds recharge_insured_cancel_charge; a backing term never cancelled, with no cancellation_reason
      recorded, adds no re-charge ending charge.
    recharge_reversed: The fees reversed on the filing are the amounts of its fee reversals, and the fee standing on
      it is its fee charges less its fee reversals, never below zero.
    recharge_charged: The fees reversed on the filing are the amounts of its fee reversals, and the fee standing on it
      is its fee charges less its fee reversals, never below zero.
    recharge_cap: 'The adjustments below are applied to the standard fee of this rule in this order: an adjustment that
      replaces the standard fee is applied first, and every adjustment that adds an amount is then added to that result;
      that total is never below minimum_recharge, the fee charged again is then never more than the fees reversed on
      the filing less any fee still standing on it, and it is rounded to the cent, half up, once at the end. Each dimension
      enters the schedule once.'
    recharge_floored: 'The adjustments below are applied to the standard fee of this rule in this order: an adjustment
      that replaces the standard fee is applied first, and every adjustment that adds an amount is then added to that
      result; that total is never below minimum_recharge, the fee charged again is then never more than the fees reversed
      on the filing less any fee still standing on it, and it is rounded to the cent, half up, once at the end. Each
      dimension enters the schedule once.'
    result: 'The adjustments below are applied to the standard fee of this rule in this order: an adjustment that replaces
      the standard fee is applied first, and every adjustment that adds an amount is then added to that result; that
      total is never below minimum_recharge, the fee charged again is then never more than the fees reversed on the filing
      less any fee still standing on it, and it is rounded to the cent, half up, once at the end. Each dimension enters
      the schedule once.'
  factors:
  - id: recharge_fee_method
    effect: method
    decides: recharge_basis
    bindings:
    - recharge_end_gap
    - recharge_basis
    ladder:
    - when: it carries an SR-26 date and its certificate end date is on or after the posting date
      method: half the standard fee rounded up to the next whole dollar
    - when: it carries an SR-26 date and its certificate end date is before the posting date
      method: one and a half times the standard fee rounded down to the whole dollar
    - when: otherwise (no SR-26 date)
      method: the standard fee
    baseline:
      recharge_basis: std
    evidence:
    - date
    cross_difficulty: null
  - id: recharge_ending_charge
    effect: parameter
    decides: recharge_ending
    bindings:
    - recharge_end_reason
    - recharge_ending
    ladder:
    - when: the recorded cancellation_reason is nonpayment, underwriting or down_payment_dishonored, whether or not the
        term has since been reinstated
      value: K('recharge_company_cancel_charge')
    - when: the recorded cancellation_reason is insured_request
      value: K('recharge_insured_cancel_charge')
    - when: otherwise (never cancelled, no cancellation_reason recorded)
      value: '0'
    baseline:
      recharge_ending: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: recharge_state_charge
    effect: parameter
    decides: recharge_state
    bindings:
    - recharge_rating_state
    - recharge_state
    ladder:
    - when: the backing term's own state is Florida or Virginia
      value: K('recharge_fr44_group_charge')
    - when: it is Texas or Georgia
      value: K('recharge_south_group_charge')
    - when: otherwise (Arizona or Ohio)
      value: '0'
    baseline:
      recharge_state: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: recharge_out_of_state_charge
    effect: parameter
    decides: recharge_out
    bindings:
    - recharge_home_state
    - recharge_out
    ladder:
    - when: the filing state lies in a different state group from the backing term's own state
      value: K('recharge_out_of_region_charge')
    - when: the filing state differs from it but lies in the same state group
      value: K('recharge_in_region_charge')
    - when: otherwise (the filing state equals it)
      value: '0'
    baseline:
      recharge_out: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: recharge_type_charge
    effect: parameter
    decides: recharge_type
    bindings:
    - recharge_owner_term
    - recharge_nonowner_term
    - recharge_type
    ladder:
    - when: an Owner-Operator certificate on an Owner Auto Policy backing term
      value: K('recharge_owner_operator_charge')
    - when: an Operator certificate on a Named Non-Owner backing term
      value: K('recharge_operator_charge')
    - when: otherwise (an Owner certificate)
      value: '0'
    baseline:
      recharge_type: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: auto
  - id: recharge_form_charge
    effect: parameter
    decides: recharge_form
    bindings:
    - recharge_term_filing
    - recharge_form
    ladder:
    - when: the backing term is written to back an FR-44
      value: K('recharge_fr44_form_charge')
    - when: it is written to back an SR-22
      value: K('recharge_sr22_form_charge')
    - when: otherwise (recorded as backing none)
      value: '0'
    baseline:
      recharge_form: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  baseline:
    rule: The standard fee charged again is recharge_base_fee, Cardinal Point's flat filing fee for a fee charged again,
      in US dollars to the cent.
    params:
    - recharge_base_fee
  inputs:
    history:
    - table: fr_filing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: fr_filing_fee_waived
    - table: fr_filing_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: fr_filing_fee_assessed
    cross_category:
    - auto
    - nonowner
- id: fr_ext_moved_refiling_fee
  base_policy_refs:
  - fr_filing_fee_rule
  - fr_agg_multi_holding
  - fr_agg_backing_term
  - fr_filing_eligibility
  - fr_sr26_notice
  overwrite:
  - base_policy: fr_filing_fee_rule
    superseded_clause: The filing fee is the certificate's filing_fee, charged once when a filing is requested for a
      reason in fee_charged_filing_reasons and billed on the backing term's billing plan.
    replaced_by: For a state_change refiling after a move, and only for such a refiling, the filing fee is the moved
      certificate fee worked out below, charged once when the refiling is requested and billed on the new term's billing
      plan; a reinstatement_refiling and a fee charged again after a full company_error reversal are priced under their
      own rules, and every other filing requested for a reason in fee_charged_filing_reasons is charged the certificate's
      filing_fee, once, billed on the backing term's billing plan.
  - base_policy: fr_agg_multi_holding
    superseded_clause: a new request for the same driver and state while one is open is refused, except a reinstatement_refiling,
      which is allowed while the earlier filing is cancellation_filed and replaces it (prior_fr_filing_id).
    replaced_by: a new request for the same driver and state while one is open is refused, except a reinstatement_refiling,
      or a state_change refiling after a move, either of which is allowed while the earlier filing is cancellation_filed
      and replaces it (prior_fr_filing_id).
  trigger: on_request
  subject:
  - fr_filing_requested
  - fr_filing_fee_assessed
  computes: filing_fee
  target_tool: order_moved_certificate_231455f7
  params:
    transfer_base_fee: 25.0
    transfer_gap_days: 30
    transfer_nonpayment_charge: 4.0
    transfer_insured_cancel_charge: 2.0
    transfer_fr44_group_charge: 6.0
    transfer_south_group_charge: 3.0
    transfer_out_of_region_charge: 8.0
    transfer_in_region_charge: 4.0
    transfer_owner_operator_charge: 4.0
    transfer_operator_charge: 2.0
    transfer_fr44_form_charge: 10.0
    transfer_sr22_form_charge: 2.0
  rule: 'This rule prices the moved certificate: the refiling a named insured orders for their own certificate after
    moving, when the term backing it (an Owner Auto Policy term, or a Named Non-Owner term) was cancelled, for any cancellation_reason,
    and not reinstated, and the customer''s new term of the same kind is in force in another state; a replaced Operator
    certificate is covered only once it already carries an SR-26 date. The new backing term is the term of that kind
    carrying the customer''s most recent new_business premium written, and this rule covers a customer with exactly one
    such term written as new business on that date. The moved certificate is requested with filing_reason state_change
    on that new term, on the same certificate form, type and filing state, for the same driver data, state case number
    and required_through_date as the certificate it replaces, and it names that certificate as the filing it replaces.
    For a state_change refiling after a move, and only for such a refiling, the filing fee is the moved certificate fee
    worked out below, charged once when the refiling is requested and billed on the new term''s billing plan; a reinstatement_refiling
    and a fee charged again after a full company_error reversal are priced under their own rules, and every other filing
    requested for a reason in fee_charged_filing_reasons is charged the certificate''s filing_fee, once, billed on the
    backing term''s billing plan. A driver may have only one open filing with one state; a new request for the same driver
    and state while one is open is refused, except a reinstatement_refiling, or a state_change refiling after a move,
    either of which is allowed while the earlier filing is cancellation_filed and replaces it (prior_fr_filing_id). The
    moved certificate fee for a certificate on an Owner Auto Policy term is not fixed until that certificate carries
    an SR-26 date and a certificate end date. The moved certificate fee is fixed only after the replaced certificate,
    when it rests on an Owner Auto Policy term, was requested for a reason that is charged a filing fee and had no fee
    reversed because it was withdrawn before transmission or was a duplicate request, shows a filing fee charge standing
    for its own request. The standard moved certificate fee is transfer_base_fee, Cardinal Point''s flat filing fee for
    a moved certificate, in US dollars to the cent. The adjustments below make up Cardinal Point''s own filing-fee schedule
    for a moved certificate. The adjustments below are applied to the standard fee of this rule in this order: an adjustment
    that replaces the standard fee is applied first, and every adjustment that adds an amount is then added to that result;
    the total is never below zero and is rounded to the cent, half up, once at the end. Each dimension enters the schedule
    once. The transfer fee basis, which replaces the standard fee of this rule, follows how the replaced certificate''s
    coverage with the state ended, read from its sr26_date and certificate_end_date. When the replaced certificate carries
    an SR-26 date and its certificate end date is on or after the refiling date, so that the state still treats the driver
    as certified, the transfer fee basis is half the standard fee of this rule rounded up to the next whole dollar. When
    its certificate end date is before the refiling date by more than transfer_gap_days days, so that its certification
    with the state lapsed well before, the transfer fee basis is one and a half times the standard fee of this rule rounded
    down to the whole dollar. When its certificate end date is before the refiling date by transfer_gap_days days or
    fewer, the transfer fee basis is the standard fee of this rule. The transfer ending charge follows how the replaced
    certificate''s backing term ended, read from its cancellation_reason. A backing term cancelled for nonpayment adds
    transfer_nonpayment_charge; a backing term cancelled at the insured_request adds transfer_insured_cancel_charge;
    a backing term cancelled for underwriting, down_payment_dishonored or converted_to_owner_policy adds no transfer
    ending charge. The transfer state charge follows the state group of the new term''s own state (the resident_state
    of a new Named Non-Owner term, the garaging_state of a new Owner Auto Policy term). Florida or Virginia adds transfer_fr44_group_charge;
    Texas or Georgia adds transfer_south_group_charge; Arizona or Ohio adds no transfer state charge. The transfer out-of-state
    charge follows whether the filing state differs from the new term''s own state, and whether the two lie in the same
    state group, the state groups being Florida and Virginia, Texas and Georgia, and Arizona and Ohio. A filing state
    in a different state group from the new term''s own state adds transfer_out_of_region_charge; a different filing
    state in the same state group adds transfer_in_region_charge; a filing state equal to the new term''s own state adds
    no transfer out-of-state charge. The transfer type charge follows the certificate type, which fixes the kind of new
    term it rests on. An Owner-Operator certificate on an Owner Auto Policy new term adds transfer_owner_operator_charge;
    an Operator certificate on a Named Non-Owner new term adds transfer_operator_charge; an Owner certificate adds no
    transfer type charge. The transfer form charge follows the certificate form the new term is written to back, its
    financial_responsibility_filing. A term written to back an FR-44 adds transfer_fr44_form_charge; a term written to
    back an SR-22 adds transfer_sr22_form_charge; a term recorded as backing none adds no transfer form charge.'
  prerequisite:
  - problem: fr_ext_cancellation_sr26_runoff
    kind: value_input
    gate: transfer_basis
    form: state
    policy_source: The moved certificate fee for a certificate on an Owner Auto Policy term is not fixed until that certificate
      carries an SR-26 date and a certificate end date.
    condition: For a replaced certificate on an Owner Auto Policy term cancelled and not reinstated, its fr_filings row
      carries a non-empty sr26_date and certificate_end_date (status cancellation_filed) at the handling time of the
      moved certificate.
    resolved_by: transmit_cancellation_sr26_eaec830f
    effect: Once the cancellation SR-26 is transmitted the replaced certificate carries an SR-26 date and a certificate
      end date on or after the refiling date, so the transfer fee basis is half the standard fee rounded up to the next
      whole dollar.
  - problem: fr_ext_unbilled_fee
    kind: state_gate
    gate: fr_filings.fees_charged_total
    form: state
    policy_source: The moved certificate fee is fixed only after the replaced certificate, when it rests on an Owner
      Auto Policy term, was requested for a reason that is charged a filing fee and had no fee reversed because it was
      withdrawn before transmission or was a duplicate request, shows a filing fee charge standing for its own request.
    condition: For such a replaced certificate, the fees charged on it less the fees reversed on it are above zero at
      the handling time of the moved certificate.
    resolved_by: post_unbilled_filing_fee_f14427ed
    effect: Once the fee is charged again (never below the minimum re-charge) the replaced certificate's fees_charged_total
      is above zero, so the moved certificate may be ordered and priced.
  cross_category:
  - category: auto
    as: branch
    reads:
    - cancellation_reason
    - garaging_state
    - status
    - financial_responsibility_filing
    - auto_premium_transactions.auto_policy_id
    - auto_premium_transactions.event_type
    - auto_premium_transactions.transaction_reason
    - auto_premium_transactions.transaction_date
    note: The replaced certificate's owner term gives the ending reason; the new owner term, found from the latest new-business
      premium, gives the transfer state, out-of-state, type and form charges.
  - category: nonowner
    as: branch
    reads:
    - cancellation_reason
    - resident_state
    - status
    - financial_responsibility_filing
    - nonowner_premium_transactions.nonowner_policy_id
    - nonowner_premium_transactions.event_type
    - nonowner_premium_transactions.transaction_reason
    - nonowner_premium_transactions.transaction_date
    note: A replaced certificate's non-owner term gives the ending reason; a new Named Non-Owner term, found from its
      latest new-business premium, gives the transfer charges.
  compute:
  - std: K('transfer_base_fee')
  - new_owner_term: XLATEST('auto', 'auto_premium_transactions', 'auto_policy_id', date_field='transaction_date', event_type='auto_premium_written',
      transaction_reason='new_business')
  - new_nonowner_term: XLATEST('nonowner', 'nonowner_premium_transactions', 'nonowner_policy_id', date_field='transaction_date',
      event_type='nonowner_premium_written', transaction_reason='new_business')
  - transfer_end_gap: DAYS(F('certificate_end_date'), NOW) if (F('sr26_date') and F('certificate_end_date')) else None
  - transfer_basis: (int(std / 2) + (std / 2 > int(std / 2))) if (transfer_end_gap != None and transfer_end_gap <= 0)
      else (int(std * 3 / 2) if (transfer_end_gap != None and transfer_end_gap > K('transfer_gap_days')) else std)
  - transfer_end_reason: (F('nonowner_policy_id') and CFIELD('nonowner', 'cancellation_reason', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'cancellation_reason', auto_policy_id=F('auto_policy_id')))
  - transfer_ending: K('transfer_nonpayment_charge') if transfer_end_reason == 'nonpayment' else (K('transfer_insured_cancel_charge')
      if transfer_end_reason == 'insured_request' else 0)
  - transfer_rating_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=new_nonowner_term))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=new_owner_term))
  - transfer_state: K('transfer_fr44_group_charge') if (transfer_rating_state == 'FL' or transfer_rating_state == 'VA')
      else (K('transfer_south_group_charge') if (transfer_rating_state == 'TX' or transfer_rating_state == 'GA') else
      0)
  - transfer_home_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=new_nonowner_term))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=new_owner_term))
  - transfer_out: K('transfer_in_region_charge') if (transfer_home_state and F('filing_state') != transfer_home_state
      and (((F('filing_state') == 'FL' or F('filing_state') == 'VA') and (transfer_home_state == 'FL' or transfer_home_state
      == 'VA')) or ((F('filing_state') == 'TX' or F('filing_state') == 'GA') and (transfer_home_state == 'TX' or transfer_home_state
      == 'GA')) or ((F('filing_state') == 'AZ' or F('filing_state') == 'OH') and (transfer_home_state == 'AZ' or transfer_home_state
      == 'OH')))) else (K('transfer_out_of_region_charge') if (transfer_home_state and F('filing_state') != transfer_home_state)
      else 0)
  - transfer_owner_term: F('auto_policy_id') and CFIELD('auto', 'status', auto_policy_id=new_owner_term)
  - transfer_nonowner_term: F('nonowner_policy_id') and CFIELD('nonowner', 'status', nonowner_policy_id=new_nonowner_term)
  - transfer_type: K('transfer_owner_operator_charge') if (P('certificate_type') == 'owner_operator' and transfer_owner_term)
      else (K('transfer_operator_charge') if (P('certificate_type') == 'operator' and transfer_nonowner_term) else 0)
  - transfer_term_filing: (F('nonowner_policy_id') and CFIELD('nonowner', 'financial_responsibility_filing', nonowner_policy_id=new_nonowner_term))
      or (F('auto_policy_id') and CFIELD('auto', 'financial_responsibility_filing', auto_policy_id=new_owner_term))
  - transfer_form: K('transfer_fr44_form_charge') if transfer_term_filing == 'fr44' else (K('transfer_sr22_form_charge')
      if transfer_term_filing == 'sr22' else 0)
  - result: RND(MX(0, transfer_basis + transfer_ending + transfer_state + transfer_out + transfer_type + transfer_form),
      2)
  compute_basis:
    std: The standard moved certificate fee is transfer_base_fee, Cardinal Point's flat filing fee for a moved certificate,
      in US dollars to the cent.
    transfer_end_gap: The transfer fee basis, which replaces the standard fee of this rule, follows how the replaced
      certificate's coverage with the state ended, read from its sr26_date and certificate_end_date.
    transfer_basis: When the replaced certificate carries an SR-26 date and its certificate end date is on or after the
      refiling date, so that the state still treats the driver as certified, the transfer fee basis is half the standard
      fee of this rule rounded up to the next whole dollar. When its certificate end date is before the refiling date
      by more than transfer_gap_days days, so that its certification with the state lapsed well before, the transfer
      fee basis is one and a half times the standard fee of this rule rounded down to the whole dollar. When its certificate
      end date is before the refiling date by transfer_gap_days days or fewer, the transfer fee basis is the standard
      fee of this rule.
    transfer_rating_state: The transfer state charge follows the state group of the new term's own state (the resident_state
      of a new Named Non-Owner term, the garaging_state of a new Owner Auto Policy term).
    transfer_state: Florida or Virginia adds transfer_fr44_group_charge; Texas or Georgia adds transfer_south_group_charge;
      Arizona or Ohio adds no transfer state charge.
    transfer_home_state: The transfer out-of-state charge follows whether the filing state differs from the new term's
      own state, and whether the two lie in the same state group, the state groups being Florida and Virginia, Texas
      and Georgia, and Arizona and Ohio.
    transfer_out: A filing state in a different state group from the new term's own state adds transfer_out_of_region_charge;
      a different filing state in the same state group adds transfer_in_region_charge; a filing state equal to the new
      term's own state adds no transfer out-of-state charge.
    transfer_owner_term: The transfer type charge follows the certificate type, which fixes the kind of new term it rests
      on.
    transfer_nonowner_term: The transfer type charge follows the certificate type, which fixes the kind of new term it
      rests on.
    transfer_type: An Owner-Operator certificate on an Owner Auto Policy new term adds transfer_owner_operator_charge;
      an Operator certificate on a Named Non-Owner new term adds transfer_operator_charge; an Owner certificate adds
      no transfer type charge.
    transfer_term_filing: The transfer form charge follows the certificate form the new term is written to back, its
      financial_responsibility_filing.
    transfer_form: A term written to back an FR-44 adds transfer_fr44_form_charge; a term written to back an SR-22 adds
      transfer_sr22_form_charge; a term recorded as backing none adds no transfer form charge.
    transfer_end_reason: The transfer ending charge follows how the replaced certificate's backing term ended, read from
      its cancellation_reason.
    transfer_ending: A backing term cancelled for nonpayment adds transfer_nonpayment_charge; a backing term cancelled
      at the insured_request adds transfer_insured_cancel_charge; a backing term cancelled for underwriting, down_payment_dishonored
      or converted_to_owner_policy adds no transfer ending charge.
    result: 'The adjustments below are applied to the standard fee of this rule in this order: an adjustment that replaces
      the standard fee is applied first, and every adjustment that adds an amount is then added to that result; the total
      is never below zero and is rounded to the cent, half up, once at the end. Each dimension enters the schedule once.'
    new_owner_term: The new backing term is the term of that kind carrying the customer's most recent new_business premium
      written, and this rule covers a customer with exactly one such term written as new business on that date.
    new_nonowner_term: The new backing term is the term of that kind carrying the customer's most recent new_business
      premium written, and this rule covers a customer with exactly one such term written as new business on that date.
  factors:
  - id: transfer_fee_method
    effect: method
    decides: transfer_basis
    bindings:
    - transfer_end_gap
    - transfer_basis
    ladder:
    - when: its certificate end date is on or after the refiling date
      method: half the standard fee rounded up to the next whole dollar
    - when: its certificate end date is before the refiling date by more than transfer_gap_days days
      method: one and a half times the standard fee rounded down to the whole dollar
    - when: otherwise (before the refiling date by transfer_gap_days days or fewer)
      method: the standard fee
    baseline:
      transfer_basis: std
    evidence:
    - date
    cross_difficulty: null
  - id: transfer_ending_charge
    effect: parameter
    decides: transfer_ending
    bindings:
    - transfer_end_reason
    - transfer_ending
    ladder:
    - when: the backing term was cancelled for nonpayment
      value: K('transfer_nonpayment_charge')
    - when: it was cancelled at the insured_request
      value: K('transfer_insured_cancel_charge')
    - when: otherwise (cancelled for underwriting, down_payment_dishonored or converted_to_owner_policy)
      value: '0'
    baseline:
      transfer_ending: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: transfer_state_charge
    effect: parameter
    decides: transfer_state
    bindings:
    - transfer_rating_state
    - transfer_state
    ladder:
    - when: the new term's own state is Florida or Virginia
      value: K('transfer_fr44_group_charge')
    - when: it is Texas or Georgia
      value: K('transfer_south_group_charge')
    - when: otherwise (Arizona or Ohio)
      value: '0'
    baseline:
      transfer_state: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: transfer_out_of_state_charge
    effect: parameter
    decides: transfer_out
    bindings:
    - transfer_home_state
    - transfer_out
    ladder:
    - when: the filing state lies in a different state group from the new term's own state
      value: K('transfer_out_of_region_charge')
    - when: the filing state differs from it but lies in the same state group
      value: K('transfer_in_region_charge')
    - when: otherwise (the filing state equals it)
      value: '0'
    baseline:
      transfer_out: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  - id: transfer_type_charge
    effect: parameter
    decides: transfer_type
    bindings:
    - transfer_owner_term
    - transfer_nonowner_term
    - transfer_type
    ladder:
    - when: an Owner-Operator certificate on an Owner Auto Policy new term
      value: K('transfer_owner_operator_charge')
    - when: an Operator certificate on a Named Non-Owner new term
      value: K('transfer_operator_charge')
    - when: otherwise (an Owner certificate)
      value: '0'
    baseline:
      transfer_type: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: auto
  - id: transfer_form_charge
    effect: parameter
    decides: transfer_form
    bindings:
    - transfer_term_filing
    - transfer_form
    ladder:
    - when: the new term is written to back an FR-44
      value: K('transfer_fr44_form_charge')
    - when: it is written to back an SR-22
      value: K('transfer_sr22_form_charge')
    - when: otherwise (recorded as backing none)
      value: '0'
    baseline:
      transfer_form: '0'
    evidence:
    - cross_category
    cross_difficulty: auto
  baseline:
    rule: The standard moved certificate fee is transfer_base_fee, Cardinal Point's flat filing fee for a moved certificate,
      in US dollars to the cent.
    params:
    - transfer_base_fee
  inputs:
    history:
    - category: auto
      table: auto_premium_transactions
      aggregate: latest
      field: auto_policy_id
      filters:
        event_type: auto_premium_written
        transaction_reason: new_business
    cross_category:
    - auto
    - nonowner
