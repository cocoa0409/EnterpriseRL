      FL: Cardinal Point 100/300/50 Liability
      VA: Cardinal Point 100/200/50 Liability
    filing_fee: 35.0
    fee_charged_filing_reasons:
    - new_requirement
    - reinstatement_refiling
    - state_change
    - carrier_transfer
    fee_free_filing_reasons:
    - corrected_refiling
    fee_waiver_reasons:
    - withdrawn_before_transmission
    - company_error
    - duplicate_request
    fee_returned_on_cancellation: false
    renewal_continuation_requires_new_filing: false
    transmit_within_business_days: 1
    business_day_calendar: monday_to_friday_excluding_new_years_memorial_independence_labor_thanksgiving_christmas
    transmission_method: electronic_state_interface
    dmv_acknowledgment_business_days: 3
    rejection_correction_days: 10
    correctable_rejection_reasons:
    - license_number_mismatch
    - name_mismatch
    - date_of_birth_mismatch
    limits_rejection_cure: backing_term_moved_to_minimum_backing_package_then_retransmitted
    non_correctable_rejection_reasons:
    - no_requirement_on_record
    name_match_basis:
    - filed_driver_name
    - filed_driver_license_number
    - filed_driver_date_of_birth
    filing_effective_date_rule: later_of_backing_term_effective_date_and_request_date
    sr26_trigger_events:
    - backing_term_cancelled
    - backing_term_expired_without_renewal
    - requirement_completed_release
    - filer_excluded_or_removed
    sr26_transmit_within_days: 3
    sr26_never_before_trigger_date: true
    certificate_runoff_days: 10
    release_requires_required_through_date_passed: true
    release_requested_by: named_insured_or_filed_driver
    reinstatement_after_sr26_requires_new_filing: true
    reinstatement_before_sr26_suppresses_sr26: true
    filer_rated_required: true
    max_open_filings_per_driver_per_state: 1
    out_of_state_filing_allowed: true
    out_of_state_limits_basis: filing_state_requirement
    required_through_source: state_order_recorded_as_required_through_date
    certificate_copy_fee: 0.0
    certificate_copy_channels:
    - email
    - mail
    - online_portal
    certificate_copy_mail_business_days: 2
    copy_available_statuses:
    - filed
    copy_recipients:
    - named_insured
    - filed_driver
    - court_or_attorney_designated_by_insured
    carrier_transfer_rule: new_filing_reason_carrier_transfer_prior_carrier_sends_its_own_sr26
    fee_billing_rule: on_the_backing_terms_billing_plan_with_the_down_payment_or_next_invoice
    filing_reason_codes:
    - new_requirement
    - reinstatement_refiling
    - state_change
    - carrier_transfer
    - corrected_refiling
    sr26_reason_codes:
    - policy_cancelled
    - policy_expired_not_renewed
    - requirement_completed
    - filer_excluded_or_removed
events:
- type: fr_filing_requested
  target: fr_filings
  mutation: create
  meaning: An SR-22 or FR-44 certificate filing is requested for a driver on a backing policy term.
  grain: one row per certificate filing
  fields:
    customer_id: customer
    auto_policy_id: owner backing term
    nonowner_policy_id: non-owner backing term
    variant_name: certificate
    filing_state: state requiring it
    filed_driver_name: driver certified
    filed_driver_license_number: license number
    filed_driver_date_of_birth: DOB
    dmv_case_number: state case number
    filing_reason: reason code
    requested_date: request date
    opened_date: same as request date
    required_through_date: end of requirement from the state order
    prior_fr_filing_id: filing replaced
  triggers:
  - event: fr:fr_filing_fee_assessed
    when:
      filing_reason:
      - new_requirement
      - reinstatement_refiling
      - state_change
      - carrier_transfer
    map:
      posted_date: requested_date
      fee_reason: filing_reason
- type: fr_filing_accepted
  target: fr_filings
  mutation:
    transition:
    - from: requested
      to: filed
    - from: rejected
      to: filed
  meaning: The certificate is transmitted and accepted by the state.
  grain: one row per certificate filing
  fields:
    status: new lifecycle state of the filing
    filed_date: acceptance date
    filing_effective_date: date certified from
  triggers: []
- type: fr_filing_rejected
  target: fr_filings
  mutation:
    transition:
      from: requested
      to: rejected
  meaning: The state rejects the transmitted certificate.
  grain: one row per certificate filing
  fields:
    status: new lifecycle state of the filing
    rejection_reason: state reason
    rejected_date: rejection date
  triggers: []
- type: fr_filing_withdrawn
  target: fr_filings
  mutation:
    transition:
    - from: requested
      to: withdrawn
    - from: rejected
      to: withdrawn
  meaning: A filing never accepted by the state is withdrawn.
  grain: one row per certificate filing
  fields:
    status: new lifecycle state of the filing
    closed_date: withdrawal date
  triggers: []
- type: fr_sr26_transmitted
  target: fr_filings
  mutation:
    transition:
      from: filed
      to: cancellation_filed
  meaning: An SR-26 notice that the certified coverage has ended is transmitted to the state.
  grain: one row per certificate filing
  fields:
    status: new lifecycle state of the filing
    sr26_date: transmission date
    sr26_reason: reason
    certificate_end_date: SR-26 date plus run-off days
  triggers: []
- type: fr_certificate_ended
  target: fr_filings
  mutation:
    transition:
      from: cancellation_filed
      to: terminated
  meaning: The certificate stops certifying coverage on its certificate end date.
  grain: one row per certificate filing
  fields:
    status: new lifecycle state of the filing
    closed_date: the certificate end date
  triggers: []
- type: fr_filing_corrected
  target: fr_filings
  mutation: update
  meaning: Filer data on a rejected filing is corrected before retransmission.
  grain: one row per certificate filing
  triggers: []
  fields:
    filed_driver_name: corrected name
    filed_driver_license_number: corrected license number
    filed_driver_date_of_birth: corrected DOB
    dmv_case_number: corrected case number
- type: fr_filing_fee_assessed
  target: fr_filing_transactions
  meaning: The filing fee is charged for a filing request.
  grain: one row per filing request charged
  distinguish_by:
  - fee_reason
  fields:
    posted_date: booking date
    amount: fee
    fee_reason: filing reason charged
  account: filing_fees
  direction: in
  triggers: []
- type: fr_filing_fee_waived
  target: fr_filing_transactions
  meaning: A charged filing fee is reversed.
  grain: one row per reversed fee
  distinguish_by:
  - reversed_fee_txn_id
  fields:
    posted_date: booking date
    amount: fee reversed
    reversed_fee_txn_id: fee transaction
    waiver_reason: reason
  account: filing_fees
  direction: out
  triggers: []
- type: fr_certificate_copy_issued
  target: fr_filing_documents
  meaning: A copy of the filed certificate is sent to the insured or a designated recipient.
  grain: one row per copy sent
  distinguish_by:
  - document_date
  - delivery_channel
  - copy_recipient
  fields:
    document_date: date sent
    delivery_channel: channel
    copy_recipient: recipient
  triggers: []
- type: fr_release_requested
  target: fr_filing_documents
  meaning: The named insured or filed driver asks for the certificate to be released at the end of the
    requirement.
  grain: one row per release request
  distinguish_by:
  - document_date
  fields:
    document_date: request date
    delivery_channel: channel
    requested_by: who asked
  triggers: []
measures:
- id: fr_msr_open_filings_for_driver
  window: portfolio state as of today
  measure: count of fr_filings rows of the customer with the same filed_driver_license_number and filing_state
    whose status is requested, rejected, filed or cancellation_filed
policies:
- id: fr_agg_multi_holding
  subject:
  - fr_filing_requested
  rule: 'A customer may hold any number of filings, so max_per_customer is unlimited: separate filings
    exist for separate drivers, for separate filing states, and for successive filings over time. A driver
    may have only one open filing with one state. Open means requested, rejected, filed or cancellation_filed,
    counted by fr_msr_open_filings_for_driver; a new request for the same driver and state while one is
    open is refused, except a reinstatement_refiling, which is allowed while the earlier filing is cancellation_filed
    and replaces it (prior_fr_filing_id).'
  eligibility:
  - id: one_open_per_driver_state
    applies_to:
    - fr_filing_requested
    kind: authorization
    condition: A driver may have only one open filing with one state.
    evidence_fields:
    - fr_filings.filed_driver_license_number
    - fr_filings.filing_state
    - fr_filings.status
    - fr_filings.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.customer_id
      action_bindings:
        fr_filings.customer_id: customer_id
  params:
    max_per_customer: null
    max_open_filings_per_driver_per_state: =max_open_filings_per_driver_per_state
  measures:
  - fr_msr_open_filings_for_driver
- id: fr_agg_backing_term
  subject:
  - fr_sr26_transmitted
  - fr_filing_requested
  rule: Several filings may rest on one backing term, for example a driver certified with two states or
    two drivers of one household; they are evaluated together against that term. Every filing backed by
    a term receives its SR-26 when that term's coverage ends without being continued. A limits change
    on the backing term is checked against every filing it backs, and the strictest filing state's minimum
    backing package governs.
  eligibility:
  - id: term_coverage_ended
    applies_to:
    - fr_sr26_transmitted
    kind: authorization
    condition: Every filing backed by a term receives its SR-26 when that term's coverage ends without
      being continued.
    evidence_fields:
    - auto_policies.status
    - nonowner_policies.status
    - fr_filings.auto_policy_id
    - fr_filings.nonowner_policy_id
    - fr_filings.fr_filing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.fr_filing_id
      action_bindings:
        fr_filings.fr_filing_id: fr_filing_id
- id: fr_filing_eligibility
  subject:
  - fr_filing_requested
  rule: 'The certificate is chosen by form and type: SR-22 for a non-DUI requirement and FR-44 for a DUI-related
    license reinstatement in Florida or Virginia; owner when the backing is an Owner Auto Policy on which
    the filer is a rated driver, operator when the backing is the filer''s Named Non-Owner Policy, and
    owner-operator when the filer is the named insured of the Owner Auto Policy. The filing state must
    be one of the certificate''s eligible_states. A filing is requested only on a backing term whose status
    is bound or in_force. The backing term''s package must be at or above the certificate''s minimum backing
    package for the filing state. On an owner backing term the filed driver must be a rated driver and
    never a named excluded driver. When the filing state differs from the garaging state, the filing state''s
    required limits govern. The filed driver''s name, license number and date of birth are taken exactly
    as on the state''s driver record, and the state case number exactly as on the state letter. required_through_date
    is copied from the state order; the company never computes the requirement period.'
  eligibility:
  - id: eligible_state
    applies_to:
    - fr_filing_requested
    kind: authorization
    condition: The filing state must be one of the certificate's eligible_states.
    evidence_fields:
    - fr_filings.filing_state
    - fr_filings.variant_name
    - fr_filings.fr_filing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.fr_filing_id
      action_bindings:
        fr_filings.fr_filing_id: fr_filing_id
  - id: backing_term_open
    applies_to:
    - fr_filing_requested
    kind: authorization
    condition: A filing is requested only on a backing term whose status is bound or in_force.
    evidence_fields:
    - auto_policies.status
    - nonowner_policies.status
    - fr_filings.auto_policy_id
    - fr_filings.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.auto_policy_id
        - fr_filings.nonowner_policy_id
      action_bindings:
        fr_filings.auto_policy_id: auto_policy_id
        fr_filings.nonowner_policy_id: nonowner_policy_id
  - id: backing_limits
    applies_to:
    - fr_filing_requested
    kind: authorization
    condition: The backing term's package must be at or above the certificate's minimum backing package
      for the filing state.
    evidence_fields:
    - auto_policies.variant_name
    - nonowner_policies.variant_name
    - fr_filings.auto_policy_id
    - fr_filings.nonowner_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.auto_policy_id
        - fr_filings.nonowner_policy_id
      action_bindings:
        fr_filings.auto_policy_id: auto_policy_id
        fr_filings.nonowner_policy_id: nonowner_policy_id
  - id: filer_rated
    applies_to:
    - fr_filing_requested
    kind: authorization
    condition: On an owner backing term the filed driver must be a rated driver and never a named excluded
      driver.
    evidence_fields:
    - auto_policy_changes.driver_name
    - auto_policy_changes.event_type
    - auto_policy_changes.change_effective_date
    - auto_policy_changes.auto_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_policy_changes.auto_policy_id
      action_bindings:
        auto_policy_changes.auto_policy_id: auto_policy_id
  params:
    per_tier:
      SR-22 Owner Certificate:
        eligible_states: =eligible_states
        backing_policy_category: =backing_policy_category
        filer_must_be_named_insured: =filer_must_be_named_insured
        minimum_backing_package: =minimum_backing_package_by_state
        required_limits: =required_limits_source
      SR-22 Operator Certificate:
        eligible_states: =eligible_states
        backing_policy_category: =backing_policy_category
        filer_must_be_named_insured: =filer_must_be_named_insured
        minimum_backing_package: =minimum_backing_package_by_state
        required_limits: =required_limits_source
      SR-22 Owner-Operator Certificate:
        eligible_states: =eligible_states
        backing_policy_category: =backing_policy_category
        filer_must_be_named_insured: =filer_must_be_named_insured
        minimum_backing_package: =minimum_backing_package_by_state
        required_limits: =required_limits_source
      FR-44 Owner Certificate:
        eligible_states: =eligible_states
        backing_policy_category: =backing_policy_category
        filer_must_be_named_insured: =filer_must_be_named_insured
        minimum_backing_package: =minimum_backing_package_by_state
        required_limits: =required_limits_source
      FR-44 Operator Certificate:
        eligible_states: =eligible_states
        backing_policy_category: =backing_policy_category
        filer_must_be_named_insured: =filer_must_be_named_insured
        minimum_backing_package: =minimum_backing_package_by_state
        required_limits: =required_limits_source
      FR-44 Owner-Operator Certificate:
        eligible_states: =eligible_states
        backing_policy_category: =backing_policy_category
        filer_must_be_named_insured: =filer_must_be_named_insured
        minimum_backing_package: =minimum_backing_package_by_state
        required_limits: =required_limits_source
- id: fr_filing_fee_rule
  subject:
  - fr_filing_fee_assessed
  - fr_filing_fee_waived
  rule: The filing fee is the certificate's filing_fee, charged once when a filing is requested for a
    reason in fee_charged_filing_reasons and billed on the backing term's billing plan. Only one filing
    fee is charged per filing request. No fee is charged for a corrected_refiling, and none when a renewal
    term carries the certificate forward. The fee is fully earned once the certificate is transmitted
    and is not returned when the backing term later cancels. A charged filing fee is reversed at most
    once. A reversal is made only for a request withdrawn before it was ever transmitted, a fee charged
    in error, or a duplicate request, for the fee's full amount.
  eligibility:
  - id: one_fee_per_request
    applies_to:
    - fr_filing_fee_assessed
    kind: dedup
    condition: Only one filing fee is charged per filing request.
    evidence_fields:
    - fr_filing_transactions.fr_filing_id
    - fr_filing_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filing_transactions.fr_filing_id
      action_bindings:
        fr_filing_transactions.fr_filing_id: fr_filing_id
    dedup_contract:
      table: fr_filing_transactions
      mode: separate_record
      object_bindings:
        fr_filing_id: fr_filing_id
      duplicate_filters:
        event_type:
        - fr_filing_fee_assessed
      distinct_fields: []
  - id: reverse_once
    applies_to:
    - fr_filing_fee_waived
    kind: dedup
    condition: A charged filing fee is reversed at most once.
    evidence_fields:
    - fr_filing_transactions.reversed_fee_txn_id
    - fr_filing_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filing_transactions.reversed_fee_txn_id
      action_bindings:
        fr_filing_transactions.reversed_fee_txn_id: reversed_fee_txn_id
    dedup_contract:
      table: fr_filing_transactions
      mode: separate_record
      object_bindings:
        reversed_fee_txn_id: reversed_fee_txn_id
      duplicate_filters:
        event_type:
        - fr_filing_fee_waived
      distinct_fields: []
  params:
    per_tier:
      SR-22 Owner Certificate:
        filing_fee: =filing_fee
      SR-22 Operator Certificate:
        filing_fee: =filing_fee
      SR-22 Owner-Operator Certificate:
        filing_fee: =filing_fee
      FR-44 Owner Certificate:
        filing_fee: =filing_fee
      FR-44 Operator Certificate:
        filing_fee: =filing_fee
      FR-44 Owner-Operator Certificate:
        filing_fee: =filing_fee
    fee_waiver_reasons: =fee_waiver_reasons
    fee_charged_filing_reasons: =fee_charged_filing_reasons
- id: fr_transmission
  subject:
  - fr_filing_accepted
  - fr_filing_rejected
  - fr_filing_corrected
  - fr_filing_withdrawn
  rule: A requested certificate is transmitted electronically within transmit_within_business_days business
    days of the request; the state accepts or rejects it within dmv_acknowledgment_business_days business
    days. The certificate is effective from the later of the backing term effective date and the request
    date. A rejection for a reason in correctable_rejection_reasons is cured by correcting the filer data.
    Corrected filer data is taken from the customer exactly as printed on the driver's license or state
    letter. A rejected filing is corrected and retransmitted no later than rejection_correction_days calendar
    days after the state rejection. Calendar days are counted from the rejection date as day 0; a corrected
    filing accepted on or before that date plus the correction days stays on the same request, and otherwise
    the request is withdrawn. A policy_limits_insufficient rejection is cured only by moving the backing
    term to the minimum backing package before retransmitting; a no_requirement_on_record rejection ends
    the request, which is withdrawn and its fee reversed. A request is also withdrawn when its backing
    term is cancelled from inception before acceptance.
  eligibility:
  - id: filer_data_verbatim
    applies_to:
    - fr_filing_corrected
    kind: caller_fact
    condition: Corrected filer data is taken from the customer exactly as printed on the driver's license
      or state letter.
    evidence_fields:
    - fr_filings.filed_driver_license_number
    - fr_filings.filed_driver_name
    - fr_filings.fr_filing_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - fr_filings.fr_filing_id
      action_bindings:
        fr_filings.fr_filing_id: fr_filing_id
  - id: correction_window
    applies_to:
    - fr_filing_accepted
    kind: time
    condition: A rejected filing is corrected and retransmitted no later than rejection_correction_days
      calendar days after the state rejection.
    evidence_fields:
    - fr_filings.rejection_reason
    - fr_filings.rejected_date
    - fr_filings.fr_filing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.fr_filing_id
      action_bindings:
        fr_filings.fr_filing_id: fr_filing_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the state rejection
      anchor_source: fr_filings.rejected_date
      relation: not_after
      duration_source: variants.rejection_correction_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the rejection date as day 0; a corrected filing accepted
        on or before that date plus the correction days stays on the same request, and otherwise the request
        is withdrawn.
      boundary: inclusive
  params:
    transmit_within_business_days: =transmit_within_business_days
    dmv_acknowledgment_business_days: =dmv_acknowledgment_business_days
    rejection_correction_days: =rejection_correction_days
    correctable_rejection_reasons: =correctable_rejection_reasons
- id: fr_sr26_notice
  subject:
  - fr_sr26_transmitted
  rule: 'An SR-26 is transmitted for a filed certificate when its backing term is cancelled, when its
    backing term expires without the renewal being accepted, when the filed driver is excluded or removed
    from the backing term, or on a release at the end of the requirement. An SR-26 for an ended backing
    term is transmitted no earlier than the date coverage under the backing term ended. The comparison
    is made on calendar dates with sr26_lag_days added to the ending date, which is the closed_date of
    the backing owner or non-owner term (its cancellation effective date, or the expiration date of a
    term not renewed). An SR-26 is transmitted no later than sr26_transmit_within_days calendar days after
    the date coverage under the backing term ended. Calendar days are counted from the ending date as
    day 0; transmission on or before the ending date plus the stated days is timely. A requirement_completed
    SR-26 is transmitted only on or after required_through_date and only on a release request from the
    named insured or the filed driver. When the backing term is reinstated, or its notice of cancellation
    rescinded, before the SR-26 is transmitted, no SR-26 is sent and the certificate continues. When the
    backing term is reinstated after its SR-26 was transmitted, the certificate is not revived: a new
    filing with filing_reason reinstatement_refiling is required. The certificate end date is the SR-26
    date plus certificate_runoff_days calendar days.'
  eligibility:
  - id: not_before_end
    applies_to:
    - fr_sr26_transmitted
    kind: time
    condition: An SR-26 for an ended backing term is transmitted no earlier than the date coverage under
      the backing term ended.
    evidence_fields:
    - fr_filings.auto_policy_id
    - nonowner_policies.closed_date
    - auto_policies.closed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.auto_policy_id
      action_bindings:
        fr_filings.auto_policy_id: auto_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date coverage under the backing term ended
      anchor_source: auto_policies.closed_date
      relation: not_before
      duration_source: params.sr26_lag_days
      unit: calendar_days
      counting_rule: The comparison is made on calendar dates with sr26_lag_days added to the ending date,
        which is the closed_date of the backing owner or non-owner term (its cancellation effective date,
        or the expiration date of a term not renewed).
      boundary: inclusive
  - id: timely
    applies_to:
    - fr_sr26_transmitted
    kind: time
    condition: An SR-26 is transmitted no later than sr26_transmit_within_days calendar days after the
      date coverage under the backing term ended.
    evidence_fields:
    - fr_filings.auto_policy_id
    - nonowner_policies.closed_date
    - auto_policies.closed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.auto_policy_id
      action_bindings:
        fr_filings.auto_policy_id: auto_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date coverage under the backing term ended
      anchor_source: auto_policies.closed_date
      relation: not_after
      duration_source: variants.sr26_transmit_within_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the ending date as day 0; transmission on or before
        the ending date plus the stated days is timely.
      boundary: inclusive
  - id: release_conditions
    applies_to:
    - fr_sr26_transmitted
    kind: authorization
    condition: A requirement_completed SR-26 is transmitted only on or after required_through_date and
      only on a release request from the named insured or the filed driver.
    evidence_fields:
    - fr_filings.required_through_date
    - fr_filing_documents.event_type
    - fr_filing_documents.requested_by
    - fr_filing_documents.fr_filing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filing_documents.fr_filing_id
      action_bindings:
        fr_filing_documents.fr_filing_id: fr_filing_id
  params:
    sr26_lag_days: 0
    certificate_runoff_days: =certificate_runoff_days
    sr26_trigger_events: =sr26_trigger_events
- id: fr_certificate_end
  subject:
  - fr_certificate_ended
  rule: 'The certificate is terminated no earlier than its certificate end date. The comparison is made
    on calendar dates: the processing date must be on or after the certificate end date, with end_lag_days
    added. Until that date the state still treats the driver as certified. A terminated certificate is
    never reopened; a later requirement needs a new filing.'
  eligibility:
  - id: end_date_reached
    applies_to:
    - fr_certificate_ended
    kind: time
    condition: The certificate is terminated no earlier than its certificate end date.
    evidence_fields:
    - fr_filings.fr_filing_id
    - fr_filings.certificate_end_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.fr_filing_id
      action_bindings:
        fr_filings.fr_filing_id: fr_filing_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its certificate end date
      anchor_source: fr_filings.certificate_end_date
      relation: not_before
      duration_source: params.end_lag_days
      unit: calendar_days
      counting_rule: 'The comparison is made on calendar dates: the processing date must be on or after
        the certificate end date, with end_lag_days added.'
      boundary: inclusive
  params:
    end_lag_days: 0
- id: fr_certificate_copies
  subject:
  - fr_certificate_copy_issued
  rule: A copy of the certificate is issued only while the filing's status is filed. Copies are free (certificate_copy_fee),
    go only to a recipient in copy_recipients through a channel in certificate_copy_channels, and a mailed
    copy is sent within certificate_copy_mail_business_days business days. A pending, rejected or cancellation_filed
    filing gets no copy; the desk states its status instead.
  eligibility:
  - id: filed_only
    applies_to:
    - fr_certificate_copy_issued
    kind: state
    condition: A copy of the certificate is issued only while the filing's status is filed.
    evidence_fields:
    - fr_filings.status
    - fr_filings.fr_filing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fr_filings.fr_filing_id
      action_bindings:
        fr_filings.fr_filing_id: fr_filing_id
    state_contract:
      field: fr_filings.status
      allowed:
      - filed
  params:
    certificate_copy_fee: =certificate_copy_fee
    copy_recipients: =copy_recipients
    certificate_copy_channels: =certificate_copy_channels
- id: fr_release_request
  subject:
  - fr_release_requested
  rule: 'A release request is made only by the named insured or the filed driver personally. A release
    request received before required_through_date is recorded but no SR-26 is sent until that date; a
    filing whose state order gives no required_through_date is released only after the customer provides
    the state''s letter ending the requirement, which the desk cannot evaluate and refers. A request to
    drop the certificate because the customer is moving it to another carrier is not a release: the certificate
    continues until the backing term itself ends.'
  eligibility:
  - id: requester
    applies_to:
    - fr_release_requested
    kind: caller_fact
    condition: A release request is made only by the named insured or the filed driver personally.
    evidence_fields:
    - fr_filing_documents.requested_by
    - fr_filing_documents.fr_filing_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - fr_filing_documents.fr_filing_id
      action_bindings:
        fr_filing_documents.fr_filing_id: fr_filing_id
  params:
    release_requested_by: =release_requested_by
extended_policies:
- id: fr_ext_lapse_sr26_runoff
  base_policy_refs:
  - fr_sr26_notice
  - fr_agg_backing_term
  overwrite:
  - base_policy: fr_sr26_notice
    superseded_clause: When the backing term is reinstated, or its notice of cancellation rescinded, before the SR-26
      is transmitted, no SR-26 is sent and the certificate continues.
    replaced_by: When a backing term, an Owner Auto Policy term or a Named Non-Owner term, was cancelled and has since
      been reinstated with a lapse, and only then, the SR-26 is still transmitted for the lapse and the certificate does
      not continue; a backing term reinstated without a lapse, and any backing term whose notice of cancellation was
      rescinded, before the SR-26 is transmitted still receive no SR-26 and their certificates continue.
  - base_policy: fr_sr26_notice
    superseded_clause: The comparison is made on calendar dates with sr26_lag_days added to the ending date, which is
      the closed_date of the backing owner or non-owner term (its cancellation effective date, or the expiration date
      of a term not renewed).
    replaced_by: The comparison is made on calendar dates with sr26_lag_days added to the ending date; for a backing
      term reinstated with a lapse the ending date is its lapse_start_date, and for every other ended backing term it
      remains the closed_date of the backing owner or non-owner term (its cancellation effective date, or the expiration
      date of a term not renewed).
  - base_policy: fr_sr26_notice
    superseded_clause: The certificate end date is the SR-26 date plus certificate_runoff_days calendar days.
    replaced_by: For a lapse SR-26 the certificate end date is the SR-26 date plus the lapse run-off days worked out
      below; an SR-26 for a certificate whose backing term was cancelled and not reinstated takes its run-off from the
      cancellation SR-26 rule, and every other SR-26 keeps the certificate end date at the SR-26 date plus certificate_runoff_days
      calendar days.
  - base_policy: fr_agg_backing_term
    superseded_clause: Every filing backed by a term receives its SR-26 when that term's coverage ends without being
      continued.
    replaced_by: Every filing backed by a term receives its SR-26 when that term's coverage ends without being continued,
      and a certificate whose backing term was cancelled receives its SR-26 even when the term has since been reinstated
      with a lapse, the lapse being coverage that was not continued.
  - base_policy: fr_sr26_notice
    superseded_clause: An SR-26 for an ended backing term is transmitted no earlier than the date coverage under the
      backing term ended.
    replaced_by: An SR-26 for an ended backing term is transmitted no earlier than the date coverage under the backing
      term ended, which for a backing term reinstated with a lapse is its lapse_start_date.
  - base_policy: fr_sr26_notice
    superseded_clause: An SR-26 is transmitted no later than sr26_transmit_within_days calendar days after the date coverage
      under the backing term ended.
    replaced_by: 'For a lapse SR-26 the window runs from the backing term''s lapse_start_date: the SR-26 is transmitted
      no later than sr26_transmit_within_days calendar days after that date, counted from it as day 0; a lapse SR-26
      not transmitted by then is still owed, is transmitted at once on the day it is found owed, and its certificate
      end date is counted from the date it is actually transmitted; a cancellation SR-26, for a backing term cancelled
      and not reinstated, keeps the window the cancellation SR-26 rule states, and every other SR-26 for an ended backing
      term is transmitted no later than sr26_transmit_within_days calendar days after the date coverage under the backing
      term ended.'
  trigger: state_due
  subject:
  - fr_sr26_transmitted
  computes: runoff_days
  target_tool: transmit_lapse_sr26_2b138773
  params:
    lapse_brief_days: 3
    lapse_extended_days: 10
    lapse_fr44_group_notice_days: 4
    lapse_south_group_notice_days: 2
    lapse_out_of_region_notice_days: 3
    lapse_in_region_notice_days: 1
    lapse_owner_operator_notice_days: 2
    lapse_operator_notice_days: 1
    lapse_fr44_form_notice_days: 3
    lapse_sr22_form_notice_days: 1
  rule: 'This rule fixes the run-off of the lapse SR-26: the SR-26 transmitted for an SR-22 or FR-44 certificate of any
    type whose backing term, an Owner Auto Policy term or a Named Non-Owner term, was cancelled and has since been reinstated
    with a lapse; the SR-26 reason is policy_cancelled. For a lapse SR-26 the window runs from the backing term''s lapse_start_date:
    the SR-26 is transmitted no later than sr26_transmit_within_days calendar days after that date, counted from it as
    day 0; a lapse SR-26 not transmitted by then is still owed, is transmitted at once on the day it is found owed, and
    its certificate end date is counted from the date it is actually transmitted; a cancellation SR-26, for a backing
    term cancelled and not reinstated, keeps the window the cancellation SR-26 rule states, and every other SR-26 for
    an ended backing term is transmitted no later than sr26_transmit_within_days calendar days after the date coverage
    under the backing term ended. When a backing term, an Owner Auto Policy term or a Named Non-Owner term, was cancelled
    and has since been reinstated with a lapse, and only then, the SR-26 is still transmitted for the lapse and the certificate
    does not continue; a backing term reinstated without a lapse, and any backing term whose notice of cancellation was
    rescinded, before the SR-26 is transmitted still receive no SR-26 and their certificates continue. The comparison
    is made on calendar dates with sr26_lag_days added to the ending date; for a backing term reinstated with a lapse
    the ending date is its lapse_start_date, and for every other ended backing term it remains the closed_date of the
    backing owner or non-owner term (its cancellation effective date, or the expiration date of a term not renewed).
    For a lapse SR-26 the certificate end date is the SR-26 date plus the lapse run-off days worked out below; an SR-26
    for a certificate whose backing term was cancelled and not reinstated takes its run-off from the cancellation SR-26
    rule, and every other SR-26 keeps the certificate end date at the SR-26 date plus certificate_runoff_days calendar
    days. Every filing backed by a term receives its SR-26 when that term''s coverage ends without being continued, and
    a certificate whose backing term was cancelled receives its SR-26 even when the term has since been reinstated with
    a lapse, the lapse being coverage that was not continued. An SR-26 for an ended backing term is transmitted no earlier
    than the date coverage under the backing term ended, which for a backing term reinstated with a lapse is its lapse_start_date.
    The standard lapse run-off is the certificate''s certificate_runoff_days, counted in calendar days from the SR-26
    date, and the lapse run-off days are a whole number of days. The adjustments below make up Cardinal Point''s own
    SR-26 notice schedule for lapses. The adjustments below are applied to the standard lapse run-off in this order:
    an adjustment that changes how the standard lapse run-off is counted is applied first, and every adjustment that
    adds days is then added to that result; the lapse run-off is never below zero days. Each dimension enters the schedule
    once. The counting of the standard lapse run-off follows how the backing term''s coverage was restored, read from
    the length of its lapse: the calendar days from its lapse_start_date through its lapse_end_date, both days counted.
    After a lapse of no more than lapse_brief_days days the standard lapse run-off is counted from the term''s reinstatement_date,
    so the lapse run-off days are the standard lapse run-off less the calendar days from the reinstatement_date to the
    SR-26 date (zero days when the reinstatement_date is later), never below zero. After a lapse of more than lapse_brief_days
    up to lapse_extended_days days the standard lapse run-off is counted from the term''s lapse_start_date, so the lapse
    run-off days are the standard lapse run-off less the calendar days from the lapse_start_date to the SR-26 date, never
    below zero. After a longer lapse the standard lapse run-off is counted from the SR-26 date. The lapse state notice
    days follows the state group of the backing term''s own state (the resident_state of a Named Non-Owner term, the
    garaging_state of an Owner Auto Policy term). Florida or Virginia adds lapse_fr44_group_notice_days; Texas or Georgia
    adds lapse_south_group_notice_days; Arizona or Ohio adds no lapse state notice days. The lapse out-of-state notice
    days follows whether the filing state differs from the backing term''s own state, and whether the two lie in the
    same state group, the state groups being Florida and Virginia, Texas and Georgia, and Arizona and Ohio. A filing
    state in a different state group from the backing term''s own state adds lapse_out_of_region_notice_days; a different
    filing state in the same state group adds lapse_in_region_notice_days; a filing state equal to the backing term''s
    own state adds no lapse out-of-state notice days. The lapse type notice days follows the certificate type, which
    fixes the kind of backing term it rests on. An Owner-Operator certificate on an Owner Auto Policy backing term adds
    lapse_owner_operator_notice_days; an Operator certificate on a Named Non-Owner backing term adds lapse_operator_notice_days;
    an Owner certificate adds no lapse type notice days. The lapse form notice days follows the certificate form the
    backing term is written to back, its financial_responsibility_filing. A term written to back an FR-44 adds lapse_fr44_form_notice_days;
    a term written to back an SR-22 adds lapse_sr22_form_notice_days; a term recorded as backing none adds no lapse form
    notice days.'
  prerequisite: []
  cross_category:
  - category: nonowner
    as: branch
    reads:
    - resident_state
    - cancellation_reason
    - closed_date
    - financial_responsibility_filing
    - lapse_end_date
    - lapse_start_date
    - reinstatement_date
    - status
    - variant_name
    note: The lapse run-off reads a Named Non-Owner backing term's dates, cancellation reason, resident state, record
      and the certificate it is written to back.
  - category: auto
    as: branch
    reads:
    - garaging_state
    - cancellation_reason
    - closed_date
    - financial_responsibility_filing
    - lapse_end_date
    - lapse_start_date
    - reinstatement_date
    - status
    - variant_name
    note: The lapse run-off reads an Owner Auto Policy backing term's dates, cancellation reason, garaging state, record
      and the certificate it is written to back.
  compute:
  - std: P('certificate_runoff_days')
  - lapse_start: (F('nonowner_policy_id') and CFIELD('nonowner', 'lapse_start_date', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'lapse_start_date', auto_policy_id=F('auto_policy_id')))
  - lapse_end: (F('nonowner_policy_id') and CFIELD('nonowner', 'lapse_end_date', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'lapse_end_date', auto_policy_id=F('auto_policy_id')))
  - lapse_resumed: (F('nonowner_policy_id') and CFIELD('nonowner', 'reinstatement_date', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'reinstatement_date', auto_policy_id=F('auto_policy_id')))
  - lapse_length: (DAYS(lapse_start, lapse_end) + 1) if (lapse_start and lapse_end) else 0
  - lapse_counted: MX(0, std - MX(0, DAYS(lapse_resumed, NOW))) if (lapse_length <= K('lapse_brief_days') and lapse_resumed)
      else (MX(0, std - MX(0, DAYS(lapse_start, NOW))) if (lapse_length <= K('lapse_extended_days') and lapse_start)
      else std)
  - lapse_rating_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id')))
  - lapse_state: K('lapse_fr44_group_notice_days') if (lapse_rating_state == 'FL' or lapse_rating_state == 'VA') else
      (K('lapse_south_group_notice_days') if (lapse_rating_state == 'TX' or lapse_rating_state == 'GA') else 0)
  - lapse_home_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id')))
  - lapse_out: K('lapse_in_region_notice_days') if (lapse_home_state and F('filing_state') != lapse_home_state and (((F('filing_state')
      == 'FL' or F('filing_state') == 'VA') and (lapse_home_state == 'FL' or lapse_home_state == 'VA')) or ((F('filing_state')
      == 'TX' or F('filing_state') == 'GA') and (lapse_home_state == 'TX' or lapse_home_state == 'GA')) or ((F('filing_state')
      == 'AZ' or F('filing_state') == 'OH') and (lapse_home_state == 'AZ' or lapse_home_state == 'OH')))) else (K('lapse_out_of_region_notice_days')
      if (lapse_home_state and F('filing_state') != lapse_home_state) else 0)
  - lapse_owner_term: CFIELD('auto', 'status', auto_policy_id=F('auto_policy_id'))
  - lapse_nonowner_term: CFIELD('nonowner', 'status', nonowner_policy_id=F('nonowner_policy_id'))
  - lapse_type: K('lapse_owner_operator_notice_days') if (P('certificate_type') == 'owner_operator' and lapse_owner_term)
      else (K('lapse_operator_notice_days') if (P('certificate_type') == 'operator' and lapse_nonowner_term) else 0)
  - lapse_term_filing: (F('nonowner_policy_id') and CFIELD('nonowner', 'financial_responsibility_filing', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'financial_responsibility_filing', auto_policy_id=F('auto_policy_id')))
  - lapse_form: K('lapse_fr44_form_notice_days') if lapse_term_filing == 'fr44' else (K('lapse_sr22_form_notice_days')
      if lapse_term_filing == 'sr22' else 0)
  - result: int(MX(0, lapse_counted + lapse_state + lapse_out + lapse_type + lapse_form))
  compute_basis:
    std: The standard lapse run-off is the certificate's certificate_runoff_days, counted in calendar days from the SR-26
      date, and the lapse run-off days are a whole number of days.
    lapse_rating_state: The lapse state notice days follows the state group of the backing term's own state (the resident_state
      of a Named Non-Owner term, the garaging_state of an Owner Auto Policy term).
    lapse_state: Florida or Virginia adds lapse_fr44_group_notice_days; Texas or Georgia adds lapse_south_group_notice_days;
      Arizona or Ohio adds no lapse state notice days.
    lapse_home_state: The lapse out-of-state notice days follows whether the filing state differs from the backing term's
      own state, and whether the two lie in the same state group, the state groups being Florida and Virginia, Texas
      and Georgia, and Arizona and Ohio.
    lapse_out: A filing state in a different state group from the backing term's own state adds lapse_out_of_region_notice_days;
      a different filing state in the same state group adds lapse_in_region_notice_days; a filing state equal to the
      backing term's own state adds no lapse out-of-state notice days.
    lapse_owner_term: The lapse type notice days follows the certificate type, which fixes the kind of backing term it
      rests on.
    lapse_nonowner_term: The lapse type notice days follows the certificate type, which fixes the kind of backing term
      it rests on.
    lapse_type: An Owner-Operator certificate on an Owner Auto Policy backing term adds lapse_owner_operator_notice_days;
      an Operator certificate on a Named Non-Owner backing term adds lapse_operator_notice_days; an Owner certificate
      adds no lapse type notice days.
    result: 'The adjustments below are applied to the standard lapse run-off in this order: an adjustment that changes
      how the standard lapse run-off is counted is applied first, and every adjustment that adds days is then added to
      that result; the lapse run-off is never below zero days. Each dimension enters the schedule once.'
    lapse_start: 'The counting of the standard lapse run-off follows how the backing term''s coverage was restored, read
      from the length of its lapse: the calendar days from its lapse_start_date through its lapse_end_date, both days
      counted.'
    lapse_end: 'The counting of the standard lapse run-off follows how the backing term''s coverage was restored, read
      from the length of its lapse: the calendar days from its lapse_start_date through its lapse_end_date, both days
      counted.'
    lapse_resumed: 'The counting of the standard lapse run-off follows how the backing term''s coverage was restored,
      read from the length of its lapse: the calendar days from its lapse_start_date through its lapse_end_date, both
      days counted.'
    lapse_length: 'The counting of the standard lapse run-off follows how the backing term''s coverage was restored,
      read from the length of its lapse: the calendar days from its lapse_start_date through its lapse_end_date, both
      days counted.'
    lapse_counted: After a lapse of no more than lapse_brief_days days the standard lapse run-off is counted from the
      term's reinstatement_date, so the lapse run-off days are the standard lapse run-off less the calendar days from
      the reinstatement_date to the SR-26 date (zero days when the reinstatement_date is later), never below zero. After
      a lapse of more than lapse_brief_days up to lapse_extended_days days the standard lapse run-off is counted from
      the term's lapse_start_date, so the lapse run-off days are the standard lapse run-off less the calendar days from
      the lapse_start_date to the SR-26 date, never below zero. After a longer lapse the standard lapse run-off is counted
      from the SR-26 date.
    lapse_term_filing: The lapse form notice days follows the certificate form the backing term is written to back, its
      financial_responsibility_filing.
    lapse_form: A term written to back an FR-44 adds lapse_fr44_form_notice_days; a term written to back an SR-22 adds
      lapse_sr22_form_notice_days; a term recorded as backing none adds no lapse form notice days.
  factors:
  - id: lapse_runoff_counting
    effect: method
    decides: lapse_counted
    bindings:
    - lapse_start
    - lapse_end
    - lapse_resumed
    - lapse_length
    - lapse_counted
    ladder:
    - when: a lapse of no more than lapse_brief_days days
      method: the standard lapse run-off less the calendar days from the reinstatement_date to the SR-26 date, never
        below zero
    - when: a lapse of more than lapse_brief_days up to lapse_extended_days days
      method: the standard lapse run-off less the calendar days from the lapse_start_date to the SR-26 date, never below
        zero
    - when: otherwise (a longer lapse)
      method: the standard lapse run-off counted from the SR-26 date
    baseline:
      lapse_counted: std
    evidence:
    - cross_category
    - date
    cross_difficulty: nonowner
  - id: lapse_state_notice
    effect: parameter
    decides: lapse_state
    bindings:
    - lapse_rating_state
    - lapse_state
    ladder:
    - when: the backing term's own state is Florida or Virginia
      value: K('lapse_fr44_group_notice_days')
    - when: it is Texas or Georgia
      value: K('lapse_south_group_notice_days')
    - when: otherwise (Arizona or Ohio)
      value: '0'
    baseline:
      lapse_state: '0'
    evidence:
    - cross_category
    cross_difficulty: nonowner
  - id: lapse_out_of_state_notice
    effect: parameter
    decides: lapse_out
    bindings:
    - lapse_home_state
    - lapse_out
    ladder:
    - when: the filing state lies in a different state group from the backing term's own state
      value: K('lapse_out_of_region_notice_days')
    - when: the filing state differs from it but lies in the same state group
      value: K('lapse_in_region_notice_days')
    - when: otherwise (the filing state equals it)
      value: '0'
    baseline:
      lapse_out: '0'
    evidence:
    - cross_category
    cross_difficulty: nonowner
  - id: lapse_type_notice
    effect: parameter
    decides: lapse_type
    bindings:
    - lapse_owner_term
    - lapse_nonowner_term
    - lapse_type
    ladder:
    - when: an Owner-Operator certificate on an Owner Auto Policy backing term
      value: K('lapse_owner_operator_notice_days')
    - when: an Operator certificate on a Named Non-Owner backing term
      value: K('lapse_operator_notice_days')
    - when: otherwise (an Owner certificate)
      value: '0'
    baseline:
      lapse_type: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: nonowner
  - id: lapse_form_notice
    effect: parameter
    decides: lapse_form
    bindings:
    - lapse_term_filing
    - lapse_form
    ladder:
    - when: the backing term is written to back an FR-44
      value: K('lapse_fr44_form_notice_days')
    - when: it is written to back an SR-22
      value: K('lapse_sr22_form_notice_days')
    - when: otherwise (recorded as backing none)
      value: '0'
    baseline:
      lapse_form: '0'
    evidence:
    - cross_category
    cross_difficulty: nonowner
  baseline:
    rule: The standard lapse run-off is the certificate's certificate_runoff_days, counted in calendar days from the
      SR-26 date, and the lapse run-off days are a whole number of days.
    params:
    - certificate_runoff_days
  inputs:
    history: []
    cross_category:
    - nonowner
    - auto
- id: fr_ext_refiling_fee
  base_policy_refs:
  - fr_filing_fee_rule
  - fr_agg_multi_holding
  - fr_agg_backing_term
  - fr_filing_eligibility
  - fr_sr26_notice
  overwrite:
  - base_policy: fr_filing_fee_rule
    superseded_clause: The filing fee is the certificate's filing_fee, charged once when a filing is requested for a
      reason in fee_charged_filing_reasons and billed on the backing term's billing plan.
    replaced_by: For a reinstatement_refiling that replaces a certificate whose SR-26 was transmitted for a cancellation
      of its since-reinstated backing term, and only for such a refiling, the filing fee is the refiling fee worked out
      below, charged once when the refiling is requested and billed on the backing term's billing plan; a state_change
      refiling after a move and a fee charged again after a full company_error reversal are priced under their own rules,
      and every other filing requested for a reason in fee_charged_filing_reasons is charged the certificate's filing_fee,
      once, billed on the backing term's billing plan.
  trigger: on_request
  subject:
  - fr_filing_requested
  - fr_filing_fee_assessed
  computes: filing_fee
  target_tool: order_refiled_certificate_bf9cb0f2
  params:
    refiling_base_fee: 25.0
    refile_gap_days: 30
    refile_brief_lapse_days: 3
    refile_long_lapse_charge: 5.0
    refile_brief_lapse_charge: 2.0
    refile_fr44_group_charge: 6.0
    refile_south_group_charge: 3.0
    refile_out_of_region_charge: 8.0
    refile_in_region_charge: 4.0
    refile_owner_operator_charge: 4.0
    refile_operator_charge: 2.0
    refile_fr44_form_charge: 10.0
    refile_sr22_form_charge: 2.0
  rule: 'This rule prices the refiling a filed driver orders when a certificate has received an SR-26 for a cancellation
    of its backing term and that term has since been reinstated: a certificate whose backing term, an Owner Auto Policy
    term or a Named Non-Owner term, was reinstated with a lapse (its SR-26 sent under the lapse SR-26 rule), or whose
    backing term was reinstated after its SR-26 was transmitted. Refiling after a lapse is a new filing, requested with
    filing_reason reinstatement_refiling, on the same certificate form, type, filing state and backing term, for the
    same driver data, state case number and required_through_date as the certificate it replaces, and it names that certificate
    as the filing it replaces. For a reinstatement_refiling that replaces a certificate whose SR-26 was transmitted for
    a cancellation of its since-reinstated backing term, and only for such a refiling, the filing fee is the refiling
    fee worked out below, charged once when the refiling is requested and billed on the backing term''s billing plan;
    a state_change refiling after a move and a fee charged again after a full company_error reversal are priced under
    their own rules, and every other filing requested for a reason in fee_charged_filing_reasons is charged the certificate''s
    filing_fee, once, billed on the backing term''s billing plan. The refiling fee is fixed only after the replaced certificate
    carries an SR-26 date and a certificate end date. The standard refiling fee is refiling_base_fee, Cardinal Point''s
    flat refiling fee, in US dollars to the cent. The adjustments below make up Cardinal Point''s own filing-fee schedule
    for refilings. The adjustments below are applied to the standard fee of this rule in this order: an adjustment that
    replaces the standard fee is applied first, and every adjustment that adds an amount is then added to that result;
    the total is never below zero and is rounded to the cent, half up, once at the end. Each dimension enters the schedule
    once. The refiling fee basis, which replaces the standard fee of this rule, follows how the replaced certificate''s
    coverage with the state ended, read from its sr26_date and certificate_end_date. When the replaced certificate carries
    an SR-26 date and its certificate end date is on or after the refiling date, so that the state still treats the driver
    as certified, the refiling fee basis is half the standard fee of this rule rounded up to the next whole dollar. When
    its certificate end date is before the refiling date by more than refile_gap_days days, so that its certification
    with the state lapsed well before, the refiling fee basis is one and a half times the standard fee of this rule rounded
    down to the whole dollar. When its certificate end date is before the refiling date by refile_gap_days days or fewer,
    the refiling fee basis is the standard fee of this rule. The refiling restoration charge follows how the backing
    term''s coverage was restored, read from the length of its most recent lapse: the calendar days from its lapse_start_date
    through its lapse_end_date, both days counted. A reinstatement after a lapse of more than refile_brief_lapse_days
    days adds refile_long_lapse_charge; a reinstatement after a lapse of refile_brief_lapse_days days or fewer adds refile_brief_lapse_charge;
    a reinstatement without a lapse adds no refiling restoration charge. The refiling state charge follows the state
    group of the backing term''s own state (the resident_state of a Named Non-Owner term, the garaging_state of an Owner
    Auto Policy term). Florida or Virginia adds refile_fr44_group_charge; Texas or Georgia adds refile_south_group_charge;
    Arizona or Ohio adds no refiling state charge. The refiling out-of-state charge follows whether the filing state
    differs from the backing term''s own state, and whether the two lie in the same state group, the state groups being
    Florida and Virginia, Texas and Georgia, and Arizona and Ohio. A filing state in a different state group from the
    backing term''s own state adds refile_out_of_region_charge; a different filing state in the same state group adds
    refile_in_region_charge; a filing state equal to the backing term''s own state adds no refiling out-of-state charge.
    The refiling type charge follows the certificate type, which fixes the kind of backing term it rests on. An Owner-Operator
    certificate on an Owner Auto Policy backing term adds refile_owner_operator_charge; an Operator certificate on a
    Named Non-Owner backing term adds refile_operator_charge; an Owner certificate adds no refiling type charge. The
    refiling form charge follows the certificate form the backing term is written to back, its financial_responsibility_filing.
    A term written to back an FR-44 adds refile_fr44_form_charge; a term written to back an SR-22 adds refile_sr22_form_charge;
    a term recorded as backing none adds no refiling form charge.'
  prerequisite:
  - problem: fr_ext_lapse_sr26_runoff
    kind: value_input
    gate: refile_basis
    form: state
    policy_source: The refiling fee is fixed only after the replaced certificate carries an SR-26 date and a certificate
      end date.
    condition: The replaced certificate's fr_filings row carries a non-empty sr26_date and certificate_end_date (status
      cancellation_filed) at the handling time of the refiling; for a certificate whose backing term was reinstated after
      its SR-26 this already holds on the records, and for a certificate whose backing term was reinstated with a lapse
      before any SR-26 the lapse SR-26 brings it about.
    resolved_by: transmit_lapse_sr26_2b138773
    effect: Once the lapse SR-26 is transmitted the replaced certificate carries an SR-26 date and a certificate end
      date on or after the refiling date, so the refiling fee basis is half the standard fee rounded up to the next whole
      dollar.
  cross_category:
  - category: nonowner
    as: branch
    reads:
    - resident_state
    - status
    - lapse_start_date
    - lapse_end_date
    - financial_responsibility_filing
    note: The refiling charges read a Named Non-Owner backing term's resident state, record, lapse dates and the certificate
      it is written to back.
  - category: auto
    as: branch
    reads:
    - garaging_state
    - status
    - lapse_start_date
    - lapse_end_date
    - financial_responsibility_filing
    note: The refiling charges read an Owner Auto Policy backing term's garaging state, record, lapse dates and the certificate
      it is written to back.
  compute:
  - std: K('refiling_base_fee')
  - refile_end_gap: DAYS(F('certificate_end_date'), NOW) if (F('sr26_date') and F('certificate_end_date')) else None
  - refile_basis: (int(std / 2) + (std / 2 > int(std / 2))) if (refile_end_gap != None and refile_end_gap <= 0) else
      (int(std * 3 / 2) if (refile_end_gap != None and refile_end_gap > K('refile_gap_days')) else std)
  - refile_lapse_start: (F('nonowner_policy_id') and CFIELD('nonowner', 'lapse_start_date', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'lapse_start_date', auto_policy_id=F('auto_policy_id')))
  - refile_lapse_end: (F('nonowner_policy_id') and CFIELD('nonowner', 'lapse_end_date', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'lapse_end_date', auto_policy_id=F('auto_policy_id')))
  - refile_lapse_len: (DAYS(refile_lapse_start, refile_lapse_end) + 1) if (refile_lapse_start and refile_lapse_end) else
      0
  - refile_restoration: K('refile_long_lapse_charge') if refile_lapse_len > K('refile_brief_lapse_days') else (K('refile_brief_lapse_charge')
      if refile_lapse_len > 0 else 0)
  - refile_rating_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id')))
  - refile_state: K('refile_fr44_group_charge') if (refile_rating_state == 'FL' or refile_rating_state == 'VA') else
      (K('refile_south_group_charge') if (refile_rating_state == 'TX' or refile_rating_state == 'GA') else 0)
  - refile_home_state: (F('nonowner_policy_id') and CFIELD('nonowner', 'resident_state', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'garaging_state', auto_policy_id=F('auto_policy_id')))
  - refile_out: K('refile_in_region_charge') if (refile_home_state and F('filing_state') != refile_home_state and (((F('filing_state')
      == 'FL' or F('filing_state') == 'VA') and (refile_home_state == 'FL' or refile_home_state == 'VA')) or ((F('filing_state')
      == 'TX' or F('filing_state') == 'GA') and (refile_home_state == 'TX' or refile_home_state == 'GA')) or ((F('filing_state')
      == 'AZ' or F('filing_state') == 'OH') and (refile_home_state == 'AZ' or refile_home_state == 'OH')))) else (K('refile_out_of_region_charge')
      if (refile_home_state and F('filing_state') != refile_home_state) else 0)
  - refile_owner_term: CFIELD('auto', 'status', auto_policy_id=F('auto_policy_id'))
  - refile_nonowner_term: CFIELD('nonowner', 'status', nonowner_policy_id=F('nonowner_policy_id'))
  - refile_type: K('refile_owner_operator_charge') if (P('certificate_type') == 'owner_operator' and refile_owner_term)
      else (K('refile_operator_charge') if (P('certificate_type') == 'operator' and refile_nonowner_term) else 0)
  - refile_term_filing: (F('nonowner_policy_id') and CFIELD('nonowner', 'financial_responsibility_filing', nonowner_policy_id=F('nonowner_policy_id')))
      or (F('auto_policy_id') and CFIELD('auto', 'financial_responsibility_filing', auto_policy_id=F('auto_policy_id')))
  - refile_form: K('refile_fr44_form_charge') if refile_term_filing == 'fr44' else (K('refile_sr22_form_charge') if refile_term_filing
      == 'sr22' else 0)
  - result: RND(MX(0, refile_basis + refile_restoration + refile_state + refile_out + refile_type + refile_form), 2)
  compute_basis:
    std: The standard refiling fee is refiling_base_fee, Cardinal Point's flat refiling fee, in US dollars to the cent.
    refile_end_gap: The refiling fee basis, which replaces the standard fee of this rule, follows how the replaced certificate's
      coverage with the state ended, read from its sr26_date and certificate_end_date.
