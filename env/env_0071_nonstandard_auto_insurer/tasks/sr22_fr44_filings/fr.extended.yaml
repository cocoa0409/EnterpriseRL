      of this rule.
    refile_rating_state: The refiling state charge follows the state group of the backing term's own state (the resident_state
      of a Named Non-Owner term, the garaging_state of an Owner Auto Policy term).
    refile_state: Florida or Virginia adds refile_fr44_group_charge; Texas or Georgia adds refile_south_group_charge;
