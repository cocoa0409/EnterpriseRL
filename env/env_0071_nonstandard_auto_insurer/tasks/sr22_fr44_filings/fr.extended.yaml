      refiling date, so that the state still treats the driver as certified, the refiling fee basis is half the standard
      fee of this rule rounded up to the next whole dollar. When its certificate end date is before the refiling date
      by more than refile_gap_days days, so that its certification with the state lapsed well before, the refiling fee
      basis is one and a half times the standard fee of this rule rounded down to the whole dollar. When its certificate
