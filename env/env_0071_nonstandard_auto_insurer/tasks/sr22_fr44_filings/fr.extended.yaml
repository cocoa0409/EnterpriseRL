      term's own state adds no refiling out-of-state charge.
    refile_owner_term: The refiling type charge follows the certificate type, which fixes the kind of backing term it
      rests on.
    refile_nonowner_term: The refiling type charge follows the certificate type, which fixes the kind of backing term
      it rests on.
    refile_type: An Owner-Operator certificate on an Owner Auto Policy backing term adds refile_owner_operator_charge;
      an Operator certificate on a Named Non-Owner backing term adds refile_operator_charge; an Owner certificate adds
