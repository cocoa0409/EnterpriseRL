name: env_0072_subprime_auto_lender
company: Harborline Acceptance Corporation

background: |
  Harborline Acceptance Corporation is an indirect auto finance company headquartered in Dallas, Texas, that buys retail installment contracts from franchised and independent car dealers and services them for borrowers whose credit keeps them out of prime lending.
  It services about 212,000 contracts in 38 states, bought from roughly 4,300 dealerships, and its customer service desk talks to borrowers, co-borrowers and dealership finance staff in plain, practical language.
  Every borrower holds one or more Retail Installment Contracts, simple-interest contracts priced by credit tier, from Tier 6 Fresh Start and Tier 5 Rebuild through Tier 4 Standard, Tier 3 Advantage and Tier 2 Preferred up to Tier 1 Select.
  A contract is booked when Harborline purchases it, becomes active when the dealer is funded, and from then on carries a running record of payments, returned payments, fees, due-date changes, extensions, payoff quotes and, at the end, a payoff and lien release.
  Many contracts also carry add-on products financed at signing: a GAP Waiver Addendum (GAP Waiver 120, 130, 140 and 150, GAP Waiver Plus 150 and GAP Waiver Premier 150) and a DriveSure Vehicle Service Contract (Powertrain, Powertrain Plus, Silver, Gold, Platinum and Exclusionary), each with its own claims, cancellations and refunds.
  Every financed vehicle has an insurance tracking record under the Collateral Protection Insurance program, banded by vehicle value from CollateralGuard Plan A to CollateralGuard Plan F, which logs the borrower's proof of insurance, lapse notices and, when coverage lapses, force-placed premiums and their refunds.
  When a contract falls seriously behind, it moves into a repossession case under Repossession and Collateral Recovery, whose expense schedule follows the vehicle's collateral class, from Recovery Class 1 Passenger Car through Recovery Class 6 Full-Size Van, and whose file records notices, recovery, storage, reinstatement, redemption or sale.
  A sale that leaves money owing opens a Deficiency Balance Account, banded from Deficiency Resolution Band 1 to Band 6 by the original deficiency, which records payments, refund credits, payment plans and settlements.
  Selling dealers hold Dealer Retail Agreements ranked from Dealer Program Bronze through Silver, Gold, Platinum and Diamond to Elite, with contract fundings, holdbacks, title deliveries, participation payments and chargebacks booked against each agreement.
  Typical callers are borrowers two to four years into a 60- or 72-month contract who have made most payments but not all, often with a returned payment or two, a late charge, an earlier extension or due-date change in their history.
  Some call about insurance letters they do not understand, a force-placed premium added to their balance, or a refund they expected after paying off or cancelling an add-on product.
  Others call after their vehicle was picked up, wanting it back, wanting their belongings from it, or disputing what they owe after it was sold.
  A smaller group are active-duty servicemembers or recently separated veterans, borrowers holding two contracts at once, and dealership finance managers asking about funding, holdbacks and chargebacks on contracts they sold.

logs:
  verification_log_table: verifications
  handoff_log_table: handoffs

difficulties:
  - name: contract_payments_fees_and_servicing
    claim:
      categories: [contract]
      event_types: [contract_payment_posted, contract_payment_returned, contract_fee_assessed, contract_fee_waived, contract_fee_paid, contract_servicing_update, contract_due_date_changed, contract_extension_granted, contract_scra_rate_adjusted, contract_payoff_quoted, contract_paid_off, contract_lien_released]
    summary: >
      Borrowers on any of the six credit tiers call to make or question a payment, contest a late charge or returned-payment fee, move their due date, ask for an extension because of a hardship, request a payoff quote, ask when their title will be released after paying off, or ask for the military rate cap; the setting varies with the tier, with whether the contract is current, a few days late or deep in delinquency, with the history of earlier returns, waivers, due-date changes and extensions, with the contract and title states, and with whether the borrower holds a second contract.
      The records involved are the contract with its next due date, partial installment credit, principal and fees owed, its money history and its servicing actions, the borrower's signed requests, and the borrower's military service dates; the governing rules are the payment waterfall and status gate in contract_evt_payment_application, the channel fees, card limit and certified-funds restriction in contract_evt_payment_channel_fees, the grace period, lesser-of amount and one-per-installment limit in contract_evt_late_charge, the return reversal and monthly fee cap in contract_evt_returned_payment, the tiered courtesy-waiver allowance in contract_evt_fee_waiver, the tiered installment, delinquency, frequency and shift limits in contract_due_date_change and contract_extension, the payoff formula, funds-clearance and release method in contract_payoff_and_lien_release, and the pre-service, written-request and 180-day conditions in contract_scra_rate_cap, with combined-contract limits in contract_agg_combined_exposure.
      In the natural course of servicing a payment is posted before it can be returned, a fee is assessed before it can be waived or paid, an extension agreement is signed before the extension is applied, and a payoff posts and its funds become final before the lien is released.
      The agent verifies the caller, reads the contract and its history, posts payments, fees, waivers, due-date changes, extensions, quotes, payoffs, lien releases and rate-cap actions as the rules allow, while the borrower alone signs an extension agreement or an SCRA rate-cap request and authorises a payment from their own bank account or card.
      A bankruptcy filing, a request to remove a co-borrower or change the vehicle on the contract, a dispute of the original sale terms with the dealer, or a request to lower the rate or the payment outside the SCRA cap is not covered by any rule and is handed to a human representative as POLICY_NOT_COVERED.
  - name: cpi_insurance_verification_and_force_placement
    claim:
      categories: [cpi]
      event_types: [cpi_proof_verified, cpi_policy_on_file_updated, cpi_marked_compliant, cpi_notice_sent, cpi_premium_charged, cpi_premium_refunded]
    summary: >
      Borrowers call after receiving a lapse notice, a deficient-proof letter or a placement certificate, to send proof of their own insurance, to ask why a premium was added to their contract, or to get force-placed premium refunded; the setting varies with the vehicle-value plan band, the tracking status (pending verification, compliant, in lapse notice or force-placed), the dates of the lapse, the notices and the placement, whether the proof shows continuous coverage or starts later, whether earlier proof was rejected, and whether the contract is active, repossessed, paid off or liquidated.
      The records involved are the tracking record, its proofs, notices, premium billings and refunds, and the contract's status and balance; the governing rules are the acceptance criteria and plan-specific maximum deductible in cpi_evt_proof_verification, the notice schedule in cpi_lapse_notice_schedule, the placement waiting periods and backdating limit in cpi_placement, the plan premium, first-period proration and proof-review hold in cpi_evt_premium_billing, the full, pro-rata and closure refund bases and refund destinations in cpi_cancellation_refund, and the per-contract basis in cpi_agg_multi_vehicle_policy and cpi_plan_assignment.
      In the natural order of the program a lapse is detected and notices are mailed before coverage is placed, premiums are billed only while coverage is placed, and a refund follows only after acceptable proof is verified or the contract leaves servicing.
      The agent reviews proof that arrives through an accepted channel, records the outcome and the policy on file, returns the record to compliance, mails the required notices and computes and issues refunds to the right destination, while only the borrower can obtain and provide their own insurance and its proof.
      Disputes about the borrower's own insurer's coverage decisions, claims under the force-placed coverage itself, requests to keep force-placed coverage instead of buying insurance, and proof that cannot be obtained through any accepted channel are not covered and are handed off as POLICY_NOT_COVERED.
  - name: recovery_repossession_and_reinstatement
    claim:
      categories: [recovery]
      event_types: [recovery_notice_sent, recovery_expense_posted, recovery_expense_waived, recovery_expense_settled, recovery_reinstatement_quoted, recovery_reinstated, recovery_redeemed, recovery_recalled, recovery_property_released]
    summary: >
      Borrowers call when a repossession is threatened or has happened: to stop an assignment by bringing the account current, to find out what it takes to get the vehicle back, to reinstate or redeem it, to retrieve belongings left inside, or to question repossession, storage and key charges; the setting varies with the collateral class, the case status (pre-repossession review, assigned or recovered), how the vehicle came in, the contract state and its cure-notice period, the dates of the notices, whether the contract was reinstated before, the borrower's military service and the borrower's other contracts.
      The records involved are the repossession case, its notices, expenses, quotes and property records, the contract's past-due installments and fees, and the insurance tracking record; the governing rules are the referral, SCRA, bankruptcy and recall conditions in recovery_assignment, the state cure schedule in recovery_cure_notice, the notice of intent to sell in recovery_evt_recovery_and_noi, the class expense schedule and storage-day count in recovery_evt_expenses, the once-per-contract limit, earliest-sale-date deadline and amount in recovery_reinstatement, the full-payoff redemption in recovery_redemption, the proceeds order in recovery_disposition, and the hold period in recovery_personal_property, with every case of a contract read together under recovery_agg_contract_history.
      In the natural course of a case a cure notice runs out before assignment, the vehicle is recovered before the notice of intent to sell is mailed, expenses are posted before they are settled, and reinstatement or redemption must come before the earliest sale date or the sale.
      The agent quotes reinstatement and redemption, posts and corrects expenses, mails notices, recalls cases that qualify, records reinstatement, redemption and property releases and settles expenses, while only the borrower can pay the reinstatement or redemption amount from their own funds, provide their own insurance proof and claim their personal property.
      Allegations that the agency breached the peace or damaged the vehicle, disputes of a recovery that the borrower says was wrongful, a bankruptcy filed after the sale, or a demand to return a vehicle already sold are not covered and are handed off as POLICY_NOT_COVERED.
  - name: deficiency_balance_resolution
    claim:
      categories: [deficiency]
      event_types: [deficiency_payment_posted, deficiency_payment_returned, deficiency_credit_applied, deficiency_account_update, deficiency_plan_started, deficiency_settlement_started, deficiency_settled, deficiency_settlement_waiver, deficiency_paid_in_full]
    summary: >
      Borrowers whose repossessed vehicle was sold call about the balance left over: to understand how it was calculated, to pay it, to set up a payment plan, to ask for a settlement, or to make sure a GAP, service-contract or insurance refund was credited; the setting varies with the resolution band, the account status (open, on a plan, on a settlement or referred), the time since opening, the history of broken arrangements and returned payments, documented hardship, and refunds still owed by other products.
      The records involved are the deficiency account, its payments, returns, credits and settlement forgiveness, its arrangement offers, and the recovery case and contract that produced it; the governing rules are the opening composition and explanation-before-demand condition in deficiency_opening, the posting status gate and fee-free returns in deficiency_evt_payments, the accepted credit sources in deficiency_evt_credits, the band minimum payment, term and restart conditions in deficiency_payment_plan, the band minimum settlement percents, floor, hardship discount, offer validity and Form 1099-C threshold in deficiency_settlement, and the paid-in-full and agency referral conditions in deficiency_closure_and_referral, with each account resolved separately under deficiency_agg_separate_resolution.
      In the natural course of an account the post-sale explanation precedes any demand or offer, an offer is made before the borrower accepts it, an accepted arrangement starts before payments count toward it, and a settlement is completed only when its payments reach the agreed amount.
      The agent explains the balance, posts payments, returns and credits, makes offers within the band limits, starts accepted plans and settlements and closes completed ones, while only the borrower can accept a plan or settlement offer and authorise a payment from their own account.
      A dispute that the sale was not commercially reasonable, a request to settle below the band authority, an account already referred to an outside agency, an account past the statute of limitations, or a bankruptcy filing is not covered and is handed off as POLICY_NOT_COVERED.
  - name: gap_waiver_cancellations_and_claims
    claim:
      categories: [gap]
      event_types: [gap_claim_filed, gap_claim_opened, gap_claim_withdrawn, gap_claim_decided, gap_cancelled, gap_refund_issued]
    summary: >
      Borrowers with a GAP waiver addendum call after a total loss or theft to file a claim or ask about its decision, after paying off or refinancing to ask for their refund, or simply to cancel the addendum; the setting varies with the plan, the addendum status, the time since the contract date and the free-look period, the reason for cancellation, the scheduled balance and loan-to-value at the date of loss, the primary insurer's settlement and deductible, any service contract or force-placed premium on the same contract, and the contract's status when the refund is issued.
      The records involved are the addendum, its claims, decisions and refunds, the borrower's cancellation requests, the contract and its history, the service contract on the same contract and the insurance tracking record; the governing rules are the status gate, reporting deadline, denial order and benefit computation with plan caps and deductible coverage in gap_claim_benefit, the add-on exclusions in gap_agg_contract_portfolio, the signed-request conditions in gap_voluntary_cancellation, the company-initiated cancellations in gap_company_cancellation, the free-look, pro-rata, plan fee and payoff-fee waiver rules and refund destinations in gap_cancellation_refund, and the original-maturity end of coverage in gap_expiry.
      In the natural course of the product a claim is reported before it is decided, an addendum is cancelled before its refund is issued, and a voluntary cancellation request is signed before it is processed.
      The agent records claims, decisions, withdrawals, cancellations and refunds and routes each refund to the contract, the deficiency account or the borrower, while only the borrower can sign a voluntary cancellation request and supply the primary insurer's settlement documents.
      Disputes with the primary insurer's valuation, requests to move the addendum to a replacement vehicle, claims for losses that are not total losses, and appeals of a denial with new evidence are not covered and are handed off as POLICY_NOT_COVERED.
