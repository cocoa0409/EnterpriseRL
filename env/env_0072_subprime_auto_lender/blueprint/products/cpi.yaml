# ---- data flow ----
events:
  - type: cpi_tracking_opened
    target: cpi_coverages
    mutation: create
    meaning: "An insurance tracking record is opened for a contract when it is booked."
    grain: "one row per contract tracking record"
    fields:
      customer_id: "the borrower"
      contract_id: "the tracked contract"
      variant_name: "the plan band for the vehicle's value"
      opened_date: "date tracking began"
      vehicle_acv_usd: "vehicle value used for the plan band"
      premium_billed_usd: "set to 0.00"
    triggers: []
  - type: cpi_proof_verified
    target: cpi_activities
    meaning: "Evidence of the borrower's own insurance is reviewed and accepted or rejected against the contract's insurance requirement."
    grain: "one row per proof reviewed"
    distinguish_by: [policy_number, policy_effective_date, activity_date]
    fields:
      activity_date: "review date"
      insurer_name: "insurer named on the proof"
      policy_number: "policy or binder number on the proof"
      policy_effective_date: "date the proved coverage starts"
      policy_expiration_date: "date the proved coverage ends"
      comprehensive_deductible_usd: "comprehensive deductible shown"
      collision_deductible_usd: "collision deductible shown"
      lienholder_listed: "whether the proof shows the company as lienholder and loss payee"
      verification_source: "how the proof arrived"
      proof_result: "outcome of the review"
    triggers:
      - event: cpi:cpi_policy_on_file_updated
        when: {proof_result: accepted}
        map: {insurer_name: insurer_name, policy_number: policy_number, policy_expiration_date: policy_expiration_date}
      - event: cpi:cpi_notice_sent
        when: {proof_result: {not: accepted}}
        map: {notice_type: deficient_proof_notice}
  - type: cpi_lapse_detected
    target: cpi_coverages
    mutation: {transition: [{from: pending_verification, to: lapse_notice}, {from: compliant, to: lapse_notice}]}
    meaning: "A lapse in the borrower's required coverage is established from an insurer notice, an expiry with no renewal or the absence of initial proof."
    grain: "one row per transaction"
    fields:
      status: "set to lapse_notice"
      lapse_date: "first day without acceptable coverage"
    triggers:
      - event: cpi:cpi_notice_sent
        map: {notice_type: first_lapse_notice}
  - type: cpi_notice_sent
    target: cpi_activities
    meaning: "A required insurance notice is mailed to the borrower."
    grain: "one row per notice mailed"
    distinguish_by: [notice_type, activity_date]
    fields:
      activity_date: "mailing date"
      notice_type: "which notice was mailed"
    triggers: []
  - type: cpi_placed
    target: cpi_coverages
    mutation: {transition: {from: lapse_notice, to: force_placed}}
    meaning: "Collateral protection insurance is placed on the vehicle after the notice schedule has run."
    grain: "one row per transaction"
    fields:
      status: "set to force_placed"
      variant_name: "plan band for the vehicle's value on the placement date"
      vehicle_acv_usd: "vehicle value on the placement date"
      placement_effective_date: "date placed coverage starts"
    triggers:
      - event: cpi:cpi_notice_sent
        map: {notice_type: placement_notice}
      - event: cpi:cpi_premium_charged
  - type: cpi_premium_charged
    target: cpi_activities
    meaning: "A monthly premium for placed coverage is charged for one billing period."
    grain: "one row per billing period and billing method"
    distinguish_by: [billing_period_start, billing_method]
    fields:
      activity_date: "billing date"
      billing_period_start: "first day of the billed period"
      billing_period_end: "last day of the billed period"
      amount_usd: "premium for the period"
      billing_method: "whether the premium reaches the contract balance or is held for proof review"
    account: cpi_premium_net
    direction: in
    triggers:
      - event: contract:contract_ancillary_charge
        when: {billing_method: added_to_contract_balance}
        map: {txn_date: activity_date, amount_usd: amount_usd, ancillary_source: cpi_premium, source_record_id: cpi_activity_id}
  - type: cpi_premium_refunded
    target: cpi_activities
    meaning: "Premium charged for a billing period is refunded in whole or in part."
    grain: "one row per refunded premium charge"
    distinguish_by: [related_activity_id]
    fields:
      activity_date: "refund date"
      amount_usd: "refund amount"
      related_activity_id: "the premium charge being refunded"
      refund_basis: "why and how the refund was computed"
      refund_disposition: "where the refund went"
    account: cpi_premium_net
    direction: out
    triggers:
      - event: contract:contract_ancillary_credit
        when: {refund_disposition: credited_to_contract_balance}
        map: {txn_date: activity_date, amount_usd: amount_usd, ancillary_source: cpi_refund, source_record_id: cpi_activity_id}
      - event: deficiency:deficiency_credit_applied
        when: {refund_disposition: credited_to_deficiency_balance}
        map: {txn_date: activity_date, amount_usd: amount_usd, credit_source: cpi_refund, source_record_id: cpi_activity_id}
  - type: cpi_marked_compliant
    target: cpi_coverages
    mutation: {transition: [{from: pending_verification, to: compliant}, {from: lapse_notice, to: compliant}, {from: force_placed, to: compliant}]}
    meaning: "Accepted proof brings the tracking record into compliance and, on a force-placed record, cancels the placed coverage."
    grain: "one row per transaction"
    fields:
      status: "set to compliant"
      lapse_date: "cleared to empty"
      placement_effective_date: "cleared to empty"
    triggers: []
  - type: cpi_tracking_closed
    target: cpi_coverages
    mutation: {transition: [{from: pending_verification, to: closed}, {from: compliant, to: closed}, {from: lapse_notice, to: closed}, {from: force_placed, to: closed}]}
    meaning: "Tracking ends because the contract has left active servicing."
    grain: "one row per transaction"
    fields:
      status: "set to closed"
      closed_date: "date tracking ended (the contract's closed_date)"
    triggers: []
  - type: cpi_policy_on_file_updated
    target: cpi_coverages
    mutation: update
    meaning: "The borrower's accepted insurance policy details are recorded on the tracking record."
    grain: "one row per transaction"
    fields:
      insurer_name: "insurer on the latest accepted proof"
      policy_number: "policy number on the latest accepted proof"
      policy_expiration_date: "expiration date on the latest accepted proof"
    triggers: []

# ---- derived measures ----
measures:
  - id: cpi_msr_period_days
    window: "one billing period of one cpi_premium_charged row"
    measure: "calendar days from billing_period_start through billing_period_end, both inclusive"
  - id: cpi_msr_refundable_days
    window: "one billing period of one cpi_premium_charged row"
    measure: "calendar days of that billing period falling on or after the refund start date (the accepted proof's policy_effective_date, or the day after the contract's closed_date on closure), both ends inclusive; 0 when the start date is after billing_period_end"
  - id: cpi_msr_unrefunded_charges
    window: "life of the tracking record"
    measure: "the cpi_premium_charged rows of the record that have no cpi_premium_refunded row pointing at them through related_activity_id, with the sum of their amount_usd"

# ---- policies ----
policies:
  - id: cpi_agg_multi_holding
    subject: [cpi_tracking_opened]
    rule: >-
      Insurance tracking is held per contract, not per borrower: every contract booked by the company opens one tracking record on its contract date, so a borrower holds as many tracking records as financed vehicles, without a per-borrower limit.
      A contract never has more than max_open_records_per_contract tracking record that is not closed; a new record is opened only after the previous one closed, for a reinstated contract whose record had closed.
    eligibility: []
    params: {max_per_customer: null}
  - id: cpi_agg_multi_vehicle_policy
    subject: [cpi_proof_verified, cpi_premium_charged]
    rule: >-
      Where multi_vehicle_policy_accepted is true, one borrower insurance policy listing several financed VINs satisfies each listed contract's requirement, but it is reviewed and recorded separately on each tracking record, and a VIN missing from the policy leaves that contract's record unsatisfied.
      Placed coverage, premiums and refunds belong to one tracking record and one contract only; premiums of different records are never combined, netted or billed to another contract, and a placement on one contract does not change the status of the borrower's other records.
    eligibility: []
  - id: cpi_plan_assignment
    subject: [cpi_tracking_opened, cpi_placed]
    rule: >-
      A tracking record is opened in the plan whose vehicle value band (entry_gate) contains the vehicle's value, and on placement the plan is set again from the band containing the acv_source value on the placement date.
      The plan fixes the placed coverage's monthly_premium_usd, cpi_deductible_usd and max_coverage_usd, and the deductible the borrower's own policy may carry (borrower_max_deductible_usd).
      Placed coverage is coverage_type single-interest physical damage protecting only the company's interest in the vehicle: it never provides liability coverage or any coverage for the borrower (provides_liability_coverage), and the borrower remains free to buy their own insurance from any insurer at any time.
      The band is reassessed only at renewal, band_reassessment_months after placement; a change in value during a placement term never changes the plan mid-term.
      No fee is charged for tracking (cpi_tracking_fee_usd).
    eligibility: []
    params:
      per_tier:
        CollateralGuard Plan A: {monthly_premium_usd: "=monthly_premium_usd", cpi_deductible_usd: "=cpi_deductible_usd", max_coverage_usd: "=max_coverage_usd", borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan B: {monthly_premium_usd: "=monthly_premium_usd", cpi_deductible_usd: "=cpi_deductible_usd", max_coverage_usd: "=max_coverage_usd", borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan C: {monthly_premium_usd: "=monthly_premium_usd", cpi_deductible_usd: "=cpi_deductible_usd", max_coverage_usd: "=max_coverage_usd", borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan D: {monthly_premium_usd: "=monthly_premium_usd", cpi_deductible_usd: "=cpi_deductible_usd", max_coverage_usd: "=max_coverage_usd", borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan E: {monthly_premium_usd: "=monthly_premium_usd", cpi_deductible_usd: "=cpi_deductible_usd", max_coverage_usd: "=max_coverage_usd", borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan F: {monthly_premium_usd: "=monthly_premium_usd", cpi_deductible_usd: "=cpi_deductible_usd", max_coverage_usd: "=max_coverage_usd", borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
  - id: cpi_evt_proof_verification
    subject: [cpi_proof_verified, cpi_marked_compliant, cpi_policy_on_file_updated]
    rule: >-
      Proof is reviewed only on a tracking record that is not closed.
      Proof is accepted (proof_result accepted) only when it arrives through one of the accepted_verification_sources and shows every one of required_coverages on the contract's exact VIN (vin_match_required), a named insured matching named_insured_rule, the company listed as lienholder and loss payee (lienholder_listing_required) with the loss_payee_clause wording, comprehensive and collision deductibles no higher than the plan's borrower_max_deductible_usd, and a policy_expiration_date at least min_days_to_expiration_at_verification days after the review date.
      A binder is accepted only when binder_accepted is true and the binder period is no longer than binder_max_days.
      Otherwise the proof is rejected with the first failing reason in this order: rejected_no_physical_damage, rejected_vin_mismatch, rejected_named_insured, rejected_no_lienholder, rejected_deductible_too_high, rejected_binder_term, rejected_expiring; proof that does not arrive through an accepted source is not reviewed at all; a deficient-proof notice is mailed within deficient_proof_notice_days and the record's status does not change.
      An accepted proof always updates the policy details on file; on a record in pending_verification, lapse_notice or force_placed status it also returns the record to compliant, and on a force_placed record that return cancels the placed coverage, after which refunds follow cpi_cancellation_refund and a cancellation notice is mailed within cancellation_notice_days.
      An insurer's reinstatement of the borrower's policy with no gap counts as continuous coverage when retroactive_reinstatement_accepted is true.
      A borrower's statement that they are insured, without proof through an accepted source, never changes a record.
    eligibility:
      - id: proof_record_open
        applies_to: [cpi_proof_verified]
        kind: state
        condition: "Proof is reviewed only on a tracking record that is not closed."
        evidence_fields: [cpi_coverages.status, cpi_coverages.cpi_coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cpi_coverages.cpi_coverage_id]]
          action_bindings: {cpi_coverages.cpi_coverage_id: cpi_coverage_id}
        state_contract:
          field: cpi_coverages.status
          allowed: [pending_verification, compliant, lapse_notice, force_placed]
    params:
      per_tier:
        CollateralGuard Plan A: {borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan B: {borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan C: {borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan D: {borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan E: {borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
        CollateralGuard Plan F: {borrower_max_deductible_usd: "=borrower_max_deductible_usd"}
  - id: cpi_lapse_notice_schedule
    subject: [cpi_lapse_detected, cpi_notice_sent]
    rule: >-
      A lapse is established only by one of coverage_lapse_sources: an insurer cancellation or non-renewal notice, a policy expiration with no renewal proof, or no acceptable proof within initial_proof_days after funding; lapse_date is the first day without acceptable coverage.
      The first lapse notice is mailed within first_notice_max_days_after_lapse_detection after the lapse is detected.
      A second lapse notice may be mailed only when its mailing date is at least second_notice_days_after_first after the first lapse notice was mailed.
      That interval is counted in calendar days from the activity_date of the first_lapse_notice, and a mailing exactly on the boundary qualifies.
      Notices go by notice_delivery_method to the mailing address on file, with an email copy when notice_email_copy is true and an email is on file; each lapse notice states the plan's monthly premium and deductible (notice_includes_cost_estimate), that placed coverage protects only the company, and how to send proof.
      Lapse notices are mailed only on a record in lapse_notice status, placement notices only on a force_placed record, and deficient-proof and cancellation notices on any record that is not closed.
    eligibility:
      - id: notice_record_open
        applies_to: [cpi_notice_sent]
        kind: state
        condition: "Lapse notices are mailed only on a record in lapse_notice status, placement notices only on a force_placed record, and deficient-proof and cancellation notices on any record that is not closed."
        evidence_fields: [cpi_coverages.status, cpi_coverages.cpi_coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cpi_coverages.cpi_coverage_id]]
          action_bindings: {cpi_coverages.cpi_coverage_id: cpi_coverage_id}
        state_contract:
          field: cpi_coverages.status
          allowed: [pending_verification, compliant, lapse_notice, force_placed]
      - id: second_notice_spacing
        applies_to: [cpi_notice_sent]
        kind: time
        condition: "A second lapse notice may be mailed only when its mailing date is at least second_notice_days_after_first after the first lapse notice was mailed."
        evidence_fields: [cpi_activities.activity_date, cpi_activities.notice_type, cpi_activities.cpi_coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cpi_activities.cpi_coverage_id]]
          action_bindings: {cpi_activities.cpi_coverage_id: cpi_coverage_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the first lapse notice was mailed"
          anchor_source: cpi_activities.activity_date
          relation: not_before
          duration_source: variants.second_notice_days_after_first
          unit: calendar_days
          counting_rule: "That interval is counted in calendar days from the activity_date of the first_lapse_notice, and a mailing exactly on the boundary qualifies."
          boundary: inclusive
  - id: cpi_placement
    subject: [cpi_placed]
    rule: >-
      Coverage may be placed only when the placement date is at least placement_min_days_after_first_notice after the first lapse notice was mailed.
      That period is counted in calendar days from the activity_date of the record's latest first_lapse_notice, and placement exactly on the boundary qualifies.
      Coverage may be placed only when the placement date is also at least placement_min_days_after_second_notice after the second lapse notice was mailed.
      This second period is counted in calendar days from the activity_date of the record's latest second_lapse_notice, and placement exactly on the boundary qualifies.
      Placement requires that both notices were mailed for the current lapse, that no acceptable proof was verified after the first notice, and that the contract status is active.
      The coverage effective date (placement_effective_date) is the later of lapse_date and the placement date minus placement_backdate_max_days calendar days; coverage is never backdated further, so no premium is ever charged for a day more than placement_backdate_max_days before the placement date.
      Placement runs for cpi_term_months and renews for another term on the same day unless acceptable proof is verified first; a renewal does not need new notices (renewal_requires_new_notices).
      A placement notice and certificate stating the effective date, plan, premium and deductible is mailed within placement_notice_days after placement.
    eligibility:
      - id: placement_after_first_notice
        applies_to: [cpi_placed]
        kind: time
        condition: "Coverage may be placed only when the placement date is at least placement_min_days_after_first_notice after the first lapse notice was mailed."
        evidence_fields: [cpi_activities.activity_date, cpi_activities.notice_type, cpi_activities.cpi_coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cpi_activities.cpi_coverage_id]]
          action_bindings: {cpi_activities.cpi_coverage_id: cpi_coverage_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the first lapse notice was mailed"
          anchor_source: cpi_activities.activity_date
          relation: not_before
          duration_source: variants.placement_min_days_after_first_notice
          unit: calendar_days
          counting_rule: "That period is counted in calendar days from the activity_date of the record's latest first_lapse_notice, and placement exactly on the boundary qualifies."
          boundary: inclusive
      - id: placement_after_second_notice
        applies_to: [cpi_placed]
        kind: time
        condition: "Coverage may be placed only when the placement date is also at least placement_min_days_after_second_notice after the second lapse notice was mailed."
        evidence_fields: [cpi_activities.activity_date, cpi_activities.notice_type, cpi_activities.cpi_coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cpi_activities.cpi_coverage_id]]
          action_bindings: {cpi_activities.cpi_coverage_id: cpi_coverage_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the second lapse notice was mailed"
          anchor_source: cpi_activities.activity_date
          relation: not_before
          duration_source: variants.placement_min_days_after_second_notice
          unit: calendar_days
          counting_rule: "This second period is counted in calendar days from the activity_date of the record's latest second_lapse_notice, and placement exactly on the boundary qualifies."
          boundary: inclusive
  - id: cpi_evt_premium_billing
    subject: [cpi_premium_charged]
    rule: >-
      Premium is billed only on a tracking record whose status is force_placed.
      Premium is billed monthly in advance (premium_billing_frequency): each billing period starts on the coverage effective date or on a monthly anniversary of the placement date and ends the day before the next anniversary; the first period, which starts on the coverage effective date, is prorated by actual days at monthly_premium_usd x 12 / 365 per day (first_period_proration), and every later full period is billed at monthly_premium_usd of the record's plan.
      No premium is billed for a period that starts while the contract's status is one of premium_billing_excluded_contract_statuses.
      A premium is billed with billing_method added_to_contract_balance, which capitalises it on the contract, except that while borrower-submitted proof received within the last proof_review_hold_days days is still unreviewed the premium is billed with billing_method held_pending_proof_review and does not reach the contract; if that proof is then rejected, the held premium is billed again with billing_method added_to_contract_balance for the same period and the held row is released by a held_premium_release refund, and if it is accepted the held premium is released the same way and refunded under cpi_cancellation_refund for any capitalised periods.
      Premium is earned daily by actual days (premium_earning_basis), every prorated premium is rounded half-up to the cent (premium_rounding), and capitalised premium accrues contract interest (interest_on_capitalized_premium).
    eligibility:
      - id: premium_record_placed
        applies_to: [cpi_premium_charged]
        kind: state
        condition: "Premium is billed only on a tracking record whose status is force_placed."
        evidence_fields: [cpi_coverages.status, cpi_coverages.cpi_coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cpi_coverages.cpi_coverage_id]]
          action_bindings: {cpi_coverages.cpi_coverage_id: cpi_coverage_id}
        state_contract:
          field: cpi_coverages.status
          allowed: [force_placed]
    params:
      per_tier:
        CollateralGuard Plan A: {monthly_premium_usd: "=monthly_premium_usd"}
        CollateralGuard Plan B: {monthly_premium_usd: "=monthly_premium_usd"}
        CollateralGuard Plan C: {monthly_premium_usd: "=monthly_premium_usd"}
        CollateralGuard Plan D: {monthly_premium_usd: "=monthly_premium_usd"}
        CollateralGuard Plan E: {monthly_premium_usd: "=monthly_premium_usd"}
        CollateralGuard Plan F: {monthly_premium_usd: "=monthly_premium_usd"}
    formula:
      first_period_premium: "round(monthly_premium_usd * 12 / 365 * cpi_msr_period_days, 2)"
      full_period_premium: "monthly_premium_usd"
    measures: [cpi_msr_period_days]
  - id: cpi_cancellation_refund
    subject: [cpi_premium_refunded, cpi_tracking_closed]
    rule: >-
      A premium charge can be refunded only once.
      When accepted proof shows coverage effective on or before the CPI coverage effective date with no gap (flat_cancel_if_continuous), every premium charge of the placement is refunded in full (refund_basis full_no_lapse).
      When accepted proof starts after the CPI coverage effective date, each unrefunded charge is refunded for the days of its billing period on or after the proof's policy_effective_date (refund_basis pro_rata_from_proof_effective, partial_refund_basis), and days before that date stay earned.
      Every refund is rounded half-up to the cent (premium_rounding). When the record closes because the contract left active servicing while force_placed, each unrefunded charge is refunded for the days of its billing period after the contract's closed_date (refund_basis pro_rata_from_closure, closure_refund_basis).
      A held premium is released by a held_premium_release refund for its full amount with refund_disposition not_billed_release, because it never reached the contract.
      Refunds of capitalised premium are issued within refund_processing_days and go to the first applicable destination in refund_disposition_order: credited_to_contract_balance when the contract is active, repossessed or charged_off; credited_to_deficiency_balance when the contract is liquidated and its deficiency account is not closed; otherwise mailed_to_borrower by check to the mailing address on file, except that a mailed refund below refund_min_check_usd is not issued.
      A tracking record closes when its contract leaves active servicing (paid_off, unwound, liquidated or charged_off), on the contract's closed_date; a repossessed contract's record stays open but is not billed.
    eligibility:
      - id: one_refund_per_charge
        applies_to: [cpi_premium_refunded]
        kind: dedup
        condition: "A premium charge can be refunded only once."
        evidence_fields: [cpi_activities.related_activity_id, cpi_activities.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cpi_activities.related_activity_id]]
          action_bindings: {cpi_activities.related_activity_id: related_activity_id}
        dedup_contract:
          table: cpi_activities
          mode: separate_record
          object_bindings: {related_activity_id: related_activity_id}
          duplicate_filters: {event_type: [cpi_premium_refunded]}
          distinct_fields: []
    formula:
      full_refund: "amount_usd"
      prorated_refund: "round(amount_usd * cpi_msr_refundable_days / cpi_msr_period_days, 2)"
    measures: [cpi_msr_refundable_days, cpi_msr_period_days, cpi_msr_unrefunded_charges]
