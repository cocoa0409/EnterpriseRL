# ---- data flow ----
events:
  - type: dealer_agreement_signed
    target: dealer_agreements
    mutation: create
    meaning: "A dealership signs the dealer retail agreement and applies for approval."
    grain: "one row per agreement"
    fields:
      customer_id: "the dealership's business profile"
      variant_name: "set to the starting tier"
      agreement_date: "date the agreement was signed"
      dealer_number: "dealer number assigned"
      dealer_state_code: "state of the dealer license"
      holdback_balance_usd: "set to 0.00"
      participation_net_usd: "set to 0.00"
    triggers: []
  - type: dealer_contract_funded
    target: dealer_transactions
    meaning: "The company funds the dealer for a purchased contract, withholding holdbacks and deducting the acquisition fee."
    grain: "one row per funded contract"
    distinguish_by: [contract_id]
    fields:
      contract_id: "the purchased contract"
      txn_date: "funding date"
      amount_usd: "holdback withheld (stip plus title holdback); the delta booked to dealer_holdback"
      net_funding_usd: "net amount sent to the dealer"
      acquisition_fee_usd: "acquisition fee deducted"
    account: dealer_holdback
    direction: in
    triggers:
      - event: contract:contract_funded
      - event: dealer:dealer_participation_paid
        map: {contract_id: contract_id, txn_date: txn_date, participation_kind: contract_participation}
  - type: dealer_holdback_released
    target: dealer_transactions
    meaning: "A holdback is released to the dealer or forfeited."
    grain: "one row per holdback type per contract"
    distinguish_by: [contract_id, holdback_type]
    fields:
      contract_id: "the funded contract"
      txn_date: "release or forfeiture date"
      amount_usd: "holdback released or forfeited"
      holdback_type: "stipulation or title holdback"
      release_reason: "released after the condition was met, or forfeited"
    account: dealer_holdback
    direction: out
    triggers: []
  - type: dealer_title_received
    target: dealer_transactions
    meaning: "The title or ELT confirmation naming the company as lienholder is received from the dealer."
    grain: "one row per contract title"
    distinguish_by: [contract_id]
    fields:
      contract_id: "the funded contract"
      txn_date: "date the title was received"
    triggers: []
  - type: dealer_participation_paid
    target: dealer_transactions
    meaning: "Dealer participation for a purchased contract, or a quarterly volume bonus, is paid."
    grain: "one row per contract participation or per quarterly bonus"
    distinguish_by: [contract_id, participation_kind, txn_date]
    fields:
      contract_id: "the contract (empty for a volume bonus)"
      txn_date: "payment date"
      amount_usd: "amount paid"
      participation_kind: "contract participation or volume bonus"
    account: dealer_participation
    direction: in
    triggers: []
  - type: dealer_participation_chargeback
    target: dealer_transactions
    meaning: "Participation on a contract is charged back after an early payoff, early default or unwind."
    grain: "one row per contract per chargeback reason"
    distinguish_by: [contract_id, chargeback_reason]
    fields:
      contract_id: "the contract"
      txn_date: "chargeback date"
      amount_usd: "amount charged back"
      chargeback_reason: "why participation is charged back"
      chargeback_pct: "share of the participation charged back, percent"
    account: dealer_participation
    direction: out
    triggers: []
  - type: dealer_tier_reviewed
    target: dealer_agreements
    mutation: update
    meaning: "A quarterly review sets the dealer's program tier."
    grain: "one row per transaction"
    fields:
      variant_name: "tier after the review"
      last_tier_review_date: "review date"
    triggers: []
  - type: dealer_approved
    target: dealer_agreements
    mutation: {transition: {from: pending_approval, to: active}}
    meaning: "The agreement is approved and funding opens."
    grain: "one row per transaction"
    fields: {status: "set to active"}
    triggers: []
  - type: dealer_placed_on_watch
    target: dealer_agreements
    mutation: {transition: {from: active, to: on_watch}}
    meaning: "The dealer is placed on watch."
    grain: "one row per transaction"
    fields: {status: "set to on_watch", status_reason: "watch threshold crossed"}
    triggers: []
  - type: dealer_watch_cleared
    target: dealer_agreements
    mutation: {transition: {from: on_watch, to: active}}
    meaning: "The watch review clears the dealer."
    grain: "one row per transaction"
    fields: {status: "set to active", status_reason: "set to none"}
    triggers: []
  - type: dealer_suspended
    target: dealer_agreements
    mutation: {transition: [{from: active, to: suspended}, {from: on_watch, to: suspended}]}
    meaning: "Funding of new contracts is suspended."
    grain: "one row per transaction"
    fields: {status: "set to suspended", status_reason: "suspension trigger"}
    triggers: []
  - type: dealer_reinstated
    target: dealer_agreements
    mutation: {transition: {from: suspended, to: active}}
    meaning: "A suspended dealer is reinstated."
    grain: "one row per transaction"
    fields: {status: "set to active", status_reason: "set to none"}
    triggers: []
  - type: dealer_terminated
    target: dealer_agreements
    mutation: {transition: [{from: pending_approval, to: terminated}, {from: active, to: terminated}, {from: on_watch, to: terminated}, {from: suspended, to: terminated}]}
    meaning: "The agreement ends."
    grain: "one row per transaction"
    fields: {status: "set to terminated", status_reason: "termination trigger", closed_date: "termination date"}
    triggers: []

# ---- derived measures ----
measures:
  - id: dealer_msr_funded_90d
    window: "90 calendar days ending on the review date, inclusive"
    measure: "count of dealer_contract_funded rows of the agreement"
  - id: dealer_msr_fpd_rate_90d
    window: "contracts funded in the 90 calendar days ending 60 days before the review date"
    measure: "percent of those contracts whose first installment was not paid within first_payment_default_days of its due date"
  - id: dealer_msr_title_delinquent_count
    window: "point in time at the frozen date"
    measure: "count of the agreement's funded contracts with no dealer_title_received row whose contract date plus title_delivery_deadline_days is earlier than the frozen date"

# ---- policies ----
policies:
  - id: dealer_agg_multi_holding
    subject: [dealer_agreement_signed]
    rule: >-
      A dealership business holds a single dealer retail agreement (max_open_agreements_per_dealer); a dealer group with several rooftops signs one agreement per licensed dealership business, each with its own customer profile and dealer number.
    eligibility: []
    params: {max_per_customer: 1}
  - id: dealer_onboarding
    subject: [dealer_agreement_signed, dealer_approved, dealer_terminated]
    rule: >-
      A dealership is approved only when every item of approval_requirements is on file, including a current state dealer license (dealer_license_required); it starts at starting_tier.
      Either party may end the agreement without cause on termination_notice_days written notice, and the agreement is terminated at once on any of termination_triggers.
      Termination stops new fundings but never cancels chargebacks or holdbacks already owed on funded contracts, which are settled under their own rules.
    eligibility: []
  - id: dealer_evt_funding
    subject: [dealer_contract_funded]
    rule: >-
      A contract is funded only to a dealer whose agreement status is active or on_watch.
      The company funds only contracts whose credit tier is in the dealer tier's eligible_contract_tiers, within funding_turnaround_business_days of a complete package, by funding_method.
      Net funding is the amount financed less the tier's acquisition_fee_usd, less stip_holdback_usd and title_holdback_usd, plus the contract participation (funding_formula); the holdbacks are booked as holdback on the agreement.
      Funding a contract activates it for servicing.
      The company does not fund a contract whose add-on products were sold above the company price list (max_add_on_markup_pct) or without the optional-product disclosure (add_on_disclosure_required); a spot-delivered deal not yet funded may be unwound by the dealer within spot_delivery_unwind_days.
    eligibility:
      - id: funding_dealer_status
        applies_to: [dealer_contract_funded]
        kind: state
        condition: "A contract is funded only to a dealer whose agreement status is active or on_watch."
        evidence_fields: [dealer_agreements.status, dealer_agreements.dealer_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dealer_agreements.dealer_agreement_id]]
          action_bindings: {dealer_agreements.dealer_agreement_id: dealer_agreement_id}
        state_contract:
          field: dealer_agreements.status
          allowed: [active, on_watch]
    params:
      per_tier:
        Dealer Program Bronze: {acquisition_fee_usd: "=acquisition_fee_usd", stip_holdback_usd: "=stip_holdback_usd", title_holdback_usd: "=title_holdback_usd", eligible_contract_tiers: "=eligible_contract_tiers"}
        Dealer Program Silver: {acquisition_fee_usd: "=acquisition_fee_usd", stip_holdback_usd: "=stip_holdback_usd", title_holdback_usd: "=title_holdback_usd", eligible_contract_tiers: "=eligible_contract_tiers"}
        Dealer Program Gold: {acquisition_fee_usd: "=acquisition_fee_usd", stip_holdback_usd: "=stip_holdback_usd", title_holdback_usd: "=title_holdback_usd", eligible_contract_tiers: "=eligible_contract_tiers"}
        Dealer Program Platinum: {acquisition_fee_usd: "=acquisition_fee_usd", stip_holdback_usd: "=stip_holdback_usd", title_holdback_usd: "=title_holdback_usd", eligible_contract_tiers: "=eligible_contract_tiers"}
        Dealer Program Diamond: {acquisition_fee_usd: "=acquisition_fee_usd", stip_holdback_usd: "=stip_holdback_usd", title_holdback_usd: "=title_holdback_usd", eligible_contract_tiers: "=eligible_contract_tiers"}
        Dealer Program Elite: {acquisition_fee_usd: "=acquisition_fee_usd", stip_holdback_usd: "=stip_holdback_usd", title_holdback_usd: "=title_holdback_usd", eligible_contract_tiers: "=eligible_contract_tiers"}
  - id: dealer_evt_holdbacks
    subject: [dealer_holdback_released, dealer_title_received]
    rule: >-
      Each holdback type on a contract is released or forfeited once.
      The stip holdback is released within holdback_release_business_days after the post-funding stipulations are cleared, and is forfeited when they are not cleared within post_funding_stip_deadline_days after funding.
      The title holdback is released within holdback_release_business_days after the title or ELT confirmation naming the company as lienholder is received, and is forfeited when it is not received within holdback_forfeit_days after funding.
      A title received after title_delivery_deadline_days from the contract date still counts toward the dealer's title delinquency until it arrives (dealer_msr_title_delinquent_count).
    eligibility:
      - id: one_release_per_holdback
        applies_to: [dealer_holdback_released]
        kind: dedup
        condition: "Each holdback type on a contract is released or forfeited once."
        evidence_fields: [dealer_transactions.contract_id, dealer_transactions.holdback_type, dealer_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dealer_transactions.contract_id, dealer_transactions.holdback_type]]
          action_bindings: {dealer_transactions.contract_id: contract_id, dealer_transactions.holdback_type: holdback_type}
        dedup_contract:
          table: dealer_transactions
          mode: separate_record
          object_bindings: {contract_id: contract_id, holdback_type: holdback_type}
          duplicate_filters: {event_type: [dealer_holdback_released]}
          distinct_fields: []
    measures: [dealer_msr_title_delinquent_count]
  - id: dealer_evt_participation
    subject: [dealer_participation_paid]
    rule: >-
      Contract participation of participation_flat_usd for the dealer's tier on the funding date is paid with the initial funding (participation_payment_timing).
      After each quarterly tier review a volume bonus of volume_bonus_per_contract_usd of the reviewed tier for every contract funded in the quarter is paid within volume_bonus_payment_days; a suspended or terminated dealer earns no bonus for that quarter.
    eligibility: []
    params:
      per_tier:
        Dealer Program Bronze: {participation_flat_usd: "=participation_flat_usd", volume_bonus_per_contract_usd: "=volume_bonus_per_contract_usd"}
        Dealer Program Silver: {participation_flat_usd: "=participation_flat_usd", volume_bonus_per_contract_usd: "=volume_bonus_per_contract_usd"}
        Dealer Program Gold: {participation_flat_usd: "=participation_flat_usd", volume_bonus_per_contract_usd: "=volume_bonus_per_contract_usd"}
        Dealer Program Platinum: {participation_flat_usd: "=participation_flat_usd", volume_bonus_per_contract_usd: "=volume_bonus_per_contract_usd"}
        Dealer Program Diamond: {participation_flat_usd: "=participation_flat_usd", volume_bonus_per_contract_usd: "=volume_bonus_per_contract_usd"}
        Dealer Program Elite: {participation_flat_usd: "=participation_flat_usd", volume_bonus_per_contract_usd: "=volume_bonus_per_contract_usd"}
  - id: dealer_evt_chargebacks
    subject: [dealer_participation_chargeback]
    rule: >-
      A contract's participation is charged back at most once per chargeback reason, and the total charged back on a contract never exceeds chargeback_max_per_contract_pct of the participation paid on it.
      A payoff (including a refinance payoff, refinance_payoff_chargeback) within chargeback_full_payoff_days of the contract date charges back all of it (early_payoff); a payoff later but within chargeback_partial_payoff_days charges back chargeback_partial_pct.
      A repossession or charge-off within chargeback_early_default_days of the contract date charges back all of it (early_default); a first installment not paid within first_payment_default_days of its due date charges back the tier's first_payment_default_chargeback_pct (first_payment_default); an unwind charges back unwind_chargeback_pct (contract_unwound).
      When several reasons apply to one contract, the one with the highest percent is charged and the others are not, so the cap is never exceeded.
      Chargebacks are collected by chargeback_offset_method, invoiced after chargeback_invoice_days without a funding.
    eligibility:
      - id: one_chargeback_per_reason
        applies_to: [dealer_participation_chargeback]
        kind: dedup
        condition: "A contract's participation is charged back at most once per chargeback reason, and the total charged back on a contract never exceeds chargeback_max_per_contract_pct of the participation paid on it."
        evidence_fields: [dealer_transactions.contract_id, dealer_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dealer_transactions.contract_id]]
          action_bindings: {dealer_transactions.contract_id: contract_id}
        dedup_contract:
          table: dealer_transactions
          mode: separate_record
          object_bindings: {contract_id: contract_id}
          duplicate_filters: {event_type: [dealer_participation_chargeback]}
          distinct_fields: [chargeback_reason]
    params:
      per_tier:
        Dealer Program Bronze: {first_payment_default_chargeback_pct: "=first_payment_default_chargeback_pct"}
        Dealer Program Silver: {first_payment_default_chargeback_pct: "=first_payment_default_chargeback_pct"}
        Dealer Program Gold: {first_payment_default_chargeback_pct: "=first_payment_default_chargeback_pct"}
        Dealer Program Platinum: {first_payment_default_chargeback_pct: "=first_payment_default_chargeback_pct"}
        Dealer Program Diamond: {first_payment_default_chargeback_pct: "=first_payment_default_chargeback_pct"}
        Dealer Program Elite: {first_payment_default_chargeback_pct: "=first_payment_default_chargeback_pct"}
  - id: dealer_tier_review
    subject: [dealer_tier_reviewed]
    rule: >-
      Every tier_review_frequency_months months the dealer's tier is set from tier_review_basis: the dealer moves up one tier when its funded contracts (dealer_msr_funded_90d) and first-payment default rate (dealer_msr_fpd_rate_90d) meet the next tier's entry_gate and it has had no watch or suspension status for tier_upgrade_clean_days, and moves down one tier when it falls below its tier's min_contracts_per_review_retention or above its tier's first-payment default limit; it never moves more than tier_change_max_steps tier at one review.
      A tier change applies to contracts funded after the review date only.
    eligibility: []
    params:
      per_tier:
        Dealer Program Bronze: {min_contracts_per_review_retention: "=min_contracts_per_review_retention"}
        Dealer Program Silver: {min_contracts_per_review_retention: "=min_contracts_per_review_retention"}
        Dealer Program Gold: {min_contracts_per_review_retention: "=min_contracts_per_review_retention"}
        Dealer Program Platinum: {min_contracts_per_review_retention: "=min_contracts_per_review_retention"}
        Dealer Program Diamond: {min_contracts_per_review_retention: "=min_contracts_per_review_retention"}
        Dealer Program Elite: {min_contracts_per_review_retention: "=min_contracts_per_review_retention"}
    measures: [dealer_msr_funded_90d, dealer_msr_fpd_rate_90d]
  - id: dealer_performance_status
    subject: [dealer_placed_on_watch, dealer_watch_cleared, dealer_suspended, dealer_reinstated]
    rule: >-
      An active dealer is placed on watch when its trailing first-payment default rate reaches watch_fpd_rate_pct or its title-delinquent contracts reach watch_title_delinquent_count; a dealer on watch is reviewed after watch_review_days and cleared when both measures are below the watch thresholds, otherwise suspended.
      A dealer is suspended at once on any of suspension_triggers, including title-delinquent contracts reaching suspend_title_delinquent_count; a suspended dealer receives no new fundings, and is reinstated only when every item of reinstatement_requirements is met, reviewed within suspension_review_days.
      Watch and suspension never affect servicing of contracts already funded, and the dealer support line answers dealers during dealer_contact_hours; a borrower complaint forwarded to a dealer must be answered within complaint_response_business_days.
    eligibility: []
    params:
      per_tier:
        Dealer Program Bronze: {watch_fpd_rate_pct: "=watch_fpd_rate_pct", watch_title_delinquent_count: "=watch_title_delinquent_count", suspend_title_delinquent_count: "=suspend_title_delinquent_count"}
        Dealer Program Silver: {watch_fpd_rate_pct: "=watch_fpd_rate_pct", watch_title_delinquent_count: "=watch_title_delinquent_count", suspend_title_delinquent_count: "=suspend_title_delinquent_count"}
        Dealer Program Gold: {watch_fpd_rate_pct: "=watch_fpd_rate_pct", watch_title_delinquent_count: "=watch_title_delinquent_count", suspend_title_delinquent_count: "=suspend_title_delinquent_count"}
        Dealer Program Platinum: {watch_fpd_rate_pct: "=watch_fpd_rate_pct", watch_title_delinquent_count: "=watch_title_delinquent_count", suspend_title_delinquent_count: "=suspend_title_delinquent_count"}
        Dealer Program Diamond: {watch_fpd_rate_pct: "=watch_fpd_rate_pct", watch_title_delinquent_count: "=watch_title_delinquent_count", suspend_title_delinquent_count: "=suspend_title_delinquent_count"}
        Dealer Program Elite: {watch_fpd_rate_pct: "=watch_fpd_rate_pct", watch_title_delinquent_count: "=watch_title_delinquent_count", suspend_title_delinquent_count: "=suspend_title_delinquent_count"}
    measures: [dealer_msr_fpd_rate_90d, dealer_msr_title_delinquent_count]
