# Product charter: Dealer Retail Agreements (indirect lending program for selling dealers).
category: dealer
display_name: Dealer Retail Agreements

binding:
  holding_table: dealer_agreements
  event_tables: [dealer_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {holdback_balance_usd: dealer_holdback, participation_net_usd: dealer_participation}

lifecycle:
  states: [pending_approval, active, on_watch, suspended, terminated]
  transitions:
    - {from: pending_approval, to: active, by: system, means: "Dealer onboarding documents are verified and the agreement is approved at the starting tier."}
    - {from: pending_approval, to: terminated, by: system, means: "The application is withdrawn or declined."}
    - {from: active, to: on_watch, by: system, means: "Performance or title delinquency crosses a watch threshold."}
    - {from: on_watch, to: active, by: system, means: "The watch review finds the thresholds met again."}
    - {from: active, to: suspended, by: system, means: "A suspension trigger occurs; new contracts are not funded."}
    - {from: on_watch, to: suspended, by: system, means: "A suspension trigger occurs, or the watch review finds the thresholds still missed."}
    - {from: suspended, to: active, by: agent, means: "Every reinstatement requirement is met and funding resumes."}
    - {from: active, to: terminated, by: system, means: "A termination trigger occurs or either party ends the agreement on notice."}
    - {from: on_watch, to: terminated, by: system, means: "A termination trigger occurs while on watch."}
    - {from: suspended, to: terminated, by: system, means: "The suspension is not cured at review or a termination trigger occurs."}

accounts:
  - key: dealer_holdback
    unit: USD
    meaning: "Funding withheld from the dealer pending post-funding stipulations and title delivery: increases (in) when holdbacks are withheld at funding; decreases (out) when a holdback is released or forfeited."
  - key: dealer_participation
    unit: USD
    meaning: "Dealer participation and volume bonuses earned net of chargebacks: increases (in) when participation or a bonus is paid; decreases (out) when participation is charged back."

# ---- category-level parameter dictionary ----
parameter_schema:
  approval_requirements: "Documents required before a dealer agreement is approved"
  dealer_license_required: "Whether a current state dealer license must be on file to fund contracts"
  starting_tier: "Program tier assigned to a newly approved dealer"
  termination_notice_days: "Calendar days of written notice either party gives to end the agreement without cause"
  acquisition_fee_usd: "Acquisition fee deducted from the dealer's funding for each purchased contract, USD"
  participation_flat_usd: "Flat dealer participation paid at funding for each purchased contract, USD"
  eligible_contract_tiers: "Contract credit tiers the company buys from dealers of this tier"
  stip_holdback_usd: "Amount withheld from funding until post-funding stipulations (proof of income and residence) are cleared, USD"
  title_holdback_usd: "Amount withheld from funding until the title naming the company as lienholder is received, USD"
  funding_turnaround_business_days: "Business days from a complete contract package to funding"
  funding_method: "How funds reach the dealer"
  funding_formula: "Net funding paid to the dealer"
  post_funding_stip_deadline_days: "Calendar days after funding to clear post-funding stipulations before the stip holdback is forfeited"
  title_delivery_deadline_days: "Calendar days after the contract date by which the dealer must deliver a title or ELT confirmation naming the company as lienholder"
  holdback_forfeit_days: "Calendar days after funding after which an unreleased title holdback is forfeited"
  holdback_release_business_days: "Business days after the stipulation is cleared or the title received within which the holdback is released"
  chargeback_full_payoff_days: "Days from the contract date within which an early payoff charges back the full participation"
  chargeback_partial_payoff_days: "Days from the contract date within which an early payoff charges back chargeback_partial_pct of the participation"
  chargeback_partial_pct: "Share of participation charged back for an early payoff after chargeback_full_payoff_days and within chargeback_partial_payoff_days, percent"
  chargeback_early_default_days: "Days from the contract date within which a repossession or charge-off charges back the full participation"
  first_payment_default_days: "Calendar days after the first installment's due date by which it must be paid to avoid a first-payment default"
  first_payment_default_chargeback_pct: "Share of participation charged back on a first-payment default, percent"
  unwind_chargeback_pct: "Share of participation charged back when a contract is unwound, percent"
  chargeback_offset_method: "How chargebacks are collected"
  chargeback_invoice_days: "Calendar days without a funding after which a chargeback is invoiced"
  chargeback_max_per_contract_pct: "Largest total chargeback on one contract as a percent of the participation paid"
  refinance_payoff_chargeback: "Whether a payoff by refinance with another lender is treated as an early payoff"
  tier_review_frequency_months: "Months between tier reviews"
  tier_review_basis: "Statistics a tier review uses"
  tier_change_max_steps: "Most tiers a dealer moves up or down at one review"
  watch_fpd_rate_pct: "First-payment default rate over the trailing 90 days that places a dealer on watch, percent"
  watch_title_delinquent_count: "Contracts past the title delivery deadline that place a dealer on watch, count"
  suspend_title_delinquent_count: "Contracts past the title delivery deadline that suspend funding, count"
  watch_review_days: "Calendar days after which a dealer on watch is reviewed for clearing or suspension"
  suspension_triggers: "Events that suspend funding at once"
  suspension_review_days: "Calendar days within which a suspended dealer's cure is reviewed"
  reinstatement_requirements: "Conditions to reinstate a suspended dealer"
  termination_triggers: "Events that terminate the agreement"
  spot_delivery_unwind_days: "Calendar days after delivery within which a dealer may unwind a spot-delivered deal that the company has not funded"
  add_on_disclosure_required: "Whether the dealer must disclose add-on products as optional, with prices, before signing"
  max_add_on_markup_pct: "Largest markup over the company's add-on product price list a dealer may charge, percent"
  complaint_response_business_days: "Business days within which a dealer answers a borrower complaint forwarded by the company"
  dealer_contact_hours: "Hours the dealer support line serves dealers (Central time)"
  max_open_agreements_per_dealer: "Dealer agreements not terminated at once for one dealership business, count"
  participation_payment_timing: "When participation is paid"
  volume_bonus_per_contract_usd: "Quarterly volume bonus per contract funded in the quarter, paid after the quarter's tier review, USD (0.00 = none)"
  volume_bonus_payment_days: "Calendar days after the quarter's tier review within which the volume bonus is paid"
  min_contracts_per_review_retention: "Funded contracts in the 90 days before a review needed to keep the current tier, count"
  tier_upgrade_clean_days: "Calendar days without a suspension or watch status required before an upgrade"

