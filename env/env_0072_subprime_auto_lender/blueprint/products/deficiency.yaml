# Product charter: Deficiency Balance Accounts (post-sale balances after repossession).
category: deficiency
display_name: Deficiency Balance Accounts

binding:
  holding_table: deficiency_accounts
  event_tables: [deficiency_transactions]
  intake_tables: [deficiency_arrangement_offers]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deficiency_balance_usd: deficiency_balance}

lifecycle:
  states: [open, on_payment_plan, on_settlement_plan, paid_in_full, settled, referred_to_agency]
  transitions:
    - {from: open, to: on_payment_plan, by: agent, means: "The borrower's acceptance of a payment-plan offer is on file and the plan starts."}
    - {from: open, to: on_settlement_plan, by: agent, means: "The borrower's acceptance of an installment settlement offer is on file and the settlement starts."}
    - {from: on_payment_plan, to: open, by: system, means: "A plan installment remains unpaid past the grace period and the plan is broken."}
    - {from: on_settlement_plan, to: open, by: system, means: "A settlement installment remains unpaid past the grace period and the settlement is broken."}
    - {from: open, to: paid_in_full, by: system, means: "Payments and credits bring the balance to zero."}
    - {from: on_payment_plan, to: paid_in_full, by: system, means: "The plan's payments and any credits bring the balance to zero."}
    - {from: open, to: settled, by: agent, means: "An accepted lump-sum settlement is paid in time and the remainder is forgiven."}
    - {from: on_settlement_plan, to: settled, by: system, means: "The final settlement installment is paid and the remainder is forgiven."}
    - {from: open, to: referred_to_agency, by: system, means: "The account goes the referral period without a payment and is placed with an outside collection agency."}

accounts:
  - key: deficiency_balance
    unit: USD
    meaning: "Amount the borrower still owes after the sale of the repossessed vehicle: increases (in) at opening and when a posted payment is returned; decreases (out) with payments, credits from refunds and the forgiven remainder of a settlement."

# ---- category-level parameter dictionary ----
parameter_schema:
  deficiency_composition: "Components of the opening deficiency, in order"
  band_basis: "Basis of the band"
  explanation_before_demand: "Whether no payment demand, plan or settlement offer is made before the post-sale explanation (UCC 9-616) has been mailed"
  interest_on_deficiency: "Whether interest accrues on a deficiency balance after the sale"
  fees_on_deficiency: "Whether late, returned-payment or payment fees are charged on a deficiency account"
  demand_letter_days: "Calendar days after the post-sale explanation within which the first deficiency demand letter is mailed"
  accepted_payment_channels: "Channels accepted for deficiency payments"
  agent_payment_fee_usd: "Fee for a deficiency payment taken by a representative, USD"
  returned_payment_fee_usd: "Fee for a returned deficiency payment, USD"
  returned_payment_counts_as_missed: "Whether a returned plan or settlement installment counts as not paid"
  voluntary_payment_allowed: "Whether payments outside any plan are accepted on an open account"
  credit_sources_accepted: "Refunds that are credited to a deficiency balance"
  credit_reduces_settlement_amount: "Whether a credit received during an installment settlement reduces the remaining settlement amount"
  plan_min_monthly_payment_usd: "Minimum monthly plan installment, USD"
  plan_min_payment_pct_of_balance: "Minimum monthly plan installment as a percent of the balance on the acceptance date (the installment is the greater of this and plan_min_monthly_payment_usd, rounded up to the cent)"
  plan_max_term_months: "Maximum number of monthly plan installments"
  plan_offer_valid_days: "Calendar days a plan offer stays open for acceptance"
  plan_first_due_max_days: "Maximum calendar days from acceptance to the first plan installment"
  plan_due_day_range: "Allowed day-of-month for plan installments, inclusive"
  plan_grace_days: "Calendar days after a plan or settlement installment due date before the arrangement is broken"
  min_balance_for_plan_usd: "Smallest balance eligible for a monthly plan; smaller balances are paid in a lump sum or a small-balance plan, USD"
  small_balance_max_installments: "Maximum installments for a balance below min_balance_for_plan_usd"
  plan_restart_down_payment_pct: "Down payment, as a percent of the balance, required to start a new plan within 12 months of a broken arrangement"
  max_broken_arrangements_12m: "Broken plans or settlements in the rolling 12 months after which no new installment arrangement is offered, count"
  min_lump_sum_settlement_pct: "Lowest lump-sum settlement a representative may offer, percent of the balance on the offer date"
  min_installment_settlement_pct: "Lowest installment settlement a representative may offer, percent of the balance on the offer date"
  settlement_floor_usd: "Smallest settlement amount accepted whatever the percent, USD (when the floor exceeds the balance the full balance is due)"
  max_settlement_installments: "Maximum monthly installments in an installment settlement"
  settlement_offer_valid_days: "Calendar days a settlement offer stays open for acceptance"
  lump_sum_due_days: "Calendar days after acceptance by which a lump-sum settlement must be paid"
  hardship_extra_discount_pct: "Additional percentage points below the minimum settlement percent allowed with documented hardship"
  hardship_documents_accepted: "Documents that establish hardship"
  settlement_reoffer_wait_days: "Calendar days after a broken settlement before a new settlement offer may be made"
  form_1099c_threshold_usd: "Forgiven amount at or above which an IRS Form 1099-C is issued for the year of the settlement, USD"
  settlement_letter_days: "Calendar days after the final settlement payment within which the settled-in-full letter is mailed"
  credit_reporting_paid_in_full: "Credit bureau status reported when the balance is paid in full"
  credit_reporting_settled: "Credit bureau status reported on a settlement"
  credit_bureau_update_days: "Calendar days after closure within which the bureaus are updated"
  paid_in_full_letter_days: "Calendar days after the final payment within which the paid-in-full letter is mailed"
  agency_referral_days_without_payment: "Calendar days without a posted, unreturned payment (counted from the later of the opening date and the latest such payment) after which an open account is referred to an outside collection agency"
  agency_accounts_serviced_by_agency: "Whether payments, plans and settlements on a referred account are handled only by the agency"
  time_barred_handling: "Treatment of an account past the contract state's statute of limitations"
  max_open_accounts_per_contract: "Deficiency accounts per liquidated contract, count"
  dispute_response_days: "Calendar days within which a written dispute of the deficiency amount is answered, with collection paused meanwhile"
  plan_payment_frequency: "Cadence of payment-plan installments"
  settlement_installment_frequency: "Cadence of installment-settlement payments"
  settlement_min_days_after_opening: "Minimum calendar days after the opening date before a settlement offer may be made"
  credit_reporting_referred: "Credit bureau status reported when an account is referred to a collection agency"

