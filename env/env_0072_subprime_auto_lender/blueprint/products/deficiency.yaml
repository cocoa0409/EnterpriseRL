# ---- data flow ----
events:
  - type: deficiency_opened
    target: deficiency_accounts
    mutation: create
    meaning: "A deficiency account is opened for the balance left after a repossessed vehicle's sale proceeds were applied."
    grain: "one row per liquidated contract with a deficiency"
    fields:
      customer_id: "the borrower"
      contract_id: "the liquidated contract"
      recovery_case_id: "the recovery case whose sale produced the deficiency"
      variant_name: "band set by the original deficiency"
      opened_date: "sale date"
      original_deficiency_usd: "deficiency on the opening date"
      deficiency_balance_usd: "set to original_deficiency_usd"
    account: deficiency_balance
    direction: in
    triggers:
      - event: contract:contract_balance_transferred
        map: {txn_date: opened_date, source_record_id: deficiency_account_id}
  - type: deficiency_payment_posted
    target: deficiency_transactions
    meaning: "A payment is posted to the deficiency balance."
    grain: "one row per payment received"
    distinguish_by: [txn_date, payment_channel, amount_usd]
    fields:
      txn_date: "posting date"
      amount_usd: "payment amount"
      payment_channel: "channel of the payment"
      arrangement_offer_id: "the accepted plan or settlement the payment counts toward; empty for a voluntary payment"
    account: deficiency_balance
    direction: out
    triggers:
      - event: deficiency:deficiency_account_update
  - type: deficiency_payment_returned
    target: deficiency_transactions
    meaning: "A posted deficiency payment is returned unpaid by the bank."
    grain: "one row per returned payment"
    distinguish_by: [related_txn_id]
    fields:
      txn_date: "return date"
      amount_usd: "amount returned (equal to the original payment)"
      related_txn_id: "the returned payment"
      return_reason: "bank return reason"
    account: deficiency_balance
    direction: in
    triggers:
      - event: deficiency:deficiency_account_update
  - type: deficiency_credit_applied
    target: deficiency_transactions
    meaning: "A refund from another product or a recovery-expense correction is credited to the deficiency balance."
    grain: "one row per originating credit"
    distinguish_by: [source_record_id]
    fields:
      txn_date: "posting date"
      amount_usd: "amount credited"
      credit_source: "originating refund or correction"
      source_record_id: "the originating refund or correction record"
    account: deficiency_balance
    direction: out
    triggers:
      - event: deficiency:deficiency_account_update
  - type: deficiency_settlement_waiver
    target: deficiency_transactions
    meaning: "The remainder of the balance is forgiven when an accepted settlement is fully paid."
    grain: "one row per completed settlement"
    distinguish_by: [arrangement_offer_id]
    fields:
      txn_date: "date the settlement was completed"
      amount_usd: "balance forgiven"
      arrangement_offer_id: "the settlement completed"
      form_1099c_required: "whether the forgiven amount is reported on IRS Form 1099-C"
    account: deficiency_balance
    direction: out
    triggers:
      - event: deficiency:deficiency_account_update
  - type: deficiency_account_update
    target: deficiency_accounts
    mutation: update
    meaning: "The account's balance and arrangement fields are refreshed after a posting."
    grain: "one row per transaction"
    fields:
      deficiency_balance_usd: "current balance (sum of deficiency_balance deltas)"
      last_payment_date: "date of the latest posted payment that was not returned"
      arrangement_offer_id: "the accepted arrangement in force; empty when none"
    triggers: []
  - type: deficiency_plan_started
    target: deficiency_accounts
    mutation: {transition: {from: open, to: on_payment_plan}}
    meaning: "An accepted payment plan starts."
    grain: "one row per transaction"
    fields:
      status: "set to on_payment_plan"
      arrangement_offer_id: "the accepted plan offer"
    triggers: []
  - type: deficiency_settlement_started
    target: deficiency_accounts
    mutation: {transition: {from: open, to: on_settlement_plan}}
    meaning: "An accepted installment settlement starts."
    grain: "one row per transaction"
    fields:
      status: "set to on_settlement_plan"
      arrangement_offer_id: "the accepted settlement offer"
    triggers: []
  - type: deficiency_arrangement_broken
    target: deficiency_accounts
    mutation: {transition: [{from: on_payment_plan, to: open}, {from: on_settlement_plan, to: open}]}
    meaning: "A plan or installment settlement is broken by an installment left unpaid past grace."
    grain: "one row per transaction"
    fields:
      status: "set to open"
      arrangement_offer_id: "cleared to empty"
    triggers: []
  - type: deficiency_paid_in_full
    target: deficiency_accounts
    mutation: {transition: [{from: open, to: paid_in_full}, {from: on_payment_plan, to: paid_in_full}]}
    meaning: "The deficiency balance reaches zero through payments and credits."
    grain: "one row per transaction"
    fields:
      status: "set to paid_in_full"
      closed_date: "date the balance reached zero"
    triggers: []
  - type: deficiency_settled
    target: deficiency_accounts
    mutation: {transition: [{from: open, to: settled}, {from: on_settlement_plan, to: settled}]}
    meaning: "An accepted settlement is fully paid and the account closes as settled."
    grain: "one row per transaction"
    fields:
      status: "set to settled"
      closed_date: "date of the final settlement payment"
    triggers:
      - event: deficiency:deficiency_settlement_waiver
        map: {txn_date: closed_date, arrangement_offer_id: arrangement_offer_id}
  - type: deficiency_referred
    target: deficiency_accounts
    mutation: {transition: {from: open, to: referred_to_agency}}
    meaning: "The account is placed with an outside collection agency."
    grain: "one row per transaction"
    fields:
      status: "set to referred_to_agency"
      referred_date: "placement date"
    triggers: []

# ---- derived measures ----
measures:
  - id: deficiency_msr_days_without_payment
    window: "from the later of opened_date and the latest posted, unreturned payment's txn_date, to the frozen date"
    measure: "calendar days elapsed"
  - id: deficiency_msr_broken_arrangements_12m
    window: "rolling 12 months ending on the frozen date (same calendar day 12 months earlier, exclusive; month-end fallback to the last day of the month)"
    measure: "count of deficiency_arrangement_offers rows of the account with offer_status broken whose broken_date falls in the window"
  - id: deficiency_msr_paid_toward_arrangement
    window: "from the acceptance of the arrangement to the frozen date"
    measure: "sum of amount_usd of deficiency_payment_posted rows carrying that arrangement_offer_id that have no deficiency_payment_returned row, plus deficiency_credit_applied rows posted after acceptance when credit_reduces_settlement_amount is true"

# ---- policies ----
policies:
  - id: deficiency_agg_multi_holding
    subject: [deficiency_opened]
    rule: >-
      A deficiency account is held per liquidated contract: a borrower may hold several deficiency accounts, one for each contract whose vehicle was sold with a deficiency, without a per-borrower limit, and a contract never has more than max_open_accounts_per_contract deficiency account.
    eligibility: []
    params: {max_per_customer: null}
  - id: deficiency_agg_separate_resolution
    subject: [deficiency_plan_started, deficiency_settlement_started, deficiency_payment_posted]
    rule: >-
      Each deficiency account is resolved on its own: a payment posts only to the account the payer names, a plan or settlement offer covers exactly one account, and two accounts of the same borrower are never combined into one plan or one settlement amount.
      A deficiency payment never reduces a balance on an open contract, and a contract payment never reduces a deficiency balance.
      Broken arrangements are counted per account (deficiency_msr_broken_arrangements_12m).
    eligibility: []
    measures: [deficiency_msr_broken_arrangements_12m]
  - id: deficiency_opening
    subject: [deficiency_opened]
    rule: >-
      A deficiency account opens on the sale date when the recovery case's sale_result is deficiency, for the components in deficiency_composition: the contract's principal and fees left after the sale-proceeds payment, the contract interest accrued to the sale date, and any recovery expenses the gross proceeds did not cover.
      The contract's remaining principal and fees move to the account in one balance transfer on the same date.
      The account's band is the one whose range (entry_gate) contains original_deficiency_usd and never changes (band_basis).
      No interest and no fees of any kind accrue on a deficiency account (interest_on_deficiency, fees_on_deficiency).
      No payment demand, plan or settlement offer may be made before the recovery case's post-sale explanation has been mailed (explanation_before_demand), and the first demand letter follows within demand_letter_days after it.
      A borrower's written dispute of the deficiency amount is answered within dispute_response_days, and no offer is made while it is open.
      An account past the contract state's statute of limitations is never pressed for payment (time_barred_handling).
    eligibility: []
  - id: deficiency_evt_payments
    subject: [deficiency_payment_posted, deficiency_payment_returned, deficiency_account_update]
    rule: >-
      Payments and credits are posted only to an account whose status is open, on_payment_plan or on_settlement_plan; a referred account is serviced only by the agency (agency_accounts_serviced_by_agency) and a closed account takes no further postings.
      Payments are accepted through accepted_payment_channels with no fee (agent_payment_fee_usd), and voluntary payments outside any arrangement are welcome on an open account (voluntary_payment_allowed).
      A payment made while a plan or settlement is in force carries that arrangement's arrangement_offer_id and counts toward it; a payment larger than the balance is limited to the balance.
      A posted payment can be returned only once; the return restores the balance, carries no fee (returned_payment_fee_usd), and a returned arrangement installment counts as unpaid (returned_payment_counts_as_missed).
      After each posting the balance and last_payment_date are refreshed; when the balance reaches zero the account is paid in full.
    eligibility:
      - id: posting_account_status
        applies_to: [deficiency_payment_posted]
        kind: state
        condition: "Payments and credits are posted only to an account whose status is open, on_payment_plan or on_settlement_plan; a referred account is serviced only by the agency (agency_accounts_serviced_by_agency) and a closed account takes no further postings."
        evidence_fields: [deficiency_accounts.status, deficiency_accounts.deficiency_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[deficiency_accounts.deficiency_account_id]]
          action_bindings: {deficiency_accounts.deficiency_account_id: deficiency_account_id}
        state_contract:
          field: deficiency_accounts.status
          allowed: [open, on_payment_plan, on_settlement_plan]
      - id: one_return_per_payment
        applies_to: [deficiency_payment_returned]
        kind: dedup
        condition: "A posted payment can be returned only once; the return restores the balance, carries no fee (returned_payment_fee_usd), and a returned arrangement installment counts as unpaid (returned_payment_counts_as_missed)."
        evidence_fields: [deficiency_transactions.related_txn_id, deficiency_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[deficiency_transactions.related_txn_id]]
          action_bindings: {deficiency_transactions.related_txn_id: related_txn_id}
        dedup_contract:
          table: deficiency_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [deficiency_payment_returned]}
          distinct_fields: []
  - id: deficiency_evt_credits
    subject: [deficiency_credit_applied]
    rule: >-
      A credit is applied only to an account whose status is open, on_payment_plan or on_settlement_plan.
      Only refunds listed in credit_sources_accepted are credited: unearned CPI premium, GAP waiver and service-contract refunds issued after the contract was liquidated, and recovery expenses later found charged in error; each credit is linked to its originating record and applied once.
      A credit reduces the balance on its posting date; during an installment settlement it also reduces the remaining settlement amount (credit_reduces_settlement_amount), and a credit larger than the balance is limited to the balance, the issuing product paying any excess to the borrower.
    eligibility:
      - id: credit_account_status
        applies_to: [deficiency_credit_applied]
        kind: state
        condition: "A credit is applied only to an account whose status is open, on_payment_plan or on_settlement_plan."
        evidence_fields: [deficiency_accounts.status, deficiency_accounts.deficiency_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[deficiency_accounts.deficiency_account_id]]
          action_bindings: {deficiency_accounts.deficiency_account_id: deficiency_account_id}
        state_contract:
          field: deficiency_accounts.status
          allowed: [open, on_payment_plan, on_settlement_plan]
  - id: deficiency_payment_plan
    subject: [deficiency_plan_started, deficiency_arrangement_broken]
    rule: >-
      A payment plan starts only under an arrangement offer of offer_type payment_plan that the borrower has accepted.
      The plan offer must be accepted no later than plan_offer_valid_days after it was made.
      The acceptance period is counted in calendar days from offer_date, and an acceptance on the last day is in time; an offer not accepted in time expires.
      A plan is offered only on an open account with a balance of at least min_balance_for_plan_usd; a smaller balance may be spread over no more than small_balance_max_installments monthly installments of equal amount.
      The monthly installment is the greater of plan_min_monthly_payment_usd and plan_min_payment_pct_of_balance of the balance on the acceptance date, rounded up to the cent, and the number of installments is the balance divided by the installment rounded up, never more than plan_max_term_months; the first installment is due no more than plan_first_due_max_days after acceptance on a due day within plan_due_day_range, and later installments follow monthly (plan_payment_frequency).
      Where the account had a broken arrangement in the rolling 12 months (deficiency_msr_broken_arrangements_12m at least 1), a new plan also requires a down payment of plan_restart_down_payment_pct of the balance, and once broken arrangements reach max_broken_arrangements_12m no new plan is offered.
      A plan is broken when an installment remains unpaid plan_grace_days after its due date; the account returns to open and keeps every payment already made.
    eligibility:
      - id: plan_offer_accepted
        applies_to: [deficiency_plan_started]
        kind: authorization
        condition: "A payment plan starts only under an arrangement offer of offer_type payment_plan that the borrower has accepted."
        evidence_fields: [deficiency_arrangement_offers.arrangement_offer_id, deficiency_arrangement_offers.offer_type, deficiency_arrangement_offers.offer_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[deficiency_arrangement_offers.arrangement_offer_id]]
          action_bindings: {deficiency_arrangement_offers.arrangement_offer_id: arrangement_offer_id}
      - id: plan_offer_in_time
        applies_to: [deficiency_plan_started]
        kind: time
        condition: "The plan offer must be accepted no later than plan_offer_valid_days after it was made."
        evidence_fields: [deficiency_arrangement_offers.offer_date, deficiency_arrangement_offers.accepted_at, deficiency_arrangement_offers.arrangement_offer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[deficiency_arrangement_offers.arrangement_offer_id]]
          action_bindings: {deficiency_arrangement_offers.arrangement_offer_id: arrangement_offer_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "it was made"
          anchor_source: deficiency_arrangement_offers.offer_date
          relation: not_after
          duration_source: variants.plan_offer_valid_days
          unit: calendar_days
          counting_rule: "The acceptance period is counted in calendar days from offer_date, and an acceptance on the last day is in time; an offer not accepted in time expires."
          boundary: inclusive
    params:
      per_tier:
        Deficiency Resolution Band 1: {plan_min_monthly_payment_usd: "=plan_min_monthly_payment_usd", plan_min_payment_pct_of_balance: "=plan_min_payment_pct_of_balance", plan_max_term_months: "=plan_max_term_months"}
        Deficiency Resolution Band 2: {plan_min_monthly_payment_usd: "=plan_min_monthly_payment_usd", plan_min_payment_pct_of_balance: "=plan_min_payment_pct_of_balance", plan_max_term_months: "=plan_max_term_months"}
        Deficiency Resolution Band 3: {plan_min_monthly_payment_usd: "=plan_min_monthly_payment_usd", plan_min_payment_pct_of_balance: "=plan_min_payment_pct_of_balance", plan_max_term_months: "=plan_max_term_months"}
        Deficiency Resolution Band 4: {plan_min_monthly_payment_usd: "=plan_min_monthly_payment_usd", plan_min_payment_pct_of_balance: "=plan_min_payment_pct_of_balance", plan_max_term_months: "=plan_max_term_months"}
        Deficiency Resolution Band 5: {plan_min_monthly_payment_usd: "=plan_min_monthly_payment_usd", plan_min_payment_pct_of_balance: "=plan_min_payment_pct_of_balance", plan_max_term_months: "=plan_max_term_months"}
        Deficiency Resolution Band 6: {plan_min_monthly_payment_usd: "=plan_min_monthly_payment_usd", plan_min_payment_pct_of_balance: "=plan_min_payment_pct_of_balance", plan_max_term_months: "=plan_max_term_months"}
    formula:
      plan_installment: "max(plan_min_monthly_payment_usd, deficiency_balance_usd * plan_min_payment_pct_of_balance / 100)"
    measures: [deficiency_msr_broken_arrangements_12m]
  - id: deficiency_settlement
    subject: [deficiency_settlement_started, deficiency_settled, deficiency_settlement_waiver]
    rule: >-
      A settlement is carried out only under an arrangement offer of offer_type lump_sum_settlement or installment_settlement that the borrower has accepted.
      The settlement offer must be accepted no later than settlement_offer_valid_days after it was made.
      The acceptance period is counted in calendar days from offer_date, and an acceptance on the last day is in time; an offer not accepted in time expires.
      A settlement is offered only on an open account, no sooner than settlement_min_days_after_opening after the opening date, not within settlement_reoffer_wait_days after a broken settlement, and not once broken arrangements in the rolling 12 months reach max_broken_arrangements_12m.
      The settlement amount may be no lower than the greater of the band's minimum percent of the balance on the offer date (min_lump_sum_settlement_pct for a lump sum, min_installment_settlement_pct for installments) and settlement_floor_usd, and never more than the balance; with a documented hardship (one of hardship_documents_accepted) the minimum percent is lowered by hardship_extra_discount_pct points.
      A lump sum must be paid within lump_sum_due_days after acceptance; an installment settlement is paid in equal monthly installments (settlement_installment_frequency), no more than max_settlement_installments, and is broken when an installment remains unpaid plan_grace_days after its due date.
      When the payments counting toward the settlement (deficiency_msr_paid_toward_arrangement) reach the settlement amount, the account closes as settled on that date, the remaining balance is forgiven, a settled-in-full letter is mailed within settlement_letter_days, and the forgiven amount is reported on IRS Form 1099-C when it is at least form_1099c_threshold_usd (form_1099c_required).
      The bureaus are updated within credit_bureau_update_days with credit_reporting_settled.
    eligibility:
      - id: settlement_offer_accepted
        applies_to: [deficiency_settlement_started, deficiency_settled]
        kind: authorization
        condition: "A settlement is carried out only under an arrangement offer of offer_type lump_sum_settlement or installment_settlement that the borrower has accepted."
        evidence_fields: [deficiency_arrangement_offers.arrangement_offer_id, deficiency_arrangement_offers.offer_type, deficiency_arrangement_offers.offer_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[deficiency_arrangement_offers.arrangement_offer_id]]
          action_bindings: {deficiency_arrangement_offers.arrangement_offer_id: arrangement_offer_id}
      - id: settlement_offer_in_time
        applies_to: [deficiency_settlement_started, deficiency_settled]
        kind: time
        condition: "The settlement offer must be accepted no later than settlement_offer_valid_days after it was made."
        evidence_fields: [deficiency_arrangement_offers.offer_date, deficiency_arrangement_offers.accepted_at, deficiency_arrangement_offers.arrangement_offer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[deficiency_arrangement_offers.arrangement_offer_id]]
          action_bindings: {deficiency_arrangement_offers.arrangement_offer_id: arrangement_offer_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "it was made"
          anchor_source: deficiency_arrangement_offers.offer_date
          relation: not_after
          duration_source: variants.settlement_offer_valid_days
          unit: calendar_days
          counting_rule: "The acceptance period is counted in calendar days from offer_date, and an acceptance on the last day is in time; an offer not accepted in time expires."
          boundary: inclusive
    params:
      per_tier:
        Deficiency Resolution Band 1: {min_lump_sum_settlement_pct: "=min_lump_sum_settlement_pct", min_installment_settlement_pct: "=min_installment_settlement_pct", settlement_floor_usd: "=settlement_floor_usd", max_settlement_installments: "=max_settlement_installments", hardship_extra_discount_pct: "=hardship_extra_discount_pct"}
        Deficiency Resolution Band 2: {min_lump_sum_settlement_pct: "=min_lump_sum_settlement_pct", min_installment_settlement_pct: "=min_installment_settlement_pct", settlement_floor_usd: "=settlement_floor_usd", max_settlement_installments: "=max_settlement_installments", hardship_extra_discount_pct: "=hardship_extra_discount_pct"}
        Deficiency Resolution Band 3: {min_lump_sum_settlement_pct: "=min_lump_sum_settlement_pct", min_installment_settlement_pct: "=min_installment_settlement_pct", settlement_floor_usd: "=settlement_floor_usd", max_settlement_installments: "=max_settlement_installments", hardship_extra_discount_pct: "=hardship_extra_discount_pct"}
        Deficiency Resolution Band 4: {min_lump_sum_settlement_pct: "=min_lump_sum_settlement_pct", min_installment_settlement_pct: "=min_installment_settlement_pct", settlement_floor_usd: "=settlement_floor_usd", max_settlement_installments: "=max_settlement_installments", hardship_extra_discount_pct: "=hardship_extra_discount_pct"}
        Deficiency Resolution Band 5: {min_lump_sum_settlement_pct: "=min_lump_sum_settlement_pct", min_installment_settlement_pct: "=min_installment_settlement_pct", settlement_floor_usd: "=settlement_floor_usd", max_settlement_installments: "=max_settlement_installments", hardship_extra_discount_pct: "=hardship_extra_discount_pct"}
        Deficiency Resolution Band 6: {min_lump_sum_settlement_pct: "=min_lump_sum_settlement_pct", min_installment_settlement_pct: "=min_installment_settlement_pct", settlement_floor_usd: "=settlement_floor_usd", max_settlement_installments: "=max_settlement_installments", hardship_extra_discount_pct: "=hardship_extra_discount_pct"}
    formula:
      min_lump_sum_amount: "min(deficiency_balance_usd, max(round(deficiency_balance_usd * min_lump_sum_settlement_pct / 100, 2), settlement_floor_usd))"
      min_installment_amount: "min(deficiency_balance_usd, max(round(deficiency_balance_usd * min_installment_settlement_pct / 100, 2), settlement_floor_usd))"
    measures: [deficiency_msr_paid_toward_arrangement, deficiency_msr_broken_arrangements_12m]
  - id: deficiency_closure_and_referral
    subject: [deficiency_paid_in_full, deficiency_referred]
    rule: >-
      An account is paid in full on the day payments and credits bring its balance to zero; a paid-in-full letter is mailed within paid_in_full_letter_days and the bureaus are updated within credit_bureau_update_days with credit_reporting_paid_in_full.
      An open account (not on a plan or settlement) that goes agency_referral_days_without_payment days without a posted, unreturned payment (deficiency_msr_days_without_payment) is referred to an outside collection agency on that day and reported with credit_reporting_referred; an account on a plan or settlement in force is never referred.
      A referred account stays with the agency, which alone takes payments and makes arrangements on it.
    eligibility: []
    measures: [deficiency_msr_days_without_payment]
