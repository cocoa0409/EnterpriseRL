# Product charter: Repossession and Collateral Recovery (one case per default episode).
category: recovery
display_name: Repossession and Collateral Recovery

binding:
  holding_table: recovery_cases
  event_tables: [recovery_activities]
  status_field: status
  variant_field: variant_name
  quantity_fields: {expenses_outstanding_usd: recovery_expenses}

lifecycle:
  states: [pre_repo_review, assigned, recovered, reinstated, redeemed, sold, recalled]
  transitions:
    - {from: pre_repo_review, to: assigned, by: system, means: "The contract is assigned to a licensed recovery agency after every pre-repossession condition is met."}
    - {from: pre_repo_review, to: recalled, by: agent, means: "The review ends without assignment (account brought current, SCRA protection, bankruptcy filing or referral error)."}
    - {from: assigned, to: recovered, by: system, means: "The agency recovers the vehicle, the borrower surrenders it, or it is released to the company from an impound."}
    - {from: assigned, to: recalled, by: agent, means: "The assignment is withdrawn before recovery (account brought current, SCRA protection, bankruptcy filing, assignment expiry or error)."}
    - {from: recovered, to: reinstated, by: agent, means: "The borrower pays the reinstatement amount before the earliest sale date; the vehicle is released and the contract returns to active servicing."}
    - {from: recovered, to: redeemed, by: agent, means: "The borrower pays the full payoff plus recovery expenses before the sale; the vehicle and title are released."}
    - {from: recovered, to: sold, by: system, means: "The vehicle is sold at auction after the notice period; proceeds are applied and any surplus or deficiency is settled."}

accounts:
  - key: recovery_expenses
    unit: USD
    meaning: "Recovery expenses charged on this case and not yet settled: increases (in) when an expense is posted; decreases (out) when an expense is waived or settled (paid by the borrower, deducted from sale proceeds or transferred to the deficiency account)."

# ---- category-level parameter dictionary ----
parameter_schema:
  involuntary_repossession_fee_usd: "Recovery agency fee charged for an involuntary recovery, USD"
  voluntary_surrender_fee_usd: "Fee charged when the borrower surrenders the vehicle voluntarily (transport arranged by the company), USD"
  impound_release_admin_fee_usd: "Company administrative fee for releasing a vehicle from a police or municipal impound, USD (the impound lot's own charges pass through at the receipted amount)"
  impound_charges_basis: "Basis on which impound lot charges are passed to the borrower"
  transport_fee_usd: "Transport from the recovery point to the storage lot, USD"
  tow_equipment: "Equipment class the recovery agency must use"
  storage_fee_per_day_usd: "Storage per chargeable day at the contracted lot, USD"
  storage_free_days: "Calendar days after the recovery date not charged for storage"
  storage_max_days_chargeable: "Maximum storage days charged on one case"
  key_replacement_fee_usd: "Cost of cutting and programming a key when no key was obtained at recovery, USD"
  auction_fee_usd: "Auction seller fee charged when the vehicle is sold, USD"
  auction_fee_only_on_sale: "Whether the auction fee is charged only when the vehicle actually sells"
  reconditioning_cap_usd: "Maximum reconditioning cost charged before sale, USD (only invoiced work)"
  reconditioning_requires_invoice: "Whether reconditioning is charged only against a vendor invoice"
  skip_trace_fee_usd: "Skip-tracing cost charged to the borrower, USD"
  close_fee_charged_to_borrower: "Whether an agency close fee for a recalled assignment is charged to the borrower"
  courtesy_expense_waiver_allowed: "Whether representatives may waive correctly assessed recovery expenses as a courtesy"
  expenses_reasonableness_basis: "Standard every recovery expense must meet"
  personal_property_hold_days: "Calendar days personal property found in the vehicle is held for retrieval after the property notice is mailed"
  personal_property_storage_fee_usd: "Fee charged for holding personal property, USD"
  personal_property_notice_days: "Calendar days after recovery within which the personal property notice is mailed"
  repossession_referral_min_days_past_due: "Minimum days past due before a contract is referred for repossession review"
  right_to_cure_schedule: "Company schedule of contract states whose consumer credit codes require a pre-repossession notice of right to cure, mapped to the cure period in calendar days after mailing (states not listed: no cure notice)"
  cure_notice_min_days_past_due: "Minimum days past due before a right-to-cure notice may be mailed"
  cure_notice_repeat_window_months: "Months after a cured right-to-cure notice during which a new default may be referred for assignment without another cure notice"
  cure_notice_delivery_method: "How right-to-cure notices are delivered"
  scra_court_order_required: "Whether a contract incurred before military service may be repossessed during service only under a court order (50 U.S.C. 3952)"
  bankruptcy_stay_recall: "Whether a bankruptcy filing on record recalls any assignment immediately (11 U.S.C. 362 automatic stay)"
  breach_of_peace_withdrawal: "Whether the agency must withdraw when the borrower objects at the scene or entry to a closed structure would be needed (UCC 9-609)"
  assignment_expiry_days: "Calendar days an assignment stays with an agency without a recovery before it is recalled for review"
  noi_mail_within_business_days: "Business days after the recovery date within which the notice of intent to sell is mailed (Monday-Friday excluding federal holidays)"
  noi_delivery_method: "How the notice of intent to sell is delivered"
  noi_min_days_before_sale: "Minimum calendar days from the notice of intent to sell mailing date to the earliest sale date stated in it"
  noi_resend_if_undeliverable: "Whether a notice returned undeliverable is re-mailed to any newer address on file, restarting the sale period"
  reinstatement_offered: "Whether the company offers reinstatement after repossession in every state"
  reinstatement_max_per_contract: "Maximum reinstatements after repossession over the life of one contract, count"
  reinstatement_quote_valid_days: "Calendar days a reinstatement quote is good through, never past the earliest sale date"
  reinstatement_requires_insurance_proof: "Whether accepted proof of the borrower's physical-damage insurance must be on file before a reinstated vehicle is released"
  certified_payment_channels: "Payment channels accepted for reinstatement, redemption and recovery expenses"
  vehicle_release_business_days: "Business days after good funds within which a reinstated or redeemed vehicle is released"
  redemption_deadline_basis: "Until when the borrower may redeem"
  sale_type_default: "Disposition method the company uses"
  sale_proceeds_application_order: "Order in which gross sale proceeds are applied"
  surplus_refund_days: "Calendar days after the sale within which a surplus is paid to the borrower"
  post_sale_explanation_days: "Calendar days after the sale within which the written explanation of the surplus or deficiency calculation is mailed (UCC 9-616)"
  explanation_request_response_days: "Calendar days within which the company answers a borrower's written request for an explanation (UCC 9-616)"
  vehicle_condition_report_required: "Whether a condition report with photos is completed at intake to the storage lot"
  max_open_cases_per_contract: "Recovery cases not closed at once for one contract, count"

