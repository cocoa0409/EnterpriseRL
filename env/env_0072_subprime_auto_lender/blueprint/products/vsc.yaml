# Product charter: Vehicle Service Contracts financed in the retail installment contract.
category: vsc
display_name: Vehicle Service Contracts

binding:
  holding_table: service_contracts
  event_tables: [vsc_activities]
  intake_tables: [vsc_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {price_net_usd: vsc_price_net}

lifecycle:
  states: [active, cancelled, expired]
  transitions:
    - {from: active, to: cancelled, by: agent, means: "The service contract is cancelled on the borrower's signed request, on the sale of the repossessed vehicle, on a total loss or on an unwind."}
    - {from: active, to: expired, by: system, means: "The service contract reaches its expiration date or expiration odometer."}

accounts:
  - key: vsc_price_net
    unit: USD
    meaning: "Price the borrower paid for the service contract net of refunds: increases (in) at enrollment by the price financed; decreases (out) with each refund."

# ---- category-level parameter dictionary ----
parameter_schema:
  price_usd: "Retail price of the service contract, financed in the retail installment contract, USD"
  term_months: "Coverage term in months from the enrollment date"
  term_miles: "Coverage mileage added to the odometer at sale"
  enrollment_only_at_signing: "Whether the service contract can be financed only at contract signing"
  commercial_use_excluded: "Whether vehicles used commercially, for rideshare or livery are ineligible"
  administrator_name: "Third-party administrator that adjudicates and pays claims"
  max_open_contracts_per_vehicle: "Service contracts in force at once on one financed vehicle, count"
  covered_component_groups: "Component groups covered by the plan"
  listed_exclusions: "Items never covered by any plan, including the exclusionary plan"
  deductible_usd: "Deductible per repair visit, USD"
  deductible_basis: "How the deductible applies"
  lifetime_claim_limit_usd: "Maximum total of authorized claims over the life of the service contract, USD"
  waiting_period_days: "Calendar days after enrollment before a breakdown is covered"
  waiting_period_miles: "Miles after the odometer at sale before a breakdown is covered"
  labor_rate_cap_usd_per_hour: "Highest labor rate the administrator pays, USD per hour"
  rental_car_per_day_usd: "Rental reimbursement per day while a covered repair is in progress, USD (0.00 = none)"
  rental_car_max_days: "Maximum rental days per covered repair"
  towing_per_occurrence_usd: "Towing reimbursement per covered breakdown, USD"
  trip_interruption_usd: "Lodging and meals reimbursement when a covered breakdown occurs more than 100 miles from home, USD (0.00 = none)"
  roadside_assistance_included: "Whether 24-hour roadside assistance is included"
  preauthorization_required: "Whether the repair facility must obtain authorization before starting a repair"
  repair_facility_rule: "Where covered repairs may be done"
  maintenance_records_required: "Whether the borrower must show manufacturer-recommended maintenance records when a claim involves a lubricated part"
  oil_change_interval_miles: "Longest oil-change interval accepted in maintenance records, miles"
  claim_authorization_business_days: "Business days within which the administrator authorizes or denies a complete claim"
  claim_payment_method: "How authorized claims are paid"
  diagnostic_covered_if_repair_covered: "Whether teardown and diagnosis are paid when the failure is covered"
  free_look_days: "Calendar days after enrollment within which a voluntary cancellation receives a full refund"
  cancellation_fee_usd: "Fee deducted from a refund outside the free-look period, USD"
  refund_method: "How the unearned price is computed outside the free-look period"
  claims_deducted_from_refund: "Whether claims already paid are deducted from a refund"
  min_refund_usd: "Computed refunds below this amount are not issued, USD"
  refund_processing_days: "Calendar days after the cancellation effective date within which the refund is issued"
  refund_disposition_order: "Where a refund goes, first applicable wins"
  auto_cancel_on_payoff: "Whether paying the retail installment contract off cancels the service contract"
  auto_cancel_on_repossession_sale: "Whether the company, as lienholder, cancels the service contract when the repossessed vehicle is sold"
  auto_cancel_on_total_loss: "Whether the service contract is cancelled when the vehicle is declared a total loss"
  voluntary_cancel_signature_required: "Whether a borrower's voluntary cancellation needs a signed cancellation request"
  voluntary_request_valid_days: "Calendar days a cancellation request sent for signature stays open"
  cancellation_effective_basis: "Effective date and odometer of a cancellation by reason"
  unwind_full_refund: "Whether an unwound contract's service contract is voided with a full refund"
  transfer_allowed: "Whether the service contract may be transferred to a private buyer of the vehicle once the retail installment contract is paid off"
  transfer_fee_usd: "Fee for a transfer, USD"
  transfer_window_days: "Calendar days after the vehicle's private sale within which a transfer must be requested"
  expiry_basis: "When coverage ends"
  mileage_basis: "Odometer used to measure mileage consumed"
  seals_gaskets_covered: "Whether seals and gaskets are covered when replaced as part of a covered repair"
  pre_existing_conditions_excluded: "Whether failures that began before enrollment or during the waiting period are excluded"

