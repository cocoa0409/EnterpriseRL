# ---- data flow ----
events:
  - type: vsc_enrolled
    target: service_contracts
    mutation: create
    meaning: "The borrower buys a service contract at signing and its price is financed."
    grain: "one row per service contract"
    fields:
      customer_id: "the borrower"
      contract_id: "the retail installment contract financing it"
      variant_name: "coverage plan"
      enrollment_date: "contract date"
      price_usd: "price financed"
      odometer_at_sale: "odometer at enrollment"
      expiration_date: "enrollment date plus term_months"
      expiration_odometer: "odometer_at_sale plus term_miles"
      price_net_usd: "set to price_usd"
    account: vsc_price_net
    direction: in
    triggers: []
  - type: vsc_claim_authorized
    target: vsc_activities
    meaning: "The administrator authorizes a covered repair."
    grain: "one row per repair order"
    distinguish_by: [repair_order_number]
    fields:
      activity_date: "authorization date"
      repair_order_number: "repair facility's repair order number"
      repair_facility: "repair facility name"
      odometer: "odometer on the repair order"
      component_group: "covered component group repaired"
      authorized_amount_usd: "covered parts, labor and diagnosis authorized before the deductible"
      deductible_usd: "deductible charged to the borrower"
    triggers: []
  - type: vsc_claim_denied
    target: vsc_activities
    meaning: "The administrator denies a repair claim."
    grain: "one row per repair order"
    distinguish_by: [repair_order_number]
    fields:
      activity_date: "denial date"
      repair_order_number: "repair facility's repair order number"
      repair_facility: "repair facility name"
      odometer: "odometer on the repair order"
      component_group: "component group claimed"
      denial_reason: "why the claim was denied"
    triggers: []
  - type: vsc_transferred
    target: service_contracts
    mutation: update
    meaning: "The service contract is transferred to a private buyer of the vehicle after the financing is paid off."
    grain: "one row per transaction"
    fields:
      transferred_to_name: "new owner's name as on the bill of sale"
      transfer_date: "date the transfer was recorded"
    triggers: []
  - type: vsc_cancelled
    target: service_contracts
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The service contract is cancelled before expiration."
    grain: "one row per transaction"
    fields:
      status: "set to cancelled"
      cancellation_reason: "why it was cancelled"
      cancellation_effective_date: "effective date by reason"
      cancellation_odometer: "odometer at the effective date"
      closed_date: "processing date"
    triggers: []
  - type: vsc_refund_issued
    target: vsc_activities
    meaning: "Unearned service-contract price is refunded after a cancellation."
    grain: "one row per cancelled service contract"
    distinguish_by: [refund_method]
    fields:
      activity_date: "refund date"
      amount_usd: "refund amount"
      refund_method: "how the refund was computed"
      refund_disposition: "where the refund went"
      vsc_request_id: "the signed cancellation request, for a voluntary cancellation; empty otherwise"
    account: vsc_price_net
    direction: out
    triggers:
      - event: contract:contract_ancillary_credit
        when: {refund_disposition: credited_to_contract_balance}
        map: {txn_date: activity_date, amount_usd: amount_usd, ancillary_source: vsc_refund, source_record_id: vsc_activity_id}
      - event: deficiency:deficiency_credit_applied
        when: {refund_disposition: credited_to_deficiency_balance}
        map: {txn_date: activity_date, amount_usd: amount_usd, credit_source: vsc_refund, source_record_id: vsc_activity_id}
  - type: vsc_expired
    target: service_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: "The service contract reaches its expiration date or odometer."
    grain: "one row per transaction"
    fields:
      status: "set to expired"
      closed_date: "date coverage ended"
    triggers: []

# ---- derived measures ----
measures:
  - id: vsc_msr_used_ratio
    window: "from enrollment to the cancellation effective date of one service contract"
    measure: "the greater of (calendar days from enrollment_date to the cancellation effective date divided by calendar days from enrollment_date to expiration_date) and ((cancellation_odometer minus odometer_at_sale) divided by (expiration_odometer minus odometer_at_sale)), capped at 1"
  - id: vsc_msr_claims_paid
    window: "life of the service contract"
    measure: "sum of authorized_amount_usd minus deductible_usd over vsc_claim_authorized rows"

# ---- policies ----
policies:
  - id: vsc_agg_multi_holding
    subject: [vsc_enrolled]
    rule: >-
      A service contract covers one financed vehicle: a borrower may hold one on each financed vehicle, without a per-borrower limit, but a vehicle never has more than max_open_contracts_per_vehicle service contract in force.
    eligibility: []
    params: {max_per_customer: null}
  - id: vsc_agg_vehicle_portfolio
    subject: [vsc_cancelled, vsc_refund_issued, vsc_claim_authorized]
    rule: >-
      Claims, limits, deductibles and refunds belong to one service contract and one vehicle; claims on another vehicle of the same borrower never count against this contract's lifetime_claim_limit_usd.
      A service contract and a GAP waiver addendum on the same retail installment contract are cancelled and refunded independently; when the vehicle is a total loss, the service contract's refund (computed as of the date of loss) is also what the GAP benefit excludes, so the refund is computed even when it is credited after the GAP decision.
      Paying the retail installment contract off leaves the service contract in force with the vehicle (auto_cancel_on_payoff), unlike the GAP waiver.
    eligibility: []
  - id: vsc_enrollment_terms
    subject: [vsc_enrolled]
    rule: >-
      A service contract is sold only at contract signing (enrollment_only_at_signing) on a vehicle within the plan's entry_gate age and odometer limits that is not used commercially (commercial_use_excluded), for price_usd financed in the retail installment contract.
      Coverage runs from the enrollment date for term_months and from odometer_at_sale for term_miles, ending at whichever limit comes first (expiry_basis); claims are adjudicated and paid by administrator_name.
    eligibility: []
    params:
      per_tier:
        DriveSure Powertrain: {price_usd: "=price_usd", term_months: "=term_months", term_miles: "=term_miles"}
        DriveSure Powertrain Plus: {price_usd: "=price_usd", term_months: "=term_months", term_miles: "=term_miles"}
        DriveSure Silver: {price_usd: "=price_usd", term_months: "=term_months", term_miles: "=term_miles"}
        DriveSure Gold: {price_usd: "=price_usd", term_months: "=term_months", term_miles: "=term_miles"}
        DriveSure Platinum: {price_usd: "=price_usd", term_months: "=term_months", term_miles: "=term_miles"}
        DriveSure Exclusionary: {price_usd: "=price_usd", term_months: "=term_months", term_miles: "=term_miles"}
  - id: vsc_claim_coverage
    subject: [vsc_claim_authorized, vsc_claim_denied]
    rule: >-
      A repair claim is adjudicated only on a service contract whose status is active.
      A breakdown is covered only when the repair date is later than the enrollment date plus waiting_period_days.
      The waiting period is counted in calendar days starting the day after enrollment_date, and the odometer on the repair order must also exceed odometer_at_sale plus waiting_period_miles.
      A repair order is adjudicated once.
      The claim is authorized when the failed part belongs to the plan's covered_component_groups and not to listed_exclusions, the failure did not begin before enrollment or during the waiting period (pre_existing_conditions_excluded), the repair is done at a facility meeting repair_facility_rule that obtained authorization first (preauthorization_required), maintenance records (maintenance_records_required) meet oil_change_interval_miles where a lubricated part failed, the repair order odometer is below expiration_odometer and the repair date is on or before expiration_date; otherwise it is denied with the first failing reason in the order not_covered_component, waiting_period, expired_coverage, no_preauthorization, missing_maintenance_records, lifetime_limit_reached.
      A complete claim is decided within claim_authorization_business_days business days. Authorized amounts pay labor at no more than labor_rate_cap_usd_per_hour, include teardown and diagnosis when the failure is covered (diagnostic_covered_if_repair_covered), include seals and gaskets replaced in a covered repair only where seals_gaskets_covered is true, and may not take the claims paid (vsc_msr_claims_paid) above lifetime_claim_limit_usd; the borrower pays deductible_usd once per repair visit (deductible_basis) and the administrator pays the facility the rest (claim_payment_method).
      Towing up to towing_per_occurrence_usd, rental at rental_car_per_day_usd for up to rental_car_max_days and trip interruption up to trip_interruption_usd are reimbursed only with an authorized repair; plans with roadside_assistance_included also provide 24-hour roadside assistance.
    eligibility:
      - id: claim_contract_active
        applies_to: [vsc_claim_authorized, vsc_claim_denied]
        kind: state
        condition: "A repair claim is adjudicated only on a service contract whose status is active."
        evidence_fields: [service_contracts.status, service_contracts.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[service_contracts.service_contract_id]]
          action_bindings: {service_contracts.service_contract_id: service_contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active]
      - id: claim_after_waiting_period
        applies_to: [vsc_claim_authorized]
        kind: time
        condition: "A breakdown is covered only when the repair date is later than the enrollment date plus waiting_period_days."
        evidence_fields: [service_contracts.enrollment_date, service_contracts.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[service_contracts.service_contract_id]]
          action_bindings: {service_contracts.service_contract_id: service_contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the enrollment date"
          anchor_source: service_contracts.enrollment_date
          relation: not_before
          duration_source: variants.waiting_period_days
          unit: calendar_days
          counting_rule: "The waiting period is counted in calendar days starting the day after enrollment_date, and the odometer on the repair order must also exceed odometer_at_sale plus waiting_period_miles."
          boundary: exclusive
      - id: one_decision_per_repair_order
        applies_to: [vsc_claim_authorized, vsc_claim_denied]
        kind: dedup
        condition: "A repair order is adjudicated once."
        evidence_fields: [vsc_activities.repair_order_number, vsc_activities.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vsc_activities.service_contract_id, vsc_activities.repair_order_number]]
          action_bindings: {vsc_activities.service_contract_id: service_contract_id, vsc_activities.repair_order_number: repair_order_number}
        dedup_contract:
          table: vsc_activities
          mode: separate_record
          object_bindings: {service_contract_id: service_contract_id, repair_order_number: repair_order_number}
          duplicate_filters: {event_type: [vsc_claim_authorized, vsc_claim_denied]}
          distinct_fields: []
    params:
      per_tier:
        DriveSure Powertrain: {deductible_usd: "=deductible_usd", lifetime_claim_limit_usd: "=lifetime_claim_limit_usd", labor_rate_cap_usd_per_hour: "=labor_rate_cap_usd_per_hour", rental_car_per_day_usd: "=rental_car_per_day_usd"}
        DriveSure Powertrain Plus: {deductible_usd: "=deductible_usd", lifetime_claim_limit_usd: "=lifetime_claim_limit_usd", labor_rate_cap_usd_per_hour: "=labor_rate_cap_usd_per_hour", rental_car_per_day_usd: "=rental_car_per_day_usd"}
        DriveSure Silver: {deductible_usd: "=deductible_usd", lifetime_claim_limit_usd: "=lifetime_claim_limit_usd", labor_rate_cap_usd_per_hour: "=labor_rate_cap_usd_per_hour", rental_car_per_day_usd: "=rental_car_per_day_usd"}
        DriveSure Gold: {deductible_usd: "=deductible_usd", lifetime_claim_limit_usd: "=lifetime_claim_limit_usd", labor_rate_cap_usd_per_hour: "=labor_rate_cap_usd_per_hour", rental_car_per_day_usd: "=rental_car_per_day_usd"}
        DriveSure Platinum: {deductible_usd: "=deductible_usd", lifetime_claim_limit_usd: "=lifetime_claim_limit_usd", labor_rate_cap_usd_per_hour: "=labor_rate_cap_usd_per_hour", rental_car_per_day_usd: "=rental_car_per_day_usd"}
        DriveSure Exclusionary: {deductible_usd: "=deductible_usd", lifetime_claim_limit_usd: "=lifetime_claim_limit_usd", labor_rate_cap_usd_per_hour: "=labor_rate_cap_usd_per_hour", rental_car_per_day_usd: "=rental_car_per_day_usd"}
    measures: [vsc_msr_claims_paid]
  - id: vsc_cancellation
    subject: [vsc_cancelled]
    rule: >-
      A voluntary cancellation (cancellation_reason borrower_voluntary) is processed only under a cancellation request that the borrower has signed (voluntary_cancel_signature_required).
      The cancellation request must be signed no later than voluntary_request_valid_days after the request was created.
      The signature period is counted in calendar days from the date part of created_at, and a signature on the last day is in time; an unsigned request lapses.
      The company cancels without a request when the repossessed vehicle is sold (repossession_sale, auto_cancel_on_repossession_sale), when the vehicle is a total loss (total_loss, auto_cancel_on_total_loss) and when the retail installment contract is unwound (contract_unwound); paying the contract off never cancels the service contract.
      The effective date and odometer follow cancellation_effective_basis for the reason, mileage being measured on the odometer reading of that triggering record (mileage_basis).
    eligibility:
      - id: vsc_signed_request
        applies_to: [vsc_cancelled]
        kind: authorization
        condition: "A voluntary cancellation (cancellation_reason borrower_voluntary) is processed only under a cancellation request that the borrower has signed (voluntary_cancel_signature_required)."
        evidence_fields: [vsc_cancellation_requests.vsc_request_id, vsc_cancellation_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vsc_cancellation_requests.vsc_request_id]]
          action_bindings: {vsc_cancellation_requests.vsc_request_id: vsc_request_id}
      - id: vsc_signed_in_time
        applies_to: [vsc_cancelled]
        kind: time
        condition: "The cancellation request must be signed no later than voluntary_request_valid_days after the request was created."
        evidence_fields: [vsc_cancellation_requests.created_at, vsc_cancellation_requests.signed_at, vsc_cancellation_requests.vsc_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vsc_cancellation_requests.vsc_request_id]]
          action_bindings: {vsc_cancellation_requests.vsc_request_id: vsc_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the request was created"
          anchor_source: vsc_cancellation_requests.created_at
          relation: not_after
          duration_source: variants.voluntary_request_valid_days
          unit: calendar_days
          counting_rule: "The signature period is counted in calendar days from the date part of created_at, and a signature on the last day is in time; an unsigned request lapses."
          boundary: inclusive
  - id: vsc_refund
    subject: [vsc_refund_issued]
    rule: >-
      A refund is issued only on a service contract whose status is cancelled.
      A service contract is refunded once.
      An unwound contract's service contract (unwind_full_refund), and a voluntary cancellation whose signed request is received within free_look_days after enrollment with no claim paid, are refunded in full (refund_method full_free_look).
      Every other cancellation is refunded as price_usd x (1 - vsc_msr_used_ratio), rounded half-up to the cent, less claims already paid (claims_deducted_from_refund, vsc_msr_claims_paid), less cancellation_fee_usd (refund_method pro_rata_time_or_mileage), never below 0.00; a computed refund below min_refund_usd is not issued.
      The refund is issued within refund_processing_days to the first applicable destination in refund_disposition_order: credited_to_contract_balance when the retail installment contract is active, repossessed or charged_off; credited_to_deficiency_balance when it is liquidated and its deficiency account is not closed; otherwise mailed_to_borrower.
    eligibility:
      - id: vsc_refund_cancelled
        applies_to: [vsc_refund_issued]
        kind: state
        condition: "A refund is issued only on a service contract whose status is cancelled."
        evidence_fields: [service_contracts.status, service_contracts.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[service_contracts.service_contract_id]]
          action_bindings: {service_contracts.service_contract_id: service_contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [cancelled]
      - id: vsc_one_refund
        applies_to: [vsc_refund_issued]
        kind: dedup
        condition: "A service contract is refunded once."
        evidence_fields: [vsc_activities.service_contract_id, vsc_activities.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vsc_activities.service_contract_id]]
          action_bindings: {vsc_activities.service_contract_id: service_contract_id}
        dedup_contract:
          table: vsc_activities
          mode: separate_record
          object_bindings: {service_contract_id: service_contract_id}
          duplicate_filters: {event_type: [vsc_refund_issued]}
          distinct_fields: []
    params:
      per_tier:
        DriveSure Powertrain: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd"}
        DriveSure Powertrain Plus: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd"}
        DriveSure Silver: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd"}
        DriveSure Gold: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd"}
        DriveSure Platinum: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd"}
        DriveSure Exclusionary: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd"}
    formula:
      prorated_refund: "max(round(price_usd * (1 - vsc_msr_used_ratio), 2) - vsc_msr_claims_paid - cancellation_fee_usd, 0)"
    measures: [vsc_msr_used_ratio, vsc_msr_claims_paid]
  - id: vsc_transfer
    subject: [vsc_transferred]
    rule: >-
      A service contract may be transferred only while it is active, only after the retail installment contract financing the vehicle is paid off, and only to a private buyer of the vehicle (transfer_allowed), on a request made within transfer_window_days after the private sale, for transfer_fee_usd paid by the borrower.
      A transfer keeps the original expiration date, expiration odometer, claims history and lifetime limit.
    eligibility:
      - id: transfer_contract_active
        applies_to: [vsc_transferred]
        kind: state
        condition: "A service contract may be transferred only while it is active, only after the retail installment contract financing the vehicle is paid off, and only to a private buyer of the vehicle (transfer_allowed), on a request made within transfer_window_days after the private sale, for transfer_fee_usd paid by the borrower."
        evidence_fields: [service_contracts.status, service_contracts.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[service_contracts.service_contract_id]]
          action_bindings: {service_contracts.service_contract_id: service_contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active]
  - id: vsc_expiry
    subject: [vsc_expired]
    rule: >-
      A service contract expires on the earlier of expiration_date and the day the odometer reaches expiration_odometer (expiry_basis); it is then fully earned and never refunded.
      Extensions of the retail installment contract never extend the service contract.
    eligibility: []
