    window_days: >-
      Statement window: a contract past due on the quote date gets past_due_window_days; a contract that is not past due but had a late charge assessed, waived or not, in the rolling recent_late_months months ending on the quote date (records dated later than the same calendar day recent_late_months months before it, or the last day of that month when that day does not exist) gets recent_late_window_days; every other contract gets payoff_quote_valid_days.
    returns_for_cushion: >-
      Funds cushion: when the fee-bearing returns on the contract in the rolling 12 months ending on the quote date reach the tier's returned_payment_restriction_count, restricted_cushion_days are added; when there is at least one but fewer, returned_cushion_days are added; with none, no cushion is added.
    cushion_days: >-
      Funds cushion: when the fee-bearing returns on the contract in the rolling 12 months ending on the quote date reach the tier's returned_payment_restriction_count, restricted_cushion_days are added; when there is at least one but fewer, returned_cushion_days are added; with none, no cushion is added.
    estimate_days_past_due: >-
      Late-charge estimate: when the installment due on next_due_date is past due on the quote date but its late-charge grace period has not ended, the statement adds an estimate of late_charge_pct percent, never more than late_charge_cap_usd, of the scheduled installment, or, when that installment is the final installment (due on maturity_date), of the lesser of the scheduled installment and the principal balance; otherwise no estimate is added.
    late_estimate: >-
      Late-charge estimate: when the installment due on next_due_date is past due on the quote date but its late-charge grace period has not ended, the statement adds an estimate of late_charge_pct percent, never more than late_charge_cap_usd, of the scheduled installment, or, when that installment is the final installment (due on maturity_date), of the lesser of the scheduled installment and the principal balance; otherwise no estimate is added.
    uninsured_record: >-
      Insurance-lapse shortening: when the contract's insurance tracking record is force_placed or in lapse_notice status, placed_cut_days are taken from the days; when it is in neither status but a first or second lapse notice was mailed on it in the rolling 12 months ending on the quote date, lapse_cut_days are taken; otherwise none are taken.
    lapse_notices_12m: >-
      Insurance-lapse shortening: when the contract's insurance tracking record is force_placed or in lapse_notice status, placed_cut_days are taken from the days; when it is in neither status but a first or second lapse notice was mailed on it in the rolling 12 months ending on the quote date, lapse_cut_days are taken; otherwise none are taken.
    insurance_cut_days: >-
      Insurance-lapse shortening: when the contract's insurance tracking record is force_placed or in lapse_notice status, placed_cut_days are taken from the days; when it is in neither status but a first or second lapse notice was mailed on it in the rolling 12 months ending on the quote date, lapse_cut_days are taken; otherwise none are taken.
    recent_check_payments: >-
      Remittance-method days: counting payments posted on the contract whether or not later returned, when a payment by mailed check (payment_channel check_mail) posted on the contract in the rolling remittance_lookback_months months ending on the quote date (records dated later than the same calendar day remittance_lookback_months months before it, or the last day of that month when that day does not exist), mail_days are added; when none did but a one-time draft, card or transfer payment (a payment_channel listed in one_time_channels) did, one_time_days are added; in every other case (only recurring autopay drafts or third-party remittances, payment_channel ach_autopay or third_party_remittance, or no payments posted in that period), none are added.
    recent_one_time_payments: >-
      Remittance-method days: counting payments posted on the contract whether or not later returned, when a payment by mailed check (payment_channel check_mail) posted on the contract in the rolling remittance_lookback_months months ending on the quote date (records dated later than the same calendar day remittance_lookback_months months before it, or the last day of that month when that day does not exist), mail_days are added; when none did but a one-time draft, card or transfer payment (a payment_channel listed in one_time_channels) did, one_time_days are added; in every other case (only recurring autopay drafts or third-party remittances, payment_channel ach_autopay or third_party_remittance, or no payments posted in that period), none are added.
    remittance_days: >-
      Remittance-method days: counting payments posted on the contract whether or not later returned, when a payment by mailed check (payment_channel check_mail) posted on the contract in the rolling remittance_lookback_months months ending on the quote date (records dated later than the same calendar day remittance_lookback_months months before it, or the last day of that month when that day does not exist), mail_days are added; when none did but a one-time draft, card or transfer payment (a payment_channel listed in one_time_channels) did, one_time_days are added; in every other case (only recurring autopay drafts or third-party remittances, payment_channel ach_autopay or third_party_remittance, or no payments posted in that period), none are added.
    quote_weekday: >-
      Business-day anchor: a statement quoted on a Friday adds friday_anchor_days, one quoted on a Saturday adds saturday_anchor_days and one quoted on a Sunday adds sunday_anchor_days, so that its window counts from the following Monday, the day of the week being found as the whole days since reference_monday modulo seven; a statement quoted Monday to Thursday adds none.
    anchor_days: >-
      Business-day anchor: a statement quoted on a Friday adds friday_anchor_days, one quoted on a Saturday adds saturday_anchor_days and one quoted on a Sunday adds sunday_anchor_days, so that its window counts from the following Monday, the day of the week being found as the whole days since reference_monday modulo seven; a statement quoted Monday to Thursday adds none.
    statement_days: >-
      The rules below may replace the number of days or add days to it or take days from it, and may add an amount to the figure; the good-through date is then the quote date plus the resulting days, never earlier than the quote date, and the statement figure is the principal balance plus fees due plus statement interest through that good-through date plus every amount added, rounded half-up to the cent.
    result: >-
      The rules below may replace the number of days or add days to it or take days from it, and may add an amount to the figure; the good-through date is then the quote date plus the resulting days, never earlier than the quote date, and the statement figure is the principal balance plus fees due plus statement interest through that good-through date plus every amount added, rounded half-up to the cent.
  factors:
  - id: statement_window
    effect: parameter
    decides: window_days
    bindings:
    - quote_days_past_due
    - recent_late_charges
    - window_days
    ladder:
    - when: past due on the quote date
      value: K('past_due_window_days')
    - when: >-
        not past due and a late charge assessed in the rolling recent_late_months months ending on the quote date
      value: K('recent_late_window_days')
    - when: otherwise
      value: P('payoff_quote_valid_days')
    baseline:
      window_days: P('payoff_quote_valid_days')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: funds_cushion
    effect: parameter
    decides: cushion_days
    bindings:
    - returns_for_cushion
    - cushion_days
    ladder:
    - when: >-
        fee-bearing returns in the rolling 12 months at or above returned_payment_restriction_count
      value: K('restricted_cushion_days')
    - when: at least one but fewer
      value: K('returned_cushion_days')
    - when: otherwise
      value: '0'
    baseline:
      cushion_days: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: late_estimate_basis
    effect: method
    decides: late_estimate
    bindings:
    - estimate_days_past_due
    - late_estimate
    ladder:
    - when: >-
        installment due on next_due_date past due within its grace period and it is the final installment
      method: >-
        late_charge_pct of the lesser of the scheduled installment and the principal balance, capped
    - when: >-
        installment due on next_due_date past due within its grace period, not the final one
      method: late_charge_pct of the scheduled installment, capped
    - when: otherwise
      method: no estimate
    baseline:
      late_estimate: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: insurance_lapse_shortening
    effect: parameter
    decides: insurance_cut_days
    bindings:
    - uninsured_record
    - lapse_notices_12m
    - insurance_cut_days
    ladder:
    - when: insurance tracking record force_placed or in lapse_notice status
      value: K('placed_cut_days')
    - when: neither, but a first or second lapse notice mailed in the rolling 12 months
      value: K('lapse_cut_days')
    - when: otherwise
      value: '0'
    baseline:
      insurance_cut_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: cpi
  - id: remittance_method_days
    effect: parameter
    decides: remittance_days
    bindings:
    - recent_check_payments
    - recent_one_time_payments
    - remittance_days
    ladder:
    - when: >-
        a mailed-check payment posted (returned or not) in the rolling remittance_lookback_months months
      value: K('mail_days')
    - when: >-
        none, but a one-time draft, card or transfer payment posted then (returned or not)
      value: K('one_time_days')
    - when: every other case (only autopay drafts or third-party remittances, or no payment)
      value: '0'
    baseline:
      remittance_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: business_day_anchor
    effect: parameter
    decides: anchor_days
    bindings:
    - quote_weekday
    - anchor_days
    ladder:
    - when: quoted on a Friday
      value: K('friday_anchor_days')
    - when: quoted on a Saturday
      value: K('saturday_anchor_days')
    - when: quoted on a Sunday
      value: K('sunday_anchor_days')
    - when: otherwise (Monday to Thursday)
      value: '0'
    baseline:
      anchor_days: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      A payoff statement quotes the principal balance plus fees due plus statement interest through its good-through date, rounded half-up to the cent, and its good-through date is the quote date plus payoff_quote_valid_days calendar days.
    params:
    - payoff_quote_valid_days
  inputs:
    history:
    - table: contract_transactions
      aggregate: latest
      field: txn_date
      filters:
        event_type: contract_payment_posted
    - table: contract_transactions
      aggregate: count
      field: contract_txn_id
      within_months: 12
      filters:
        event_type: contract_payment_returned
    - table: contract_transactions
      aggregate: count
      field: contract_txn_id
      within_months: 3
      filters:
        event_type: contract_payment_posted
    - category: cpi
      table: cpi_activities
      aggregate: count
      field: cpi_activity_id
      within_months: 12
      filters:
        event_type: cpi_notice_sent
    cross_category:
    - cpi
- id: contract_ext_borrower_payoff_amount
  base_policy_refs:
  - contract_evt_payment_application
  - contract_evt_payment_channel_fees
  overwrite:
  - base_policy: contract_evt_payment_application
    superseded_clause: >-
      A payment of payment_type payoff must equal the payoff amount on its posting date (principal plus accrued interest plus fees due) and closes the contract.
    replaced_by: >-
      The rules below may add review days; a payoff taken on the posting date is then good through the posting date plus every review day added, its payoff good-through date, and the per diem runs through that date as on a payoff statement, so the payoff amount is the principal balance plus fees due plus payoff interest through the payoff good-through date, rounded half-up to the cent; its principal and fee portions are the principal balance and fees due, the rest is its interest portion, and the payoff closes the contract.
  trigger: on_request
  subject:
  - contract_payment_posted
  computes: amount_usd
  target_tool: authorize_payoff_payment_7f0b790b
  params:
    ach_channels:
    - ach_autopay
    - ach_self_service
    - ach_agent
    ach_return_review_days: 2
    check_return_review_days: 4
    reference_monday: '2026-01-05'
    friday_review_days: 3
    saturday_review_days: 2
    sunday_review_days: 1
    return_window_days: 4
    return_long_days: 30
    return_long_review_days: 1
    reinstated_lookback_months: 24
    reinstated_review_days: 3
    cured_review_days: 1
    beyond_grace_review_days: 3
    within_grace_review_days: 1
  rule: >-
    This policy fixes the amount a borrower pays to pay off an active contract in full on the posting date with a payment of payment_type payoff, which closes the contract with payoff_reason borrower_payoff. A payoff payment is taken only after the contract's records carry a payoff statement quoted on the posting date. The payoff amount is not fixed until each returned payment on the contract that owes a returned-payment fee carries it. The payoff amount is the principal balance plus fees due plus payoff interest through the posting date, rounded half-up to the cent. Payoff interest is simple interest at the contract's apr_pct on the principal balance, actual/365, counted in calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date if none has posted, through the payoff good-through date, the new interest rounded half-up to the cent, together with the unpaid interest carried, or, where that latest posted payment was returned, together with the interest portion its return reversed instead. The rules below may add review days; a payoff taken on the posting date is then good through the posting date plus every review day added, its payoff good-through date, and the per diem runs through that date as on a payoff statement, so the payoff amount is the principal balance plus fees due plus payoff interest through the payoff good-through date, rounded half-up to the cent; its principal and fee portions are the principal balance and fees due, the rest is its interest portion, and the payoff closes the contract. Returned-channel review: when the contract's latest return (the return with the latest return date, and among returns of the same date the one recorded first) is dated in the rolling 12 months ending on the posting date and came through an ACH channel (a payment_channel listed in ach_channels), ach_return_review_days are added; when it is dated in that period and was a mailed check (payment_channel check_mail), check_return_review_days are added; otherwise none are added. Weekend-receipt days: a payoff posted on a Friday adds friday_review_days, one posted on a Saturday adds saturday_review_days and one posted on a Sunday adds sunday_review_days, carrying its good-through date to the following Monday, the day of the week being found as the whole days since reference_monday modulo seven; a payoff posted Monday to Thursday adds none. Recent-return review: when the contract's latest return is dated no more than return_window_days days before the posting date, the review runs to the end of that window, adding return_window_days less the days since the return; when it is dated more than return_window_days but no more than return_long_days days before, return_long_review_days are added; otherwise none are added. Referral-history review: when the contract's repossession case closed as reinstated (a contract is reinstated at most once) closed later than the same calendar day reinstated_lookback_months months before the posting date (the last day of that month when that day does not exist), reinstated_review_days are added; when that is not so but a repossession case on the contract closed as recalled with recall_reason account_brought_current, cured_review_days are added; otherwise none are added. Delinquency review: when the installment due on next_due_date is more than late_charge_grace_days days past due on the posting date, beyond_grace_review_days are added; when it is past due but within its grace period, within_grace_review_days are added; when it is not past due, none are added.
  prerequisite:
  - problem: contract_ext_payoff_statement_amount
    kind: state_gate
    gate: contract_servicing_events.effective_date
    form: state
    policy_source: >-
      A payoff payment is taken only after the contract's records carry a payoff statement quoted on the posting date.
    condition: >-
      contract_servicing_events carries a contract_payoff_quoted row for the contract whose effective_date is the posting date
    resolved_by: issue_payoff_quote_f4f38627
    effect: >-
      the payoff payment may be taken: a statement quoted on the posting date stands on the contract
  - problem: contract_ext_returned_item_fee
    kind: value_input
    gate: payoff_fees
    form: state
    policy_source: >-
      The payoff amount is not fixed until each returned payment on the contract that owes a returned-payment fee carries it.
    condition: >-
      every contract_payment_returned row of the contract whose return_reason is fee-bearing, and that the monthly cap leaves room for, has a contract_fee_assessed row of fee_type returned_payment_fee linked to it, so the fee is in fees_due_usd
    resolved_by: assess_returned_payment_fee_c98c0726
    effect: >-
      payoff_fees (fees_due_usd) includes the booked returned-payment fee, so the payoff amount rises by that fee
  cross_category:
  - category: recovery
    as: branch
    reads:
    - status
    - recall_reason
    - closed_date
    note: >-
      Referral-history review reads the contract's reinstated case (closing date) and whether a case closed as recalled with account_brought_current.
  compute:
  - latest_payment_id: >-
      LATEST('contract_transactions', 'contract_txn_id', date_field='txn_date', event_type='contract_payment_posted')
  - latest_payment_date: >-
      LATEST('contract_transactions', 'txn_date', date_field='txn_date', event_type='contract_payment_posted')
  - interest_start: latest_payment_date if latest_payment_date != None else F('contract_date')
  - latest_payment_returned: >-
      COUNT('contract_transactions', event_type='contract_payment_returned', related_txn_id=latest_payment_id) > 0
  - reversed_interest: >-
      SUM('contract_transactions', 'interest_applied_usd', event_type='contract_payment_returned', related_txn_id=latest_payment_id)
  - carried_interest: reversed_interest if latest_payment_returned else F('unpaid_interest_usd')
  - payoff_fees: F('fees_due_usd')
  - latest_return_date: >-
      LATEST('contract_transactions', 'txn_date', date_field='txn_date', event_type='contract_payment_returned')
  - latest_return_channel: >-
      LATEST('contract_transactions', 'payment_channel', date_field='txn_date', event_type='contract_payment_returned')
  - returned_channel_review: >-
      K('ach_return_review_days') if (latest_return_date != None and MONTHS(latest_return_date, NOW) < 12 and latest_return_channel in K('ach_channels')) else (K('check_return_review_days') if (latest_return_date != None and MONTHS(latest_return_date, NOW) < 12 and latest_return_channel == 'check_mail') else 0)
  - posting_weekday: DAYS(K('reference_monday'), NOW) % 7
  - weekend_days: >-
      K('friday_review_days') if posting_weekday == 4 else (K('saturday_review_days') if posting_weekday == 5 else (K('sunday_review_days') if posting_weekday == 6 else 0))
  - days_since_return: DAYS(latest_return_date, NOW) if latest_return_date != None else 9999
  - recent_return_review: >-
      (K('return_window_days') - days_since_return) if days_since_return <= K('return_window_days') else (K('return_long_review_days') if days_since_return <= K('return_long_days') else 0)
  - reinstated_closed_on: CFIELD('recovery', 'closed_date', contract_id=HID, status='reinstated')
  - cured_case_on_file: >-
      EXISTS('recovery', contract_id=HID, status='recalled', recall_reason='account_brought_current')
  - referral_review: >-
      K('reinstated_review_days') if (reinstated_closed_on != None and MONTHS(reinstated_closed_on, NOW) < K('reinstated_lookback_months')) else (K('cured_review_days') if cured_case_on_file else 0)
  - posting_days_past_due: DAYS(F('next_due_date'), NOW)
  - delinquency_review: >-
      K('beyond_grace_review_days') if posting_days_past_due > P('late_charge_grace_days') else (K('within_grace_review_days') if posting_days_past_due > 0 else 0)
  - review_days: >-
      returned_channel_review + weekend_days + recent_return_review + referral_review + delinquency_review
  - payoff_interest: >-
      carried_interest + RND(F('principal_balance_usd') * F('apr_pct') / 100 * (DAYS(interest_start, NOW) + review_days) / 365, 2)
  - result: RND(F('principal_balance_usd') + payoff_fees + payoff_interest, 2)
  compute_basis:
    latest_payment_id: >-
      Payoff interest is simple interest at the contract's apr_pct on the principal balance, actual/365, counted in calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date if none has posted, through the payoff good-through date, the new interest rounded half-up to the cent, together with the unpaid interest carried, or, where that latest posted payment was returned, together with the interest portion its return reversed instead.
    latest_payment_date: >-
      Payoff interest is simple interest at the contract's apr_pct on the principal balance, actual/365, counted in calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date if none has posted, through the payoff good-through date, the new interest rounded half-up to the cent, together with the unpaid interest carried, or, where that latest posted payment was returned, together with the interest portion its return reversed instead.
    interest_start: >-
      Payoff interest is simple interest at the contract's apr_pct on the principal balance, actual/365, counted in calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date if none has posted, through the payoff good-through date, the new interest rounded half-up to the cent, together with the unpaid interest carried, or, where that latest posted payment was returned, together with the interest portion its return reversed instead.
    latest_payment_returned: >-
      Payoff interest is simple interest at the contract's apr_pct on the principal balance, actual/365, counted in calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date if none has posted, through the payoff good-through date, the new interest rounded half-up to the cent, together with the unpaid interest carried, or, where that latest posted payment was returned, together with the interest portion its return reversed instead.
    reversed_interest: >-
      Payoff interest is simple interest at the contract's apr_pct on the principal balance, actual/365, counted in calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date if none has posted, through the payoff good-through date, the new interest rounded half-up to the cent, together with the unpaid interest carried, or, where that latest posted payment was returned, together with the interest portion its return reversed instead.
    carried_interest: >-
      Payoff interest is simple interest at the contract's apr_pct on the principal balance, actual/365, counted in calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date if none has posted, through the payoff good-through date, the new interest rounded half-up to the cent, together with the unpaid interest carried, or, where that latest posted payment was returned, together with the interest portion its return reversed instead.
    payoff_interest: >-
