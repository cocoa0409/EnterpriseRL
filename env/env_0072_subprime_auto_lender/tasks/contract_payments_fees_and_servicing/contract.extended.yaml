# Product charter: Retail Installment Contracts (indirect auto finance, simple interest).
category: contract
display_name: Retail Installment Contracts

binding:
  holding_table: contracts
  event_tables: [contract_transactions, contract_servicing_events]
  intake_tables: [contract_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance_usd: principal_balance, fees_due_usd: fees_due}

lifecycle:
  states: [pending_funding, active, repossessed, paid_off, liquidated, charged_off, unwound]
  transitions:
    - {from: pending_funding, to: active, by: system, means: "The company funds the dealer for the purchased contract once every funding stipulation is cleared; servicing begins."}
    - {from: pending_funding, to: unwound, by: agent, means: "The deal is cancelled before funding (dealer unwind or stipulations not cleared by the deadline) and the contract is voided with no balance."}
    - {from: active, to: paid_off, by: agent, means: "A payoff payment (or an insurance and GAP settlement) satisfies the full payoff amount and the contract is closed."}
    - {from: active, to: repossessed, by: system, means: "The recovery file records the vehicle as recovered; the contract leaves ordinary servicing."}
    - {from: repossessed, to: active, by: agent, means: "The borrower reinstates the contract by paying the reinstatement amount before the vehicle is sold; the vehicle is released and servicing resumes."}
    - {from: repossessed, to: paid_off, by: agent, means: "The borrower redeems the vehicle by paying the full payoff amount plus recovery expenses before it is sold."}
    - {from: repossessed, to: liquidated, by: system, means: "The repossessed vehicle is sold; net proceeds are applied and any remaining balance moves to a deficiency account."}
    - {from: active, to: charged_off, by: system, means: "An active contract reaches the charge-off delinquency threshold without a repossession assignment and is charged off; the balance remains owed on the contract."}

accounts:
  - key: principal_balance
    unit: USD
    meaning: "Unpaid principal owed on the contract; increases (in) at booking, when a posted payment is returned and when an ancillary charge such as a force-placed insurance premium is capitalised; decreases (out) by the principal portion of payments, ancillary credits, balance transfers to a deficiency account and an unwind."
  - key: fees_due
    unit: USD
    meaning: "Assessed and unpaid contract fees (late charges, returned-payment fees, agent-assisted payment fees, extension fees); increases (in) when a fee is assessed or a fee payment is returned; decreases (out) when a fee is waived or paid (including settlement by transfer to a deficiency account)."

# ---- category-level parameter dictionary ----
parameter_schema:
  min_apr_pct: "Lowest annual percentage rate a contract of this tier may be booked at, percent (simple interest, actual/365)"
  max_apr_pct: "Highest annual percentage rate a contract of this tier may be booked at, percent; the booked APR is also never above the contract state's ceiling in state_apr_ceiling_pct"
  state_apr_ceiling_pct: "Company schedule of the maximum APR the company books by contract state (two-letter code -> percent); a state not listed uses the tier max_apr_pct alone"
  min_term_months: "Shortest scheduled term in months"
  max_term_months: "Longest scheduled term in months"
  min_amount_financed_usd: "Smallest amount financed accepted, USD"
  max_amount_financed_usd: "Largest amount financed for one contract, USD (includes taxes, fees and financed add-on products)"
  max_ltv_pct: "Maximum amount financed as a percent of the vehicle's book value at origination"
  max_backend_pct_of_value: "Maximum combined price of financed add-on products (GAP waiver plus service contract) as a percent of the vehicle's book value"
  max_negative_equity_usd: "Maximum trade-in negative equity that may be rolled into the amount financed, USD"
  max_pti_pct: "Maximum scheduled payment as a percent of verified gross monthly income"
  max_dti_pct: "Maximum total monthly debt obligations, including this payment, as a percent of verified gross monthly income"
  min_monthly_income_usd: "Minimum verified gross monthly income, USD"
  max_vehicle_mileage: "Maximum odometer reading of the financed vehicle at origination, miles"
  max_vehicle_age_years: "Maximum vehicle age at origination, model years counted as contract year minus model year"
  min_down_payment_pct: "Minimum cash or trade equity down payment as a percent of the cash price"
  max_combined_principal_usd: "Maximum combined principal balance of all of a borrower's open contracts after a new contract books, USD (the new contract's tier governs)"
  second_contract_min_installments_paid: "Minimum installments paid on the borrower's existing open contract before a second contract may book, count"
  second_contract_max_days_past_due: "Maximum days past due on the existing open contract when a second contract books, days"
  funding_stip_deadline_days: "Calendar days after the contract date by which the dealer must clear every funding stipulation, after which a pending_funding contract is unwound"
  payment_application_order: "Ordered waterfall applied to every payment other than a payoff (list of buckets)"
  interest_day_count_basis: "Simple-interest accrual basis: daily rate = APR / 365, counted in actual calendar days"
  self_service_payment_fee_usd: "Fee for a payment made through the automated phone line, website or mobile app (channels ach_self_service and debit_card_self_service) and for autopay, USD"
  agent_payment_fee_usd: "Fee for a one-time payment taken by a live representative (channels ach_agent and debit_card_agent), USD"
  agent_fee_exempt_states: "Company schedule of contract states in which the company never charges the agent-assisted payment fee (two-letter codes)"
  debit_card_max_payment_usd: "Largest single debit-card payment accepted, USD"
  returned_payment_restriction_count: "Number of fee-bearing returned payments within returned_payment_restriction_months that places the contract on certified-funds-only status, count"
  returned_payment_restriction_months: "Rolling window for the returned-payment restriction count, months"
  certified_funds_channels: "Payment channels accepted while a contract is on certified-funds-only status (every ACH channel and mailed personal checks are refused)"
  payoff_funds_clearance_business_days: "Business days after posting until payoff funds are final, by payment channel (Monday-Friday excluding federal holidays)"
  late_charge_grace_days: "Calendar days after an installment due date before a late charge may be assessed on that installment"
  late_charge_pct: "Late charge as a percent of the scheduled installment amount"
  late_charge_cap_usd: "Maximum late charge per installment, USD (the charge is the lesser of the percent amount and this cap, rounded half-up to the cent)"
  late_charge_max_per_installment: "Maximum late charges assessed on one installment due date, count"
  returned_payment_fee_usd: "Fee for a payment returned unpaid by the borrower's bank for a fee-bearing return reason, USD"
  returned_payment_fee_monthly_cap: "Maximum returned-payment fees assessed on one contract in one calendar month, count"
  fee_bearing_return_reasons: "Return reasons that carry the returned-payment fee"
  courtesy_waivers_per_12_months: "Courtesy waivers of a late charge or returned-payment fee a representative may grant per rolling 12 months, count"
  courtesy_waiver_max_usd: "Largest single fee a courtesy waiver may cover, USD"
  due_date_change_min_installments_paid: "Minimum installments paid before a due-date change, count"
  due_date_change_max_shift_days: "Maximum calendar days the next due date may move later in one change"
  due_date_change_max_per_12_months: "Maximum due-date changes per rolling 12 months, count"
  due_date_change_max_per_life: "Maximum due-date changes over the life of the contract, count"
  due_date_change_max_days_past_due: "Maximum days past due at the time of the request, days"
  due_day_allowed_range: "Allowed day-of-month values for a due day, inclusive [first, last]"
  extension_min_installments_paid: "Minimum installments paid before an extension, count"
  extension_max_months_per_request: "Maximum installments deferred by one extension, months"
  extension_max_months_per_12_months: "Maximum installments deferred per rolling 12 months, months"
  extension_max_months_per_life: "Maximum installments deferred over the life of the contract, months"
  extension_min_days_since_last: "Minimum calendar days between the effective date of the previous extension and a new one"
  extension_min_days_past_due: "Minimum days past due for a hardship extension, days (0 allows a current account)"
  extension_max_days_past_due: "Maximum days past due for a hardship extension, days"
  extension_fee_usd: "Extension fee per extension agreement, USD"
  extension_first_fee_waived: "Whether the first extension of the contract's life carries no extension fee"
  extension_signature_valid_days: "Calendar days an extension agreement sent for signature remains open before it lapses"
  payoff_quote_valid_days: "Calendar days a payoff quote is good through, counting the quote date as day 0"
  lien_release_business_days: "Business days after payoff funds are final by which the lien is released"
  elt_release_states: "Company schedule of title states in which the lien is released electronically (ELT); all other states receive the paper title by first-class mail"
  scra_rate_cap_pct: "Maximum interest rate during military service on an obligation incurred before service, percent (50 U.S.C. 3937)"
  scra_request_window_days: "Calendar days after the end of military service within which the written rate-cap request must be received (50 U.S.C. 3937)"
  charge_off_days_past_due: "Days past due at which an active contract not assigned for repossession is charged off"

