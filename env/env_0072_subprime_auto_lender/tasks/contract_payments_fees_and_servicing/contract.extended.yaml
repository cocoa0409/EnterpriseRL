# ---- data flow (every write is an event) ----
events:
  - type: contract_booked
    target: contracts
    mutation: create
    meaning: "The company purchases a retail installment contract from a dealer and books it for servicing, pending funding."
    grain: "one row per purchased contract"
    fields:
      customer_id: "the borrower"
      dealer_agreement_id: "the selling dealer's agreement under which the contract was purchased"
      variant_name: "the credit tier assigned at purchase"
      account_number: "the 10-digit account number printed on the borrower's welcome letter"
      contract_date: "date the borrower signed the contract"
      first_payment_date: "due date of the first installment"
      maturity_date: "due date of the final installment"
      term_months: "number of scheduled monthly installments"
      amount_financed_usd: "amount financed disclosed in the Truth in Lending box"
      original_apr_pct: "annual percentage rate disclosed at signing"
      apr_pct: "rate currently charged; equal to original_apr_pct at booking"
      scheduled_payment_usd: "scheduled monthly installment amount"
      due_day: "day of month installments fall due"
      next_due_date: "set to first_payment_date at booking"
      principal_balance_usd: "set to amount_financed_usd at booking"
      fees_due_usd: "set to 0.00 at booking"
      vehicle_vin: "17-character VIN of the financed vehicle"
      vehicle_year: "model year of the vehicle"
      vehicle_description: "make, model and trim of the vehicle"
      vehicle_book_value_usd: "book value used for loan-to-value at origination"
      harborline_score: "Harborline custom credit score at origination"
      state_code: "contract state (the borrower's state at signing, whose law governs the contract)"
      title_state_code: "state in which the vehicle is titled with the company as lienholder"
    account: principal_balance
    direction: in
    triggers: []
  - type: contract_funded
    target: contracts
    mutation: {transition: {from: pending_funding, to: active}}
    meaning: "The dealer is paid for the contract and the contract enters active servicing."
    grain: "one row per transaction"
    fields: {status: "set to active"}
    triggers: []
  - type: contract_unwound
    target: contracts
    mutation: {transition: {from: pending_funding, to: unwound}}
    meaning: "A contract not yet funded is cancelled (deal unwind) and voided with no balance owed."
    grain: "one row per transaction"
    fields:
      status: "set to unwound"
      closed_date: "date the unwind was processed"
      principal_balance_usd: "set to 0.00"
    account: principal_balance
    direction: out
    triggers: []
  - type: contract_payment_posted
    target: contract_transactions
    meaning: "A payment received from the borrower or a third party is posted to the contract and split across interest, installment principal, fees and additional principal."
    grain: "one row per payment received"
    distinguish_by: [txn_date, payment_channel, payment_type, amount_usd]
    fields:
      txn_date: "posting date of the payment"
      amount_usd: "total payment received"
      payment_channel: "channel through which the payment was made"
      payment_type: "what the payment was made for"
      interest_applied_usd: "portion applied to accrued interest"
      principal_applied_usd: "portion applied to principal (installment principal plus additional principal); the delta booked to principal_balance"
      fees_applied_usd: "portion applied to fees due"
    account: principal_balance
    direction: out
    triggers:
      - event: contract:contract_fee_paid
        when: {fees_applied_usd: {not: 0.00}}
        map: {txn_date: txn_date, amount_usd: fees_applied_usd, related_txn_id: contract_txn_id, fee_settlement_method: payment}
      - event: contract:contract_servicing_update
      - event: contract:contract_paid_off
        when: {payment_type: payoff}
        map: {payoff_reason: borrower_payoff}
      - event: recovery:recovery_reinstated
        when: {payment_type: reinstatement}
      - event: recovery:recovery_redeemed
        when: {payment_type: redemption}
  - type: contract_payment_returned
    target: contract_transactions
    meaning: "A posted payment is returned unpaid by the remitting bank and its allocation is reversed."
    grain: "one row per returned payment"
    distinguish_by: [related_txn_id]
    fields:
      txn_date: "date the return was received"
      amount_usd: "amount of the returned payment (equal to the original payment)"
      related_txn_id: "the posted payment being returned"
      return_reason: "bank return reason"
      payment_channel: "channel of the original payment"
      interest_applied_usd: "interest portion reversed (equal to the original payment's portion)"
      principal_applied_usd: "principal portion restored to principal_balance"
      fees_applied_usd: "fee portion restored to fees due"
    account: principal_balance
    direction: in
    triggers:
      - event: contract:contract_fee_assessed
        when: {fees_applied_usd: {not: 0.00}}
        map: {txn_date: txn_date, amount_usd: fees_applied_usd, fee_type: reversed_fee_payment, related_txn_id: contract_txn_id}
      - event: contract:contract_servicing_update
  - type: contract_fee_assessed
    target: contract_transactions
    meaning: "A contract fee is charged to the borrower's fees due."
    grain: "one row per fee per triggering installment or transaction"
    distinguish_by: [fee_type, installment_due_date, related_txn_id, txn_date]
    fields:
      txn_date: "assessment date"
      amount_usd: "fee amount"
      fee_type: "kind of fee"
      installment_due_date: "for a late charge, the due date of the installment it is charged on"
      related_txn_id: "for a returned-payment fee the return row, for an agent-assisted payment fee the payment row, for an extension fee the extension record, for a reversed fee payment the return row"
    account: fees_due
    direction: in
    triggers:
      - event: contract:contract_servicing_update
  - type: contract_fee_waived
    target: contract_transactions
    meaning: "An assessed fee is waived in full and removed from fees due."
    grain: "one row per waived fee"
    distinguish_by: [related_txn_id]
    fields:
      txn_date: "date of the waiver"
      amount_usd: "amount waived (the full unpaid amount of the fee)"
      related_txn_id: "the fee row being waived"
      waiver_reason: "why the fee is waived"
    account: fees_due
    direction: out
    triggers:
      - event: contract:contract_servicing_update
  - type: contract_fee_paid
    target: contract_transactions
    meaning: "Fees due are settled by the fee portion of a payment or by transfer to a deficiency account."
    grain: "one row per settling payment or transfer"
    distinguish_by: [related_txn_id]
    fields:
      txn_date: "settlement date"
      amount_usd: "fees settled"
      related_txn_id: "the payment or balance-transfer row that settled the fees"
      fee_settlement_method: "how the fees were settled"
    account: fees_due
    direction: out
    triggers: []
  - type: contract_ancillary_charge
    target: contract_transactions
    meaning: "A charge originating in another product (a force-placed insurance premium) is added to the contract's principal."
    grain: "one row per originating charge"
    distinguish_by: [source_record_id]
    fields:
      txn_date: "posting date"
      amount_usd: "amount capitalised"
      ancillary_source: "the originating product charge"
      source_record_id: "the originating charge record in the other product"
    account: principal_balance
    direction: in
    triggers:
      - event: contract:contract_servicing_update
  - type: contract_ancillary_credit
    target: contract_transactions
    meaning: "A credit originating in another product (an insurance or add-on refund, a GAP waiver benefit, an SCRA interest credit) reduces the contract's principal."
    grain: "one row per originating credit"
    distinguish_by: [source_record_id]
    fields:
      txn_date: "posting date"
      amount_usd: "amount credited"
      ancillary_source: "the originating credit"
      source_record_id: "the originating refund, benefit or servicing record"
    account: principal_balance
    direction: out
    triggers:
      - event: contract:contract_servicing_update
  - type: contract_balance_transferred
    target: contract_transactions
    meaning: "After a repossessed vehicle is sold, the contract's remaining principal and fees are moved to the borrower's deficiency account."
    grain: "one row per deficiency account opened from the contract"
    distinguish_by: [source_record_id]
    fields:
      txn_date: "transfer date (the sale date)"
      amount_usd: "total moved (principal plus fees)"
      principal_applied_usd: "principal moved; the delta booked to principal_balance"
      fees_applied_usd: "fees moved"
      source_record_id: "the deficiency account receiving the balance"
    account: principal_balance
    direction: out
    triggers:
      - event: contract:contract_fee_paid
        when: {fees_applied_usd: {not: 0.00}}
        map: {txn_date: txn_date, amount_usd: fees_applied_usd, related_txn_id: contract_txn_id, fee_settlement_method: transfer_to_deficiency}
  - type: contract_servicing_update
    target: contracts
    mutation: update
    meaning: "Servicing fields on the contract are refreshed after a posting or a term change."
    grain: "one row per transaction"
    fields:
      principal_balance_usd: "current principal (sum of principal_balance deltas)"
      fees_due_usd: "current fees due (sum of fees_due deltas)"
      partial_installment_credit_usd: "installment credit carried toward the installment due on next_due_date"
      unpaid_interest_usd: "accrued interest a payment did not cover, carried forward"
      next_due_date: "due date of the earliest installment not yet fully paid"
      due_day: "day of month installments fall due"
      maturity_date: "due date of the final installment"
      apr_pct: "rate currently charged"
      scheduled_payment_usd: "scheduled monthly installment"
      certified_funds_only: "whether only certified-funds channels are accepted"
    triggers: []
  - type: contract_due_date_changed
    target: contract_servicing_events
    meaning: "The borrower's monthly due day is moved later at the borrower's request."
    grain: "one row per due-date change"
    distinguish_by: [effective_date, new_due_day]
    fields:
      effective_date: "date the change was made"
      old_due_day: "due day before the change"
      new_due_day: "due day requested by the borrower"
      old_next_due_date: "next due date before the change"
      new_next_due_date: "next due date after the change"
      new_maturity_date: "final installment date after the change"
    triggers:
      - event: contract:contract_servicing_update
        map: {due_day: new_due_day, next_due_date: new_next_due_date, maturity_date: new_maturity_date}
  - type: contract_extension_granted
    target: contract_servicing_events
    meaning: "One or more installments are deferred to the end of the contract under a signed extension agreement."
    grain: "one row per signed extension agreement"
    distinguish_by: [service_request_id]
    fields:
      effective_date: "date the extension was applied"
      service_request_id: "the signed extension agreement"
      extension_months: "installments deferred"
      old_next_due_date: "next due date before the extension"
      new_next_due_date: "next due date after the extension"
      new_maturity_date: "final installment date after the extension"
      fee_treatment: "whether the extension fee is charged or waived"
    triggers:
      - event: contract:contract_servicing_update
        map: {next_due_date: new_next_due_date, maturity_date: new_maturity_date}
      - event: contract:contract_fee_assessed
        when: {fee_treatment: fee_assessed}
        map: {txn_date: effective_date, fee_type: extension_fee, related_txn_id: servicing_event_id}
  - type: contract_scra_rate_adjusted
    target: contract_servicing_events
    meaning: "The Servicemembers Civil Relief Act rate cap is applied to, or ended on, a contract incurred before military service."
    grain: "one row per rate-cap action"
    distinguish_by: [scra_action, effective_date]
    fields:
      effective_date: "date from which the new rate applies"
      service_request_id: "the borrower's written rate-cap request"
      scra_action: "cap applied or cap ended"
      new_apr_pct: "rate charged from the effective date"
      new_scheduled_payment_usd: "installment amount from the effective date"
    triggers:
      - event: contract:contract_servicing_update
        map: {apr_pct: new_apr_pct, scheduled_payment_usd: new_scheduled_payment_usd}
  - type: contract_payoff_quoted
    target: contract_servicing_events
    meaning: "A payoff quote good through a stated date is issued to the borrower or a payoff party."
    grain: "one row per quote issued"
    distinguish_by: [effective_date, quote_good_through_date]
    fields:
      effective_date: "quote date"
      quoted_payoff_usd: "payoff amount good through the good-through date"
      quote_good_through_date: "last date on which the quoted amount pays the contract in full"
    triggers: []
  - type: contract_lien_released
    target: contract_servicing_events
    meaning: "The company's lien on the vehicle title is released after the contract is paid off."
    grain: "one row per lien release"
    distinguish_by: [effective_date]
    fields:
      effective_date: "date the release was sent"
      funds_final_date: "date the payoff funds became final"
      release_method: "electronic release or paper title mailed"
    triggers: []
  - type: contract_paid_off
    target: contracts
    mutation: {transition: [{from: active, to: paid_off}, {from: repossessed, to: paid_off}]}
    meaning: "The contract is satisfied in full and closed."
    grain: "one row per transaction"
    fields:
      status: "set to paid_off"
      closed_date: "date the payoff posted"
      payoff_reason: "how the contract was satisfied"
    triggers:
      - event: contract:contract_lien_released
  - type: contract_repossessed
    target: contracts
    mutation: {transition: {from: active, to: repossessed}}
    meaning: "The financed vehicle has been recovered and the contract is held in repossessed status."
    grain: "one row per transaction"
    fields:
      status: "set to repossessed"
      repossession_date: "date the vehicle was recovered"
    triggers: []
  - type: contract_reinstated
    target: contracts
    mutation: {transition: {from: repossessed, to: active}}
    meaning: "A repossessed contract is reinstated and returns to active servicing."
    grain: "one row per transaction"
    fields: {status: "set to active"}
    triggers: []
  - type: contract_liquidated
    target: contracts
    mutation: {transition: {from: repossessed, to: liquidated}}
    meaning: "The repossessed vehicle has been sold and the contract is closed to servicing."
    grain: "one row per transaction"
    fields:
      status: "set to liquidated"
      closed_date: "sale date"
    triggers: []
  - type: contract_charged_off
    target: contracts
    mutation: {transition: {from: active, to: charged_off}}
    meaning: "A seriously delinquent contract without a repossession is charged off; the balance stays owed and collectible on the contract."
    grain: "one row per transaction"
    fields:
      status: "set to charged_off"
      closed_date: "charge-off date"
    triggers: []

# ---- derived measures ----
# Rolling-window convention used by every contract measure: "rolling 12 months" counts records dated
# later than the same calendar day 12 months before the frozen date (falling back to the last day of
# that month when the day does not exist) and on or before the frozen date.
measures:
  - id: contract_msr_installments_paid
    window: "life of the contract, evaluated at the frozen date"
    measure: "whole calendar months from first_payment_date to next_due_date, minus the sum of extension_months over every contract_extension_granted row of the contract (installments actually paid, excluding deferred ones)"
  - id: contract_msr_days_past_due
    window: "point in time at the frozen date"
    measure: "calendar days from next_due_date to the frozen date when next_due_date is earlier than the frozen date; 0 otherwise"
  - id: contract_msr_installments_due
    window: "point in time at the payment's txn_date"
    measure: "number of installment due dates (next_due_date and each later due date one month apart) that fall on or before the payment's txn_date, but never less than 1 (the installment due on next_due_date always counts)"
  - id: contract_msr_days_since_interest
    window: "from the interest start date to the calculation date"
    measure: "calendar days from the later of contract_date and the txn_date of the latest contract_payment_posted row that has no contract_payment_returned row, to the calculation date (the payment's txn_date, or the quote_good_through_date for a payoff quote)"
  - id: contract_msr_accrued_interest
    window: "same as contract_msr_days_since_interest"
    measure: "unpaid_interest_usd plus principal_balance_usd x apr_pct / 100 x contract_msr_days_since_interest / 365, the new interest rounded half-up to the cent"
  - id: contract_msr_fee_bearing_returns_12m
    window: "rolling 12 months ending on the frozen date"
    measure: "count of contract_payment_returned rows whose return_reason is in fee_bearing_return_reasons"
  - id: contract_msr_returned_fees_in_month
    window: "the calendar month containing the fee's txn_date"
    measure: "count of contract_fee_assessed rows with fee_type returned_payment_fee and no contract_fee_waived row pointing at them"
  - id: contract_msr_courtesy_waivers_12m
    window: "rolling 12 months ending on the frozen date"
    measure: "count of contract_fee_waived rows with waiver_reason courtesy_waiver"
  - id: contract_msr_due_date_changes_12m
    window: "rolling 12 months ending on the frozen date"
    measure: "count of contract_due_date_changed rows by effective_date"
  - id: contract_msr_due_date_changes_life
    window: "life of the contract"
    measure: "count of contract_due_date_changed rows"
  - id: contract_msr_extension_months_12m
    window: "rolling 12 months ending on the frozen date"
    measure: "sum of extension_months over contract_extension_granted rows by effective_date"
  - id: contract_msr_extension_months_life
    window: "life of the contract"
    measure: "sum of extension_months over contract_extension_granted rows"

# ---- policies ----
policies:
  - id: contract_agg_multi_holding
    subject: [contract_booked]
    rule: >-
      A borrower may hold several retail installment contracts, but never more than max_per_customer contracts whose status is pending_funding, active or repossessed at the same time; contracts in paid_off, liquidated, charged_off or unwound status do not count toward the limit.
      A purchase that would exceed the limit is declined at booking and no contract is booked.
      The basis on which a second open contract is admitted, and how open contracts combine, is governed by contract_agg_combined_exposure.
    eligibility: []
    params: {max_per_customer: 2}
  - id: contract_agg_combined_exposure
    subject: [contract_booked]
    rule: >-
      When a borrower already holds an open contract (pending_funding, active or repossessed), a second contract may book only if the existing contract is active, has at least second_contract_min_installments_paid installments paid (contract_msr_installments_paid) and is no more than second_contract_max_days_past_due days past due (contract_msr_days_past_due) on the contract date of the new contract; these thresholds are those of the new contract's tier.
      The combined principal of all open contracts, counting the new contract at its amount financed, may not exceed max_combined_principal_usd of the new contract's tier.
      A repossessed existing contract blocks a second contract outright.
      The open contracts are never cross-collateralised: each contract's payments, fees, extensions and due dates are serviced on that contract alone, and a payment is posted only to the contract the payer names.
    eligibility: []
    params:
      per_tier:
        Tier 6 Fresh Start: {second_contract_min_installments_paid: "=second_contract_min_installments_paid", second_contract_max_days_past_due: "=second_contract_max_days_past_due", max_combined_principal_usd: "=max_combined_principal_usd"}
        Tier 5 Rebuild: {second_contract_min_installments_paid: "=second_contract_min_installments_paid", second_contract_max_days_past_due: "=second_contract_max_days_past_due", max_combined_principal_usd: "=max_combined_principal_usd"}
        Tier 4 Standard: {second_contract_min_installments_paid: "=second_contract_min_installments_paid", second_contract_max_days_past_due: "=second_contract_max_days_past_due", max_combined_principal_usd: "=max_combined_principal_usd"}
        Tier 3 Advantage: {second_contract_min_installments_paid: "=second_contract_min_installments_paid", second_contract_max_days_past_due: "=second_contract_max_days_past_due", max_combined_principal_usd: "=max_combined_principal_usd"}
        Tier 2 Preferred: {second_contract_min_installments_paid: "=second_contract_min_installments_paid", second_contract_max_days_past_due: "=second_contract_max_days_past_due", max_combined_principal_usd: "=max_combined_principal_usd"}
        Tier 1 Select: {second_contract_min_installments_paid: "=second_contract_min_installments_paid", second_contract_max_days_past_due: "=second_contract_max_days_past_due", max_combined_principal_usd: "=max_combined_principal_usd"}
    measures: [contract_msr_installments_paid, contract_msr_days_past_due]
  - id: contract_booking_terms
    subject: [contract_booked, contract_funded, contract_unwound]
    rule: >-
      A contract is purchased at the tier whose Harborline score band (entry_gate) contains the borrower's harborline_score, and its booked terms must sit inside that tier's limits: APR between min_apr_pct and max_apr_pct and never above the contract state's ceiling in state_apr_ceiling_pct, term between min_term_months and max_term_months, amount financed between min_amount_financed_usd and max_amount_financed_usd, amount financed no more than max_ltv_pct of vehicle_book_value_usd, financed add-on products no more than max_backend_pct_of_value of book value, rolled-in negative equity no more than max_negative_equity_usd, payment-to-income no more than max_pti_pct, debt-to-income no more than max_dti_pct, verified income at least min_monthly_income_usd, vehicle mileage no more than max_vehicle_mileage, vehicle age no more than max_vehicle_age_years and a down payment of at least min_down_payment_pct of the cash price.
      A purchase outside any limit is declined; the tier is never changed after booking.
      A booked contract stays in pending_funding until the dealer clears every funding stipulation, and it moves to active when the dealer's initial funding is disbursed.
      A contract still in pending_funding when funding_stip_deadline_days calendar days have passed since the contract date, or whose dealer cancels the deal before funding, is unwound: it is voided with a zero balance and no payment, fee or add-on product survives on it.
      A funded contract can never be unwound; a dealer who wants to reverse a funded deal must repurchase it as a payoff.
    eligibility: []
    params:
      per_tier:
        Tier 6 Fresh Start: {max_apr_pct: "=max_apr_pct", max_term_months: "=max_term_months", max_amount_financed_usd: "=max_amount_financed_usd"}
        Tier 5 Rebuild: {max_apr_pct: "=max_apr_pct", max_term_months: "=max_term_months", max_amount_financed_usd: "=max_amount_financed_usd"}
        Tier 4 Standard: {max_apr_pct: "=max_apr_pct", max_term_months: "=max_term_months", max_amount_financed_usd: "=max_amount_financed_usd"}
        Tier 3 Advantage: {max_apr_pct: "=max_apr_pct", max_term_months: "=max_term_months", max_amount_financed_usd: "=max_amount_financed_usd"}
        Tier 2 Preferred: {max_apr_pct: "=max_apr_pct", max_term_months: "=max_term_months", max_amount_financed_usd: "=max_amount_financed_usd"}
        Tier 1 Select: {max_apr_pct: "=max_apr_pct", max_term_months: "=max_term_months", max_amount_financed_usd: "=max_amount_financed_usd"}
  - id: contract_evt_payment_application
    subject: [contract_payment_posted, contract_fee_paid, contract_servicing_update]
    rule: >-
      A payment may be posted only to a contract whose status is active, repossessed or charged_off.
      Interest is simple interest accrued daily on the principal balance at the contract's current apr_pct on an actual/365 basis (interest_day_count_basis) from the later of the contract date and the date of the latest posted payment that was not returned, plus any unpaid_interest_usd carried from earlier (contract_msr_accrued_interest); interest is never capitalised, and accrued interest a payment does not cover is carried in unpaid_interest_usd.
      Every payment other than a payoff is applied in the order payment_application_order lists: first to accrued interest, then to installment principal up to the amount still needed to satisfy every installment due on or before the payment date (always at least the installment due on next_due_date, contract_msr_installments_due) less any partial installment credit already carried, then to fees due, and any remainder to additional principal.
      The interest and installment-principal portions together are the payment's installment credit: added to partial_installment_credit_usd, each full scheduled_payment_usd of credit satisfies one installment and advances next_due_date by one month on the due day, and the remainder stays as partial credit; additional principal reduces the balance but never advances next_due_date.
      A payment of payment_type payoff must equal the payoff amount on its posting date (principal plus accrued interest plus fees due) and closes the contract.
      A reinstatement or redemption payment on a repossessed contract is applied by the same waterfall, with the amounts the recovery file requires; recovery expenses are not part of the contract balance.
      The fee portion of a payment settles unpaid fees in order of assessment date, oldest first (same-day fees in the order late_charge, returned_payment_fee, agent_payment_fee, extension_fee, reversed_fee_payment), and is recorded as a fee settlement linked to that payment, and the contract's principal, fees due, partial credit and next due date are refreshed after each posting.
    eligibility:
      - id: payment_contract_status
        applies_to: [contract_payment_posted]
        kind: state
        condition: "A payment may be posted only to a contract whose status is active, repossessed or charged_off."
        evidence_fields: [contracts.status, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        state_contract:
          field: contracts.status
          allowed: [active, repossessed, charged_off]
    formula:
      accrued_interest: "contract_msr_accrued_interest"
      interest_applied_usd: "min(amount_usd, accrued_interest)"
      installment_principal: "min(amount_usd - interest_applied_usd, max(scheduled_payment_usd * contract_msr_installments_due - partial_installment_credit_usd - interest_applied_usd, 0))"
      fees_applied_usd: "min(amount_usd - interest_applied_usd - installment_principal, fees_due_usd)"
      principal_applied_usd: "amount_usd - interest_applied_usd - fees_applied_usd"
      installment_credit: "partial_installment_credit_usd + interest_applied_usd + installment_principal"
    measures: [contract_msr_accrued_interest, contract_msr_installments_due, contract_msr_days_since_interest]
  - id: contract_evt_payment_channel_fees
    subject: [contract_payment_posted, contract_fee_assessed]
    rule: >-
      Payments made through the self-service channels (ach_self_service, debit_card_self_service) and autopay carry self_service_payment_fee_usd.
      A one-time payment taken by a live representative (ach_agent, debit_card_agent) carries the tier's agent_payment_fee_usd as a separate agent_payment_fee linked to that payment and dated the same day, except that no agent-assisted fee is charged when the contract's state_code is listed in agent_fee_exempt_states, when the payment is a payoff, reinstatement or redemption, or when the borrower uses a self-service channel instead; the representative must state the fee and offer the free channels before taking the payment.
      A single debit-card payment may not exceed debit_card_max_payment_usd; a larger amount is split by the borrower into several payments or made through another channel.
      A contract whose fee-bearing returned payments within the last returned_payment_restriction_months months (contract_msr_fee_bearing_returns_12m) reach returned_payment_restriction_count is placed on certified-funds-only status, and while certified_funds_only is true only the channels in certified_funds_channels are accepted; the status is lifted once the count falls below the threshold.
      Moneygram, wire and certified-funds payments carry no company fee.
    eligibility: []
    params:
      per_tier:
        Tier 6 Fresh Start: {agent_payment_fee_usd: "=agent_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count", debit_card_max_payment_usd: "=debit_card_max_payment_usd"}
        Tier 5 Rebuild: {agent_payment_fee_usd: "=agent_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count", debit_card_max_payment_usd: "=debit_card_max_payment_usd"}
        Tier 4 Standard: {agent_payment_fee_usd: "=agent_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count", debit_card_max_payment_usd: "=debit_card_max_payment_usd"}
        Tier 3 Advantage: {agent_payment_fee_usd: "=agent_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count", debit_card_max_payment_usd: "=debit_card_max_payment_usd"}
        Tier 2 Preferred: {agent_payment_fee_usd: "=agent_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count", debit_card_max_payment_usd: "=debit_card_max_payment_usd"}
        Tier 1 Select: {agent_payment_fee_usd: "=agent_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count", debit_card_max_payment_usd: "=debit_card_max_payment_usd"}
    measures: [contract_msr_fee_bearing_returns_12m]
  - id: contract_evt_late_charge
    subject: [contract_fee_assessed]
    rule: >-
      A late charge may be assessed only while the contract status is active.
      A late charge on an installment may be assessed only when the assessment date is later than the installment due date plus late_charge_grace_days.
      The grace period is counted in calendar days starting the day after the installment due date, and the installment due date is the contract's next_due_date for the oldest unpaid installment.
      An installment is unpaid when its due date is on or after next_due_date; an installment satisfied by installment credit within its grace period never carries a late charge, even when an earlier late charge or other fee is still unpaid (the Federal Trade Commission Credit Practices Rule, 16 CFR 444.4, forbids pyramiding late charges).
      At most late_charge_max_per_installment late charge is assessed on one installment due date.
      The late charge is the lesser of late_charge_pct of scheduled_payment_usd and late_charge_cap_usd, rounded half-up to the cent; it is recorded with installment_due_date set to the installment's due date.
      Installments deferred by an extension are not due until their new due dates and carry no late charge for the deferred months.
    eligibility:
      - id: late_charge_contract_status
        applies_to: [contract_fee_assessed]
        kind: state
        condition: "A late charge may be assessed only while the contract status is active."
        evidence_fields: [contracts.status, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        state_contract:
          field: contracts.status
          allowed: [active]
      - id: late_charge_grace_elapsed
        applies_to: [contract_fee_assessed]
        kind: time
        condition: "A late charge on an installment may be assessed only when the assessment date is later than the installment due date plus late_charge_grace_days."
        evidence_fields: [contracts.next_due_date, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the installment due date"
          anchor_source: contracts.next_due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days
          unit: calendar_days
          counting_rule: "The grace period is counted in calendar days starting the day after the installment due date, and the installment due date is the contract's next_due_date for the oldest unpaid installment."
          boundary: exclusive
      - id: one_late_charge_per_installment
        applies_to: [contract_fee_assessed]
        kind: dedup
        condition: "At most late_charge_max_per_installment late charge is assessed on one installment due date."
        evidence_fields: [contract_transactions.contract_id, contract_transactions.installment_due_date, contract_transactions.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contract_transactions.contract_id, contract_transactions.installment_due_date]]
          action_bindings: {contract_transactions.contract_id: contract_id, contract_transactions.installment_due_date: installment_due_date}
        dedup_contract:
          table: contract_transactions
          mode: separate_record
          object_bindings: {contract_id: contract_id, installment_due_date: installment_due_date}
          duplicate_filters: {fee_type: [late_charge]}
          distinct_fields: []
    formula:
      late_charge: "min(round(scheduled_payment_usd * late_charge_pct / 100, 2), late_charge_cap_usd)"
  - id: contract_evt_returned_payment
    subject: [contract_payment_returned, contract_fee_assessed]
    rule: >-
      A posted payment can be returned only once.
      The return reverses exactly the interest, principal and fee portions the original payment applied, restores any installment credit it gave (moving next_due_date back where needed), restores unpaid_interest_usd to its value before the returned payment posted, and re-establishes any fee portion as a reversed_fee_payment fee linked to the return.
      A return whose return_reason is in fee_bearing_return_reasons carries returned_payment_fee_usd as a returned_payment_fee linked to the return row and dated on the return date, unless returned_payment_fee_monthly_cap returned-payment fees are already assessed and unwaived on the contract in that calendar month (contract_msr_returned_fees_in_month), in which case no fee is assessed.
      A return for unauthorized_debit or bank_error carries no returned-payment fee, and a returned-payment fee is never charged on a payment that was itself a fee settlement only.
      A late charge that becomes due because the return reopened an installment is assessed under contract_evt_late_charge on its own date; the return itself never backdates a late charge.
      Fee-bearing returns count toward the certified-funds-only threshold in contract_evt_payment_channel_fees.
    eligibility:
      - id: one_return_per_payment
        applies_to: [contract_payment_returned]
        kind: dedup
        condition: "A posted payment can be returned only once."
        evidence_fields: [contract_transactions.related_txn_id, contract_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contract_transactions.related_txn_id]]
          action_bindings: {contract_transactions.related_txn_id: related_txn_id}
        dedup_contract:
          table: contract_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [contract_payment_returned]}
          distinct_fields: []
    params:
      per_tier:
        Tier 6 Fresh Start: {returned_payment_fee_usd: "=returned_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count"}
        Tier 5 Rebuild: {returned_payment_fee_usd: "=returned_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count"}
        Tier 4 Standard: {returned_payment_fee_usd: "=returned_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count"}
        Tier 3 Advantage: {returned_payment_fee_usd: "=returned_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count"}
        Tier 2 Preferred: {returned_payment_fee_usd: "=returned_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count"}
        Tier 1 Select: {returned_payment_fee_usd: "=returned_payment_fee_usd", returned_payment_restriction_count: "=returned_payment_restriction_count"}
    measures: [contract_msr_returned_fees_in_month]
  - id: contract_evt_fee_waiver
    subject: [contract_fee_waived]
    rule: >-
      A fee can be waived only once and only while it remains unpaid.
      A fee shown to be assessed in error (outside the conditions of the policy that charges it) is waived in full with waiver_reason assessed_in_error, at any time and without limit.
      A returned-payment fee is waived with waiver_reason bank_error_confirmed when the borrower's bank confirms in writing that the return was its own error.
      Otherwise a representative may grant a courtesy waiver of one late charge or returned-payment fee of no more than courtesy_waiver_max_usd, and only while the courtesy waivers already granted on the contract in the rolling 12 months (contract_msr_courtesy_waivers_12m) are fewer than the tier's courtesy_waivers_per_12_months; agent-assisted payment fees, extension fees and reversed fee payments are never courtesy-waived.
      A waiver always removes the fee's full unpaid amount; partial waivers are not granted.
    eligibility:
      - id: fee_not_already_waived
        applies_to: [contract_fee_waived]
        kind: dedup
        condition: "A fee can be waived only once and only while it remains unpaid."
        evidence_fields: [contract_transactions.related_txn_id, contract_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contract_transactions.related_txn_id]]
          action_bindings: {contract_transactions.related_txn_id: related_txn_id}
        dedup_contract:
          table: contract_transactions
          mode: separate_record
          object_bindings: {related_txn_id: related_txn_id}
          duplicate_filters: {event_type: [contract_fee_waived]}
          distinct_fields: []
    params:
      per_tier:
        Tier 6 Fresh Start: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        Tier 5 Rebuild: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        Tier 4 Standard: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        Tier 3 Advantage: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        Tier 2 Preferred: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
        Tier 1 Select: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months"}
    measures: [contract_msr_courtesy_waivers_12m]

  - id: contract_due_date_change
    subject: [contract_due_date_changed]
    rule: >-
      A due-date change is made only on a contract whose status is active.
      The borrower asks for the new due day by phone or in writing; no signature and no fee are required.
      The contract must have at least due_date_change_min_installments_paid installments paid (contract_msr_installments_paid) and be no more than due_date_change_max_days_past_due days past due (contract_msr_days_past_due) on the request date.
      Changes already made may not reach due_date_change_max_per_12_months in the rolling 12 months (contract_msr_due_date_changes_12m) or due_date_change_max_per_life over the contract's life (contract_msr_due_date_changes_life).
      The new due day must lie within due_day_allowed_range, and the new next due date is the first date carrying the new due day that is later than the current next_due_date; it may be no more than due_date_change_max_shift_days calendar days later than the current next_due_date, and a due date is never moved earlier.
      The final installment date moves to the new due day in the month that is (remaining installments minus 1) months after the new next due date.
      The scheduled payment does not change; simple interest accrues for the added days and is collected through the ordinary waterfall.
    eligibility:
      - id: due_date_change_contract_status
        applies_to: [contract_due_date_changed]
        kind: state
        condition: "A due-date change is made only on a contract whose status is active."
        evidence_fields: [contracts.status, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        state_contract:
          field: contracts.status
          allowed: [active]
      - id: due_day_requested_by_borrower
        applies_to: [contract_due_date_changed]
        kind: caller_fact
        condition: "The borrower asks for the new due day by phone or in writing; no signature and no fee are required."
        evidence_fields: [contract_servicing_events.new_due_day, contract_servicing_events.contract_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[contract_servicing_events.contract_id]]
          action_bindings: {contract_servicing_events.contract_id: contract_id}
    params:
      per_tier:
        Tier 6 Fresh Start: {due_date_change_min_installments_paid: "=due_date_change_min_installments_paid", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_max_per_12_months: "=due_date_change_max_per_12_months", due_date_change_max_per_life: "=due_date_change_max_per_life", due_date_change_max_days_past_due: "=due_date_change_max_days_past_due"}
        Tier 5 Rebuild: {due_date_change_min_installments_paid: "=due_date_change_min_installments_paid", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_max_per_12_months: "=due_date_change_max_per_12_months", due_date_change_max_per_life: "=due_date_change_max_per_life", due_date_change_max_days_past_due: "=due_date_change_max_days_past_due"}
        Tier 4 Standard: {due_date_change_min_installments_paid: "=due_date_change_min_installments_paid", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_max_per_12_months: "=due_date_change_max_per_12_months", due_date_change_max_per_life: "=due_date_change_max_per_life", due_date_change_max_days_past_due: "=due_date_change_max_days_past_due"}
        Tier 3 Advantage: {due_date_change_min_installments_paid: "=due_date_change_min_installments_paid", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_max_per_12_months: "=due_date_change_max_per_12_months", due_date_change_max_per_life: "=due_date_change_max_per_life", due_date_change_max_days_past_due: "=due_date_change_max_days_past_due"}
        Tier 2 Preferred: {due_date_change_min_installments_paid: "=due_date_change_min_installments_paid", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_max_per_12_months: "=due_date_change_max_per_12_months", due_date_change_max_per_life: "=due_date_change_max_per_life", due_date_change_max_days_past_due: "=due_date_change_max_days_past_due"}
        Tier 1 Select: {due_date_change_min_installments_paid: "=due_date_change_min_installments_paid", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_max_per_12_months: "=due_date_change_max_per_12_months", due_date_change_max_per_life: "=due_date_change_max_per_life", due_date_change_max_days_past_due: "=due_date_change_max_days_past_due"}
    measures: [contract_msr_installments_paid, contract_msr_days_past_due, contract_msr_due_date_changes_12m, contract_msr_due_date_changes_life]
  - id: contract_extension
    subject: [contract_extension_granted]
    rule: >-
      An extension is granted only on a contract whose status is active.
      A contract with a recovery case in pre_repo_review, assigned or recovered status is not eligible for an extension.
      An extension is applied only under an extension agreement of request_type extension that the borrower has signed.
      The extension agreement must be signed no later than extension_signature_valid_days after the request was created.
      The signature period is counted in calendar days from the date part of created_at, and a signature on the last day of the period is in time; an unsigned request lapses and a new request is needed.
      The contract must have at least extension_min_installments_paid installments paid (contract_msr_installments_paid) and be at least extension_min_days_past_due and no more than extension_max_days_past_due days past due (contract_msr_days_past_due) on the effective date.
      One extension defers at most extension_max_months_per_request installments, the installments deferred in the rolling 12 months (contract_msr_extension_months_12m) including this one may not exceed extension_max_months_per_12_months, and over the contract's life (contract_msr_extension_months_life) including this one may not exceed extension_max_months_per_life.
      A new extension may take effect only when its effective date is at least extension_min_days_since_last after the effective date of the previous extension.
      That interval is counted in calendar days from the previous extension's effective_date, and an effective date exactly on the boundary qualifies.
      The extension moves next_due_date and maturity_date later by the number of deferred months on the same due day; the scheduled payment does not change and simple interest keeps accruing on the principal during the deferral.
      The extension fee is extension_fee_usd of the tier and is assessed (fee_treatment fee_assessed) on the effective date, except that where the tier's extension_first_fee_waived is true and the contract has no earlier extension, the fee is waived (fee_treatment fee_waived).
    eligibility:
      - id: extension_contract_status
        applies_to: [contract_extension_granted]
