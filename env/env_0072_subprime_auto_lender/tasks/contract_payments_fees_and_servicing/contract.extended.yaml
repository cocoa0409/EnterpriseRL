    reinstated_review_usd: 15.0
    cured_review_usd: 10.0
  rule: >-
    This policy fixes the fee charged when a hardship extension is applied to an active contract under the borrower's signed extension agreement; the extension moves next_due_date and maturity_date later by the installments the agreement defers, on the same due day. The hardship extension fee is fixed only after the contract's records carry an extension agreement the borrower has signed and that has not yet been applied, naming the installments it defers. The hardship extension fee is not fixed until the contract's oldest unpaid installment carries its late charge whenever that installment's late-charge grace period has ended. The hardship extension fee is the tier's extension_fee_usd, charged once for the agreement and rounded half-up to the cent, and it is waived when the tier's extension_first_fee_waived is true and the contract has no earlier extension. The rules below may replace the charge or the number of charges and may add amounts to the fee or take an amount from it; the hardship extension fee is then the charge times the number of charges, plus every amount added, less every amount taken, never below zero and rounded half-up to the cent once at the end, and it is waived when the tier's extension_first_fee_waived is true and the contract has no earlier extension; the fee is assessed on the effective date with fee_treatment fee_assessed, or recorded with fee_treatment fee_waived when it is zero. Deferral charge schedule: for a contract whose state_code is listed in charge_d_states and whose contract_date is on or after charge_d_effective_date the charge is charge_d_usd, for one listed in charge_e_states whose contract_date is on or after charge_e_effective_date it is charge_e_usd, and for every other contract it is the tier's extension_fee_usd. Number of charges: when the agreement defers more than one installment and the installment due on next_due_date is past due on the effective date and carries partial installment credit, the number of charges is the installments deferred less that partial installment credit divided by the scheduled installment; when it defers more than one installment in any other case, it is the installments deferred; in every other case it is one. Late-charge credit: for a contract whose state_code is listed in credit_full_states and whose contract_date is on or after credit_full_effective_date, the late charges assessed on the installment due on next_due_date, waived or not, are taken from the fee in full; for a contract whose state_code is listed in credit_capped_states, they are taken up to credit_cap_usd; for every other contract nothing is taken. Collections handling charge: when the effective date is more than stage_two_days days after next_due_date the fee adds stage_two_usd; when it is more than late_charge_grace_days but no more than stage_two_days days after next_due_date it adds stage_one_usd; when it is no more than late_charge_grace_days days after next_due_date, or next_due_date is on or after it, it adds nothing. Extended-deferral review charge: when the installments deferred by every earlier extension plus the installments the agreement defers total at least review_high_installments, the fee adds review_high_usd; when they total exactly review_mid_installments, it adds review_mid_usd; when they total fewer than review_mid_installments it adds nothing. Recovery review charge: when the contract's repossession case closed as reinstated (a contract is reinstated at most once) closed later than the same calendar day recovery_window_months months before the effective date (the last day of that month when that day does not exist), the fee adds reinstated_review_usd; when that is not so but a repossession case on the contract closed as recalled with recall_reason account_brought_current, it adds cured_review_usd; otherwise it adds nothing.
  prerequisite:
  - problem: contract_ext_deferral_agreement_months
    kind: value_input
    gate: deferred_installments
    form: state
    policy_source: >-
      The hardship extension fee is fixed only after the contract's records carry an extension agreement the borrower has signed and that has not yet been applied, naming the installments it defers.
    condition: >-
      contract_service_requests carries, for the contract, a row of request_type extension with request_status signed (signed, not yet applied) whose requested_extension_months names the installments the agreement defers
    resolved_by: sign_extension_agreement_772d986b
    effect: >-
      deferred_installments takes the signed agreement's requested_extension_months instead of 0, which sets the charged installments and the lifetime total the extended-deferral review charge reads
  - problem: contract_ext_delinquency_late_charge
    kind: value_input
    gate: oldest_installment_late_charge
    form: state
    policy_source: >-
      The hardship extension fee is not fixed until the contract's oldest unpaid installment carries its late charge whenever that installment's late-charge grace period has ended.
    condition: >-
      when the installment due on next_due_date is more than late_charge_grace_days days past due, contract_transactions carries a contract_fee_assessed row with fee_type late_charge and installment_due_date equal to next_due_date
    resolved_by: assess_late_charge_1a8e6313
    effect: >-
      oldest_installment_late_charge takes the booked late charge instead of 0.00, and the late-charge credit subtracts it from the fee where the contract state's schedule credits it
  cross_category:
  - category: recovery
    as: branch
    reads:
    - status
    - recall_reason
    - closed_date
    note: >-
      The recovery review charge reads the contract's reinstated case (closing date) and whether a case closed as recalled with account_brought_current.
  compute:
  - deferred_installments: >-
      LATEST('contract_service_requests', 'requested_extension_months', date_field='created_at', request_type='extension', request_status='signed') or 0
  - earlier_extensions: COUNT('contract_servicing_events', event_type='contract_extension_granted')
  - first_extension_waiver: 0 if (P('extension_first_fee_waived') and earlier_extensions == 0) else 1
  - per_installment_charge: >-
      K('charge_d_usd') if (F('state_code') in K('charge_d_states') and DAYS(K('charge_d_effective_date'), F('contract_date')) >= 0) else (K('charge_e_usd') if (F('state_code') in K('charge_e_states') and DAYS(K('charge_e_effective_date'), F('contract_date')) >= 0) else P('extension_fee_usd'))
  - charged_installments: >-
      (deferred_installments - F('partial_installment_credit_usd') / F('scheduled_payment_usd')) if (deferred_installments > 1 and DAYS(F('next_due_date'), NOW) > 0 and F('partial_installment_credit_usd') > 0) else (deferred_installments if deferred_installments > 1 else 1)
  - oldest_installment_late_charge: >-
      SUM('contract_transactions', 'amount_usd', event_type='contract_fee_assessed', fee_type='late_charge', installment_due_date=F('next_due_date'))
  - late_charge_credit: >-
      oldest_installment_late_charge if (F('state_code') in K('credit_full_states') and DAYS(K('credit_full_effective_date'), F('contract_date')) >= 0) else (MN(oldest_installment_late_charge, K('credit_cap_usd')) if F('state_code') in K('credit_capped_states') else 0)
  - days_past_due_at_effect: DAYS(F('next_due_date'), NOW)
  - collections_handling: >-
      K('stage_two_usd') if days_past_due_at_effect > K('stage_two_days') else (K('stage_one_usd') if days_past_due_at_effect > P('late_charge_grace_days') else 0)
  - earlier_deferred: >-
      SUM('contract_servicing_events', 'extension_months', event_type='contract_extension_granted')
  - review_charge: >-
      K('review_high_usd') if earlier_deferred + deferred_installments >= K('review_high_installments') else (K('review_mid_usd') if earlier_deferred + deferred_installments == K('review_mid_installments') else 0)
  - reinstated_closed: CFIELD('recovery', 'closed_date', contract_id=HID, status='reinstated')
  - cured_case_on_file: >-
      EXISTS('recovery', contract_id=HID, status='recalled', recall_reason='account_brought_current')
  - recovery_review: >-
      K('reinstated_review_usd') if (reinstated_closed != None and MONTHS(reinstated_closed, NOW) < K('recovery_window_months')) else (K('cured_review_usd') if cured_case_on_file else 0)
  - gross_deferral_charge: per_installment_charge * charged_installments
  - result: >-
      RND(MX(0, gross_deferral_charge + collections_handling + review_charge + recovery_review - late_charge_credit) * first_extension_waiver, 2)
  compute_basis:
    deferred_installments: >-
      The hardship extension fee is fixed only after the contract's records carry an extension agreement the borrower has signed and that has not yet been applied, naming the installments it defers.
    earlier_extensions: >-
      The hardship extension fee is the tier's extension_fee_usd, charged once for the agreement and rounded half-up to the cent, and it is waived when the tier's extension_first_fee_waived is true and the contract has no earlier extension.
