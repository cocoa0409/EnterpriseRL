  factors:
  - id: deferral_charge_schedule
    effect: parameter
    decides: per_installment_charge
    bindings:
    - per_installment_charge
    ladder:
    - when: >-
        contract state listed in charge_d_states and contract signed on or after charge_d_effective_date
      value: K('charge_d_usd')
    - when: >-
        contract state listed in charge_e_states and contract signed on or after charge_e_effective_date
      value: K('charge_e_usd')
    - when: otherwise
      value: P('extension_fee_usd')
    baseline:
      per_installment_charge: P('extension_fee_usd')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: charge_units
    effect: method
    decides: charged_installments
    bindings:
    - charged_installments
    ladder:
    - when: >-
        more than one installment deferred and the installment due on next_due_date past due and carrying partial installment credit
      method: installments deferred less partial credit divided by the scheduled installment
    - when: more than one installment deferred in any other case
      method: the installments deferred
    - when: otherwise
      method: one charge
    baseline:
      charged_installments: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: late_charge_credit_rule
    effect: method
    decides: late_charge_credit
    bindings:
    - oldest_installment_late_charge
    - late_charge_credit
    ladder:
    - when: >-
        contract state listed in credit_full_states and contract signed on or after credit_full_effective_date
      method: credit the late charges on the installment due on next_due_date in full
    - when: contract state listed in credit_capped_states
      method: credit those late charges up to credit_cap_usd
    - when: otherwise
      method: no credit
    baseline:
      late_charge_credit: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: collections_stage
    effect: parameter
    decides: collections_handling
    bindings:
    - days_past_due_at_effect
    - collections_handling
    ladder:
    - when: effective date more than stage_two_days days after next_due_date
      value: K('stage_two_usd')
    - when: >-
        more than late_charge_grace_days but no more than stage_two_days days after next_due_date
      value: K('stage_one_usd')
    - when: otherwise
      value: '0'
    baseline:
      collections_handling: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: extended_deferral_review
    effect: parameter
    decides: review_charge
    bindings:
    - earlier_deferred
    - review_charge
    ladder:
    - when: >-
        earlier deferred plus this agreement's installments at least review_high_installments
      value: K('review_high_usd')
    - when: exactly review_mid_installments
      value: K('review_mid_usd')
    - when: otherwise
      value: '0'
    baseline:
      review_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: recovery_history_review
    effect: parameter
    decides: recovery_review
    bindings:
    - reinstated_closed
    - cured_case_on_file
    - recovery_review
    ladder:
    - when: >-
        the contract's reinstated repossession case closed within recovery_window_months months of the effective date
      value: K('reinstated_review_usd')
    - when: >-
        not so, but a repossession case on the contract closed as recalled with account_brought_current
      value: K('cured_review_usd')
    - when: otherwise
      value: '0'
    baseline:
      recovery_review: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: recovery
  baseline:
    rule: >-
      The hardship extension fee is the tier's extension_fee_usd, charged once for the agreement and rounded half-up to the cent, and it is waived when the tier's extension_first_fee_waived is true and the contract has no earlier extension.
    params:
    - extension_fee_usd
    - extension_first_fee_waived
  inputs:
    history:
    - table: contract_service_requests
      aggregate: latest
      field: requested_extension_months
      filters:
        request_type: extension
        request_status: signed
    - table: contract_servicing_events
      aggregate: sum
      field: extension_months
      filters:
        event_type: contract_extension_granted
    - table: contract_transactions
      aggregate: sum
      field: amount_usd
      filters:
        event_type: contract_fee_assessed
        fee_type: late_charge
    cross_category:
    - recovery
- id: contract_ext_returned_item_fee
  base_policy_refs:
  - contract_evt_returned_payment
  overwrite:
  - base_policy: contract_evt_returned_payment
    superseded_clause: >-
      A return whose return_reason is in fee_bearing_return_reasons carries returned_payment_fee_usd as a returned_payment_fee linked to the return row and dated on the return date, unless returned_payment_fee_monthly_cap returned-payment fees are already assessed and unwaived on the contract in that calendar month (contract_msr_returned_fees_in_month), in which case no fee is assessed.
    replaced_by: >-
      A fee-bearing return carries the returned-payment fee worked out below as a returned_payment_fee linked to the return row and dated on the return date, unless returned_payment_fee_monthly_cap returned-payment fees are already assessed and unwaived on the contract in that calendar month, in which case no fee is assessed.
  trigger: state_due
  subject:
  - contract_payment_returned
  computes: amount_usd
  target_tool: assess_returned_payment_fee_c98c0726
  params:
    tiered_fee_states:
    - AL
    - FL
    - MS
    - LA
    tier_high_amount_usd: 300.0
    tier_high_fee_usd: 30.0
    tier_mid_amount_usd: 50.0
    tier_mid_fee_usd: 27.5
    repeat_many_usd: 10.0
    repeat_one_usd: 5.0
    stop_payment_usd: 10.0
    account_closed_usd: 5.0
    agent_channels:
    - ach_agent
    - debit_card_agent
    autopay_return_credit_usd: 5.0
    restriction_review_usd: 10.0
    restriction_warning_usd: 5.0
    bank_charge_states:
    - FL
    - GA
    - LA
    bank_charge_effective_date: '2020-07-01'
    ach_channels:
    - ach_autopay
    - ach_self_service
    - ach_agent
    ach_bank_charge_usd: 2.5
    check_bank_charge_usd: 4.0
    cap_high_states:
    - FL
    - LA
    cap_high_usd: 40.0
    cap_low_states:
    - AL
    - MS
    - GA
    cap_low_usd: 30.0
  rule: >-
    This policy fixes the returned-payment fee booked on the contract's latest returned payment (the return with the latest return date, and among returns of the same date the one recorded first) when its return_reason is in fee_bearing_return_reasons; when the fee worked out below is zero, no fee is booked. A fee-bearing return carries the returned-payment fee worked out below as a returned_payment_fee linked to the return row and dated on the return date, unless returned_payment_fee_monthly_cap returned-payment fees are already assessed and unwaived on the contract in that calendar month, in which case no fee is assessed. The returned-payment fee is the tier's returned_payment_fee_usd, rounded half-up to the cent. The rules below may replace the fee amount and may add amounts to it or take an amount from it; the returned-payment fee is then that amount plus every amount added, less every amount taken, never below zero and never above the state cap, rounded half-up to the cent once at the end. Returned-item fee schedule: for a contract whose state_code is listed in tiered_fee_states, a returned payment of more than tier_high_amount_usd sets the fee amount at tier_high_fee_usd and one of more than tier_mid_amount_usd up to tier_high_amount_usd sets it at tier_mid_fee_usd; for every other returned payment the fee amount is the tier's returned_payment_fee_usd. Subsequent-return charge: counting the fee-bearing returns on the contract in the rolling 12 months other than this one, two or more add repeat_many_usd, exactly one adds repeat_one_usd, and none adds nothing. Return-reason charge: a return for stop_payment adds stop_payment_usd, a return for account_closed adds account_closed_usd, and a return for any other fee-bearing reason adds nothing. Failed-payment offset: when the returned payment was taken by a representative (a payment_channel listed in agent_channels) and an agent-assisted payment fee was charged on it, waived or not, that agent-assisted fee is taken from the returned-payment fee; when the returned payment was a recurring autopay draft (payment_channel ach_autopay), autopay_return_credit_usd is taken; otherwise nothing is taken. Bank-charge recovery: for a contract whose state_code is listed in bank_charge_states and a return dated on or after bank_charge_effective_date, a returned ACH payment (a payment_channel listed in ach_channels) adds ach_bank_charge_usd and a returned mailed check (payment_channel check_mail) adds check_bank_charge_usd, the bank's own charge for the returned item; every other return adds nothing. Restriction review charge: when the fee-bearing returns on the contract in the rolling 12 months, this one included, reach the tier's returned_payment_restriction_count, restriction_review_usd is added; when they are exactly one fewer, restriction_warning_usd is added; otherwise nothing is added. State cap: the returned-payment fee is never more than cap_high_usd for a contract whose state_code is listed in cap_high_states and never more than cap_low_usd for one listed in cap_low_states, the company's schedule of state returned-check charge limits; a contract in any other state has no cap beyond these rules.
  prerequisite: []
  cross_category: []
  compute:
  - returned_payment_id: >-
      LATEST('contract_transactions', 'related_txn_id', date_field='txn_date', event_type='contract_payment_returned')
  - returned_amount: >-
      LATEST('contract_transactions', 'amount_usd', date_field='txn_date', event_type='contract_payment_returned')
  - schedule_fee: >-
      K('tier_high_fee_usd') if (F('state_code') in K('tiered_fee_states') and returned_amount > K('tier_high_amount_usd')) else (K('tier_mid_fee_usd') if (F('state_code') in K('tiered_fee_states') and returned_amount > K('tier_mid_amount_usd')) else P('returned_payment_fee_usd'))
  - earlier_fee_bearing_returns: >-
      COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='insufficient_funds') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='account_closed') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='stop_payment') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='uncollected_funds') - 1
  - repeat_charge: >-
      K('repeat_many_usd') if earlier_fee_bearing_returns >= 2 else (K('repeat_one_usd') if earlier_fee_bearing_returns == 1 else 0)
  - return_reason_value: >-
      LATEST('contract_transactions', 'return_reason', date_field='txn_date', event_type='contract_payment_returned')
  - reason_charge: >-
      K('stop_payment_usd') if return_reason_value == 'stop_payment' else (K('account_closed_usd') if return_reason_value == 'account_closed' else 0)
  - returned_channel: >-
      LATEST('contract_transactions', 'payment_channel', date_field='txn_date', event_type='contract_payment_returned')
  - agent_fee_on_returned: >-
      SUM('contract_transactions', 'amount_usd', event_type='contract_fee_assessed', fee_type='agent_payment_fee', related_txn_id=returned_payment_id)
  - failed_payment_offset: >-
      agent_fee_on_returned if (returned_channel in K('agent_channels') and agent_fee_on_returned > 0) else (K('autopay_return_credit_usd') if returned_channel == 'ach_autopay' else 0)
  - return_date: >-
      LATEST('contract_transactions', 'txn_date', date_field='txn_date', event_type='contract_payment_returned')
  - fee_bearing_returns_12m: >-
      COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='insufficient_funds') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='account_closed') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='stop_payment') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='uncollected_funds')
  - restriction_charge: >-
      K('restriction_review_usd') if fee_bearing_returns_12m >= P('returned_payment_restriction_count') else (K('restriction_warning_usd') if fee_bearing_returns_12m == P('returned_payment_restriction_count') - 1 else 0)
  - bank_charge: >-
      K('ach_bank_charge_usd') if (F('state_code') in K('bank_charge_states') and DAYS(K('bank_charge_effective_date'), return_date) >= 0 and returned_channel in K('ach_channels')) else (K('check_bank_charge_usd') if (F('state_code') in K('bank_charge_states') and DAYS(K('bank_charge_effective_date'), return_date) >= 0 and returned_channel == 'check_mail') else 0)
  - uncapped_fee: >-
      MX(0, schedule_fee + repeat_charge + reason_charge + bank_charge + restriction_charge - failed_payment_offset)
  - result: >-
      RND(MN(K('cap_high_usd'), uncapped_fee) if F('state_code') in K('cap_high_states') else (MN(K('cap_low_usd'), uncapped_fee) if F('state_code') in K('cap_low_states') else uncapped_fee), 2)
  compute_basis:
    returned_payment_id: >-
      This policy fixes the returned-payment fee booked on the contract's latest returned payment (the return with the latest return date, and among returns of the same date the one recorded first) when its return_reason is in fee_bearing_return_reasons; when the fee worked out below is zero, no fee is booked.
    returned_amount: >-
      Returned-item fee schedule: for a contract whose state_code is listed in tiered_fee_states, a returned payment of more than tier_high_amount_usd sets the fee amount at tier_high_fee_usd and one of more than tier_mid_amount_usd up to tier_high_amount_usd sets it at tier_mid_fee_usd; for every other returned payment the fee amount is the tier's returned_payment_fee_usd.
    schedule_fee: >-
      Returned-item fee schedule: for a contract whose state_code is listed in tiered_fee_states, a returned payment of more than tier_high_amount_usd sets the fee amount at tier_high_fee_usd and one of more than tier_mid_amount_usd up to tier_high_amount_usd sets it at tier_mid_fee_usd; for every other returned payment the fee amount is the tier's returned_payment_fee_usd.
    earlier_fee_bearing_returns: >-
      Subsequent-return charge: counting the fee-bearing returns on the contract in the rolling 12 months other than this one, two or more add repeat_many_usd, exactly one adds repeat_one_usd, and none adds nothing.
    repeat_charge: >-
      Subsequent-return charge: counting the fee-bearing returns on the contract in the rolling 12 months other than this one, two or more add repeat_many_usd, exactly one adds repeat_one_usd, and none adds nothing.
    return_reason_value: >-
      Return-reason charge: a return for stop_payment adds stop_payment_usd, a return for account_closed adds account_closed_usd, and a return for any other fee-bearing reason adds nothing.
    reason_charge: >-
      Return-reason charge: a return for stop_payment adds stop_payment_usd, a return for account_closed adds account_closed_usd, and a return for any other fee-bearing reason adds nothing.
    returned_channel: >-
      Failed-payment offset: when the returned payment was taken by a representative (a payment_channel listed in agent_channels) and an agent-assisted payment fee was charged on it, waived or not, that agent-assisted fee is taken from the returned-payment fee; when the returned payment was a recurring autopay draft (payment_channel ach_autopay), autopay_return_credit_usd is taken; otherwise nothing is taken.
    agent_fee_on_returned: >-
      Failed-payment offset: when the returned payment was taken by a representative (a payment_channel listed in agent_channels) and an agent-assisted payment fee was charged on it, waived or not, that agent-assisted fee is taken from the returned-payment fee; when the returned payment was a recurring autopay draft (payment_channel ach_autopay), autopay_return_credit_usd is taken; otherwise nothing is taken.
    failed_payment_offset: >-
      Failed-payment offset: when the returned payment was taken by a representative (a payment_channel listed in agent_channels) and an agent-assisted payment fee was charged on it, waived or not, that agent-assisted fee is taken from the returned-payment fee; when the returned payment was a recurring autopay draft (payment_channel ach_autopay), autopay_return_credit_usd is taken; otherwise nothing is taken.
    return_date: >-
      Bank-charge recovery: for a contract whose state_code is listed in bank_charge_states and a return dated on or after bank_charge_effective_date, a returned ACH payment (a payment_channel listed in ach_channels) adds ach_bank_charge_usd and a returned mailed check (payment_channel check_mail) adds check_bank_charge_usd, the bank's own charge for the returned item; every other return adds nothing.
    fee_bearing_returns_12m: >-
      Restriction review charge: when the fee-bearing returns on the contract in the rolling 12 months, this one included, reach the tier's returned_payment_restriction_count, restriction_review_usd is added; when they are exactly one fewer, restriction_warning_usd is added; otherwise nothing is added.
    restriction_charge: >-
      Restriction review charge: when the fee-bearing returns on the contract in the rolling 12 months, this one included, reach the tier's returned_payment_restriction_count, restriction_review_usd is added; when they are exactly one fewer, restriction_warning_usd is added; otherwise nothing is added.
    result: >-
      State cap: the returned-payment fee is never more than cap_high_usd for a contract whose state_code is listed in cap_high_states and never more than cap_low_usd for one listed in cap_low_states, the company's schedule of state returned-check charge limits; a contract in any other state has no cap beyond these rules.
    bank_charge: >-
      Bank-charge recovery: for a contract whose state_code is listed in bank_charge_states and a return dated on or after bank_charge_effective_date, a returned ACH payment (a payment_channel listed in ach_channels) adds ach_bank_charge_usd and a returned mailed check (payment_channel check_mail) adds check_bank_charge_usd, the bank's own charge for the returned item; every other return adds nothing.
    uncapped_fee: >-
      The rules below may replace the fee amount and may add amounts to it or take an amount from it; the returned-payment fee is then that amount plus every amount added, less every amount taken, never below zero and never above the state cap, rounded half-up to the cent once at the end.
  factors:
  - id: return_fee_schedule
    effect: parameter
    decides: schedule_fee
    bindings:
    - returned_amount
    - schedule_fee
    ladder:
    - when: >-
        contract state listed in tiered_fee_states and returned payment above tier_high_amount_usd
      value: K('tier_high_fee_usd')
    - when: >-
        contract state listed in tiered_fee_states and returned payment above tier_mid_amount_usd up to tier_high_amount_usd
      value: K('tier_mid_fee_usd')
    - when: otherwise
      value: P('returned_payment_fee_usd')
    baseline:
      schedule_fee: P('returned_payment_fee_usd')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: subsequent_return_charge
    effect: parameter
    decides: repeat_charge
    bindings:
    - earlier_fee_bearing_returns
    - repeat_charge
    ladder:
    - when: two or more other fee-bearing returns in the rolling 12 months
      value: K('repeat_many_usd')
    - when: exactly one
      value: K('repeat_one_usd')
    - when: otherwise (none)
      value: '0'
    baseline:
      repeat_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: return_reason_charge
    effect: parameter
    decides: reason_charge
    bindings:
    - return_reason_value
    - reason_charge
    ladder:
    - when: return_reason stop_payment
      value: K('stop_payment_usd')
    - when: return_reason account_closed
      value: K('account_closed_usd')
    - when: otherwise
      value: '0'
    baseline:
      reason_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: failed_payment_offset_rule
    effect: method
    decides: failed_payment_offset
    bindings:
    - agent_fee_on_returned
    - failed_payment_offset
    ladder:
    - when: >-
        returned payment taken by a representative with an agent-assisted fee charged on it, waived or not
      method: subtract that agent-assisted fee
    - when: returned payment was a recurring autopay draft
      method: subtract autopay_return_credit_usd
    - when: otherwise
      method: subtract nothing
    baseline:
      failed_payment_offset: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: restriction_review_charge
    effect: parameter
    decides: restriction_charge
    bindings:
    - fee_bearing_returns_12m
    - restriction_charge
    ladder:
    - when: >-
        fee-bearing returns in the rolling 12 months, this one included, at or above returned_payment_restriction_count
      value: K('restriction_review_usd')
    - when: exactly one fewer
      value: K('restriction_warning_usd')
    - when: otherwise
      value: '0'
    baseline:
      restriction_charge: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: bank_charge_recovery
    effect: parameter
    decides: bank_charge
    bindings:
    - bank_charge
    ladder:
    - when: >-
        state listed in bank_charge_states, return dated on or after bank_charge_effective_date, returned ACH payment
      value: K('ach_bank_charge_usd')
    - when: same states and dates, returned mailed check
      value: K('check_bank_charge_usd')
    - when: otherwise
      value: '0'
    baseline:
      bank_charge: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The returned-payment fee is the tier's returned_payment_fee_usd, rounded half-up to the cent.
    params:
    - returned_payment_fee_usd
  inputs:
    history:
    - table: contract_transactions
      aggregate: latest
      field: amount_usd
      filters:
        event_type: contract_payment_returned
    - table: contract_transactions
      aggregate: count
      field: contract_txn_id
      within_months: 12
      filters:
        event_type: contract_payment_returned
    - table: contract_transactions
      aggregate: sum
      field: amount_usd
      filters:
        event_type: contract_fee_assessed
        fee_type: agent_payment_fee
    cross_category: []
- id: contract_ext_payoff_statement_amount
  base_policy_refs:
  - contract_payoff_and_lien_release
  overwrite:
  - base_policy: contract_payoff_and_lien_release
    superseded_clause: >-
      The quoted payoff is principal_balance_usd plus fees_due_usd plus simple interest accrued through the quote_good_through_date (contract_msr_accrued_interest with the good-through date as the calculation date), and the good-through date is the quote date plus payoff_quote_valid_days calendar days;
    replaced_by: >-
      The rules below may replace the number of days or add days to it or take days from it, and may add an amount to the figure; the good-through date is then the quote date plus the resulting days, never earlier than the quote date, and the statement figure is the principal balance plus fees due plus statement interest through that good-through date plus every amount added, rounded half-up to the cent.
  trigger: on_request
  subject:
  - contract_payoff_quoted
  computes: quoted_payoff_usd
  target_tool: issue_payoff_quote_f4f38627
  params:
    past_due_window_days: 5
    recent_late_months: 6
    recent_late_window_days: 7
    restricted_cushion_days: 1
    returned_cushion_days: 3
    placed_cut_days: 5
    lapse_cut_days: 2
    remittance_lookback_months: 3
    mail_days: 5
    one_time_days: 1
    one_time_channels:
    - ach_self_service
    - ach_agent
    - debit_card_self_service
    - debit_card_agent
    - moneygram
    - wire_transfer
    - certified_funds
    reference_monday: '2026-01-05'
    friday_anchor_days: 3
    saturday_anchor_days: 2
    sunday_anchor_days: 1
  rule: >-
    This policy fixes the payoff figure and the good-through date a payoff statement quotes for a contract whose status is active, repossessed or charged_off; a statement moves no balance. A payoff statement's figure is fixed only after each returned payment on the contract that owes a returned-payment fee carries it. A payoff statement quotes the principal balance plus fees due plus statement interest through its good-through date, rounded half-up to the cent, and its good-through date is the quote date plus payoff_quote_valid_days calendar days. Statement interest is simple interest at the contract's apr_pct on the principal balance on an actual/365 basis for the calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date when none has posted, to the good-through date, the new interest rounded half-up to the cent, plus the unpaid interest carried; when that latest posted payment was itself returned, the interest portion its return reversed is counted in place of the unpaid interest carried. The rules below may replace the number of days or add days to it or take days from it, and may add an amount to the figure; the good-through date is then the quote date plus the resulting days, never earlier than the quote date, and the statement figure is the principal balance plus fees due plus statement interest through that good-through date plus every amount added, rounded half-up to the cent. Statement window: a contract past due on the quote date gets past_due_window_days; a contract that is not past due but had a late charge assessed, waived or not, in the rolling recent_late_months months ending on the quote date (records dated later than the same calendar day recent_late_months months before it, or the last day of that month when that day does not exist) gets recent_late_window_days; every other contract gets payoff_quote_valid_days. Funds cushion: when the fee-bearing returns on the contract in the rolling 12 months ending on the quote date reach the tier's returned_payment_restriction_count, restricted_cushion_days are added; when there is at least one but fewer, returned_cushion_days are added; with none, no cushion is added. Late-charge estimate: when the installment due on next_due_date is past due on the quote date but its late-charge grace period has not ended, the statement adds an estimate of late_charge_pct percent, never more than late_charge_cap_usd, of the scheduled installment, or, when that installment is the final installment (due on maturity_date), of the lesser of the scheduled installment and the principal balance; otherwise no estimate is added. Insurance-lapse shortening: when the contract's insurance tracking record is force_placed or in lapse_notice status, placed_cut_days are taken from the days; when it is in neither status but a first or second lapse notice was mailed on it in the rolling 12 months ending on the quote date, lapse_cut_days are taken; otherwise none are taken. Remittance-method days: counting payments posted on the contract whether or not later returned, when a payment by mailed check (payment_channel check_mail) posted on the contract in the rolling remittance_lookback_months months ending on the quote date (records dated later than the same calendar day remittance_lookback_months months before it, or the last day of that month when that day does not exist), mail_days are added; when none did but a one-time draft, card or transfer payment (a payment_channel listed in one_time_channels) did, one_time_days are added; in every other case (only recurring autopay drafts or third-party remittances, payment_channel ach_autopay or third_party_remittance, or no payments posted in that period), none are added. Business-day anchor: a statement quoted on a Friday adds friday_anchor_days, one quoted on a Saturday adds saturday_anchor_days and one quoted on a Sunday adds sunday_anchor_days, so that its window counts from the following Monday, the day of the week being found as the whole days since reference_monday modulo seven; a statement quoted Monday to Thursday adds none.
  prerequisite:
  - problem: contract_ext_returned_item_fee
    kind: value_input
    gate: statement_fees
    form: state
    policy_source: >-
      A payoff statement's figure is fixed only after each returned payment on the contract that owes a returned-payment fee carries it.
    condition: >-
      every contract_payment_returned row of the contract whose return_reason is fee-bearing, and that the monthly cap leaves room for, has a contract_fee_assessed row of fee_type returned_payment_fee linked to it (related_txn_id), so the fee is in fees_due_usd
    resolved_by: assess_returned_payment_fee_c98c0726
    effect: >-
      statement_fees (fees_due_usd) includes the booked returned-payment fee, so the statement figure rises by that fee
  cross_category:
  - category: cpi
    as: branch
    reads:
    - status
    - cpi_activities.notice_type
    note: >-
      Insurance-lapse shortening reads the contract's tracking status and the lapse notices mailed on it in the rolling 12 months.
  compute:
  - latest_payment_id: >-
      LATEST('contract_transactions', 'contract_txn_id', date_field='txn_date', event_type='contract_payment_posted')
  - latest_payment_date: >-
      LATEST('contract_transactions', 'txn_date', date_field='txn_date', event_type='contract_payment_posted')
  - interest_start: latest_payment_date if latest_payment_date != None else F('contract_date')
  - latest_payment_returned: >-
      COUNT('contract_transactions', event_type='contract_payment_returned', related_txn_id=latest_payment_id) > 0
  - reversed_interest: >-
      SUM('contract_transactions', 'interest_applied_usd', event_type='contract_payment_returned', related_txn_id=latest_payment_id)
  - carried_interest: reversed_interest if latest_payment_returned else F('unpaid_interest_usd')
  - statement_fees: F('fees_due_usd')
  - quote_days_past_due: DAYS(F('next_due_date'), NOW)
  - recent_late_charges: >-
      COUNT('contract_transactions', within_months=K('recent_late_months'), date_field='txn_date', event_type='contract_fee_assessed', fee_type='late_charge')
  - window_days: >-
      K('past_due_window_days') if quote_days_past_due > 0 else (K('recent_late_window_days') if (quote_days_past_due <= 0 and recent_late_charges > 0) else P('payoff_quote_valid_days'))
  - returns_for_cushion: >-
      COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='insufficient_funds') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='account_closed') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='stop_payment') + COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_returned', return_reason='uncollected_funds')
  - cushion_days: >-
      K('restricted_cushion_days') if returns_for_cushion >= P('returned_payment_restriction_count') else (K('returned_cushion_days') if returns_for_cushion >= 1 else 0)
  - estimate_days_past_due: DAYS(F('next_due_date'), NOW)
  - late_estimate: >-
      MN(P('late_charge_cap_usd'), P('late_charge_pct') / 100 * MN(F('scheduled_payment_usd'), F('principal_balance_usd'))) if (estimate_days_past_due > 0 and estimate_days_past_due <= P('late_charge_grace_days') and DAYS(F('next_due_date'), F('maturity_date')) == 0) else (MN(P('late_charge_cap_usd'), P('late_charge_pct') / 100 * F('scheduled_payment_usd')) if (estimate_days_past_due > 0 and estimate_days_past_due <= P('late_charge_grace_days')) else 0)
  - uninsured_record: >-
      EXISTS('cpi', contract_id=HID, status='force_placed') or EXISTS('cpi', contract_id=HID, status='lapse_notice')
  - lapse_notices_12m: >-
      XCOUNT('cpi', 'cpi_activities', within_months=12, date_field='activity_date', contract_id=HID, event_type='cpi_notice_sent', notice_type='first_lapse_notice') + XCOUNT('cpi', 'cpi_activities', within_months=12, date_field='activity_date', contract_id=HID, event_type='cpi_notice_sent', notice_type='second_lapse_notice')
  - insurance_cut_days: >-
      K('placed_cut_days') if uninsured_record else (K('lapse_cut_days') if lapse_notices_12m > 0 else 0)
  - recent_check_payments: >-
      COUNT('contract_transactions', within_months=K('remittance_lookback_months'), date_field='txn_date', event_type='contract_payment_posted', payment_channel='check_mail')
  - recent_one_time_payments: >-
      COUNT('contract_transactions', within_months=K('remittance_lookback_months'), date_field='txn_date', event_type='contract_payment_posted', payment_channel='ach_self_service') + COUNT('contract_transactions', within_months=K('remittance_lookback_months'), date_field='txn_date', event_type='contract_payment_posted', payment_channel='ach_agent') + COUNT('contract_transactions', within_months=K('remittance_lookback_months'), date_field='txn_date', event_type='contract_payment_posted', payment_channel='debit_card_self_service') + COUNT('contract_transactions', within_months=K('remittance_lookback_months'), date_field='txn_date', event_type='contract_payment_posted', payment_channel='debit_card_agent') + COUNT('contract_transactions', within_months=K('remittance_lookback_months'), date_field='txn_date', event_type='contract_payment_posted', payment_channel='moneygram') + COUNT('contract_transactions', within_months=K('remittance_lookback_months'), date_field='txn_date', event_type='contract_payment_posted', payment_channel='wire_transfer') + COUNT('contract_transactions', within_months=K('remittance_lookback_months'), date_field='txn_date', event_type='contract_payment_posted', payment_channel='certified_funds')
  - remittance_days: >-
      K('mail_days') if recent_check_payments > 0 else (K('one_time_days') if recent_one_time_payments > 0 else 0)
  - quote_weekday: DAYS(K('reference_monday'), NOW) % 7
  - anchor_days: >-
      K('friday_anchor_days') if quote_weekday == 4 else (K('saturday_anchor_days') if quote_weekday == 5 else (K('sunday_anchor_days') if quote_weekday == 6 else 0))
  - statement_days: >-
      MX(0, window_days + cushion_days + remittance_days + anchor_days - insurance_cut_days)
  - statement_interest: >-
      carried_interest + RND(F('principal_balance_usd') * F('apr_pct') / 100 * (DAYS(interest_start, NOW) + statement_days) / 365, 2)
  - result: >-
      RND(F('principal_balance_usd') + statement_fees + statement_interest + late_estimate, 2)
  compute_basis:
    latest_payment_id: >-
      Statement interest is simple interest at the contract's apr_pct on the principal balance on an actual/365 basis for the calendar days from the latest posted payment (the payment with the latest posting date, and among payments of the same date the one recorded first), or from the contract date when none has posted, to the good-through date, the new interest rounded half-up to the cent, plus the unpaid interest carried; when that latest posted payment was itself returned, the interest portion its return reversed is counted in place of the unpaid interest carried.
