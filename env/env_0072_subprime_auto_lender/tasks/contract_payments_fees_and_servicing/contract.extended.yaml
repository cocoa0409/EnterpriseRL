    cured_case_on_file: >-
      Referral-history review: when the contract's repossession case closed as reinstated (a contract is reinstated at most once) closed later than the same calendar day reinstated_lookback_months months before the posting date (the last day of that month when that day does not exist), reinstated_review_days are added; when that is not so but a repossession case on the contract closed as recalled with recall_reason account_brought_current, cured_review_days are added; otherwise none are added.
    referral_review: >-
      Referral-history review: when the contract's repossession case closed as reinstated (a contract is reinstated at most once) closed later than the same calendar day reinstated_lookback_months months before the posting date (the last day of that month when that day does not exist), reinstated_review_days are added; when that is not so but a repossession case on the contract closed as recalled with recall_reason account_brought_current, cured_review_days are added; otherwise none are added.
    posting_days_past_due: >-
      Delinquency review: when the installment due on next_due_date is more than late_charge_grace_days days past due on the posting date, beyond_grace_review_days are added; when it is past due but within its grace period, within_grace_review_days are added; when it is not past due, none are added.
    delinquency_review: >-
      Delinquency review: when the installment due on next_due_date is more than late_charge_grace_days days past due on the posting date, beyond_grace_review_days are added; when it is past due but within its grace period, within_grace_review_days are added; when it is not past due, none are added.
    review_days: >-
      The rules below may add review days; a payoff taken on the posting date is then good through the posting date plus every review day added, its payoff good-through date, and the per diem runs through that date as on a payoff statement, so the payoff amount is the principal balance plus fees due plus payoff interest through the payoff good-through date, rounded half-up to the cent; its principal and fee portions are the principal balance and fees due, the rest is its interest portion, and the payoff closes the contract.
    result: >-
      The rules below may add review days; a payoff taken on the posting date is then good through the posting date plus every review day added, its payoff good-through date, and the per diem runs through that date as on a payoff statement, so the payoff amount is the principal balance plus fees due plus payoff interest through the payoff good-through date, rounded half-up to the cent; its principal and fee portions are the principal balance and fees due, the rest is its interest portion, and the payoff closes the contract.
  factors:
  - id: returned_channel_review
    effect: parameter
    decides: returned_channel_review
    bindings:
    - latest_return_channel
    - returned_channel_review
    ladder:
    - when: latest return in the rolling 12 months through an ACH channel
      value: K('ach_return_review_days')
    - when: latest return in that period by mailed check
      value: K('check_return_review_days')
    - when: otherwise
      value: '0'
    baseline:
      returned_channel_review: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: weekend_receipt_days
    effect: parameter
    decides: weekend_days
    bindings:
    - posting_weekday
    - weekend_days
    ladder:
    - when: posted on a Friday
      value: K('friday_review_days')
    - when: posted on a Saturday
      value: K('saturday_review_days')
    - when: posted on a Sunday
      value: K('sunday_review_days')
    - when: otherwise (Monday to Thursday)
      value: '0'
    baseline:
      weekend_days: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: recent_return_window
    effect: method
    decides: recent_return_review
    bindings:
    - days_since_return
    - recent_return_review
    ladder:
    - when: latest return no more than return_window_days days before the posting date
      method: >-
        review to the end of the window: return_window_days less the days since the return
    - when: more than return_window_days but no more than return_long_days days before
      method: a flat return_long_review_days
    - when: otherwise
      method: no review days
    baseline:
      recent_return_review: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: referral_history_review
    effect: parameter
    decides: referral_review
    bindings:
    - reinstated_closed_on
    - cured_case_on_file
    - referral_review
    ladder:
    - when: >-
        the contract's reinstated case closed within reinstated_lookback_months months of the posting date
      value: K('reinstated_review_days')
    - when: >-
        not so, but a case on the contract closed as recalled with account_brought_current
      value: K('cured_review_days')
    - when: otherwise
      value: '0'
    baseline:
      referral_review: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: recovery
  - id: delinquency_review_rule
    effect: parameter
    decides: delinquency_review
    bindings:
    - posting_days_past_due
    - delinquency_review
    ladder:
    - when: installment due on next_due_date more than late_charge_grace_days days past due
      value: K('beyond_grace_review_days')
    - when: past due within its grace period
      value: K('within_grace_review_days')
    - when: otherwise (not past due)
      value: '0'
    baseline:
      delinquency_review: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      The payoff amount is the principal balance plus fees due plus payoff interest through the posting date, rounded half-up to the cent.
    params: []
  inputs:
    history:
    - table: contract_transactions
      aggregate: latest
      field: txn_date
      filters:
        event_type: contract_payment_returned
    cross_category:
    - recovery
