    room_12m: >-
      A hardship extension agreement defers the smallest of one installment, the tier's extension_max_months_per_request, extension_max_months_per_12_months less the installments deferred by extensions effective in the rolling 12 months, and extension_max_months_per_life less the installments deferred by every earlier extension of the contract, and never fewer than zero.
    room_life: >-
      A hardship extension agreement defers the smallest of one installment, the tier's extension_max_months_per_request, extension_max_months_per_12_months less the installments deferred by extensions effective in the rolling 12 months, and extension_max_months_per_life less the installments deferred by every earlier extension of the contract, and never fewer than zero.
    compliant_record: >-
      Insurance allowance: when the contract's insurance tracking record is compliant and no first or second lapse notice was mailed on it in the rolling 12 months ending on the signing date, the allowance is the tier's extension_max_months_per_request; when the contract's tracking record is force_placed or in lapse_notice status, the allowance is zero; in every other case it is one installment.
    uninsured_record: >-
      Insurance allowance: when the contract's insurance tracking record is compliant and no first or second lapse notice was mailed on it in the rolling 12 months ending on the signing date, the allowance is the tier's extension_max_months_per_request; when the contract's tracking record is force_placed or in lapse_notice status, the allowance is zero; in every other case it is one installment.
    lapse_notices_12m: >-
      Insurance allowance: when the contract's insurance tracking record is compliant and no first or second lapse notice was mailed on it in the rolling 12 months ending on the signing date, the allowance is the tier's extension_max_months_per_request; when the contract's tracking record is force_placed or in lapse_notice status, the allowance is zero; in every other case it is one installment.
    insurance_allowance: >-
      Insurance allowance: when the contract's insurance tracking record is compliant and no first or second lapse notice was mailed on it in the rolling 12 months ending on the signing date, the allowance is the tier's extension_max_months_per_request; when the contract's tracking record is force_placed or in lapse_notice status, the allowance is zero; in every other case it is one installment.
    installments_paid: >-
      Seasoning allowance: the installments paid are the monthly due dates from first_payment_date up to but not including next_due_date, less the installments deferred by every earlier extension; with at least seasoned_installments_paid installments paid the allowance is the tier's extension_max_months_per_request, with fewer than young_installments_paid it is zero, and in between it is one installment.
    seasoning_allowance: >-
      Seasoning allowance: the installments paid are the monthly due dates from first_payment_date up to but not including next_due_date, less the installments deferred by every earlier extension; with at least seasoned_installments_paid installments paid the allowance is the tier's extension_max_months_per_request, with fewer than young_installments_paid it is zero, and in between it is one installment.
    installments_remaining: >-
