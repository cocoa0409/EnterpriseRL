    request_days_late: >-
      Delinquency allowance: when the signing date is more than late_charge_grace_days days after next_due_date and partial installment credit is carried, the allowance is the installments past due on the signing date (each monthly due date from next_due_date through the signing date) plus the next installment to fall due; when next_due_date is on or after the signing date, the allowance is the tier's extension_max_months_per_request; in every other case it is one installment.
    delinquency_allowance: >-
