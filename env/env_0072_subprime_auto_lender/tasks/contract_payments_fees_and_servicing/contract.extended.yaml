    charged_installments: >-
      Number of charges: when the agreement defers more than one installment and the installment due on next_due_date is past due on the effective date and carries partial installment credit, the number of charges is the installments deferred less that partial installment credit divided by the scheduled installment; when it defers more than one installment in any other case, it is the installments deferred; in every other case it is one.
    oldest_installment_late_charge: >-
      Late-charge credit: for a contract whose state_code is listed in credit_full_states and whose contract_date is on or after credit_full_effective_date, the late charges assessed on the installment due on next_due_date, waived or not, are taken from the fee in full; for a contract whose state_code is listed in credit_capped_states, they are taken up to credit_cap_usd; for every other contract nothing is taken.
    late_charge_credit: >-
      Late-charge credit: for a contract whose state_code is listed in credit_full_states and whose contract_date is on or after credit_full_effective_date, the late charges assessed on the installment due on next_due_date, waived or not, are taken from the fee in full; for a contract whose state_code is listed in credit_capped_states, they are taken up to credit_cap_usd; for every other contract nothing is taken.
    days_past_due_at_effect: >-
      Collections handling charge: when the effective date is more than stage_two_days days after next_due_date the fee adds stage_two_usd; when it is more than late_charge_grace_days but no more than stage_two_days days after next_due_date it adds stage_one_usd; when it is no more than late_charge_grace_days days after next_due_date, or next_due_date is on or after it, it adds nothing.
    collections_handling: >-
