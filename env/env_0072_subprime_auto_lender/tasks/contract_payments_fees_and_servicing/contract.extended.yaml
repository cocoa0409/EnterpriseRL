- id: contract_ext_hardship_extension_charge
  base_policy_refs:
  - contract_extension
  overwrite:
  - base_policy: contract_extension
    superseded_clause: >-
      The extension fee is extension_fee_usd of the tier and is assessed (fee_treatment fee_assessed) on the effective date, except that where the tier's extension_first_fee_waived is true and the contract has no earlier extension, the fee is waived (fee_treatment fee_waived).
    replaced_by: >-
      The rules below may replace the charge or the number of charges and may add amounts to the fee or take an amount from it; the hardship extension fee is then the charge times the number of charges, plus every amount added, less every amount taken, never below zero and rounded half-up to the cent once at the end, and it is waived when the tier's extension_first_fee_waived is true and the contract has no earlier extension; the fee is assessed on the effective date with fee_treatment fee_assessed, or recorded with fee_treatment fee_waived when it is zero.
  trigger: on_request
