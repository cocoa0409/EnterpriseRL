        evidence_fields: [contract_service_requests.created_at, contract_service_requests.signed_at, contract_service_requests.service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contract_service_requests.service_request_id]]
          action_bindings: {contract_service_requests.service_request_id: service_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the request was created"
          anchor_source: contract_service_requests.created_at
          relation: not_after
          duration_source: variants.extension_signature_valid_days
          unit: calendar_days
          counting_rule: "The signature period is counted in calendar days from the date part of created_at, and a signature on the last day of the period is in time; an unsigned request lapses and a new request is needed."
          boundary: inclusive
      - id: extension_spacing
        applies_to: [contract_extension_granted]
        kind: time
        condition: "A new extension may take effect only when its effective date is at least extension_min_days_since_last after the effective date of the previous extension."
        evidence_fields: [contract_servicing_events.effective_date, contract_servicing_events.contract_id, contract_servicing_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contract_servicing_events.contract_id]]
          action_bindings: {contract_servicing_events.contract_id: contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the effective date of the previous extension"
          anchor_source: contract_servicing_events.effective_date
          relation: not_before
          duration_source: variants.extension_min_days_since_last
          unit: calendar_days
          counting_rule: "That interval is counted in calendar days from the previous extension's effective_date, and an effective date exactly on the boundary qualifies."
          boundary: inclusive
    params:
      per_tier:
        Tier 6 Fresh Start: {extension_max_months_per_request: "=extension_max_months_per_request", extension_max_months_per_12_months: "=extension_max_months_per_12_months", extension_max_months_per_life: "=extension_max_months_per_life", extension_fee_usd: "=extension_fee_usd", extension_first_fee_waived: "=extension_first_fee_waived"}
        Tier 5 Rebuild: {extension_max_months_per_request: "=extension_max_months_per_request", extension_max_months_per_12_months: "=extension_max_months_per_12_months", extension_max_months_per_life: "=extension_max_months_per_life", extension_fee_usd: "=extension_fee_usd", extension_first_fee_waived: "=extension_first_fee_waived"}
        Tier 4 Standard: {extension_max_months_per_request: "=extension_max_months_per_request", extension_max_months_per_12_months: "=extension_max_months_per_12_months", extension_max_months_per_life: "=extension_max_months_per_life", extension_fee_usd: "=extension_fee_usd", extension_first_fee_waived: "=extension_first_fee_waived"}
        Tier 3 Advantage: {extension_max_months_per_request: "=extension_max_months_per_request", extension_max_months_per_12_months: "=extension_max_months_per_12_months", extension_max_months_per_life: "=extension_max_months_per_life", extension_fee_usd: "=extension_fee_usd", extension_first_fee_waived: "=extension_first_fee_waived"}
        Tier 2 Preferred: {extension_max_months_per_request: "=extension_max_months_per_request", extension_max_months_per_12_months: "=extension_max_months_per_12_months", extension_max_months_per_life: "=extension_max_months_per_life", extension_fee_usd: "=extension_fee_usd", extension_first_fee_waived: "=extension_first_fee_waived"}
        Tier 1 Select: {extension_max_months_per_request: "=extension_max_months_per_request", extension_max_months_per_12_months: "=extension_max_months_per_12_months", extension_max_months_per_life: "=extension_max_months_per_life", extension_fee_usd: "=extension_fee_usd", extension_first_fee_waived: "=extension_first_fee_waived"}
    measures: [contract_msr_installments_paid, contract_msr_days_past_due, contract_msr_extension_months_12m, contract_msr_extension_months_life]

  - id: contract_payoff_and_lien_release
    subject: [contract_payoff_quoted, contract_paid_off, contract_lien_released]
    rule: >-
      A payoff quote is issued only for a contract whose status is active, repossessed or charged_off.
      The quoted payoff is principal_balance_usd plus fees_due_usd plus simple interest accrued through the quote_good_through_date (contract_msr_accrued_interest with the good-through date as the calculation date), and the good-through date is the quote date plus payoff_quote_valid_days calendar days; a payoff received after the good-through date is applied as an ordinary payment unless it still equals the payoff amount on its own posting date.
      For a repossessed contract the redemption amount adds the recovery file's unpaid recovery expenses, which are paid to the recovery file and never to the contract.
      The contract is paid off when a payoff or redemption payment equal to the payoff amount on its posting date posts (payoff_reason borrower_payoff or redemption), or when an insurance settlement and an approved GAP waiver benefit credit leave no principal, interest or fees owing (payoff_reason total_loss_settlement); amounts a GAP benefit excludes stay owed on an active contract until paid.
      The lien may be released only on a contract whose status is paid_off.
      Payoff funds become final payoff_funds_clearance_business_days after posting for the paying channel (business days are Monday to Friday excluding federal holidays), and the lien is released no later than lien_release_business_days business days after the funds-final date.
      The release is electronic (electronic_lien_release) when title_state_code is listed in elt_release_states, and otherwise the paper title, signed off by the company, is mailed by first-class mail to the borrower's mailing address on file (paper_title_mailed); for a total-loss settlement the title is sent to the insurer that paid the claim instead of the borrower.
      A lien is released once per contract; a borrower who reports a lost paper title after release is directed to the title state for a duplicate, since the company no longer holds a lien.
    eligibility:
      - id: payoff_quote_contract_status
        applies_to: [contract_payoff_quoted]
        kind: state
        condition: "A payoff quote is issued only for a contract whose status is active, repossessed or charged_off."
        evidence_fields: [contracts.status, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        state_contract:
          field: contracts.status
          allowed: [active, repossessed, charged_off]
      - id: lien_release_paid_off
        applies_to: [contract_lien_released]
        kind: state
        condition: "The lien may be released only on a contract whose status is paid_off."
        evidence_fields: [contracts.status, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        state_contract:
          field: contracts.status
          allowed: [paid_off]
    formula:
      quoted_payoff_usd: "principal_balance_usd + fees_due_usd + contract_msr_accrued_interest"
    measures: [contract_msr_accrued_interest]
  - id: contract_scra_rate_cap
    subject: [contract_scra_rate_adjusted]
    rule: >-
      The Servicemembers Civil Relief Act rate cap (50 U.S.C. 3937) applies only to a contract whose contract_date is earlier than the borrower's scra_active_duty_start_date.
      The cap is applied only on a written request of request_type scra_rate_cap, accompanied by a copy of the military orders, that the borrower has signed.
      The request must be received no later than scra_request_window_days after the end of military service.
      The window is counted in calendar days from scra_active_duty_end_date, a request received on the last day is in time, and a request made while service is continuing (no end date on file) is always in time.
      When the cap applies, the rate is reduced to the lower of apr_pct and scra_rate_cap_pct effective from scra_active_duty_start_date; interest above the cap is forgiven, never deferred, and interest already charged above the cap since that date is credited to principal as an scra_interest_credit linked to the rate-cap record.
      The scheduled payment is reduced by one month of forgiven interest computed as principal_balance_usd x (apr_pct - scra_rate_cap_pct) / 100 / 12 on the effective date, rounded half-up to the cent.
      The cap ends the day after scra_active_duty_end_date, when apr_pct returns to original_apr_pct and the scheduled payment returns to its pre-cap amount (scra_action rate_cap_ended); no fee is charged for either action.
      A contract that already carries an apr_pct at or below scra_rate_cap_pct is not changed.
    eligibility:
      - id: scra_obligation_predates_service
        applies_to: [contract_scra_rate_adjusted]
        kind: authorization
        condition: "The Servicemembers Civil Relief Act rate cap (50 U.S.C. 3937) applies only to a contract whose contract_date is earlier than the borrower's scra_active_duty_start_date."
        evidence_fields: [contracts.contract_date, customers.scra_active_duty_start_date, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
      - id: scra_signed_request
        applies_to: [contract_scra_rate_adjusted]
        kind: authorization
        condition: "The cap is applied only on a written request of request_type scra_rate_cap, accompanied by a copy of the military orders, that the borrower has signed."
        evidence_fields: [contract_service_requests.service_request_id, contract_service_requests.request_type, contract_service_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contract_service_requests.service_request_id]]
          action_bindings: {contract_service_requests.service_request_id: service_request_id}
      - id: scra_request_window
        applies_to: [contract_scra_rate_adjusted]
        kind: time
        condition: "The request must be received no later than scra_request_window_days after the end of military service."
        evidence_fields: [customers.scra_active_duty_end_date, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the end of military service"
          anchor_source: customers.scra_active_duty_end_date
          relation: not_after
          duration_source: variants.scra_request_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from scra_active_duty_end_date, a request received on the last day is in time, and a request made while service is continuing (no end date on file) is always in time."
          boundary: inclusive
    formula:
      new_apr_pct: "min(apr_pct, scra_rate_cap_pct)"
      payment_reduction: "round(principal_balance_usd * (apr_pct - scra_rate_cap_pct) / 100 / 12, 2)"
      new_scheduled_payment_usd: "scheduled_payment_usd - payment_reduction"
  - id: contract_ancillary_postings
    subject: [contract_ancillary_charge, contract_ancillary_credit, contract_balance_transferred]
    rule: >-
      An ancillary charge is capitalised only on a contract whose status is active.
      A force-placed insurance premium billed with billing_method added_to_contract_balance is added to principal on its billing date, linked to the premium record, and accrues simple interest from then like any other principal; premiums for any other billing method never reach the contract.
      An ancillary credit is applied only to a contract whose status is active, repossessed or charged_off; a refund that arrives after the contract is paid off or liquidated is paid by the issuing product directly to the borrower or credited to the deficiency account instead, under that product's own refund rules.
      A credit reduces principal on its posting date and never advances next_due_date, so the borrower's scheduled installments continue unless the credit pays the contract off; a credit larger than the payoff amount is limited to the payoff amount and the issuing product pays the excess to the borrower.
      When the repossessed vehicle is sold and a deficiency account opens, the contract's remaining principal_balance_usd and fees_due_usd move to that deficiency account on the sale date as one balance transfer, together with interest accrued to the sale date added by the deficiency account; recovery expenses are added by the recovery file, not by the contract.
      A balance transfer is made only from a contract whose status is liquidated.
    eligibility:
      - id: ancillary_charge_status
        applies_to: [contract_ancillary_charge]
        kind: state
        condition: "An ancillary charge is capitalised only on a contract whose status is active."
        evidence_fields: [contracts.status, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        state_contract:
          field: contracts.status
          allowed: [active]
      - id: ancillary_credit_status
        applies_to: [contract_ancillary_credit]
        kind: state
        condition: "An ancillary credit is applied only to a contract whose status is active, repossessed or charged_off; a refund that arrives after the contract is paid off or liquidated is paid by the issuing product directly to the borrower or credited to the deficiency account instead, under that product's own refund rules."
        evidence_fields: [contracts.status, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        state_contract:
          field: contracts.status
          allowed: [active, repossessed, charged_off]
      - id: balance_transfer_status
        applies_to: [contract_balance_transferred]
        kind: state
        condition: "A balance transfer is made only from a contract whose status is liquidated."
        evidence_fields: [contracts.status, contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[contracts.contract_id]]
          action_bindings: {contracts.contract_id: contract_id}
        state_contract:
          field: contracts.status
          allowed: [liquidated]
  - id: contract_default_status
    subject: [contract_repossessed, contract_reinstated, contract_liquidated, contract_charged_off]
    rule: >-
      The contract's default statuses follow the recovery file: the contract becomes repossessed on the date the recovery case records the vehicle as recovered, returns to active when the recovery case closes as reinstated, becomes paid_off when it closes as redeemed and becomes liquidated when the vehicle is sold.
      While repossessed, the contract accrues simple interest but carries no late charges, no extensions, no due-date changes and no ancillary charges.
      On reinstatement next_due_date moves to the first due date after the reinstatement date, because the reinstatement amount pays every installment due through that date, and ordinary servicing resumes with the same scheduled payment, due day and maturity date.
      An active contract that reaches charge_off_days_past_due days past due (contract_msr_days_past_due) with no recovery case in pre_repo_review, assigned or recovered status is charged off on that day; a charged-off contract keeps its balance, accepts payments and payoff quotes, but is not eligible for extensions, due-date changes or reinstatement to active status.
    eligibility: []
    params:
      per_tier:
        Tier 6 Fresh Start: {charge_off_days_past_due: "=charge_off_days_past_due"}
        Tier 5 Rebuild: {charge_off_days_past_due: "=charge_off_days_past_due"}
        Tier 4 Standard: {charge_off_days_past_due: "=charge_off_days_past_due"}
        Tier 3 Advantage: {charge_off_days_past_due: "=charge_off_days_past_due"}
        Tier 2 Preferred: {charge_off_days_past_due: "=charge_off_days_past_due"}
        Tier 1 Select: {charge_off_days_past_due: "=charge_off_days_past_due"}
    measures: [contract_msr_days_past_due]

# ---- extended policies (contract_payments_fees_and_servicing) ----
extended_policies:
- id: contract_ext_delinquency_late_charge
  base_policy_refs:
  - contract_evt_late_charge
  - contract_evt_payment_channel_fees
  - contract_evt_returned_payment
  overwrite:
  - base_policy: contract_evt_late_charge
    superseded_clause: >-
      The late charge is the lesser of late_charge_pct of scheduled_payment_usd and late_charge_cap_usd, rounded half-up to the cent; it is recorded with installment_due_date set to the installment's due date.
    replaced_by: >-
      Every late charge on an installment is worked out in this order: the reductions are first added into one reduction percent, the late-charge rate is applied to the amount it applies to, that product is reduced once by the combined reduction percent, the reduced figure is compared with late_charge_cap_usd and the lesser is taken, and the result is rounded half-up to the cent once, at the end, and recorded with installment_due_date set to the installment's due date.
  trigger: state_due
  subject:
  - contract_fee_assessed
  computes: amount_usd
  target_tool: assess_late_charge_1a8e6313
  params:
    schedule_a_states:
    - GA
    - AL
    - MS
    - TN
    schedule_a_effective_date: '2023-07-01'
    schedule_a_rate_pct: 4.0
    schedule_b_states:
    - NC
    - VA
    - KY
    schedule_b_effective_date: '2024-01-01'
    schedule_b_rate_pct: 3.0
    first_relief_pct: 50
    second_relief_pct: 25
    autopay_high_count: 9
    autopay_high_pct: 20
    autopay_low_count: 6
    autopay_low_pct: 10
  rule: >-
    This policy fixes the late charge booked on the oldest unpaid installment of an active contract once that installment's late-charge grace period has ended; that installment is the one due on the contract's next_due_date. The late charge on an installment is late_charge_pct percent of the scheduled installment, never more than late_charge_cap_usd, rounded half-up to the cent. The late-charge rate follows the company's state late-charge schedule: a contract whose state_code is listed in schedule_a_states and whose contract_date is on or after schedule_a_effective_date is charged schedule_a_rate_pct percent; a contract whose state_code is listed in schedule_b_states and whose contract_date is on or after schedule_b_effective_date is charged schedule_b_rate_pct percent; every other contract is charged late_charge_pct percent. The amount the late-charge rate applies to depends on the installment: for the final installment, whose due date equals the contract's maturity_date, it is the lesser of the scheduled installment and the principal balance plus unpaid interest; for any other installment that carries partial installment credit while the contract's latest posted payment, returned or not, is dated on or before that installment's due date, it is the scheduled installment less the partial installment credit; for every other installment it is the scheduled installment. A first-delinquency reduction applies according to the late charges assessed on the contract, waived or not, in the rolling 12 months ending on the assessment date: with none it is first_relief_pct percent, with exactly one it is second_relief_pct percent, and with two or more there is no first-delinquency reduction. An autopay reduction applies according to the payments posted through recurring autopay (payment_channel ach_autopay) in the rolling 12 months, returned or not: with at least autopay_high_count it is autopay_high_pct percent, with at least autopay_low_count but fewer than autopay_high_count it is autopay_low_pct percent, and with fewer than autopay_low_count there is no autopay reduction. Every late charge on an installment is worked out in this order: the reductions are first added into one reduction percent, the late-charge rate is applied to the amount it applies to, that product is reduced once by the combined reduction percent, the reduced figure is compared with late_charge_cap_usd and the lesser is taken, and the result is rounded half-up to the cent once, at the end, and recorded with installment_due_date set to the installment's due date.
  prerequisite: []
  cross_category: []
  compute:
  - scheduled_installment: F('scheduled_payment_usd')
  - late_rate_pct: >-
      K('schedule_a_rate_pct') if (F('state_code') in K('schedule_a_states') and DAYS(K('schedule_a_effective_date'), F('contract_date')) >= 0) else (K('schedule_b_rate_pct') if (F('state_code') in K('schedule_b_states') and DAYS(K('schedule_b_effective_date'), F('contract_date')) >= 0) else P('late_charge_pct'))
  - latest_payment_date: >-
      LATEST('contract_transactions', 'txn_date', date_field='txn_date', event_type='contract_payment_posted')
  - late_rate_base: >-
      MN(scheduled_installment, F('principal_balance_usd') + F('unpaid_interest_usd')) if DAYS(F('next_due_date'), F('maturity_date')) == 0 else ((scheduled_installment - F('partial_installment_credit_usd')) if (F('partial_installment_credit_usd') > 0 and latest_payment_date != None and DAYS(latest_payment_date, F('next_due_date')) >= 0) else scheduled_installment)
  - prior_late_charges: >-
      COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_fee_assessed', fee_type='late_charge')
  - delinquency_reduction_pct: >-
      K('first_relief_pct') if prior_late_charges == 0 else (K('second_relief_pct') if prior_late_charges == 1 else 0)
  - autopay_payments: >-
      COUNT('contract_transactions', within_months=12, date_field='txn_date', event_type='contract_payment_posted', payment_channel='ach_autopay')
  - autopay_reduction_pct: >-
      K('autopay_high_pct') if autopay_payments >= K('autopay_high_count') else (K('autopay_low_pct') if autopay_payments >= K('autopay_low_count') else 0)
  - combined_reduction_pct: delinquency_reduction_pct + autopay_reduction_pct
  - reduced_late_charge: late_rate_pct / 100 * late_rate_base * (100 - combined_reduction_pct) / 100
  - result: RND(MN(P('late_charge_cap_usd'), reduced_late_charge), 2)
  compute_basis:
    scheduled_installment: >-
      The late charge on an installment is late_charge_pct percent of the scheduled installment, never more than late_charge_cap_usd, rounded half-up to the cent.
    late_rate_pct: >-
      The late-charge rate follows the company's state late-charge schedule: a contract whose state_code is listed in schedule_a_states and whose contract_date is on or after schedule_a_effective_date is charged schedule_a_rate_pct percent; a contract whose state_code is listed in schedule_b_states and whose contract_date is on or after schedule_b_effective_date is charged schedule_b_rate_pct percent; every other contract is charged late_charge_pct percent.
    latest_payment_date: >-
      The amount the late-charge rate applies to depends on the installment: for the final installment, whose due date equals the contract's maturity_date, it is the lesser of the scheduled installment and the principal balance plus unpaid interest; for any other installment that carries partial installment credit while the contract's latest posted payment, returned or not, is dated on or before that installment's due date, it is the scheduled installment less the partial installment credit; for every other installment it is the scheduled installment.
    late_rate_base: >-
      The amount the late-charge rate applies to depends on the installment: for the final installment, whose due date equals the contract's maturity_date, it is the lesser of the scheduled installment and the principal balance plus unpaid interest; for any other installment that carries partial installment credit while the contract's latest posted payment, returned or not, is dated on or before that installment's due date, it is the scheduled installment less the partial installment credit; for every other installment it is the scheduled installment.
    prior_late_charges: >-
      A first-delinquency reduction applies according to the late charges assessed on the contract, waived or not, in the rolling 12 months ending on the assessment date: with none it is first_relief_pct percent, with exactly one it is second_relief_pct percent, and with two or more there is no first-delinquency reduction.
    delinquency_reduction_pct: >-
      A first-delinquency reduction applies according to the late charges assessed on the contract, waived or not, in the rolling 12 months ending on the assessment date: with none it is first_relief_pct percent, with exactly one it is second_relief_pct percent, and with two or more there is no first-delinquency reduction.
    autopay_payments: >-
      An autopay reduction applies according to the payments posted through recurring autopay (payment_channel ach_autopay) in the rolling 12 months, returned or not: with at least autopay_high_count it is autopay_high_pct percent, with at least autopay_low_count but fewer than autopay_high_count it is autopay_low_pct percent, and with fewer than autopay_low_count there is no autopay reduction.
    autopay_reduction_pct: >-
      An autopay reduction applies according to the payments posted through recurring autopay (payment_channel ach_autopay) in the rolling 12 months, returned or not: with at least autopay_high_count it is autopay_high_pct percent, with at least autopay_low_count but fewer than autopay_high_count it is autopay_low_pct percent, and with fewer than autopay_low_count there is no autopay reduction.
    combined_reduction_pct: >-
      Every late charge on an installment is worked out in this order: the reductions are first added into one reduction percent, the late-charge rate is applied to the amount it applies to, that product is reduced once by the combined reduction percent, the reduced figure is compared with late_charge_cap_usd and the lesser is taken, and the result is rounded half-up to the cent once, at the end, and recorded with installment_due_date set to the installment's due date.
    reduced_late_charge: >-
      Every late charge on an installment is worked out in this order: the reductions are first added into one reduction percent, the late-charge rate is applied to the amount it applies to, that product is reduced once by the combined reduction percent, the reduced figure is compared with late_charge_cap_usd and the lesser is taken, and the result is rounded half-up to the cent once, at the end, and recorded with installment_due_date set to the installment's due date.
    result: >-
      Every late charge on an installment is worked out in this order: the reductions are first added into one reduction percent, the late-charge rate is applied to the amount it applies to, that product is reduced once by the combined reduction percent, the reduced figure is compared with late_charge_cap_usd and the lesser is taken, and the result is rounded half-up to the cent once, at the end, and recorded with installment_due_date set to the installment's due date.
  factors:
  - id: delinquency_rate_schedule
    effect: parameter
    decides: late_rate_pct
    bindings:
    - late_rate_pct
    ladder:
    - when: >-
        contract state listed in schedule_a_states and contract signed on or after schedule_a_effective_date
      value: K('schedule_a_rate_pct')
    - when: >-
        contract state listed in schedule_b_states and contract signed on or after schedule_b_effective_date
      value: K('schedule_b_rate_pct')
    - when: otherwise
      value: P('late_charge_pct')
    baseline:
      late_rate_pct: P('late_charge_pct')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: charge_basis
    effect: method
    decides: late_rate_base
    bindings:
    - latest_payment_date
    - late_rate_base
    ladder:
    - when: the installment is the final installment (due date equals maturity_date)
      method: lesser of the scheduled installment and principal balance plus unpaid interest
    - when: >-
        another installment carrying partial installment credit while the latest posted payment is dated on or before its due date
      method: scheduled installment less the partial installment credit
    - when: otherwise
      method: the scheduled installment
    baseline:
      late_rate_base: scheduled_installment
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: first_delinquency_relief
    effect: parameter
    decides: delinquency_reduction_pct
    bindings:
    - prior_late_charges
    - delinquency_reduction_pct
    ladder:
    - when: no late charge assessed in the rolling 12 months
      value: K('first_relief_pct')
    - when: exactly one late charge assessed in the rolling 12 months
      value: K('second_relief_pct')
    - when: otherwise (two or more)
      value: '0'
    baseline:
      delinquency_reduction_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: autopay_relief
    effect: parameter
    decides: autopay_reduction_pct
    bindings:
    - autopay_payments
    - autopay_reduction_pct
    ladder:
    - when: at least autopay_high_count autopay payments posted in the rolling 12 months
      value: K('autopay_high_pct')
    - when: at least autopay_low_count but fewer than autopay_high_count
      value: K('autopay_low_pct')
    - when: otherwise
      value: '0'
    baseline:
      autopay_reduction_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The late charge on an installment is late_charge_pct percent of the scheduled installment, never more than late_charge_cap_usd, rounded half-up to the cent.
    params:
    - late_charge_pct
    - late_charge_cap_usd
  inputs:
    history:
    - table: contract_transactions
      aggregate: latest
      field: txn_date
      filters:
        event_type: contract_payment_posted
    - table: contract_transactions
      aggregate: count
      field: contract_txn_id
      within_months: 12
      filters:
        event_type: contract_fee_assessed
        fee_type: late_charge
    - table: contract_transactions
      aggregate: count
      field: contract_txn_id
      within_months: 12
      filters:
        event_type: contract_payment_posted
        payment_channel: ach_autopay
    cross_category: []
- id: contract_ext_deferral_agreement_months
  base_policy_refs:
  - contract_extension
  overwrite:
  - base_policy: contract_extension
    superseded_clause: >-
      One extension defers at most extension_max_months_per_request installments, the installments deferred in the rolling 12 months (contract_msr_extension_months_12m) including this one may not exceed extension_max_months_per_12_months, and over the contract's life (contract_msr_extension_months_life) including this one may not exceed extension_max_months_per_life.
    replaced_by: >-
      A hardship extension agreement defers the smallest of one installment, the tier's extension_max_months_per_request, extension_max_months_per_12_months less the installments deferred by extensions effective in the rolling 12 months, and extension_max_months_per_life less the installments deferred by every earlier extension of the contract, and never fewer than zero.
  trigger: on_request
  subject:
  - contract_extension_granted
  computes: requested_extension_months
  target_tool: sign_extension_agreement_772d986b
  params:
    standard_installments: 1
    seasoned_installments_paid: 24
    young_installments_paid: 12
    long_term_remaining: 13
    short_term_remaining: 3
    spacing_long_months: 24
    spacing_short_months: 12
    recent_activity_months: 6
    active_payment_count: 5
  rule: >-
    This policy fixes the installments a hardship extension agreement defers when the borrower of an active contract asks to defer installments; the borrower signs the agreement for that number of installments, and the signing date is the date the borrower signs it. A hardship extension agreement defers the smallest of one installment, the tier's extension_max_months_per_request, extension_max_months_per_12_months less the installments deferred by extensions effective in the rolling 12 months, and extension_max_months_per_life less the installments deferred by every earlier extension of the contract, and never fewer than zero. Where the rules below set further allowances, the agreement defers the smallest of the tier limits and every allowance they set, never fewer than zero, and when that smallest figure is zero no agreement is offered. Insurance allowance: when the contract's insurance tracking record is compliant and no first or second lapse notice was mailed on it in the rolling 12 months ending on the signing date, the allowance is the tier's extension_max_months_per_request; when the contract's tracking record is force_placed or in lapse_notice status, the allowance is zero; in every other case it is one installment. Seasoning allowance: the installments paid are the monthly due dates from first_payment_date up to but not including next_due_date, less the installments deferred by every earlier extension; with at least seasoned_installments_paid installments paid the allowance is the tier's extension_max_months_per_request, with fewer than young_installments_paid it is zero, and in between it is one installment. Remaining-term allowance: the installments remaining are the monthly due dates from next_due_date through maturity_date; with at least long_term_remaining installments remaining the allowance is the tier's extension_max_months_per_request, with no more than short_term_remaining remaining it is zero, and in between it is one installment. Delinquency allowance: when the signing date is more than late_charge_grace_days days after next_due_date and partial installment credit is carried, the allowance is the installments past due on the signing date (each monthly due date from next_due_date through the signing date) plus the next installment to fall due; when next_due_date is on or after the signing date, the allowance is the tier's extension_max_months_per_request; in every other case it is one installment. Spacing allowance: when the contract has no earlier extension, or its latest extension took effect on or before the same calendar day spacing_long_months months before the signing date (the last day of that month when that day does not exist), the allowance is the tier's extension_max_months_per_request; when the latest extension took effect later than the same calendar day spacing_short_months months before the signing date (with the same month-end rule), the allowance is zero; in between it is one installment. Payment-activity allowance: counting the payments posted on the contract, returned or not, in the rolling recent_activity_months months ending on the signing date (payments dated later than the same calendar day recent_activity_months months before it, or the last day of that month when that day does not exist), with at least active_payment_count payments the allowance is the tier's extension_max_months_per_request, with none it is zero, and with fewer it is one installment.
  prerequisite: []
  cross_category:
  - category: cpi
    as: branch
    reads:
    - status
    - cpi_activities.notice_type
    note: >-
      The insurance allowance reads the contract's insurance tracking status and the lapse notices mailed on it in the rolling 12 months.
  compute:
  - per_request_cap: P('extension_max_months_per_request')
  - deferred_12m: >-
      SUM('contract_servicing_events', 'extension_months', within_months=12, date_field='effective_date', event_type='contract_extension_granted')
  - deferred_life: >-
      SUM('contract_servicing_events', 'extension_months', event_type='contract_extension_granted')
  - room_12m: P('extension_max_months_per_12_months') - deferred_12m
  - room_life: P('extension_max_months_per_life') - deferred_life
  - compliant_record: EXISTS('cpi', contract_id=HID, status='compliant')
  - uninsured_record: >-
      EXISTS('cpi', contract_id=HID, status='force_placed') or EXISTS('cpi', contract_id=HID, status='lapse_notice')
  - lapse_notices_12m: >-
      XCOUNT('cpi', 'cpi_activities', within_months=12, date_field='activity_date', contract_id=HID, event_type='cpi_notice_sent', notice_type='first_lapse_notice') + XCOUNT('cpi', 'cpi_activities', within_months=12, date_field='activity_date', contract_id=HID, event_type='cpi_notice_sent', notice_type='second_lapse_notice')
  - insurance_allowance: >-
      per_request_cap if (compliant_record and lapse_notices_12m == 0) else (0 if uninsured_record else K('standard_installments'))
  - installments_paid: MONTHS(F('first_payment_date'), F('next_due_date')) - deferred_life
  - seasoning_allowance: >-
      per_request_cap if installments_paid >= K('seasoned_installments_paid') else (0 if installments_paid < K('young_installments_paid') else K('standard_installments'))
  - installments_remaining: MONTHS(F('next_due_date'), F('maturity_date')) + 1
  - term_allowance: >-
      per_request_cap if installments_remaining >= K('long_term_remaining') else (0 if installments_remaining <= K('short_term_remaining') else K('standard_installments'))
  - request_days_late: DAYS(F('next_due_date'), NOW)
  - delinquency_allowance: >-
      (MONTHS(F('next_due_date'), NOW) + 2) if (request_days_late > P('late_charge_grace_days') and F('partial_installment_credit_usd') > 0) else (per_request_cap if request_days_late <= 0 else K('standard_installments'))
  - latest_extension_date: >-
      LATEST('contract_servicing_events', 'effective_date', date_field='effective_date', event_type='contract_extension_granted')
  - spacing_allowance: >-
      per_request_cap if (latest_extension_date == None or MONTHS(latest_extension_date, NOW) >= K('spacing_long_months')) else (0 if MONTHS(latest_extension_date, NOW) < K('spacing_short_months') else K('standard_installments'))
  - recent_payments: >-
      COUNT('contract_transactions', within_months=K('recent_activity_months'), date_field='txn_date', event_type='contract_payment_posted')
  - activity_allowance: >-
      per_request_cap if recent_payments >= K('active_payment_count') else (0 if recent_payments == 0 else K('standard_installments'))
  - result: >-
      MX(0, MN(per_request_cap, room_12m, room_life, insurance_allowance, seasoning_allowance, term_allowance, delinquency_allowance, spacing_allowance, activity_allowance))
  compute_basis:
    per_request_cap: >-
      A hardship extension agreement defers the smallest of one installment, the tier's extension_max_months_per_request, extension_max_months_per_12_months less the installments deferred by extensions effective in the rolling 12 months, and extension_max_months_per_life less the installments deferred by every earlier extension of the contract, and never fewer than zero.
    deferred_12m: >-
      A hardship extension agreement defers the smallest of one installment, the tier's extension_max_months_per_request, extension_max_months_per_12_months less the installments deferred by extensions effective in the rolling 12 months, and extension_max_months_per_life less the installments deferred by every earlier extension of the contract, and never fewer than zero.
    deferred_life: >-
