  - ul_anchor: ul_first if ul_cstat == 'paid_off' else (ul_repo if ul_repo != '' else NOW)
  - result: '''not_applicable'' if (F(''status'') != ''closed'' or ul_count == 0 or not (ul_res == ''rejected_deductible_too_high'' or ul_res == ''rejected_expiring'') or DAYS(ul_eff, ul_exp) + 1 > P(''binder_max_days'')) else (''rejected_no_lienholder'' if not (ul_flag == True) else (''rejected_deductible_too_high'' if (ul_comp > P(''borrower_max_deductible_usd'') + ul_age_allow or ul_coll > P(''borrower_max_deductible_usd'') + ul_value_allow + ul_tier_allow) else (''rejected_expiring'' if ul_exp < ul_anchor else ''accepted'')))'
