  - fd_coll: float(LATEST('cpi_activities','collision_deductible_usd', event_type='cpi_proof_verified', verification_source='insurer_edi_feed', date_field='activity_date') or 0)
  - fd_eff: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', verification_source='insurer_edi_feed', date_field='activity_date') or '9999-12-31'
  - fd_exp: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', verification_source='insurer_edi_feed', date_field='activity_date') or '0001-01-01'
  - fd_year: int(CFIELD('contract','vehicle_year', contract_id=F('contract_id')) or 0)
  - fd_age_allow: K('feed_age_allow_old') if (fd_year > 0 and fd_year <= K('feed_old_model_year')) else (K('feed_age_allow_mid') if (fd_year > K('feed_old_model_year') and fd_year <= K('feed_mid_model_year')) else 0.0)
  - fd_ltv: 100.0 * float(CFIELD('contract','amount_financed_usd', contract_id=F('contract_id')) or 0) / MX(1.0, float(CFIELD('contract','vehicle_book_value_usd', contract_id=F('contract_id')) or 0))
  - fd_ltv_allow: K('feed_ltv_allow_low') if (fd_ltv > 0 and fd_ltv <= K('feed_ltv_low_pct')) else (K('feed_ltv_allow_mid') if (fd_ltv > K('feed_ltv_low_pct') and fd_ltv <= K('feed_ltv_mid_pct')) else 0.0)
  - fd_book: float(CFIELD('contract','vehicle_book_value_usd', contract_id=F('contract_id')) or 0)
  - fd_value_allow: K('feed_value_allow_low') if (fd_book > 0 and fd_book <= K('feed_value_low_usd')) else (K('feed_value_allow_mid') if (fd_book > K('feed_value_low_usd') and fd_book <= K('feed_value_mid_usd')) else 0.0)
  - fd_tier: CFIELD('contract','variant_name', contract_id=F('contract_id')) or ''
  - fd_tier_allow: K('feed_tier_allow_prime') if (fd_tier == 'Tier 1 Select' or fd_tier == 'Tier 2 Preferred' or fd_tier == 'Tier 3 Advantage') else (K('feed_tier_allow_near') if (fd_tier == 'Tier 4 Standard' or fd_tier == 'Tier 5 Rebuild') else 0.0)
  - fd_first: LATEST('cpi_activities','activity_date', event_type='cpi_proof_verified', verification_source='insurer_edi_feed', date_field='activity_date') or NOW
  - fd_repo: CFIELD('contract','repossession_date', contract_id=F('contract_id')) or ''
  - fd_cstat: CFIELD('contract','status', contract_id=F('contract_id')) or ''
  - fd_anchor: fd_first if fd_cstat == 'paid_off' else (fd_repo if fd_repo != '' else NOW)
  - fd_state: CFIELD('contract','state_code', contract_id=F('contract_id')) or ''
  - fd_buffer: K('feed_buffer_gulf') if (fd_state == 'TX' or fd_state == 'LA') else (K('feed_buffer_plains') if (fd_state == 'OK' or fd_state == 'AR') else P('min_days_to_expiration_at_verification'))
  - result: '''not_applicable'' if (F(''status'') != ''closed'' or fd_count == 0 or not (fd_res == ''rejected_deductible_too_high'' or fd_res == ''rejected_expiring'')) else (''rejected_no_lienholder'' if not (fd_flag == True) else (''rejected_deductible_too_high'' if (fd_comp > P(''borrower_max_deductible_usd'') + fd_age_allow + fd_ltv_allow or fd_coll > P(''borrower_max_deductible_usd'') + fd_value_allow + fd_tier_allow) else (''rejected_expiring'' if DAYS(fd_anchor, fd_exp) < fd_buffer else ''accepted'')))'
  compute_basis:
    fd_count: 'The re-review outcome of a feed proof is the first failing test in this order: the lienholder test (rejected_no_lienholder), then the comprehensive and collision deductible tests together (rejected_deductible_too_high), then the coverage-reach test, passed when the policy_expiration_date is at least the expiry buffer after the reach date (rejected_expiring); a feed proof that passes all of them is accepted; where the record carries no feed proof, or its most recent one is already accepted or was rejected for a reason this rule does not re-review, there is nothing to re-review and the outcome is not_applicable; on a tracking record that is not closed this rule does not apply and its outcome is not_applicable.'
