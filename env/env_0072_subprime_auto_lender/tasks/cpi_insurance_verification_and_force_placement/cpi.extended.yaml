  rule: 'This rule governs the refund, by check to the borrower, of the capitalised premium charge with the latest billing_period_start when its billing period ends on the closed_date of a tracking record that closed while force_placed because its contract was paid off and an accepted proof of the borrower''s own coverage counts for that period; it applies only on a tracking record on which no verification_source holds more than one accepted cpi_proof_verified entry. The charge the closing-month refund refunds is the capitalised premium charge on the record (billing_method added_to_contract_balance) with the latest billing_period_start, its premium is the sum of the capitalised premium charged for that billing period, and its period days are the calendar days from its billing_period_start through its billing_period_end with both days counted. The proofs the closing-month refund reads are taken from every arrival channel alike (insurer_edi_feed, insurer_fax, insurance_agent_call and declarations_page_upload,
    binder or declarations page): for each channel, the record''s one accepted proof of that channel, if any; the channel decides only which rule reviewed a proof, never how its days count. Such a proof counts for the period when its expiration date falls on or after the period start, a counting proof reaches the covered stretch when it also took effect on or before the closed_date, and a reaching proof''s span runs from the later of the period start and its effective date through the earlier of its expiration date and the closed_date. The closing-month refund is fixed only after the records carry an accepted re-review of every rejected insurer-feed proof whose shown coverage reaches into that billing period. The closing-month refund is not fixed until the records carry an accepted re-review of every rejected uploaded binder whose shown coverage reaches into that billing period. The closing-month refund''s refund basis is full_no_lapse, with every day of the period refundable, when a counting
    proof took effect on or before the record''s placement_effective_date, so that the borrower''s own coverage ran with no gap from the CPI coverage effective date into the period (an insurer''s reinstatement of the policy on file without a gap is such a proof, retroactive_reinstatement_accepted); it is pro_rata_from_closure, with only the post-closing days refundable, when no counting proof reaches the covered stretch; otherwise it is pro_rata_from_proof_effective, and the refundable days add together the covered days, the replacement days this rule counts as covered, and the post-closing days. When two or more proofs reach the covered stretch, the closing-month refund''s covered days are the days inside any of their spans, a day inside several counted once. When exactly one proof reaches the covered stretch and it expires inside the period, the closing-month refund''s covered days are the days of its span. As the standard method, the closing-month refund''s covered days are the days of
    the period from the latest policy_effective_date among the reaching proofs through the closed_date, both ends counted. For the closing-month refund, the replacement days are the days from the start of the earliest reaching span through the end of the latest reaching span that no reaching span covers, and the first of them count as covered, as many as the sum of every replacement-grace allowance this rule states. The vehicle-value replacement-grace allowance is cm_grace_value_low days when the vehicle book value on the contract is no more than cm_grace_value_low_usd and cm_grace_value_mid days when it is above cm_grace_value_low_usd and no more than cm_grace_value_mid_usd. The state replacement-grace allowance is cm_grace_gulf days for a contract whose contract state is TX or LA and cm_grace_plains days for a contract whose contract state is OK or AR. The model-year replacement-grace allowance is cm_grace_year_old days for a financed vehicle of model year cm_grace_old_year or earlier
    and cm_grace_year_mid days for model years after cm_grace_old_year through cm_grace_mid_year. As the standard method, every replacement-grace allowance of the closing-month refund is 0 days, so no day of a replacement gap counts as covered. A charge whose period ends on the closed_date has no post-closing days. The closing-month refund is the charge''s premium multiplied by its refundable days and divided by its period days, rounded half-up to the cent; the refund carries no interest, fee or credit, and a mailed refund below refund_min_check_usd is not issued. For the capitalised premium charge with the latest billing_period_start on a tracking record that closed while force_placed because its contract was paid off, when an accepted proof counts for that charge''s period and no verification_source holds more than one accepted cpi_proof_verified entry on the record, the refund is fixed by the closing-month refund rule if the period ends on the closed_date and by the closing-period refund
    rule if it runs past the closed_date; that charge in any other case, and every other charge, keep the base refund rule in force: A premium charge can be refunded only once. When accepted proof shows coverage effective on or before the CPI coverage effective date with no gap (flat_cancel_if_continuous), every premium charge of the placement is refunded in full (refund_basis full_no_lapse). When accepted proof starts after the CPI coverage effective date, each unrefunded charge is refunded for the days of its billing period on or after the proof''s policy_effective_date (refund_basis pro_rata_from_proof_effective, partial_refund_basis), and days before that date stay earned. When the record closes because the contract left active servicing while force_placed, each unrefunded charge is refunded for the days of its billing period after the contract''s closed_date (refund_basis pro_rata_from_closure, closure_refund_basis). Where that latest charge stays under the base refund rule, the accepted
    proof the base rule reads is the record''s accepted proof with the latest policy_effective_date, whatever its channel, and where two accepted proofs share that date the one recorded first counts; its coverage is effective on or before the CPI coverage effective date with no gap when it took effect on or before the record''s placement_effective_date and expires on or after it; and, the charge being refunded only once, when the proof clause and the closure clause both apply it is refunded once for every day either clause gives, under refund_basis pro_rata_from_proof_effective when the proof clause gives it a day and pro_rata_from_closure otherwise.'
  prerequisite:
  - problem: cpi_ext_feed_proof_rereview
    kind: value_input
    gate: cm_cover
    form: state
    policy_source: The closing-month refund is fixed only after the records carry an accepted re-review of every rejected insurer-feed proof whose shown coverage reaches into that billing period.
    condition: cpi_activities carries, on the tracking record, an accepted cpi_proof_verified entry from insurer_edi_feed for every rejected proof of that channel whose shown coverage reaches into the billing period of the most recent capitalised premium charge.
    resolved_by: rereview_feed_proof_7d2611c6
    effect: The accepted re-review becomes a reaching proof whose span the covered-days ladder counts.
  - problem: cpi_ext_upload_proof_rereview
    kind: value_input
    gate: cm_cover
    form: state
    policy_source: The closing-month refund is not fixed until the records carry an accepted re-review of every rejected uploaded binder whose shown coverage reaches into that billing period.
    condition: cpi_activities carries, on the tracking record, an accepted cpi_proof_verified entry from declarations_page_upload for every rejected uploaded binder (shown period no longer than binder_max_days) whose shown coverage reaches into the billing period of the most recent capitalised premium charge.
    resolved_by: rereview_uploaded_proof_b3d9c591
    effect: The accepted re-review becomes a reaching proof whose span the covered-days ladder counts.
  cross_category:
  - category: contract
    as: branch
    reads:
    - vehicle_book_value_usd
    - state_code
    - vehicle_year
    note: The contract book value, state and vehicle model year decide the three replacement-grace allowances.
  compute:
  - cm_start: LATEST('cpi_activities','billing_period_start', date_field='billing_period_start', event_type='cpi_premium_charged', billing_method='added_to_contract_balance') or NOW
  - cm_amt: SUM('cpi_activities','amount_usd', event_type='cpi_premium_charged', billing_method='added_to_contract_balance', billing_period_start=cm_start)
  - cm_end: LATEST('cpi_activities','billing_period_end', date_field='billing_period_start', event_type='cpi_premium_charged', billing_method='added_to_contract_balance') or NOW
  - cm_days: MX(1, DAYS(cm_start, cm_end) + 1)
  - cm_closed: F('closed_date') or cm_end
  - cm_f_e: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_edi_feed', date_field='policy_effective_date') or '9999-12-31'
  - cm_f_x: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_edi_feed', date_field='policy_effective_date') or '0001-01-01'
  - cm_f_ok: cm_f_x >= cm_start
  - cm_f_in: cm_f_ok and cm_f_e <= cm_closed
  - cm_f_s: MX(cm_start, cm_f_e)
  - cm_f_t: MN(cm_f_x, cm_closed)
  - cm_x_e: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_fax', date_field='policy_effective_date') or '9999-12-31'
  - cm_x_x: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_fax', date_field='policy_effective_date') or '0001-01-01'
  - cm_x_ok: cm_x_x >= cm_start
  - cm_x_in: cm_x_ok and cm_x_e <= cm_closed
  - cm_x_s: MX(cm_start, cm_x_e)
  - cm_x_t: MN(cm_x_x, cm_closed)
  - cm_c_e: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurance_agent_call', date_field='policy_effective_date') or '9999-12-31'
  - cm_c_x: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurance_agent_call', date_field='policy_effective_date') or '0001-01-01'
  - cm_c_ok: cm_c_x >= cm_start
  - cm_c_in: cm_c_ok and cm_c_e <= cm_closed
  - cm_c_s: MX(cm_start, cm_c_e)
  - cm_c_t: MN(cm_c_x, cm_closed)
  - cm_u_e: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='declarations_page_upload', date_field='policy_effective_date') or '9999-12-31'
  - cm_u_x: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='declarations_page_upload', date_field='policy_effective_date') or '0001-01-01'
  - cm_u_ok: cm_u_x >= cm_start
  - cm_u_in: cm_u_ok and cm_u_e <= cm_closed
  - cm_u_s: MX(cm_start, cm_u_e)
  - cm_u_t: MN(cm_u_x, cm_closed)
  - cm_f_k: COUNT('cpi_activities', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_edi_feed')
  - cm_x_k: COUNT('cpi_activities', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_fax')
  - cm_c_k: COUNT('cpi_activities', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurance_agent_call')
  - cm_u_k: COUNT('cpi_activities', event_type='cpi_proof_verified', proof_result='accepted', verification_source='declarations_page_upload')
  - cm_single: cm_f_k <= 1 and cm_x_k <= 1 and cm_c_k <= 1 and cm_u_k <= 1
  - cm_ext: cm_single and (cm_f_ok or cm_x_ok or cm_c_ok or cm_u_ok)
  - cm_le_b: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', date_field='policy_effective_date') or '9999-12-31'
  - cm_lx_b: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', date_field='policy_effective_date') or '0001-01-01'
  - cm_pe: F('placement_effective_date') or '0001-01-01'
  - cm_b_full: cm_le_b <= cm_pe and cm_lx_b >= cm_pe
  - cm_b_prf: cm_le_b > cm_pe and cm_le_b != '9999-12-31'
  - cm_b_pdays: MX(0, DAYS(MX(cm_start, cm_le_b), cm_end) + 1) * (cm_b_prf == True)
  - cm_b_post: MX(0, DAYS(cm_closed, cm_end))
  - cm_base_days: cm_days if cm_b_full else MX(cm_b_pdays, cm_b_post)
  - cm_base_basis: '''full_no_lapse'' if cm_b_full else (''pro_rata_from_proof_effective'' if cm_b_pdays > 0 else ''pro_rata_from_closure'')'
  - cm_cnt: (cm_f_in == True) + (cm_x_in == True) + (cm_c_in == True) + (cm_u_in == True)
  - cm_union: MX(0, DAYS(cm_f_s, cm_f_t) + 1) * (cm_f_in == True) + MX(0, DAYS(cm_x_s, cm_x_t) + 1) * (cm_x_in == True) + MX(0, DAYS(cm_c_s, cm_c_t) + 1) * (cm_c_in == True) + MX(0, DAYS(cm_u_s, cm_u_t) + 1) * (cm_u_in == True) - MX(0, DAYS(MX(cm_f_s, cm_x_s), MN(cm_f_t, cm_x_t)) + 1) * (cm_f_in == True and cm_x_in == True) - MX(0, DAYS(MX(cm_f_s, cm_c_s), MN(cm_f_t, cm_c_t)) + 1) * (cm_f_in == True and cm_c_in == True) - MX(0, DAYS(MX(cm_f_s, cm_u_s), MN(cm_f_t, cm_u_t)) + 1) * (cm_f_in == True and cm_u_in == True) - MX(0, DAYS(MX(cm_x_s, cm_c_s), MN(cm_x_t, cm_c_t)) + 1) * (cm_x_in == True and cm_c_in == True) - MX(0, DAYS(MX(cm_x_s, cm_u_s), MN(cm_x_t, cm_u_t)) + 1) * (cm_x_in == True and cm_u_in == True) - MX(0, DAYS(MX(cm_c_s, cm_u_s), MN(cm_c_t, cm_u_t)) + 1) * (cm_c_in == True and cm_u_in == True) + MX(0, DAYS(MX(cm_f_s, cm_x_s, cm_c_s), MN(cm_f_t, cm_x_t, cm_c_t)) + 1) * (cm_f_in == True and cm_x_in == True and cm_c_in == True) + MX(0, DAYS(MX(cm_f_s, cm_x_s, cm_u_s), MN(cm_f_t,
      cm_x_t, cm_u_t)) + 1) * (cm_f_in == True and cm_x_in == True and cm_u_in == True) + MX(0, DAYS(MX(cm_f_s, cm_c_s, cm_u_s), MN(cm_f_t, cm_c_t, cm_u_t)) + 1) * (cm_f_in == True and cm_c_in == True and cm_u_in == True) + MX(0, DAYS(MX(cm_x_s, cm_c_s, cm_u_s), MN(cm_x_t, cm_c_t, cm_u_t)) + 1) * (cm_x_in == True and cm_c_in == True and cm_u_in == True) - MX(0, DAYS(MX(cm_f_s, cm_x_s, cm_c_s, cm_u_s), MN(cm_f_t, cm_x_t, cm_c_t, cm_u_t)) + 1) * (cm_f_in == True and cm_x_in == True and cm_c_in == True and cm_u_in == True)
  - cm_le: MX((cm_f_in and cm_f_e) or '0001-01-01', (cm_x_in and cm_x_e) or '0001-01-01', (cm_c_in and cm_c_e) or '0001-01-01', (cm_u_in and cm_u_e) or '0001-01-01')
  - cm_cover: cm_union if (cm_cnt >= 2 and cm_union > 0) else (cm_union if (cm_cnt == 1 and ((cm_f_in and cm_f_x < cm_end) or (cm_x_in and cm_x_x < cm_end) or (cm_c_in and cm_c_x < cm_end) or (cm_u_in and cm_u_x < cm_end))) else MX(0, DAYS(MX(cm_start, cm_le), cm_closed) + 1) * (cm_cnt >= 1))
  - cm_first_s: MN((cm_f_in and cm_f_s) or '9999-12-31', (cm_x_in and cm_x_s) or '9999-12-31', (cm_c_in and cm_c_s) or '9999-12-31', (cm_u_in and cm_u_s) or '9999-12-31')
  - cm_last_t: MX((cm_f_in and cm_f_t) or '0001-01-01', (cm_x_in and cm_x_t) or '0001-01-01', (cm_c_in and cm_c_t) or '0001-01-01', (cm_u_in and cm_u_t) or '0001-01-01')
  - cm_gap: MX(0, DAYS(cm_first_s, cm_last_t) + 1 - cm_union) * (cm_cnt >= 2)
  - cm_book: float(CFIELD('contract','vehicle_book_value_usd', contract_id=F('contract_id')) or 0)
  - cm_gvalue: K('cm_grace_value_low') if (cm_book > 0 and cm_book <= K('cm_grace_value_low_usd')) else (K('cm_grace_value_mid') if (cm_book > K('cm_grace_value_low_usd') and cm_book <= K('cm_grace_value_mid_usd')) else 0)
  - cm_st: CFIELD('contract','state_code', contract_id=F('contract_id')) or ''
  - cm_gstate: K('cm_grace_gulf') if (cm_st == 'TX' or cm_st == 'LA') else (K('cm_grace_plains') if (cm_st == 'OK' or cm_st == 'AR') else 0)
  - cm_year: int(CFIELD('contract','vehicle_year', contract_id=F('contract_id')) or 0)
  - cm_gyear: K('cm_grace_year_old') if (cm_year > 0 and cm_year <= K('cm_grace_old_year')) else (K('cm_grace_year_mid') if (cm_year > K('cm_grace_old_year') and cm_year <= K('cm_grace_mid_year')) else 0)
  - cm_post: MX(0, DAYS(cm_closed, cm_end))
  - cm_emin: MN((cm_f_ok and cm_f_e) or '9999-12-31', (cm_x_ok and cm_x_e) or '9999-12-31', (cm_c_ok and cm_c_e) or '9999-12-31', (cm_u_ok and cm_u_e) or '9999-12-31')
  - cm_lead: DAYS(F('placement_effective_date') or '0001-01-01', cm_emin)
  - cm_basis: (cm_base_basis if not cm_ext else ('full_no_lapse' if cm_lead <= 0 else ('pro_rata_from_proof_effective' if cm_cnt >= 1 else 'pro_rata_from_closure')))
  - result: RND(cm_amt * (cm_base_days if not cm_ext else (cm_days if cm_basis == 'full_no_lapse' else ((cm_cover + MN(cm_gap, cm_gvalue + cm_gstate + cm_gyear) + cm_post) if cm_basis == 'pro_rata_from_proof_effective' else cm_post))) / cm_days, 2)
  compute_basis:
    cm_start: The charge the closing-month refund refunds is the capitalised premium charge on the record (billing_method added_to_contract_balance) with the latest billing_period_start, its premium is the sum of the capitalised premium charged for that billing period, and its period days are the calendar days from its billing_period_start through its billing_period_end with both days counted.
    cm_amt: The charge the closing-month refund refunds is the capitalised premium charge on the record (billing_method added_to_contract_balance) with the latest billing_period_start, its premium is the sum of the capitalised premium charged for that billing period, and its period days are the calendar days from its billing_period_start through its billing_period_end with both days counted.
    cm_end: The charge the closing-month refund refunds is the capitalised premium charge on the record (billing_method added_to_contract_balance) with the latest billing_period_start, its premium is the sum of the capitalised premium charged for that billing period, and its period days are the calendar days from its billing_period_start through its billing_period_end with both days counted.
    cm_days: The charge the closing-month refund refunds is the capitalised premium charge on the record (billing_method added_to_contract_balance) with the latest billing_period_start, its premium is the sum of the capitalised premium charged for that billing period, and its period days are the calendar days from its billing_period_start through its billing_period_end with both days counted.
