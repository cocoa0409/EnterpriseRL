  rule: 'This rule governs the re-review, at the borrower''s request and on a closed tracking record only, of a proof of the borrower''s own insurance that the insurer faxed to the company (insurer_fax) and that a first review rejected because a deductible was above the plan''s borrower_max_deductible_usd or because its expiration date was too close to the review date. The faxed proof re-reviewed is the most recent faxed proof on the tracking record by review date (where two entries share that date, the one recorded first counts), and the re-review keeps every detail that entry shows exactly as first recorded, including the date of that first review. The faxed proof''s lienholder test is the base test: it passes only when its own entry shows the company as lienholder and loss payee. Each deductible ceiling of the faxed proof is the plan''s borrower_max_deductible_usd plus every allowance this rule states for that deductible. The faxed proof''s model-year comprehensive allowance is fax_age_allow_old
    for a financed vehicle of model year fax_old_model_year or earlier and fax_age_allow_mid for model years after fax_old_model_year through fax_mid_model_year. The faxed proof''s loan-to-value comprehensive allowance is fax_ltv_allow_low when the amount financed was no more than fax_ltv_low_pct percent of the vehicle book value at signing and fax_ltv_allow_mid when it was above fax_ltv_low_pct and no more than fax_ltv_mid_pct percent. The faxed proof''s vehicle-value collision allowance is fax_value_allow_low when the vehicle book value on the contract is no more than fax_value_low_usd and fax_value_allow_mid when it is above fax_value_low_usd and no more than fax_value_mid_usd. The faxed proof''s credit-tier collision allowance is fax_tier_allow_prime for a contract on Tier 1 Select, Tier 2 Preferred or Tier 3 Advantage and fax_tier_allow_near for a contract on Tier 4 Standard or Tier 5 Rebuild. As the standard method, the faxed proof''s comprehensive and collision deductibles may each
    be no higher than the plan''s borrower_max_deductible_usd, with no allowance. The faxed proof''s expiry buffer is fax_buffer_gulf days for a contract whose contract state is TX or LA and fax_buffer_plains days for a contract whose contract state is OK or AR. As the standard method, the faxed proof''s expiry buffer is min_days_to_expiration_at_verification calendar days. The faxed proof''s reach date is the date of the first review when the contract was paid off, and the contract''s repossession_date when the contract was not paid off but carries a repossession_date. As the standard method, the faxed proof''s reach date is the re-review date. The re-review outcome of a faxed proof is the first failing test in this order: the lienholder test (rejected_no_lienholder), then the comprehensive and collision deductible tests together (rejected_deductible_too_high), then the coverage-reach test, passed when the policy_expiration_date is at least the expiry buffer after the reach date (rejected_expiring);
    a faxed proof that passes all of them is accepted; where the record carries no faxed proof, or its most recent one is already accepted or was rejected for a reason this rule does not re-review, there is nothing to re-review and the outcome is not_applicable; on a tracking record that is not closed this rule does not apply and its outcome is not_applicable. The physical-damage coverage, VIN and named-insured results stand as the first review recorded them, because the first review''s rejection reason comes after them in the base order. In a re-review, a faxed proof counts as a policy and the binder-period test does not apply to it. On a closed tracking record, a rejected faxed proof is re-reviewed solely to fix the premium refunds owed on the record, and an accepted re-review there is recorded as a new review entry only: it never changes the record''s status, never updates the policy details on file and mails no notice. Outside this rule the base proof-review rule stays in force: on a
    tracking record that is not closed every proof review follows it, an accepted proof updating the policy details on file and, on a record in pending_verification, lapse_notice or force_placed status, returning the record to compliant, a return on a force_placed record cancelling the placed coverage, after which refunds follow cpi_cancellation_refund and a cancellation notice is mailed within cancellation_notice_days, and acceptance requiring comprehensive and collision deductibles no higher than borrower_max_deductible_usd, a policy_expiration_date at least min_days_to_expiration_at_verification days after the review date and, for a binder, binder_accepted true and a binder period no longer than binder_max_days; on a closed tracking record no first review is made, no proof that arrived through an insurance agent call is re-reviewed, because a call leaves no document to review again, and no uploaded proof showing a coverage period longer than binder_max_days is re-reviewed; a rejected
    feed proof and a rejected uploaded binder on a closed record are not governed by this rule but each by the re-review rule written for it.'
