  compute:
  - fx_count: COUNT('cpi_activities', event_type='cpi_proof_verified', verification_source='insurer_fax')
  - fx_res: LATEST('cpi_activities','proof_result', event_type='cpi_proof_verified', verification_source='insurer_fax', date_field='activity_date') or ''
  - fx_flag: LATEST('cpi_activities','lienholder_listed', event_type='cpi_proof_verified', verification_source='insurer_fax', date_field='activity_date')
  - fx_comp: float(LATEST('cpi_activities','comprehensive_deductible_usd', event_type='cpi_proof_verified', verification_source='insurer_fax', date_field='activity_date') or 0)
  - fx_coll: float(LATEST('cpi_activities','collision_deductible_usd', event_type='cpi_proof_verified', verification_source='insurer_fax', date_field='activity_date') or 0)
  - fx_eff: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', verification_source='insurer_fax', date_field='activity_date') or '9999-12-31'
  - fx_exp: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', verification_source='insurer_fax', date_field='activity_date') or '0001-01-01'
  - fx_year: int(CFIELD('contract','vehicle_year', contract_id=F('contract_id')) or 0)
  - fx_age_allow: K('fax_age_allow_old') if (fx_year > 0 and fx_year <= K('fax_old_model_year')) else (K('fax_age_allow_mid') if (fx_year > K('fax_old_model_year') and fx_year <= K('fax_mid_model_year')) else 0.0)
  - fx_ltv: 100.0 * float(CFIELD('contract','amount_financed_usd', contract_id=F('contract_id')) or 0) / MX(1.0, float(CFIELD('contract','vehicle_book_value_usd', contract_id=F('contract_id')) or 0))
  - fx_ltv_allow: K('fax_ltv_allow_low') if (fx_ltv > 0 and fx_ltv <= K('fax_ltv_low_pct')) else (K('fax_ltv_allow_mid') if (fx_ltv > K('fax_ltv_low_pct') and fx_ltv <= K('fax_ltv_mid_pct')) else 0.0)
  - fx_book: float(CFIELD('contract','vehicle_book_value_usd', contract_id=F('contract_id')) or 0)
  - fx_value_allow: K('fax_value_allow_low') if (fx_book > 0 and fx_book <= K('fax_value_low_usd')) else (K('fax_value_allow_mid') if (fx_book > K('fax_value_low_usd') and fx_book <= K('fax_value_mid_usd')) else 0.0)
  - fx_tier: CFIELD('contract','variant_name', contract_id=F('contract_id')) or ''
  - fx_tier_allow: K('fax_tier_allow_prime') if (fx_tier == 'Tier 1 Select' or fx_tier == 'Tier 2 Preferred' or fx_tier == 'Tier 3 Advantage') else (K('fax_tier_allow_near') if (fx_tier == 'Tier 4 Standard' or fx_tier == 'Tier 5 Rebuild') else 0.0)
  - fx_first: LATEST('cpi_activities','activity_date', event_type='cpi_proof_verified', verification_source='insurer_fax', date_field='activity_date') or NOW
  - fx_repo: CFIELD('contract','repossession_date', contract_id=F('contract_id')) or ''
  - fx_cstat: CFIELD('contract','status', contract_id=F('contract_id')) or ''
  - fx_anchor: fx_first if fx_cstat == 'paid_off' else (fx_repo if fx_repo != '' else NOW)
  - fx_state: CFIELD('contract','state_code', contract_id=F('contract_id')) or ''
  - fx_buffer: K('fax_buffer_gulf') if (fx_state == 'TX' or fx_state == 'LA') else (K('fax_buffer_plains') if (fx_state == 'OK' or fx_state == 'AR') else P('min_days_to_expiration_at_verification'))
  - result: '''not_applicable'' if (F(''status'') != ''closed'' or fx_count == 0 or not (fx_res == ''rejected_deductible_too_high'' or fx_res == ''rejected_expiring'')) else (''rejected_no_lienholder'' if not (fx_flag == True) else (''rejected_deductible_too_high'' if (fx_comp > P(''borrower_max_deductible_usd'') + fx_age_allow + fx_ltv_allow or fx_coll > P(''borrower_max_deductible_usd'') + fx_value_allow + fx_tier_allow) else (''rejected_expiring'' if DAYS(fx_anchor, fx_exp) < fx_buffer else ''accepted'')))'
  compute_basis:
    fx_count: 'The re-review outcome of a faxed proof is the first failing test in this order: the lienholder test (rejected_no_lienholder), then the comprehensive and collision deductible tests together (rejected_deductible_too_high), then the coverage-reach test, passed when the policy_expiration_date is at least the expiry buffer after the reach date (rejected_expiring); a faxed proof that passes all of them is accepted; where the record carries no faxed proof, or its most recent one is already accepted or was rejected for a reason this rule does not re-review, there is nothing to re-review and the outcome is not_applicable; on a tracking record that is not closed this rule does not apply and its outcome is not_applicable.'
    fx_res: 'The re-review outcome of a faxed proof is the first failing test in this order: the lienholder test (rejected_no_lienholder), then the comprehensive and collision deductible tests together (rejected_deductible_too_high), then the coverage-reach test, passed when the policy_expiration_date is at least the expiry buffer after the reach date (rejected_expiring); a faxed proof that passes all of them is accepted; where the record carries no faxed proof, or its most recent one is already accepted or was rejected for a reason this rule does not re-review, there is nothing to re-review and the outcome is not_applicable; on a tracking record that is not closed this rule does not apply and its outcome is not_applicable.'
    fx_flag: 'The faxed proof''s lienholder test is the base test: it passes only when its own entry shows the company as lienholder and loss payee.'
