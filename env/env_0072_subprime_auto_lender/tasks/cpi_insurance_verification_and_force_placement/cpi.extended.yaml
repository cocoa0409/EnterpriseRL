category: cpi
display_name: Collateral Protection Insurance
binding:
  holding_table: cpi_coverages
  event_tables:
  - cpi_activities
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_billed_usd: cpi_premium_net
lifecycle:
  states:
  - pending_verification
  - compliant
  - lapse_notice
  - force_placed
  - closed
  transitions:
  - from: pending_verification
    to: compliant
    by: system
    means: Proof of the borrower's own physical-damage insurance meeting the contract requirement is verified after funding.
  - from: pending_verification
    to: lapse_notice
    by: system
    means: No acceptable proof is verified within the initial proof period after funding.
  - from: compliant
    to: lapse_notice
    by: system
    means: The borrower's insurance is cancelled, non-renewed or expires with no acceptable replacement on file.
  - from: lapse_notice
    to: compliant
    by: agent
    means: Acceptable proof of coverage is verified before placement.
  - from: lapse_notice
    to: force_placed
    by: system
    means: Both lapse notices have been mailed, the notice periods have run and no acceptable proof is on file; collateral protection insurance is placed.
  - from: force_placed
    to: compliant
    by: agent
    means: Acceptable proof of coverage is verified on a force-placed record; the placed coverage is cancelled.
  - from: pending_verification
    to: closed
    by: system
    means: The contract leaves active servicing (paid off, unwound, liquidated or charged off) before proof is verified.
  - from: compliant
    to: closed
    by: system
    means: The contract leaves active servicing while coverage is compliant.
  - from: lapse_notice
    to: closed
    by: system
    means: The contract leaves active servicing during the notice period.
  - from: force_placed
    to: closed
    by: system
    means: The contract leaves active servicing while coverage is force-placed; unearned premium is refunded.
accounts:
- key: cpi_premium_net
  unit: USD
  meaning: 'Net force-placed premium charged to the borrower on this tracking record: increases (in) with each premium billing and decreases (out) with each premium refund.'
parameter_schema:
  required_coverages: Physical-damage coverages the borrower's own policy must carry on the financed VIN
  borrower_max_deductible_usd: Highest comprehensive or collision deductible the borrower's own policy may carry, USD
  loss_payee_clause: Exact lienholder and loss-payee wording the borrower's policy must show
  lienholder_listing_required: Whether proof is rejected when the company is not listed as lienholder and loss payee
  vin_match_required: Whether the policy must list the contract's exact 17-character VIN
  named_insured_rule: Who must be a named insured on the borrower's policy
  accepted_verification_sources: Channels through which proof of insurance is accepted
  binder_accepted: Whether an insurance binder is accepted as proof
  binder_max_days: Longest binder period accepted as proof, calendar days from the binder effective date
  min_days_to_expiration_at_verification: Minimum calendar days between the verification date and the policy expiration date for proof to be accepted without a renewal
  initial_proof_days: Calendar days after the contract is funded within which proof of the borrower's own insurance must be verified before the record moves to lapse_notice
  proof_review_hold_days: Calendar days a premium billing is held (held_pending_proof_review) while borrower-submitted proof is under review
  coverage_lapse_sources: Record events that establish a lapse
  first_notice_max_days_after_lapse_detection: Calendar days after the lapse is detected within which the first lapse notice is mailed
  second_notice_days_after_first: Minimum calendar days between the first and second lapse notices
  notice_delivery_method: How lapse, placement, deficient-proof and cancellation notices are delivered
  notice_email_copy: Whether an email copy of each notice is sent when an email is on file
  notice_includes_cost_estimate: Whether lapse notices state the plan's monthly premium and deductible
  deficient_proof_notice_days: Calendar days after a proof is rejected within which a deficient-proof notice is mailed
  placement_notice_days: Calendar days after placement within which the placement notice and certificate are mailed
  cancellation_notice_days: Calendar days after proof is accepted on a force-placed record within which the cancellation notice is mailed
  placement_min_days_after_first_notice: Minimum calendar days from the first lapse notice to placement
  placement_min_days_after_second_notice: Minimum calendar days from the second lapse notice to placement
  coverage_type: Coverage the company places
  provides_liability_coverage: Whether placed coverage includes liability or any protection for the borrower
  placement_backdate_max_days: Maximum calendar days before the placement date that the coverage effective date may reach back
  monthly_premium_usd: Premium for each monthly billing period of placed coverage, USD
  cpi_deductible_usd: Deductible on a claim under placed coverage, USD
  max_coverage_usd: Maximum claim payment under placed coverage, USD (claims pay the lesser of actual cash value, the contract payoff and this cap)
  premium_billing_frequency: Billing cadence of placed coverage
  premium_earning_basis: How premium is earned within a billing period
  first_period_proration: Whether the first billing period, starting on the coverage effective date and ending the day before the next placement-day anniversary, is prorated by actual days on the monthly premium x 12 / 365
  cpi_term_months: Term of one placement before renewal, months
  renewal_requires_new_notices: Whether a renewal of placed coverage requires a new first and second notice
  premium_rounding: Rounding of every prorated premium and refund
  cpi_tracking_fee_usd: Fee charged for insurance tracking, USD
  premium_billing_excluded_contract_statuses: Contract statuses during which no CPI premium is billed
  interest_on_capitalized_premium: Whether a premium added to the contract balance accrues contract interest
  acv_source: Valuation used to place a record in a plan band
  band_reassessment_months: Months after placement at which the band is reassessed at renewal
  flat_cancel_if_continuous: Whether every premium is refunded when accepted proof shows coverage effective on or before the CPI coverage effective date
  partial_refund_basis: Refund basis when accepted proof starts after the CPI coverage effective date
  closure_refund_basis: Refund basis for unearned premium when the record closes with the contract
  refund_processing_days: Calendar days after the triggering acceptance or closure within which the refund is issued
  refund_min_check_usd: Smallest refund mailed by check; smaller residual refunds to a borrower with no open balance are not mailed, USD
  refund_disposition_order: Where a refund goes, first applicable wins
  retroactive_reinstatement_accepted: Whether an insurer's reinstatement of the borrower's policy without a gap counts as continuous coverage
  max_open_records_per_contract: Tracking records open (not closed) at once for one contract, count
  multi_vehicle_policy_accepted: Whether one borrower policy listing several financed VINs may satisfy each of those contracts
