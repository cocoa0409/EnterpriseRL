    fx_exp: The faxed proof re-reviewed is the most recent faxed proof on the tracking record by review date (where two entries share that date, the one recorded first counts), and the re-review keeps every detail that entry shows exactly as first recorded, including the date of that first review.
    fx_year: The faxed proof's model-year comprehensive allowance is fax_age_allow_old for a financed vehicle of model year fax_old_model_year or earlier and fax_age_allow_mid for model years after fax_old_model_year through fax_mid_model_year.
