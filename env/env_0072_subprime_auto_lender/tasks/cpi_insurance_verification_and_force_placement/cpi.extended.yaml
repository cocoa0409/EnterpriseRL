    cm_cnt: 'The proofs the closing-month refund reads are taken from every arrival channel alike (insurer_edi_feed, insurer_fax, insurance_agent_call and declarations_page_upload, binder or declarations page): for each channel, the record''s one accepted proof of that channel, if any; the channel decides only which rule reviewed a proof, never how its days count. Such a proof counts for the period when its expiration date falls on or after the period start, a counting proof reaches the covered stretch when it also took effect on or before the closed_date, and a reaching proof''s span runs from the later of the period start and its effective date through the earlier of its expiration date and the closed_date.'
    cm_union: When two or more proofs reach the covered stretch, the closing-month refund's covered days are the days inside any of their spans, a day inside several counted once.
    cm_le: As the standard method, the closing-month refund's covered days are the days of the period from the latest policy_effective_date among the reaching proofs through the closed_date, both ends counted.
    cm_cover: When two or more proofs reach the covered stretch, the closing-month refund's covered days are the days inside any of their spans, a day inside several counted once. When exactly one proof reaches the covered stretch and it expires inside the period, the closing-month refund's covered days are the days of its span. As the standard method, the closing-month refund's covered days are the days of the period from the latest policy_effective_date among the reaching proofs through the closed_date, both ends counted.
    cm_first_s: For the closing-month refund, the replacement days are the days from the start of the earliest reaching span through the end of the latest reaching span that no reaching span covers, and the first of them count as covered, as many as the sum of every replacement-grace allowance this rule states.
    cm_last_t: For the closing-month refund, the replacement days are the days from the start of the earliest reaching span through the end of the latest reaching span that no reaching span covers, and the first of them count as covered, as many as the sum of every replacement-grace allowance this rule states.
    cm_gap: For the closing-month refund, the replacement days are the days from the start of the earliest reaching span through the end of the latest reaching span that no reaching span covers, and the first of them count as covered, as many as the sum of every replacement-grace allowance this rule states.
    cm_book: The vehicle-value replacement-grace allowance is cm_grace_value_low days when the vehicle book value on the contract is no more than cm_grace_value_low_usd and cm_grace_value_mid days when it is above cm_grace_value_low_usd and no more than cm_grace_value_mid_usd.
    cm_gvalue: The vehicle-value replacement-grace allowance is cm_grace_value_low days when the vehicle book value on the contract is no more than cm_grace_value_low_usd and cm_grace_value_mid days when it is above cm_grace_value_low_usd and no more than cm_grace_value_mid_usd.
    cm_st: The state replacement-grace allowance is cm_grace_gulf days for a contract whose contract state is TX or LA and cm_grace_plains days for a contract whose contract state is OK or AR.
    cm_gstate: The state replacement-grace allowance is cm_grace_gulf days for a contract whose contract state is TX or LA and cm_grace_plains days for a contract whose contract state is OK or AR.
    cm_year: The model-year replacement-grace allowance is cm_grace_year_old days for a financed vehicle of model year cm_grace_old_year or earlier and cm_grace_year_mid days for model years after cm_grace_old_year through cm_grace_mid_year.
    cm_gyear: The model-year replacement-grace allowance is cm_grace_year_old days for a financed vehicle of model year cm_grace_old_year or earlier and cm_grace_year_mid days for model years after cm_grace_old_year through cm_grace_mid_year. As the standard method, every replacement-grace allowance of the closing-month refund is 0 days, so no day of a replacement gap counts as covered.
    cm_post: A charge whose period ends on the closed_date has no post-closing days.
    cm_emin: The closing-month refund's refund basis is full_no_lapse, with every day of the period refundable, when a counting proof took effect on or before the record's placement_effective_date, so that the borrower's own coverage ran with no gap from the CPI coverage effective date into the period (an insurer's reinstatement of the policy on file without a gap is such a proof, retroactive_reinstatement_accepted); it is pro_rata_from_closure, with only the post-closing days refundable, when no counting proof reaches the covered stretch; otherwise it is pro_rata_from_proof_effective, and the refundable days add together the covered days, the replacement days this rule counts as covered, and the post-closing days.
    cm_lead: The closing-month refund's refund basis is full_no_lapse, with every day of the period refundable, when a counting proof took effect on or before the record's placement_effective_date, so that the borrower's own coverage ran with no gap from the CPI coverage effective date into the period (an insurer's reinstatement of the policy on file without a gap is such a proof, retroactive_reinstatement_accepted); it is pro_rata_from_closure, with only the post-closing days refundable, when no counting proof reaches the covered stretch; otherwise it is pro_rata_from_proof_effective, and the refundable days add together the covered days, the replacement days this rule counts as covered, and the post-closing days.
    cm_basis: The closing-month refund's refund basis is full_no_lapse, with every day of the period refundable, when a counting proof took effect on or before the record's placement_effective_date, so that the borrower's own coverage ran with no gap from the CPI coverage effective date into the period (an insurer's reinstatement of the policy on file without a gap is such a proof, retroactive_reinstatement_accepted); it is pro_rata_from_closure, with only the post-closing days refundable, when no counting proof reaches the covered stretch; otherwise it is pro_rata_from_proof_effective, and the refundable days add together the covered days, the replacement days this rule counts as covered, and the post-closing days.
    result: The closing-month refund's refund basis is full_no_lapse, with every day of the period refundable, when a counting proof took effect on or before the record's placement_effective_date, so that the borrower's own coverage ran with no gap from the CPI coverage effective date into the period (an insurer's reinstatement of the policy on file without a gap is such a proof, retroactive_reinstatement_accepted); it is pro_rata_from_closure, with only the post-closing days refundable, when no counting proof reaches the covered stretch; otherwise it is pro_rata_from_proof_effective, and the refundable days add together the covered days, the replacement days this rule counts as covered, and the post-closing days.
  factors:
  - id: cm_cover_rule
    effect: method
    decides: cm_cover
    bindings:
    - cm_cover
    ladder:
    - when: two or more proofs reach the covered stretch
      method: covered days are the days inside any of their spans, a day inside several counted once
    - when: exactly one proof reaches the covered stretch and it expires inside the period
      method: covered days are the days of its span
    - when: otherwise
      method: covered days run from the latest reaching effective date through the closed date
    baseline:
      cm_cover: MX(0, DAYS(MX(cm_start, cm_le), cm_closed) + 1) * (cm_cnt >= 1)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: cm_value_grace
    effect: parameter
    decides: cm_gvalue
    bindings:
    - cm_book
    - cm_gvalue
    ladder:
    - when: the vehicle book value on the contract is no more than cm_grace_value_low_usd
      value: K('cm_grace_value_low')
    - when: the book value is above cm_grace_value_low_usd and no more than cm_grace_value_mid_usd
      value: K('cm_grace_value_mid')
    - when: otherwise
      value: '0'
    baseline:
      cm_gvalue: '0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: cm_state_grace
    effect: parameter
    decides: cm_gstate
    bindings:
    - cm_st
    - cm_gstate
    ladder:
    - when: the contract state is TX or LA
      value: K('cm_grace_gulf')
    - when: the contract state is OK or AR
      value: K('cm_grace_plains')
    - when: otherwise
      value: '0'
    baseline:
      cm_gstate: '0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: cm_year_grace
    effect: parameter
    decides: cm_gyear
    bindings:
    - cm_year
    - cm_gyear
    ladder:
    - when: the financed vehicle's model year is cm_grace_old_year or earlier
      value: K('cm_grace_year_old')
    - when: the model year is after cm_grace_old_year and no later than cm_grace_mid_year
      value: K('cm_grace_year_mid')
    - when: otherwise
      value: '0'
    baseline:
      cm_gyear: '0'
    evidence:
    - cross_category
    cross_difficulty: contract
  baseline:
    rule: 'The charge the closing-month refund refunds is the capitalised premium charge on the record (billing_method added_to_contract_balance) with the latest billing_period_start, its premium is the sum of the capitalised premium charged for that billing period, and its period days are the calendar days from its billing_period_start through its billing_period_end with both days counted. The proofs the closing-month refund reads are taken from every arrival channel alike (insurer_edi_feed, insurer_fax, insurance_agent_call and declarations_page_upload, binder or declarations page): for each channel, the record''s one accepted proof of that channel, if any; the channel decides only which rule reviewed a proof, never how its days count. Such a proof counts for the period when its expiration date falls on or after the period start, a counting proof reaches the covered stretch when it also took effect on or before the closed_date, and a reaching proof''s span runs from the later of the period
      start and its effective date through the earlier of its expiration date and the closed_date. The closing-month refund''s refund basis is full_no_lapse, with every day of the period refundable, when a counting proof took effect on or before the record''s placement_effective_date, so that the borrower''s own coverage ran with no gap from the CPI coverage effective date into the period (an insurer''s reinstatement of the policy on file without a gap is such a proof, retroactive_reinstatement_accepted); it is pro_rata_from_closure, with only the post-closing days refundable, when no counting proof reaches the covered stretch; otherwise it is pro_rata_from_proof_effective, and the refundable days add together the covered days, the replacement days this rule counts as covered, and the post-closing days. As the standard method, the closing-month refund''s covered days are the days of the period from the latest policy_effective_date among the reaching proofs through the closed_date, both ends
      counted. For the closing-month refund, the replacement days are the days from the start of the earliest reaching span through the end of the latest reaching span that no reaching span covers, and the first of them count as covered, as many as the sum of every replacement-grace allowance this rule states. As the standard method, every replacement-grace allowance of the closing-month refund is 0 days, so no day of a replacement gap counts as covered. A charge whose period ends on the closed_date has no post-closing days. The closing-month refund is the charge''s premium multiplied by its refundable days and divided by its period days, rounded half-up to the cent; the refund carries no interest, fee or credit, and a mailed refund below refund_min_check_usd is not issued.'
