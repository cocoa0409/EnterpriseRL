    baseline:
      fx_age_allow: '0.0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: fax_ltv_allow
    effect: parameter
    decides: fx_ltv_allow
    bindings:
    - fx_ltv
    - fx_ltv_allow
    ladder:
    - when: the amount financed was no more than fax_ltv_low_pct percent of the book value at signing
      value: K('fax_ltv_allow_low')
    - when: it was above fax_ltv_low_pct and no more than fax_ltv_mid_pct percent
      value: K('fax_ltv_allow_mid')
    - when: otherwise
      value: '0.00'
    baseline:
      fx_ltv_allow: '0.0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: fax_value_allow
    effect: parameter
    decides: fx_value_allow
    bindings:
    - fx_book
    - fx_value_allow
    ladder:
    - when: the vehicle book value on the contract is no more than fax_value_low_usd
      value: K('fax_value_allow_low')
    - when: the book value is above fax_value_low_usd and no more than fax_value_mid_usd
      value: K('fax_value_allow_mid')
    - when: otherwise
      value: '0.00'
    baseline:
      fx_value_allow: '0.0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: fax_tier_allow
    effect: parameter
    decides: fx_tier_allow
    bindings:
    - fx_tier
    - fx_tier_allow
    ladder:
    - when: the contract is on Tier 1 Select, Tier 2 Preferred or Tier 3 Advantage
      value: K('fax_tier_allow_prime')
    - when: the contract is on Tier 4 Standard or Tier 5 Rebuild
      value: K('fax_tier_allow_near')
    - when: otherwise
      value: '0.00'
    baseline:
      fx_tier_allow: '0.0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: fax_reach_anchor
    effect: method
    decides: fx_anchor
    bindings:
    - fx_first
    - fx_repo
    - fx_cstat
    - fx_anchor
    ladder:
    - when: the contract was paid off
      method: the reach date is the date of the first review
    - when: the contract was not paid off but carries a repossession date
      method: the reach date is the contract's repossession date
    - when: otherwise
      method: the reach date is the re-review date
    baseline:
      fx_anchor: NOW
    evidence:
    - history
    - date
    cross_difficulty: contract
  - id: fax_buffer_days
    effect: parameter
    decides: fx_buffer
    bindings:
    - fx_state
    - fx_buffer
    ladder:
    - when: the contract state is TX or LA
      value: K('fax_buffer_gulf')
    - when: the contract state is OK or AR
      value: K('fax_buffer_plains')
    - when: otherwise
      value: P('min_days_to_expiration_at_verification')
    baseline:
      fx_buffer: P('min_days_to_expiration_at_verification')
    evidence:
    - cross_category
    cross_difficulty: contract
  baseline:
    rule: 'The faxed proof re-reviewed is the most recent faxed proof on the tracking record by review date (where two entries share that date, the one recorded first counts), and the re-review keeps every detail that entry shows exactly as first recorded, including the date of that first review. The faxed proof''s lienholder test is the base test: it passes only when its own entry shows the company as lienholder and loss payee. As the standard method, the faxed proof''s comprehensive and collision deductibles may each be no higher than the plan''s borrower_max_deductible_usd, with no allowance. As the standard method, the faxed proof''s expiry buffer is min_days_to_expiration_at_verification calendar days. As the standard method, the faxed proof''s reach date is the re-review date. The re-review outcome of a faxed proof is the first failing test in this order: the lienholder test (rejected_no_lienholder), then the comprehensive and collision deductible tests together (rejected_deductible_too_high),
      then the coverage-reach test, passed when the policy_expiration_date is at least the expiry buffer after the reach date (rejected_expiring); a faxed proof that passes all of them is accepted; where the record carries no faxed proof, or its most recent one is already accepted or was rejected for a reason this rule does not re-review, there is nothing to re-review and the outcome is not_applicable; on a tracking record that is not closed this rule does not apply and its outcome is not_applicable.'
    params:
    - borrower_max_deductible_usd
    - min_days_to_expiration_at_verification
  inputs:
    history:
    - table: cpi_activities
      aggregate: latest
      field: comprehensive_deductible_usd
      filters:
        event_type: cpi_proof_verified
    cross_category:
    - contract
- id: cpi_ext_closing_period_refund
  base_policy_refs:
  - cpi_cancellation_refund
  - cpi_evt_premium_billing
  - cpi_agg_multi_vehicle_policy
  overwrite:
  - base_policy: cpi_cancellation_refund
    superseded_clause: When accepted proof starts after the CPI coverage effective date, each unrefunded charge is refunded for the days of its billing period on or after the proof's policy_effective_date (refund_basis pro_rata_from_proof_effective, partial_refund_basis), and days before that date stay earned.
    replaced_by: 'For the capitalised premium charge with the latest billing_period_start on a tracking record that closed while force_placed because its contract was paid off, when an accepted proof counts for that charge''s period and no verification_source holds more than one accepted cpi_proof_verified entry on the record, the refund is fixed by the closing-month refund rule if the period ends on the closed_date and by the closing-period refund rule if it runs past the closed_date; that charge in any other case, and every other charge, keep the base refund rule in force: A premium charge can be refunded only once. When accepted proof shows coverage effective on or before the CPI coverage effective date with no gap (flat_cancel_if_continuous), every premium charge of the placement is refunded in full (refund_basis full_no_lapse). When accepted proof starts after the CPI coverage effective date, each unrefunded charge is refunded for the days of its billing period on or after the proof''s
      policy_effective_date (refund_basis pro_rata_from_proof_effective, partial_refund_basis), and days before that date stay earned. When the record closes because the contract left active servicing while force_placed, each unrefunded charge is refunded for the days of its billing period after the contract''s closed_date (refund_basis pro_rata_from_closure, closure_refund_basis). Where that latest charge stays under the base refund rule, the accepted proof the base rule reads is the record''s accepted proof with the latest policy_effective_date, whatever its channel, and where two accepted proofs share that date the one recorded first counts; its coverage is effective on or before the CPI coverage effective date with no gap when it took effect on or before the record''s placement_effective_date and expires on or after it; and, the charge being refunded only once, when the proof clause and the closure clause both apply it is refunded once for every day either clause gives, under refund_basis
      pro_rata_from_proof_effective when the proof clause gives it a day and pro_rata_from_closure otherwise.'
  - base_policy: cpi_cancellation_refund
    superseded_clause: When the record closes because the contract left active servicing while force_placed, each unrefunded charge is refunded for the days of its billing period after the contract's closed_date (refund_basis pro_rata_from_closure, closure_refund_basis).
    replaced_by: 'For the capitalised premium charge with the latest billing_period_start on a tracking record that closed while force_placed because its contract was paid off, when an accepted proof counts for that charge''s period and no verification_source holds more than one accepted cpi_proof_verified entry on the record, the refund is fixed by the closing-month refund rule if the period ends on the closed_date and by the closing-period refund rule if it runs past the closed_date; that charge in any other case, and every other charge, keep the base refund rule in force: A premium charge can be refunded only once. When accepted proof shows coverage effective on or before the CPI coverage effective date with no gap (flat_cancel_if_continuous), every premium charge of the placement is refunded in full (refund_basis full_no_lapse). When accepted proof starts after the CPI coverage effective date, each unrefunded charge is refunded for the days of its billing period on or after the proof''s
      policy_effective_date (refund_basis pro_rata_from_proof_effective, partial_refund_basis), and days before that date stay earned. When the record closes because the contract left active servicing while force_placed, each unrefunded charge is refunded for the days of its billing period after the contract''s closed_date (refund_basis pro_rata_from_closure, closure_refund_basis). Where that latest charge stays under the base refund rule, the accepted proof the base rule reads is the record''s accepted proof with the latest policy_effective_date, whatever its channel, and where two accepted proofs share that date the one recorded first counts; its coverage is effective on or before the CPI coverage effective date with no gap when it took effect on or before the record''s placement_effective_date and expires on or after it; and, the charge being refunded only once, when the proof clause and the closure clause both apply it is refunded once for every day either clause gives, under refund_basis
      pro_rata_from_proof_effective when the proof clause gives it a day and pro_rata_from_closure otherwise.'
  trigger: on_request
  subject:
  - cpi_premium_refunded
  computes: amount_usd
  target_tool: mail_closing_period_refund_6483f0cd
  params:
    cp_grace_value_low: 2
    cp_grace_value_mid: 1
    cp_grace_value_low_usd: 12500.0
    cp_grace_value_mid_usd: 18000.0
    cp_grace_gulf: 2
    cp_grace_plains: 1
    cp_grace_year_old: 2
    cp_grace_year_mid: 1
    cp_grace_old_year: 2017
    cp_grace_mid_year: 2020
  rule: 'This rule governs the refund, by check to the borrower, of the capitalised premium charge with the latest billing_period_start when its billing period runs past the closed_date of a tracking record that closed while force_placed because its contract was paid off and an accepted proof of the borrower''s own coverage counts for that period; it applies only on a tracking record on which no verification_source holds more than one accepted cpi_proof_verified entry. The charge the closing-period refund refunds is the capitalised premium charge on the record (billing_method added_to_contract_balance) with the latest billing_period_start, its premium is the sum of the capitalised premium charged for that billing period, and its period days are the calendar days from its billing_period_start through its billing_period_end with both days counted. The proofs the closing-period refund reads are taken from every arrival channel alike (insurer_edi_feed, insurer_fax, insurance_agent_call and declarations_page_upload,
    binder or declarations page): for each channel, the record''s one accepted proof of that channel, if any; the channel decides only which rule reviewed a proof, never how its days count. Such a proof counts for the period when its expiration date falls on or after the period start, a counting proof reaches the covered stretch when it also took effect on or before the closed_date, and a reaching proof''s span runs from the later of the period start and its effective date through the earlier of its expiration date and the closed_date. The closing-period refund is fixed only after the records carry an accepted re-review of every rejected faxed proof whose shown coverage reaches into that billing period. The closing-period refund''s refund basis is full_no_lapse, with every day of the period refundable, when a counting proof took effect on or before the record''s placement_effective_date, so that the borrower''s own coverage ran with no gap from the CPI coverage effective date into the period
    (an insurer''s reinstatement of the policy on file without a gap is such a proof, retroactive_reinstatement_accepted); it is pro_rata_from_closure, with only the post-closing days refundable, when no counting proof reaches the covered stretch; otherwise it is pro_rata_from_proof_effective, and the refundable days add together the covered days, the replacement days this rule counts as covered, and the post-closing days. When two or more proofs reach the covered stretch, the closing-period refund''s covered days are the days inside any of their spans, a day inside several counted once. When exactly one proof reaches the covered stretch and it expires inside the period, the closing-period refund''s covered days are the days of its span. As the standard method, the closing-period refund''s covered days are the days of the period from the latest policy_effective_date among the reaching proofs through the closed_date, both ends counted. For the closing-period refund, the replacement days are
    the days from the start of the earliest reaching span through the end of the latest reaching span that no reaching span covers, and the first of them count as covered, as many as the sum of every replacement-grace allowance this rule states. The vehicle-value replacement-grace allowance is cp_grace_value_low days when the vehicle book value on the contract is no more than cp_grace_value_low_usd and cp_grace_value_mid days when it is above cp_grace_value_low_usd and no more than cp_grace_value_mid_usd. The state replacement-grace allowance is cp_grace_gulf days for a contract whose contract state is TX or LA and cp_grace_plains days for a contract whose contract state is OK or AR. The model-year replacement-grace allowance is cp_grace_year_old days for a financed vehicle of model year cp_grace_old_year or earlier and cp_grace_year_mid days for model years after cp_grace_old_year through cp_grace_mid_year. As the standard method, every replacement-grace allowance of the closing-period
    refund is 0 days, so no day of a replacement gap counts as covered. The closing-period refund''s post-closing days are the days of the period after the closed_date. The closing-period refund is the charge''s premium multiplied by its refundable days and divided by its period days, rounded half-up to the cent; the refund carries no interest, fee or credit, and a mailed refund below refund_min_check_usd is not issued. For the capitalised premium charge with the latest billing_period_start on a tracking record that closed while force_placed because its contract was paid off, when an accepted proof counts for that charge''s period and no verification_source holds more than one accepted cpi_proof_verified entry on the record, the refund is fixed by the closing-month refund rule if the period ends on the closed_date and by the closing-period refund rule if it runs past the closed_date; that charge in any other case, and every other charge, keep the base refund rule in force: A premium charge
    can be refunded only once. When accepted proof shows coverage effective on or before the CPI coverage effective date with no gap (flat_cancel_if_continuous), every premium charge of the placement is refunded in full (refund_basis full_no_lapse). When accepted proof starts after the CPI coverage effective date, each unrefunded charge is refunded for the days of its billing period on or after the proof''s policy_effective_date (refund_basis pro_rata_from_proof_effective, partial_refund_basis), and days before that date stay earned. When the record closes because the contract left active servicing while force_placed, each unrefunded charge is refunded for the days of its billing period after the contract''s closed_date (refund_basis pro_rata_from_closure, closure_refund_basis). Where that latest charge stays under the base refund rule, the accepted proof the base rule reads is the record''s accepted proof with the latest policy_effective_date, whatever its channel, and where two accepted
    proofs share that date the one recorded first counts; its coverage is effective on or before the CPI coverage effective date with no gap when it took effect on or before the record''s placement_effective_date and expires on or after it; and, the charge being refunded only once, when the proof clause and the closure clause both apply it is refunded once for every day either clause gives, under refund_basis pro_rata_from_proof_effective when the proof clause gives it a day and pro_rata_from_closure otherwise.'
  prerequisite:
  - problem: cpi_ext_fax_proof_rereview
    kind: value_input
    gate: cp_cover
    form: state
    policy_source: The closing-period refund is fixed only after the records carry an accepted re-review of every rejected faxed proof whose shown coverage reaches into that billing period.
    condition: cpi_activities carries, on the tracking record, an accepted cpi_proof_verified entry from insurer_fax for every rejected proof of that channel whose shown coverage reaches into the billing period of the most recent capitalised premium charge.
    resolved_by: rereview_faxed_proof_fc99cba3
    effect: The accepted re-review becomes a reaching proof whose span the covered-days ladder counts.
  cross_category:
  - category: contract
    as: branch
    reads:
    - vehicle_book_value_usd
    - state_code
    - vehicle_year
    note: The contract book value, state and vehicle model year decide the three replacement-grace allowances.
  compute:
  - cp_start: LATEST('cpi_activities','billing_period_start', date_field='billing_period_start', event_type='cpi_premium_charged', billing_method='added_to_contract_balance') or NOW
  - cp_amt: SUM('cpi_activities','amount_usd', event_type='cpi_premium_charged', billing_method='added_to_contract_balance', billing_period_start=cp_start)
  - cp_end: LATEST('cpi_activities','billing_period_end', date_field='billing_period_start', event_type='cpi_premium_charged', billing_method='added_to_contract_balance') or NOW
  - cp_days: MX(1, DAYS(cp_start, cp_end) + 1)
  - cp_closed: F('closed_date') or cp_end
  - cp_f_e: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_edi_feed', date_field='policy_effective_date') or '9999-12-31'
  - cp_f_x: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_edi_feed', date_field='policy_effective_date') or '0001-01-01'
  - cp_f_ok: cp_f_x >= cp_start
  - cp_f_in: cp_f_ok and cp_f_e <= cp_closed
  - cp_f_s: MX(cp_start, cp_f_e)
  - cp_f_t: MN(cp_f_x, cp_closed)
  - cp_x_e: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_fax', date_field='policy_effective_date') or '9999-12-31'
  - cp_x_x: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_fax', date_field='policy_effective_date') or '0001-01-01'
  - cp_x_ok: cp_x_x >= cp_start
  - cp_x_in: cp_x_ok and cp_x_e <= cp_closed
  - cp_x_s: MX(cp_start, cp_x_e)
  - cp_x_t: MN(cp_x_x, cp_closed)
  - cp_c_e: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurance_agent_call', date_field='policy_effective_date') or '9999-12-31'
  - cp_c_x: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurance_agent_call', date_field='policy_effective_date') or '0001-01-01'
  - cp_c_ok: cp_c_x >= cp_start
  - cp_c_in: cp_c_ok and cp_c_e <= cp_closed
  - cp_c_s: MX(cp_start, cp_c_e)
  - cp_c_t: MN(cp_c_x, cp_closed)
  - cp_u_e: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='declarations_page_upload', date_field='policy_effective_date') or '9999-12-31'
  - cp_u_x: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', verification_source='declarations_page_upload', date_field='policy_effective_date') or '0001-01-01'
  - cp_u_ok: cp_u_x >= cp_start
  - cp_u_in: cp_u_ok and cp_u_e <= cp_closed
  - cp_u_s: MX(cp_start, cp_u_e)
  - cp_u_t: MN(cp_u_x, cp_closed)
  - cp_f_k: COUNT('cpi_activities', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_edi_feed')
  - cp_x_k: COUNT('cpi_activities', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurer_fax')
  - cp_c_k: COUNT('cpi_activities', event_type='cpi_proof_verified', proof_result='accepted', verification_source='insurance_agent_call')
  - cp_u_k: COUNT('cpi_activities', event_type='cpi_proof_verified', proof_result='accepted', verification_source='declarations_page_upload')
  - cp_single: cp_f_k <= 1 and cp_x_k <= 1 and cp_c_k <= 1 and cp_u_k <= 1
  - cp_ext: cp_single and (cp_f_ok or cp_x_ok or cp_c_ok or cp_u_ok)
  - cp_le_b: LATEST('cpi_activities','policy_effective_date', event_type='cpi_proof_verified', proof_result='accepted', date_field='policy_effective_date') or '9999-12-31'
  - cp_lx_b: LATEST('cpi_activities','policy_expiration_date', event_type='cpi_proof_verified', proof_result='accepted', date_field='policy_effective_date') or '0001-01-01'
  - cp_pe: F('placement_effective_date') or '0001-01-01'
  - cp_b_full: cp_le_b <= cp_pe and cp_lx_b >= cp_pe
  - cp_b_prf: cp_le_b > cp_pe and cp_le_b != '9999-12-31'
  - cp_b_pdays: MX(0, DAYS(MX(cp_start, cp_le_b), cp_end) + 1) * (cp_b_prf == True)
  - cp_b_post: MX(0, DAYS(cp_closed, cp_end))
  - cp_base_days: cp_days if cp_b_full else MX(cp_b_pdays, cp_b_post)
  - cp_base_basis: '''full_no_lapse'' if cp_b_full else (''pro_rata_from_proof_effective'' if cp_b_pdays > 0 else ''pro_rata_from_closure'')'
  - cp_cnt: (cp_f_in == True) + (cp_x_in == True) + (cp_c_in == True) + (cp_u_in == True)
  - cp_union: MX(0, DAYS(cp_f_s, cp_f_t) + 1) * (cp_f_in == True) + MX(0, DAYS(cp_x_s, cp_x_t) + 1) * (cp_x_in == True) + MX(0, DAYS(cp_c_s, cp_c_t) + 1) * (cp_c_in == True) + MX(0, DAYS(cp_u_s, cp_u_t) + 1) * (cp_u_in == True) - MX(0, DAYS(MX(cp_f_s, cp_x_s), MN(cp_f_t, cp_x_t)) + 1) * (cp_f_in == True and cp_x_in == True) - MX(0, DAYS(MX(cp_f_s, cp_c_s), MN(cp_f_t, cp_c_t)) + 1) * (cp_f_in == True and cp_c_in == True) - MX(0, DAYS(MX(cp_f_s, cp_u_s), MN(cp_f_t, cp_u_t)) + 1) * (cp_f_in == True and cp_u_in == True) - MX(0, DAYS(MX(cp_x_s, cp_c_s), MN(cp_x_t, cp_c_t)) + 1) * (cp_x_in == True and cp_c_in == True) - MX(0, DAYS(MX(cp_x_s, cp_u_s), MN(cp_x_t, cp_u_t)) + 1) * (cp_x_in == True and cp_u_in == True) - MX(0, DAYS(MX(cp_c_s, cp_u_s), MN(cp_c_t, cp_u_t)) + 1) * (cp_c_in == True and cp_u_in == True) + MX(0, DAYS(MX(cp_f_s, cp_x_s, cp_c_s), MN(cp_f_t, cp_x_t, cp_c_t)) + 1) * (cp_f_in == True and cp_x_in == True and cp_c_in == True) + MX(0, DAYS(MX(cp_f_s, cp_x_s, cp_u_s), MN(cp_f_t,
      cp_x_t, cp_u_t)) + 1) * (cp_f_in == True and cp_x_in == True and cp_u_in == True) + MX(0, DAYS(MX(cp_f_s, cp_c_s, cp_u_s), MN(cp_f_t, cp_c_t, cp_u_t)) + 1) * (cp_f_in == True and cp_c_in == True and cp_u_in == True) + MX(0, DAYS(MX(cp_x_s, cp_c_s, cp_u_s), MN(cp_x_t, cp_c_t, cp_u_t)) + 1) * (cp_x_in == True and cp_c_in == True and cp_u_in == True) - MX(0, DAYS(MX(cp_f_s, cp_x_s, cp_c_s, cp_u_s), MN(cp_f_t, cp_x_t, cp_c_t, cp_u_t)) + 1) * (cp_f_in == True and cp_x_in == True and cp_c_in == True and cp_u_in == True)
  - cp_le: MX((cp_f_in and cp_f_e) or '0001-01-01', (cp_x_in and cp_x_e) or '0001-01-01', (cp_c_in and cp_c_e) or '0001-01-01', (cp_u_in and cp_u_e) or '0001-01-01')
  - cp_cover: cp_union if (cp_cnt >= 2 and cp_union > 0) else (cp_union if (cp_cnt == 1 and ((cp_f_in and cp_f_x < cp_end) or (cp_x_in and cp_x_x < cp_end) or (cp_c_in and cp_c_x < cp_end) or (cp_u_in and cp_u_x < cp_end))) else MX(0, DAYS(MX(cp_start, cp_le), cp_closed) + 1) * (cp_cnt >= 1))
  - cp_first_s: MN((cp_f_in and cp_f_s) or '9999-12-31', (cp_x_in and cp_x_s) or '9999-12-31', (cp_c_in and cp_c_s) or '9999-12-31', (cp_u_in and cp_u_s) or '9999-12-31')
  - cp_last_t: MX((cp_f_in and cp_f_t) or '0001-01-01', (cp_x_in and cp_x_t) or '0001-01-01', (cp_c_in and cp_c_t) or '0001-01-01', (cp_u_in and cp_u_t) or '0001-01-01')
  - cp_gap: MX(0, DAYS(cp_first_s, cp_last_t) + 1 - cp_union) * (cp_cnt >= 2)
  - cp_book: float(CFIELD('contract','vehicle_book_value_usd', contract_id=F('contract_id')) or 0)
  - cp_gvalue: K('cp_grace_value_low') if (cp_book > 0 and cp_book <= K('cp_grace_value_low_usd')) else (K('cp_grace_value_mid') if (cp_book > K('cp_grace_value_low_usd') and cp_book <= K('cp_grace_value_mid_usd')) else 0)
  - cp_st: CFIELD('contract','state_code', contract_id=F('contract_id')) or ''
  - cp_gstate: K('cp_grace_gulf') if (cp_st == 'TX' or cp_st == 'LA') else (K('cp_grace_plains') if (cp_st == 'OK' or cp_st == 'AR') else 0)
  - cp_year: int(CFIELD('contract','vehicle_year', contract_id=F('contract_id')) or 0)
