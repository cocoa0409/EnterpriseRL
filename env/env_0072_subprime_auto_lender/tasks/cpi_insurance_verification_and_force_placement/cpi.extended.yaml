    replaced_by: 'For the capitalised premium charge with the latest billing_period_start on a tracking record that closed while force_placed because its contract was paid off, when an accepted proof counts for that charge''s period and no verification_source holds more than one accepted cpi_proof_verified entry on the record, the refund is fixed by the closing-month refund rule if the period ends on the closed_date and by the closing-period refund rule if it runs past the closed_date; that charge in any other case, and every other charge, keep the base refund rule in force: A premium charge can be refunded only once. When accepted proof shows coverage effective on or before the CPI coverage effective date with no gap (flat_cancel_if_continuous), every premium charge of the placement is refunded in full (refund_basis full_no_lapse). When accepted proof starts after the CPI coverage effective date, each unrefunded charge is refunded for the days of its billing period on or after the proof''s
