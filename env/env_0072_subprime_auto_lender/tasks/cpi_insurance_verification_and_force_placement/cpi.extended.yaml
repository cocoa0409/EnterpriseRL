  rule: 'This rule governs the re-review, at the borrower''s request and on a closed tracking record only, of a proof of the borrower''s own insurance that the borrower uploaded as a binder (declarations_page_upload) showing a coverage period no longer than binder_max_days and that a first review rejected because a deductible was above the plan''s borrower_max_deductible_usd or because its expiration date was too close to the review date. The upload re-reviewed is the most recent declarations_page_upload entry on the tracking record by review date (where two entries share that date, the one recorded first counts), and the re-review keeps every detail that entry shows exactly as first recorded, including the date of that first review; when that entry shows a coverage period, counted from its effective date through its expiration date with both days included, longer than binder_max_days, it is not a binder and this rule does not re-review it. The uploaded binder''s lienholder test is the base
    test: it passes only when its own entry shows the company as lienholder and loss payee. Each deductible ceiling of the uploaded binder is the plan''s borrower_max_deductible_usd plus every allowance this rule states for that deductible. The uploaded binder''s model-year comprehensive allowance is upload_age_allow_old for a financed vehicle of model year upload_old_model_year or earlier and upload_age_allow_mid for model years after upload_old_model_year through upload_mid_model_year. The uploaded binder''s vehicle-value collision allowance is upload_value_allow_low when the vehicle book value on the contract is no more than upload_value_low_usd and upload_value_allow_mid when it is above upload_value_low_usd and no more than upload_value_mid_usd. The uploaded binder''s credit-tier collision allowance is upload_tier_allow_prime for a contract on Tier 1 Select, Tier 2 Preferred or Tier 3 Advantage and upload_tier_allow_near for a contract on Tier 4 Standard or Tier 5 Rebuild. As the standard
    method, the uploaded binder''s comprehensive and collision deductibles may each be no higher than the plan''s borrower_max_deductible_usd, with no allowance. The uploaded binder''s reach date is the date of the first review when the contract was paid off, and the contract''s repossession_date when the contract was not paid off but carries a repossession_date. As the standard method, the uploaded binder''s reach date is the re-review date. The re-review outcome of an uploaded binder is the first failing test in this order: the lienholder test (rejected_no_lienholder), then the comprehensive and collision deductible tests together (rejected_deductible_too_high), then the reach test, passed when the binder''s policy_expiration_date falls on or after the reach date (rejected_expiring); an uploaded binder that passes all of them is accepted; where the record carries no upload, its most recent upload is not a binder, or that upload is already accepted or was rejected for a reason this rule
    does not re-review, there is nothing to re-review and the outcome is not_applicable; on a tracking record that is not closed this rule does not apply and its outcome is not_applicable. The physical-damage coverage, VIN and named-insured results stand as the first review recorded them, because the first review''s rejection reason comes after them in the base order. In a re-review, an uploaded binder is held to the reach test, which compares its expiration date with the reach date itself, because a binder is temporary by nature. On a closed tracking record, a rejected uploaded binder is re-reviewed solely to fix the premium refunds owed on the record, and an accepted re-review there is recorded as a new review entry only: it never changes the record''s status, never updates the policy details on file and mails no notice. Outside this rule the base proof-review rule stays in force: on a tracking record that is not closed every proof review follows it, an accepted proof updating the policy
    details on file and, on a record in pending_verification, lapse_notice or force_placed status, returning the record to compliant, a return on a force_placed record cancelling the placed coverage, after which refunds follow cpi_cancellation_refund and a cancellation notice is mailed within cancellation_notice_days, and acceptance requiring comprehensive and collision deductibles no higher than borrower_max_deductible_usd, a policy_expiration_date at least min_days_to_expiration_at_verification days after the review date and, for a binder, binder_accepted true and a binder period no longer than binder_max_days; on a closed tracking record no first review is made, no proof that arrived through an insurance agent call is re-reviewed, because a call leaves no document to review again, and no uploaded proof showing a coverage period longer than binder_max_days is re-reviewed; a rejected feed proof and a rejected faxed proof on a closed record are not governed by this rule but each by the re-review
    rule written for it.'
