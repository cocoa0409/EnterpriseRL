- id: deficiency_ext_plan_installment
  base_policy_refs:
  - deficiency_payment_plan
  - deficiency_evt_payments
  - deficiency_agg_separate_resolution
  - deficiency_opening
  - deficiency_closure_and_referral
  overwrite:
  - base_policy: deficiency_payment_plan
    superseded_clause: The monthly installment is the greater of plan_min_monthly_payment_usd and plan_min_payment_pct_of_balance of the balance on the acceptance date, rounded up to the cent
    replaced_by: For a payment-plan offer on an open account whose balance is at least min_balance_for_plan_usd, the monthly installment is figured on the balance on the day the offer is made by the standard method and the adjustment schedules of this policy, in place of the greater of the two minimums on the balance on the acceptance date; a balance below min_balance_for_plan_usd keeps the small-balance terms, and the number of installments and the due dates stay as stated for every plan.
  trigger: on_request
  subject:
  - deficiency_payment_posted
  computes: installment_amount_usd
  target_tool: record_payment_plan_offer_3f4fb3a9
  params:
    lookback_months: 12
    carry_window_months: 12
    carry_run_months: 6
    rebreak_recent_months: 6
    rebreak_window_months: 12
    rebreak_recent_pct: 10.0
    rebreak_older_pct: 5.0
    returned_lookback_months: 12
    returned_multi_pct: 8.0
    returned_single_pct: 4.0
    paydown_high_share: 0.4
    paydown_mid_share: 0.2
    paydown_high_pct: 6.0
    paydown_mid_pct: 3.0
    tier6_pct: 5.0
    tier5_pct: 2.5
    recent_months: 6
    recent_many_count: 2
    recent_many_pct: 4.0
    recent_one_pct: 2.0
  rule: 'For a payment-plan offer on an open account whose balance is at least min_balance_for_plan_usd, the monthly installment is figured on the balance on the day the offer is made by the standard method and the adjustment schedules of this policy, in place of the greater of the two minimums on the balance on the acceptance date; a balance below min_balance_for_plan_usd keeps the small-balance terms, and the number of installments and the due dates stay as stated for every plan. When the account had a broken arrangement in the rolling 12 months, the monthly installment of a new plan is fixed only after the account''s ledger carries the restart down payment, posted after the latest broken date as a payment that carries no arrangement. A plan offer states no down payment of its own; a restart down payment, where one is required, is a payment on the ledger and never a term of the offer. The standard installment of a new plan is the greatest of plan_min_monthly_payment_usd, plan_min_payment_pct_of_balance percent of the balance on the day the offer is made, and that balance divided by plan_max_term_months, and the monthly installment is the standard installment rounded up to the cent. A schedule that replaces the standard installment is applied first; the percentage adjustments of the schedules that apply are then added together, surcharges counted as positive and reductions as negative, and the installment so far is multiplied once by 100 percent plus that total; the adjusted figure is then raised, where lower, to plan_min_monthly_payment_usd and to the balance divided by plan_max_term_months, and it is rounded up to the cent only at the end. Plan installment basis: when an arrangement offer of the account whose offer_date falls fewer than lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter, medical_disability_statement or unemployment_determination as its hardship document, the standard installment is replaced by the balance divided by plan_max_term_months; when no such offer exists and the latest payment_plan offer with offer_status broken has a broken_date fewer than carry_window_months whole months before today and ran carry_run_months whole months or more from its accepted_at date to its broken_date, the standard installment is replaced by the greater of the standard installment and that broken plan''s installment_amount_usd; otherwise the standard installment stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time. Plan rebreak surcharge: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than rebreak_recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the installment carries a surcharge of rebreak_recent_pct percent; when that broken_date is at least rebreak_recent_months but fewer than rebreak_window_months whole months before today, rebreak_older_pct percent; otherwise no rebreak surcharge; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time. Plan returned-payment surcharge: two or more deficiency_payment_returned rows of the account dated fewer than returned_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carry a surcharge of returned_multi_pct percent, exactly one carries returned_single_pct percent, and none carries no surcharge. Plan paydown reduction: the plan paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a plan paydown share of paydown_high_share or more reduces the installment by paydown_high_pct percent, one of at least paydown_mid_share but below paydown_high_share by paydown_mid_pct percent, and a smaller one by nothing. Plan credit-tier surcharge, read from the contract that produced the account: a contract of variant_name Tier 6 Fresh Start carries a surcharge of tier6_pct percent, a contract of variant_name Tier 5 Rebuild carries tier5_pct percent, and every other credit tier carries none. Plan recent-payer reduction: the plan recent payments are the deficiency_payment_posted rows of the account dated fewer than recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) less the deficiency_payment_returned rows dated in the same period; recent_many_count or more plan recent payments reduce the installment by recent_many_pct percent, exactly one reduces it by recent_one_pct percent, and any smaller count (none, or fewer once returns are taken off) by nothing.'
  prerequisite:
  - problem: deficiency_ext_restart_down_payment
    kind: value_input
    gate: pi_balance
    form: state
    policy_source: When the account had a broken arrangement in the rolling 12 months, the monthly installment of a new plan is fixed only after the account's ledger carries the restart down payment, posted after the latest broken date as a payment that carries no arrangement.
    condition: deficiency_transactions carries, for the account, a deficiency_payment_posted row with an empty arrangement_offer_id, a txn_date later than the latest broken_date among its deficiency_arrangement_offers with offer_status broken, and amount_usd equal to the restart down payment figured on the account; deficiency_accounts.deficiency_balance_usd is reduced by it.
    resolved_by: pay_restart_down_payment_04892a83
    effect: The restart down payment posted with no arrangement lowers deficiency_balance_usd (pi_balance) by its amount, which lowers the standard and basis installments and raises the share paid down, and it adds one posted payment to the recent payments counted (pi_recent_count).
  cross_category:
  - category: contract
    as: branch
    reads:
    - variant_name
    note: Decides the credit-tier surcharge tier from the liquidated contract's credit tier.
  compute:
  - pi_balance: F('deficiency_balance_usd')
  - pi_min_dollars: P('plan_min_monthly_payment_usd')
  - pi_min_pct: P('plan_min_payment_pct_of_balance')
  - pi_max_term: P('plan_max_term_months')
  - pi_term_floor: pi_balance / pi_max_term
  - pi_standard: MX(pi_min_dollars, pi_balance * pi_min_pct / 100, pi_term_floor)
  - pi_hardship_docs: COUNT('deficiency_arrangement_offers', within_months=K('lookback_months'), date_field='offer_date', hardship_document='ssa_award_letter') + COUNT('deficiency_arrangement_offers', within_months=K('lookback_months'), date_field='offer_date', hardship_document='medical_disability_statement') + COUNT('deficiency_arrangement_offers', within_months=K('lookback_months'), date_field='offer_date', hardship_document='unemployment_determination')
  - pi_plan_broken: LATEST('deficiency_arrangement_offers', 'broken_date', date_field='broken_date', offer_status='broken', offer_type='payment_plan')
  - pi_plan_accepted: LATEST('deficiency_arrangement_offers', 'accepted_at', date_field='broken_date', offer_status='broken', offer_type='payment_plan')
  - pi_plan_installment: LATEST('deficiency_arrangement_offers', 'installment_amount_usd', date_field='broken_date', offer_status='broken', offer_type='payment_plan')
  - pi_plan_since: MONTHS(pi_plan_broken, NOW) if pi_plan_broken else 99999
  - pi_plan_ran: MONTHS(pi_plan_accepted, pi_plan_broken) if pi_plan_accepted and pi_plan_broken else 0
  - pi_basis: pi_term_floor if pi_hardship_docs > 0 else (MX(pi_standard, pi_plan_installment or 0) if (pi_plan_since < K('carry_window_months') and pi_plan_ran >= K('carry_run_months')) else pi_standard)
  - pi_broken_date: LATEST('deficiency_arrangement_offers', 'broken_date', date_field='broken_date', offer_status='broken')
  - pi_since_break: MONTHS(pi_broken_date, NOW) if pi_broken_date else 99999
  - pi_rebreak_pct: K('rebreak_recent_pct') if pi_since_break < K('rebreak_recent_months') else (K('rebreak_older_pct') if pi_since_break < K('rebreak_window_months') else 0)
  - pi_returns: COUNT('deficiency_transactions', within_months=K('returned_lookback_months'), date_field='txn_date', event_type='deficiency_payment_returned')
  - pi_returned_pct: K('returned_multi_pct') if pi_returns >= 2 else (K('returned_single_pct') if pi_returns >= 1 else 0)
  - pi_paid_down: SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_payment_posted') + SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_credit_applied') - SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_payment_returned')
  - pi_paid_share: pi_paid_down / F('original_deficiency_usd')
  - pi_paydown_pct: K('paydown_high_pct') if pi_paid_share >= K('paydown_high_share') else (K('paydown_mid_pct') if pi_paid_share >= K('paydown_mid_share') else 0)
  - pi_contract_tier: CFIELD('contract', 'variant_name', contract_id=F('contract_id'))
  - pi_tier_pct: K('tier6_pct') if pi_contract_tier == 'Tier 6 Fresh Start' else (K('tier5_pct') if pi_contract_tier == 'Tier 5 Rebuild' else 0)
  - pi_recent_count: COUNT('deficiency_transactions', within_months=K('recent_months'), date_field='txn_date', event_type='deficiency_payment_posted') - COUNT('deficiency_transactions', within_months=K('recent_months'), date_field='txn_date', event_type='deficiency_payment_returned')
  - pi_recent_pct: K('recent_many_pct') if pi_recent_count >= K('recent_many_count') else (K('recent_one_pct') if pi_recent_count >= 1 else 0)
  - pi_adjust_pct: pi_rebreak_pct + pi_returned_pct - pi_paydown_pct + pi_tier_pct - pi_recent_pct
  - pi_adjusted: pi_basis * (100 + pi_adjust_pct) / 100
  - result: -((-RND(MX(pi_adjusted, pi_min_dollars, pi_term_floor) * 100, 6)) // 1) / 100
  compute_basis:
    pi_balance: The standard installment of a new plan is the greatest of plan_min_monthly_payment_usd, plan_min_payment_pct_of_balance percent of the balance on the day the offer is made, and that balance divided by plan_max_term_months, and the monthly installment is the standard installment rounded up to the cent.
    pi_min_dollars: The standard installment of a new plan is the greatest of plan_min_monthly_payment_usd, plan_min_payment_pct_of_balance percent of the balance on the day the offer is made, and that balance divided by plan_max_term_months, and the monthly installment is the standard installment rounded up to the cent.
    pi_min_pct: The standard installment of a new plan is the greatest of plan_min_monthly_payment_usd, plan_min_payment_pct_of_balance percent of the balance on the day the offer is made, and that balance divided by plan_max_term_months, and the monthly installment is the standard installment rounded up to the cent.
    pi_max_term: The standard installment of a new plan is the greatest of plan_min_monthly_payment_usd, plan_min_payment_pct_of_balance percent of the balance on the day the offer is made, and that balance divided by plan_max_term_months, and the monthly installment is the standard installment rounded up to the cent.
    pi_term_floor: The standard installment of a new plan is the greatest of plan_min_monthly_payment_usd, plan_min_payment_pct_of_balance percent of the balance on the day the offer is made, and that balance divided by plan_max_term_months, and the monthly installment is the standard installment rounded up to the cent.
    pi_standard: The standard installment of a new plan is the greatest of plan_min_monthly_payment_usd, plan_min_payment_pct_of_balance percent of the balance on the day the offer is made, and that balance divided by plan_max_term_months, and the monthly installment is the standard installment rounded up to the cent.
    pi_hardship_docs: 'Plan installment basis: when an arrangement offer of the account whose offer_date falls fewer than lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter, medical_disability_statement or unemployment_determination as its hardship document, the standard installment is replaced by the balance divided by plan_max_term_months; when no such offer exists and the latest payment_plan offer with offer_status broken has a broken_date fewer than carry_window_months whole months before today and ran carry_run_months whole months or more from its accepted_at date to its broken_date, the standard installment is replaced by the greater of the standard installment and that broken plan''s installment_amount_usd; otherwise the standard installment stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_plan_broken: 'Plan installment basis: when an arrangement offer of the account whose offer_date falls fewer than lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter, medical_disability_statement or unemployment_determination as its hardship document, the standard installment is replaced by the balance divided by plan_max_term_months; when no such offer exists and the latest payment_plan offer with offer_status broken has a broken_date fewer than carry_window_months whole months before today and ran carry_run_months whole months or more from its accepted_at date to its broken_date, the standard installment is replaced by the greater of the standard installment and that broken plan''s installment_amount_usd; otherwise the standard installment stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_plan_accepted: 'Plan installment basis: when an arrangement offer of the account whose offer_date falls fewer than lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter, medical_disability_statement or unemployment_determination as its hardship document, the standard installment is replaced by the balance divided by plan_max_term_months; when no such offer exists and the latest payment_plan offer with offer_status broken has a broken_date fewer than carry_window_months whole months before today and ran carry_run_months whole months or more from its accepted_at date to its broken_date, the standard installment is replaced by the greater of the standard installment and that broken plan''s installment_amount_usd; otherwise the standard installment stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_plan_installment: 'Plan installment basis: when an arrangement offer of the account whose offer_date falls fewer than lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter, medical_disability_statement or unemployment_determination as its hardship document, the standard installment is replaced by the balance divided by plan_max_term_months; when no such offer exists and the latest payment_plan offer with offer_status broken has a broken_date fewer than carry_window_months whole months before today and ran carry_run_months whole months or more from its accepted_at date to its broken_date, the standard installment is replaced by the greater of the standard installment and that broken plan''s installment_amount_usd; otherwise the standard installment stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_plan_since: 'Plan installment basis: when an arrangement offer of the account whose offer_date falls fewer than lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter, medical_disability_statement or unemployment_determination as its hardship document, the standard installment is replaced by the balance divided by plan_max_term_months; when no such offer exists and the latest payment_plan offer with offer_status broken has a broken_date fewer than carry_window_months whole months before today and ran carry_run_months whole months or more from its accepted_at date to its broken_date, the standard installment is replaced by the greater of the standard installment and that broken plan''s installment_amount_usd; otherwise the standard installment stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_plan_ran: 'Plan installment basis: when an arrangement offer of the account whose offer_date falls fewer than lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter, medical_disability_statement or unemployment_determination as its hardship document, the standard installment is replaced by the balance divided by plan_max_term_months; when no such offer exists and the latest payment_plan offer with offer_status broken has a broken_date fewer than carry_window_months whole months before today and ran carry_run_months whole months or more from its accepted_at date to its broken_date, the standard installment is replaced by the greater of the standard installment and that broken plan''s installment_amount_usd; otherwise the standard installment stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_basis: 'Plan installment basis: when an arrangement offer of the account whose offer_date falls fewer than lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter, medical_disability_statement or unemployment_determination as its hardship document, the standard installment is replaced by the balance divided by plan_max_term_months; when no such offer exists and the latest payment_plan offer with offer_status broken has a broken_date fewer than carry_window_months whole months before today and ran carry_run_months whole months or more from its accepted_at date to its broken_date, the standard installment is replaced by the greater of the standard installment and that broken plan''s installment_amount_usd; otherwise the standard installment stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_broken_date: 'Plan rebreak surcharge: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than rebreak_recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the installment carries a surcharge of rebreak_recent_pct percent; when that broken_date is at least rebreak_recent_months but fewer than rebreak_window_months whole months before today, rebreak_older_pct percent; otherwise no rebreak surcharge; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_since_break: 'Plan rebreak surcharge: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than rebreak_recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the installment carries a surcharge of rebreak_recent_pct percent; when that broken_date is at least rebreak_recent_months but fewer than rebreak_window_months whole months before today, rebreak_older_pct percent; otherwise no rebreak surcharge; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_rebreak_pct: 'Plan rebreak surcharge: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than rebreak_recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the installment carries a surcharge of rebreak_recent_pct percent; when that broken_date is at least rebreak_recent_months but fewer than rebreak_window_months whole months before today, rebreak_older_pct percent; otherwise no rebreak surcharge; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    pi_returns: 'Plan returned-payment surcharge: two or more deficiency_payment_returned rows of the account dated fewer than returned_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carry a surcharge of returned_multi_pct percent, exactly one carries returned_single_pct percent, and none carries no surcharge.'
    pi_returned_pct: 'Plan returned-payment surcharge: two or more deficiency_payment_returned rows of the account dated fewer than returned_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carry a surcharge of returned_multi_pct percent, exactly one carries returned_single_pct percent, and none carries no surcharge.'
    pi_paid_down: 'Plan paydown reduction: the plan paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a plan paydown share of paydown_high_share or more reduces the installment by paydown_high_pct percent, one of at least paydown_mid_share but below paydown_high_share by paydown_mid_pct percent, and a smaller one by nothing.'
    pi_paid_share: 'Plan paydown reduction: the plan paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a plan paydown share of paydown_high_share or more reduces the installment by paydown_high_pct percent, one of at least paydown_mid_share but below paydown_high_share by paydown_mid_pct percent, and a smaller one by nothing.'
    pi_paydown_pct: 'Plan paydown reduction: the plan paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a plan paydown share of paydown_high_share or more reduces the installment by paydown_high_pct percent, one of at least paydown_mid_share but below paydown_high_share by paydown_mid_pct percent, and a smaller one by nothing.'
    pi_contract_tier: 'Plan credit-tier surcharge, read from the contract that produced the account: a contract of variant_name Tier 6 Fresh Start carries a surcharge of tier6_pct percent, a contract of variant_name Tier 5 Rebuild carries tier5_pct percent, and every other credit tier carries none.'
    pi_tier_pct: 'Plan credit-tier surcharge, read from the contract that produced the account: a contract of variant_name Tier 6 Fresh Start carries a surcharge of tier6_pct percent, a contract of variant_name Tier 5 Rebuild carries tier5_pct percent, and every other credit tier carries none.'
    pi_recent_count: 'Plan recent-payer reduction: the plan recent payments are the deficiency_payment_posted rows of the account dated fewer than recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) less the deficiency_payment_returned rows dated in the same period; recent_many_count or more plan recent payments reduce the installment by recent_many_pct percent, exactly one reduces it by recent_one_pct percent, and any smaller count (none, or fewer once returns are taken off) by nothing.'
    pi_recent_pct: 'Plan recent-payer reduction: the plan recent payments are the deficiency_payment_posted rows of the account dated fewer than recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) less the deficiency_payment_returned rows dated in the same period; recent_many_count or more plan recent payments reduce the installment by recent_many_pct percent, exactly one reduces it by recent_one_pct percent, and any smaller count (none, or fewer once returns are taken off) by nothing.'
    pi_adjust_pct: A schedule that replaces the standard installment is applied first; the percentage adjustments of the schedules that apply are then added together, surcharges counted as positive and reductions as negative, and the installment so far is multiplied once by 100 percent plus that total; the adjusted figure is then raised, where lower, to plan_min_monthly_payment_usd and to the balance divided by plan_max_term_months, and it is rounded up to the cent only at the end.
    pi_adjusted: A schedule that replaces the standard installment is applied first; the percentage adjustments of the schedules that apply are then added together, surcharges counted as positive and reductions as negative, and the installment so far is multiplied once by 100 percent plus that total; the adjusted figure is then raised, where lower, to plan_min_monthly_payment_usd and to the balance divided by plan_max_term_months, and it is rounded up to the cent only at the end.
    result: A schedule that replaces the standard installment is applied first; the percentage adjustments of the schedules that apply are then added together, surcharges counted as positive and reductions as negative, and the installment so far is multiplied once by 100 percent plus that total; the adjusted figure is then raised, where lower, to plan_min_monthly_payment_usd and to the balance divided by plan_max_term_months, and it is rounded up to the cent only at the end.
  factors:
  - id: installment_basis_method
    effect: method
    decides: pi_basis
    bindings:
    - pi_hardship_docs
    - pi_plan_broken
    - pi_plan_accepted
    - pi_plan_installment
    - pi_plan_since
    - pi_plan_ran
    - pi_basis
    ladder:
    - when: an offer of the account dated within the look-back carries ssa_award_letter, medical_disability_statement or unemployment_determination
      method: the standard installment is replaced by the balance divided by plan_max_term_months
    - when: no such offer, and the latest broken payment plan broke fewer than carry_window_months whole months ago after running carry_run_months whole months or more
      method: the standard installment is replaced by the greater of the standard installment and that broken plan's installment_amount_usd
    - when: otherwise
      method: the standard installment stands
    baseline:
      pi_basis: pi_standard
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: rebreak_surcharge
    effect: parameter
    decides: pi_rebreak_pct
    bindings:
    - pi_broken_date
    - pi_since_break
    - pi_rebreak_pct
    ladder:
    - when: the latest broken_date of the account is fewer than rebreak_recent_months whole months before today
      value: K('rebreak_recent_pct')
    - when: it is at least rebreak_recent_months but fewer than rebreak_window_months whole months before today
      value: K('rebreak_older_pct')
    - when: otherwise
      value: '0'
    baseline:
      pi_rebreak_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: returned_surcharge
    effect: parameter
    decides: pi_returned_pct
    bindings:
    - pi_returns
    - pi_returned_pct
    ladder:
    - when: two or more returned payments of the account within the look-back
      value: K('returned_multi_pct')
    - when: exactly one
      value: K('returned_single_pct')
    - when: otherwise
      value: '0'
    baseline:
      pi_returned_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: paydown_reduction
    effect: parameter
    decides: pi_paydown_pct
    bindings:
    - pi_paid_down
    - pi_paid_share
    - pi_paydown_pct
    ladder:
    - when: share paid down of paydown_high_share or more
      value: K('paydown_high_pct')
    - when: at least paydown_mid_share but below paydown_high_share
      value: K('paydown_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      pi_paydown_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: credit_tier_surcharge
    effect: parameter
    decides: pi_tier_pct
    bindings:
    - pi_contract_tier
    - pi_tier_pct
    ladder:
    - when: contract variant_name Tier 6 Fresh Start
      value: K('tier6_pct')
    - when: contract variant_name Tier 5 Rebuild
      value: K('tier5_pct')
    - when: otherwise
      value: '0'
    baseline:
      pi_tier_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: recent_payer_reduction
    effect: parameter
    decides: pi_recent_pct
    bindings:
    - pi_recent_count
    - pi_recent_pct
    ladder:
    - when: recent_many_count or more posted payments, net of returns, within the recent look-back
      value: K('recent_many_pct')
    - when: exactly one
      value: K('recent_one_pct')
    - when: otherwise
      value: '0'
    baseline:
      pi_recent_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The standard installment of a new plan is the greatest of plan_min_monthly_payment_usd, plan_min_payment_pct_of_balance percent of the balance on the day the offer is made, and that balance divided by plan_max_term_months, and the monthly installment is the standard installment rounded up to the cent.
    params:
    - plan_min_monthly_payment_usd
    - plan_min_payment_pct_of_balance
    - plan_max_term_months
  inputs:
    history:
    - table: deficiency_arrangement_offers
      aggregate: count
      field: hardship_document
      within_months: 12
      filters: {}
    - table: deficiency_arrangement_offers
      aggregate: latest
      field: broken_date
      filters:
        offer_status: broken
    - table: deficiency_transactions
      aggregate: count
      field: deficiency_txn_id
      within_months: 12
      filters:
        event_type: deficiency_payment_returned
    - table: deficiency_transactions
      aggregate: count
      field: deficiency_txn_id
      within_months: 6
      filters:
        event_type: deficiency_payment_posted
    cross_category:
    - contract
- id: deficiency_ext_lump_sum_settlement
  base_policy_refs:
  - deficiency_settlement
  - deficiency_agg_separate_resolution
  - deficiency_opening
  - deficiency_closure_and_referral
  overwrite: []
  trigger: on_request
  subject:
  - deficiency_settlement_waiver
  computes: offer_amount_usd
  target_tool: record_lump_sum_settlement_offer_7c3d7537
  params:
    hardship_lookback_months: 12
    jobless_cap_installments: 6
    age_young_months: 9
    age_mid_months: 18
    age_young_pts: 5.0
    age_mid_pts: 2.5
    sale_high_ratio: 0.65
    sale_mid_ratio: 0.5
    sale_high_pts: 4.0
    sale_mid_pts: 2.0
    paydown_low_share: 0.15
    paydown_mid_share: 0.3
    paydown_low_pts: 4.0
    paydown_mid_pts: 2.0
    involuntary_pts: 3.0
    impound_pts: 1.5
    lapsed_lookback_months: 12
    lapsed_multi_pts: 4.0
    lapsed_single_pts: 2.0
  rule: 'This policy figures the amount a lump-sum settlement offer states for one open account, inside the band''s settlement limits. A lump-sum offer records one hardship document: where the borrower hands in one or more hardship documents with the request for that offer, it records the first of them in the order ssa_award_letter, medical_disability_statement, unemployment_determination; where the borrower hands in none, an offer whose amount carries a hardship reduction records the document that reduction rests on in the same order, the ssa_award_letter where an offer within the hardship look-back carries one, otherwise the medical_disability_statement where an offer within the hardship look-back carries one, and otherwise the unemployment_determination; an offer with neither records none. A lump-sum settlement offer states min_lump_sum_settlement_pct percent of the balance on the offer date, rounded half up to the cent, raised to settlement_floor_usd where it is lower, and never more than the balance. The percentage points of the surcharge schedules that apply are added to min_lump_sum_settlement_pct before that percent is applied once to the balance; the product is rounded half up to the cent; any reduction amount a schedule sets, itself rounded half up to the cent, is then subtracted from that rounded figure; and only after that is the figure raised to settlement_floor_usd where lower and limited to the balance. Lump-sum hardship reduction: when an arrangement offer of the account whose offer_date falls fewer than hardship_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter or medical_disability_statement as its hardship document, the reduction is hardship_extra_discount_pct percent of the balance; when no such offer carries either of those but one carries unemployment_determination, the reduction is the lesser of hardship_extra_discount_pct percent of the balance and jobless_cap_installments times plan_min_monthly_payment_usd; otherwise there is no hardship reduction; the offers read are those already recorded on the account when the amount is figured, so a document handed in with the offer being made goes on file with that offer and counts only toward later figures. Lump-sum debt-age surcharge: the lump-sum debt age is the number of whole months (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) from opened_date to today; a lump-sum debt age below age_young_months adds age_young_pts points, one of at least age_young_months but below age_mid_months adds age_mid_pts points, and an older debt adds no points. Lump-sum sale-recovery surcharge: the lump-sum sale recovery is the gross_sale_proceeds_usd of the recovery case that produced the account divided by the vehicle_book_value_usd of the contract that produced it; a lump-sum sale recovery of sale_high_ratio or more adds sale_high_pts points, one of at least sale_mid_ratio but below sale_high_ratio adds sale_mid_pts points, and a lower one, or one that cannot be figured because either figure is missing, adds no points. Lump-sum paydown surcharge: the lump-sum paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a lump-sum paydown share below paydown_low_share adds paydown_low_pts points, one of at least paydown_low_share but below paydown_mid_share adds paydown_mid_pts points, and a larger one adds no points. Lump-sum recovery-route surcharge, read from the recovery case that produced the account: a recovery_method of involuntary_recovery adds involuntary_pts points, a recovery_method of impound_release adds impound_pts points, and a recovery_method of voluntary_surrender adds no points. Lump-sum lapsed-offer surcharge: the lump-sum lapsed offers are the lump_sum_settlement and installment_settlement offers of the account with offer_status expired or declined whose offer_date falls fewer than lapsed_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s); two or more add lapsed_multi_pts points, exactly one adds lapsed_single_pts points, and none adds no points.'
  prerequisite: []
  cross_category:
  - category: recovery
    as: branch
    reads:
    - gross_sale_proceeds_usd
    - recovery_method
    note: Decides the sale-recovery tier (with the contract's book value) and the recovery-route tier from the recovery case that produced the account.
  - category: contract
    as: branch
    reads:
    - vehicle_book_value_usd
    note: Supplies the book value the sale-recovery tier divides the gross sale proceeds by.
  compute:
  - ls_balance: F('deficiency_balance_usd')
  - ls_band_pct: P('min_lump_sum_settlement_pct')
  - ls_floor: P('settlement_floor_usd')
  - ls_lasting_docs: COUNT('deficiency_arrangement_offers', within_months=K('hardship_lookback_months'), date_field='offer_date', hardship_document='ssa_award_letter') + COUNT('deficiency_arrangement_offers', within_months=K('hardship_lookback_months'), date_field='offer_date', hardship_document='medical_disability_statement')
  - ls_jobless_docs: COUNT('deficiency_arrangement_offers', within_months=K('hardship_lookback_months'), date_field='offer_date', hardship_document='unemployment_determination')
  - ls_hardship_cut: RND(ls_balance * P('hardship_extra_discount_pct') / 100, 2) if ls_lasting_docs > 0 else (MN(RND(ls_balance * P('hardship_extra_discount_pct') / 100, 2), K('jobless_cap_installments') * P('plan_min_monthly_payment_usd')) if ls_jobless_docs > 0 else 0)
  - ls_debt_age: MONTHS(F('opened_date'), NOW)
  - ls_age_pts: K('age_young_pts') if ls_debt_age < K('age_young_months') else (K('age_mid_pts') if ls_debt_age < K('age_mid_months') else 0)
  - ls_sale_gross: CFIELD('recovery', 'gross_sale_proceeds_usd', recovery_case_id=F('recovery_case_id'))
  - ls_book_value: CFIELD('contract', 'vehicle_book_value_usd', contract_id=F('contract_id'))
  - ls_sale_ratio: (ls_sale_gross or 0) / ls_book_value if ls_book_value else 0
  - ls_sale_pts: K('sale_high_pts') if ls_sale_ratio >= K('sale_high_ratio') else (K('sale_mid_pts') if ls_sale_ratio >= K('sale_mid_ratio') else 0)
  - ls_paid_down: SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_payment_posted') + SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_credit_applied') - SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_payment_returned')
  - ls_paid_share: ls_paid_down / F('original_deficiency_usd')
  - ls_paydown_pts: K('paydown_low_pts') if ls_paid_share < K('paydown_low_share') else (K('paydown_mid_pts') if ls_paid_share < K('paydown_mid_share') else 0)
  - ls_recovery_method: CFIELD('recovery', 'recovery_method', recovery_case_id=F('recovery_case_id'))
  - ls_route_pts: K('involuntary_pts') if ls_recovery_method == 'involuntary_recovery' else (K('impound_pts') if ls_recovery_method == 'impound_release' else 0)
  - ls_lapsed: COUNT('deficiency_arrangement_offers', within_months=K('lapsed_lookback_months'), date_field='offer_date', offer_type='lump_sum_settlement', offer_status='expired') + COUNT('deficiency_arrangement_offers', within_months=K('lapsed_lookback_months'), date_field='offer_date', offer_type='lump_sum_settlement', offer_status='declined') + COUNT('deficiency_arrangement_offers', within_months=K('lapsed_lookback_months'), date_field='offer_date', offer_type='installment_settlement', offer_status='expired') + COUNT('deficiency_arrangement_offers', within_months=K('lapsed_lookback_months'), date_field='offer_date', offer_type='installment_settlement', offer_status='declined')
  - ls_lapsed_pts: K('lapsed_multi_pts') if ls_lapsed >= 2 else (K('lapsed_single_pts') if ls_lapsed >= 1 else 0)
  - ls_pct: ls_band_pct + ls_age_pts + ls_sale_pts + ls_paydown_pts + ls_route_pts + ls_lapsed_pts
  - ls_pct_amount: RND(ls_balance * ls_pct / 100, 2)
  - result: MN(ls_balance, MX(RND(ls_pct_amount - ls_hardship_cut, 2), ls_floor))
  compute_basis:
    ls_balance: A lump-sum settlement offer states min_lump_sum_settlement_pct percent of the balance on the offer date, rounded half up to the cent, raised to settlement_floor_usd where it is lower, and never more than the balance.
    ls_band_pct: A lump-sum settlement offer states min_lump_sum_settlement_pct percent of the balance on the offer date, rounded half up to the cent, raised to settlement_floor_usd where it is lower, and never more than the balance.
    ls_floor: A lump-sum settlement offer states min_lump_sum_settlement_pct percent of the balance on the offer date, rounded half up to the cent, raised to settlement_floor_usd where it is lower, and never more than the balance.
    ls_lasting_docs: 'Lump-sum hardship reduction: when an arrangement offer of the account whose offer_date falls fewer than hardship_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter or medical_disability_statement as its hardship document, the reduction is hardship_extra_discount_pct percent of the balance; when no such offer carries either of those but one carries unemployment_determination, the reduction is the lesser of hardship_extra_discount_pct percent of the balance and jobless_cap_installments times plan_min_monthly_payment_usd; otherwise there is no hardship reduction; the offers read are those already recorded on the account when the amount is figured, so a document handed in with the offer being made goes on file with that offer and counts only toward later figures.'
    ls_jobless_docs: 'Lump-sum hardship reduction: when an arrangement offer of the account whose offer_date falls fewer than hardship_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter or medical_disability_statement as its hardship document, the reduction is hardship_extra_discount_pct percent of the balance; when no such offer carries either of those but one carries unemployment_determination, the reduction is the lesser of hardship_extra_discount_pct percent of the balance and jobless_cap_installments times plan_min_monthly_payment_usd; otherwise there is no hardship reduction; the offers read are those already recorded on the account when the amount is figured, so a document handed in with the offer being made goes on file with that offer and counts only toward later figures.'
    ls_hardship_cut: 'Lump-sum hardship reduction: when an arrangement offer of the account whose offer_date falls fewer than hardship_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) carries ssa_award_letter or medical_disability_statement as its hardship document, the reduction is hardship_extra_discount_pct percent of the balance; when no such offer carries either of those but one carries unemployment_determination, the reduction is the lesser of hardship_extra_discount_pct percent of the balance and jobless_cap_installments times plan_min_monthly_payment_usd; otherwise there is no hardship reduction; the offers read are those already recorded on the account when the amount is figured, so a document handed in with the offer being made goes on file with that offer and counts only toward later figures.'
    ls_debt_age: 'Lump-sum debt-age surcharge: the lump-sum debt age is the number of whole months (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) from opened_date to today; a lump-sum debt age below age_young_months adds age_young_pts points, one of at least age_young_months but below age_mid_months adds age_mid_pts points, and an older debt adds no points.'
    ls_age_pts: 'Lump-sum debt-age surcharge: the lump-sum debt age is the number of whole months (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) from opened_date to today; a lump-sum debt age below age_young_months adds age_young_pts points, one of at least age_young_months but below age_mid_months adds age_mid_pts points, and an older debt adds no points.'
    ls_sale_gross: 'Lump-sum sale-recovery surcharge: the lump-sum sale recovery is the gross_sale_proceeds_usd of the recovery case that produced the account divided by the vehicle_book_value_usd of the contract that produced it; a lump-sum sale recovery of sale_high_ratio or more adds sale_high_pts points, one of at least sale_mid_ratio but below sale_high_ratio adds sale_mid_pts points, and a lower one, or one that cannot be figured because either figure is missing, adds no points.'
    ls_book_value: 'Lump-sum sale-recovery surcharge: the lump-sum sale recovery is the gross_sale_proceeds_usd of the recovery case that produced the account divided by the vehicle_book_value_usd of the contract that produced it; a lump-sum sale recovery of sale_high_ratio or more adds sale_high_pts points, one of at least sale_mid_ratio but below sale_high_ratio adds sale_mid_pts points, and a lower one, or one that cannot be figured because either figure is missing, adds no points.'
    ls_sale_ratio: 'Lump-sum sale-recovery surcharge: the lump-sum sale recovery is the gross_sale_proceeds_usd of the recovery case that produced the account divided by the vehicle_book_value_usd of the contract that produced it; a lump-sum sale recovery of sale_high_ratio or more adds sale_high_pts points, one of at least sale_mid_ratio but below sale_high_ratio adds sale_mid_pts points, and a lower one, or one that cannot be figured because either figure is missing, adds no points.'
    ls_sale_pts: 'Lump-sum sale-recovery surcharge: the lump-sum sale recovery is the gross_sale_proceeds_usd of the recovery case that produced the account divided by the vehicle_book_value_usd of the contract that produced it; a lump-sum sale recovery of sale_high_ratio or more adds sale_high_pts points, one of at least sale_mid_ratio but below sale_high_ratio adds sale_mid_pts points, and a lower one, or one that cannot be figured because either figure is missing, adds no points.'
    ls_paid_down: 'Lump-sum paydown surcharge: the lump-sum paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a lump-sum paydown share below paydown_low_share adds paydown_low_pts points, one of at least paydown_low_share but below paydown_mid_share adds paydown_mid_pts points, and a larger one adds no points.'
    ls_paid_share: 'Lump-sum paydown surcharge: the lump-sum paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a lump-sum paydown share below paydown_low_share adds paydown_low_pts points, one of at least paydown_low_share but below paydown_mid_share adds paydown_mid_pts points, and a larger one adds no points.'
    ls_paydown_pts: 'Lump-sum paydown surcharge: the lump-sum paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a lump-sum paydown share below paydown_low_share adds paydown_low_pts points, one of at least paydown_low_share but below paydown_mid_share adds paydown_mid_pts points, and a larger one adds no points.'
    ls_recovery_method: 'Lump-sum recovery-route surcharge, read from the recovery case that produced the account: a recovery_method of involuntary_recovery adds involuntary_pts points, a recovery_method of impound_release adds impound_pts points, and a recovery_method of voluntary_surrender adds no points.'
    ls_route_pts: 'Lump-sum recovery-route surcharge, read from the recovery case that produced the account: a recovery_method of involuntary_recovery adds involuntary_pts points, a recovery_method of impound_release adds impound_pts points, and a recovery_method of voluntary_surrender adds no points.'
    ls_lapsed: 'Lump-sum lapsed-offer surcharge: the lump-sum lapsed offers are the lump_sum_settlement and installment_settlement offers of the account with offer_status expired or declined whose offer_date falls fewer than lapsed_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s); two or more add lapsed_multi_pts points, exactly one adds lapsed_single_pts points, and none adds no points.'
    ls_lapsed_pts: 'Lump-sum lapsed-offer surcharge: the lump-sum lapsed offers are the lump_sum_settlement and installment_settlement offers of the account with offer_status expired or declined whose offer_date falls fewer than lapsed_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s); two or more add lapsed_multi_pts points, exactly one adds lapsed_single_pts points, and none adds no points.'
    ls_pct: The percentage points of the surcharge schedules that apply are added to min_lump_sum_settlement_pct before that percent is applied once to the balance; the product is rounded half up to the cent; any reduction amount a schedule sets, itself rounded half up to the cent, is then subtracted from that rounded figure; and only after that is the figure raised to settlement_floor_usd where lower and limited to the balance.
    ls_pct_amount: The percentage points of the surcharge schedules that apply are added to min_lump_sum_settlement_pct before that percent is applied once to the balance; the product is rounded half up to the cent; any reduction amount a schedule sets, itself rounded half up to the cent, is then subtracted from that rounded figure; and only after that is the figure raised to settlement_floor_usd where lower and limited to the balance.
    result: The percentage points of the surcharge schedules that apply are added to min_lump_sum_settlement_pct before that percent is applied once to the balance; the product is rounded half up to the cent; any reduction amount a schedule sets, itself rounded half up to the cent, is then subtracted from that rounded figure; and only after that is the figure raised to settlement_floor_usd where lower and limited to the balance.
  factors:
  - id: hardship_reduction_method
    effect: method
    decides: ls_hardship_cut
    bindings:
    - ls_lasting_docs
    - ls_jobless_docs
    - ls_hardship_cut
    ladder:
    - when: an offer of the account dated within the look-back carries ssa_award_letter or medical_disability_statement
      method: reduction = hardship_extra_discount_pct percent of the balance, rounded half up to the cent
    - when: no such offer carries either of those, but one dated within the look-back carries unemployment_determination
      method: reduction = the lesser of hardship_extra_discount_pct percent of the balance (rounded half up to the cent) and jobless_cap_installments times plan_min_monthly_payment_usd
    - when: otherwise
      method: no reduction
    baseline:
      ls_hardship_cut: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: debt_age_points
    effect: parameter
    decides: ls_age_pts
    bindings:
    - ls_debt_age
    - ls_age_pts
    ladder:
    - when: debt age below age_young_months whole months
      value: K('age_young_pts')
    - when: at least age_young_months but below age_mid_months
      value: K('age_mid_pts')
    - when: otherwise
      value: '0'
    baseline:
      ls_age_pts: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: sale_recovery_points
    effect: parameter
    decides: ls_sale_pts
    bindings:
    - ls_sale_gross
    - ls_book_value
    - ls_sale_ratio
    - ls_sale_pts
    ladder:
    - when: gross sale proceeds over book value at sale_high_ratio or more
      value: K('sale_high_pts')
    - when: at least sale_mid_ratio but below sale_high_ratio
      value: K('sale_mid_pts')
    - when: otherwise
      value: '0'
    baseline:
      ls_sale_pts: '0'
    evidence:
    - cross_category
    cross_difficulty: recovery
  - id: paydown_points
    effect: parameter
    decides: ls_paydown_pts
    bindings:
    - ls_paid_down
    - ls_paid_share
    - ls_paydown_pts
    ladder:
    - when: paydown share below paydown_low_share
      value: K('paydown_low_pts')
    - when: at least paydown_low_share but below paydown_mid_share
      value: K('paydown_mid_pts')
    - when: otherwise
      value: '0'
    baseline:
      ls_paydown_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: recovery_route_points
    effect: parameter
    decides: ls_route_pts
    bindings:
    - ls_recovery_method
    - ls_route_pts
    ladder:
    - when: recovery_method involuntary_recovery
      value: K('involuntary_pts')
    - when: recovery_method impound_release
      value: K('impound_pts')
    - when: otherwise (voluntary_surrender)
      value: '0'
    baseline:
      ls_route_pts: '0'
    evidence:
    - cross_category
    cross_difficulty: recovery
  - id: lapsed_offer_points
    effect: parameter
    decides: ls_lapsed_pts
    bindings:
    - ls_lapsed
    - ls_lapsed_pts
    ladder:
    - when: two or more expired or declined settlement offers within the look-back
      value: K('lapsed_multi_pts')
    - when: exactly one
      value: K('lapsed_single_pts')
    - when: otherwise
      value: '0'
    baseline:
      ls_lapsed_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A lump-sum settlement offer states min_lump_sum_settlement_pct percent of the balance on the offer date, rounded half up to the cent, raised to settlement_floor_usd where it is lower, and never more than the balance.
    params:
    - min_lump_sum_settlement_pct
    - settlement_floor_usd
  inputs:
    history:
    - table: deficiency_arrangement_offers
      aggregate: count
      field: hardship_document
      within_months: 12
      filters: {}
    - table: deficiency_arrangement_offers
      aggregate: count
      field: offer_status
      within_months: 12
      filters:
        offer_status: expired
    - table: deficiency_transactions
      aggregate: sum
      field: amount_usd
      filters:
        event_type: deficiency_payment_posted
    cross_category:
    - recovery
    - contract
- id: deficiency_ext_installment_settlement
  base_policy_refs:
  - deficiency_settlement
  - deficiency_agg_separate_resolution
  - deficiency_opening
  - deficiency_closure_and_referral
  overwrite: []
  trigger: on_request
  subject:
  - deficiency_settlement_waiver
  computes: settlement_amount_usd
  target_tool: accept_installment_settlement_d1722676
  params:
    broken_window_months: 12
    young_account_months: 12
    returned_lookback_months: 12
    returned_multi_pts: 4.0
    returned_single_pts: 2.0
    idle_long_days: 90
    idle_mid_days: 30
    idle_long_pts: 3.0
    idle_mid_pts: 1.5
    history_short_count: 12
    history_mid_count: 30
    history_short_pts: 4.0
    history_mid_pts: 2.0
    tier6_pts: 3.0
    tier5_pts: 1.5
  rule: 'This policy figures the settlement amount of an installment settlement the borrower accepts on one open account, inside the band''s settlement limits. An installment settlement amount is not worked out until the account carries a lump-sum settlement offer dated today. The lump-sum figure is the offer_amount_usd of the account''s lump_sum_settlement offer whose offer_date is today, the largest such amount where the account carries more than one. An installment settlement amount is the lump-sum figure plus an installment premium of min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of the balance on the offer date, the premium rounded half up to the cent; that sum is raised to settlement_floor_usd where it is lower and is never more than the balance. A schedule that replaces the installment premium is applied first; the surcharge points of the schedules that apply are then added together and applied once to the balance, that amount is rounded half up to the cent and added to the lump-sum figure and the installment premium, and only then are settlement_floor_usd and the balance limit applied. While the account carries no lump_sum_settlement offer dated today, no installment settlement is offered on it: its installment settlement amount is not yet worked out and stands at nil (0.00). Installment premium method: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than broken_window_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the premium is min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of original_deficiency_usd instead of the balance; when there is no such broken arrangement but fewer than young_account_months whole months have run from opened_date to today, the premium is the greater of those points of the balance and settlement_floor_usd; otherwise the premium is those points of the balance; each premium is rounded half up to the cent before any comparison; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time. Installment returned-payment surcharge: two or more deficiency_payment_returned rows of the account dated fewer than returned_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) add returned_multi_pts points, exactly one adds returned_single_pts points, and none adds no points. Installment idle-account surcharge: the premium idle days are the calendar days from the later of opened_date and last_payment_date to today, counted from opened_date when last_payment_date is empty; idle_long_days or more add idle_long_pts points, at least idle_mid_days but fewer than idle_long_days add idle_mid_pts points, and fewer add no points. Installment contract-payment surcharge: the premium contract payments are the contract_payment_posted rows of payment_type installment on the contract that produced the account less the contract_payment_returned rows on that contract; fewer than history_short_count add history_short_pts points, at least history_short_count but fewer than history_mid_count add history_mid_pts points, and history_mid_count or more add no points. Installment credit-tier surcharge, read from the contract that produced the account: variant_name Tier 6 Fresh Start adds tier6_pts points, variant_name Tier 5 Rebuild adds tier5_pts points, and every other credit tier adds no points.'
  prerequisite:
  - problem: deficiency_ext_lump_sum_settlement
    kind: value_input
    gate: si_lump_read
    form: state
    policy_source: An installment settlement amount is not worked out until the account carries a lump-sum settlement offer dated today.
    condition: deficiency_arrangement_offers carries, for the account, a row with offer_type lump_sum_settlement whose offer_date equals today's date.
    resolved_by: record_lump_sum_settlement_offer_7c3d7537
    effect: The lump-sum settlement offer dated today supplies its offer_amount_usd as the lump-sum figure (si_lump_read), which the installment settlement amount is built on; without it no installment settlement is offered and the amount stands at nil.
  cross_category:
  - category: contract
    as: history
    reads:
    - variant_name
    - contract_transactions.event_type
    - contract_transactions.payment_type
    note: Decides the contract-payment surcharge from the contract ledger and the credit-tier surcharge from the contract's tier.
  compute:
  - si_balance: F('deficiency_balance_usd')
  - si_floor: P('settlement_floor_usd')
  - si_spread_pts: P('min_installment_settlement_pct') - P('min_lump_sum_settlement_pct')
  - si_lump_count: COUNT('deficiency_arrangement_offers', offer_type='lump_sum_settlement', offer_date=NOW)
  - si_lump_read: MAX('deficiency_arrangement_offers', 'offer_amount_usd', offer_type='lump_sum_settlement', offer_date=NOW)
  - si_broken_date: LATEST('deficiency_arrangement_offers', 'broken_date', date_field='broken_date', offer_status='broken')
  - si_since_break: MONTHS(si_broken_date, NOW) if si_broken_date else 99999
  - si_account_age: MONTHS(F('opened_date'), NOW)
  - si_premium: RND(F('original_deficiency_usd') * si_spread_pts / 100, 2) if si_since_break < K('broken_window_months') else (MX(RND(si_balance * si_spread_pts / 100, 2), si_floor) if si_account_age < K('young_account_months') else RND(si_balance * si_spread_pts / 100, 2))
  - si_returns: COUNT('deficiency_transactions', within_months=K('returned_lookback_months'), date_field='txn_date', event_type='deficiency_payment_returned')
  - si_returned_pts: K('returned_multi_pts') if si_returns >= 2 else (K('returned_single_pts') if si_returns >= 1 else 0)
  - si_idle_days: DAYS(MX(F('opened_date'), F('last_payment_date') or F('opened_date')), NOW)
  - si_idle_pts: K('idle_long_pts') if si_idle_days >= K('idle_long_days') else (K('idle_mid_pts') if si_idle_days >= K('idle_mid_days') else 0)
  - si_contract_paid: XCOUNT('contract', 'contract_transactions', event_type='contract_payment_posted', payment_type='installment', contract_id=F('contract_id')) - XCOUNT('contract', 'contract_transactions', event_type='contract_payment_returned', contract_id=F('contract_id'))
  - si_history_pts: K('history_short_pts') if si_contract_paid < K('history_short_count') else (K('history_mid_pts') if si_contract_paid < K('history_mid_count') else 0)
  - si_contract_tier: CFIELD('contract', 'variant_name', contract_id=F('contract_id'))
  - si_tier_pts: K('tier6_pts') if si_contract_tier == 'Tier 6 Fresh Start' else (K('tier5_pts') if si_contract_tier == 'Tier 5 Rebuild' else 0)
  - si_extra_pts: si_returned_pts + si_idle_pts + si_history_pts + si_tier_pts
  - si_figure: RND(si_lump_read + si_premium + RND(si_balance * si_extra_pts / 100, 2), 2)
  - result: MN(si_balance, MX(si_figure, si_floor)) if si_lump_count >= 1 else 0
  compute_basis:
    si_balance: An installment settlement amount is the lump-sum figure plus an installment premium of min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of the balance on the offer date, the premium rounded half up to the cent; that sum is raised to settlement_floor_usd where it is lower and is never more than the balance.
    si_floor: An installment settlement amount is the lump-sum figure plus an installment premium of min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of the balance on the offer date, the premium rounded half up to the cent; that sum is raised to settlement_floor_usd where it is lower and is never more than the balance.
    si_spread_pts: An installment settlement amount is the lump-sum figure plus an installment premium of min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of the balance on the offer date, the premium rounded half up to the cent; that sum is raised to settlement_floor_usd where it is lower and is never more than the balance.
    si_lump_count: The lump-sum figure is the offer_amount_usd of the account's lump_sum_settlement offer whose offer_date is today, the largest such amount where the account carries more than one.
    si_lump_read: The lump-sum figure is the offer_amount_usd of the account's lump_sum_settlement offer whose offer_date is today, the largest such amount where the account carries more than one.
    si_broken_date: 'Installment premium method: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than broken_window_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the premium is min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of original_deficiency_usd instead of the balance; when there is no such broken arrangement but fewer than young_account_months whole months have run from opened_date to today, the premium is the greater of those points of the balance and settlement_floor_usd; otherwise the premium is those points of the balance; each premium is rounded half up to the cent before any comparison; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    si_since_break: 'Installment premium method: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than broken_window_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the premium is min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of original_deficiency_usd instead of the balance; when there is no such broken arrangement but fewer than young_account_months whole months have run from opened_date to today, the premium is the greater of those points of the balance and settlement_floor_usd; otherwise the premium is those points of the balance; each premium is rounded half up to the cent before any comparison; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    si_account_age: 'Installment premium method: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than broken_window_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the premium is min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of original_deficiency_usd instead of the balance; when there is no such broken arrangement but fewer than young_account_months whole months have run from opened_date to today, the premium is the greater of those points of the balance and settlement_floor_usd; otherwise the premium is those points of the balance; each premium is rounded half up to the cent before any comparison; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    si_premium: 'Installment premium method: when the latest arrangement offer of the account with offer_status broken has a broken_date fewer than broken_window_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the premium is min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of original_deficiency_usd instead of the balance; when there is no such broken arrangement but fewer than young_account_months whole months have run from opened_date to today, the premium is the greater of those points of the balance and settlement_floor_usd; otherwise the premium is those points of the balance; each premium is rounded half up to the cent before any comparison; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time.'
    si_returns: 'Installment returned-payment surcharge: two or more deficiency_payment_returned rows of the account dated fewer than returned_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) add returned_multi_pts points, exactly one adds returned_single_pts points, and none adds no points.'
    si_returned_pts: 'Installment returned-payment surcharge: two or more deficiency_payment_returned rows of the account dated fewer than returned_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) add returned_multi_pts points, exactly one adds returned_single_pts points, and none adds no points.'
    si_idle_days: 'Installment idle-account surcharge: the premium idle days are the calendar days from the later of opened_date and last_payment_date to today, counted from opened_date when last_payment_date is empty; idle_long_days or more add idle_long_pts points, at least idle_mid_days but fewer than idle_long_days add idle_mid_pts points, and fewer add no points.'
    si_idle_pts: 'Installment idle-account surcharge: the premium idle days are the calendar days from the later of opened_date and last_payment_date to today, counted from opened_date when last_payment_date is empty; idle_long_days or more add idle_long_pts points, at least idle_mid_days but fewer than idle_long_days add idle_mid_pts points, and fewer add no points.'
    si_contract_paid: 'Installment contract-payment surcharge: the premium contract payments are the contract_payment_posted rows of payment_type installment on the contract that produced the account less the contract_payment_returned rows on that contract; fewer than history_short_count add history_short_pts points, at least history_short_count but fewer than history_mid_count add history_mid_pts points, and history_mid_count or more add no points.'
    si_history_pts: 'Installment contract-payment surcharge: the premium contract payments are the contract_payment_posted rows of payment_type installment on the contract that produced the account less the contract_payment_returned rows on that contract; fewer than history_short_count add history_short_pts points, at least history_short_count but fewer than history_mid_count add history_mid_pts points, and history_mid_count or more add no points.'
    si_contract_tier: 'Installment credit-tier surcharge, read from the contract that produced the account: variant_name Tier 6 Fresh Start adds tier6_pts points, variant_name Tier 5 Rebuild adds tier5_pts points, and every other credit tier adds no points.'
    si_tier_pts: 'Installment credit-tier surcharge, read from the contract that produced the account: variant_name Tier 6 Fresh Start adds tier6_pts points, variant_name Tier 5 Rebuild adds tier5_pts points, and every other credit tier adds no points.'
    si_extra_pts: 'A schedule that replaces the installment premium is applied first; the surcharge points of the schedules that apply are then added together and applied once to the balance, that amount is rounded half up to the cent and added to the lump-sum figure and the installment premium, and only then are settlement_floor_usd and the balance limit applied. While the account carries no lump_sum_settlement offer dated today, no installment settlement is offered on it: its installment settlement amount is not yet worked out and stands at nil (0.00).'
    si_figure: 'A schedule that replaces the installment premium is applied first; the surcharge points of the schedules that apply are then added together and applied once to the balance, that amount is rounded half up to the cent and added to the lump-sum figure and the installment premium, and only then are settlement_floor_usd and the balance limit applied. While the account carries no lump_sum_settlement offer dated today, no installment settlement is offered on it: its installment settlement amount is not yet worked out and stands at nil (0.00).'
    result: 'A schedule that replaces the installment premium is applied first; the surcharge points of the schedules that apply are then added together and applied once to the balance, that amount is rounded half up to the cent and added to the lump-sum figure and the installment premium, and only then are settlement_floor_usd and the balance limit applied. While the account carries no lump_sum_settlement offer dated today, no installment settlement is offered on it: its installment settlement amount is not yet worked out and stands at nil (0.00).'
  factors:
  - id: premium_method
    effect: method
    decides: si_premium
    bindings:
    - si_broken_date
    - si_since_break
    - si_account_age
    - si_premium
    ladder:
    - when: an arrangement of the account broken fewer than broken_window_months whole months before today
      method: premium = the spread points of original_deficiency_usd, rounded half up to the cent
    - when: no such broken arrangement, and the account opened fewer than young_account_months whole months before today
      method: premium = the greater of the spread points of the balance (rounded half up to the cent) and settlement_floor_usd
    - when: otherwise
      method: premium = the spread points of the balance, rounded half up to the cent
    baseline:
      si_premium: RND(si_balance * si_spread_pts / 100, 2)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: returned_points
    effect: parameter
    decides: si_returned_pts
    bindings:
    - si_returns
    - si_returned_pts
    ladder:
    - when: two or more returned payments within the look-back
      value: K('returned_multi_pts')
    - when: exactly one
      value: K('returned_single_pts')
    - when: otherwise
      value: '0'
    baseline:
      si_returned_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: idle_points
    effect: parameter
    decides: si_idle_pts
    bindings:
    - si_idle_days
    - si_idle_pts
    ladder:
    - when: idle_long_days or more idle days
      value: K('idle_long_pts')
    - when: at least idle_mid_days but fewer than idle_long_days
      value: K('idle_mid_pts')
    - when: otherwise
      value: '0'
    baseline:
      si_idle_pts: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: contract_paid_points
    effect: parameter
    decides: si_history_pts
    bindings:
    - si_contract_paid
    - si_history_pts
    ladder:
    - when: fewer than history_short_count contract installment payments, net of returns
      value: K('history_short_pts')
    - when: at least history_short_count but fewer than history_mid_count
      value: K('history_mid_pts')
    - when: otherwise
      value: '0'
    baseline:
      si_history_pts: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: contract
  - id: credit_tier_points
    effect: parameter
    decides: si_tier_pts
    bindings:
    - si_contract_tier
    - si_tier_pts
    ladder:
    - when: contract variant_name Tier 6 Fresh Start
      value: K('tier6_pts')
    - when: contract variant_name Tier 5 Rebuild
      value: K('tier5_pts')
    - when: otherwise
      value: '0'
    baseline:
      si_tier_pts: '0'
    evidence:
    - cross_category
    cross_difficulty: contract
  baseline:
    rule: The lump-sum figure is the offer_amount_usd of the account's lump_sum_settlement offer whose offer_date is today, the largest such amount where the account carries more than one. An installment settlement amount is the lump-sum figure plus an installment premium of min_installment_settlement_pct less min_lump_sum_settlement_pct percentage points of the balance on the offer date, the premium rounded half up to the cent; that sum is raised to settlement_floor_usd where it is lower and is never more than the balance.
    params:
    - min_installment_settlement_pct
    - min_lump_sum_settlement_pct
    - settlement_floor_usd
  inputs:
    history:
    - table: deficiency_arrangement_offers
      aggregate: latest
      field: offer_amount_usd
      filters:
        offer_type: lump_sum_settlement
    - table: deficiency_transactions
      aggregate: count
      field: deficiency_txn_id
      within_months: 12
      filters:
        event_type: deficiency_payment_returned
    - category: contract
      table: contract_transactions
      aggregate: count
      field: contract_txn_id
      filters:
        event_type: contract_payment_posted
        payment_type: installment
    cross_category:
    - contract
- id: deficiency_ext_settlement_installment
  base_policy_refs:
  - deficiency_settlement
  - deficiency_agg_separate_resolution
  - deficiency_closure_and_referral
  overwrite: []
  trigger: on_request
  subject:
  - deficiency_settlement_started
  computes: installment_amount_usd
  target_tool: start_installment_settlement_185f50ba
  params:
    broken_window_months: 12
    returned_lookback_months: 12
    returned_multi_cut: 2
    returned_single_cut: 1
    tierhist_count: 24
    tierhist_high_cut: 2
    tierhist_mid_cut: 1
    paydown_high_share: 0.3
    paydown_mid_share: 0.15
    paydown_high_ext: 2
    paydown_mid_ext: 1
    recent_months: 6
    recent_many_count: 3
    recent_many_ext: 2
    recent_some_ext: 1
  rule: 'This policy figures the monthly installment of an installment settlement when the settlement is started on one account, over no more than max_settlement_installments installments. The installment of an installment settlement is fixed only after the account carries an installment settlement offer that the borrower has accepted. The settlement amount is the offer_amount_usd of the account''s installment_settlement offer with offer_status accepted, the largest such amount where the account carries more than one, and the settlement is started under the offer that amount comes from. An account carrying no installment_settlement offer with offer_status accepted has no settlement the settlement rule allows to start, and its settlement installment is nil (0.00). An installment settlement is spread over a standard number of installments equal to max_settlement_installments, and each monthly installment is the settlement amount divided by that number, rounded up to the cent. A schedule that replaces the standard number of installments is applied first; the installment cuts of the schedules that apply are then subtracted from that number and the installment additions added to it; the number is then held to at least one and at most max_settlement_installments, and the settlement amount is divided by it and rounded up to the cent. Settlement count method: when the latest payment_plan offer of the account with offer_status broken has a broken_date fewer than broken_window_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s), the standard number of installments is replaced by the lesser of max_settlement_installments and the whole months that plan ran from its accepted_at date to its broken_date, but at least one; when there is no such broken plan and the settlement amount is below max_settlement_installments times plan_min_monthly_payment_usd, it is replaced by the whole number of times plan_min_monthly_payment_usd goes into the settlement amount, but at least one; otherwise the standard number of installments stands; no two arrangements of an account break on the same day, since an account has only one arrangement in force at a time. Settlement returned-payment cut: two or more deficiency_payment_returned rows of the account dated fewer than returned_lookback_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) cut returned_multi_cut installments, exactly one cuts returned_single_cut installment, and none cuts nothing. Settlement credit-history cut, read from the contract that produced the account, where the settlement contract payments are its contract_payment_posted rows of payment_type installment less its contract_payment_returned rows: a contract of variant_name Tier 6 Fresh Start or Tier 5 Rebuild with fewer than tierhist_count settlement contract payments cuts tierhist_high_cut installments; a contract of variant_name Tier 6 Fresh Start or Tier 5 Rebuild with tierhist_count or more, or a contract of variant_name Tier 4 Standard with fewer than tierhist_count, cuts tierhist_mid_cut installment; every other contract cuts nothing. Settlement paydown addition: the settlement paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a settlement paydown share of paydown_high_share or more adds paydown_high_ext installments, one of at least paydown_mid_share but below paydown_high_share adds paydown_mid_ext installment, and a smaller one adds none. Settlement recent-payment addition: the settlement recent payments are the deficiency_payment_posted rows of the account dated fewer than recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) less the deficiency_payment_returned rows dated in the same period; recent_many_count or more add recent_many_ext installments, at least one but fewer than recent_many_count add recent_some_ext installment, and any smaller count adds none.'
  prerequisite:
  - problem: deficiency_ext_installment_settlement
    kind: state_gate
    gate: deficiency_settlement.settlement_offer_accepted
    form: state
    policy_source: The installment of an installment settlement is fixed only after the account carries an installment settlement offer that the borrower has accepted.
    condition: deficiency_arrangement_offers carries, for the account, a row with offer_type installment_settlement and offer_status accepted.
    resolved_by: accept_installment_settlement_d1722676
    effect: The borrower's acceptance satisfies the settlement rule's gate that a settlement is carried out only under an offer the borrower has accepted, and its offer_amount_usd becomes the settlement amount the installment divides; without it no settlement may start and the installment is nil.
  cross_category:
  - category: contract
    as: history
    reads:
    - variant_name
    - contract_transactions.event_type
    - contract_transactions.payment_type
    note: Decides the credit-history cut from the contract's tier together with its installment payments posted and returned.
  compute:
  - ss_amount_read: MAX('deficiency_arrangement_offers', 'offer_amount_usd', offer_type='installment_settlement', offer_status='accepted')
  - ss_amount: ss_amount_read
  - ss_band_max: P('max_settlement_installments')
  - ss_plan_min: P('plan_min_monthly_payment_usd')
  - ss_plan_broken: LATEST('deficiency_arrangement_offers', 'broken_date', date_field='broken_date', offer_status='broken', offer_type='payment_plan')
  - ss_plan_accepted: LATEST('deficiency_arrangement_offers', 'accepted_at', date_field='broken_date', offer_status='broken', offer_type='payment_plan')
  - ss_plan_since: MONTHS(ss_plan_broken, NOW) if ss_plan_broken else 99999
  - ss_plan_ran: MONTHS(ss_plan_accepted, ss_plan_broken) if ss_plan_accepted and ss_plan_broken else 0
  - ss_count_basis: MX(1, MN(ss_band_max, ss_plan_ran)) if ss_plan_since < K('broken_window_months') else (MX(1, int(ss_amount // ss_plan_min)) if ss_amount < ss_band_max * ss_plan_min else ss_band_max)
  - ss_returns: COUNT('deficiency_transactions', within_months=K('returned_lookback_months'), date_field='txn_date', event_type='deficiency_payment_returned')
  - ss_returned_cut: K('returned_multi_cut') if ss_returns >= 2 else (K('returned_single_cut') if ss_returns >= 1 else 0)
  - ss_contract_tier: CFIELD('contract', 'variant_name', contract_id=F('contract_id'))
  - ss_contract_paid: XCOUNT('contract', 'contract_transactions', event_type='contract_payment_posted', payment_type='installment', contract_id=F('contract_id')) - XCOUNT('contract', 'contract_transactions', event_type='contract_payment_returned', contract_id=F('contract_id'))
  - ss_tierhist_cut: K('tierhist_high_cut') if ((ss_contract_tier == 'Tier 6 Fresh Start' or ss_contract_tier == 'Tier 5 Rebuild') and ss_contract_paid < K('tierhist_count')) else (K('tierhist_mid_cut') if (((ss_contract_tier == 'Tier 6 Fresh Start' or ss_contract_tier == 'Tier 5 Rebuild') and ss_contract_paid >= K('tierhist_count')) or (ss_contract_tier == 'Tier 4 Standard' and ss_contract_paid < K('tierhist_count'))) else 0)
  - ss_paid_down: SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_payment_posted') + SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_credit_applied') - SUM('deficiency_transactions', 'amount_usd', event_type='deficiency_payment_returned')
  - ss_paid_share: ss_paid_down / F('original_deficiency_usd')
  - ss_paydown_ext: K('paydown_high_ext') if ss_paid_share >= K('paydown_high_share') else (K('paydown_mid_ext') if ss_paid_share >= K('paydown_mid_share') else 0)
  - ss_recent_count: COUNT('deficiency_transactions', within_months=K('recent_months'), date_field='txn_date', event_type='deficiency_payment_posted') - COUNT('deficiency_transactions', within_months=K('recent_months'), date_field='txn_date', event_type='deficiency_payment_returned')
  - ss_recent_ext: K('recent_many_ext') if ss_recent_count >= K('recent_many_count') else (K('recent_some_ext') if ss_recent_count >= 1 else 0)
  - ss_count: MN(ss_band_max, MX(1, ss_count_basis - ss_returned_cut - ss_tierhist_cut + ss_paydown_ext + ss_recent_ext))
  - result: -((-RND(ss_amount * 100 / ss_count, 6)) // 1) / 100
  compute_basis:
