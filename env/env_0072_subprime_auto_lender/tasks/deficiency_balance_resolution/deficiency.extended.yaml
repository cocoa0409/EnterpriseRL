  - dp_contract_paid: XCOUNT('contract', 'contract_transactions', event_type='contract_payment_posted', payment_type='installment', contract_id=F('contract_id')) - XCOUNT('contract', 'contract_transactions', event_type='contract_payment_returned', contract_id=F('contract_id'))
