  factors:
  - id: hardship_relief
    effect: parameter
    decides: dp_hardship_pts
    bindings:
    - dp_lasting_docs
    - dp_jobless_docs
    - dp_hardship_pts
    ladder:
    - when: an offer of the account dated within the look-back carries ssa_award_letter or medical_disability_statement
      value: K('lasting_hardship_pts')
    - when: no such offer carries either of those, but one dated within the look-back carries unemployment_determination
      value: K('temporary_hardship_pts')
    - when: otherwise
      value: '0'
    baseline:
      dp_hardship_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: surrender_relief
    effect: parameter
    decides: dp_surrender_pts
    bindings:
    - dp_recovery_method
    - dp_key_in
    - dp_surrender_pts
    ladder:
    - when: the recovery case's recovery_method is voluntary_surrender and keys_obtained is true
      value: K('surrender_key_pts')
    - when: the recovery case's recovery_method is voluntary_surrender and keys_obtained is false
      value: K('surrender_nokey_pts')
    - when: otherwise (involuntary recovery or impound release)
      value: '0'
    baseline:
      dp_surrender_pts: '0'
    evidence:
    - cross_category
    cross_difficulty: recovery
  - id: broken_run_relief
    effect: parameter
    decides: dp_run_pts
    bindings:
    - dp_broken_accepted
    - dp_run_months
    - dp_run_pts
    ladder:
    - when: the latest broken arrangement ran run_long_months whole months or more from accepted_at to broken_date
      value: K('run_long_pts')
    - when: it ran at least run_mid_months but fewer than run_long_months whole months
      value: K('run_mid_pts')
    - when: otherwise
      value: '0'
    baseline:
      dp_run_pts: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: contract_history_relief
    effect: parameter
    decides: dp_history_pts
    bindings:
    - dp_contract_paid
    - dp_history_pts
    ladder:
    - when: history_high_count or more installment payments posted and not returned on the contract
      value: K('history_high_pts')
    - when: at least history_mid_count but fewer than history_high_count
      value: K('history_mid_pts')
    - when: otherwise
      value: '0'
    baseline:
      dp_history_pts: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: contract
  - id: make_good_addition
    effect: method
    decides: dp_make_good
    bindings:
    - dp_returned_total
    - dp_broken_installment
    - dp_days_since_break
    - dp_make_good
    ladder:
    - when: returned payments of the account dated within the returned-payment look-back
      method: add the total amount_usd of those returned payments to the rounded figure
    - when: no such returned payment, and the latest broken_date no more than recent_break_days calendar days before today
      method: add the latest broken arrangement's installment_amount_usd to the rounded figure
    - when: otherwise
      method: add nothing
    baseline:
      dp_make_good: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The restart down payment is plan_restart_down_payment_pct percent of the balance on the day it is figured, rounded half up to the cent.
    params:
    - plan_restart_down_payment_pct
  inputs:
    history:
    - table: deficiency_arrangement_offers
      aggregate: count
      field: hardship_document
      within_months: 12
      filters: {}
    - table: deficiency_arrangement_offers
      aggregate: latest
      field: broken_date
      filters:
        offer_status: broken
    - table: deficiency_transactions
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        event_type: deficiency_payment_returned
    - category: contract
