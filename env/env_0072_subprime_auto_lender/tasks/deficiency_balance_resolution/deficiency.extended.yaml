    ss_contract_paid: 'Settlement credit-history cut, read from the contract that produced the account, where the settlement contract payments are its contract_payment_posted rows of payment_type installment less its contract_payment_returned rows: a contract of variant_name Tier 6 Fresh Start or Tier 5 Rebuild with fewer than tierhist_count settlement contract payments cuts tierhist_high_cut installments; a contract of variant_name Tier 6 Fresh Start or Tier 5 Rebuild with tierhist_count or more, or a contract of variant_name Tier 4 Standard with fewer than tierhist_count, cuts tierhist_mid_cut installment; every other contract cuts nothing.'
    ss_tierhist_cut: 'Settlement credit-history cut, read from the contract that produced the account, where the settlement contract payments are its contract_payment_posted rows of payment_type installment less its contract_payment_returned rows: a contract of variant_name Tier 6 Fresh Start or Tier 5 Rebuild with fewer than tierhist_count settlement contract payments cuts tierhist_high_cut installments; a contract of variant_name Tier 6 Fresh Start or Tier 5 Rebuild with tierhist_count or more, or a contract of variant_name Tier 4 Standard with fewer than tierhist_count, cuts tierhist_mid_cut installment; every other contract cuts nothing.'
    ss_paid_down: 'Settlement paydown addition: the settlement paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a settlement paydown share of paydown_high_share or more adds paydown_high_ext installments, one of at least paydown_mid_share but below paydown_high_share adds paydown_mid_ext installment, and a smaller one adds none.'
    ss_paid_share: 'Settlement paydown addition: the settlement paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a settlement paydown share of paydown_high_share or more adds paydown_high_ext installments, one of at least paydown_mid_share but below paydown_high_share adds paydown_mid_ext installment, and a smaller one adds none.'
    ss_paydown_ext: 'Settlement paydown addition: the settlement paydown share is the total amount_usd of the account''s deficiency_payment_posted and deficiency_credit_applied rows less the total amount_usd of its deficiency_payment_returned rows, divided by original_deficiency_usd; a settlement paydown share of paydown_high_share or more adds paydown_high_ext installments, one of at least paydown_mid_share but below paydown_high_share adds paydown_mid_ext installment, and a smaller one adds none.'
    ss_recent_count: 'Settlement recent-payment addition: the settlement recent payments are the deficiency_payment_posted rows of the account dated fewer than recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) less the deficiency_payment_returned rows dated in the same period; recent_many_count or more add recent_many_ext installments, at least one but fewer than recent_many_count add recent_some_ext installment, and any smaller count adds none.'
    ss_recent_ext: 'Settlement recent-payment addition: the settlement recent payments are the deficiency_payment_posted rows of the account dated fewer than recent_months whole months before today (whole months counted as the difference in calendar months, less one when the later date''s day of the month is below the earlier date''s) less the deficiency_payment_returned rows dated in the same period; recent_many_count or more add recent_many_ext installments, at least one but fewer than recent_many_count add recent_some_ext installment, and any smaller count adds none.'
    ss_count: A schedule that replaces the standard number of installments is applied first; the installment cuts of the schedules that apply are then subtracted from that number and the installment additions added to it; the number is then held to at least one and at most max_settlement_installments, and the settlement amount is divided by it and rounded up to the cent.
    result: A schedule that replaces the standard number of installments is applied first; the installment cuts of the schedules that apply are then subtracted from that number and the installment additions added to it; the number is then held to at least one and at most max_settlement_installments, and the settlement amount is divided by it and rounded up to the cent.
  factors:
  - id: count_method
    effect: method
    decides: ss_count_basis
    bindings:
    - ss_plan_min
    - ss_plan_broken
    - ss_plan_accepted
    - ss_plan_since
    - ss_plan_ran
    - ss_count_basis
    ladder:
    - when: a payment plan of the account broken fewer than broken_window_months whole months before today
      method: the standard number of installments is replaced by the lesser of max_settlement_installments and the whole months that plan ran, at least one
    - when: no such broken plan, and the settlement amount below max_settlement_installments times plan_min_monthly_payment_usd
      method: the standard number of installments is replaced by the whole number of plan_min_monthly_payment_usd in the settlement amount, at least one
    - when: otherwise
      method: the standard number of installments (max_settlement_installments) stands
    baseline:
      ss_count_basis: ss_band_max
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: returned_cut
    effect: parameter
    decides: ss_returned_cut
    bindings:
    - ss_returns
    - ss_returned_cut
    ladder:
    - when: two or more returned payments within the look-back
      value: K('returned_multi_cut')
    - when: exactly one
      value: K('returned_single_cut')
    - when: otherwise
      value: '0'
    baseline:
      ss_returned_cut: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: tier_history_cut
    effect: parameter
    decides: ss_tierhist_cut
    bindings:
    - ss_contract_tier
    - ss_contract_paid
    - ss_tierhist_cut
    ladder:
    - when: contract Tier 6 Fresh Start or Tier 5 Rebuild AND fewer than tierhist_count contract installment payments net of returns
      value: K('tierhist_high_cut')
    - when: (Tier 6 Fresh Start or Tier 5 Rebuild AND tierhist_count or more) OR (Tier 4 Standard AND fewer than tierhist_count)
      value: K('tierhist_mid_cut')
    - when: otherwise
      value: '0'
    baseline:
      ss_tierhist_cut: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: contract
  - id: paydown_extension
    effect: parameter
    decides: ss_paydown_ext
    bindings:
    - ss_paid_down
    - ss_paid_share
    - ss_paydown_ext
    ladder:
    - when: settlement paydown share of paydown_high_share or more
      value: K('paydown_high_ext')
    - when: at least paydown_mid_share but below paydown_high_share
      value: K('paydown_mid_ext')
    - when: otherwise
      value: '0'
    baseline:
      ss_paydown_ext: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: recent_extension
    effect: parameter
    decides: ss_recent_ext
    bindings:
    - ss_recent_count
    - ss_recent_ext
    ladder:
    - when: recent_many_count or more posted payments net of returns within recent_months
      value: K('recent_many_ext')
    - when: at least one but fewer than recent_many_count
      value: K('recent_some_ext')
    - when: otherwise
      value: '0'
    baseline:
      ss_recent_ext: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The settlement amount is the offer_amount_usd of the account's installment_settlement offer with offer_status accepted, the largest such amount where the account carries more than one, and the settlement is started under the offer that amount comes from. An installment settlement is spread over a standard number of installments equal to max_settlement_installments, and each monthly installment is the settlement amount divided by that number, rounded up to the cent.
    params:
    - max_settlement_installments
  inputs:
    history:
    - table: deficiency_arrangement_offers
      aggregate: latest
      field: offer_amount_usd
      filters:
        offer_type: installment_settlement
        offer_status: accepted
    - table: deficiency_transactions
      aggregate: count
      field: deficiency_txn_id
      within_months: 12
      filters:
        event_type: deficiency_payment_returned
    - category: contract
      table: contract_transactions
      aggregate: count
      field: contract_txn_id
      filters:
        event_type: contract_payment_posted
        payment_type: installment
    cross_category:
    - contract
