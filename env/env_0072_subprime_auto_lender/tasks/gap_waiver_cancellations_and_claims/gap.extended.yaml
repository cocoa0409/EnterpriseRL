      unearned_ratio_basis: "calendar days from the cancellation effective date to expiration_date, divided by calendar days from enrollment_date to expiration_date"
      max_claims_per_addendum: 1
      eligible_contract_statuses_at_loss: ["active"]
      salvage_retention_basis: "the salvage value the primary insurer deducted from its settlement"
      deductible_reimbursement_basis: "the deductible the primary insurer actually deducted, up to deductible_reimbursement_max_usd"

# ---- data flow ----
events:
  - type: gap_enrolled
    target: gap_addenda
    mutation: create
    meaning: "The borrower buys the GAP waiver addendum at contract signing and its price is financed in the contract."
    grain: "one row per addendum"
    fields:
      customer_id: "the borrower"
      contract_id: "the contract the addendum is attached to"
      variant_name: "addendum plan"
      enrollment_date: "contract date"
      price_usd: "charge financed"
      term_months: "coverage term (the contract's original term)"
      expiration_date: "the contract's original maturity date"
      charge_net_usd: "set to price_usd"
    account: gap_charge_net
    direction: in
    triggers: []
  - type: gap_claim_filed
    target: gap_activities
    meaning: "A total-loss or theft claim is reported with the primary insurer's settlement details."
    grain: "one row per reported loss"
    distinguish_by: [loss_date]
    fields:
      activity_date: "date the claim was reported"
      loss_date: "date of the loss"
      loss_type: "kind of loss"
      primary_insurer_name: "borrower's insurer paying the actual cash value"
      primary_settlement_acv_usd: "actual cash value the primary insurer paid"
      primary_deductible_usd: "deductible the primary insurer deducted"
    triggers:
      - event: gap:gap_claim_opened
  - type: gap_claim_opened
    target: gap_addenda
    mutation: {transition: {from: active, to: claim_open}}
    meaning: "The addendum is held in claim status while a loss is reviewed."
    grain: "one row per transaction"
    fields: {status: "set to claim_open"}
    triggers: []
  - type: gap_claim_withdrawn
    target: gap_addenda
    mutation: {transition: {from: claim_open, to: active}}
    meaning: "The claim is withdrawn because the vehicle was repaired and not declared a total loss."
    grain: "one row per transaction"
    fields: {status: "set to active"}
    triggers: []
  - type: gap_claim_decided
    target: gap_activities
    meaning: "A reported loss is decided and, when approved, the benefit is computed."
    grain: "one row per claim decided"
    distinguish_by: [related_activity_id]
    fields:
      activity_date: "decision date"
      related_activity_id: "the claim being decided"
      decision: "approved or denied"
      denial_reason: "reason for a denial"
      balance_at_loss_usd: "benefit starting balance on the date of loss"
      excluded_amounts_usd: "total of excluded amounts"
      deductible_covered_usd: "primary deductible covered by the benefit"
      benefit_usd: "benefit credited to the contract (0.00 when denied)"
    triggers:
      - event: contract:contract_ancillary_credit
        when: {decision: approved}
        map: {txn_date: activity_date, amount_usd: benefit_usd, ancillary_source: gap_benefit, source_record_id: gap_activity_id}
      - event: gap:gap_benefit_paid
        when: {decision: approved}
      - event: gap:gap_claim_denied
        when: {decision: denied}
        map: {cancellation_reason: claim_denied}
  - type: gap_benefit_paid
    target: gap_addenda
    mutation: {transition: {from: claim_open, to: benefit_paid}}
    meaning: "The approved benefit has been credited and the addendum ends."
    grain: "one row per transaction"
    fields:
      status: "set to benefit_paid"
      closed_date: "decision date"
    triggers: []
  - type: gap_claim_denied
    target: gap_addenda
    mutation: {transition: {from: claim_open, to: cancelled}}
    meaning: "The claim is denied and the addendum ends as of the date of loss."
    grain: "one row per transaction"
    fields:
      status: "set to cancelled"
      cancellation_reason: "set to claim_denied"
      cancellation_effective_date: "date of loss"
      closed_date: "decision date"
    triggers: []
  - type: gap_cancelled
    target: gap_addenda
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The addendum is cancelled before expiration."
    grain: "one row per transaction"
    fields:
      status: "set to cancelled"
      cancellation_reason: "why it was cancelled"
      cancellation_effective_date: "effective date by reason (cancellation_effective_date_basis)"
      closed_date: "processing date"
    triggers: []
  - type: gap_refund_issued
    target: gap_activities
    meaning: "Unearned addendum charge is refunded after a cancellation."
    grain: "one row per cancelled addendum"
    distinguish_by: [refund_method]
    fields:
      activity_date: "refund date"
      amount_usd: "refund amount"
      refund_method: "how the refund was computed"
      refund_disposition: "where the refund went"
      gap_request_id: "the signed cancellation request, for a voluntary cancellation; empty otherwise"
    account: gap_charge_net
    direction: out
    triggers:
      - event: contract:contract_ancillary_credit
        when: {refund_disposition: credited_to_contract_balance}
        map: {txn_date: activity_date, amount_usd: amount_usd, ancillary_source: gap_refund, source_record_id: gap_activity_id}
      - event: deficiency:deficiency_credit_applied
        when: {refund_disposition: credited_to_deficiency_balance}
        map: {txn_date: activity_date, amount_usd: amount_usd, credit_source: gap_refund, source_record_id: gap_activity_id}
  - type: gap_expired
    target: gap_addenda
    mutation: {transition: {from: active, to: expired}}
    meaning: "The addendum reaches its expiration date."
    grain: "one row per transaction"
    fields:
      status: "set to expired"
      closed_date: "expiration date"
    triggers: []

# ---- derived measures ----
measures:
  - id: gap_msr_unearned_ratio
    window: "from the cancellation effective date to expiration_date of one addendum"
    measure: "calendar days from the cancellation effective date to expiration_date, divided by calendar days from enrollment_date to expiration_date (unearned_ratio_basis); 0 when the effective date is on or after expiration_date"
  - id: gap_msr_scheduled_balance_at_loss
    window: "the contract's amortisation from contract_date to the date of loss"
    measure: "contract principal balance on the date of loss had every installment been paid on its original due date (no extension deferrals), plus interest at the contract rate accrued from the last such due date to the date of loss"
  - id: gap_msr_excess_ltv_amount
    window: "point in time at the date of loss"
    measure: "the amount by which the contract's amount financed exceeded max_ltv_covered_pct of vehicle_book_value_usd at origination, reduced in the same proportion as the scheduled balance has amortised (scheduled balance at loss divided by amount financed); 0 when within the limit"

# ---- policies ----
policies:
  - id: gap_agg_multi_holding
    subject: [gap_enrolled]
    rule: >-
      The GAP waiver is attached to one contract: a borrower may hold an addendum on each of their contracts, without a per-borrower limit, but a contract never carries more than max_open_addenda_per_contract addendum that is not closed.
    eligibility: []
    params: {max_per_customer: null}
  - id: gap_agg_contract_portfolio
    subject: [gap_claim_decided, gap_refund_issued]
    rule: >-
      A benefit is computed from the records of the addendum's own contract only; losses, balances and refunds of the borrower's other contracts are never combined with it.
      Holding a vehicle service contract on the same contract changes the benefit: on a total loss the service contract is cancelled and its unearned refund (as computed under the service-contract refund rules on the date of loss) is an excluded amount that reduces the GAP benefit, whether or not the refund has been issued yet; the same applies to any other cancellable add-on product financed in the contract.
      Force-placed insurance never counts as the borrower's primary insurance, and premiums it added to the contract balance are excluded amounts.
      An addendum and a service contract on the same contract are cancelled and refunded independently, each under its own rules.
    eligibility: []
  - id: gap_enrollment_terms
    subject: [gap_enrolled]
    rule: >-
      The addendum is sold only at contract signing (enrollment_only_at_signing), for price_usd of the plan financed in the contract, on a contract whose loan-to-value and original term fall within the plan's entry_gate, whose amount financed is no more than max_amount_financed_usd, whose vehicle is no older than max_vehicle_age_years and is not in an excluded_vehicle_uses category.
      Coverage runs from the contract date (coverage_start_basis) to the contract's original maturity date (coverage_end_basis, term_matches_contract); extensions and due-date changes never lengthen it.
      The addendum is not transferable to another vehicle or contract (transferable).
    eligibility: []
    params:
      per_tier:
        GAP Waiver 120: {price_usd: "=price_usd", max_amount_financed_usd: "=max_amount_financed_usd"}
        GAP Waiver 130: {price_usd: "=price_usd", max_amount_financed_usd: "=max_amount_financed_usd"}
        GAP Waiver 140: {price_usd: "=price_usd", max_amount_financed_usd: "=max_amount_financed_usd"}
        GAP Waiver 150: {price_usd: "=price_usd", max_amount_financed_usd: "=max_amount_financed_usd"}
        GAP Waiver Plus 150: {price_usd: "=price_usd", max_amount_financed_usd: "=max_amount_financed_usd"}
        GAP Waiver Premier 150: {price_usd: "=price_usd", max_amount_financed_usd: "=max_amount_financed_usd"}
  - id: gap_claim_benefit
    subject: [gap_claim_filed, gap_claim_opened, gap_claim_withdrawn, gap_claim_decided, gap_benefit_paid, gap_claim_denied]
    rule: >-
      A claim is filed only on an addendum whose status is active.
      The claim must be reported no later than claim_notice_days_after_loss after the date of loss.
      The reporting period is counted in calendar days from loss_date, and a report on the last day is in time.
      An addendum takes at most max_claims_per_addendum decided claim, and a loss is a total loss as total_loss_definition states; a theft is decided only after it has stayed unrecovered for unrecovered_theft_wait_days.
      The claim is denied (denial_reason) when the borrower's own physical-damage insurance was not in force on the date of loss (primary_insurance_required; no_primary_insurance; force-placed coverage does not count), when the loss date is outside the coverage term (outside_coverage_term), when the contract's status on the date of loss was not in eligible_contract_statuses_at_loss (contract_not_active), when the vehicle was in an excluded use (excluded_use), or when the complete claim file (required_claim_documents) is not received within claim_docs_due_days after the primary insurer's settlement (late_documents); the first of these in that order is recorded.
      Otherwise the claim is approved within claim_decision_days of the complete file and the benefit is the scheduled balance on the date of loss (benefit_balance_basis, gap_msr_scheduled_balance_at_loss), less the portion above max_ltv_covered_pct (gap_msr_excess_ltv_amount), less every excluded_amounts item (salvage retained by the borrower is excluded at salvage_retention_basis), less the primary insurer's actual cash value, plus the deductible covered (deductible_reimbursement_basis: the primary deductible actually deducted, up to deductible_reimbursement_max_usd), never below 0.00 and never above max_benefit_usd, rounded half-up to the cent (benefit_rounding).
      The benefit is credited to the contract within claim_payment_days of approval (benefit_paid_to); any excluded amounts stay owed by the borrower on the contract; a denied claim ends the addendum as of the date of loss and its unearned charge is refunded under gap_cancellation_refund.
      A claim withdrawn because the vehicle was repaired returns the addendum to active (claim_withdrawal_reactivation).
      A written denial stating the reason is mailed within denial_notice_days.
    eligibility:
      - id: claim_on_active_addendum
        applies_to: [gap_claim_filed]
        kind: state
        condition: "A claim is filed only on an addendum whose status is active."
        evidence_fields: [gap_addenda.status, gap_addenda.gap_addendum_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[gap_addenda.gap_addendum_id]]
          action_bindings: {gap_addenda.gap_addendum_id: gap_addendum_id}
        state_contract:
          field: gap_addenda.status
          allowed: [active]
      - id: claim_reported_in_time
        applies_to: [gap_claim_filed]
        kind: time
        condition: "The claim must be reported no later than claim_notice_days_after_loss after the date of loss."
        evidence_fields: [gap_activities.loss_date, gap_activities.gap_addendum_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[gap_activities.gap_addendum_id]]
          action_bindings: {gap_activities.gap_addendum_id: gap_addendum_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date of loss"
          anchor_source: gap_activities.loss_date
          relation: not_after
          duration_source: variants.claim_notice_days_after_loss
          unit: calendar_days
          counting_rule: "The reporting period is counted in calendar days from loss_date, and a report on the last day is in time."
          boundary: inclusive
      - id: one_decision_per_claim
        applies_to: [gap_claim_decided]
        kind: dedup
        condition: "An addendum takes at most max_claims_per_addendum decided claim, and a loss is a total loss as total_loss_definition states; a theft is decided only after it has stayed unrecovered for unrecovered_theft_wait_days."
        evidence_fields: [gap_activities.related_activity_id, gap_activities.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[gap_activities.related_activity_id]]
          action_bindings: {gap_activities.related_activity_id: related_activity_id}
        dedup_contract:
          table: gap_activities
          mode: separate_record
          object_bindings: {related_activity_id: related_activity_id}
          duplicate_filters: {event_type: [gap_claim_decided]}
          distinct_fields: []
    params:
      per_tier:
        GAP Waiver 120: {max_ltv_covered_pct: "=max_ltv_covered_pct", max_benefit_usd: "=max_benefit_usd", deductible_reimbursement_max_usd: "=deductible_reimbursement_max_usd"}
        GAP Waiver 130: {max_ltv_covered_pct: "=max_ltv_covered_pct", max_benefit_usd: "=max_benefit_usd", deductible_reimbursement_max_usd: "=deductible_reimbursement_max_usd"}
        GAP Waiver 140: {max_ltv_covered_pct: "=max_ltv_covered_pct", max_benefit_usd: "=max_benefit_usd", deductible_reimbursement_max_usd: "=deductible_reimbursement_max_usd"}
        GAP Waiver 150: {max_ltv_covered_pct: "=max_ltv_covered_pct", max_benefit_usd: "=max_benefit_usd", deductible_reimbursement_max_usd: "=deductible_reimbursement_max_usd"}
        GAP Waiver Plus 150: {max_ltv_covered_pct: "=max_ltv_covered_pct", max_benefit_usd: "=max_benefit_usd", deductible_reimbursement_max_usd: "=deductible_reimbursement_max_usd"}
        GAP Waiver Premier 150: {max_ltv_covered_pct: "=max_ltv_covered_pct", max_benefit_usd: "=max_benefit_usd", deductible_reimbursement_max_usd: "=deductible_reimbursement_max_usd"}
    formula:
      deductible_covered_usd: "min(primary_deductible_usd, deductible_reimbursement_max_usd)"
      balance_at_loss_usd: "gap_msr_scheduled_balance_at_loss"
      benefit_usd: "min(max_benefit_usd, max(round(balance_at_loss_usd - gap_msr_excess_ltv_amount - excluded_amounts_usd - primary_settlement_acv_usd + deductible_covered_usd, 2), 0))"
    measures: [gap_msr_scheduled_balance_at_loss, gap_msr_excess_ltv_amount]
  - id: gap_voluntary_cancellation
    subject: [gap_cancelled]
    rule: >-
      A borrower may cancel the addendum at any time while it is active; a voluntary cancellation (cancellation_reason borrower_voluntary) is processed only under a cancellation request that the borrower has signed (voluntary_cancel_signature_required).
      The cancellation request must be signed no later than voluntary_request_valid_days after the request was created.
      The signature period is counted in calendar days from the date part of created_at, and a signature on the last day is in time; an unsigned request lapses.
      The cancellation is effective on the date the signed request was received and its refund is issued within voluntary_cancel_processing_days; a request signed within free_look_days after the contract date receives the free-look refund.
      Cancelling the addendum never changes the contract's scheduled payment or term; the refund is credited as principal.
    eligibility:
      - id: voluntary_signed_request
        applies_to: [gap_cancelled]
        kind: authorization
        condition: "A borrower may cancel the addendum at any time while it is active; a voluntary cancellation (cancellation_reason borrower_voluntary) is processed only under a cancellation request that the borrower has signed (voluntary_cancel_signature_required)."
        evidence_fields: [gap_cancellation_requests.gap_request_id, gap_cancellation_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[gap_cancellation_requests.gap_request_id]]
          action_bindings: {gap_cancellation_requests.gap_request_id: gap_request_id}
      - id: voluntary_signed_in_time
        applies_to: [gap_cancelled]
        kind: time
        condition: "The cancellation request must be signed no later than voluntary_request_valid_days after the request was created."
        evidence_fields: [gap_cancellation_requests.created_at, gap_cancellation_requests.signed_at, gap_cancellation_requests.gap_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[gap_cancellation_requests.gap_request_id]]
          action_bindings: {gap_cancellation_requests.gap_request_id: gap_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the request was created"
          anchor_source: gap_cancellation_requests.created_at
          relation: not_after
          duration_source: variants.voluntary_request_valid_days
          unit: calendar_days
          counting_rule: "The signature period is counted in calendar days from the date part of created_at, and a signature on the last day is in time; an unsigned request lapses."
          boundary: inclusive
  - id: gap_company_cancellation
    subject: [gap_cancelled]
    rule: >-
      The company cancels an active addendum without a borrower request when the contract is paid off before maturity other than by a total-loss settlement (cancellation_reason early_payoff, when early_payoff_auto_cancel is true), when the repossessed vehicle is sold (repossession_sale, when repossession_sale_cancel is true) and when the contract is unwound (contract_unwound, when unwind_full_refund is true).
      The effective date follows cancellation_effective_date_basis for the reason, and the refund is issued within auto_cancel_processing_days after it.
      A reinstated contract keeps its addendum, since reinstatement is not a payoff or a sale.
    eligibility: []
  - id: gap_cancellation_refund
    subject: [gap_refund_issued]
    rule: >-
      A refund is issued only on an addendum whose status is cancelled.
      An addendum is refunded once.
      An unwound contract's addendum, and a voluntary cancellation whose signed request is received within free_look_days after the contract date, are refunded in full (refund_method full_free_look) with no cancellation fee.
      Every other cancellation is refunded pro rata by days (refund_method pro_rata_unearned): price_usd x gap_msr_unearned_ratio, rounded half-up to the cent, less cancellation_fee_usd, except that the fee is not deducted for an early_payoff cancellation where the plan's cancellation_fee_waived_on_payoff is true.
      A computed refund below min_refund_usd is not issued and the addendum stays cancelled with no refund row; an addendum that paid a benefit (no_refund_after_benefit) or expired (expiry_fully_earned) is fully earned and never refunded.
      The refund goes to the first applicable destination in refund_disposition_order: credited_to_contract_balance when the contract is active, repossessed or charged_off; credited_to_deficiency_balance when the contract is liquidated and its deficiency account is not closed; otherwise mailed_to_borrower by check.
    eligibility:
      - id: refund_on_cancelled_addendum
        applies_to: [gap_refund_issued]
        kind: state
        condition: "A refund is issued only on an addendum whose status is cancelled."
        evidence_fields: [gap_addenda.status, gap_addenda.gap_addendum_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[gap_addenda.gap_addendum_id]]
          action_bindings: {gap_addenda.gap_addendum_id: gap_addendum_id}
        state_contract:
          field: gap_addenda.status
          allowed: [cancelled]
      - id: one_refund_per_addendum
        applies_to: [gap_refund_issued]
        kind: dedup
        condition: "An addendum is refunded once."
        evidence_fields: [gap_activities.gap_addendum_id, gap_activities.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[gap_activities.gap_addendum_id]]
          action_bindings: {gap_activities.gap_addendum_id: gap_addendum_id}
        dedup_contract:
          table: gap_activities
          mode: separate_record
          object_bindings: {gap_addendum_id: gap_addendum_id}
          duplicate_filters: {event_type: [gap_refund_issued]}
          distinct_fields: []
    params:
      per_tier:
        GAP Waiver 120: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", cancellation_fee_waived_on_payoff: "=cancellation_fee_waived_on_payoff"}
        GAP Waiver 130: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", cancellation_fee_waived_on_payoff: "=cancellation_fee_waived_on_payoff"}
        GAP Waiver 140: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", cancellation_fee_waived_on_payoff: "=cancellation_fee_waived_on_payoff"}
        GAP Waiver 150: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", cancellation_fee_waived_on_payoff: "=cancellation_fee_waived_on_payoff"}
        GAP Waiver Plus 150: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", cancellation_fee_waived_on_payoff: "=cancellation_fee_waived_on_payoff"}
        GAP Waiver Premier 150: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", cancellation_fee_waived_on_payoff: "=cancellation_fee_waived_on_payoff"}
    formula:
      full_refund: "price_usd"
      prorated_refund: "round(price_usd * gap_msr_unearned_ratio, 2) - cancellation_fee_usd"
    measures: [gap_msr_unearned_ratio]
  - id: gap_expiry
    subject: [gap_expired]
    rule: >-
      An active addendum expires on its expiration_date, the contract's original maturity date, even when extensions have moved the contract's maturity later; from that day it covers no loss and is fully earned (expiry_fully_earned), so no refund is due.
      A contract that is still open after expiration simply has no GAP coverage for the remaining installments.
    eligibility: []

# ---- extended policies (this difficulty) ----
extended_policies:
- id: gap_ext_premier_deductible_reimbursement
  base_policy_refs:
  - gap_claim_benefit
  overwrite:
  - base_policy: gap_claim_benefit
    superseded_clause: '(deductible_reimbursement_basis: the primary deductible actually deducted, up to deductible_reimbursement_max_usd)'
    replaced_by: On a GAP Waiver Premier 150 claim the deductible covered is the Premier deductible reimbursement
      set here; on a claim on any other plan, the GAP Waiver Plus 150 included, it remains the primary deductible
      actually deducted, up to deductible_reimbursement_max_usd.
  trigger: on_request
  subject:
  - gap_claim_opened
  computes: deductible_covered_usd
  target_tool: claim_premier_deductible_reimbursement_7815b2b6
  params:
    theft_reimbursement_max_usd: 500.0
    comprehensive_reimbursement_max_usd: 250.0
  rule: >-
    This rule sets the Premier deductible reimbursement: the deductible covered that the claim worksheet records
    when the borrower claims the deductible reimbursement on the call, with the primary insurer's settlement documents,
    on a total-loss or theft claim on a GAP Waiver Premier 150 addendum; the claim is the latest claim reported
    on the addendum, and every other figure is read from the records of the addendum's own contract and of its insurance
    tracking record. The latest claim reported on the addendum is the claim with the latest reporting date, and
    where two claims were reported on that date the one recorded first on the addendum counts. The declarations
    the Premier deductible reimbursement reads are, as the standard, those on the latest proof the tracking record
    shows as accepted, and the declared deductible it takes from them is the lower of their comprehensive and collision
    deductibles. The Premier deductible reimbursement is the deductible the primary insurer actually deducted, as
    the claim's deductible withheld shows it, up to the reimbursement maximum and never more than the declared deductible
    when that is above 0.00, rounded half-up to the cent; with no declarations read it is the deductible withheld
    up to the reimbursement maximum, and a deductible the insurer did not withhold is never reimbursed. As the standard,
    the reimbursement maximum is the figure the Harborline GAP Waiver Premier 150 deductible reimbursement schedule
    sets for a comprehensive loss, 250.00 (comprehensive_reimbursement_max_usd). A proof names the insurer that
    settled the claim when the insurer it shows is the insurer the claim shows as the primary insurer, whatever
    the result of its review. The borrower maximum is the borrower maximum deductible (borrower_max_deductible_usd)
    of the collateral protection plan the tracking record carries, the most the contract lets the borrower's own
    policy carry. The declarations the Premier deductible reimbursement reads follow the insurer that settled the
    claim and how the latest proof naming that insurer was reviewed: when that proof was accepted, or was rejected
    only because its deductible was above what the contract allows (rejected_deductible_too_high), they are the
    declarations on that proof, which show the policy that paid and its deductibles; when it was rejected for any
    other reason, no declarations are read; otherwise, no proof naming that insurer being on record, they are those
    on the latest accepted proof. The latest proof naming an insurer, the latest accepted proof and the latest accepted
    proof of the policy on file are each the one with the latest review date, and where two were reviewed on that
    date the one recorded first counts. The declared deductible the Premier deductible reimbursement takes follows
    the coverage that paid the loss: for a collision total loss, the collision deductible; for a comprehensive total
    loss or an unrecovered theft, the comprehensive deductible; for a claim that shows no loss type, the lower of
    the two. How the borrower maximum bears on the Premier deductible reimbursement follows the deductible the insurer
    withheld and whether a proof on record names the insurer that settled the claim: when the withheld deductible
    is above the borrower maximum and such a proof is on record (the policy was put before the company), the reimbursement
    is never more than the borrower maximum; when the withheld deductible is above the borrower maximum and no proof
    on record names that insurer (a policy never put before the company), no deductible is reimbursed; otherwise
    the borrower maximum does not bound the reimbursement. The reimbursement maximum follows the Harborline GAP
    Waiver Premier 150 deductible reimbursement schedule for the loss the claim shows: for a collision total loss,
    the plan's deductible_reimbursement_max_usd; for an unrecovered theft, 500.00 (theft_reimbursement_max_usd);
    for a comprehensive total loss, or a claim that shows no loss type, 250.00 (comprehensive_reimbursement_max_usd).
    On a GAP Waiver Premier 150 claim the deductible covered is the Premier deductible reimbursement set here; on
    a claim on any other plan, the GAP Waiver Plus 150 included, it remains the primary deductible actually deducted,
    up to deductible_reimbursement_max_usd.
