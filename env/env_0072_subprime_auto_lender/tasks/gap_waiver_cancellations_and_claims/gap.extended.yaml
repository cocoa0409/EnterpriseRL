    ai_last_pay: 'The interest the starting balance carries from the account''s latest payment follows that payment
      and the rate cap: when the contract''s latest payment was posted on or before the date of loss and no Servicemembers
      Civil Relief Act rate cap took effect or ended after it and on or before the date of loss, it is the interest
      accrued from that payment to the date of loss at the rate in force on the date of loss (the cap''s rate while
      a cap is in effect, otherwise the original annual percentage rate); when the latest payment was posted on
      or before the date of loss and a cap took effect, ended, or both took effect and ended after it and on or
      before the date of loss, each calendar day from that payment to the date of loss accrues at the rate in force
      on it, which is the cap''s rate on the days from the cap''s effective date up to the day before its end took
      effect and the original annual percentage rate on every other day; otherwise none is carried. Interest accrues
      on the principal in place over that period, which is the principal balance the contract carries with every
      service-contract refund credited for the total loss added back (those credits post after the date of loss),
      at the rate divided by 100, times the calendar days, divided by 365, rounded half-up to the cent once at the
      end; the latest payment is the posted payment with the latest posting date.'
