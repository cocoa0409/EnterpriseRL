    result: The starting balance is that scheduled principal, never below 0.00, with every force-placed premium
      the contract's insurance tracking record added to the contract balance added to it (the signed schedule leaves
      them out), rounded half-up to the cent; no interest after the last counted due date is added to it.
    pp_added: The starting balance is that scheduled principal, never below 0.00, with every force-placed premium
      the contract's insurance tracking record added to the contract balance added to it (the signed schedule leaves
      them out), rounded half-up to the cent; no interest after the last counted due date is added to it.
    pp_refunded: 'The force-placed premiums the starting balance carries follow how the placement ended: when refunds
      of those premiums were credited back to the contract balance, they are the premiums added less the refunds
      credited; when no refund has been credited and the latest accepted proof of insurance was reviewed on or after
      the billing date of the latest premium added and its policy effective date falls within that premium''s billing
      period, they are the premiums added less that latest premium''s share for the days of its billing period from
      the proof''s policy effective date on (the premium times those days divided by the days of its billing period,
      both counted inclusive, rounded half-up to the cent), the refund the collateral protection terms leave due;
      otherwise they are every premium added. The latest premium added is the force-placed premium whose billing
      period starts latest, and the latest accepted proof is the one with the latest review date, the one recorded
      first counting where two share that date.'
