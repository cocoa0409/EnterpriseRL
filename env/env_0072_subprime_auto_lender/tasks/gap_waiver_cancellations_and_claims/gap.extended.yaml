- id: gap_ext_claim_starting_balance
  base_policy_refs:
  - gap_claim_benefit
  - gap_agg_contract_portfolio
  overwrite:
  - base_policy: gap_claim_benefit
    superseded_clause: the benefit is the scheduled balance on the date of loss (benefit_balance_basis, gap_msr_scheduled_balance_at_loss)
    replaced_by: 'The force-placed premiums the starting balance carries follow how the placement ended: when refunds
      of those premiums were credited back to the contract balance, they are the premiums added less the refunds
      credited; when no refund has been credited and the latest accepted proof of insurance was reviewed on or after
      the billing date of the latest premium added and its policy effective date falls within that premium''s billing
      period, they are the premiums added less that latest premium''s share for the days of its billing period from
      the proof''s policy effective date on (the premium times those days divided by the days of its billing period,
      both counted inclusive, rounded half-up to the cent), the refund the collateral protection terms leave due;
      otherwise they are every premium added. The latest premium added is the force-placed premium whose billing
      period starts latest, and the latest accepted proof is the one with the latest review date, the one recorded
      first counting where two share that date. The interest the starting balance carries from the account''s latest
      payment follows that payment and the rate cap: when the contract''s latest payment was posted on or before
      the date of loss and no Servicemembers Civil Relief Act rate cap took effect or ended after it and on or before
      the date of loss, it is the interest accrued from that payment to the date of loss at the rate in force on
      the date of loss (the cap''s rate while a cap is in effect, otherwise the original annual percentage rate);
      when the latest payment was posted on or before the date of loss and a cap took effect, ended, or both took
      effect and ended after it and on or before the date of loss, each calendar day from that payment to the date
      of loss accrues at the rate in force on it, which is the cap''s rate on the days from the cap''s effective
      date up to the day before its end took effect and the original annual percentage rate on every other day;
      otherwise none is carried. Interest accrues on the principal in place over that period, which is the principal
      balance the contract carries with every service-contract refund credited for the total loss added back (those
      credits post after the date of loss), at the rate divided by 100, times the calendar days, divided by 365,
      rounded half-up to the cent once at the end; the latest payment is the posted payment with the latest posting
      date. On a Premier worksheet claim the balance the benefit starts from is the Premier starting balance set
      here, with the force-placed premiums and the interest from the account''s latest payment it carries, and no
      other interest accrued after the last counted due date; on a GAP Waiver Plus 150 claim it is the Plus starting
      balance, and on a claim on any other plan the benefit still starts from the scheduled balance on the date
      of loss with interest accrued to the date of loss on that balance.'
  trigger: on_request
  subject:
  - gap_claim_opened
  computes: balance_at_loss_usd
  target_tool: record_claim_balance_at_loss_15fb7d99
  params:
    fp_long_days: 20
    fp_long_period: 50
    fp_month_days: 30
    fp_min_period: 32
    ad_cap_days: 15
  rule: >-
    This rule sets the Premier starting balance: the starting balance that the claim worksheet records for a total-loss
    or theft claim on a GAP Waiver Premier 150 addendum (a Premier worksheet claim): the claim is the latest claim
    reported on the addendum, and every figure is read from that claim and from the records of the addendum's own
    contract. The latest claim reported on the addendum is the claim with the latest reporting date, and where two
    claims were reported on that date the one recorded first on the addendum counts. The latest due-date change,
    the latest cap-applied record and the latest cap-ended record the contract records are each the record of its
    kind with the latest effective date, and where two records of one kind share that date the one recorded first
    counts. A starting balance is set only for a reported claim: with no claim reported on the addendum the starting
    balance is 0.00. The starting balance is figured on the contract's signed terms: the monthly rate is the contract's
    original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
    monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term in
    months, rounded half-up to the cent. Whole months from one date to a later one are the difference in calendar
    months between them, less one when the later date's day of the month is below the earlier date's. The installments
    the starting balance counts are the due dates from the first payment date through the date of loss, one a month
    on the first payment date's day with a due date on the date of loss counted: the whole months from the first
    payment date to the date of loss, plus one, and none when the loss came before the first payment date. The scheduled
    principal is the opening principal, which is the amount financed, times the monthly rate plus one raised to
    the power of the installments counted, less the level installment times that power less one, divided by the
    monthly rate. The starting balance is that scheduled principal, never below 0.00, with every force-placed premium
    the contract's insurance tracking record added to the contract balance added to it (the signed schedule leaves
    them out), rounded half-up to the cent; no interest after the last counted due date is added to it. The first-period
    days the starting balance capitalizes follow the days from the contract date to the first payment date: when
    that first period runs more than 50 days, 20 days are capitalized; when it runs 32 to 50 days, the days beyond
    30 are capitalized; when it runs 31 days or fewer, none are; the first-period days capitalized add to the opening
    principal the amount financed times the original annual percentage rate divided by 100, times those days, divided
    by 365, rounded half-up to the cent. The days a due-date change added that the starting balance capitalizes
    follow the latest due-date change the contract records: when it took effect on or before the date of loss and
    moved the next due date later by more than 15 days, 15 days are capitalized; when it took effect on or before
    the date of loss and moved the next due date later by 1 to 15 days, those days are capitalized; otherwise none
    are; the added days capitalized add to the opening principal the amount financed times the original annual percentage
    rate divided by 100, times those days, divided by 365, rounded half-up to the cent. The installments the starting
    balance counts follow the latest due-date change the contract records: when that change took effect on or before
    the date of loss and its new next due date is on or before the date of loss, they are the whole months from
    the first payment date to the change's old next due date, plus the whole months from its new next due date to
    the date of loss, plus one; when that change took effect on or before the date of loss and its new next due
    date is after the date of loss, they are the whole months from the first payment date to the change's old next
    due date; when the contract records no due-date change, or its latest one took effect after the date of loss,
    they are counted on the first payment date's day as above. The capped-rate adjustment to the starting balance
    follows the Servicemembers Civil Relief Act rate cap the contract records, read from its latest cap-applied
    record (effective date, rate and installment) and its latest cap-ended record (effective date and restored installment):
    when a cap took effect on or before the date of loss and had not ended by it, the adjustment is the principal
    a two-stage schedule leaves less the principal the signed schedule leaves, the first stage running at the original
    rate and level installment over the installments falling due on or before the cap's effective date and the second
    at the cap's rate and installment; when a cap took effect and ended on or before the date of loss, the adjustment
    is the principal a three-stage schedule leaves less that same signed-schedule principal, the third stage running
    at the original rate with the restored installment over the installments falling due after the cap's end date;
    otherwise there is no adjustment; the adjustment is added to the scheduled principal before the starting balance
    is rounded. For the capped-rate adjustment, the signed schedule and the first stage both start from the amount
    financed (not from the opening principal) and both run over the installments counted on the first payment date's
    day; each later stage carries forward the principal the stage before it left, by the same amortization formula
    at the stage's own monthly rate (its annual rate divided by 1,200), installment and number of installments,
    the installments of a stage never running past those installments counted on the first payment date's day. The
    force-placed premiums the starting balance carries follow how the placement ended: when refunds of those premiums
    were credited back to the contract balance, they are the premiums added less the refunds credited; when no refund
    has been credited and the latest accepted proof of insurance was reviewed on or after the billing date of the
    latest premium added and its policy effective date falls within that premium's billing period, they are the
    premiums added less that latest premium's share for the days of its billing period from the proof's policy effective
    date on (the premium times those days divided by the days of its billing period, both counted inclusive, rounded
    half-up to the cent), the refund the collateral protection terms leave due; otherwise they are every premium
    added. The latest premium added is the force-placed premium whose billing period starts latest, and the latest
    accepted proof is the one with the latest review date, the one recorded first counting where two share that
    date. The interest the starting balance carries from the account's latest payment follows that payment and the
    rate cap: when the contract's latest payment was posted on or before the date of loss and no Servicemembers
    Civil Relief Act rate cap took effect or ended after it and on or before the date of loss, it is the interest
    accrued from that payment to the date of loss at the rate in force on the date of loss (the cap's rate while
    a cap is in effect, otherwise the original annual percentage rate); when the latest payment was posted on or
    before the date of loss and a cap took effect, ended, or both took effect and ended after it and on or before
    the date of loss, each calendar day from that payment to the date of loss accrues at the rate in force on it,
    which is the cap's rate on the days from the cap's effective date up to the day before its end took effect and
    the original annual percentage rate on every other day; otherwise none is carried. Interest accrues on the principal
    in place over that period, which is the principal balance the contract carries with every service-contract refund
    credited for the total loss added back (those credits post after the date of loss), at the rate divided by 100,
    times the calendar days, divided by 365, rounded half-up to the cent once at the end; the latest payment is
    the posted payment with the latest posting date. On a Premier worksheet claim the balance the benefit starts
    from is the Premier starting balance set here, with the force-placed premiums and the interest from the account's
    latest payment it carries, and no other interest accrued after the last counted due date; on a GAP Waiver Plus
    150 claim it is the Plus starting balance, and on a claim on any other plan the benefit still starts from the
    scheduled balance on the date of loss with interest accrued to the date of loss on that balance.
  prerequisite: []
  cross_category:
  - category: contract
    as: history
    reads:
    - amount_financed_usd
    - original_apr_pct
    - term_months
    - first_payment_date
    - contract_date
    - contract_servicing_events.effective_date
    - contract_servicing_events.old_next_due_date
    - contract_servicing_events.new_next_due_date
    - contract_servicing_events.new_apr_pct
    - contract_servicing_events.new_scheduled_payment_usd
    - principal_balance_usd
    - contract_transactions.txn_date
    - contract_transactions.amount_usd
    - contract_transactions.ancillary_source
    note: Signed terms from the contract holding; the installments counted, the added days and the capped-rate adjustment
      are decided from the contract servicing ledger.
  - category: cpi
    as: history
    reads:
    - cpi_activities.amount_usd
    - cpi_activities.billing_method
    - cpi_activities.refund_disposition
    - cpi_activities.billing_period_start
    - cpi_activities.billing_period_end
    - cpi_activities.activity_date
    - cpi_activities.policy_effective_date
    - cpi_activities.proof_result
    note: The force-placed premiums added to the contract balance and their refunds.
  - category: vsc
    as: history
    reads:
    - cancellation_reason
    note: A service contract cancelled for the total loss marks its refund credit as posted after the loss.
  compute:
  - bl_loss: LATEST('gap_activities','loss_date', date_field='activity_date', event_type='gap_claim_filed')
  - bl_af: CFIELD('contract','amount_financed_usd', contract_id=F('contract_id'))
  - bl_apr: CFIELD('contract','original_apr_pct', contract_id=F('contract_id'))
  - bl_term: CFIELD('contract','term_months', contract_id=F('contract_id'))
  - bl_first_due: CFIELD('contract','first_payment_date', contract_id=F('contract_id'))
  - bl_rate: bl_apr / 1200
  - bl_level_pmt: RND(bl_af * bl_rate / (1 - (1 + bl_rate) ** (-bl_term)), 2)
  - bl_std_count: (MONTHS(bl_first_due, bl_loss) + 1) if bl_first_due <= bl_loss else 0
  - fp_period_days: DAYS(CFIELD('contract','contract_date', contract_id=F('contract_id')), CFIELD('contract','first_payment_date',
      contract_id=F('contract_id')))
  - fp_days: K('fp_long_days') if fp_period_days > K('fp_long_period') else ((fp_period_days - K('fp_month_days'))
      if fp_period_days >= K('fp_min_period') else 0)
  - fp_interest: RND(bl_af * bl_apr / 100 * fp_days / 365, 2)
  - ad_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_due_date_changed',
      contract_id=F('contract_id'))
  - ad_old: XLATEST('contract','contract_servicing_events','old_next_due_date', date_field='effective_date', event_type='contract_due_date_changed',
      contract_id=F('contract_id'))
  - ad_new: XLATEST('contract','contract_servicing_events','new_next_due_date', date_field='effective_date', event_type='contract_due_date_changed',
      contract_id=F('contract_id'))
  - ad_moved: DAYS(ad_old, ad_new) if (ad_date != None and ad_date <= bl_loss) else 0
  - ad_days: K('ad_cap_days') if ad_moved > K('ad_cap_days') else (ad_moved if ad_moved >= 1 else 0)
  - ad_interest: RND(bl_af * bl_apr / 100 * ad_days / 365, 2)
  - dc_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_due_date_changed',
      contract_id=F('contract_id'))
  - dc_old_next: XLATEST('contract','contract_servicing_events','old_next_due_date', date_field='effective_date',
      event_type='contract_due_date_changed', contract_id=F('contract_id'))
  - dc_new_next: XLATEST('contract','contract_servicing_events','new_next_due_date', date_field='effective_date',
      event_type='contract_due_date_changed', contract_id=F('contract_id'))
  - dc_count: (MONTHS(bl_first_due, dc_old_next) + MONTHS(dc_new_next, bl_loss) + 1) if (dc_date != None and dc_date
      <= bl_loss and dc_new_next <= bl_loss) else (MONTHS(bl_first_due, dc_old_next) if (dc_date != None and dc_date
      <= bl_loss) else bl_std_count)
  - sc_cap_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - sc_cap_apr: XLATEST('contract','contract_servicing_events','new_apr_pct', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - sc_cap_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - sc_end_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - sc_end_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - sc_live: sc_cap_date != None and sc_cap_date <= bl_loss and (sc_end_date == None or sc_end_date > bl_loss)
  - sc_closed: sc_cap_date != None and sc_cap_date <= bl_loss and sc_end_date != None and sc_end_date <= bl_loss
  - sc_n1: MN(bl_std_count, (MONTHS(bl_first_due, sc_cap_date) + 1) if (sc_cap_date != None and bl_first_due <=
      sc_cap_date) else 0)
  - sc_n2: MN(bl_std_count, (MONTHS(bl_first_due, sc_end_date) + 1) if (sc_end_date != None and bl_first_due <=
      sc_end_date) else 0)
  - sc_signed_bal: bl_af * (1 + bl_rate) ** bl_std_count - bl_level_pmt * ((1 + bl_rate) ** bl_std_count - 1) /
      bl_rate
  - sc_stage1: bl_af * (1 + bl_rate) ** sc_n1 - bl_level_pmt * ((1 + bl_rate) ** sc_n1 - 1) / bl_rate
  - sc_crate: (sc_cap_apr / 1200) if sc_cap_apr != None else bl_rate
  - sc_k2: MX(0, (sc_n2 if sc_closed else bl_std_count) - sc_n1) if sc_cap_date != None else 0
  - sc_stage2: sc_stage1 * (1 + sc_crate) ** sc_k2 - (sc_cap_pmt if sc_cap_pmt != None else 0) * ((1 + sc_crate)
      ** sc_k2 - 1) / sc_crate
  - sc_k3: MX(0, bl_std_count - sc_n2) if sc_closed else 0
  - sc_stage3: sc_stage2 * (1 + bl_rate) ** sc_k3 - (sc_end_pmt if sc_end_pmt != None else 0) * ((1 + bl_rate) **
      sc_k3 - 1) / bl_rate
  - sc_adjust: (sc_stage2 - sc_signed_bal) if sc_live else ((sc_stage3 - sc_signed_bal) if sc_closed else 0)
  - bl_open: bl_af + fp_interest + ad_interest
  - bl_sched: bl_open * (1 + bl_rate) ** dc_count - bl_level_pmt * ((1 + bl_rate) ** dc_count - 1) / bl_rate
  - pp_added: XSUM('cpi','cpi_activities','amount_usd', event_type='cpi_premium_charged', billing_method='added_to_contract_balance',
      contract_id=F('contract_id'))
  - pp_refunded: XSUM('cpi','cpi_activities','amount_usd', event_type='cpi_premium_refunded', refund_disposition='credited_to_contract_balance',
      contract_id=F('contract_id'))
  - pp_last_bill: XLATEST('cpi','cpi_activities','activity_date', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - pp_last_amt: XLATEST('cpi','cpi_activities','amount_usd', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - pp_last_start: XLATEST('cpi','cpi_activities','billing_period_start', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - pp_last_end: XLATEST('cpi','cpi_activities','billing_period_end', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - pp_proof_rev: XLATEST('cpi','cpi_activities','activity_date', date_field='activity_date', event_type='cpi_proof_verified',
      proof_result='accepted', contract_id=F('contract_id'))
  - pp_proof_eff: XLATEST('cpi','cpi_activities','policy_effective_date', date_field='activity_date', event_type='cpi_proof_verified',
      proof_result='accepted', contract_id=F('contract_id'))
  - pp_amount: MX(0, pp_added - pp_refunded) if pp_refunded > 0 else ((pp_added - RND(pp_last_amt * (DAYS(pp_proof_eff,
      pp_last_end) + 1) / (DAYS(pp_last_start, pp_last_end) + 1), 2)) if (pp_last_bill != None and pp_proof_rev
      != None and pp_proof_rev >= pp_last_bill and pp_proof_eff >= pp_last_start and pp_proof_eff <= pp_last_end)
      else pp_added)
  - ai_last_pay: XLATEST('contract','contract_transactions','txn_date', date_field='txn_date', event_type='contract_payment_posted',
      contract_id=F('contract_id'))
  - ai_principal: CFIELD('contract','principal_balance_usd', contract_id=F('contract_id')) + (XSUM('contract','contract_transactions','amount_usd',
      event_type='contract_ancillary_credit', ancillary_source='vsc_refund', contract_id=F('contract_id')) if CFIELD('vsc','cancellation_reason',
      contract_id=F('contract_id')) == 'total_loss' else 0)
  - ai_on: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ai_off: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - ai_cap: XLATEST('contract','contract_servicing_events','new_apr_pct', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ai_live_loss: ai_on != None and ai_on <= bl_loss and (ai_off == None or ai_off > bl_loss or ai_off < ai_on)
  - ai_chg: ai_on if (ai_on != None and ai_last_pay != None and ai_on > ai_last_pay and ai_on <= bl_loss) else (ai_off
      if (ai_off != None and ai_last_pay != None and ai_off > ai_last_pay and ai_off <= bl_loss) else None)
  - ai_rate_loss: ai_cap if ai_live_loss else bl_apr
  - ai_cap_from: MX(ai_last_pay, ai_on) if (ai_on != None and ai_last_pay != None) else None
  - ai_cap_to: ai_off if (ai_off != None and ai_on != None and ai_off >= ai_on and ai_off < bl_loss) else bl_loss
  - ai_cap_days: MX(0, DAYS(ai_cap_from, ai_cap_to)) if (ai_cap_from != None and ai_on <= bl_loss and ai_cap_from
      < ai_cap_to) else 0
  - ai_amount: RND(ai_principal * (ai_cap * ai_cap_days + bl_apr * (DAYS(ai_last_pay, bl_loss) - ai_cap_days)) /
      100 / 365, 2) if (ai_last_pay != None and ai_last_pay <= bl_loss and ai_chg != None) else (RND(ai_principal
      * ai_rate_loss / 100 * DAYS(ai_last_pay, bl_loss) / 365, 2) if (ai_last_pay != None and ai_last_pay <= bl_loss)
      else 0)
  - bl_total: bl_sched + sc_adjust + pp_amount + ai_amount
  - bl_claims: COUNT('gap_activities', event_type='gap_claim_filed')
  - result: RND(MX(0, bl_total), 2) if bl_claims >= 1 else 0
  compute_basis:
    bl_loss: The latest claim reported on the addendum is the claim with the latest reporting date, and where two
      claims were reported on that date the one recorded first on the addendum counts.
    bl_af: 'The starting balance is figured on the contract''s signed terms: the monthly rate is the contract''s
      original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
      monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term
      in months, rounded half-up to the cent.'
    bl_apr: 'The starting balance is figured on the contract''s signed terms: the monthly rate is the contract''s
      original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
      monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term
      in months, rounded half-up to the cent.'
    bl_term: 'The starting balance is figured on the contract''s signed terms: the monthly rate is the contract''s
      original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
      monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term
      in months, rounded half-up to the cent.'
    bl_rate: 'The starting balance is figured on the contract''s signed terms: the monthly rate is the contract''s
      original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
      monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term
      in months, rounded half-up to the cent.'
    bl_level_pmt: 'The starting balance is figured on the contract''s signed terms: the monthly rate is the contract''s
      original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
      monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term
      in months, rounded half-up to the cent.'
    bl_first_due: 'The installments the starting balance counts are the due dates from the first payment date through
      the date of loss, one a month on the first payment date''s day with a due date on the date of loss counted:
      the whole months from the first payment date to the date of loss, plus one, and none when the loss came before
      the first payment date.'
    bl_std_count: 'The installments the starting balance counts are the due dates from the first payment date through
      the date of loss, one a month on the first payment date''s day with a due date on the date of loss counted:
      the whole months from the first payment date to the date of loss, plus one, and none when the loss came before
      the first payment date.'
    fp_period_days: 'The first-period days the starting balance capitalizes follow the days from the contract date
      to the first payment date: when that first period runs more than 50 days, 20 days are capitalized; when it
      runs 32 to 50 days, the days beyond 30 are capitalized; when it runs 31 days or fewer, none are; the first-period
      days capitalized add to the opening principal the amount financed times the original annual percentage rate
      divided by 100, times those days, divided by 365, rounded half-up to the cent.'
    fp_days: 'The first-period days the starting balance capitalizes follow the days from the contract date to the
      first payment date: when that first period runs more than 50 days, 20 days are capitalized; when it runs 32
      to 50 days, the days beyond 30 are capitalized; when it runs 31 days or fewer, none are; the first-period
      days capitalized add to the opening principal the amount financed times the original annual percentage rate
      divided by 100, times those days, divided by 365, rounded half-up to the cent.'
    fp_interest: 'The first-period days the starting balance capitalizes follow the days from the contract date
      to the first payment date: when that first period runs more than 50 days, 20 days are capitalized; when it
      runs 32 to 50 days, the days beyond 30 are capitalized; when it runs 31 days or fewer, none are; the first-period
      days capitalized add to the opening principal the amount financed times the original annual percentage rate
      divided by 100, times those days, divided by 365, rounded half-up to the cent.'
    ad_date: 'The days a due-date change added that the starting balance capitalizes follow the latest due-date
      change the contract records: when it took effect on or before the date of loss and moved the next due date
      later by more than 15 days, 15 days are capitalized; when it took effect on or before the date of loss and
      moved the next due date later by 1 to 15 days, those days are capitalized; otherwise none are; the added days
      capitalized add to the opening principal the amount financed times the original annual percentage rate divided
      by 100, times those days, divided by 365, rounded half-up to the cent.'
    ad_old: 'The days a due-date change added that the starting balance capitalizes follow the latest due-date change
      the contract records: when it took effect on or before the date of loss and moved the next due date later
      by more than 15 days, 15 days are capitalized; when it took effect on or before the date of loss and moved
      the next due date later by 1 to 15 days, those days are capitalized; otherwise none are; the added days capitalized
      add to the opening principal the amount financed times the original annual percentage rate divided by 100,
      times those days, divided by 365, rounded half-up to the cent.'
    ad_new: 'The days a due-date change added that the starting balance capitalizes follow the latest due-date change
      the contract records: when it took effect on or before the date of loss and moved the next due date later
      by more than 15 days, 15 days are capitalized; when it took effect on or before the date of loss and moved
      the next due date later by 1 to 15 days, those days are capitalized; otherwise none are; the added days capitalized
      add to the opening principal the amount financed times the original annual percentage rate divided by 100,
      times those days, divided by 365, rounded half-up to the cent.'
    ad_moved: 'The days a due-date change added that the starting balance capitalizes follow the latest due-date
      change the contract records: when it took effect on or before the date of loss and moved the next due date
      later by more than 15 days, 15 days are capitalized; when it took effect on or before the date of loss and
      moved the next due date later by 1 to 15 days, those days are capitalized; otherwise none are; the added days
      capitalized add to the opening principal the amount financed times the original annual percentage rate divided
      by 100, times those days, divided by 365, rounded half-up to the cent.'
    ad_days: 'The days a due-date change added that the starting balance capitalizes follow the latest due-date
      change the contract records: when it took effect on or before the date of loss and moved the next due date
      later by more than 15 days, 15 days are capitalized; when it took effect on or before the date of loss and
      moved the next due date later by 1 to 15 days, those days are capitalized; otherwise none are; the added days
      capitalized add to the opening principal the amount financed times the original annual percentage rate divided
      by 100, times those days, divided by 365, rounded half-up to the cent.'
    ad_interest: 'The days a due-date change added that the starting balance capitalizes follow the latest due-date
      change the contract records: when it took effect on or before the date of loss and moved the next due date
      later by more than 15 days, 15 days are capitalized; when it took effect on or before the date of loss and
      moved the next due date later by 1 to 15 days, those days are capitalized; otherwise none are; the added days
      capitalized add to the opening principal the amount financed times the original annual percentage rate divided
      by 100, times those days, divided by 365, rounded half-up to the cent.'
    dc_date: 'The installments the starting balance counts follow the latest due-date change the contract records:
      when that change took effect on or before the date of loss and its new next due date is on or before the date
      of loss, they are the whole months from the first payment date to the change''s old next due date, plus the
      whole months from its new next due date to the date of loss, plus one; when that change took effect on or
      before the date of loss and its new next due date is after the date of loss, they are the whole months from
      the first payment date to the change''s old next due date; when the contract records no due-date change, or
      its latest one took effect after the date of loss, they are counted on the first payment date''s day as above.'
    dc_old_next: 'The installments the starting balance counts follow the latest due-date change the contract records:
      when that change took effect on or before the date of loss and its new next due date is on or before the date
      of loss, they are the whole months from the first payment date to the change''s old next due date, plus the
      whole months from its new next due date to the date of loss, plus one; when that change took effect on or
      before the date of loss and its new next due date is after the date of loss, they are the whole months from
      the first payment date to the change''s old next due date; when the contract records no due-date change, or
      its latest one took effect after the date of loss, they are counted on the first payment date''s day as above.'
    dc_new_next: 'The installments the starting balance counts follow the latest due-date change the contract records:
      when that change took effect on or before the date of loss and its new next due date is on or before the date
      of loss, they are the whole months from the first payment date to the change''s old next due date, plus the
      whole months from its new next due date to the date of loss, plus one; when that change took effect on or
      before the date of loss and its new next due date is after the date of loss, they are the whole months from
      the first payment date to the change''s old next due date; when the contract records no due-date change, or
      its latest one took effect after the date of loss, they are counted on the first payment date''s day as above.'
    dc_count: 'The installments the starting balance counts follow the latest due-date change the contract records:
      when that change took effect on or before the date of loss and its new next due date is on or before the date
      of loss, they are the whole months from the first payment date to the change''s old next due date, plus the
      whole months from its new next due date to the date of loss, plus one; when that change took effect on or
      before the date of loss and its new next due date is after the date of loss, they are the whole months from
      the first payment date to the change''s old next due date; when the contract records no due-date change, or
      its latest one took effect after the date of loss, they are counted on the first payment date''s day as above.'
    sc_cap_date: 'The capped-rate adjustment to the starting balance follows the Servicemembers Civil Relief Act
      rate cap the contract records, read from its latest cap-applied record (effective date, rate and installment)
      and its latest cap-ended record (effective date and restored installment): when a cap took effect on or before
      the date of loss and had not ended by it, the adjustment is the principal a two-stage schedule leaves less
      the principal the signed schedule leaves, the first stage running at the original rate and level installment
      over the installments falling due on or before the cap''s effective date and the second at the cap''s rate
      and installment; when a cap took effect and ended on or before the date of loss, the adjustment is the principal
      a three-stage schedule leaves less that same signed-schedule principal, the third stage running at the original
      rate with the restored installment over the installments falling due after the cap''s end date; otherwise
      there is no adjustment; the adjustment is added to the scheduled principal before the starting balance is
      rounded.'
    sc_cap_apr: 'The capped-rate adjustment to the starting balance follows the Servicemembers Civil Relief Act
      rate cap the contract records, read from its latest cap-applied record (effective date, rate and installment)
      and its latest cap-ended record (effective date and restored installment): when a cap took effect on or before
      the date of loss and had not ended by it, the adjustment is the principal a two-stage schedule leaves less
      the principal the signed schedule leaves, the first stage running at the original rate and level installment
      over the installments falling due on or before the cap''s effective date and the second at the cap''s rate
      and installment; when a cap took effect and ended on or before the date of loss, the adjustment is the principal
      a three-stage schedule leaves less that same signed-schedule principal, the third stage running at the original
      rate with the restored installment over the installments falling due after the cap''s end date; otherwise
