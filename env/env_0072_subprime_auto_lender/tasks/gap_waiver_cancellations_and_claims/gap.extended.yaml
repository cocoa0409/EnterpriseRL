    bindings:
    - pd_put_n
    - pd_shape
    - pd_m_cap
    ladder:
    - when: withheld deductible above the borrower maximum and a proof names the settling insurer
      method: never more than the borrower maximum (cap)
    - when: withheld deductible above the borrower maximum and no proof names the settling insurer
      method: nothing reimbursed (void)
    - when: otherwise
      method: the borrower maximum does not bound it
    baseline:
      pd_shape: '''none'''
    evidence:
    - history
    - cross_category
    cross_difficulty: cpi
