  factors:
  - id: eu_past_due_count
    effect: parameter
    decides: eu_pd_count
    bindings:
    - eu_late_days
    - eu_pd_count
    ladder:
    - when: one installment treated as past due, due no more than 20 days
      value: none counted
    - when: two installments, the oldest due no more than 60 days
      value: one counted
    - when: otherwise
      value: all counted
    baseline:
      eu_pd_count: eu_unpaid
    evidence:
    - date
    - cross_category
    cross_difficulty: contract
  - id: eu_past_due_installment
    effect: parameter
    decides: eu_pd_inst
    bindings:
    - eu_pcap_date
    - eu_pcap_pmt
    - eu_pend_date
    - eu_pend_pmt
    - eu_pcap_n
    - eu_pd_inst
    ladder:
    - when: a cap in effect on the next due date had not ended by the date of loss
      value: the installment the cap set
    - when: a cap in effect on the next due date ended on or before the date of loss
      value: the average of cap and restored installments over the past-due installments
    - when: otherwise
      value: the scheduled payment
    baseline:
      eu_pd_inst: eu_pmt
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: eu_deferral_count
    effect: parameter
    decides: eu_df_count
    bindings:
    - eu_df_months
    - eu_df_count
    ladder:
    - when: one deferred installment in total
      value: none counted
    - when: exactly two
      value: one counted
    - when: otherwise
      value: all counted
    baseline:
      eu_df_count: eu_df_months
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: eu_deferral_installment
    effect: parameter
    decides: eu_df_inst
    bindings:
    - eu_ext_date
    - eu_dcap_date
    - eu_dcap_pmt
    - eu_dend_date
    - eu_d_rate
    - eu_d_level
    - eu_df_inst
    ladder:
    - when: a cap was in effect on the latest extension's effective date
      value: the installment the cap set
    - when: the latest extension took effect before a cap that has not ended
      value: the level installment of the signed terms
    - when: otherwise
      value: the scheduled payment
    baseline:
      eu_df_inst: eu_pmt
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: eu_placed_premium_basis
    effect: method
    decides: eu_premium
    bindings:
    - eu_prem_refunded
    - eu_last_bill
    - eu_last_amt
    - eu_last_start
    - eu_last_end
    - eu_proof_rev
    - eu_proof_eff
    - eu_pending
    - eu_premium
    ladder:
    - when: refunds of those premiums were credited back to the contract balance
      method: premiums added less refunds credited
    - when: no refund credited, and an accepted proof reviewed on or after the latest premium's billing date took
        effect within that premium's billing period
      method: premiums added less the latest premium's share for its days from the proof's coverage start
    - when: otherwise
      method: every premium added
    baseline:
      eu_premium: eu_prem_added
    evidence:
    - history
    - cross_category
    cross_difficulty: cpi
  - id: eu_addon_basis
    effect: method
    decides: eu_addon
    bindings:
    - eu_vsc_status
    - eu_vsc_reason
    - eu_vsc_cdate
    - eu_vsc_codo
    - eu_vsc_sodo
    - eu_vsc_eodo
    - eu_vsc_fee
    - eu_vsc_min
    - eu_vsc_refunds
    - eu_vsc_issued
    - eu_vsc_claims
    - eu_vsc_formula
    - eu_vsc_own
    - eu_addon
    ladder:
    - when: the service contract was cancelled for the total loss
      method: its refund under its own terms (issued, or its own formula while none is issued)
    - when: it was cancelled for another reason with an effective date before the date of loss
      method: nothing
    - when: otherwise
      method: the day-prorated price
    baseline:
      eu_addon: eu_vsc_estimate
    evidence:
    - history
    - cross_category
    cross_difficulty: vsc
  baseline:
    rule: 'The Plus worksheet benefit is the starting balance the claim shows, less the loan-to-value excess, less
      the Plus excluded total, less the primary insurer''s net settlement, never below 0.00 and never above the
      plan''s max_benefit_usd, rounded half-up to the cent. The loan-to-value excess is the amount by which the
      contract''s amount financed exceeds the plan''s max_ltv_covered_pct of the vehicle''s book value at origination,
      times the starting balance the claim shows divided by the amount financed; it is 0.00 when the amount financed
      is within that limit. On a Plus worksheet claim the benefit is reduced by the loan-to-value excess set here,
      figured on the starting balance the claim shows, in place of the portion above max_ltv_covered_pct; a GAP
      Waiver Premier 150 claim is reduced by the Premier worksheet benefit''s own loan-to-value excess, and a claim
      on any other plan is still reduced by the portion above max_ltv_covered_pct, amortized in the same proportion
      as the scheduled balance. The primary insurer''s net settlement is the actual cash value the claim shows less
      the primary deductible the claim shows. The Plus excluded total is the sum of six parts, added without rounding
      and then rounded half-up to the cent: the past-due part, the fee part, the deferral part, the placed-premium
      part, the add-on part and the uncovered-deductible part. Whole months from one date to a later one are the
      difference in calendar months between them, less one when the later date''s day of the month is below the
      earlier date''s. The installments the Plus excluded total treats as past due are the installments still unpaid
      that fell due on or before the date of loss, counted from the contract''s next due date one a month through
      the date of loss: the whole months from the next due date to the date of loss, plus one, and none when the
      next due date is after the date of loss. The past-due part of the Plus excluded total is the installments
      it counts, which are all the installments treated as past due, times the installment amount it uses, which
      is the contract''s scheduled payment, less the partial installment credit the contract carries, never below
      0.00. The fee part of the Plus excluded total is the fees due the contract carries less the late charges assessed
      on installments that fell due after the date of loss, never below 0.00; the installments that fell due after
      the date of loss are those whose due date is fewer whole months before today than the whole months from the
      contract''s next due date to today less the whole months from the next due date to the date of loss. The deferral
      part of the Plus excluded total is the deferred installments it counts, which are all the installments deferred
      by every extension the contract records, times the installment amount it uses, which is the contract''s scheduled
      payment. The placed-premium part of the Plus excluded total is every force-placed premium the insurance tracking
      record added to the contract balance. The add-on part of the Plus excluded total is the price of the service
      contract financed on the contract times the calendar days from the date of loss to its expiration date divided
      by the calendar days from its enrollment date to its expiration date, rounded half-up to the cent, when it
      was enrolled on or before the date of loss and expires after it; it is 0.00 when there is no such service
      contract. The uncovered-deductible part of the Plus excluded total is the primary deductible the claim shows
      less the part of it the plan covers, which is that deductible up to the plan''s deductible_reimbursement_max_usd,
      never below 0.00.'
    params:
    - max_benefit_usd
    - max_ltv_covered_pct
  inputs:
    history:
    - table: gap_activities
      aggregate: sum
      field: balance_at_loss_usd
      filters:
        event_type: gap_claim_filed
    - table: gap_activities
      aggregate: sum
      field: primary_deductible_usd
      filters:
        event_type: gap_claim_filed
    - category: contract
      table: contract_servicing_events
      aggregate: sum
      field: extension_months
      filters:
        event_type: contract_extension_granted
    - category: cpi
      table: cpi_activities
      aggregate: sum
      field: amount_usd
      filters:
        event_type: cpi_premium_charged
        billing_method: added_to_contract_balance
    - category: vsc
      table: vsc_activities
      aggregate: sum
      field: amount_usd
      filters:
        event_type: vsc_refund_issued
    - table: gap_activities
      aggregate: sum
      field: primary_settlement_acv_usd
      filters:
        event_type: gap_claim_filed
    cross_category:
    - contract
    - cpi
    - vsc
