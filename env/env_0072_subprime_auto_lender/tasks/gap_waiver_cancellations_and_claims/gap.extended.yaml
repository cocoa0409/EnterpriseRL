# Product charter: GAP Waiver (debt cancellation addendum to the retail installment contract).
category: gap
display_name: GAP Waiver Addenda

binding:
  holding_table: gap_addenda
  event_tables: [gap_activities]
  intake_tables: [gap_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {charge_net_usd: gap_charge_net}

lifecycle:
  states: [active, claim_open, benefit_paid, cancelled, expired]
  transitions:
    - {from: active, to: claim_open, by: system, means: "A total-loss or theft claim is reported on the addendum."}
    - {from: claim_open, to: active, by: agent, means: "The claim is withdrawn because the vehicle was repaired rather than declared a total loss."}
    - {from: claim_open, to: benefit_paid, by: system, means: "The claim is approved and the benefit is credited to the contract."}
    - {from: claim_open, to: cancelled, by: system, means: "The claim is denied; the addendum ends as of the date of loss."}
    - {from: active, to: cancelled, by: agent, means: "The addendum is cancelled on the borrower's signed request, on early payoff, on the sale of the repossessed vehicle or on an unwind."}
    - {from: active, to: expired, by: system, means: "The addendum reaches its expiration date and ends fully earned."}

accounts:
  - key: gap_charge_net
    unit: USD
    meaning: "Charge the borrower paid for the addendum net of refunds: increases (in) at enrollment by the price financed in the contract; decreases (out) with each refund of unearned charge."

# ---- category-level parameter dictionary ----
parameter_schema:
  price_usd: "Retail charge for the addendum, financed in the contract, USD"
  max_amount_financed_usd: "Largest amount financed on a contract that may carry the addendum, USD"
  max_vehicle_age_years: "Oldest vehicle eligible, model years counted as contract year minus model year"
  excluded_vehicle_uses: "Vehicle uses that make a contract ineligible"
  enrollment_only_at_signing: "Whether the addendum can be bought only at contract signing"
  coverage_start_basis: "When coverage begins"
  coverage_end_basis: "When coverage ends"
  term_matches_contract: "Whether the addendum term equals the contract's original term"
  transferable: "Whether the addendum may move to another vehicle or contract"
  max_open_addenda_per_contract: "Addenda not closed at once on one contract, count"
  max_ltv_covered_pct: "Highest loan-to-value the benefit covers: balance above this percent of the vehicle book value at origination is excluded"
  max_benefit_usd: "Largest benefit for one loss, USD"
  deductible_reimbursement_max_usd: "Largest primary-insurance deductible the benefit also covers, USD (0.00 = none)"
  primary_insurance_required: "Whether the borrower's own physical-damage insurance must have been in force at the date of loss (force-placed coverage does not count)"
  benefit_balance_basis: "Balance the benefit starts from"
  excluded_amounts: "Amounts never covered by the benefit"
  claim_notice_days_after_loss: "Calendar days after the date of loss within which the claim must be reported"
  claim_docs_due_days: "Calendar days after the primary insurer's settlement within which the complete claim file must be received"
  required_claim_documents: "Documents a complete claim file contains"
  unrecovered_theft_wait_days: "Calendar days a theft must remain unrecovered before the claim is decided"
  claim_decision_days: "Calendar days after the complete claim file is received within which the claim is decided"
  benefit_paid_to: "Who receives the benefit"
  benefit_rounding: "Rounding of the benefit"
  claim_withdrawal_reactivation: "Whether an addendum returns to active when the claim is withdrawn because the vehicle is repaired rather than declared a total loss"
  free_look_days: "Calendar days after the contract date within which a voluntary cancellation receives a full refund with no fee"
  cancellation_fee_usd: "Fee deducted from a refund outside the free-look period, USD"
  cancellation_fee_waived_on_payoff: "Whether the cancellation fee is waived when the addendum cancels because the contract was paid off early"
  refund_method: "How the unearned charge is computed outside the free-look period"
  min_refund_usd: "Computed refunds below this amount are not issued, USD"
  early_payoff_auto_cancel: "Whether the company cancels the addendum automatically when the contract is paid off before maturity"
  auto_cancel_processing_days: "Calendar days after the cancellation effective date within which a company-initiated cancellation refund is issued"
  voluntary_cancel_signature_required: "Whether a borrower's voluntary cancellation needs a signed cancellation request"
  voluntary_cancel_processing_days: "Calendar days after a signed cancellation request within which the refund is issued"
  voluntary_request_valid_days: "Calendar days a cancellation request sent for signature stays open"
  repossession_sale_cancel: "Whether the addendum cancels on the sale of a repossessed vehicle"
  unwind_full_refund: "Whether an unwound contract's addendum is voided with a full refund"
  refund_disposition_order: "Where a refund goes, first applicable wins"
  no_refund_after_benefit: "Whether an addendum that paid a benefit is fully earned"
  expiry_fully_earned: "Whether an addendum that reaches its expiration date is fully earned"
  cancellation_effective_date_basis: "Cancellation effective date by reason"
  claim_payment_days: "Calendar days after approval within which the benefit is credited to the contract"
  total_loss_definition: "What counts as a loss under the addendum"
  denial_notice_days: "Calendar days after a denial within which the written denial stating its reason is mailed"
  unearned_ratio_basis: "Unearned share of the charge for a pro-rata refund"
  max_claims_per_addendum: "Claims decided on one addendum, count"
  eligible_contract_statuses_at_loss: "Contract statuses on the date of loss for which a benefit is payable"
  salvage_retention_basis: "Amount excluded when the borrower keeps the salvage"
  deductible_reimbursement_basis: "Deductible amount the benefit may cover"

