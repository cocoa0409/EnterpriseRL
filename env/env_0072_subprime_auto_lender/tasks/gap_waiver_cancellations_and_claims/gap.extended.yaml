- id: gap_ext_plus_starting_balance
  base_policy_refs:
  - gap_claim_benefit
  - gap_agg_contract_portfolio
  overwrite:
  - base_policy: gap_claim_benefit
    superseded_clause: the benefit is the scheduled balance on the date of loss (benefit_balance_basis, gap_msr_scheduled_balance_at_loss)
    replaced_by: On a Plus worksheet claim the balance the benefit starts from is the Plus starting balance set
      here, with no interest accrued after the last counted due date; on a GAP Waiver Premier 150 claim it is the
      Premier starting balance, and on a claim on any other plan the benefit still starts from the scheduled balance
      on the date of loss with interest accrued to the date of loss on that balance.
  trigger: on_request
  subject:
  - gap_claim_opened
  computes: balance_at_loss_usd
  target_tool: record_plus_claim_balance_at_loss_c4d2a91e
  params:
    fp_long_days: 20
    fp_long_period: 50
    fp_month_days: 30
    fp_min_period: 32
    ad_cap_days: 15
  rule: >-
    This rule sets the Plus starting balance: the starting balance that the claim worksheet records for a total-loss
    or theft claim on a GAP Waiver Plus 150 addendum (a Plus worksheet claim): the claim is the latest claim reported
    on the addendum, and every figure is read from that claim and from the records of the addendum's own contract.
    The latest claim reported on the addendum is the claim with the latest reporting date, and where two claims
    were reported on that date the one recorded first on the addendum counts. The latest due-date change, the latest
    cap-applied record and the latest cap-ended record the contract records are each the record of its kind with
    the latest effective date, and where two records of one kind share that date the one recorded first counts.
    A starting balance is set only for a reported claim: with no claim reported on the addendum the starting balance
    is 0.00. The starting balance is figured on the contract's signed terms: the monthly rate is the contract's
    original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
    monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term in
    months, rounded half-up to the cent. Whole months from one date to a later one are the difference in calendar
    months between them, less one when the later date's day of the month is below the earlier date's. The installments
    the starting balance counts are the due dates from the first payment date through the date of loss, one a month
    on the first payment date's day with a due date on the date of loss counted: the whole months from the first
    payment date to the date of loss, plus one, and none when the loss came before the first payment date. The scheduled
    principal is the opening principal, which is the amount financed, times the monthly rate plus one raised to
    the power of the installments counted, less the level installment times that power less one, divided by the
    monthly rate. The starting balance is that scheduled principal rounded half-up to the cent and never below 0.00;
    no interest after the last counted due date is added to it. The first-period days the starting balance capitalizes
    follow the days from the contract date to the first payment date: when that first period runs more than 50 days,
    20 days are capitalized; when it runs 32 to 50 days, the days beyond 30 are capitalized; when it runs 31 days
    or fewer, none are; the first-period days capitalized add to the opening principal the amount financed times
    the original annual percentage rate divided by 100, times those days, divided by 365, rounded half-up to the
    cent. The days a due-date change added that the starting balance capitalizes follow the latest due-date change
    the contract records: when it took effect on or before the date of loss and moved the next due date later by
    more than 15 days, 15 days are capitalized; when it took effect on or before the date of loss and moved the
    next due date later by 1 to 15 days, those days are capitalized; otherwise none are; the added days capitalized
    add to the opening principal the amount financed times the original annual percentage rate divided by 100, times
    those days, divided by 365, rounded half-up to the cent. The installments the starting balance counts follow
    the latest due-date change the contract records: when that change took effect on or before the date of loss
    and its new next due date is on or before the date of loss, they are the whole months from the first payment
    date to the change's old next due date, plus the whole months from its new next due date to the date of loss,
    plus one; when that change took effect on or before the date of loss and its new next due date is after the
    date of loss, they are the whole months from the first payment date to the change's old next due date; when
    the contract records no due-date change, or its latest one took effect after the date of loss, they are counted
    on the first payment date's day as above. The capped-rate adjustment to the starting balance follows the Servicemembers
    Civil Relief Act rate cap the contract records, read from its latest cap-applied record (effective date, rate
    and installment) and its latest cap-ended record (effective date and restored installment): when a cap took
    effect on or before the date of loss and had not ended by it, the adjustment is the principal a two-stage schedule
    leaves less the principal the signed schedule leaves, the first stage running at the original rate and level
    installment over the installments falling due on or before the cap's effective date and the second at the cap's
    rate and installment; when a cap took effect and ended on or before the date of loss, the adjustment is the
    principal a three-stage schedule leaves less that same signed-schedule principal, the third stage running at
    the original rate with the restored installment over the installments falling due after the cap's end date;
    otherwise there is no adjustment; the adjustment is added to the scheduled principal before the starting balance
    is rounded. For the capped-rate adjustment, the signed schedule and the first stage both start from the amount
    financed (not from the opening principal) and both run over the installments counted on the first payment date's
    day; each later stage carries forward the principal the stage before it left, by the same amortization formula
    at the stage's own monthly rate (its annual rate divided by 1,200), installment and number of installments,
    the installments of a stage never running past those installments counted on the first payment date's day. On
    a Plus worksheet claim the balance the benefit starts from is the Plus starting balance set here, with no interest
    accrued after the last counted due date; on a GAP Waiver Premier 150 claim it is the Premier starting balance,
    and on a claim on any other plan the benefit still starts from the scheduled balance on the date of loss with
    interest accrued to the date of loss on that balance.
  prerequisite: []
  cross_category:
  - category: contract
    as: history
    reads:
    - amount_financed_usd
    - original_apr_pct
    - term_months
    - first_payment_date
    - contract_date
    - contract_servicing_events.effective_date
    - contract_servicing_events.old_next_due_date
    - contract_servicing_events.new_next_due_date
    - contract_servicing_events.new_apr_pct
    - contract_servicing_events.new_scheduled_payment_usd
    note: Signed terms from the contract holding; the installments counted, the added days and the capped-rate adjustment
      are decided from the contract servicing ledger.
  compute:
  - bp_loss: LATEST('gap_activities','loss_date', date_field='activity_date', event_type='gap_claim_filed')
  - bp_af: CFIELD('contract','amount_financed_usd', contract_id=F('contract_id'))
  - bp_apr: CFIELD('contract','original_apr_pct', contract_id=F('contract_id'))
  - bp_term: CFIELD('contract','term_months', contract_id=F('contract_id'))
  - bp_first_due: CFIELD('contract','first_payment_date', contract_id=F('contract_id'))
  - bp_rate: bp_apr / 1200
  - bp_level_pmt: RND(bp_af * bp_rate / (1 - (1 + bp_rate) ** (-bp_term)), 2)
  - bp_std_count: (MONTHS(bp_first_due, bp_loss) + 1) if bp_first_due <= bp_loss else 0
  - pf_period_days: DAYS(CFIELD('contract','contract_date', contract_id=F('contract_id')), CFIELD('contract','first_payment_date',
      contract_id=F('contract_id')))
  - pf_days: K('fp_long_days') if pf_period_days > K('fp_long_period') else ((pf_period_days - K('fp_month_days'))
      if pf_period_days >= K('fp_min_period') else 0)
  - pf_interest: RND(bp_af * bp_apr / 100 * pf_days / 365, 2)
  - pa_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_due_date_changed',
      contract_id=F('contract_id'))
  - pa_old: XLATEST('contract','contract_servicing_events','old_next_due_date', date_field='effective_date', event_type='contract_due_date_changed',
      contract_id=F('contract_id'))
  - pa_new: XLATEST('contract','contract_servicing_events','new_next_due_date', date_field='effective_date', event_type='contract_due_date_changed',
      contract_id=F('contract_id'))
  - pa_moved: DAYS(pa_old, pa_new) if (pa_date != None and pa_date <= bp_loss) else 0
  - pa_days: K('ad_cap_days') if pa_moved > K('ad_cap_days') else (pa_moved if pa_moved >= 1 else 0)
  - pa_interest: RND(bp_af * bp_apr / 100 * pa_days / 365, 2)
  - pc_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_due_date_changed',
      contract_id=F('contract_id'))
  - pc_old_next: XLATEST('contract','contract_servicing_events','old_next_due_date', date_field='effective_date',
      event_type='contract_due_date_changed', contract_id=F('contract_id'))
  - pc_new_next: XLATEST('contract','contract_servicing_events','new_next_due_date', date_field='effective_date',
      event_type='contract_due_date_changed', contract_id=F('contract_id'))
  - pc_count: (MONTHS(bp_first_due, pc_old_next) + MONTHS(pc_new_next, bp_loss) + 1) if (pc_date != None and pc_date
      <= bp_loss and pc_new_next <= bp_loss) else (MONTHS(bp_first_due, pc_old_next) if (pc_date != None and pc_date
      <= bp_loss) else bp_std_count)
  - ps_cap_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ps_cap_apr: XLATEST('contract','contract_servicing_events','new_apr_pct', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ps_cap_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ps_end_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_scra_rate_adjusted',
      scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - ps_end_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - ps_live: ps_cap_date != None and ps_cap_date <= bp_loss and (ps_end_date == None or ps_end_date > bp_loss)
  - ps_closed: ps_cap_date != None and ps_cap_date <= bp_loss and ps_end_date != None and ps_end_date <= bp_loss
  - ps_n1: MN(bp_std_count, (MONTHS(bp_first_due, ps_cap_date) + 1) if (ps_cap_date != None and bp_first_due <=
      ps_cap_date) else 0)
  - ps_n2: MN(bp_std_count, (MONTHS(bp_first_due, ps_end_date) + 1) if (ps_end_date != None and bp_first_due <=
      ps_end_date) else 0)
  - ps_signed_bal: bp_af * (1 + bp_rate) ** bp_std_count - bp_level_pmt * ((1 + bp_rate) ** bp_std_count - 1) /
      bp_rate
  - ps_stage1: bp_af * (1 + bp_rate) ** ps_n1 - bp_level_pmt * ((1 + bp_rate) ** ps_n1 - 1) / bp_rate
  - ps_crate: (ps_cap_apr / 1200) if ps_cap_apr != None else bp_rate
  - ps_k2: MX(0, (ps_n2 if ps_closed else bp_std_count) - ps_n1) if ps_cap_date != None else 0
  - ps_stage2: ps_stage1 * (1 + ps_crate) ** ps_k2 - (ps_cap_pmt if ps_cap_pmt != None else 0) * ((1 + ps_crate)
      ** ps_k2 - 1) / ps_crate
  - ps_k3: MX(0, bp_std_count - ps_n2) if ps_closed else 0
  - ps_stage3: ps_stage2 * (1 + bp_rate) ** ps_k3 - (ps_end_pmt if ps_end_pmt != None else 0) * ((1 + bp_rate) **
      ps_k3 - 1) / bp_rate
  - ps_adjust: (ps_stage2 - ps_signed_bal) if ps_live else ((ps_stage3 - ps_signed_bal) if ps_closed else 0)
  - bp_open: bp_af + pf_interest + pa_interest
  - bp_sched: bp_open * (1 + bp_rate) ** pc_count - bp_level_pmt * ((1 + bp_rate) ** pc_count - 1) / bp_rate
  - bp_total: bp_sched + ps_adjust
  - bp_claims: COUNT('gap_activities', event_type='gap_claim_filed')
  - result: RND(MX(0, bp_total), 2) if bp_claims >= 1 else 0
  compute_basis:
    bp_loss: The latest claim reported on the addendum is the claim with the latest reporting date, and where two
      claims were reported on that date the one recorded first on the addendum counts.
    bp_af: 'The starting balance is figured on the contract''s signed terms: the monthly rate is the contract''s
      original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
      monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term
      in months, rounded half-up to the cent.'
