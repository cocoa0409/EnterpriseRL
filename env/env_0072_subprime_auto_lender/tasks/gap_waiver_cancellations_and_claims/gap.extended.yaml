      all the installments deferred by every extension the contract records, times the installment amount it uses,
      which is the contract's scheduled payment.
    result: 'The Premier excluded total is the sum of six parts, added without rounding and then rounded half-up
      to the cent: the past-due part, the fee part, the deferral part, the placed-premium part, the add-on part
      and the uncovered-deductible part.'
    ep_post_window: The fee part of the Premier excluded total is the fees due the contract carries less the late
      charges assessed on installments that fell due after the date of loss, never below 0.00; the installments
      that fell due after the date of loss are those whose due date is fewer whole months before today than the
      whole months from the contract's next due date to today less the whole months from the next due date to the
      date of loss.
    ep_post_late: The fee part of the Premier excluded total is the fees due the contract carries less the late
      charges assessed on installments that fell due after the date of loss, never below 0.00; the installments
      that fell due after the date of loss are those whose due date is fewer whole months before today than the
      whole months from the contract's next due date to today less the whole months from the next due date to the
      date of loss.
    ep_fees: The fee part of the Premier excluded total is the fees due the contract carries less the late charges
      assessed on installments that fell due after the date of loss, never below 0.00; the installments that fell
      due after the date of loss are those whose due date is fewer whole months before today than the whole months
      from the contract's next due date to today less the whole months from the next due date to the date of loss.
    ep_pd_n: 'The installments the past-due part of the Premier excluded total counts follow how many installments
      it treats as past due: one, none is counted; two, one is counted; three or more, all are counted.'
  factors:
  - id: ep_past_due_count
    effect: parameter
    decides: ep_pd_count
    bindings:
    - ep_pd_n
    - ep_pd_count
    ladder:
    - when: one installment treated as past due
      value: none counted
    - when: two installments treated as past due
      value: one counted
    - when: otherwise (three or more)
      value: all counted
    baseline:
      ep_pd_count: ep_unpaid
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: ep_past_due_installment
    effect: parameter
    decides: ep_pd_inst
    bindings:
    - ep_pcap_date
    - ep_pcap_pmt
    - ep_pend_date
    - ep_pend_pmt
    - ep_pcap_n
    - ep_pd_inst
    ladder:
    - when: a cap in effect on the next due date had not ended by the date of loss
      value: the installment the cap set
    - when: a cap in effect on the next due date ended on or before the date of loss
      value: the average of cap and restored installments over the past-due installments
    - when: otherwise
      value: the scheduled payment
    baseline:
      ep_pd_inst: ep_pmt
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: ep_deferral_count
    effect: parameter
    decides: ep_df_count
    bindings:
    - ep_df_months
    - ep_df_count
    ladder:
    - when: one deferred installment in total
      value: none counted
    - when: two or three
      value: all but one counted
    - when: otherwise
      value: all counted
    baseline:
      ep_df_count: ep_df_months
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: ep_deferral_installment
    effect: parameter
    decides: ep_df_inst
    bindings:
    - ep_ext_date
    - ep_dcap_date
    - ep_dcap_pmt
    - ep_dend_date
    - ep_d_rate
    - ep_d_level
    - ep_df_inst
    ladder:
    - when: a cap was in effect on the latest extension's effective date
      value: the installment the cap set
    - when: the latest extension took effect before a cap that has not ended
      value: the level installment of the signed terms
    - when: otherwise
      value: the scheduled payment
    baseline:
      ep_df_inst: ep_pmt
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: ep_placed_premium_basis
    effect: method
    decides: ep_premium
    bindings:
    - ep_prem_refunded
    - ep_last_bill
    - ep_last_amt
    - ep_last_start
    - ep_last_end
    - ep_proof_rev
    - ep_proof_eff
    - ep_pending
    - ep_premium
    ladder:
    - when: refunds of those premiums were credited back to the contract balance
      method: premiums added less refunds credited
    - when: no refund credited, and an accepted proof reviewed on or after the latest premium's billing date took
        effect within that premium's billing period
      method: premiums added less the latest premium's share for its days from the proof's coverage start
    - when: otherwise
      method: every premium added
    baseline:
      ep_premium: ep_prem_added
    evidence:
    - history
    - cross_category
    cross_difficulty: cpi
  - id: ep_addon_basis
    effect: method
    decides: ep_addon
    bindings:
    - ep_vsc_status
    - ep_vsc_reason
    - ep_vsc_cdate
    - ep_vsc_codo
    - ep_vsc_sodo
    - ep_vsc_eodo
    - ep_vsc_fee
    - ep_vsc_min
    - ep_vsc_refunds
    - ep_vsc_issued
    - ep_vsc_claims
    - ep_vsc_formula
    - ep_vsc_own
    - ep_addon
    ladder:
    - when: the service contract was cancelled for the total loss
      method: its refund under its own terms (issued, or its own formula while none is issued)
    - when: it was cancelled for another reason with an effective date before the date of loss
      method: nothing
    - when: otherwise
      method: the day-prorated price
    baseline:
      ep_addon: ep_vsc_estimate
    evidence:
    - history
    - cross_category
    cross_difficulty: vsc
  baseline:
    rule: 'The Premier excluded total is the sum of six parts, added without rounding and then rounded half-up to
      the cent: the past-due part, the fee part, the deferral part, the placed-premium part, the add-on part and
      the uncovered-deductible part. Whole months from one date to a later one are the difference in calendar months
      between them, less one when the later date''s day of the month is below the earlier date''s. The installments
      the Premier excluded total treats as past due are the installments still unpaid that fell due on or before
      the date of loss, counted from the contract''s next due date one a month through the date of loss: the whole
      months from the next due date to the date of loss, plus one, and none when the next due date is after the
      date of loss. The past-due part of the Premier excluded total is the installments it counts, which are all
      the installments treated as past due, times the installment amount it uses, which is the contract''s scheduled
      payment, less the partial installment credit the contract carries, never below 0.00. The fee part of the Premier
      excluded total is the fees due the contract carries less the late charges assessed on installments that fell
      due after the date of loss, never below 0.00; the installments that fell due after the date of loss are those
      whose due date is fewer whole months before today than the whole months from the contract''s next due date
      to today less the whole months from the next due date to the date of loss. The deferral part of the Premier
      excluded total is the deferred installments it counts, which are all the installments deferred by every extension
      the contract records, times the installment amount it uses, which is the contract''s scheduled payment. The
      placed-premium part of the Premier excluded total is every force-placed premium the insurance tracking record
      added to the contract balance. The add-on part of the Premier excluded total is the price of the service contract
      financed on the contract times the calendar days from the date of loss to its expiration date divided by the
      calendar days from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled
      on or before the date of loss and expires after it; it is 0.00 when there is no such service contract. The
      uncovered-deductible part of the Premier excluded total is the primary deductible the claim shows less the
      deductible covered the claim shows, never below 0.00.'
    params: []
  inputs:
    history:
    - table: gap_activities
      aggregate: sum
      field: deductible_covered_usd
      filters:
        event_type: gap_claim_filed
    - category: contract
      table: contract_servicing_events
      aggregate: sum
      field: extension_months
      filters:
        event_type: contract_extension_granted
    - category: cpi
      table: cpi_activities
      aggregate: sum
      field: amount_usd
      filters:
        event_type: cpi_premium_charged
        billing_method: added_to_contract_balance
    - category: vsc
      table: vsc_activities
      aggregate: sum
      field: amount_usd
      filters:
        event_type: vsc_refund_issued
    cross_category:
    - contract
    - cpi
    - vsc
- id: gap_ext_claim_worksheet_benefit
  base_policy_refs:
  - gap_claim_benefit
  - gap_agg_contract_portfolio
  overwrite:
  - base_policy: gap_claim_benefit
    superseded_clause: less the portion above max_ltv_covered_pct (gap_msr_excess_ltv_amount)
    replaced_by: On a Premier worksheet claim the benefit is reduced by the loan-to-value excess set here in place
      of the portion above max_ltv_covered_pct; a GAP Waiver Plus 150 claim is reduced by the Plus worksheet benefit's
      own loan-to-value excess, and a claim on any other plan is still reduced by the portion above max_ltv_covered_pct,
      amortized in the same proportion as the scheduled balance.
  - base_policy: gap_claim_benefit
    superseded_clause: less the primary insurer's actual cash value, plus the deductible covered
    replaced_by: On a Premier worksheet claim the benefit deducts the primary insurer's net settlement set here
      and adds no deductible covered, the part of the deductible not covered being among the excluded amounts; a
      GAP Waiver Plus 150 claim is worked under the Plus worksheet benefit, and on a claim on any other plan the
      benefit still deducts the primary insurer's actual cash value and adds the deductible covered.
  trigger: on_request
  subject:
  - gap_claim_opened
  computes: benefit_usd
  target_tool: record_claim_worksheet_benefit_931d4ebc
  params:
    term_long_cut: 25
    term_mid_cut: 15
    term_long_months: 66
    term_mid_months: 60
    tier_deep_cut: 20
    tier_mid_cut: 10
    band_low_cut: 15
    band_mid_cut: 5
    ltv_full_pct: 130
    ltv_line_pct: 115
    floor_first_pct: 80
    floor_second_pct: 70
    floor_std_pct: 60
  rule: >-
    This rule sets the worksheet benefit: the benefit that the claim worksheet records for a total-loss or theft
    claim on a GAP Waiver Premier 150 addendum (a Premier worksheet claim); the claim is the latest claim reported
    on the addendum, and every other figure is read from the records of the addendum's own contract and of its insurance
    tracking record. The latest claim reported on the addendum is the claim with the latest reporting date, and
    where two claims were reported on that date the one recorded first on the addendum counts. The worksheet benefit
    is not worked out until the claim carries a balance at loss above 0.00. Before the worksheet benefit is worked
    out, the claim's excluded amounts are itemized under the Premier exclusion schedule. The worksheet benefit is
    the starting balance the claim shows, less the loan-to-value excess, less the excluded amounts the claim shows,
    less the primary insurer's net settlement, never below 0.00 and never above the plan's max_benefit_usd, rounded
    half-up to the cent with no intermediate figure rounded. The covered loan-to-value percent of the worksheet
    benefit is the plan's max_ltv_covered_pct, and the covered limit is that percent of the vehicle's book value
    at origination. The loan-to-value excess is the amount by which the contract's amount financed exceeds the covered
    limit, times the share of the excess the worksheet benefit removes, which is the starting balance the claim
    shows divided by the amount financed; it is 0.00 when the amount financed is within the covered limit. The primary
    insurer's net settlement is the actual cash value the worksheet benefit deducts less the primary deductible
    the claim shows. Whole months from one date to a later one are the difference in calendar months between them,
    less one when the later date's day of the month is below the earlier date's. The actual cash value the worksheet
    benefit deducts is the larger of the primary insurer's actual cash value the claim shows and the value floor,
    which is the value floor percent of the vehicle value the floor is figured on; the value floor percent is 60
    percent while the addendum has been in force fewer than 36 whole months at the date of loss and there is no
    floor from 36 whole months on, and the vehicle value the floor is figured on is the vehicle's book value at
    origination. The term reduction of the worksheet benefit's covered loan-to-value percent follows the contract's
    original term: more than 66 months, 25 points; 61 to 66 months, 15 points; 60 months or fewer, no reduction.
    The credit-tier reduction of the worksheet benefit's covered loan-to-value percent follows the contract's credit
    tier: Tier 4 Standard, Tier 5 Rebuild or Tier 6 Fresh Start, 20 points; Tier 2 Preferred or Tier 3 Advantage,
    10 points; Tier 1 Select, no reduction. The value-band reduction of the worksheet benefit's covered loan-to-value
    percent follows the collateral protection plan of the contract's insurance tracking record: CollateralGuard
    Plan A or Plan B, 15 points; CollateralGuard Plan C or Plan D, 5 points; any other plan or no tracking record,
    no reduction. Every reduction of the worksheet benefit's covered loan-to-value percent that applies is subtracted
    from the plan's max_ltv_covered_pct before the covered limit is figured. The share of the excess the worksheet
    benefit removes follows the contract's loan-to-value at signing, its amount financed divided by its book value
    at origination as a percent: above 130 percent, the whole excess is removed; above 115 percent and up to 130
    percent, the share is the installments still to fall due divided by the original term, the installments still
    to fall due being the original term less the due dates from the first payment date through the date of loss
    (the whole months from the first payment date to the date of loss, plus one, and none before the first payment
    date), never below none; 115 percent or less, the share is the starting balance the claim shows divided by the
    amount financed. The value floor percent of the worksheet benefit follows the whole months from the addendum's
    enrollment date to the date of loss: fewer than 24, 80 percent; 24 to 35, 70 percent; 36 or more, no floor.
    The vehicle value the worksheet benefit's floor is figured on follows the contract's insurance tracking record:
    when a placement notice is on record, the vehicle value the record set at that placement; when the record holds
    only the vehicle value it opened with, the lower of that value and the book value at origination; when the contract
    has no tracking record, the book value at origination. On a Premier worksheet claim the benefit is reduced by
    the loan-to-value excess set here in place of the portion above max_ltv_covered_pct; a GAP Waiver Plus 150 claim
    is reduced by the Plus worksheet benefit's own loan-to-value excess, and a claim on any other plan is still
    reduced by the portion above max_ltv_covered_pct, amortized in the same proportion as the scheduled balance.
    On a Premier worksheet claim the benefit deducts the primary insurer's net settlement set here and adds no deductible
    covered, the part of the deductible not covered being among the excluded amounts; a GAP Waiver Plus 150 claim
    is worked under the Plus worksheet benefit, and on a claim on any other plan the benefit still deducts the primary
    insurer's actual cash value and adds the deductible covered.
  prerequisite:
  - problem: gap_ext_claim_starting_balance
    kind: value_input
    gate: bn_balance
    form: state
    policy_source: The worksheet benefit is not worked out until the claim carries a balance at loss above 0.00.
    condition: the claim row (gap_activities, event_type gap_claim_filed) carries balance_at_loss_usd above 0.00
    resolved_by: record_claim_balance_at_loss_15fb7d99
    effect: bn_balance changes from 0.00 to the starting balance the benefit starts from
  - problem: gap_ext_premier_excluded_amounts
    kind: value_input
    gate: bn_excluded
    form: action
    policy_source: Before the worksheet benefit is worked out, the claim's excluded amounts are itemized under the
      Premier exclusion schedule.
    fallback_reason: the itemization can total 0.00, which leaves the claim's excluded amounts exactly as they stood
      before it, so no record state singles out that the itemization was done
    condition: the claim row carries excluded_amounts_usd as the Premier excluded total itemizes it
    resolved_by: record_premier_claim_exclusions_258c7293
    effect: bn_excluded changes from 0.00 to the itemized excluded total, which the benefit deducts
  cross_category:
  - category: contract
    as: branch
    reads:
    - amount_financed_usd
    - vehicle_book_value_usd
    - first_payment_date
    - term_months
    - variant_name
    note: Term and tier reductions and the excess method are decided from the contract holding.
  - category: cpi
    as: branch
    reads:
    - variant_name
    - vehicle_acv_usd
    - cpi_activities.notice_type
    note: The value-band reduction and the floor value are decided from the insurance tracking record.
  compute:
  - bn_loss: LATEST('gap_activities','loss_date', date_field='activity_date', event_type='gap_claim_filed')
  - bn_balance: SUM('gap_activities','balance_at_loss_usd', event_type='gap_claim_filed', loss_date=bn_loss)
  - bn_excluded: SUM('gap_activities','excluded_amounts_usd', event_type='gap_claim_filed', loss_date=bn_loss)
  - bn_acv: SUM('gap_activities','primary_settlement_acv_usd', event_type='gap_claim_filed', loss_date=bn_loss)
  - bn_deducted: SUM('gap_activities','primary_deductible_usd', event_type='gap_claim_filed', loss_date=bn_loss)
  - bn_af: CFIELD('contract','amount_financed_usd', contract_id=F('contract_id'))
  - bn_book: CFIELD('contract','vehicle_book_value_usd', contract_id=F('contract_id'))
  - bn_fpd: CFIELD('contract','first_payment_date', contract_id=F('contract_id'))
  - bn_plan_pct: P('max_ltv_covered_pct')
  - bn_max: P('max_benefit_usd')
  - tc_term: CFIELD('contract','term_months', contract_id=F('contract_id'))
  - tc_cut: K('term_long_cut') if tc_term > K('term_long_months') else (K('term_mid_cut') if tc_term > K('term_mid_months')
      else 0)
  - tr_tier: CFIELD('contract','variant_name', contract_id=F('contract_id'))
  - tr_cut: K('tier_deep_cut') if (tr_tier == 'Tier 4 Standard' or tr_tier == 'Tier 5 Rebuild' or tr_tier == 'Tier
      6 Fresh Start') else (K('tier_mid_cut') if (tr_tier == 'Tier 2 Preferred' or tr_tier == 'Tier 3 Advantage')
      else 0)
  - vb_plan: CFIELD('cpi','variant_name', contract_id=F('contract_id'))
  - vb_cut: K('band_low_cut') if (vb_plan == 'CollateralGuard Plan A' or vb_plan == 'CollateralGuard Plan B') else
      (K('band_mid_cut') if (vb_plan == 'CollateralGuard Plan C' or vb_plan == 'CollateralGuard Plan D') else 0)
  - bn_cover_pct: bn_plan_pct - tc_cut - tr_cut - vb_cut
  - bn_limit: bn_cover_pct / 100 * bn_book
  - em_ltv: CFIELD('contract','amount_financed_usd', contract_id=F('contract_id')) / CFIELD('contract','vehicle_book_value_usd',
      contract_id=F('contract_id')) * 100
  - em_term: CFIELD('contract','term_months', contract_id=F('contract_id'))
  - em_left: MX(0, em_term - ((MONTHS(bn_fpd, bn_loss) + 1) if bn_fpd <= bn_loss else 0))
  - em_share: 1 if em_ltv > K('ltv_full_pct') else ((em_left / em_term) if em_ltv > K('ltv_line_pct') else (bn_balance
      / bn_af))
  - bn_excess: MX(0, bn_af - bn_limit) * em_share
  - vf_months: MONTHS(F('enrollment_date'), bn_loss)
  - vf_pct: K('floor_first_pct') if vf_months < 24 else (K('floor_second_pct') if vf_months < 36 else 0)
  - fv_places: XCOUNT('cpi','cpi_activities', event_type='cpi_notice_sent', notice_type='placement_notice', contract_id=F('contract_id'))
  - fv_value: CFIELD('cpi','vehicle_acv_usd', contract_id=F('contract_id'))
  - fv_base: fv_value if (fv_value != None and fv_places >= 1) else (MN(fv_value, bn_book) if fv_value != None else
      bn_book)
  - bn_acv_used: MX(bn_acv, vf_pct / 100 * fv_base)
  - bn_net: bn_acv_used - bn_deducted
  - bn_before: MX(0, bn_balance - bn_excess - bn_excluded - bn_net)
  - result: RND(MN(bn_max, bn_before), 2)
  compute_basis:
    bn_loss: The latest claim reported on the addendum is the claim with the latest reporting date, and where two
      claims were reported on that date the one recorded first on the addendum counts.
    bn_balance: The worksheet benefit is the starting balance the claim shows, less the loan-to-value excess, less
      the excluded amounts the claim shows, less the primary insurer's net settlement, never below 0.00 and never
      above the plan's max_benefit_usd, rounded half-up to the cent with no intermediate figure rounded.
    bn_excluded: The worksheet benefit is the starting balance the claim shows, less the loan-to-value excess, less
      the excluded amounts the claim shows, less the primary insurer's net settlement, never below 0.00 and never
      above the plan's max_benefit_usd, rounded half-up to the cent with no intermediate figure rounded.
    bn_acv: The primary insurer's net settlement is the actual cash value the worksheet benefit deducts less the
      primary deductible the claim shows.
    bn_deducted: The primary insurer's net settlement is the actual cash value the worksheet benefit deducts less
      the primary deductible the claim shows.
    bn_af: The loan-to-value excess is the amount by which the contract's amount financed exceeds the covered limit,
      times the share of the excess the worksheet benefit removes, which is the starting balance the claim shows
      divided by the amount financed; it is 0.00 when the amount financed is within the covered limit.
    bn_book: The covered loan-to-value percent of the worksheet benefit is the plan's max_ltv_covered_pct, and the
      covered limit is that percent of the vehicle's book value at origination.
    bn_fpd: 'The share of the excess the worksheet benefit removes follows the contract''s loan-to-value at signing,
      its amount financed divided by its book value at origination as a percent: above 130 percent, the whole excess
      is removed; above 115 percent and up to 130 percent, the share is the installments still to fall due divided
      by the original term, the installments still to fall due being the original term less the due dates from the
      first payment date through the date of loss (the whole months from the first payment date to the date of loss,
      plus one, and none before the first payment date), never below none; 115 percent or less, the share is the
      starting balance the claim shows divided by the amount financed.'
    bn_plan_pct: The covered loan-to-value percent of the worksheet benefit is the plan's max_ltv_covered_pct, and
      the covered limit is that percent of the vehicle's book value at origination.
    bn_max: The worksheet benefit is the starting balance the claim shows, less the loan-to-value excess, less the
      excluded amounts the claim shows, less the primary insurer's net settlement, never below 0.00 and never above
      the plan's max_benefit_usd, rounded half-up to the cent with no intermediate figure rounded.
    tc_term: 'The term reduction of the worksheet benefit''s covered loan-to-value percent follows the contract''s
      original term: more than 66 months, 25 points; 61 to 66 months, 15 points; 60 months or fewer, no reduction.'
    tc_cut: 'The term reduction of the worksheet benefit''s covered loan-to-value percent follows the contract''s
      original term: more than 66 months, 25 points; 61 to 66 months, 15 points; 60 months or fewer, no reduction.'
    tr_tier: 'The credit-tier reduction of the worksheet benefit''s covered loan-to-value percent follows the contract''s
      credit tier: Tier 4 Standard, Tier 5 Rebuild or Tier 6 Fresh Start, 20 points; Tier 2 Preferred or Tier 3
      Advantage, 10 points; Tier 1 Select, no reduction.'
    tr_cut: 'The credit-tier reduction of the worksheet benefit''s covered loan-to-value percent follows the contract''s
      credit tier: Tier 4 Standard, Tier 5 Rebuild or Tier 6 Fresh Start, 20 points; Tier 2 Preferred or Tier 3
      Advantage, 10 points; Tier 1 Select, no reduction.'
    vb_plan: 'The value-band reduction of the worksheet benefit''s covered loan-to-value percent follows the collateral
      protection plan of the contract''s insurance tracking record: CollateralGuard Plan A or Plan B, 15 points;
      CollateralGuard Plan C or Plan D, 5 points; any other plan or no tracking record, no reduction.'
    vb_cut: 'The value-band reduction of the worksheet benefit''s covered loan-to-value percent follows the collateral
      protection plan of the contract''s insurance tracking record: CollateralGuard Plan A or Plan B, 15 points;
      CollateralGuard Plan C or Plan D, 5 points; any other plan or no tracking record, no reduction.'
    bn_cover_pct: Every reduction of the worksheet benefit's covered loan-to-value percent that applies is subtracted
      from the plan's max_ltv_covered_pct before the covered limit is figured.
    bn_limit: The covered loan-to-value percent of the worksheet benefit is the plan's max_ltv_covered_pct, and
      the covered limit is that percent of the vehicle's book value at origination.
    em_ltv: 'The share of the excess the worksheet benefit removes follows the contract''s loan-to-value at signing,
      its amount financed divided by its book value at origination as a percent: above 130 percent, the whole excess
      is removed; above 115 percent and up to 130 percent, the share is the installments still to fall due divided
      by the original term, the installments still to fall due being the original term less the due dates from the
      first payment date through the date of loss (the whole months from the first payment date to the date of loss,
      plus one, and none before the first payment date), never below none; 115 percent or less, the share is the
      starting balance the claim shows divided by the amount financed.'
    em_term: 'The share of the excess the worksheet benefit removes follows the contract''s loan-to-value at signing,
      its amount financed divided by its book value at origination as a percent: above 130 percent, the whole excess
      is removed; above 115 percent and up to 130 percent, the share is the installments still to fall due divided
      by the original term, the installments still to fall due being the original term less the due dates from the
      first payment date through the date of loss (the whole months from the first payment date to the date of loss,
      plus one, and none before the first payment date), never below none; 115 percent or less, the share is the
      starting balance the claim shows divided by the amount financed.'
    em_left: 'The share of the excess the worksheet benefit removes follows the contract''s loan-to-value at signing,
      its amount financed divided by its book value at origination as a percent: above 130 percent, the whole excess
      is removed; above 115 percent and up to 130 percent, the share is the installments still to fall due divided
      by the original term, the installments still to fall due being the original term less the due dates from the
      first payment date through the date of loss (the whole months from the first payment date to the date of loss,
      plus one, and none before the first payment date), never below none; 115 percent or less, the share is the
      starting balance the claim shows divided by the amount financed.'
    em_share: 'The share of the excess the worksheet benefit removes follows the contract''s loan-to-value at signing,
      its amount financed divided by its book value at origination as a percent: above 130 percent, the whole excess
      is removed; above 115 percent and up to 130 percent, the share is the installments still to fall due divided
      by the original term, the installments still to fall due being the original term less the due dates from the
      first payment date through the date of loss (the whole months from the first payment date to the date of loss,
      plus one, and none before the first payment date), never below none; 115 percent or less, the share is the
      starting balance the claim shows divided by the amount financed.'
    bn_excess: The loan-to-value excess is the amount by which the contract's amount financed exceeds the covered
      limit, times the share of the excess the worksheet benefit removes, which is the starting balance the claim
      shows divided by the amount financed; it is 0.00 when the amount financed is within the covered limit.
    vf_months: 'The value floor percent of the worksheet benefit follows the whole months from the addendum''s enrollment
      date to the date of loss: fewer than 24, 80 percent; 24 to 35, 70 percent; 36 or more, no floor.'
    vf_pct: 'The value floor percent of the worksheet benefit follows the whole months from the addendum''s enrollment
      date to the date of loss: fewer than 24, 80 percent; 24 to 35, 70 percent; 36 or more, no floor.'
    fv_places: 'The vehicle value the worksheet benefit''s floor is figured on follows the contract''s insurance
      tracking record: when a placement notice is on record, the vehicle value the record set at that placement;
      when the record holds only the vehicle value it opened with, the lower of that value and the book value at
      origination; when the contract has no tracking record, the book value at origination.'
    fv_value: 'The vehicle value the worksheet benefit''s floor is figured on follows the contract''s insurance
      tracking record: when a placement notice is on record, the vehicle value the record set at that placement;
      when the record holds only the vehicle value it opened with, the lower of that value and the book value at
      origination; when the contract has no tracking record, the book value at origination.'
    fv_base: 'The vehicle value the worksheet benefit''s floor is figured on follows the contract''s insurance tracking
      record: when a placement notice is on record, the vehicle value the record set at that placement; when the
      record holds only the vehicle value it opened with, the lower of that value and the book value at origination;
      when the contract has no tracking record, the book value at origination.'
    bn_acv_used: The actual cash value the worksheet benefit deducts is the larger of the primary insurer's actual
      cash value the claim shows and the value floor, which is the value floor percent of the vehicle value the
      floor is figured on; the value floor percent is 60 percent while the addendum has been in force fewer than
      36 whole months at the date of loss and there is no floor from 36 whole months on, and the vehicle value the
      floor is figured on is the vehicle's book value at origination.
    bn_net: The primary insurer's net settlement is the actual cash value the worksheet benefit deducts less the
      primary deductible the claim shows.
    bn_before: The worksheet benefit is the starting balance the claim shows, less the loan-to-value excess, less
      the excluded amounts the claim shows, less the primary insurer's net settlement, never below 0.00 and never
      above the plan's max_benefit_usd, rounded half-up to the cent with no intermediate figure rounded.
    result: The worksheet benefit is the starting balance the claim shows, less the loan-to-value excess, less the
      excluded amounts the claim shows, less the primary insurer's net settlement, never below 0.00 and never above
      the plan's max_benefit_usd, rounded half-up to the cent with no intermediate figure rounded.
  factors:
  - id: bn_term_cut
    effect: parameter
    decides: tc_cut
    bindings:
    - tc_term
    - tc_cut
    ladder:
    - when: original term more than 66 months
      value: 25 points (K('term_long_cut'))
    - when: original term 61 to 66 months
      value: 15 points (K('term_mid_cut'))
    - when: otherwise (60 months or fewer)
      value: no reduction
    baseline:
      tc_cut: '0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: bn_tier_cut
    effect: parameter
    decides: tr_cut
    bindings:
    - tr_tier
    - tr_cut
    ladder:
    - when: Tier 4 Standard, Tier 5 Rebuild or Tier 6 Fresh Start
      value: 20 points (K('tier_deep_cut'))
    - when: Tier 2 Preferred or Tier 3 Advantage
      value: 10 points (K('tier_mid_cut'))
    - when: otherwise (Tier 1 Select)
      value: no reduction
    baseline:
      tr_cut: '0'
    evidence:
    - cross_category
    cross_difficulty: contract
  - id: bn_band_cut
    effect: parameter
    decides: vb_cut
    bindings:
    - vb_plan
    - vb_cut
    ladder:
    - when: CollateralGuard Plan A or Plan B
      value: 15 points (K('band_low_cut'))
    - when: CollateralGuard Plan C or Plan D
      value: 5 points (K('band_mid_cut'))
    - when: otherwise
      value: no reduction
    baseline:
      vb_cut: '0'
    evidence:
    - cross_category
    cross_difficulty: cpi
  - id: bn_excess_share
    effect: method
    decides: em_share
    bindings:
    - em_ltv
    - em_term
    - em_left
    - em_share
    ladder:
    - when: loan-to-value at signing above 130 percent
      method: the whole excess
    - when: above 115 and up to 130 percent
      method: installments still to fall due over the original term
    - when: otherwise (115 percent or less)
      method: starting balance over the amount financed
    baseline:
      em_share: bn_balance / bn_af
    evidence:
    - cross_category
    - date
    cross_difficulty: contract
  - id: bn_value_floor
    effect: parameter
    decides: vf_pct
    bindings:
    - vf_months
    - vf_pct
    ladder:
    - when: fewer than 24 whole months from enrollment to the date of loss
      value: 80 percent (K('floor_first_pct'))
    - when: 24 to 35 whole months
      value: 70 percent (K('floor_second_pct'))
    - when: otherwise (36 or more)
      value: no floor
    baseline:
      vf_pct: K('floor_std_pct') if vf_months < 36 else 0
    evidence:
    - date
    cross_difficulty: null
  - id: bn_floor_value
    effect: parameter
    decides: fv_base
    bindings:
    - fv_places
    - fv_value
    - fv_base
    ladder:
    - when: a placement notice is on the tracking record
      value: the vehicle value set at that placement
    - when: the tracking record holds only its opening vehicle value
      value: the lower of that value and the book value at origination
    - when: otherwise (no tracking record)
      value: the book value at origination
    baseline:
      fv_base: bn_book
    evidence:
    - history
    - cross_category
    cross_difficulty: cpi
