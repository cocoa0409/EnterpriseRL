    result: The Plus worksheet benefit is the starting balance the claim shows, less the loan-to-value excess, less
      the Plus excluded total, less the primary insurer's net settlement, never below 0.00 and never above the plan's
      max_benefit_usd, rounded half-up to the cent. The loan-to-value excess is the amount by which the contract's
      amount financed exceeds the plan's max_ltv_covered_pct of the vehicle's book value at origination, times the
      starting balance the claim shows divided by the amount financed; it is 0.00 when the amount financed is within
      that limit. On a Plus worksheet claim the benefit is reduced by the loan-to-value excess set here, figured
      on the starting balance the claim shows, in place of the portion above max_ltv_covered_pct; a GAP Waiver Premier
