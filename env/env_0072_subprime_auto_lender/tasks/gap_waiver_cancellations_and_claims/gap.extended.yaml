  - pd_core: MN(pd_deducted, pd_pded, pd_sched_max) if (pd_pded != None and pd_pded > 0) else MN(pd_deducted, pd_sched_max)
  - pd_allow: CPARAM('cpi','borrower_max_deductible_usd', contract_id=F('contract_id'))
  - pd_put_n: XCOUNT('cpi','cpi_activities', event_type='cpi_proof_verified', insurer_name=pd_insurer, contract_id=F('contract_id'))
