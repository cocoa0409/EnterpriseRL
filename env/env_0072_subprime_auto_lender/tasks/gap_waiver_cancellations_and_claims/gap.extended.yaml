  factors:
  - id: bp_first_period
    effect: parameter
    decides: pf_days
    bindings:
    - pf_period_days
    - pf_days
    - pf_interest
    ladder:
    - when: the first period runs more than 50 days
      value: 20 days (K('fp_long_days'))
    - when: the first period runs 32 to 50 days
      value: the days beyond 30
    - when: otherwise (31 days or fewer)
      value: none
    baseline:
      pf_days: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: contract
  - id: bp_added_days
    effect: parameter
    decides: pa_days
    bindings:
    - pa_date
    - pa_old
    - pa_new
    - pa_moved
    - pa_days
    - pa_interest
    ladder:
    - when: the latest due-date change took effect on or before the date of loss and moved the next due date later
        by more than 15 days
      value: 15 days (K('ad_cap_days'))
    - when: it took effect on or before the date of loss and moved it later by 1 to 15 days
      value: those days
    - when: otherwise
      value: none
    baseline:
      pa_days: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: bp_due_change_count
    effect: method
    decides: pc_count
    bindings:
    - pc_date
    - pc_old_next
    - pc_new_next
    - pc_count
    ladder:
    - when: the latest due-date change took effect on or before the date of loss and its new next due date is on
        or before the date of loss
      method: whole months from the first payment date to the old next due date, plus whole months from the new
        next due date to the date of loss, plus one
    - when: the latest due-date change took effect on or before the date of loss and its new next due date is after
        the date of loss
      method: whole months from the first payment date to the old next due date
    - when: otherwise
      method: due dates counted on the first payment date's day
    baseline:
      pc_count: bp_std_count
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: bp_capped_rate_adjustment
    effect: method
    decides: ps_adjust
    bindings:
    - ps_cap_date
    - ps_cap_apr
    - ps_cap_pmt
    - ps_end_date
    - ps_end_pmt
    - ps_live
    - ps_closed
    - ps_n1
    - ps_n2
    - ps_signed_bal
    - ps_stage1
    - ps_crate
    - ps_k2
    - ps_stage2
    - ps_k3
    - ps_stage3
    - ps_adjust
    ladder:
    - when: an SCRA cap took effect on or before the date of loss and had not ended by it
      method: two-stage schedule less the signed schedule, both from the amount financed
    - when: an SCRA cap took effect and ended on or before the date of loss
      method: three-stage schedule less the signed schedule, both from the amount financed
    - when: otherwise
      method: no adjustment
    baseline:
      ps_adjust: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  baseline:
    rule: 'The starting balance is figured on the contract''s signed terms: the monthly rate is the contract''s
      original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
      monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term
      in months, rounded half-up to the cent. Whole months from one date to a later one are the difference in calendar
      months between them, less one when the later date''s day of the month is below the earlier date''s. The installments
      the starting balance counts are the due dates from the first payment date through the date of loss, one a
      month on the first payment date''s day with a due date on the date of loss counted: the whole months from
      the first payment date to the date of loss, plus one, and none when the loss came before the first payment
      date. The scheduled principal is the opening principal, which is the amount financed, times the monthly rate
      plus one raised to the power of the installments counted, less the level installment times that power less
      one, divided by the monthly rate. The starting balance is that scheduled principal rounded half-up to the
      cent and never below 0.00; no interest after the last counted due date is added to it.'
    params: []
  inputs:
    history:
    - table: gap_activities
      aggregate: latest
      field: loss_date
      filters:
        event_type: gap_claim_filed
    - category: contract
      table: contract_servicing_events
      aggregate: latest
      field: old_next_due_date
      filters:
        event_type: contract_due_date_changed
    - category: contract
      table: contract_servicing_events
      aggregate: latest
      field: new_scheduled_payment_usd
      filters:
        event_type: contract_scra_rate_adjusted
    cross_category:
    - contract
- id: gap_ext_plus_worksheet_benefit
  base_policy_refs:
  - gap_claim_benefit
  - gap_agg_contract_portfolio
  overwrite:
  - base_policy: gap_claim_benefit
    superseded_clause: less every excluded_amounts item (salvage retained by the borrower is excluded at salvage_retention_basis)
    replaced_by: On a GAP Waiver Plus 150 claim the excluded amounts the worksheet benefit deducts are the Plus
      excluded total itemized here, and salvage retained by the borrower and prior-damage deductions, which the
      claim records do not carry, stay excluded at the claim decision as the settlement documents state them; a
      GAP Waiver Premier 150 claim is itemized under the Premier excluded total, and a claim on any other plan is
      still reduced by every excluded_amounts item, salvage retained by the borrower being excluded at salvage_retention_basis.
  - base_policy: gap_agg_contract_portfolio
    superseded_clause: its unearned refund (as computed under the service-contract refund rules on the date of loss)
      is an excluded amount that reduces the GAP benefit, whether or not the refund has been issued yet
    replaced_by: For the Plus excluded total the service contract's refund enters as the add-on part set here; for
      the Premier excluded total it enters as that total's own add-on part, and on a claim on any other plan the
      unearned refund, as computed under the service-contract refund rules on the date of loss, is still an excluded
      amount whether or not it has been issued.
  - base_policy: gap_agg_contract_portfolio
    superseded_clause: premiums it added to the contract balance are excluded amounts
    replaced_by: For the Plus excluded total the force-placed premiums enter as the placed-premium part set here,
      net of refunds credited or, where the proof's coverage starts inside the latest billing period, due; for the
      Premier excluded total they enter as that total's own placed-premium part, and on a claim on any other plan
      every premium force-placed insurance added to the contract balance is still an excluded amount.
  - base_policy: gap_claim_benefit
    superseded_clause: less the primary insurer's actual cash value, plus the deductible covered
    replaced_by: On a Plus worksheet claim the benefit deducts the primary insurer's net settlement set here and
      adds no deductible covered, the part of the deductible above the plan's deductible_reimbursement_max_usd being
      among the excluded amounts; a GAP Waiver Premier 150 claim is worked under the Premier worksheet benefit,
      and on a claim on any other plan the benefit still deducts the primary insurer's actual cash value and adds
      the deductible covered.
  - base_policy: gap_claim_benefit
    superseded_clause: less the portion above max_ltv_covered_pct (gap_msr_excess_ltv_amount)
    replaced_by: On a Plus worksheet claim the benefit is reduced by the loan-to-value excess set here, figured
      on the starting balance the claim shows, in place of the portion above max_ltv_covered_pct; a GAP Waiver Premier
      150 claim is reduced by the Premier worksheet benefit's own loan-to-value excess, and a claim on any other
      plan is still reduced by the portion above max_ltv_covered_pct, amortized in the same proportion as the scheduled
      balance.
  trigger: on_request
  subject:
  - gap_claim_opened
  computes: benefit_usd
  target_tool: accept_plus_claim_benefit_e7b3150d
  params:
    pd_one_days: 20
    pd_two_days: 60
  rule: >-
    This rule sets the Plus worksheet benefit: the benefit that the borrower accepts on the claim worksheet for
    a total-loss or theft claim on a GAP Waiver Plus 150 addendum, figured from the Plus starting balance the claim
    shows and from the Plus excluded total itemized here, the excluded amounts staying owed on the contract, from
    the amounts the records of the addendum's own contract, of its insurance tracking record and of the service
    contract financed on it carry; the claim is the latest claim reported on the addendum. The latest claim reported
    on the addendum is the claim with the latest reporting date, and where two claims were reported on that date
    the one recorded first on the addendum counts. The Plus worksheet benefit is the starting balance the claim
    shows, less the loan-to-value excess, less the Plus excluded total, less the primary insurer's net settlement,
    never below 0.00 and never above the plan's max_benefit_usd, rounded half-up to the cent. The loan-to-value
    excess is the amount by which the contract's amount financed exceeds the plan's max_ltv_covered_pct of the vehicle's
    book value at origination, times the starting balance the claim shows divided by the amount financed; it is
    0.00 when the amount financed is within that limit. On a Plus worksheet claim the benefit is reduced by the
    loan-to-value excess set here, figured on the starting balance the claim shows, in place of the portion above
    max_ltv_covered_pct; a GAP Waiver Premier 150 claim is reduced by the Premier worksheet benefit's own loan-to-value
    excess, and a claim on any other plan is still reduced by the portion above max_ltv_covered_pct, amortized in
    the same proportion as the scheduled balance. The primary insurer's net settlement is the actual cash value
    the claim shows less the primary deductible the claim shows. The Plus excluded total is the sum of six parts,
    added without rounding and then rounded half-up to the cent: the past-due part, the fee part, the deferral part,
    the placed-premium part, the add-on part and the uncovered-deductible part. Whole months from one date to a
    later one are the difference in calendar months between them, less one when the later date's day of the month
    is below the earlier date's. The installments the Plus excluded total treats as past due are the installments
    still unpaid that fell due on or before the date of loss, counted from the contract's next due date one a month
    through the date of loss: the whole months from the next due date to the date of loss, plus one, and none when
    the next due date is after the date of loss. The past-due part of the Plus excluded total is the installments
    it counts, which are all the installments treated as past due, times the installment amount it uses, which is
    the contract's scheduled payment, less the partial installment credit the contract carries, never below 0.00.
    The fee part of the Plus excluded total is the fees due the contract carries less the late charges assessed
    on installments that fell due after the date of loss, never below 0.00; the installments that fell due after
    the date of loss are those whose due date is fewer whole months before today than the whole months from the
    contract's next due date to today less the whole months from the next due date to the date of loss. The deferral
    part of the Plus excluded total is the deferred installments it counts, which are all the installments deferred
    by every extension the contract records, times the installment amount it uses, which is the contract's scheduled
    payment. The placed-premium part of the Plus excluded total is every force-placed premium the insurance tracking
    record added to the contract balance. The add-on part of the Plus excluded total is the price of the service
    contract financed on the contract times the calendar days from the date of loss to its expiration date divided
    by the calendar days from its enrollment date to its expiration date, rounded half-up to the cent, when it was
    enrolled on or before the date of loss and expires after it; it is 0.00 when there is no such service contract.
    The uncovered-deductible part of the Plus excluded total is the primary deductible the claim shows less the
    part of it the plan covers, which is that deductible up to the plan's deductible_reimbursement_max_usd, never
    below 0.00. The Plus worksheet benefit is not worked out until the claim carries a starting balance above 0.00.
    The installments the past-due part of the Plus excluded total counts follow how many installments it treats
    as past due and how long the oldest had been due on the date of loss (calendar days from the next due date to
    the date of loss): one installment due no more than 20 days, none is counted; two installments with the oldest
    due no more than 60 days, one is counted; otherwise all are counted. The installment amount the past-due part
    of the Plus excluded total uses follows the Servicemembers Civil Relief Act rate cap the contract records (its
    latest cap-applied and latest cap-ended records): when a cap was in effect on the contract's next due date and
    had not ended by the date of loss, it is the installment the cap set; when a cap in effect on the next due date
    ended on or before the date of loss, it is the average, over the installments treated as past due, of the cap's
    installment for those falling due on or before the cap's end date and the restored installment for the rest;
    otherwise it is the contract's scheduled payment. The deferred installments the deferral part of the Plus excluded
    total counts follow the installments deferred by every extension the contract records: one in total, none is
    counted; exactly two, one is counted; otherwise all are counted. The installment amount the deferral part of
    the Plus excluded total uses follows the rate cap in effect on the effective date of the latest extension the
    contract records: when a cap had taken effect on or before that date and had not ended by it, it is the installment
    the cap set; when that extension took effect before a cap that has not ended, it is the level installment of
    the signed terms (the amount financed times the monthly rate, the original annual percentage rate divided by
    1,200, divided by one less the monthly rate plus one raised to the power of minus the original term in months,
    rounded half-up to the cent); otherwise it is the contract's scheduled payment. The latest cap-applied record,
    the latest cap-ended record and the latest extension the contract records are each the record of its kind with
    the latest effective date, and where two records of one kind share that date the one recorded first counts.
    The placed-premium part of the Plus excluded total follows how the placement ended: when refunds of those premiums
    were credited back to the contract balance, it is the premiums added less the refunds credited; when no refund
    has been credited and the latest accepted proof of insurance was reviewed on or after the billing date of the
    latest premium added and its policy effective date falls within that premium's billing period, it is the premiums
    added less that latest premium's share for the days of its billing period from the proof's policy effective
    date on (the premium times those days divided by the days of its billing period, both counted inclusive, rounded
    half-up to the cent), which is the whole refund the collateral protection terms leave due when the proof's coverage
    starts inside the latest billing period; otherwise, including a proof whose coverage starts before the latest
    billing period while its refund is not yet credited, it is every premium added. The latest premium added is
    the force-placed premium whose billing period starts latest, whatever its billing date, since a backdated placement
    bills two or more premiums on one day while no two premiums share a billing period. The latest proof of insurance
    the tracking record shows as accepted is the accepted proof with the latest review date, and where two accepted
    proofs were reviewed on that date the one recorded first counts. The add-on part of the Plus excluded total
    follows the service contract financed on the contract: when it was cancelled for the total loss, it is its refund
    under its own terms, which is the refund issued or, while none has been issued, its price times one less the
    larger of the share of its term in days used to the cancellation effective date and the share of its term in
    miles used to the cancellation odometer, that share never above one, rounded half-up to the cent, less the claims
    it paid (authorized amounts less deductibles) and less its cancellation fee, never below 0.00 and 0.00 when
    below its minimum refund; when it was cancelled for any other reason with an effective date before the date
    of loss, it is 0.00; otherwise it is the day-prorated price set out above. Each part of the Plus excluded total
    is figured with the count, the installment amount or the amount its own rule sets; the six parts so figured
    are the ones added. On a GAP Waiver Plus 150 claim the excluded amounts the worksheet benefit deducts are the
    Plus excluded total itemized here, and salvage retained by the borrower and prior-damage deductions, which the
    claim records do not carry, stay excluded at the claim decision as the settlement documents state them; a GAP
    Waiver Premier 150 claim is itemized under the Premier excluded total, and a claim on any other plan is still
    reduced by every excluded_amounts item, salvage retained by the borrower being excluded at salvage_retention_basis.
    For the Plus excluded total the service contract's refund enters as the add-on part set here; for the Premier
    excluded total it enters as that total's own add-on part, and on a claim on any other plan the unearned refund,
    as computed under the service-contract refund rules on the date of loss, is still an excluded amount whether
    or not it has been issued. For the Plus excluded total the force-placed premiums enter as the placed-premium
    part set here, net of refunds credited or, where the proof's coverage starts inside the latest billing period,
    due; for the Premier excluded total they enter as that total's own placed-premium part, and on a claim on any
    other plan every premium force-placed insurance added to the contract balance is still an excluded amount. On
    a Plus worksheet claim the benefit deducts the primary insurer's net settlement set here and adds no deductible
    covered, the part of the deductible above the plan's deductible_reimbursement_max_usd being among the excluded
    amounts; a GAP Waiver Premier 150 claim is worked under the Premier worksheet benefit, and on a claim on any
    other plan the benefit still deducts the primary insurer's actual cash value and adds the deductible covered.
  prerequisite:
  - problem: gap_ext_plus_starting_balance
    kind: value_input
    gate: eu_balance
    form: state
    policy_source: The Plus worksheet benefit is not worked out until the claim carries a starting balance above
      0.00.
    condition: the claim row (gap_activities, event_type gap_claim_filed) carries balance_at_loss_usd above 0.00
    resolved_by: record_plus_claim_balance_at_loss_c4d2a91e
    effect: eu_balance changes from 0.00 to the starting balance the Plus worksheet benefit starts from
  cross_category:
  - category: contract
    as: history
    reads:
    - next_due_date
    - partial_installment_credit_usd
    - scheduled_payment_usd
    - fees_due_usd
    - amount_financed_usd
    - original_apr_pct
    - term_months
    - contract_servicing_events.extension_months
    - contract_servicing_events.new_scheduled_payment_usd
    - vehicle_book_value_usd
    note: Past-due and deferral counts and installment amounts are decided from the contract and its servicing ledger.
  - category: cpi
    as: history
    reads:
    - cpi_activities.amount_usd
    - cpi_activities.billing_period_start
    - cpi_activities.policy_effective_date
    note: The placed-premium basis is decided from the premiums, refunds and proofs of the tracking record.
  - category: vsc
    as: history
    reads:
    - price_usd
    - status
    - cancellation_reason
    - cancellation_effective_date
    - cancellation_odometer
    - odometer_at_sale
    - expiration_odometer
    - vsc_activities.amount_usd
    note: The add-on basis is decided from the service contract and its refund and claim rows.
  compute:
  - eu_loss: LATEST('gap_activities','loss_date', date_field='activity_date', event_type='gap_claim_filed')
  - eu_deducted: SUM('gap_activities','primary_deductible_usd', event_type='gap_claim_filed', loss_date=eu_loss)
  - eu_covered: MN(eu_deducted, P('deductible_reimbursement_max_usd'))
  - eu_balance: SUM('gap_activities','balance_at_loss_usd', event_type='gap_claim_filed', loss_date=eu_loss)
  - eu_af: CFIELD('contract','amount_financed_usd', contract_id=F('contract_id'))
  - eu_book: CFIELD('contract','vehicle_book_value_usd', contract_id=F('contract_id'))
  - eu_acv: SUM('gap_activities','primary_settlement_acv_usd', event_type='gap_claim_filed', loss_date=eu_loss)
  - eu_next_due: CFIELD('contract','next_due_date', contract_id=F('contract_id'))
  - eu_credit: CFIELD('contract','partial_installment_credit_usd', contract_id=F('contract_id'))
  - eu_pmt: CFIELD('contract','scheduled_payment_usd', contract_id=F('contract_id'))
  - eu_unpaid: (MONTHS(eu_next_due, eu_loss) + 1) if eu_next_due <= eu_loss else 0
  - eu_post_window: MONTHS(eu_next_due, NOW) - MONTHS(eu_next_due, eu_loss)
  - eu_post_late: XSUM('contract','contract_transactions','amount_usd', within_months=eu_post_window, date_field='installment_due_date',
      event_type='contract_fee_assessed', fee_type='late_charge', contract_id=F('contract_id')) if eu_post_window
      >= 1 else 0
  - eu_fees: MX(0, CFIELD('contract','fees_due_usd', contract_id=F('contract_id')) - eu_post_late)
  - eu_prem_added: XSUM('cpi','cpi_activities','amount_usd', event_type='cpi_premium_charged', billing_method='added_to_contract_balance',
      contract_id=F('contract_id'))
  - eu_vsc_price: CFIELD('vsc','price_usd', contract_id=F('contract_id'))
  - eu_vsc_enroll: CFIELD('vsc','enrollment_date', contract_id=F('contract_id'))
  - eu_vsc_expire: CFIELD('vsc','expiration_date', contract_id=F('contract_id'))
  - eu_vsc_estimate: RND(eu_vsc_price * DAYS(eu_loss, eu_vsc_expire) / DAYS(eu_vsc_enroll, eu_vsc_expire), 2) if
      (eu_vsc_price != None and eu_vsc_enroll <= eu_loss and eu_vsc_expire > eu_loss) else 0
  - eu_late_days: DAYS(CFIELD('contract','next_due_date', contract_id=F('contract_id')), eu_loss)
  - eu_pd_count: 0 if (eu_unpaid == 1 and eu_late_days <= K('pd_one_days')) else (1 if (eu_unpaid == 2 and eu_late_days
      <= K('pd_two_days')) else eu_unpaid)
  - eu_pcap_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - eu_pcap_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - eu_pend_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - eu_pend_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - eu_pcap_n: MN(eu_unpaid, MONTHS(eu_next_due, eu_pend_date) + 1) if (eu_pend_date != None and eu_next_due <=
      eu_pend_date) else 0
  - eu_pd_inst: eu_pcap_pmt if (eu_pcap_date != None and eu_pcap_date <= eu_next_due and (eu_pend_date == None or
      eu_pend_date > eu_loss)) else (((eu_pcap_n * eu_pcap_pmt + (eu_unpaid - eu_pcap_n) * eu_pend_pmt) / eu_unpaid)
      if (eu_pcap_date != None and eu_pcap_date <= eu_next_due and eu_pend_date != None and eu_pend_date > eu_next_due
      and eu_pend_date <= eu_loss and eu_unpaid >= 1) else eu_pmt)
  - eu_df_months: XSUM('contract','contract_servicing_events','extension_months', event_type='contract_extension_granted',
      contract_id=F('contract_id'))
  - eu_df_count: 0 if eu_df_months == 1 else (1 if eu_df_months == 2 else eu_df_months)
  - eu_ext_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_extension_granted',
      contract_id=F('contract_id'))
  - eu_dcap_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - eu_dcap_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - eu_dend_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - eu_d_rate: CFIELD('contract','original_apr_pct', contract_id=F('contract_id')) / 1200
  - eu_d_level: RND(CFIELD('contract','amount_financed_usd', contract_id=F('contract_id')) * eu_d_rate / (1 - (1
      + eu_d_rate) ** (-CFIELD('contract','term_months', contract_id=F('contract_id')))), 2)
  - eu_df_inst: eu_dcap_pmt if (eu_ext_date != None and eu_dcap_date != None and eu_dcap_date <= eu_ext_date and
      (eu_dend_date == None or eu_dend_date > eu_ext_date)) else (eu_d_level if (eu_ext_date != None and eu_dcap_date
      != None and eu_dcap_date > eu_ext_date and eu_dend_date == None) else eu_pmt)
  - eu_prem_refunded: XSUM('cpi','cpi_activities','amount_usd', event_type='cpi_premium_refunded', refund_disposition='credited_to_contract_balance',
      contract_id=F('contract_id'))
  - eu_last_bill: XLATEST('cpi','cpi_activities','activity_date', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - eu_last_amt: XLATEST('cpi','cpi_activities','amount_usd', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - eu_last_start: XLATEST('cpi','cpi_activities','billing_period_start', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - eu_last_end: XLATEST('cpi','cpi_activities','billing_period_end', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - eu_proof_rev: XLATEST('cpi','cpi_activities','activity_date', date_field='activity_date', event_type='cpi_proof_verified',
      proof_result='accepted', contract_id=F('contract_id'))
  - eu_proof_eff: XLATEST('cpi','cpi_activities','policy_effective_date', date_field='activity_date', event_type='cpi_proof_verified',
      proof_result='accepted', contract_id=F('contract_id'))
  - eu_pending: RND(eu_last_amt * (DAYS(eu_proof_eff, eu_last_end) + 1) / (DAYS(eu_last_start, eu_last_end) + 1),
      2) if (eu_last_bill != None and eu_proof_rev != None and eu_proof_rev >= eu_last_bill and eu_proof_eff >=
      eu_last_start and eu_proof_eff <= eu_last_end) else 0
  - eu_premium: MX(0, eu_prem_added - eu_prem_refunded) if eu_prem_refunded > 0 else (MX(0, eu_prem_added - eu_pending)
      if (eu_last_bill != None and eu_proof_rev != None and eu_proof_rev >= eu_last_bill and eu_proof_eff >= eu_last_start
      and eu_proof_eff <= eu_last_end) else eu_prem_added)
  - eu_vsc_status: CFIELD('vsc','status', contract_id=F('contract_id'))
  - eu_vsc_reason: CFIELD('vsc','cancellation_reason', contract_id=F('contract_id'))
  - eu_vsc_cdate: CFIELD('vsc','cancellation_effective_date', contract_id=F('contract_id'))
  - eu_vsc_codo: CFIELD('vsc','cancellation_odometer', contract_id=F('contract_id'))
  - eu_vsc_sodo: CFIELD('vsc','odometer_at_sale', contract_id=F('contract_id'))
  - eu_vsc_eodo: CFIELD('vsc','expiration_odometer', contract_id=F('contract_id'))
  - eu_vsc_fee: CPARAM('vsc','cancellation_fee_usd', contract_id=F('contract_id'))
  - eu_vsc_min: CPARAM('vsc','min_refund_usd', contract_id=F('contract_id'))
  - eu_vsc_refunds: XCOUNT('vsc','vsc_activities', event_type='vsc_refund_issued', contract_id=F('contract_id'))
  - eu_vsc_issued: XSUM('vsc','vsc_activities','amount_usd', event_type='vsc_refund_issued', contract_id=F('contract_id'))
  - eu_vsc_claims: XSUM('vsc','vsc_activities','authorized_amount_usd', event_type='vsc_claim_authorized', contract_id=F('contract_id'))
      - XSUM('vsc','vsc_activities','deductible_usd', event_type='vsc_claim_authorized', contract_id=F('contract_id'))
  - eu_vsc_formula: MX(0, RND(eu_vsc_price * (1 - MN(1, MX(DAYS(eu_vsc_enroll, eu_vsc_cdate) / DAYS(eu_vsc_enroll,
      eu_vsc_expire), (eu_vsc_codo - eu_vsc_sodo) / (eu_vsc_eodo - eu_vsc_sodo)))), 2) - eu_vsc_claims - eu_vsc_fee)
      if (eu_vsc_status == 'cancelled' and eu_vsc_reason == 'total_loss') else 0
  - eu_vsc_own: eu_vsc_issued if eu_vsc_refunds >= 1 else ((eu_vsc_formula if eu_vsc_formula >= eu_vsc_min else
      0) if eu_vsc_min != None else 0)
  - eu_addon: eu_vsc_own if (eu_vsc_status == 'cancelled' and eu_vsc_reason == 'total_loss') else (0 if (eu_vsc_status
      == 'cancelled' and eu_vsc_cdate != '' and eu_vsc_cdate < eu_loss) else eu_vsc_estimate)
  - eu_pastdue: MX(0, eu_pd_count * eu_pd_inst - eu_credit) if eu_pd_count >= 1 else 0
  - eu_deferral: eu_df_count * eu_df_inst
  - eu_uncovered: MX(0, eu_deducted - eu_covered)
  - eu_excluded: RND(eu_pastdue + eu_fees + eu_deferral + eu_premium + eu_addon + eu_uncovered, 2)
  - eu_excess: MX(0, eu_af - P('max_ltv_covered_pct') / 100 * eu_book) * eu_balance / eu_af
  - eu_net: eu_acv - eu_deducted
  - result: RND(MN(P('max_benefit_usd'), MX(0, eu_balance - eu_excess - eu_excluded - eu_net)), 2)
  compute_basis:
    eu_loss: The latest claim reported on the addendum is the claim with the latest reporting date, and where two
      claims were reported on that date the one recorded first on the addendum counts.
    eu_deducted: The uncovered-deductible part of the Plus excluded total is the primary deductible the claim shows
      less the part of it the plan covers, which is that deductible up to the plan's deductible_reimbursement_max_usd,
      never below 0.00.
    eu_covered: The uncovered-deductible part of the Plus excluded total is the primary deductible the claim shows
      less the part of it the plan covers, which is that deductible up to the plan's deductible_reimbursement_max_usd,
      never below 0.00.
    eu_uncovered: The uncovered-deductible part of the Plus excluded total is the primary deductible the claim shows
      less the part of it the plan covers, which is that deductible up to the plan's deductible_reimbursement_max_usd,
      never below 0.00.
    eu_next_due: 'The installments the Plus excluded total treats as past due are the installments still unpaid
      that fell due on or before the date of loss, counted from the contract''s next due date one a month through
      the date of loss: the whole months from the next due date to the date of loss, plus one, and none when the
      next due date is after the date of loss.'
    eu_unpaid: 'The installments the Plus excluded total treats as past due are the installments still unpaid that
      fell due on or before the date of loss, counted from the contract''s next due date one a month through the
      date of loss: the whole months from the next due date to the date of loss, plus one, and none when the next
      due date is after the date of loss.'
    eu_credit: The past-due part of the Plus excluded total is the installments it counts, which are all the installments
      treated as past due, times the installment amount it uses, which is the contract's scheduled payment, less
      the partial installment credit the contract carries, never below 0.00.
    eu_pmt: The past-due part of the Plus excluded total is the installments it counts, which are all the installments
      treated as past due, times the installment amount it uses, which is the contract's scheduled payment, less
      the partial installment credit the contract carries, never below 0.00.
    eu_prem_added: The placed-premium part of the Plus excluded total is every force-placed premium the insurance
      tracking record added to the contract balance.
    eu_vsc_price: The add-on part of the Plus excluded total is the price of the service contract financed on the
      contract times the calendar days from the date of loss to its expiration date divided by the calendar days
      from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled on or before
      the date of loss and expires after it; it is 0.00 when there is no such service contract.
    eu_vsc_enroll: The add-on part of the Plus excluded total is the price of the service contract financed on the
      contract times the calendar days from the date of loss to its expiration date divided by the calendar days
      from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled on or before
      the date of loss and expires after it; it is 0.00 when there is no such service contract.
    eu_vsc_expire: The add-on part of the Plus excluded total is the price of the service contract financed on the
      contract times the calendar days from the date of loss to its expiration date divided by the calendar days
      from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled on or before
      the date of loss and expires after it; it is 0.00 when there is no such service contract.
    eu_vsc_estimate: The add-on part of the Plus excluded total is the price of the service contract financed on
      the contract times the calendar days from the date of loss to its expiration date divided by the calendar
      days from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled on
      or before the date of loss and expires after it; it is 0.00 when there is no such service contract.
    eu_late_days: 'The installments the past-due part of the Plus excluded total counts follow how many installments
      it treats as past due and how long the oldest had been due on the date of loss (calendar days from the next
      due date to the date of loss): one installment due no more than 20 days, none is counted; two installments
      with the oldest due no more than 60 days, one is counted; otherwise all are counted.'
    eu_pd_count: 'The installments the past-due part of the Plus excluded total counts follow how many installments
      it treats as past due and how long the oldest had been due on the date of loss (calendar days from the next
      due date to the date of loss): one installment due no more than 20 days, none is counted; two installments
      with the oldest due no more than 60 days, one is counted; otherwise all are counted.'
    eu_pcap_date: 'The installment amount the past-due part of the Plus excluded total uses follows the Servicemembers
      Civil Relief Act rate cap the contract records (its latest cap-applied and latest cap-ended records): when
      a cap was in effect on the contract''s next due date and had not ended by the date of loss, it is the installment
      the cap set; when a cap in effect on the next due date ended on or before the date of loss, it is the average,
      over the installments treated as past due, of the cap''s installment for those falling due on or before the
      cap''s end date and the restored installment for the rest; otherwise it is the contract''s scheduled payment.'
