  - pd_m_cap: 0 if pd_shape == 'void' else (pd_allow if pd_shape == 'cap' else None)
  - pd_amount: MN(pd_core, (pd_m_cap if pd_m_cap != None else pd_core))
  - result: RND(MX(0, pd_amount), 2)
