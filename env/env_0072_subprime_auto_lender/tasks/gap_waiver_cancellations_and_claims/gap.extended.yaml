      insurer_name=pd_insurer, contract_id=F('contract_id'))
  - pd_src: '''settling'' if (pd_ins_n >= 1 and (pd_f_res == ''accepted'' or pd_f_res == ''rejected_deductible_too_high''))
      else (''none'' if pd_ins_n >= 1 else ''latest'')'
  - pd_d_coll: None if pd_src == 'none' else (pd_set_coll if pd_src == 'settling' else pd_any_acc_coll)
  - pd_d_comp: None if pd_src == 'none' else (pd_set_comp if pd_src == 'settling' else pd_any_acc_comp)
  - pd_kind: '''collision'' if LATEST(''gap_activities'',''loss_type'', date_field=''activity_date'', event_type=''gap_claim_filed'')
      == ''total_loss_collision'' else (''comprehensive'' if (LATEST(''gap_activities'',''loss_type'', date_field=''activity_date'',
