      proof_result='accepted', contract_id=F('contract_id'))
  - pd_set_coll: XLATEST('cpi','cpi_activities','collision_deductible_usd', date_field='activity_date', event_type='cpi_proof_verified',
      insurer_name=pd_insurer, contract_id=F('contract_id'))
  - pd_any_acc_comp: XLATEST('cpi','cpi_activities','comprehensive_deductible_usd', date_field='activity_date',
      event_type='cpi_proof_verified', proof_result='accepted', contract_id=F('contract_id'))
  - pd_set_comp: XLATEST('cpi','cpi_activities','comprehensive_deductible_usd', date_field='activity_date', event_type='cpi_proof_verified',
      insurer_name=pd_insurer, contract_id=F('contract_id'))
  - pd_ins_n: XCOUNT('cpi','cpi_activities', event_type='cpi_proof_verified', insurer_name=pd_insurer, contract_id=F('contract_id'))
