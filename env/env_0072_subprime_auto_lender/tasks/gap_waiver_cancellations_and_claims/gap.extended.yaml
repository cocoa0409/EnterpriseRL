    eu_prem_refunded: 'The placed-premium part of the Plus excluded total follows how the placement ended: when
      refunds of those premiums were credited back to the contract balance, it is the premiums added less the refunds
      credited; when no refund has been credited and the latest accepted proof of insurance was reviewed on or after
      the billing date of the latest premium added and its policy effective date falls within that premium''s billing
      period, it is the premiums added less that latest premium''s share for the days of its billing period from
      the proof''s policy effective date on (the premium times those days divided by the days of its billing period,
      both counted inclusive, rounded half-up to the cent), which is the whole refund the collateral protection
      terms leave due when the proof''s coverage starts inside the latest billing period; otherwise, including a
      proof whose coverage starts before the latest billing period while its refund is not yet credited, it is every
      premium added.'
