  - pd_sched_type: LATEST('gap_activities','loss_type', date_field='activity_date', event_type='gap_claim_filed')
  - pd_sched_max: pd_plan_max if pd_sched_type == 'total_loss_collision' else (K('theft_reimbursement_max_usd')
