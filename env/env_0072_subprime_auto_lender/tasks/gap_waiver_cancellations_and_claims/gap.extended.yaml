    ep_prem_refunded: 'The placed-premium part of the Premier excluded total follows how the placement ended: when
      refunds of those premiums were credited back to the contract balance, it is the premiums added less the refunds
      credited; when no refund has been credited and the latest accepted proof of insurance was reviewed on or after
