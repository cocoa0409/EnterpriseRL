      and the rate cap: when the contract''s latest payment was posted on or before the date of loss and no Servicemembers
      Civil Relief Act rate cap took effect or ended after it and on or before the date of loss, it is the interest
      accrued from that payment to the date of loss at the rate in force on the date of loss (the cap''s rate while
      a cap is in effect, otherwise the original annual percentage rate); when the latest payment was posted on
      or before the date of loss and a cap took effect, ended, or both took effect and ended after it and on or
      before the date of loss, each calendar day from that payment to the date of loss accrues at the rate in force
      on it, which is the cap''s rate on the days from the cap''s effective date up to the day before its end took
      effect and the original annual percentage rate on every other day; otherwise none is carried. Interest accrues
      on the principal in place over that period, which is the principal balance the contract carries with every
      service-contract refund credited for the total loss added back (those credits post after the date of loss),
      at the rate divided by 100, times the calendar days, divided by 365, rounded half-up to the cent once at the
      end; the latest payment is the posted payment with the latest posting date.'
    ai_cap_to: 'The interest the starting balance carries from the account''s latest payment follows that payment
      and the rate cap: when the contract''s latest payment was posted on or before the date of loss and no Servicemembers
      Civil Relief Act rate cap took effect or ended after it and on or before the date of loss, it is the interest
      accrued from that payment to the date of loss at the rate in force on the date of loss (the cap''s rate while
      a cap is in effect, otherwise the original annual percentage rate); when the latest payment was posted on
      or before the date of loss and a cap took effect, ended, or both took effect and ended after it and on or
      before the date of loss, each calendar day from that payment to the date of loss accrues at the rate in force
      on it, which is the cap''s rate on the days from the cap''s effective date up to the day before its end took
      effect and the original annual percentage rate on every other day; otherwise none is carried. Interest accrues
      on the principal in place over that period, which is the principal balance the contract carries with every
      service-contract refund credited for the total loss added back (those credits post after the date of loss),
      at the rate divided by 100, times the calendar days, divided by 365, rounded half-up to the cent once at the
      end; the latest payment is the posted payment with the latest posting date.'
    ai_cap_days: 'The interest the starting balance carries from the account''s latest payment follows that payment
      and the rate cap: when the contract''s latest payment was posted on or before the date of loss and no Servicemembers
      Civil Relief Act rate cap took effect or ended after it and on or before the date of loss, it is the interest
      accrued from that payment to the date of loss at the rate in force on the date of loss (the cap''s rate while
      a cap is in effect, otherwise the original annual percentage rate); when the latest payment was posted on
      or before the date of loss and a cap took effect, ended, or both took effect and ended after it and on or
      before the date of loss, each calendar day from that payment to the date of loss accrues at the rate in force
      on it, which is the cap''s rate on the days from the cap''s effective date up to the day before its end took
      effect and the original annual percentage rate on every other day; otherwise none is carried. Interest accrues
      on the principal in place over that period, which is the principal balance the contract carries with every
      service-contract refund credited for the total loss added back (those credits post after the date of loss),
      at the rate divided by 100, times the calendar days, divided by 365, rounded half-up to the cent once at the
      end; the latest payment is the posted payment with the latest posting date.'
  factors:
  - id: bl_first_period
    effect: parameter
    decides: fp_days
    bindings:
    - fp_period_days
    - fp_days
    - fp_interest
    ladder:
    - when: the first period runs more than 50 days
      value: 20 days (K('fp_long_days'))
    - when: the first period runs 32 to 50 days
      value: the days beyond 30
    - when: otherwise (31 days or fewer)
      value: none
    baseline:
      fp_days: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: contract
  - id: bl_added_days
    effect: parameter
    decides: ad_days
    bindings:
    - ad_date
    - ad_old
    - ad_new
    - ad_moved
    - ad_days
    - ad_interest
    ladder:
    - when: the latest due-date change took effect on or before the date of loss and moved the next due date later
        by more than 15 days
      value: 15 days (K('ad_cap_days'))
    - when: it took effect on or before the date of loss and moved it later by 1 to 15 days
      value: those days
    - when: otherwise
      value: none
    baseline:
      ad_days: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: bl_due_change_count
    effect: method
    decides: dc_count
    bindings:
    - dc_date
    - dc_old_next
    - dc_new_next
    - dc_count
    ladder:
    - when: the latest due-date change took effect on or before the date of loss and its new next due date is on
        or before the date of loss
      method: whole months from the first payment date to the old next due date, plus whole months from the new
        next due date to the date of loss, plus one
    - when: the latest due-date change took effect on or before the date of loss and its new next due date is after
        the date of loss
      method: whole months from the first payment date to the old next due date
    - when: otherwise
      method: due dates counted on the first payment date's day
    baseline:
      dc_count: bl_std_count
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: bl_capped_rate_adjustment
    effect: method
    decides: sc_adjust
    bindings:
    - sc_cap_date
    - sc_cap_apr
    - sc_cap_pmt
    - sc_end_date
    - sc_end_pmt
    - sc_live
    - sc_closed
    - sc_n1
    - sc_n2
    - sc_signed_bal
    - sc_stage1
    - sc_crate
    - sc_k2
    - sc_stage2
    - sc_k3
    - sc_stage3
    - sc_adjust
    ladder:
    - when: an SCRA cap took effect on or before the date of loss and had not ended by it
      method: two-stage schedule less the signed schedule, both from the amount financed
    - when: an SCRA cap took effect and ended on or before the date of loss
      method: three-stage schedule less the signed schedule, both from the amount financed
    - when: otherwise
      method: no adjustment
    baseline:
      sc_adjust: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: contract
  - id: bl_placed_premiums
    effect: method
    decides: pp_amount
    bindings:
    - pp_refunded
    - pp_last_bill
    - pp_last_amt
    - pp_last_start
    - pp_last_end
    - pp_proof_rev
    - pp_proof_eff
    - pp_amount
    ladder:
    - when: refunds of the premiums were credited back to the contract balance
      method: premiums added less refunds credited
    - when: no refund credited and an accepted proof reviewed on or after the latest premium's billing date took
        effect within its billing period
      method: premiums added less the latest premium's share from the proof's coverage start
    - when: otherwise
      method: every premium added
    baseline:
      pp_amount: pp_added
    evidence:
    - history
    - cross_category
    cross_difficulty: cpi
  - id: bl_payment_interest
    effect: method
    decides: ai_amount
    bindings:
    - ai_last_pay
    - ai_principal
    - ai_on
    - ai_off
    - ai_cap
    - ai_live_loss
    - ai_chg
    - ai_rate_loss
    - ai_cap_from
    - ai_cap_to
    - ai_cap_days
    - ai_amount
    ladder:
    - when: latest payment on or before the loss, no rate-cap change between them
      method: per-diem interest from that payment to the loss at the rate in force
    - when: latest payment on or before the loss and a rate cap took effect, ended, or both between them
      method: per-diem interest at the rate in force on each day (the cap's rate on the capped days)
    - when: otherwise
      method: none
    baseline:
      ai_amount: '0'
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: contract
  baseline:
    rule: 'The starting balance is figured on the contract''s signed terms: the monthly rate is the contract''s
      original annual percentage rate divided by 1,200, and the level installment is the amount financed times the
      monthly rate, divided by one less the monthly rate plus one raised to the power of minus the original term
      in months, rounded half-up to the cent. Whole months from one date to a later one are the difference in calendar
      months between them, less one when the later date''s day of the month is below the earlier date''s. The installments
      the starting balance counts are the due dates from the first payment date through the date of loss, one a
      month on the first payment date''s day with a due date on the date of loss counted: the whole months from
      the first payment date to the date of loss, plus one, and none when the loss came before the first payment
      date. The scheduled principal is the opening principal, which is the amount financed, times the monthly rate
      plus one raised to the power of the installments counted, less the level installment times that power less
      one, divided by the monthly rate. The starting balance is that scheduled principal, never below 0.00, with
      every force-placed premium the contract''s insurance tracking record added to the contract balance added to
      it (the signed schedule leaves them out), rounded half-up to the cent; no interest after the last counted
      due date is added to it.'
    params: []
  inputs:
    history:
    - table: gap_activities
      aggregate: latest
      field: loss_date
      filters:
        event_type: gap_claim_filed
    - category: contract
      table: contract_servicing_events
      aggregate: latest
      field: old_next_due_date
      filters:
        event_type: contract_due_date_changed
    - category: contract
      table: contract_servicing_events
      aggregate: latest
      field: new_scheduled_payment_usd
      filters:
        event_type: contract_scra_rate_adjusted
    cross_category:
    - contract
    - cpi
    - vsc
- id: gap_ext_premier_excluded_amounts
  base_policy_refs:
  - gap_claim_benefit
  - gap_agg_contract_portfolio
  overwrite:
  - base_policy: gap_claim_benefit
    superseded_clause: less every excluded_amounts item (salvage retained by the borrower is excluded at salvage_retention_basis)
    replaced_by: On a GAP Waiver Premier 150 claim the excluded amounts the worksheet records are the Premier excluded
      total set here, and salvage retained by the borrower and prior-damage deductions, which the claim records
      do not carry, stay excluded at the claim decision as the settlement documents state them; a GAP Waiver Plus
      150 claim is itemized under the Plus excluded total, and a claim on any other plan is still reduced by every
      excluded_amounts item, salvage retained by the borrower being excluded at salvage_retention_basis.
  - base_policy: gap_agg_contract_portfolio
    superseded_clause: its unearned refund (as computed under the service-contract refund rules on the date of loss)
      is an excluded amount that reduces the GAP benefit, whether or not the refund has been issued yet
    replaced_by: For the Premier excluded total the service contract's refund enters as the add-on part set here;
      for the Plus excluded total it enters as that total's own add-on part, and on a claim on any other plan the
      unearned refund, as computed under the service-contract refund rules on the date of loss, is still an excluded
      amount whether or not it has been issued.
  - base_policy: gap_agg_contract_portfolio
    superseded_clause: premiums it added to the contract balance are excluded amounts
    replaced_by: For the Premier excluded total the force-placed premiums enter as the placed-premium part set here,
      net of refunds credited or, where the proof's coverage starts inside the latest billing period, due; for the
      Plus excluded total they enter as that total's own placed-premium part, and on a claim on any other plan every
      premium force-placed insurance added to the contract balance is still an excluded amount.
  trigger: on_request
  subject:
  - gap_claim_opened
  computes: excluded_amounts_usd
  target_tool: record_premier_claim_exclusions_258c7293
  params: {}
  rule: >-
    This rule sets the Premier excluded total: the excluded amounts that the claim worksheet records for a total-loss
    or theft claim on a GAP Waiver Premier 150 addendum, from the amounts the records of the addendum's own contract,
    of its insurance tracking record and of the service contract financed on it carry; the claim is the latest claim
    reported on the addendum. The latest claim reported on the addendum is the claim with the latest reporting date,
    and where two claims were reported on that date the one recorded first on the addendum counts. The Premier excluded
    total is the sum of six parts, added without rounding and then rounded half-up to the cent: the past-due part,
    the fee part, the deferral part, the placed-premium part, the add-on part and the uncovered-deductible part.
    Whole months from one date to a later one are the difference in calendar months between them, less one when
    the later date's day of the month is below the earlier date's. The installments the Premier excluded total treats
    as past due are the installments still unpaid that fell due on or before the date of loss, counted from the
    contract's next due date one a month through the date of loss: the whole months from the next due date to the
    date of loss, plus one, and none when the next due date is after the date of loss. The past-due part of the
    Premier excluded total is the installments it counts, which are all the installments treated as past due, times
    the installment amount it uses, which is the contract's scheduled payment, less the partial installment credit
    the contract carries, never below 0.00. The fee part of the Premier excluded total is the fees due the contract
    carries less the late charges assessed on installments that fell due after the date of loss, never below 0.00;
    the installments that fell due after the date of loss are those whose due date is fewer whole months before
    today than the whole months from the contract's next due date to today less the whole months from the next due
    date to the date of loss. The deferral part of the Premier excluded total is the deferred installments it counts,
    which are all the installments deferred by every extension the contract records, times the installment amount
    it uses, which is the contract's scheduled payment. The placed-premium part of the Premier excluded total is
    every force-placed premium the insurance tracking record added to the contract balance. The add-on part of the
    Premier excluded total is the price of the service contract financed on the contract times the calendar days
    from the date of loss to its expiration date divided by the calendar days from its enrollment date to its expiration
    date, rounded half-up to the cent, when it was enrolled on or before the date of loss and expires after it;
    it is 0.00 when there is no such service contract. The uncovered-deductible part of the Premier excluded total
    is the primary deductible the claim shows less the deductible covered the claim shows, never below 0.00. The
    Premier excluded total is fixed only after the borrower's claim for the Premier deductible reimbursement is
    recorded on the claim. The installments the past-due part of the Premier excluded total counts follow how many
    installments it treats as past due: one, none is counted; two, one is counted; three or more, all are counted.
    The installment amount the past-due part of the Premier excluded total uses follows the Servicemembers Civil
    Relief Act rate cap the contract records (its latest cap-applied and latest cap-ended records): when a cap was
    in effect on the contract's next due date and had not ended by the date of loss, it is the installment the cap
    set; when a cap in effect on the next due date ended on or before the date of loss, it is the average, over
    the installments treated as past due, of the cap's installment for those falling due on or before the cap's
    end date and the restored installment for the rest; otherwise it is the contract's scheduled payment. The deferred
    installments the deferral part of the Premier excluded total counts follow the installments deferred by every
    extension the contract records: one in total, none is counted; two or three, all but one are counted; otherwise
    all are counted. The installment amount the deferral part of the Premier excluded total uses follows the rate
    cap in effect on the effective date of the latest extension the contract records: when a cap had taken effect
    on or before that date and had not ended by it, it is the installment the cap set; when that extension took
    effect before a cap that has not ended, it is the level installment of the signed terms (the amount financed
    times the monthly rate, the original annual percentage rate divided by 1,200, divided by one less the monthly
    rate plus one raised to the power of minus the original term in months, rounded half-up to the cent); otherwise
    it is the contract's scheduled payment. The latest cap-applied record, the latest cap-ended record and the latest
    extension the contract records are each the record of its kind with the latest effective date, and where two
    records of one kind share that date the one recorded first counts. The placed-premium part of the Premier excluded
    total follows how the placement ended: when refunds of those premiums were credited back to the contract balance,
    it is the premiums added less the refunds credited; when no refund has been credited and the latest accepted
    proof of insurance was reviewed on or after the billing date of the latest premium added and its policy effective
    date falls within that premium's billing period, it is the premiums added less that latest premium's share for
    the days of its billing period from the proof's policy effective date on (the premium times those days divided
    by the days of its billing period, both counted inclusive, rounded half-up to the cent), which is the whole
    refund the collateral protection terms leave due when the proof's coverage starts inside the latest billing
    period; otherwise, including a proof whose coverage starts before the latest billing period while its refund
    is not yet credited, it is every premium added. The latest premium added is the force-placed premium whose billing
    period starts latest, whatever its billing date, since a backdated placement bills two or more premiums on one
    day while no two premiums share a billing period. The latest proof of insurance the tracking record shows as
    accepted is the accepted proof with the latest review date, and where two accepted proofs were reviewed on that
    date the one recorded first counts. The add-on part of the Premier excluded total follows the service contract
    financed on the contract: when it was cancelled for the total loss, it is its refund under its own terms, which
    is the refund issued or, while none has been issued, its price times one less the larger of the share of its
    term in days used to the cancellation effective date and the share of its term in miles used to the cancellation
    odometer, that share never above one, rounded half-up to the cent, less the claims it paid (authorized amounts
    less deductibles) and less its cancellation fee, never below 0.00 and 0.00 when below its minimum refund; when
    it was cancelled for any other reason with an effective date before the date of loss, it is 0.00; otherwise
    it is the day-prorated price set out above. Each part of the Premier excluded total is figured with the count,
    the installment amount or the amount its own rule sets; the six parts so figured are the ones added. On a GAP
    Waiver Premier 150 claim the excluded amounts the worksheet records are the Premier excluded total set here,
    and salvage retained by the borrower and prior-damage deductions, which the claim records do not carry, stay
    excluded at the claim decision as the settlement documents state them; a GAP Waiver Plus 150 claim is itemized
    under the Plus excluded total, and a claim on any other plan is still reduced by every excluded_amounts item,
    salvage retained by the borrower being excluded at salvage_retention_basis. For the Premier excluded total the
    service contract's refund enters as the add-on part set here; for the Plus excluded total it enters as that
    total's own add-on part, and on a claim on any other plan the unearned refund, as computed under the service-contract
    refund rules on the date of loss, is still an excluded amount whether or not it has been issued. For the Premier
    excluded total the force-placed premiums enter as the placed-premium part set here, net of refunds credited
    or, where the proof's coverage starts inside the latest billing period, due; for the Plus excluded total they
    enter as that total's own placed-premium part, and on a claim on any other plan every premium force-placed insurance
    added to the contract balance is still an excluded amount.
  prerequisite:
  - problem: gap_ext_premier_deductible_reimbursement
    kind: value_input
    gate: ep_covered
    form: action
    policy_source: The Premier excluded total is fixed only after the borrower's claim for the Premier deductible
      reimbursement is recorded on the claim.
    fallback_reason: the reimbursement is 0.00 when the deductible withheld exceeds the contract's allowance on
      a policy never put before the company, which leaves the claim's deductible covered exactly as it stood, so
      no record state singles out that the claim was made
    condition: the claim row carries deductible_covered_usd as the Premier deductible reimbursement sets it
    resolved_by: claim_premier_deductible_reimbursement_7815b2b6
    effect: ep_covered changes from 0.00 to the deductible covered the borrower claimed, so the uncovered-deductible
      part drops from the whole primary deductible to the part not covered
  cross_category:
  - category: contract
    as: history
    reads:
    - next_due_date
    - partial_installment_credit_usd
    - scheduled_payment_usd
    - fees_due_usd
    - amount_financed_usd
    - original_apr_pct
    - term_months
    - contract_servicing_events.extension_months
    - contract_servicing_events.new_scheduled_payment_usd
    note: Past-due and deferral counts and installment amounts are decided from the contract and its servicing ledger.
  - category: cpi
    as: history
    reads:
    - cpi_activities.amount_usd
    - cpi_activities.billing_period_start
    - cpi_activities.policy_effective_date
    note: The placed-premium basis is decided from the premiums, refunds and proofs of the tracking record.
  - category: vsc
    as: history
    reads:
    - price_usd
    - status
    - cancellation_reason
    - cancellation_effective_date
    - cancellation_odometer
    - odometer_at_sale
    - expiration_odometer
    - vsc_activities.amount_usd
    note: The add-on basis is decided from the service contract and its refund and claim rows.
  compute:
  - ep_loss: LATEST('gap_activities','loss_date', date_field='activity_date', event_type='gap_claim_filed')
  - ep_deducted: SUM('gap_activities','primary_deductible_usd', event_type='gap_claim_filed', loss_date=ep_loss)
  - ep_covered: SUM('gap_activities','deductible_covered_usd', event_type='gap_claim_filed', loss_date=ep_loss)
  - ep_next_due: CFIELD('contract','next_due_date', contract_id=F('contract_id'))
  - ep_credit: CFIELD('contract','partial_installment_credit_usd', contract_id=F('contract_id'))
  - ep_pmt: CFIELD('contract','scheduled_payment_usd', contract_id=F('contract_id'))
  - ep_unpaid: (MONTHS(ep_next_due, ep_loss) + 1) if ep_next_due <= ep_loss else 0
  - ep_post_window: MONTHS(ep_next_due, NOW) - MONTHS(ep_next_due, ep_loss)
  - ep_post_late: XSUM('contract','contract_transactions','amount_usd', within_months=ep_post_window, date_field='installment_due_date',
      event_type='contract_fee_assessed', fee_type='late_charge', contract_id=F('contract_id')) if ep_post_window
      >= 1 else 0
  - ep_fees: MX(0, CFIELD('contract','fees_due_usd', contract_id=F('contract_id')) - ep_post_late)
  - ep_prem_added: XSUM('cpi','cpi_activities','amount_usd', event_type='cpi_premium_charged', billing_method='added_to_contract_balance',
      contract_id=F('contract_id'))
  - ep_vsc_price: CFIELD('vsc','price_usd', contract_id=F('contract_id'))
  - ep_vsc_enroll: CFIELD('vsc','enrollment_date', contract_id=F('contract_id'))
  - ep_vsc_expire: CFIELD('vsc','expiration_date', contract_id=F('contract_id'))
  - ep_vsc_estimate: RND(ep_vsc_price * DAYS(ep_loss, ep_vsc_expire) / DAYS(ep_vsc_enroll, ep_vsc_expire), 2) if
      (ep_vsc_price != None and ep_vsc_enroll <= ep_loss and ep_vsc_expire > ep_loss) else 0
  - ep_pd_n: (MONTHS(CFIELD('contract','next_due_date', contract_id=F('contract_id')), ep_loss) + 1) if CFIELD('contract','next_due_date',
      contract_id=F('contract_id')) <= ep_loss else 0
  - ep_pd_count: 0 if ep_pd_n == 1 else (1 if ep_pd_n == 2 else ep_pd_n)
  - ep_pcap_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ep_pcap_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ep_pend_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - ep_pend_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - ep_pcap_n: MN(ep_unpaid, MONTHS(ep_next_due, ep_pend_date) + 1) if (ep_pend_date != None and ep_next_due <=
      ep_pend_date) else 0
  - ep_pd_inst: ep_pcap_pmt if (ep_pcap_date != None and ep_pcap_date <= ep_next_due and (ep_pend_date == None or
      ep_pend_date > ep_loss)) else (((ep_pcap_n * ep_pcap_pmt + (ep_unpaid - ep_pcap_n) * ep_pend_pmt) / ep_unpaid)
      if (ep_pcap_date != None and ep_pcap_date <= ep_next_due and ep_pend_date != None and ep_pend_date > ep_next_due
      and ep_pend_date <= ep_loss and ep_unpaid >= 1) else ep_pmt)
  - ep_df_months: XSUM('contract','contract_servicing_events','extension_months', event_type='contract_extension_granted',
      contract_id=F('contract_id'))
  - ep_df_count: 0 if ep_df_months == 1 else ((ep_df_months - 1) if (ep_df_months >= 2 and ep_df_months <= 3) else
      ep_df_months)
  - ep_ext_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date', event_type='contract_extension_granted',
      contract_id=F('contract_id'))
  - ep_dcap_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ep_dcap_pmt: XLATEST('contract','contract_servicing_events','new_scheduled_payment_usd', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))
  - ep_dend_date: XLATEST('contract','contract_servicing_events','effective_date', date_field='effective_date',
      event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))
  - ep_d_rate: CFIELD('contract','original_apr_pct', contract_id=F('contract_id')) / 1200
  - ep_d_level: RND(CFIELD('contract','amount_financed_usd', contract_id=F('contract_id')) * ep_d_rate / (1 - (1
      + ep_d_rate) ** (-CFIELD('contract','term_months', contract_id=F('contract_id')))), 2)
  - ep_df_inst: ep_dcap_pmt if (ep_ext_date != None and ep_dcap_date != None and ep_dcap_date <= ep_ext_date and
      (ep_dend_date == None or ep_dend_date > ep_ext_date)) else (ep_d_level if (ep_ext_date != None and ep_dcap_date
      != None and ep_dcap_date > ep_ext_date and ep_dend_date == None) else ep_pmt)
  - ep_prem_refunded: XSUM('cpi','cpi_activities','amount_usd', event_type='cpi_premium_refunded', refund_disposition='credited_to_contract_balance',
      contract_id=F('contract_id'))
  - ep_last_bill: XLATEST('cpi','cpi_activities','activity_date', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - ep_last_amt: XLATEST('cpi','cpi_activities','amount_usd', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - ep_last_start: XLATEST('cpi','cpi_activities','billing_period_start', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - ep_last_end: XLATEST('cpi','cpi_activities','billing_period_end', date_field='billing_period_start', event_type='cpi_premium_charged',
      billing_method='added_to_contract_balance', contract_id=F('contract_id'))
  - ep_proof_rev: XLATEST('cpi','cpi_activities','activity_date', date_field='activity_date', event_type='cpi_proof_verified',
      proof_result='accepted', contract_id=F('contract_id'))
  - ep_proof_eff: XLATEST('cpi','cpi_activities','policy_effective_date', date_field='activity_date', event_type='cpi_proof_verified',
      proof_result='accepted', contract_id=F('contract_id'))
  - ep_pending: RND(ep_last_amt * (DAYS(ep_proof_eff, ep_last_end) + 1) / (DAYS(ep_last_start, ep_last_end) + 1),
      2) if (ep_last_bill != None and ep_proof_rev != None and ep_proof_rev >= ep_last_bill and ep_proof_eff >=
      ep_last_start and ep_proof_eff <= ep_last_end) else 0
  - ep_premium: MX(0, ep_prem_added - ep_prem_refunded) if ep_prem_refunded > 0 else (MX(0, ep_prem_added - ep_pending)
      if (ep_last_bill != None and ep_proof_rev != None and ep_proof_rev >= ep_last_bill and ep_proof_eff >= ep_last_start
      and ep_proof_eff <= ep_last_end) else ep_prem_added)
  - ep_vsc_status: CFIELD('vsc','status', contract_id=F('contract_id'))
  - ep_vsc_reason: CFIELD('vsc','cancellation_reason', contract_id=F('contract_id'))
  - ep_vsc_cdate: CFIELD('vsc','cancellation_effective_date', contract_id=F('contract_id'))
  - ep_vsc_codo: CFIELD('vsc','cancellation_odometer', contract_id=F('contract_id'))
  - ep_vsc_sodo: CFIELD('vsc','odometer_at_sale', contract_id=F('contract_id'))
  - ep_vsc_eodo: CFIELD('vsc','expiration_odometer', contract_id=F('contract_id'))
  - ep_vsc_fee: CPARAM('vsc','cancellation_fee_usd', contract_id=F('contract_id'))
  - ep_vsc_min: CPARAM('vsc','min_refund_usd', contract_id=F('contract_id'))
  - ep_vsc_refunds: XCOUNT('vsc','vsc_activities', event_type='vsc_refund_issued', contract_id=F('contract_id'))
  - ep_vsc_issued: XSUM('vsc','vsc_activities','amount_usd', event_type='vsc_refund_issued', contract_id=F('contract_id'))
  - ep_vsc_claims: XSUM('vsc','vsc_activities','authorized_amount_usd', event_type='vsc_claim_authorized', contract_id=F('contract_id'))
      - XSUM('vsc','vsc_activities','deductible_usd', event_type='vsc_claim_authorized', contract_id=F('contract_id'))
  - ep_vsc_formula: MX(0, RND(ep_vsc_price * (1 - MN(1, MX(DAYS(ep_vsc_enroll, ep_vsc_cdate) / DAYS(ep_vsc_enroll,
      ep_vsc_expire), (ep_vsc_codo - ep_vsc_sodo) / (ep_vsc_eodo - ep_vsc_sodo)))), 2) - ep_vsc_claims - ep_vsc_fee)
      if (ep_vsc_status == 'cancelled' and ep_vsc_reason == 'total_loss') else 0
  - ep_vsc_own: ep_vsc_issued if ep_vsc_refunds >= 1 else ((ep_vsc_formula if ep_vsc_formula >= ep_vsc_min else
      0) if ep_vsc_min != None else 0)
  - ep_addon: ep_vsc_own if (ep_vsc_status == 'cancelled' and ep_vsc_reason == 'total_loss') else (0 if (ep_vsc_status
      == 'cancelled' and ep_vsc_cdate != '' and ep_vsc_cdate < ep_loss) else ep_vsc_estimate)
  - ep_pastdue: MX(0, ep_pd_count * ep_pd_inst - ep_credit) if ep_pd_count >= 1 else 0
  - ep_deferral: ep_df_count * ep_df_inst
  - ep_uncovered: MX(0, ep_deducted - ep_covered)
  - result: RND(ep_pastdue + ep_fees + ep_deferral + ep_premium + ep_addon + ep_uncovered, 2)
  compute_basis:
    ep_loss: The latest claim reported on the addendum is the claim with the latest reporting date, and where two
      claims were reported on that date the one recorded first on the addendum counts.
    ep_deducted: The uncovered-deductible part of the Premier excluded total is the primary deductible the claim
      shows less the deductible covered the claim shows, never below 0.00.
    ep_covered: The uncovered-deductible part of the Premier excluded total is the primary deductible the claim
      shows less the deductible covered the claim shows, never below 0.00.
    ep_uncovered: The uncovered-deductible part of the Premier excluded total is the primary deductible the claim
      shows less the deductible covered the claim shows, never below 0.00.
    ep_next_due: 'The installments the Premier excluded total treats as past due are the installments still unpaid
      that fell due on or before the date of loss, counted from the contract''s next due date one a month through
      the date of loss: the whole months from the next due date to the date of loss, plus one, and none when the
      next due date is after the date of loss.'
    ep_unpaid: 'The installments the Premier excluded total treats as past due are the installments still unpaid
      that fell due on or before the date of loss, counted from the contract''s next due date one a month through
      the date of loss: the whole months from the next due date to the date of loss, plus one, and none when the
      next due date is after the date of loss.'
    ep_credit: The past-due part of the Premier excluded total is the installments it counts, which are all the
      installments treated as past due, times the installment amount it uses, which is the contract's scheduled
      payment, less the partial installment credit the contract carries, never below 0.00.
    ep_pmt: The past-due part of the Premier excluded total is the installments it counts, which are all the installments
      treated as past due, times the installment amount it uses, which is the contract's scheduled payment, less
      the partial installment credit the contract carries, never below 0.00.
    ep_prem_added: The placed-premium part of the Premier excluded total is every force-placed premium the insurance
      tracking record added to the contract balance.
    ep_vsc_price: The add-on part of the Premier excluded total is the price of the service contract financed on
      the contract times the calendar days from the date of loss to its expiration date divided by the calendar
      days from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled on
      or before the date of loss and expires after it; it is 0.00 when there is no such service contract.
    ep_vsc_enroll: The add-on part of the Premier excluded total is the price of the service contract financed on
      the contract times the calendar days from the date of loss to its expiration date divided by the calendar
      days from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled on
      or before the date of loss and expires after it; it is 0.00 when there is no such service contract.
    ep_vsc_expire: The add-on part of the Premier excluded total is the price of the service contract financed on
      the contract times the calendar days from the date of loss to its expiration date divided by the calendar
      days from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled on
      or before the date of loss and expires after it; it is 0.00 when there is no such service contract.
    ep_vsc_estimate: The add-on part of the Premier excluded total is the price of the service contract financed
      on the contract times the calendar days from the date of loss to its expiration date divided by the calendar
      days from its enrollment date to its expiration date, rounded half-up to the cent, when it was enrolled on
      or before the date of loss and expires after it; it is 0.00 when there is no such service contract.
    ep_pd_count: 'The installments the past-due part of the Premier excluded total counts follow how many installments
      it treats as past due: one, none is counted; two, one is counted; three or more, all are counted.'
    ep_pcap_date: 'The installment amount the past-due part of the Premier excluded total uses follows the Servicemembers
      Civil Relief Act rate cap the contract records (its latest cap-applied and latest cap-ended records): when
      a cap was in effect on the contract''s next due date and had not ended by the date of loss, it is the installment
      the cap set; when a cap in effect on the next due date ended on or before the date of loss, it is the average,
      over the installments treated as past due, of the cap''s installment for those falling due on or before the
      cap''s end date and the restored installment for the rest; otherwise it is the contract''s scheduled payment.'
    ep_pcap_pmt: 'The installment amount the past-due part of the Premier excluded total uses follows the Servicemembers
