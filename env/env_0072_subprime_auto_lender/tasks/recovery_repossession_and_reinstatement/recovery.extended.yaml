  - id: recovery_ext_redemption_expense_payment
    base_policy_refs: [recovery_disposition, recovery_redemption, recovery_evt_expenses]
    overwrite:
      - base_policy: recovery_disposition
        superseded_clause: >-
          Recovery expenses are settled only when the case is reinstated, redeemed or sold.
        replaced_by: >-
          Recovery expenses on a case in recovered status are also settled by the borrower's own redemption expense payment or by the borrower's own reinstatement expense payment, each as its own rule sets out; every other settlement of recovery expenses is made only when the case is reinstated, redeemed or sold.
      - base_policy: recovery_redemption
        superseded_clause: >-
          plus the case's recovery expenses outstanding through that date (recovery_msr_expenses_outstanding)
        replaced_by: >-
          The expense portion of a redemption is the redemption expense payment this rule figures, paid by the borrower in person against the case's recovery expenses through a certified payment channel; the contract portion of a redemption stays the contract's full payoff on the payment date.
      - base_policy: recovery_evt_expenses
        superseded_clause: >-
          Storage is posted once, on the date the vehicle is released or sold, for every chargeable day up to that date.
        replaced_by: >-
          Storage covered by a borrower's own redemption expense payment or reinstatement expense payment is settled by that payment and is never posted for those days; all other storage is posted once, on the date the vehicle is released or sold, for every chargeable day up to that date that no such payment covered.
      - base_policy: recovery_evt_expenses
        superseded_clause: >-
          storage at storage_fee_per_day_usd for each chargeable day (recovery_msr_chargeable_storage_days, recorded in chargeable_days)
        replaced_by: >-
          Storage that the borrower's own redemption expense payment covers is charged as this rule sets out, and storage that the borrower's own reinstatement expense payment covers is charged by its own reinstatement expense payment rule; storage posted on release or sale, and storage in the expenses a reinstatement quote states, is charged at storage_fee_per_day_usd for each chargeable day (recovery_msr_chargeable_storage_days, recorded in chargeable_days).
    trigger: on_request
    subject: [recovery_expense_settled]
    computes: amount_usd
    target_tool: pay_redemption_recovery_expenses_4986a691
    params:
      rate_states_a: ["GA", "MN", "WI"]
      rate_a_usd: 20.0
      rate_states_b: ["IL", "OH", "PA"]
      rate_b_usd: 22.0
      extended_grace_lots: ["Lakeshore Vehicle Storage - Milwaukee", "Twin Ports Auto Storage - Duluth"]
      extended_grace_days: 5
      no_grace_lots: ["Peachtree Auto Holding - Forest Park", "Lake Erie Auto Storage - Cleveland"]
      no_grace_days: 0
      extended_grace_window_days: 30
      saturday_clock_shift_days: 2
      sunday_clock_shift_days: 1
      keyless_flatbed_day_usd: 12.0
      keyless_wheel_lift_day_usd: 8.0
      monday_reference_date: "2026-01-05"
    rule: >-
      Recovery expenses on a case in recovered status are also settled by the borrower's own redemption expense payment or by the borrower's own reinstatement expense payment, each as its own rule sets out; every other settlement of recovery expenses is made only when the case is reinstated, redeemed or sold.
      The expense portion of a redemption is the redemption expense payment this rule figures, paid by the borrower in person against the case's recovery expenses through a certified payment channel; the contract portion of a redemption stays the contract's full payoff on the payment date.
      Storage covered by a borrower's own redemption expense payment or reinstatement expense payment is settled by that payment and is never posted for those days; all other storage is posted once, on the date the vehicle is released or sold, for every chargeable day up to that date that no such payment covered.
      Storage that the borrower's own redemption expense payment covers is charged as this rule sets out, and storage that the borrower's own reinstatement expense payment covers is charged by its own reinstatement expense payment rule; storage posted on release or sale, and storage in the expenses a reinstatement quote states, is charged at storage_fee_per_day_usd for each chargeable day (recovery_msr_chargeable_storage_days, recorded in chargeable_days).
      On a case whose vehicle an agency recovered involuntarily, the redemption expense payment is not fixed until the agency's involuntary repossession fee stands posted on the case.
      The redemption expense payment is fixed only after the latest earliest sale date stated on the case is stated by at least one notice of intent to sell that allows the class minimum notice period between its own mailing date and that date.
      The redemption expense payment is the case's posted recovery expenses not yet removed or settled, plus the storage the payment covers.
      The storage the redemption expense payment covers runs through the payment date, or through the latest earliest sale date stated in any notice of intent to sell on the case when that date is earlier; the days held are the calendar days from the day after the recovery_date through that end date, the class storage_free_days are deducted from the days held, the chargeable days never fall below zero nor exceed storage_max_days_chargeable, and each chargeable day is charged at the class storage_fee_per_day_usd.
      For the redemption expense payment, where the contract's state_code is one of rate_states_a, the storage day rate is rate_a_usd; where it is one of rate_states_b, the storage day rate is rate_b_usd; in any other state the storage day rate is the class storage_fee_per_day_usd.
      For the redemption expense payment, where the case's storage_lot is one of extended_grace_lots and the payment date is no more than extended_grace_window_days calendar days after the recovery_date, the grace days deducted are extended_grace_days; where the storage_lot is one of no_grace_lots, the grace days deducted are no_grace_days; in every other case the grace days deducted are the class storage_free_days.
      For the redemption expense payment, where the recovery_method is impound_release, the storage clock starts the day after the activity_date of the latest impound_lot_charges expense on the case, or the day after the recovery_date where none is posted; where the recovery_method is not impound_release and the recovery_date fell on a Saturday or a Sunday, the storage clock starts the day after the following Monday, that is saturday_clock_shift_days days later for a Saturday and sunday_clock_shift_days day later for a Sunday than the day after the recovery_date; otherwise the storage clock starts the day after the recovery_date; the days held are counted from the day the storage clock starts through the end date.
      For the redemption expense payment, when keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is flatbed or medium_duty_flatbed, keyless_flatbed_day_usd is added to every chargeable day; when keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is wheel_lift, keyless_wheel_lift_day_usd is added to every chargeable day; when keys_obtained is true or a key_replacement_fee expense is posted on the case, nothing is added.
      The redemption expense payment is assembled in this fixed order: the days not charged are deducted from the days held, the remainder is floored at zero and then limited to storage_max_days_chargeable, each remaining chargeable day is charged at its day rate together with any per-day addition, and that storage is added to the posted recovery expenses not yet removed or settled; the total is rounded to the cent.
    prerequisite:
      - problem: recovery_ext_agency_fee
        kind: value_input
        gate: posted_open
        form: state
        policy_source: >-
          On a case whose vehicle an agency recovered involuntarily, the redemption expense payment is not fixed until the agency's involuntary repossession fee stands posted on the case.
        condition: >-
          On an involuntary_recovery case, a recovery_expense_posted row with expense_type involuntary_repossession_fee stands on the case at the payment's handling time.
        resolved_by: post_agency_recovery_fee_54cbecc0
        effect: >-
          The posted recovery expenses not yet removed or settled (posted_open) rise by the agency recovery fee, so the redemption expense payment rises by the same amount.
      - problem: recovery_ext_sale_notice_period
        kind: value_input
        gate: end_offset
        form: state
        policy_source: >-
          The redemption expense payment is fixed only after the latest earliest sale date stated on the case is stated by at least one notice of intent to sell that allows the class minimum notice period between its own mailing date and that date.
        condition: >-
          Among the case's recovery_notice_sent rows with notice_type notice_of_intent_to_sell, at least one row carrying the latest deadline_date has that deadline_date at least noi_min_days_before_sale calendar days after its own activity_date.
        resolved_by: mail_corrected_sale_notice_6ba1fcf2
        effect: >-
          The latest stated earliest sale date moves past the payment date, so the storage end date (end_offset) becomes the payment date instead of the short notice's earlier stated date and more storage days are covered.
    cross_category:
      - category: contract
        as: branch
        reads: [state_code]
        note: The contract state decides the storage day rate tier.
    compute:
      - posted_open: "MX(0, SUM('recovery_activities', 'amount_usd', event_type='recovery_expense_posted') - SUM('recovery_activities', 'amount_usd', event_type='recovery_expense_waived') - SUM('recovery_activities', 'amount_usd', event_type='recovery_expense_settled'))"
      - latest_sale_date: "LATEST('recovery_activities', 'deadline_date', date_field='deadline_date', event_type='recovery_notice_sent', notice_type='notice_of_intent_to_sell')"
      - end_offset: "MN(DAYS(F('recovery_date'), NOW), DAYS(F('recovery_date'), latest_sale_date)) if latest_sale_date else DAYS(F('recovery_date'), NOW)"
      - contract_state: "CFIELD('contract', 'state_code', contract_id=F('contract_id'))"
      - day_rate: "K('rate_a_usd') if contract_state in K('rate_states_a') else (K('rate_b_usd') if contract_state in K('rate_states_b') else P('storage_fee_per_day_usd'))"
      - free_days: "K('extended_grace_days') if F('storage_lot') in K('extended_grace_lots') and DAYS(F('recovery_date'), NOW) <= K('extended_grace_window_days') else (K('no_grace_days') if F('storage_lot') in K('no_grace_lots') else P('storage_free_days'))"
      - recovery_weekday: "DAYS(K('monday_reference_date'), F('recovery_date')) % 7"
      - impound_post_date: "LATEST('recovery_activities', 'activity_date', date_field='activity_date', event_type='recovery_expense_posted', expense_type='impound_lot_charges')"
      - held_days: "((end_offset - DAYS(F('recovery_date'), impound_post_date)) if impound_post_date else end_offset) if F('recovery_method') == 'impound_release' else ((end_offset - (K('saturday_clock_shift_days') if recovery_weekday == 5 else K('sunday_clock_shift_days'))) if recovery_weekday >= 5 else end_offset)"
      - key_cut_count: "COUNT('recovery_activities', event_type='recovery_expense_posted', expense_type='key_replacement_fee')"
      - keyless_day_charge: "K('keyless_flatbed_day_usd') if F('keys_obtained') == False and key_cut_count == 0 and P('tow_equipment') != 'wheel_lift' else (K('keyless_wheel_lift_day_usd') if F('keys_obtained') == False and key_cut_count == 0 and P('tow_equipment') == 'wheel_lift' else 0)"
      - result: "RND(posted_open + (day_rate + keyless_day_charge) * MN(MX(held_days - free_days, 0), P('storage_max_days_chargeable')), 2)"
    compute_basis:
      posted_open: "The redemption expense payment is the case's posted recovery expenses not yet removed or settled, plus the storage the payment covers."
      latest_sale_date: "or through the latest earliest sale date stated in any notice of intent to sell on the case when that date is earlier"
      end_offset: "The storage the redemption expense payment covers runs through the payment date, or through the latest earliest sale date stated in any notice of intent to sell on the case when that date is earlier"
      contract_state: "For the redemption expense payment, where the contract's state_code is one of rate_states_a"
      day_rate: "For the redemption expense payment, where the contract's state_code is one of rate_states_a, the storage day rate is rate_a_usd; where it is one of rate_states_b, the storage day rate is rate_b_usd; in any other state the storage day rate is the class storage_fee_per_day_usd."
      free_days: "For the redemption expense payment, where the case's storage_lot is one of extended_grace_lots and the payment date is no more than extended_grace_window_days calendar days after the recovery_date, the grace days deducted are extended_grace_days; where the storage_lot is one of no_grace_lots, the grace days deducted are no_grace_days; in every other case the grace days deducted are the class storage_free_days."
      recovery_weekday: "the recovery_date fell on a Saturday or a Sunday"
      impound_post_date: "the storage clock starts the day after the activity_date of the latest impound_lot_charges expense on the case, or the day after the recovery_date where none is posted"
      held_days: "For the redemption expense payment, where the recovery_method is impound_release, the storage clock starts the day after the activity_date of the latest impound_lot_charges expense on the case, or the day after the recovery_date where none is posted; where the recovery_method is not impound_release and the recovery_date fell on a Saturday or a Sunday, the storage clock starts the day after the following Monday, that is saturday_clock_shift_days days later for a Saturday and sunday_clock_shift_days day later for a Sunday than the day after the recovery_date; otherwise the storage clock starts the day after the recovery_date; the days held are counted from the day the storage clock starts through the end date."
      keyless_day_charge: "For the redemption expense payment, when keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is flatbed or medium_duty_flatbed, keyless_flatbed_day_usd is added to every chargeable day; when keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is wheel_lift, keyless_wheel_lift_day_usd is added to every chargeable day; when keys_obtained is true or a key_replacement_fee expense is posted on the case, nothing is added."
      result: "The redemption expense payment is assembled in this fixed order: the days not charged are deducted from the days held, the remainder is floored at zero and then limited to storage_max_days_chargeable, each remaining chargeable day is charged at its day rate together with any per-day addition, and that storage is added to the posted recovery expenses not yet removed or settled; the total is rounded to the cent."
    factors:
      - id: lot_day_rate
        effect: parameter
        decides: day_rate
        bindings: [contract_state, day_rate]
        ladder:
          - when: "the contract's state_code is one of rate_states_a"
            value: "K('rate_a_usd')"
          - when: "the contract's state_code is one of rate_states_b"
            value: "K('rate_b_usd')"
          - when: "otherwise"
            value: "P('storage_fee_per_day_usd')"
