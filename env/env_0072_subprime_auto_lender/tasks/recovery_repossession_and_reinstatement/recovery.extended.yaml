  - id: recovery_ext_reinstatement_expense_payment
    base_policy_refs: [recovery_disposition, recovery_reinstatement, recovery_evt_expenses]
    overwrite:
      - base_policy: recovery_disposition
        superseded_clause: >-
          Recovery expenses are settled only when the case is reinstated, redeemed or sold.
        replaced_by: >-
          Recovery expenses on a case in recovered status are also settled by the borrower's own redemption expense payment or by the borrower's own reinstatement expense payment, each as its own rule sets out; every other settlement of recovery expenses is made only when the case is reinstated, redeemed or sold.
      - base_policy: recovery_reinstatement
        superseded_clause: >-
          the contract portion posts to the contract as a reinstatement payment and the expense portion settles the case's expenses
        replaced_by: >-
          The contract portion of a reinstatement posts to the contract as a reinstatement payment, and the case's recovery expenses are settled by the borrower's own reinstatement expense payment, paid in person through a certified payment channel and figured by this rule through the payment date in place of the expense portion a reinstatement quote states; a reinstatement quote keeps stating the case's recovery expenses outstanding through its good-through date including storage accrued to it at storage_fee_per_day_usd.
      - base_policy: recovery_evt_expenses
        superseded_clause: >-
          Storage is posted once, on the date the vehicle is released or sold, for every chargeable day up to that date.
        replaced_by: >-
          Storage covered by a borrower's own redemption expense payment or reinstatement expense payment is settled by that payment and is never posted for those days; all other storage is posted once, on the date the vehicle is released or sold, for every chargeable day up to that date that no such payment covered.
      - base_policy: recovery_evt_expenses
        superseded_clause: >-
          storage at storage_fee_per_day_usd for each chargeable day (recovery_msr_chargeable_storage_days, recorded in chargeable_days)
        replaced_by: >-
          Storage that the borrower's own reinstatement expense payment covers is charged as this rule sets out, and storage that the borrower's own redemption expense payment covers is charged by its own redemption expense payment rule; storage posted on release or sale, and storage in the expenses a reinstatement quote states, is charged at storage_fee_per_day_usd for each chargeable day (recovery_msr_chargeable_storage_days, recorded in chargeable_days).
    trigger: on_request
    subject: [recovery_expense_settled]
    computes: amount_usd
    target_tool: pay_reinstatement_recovery_expenses_82a1a2b9
    params:
      rate_states_a: ["GA", "MN", "WI"]
      rate_a_usd: 20.0
      rate_states_b: ["IL", "OH", "PA"]
      rate_b_usd: 22.0
      extended_grace_lots: ["Lakeshore Vehicle Storage - Milwaukee", "Twin Ports Auto Storage - Duluth"]
      extended_grace_days: 5
      no_grace_lots: ["Peachtree Auto Holding - Forest Park", "Lake Erie Auto Storage - Cleveland"]
      no_grace_days: 0
      extended_grace_window_days: 30
      saturday_clock_shift_days: 2
      sunday_clock_shift_days: 1
      keyless_flatbed_day_usd: 12.0
      keyless_wheel_lift_day_usd: 8.0
      monday_reference_date: "2026-01-05"
    rule: >-
      Recovery expenses on a case in recovered status are also settled by the borrower's own redemption expense payment or by the borrower's own reinstatement expense payment, each as its own rule sets out; every other settlement of recovery expenses is made only when the case is reinstated, redeemed or sold.
      The contract portion of a reinstatement posts to the contract as a reinstatement payment, and the case's recovery expenses are settled by the borrower's own reinstatement expense payment, paid in person through a certified payment channel and figured by this rule through the payment date in place of the expense portion a reinstatement quote states; a reinstatement quote keeps stating the case's recovery expenses outstanding through its good-through date including storage accrued to it at storage_fee_per_day_usd.
      Storage covered by a borrower's own redemption expense payment or reinstatement expense payment is settled by that payment and is never posted for those days; all other storage is posted once, on the date the vehicle is released or sold, for every chargeable day up to that date that no such payment covered.
      Storage that the borrower's own reinstatement expense payment covers is charged as this rule sets out, and storage that the borrower's own redemption expense payment covers is charged by its own redemption expense payment rule; storage posted on release or sale, and storage in the expenses a reinstatement quote states, is charged at storage_fee_per_day_usd for each chargeable day (recovery_msr_chargeable_storage_days, recorded in chargeable_days).
      On a case whose vehicle the borrower surrendered voluntarily, the reinstatement expense payment is fixed only after the voluntary surrender fee stands posted on the case.
      The reinstatement expense payment is the case's posted recovery expenses not yet removed or settled, plus the storage the payment covers.
      The storage the reinstatement expense payment covers runs through the payment date, or through the latest earliest sale date stated in any notice of intent to sell on the case when that date is earlier; the days held are the calendar days from the day after the recovery_date through that end date, the class storage_free_days are deducted from the days held, the chargeable days never fall below zero nor exceed storage_max_days_chargeable, and each chargeable day is charged at the class storage_fee_per_day_usd.
      For the reinstatement expense payment, where the contract's state_code is one of rate_states_a, the storage day rate is rate_a_usd; where it is one of rate_states_b, the storage day rate is rate_b_usd; in any other state the storage day rate is the class storage_fee_per_day_usd.
      For the reinstatement expense payment, where the case's storage_lot is one of extended_grace_lots and the payment date is no more than extended_grace_window_days calendar days after the recovery_date, the grace days deducted are extended_grace_days; where the storage_lot is one of no_grace_lots, the grace days deducted are no_grace_days; in every other case the grace days deducted are the class storage_free_days.
      For the reinstatement expense payment, where the recovery_method is impound_release, the storage clock starts the day after the activity_date of the latest impound_lot_charges expense on the case, or the day after the recovery_date where none is posted; where the recovery_method is not impound_release and the recovery_date fell on a Saturday or a Sunday, the storage clock starts the day after the following Monday, that is saturday_clock_shift_days days later for a Saturday and sunday_clock_shift_days day later for a Sunday than the day after the recovery_date; otherwise the storage clock starts the day after the recovery_date; the days held are counted from the day the storage clock starts through the end date.
      For the reinstatement expense payment, when keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is flatbed or medium_duty_flatbed, keyless_flatbed_day_usd is added to every chargeable day; when keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is wheel_lift, keyless_wheel_lift_day_usd is added to every chargeable day; when keys_obtained is true or a key_replacement_fee expense is posted on the case, nothing is added.
      The reinstatement expense payment is assembled in this fixed order: the days not charged are deducted from the days held, the remainder is floored at zero and then limited to storage_max_days_chargeable, each remaining chargeable day is charged at its day rate together with any per-day addition, and that storage is added to the posted recovery expenses not yet removed or settled; the total is rounded to the cent.
