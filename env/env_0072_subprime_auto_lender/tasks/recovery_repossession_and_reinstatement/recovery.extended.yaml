  - id: recovery_ext_surrender_fee
    base_policy_refs: [recovery_evt_expenses]
    overwrite:
      - base_policy: recovery_evt_expenses
        superseded_clause: >-
          voluntary_surrender_fee_usd for voluntary_surrender
        replaced_by: >-
          For a case whose recovery_method is voluntary_surrender, the voluntary surrender fee replaces the plain class voluntary_surrender_fee_usd and is figured as this rule sets out; the agency recovery fee for an involuntary recovery is figured by its own agency fee rule, and the impound release fees and every other expense on the class schedule are charged exactly as the expense schedule states.
    trigger: state_due
    subject: [recovery_expense_posted]
    computes: amount_usd
    target_tool: post_surrender_fee_edb82254
    params:
      surrender_limit_states_a: ["AL", "FL", "GA"]
      surrender_limit_a_usd: 150.0
      surrender_limit_states_b: ["NC", "SC", "TN"]
      surrender_limit_b_usd: 160.0
      surrender_low_value_threshold_usd: 6000.0
      surrender_low_value_fee_pct: 2.0
      surrender_mid_value_threshold_usd: 10000.0
      surrender_mid_value_taper_pct: 1.5
      surrender_fee_minimum_usd: 25.0
      company_dropoff_lots: ["Peachtree Auto Holding - Forest Park", "Lake Erie Auto Storage - Cleveland"]
      staffed_dropoff_credit_usd: 50.0
      after_hours_dropoff_credit_usd: 25.0
      monday_reference_date: "2026-01-05"
      prompt_surrender_days: 3
      prompt_surrender_credit_usd: 30.0
      timely_surrender_days: 7
      timely_surrender_credit_usd: 15.0
    rule: >-
      For a case whose recovery_method is voluntary_surrender, the voluntary surrender fee replaces the plain class voluntary_surrender_fee_usd and is figured as this rule sets out; the agency recovery fee for an involuntary recovery is figured by its own agency fee rule, and the impound release fees and every other expense on the class schedule are charged exactly as the expense schedule states.
      The voluntary surrender fee is posted once on the case, on a case in recovered status, as an expense of type voluntary_surrender_fee dated on the posting date.
      The standard voluntary surrender fee is the collateral class's voluntary_surrender_fee_usd.
      Where the contract's state_code is one of surrender_limit_states_a, the class surrender fee is limited to surrender_limit_a_usd; where it is one of surrender_limit_states_b, it is limited to surrender_limit_b_usd; in any other state the class surrender fee stands with no state limit.
      Where the contract's vehicle_book_value_usd is below surrender_low_value_threshold_usd, the surrender value reduction is the amount by which the standard voluntary surrender fee exceeds surrender_low_value_fee_pct percent of that book value (that percentage figure rounded to the cent), and never less than zero; where the book value is at least surrender_low_value_threshold_usd but below surrender_mid_value_threshold_usd, the surrender value reduction is surrender_mid_value_taper_pct percent of the amount by which the book value falls short of surrender_mid_value_threshold_usd, rounded to the cent; where the book value is surrender_mid_value_threshold_usd or more, there is no surrender value reduction.
      Where the case's storage_lot is one of company_dropoff_lots and the recovery_date fell on a weekday, the borrower delivered the vehicle to a staffed company drop-off lot and a drop-off credit of staffed_dropoff_credit_usd applies; where the storage_lot is one of company_dropoff_lots and the recovery_date fell on a Saturday or a Sunday, the borrower left the vehicle at the lot's after-hours drop and a drop-off credit of after_hours_dropoff_credit_usd applies; at any other lot no drop-off credit applies.
