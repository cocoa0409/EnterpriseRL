      timing_credit: "Where the vehicle came in no more than prompt_surrender_days calendar days after the case's opened_date, a surrender timing credit of prompt_surrender_credit_usd applies; where it came in more than prompt_surrender_days but no more than timely_surrender_days calendar days after the opened_date, a surrender timing credit of timely_surrender_credit_usd applies; where it came in later, no surrender timing credit applies."
      result: "The fee is assembled in this fixed order: any limit on the class surrender fee applies first, and any reduction and any credits are then subtracted from the limited fee without taking it below surrender_fee_minimum_usd; the total is rounded to the cent."
    factors:
