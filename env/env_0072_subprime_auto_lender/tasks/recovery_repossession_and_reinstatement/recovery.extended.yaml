      - timing_credit: "K('prompt_surrender_credit_usd') if surrender_lag_days <= K('prompt_surrender_days') else (K('timely_surrender_credit_usd') if surrender_lag_days <= K('timely_surrender_days') else 0)"
      - result: "RND(MX(K('surrender_fee_minimum_usd'), MN(P('voluntary_surrender_fee_usd'), surrender_state_limit) - surrender_value_reduction - dropoff_credit - timing_credit), 2)"
    compute_basis:
      contract_state: "Where the contract's state_code is one of surrender_limit_states_a"
      surrender_state_limit: "Where the contract's state_code is one of surrender_limit_states_a, the class surrender fee is limited to surrender_limit_a_usd; where it is one of surrender_limit_states_b, it is limited to surrender_limit_b_usd; in any other state the class surrender fee stands with no state limit."
      book_value: "Where the contract's vehicle_book_value_usd is below surrender_low_value_threshold_usd"
      surrender_value_reduction: "Where the contract's vehicle_book_value_usd is below surrender_low_value_threshold_usd, the surrender value reduction is the amount by which the standard voluntary surrender fee exceeds surrender_low_value_fee_pct percent of that book value (that percentage figure rounded to the cent), and never less than zero; where the book value is at least surrender_low_value_threshold_usd but below surrender_mid_value_threshold_usd, the surrender value reduction is surrender_mid_value_taper_pct percent of the amount by which the book value falls short of surrender_mid_value_threshold_usd, rounded to the cent; where the book value is surrender_mid_value_threshold_usd or more, there is no surrender value reduction."
      dropoff_weekday: "the recovery_date fell on a weekday"
      dropoff_credit: "Where the case's storage_lot is one of company_dropoff_lots and the recovery_date fell on a weekday, the borrower delivered the vehicle to a staffed company drop-off lot and a drop-off credit of staffed_dropoff_credit_usd applies; where the storage_lot is one of company_dropoff_lots and the recovery_date fell on a Saturday or a Sunday, the borrower left the vehicle at the lot's after-hours drop and a drop-off credit of after_hours_dropoff_credit_usd applies; at any other lot no drop-off credit applies."
