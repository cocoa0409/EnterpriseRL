      - surrender_state_limit: "K('surrender_limit_a_usd') if contract_state in K('surrender_limit_states_a') else (K('surrender_limit_b_usd') if contract_state in K('surrender_limit_states_b') else P('voluntary_surrender_fee_usd'))"
      - book_value: "CFIELD('contract', 'vehicle_book_value_usd', contract_id=F('contract_id'))"
      - surrender_value_reduction: "MX(0, P('voluntary_surrender_fee_usd') - RND(K('surrender_low_value_fee_pct') / 100 * float(book_value), 2)) if float(book_value) < K('surrender_low_value_threshold_usd') else (RND(K('surrender_mid_value_taper_pct') / 100 * (K('surrender_mid_value_threshold_usd') - float(book_value)), 2) if float(book_value) < K('surrender_mid_value_threshold_usd') else 0)"
