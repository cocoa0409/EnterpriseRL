# ---- data flow ----
events:
  - type: recovery_case_opened
    target: recovery_cases
    mutation: create
    meaning: "A delinquent contract is referred for repossession review, or the borrower asks to surrender the vehicle."
    grain: "one row per default episode of a contract"
    fields:
      customer_id: "the borrower"
      contract_id: "the defaulted contract"
      variant_name: "collateral class of the financed vehicle"
      opened_date: "referral date"
      recovery_method: "how the vehicle is expected to come in"
      expenses_outstanding_usd: "set to 0.00"
    triggers: []
  - type: recovery_notice_sent
    target: recovery_activities
    meaning: "A statutory or company notice about the repossession is mailed to the borrower."
    grain: "one row per notice mailed"
    distinguish_by: [notice_type, activity_date]
    fields:
      activity_date: "mailing date"
      notice_type: "which notice was mailed"
      delivery_method: "how it was mailed"
      deadline_date: "cure deadline, earliest sale date or property claim deadline stated in the notice; empty for an explanation"
      stated_amount_usd: "cure amount, reinstatement amount or surplus/deficiency stated in the notice"
    triggers: []
  - type: recovery_assigned
    target: recovery_cases
    mutation: {transition: {from: pre_repo_review, to: assigned}}
    meaning: "The case is assigned to a recovery agency."
    grain: "one row per transaction"
    fields:
      status: "set to assigned"
      assigned_date: "assignment date"
      agency_name: "licensed recovery agency assigned"
    triggers: []
  - type: recovery_vehicle_recovered
    target: recovery_cases
    mutation: {transition: {from: assigned, to: recovered}}
    meaning: "The vehicle is in the company's possession at a contracted storage lot."
    grain: "one row per transaction"
    fields:
      status: "set to recovered"
      recovery_date: "date the vehicle came into the company's possession"
      storage_lot: "storage lot holding the vehicle"
      keys_obtained: "whether a key came in with the vehicle"
      personal_property_found: "whether personal property was inventoried in the vehicle"
    triggers:
      - event: contract:contract_repossessed
        map: {repossession_date: recovery_date}
      - event: recovery:recovery_notice_sent
        map: {notice_type: notice_of_intent_to_sell}
      - event: recovery:recovery_notice_sent
        when: {personal_property_found: true}
        map: {notice_type: personal_property_notice}
  - type: recovery_expense_posted
    target: recovery_activities
    meaning: "A recovery expense is charged to the case."
    grain: "one row per expense type per posting date"
    distinguish_by: [expense_type, activity_date]
    fields:
      activity_date: "posting date"
      expense_type: "kind of expense"
      amount_usd: "expense amount"
      chargeable_days: "for storage, the number of days charged; 0 otherwise"
    account: recovery_expenses
    direction: in
    triggers: []
  - type: recovery_expense_waived
    target: recovery_activities
    meaning: "A posted recovery expense is removed."
    grain: "one row per waived expense"
    distinguish_by: [related_activity_id]
    fields:
      activity_date: "waiver date"
      amount_usd: "amount removed (the full expense)"
      related_activity_id: "the expense being removed"
      waiver_reason: "why it is removed"
    account: recovery_expenses
    direction: out
    triggers: []
  - type: recovery_expense_settled
    target: recovery_activities
    meaning: "The case's outstanding recovery expenses are settled."
    grain: "one row per settlement method per date"
    distinguish_by: [settlement_method, activity_date]
    fields:
      activity_date: "settlement date"
      amount_usd: "expenses settled"
      settlement_method: "how they were settled"
    account: recovery_expenses
    direction: out
    triggers: []
  - type: recovery_reinstatement_quoted
    target: recovery_activities
    meaning: "The borrower is given the amount needed to reinstate the contract and recover the vehicle."
    grain: "one row per quote issued"
    distinguish_by: [activity_date, deadline_date]
    fields:
      activity_date: "quote date"
      deadline_date: "last date the quote is good through"
      past_due_installments_usd: "installments due through the good-through date"
      late_charges_usd: "unpaid contract fees"
      expenses_usd: "recovery expenses outstanding through the good-through date"
      stated_amount_usd: "total reinstatement amount"
    triggers: []
  - type: recovery_reinstated
    target: recovery_cases
    mutation: {transition: {from: recovered, to: reinstated}}
    meaning: "The borrower has paid the reinstatement amount; the vehicle is released and the contract resumes."
    grain: "one row per transaction"
    fields:
      status: "set to reinstated"
      closed_date: "reinstatement date"
    triggers:
      - event: contract:contract_reinstated
      - event: recovery:recovery_expense_settled
        map: {settlement_method: paid_by_borrower}
  - type: recovery_redeemed
    target: recovery_cases
    mutation: {transition: {from: recovered, to: redeemed}}
    meaning: "The borrower has redeemed the vehicle by paying everything owed plus expenses."
    grain: "one row per transaction"
    fields:
      status: "set to redeemed"
      closed_date: "redemption date"
    triggers:
      - event: contract:contract_paid_off
        map: {payoff_reason: redemption}
      - event: recovery:recovery_expense_settled
        map: {settlement_method: paid_by_borrower}
  - type: recovery_vehicle_sold
    target: recovery_cases
    mutation: {transition: {from: recovered, to: sold}}
    meaning: "The repossessed vehicle is sold and the proceeds are applied."
    grain: "one row per transaction"
    fields:
      status: "set to sold"
      sale_date: "date of sale"
      sale_type: "disposition method"
      gross_sale_proceeds_usd: "gross price received"
      net_proceeds_applied_usd: "proceeds applied to the contract after recovery expenses"
      sale_result: "whether a deficiency, a surplus or neither remains"
      closed_date: "sale date"
    triggers:
      - event: contract:contract_payment_posted
        when: {net_proceeds_applied_usd: {not: 0.00}}
        map: {txn_date: sale_date, amount_usd: net_proceeds_applied_usd, payment_type: sale_proceeds, payment_channel: third_party_remittance}
      - event: contract:contract_liquidated
        map: {closed_date: sale_date}
      - event: recovery:recovery_expense_settled
        map: {settlement_method: deducted_from_sale_proceeds}
      - event: recovery:recovery_notice_sent
        map: {notice_type: post_sale_explanation}
      - event: recovery:recovery_surplus_paid
        when: {sale_result: surplus}
      - event: deficiency:deficiency_opened
        when: {sale_result: deficiency}
        map: {contract_id: contract_id, recovery_case_id: recovery_case_id, opened_date: sale_date}
  - type: recovery_surplus_paid
    target: recovery_activities
    meaning: "Sale proceeds exceeding the expenses and the contract payoff are paid to the borrower."
    grain: "one row per surplus payment"
    distinguish_by: [activity_date]
    fields:
      activity_date: "date the surplus check was issued"
      amount_usd: "surplus paid"
    triggers: []
  - type: recovery_recalled
    target: recovery_cases
    mutation: {transition: [{from: pre_repo_review, to: recalled}, {from: assigned, to: recalled}]}
    meaning: "The review or assignment is closed without recovery."
    grain: "one row per transaction"
    fields:
      status: "set to recalled"
      recall_reason: "why it was closed"
      closed_date: "recall date"
    triggers: []
  - type: recovery_property_released
    target: recovery_activities
    meaning: "Personal property found in the vehicle is returned to the borrower or disposed of after the hold period."
    grain: "one row per property disposition"
    distinguish_by: [property_disposition]
    fields:
      activity_date: "date of release or disposal"
      property_disposition: "what happened to the property"
    triggers: []

# ---- derived measures ----
measures:
  - id: recovery_msr_contract_reinstatements
    window: "life of the contract"
    measure: "count of recovery_cases of the same contract_id whose status is reinstated"
  - id: recovery_msr_chargeable_storage_days
    window: "from the recovery date to the release or sale date of one case"
    measure: "calendar days from the day after recovery_date through the release, reinstatement, redemption or sale date inclusive, minus storage_free_days, never below 0 and never above storage_max_days_chargeable"
  - id: recovery_msr_cured_notice_12m
    window: "rolling 12 months ending on the referral date (same calendar day 12 months earlier, exclusive; month-end fallback to the last day of the month)"
    measure: "count of right_to_cure_notice rows on earlier recovery cases of the same contract that closed as recalled with recall_reason account_brought_current"
  - id: recovery_msr_expenses_outstanding
    window: "life of the case, evaluated on the calculation date"
    measure: "sum of recovery_expense_posted amount_usd minus recovery_expense_waived and recovery_expense_settled amount_usd on the case (equals expenses_outstanding_usd), plus storage accrued but not yet posted through the calculation date at storage_fee_per_day_usd per chargeable day"

# ---- policies ----
policies:
  - id: recovery_agg_multi_holding
    subject: [recovery_case_opened]
    rule: >-
      Recovery cases are held per contract and per default episode: a borrower with several contracts may have a case on each, without a per-borrower limit, but one contract never has more than max_open_cases_per_contract case in pre_repo_review, assigned or recovered status.
      A new case on the same contract opens only after the earlier case has closed (reinstated, redeemed, sold or recalled).
    eligibility: []
    params: {max_per_customer: null}
  - id: recovery_agg_contract_history
    subject: [recovery_case_opened, recovery_reinstated]
    rule: >-
      Every case of the same contract is read together: reinstatements are counted across all of the contract's cases (recovery_msr_contract_reinstatements) against reinstatement_max_per_contract, and an earlier cured right-to-cure notice on the contract is read across its cases (recovery_msr_cured_notice_12m).
      Expenses, quotes, notices and proceeds of one case belong to that case and its contract only; they are never charged to, offset against or combined with another contract of the same borrower, even when both are in default.
    eligibility: []
    measures: [recovery_msr_contract_reinstatements, recovery_msr_cured_notice_12m]
  - id: recovery_assignment
    subject: [recovery_case_opened, recovery_assigned, recovery_recalled]
    rule: >-
      A contract is referred for repossession review only while it is active and at least repossession_referral_min_days_past_due days past due, or when the borrower asks to surrender the vehicle voluntarily (recovery_method voluntary_surrender), or when the vehicle is held in an impound and released to the company as lienholder (recovery_method impound_release).
      A case may be assigned to an agency only after the cure period that right_to_cure_schedule sets for the contract state has run from the date the right-to-cure notice was mailed, without the default being cured. The cure period is counted in calendar days starting the day after the notice was mailed, and assignment is allowed only from the day after its last day; a contract whose state is not listed in right_to_cure_schedule needs no cure notice.
      A contract incurred before the borrower's scra_active_duty_start_date may not be assigned while the borrower is in military service without a court order (scra_court_order_required); the case is recalled with recall_reason scra_protection.
      A bankruptcy filing on record recalls the case at once with recall_reason bankruptcy_filing (bankruptcy_stay_recall).
      When the borrower brings the contract current (next_due_date no earlier than the payment date) before the vehicle is recovered, the case is recalled with recall_reason account_brought_current; an assignment that has no recovery within assignment_expiry_days of assigned_date is recalled with recall_reason assignment_expired; a referral made outside these conditions is recalled with recall_reason referral_error.
      The agency must use the class's tow_equipment and must withdraw without the vehicle when the borrower objects at the scene or a closed structure would have to be entered (breach_of_peace_withdrawal).
      No close fee for a recalled assignment and no skip-tracing cost is ever charged to the borrower (close_fee_charged_to_borrower, skip_trace_fee_usd).
    eligibility:
      - id: assignment_after_cure_period
        applies_to: [recovery_assigned]
        kind: time
        condition: "A case may be assigned to an agency only after the cure period that right_to_cure_schedule sets for the contract state has run from the date the right-to-cure notice was mailed, without the default being cured."
        evidence_fields: [recovery_activities.activity_date, recovery_activities.notice_type, recovery_activities.recovery_case_id, contracts.state_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[recovery_activities.recovery_case_id]]
          action_bindings: {recovery_activities.recovery_case_id: recovery_case_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the right-to-cure notice was mailed"
          anchor_source: recovery_activities.activity_date
          relation: not_before
          duration_source: variants.right_to_cure_schedule
          unit: calendar_days
          counting_rule: "The cure period is counted in calendar days starting the day after the notice was mailed, and assignment is allowed only from the day after its last day; a contract whose state is not listed in right_to_cure_schedule needs no cure notice."
          boundary: exclusive
    params:
      per_tier:
        Recovery Class 1 Passenger Car: {tow_equipment: "=tow_equipment"}
        Recovery Class 2 Minivan and Crossover: {tow_equipment: "=tow_equipment"}
        Recovery Class 3 Sport Utility Vehicle: {tow_equipment: "=tow_equipment"}
        Recovery Class 4 Light-Duty Pickup: {tow_equipment: "=tow_equipment"}
        Recovery Class 5 Heavy-Duty Pickup: {tow_equipment: "=tow_equipment"}
        Recovery Class 6 Full-Size Van: {tow_equipment: "=tow_equipment"}
  - id: recovery_cure_notice
    subject: [recovery_notice_sent]
    rule: >-
      Notices are mailed only on a case in pre_repo_review, recovered or sold status: right-to-cure notices in pre_repo_review, the notice of intent to sell and the personal property notice in recovered, and the post-sale explanation in sold.
      When the contract's state_code is listed in right_to_cure_schedule, a right-to-cure notice must be mailed by cure_notice_delivery_method before the case can be assigned, no earlier than when the contract is cure_notice_min_days_past_due days past due; its deadline_date is the mailing date plus the state's cure days, and its stated_amount_usd is the installments past due on the mailing date plus fees_due_usd.
      No new cure notice is needed when a cure notice on an earlier case of the same contract was cured within the last cure_notice_repeat_window_months months (recovery_msr_cured_notice_12m is at least 1); a contract state not listed in the schedule needs no cure notice.
      A right-to-cure notice is cured only when the stated amount is paid on the contract by the deadline_date, in which case the case is recalled with recall_reason account_brought_current.
    eligibility:
      - id: notice_case_status
        applies_to: [recovery_notice_sent]
        kind: state
        condition: "Notices are mailed only on a case in pre_repo_review, recovered or sold status: right-to-cure notices in pre_repo_review, the notice of intent to sell and the personal property notice in recovered, and the post-sale explanation in sold."
        evidence_fields: [recovery_cases.status, recovery_cases.recovery_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[recovery_cases.recovery_case_id]]
          action_bindings: {recovery_cases.recovery_case_id: recovery_case_id}
        state_contract:
          field: recovery_cases.status
          allowed: [pre_repo_review, recovered, sold]
    measures: [recovery_msr_cured_notice_12m]
  - id: recovery_evt_recovery_and_noi
    subject: [recovery_vehicle_recovered, recovery_notice_sent]
    rule: >-
      When the vehicle comes into the company's possession the contract becomes repossessed on the recovery_date, a condition report is completed at the storage lot (vehicle_condition_report_required), and a notice of intent to sell is mailed by noi_delivery_method within noi_mail_within_business_days business days after the recovery date (Monday to Friday excluding federal holidays).
      The notice of intent to sell states an earliest sale date (deadline_date) exactly noi_min_days_before_sale calendar days after its mailing date, the borrower's right to redeem by paying the full payoff plus expenses, the reinstatement amount where reinstatement is available (stated_amount_usd, otherwise 0.00), and that the borrower may be liable for a deficiency.
      A notice returned undeliverable is re-mailed to any newer address on file and the earliest sale date restarts from the new mailing date (noi_resend_if_undeliverable).
      When personal property was found in the vehicle a personal property notice is also mailed under recovery_personal_property.
    eligibility: []
  - id: recovery_evt_expenses
    subject: [recovery_expense_posted, recovery_expense_waived]
    rule: >-
      Recovery expenses are posted only on a case in recovered status.
      Every expense must be a reasonable expense actually incurred (expenses_reasonableness_basis) and is charged from the collateral class schedule: involuntary_repossession_fee_usd for recovery_method involuntary_recovery, voluntary_surrender_fee_usd for voluntary_surrender, impound_release_admin_fee_usd plus the impound lot's charges at their receipted amount (impound_charges_basis) for impound_release, transport_fee_usd for every method except impound_release, key_replacement_fee_usd only when keys_obtained is false, storage at storage_fee_per_day_usd for each chargeable day (recovery_msr_chargeable_storage_days, recorded in chargeable_days), auction_fee_usd only when the vehicle actually sells (auction_fee_only_on_sale), and reconditioning backed by a vendor invoice (reconditioning_requires_invoice) up to reconditioning_cap_usd.
      Storage is posted once, on the date the vehicle is released or sold, for every chargeable day up to that date.
      An expense can be removed only once, and only with waiver_reason assessed_in_error when it was charged outside this schedule or was not actually incurred; correctly charged expenses are never waived as a courtesy (courtesy_expense_waiver_allowed).
    eligibility:
      - id: expense_case_status
        applies_to: [recovery_expense_posted]
        kind: state
        condition: "Recovery expenses are posted only on a case in recovered status."
        evidence_fields: [recovery_cases.status, recovery_cases.recovery_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[recovery_cases.recovery_case_id]]
          action_bindings: {recovery_cases.recovery_case_id: recovery_case_id}
        state_contract:
          field: recovery_cases.status
          allowed: [recovered]
      - id: expense_removed_once
        applies_to: [recovery_expense_waived]
        kind: dedup
        condition: "An expense can be removed only once, and only with waiver_reason assessed_in_error when it was charged outside this schedule or was not actually incurred; correctly charged expenses are never waived as a courtesy (courtesy_expense_waiver_allowed)."
        evidence_fields: [recovery_activities.related_activity_id, recovery_activities.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[recovery_activities.related_activity_id]]
          action_bindings: {recovery_activities.related_activity_id: related_activity_id}
        dedup_contract:
          table: recovery_activities
          mode: separate_record
          object_bindings: {related_activity_id: related_activity_id}
          duplicate_filters: {event_type: [recovery_expense_waived]}
          distinct_fields: []
    params:
      per_tier:
        Recovery Class 1 Passenger Car: {involuntary_repossession_fee_usd: "=involuntary_repossession_fee_usd", voluntary_surrender_fee_usd: "=voluntary_surrender_fee_usd", transport_fee_usd: "=transport_fee_usd", storage_fee_per_day_usd: "=storage_fee_per_day_usd", key_replacement_fee_usd: "=key_replacement_fee_usd", auction_fee_usd: "=auction_fee_usd", reconditioning_cap_usd: "=reconditioning_cap_usd"}
        Recovery Class 2 Minivan and Crossover: {involuntary_repossession_fee_usd: "=involuntary_repossession_fee_usd", voluntary_surrender_fee_usd: "=voluntary_surrender_fee_usd", transport_fee_usd: "=transport_fee_usd", storage_fee_per_day_usd: "=storage_fee_per_day_usd", key_replacement_fee_usd: "=key_replacement_fee_usd", auction_fee_usd: "=auction_fee_usd", reconditioning_cap_usd: "=reconditioning_cap_usd"}
        Recovery Class 3 Sport Utility Vehicle: {involuntary_repossession_fee_usd: "=involuntary_repossession_fee_usd", voluntary_surrender_fee_usd: "=voluntary_surrender_fee_usd", transport_fee_usd: "=transport_fee_usd", storage_fee_per_day_usd: "=storage_fee_per_day_usd", key_replacement_fee_usd: "=key_replacement_fee_usd", auction_fee_usd: "=auction_fee_usd", reconditioning_cap_usd: "=reconditioning_cap_usd"}
        Recovery Class 4 Light-Duty Pickup: {involuntary_repossession_fee_usd: "=involuntary_repossession_fee_usd", voluntary_surrender_fee_usd: "=voluntary_surrender_fee_usd", transport_fee_usd: "=transport_fee_usd", storage_fee_per_day_usd: "=storage_fee_per_day_usd", key_replacement_fee_usd: "=key_replacement_fee_usd", auction_fee_usd: "=auction_fee_usd", reconditioning_cap_usd: "=reconditioning_cap_usd"}
        Recovery Class 5 Heavy-Duty Pickup: {involuntary_repossession_fee_usd: "=involuntary_repossession_fee_usd", voluntary_surrender_fee_usd: "=voluntary_surrender_fee_usd", transport_fee_usd: "=transport_fee_usd", storage_fee_per_day_usd: "=storage_fee_per_day_usd", key_replacement_fee_usd: "=key_replacement_fee_usd", auction_fee_usd: "=auction_fee_usd", reconditioning_cap_usd: "=reconditioning_cap_usd"}
        Recovery Class 6 Full-Size Van: {involuntary_repossession_fee_usd: "=involuntary_repossession_fee_usd", voluntary_surrender_fee_usd: "=voluntary_surrender_fee_usd", transport_fee_usd: "=transport_fee_usd", storage_fee_per_day_usd: "=storage_fee_per_day_usd", key_replacement_fee_usd: "=key_replacement_fee_usd", auction_fee_usd: "=auction_fee_usd", reconditioning_cap_usd: "=reconditioning_cap_usd"}
    formula:
      storage_charge: "round(storage_fee_per_day_usd * recovery_msr_chargeable_storage_days, 2)"
    measures: [recovery_msr_chargeable_storage_days]
  - id: recovery_reinstatement
    subject: [recovery_reinstatement_quoted, recovery_reinstated]
    rule: >-
      Reinstatement is quoted and completed only on a case in recovered status.
      The company offers reinstatement in every state (reinstatement_offered), but only while the contract's reinstatements across all its cases (recovery_msr_contract_reinstatements) are fewer than reinstatement_max_per_contract and the contract is not charged off; once the limit is reached the borrower may only redeem.
      The reinstatement payment must be received before the earliest sale date, which falls noi_min_days_before_sale after the notice of intent to sell was mailed.
      That period is counted in calendar days from the activity_date of the latest notice_of_intent_to_sell, and a payment on the earliest sale date itself is too late.
      The reinstatement amount is every installment due on the contract through the quote's good-through date (scheduled_payment_usd for each due date from next_due_date through that date, less partial_installment_credit_usd), plus the contract's fees_due_usd, plus the case's recovery expenses outstanding through that date including storage accrued to it (recovery_msr_expenses_outstanding); the accelerated balance is never required.
      A quote is good through the earlier of the quote date plus reinstatement_quote_valid_days and the day before the earliest sale date.
      Payment is accepted only through certified_payment_channels; the contract portion posts to the contract as a reinstatement payment and the expense portion settles the case's expenses.
      The vehicle is released within vehicle_release_business_days business days after good funds, and only when accepted proof of the borrower's own physical-damage insurance is on the contract's tracking record (reinstatement_requires_insurance_proof).
    eligibility:
      - id: reinstatement_case_status
        applies_to: [recovery_reinstatement_quoted]
        kind: state
        condition: "Reinstatement is quoted and completed only on a case in recovered status."
        evidence_fields: [recovery_cases.status, recovery_cases.recovery_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[recovery_cases.recovery_case_id]]
          action_bindings: {recovery_cases.recovery_case_id: recovery_case_id}
        state_contract:
          field: recovery_cases.status
          allowed: [recovered]
      - id: reinstatement_before_sale_date
        applies_to: [recovery_reinstatement_quoted, recovery_reinstated]
        kind: time
        condition: "The reinstatement payment must be received before the earliest sale date, which falls noi_min_days_before_sale after the notice of intent to sell was mailed."
        evidence_fields: [recovery_activities.activity_date, recovery_activities.notice_type, recovery_activities.recovery_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[recovery_activities.recovery_case_id]]
          action_bindings: {recovery_activities.recovery_case_id: recovery_case_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the notice of intent to sell was mailed"
          anchor_source: recovery_activities.activity_date
          relation: not_after
          duration_source: variants.noi_min_days_before_sale
          unit: calendar_days
          counting_rule: "That period is counted in calendar days from the activity_date of the latest notice_of_intent_to_sell, and a payment on the earliest sale date itself is too late."
          boundary: exclusive
    measures: [recovery_msr_contract_reinstatements, recovery_msr_expenses_outstanding]
  - id: recovery_redemption
    subject: [recovery_redeemed]
    rule: >-
      The borrower may redeem the vehicle at any time before it is sold (redemption_deadline_basis, UCC 9-623), whether or not reinstatement is still available, and this right is never refused or limited by the number of earlier repossessions.
      The redemption amount is the contract's full payoff on the payment date (principal, accrued interest and fees due) plus the case's recovery expenses outstanding through that date (recovery_msr_expenses_outstanding).
      Payment is accepted only through certified_payment_channels; the contract portion posts to the contract as a redemption payment, which pays the contract off, and the expense portion settles the case's expenses.
      The vehicle is released within vehicle_release_business_days business days after good funds, and the lien is released under the contract's lien-release schedule; no insurance proof is needed for a redemption because the company keeps no interest in the vehicle.
    eligibility: []
    measures: [recovery_msr_expenses_outstanding]
  - id: recovery_disposition
    subject: [recovery_vehicle_sold, recovery_surplus_paid, recovery_expense_settled]
    rule: >-
      The vehicle may be sold only on or after the earliest sale date, noi_min_days_before_sale after the notice of intent to sell was mailed.
      That period is counted in calendar days from the activity_date of the latest notice_of_intent_to_sell, and a sale on the earliest sale date itself is allowed.
      The company sells by sale_type_default in a commercially reasonable manner (UCC 9-610), after reconditioning within the class cap.
      Gross proceeds are applied in sale_proceeds_application_order (UCC 9-615): first to the case's recovery expenses, which are settled by deduction from the proceeds, then to the contract payoff on the sale date as a sale_proceeds payment, and any remainder is a surplus paid to the borrower by check within surplus_refund_days.
      sale_result is deficiency when the proceeds left after expenses are less than the contract payoff, surplus when they exceed it, and even when they equal it; recovery expenses the gross proceeds do not cover are settled by transfer to the deficiency account.
      A written explanation of how the surplus or deficiency was calculated is mailed within post_sale_explanation_days after the sale and before any deficiency is demanded, and a borrower's written request for an explanation is answered within explanation_request_response_days (UCC 9-616).
      Recovery expenses are settled only when the case is reinstated, redeemed or sold.
    eligibility:
      - id: sale_on_or_after_earliest_date
        applies_to: [recovery_vehicle_sold]
        kind: time
        condition: "The vehicle may be sold only on or after the earliest sale date, noi_min_days_before_sale after the notice of intent to sell was mailed."
        evidence_fields: [recovery_activities.activity_date, recovery_activities.notice_type, recovery_activities.recovery_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[recovery_activities.recovery_case_id]]
          action_bindings: {recovery_activities.recovery_case_id: recovery_case_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the notice of intent to sell was mailed"
          anchor_source: recovery_activities.activity_date
          relation: not_before
          duration_source: variants.noi_min_days_before_sale
          unit: calendar_days
          counting_rule: "That period is counted in calendar days from the activity_date of the latest notice_of_intent_to_sell, and a sale on the earliest sale date itself is allowed."
          boundary: inclusive
      - id: settlement_case_status
        applies_to: [recovery_expense_settled]
        kind: state
        condition: "Recovery expenses are settled only when the case is reinstated, redeemed or sold."
        evidence_fields: [recovery_cases.status, recovery_cases.recovery_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[recovery_cases.recovery_case_id]]
          action_bindings: {recovery_cases.recovery_case_id: recovery_case_id}
        state_contract:
          field: recovery_cases.status
          allowed: [reinstated, redeemed, sold]
    formula:
      proceeds_after_expenses: "max(gross_sale_proceeds_usd - expenses_outstanding_usd, 0)"
  - id: recovery_personal_property
    subject: [recovery_property_released]
    rule: >-
      Personal property inventoried in the vehicle is held free of charge (personal_property_storage_fee_usd) and a personal property notice stating the claim deadline is mailed within personal_property_notice_days after the recovery date; the claim deadline (deadline_date) is the mailing date plus personal_property_hold_days calendar days.
      Property is released to the borrower, or to a person the borrower authorises in writing, on the borrower's request at any time up to and including the claim deadline, whatever the status of the case or the contract and without any payment on the contract.
      Property not claimed by the deadline is disposed of on the day after it (property_disposition disposed_after_hold_period).
      Each case's property is released or disposed of once; items attached to the vehicle (stereo, wheels, accessories) are part of the vehicle and are not personal property.
    eligibility: []

# ============================================================================
# extended_policies (difficulty: recovery_repossession_and_reinstatement)
# ============================================================================
extended_policies:
  - id: recovery_ext_agency_fee
    base_policy_refs: [recovery_evt_expenses]
    overwrite:
      - base_policy: recovery_evt_expenses
        superseded_clause: >-
          involuntary_repossession_fee_usd for recovery_method involuntary_recovery
        replaced_by: >-
          For a case whose recovery_method is involuntary_recovery, the agency recovery fee replaces the plain class involuntary_repossession_fee_usd and is figured as this rule sets out; the voluntary surrender fee is figured by its own surrender fee rule, and the impound release fees and every other expense on the class schedule are charged exactly as the expense schedule states.
    trigger: state_due
    subject: [recovery_expense_posted]
    computes: amount_usd
    target_tool: post_agency_recovery_fee_54cbecc0
    params:
      limit_states_a: ["IA", "MN", "WI"]
      state_limit_a_usd: 500.0
      limit_states_b: ["IL", "MI", "OH"]
      state_limit_b_usd: 550.0
      low_value_threshold_usd: 8000.0
      low_value_fee_pct: 6.0
      mid_value_threshold_usd: 12000.0
      mid_value_taper_pct: 3.0
      agency_fee_minimum_usd: 150.0
      keyless_flatbed_charge_usd: 95.0
      keyless_wheel_lift_charge_usd: 65.0
      sunday_recovery_charge_usd: 75.0
      saturday_recovery_charge_usd: 50.0
      monday_reference_date: "2026-01-05"
    rule: >-
      For a case whose recovery_method is involuntary_recovery, the agency recovery fee replaces the plain class involuntary_repossession_fee_usd and is figured as this rule sets out; the voluntary surrender fee is figured by its own surrender fee rule, and the impound release fees and every other expense on the class schedule are charged exactly as the expense schedule states.
      The agency recovery fee is posted once on the case, on a case in recovered status, as an expense of type involuntary_repossession_fee dated on the posting date.
      The standard agency recovery fee is the collateral class's involuntary_repossession_fee_usd.
      Where the contract's state_code is one of limit_states_a, the class fee is limited to state_limit_a_usd; where it is one of limit_states_b, the class fee is limited to state_limit_b_usd; in any other state the class fee stands with no state limit.
      Where the contract's vehicle_book_value_usd is below low_value_threshold_usd, the value reduction is the amount by which the standard agency recovery fee exceeds low_value_fee_pct percent of that book value (that percentage figure rounded to the cent), and never less than zero; where the book value is at least low_value_threshold_usd but below mid_value_threshold_usd, the value reduction is mid_value_taper_pct percent of the amount by which the book value falls short of mid_value_threshold_usd, rounded to the cent; where the book value is mid_value_threshold_usd or more, there is no value reduction.
      When keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is flatbed or medium_duty_flatbed, a keyless handling charge of keyless_flatbed_charge_usd is added; when keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is wheel_lift, a keyless handling charge of keyless_wheel_lift_charge_usd is added; when keys_obtained is true or a key_replacement_fee expense is posted on the case, no keyless handling charge is added.
      When the recovery_date fell on a Sunday, a weekend recovery charge of sunday_recovery_charge_usd is added; when it fell on a Saturday, a weekend recovery charge of saturday_recovery_charge_usd is added; when it fell on a weekday, no weekend recovery charge is added.
      The fee is assembled in this fixed order: any limit on the class fee applies first, any reduction is then subtracted from the limited fee without taking it below agency_fee_minimum_usd, and any added charges are then added to that result; the total is rounded to the cent.
    prerequisite: []
    cross_category:
      - category: contract
        as: branch
        reads: [state_code, vehicle_book_value_usd]
        note: The contract state decides the state-limit tier and the contract's book value decides the value-reduction tier.
    compute:
      - contract_state: "CFIELD('contract', 'state_code', contract_id=F('contract_id'))"
      - fee_state_limit: "K('state_limit_a_usd') if contract_state in K('limit_states_a') else (K('state_limit_b_usd') if contract_state in K('limit_states_b') else P('involuntary_repossession_fee_usd'))"
      - book_value: "CFIELD('contract', 'vehicle_book_value_usd', contract_id=F('contract_id'))"
      - fee_value_reduction: "MX(0, P('involuntary_repossession_fee_usd') - RND(K('low_value_fee_pct') / 100 * float(book_value), 2)) if float(book_value) < K('low_value_threshold_usd') else (RND(K('mid_value_taper_pct') / 100 * (K('mid_value_threshold_usd') - float(book_value)), 2) if float(book_value) < K('mid_value_threshold_usd') else 0)"
      - key_cut_count: "COUNT('recovery_activities', event_type='recovery_expense_posted', expense_type='key_replacement_fee')"
      - keyless_charge: "K('keyless_flatbed_charge_usd') if F('keys_obtained') == False and key_cut_count == 0 and P('tow_equipment') != 'wheel_lift' else (K('keyless_wheel_lift_charge_usd') if F('keys_obtained') == False and key_cut_count == 0 and P('tow_equipment') == 'wheel_lift' else 0)"
      - recovery_weekday: "DAYS(K('monday_reference_date'), F('recovery_date')) % 7"
      - weekend_charge: "K('sunday_recovery_charge_usd') if recovery_weekday == 6 else (K('saturday_recovery_charge_usd') if recovery_weekday == 5 else 0)"
      - result: "RND(MX(K('agency_fee_minimum_usd'), MN(P('involuntary_repossession_fee_usd'), fee_state_limit) - fee_value_reduction) + keyless_charge + weekend_charge, 2)"
    compute_basis:
      contract_state: "Where the contract's state_code is one of limit_states_a, the class fee is limited to state_limit_a_usd"
      fee_state_limit: "Where the contract's state_code is one of limit_states_a, the class fee is limited to state_limit_a_usd; where it is one of limit_states_b, the class fee is limited to state_limit_b_usd; in any other state the class fee stands with no state limit."
      book_value: "Where the contract's vehicle_book_value_usd is below low_value_threshold_usd"
      fee_value_reduction: "Where the contract's vehicle_book_value_usd is below low_value_threshold_usd, the value reduction is the amount by which the standard agency recovery fee exceeds low_value_fee_pct percent of that book value (that percentage figure rounded to the cent), and never less than zero; where the book value is at least low_value_threshold_usd but below mid_value_threshold_usd, the value reduction is mid_value_taper_pct percent of the amount by which the book value falls short of mid_value_threshold_usd, rounded to the cent; where the book value is mid_value_threshold_usd or more, there is no value reduction."
      keyless_charge: "When keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is flatbed or medium_duty_flatbed, a keyless handling charge of keyless_flatbed_charge_usd is added; when keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is wheel_lift, a keyless handling charge of keyless_wheel_lift_charge_usd is added; when keys_obtained is true or a key_replacement_fee expense is posted on the case, no keyless handling charge is added."
      recovery_weekday: "When the recovery_date fell on a Sunday"
      weekend_charge: "When the recovery_date fell on a Sunday, a weekend recovery charge of sunday_recovery_charge_usd is added; when it fell on a Saturday, a weekend recovery charge of saturday_recovery_charge_usd is added; when it fell on a weekday, no weekend recovery charge is added."
      result: "The fee is assembled in this fixed order: any limit on the class fee applies first, any reduction is then subtracted from the limited fee without taking it below agency_fee_minimum_usd, and any added charges are then added to that result; the total is rounded to the cent."
    factors:
      - id: state_fee_ceiling
        effect: parameter
        decides: fee_state_limit
        bindings: [contract_state, fee_state_limit]
        ladder:
          - when: "the contract's state_code is one of limit_states_a"
            value: "K('state_limit_a_usd')"
          - when: "the contract's state_code is one of limit_states_b"
            value: "K('state_limit_b_usd')"
          - when: "otherwise"
            value: "P('involuntary_repossession_fee_usd') (no state limit)"
        baseline:
          fee_state_limit: "P('involuntary_repossession_fee_usd')"
        evidence: [cross_category]
        cross_difficulty: contract
      - id: book_value_reduction
        effect: method
        decides: fee_value_reduction
        bindings: [book_value, fee_value_reduction]
        ladder:
          - when: "the contract's vehicle_book_value_usd is below low_value_threshold_usd"
            method: "the reduction is the excess of the standard agency recovery fee over low_value_fee_pct percent of the book value, floored at zero"
          - when: "the book value is at least low_value_threshold_usd but below mid_value_threshold_usd"
            method: "the reduction is mid_value_taper_pct percent of the shortfall of the book value below mid_value_threshold_usd"
          - when: "otherwise"
            method: "no value reduction"
        baseline:
          fee_value_reduction: "0"
        evidence: [cross_category]
        cross_difficulty: contract
      - id: keyless_handling
        effect: parameter
        decides: keyless_charge
        bindings: [key_cut_count, keyless_charge]
        ladder:
          - when: "keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is flatbed or medium_duty_flatbed"
            value: "K('keyless_flatbed_charge_usd')"
          - when: "keys_obtained is false, no key_replacement_fee expense is posted on the case and the class tow_equipment is wheel_lift"
            value: "K('keyless_wheel_lift_charge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          keyless_charge: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: weekend_recovery
        effect: parameter
        decides: weekend_charge
        bindings: [recovery_weekday, weekend_charge]
        ladder:
          - when: "the recovery_date fell on a Sunday"
            value: "K('sunday_recovery_charge_usd')"
          - when: "the recovery_date fell on a Saturday"
            value: "K('saturday_recovery_charge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          weekend_charge: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The agency recovery fee is posted once on the case, on a case in recovered status, as an expense of type involuntary_repossession_fee dated on the posting date.
        The standard agency recovery fee is the collateral class's involuntary_repossession_fee_usd.
      params: [involuntary_repossession_fee_usd]
    inputs:
      history: []
      cross_category: [contract]
  - id: recovery_ext_sale_notice_period
    base_policy_refs: [recovery_evt_recovery_and_noi, recovery_cure_notice, recovery_reinstatement, recovery_disposition]
    overwrite:
      - base_policy: recovery_evt_recovery_and_noi
        superseded_clause: >-
          The notice of intent to sell states an earliest sale date (deadline_date) exactly noi_min_days_before_sale calendar days after its mailing date
        replaced_by: >-
          Every notice of intent to sell, the first one mailed after a recovery and any later one, states an earliest sale date (deadline_date) that falls the notice's sale period in calendar days after its own mailing date, and the sale period is figured as this rule sets out instead of being a flat noi_min_days_before_sale days; the notice is still mailed by noi_delivery_method and still states the right to redeem and the borrower's possible liability for a deficiency.
      - base_policy: recovery_evt_recovery_and_noi
        superseded_clause: >-
          the reinstatement amount where reinstatement is available (stated_amount_usd, otherwise 0.00)
        replaced_by: >-
          The notice states as its reinstatement amount (stated_amount_usd) 0.00 where reinstatement is not available, that is where the contract's reinstatements across its cases have reached reinstatement_max_per_contract or the contract is charged off; where reinstatement is available it states the amount due on its own mailing date: scheduled_payment_usd for each installment due date from next_due_date through the mailing date, less partial_installment_credit_usd, plus the contract's fees_due_usd, plus the case's recovery expenses posted on or before the mailing date and not removed or settled, plus storage from the day after the recovery_date through the mailing date at storage_fee_per_day_usd for each chargeable day after the class storage_free_days, never more than storage_max_days_chargeable days, rounded to the cent.
      - base_policy: recovery_reinstatement
        superseded_clause: >-
          The reinstatement payment must be received before the earliest sale date, which falls noi_min_days_before_sale after the notice of intent to sell was mailed. That period is counted in calendar days from the activity_date of the latest notice_of_intent_to_sell, and a payment on the earliest sale date itself is too late.
        replaced_by: >-
          A reinstatement payment must be received before the earliest sale date, which is the latest deadline_date among the case's notices of intent to sell whose own deadline_date falls at least noi_min_days_before_sale calendar days after their own activity_date; a notice whose deadline_date falls fewer days after its activity_date never sets or moves the earliest sale date, whether it was mailed before, after or on the same day as another notice; that date is counted in calendar days from the activity_date of the notice that states it, a payment on the earliest sale date itself is too late, and while the case carries no such notice no earliest sale date has started to run.
      - base_policy: recovery_disposition
        superseded_clause: >-
          The vehicle may be sold only on or after the earliest sale date, noi_min_days_before_sale after the notice of intent to sell was mailed. That period is counted in calendar days from the activity_date of the latest notice_of_intent_to_sell, and a sale on the earliest sale date itself is allowed.
        replaced_by: >-
          The vehicle may be sold only on or after the earliest sale date, which is the latest deadline_date among the case's notices of intent to sell whose own deadline_date falls at least noi_min_days_before_sale calendar days after their own activity_date; a notice whose deadline_date falls fewer days after its activity_date never sets or moves the earliest sale date, whether it was mailed before, after or on the same day as another notice; that date is counted in calendar days from the activity_date of the notice that states it, a sale on the earliest sale date itself is allowed, and while the case carries no such notice the vehicle may not be sold.
    trigger: state_due
    subject: [recovery_notice_sent]
    computes: sale_notice_days
    target_tool: mail_corrected_sale_notice_6ba1fcf2
    params:
      business_day_notice_states: ["MN", "WI"]
      business_day_notice_days: 12
      extended_notice_states: ["CO", "IA", "KS", "MA", "ME", "MO", "SC", "WV"]
      extended_notice_days: 20
      service_active_extra_days: 15
      service_ended_extra_days: 10
      reissue_multi_extra_days: 10
      reissue_single_extra_days: 7
      late_mailing_long_days: 14
      late_mailing_long_extra_days: 7
      late_mailing_short_days: 7
      late_mailing_short_extra_days: 4
      certified_funds_extra_days: 5
      return_lookback_months: 12
      recent_return_extra_days: 3
      monday_reference_date: "2026-01-05"
    rule: >-
      Every notice of intent to sell, the first one mailed after a recovery and any later one, states an earliest sale date (deadline_date) that falls the notice's sale period in calendar days after its own mailing date, and the sale period is figured as this rule sets out instead of being a flat noi_min_days_before_sale days; the notice is still mailed by noi_delivery_method and still states the right to redeem and the borrower's possible liability for a deficiency.
      A notice whose stated earliest sale date falls fewer than noi_min_days_before_sale calendar days after its mailing date does not start the sale period, and a corrected notice of intent to sell is mailed on the case, which must be in recovered status, on the day the shortfall is found.
      A reinstatement payment must be received before the earliest sale date, which is the latest deadline_date among the case's notices of intent to sell whose own deadline_date falls at least noi_min_days_before_sale calendar days after their own activity_date; a notice whose deadline_date falls fewer days after its activity_date never sets or moves the earliest sale date, whether it was mailed before, after or on the same day as another notice; that date is counted in calendar days from the activity_date of the notice that states it, a payment on the earliest sale date itself is too late, and while the case carries no such notice no earliest sale date has started to run.
      The vehicle may be sold only on or after the earliest sale date, which is the latest deadline_date among the case's notices of intent to sell whose own deadline_date falls at least noi_min_days_before_sale calendar days after their own activity_date; a notice whose deadline_date falls fewer days after its activity_date never sets or moves the earliest sale date, whether it was mailed before, after or on the same day as another notice; that date is counted in calendar days from the activity_date of the notice that states it, a sale on the earliest sale date itself is allowed, and while the case carries no such notice the vehicle may not be sold.
      The notice states as its reinstatement amount (stated_amount_usd) 0.00 where reinstatement is not available, that is where the contract's reinstatements across its cases have reached reinstatement_max_per_contract or the contract is charged off; where reinstatement is available it states the amount due on its own mailing date: scheduled_payment_usd for each installment due date from next_due_date through the mailing date, less partial_installment_credit_usd, plus the contract's fees_due_usd, plus the case's recovery expenses posted on or before the mailing date and not removed or settled, plus storage from the day after the recovery_date through the mailing date at storage_fee_per_day_usd for each chargeable day after the class storage_free_days, never more than storage_max_days_chargeable days, rounded to the cent.
      The standard sale period of a notice of intent to sell is noi_min_days_before_sale calendar days after its mailing date.
      Where the contract's state_code is one of business_day_notice_states, the base sale period is business_day_notice_days business days (Monday to Friday) counted from the day after the mailing date, expressed as the calendar days from the mailing date to the last of those business days; where it is one of extended_notice_states, the base sale period is extended_notice_days calendar days, lengthened by two days when that count ends on a Saturday and by one day when it ends on a Sunday so that the earliest sale date falls on a Monday; in any other state the base sale period is noi_min_days_before_sale calendar days.
      Where the contract carries more contract_scra_rate_adjusted rows with scra_action rate_cap_applied than rows with scra_action rate_cap_ended, the borrower is serving and service_active_extra_days are added; where it carries at least one rate_cap_applied row and no fewer rate_cap_ended rows, the borrower has left service and service_ended_extra_days are added; where it carries no rate_cap_applied row, no service days are added.
      Where the case already carries two or more notices of intent to sell, reissue_multi_extra_days are added; where it carries exactly one, reissue_single_extra_days are added; where it carries none, no reissue days are added.
      Where the notice is mailed more than late_mailing_long_days calendar days after the recovery_date, late_mailing_long_extra_days are added; where it is mailed more than late_mailing_short_days but no more than late_mailing_long_days calendar days after the recovery_date, late_mailing_short_extra_days are added; where it is mailed no more than late_mailing_short_days calendar days after the recovery_date, no late-mailing days are added.
      Where the contract's certified_funds_only is true, certified_funds_extra_days are added; where it is false and the contract carries at least one contract_payment_returned row dated within the last return_lookback_months months (whole months back from the mailing date, so a return dated exactly return_lookback_months months earlier no longer counts), recent_return_extra_days are added; otherwise no funds days are added.
      The sale period is the base sale period plus every addition of days that applies, all in whole calendar days.
    prerequisite: []
    cross_category:
      - category: contract
        as: history
        reads: [state_code, certified_funds_only, contract_servicing_events.scra_action, contract_transactions.event_type]
        note: The contract state decides the base-period tier; the contract's SCRA servicing rows, certified-funds flag and returned payments decide the service and funds tiers.
    compute:
      - contract_state: "CFIELD('contract', 'state_code', contract_id=F('contract_id'))"
      - notice_weekday: "DAYS(K('monday_reference_date'), NOW) % 7"
      - base_period_days: "(((K('business_day_notice_days') // 5) * 7 + K('business_day_notice_days') % 5 + (2 if notice_weekday + K('business_day_notice_days') % 5 > 4 else 0)) if notice_weekday <= 4 else ((2 if notice_weekday == 5 else 1) + ((K('business_day_notice_days') - 1) // 5) * 7 + (K('business_day_notice_days') - 1) % 5)) if contract_state in K('business_day_notice_states') else ((K('extended_notice_days') + (2 if (notice_weekday + K('extended_notice_days')) % 7 == 5 else (1 if (notice_weekday + K('extended_notice_days')) % 7 == 6 else 0))) if contract_state in K('extended_notice_states') else P('noi_min_days_before_sale'))"
      - caps_applied: "XCOUNT('contract', 'contract_servicing_events', event_type='contract_scra_rate_adjusted', scra_action='rate_cap_applied', contract_id=F('contract_id'))"
      - caps_ended: "XCOUNT('contract', 'contract_servicing_events', event_type='contract_scra_rate_adjusted', scra_action='rate_cap_ended', contract_id=F('contract_id'))"
      - service_extra_days: "K('service_active_extra_days') if caps_applied > caps_ended else (K('service_ended_extra_days') if caps_applied >= 1 and caps_ended >= caps_applied else 0)"
      - prior_notices: "COUNT('recovery_activities', event_type='recovery_notice_sent', notice_type='notice_of_intent_to_sell')"
      - reissue_extra_days: "K('reissue_multi_extra_days') if prior_notices >= 2 else (K('reissue_single_extra_days') if prior_notices == 1 else 0)"
      - mailing_lag_days: "DAYS(F('recovery_date'), NOW)"
      - late_mailing_extra_days: "K('late_mailing_long_extra_days') if mailing_lag_days > K('late_mailing_long_days') else (K('late_mailing_short_extra_days') if mailing_lag_days > K('late_mailing_short_days') else 0)"
      - certified_only: "CFIELD('contract', 'certified_funds_only', contract_id=F('contract_id'))"
      - recent_returns: "XCOUNT('contract', 'contract_transactions', within_months=K('return_lookback_months'), date_field='txn_date', event_type='contract_payment_returned', contract_id=F('contract_id'))"
      - funds_extra_days: "K('certified_funds_extra_days') if certified_only == True else (K('recent_return_extra_days') if certified_only == False and recent_returns >= 1 else 0)"
      - result: "base_period_days + service_extra_days + reissue_extra_days + late_mailing_extra_days + funds_extra_days"
    compute_basis:
      contract_state: "Where the contract's state_code is one of business_day_notice_states"
      notice_weekday: "business_day_notice_days business days (Monday to Friday) counted from the day after the mailing date"
      base_period_days: "Where the contract's state_code is one of business_day_notice_states, the base sale period is business_day_notice_days business days (Monday to Friday) counted from the day after the mailing date, expressed as the calendar days from the mailing date to the last of those business days; where it is one of extended_notice_states, the base sale period is extended_notice_days calendar days, lengthened by two days when that count ends on a Saturday and by one day when it ends on a Sunday so that the earliest sale date falls on a Monday; in any other state the base sale period is noi_min_days_before_sale calendar days."
      caps_applied: "Where the contract carries more contract_scra_rate_adjusted rows with scra_action rate_cap_applied than rows with scra_action rate_cap_ended"
      caps_ended: "Where the contract carries more contract_scra_rate_adjusted rows with scra_action rate_cap_applied than rows with scra_action rate_cap_ended"
      service_extra_days: "Where the contract carries more contract_scra_rate_adjusted rows with scra_action rate_cap_applied than rows with scra_action rate_cap_ended, the borrower is serving and service_active_extra_days are added; where it carries at least one rate_cap_applied row and no fewer rate_cap_ended rows, the borrower has left service and service_ended_extra_days are added; where it carries no rate_cap_applied row, no service days are added."
      prior_notices: "Where the case already carries two or more notices of intent to sell"
      reissue_extra_days: "Where the case already carries two or more notices of intent to sell, reissue_multi_extra_days are added; where it carries exactly one, reissue_single_extra_days are added; where it carries none, no reissue days are added."
      mailing_lag_days: "Where the notice is mailed more than late_mailing_long_days calendar days after the recovery_date"
      late_mailing_extra_days: "Where the notice is mailed more than late_mailing_long_days calendar days after the recovery_date, late_mailing_long_extra_days are added; where it is mailed more than late_mailing_short_days but no more than late_mailing_long_days calendar days after the recovery_date, late_mailing_short_extra_days are added; where it is mailed no more than late_mailing_short_days calendar days after the recovery_date, no late-mailing days are added."
      certified_only: "Where the contract's certified_funds_only is true"
      recent_returns: "the contract carries at least one contract_payment_returned row dated within the last return_lookback_months months"
      funds_extra_days: "Where the contract's certified_funds_only is true, certified_funds_extra_days are added; where it is false and the contract carries at least one contract_payment_returned row dated within the last return_lookback_months months (whole months back from the mailing date, so a return dated exactly return_lookback_months months earlier no longer counts), recent_return_extra_days are added; otherwise no funds days are added."
      result: "The sale period is the base sale period plus every addition of days that applies, all in whole calendar days."
    factors:
      - id: state_period_convention
        effect: method
        decides: base_period_days
        bindings: [contract_state, notice_weekday, base_period_days]
        ladder:
          - when: "the contract's state_code is one of business_day_notice_states"
            method: "business_day_notice_days business days counted from the day after mailing, converted to calendar days"
          - when: "the contract's state_code is one of extended_notice_states"
            method: "extended_notice_days calendar days, rolled forward to the Monday when the count ends on a weekend"
          - when: "otherwise"
            method: "noi_min_days_before_sale calendar days as counted"
        baseline:
          base_period_days: "P('noi_min_days_before_sale')"
        evidence: [cross_category, date]
        cross_difficulty: contract
      - id: military_service_days
        effect: parameter
        decides: service_extra_days
        bindings: [caps_applied, caps_ended, service_extra_days]
        ladder:
          - when: "more rate_cap_applied rows than rate_cap_ended rows on the contract (serving)"
            value: "K('service_active_extra_days')"
          - when: "at least one rate_cap_applied row and no fewer rate_cap_ended rows (left service)"
            value: "K('service_ended_extra_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          service_extra_days: "0"
        evidence: [history, cross_category]
        cross_difficulty: contract
      - id: reissue_days
        effect: parameter
        decides: reissue_extra_days
        bindings: [prior_notices, reissue_extra_days]
        ladder:
          - when: "the case already carries two or more notices of intent to sell"
            value: "K('reissue_multi_extra_days')"
          - when: "the case already carries exactly one notice of intent to sell"
            value: "K('reissue_single_extra_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          reissue_extra_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_mailing_days
        effect: parameter
        decides: late_mailing_extra_days
        bindings: [mailing_lag_days, late_mailing_extra_days]
        ladder:
          - when: "the notice is mailed more than late_mailing_long_days calendar days after the recovery_date"
            value: "K('late_mailing_long_extra_days')"
          - when: "it is mailed more than late_mailing_short_days but no more than late_mailing_long_days calendar days after the recovery_date"
            value: "K('late_mailing_short_extra_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          late_mailing_extra_days: "0"
        evidence: [date]
        cross_difficulty: null
      - id: funds_arrangement_days
        effect: parameter
        decides: funds_extra_days
        bindings: [certified_only, recent_returns, funds_extra_days]
        ladder:
          - when: "the contract's certified_funds_only is true"
            value: "K('certified_funds_extra_days')"
          - when: "certified_funds_only is false and a returned payment dated within the last return_lookback_months months"
            value: "K('recent_return_extra_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          funds_extra_days: "0"
        evidence: [history, cross_category]
        cross_difficulty: contract
    baseline:
      rule: >-
        The standard sale period of a notice of intent to sell is noi_min_days_before_sale calendar days after its mailing date.
      params: [noi_min_days_before_sale]
    inputs:
      history:
        - {table: recovery_activities, aggregate: count, field: recovery_activity_id, filters: {event_type: recovery_notice_sent, notice_type: notice_of_intent_to_sell}}
        - {category: contract, table: contract_servicing_events, aggregate: count, field: servicing_event_id, filters: {event_type: contract_scra_rate_adjusted}}
        - {category: contract, table: contract_transactions, aggregate: count, field: contract_txn_id, within_months: 12, filters: {event_type: contract_payment_returned}}
