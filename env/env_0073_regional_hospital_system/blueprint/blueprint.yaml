name: env_0073_regional_hospital_system
company: Riverbend Regional Health

background: |
  Riverbend Regional Health is a nonprofit, tax-exempt health system in Wisconsin's Fox River Valley, operating Riverbend Regional Medical Center in Appleton, Riverbend Lakeshore Hospital in Neenah, Riverbend Community Hospital in Chilton and the Riverbend Surgery & Imaging Center in Grand Chute, together with the employed physicians of Riverbend Medical Group.
  Its Patient Financial Services and Patient Access Center answer roughly forty thousand patient calls, portal messages and walk-in questions a month in a plain, unhurried tone, in English, Spanish and Hmong.
  Every registered visit, stay or therapy series becomes a Hospital Account (Encounter Billing) of one patient class: Outpatient Clinic Visit Account, Outpatient Diagnostic Imaging & Lab Account, Recurring Outpatient Therapy Account, Emergency Department Visit Account, Outpatient Surgery Account, Observation Stay Account or Inpatient Admission Account, on which charges, insurer liability, discounts, payments, refunds and statements are booked line by line.
  Insured care is billed as an Insurance Claim (Third-Party Billing) under one payer class — Commercial PPO Claim, Commercial HMO Claim, Marketplace Exchange Plan Claim, Medicare Advantage Plan Claim, Original Medicare Claim, BadgerCare Plus (Wisconsin Medicaid) Claim or Wisconsin Workers' Compensation Claim — whose remittances, denials, corrections and appeals are booked against the amount expected from the payer.
  Patients who cannot pay at once hold a Patient Payment Plan: the Riverbend Short-Term Payment Plan, Riverbend Standard Payment Plan, Riverbend Extended Payment Plan, Riverbend Long-Term Payment Plan, Riverbend Assistance-Linked Payment Plan or Riverbend Hardship Payment Plan, each carrying enrolled account balances that installments draw down.
  The Financial Assistance Program (Charity Care) opens a case per application or presumptive screen and awards one of Riverbend Presumptive Charity Care, Riverbend Full Charity Care (0-200% FPL), Riverbend 80% Charity Discount (201-250% FPL), Riverbend 60% Charity Discount (251-300% FPL), Riverbend 40% Charity Discount (301-400% FPL) or Riverbend Medical Hardship Assistance (above 400% FPL), applied account by account as charity adjustments.
  Before care, the Good Faith & Price Estimates desk issues the Self-Pay Good Faith Estimate - Single Scheduled Service, Self-Pay Good Faith Estimate - Procedure with Co-Providers, Self-Pay Good Faith Estimate - Recurring Course of Care, Insured Patient Out-of-Pocket Estimate, and the Riverbend Self-Pay Package Price - Imaging & Diagnostics, - Outpatient Surgery and - Maternity & Delivery, recording expected-charge lines per provider and any deposits held.
  Health Information Management handles Medical Records Request (Release of Information) cases — Patient Access - Electronic Copy, Patient Access - Paper Copy, Patient-Directed Transmission to a Third Party, Authorized Release - Attorney or Legal Representative, Authorized Release - Insurer or Disability Carrier, Amendment of Health Record Request and Accounting of Disclosures Request — with fees booked per request.
  Appointment Scheduling books Primary Care Office Visit, Telehealth Video Visit, Specialty New-Patient Consultation, Diagnostic Imaging Appointment (MRI/CT), Infusion Therapy Chair Appointment, Pre-Admission Testing Appointment and Outpatient Procedure Appointment slots, logging reminders and any missed-appointment fees.
  Callers are patients, or the guarantor parents of minor patients, from Outagamie, Winnebago, Calumet and the neighboring counties, many with high-deductible commercial plans, Medicare or BadgerCare Plus, and a steady share uninsured.
  A typical caller holds two to five hospital accounts from the last year — an emergency visit, an imaging study, a scheduled procedure — alongside the claims filed on them, and often an open payment plan, an assistance application or an estimate for an upcoming service.
  Their history shows statements already received, partial payments, insurer remittances with deductible and coinsurance lines, the occasional denial or coverage change, documents sent for an application, and appointments kept, rescheduled or missed.
  Most come with a statement in hand and a question about what they owe, why, and what can be done about it.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_records

difficulties:
  - name: hospital_account_billing
    claim:
      categories: [encounter]
      event_types: [encounter_charge_credited, encounter_adjustment_posted, encounter_payment_posted, encounter_refund_issued, encounter_statement_issued, encounter_hold_placed, encounter_hold_released, encounter_recalled_from_agency, encounter_coverage_updated]
    summary: >
      Patients call about what they owe on one or more hospital accounts: a statement they do not understand, a charge they believe is wrong, a request for an itemized bill, a payment they want to make in full, a credit balance they expect back, or a collection notice; the setting varies with the patient class of each account, its billing status (insurance pending, patient due, on hold, placed with the agency, closed), its financial class, its statement history and the patient's other accounts, plans, claims, assistance cases and estimates. The governing records are the account itself and its line-level activity — charge lines, liability postings with their claim source, discounts, payments, refunds and statements — together with the billing inquiries the patient has raised, and the rules are those of the encounter charter: the uninsured discount and prompt-pay discount by patient class (encounter_uninsured_discount, encounter_prompt_pay_discount), itemized statements (encounter_itemized_statement), the statement and collection cycle with its notification and placement timeline anchored on the first statement (encounter_statement_and_collection_cycle), charge disputes, credit authority and correction adjustments (encounter_charge_dispute_and_correction), billing holds and their allowance (encounter_billing_hold), refunds and cross-account credit offset (encounter_refund_and_credit_balance, encounter_agg_payment_application), small balances and courtesy adjustments (encounter_small_balance_and_courtesy), late charges and newly reported coverage (encounter_late_charges, encounter_coverage_update_rebill). In the domain's natural order a final bill drops, liability posts and is discounted, statements follow, and holds, disputes, payments, adjustments and refunds arise along the way; which of these a given call must settle first is not fixed by these base rules. Logging an inquiry, placing or releasing a hold, crediting a charge line, posting a discount, courtesy or correction adjustment, issuing a statement, recalling an account and issuing a refund are agent service actions, whereas paying a balance is the patient's own act with their own payment method and is handed to the patient. Requests no rule decides — waiving a balance outside the listed adjustments, removing a credit-bureau entry by itself, negotiating a lump-sum settlement, crediting above the representative's authority, or disputing a co-provider's separate bill — call for a POLICY_NOT_COVERED handoff.
  - name: insurance_claims_and_denials
    claim:
      categories: [claim]
      event_types: [claim_correction_filed, claim_resubmitted, claim_member_info_updated, claim_appeal_filed, claim_appealed, claim_denial_written_off, claim_closed]
    summary: >
      Insured patients call because their insurer denied or underpaid a hospital claim, because a claim was rejected for a wrong member ID or a coverage change, because a second insurer was never billed, or because they want Riverbend to appeal on their behalf; the setting varies with the payer class of each claim, its status (submitted, rejected, denied, appealed, adjudicated, closed), its coordination-of-benefits position, its denial reason code and remark, the appeal levels already used, and the hospital accounts and patient balances the claim feeds. The governing records are the claim, its remittance and correction history, and any authorized-representative form the patient has signed, under the claim charter: timely filing anchored on the date of service (claim_timely_filing), routing by reason code including authorization, medical-necessity, coordination and non-covered denials (claim_denial_routing), appeal windows and levels per payer class anchored on the denial notice (claim_appeal_windows), member-level appeals under the patient's authorization (claim_authorized_representative), remittance posting, contractual obligations and underpayment modeling (claim_remittance_posting), recoupments (claim_recoupment_and_overpayment), write-offs that are never billed to the patient (claim_denial_write_off) and coordination across payers (claim_agg_coordination_of_benefits). In the domain's natural order a claim is submitted, acknowledged, adjudicated or denied, and then corrected, appealed, written off or released to the patient; any ordering a specific call requires comes from its own policies, not from these base rules. Correcting subscriber data, filing replacement claims and provider-level appeals, writing off denied amounts and closing claims are agent service actions, while signing the authorized-representative form that a member-level appeal needs, and reading the member ID off their own card, can only come from the patient. Requests outside every rule — demanding that Riverbend pay what the insurer refused, asking for a guarantee of the appeal outcome, filing a state insurance complaint for the patient, or disputing a payer's medical policy itself — are POLICY_NOT_COVERED handoffs.
  - name: payment_plan_servicing
    claim:
      categories: [plan]
      event_types: [plan_created, plan_balance_enrolled, plan_balance_reduced, plan_terms_modified, plan_signed, plan_reaged, plan_reinstated, plan_cancelled_by_patient]
    summary: >
      Patients call to set up a monthly plan for hospital balances, to add a new bill to an existing plan, to lower or move their installment, to catch up after missed payments, to restart a defaulted plan or to cancel one; the setting varies with the plan tier and status, the total and composition of the balances being enrolled, the status of each underlying hospital account, whether the patient holds an approved or pending assistance case, and the plan's history of installments, re-ages, reinstatements, add-ons and changes. The governing records are the plan, its enrollment, installment and reduction activity, the hospital accounts whose balances are enrolled and the patient's assistance cases, under the plan charter: one open plan per patient (plan_agg_multi_holding), tier placement with assistance-linked and hardship overrides and the installment computation (plan_tier_and_installment), which balances may be enrolled (plan_eligible_balances), signature and activation (plan_signature_and_activation), missed payments and default (plan_missed_payment_and_default), re-aging and reinstatement windows (plan_reage_and_reinstatement), add-ons and recomputation (plan_add_on_balances), reductions from account adjustments (plan_balance_reduction) and patient-requested changes and cancellation (plan_patient_changes). Naturally a plan is offered, signed, paid, possibly falls behind and is re-aged or reinstated, and ends paid off or cancelled; any ordering a specific call needs is carried by its own policies, not by these base rules. Creating the plan, enrolling and reducing balances, recomputing terms, re-aging and reinstating are agent service actions; signing the plan agreement and cancelling one's own plan are the patient's acts, handed to the patient. Requests no rule covers — an interest-bearing loan, a plan above the largest tier maximum, settling the balance for less, or a plan for a co-provider's bill — go to a POLICY_NOT_COVERED handoff.
  - name: financial_assistance_screening
    claim:
      categories: [assist]
      event_types: [assist_application_received, assist_document_logged, assist_notice_sent, assist_documents_requested, assist_documents_completed, assist_approved, assist_denied, assist_reconsideration_opened, assist_withdrawn, assist_household_updated, assist_eca_action_logged]
    summary: >
      Patients call because they cannot afford their hospital bills and ask for charity care, because they were told documents are missing, because they want to know why they were denied or what their award covers, or because a collection notice arrived while their application was pending; the setting varies with the household size, income and FPL percent on the case, presumptive evidence, medical debt and assets, residency, the case status and history, and the clinical class, statement dates, balances and placement status of each hospital account the application could reach. The governing records are the assistance case, its document, notice, award-application and collection-protection activity, the patient's profile and hospital accounts, under the assist charter: tier bands and hardship tests (assist_tier_determination), the application period anchored on each account's first statement and residency (assist_application_period_and_residency), completeness and the missing-information deadline (assist_completeness_and_documents), the charity computation on the amounts-generally-billed basis (assist_charity_computation), coverage of accounts and the hardship cap (assist_agg_award_coverage), collection protection (assist_eca_protection), award dates (assist_award_period), BadgerCare Plus screening (assist_medicaid_screening), notices (assist_notices), reconsideration and withdrawal (assist_reconsideration_and_withdrawal) and revocation (assist_revocation). In the domain's natural order an application is received, documents are requested and accepted, a determination is made, and the award is then applied and collection actions reversed; any ordering a specific call requires comes from its own policies, not from these base rules. Logging documents, sending notices, requesting documents, recomputing household figures, approving or denying, reopening for reconsideration and logging collection-protection actions are agent service actions, while signing the application attestation and withdrawing an application are the patient's own acts. Requests outside the policy — assistance for a not-covered physician group's bill, an exception to the income bands, forgiveness of elective cosmetic care, or an award backdated beyond the look-back — are POLICY_NOT_COVERED handoffs.
  - name: good_faith_estimates_and_disputes
    claim:
      categories: [estimate]
      event_types: [estimate_requested, estimate_issued, estimate_line_recorded, estimate_revised, estimate_deposit_collected, estimate_deposit_refunded, estimate_cancellation_fee_retained, estimate_dispute_opened, estimate_cancelled]
    summary: >
      Patients call before care to ask what a scheduled service will cost, to get a good faith estimate or a self-pay package quote, to pay or recover a deposit, to cancel or move a packaged service, and after care because the bill came in well above the estimate they were given; the setting varies with the estimate type, the coverage answer the patient gave, scheduling lead time, the version history and per-provider lines, deposits held, the status of the linked hospital account and its billing, and the patient's other accounts, plans and assistance. The governing records are the estimate, its lines and deposit activity and the hospital account of the rendered service, under the estimate charter: who receives which estimate and by when in business days (estimate_gfe_issuance), line content and expected-charge basis per tier (estimate_content_and_lines), revisions (estimate_revision), package pricing, deposits and pre-service balances (estimate_package_pricing), cancellation fees and deposit refunds (estimate_cancellation_and_deposit_refund), deposit application across collections (estimate_agg_deposit_application), the patient-provider dispute threshold and window anchored on the initial bill (estimate_ppdr_eligibility), dispute outcomes (estimate_ppdr_outcome) and insured estimates and variance review (estimate_insured_and_variance_review). In the domain's natural order an estimate is requested, issued and perhaps revised, deposits are collected, the service is rendered and billed, and a dispute may follow; any ordering a specific call requires comes from its own policies, not from these base rules. Opening and issuing estimates, recording lines and revisions, recording deposits, retaining a fee, refunding deposits and logging a dispute notice are agent service actions, while paying a deposit and cancelling the scheduled service or the request are the patient's own acts. Requests no rule decides — honoring an insured estimate as a price cap, disputing a co-provider's bill with Riverbend, quoting a package for a code not on the schedule, or deciding a dispute in place of the dispute resolution entity — are POLICY_NOT_COVERED handoffs.
