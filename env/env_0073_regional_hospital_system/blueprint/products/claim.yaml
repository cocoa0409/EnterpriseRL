# ---- data flow (every write is an event) ----
events:
  - type: claim_submitted
    target: insurance_claims
    mutation: create
    meaning: A claim for an encounter is created and submitted to one payer in the coordination-of-benefits order.
    grain: one row per payer per billing of an encounter
    fields: {claim_id: new claim id, customer_id: the patient, encounter_id: account billed, variant_name: payer class, coverage_order: COB position, payer_name: payer as on card, member_id: member id as on card, group_number: group number as on card, prior_auth_number: authorization reference, service_date_from: first date of service, submitted_date: first submission date, last_submitted_date: same as submitted_date, claim_frequency_code: "1", total_billed_usd: charges billed}
    triggers:
      - event: claim:claim_billed
        map: {amount: total_billed_usd, posting_date: submitted_date}
  - type: claim_billed
    target: claim_transactions
    meaning: The billed charges of a submission open (or, for a replacement, re-open) the amount expected from the payer.
    grain: one row per submission sequence of the claim
    distinguish_by: [correction_seq]
    fields: {correction_seq: submission sequence (0 original), amount: billed charges expected from the payer, posting_date: submission date}
    account: payer_receivable
    direction: in
    triggers: []
  - type: claim_accepted
    target: insurance_claims
    mutation: {transition: {from: submitted, to: accepted}}
    meaning: The payer's 277CA acknowledgement accepts the claim.
    grain: one row per transaction
    fields: {status: accepted, payer_claim_number: ICN assigned}
    triggers: []
  - type: claim_rejected
    target: insurance_claims
    mutation: {transition: {from: submitted, to: rejected}}
    meaning: The claim is rejected at the front end before adjudication.
    grain: one row per transaction
    fields: {status: rejected, front_end_reject_reason: rejection reason}
    triggers: []
  - type: claim_resubmitted
    target: insurance_claims
    mutation: {transition: [{from: rejected, to: submitted}, {from: denied, to: submitted}, {from: adjudicated, to: submitted}]}
    meaning: Billing resubmits a corrected claim or a replacement claim.
    grain: one row per transaction
    fields: {status: submitted, last_submitted_date: resubmission date, claim_frequency_code: "1 after a rejection, 7 for a replacement", front_end_reject_reason: reset to NONE}
    triggers: []
  - type: claim_adjudicated
    target: insurance_claims
    mutation: {transition: [{from: accepted, to: adjudicated}, {from: appealed, to: adjudicated}]}
    meaning: The payer processes the claim (or overturns a denial on appeal) and issues a remittance.
    grain: one row per transaction
    fields: {status: adjudicated, adjudication_date: remittance date}
    triggers: []
  - type: claim_denied
    target: insurance_claims
    mutation: {transition: {from: accepted, to: denied}}
    meaning: The payer denies the claim in full.
    grain: one row per transaction
    fields: {status: denied, denial_date: date on the denial notice, denial_carc: denial reason code, denial_rarc: remark code}
    triggers: []
  - type: claim_appeal_upheld
    target: insurance_claims
    mutation: {transition: {from: appealed, to: denied}}
    meaning: The payer upholds the denial at the appeal level filed.
    grain: one row per transaction
    fields: {status: denied, denial_date: date on the appeal decision notice}
    triggers: []
  - type: claim_appealed
    target: insurance_claims
    mutation: {transition: [{from: denied, to: appealed}, {from: adjudicated, to: appealed}]}
    meaning: The claim enters appeal at the level just filed.
    grain: one row per transaction
    fields: {status: appealed, appeal_level: level filed}
    triggers: []
  - type: claim_closed
    target: insurance_claims
    mutation: {transition: [{from: adjudicated, to: closed}, {from: denied, to: closed}]}
    meaning: The claim closes with nothing further expected from the payer.
    grain: one row per transaction
    fields: {status: closed, closed_date: closing date}
    triggers: []
  - type: claim_member_info_updated
    target: insurance_claims
    mutation: update
    meaning: Subscriber data on the claim is corrected from the patient's insurance card or a payer eligibility response.
    grain: one row per transaction
    fields: {payer_name: payer as on card, member_id: corrected member id, group_number: corrected group number, prior_auth_number: authorization reference obtained}
    triggers: []
  - type: claim_payment_posted
    target: claim_transactions
    meaning: A payer payment from a remittance is posted to the claim.
    grain: one row per remittance payment on the claim
    distinguish_by: [remit_trace_number]
    fields: {remit_trace_number: EFT trace or check number, remit_date: remittance date, amount: amount paid, posting_date: posting date}
    account: payer_receivable
    direction: out
    triggers: []
  - type: claim_contractual_adjustment
    target: claim_transactions
    meaning: The contractual obligation (billed charges above the payer-allowed amount) is adjusted off the claim and never billed to the patient.
    grain: one row per remittance per contractual reason code
    distinguish_by: [remit_trace_number, carc_code]
    fields: {remit_trace_number: remittance, remit_date: remittance date, carc_code: CO-45, amount: contractual amount, posting_date: posting date}
    account: payer_receivable
    direction: out
    triggers: []
  - type: claim_patient_resp_transferred
    target: claim_transactions
    meaning: A patient-responsibility amount reported by the last payer in the coordination order is released from the claim to the patient's account.
    grain: one row per remittance per patient-responsibility reason code
    distinguish_by: [remit_trace_number, carc_code]
    fields: {remit_trace_number: remittance, remit_date: remittance date, carc_code: PR reason code, amount: patient-responsibility amount, posting_date: posting date}
    account: payer_receivable
    direction: out
    triggers:
      - event: encounter:encounter_liability_posted
        when: {carc_code: PR-1}
        map: {liability_source: DEDUCTIBLE, claim_id: claim_id, amount: amount, posting_date: posting_date}
      - event: encounter:encounter_liability_posted
        when: {carc_code: PR-2}
        map: {liability_source: COINSURANCE, claim_id: claim_id, amount: amount, posting_date: posting_date}
      - event: encounter:encounter_liability_posted
        when: {carc_code: PR-3}
        map: {liability_source: COPAY, claim_id: claim_id, amount: amount, posting_date: posting_date}
      - event: encounter:encounter_liability_posted
        when: {carc_code: PR-204}
        map: {liability_source: NONCOVERED_SERVICE, claim_id: claim_id, amount: amount, posting_date: posting_date}
      - event: encounter:encounter_liability_posted
        when: {carc_code: PR-27}
        map: {liability_source: COVERAGE_TERMINATED, claim_id: claim_id, amount: amount, posting_date: posting_date}
  - type: claim_secondary_crossover
    target: claim_transactions
    meaning: A primary payer's patient-responsibility amount is forwarded to the next payer in the coordination order instead of to the patient.
    grain: one row per remittance per patient-responsibility reason code forwarded
    distinguish_by: [remit_trace_number, carc_code]
    fields: {remit_trace_number: primary remittance, remit_date: primary remittance date, carc_code: PR reason code forwarded, amount: amount forwarded, posting_date: posting date}
    account: payer_receivable
    direction: out
    triggers: []
  - type: claim_denial_written_off
    target: claim_transactions
    meaning: A denied amount that may not be billed to the patient is written off by the hospital.
    grain: one row per denial reason code per write-off reason on the claim
    distinguish_by: [carc_code, writeoff_reason]
    fields: {carc_code: denial reason code, writeoff_reason: why written off, amount: amount written off, posting_date: posting date}
    account: payer_receivable
    direction: out
    triggers: []
  - type: claim_takeback
    target: claim_transactions
    meaning: The payer recovers an earlier payment by offset or refund request, re-opening the amount expected.
    grain: one row per recovery remittance
    distinguish_by: [remit_trace_number]
    fields: {remit_trace_number: remittance carrying the recovery, remit_date: remittance date, carc_code: WO-72, amount: amount recovered, posting_date: posting date}
    account: payer_receivable
    direction: in
    triggers: []
  - type: claim_correction_filed
    target: claim_transactions
    meaning: A resubmission or replacement claim is filed with the reason for the correction.
    grain: one row per submission sequence after the original
    distinguish_by: [correction_seq]
    fields: {correction_seq: submission sequence, correction_reason: reason, posting_date: filing date, amount: always 0.00}
    triggers:
      - event: claim:claim_resubmitted
        map: {last_submitted_date: posting_date}
  - type: claim_appeal_filed
    target: claim_transactions
    meaning: An appeal packet is filed with the payer at a given level.
    grain: one row per appeal level and appeal type on the claim
    distinguish_by: [appeal_level, appeal_type]
    fields: {appeal_level: level filed, appeal_type: kind of appeal, posting_date: filing date, amount: always 0.00}
    triggers:
      - event: claim:claim_appealed
        map: {appeal_level: appeal_level}

# ---- derived measures ----
measures:
  - id: claim_msr_corrections_filed
    window: the life of the claim up to the decision date
    measure: count of claim_correction_filed rows on the claim
  - id: claim_msr_appeals_filed
    window: the life of the claim up to the decision date
    measure: count of claim_appeal_filed rows on the claim (the next level is this count plus one)

# ---- policies ----
policies:
  - id: claim_agg_multi_holding
    subject: [claim_submitted]
    rule: >-
      A patient may have any number of claims, one per payer per billing of an encounter. An encounter carries at most one open claim per coverage_order; a SECONDARY claim is created only after the PRIMARY claim on the same encounter is adjudicated, and a TERTIARY claim only after the SECONDARY is adjudicated. A replacement for an existing claim is filed as a resubmission of that claim, never as a new claim.
    eligibility: []
    params: {max_per_customer: null}
  - id: claim_agg_coordination_of_benefits
    subject: [claim_submitted, claim_secondary_crossover, claim_patient_resp_transferred]
    rule: >-
      The claims of one encounter are combined in coverage_order. When a next payer exists in the order, the primary payer's patient-responsibility amounts are forwarded to that payer as a secondary crossover and are not released to the patient; only the patient-responsibility amounts reported by the last payer in the order are released to the patient's account. A secondary claim must be received within secondary_filing_days_from_primary_remit of the primary remittance date and carries the primary EOB; where crossover_automatic is true the payer crosses the claim over itself and Riverbend files no secondary claim by hand. A payer whose payer_of_last_resort is true is always ordered after every other coverage, whatever the date the coverage was reported. Payments from all payers on an encounter never exceed the encounter's billed charges; an excess is an overpayment refunded to the payer that paid last.
    eligibility: []
    params:
      per_tier:
        "Commercial PPO Claim": {secondary_filing_days: "=secondary_filing_days_from_primary_remit", crossover_automatic: "=crossover_automatic", payer_of_last_resort: "=payer_of_last_resort"}
        "Commercial HMO Claim": {secondary_filing_days: "=secondary_filing_days_from_primary_remit", crossover_automatic: "=crossover_automatic", payer_of_last_resort: "=payer_of_last_resort"}
        "Marketplace Exchange Plan Claim": {secondary_filing_days: "=secondary_filing_days_from_primary_remit", crossover_automatic: "=crossover_automatic", payer_of_last_resort: "=payer_of_last_resort"}
        "Medicare Advantage Plan Claim": {secondary_filing_days: "=secondary_filing_days_from_primary_remit", crossover_automatic: "=crossover_automatic", payer_of_last_resort: "=payer_of_last_resort"}
        "Original Medicare Claim": {secondary_filing_days: "=secondary_filing_days_from_primary_remit", crossover_automatic: "=crossover_automatic", payer_of_last_resort: "=payer_of_last_resort"}
        "BadgerCare Plus (Wisconsin Medicaid) Claim": {secondary_filing_days: "=secondary_filing_days_from_primary_remit", crossover_automatic: "=crossover_automatic", payer_of_last_resort: "=payer_of_last_resort"}
        "Wisconsin Workers' Compensation Claim": {secondary_filing_days: "=secondary_filing_days_from_primary_remit", crossover_automatic: "=crossover_automatic", payer_of_last_resort: "=payer_of_last_resort"}
  - id: claim_timely_filing
    subject: [claim_submitted, claim_resubmitted, claim_correction_filed, claim_denial_written_off]
    rule: >-
      A claim must be received by the payer within the payer class's timely-filing limit. A claim submission must be received no later than the timely-filing limit counted from the first date of service. Count calendar days starting the day after service_date_from; a claim received on the last day of the limit is timely. A front-end rejected submission never counts as received (rejection_counts_as_filed), so the clock keeps running from the date of service while the rejection is corrected. A replacement claim must also be received within corrected_claim_window_days of the adjudication or denial date, and no more than max_corrected_submissions replacements are filed on one claim (claim_msr_corrections_filed). When a CO-29 timely-filing denial is received and Riverbend holds one of the timely_filing_proof_accepted documents showing an earlier accepted submission inside the limit, the claim is resubmitted with that proof (TIMELY_FILING_PROOF_ATTACHED); without such proof the denied amount is written off as TIMELY_FILING_EXPIRED and is never billed to the patient.
    eligibility:
      - id: filing_limit
        applies_to: [claim_submitted, claim_resubmitted, claim_correction_filed]
        kind: time
        condition: A claim submission must be received no later than the timely-filing limit counted from the first date of service.
        evidence_fields: [insurance_claims.service_date_from, insurance_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[insurance_claims.claim_id]]
          action_bindings: {insurance_claims.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the first date of service
          anchor_source: insurance_claims.service_date_from
          relation: not_after
          duration_source: variants.timely_filing_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after service_date_from; a claim received on the last day of the limit is timely.
          boundary: inclusive
    params:
      per_tier:
        "Commercial PPO Claim": {timely_filing_days: "=timely_filing_days", corrected_window_days: "=corrected_claim_window_days", max_corrections: "=max_corrected_submissions"}
        "Commercial HMO Claim": {timely_filing_days: "=timely_filing_days", corrected_window_days: "=corrected_claim_window_days", max_corrections: "=max_corrected_submissions"}
        "Marketplace Exchange Plan Claim": {timely_filing_days: "=timely_filing_days", corrected_window_days: "=corrected_claim_window_days", max_corrections: "=max_corrected_submissions"}
        "Medicare Advantage Plan Claim": {timely_filing_days: "=timely_filing_days", corrected_window_days: "=corrected_claim_window_days", max_corrections: "=max_corrected_submissions"}
        "Original Medicare Claim": {timely_filing_days: "=timely_filing_days", corrected_window_days: "=corrected_claim_window_days", max_corrections: "=max_corrected_submissions"}
        "BadgerCare Plus (Wisconsin Medicaid) Claim": {timely_filing_days: "=timely_filing_days", corrected_window_days: "=corrected_claim_window_days", max_corrections: "=max_corrected_submissions"}
        "Wisconsin Workers' Compensation Claim": {timely_filing_days: "=timely_filing_days", corrected_window_days: "=corrected_claim_window_days", max_corrections: "=max_corrected_submissions"}
      timely_proof: "=timely_filing_proof_accepted"
      rejection_counts_as_filed: "=rejection_counts_as_filed"
    measures: [claim_msr_corrections_filed]
  - id: claim_denial_routing
    subject: [claim_denied, claim_rejected, claim_correction_filed, claim_resubmitted, claim_member_info_updated, claim_closed]
    rule: >-
      Every full denial and every front-end rejection is worked within denial_work_days by the route carc_routing assigns to its reason code. CORRECT_AND_RESUBMIT (missing or invalid data, CO-4, CO-11, CO-16) and every front-end rejection are fixed on the claim and resubmitted; a corrected member ID, group number or payer name is taken exactly as printed on the patient's current insurance card, as the patient reads it out or uploads it, and must match the payer class's member_id_format. PROVIDER_APPEAL_WITH_AUTH_EVIDENCE (CO-197) is appealed only when an authorization or a timely admission notification exists, or when the encounter was an emergency (emergency_auth_exempt); otherwise a retroactive authorization is requested when the date of service is within retro_auth_window_days, and failing both the amount is written off as NO_AUTHORIZATION_OBTAINED. MEDICAL_NECESSITY_APPEAL (CO-50) goes to appeal with the medical records. BILL_OTHER_PAYER_FIRST (CO-22) and BILL_CORRECT_PAYER (CO-109) require the coverage order to be corrected with the patient and the claim billed to the right payer. NO_ACTION_DUPLICATE (CO-18) needs no action. A PR-27 denial (coverage terminated before the date of service) releases the amount to the patient and the encounter's financial class is corrected. A PR-204 non-covered amount is released to the patient only when the noncovered_waiver_form signed before the service is on file (noncovered_waiver_required); without it the amount is written off as NONCOVERED_NO_WAIVER. CO-96 and every other CO, OA or PI amount (denial_not_billable_groups) are never billed to the patient. The claim closes once no route remains.
    eligibility: []
    params:
      carc_routing: "=carc_routing"
      denial_work_days: "=denial_work_days"
      per_tier:
        "Commercial PPO Claim": {retro_auth_window_days: "=retro_auth_window_days", admission_notification_business_days: "=admission_notification_business_days", prior_auth_required_classes: "=prior_auth_required_classes", member_id_format: "=member_id_format"}
        "Commercial HMO Claim": {retro_auth_window_days: "=retro_auth_window_days", admission_notification_business_days: "=admission_notification_business_days", prior_auth_required_classes: "=prior_auth_required_classes", member_id_format: "=member_id_format"}
        "Marketplace Exchange Plan Claim": {retro_auth_window_days: "=retro_auth_window_days", admission_notification_business_days: "=admission_notification_business_days", prior_auth_required_classes: "=prior_auth_required_classes", member_id_format: "=member_id_format"}
        "Medicare Advantage Plan Claim": {retro_auth_window_days: "=retro_auth_window_days", admission_notification_business_days: "=admission_notification_business_days", prior_auth_required_classes: "=prior_auth_required_classes", member_id_format: "=member_id_format"}
        "Original Medicare Claim": {retro_auth_window_days: "=retro_auth_window_days", admission_notification_business_days: "=admission_notification_business_days", prior_auth_required_classes: "=prior_auth_required_classes", member_id_format: "=member_id_format"}
        "BadgerCare Plus (Wisconsin Medicaid) Claim": {retro_auth_window_days: "=retro_auth_window_days", admission_notification_business_days: "=admission_notification_business_days", prior_auth_required_classes: "=prior_auth_required_classes", member_id_format: "=member_id_format"}
        "Wisconsin Workers' Compensation Claim": {retro_auth_window_days: "=retro_auth_window_days", admission_notification_business_days: "=admission_notification_business_days", prior_auth_required_classes: "=prior_auth_required_classes", member_id_format: "=member_id_format"}
      emergency_auth_exempt: "=emergency_auth_exempt"
      denial_not_billable_groups: "=denial_not_billable_groups"
  - id: claim_appeal_windows
    subject: [claim_appeal_filed, claim_appealed, claim_appeal_upheld]
    rule: >-
      An appeal is filed one level at a time; the next level is the number of appeals already filed on the claim plus one (claim_msr_appeals_filed), and no level above appeal_levels_available is filed. An appeal must be received no later than the appeal window counted from the denial notice date. Add notice_receipt_presumption_days to denial_date to obtain the presumed receipt date, then count calendar days starting the day after that date; an appeal received on the last day of the window is timely. A provider-level appeal uses provider_appeal_window_days; a member-level appeal filed for the patient uses member_appeal_window_days, and is available only where that window is greater than zero. Each level of appeal is filed once per claim. The payer decides a post-service appeal within payer_appeal_decision_days (expedited_appeal_hours when urgent). After the internal levels are exhausted, external review is requested within external_review_window_months calendar months of the final internal denial only where external_review_available is true. An upheld denial at the last available level leaves the routed write-off or patient release.
    eligibility:
      - id: appeal_window
        applies_to: [claim_appeal_filed]
        kind: time
        condition: An appeal must be received no later than the appeal window counted from the denial notice date.
        evidence_fields: [insurance_claims.denial_date, insurance_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[insurance_claims.claim_id]]
          action_bindings: {insurance_claims.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the denial notice date
          anchor_source: insurance_claims.denial_date
          relation: not_after
          duration_source: variants.provider_appeal_window_days
          unit: calendar_days
          counting_rule: Add notice_receipt_presumption_days to denial_date to obtain the presumed receipt date, then count calendar days starting the day after that date; an appeal received on the last day of the window is timely.
          boundary: inclusive
      - id: one_filing_per_level
        applies_to: [claim_appeal_filed]
        kind: dedup
        condition: Each level of appeal is filed once per claim.
        evidence_fields: [claim_transactions.claim_id, claim_transactions.appeal_level]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_transactions.claim_id]]
          action_bindings: {claim_transactions.claim_id: claim_id}
        dedup_contract:
          table: claim_transactions
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [claim_appeal_filed]}
          distinct_fields: [appeal_level]
    params:
      per_tier:
        "Commercial PPO Claim": {provider_window_days: "=provider_appeal_window_days", member_window_days: "=member_appeal_window_days", receipt_days: "=notice_receipt_presumption_days", levels: "=appeal_levels_available", decision_days: "=payer_appeal_decision_days", external_review: "=external_review_available", external_review_months: "=external_review_window_months"}
        "Commercial HMO Claim": {provider_window_days: "=provider_appeal_window_days", member_window_days: "=member_appeal_window_days", receipt_days: "=notice_receipt_presumption_days", levels: "=appeal_levels_available", decision_days: "=payer_appeal_decision_days", external_review: "=external_review_available", external_review_months: "=external_review_window_months"}
        "Marketplace Exchange Plan Claim": {provider_window_days: "=provider_appeal_window_days", member_window_days: "=member_appeal_window_days", receipt_days: "=notice_receipt_presumption_days", levels: "=appeal_levels_available", decision_days: "=payer_appeal_decision_days", external_review: "=external_review_available", external_review_months: "=external_review_window_months"}
        "Medicare Advantage Plan Claim": {provider_window_days: "=provider_appeal_window_days", member_window_days: "=member_appeal_window_days", receipt_days: "=notice_receipt_presumption_days", levels: "=appeal_levels_available", decision_days: "=payer_appeal_decision_days", external_review: "=external_review_available", external_review_months: "=external_review_window_months"}
        "Original Medicare Claim": {provider_window_days: "=provider_appeal_window_days", member_window_days: "=member_appeal_window_days", receipt_days: "=notice_receipt_presumption_days", levels: "=appeal_levels_available", decision_days: "=payer_appeal_decision_days", external_review: "=external_review_available", external_review_months: "=external_review_window_months"}
        "BadgerCare Plus (Wisconsin Medicaid) Claim": {provider_window_days: "=provider_appeal_window_days", member_window_days: "=member_appeal_window_days", receipt_days: "=notice_receipt_presumption_days", levels: "=appeal_levels_available", decision_days: "=payer_appeal_decision_days", external_review: "=external_review_available", external_review_months: "=external_review_window_months"}
        "Wisconsin Workers' Compensation Claim": {provider_window_days: "=provider_appeal_window_days", member_window_days: "=member_appeal_window_days", receipt_days: "=notice_receipt_presumption_days", levels: "=appeal_levels_available", decision_days: "=payer_appeal_decision_days", external_review: "=external_review_available", external_review_months: "=external_review_window_months"}
      expedited_appeal_hours: "=expedited_appeal_hours"
      appeal_submission_channel: "=appeal_submission_channel"
      medical_records_attach_on_appeal: "=medical_records_attach_on_appeal"
    measures: [claim_msr_appeals_filed]
  - id: claim_authorized_representative
    subject: [claim_appeal_filed]
    rule: >-
      Riverbend files a provider-level appeal in its own name without the patient's signature. A member-level appeal (MEMBER_APPEAL_WITH_AOR, MA_RECONSIDERATION or MEDICAID_HMO_APPEAL filed for the patient) asserts the patient's own appeal rights and is filed only under the patient's authorization. A member-level appeal requires a SIGNED authorized-representative form of the payer class's aor_form_type for that claim, signed no more than aor_validity_days before the filing date. The form is sent to the patient for signature through any of aor_signature_channels and only the patient can sign it; a form that is unsigned, revoked, of the wrong type or older than its validity cannot support the filing. The patient may instead file their own member appeal directly with the payer, in which case Riverbend files nothing at member level.
    eligibility:
      - id: signed_aor
        applies_to: [claim_appeal_filed]
        kind: authorization
        condition: A member-level appeal requires a SIGNED authorized-representative form of the payer class's aor_form_type for that claim, signed no more than aor_validity_days before the filing date.
        evidence_fields: [claim_appeal_authorizations.authorization_status, claim_appeal_authorizations.form_type, claim_appeal_authorizations.signed_date, claim_appeal_authorizations.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_appeal_authorizations.claim_id]]
          action_bindings: {claim_appeal_authorizations.claim_id: claim_id}
    params:
      per_tier:
        "Commercial PPO Claim": {aor_form_type: "=aor_form_type", aor_validity_days: "=aor_validity_days"}
        "Commercial HMO Claim": {aor_form_type: "=aor_form_type", aor_validity_days: "=aor_validity_days"}
        "Marketplace Exchange Plan Claim": {aor_form_type: "=aor_form_type", aor_validity_days: "=aor_validity_days"}
        "Medicare Advantage Plan Claim": {aor_form_type: "=aor_form_type", aor_validity_days: "=aor_validity_days"}
