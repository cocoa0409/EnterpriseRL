  - id: claim_remittance_posting
    subject: [claim_adjudicated, claim_payment_posted, claim_contractual_adjustment, claim_patient_resp_transferred, claim_closed]
    rule: >-
      Each payer remittance is posted line by line: the payment as a payer payment, the CO-45 contractual obligation as a contractual adjustment, and each PR line (PR-1 deductible, PR-2 coinsurance, PR-3 copay, PR-204 non-covered, PR-27 coverage terminated) as a patient-responsibility release to the patient's account (or as a secondary crossover when a next payer exists). The payer-allowed amount of a remittance is its payment plus its patient-responsibility lines. Because balance_billing_prohibited is true, the patient is never billed more than the PR lines the payer reported, and a contractual amount is never moved to the patient. Riverbend models the expected allowed amount as expected_allowed_pct_of_charges of the billed charges; when the allowed amount falls short of the expected allowed amount by at least underpayment_variance_usd and by at least underpayment_variance_pct of the expected allowed amount, the claim is routed for an UNDERPAYMENT_APPEAL. A payer must pay or deny a clean claim within payer_clean_claim_days. The claim closes when its payer balance reaches zero (claim_close_zero_balance).
    eligibility: []
    params:
      per_tier:
        "Commercial PPO Claim": {expected_allowed_pct: "=expected_allowed_pct_of_charges", variance_usd: "=underpayment_variance_usd", variance_pct: "=underpayment_variance_pct", clean_claim_days: "=payer_clean_claim_days", cost_share_model: "=patient_cost_share_model"}
        "Commercial HMO Claim": {expected_allowed_pct: "=expected_allowed_pct_of_charges", variance_usd: "=underpayment_variance_usd", variance_pct: "=underpayment_variance_pct", clean_claim_days: "=payer_clean_claim_days", cost_share_model: "=patient_cost_share_model"}
        "Marketplace Exchange Plan Claim": {expected_allowed_pct: "=expected_allowed_pct_of_charges", variance_usd: "=underpayment_variance_usd", variance_pct: "=underpayment_variance_pct", clean_claim_days: "=payer_clean_claim_days", cost_share_model: "=patient_cost_share_model"}
        "Medicare Advantage Plan Claim": {expected_allowed_pct: "=expected_allowed_pct_of_charges", variance_usd: "=underpayment_variance_usd", variance_pct: "=underpayment_variance_pct", clean_claim_days: "=payer_clean_claim_days", cost_share_model: "=patient_cost_share_model"}
        "Original Medicare Claim": {expected_allowed_pct: "=expected_allowed_pct_of_charges", variance_usd: "=underpayment_variance_usd", variance_pct: "=underpayment_variance_pct", clean_claim_days: "=payer_clean_claim_days", cost_share_model: "=patient_cost_share_model"}
        "BadgerCare Plus (Wisconsin Medicaid) Claim": {expected_allowed_pct: "=expected_allowed_pct_of_charges", variance_usd: "=underpayment_variance_usd", variance_pct: "=underpayment_variance_pct", clean_claim_days: "=payer_clean_claim_days", cost_share_model: "=patient_cost_share_model"}
        "Wisconsin Workers' Compensation Claim": {expected_allowed_pct: "=expected_allowed_pct_of_charges", variance_usd: "=underpayment_variance_usd", variance_pct: "=underpayment_variance_pct", clean_claim_days: "=payer_clean_claim_days", cost_share_model: "=patient_cost_share_model"}
      balance_billing_prohibited: "=balance_billing_prohibited"
      claim_close_zero_balance: "=claim_close_zero_balance"
    formula:
      expected_allowed: round(total_billed_usd * expected_allowed_pct_of_charges / 100, 2)
      variance_floor: max(underpayment_variance_usd, round(expected_allowed * underpayment_variance_pct / 100, 2))
  - id: claim_recoupment_and_overpayment
    subject: [claim_takeback, claim_appealed]
    rule: >-
      A payer takeback re-opens the amount expected from the payer by the amount recovered and is recorded against the remittance that carried it. Riverbend may dispute a takeback as a RECOUPMENT_DISPUTE appeal only within recoupment_dispute_days calendar days after the remittance date that carried it. Where recoupment_offset_allowed is false the payer must request a refund instead of offsetting, and an offset taken anyway is disputed. An overpayment Riverbend identifies itself (a duplicate payment, a payment after another payer paid primary, or payments above the billed charges) is refunded to the payer within overpayment_refund_days calendar days of identification. A takeback never changes what the patient owes unless the payer re-adjudicates the claim with different patient-responsibility lines.
    eligibility:
      - id: recoupment_dispute_window
        applies_to: [claim_appealed]
        kind: time
        condition: Riverbend may dispute a takeback as a RECOUPMENT_DISPUTE appeal only within recoupment_dispute_days calendar days after the remittance date that carried it.
        evidence_fields: [claim_transactions.remit_date, claim_transactions.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_transactions.claim_id]]
          action_bindings: {claim_transactions.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the remittance date that carried it
          anchor_source: claim_transactions.remit_date
          relation: not_after
          duration_source: variants.recoupment_dispute_days
          unit: calendar_days
          counting_rule: within recoupment_dispute_days calendar days after the remittance date
          boundary: inclusive
    params:
      per_tier:
        "Commercial PPO Claim": {recoupment_dispute_days: "=recoupment_dispute_days", overpayment_refund_days: "=overpayment_refund_days", recoupment_offset_allowed: "=recoupment_offset_allowed"}
        "Commercial HMO Claim": {recoupment_dispute_days: "=recoupment_dispute_days", overpayment_refund_days: "=overpayment_refund_days", recoupment_offset_allowed: "=recoupment_offset_allowed"}
        "Marketplace Exchange Plan Claim": {recoupment_dispute_days: "=recoupment_dispute_days", overpayment_refund_days: "=overpayment_refund_days", recoupment_offset_allowed: "=recoupment_offset_allowed"}
        "Medicare Advantage Plan Claim": {recoupment_dispute_days: "=recoupment_dispute_days", overpayment_refund_days: "=overpayment_refund_days", recoupment_offset_allowed: "=recoupment_offset_allowed"}
        "Original Medicare Claim": {recoupment_dispute_days: "=recoupment_dispute_days", overpayment_refund_days: "=overpayment_refund_days", recoupment_offset_allowed: "=recoupment_offset_allowed"}
        "BadgerCare Plus (Wisconsin Medicaid) Claim": {recoupment_dispute_days: "=recoupment_dispute_days", overpayment_refund_days: "=overpayment_refund_days", recoupment_offset_allowed: "=recoupment_offset_allowed"}
        "Wisconsin Workers' Compensation Claim": {recoupment_dispute_days: "=recoupment_dispute_days", overpayment_refund_days: "=overpayment_refund_days", recoupment_offset_allowed: "=recoupment_offset_allowed"}
  - id: claim_denial_write_off
    subject: [claim_denial_written_off, claim_closed]
    rule: >-
      A denied amount is written off by the hospital, never billed to the patient, when its route ends in a write-off: TIMELY_FILING_EXPIRED (no timely-filing proof), NO_AUTHORIZATION_OBTAINED (no authorization, notification, emergency exemption or retro authorization), NONCOVERED_NO_WAIVER (no advance waiver on file), APPEALS_EXHAUSTED (the last available level upheld the denial), or BELOW_APPEAL_THRESHOLD (a denied amount at or below small_denial_write_off_usd that is not worth appealing). A denied amount above small_denial_write_off_usd is never written off as BELOW_APPEAL_THRESHOLD while an appeal window remains open. The same denial reason is written off once per write-off reason on a claim. A write-off never reduces the patient's own liability posted from other remittance lines.
    eligibility:
      - id: one_write_off_per_reason
        applies_to: [claim_denial_written_off]
        kind: dedup
        condition: The same denial reason is written off once per write-off reason on a claim.
        evidence_fields: [claim_transactions.claim_id, claim_transactions.carc_code, claim_transactions.writeoff_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_transactions.claim_id]]
          action_bindings: {claim_transactions.claim_id: claim_id}
        dedup_contract:
          table: claim_transactions
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [claim_denial_written_off]}
          distinct_fields: [carc_code, writeoff_reason]
    params:
      per_tier:
        "Commercial PPO Claim": {small_denial_usd: "=small_denial_write_off_usd", waiver_form: "=noncovered_waiver_form", waiver_required: "=noncovered_waiver_required"}
        "Commercial HMO Claim": {small_denial_usd: "=small_denial_write_off_usd", waiver_form: "=noncovered_waiver_form", waiver_required: "=noncovered_waiver_required"}
        "Marketplace Exchange Plan Claim": {small_denial_usd: "=small_denial_write_off_usd", waiver_form: "=noncovered_waiver_form", waiver_required: "=noncovered_waiver_required"}
        "Medicare Advantage Plan Claim": {small_denial_usd: "=small_denial_write_off_usd", waiver_form: "=noncovered_waiver_form", waiver_required: "=noncovered_waiver_required"}
        "Original Medicare Claim": {small_denial_usd: "=small_denial_write_off_usd", waiver_form: "=noncovered_waiver_form", waiver_required: "=noncovered_waiver_required"}
        "BadgerCare Plus (Wisconsin Medicaid) Claim": {small_denial_usd: "=small_denial_write_off_usd", waiver_form: "=noncovered_waiver_form", waiver_required: "=noncovered_waiver_required"}
        "Wisconsin Workers' Compensation Claim": {small_denial_usd: "=small_denial_write_off_usd", waiver_form: "=noncovered_waiver_form", waiver_required: "=noncovered_waiver_required"}
  - id: claim_status_followup
    subject: [claim_billed, claim_accepted, claim_rejected, claim_member_info_updated]
    rule: >-
      Every claim is submitted in the payer class's submission_format and a 277CA acceptance or rejection is expected within acknowledgement_expected_days. An accepted claim with no remittance after followup_first_touch_days is followed up by claim-status inquiry, then every followup_interval_days; after max_followups_before_escalation unanswered follow-ups the claim is escalated to the payer's provider representative. Coverage and coordination-of-benefits answers older than cob_questionnaire_refresh_days must be re-confirmed with the patient before the next claim is submitted, and subscriber data changed by the patient is applied to every open claim of the same payer before resubmission.
    eligibility: []
    params:
      per_tier:
        "Commercial PPO Claim": {submission_format: "=submission_format", ack_days: "=acknowledgement_expected_days", first_touch_days: "=followup_first_touch_days", interval_days: "=followup_interval_days", max_followups: "=max_followups_before_escalation", cob_refresh_days: "=cob_questionnaire_refresh_days"}
        "Commercial HMO Claim": {submission_format: "=submission_format", ack_days: "=acknowledgement_expected_days", first_touch_days: "=followup_first_touch_days", interval_days: "=followup_interval_days", max_followups: "=max_followups_before_escalation", cob_refresh_days: "=cob_questionnaire_refresh_days"}
