# Product charter — Insurance Claim (Third-Party Billing). Riverbend Regional Health, Patient Financial Services / Billing.
category: claim
display_name: Insurance Claim (Third-Party Billing)

binding:
  holding_table: insurance_claims
  event_tables: [claim_transactions]
  intake_tables: [claim_appeal_authorizations]
  status_field: status
  variant_field: variant_name
  quantity_fields: {payer_balance: payer_receivable}

lifecycle:
  states: [submitted, accepted, rejected, adjudicated, denied, appealed, closed]
  transitions:
    - {from: submitted, to: accepted, by: system, means: The payer's front-end acknowledgement (277CA) accepts the claim into adjudication.}
    - {from: submitted, to: rejected, by: system, means: The payer or clearinghouse rejects the claim at the front end; a rejected claim was never received.}
    - {from: rejected, to: submitted, by: agent, means: Billing corrects the rejected data and resubmits.}
    - {from: accepted, to: adjudicated, by: system, means: The payer processes the claim with payment and/or patient responsibility on the remittance.}
    - {from: accepted, to: denied, by: system, means: The payer denies the claim in full on the remittance.}
    - {from: denied, to: submitted, by: agent, means: Billing submits a replacement (corrected) claim for the denied claim.}
    - {from: adjudicated, to: submitted, by: agent, means: Billing submits a replacement claim after a late charge, charge credit or coding correction.}
    - {from: denied, to: appealed, by: agent, means: Billing files an appeal of the denial (provider-level, or member-level under the patient's authorization).}
    - {from: adjudicated, to: appealed, by: agent, means: Billing files an underpayment or partial-denial appeal.}
    - {from: appealed, to: adjudicated, by: system, means: The payer overturns the denial in whole or in part and reprocesses.}
    - {from: appealed, to: denied, by: system, means: The payer upholds the denial at that appeal level.}
    - {from: adjudicated, to: closed, by: system, means: The payer balance reaches zero.}
    - {from: denied, to: closed, by: agent, means: No further route remains and the denied amount is written off or released to the patient.}

accounts:
  - key: payer_receivable
    unit: USD
    meaning: The amount still expected from this payer on the claim; billed amounts and payer takebacks add to it, payer payments, contractual adjustments, patient-responsibility releases, crossovers to the next payer and denial write-offs reduce it.

# ---- category-level parameter dictionary ----
parameter_schema:
  timely_filing_days: integer calendar days from the claim's first date of service (service_date_from) by which a clean claim must be received by the payer (Riverbend payer agreement or program rule)
  corrected_claim_window_days: integer calendar days from the adjudication or denial date within which a replacement (frequency 7) claim is accepted
  provider_appeal_window_days: integer calendar days from the denial date (plus notice_receipt_presumption_days) within which Riverbend's provider-level appeal or redetermination must be received
  member_appeal_window_days: integer calendar days from the date on the adverse determination notice within which a member-level appeal filed for the patient must be received; 0 means the program has no member-level appeal and disputes go to the state workers' compensation process
  notice_receipt_presumption_days: integer calendar days added to the notice date as the presumed date of receipt before an appeal window starts (0 = window counts from the notice date)
  appeal_levels_available: integer number of sequential appeal levels Riverbend may pursue for the patient on this payer class
  external_review_available: boolean — whether independent external review is available after the internal appeals are exhausted
  external_review_window_months: integer calendar months after the final internal adverse determination within which external review may be requested (0 = not available)
  payer_appeal_decision_days: integer calendar days the payer has to decide a post-service appeal
  expedited_appeal_hours: integer hours for an expedited (urgent) appeal decision
  aor_required_for_member_appeal: boolean — whether a signed authorized-representative form from the patient must be on file before Riverbend files a member-level appeal
  aor_form_type: enum form_type of the authorized-representative form this payer class accepts
  aor_validity_days: integer calendar days from the patient's signature date that the authorized-representative form remains valid
  prior_auth_required_classes: list of encounter patient classes for which this payer class requires prior authorization (emergency services never require it)
  emergency_auth_exempt: boolean — emergency services are never denied for lack of prior authorization
  admission_notification_business_days: integer business days after an urgent or emergency inpatient admission within which the payer must be notified to avoid an authorization denial
  retro_auth_window_days: integer calendar days after the date of service within which a retroactive authorization request is accepted (0 = never accepted)
  carc_routing: mapping CARC (group-code prefixed) -> the work route for a denial or adjustment line
  timely_filing_proof_accepted: list of documents that prove a claim was originally filed on time and overturn a CO-29 timely-filing denial
  rejection_counts_as_filed: boolean — whether a front-end (277CA) rejected submission counts as received for timely filing (it never does)
  max_corrected_submissions: integer maximum replacement claims Riverbend submits on one claim before routing to payer escalation
  corrected_claim_frequency_code: claim frequency code used for a replacement claim
  void_claim_frequency_code: claim frequency code used to void a claim
  expected_allowed_pct_of_charges: percent of gross billed charges Riverbend expects as the payer-allowed amount under the payer agreement or program fee schedule (contract modeling basis)
  underpayment_variance_usd: USD shortfall of the allowed amount against the expected allowed amount at or above which an underpayment appeal is filed
  underpayment_variance_pct: percent shortfall of the allowed amount against the expected allowed amount at or above which an underpayment appeal is filed (both the USD and percent thresholds must be met)
  small_denial_write_off_usd: USD denied amount at or below which a CO denial is written off without appeal (cost to collect)
  recoupment_dispute_days: integer calendar days after a payer takeback within which Riverbend may dispute it
  overpayment_refund_days: integer calendar days after an overpayment is identified within which it is refunded to the payer
  payer_clean_claim_days: integer calendar days within which the payer must pay or deny a clean claim
  followup_first_touch_days: integer calendar days after acceptance with no remittance before the first claim-status follow-up
  followup_interval_days: integer calendar days between later claim-status follow-ups
  max_followups_before_escalation: integer follow-ups without a response before the claim is escalated to the payer's provider representative
  denial_work_days: integer calendar days after a denial within which billing must take the routed action
  secondary_filing_days_from_primary_remit: integer calendar days after the primary payer's remittance date within which a secondary claim with the primary EOB must be received
  crossover_automatic: boolean — whether this payer automatically crosses the claim over to the secondary payer
  payer_of_last_resort: boolean — whether this payer pays only after every other coverage
  balance_billing_prohibited: boolean — whether Riverbend is barred from billing the patient any amount above the patient-responsibility amounts the payer reports
  noncovered_waiver_required: boolean — whether a PR-204 or non-covered amount may be billed to the patient only with a signed advance waiver on file
  noncovered_waiver_form: name of the advance notice the patient must have signed before a non-covered service for it to be billable
  patient_cost_share_model: enum how the payer expresses patient cost sharing on remittances
  submission_format: enum claim submission format
  acknowledgement_expected_days: integer calendar days within which a 277CA acceptance or rejection is expected after submission
  member_id_format: format of a valid member identifier for this payer class
  cob_questionnaire_refresh_days: integer calendar days after which coverage and coordination-of-benefits information must be re-confirmed with the patient before the next claim
  aor_signature_channels: list of channels through which the patient may sign an authorized-representative form
  appeal_submission_channel: enum channel Riverbend uses to submit appeals
  medical_records_attach_on_appeal: boolean — whether the appeal packet must include the encounter's medical records
  denial_not_billable_groups: list of claim adjustment group codes whose amounts may never be billed to the patient
  recoupment_offset_allowed: boolean — whether the payer may recover an overpayment by offsetting a later remittance
  claim_close_zero_balance: boolean — whether a claim closes as soon as its payer balance reaches zero

