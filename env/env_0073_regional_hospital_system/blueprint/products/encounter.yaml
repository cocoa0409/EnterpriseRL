# Product charter — Hospital Account (Encounter Billing). Riverbend Regional Health, Patient Financial Services.
category: encounter
display_name: Hospital Account (Encounter Billing)

binding:
  holding_table: encounter_accounts
  event_tables: [encounter_transactions]
  intake_tables: [encounter_billing_inquiries]
  status_field: status
  variant_field: variant_name
  quantity_fields: {gross_charges_total: gross_charges, patient_balance: patient_balance}

lifecycle:
  states: [pending_billing, insurance_pending, patient_due, billing_hold, bad_debt, closed]
  transitions:
    - {from: pending_billing, to: insurance_pending, by: system, means: The final bill drops to the primary payer after the bill-hold days and a claim is created.}
    - {from: pending_billing, to: patient_due, by: system, means: The final bill drops to the patient on a SELF_PAY account and the self-pay liability posts.}
    - {from: insurance_pending, to: patient_due, by: system, means: The payer adjudicated the claim leaving patient responsibility on the account.}
    - {from: insurance_pending, to: closed, by: system, means: The payer paid in full and no patient responsibility remains.}
    - {from: patient_due, to: billing_hold, by: agent, means: A representative places a billing hold (itemization review, charge dispute, pending financial assistance application, coverage update or good-faith-estimate dispute).}
    - {from: billing_hold, to: patient_due, by: agent, means: The hold reason is resolved or the hold period lapses and statements resume.}
    - {from: patient_due, to: insurance_pending, by: agent, means: Newly reported coverage is verified and the account is rebilled to that payer.}
    - {from: billing_hold, to: insurance_pending, by: agent, means: Coverage reported during a coverage-update hold is verified and the account is rebilled.}
    - {from: patient_due, to: bad_debt, by: system, means: The account reaches the placement day with a balance at or above the placement minimum and is placed with the collection agency.}
    - {from: bad_debt, to: patient_due, by: agent, means: The account is recalled from the agency (financial assistance application, dispute or billing error) and returns to in-house servicing.}
    - {from: patient_due, to: closed, by: system, means: The patient balance reaches zero (or a small balance is written off).}
    - {from: billing_hold, to: closed, by: agent, means: An adjustment during the hold brings the patient balance to zero.}
    - {from: bad_debt, to: closed, by: system, means: The placed balance is paid or written off by the agency closing cycle.}

accounts:
  - key: gross_charges
    unit: USD
    meaning: Total chargemaster (CDM) charges on the encounter; charge postings add to it and charge credits reduce it.
  - key: patient_balance
    unit: USD
    meaning: The amount the patient currently owes on the encounter; liability postings and refunds add to it, payments, discounts and adjustments reduce it (negative means a credit balance).

# ---- category-level parameter dictionary ----
parameter_schema:
  bill_hold_days: 'integer calendar days after service_end_date (for the recurring therapy account: after the last day of each service month) before the final bill drops to the payer or to the patient'
  billing_frequency: enum PER_ENCOUNTER | MONTHLY_SERIES — whether one final bill covers the whole encounter or each calendar month of a recurring series is billed separately
  late_charge_window_days: integer calendar days after final_bill_date within which a late charge may still post and be billed; a late charge found after it is written off and never billed to the patient
  uninsured_discount_pct: percent of gross charges deducted for a SELF_PAY financial-class account on medically necessary or emergency services, posted at final bill (Riverbend uninsured discount schedule)
  uninsured_discount_elective_pct: percent of gross charges deducted for a SELF_PAY account whose service_classification is ELECTIVE_NON_COVERED
  uninsured_discount_on_noncovered_insured: boolean — whether an insured patient's NONCOVERED_SERVICE liability line receives the uninsured discount percent
  uninsured_discount_rounding: 'rounding basis for every discount amount: half-up to the cent on the computed USD amount'
  prompt_pay_discount_pct: percent of the remaining patient balance deducted when the balance is paid in full inside the prompt-pay window
  prompt_pay_window_days: integer calendar days counted from first_statement_date within which a full payment earns the prompt-pay discount
  prompt_pay_min_balance_usd: USD minimum patient balance at the time of payment for the prompt-pay discount to apply
  prompt_pay_eligible_channels: list of payment_channel values that can earn the prompt-pay discount
  prompt_pay_stacks_with_uninsured: boolean — whether the prompt-pay discount is computed on the balance remaining after the uninsured discount (true) instead of being withheld when an uninsured discount was posted (false)
  prompt_pay_excluded_after_fap: boolean — whether an encounter that has received a FAP_CHARITY_ADJUSTMENT is excluded from the prompt-pay discount
  prompt_pay_excluded_in_payment_plan: boolean — whether an encounter enrolled in a payment plan is excluded from the prompt-pay discount
  statement_cycle_days: integer calendar days between consecutive summary statements on a patient_due account
  summary_statements_before_final_notice: integer number of summary statements issued before the FINAL_NOTICE statement
  statement_min_balance_usd: USD balance below which no summary statement is generated for the cycle
  eca_notification_period_days: integer calendar days from first_statement_date before any extraordinary collection action (agency placement with credit reporting) may begin
  final_notice_lead_days: integer calendar days a FINAL_NOTICE must precede any extraordinary collection action
  bad_debt_placement_after_days: integer calendar days from first_statement_date at which an unresolved patient_due account is placed with the collection agency
  bad_debt_min_balance_usd: USD minimum patient balance for collection-agency placement; smaller balances stay in house
  credit_reporting_min_balance_usd: USD minimum placed balance the agency may report to the consumer credit bureaus
  credit_reporting_min_age_days: integer calendar days from first_statement_date before a placed balance may be credit-reported
  legal_action_permitted: boolean — whether Riverbend files lawsuits, wage garnishments or liens on patient balances
  interest_rate_pct: annual percent interest charged on patient balances (Riverbend charges none)
  itemized_statement_turnaround_business_days: integer business days (Monday-Friday excluding Riverbend holidays) after the request within which an itemized statement is issued
  itemized_statement_collection_pause_days: integer calendar days collection activity (statements past the current cycle, final notice, placement) pauses after an itemized statement is requested
  itemized_statement_channels: list of delivery_channel values available for an itemized statement
  itemized_statement_fee_usd: USD fee for an itemized statement copy (Riverbend provides them free)
  charge_dispute_filing_window_days: integer calendar days after the posting_date of the first statement that listed the disputed charge within which a charge dispute is accepted
  charge_dispute_hold_days: integer calendar days of billing hold granted while a charge dispute is reviewed
  charge_dispute_response_business_days: integer business days after the dispute is logged within which billing review answers it
  max_charge_disputes_per_encounter: integer number of charge disputes accepted per encounter
  rep_charge_credit_authority_usd: USD maximum charge-line credit a patient financial services representative may post without coding review
  duplicate_charge_auto_credit: boolean — whether a line duplicating another line's cdm_code, service_date and units is credited without coding review
  service_recovery_courtesy_max_usd: USD maximum one-time service-recovery courtesy adjustment per encounter
  service_recovery_courtesy_per_year: integer number of courtesy adjustments allowed per patient per calendar year across all encounters
  small_balance_write_off_usd: USD remaining patient balance at or below which the balance is written off as SMALL_BALANCE_WRITE_OFF
  refund_min_credit_usd: USD minimum credit balance that is refunded; smaller credits are held on the profile
  refund_issue_days: integer calendar days after a credit balance arises within which the refund is issued
  refund_card_max_age_days: integer calendar days since the card payment within which a refund goes back to the original card; older card payments and checks are refunded by PAPER_CHECK, ACH payments by ACH_CREDIT
  credit_offset_open_balances: boolean — whether a credit balance is first applied to the same patient's other patient_due encounters (oldest service_start_date first) before any refund
  payment_application_order: enum basis for applying an undesignated payment across the patient's patient_due encounters
  card_payment_max_usd: USD maximum single card payment accepted by phone or portal
  insurance_no_response_days: integer calendar days after the claim's submitted_date with no adjudication after which the account is reviewed for patient billing
  coverage_update_window_days: integer calendar days after first_statement_date within which newly reported insurance is billed (subject to the payer's timely-filing limit)
  coverage_update_hold_days: integer calendar days of billing hold while newly reported coverage is verified
  max_billing_holds_per_encounter: integer number of billing holds an encounter may receive over its life
  final_notice_channel: enum delivery_channel always used for a FINAL_NOTICE, whatever the patient's paperless preference
  statement_consolidation: enum — summary statements consolidate every patient_due encounter of the guarantor into one mailing

