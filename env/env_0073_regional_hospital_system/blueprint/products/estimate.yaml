# Product charter — Good Faith Estimates, Patient Estimates & Self-Pay Package Prices. Riverbend Regional Health, Price Transparency & Scheduling Financial Clearance.
category: estimate
display_name: Good Faith & Price Estimates

binding:
  holding_table: price_estimates
  event_tables: [estimate_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deposit_held_usd: deposit_held}

lifecycle:
  states: [requested, issued, service_completed, in_dispute, closed, cancelled]
  transitions:
    - {from: requested, to: issued, by: agent, means: The estimate is furnished to the patient.}
    - {from: requested, to: cancelled, by: user, means: The patient withdraws the request before an estimate is furnished.}
    - {from: issued, to: cancelled, by: user, means: The patient cancels the scheduled service.}
    - {from: issued, to: service_completed, by: system, means: The service is rendered, the hospital account is linked and the initial bill is dated.}
    - {from: issued, to: closed, by: system, means: The estimate lapses unused after its validity period.}
    - {from: service_completed, to: in_dispute, by: agent, means: Notice of a patient-provider dispute on Riverbend's charges is received and logged.}
    - {from: service_completed, to: closed, by: system, means: The dispute window passes or the linked balance is resolved without a dispute.}
    - {from: in_dispute, to: closed, by: system, means: The dispute resolution entity issues its determination or the parties settle.}

accounts:
  - key: deposit_held
    unit: USD
    meaning: Prepayments collected against the estimate and not yet applied, refunded or retained; collections add to it, application to the hospital account, refunds and retained cancellation fees reduce it.

# ---- category-level parameter dictionary ----
parameter_schema:
  gfe_required: boolean — whether the estimate is a No Surprises Act good faith estimate for an uninsured or self-pay individual
  min_scheduling_lead_bd: integer business days between the scheduling date and the service date at or above which a good faith estimate must be furnished before the service
  issue_bd_scheduled_3_to_9: integer business days after the scheduling date within which the GFE is furnished when the service is scheduled at least 3 but fewer than 10 business days ahead
  issue_bd_scheduled_10_plus: integer business days after the scheduling date within which the GFE is furnished when the service is scheduled at least 10 business days ahead
  issue_bd_on_request: integer business days after an unscheduled request within which the GFE is furnished
  insured_estimate_turnaround_bd: integer business days after the request within which an insured out-of-pocket estimate is furnished
  business_day_calendar: enum business-day basis used for every estimate deadline
  revision_lead_bd: integer business days before the scheduled service by which a revised estimate is furnished after a change in scope, providers or date
  recurring_course_max_months: integer months a single recurring-course estimate may cover
  ppdr_threshold_usd: USD amount by which a provider's or facility's billed charges must exceed that provider's or facility's expected charges on the GFE for the patient-provider dispute process to be available
  ppdr_initiation_days: integer calendar days from the date on the initial bill within which the patient may initiate the patient-provider dispute
  ppdr_admin_fee_usd: USD administrative fee the patient pays the selected dispute resolution entity
  ppdr_fee_credit_if_favored: boolean — whether the amount due is further reduced by the administrative fee when the determination is below the billed charges
  ppdr_collection_hold: boolean — whether the billed amount is kept out of collections and statements stop escalating while the dispute is pending
  ppdr_eligible_coverage: list of coverage_status values eligible for the patient-provider dispute
  ppdr_comparison_basis: enum what is compared with the GFE expected charges for Riverbend's own charges
  record_retention_years: integer years a furnished estimate is retained and available to the patient
  includes_co_provider_lines: boolean — whether the estimate carries expected-charge lines for co-providers
  co_provider_roles: list of provider_role values included as co-providers
  co_provider_submission_bd: integer business days a co-provider has to send its expected charges to Riverbend as convening provider
  expected_charge_basis: enum how Riverbend's own expected charges are computed
  package_price_schedule: mapping CPT code -> USD all-inclusive package price for package tiers; PRICED_PER_LINE for non-package tiers
  package_includes_professional_fees: boolean — whether the package price includes Riverbend Medical Group professional fees
  package_exclusions: list of items billed outside the package or GFE at actual charges
  package_upgrade_differential_usd: USD added when the delivered service upgrades within the package (cesarean delivery under the maternity package); 0.00 when the tier has no upgrade
  package_extra_day_usd: USD per additional overnight stay beyond the package's included stay; 0.00 when the tier has no overnight component
  package_included_nights: integer overnight stays included in the package price
  package_validity_days: integer calendar days after issue within which the service must be performed for the quoted price to hold
  deposit_pct: percent of the estimate total collected as a deposit at scheduling
  balance_due_days_before_service: integer calendar days before the scheduled service date by which the remaining package price is paid (0 = no pre-service balance)
  deposit_methods: list of payment methods accepted for deposits
  full_refund_cancel_days: integer calendar days before the scheduled service date at or beyond which a cancellation refunds the whole deposit
  late_cancellation_fee_usd: USD retained from the deposit when a package service is cancelled later than full_refund_cancel_days (never more than the deposit held)
  medical_cancellation_fee_waived: boolean — whether the late-cancellation fee is waived when the cancelling physician documents a medical reason
  deposit_refund_days: integer calendar days after cancellation within which a deposit refund is issued
  deposit_refund_method: enum refund method for deposits
  deposit_application_timing: enum when held deposits are applied to the hospital account
  insured_benefit_verification_required: boolean — whether benefits and remaining deductible are verified with the payer before the estimate is issued
  insured_estimate_binding: boolean — whether the estimate limits what the patient may be billed
  variance_review_pct: percent by which the patient's actual liability may exceed the estimate total before Patient Financial Services reviews the variance with the patient
  estimate_request_channels: list of request_channel values accepted
  estimate_delivery_channels: list of channels through which the estimate is delivered (paper or electronic, at the patient's choice)
  coverage_inquiry_required: boolean — whether the scheduler must ask whether the patient has coverage and whether they intend to use it
  gfe_rights_notice_required: boolean — whether the notice of the right to a good faith estimate is given at scheduling and on request
  max_lines_per_version: integer maximum expected-charge lines on one estimate version
  diagnosis_codes_required: boolean — whether expected diagnosis codes are listed on the estimate
  estimate_disclaimer: enum standard disclaimer printed on the estimate
  recurring_reissue_on_change: boolean — whether any change in frequency or items of a recurring course requires a new version
  dispute_hold_reason: enum billing-hold reason placed on the linked hospital account while a dispute is pending
  expired_estimate_reissue: enum what happens when a service is scheduled after package_validity_days

