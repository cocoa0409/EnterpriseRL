# Product charter — Patient Payment Plan. Riverbend Regional Health, Patient Financial Services.
category: plan
display_name: Patient Payment Plan

binding:
  holding_table: payment_plans
  event_tables: [plan_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {plan_balance: plan_balance}

lifecycle:
  states: [pending_signature, active, past_due, defaulted, paid_off, cancelled]
  transitions:
    - {from: pending_signature, to: active, by: user, means: The patient signs the plan agreement (and pays any down payment) and the plan starts.}
    - {from: pending_signature, to: cancelled, by: system, means: The signature deadline lapses without a signature.}
    - {from: active, to: past_due, by: system, means: An installment remains unpaid past its grace days.}
    - {from: past_due, to: active, by: system, means: The patient pays every missed installment and the plan is current again.}
    - {from: past_due, to: active, by: agent, means: A representative re-ages the plan, moving the missed amount to the end of the term.}
    - {from: past_due, to: defaulted, by: system, means: The plan reaches the missed-installment count for default.}
    - {from: defaulted, to: active, by: agent, means: A representative reinstates the plan after the catch-up payment inside the reinstatement window.}
    - {from: active, to: paid_off, by: system, means: The plan balance reaches zero.}
    - {from: past_due, to: paid_off, by: system, means: The plan balance reaches zero while past due (lump-sum payoff or adjustments).}
    - {from: active, to: cancelled, by: user, means: The patient cancels the plan and the remaining balances return to standard statements.}

accounts:
  - key: plan_balance
    unit: USD
    meaning: The amount still owed under the plan; enrolled encounter balances add to it, installments (including the down payment) and reductions from adjustments on the enrolled encounters reduce it.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_enrolled_balance_usd: USD minimum total enrolled balance at plan creation for the tier
  max_enrolled_balance_usd: USD maximum total enrolled balance for the tier
  max_term_months: integer maximum number of monthly installments (excluding the down payment)
  min_monthly_payment_usd: USD floor of the monthly installment
  down_payment_pct: percent of the enrolled balance due as a down payment at signing (0 = none)
  installment_rounding: 'rounding basis of the monthly installment: half-up to the cent, the final installment absorbing any remainder'
  interest_rate_pct: annual percent interest on plan balances (Riverbend plans are interest-free)
  setup_fee_usd: USD fee to open a plan
  late_fee_usd: USD fee for a late or missed installment
  returned_payment_fee_usd: USD fee for a returned ACH draft or check
  early_payoff_penalty_usd: USD penalty for paying a plan off early
  signature_deadline_days: integer calendar days after the plan is offered (created) within which the patient must sign the agreement
  first_due_days_after_signing: integer minimum calendar days between the signing date and the first installment due date
  due_day_options: list of days of the month the patient may choose as the installment due day
  autopay_required: boolean — whether automatic payment by ACH or card is required on the tier
  autopay_methods: list of autopay methods offered
  autopay_retry_days: integer calendar days after a failed autopay draft before the single retry
  autopay_retry_count: integer number of retries of a failed autopay draft
  plan_payment_channels: list of channels through which an installment may be paid
  grace_days: integer calendar days after an installment due date before the installment counts as missed
  missed_installments_to_default: integer consecutive missed installments at which a past_due plan defaults
  default_notice_days: integer calendar days between the default notice and the earliest collection action on the plan's encounters
  reage_max_per_plan: integer number of times a past_due plan may be re-aged over its life
  reage_min_installments_paid: integer installments (excluding the down payment) that must have been paid on the plan before it may be re-aged
  reage_method: enum how a re-age treats the missed amount
  reinstatement_window_days: integer calendar days after the default date within which a defaulted plan may be reinstated
  reinstatement_catch_up_pct: percent of the missed installment amount that must be paid to reinstate a defaulted plan
  reinstatements_per_plan: integer number of reinstatements allowed over the plan's life
  add_on_allowed: boolean — whether new eligible balances may be added to an open plan
  add_on_max_per_12_months: integer number of add-on enrollments allowed in any rolling 12 months
  add_on_term_extension_months: integer months added to the remaining term when a balance is added (never beyond max_term_months counted from the first due date)
  add_on_recalc_basis: enum how the installment is recomputed after an add-on
  tier_overflow_rule: enum what happens when an add-on pushes the plan balance above the tier maximum
  eligible_encounter_status: list of encounter account statuses whose balances may be enrolled
  insurance_pending_excluded: boolean — balances on accounts still awaiting insurance adjudication are never enrolled
  disputed_balance_excluded: boolean — an account on a CHARGE_DISPUTE or GFE_DISPUTE_PENDING hold is not enrolled until the dispute is resolved
  bad_debt_enrollment_allowed: boolean — whether a balance placed with the collection agency may be enrolled without first being recalled
  fap_pending_pause_days: integer calendar days installments may be paused while a financial assistance application is pending
  eca_protection_while_current: boolean — encounters in an active plan receive no final notice, placement or credit reporting
  plan_statement_lead_days: integer calendar days before each due date that the plan statement is sent
  overpayment_application: enum how a payment above the installment is applied
  payment_application_order: enum order in which an installment is applied to the enrolled encounters
  terms_changes_per_plan: integer number of patient-requested due-day or installment-amount changes allowed over the plan's life
  min_requested_installment_pct_of_computed: percent — a patient-requested lower installment may not fall below this percent of the computed installment and never below the tier floor
  skip_payments_per_plan: integer installments the patient may skip (moved to the end of the term) over the plan's life
  max_open_plans: integer number of plans a patient may have in pending_signature, active or past_due status at once
  credit_reporting_while_on_plan: boolean — whether plan balances are ever credit-reported
  hardship_income_loss_pct: percent loss of household income in the last 6 months that qualifies for the hardship plan
  hardship_balance_threshold_usd: USD total enrolled balance above which the hardship plan is available without an income-loss showing
  agreement_form: name of the plan agreement the patient signs

