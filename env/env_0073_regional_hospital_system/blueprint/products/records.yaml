# Product charter — Health Information Management (Medical Records) Requests. Riverbend Regional Health, HIM Release of Information.
category: records
display_name: Medical Records Request (Release of Information)

binding:
  holding_table: records_requests
  event_tables: [records_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {fee_balance_usd: fee_balance}

lifecycle:
  states: [received, in_process, fulfilled, denied, under_review, withdrawn, closed]
  transitions:
    - {from: received, to: in_process, by: agent, means: Identity and any required authorization or written direction are validated and processing starts.}
    - {from: received, to: denied, by: agent, means: The request cannot be processed (missing or defective authorization, or a denial ground applies on its face).}
    - {from: in_process, to: fulfilled, by: agent, means: The copy, transmission, amendment or accounting is delivered.}
    - {from: in_process, to: denied, by: agent, means: Access, release or amendment is denied in whole on a listed ground.}
    - {from: denied, to: under_review, by: user, means: The patient asks for review of a reviewable access denial.}
    - {from: under_review, to: fulfilled, by: system, means: The reviewing professional reverses the denial and the copy is delivered.}
    - {from: under_review, to: denied, by: system, means: The reviewing professional upholds the denial.}
    - {from: received, to: withdrawn, by: user, means: The requester withdraws the request.}
    - {from: in_process, to: withdrawn, by: user, means: The requester withdraws the request during processing.}
    - {from: fulfilled, to: closed, by: system, means: Fees are settled and the request is closed.}
    - {from: denied, to: closed, by: system, means: The denial is final and the request is closed.}

accounts:
  - key: fee_balance
    unit: USD
    meaning: Copy, retrieval, certification, media, postage and accounting fees owed on the request; assessments add to it, payments and waivers reduce it.

# ---- category-level parameter dictionary ----
parameter_schema:
  action_deadline_days: integer calendar days after received_date within which Riverbend must act on the request
  extension_days: integer calendar days of the single extension
  max_extensions: integer number of extensions allowed per request
  extension_notice_within_initial_period: boolean — the written extension notice (reason and new date) must be sent before the initial deadline
  fee_model: enum fee basis of the tier
  flat_electronic_fee_usd: USD all-inclusive flat fee for an electronic copy under patient access
  paper_cost_per_page_usd: USD cost-based fee per page (labor and supplies) for a patient's paper copy
  patient_media_fee_usd: USD cost of a CD/DVD when the patient asks for imaging on media
  postage_basis: enum how postage is charged
  third_party_retrieval_fee_usd: USD retrieval fee per authorized third-party release
  third_party_page_ladder: ladder of per-page fees for authorized third-party paper or PDF copies, each band applied to the pages within it
  third_party_certification_fee_usd: USD fee to certify a copy for a third party who asks for certification
  third_party_imaging_fee_usd: USD per imaging study copied to media for a third party
  accounting_free_per_12_months: integer accountings per rolling 12 months provided without charge
  accounting_repeat_fee_usd: USD flat fee for an additional accounting inside the same 12 months
  accounting_lookback_years: integer years before the request date an accounting covers
  accounting_fee_advance_notice: boolean — whether the patient is told of a repeat-accounting fee in advance and may withdraw or narrow the request
  accounting_exclusions: list of disclosure kinds not listed in an accounting
  amendment_denial_grounds: list of grounds on which an amendment may be denied
  disagreement_statement_allowed: boolean — whether a patient whose amendment is denied may file a statement of disagreement that is appended to the record
  amendment_notify_others: boolean — whether persons the patient identifies are notified of an accepted amendment
  unreviewable_denial_grounds: list of access-denial grounds with no review
  reviewable_denial_grounds: list of access-denial grounds the patient may have reviewed by a licensed professional not involved in the denial
  denial_review_days: integer calendar days within which the reviewing licensed professional decides a requested review
  authorization_required: boolean — whether a valid HIPAA authorization signed by the patient is required
  written_direction_required: boolean — whether a signed written direction naming the recipient is required
  authorization_max_age_days: integer calendar days after the patient's signature that an authorization is accepted, unless it states an earlier expiration
  identity_verification_required: boolean — whether the requester's identity is verified before release
  delivery_formats: list of delivery_format values offered
  pickup_hold_days: integer calendar days paper copies are held for pickup before being mailed
  prepayment_required: boolean — whether fees are paid before release
  fee_estimate_threshold_usd: USD expected fee at or above which the requester receives a fee estimate and confirms before processing
  continuity_of_care_waiver: boolean — whether copies sent to another treating provider for continuing care carry no fee
  fee_waiver_reasons: list of waiver_reason values Riverbend grants
  default_scope: enum record scope used when the requester does not limit it
  billing_records_included: boolean — whether billing records are part of the designated record set released
  electronic_formats: list of electronic file formats offered
  sensitive_records_specific_consent: list of record classes that need a specific consent beyond a general authorization
  personal_representative_documents: list of documents accepted as proof of personal representative status
  subpoena_route: enum routing for subpoenas and court orders
  rush_processing_available: boolean — whether paid rush processing is offered (it is not)
  page_count_basis: enum how pages are counted for fees
  fee_balance_close_days: integer calendar days an unpaid third-party fee stays open before the request closes unfulfilled
  request_channels: list of channels through which a request is accepted
  scope_change_resets_clock: boolean — whether a requester's change of scope after receipt restarts the action deadline
  withdrawal_refund: boolean — whether prepaid fees are refunded when a request is withdrawn before processing
  amendment_supporting_reason_required: boolean — whether an amendment request must state a reason
  portal_release_days: integer calendar days after the encounter's results finalize within which results release to the portal automatically
  statement_of_disagreement_rebuttal: boolean — whether Riverbend may prepare a written rebuttal to a statement of disagreement
  directed_recipient_format: enum format used for patient-directed transmissions

