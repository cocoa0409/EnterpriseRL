# ---- data flow (every write is an event) ----
events:
  - type: records_request_received
    target: records_requests
    mutation: create
    meaning: HIM receives a complete written request for access, release, amendment or an accounting.
    grain: one row per written request
    fields: {records_request_id: new request id, customer_id: the patient, variant_name: request type, requester_type: requester, recipient_name: recipient as written, authorization_signed_date: signature date of authorization or direction, received_date: receipt date, record_scope: scope, scope_start_date: range start, scope_end_date: range end, delivery_format: delivery chosen, due_date: received_date plus the action deadline}
    triggers: []
  - type: records_validated
    target: records_requests
    mutation: {transition: {from: received, to: in_process}}
    meaning: Identity and required authorization or direction are validated.
    grain: one row per transaction
    fields: {status: in_process}
    triggers: []
  - type: records_extension_noticed
    target: records_transactions
    meaning: The written extension notice (reason and new date) is sent before the initial deadline.
    grain: one row per extension on the request
    distinguish_by: [extension_number]
    fields: {extension_number: extension sequence, posting_date: notice date, amount: always 0.00}
    triggers:
      - event: records:records_deadline_extended
        map: {}
  - type: records_deadline_extended
    target: records_requests
    mutation: update
    meaning: The action deadline on the request moves to the extended date.
    grain: one row per transaction
    fields: {due_date: extended deadline}
    triggers: []
  - type: records_fee_assessed
    target: records_transactions
    meaning: A fee component is assessed on the request.
    grain: one row per fee component on the request
    distinguish_by: [fee_component]
    fields: {fee_component: component, quantity: counted units, amount: fee, posting_date: assessment date}
    account: fee_balance
    direction: in
    triggers: []
  - type: records_fee_paid
    target: records_transactions
    meaning: The requester pays fees on the request.
    grain: one row per payment confirmation
    distinguish_by: [payment_reference]
    fields: {payment_reference: confirmation number, amount: amount paid, posting_date: posting date}
    account: fee_balance
    direction: out
    triggers: []
  - type: records_fee_waived
    target: records_transactions
    meaning: An assessed fee component is waived.
    grain: one row per fee component per waiver reason
    distinguish_by: [fee_component, waiver_reason]
    fields: {fee_component: component waived, waiver_reason: reason, amount: amount waived, posting_date: posting date}
    account: fee_balance
    direction: out
    triggers: []
  - type: records_fulfilled
    target: records_requests
    mutation: {transition: [{from: in_process, to: fulfilled}, {from: under_review, to: fulfilled}]}
    meaning: The result is delivered.
    grain: one row per transaction
    fields: {status: fulfilled, fulfilled_date: delivery date, page_count: pages produced}
    triggers: []
  - type: records_denied
    target: records_requests
    mutation: {transition: [{from: received, to: denied}, {from: in_process, to: denied}, {from: under_review, to: denied}]}
    meaning: The request is denied on a listed ground.
    grain: one row per transaction
    fields: {status: denied, denial_ground: ground}
    triggers: []
  - type: records_review_requested
    target: records_requests
    mutation: {transition: {from: denied, to: under_review}}
    meaning: The patient asks for review of a reviewable access denial.
    grain: one row per transaction
    fields: {status: under_review}
    triggers: []
  - type: records_withdrawn
    target: records_requests
    mutation: {transition: [{from: received, to: withdrawn}, {from: in_process, to: withdrawn}]}
    meaning: The requester withdraws the request.
    grain: one row per transaction
    fields: {status: withdrawn, closed_date: withdrawal date}
    triggers: []
  - type: records_closed
    target: records_requests
    mutation: {transition: [{from: fulfilled, to: closed}, {from: denied, to: closed}]}
    meaning: The request closes.
    grain: one row per transaction
    fields: {status: closed, closed_date: closing date}
    triggers: []
  - type: records_scope_updated
    target: records_requests
    mutation: update
    meaning: The requester narrows or changes the scope or delivery format.
    grain: one row per transaction
    fields: {record_scope: new scope, scope_start_date: range start, scope_end_date: range end, delivery_format: delivery chosen}
    triggers: []

# ---- derived measures ----
measures:
  - id: records_msr_accountings_12m
    window: rolling 12 months ending on the received_date of the request being decided
    measure: count of the patient's earlier Accounting of Disclosures Request rows whose received_date falls in the window and whose status is not withdrawn
  - id: records_msr_extensions_used
    window: the life of the request
    measure: count of records_extension_noticed rows on the request

# ---- policies ----
policies:
  - id: records_agg_multi_holding
    subject: [records_request_received]
    rule: >-
      A patient may have any number of release-of-information requests, each written request being its own request; a request that names several recipients is split into one request per recipient. Requests are never merged, and a repeat of an open request for the same scope and recipient is answered under the open request.
    eligibility: []
    params: {max_per_customer: null}
  - id: records_agg_accounting_frequency
    subject: [records_fee_assessed, records_request_received]
    rule: >-
      Accounting of Disclosures Requests are counted across all of the patient's requests: the first accounting in any rolling 12 months is free (accounting_free_per_12_months), and each further accounting in the same 12 months (records_msr_accountings_12m) carries accounting_repeat_fee_usd as one ACCOUNTING_REPEAT_FEE. Where accounting_fee_advance_notice is true the patient is told of the fee before processing and may withdraw or narrow the request without charge.
    eligibility: []
    params: {accounting_free_per_12_months: "=accounting_free_per_12_months", accounting_repeat_fee_usd: "=accounting_repeat_fee_usd", accounting_fee_advance_notice: "=accounting_fee_advance_notice"}
    measures: [records_msr_accountings_12m]
  - id: records_deadline_and_extension
    subject: [records_extension_noticed, records_deadline_extended, records_fulfilled, records_denied]
    rule: >-
      Riverbend acts on a request (delivers, or denies in writing) within action_deadline_days calendar days after received_date. A single extension of extension_days is allowed (max_extensions, records_msr_extensions_used). An extension notice must be sent no later than the initial action deadline counted from the date the request was received. Count calendar days starting the day after received_date; a notice sent on the deadline day itself is timely. The notice states the reason and the new date, and due_date moves to the initial deadline plus extension_days. A change of scope by the requester does not restart the deadline (scope_change_resets_clock).
    eligibility:
      - id: extension_before_deadline
        applies_to: [records_extension_noticed]
        kind: time
        condition: An extension notice must be sent no later than the initial action deadline counted from the date the request was received.
        evidence_fields: [records_requests.received_date, records_requests.records_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_requests.records_request_id]]
          action_bindings: {records_requests.records_request_id: records_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the request was received
          anchor_source: records_requests.received_date
          relation: not_after
          duration_source: variants.action_deadline_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after received_date; a notice sent on the deadline day itself is timely.
          boundary: inclusive
    params:
      per_tier:
        "Patient Access - Electronic Copy": {deadline_days: "=action_deadline_days", max_extensions: "=max_extensions"}
        "Patient Access - Paper Copy": {deadline_days: "=action_deadline_days", max_extensions: "=max_extensions"}
        "Patient-Directed Transmission to a Third Party": {deadline_days: "=action_deadline_days", max_extensions: "=max_extensions"}
        "Authorized Release - Attorney or Legal Representative": {deadline_days: "=action_deadline_days", max_extensions: "=max_extensions"}
        "Authorized Release - Insurer or Disability Carrier": {deadline_days: "=action_deadline_days", max_extensions: "=max_extensions"}
        "Amendment of Health Record Request": {deadline_days: "=action_deadline_days", max_extensions: "=max_extensions"}
        "Accounting of Disclosures Request": {deadline_days: "=action_deadline_days", max_extensions: "=max_extensions"}
      extension_days: "=extension_days"
      extension_notice_within_initial_period: "=extension_notice_within_initial_period"
      scope_change_resets_clock: "=scope_change_resets_clock"
    measures: [records_msr_extensions_used]
  - id: records_patient_access_fees
    subject: [records_fee_assessed, records_fulfilled]
    rule: >-
      A patient's own copy is charged only the tier's fee_model. An electronic copy of records held electronically costs the flat flat_electronic_fee_usd, all-inclusive. A paper copy costs paper_cost_per_page_usd per page produced (page_count_basis) plus actual postage when mailed. Imaging on CD/DVD adds patient_media_fee_usd. A patient-directed transmission to a third party is charged as an electronic copy when sent electronically and as a paper copy otherwise (directed_recipient_format). Amendment requests carry no fee. No retrieval, search or certification fee is ever charged on a patient's own access request, and no rush processing is offered (rush_processing_available). Each fee component is assessed once per request.
    eligibility:
      - id: one_assessment_per_component
        applies_to: [records_fee_assessed]
        kind: dedup
        condition: Each fee component is assessed once per request.
        evidence_fields: [records_transactions.records_request_id, records_transactions.fee_component]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_transactions.records_request_id]]
          action_bindings: {records_transactions.records_request_id: records_request_id}
        dedup_contract:
          table: records_transactions
          mode: separate_record
          object_bindings: {records_request_id: records_request_id}
          duplicate_filters: {event_type: [records_fee_assessed]}
          distinct_fields: [fee_component]
    params:
      per_tier:
        "Patient Access - Electronic Copy": {fee_model: "=fee_model", formats: "=delivery_formats"}
        "Patient Access - Paper Copy": {fee_model: "=fee_model", formats: "=delivery_formats"}
        "Patient-Directed Transmission to a Third Party": {fee_model: "=fee_model", formats: "=delivery_formats"}
        "Authorized Release - Attorney or Legal Representative": {fee_model: "=fee_model", formats: "=delivery_formats"}
        "Authorized Release - Insurer or Disability Carrier": {fee_model: "=fee_model", formats: "=delivery_formats"}
        "Amendment of Health Record Request": {fee_model: "=fee_model", formats: "=delivery_formats"}
        "Accounting of Disclosures Request": {fee_model: "=fee_model", formats: "=delivery_formats"}
      flat_electronic_fee_usd: "=flat_electronic_fee_usd"
      paper_cost_per_page_usd: "=paper_cost_per_page_usd"
      patient_media_fee_usd: "=patient_media_fee_usd"
      postage_basis: "=postage_basis"
      page_count_basis: "=page_count_basis"
      directed_recipient_format: "=directed_recipient_format"
      rush_processing_available: "=rush_processing_available"
    formula:
      paper_fee: round(page_count * paper_cost_per_page_usd, 2)
  - id: records_third_party_release
    subject: [records_validated, records_fee_assessed, records_denied]
    rule: >-
      A release to an attorney, insurer or disability carrier requires a valid HIPAA authorization signed by the patient (authorization_required); a patient-directed transmission requires the patient's signed written direction naming the recipient (written_direction_required). An authorization is accepted only when it was signed no more than the authorization age limit before the request was received. Count calendar days starting the day after authorization_signed_date; an authorization signed exactly authorization_max_age_days before received_date is accepted. Records in sensitive_records_specific_consent classes are released only under a consent that names them. A request without a valid authorization is denied as MISSING_AUTHORIZATION or DEFECTIVE_AUTHORIZATION. Third-party fees follow Riverbend's release schedule: third_party_retrieval_fee_usd once, the third_party_page_ladder applied band by band to the pages produced, third_party_certification_fee_usd when certification is asked for, and third_party_imaging_fee_usd per imaging study on media; where prepayment_required is true the records are released only after payment, and an unpaid request closes after fee_balance_close_days. Subpoenas and court orders are routed to subpoena_route and are not handled as releases.
    eligibility:
      - id: authorization_age
        applies_to: [records_validated]
        kind: time
        condition: An authorization is accepted only when it was signed no more than the authorization age limit before the request was received.
        evidence_fields: [records_requests.authorization_signed_date, records_requests.received_date, records_requests.records_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_requests.records_request_id]]
          action_bindings: {records_requests.records_request_id: records_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: it was signed
          anchor_source: records_requests.authorization_signed_date
          relation: not_after
          duration_source: variants.authorization_max_age_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after authorization_signed_date; an authorization signed exactly authorization_max_age_days before received_date is accepted.
          boundary: inclusive
    params:
      per_tier:
        "Patient Access - Electronic Copy": {authorization_required: "=authorization_required", written_direction_required: "=written_direction_required", max_age_days: "=authorization_max_age_days", prepayment: "=prepayment_required", close_days: "=fee_balance_close_days"}
        "Patient Access - Paper Copy": {authorization_required: "=authorization_required", written_direction_required: "=written_direction_required", max_age_days: "=authorization_max_age_days", prepayment: "=prepayment_required", close_days: "=fee_balance_close_days"}
        "Patient-Directed Transmission to a Third Party": {authorization_required: "=authorization_required", written_direction_required: "=written_direction_required", max_age_days: "=authorization_max_age_days", prepayment: "=prepayment_required", close_days: "=fee_balance_close_days"}
        "Authorized Release - Attorney or Legal Representative": {authorization_required: "=authorization_required", written_direction_required: "=written_direction_required", max_age_days: "=authorization_max_age_days", prepayment: "=prepayment_required", close_days: "=fee_balance_close_days"}
        "Authorized Release - Insurer or Disability Carrier": {authorization_required: "=authorization_required", written_direction_required: "=written_direction_required", max_age_days: "=authorization_max_age_days", prepayment: "=prepayment_required", close_days: "=fee_balance_close_days"}
        "Amendment of Health Record Request": {authorization_required: "=authorization_required", written_direction_required: "=written_direction_required", max_age_days: "=authorization_max_age_days", prepayment: "=prepayment_required", close_days: "=fee_balance_close_days"}
        "Accounting of Disclosures Request": {authorization_required: "=authorization_required", written_direction_required: "=written_direction_required", max_age_days: "=authorization_max_age_days", prepayment: "=prepayment_required", close_days: "=fee_balance_close_days"}
      third_party_retrieval_fee_usd: "=third_party_retrieval_fee_usd"
      third_party_page_ladder: "=third_party_page_ladder"
      third_party_certification_fee_usd: "=third_party_certification_fee_usd"
      third_party_imaging_fee_usd: "=third_party_imaging_fee_usd"
      sensitive_records_specific_consent: "=sensitive_records_specific_consent"
      subpoena_route: "=subpoena_route"
  - id: records_access_denial_and_review
    subject: [records_denied, records_review_requested, records_fulfilled]
    rule: >-
      Access is denied only on a listed ground, in writing, and only for the part of the record the ground covers; the rest is released. On unreviewable_denial_grounds the denial is final. On reviewable_denial_grounds the patient may ask for review; only the patient (or personal representative) can request it, and a licensed health care professional who took no part in the denial decides within denial_review_days calendar days, the decision binding Riverbend. A personal representative proves status with one of personal_representative_documents before any access. Identity is verified before every release (identity_verification_required).
    eligibility: []
    params:
      unreviewable_denial_grounds: "=unreviewable_denial_grounds"
      reviewable_denial_grounds: "=reviewable_denial_grounds"
      denial_review_days: "=denial_review_days"
      personal_representative_documents: "=personal_representative_documents"
      identity_verification_required: "=identity_verification_required"
  - id: records_amendment
    subject: [records_fulfilled, records_denied]
    rule: >-
      An amendment request is decided within the tier's action_deadline_days, extendable once. It must state a reason where amendment_supporting_reason_required is true. It may be denied only on amendment_denial_grounds; on denial the patient may file a statement of disagreement that is appended to the record (disagreement_statement_allowed) and Riverbend may append a rebuttal (statement_of_disagreement_rebuttal). An accepted amendment is made to the record and, where amendment_notify_others is true, sent to the persons the patient identifies.
    eligibility: []
    params:
      per_tier:
        "Patient Access - Electronic Copy": {reason_required: "=amendment_supporting_reason_required", deadline_days: "=action_deadline_days"}
        "Patient Access - Paper Copy": {reason_required: "=amendment_supporting_reason_required", deadline_days: "=action_deadline_days"}
        "Patient-Directed Transmission to a Third Party": {reason_required: "=amendment_supporting_reason_required", deadline_days: "=action_deadline_days"}
        "Authorized Release - Attorney or Legal Representative": {reason_required: "=amendment_supporting_reason_required", deadline_days: "=action_deadline_days"}
        "Authorized Release - Insurer or Disability Carrier": {reason_required: "=amendment_supporting_reason_required", deadline_days: "=action_deadline_days"}
        "Amendment of Health Record Request": {reason_required: "=amendment_supporting_reason_required", deadline_days: "=action_deadline_days"}
        "Accounting of Disclosures Request": {reason_required: "=amendment_supporting_reason_required", deadline_days: "=action_deadline_days"}
      amendment_denial_grounds: "=amendment_denial_grounds"
      disagreement_statement_allowed: "=disagreement_statement_allowed"
      statement_of_disagreement_rebuttal: "=statement_of_disagreement_rebuttal"
      amendment_notify_others: "=amendment_notify_others"
  - id: records_accounting_content
    subject: [records_fulfilled]
    rule: >-
      An accounting lists the disclosures of the patient's information made in the accounting_lookback_years years before the request date, other than the accounting_exclusions, each with date, recipient, description and purpose.
    eligibility: []
    params: {accounting_lookback_years: "=accounting_lookback_years", accounting_exclusions: "=accounting_exclusions"}
  - id: records_fee_waiver_and_payment
    subject: [records_fee_waived, records_fee_paid, records_closed]
    rule: >-
      A fee component is waived when a waiver reason applies — copies sent to another treating provider for continuing care (continuity_of_care_waiver), records for a Social Security disability claim, or a patient holding an approved Riverbend financial assistance award — waiving the whole component once per reason (fee_waiver_reasons). When the expected fees reach fee_estimate_threshold_usd, the requester receives a fee estimate and confirms before processing. Fees are paid by the requester; a request closes once its fee balance is zero, or, for unpaid third-party fees, after fee_balance_close_days.
    eligibility:
      - id: one_waiver_per_reason
        applies_to: [records_fee_waived]
        kind: dedup
        condition: A fee component is waived when a waiver reason applies — copies sent to another treating provider for continuing care (continuity_of_care_waiver), records for a Social Security disability claim, or a patient holding an approved Riverbend financial assistance award — waiving the whole component once per reason (fee_waiver_reasons).
        evidence_fields: [records_transactions.records_request_id, records_transactions.fee_component, records_transactions.waiver_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_transactions.records_request_id]]
          action_bindings: {records_transactions.records_request_id: records_request_id}
        dedup_contract:
          table: records_transactions
          mode: separate_record
          object_bindings: {records_request_id: records_request_id}
          duplicate_filters: {event_type: [records_fee_waived]}
          distinct_fields: [fee_component, waiver_reason]
    params:
      per_tier:
        "Patient Access - Electronic Copy": {close_days: "=fee_balance_close_days"}
        "Patient Access - Paper Copy": {close_days: "=fee_balance_close_days"}
        "Patient-Directed Transmission to a Third Party": {close_days: "=fee_balance_close_days"}
        "Authorized Release - Attorney or Legal Representative": {close_days: "=fee_balance_close_days"}
        "Authorized Release - Insurer or Disability Carrier": {close_days: "=fee_balance_close_days"}
        "Amendment of Health Record Request": {close_days: "=fee_balance_close_days"}
        "Accounting of Disclosures Request": {close_days: "=fee_balance_close_days"}
      continuity_of_care_waiver: "=continuity_of_care_waiver"
      fee_waiver_reasons: "=fee_waiver_reasons"
      fee_estimate_threshold_usd: "=fee_estimate_threshold_usd"
  - id: records_intake_scope_and_withdrawal
    subject: [records_request_received, records_scope_updated, records_withdrawn, records_validated]
    rule: >-
      A request is accepted through any of request_channels once it is in writing; when the requester does not limit it, the scope is default_scope, and billing records are included (billing_records_included). Electronic copies are produced in one of electronic_formats; portal results are released without delay (portal_release_days); paper copies for pickup are held pickup_hold_days before being mailed. Only the requester can withdraw a request; prepaid fees are refunded when it is withdrawn before processing (withdrawal_refund). The requester may narrow the scope or change the delivery format at any time before fulfillment.
    eligibility: []
    params: {request_channels: "=request_channels", default_scope: "=default_scope", billing_records_included: "=billing_records_included", electronic_formats: "=electronic_formats", portal_release_days: "=portal_release_days", pickup_hold_days: "=pickup_hold_days", withdrawal_refund: "=withdrawal_refund"}
