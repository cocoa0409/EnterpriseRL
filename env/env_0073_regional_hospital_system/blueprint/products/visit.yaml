# ---- data flow (every write is an event) ----
events:
  - type: visit_booked
    target: appointments
    mutation: create
    meaning: An appointment is booked for the patient.
    grain: one row per appointment booked
    fields: {appointment_id: new appointment id, customer_id: the patient, variant_name: visit type, booking_channel: channel, booked_date: booking date, appointment_date: scheduled date, appointment_time: scheduled start, provider_name: provider or modality, referral_number: referral or order reference, prior_auth_status: authorization status, preregistration_complete: "false", reschedule_count: "0", cancelled_by: NONE}
    triggers: []
  - type: visit_confirmed
    target: appointments
    mutation: {transition: {from: booked, to: confirmed}}
    meaning: The patient confirms the appointment.
    grain: one row per transaction
    fields: {status: confirmed}
    triggers: []
  - type: visit_rescheduled
    target: appointments
    mutation: update
    meaning: The appointment moves to a new date or time.
    grain: one row per transaction
    fields: {appointment_date: new date, appointment_time: new start, provider_name: provider of the new slot, reschedule_count: reschedules used}
    triggers: []
  - type: visit_cancelled
    target: appointments
    mutation: {transition: [{from: booked, to: cancelled}, {from: confirmed, to: cancelled}]}
    meaning: The appointment is cancelled by the patient or by Riverbend.
    grain: one row per transaction
    fields: {status: cancelled, cancelled_date: cancellation date, cancel_notice_hours: hours of notice, cancelled_by: who cancelled}
    triggers: []
  - type: visit_checked_in
    target: appointments
    mutation: {transition: [{from: booked, to: checked_in}, {from: confirmed, to: checked_in}]}
    meaning: The patient is checked in and the visit is registered.
    grain: one row per transaction
    fields: {status: checked_in, encounter_id: hospital account registered}
    triggers:
      - event: encounter:encounter_registered
        map: {encounter_id: encounter_id}
  - type: visit_completed
    target: appointments
    mutation: {transition: {from: checked_in, to: completed}}
    meaning: The visit is completed.
    grain: one row per transaction
    fields: {status: completed}
    triggers: []
  - type: visit_no_show
    target: appointments
    mutation: {transition: [{from: booked, to: no_show}, {from: confirmed, to: no_show}]}
    meaning: The patient does not arrive.
    grain: one row per transaction
    fields: {status: no_show}
    triggers: []
  - type: visit_prerequisites_updated
    target: appointments
    mutation: update
    meaning: Pre-registration, referral or authorization status on the appointment is updated.
    grain: one row per transaction
    fields: {preregistration_complete: pre-registration state, referral_number: referral or order reference, prior_auth_status: authorization status}
    triggers: []
  - type: visit_reminder_sent
    target: appointment_transactions
    meaning: A reminder, preparation instruction or confirmation call goes out.
    grain: one row per outreach type per days-before on the appointment
    distinguish_by: [reminder_type, days_before]
    fields: {reminder_type: outreach kind, days_before: days before the appointment, reminder_channel: channel, posting_date: date sent, amount: always 0.00}
    triggers: []
  - type: visit_fee_assessed
    target: appointment_transactions
    meaning: A no-show or late-cancellation fee is assessed.
    grain: one row per fee type on the appointment
    distinguish_by: [fee_type]
    fields: {fee_type: fee kind, amount: fee, posting_date: assessment date}
    account: missed_visit_fees
    direction: in
    triggers: []
  - type: visit_fee_waived
    target: appointment_transactions
    meaning: An assessed fee is waived.
    grain: one row per fee type per waiver reason
    distinguish_by: [fee_type, waiver_reason]
    fields: {fee_type: fee kind, waiver_reason: reason, amount: amount waived, posting_date: posting date}
    account: missed_visit_fees
    direction: out
    triggers: []
  - type: visit_fee_paid
    target: appointment_transactions
    meaning: The patient pays a missed-appointment fee.
    grain: one row per payment confirmation
    distinguish_by: [payment_reference]
    fields: {payment_reference: confirmation number, amount: amount paid, posting_date: posting date}
    account: missed_visit_fees
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: visit_msr_no_shows_window
    window: rolling count_window_months months ending on the appointment date being decided
    measure: count of the patient's appointments in status no_show (across all departments) with appointment_date in the window
  - id: visit_msr_missed_events_window
    window: rolling count_window_months months ending on the appointment date being decided
    measure: count of the patient's no_show appointments plus patient cancellations with cancel_notice_hours below the tier's late_cancel_window_hours, in the window
  - id: visit_msr_fees_window
    window: rolling count_window_months months ending on the assessment date
    measure: sum of visit_fee_assessed amounts of the patient less waived amounts, in the window

# ---- policies ----
policies:
  - id: visit_agg_multi_holding
    subject: [visit_booked]
    rule: >-
      A patient may hold many appointments, but at most max_future_appointments_per_department future appointments (booked or confirmed) in one department; a recurring infusion series books each chair session as its own appointment.
    eligibility: []
    params:
      max_per_customer: null
      per_tier:
        "Primary Care Office Visit": {max_future: "=max_future_appointments_per_department"}
        "Telehealth Video Visit": {max_future: "=max_future_appointments_per_department"}
        "Specialty New-Patient Consultation": {max_future: "=max_future_appointments_per_department"}
        "Diagnostic Imaging Appointment (MRI/CT)": {max_future: "=max_future_appointments_per_department"}
        "Infusion Therapy Chair Appointment": {max_future: "=max_future_appointments_per_department"}
        "Pre-Admission Testing Appointment": {max_future: "=max_future_appointments_per_department"}
        "Outpatient Procedure Appointment": {max_future: "=max_future_appointments_per_department"}
  - id: visit_agg_attendance_history
    subject: [visit_booked, visit_fee_assessed]
    rule: >-
      Attendance is judged across all of the patient's appointments in all departments over the rolling count_window_months. When the patient reaches the tier's no_show_restriction_count no-shows (visit_msr_no_shows_window), new bookings in that tier follow no_show_restriction_type; at dismissal_review_count no-shows the clinic reviews dismissal. A missed-appointment fee is not assessed when it would take the patient's net fees in the window (visit_msr_fees_window) above fee_cap_per_12_months_usd.
    eligibility: []
    params:
      count_window_months: "=count_window_months"
      per_tier:
        "Primary Care Office Visit": {restriction_count: "=no_show_restriction_count", restriction_type: "=no_show_restriction_type", dismissal_count: "=dismissal_review_count", fee_cap: "=fee_cap_per_12_months_usd"}
        "Telehealth Video Visit": {restriction_count: "=no_show_restriction_count", restriction_type: "=no_show_restriction_type", dismissal_count: "=dismissal_review_count", fee_cap: "=fee_cap_per_12_months_usd"}
        "Specialty New-Patient Consultation": {restriction_count: "=no_show_restriction_count", restriction_type: "=no_show_restriction_type", dismissal_count: "=dismissal_review_count", fee_cap: "=fee_cap_per_12_months_usd"}
        "Diagnostic Imaging Appointment (MRI/CT)": {restriction_count: "=no_show_restriction_count", restriction_type: "=no_show_restriction_type", dismissal_count: "=dismissal_review_count", fee_cap: "=fee_cap_per_12_months_usd"}
        "Infusion Therapy Chair Appointment": {restriction_count: "=no_show_restriction_count", restriction_type: "=no_show_restriction_type", dismissal_count: "=dismissal_review_count", fee_cap: "=fee_cap_per_12_months_usd"}
        "Pre-Admission Testing Appointment": {restriction_count: "=no_show_restriction_count", restriction_type: "=no_show_restriction_type", dismissal_count: "=dismissal_review_count", fee_cap: "=fee_cap_per_12_months_usd"}
        "Outpatient Procedure Appointment": {restriction_count: "=no_show_restriction_count", restriction_type: "=no_show_restriction_type", dismissal_count: "=dismissal_review_count", fee_cap: "=fee_cap_per_12_months_usd"}
    measures: [visit_msr_no_shows_window, visit_msr_fees_window]
  - id: visit_booking_rules
    subject: [visit_booked, visit_prerequisites_updated]
    rule: >-
      A slot may be booked no further ahead than booking_horizon_days and no later than min_lead_hours before its start, through the tier's booking_channels (the portal only where self_scheduling_allowed is true). Where referral_required is true a referral or order must be on file before booking. Where the patient's payer requires authorization for the service, it must be APPROVED no later than prior_auth_lead_business_days business days before the appointment, or the appointment is rescheduled. Where preregistration_required is true, pre-registration is completed no later than preregistration_deadline_hours before the start. A video visit requires the patient to be in Wisconsin during the visit (patient_location_in_state_required). An in-person interpreter is booked no later than interpreter_booking_lead_hours before the start.
    eligibility: []
    params:
      per_tier:
        "Primary Care Office Visit": {horizon: "=booking_horizon_days", lead_hours: "=min_lead_hours", channels: "=booking_channels", self_scheduling: "=self_scheduling_allowed", referral: "=referral_required", auth_lead_bd: "=prior_auth_lead_business_days", prereg: "=preregistration_required", prereg_hours: "=preregistration_deadline_hours", in_state: "=patient_location_in_state_required", interpreter_hours: "=interpreter_booking_lead_hours"}
        "Telehealth Video Visit": {horizon: "=booking_horizon_days", lead_hours: "=min_lead_hours", channels: "=booking_channels", self_scheduling: "=self_scheduling_allowed", referral: "=referral_required", auth_lead_bd: "=prior_auth_lead_business_days", prereg: "=preregistration_required", prereg_hours: "=preregistration_deadline_hours", in_state: "=patient_location_in_state_required", interpreter_hours: "=interpreter_booking_lead_hours"}
        "Specialty New-Patient Consultation": {horizon: "=booking_horizon_days", lead_hours: "=min_lead_hours", channels: "=booking_channels", self_scheduling: "=self_scheduling_allowed", referral: "=referral_required", auth_lead_bd: "=prior_auth_lead_business_days", prereg: "=preregistration_required", prereg_hours: "=preregistration_deadline_hours", in_state: "=patient_location_in_state_required", interpreter_hours: "=interpreter_booking_lead_hours"}
        "Diagnostic Imaging Appointment (MRI/CT)": {horizon: "=booking_horizon_days", lead_hours: "=min_lead_hours", channels: "=booking_channels", self_scheduling: "=self_scheduling_allowed", referral: "=referral_required", auth_lead_bd: "=prior_auth_lead_business_days", prereg: "=preregistration_required", prereg_hours: "=preregistration_deadline_hours", in_state: "=patient_location_in_state_required", interpreter_hours: "=interpreter_booking_lead_hours"}
        "Infusion Therapy Chair Appointment": {horizon: "=booking_horizon_days", lead_hours: "=min_lead_hours", channels: "=booking_channels", self_scheduling: "=self_scheduling_allowed", referral: "=referral_required", auth_lead_bd: "=prior_auth_lead_business_days", prereg: "=preregistration_required", prereg_hours: "=preregistration_deadline_hours", in_state: "=patient_location_in_state_required", interpreter_hours: "=interpreter_booking_lead_hours"}
        "Pre-Admission Testing Appointment": {horizon: "=booking_horizon_days", lead_hours: "=min_lead_hours", channels: "=booking_channels", self_scheduling: "=self_scheduling_allowed", referral: "=referral_required", auth_lead_bd: "=prior_auth_lead_business_days", prereg: "=preregistration_required", prereg_hours: "=preregistration_deadline_hours", in_state: "=patient_location_in_state_required", interpreter_hours: "=interpreter_booking_lead_hours"}
        "Outpatient Procedure Appointment": {horizon: "=booking_horizon_days", lead_hours: "=min_lead_hours", channels: "=booking_channels", self_scheduling: "=self_scheduling_allowed", referral: "=referral_required", auth_lead_bd: "=prior_auth_lead_business_days", prereg: "=preregistration_required", prereg_hours: "=preregistration_deadline_hours", in_state: "=patient_location_in_state_required", interpreter_hours: "=interpreter_booking_lead_hours"}
  - id: visit_reminders_and_preparation
    subject: [visit_reminder_sent, visit_confirmed]
    rule: >-
      Reminders go out reminder_days_before the appointment through reminder_channels; preparation instructions (fasting_hours, escort_required) go out prep_instructions_days_before; where confirmation_required is true and the patient has not confirmed, staff call confirmation_call_hours before the start. Each outreach type is sent once per days-before value. The patient is asked to arrive arrival_minutes_before the start (tech_check_minutes early for video visits). Only the patient confirms an appointment.
    eligibility: []
    params:
      per_tier:
        "Primary Care Office Visit": {reminder_days: "=reminder_days_before", confirmation: "=confirmation_required", call_hours: "=confirmation_call_hours", prep_days: "=prep_instructions_days_before", fasting: "=fasting_hours", escort: "=escort_required", arrival: "=arrival_minutes_before", tech_check: "=tech_check_minutes"}
        "Telehealth Video Visit": {reminder_days: "=reminder_days_before", confirmation: "=confirmation_required", call_hours: "=confirmation_call_hours", prep_days: "=prep_instructions_days_before", fasting: "=fasting_hours", escort: "=escort_required", arrival: "=arrival_minutes_before", tech_check: "=tech_check_minutes"}
        "Specialty New-Patient Consultation": {reminder_days: "=reminder_days_before", confirmation: "=confirmation_required", call_hours: "=confirmation_call_hours", prep_days: "=prep_instructions_days_before", fasting: "=fasting_hours", escort: "=escort_required", arrival: "=arrival_minutes_before", tech_check: "=tech_check_minutes"}
        "Diagnostic Imaging Appointment (MRI/CT)": {reminder_days: "=reminder_days_before", confirmation: "=confirmation_required", call_hours: "=confirmation_call_hours", prep_days: "=prep_instructions_days_before", fasting: "=fasting_hours", escort: "=escort_required", arrival: "=arrival_minutes_before", tech_check: "=tech_check_minutes"}
        "Infusion Therapy Chair Appointment": {reminder_days: "=reminder_days_before", confirmation: "=confirmation_required", call_hours: "=confirmation_call_hours", prep_days: "=prep_instructions_days_before", fasting: "=fasting_hours", escort: "=escort_required", arrival: "=arrival_minutes_before", tech_check: "=tech_check_minutes"}
        "Pre-Admission Testing Appointment": {reminder_days: "=reminder_days_before", confirmation: "=confirmation_required", call_hours: "=confirmation_call_hours", prep_days: "=prep_instructions_days_before", fasting: "=fasting_hours", escort: "=escort_required", arrival: "=arrival_minutes_before", tech_check: "=tech_check_minutes"}
        "Outpatient Procedure Appointment": {reminder_days: "=reminder_days_before", confirmation: "=confirmation_required", call_hours: "=confirmation_call_hours", prep_days: "=prep_instructions_days_before", fasting: "=fasting_hours", escort: "=escort_required", arrival: "=arrival_minutes_before", tech_check: "=tech_check_minutes"}
      reminder_channels: "=reminder_channels"
  - id: visit_reschedule_and_cancellation
    subject: [visit_rescheduled, visit_cancelled]
    rule: >-
      A patient may reschedule an appointment up to reschedule_limit times; beyond that it is cancelled and rebooked. A patient cancellation counts as late when cancel_notice_hours, measured as whole hours before the scheduled start (cancel_notice_basis), is below late_cancel_window_hours; a reschedule inside that window counts as a late cancellation where reschedule_resets_fee is true. A patient cancels through the tier's cancellation_channels. When Riverbend cancels, the patient is offered the first available slot and is never charged (riverbend_cancel_priority). A freed slot inside waitlist_offer_hours is offered to the waitlist.
    eligibility: []
    params:
      per_tier:
        "Primary Care Office Visit": {reschedule_limit: "=reschedule_limit", late_window: "=late_cancel_window_hours", channels: "=cancellation_channels", portal_cancel: "=portal_cancel_allowed", waitlist_hours: "=waitlist_offer_hours"}
        "Telehealth Video Visit": {reschedule_limit: "=reschedule_limit", late_window: "=late_cancel_window_hours", channels: "=cancellation_channels", portal_cancel: "=portal_cancel_allowed", waitlist_hours: "=waitlist_offer_hours"}
        "Specialty New-Patient Consultation": {reschedule_limit: "=reschedule_limit", late_window: "=late_cancel_window_hours", channels: "=cancellation_channels", portal_cancel: "=portal_cancel_allowed", waitlist_hours: "=waitlist_offer_hours"}
        "Diagnostic Imaging Appointment (MRI/CT)": {reschedule_limit: "=reschedule_limit", late_window: "=late_cancel_window_hours", channels: "=cancellation_channels", portal_cancel: "=portal_cancel_allowed", waitlist_hours: "=waitlist_offer_hours"}
        "Infusion Therapy Chair Appointment": {reschedule_limit: "=reschedule_limit", late_window: "=late_cancel_window_hours", channels: "=cancellation_channels", portal_cancel: "=portal_cancel_allowed", waitlist_hours: "=waitlist_offer_hours"}
        "Pre-Admission Testing Appointment": {reschedule_limit: "=reschedule_limit", late_window: "=late_cancel_window_hours", channels: "=cancellation_channels", portal_cancel: "=portal_cancel_allowed", waitlist_hours: "=waitlist_offer_hours"}
        "Outpatient Procedure Appointment": {reschedule_limit: "=reschedule_limit", late_window: "=late_cancel_window_hours", channels: "=cancellation_channels", portal_cancel: "=portal_cancel_allowed", waitlist_hours: "=waitlist_offer_hours"}
      cancel_notice_basis: "=cancel_notice_basis"
      reschedule_resets_fee: "=reschedule_resets_fee"
      riverbend_cancel_priority: "=riverbend_cancel_priority"
  - id: visit_attendance_and_check_in
    subject: [visit_checked_in, visit_completed, visit_no_show]
    rule: >-
      A patient is checked in through the tier's check_in_methods. A patient arriving within late_arrival_grace_minutes after the start is seen; later arrivals are handled under late_arrival_policy. An appointment not checked in by no_show_auto_mark_minutes after the start is marked no-show, unless Riverbend was running more than riverbend_delay_waiver_minutes late and the patient left, which is recorded as a Riverbend cancellation instead. Check-in registers the hospital account for the visit.
    eligibility: []
    params:
      per_tier:
        "Primary Care Office Visit": {check_in: "=check_in_methods", grace: "=late_arrival_grace_minutes", auto_mark: "=no_show_auto_mark_minutes", delay_minutes: "=riverbend_delay_waiver_minutes"}
        "Telehealth Video Visit": {check_in: "=check_in_methods", grace: "=late_arrival_grace_minutes", auto_mark: "=no_show_auto_mark_minutes", delay_minutes: "=riverbend_delay_waiver_minutes"}
        "Specialty New-Patient Consultation": {check_in: "=check_in_methods", grace: "=late_arrival_grace_minutes", auto_mark: "=no_show_auto_mark_minutes", delay_minutes: "=riverbend_delay_waiver_minutes"}
        "Diagnostic Imaging Appointment (MRI/CT)": {check_in: "=check_in_methods", grace: "=late_arrival_grace_minutes", auto_mark: "=no_show_auto_mark_minutes", delay_minutes: "=riverbend_delay_waiver_minutes"}
        "Infusion Therapy Chair Appointment": {check_in: "=check_in_methods", grace: "=late_arrival_grace_minutes", auto_mark: "=no_show_auto_mark_minutes", delay_minutes: "=riverbend_delay_waiver_minutes"}
        "Pre-Admission Testing Appointment": {check_in: "=check_in_methods", grace: "=late_arrival_grace_minutes", auto_mark: "=no_show_auto_mark_minutes", delay_minutes: "=riverbend_delay_waiver_minutes"}
        "Outpatient Procedure Appointment": {check_in: "=check_in_methods", grace: "=late_arrival_grace_minutes", auto_mark: "=no_show_auto_mark_minutes", delay_minutes: "=riverbend_delay_waiver_minutes"}
      late_arrival_policy: "=late_arrival_policy"
  - id: visit_missed_fees
    subject: [visit_fee_assessed, visit_fee_waived]
    rule: >-
      A no-show carries no_show_fee_usd and a late patient cancellation carries late_cancellation_fee_usd, each assessed once per appointment and fee type. The fee is waived, once per reason, when the patient's coverage is BadgerCare Plus (medicaid_fee_prohibited), when it is the patient's first no-show or late cancellation in the count window (first_occurrence_waived, visit_msr_missed_events_window), when Riverbend declared a weather closure (weather_closure_waiver), when the patient was hospitalized at the time (hospitalization_waiver), or when Riverbend's delay caused the miss; Medicare patients are treated as every other non-Medicaid patient (medicare_fee_policy). A fee appears on the patient statement fee_statement_after_days after assessment and may be disputed within fee_dispute_days.
    eligibility:
      - id: one_fee_per_type
        applies_to: [visit_fee_assessed]
        kind: dedup
        condition: A no-show carries no_show_fee_usd and a late patient cancellation carries late_cancellation_fee_usd, each assessed once per appointment and fee type.
        evidence_fields: [appointment_transactions.appointment_id, appointment_transactions.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointment_transactions.appointment_id]]
          action_bindings: {appointment_transactions.appointment_id: appointment_id}
        dedup_contract:
          table: appointment_transactions
          mode: separate_record
          object_bindings: {appointment_id: appointment_id}
          duplicate_filters: {event_type: [visit_fee_assessed]}
          distinct_fields: [fee_type]
    params:
      per_tier:
        "Primary Care Office Visit": {no_show_fee: "=no_show_fee_usd", late_cancel_fee: "=late_cancellation_fee_usd"}
        "Telehealth Video Visit": {no_show_fee: "=no_show_fee_usd", late_cancel_fee: "=late_cancellation_fee_usd"}
        "Specialty New-Patient Consultation": {no_show_fee: "=no_show_fee_usd", late_cancel_fee: "=late_cancellation_fee_usd"}
        "Diagnostic Imaging Appointment (MRI/CT)": {no_show_fee: "=no_show_fee_usd", late_cancel_fee: "=late_cancellation_fee_usd"}
        "Infusion Therapy Chair Appointment": {no_show_fee: "=no_show_fee_usd", late_cancel_fee: "=late_cancellation_fee_usd"}
        "Pre-Admission Testing Appointment": {no_show_fee: "=no_show_fee_usd", late_cancel_fee: "=late_cancellation_fee_usd"}
        "Outpatient Procedure Appointment": {no_show_fee: "=no_show_fee_usd", late_cancel_fee: "=late_cancellation_fee_usd"}
      first_occurrence_waived: "=first_occurrence_waived"
      medicaid_fee_prohibited: "=medicaid_fee_prohibited"
      fee_waiver_reasons: "=fee_waiver_reasons"
      weather_closure_waiver: "=weather_closure_waiver"
      hospitalization_waiver: "=hospitalization_waiver"
      medicare_fee_policy: "=medicare_fee_policy"
      fee_statement_after_days: "=fee_statement_after_days"
      fee_dispute_days: "=fee_dispute_days"
    measures: [visit_msr_missed_events_window]
  - id: visit_fee_payment
    subject: [visit_fee_paid]
    rule: >-
      A missed-appointment fee is paid by the patient like any other patient balance and is never added to a payment plan or to a financial assistance award; a fee under dispute is not collected until the dispute is answered.
    eligibility: []
    params: {fee_dispute_days: "=fee_dispute_days"}
