# Product charter — Appointment Scheduling. Riverbend Regional Health, Patient Access Center.
category: visit
display_name: Appointment Scheduling

binding:
  holding_table: appointments
  event_tables: [appointment_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {missed_fee_balance_usd: missed_visit_fees}

lifecycle:
  states: [booked, confirmed, checked_in, completed, cancelled, no_show]
  transitions:
    - {from: booked, to: confirmed, by: user, means: The patient confirms the appointment from a reminder.}
    - {from: booked, to: cancelled, by: agent, means: The appointment is cancelled at the patient's request or by Riverbend.}
    - {from: confirmed, to: cancelled, by: agent, means: A confirmed appointment is cancelled at the patient's request or by Riverbend.}
    - {from: booked, to: checked_in, by: agent, means: The patient arrives (or joins the video room) and is checked in.}
    - {from: confirmed, to: checked_in, by: agent, means: The patient arrives and is checked in.}
    - {from: checked_in, to: completed, by: system, means: The visit is completed and documented.}
    - {from: booked, to: no_show, by: system, means: The patient does not arrive within the auto-mark minutes.}
    - {from: confirmed, to: no_show, by: system, means: The patient does not arrive within the auto-mark minutes.}

accounts:
  - key: missed_visit_fees
    unit: USD
    meaning: No-show and late-cancellation fees owed on the appointment; assessments add to it, payments and waivers reduce it.

# ---- category-level parameter dictionary ----
parameter_schema:
  booking_horizon_days: integer calendar days ahead within which an appointment may be booked
  min_lead_hours: integer hours between booking and the scheduled start below which the slot cannot be booked
  visit_length_minutes: integer scheduled length of the slot in minutes
  arrival_minutes_before: integer minutes before the scheduled start the patient is asked to arrive (or log in)
  late_arrival_grace_minutes: integer minutes after the scheduled start within which a late patient is still seen
  late_arrival_policy: enum what happens to a patient arriving after the grace minutes
  late_cancel_window_hours: integer hours before the scheduled start inside which a patient cancellation counts as late
  cancel_notice_basis: enum how cancellation notice is measured
  no_show_fee_usd: USD fee for a no-show
  late_cancellation_fee_usd: USD fee for a late cancellation by the patient
  first_occurrence_waived: boolean — whether the first no-show or late cancellation in the rolling count window carries no fee
  medicaid_fee_prohibited: boolean — whether patients with Medicaid (BadgerCare Plus) coverage are never charged missed-appointment fees
  fee_waiver_reasons: list of waiver_reason values that waive a missed-appointment fee
  fee_statement_after_days: integer calendar days after assessment before a fee appears on the patient statement
  count_window_months: integer rolling months over which no-shows and late cancellations are counted
  no_show_restriction_count: integer no-shows in the count window at which booking is restricted
  no_show_restriction_type: enum restriction applied at the count
  dismissal_review_count: integer no-shows in the count window at which the clinic reviews dismissal from the practice
  reschedule_limit: integer patient reschedules allowed per appointment before it must be cancelled and rebooked
  reminder_days_before: list of days before the appointment on which reminders go out
  reminder_channels: list of reminder channels
  confirmation_required: boolean — whether the patient must confirm the appointment from the reminder
  confirmation_call_hours: integer hours before the start when staff call a patient who has not confirmed (0 = no call)
  referral_required: boolean — whether a referral or order must be on file before booking
  prior_auth_lead_business_days: integer business days before the appointment by which a required payer authorization must be approved, or the appointment is rescheduled
  preregistration_required: boolean — whether pre-registration (demographics, coverage, consent) must be completed before the visit
  preregistration_deadline_hours: integer hours before the start by which pre-registration must be complete
  fasting_hours: integer hours of fasting required before the visit (0 = none)
  prep_instructions_days_before: integer days before the visit the preparation instructions are sent (0 = none)
  escort_required: boolean — whether an adult escort must drive the patient home
  patient_location_in_state_required: boolean — whether the patient must be physically in Wisconsin during the visit
  tech_check_minutes: integer minutes before a video visit the device check opens
  self_scheduling_allowed: boolean — whether the patient may book through the portal
  portal_cancel_allowed: boolean — whether the patient may cancel through the portal
  cancellation_channels: list of channels through which the patient may cancel
  waitlist_offer_hours: integer hours before start within which a freed slot is offered to the waitlist
  interpreter_booking_lead_hours: integer hours before start by which an in-person interpreter must be booked
  riverbend_cancel_priority: boolean — whether a patient whose appointment Riverbend cancels gets the first available slot and no fee
  max_future_appointments_per_department: integer future appointments a patient may hold in one department
  check_in_methods: list of check-in methods
  weather_closure_waiver: boolean — whether fees are waived for appointments missed during a declared weather closure
  hospitalization_waiver: boolean — whether fees are waived when the patient was hospitalized at the appointment time
  riverbend_delay_waiver_minutes: integer minutes of Riverbend-caused delay after which a patient leaving is not a no-show
  medicare_fee_policy: enum how Medicare patients are treated for missed-appointment fees
  fee_cap_per_12_months_usd: USD maximum missed-appointment fees assessed to one patient in the count window
  no_show_auto_mark_minutes: integer minutes after the scheduled start at which an unchecked appointment is marked no-show
  booking_channels: list of booking channels
  reschedule_resets_fee: boolean — whether rescheduling inside the late-cancellation window counts as a late cancellation
  fee_dispute_days: integer calendar days after a fee is assessed within which the patient may dispute it

