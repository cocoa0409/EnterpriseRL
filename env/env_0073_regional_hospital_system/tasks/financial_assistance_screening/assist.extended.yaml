    ct_necessary: the coverage-gap account is coded emergency or medically necessary
  factors:
  - id: appeal_holdout
    effect: parameter
    decides: appeal_hold
    bindings:
    - appeal_kind
    - appeal_coi
    - appeal_cs
    - appeal_hold
    ladder:
    - when: >-
        the most recent appeal is a member appeal filed under the patient's authorization and its claim is still in appealed
        status
      value: >-
        the deductible, coinsurance and copay liabilities of the twelve months posted from that claim, taken off
    - when: the most recent appeal is of any other type and its claim is still in appealed status
      value: the coinsurance liabilities of the twelve months posted from that claim, taken off
    - when: otherwise (no appeal, or its claim has left appealed status)
      value: '0'
    baseline:
      appeal_hold: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: claim
  - id: hold_holdout
    effect: method
    decides: hold_out
    bindings:
    - dispute_acct
    - review_acct
    - held_acct
    - disputed_line
    - line_charge
    - held_liab
    - held_coi
    - hold_out
    ladder:
    - when: an account is on a billing hold for a charge dispute
      method: >-
        the charge of the line the latest charge-dispute inquiry on it names, capped at the account's patient liabilities
        of the twelve months (claim-under-appeal postings left aside): the smaller of two different record amounts
    - when: no account is on a charge-dispute hold and an account is on a billing hold for an itemization review
      method: >-
        that account's coinsurance liabilities of the twelve months (claim-under-appeal postings left aside): a windowed sum
    - when: otherwise (no account on either hold)
      method: nothing taken off
    baseline:
      hold_out: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: encounter
  - id: coverage_gap
    effect: parameter
    decides: ct_off
    bindings:
    - ct_acct
    - ct_liab
    - ct_disc
    - has_bcp
    - bcp_notice
    - ct_necessary
    - ct_off
    ladder:
    - when: the patient holds a BadgerCare Plus claim
      value: >-
        the coverage-gap account's coverage-terminated balance (its coverage-terminated liabilities of the twelve months
        less every uninsured discount of the twelve months posted on that account), taken off
    - when: >-
        no BadgerCare Plus claim, a BadgerCare Plus determination notice accepted on the case, and the coverage-gap account
        coded emergency or medically necessary
      value: >-
        the part of that balance above the amounts-generally-billed share (agb_pct percent) of those liabilities, taken off,
        nothing when the balance is at or below that share
    - when: otherwise (including a coverage-gap account coded elective)
      value: '0'
    baseline:
      ct_off: '0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: claim
  - id: gfe_dispute
    effect: parameter
    decides: gfe_off
    bindings:
    - gfe_id
    - gfe_status
    - gfe_acct
    - gfe_billed
    - gfe_expected
    - gfe_bill_date
    - gfe_open
    - gfe_off
    ladder:
    - when: the self-pay good faith estimate is in dispute
      value: its billed charges, taken off
    - when: >-
        its service has been completed, its billed charges exceed its expected charges by at least ppdr_threshold_usd and
        the dispute window (ppdr_initiation_days from the initial bill date) is still open
      value: the excess of its billed over its expected charges, taken off
    - when: otherwise (no such estimate, a smaller excess, the window closed, or no initial bill date)
      value: '0'
    baseline:
      gfe_off: '0'
    evidence:
    - history
    - cross_category
    - date
    - tier_param
    cross_difficulty: estimate
  baseline:
    rule: >-
      The medical debt a hardship supplement claims is every patient liability posted on the patient's Riverbend accounts
      in the twelve whole months before the signing day, less every patient-balance adjustment posted in those same months.
      A posting belongs to those months when fewer than twelve whole months separate its posting date from the signing day;
      a whole month runs from a day of one month to the same day of the next month or, when the next month has no such day,
      to the first day of the month after it, so that a posting dated on the signing day's day of the month twelve months
      earlier is already outside. The supplement's claim is rounded half-up to the cent and is never below zero.
    params:
    - window_months
  inputs:
    history:
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: encounter_liability_posted
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: encounter_adjustment_posted
    - category: claim
      table: claim_transactions
      aggregate: latest
      field: claim_id
      filters:
        event_type: claim_appeal_filed
    - table: assistance_transactions
      aggregate: count
      field: fap_txn_id
      filters:
        event_type: assist_document_logged
        document_type: MEDICAID_DETERMINATION_NOTICE
        document_status: ACCEPTED
    cross_category:
    - encounter
    - claim
    - estimate
- id: assist_ext_qualifying_debt
  base_policy_refs:
  - assist_tier_determination
  overwrite:
  - base_policy: assist_tier_determination
    superseded_clause: >-
      qualifying_medical_debt_usd incurred in the last hardship_debt_window_months exceeds hardship_medical_debt_income_pct
      of annual household income
    replaced_by: >-
      for an application whose qualifying medical debt is recorded under Riverbend's hardship schedules (claimed on a hardship
      supplement or on a renewal's claim of medical debt, or documented under Riverbend's documentation schedules for its
      own charges and for other medical costs) and on which no outside medical bills document has been accepted, and only
      for such an application, the qualifying medical debt recorded on the case, counted as those schedules state as of their
      signing or documentation day, exceeds hardship_medical_debt_income_pct of annual household income; for every other application,
      including one with an outside medical bills document accepted, qualifying_medical_debt_usd, the documented medical bills
      (Riverbend and outside) incurred in the last hardship_debt_window_months before the application date exceeds hardship_medical_debt_income_pct
      of annual household income
  trigger: state_due
  subject:
  - assist_household_updated
  computes: qualifying_medical_debt_usd
  target_tool: record_qualifying_debt_da5f54be
  params:
    window_months: 12
  rule: >-
    Riverbend documents on a Medical Hardship application with no outside medical bills document accepted on it the
    qualifying medical debt of its own charges, starting from the medical debt claimed on the case and valuing Riverbend's
    self-pay charges of the twelve whole months before the documentation day at the financial assistance charge basis:
    amounts generally billed for emergency and medically necessary care, never above the bill as posted, as billed for
    elective care. A case with an outside medical bills document accepted is not documented under this schedule: its
    qualifying medical debt is the documented medical bills, Riverbend and outside, incurred in the last
    hardship_debt_window_months before the application date. This schedule documents a case once an income document (pay
    stubs, a federal tax return, a Social Security award letter, an unemployment benefit statement or a zero-income
    attestation), a proof of residency and a bank statement have each been accepted on it; a case lacking any of the three
    keeps the medical debt claimed on it. Medical hardship above 400 percent FPL applies only when, for an application whose
    qualifying medical debt is recorded under Riverbend's hardship schedules (claimed on a hardship supplement or on a
    renewal's claim of medical debt, or documented under Riverbend's documentation schedules for its own charges and for
    other medical costs) and on which no outside medical bills document has been accepted, and only for such an application,
    the qualifying medical debt recorded on the case, counted as those schedules state as of their signing or documentation
    day, exceeds hardship_medical_debt_income_pct of annual household income; for every other application, including one
    with an outside medical bills document accepted, qualifying_medical_debt_usd, the documented medical bills (Riverbend
    and outside) incurred in the last hardship_debt_window_months before the application date exceeds
    hardship_medical_debt_income_pct of annual household income. The qualifying medical debt is documented only once the
    case records a medical debt the patient claims (a case showing 0.00 records none). The standard qualifying medical debt
    is the medical debt claimed on the case, rounded half-up to the cent and never below zero. The adjustments described
    below each change their own part of that standard figure and none depends on another; the qualifying medical debt is the
    standard figure plus every amount they add and less every amount they take off, rounded half-up to the cent and never
    below zero. The self-pay account is the account carrying the patient's most recent self-pay final-bill liability (on a
    same-day tie, the liability listed first in the account activity). For the self-pay account, its window postings are
    those for which fewer than twelve whole months separate the posting date from the documentation day, a whole month
    running from a day of one month to the same day of the next month or, when the next month has no such day, to the first
    day of the month after it; the self-pay account's bill is its self-pay final-bill liabilities in that window less its
    uninsured discounts (an observation-rate discount included) and package price adjustments in that window, and its
    amounts-generally-billed share is agb_pct percent of its self-pay final-bill liabilities in that window, rounded half-up
    to the cent. The insured account is the account of the claim carrying the patient's most recent payer payment (on a
    same-day tie, the payment listed first in the claim activity), when that claim is not in appealed status, that account
    is not on a billing hold and it is coded emergency or medically necessary; for the insured account, its window postings
    are those for which fewer than twelve whole months separate the posting date from the documentation day, a whole month
    running from a day of one month to the same day of the next month or, when the next month has no such day, to the first
    day of the month after it; its patient share is the patient liabilities posted from that claim in that window, and its
    amounts-generally-billed share is agb_pct percent of its gross charges, rounded half-up to the cent. One account is
    revalued in one of three ways, none ever raising a bill or a share above what is posted: when the self-pay account is
    coded emergency or medically necessary and no self-pay good faith estimate (single scheduled service, procedure with
    co-providers or recurring course of care) whose service has been completed, which is closed or which is in dispute is
    linked to it, its bill is replaced by the smaller of that bill and its amounts-generally-billed share; when no self-pay
    account so qualifies and an insured account exists, its patient share is replaced by the smaller of that share and its
    amounts-generally-billed share, a patient eligible for financial assistance being charged no more than the amounts
    generally billed for emergency or medically necessary care; otherwise nothing is revalued. The estimated account is the
    account linked to the patient's self-pay good faith estimate whose service has been completed or which is closed (a
    recurring course of care before a single scheduled service before a procedure with co-providers; within one variant, an
    estimate whose service has been completed before a closed one; and among estimates of one variant and status, the
    estimate listed first among the patient's estimates); its Riverbend lines are the convening-facility and
    convening-professional lines of that estimate's current version. For the estimated account, its window postings are
    those for which fewer than twelve whole months separate the posting date from the documentation day, a whole month
    running from a day of one month to the same day of the next month or, when the next month has no such day, to the first
    day of the month after it; the estimated account's bill is its self-pay final-bill liabilities in that window less its
    uninsured discounts (an observation-rate discount included) and package price adjustments in that window, and its
    amounts-generally-billed share is agb_pct percent of its self-pay final-bill liabilities in that window, rounded half-up
    to the cent. The estimated account's bill is revalued in one of three ways: when it is coded emergency or medically
    necessary, its bill is replaced by the smallest of that bill, its Riverbend lines and its amounts-generally-billed
    share; when it is coded elective, its bill is replaced by the smaller of its Riverbend lines and that bill; otherwise,
    when no such estimate exists, nothing is revalued. The disputed estimate is the patient's self-pay good faith estimate
    (single scheduled service, procedure with co-providers, or recurring course of care, in that order, and within one
    variant the estimate listed first among the patient's estimates) that is in dispute; its expected charges are the
    convening-facility and convening-professional lines of its current version. For the disputed estimate's linked account,
    its window postings are those for which fewer than twelve whole months separate the posting date from the documentation
    day, a whole month running from a day of one month to the same day of the next month or, when the next month has no such
    day, to the first day of the month after it; that account's amounts-generally-billed share is agb_pct percent of its
    self-pay final-bill liabilities in that window, rounded half-up to the cent. The undisputed part of a bill under dispute
    is added in one of three ways: when the disputed estimate's linked account is coded emergency or medically necessary,
    the smaller of its expected charges and that account's amounts-generally-billed share is added; when that account is
    coded elective, its expected charges are added; otherwise, when no estimate is in dispute, nothing is added. The
    awaiting self-pay account is the account listed first among the patient's accounts in pending billing status with
    financial class SELF_PAY; when an estimate is linked to it, nothing is added under this adjustment. The awaiting
    self-pay account's unbilled charges are the charges posted on it less its self-pay final-bill liabilities. Care already
    given on an awaiting self-pay account that carries no estimate is added in one of three ways: when it is coded emergency
    or medically necessary, agb_pct percent of its unbilled charges, rounded half-up to the cent, is added; when it is coded
    elective, its unbilled charges less its account type's uninsured_discount_elective_pct percent of them, rounded half-up
    to the cent, are added; otherwise nothing is added for awaiting self-pay care. The rendered package is the patient's
    package estimate whose service has been completed (Imaging & Diagnostics before Outpatient Surgery before Maternity &
    Delivery, and within one package variant the estimate listed first), while its linked account carries no package price
    adjustment yet; its package price is the sum of the Riverbend facility line and the Riverbend professional line that
    carry the principal service code on its current version, co-provider lines not being part of it. It is added in one of
    three ways: when a cesarean delivery charge (CPT 59510, 59514 or 59515) is posted on its linked account, the package
    price plus package_upgrade_differential_usd of its tier is added; when no such charge is posted, the package price is
    added; otherwise, when there is no rendered package, nothing is added. The course in progress is the patient's issued
    self-pay good faith estimate for a recurring course of care (the estimate listed first when several are issued) whose
    scheduled first visit is on or before the documentation day. The course account's unbilled charges are the charges
    posted on the course's linked account less that account's self-pay final-bill liabilities. The visits already given on
    its linked account are added in one of three ways: when that account is coded emergency or medically necessary, agb_pct
    percent of its unbilled charges, rounded half-up to the cent, is added; when it is coded elective, its unbilled charges
    less its account type's uninsured_discount_elective_pct percent of them, rounded half-up to the cent, are added;
    otherwise, including when no first visit is scheduled or none has come, nothing is added for a course.
  prerequisite:
  - problem: assist_ext_supplement_debt_claim
    kind: value_input
    gate: claimed
    form: state
    policy_source: >-
      The qualifying medical debt is documented only once the case records a medical debt the patient claims (a case showing
      0.00 records none).
    condition: The case's qualifying_medical_debt_usd shows a medical debt the patient claims (above 0.00).
    resolved_by: sign_hardship_supplement_15cad132
    effect: >-
      Once the case records a claimed debt, the documentation of Riverbend's own charges starts from that claim.
  cross_category:
  - category: encounter
    as: history
    reads:
    - encounter_transactions.amount
    - encounter_transactions.liability_source
    - encounter_transactions.adjustment_code
    - encounter_transactions.encounter_id
    - encounter_transactions.cpt_hcpcs_code
    - service_classification
    - status
    - financial_class
    - gross_charges_total
    - billing_hold_reason
    - encounter_transactions.claim_id
    note: the self-pay bills, unbilled charges and classifications of the patient's hospital accounts.
  - category: claim
    as: history
    reads:
    - claim_transactions.claim_id
    - claim_transactions.posting_date
    - status
    - encounter_id
    note: the claim carrying the most recent payer payment and its status.
  - category: estimate
    as: branch
    reads:
    - variant_name
    - status
    - encounter_id
    - estimate_version
    - primary_service_code
    - scheduled_service_date
    - estimate_transactions.amount
    - estimate_transactions.provider_role
    - estimate_transactions.service_code
    note: completed, closed, disputed and in-progress estimates, their lines and package prices.
  compute:
  - claimed: MX(0, F('qualifying_medical_debt_usd'))
  - ga_id: >-
      CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='closed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='closed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='closed')
  - ga_acct: CFIELD('estimate','encounter_id', estimate_id=ga_id)
  - gu_id: >-
      CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='in_dispute')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='in_dispute')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='in_dispute')
  - gu_acct: CFIELD('estimate','encounter_id', estimate_id=gu_id)
  - sp_acct: >-
      XLATEST('encounter','encounter_transactions','encounter_id', date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL')
  - sp_bill: >-
      (XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=sp_acct) - XSUM('encounter','encounter_transactions','amount',
      within_months=K('window_months'), date_field='posting_date', event_type='encounter_adjustment_posted', adjustment_code='UNINSURED_DISCOUNT',
      encounter_id=sp_acct) - XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_adjustment_posted', adjustment_code='PACKAGE_PRICE_ADJUSTMENT', encounter_id=sp_acct))
  - sp_agb: >-
      RND((XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_liability_posted', liability_source='SELF_PAY_FINAL_BILL', encounter_id=sp_acct)) * P('agb_pct')
      / 100, 2)
  - sp_gfe: >-
      sp_acct != None and (CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='service_completed') != None
      or CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='closed') != None
      or CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='in_dispute') != None
      or CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='service_completed') != None
      or CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='closed') != None
      or CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='in_dispute') != None
      or CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='service_completed') != None
      or CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='closed') != None
      or CFIELD('estimate','estimate_id', encounter_id=sp_acct, variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='in_dispute') != None)
  - ins_claim: >-
      XLATEST('claim','claim_transactions','claim_id', date_field='posting_date', event_type='claim_payment_posted')
  - ins_acct: CFIELD('claim','encounter_id', claim_id=ins_claim) if ins_claim != None else None
  - ins_ok: >-
      ins_acct != None and CFIELD('claim','status', claim_id=ins_claim) != 'appealed' and CFIELD('encounter','billing_hold_reason',
      encounter_id=ins_acct) == 'NONE' and CFIELD('encounter','service_classification', encounter_id=ins_acct) != 'ELECTIVE_NON_COVERED'
  - ins_share: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      claim_id=ins_claim) if ins_ok else 0
  - ins_agb: RND(CFIELD('encounter','gross_charges_total', encounter_id=ins_acct) * P('agb_pct') / 100, 2) if ins_ok else 0
  - sp_delta: >-
      (MN(sp_bill, sp_agb) - sp_bill) if (sp_acct != None and not sp_gfe and CFIELD('encounter','service_classification',
      encounter_id=sp_acct) != 'ELECTIVE_NON_COVERED') else ((MN(ins_share, ins_agb) - ins_share) if ins_ok else 0)
  - ga_lines: >-
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=ga_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=ga_id), provider_role='CONVENING_FACILITY') + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded',
      estimate_id=ga_id, estimate_version=CFIELD('estimate','estimate_version', estimate_id=ga_id), provider_role='CONVENING_PROFESSIONAL')
  - ga_bill: >-
      (XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=ga_acct) - XSUM('encounter','encounter_transactions','amount',
      within_months=K('window_months'), date_field='posting_date', event_type='encounter_adjustment_posted', adjustment_code='UNINSURED_DISCOUNT',
      encounter_id=ga_acct) - XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_adjustment_posted', adjustment_code='PACKAGE_PRICE_ADJUSTMENT', encounter_id=ga_acct))
  - ga_delta: >-
      (MN(ga_bill, ga_lines, RND((XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'),
      date_field='posting_date', event_type='encounter_liability_posted', liability_source='SELF_PAY_FINAL_BILL',
      encounter_id=ga_acct)) * P('agb_pct') / 100, 2)) - ga_bill) if (ga_id != None and (ga_acct != None and
      CFIELD('encounter','service_classification', encounter_id=ga_acct) != 'ELECTIVE_NON_COVERED')) else ((MN(ga_lines,
      ga_bill) - ga_bill) if (ga_id != None and (ga_acct != None and CFIELD('encounter','service_classification',
      encounter_id=ga_acct) == 'ELECTIVE_NON_COVERED')) else 0)
  - gu_expected: >-
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=gu_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=gu_id), provider_role='CONVENING_FACILITY') + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded',
      estimate_id=gu_id, estimate_version=CFIELD('estimate','estimate_version', estimate_id=gu_id), provider_role='CONVENING_PROFESSIONAL')
  - gu_add: >-
      MN(gu_expected, RND((XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_liability_posted', liability_source='SELF_PAY_FINAL_BILL', encounter_id=gu_acct)) * P('agb_pct')
      / 100, 2)) if (gu_id != None and (gu_acct != None and CFIELD('encounter','service_classification', encounter_id=gu_acct)
      != 'ELECTIVE_NON_COVERED')) else (gu_expected if (gu_id != None and (gu_acct != None and CFIELD('encounter','service_classification',
      encounter_id=gu_acct) == 'ELECTIVE_NON_COVERED')) else 0)
  - ub_acct: CFIELD('encounter','encounter_id', status='pending_billing', financial_class='SELF_PAY')
  - ub_free: ub_acct != None and CFIELD('estimate','estimate_id', encounter_id=ub_acct) == None
  - ub_add: >-
      RND(((XSUM('encounter','encounter_transactions','amount', event_type='encounter_charge_posted', encounter_id=ub_acct)
      - XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted', liability_source='SELF_PAY_FINAL_BILL',
      encounter_id=ub_acct))) * P('agb_pct') / 100, 2) if (ub_free and (ub_acct != None and CFIELD('encounter','service_classification',
      encounter_id=ub_acct) != 'ELECTIVE_NON_COVERED')) else ((((XSUM('encounter','encounter_transactions','amount', event_type='encounter_charge_posted',
      encounter_id=ub_acct) - XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=ub_acct))) - RND(((XSUM('encounter','encounter_transactions','amount',
      event_type='encounter_charge_posted', encounter_id=ub_acct) - XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=ub_acct))) * CPARAM('encounter','uninsured_discount_elective_pct',
      encounter_id=ub_acct) / 100, 2)) if (ub_free and (ub_acct != None and CFIELD('encounter','service_classification', encounter_id=ub_acct)
      == 'ELECTIVE_NON_COVERED')) else 0)
  - pk_id: >-
      CFIELD('estimate','estimate_id', variant_name='Riverbend Self-Pay Package Price - Imaging & Diagnostics', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Riverbend Self-Pay Package Price - Outpatient Surgery', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Riverbend Self-Pay Package Price - Maternity & Delivery', status='service_completed')
  - pk_acct: CFIELD('estimate','encounter_id', estimate_id=pk_id)
  - pk_open: >-
      pk_id != None and XCOUNT('encounter','encounter_transactions', event_type='encounter_adjustment_posted', adjustment_code='PACKAGE_PRICE_ADJUSTMENT',
      encounter_id=pk_acct) == 0
  - pk_cesarean: >-
      XCOUNT('encounter','encounter_transactions', event_type='encounter_charge_posted', cpt_hcpcs_code='59510', encounter_id=pk_acct)
      + XCOUNT('encounter','encounter_transactions', event_type='encounter_charge_posted', cpt_hcpcs_code='59514', encounter_id=pk_acct)
      + XCOUNT('encounter','encounter_transactions', event_type='encounter_charge_posted', cpt_hcpcs_code='59515', encounter_id=pk_acct)
      > 0
  - pk_price: >-
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=pk_id,
      estimate_version=CFIELD('estimate','estimate_version', estimate_id=pk_id), provider_role='CONVENING_FACILITY',
      service_code=CFIELD('estimate','primary_service_code', estimate_id=pk_id)) +
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=pk_id,
      estimate_version=CFIELD('estimate','estimate_version', estimate_id=pk_id), provider_role='CONVENING_PROFESSIONAL',
      service_code=CFIELD('estimate','primary_service_code', estimate_id=pk_id))
  - pk_add: >-
      (pk_price + CPARAM('estimate','package_upgrade_differential_usd', estimate_id=pk_id)) if (pk_open and pk_cesarean)
      else (pk_price if pk_open else 0)
  - cs_id: >-
      CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='issued')
  - cs_first: CFIELD('estimate','scheduled_service_date', estimate_id=cs_id)
  - cs_started: cs_id != None and cs_first != None and cs_first != '' and DAYS(cs_first, NOW) >= 0
  - cs_acct: CFIELD('estimate','encounter_id', estimate_id=cs_id)
  - cs_add: >-
      RND(((XSUM('encounter','encounter_transactions','amount', event_type='encounter_charge_posted', encounter_id=cs_acct)
      - XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted', liability_source='SELF_PAY_FINAL_BILL',
      encounter_id=cs_acct))) * P('agb_pct') / 100, 2) if (cs_started and (cs_acct != None and CFIELD('encounter','service_classification',
      encounter_id=cs_acct) != 'ELECTIVE_NON_COVERED')) else ((((XSUM('encounter','encounter_transactions','amount', event_type='encounter_charge_posted',
      encounter_id=cs_acct) - XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=cs_acct))) - RND(((XSUM('encounter','encounter_transactions','amount',
      event_type='encounter_charge_posted', encounter_id=cs_acct) - XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=cs_acct))) * CPARAM('encounter','uninsured_discount_elective_pct',
      encounter_id=cs_acct) / 100, 2)) if (cs_started and (cs_acct != None and CFIELD('encounter','service_classification',
      encounter_id=cs_acct) == 'ELECTIVE_NON_COVERED')) else 0)
  - income_doc: >-
      COUNT('assistance_transactions', event_type='assist_document_logged', document_type='PAY_STUBS_LAST_90_DAYS', document_status='ACCEPTED')
      + COUNT('assistance_transactions', event_type='assist_document_logged', document_type='FEDERAL_TAX_RETURN', document_status='ACCEPTED')
      + COUNT('assistance_transactions', event_type='assist_document_logged', document_type='SOCIAL_SECURITY_AWARD_LETTER',
      document_status='ACCEPTED') + COUNT('assistance_transactions', event_type='assist_document_logged', document_type='UNEMPLOYMENT_BENEFIT_STATEMENT',
      document_status='ACCEPTED') + COUNT('assistance_transactions', event_type='assist_document_logged', document_type='ZERO_INCOME_ATTESTATION',
      document_status='ACCEPTED') > 0
  - complete: >-
      income_doc and COUNT('assistance_transactions', event_type='assist_document_logged', document_type='PROOF_OF_RESIDENCY',
      document_status='ACCEPTED') > 0 and COUNT('assistance_transactions', event_type='assist_document_logged', document_type='BANK_STATEMENT',
      document_status='ACCEPTED') > 0
  - result: >-
      RND(MX(0, claimed + sp_delta + ga_delta + gu_add + ub_add + pk_add + cs_add), 2) if complete else RND(claimed, 2)
  compute_basis:
    claimed: >-
      The standard qualifying medical debt is the medical debt claimed on the case, rounded half-up to the cent and never
      below zero.
    sp_acct: >-
      The self-pay account is the account carrying the patient's most recent self-pay final-bill liability (on a same-day
      tie, the liability listed first in the account activity).
    sp_bill: >-
      the self-pay account's bill is its self-pay final-bill liabilities in that window less its uninsured discounts (an
      observation-rate discount included) and package price adjustments in that window
    sp_agb: >-
      its amounts-generally-billed share is agb_pct percent of its self-pay final-bill liabilities in that window, rounded
      half-up to the cent
    sp_gfe: >-
      no self-pay good faith estimate (single scheduled service, procedure with co-providers or recurring course of care)
      whose service has been completed, which is closed or which is in dispute is linked to it
    ins_claim: >-
      The insured account is the account of the claim carrying the patient's most recent payer payment (on a same-day tie,
      the payment listed first in the claim activity)
    ins_acct: The insured account is the account of the claim carrying the patient's most recent payer payment
    ins_ok: >-
      when that claim is not in appealed status, that account is not on a billing hold and it is coded emergency or
      medically necessary
    ins_share: its patient share is the patient liabilities posted from that claim in that window
    ins_agb: its amounts-generally-billed share is agb_pct percent of its gross charges, rounded half-up to the cent
    sp_delta: >-
      One account is revalued in one of three ways, none ever raising a bill or a share above what is posted: when the
      self-pay account is coded emergency or medically necessary and no self-pay good faith estimate (single scheduled
      service, procedure with co-providers or recurring course of care) whose service has been completed, which is closed or
      which is in dispute is linked to it, its bill is replaced by the smaller of that bill and its amounts-generally-billed
      share; when no self-pay account so qualifies and an insured account exists, its patient share is replaced by the
      smaller of that share and its amounts-generally-billed share, a patient eligible for financial assistance being
      charged no more than the amounts generally billed for emergency or medically necessary care; otherwise nothing is
      revalued.
    ga_id: >-
      The estimated account is the account linked to the patient's self-pay good faith estimate whose service has been
      completed or which is closed (a recurring course of care before a single scheduled service before a procedure with
      co-providers; within one variant, an estimate whose service has been completed before a closed one; and among
      estimates of one variant and status, the estimate listed first among the patient's estimates)
    ga_acct: The estimated account is the account linked to the patient's self-pay good faith estimate
    ga_lines: >-
      its Riverbend lines are the convening-facility and convening-professional lines of that estimate's current version
    ga_bill: >-
      the estimated account's bill is its self-pay final-bill liabilities in that window less its uninsured discounts (an
      observation-rate discount included) and package price adjustments in that window
    ga_delta: >-
      The estimated account's bill is revalued in one of three ways: when it is coded emergency or medically necessary, its
      bill is replaced by the smallest of that bill, its Riverbend lines and its amounts-generally-billed share; when it is
      coded elective, its bill is replaced by the smaller of its Riverbend lines and that bill; otherwise, when no such
      estimate exists, nothing is revalued.
    gu_id: >-
      The disputed estimate is the patient's self-pay good faith estimate (single scheduled service, procedure with
      co-providers, or recurring course of care, in that order, and within one variant the estimate listed first among the
      patient's estimates) that is in dispute
    gu_acct: the disputed estimate's linked account
    gu_expected: >-
      its expected charges are the convening-facility and convening-professional lines of its current version
    gu_add: >-
      The undisputed part of a bill under dispute is added in one of three ways: when the disputed estimate's linked account
      is coded emergency or medically necessary, the smaller of its expected charges and that account's
      amounts-generally-billed share is added; when that account is coded elective, its expected charges are added;
      otherwise, when no estimate is in dispute, nothing is added.
    ub_acct: >-
      The awaiting self-pay account is the account listed first among the patient's accounts in pending billing status with
      financial class SELF_PAY
    ub_free: >-
      when an estimate is linked to it, nothing is added under this adjustment
    ub_add: >-
      Care already given on an awaiting self-pay account that carries no estimate is added in one of three ways: when it is
      coded emergency or medically necessary, agb_pct percent of its unbilled charges, rounded half-up to the cent, is
      added; when it is coded elective, its unbilled charges less its account type's uninsured_discount_elective_pct percent
      of them, rounded half-up to the cent, are added; otherwise nothing is added for awaiting self-pay care.
    pk_id: >-
      The rendered package is the patient's package estimate whose service has been completed (Imaging & Diagnostics before
      Outpatient Surgery before Maternity & Delivery, and within one package variant the estimate listed first)
    pk_acct: its linked account
    pk_open: while its linked account carries no package price adjustment yet
    pk_cesarean: when a cesarean delivery charge (CPT 59510, 59514 or 59515) is posted on its linked account
    pk_price: >-
      its package price is the sum of the Riverbend facility line and the Riverbend professional line that carry the
      principal service code on its current version, co-provider lines not being part of it
    pk_add: >-
      It is added in one of three ways: when a cesarean delivery charge (CPT 59510, 59514 or 59515) is posted on its linked
      account, the package price plus package_upgrade_differential_usd of its tier is added; when no such charge is posted,
      the package price is added; otherwise, when there is no rendered package, nothing is added.
    cs_id: >-
      The course in progress is the patient's issued self-pay good faith estimate for a recurring course of care (the estimate
      listed first when several are issued)
    cs_first: whose scheduled first visit is on or before the documentation day
    cs_started: whose scheduled first visit is on or before the documentation day
    cs_acct: The visits already given on its linked account
    cs_add: >-
      The visits already given on its linked account are added in one of three ways: when that account is coded emergency or
      medically necessary, agb_pct percent of its unbilled charges, rounded half-up to the cent, is added; when it is coded
      elective, its unbilled charges less its account type's uninsured_discount_elective_pct percent of them, rounded
      half-up to the cent, are added; otherwise, including when no first visit is scheduled or none has come, nothing is
      added for a course.
    result: >-
      The adjustments described below each change their own part of that standard figure and none depends on another; the
      qualifying medical debt is the standard figure plus every amount they add and less every amount they take off, rounded
      half-up to the cent and never below zero.
    income_doc: >-
      an income document (pay stubs, a federal tax return, a Social Security award letter, an unemployment benefit statement
      or a zero-income attestation)
    complete: >-
      This schedule documents a case once an income document (pay stubs, a federal tax return, a Social Security award
      letter, an unemployment benefit statement or a zero-income attestation), a proof of residency and a bank statement
      have each been accepted on it; a case lacking any of the three keeps the medical debt claimed on it.
  factors:
  - id: selfpay_basis
    effect: parameter
    decides: sp_delta
    bindings:
    - sp_acct
    - sp_gfe
    - sp_bill
    - sp_agb
    - ins_claim
    - ins_acct
    - ins_ok
    - ins_share
    - ins_agb
    - sp_delta
    ladder:
    - when: >-
        the self-pay account is coded emergency or medically necessary and no completed, closed or disputed self-pay estimate is
        linked to it
      value: the smaller of its bill and its amounts-generally-billed share, in place of the bill
    - when: >-
        no such self-pay account, and the account of the most recent payer payment is coded emergency or medically necessary, not
        on a billing hold, its claim not appealed
      value: >-
        the smaller of its patient share of the twelve months and the amounts-generally-billed share of its gross charges, in place
        of that share
    - when: otherwise
      value: nothing revalued
    baseline:
      sp_delta: '0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: encounter
  - id: gfe_account_basis
    effect: method
    decides: ga_delta
    bindings:
    - ga_id
    - ga_acct
    - ga_lines
    - ga_bill
    - ga_delta
    ladder:
    - when: a completed or closed self-pay estimate whose account is coded emergency or medically necessary
      method: the smallest of the bill, its Riverbend lines and its amounts-generally-billed share (a min-pick of three amounts)
    - when: such an estimate whose account is coded elective
      method: the smaller of the bill and its Riverbend lines (a min-pick of two amounts)
    - when: otherwise
      method: nothing revalued
    baseline:
      ga_delta: '0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: estimate
  - id: gfe_undisputed
    effect: parameter
    decides: gu_add
    bindings:
    - gu_id
    - gu_acct
    - gu_expected
    - gu_add
    ladder:
    - when: an estimate in dispute whose account is coded emergency or medically necessary
      value: the smaller of its expected charges and the amounts-generally-billed share, added
    - when: an estimate in dispute whose account is coded elective
      value: its expected charges, added
    - when: otherwise
      value: '0'
    baseline:
      gu_add: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: estimate
  - id: unbilled_selfpay
    effect: parameter
    decides: ub_add
    bindings:
    - ub_acct
    - ub_free
    - ub_add
    ladder:
    - when: an awaiting self-pay account with no estimate, coded emergency or medically necessary
      value: the amounts-generally-billed share of its unbilled charges
    - when: an awaiting self-pay account with no estimate, coded elective
      value: its unbilled charges less the elective uninsured discount
    - when: otherwise
      value: '0'
    baseline:
      ub_add: '0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: encounter
  - id: package_rendered
    effect: parameter
    decides: pk_add
    bindings:
    - pk_id
    - pk_acct
    - pk_open
    - pk_cesarean
    - pk_price
    - pk_add
    ladder:
    - when: a rendered package with a cesarean delivery charge on its account
      value: the package price plus the upgrade differential
    - when: a rendered package with no such charge
      value: the package price
    - when: otherwise
      value: '0'
    baseline:
      pk_add: '0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: estimate
  - id: course_in_progress
    effect: parameter
    decides: cs_add
    bindings:
    - cs_id
    - cs_first
    - cs_started
    - cs_acct
    - cs_add
    ladder:
    - when: a course in progress whose account is coded emergency or medically necessary
      value: the amounts-generally-billed share of its unbilled charges
    - when: a course in progress whose account is coded elective
      value: its unbilled charges less the elective uninsured discount
    - when: otherwise
      value: '0'
    baseline:
      cs_add: '0'
    evidence:
    - history
    - cross_category
    - date
    - tier_param
    cross_difficulty: estimate
  baseline:
    rule: >-
      The standard qualifying medical debt is the medical debt claimed on the case, rounded half-up to the cent and never
      below zero.
    params: []
  inputs:
    history:
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: encounter_liability_posted
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_charge_posted
    - table: assistance_transactions
      aggregate: count
      field: fap_txn_id
      filters:
        event_type: assist_document_logged
        document_status: ACCEPTED
    cross_category:
    - encounter
    - estimate
    - claim
- id: assist_ext_other_costs_debt
  base_policy_refs:
  - assist_tier_determination
  overwrite: []
  trigger: state_due
  subject:
  - assist_household_updated
  computes: qualifying_medical_debt_usd
  target_tool: record_documented_costs_4c71e2b9
  params:
    window_months: 12
  rule: >-
    Riverbend completes the documentation of the qualifying medical debt on a Medical Hardship application with no outside
    medical bills document accepted on it, on which an income document (pay stubs, a federal tax return, a Social Security
    award letter, an unemployment benefit statement or a zero-income attestation), a proof of residency and a bank statement
    have each been accepted, by adding medical costs that Riverbend's records show: care given whose bill or payer decision
    is still pending, co-providers' charges for procedures performed at Riverbend, cost sharing posted from a claim under
    appeal, and cost sharing posted on an account on a billing hold. A case outside that scope is not documented under this
    schedule. Riverbend documents the other medical costs only after it has documented its own charges of the window on the
    case. The standard qualifying medical debt is the qualifying medical debt recorded on the case, rounded half-up to the
    cent and never below zero. The additions described below each add their own amount to that standard figure and none
    depends on another; the qualifying medical debt is the standard figure plus every addition, rounded half-up to the cent.
    The claim under appeal is the claim named by the most recent appeal filed on any of the patient's claims (on a same-day
    tie, the appeal listed first in the claim activity), while that claim is in appealed status. The rendered estimate is
    the patient's self-pay good faith estimate for a single scheduled service whose service has been completed (the estimate
    listed first among the patient's estimates when several are), while its linked account carries no self-pay final-bill
    liability; its Riverbend lines are the convening-facility and convening-professional lines of its current version, and
    that account's unbilled charges are the charges posted on it less its self-pay final-bill liabilities. Care given under
    a rendered estimate is added in one of three ways: when its linked account is coded emergency or medically necessary,
    the smaller of its Riverbend lines and agb_pct percent of that account's unbilled charges, rounded half-up to the cent,
    is added; when that account is coded elective, its Riverbend lines are added; otherwise nothing is added for a rendered
    estimate. The pending insured account is the account listed first among the patient's accounts in insurance pending
    status. Care awaiting its payer's decision is added at the patient's expected share of it, never at amounts the payer is
    expected to pay, in one of three ways: when an insured patient out-of-pocket estimate is tied to the pending insured
    account (the estimate listed first among the patient's estimates when several are), that estimate's total is added; when
    none is tied to it and point-of-service payments have been posted on that account, those payments, the cost sharing
    collected at the visit, are added; otherwise nothing is added for a pending insured account. Co-providers' charges are
    added in one of three ways: when the patient's self-pay good faith estimate for a procedure with co-providers has its
    service completed or is in dispute (an estimate whose service has been completed before one in dispute and, among
    several of the same status, the estimate listed first among the patient's estimates) and no outside medical bills
    document has been logged as received on the case, the anesthesia, pathology and radiology lines of its current version
    are added; otherwise, when the patient's Outpatient Surgery package estimate has its service completed (the estimate
    listed first among the patient's estimates when several are) and no outside medical bills document has been logged as
    received on the case, the co-provider lines of its current version are added; otherwise nothing is added for
    co-providers. Cost sharing posted from the claim under appeal is added as follows, a liability belonging to the appeal
    window when fewer than twelve whole months separate its posting date from the documentation day, a whole month running
    from a day of one month to the same day of the next month or, when the next month has no such day, to the first day of
    the month after it: when the most recent appeal is a member appeal filed under the patient's authorization, its claim is
    the claim under appeal, and more days than its payer's decision time for a post-service appeal
    (payer_appeal_decision_days of that claim's payer class under the claim charter) have passed from its filing date to the
    documentation day (counted from the day after the filing date), the payer having let that time run out, the deductible,
    coinsurance and copay liabilities of the appeal window posted from that claim are added; when it is an underpayment
    appeal or a recoupment dispute, appeals in which Riverbend contests only the payer's payment, and its claim is the claim
    under appeal, the coinsurance liabilities of the appeal window posted from that claim are added, the posted coinsurance
    being the least the patient owes in any outcome, since an underpayment appeal can only raise the allowed amount the
    coinsurance is a share of and a recoupment dispute concerns only the payer's takeback; otherwise, including a member
    appeal still within its payer's decision time, an appeal of any other type, or no appeal, nothing is added for an
    appeal. The held account is the patient's account on a billing hold for a charge dispute or, when no account is on such
    a hold, the account on a billing hold for an itemization review (when several accounts qualify, the one listed first
    among the patient's accounts). Cost sharing posted on the held account is added as follows, leaving aside every
    liability posted from the claim under appeal, a liability belonging to the hold window when fewer than twelve whole
    months separate its posting date from the documentation day, a whole month running from a day of one month to the same
    day of the next month or, when the next month has no such day, to the first day of the month after it: when the held
    account is on an itemization-review hold and an itemized statement has been issued on it, its coinsurance liabilities of
    the hold window are added; when the held account is on a charge-dispute hold, its financial class is SELF_PAY, its
    self-pay final-bill liabilities are above zero, and the most recent charge-dispute inquiry on it (on a tie in creation
    time, the inquiry listed first) names a charge line, the uninsured discount part of that line is added, which is the
    smaller of that line's charge and the held account's patient liabilities of the hold window, times the account's
    uninsured discount rate (the uninsured discount posted on its most recent self-pay final-bill liability divided by that
    liability, a discount posted on any other line, such as an observation-rate discount, not counted), rounded half-up to
    the cent, a correction of that line lowering the patient's balance only by its charge less that discount; otherwise
    nothing is added for a hold.
  prerequisite:
  - problem: assist_ext_qualifying_debt
    kind: value_input
    gate: documented
    form: action
    policy_source: >-
      Riverbend documents the other medical costs only after it has documented its own charges of the window on the case.
    fallback_reason: >-
      Both documentation steps and the patient's claim write the case's qualifying medical debt field; a figure in that field
      does not show which act put it there, so no record-visible state singles out the documentation of Riverbend's own charges.
    condition: >-
      The case's qualifying_medical_debt_usd holds the figure Riverbend documented for its own charges of the window.
    resolved_by: record_qualifying_debt_da5f54be
    effect: >-
      Once Riverbend's own charges are documented, the other medical costs are added to that documented figure.
  cross_category:
  - category: estimate
    as: branch
    reads:
    - variant_name
    - status
    - encounter_id
    - estimate_version
    - estimate_total_usd
    - estimate_transactions.amount
    - estimate_transactions.provider_role
    note: rendered and disputed estimates, insured estimates and package co-provider lines.
  - category: encounter
    as: history
    reads:
    - encounter_transactions.amount
    - encounter_transactions.liability_source
    - encounter_transactions.claim_id
    - encounter_transactions.statement_type
    - encounter_transactions.payment_channel
    - encounter_transactions.adjustment_code
    - encounter_billing_inquiries.disputed_txn_id
    - status
    - service_classification
    - financial_class
    - billing_hold_reason
    note: unbilled charges, pending accounts, held accounts and their inquiries and statements.
  - category: claim
    as: history
    reads:
    - claim_transactions.claim_id
    - claim_transactions.appeal_type
    - claim_transactions.posting_date
    - status
    - variant_name
    note: the most recent appeal, its type, filing date and claim status.
  compute:
  - documented: MX(0, F('qualifying_medical_debt_usd'))
  - appeal_claim: >-
      XLATEST('claim','claim_transactions','claim_id', date_field='posting_date', event_type='claim_appeal_filed')
  - appeal_open: appeal_claim != None and CFIELD('claim','status', claim_id=appeal_claim) == 'appealed'
  - dispute_acct: CFIELD('encounter','encounter_id', billing_hold_reason='CHARGE_DISPUTE')
  - review_acct: CFIELD('encounter','encounter_id', billing_hold_reason='ITEMIZATION_REVIEW')
  - held_acct: dispute_acct if dispute_acct != None else review_acct
  - rc_id: >-
      CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='service_completed')
  - rc_acct: CFIELD('estimate','encounter_id', estimate_id=rc_id)
  - rc_open: >-
      rc_id != None and XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted', liability_source='SELF_PAY_FINAL_BILL',
      encounter_id=rc_acct) == 0
  - rc_lines: >-
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=rc_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=rc_id), provider_role='CONVENING_FACILITY') + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded',
      estimate_id=rc_id, estimate_version=CFIELD('estimate','estimate_version', estimate_id=rc_id), provider_role='CONVENING_PROFESSIONAL')
  - rc_add: >-
      MN(rc_lines, RND(((XSUM('encounter','encounter_transactions','amount', event_type='encounter_charge_posted', encounter_id=rc_acct)
      - XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted', liability_source='SELF_PAY_FINAL_BILL',
      encounter_id=rc_acct))) * P('agb_pct') / 100, 2)) if (rc_open and (rc_acct != None and CFIELD('encounter','service_classification',
      encounter_id=rc_acct) != 'ELECTIVE_NON_COVERED')) else (rc_lines if (rc_open and (rc_acct != None and CFIELD('encounter','service_classification',
      encounter_id=rc_acct) == 'ELECTIVE_NON_COVERED')) else 0)
  - ip_acct: CFIELD('encounter','encounter_id', status='insurance_pending')
  - ip_est: >-
      CFIELD('estimate','estimate_total_usd', encounter_id=ip_acct, variant_name='Insured Patient Out-of-Pocket Estimate')
  - ip_pos: >-
      XSUM('encounter','encounter_transactions','amount', event_type='encounter_payment_posted', payment_channel='POINT_OF_SERVICE',
      encounter_id=ip_acct)
  - ip_add: ip_est if (ip_acct != None and ip_est != None) else (ip_pos if (ip_acct != None and ip_pos > 0) else 0)
  - cp_id: >-
      CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='in_dispute')
  - cp_none_out: >-
      COUNT('assistance_transactions', event_type='assist_document_logged', document_type='OUTSIDE_MEDICAL_BILLS', document_status='RECEIVED')
      == 0
  - cp_lines: >-
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=cp_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=cp_id), provider_role='CO_PROVIDER_ANESTHESIA') + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded',
      estimate_id=cp_id, estimate_version=CFIELD('estimate','estimate_version', estimate_id=cp_id), provider_role='CO_PROVIDER_PATHOLOGY')
      + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=cp_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=cp_id), provider_role='CO_PROVIDER_RADIOLOGY')
  - sg_id: >-
      CFIELD('estimate','estimate_id', variant_name='Riverbend Self-Pay Package Price - Outpatient Surgery', status='service_completed')
  - sg_lines: >-
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=sg_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=sg_id), provider_role='CO_PROVIDER_ANESTHESIA') + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded',
      estimate_id=sg_id, estimate_version=CFIELD('estimate','estimate_version', estimate_id=sg_id), provider_role='CO_PROVIDER_PATHOLOGY')
      + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=sg_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=sg_id), provider_role='CO_PROVIDER_RADIOLOGY')
  - cp_add: >-
      cp_lines if (cp_id != None and cp_none_out) else (sg_lines if (sg_id != None and cp_none_out) else 0)
  - appeal_kind: >-
      XLATEST('claim','claim_transactions','appeal_type', date_field='posting_date', event_type='claim_appeal_filed')
  - appeal_due: CPARAM('claim','payer_appeal_decision_days', claim_id=appeal_claim) if appeal_open else 0
  - appeal_age: >-
      DAYS(XLATEST('claim','claim_transactions','posting_date', date_field='posting_date', event_type='claim_appeal_filed'),
      NOW) if appeal_open else 0
  - appeal_coi: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COINSURANCE', claim_id=appeal_claim)
  - appeal_cs: >-
      appeal_coi + XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_liability_posted', liability_source='DEDUCTIBLE', claim_id=appeal_claim) + XSUM('encounter','encounter_transactions','amount',
      within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted', liability_source='COPAY',
      claim_id=appeal_claim)
  - appeal_add: >-
      appeal_cs if (appeal_open and appeal_kind == 'MEMBER_APPEAL_WITH_AOR' and appeal_age > appeal_due) else (appeal_coi if
      (appeal_open and (appeal_kind == 'UNDERPAYMENT_APPEAL' or appeal_kind == 'RECOUPMENT_DISPUTE')) else 0)
  - itemized_done: >-
      XCOUNT('encounter','encounter_transactions', event_type='encounter_statement_issued', statement_type='ITEMIZED_STATEMENT',
      encounter_id=held_acct) > 0
  - held_coi: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COINSURANCE', encounter_id=held_acct) - (XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'),
      date_field='posting_date', event_type='encounter_liability_posted', liability_source='COINSURANCE', encounter_id=held_acct,
      claim_id=appeal_claim) if appeal_open else 0)
  - dispute_line: >-
      XLATEST('encounter','encounter_billing_inquiries','disputed_txn_id', date_field='created_at', encounter_id=held_acct,
      inquiry_type='CHARGE_DISPUTE')
  - held_liab: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      encounter_id=held_acct) - (XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_liability_posted', encounter_id=held_acct, claim_id=appeal_claim) if appeal_open else 0)
  - dispute_fb: >-
      XLATEST('encounter','encounter_transactions','encounter_txn_id', date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=held_acct)
  - dispute_bill: >-
      XSUM('encounter','encounter_transactions','amount', event_type='encounter_liability_posted',
      encounter_txn_id=dispute_fb) if dispute_fb != None else 0
  - dispute_disc: >-
      XSUM('encounter','encounter_transactions','amount', event_type='encounter_adjustment_posted',
      adjustment_code='UNINSURED_DISCOUNT', source_txn_id=dispute_fb) if dispute_fb != None else 0
  - restore_add: >-
      held_coi if (review_acct != None and dispute_acct == None and itemized_done) else
      (RND(MN(XSUM('encounter','encounter_transactions','amount', event_type='encounter_charge_posted',
      encounter_txn_id=dispute_line), held_liab) * dispute_disc / dispute_bill, 2) if (dispute_acct != None and
      CFIELD('encounter','financial_class', encounter_id=dispute_acct) == 'SELF_PAY' and dispute_bill > 0 and dispute_line
      != None) else 0)
  - result: RND(documented + rc_add + ip_add + cp_add + appeal_add + restore_add, 2)
  compute_basis:
    documented: >-
      The standard qualifying medical debt is the qualifying medical debt recorded on the case, rounded half-up to the cent
      and never below zero.
    appeal_claim: >-
      The claim under appeal is the claim named by the most recent appeal filed on any of the patient's claims (on a same-day
      tie, the appeal listed first in the claim activity), while that claim is in appealed status.
    appeal_open: while that claim is in appealed status.
    dispute_acct: The held account is the patient's account on a billing hold for a charge dispute
    review_acct: >-
      when no account is on such a hold, the account on a billing hold for an itemization review (when several accounts qualify,
      the one listed first among the patient's accounts).
    held_acct: >-
      The held account is the patient's account on a billing hold for a charge dispute or, when no account is on such a hold,
      the account on a billing hold for an itemization review (when several accounts qualify, the one listed first among the
      patient's accounts).
    rc_id: >-
      The rendered estimate is the patient's self-pay good faith estimate for a single scheduled service whose service has
      been completed (the estimate listed first among the patient's estimates when several are)
    rc_acct: its linked account
    rc_open: while its linked account carries no self-pay final-bill liability
    rc_lines: >-
      its Riverbend lines are the convening-facility and convening-professional lines of its current version
    rc_add: >-
      Care given under a rendered estimate is added in one of three ways: when its linked account is coded emergency or
      medically necessary, the smaller of its Riverbend lines and agb_pct percent of that account's unbilled charges,
      rounded half-up to the cent, is added; when that account is coded elective, its Riverbend lines are added; otherwise
      nothing is added for a rendered estimate.
    ip_acct: >-
      The pending insured account is the account listed first among the patient's accounts in insurance pending status.
    ip_est: >-
      when an insured patient out-of-pocket estimate is tied to the pending insured account (the estimate listed first among
      the patient's estimates when several are), that estimate's total is added
    ip_pos: >-
      when none is tied to it and point-of-service payments have been posted on that account, those payments, the cost sharing
      collected at the visit, are added
    ip_add: >-
      Care awaiting its payer's decision is added at the patient's expected share of it, never at amounts the payer is
      expected to pay, in one of three ways: when an insured patient out-of-pocket estimate is tied to the pending insured
      account (the estimate listed first among the patient's estimates when several are), that estimate's total is added;
      when none is tied to it and point-of-service payments have been posted on that account, those payments, the cost
      sharing collected at the visit, are added; otherwise nothing is added for a pending insured account.
    cp_id: >-
      the patient's self-pay good faith estimate for a procedure with co-providers has its service completed or is in
      dispute (an estimate whose service has been completed before one in dispute and, among several of the same status, the
      estimate listed first among the patient's estimates)
    cp_none_out: no outside medical bills document has been logged as received on the case
    cp_lines: the anesthesia, pathology and radiology lines of its current version are added
    sg_id: >-
      when the patient's Outpatient Surgery package estimate has its service completed (the estimate listed first among the
      patient's estimates when several are)
    sg_lines: the co-provider lines of its current version are added
    cp_add: >-
      Co-providers' charges are added in one of three ways: when the patient's self-pay good faith estimate for a procedure
      with co-providers has its service completed or is in dispute (an estimate whose service has been completed before one
      in dispute and, among several of the same status, the estimate listed first among the patient's estimates) and no
      outside medical bills document has been logged as received on the case, the anesthesia, pathology and radiology lines
      of its current version are added; otherwise, when the patient's Outpatient Surgery package estimate has its service
      completed (the estimate listed first among the patient's estimates when several are) and no outside medical bills
      document has been logged as received on the case, the co-provider lines of its current version are added; otherwise
      nothing is added for co-providers.
    appeal_kind: >-
      when the most recent appeal is a member appeal filed under the patient's authorization
    appeal_due: >-
      its payer's decision time for a post-service appeal (payer_appeal_decision_days of that claim's payer class under the claim
      charter)
    appeal_add: >-
      Cost sharing posted from the claim under appeal is added as follows, a liability belonging to the appeal window when
      fewer than twelve whole months separate its posting date from the documentation day, a whole month running from a day
      of one month to the same day of the next month or, when the next month has no such day, to the first day of the month
      after it: when the most recent appeal is a member appeal filed under the patient's authorization, its claim is the
      claim under appeal, and more days than its payer's decision time for a post-service appeal (payer_appeal_decision_days
      of that claim's payer class under the claim charter) have passed from its filing date to the documentation day
      (counted from the day after the filing date), the payer having let that time run out, the deductible, coinsurance and
      copay liabilities of the appeal window posted from that claim are added; when it is an underpayment appeal or a
      recoupment dispute, appeals in which Riverbend contests only the payer's payment, and its claim is the claim under
      appeal, the coinsurance liabilities of the appeal window posted from that claim are added, the posted coinsurance
      being the least the patient owes in any outcome, since an underpayment appeal can only raise the allowed amount the
      coinsurance is a share of and a recoupment dispute concerns only the payer's takeback; otherwise, including a member
      appeal still within its payer's decision time, an appeal of any other type, or no appeal, nothing is added for an
      appeal.
    appeal_age: >-
      have passed from its filing date to the documentation day (counted from the day after the filing date
    appeal_coi: >-
      the coinsurance liabilities of the appeal window posted from that claim are added
    appeal_cs: the deductible, coinsurance and copay liabilities of the appeal window posted from that claim are added
    itemized_done: an itemized statement has been issued on it
    held_coi: >-
      its coinsurance liabilities of the hold window are added
    dispute_line: >-
      the most recent charge-dispute inquiry on it (on a tie in creation time, the inquiry listed first) names a charge line
    held_liab: the held account's patient liabilities of the hold window
    dispute_fb: its most recent self-pay final-bill liability
    dispute_bill: >-
      its self-pay final-bill liabilities are above zero
    dispute_disc: >-
      the uninsured discount posted on its most recent self-pay final-bill liability divided by that liability, a discount
      posted on any other line, such as an observation-rate discount, not counted
    restore_add: >-
      Cost sharing posted on the held account is added as follows, leaving aside every liability posted from the claim under
      appeal, a liability belonging to the hold window when fewer than twelve whole months separate its posting date from
      the documentation day, a whole month running from a day of one month to the same day of the next month or, when the
      next month has no such day, to the first day of the month after it: when the held account is on an itemization-review
      hold and an itemized statement has been issued on it, its coinsurance liabilities of the hold window are added; when
      the held account is on a charge-dispute hold, its financial class is SELF_PAY, its self-pay final-bill liabilities are
      above zero, and the most recent charge-dispute inquiry on it (on a tie in creation time, the inquiry listed first)
      names a charge line, the uninsured discount part of that line is added, which is the smaller of that line's charge and
      the held account's patient liabilities of the hold window, times the account's uninsured discount rate (the uninsured
      discount posted on its most recent self-pay final-bill liability divided by that liability, a discount posted on any
      other line, such as an observation-rate discount, not counted), rounded half-up to the cent, a correction of that line
      lowering the patient's balance only by its charge less that discount; otherwise nothing is added for a hold.
    result: >-
      The additions described below each add their own amount to that standard figure and none depends on another; the qualifying
      medical debt is the standard figure plus every addition, rounded half-up to the cent.
  factors:
  - id: rendered_care
    effect: method
    decides: rc_add
    bindings:
    - rc_id
    - rc_acct
    - rc_open
    - rc_lines
    - rc_add
    ladder:
    - when: a rendered single-service estimate whose account is coded emergency or medically necessary
      method: >-
        the smaller of its Riverbend lines and the amounts-generally-billed share of the account's unbilled charges (a min-pick
        of two inputs)
    - when: a rendered single-service estimate whose account is coded elective
      method: its Riverbend lines (a line sum)
    - when: otherwise
      method: nothing added
    baseline:
      rc_add: '0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: estimate
  - id: insured_pending
    effect: parameter
    decides: ip_add
    bindings:
    - ip_acct
    - ip_est
    - ip_pos
    - ip_add
    ladder:
    - when: an insured patient out-of-pocket estimate tied to the pending insured account
      value: that estimate's total
    - when: no tied estimate and point-of-service payments posted on the pending insured account
      value: those payments (the cost sharing collected at the visit)
    - when: otherwise
      value: '0'
    baseline:
      ip_add: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: encounter
  - id: coprovider_rendered
    effect: parameter
    decides: cp_add
    bindings:
    - cp_id
    - cp_none_out
    - cp_lines
    - sg_id
    - sg_lines
    - cp_add
    ladder:
    - when: a rendered co-provider estimate and no outside medical bills received
      value: its anesthesia, pathology and radiology lines
    - when: otherwise, a rendered Outpatient Surgery package and no outside medical bills received
      value: the package's co-provider lines
    - when: otherwise
      value: '0'
    baseline:
      cp_add: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: estimate
  - id: appeal_held_share
    effect: parameter
    decides: appeal_add
    bindings:
    - appeal_kind
    - appeal_due
    - appeal_age
    - appeal_coi
    - appeal_cs
    - appeal_add
    ladder:
    - when: >-
        a member appeal under the patient's authorization, its claim still appealed, pending more days than its payer's
        post-service decision time
      value: the deductible, coinsurance and copay liabilities of the twelve months posted from that claim
    - when: an underpayment appeal or a recoupment dispute, its claim still appealed
      value: the coinsurance liabilities of the twelve months posted from that claim
    - when: otherwise (a member appeal still within its payer's decision time, another appeal type, or no appeal)
      value: '0'
    baseline:
      appeal_add: '0'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: claim
  - id: hold_restore
    effect: parameter
    decides: restore_add
    bindings:
    - dispute_acct
    - review_acct
    - held_acct
    - itemized_done
    - held_coi
    - dispute_line
    - held_liab
    - dispute_fb
    - dispute_bill
    - dispute_disc
    - restore_add
    ladder:
    - when: the held account is on an itemization-review hold and an itemized statement has been issued on it
      value: its coinsurance of the twelve months, added
    - when: >-
        the held account is a self-pay account on a charge-dispute hold whose latest charge-dispute inquiry names a charge line
      value: >-
        the uninsured discount part of that line (the smaller of its charge and the held liabilities, times the uninsured
        discount rate of the account's most recent self-pay final bill), added
    - when: otherwise
      value: '0'
    baseline:
      restore_add: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: encounter
  baseline:
    rule: >-
      The standard qualifying medical debt is the qualifying medical debt recorded on the case, rounded half-up to the cent
      and never below zero.
    params: []
  inputs:
    history:
    - category: claim
      table: claim_transactions
      aggregate: latest
      field: claim_id
      filters:
        event_type: claim_appeal_filed
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_charge_posted
    cross_category:
    - estimate
    - encounter
    - claim
- id: assist_ext_hardship_cap
  base_policy_refs:
  - assist_agg_award_coverage
  - assist_tier_determination
  - assist_award_period
  - assist_medicaid_screening
  - assist_completeness_and_documents
  overwrite:
  - base_policy: assist_tier_determination
    superseded_clause: >-
      the hardship cap is hardship_liability_cap_income_pct of annual household income, rounded half-up to the cent
    replaced_by: >-
      For a Medical Hardship award determined on or after schedule_effective_date (2025-10-01), the date this schedule took
      effect, and only for such an award, the hardship liability cap is worked out as stated here; every other hardship cap
      remains hardship_liability_cap_income_pct of annual household income, rounded half-up to the cent.
  - base_policy: assist_completeness_and_documents
    superseded_clause: every document type in the tier's required_document_types has been ACCEPTED
    replaced_by: >-
      For a Medical Hardship application on which the patient responsibility posted to the patient's Riverbend accounts in
      the twelve whole months before the application date (a whole month running from a day of one month to the same day of
      the next month or, when the next month has no such day, to the first day of the month after it), less the adjustments
      posted to them in those months, exceeds hardship_medical_debt_income_pct percent of the annual household income recorded
      on the case, and only for such an application (any other application, and every renewal application whatever its debt,
      is complete only as the last clause of this sentence states), the application is complete for approval once every document
      type in the tier's required_document_types other than OUTSIDE_MEDICAL_BILLS has been ACCEPTED; every other application
      is complete only when every document type in the tier's required_document_types has been ACCEPTED.
  trigger: on_request
  subject:
  - assist_approved
  computes: hardship_liability_cap_usd
  target_tool: approve_hardship_award_afb08b0b
  params:
    window_months: 12
    recent_months: 3
    cut_three_members: 1.0
    cut_four_members: 2.0
    fixed_cut_retired: 1.0
    fixed_cut_disability: 1.5
    coverage_cut_uninsured: 2.0
    coverage_cut_reinsured: 1.0
    heavy_debt_share: 35.0
    middle_debt_share: 25.0
    paid_share: 10.0
    heavy_keep: 0.75
    middle_keep: 0.85
    statement_fresh_days: 90
    asset_floor: 8000.0
    asset_high: 12000.0
    asset_raise_pct: 25.0
    asset_minimum_pct: 10.0
    schedule_effective_date: '2025-10-01'
    plan_burden_high: 5.0
    plan_burden_low: 2.0
    plan_cut_high: 2.0
    plan_cut_low: 1.0
  rule: >-
    A complete Medical Hardship application is approved with its award dates and its hardship liability cap. For a Medical
    Hardship award determined on or after schedule_effective_date (2025-10-01), the date this schedule took effect, and only
    for such an award, the hardship liability cap is worked out as stated here; every other hardship cap remains
    hardship_liability_cap_income_pct of annual household income, rounded half-up to the cent. For a Medical Hardship
    application on which the patient responsibility posted to the patient's Riverbend accounts in the twelve whole months
    before the application date (a whole month running from a day of one month to the same day of the next month or, when
    the next month has no such day, to the first day of the month after it), less the adjustments posted to them in those
    months, exceeds hardship_medical_debt_income_pct percent of the annual household income recorded on the case, and only
    for such an application (any other application, and every renewal application whatever its debt, is complete only as the
    last clause of this sentence states), the application is complete for approval once every document type in the tier's
    required_document_types other than OUTSIDE_MEDICAL_BILLS has been ACCEPTED; every other application is complete only
    when every document type in the tier's required_document_types has been ACCEPTED. For a Medical Hardship award
    determined under this schedule the approval is the determination made on the call: the charity adjustments that apply
    the award to each covered encounter are booked afterwards in Riverbend's posting cycle, not as part of the
    determination. The hardship liability cap is fixed only after Riverbend has completed the documentation of the
    qualifying medical debt with the other medical costs of the window. The standard hardship liability cap is
    hardship_liability_cap_income_pct percent of the annual household income recorded on the case, rounded half-up to the
    cent. The adjustments described below each change their own part of that standard figure and none depends on another,
    and they apply in this order: every reduction of the cap percent applies first (the cap percent never going below zero);
    the annual household income is then scaled at the resulting percent and every kept share is applied to that scaled
    figure, the product being rounded half-up to the cent; every addition applies last, and the cap is rounded half-up to
    the cent and is never below zero. Household points are taken off for the household documented on an accepted federal tax
    return: when the household size recorded on the case is four or more and a federal tax return has been accepted on the
    case, cut_four_members points; when it is exactly three and a federal tax return has been accepted on the case,
    cut_three_members points; otherwise none. Plan-burden points are taken off for the installment the household already
    pays on the patient's active Riverbend payment plan, measured as a percent of one twelfth of the annual household income
    recorded on the case: when that installment is above plan_burden_high percent, plan_cut_high points; when it is above
    plan_burden_low percent and at most plan_burden_high percent, plan_cut_low points; otherwise, including when the patient
    has no active plan or no income is recorded, none. Fixed-income points are taken off for Social Security income: when a
    Social Security award letter has been accepted on the case and the patient holds an Original Medicare or Medicare
    Advantage claim, fixed_cut_retired points; when a Social Security award letter has been accepted on the case and the
    patient holds no such Medicare claim, fixed_cut_disability points; otherwise none. Coverage-loss points are taken off
    when an insurer ended the patient's coverage: when a coverage-terminated liability was posted on the patient's Riverbend
    accounts in the twelve whole months before the approval day and no claim of the patient was billed to an insurer in the
    three whole months before it, coverage_cut_uninsured points; when such a liability was posted in those twelve months and
    a claim was billed to an insurer in those three months, coverage_cut_reinsured points; otherwise none. For the
    coverage-loss points, a posting belongs to a span of whole months when fewer than that many whole months separate its
    posting date from the approval day, a whole month running from a day of one month to the same day of the next month or,
    when the next month has no such day, to the first day of the month after it. The kept share follows the medical-debt
    burden, the qualifying medical debt recorded on the case as a percent of the annual household income recorded on the
    case (a household with no recorded income carries no burden), and the patient payments posted on the patient's Riverbend
    accounts in the twelve whole months before the approval day (for the kept share, a payment belongs to those months when
    fewer than twelve whole months separate its posting date from the approval day, a whole month running from a day of one
    month to the same day of the next month or, when the next month has no such day, to the first day of the month after
    it): when the burden is above heavy_debt_share percent and those payments are above paid_share percent of the annual
    household income, heavy_keep of the scaled figure is kept; when the burden is above middle_debt_share percent and either
    at most heavy_debt_share percent or with those payments at most paid_share percent of the annual household income,
    middle_keep of the scaled figure is kept; when the burden is at most middle_debt_share percent, the whole scaled figure
    is kept. The asset increment follows the documented liquid assets recorded on the case and the bank statement accepted
    on the case (the latest accepted when several are), and is measured against the standard hardship liability cap: when
    the documented liquid assets are above asset_high and that statement was accepted fewer than statement_fresh_days days
    before the approval day, the standard cap is raised by asset_raise_pct percent of the documented liquid assets above
    asset_floor, rounded half-up to the cent; when the documented liquid assets are above asset_floor and either at most
    asset_high or with no statement accepted fewer than statement_fresh_days days before the approval day, the standard cap
    is raised to asset_minimum_pct percent of the documented liquid assets, rounded half-up to the cent, when that is more
    than the standard cap; when the documented liquid assets are at most asset_floor, the standard cap stands; the asset
    increment is the raised cap less the standard cap.
  prerequisite:
  - problem: assist_ext_other_costs_debt
    kind: value_input
    gate: debt_keep
    form: action
    policy_source: >-
      The hardship liability cap is fixed only after Riverbend has completed the documentation of the qualifying medical debt
      with the other medical costs of the window.
    fallback_reason: >-
      The patient's claim and both documentation steps write the same qualifying medical debt field; the record shows a number
      but not which act wrote it, so no record-visible state singles out the completed documentation.
    condition: >-
      The case's qualifying_medical_debt_usd holds the figure Riverbend completed with the other medical costs of the window.
    resolved_by: record_documented_costs_4c71e2b9
    effect: >-
      Once the documentation is completed, the medical-debt burden that selects the kept share is read from the completed
      figure, which can move the kept share and therefore the cap.
  cross_category:
  - category: plan
    as: branch
    reads:
    - monthly_payment_usd
    - status
    note: the plan-burden points read the installment of the patient's active Riverbend payment plan.
  - category: claim
    as: history
    reads:
    - variant_name
    - claim_transactions.event_type
    - claim_transactions.posting_date
    note: >-
      the fixed-income points read whether a Medicare claim is held; the coverage-loss points count the claims billed in the
      last three months.
  - category: encounter
    as: history
    reads:
    - encounter_transactions.amount
    - encounter_transactions.liability_source
    - encounter_transactions.event_type
    note: >-
      the coverage-loss points read coverage-terminated liabilities; the kept share sums the patient's Riverbend payments
      of the twelve months.
  compute:
  - income: F('annual_household_income_usd')
  - std_pct: P('hardship_liability_cap_income_pct')
  - std_cap: RND(income * std_pct / 100, 2)
  - members: F('household_size')
  - tax_return: >-
      COUNT('assistance_transactions', event_type='assist_document_logged', document_type='FEDERAL_TAX_RETURN', document_status='ACCEPTED')
      > 0
  - size_cut: >-
      K('cut_four_members') if (members >= 4 and tax_return) else (K('cut_three_members') if (members == 3 and tax_return)
      else 0)
  - plan_install: CFIELD('plan','monthly_payment_usd', status='active')
  - install_share: plan_install / (income / 12) * 100 if (plan_install != None and income > 0) else 0
  - plan_cut: >-
      K('plan_cut_high') if install_share > K('plan_burden_high') else (K('plan_cut_low') if install_share > K('plan_burden_low')
      else 0)
  - ss_letter: >-
      COUNT('assistance_transactions', event_type='assist_document_logged', document_type='SOCIAL_SECURITY_AWARD_LETTER',
      document_status='ACCEPTED') > 0
  - on_medicare: >-
      EXISTS('claim', variant_name='Original Medicare Claim') or EXISTS('claim', variant_name='Medicare Advantage Plan Claim')
  - fixed_cut: >-
      K('fixed_cut_retired') if (ss_letter and on_medicare) else (K('fixed_cut_disability') if (ss_letter and not on_medicare)
      else 0)
  - ct_recent: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COVERAGE_TERMINATED')
  - billed_recent: >-
      XCOUNT('claim','claim_transactions', within_months=K('recent_months'), date_field='posting_date', event_type='claim_billed')
  - cov_cut: >-
      K('coverage_cut_uninsured') if (ct_recent > 0 and billed_recent == 0) else (K('coverage_cut_reinsured') if (ct_recent
      > 0 and billed_recent > 0) else 0)
  - debt: F('qualifying_medical_debt_usd')
  - debt_share: debt / income * 100 if income > 0 else 0
  - paid_recent: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_payment_posted')
  - paid_heavy: income > 0 and paid_recent > income * K('paid_share') / 100
  - debt_keep: >-
      K('heavy_keep') if (debt_share > K('heavy_debt_share') and paid_heavy) else (K('middle_keep') if (debt_share > K('middle_debt_share')
      and (debt_share <= K('heavy_debt_share') or not paid_heavy)) else 1)
  - assets: F('liquid_assets_usd')
  - stmt_date: >-
      LATEST('assistance_transactions','posting_date', date_field='posting_date', event_type='assist_document_logged', document_type='BANK_STATEMENT',
      document_status='ACCEPTED')
  - stmt_fresh: stmt_date != None and DAYS(stmt_date, NOW) < K('statement_fresh_days')
  - asset_raise: >-
      std_cap + RND((assets - K('asset_floor')) * K('asset_raise_pct') / 100, 2) if (assets > K('asset_high') and stmt_fresh)
      else (MX(std_cap, RND(assets * K('asset_minimum_pct') / 100, 2)) if (assets > K('asset_floor') and (assets <= K('asset_high')
      or not stmt_fresh)) else std_cap)
  - cap_pct: MX(0, std_pct - size_cut - plan_cut - fixed_cut - cov_cut)
  - on_schedule: DAYS(K('schedule_effective_date'), NOW) >= 0
  - result: >-
      RND(MX(0, RND(income * cap_pct / 100 * debt_keep, 2) + asset_raise - std_cap), 2) if on_schedule else std_cap
  compute_basis:
    income: the annual household income recorded on the case
    std_pct: >-
      The standard hardship liability cap is hardship_liability_cap_income_pct percent of the annual household income recorded
      on the case, rounded half-up to the cent.
    std_cap: >-
      The standard hardship liability cap is hardship_liability_cap_income_pct percent of the annual household income recorded
      on the case, rounded half-up to the cent.
    members: the household size recorded on the case
    tax_return: a federal tax return has been accepted on the case
    size_cut: >-
      Household points are taken off for the household documented on an accepted federal tax return: when the household size
      recorded on the case is four or more and a federal tax return has been accepted on the case, cut_four_members points;
      when it is exactly three and a federal tax return has been accepted on the case, cut_three_members points; otherwise
      none.
    ss_letter: a Social Security award letter has been accepted on the case
    on_medicare: the patient holds an Original Medicare or Medicare Advantage claim
    fixed_cut: >-
      Fixed-income points are taken off for Social Security income: when a Social Security award letter has been accepted
      on the case and the patient holds an Original Medicare or Medicare Advantage claim, fixed_cut_retired points; when a
      Social Security award letter has been accepted on the case and the patient holds no such Medicare claim, fixed_cut_disability
      points; otherwise none.
    ct_recent: >-
      a coverage-terminated liability was posted on the patient's Riverbend accounts in the twelve whole months before the
      approval day
    billed_recent: no claim of the patient was billed to an insurer in the three whole months before it
    cov_cut: >-
      Coverage-loss points are taken off when an insurer ended the patient's coverage: when a coverage-terminated liability
      was posted on the patient's Riverbend accounts in the twelve whole months before the approval day and no claim of the
      patient was billed to an insurer in the three whole months before it, coverage_cut_uninsured points; when such a liability
      was posted in those twelve months and a claim was billed to an insurer in those three months, coverage_cut_reinsured
      points; otherwise none.
    debt: the qualifying medical debt recorded on the case
    debt_share: >-
      the medical-debt burden, the qualifying medical debt recorded on the case as a percent of the annual household income
      recorded on the case (a household with no recorded income carries no burden)
    paid_recent: >-
      the patient payments posted on the patient's Riverbend accounts in the twelve whole months before the approval day
    paid_heavy: those payments are above paid_share percent of the annual household income
    debt_keep: >-
      when the burden is above heavy_debt_share percent and those payments are above paid_share percent of the annual
      household income, heavy_keep of the scaled figure is kept; when the burden is above middle_debt_share percent and
      either at most heavy_debt_share percent or with those payments at most paid_share percent of the annual household
      income, middle_keep of the scaled figure is kept; when the burden is at most middle_debt_share percent, the whole
      scaled figure is kept.
    assets: The asset increment follows the documented liquid assets recorded on the case
    stmt_date: the bank statement accepted on the case (the latest accepted when several are)
    stmt_fresh: that statement was accepted fewer than statement_fresh_days days before the approval day
    asset_raise: >-
      when the documented liquid assets are above asset_high and that statement was accepted fewer than statement_fresh_days
      days before the approval day, the standard cap is raised by asset_raise_pct percent of the documented liquid assets
      above asset_floor, rounded half-up to the cent; when the documented liquid assets are above asset_floor and either at
      most asset_high or with no statement accepted fewer than statement_fresh_days days before the approval day, the standard
      cap is raised to asset_minimum_pct percent of the documented liquid assets, rounded half-up to the cent, when that is
      more than the standard cap; when the documented liquid assets are at most asset_floor, the standard cap stands; the
      asset increment is the raised cap less the standard cap.
    cap_pct: every reduction of the cap percent applies first (the cap percent never going below zero)
    result: >-
      The adjustments described below each change their own part of that standard figure and none depends on another, and
      they apply in this order: every reduction of the cap percent applies first (the cap percent never going below zero);
      the annual household income is then scaled at the resulting percent and every kept share is applied to that scaled
      figure, the product being rounded half-up to the cent; every addition applies last, and the cap is rounded half-up to
      the cent and is never below zero.
    plan_install: the installment the household already pays on the patient's active Riverbend payment plan
    install_share: measured as a percent of one twelfth of the annual household income recorded on the case
    plan_cut: >-
      Plan-burden points are taken off for the installment the household already pays on the patient's active Riverbend payment
      plan, measured as a percent of one twelfth of the annual household income recorded on the case: when that installment
      is above plan_burden_high percent, plan_cut_high points; when it is above plan_burden_low percent and at most plan_burden_high
      percent, plan_cut_low points; otherwise, including when the patient has no active plan or no income is recorded, none.
    on_schedule: >-
      For a Medical Hardship award determined on or after schedule_effective_date (2025-10-01), the date this schedule took
      effect, and only for such an award, the hardship liability cap is worked out as stated here; every other hardship cap
      remains hardship_liability_cap_income_pct of annual household income, rounded half-up to the cent.
  factors:
  - id: household_points
    effect: parameter
    decides: size_cut
    bindings:
    - members
    - tax_return
    - size_cut
    ladder:
    - when: four or more household members recorded and a federal tax return accepted on the case
      value: K('cut_four_members')
    - when: exactly three household members recorded and a federal tax return accepted on the case
      value: K('cut_three_members')
    - when: otherwise
      value: '0'
    baseline:
      size_cut: '0'
    evidence:
    - history
  - id: plan_burden_points
    effect: parameter
    decides: plan_cut
    bindings:
    - plan_install
    - install_share
    - plan_cut
    ladder:
    - when: >-
        the active plan's installment is above plan_burden_high percent of one twelfth of the household income
      value: plan_cut_high
    - when: it is above plan_burden_low and at most plan_burden_high percent
      value: plan_cut_low
    - when: otherwise (no active plan, a smaller installment, or no recorded income)
      value: '0'
    baseline:
      plan_cut: '0'
    evidence:
    - cross_category
    cross_difficulty: plan
  - id: fixed_income_points
    effect: parameter
    decides: fixed_cut
    bindings:
    - ss_letter
    - on_medicare
    - fixed_cut
    ladder:
    - when: >-
        a Social Security award letter accepted on the case and an Original Medicare or Medicare Advantage claim held
      value: K('fixed_cut_retired')
    - when: a Social Security award letter accepted on the case and no Medicare claim held
      value: K('fixed_cut_disability')
    - when: otherwise
      value: '0'
    baseline:
      fixed_cut: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: claim
  - id: coverage_points
    effect: parameter
    decides: cov_cut
    bindings:
    - ct_recent
    - billed_recent
    - cov_cut
    ladder:
    - when: >-
        a coverage-terminated liability in the twelve months and no claim billed to an insurer in the three months
      value: K('coverage_cut_uninsured')
    - when: >-
        a coverage-terminated liability in the twelve months and a claim billed to an insurer in the three months
      value: K('coverage_cut_reinsured')
    - when: otherwise
      value: '0'
    baseline:
      cov_cut: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: encounter
  - id: burden_share
    effect: parameter
    decides: debt_keep
    bindings:
    - debt
    - debt_share
    - paid_recent
    - paid_heavy
    - debt_keep
    ladder:
    - when: >-
        medical-debt burden above heavy_debt_share percent and Riverbend payments of the twelve months above paid_share percent
        of income
      value: K('heavy_keep')
    - when: >-
        burden above middle_debt_share percent and either at most heavy_debt_share percent or with payments at most paid_share
        percent of income
      value: K('middle_keep')
    - when: burden at most middle_debt_share percent
      value: '1'
    baseline:
      debt_keep: '1'
    evidence:
    - history
    - cross_category
    cross_difficulty: encounter
  - id: savings_increment
    effect: method
    decides: asset_raise
    bindings:
    - assets
    - stmt_date
    - stmt_fresh
    - asset_raise
    ladder:
    - when: >-
        documented liquid assets above asset_high and the bank statement accepted fewer than statement_fresh_days days before
      method: the standard cap plus asset_raise_pct percent of the documented liquid assets above asset_floor
    - when: >-
        documented liquid assets above asset_floor and either at most asset_high or with no statement fresher than statement_fresh_days
        days
      method: the larger of the standard cap and asset_minimum_pct percent of the documented liquid assets
    - when: documented liquid assets at most asset_floor
      method: the standard cap as it stands
    baseline:
      asset_raise: std_cap
    evidence:
    - history
    - date
  baseline:
    rule: >-
      The standard hardship liability cap is hardship_liability_cap_income_pct percent of the annual household income recorded
      on the case, rounded half-up to the cent.
    params:
    - hardship_liability_cap_income_pct
  inputs:
    history:
    - table: assistance_transactions
      aggregate: count
      field: fap_txn_id
      filters:
        event_type: assist_document_logged
        document_status: ACCEPTED
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: encounter_payment_posted
    - category: claim
      table: claim_transactions
      aggregate: count
      field: claim_txn_id
      within_months: 3
      filters:
        event_type: claim_billed
    cross_category:
    - plan
    - claim
    - encounter
- id: assist_ext_renewal_debt_claim
  base_policy_refs:
  - assist_agg_multi_holding
  - assist_tier_determination
  overwrite: []
  trigger: on_request
  subject:
  - assist_application_received
  computes: qualifying_medical_debt_usd
  target_tool: sign_renewal_debt_claim_3b9e07c1
  params:
    window_months: 12
  rule: >-
    A patient holding an approved Medical Hardship award may file a renewal application within award_renewal_window_days
    before that award's award_end_date; the renewal opens a new case, the renewal case, on the household size, annual
    household income and liquid assets documented on the expiring award, with the household percent recomputed against the
    HHS poverty guideline in force on the renewal's application date and the tier that percent points to, and with no
    medical debt recorded on it (0.00) until the patient signs the renewal's claim of medical debt. Only the patient signs
    that claim; the signed claim records on the renewal case the medical debt the renewal claims. The renewal claims only
    the patient's Riverbend bills, read from Riverbend's own records as of the signing day; the bills of any other provider
    are claimed only by sending them as outside medical bills and are not part of this claim. The medical debt a renewal
    claims is every patient liability posted on the patient's Riverbend accounts in the twelve whole months before the
    signing day, less every patient-balance adjustment posted in those same months. A posting belongs to those months when
    fewer than twelve whole months separate its posting date from the signing day; a whole month runs from a day of one
    month to the same day of the next month or, when the next month has no such day, to the first day of the month after it,
    so that a posting dated on the signing day's day of the month twelve months earlier is already outside. The renewal's
    claim is rounded half-up to the cent and is never below zero. The adjustments described below each take their own amount
    off that standard figure and none depends on another; the renewal's claim is the standard figure less every amount they
    take off. The claim under appeal is the claim named by the most recent appeal filed on any of the patient's claims (on a
    same-day tie, the appeal listed first in the claim activity), while that claim is in appealed status; when that claim
    has left appealed status, there is no claim under appeal. Insurer cost sharing on the claim under appeal is taken off:
    when the most recent appeal is a member appeal filed under the patient's authorization and its claim is the claim under
    appeal, the deductible, coinsurance and copay liabilities of those months posted from that claim are taken off; when the
    most recent appeal is of any other type and its claim is the claim under appeal, only the coinsurance liabilities of
    those months posted from that claim are taken off; otherwise nothing is taken off for an appeal. The held account is the
    patient's account on a billing hold for a charge dispute or, when no account is on such a hold, the account on a billing
    hold for an itemization review (when several accounts qualify, the one listed first among the patient's accounts). A
    billing hold on the held account takes off the amount in question on it, leaving aside every liability posted from the
    claim under appeal: when the held account is on a charge-dispute hold, the charge of the disputed line is taken off, but
    never more than the held account's patient liabilities of those months, the disputed line being the charge line named by
    the most recent charge-dispute inquiry on the held account (on a tie in creation time, the inquiry listed first; when no
    such inquiry names a charge line, that charge is 0.00); when the held account is on an itemization-review hold, its
    coinsurance liabilities of those months are taken off; otherwise nothing is taken off for a hold. The coverage-gap
    account is the account carrying the patient's most recent coverage-terminated liability (an amount an insurer released
    because coverage had ended before the date of service; on a same-day tie, the liability listed first in the account
    activity). Its coverage-terminated balance is its coverage-terminated liabilities of those months less every uninsured
    discount of those months posted on the coverage-gap account (a discount granted on those liabilities after coverage
    ended included), and that balance is taken off in one of three ways: when the patient holds a BadgerCare Plus claim, all
    of that balance is taken off; when the patient holds no BadgerCare Plus claim, a BadgerCare Plus determination notice
    has been accepted on the renewal case, and the coverage-gap account is coded emergency or medically necessary, the part
    of that balance above the amounts-generally-billed share of those liabilities, agb_pct percent of them rounded half-up
    to the cent, is taken off, nothing coming off a balance already at or below that share; otherwise, including when the
    coverage-gap account is coded elective, nothing is taken off for them. Coverage-terminated liabilities on any other
    account stand as posted. The self-pay good faith estimate is the patient's self-pay good faith estimate (single
    scheduled service, procedure with co-providers, or recurring course of care) that is in dispute or, when none is, one
    whose service has been completed; when several qualify, the variant in that order and, within it, the estimate listed
    first among the patient's estimates. Its billed charges are the self-pay final-bill liabilities of those months on the
    account it is linked to, less the uninsured discounts of those months on that account; its expected charges are the
    convening-facility and convening-professional lines of its current version. A bill open to dispute under that estimate
    is taken off: when the estimate is in dispute, its billed charges are taken off; when its service has been completed,
    its billed charges exceed its expected charges by at least ppdr_threshold_usd of its tier, and no more than
    ppdr_initiation_days of its tier separate its initial bill date from the signing day (counted from the day after the
    initial bill date), the amount by which its billed charges exceed its expected charges is taken off; otherwise,
    including when no initial bill date is recorded, nothing is taken off for an estimate.
  prerequisite: []
  cross_category:
  - category: encounter
    as: history
    reads:
    - encounter_transactions.amount
    - encounter_transactions.liability_source
    - encounter_transactions.adjustment_code
    - encounter_transactions.claim_id
    - encounter_transactions.encounter_id
    - encounter_billing_inquiries.disputed_txn_id
    - encounter_id
    - billing_hold_reason
    - service_classification
    note: >-
      the twelve months' liabilities and adjustments, the held account and its disputed line, and the estimate's linked account
      read the hospital-account ledger, inquiries and accounts.
  - category: claim
    as: branch
    reads:
    - claim_transactions.claim_id
    - claim_transactions.appeal_type
    - status
    - variant_name
    note: >-
      the appeal take-off reads the most recent appeal and its claim's status; the coverage-terminated take-off reads whether
      a BadgerCare Plus claim is held.
  - category: estimate
    as: branch
    reads:
    - variant_name
    - status
    - encounter_id
    - initial_bill_date
    - estimate_version
    - estimate_transactions.amount
    - estimate_transactions.provider_role
    note: >-
      the estimate take-off reads the self-pay good faith estimate, its convening lines and its tier's dispute threshold and
      window.
  compute:
  - liab_all: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted')
  - adj_all: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_adjustment_posted')
  - std_claim: liab_all - adj_all
  - appeal_claim: >-
      XLATEST('claim','claim_transactions','claim_id', date_field='posting_date', event_type='claim_appeal_filed')
  - appeal_open: appeal_claim != None and CFIELD('claim','status', claim_id=appeal_claim) == 'appealed'
  - dispute_acct: CFIELD('encounter','encounter_id', billing_hold_reason='CHARGE_DISPUTE')
  - review_acct: CFIELD('encounter','encounter_id', billing_hold_reason='ITEMIZATION_REVIEW')
  - held_acct: dispute_acct if dispute_acct != None else review_acct
  - appeal_kind: >-
      XLATEST('claim','claim_transactions','appeal_type', date_field='posting_date', event_type='claim_appeal_filed')
  - appeal_coi: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COINSURANCE', claim_id=appeal_claim)
  - appeal_cs: >-
      appeal_coi + XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_liability_posted', liability_source='DEDUCTIBLE', claim_id=appeal_claim) + XSUM('encounter','encounter_transactions','amount',
      within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted', liability_source='COPAY',
      claim_id=appeal_claim)
  - appeal_hold: >-
      appeal_cs if (appeal_open and appeal_kind == 'MEMBER_APPEAL_WITH_AOR') else (appeal_coi if (appeal_open and appeal_kind
      != 'MEMBER_APPEAL_WITH_AOR') else 0)
  - disputed_line: >-
      XLATEST('encounter','encounter_billing_inquiries','disputed_txn_id', date_field='created_at', encounter_id=held_acct,
      inquiry_type='CHARGE_DISPUTE')
  - line_charge: >-
      XSUM('encounter','encounter_transactions','amount', event_type='encounter_charge_posted', encounter_txn_id=disputed_line)
  - held_liab: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      encounter_id=held_acct) - (XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_liability_posted', encounter_id=held_acct, claim_id=appeal_claim) if appeal_open else 0)
  - held_coi: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COINSURANCE', encounter_id=held_acct) - (XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'),
      date_field='posting_date', event_type='encounter_liability_posted', liability_source='COINSURANCE', encounter_id=held_acct,
      claim_id=appeal_claim) if appeal_open else 0)
  - hold_out: MN(line_charge, held_liab) if dispute_acct != None else (held_coi if review_acct != None else 0)
  - ct_acct: >-
      XLATEST('encounter','encounter_transactions','encounter_id', date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COVERAGE_TERMINATED')
  - ct_liab: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COVERAGE_TERMINATED', encounter_id=ct_acct)
  - has_bcp: EXISTS('claim', variant_name='BadgerCare Plus (Wisconsin Medicaid) Claim')
  - bcp_notice: >-
      COUNT('assistance_transactions', event_type='assist_document_logged', document_type='MEDICAID_DETERMINATION_NOTICE',
      document_status='ACCEPTED') > 0
  - ct_disc: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_adjustment_posted',
      adjustment_code='UNINSURED_DISCOUNT', encounter_id=ct_acct)
  - ct_necessary: >-
      ct_acct != None and CFIELD('encounter','service_classification', encounter_id=ct_acct) != 'ELECTIVE_NON_COVERED'
  - ct_off: >-
      (ct_liab - ct_disc) if has_bcp else (MX(0, ct_liab - ct_disc - RND(ct_liab * P('agb_pct') / 100, 2)) if (bcp_notice
      and ct_necessary) else 0)
  - gfe_id: >-
      CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='in_dispute')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='in_dispute')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='in_dispute')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='service_completed')
  - gfe_status: CFIELD('estimate','status', estimate_id=gfe_id)
  - gfe_acct: CFIELD('estimate','encounter_id', estimate_id=gfe_id)
  - gfe_billed: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=gfe_acct) - XSUM('encounter','encounter_transactions','amount',
      within_months=K('window_months'), date_field='posting_date', event_type='encounter_adjustment_posted', adjustment_code='UNINSURED_DISCOUNT',
      encounter_id=gfe_acct)
  - gfe_expected: >-
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=gfe_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=gfe_id), provider_role='CONVENING_FACILITY') + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded',
      estimate_id=gfe_id, estimate_version=CFIELD('estimate','estimate_version', estimate_id=gfe_id), provider_role='CONVENING_PROFESSIONAL')
  - gfe_bill_date: CFIELD('estimate','initial_bill_date', estimate_id=gfe_id)
  - gfe_open: >-
      gfe_bill_date != None and gfe_bill_date != '' and DAYS(gfe_bill_date, NOW) <= CPARAM('estimate','ppdr_initiation_days',
      estimate_id=gfe_id)
  - gfe_off: >-
      gfe_billed if gfe_status == 'in_dispute' else ((gfe_billed - gfe_expected) if (gfe_status == 'service_completed' and
      gfe_billed - gfe_expected >= CPARAM('estimate','ppdr_threshold_usd', estimate_id=gfe_id) and gfe_open) else 0)
  - result: RND(MX(0, std_claim - appeal_hold - hold_out - ct_off - gfe_off), 2)
  compute_basis:
    liab_all: >-
      every patient liability posted on the patient's Riverbend accounts in the twelve whole months before the signing day
    adj_all: less every patient-balance adjustment posted in those same months
    std_claim: >-
      The medical debt a renewal claims is every patient liability posted on the patient's Riverbend accounts in the twelve
      whole months before the signing day, less every patient-balance adjustment posted in those same months.
    appeal_claim: >-
      The claim under appeal is the claim named by the most recent appeal filed on any of the patient's claims (on a same-day
      tie, the appeal listed first in the claim activity), while that claim is in appealed status
    appeal_open: >-
      while that claim is in appealed status; when that claim has left appealed status, there is no claim under appeal.
    dispute_acct: The held account is the patient's account on a billing hold for a charge dispute
    review_acct: >-
      when no account is on such a hold, the account on a billing hold for an itemization review (when several accounts qualify,
      the one listed first among the patient's accounts)
    held_acct: >-
      The held account is the patient's account on a billing hold for a charge dispute or, when no account is on such a hold,
      the account on a billing hold for an itemization review (when several accounts qualify, the one listed first among the
      patient's accounts).
    appeal_kind: when the most recent appeal is a member appeal filed under the patient's authorization
    appeal_coi: only the coinsurance liabilities of those months posted from that claim are taken off
    appeal_cs: >-
      the deductible, coinsurance and copay liabilities of those months posted from that claim are taken off
    appeal_hold: >-
      Insurer cost sharing on the claim under appeal is taken off: when the most recent appeal is a member appeal filed under
      the patient's authorization and its claim is the claim under appeal, the deductible, coinsurance and copay liabilities
      of those months posted from that claim are taken off; when the most recent appeal is of any other type and its claim
      is the claim under appeal, only the coinsurance liabilities of those months posted from that claim are taken off; otherwise
      nothing is taken off for an appeal.
    disputed_line: >-
      the disputed line being the charge line named by the most recent charge-dispute inquiry on the held account (on a tie
      in creation time, the inquiry listed first; when no such inquiry names a charge line, that charge is 0.00)
    line_charge: the charge of the disputed line is taken off
    held_liab: but never more than the held account's patient liabilities of those months
    held_coi: >-
      when the held account is on an itemization-review hold, its coinsurance liabilities of those months are taken off
    hold_out: >-
      A billing hold on the held account takes off the amount in question on it, leaving aside every liability posted from
      the claim under appeal: when the held account is on a charge-dispute hold, the charge of the disputed line is taken
      off, but never more than the held account's patient liabilities of those months, the disputed line being the charge
      line named by the most recent charge-dispute inquiry on the held account (on a tie in creation time, the inquiry listed
      first; when no such inquiry names a charge line, that charge is 0.00); when the held account is on an itemization-review
      hold, its coinsurance liabilities of those months are taken off; otherwise nothing is taken off for a hold.
    ct_liab: >-
      Its coverage-terminated balance is its coverage-terminated liabilities of those months
    has_bcp: >-
      when the patient holds a BadgerCare Plus claim, all of that balance is taken off
    bcp_notice: a BadgerCare Plus determination notice has been accepted on the renewal case
    ct_disc: >-
      less every uninsured discount of those months posted on the coverage-gap account (a discount granted on those liabilities after
      coverage ended included)
    ct_off: >-
      Its coverage-terminated balance is its coverage-terminated liabilities of those months less every uninsured discount
      of those months posted on the coverage-gap account (a discount granted on those liabilities after coverage ended
      included), and that balance is taken off in one of three ways: when the patient holds a BadgerCare Plus claim, all of
      that balance is taken off; when the patient holds no BadgerCare Plus claim, a BadgerCare Plus determination notice has
      been accepted on the renewal case, and the coverage-gap account is coded emergency or medically necessary, the part of
      that balance above the amounts-generally-billed share of those liabilities, agb_pct percent of them rounded half-up to
      the cent, is taken off, nothing coming off a balance already at or below that share; otherwise, including when the
      coverage-gap account is coded elective, nothing is taken off for them.
    gfe_id: >-
      The self-pay good faith estimate is the patient's self-pay good faith estimate (single scheduled service, procedure
      with co-providers, or recurring course of care) that is in dispute or, when none is, one whose service has been completed;
      when several qualify, the variant in that order and, within it, the estimate listed first among the patient's estimates.
    gfe_status: >-
      when the estimate is in dispute, its billed charges are taken off; when its service has been completed
    gfe_acct: on the account it is linked to
    gfe_billed: >-
      Its billed charges are the self-pay final-bill liabilities of those months on the account it is linked to, less the
      uninsured discounts of those months on that account
    gfe_expected: >-
      its expected charges are the convening-facility and convening-professional lines of its current version
    gfe_bill_date: otherwise, including when no initial bill date is recorded, nothing is taken off for an estimate.
    gfe_open: >-
      no more than ppdr_initiation_days of its tier separate its initial bill date from the signing day (counted from the
      day after the initial bill date)
    gfe_off: >-
      A bill open to dispute under that estimate is taken off: when the estimate is in dispute, its billed charges are taken
      off; when its service has been completed, its billed charges exceed its expected charges by at least ppdr_threshold_usd
      of its tier, and no more than ppdr_initiation_days of its tier separate its initial bill date from the signing day (counted
      from the day after the initial bill date), the amount by which its billed charges exceed its expected charges is taken
      off; otherwise, including when no initial bill date is recorded, nothing is taken off for an estimate.
    result: >-
      The adjustments described below each take their own amount off that standard figure and none depends on another; the
      renewal's claim is the standard figure less every amount they take off.
    ct_acct: >-
      The coverage-gap account is the account carrying the patient's most recent coverage-terminated liability (an amount
      an insurer released because coverage had ended before the date of service; on a same-day tie, the liability listed first
      in the account activity).
    ct_necessary: the coverage-gap account is coded emergency or medically necessary
  factors:
  - id: renewal_appeal_holdout
    effect: parameter
    decides: appeal_hold
    bindings:
    - appeal_kind
    - appeal_coi
    - appeal_cs
    - appeal_hold
    ladder:
    - when: >-
        the most recent appeal is a member appeal filed under the patient's authorization and its claim is still in appealed
        status
      value: >-
        the deductible, coinsurance and copay liabilities of the twelve months posted from that claim, taken off
    - when: the most recent appeal is of any other type and its claim is still in appealed status
      value: the coinsurance liabilities of the twelve months posted from that claim, taken off
    - when: otherwise (no appeal, or its claim has left appealed status)
      value: '0'
    baseline:
      appeal_hold: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: claim
  - id: renewal_hold_holdout
    effect: method
    decides: hold_out
    bindings:
    - dispute_acct
    - review_acct
    - held_acct
    - disputed_line
    - line_charge
    - held_liab
    - held_coi
    - hold_out
    ladder:
    - when: an account is on a billing hold for a charge dispute
      method: >-
        the charge of the line the latest charge-dispute inquiry on it names, capped at the account's patient liabilities
        of the twelve months (claim-under-appeal postings left aside): the smaller of two different record amounts
    - when: no account is on a charge-dispute hold and an account is on a billing hold for an itemization review
      method: >-
        that account's coinsurance liabilities of the twelve months (claim-under-appeal postings left aside): a windowed sum
    - when: otherwise (no account on either hold)
      method: nothing taken off
    baseline:
      hold_out: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: encounter
  - id: renewal_coverage_gap
    effect: parameter
    decides: ct_off
    bindings:
    - ct_acct
    - ct_liab
    - ct_disc
    - has_bcp
    - bcp_notice
    - ct_necessary
    - ct_off
    ladder:
    - when: the patient holds a BadgerCare Plus claim
      value: >-
        the coverage-gap account's coverage-terminated balance (its coverage-terminated liabilities of the twelve months
        less every uninsured discount of the twelve months posted on that account), taken off
    - when: >-
        no BadgerCare Plus claim, a BadgerCare Plus determination notice accepted on the renewal case, and the coverage-gap
        account coded emergency or medically necessary
      value: >-
        the part of that balance above the amounts-generally-billed share (agb_pct percent) of those liabilities, taken off,
        nothing when the balance is at or below that share
    - when: otherwise (including a coverage-gap account coded elective)
      value: '0'
    baseline:
      ct_off: '0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: claim
  - id: renewal_gfe_dispute
    effect: parameter
    decides: gfe_off
    bindings:
    - gfe_id
    - gfe_status
    - gfe_acct
    - gfe_billed
    - gfe_expected
    - gfe_bill_date
    - gfe_open
    - gfe_off
    ladder:
    - when: the self-pay good faith estimate is in dispute
      value: its billed charges, taken off
    - when: >-
        its service has been completed, its billed charges exceed its expected charges by at least ppdr_threshold_usd and
        the dispute window (ppdr_initiation_days from the initial bill date) is still open
      value: the excess of its billed over its expected charges, taken off
    - when: otherwise (no such estimate, a smaller excess, the window closed, or no initial bill date)
      value: '0'
    baseline:
      gfe_off: '0'
    evidence:
    - history
    - cross_category
    - date
    - tier_param
    cross_difficulty: estimate
  baseline:
    rule: >-
      The medical debt a renewal claims is every patient liability posted on the patient's Riverbend accounts in the twelve
      whole months before the signing day, less every patient-balance adjustment posted in those same months. A posting belongs
      to those months when fewer than twelve whole months separate its posting date from the signing day; a whole month runs
      from a day of one month to the same day of the next month or, when the next month has no such day, to the first day
      of the month after it, so that a posting dated on the signing day's day of the month twelve months earlier is already
      outside. The renewal's claim is rounded half-up to the cent and is never below zero.
    params:
    - window_months
  inputs:
    history:
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: encounter_liability_posted
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: encounter_adjustment_posted
    - category: claim
      table: claim_transactions
      aggregate: latest
      field: claim_id
      filters:
        event_type: claim_appeal_filed
    - table: assistance_transactions
      aggregate: count
      field: fap_txn_id
      filters:
        event_type: assist_document_logged
        document_type: MEDICAID_DETERMINATION_NOTICE
        document_status: ACCEPTED
    cross_category:
    - encounter
    - claim
    - estimate
- id: assist_ext_response_window
  base_policy_refs:
  - assist_completeness_and_documents
  - assist_notices
  overwrite:
  - base_policy: assist_completeness_and_documents
    superseded_clause: documents_due_date is the notice date plus missing_information_response_days calendar days
    replaced_by: >-
      For the missing-information notice of a renewal application, and only for such a notice, the documents due date is the
      notice date plus the response days worked out as stated here, counted in calendar days starting the day after the notice
      date; every other missing-information notice keeps a documents due date of the notice date plus missing_information_response_days
      calendar days.
  trigger: state_due
  subject:
  - assist_documents_requested
  computes: response_days
  target_tool: send_missing_information_notice_7f5665e5
  params:
    window_months: 12
    quarter_share_pct: 25.0
    outside_days_far: 21
    outside_days: 15
    care_days_near: 14
    care_days_recent: 7
    care_near_days: 14
    care_recent_days: 30
    appeal_days_member: 10
    appeal_days_other: 5
    accounts_many: 5
    accounts_several: 3
    accounts_days_many: 10
    accounts_days_several: 5
    pending_days_submitted: 10
    pending_days_accepted: 5
  rule: >-
    A renewal application that lacks any document type in its tier's required_document_types receives a missing-information
    notice listing each missing document, and the renewal case moves to pending documents. For the missing-information notice
    of a renewal application, and only for such a notice, the documents due date is the notice date plus the response days
    worked out as stated here, counted in calendar days starting the day after the notice date; every other missing-information
    notice keeps a documents due date of the notice date plus missing_information_response_days calendar days. The missing-information
    notice of a renewal is sent only after the renewal case records the medical debt the renewal claims. The standard response
    days are missing_information_response_days calendar days. The adjustments described below each change their own part of
    that standard figure and none depends on another; a replacement of the standard figure applies first and every added day
    count is then added to it. The latest first statement is the latest first post-discharge summary statement (statement
    cycle 1) issued on any of the patient's Riverbend accounts, and its age is counted in calendar days from its statement
    date to the notice date. The application-period adjustment replaces the standard figure in one of three ways: when the
    latest first statement is no older than notification_period_days days, the base days are the days left of its application
    period (application_period_days less its age) plus missing_information_response_days, the standard window running on after
    that period; when it is older than notification_period_days days and no older than application_period_days days, the base
    days are the larger of missing_information_response_days and the days left of its application period (application_period_days
    less its age); otherwise, or when no first statement has been issued, the base days are missing_information_response_days.
    Days are added when the renewal's Riverbend claim alone does not establish the hardship share and no outside medical bills
    document has been logged as received on the renewal case, so that outside medical bills still to be gathered decide the
    test. The hardship share is hardship_medical_debt_income_pct percent of the annual household income recorded on the renewal
    case. When no outside medical bills document has been logged as received on the renewal case and the medical debt claimed
    on it is below quarter_share_pct percent of the hardship share, outside_days_far days are added; when none has been logged
    as received and the claim is at least quarter_share_pct percent of the hardship share and at most the hardship share,
    outside_days days are added; otherwise none are added for outside bills. Days are added while an insurer has yet to decide
    a claim of the patient, the explanation of benefits being part of what documents the patient's medical debt: when a claim
    of the patient is in submitted status, not yet accepted by its payer, pending_days_submitted days are added; when no claim
    is in submitted status and a claim is in accepted status, awaiting adjudication, pending_days_accepted days are added;
    otherwise none are added for pending claims. Days are added for a patient still in treatment, read from the latest date
    of service on any charge line of the patient's Riverbend accounts: when that date is no more than care_near_days days
    before the notice date (a date of service on or after the notice date included), care_days_near days are added; when it
    is more than care_near_days and no more than care_recent_days days before the notice date, care_days_recent days are added;
    otherwise, including when no charge line is posted, none are added for treatment. Days are added while an insurer appeal
    is in progress, the claim under appeal being the claim named by the most recent appeal filed on any of the patient's claims
    (on a same-day tie, the appeal listed first in the claim activity) while that claim is in appealed status: when that most
    recent appeal is a member appeal filed under the patient's authorization and its claim is in appealed status, appeal_days_member
    days are added; when it is of any other type and its claim is in appealed status, appeal_days_other days are added; otherwise
    none are added for an appeal. Days are added for the number of the patient's Riverbend accounts the renewal reaches, counted
    as the first post-discharge summary statements issued on the patient's accounts in the twelve whole months before the
    notice date; for the account count, a statement belongs to those months when fewer than twelve whole months separate its
    statement date from the notice date, a whole month running from a day of one month to the same day of the next month or,
    when the next month has no such day, to the first day of the month after it: accounts_many or more, accounts_days_many
    days are added; at least accounts_several and fewer than accounts_many, accounts_days_several days are added; fewer than
    accounts_several, none are added for accounts.
  prerequisite:
  - problem: assist_ext_renewal_debt_claim
    kind: value_input
    gate: outside_add
    form: state
    policy_source: >-
      The missing-information notice of a renewal is sent only after the renewal case records the medical debt the renewal
      claims.
    condition: >-
      The renewal case's qualifying_medical_debt_usd records the medical debt the renewal claims, which the patient's signed
      claim of medical debt puts there (the field is 0.00 until then).
    resolved_by: sign_renewal_debt_claim_3b9e07c1
    effect: >-
      Once the renewal case records its claimed debt, the outside-bills days are read from that claim against the hardship
      share of the recorded income.
  cross_category:
  - category: encounter
    as: history
    reads:
    - encounter_transactions.posting_date
    - encounter_transactions.statement_type
    - encounter_transactions.statement_cycle
    - encounter_transactions.service_date
    - encounter_transactions.event_type
    note: >-
      the application-period base days and the account count read first summary statements; the treatment days read the latest
      date of service on a charge line.
  - category: claim
    as: history
    reads:
    - claim_transactions.appeal_type
    - claim_transactions.claim_id
    - status
    note: >-
      the appeal days read the most recent appeal and its claim's status; the pending-claim days read claims awaiting a payer
      decision.
  compute:
  - base_days: P('missing_information_response_days')
  - first_stmt: >-
      XLATEST('encounter','encounter_transactions','posting_date', date_field='posting_date', event_type='encounter_statement_issued',
      statement_type='SUMMARY_STATEMENT', statement_cycle=1)
  - stmt_age: DAYS(first_stmt, NOW) if first_stmt != None else 0
  - days_left: P('application_period_days') - stmt_age
  - base_part: >-
      (days_left + base_days) if (first_stmt != None and stmt_age <= P('notification_period_days')) else (MX(base_days, days_left)
      if (first_stmt != None and stmt_age > P('notification_period_days') and stmt_age <= P('application_period_days')) else
      base_days)
  - claim_amt: F('qualifying_medical_debt_usd')
  - claim_short: claim_amt <= F('annual_household_income_usd') * P('hardship_medical_debt_income_pct') / 100
  - outside_none: >-
      COUNT('assistance_transactions', event_type='assist_document_logged', document_type='OUTSIDE_MEDICAL_BILLS', document_status='RECEIVED')
      == 0
  - claim_far: >-
      claim_amt < F('annual_household_income_usd') * P('hardship_medical_debt_income_pct') / 100 * K('quarter_share_pct')
      / 100
  - outside_add: >-
      K('outside_days_far') if (outside_none and claim_far) else (K('outside_days') if (outside_none and claim_short and not
      claim_far) else 0)
  - claim_submitted: EXISTS('claim', status='submitted')
  - claim_accepted: EXISTS('claim', status='accepted')
  - pending_add: >-
      K('pending_days_submitted') if claim_submitted else (K('pending_days_accepted') if claim_accepted else 0)
  - last_service: >-
      XLATEST('encounter','encounter_transactions','service_date', date_field='service_date', event_type='encounter_charge_posted')
  - care_gap: DAYS(last_service, NOW) if last_service != None else 9999
  - care_add: >-
      K('care_days_near') if care_gap <= K('care_near_days') else (K('care_days_recent') if care_gap <= K('care_recent_days')
      else 0)
  - appeal_claim: >-
      XLATEST('claim','claim_transactions','claim_id', date_field='posting_date', event_type='claim_appeal_filed')
  - appeal_kind: >-
      XLATEST('claim','claim_transactions','appeal_type', date_field='posting_date', event_type='claim_appeal_filed')
  - appeal_open: appeal_claim != None and CFIELD('claim','status', claim_id=appeal_claim) == 'appealed'
  - appeal_add: >-
      K('appeal_days_member') if (appeal_open and appeal_kind == 'MEMBER_APPEAL_WITH_AOR') else (K('appeal_days_other') if
      (appeal_open and appeal_kind != 'MEMBER_APPEAL_WITH_AOR') else 0)
  - accounts: >-
      XCOUNT('encounter','encounter_transactions', within_months=K('window_months'), date_field='posting_date', event_type='encounter_statement_issued',
      statement_type='SUMMARY_STATEMENT', statement_cycle=1)
  - accounts_add: >-
      K('accounts_days_many') if accounts >= K('accounts_many') else (K('accounts_days_several') if accounts >= K('accounts_several')
      else 0)
  - result: int(base_part + outside_add + pending_add + care_add + appeal_add + accounts_add)
  compute_basis:
    base_days: The standard response days are missing_information_response_days calendar days.
    first_stmt: >-
      The latest first statement is the latest first post-discharge summary statement (statement cycle 1) issued on any of
      the patient's Riverbend accounts
    stmt_age: its age is counted in calendar days from its statement date to the notice date
    days_left: the days left of its application period (application_period_days less its age)
    base_part: >-
      The application-period adjustment replaces the standard figure in one of three ways: when the latest first statement
      is no older than notification_period_days days, the base days are the days left of its application period (application_period_days
      less its age) plus missing_information_response_days, the standard window running on after that period; when it is older
      than notification_period_days days and no older than application_period_days days, the base days are the larger of missing_information_response_days
      and the days left of its application period (application_period_days less its age); otherwise, or when no first statement
      has been issued, the base days are missing_information_response_days.
    claim_amt: the medical debt claimed on it
    claim_short: and at most the hardship share
    outside_none: no outside medical bills document has been logged as received on the renewal case
    claim_far: the medical debt claimed on it is below quarter_share_pct percent of the hardship share
    outside_add: >-
      When no outside medical bills document has been logged as received on the renewal case and the medical debt claimed
      on it is below quarter_share_pct percent of the hardship share, outside_days_far days are added; when none has been
      logged as received and the claim is at least quarter_share_pct percent of the hardship share and at most the hardship
      share, outside_days days are added; otherwise none are added for outside bills.
    last_service: the latest date of service on any charge line of the patient's Riverbend accounts
    care_gap: >-
      when that date is no more than care_near_days days before the notice date (a date of service on or after the notice
      date included)
    care_add: >-
      Days are added for a patient still in treatment, read from the latest date of service on any charge line of the patient's
      Riverbend accounts: when that date is no more than care_near_days days before the notice date (a date of service on
      or after the notice date included), care_days_near days are added; when it is more than care_near_days and no more than
      care_recent_days days before the notice date, care_days_recent days are added; otherwise, including when no charge line
      is posted, none are added for treatment.
    appeal_claim: >-
      the claim under appeal being the claim named by the most recent appeal filed on any of the patient's claims (on a same-day
      tie, the appeal listed first in the claim activity) while that claim is in appealed status
    appeal_kind: when that most recent appeal is a member appeal filed under the patient's authorization
    appeal_open: its claim is in appealed status
    appeal_add: >-
      when that most recent appeal is a member appeal filed under the patient's authorization and its claim is in appealed
      status, appeal_days_member days are added; when it is of any other type and its claim is in appealed status, appeal_days_other
      days are added; otherwise none are added for an appeal.
    accounts: >-
      counted as the first post-discharge summary statements issued on the patient's accounts in the twelve whole months before
      the notice date; for the account count, a statement belongs to those months when fewer than twelve whole months separate
      its statement date from the notice date, a whole month running from a day of one month to the same day of the next month
      or, when the next month has no such day, to the first day of the month after it
    accounts_add: >-
      accounts_many or more, accounts_days_many days are added; at least accounts_several and fewer than accounts_many, accounts_days_several
      days are added; fewer than accounts_several, none are added for accounts.
    result: >-
      The adjustments described below each change their own part of that standard figure and none depends on another; a replacement
      of the standard figure applies first and every added day count is then added to it.
    claim_submitted: when a claim of the patient is in submitted status, not yet accepted by its payer
    claim_accepted: when no claim is in submitted status and a claim is in accepted status, awaiting adjudication
    pending_add: >-
      Days are added while an insurer has yet to decide a claim of the patient, the explanation of benefits being part of
      what documents the patient's medical debt: when a claim of the patient is in submitted status, not yet accepted by its
      payer, pending_days_submitted days are added; when no claim is in submitted status and a claim is in accepted status,
      awaiting adjudication, pending_days_accepted days are added; otherwise none are added for pending claims.
  factors:
  - id: period_reach
    effect: method
    decides: base_part
    bindings:
    - first_stmt
    - stmt_age
    - days_left
    - base_part
    ladder:
    - when: the latest first statement is no older than notification_period_days days
      method: >-
        application_period_days less its age, plus missing_information_response_days (the countdown to the end of the application
        period, extended by the standard window)
    - when: it is older than notification_period_days and no older than application_period_days days
      method: >-
        the larger of missing_information_response_days and application_period_days less its age (a floored countdown to the
        end of the application period)
    - when: otherwise, or no first statement
      method: missing_information_response_days (a constant)
    baseline:
      base_part: base_days
    evidence:
    - cross_category
    - date
    cross_difficulty: encounter
  - id: outside_bills_days
    effect: parameter
    decides: outside_add
    bindings:
    - claim_amt
    - claim_short
    - outside_none
    - claim_far
    - outside_add
    ladder:
    - when: >-
        no outside medical bills received on the renewal case and the claimed debt below quarter_share_pct percent of the
        hardship share
      value: K('outside_days_far')
    - when: >-
        no outside medical bills received on the renewal case and the claimed debt at least quarter_share_pct percent of the
        hardship share and at most the hardship share
      value: K('outside_days')
    - when: otherwise (outside medical bills received, or the claimed debt above the hardship share)
      value: '0'
    baseline:
      outside_add: '0'
    evidence:
    - history
    - tier_param
  - id: pending_claim_days
    effect: parameter
    decides: pending_add
    bindings:
    - claim_submitted
    - claim_accepted
    - pending_add
    ladder:
    - when: a claim of the patient in submitted status
      value: K('pending_days_submitted')
    - when: no submitted claim and a claim in accepted status
      value: K('pending_days_accepted')
    - when: otherwise
      value: '0'
    baseline:
      pending_add: '0'
    evidence:
    - cross_category
    cross_difficulty: claim
  - id: treatment_days
    effect: parameter
    decides: care_add
    bindings:
    - last_service
    - care_gap
    - care_add
    ladder:
    - when: the latest date of service is no more than care_near_days days before the notice date
      value: K('care_days_near')
    - when: the latest date of service is more than care_near_days and no more than care_recent_days days before
      value: K('care_days_recent')
    - when: otherwise
      value: '0'
    baseline:
      care_add: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: encounter
  - id: appeal_days
    effect: parameter
    decides: appeal_add
    bindings:
    - appeal_claim
    - appeal_kind
    - appeal_open
    - appeal_add
    ladder:
    - when: >-
        the most recent appeal is a member appeal under the patient's authorization and its claim is in appealed status
      value: K('appeal_days_member')
    - when: the most recent appeal is of another type and its claim is in appealed status
      value: K('appeal_days_other')
    - when: otherwise
      value: '0'
    baseline:
      appeal_add: '0'
    evidence:
    - cross_category
    cross_difficulty: claim
  - id: account_count_days
    effect: parameter
    decides: accounts_add
    bindings:
    - accounts
    - accounts_add
    ladder:
    - when: accounts_many or more first summary statements in the twelve months
      value: K('accounts_days_many')
    - when: at least accounts_several and fewer than accounts_many
      value: K('accounts_days_several')
    - when: fewer than accounts_several
      value: '0'
    baseline:
      accounts_add: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: encounter
  baseline:
    rule: The standard response days are missing_information_response_days calendar days.
    params:
    - missing_information_response_days
  inputs:
    history:
    - category: encounter
      table: encounter_transactions
      aggregate: latest
      field: posting_date
      filters:
        event_type: encounter_statement_issued
        statement_type: SUMMARY_STATEMENT
        statement_cycle: 1
    - category: encounter
      table: encounter_transactions
      aggregate: count
      field: encounter_txn_id
      within_months: 12
      filters:
        event_type: encounter_statement_issued
        statement_type: SUMMARY_STATEMENT
        statement_cycle: 1
    - category: claim
      table: claim_transactions
      aggregate: latest
      field: claim_id
      filters:
        event_type: claim_appeal_filed
    cross_category:
    - encounter
    - claim
