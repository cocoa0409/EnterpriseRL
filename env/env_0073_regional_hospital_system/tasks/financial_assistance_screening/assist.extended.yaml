events:
- type: assist_application_received
  target: assistance_cases
  mutation: create
  meaning: >-
    A signed financial assistance application (or a presumptive screen result) is received and a case opens.
  grain: one row per application or presumptive screen
  fields:
    fap_case_id: new case id
    customer_id: the patient
    variant_name: tier the screened FPL percent points to
    application_date: receipt date
    application_channel: channel
    presumptive_basis: presumptive evidence or NONE
    household_size: attested household size
    annual_household_income_usd: annualized income
    household_fpl_pct: screened FPL percent
    qualifying_medical_debt_usd: claimed medical debt
    liquid_assets_usd: documented liquid assets
  triggers: []
- type: assist_document_logged
  target: assistance_transactions
  meaning: A supporting document is requested from, received from, accepted or rejected for the applicant.
  grain: one row per document type per document status on the case
  distinguish_by:
  - document_type
  - document_status
  fields:
    document_type: document
    document_status: state
    posting_date: date recorded
    amount: always 0.00
  triggers: []
- type: assist_notice_sent
  target: assistance_transactions
  meaning: >-
    A letter on the case is sent to the patient (missing information, Medicaid screening referral, approval, denial, plain-language
    summary, renewal reminder).
  grain: one row per notice type per date on the case
  distinguish_by:
  - notice_type
  - posting_date
  fields:
    notice_type: letter
    notice_language: language sent in
    posting_date: date sent
    amount: always 0.00
  triggers: []
- type: assist_encounter_applied
  target: assistance_transactions
  meaning: >-
    An approved award is applied to one covered encounter, booking the charity adjustment that brings the patient's obligation
    down to the FAP liability.
  grain: one row per encounter per case
  distinguish_by:
  - encounter_id
  fields:
    encounter_id: covered encounter
    charge_basis_usd: FAP charge basis
    fap_liability_usd: liability under the award
    patient_paid_usd: payments already applied
    amount: charity adjustment
    posting_date: posting date
  account: charity_adjustment
  direction: in
  triggers:
  - event: encounter:encounter_adjustment_posted
    map:
      adjustment_code: FAP_CHARITY_ADJUSTMENT
      amount: amount
      posting_date: posting_date
- type: assist_adjustment_reversed
  target: assistance_transactions
  meaning: >-
    A charity adjustment is reversed after the award is revoked, restoring the patient's liability on the encounter.
  grain: one row per reversed award application
  distinguish_by:
  - source_fap_txn_id
  fields:
    source_fap_txn_id: award application undone
    encounter_id: encounter affected
    amount: amount reversed
    posting_date: posting date
  account: charity_adjustment
  direction: out
  triggers:
  - event: encounter:encounter_liability_posted
    map:
      liability_source: FAP_ADJUSTMENT_REVERSAL
      amount: amount
      posting_date: posting_date
- type: assist_eca_action_logged
  target: assistance_transactions
  meaning: >-
    A collection-protection action required by the Financial Assistance Policy is requested on an encounter (ECA suspension
    notice, agency recall, credit-report deletion, refund review).
  grain: one row per action type per encounter on the case
  distinguish_by:
  - eca_action
  - encounter_id
  fields:
    eca_action: action requested
    encounter_id: encounter protected
    posting_date: date requested
    amount: always 0.00
  triggers: []
- type: assist_documents_requested
  target: assistance_cases
  mutation:
    transition:
      from: submitted
      to: pending_documents
  meaning: The application is found incomplete and the missing-information notice is issued.
  grain: one row per transaction
  fields:
    status: pending_documents
    documents_due_date: response deadline
  triggers:
  - event: assist:assist_notice_sent
    map:
      notice_type: MISSING_INFORMATION_NOTICE
- type: assist_documents_completed
  target: assistance_cases
  mutation:
    transition:
      from: pending_documents
      to: submitted
  meaning: The missing documents arrive and the application is complete.
  grain: one row per transaction
  fields:
    status: submitted
  triggers: []
- type: assist_approved
  target: assistance_cases
  mutation:
    transition:
      from: submitted
      to: approved
  meaning: The application (or presumptive screen) is approved at a tier.
  grain: one row per transaction
  fields:
    status: approved
    determination_date: letter date
    award_start_date: first covered date of service
    award_end_date: last covered date of service
    hardship_liability_cap_usd: hardship cap or 0.00
  triggers:
  - event: assist:assist_notice_sent
    map:
      notice_type: APPROVAL_LETTER
      posting_date: determination_date
- type: assist_denied
  target: assistance_cases
  mutation:
    transition:
    - from: submitted
      to: denied
    - from: pending_documents
      to: denied
  meaning: The application is denied.
  grain: one row per transaction
  fields:
    status: denied
    determination_date: letter date
    denial_reason: reason
  triggers:
  - event: assist:assist_notice_sent
    map:
      notice_type: DENIAL_LETTER
      posting_date: determination_date
- type: assist_reconsideration_opened
  target: assistance_cases
  mutation:
    transition:
      from: denied
      to: submitted
  meaning: A denied application is reopened for reconsideration with new information.
  grain: one row per transaction
  fields:
    status: submitted
    denial_reason: reset to NONE
    determination_date: cleared
  triggers: []
- type: assist_withdrawn
  target: assistance_cases
  mutation:
    transition:
    - from: submitted
      to: withdrawn
    - from: pending_documents
      to: withdrawn
  meaning: The patient withdraws the application.
  grain: one row per transaction
  fields:
    status: withdrawn
    closed_date: withdrawal date
  triggers: []
- type: assist_award_expired
  target: assistance_cases
  mutation:
    transition:
      from: approved
      to: expired
  meaning: The award period ends.
  grain: one row per transaction
  fields:
    status: expired
    closed_date: day after award_end_date
  triggers: []
- type: assist_award_revoked
  target: assistance_cases
  mutation:
    transition:
      from: approved
      to: revoked
  meaning: The award is revoked on a revocation ground.
  grain: one row per transaction
  fields:
    status: revoked
    closed_date: revocation date
  triggers: []
- type: assist_household_updated
  target: assistance_cases
  mutation: update
  meaning: >-
    Household size, income, FPL percent, medical debt or assets are corrected from accepted documents and the screened tier
    follows.
  grain: one row per transaction
  fields:
    household_size: documented size
    annual_household_income_usd: documented annual income
    household_fpl_pct: recomputed FPL percent
    qualifying_medical_debt_usd: documented medical debt
    liquid_assets_usd: documented assets
    variant_name: tier the new FPL percent points to
  triggers: []
measures:
- id: assist_msr_hardship_liability_used
  window: the award period of the case (award_start_date to award_end_date)
  measure: sum of fap_liability_usd over assist_encounter_applied rows on the case
- id: assist_msr_required_documents_accepted
  window: the life of the case up to the decision date
  measure: >-
    count of distinct document types in required_document_types with an assist_document_logged row in document_status ACCEPTED
    on the case (a single accepted income_proof_types document counts for INCOME_PROOF)
policies:
- id: assist_agg_multi_holding
  subject:
  - assist_application_received
  rule: >-
    A patient may have any number of assistance cases over time, but at most one open application (submitted or pending_documents)
    and at most one approved award at a time (max_concurrent_awards). A new application received while another application
    of the patient is open is added to that open case as supporting information, not opened as a second case. A renewal application
    filed within award_renewal_window_days before the current award_end_date opens a new case whose award, if approved, starts
    the day after the current award ends; outside that window a new application while an award is approved is not accepted.
  eligibility: []
  params:
    max_per_customer: null
    max_concurrent_awards: =max_concurrent_awards
    award_renewal_window_days: =award_renewal_window_days
- id: assist_agg_award_coverage
  subject:
  - assist_encounter_applied
  - assist_approved
  rule: >-
    One approved award covers every eligible encounter of the patient, each booked separately: encounters whose service_start_date
    falls between award_start_date and award_end_date inclusive, whether billed before or after the approval. An encounter
    is eligible only when its services are EMERGENCY or MEDICALLY_NECESSARY (elective_excluded), its open balance is the patient's
    own (self-pay liability, or the patient-responsibility portion of an insured encounter where insured_balances_eligible
    is true), and its charges are Riverbend's own (covered_providers; charges of not_covered_providers are billed by those
    groups and are outside the award). Under a medical hardship award the patient's liabilities across all covered encounters
    together never exceed hardship_liability_cap_usd (assist_msr_hardship_liability_used); once the cap is reached, every
    later covered encounter carries zero liability. An encounter is applied once per case.
  eligibility:
  - id: one_application_per_encounter
    applies_to:
    - assist_encounter_applied
    kind: dedup
    condition: An encounter is applied once per case.
    evidence_fields:
    - assistance_transactions.fap_case_id
    - assistance_transactions.encounter_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - assistance_transactions.fap_case_id
        - assistance_transactions.encounter_id
      action_bindings:
        assistance_transactions.fap_case_id: fap_case_id
        assistance_transactions.encounter_id: encounter_id
    dedup_contract:
      table: assistance_transactions
      mode: separate_record
      object_bindings:
        fap_case_id: fap_case_id
        encounter_id: encounter_id
      duplicate_filters:
        event_type:
        - assist_encounter_applied
      distinct_fields: []
  params:
    elective_excluded: =elective_excluded
    insured_balances_eligible: =insured_balances_eligible
    covered_providers: =covered_providers
    not_covered_providers: =not_covered_providers
  measures:
  - assist_msr_hardship_liability_used
- id: assist_tier_determination
  subject:
  - assist_application_received
  - assist_household_updated
  - assist_approved
  - assist_denied
  rule: >-
    The tier is determined from the case's household_fpl_pct, the household income as a percent of the HHS poverty guideline
    for the household size (fpl_guideline_basis, household_definition): the tier whose fpl_floor_pct and fpl_ceiling_pct bracket
    it, both bounds inclusive. Annual household income is the gross household income of the last income_lookback_months months
    times income_annualization_factor; when both pay stubs and a tax return are supplied, the later-dated document is used
    (income_basis_selection). A case with a presumptive_basis in presumptive_bases is approved at the presumptive tier without
    an income test; a propensity score qualifies only when the estimated FPL percent is at most propensity_score_max_fpl_pct.
    Above 400 percent FPL, medical hardship applies only when qualifying_medical_debt_usd incurred in the last hardship_debt_window_months
    exceeds hardship_medical_debt_income_pct of annual household income and, where liquid_asset_test_applies is true, liquid
    assets do not exceed liquid_asset_limit_usd; the hardship cap is hardship_liability_cap_income_pct of annual household
    income, rounded half-up to the cent. A household above 600 percent FPL, or above 400 percent without qualifying medical
    debt, is denied as INCOME_ABOVE_LIMIT; a hardship applicant over the asset limit is denied as ASSETS_ABOVE_LIMIT. When
    documents change the household figures, the FPL percent and the tier are recomputed before the determination.
  eligibility: []
  params:
    per_tier:
      Riverbend Presumptive Charity Care:
        fpl_floor: =fpl_floor_pct
        fpl_ceiling: =fpl_ceiling_pct
        discount: =discount_pct
        asset_test: =liquid_asset_test_applies
      Riverbend Full Charity Care (0-200% FPL):
        fpl_floor: =fpl_floor_pct
        fpl_ceiling: =fpl_ceiling_pct
        discount: =discount_pct
        asset_test: =liquid_asset_test_applies
      Riverbend 80% Charity Discount (201-250% FPL):
        fpl_floor: =fpl_floor_pct
        fpl_ceiling: =fpl_ceiling_pct
        discount: =discount_pct
        asset_test: =liquid_asset_test_applies
      Riverbend 60% Charity Discount (251-300% FPL):
        fpl_floor: =fpl_floor_pct
        fpl_ceiling: =fpl_ceiling_pct
        discount: =discount_pct
        asset_test: =liquid_asset_test_applies
      Riverbend 40% Charity Discount (301-400% FPL):
        fpl_floor: =fpl_floor_pct
        fpl_ceiling: =fpl_ceiling_pct
        discount: =discount_pct
        asset_test: =liquid_asset_test_applies
      Riverbend Medical Hardship Assistance (above 400% FPL):
        fpl_floor: =fpl_floor_pct
        fpl_ceiling: =fpl_ceiling_pct
        discount: =discount_pct
        asset_test: =liquid_asset_test_applies
    hardship_medical_debt_income_pct: =hardship_medical_debt_income_pct
    hardship_debt_window_months: =hardship_debt_window_months
    hardship_liability_cap_income_pct: =hardship_liability_cap_income_pct
    liquid_asset_limit_usd: =liquid_asset_limit_usd
    income_lookback_months: =income_lookback_months
    income_annualization_factor: =income_annualization_factor
    income_basis_selection: =income_basis_selection
    presumptive_bases: =presumptive_bases
    propensity_score_max_fpl_pct: =propensity_score_max_fpl_pct
  formula:
    hardship_qualifies: >-
      qualifying_medical_debt_usd > round(annual_household_income_usd * hardship_medical_debt_income_pct / 100, 2)
    hardship_cap: round(annual_household_income_usd * hardship_liability_cap_income_pct / 100, 2)
- id: assist_application_period_and_residency
  subject:
  - assist_encounter_applied
  - assist_denied
  rule: >-
    An encounter is covered only when the application was received no later than the application period counted from that
    encounter's first post-discharge statement date. Count calendar days starting the day after the encounter's first_statement_date;
    an application received on day application_period_days itself is inside the period, and an encounter with no statement
    yet is always inside it. An application received outside the period for every open encounter is denied as OUTSIDE_APPLICATION_PERIOD.
    Where residency_required is true, a patient whose county_of_residence is not in service_area_counties is eligible only
    for EMERGENCY encounters (emergency_residency_exempt); if no eligible encounter remains, the application is denied as
    OUTSIDE_SERVICE_AREA. An application whose only open encounters are ELECTIVE_NON_COVERED is denied as ELECTIVE_SERVICES_ONLY.
  eligibility:
  - id: application_period
    applies_to:
    - assist_encounter_applied
    kind: time
    condition: >-
      An encounter is covered only when the application was received no later than the application period counted from that
      encounter's first post-discharge statement date.
    evidence_fields:
    - encounter_accounts.first_statement_date
    - encounter_accounts.encounter_id
    - assistance_cases.application_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - encounter_accounts.encounter_id
      action_bindings:
        encounter_accounts.encounter_id: encounter_id
    temporal_basis:
      clock: frozen_time
      anchor_event: that encounter's first post-discharge statement date
      anchor_source: encounter_accounts.first_statement_date
      relation: not_after
      duration_source: variants.application_period_days
      unit: calendar_days
      counting_rule: >-
        Count calendar days starting the day after the encounter's first_statement_date; an application received on day application_period_days
        itself is inside the period, and an encounter with no statement yet is always inside it.
      boundary: inclusive
  params:
    application_period_days: =application_period_days
    residency_required: =residency_required
    service_area_counties: =service_area_counties
    emergency_residency_exempt: =emergency_residency_exempt
- id: assist_completeness_and_documents
  subject:
  - assist_document_logged
  - assist_documents_requested
  - assist_documents_completed
  - assist_denied
  rule: >-
    An application is complete when it carries the patient's signed attestation (where patient_attestation_required is true)
    and every document type in the tier's required_document_types has been ACCEPTED (assist_msr_required_documents_accepted);
    any one of income_proof_types satisfies INCOME_PROOF. An incomplete application receives a missing-information notice
    listing each missing document as REQUESTED, and documents_due_date is the notice date plus missing_information_response_days
    calendar days. A document is logged once per status. An application may be denied as INCOMPLETE_AFTER_DEADLINE only after
    the response deadline counted from the missing-information notice has passed. Count calendar days starting the day after
    the notice date; the deadline day itself still belongs to the patient, so denial is possible from the following day. Complete
    applications are determined within determination_days. Because the application period runs longer than the response deadline,
    documents received after an incomplete denial but inside the application period reopen the case by reconsideration.
  eligibility:
  - id: response_deadline_passed
    applies_to:
    - assist_denied
    kind: time
    condition: >-
      An application may be denied as INCOMPLETE_AFTER_DEADLINE only after the response deadline counted from the missing-information
      notice has passed.
    evidence_fields:
    - assistance_transactions.posting_date
    - assistance_transactions.notice_type
    - assistance_transactions.fap_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - assistance_transactions.fap_case_id
      action_bindings:
        assistance_transactions.fap_case_id: fap_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the missing-information notice
      anchor_source: assistance_transactions.posting_date
      relation: not_before
      duration_source: variants.missing_information_response_days
      unit: calendar_days
      counting_rule: >-
        Count calendar days starting the day after the notice date; the deadline day itself still belongs to the patient,
        so denial is possible from the following day.
      boundary: exclusive
  - id: one_log_per_status
    applies_to:
    - assist_document_logged
    kind: dedup
    condition: A document is logged once per status.
    evidence_fields:
    - assistance_transactions.fap_case_id
    - assistance_transactions.document_type
    - assistance_transactions.document_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - assistance_transactions.fap_case_id
      action_bindings:
        assistance_transactions.fap_case_id: fap_case_id
    dedup_contract:
      table: assistance_transactions
      mode: separate_record
      object_bindings:
        fap_case_id: fap_case_id
      duplicate_filters:
        event_type:
        - assist_document_logged
      distinct_fields:
      - document_type
      - document_status
  params:
    per_tier:
      Riverbend Presumptive Charity Care:
        required_documents: =required_document_types
        attestation_required: =patient_attestation_required
      Riverbend Full Charity Care (0-200% FPL):
        required_documents: =required_document_types
        attestation_required: =patient_attestation_required
      Riverbend 80% Charity Discount (201-250% FPL):
        required_documents: =required_document_types
        attestation_required: =patient_attestation_required
      Riverbend 60% Charity Discount (251-300% FPL):
        required_documents: =required_document_types
        attestation_required: =patient_attestation_required
      Riverbend 40% Charity Discount (301-400% FPL):
        required_documents: =required_document_types
        attestation_required: =patient_attestation_required
      Riverbend Medical Hardship Assistance (above 400% FPL):
        required_documents: =required_document_types
        attestation_required: =patient_attestation_required
    income_proof_types: =income_proof_types
    missing_information_response_days: =missing_information_response_days
    determination_days: =determination_days
  measures:
  - assist_msr_required_documents_accepted
- id: assist_charity_computation
  subject:
  - assist_encounter_applied
  rule: >-
    For each covered encounter the award books one charity adjustment. The FAP charge basis is, for a SELF_PAY encounter,
    the amounts-generally-billed amount — agb_pct of the encounter's gross charges, rounded half-up to the cent (self_pay_charge_basis);
    for an insured encounter, the total patient responsibility posted from the payer (insured_charge_basis). The FAP liability
    is the charge basis times one minus the tier's discount_pct, rounded half-up to the cent; under medical hardship it is
    the charge basis limited to what remains of hardship_liability_cap_usd after the liabilities already booked on the case.
    The patient's obligation before assistance is the encounter's current patient balance plus the patient payments already
    applied to it. The charity adjustment is that obligation less the FAP liability; when the obligation does not exceed the
    FAP liability, no adjustment is booked. When payments already applied exceed the FAP liability, the adjustment leaves
    a credit balance on the encounter, which is refunded under the hospital-account refund rule after the refund review. The
    uninsured discount and any prompt-pay or courtesy adjustment already posted stay in place and are part of the obligation
    calculation, never reversed.
  eligibility: []
  params:
    per_tier:
      Riverbend Presumptive Charity Care:
        discount_pct: =discount_pct
      Riverbend Full Charity Care (0-200% FPL):
        discount_pct: =discount_pct
      Riverbend 80% Charity Discount (201-250% FPL):
        discount_pct: =discount_pct
      Riverbend 60% Charity Discount (251-300% FPL):
        discount_pct: =discount_pct
      Riverbend 40% Charity Discount (301-400% FPL):
        discount_pct: =discount_pct
      Riverbend Medical Hardship Assistance (above 400% FPL):
        discount_pct: =discount_pct
    agb_pct: =agb_pct
    agb_method: =agb_method
    self_pay_charge_basis: =self_pay_charge_basis
    insured_charge_basis: =insured_charge_basis
    liability_rounding: =liability_rounding
  formula:
    fap_liability: round(charge_basis_usd * (1 - discount_pct / 100), 2)
  measures:
  - assist_msr_hardship_liability_used
- id: assist_eca_protection
  subject:
  - assist_eca_action_logged
  rule: >-
    From the day an application is received until it is determined, every extraordinary collection action on the patient's
    eligible encounters is suspended (eca_suspension_on_application): an ECA_SUSPENSION_NOTICE is logged for each eligible
    encounter in bad_debt status or past its final notice. After approval, within eca_reversal_days calendar days of the determination
    date, an AGENCY_RECALL_REQUEST is logged for each covered encounter placed with the agency, a CREDIT_REPORT_DELETION_REQUEST
    for each covered encounter credit-reported, and within refund_review_days a REFUND_REVIEW_REQUEST for each covered encounter
    whose payments exceed its FAP liability. Each action is logged once per encounter on a case. A denial lifts the suspension,
    and collection resumes no sooner than the end of the notification_period_days counted from the encounter's first statement.
  eligibility:
  - id: one_action_per_encounter
    applies_to:
    - assist_eca_action_logged
    kind: dedup
    condition: Each action is logged once per encounter on a case.
    evidence_fields:
    - assistance_transactions.fap_case_id
    - assistance_transactions.encounter_id
    - assistance_transactions.eca_action
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - assistance_transactions.fap_case_id
        - assistance_transactions.encounter_id
      action_bindings:
        assistance_transactions.fap_case_id: fap_case_id
        assistance_transactions.encounter_id: encounter_id
    dedup_contract:
      table: assistance_transactions
      mode: separate_record
      object_bindings:
        fap_case_id: fap_case_id
        encounter_id: encounter_id
      duplicate_filters:
        event_type:
        - assist_eca_action_logged
      distinct_fields:
      - eca_action
  params:
    eca_suspension_on_application: =eca_suspension_on_application
    eca_reversal_days: =eca_reversal_days
    refund_review_days: =refund_review_days
    notification_period_days: =notification_period_days
- id: assist_notices
  subject:
  - assist_notice_sent
  rule: >-
    Every letter on a case is sent by notice_channel in the patient's preferred_language when it is one of notice_languages,
    otherwise in English. A missing-information notice lists each missing document and the response deadline and encloses
    the plain-language summary; an approval letter states the tier, award_start_date, award_end_date and (for medical hardship)
    the liability cap; a denial letter states the denial reason and the right to reconsideration. A renewal reminder is sent
    award_renewal_window_days before award_end_date. A notice of one type is sent once per date on a case.
  eligibility: []
  params:
    notice_channel: =notice_channel
    notice_languages: =notice_languages
    award_renewal_window_days: =award_renewal_window_days
- id: assist_award_period
  subject:
  - assist_approved
  - assist_award_expired
  rule: >-
    An approved award runs from award_start_date to award_end_date. award_start_date is the application_date minus retroactive_service_lookback_days
    calendar days, so open balances of services in that look-back are covered; award_end_date is the determination_date plus
    award_eligibility_months calendar months, falling back to the last day of the month when that month has no such day. The
    award expires the day after award_end_date. A patient may be approved only when the case is complete, any required BadgerCare
    Plus screening is resolved, and the tier is determined.
  eligibility: []
  params:
    per_tier:
      Riverbend Presumptive Charity Care:
        eligibility_months: =award_eligibility_months
      Riverbend Full Charity Care (0-200% FPL):
        eligibility_months: =award_eligibility_months
      Riverbend 80% Charity Discount (201-250% FPL):
        eligibility_months: =award_eligibility_months
      Riverbend 60% Charity Discount (251-300% FPL):
        eligibility_months: =award_eligibility_months
      Riverbend 40% Charity Discount (301-400% FPL):
        eligibility_months: =award_eligibility_months
      Riverbend Medical Hardship Assistance (above 400% FPL):
        eligibility_months: =award_eligibility_months
    retroactive_service_lookback_days: =retroactive_service_lookback_days
- id: assist_reconsideration_and_withdrawal
  subject:
  - assist_reconsideration_opened
  - assist_withdrawn
  rule: >-
    A denied case is reopened for reconsideration only when the patient supplies new information within the reconsideration
    period counted from the denial letter date. Count calendar days starting the day after determination_date; a request on
    day reconsideration_request_days itself is accepted. A reconsideration also requires that at least one of the patient's
    open encounters is still inside its application period. After an INCOME_ABOVE_LIMIT denial, a fresh application without
    a documented change in household size or income is accepted only after reapplication_wait_days. Only the patient can withdraw
    an application; a representative never withdraws one on the patient's behalf, and a withdrawn case cannot be reopened
    (a new application is filed instead).
  eligibility:
  - id: reconsideration_window
    applies_to:
    - assist_reconsideration_opened
    kind: time
    condition: >-
      A denied case is reopened for reconsideration only when the patient supplies new information within the reconsideration
      period counted from the denial letter date.
    evidence_fields:
    - assistance_cases.determination_date
    - assistance_cases.fap_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - assistance_cases.fap_case_id
      action_bindings:
        assistance_cases.fap_case_id: fap_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the denial letter date
      anchor_source: assistance_cases.determination_date
      relation: not_after
      duration_source: variants.reconsideration_request_days
      unit: calendar_days
      counting_rule: >-
        Count calendar days starting the day after determination_date; a request on day reconsideration_request_days itself
        is accepted.
      boundary: inclusive
  params:
    reconsideration_request_days: =reconsideration_request_days
    reapplication_wait_days: =reapplication_wait_days
    application_period_days: =application_period_days
- id: assist_revocation
  subject:
  - assist_award_revoked
  - assist_adjustment_reversed
  rule: >-
    An approved award is revoked only on one of revocation_grounds documented in the case: information the patient supplied
    is shown to be false, or a third-party liability payment (auto, premises or workers' compensation settlement) for the
    covered services was received and not disclosed. On revocation every charity adjustment booked under the award is reversed,
    each against the award application it undoes, restoring the patient's liability on that encounter. A reversal is booked
    once per award application. Revocation for any other reason, such as a later rise in income during the award period, is
    not permitted; the award runs to its end date.
  eligibility:
  - id: one_reversal_per_application
    applies_to:
    - assist_adjustment_reversed
    kind: dedup
    condition: A reversal is booked once per award application.
    evidence_fields:
    - assistance_transactions.source_fap_txn_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - assistance_transactions.source_fap_txn_id
      action_bindings:
        assistance_transactions.source_fap_txn_id: source_fap_txn_id
    dedup_contract:
      table: assistance_transactions
      mode: separate_record
      object_bindings:
        source_fap_txn_id: source_fap_txn_id
      duplicate_filters:
        event_type:
        - assist_adjustment_reversed
      distinct_fields: []
  params:
    revocation_grounds: =revocation_grounds
- id: assist_medicaid_screening
  subject:
  - assist_notice_sent
  - assist_denied
  - assist_approved
  rule: >-
    On tiers where medicaid_screening_required is true, an applicant must complete a BadgerCare Plus eligibility screening
    before approval: a MEDICAID_SCREENING_REFERRAL notice is sent, and the BadgerCare Plus determination notice must be provided
    within medicaid_screening_deadline_days of the referral. If BadgerCare Plus is granted with coverage of the dates of service,
    the encounters are rebilled to Medicaid instead of receiving charity care, and only the balance Medicaid leaves to the
    patient is considered under the award. If BadgerCare Plus is denied, the denial notice satisfies the requirement. If no
    determination notice is provided by the deadline, the application is denied as MEDICAID_SCREENING_NOT_COMPLETED. Tiers
    where the flag is false are approved without a screening.
  eligibility: []
  params:
    per_tier:
      Riverbend Presumptive Charity Care:
        screening_required: =medicaid_screening_required
      Riverbend Full Charity Care (0-200% FPL):
        screening_required: =medicaid_screening_required
      Riverbend 80% Charity Discount (201-250% FPL):
        screening_required: =medicaid_screening_required
      Riverbend 60% Charity Discount (251-300% FPL):
        screening_required: =medicaid_screening_required
      Riverbend 40% Charity Discount (301-400% FPL):
        screening_required: =medicaid_screening_required
      Riverbend Medical Hardship Assistance (above 400% FPL):
        screening_required: =medicaid_screening_required
    medicaid_screening_deadline_days: =medicaid_screening_deadline_days
extended_policies:
- id: assist_ext_supplement_debt_claim
  base_policy_refs:
  - assist_agg_multi_holding
  - assist_tier_determination
  overwrite: []
  trigger: on_request
  subject:
  - assist_application_received
  computes: qualifying_medical_debt_usd
  target_tool: sign_hardship_supplement_15cad132
  params:
    window_months: 12
  rule: >-
    A patient whose financial assistance application is open (submitted or pending documents) and whose screened household
    percent of the poverty guideline is above 400.0 may sign a hardship supplement, except on a renewal application (one
    filed while the patient holds an approved award), whose medical debt is claimed on the renewal's own claim of medical
    debt; the signed supplement is received as supporting information on that open case and records on it the medical debt
    the supplement claims. The supplement claims only the patient's Riverbend bills, read from Riverbend's own records as of
    the signing day; the bills of any other provider are claimed only by sending them as outside medical bills and are not
    part of this claim. The medical debt a hardship supplement claims is every patient liability posted on the patient's
    Riverbend accounts in the twelve whole months before the signing day, less every patient-balance adjustment posted in
    those same months. A posting belongs to those months when fewer than twelve whole months separate its posting date from
    the signing day; a whole month runs from a day of one month to the same day of the next month or, when the next month
    has no such day, to the first day of the month after it, so that a posting dated on the signing day's day of the month
    twelve months earlier is already outside. The supplement's claim is rounded half-up to the cent and is never below zero.
    The adjustments described below each take their own amount off that standard figure and none depends on another; the
    supplement's claim is the standard figure less every amount they take off. The claim under appeal is the claim named by
    the most recent appeal filed on any of the patient's claims (on a same-day tie, the appeal listed first in the claim
    activity), while that claim is in appealed status; when that claim has left appealed status, there is no claim under
    appeal. Insurer cost sharing on the claim under appeal is taken off: when the most recent appeal is a member appeal
    filed under the patient's authorization and its claim is the claim under appeal, the deductible, coinsurance and copay
    liabilities of those months posted from that claim are taken off; when the most recent appeal is of any other type and
    its claim is the claim under appeal, only the coinsurance liabilities of those months posted from that claim are taken
    off; otherwise nothing is taken off for an appeal. The held account is the patient's account on a billing hold for a
    charge dispute or, when no account is on such a hold, the account on a billing hold for an itemization review (when
    several accounts qualify, the one listed first among the patient's accounts). A billing hold on the held account takes
    off the amount in question on it, leaving aside every liability posted from the claim under appeal: when the held
    account is on a charge-dispute hold, the charge of the disputed line is taken off, but never more than the held
    account's patient liabilities of those months, the disputed line being the charge line named by the most recent
    charge-dispute inquiry on the held account (on a tie in creation time, the inquiry listed first; when no such inquiry
    names a charge line, that charge is 0.00); when the held account is on an itemization-review hold, its coinsurance
    liabilities of those months are taken off; otherwise nothing is taken off for a hold. The coverage-gap account is the
    account carrying the patient's most recent coverage-terminated liability (an amount an insurer released because coverage
    had ended before the date of service; on a same-day tie, the liability listed first in the account activity). Its
    coverage-terminated balance is its coverage-terminated liabilities of those months less every uninsured discount of
    those months posted on the coverage-gap account (a discount granted on those liabilities after coverage ended included),
    and that balance is taken off in one of three ways: when the patient holds a BadgerCare Plus claim, all of that balance
    is taken off; when the patient holds no BadgerCare Plus claim, a BadgerCare Plus determination notice has been accepted
    on the case, and the coverage-gap account is coded emergency or medically necessary, the part of that balance above the
    amounts-generally-billed share of those liabilities, agb_pct percent of them rounded half-up to the cent, is taken off,
    nothing coming off a balance already at or below that share; otherwise, including when the coverage-gap account is coded
    elective, nothing is taken off for them. Coverage-terminated liabilities on any other account stand as posted. The
    self-pay good faith estimate is the patient's self-pay good faith estimate (single scheduled service, procedure with
    co-providers, or recurring course of care) that is in dispute or, when none is, one whose service has been completed;
    when several qualify, the variant in that order and, within it, the estimate listed first among the patient's estimates.
    Its billed charges are the self-pay final-bill liabilities of those months on the account it is linked to, less the
    uninsured discounts of those months on that account; its expected charges are the convening-facility and
    convening-professional lines of its current version. A bill open to dispute under that estimate is taken off: when the
    estimate is in dispute, its billed charges are taken off; when its service has been completed, its billed charges exceed
    its expected charges by at least ppdr_threshold_usd of its tier, and no more than ppdr_initiation_days of its tier
    separate its initial bill date from the signing day (counted from the day after the initial bill date), the amount by
    which its billed charges exceed its expected charges is taken off; otherwise, including when no initial bill date is
    recorded, nothing is taken off for an estimate.
  prerequisite: []
  cross_category:
  - category: encounter
    as: history
    reads:
    - encounter_transactions.amount
    - encounter_transactions.liability_source
    - encounter_transactions.adjustment_code
    - encounter_transactions.claim_id
    - encounter_transactions.encounter_id
    - encounter_billing_inquiries.disputed_txn_id
    - encounter_id
    - billing_hold_reason
    - service_classification
    note: >-
      the twelve months' liabilities and adjustments, the held account and its disputed line, and the estimate's linked account
      read the hospital-account ledger, inquiries and accounts.
  - category: claim
    as: branch
    reads:
    - claim_transactions.claim_id
    - claim_transactions.appeal_type
    - status
    - variant_name
    note: >-
      the appeal take-off reads the most recent appeal and its claim's status; the coverage-terminated take-off reads whether
      a BadgerCare Plus claim is held.
  - category: estimate
    as: branch
    reads:
    - variant_name
    - status
    - encounter_id
    - initial_bill_date
    - estimate_version
    - estimate_transactions.amount
    - estimate_transactions.provider_role
    note: >-
      the estimate take-off reads the self-pay good faith estimate, its convening lines and its tier's dispute threshold and
      window.
  compute:
  - liab_all: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted')
  - adj_all: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_adjustment_posted')
  - std_claim: liab_all - adj_all
  - appeal_claim: >-
      XLATEST('claim','claim_transactions','claim_id', date_field='posting_date', event_type='claim_appeal_filed')
  - appeal_open: appeal_claim != None and CFIELD('claim','status', claim_id=appeal_claim) == 'appealed'
  - dispute_acct: CFIELD('encounter','encounter_id', billing_hold_reason='CHARGE_DISPUTE')
  - review_acct: CFIELD('encounter','encounter_id', billing_hold_reason='ITEMIZATION_REVIEW')
  - held_acct: dispute_acct if dispute_acct != None else review_acct
  - appeal_kind: >-
      XLATEST('claim','claim_transactions','appeal_type', date_field='posting_date', event_type='claim_appeal_filed')
  - appeal_coi: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COINSURANCE', claim_id=appeal_claim)
  - appeal_cs: >-
      appeal_coi + XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_liability_posted', liability_source='DEDUCTIBLE', claim_id=appeal_claim) + XSUM('encounter','encounter_transactions','amount',
      within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted', liability_source='COPAY',
      claim_id=appeal_claim)
  - appeal_hold: >-
      appeal_cs if (appeal_open and appeal_kind == 'MEMBER_APPEAL_WITH_AOR') else (appeal_coi if (appeal_open and appeal_kind
      != 'MEMBER_APPEAL_WITH_AOR') else 0)
  - disputed_line: >-
      XLATEST('encounter','encounter_billing_inquiries','disputed_txn_id', date_field='created_at', encounter_id=held_acct,
      inquiry_type='CHARGE_DISPUTE')
  - line_charge: >-
      XSUM('encounter','encounter_transactions','amount', event_type='encounter_charge_posted', encounter_txn_id=disputed_line)
  - held_liab: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      encounter_id=held_acct) - (XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date',
      event_type='encounter_liability_posted', encounter_id=held_acct, claim_id=appeal_claim) if appeal_open else 0)
  - held_coi: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COINSURANCE', encounter_id=held_acct) - (XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'),
      date_field='posting_date', event_type='encounter_liability_posted', liability_source='COINSURANCE', encounter_id=held_acct,
      claim_id=appeal_claim) if appeal_open else 0)
  - hold_out: MN(line_charge, held_liab) if dispute_acct != None else (held_coi if review_acct != None else 0)
  - ct_acct: >-
      XLATEST('encounter','encounter_transactions','encounter_id', date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COVERAGE_TERMINATED')
  - ct_liab: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='COVERAGE_TERMINATED', encounter_id=ct_acct)
  - has_bcp: EXISTS('claim', variant_name='BadgerCare Plus (Wisconsin Medicaid) Claim')
  - bcp_notice: >-
      COUNT('assistance_transactions', event_type='assist_document_logged', document_type='MEDICAID_DETERMINATION_NOTICE',
      document_status='ACCEPTED') > 0
  - ct_disc: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_adjustment_posted',
      adjustment_code='UNINSURED_DISCOUNT', encounter_id=ct_acct)
  - ct_necessary: >-
      ct_acct != None and CFIELD('encounter','service_classification', encounter_id=ct_acct) != 'ELECTIVE_NON_COVERED'
  - ct_off: >-
      (ct_liab - ct_disc) if has_bcp else (MX(0, ct_liab - ct_disc - RND(ct_liab * P('agb_pct') / 100, 2)) if (bcp_notice
      and ct_necessary) else 0)
  - gfe_id: >-
      CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='in_dispute')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='in_dispute')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='in_dispute')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Single Scheduled Service', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Procedure with Co-Providers', status='service_completed')
      or CFIELD('estimate','estimate_id', variant_name='Self-Pay Good Faith Estimate - Recurring Course of Care', status='service_completed')
  - gfe_status: CFIELD('estimate','status', estimate_id=gfe_id)
  - gfe_acct: CFIELD('estimate','encounter_id', estimate_id=gfe_id)
  - gfe_billed: >-
      XSUM('encounter','encounter_transactions','amount', within_months=K('window_months'), date_field='posting_date', event_type='encounter_liability_posted',
      liability_source='SELF_PAY_FINAL_BILL', encounter_id=gfe_acct) - XSUM('encounter','encounter_transactions','amount',
      within_months=K('window_months'), date_field='posting_date', event_type='encounter_adjustment_posted', adjustment_code='UNINSURED_DISCOUNT',
      encounter_id=gfe_acct)
  - gfe_expected: >-
      XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded', estimate_id=gfe_id, estimate_version=CFIELD('estimate','estimate_version',
      estimate_id=gfe_id), provider_role='CONVENING_FACILITY') + XSUM('estimate','estimate_transactions','amount', event_type='estimate_line_recorded',
      estimate_id=gfe_id, estimate_version=CFIELD('estimate','estimate_version', estimate_id=gfe_id), provider_role='CONVENING_PROFESSIONAL')
  - gfe_bill_date: CFIELD('estimate','initial_bill_date', estimate_id=gfe_id)
  - gfe_open: >-
      gfe_bill_date != None and gfe_bill_date != '' and DAYS(gfe_bill_date, NOW) <= CPARAM('estimate','ppdr_initiation_days',
      estimate_id=gfe_id)
  - gfe_off: >-
      gfe_billed if gfe_status == 'in_dispute' else ((gfe_billed - gfe_expected) if (gfe_status == 'service_completed' and
      gfe_billed - gfe_expected >= CPARAM('estimate','ppdr_threshold_usd', estimate_id=gfe_id) and gfe_open) else 0)
  - result: RND(MX(0, std_claim - appeal_hold - hold_out - ct_off - gfe_off), 2)
  compute_basis:
    liab_all: >-
      every patient liability posted on the patient's Riverbend accounts in the twelve whole months before the signing day
    adj_all: less every patient-balance adjustment posted in those same months
    std_claim: >-
      The medical debt a hardship supplement claims is every patient liability posted on the patient's Riverbend accounts
      in the twelve whole months before the signing day, less every patient-balance adjustment posted in those same months.
    appeal_claim: >-
      The claim under appeal is the claim named by the most recent appeal filed on any of the patient's claims (on a same-day
      tie, the appeal listed first in the claim activity), while that claim is in appealed status
    appeal_open: >-
      while that claim is in appealed status; when that claim has left appealed status, there is no claim under appeal.
    dispute_acct: The held account is the patient's account on a billing hold for a charge dispute
    review_acct: >-
      when no account is on such a hold, the account on a billing hold for an itemization review (when several accounts qualify,
      the one listed first among the patient's accounts)
    held_acct: >-
      The held account is the patient's account on a billing hold for a charge dispute or, when no account is on such a hold,
      the account on a billing hold for an itemization review (when several accounts qualify, the one listed first among the
      patient's accounts).
    appeal_kind: when the most recent appeal is a member appeal filed under the patient's authorization
    appeal_coi: only the coinsurance liabilities of those months posted from that claim are taken off
    appeal_cs: >-
