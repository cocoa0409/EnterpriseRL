category: assist
display_name: Financial Assistance Program (Charity Care)
binding:
  holding_table: assistance_cases
  event_tables:
  - assistance_transactions
  status_field: status
  variant_field: variant_name
  quantity_fields:
    charity_applied_total: charity_adjustment
lifecycle:
  states:
  - submitted
  - pending_documents
  - approved
  - denied
  - withdrawn
  - expired
  - revoked
  transitions:
  - from: submitted
    to: pending_documents
    by: agent
    means: A financial counselor finds the application incomplete and sends the missing-information notice.
  - from: pending_documents
    to: submitted
    by: agent
    means: The missing documents arrive and the application is complete again.
  - from: submitted
    to: approved
    by: agent
    means: A financial counselor approves the complete application (or the presumptive screen) at a tier.
  - from: submitted
    to: denied
    by: agent
    means: A financial counselor denies the complete application.
  - from: pending_documents
    to: denied
    by: system
    means: The missing-information deadline passes without the documents.
  - from: denied
    to: submitted
    by: agent
    means: A reconsideration with new information is opened inside the reconsideration and application periods.
  - from: submitted
    to: withdrawn
    by: user
    means: The patient withdraws the application.
  - from: pending_documents
    to: withdrawn
    by: user
    means: The patient withdraws the application while documents are outstanding.
  - from: approved
    to: expired
    by: system
    means: The award reaches award_end_date.
  - from: approved
    to: revoked
    by: agent
    means: The award is revoked on a revocation ground.
accounts:
- key: charity_adjustment
  unit: USD
  meaning: >-
    Total charity-care adjustments booked under the award against covered encounters; applying the award to an encounter adds
    to it and a reversal reduces it.
parameter_schema:
  fpl_floor_pct: household FPL percent (one decimal) at or above which the tier applies
  fpl_ceiling_pct: >-
    household FPL percent (one decimal) at or below which the tier applies; for the presumptive tier the presumed ceiling
  discount_pct: >-
    percent discount applied to the FAP charge basis of an eligible encounter (0 for medical hardship, which is cap-based)
  agb_pct: >-
    Riverbend amounts-generally-billed percentage of gross charges for the fiscal year (look-back method)
  agb_method: enum IRS 501(r) method used to compute AGB
  self_pay_charge_basis: enum charge basis of a SELF_PAY encounter for FAP purposes
  insured_charge_basis: enum charge basis of an insured encounter for FAP purposes
  hardship_medical_debt_income_pct: percent of annual household income that qualifying medical debt must exceed for medical
    hardship
  hardship_debt_window_months: >-
    integer months before the application date over which qualifying medical debt (Riverbend and outside medical bills) is
    counted
  hardship_liability_cap_income_pct: >-
    percent of annual household income that caps the patient's total liability across all encounters covered by a medical
    hardship award
  liquid_asset_test_applies: boolean — whether liquid assets are tested for the tier
  liquid_asset_limit_usd: >-
    USD liquid assets (cash, checking, savings, non-retirement brokerage) above which a tier with the asset test is denied
  application_period_days: >-
    integer calendar days from an encounter's first post-discharge billing statement within which an application for that
    encounter is accepted and processed
  notification_period_days: >-
    integer calendar days from the first post-discharge billing statement during which no extraordinary collection action
    may begin
  missing_information_response_days: >-
    integer calendar days after the missing-information notice the patient has to supply the missing documents
  determination_days: >-
    integer calendar days after an application is complete within which Riverbend issues the determination letter
  award_eligibility_months: integer calendar months after the determination date that an approved award covers new services
  retroactive_service_lookback_days: >-
    integer calendar days before the application date whose services with open balances the award also covers
  award_renewal_window_days: >-
    integer calendar days before award_end_date within which a renewal application may be filed to start the next award the
    day after the current one ends
  service_area_counties: list of counties of residence that meet the residency requirement
  residency_required: boolean — whether residence in the service area is required for non-emergency services
  emergency_residency_exempt: boolean — whether EMERGENCY services are covered regardless of residence
  elective_excluded: boolean — whether ELECTIVE_NON_COVERED services are excluded from assistance
  insured_balances_eligible: >-
    boolean — whether patient-responsibility balances of insured patients (deductible, coinsurance, copay, non-covered) are
    eligible
  medicaid_screening_required: >-
    boolean — whether the applicant must complete a BadgerCare Plus eligibility screening before approval
  medicaid_screening_deadline_days: integer calendar days after the screening referral to provide the BadgerCare Plus determination
  required_document_types: list of document types that make an application complete for the tier
  income_proof_types: list of documents accepted as INCOME_PROOF
  income_lookback_months: integer months of gross household income documented and annualized
  income_annualization_factor: integer multiplier converting the documented months of gross income to annual income
  income_basis_selection: enum which income figure is used when both pay stubs and a tax return are supplied
  household_definition: enum who counts in the household
  fpl_guideline_basis: enum poverty guideline used to compute household FPL percent
  presumptive_bases: list of presumptive_basis values that qualify for presumptive charity care
  presumptive_screen_timing: enum when every SELF_PAY patient_due account is screened presumptively
  propensity_score_max_fpl_pct: >-
    estimated household FPL percent at or below which a third-party propensity score qualifies as presumptive evidence
  reconsideration_request_days: >-
    integer calendar days after the denial letter within which the patient may request reconsideration with new information
  reapplication_wait_days: >-
    integer calendar days after an income-based denial before a new application without a change in circumstances is accepted
  eca_suspension_on_application: >-
    boolean — whether every extraordinary collection action on eligible encounters is suspended from the day an application
    is received until the determination
  eca_reversal_days: >-
    integer calendar days after approval within which Riverbend requests reversal of every ECA taken on covered encounters
    (agency recall, credit-report deletion)
  refund_review_days: >-
    integer calendar days after approval within which payments above the FAP liability on covered encounters are sent for
    refund
  application_channels: list of channels through which an application may be filed
  patient_attestation_required: >-
    boolean — whether the application must carry the patient's own signed attestation of household and income
  notice_languages: >-
    list of preferred_language values in which the application, plain-language summary and letters are provided
  notice_channel: enum delivery channel of determination and missing-information letters
  covered_providers: list of providers whose charges the award covers
  not_covered_providers: list of providers practicing at Riverbend whose charges the award does not cover
  max_concurrent_awards: integer number of approved awards a patient may hold at once
  revocation_grounds: list of grounds on which an approved award is revoked
  liability_rounding: rounding basis of FAP liability and charity adjustment amounts
