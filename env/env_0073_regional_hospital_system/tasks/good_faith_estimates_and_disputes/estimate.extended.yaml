    aid_cap_left: >-
      the award's cap left is its hardship liability cap less the liabilities already booked on encounters under that case
    aid_start: which runs from its award start date through its award end date, both counted
    aid_end: which runs from its award start date through its award end date, both counted
    aid_covers: >-
      the expected delivery date when that date falls within its award period, which runs from its award start date through
      its award end date, both counted
    aid_discount: tier discount is above zero and below one hundred percent
    ces_acct: >-
      the first such line the account activity lists where several share the latest date
    ces_acct_net: >-
      it counts only when the hospital account it is posted on carries charges net of the charge credits recorded on that
      account above zero, otherwise counting as no cesarean charge, an earlier cesarean charge not being looked for
  factors:
  - id: delivery_aid_price
    effect: method
    decides: aid_price
    bindings:
    - aid_discount
    - aid_price
    ladder:
    - when: >-
        the patient's award covers the date AND its tier discount is above zero and below one hundred percent
      method: >-
        the delivery package price owed before delivery is the package price reduced by the tier discount percentage
    - when: >-
        the patient's award covers the date AND it carries no tier discount AND it has cap left
      method: >-
        the delivery package price owed before delivery is the smaller of the package price and the cap less the liability
        already booked under the award
    - when: otherwise
      method: the delivery package price owed before delivery is the package price
    baseline:
      aid_price: delivery_price
    evidence:
    - cross_category
    - date
    cross_difficulty: assist
  - id: early_payment_credit
    effect: parameter
    decides: early_credit_pct
    bindings:
    - days_to_delivery
    - early_credit_pct
    ladder:
    - when: sixty or more days to delivery
      value: K('early_far_pct') = 2 percent
    - when: thirty-five to fifty-nine days to delivery
      value: K('early_mid_pct') = 1 percent
    - when: otherwise (fewer than thirty-five)
      value: 0 percent
    baseline:
      early_credit_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: cesarean_amount
    effect: parameter
    decides: cesarean_amount
    bindings:
    - ces_acct
    - ces_acct_net
    - cesarean_last_date
    - cesarean_months
    - cesarean_amount
    ladder:
    - when: latest cesarean charge fewer than eighteen whole months back
      value: P('package_upgrade_differential_usd') = $2,850.00
    - when: eighteen or more and fewer than sixty whole months back
      value: half the differential = $1,425.00
    - when: otherwise
      value: $0.00
    baseline:
      cesarean_amount: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: encounter
  - id: pay_in_full_credit
    effect: parameter
    decides: full_credit_pct
    bindings:
    - latest_deposit_date
    - days_since_deposit
    - full_credit_pct
    ladder:
    - when: paid zero to seven days after the latest enrollment deposit
      value: K('full_near_pct') = 1.5 percent
    - when: paid eight to thirty days after
      value: K('full_mid_pct') = 0.5 percent
    - when: otherwise
      value: 0 percent
    baseline:
      full_credit_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The pre-delivery balance on a maternity and delivery package is the rest of the delivery package price: the delivery
      package price less the deposits held on the maternity estimate, rounded half-up to the cent. For the pre-delivery balance
      the delivery package price is the sum of the Riverbend facility line and the Riverbend professional line that carry
      the principal service code on the current version, and the deposits held on the maternity estimate are its deposit collections
      less every refund, retained fee and application drawn on them.
    params: []
  inputs:
    history:
    - table: estimate_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: estimate_deposit_collected
    - category: encounter
      table: encounter_transactions
      aggregate: latest
      field: service_date
      filters:
        event_type: encounter_charge_posted
        cpt_hcpcs_code: '59514'
    - category: assist
      table: assistance_transactions
      aggregate: sum
      field: fap_liability_usd
      filters:
        event_type: assist_encounter_applied
    cross_category:
    - assist
    - encounter
