    moderate_balance_points: 0.5
  rule: >-
    A patient who pays in full, inside the prompt-pay window, the remaining balance of a hospital account whose financial_class is SELF_PAY pays the self-pay payoff amount this rule fixes. For an account whose financial_class is SELF_PAY, and only for such an account, the prompt-pay discount and the payment amount due are figured as this rule states, the payment amount due being the self-pay balance standing less that discount and less the dollar credit stated below, and the discount together with that credit posts as a PROMPT_PAY_DISCOUNT adjustment whose source is the qualifying payment; an account of any other financial class is outside this sentence. The self-pay payoff amount is fixed only after a self-pay account that carries coverage-terminated liability postings, and whose first summary statement went out before any of them carried an uninsured discount, carries the service-recovery courtesy owed for that, unless the patient's courtesy for the calendar year was already used or the account's patient balance is 0.00 or less. The self-pay balance standing is the account's patient_balance immediately before the payment. The self-pay payoff discount is prompt_pay_discount_pct percent of the self-pay balance standing, rounded half-up to the cent, and the self-pay payoff amount is the self-pay balance standing less that discount. The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the self-pay payoff discount percent, the combined percent is applied once to the self-pay balance standing and rounded half-up to the cent, every adjustment stated in dollars is then subtracted from the self-pay balance standing together with that discount, and the self-pay payoff amount is never below 0.00. The gross charges standing are the account's charge lines less its charge credits: at least large_gross_usd adds large_gross_points percentage points to the self-pay payoff discount percent, at least moderate_gross_usd but below large_gross_usd adds moderate_gross_points percentage points, and less adds none. The statement recency is the plain difference in days between the statement date of the account's most recent SUMMARY_STATEMENT and the payment date: recent_statement_days or fewer adds recent_statement_points percentage points to the self-pay payoff discount percent, more than recent_statement_days but no more than older_statement_days adds older_statement_points percentage points, and a longer recency or no summary statement adds none. The window days left are prompt_pay_window_days less the calendar days counted from the day after first_statement_date through the payment date: when window_early_days or more are left, a dollar credit of early_day_credit_usd for each day left is subtracted; when at least one but fewer than window_early_days are left, a flat dollar credit of late_window_credit_usd is subtracted; when none is left, or the account has no first_statement_date, nothing is subtracted. The delivery channel of the account's most recent SUMMARY_STATEMENT, by statement date and, of two on the same date, the one recorded first, sets the self-pay e-statement allowance: PATIENT_PORTAL adds portal_points percentage points to the self-pay payoff discount percent, EMAIL_LINK adds email_link_points percentage points, and US_MAIL or no summary statement adds none. The account's POINT_OF_SERVICE payments (a payment made at registration) are totalled: at least pos_large_usd adds pos_large_points percentage points to the self-pay payoff discount percent, above 0.00 but below pos_large_usd adds pos_small_points percentage points, and none adds none. The balance band reads the account's ledger: its liability postings less its adjustments and payments, plus any refunds issued; a ledger balance of at least large_balance_usd adds large_balance_points percentage points to the self-pay payoff discount percent, at least moderate_balance_usd but below large_balance_usd adds moderate_balance_points percentage points, and less adds none.
  prerequisite:
  - problem: encounter_ext_service_recovery_courtesy
    kind: value_input
    gate: sp_balance
    form: state
    policy_source: >-
      The self-pay payoff amount is fixed only after a self-pay account that carries coverage-terminated liability postings, and whose first summary statement went out before any of them carried an uninsured discount, carries the service-recovery courtesy owed for that, unless the patient's courtesy for the calendar year was already used or the account's patient balance is 0.00 or less.
    condition: >-
      on an account whose financial_class is SELF_PAY, which carries COVERAGE_TERMINATED liability postings and whose earliest SUMMARY_STATEMENT is dated before the first UNINSURED_DISCOUNT sourced to such a posting (or which has no such discount), an encounter_adjustment_posted row with adjustment_code SERVICE_RECOVERY_COURTESY stands sourced to one of the account's COVERAGE_TERMINATED postings, unless a SERVICE_RECOVERY_COURTESY already stands for the patient in the same calendar year on another account or the account's patient_balance is 0.00 or less
    resolved_by: post_service_recovery_courtesy_69e36558
    effect: >-
      the courtesy lowers patient_balance, so sp_balance (the self-pay balance standing) and every figure built on it fall by the courtesy
  cross_category: []
  compute:
  - sp_balance: F('patient_balance')
  - sp_std_pct: P('prompt_pay_discount_pct')
  - sp_gross_standing: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_charge_posted') - SUM('encounter_transactions', 'amount', event_type='encounter_charge_credited')
  - sp_gross_points: >-
      K('large_gross_points') if sp_gross_standing >= K('large_gross_usd') else (K('moderate_gross_points') if sp_gross_standing >= K('moderate_gross_usd') else 0)
  - sp_last_statement: >-
      LATEST('encounter_transactions', 'posting_date', date_field='posting_date', event_type='encounter_statement_issued', statement_type='SUMMARY_STATEMENT') or ''
  - sp_recency: DAYS(sp_last_statement, NOW) if sp_last_statement != '' else 99999
  - sp_recency_points: >-
      K('recent_statement_points') if sp_recency <= K('recent_statement_days') else (K('older_statement_points') if sp_recency <= K('older_statement_days') else 0)
  - sp_days_left: >-
      P('prompt_pay_window_days') - DAYS(F('first_statement_date'), NOW) if F('first_statement_date') else 0
  - sp_window_credit: >-
      sp_days_left * K('early_day_credit_usd') if sp_days_left >= K('window_early_days') else (K('late_window_credit_usd') if sp_days_left >= 1 else 0)
  - sp_last_channel: >-
      LATEST('encounter_transactions', 'delivery_channel', date_field='posting_date', event_type='encounter_statement_issued', statement_type='SUMMARY_STATEMENT') or ''
  - sp_channel_points: >-
      K('portal_points') if sp_last_channel == 'PATIENT_PORTAL' else (K('email_link_points') if sp_last_channel == 'EMAIL_LINK' else 0)
  - sp_pos_paid: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_payment_posted', payment_channel='POINT_OF_SERVICE')
  - sp_pos_points: >-
      K('pos_large_points') if sp_pos_paid >= K('pos_large_usd') else (K('pos_small_points') if sp_pos_paid > 0 else 0)
  - sp_ledger_balance: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted') - SUM('encounter_transactions', 'amount', event_type='encounter_adjustment_posted') - SUM('encounter_transactions', 'amount', event_type='encounter_payment_posted') + SUM('encounter_transactions', 'amount', event_type='encounter_refund_issued')
  - sp_balance_points: >-
      K('large_balance_points') if sp_ledger_balance >= K('large_balance_usd') else (K('moderate_balance_points') if sp_ledger_balance >= K('moderate_balance_usd') else 0)
  - sp_total_pct: >-
      sp_std_pct + sp_gross_points + sp_recency_points + sp_channel_points + sp_pos_points + sp_balance_points
  - sp_discount: RND(sp_balance * sp_total_pct / 100, 2)
  - result: MX(0, sp_balance - sp_discount - sp_window_credit)
