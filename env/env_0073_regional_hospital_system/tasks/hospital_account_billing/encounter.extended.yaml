    statement_consolidation: GUARANTOR_CONSOLIDATED

# ---- data flow (every write is an event) ----
events:
  - type: encounter_registered
    target: encounter_accounts
    mutation: create
    meaning: Registration opens a hospital account for one encounter (or one plan-of-care series) of the patient.
    grain: one row per registered encounter
    fields: {encounter_id: new account id, customer_id: the patient, variant_name: patient-class tier, facility: campus of service, financial_class: financial class from registration, service_classification: clinical classification, service_start_date: date of service or arrival, account_opened_date: registration date}
    triggers: []
  - type: encounter_charge_posted
    target: encounter_transactions
    meaning: One chargemaster line is posted to the account from a clinical department.
    grain: one row per charge line
    distinguish_by: [line_number]
    fields: {line_number: charge line sequence, cdm_code: chargemaster code, cpt_hcpcs_code: procedure code, revenue_code: UB-04 revenue code, service_date: date rendered, units: billed units, amount: gross charge of the line, posting_date: posting date}
    account: gross_charges
    direction: in
    triggers: []
  - type: encounter_charge_credited
    target: encounter_transactions
    meaning: A posted charge line is credited in whole or in part (duplicate, service not rendered, units correction, late charge past window, non-billable supply).
    grain: one row per credit against one charge line for one reason
    distinguish_by: [source_txn_id, credit_reason_code]
    fields: {source_txn_id: the charge line credited, credit_reason_code: reason for the credit, amount: gross amount credited, posting_date: posting date}
    account: gross_charges
    direction: out
    triggers: []
  - type: encounter_liability_posted
    target: encounter_transactions
    meaning: Patient liability posts to the account — the full self-pay final bill, or a patient-responsibility amount reported by a payer on adjudication.
    grain: one row per liability source per claim (or per self-pay final bill)
    distinguish_by: [liability_source, claim_id, posting_date]
    fields: {liability_source: origin of the liability, claim_id: adjudicated claim (empty for self-pay), amount: liability amount, posting_date: posting date}
    account: patient_balance
    direction: in
    triggers:
      - event: encounter:encounter_adjustment_posted
        when: {liability_source: SELF_PAY_FINAL_BILL}
        map: {adjustment_code: UNINSURED_DISCOUNT, posting_date: posting_date}
  - type: encounter_adjustment_posted
    target: encounter_transactions
    meaning: A discount, write-off or adjustment reduces the patient balance (uninsured, prompt-pay, charity, charge correction, small balance, courtesy, dispute determination, package price, rebill transfer).
    grain: one row per adjustment code per source transaction
    distinguish_by: [adjustment_code, source_txn_id]
    fields: {adjustment_code: kind of adjustment, source_txn_id: "the liability posting, charge credit or payment the adjustment is computed from", amount: adjustment amount, posting_date: posting date}
    account: patient_balance
    direction: out
    triggers: []
  - type: encounter_payment_posted
    target: encounter_transactions
    meaning: A patient payment is applied to the account (card, bank draft, check, point of service, plan installment or applied deposit).
    grain: one row per payment confirmation applied to one account
    distinguish_by: [payment_reference]
    fields: {payment_channel: how received, payment_reference: confirmation number, amount: amount applied, posting_date: posting date}
    account: patient_balance
    direction: out
    triggers: []
  - type: encounter_refund_issued
    target: encounter_transactions
    meaning: A credit balance is refunded to the patient against the payment that created it.
    grain: one row per refunded source payment
    distinguish_by: [source_txn_id]
    fields: {source_txn_id: the payment refunded, refund_method: payout method, amount: refund amount, posting_date: posting date}
    account: patient_balance
    direction: in
    triggers: []
  - type: encounter_statement_issued
    target: encounter_transactions
    meaning: A patient statement (summary, itemized, or final notice) is generated for the account.
    grain: one row per statement of a type and sequence
    distinguish_by: [statement_type, statement_cycle]
    fields: {statement_type: kind of statement, statement_cycle: sequence of that type, delivery_channel: how delivered, amount: always 0.00, posting_date: statement date}
    triggers:
      - event: encounter:encounter_first_statement_recorded
        when: {statement_type: SUMMARY_STATEMENT, statement_cycle: 1}
        map: {first_statement_date: posting_date}
  - type: encounter_first_statement_recorded
    target: encounter_accounts
    mutation: update
    meaning: The date of the first post-discharge summary statement is stamped on the account.
    grain: one row per transaction
    fields: {first_statement_date: date of the first summary statement}
    triggers: []
  - type: encounter_billed_to_insurance
    target: encounter_accounts
    mutation: {transition: {from: pending_billing, to: insurance_pending}}
    meaning: The final bill drops to the primary payer.
    grain: one row per transaction
    fields: {status: insurance_pending, final_bill_date: bill drop date, financial_class: payer class billed}
    triggers:
      - event: claim:claim_submitted
        map: {encounter_id: encounter_id}
  - type: encounter_self_pay_billed
    target: encounter_accounts
    mutation: {transition: {from: pending_billing, to: patient_due}}
    meaning: The final bill drops to the patient on a SELF_PAY account.
    grain: one row per transaction
    fields: {status: patient_due, final_bill_date: bill drop date}
    triggers:
      - event: encounter:encounter_liability_posted
        map: {liability_source: SELF_PAY_FINAL_BILL}
  - type: encounter_patient_responsibility_due
    target: encounter_accounts
    mutation: {transition: {from: insurance_pending, to: patient_due}}
    meaning: The payer adjudicated with patient responsibility and the account moves to patient billing.
    grain: one row per transaction
    fields: {status: patient_due}
    triggers: []
  - type: encounter_hold_placed
    target: encounter_accounts
    mutation: {transition: {from: patient_due, to: billing_hold}}
    meaning: A representative places a billing hold for a stated reason.
    grain: one row per transaction
    fields: {status: billing_hold, billing_hold_reason: hold reason, hold_started_date: hold start, holds_used_count: holds used including this one}
    triggers: []
  - type: encounter_hold_released
    target: encounter_accounts
    mutation: {transition: {from: billing_hold, to: patient_due}}
    meaning: The hold ends and statements resume.
    grain: one row per transaction
    fields: {status: patient_due, billing_hold_reason: reset to NONE, hold_started_date: cleared}
    triggers: []
  - type: encounter_rebilled_to_insurance
    target: encounter_accounts
    mutation: {transition: [{from: patient_due, to: insurance_pending}, {from: billing_hold, to: insurance_pending}]}
    meaning: Newly reported coverage is verified and the account is rebilled to that payer.
    grain: one row per transaction
    fields: {status: insurance_pending, financial_class: new payer class, billing_hold_reason: reset to NONE, hold_started_date: cleared}
    triggers:
      - event: claim:claim_submitted
        map: {encounter_id: encounter_id}
      - event: encounter:encounter_adjustment_posted
        map: {adjustment_code: INSURANCE_REBILL_TRANSFER}
  - type: encounter_placed_with_agency
    target: encounter_accounts
    mutation: {transition: {from: patient_due, to: bad_debt}}
    meaning: The account is placed with the collection agency.
    grain: one row per transaction
    fields: {status: bad_debt, bad_debt_placement_date: placement date}
    triggers: []
  - type: encounter_recalled_from_agency
    target: encounter_accounts
    mutation: {transition: {from: bad_debt, to: patient_due}}
    meaning: The account is recalled from the agency to in-house servicing.
    grain: one row per transaction
    fields: {status: patient_due, bad_debt_placement_date: kept as history}
    triggers: []
  - type: encounter_closed
    target: encounter_accounts
    mutation: {transition: [{from: insurance_pending, to: closed}, {from: patient_due, to: closed}, {from: billing_hold, to: closed}, {from: bad_debt, to: closed}]}
    meaning: The account closes at a zero patient balance.
    grain: one row per transaction
    fields: {status: closed, closed_date: closing date}
    triggers: []
  - type: encounter_coverage_updated
    target: encounter_accounts
    mutation: update
    meaning: The financial class on the account is corrected after coverage is verified or found terminated.
    grain: one row per transaction
    fields: {financial_class: verified financial class}
    triggers: []

# ---- derived measures ----
measures:
  - id: encounter_msr_courtesy_cy
    window: the calendar year (January 1 to December 31) containing the posting date being decided
    measure: count of encounter_adjustment_posted rows with adjustment_code SERVICE_RECOVERY_COURTESY across all encounters of the patient
  - id: encounter_msr_summary_statements
    window: the life of the encounter up to the decision date
    measure: count of encounter_statement_issued rows with statement_type SUMMARY_STATEMENT on the encounter
  - id: encounter_msr_disputes_filed
    window: the life of the encounter up to the decision date
    measure: count of encounter_billing_inquiries rows with inquiry_type CHARGE_DISPUTE on the encounter

# ---- policies ----
policies:
  - id: encounter_agg_multi_holding
    subject: [encounter_registered]
    rule: >-
      A patient may hold any number of hospital accounts at once; registration opens one account per encounter, and one account per plan of care for a recurring outpatient therapy series. A new encounter is never merged into an existing account, and a recurring series is never split into per-visit accounts. The patient-class tier of an account is fixed by the registration type in its entry gate and is not changed after registration.
    eligibility: []
    params: {max_per_customer: null}
  - id: encounter_agg_payment_application
    subject: [encounter_payment_posted, encounter_refund_issued, encounter_statement_issued]
    rule: >-
      All patient_due accounts of one patient are serviced together. A payment the patient designates to a specific account is applied to that account only. An undesignated payment is applied across the patient's patient_due accounts in the order fixed by payment_application_order, each account receiving at most its current patient_balance before the next account is reached. When credit_offset_open_balances is true, a credit balance on one account is applied to the patient's other patient_due accounts in the same order before any refund is considered, and only the credit left after that offset is refundable. Summary statements consolidate every patient_due account of the patient into one mailing per statement cycle (statement_consolidation), but each account carries its own statement sequence and its own first_statement_date. A card payment larger than card_payment_max_usd is refused and must be split or paid by ACH bank draft.
    eligibility: []
    params: {payment_application_order: "=payment_application_order", credit_offset_open_balances: "=credit_offset_open_balances", statement_consolidation: "=statement_consolidation", card_payment_max_usd: "=card_payment_max_usd"}
  - id: encounter_final_bill_and_liability
    subject: [encounter_registered, encounter_charge_posted, encounter_billed_to_insurance, encounter_self_pay_billed, encounter_patient_responsibility_due, encounter_liability_posted, encounter_closed]
    rule: >-
      Charges accrue on a pending_billing account until the final bill drops bill_hold_days calendar days after service_end_date (for a MONTHLY_SERIES account, after the last day of each service month, each month being billed separately). An account whose financial_class is SELF_PAY drops to the patient: the whole net gross charges post as one SELF_PAY_FINAL_BILL liability and the uninsured discount follows. Any other financial class drops to the primary payer as a claim. When the payer adjudicates, only amounts the payer reports as patient responsibility (deductible, coinsurance, copay, non-covered service, coverage terminated) post as liability, each as its own posting carrying the claim reference; amounts the payer reports as a contractual obligation are never billed to the patient. If no adjudication is received within insurance_no_response_days of the claim's submitted date, the account is reviewed by billing and stays insurance_pending; the patient is not billed for an unadjudicated claim. An account closes when its patient balance reaches zero, or when the payer pays in full leaving nothing to the patient. Riverbend charges no interest (interest_rate_pct) and no late fees on any patient balance.
    eligibility: []
    params: {bill_hold_days: "=bill_hold_days", billing_frequency: "=billing_frequency", insurance_no_response_days: "=insurance_no_response_days", interest_rate_pct: "=interest_rate_pct"}
  - id: encounter_uninsured_discount
    subject: [encounter_liability_posted, encounter_adjustment_posted]
    rule: >-
      The uninsured discount applies only when the account's financial_class is SELF_PAY at final bill. It is posted once per SELF_PAY_FINAL_BILL liability, as an UNINSURED_DISCOUNT adjustment whose source is that liability posting, at uninsured_discount_pct of the liability for EMERGENCY and MEDICALLY_NECESSARY services and at uninsured_discount_elective_pct for ELECTIVE_NON_COVERED services. On an insured account, a NONCOVERED_SERVICE liability line receives the same uninsured_discount_pct only on tiers where uninsured_discount_on_noncovered_insured is true; deductible, coinsurance and copay amounts never receive it. Discount amounts are rounded half-up to the cent. An account priced under a Riverbend self-pay package receives the PACKAGE_PRICE_ADJUSTMENT instead and never the uninsured discount. A later financial-assistance charity adjustment is computed by the assistance program on its own basis and does not reverse the uninsured discount.
    eligibility:
      - id: self_pay_class
        applies_to: [encounter_adjustment_posted]
        kind: authorization
        condition: The uninsured discount applies only when the account's financial_class is SELF_PAY at final bill.
        evidence_fields: [encounter_accounts.financial_class, encounter_accounts.encounter_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_accounts.encounter_id]]
          action_bindings: {encounter_accounts.encounter_id: encounter_id}
    params:
      per_tier:
        Outpatient Clinic Visit Account: {discount_pct: "=uninsured_discount_pct", elective_pct: "=uninsured_discount_elective_pct", noncovered_insured: "=uninsured_discount_on_noncovered_insured"}
        Outpatient Diagnostic Imaging & Lab Account: {discount_pct: "=uninsured_discount_pct", elective_pct: "=uninsured_discount_elective_pct", noncovered_insured: "=uninsured_discount_on_noncovered_insured"}
        Recurring Outpatient Therapy Account: {discount_pct: "=uninsured_discount_pct", elective_pct: "=uninsured_discount_elective_pct", noncovered_insured: "=uninsured_discount_on_noncovered_insured"}
        Emergency Department Visit Account: {discount_pct: "=uninsured_discount_pct", elective_pct: "=uninsured_discount_elective_pct", noncovered_insured: "=uninsured_discount_on_noncovered_insured"}
        Outpatient Surgery Account: {discount_pct: "=uninsured_discount_pct", elective_pct: "=uninsured_discount_elective_pct", noncovered_insured: "=uninsured_discount_on_noncovered_insured"}
        Observation Stay Account: {discount_pct: "=uninsured_discount_pct", elective_pct: "=uninsured_discount_elective_pct", noncovered_insured: "=uninsured_discount_on_noncovered_insured"}
        Inpatient Admission Account: {discount_pct: "=uninsured_discount_pct", elective_pct: "=uninsured_discount_elective_pct", noncovered_insured: "=uninsured_discount_on_noncovered_insured"}
      rounding: "=uninsured_discount_rounding"
    formula:
      when: adjustment_code == "UNINSURED_DISCOUNT"
      uninsured_discount_amount: round(amount * uninsured_discount_pct / 100, 2)
  - id: encounter_prompt_pay_discount
    subject: [encounter_payment_posted, encounter_adjustment_posted]
    rule: >-
      A patient who pays the entire remaining balance of one account in a single payment earns the prompt-pay discount on that account. The full payment must post no later than the prompt-pay window counted from the first post-discharge statement date. Count calendar days starting the day after first_statement_date; a payment whose posting_date is the last day of the window still qualifies. The discount is prompt_pay_discount_pct of the patient balance standing immediately before the payment (after the uninsured discount when prompt_pay_stacks_with_uninsured is true), rounded half-up to the cent, and the payment amount due is that balance less the discount; the discount posts as a PROMPT_PAY_DISCOUNT adjustment whose source is the qualifying payment. The discount is not available when the balance before payment is below prompt_pay_min_balance_usd, when the payment channel is not in prompt_pay_eligible_channels, when the account has received a FAP_CHARITY_ADJUSTMENT (prompt_pay_excluded_after_fap), or when the account is enrolled in an active or past_due Riverbend payment plan (prompt_pay_excluded_in_payment_plan). A partial payment never earns a partial discount, and the discount is posted at most once per account.
    eligibility:
      - id: prompt_window
        applies_to: [encounter_adjustment_posted]
        kind: time
        condition: The full payment must post no later than the prompt-pay window counted from the first post-discharge statement date.
        evidence_fields: [encounter_accounts.first_statement_date, encounter_accounts.encounter_id, encounter_transactions.posting_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_accounts.encounter_id]]
          action_bindings: {encounter_accounts.encounter_id: encounter_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the first post-discharge statement date
          anchor_source: encounter_accounts.first_statement_date
          relation: not_after
          duration_source: variants.prompt_pay_window_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after first_statement_date; a payment whose posting_date is the last day of the window still qualifies.
          boundary: inclusive
      - id: one_prompt_discount
        applies_to: [encounter_adjustment_posted]
        kind: dedup
        condition: A partial payment never earns a partial discount, and the discount is posted at most once per account.
        evidence_fields: [encounter_transactions.encounter_id, encounter_transactions.adjustment_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_transactions.encounter_id]]
          action_bindings: {encounter_transactions.encounter_id: encounter_id}
        dedup_contract:
          table: encounter_transactions
          mode: separate_record
          object_bindings: {encounter_id: encounter_id}
          duplicate_filters: {adjustment_code: [PROMPT_PAY_DISCOUNT]}
          distinct_fields: []
    params:
      per_tier:
        Outpatient Clinic Visit Account: {pct: "=prompt_pay_discount_pct", window_days: "=prompt_pay_window_days", min_balance: "=prompt_pay_min_balance_usd"}
        Outpatient Diagnostic Imaging & Lab Account: {pct: "=prompt_pay_discount_pct", window_days: "=prompt_pay_window_days", min_balance: "=prompt_pay_min_balance_usd"}
        Recurring Outpatient Therapy Account: {pct: "=prompt_pay_discount_pct", window_days: "=prompt_pay_window_days", min_balance: "=prompt_pay_min_balance_usd"}
        Emergency Department Visit Account: {pct: "=prompt_pay_discount_pct", window_days: "=prompt_pay_window_days", min_balance: "=prompt_pay_min_balance_usd"}
        Outpatient Surgery Account: {pct: "=prompt_pay_discount_pct", window_days: "=prompt_pay_window_days", min_balance: "=prompt_pay_min_balance_usd"}
        Observation Stay Account: {pct: "=prompt_pay_discount_pct", window_days: "=prompt_pay_window_days", min_balance: "=prompt_pay_min_balance_usd"}
        Inpatient Admission Account: {pct: "=prompt_pay_discount_pct", window_days: "=prompt_pay_window_days", min_balance: "=prompt_pay_min_balance_usd"}
      eligible_channels: "=prompt_pay_eligible_channels"
      stacks_with_uninsured: "=prompt_pay_stacks_with_uninsured"
      excluded_after_fap: "=prompt_pay_excluded_after_fap"
      excluded_in_payment_plan: "=prompt_pay_excluded_in_payment_plan"
    formula:
      when_not: patient_balance < prompt_pay_min_balance_usd
      prompt_pay_discount: round(patient_balance * prompt_pay_discount_pct / 100, 2)
      payment_due: patient_balance - prompt_pay_discount
  - id: encounter_itemized_statement
    subject: [encounter_statement_issued]
    rule: >-
      Any patient may request an itemized statement listing every charge line (date, CDM code, CPT/HCPCS code, revenue code, units and charge) and every payment and adjustment on an account. An itemized statement is available once the final bill has dropped; an account still pending_billing receives none because its charges are not final. It is issued free of charge (itemized_statement_fee_usd) within itemized_statement_turnaround_business_days business days of the request, counting Monday through Friday and excluding Riverbend holidays, through any channel in itemized_statement_channels the patient chooses. Each request is logged as an ITEMIZED_STATEMENT_REQUEST inquiry and produces one ITEMIZED_STATEMENT with the next itemized sequence number; a repeat request produces a new sequence. On request, collection activity beyond the current statement cycle (a further summary statement, the final notice and agency placement) pauses for itemized_statement_collection_pause_days calendar days from the request.
    eligibility:
      - id: final_bill_dropped
        applies_to: [encounter_statement_issued]
        kind: state
        condition: An itemized statement is available once the final bill has dropped; an account still pending_billing receives none because its charges are not final.
        evidence_fields: [encounter_accounts.status, encounter_accounts.encounter_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_accounts.encounter_id]]
          action_bindings: {encounter_accounts.encounter_id: encounter_id}
        state_contract:
          field: encounter_accounts.status
          allowed: [insurance_pending, patient_due, billing_hold, bad_debt, closed]
    params:
      per_tier:
        Outpatient Clinic Visit Account: {turnaround_business_days: "=itemized_statement_turnaround_business_days", pause_days: "=itemized_statement_collection_pause_days"}
        Outpatient Diagnostic Imaging & Lab Account: {turnaround_business_days: "=itemized_statement_turnaround_business_days", pause_days: "=itemized_statement_collection_pause_days"}
        Recurring Outpatient Therapy Account: {turnaround_business_days: "=itemized_statement_turnaround_business_days", pause_days: "=itemized_statement_collection_pause_days"}
        Emergency Department Visit Account: {turnaround_business_days: "=itemized_statement_turnaround_business_days", pause_days: "=itemized_statement_collection_pause_days"}
        Outpatient Surgery Account: {turnaround_business_days: "=itemized_statement_turnaround_business_days", pause_days: "=itemized_statement_collection_pause_days"}
        Observation Stay Account: {turnaround_business_days: "=itemized_statement_turnaround_business_days", pause_days: "=itemized_statement_collection_pause_days"}
        Inpatient Admission Account: {turnaround_business_days: "=itemized_statement_turnaround_business_days", pause_days: "=itemized_statement_collection_pause_days"}
      fee_usd: "=itemized_statement_fee_usd"
      channels: "=itemized_statement_channels"
  - id: encounter_statement_and_collection_cycle
    subject: [encounter_statement_issued, encounter_first_statement_recorded, encounter_placed_with_agency, encounter_recalled_from_agency]
    rule: >-
      A patient_due account with a patient balance of at least statement_min_balance_usd receives a SUMMARY_STATEMENT every statement_cycle_days calendar days; the date of the first one is stamped as first_statement_date. After summary_statements_before_final_notice summary statements (counted by encounter_msr_summary_statements), the next statement is a FINAL_NOTICE, always delivered by final_notice_channel; the final notice states the collection action Riverbend may take and the deadline, and includes the plain-language summary of the Financial Assistance Policy. No extraordinary collection action may begin until eca_notification_period_days have passed from first_statement_date and the final notice has preceded it by at least final_notice_lead_days. Placement may occur no earlier than the placement day counted from the first post-discharge statement date. Count calendar days starting the day after first_statement_date, the placement day being day bad_debt_placement_after_days itself. Only a balance of at least bad_debt_min_balance_usd is placed; a smaller balance stays in house on statements. A placed balance may be credit-reported only when it is at least credit_reporting_min_balance_usd and at least credit_reporting_min_age_days have passed from first_statement_date; Riverbend never sues, garnishes wages or places liens (legal_action_permitted). An account on billing_hold receives no statement beyond the current cycle and is never placed. An account placed with the agency is recalled to patient_due when the patient submits a financial assistance application within the assistance application period, when a charge dispute or good-faith-estimate dispute is accepted on it, or when billing finds the placed balance was misstated.
    eligibility:
      - id: placement_day
        applies_to: [encounter_placed_with_agency]
        kind: time
        condition: Placement may occur no earlier than the placement day counted from the first post-discharge statement date.
        evidence_fields: [encounter_accounts.first_statement_date, encounter_accounts.encounter_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_accounts.encounter_id]]
          action_bindings: {encounter_accounts.encounter_id: encounter_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the first post-discharge statement date
          anchor_source: encounter_accounts.first_statement_date
          relation: not_before
          duration_source: variants.bad_debt_placement_after_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after first_statement_date, the placement day being day bad_debt_placement_after_days itself.
          boundary: inclusive
    params:
      per_tier:
        Outpatient Clinic Visit Account: {statements_before_final: "=summary_statements_before_final_notice", placement_min_balance: "=bad_debt_min_balance_usd"}
        Outpatient Diagnostic Imaging & Lab Account: {statements_before_final: "=summary_statements_before_final_notice", placement_min_balance: "=bad_debt_min_balance_usd"}
        Recurring Outpatient Therapy Account: {statements_before_final: "=summary_statements_before_final_notice", placement_min_balance: "=bad_debt_min_balance_usd"}
        Emergency Department Visit Account: {statements_before_final: "=summary_statements_before_final_notice", placement_min_balance: "=bad_debt_min_balance_usd"}
        Outpatient Surgery Account: {statements_before_final: "=summary_statements_before_final_notice", placement_min_balance: "=bad_debt_min_balance_usd"}
        Observation Stay Account: {statements_before_final: "=summary_statements_before_final_notice", placement_min_balance: "=bad_debt_min_balance_usd"}
        Inpatient Admission Account: {statements_before_final: "=summary_statements_before_final_notice", placement_min_balance: "=bad_debt_min_balance_usd"}
      statement_cycle_days: "=statement_cycle_days"
      statement_min_balance_usd: "=statement_min_balance_usd"
      eca_notification_period_days: "=eca_notification_period_days"
      final_notice_lead_days: "=final_notice_lead_days"
      final_notice_channel: "=final_notice_channel"
      placement_after_days: "=bad_debt_placement_after_days"
      credit_reporting_min_balance_usd: "=credit_reporting_min_balance_usd"
      credit_reporting_min_age_days: "=credit_reporting_min_age_days"
      legal_action_permitted: "=legal_action_permitted"
    measures: [encounter_msr_summary_statements]
  - id: encounter_charge_dispute_and_correction
    subject: [encounter_charge_credited, encounter_adjustment_posted]
    rule: >-
      A patient may dispute a specific charge line. A charge dispute is accepted only within the dispute filing window counted from the date of the first statement that listed the disputed charge. Count calendar days starting the day after that statement's posting_date; a dispute logged on the last day of the window is accepted. Each dispute is logged as a CHARGE_DISPUTE inquiry naming the disputed charge line, at most max_charge_disputes_per_encounter per account (encounter_msr_disputes_filed), and is answered within charge_dispute_response_business_days business days. A representative may credit a disputed line when the account's records show the error — a duplicate of another line with the same cdm_code, service_date and units (credited without review when duplicate_charge_auto_credit is true), units billed above the units documented, a supply that is not separately billable, or a service the encounter record shows was not rendered — provided the credit does not exceed rep_charge_credit_authority_usd; a larger credit is forwarded to coding review (FORWARDED_CODING_REVIEW) and is not posted by the representative. A charge line is credited at most once for the same reason. On a SELF_PAY account already billed to the patient, the credited gross amount also reduces the patient balance by a CHARGE_CORRECTION_ADJUSTMENT equal to the credited amount less the uninsured discount already granted on it (credited amount times one minus the discount percent that was applied, rounded half-up to the cent), sourced to the charge credit. On an insured account the credit produces a corrected claim to the payer and no patient-balance adjustment until the payer re-adjudicates.
    eligibility:
      - id: dispute_window
        applies_to: [encounter_charge_credited]
        kind: time
        condition: A charge dispute is accepted only within the dispute filing window counted from the date of the first statement that listed the disputed charge.
        evidence_fields: [encounter_transactions.posting_date, encounter_transactions.encounter_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_transactions.encounter_id]]
          action_bindings: {encounter_transactions.encounter_id: encounter_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the first statement that listed the disputed charge
          anchor_source: encounter_transactions.posting_date
          relation: not_after
          duration_source: variants.charge_dispute_filing_window_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after that statement's posting_date; a dispute logged on the last day of the window is accepted.
          boundary: inclusive
      - id: one_credit_per_reason
        applies_to: [encounter_charge_credited]
        kind: dedup
        condition: A charge line is credited at most once for the same reason.
        evidence_fields: [encounter_transactions.source_txn_id, encounter_transactions.credit_reason_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_transactions.source_txn_id]]
          action_bindings: {encounter_transactions.source_txn_id: source_txn_id}
        dedup_contract:
          table: encounter_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [encounter_charge_credited]}
          distinct_fields: [credit_reason_code]
    params:
      per_tier:
        Outpatient Clinic Visit Account: {authority_usd: "=rep_charge_credit_authority_usd", response_business_days: "=charge_dispute_response_business_days"}
        Outpatient Diagnostic Imaging & Lab Account: {authority_usd: "=rep_charge_credit_authority_usd", response_business_days: "=charge_dispute_response_business_days"}
        Recurring Outpatient Therapy Account: {authority_usd: "=rep_charge_credit_authority_usd", response_business_days: "=charge_dispute_response_business_days"}
        Emergency Department Visit Account: {authority_usd: "=rep_charge_credit_authority_usd", response_business_days: "=charge_dispute_response_business_days"}
        Outpatient Surgery Account: {authority_usd: "=rep_charge_credit_authority_usd", response_business_days: "=charge_dispute_response_business_days"}
        Observation Stay Account: {authority_usd: "=rep_charge_credit_authority_usd", response_business_days: "=charge_dispute_response_business_days"}
        Inpatient Admission Account: {authority_usd: "=rep_charge_credit_authority_usd", response_business_days: "=charge_dispute_response_business_days"}
      filing_window_days: "=charge_dispute_filing_window_days"
      max_disputes: "=max_charge_disputes_per_encounter"
      duplicate_auto_credit: "=duplicate_charge_auto_credit"
    formula:
      when: adjustment_code == "CHARGE_CORRECTION_ADJUSTMENT"
      correction_adjustment: round(amount * (1 - uninsured_discount_pct / 100), 2)
    measures: [encounter_msr_disputes_filed]
  - id: encounter_billing_hold
    subject: [encounter_hold_placed, encounter_hold_released]
    rule: >-
      A representative places a billing hold on a patient_due account for exactly one reason, and only within the hold allowance: an account receives at most max_billing_holds_per_encounter holds over its life (holds_used_count). The hold length depends on the reason — ITEMIZATION_REVIEW lasts itemized_statement_collection_pause_days, CHARGE_DISPUTE lasts charge_dispute_hold_days, COVERAGE_UPDATE_PENDING lasts coverage_update_hold_days, each counted in calendar days from hold_started_date; FAP_APPLICATION_PENDING lasts until the assistance determination; GFE_DISPUTE_PENDING lasts until the dispute outcome. A FAP_APPLICATION_PENDING hold requires an assistance application of the patient on file in submitted or pending_documents status. A GFE_DISPUTE_PENDING hold requires a good-faith estimate of the patient linked to this account in in_dispute status. The hold is released when its reason is resolved or its length lapses, whichever comes first; release resets billing_hold_reason to NONE. When the allowance is exhausted, a pending financial assistance application or good-faith-estimate dispute still stops every collection action on the account under those programs' own rules, but no further hold status is placed.
    eligibility:
      - id: fap_application_on_file
        applies_to: [encounter_hold_placed]
        kind: authorization
        condition: A FAP_APPLICATION_PENDING hold requires an assistance application of the patient on file in submitted or pending_documents status.
        evidence_fields: [assistance_cases.status, assistance_cases.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[assistance_cases.customer_id]]
          action_bindings: {assistance_cases.customer_id: customer_id}
      - id: gfe_dispute_on_file
        applies_to: [encounter_hold_placed]
        kind: authorization
        condition: A GFE_DISPUTE_PENDING hold requires a good-faith estimate of the patient linked to this account in in_dispute status.
        evidence_fields: [price_estimates.status, price_estimates.encounter_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[price_estimates.encounter_id]]
          action_bindings: {price_estimates.encounter_id: encounter_id}
    params:
      per_tier:
        Outpatient Clinic Visit Account: {dispute_hold_days: "=charge_dispute_hold_days", itemization_hold_days: "=itemized_statement_collection_pause_days"}
        Outpatient Diagnostic Imaging & Lab Account: {dispute_hold_days: "=charge_dispute_hold_days", itemization_hold_days: "=itemized_statement_collection_pause_days"}
        Recurring Outpatient Therapy Account: {dispute_hold_days: "=charge_dispute_hold_days", itemization_hold_days: "=itemized_statement_collection_pause_days"}
        Emergency Department Visit Account: {dispute_hold_days: "=charge_dispute_hold_days", itemization_hold_days: "=itemized_statement_collection_pause_days"}
        Outpatient Surgery Account: {dispute_hold_days: "=charge_dispute_hold_days", itemization_hold_days: "=itemized_statement_collection_pause_days"}
        Observation Stay Account: {dispute_hold_days: "=charge_dispute_hold_days", itemization_hold_days: "=itemized_statement_collection_pause_days"}
        Inpatient Admission Account: {dispute_hold_days: "=charge_dispute_hold_days", itemization_hold_days: "=itemized_statement_collection_pause_days"}
      max_holds: "=max_billing_holds_per_encounter"
      coverage_update_hold_days: "=coverage_update_hold_days"
  - id: encounter_refund_and_credit_balance
    subject: [encounter_refund_issued]
    rule: >-
      A credit balance (a negative patient_balance) arises when payments exceed what the patient owes after later adjustments. The credit is first offset against the patient's other patient_due accounts under the payment-application rule; the remaining credit is refunded only when it is at least refund_min_credit_usd, within refund_issue_days calendar days of the date the credit arose. The refund is booked against the payment that created the credit, most recent payment first, never refunding more than that payment's amount. A payment is refunded at most once. The refund goes back to the original card when the source payment was a card payment posted no more than refund_card_max_age_days calendar days before the refund date, by ACH_CREDIT when the source was an ACH bank draft, and by PAPER_CHECK otherwise. A credit below refund_min_credit_usd stays on the profile and offsets the patient's next liability.
    eligibility:
      - id: one_refund_per_payment
        applies_to: [encounter_refund_issued]
        kind: dedup
        condition: A payment is refunded at most once.
        evidence_fields: [encounter_transactions.source_txn_id, encounter_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_transactions.source_txn_id]]
          action_bindings: {encounter_transactions.source_txn_id: source_txn_id}
        dedup_contract:
          table: encounter_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [encounter_refund_issued]}
          distinct_fields: []
    params: {refund_min_credit_usd: "=refund_min_credit_usd", refund_issue_days: "=refund_issue_days", refund_card_max_age_days: "=refund_card_max_age_days"}
    formula:
      when: patient_balance < 0
      refund_amount: abs(patient_balance)
  - id: encounter_small_balance_and_courtesy
    subject: [encounter_adjustment_posted, encounter_closed]
    rule: >-
      When a patient_due account's remaining balance is greater than zero and at or below small_balance_write_off_usd after a payment or adjustment, the remainder is written off as SMALL_BALANCE_WRITE_OFF and the account closes. A representative may grant one SERVICE_RECOVERY_COURTESY adjustment on an account when the patient reports a documented service failure (a billing error already corrected on the account, or a statement sent during an active billing hold), up to service_recovery_courtesy_max_usd and never more than the current patient balance. Only one courtesy adjustment is allowed per patient per calendar year across all accounts. A courtesy adjustment is never granted on an account in bad_debt status or on a balance under an active payment plan, and it is not combined with a prompt-pay discount on the same account.
    eligibility:
      - id: courtesy_once_per_year
        applies_to: [encounter_adjustment_posted]
        kind: dedup
        condition: Only one courtesy adjustment is allowed per patient per calendar year across all accounts.
        evidence_fields: [encounter_transactions.customer_id, encounter_transactions.adjustment_code, encounter_transactions.posting_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_transactions.customer_id]]
          action_bindings: {encounter_transactions.customer_id: customer_id}
        dedup_contract:
          table: encounter_transactions
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {adjustment_code: [SERVICE_RECOVERY_COURTESY]}
          distinct_fields: [posting_date]
    params:
      per_tier:
        Outpatient Clinic Visit Account: {courtesy_max_usd: "=service_recovery_courtesy_max_usd"}
        Outpatient Diagnostic Imaging & Lab Account: {courtesy_max_usd: "=service_recovery_courtesy_max_usd"}
        Recurring Outpatient Therapy Account: {courtesy_max_usd: "=service_recovery_courtesy_max_usd"}
        Emergency Department Visit Account: {courtesy_max_usd: "=service_recovery_courtesy_max_usd"}
        Outpatient Surgery Account: {courtesy_max_usd: "=service_recovery_courtesy_max_usd"}
        Observation Stay Account: {courtesy_max_usd: "=service_recovery_courtesy_max_usd"}
        Inpatient Admission Account: {courtesy_max_usd: "=service_recovery_courtesy_max_usd"}
      small_balance_write_off_usd: "=small_balance_write_off_usd"
      courtesy_per_year: "=service_recovery_courtesy_per_year"
    formula:
      when: adjustment_code == "SERVICE_RECOVERY_COURTESY"
      courtesy_amount: min(service_recovery_courtesy_max_usd, patient_balance)
    measures: [encounter_msr_courtesy_cy]
  - id: encounter_coverage_update_rebill
    subject: [encounter_coverage_updated, encounter_rebilled_to_insurance, encounter_adjustment_posted]
    rule: >-
      A patient who reports insurance that was active on the date of service, after the account was billed as SELF_PAY or to a different payer, has the coverage verified while the account may sit on a COVERAGE_UPDATE_PENDING hold. Newly reported coverage is billed only when it is reported within coverage_update_window_days of first_statement_date and the payer's own timely-filing limit, counted from the date of service, has not expired. When both hold, the financial class is updated and the account is rebilled: the open self-pay balance net of the uninsured discount and of patient payments is transferred off the patient balance as an INSURANCE_REBILL_TRANSFER adjustment and a new claim is submitted; payments already made remain on the account and are reconciled when the payer adjudicates. When the payer's limit has expired, the account is not rebilled and the self-pay balance stands. Coverage reported as terminated before the date of service changes the financial class to SELF_PAY, and the payer's denial amount posts as COVERAGE_TERMINATED liability.
    eligibility: []
    params: {coverage_update_window_days: "=coverage_update_window_days", coverage_update_hold_days: "=coverage_update_hold_days"}
  - id: encounter_late_charges
    subject: [encounter_charge_posted, encounter_charge_credited]
    rule: >-
      A charge found after the final bill (a late charge) posts and is billed only when it posts within late_charge_window_days calendar days after final_bill_date; on an insured account it is billed by replacement claim, on a SELF_PAY account it adds to the self-pay liability with the uninsured discount. A late charge that posts after the window is credited in full with LATE_CHARGE_PAST_WINDOW and is never billed to the patient or the payer.
    eligibility: []
    params:
      per_tier:
        Outpatient Clinic Visit Account: {late_charge_window_days: "=late_charge_window_days"}
        Outpatient Diagnostic Imaging & Lab Account: {late_charge_window_days: "=late_charge_window_days"}
        Recurring Outpatient Therapy Account: {late_charge_window_days: "=late_charge_window_days"}
        Emergency Department Visit Account: {late_charge_window_days: "=late_charge_window_days"}
        Outpatient Surgery Account: {late_charge_window_days: "=late_charge_window_days"}
        Observation Stay Account: {late_charge_window_days: "=late_charge_window_days"}
        Inpatient Admission Account: {late_charge_window_days: "=late_charge_window_days"}

# ---- extended policies (hospital_account_billing) ----
extended_policies:
- id: encounter_ext_noncovered_discount
  base_policy_refs:
  - encounter_uninsured_discount
  - encounter_prompt_pay_discount
  - encounter_charge_dispute_and_correction
  - encounter_small_balance_and_courtesy
  - encounter_coverage_update_rebill
  overwrite:
  - base_policy: encounter_uninsured_discount
    superseded_clause: >-
      On an insured account, a NONCOVERED_SERVICE liability line receives the same uninsured_discount_pct only on tiers where uninsured_discount_on_noncovered_insured is true; deductible, coinsurance and copay amounts never receive it.
    replaced_by: >-
      On an insured account, NONCOVERED_SERVICE liability postings receive an uninsured discount only on patient classes whose uninsured_discount_on_noncovered_insured is true, in the one adjustment and at the amount this rule fixes; deductible, coinsurance and copay amounts never receive it.
  - base_policy: encounter_uninsured_discount
    superseded_clause: The uninsured discount applies only when the account's financial_class is SELF_PAY at final bill.
    replaced_by: >-
      The uninsured discount applies to an account whose financial_class is SELF_PAY at final bill and, on an insured account, to its NONCOVERED_SERVICE liability postings priced under this rule; the COVERAGE_TERMINATED postings of an account whose financial class was corrected to SELF_PAY after its final bill and the observation-rate discount on observation-hour charge lines are outside this sentence.
  trigger: state_due
  subject:
  - encounter_adjustment_posted
  computes: amount
  target_tool: post_noncovered_line_discount_93cdc726
  params:
    large_band_usd: 1000.0
    mid_band_usd: 250.0
    large_band_points: 10.0
    mid_band_points: 5.0
    freestanding_site_points: 5.0
    campus_site_points: 2.0
    deductible_high_usd: 1000.0
    deductible_low_usd: 500.0
    deductible_point_usd: 250.0
    deductible_cap_points: 6.0
    deductible_flat_points: 1.5
    surprise_points: 5.0
    late_estimate_points: 2.5
    near_window_days: 365
    assets_denial_points: 10.0
    income_denial_points: 5.0
    covered_visit_points: 2.5
    uncovered_visit_points: 5.0
  rule: >-
    On an insured hospital account of a patient class whose uninsured_discount_on_noncovered_insured is true, the non-covered amounts a payer released to the patient receive one UNINSURED_DISCOUNT adjustment, sourced to the account's most recent NONCOVERED_SERVICE liability posting by posting date (of two posted on the same day, the one recorded first), and this rule fixes its amount; the account receives that adjustment once, and a NONCOVERED_SERVICE posting recorded after it stands receives no further uninsured discount. On an insured account, NONCOVERED_SERVICE liability postings receive an uninsured discount only on patient classes whose uninsured_discount_on_noncovered_insured is true, in the one adjustment and at the amount this rule fixes; deductible, coinsurance and copay amounts never receive it. The uninsured discount applies to an account whose financial_class is SELF_PAY at final bill and, on an insured account, to its NONCOVERED_SERVICE liability postings priced under this rule; the COVERAGE_TERMINATED postings of an account whose financial class was corrected to SELF_PAY after its final bill and the observation-rate discount on observation-hour charge lines are outside this sentence. The non-covered amount is the total of the account's NONCOVERED_SERVICE liability postings; an account with none has a non-covered amount of 0.00 and receives no non-covered discount. The non-covered discount is uninsured_discount_pct percent of the non-covered amount, rounded half-up to the cent. The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the non-covered discount percent, the combined percent is applied once to the non-covered amount and rounded half-up to the cent, and the resulting non-covered discount never exceeds the non-covered amount. A non-covered amount of at least large_band_usd adds large_band_points percentage points to the non-covered discount percent; a non-covered amount of at least mid_band_usd but below large_band_usd adds mid_band_points percentage points; a non-covered amount below mid_band_usd adds none. An account with at least one CT charge line (revenue code 0350) or MRI charge line (revenue code 0610) posted on it whose facility is Riverbend Surgery & Imaging Center - Grand Chute adds freestanding_site_points percentage points to the non-covered discount percent; such an account whose facility is any other Riverbend campus adds campus_site_points percentage points; an account with no CT or MRI charge line adds none. The account's DEDUCTIBLE liability postings are totalled: a total of at least deductible_high_usd adds one percentage point to the non-covered discount percent for each full deductible_point_usd of that total, never more than deductible_cap_points points; a total of at least deductible_low_usd but below deductible_high_usd adds a flat deductible_flat_points percentage points; a smaller total adds none. The Insured Patient Out-of-Pocket Estimate linked to the account (an estimate is opened once per scheduled service) sets the estimate-surprise allowance: when it carries an issued_date on or before its scheduled_service_date and the non-covered amount exceeds variance_review_pct percent of its estimate_total_usd, surprise_points percentage points are added to the non-covered discount percent; when it carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, late_estimate_points percentage points are added; otherwise, including no linked estimate with an issued_date or a non-covered amount within that percent of the total, none. The patient's most recent assistance determination decides the near-eligibility allowance: only a case in approved, denied, expired or revoked status is a determination (a submitted, pending_documents or withdrawn case is not, whatever date it carries); of determinations dated the same day an approval, expiry or revocation counts as more recent than a denial, and of two denials the one recorded first counts. The allowance applies when that most recent determination is a denial whose determination_date falls no more than near_window_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_denial_points percentage points to the non-covered discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_denial_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none. An account classified MEDICALLY_NECESSARY or EMERGENCY whose DEDUCTIBLE, COINSURANCE and COPAY liability postings total above 0.00 (a non-covered item inside a covered visit) adds covered_visit_points percentage points to the non-covered discount percent; an account so classified with no such cost-sharing posted (a visit the payer covered none of) adds uncovered_visit_points percentage points; an account classified ELECTIVE_NON_COVERED adds none.
  prerequisite: []
  cross_category:
  - category: estimate
    as: branch
    reads:
    - estimate_total_usd
    - issued_date
    - scheduled_service_date
    - variance_review_pct
    note: >-
      estimate_surprise compares the non-covered amount with the linked insured estimate's variance tolerance.
  - category: assist
    as: branch
    reads:
    - status
    - variant_name
    - denial_reason
    - determination_date
    note: >-
      near_eligibility reads the patient's most recent assistance determination among determined cases (status filter).
  compute:
  - nc_amount: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='NONCOVERED_SERVICE')
  - nc_std_pct: P('uninsured_discount_pct')
  - nc_size_points: >-
      K('large_band_points') if SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='NONCOVERED_SERVICE') >= K('large_band_usd') else (K('mid_band_points') if SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='NONCOVERED_SERVICE') >= K('mid_band_usd') else 0)
  - nc_imaging_lines: >-
      COUNT('encounter_transactions', event_type='encounter_charge_posted', revenue_code='0350') + COUNT('encounter_transactions', event_type='encounter_charge_posted', revenue_code='0610')
  - nc_site_points: >-
      K('freestanding_site_points') if (F('facility') == 'Riverbend Surgery & Imaging Center - Grand Chute' and nc_imaging_lines > 0) else (K('campus_site_points') if (F('facility') != 'Riverbend Surgery & Imaging Center - Grand Chute' and nc_imaging_lines > 0) else 0)
  - nc_deductible_posted: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='DEDUCTIBLE')
  - nc_deductible_points: >-
      MN(K('deductible_cap_points'), int(nc_deductible_posted / K('deductible_point_usd'))) if nc_deductible_posted >= K('deductible_high_usd') else (K('deductible_flat_points') if nc_deductible_posted >= K('deductible_low_usd') else 0)
  - nc_est_total: >-
      CFIELD('estimate', 'estimate_total_usd', encounter_id=HID, variant_name='Insured Patient Out-of-Pocket Estimate') or 0
  - nc_est_issued: >-
      CFIELD('estimate', 'issued_date', encounter_id=HID, variant_name='Insured Patient Out-of-Pocket Estimate') or ''
  - nc_est_service: >-
      CFIELD('estimate', 'scheduled_service_date', encounter_id=HID, variant_name='Insured Patient Out-of-Pocket Estimate') or ''
  - nc_est_margin: >-
      nc_est_total * (CPARAM('estimate', 'variance_review_pct', encounter_id=HID, variant_name='Insured Patient Out-of-Pocket Estimate') or 0) / 100
  - nc_surprise_points: >-
      K('surprise_points') if (nc_est_issued != '' and nc_est_service != '' and nc_est_issued <= nc_est_service and SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='NONCOVERED_SERVICE') > nc_est_margin) else (K('late_estimate_points') if (nc_est_issued != '' and (nc_est_service == '' or nc_est_issued > nc_est_service)) else 0)
  - nc_award_date: >-
      MX(XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='approved') or '', XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='expired') or '', XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='revoked') or '')
  - nc_case_tier: >-
      XLATEST('assist', 'assistance_cases', 'variant_name', date_field='determination_date', status='denied') or ''
  - nc_case_reason: >-
      XLATEST('assist', 'assistance_cases', 'denial_reason', date_field='determination_date', status='denied') or ''
  - nc_case_date: >-
      XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='denied') or ''
  - nc_case_age: DAYS(nc_case_date, NOW) if nc_case_date != '' else 99999
  - nc_near_points: >-
      K('assets_denial_points') if (nc_case_date != '' and nc_case_date > nc_award_date and nc_case_tier == 'Riverbend Medical Hardship Assistance (above 400% FPL)' and nc_case_reason == 'ASSETS_ABOVE_LIMIT' and nc_case_age <= K('near_window_days')) else (K('income_denial_points') if (nc_case_date != '' and nc_case_date > nc_award_date and nc_case_tier == 'Riverbend Medical Hardship Assistance (above 400% FPL)' and nc_case_reason == 'INCOME_ABOVE_LIMIT' and nc_case_age <= K('near_window_days')) else 0)
  - nc_cost_share: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='DEDUCTIBLE') + SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COINSURANCE') + SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COPAY')
  - nc_addon_points: >-
      K('covered_visit_points') if ((F('service_classification') == 'MEDICALLY_NECESSARY' or F('service_classification') == 'EMERGENCY') and nc_cost_share > 0) else (K('uncovered_visit_points') if ((F('service_classification') == 'MEDICALLY_NECESSARY' or F('service_classification') == 'EMERGENCY') and nc_cost_share <= 0) else 0)
  - nc_total_pct: >-
      nc_std_pct + nc_size_points + nc_site_points + nc_deductible_points + nc_surprise_points + nc_near_points + nc_addon_points
  - result: MN(nc_amount, RND(nc_amount * nc_total_pct / 100, 2))
  compute_basis:
    nc_amount: >-
      The non-covered amount is the total of the account's NONCOVERED_SERVICE liability postings; an account with none has a non-covered amount of 0.00 and receives no non-covered discount.
    nc_std_pct: >-
      The non-covered discount is uninsured_discount_pct percent of the non-covered amount, rounded half-up to the cent.
    nc_size_points: >-
      A non-covered amount of at least large_band_usd adds large_band_points percentage points to the non-covered discount percent; a non-covered amount of at least mid_band_usd but below large_band_usd adds mid_band_points percentage points; a non-covered amount below mid_band_usd adds none.
    nc_imaging_lines: >-
      An account with at least one CT charge line (revenue code 0350) or MRI charge line (revenue code 0610) posted on it whose facility is Riverbend Surgery & Imaging Center - Grand Chute adds freestanding_site_points percentage points to the non-covered discount percent; such an account whose facility is any other Riverbend campus adds campus_site_points percentage points; an account with no CT or MRI charge line adds none.
    nc_site_points: >-
      An account with at least one CT charge line (revenue code 0350) or MRI charge line (revenue code 0610) posted on it whose facility is Riverbend Surgery & Imaging Center - Grand Chute adds freestanding_site_points percentage points to the non-covered discount percent; such an account whose facility is any other Riverbend campus adds campus_site_points percentage points; an account with no CT or MRI charge line adds none.
    nc_deductible_posted: >-
      The account's DEDUCTIBLE liability postings are totalled: a total of at least deductible_high_usd adds one percentage point to the non-covered discount percent for each full deductible_point_usd of that total, never more than deductible_cap_points points; a total of at least deductible_low_usd but below deductible_high_usd adds a flat deductible_flat_points percentage points; a smaller total adds none.
    nc_deductible_points: >-
      The account's DEDUCTIBLE liability postings are totalled: a total of at least deductible_high_usd adds one percentage point to the non-covered discount percent for each full deductible_point_usd of that total, never more than deductible_cap_points points; a total of at least deductible_low_usd but below deductible_high_usd adds a flat deductible_flat_points percentage points; a smaller total adds none.
    nc_est_total: >-
      The Insured Patient Out-of-Pocket Estimate linked to the account (an estimate is opened once per scheduled service) sets the estimate-surprise allowance: when it carries an issued_date on or before its scheduled_service_date and the non-covered amount exceeds variance_review_pct percent of its estimate_total_usd, surprise_points percentage points are added to the non-covered discount percent; when it carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, late_estimate_points percentage points are added; otherwise, including no linked estimate with an issued_date or a non-covered amount within that percent of the total, none.
    nc_est_issued: >-
      The Insured Patient Out-of-Pocket Estimate linked to the account (an estimate is opened once per scheduled service) sets the estimate-surprise allowance: when it carries an issued_date on or before its scheduled_service_date and the non-covered amount exceeds variance_review_pct percent of its estimate_total_usd, surprise_points percentage points are added to the non-covered discount percent; when it carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, late_estimate_points percentage points are added; otherwise, including no linked estimate with an issued_date or a non-covered amount within that percent of the total, none.
    nc_est_service: >-
      The Insured Patient Out-of-Pocket Estimate linked to the account (an estimate is opened once per scheduled service) sets the estimate-surprise allowance: when it carries an issued_date on or before its scheduled_service_date and the non-covered amount exceeds variance_review_pct percent of its estimate_total_usd, surprise_points percentage points are added to the non-covered discount percent; when it carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, late_estimate_points percentage points are added; otherwise, including no linked estimate with an issued_date or a non-covered amount within that percent of the total, none.
    nc_est_margin: >-
      The Insured Patient Out-of-Pocket Estimate linked to the account (an estimate is opened once per scheduled service) sets the estimate-surprise allowance: when it carries an issued_date on or before its scheduled_service_date and the non-covered amount exceeds variance_review_pct percent of its estimate_total_usd, surprise_points percentage points are added to the non-covered discount percent; when it carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, late_estimate_points percentage points are added; otherwise, including no linked estimate with an issued_date or a non-covered amount within that percent of the total, none.
    nc_surprise_points: >-
      The Insured Patient Out-of-Pocket Estimate linked to the account (an estimate is opened once per scheduled service) sets the estimate-surprise allowance: when it carries an issued_date on or before its scheduled_service_date and the non-covered amount exceeds variance_review_pct percent of its estimate_total_usd, surprise_points percentage points are added to the non-covered discount percent; when it carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, late_estimate_points percentage points are added; otherwise, including no linked estimate with an issued_date or a non-covered amount within that percent of the total, none.
    nc_case_tier: >-
      The patient's most recent assistance determination decides the near-eligibility allowance: only a case in approved, denied, expired or revoked status is a determination (a submitted, pending_documents or withdrawn case is not, whatever date it carries); of determinations dated the same day an approval, expiry or revocation counts as more recent than a denial, and of two denials the one recorded first counts. The allowance applies when that most recent determination is a denial whose determination_date falls no more than near_window_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_denial_points percentage points to the non-covered discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_denial_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    nc_case_reason: >-
      The patient's most recent assistance determination decides the near-eligibility allowance: only a case in approved, denied, expired or revoked status is a determination (a submitted, pending_documents or withdrawn case is not, whatever date it carries); of determinations dated the same day an approval, expiry or revocation counts as more recent than a denial, and of two denials the one recorded first counts. The allowance applies when that most recent determination is a denial whose determination_date falls no more than near_window_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_denial_points percentage points to the non-covered discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_denial_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    nc_case_date: >-
      The patient's most recent assistance determination decides the near-eligibility allowance: only a case in approved, denied, expired or revoked status is a determination (a submitted, pending_documents or withdrawn case is not, whatever date it carries); of determinations dated the same day an approval, expiry or revocation counts as more recent than a denial, and of two denials the one recorded first counts. The allowance applies when that most recent determination is a denial whose determination_date falls no more than near_window_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_denial_points percentage points to the non-covered discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_denial_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    nc_case_age: >-
      The patient's most recent assistance determination decides the near-eligibility allowance: only a case in approved, denied, expired or revoked status is a determination (a submitted, pending_documents or withdrawn case is not, whatever date it carries); of determinations dated the same day an approval, expiry or revocation counts as more recent than a denial, and of two denials the one recorded first counts. The allowance applies when that most recent determination is a denial whose determination_date falls no more than near_window_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_denial_points percentage points to the non-covered discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_denial_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    nc_near_points: >-
      The patient's most recent assistance determination decides the near-eligibility allowance: only a case in approved, denied, expired or revoked status is a determination (a submitted, pending_documents or withdrawn case is not, whatever date it carries); of determinations dated the same day an approval, expiry or revocation counts as more recent than a denial, and of two denials the one recorded first counts. The allowance applies when that most recent determination is a denial whose determination_date falls no more than near_window_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_denial_points percentage points to the non-covered discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_denial_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    nc_cost_share: >-
      An account classified MEDICALLY_NECESSARY or EMERGENCY whose DEDUCTIBLE, COINSURANCE and COPAY liability postings total above 0.00 (a non-covered item inside a covered visit) adds covered_visit_points percentage points to the non-covered discount percent; an account so classified with no such cost-sharing posted (a visit the payer covered none of) adds uncovered_visit_points percentage points; an account classified ELECTIVE_NON_COVERED adds none.
    nc_addon_points: >-
      An account classified MEDICALLY_NECESSARY or EMERGENCY whose DEDUCTIBLE, COINSURANCE and COPAY liability postings total above 0.00 (a non-covered item inside a covered visit) adds covered_visit_points percentage points to the non-covered discount percent; an account so classified with no such cost-sharing posted (a visit the payer covered none of) adds uncovered_visit_points percentage points; an account classified ELECTIVE_NON_COVERED adds none.
    nc_total_pct: >-
      The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the non-covered discount percent, the combined percent is applied once to the non-covered amount and rounded half-up to the cent, and the resulting non-covered discount never exceeds the non-covered amount.
    result: >-
      The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the non-covered discount percent, the combined percent is applied once to the non-covered amount and rounded half-up to the cent, and the resulting non-covered discount never exceeds the non-covered amount.
    nc_award_date: >-
      The patient's most recent assistance determination decides the near-eligibility allowance: only a case in approved, denied, expired or revoked status is a determination (a submitted, pending_documents or withdrawn case is not, whatever date it carries); of determinations dated the same day an approval, expiry or revocation counts as more recent than a denial, and of two denials the one recorded first counts. The allowance applies when that most recent determination is a denial whose determination_date falls no more than near_window_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_denial_points percentage points to the non-covered discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_denial_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
  factors:
  - id: noncovered_size_band
    effect: parameter
    decides: nc_size_points
    bindings:
    - nc_size_points
    ladder:
    - when: non-covered amount at least large_band_usd
      value: K('large_band_points') points
    - when: non-covered amount at least mid_band_usd, below large_band_usd
      value: K('mid_band_points') points
    - when: otherwise
      value: 0 points
    baseline:
      nc_size_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: site_of_service
    effect: parameter
    decides: nc_site_points
    bindings:
    - nc_imaging_lines
    - nc_site_points
    ladder:
    - when: facility Riverbend Surgery & Imaging Center - Grand Chute AND a CT (0350) or MRI (0610) line
      value: K('freestanding_site_points') points
    - when: another campus AND a CT or MRI line
      value: K('campus_site_points') points
    - when: otherwise
      value: 0 points
    baseline:
      nc_site_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: deductible_burden
    effect: method
    decides: nc_deductible_points
    bindings:
    - nc_deductible_posted
    - nc_deductible_points
    ladder:
    - when: DEDUCTIBLE postings at least deductible_high_usd
      method: >-
        one point per full deductible_point_usd of the deductible, capped at deductible_cap_points (proportional)
    - when: at least deductible_low_usd, below deductible_high_usd
      method: flat deductible_flat_points points
    - when: otherwise
      method: no points
    baseline:
      nc_deductible_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: estimate_surprise
    effect: parameter
    decides: nc_surprise_points
    bindings:
    - nc_est_total
    - nc_est_issued
    - nc_est_service
    - nc_est_margin
    - nc_surprise_points
    ladder:
    - when: >-
        linked insured estimate issued on or before its scheduled_service_date AND non-covered amount above variance_review_pct of its total
      value: K('surprise_points') points
    - when: linked estimate issued with no scheduled_service_date or after it
      value: K('late_estimate_points') points
    - when: otherwise
      value: 0 points
    baseline:
      nc_surprise_points: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: estimate
  - id: near_eligibility
    effect: parameter
    decides: nc_near_points
    bindings:
    - nc_award_date
    - nc_case_tier
    - nc_case_reason
    - nc_case_date
    - nc_case_age
    - nc_near_points
    ladder:
    - when: >-
        most recent determination (approved/denied/expired/revoked cases only) is a denial of the Medical Hardship tier AND denied ASSETS_ABOVE_LIMIT AND determined within near_window_days
      value: K('assets_denial_points') points
    - when: Medical Hardship tier AND denied INCOME_ABOVE_LIMIT AND determined within near_window_days
      value: K('income_denial_points') points
    - when: otherwise
      value: 0 points
    baseline:
      nc_near_points: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: assist
  - id: covered_visit_addon
    effect: parameter
    decides: nc_addon_points
    bindings:
    - nc_cost_share
    - nc_addon_points
    ladder:
    - when: classified MEDICALLY_NECESSARY or EMERGENCY AND covered cost-sharing posted above 0.00
      value: K('covered_visit_points') points
    - when: classified MEDICALLY_NECESSARY or EMERGENCY AND no covered cost-sharing posted
      value: K('uncovered_visit_points') points
    - when: otherwise (ELECTIVE_NON_COVERED)
      value: 0 points
    baseline:
      nc_addon_points: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The non-covered amount is the total of the account's NONCOVERED_SERVICE liability postings; an account with none has a non-covered amount of 0.00 and receives no non-covered discount. The non-covered discount is uninsured_discount_pct percent of the non-covered amount, rounded half-up to the cent.
    params:
    - uninsured_discount_pct
  inputs:
    history:
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_liability_posted
        liability_source: NONCOVERED_SERVICE
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_liability_posted
        liability_source: DEDUCTIBLE
    - table: encounter_transactions
      aggregate: count
      field: encounter_txn_id
      filters:
        event_type: encounter_charge_posted
        revenue_code: 0350|0610
    cross_category:
    - estimate
    - assist
- id: encounter_ext_insured_payoff
  base_policy_refs:
  - encounter_agg_payment_application
  - encounter_prompt_pay_discount
  - encounter_uninsured_discount
  - encounter_charge_dispute_and_correction
  - encounter_small_balance_and_courtesy
  - encounter_coverage_update_rebill
  - encounter_final_bill_and_liability
  overwrite:
  - base_policy: encounter_prompt_pay_discount
    superseded_clause: >-
      The discount is prompt_pay_discount_pct of the patient balance standing immediately before the payment (after the uninsured discount when prompt_pay_stacks_with_uninsured is true), rounded half-up to the cent, and the payment amount due is that balance less the discount; the discount posts as a PROMPT_PAY_DISCOUNT adjustment whose source is the qualifying payment.
    replaced_by: >-
      For an account whose financial_class is anything other than SELF_PAY, and only for such an account, the prompt-pay discount and the payment amount due are figured as this rule states, the payment amount due being the insured balance standing less that discount and less the dollar credit stated below, and the discount together with that credit posts as a PROMPT_PAY_DISCOUNT adjustment whose source is the qualifying payment; a SELF_PAY account is outside this sentence.
  trigger: on_request
  subject:
  - encounter_payment_posted
  - encounter_adjustment_posted
  - encounter_closed
  computes: amount
  target_tool: pay_insured_balance_in_full_a10a8aeb
  params:
    first_window_days: 10
    second_window_days: 20
    first_window_points: 4.0
    second_window_points: 2.0
    portal_points: 1.0
    email_points: 0.5
    large_liability_usd: 2500.0
    moderate_liability_usd: 1000.0
    large_liability_points: 2.0
    moderate_liability_points: 1.0
    variance_share: 0.5
    late_estimate_credit_usd: 25.0
    pos_full_usd: 250.0
    pos_full_points: 1.5
    pos_partial_points: 0.75
    high_noncovered_share_pct: 50.0
    low_noncovered_share_pct: 20.0
    high_noncovered_points: 2.0
    low_noncovered_points: 1.0
  rule: >-
    A patient who pays in full, inside the prompt-pay window, the remaining balance of a hospital account whose financial_class is anything other than SELF_PAY pays the insured payoff amount this rule fixes. For an account whose financial_class is anything other than SELF_PAY, and only for such an account, the prompt-pay discount and the payment amount due are figured as this rule states, the payment amount due being the insured balance standing less that discount and less the dollar credit stated below, and the discount together with that credit posts as a PROMPT_PAY_DISCOUNT adjustment whose source is the qualifying payment; a SELF_PAY account is outside this sentence. On an account that carries a non-covered-service liability posting and whose patient class grants the uninsured discount on such postings, the insured payoff amount is fixed only after an uninsured discount stands against one of those postings. The insured balance standing is the account's patient_balance immediately before the payment. The insured payoff discount is prompt_pay_discount_pct percent of the insured balance standing, rounded half-up to the cent, and the insured payoff amount is the insured balance standing less that discount. The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the insured payoff discount percent, the combined percent is applied once to the insured balance standing and rounded half-up to the cent, every adjustment stated in dollars is then subtracted from the insured balance standing together with that discount, and the insured payoff amount is never below 0.00. The days to pay are the calendar days counted from the day after first_statement_date through the payment date (a plain difference of the two dates); a payment made when the days to pay are first_window_days or fewer adds first_window_points percentage points to the insured payoff discount percent, one made when they are more than first_window_days but no more than second_window_days adds second_window_points percentage points, and a later payment, or an account with no first_statement_date, adds none. The delivery channel of the account's most recent SUMMARY_STATEMENT, by statement date and, of two on the same date, the one recorded first, sets the paperless allowance: PATIENT_PORTAL adds portal_points percentage points to the insured payoff discount percent, EMAIL_LINK adds email_points percentage points, and US_MAIL or no summary statement adds none. The account's liability postings of every liability source are totalled: a total of at least large_liability_usd adds large_liability_points percentage points to the insured payoff discount percent, a total of at least moderate_liability_usd but below large_liability_usd adds moderate_liability_points percentage points, and a smaller total adds none. The cost-sharing posted is the total of the account's DEDUCTIBLE, COINSURANCE and COPAY liability postings, and the tolerance figure is the estimate_total_usd of the Insured Patient Out-of-Pocket Estimate linked to the account times one plus that estimate's variance_review_pct percent; when that estimate's issued_date is on or before its scheduled_service_date and the cost-sharing posted exceeds the tolerance figure, a dollar credit of variance_share times the excess of the cost-sharing posted over the tolerance figure, rounded half-up to the cent, is subtracted; when that estimate carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, and the cost-sharing posted exceeds its estimate_total_usd, a flat dollar credit of late_estimate_credit_usd is subtracted; otherwise, including no linked insured estimate with an issued_date, nothing is subtracted. The account's POINT_OF_SERVICE payments are totalled: a total of at least pos_full_usd adds pos_full_points percentage points to the insured payoff discount percent, a total above 0.00 but below pos_full_usd adds pos_partial_points percentage points, and no such payment adds none. The non-covered share is the account's NONCOVERED_SERVICE liability postings as a percent of all its liability postings: a share of at least high_noncovered_share_pct adds high_noncovered_points percentage points to the insured payoff discount percent, a share of at least low_noncovered_share_pct but below high_noncovered_share_pct adds low_noncovered_points percentage points, and a smaller share or no liability posting adds none.
  prerequisite:
  - problem: encounter_ext_noncovered_discount
    kind: value_input
    gate: ins_balance
    form: state
    policy_source: >-
      On an account that carries a non-covered-service liability posting and whose patient class grants the uninsured discount on such postings, the insured payoff amount is fixed only after an uninsured discount stands against one of those postings.
    condition: >-
      on an account whose patient class has uninsured_discount_on_noncovered_insured true and which carries a NONCOVERED_SERVICE liability posting, an encounter_adjustment_posted row with adjustment_code UNINSURED_DISCOUNT stands whose source_txn_id is one of the account's NONCOVERED_SERVICE postings
    resolved_by: post_noncovered_line_discount_93cdc726
    effect: >-
      the uninsured discount on the non-covered amount lowers patient_balance, so ins_balance (the insured balance standing) and every figure built on it fall by that discount
  cross_category:
  - category: estimate
    as: branch
    reads:
    - estimate_total_usd
    - issued_date
    - scheduled_service_date
    - variance_review_pct
    note: >-
      estimate_variance_relief compares the posted cost-sharing with the linked insured estimate and its variance_review_pct.
  compute:
  - ins_balance: F('patient_balance')
  - ins_std_pct: P('prompt_pay_discount_pct')
  - ins_days_to_pay: DAYS(F('first_statement_date'), NOW) if F('first_statement_date') else 99999
  - ins_days_points: >-
      K('first_window_points') if ins_days_to_pay <= K('first_window_days') else (K('second_window_points') if ins_days_to_pay <= K('second_window_days') else 0)
  - ins_last_channel: >-
      LATEST('encounter_transactions', 'delivery_channel', date_field='posting_date', event_type='encounter_statement_issued', statement_type='SUMMARY_STATEMENT') or ''
  - ins_paperless_points: >-
      K('portal_points') if ins_last_channel == 'PATIENT_PORTAL' else (K('email_points') if ins_last_channel == 'EMAIL_LINK' else 0)
  - ins_liability_total: SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted')
  - ins_size_points: >-
      K('large_liability_points') if ins_liability_total >= K('large_liability_usd') else (K('moderate_liability_points') if ins_liability_total >= K('moderate_liability_usd') else 0)
  - ins_cost_share: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='DEDUCTIBLE') + SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COINSURANCE') + SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COPAY')
  - ins_est_total: >-
      CFIELD('estimate', 'estimate_total_usd', encounter_id=HID, variant_name='Insured Patient Out-of-Pocket Estimate') or 0
  - ins_est_issued: >-
      CFIELD('estimate', 'issued_date', encounter_id=HID, variant_name='Insured Patient Out-of-Pocket Estimate') or ''
  - ins_est_service: >-
      CFIELD('estimate', 'scheduled_service_date', encounter_id=HID, variant_name='Insured Patient Out-of-Pocket Estimate') or ''
  - ins_est_tolerance: >-
      ins_est_total * (1 + (CPARAM('estimate', 'variance_review_pct', encounter_id=HID, variant_name='Insured Patient Out-of-Pocket Estimate') or 0) / 100)
  - ins_estimate_credit: >-
      RND((ins_cost_share - ins_est_tolerance) * K('variance_share'), 2) if (ins_est_issued != '' and ins_est_service != '' and ins_est_issued <= ins_est_service and ins_cost_share > ins_est_tolerance) else (K('late_estimate_credit_usd') if (ins_est_issued != '' and (ins_est_service == '' or ins_est_issued > ins_est_service) and ins_cost_share > ins_est_total) else 0)
  - ins_pos_paid: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_payment_posted', payment_channel='POINT_OF_SERVICE')
  - ins_pos_points: >-
      K('pos_full_points') if ins_pos_paid >= K('pos_full_usd') else (K('pos_partial_points') if ins_pos_paid > 0 else 0)
  - ins_nc_posted: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='NONCOVERED_SERVICE')
  - ins_nc_share: >-
      ins_nc_posted * 100 / SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted') if SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted') > 0 else 0
  - ins_nc_points: >-
      K('high_noncovered_points') if ins_nc_share >= K('high_noncovered_share_pct') else (K('low_noncovered_points') if ins_nc_share >= K('low_noncovered_share_pct') else 0)
  - ins_total_pct: >-
      ins_std_pct + ins_days_points + ins_paperless_points + ins_size_points + ins_pos_points + ins_nc_points
  - ins_discount: RND(ins_balance * ins_total_pct / 100, 2)
  - result: MX(0, ins_balance - ins_discount - ins_estimate_credit)
  compute_basis:
    ins_balance: The insured balance standing is the account's patient_balance immediately before the payment.
    ins_std_pct: >-
      The insured payoff discount is prompt_pay_discount_pct percent of the insured balance standing, rounded half-up to the cent, and the insured payoff amount is the insured balance standing less that discount.
    ins_days_to_pay: >-
      The days to pay are the calendar days counted from the day after first_statement_date through the payment date (a plain difference of the two dates); a payment made when the days to pay are first_window_days or fewer adds first_window_points percentage points to the insured payoff discount percent, one made when they are more than first_window_days but no more than second_window_days adds second_window_points percentage points, and a later payment, or an account with no first_statement_date, adds none.
    ins_days_points: >-
      The days to pay are the calendar days counted from the day after first_statement_date through the payment date (a plain difference of the two dates); a payment made when the days to pay are first_window_days or fewer adds first_window_points percentage points to the insured payoff discount percent, one made when they are more than first_window_days but no more than second_window_days adds second_window_points percentage points, and a later payment, or an account with no first_statement_date, adds none.
    ins_last_channel: >-
      The delivery channel of the account's most recent SUMMARY_STATEMENT, by statement date and, of two on the same date, the one recorded first, sets the paperless allowance: PATIENT_PORTAL adds portal_points percentage points to the insured payoff discount percent, EMAIL_LINK adds email_points percentage points, and US_MAIL or no summary statement adds none.
    ins_paperless_points: >-
      The delivery channel of the account's most recent SUMMARY_STATEMENT, by statement date and, of two on the same date, the one recorded first, sets the paperless allowance: PATIENT_PORTAL adds portal_points percentage points to the insured payoff discount percent, EMAIL_LINK adds email_points percentage points, and US_MAIL or no summary statement adds none.
    ins_liability_total: >-
      The account's liability postings of every liability source are totalled: a total of at least large_liability_usd adds large_liability_points percentage points to the insured payoff discount percent, a total of at least moderate_liability_usd but below large_liability_usd adds moderate_liability_points percentage points, and a smaller total adds none.
    ins_size_points: >-
      The account's liability postings of every liability source are totalled: a total of at least large_liability_usd adds large_liability_points percentage points to the insured payoff discount percent, a total of at least moderate_liability_usd but below large_liability_usd adds moderate_liability_points percentage points, and a smaller total adds none.
    ins_cost_share: >-
      The cost-sharing posted is the total of the account's DEDUCTIBLE, COINSURANCE and COPAY liability postings, and the tolerance figure is the estimate_total_usd of the Insured Patient Out-of-Pocket Estimate linked to the account times one plus that estimate's variance_review_pct percent; when that estimate's issued_date is on or before its scheduled_service_date and the cost-sharing posted exceeds the tolerance figure, a dollar credit of variance_share times the excess of the cost-sharing posted over the tolerance figure, rounded half-up to the cent, is subtracted; when that estimate carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, and the cost-sharing posted exceeds its estimate_total_usd, a flat dollar credit of late_estimate_credit_usd is subtracted; otherwise, including no linked insured estimate with an issued_date, nothing is subtracted.
    ins_est_total: >-
      The cost-sharing posted is the total of the account's DEDUCTIBLE, COINSURANCE and COPAY liability postings, and the tolerance figure is the estimate_total_usd of the Insured Patient Out-of-Pocket Estimate linked to the account times one plus that estimate's variance_review_pct percent; when that estimate's issued_date is on or before its scheduled_service_date and the cost-sharing posted exceeds the tolerance figure, a dollar credit of variance_share times the excess of the cost-sharing posted over the tolerance figure, rounded half-up to the cent, is subtracted; when that estimate carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, and the cost-sharing posted exceeds its estimate_total_usd, a flat dollar credit of late_estimate_credit_usd is subtracted; otherwise, including no linked insured estimate with an issued_date, nothing is subtracted.
    ins_est_issued: >-
      The cost-sharing posted is the total of the account's DEDUCTIBLE, COINSURANCE and COPAY liability postings, and the tolerance figure is the estimate_total_usd of the Insured Patient Out-of-Pocket Estimate linked to the account times one plus that estimate's variance_review_pct percent; when that estimate's issued_date is on or before its scheduled_service_date and the cost-sharing posted exceeds the tolerance figure, a dollar credit of variance_share times the excess of the cost-sharing posted over the tolerance figure, rounded half-up to the cent, is subtracted; when that estimate carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, and the cost-sharing posted exceeds its estimate_total_usd, a flat dollar credit of late_estimate_credit_usd is subtracted; otherwise, including no linked insured estimate with an issued_date, nothing is subtracted.
    ins_est_service: >-
      The cost-sharing posted is the total of the account's DEDUCTIBLE, COINSURANCE and COPAY liability postings, and the tolerance figure is the estimate_total_usd of the Insured Patient Out-of-Pocket Estimate linked to the account times one plus that estimate's variance_review_pct percent; when that estimate's issued_date is on or before its scheduled_service_date and the cost-sharing posted exceeds the tolerance figure, a dollar credit of variance_share times the excess of the cost-sharing posted over the tolerance figure, rounded half-up to the cent, is subtracted; when that estimate carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, and the cost-sharing posted exceeds its estimate_total_usd, a flat dollar credit of late_estimate_credit_usd is subtracted; otherwise, including no linked insured estimate with an issued_date, nothing is subtracted.
    ins_est_tolerance: >-
      The cost-sharing posted is the total of the account's DEDUCTIBLE, COINSURANCE and COPAY liability postings, and the tolerance figure is the estimate_total_usd of the Insured Patient Out-of-Pocket Estimate linked to the account times one plus that estimate's variance_review_pct percent; when that estimate's issued_date is on or before its scheduled_service_date and the cost-sharing posted exceeds the tolerance figure, a dollar credit of variance_share times the excess of the cost-sharing posted over the tolerance figure, rounded half-up to the cent, is subtracted; when that estimate carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, and the cost-sharing posted exceeds its estimate_total_usd, a flat dollar credit of late_estimate_credit_usd is subtracted; otherwise, including no linked insured estimate with an issued_date, nothing is subtracted.
    ins_estimate_credit: >-
      The cost-sharing posted is the total of the account's DEDUCTIBLE, COINSURANCE and COPAY liability postings, and the tolerance figure is the estimate_total_usd of the Insured Patient Out-of-Pocket Estimate linked to the account times one plus that estimate's variance_review_pct percent; when that estimate's issued_date is on or before its scheduled_service_date and the cost-sharing posted exceeds the tolerance figure, a dollar credit of variance_share times the excess of the cost-sharing posted over the tolerance figure, rounded half-up to the cent, is subtracted; when that estimate carries an issued_date and either no scheduled_service_date or a scheduled_service_date before that issued_date, and the cost-sharing posted exceeds its estimate_total_usd, a flat dollar credit of late_estimate_credit_usd is subtracted; otherwise, including no linked insured estimate with an issued_date, nothing is subtracted.
    ins_pos_paid: >-
      The account's POINT_OF_SERVICE payments are totalled: a total of at least pos_full_usd adds pos_full_points percentage points to the insured payoff discount percent, a total above 0.00 but below pos_full_usd adds pos_partial_points percentage points, and no such payment adds none.
    ins_pos_points: >-
      The account's POINT_OF_SERVICE payments are totalled: a total of at least pos_full_usd adds pos_full_points percentage points to the insured payoff discount percent, a total above 0.00 but below pos_full_usd adds pos_partial_points percentage points, and no such payment adds none.
    ins_nc_posted: >-
      The non-covered share is the account's NONCOVERED_SERVICE liability postings as a percent of all its liability postings: a share of at least high_noncovered_share_pct adds high_noncovered_points percentage points to the insured payoff discount percent, a share of at least low_noncovered_share_pct but below high_noncovered_share_pct adds low_noncovered_points percentage points, and a smaller share or no liability posting adds none.
    ins_nc_share: >-
      The non-covered share is the account's NONCOVERED_SERVICE liability postings as a percent of all its liability postings: a share of at least high_noncovered_share_pct adds high_noncovered_points percentage points to the insured payoff discount percent, a share of at least low_noncovered_share_pct but below high_noncovered_share_pct adds low_noncovered_points percentage points, and a smaller share or no liability posting adds none.
    ins_nc_points: >-
      The non-covered share is the account's NONCOVERED_SERVICE liability postings as a percent of all its liability postings: a share of at least high_noncovered_share_pct adds high_noncovered_points percentage points to the insured payoff discount percent, a share of at least low_noncovered_share_pct but below high_noncovered_share_pct adds low_noncovered_points percentage points, and a smaller share or no liability posting adds none.
    ins_total_pct: >-
      The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the insured payoff discount percent, the combined percent is applied once to the insured balance standing and rounded half-up to the cent, every adjustment stated in dollars is then subtracted from the insured balance standing together with that discount, and the insured payoff amount is never below 0.00.
    ins_discount: >-
      The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the insured payoff discount percent, the combined percent is applied once to the insured balance standing and rounded half-up to the cent, every adjustment stated in dollars is then subtracted from the insured balance standing together with that discount, and the insured payoff amount is never below 0.00.
    result: >-
      The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the insured payoff discount percent, the combined percent is applied once to the insured balance standing and rounded half-up to the cent, every adjustment stated in dollars is then subtracted from the insured balance standing together with that discount, and the insured payoff amount is never below 0.00.
  factors:
  - id: days_to_pay_schedule
    effect: parameter
    decides: ins_days_points
    bindings:
    - ins_days_to_pay
    - ins_days_points
    ladder:
    - when: days to pay first_window_days or fewer
      value: K('first_window_points') points
    - when: above first_window_days, no more than second_window_days
      value: K('second_window_points') points
    - when: otherwise (later, or no first_statement_date)
      value: 0 points
    baseline:
      ins_days_points: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: paperless_allowance
    effect: parameter
    decides: ins_paperless_points
    bindings:
    - ins_last_channel
    - ins_paperless_points
    ladder:
    - when: most recent SUMMARY_STATEMENT by PATIENT_PORTAL
      value: K('portal_points') points
    - when: by EMAIL_LINK
      value: K('email_points') points
    - when: otherwise
      value: 0 points
    baseline:
      ins_paperless_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: liability_size_band
    effect: parameter
    decides: ins_size_points
    bindings:
    - ins_liability_total
    - ins_size_points
    ladder:
    - when: liability postings at least large_liability_usd
      value: K('large_liability_points') points
    - when: at least moderate_liability_usd, below large_liability_usd
      value: K('moderate_liability_points') points
    - when: otherwise
      value: 0 points
    baseline:
      ins_size_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: estimate_variance_relief
    effect: method
    decides: ins_estimate_credit
    bindings:
    - ins_cost_share
    - ins_est_total
    - ins_est_issued
    - ins_est_service
    - ins_est_tolerance
    - ins_estimate_credit
    ladder:
    - when: >-
        linked insured estimate issued on or before its scheduled_service_date AND cost-sharing above the tolerance figure
      method: credit = variance_share times (cost-sharing minus tolerance), rounded to the cent (proportional)
    - when: estimate issued with no scheduled_service_date or after it AND cost-sharing above its total
      method: credit = flat late_estimate_credit_usd
    - when: otherwise
      method: no credit
    baseline:
      ins_estimate_credit: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: estimate
  - id: check_in_payment_allowance
    effect: parameter
    decides: ins_pos_points
    bindings:
    - ins_pos_paid
    - ins_pos_points
    ladder:
    - when: POINT_OF_SERVICE payments at least pos_full_usd
      value: K('pos_full_points') points
    - when: above 0.00, below pos_full_usd
      value: K('pos_partial_points') points
    - when: otherwise
      value: 0 points
    baseline:
      ins_pos_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: noncovered_share
    effect: parameter
    decides: ins_nc_points
    bindings:
    - ins_nc_posted
    - ins_nc_share
    - ins_nc_points
    ladder:
    - when: NONCOVERED_SERVICE postings at least high_noncovered_share_pct of all liability postings
      value: K('high_noncovered_points') points
    - when: at least low_noncovered_share_pct, below high_noncovered_share_pct
      value: K('low_noncovered_points') points
    - when: otherwise
      value: 0 points
    baseline:
      ins_nc_points: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The insured balance standing is the account's patient_balance immediately before the payment. The insured payoff discount is prompt_pay_discount_pct percent of the insured balance standing, rounded half-up to the cent, and the insured payoff amount is the insured balance standing less that discount.
    params:
    - prompt_pay_discount_pct
  inputs:
    history:
    - table: encounter_transactions
      aggregate: latest
      field: delivery_channel
      filters:
        event_type: encounter_statement_issued
        statement_type: SUMMARY_STATEMENT
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_liability_posted
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_payment_posted
        payment_channel: POINT_OF_SERVICE
    cross_category:
    - estimate
- id: encounter_ext_terminated_coverage_discount
  base_policy_refs:
  - encounter_uninsured_discount
  - encounter_prompt_pay_discount
  - encounter_charge_dispute_and_correction
  - encounter_small_balance_and_courtesy
  - encounter_coverage_update_rebill
  overwrite:
  - base_policy: encounter_uninsured_discount
    superseded_clause: The uninsured discount applies only when the account's financial_class is SELF_PAY at final bill.
    replaced_by: >-
      The uninsured discount applies to an account whose financial_class is SELF_PAY at final bill and to the COVERAGE_TERMINATED liability postings of an account whose financial class was corrected to SELF_PAY after its final bill, priced under this rule; the NONCOVERED_SERVICE liability postings of an insured account and the observation-rate discount on observation-hour charge lines are outside this sentence.
  trigger: state_due
  subject:
  - encounter_adjustment_posted
  computes: amount
  target_tool: post_terminated_coverage_discount_f939a41d
  params:
    emergency_arrival_points: 5.0
    unscheduled_arrival_points: 2.5
    large_loss_usd: 7500.0
    moderate_loss_usd: 2500.0
    large_loss_points: 5.0
    moderate_loss_points: 2.5
    recent_denial_days: 365
    assets_limit_points: 10.0
    income_limit_points: 5.0
    catastrophic_cap_pct: 20.0
    catastrophic_flat_pct: 10.0
    catastrophic_flat_usd: 250.0
    multi_loss_points: 5.0
    one_loss_points: 2.5
  rule: >-
    When a payer reports that coverage terminated before the date of service and the account's financial_class is corrected to SELF_PAY after its final bill, the payer's denial amounts stand as COVERAGE_TERMINATED liability postings; one UNINSURED_DISCOUNT adjustment is owed on them, sourced to the account's most recent COVERAGE_TERMINATED posting by posting date (of two posted on the same day, the one recorded first), and this rule fixes its amount; the account receives that adjustment once, and a COVERAGE_TERMINATED posting recorded after it stands receives no further uninsured discount. The uninsured discount applies to an account whose financial_class is SELF_PAY at final bill and to the COVERAGE_TERMINATED liability postings of an account whose financial class was corrected to SELF_PAY after its final bill, priced under this rule; the NONCOVERED_SERVICE liability postings of an insured account and the observation-rate discount on observation-hour charge lines are outside this sentence. The coverage-loss amount is the total of the account's COVERAGE_TERMINATED liability postings; an account with none has a coverage-loss amount of 0.00 and receives no coverage-loss discount. The coverage-loss discount percent starts from uninsured_discount_elective_pct for an account classified ELECTIVE_NON_COVERED and from uninsured_discount_pct for any other account. The coverage-loss discount is that percent of the coverage-loss amount, rounded half-up to the cent. The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the coverage-loss discount percent, the combined percent is applied once to the coverage-loss amount and rounded half-up to the cent, every adjustment stated in dollars is then added to that figure, and the resulting coverage-loss discount never exceeds the coverage-loss amount. An account classified EMERGENCY that carries an emergency department level charge line (revenue code 0450) adds emergency_arrival_points percentage points to the coverage-loss discount percent; an account classified MEDICALLY_NECESSARY that carries such a line adds unscheduled_arrival_points percentage points; any other account adds none. A coverage-loss amount of at least large_loss_usd adds large_loss_points percentage points to the coverage-loss discount percent; one of at least moderate_loss_usd but below large_loss_usd adds moderate_loss_points percentage points; a smaller one adds none. The patient's most recent assistance determination, read only among cases in approved, denied, expired or revoked status (a case in submitted, pending_documents or withdrawn status awaits or lacks a determination and is never read), with an award, expiry or revocation dated the same day as a denial taken as the later and the first recorded of two same-day denials taken, sets the coverage-loss near-eligibility allowance when it is a denial whose determination_date falls no more than recent_denial_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_limit_points percentage points to the coverage-loss discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_limit_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none. The catastrophic share compares the coverage-loss amount with the annual_household_income_usd documented on the patient's most recent assistance determination when that determination is a denial (determinations read only among cases in approved, denied, expired or revoked status, an award, expiry or revocation dated the same day as a denial taken as the later, the first recorded of two same-day denials taken): when the coverage-loss amount is at least catastrophic_cap_pct percent of that income, a dollar credit is added equal to the coverage-loss amount times one minus the starting coverage-loss discount percent, less catastrophic_cap_pct percent of that income, rounded half-up to the cent and never below catastrophic_flat_usd; when it is at least catastrophic_flat_pct percent but below catastrophic_cap_pct percent of that income, a flat catastrophic_flat_usd is added; with no such denial, an income of 0.00 or a smaller share, nothing is added. The other coverage losses are the PR-27 patient-responsibility releases on the patient's claims other than the claim that the account's most recent COVERAGE_TERMINATED posting names (by posting date, the first recorded on a same-day tie; when that posting names no claim, every PR-27 release counts): two or more add multi_loss_points percentage points to the coverage-loss discount percent, exactly one adds one_loss_points percentage points, and none adds none.
  prerequisite: []
  cross_category:
  - category: assist
    as: branch
    reads:
    - status
    - variant_name
    - denial_reason
    - determination_date
    - annual_household_income_usd
    note: >-
      coverage_loss_near_eligibility and catastrophic_share each read the patient's most recent assistance determination among determined cases (status filter).
  - category: claim
    as: history
    reads:
    - claim_transactions.carc_code
    - claim_transactions.claim_id
    note: other_coverage_losses counts PR-27 releases on the patient's other claims.
  compute:
  - td_amount: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COVERAGE_TERMINATED')
  - td_std_pct: >-
      P('uninsured_discount_elective_pct') if F('service_classification') == 'ELECTIVE_NON_COVERED' else P('uninsured_discount_pct')
  - td_ed_lines: COUNT('encounter_transactions', event_type='encounter_charge_posted', revenue_code='0450')
  - td_arrival_points: >-
      K('emergency_arrival_points') if (F('service_classification') == 'EMERGENCY' and td_ed_lines > 0) else (K('unscheduled_arrival_points') if (F('service_classification') == 'MEDICALLY_NECESSARY' and td_ed_lines > 0) else 0)
  - td_band_points: >-
      K('large_loss_points') if SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COVERAGE_TERMINATED') >= K('large_loss_usd') else (K('moderate_loss_points') if SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COVERAGE_TERMINATED') >= K('moderate_loss_usd') else 0)
  - td_award_date: >-
      MX(XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='approved') or '', XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='expired') or '', XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='revoked') or '')
  - td_case_tier: >-
      XLATEST('assist', 'assistance_cases', 'variant_name', date_field='determination_date', status='denied') or ''
  - td_case_reason: >-
      XLATEST('assist', 'assistance_cases', 'denial_reason', date_field='determination_date', status='denied') or ''
  - td_case_date: >-
      XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='denied') or ''
  - td_case_age: DAYS(td_case_date, NOW) if td_case_date != '' else 99999
  - td_near_points: >-
      K('assets_limit_points') if (td_case_date != '' and td_case_date > td_award_date and td_case_tier == 'Riverbend Medical Hardship Assistance (above 400% FPL)' and td_case_reason == 'ASSETS_ABOVE_LIMIT' and td_case_age <= K('recent_denial_days')) else (K('income_limit_points') if (td_case_date != '' and td_case_date > td_award_date and td_case_tier == 'Riverbend Medical Hardship Assistance (above 400% FPL)' and td_case_reason == 'INCOME_ABOVE_LIMIT' and td_case_age <= K('recent_denial_days')) else 0)
  - td_cat_date: >-
      XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='denied') or ''
  - td_cat_award_date: >-
      MX(XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='approved') or '', XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='expired') or '', XLATEST('assist', 'assistance_cases', 'determination_date', date_field='determination_date', status='revoked') or '')
  - td_case_income: >-
      (XLATEST('assist', 'assistance_cases', 'annual_household_income_usd', date_field='determination_date', status='denied') or 0) if (td_cat_date != '' and td_cat_date > td_cat_award_date) else 0
  - td_catastrophic_credit: >-
      MX(K('catastrophic_flat_usd'), RND(SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COVERAGE_TERMINATED') * (1 - td_std_pct / 100) - td_case_income * K('catastrophic_cap_pct') / 100, 2)) if (td_case_income > 0 and SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COVERAGE_TERMINATED') >= td_case_income * K('catastrophic_cap_pct') / 100) else (K('catastrophic_flat_usd') if (td_case_income > 0 and SUM('encounter_transactions', 'amount', event_type='encounter_liability_posted', liability_source='COVERAGE_TERMINATED') >= td_case_income * K('catastrophic_flat_pct') / 100) else 0)
  - td_claim: >-
      LATEST('encounter_transactions', 'claim_id', date_field='posting_date', event_type='encounter_liability_posted', liability_source='COVERAGE_TERMINATED') or ''
  - td_other_losses: >-
      XCOUNT('claim', 'claim_transactions', event_type='claim_patient_resp_transferred', carc_code='PR-27') - XCOUNT('claim', 'claim_transactions', event_type='claim_patient_resp_transferred', carc_code='PR-27', claim_id=td_claim)
  - td_shared_points: >-
      K('multi_loss_points') if td_other_losses >= 2 else (K('one_loss_points') if td_other_losses >= 1 else 0)
  - td_total_pct: td_std_pct + td_arrival_points + td_band_points + td_near_points + td_shared_points
  - result: MN(td_amount, RND(td_amount * td_total_pct / 100, 2) + td_catastrophic_credit)
  compute_basis:
    td_amount: >-
      The coverage-loss amount is the total of the account's COVERAGE_TERMINATED liability postings; an account with none has a coverage-loss amount of 0.00 and receives no coverage-loss discount.
    td_std_pct: >-
      The coverage-loss discount percent starts from uninsured_discount_elective_pct for an account classified ELECTIVE_NON_COVERED and from uninsured_discount_pct for any other account.
    td_ed_lines: >-
      An account classified EMERGENCY that carries an emergency department level charge line (revenue code 0450) adds emergency_arrival_points percentage points to the coverage-loss discount percent; an account classified MEDICALLY_NECESSARY that carries such a line adds unscheduled_arrival_points percentage points; any other account adds none.
    td_arrival_points: >-
      An account classified EMERGENCY that carries an emergency department level charge line (revenue code 0450) adds emergency_arrival_points percentage points to the coverage-loss discount percent; an account classified MEDICALLY_NECESSARY that carries such a line adds unscheduled_arrival_points percentage points; any other account adds none.
    td_band_points: >-
      A coverage-loss amount of at least large_loss_usd adds large_loss_points percentage points to the coverage-loss discount percent; one of at least moderate_loss_usd but below large_loss_usd adds moderate_loss_points percentage points; a smaller one adds none.
    td_case_tier: >-
      The patient's most recent assistance determination, read only among cases in approved, denied, expired or revoked status (a case in submitted, pending_documents or withdrawn status awaits or lacks a determination and is never read), with an award, expiry or revocation dated the same day as a denial taken as the later and the first recorded of two same-day denials taken, sets the coverage-loss near-eligibility allowance when it is a denial whose determination_date falls no more than recent_denial_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_limit_points percentage points to the coverage-loss discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_limit_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    td_case_reason: >-
      The patient's most recent assistance determination, read only among cases in approved, denied, expired or revoked status (a case in submitted, pending_documents or withdrawn status awaits or lacks a determination and is never read), with an award, expiry or revocation dated the same day as a denial taken as the later and the first recorded of two same-day denials taken, sets the coverage-loss near-eligibility allowance when it is a denial whose determination_date falls no more than recent_denial_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_limit_points percentage points to the coverage-loss discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_limit_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    td_case_date: >-
      The patient's most recent assistance determination, read only among cases in approved, denied, expired or revoked status (a case in submitted, pending_documents or withdrawn status awaits or lacks a determination and is never read), with an award, expiry or revocation dated the same day as a denial taken as the later and the first recorded of two same-day denials taken, sets the coverage-loss near-eligibility allowance when it is a denial whose determination_date falls no more than recent_denial_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_limit_points percentage points to the coverage-loss discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_limit_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    td_case_age: >-
      The patient's most recent assistance determination, read only among cases in approved, denied, expired or revoked status (a case in submitted, pending_documents or withdrawn status awaits or lacks a determination and is never read), with an award, expiry or revocation dated the same day as a denial taken as the later and the first recorded of two same-day denials taken, sets the coverage-loss near-eligibility allowance when it is a denial whose determination_date falls no more than recent_denial_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_limit_points percentage points to the coverage-loss discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_limit_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    td_near_points: >-
      The patient's most recent assistance determination, read only among cases in approved, denied, expired or revoked status (a case in submitted, pending_documents or withdrawn status awaits or lacks a determination and is never read), with an award, expiry or revocation dated the same day as a denial taken as the later and the first recorded of two same-day denials taken, sets the coverage-loss near-eligibility allowance when it is a denial whose determination_date falls no more than recent_denial_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_limit_points percentage points to the coverage-loss discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_limit_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    td_case_income: >-
      The catastrophic share compares the coverage-loss amount with the annual_household_income_usd documented on the patient's most recent assistance determination when that determination is a denial (determinations read only among cases in approved, denied, expired or revoked status, an award, expiry or revocation dated the same day as a denial taken as the later, the first recorded of two same-day denials taken): when the coverage-loss amount is at least catastrophic_cap_pct percent of that income, a dollar credit is added equal to the coverage-loss amount times one minus the starting coverage-loss discount percent, less catastrophic_cap_pct percent of that income, rounded half-up to the cent and never below catastrophic_flat_usd; when it is at least catastrophic_flat_pct percent but below catastrophic_cap_pct percent of that income, a flat catastrophic_flat_usd is added; with no such denial, an income of 0.00 or a smaller share, nothing is added.
    td_catastrophic_credit: >-
      The catastrophic share compares the coverage-loss amount with the annual_household_income_usd documented on the patient's most recent assistance determination when that determination is a denial (determinations read only among cases in approved, denied, expired or revoked status, an award, expiry or revocation dated the same day as a denial taken as the later, the first recorded of two same-day denials taken): when the coverage-loss amount is at least catastrophic_cap_pct percent of that income, a dollar credit is added equal to the coverage-loss amount times one minus the starting coverage-loss discount percent, less catastrophic_cap_pct percent of that income, rounded half-up to the cent and never below catastrophic_flat_usd; when it is at least catastrophic_flat_pct percent but below catastrophic_cap_pct percent of that income, a flat catastrophic_flat_usd is added; with no such denial, an income of 0.00 or a smaller share, nothing is added.
    td_claim: >-
      The other coverage losses are the PR-27 patient-responsibility releases on the patient's claims other than the claim that the account's most recent COVERAGE_TERMINATED posting names (by posting date, the first recorded on a same-day tie; when that posting names no claim, every PR-27 release counts): two or more add multi_loss_points percentage points to the coverage-loss discount percent, exactly one adds one_loss_points percentage points, and none adds none.
    td_other_losses: >-
      The other coverage losses are the PR-27 patient-responsibility releases on the patient's claims other than the claim that the account's most recent COVERAGE_TERMINATED posting names (by posting date, the first recorded on a same-day tie; when that posting names no claim, every PR-27 release counts): two or more add multi_loss_points percentage points to the coverage-loss discount percent, exactly one adds one_loss_points percentage points, and none adds none.
    td_shared_points: >-
      The other coverage losses are the PR-27 patient-responsibility releases on the patient's claims other than the claim that the account's most recent COVERAGE_TERMINATED posting names (by posting date, the first recorded on a same-day tie; when that posting names no claim, every PR-27 release counts): two or more add multi_loss_points percentage points to the coverage-loss discount percent, exactly one adds one_loss_points percentage points, and none adds none.
    td_total_pct: >-
      The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the coverage-loss discount percent, the combined percent is applied once to the coverage-loss amount and rounded half-up to the cent, every adjustment stated in dollars is then added to that figure, and the resulting coverage-loss discount never exceeds the coverage-loss amount.
    result: >-
      The adjustments described below are combined with that standard figure this way: every adjustment stated in percentage points is added to the coverage-loss discount percent, the combined percent is applied once to the coverage-loss amount and rounded half-up to the cent, every adjustment stated in dollars is then added to that figure, and the resulting coverage-loss discount never exceeds the coverage-loss amount.
    td_cat_date: >-
      The catastrophic share compares the coverage-loss amount with the annual_household_income_usd documented on the patient's most recent assistance determination when that determination is a denial (determinations read only among cases in approved, denied, expired or revoked status, an award, expiry or revocation dated the same day as a denial taken as the later, the first recorded of two same-day denials taken): when the coverage-loss amount is at least catastrophic_cap_pct percent of that income, a dollar credit is added equal to the coverage-loss amount times one minus the starting coverage-loss discount percent, less catastrophic_cap_pct percent of that income, rounded half-up to the cent and never below catastrophic_flat_usd; when it is at least catastrophic_flat_pct percent but below catastrophic_cap_pct percent of that income, a flat catastrophic_flat_usd is added; with no such denial, an income of 0.00 or a smaller share, nothing is added.
    td_award_date: >-
      The patient's most recent assistance determination, read only among cases in approved, denied, expired or revoked status (a case in submitted, pending_documents or withdrawn status awaits or lacks a determination and is never read), with an award, expiry or revocation dated the same day as a denial taken as the later and the first recorded of two same-day denials taken, sets the coverage-loss near-eligibility allowance when it is a denial whose determination_date falls no more than recent_denial_days days before the day the discount is posted: a case of the Riverbend Medical Hardship Assistance (above 400% FPL) tier denied as ASSETS_ABOVE_LIMIT adds assets_limit_points percentage points to the coverage-loss discount percent, a case of that tier denied as INCOME_ABOVE_LIMIT adds income_limit_points percentage points, and any other case, a most recent determination that is not a denial, an older determination or no determination adds none.
    td_cat_award_date: >-
      The catastrophic share compares the coverage-loss amount with the annual_household_income_usd documented on the patient's most recent assistance determination when that determination is a denial (determinations read only among cases in approved, denied, expired or revoked status, an award, expiry or revocation dated the same day as a denial taken as the later, the first recorded of two same-day denials taken): when the coverage-loss amount is at least catastrophic_cap_pct percent of that income, a dollar credit is added equal to the coverage-loss amount times one minus the starting coverage-loss discount percent, less catastrophic_cap_pct percent of that income, rounded half-up to the cent and never below catastrophic_flat_usd; when it is at least catastrophic_flat_pct percent but below catastrophic_cap_pct percent of that income, a flat catastrophic_flat_usd is added; with no such denial, an income of 0.00 or a smaller share, nothing is added.
  factors:
  - id: arrival_through_emergency
    effect: parameter
    decides: td_arrival_points
    bindings:
    - td_ed_lines
    - td_arrival_points
    ladder:
    - when: classified EMERGENCY AND an ED level line (0450)
      value: K('emergency_arrival_points') points
    - when: classified MEDICALLY_NECESSARY AND an ED level line
      value: K('unscheduled_arrival_points') points
    - when: otherwise
      value: 0 points
    baseline:
      td_arrival_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: coverage_loss_band
    effect: parameter
    decides: td_band_points
    bindings:
    - td_band_points
    ladder:
    - when: coverage-loss amount at least large_loss_usd
      value: K('large_loss_points') points
    - when: at least moderate_loss_usd, below large_loss_usd
      value: K('moderate_loss_points') points
    - when: otherwise
      value: 0 points
    baseline:
      td_band_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: coverage_loss_near_eligibility
    effect: parameter
    decides: td_near_points
    bindings:
    - td_award_date
    - td_case_tier
    - td_case_reason
    - td_case_date
    - td_case_age
    - td_near_points
    ladder:
    - when: >-
        most recent determination (approved/denied/expired/revoked cases only) is a denial of the Medical Hardship tier AND denied ASSETS_ABOVE_LIMIT AND determined within recent_denial_days
      value: K('assets_limit_points') points
    - when: Medical Hardship tier AND denied INCOME_ABOVE_LIMIT AND determined within recent_denial_days
      value: K('income_limit_points') points
    - when: otherwise
      value: 0 points
    baseline:
      td_near_points: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: assist
  - id: catastrophic_share
    effect: method
    decides: td_catastrophic_credit
    bindings:
    - td_cat_date
    - td_cat_award_date
    - td_case_income
    - td_catastrophic_credit
    ladder:
    - when: >-
        coverage-loss amount at least catastrophic_cap_pct of the income on the most recent determination, that determination being a denial
      method: >-
        credit = amount net of the starting percent less catastrophic_cap_pct of income, at least catastrophic_flat_usd (caps the self-pay figure at that share of income)
    - when: at least catastrophic_flat_pct, below catastrophic_cap_pct of income
      method: credit = flat catastrophic_flat_usd
    - when: otherwise
      method: no credit
    baseline:
      td_catastrophic_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: assist
  - id: other_coverage_losses
    effect: parameter
    decides: td_shared_points
    bindings:
    - td_claim
    - td_other_losses
    - td_shared_points
    ladder:
    - when: two or more PR-27 releases on the patient's other claims
      value: K('multi_loss_points') points
    - when: exactly one
      value: K('one_loss_points') points
    - when: otherwise
      value: 0 points
    baseline:
      td_shared_points: '0'
    evidence:
    - cross_category
    cross_difficulty: claim
  baseline:
    rule: >-
      The coverage-loss amount is the total of the account's COVERAGE_TERMINATED liability postings; an account with none has a coverage-loss amount of 0.00 and receives no coverage-loss discount. The coverage-loss discount percent starts from uninsured_discount_elective_pct for an account classified ELECTIVE_NON_COVERED and from uninsured_discount_pct for any other account. The coverage-loss discount is that percent of the coverage-loss amount, rounded half-up to the cent.
    params:
    - uninsured_discount_pct
    - uninsured_discount_elective_pct
  inputs:
    history:
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_liability_posted
        liability_source: COVERAGE_TERMINATED
    - table: encounter_transactions
      aggregate: count
      field: encounter_txn_id
      filters:
        event_type: encounter_charge_posted
        revenue_code: '0450'
    - category: claim
      table: claim_transactions
      aggregate: count
      field: claim_txn_id
      filters:
        event_type: claim_patient_resp_transferred
        carc_code: PR-27
    cross_category:
    - assist
    - claim
- id: encounter_ext_observation_rate_discount
  base_policy_refs:
  - encounter_uninsured_discount
  - encounter_prompt_pay_discount
  - encounter_charge_dispute_and_correction
  - encounter_small_balance_and_courtesy
  - encounter_coverage_update_rebill
  overwrite:
  - base_policy: encounter_uninsured_discount
    superseded_clause: >-
      It is posted once per SELF_PAY_FINAL_BILL liability, as an UNINSURED_DISCOUNT adjustment whose source is that liability posting, at uninsured_discount_pct of the liability for EMERGENCY and MEDICALLY_NECESSARY services and at uninsured_discount_elective_pct for ELECTIVE_NON_COVERED services.
    replaced_by: >-
      The uninsured discount is posted once per SELF_PAY_FINAL_BILL liability, as an UNINSURED_DISCOUNT adjustment whose source is that liability posting, at uninsured_discount_pct of the liability for EMERGENCY and MEDICALLY_NECESSARY services and at uninsured_discount_elective_pct for ELECTIVE_NON_COVERED services; on a SELF_PAY account with observation-hour charge lines whose final bill has dropped and that is not priced under a Riverbend self-pay package, and only there, one further UNINSURED_DISCOUNT sourced to the most recent observation-hour charge line carries the observation-rate discount this rule fixes.
  - base_policy: encounter_uninsured_discount
    superseded_clause: The uninsured discount applies only when the account's financial_class is SELF_PAY at final bill.
    replaced_by: >-
      The uninsured discount applies to an account whose financial_class is SELF_PAY at final bill and, as the observation-rate discount priced under this rule, to the observation-hour charge lines of an account whose financial_class is SELF_PAY when the discount is posted, whose final bill has dropped and which is not priced under a Riverbend self-pay package; the NONCOVERED_SERVICE liability postings of an insured account and the COVERAGE_TERMINATED postings of an account corrected to SELF_PAY are outside this sentence.
  trigger: state_due
  subject:
  - encounter_adjustment_posted
  computes: amount
  target_tool: post_observation_rate_discount_cc1ec28d
  params:
    obs_day_rate_usd: 1250.0
    appleton_day_usd: 250.0
    chilton_day_usd: -250.0
    long_stay_hours: 48
    mid_stay_hours: 24
    long_stay_day_usd: -150.0
    mid_stay_day_usd: -50.0
    carveout_two_usd: 120.0
    carveout_one_usd: 60.0
    obs_floor_pct: 5.0
  rule: >-
    On a hospital account whose financial_class is SELF_PAY, which carries observation-hour charge lines (revenue code 0762), whose final bill has dropped (final_bill_date and service_end_date both recorded; as with every uninsured discount, none is owed while the stay is open or the account is still pending_billing) and which is not priced under a Riverbend self-pay package (an account carrying a PACKAGE_PRICE_ADJUSTMENT receives the package price and never this discount), Riverbend's self-pay observation rate is granted as one UNINSURED_DISCOUNT adjustment, sourced to the account's most recent observation-hour charge line by posting date (of two posted on the same day, the one recorded first), and this rule fixes its amount; the account receives that adjustment once, and an observation-hour charge line recorded after it stands receives no further observation-rate discount. The uninsured discount is posted once per SELF_PAY_FINAL_BILL liability, as an UNINSURED_DISCOUNT adjustment whose source is that liability posting, at uninsured_discount_pct of the liability for EMERGENCY and MEDICALLY_NECESSARY services and at uninsured_discount_elective_pct for ELECTIVE_NON_COVERED services; on a SELF_PAY account with observation-hour charge lines whose final bill has dropped and that is not priced under a Riverbend self-pay package, and only there, one further UNINSURED_DISCOUNT sourced to the most recent observation-hour charge line carries the observation-rate discount this rule fixes. The uninsured discount applies to an account whose financial_class is SELF_PAY at final bill and, as the observation-rate discount priced under this rule, to the observation-hour charge lines of an account whose financial_class is SELF_PAY when the discount is posted, whose final bill has dropped and which is not priced under a Riverbend self-pay package; the NONCOVERED_SERVICE liability postings of an insured account and the COVERAGE_TERMINATED postings of an account corrected to SELF_PAY are outside this sentence. The observation-hour charges are the total of the account's charge lines with revenue code 0762, and the observation hours are the total of their units; an account with no such line has observation-hour charges of 0.00 and receives no observation-rate discount. The observation net factor is one minus uninsured_discount_elective_pct percent for an account classified ELECTIVE_NON_COVERED and one minus uninsured_discount_pct percent for any other account. The observation days are the plain difference in days between service_start_date and service_end_date (0 when service_end_date is empty), and the observation-rate discount is the observation-hour charges above obs_day_rate_usd for each observation day, never below 0.00, times the observation net factor, rounded half-up to the cent. The observation-rate discount so figured is never less than obs_floor_pct percent of the observation-hour charges, rounded half-up to the cent. The adjustments described below are combined with that standard figure this way: an adjustment that sets the observation days replaces them, every adjustment stated in dollars per day is added to obs_day_rate_usd, the observation-rate discount is then figured once with those days and that day rate and held at its floor, every adjustment stated in flat dollars is added to it, and the observation-rate discount never exceeds the observation-hour charges. The campus day rate applies to observation placed through the emergency department and depends on the account's facility: on an account carrying an emergency department level charge line (revenue code 0450), Riverbend Regional Medical Center - Appleton (the tertiary campus) adds appleton_day_usd dollars per day to obs_day_rate_usd and Riverbend Community Hospital - Chilton (the critical-access campus) adds chilton_day_usd dollars per day; any other campus, or a stay with no such line (a direct or post-procedure placement), adds none. The observation day count follows the stay: for a stay whose service_end_date is after its service_start_date, on an account carrying an emergency department level charge line (revenue code 0450), whose observation hours exceed 24 times the plain day difference, the observation days are the observation hours divided by 24 and rounded up to a whole day; for a stay whose service_end_date is recorded and equals its service_start_date and that carries observation hours, the observation days are 1; otherwise they stay at the plain day difference. Observation hours of at least long_stay_hours add long_stay_day_usd dollars per day to obs_day_rate_usd, observation hours of at least mid_stay_hours but below long_stay_hours add mid_stay_day_usd dollars per day, and fewer hours add none. Separately billed procedure lines on the account (CT, revenue code 0350, and echocardiography, revenue code 0480), whose time is not observation time, earn the procedure carve-out: two or more such lines add a flat carveout_two_usd, exactly one adds a flat carveout_one_usd, and none adds nothing.
  prerequisite: []
  cross_category: []
  compute:
  - ob_charges: SUM('encounter_transactions', 'amount', event_type='encounter_charge_posted', revenue_code='0762')
  - ob_hours: SUM('encounter_transactions', 'units', event_type='encounter_charge_posted', revenue_code='0762')
  - ob_net: >-
      1 - (P('uninsured_discount_elective_pct') if F('service_classification') == 'ELECTIVE_NON_COVERED' else P('uninsured_discount_pct')) / 100
  - ob_plain_days: DAYS(F('service_start_date'), F('service_end_date')) if F('service_end_date') else 0
  - ob_campus_usd: >-
      K('appleton_day_usd') if (F('facility') == 'Riverbend Regional Medical Center - Appleton' and COUNT('encounter_transactions', event_type='encounter_charge_posted', revenue_code='0450') > 0) else (K('chilton_day_usd') if (F('facility') == 'Riverbend Community Hospital - Chilton' and COUNT('encounter_transactions', event_type='encounter_charge_posted', revenue_code='0450') > 0) else 0)
  - ob_ed_lines: COUNT('encounter_transactions', event_type='encounter_charge_posted', revenue_code='0450')
  - ob_days: >-
      -(-ob_hours // 24) if (ob_plain_days > 0 and ob_ed_lines > 0 and ob_hours > 24 * ob_plain_days) else (1 if (F('service_end_date') and ob_plain_days == 0 and ob_hours > 0) else ob_plain_days)
  - ob_long_usd: >-
      K('long_stay_day_usd') if SUM('encounter_transactions', 'units', event_type='encounter_charge_posted', revenue_code='0762') >= K('long_stay_hours') else (K('mid_stay_day_usd') if SUM('encounter_transactions', 'units', event_type='encounter_charge_posted', revenue_code='0762') >= K('mid_stay_hours') else 0)
  - ob_procedures: >-
      COUNT('encounter_transactions', event_type='encounter_charge_posted', revenue_code='0350') + COUNT('encounter_transactions', event_type='encounter_charge_posted', revenue_code='0480')
  - ob_carveout: >-
      K('carveout_two_usd') if ob_procedures >= 2 else (K('carveout_one_usd') if ob_procedures == 1 else 0)
  - ob_day_rate: K('obs_day_rate_usd') + ob_campus_usd + ob_long_usd
  - ob_package: >-
      COUNT('encounter_transactions', event_type='encounter_adjustment_posted', adjustment_code='PACKAGE_PRICE_ADJUSTMENT')
  - ob_billed: 1 if (F('final_bill_date') and F('service_end_date')) else 0
  - result: >-
      0 if (ob_package > 0 or ob_billed == 0) else MN(ob_charges, MX(RND(ob_charges * K('obs_floor_pct') / 100, 2), RND(MX(0, ob_charges - ob_day_rate * ob_days) * ob_net, 2)) + ob_carveout)
  compute_basis:
    ob_charges: >-
      The observation-hour charges are the total of the account's charge lines with revenue code 0762, and the observation hours are the total of their units; an account with no such line has observation-hour charges of 0.00 and receives no observation-rate discount.
    ob_hours: >-
      The observation-hour charges are the total of the account's charge lines with revenue code 0762, and the observation hours are the total of their units; an account with no such line has observation-hour charges of 0.00 and receives no observation-rate discount.
    ob_net: >-
      The observation net factor is one minus uninsured_discount_elective_pct percent for an account classified ELECTIVE_NON_COVERED and one minus uninsured_discount_pct percent for any other account.
    ob_plain_days: >-
      The observation days are the plain difference in days between service_start_date and service_end_date (0 when service_end_date is empty), and the observation-rate discount is the observation-hour charges above obs_day_rate_usd for each observation day, never below 0.00, times the observation net factor, rounded half-up to the cent. The observation-rate discount so figured is never less than obs_floor_pct percent of the observation-hour charges, rounded half-up to the cent.
    ob_campus_usd: >-
      The campus day rate applies to observation placed through the emergency department and depends on the account's facility: on an account carrying an emergency department level charge line (revenue code 0450), Riverbend Regional Medical Center - Appleton (the tertiary campus) adds appleton_day_usd dollars per day to obs_day_rate_usd and Riverbend Community Hospital - Chilton (the critical-access campus) adds chilton_day_usd dollars per day; any other campus, or a stay with no such line (a direct or post-procedure placement), adds none.
    ob_ed_lines: >-
      The observation day count follows the stay: for a stay whose service_end_date is after its service_start_date, on an account carrying an emergency department level charge line (revenue code 0450), whose observation hours exceed 24 times the plain day difference, the observation days are the observation hours divided by 24 and rounded up to a whole day; for a stay whose service_end_date is recorded and equals its service_start_date and that carries observation hours, the observation days are 1; otherwise they stay at the plain day difference.
    ob_days: >-
      The observation day count follows the stay: for a stay whose service_end_date is after its service_start_date, on an account carrying an emergency department level charge line (revenue code 0450), whose observation hours exceed 24 times the plain day difference, the observation days are the observation hours divided by 24 and rounded up to a whole day; for a stay whose service_end_date is recorded and equals its service_start_date and that carries observation hours, the observation days are 1; otherwise they stay at the plain day difference.
    ob_long_usd: >-
      Observation hours of at least long_stay_hours add long_stay_day_usd dollars per day to obs_day_rate_usd, observation hours of at least mid_stay_hours but below long_stay_hours add mid_stay_day_usd dollars per day, and fewer hours add none.
    ob_procedures: >-
      Separately billed procedure lines on the account (CT, revenue code 0350, and echocardiography, revenue code 0480), whose time is not observation time, earn the procedure carve-out: two or more such lines add a flat carveout_two_usd, exactly one adds a flat carveout_one_usd, and none adds nothing.
    ob_carveout: >-
      Separately billed procedure lines on the account (CT, revenue code 0350, and echocardiography, revenue code 0480), whose time is not observation time, earn the procedure carve-out: two or more such lines add a flat carveout_two_usd, exactly one adds a flat carveout_one_usd, and none adds nothing.
    ob_day_rate: >-
      The adjustments described below are combined with that standard figure this way: an adjustment that sets the observation days replaces them, every adjustment stated in dollars per day is added to obs_day_rate_usd, the observation-rate discount is then figured once with those days and that day rate and held at its floor, every adjustment stated in flat dollars is added to it, and the observation-rate discount never exceeds the observation-hour charges.
    result: >-
      The adjustments described below are combined with that standard figure this way: an adjustment that sets the observation days replaces them, every adjustment stated in dollars per day is added to obs_day_rate_usd, the observation-rate discount is then figured once with those days and that day rate and held at its floor, every adjustment stated in flat dollars is added to it, and the observation-rate discount never exceeds the observation-hour charges.
    ob_package: >-
      On a hospital account whose financial_class is SELF_PAY, which carries observation-hour charge lines (revenue code 0762), whose final bill has dropped (final_bill_date and service_end_date both recorded; as with every uninsured discount, none is owed while the stay is open or the account is still pending_billing) and which is not priced under a Riverbend self-pay package (an account carrying a PACKAGE_PRICE_ADJUSTMENT receives the package price and never this discount), Riverbend's self-pay observation rate is granted as one UNINSURED_DISCOUNT adjustment, sourced to the account's most recent observation-hour charge line by posting date (of two posted on the same day, the one recorded first), and this rule fixes its amount; the account receives that adjustment once, and an observation-hour charge line recorded after it stands receives no further observation-rate discount.
    ob_billed: >-
      On a hospital account whose financial_class is SELF_PAY, which carries observation-hour charge lines (revenue code 0762), whose final bill has dropped (final_bill_date and service_end_date both recorded; as with every uninsured discount, none is owed while the stay is open or the account is still pending_billing) and which is not priced under a Riverbend self-pay package (an account carrying a PACKAGE_PRICE_ADJUSTMENT receives the package price and never this discount), Riverbend's self-pay observation rate is granted as one UNINSURED_DISCOUNT adjustment, sourced to the account's most recent observation-hour charge line by posting date (of two posted on the same day, the one recorded first), and this rule fixes its amount; the account receives that adjustment once, and an observation-hour charge line recorded after it stands receives no further observation-rate discount.
  factors:
  - id: campus_day_rate
    effect: parameter
    decides: ob_campus_usd
    bindings:
    - ob_campus_usd
    ladder:
    - when: facility Riverbend Regional Medical Center - Appleton AND an ED level line (0450)
      value: K('appleton_day_usd') dollars per day
    - when: facility Riverbend Community Hospital - Chilton AND an ED level line (0450)
      value: K('chilton_day_usd') dollars per day
    - when: otherwise
      value: '0'
    baseline:
      ob_campus_usd: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: observation_day_count
    effect: method
    decides: ob_days
    bindings:
    - ob_ed_lines
    - ob_days
    ladder:
    - when: >-
        end date after start date AND an ED level line (0450) AND observation hours above 24 times the plain day difference
      method: observation days = observation hours / 24 rounded up
    - when: same-day stay (end date recorded and equal to start date) AND observation hours billed
      method: observation days = 1
    - when: otherwise
      method: observation days = plain day difference
    baseline:
      ob_days: ob_plain_days
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: long_stay_rate
    effect: parameter
    decides: ob_long_usd
    bindings:
    - ob_long_usd
    ladder:
    - when: observation hours at least long_stay_hours
      value: K('long_stay_day_usd') dollars per day
    - when: at least mid_stay_hours, below long_stay_hours
      value: K('mid_stay_day_usd') dollars per day
    - when: otherwise
      value: '0'
    baseline:
      ob_long_usd: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: procedure_carveout
    effect: parameter
    decides: ob_carveout
    bindings:
    - ob_procedures
    - ob_carveout
    ladder:
    - when: two or more CT (0350) or echocardiography (0480) lines
      value: K('carveout_two_usd')
    - when: exactly one such line
      value: K('carveout_one_usd')
    - when: otherwise
      value: '0'
    baseline:
      ob_carveout: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The observation-hour charges are the total of the account's charge lines with revenue code 0762, and the observation hours are the total of their units; an account with no such line has observation-hour charges of 0.00 and receives no observation-rate discount. The observation net factor is one minus uninsured_discount_elective_pct percent for an account classified ELECTIVE_NON_COVERED and one minus uninsured_discount_pct percent for any other account. The observation days are the plain difference in days between service_start_date and service_end_date (0 when service_end_date is empty), and the observation-rate discount is the observation-hour charges above obs_day_rate_usd for each observation day, never below 0.00, times the observation net factor, rounded half-up to the cent. The observation-rate discount so figured is never less than obs_floor_pct percent of the observation-hour charges, rounded half-up to the cent.
    params:
    - obs_day_rate_usd
    - uninsured_discount_pct
    - uninsured_discount_elective_pct
    - obs_floor_pct
  inputs:
    history:
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_charge_posted
        revenue_code: '0762'
    - table: encounter_transactions
      aggregate: sum
      field: units
      filters:
        event_type: encounter_charge_posted
        revenue_code: '0762'
    - table: encounter_transactions
      aggregate: count
      field: encounter_txn_id
      filters:
        event_type: encounter_adjustment_posted
        adjustment_code: PACKAGE_PRICE_ADJUSTMENT
    cross_category: []
- id: encounter_ext_service_recovery_courtesy
  base_policy_refs:
