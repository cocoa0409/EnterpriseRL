  - encounter_uninsured_discount
  - encounter_prompt_pay_discount
  - encounter_charge_dispute_and_correction
  - encounter_coverage_update_rebill
  overwrite:
  - base_policy: encounter_small_balance_and_courtesy
    superseded_clause: >-
      A representative may grant one SERVICE_RECOVERY_COURTESY adjustment on an account when the patient reports a documented service failure (a billing error already corrected on the account, or a statement sent during an active billing hold), up to service_recovery_courtesy_max_usd and never more than the current patient balance.
    replaced_by: >-
      On an account whose financial class was corrected to SELF_PAY after its final bill and whose summary statements were issued while its COVERAGE_TERMINATED postings carried no uninsured discount, one SERVICE_RECOVERY_COURTESY adjustment is owed for that failure whether or not the patient reports it, sourced to the account's most recent COVERAGE_TERMINATED posting by posting date (of two posted on the same day, the one recorded first), in the amount this rule fixes, never more than service_recovery_courtesy_max_usd and never more than the current patient balance; on every other account a representative may grant one SERVICE_RECOVERY_COURTESY adjustment when the patient reports a documented service failure (a billing error already corrected on the account, or a statement sent during an active billing hold), up to service_recovery_courtesy_max_usd and never more than the current patient balance.
  - base_policy: encounter_small_balance_and_courtesy
    superseded_clause: >-
      A courtesy adjustment is never granted on an account in bad_debt status or on a balance under an active payment plan, and it is not combined with a prompt-pay discount on the same account.
    replaced_by: >-
      A courtesy adjustment is never granted on an account in bad_debt status or on a balance under an active payment plan; a courtesy owed under this rule does not take away the account's prompt-pay discount, while any other courtesy is not combined with a prompt-pay discount on the same account.
  trigger: state_due
  subject:
