  cross_category: []
  compute:
  - cc_ceiling: MX(0, MN(P('service_recovery_courtesy_max_usd'), F('patient_balance')))
  - cc_standard: RND(K('standard_courtesy_share') * P('service_recovery_courtesy_max_usd'), 2)
  - cc_corrected_error: >-
      SUM('encounter_transactions', 'amount', event_type='encounter_adjustment_posted', adjustment_code='UNINSURED_DISCOUNT')
  - cc_start: >-
      RND(cc_corrected_error * K('error_share'), 2) if cc_corrected_error >= K('large_error_usd') else (K('mid_error_courtesy_usd') if cc_corrected_error >= K('mid_error_usd') else cc_standard)
  - cc_duration: DAYS(F('first_statement_date'), NOW) if F('first_statement_date') else 0
  - cc_duration_usd: >-
      K('long_error_usd') if cc_duration > K('long_error_days') else (K('short_error_usd') if cc_duration > K('short_error_days') else 0)
  - cc_statements: >-
      COUNT('encounter_transactions', event_type='encounter_statement_issued', statement_type='SUMMARY_STATEMENT')
  - cc_exposed_usd: >-
      K('three_misstated_usd') if cc_statements >= 3 else (K('two_misstated_usd') if cc_statements == 2 else 0)
  - cc_dispute_inquiries: COUNT('encounter_billing_inquiries', inquiry_type='CHARGE_DISPUTE')
  - cc_hold_usd: >-
      K('dispute_hold_usd') if (F('holds_used_count') >= 1 and cc_dispute_inquiries > 0) else (K('other_hold_usd') if (F('holds_used_count') >= 1 and cc_dispute_inquiries == 0) else 0)
  - result: MN(cc_ceiling, cc_start + cc_duration_usd + cc_exposed_usd + cc_hold_usd)
  compute_basis:
    cc_ceiling: >-
      The courtesy ceiling is the smaller of service_recovery_courtesy_max_usd and the account's patient_balance, and never below 0.00: an account whose patient_balance is 0.00 or less (a zero or credit balance) is owed no courtesy.
    cc_standard: >-
      The standard courtesy is standard_courtesy_share of service_recovery_courtesy_max_usd, rounded half-up to the cent, and the courtesy is the standard courtesy, never more than the courtesy ceiling.
    cc_corrected_error: >-
      The corrected error is the total of the account's UNINSURED_DISCOUNT adjustments (on such an account every one of them is self-pay pricing posted late): a corrected error of at least large_error_usd sets the courtesy's starting amount to error_share of the corrected error, rounded half-up to the cent; a corrected error of at least mid_error_usd but below large_error_usd sets it to a flat mid_error_courtesy_usd; a smaller corrected error leaves the starting amount at the standard courtesy.
    cc_start: >-
      The corrected error is the total of the account's UNINSURED_DISCOUNT adjustments (on such an account every one of them is self-pay pricing posted late): a corrected error of at least large_error_usd sets the courtesy's starting amount to error_share of the corrected error, rounded half-up to the cent; a corrected error of at least mid_error_usd but below large_error_usd sets it to a flat mid_error_courtesy_usd; a smaller corrected error leaves the starting amount at the standard courtesy.
    cc_duration: >-
      The error duration is the plain difference in days between first_statement_date and the day the courtesy is posted: above long_error_days adds long_error_usd dollars, above short_error_days but not above long_error_days adds short_error_usd dollars, and a shorter duration or no first_statement_date adds nothing.
    cc_duration_usd: >-
      The error duration is the plain difference in days between first_statement_date and the day the courtesy is posted: above long_error_days adds long_error_usd dollars, above short_error_days but not above long_error_days adds short_error_usd dollars, and a shorter duration or no first_statement_date adds nothing.
    cc_statements: >-
      Every SUMMARY_STATEMENT issued on the account counts as a statement sent at the misstated figure, and the starting amount already answers for the first: three or more add three_misstated_usd dollars, exactly two add two_misstated_usd dollars, and a single statement adds nothing.
    cc_exposed_usd: >-
      Every SUMMARY_STATEMENT issued on the account counts as a statement sent at the misstated figure, and the starting amount already answers for the first: three or more add three_misstated_usd dollars, exactly two add two_misstated_usd dollars, and a single statement adds nothing.
    cc_dispute_inquiries: >-
