    cc_hold_usd: >-
      When the account's holds_used_count is at least one and a CHARGE_DISPUTE inquiry was logged on the account, dispute_hold_usd dollars are added; when holds_used_count is at least one and no CHARGE_DISPUTE inquiry was logged, other_hold_usd dollars are added; with no hold used, nothing.
    result: >-
      The adjustments described below are combined with that standard figure this way: an adjustment that sets the courtesy's starting amount replaces the standard courtesy as that starting amount, every adjustment stated in dollars is then added to it, and the courtesy is the smaller of that total and the courtesy ceiling.
  factors:
