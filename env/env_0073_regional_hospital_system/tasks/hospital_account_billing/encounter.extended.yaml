  factors:
  - id: gross_standing_band
    effect: parameter
    decides: sp_gross_points
    bindings:
    - sp_gross_standing
    - sp_gross_points
    ladder:
    - when: charge lines less charge credits at least large_gross_usd
      value: K('large_gross_points') points
    - when: at least moderate_gross_usd, below large_gross_usd
      value: K('moderate_gross_points') points
    - when: otherwise
      value: 0 points
    baseline:
      sp_gross_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: statement_recency
    effect: parameter
    decides: sp_recency_points
    bindings:
    - sp_last_statement
    - sp_recency
    - sp_recency_points
    ladder:
    - when: latest SUMMARY_STATEMENT recent_statement_days or fewer before the payment
      value: K('recent_statement_points') points
    - when: more than recent_statement_days, no more than older_statement_days
      value: K('older_statement_points') points
    - when: otherwise
      value: 0 points
    baseline:
      sp_recency_points: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: window_days_left
    effect: method
    decides: sp_window_credit
    bindings:
    - sp_days_left
    - sp_window_credit
    ladder:
    - when: window_early_days or more days of the prompt-pay window left
      method: dollar credit = early_day_credit_usd times the days left (linear)
    - when: at least one but fewer than window_early_days left
      method: flat late_window_credit_usd
    - when: otherwise
      method: no credit
    baseline:
      sp_window_credit: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: self_pay_e_statement
    effect: parameter
    decides: sp_channel_points
    bindings:
    - sp_last_channel
    - sp_channel_points
    ladder:
    - when: latest SUMMARY_STATEMENT by PATIENT_PORTAL
      value: K('portal_points') points
    - when: by EMAIL_LINK
      value: K('email_link_points') points
    - when: otherwise
      value: 0 points
    baseline:
      sp_channel_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: registration_payment
    effect: parameter
    decides: sp_pos_points
    bindings:
    - sp_pos_paid
    - sp_pos_points
    ladder:
    - when: POINT_OF_SERVICE payments at least pos_large_usd
      value: K('pos_large_points') points
    - when: above 0.00, below pos_large_usd
      value: K('pos_small_points') points
    - when: otherwise
      value: 0 points
    baseline:
      sp_pos_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: standing_balance_band
    effect: parameter
    decides: sp_balance_points
    bindings:
    - sp_ledger_balance
    - sp_balance_points
    ladder:
    - when: ledger balance (liabilities less adjustments and payments, plus refunds) at least large_balance_usd
      value: K('large_balance_points') points
    - when: at least moderate_balance_usd, below large_balance_usd
      value: K('moderate_balance_points') points
    - when: otherwise
      value: 0 points
    baseline:
      sp_balance_points: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The self-pay balance standing is the account's patient_balance immediately before the payment. The self-pay payoff discount is prompt_pay_discount_pct percent of the self-pay balance standing, rounded half-up to the cent, and the self-pay payoff amount is the self-pay balance standing less that discount.
    params:
    - prompt_pay_discount_pct
  inputs:
    history:
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_charge_posted
    - table: encounter_transactions
      aggregate: latest
      field: posting_date
      filters:
        event_type: encounter_statement_issued
        statement_type: SUMMARY_STATEMENT
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
