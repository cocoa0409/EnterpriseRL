        payment_channel: POINT_OF_SERVICE
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_liability_posted
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_adjustment_posted
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_payment_posted
    - table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
