    condition: >-
      on an account whose financial_class is SELF_PAY, whose final_bill_date and service_end_date are recorded, which carries encounter_charge_posted rows with revenue_code 0762 and no encounter_adjustment_posted row with adjustment_code PACKAGE_PRICE_ADJUSTMENT, an encounter_adjustment_posted row with adjustment_code UNINSURED_DISCOUNT stands whose source_txn_id is one of those charge lines
    resolved_by: post_observation_rate_discount_cc1ec28d
    effect: >-
