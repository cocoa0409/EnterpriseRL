  computes: amount
  target_tool: post_service_recovery_courtesy_69e36558
  params:
    standard_courtesy_share: 0.2
    large_error_usd: 5000.0
    error_share: 0.005
    mid_error_usd: 500.0
    mid_error_courtesy_usd: 25.0
    long_error_days: 30
    short_error_days: 14
    long_error_usd: 10.0
    short_error_usd: 5.0
    three_misstated_usd: 15.0
    two_misstated_usd: 10.0
    dispute_hold_usd: 15.0
    other_hold_usd: 5.0
  rule: >-
    On an account whose financial class was corrected to SELF_PAY after its final bill and whose summary statements were issued while its COVERAGE_TERMINATED postings carried no uninsured discount, one SERVICE_RECOVERY_COURTESY adjustment is owed for that failure whether or not the patient reports it, sourced to the account's most recent COVERAGE_TERMINATED posting by posting date (of two posted on the same day, the one recorded first), in the amount this rule fixes, never more than service_recovery_courtesy_max_usd and never more than the current patient balance; on every other account a representative may grant one SERVICE_RECOVERY_COURTESY adjustment when the patient reports a documented service failure (a billing error already corrected on the account, or a statement sent during an active billing hold), up to service_recovery_courtesy_max_usd and never more than the current patient balance. A courtesy adjustment is never granted on an account in bad_debt status or on a balance under an active payment plan; a courtesy owed under this rule does not take away the account's prompt-pay discount, while any other courtesy is not combined with a prompt-pay discount on the same account. On a self-pay account that carries coverage-terminated liability postings, the courtesy is not fixed until an uninsured discount stands against one of those postings. On a self-pay account whose stay has ended and whose final bill has dropped, that carries observation-hour charge lines and that is not priced under a self-pay package, the courtesy is not fixed until an observation-rate discount stands against one of those lines. The courtesy ceiling is the smaller of service_recovery_courtesy_max_usd and the account's patient_balance, and never below 0.00: an account whose patient_balance is 0.00 or less (a zero or credit balance) is owed no courtesy. The standard courtesy is standard_courtesy_share of service_recovery_courtesy_max_usd, rounded half-up to the cent, and the courtesy is the standard courtesy, never more than the courtesy ceiling. The adjustments described below are combined with that standard figure this way: an adjustment that sets the courtesy's starting amount replaces the standard courtesy as that starting amount, every adjustment stated in dollars is then added to it, and the courtesy is the smaller of that total and the courtesy ceiling. The corrected error is the total of the account's UNINSURED_DISCOUNT adjustments (on such an account every one of them is self-pay pricing posted late): a corrected error of at least large_error_usd sets the courtesy's starting amount to error_share of the corrected error, rounded half-up to the cent; a corrected error of at least mid_error_usd but below large_error_usd sets it to a flat mid_error_courtesy_usd; a smaller corrected error leaves the starting amount at the standard courtesy. The error duration is the plain difference in days between first_statement_date and the day the courtesy is posted: above long_error_days adds long_error_usd dollars, above short_error_days but not above long_error_days adds short_error_usd dollars, and a shorter duration or no first_statement_date adds nothing. Every SUMMARY_STATEMENT issued on the account counts as a statement sent at the misstated figure, and the starting amount already answers for the first: three or more add three_misstated_usd dollars, exactly two add two_misstated_usd dollars, and a single statement adds nothing. When the account's holds_used_count is at least one and a CHARGE_DISPUTE inquiry was logged on the account, dispute_hold_usd dollars are added; when holds_used_count is at least one and no CHARGE_DISPUTE inquiry was logged, other_hold_usd dollars are added; with no hold used, nothing.
  prerequisite:
  - problem: encounter_ext_terminated_coverage_discount
    kind: value_input
    gate: cc_start
    form: state
    policy_source: >-
      On a self-pay account that carries coverage-terminated liability postings, the courtesy is not fixed until an uninsured discount stands against one of those postings.
    condition: >-
      on an account whose financial_class is SELF_PAY and which carries COVERAGE_TERMINATED liability postings, an encounter_adjustment_posted row with adjustment_code UNINSURED_DISCOUNT stands whose source_txn_id is one of the account's COVERAGE_TERMINATED postings
    resolved_by: post_terminated_coverage_discount_f939a41d
    effect: >-
