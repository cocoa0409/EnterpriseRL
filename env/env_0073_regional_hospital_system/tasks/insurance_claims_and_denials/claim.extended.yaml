- id: claim_ext_surgery_small_item_closeout
  base_policy_refs:
  - claim_denial_write_off
  - claim_timely_filing
  - claim_denial_routing
  - claim_recoupment_and_overpayment
  overwrite:
  - base_policy: claim_denial_write_off
    superseded_clause: >-
      A denied amount is written off by the hospital, never billed to the patient, when its route ends in a write-off: TIMELY_FILING_EXPIRED
      (no timely-filing proof), NO_AUTHORIZATION_OBTAINED (no authorization, notification, emergency exemption or retro authorization),
      NONCOVERED_NO_WAIVER (no advance waiver on file), APPEALS_EXHAUSTED (the last available level upheld the denial), or
      BELOW_APPEAL_THRESHOLD (a denied amount at or below small_denial_write_off_usd that is not worth appealing).
    replaced_by: >-
      For the small items on Riverbend's outpatient-surgery small-item list that pass the small-item test on a claim closed
      under this rule, and only for them, the amount written off below the appeal threshold is the surgery small-item value
      rather than their charges; take-home convenience items, the services closed on the member's decision, small items on
      Riverbend's observation and emergency small-item list, self-administered drugs and the services closed on the patient's
      external-review decision are written off under their own rules, and every other denied amount is written off in full
      by the hospital, never billed to the patient, when its route ends in a write-off: timely filing expired (no timely-filing
      proof), no authorization obtained (no authorization, notification, emergency exemption or retro authorization), non-covered
      with no waiver (no advance waiver on file), appeals exhausted (the last available level upheld the denial), or below
      the appeal threshold (a denied amount at or below the payer class's small-denial write-off amount that is not worth
      appealing).
  trigger: state_due
  subject:
  - claim_denial_written_off
  computes: amount_usd
  target_tool: write_off_surgery_small_items_d7ad9b50
  params:
    j2405_ppo: 1.9
    j2405_hmo: 1.65
    j1100_ppo: 0.85
    j1100_hmo: 0.95
    a4570_fee: 18.4
    j7050_ppo: 2.1
    j7050_hmo: 2.6
    j0690_fee_ppo: 6.4
    j0690_fee_hmo: 7.1
  rule: >-
    On a Commercial PPO, Commercial HMO or Marketplace claim in denied status for an Outpatient Surgery Account, this rule
    takes the small items that pass the small-item test off the claim as one write-off entry with the write-off reason BELOW_APPEAL_THRESHOLD,
    carrying the claim's current denial reason code; any other claim gets nothing here. Riverbend's outpatient-surgery small-item
    list is: ondansetron (code J2405 under revenue code 0636), dexamethasone (code J1100 under revenue code 0636), cefazolin
    (code J0690 under revenue code 0636), the splint (code A4570 under revenue code 0270) and the intravenous solution (code
    J7050 under revenue code 0258); each listed code is read from the account's charge postings by its charges. A listed code
    passes the small-item test when its charges on the account are above 0.00 and at or below the payer class's small-denial
    write-off amount; a listed code that does not pass stays with the claim's other denied services. The surgery small-item
    value is the sum, over the codes that pass, of each code's charges multiplied by the payer class's expected allowed percentage
    of charges. The surgery small-item value never exceeds what the payer has recovered on the claim, the total of its recovery
    entries; with no recovery entry on the claim it is 0.00. The surgery small-item value is rounded to the nearest cent once,
    on the final total, and when it is 0.00 no entry is written. For the small items on Riverbend's outpatient-surgery small-item
    list that pass the small-item test on a claim closed under this rule, and only for them, the amount written off below
    the appeal threshold is the surgery small-item value rather than their charges; take-home convenience items, the services
    closed on the member's decision, small items on Riverbend's observation and emergency small-item list, self-administered
    drugs and the services closed on the patient's external-review decision are written off under their own rules, and every
    other denied amount is written off in full by the hospital, never billed to the patient, when its route ends in a write-off:
    timely filing expired (no timely-filing proof), no authorization obtained (no authorization, notification, emergency exemption
    or retro authorization), non-covered with no waiver (no advance waiver on file), appeals exhausted (the last available
    level upheld the denial), or below the appeal threshold (a denied amount at or below the payer class's small-denial write-off
    amount that is not worth appealing). The small-item charges above the surgery small-item value stay on the claim as the
    agreement's contractual remainder, which Riverbend's month-end contractual close posts on the last calendar day of the
    month. The surgery small-item value is fixed only after the payer's recovery of its payment stands as a recovery entry
    on the claim. Each adjustment below replaces the standard value of one listed code, never above that code's billed charges
    (Riverbend's agreements pay the lesser of the scheduled amount and the billed charges); the passing codes are then added,
    the recovery limit applied and the total rounded once. The ondansetron rate per counted unit is j2405_ppo on a Commercial
    PPO claim, j2405_hmo on a Commercial HMO claim, and otherwise its charges per counted unit times the payer class's expected
    allowed percentage; it is valued at its counted units times that rate, never above its charges, its counted units being
    its billed units, or one when it is billed with charges but no units. The dexamethasone rate per counted unit is j1100_ppo
    on a Commercial PPO claim, j1100_hmo on a Commercial HMO claim, and otherwise its charges per counted unit times the payer
    class's expected allowed percentage; it is valued at its counted units times that rate, never above its charges, its counted
    units being its billed units, or one when it is billed with charges but no units. The cefazolin rate per counted unit
    is j0690_fee_ppo on a Commercial PPO claim, j0690_fee_hmo on a Commercial HMO claim, and otherwise its charges per counted
    unit times the payer class's expected allowed percentage; it is valued at its counted units times that rate, never above
    its charges, its counted units being its billed units, or one when it is billed with charges but no units. The splint
    is valued at the lesser of its charges and its billed units (read from the account's charge postings) times a4570_fee
    when a Commercial PPO claim is for services at Riverbend Surgery & Imaging Center - Grand Chute, at its billed units times
    a4570_fee when a Commercial HMO claim is for services at a hospital campus (Riverbend Regional Medical Center - Appleton
    or Riverbend Lakeshore Hospital - Neenah), and at the payer class's expected allowed percentage of its charges otherwise.
    The intravenous solution rate per counted unit is j7050_ppo on a Commercial PPO claim, j7050_hmo on a Commercial HMO claim,
    and otherwise its charges per counted unit times the payer class's expected allowed percentage; it is valued at its counted
    units times that rate, never above its charges, its counted units being its billed units, or one when it is billed with
    charges but no units.
