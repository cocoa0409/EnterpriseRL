- id: claim_ext_self_administered_drug_closeout
  base_policy_refs:
  - claim_denial_write_off
  - claim_timely_filing
  - claim_denial_routing
  overwrite:
  - base_policy: claim_denial_write_off
    superseded_clause: >-
      A denied amount is written off by the hospital, never billed to the patient, when its route ends in a write-off: TIMELY_FILING_EXPIRED
      (no timely-filing proof), NO_AUTHORIZATION_OBTAINED (no authorization, notification, emergency exemption or retro authorization),
      NONCOVERED_NO_WAIVER (no advance waiver on file), APPEALS_EXHAUSTED (the last available level upheld the denial), or
      BELOW_APPEAL_THRESHOLD (a denied amount at or below small_denial_write_off_usd that is not worth appealing).
    replaced_by: >-
      For the self-administered drugs of a claim closed under this rule, and only for them, the amount written off as non-covered
      with no waiver is the self-administered drug value rather than their charges; small items on Riverbend's outpatient-surgery
      small-item list, take-home convenience items, the services closed on the member's decision, small items on Riverbend's
      observation and emergency small-item list and the services closed on the patient's external-review decision are written
      off under their own rules, and every other denied amount is written off in full by the hospital, never billed to the
      patient, when its route ends in a write-off: timely filing expired (no timely-filing proof), no authorization obtained
      (no authorization, notification, emergency exemption or retro authorization), non-covered with no waiver (no advance
      waiver on file), appeals exhausted (the last available level upheld the denial), or below the appeal threshold (a denied
      amount at or below the payer class's small-denial write-off amount that is not worth appealing).
  trigger: state_due
  subject:
  - claim_denial_written_off
  computes: amount_usd
  target_tool: write_off_self_administered_drugs_664aab61
  params:
    j8499_share_3: 0.45
    j8499_share_2: 0.6
    j8540_share_4: 0.5
    j8540_share_2: 0.6
    j7613_share_6: 0.5
    j7613_share_2: 0.55
    fee_observation_line: 0.5
    fee_emergency_visit: 1.0
  rule: >-
    On a Commercial PPO, Commercial HMO or Marketplace claim in denied status for an Observation Stay Account or an Emergency
    Department Visit Account, this rule takes the self-administered drugs off the claim as one write-off entry with the write-off
    reason NONCOVERED_NO_WAIVER, carrying the claim's current denial reason code; any other claim gets nothing here. The self-administered
    drugs are the drugs billed under revenue code 0637 with codes J8499 (oral drugs not otherwise classified), J8540 (oral
    dexamethasone) and J7613 (inhalation unit doses); Riverbend's commercial agreements exclude self-administered drugs from
    outpatient observation and emergency claims, as Medicare Part B does for hospital outpatients, and each is read from the
    account's charge postings by its charges. A signed Riverbend Financial Responsibility Waiver shows on the account as a
    non-covered patient liability (liability source NONCOVERED_SERVICE), the release the waiver supports; while the account
    carries no such liability, the self-administered drugs are written off under this rule, and when it carries one this rule
    writes nothing. The self-administered drug value is their charges. The self-administered drug value is then multiplied
