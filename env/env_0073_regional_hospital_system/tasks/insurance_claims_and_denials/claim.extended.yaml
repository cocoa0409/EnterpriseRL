  - rec_units: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0710')
  - ancillary_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0250') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0272')
  - e0114_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0274', cpt_hcpcs_code='E0114')
  - e0114_units: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0274', cpt_hcpcs_code='E0114')
  - small_J2405: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J2405') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J2405') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J2405')
      <= P('small_denial_write_off_usd')) else 0
  - small_J1100: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J1100') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J1100') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J1100')
      <= P('small_denial_write_off_usd')) else 0
  - small_J0690: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J0690') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J0690') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J0690')
      <= P('small_denial_write_off_usd')) else 0
  - small_A4570: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0270', cpt_hcpcs_code='A4570') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0270', cpt_hcpcs_code='A4570') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0270', cpt_hcpcs_code='A4570')
      <= P('small_denial_write_off_usd')) else 0
  - small_J7050: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0258', cpt_hcpcs_code='J7050') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0258', cpt_hcpcs_code='J7050') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0258', cpt_hcpcs_code='J7050')
      <= P('small_denial_write_off_usd')) else 0
  - passing_small_charges: small_J2405 + small_J1100 + small_J0690 + small_A4570 + small_J7050
  - open_small_charges: 0 if small_booked else passing_small_charges
  - other_charges: >-
      all_charges - retained_charges - convenience_charges - or_charges - implant_charges - anes_charges - rec_charges - ancillary_charges
      - e0114_charges - passing_small_charges
  - surgical_method: >-
      2 if (F('variant_name') == 'Commercial PPO Claim' and XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0360', cpt_hcpcs_code='29882') > 0) else (1 if F('variant_name') == 'Commercial
      HMO Claim' else 0)
  - implant_method: >-
      2 if (F('variant_name') == 'Commercial PPO Claim' and CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Surgery & Imaging Center - Grand Chute') else (1 if (F('variant_name') == 'Commercial HMO Claim' and (CFIELD('encounter',
      'facility', encounter_id=F('encounter_id')) == 'Riverbend Regional Medical Center - Appleton' or CFIELD('encounter',
      'facility', encounter_id=F('encounter_id')) == 'Riverbend Lakeshore Hospital - Neenah')) else 0)
  - anes_rate: >-
      K('anes_ppo') if F('variant_name') == 'Commercial PPO Claim' else (K('anes_hmo') if F('variant_name') == 'Commercial
      HMO Claim' else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0370')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0370'), 1) * P('expected_allowed_pct_of_charges') / 100))
  - rec_rate: >-
      K('rec_ppo') if F('variant_name') == 'Commercial PPO Claim' else (K('rec_hmo') if F('variant_name') == 'Commercial HMO
      Claim' else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0710')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0710'), 1) * P('expected_allowed_pct_of_charges') / 100))
  - dme_rate: >-
      K('dme_e0114_asc') if (F('variant_name') == 'Commercial PPO Claim' and CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Surgery & Imaging Center - Grand Chute') else (K('dme_e0114_hosp') if (F('variant_name') == 'Commercial
      HMO Claim' and (CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Regional Medical Center
      - Appleton' or CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Lakeshore Hospital - Neenah'))
      else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0274', cpt_hcpcs_code='E0114')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='E0114'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - site_factor: >-
      K('site_free') if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Surgery & Imaging Center
      - Grand Chute' else (K('site_cah') if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend
      Community Hospital - Chilton' else 1)
  - surgical_value: >-
      MN(or_charges + ancillary_charges, K('case_29882') + (or_charges - r29882_charges) * pct * K('mpr_share')) if surgical_method
      == 2 else MN(or_charges, (r29882_units * K('fee_29882') + r29877_units * K('fee_29877') + (or_charges - r29882_charges
      - r29877_charges) * pct) if surgical_method == 1 else or_charges * pct)
  - implant_sched: c1713_units * K('fee_c1713') + c1762_units * K('fee_c1762')
  - implant_value: >-
      MN(implant_charges, (implant_sched + (implant_charges - c1713_charges - c1762_charges) * pct) if implant_method == 2
      else ((MN(c1713_units * K('fee_c1713'), c1713_charges) + MN(c1762_units * K('fee_c1762'), c1762_charges) + (implant_charges
      - c1713_charges - c1762_charges) * pct) if implant_method == 1 else implant_charges * pct))
  - ancillary_value: 0 if surgical_method == 2 else ancillary_charges * pct
  - closeout_value: >-
      (surgical_value + implant_value + MN(anes_charges, MX(anes_units, 1) * anes_rate) + MN(rec_charges, MX(rec_units, 1)
      * rec_rate) + ancillary_value + MN(e0114_charges, MX(e0114_units, 1) * dme_rate) + (other_charges + open_small_charges)
      * pct) * site_factor
  - member_gate: >-
      1 if ((F('variant_name') == 'Commercial PPO Claim' or F('variant_name') == 'Commercial HMO Claim' or F('variant_name')
      == 'Marketplace Exchange Plan Claim') and CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id')) == 'Outpatient
      Surgery Account' and F('status') == 'denied' and COUNT('claim_transactions', date_field='posting_date', event_type='claim_appeal_filed',
