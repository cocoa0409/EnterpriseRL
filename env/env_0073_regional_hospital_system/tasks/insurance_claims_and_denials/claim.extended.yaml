  baseline:
    rule: >-
      The member-decision value covers the charges of the claim's hospital account except the pre-operative tests (revenue
      codes 0300, 0730 and 0324), which stay payable, and the take-home convenience items on Riverbend's convenience list
      (E0218, A9273 and A4467 under revenue code 0274), which it never values; it covers the small items on Riverbend's outpatient-surgery
      small-item list that pass the small-item test (a listed code whose charges are above 0.00 and at or below the payer
      class's small-denial write-off amount) only while no below-threshold write-off entry stands on the claim, and it always
      covers a listed code that does not pass. Within what it covers, the operating-room lines (revenue code 0360), the implant
      lines (revenue code 0278), the anesthesia (revenue code 0370) and recovery (revenue code 0710) lines, the ancillary
      lines (revenue codes 0250 and 0272) and the crutches (code E0114 under revenue code 0274) are each read by their charges,
      and everything else as the remaining charges. The member-decision value is the charges it covers multiplied by the payer
      class's expected allowed percentage of charges. The member-decision value never exceeds what the payer has recovered
      on the claim, the total of its recovery entries, less the below-threshold write-offs already on the claim, and is never
      below 0.00; with no recovery entry on the claim it is 0.00. The member-decision value is rounded to the nearest cent
      once, on the final total, and when it is 0.00 no entry is written.
    params:
    - expected_allowed_pct_of_charges
    - small_denial_write_off_usd
