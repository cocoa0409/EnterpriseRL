  - sched_85025: units_85025 * K('clfs_85025') * K('clfs_mult')
  - sched_80048: units_80048 * K('clfs_80048') * K('clfs_mult')
  - sched_85610: units_85610 * K('clfs_85610') * K('clfs_mult')
