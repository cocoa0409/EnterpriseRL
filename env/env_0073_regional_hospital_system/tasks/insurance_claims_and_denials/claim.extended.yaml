- id: claim_ext_retrospective_denial_refund
  base_policy_refs:
  - claim_recoupment_and_overpayment
  - claim_remittance_posting
  - claim_appeal_windows
  overwrite:
  - base_policy: claim_recoupment_and_overpayment
    superseded_clause: >-
      A payer takeback re-opens the amount expected from the payer by the amount recovered and is recorded against the remittance
      that carried it.
    replaced_by: >-
      For a refund Riverbend records under this rule or under its rule for outpatient-surgery claims, and only for such a
      refund, the recovery re-opens the amount expected from the payer by the amount refunded and is recorded against the
      remittance that carried the refunded payment (the claim's earliest-posted payer payment; when several payer payments
      share that earliest posting date, the one whose remittance trace number comes first in alphabetical order), with that
      remittance's trace number and date; every other payer takeback re-opens the amount expected from the payer by the amount
      recovered and is recorded against the remittance that carried it.
  trigger: state_due
  subject:
  - claim_takeback
  computes: amount_usd
  target_tool: refund_payer_recovery_9b1903be
  params:
    echo_hmo_hosp: 612.0
    echo_ppo_hosp: 655.0
    ecg_cap_per_line: 3
    clfs_84484: 12.96
    clfs_85025: 7.77
    clfs_80053: 10.56
    clfs_mult_hmo: 1.35
    clfs_mult_ppo: 1.6
    cta_fee_hmo: 742.0
    cta_fee_ppo: 798.0
    contrast_ml_hmo: 0.42
    dx_site_neenah: 0.95
    dx_site_cah: 1.04
  rule: >-
    When a payer has denied, after paying it, the services on a Commercial PPO, Commercial HMO or Marketplace claim for an
    Observation Stay Account or an Emergency Department Visit Account, and an appeal of that denial has been decided against
    Riverbend (the claim is in denied status and at least one appeal is filed on it), Riverbend refunds to the payer the payment
    attributable to the services the denial reached and records the refund as one payer recovery entry on the claim with the
    reason code WO-72; any other claim gets nothing here. Riverbend treats a post-payment denial of an observation or emergency
    stay as reaching every service of the account except the diagnostic tests, which its payer agreements keep payable as
    outpatient diagnostics: the echocardiography (revenue code 0483), the electrocardiogram tracings (revenue code 0730),
    the laboratory tests (revenue code 0300), the computed tomography (revenue code 0350) and the contrast supply line (code
    Q9967 under revenue code 0636). The payment received is the claim's payer payments less any payer recoveries already on
    the claim. The diagnostic tests are read from the account's charge postings by their charges: the echocardiogram code
    93306 under revenue code 0483, the tracing code 93005 under revenue code 0730, the laboratory codes 84484, 85025 and 80053
    under revenue code 0300, the CT angiography code 71275 under revenue code 0350, the contrast code Q9967 under revenue
    code 0636, and every other charge under revenue codes 0483, 0730, 0300 and 0350. The refund is the payment received less
    the retained payment, never below 0.00; the retained payment is the retained value, and the retained value is the charges
    of the diagnostic tests multiplied by the payer class's expected allowed percentage of charges. The refund is rounded
    to the nearest cent once, on the final total, and when it is 0.00 no entry is written. For a refund Riverbend records
    under this rule or under its rule for outpatient-surgery claims, and only for such a refund, the recovery re-opens the
    amount expected from the payer by the amount refunded and is recorded against the remittance that carried the refunded
    payment (the claim's earliest-posted payer payment; when several payer payments share that earliest posting date, the
    one whose remittance trace number comes first in alphabetical order), with that remittance's trace number and date; every
    other payer takeback re-opens the amount expected from the payer by the amount recovered and is recorded against the remittance
    that carried it. Each adjustment below replaces the standard value of one group of tests, multiplies their sum or takes an amount from the retained value; replacements are made first, each never above the billed charges of the lines it values (Riverbend's
    agreements pay the lesser of the scheduled amount and the billed charges), the multiplier then applies to their sum to give the retained value, never above the charges of the diagnostic tests, the deduction after it (never below 0.00), the resulting retained payment is then taken from the payment received (never below 0.00), and the total is rounded once.
    The echocardiogram fee per counted unit is echo_hmo_hosp when a Commercial HMO claim is for services at a hospital campus
    (Riverbend Regional Medical Center - Appleton or Riverbend Lakeshore Hospital - Neenah), echo_ppo_hosp when a Commercial
    PPO claim is for services at a hospital campus (Riverbend Regional Medical Center - Appleton or Riverbend Lakeshore Hospital
    - Neenah), and otherwise its charges per counted unit times the payer class's expected allowed percentage; it is valued
    at its counted units times that rate, never above its charges, its counted units being its billed units, or one when it
    is billed with charges but no units. The tracings counted are one per line of code 93005 on a Commercial HMO claim (serial
    tracings on one line are paid once); its counted units but no more than ecg_cap_per_line times its number of lines on
    a Commercial PPO claim; and its counted units otherwise, its counted units being its billed units, or one when it is billed
    with charges but no units; each counted tracing is valued at its charges per counted unit times the payer class's expected
    allowed percentage, never above its charges, the tracing code being read by its billed units and its number of lines.
    The laboratory pricing values codes 84484, 85025 and 80053, each read by its billed units as well as its charges: when
    a Commercial HMO claim is for an Observation Stay Account, each at its billed units times its clinical laboratory fee
    schedule amount (clfs_84484, clfs_85025, clfs_80053) times clfs_mult_hmo; when a Commercial PPO claim is for an Observation
    Stay Account, each at the lesser of its billed units times that amount times clfs_mult_ppo and its charges; otherwise
    at the payer class's expected allowed percentage of their charges. Riverbend's imaging agreements price the CT angiography (71275, contrast included in its descriptor) and the contrast supply line (Q9967) as one family: on a Commercial PPO claim that bills the CT angiography, the family is paid at the CT angiography's counted units times cta_fee_ppo, the only scan rate covering the contrast, never above the charges of the scan and the contrast together; on a Commercial HMO claim, the scan is valued at its counted units times cta_fee_hmo, never above its own charges, and the contrast at its billed units (millilitres) times contrast_ml_hmo, never above its own charges, or at the payer class's expected allowed percentage of its charges when no millilitres are billed; otherwise the family is valued at the payer class's expected allowed percentage of its charges; the CT angiography's counted units are its billed units, or one when it is billed with charges but no units. The diagnostic campus factor, which multiplies the sum of the test values, is dx_site_neenah for services at Riverbend Lakeshore Hospital - Neenah, dx_site_cah for services at Riverbend Community Hospital - Chilton, and 1 otherwise. The member's cost share is taken from the retained
    value, never below 0.00, to give the retained payment: when copay lines (PR-3) were released from the claim to the patient,
    it is the total of those copay lines; when no copay line was released but deductible or coinsurance lines (PR-1, PR-2)
    were, it is the total of those lines; otherwise it is 0.00.
  prerequisite: []
  cross_category:
  - category: encounter
    as: branch
    reads:
    - variant_name
    - facility
