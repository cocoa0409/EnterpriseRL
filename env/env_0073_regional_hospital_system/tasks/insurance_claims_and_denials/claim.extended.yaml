      The infusion rate per counted unit is inf_hmo on a Commercial HMO claim, inf_ppo on a Commercial PPO claim, and otherwise
      its charges per counted unit times the expected allowed percentage; it is valued at its counted units times that rate,
      never above its charges, its counted units being its billed units, or one when it is billed with charges but no units.
    hep_rate: >-
      The heparin rate per counted unit is hep_hmo on a Commercial HMO claim, hep_ppo on a Commercial PPO claim, and otherwise
      its charges per counted unit times the expected allowed percentage; it is valued at its counted units times that rate,
      never above its charges, its counted units being its billed units, or one when it is billed with charges but no units.
    supply_pct: >-
      The medical-surgical supply percentage applied to the revenue code 0270 supply charges is supply_pct_hmo when a Commercial
      HMO claim is for an Observation Stay Account, supply_pct_ppo when a Commercial PPO claim is for an Observation Stay
      Account, and otherwise the payer class's expected allowed percentage of charges.
    site_factor: >-
      The campus factor, which multiplies the whole close-out value, is site_neenah for services at Riverbend Lakeshore Hospital
      - Neenah, site_cah for services at Riverbend Community Hospital - Chilton, and 1 otherwise.
    case_rate: >-
      The observation pricing method values the observation lines: when a Commercial HMO claim is for services at a hospital
      campus (Riverbend Regional Medical Center - Appleton or Riverbend Lakeshore Hospital - Neenah), by Riverbend's observation
      case rate, which packages the general pharmacy (revenue code 0250), is never above the billed charges of the observation
      and general pharmacy lines it packages, and follows the billed hours of G0378 — obs_case_long at 48 hours or more, obs_case_mid
      at 24 hours or more and below 48, obs_case_short at 8 hours or more and below 24, obs_case_brief below 8 hours, and
      no value when no hour is billed; on a Commercial PPO claim, per hour, the billed hours but no more than obs_hour_cap
      times obs_hourly_ppo; otherwise at the payer class's expected allowed percentage of the observation charges.
    obs_value: >-
      The observation pricing method values the observation lines: when a Commercial HMO claim is for services at a hospital
      campus (Riverbend Regional Medical Center - Appleton or Riverbend Lakeshore Hospital - Neenah), by Riverbend's observation
      case rate, which packages the general pharmacy (revenue code 0250), is never above the billed charges of the observation
      and general pharmacy lines it packages, and follows the billed hours of G0378 — obs_case_long at 48 hours or more, obs_case_mid
      at 24 hours or more and below 48, obs_case_short at 8 hours or more and below 24, obs_case_brief below 8 hours, and
      no value when no hour is billed; on a Commercial PPO claim, per hour, the billed hours but no more than obs_hour_cap
      times obs_hourly_ppo; otherwise at the payer class's expected allowed percentage of the observation charges.
    pharmacy_value: >-
      The general pharmacy carries no value of its own only when the observation case rate that packages it is paid (the case-rate
      method with observation hours billed); otherwise it is valued at the expected allowed percentage of its charges.
    closeout_value: >-
      Each adjustment below either replaces the standard value of one group of lines or multiplies the total; replacements
      are made first, each never above the billed charges of the lines it values (Riverbend's agreements pay the lesser of
      the scheduled amount and the billed charges), the multiplier after them, then the recovery limit, and the total is then
      rounded once.
    review_gate: >-
      On a Commercial PPO, Commercial HMO or Marketplace claim in denied status for an Observation Stay Account or an Emergency
      Department Visit Account where a member-level appeal (MEMBER_APPEAL_WITH_AOR) has been filed, the appeals filed number
      at least the payer class's available appeal levels, the payer class offers independent external review and the external-review
      window is still open, the claimant's internal appeals are exhausted and the remaining route is the patient's own request
      for external review; when the patient decides in person not to request it, the claim's last route ends and this rule
      takes the services still open off the claim as one write-off entry with the write-off reason APPEALS_EXHAUSTED, carrying
      the claim's current denial reason code, booked through the patient's own decision; any other claim gets nothing here.
      The external-review window is open while fewer than the payer class's external-review window months have passed since
      the claim's denial date, counted in whole calendar months: a month is complete on the same day number of a later month,
      so a date whose day number is below the denial date's has not yet completed that month.
    result: >-
      The close-out never writes off more than the payer has recovered on the claim, the total of its recovery entries, less
      the below-threshold write-offs already on the claim, and never less than 0.00; with no recovery entry on the claim it
      is 0.00. The close-out value is rounded to the nearest cent once, on the final total, and when it is 0.00 no entry is
      written.
    small_J2405: >-
      The close-out covers the charges of the claim's hospital account except the diagnostic tests (revenue codes 0483, 0730,
      0300 and 0350, and the contrast code Q9967 under revenue code 0636), which stay payable, and the self-administered drugs
      (revenue code 0637), which it never values; it covers the small items on Riverbend's observation and emergency small-item
      list that pass the small-item test (a listed code whose charges are above 0.00 and at or below the payer class's small-denial
      write-off amount) only while no below-threshold write-off entry stands on the claim, and it always covers a listed code
      that does not pass.
    small_J1885: >-
      The close-out covers the charges of the claim's hospital account except the diagnostic tests (revenue codes 0483, 0730,
      0300 and 0350, and the contrast code Q9967 under revenue code 0636), which stay payable, and the self-administered drugs
      (revenue code 0637), which it never values; it covers the small items on Riverbend's observation and emergency small-item
      list that pass the small-item test (a listed code whose charges are above 0.00 and at or below the payer class's small-denial
      write-off amount) only while no below-threshold write-off entry stands on the claim, and it always covers a listed code
      that does not pass.
    small_J7050: >-
      The close-out covers the charges of the claim's hospital account except the diagnostic tests (revenue codes 0483, 0730,
      0300 and 0350, and the contrast code Q9967 under revenue code 0636), which stay payable, and the self-administered drugs
      (revenue code 0637), which it never values; it covers the small items on Riverbend's observation and emergency small-item
      list that pass the small-item test (a listed code whose charges are above 0.00 and at or below the payer class's small-denial
      write-off amount) only while no below-threshold write-off entry stands on the claim, and it always covers a listed code
      that does not pass.
    small_A4216: >-
      The close-out covers the charges of the claim's hospital account except the diagnostic tests (revenue codes 0483, 0730,
      0300 and 0350, and the contrast code Q9967 under revenue code 0636), which stay payable, and the self-administered drugs
      (revenue code 0637), which it never values; it covers the small items on Riverbend's observation and emergency small-item
      list that pass the small-item test (a listed code whose charges are above 0.00 and at or below the payer class's small-denial
      write-off amount) only while no below-threshold write-off entry stands on the claim, and it always covers a listed code
      that does not pass.
    sterile_charges: >-
      Within what it covers, the observation lines (revenue code 0762), the infusion (code 96365 under revenue code 0260),
      the heparin (code J1644 under revenue code 0636), the general pharmacy (revenue code 0250), the medical-surgical supplies
      (revenue code 0270, apart from the listed saline flush A4216) and the sterile supplies (revenue code 0272) are each
      read by their charges, and everything else as the remaining charges.
    sterile_pct: >-
      The sterile supply percentage applied to the revenue code 0272 supply charges is sterile_pct_hmo when a Commercial HMO
      claim is for an Observation Stay Account, sterile_pct_ppo when a Commercial PPO claim is for an Observation Stay Account,
      and otherwise the payer class's expected allowed percentage of charges.
  factors:
  - id: observation_pricing_method
    effect: method
    decides: obs_method
    bindings:
    - obs_method
    - case_rate
    baseline:
      obs_method: '0'
    ladder:
    - when: >-
        a Commercial HMO claim AND the services were at a hospital campus (Riverbend Regional Medical Center - Appleton or
        Riverbend Lakeshore Hospital - Neenah)
      method: >-
        observation case rate by billed-hour band, packaging the general pharmacy, never above the billed charges of the observation
        and general pharmacy lines
    - when: a Commercial PPO claim
      method: 'per hour: billed hours capped at obs_hour_cap x obs_hourly_ppo'
    - when: otherwise
      method: expected allowed percentage of the observation charges
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: infusion_contract_fee
    effect: parameter
    decides: inf_rate
    bindings:
    - inf_rate
    baseline:
      inf_rate: inf_charges / MX(inf_units, 1) * pct
    ladder:
    - when: a Commercial HMO claim
      value: inf_hmo
    - when: a Commercial PPO claim
      value: inf_ppo
    - when: otherwise (a Marketplace claim)
      value: charges per counted unit x expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: heparin_unit_rate
    effect: parameter
    decides: hep_rate
    bindings:
    - hep_rate
    baseline:
      hep_rate: hep_charges / MX(hep_units, 1) * pct
    ladder:
    - when: a Commercial HMO claim
      value: hep_hmo
    - when: a Commercial PPO claim
      value: hep_ppo
    - when: otherwise (a Marketplace claim)
      value: charges per counted unit x expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: medical_surgical_supply_percentage
    effect: parameter
    decides: supply_pct
    bindings:
    - supply_pct
    baseline:
      supply_pct: pct
    ladder:
    - when: a Commercial HMO claim AND an Observation Stay Account
      value: supply_pct_hmo
    - when: a Commercial PPO claim AND an Observation Stay Account
      value: supply_pct_ppo
    - when: otherwise
      value: the payer class's expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: sterile_supply_percentage
    effect: parameter
    decides: sterile_pct
    bindings:
    - sterile_pct
    baseline:
      sterile_pct: pct
    ladder:
    - when: a Commercial HMO claim AND an Observation Stay Account
      value: sterile_pct_hmo
    - when: a Commercial PPO claim AND an Observation Stay Account
      value: sterile_pct_ppo
    - when: otherwise
      value: the payer class's expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: observation_campus_factor
    effect: parameter
    decides: site_factor
    bindings:
    - site_factor
    baseline:
      site_factor: '1'
    ladder:
    - when: the services were at Riverbend Lakeshore Hospital - Neenah
      value: site_neenah
    - when: the services were at Riverbend Community Hospital - Chilton
      value: site_cah
    - when: otherwise (services at Riverbend Regional Medical Center - Appleton)
      value: '1'
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  baseline:
    rule: >-
      The close-out covers the charges of the claim's hospital account except the diagnostic tests (revenue codes 0483, 0730,
      0300 and 0350, and the contrast code Q9967 under revenue code 0636), which stay payable, and the self-administered drugs
      (revenue code 0637), which it never values; it covers the small items on Riverbend's observation and emergency small-item
      list that pass the small-item test (a listed code whose charges are above 0.00 and at or below the payer class's small-denial
      write-off amount) only while no below-threshold write-off entry stands on the claim, and it always covers a listed code
      that does not pass. Within what it covers, the observation lines (revenue code 0762), the infusion (code 96365 under
      revenue code 0260), the heparin (code J1644 under revenue code 0636), the general pharmacy (revenue code 0250), the
      medical-surgical supplies (revenue code 0270, apart from the listed saline flush A4216) and the sterile supplies (revenue
      code 0272) are each read by their charges, and everything else as the remaining charges. The close-out value is the
      charges it covers multiplied by the payer class's expected allowed percentage of charges. The close-out never writes
      off more than the payer has recovered on the claim, the total of its recovery entries, less the below-threshold write-offs
      already on the claim, and never less than 0.00; with no recovery entry on the claim it is 0.00. The close-out value
      is rounded to the nearest cent once, on the final total, and when it is 0.00 no entry is written.
    params:
    - expected_allowed_pct_of_charges
    - small_denial_write_off_usd
  inputs:
    history:
    - table: claim_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: claim_takeback
    - table: claim_transactions
      aggregate: count
      field: appeal_type
      filters:
        event_type: claim_appeal_filed
    - table: claim_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: claim_denial_written_off
    - category: encounter
      table: encounter_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: encounter_charge_posted
    cross_category:
    - encounter
