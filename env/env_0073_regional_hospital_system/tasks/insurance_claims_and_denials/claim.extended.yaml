- id: claim_ext_noncovered_convenience_closeout
  base_policy_refs:
  - claim_denial_write_off
  - claim_timely_filing
  - claim_denial_routing
  overwrite:
  - base_policy: claim_denial_write_off
    superseded_clause: >-
      A denied amount is written off by the hospital, never billed to the patient, when its route ends in a write-off: TIMELY_FILING_EXPIRED
      (no timely-filing proof), NO_AUTHORIZATION_OBTAINED (no authorization, notification, emergency exemption or retro authorization),
      NONCOVERED_NO_WAIVER (no advance waiver on file), APPEALS_EXHAUSTED (the last available level upheld the denial), or
      BELOW_APPEAL_THRESHOLD (a denied amount at or below small_denial_write_off_usd that is not worth appealing).
    replaced_by: >-
      For the take-home convenience items of a claim closed under this rule, and only for them, the amount written off as
      non-covered with no waiver is the convenience value rather than their charges; small items on Riverbend's outpatient-surgery
      small-item list, the services closed on the member's decision, small items on Riverbend's observation and emergency
      small-item list, self-administered drugs and the services closed on the patient's external-review decision are written
      off under their own rules, and every other denied amount is written off in full by the hospital, never billed to the
      patient, when its route ends in a write-off: timely filing expired (no timely-filing proof), no authorization obtained
      (no authorization, notification, emergency exemption or retro authorization), non-covered with no waiver (no advance
      waiver on file), appeals exhausted (the last available level upheld the denial), or below the appeal threshold (a denied
      amount at or below the payer class's small-denial write-off amount that is not worth appealing).
  trigger: state_due
  subject:
  - claim_denial_written_off
  computes: amount_usd
  target_tool: write_off_noncovered_convenience_item_58e216c4
  params:
    takehome_E0218_asc: 185.0
    takehome_share_hosp: 0.6
    takehome_fee_hosp: 12.0
    kit_share_full: 0.8
    kit_share_pair: 0.9
    pack_share_4: 0.55
    pack_share_2: 0.7
    garment_share_3: 0.6
    garment_share_2: 0.75
  rule: >-
    On a Commercial PPO, Commercial HMO or Marketplace claim in denied status for an Outpatient Surgery Account, this rule
    takes the take-home convenience items off the claim as one write-off entry with the write-off reason NONCOVERED_NO_WAIVER,
    carrying the claim's current denial reason code; any other claim gets nothing here. The take-home convenience items are
    the codes on Riverbend's convenience list billed under revenue code 0274: the cold-therapy unit (E0218), the cold pack
    (A9273) and the support garment (A4467); Riverbend's agreements treat them as covered by no payer class, and each is read
    from the account's charge postings by its charges. A signed Riverbend Financial Responsibility Waiver shows on the account
    as a non-covered patient liability (liability source NONCOVERED_SERVICE), the release the waiver supports; while the account
    carries no such liability, the convenience items are written off under this rule, and when it carries one this rule writes
    nothing. The convenience value is the convenience items' charges. The Outpatient Surgery Account class gives an insured
    patient's non-covered items no uninsured discount, so none is applied to the convenience value. The convenience value
    is rounded to the nearest cent once, on the final total, and when it is 0.00 no entry is written. For the take-home convenience
    items of a claim closed under this rule, and only for them, the amount written off as non-covered with no waiver is the
    convenience value rather than their charges; small items on Riverbend's outpatient-surgery small-item list, the services
    closed on the member's decision, small items on Riverbend's observation and emergency small-item list, self-administered
    drugs and the services closed on the patient's external-review decision are written off under their own rules, and every
    other denied amount is written off in full by the hospital, never billed to the patient, when its route ends in a write-off:
    timely filing expired (no timely-filing proof), no authorization obtained (no authorization, notification, emergency exemption
    or retro authorization), non-covered with no waiver (no advance waiver on file), appeals exhausted (the last available
    level upheld the denial), or below the appeal threshold (a denied amount at or below the payer class's small-denial write-off
    amount that is not worth appealing). The convenience-item charges above the convenience value stay on the claim as the
    contractual remainder, which Riverbend's month-end contractual close posts on the last calendar day of the month. Each
    adjustment below either replaces the standard value of one convenience code or multiplies the total; replacements are
    made first, the multiplier after them, and the total is then rounded once. The cold-therapy unit is valued from Riverbend's
    take-home price list for its dispensing site, never above its charges, reading its billed units and its number of lines
    from the account's charge postings: when it is dispensed at Riverbend Surgery & Imaging Center - Grand Chute, at the lesser
    of its charges and its billed units times takehome_E0218_asc; when it is dispensed at a hospital campus (Riverbend Regional
    Medical Center - Appleton or Riverbend Lakeshore Hospital - Neenah), at the lesser of its charges and its charges times
    takehome_share_hosp plus takehome_fee_hosp for each of its lines; otherwise at its charges. The cold-pack quantity share,
    which multiplies its charges, follows the quantity dispensed (its billed units) on Riverbend's take-home price list: pack_share_4
    when 4 or more cold-pack units are dispensed, pack_share_2 when 2 to 3 are dispensed, and 1 for a single unit. The support-garment
    quantity share, which multiplies its charges, follows the quantity dispensed (its billed units) on Riverbend's take-home
    price list: garment_share_3 when 3 or more garment units are dispensed, garment_share_2 when 2 are dispensed, and 1 for
    a single unit. The take-home kit share, which multiplies the whole convenience value, is kit_share_full when all three
    convenience codes are billed on the account (Riverbend's self-pay kit price), kit_share_pair when exactly two of them
    are billed, and 1 otherwise.
