  - retained_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0730') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0324')
  - convenience_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0274', cpt_hcpcs_code='E0218') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='A9273') + XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='A4467')
  - or_charges: >-
