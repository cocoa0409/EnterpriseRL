  - pass_A4216: 1 if (chg_A4216 > 0 and chg_A4216 <= P('small_denial_write_off_usd')) else 0
  - j2405_rate: >-
      K('j2405_hmo') if (F('variant_name') == 'Commercial HMO Claim') else (K('j2405_ppo') if (F('variant_name') == 'Commercial
      PPO Claim') else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J2405')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J2405'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - j1885_method: >-
      2 if (F('variant_name') == 'Commercial HMO Claim' and CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id'))
      == 'Observation Stay Account') else (1 if (F('variant_name') == 'Commercial PPO Claim' and CFIELD('encounter', 'variant_name',
      encounter_id=F('encounter_id')) == 'Emergency Department Visit Account') else 0)
  - j7050_rate: >-
      K('j7050_hmo_hosp') if (F('variant_name') == 'Commercial HMO Claim' and (CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Regional Medical Center - Appleton' or CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Lakeshore Hospital - Neenah')) else (K('j7050_ppo_cah') if (F('variant_name') == 'Commercial PPO Claim'
      and CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Community Hospital - Chilton') else
      ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0258', cpt_hcpcs_code='J7050')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0258', cpt_hcpcs_code='J7050'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - a4216_rate: >-
      K('a4216_hmo') if (F('variant_name') == 'Commercial HMO Claim') else (K('a4216_ppo') if (F('variant_name') == 'Commercial
      PPO Claim') else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0270', cpt_hcpcs_code='A4216')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0270', cpt_hcpcs_code='A4216'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - site_factor: >-
      K('small_site_neenah') if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Lakeshore Hospital
      - Neenah' else (K('small_site_cah') if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend
      Community Hospital - Chilton' else 1)
  - val_J2405: MN(chg_J2405, MX(units_J2405, 1) * j2405_rate)
  - val_J1885: >-
      MN(chg_J1885, MN(chg_J1885, units_J1885 * K('j1885_fee')) if j1885_method == 2 else ((units_J1885 * K('j1885_fee'))
      if j1885_method == 1 else chg_J1885 * pct))
  - val_J7050: MN(chg_J7050, MX(units_J7050, 1) * j7050_rate)
  - val_A4216: MN(chg_A4216, MX(units_A4216, 1) * a4216_rate)
