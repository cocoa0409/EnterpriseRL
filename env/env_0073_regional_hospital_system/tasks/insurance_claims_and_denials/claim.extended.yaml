      Stay Account' or CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id')) == 'Emergency Department Visit
      Account') and F('status') == 'denied') else 0
  - result: RND(MX(0, MN(small_value, recovered)) * small_gate, 2)
