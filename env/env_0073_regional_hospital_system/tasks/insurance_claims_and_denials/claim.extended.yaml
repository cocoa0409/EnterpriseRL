      J1100 under revenue code 0636), cefazolin (code J0690 under revenue code 0636), the splint (code A4570 under revenue
      code 0270) and the intravenous solution (code J7050 under revenue code 0258); each listed code is read from the account's
      charge postings by its charges. A listed code passes the small-item test when its charges on the account are above 0.00
      and at or below the payer class's small-denial write-off amount; a listed code that does not pass stays with the claim's
      other denied services. The surgery small-item value is the sum, over the codes that pass, of each code's charges multiplied
      by the payer class's expected allowed percentage of charges. The surgery small-item value never exceeds what the payer
      has recovered on the claim, the total of its recovery entries; with no recovery entry on the claim it is 0.00. The surgery
      small-item value is rounded to the nearest cent once, on the final total, and when it is 0.00 no entry is written.
