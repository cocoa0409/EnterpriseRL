  - pass_J7050: 1 if (chg_J7050 > 0 and chg_J7050 <= P('small_denial_write_off_usd')) else 0
  - j2405_rate: >-
      K('j2405_ppo') if (F('variant_name') == 'Commercial PPO Claim') else (K('j2405_hmo') if (F('variant_name') == 'Commercial
      HMO Claim') else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J2405')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J2405'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - j1100_rate: >-
      K('j1100_ppo') if (F('variant_name') == 'Commercial PPO Claim') else (K('j1100_hmo') if (F('variant_name') == 'Commercial
      HMO Claim') else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J1100')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J1100'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - j0690_rate: >-
      K('j0690_fee_hmo') if F('variant_name') == 'Commercial HMO Claim' else (K('j0690_fee_ppo') if F('variant_name') == 'Commercial
      PPO Claim' else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J0690')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J0690'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - a4570_method: >-
      2 if (F('variant_name') == 'Commercial PPO Claim' and CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Surgery & Imaging Center - Grand Chute') else (1 if (F('variant_name') == 'Commercial HMO Claim' and (CFIELD('encounter',
      'facility', encounter_id=F('encounter_id')) == 'Riverbend Regional Medical Center - Appleton' or CFIELD('encounter',
      'facility', encounter_id=F('encounter_id')) == 'Riverbend Lakeshore Hospital - Neenah')) else 0)
  - j7050_rate: >-
      K('j7050_ppo') if (F('variant_name') == 'Commercial PPO Claim') else (K('j7050_hmo') if (F('variant_name') == 'Commercial
      HMO Claim') else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0258', cpt_hcpcs_code='J7050')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0258', cpt_hcpcs_code='J7050'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - val_J2405: MN(chg_J2405, MX(units_J2405, 1) * j2405_rate)
  - val_J1100: MN(chg_J1100, MX(units_J1100, 1) * j1100_rate)
  - val_J0690: MN(chg_J0690, MX(units_J0690, 1) * j0690_rate)
  - val_A4570: >-
      MN(chg_A4570, MN(chg_A4570, units_A4570 * K('a4570_fee')) if a4570_method == 2 else ((units_A4570 * K('a4570_fee'))
      if a4570_method == 1 else chg_A4570 * pct))
  - val_J7050: MN(chg_J7050, MX(units_J7050, 1) * j7050_rate)
  - small_value: >-
