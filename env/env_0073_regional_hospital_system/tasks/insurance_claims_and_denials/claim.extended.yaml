  rule: >-
    On a Commercial PPO, Commercial HMO or Marketplace claim in denied status for an Observation Stay Account or an Emergency
    Department Visit Account where a member-level appeal (MEMBER_APPEAL_WITH_AOR) has been filed, the appeals filed number
    at least the payer class's available appeal levels, the payer class offers independent external review and the external-review
    window is still open, the claimant's internal appeals are exhausted and the remaining route is the patient's own request
    for external review; when the patient decides in person not to request it, the claim's last route ends and this rule takes
    the services still open off the claim as one write-off entry with the write-off reason APPEALS_EXHAUSTED, carrying the
    claim's current denial reason code, booked through the patient's own decision; any other claim gets nothing here. The
    external-review window is open while fewer than the payer class's external-review window months have passed since the
    claim's denial date, counted in whole calendar months: a month is complete on the same day number of a later month, so
    a date whose day number is below the denial date's has not yet completed that month. The close-out covers the charges
    of the claim's hospital account except the diagnostic tests (revenue codes 0483, 0730, 0300 and 0350, and the contrast
    code Q9967 under revenue code 0636), which stay payable, and the self-administered drugs (revenue code 0637), which it
    never values; it covers the small items on Riverbend's observation and emergency small-item list that pass the small-item
    test (a listed code whose charges are above 0.00 and at or below the payer class's small-denial write-off amount) only
    while no below-threshold write-off entry stands on the claim, and it always covers a listed code that does not pass. Within
    what it covers, the observation lines (revenue code 0762), the infusion (code 96365 under revenue code 0260), the heparin
    (code J1644 under revenue code 0636), the general pharmacy (revenue code 0250), the medical-surgical supplies (revenue
    code 0270, apart from the listed saline flush A4216) and the sterile supplies (revenue code 0272) are each read by their
    charges, and everything else as the remaining charges. The close-out value is the charges it covers multiplied by the
    payer class's expected allowed percentage of charges. The close-out never writes off more than the payer has recovered
    on the claim, the total of its recovery entries, less the below-threshold write-offs already on the claim, and never less
    than 0.00; with no recovery entry on the claim it is 0.00. The close-out value is rounded to the nearest cent once, on
    the final total, and when it is 0.00 no entry is written. For the services still open on a claim closed under this rule,
    and only for them, the claim's last route has ended and the amount written off as appeals exhausted is the close-out value
    rather than the denied amount; small items on Riverbend's outpatient-surgery small-item list, take-home convenience items,
    the services closed on the member's decision, small items on Riverbend's observation and emergency small-item list and
    self-administered drugs are written off under their own rules, and every other denied amount is written off in full by
    the hospital, never billed to the patient, when its route ends in a write-off: timely filing expired (no timely-filing
    proof), no authorization obtained (no authorization, notification, emergency exemption or retro authorization), non-covered
    with no waiver (no advance waiver on file), appeals exhausted (the last available level upheld the denial), or below the
    appeal threshold (a denied amount at or below the payer class's small-denial write-off amount that is not worth appealing).
    The recovered amount above the close-out value and the other write-offs stays on the claim as the agreement's contractual
    remainder, which Riverbend's month-end contractual close posts on the last calendar day of the month. The external-review
    close-out is fixed only after the payer's recovery of its payment stands as a recovery entry on the claim. The external-review
    close-out is fixed only after the small items that pass the small-item test carry their below-threshold write-off entry
    on the claim. The patient's external-review decision is not recorded until, on an account that carries self-administered
    drugs and no non-covered patient liability, those drugs carry their non-covered write-off entry on the claim. Each adjustment
    below either replaces the standard value of one group of lines or multiplies the total; replacements are made first, each
    never above the billed charges of the lines it values (Riverbend's agreements pay the lesser of the scheduled amount and
    the billed charges), the multiplier after them, then the recovery limit, and the total is then rounded once. The observation
    pricing method values the observation lines: when a Commercial HMO claim is for services at a hospital campus (Riverbend
    Regional Medical Center - Appleton or Riverbend Lakeshore Hospital - Neenah), by Riverbend's observation case rate, which
    packages the general pharmacy (revenue code 0250), is never above the billed charges of the observation and general pharmacy
    lines it packages, and follows the billed hours of G0378 — obs_case_long at 48 hours or more, obs_case_mid at 24 hours
    or more and below 48, obs_case_short at 8 hours or more and below 24, obs_case_brief below 8 hours, and no value when
    no hour is billed; on a Commercial PPO claim, per hour, the billed hours but no more than obs_hour_cap times obs_hourly_ppo;
    otherwise at the payer class's expected allowed percentage of the observation charges. The infusion rate per counted unit
    is inf_hmo on a Commercial HMO claim, inf_ppo on a Commercial PPO claim, and otherwise its charges per counted unit times
    the expected allowed percentage; it is valued at its counted units times that rate, never above its charges, its counted
    units being its billed units, or one when it is billed with charges but no units. The heparin rate per counted unit is
    hep_hmo on a Commercial HMO claim, hep_ppo on a Commercial PPO claim, and otherwise its charges per counted unit times
    the expected allowed percentage; it is valued at its counted units times that rate, never above its charges, its counted
    units being its billed units, or one when it is billed with charges but no units. The general pharmacy carries no value
    of its own only when the observation case rate that packages it is paid (the case-rate method with observation hours billed);
    otherwise it is valued at the expected allowed percentage of its charges. The medical-surgical supply percentage applied
    to the revenue code 0270 supply charges is supply_pct_hmo when a Commercial HMO claim is for an Observation Stay Account,
    supply_pct_ppo when a Commercial PPO claim is for an Observation Stay Account, and otherwise the payer class's expected
    allowed percentage of charges. The sterile supply percentage applied to the revenue code 0272 supply charges is sterile_pct_hmo
    when a Commercial HMO claim is for an Observation Stay Account, sterile_pct_ppo when a Commercial PPO claim is for an
    Observation Stay Account, and otherwise the payer class's expected allowed percentage of charges. The campus factor, which
    multiplies the whole close-out value, is site_neenah for services at Riverbend Lakeshore Hospital - Neenah, site_cah for
    services at Riverbend Community Hospital - Chilton, and 1 otherwise.
  prerequisite:
  - problem: claim_ext_retrospective_denial_refund
    kind: value_input
    gate: recovered
    form: state
    condition: >-
      A payer recovery entry (reason code WO-72) stands on the claim whenever the payer's post-payment denial of an observation
      or emergency stay has been upheld on appeal and part of the payment is attributable to the services it reached.
    resolved_by: refund_payer_recovery_9b1903be
    effect: Once the recovery entry stands, the close-out is no longer limited to 0.00.
    policy_source: >-
      The external-review close-out is fixed only after the payer's recovery of its payment stands as a recovery entry on
      the claim.
  - problem: claim_ext_observation_small_item_closeout
    kind: value_input
    gate: small_booked
    form: state
    condition: >-
      A write-off entry with the write-off reason BELOW_APPEAL_THRESHOLD stands on the claim whenever a code on the observation
      and emergency small-item list passes the small-item test and the payer's recovery stands.
    resolved_by: write_off_observation_small_items_ab2aa651
    effect: >-
      Once the below-threshold entry stands, the close-out leaves the passing small items out of what it covers, which lowers
      it.
    policy_source: >-
      The external-review close-out is fixed only after the small items that pass the small-item test carry their below-threshold
      write-off entry on the claim.
  - problem: claim_ext_self_administered_drug_closeout
    kind: state_gate
    gate: claim_transactions.writeoff_reason
    form: state
    condition: >-
      A write-off entry with the write-off reason NONCOVERED_NO_WAIVER stands on the claim whenever the account carries self-administered
      drugs and no non-covered patient liability.
    resolved_by: write_off_self_administered_drugs_664aab61
    effect: >-
      Once the non-covered entry stands, the patient's decision may be recorded and the close-out entry is booked.
    policy_source: >-
      The patient's external-review decision is not recorded until, on an account that carries self-administered drugs and
      no non-covered patient liability, those drugs carry their non-covered write-off entry on the claim.
  cross_category:
  - category: encounter
    as: branch
    reads:
    - variant_name
    - facility
    - encounter_transactions.amount
    - encounter_transactions.units
    - encounter_transactions.revenue_code
    - encounter_transactions.cpt_hcpcs_code
    note: >-
      The domain, every family's value and the campus factor follow the hospital account's class, campus and charge postings.
  compute:
  - recovered: SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_takeback')
  - small_written_off: >-
      SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_denial_written_off', writeoff_reason='BELOW_APPEAL_THRESHOLD')
  - small_booked: >-
      COUNT('claim_transactions', date_field='posting_date', event_type='claim_denial_written_off', writeoff_reason='BELOW_APPEAL_THRESHOLD')
      > 0
  - pct: P('expected_allowed_pct_of_charges') / 100
  - all_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'))
  - retained_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0483') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0730') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0350') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='Q9967')
  - sad_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0637')
  - obs_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0762')
  - obs_hours: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0762', cpt_hcpcs_code='G0378')
  - inf_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0260', cpt_hcpcs_code='96365')
  - inf_units: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0260', cpt_hcpcs_code='96365')
  - hep_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J1644')
  - hep_units: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J1644')
  - pharmacy_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0250')
  - listed_supply_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0270', cpt_hcpcs_code='A4216')
  - supply_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0270') - listed_supply_charges
  - sterile_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0272')
  - small_J2405: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J2405') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J2405') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J2405')
      <= P('small_denial_write_off_usd')) else 0
  - small_J1885: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J1885') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J1885') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J1885')
      <= P('small_denial_write_off_usd')) else 0
  - small_J7050: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0258', cpt_hcpcs_code='J7050') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0258', cpt_hcpcs_code='J7050') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0258', cpt_hcpcs_code='J7050')
      <= P('small_denial_write_off_usd')) else 0
  - small_A4216: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0270', cpt_hcpcs_code='A4216') if (XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0270', cpt_hcpcs_code='A4216') > 0 and XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0270', cpt_hcpcs_code='A4216')
      <= P('small_denial_write_off_usd')) else 0
  - passing_small_charges: small_J2405 + small_J1885 + small_J7050 + small_A4216
  - open_small_charges: 0 if small_booked else passing_small_charges
  - other_charges: >-
      all_charges - retained_charges - sad_charges - obs_charges - inf_charges - hep_charges - pharmacy_charges - supply_charges
      - sterile_charges - passing_small_charges
  - obs_method: >-
      2 if (F('variant_name') == 'Commercial HMO Claim' and (CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Regional Medical Center - Appleton' or CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Lakeshore Hospital - Neenah')) else (1 if F('variant_name') == 'Commercial PPO Claim' else 0)
  - inf_rate: >-
      K('inf_hmo') if F('variant_name') == 'Commercial HMO Claim' else (K('inf_ppo') if F('variant_name') == 'Commercial PPO
      Claim' else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0260', cpt_hcpcs_code='96365')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0260', cpt_hcpcs_code='96365'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - hep_rate: >-
      K('hep_hmo') if F('variant_name') == 'Commercial HMO Claim' else (K('hep_ppo') if F('variant_name') == 'Commercial PPO
      Claim' else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J1644')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0636', cpt_hcpcs_code='J1644'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - supply_pct: >-
      K('supply_pct_hmo') if (F('variant_name') == 'Commercial HMO Claim' and CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id'))
      == 'Observation Stay Account') else (K('supply_pct_ppo') if (F('variant_name') == 'Commercial PPO Claim' and CFIELD('encounter',
      'variant_name', encounter_id=F('encounter_id')) == 'Observation Stay Account') else P('expected_allowed_pct_of_charges')
      / 100)
  - sterile_pct: >-
      K('sterile_pct_hmo') if (F('variant_name') == 'Commercial HMO Claim' and CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id'))
      == 'Observation Stay Account') else (K('sterile_pct_ppo') if (F('variant_name') == 'Commercial PPO Claim' and CFIELD('encounter',
      'variant_name', encounter_id=F('encounter_id')) == 'Observation Stay Account') else P('expected_allowed_pct_of_charges')
      / 100)
  - site_factor: >-
      K('site_neenah') if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Lakeshore Hospital
      - Neenah' else (K('site_cah') if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Community
      Hospital - Chilton' else 1)
  - case_rate: >-
      K('obs_case_long') if obs_hours >= 48 else (K('obs_case_mid') if obs_hours >= 24 else (K('obs_case_short') if obs_hours
      >= 8 else K('obs_case_brief')))
  - obs_value: >-
      (MN(case_rate, obs_charges + pharmacy_charges) if obs_hours > 0 else 0) if obs_method == 2 else MN(obs_charges, (MN(obs_hours,
      K('obs_hour_cap')) * K('obs_hourly_ppo')) if obs_method == 1 else obs_charges * pct)
  - pharmacy_value: 0 if (obs_method == 2 and obs_hours > 0) else pharmacy_charges * pct
  - closeout_value: >-
      (obs_value + MN(inf_charges, MX(inf_units, 1) * inf_rate) + MN(hep_charges, MX(hep_units, 1) * hep_rate) + pharmacy_value
      + supply_charges * supply_pct + sterile_charges * sterile_pct + (other_charges + open_small_charges) * pct) * site_factor
  - review_gate: >-
      1 if ((F('variant_name') == 'Commercial PPO Claim' or F('variant_name') == 'Commercial HMO Claim' or F('variant_name')
      == 'Marketplace Exchange Plan Claim') and (CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id')) == 'Observation
      Stay Account' or CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id')) == 'Emergency Department Visit
      Account') and F('status') == 'denied' and COUNT('claim_transactions', date_field='posting_date', event_type='claim_appeal_filed',
      appeal_type='MEMBER_APPEAL_WITH_AOR') >= 1 and COUNT('claim_transactions', date_field='posting_date', event_type='claim_appeal_filed')
      >= P('appeal_levels_available') and P('external_review_available') and F('denial_date') != '' and MONTHS(F('denial_date'),
      NOW) < P('external_review_window_months')) else 0
  - result: RND(MX(0, MN(closeout_value, recovered - small_written_off)) * review_gate, 2)
  compute_basis:
    recovered: >-
      The close-out never writes off more than the payer has recovered on the claim, the total of its recovery entries, less
      the below-threshold write-offs already on the claim, and never less than 0.00; with no recovery entry on the claim it
      is 0.00.
    small_written_off: >-
      The close-out never writes off more than the payer has recovered on the claim, the total of its recovery entries, less
      the below-threshold write-offs already on the claim, and never less than 0.00; with no recovery entry on the claim it
      is 0.00.
    small_booked: >-
      The close-out covers the charges of the claim's hospital account except the diagnostic tests (revenue codes 0483, 0730,
      0300 and 0350, and the contrast code Q9967 under revenue code 0636), which stay payable, and the self-administered drugs
