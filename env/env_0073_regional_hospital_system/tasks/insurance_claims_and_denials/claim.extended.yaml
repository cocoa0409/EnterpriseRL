      BELOW_APPEAL_THRESHOLD (a denied amount at or below small_denial_write_off_usd that is not worth appealing).
    replaced_by: >-
      For the services still open on a claim closed under this rule, and only for them, the claim's last route has ended and
      the amount written off as appeals exhausted is the member-decision value rather than the denied amount; small items
      on Riverbend's outpatient-surgery small-item list, take-home convenience items, small items on Riverbend's observation
      and emergency small-item list, self-administered drugs and the services closed on the patient's external-review decision
      are written off under their own rules, and every other denied amount is written off in full by the hospital, never billed
      to the patient, when its route ends in a write-off: timely filing expired (no timely-filing proof), no authorization
      obtained (no authorization, notification, emergency exemption or retro authorization), non-covered with no waiver (no
      advance waiver on file), appeals exhausted (the last available level upheld the denial), or below the appeal threshold
      (a denied amount at or below the payer class's small-denial write-off amount that is not worth appealing).
  trigger: on_request
  subject:
  - claim_denial_written_off
  computes: amount_usd
  target_tool: close_denial_on_member_decision_7cc13d5d
  params:
    case_29882: 6150.0
    mpr_share: 0.5
    fee_29882: 5480.0
    fee_29877: 1720.0
    fee_c1713: 520.0
    fee_c1762: 410.0
    anes_ppo: 640.0
    anes_hmo: 720.0
    rec_ppo: 310.0
    rec_hmo: 285.0
    site_free: 0.92
    site_cah: 1.04
    dme_e0114_asc: 31.5
    dme_e0114_hosp: 36.0
  rule: >-
    On a Commercial PPO, Commercial HMO or Marketplace claim in denied status for an Outpatient Surgery Account where no member-level
    appeal (MEMBER_APPEAL_WITH_AOR) has been filed, fewer appeals have been filed than the payer class's available appeal
    levels, and the member-level appeal window is open, the remaining level belongs to the patient: Riverbend files the last
    internal level of a commercial claim only as the member's own appeal under the patient's signed authorized-representative
    form. When the patient decides in person not to pursue it, the claim's last route ends and this rule takes the services
    still open off the claim as one write-off entry with the write-off reason APPEALS_EXHAUSTED, carrying the claim's current
    denial reason code, booked through the patient's own decision; any other claim gets nothing here. The member-level appeal
    window is open while the days from the claim's denial date to today are no more than the payer class's member appeal window
    days plus its notice receipt presumption days, and only where that window is greater than zero. The member-decision value
    covers the charges of the claim's hospital account except the pre-operative tests (revenue codes 0300, 0730 and 0324),
    which stay payable, and the take-home convenience items on Riverbend's convenience list (E0218, A9273 and A4467 under
    revenue code 0274), which it never values; it covers the small items on Riverbend's outpatient-surgery small-item list
    that pass the small-item test (a listed code whose charges are above 0.00 and at or below the payer class's small-denial
    write-off amount) only while no below-threshold write-off entry stands on the claim, and it always covers a listed code
    that does not pass. Within what it covers, the operating-room lines (revenue code 0360), the implant lines (revenue code
    0278), the anesthesia (revenue code 0370) and recovery (revenue code 0710) lines, the ancillary lines (revenue codes 0250
    and 0272) and the crutches (code E0114 under revenue code 0274) are each read by their charges, and everything else as
    the remaining charges. The member-decision value is the charges it covers multiplied by the payer class's expected allowed
    percentage of charges. The member-decision value never exceeds what the payer has recovered on the claim, the total of
    its recovery entries, less the below-threshold write-offs already on the claim, and is never below 0.00; with no recovery
    entry on the claim it is 0.00. The member-decision value is rounded to the nearest cent once, on the final total, and
    when it is 0.00 no entry is written. For the services still open on a claim closed under this rule, and only for them,
    the claim's last route has ended and the amount written off as appeals exhausted is the member-decision value rather than
    the denied amount; small items on Riverbend's outpatient-surgery small-item list, take-home convenience items, small items
    on Riverbend's observation and emergency small-item list, self-administered drugs and the services closed on the patient's
    external-review decision are written off under their own rules, and every other denied amount is written off in full by
    the hospital, never billed to the patient, when its route ends in a write-off: timely filing expired (no timely-filing
    proof), no authorization obtained (no authorization, notification, emergency exemption or retro authorization), non-covered
    with no waiver (no advance waiver on file), appeals exhausted (the last available level upheld the denial), or below the
    appeal threshold (a denied amount at or below the payer class's small-denial write-off amount that is not worth appealing).
    The recovered amount above the member-decision value and the other write-offs stays on the claim as the agreement's contractual
    remainder, which Riverbend's month-end contractual close posts on the last calendar day of the month. The member-decision
    value is fixed only after the payer's recovery of its payment stands as a recovery entry on the claim. The member-decision
    value is fixed only after the small items that pass the small-item test carry their below-threshold write-off entry on
    the claim. The member's decision is not recorded until, on an account that carries take-home convenience items and no
    non-covered patient liability, those items carry their non-covered write-off entry on the claim. Each adjustment below
    either replaces the standard value of one group of lines or multiplies the total; replacements are made first, each never
    above the billed charges of the lines it values (Riverbend's agreements pay the lesser of the scheduled amount and the
    billed charges), the multiplier after them, then the recovery limit, and the total is then rounded once. The surgical
    pricing method values the operating-room lines, reading codes 29882 and 29877 by their charges and billed units: when
    a Commercial PPO claim bills code 29882, by the arthroscopy case rate, case_29882 plus every other operating-room charge
    times the payer class's expected allowed percentage times mpr_share, which packages the ancillary lines (revenue codes
    0250 and 0272) and is never above the billed charges of the operating-room and ancillary lines it packages; on a Commercial
    HMO claim, by the per-procedure fee schedule, the billed units of 29882 times fee_29882 plus the billed units of 29877
    times fee_29877 plus every other operating-room charge times the expected allowed percentage; otherwise at the expected
    allowed percentage of the operating-room charges. The implant pricing method values the implant lines, reading codes C1713
    and C1762 by their charges and billed units: when a Commercial PPO claim is for services at Riverbend Surgery & Imaging
    Center - Grand Chute, by Riverbend's device fee schedule, the billed units of C1713 times fee_c1713 plus the billed units
    of C1762 times fee_c1762; when a Commercial HMO claim is for services at a hospital campus (Riverbend Regional Medical
    Center - Appleton or Riverbend Lakeshore Hospital - Neenah), each of those two codes at the lesser of that schedule value
    and its charges; on either, any other implant code at the expected allowed percentage of its charges; otherwise all implant
    charges at the expected allowed percentage. The anesthesia rate per counted unit is anes_ppo on a Commercial PPO claim,
    anes_hmo on a Commercial HMO claim, and otherwise its charges per counted unit times the expected allowed percentage;
    it is valued at its counted units times that rate, never above its charges, its counted units being its billed units,
    or one when it is billed with charges but no units. The recovery rate per counted unit is rec_ppo on a Commercial PPO
    claim, rec_hmo on a Commercial HMO claim, and otherwise its charges per counted unit times the expected allowed percentage;
    it is valued at its counted units times that rate, never above its charges, its counted units being its billed units,
    or one when it is billed with charges but no units. The ancillary lines carry no value of their own only when the arthroscopy
    case rate that packages them is paid; otherwise they are valued at the expected allowed percentage of their charges. The
    crutch rate per counted unit is dme_e0114_asc when a Commercial PPO claim is for services at Riverbend Surgery & Imaging
    Center - Grand Chute, dme_e0114_hosp when a Commercial HMO claim is for services at a hospital campus (Riverbend Regional
    Medical Center - Appleton or Riverbend Lakeshore Hospital - Neenah), and otherwise its charges per counted unit times
    the expected allowed percentage; it is valued at its counted units times that rate, never above its charges, its counted
    units being its billed units, or one when it is billed with charges but no units. The site-of-service factor, which multiplies
    the whole member-decision value, is site_free for services at Riverbend Surgery & Imaging Center - Grand Chute, site_cah
    for services at Riverbend Community Hospital - Chilton, and 1 otherwise.
  prerequisite:
  - problem: claim_ext_surgery_post_payment_refund
    kind: value_input
    gate: recovered
    form: state
    condition: >-
      A payer recovery entry (reason code WO-72) stands on the claim whenever the payer's post-payment denial of an outpatient
      surgery has been upheld on Riverbend's appeal and part of the payment is attributable to the services it reached.
    resolved_by: refund_surgery_claim_payment_239964f7
    effect: Once the recovery entry stands, the member-decision value is no longer limited to 0.00.
    policy_source: >-
      The member-decision value is fixed only after the payer's recovery of its payment stands as a recovery entry on the
      claim.
  - problem: claim_ext_surgery_small_item_closeout
    kind: value_input
    gate: small_booked
    form: state
    condition: >-
      A write-off entry with the write-off reason BELOW_APPEAL_THRESHOLD stands on the claim whenever a code on the outpatient-surgery
      small-item list passes the small-item test and the payer's recovery stands.
    resolved_by: write_off_surgery_small_items_d7ad9b50
    effect: >-
      Once the below-threshold entry stands, the member-decision value leaves the passing small items out of what it covers,
      which lowers it.
    policy_source: >-
      The member-decision value is fixed only after the small items that pass the small-item test carry their below-threshold
      write-off entry on the claim.
  - problem: claim_ext_noncovered_convenience_closeout
    kind: state_gate
    gate: claim_transactions.writeoff_reason
    form: state
    condition: >-
      A write-off entry with the write-off reason NONCOVERED_NO_WAIVER stands on the claim whenever the account carries take-home
      convenience items and no non-covered patient liability.
    resolved_by: write_off_noncovered_convenience_item_58e216c4
    effect: >-
      Once the non-covered entry stands, the member's decision may be recorded and the member-decision entry is booked.
    policy_source: >-
      The member's decision is not recorded until, on an account that carries take-home convenience items and no non-covered
      patient liability, those items carry their non-covered write-off entry on the claim.
  cross_category:
  - category: encounter
    as: branch
    reads:
    - variant_name
    - facility
    - encounter_transactions.amount
    - encounter_transactions.units
    - encounter_transactions.revenue_code
    - encounter_transactions.cpt_hcpcs_code
    note: >-
      The domain, every family's value and the site factor follow the hospital account's class, campus and charge postings.
  compute:
  - recovered: SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_takeback')
  - small_written_off: >-
