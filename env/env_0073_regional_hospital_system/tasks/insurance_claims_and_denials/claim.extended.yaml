  factors:
  - id: surgical_pricing_method
    effect: method
    decides: surgical_method
    bindings:
    - surgical_method
    baseline:
      surgical_method: '0'
    ladder:
    - when: a Commercial PPO claim AND code 29882 is billed
      method: >-
        arthroscopy case rate: case_29882 plus other operating-room charges x expected allowed percentage x mpr_share, packaging
        the ancillary lines, never above the billed charges of the operating-room and ancillary lines
    - when: a Commercial HMO claim
      method: >-
        per-procedure fee schedule: units x fee_29882 + units x fee_29877 + other operating-room charges x expected allowed
        percentage
    - when: otherwise
      method: expected allowed percentage of the operating-room charges
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: implant_pricing_method
    effect: method
    decides: implant_method
    bindings:
    - implant_method
    - implant_sched
    baseline:
      implant_method: '0'
    ladder:
    - when: a Commercial PPO claim AND the services were at Riverbend Surgery & Imaging Center - Grand Chute
      method: 'device fee schedule: units x fee_c1713 + units x fee_c1762'
    - when: >-
        a Commercial HMO claim AND the services were at a hospital campus (Riverbend Regional Medical Center - Appleton or
        Riverbend Lakeshore Hospital - Neenah)
      method: lesser of the schedule value and the charges per code
    - when: otherwise
      method: expected allowed percentage of the implant charges
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: anesthesia_unit_rate
    effect: parameter
    decides: anes_rate
    bindings:
    - anes_rate
    baseline:
      anes_rate: anes_charges / MX(anes_units, 1) * pct
    ladder:
    - when: a Commercial PPO claim
      value: anes_ppo
    - when: a Commercial HMO claim
      value: anes_hmo
    - when: otherwise (a Marketplace claim)
      value: charges per counted unit x expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: recovery_room_unit_rate
    effect: parameter
    decides: rec_rate
    bindings:
    - rec_rate
    baseline:
      rec_rate: rec_charges / MX(rec_units, 1) * pct
    ladder:
    - when: a Commercial PPO claim
      value: rec_ppo
    - when: a Commercial HMO claim
      value: rec_hmo
    - when: otherwise (a Marketplace claim)
      value: charges per counted unit x expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: crutch_take_home_rate
    effect: parameter
    decides: dme_rate
    bindings:
    - dme_rate
    baseline:
