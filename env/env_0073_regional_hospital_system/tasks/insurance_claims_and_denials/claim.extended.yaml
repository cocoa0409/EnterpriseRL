  factors:
  - id: lab_schedule_method
    effect: method
    decides: lab_method
    bindings:
    - lab_method
    - sched_85025
    - sched_80048
    - sched_85610
    baseline:
      lab_method: '0'
    ladder:
    - when: a Commercial PPO claim AND the services were at Riverbend Surgery & Imaging Center - Grand Chute
      method: 'clinical laboratory fee schedule: billed units x schedule amount x clfs_mult per code'
    - when: >-
        a Commercial HMO claim AND the services were at a hospital campus (Riverbend Regional Medical Center - Appleton or
        Riverbend Lakeshore Hospital - Neenah)
      method: lesser of the schedule value and the charges, per code
    - when: otherwise
      method: the payer class's expected allowed percentage of the charges
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: blood_bank_typing_handling
    effect: method
    decides: typing_method
    bindings:
    - typing_method
    baseline:
      typing_method: '0'
    ladder:
    - when: a Commercial PPO claim AND code 29882 billed under revenue code 0360
      method: 'bundled with that procedure under the PPO agreements: no value'
    - when: a Commercial HMO claim
      method: billed units x typing_fee_hmo
    - when: otherwise
      method: the payer class's expected allowed percentage of the charges
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: venipuncture_collection_fee
    effect: parameter
    decides: collection_rate
    bindings:
    - collection_rate
    baseline:
      collection_rate: collection_charges / MX(collection_units, 1) * pct
    ladder:
    - when: a Commercial PPO claim
      value: collect_ppo
    - when: a Commercial HMO claim
      value: collect_hmo
    - when: otherwise (a Marketplace claim)
      value: charges per counted unit x expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
