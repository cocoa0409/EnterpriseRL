  factors:
  - id: echocardiogram_contract_fee
    effect: parameter
    decides: echo_rate
    bindings:
    - echo_rate
    baseline:
      echo_rate: echo_charges / MX(echo_units, 1) * pct
    ladder:
    - when: >-
        a Commercial HMO claim AND the services were at a hospital campus (Riverbend Regional Medical Center - Appleton or
        Riverbend Lakeshore Hospital - Neenah)
      value: echo_hmo_hosp
    - when: >-
        a Commercial PPO claim AND the services were at a hospital campus (Riverbend Regional Medical Center - Appleton or
        Riverbend Lakeshore Hospital - Neenah)
      value: echo_ppo_hosp
    - when: otherwise
      value: charges per counted unit x expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: ecg_tracings_counted
    effect: method
    decides: ecg_counted
    bindings:
    - ecg_counted
    baseline:
      ecg_counted: MX(ecg_units, 1)
    ladder:
    - when: a Commercial HMO claim
      method: one tracing per line
    - when: a Commercial PPO claim
      method: counted units capped at ecg_cap_per_line times the number of lines
    - when: otherwise (a Marketplace claim)
      method: counted units
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: retained_lab_pricing
    effect: method
    decides: lab_method
    bindings:
    - lab_method
    - sched_84484
    - sched_85025
    - sched_80053
    baseline:
      lab_method: '0'
    ladder:
    - when: a Commercial HMO claim AND an Observation Stay Account
      method: clinical laboratory fee schedule x clfs_mult_hmo
    - when: a Commercial PPO claim AND an Observation Stay Account
      method: lesser of the schedule value x clfs_mult_ppo and the charges
    - when: otherwise
      method: the payer class's expected allowed percentage of the charges
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: ct_angiography_family_pricing
    effect: method
    decides: cta_method
    bindings:
    - cta_method
    baseline:
      cta_method: '0'
    ladder:
    - when: a Commercial PPO claim AND the CT angiography (71275) billed
      method: >-
        one per-code rate for scan and contrast: the lesser of the CT angiography's counted units x cta_fee_ppo and the
        scan-plus-contrast charges
    - when: a Commercial HMO claim
      method: >-
        scan at its counted units x cta_fee_hmo plus contrast at its millilitres x contrast_ml_hmo, each never above its own
        charges
    - when: otherwise
      method: the payer class's expected allowed percentage of the family's charges
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: diagnostic_campus_factor
    effect: parameter
    decides: dx_site
    bindings:
    - dx_site
    baseline:
      dx_site: '1'
    ladder:
    - when: the services were at Riverbend Lakeshore Hospital - Neenah
      value: dx_site_neenah
    - when: the services were at Riverbend Community Hospital - Chilton
      value: dx_site_cah
    - when: otherwise (services at Riverbend Regional Medical Center - Appleton)
      value: '1'
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: member_cost_share_netting
    effect: parameter
    decides: cost_share
    bindings:
    - cost_share
    baseline:
      cost_share: '0'
    ladder:
    - when: copay lines (PR-3) were released from the claim
      value: the total of the copay lines
    - when: no copay line but deductible or coinsurance lines (PR-1, PR-2) were released
      value: the total of those lines
    - when: otherwise (no cost-share line released)
      value: '0.00'
    evidence:
    - history
    cross_difficulty: null
