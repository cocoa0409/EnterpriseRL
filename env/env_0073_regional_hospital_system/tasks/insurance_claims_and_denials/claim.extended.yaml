  - claim_authorized_representative
  overwrite:
  - base_policy: claim_denial_write_off
    superseded_clause: >-
      A denied amount is written off by the hospital, never billed to the patient, when its route ends in a write-off: TIMELY_FILING_EXPIRED
      (no timely-filing proof), NO_AUTHORIZATION_OBTAINED (no authorization, notification, emergency exemption or retro authorization),
      NONCOVERED_NO_WAIVER (no advance waiver on file), APPEALS_EXHAUSTED (the last available level upheld the denial), or
      BELOW_APPEAL_THRESHOLD (a denied amount at or below small_denial_write_off_usd that is not worth appealing).
    replaced_by: >-
      For the services still open on a claim closed under this rule, and only for them, the claim's last route has ended and
      the amount written off as appeals exhausted is the close-out value rather than the denied amount; small items on Riverbend's
      outpatient-surgery small-item list, take-home convenience items, the services closed on the member's decision, small
      items on Riverbend's observation and emergency small-item list and self-administered drugs are written off under their
      own rules, and every other denied amount is written off in full by the hospital, never billed to the patient, when its
      route ends in a write-off: timely filing expired (no timely-filing proof), no authorization obtained (no authorization,
      notification, emergency exemption or retro authorization), non-covered with no waiver (no advance waiver on file), appeals
      exhausted (the last available level upheld the denial), or below the appeal threshold (a denied amount at or below the
      payer class's small-denial write-off amount that is not worth appealing).
