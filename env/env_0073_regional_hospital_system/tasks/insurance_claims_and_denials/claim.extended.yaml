- id: claim_ext_observation_small_item_closeout
  base_policy_refs:
  - claim_denial_write_off
  - claim_timely_filing
  - claim_denial_routing
  - claim_recoupment_and_overpayment
  overwrite:
  - base_policy: claim_denial_write_off
    superseded_clause: >-
      A denied amount is written off by the hospital, never billed to the patient, when its route ends in a write-off: TIMELY_FILING_EXPIRED
      (no timely-filing proof), NO_AUTHORIZATION_OBTAINED (no authorization, notification, emergency exemption or retro authorization),
      NONCOVERED_NO_WAIVER (no advance waiver on file), APPEALS_EXHAUSTED (the last available level upheld the denial), or
      BELOW_APPEAL_THRESHOLD (a denied amount at or below small_denial_write_off_usd that is not worth appealing).
    replaced_by: >-
      For the small items on Riverbend's observation and emergency small-item list that pass the small-item test on a claim
      closed under this rule, and only for them, the amount written off below the appeal threshold is the observation small-item
      value rather than their charges; small items on Riverbend's outpatient-surgery small-item list, take-home convenience
      items, the services closed on the member's decision, self-administered drugs and the services closed on the patient's
      external-review decision are written off under their own rules, and every other denied amount is written off in full
      by the hospital, never billed to the patient, when its route ends in a write-off: timely filing expired (no timely-filing
      proof), no authorization obtained (no authorization, notification, emergency exemption or retro authorization), non-covered
      with no waiver (no advance waiver on file), appeals exhausted (the last available level upheld the denial), or below
      the appeal threshold (a denied amount at or below the payer class's small-denial write-off amount that is not worth
      appealing).
  trigger: state_due
  subject:
  - claim_denial_written_off
  computes: amount_usd
  target_tool: write_off_observation_small_items_ab2aa651
  params:
    j2405_hmo: 1.65
    j2405_ppo: 1.9
    j1885_fee: 3.4
    j7050_hmo_hosp: 2.6
    j7050_ppo_cah: 2.25
    a4216_hmo: 1.1
    a4216_ppo: 1.35
    small_site_neenah: 0.9
    small_site_cah: 1.05
  rule: >-
    On a Commercial PPO, Commercial HMO or Marketplace claim in denied status for an Observation Stay Account or an Emergency
    Department Visit Account, this rule takes the small items that pass the small-item test off the claim as one write-off
    entry with the write-off reason BELOW_APPEAL_THRESHOLD, carrying the claim's current denial reason code; any other claim
    gets nothing here. Riverbend's observation and emergency small-item list is: ondansetron (code J2405 under revenue code
    0636), ketorolac (code J1885 under revenue code 0636), the intravenous solution (code J7050 under revenue code 0258) and
    the saline flush (code A4216 under revenue code 0270); each listed code is read from the account's charge postings by
    its charges. A listed code passes the small-item test when its charges on the account are above 0.00 and at or below the
    payer class's small-denial write-off amount; a listed code that does not pass stays with the claim's other denied services.
    The observation small-item value is the sum, over the codes that pass, of each code's charges multiplied by the payer
    class's expected allowed percentage of charges. The observation small-item value never exceeds what the payer has recovered
    on the claim, the total of its recovery entries; with no recovery entry on the claim it is 0.00. The observation small-item
    value is rounded to the nearest cent once, on the final total, and when it is 0.00 no entry is written. For the small
    items on Riverbend's observation and emergency small-item list that pass the small-item test on a claim closed under this
    rule, and only for them, the amount written off below the appeal threshold is the observation small-item value rather
    than their charges; small items on Riverbend's outpatient-surgery small-item list, take-home convenience items, the services
    closed on the member's decision, self-administered drugs and the services closed on the patient's external-review decision
    are written off under their own rules, and every other denied amount is written off in full by the hospital, never billed
    to the patient, when its route ends in a write-off: timely filing expired (no timely-filing proof), no authorization obtained
    (no authorization, notification, emergency exemption or retro authorization), non-covered with no waiver (no advance waiver
    on file), appeals exhausted (the last available level upheld the denial), or below the appeal threshold (a denied amount
    at or below the payer class's small-denial write-off amount that is not worth appealing). The small-item charges above
    the observation small-item value stay on the claim as the agreement's contractual remainder, which Riverbend's month-end
    contractual close posts on the last calendar day of the month. The observation small-item value is fixed only after the
    payer's recovery of its payment stands as a recovery entry on the claim. Each adjustment below either replaces the standard
    value of one listed code or multiplies the total; replacements are made first, each never above the billed charges of
    the lines it values (Riverbend's agreements pay the lesser of the scheduled amount and the billed charges), the multiplier
    after them, then the recovery limit, and the total is then rounded once. The ondansetron rate per counted unit is j2405_hmo
    on a Commercial HMO claim, j2405_ppo on a Commercial PPO claim, and otherwise its charges per counted unit times the payer
    class's expected allowed percentage; it is valued at its counted units times that rate, never above its charges, its counted
    units being its billed units, or one when it is billed with charges but no units. Ketorolac is valued at the lesser of
    its charges and its billed units (read from the account's charge postings) times j1885_fee when a Commercial HMO claim
    is for an Observation Stay Account, at its billed units times j1885_fee when a Commercial PPO claim is for an Emergency
    Department Visit Account, and at the payer class's expected allowed percentage of its charges otherwise. The intravenous
    solution rate per counted unit is j7050_hmo_hosp when a Commercial HMO claim is for services at a hospital campus (Riverbend
    Regional Medical Center - Appleton or Riverbend Lakeshore Hospital - Neenah), j7050_ppo_cah when a Commercial PPO claim
    is for services at Riverbend Community Hospital - Chilton, and otherwise its charges per counted unit times the payer
    class's expected allowed percentage; it is valued at its counted units times that rate, never above its charges, its counted
    units being its billed units, or one when it is billed with charges but no units. The saline flush rate per counted unit
    is a4216_hmo on a Commercial HMO claim, a4216_ppo on a Commercial PPO claim, and otherwise its charges per counted unit
    times the payer class's expected allowed percentage; it is valued at its counted units times that rate, never above its
    charges, its counted units being its billed units, or one when it is billed with charges but no units. The small-item
    campus factor, which multiplies the whole observation small-item value, is small_site_neenah for services at Riverbend
    Lakeshore Hospital - Neenah, small_site_cah for services at Riverbend Community Hospital - Chilton, and 1 otherwise.
  prerequisite:
  - problem: claim_ext_retrospective_denial_refund
    kind: value_input
    gate: recovered
    form: state
    condition: >-
      A payer recovery entry (reason code WO-72) stands on the claim whenever the payer's post-payment denial of an observation
      or emergency stay has been upheld on appeal and part of the payment is attributable to the services it reached.
    resolved_by: refund_payer_recovery_9b1903be
    effect: >-
      Once the recovery entry stands, the small-item value is no longer limited to 0.00 and the passing small items are written
      off.
    policy_source: >-
      The observation small-item value is fixed only after the payer's recovery of its payment stands as a recovery entry
      on the claim.
  cross_category:
  - category: encounter
    as: branch
    reads:
    - variant_name
    - facility
    - encounter_transactions.amount
    - encounter_transactions.units
    - encounter_transactions.revenue_code
    - encounter_transactions.cpt_hcpcs_code
    note: >-
      The domain, the small-item test, each listed code's value and the campus factor follow the hospital account's class,
      campus and charge postings.
  compute:
  - recovered: SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_takeback')
  - pct: P('expected_allowed_pct_of_charges') / 100
  - chg_J2405: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J2405')
  - units_J2405: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J2405')
  - pass_J2405: 1 if (chg_J2405 > 0 and chg_J2405 <= P('small_denial_write_off_usd')) else 0
  - chg_J1885: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J1885')
  - units_J1885: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='J1885')
  - pass_J1885: 1 if (chg_J1885 > 0 and chg_J1885 <= P('small_denial_write_off_usd')) else 0
  - chg_J7050: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0258', cpt_hcpcs_code='J7050')
  - units_J7050: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0258', cpt_hcpcs_code='J7050')
  - pass_J7050: 1 if (chg_J7050 > 0 and chg_J7050 <= P('small_denial_write_off_usd')) else 0
  - chg_A4216: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0270', cpt_hcpcs_code='A4216')
  - units_A4216: >-
