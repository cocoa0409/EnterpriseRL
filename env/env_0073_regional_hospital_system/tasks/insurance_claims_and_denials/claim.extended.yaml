      revenue_code='0274', cpt_hcpcs_code='A9273')
  - chg_A4467: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0274', cpt_hcpcs_code='A4467')
  - e0218_method: >-
      2 if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Surgery & Imaging Center - Grand
      Chute' else (1 if (CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Regional Medical Center
      - Appleton' or CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Lakeshore Hospital - Neenah')
      else 0)
  - a9273_qty_share: >-
      K('pack_share_4') if XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0274', cpt_hcpcs_code='A9273') >= 4 else (K('pack_share_2') if XSUM('encounter', 'encounter_transactions',
      'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='A9273')
      >= 2 else 1)
  - a4467_qty_share: >-
      K('garment_share_3') if XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0274', cpt_hcpcs_code='A4467') >= 3 else (K('garment_share_2') if XSUM('encounter', 'encounter_transactions',
      'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='A4467')
      >= 2 else 1)
  - kit_share: >-
      K('kit_share_full') if ((1 if XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='E0218') > 0 else 0) + (1 if XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='A9273')
      > 0 else 0) + (1 if XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0274', cpt_hcpcs_code='A4467') > 0 else 0)) >= 3 else (K('kit_share_pair') if ((1 if XSUM('encounter',
      'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0274',
      cpt_hcpcs_code='E0218') > 0 else 0) + (1 if XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='A9273') > 0 else 0) + (1 if XSUM('encounter', 'encounter_transactions',
      'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0274', cpt_hcpcs_code='A4467')
      > 0 else 0)) == 2 else 1)
  - val_E0218: >-
      MN(chg_E0218, units_E0218 * K('takehome_E0218_asc')) if e0218_method == 2 else (MN(chg_E0218, chg_E0218 * K('takehome_share_hosp')
      + lines_E0218 * K('takehome_fee_hosp')) if e0218_method == 1 else chg_E0218)
  - val_A9273: chg_A9273 * a9273_qty_share
  - val_A4467: chg_A4467 * a4467_qty_share
  - waiver_release: >-
      XCOUNT('encounter', 'encounter_transactions', event_type='encounter_liability_posted', encounter_id=F('encounter_id'),
      liability_source='NONCOVERED_SERVICE')
  - nc_gate: >-
      1 if ((F('variant_name') == 'Commercial PPO Claim' or F('variant_name') == 'Commercial HMO Claim' or F('variant_name')
      == 'Marketplace Exchange Plan Claim') and CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id')) == 'Outpatient
      Surgery Account' and F('status') == 'denied' and waiver_release == 0) else 0
  - result: RND((val_E0218 + val_A9273 + val_A4467) * kit_share * nc_gate, 2)
