  - small_gate: >-
      1 if ((F('variant_name') == 'Commercial PPO Claim' or F('variant_name') == 'Commercial HMO Claim' or F('variant_name')
      == 'Marketplace Exchange Plan Claim') and CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id')) == 'Outpatient
      Surgery Account' and F('status') == 'denied') else 0
  - result: RND(MX(0, MN(small_value, recovered)) * small_gate, 2)
