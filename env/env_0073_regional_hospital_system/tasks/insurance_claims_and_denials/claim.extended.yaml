  - ua_rate: >-
      K('ua_ppo') if F('variant_name') == 'Commercial PPO Claim' else (K('ua_hmo') if F('variant_name') == 'Commercial HMO
      Claim' else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300', cpt_hcpcs_code='81001')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0300', cpt_hcpcs_code='81001'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - cxr_rate: >-
      K('cxr_ppo') if F('variant_name') == 'Commercial PPO Claim' else (K('cxr_hmo') if F('variant_name') == 'Commercial HMO
      Claim' else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0324', cpt_hcpcs_code='71046')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
