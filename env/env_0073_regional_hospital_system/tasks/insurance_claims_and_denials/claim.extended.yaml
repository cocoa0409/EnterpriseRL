    - encounter_transactions.cpt_hcpcs_code
    note: >-
      The domain, the echocardiogram fee and every test value follow the hospital account's class, campus and charge postings.
  compute:
  - payments_received: SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_payment_posted')
  - earlier_recoveries: SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_takeback')
  - net_payment: payments_received - earlier_recoveries
  - pct: P('expected_allowed_pct_of_charges') / 100
  - echo_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0483', cpt_hcpcs_code='93306')
  - echo_units: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0483', cpt_hcpcs_code='93306')
  - ecg_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0730', cpt_hcpcs_code='93005')
  - ecg_units: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0730', cpt_hcpcs_code='93005')
  - cta_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0350', cpt_hcpcs_code='71275')
  - cta_units: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0350', cpt_hcpcs_code='71275')
  - contrast_charges: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='Q9967')
  - contrast_units: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0636', cpt_hcpcs_code='Q9967')
  - chg_84484: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300', cpt_hcpcs_code='84484')
  - units_84484: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300', cpt_hcpcs_code='84484')
  - chg_85025: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300', cpt_hcpcs_code='85025')
  - units_85025: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300', cpt_hcpcs_code='85025')
  - chg_80053: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300', cpt_hcpcs_code='80053')
  - units_80053: >-
      XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300', cpt_hcpcs_code='80053')
  - other_retained: >-
      XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0483') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0730') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0300') + XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0350') - echo_charges - ecg_charges - cta_charges - chg_84484 - chg_85025 - chg_80053
  - echo_rate: >-
      K('echo_hmo_hosp') if (F('variant_name') == 'Commercial HMO Claim' and (CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Regional Medical Center - Appleton' or CFIELD('encounter', 'facility', encounter_id=F('encounter_id'))
      == 'Riverbend Lakeshore Hospital - Neenah')) else (K('echo_ppo_hosp') if (F('variant_name') == 'Commercial PPO Claim'
      and (CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Regional Medical Center - Appleton'
      or CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Lakeshore Hospital - Neenah')) else
      ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0483', cpt_hcpcs_code='93306')) / MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0483', cpt_hcpcs_code='93306'), 1) * P('expected_allowed_pct_of_charges')
      / 100))
  - ecg_counted: >-
      XCOUNT('encounter', 'encounter_transactions', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0730', cpt_hcpcs_code='93005') if F('variant_name') == 'Commercial HMO Claim' else (MN(MX(XSUM('encounter',
      'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0730',
      cpt_hcpcs_code='93005'), 1), K('ecg_cap_per_line') * XCOUNT('encounter', 'encounter_transactions', event_type='encounter_charge_posted',
      encounter_id=F('encounter_id'), revenue_code='0730', cpt_hcpcs_code='93005')) if F('variant_name') == 'Commercial PPO
      Claim' else MX(XSUM('encounter', 'encounter_transactions', 'units', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
      revenue_code='0730', cpt_hcpcs_code='93005'), 1))
  - lab_method: >-
      2 if (F('variant_name') == 'Commercial HMO Claim' and CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id'))
      == 'Observation Stay Account') else (1 if (F('variant_name') == 'Commercial PPO Claim' and CFIELD('encounter', 'variant_name',
      encounter_id=F('encounter_id')) == 'Observation Stay Account') else 0)
  - cta_method: >-
      2 if F('variant_name') == 'Commercial HMO Claim' else (1 if (F('variant_name') == 'Commercial PPO Claim' and XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'), revenue_code='0350', cpt_hcpcs_code='71275') > 0) else 0)
  - dx_site: >-
      K('dx_site_neenah') if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Lakeshore Hospital - Neenah' else (K('dx_site_cah') if CFIELD('encounter', 'facility', encounter_id=F('encounter_id')) == 'Riverbend Community Hospital - Chilton' else 1)
  - cost_share: >-
      SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_patient_resp_transferred', carc_code='PR-3')
      if SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_patient_resp_transferred', carc_code='PR-3')
      > 0 else ((SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_patient_resp_transferred',
      carc_code='PR-1') + SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_patient_resp_transferred',
      carc_code='PR-2')) if (SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_patient_resp_transferred',
      carc_code='PR-1') + SUM('claim_transactions', 'amount', date_field='posting_date', event_type='claim_patient_resp_transferred',
      carc_code='PR-2')) > 0 else 0)
  - ecg_value: MN(ecg_charges, ecg_counted * ecg_charges / MX(ecg_units, 1) * pct)
  - sched_84484: units_84484 * K('clfs_84484') * (K('clfs_mult_hmo') if lab_method == 2 else K('clfs_mult_ppo'))
  - sched_85025: units_85025 * K('clfs_85025') * (K('clfs_mult_hmo') if lab_method == 2 else K('clfs_mult_ppo'))
  - sched_80053: units_80053 * K('clfs_80053') * (K('clfs_mult_hmo') if lab_method == 2 else K('clfs_mult_ppo'))
  - lab_value: >-
      MN(chg_84484 + chg_85025 + chg_80053, (sched_84484 + sched_85025 + sched_80053) if lab_method == 2 else ((MN(sched_84484,
      chg_84484) + MN(sched_85025, chg_85025) + MN(sched_80053, chg_80053)) if lab_method == 1 else (chg_84484 + chg_85025
      + chg_80053) * pct))
  - ct_family_value: >-
      (MN(cta_charges, MX(cta_units, 1) * K('cta_fee_hmo')) + (MN(contrast_charges, contrast_units * K('contrast_ml_hmo'))
      if contrast_units > 0 else contrast_charges * pct)) if cta_method == 2 else (MN(cta_charges + contrast_charges, MX(cta_units,
      1) * K('cta_fee_ppo')) if cta_method == 1 else (cta_charges + contrast_charges) * pct)
  - retained_value: >-
      MN(echo_charges + ecg_charges + chg_84484 + chg_85025 + chg_80053 + cta_charges + contrast_charges + other_retained,
      (MN(echo_charges, MX(echo_units, 1) * echo_rate) + ecg_value + lab_value + ct_family_value + other_retained * pct) * dx_site)
  - retained_payment: MX(0, retained_value - cost_share)
  - refund_gate: >-
      1 if ((F('variant_name') == 'Commercial PPO Claim' or F('variant_name') == 'Commercial HMO Claim' or F('variant_name')
      == 'Marketplace Exchange Plan Claim') and (CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id')) == 'Observation
      Stay Account' or CFIELD('encounter', 'variant_name', encounter_id=F('encounter_id')) == 'Emergency Department Visit
      Account') and F('status') == 'denied' and COUNT('claim_transactions', date_field='posting_date', event_type='claim_appeal_filed')
      >= 1) else 0
  - result: RND(MX(0, net_payment - retained_payment) * refund_gate, 2)
