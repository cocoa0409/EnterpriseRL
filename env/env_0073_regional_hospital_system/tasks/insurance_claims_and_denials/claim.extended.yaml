  factors:
  - id: observation_antiemetic_unit_rate
    effect: parameter
    decides: j2405_rate
    bindings:
    - j2405_rate
    baseline:
      j2405_rate: chg_J2405 / MX(units_J2405, 1) * pct
    ladder:
    - when: a Commercial HMO claim
      value: j2405_hmo
    - when: a Commercial PPO claim
      value: j2405_ppo
    - when: otherwise (a Marketplace claim)
      value: charges per counted unit x expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: ketorolac_pricing
    effect: method
    decides: j1885_method
    bindings:
    - j1885_method
    baseline:
      j1885_method: '0'
    ladder:
    - when: a Commercial HMO claim AND an Observation Stay Account
      method: lesser of the charges and billed units x j1885_fee
    - when: a Commercial PPO claim AND an Emergency Department Visit Account
      method: billed units x j1885_fee
    - when: otherwise
      method: expected allowed percentage of the charges
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: observation_iv_solution_unit_rate
    effect: parameter
    decides: j7050_rate
    bindings:
    - j7050_rate
    baseline:
      j7050_rate: chg_J7050 / MX(units_J7050, 1) * pct
    ladder:
    - when: >-
        a Commercial HMO claim AND the services were at a hospital campus (Riverbend Regional Medical Center - Appleton or
        Riverbend Lakeshore Hospital - Neenah)
      value: j7050_hmo_hosp
    - when: a Commercial PPO claim AND the services were at Riverbend Community Hospital - Chilton
      value: j7050_ppo_cah
    - when: otherwise
      value: charges per counted unit x expected allowed percentage
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: encounter
  - id: saline_flush_unit_rate
    effect: parameter
    decides: a4216_rate
    bindings:
    - a4216_rate
    baseline:
