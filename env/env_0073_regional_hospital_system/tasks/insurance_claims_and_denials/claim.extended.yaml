  - ecg_rate: >-
      K('ecg_ppo') if F('variant_name') == 'Commercial PPO Claim' else (K('ecg_hmo') if F('variant_name') == 'Commercial HMO
      Claim' else ((XSUM('encounter', 'encounter_transactions', 'amount', event_type='encounter_charge_posted', encounter_id=F('encounter_id'),
