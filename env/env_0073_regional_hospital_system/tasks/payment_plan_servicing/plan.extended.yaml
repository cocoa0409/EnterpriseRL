  factors:
  - id: lowering_share
    effect: parameter
    decides: share
    bindings:
    - ls_fpl
    - share
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose min_requested_installment_pct_of_computed is above share_low_income
      value: K('share_low_income')
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose min_requested_installment_pct_of_computed
        is above share_partial
      value: K('share_partial')
    - when: otherwise
      value: P('min_requested_installment_pct_of_computed')
    baseline:
      share: P('min_requested_installment_pct_of_computed')
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: lowering_floor
    effect: parameter
    decides: lfloor
    bindings:
    - lf_fpl
    - lfloor
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose min_monthly_payment_usd is above floor_low_income
      value: K('floor_low_income')
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose min_monthly_payment_usd is above
        floor_partial
      value: K('floor_partial')
    - when: otherwise
      value: P('min_monthly_payment_usd')
    baseline:
      lfloor: P('min_monthly_payment_usd')
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: lowered_term_limit
    effect: parameter
    decides: limit
    bindings:
    - lt_fpl
    - limit
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose max_term_months is shorter than term_low_income
      value: K('term_low_income')
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose max_term_months is shorter than
        term_partial
      value: K('term_partial')
    - when: otherwise
      value: P('max_term_months')
    baseline:
      limit: P('max_term_months')
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: waiting_installments
    effect: method
    decides: waited
    bindings:
    - receipt
    - aw_status
    - aw_docs_due
    - waited
    ladder:
    - when: open case in pending_documents status
      method: >-
        count the due dates after the receipt date that have come by the earlier of the handling date and the documents due date (whole months from the
        first due date to that date, less whole months from the first due date to the receipt date, the latter never below minus one; never below 0)
    - when: open case in submitted status
      method: >-
        count by elapsed time: one installment for each full full_period_days days from the receipt date to the handling date
    - when: otherwise
      method: none
    baseline:
      waited: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: assist
  baseline:
    rule: >-
      A patient may lower the installment on their own plan by signing an installment change; the lowered installment applies from the next installment
      and the schedule lengthens to carry the plan balance. As standard, the lowest installment a patient may set is the largest of three figures, each
      rounded half-up to the cent, and never more than the current installment: the lowering share (the tier's min_requested_installment_pct_of_computed)
      of the current installment, which is the installment computed at the plan's last recomputation; the lowering floor (the tier's min_monthly_payment_usd);
      and the plan balance divided by the longest schedule the change may reach, the plan balance being read from the plan's own ledger as the amounts enrolled
      less the installments paid and the reductions booked. The longest schedule the change may reach is the smaller of the lengthened schedule and the
      term-limit schedule, and at least one installment: the lengthened schedule is the remaining schedule as last computed, that plan balance divided by
      the current installment and rounded up to a whole installment, plus the tier's add_on_term_extension_months, and the term-limit schedule is the term
      limit (the tier's max_term_months as standard) less the installment payment entries numbered 1 or more.
    params:
    - min_requested_installment_pct_of_computed
    - min_monthly_payment_usd
    - max_term_months
    - add_on_term_extension_months
  inputs:
    history:
    - table: plan_transactions
      aggregate: count
      field: plan_txn_id
      filters:
        event_type: plan_installment_paid
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plan_balance_enrolled
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plan_installment_paid
    cross_category:
    - assist
- id: plan_ext_offer_refigure
  base_policy_refs:
  - plan_tier_and_installment
  - plan_add_on_balances
  - plan_balance_reduction
  - plan_patient_changes
  - plan_signature_and_activation
  overwrite:
  - base_policy: plan_tier_and_installment
    superseded_clause: >-
      The down payment is down_payment_pct of the enrolled total, rounded half-up to the cent, due at signing.
    replaced_by: >-
      When an offer not yet signed is re-figured under this rule, the down payment deducted to reach the financed amount is the share this rule gives of
      the re-figure balance; at a plan's creation the down payment is still down_payment_pct of the enrolled total, rounded half-up to the cent, and the
      down payment collected at signing is the one the signing rule sets.
  - base_policy: plan_tier_and_installment
    superseded_clause: >-
      The term is the number of monthly installments the patient asks for, never more than max_term_months; when the patient states no term, max_term_months
      is used.
    replaced_by: >-
      When an offer not yet signed is re-figured under this rule, an offer carrying the tier's max_term_months is figured over the term this rule uses and
      booked with the term this rule books; at a plan's creation the term is still the number of monthly installments the patient asks for, never more than
      max_term_months, and max_term_months when the patient states no term.
  - base_policy: plan_tier_and_installment
    superseded_clause: >-
      The installment is the financed amount (enrolled total less the down payment) divided by the term, rounded half-up to the cent, but never below min_monthly_payment_usd;
      when the floor applies, the schedule has as many installments as the floor needs, and in every case the final installment absorbs the remainder.
    replaced_by: >-
      When an offer not yet signed is re-figured under this rule, its installment is the financed amount this rule figures divided by the term it uses,
      rounded half-up to the cent, never below the offer floor, and when the offer floor applies the offer is booked with as many installments as that floor
      needs, the financed amount divided by the offer floor and rounded up to a whole installment; at a plan's creation the installment is still the financed
      amount (enrolled total less the down payment) divided by the term, rounded half-up to the cent, but never below min_monthly_payment_usd, and when
      that floor applies the schedule has as many installments as the floor needs; in every case the final installment absorbs the remainder.
  - base_policy: plan_balance_reduction
    superseded_clause: >-
      A reduction never changes the installment amount; it shortens the remaining schedule, and the final installment absorbs the remainder.
    replaced_by: >-
      On an offer not yet signed a reduction is taken into the installment when the offer is re-figured under this rule; on a signed plan a reduction still
      never changes the installment amount, it shortens the remaining schedule, and the final installment absorbs the remainder.
  trigger: state_due
  subject:
  - plan_terms_modified
  computes: monthly_payment_usd
  target_tool: refigure_plan_offer_04613189
  params:
    fpl_low_income_max: 200.0
    fpl_partial_max: 400.0
    down_partial: 5.0
    term_low_income: 60
    term_partial: 48
    band_term_high: 60
    band_term_mid: 48
    band_balance_high: 10000.0
    band_balance_mid: 3000.0
    floor_low_income: 10.0
    floor_partial: 20.0
  rule: >-
    An offer the patient has not yet signed (pending_signature) is re-figured on the balance it carries when that balance has changed since the offer was
    made, an add-on enrolled on the offer included; a signed plan is never re-figured under this rule. As standard, the re-figure balance is the enrolled
    total, the down payment deducted is the deducted down-payment share (the tier's down_payment_pct as standard) of the re-figure balance, rounded half-up
    to the cent, the financed amount is the re-figure balance less that deduction, the term used is the offer's term_months, and the installment is the
    financed amount divided by the term used, rounded half-up to the cent, never below the offer floor, which is the tier's min_monthly_payment_usd as standard;
    the offer is then booked with that installment and the term used, except that when the offer floor applies it is booked with as many installments as
    that floor needs, the financed amount divided by the offer floor and rounded up to a whole installment. The adjustments set out below are applied in
    this order: the re-figure balance and the share deducted from it are settled first and the deduction is taken from the balance, the term used is the
    shorter of the terms allowed, and the offer floor is applied last to the divided figure. A financial assistance application of the patient is open when
    one of the patient's financial assistance cases stands in submitted or pending_documents status, a submitted case being taken first. The re-figure balance
    follows what has happened to the enrolled accounts: when the first of the patient's accounts listed on a charge-dispute billing hold is an account enrolled
    on the offer, it is the enrolled total less the amount enrolled for that account, which leaves the offer while the dispute is open; when that does not
    apply and reductions have been booked on the offer, it is the offer's ledger balance, the amounts enrolled less the reductions booked; otherwise it
    is the enrolled total. The deducted down-payment share follows the open application's screening: none for a household screened at or below fpl_low_income_max
    percent of the federal poverty level and down_partial percent for one screened above fpl_low_income_max and at or below fpl_partial_max percent, each
    only on tiers whose down_payment_pct is higher; otherwise it is the tier's down_payment_pct. An offer that carries the tier's max_term_months, the patient
    having asked for no shorter term, runs longer for an applicant up to the offer's screening term: term_low_income installments for a household screened
    at or below fpl_low_income_max percent of the federal poverty level and term_partial installments for one screened above fpl_low_income_max and at or
    below fpl_partial_max percent, each only on tiers whose max_term_months is shorter; otherwise the screening term is the offer's term_months. An offer
    that carries the tier's max_term_months runs only as long as the offer's balance term allows, Riverbend's term schedule by balance read from the offer's
    ledger as the amounts enrolled less the reductions booked: band_term_high installments when that balance is at least band_balance_high and band_term_mid
    installments when it is at least band_balance_mid, the first of these that applies, each only on tiers whose max_term_months is shorter and only for
    an offer carrying the tier's max_term_months; otherwise the balance term is the offer's term_months. The offer floor follows the open application's
    screening: floor_low_income dollars for a household screened at or below fpl_low_income_max percent of the federal poverty level and floor_partial dollars
    for one screened above fpl_low_income_max and at or below fpl_partial_max percent, each only on tiers whose min_monthly_payment_usd is higher; otherwise
    it is the tier's min_monthly_payment_usd. When an offer not yet signed is re-figured under this rule, the down payment deducted to reach the financed
    amount is the share this rule gives of the re-figure balance; at a plan's creation the down payment is still down_payment_pct of the enrolled total,
    rounded half-up to the cent, and the down payment collected at signing is the one the signing rule sets. When an offer not yet signed is re-figured
    under this rule, an offer carrying the tier's max_term_months is figured over the term this rule uses and booked with the term this rule books; at a
    plan's creation the term is still the number of monthly installments the patient asks for, never more than max_term_months, and max_term_months when
    the patient states no term. When an offer not yet signed is re-figured under this rule, its installment is the financed amount this rule figures divided
    by the term it uses, rounded half-up to the cent, never below the offer floor, and when the offer floor applies the offer is booked with as many installments
    as that floor needs, the financed amount divided by the offer floor and rounded up to a whole installment; at a plan's creation the installment is still
    the financed amount (enrolled total less the down payment) divided by the term, rounded half-up to the cent, but never below min_monthly_payment_usd,
    and when that floor applies the schedule has as many installments as the floor needs; in every case the final installment absorbs the remainder. On
    an offer not yet signed a reduction is taken into the installment when the offer is re-figured under this rule; on a signed plan a reduction still never
    changes the installment amount, it shortens the remaining schedule, and the final installment absorbs the remainder.
  prerequisite: []
  cross_category:
  - category: assist
    as: branch
    reads:
    - status
    - household_fpl_pct
    note: >-
      The open application's screening decides the deducted down-payment share, the screening term and the offer floor.
  - category: encounter
    as: branch
    reads:
    - billing_hold_reason
    note: A charge-dispute hold on an enrolled account decides the re-figure balance.
  compute:
  - case_submitted: CFIELD('assist', 'fap_case_id', status='submitted')
  - case_pending: CFIELD('assist', 'fap_case_id', status='pending_documents')
  - open_case: case_submitted if case_submitted != None else case_pending
  - rf_bh: CFIELD('encounter', 'encounter_id', billing_hold_reason='CHARGE_DISPUTE')
  - rf_bhe: >-
      SUM('plan_transactions', 'amount', event_type='plan_balance_enrolled', encounter_id=rf_bh) if rf_bh != None else 0
  - rf_br: SUM('plan_transactions', 'amount', event_type='plan_balance_reduced')
  - rf_bt: SUM('plan_transactions', 'amount', event_type='plan_balance_enrolled')
  - rf_basis: (rf_bt - rf_bhe) if rf_bhe > 0 else ((rf_bt - rf_br) if rf_br > 0 else rf_bt)
  - dd_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - dd_pct: >-
      0 if (open_case != None and dd_fpl != None and dd_fpl <= K('fpl_low_income_max') and P('down_payment_pct') > 0) else (K('down_partial') if (open_case
      != None and dd_fpl != None and dd_fpl > K('fpl_low_income_max') and dd_fpl <= K('fpl_partial_max') and P('down_payment_pct') > K('down_partial'))
      else P('down_payment_pct'))
  - tf_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - tf_term: >-
      K('term_low_income') if (open_case != None and tf_fpl != None and tf_fpl <= K('fpl_low_income_max') and P('max_term_months') < K('term_low_income')
      and F('term_months') == P('max_term_months')) else (K('term_partial') if (open_case != None and tf_fpl != None and tf_fpl > K('fpl_low_income_max')
      and tf_fpl <= K('fpl_partial_max') and P('max_term_months') < K('term_partial') and F('term_months') == P('max_term_months')) else F('term_months'))
  - tb_bal: >-
      SUM('plan_transactions', 'amount', event_type='plan_balance_enrolled') - SUM('plan_transactions', 'amount', event_type='plan_balance_reduced')
  - tb_term: >-
      K('band_term_high') if (tb_bal >= K('band_balance_high') and P('max_term_months') < K('band_term_high') and F('term_months') == P('max_term_months'))
      else (K('band_term_mid') if (tb_bal >= K('band_balance_mid') and P('max_term_months') < K('band_term_mid') and F('term_months') == P('max_term_months'))
      else F('term_months'))
  - of_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - ofloor: >-
      K('floor_low_income') if (open_case != None and of_fpl != None and of_fpl <= K('fpl_low_income_max') and P('min_monthly_payment_usd') > K('floor_low_income'))
      else (K('floor_partial') if (open_case != None and of_fpl != None and of_fpl > K('fpl_low_income_max') and of_fpl <= K('fpl_partial_max') and P('min_monthly_payment_usd')
      > K('floor_partial')) else P('min_monthly_payment_usd'))
  - financed: rf_basis - RND(rf_basis * dd_pct / 100 + 0.000001, 2)
  - term_used: MN(tf_term, tb_term)
  - term_booked: >-
      -int(-financed // ofloor) if (ofloor > 0 and RND(financed / term_used + 0.000001, 2) < ofloor) else term_used
  - result: MX(ofloor, RND(financed / term_used + 0.000001, 2))
