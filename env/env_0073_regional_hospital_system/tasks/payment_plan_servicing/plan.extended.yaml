      value: '0'
    baseline:
      cls: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: encounter
  - id: installments_paid_count
    effect: method
    decides: paid
    bindings:
    - pd_no
    - pd_part_sum
    - pd_part_n
    - pd_all
    - pd_total
    - paid
    ladder:
    - when: >-
        the entries numbered as the highest installment number among the entries total less than the current installment (partial payments)
      method: count the entries numbered 1 or more, less those partial entries
    - when: >-
