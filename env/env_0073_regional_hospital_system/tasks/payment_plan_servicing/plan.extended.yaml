    - cl_enc
    - cl_var
    - cls
    ladder:
    - when: the latest add-on enrollment entry's account is a Recurring Outpatient Therapy Account
      value: K('class_series')
    - when: it is an Inpatient Admission Account or an Observation Stay Account
      value: K('class_acute')
