# ---- data flow (every write is an event) ----
events:
  - type: plan_created
    target: payment_plans
    mutation: create
    meaning: A payment plan is set up on the patient's eligible balances and the agreement is offered for signature.
    grain: one row per plan offered
    fields: {plan_id: new plan id, customer_id: the patient, variant_name: plan tier, offered_date: creation date, due_day_of_month: chosen due day, first_due_date: due date of installment 1, next_due_date: same as first_due_date, term_months: installments in the schedule, monthly_payment_usd: computed installment, down_payment_usd: down payment due at signing, autopay_method: autopay chosen, missed_installments: "0", reage_count: "0", reinstatement_count: "0", terms_change_count: "0"}
    triggers: []
  - type: plan_balance_enrolled
    target: plan_transactions
    meaning: One encounter's patient balance is enrolled in the plan (at creation or as an add-on).
    grain: one row per encounter enrolled per enrollment date
    distinguish_by: [encounter_id, posting_date]
    fields: {encounter_id: enrolled account, amount: balance enrolled, posting_date: enrollment date}
    account: plan_balance
    direction: in
    triggers: []
  - type: plan_installment_paid
    target: plan_transactions
    meaning: An installment (or the down payment) is paid on the plan.
    grain: one row per installment payment confirmation
    distinguish_by: [installment_number, payment_reference]
    fields: {installment_number: installment paid (0 = down payment), due_date: installment due date, payment_reference: confirmation number, plan_payment_channel: how paid, amount: amount paid, posting_date: posting date}
    account: plan_balance
    direction: out
    triggers:
      - event: encounter:encounter_payment_posted
        map: {payment_channel: PAYMENT_PLAN_INSTALLMENT, payment_reference: payment_reference, amount: amount, posting_date: posting_date}
  - type: plan_balance_reduced
    target: plan_transactions
    meaning: An enrolled balance is reduced because the underlying account was adjusted or withdrawn.
    grain: one row per encounter per reduction reason per posting date
    distinguish_by: [encounter_id, reduction_reason, posting_date]
    fields: {encounter_id: enrolled account adjusted, reduction_reason: why reduced, amount: reduction, posting_date: posting date}
    account: plan_balance
    direction: out
    triggers: []
  - type: plan_terms_modified
    target: payment_plans
    mutation: update
    meaning: The installment schedule is recomputed or changed (add-on, reduction, patient-requested change, skip).
    grain: one row per transaction
    fields: {monthly_payment_usd: new installment, term_months: new schedule length, next_due_date: next due date, due_day_of_month: due day, terms_change_count: patient-requested changes used, skip_count: skips used, autopay_method: autopay on file}
    triggers: []
  - type: plan_signed
    target: payment_plans
    mutation: {transition: {from: pending_signature, to: active}}
    meaning: The patient signs the agreement and the plan starts.
    grain: one row per transaction
    fields: {status: active, signed_date: signature date, autopay_method: autopay authorized at signing}
    triggers: []
  - type: plan_offer_lapsed
    target: payment_plans
    mutation: {transition: {from: pending_signature, to: cancelled}}
    meaning: The signature deadline passes without a signature.
    grain: one row per transaction
    fields: {status: cancelled, closed_date: lapse date}
    triggers: []
  - type: plan_installment_missed
    target: payment_plans
    mutation: {transition: {from: active, to: past_due}}
    meaning: An installment is unpaid past its grace days.
    grain: one row per transaction
    fields: {status: past_due, missed_installments: consecutive missed count}
    triggers: []
  - type: plan_brought_current
    target: payment_plans
    mutation: {transition: {from: past_due, to: active}}
    meaning: The patient pays every missed installment.
    grain: one row per transaction
    fields: {status: active, missed_installments: reset to 0, next_due_date: next unpaid due date}
    triggers: []
  - type: plan_reaged
    target: payment_plans
    mutation: {transition: {from: past_due, to: active}}
    meaning: A representative re-ages a past-due plan, moving the missed amount to the end of the term.
    grain: one row per transaction
    fields: {status: active, missed_installments: reset to 0, reage_count: re-ages used including this one, term_months: schedule extended by the missed installments, next_due_date: next due date after the re-age}
    triggers: []
  - type: plan_defaulted
    target: payment_plans
    mutation: {transition: {from: past_due, to: defaulted}}
    meaning: The plan defaults at the missed-installment limit.
    grain: one row per transaction
    fields: {status: defaulted, default_date: default date}
    triggers: []
  - type: plan_reinstated
    target: payment_plans
    mutation: {transition: {from: defaulted, to: active}}
    meaning: A defaulted plan is reinstated after the catch-up payment.
    grain: one row per transaction
    fields: {status: active, missed_installments: reset to 0, reinstatement_count: reinstatements used including this one, next_due_date: next due date}
    triggers: []
  - type: plan_paid_off
    target: payment_plans
    mutation: {transition: [{from: active, to: paid_off}, {from: past_due, to: paid_off}]}
    meaning: The plan balance reaches zero.
    grain: one row per transaction
    fields: {status: paid_off, closed_date: payoff date, next_due_date: cleared}
    triggers: []
  - type: plan_cancelled_by_patient
    target: payment_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The patient cancels an active plan.
    grain: one row per transaction
    fields: {status: cancelled, closed_date: cancellation date, next_due_date: cleared}
    triggers: []

# ---- derived measures ----
measures:
  - id: plan_msr_installments_paid
    window: the life of the plan up to the decision date
    measure: count of plan_installment_paid rows with installment_number of 1 or more on the plan
  - id: plan_msr_add_ons_12m
    window: rolling 12 months ending on the decision date (from the same calendar date one year earlier, inclusive)
    measure: count of distinct posting dates of plan_balance_enrolled rows on the plan that are later than the plan's offered_date

# ---- policies ----
policies:
  - id: plan_agg_multi_holding
    subject: [plan_created]
    rule: >-
      A patient holds at most one open payment plan — one plan in pending_signature, active or past_due status — at a time (max_open_plans); paid_off, cancelled and defaulted plans remain on the profile as history. Every eligible balance the patient wants on a plan goes into that one plan, either at creation or as an add-on. A new plan cannot be created while another plan of the patient is open; to restructure, the patient first cancels the open plan, and its remaining balance is then enrolled with the other balances in the new plan.
    eligibility: []
    params: {max_per_customer: 1, max_open_plans: "=max_open_plans"}
  - id: plan_tier_and_installment
    subject: [plan_created, plan_terms_modified]
    rule: >-
      The tier of a new plan is fixed by the total balance enrolled at creation, using each tier's min_enrolled_balance_usd and max_enrolled_balance_usd. Two tiers override the balance bands. The Riverbend Assistance-Linked Payment Plan applies when, on the creation date, the patient holds a financial assistance award in approved status at a partial-discount tier (80%, 60% or 40% charity discount, or medical hardship). The Riverbend Hardship Payment Plan applies when the patient documents a loss of household income of at least hardship_income_loss_pct in the last 6 months, or when the enrolled total exceeds hardship_balance_threshold_usd; when both override tiers apply, the hardship tier is used. The down payment is down_payment_pct of the enrolled total, rounded half-up to the cent, due at signing. The term is the number of monthly installments the patient asks for, never more than max_term_months; when the patient states no term, max_term_months is used. The installment is the financed amount (enrolled total less the down payment) divided by the term, rounded half-up to the cent, but never below min_monthly_payment_usd; when the floor applies, the schedule has as many installments as the floor needs, and in every case the final installment absorbs the remainder. Installments fall due on the due day the patient picks from due_day_options; the first due date is the first such day at least first_due_days_after_signing calendar days after the signing date. Riverbend plans carry no interest, setup fee, late fee, returned-payment fee or early-payoff penalty (interest_rate_pct, setup_fee_usd, late_fee_usd, returned_payment_fee_usd, early_payoff_penalty_usd). Where autopay_required is true the plan is created only with an ACH or card autopay method.
    eligibility:
      - id: assistance_award_for_linked_tier
        applies_to: [plan_created]
        kind: authorization
        condition: The Riverbend Assistance-Linked Payment Plan applies when, on the creation date, the patient holds a financial assistance award in approved status at a partial-discount tier (80%, 60% or 40% charity discount, or medical hardship).
        evidence_fields: [assistance_cases.status, assistance_cases.variant_name, assistance_cases.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[assistance_cases.customer_id]]
          action_bindings: {assistance_cases.customer_id: customer_id}
    params:
      per_tier:
        "Riverbend Short-Term Payment Plan": {min_balance: "=min_enrolled_balance_usd", max_balance: "=max_enrolled_balance_usd", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", down_pct: "=down_payment_pct", autopay_required: "=autopay_required", first_due_gap_days: "=first_due_days_after_signing"}
        "Riverbend Standard Payment Plan": {min_balance: "=min_enrolled_balance_usd", max_balance: "=max_enrolled_balance_usd", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", down_pct: "=down_payment_pct", autopay_required: "=autopay_required", first_due_gap_days: "=first_due_days_after_signing"}
        "Riverbend Extended Payment Plan": {min_balance: "=min_enrolled_balance_usd", max_balance: "=max_enrolled_balance_usd", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", down_pct: "=down_payment_pct", autopay_required: "=autopay_required", first_due_gap_days: "=first_due_days_after_signing"}
        "Riverbend Long-Term Payment Plan": {min_balance: "=min_enrolled_balance_usd", max_balance: "=max_enrolled_balance_usd", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", down_pct: "=down_payment_pct", autopay_required: "=autopay_required", first_due_gap_days: "=first_due_days_after_signing"}
        "Riverbend Assistance-Linked Payment Plan": {min_balance: "=min_enrolled_balance_usd", max_balance: "=max_enrolled_balance_usd", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", down_pct: "=down_payment_pct", autopay_required: "=autopay_required", first_due_gap_days: "=first_due_days_after_signing"}
        "Riverbend Hardship Payment Plan": {min_balance: "=min_enrolled_balance_usd", max_balance: "=max_enrolled_balance_usd", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", down_pct: "=down_payment_pct", autopay_required: "=autopay_required", first_due_gap_days: "=first_due_days_after_signing"}
      installment_rounding: "=installment_rounding"
      due_day_options: "=due_day_options"
      hardship_income_loss_pct: "=hardship_income_loss_pct"
      hardship_balance_threshold_usd: "=hardship_balance_threshold_usd"
      interest_rate_pct: "=interest_rate_pct"
      setup_fee_usd: "=setup_fee_usd"
      late_fee_usd: "=late_fee_usd"
      returned_payment_fee_usd: "=returned_payment_fee_usd"
      early_payoff_penalty_usd: "=early_payoff_penalty_usd"
    formula:
      down_payment: round(plan_balance * down_payment_pct / 100, 2)
      monthly_installment: max(min_monthly_payment_usd, round((plan_balance - down_payment) / term_months, 2))
  - id: plan_eligible_balances
    subject: [plan_balance_enrolled, plan_created]
    rule: >-
      Only the patient's own self-pay balances that are already billed to the patient are enrolled. An encounter balance may be enrolled only while its hospital account is in patient_due status. A balance still awaiting insurance adjudication (insurance_pending) is never enrolled (insurance_pending_excluded); an account on billing hold for a charge dispute or a good-faith-estimate dispute is not enrolled until the dispute is resolved (disputed_balance_excluded); a balance placed with the collection agency must first be recalled (bad_debt_enrollment_allowed). The amount enrolled is the account's patient_balance on the enrollment date. An encounter is enrolled at most once in the same plan; a later increase on an enrolled account (a late charge or a new patient-responsibility posting) is enrolled as an add-on on its own date.
    eligibility:
      - id: account_patient_due
        applies_to: [plan_balance_enrolled]
        kind: state
        condition: An encounter balance may be enrolled only while its hospital account is in patient_due status.
        evidence_fields: [encounter_accounts.status, encounter_accounts.encounter_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[encounter_accounts.encounter_id]]
          action_bindings: {encounter_accounts.encounter_id: encounter_id}
        state_contract:
          field: encounter_accounts.status
          allowed: [patient_due]
    params:
      eligible_encounter_status: "=eligible_encounter_status"
      insurance_pending_excluded: "=insurance_pending_excluded"
      disputed_balance_excluded: "=disputed_balance_excluded"
      bad_debt_enrollment_allowed: "=bad_debt_enrollment_allowed"
  - id: plan_signature_and_activation
    subject: [plan_signed, plan_offer_lapsed]
    rule: >-
      A plan starts only when the patient personally signs the agreement_form; a representative may set the plan up and send the agreement but can never sign or accept it for the patient. The patient must sign no later than the signature deadline counted from the date the plan was offered. Count calendar days starting the day after offered_date; a signature on the last day of the deadline is accepted. Any down payment is paid at signing. A plan not signed by the deadline lapses to cancelled and the balances stay on standard statements.
    eligibility:
      - id: signature_deadline
        applies_to: [plan_signed]
        kind: time
        condition: The patient must sign no later than the signature deadline counted from the date the plan was offered.
        evidence_fields: [payment_plans.offered_date, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the plan was offered
          anchor_source: payment_plans.offered_date
          relation: not_after
          duration_source: variants.signature_deadline_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after offered_date; a signature on the last day of the deadline is accepted.
          boundary: inclusive
    params:
      per_tier:
        "Riverbend Short-Term Payment Plan": {signature_deadline_days: "=signature_deadline_days"}
        "Riverbend Standard Payment Plan": {signature_deadline_days: "=signature_deadline_days"}
        "Riverbend Extended Payment Plan": {signature_deadline_days: "=signature_deadline_days"}
        "Riverbend Long-Term Payment Plan": {signature_deadline_days: "=signature_deadline_days"}
        "Riverbend Assistance-Linked Payment Plan": {signature_deadline_days: "=signature_deadline_days"}
        "Riverbend Hardship Payment Plan": {signature_deadline_days: "=signature_deadline_days"}
      agreement_form: "=agreement_form"
  - id: plan_missed_payment_and_default
    subject: [plan_installment_missed, plan_brought_current, plan_defaulted]
    rule: >-
      An installment not paid in full by grace_days calendar days after its due date is missed and the plan becomes past_due; a partial payment does not cure a missed installment. Paying every missed installment returns the plan to active. When the count of consecutive missed installments reaches missed_installments_to_default the plan defaults on that day. Installments falling due while the patient's financial assistance application is in submitted or pending_documents status are paused for up to fap_pending_pause_days and are not counted as missed. On default a default notice is sent; the enrolled accounts resume the standard statement cycle from where it stopped, and no collection action may be taken on them until default_notice_days have passed after the default date. While a plan is active, its accounts receive no final notice, agency placement or credit reporting (eca_protection_while_current, credit_reporting_while_on_plan).
    eligibility: []
    params:
      per_tier:
        "Riverbend Short-Term Payment Plan": {grace_days: "=grace_days", missed_to_default: "=missed_installments_to_default", fap_pause_days: "=fap_pending_pause_days"}
        "Riverbend Standard Payment Plan": {grace_days: "=grace_days", missed_to_default: "=missed_installments_to_default", fap_pause_days: "=fap_pending_pause_days"}
        "Riverbend Extended Payment Plan": {grace_days: "=grace_days", missed_to_default: "=missed_installments_to_default", fap_pause_days: "=fap_pending_pause_days"}
        "Riverbend Long-Term Payment Plan": {grace_days: "=grace_days", missed_to_default: "=missed_installments_to_default", fap_pause_days: "=fap_pending_pause_days"}
        "Riverbend Assistance-Linked Payment Plan": {grace_days: "=grace_days", missed_to_default: "=missed_installments_to_default", fap_pause_days: "=fap_pending_pause_days"}
        "Riverbend Hardship Payment Plan": {grace_days: "=grace_days", missed_to_default: "=missed_installments_to_default", fap_pause_days: "=fap_pending_pause_days"}
      default_notice_days: "=default_notice_days"
      eca_protection_while_current: "=eca_protection_while_current"
      credit_reporting_while_on_plan: "=credit_reporting_while_on_plan"
  - id: plan_reage_and_reinstatement
    subject: [plan_reaged, plan_reinstated]
    rule: >-
      A representative may re-age a past_due plan at the patient's request when the plan has been re-aged fewer than reage_max_per_plan times and at least reage_min_installments_paid installments have been paid on it (plan_msr_installments_paid). A re-age moves the missed installments to the end of the schedule (reage_method): the installment amount is unchanged and term_months grows by the number of missed installments. A defaulted plan may be reinstated only within the reinstatement window counted from the default date. Count calendar days starting the day after default_date; a reinstatement on the last day of the window is accepted. Reinstatement also requires a catch-up payment of reinstatement_catch_up_pct of the missed amount (missed installments times the installment, rounded half-up to the cent) and that fewer than reinstatements_per_plan reinstatements have been used; the rest of the missed amount moves to the end of the schedule. Outside these limits the patient's remaining balance stays on standard statements and a new plan may be requested only after the defaulted balances are brought current.
    eligibility:
      - id: reinstatement_window
        applies_to: [plan_reinstated]
        kind: time
        condition: A defaulted plan may be reinstated only within the reinstatement window counted from the default date.
        evidence_fields: [payment_plans.default_date, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the default date
          anchor_source: payment_plans.default_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after default_date; a reinstatement on the last day of the window is accepted.
          boundary: inclusive
    params:
      per_tier:
        "Riverbend Short-Term Payment Plan": {reage_max: "=reage_max_per_plan", reage_min_paid: "=reage_min_installments_paid", reinstatement_window_days: "=reinstatement_window_days", catch_up_pct: "=reinstatement_catch_up_pct", reinstatements: "=reinstatements_per_plan"}
        "Riverbend Standard Payment Plan": {reage_max: "=reage_max_per_plan", reage_min_paid: "=reage_min_installments_paid", reinstatement_window_days: "=reinstatement_window_days", catch_up_pct: "=reinstatement_catch_up_pct", reinstatements: "=reinstatements_per_plan"}
        "Riverbend Extended Payment Plan": {reage_max: "=reage_max_per_plan", reage_min_paid: "=reage_min_installments_paid", reinstatement_window_days: "=reinstatement_window_days", catch_up_pct: "=reinstatement_catch_up_pct", reinstatements: "=reinstatements_per_plan"}
        "Riverbend Long-Term Payment Plan": {reage_max: "=reage_max_per_plan", reage_min_paid: "=reage_min_installments_paid", reinstatement_window_days: "=reinstatement_window_days", catch_up_pct: "=reinstatement_catch_up_pct", reinstatements: "=reinstatements_per_plan"}
        "Riverbend Assistance-Linked Payment Plan": {reage_max: "=reage_max_per_plan", reage_min_paid: "=reage_min_installments_paid", reinstatement_window_days: "=reinstatement_window_days", catch_up_pct: "=reinstatement_catch_up_pct", reinstatements: "=reinstatements_per_plan"}
        "Riverbend Hardship Payment Plan": {reage_max: "=reage_max_per_plan", reage_min_paid: "=reage_min_installments_paid", reinstatement_window_days: "=reinstatement_window_days", catch_up_pct: "=reinstatement_catch_up_pct", reinstatements: "=reinstatements_per_plan"}
      reage_method: "=reage_method"
    formula:
      reaged_term: term_months + missed_installments
      catch_up_due: round(missed_installments * monthly_payment_usd * reinstatement_catch_up_pct / 100, 2)
    measures: [plan_msr_installments_paid]
  - id: plan_add_on_balances
    subject: [plan_balance_enrolled, plan_terms_modified]
    rule: >-
      A newly billed eligible balance may be added to an open plan only on tiers where add_on_allowed is true and when fewer than add_on_max_per_12_months add-ons were enrolled on the plan in the rolling 12 months (plan_msr_add_ons_12m). The installment is then recomputed (add_on_recalc_basis): the remaining schedule is term_months extended by add_on_term_extension_months, but never beyond max_term_months, less the installments already paid; the new installment is the new plan balance divided by that remaining schedule, rounded half-up to the cent, never below min_monthly_payment_usd. When the add-on would take the plan balance above the tier's max_enrolled_balance_usd, it is not added (tier_overflow_rule): the patient is offered a new plan on the tier matching the combined balance, which requires cancelling the open plan first.
    eligibility: []
    params:
      per_tier:
        "Riverbend Short-Term Payment Plan": {add_on_allowed: "=add_on_allowed", add_on_max: "=add_on_max_per_12_months", extension_months: "=add_on_term_extension_months", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", max_balance: "=max_enrolled_balance_usd"}
        "Riverbend Standard Payment Plan": {add_on_allowed: "=add_on_allowed", add_on_max: "=add_on_max_per_12_months", extension_months: "=add_on_term_extension_months", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", max_balance: "=max_enrolled_balance_usd"}
        "Riverbend Extended Payment Plan": {add_on_allowed: "=add_on_allowed", add_on_max: "=add_on_max_per_12_months", extension_months: "=add_on_term_extension_months", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", max_balance: "=max_enrolled_balance_usd"}
        "Riverbend Long-Term Payment Plan": {add_on_allowed: "=add_on_allowed", add_on_max: "=add_on_max_per_12_months", extension_months: "=add_on_term_extension_months", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", max_balance: "=max_enrolled_balance_usd"}
        "Riverbend Assistance-Linked Payment Plan": {add_on_allowed: "=add_on_allowed", add_on_max: "=add_on_max_per_12_months", extension_months: "=add_on_term_extension_months", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", max_balance: "=max_enrolled_balance_usd"}
        "Riverbend Hardship Payment Plan": {add_on_allowed: "=add_on_allowed", add_on_max: "=add_on_max_per_12_months", extension_months: "=add_on_term_extension_months", max_term: "=max_term_months", min_installment: "=min_monthly_payment_usd", max_balance: "=max_enrolled_balance_usd"}
      add_on_recalc_basis: "=add_on_recalc_basis"
      tier_overflow_rule: "=tier_overflow_rule"
    formula:
      remaining_installments: min(term_months + add_on_term_extension_months, max_term_months) - plan_msr_installments_paid
      new_installment: max(min_monthly_payment_usd, round(plan_balance / remaining_installments, 2))
    measures: [plan_msr_add_ons_12m, plan_msr_installments_paid]
  - id: plan_installment_posting
    subject: [plan_installment_paid, plan_paid_off]
    rule: >-
      An installment may be paid through any of plan_payment_channels. Each installment payment is applied to the enrolled accounts in payment_application_order and posts to those accounts as a plan installment payment. A failed autopay draft is retried once after autopay_retry_days (autopay_retry_count) and, if it fails again, the installment is treated as unpaid. A payment above the installment amount reduces the remaining schedule (overpayment_application) and never pre-pays the next due date. A plan statement is sent plan_statement_lead_days calendar days before each due date. The plan is paid off when its balance reaches zero.
    eligibility: []
    params:
      plan_payment_channels: "=plan_payment_channels"
      payment_application_order: "=payment_application_order"
      autopay_retry_days: "=autopay_retry_days"
      autopay_retry_count: "=autopay_retry_count"
      overpayment_application: "=overpayment_application"
      plan_statement_lead_days: "=plan_statement_lead_days"
  - id: plan_balance_reduction
    subject: [plan_balance_reduced, plan_terms_modified]
    rule: >-
      When an enrolled account's balance falls because of a charity adjustment, a late insurance payment, a charge correction or a small-balance write-off, the plan balance is reduced by the same amount on the same date, recorded against that account and reason. An enrolled account placed on a charge-dispute or good-faith-estimate-dispute hold has its whole remaining enrolled balance withdrawn (BALANCE_WITHDRAWN_FOR_DISPUTE). A reduction never changes the installment amount; it shortens the remaining schedule, and the final installment absorbs the remainder. A reduction never exceeds the amount that account still carries on the plan.
    eligibility: []
    params: {overpayment_application: "=overpayment_application"}
  - id: plan_patient_changes
    subject: [plan_terms_modified, plan_cancelled_by_patient]
    rule: >-
      The patient may change the due day to another of due_day_options or ask for a lower installment, together at most terms_changes_per_plan times over the plan's life. A requested lower installment may not be below min_requested_installment_pct_of_computed of the installment computed at creation or at the last recomputation, and never below min_monthly_payment_usd; the schedule lengthens accordingly but never beyond max_term_months from the first due date. The patient may skip an installment, moving it to the end of the schedule, at most skip_payments_per_plan times. The patient may cancel an active plan at any time without penalty; the remaining balances return to the standard statement cycle and no collection action may follow sooner than default_notice_days after the cancellation date.
    eligibility: []
    params:
      per_tier:
        "Riverbend Short-Term Payment Plan": {changes: "=terms_changes_per_plan", min_requested_pct: "=min_requested_installment_pct_of_computed", skips: "=skip_payments_per_plan", max_term: "=max_term_months"}
        "Riverbend Standard Payment Plan": {changes: "=terms_changes_per_plan", min_requested_pct: "=min_requested_installment_pct_of_computed", skips: "=skip_payments_per_plan", max_term: "=max_term_months"}
        "Riverbend Extended Payment Plan": {changes: "=terms_changes_per_plan", min_requested_pct: "=min_requested_installment_pct_of_computed", skips: "=skip_payments_per_plan", max_term: "=max_term_months"}
        "Riverbend Long-Term Payment Plan": {changes: "=terms_changes_per_plan", min_requested_pct: "=min_requested_installment_pct_of_computed", skips: "=skip_payments_per_plan", max_term: "=max_term_months"}
        "Riverbend Assistance-Linked Payment Plan": {changes: "=terms_changes_per_plan", min_requested_pct: "=min_requested_installment_pct_of_computed", skips: "=skip_payments_per_plan", max_term: "=max_term_months"}
        "Riverbend Hardship Payment Plan": {changes: "=terms_changes_per_plan", min_requested_pct: "=min_requested_installment_pct_of_computed", skips: "=skip_payments_per_plan", max_term: "=max_term_months"}
      due_day_options: "=due_day_options"
      default_notice_days: "=default_notice_days"

# ---- extended policies (payment_plan_servicing) ----
extended_policies:
- id: plan_ext_assistance_pause
  base_policy_refs:
  - plan_tier_and_installment
  - plan_add_on_balances
  - plan_balance_reduction
  - plan_patient_changes
  - plan_missed_payment_and_default
  overwrite:
  - base_policy: plan_missed_payment_and_default
    superseded_clause: >-
      Installments falling due while the patient's financial assistance application is in submitted or pending_documents status are paused for up to fap_pending_pause_days
      and are not counted as missed.
    replaced_by: >-
      Installments falling due while the patient's financial assistance application is in submitted or pending_documents status are not counted as missed:
      once an installment pause is booked on the plan under this rule, the installments it pauses are the ones this rule counts and they move to the end
      of the schedule, and until a pause is booked they stay paused for up to fap_pending_pause_days.
  trigger: state_due
  subject:
  - plan_terms_modified
  computes: term_months
  target_tool: pause_plan_installments_136536f5
  params:
    fpl_low_income_max: 200.0
    fpl_partial_max: 400.0
    full_period_days: 30
    term_low_income: 60
    term_partial: 48
    band_term_high: 60
    band_term_mid: 48
    band_balance_high: 10000.0
    band_balance_mid: 3000.0
  rule: >-
    Installments that fall due while a patient's financial assistance application is open are paused so that the plan is not pushed into default while assistance
    is decided, and each paused installment moves to the end of the schedule. A financial assistance application of the patient is open when one of the
    patient's financial assistance cases stands in submitted or pending_documents status, a submitted case being taken first, and its receipt date is that
    case's application date. Whole months between two dates are counted the calendar way: a month is complete only once the later date's day number reaches
    the earlier date's day number (from the 31st, a month without that day is not yet complete at its last day), and a later date before the starting date
    gives a negative count. Due dates fall on the plan's due day each month from the first due date, so the installments falling due on or before a date
    are the whole months from the first due date to that date plus one; the installments a pause considers are those falling due after the receipt date
    and on or after the plan's next due date (every one after the receipt date when the plan has no next due date), a receipt date before the first due
    date counting as one month before it so that no installment is counted before the first due date, up to the end of the pause window. As standard, the
    pause window ends on the handling date. No more installments are paused than the pause allowance, one installment for each full full_period_days days
    of the pause period, and the standard pause period is the tier's fap_pending_pause_days. The schedule length after the pause is the plan's current number
    of scheduled installments (term_months) plus the paused installments, never longer than the longest paused schedule, which is the tier's max_term_months
    as standard, and never shorter than the current number of scheduled installments; with no open application nothing is paused. The adjustments set out
    below are applied in this order: the days added to the pause period and the pause window are settled first, the paused installments are then held to
    the pause allowance and added to the current number of scheduled installments, the longest paused schedule is applied to that sum next, and the rule
    that the schedule is never left shorter than the current one is applied last. While BadgerCare Plus is screening the patient the pause period is longer:
    it gains the open case's medicaid_screening_deadline_days when a BadgerCare Plus screening referral notice has been sent on the case and no BadgerCare
    Plus determination notice has been received as a document of the case, it gains the case's determination_days when a referral notice has been sent and
    the determination notice has been received, and it gains nothing when no referral notice has been sent on the case or no application is open. While
    the open case is still being completed or decided the pause period is longer by the time the case still needs: when the case stands in pending_documents
    status it gains the days from the handling date to the case's documents due date (none once that date has passed) plus the case's determination_days,
    the time for the requested documents to arrive and the case to be decided; when it stands in submitted status it gains the case's determination_days
    alone; and it gains nothing when no application is open. The pause window follows the open case's status: for a case in pending_documents status whose
    documents due date is on or after the handling date, the window runs to the documents due date, so it also takes in the installments that will fall
    due by then, located as the whole months from the first due date to the documents due date plus one; for a case in submitted status, the installments
    in the window are counted by elapsed time instead of by due dates, one for each full full_period_days days from the receipt date to the handling date,
    but never more than the considered installments that have fallen due by the handling date, so an installment already paid is never paused; otherwise
    the window ends on the handling date; here whole months being counted the calendar way, a month complete only once the later date's day number reaches
    the earlier date's day number (from the 31st, a month without that day is not yet complete at its last day). The longest paused schedule may run past
    the tier's max_term_months only as far as the screening ceiling of the paused schedule allows: term_low_income installments when the open application's
    household was screened at or below fpl_low_income_max percent of the federal poverty level and term_partial installments when it was screened above
    fpl_low_income_max and at or below fpl_partial_max percent, each only on tiers whose max_term_months is shorter; otherwise the screening ceiling is
    the tier's max_term_months. The longest paused schedule may run past the tier's max_term_months only as far as the balance ceiling of the paused schedule
    allows, following Riverbend's term schedule by balance read from the plan's own ledger as the amounts enrolled less the installments paid and the reductions
    booked: band_term_high installments when that balance is at least band_balance_high and band_term_mid installments when it is at least band_balance_mid,
    the first of these that applies, each only on tiers whose max_term_months is shorter; otherwise the balance ceiling is the tier's max_term_months. Installments
    falling due while the patient's financial assistance application is in submitted or pending_documents status are not counted as missed: once an installment
    pause is booked on the plan under this rule, the installments it pauses are the ones this rule counts and they move to the end of the schedule, and
    until a pause is booked they stay paused for up to fap_pending_pause_days.
  prerequisite: []
  cross_category:
  - category: assist
    as: branch
    reads:
    - status
    - application_date
    - household_fpl_pct
    - documents_due_date
    - medicaid_screening_deadline_days
    - missing_information_response_days
    - determination_days
    - assistance_transactions.notice_type
    - assistance_transactions.document_type
    - assistance_transactions.document_status
    note: >-
      The open case's status, receipt date, documents due date, screening and BadgerCare Plus notices decide the pause period, the pause window and the
      screening ceiling.
  compute:
  - case_submitted: CFIELD('assist', 'fap_case_id', status='submitted')
  - case_pending: CFIELD('assist', 'fap_case_id', status='pending_documents')
  - open_case: case_submitted if case_submitted != None else case_pending
  - receipt: CFIELD('assist', 'application_date', fap_case_id=open_case) if open_case != None else None
  - start_idx: >-
      (MX(-1, MX(MONTHS(F('first_due_date'), receipt), MONTHS(F('first_due_date'), F('next_due_date')) - 1)) if F('next_due_date') else MX(-1, MONTHS(F('first_due_date'),
      receipt))) if receipt != None else 0
  - md_refs: >-
      XCOUNT('assist', 'assistance_transactions', fap_case_id=open_case, event_type='assist_notice_sent', notice_type='MEDICAID_SCREENING_REFERRAL') if
      open_case != None else 0
  - md_dets: >-
      XCOUNT('assist', 'assistance_transactions', fap_case_id=open_case, event_type='assist_document_logged', document_type='MEDICAID_DETERMINATION_NOTICE',
      document_status='RECEIVED') if open_case != None else 0
  - md_days: >-
      CPARAM('assist', 'medicaid_screening_deadline_days', fap_case_id=open_case) if (open_case != None and md_refs > 0 and md_dets == 0) else (CPARAM('assist',
      'determination_days', fap_case_id=open_case) if (open_case != None and md_refs > 0 and md_dets > 0) else 0)
  - dc_status: CFIELD('assist', 'status', fap_case_id=open_case) if open_case != None else None
  - dc_docs_due: CFIELD('assist', 'documents_due_date', fap_case_id=open_case) if open_case != None else None
  - dc_days: >-
      ((MX(0, DAYS(NOW, dc_docs_due)) if dc_docs_due else 0) + CPARAM('assist', 'determination_days', fap_case_id=open_case)) if dc_status == 'pending_documents'
      else (CPARAM('assist', 'determination_days', fap_case_id=open_case) if dc_status == 'submitted' else 0)
  - allowance: int((P('fap_pending_pause_days') + md_days + dc_days) / K('full_period_days'))
  - win_status: CFIELD('assist', 'status', fap_case_id=open_case) if open_case != None else None
  - win_docs_due: CFIELD('assist', 'documents_due_date', fap_case_id=open_case) if open_case != None else None
  - window: >-
      (MX(0, MONTHS(F('first_due_date'), win_docs_due) - start_idx) if (win_status == 'pending_documents' and win_docs_due and DAYS(NOW, win_docs_due) >=
      0) else (MN(int(MX(0, DAYS(receipt, NOW)) / K('full_period_days')), MX(0, MONTHS(F('first_due_date'), NOW) - start_idx)) if win_status == 'submitted'
      else MX(0, MONTHS(F('first_due_date'), NOW) - start_idx))) if receipt != None else 0
  - paused: MN(window, allowance) if receipt != None else 0
  - cf_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - cf_cap: >-
      K('term_low_income') if (open_case != None and cf_fpl != None and cf_fpl <= K('fpl_low_income_max') and P('max_term_months') < K('term_low_income'))
      else (K('term_partial') if (open_case != None and cf_fpl != None and cf_fpl > K('fpl_low_income_max') and cf_fpl <= K('fpl_partial_max') and P('max_term_months')
      < K('term_partial')) else P('max_term_months'))
  - cb_bal: >-
      SUM('plan_transactions', 'amount', event_type='plan_balance_enrolled') - SUM('plan_transactions', 'amount', event_type='plan_installment_paid') -
      SUM('plan_transactions', 'amount', event_type='plan_balance_reduced')
  - cb_cap: >-
      K('band_term_high') if (cb_bal >= K('band_balance_high') and P('max_term_months') < K('band_term_high')) else (K('band_term_mid') if (cb_bal >= K('band_balance_mid')
      and P('max_term_months') < K('band_term_mid')) else P('max_term_months'))
  - result: MX(F('term_months'), MN(F('term_months') + paused, MN(cf_cap, cb_cap)))
