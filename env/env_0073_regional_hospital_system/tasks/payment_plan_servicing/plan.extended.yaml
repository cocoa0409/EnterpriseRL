      filters:
        event_type: plan_balance_enrolled
    - table: plan_transactions
      aggregate: latest
      field: encounter_id
      filters:
        event_type: plan_balance_enrolled
    cross_category:
    - assist
    - encounter
- id: plan_ext_lowest_installment
  base_policy_refs:
  - plan_tier_and_installment
  - plan_add_on_balances
  - plan_balance_reduction
  - plan_patient_changes
  overwrite:
  - base_policy: plan_patient_changes
    superseded_clause: >-
      A requested lower installment may not be below min_requested_installment_pct_of_computed of the installment computed at creation or at the last recomputation,
      and never below min_monthly_payment_usd; the schedule lengthens accordingly but never beyond max_term_months from the first due date.
    replaced_by: >-
      A lower installment a patient signs for under this rule is never below the lowest installment this rule figures and lengthens the schedule only as
      far as this rule lets it; a due-day change, a skip or a cancellation stays under the patient-change terms.
  trigger: on_request
  subject:
  - plan_terms_modified
  computes: monthly_payment_usd
  target_tool: set_requested_installment_eff91f18
  params:
    fpl_low_income_max: 200.0
    fpl_partial_max: 400.0
    share_low_income: 50.0
    share_partial: 75.0
    floor_low_income: 10.0
    floor_partial: 20.0
    term_low_income: 60
    term_partial: 48
    full_period_days: 30
  rule: >-
    A patient may lower the installment on their own plan by signing an installment change; the lowered installment applies from the next installment and
    the schedule lengthens to carry the plan balance. As standard, the lowest installment a patient may set is the largest of three figures, each rounded
    half-up to the cent, and never more than the current installment: the lowering share (the tier's min_requested_installment_pct_of_computed) of the current
    installment, which is the installment computed at the plan's last recomputation; the lowering floor (the tier's min_monthly_payment_usd); and the plan
    balance divided by the longest schedule the change may reach, the plan balance being read from the plan's own ledger as the amounts enrolled less the
    installments paid and the reductions booked. The longest schedule the change may reach is the smaller of the lengthened schedule and the term-limit
    schedule, and at least one installment: the lengthened schedule is the remaining schedule as last computed, that plan balance divided by the current
    installment and rounded up to a whole installment, plus the tier's add_on_term_extension_months, and the term-limit schedule is the term limit (the
    tier's max_term_months as standard) less the installment payment entries numbered 1 or more. The adjustments set out below are applied in this order:
    values that replace a standard input and installments added to the lengthened schedule come first, the term-limit schedule is applied to the lengthened
    schedule next (leaving at least one installment), and the three figures are compared last, the largest being taken and then held to the current installment.
    A financial assistance application of the patient is open when one of the patient's financial assistance cases stands in submitted or pending_documents
    status, a submitted case being taken first. The lowering share follows the open application's screening: share_low_income percent for a household screened
    at or below fpl_low_income_max percent of the federal poverty level and share_partial percent for one screened above fpl_low_income_max and at or below
    fpl_partial_max percent, each only on tiers whose min_requested_installment_pct_of_computed is higher; otherwise it is the tier's min_requested_installment_pct_of_computed.
    The lowering floor is floor_low_income dollars when the open application's household was screened at or below fpl_low_income_max percent of the federal
    poverty level and floor_partial dollars when it was screened above fpl_low_income_max and at or below fpl_partial_max percent, each only on tiers whose
    min_monthly_payment_usd is higher; otherwise it is the tier's min_monthly_payment_usd. The term limit of a lowered schedule is term_low_income installments
    when the open application's household was screened at or below fpl_low_income_max percent of the federal poverty level and term_partial installments
    when it was screened above fpl_low_income_max and at or below fpl_partial_max percent, each only on tiers whose max_term_months is shorter; otherwise
    it is the tier's max_term_months. The lengthened schedule also takes in installments for the time the open application has been waiting since its receipt
    date, which is that case's application date: for a case in pending_documents status, the due dates after the receipt date that have already come, up
    to the earlier of the handling date and the case's documents due date, counted as the whole months from the first due date to that earlier date less
    the whole months from the first due date to the receipt date (a receipt date before the first due date counting as one month before it) and never fewer
    than none; for a case in submitted status, one installment for each full full_period_days days from the receipt date to the handling date; with no open
    application, none; here whole months being counted the calendar way, a month complete only once the later date's day number reaches the earlier date's
    day number (from the 31st, a month without that day is not yet complete at its last day). A lowered installment is set only after the installment has
    been recomputed for every balance added to the plan since its last recomputation. A lower installment a patient signs for under this rule is never below
    the lowest installment this rule figures and lengthens the schedule only as far as this rule lets it; a due-day change, a skip or a cancellation stays
    under the patient-change terms.
  prerequisite:
  - problem: plan_ext_addon_recompute
    kind: value_input
    form: action
    gate: remaining_now
    resolved_by: recompute_plan_installment_b9083db3
    condition: >-
      payment_plans.monthly_payment_usd equals the installment recomputed over every add-on enrolled since the last recomputation.
    effect: >-
      The recompute sets the current installment, which changes the remaining schedule as last computed and the lowering-share figure.
    fallback_reason: >-
