  compute:
  - case_submitted: CFIELD('assist', 'fap_case_id', status='submitted')
  - case_pending: CFIELD('assist', 'fap_case_id', status='pending_documents')
  - open_case: case_submitted if case_submitted != None else case_pending
  - sched_now: F('term_months')
  - missed_now: F('missed_installments')
  - cf_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - cf_cap: >-
      K('term_low_income') if (open_case != None and cf_fpl != None and cf_fpl <= K('fpl_low_income_max') and P('max_term_months') < K('term_low_income'))
      else (K('term_partial') if (open_case != None and cf_fpl != None and cf_fpl > K('fpl_low_income_max') and cf_fpl <= K('fpl_partial_max') and P('max_term_months')
      < K('term_partial')) else P('max_term_months'))
  - ex_n: >-
      COUNT('plan_transactions', within_months=12, date_field='posting_date', event_type='plan_balance_enrolled') - COUNT('plan_transactions', within_months=12,
      date_field='posting_date', event_type='plan_balance_enrolled', posting_date=F('offered_date'))
  - ext: >-
      K('ext_frequent') if (ex_n >= K('addons_frequent') and P('add_on_term_extension_months') < K('ext_frequent')) else (K('ext_repeat') if (ex_n == K('addons_repeat')
      and P('add_on_term_extension_months') < K('ext_repeat')) else P('add_on_term_extension_months'))
  - cl_date: >-
      LATEST('plan_transactions', 'posting_date', date_field='posting_date', event_type='plan_balance_enrolled')
  - cl_enc: >-
      LATEST('plan_transactions', 'encounter_id', date_field='posting_date', event_type='plan_balance_enrolled') if (cl_date and cl_date != F('offered_date'))
      else None
  - cl_var: CFIELD('encounter', 'variant_name', encounter_id=cl_enc) if cl_enc != None else None
  - cls: >-
      K('class_series') if cl_var == 'Recurring Outpatient Therapy Account' else (K('class_acute') if (cl_var == 'Inpatient Admission Account' or cl_var
      == 'Observation Stay Account') else 0)
  - pd_no: int(MAX('plan_transactions', 'installment_number', event_type='plan_installment_paid'))
  - pd_part_sum: >-
      SUM('plan_transactions', 'amount', event_type='plan_installment_paid', installment_number=pd_no) if pd_no > 0 else 0
  - pd_part_n: >-
      COUNT('plan_transactions', event_type='plan_installment_paid', installment_number=pd_no) if (pd_no > 0 and pd_part_sum < F('monthly_payment_usd')
      - 0.005) else 0
  - pd_all: >-
      COUNT('plan_transactions', event_type='plan_installment_paid') - COUNT('plan_transactions', event_type='plan_installment_paid', installment_number=0)
  - pd_total: >-
      SUM('plan_transactions', 'amount', event_type='plan_installment_paid') - SUM('plan_transactions', 'amount', event_type='plan_installment_paid', installment_number=0)
  - paid: >-
      (pd_all - pd_part_n) if pd_part_n > 0 else (int(pd_total / F('monthly_payment_usd')) if (F('monthly_payment_usd') > 0 and pd_total > pd_all * F('monthly_payment_usd')
      + 0.005) else pd_all)
  - fl_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - floor: >-
      K('floor_low_income') if (open_case != None and fl_fpl != None and fl_fpl <= K('fpl_low_income_max') and P('min_monthly_payment_usd') > K('floor_low_income'))
      else (K('floor_partial') if (open_case != None and fl_fpl != None and fl_fpl > K('fpl_low_income_max') and fl_fpl <= K('fpl_partial_max') and P('min_monthly_payment_usd')
      > K('floor_partial')) else P('min_monthly_payment_usd'))
  - remaining: MX(1, MN(sched_now + ext + cls, cf_cap) - paid - missed_now)
  - result: MX(floor, RND(F('plan_balance') / remaining + 0.000001, 2))
