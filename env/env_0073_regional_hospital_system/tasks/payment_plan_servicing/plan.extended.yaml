      > K('floor_partial')) else P('min_monthly_payment_usd'))
  - lt_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - limit: >-
      K('term_low_income') if (open_case != None and lt_fpl != None and lt_fpl <= K('fpl_low_income_max') and P('max_term_months') < K('term_low_income'))
      else (K('term_partial') if (open_case != None and lt_fpl != None and lt_fpl > K('fpl_low_income_max') and lt_fpl <= K('fpl_partial_max') and P('max_term_months')
      < K('term_partial')) else P('max_term_months'))
  - aw_status: CFIELD('assist', 'status', fap_case_id=open_case) if open_case != None else None
  - aw_docs_due: CFIELD('assist', 'documents_due_date', fap_case_id=open_case) if open_case != None else None
  - waited: >-
