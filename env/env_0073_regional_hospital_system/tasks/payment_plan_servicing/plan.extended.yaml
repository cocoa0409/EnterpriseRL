- id: plan_ext_reage_schedule
  base_policy_refs:
  - plan_reage_and_reinstatement
  - plan_missed_payment_and_default
  overwrite:
  - base_policy: plan_reage_and_reinstatement
    superseded_clause: >-
      A re-age moves the missed installments to the end of the schedule (reage_method): the installment amount is unchanged and term_months grows by the
      number of missed installments.
    replaced_by: >-
      A re-age a representative books under this rule moves to the end of the schedule the installments this rule counts together with any deferrals it
      grants, the installment amount staying unchanged; a reinstatement still moves the rest of its missed amount to the end of the schedule as the reinstatement
      terms provide.
  - base_policy: plan_missed_payment_and_default
    superseded_clause: >-
      An installment not paid in full by grace_days calendar days after its due date is missed and the plan becomes past_due; a partial payment does not
      cure a missed installment.
    replaced_by: >-
      An installment not paid in full by grace_days calendar days after its due date is missed and the plan becomes past_due, and a partial payment does
      not cure a missed installment; only when a representative re-ages the plan under this rule is a missed installment whose unpaid part is less than
      one installment after partial payments closed by the re-age, that unpaid part staying in the plan balance for the final installment to absorb.
  trigger: on_request
  subject:
  - plan_reaged
  computes: term_months
  target_tool: reage_payment_plan_e7c586c0
  params:
    fpl_low_income_max: 200.0
    fpl_partial_max: 400.0
    deferrals_low_income: 3
    deferrals_partial: 2
    term_low_income: 60
    term_partial: 48
    band_term_high: 60
    band_term_mid: 48
    band_balance_high: 10000.0
    band_balance_mid: 3000.0
    record_term_long: 60
    record_term_short: 48
    record_paid_long: 3
    record_paid_short: 1
  rule: >-
    A representative re-ages a past_due plan at the patient's request: the missed installments move to the end of the schedule and the installment amount
    is unchanged. As standard, the installments moved are the consecutive missed installments the plan records (missed_installments), and the re-aged schedule
    length is the plan's current number of scheduled installments (term_months) plus the installments moved, never longer than the longest re-aged schedule,
    which is the tier's max_term_months as standard, and never shorter than the current number of scheduled installments. A re-age settles every missed
    installment the plan records, so the plan's next due date moves forward one month, on the plan's due day, for each missed installment the plan recorded.
    The adjustments set out below are applied in this order: the installments moved and any installments added to them are counted first and added to the
    current number of scheduled installments, the longest re-aged schedule is applied to that sum next, and the rule that the schedule is never left shorter
    than the current one is applied last. A financial assistance application of the patient is open when one of the patient's financial assistance cases
    stands in submitted or pending_documents status, a submitted case being taken first. The installments moved follow what has been paid toward them and
    when assistance was sought: when installment payment entries have been posted with the number of the installment due on the plan's next due date (the
    whole months from the first due date to the next due date plus one) — partial payments, which do not cure it — the installments moved are the whole
    installments the unpaid missed amount still makes up, the missed installments times the installment less those partial payments, divided by the installment
    and rounded down, while the unpaid part left over, less than one installment, is closed by the re-age and stays in the plan balance for the final installment
    to absorb; when there are no such entries and the open application was received after the plan's next due date (its receipt date being that case's application
    date), the installments moved are those falling due from the next due date through the receipt date, the whole months from the next due date to the
    receipt date plus one; otherwise they are the recorded missed installments; here whole months being counted the calendar way, a month complete only
    once the later date's day number reaches the earlier date's day number (from the 31st, a month without that day is not yet complete at its last day).
    A patient with an open application also defers installments at the re-age on the assistance-linked terms Riverbend publishes: when the household was
    screened at or below fpl_low_income_max percent of the federal poverty level, the Riverbend Hardship Payment Plan's skip allowance of deferrals_low_income
    installments, and when it was screened above fpl_low_income_max and at or below fpl_partial_max percent, the Riverbend Assistance-Linked Payment Plan's
    allowance of deferrals_partial installments, each less the skips already used on the plan (skip_count) but never fewer than none, and only on tiers
    whose own skip_payments_per_plan is smaller; the deferred installments move to the end of the schedule too, and otherwise none are deferred. The longest
    re-aged schedule may run past the tier's max_term_months only as far as the screening ceiling of the re-aged schedule allows: term_low_income installments
    when the open application's household was screened at or below fpl_low_income_max percent of the federal poverty level and term_partial installments
    when it was screened above fpl_low_income_max and at or below fpl_partial_max percent, each only on tiers whose max_term_months is shorter; otherwise
    the screening ceiling is the tier's max_term_months. The longest re-aged schedule may run past the tier's max_term_months only as far as the balance
    ceiling of the re-aged schedule allows, following Riverbend's term schedule by balance read from the plan's own ledger as the amounts enrolled less
    the installments paid and the reductions booked: band_term_high installments when that balance is at least band_balance_high and band_term_mid installments
    when it is at least band_balance_mid, the first of these that applies, each only on tiers whose max_term_months is shorter; otherwise the balance ceiling
    is the tier's max_term_months. The longest re-aged schedule may run past the tier's max_term_months only as far as the payment-record ceiling allows,
    which follows the installment payment entries numbered 1 or more posted on the plan: record_term_long installments for at least record_paid_long such
    entries and record_term_short installments for at least record_paid_short but fewer than record_paid_long, each only on tiers whose max_term_months
    is shorter; otherwise the payment-record ceiling is the tier's max_term_months. A re-age a representative books under this rule moves to the end of
    the schedule the installments this rule counts together with any deferrals it grants, the installment amount staying unchanged; a reinstatement still
    moves the rest of its missed amount to the end of the schedule as the reinstatement terms provide. An installment not paid in full by grace_days calendar
    days after its due date is missed and the plan becomes past_due, and a partial payment does not cure a missed installment; only when a representative
    re-ages the plan under this rule is a missed installment whose unpaid part is less than one installment after partial payments closed by the re-age,
    that unpaid part staying in the plan balance for the final installment to absorb.
  prerequisite: []
  cross_category:
  - category: assist
    as: branch
    reads:
    - status
    - application_date
    - household_fpl_pct
    note: >-
      The open application's receipt date decides which missed installments are moved, and its screening decides the deferrals and the screening ceiling.
  compute:
  - case_submitted: CFIELD('assist', 'fap_case_id', status='submitted')
  - case_pending: CFIELD('assist', 'fap_case_id', status='pending_documents')
  - open_case: case_submitted if case_submitted != None else case_pending
  - mv_no: int(MONTHS(F('first_due_date'), F('next_due_date')) + 1) if F('next_due_date') else 0
  - mv_part_n: >-
      COUNT('plan_transactions', event_type='plan_installment_paid', installment_number=mv_no) if mv_no > 0 else 0
  - mv_part_sum: >-
      SUM('plan_transactions', 'amount', event_type='plan_installment_paid', installment_number=mv_no) if mv_no > 0 else 0
  - mv_receipt: CFIELD('assist', 'application_date', fap_case_id=open_case) if open_case != None else None
  - moved: >-
      int(MX(0, F('missed_installments') * F('monthly_payment_usd') - mv_part_sum) / F('monthly_payment_usd')) if (mv_part_n > 0 and F('monthly_payment_usd')
      > 0) else ((MONTHS(F('next_due_date'), mv_receipt) + 1) if (mv_receipt != None and F('next_due_date') and DAYS(F('next_due_date'), mv_receipt) > 0)
      else F('missed_installments'))
  - df_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - deferrals: >-
      K('deferrals_low_income') if (open_case != None and df_fpl != None and df_fpl <= K('fpl_low_income_max') and P('skip_payments_per_plan') < K('deferrals_low_income'))
      else (K('deferrals_partial') if (open_case != None and df_fpl != None and df_fpl > K('fpl_low_income_max') and df_fpl <= K('fpl_partial_max') and
      P('skip_payments_per_plan') < K('deferrals_partial')) else 0)
  - cf_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - cf_cap: >-
      K('term_low_income') if (open_case != None and cf_fpl != None and cf_fpl <= K('fpl_low_income_max') and P('max_term_months') < K('term_low_income'))
      else (K('term_partial') if (open_case != None and cf_fpl != None and cf_fpl > K('fpl_low_income_max') and cf_fpl <= K('fpl_partial_max') and P('max_term_months')
      < K('term_partial')) else P('max_term_months'))
  - cb_bal: >-
      SUM('plan_transactions', 'amount', event_type='plan_balance_enrolled') - SUM('plan_transactions', 'amount', event_type='plan_installment_paid') -
      SUM('plan_transactions', 'amount', event_type='plan_balance_reduced')
  - cb_cap: >-
      K('band_term_high') if (cb_bal >= K('band_balance_high') and P('max_term_months') < K('band_term_high')) else (K('band_term_mid') if (cb_bal >= K('band_balance_mid')
      and P('max_term_months') < K('band_term_mid')) else P('max_term_months'))
  - ch_paid: >-
      COUNT('plan_transactions', event_type='plan_installment_paid') - COUNT('plan_transactions', event_type='plan_installment_paid', installment_number=0)
  - ch_cap: >-
      K('record_term_long') if (ch_paid >= K('record_paid_long') and P('max_term_months') < K('record_term_long')) else (K('record_term_short') if (ch_paid
      >= K('record_paid_short') and ch_paid < K('record_paid_long') and P('max_term_months') < K('record_term_short')) else P('max_term_months'))
  - deferred: MX(0, deferrals - F('skip_count'))
  - result: MX(F('term_months'), MN(F('term_months') + moved + deferred, MN(cf_cap, cb_cap, ch_cap)))
