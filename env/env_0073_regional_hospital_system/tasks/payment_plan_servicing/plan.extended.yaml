  factors:
  - id: medicaid_screening_days
    effect: parameter
    decides: md_days
    bindings:
    - md_refs
    - md_dets
    - md_days
    ladder:
    - when: >-
        a BadgerCare Plus screening referral notice sent on the open case and no BadgerCare Plus determination notice received as a document of the case
      value: CPARAM('assist', 'medicaid_screening_deadline_days', fap_case_id=open_case)
    - when: a referral notice sent on the open case and the BadgerCare Plus determination notice received
      value: CPARAM('assist', 'determination_days', fap_case_id=open_case)
    - when: otherwise (no referral notice on the case, or no open application)
      value: '0'
    baseline:
      md_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: assist
  - id: case_completion_days
    effect: method
    decides: dc_days
    bindings:
    - dc_status
    - dc_docs_due
    - dc_days
    ladder:
    - when: open case in pending_documents status
      method: >-
        add the days from the handling date to the documents due date (none once it has passed) to the case's determination_days
    - when: open case in submitted status
      method: add the case's determination_days alone
    - when: otherwise (no open application)
      method: add nothing
    baseline:
      dc_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: assist
  - id: pause_window
    effect: method
    decides: window
    bindings:
    - win_status
    - win_docs_due
    - window
    ladder:
    - when: open case in pending_documents status whose documents due date is on or after the handling date
      method: >-
        count the considered installments falling due up to the documents due date: whole months from the first due date to the documents due date, less
        the position where the considered installments start
    - when: open case in submitted status
      method: >-
        count by elapsed time: one installment for each full full_period_days days from the receipt date to the handling date, never more than the considered
        installments fallen due by the handling date
    - when: otherwise
      method: >-
        count the considered installments falling due up to the handling date: whole months from the first due date to the handling date, less the position
        where the considered installments start
    baseline:
      window: MX(0, MONTHS(F('first_due_date'), NOW) - start_idx) if receipt != None else 0
    evidence:
    - cross_category
    - date
    cross_difficulty: assist
  - id: paused_screening_ceiling
    effect: parameter
    decides: cf_cap
    bindings:
    - cf_fpl
    - cf_cap
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose max_term_months is shorter than term_low_income
      value: K('term_low_income')
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose max_term_months is shorter than
        term_partial
      value: K('term_partial')
    - when: otherwise
      value: P('max_term_months')
    baseline:
      cf_cap: P('max_term_months')
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: paused_balance_ceiling
    effect: parameter
    decides: cb_cap
    bindings:
    - cb_bal
    - cb_cap
    ladder:
    - when: >-
        plan ledger balance at least band_balance_high, on a tier whose max_term_months is shorter than band_term_high
      value: K('band_term_high')
    - when: >-
        plan ledger balance at least band_balance_mid (and the first tier not applying), on a tier whose max_term_months is shorter than band_term_mid
      value: K('band_term_mid')
    - when: otherwise
      value: P('max_term_months')
    baseline:
      cb_cap: P('max_term_months')
    evidence:
    - history
    cross_difficulty: null
