      if aw_status == 'pending_documents' else (int(MX(0, DAYS(receipt, NOW)) / K('full_period_days')) if aw_status == 'submitted' else 0)
  - paid_entries: >-
      COUNT('plan_transactions', event_type='plan_installment_paid') - COUNT('plan_transactions', event_type='plan_installment_paid', installment_number=0)
  - lengthened: remaining_now + P('add_on_term_extension_months') + waited
  - longest: MX(1, MN(lengthened, limit - paid_entries))
  - result: >-
      MN(F('monthly_payment_usd'), MX(lfloor, RND(F('monthly_payment_usd') * share / 100 + 0.000001, 2), RND(lo_bal / longest + 0.000001, 2)))
