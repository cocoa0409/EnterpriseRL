      schedule length is the plan's current number of scheduled installments (term_months) plus the installments moved, never longer than the longest re-aged
      schedule, which is the tier's max_term_months as standard, and never shorter than the current number of scheduled installments. A re-age settles every
      missed installment the plan records, so the plan's next due date moves forward one month, on the plan's due day, for each missed installment the plan
      recorded.
    params:
    - max_term_months
  inputs:
    history:
    - table: plan_transactions
      aggregate: count
      field: plan_txn_id
      filters:
        event_type: plan_installment_paid
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plan_installment_paid
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plan_balance_enrolled
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
