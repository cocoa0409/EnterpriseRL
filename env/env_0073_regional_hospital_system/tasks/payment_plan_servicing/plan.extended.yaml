    evidence:
    - cross_category
    cross_difficulty: assist
  baseline:
    rule: >-
      When balances have been added to a signed plan (active or past_due) since its installment was last figured, the installment is recomputed over the
      remaining schedule; an offer not yet signed is never recomputed under this rule. As standard, the remaining schedule is the plan's current number
      of scheduled installments (term_months) extended by the tier's add_on_term_extension_months, never beyond the longest recomputed schedule, which is
      the tier's max_term_months as standard, less the installments already paid, counted as the installment payment entries numbered 1 or more, and less
      the missed installments the plan records, which stay due apart from the schedule; the new installment is the plan balance divided by that remaining
      schedule (at least one installment), rounded half-up to the cent, never below the recompute floor, which is the tier's min_monthly_payment_usd as
      standard.
    params:
    - add_on_term_extension_months
    - max_term_months
    - min_monthly_payment_usd
