    - assist
- id: plan_ext_addon_recompute
  base_policy_refs:
  - plan_tier_and_installment
  - plan_add_on_balances
  - plan_balance_reduction
  - plan_patient_changes
  - plan_eligible_balances
  overwrite:
  - base_policy: plan_add_on_balances
    superseded_clause: >-
      The installment is then recomputed (add_on_recalc_basis): the remaining schedule is term_months extended by add_on_term_extension_months, but never
      beyond max_term_months, less the installments already paid; the new installment is the new plan balance divided by that remaining schedule, rounded
      half-up to the cent, never below min_monthly_payment_usd.
    replaced_by: >-
      When balances are added to a signed plan, its installment is recomputed under this rule over the remaining schedule this rule figures and never below
      the floor this rule gives; an offer not yet signed is re-figured under the offer re-figure rule instead.
  trigger: state_due
  subject:
  - plan_terms_modified
  computes: monthly_payment_usd
  target_tool: recompute_plan_installment_b9083db3
  params:
    fpl_low_income_max: 200.0
    fpl_partial_max: 400.0
    term_low_income: 60
    term_partial: 48
    ext_frequent: 12
    ext_repeat: 6
    addons_frequent: 3
    addons_repeat: 2
    class_series: 3
    class_acute: 2
    floor_low_income: 10.0
    floor_partial: 20.0
  rule: >-
    When balances have been added to a signed plan (active or past_due) since its installment was last figured, the installment is recomputed over the remaining
    schedule; an offer not yet signed is never recomputed under this rule. As standard, the remaining schedule is the plan's current number of scheduled
    installments (term_months) extended by the tier's add_on_term_extension_months, never beyond the longest recomputed schedule, which is the tier's max_term_months
    as standard, less the installments already paid, counted as the installment payment entries numbered 1 or more, and less the missed installments the
    plan records, which stay due apart from the schedule; the new installment is the plan balance divided by that remaining schedule (at least one installment),
    rounded half-up to the cent, never below the recompute floor, which is the tier's min_monthly_payment_usd as standard. The adjustments set out below
    are applied in this order: values that replace a standard input and installments added to the extended schedule come first, the longest recomputed schedule
    is applied to the extended schedule next, the installments already paid and the missed installments are taken away after that (leaving at least one
    installment), and the recompute floor is applied last to the divided figure. A financial assistance application of the patient is open when one of the
    patient's financial assistance cases stands in submitted or pending_documents status, a submitted case being taken first. The longest recomputed schedule
    follows the open application's screening: term_low_income installments for a household screened at or below fpl_low_income_max percent of the federal
    poverty level and term_partial installments for one screened above fpl_low_income_max and at or below fpl_partial_max percent, each only on tiers whose
    max_term_months is shorter; otherwise it is the tier's max_term_months. The extension follows how often care has been added to the plan: ext_frequent
    months when at least addons_frequent add-on enrollment entries (balances enrolled on a date other than the plan's offered date) were posted within the
    twelve whole months before the handling date, a date counting while fewer than twelve whole months have passed since it (whole months being counted
    the calendar way, a month complete only once the later date's day number reaches the earlier date's day number (from the 31st, a month without that
    day is not yet complete at its last day)), and ext_repeat months for exactly addons_repeat such entries, each only on tiers whose own add_on_term_extension_months
    is shorter; otherwise it is the tier's add_on_term_extension_months. The extended schedule also gains installments for the care the most recent add-on
    brought: class_series installments when the account of the latest add-on enrollment entry (the latest posting date other than the offered date, the
    first listed among entries of that date) is a Recurring Outpatient Therapy Account, class_acute installments when it is an Inpatient Admission Account
    or an Observation Stay Account, and none otherwise. The installments already paid are counted by how they were paid: when the installment payment entries
    numbered as the highest installment number among the entries total less than the current installment, which are partial payments that leave that installment
    not paid in full, they are the entries numbered 1 or more other than those partial entries; when there are no such entries and the installment payments
    numbered 1 or more total more than their count times the current installment, they are that total divided by the current installment and rounded down;
    otherwise they are the entries numbered 1 or more. The recompute floor follows the open application's screening: floor_low_income dollars for a household
    screened at or below fpl_low_income_max percent of the federal poverty level and floor_partial dollars for one screened above fpl_low_income_max and
    at or below fpl_partial_max percent, each only on tiers whose min_monthly_payment_usd is higher; otherwise it is the tier's min_monthly_payment_usd.
    The recomputed installment is fixed only after the installments that an open financial assistance application of the patient holds back have been paused
    and moved to the end of the schedule. The recomputed installment is not fixed until a plan that has fallen past due stands active again with no missed
    installment recorded. When balances are added to a signed plan, its installment is recomputed under this rule over the remaining schedule this rule
    figures and never below the floor this rule gives; an offer not yet signed is re-figured under the offer re-figure rule instead.
  prerequisite:
  - problem: plan_ext_assistance_pause
    kind: value_input
    form: action
    gate: sched_now
    resolved_by: pause_plan_installments_136536f5
    condition: >-
      payment_plans.term_months already includes the installments the open assistance application holds back (paused and moved to the end of the schedule).
    effect: >-
      The pause lengthens term_months by the paused installments, which lengthens the remaining schedule and lowers the recomputed installment.
    fallback_reason: >-
      The pause rewrites the plan's number of scheduled installments in place; no plan entry, status or date records that a pause was booked, so no record-visible
      state singles out that write.
    policy_source: >-
      The recomputed installment is fixed only after the installments that an open financial assistance application of the patient holds back have been
      paused and moved to the end of the schedule.
  - problem: plan_ext_reage_schedule
    kind: value_input
    form: state
    gate: missed_now
    resolved_by: reage_payment_plan_e7c586c0
    condition: payment_plans.status = active and payment_plans.missed_installments = 0 on a plan that was past_due.
    effect: >-
      The re-age clears the missed installments the plan records and lengthens term_months, so the remaining schedule no longer leaves them out and the
      recomputed installment falls.
    policy_source: >-
      The recomputed installment is not fixed until a plan that has fallen past due stands active again with no missed installment recorded.
