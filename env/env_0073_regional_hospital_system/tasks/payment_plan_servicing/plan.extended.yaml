  factors:
  - id: moved_installments
    effect: method
    decides: moved
    bindings:
    - mv_no
    - mv_part_n
    - mv_part_sum
    - mv_receipt
    - moved
    ladder:
    - when: >-
        installment payment entries posted with the number of the installment due on the plan's next due date (partial payments)
      method: >-
        the whole installments the unpaid missed amount makes up: missed installments times the installment, less those partial payments, divided by the
        installment and rounded down; an unpaid part of less than one installment is closed into the plan balance
    - when: no such entries, and the open application received after the plan's next due date
      method: >-
        the installments falling due from the next due date through the receipt date: whole months from the next due date to the receipt date, plus one
    - when: otherwise
      method: the recorded missed installments (missed_installments)
    baseline:
      moved: F('missed_installments')
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: assist
  - id: reage_deferrals
    effect: parameter
    decides: deferrals
    bindings:
    - df_fpl
    - deferrals
    - deferred
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose skip_payments_per_plan is below deferrals_low_income
      value: K('deferrals_low_income')
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose skip_payments_per_plan is below
        deferrals_partial
      value: K('deferrals_partial')
    - when: otherwise
      value: '0'
    baseline:
      deferrals: '0'
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: reaged_screening_ceiling
    effect: parameter
    decides: cf_cap
    bindings:
    - cf_fpl
    - cf_cap
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose max_term_months is shorter than term_low_income
      value: K('term_low_income')
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose max_term_months is shorter than
        term_partial
      value: K('term_partial')
    - when: otherwise
      value: P('max_term_months')
    baseline:
      cf_cap: P('max_term_months')
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: reaged_balance_ceiling
    effect: parameter
    decides: cb_cap
    bindings:
    - cb_bal
    - cb_cap
    ladder:
    - when: >-
        plan ledger balance at least band_balance_high, on a tier whose max_term_months is shorter than band_term_high
      value: K('band_term_high')
    - when: >-
        plan ledger balance at least band_balance_mid (and the first tier not applying), on a tier whose max_term_months is shorter than band_term_mid
      value: K('band_term_mid')
    - when: otherwise
      value: P('max_term_months')
    baseline:
      cb_cap: P('max_term_months')
    evidence:
    - history
    cross_difficulty: null
  - id: reaged_record_ceiling
    effect: parameter
    decides: ch_cap
    bindings:
    - ch_paid
    - ch_cap
    ladder:
    - when: >-
        at least record_paid_long installment payment entries numbered 1 or more, on a tier whose max_term_months is shorter than record_term_long
      value: K('record_term_long')
    - when: >-
        at least record_paid_short but fewer than record_paid_long such entries, on a tier whose max_term_months is shorter than record_term_short
      value: K('record_term_short')
    - when: otherwise
      value: P('max_term_months')
    baseline:
      ch_cap: P('max_term_months')
    evidence:
    - history
    cross_difficulty: null
