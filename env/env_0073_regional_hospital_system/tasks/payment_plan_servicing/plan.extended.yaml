  factors:
  - id: refigure_balance
    effect: method
    decides: rf_basis
    bindings:
    - rf_bh
    - rf_bhe
    - rf_br
    - rf_bt
    - rf_basis
    ladder:
    - when: >-
        the first of the patient's accounts listed on a charge-dispute billing hold is an account enrolled on the offer
      method: 're-figure balance: the enrolled total less the amount enrolled for that account'
    - when: that tier not applying, and reductions booked on the offer
      method: 're-figure balance: the offer''s ledger balance, the amounts enrolled less the reductions booked'
    - when: otherwise
      method: 're-figure balance: the enrolled total'
    baseline:
      rf_basis: rf_bt
    evidence:
    - history
    - cross_category
    cross_difficulty: encounter
  - id: deducted_down_share
    effect: parameter
    decides: dd_pct
    bindings:
    - dd_fpl
    - dd_pct
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose down_payment_pct is above 0
      value: '0'
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose down_payment_pct is above down_partial
      value: K('down_partial')
    - when: otherwise
      value: P('down_payment_pct')
    baseline:
      dd_pct: P('down_payment_pct')
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: offer_screening_term
    effect: parameter
    decides: tf_term
    bindings:
    - tf_fpl
    - tf_term
    ladder:
    - when: >-
        offer carries the tier's max_term_months, open application screened at or below fpl_low_income_max percent FPL, on a tier whose max_term_months
        is shorter than term_low_income
      value: K('term_low_income')
    - when: >-
        offer carries the tier's max_term_months, open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier
        whose max_term_months is shorter than term_partial
      value: K('term_partial')
    - when: otherwise
      value: F('term_months')
    baseline:
      tf_term: F('term_months')
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: offer_balance_term
    effect: parameter
    decides: tb_term
    bindings:
    - tb_bal
    - tb_term
    ladder:
    - when: >-
        offer carries the tier's max_term_months, offer ledger balance at least band_balance_high, on a tier whose max_term_months is shorter than band_term_high
      value: K('band_term_high')
    - when: >-
        offer carries the tier's max_term_months, offer ledger balance at least band_balance_mid (the first tier not applying), on a tier whose max_term_months
        is shorter than band_term_mid
      value: K('band_term_mid')
    - when: otherwise
      value: F('term_months')
    baseline:
      tb_term: F('term_months')
    evidence:
    - history
    cross_difficulty: null
  - id: offer_floor
    effect: parameter
    decides: ofloor
    bindings:
    - of_fpl
    - ofloor
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose min_monthly_payment_usd is above floor_low_income
      value: K('floor_low_income')
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose min_monthly_payment_usd is above
        floor_partial
      value: K('floor_partial')
    - when: otherwise
      value: P('min_monthly_payment_usd')
    baseline:
      ofloor: P('min_monthly_payment_usd')
    evidence:
    - cross_category
    cross_difficulty: assist
  baseline:
    rule: >-
      An offer the patient has not yet signed (pending_signature) is re-figured on the balance it carries when that balance has changed since the offer
      was made, an add-on enrolled on the offer included; a signed plan is never re-figured under this rule. As standard, the re-figure balance is the enrolled
      total, the down payment deducted is the deducted down-payment share (the tier's down_payment_pct as standard) of the re-figure balance, rounded half-up
      to the cent, the financed amount is the re-figure balance less that deduction, the term used is the offer's term_months, and the installment is the
      financed amount divided by the term used, rounded half-up to the cent, never below the offer floor, which is the tier's min_monthly_payment_usd as
      standard; the offer is then booked with that installment and the term used, except that when the offer floor applies it is booked with as many installments
      as that floor needs, the financed amount divided by the offer floor and rounded up to a whole installment.
    params:
    - down_payment_pct
    - min_monthly_payment_usd
    - max_term_months
  inputs:
    history:
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plan_balance_enrolled
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plan_balance_reduced
    cross_category:
    - assist
    - encounter
- id: plan_ext_signing_down_payment
  base_policy_refs:
  - plan_signature_and_activation
  - plan_tier_and_installment
  overwrite:
  - base_policy: plan_tier_and_installment
    superseded_clause: >-
      The down payment is down_payment_pct of the enrolled total, rounded half-up to the cent, due at signing.
    replaced_by: >-
      For a signing under this rule, the down payment due at signing is the amount this rule sets; a plan is still offered at its creation with down_payment_pct
      of the enrolled total, rounded half-up to the cent, and the down payment deducted when an unsigned offer is re-figured is the one the offer re-figure
      rule sets.
  - base_policy: plan_signature_and_activation
    superseded_clause: Any down payment is paid at signing.
    replaced_by: >-
      For a signing under this rule, the part of the down payment this rule leaves is paid at signing and any part it holds for a BadgerCare Plus screening
      is paid when that screening ends; every other signing still pays any down payment at signing.
  trigger: on_request
  subject:
  - plan_signed
  computes: down_payment_usd
  target_tool: sign_plan_agreement_1c5ceaa0
  params:
    fpl_low_income_max: 200.0
    fpl_partial_max: 400.0
    down_partial: 5.0
    gap_one: 45
    gap_two: 60
    hold_near: 50.0
    hold_far: 25.0
    hold_fpl_near: 250.0
    hold_fpl_far: 300.0
  rule: >-
    The patient signs the agreement personally, and the down payment is paid at signing; the plan then starts. As standard, the down payment is the signing
    share (the tier's down_payment_pct as standard) of the signing balance (the enrolled total as standard), rounded half-up to the cent. The adjustments
    set out below are applied in this order: the signing share of the signing balance is taken first, a percentage held back is taken off it next and the
    part left is rounded half-up to the cent, an amount credited is taken away after that with the figure never falling below zero, and amounts added to
    it come last. A financial assistance application of the patient is open when one of the patient's financial assistance cases stands in submitted or
    pending_documents status, a submitted case being taken first. The signing share follows the open application's screening: none for a household screened
    at or below fpl_low_income_max percent of the federal poverty level and down_partial percent for one screened above fpl_low_income_max and at or below
    fpl_partial_max percent, each only on tiers whose down_payment_pct is higher; otherwise it is the tier's down_payment_pct. The signing balance follows
    what has happened to the enrolled accounts: when the first of the patient's accounts listed on a charge-dispute billing hold is an account enrolled
    on the offer, it is the enrolled total less the amount enrolled for that account; when that does not apply and reductions have been booked on the offer,
    it is the offer's ledger balance, the amounts enrolled less the reductions booked; otherwise it is the enrolled total. While BadgerCare Plus is screening
    the patient, part of the down payment is held until the screening ends rather than collected at signing: when a BadgerCare Plus screening referral notice
    has been sent on the open case and no BadgerCare Plus determination notice has been received as a document of the case, hold_near percent of it is held
    for a household screened at or below hold_fpl_near percent of the federal poverty level and hold_far percent of it for one screened above hold_fpl_near
    and at or below hold_fpl_far percent; otherwise none is held. A patient payment made after the offer on an account enrolled on the offer is credited
    against the down payment, never below zero: the latest payment posted on any of the patient's accounts (the first listed among payments of that date)
    counts when its posting date is after the offered date and its account is enrolled on the offer; when it pays at least the amount enrolled for that
    account, that enrolled amount is credited, when it is smaller, the payment itself is credited, and otherwise nothing is credited. When the offer's first
    due date lies far from the signing date, installments are collected together with the down payment: two installments when the first due date is more
    than gap_two days after the signing date, one installment when it is more than gap_one but at most gap_two days after it, and none otherwise, each installment
    being the offer's current installment. For a signing under this rule, the part of the down payment this rule leaves is paid at signing and any part
    it holds for a BadgerCare Plus screening is paid when that screening ends; every other signing still pays any down payment at signing. The down payment
    is not fixed until the offer's installment has been re-figured on the balance the offer carries. For a signing under this rule, the down payment due
    at signing is the amount this rule sets; a plan is still offered at its creation with down_payment_pct of the enrolled total, rounded half-up to the
    cent, and the down payment deducted when an unsigned offer is re-figured is the one the offer re-figure rule sets.
  prerequisite:
  - problem: plan_ext_offer_refigure
    kind: value_input
    form: action
    gate: first_part
    resolved_by: refigure_plan_offer_04613189
    condition: >-
      payment_plans.monthly_payment_usd on the unsigned offer equals the installment re-figured on the balance the offer carries.
    effect: >-
      The re-figure sets the offer's current installment, which is the amount of each installment collected at signing.
    fallback_reason: >-
      The re-figure rewrites the offer's installment amount in place; no entry, status or date on the offer records that it was re-figured, so no record-visible
      state singles out that write.
    policy_source: >-
      The down payment is not fixed until the offer's installment has been re-figured on the balance the offer carries.
  cross_category:
  - category: assist
    as: branch
    reads:
    - status
    - household_fpl_pct
    - assistance_transactions.notice_type
    - assistance_transactions.document_type
    - assistance_transactions.document_status
    note: >-
      The open application's screening and BadgerCare Plus referral state decide the signing share and the screening hold.
  - category: encounter
    as: history
    reads:
    - billing_hold_reason
    - encounter_transactions.posting_date
    - encounter_transactions.amount
    - encounter_transactions.encounter_id
    note: >-
      A charge-dispute hold decides the signing balance; the latest patient payment after the offer decides the credit.
  compute:
  - case_submitted: CFIELD('assist', 'fap_case_id', status='submitted')
  - case_pending: CFIELD('assist', 'fap_case_id', status='pending_documents')
  - open_case: case_submitted if case_submitted != None else case_pending
  - sg_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - sg_pct: >-
      0 if (open_case != None and sg_fpl != None and sg_fpl <= K('fpl_low_income_max') and P('down_payment_pct') > 0) else (K('down_partial') if (open_case
      != None and sg_fpl != None and sg_fpl > K('fpl_low_income_max') and sg_fpl <= K('fpl_partial_max') and P('down_payment_pct') > K('down_partial'))
      else P('down_payment_pct'))
  - sb_bh: CFIELD('encounter', 'encounter_id', billing_hold_reason='CHARGE_DISPUTE')
  - sb_bhe: >-
      SUM('plan_transactions', 'amount', event_type='plan_balance_enrolled', encounter_id=sb_bh) if sb_bh != None else 0
  - sb_br: SUM('plan_transactions', 'amount', event_type='plan_balance_reduced')
  - sb_bt: SUM('plan_transactions', 'amount', event_type='plan_balance_enrolled')
  - sb_basis: (sb_bt - sb_bhe) if sb_bhe > 0 else ((sb_bt - sb_br) if sb_br > 0 else sb_bt)
  - hd_refs: >-
      XCOUNT('assist', 'assistance_transactions', fap_case_id=open_case, event_type='assist_notice_sent', notice_type='MEDICAID_SCREENING_REFERRAL') if
      open_case != None else 0
  - hd_dets: >-
      XCOUNT('assist', 'assistance_transactions', fap_case_id=open_case, event_type='assist_document_logged', document_type='MEDICAID_DETERMINATION_NOTICE',
      document_status='RECEIVED') if open_case != None else 0
  - hd_fpl: CFIELD('assist', 'household_fpl_pct', fap_case_id=open_case) if open_case != None else None
  - hold_pct: >-
      K('hold_near') if (open_case != None and hd_refs > 0 and hd_dets == 0 and hd_fpl != None and hd_fpl <= K('hold_fpl_near')) else (K('hold_far') if
      (open_case != None and hd_refs > 0 and hd_dets == 0 and hd_fpl != None and hd_fpl > K('hold_fpl_near') and hd_fpl <= K('hold_fpl_far')) else 0)
  - cr_date: >-
      XLATEST('encounter', 'encounter_transactions', 'posting_date', date_field='posting_date', event_type='encounter_payment_posted')
  - cr_enc: >-
      XLATEST('encounter', 'encounter_transactions', 'encounter_id', date_field='posting_date', event_type='encounter_payment_posted')
  - cr_amt: >-
      XLATEST('encounter', 'encounter_transactions', 'amount', date_field='posting_date', event_type='encounter_payment_posted')
  - cr_enrolled: >-
      SUM('plan_transactions', 'amount', event_type='plan_balance_enrolled', encounter_id=cr_enc) if cr_enc != None else 0
  - credit: >-
      cr_enrolled if (cr_date and DAYS(F('offered_date'), cr_date) > 0 and cr_enrolled > 0 and cr_amt >= cr_enrolled) else (cr_amt if (cr_date and DAYS(F('offered_date'),
      cr_date) > 0 and cr_enrolled > 0) else 0)
  - first_gap: DAYS(NOW, F('first_due_date')) if F('first_due_date') else 0
  - first_part: >-
      RND(2 * F('monthly_payment_usd') + 0.000001, 2) if first_gap > K('gap_two') else (RND(F('monthly_payment_usd') + 0.000001, 2) if (first_gap > K('gap_one')
      and first_gap <= K('gap_two')) else 0)
  - share_due: RND(sb_basis * sg_pct / 100 + 0.000001, 2)
  - result: >-
      RND(MX(0, RND(share_due * (100 - hold_pct) / 100 + 0.000001, 2) - credit) + first_part + 0.000001, 2)
  compute_basis:
    case_submitted: >-
      A financial assistance application of the patient is open when one of the patient's financial assistance cases stands in submitted or pending_documents
      status, a submitted case being taken first.
    case_pending: >-
      A financial assistance application of the patient is open when one of the patient's financial assistance cases stands in submitted or pending_documents
      status, a submitted case being taken first.
    open_case: >-
      A financial assistance application of the patient is open when one of the patient's financial assistance cases stands in submitted or pending_documents
      status, a submitted case being taken first.
    sg_fpl: >-
      The signing share follows the open application's screening: none for a household screened at or below fpl_low_income_max percent of the federal poverty
      level and down_partial percent for one screened above fpl_low_income_max and at or below fpl_partial_max percent, each only on tiers whose down_payment_pct
      is higher; otherwise it is the tier's down_payment_pct.
    sg_pct: >-
      The signing share follows the open application's screening: none for a household screened at or below fpl_low_income_max percent of the federal poverty
      level and down_partial percent for one screened above fpl_low_income_max and at or below fpl_partial_max percent, each only on tiers whose down_payment_pct
      is higher; otherwise it is the tier's down_payment_pct.
    sb_bh: >-
      The signing balance follows what has happened to the enrolled accounts: when the first of the patient's accounts listed on a charge-dispute billing
      hold is an account enrolled on the offer, it is the enrolled total less the amount enrolled for that account; when that does not apply and reductions
      have been booked on the offer, it is the offer's ledger balance, the amounts enrolled less the reductions booked; otherwise it is the enrolled total.
    sb_bhe: >-
      The signing balance follows what has happened to the enrolled accounts: when the first of the patient's accounts listed on a charge-dispute billing
      hold is an account enrolled on the offer, it is the enrolled total less the amount enrolled for that account; when that does not apply and reductions
      have been booked on the offer, it is the offer's ledger balance, the amounts enrolled less the reductions booked; otherwise it is the enrolled total.
    sb_br: >-
      The signing balance follows what has happened to the enrolled accounts: when the first of the patient's accounts listed on a charge-dispute billing
      hold is an account enrolled on the offer, it is the enrolled total less the amount enrolled for that account; when that does not apply and reductions
      have been booked on the offer, it is the offer's ledger balance, the amounts enrolled less the reductions booked; otherwise it is the enrolled total.
    sb_bt: >-
      The signing balance follows what has happened to the enrolled accounts: when the first of the patient's accounts listed on a charge-dispute billing
      hold is an account enrolled on the offer, it is the enrolled total less the amount enrolled for that account; when that does not apply and reductions
      have been booked on the offer, it is the offer's ledger balance, the amounts enrolled less the reductions booked; otherwise it is the enrolled total.
    sb_basis: >-
      The signing balance follows what has happened to the enrolled accounts: when the first of the patient's accounts listed on a charge-dispute billing
      hold is an account enrolled on the offer, it is the enrolled total less the amount enrolled for that account; when that does not apply and reductions
      have been booked on the offer, it is the offer's ledger balance, the amounts enrolled less the reductions booked; otherwise it is the enrolled total.
    hd_refs: >-
      While BadgerCare Plus is screening the patient, part of the down payment is held until the screening ends rather than collected at signing: when a
      BadgerCare Plus screening referral notice has been sent on the open case and no BadgerCare Plus determination notice has been received as a document
      of the case, hold_near percent of it is held for a household screened at or below hold_fpl_near percent of the federal poverty level and hold_far
      percent of it for one screened above hold_fpl_near and at or below hold_fpl_far percent; otherwise none is held.
    hd_dets: >-
      While BadgerCare Plus is screening the patient, part of the down payment is held until the screening ends rather than collected at signing: when a
      BadgerCare Plus screening referral notice has been sent on the open case and no BadgerCare Plus determination notice has been received as a document
      of the case, hold_near percent of it is held for a household screened at or below hold_fpl_near percent of the federal poverty level and hold_far
      percent of it for one screened above hold_fpl_near and at or below hold_fpl_far percent; otherwise none is held.
    hd_fpl: >-
      While BadgerCare Plus is screening the patient, part of the down payment is held until the screening ends rather than collected at signing: when a
      BadgerCare Plus screening referral notice has been sent on the open case and no BadgerCare Plus determination notice has been received as a document
      of the case, hold_near percent of it is held for a household screened at or below hold_fpl_near percent of the federal poverty level and hold_far
      percent of it for one screened above hold_fpl_near and at or below hold_fpl_far percent; otherwise none is held.
    hold_pct: >-
      While BadgerCare Plus is screening the patient, part of the down payment is held until the screening ends rather than collected at signing: when a
      BadgerCare Plus screening referral notice has been sent on the open case and no BadgerCare Plus determination notice has been received as a document
      of the case, hold_near percent of it is held for a household screened at or below hold_fpl_near percent of the federal poverty level and hold_far
      percent of it for one screened above hold_fpl_near and at or below hold_fpl_far percent; otherwise none is held.
    cr_date: >-
      A patient payment made after the offer on an account enrolled on the offer is credited against the down payment, never below zero: the latest payment
      posted on any of the patient's accounts (the first listed among payments of that date) counts when its posting date is after the offered date and
      its account is enrolled on the offer; when it pays at least the amount enrolled for that account, that enrolled amount is credited, when it is smaller,
      the payment itself is credited, and otherwise nothing is credited.
    cr_enc: >-
      A patient payment made after the offer on an account enrolled on the offer is credited against the down payment, never below zero: the latest payment
      posted on any of the patient's accounts (the first listed among payments of that date) counts when its posting date is after the offered date and
      its account is enrolled on the offer; when it pays at least the amount enrolled for that account, that enrolled amount is credited, when it is smaller,
      the payment itself is credited, and otherwise nothing is credited.
    cr_amt: >-
      A patient payment made after the offer on an account enrolled on the offer is credited against the down payment, never below zero: the latest payment
      posted on any of the patient's accounts (the first listed among payments of that date) counts when its posting date is after the offered date and
      its account is enrolled on the offer; when it pays at least the amount enrolled for that account, that enrolled amount is credited, when it is smaller,
      the payment itself is credited, and otherwise nothing is credited.
    cr_enrolled: >-
      A patient payment made after the offer on an account enrolled on the offer is credited against the down payment, never below zero: the latest payment
      posted on any of the patient's accounts (the first listed among payments of that date) counts when its posting date is after the offered date and
      its account is enrolled on the offer; when it pays at least the amount enrolled for that account, that enrolled amount is credited, when it is smaller,
      the payment itself is credited, and otherwise nothing is credited.
    credit: >-
      A patient payment made after the offer on an account enrolled on the offer is credited against the down payment, never below zero: the latest payment
      posted on any of the patient's accounts (the first listed among payments of that date) counts when its posting date is after the offered date and
      its account is enrolled on the offer; when it pays at least the amount enrolled for that account, that enrolled amount is credited, when it is smaller,
      the payment itself is credited, and otherwise nothing is credited.
    first_gap: >-
      When the offer's first due date lies far from the signing date, installments are collected together with the down payment: two installments when the
      first due date is more than gap_two days after the signing date, one installment when it is more than gap_one but at most gap_two days after it, and
      none otherwise, each installment being the offer's current installment.
    first_part: >-
      When the offer's first due date lies far from the signing date, installments are collected together with the down payment: two installments when the
      first due date is more than gap_two days after the signing date, one installment when it is more than gap_one but at most gap_two days after it, and
      none otherwise, each installment being the offer's current installment.
    share_due: >-
      As standard, the down payment is the signing share (the tier's down_payment_pct as standard) of the signing balance (the enrolled total as standard),
      rounded half-up to the cent.
    result: >-
      The adjustments set out below are applied in this order: the signing share of the signing balance is taken first, a percentage held back is taken
      off it next and the part left is rounded half-up to the cent, an amount credited is taken away after that with the figure never falling below zero,
      and amounts added to it come last.
  factors:
  - id: signing_share
    effect: parameter
    decides: sg_pct
    bindings:
    - sg_fpl
    - sg_pct
    ladder:
    - when: >-
        open application screened at or below fpl_low_income_max percent FPL, on a tier whose down_payment_pct is above 0
      value: '0'
    - when: >-
        open application screened above fpl_low_income_max and at or below fpl_partial_max percent FPL, on a tier whose down_payment_pct is above down_partial
      value: K('down_partial')
    - when: otherwise
      value: P('down_payment_pct')
    baseline:
      sg_pct: P('down_payment_pct')
    evidence:
    - cross_category
    cross_difficulty: assist
  - id: signing_balance
    effect: method
    decides: sb_basis
    bindings:
    - sb_bh
    - sb_bhe
    - sb_br
    - sb_bt
    - sb_basis
    ladder:
    - when: >-
        the first of the patient's accounts listed on a charge-dispute billing hold is an account enrolled on the offer
      method: 'signing balance: the enrolled total less the amount enrolled for that account'
    - when: that tier not applying, and reductions booked on the offer
      method: 'signing balance: the offer''s ledger balance, the amounts enrolled less the reductions booked'
    - when: otherwise
      method: 'signing balance: the enrolled total'
    baseline:
      sb_basis: sb_bt
    evidence:
    - history
    - cross_category
    cross_difficulty: encounter
  - id: screening_hold
    effect: parameter
    decides: hold_pct
    bindings:
    - hd_refs
    - hd_dets
    - hd_fpl
    - hold_pct
    ladder:
    - when: >-
        a BadgerCare Plus screening referral notice sent on the open case and no determination notice received, and the household screened at or below hold_fpl_near
        percent FPL
      value: K('hold_near')
    - when: >-
        the same referral state, and the household screened above hold_fpl_near and at or below hold_fpl_far percent FPL
      value: K('hold_far')
    - when: otherwise
      value: '0'
    baseline:
      hold_pct: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: assist
  - id: post_offer_payment_credit
    effect: method
    decides: credit
    bindings:
    - cr_date
    - cr_enc
    - cr_amt
    - cr_enrolled
    - credit
    ladder:
    - when: >-
        the latest patient payment posted after the offered date on an account enrolled on the offer, paying at least that account's enrolled amount
      method: credit the amount enrolled for the paid account (the payment covers it in full)
    - when: such a payment, smaller than the account's enrolled amount
      method: credit the payment's own amount
    - when: otherwise (no payment after the offered date on an enrolled account)
      method: credit nothing
    baseline:
      credit: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: encounter
  - id: installments_at_signing
    effect: parameter
    decides: first_part
    bindings:
    - first_gap
    - first_part
    ladder:
    - when: first due date more than gap_two days after the signing date
      value: two times the offer's current installment
    - when: first due date more than gap_one but at most gap_two days after the signing date
      value: the offer's current installment
    - when: otherwise
      value: '0'
    baseline:
      first_part: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The patient signs the agreement personally, and the down payment is paid at signing; the plan then starts. As standard, the down payment is the signing
      share (the tier's down_payment_pct as standard) of the signing balance (the enrolled total as standard), rounded half-up to the cent.
    params:
    - down_payment_pct
  inputs:
    history:
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plan_balance_enrolled
    - table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plan_balance_reduced
    - category: encounter
      table: encounter_transactions
      aggregate: latest
      field: posting_date
      filters:
        event_type: encounter_payment_posted
    - category: assist
      table: assistance_transactions
      aggregate: count
      field: fap_txn_id
      filters:
        notice_type: MEDICAID_SCREENING_REFERRAL
    cross_category:
    - assist
    - encounter
