difficulties:
  - name: medicare_part_a_coinsurance_and_coverage_end
    claim:
      categories: [medicare]
      event_types: [medicare_coverage_activate, medicare_coverage_decline, medicare_coverage_update, medicare_days_booked, medicare_days_reversed, medicare_coinsurance_charge, medicare_coinsurance_payment, medicare_coinsurance_adjustment, medicare_payment_reversal, medicare_nomnc_delivered, medicare_appeal_requested, medicare_coverage_end, medicare_snfabn_delivered, medicare_coverage_close]
    summary: >
      Callers are residents on a Medicare Part A skilled stay, or the adult children and agents who pay their bills, asking why a coinsurance statement arrived, how many benefit days are left, why a Medigap policy or QMB status did not absorb a charge, why coverage is ending on a given date, or how to contest that date; the setting varies across the six supplemental tiers, an episode anywhere from pending_verification to coverage_ended, earlier SNF days already used in the same benefit period, readmissions after a hospital trip, leave or hospital days inside a billing month, service months that straddle a calendar year, and payments that were later returned.
      The records are the coverage episode and its ledger, read together with the resident's Medical Assistance case (QMB and crossover status), bed-hold reservations (leave and hospital days) and private-pay agreement (who pays once Part A ends); the rules take the shape of qualifying-stay and transfer-window gates in medicare_qualifying_stay, benefit-period day numbering across episodes in medicare_agg_benefit_period, the midnight census and the days 1-20 / 21-100 band split in medicare_evt_day_counting, year-of-service coinsurance priced and split per tier in medicare_evt_coinsurance, QMB write-offs and Medigap denial rebills in medicare_evt_secondary_and_qmb, charge-by-charge posting and returned payments in medicare_evt_payment_posting, NOMNC lead time and the endings that need no notice in medicare_coverage_notice, appeal timeliness in medicare_appeal, the SNF ABN in medicare_evt_snfabn and closing only at a zero balance in medicare_coverage_closure.
      As background, an episode is verified before days are booked, booked coinsurance days are priced before any payment can be applied to them, and a delivered NOMNC precedes any notice-based end of coverage.
      Verifying the caller, confirming or declining coverage, recording supplemental changes, booking and reversing days, posting charges, payments, adjustments and returned payments, recording NOMNC delivery, ending and closing episodes are the agent's service actions, while asking the Quality Improvement Organization for an expedited determination and checking an option on the SNF ABN belong to the resident or representative alone and are handed over as user actions.
      Disputes over whether the resident still clinically needs skilled care, Medicare Advantage authorizations and copays, requests to waive or discount coinsurance as a courtesy, arguments with a Medigap carrier beyond rebilling a denied share, and the outcome of a demand bill Medicare has not yet decided are not decided by any published rule, and the only correct route for them is a POLICY_NOT_COVERED handoff.
  - name: private_pay_residency_billing
    claim:
      categories: [private]
      event_types: [private_admission, private_room_change, private_rate_notice_delivered, private_room_board_charge, private_fee_charge, private_payment, private_payment_reversal, private_adjustment, private_refund, private_deposit_received, private_deposit_disposition, private_discharge_notice, private_notice_rescinded, private_discharge, private_payer_conversion, private_payer_reversion, private_collection_referral, private_close]
    summary: >
      Callers are families paying privately for long-term or memory care who ask why a monthly statement changed, whether a rate increase applies yet, what a room move costs, why a late charge or returned-payment fee appeared, when a deposit or prepaid month comes back after a move-out or a death, what happens to private charges once Medicare or a Medicaid application takes over, and whether the center may discharge their parent over an unpaid balance; the setting varies across the six accommodation tiers, agreements that are active, under a discharge notice, converted to another payer source or discharged, mid-month room changes and infection-control placements, late or missing rate notices, and payment histories with dishonored checks.
      The records are the admission agreement, its ledger and the resident's own requests, read alongside the Medicare coverage episode, the Medical Assistance case and bed-hold reservations; the rules take the shape of effective-dated rates and the advance notice gate in private_rate_schedule, advance monthly billing, census days and isolation pricing in private_evt_room_board_billing, clinical tier criteria in private_tier_placement, posting, returned-payment fees and certified-funds status in private_evt_payments, the past-due late charge and its suppression in private_evt_late_charge, permitted reasons, notice periods, the Medicaid-application bar and the appeal stay in private_discharge_rules, prorated credits and refunds in private_evt_discharge_refund, deposits in private_deposit, payer conversion and reversion in private_payer_source_change, collection referral age in private_evt_collections and settlement before closing in private_agreement_closure.
      As background, a month is charged before it can be paid, a charge must exist before it can be prorated or refunded, and a discharge or conversion precedes the deposit disposition and the final refund.
      Posting charges, fees, payments, reversals, credits, refunds, deposit movements, tier changes, discharge notices, conversions and collection referrals are the agent's service actions, while giving notice of a voluntary move-out, telling the center of an appeal of a discharge notice, asking for a room change and designating the payee of a refund belong to the resident or representative and are handed over as user actions.
      Requests to negotiate a lower private rate, to hold a room for a resident who has not been admitted, disputes about the quality of care offered as a reason not to pay, and claims against a long-term care insurer's benefit decision are not decided by any published rule, and the only correct route for them is a POLICY_NOT_COVERED handoff.
  - name: medicaid_pending_and_patient_pay
    claim:
      categories: [medicaid]
      event_types: [medicaid_case_open, medicaid_application_submitted, medicaid_eligibility_approved, medicaid_eligibility_denied, medicaid_hearing_requested, medicaid_case_update, medicaid_patient_pay_charge, medicaid_patient_pay_payment, medicaid_patient_pay_adjustment, medicaid_patient_pay_refund, medicaid_pending_accrual, medicaid_pending_settlement, medicaid_verification_forwarded, medicaid_past_due_notice, medicaid_denied_close, medicaid_eligible_close]
    summary: >
      Callers are spouses, adult children and agents under power of attorney of residents who have run down their savings, asking how much to pay each month while a Medical Assistance application is pending, why the patient pay on the County Assistance Office notice differs from what they have been paying, what the Medicaid-pending balance means and whether they will ever owe it, how a retroactive approval, a transfer penalty or a denial changes what is owed, and how to contest a denial; the setting varies across the six allowance tiers, cases from application_preparing to closed, requested eligibility dates reaching back several months, January cost-of-living changes, months of admission, discharge or death, and residents whose patient pay is drawn from a trust account or received by the center as representative payee.
      The records are the case, its ledger and the resident's application actions, read with the private-pay agreement (the private rate that accrues and the months billed privately), the trust fund account and the bed-hold reservations; the rules take the shape of signature and retroactive-date gates in medicaid_application, document handling in medicaid_evt_verification, the per-tier estimated patient pay formula in medicaid_evt_pending_estimate, actual patient pay, partial-month caps and true-ups in medicaid_evt_patient_pay_actual, accrual and settlement of the pending balance by outcome in medicaid_evt_pending_balance, posting, past-due notices and refunds in medicaid_evt_payments, hearing timeliness in medicaid_eligibility_decision and tier and closing rules in medicaid_case_maintenance, with cross-case settlement in medicaid_agg_case_balances.
      As background, a case is opened and the application submitted before any decision, pending months accrue before the outcome settles them, and estimated patient pay is billed before an approval reconciles it.
      Opening and updating cases, submitting signed applications, forwarding documents, recording decisions, billing, posting, reconciling and refunding patient pay, accruing and settling the pending balance and closing cases are the agent's service actions, while signing the application or the authorized-representative designation, withdrawing an application and requesting a fair hearing belong to the resident or legal representative and are handed over as user actions.
      Questions about whether an asset transfer will be penalized before the County Assistance Office has decided, requests to compute a community spouse resource allowance, estate recovery after death, and appeals of the amount of an approved patient pay are not decided by any published rule, and the only correct route for them is a POLICY_NOT_COVERED handoff.
  - name: bed_hold_and_leave_reservations
    claim:
      categories: [bedhold]
      event_types: [bedhold_reservation_open, bedhold_hold_elected, bedhold_hold_declined, bedhold_extension_elected, bedhold_returned, bedhold_released, bedhold_expired, bedhold_day_booked, bedhold_day_reversed, bedhold_charge, bedhold_payment, bedhold_adjustment, bedhold_notice_delivered]
    summary: >
      Callers are families whose parent has just gone to the hospital or is going home for a visit, asking whether the room will be held, how many days Medical Assistance pays for, what a private hold costs per day, why a bed-hold charge appeared for days before they heard from anyone, whether they can stop paying for a hold, and where their parent will go when coming back after the hold ended; the setting varies across the six payer-and-leave tiers, reservations from notice_pending to returned, released or expired, therapeutic days already used earlier in the calendar year, long hospitalizations that outrun the payer-covered days, emergency transfers in the middle of the night, and holds whose charges went unpaid.
      The records are the reservation, its ledger and the written elections, read with the private pay schedule tier of the room held, the resident's Medical Assistance case and Medicare coverage episode and the trust fund account that may pay the charges; the rules take the shape of payer day limits counted per hospitalization and per calendar year in bedhold_agg_payer_day_limits, notice timing and the no-charge-before-notice rule in bedhold_evt_notice, automatic and written elections, the election window and private extensions in bedhold_election, midnight leave-day counting in bedhold_evt_day_counting, per-tier pricing in bedhold_evt_charges, posting and reductions in bedhold_evt_payments_adjustments, and returns, releases, unpaid-hold endings and readmission rights in bedhold_hold_end.
      As background, a reservation is opened when the leave begins, held days are booked before any private day is charged, and a charge exists before it can be paid or reduced.
      Opening reservations, recording notices, starting payer-covered holds, booking and reversing days, charging, posting payments and reductions, recording returns and ending holds are the agent's service actions, while electing or declining a hold, extending it at private expense and releasing the bed belong to the resident or representative and are handed over as user actions.
      Disputes over the hospital's discharge plan, requests to hold a different room than the one the resident left, transfers to another Keystone Ridge center and complaints about the clinical reason for the transfer are not decided by any published rule, and the only correct route for them is a POLICY_NOT_COVERED handoff.
  - name: resident_trust_fund_accounts
    claim:
      categories: [trust]
      event_types: [trust_account_open, trust_authorization_signed, trust_account_update, trust_deposit, trust_interest_credit, trust_withdrawal, trust_bill_transfer, trust_reversal, trust_statement_issued, trust_resource_notice, trust_conveyance_started, trust_conveyance, trust_conveyance_completed]
    summary: >
      Callers are residents, agents under power of attorney, guardians and adult children asking how much is in a parent's spending account, why a deposited check cannot be drawn yet, how interest was figured, whether the account can pay this month's bill, why a salon or supply charge was taken from the account, why a letter warned about the Medicaid resource limit, and when the money will be sent after a discharge or a death; the setting varies across the six Medicaid-status and authority tiers, accounts from authorization_pending to closed, Medicaid approvals that change the tier mid-month, the center acting as Social Security representative payee, standing versus per-bill authorizations, and powers of attorney that ended at death.
      The records are the account, its ledger and the signed requests, read with the resident's Medical Assistance case, private-pay, bed-hold, ancillary and Medicare billing records whose charges the account may pay; the rules take the shape of written authorization and tier placement in trust_opening_authorization, check holds and payee benefits in trust_evt_deposits, the per-tier interest threshold formula in trust_evt_interest, signed requests, petty cash limits and available balance in trust_evt_withdrawals, standing and per-bill authorizations and the payer-covered item bar in trust_evt_bill_transfers, returns of improper charges in trust_evt_reversals, statements and the resource-limit notice in trust_evt_statements_notices, conveyance timing and payees in trust_conveyance_rules and tier changes in trust_account_changes.
      As background, an account is authorized before money is deposited, money is available before it can be withdrawn or applied to a bill, and conveyance starts only after a discharge or death is recorded.
      Setting up accounts, recording tier changes, posting deposits, interest, withdrawals against signed requests, bill transfers under recorded authorizations and reversals, issuing statements and resource notices and conveying and closing accounts are the agent's service actions, while authorizing the center to hold funds, signing a withdrawal request, signing a standing or per-bill payment authorization and closing the account while still in residence belong to the resident or legal representative and are handed over as user actions.
      Requests to invest a resident's funds elsewhere, to pay a family member's expenses from the account, to release funds to someone other than the estate after a death without letters, and questions about the resident's eligibility for SSI are not decided by any published rule, and the only correct route for them is a POLICY_NOT_COVERED handoff.
