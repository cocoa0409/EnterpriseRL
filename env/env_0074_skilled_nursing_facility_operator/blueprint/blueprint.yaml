name: env_0074_skilled_nursing_facility_operator
company: Keystone Ridge Health & Rehabilitation
background: |
  Keystone Ridge Health & Rehabilitation is a family-founded skilled nursing operator running fourteen licensed nursing and rehabilitation centers across south-central and eastern Pennsylvania, from Camp Hill, Carlisle and Harrisburg to Lancaster, Reading, York and State College. Its centers provide short-term post-hospital rehabilitation, long-term nursing care and secured memory care, and a central business office in Mechanicsburg answers residents and families by phone and email in a plain, unhurried tone. A resident's stay is billed through whichever payer source covers it at the time, and each source is kept as its own account on the resident's file. Medicare Part A Skilled Nursing Facility Coverage is held as one coverage episode per skilled admission, in tiers named for the supplemental protection on file: Medicare Part A Without Supplemental Coverage, Medicare Part A with Medigap Plan A or B, Medicare Part A with Medigap Plan K, Medicare Part A with Medigap Plan L, Medicare Part A with Full-Coinsurance Medigap, and Medicare Part A with QMB Medicaid Crossover; covered days are booked month by month and coinsurance is charged to each liable party. Private Pay Long-Term Care Residency is held as an admission agreement for one accommodation tier, from the Semi-Private Long-Term Care Room and the Semi-Private Secure Memory Care Room through the Private Long-Term Care Room, the Private Secure Memory Care Room and the Private Bariatric Care Room to the Private Suite with Sitting Area, and is billed monthly in advance with payments, fees, credits, deposits and refunds on its own ledger. Medical Assistance Nursing Facility Coverage is held as a case that moves from application through the County Assistance Office decision, in tiers for Standard Patient Pay, Community Spouse Allowance, Dependent Family Allowance, VA Reduced Pension, Home Maintenance Allowance and Medical Assistance Hospice Room and Board; its ledger carries estimated and actual patient pay and the Medicaid-pending balance. Bed-Hold and Leave Reservations are opened for each hospital stay or therapeutic leave, as a Medicaid Hospital Leave Reserved Bed, Medicaid Therapeutic Leave Reserved Bed, Private Pay Hospital Leave Bed Hold, Private Pay Therapeutic Leave Bed Hold, Medicare Skilled Stay Hospital Leave Bed Hold or Medicare Skilled Stay Therapeutic Leave Bed Hold, and book held days and any bed-hold charges. Resident Trust Fund Accounts hold residents' own money at the business office in six tiers, Resident Funds Account, Medicaid or Non-Medicaid, each Self-Directed, Representative Payee or Guardianship, with deposits, interest, withdrawals, bill payments, statements and conveyances. Ancillary and Optional Services Billing keeps one account per resident in a tier set by the payer source, from Ancillary Account, Medicare Part A Consolidated Billing to Ancillary Account, Hospice Election, for supplies, salon visits, cable, telephone, guest meals and van trips. Outpatient and Part B Therapy Services hold therapy plans of care such as the Medicare Part B Physical Therapy Plan of Care, the Medicare Advantage Outpatient Therapy Plan of Care and the Private Pay Therapy Plan of Care, with visits, resident charges and notices. Most callers are adult children, spouses or agents under power of attorney calling for a parent, together with a smaller number of residents who manage their own affairs and a few court-appointed guardians. A typical long-stay resident arrives on a Medicare Part A episode after a hospital stay, moves to private pay when skilled care ends, applies for Medical Assistance once savings run down, and along the way picks up bed holds for hospital trips, a trust fund account for spending money and a handful of ancillary charges. Callers bring statements, notices from Medicare or the County Assistance Office, and memories of what an admissions coordinator said months earlier, and their accounts often span two or three payer sources at once.
