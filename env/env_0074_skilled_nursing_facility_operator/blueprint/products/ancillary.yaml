category: ancillary
display_name: Ancillary and Optional Services Billing
binding:
  holding_table: ancillary_accounts
  event_tables:
  - ancillary_ledger
  intake_tables:
  - ancillary_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    account_balance: ancillary_receivable
lifecycle:
  states:
  - pending_setup
  - open
  - closed
  transitions:
  - from: pending_setup
    to: open
    by: agent
    means: The resident's payer source is confirmed and ancillary billing starts.
  - from: open
    to: closed
    by: agent
    means: After discharge the last ancillary charges are settled and the account is closed.
accounts:
- key: ancillary_receivable
  unit: USD
  meaning: Ancillary and optional-service charges the resident owes; charges and Part B cost-sharing add, payments
    and credits subtract.
parameter_schema:
  payer_class: 'Who pays covered ancillary items for a resident in this tier (enum: medicare_part_a, medicare_part_b,
    medicaid, private_pay, medicare_advantage, hospice).'
  consolidated_billing_applies: Whether Medicare SNF consolidated billing bundles covered supplies, drugs, lab and
    radiology into the Part A per diem (boolean).
  consolidated_billing_exclusions: Services outside consolidated billing that the furnishing provider bills separately
    (list).
  resident_billable_for_payer_covered_items: Whether an item the resident's payer covers may be billed to the resident
    (boolean).
  part_b_coinsurance_pct: Resident share of the Medicare Part B approved amount for covered ancillary items after
    the deductible (percent; 0 where Part B does not apply).
  part_b_annual_deductible_by_year: Medicare Part B annual deductible by calendar year (USD; CMS-published).
  part_b_covered_categories: Ancillary categories Part B pays for a resident not in a Part A stay (list).
  dme_covered_by_part_b_in_center: Whether durable medical equipment used in the center is billable to Part B (boolean;
    a nursing facility is not a home for the DME benefit).
  medicaid_covered_categories: Items and services the Medicaid per diem includes and no Medicaid resident may be
    charged for (list; 42 CFR 483.10(f)(11)(i)).
  hospice_related_items_covered: Whether drugs, supplies and equipment related to the terminal illness are the hospice's
    to provide and pay (boolean).
  ma_authorization_required: Whether the Medicare Advantage plan's authorization is needed before a covered item
    is supplied (boolean).
  ma_resident_share_basis: 'How a Medicare Advantage resident''s share is set (enum: patient_responsibility_on_plan_remittance).'
  nonroutine_supply_markup_pct: Markup over the center's acquisition cost for non-routine medical supplies billed
    to the resident (percent; 0 where the payer covers supplies).
  oxygen_concentrator_monthly_usd: Monthly charge for an oxygen concentrator for a resident whose payer does not
    cover it (USD; 0 where covered).
  optional_item_categories: Optional items and services chargeable to any resident who asks for them (list).
  beauty_wash_set_usd: Beauty shop wash and set (USD).
  beauty_haircut_usd: Haircut (USD).
  beauty_permanent_usd: Permanent wave (USD).
  beauty_color_usd: Hair color (USD).
  barber_shave_usd: Barber shave (USD).
  manicure_usd: Manicure (USD).
  cable_tv_monthly_usd: In-room cable television, per month (USD).
  telephone_monthly_usd: In-room telephone line, per month (USD).
  dry_cleaning_per_item_usd: Dry cleaning of a personal garment (USD per item).
  guest_meal_breakfast_usd: Guest breakfast (USD).
  guest_meal_lunch_usd: Guest lunch (USD).
  guest_meal_dinner_usd: Guest dinner (USD).
  holiday_guest_meal_usd: Guest meal on Thanksgiving, Christmas or Easter (USD).
  transport_base_usd: Non-medical wheelchair van trip, base charge (USD per trip).
  transport_per_mile_usd: Non-medical wheelchair van trip, per loaded mile (USD).
  transport_escort_hourly_usd: Staff escort on a non-medical trip, per hour (USD; billed in quarter hours).
  premium_brief_upcharge_per_case_usd: Upcharge for a resident-requested premium incontinence brand over the standard
    supply (USD per case).
  pharmacy_billed_by_center: Whether prescription drugs outside a Part A stay are billed by the center (boolean;
    the contracted pharmacy bills them).
  price_disclosure_required: Whether the price of an optional item is disclosed before it is supplied (boolean).
  written_request_required_for_optional: Whether an optional item is supplied only on the resident's or representative's
    request (boolean).
  recurring_start_proration: 'How a recurring service started mid-month is charged (enum: daily_proration_by_days_in_month).'
  recurring_cancel_effective: 'When a cancelled recurring service stops being charged (enum: end_of_month_of_request;
    discharge ends it on the discharge date).'
  billing_cycle: 'When ancillary charges are billed (enum: monthly_in_arrears).'
  statement_day_of_month: Day of the month on which the prior month's ancillary charges are billed (integer).
  payment_due_days: Calendar days after the statement date by which charges are due (integer).
  accepted_payment_methods: Methods accepted for ancillary charges (list).
  dispute_window_days: Calendar days after the statement date within which a resident may dispute a charge (integer).
  dispute_resolution_business_days: Business days within which a disputed charge is resolved (integer).
  part_b_timely_filing_months: Months after the date of service within which a Medicare Part B claim must be filed
    (integer).
  medicaid_timely_filing_days: Days after the date of service within which a Medical Assistance claim must be filed
    (integer).
  late_filing_resident_liable: Whether the resident may be billed for an item the center failed to claim in time
    (boolean).
  charge_rounding: 'Rounding of ancillary charges (enum: half_up_cents_per_row).'
  close_requires_zero_balance: Whether an account is closed only with a zero balance (boolean).
