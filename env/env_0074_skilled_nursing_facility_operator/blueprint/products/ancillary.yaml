events:
- type: ancillary_account_open
  target: ancillary_accounts
  mutation: create
  meaning: An ancillary billing account is set up for the resident.
  grain: one row per account
  fields:
    customer_id: the resident
    variant_name: tier from the stay's payer source
    opened_date: date set up
  triggers: []
- type: ancillary_account_activate
  target: ancillary_accounts
  mutation:
    transition:
      from: pending_setup
      to: open
  meaning: Ancillary billing starts.
  grain: one row per transaction
  fields:
    tier_effective_date: date billing starts under the tier
  triggers: []
- type: ancillary_account_update
  target: ancillary_accounts
  mutation: update
  meaning: The stay's payer source changes and the tier with it.
  grain: one row per transaction
  fields:
    variant_name: new tier
    tier_effective_date: date the new payer source starts
  triggers: []
- type: ancillary_account_close
  target: ancillary_accounts
  mutation:
    transition:
      from: open
      to: closed
  meaning: The account is closed after discharge.
  grain: one row per transaction
  fields:
    closed_date: closing date
  triggers: []
- type: ancillary_item_charge
  target: ancillary_ledger
  meaning: One ancillary item or optional service is charged to the resident.
  grain: one row per item, service date and request
  distinguish_by:
  - service_date
  - item_category
  - ancillary_request_id
  fields:
    service_date: date supplied
    item_category: category of the item
    quantity: units supplied
    unit_price: price per unit
    ancillary_request_id: resident request behind an optional item
    amount: charge (positive)
    entry_date: posting date
  account: ancillary_receivable
  direction: in
  triggers: []
- type: ancillary_recurring_charge
  target: ancillary_ledger
  meaning: A month of a recurring service is charged.
  grain: one row per service month and recurring service
  distinguish_by:
  - service_month
  - recurring_service
  fields:
    service_month: YYYY-MM
    recurring_service: cable_tv, telephone or oxygen_concentrator
    day_count: days charged
    amount: charge (positive)
    entry_date: posting date
  account: ancillary_receivable
  direction: in
  triggers: []
- type: ancillary_payer_claim
  target: ancillary_ledger
  meaning: A covered ancillary item is claimed to the payer that covers it.
  grain: one row per item, service date and payer
  distinguish_by:
  - service_date
  - item_category
  - claim_payer
  fields:
    service_date: date supplied
    item_category: category
    claim_payer: medicare_part_b, medicaid, medicare_advantage or hospice
    amount: amount claimed (positive)
    entry_date: filing date
  triggers: []
- type: ancillary_part_b_share
  target: ancillary_ledger
  meaning: The resident's Part B deductible or coinsurance on a paid claim is charged.
  grain: one row per claim
  distinguish_by:
  - claim_entry_id
  fields:
    claim_entry_id: the Part B claim
    service_date: date supplied
    amount: resident share (positive)
    entry_date: posting date
  account: ancillary_receivable
  direction: in
  triggers: []
- type: ancillary_payment
  target: ancillary_ledger
  meaning: A payment is applied to one ancillary charge.
  grain: one row per receipt applied to one charge
  distinguish_by:
  - charge_entry_id
  - entry_date
  - payment_method
  fields:
    charge_entry_id: charge paid
    payment_method: check, ach, card or trust_transfer
    amount: amount applied (positive)
    entry_date: date received
  account: ancillary_receivable
  direction: out
  triggers: []
- type: ancillary_credit
  target: ancillary_ledger
  meaning: An ancillary charge is credited.
  grain: one row per charge and reason
  distinguish_by:
  - charge_entry_id
  - credit_reason
  fields:
    charge_entry_id: charge credited
    credit_reason: payer_covered_item, consolidated_billing_item, hospice_related_item, not_requested, price_error
      or dispute_upheld
    amount: credit (positive)
    entry_date: posting date
  account: ancillary_receivable
  direction: out
  triggers: []
measures:
- id: ancillary_msr_part_b_deductible_met
  window: the calendar year of the service date, across all of the resident's Part B claims at the center
  measure: sum of ancillary_part_b_share amounts posted as deductible for the year, capped at the year's deductible
- id: ancillary_msr_open_charge_balance
  window: the life of one charge, as of the posting date
  measure: amount of the named charge minus ancillary_payment and ancillary_credit amounts naming it
policies:
- id: ancillary_agg_multi_holding
  subject:
  - ancillary_account_open
  rule: A resident has one ancillary billing account while in residence; a payer change moves the same account to
    another tier rather than opening a second one. A new account is set up only when the resident has no account
    that is pending_setup or open.
  eligibility:
  - id: one_account
    applies_to:
    - ancillary_account_open
    kind: dedup
    condition: A new account is set up only when the resident has no account that is pending_setup or open.
    evidence_fields:
    - ancillary_accounts.customer_id
    - ancillary_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ancillary_accounts.customer_id
      action_bindings:
        ancillary_accounts.customer_id: customer_id
    dedup_contract:
      table: ancillary_accounts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending_setup
        - open
      distinct_fields: []
  params:
    max_per_customer: 1
- id: ancillary_payer_coverage
  subject:
  - ancillary_item_charge
  - ancillary_payer_claim
  rule: What the resident's payer covers is never billed to the resident. During a Part A stay, consolidated billing
    bundles covered supplies, drugs, lab and radiology into the per diem, so they are neither claimed separately
    nor charged to the resident; only the consolidated billing exclusions are billed by their own providers. A Medicaid
    resident is never charged for anything the Medicaid per diem includes. A hospice resident's drugs, supplies
    and equipment related to the terminal illness are the hospice's. A Medicare Advantage item is supplied under
    the plan's authorization and the resident owes only the patient responsibility on the plan's remittance. Durable
    medical equipment used in the center is not a Part B item. Prescription drugs outside a Part A stay are billed
    by the contracted pharmacy, not the center. An item is charged to the resident only when the resident's payer
    does not cover it. A covered item is claimed to the payer within that payer's timely filing limit, and an item
    the center failed to claim in time is never shifted to the resident.
  eligibility:
  - id: not_payer_covered
    applies_to:
    - ancillary_item_charge
    kind: authorization
    condition: An item is charged to the resident only when the resident's payer does not cover it.
    evidence_fields:
    - ancillary_accounts.ancillary_account_id
    - ancillary_accounts.variant_name
    - ancillary_ledger.item_category
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ancillary_accounts.ancillary_account_id
      action_bindings:
        ancillary_accounts.ancillary_account_id: ancillary_account_id
  params:
    per_tier:
      Ancillary Account, Medicare Part A Consolidated Billing:
        payer_class: =payer_class
        consolidated_billing_applies: =consolidated_billing_applies
        hospice_related_items_covered: =hospice_related_items_covered
        ma_authorization_required: =ma_authorization_required
      Ancillary Account, Medicare Part B:
        payer_class: =payer_class
        consolidated_billing_applies: =consolidated_billing_applies
        hospice_related_items_covered: =hospice_related_items_covered
        ma_authorization_required: =ma_authorization_required
      Ancillary Account, Medical Assistance:
        payer_class: =payer_class
        consolidated_billing_applies: =consolidated_billing_applies
        hospice_related_items_covered: =hospice_related_items_covered
        ma_authorization_required: =ma_authorization_required
      Ancillary Account, Private Pay:
        payer_class: =payer_class
        consolidated_billing_applies: =consolidated_billing_applies
        hospice_related_items_covered: =hospice_related_items_covered
        ma_authorization_required: =ma_authorization_required
      Ancillary Account, Medicare Advantage:
        payer_class: =payer_class
        consolidated_billing_applies: =consolidated_billing_applies
        hospice_related_items_covered: =hospice_related_items_covered
        ma_authorization_required: =ma_authorization_required
      Ancillary Account, Hospice Election:
        payer_class: =payer_class
        consolidated_billing_applies: =consolidated_billing_applies
        hospice_related_items_covered: =hospice_related_items_covered
        ma_authorization_required: =ma_authorization_required
    consolidated_billing_exclusions: =consolidated_billing_exclusions
    resident_billable_for_payer_covered_items: =resident_billable_for_payer_covered_items
    medicaid_covered_categories: =medicaid_covered_categories
    dme_covered_by_part_b_in_center: =dme_covered_by_part_b_in_center
    pharmacy_billed_by_center: =pharmacy_billed_by_center
    ma_resident_share_basis: =ma_resident_share_basis
    part_b_timely_filing_months: =part_b_timely_filing_months
    medicaid_timely_filing_days: =medicaid_timely_filing_days
    late_filing_resident_liable: =late_filing_resident_liable
- id: ancillary_optional_items
  subject:
  - ancillary_item_charge
  rule: Optional items and services, whatever the payer, are supplied only when the resident or representative asks
    for them, at the price disclosed beforehand from the center's price schedule. An optional item is charged only
    against the resident's or representative's request for it. A non-medical van trip is the base charge plus the
    loaded miles times the per-mile charge, plus escort time in quarter hours at the escort hourly charge; a guest
    meal on Thanksgiving, Christmas or Easter is charged at the holiday guest meal price. A charge is the quantity
    times the unit price, rounded half up to the cent.
  eligibility:
  - id: requested_item
    applies_to:
    - ancillary_item_charge
    kind: authorization
    condition: An optional item is charged only against the resident's or representative's request for it.
    evidence_fields:
    - ancillary_requests.ancillary_request_id
    - ancillary_requests.request_type
    - ancillary_requests.item_category
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ancillary_requests.ancillary_request_id
      action_bindings:
        ancillary_requests.ancillary_request_id: ancillary_request_id
  params:
    optional_item_categories: =optional_item_categories
    beauty_wash_set_usd: =beauty_wash_set_usd
    beauty_haircut_usd: =beauty_haircut_usd
    beauty_permanent_usd: =beauty_permanent_usd
    beauty_color_usd: =beauty_color_usd
    barber_shave_usd: =barber_shave_usd
    manicure_usd: =manicure_usd
    dry_cleaning_per_item_usd: =dry_cleaning_per_item_usd
    guest_meal_breakfast_usd: =guest_meal_breakfast_usd
    guest_meal_lunch_usd: =guest_meal_lunch_usd
    guest_meal_dinner_usd: =guest_meal_dinner_usd
    holiday_guest_meal_usd: =holiday_guest_meal_usd
    transport_base_usd: =transport_base_usd
    transport_per_mile_usd: =transport_per_mile_usd
    transport_escort_hourly_usd: =transport_escort_hourly_usd
    premium_brief_upcharge_per_case_usd: =premium_brief_upcharge_per_case_usd
    price_disclosure_required: =price_disclosure_required
    written_request_required_for_optional: =written_request_required_for_optional
    charge_rounding: =charge_rounding
  formula:
    amount: round(quantity * unit_price, 2)
- id: ancillary_noncovered_supplies
  subject:
  - ancillary_item_charge
  - ancillary_recurring_charge
  rule: Non-routine medical supplies that no payer of the resident covers are charged at the center's acquisition
    cost plus the tier's markup; for every payer that covers supplies the markup is zero because nothing is charged.
    An oxygen concentrator the resident's payer does not cover is charged monthly at the tier's oxygen concentrator
    charge.
  eligibility: []
  params:
    per_tier:
      Ancillary Account, Medicare Part A Consolidated Billing:
        nonroutine_supply_markup_pct: =nonroutine_supply_markup_pct
        oxygen_concentrator_monthly_usd: =oxygen_concentrator_monthly_usd
      Ancillary Account, Medicare Part B:
        nonroutine_supply_markup_pct: =nonroutine_supply_markup_pct
        oxygen_concentrator_monthly_usd: =oxygen_concentrator_monthly_usd
      Ancillary Account, Medical Assistance:
        nonroutine_supply_markup_pct: =nonroutine_supply_markup_pct
        oxygen_concentrator_monthly_usd: =oxygen_concentrator_monthly_usd
      Ancillary Account, Private Pay:
        nonroutine_supply_markup_pct: =nonroutine_supply_markup_pct
        oxygen_concentrator_monthly_usd: =oxygen_concentrator_monthly_usd
      Ancillary Account, Medicare Advantage:
        nonroutine_supply_markup_pct: =nonroutine_supply_markup_pct
        oxygen_concentrator_monthly_usd: =oxygen_concentrator_monthly_usd
      Ancillary Account, Hospice Election:
        nonroutine_supply_markup_pct: =nonroutine_supply_markup_pct
        oxygen_concentrator_monthly_usd: =oxygen_concentrator_monthly_usd
- id: ancillary_evt_recurring
  subject:
  - ancillary_recurring_charge
  rule: Cable television, an in-room telephone line and a non-covered oxygen concentrator are charged per service
    month in arrears. A service started during a month is charged for the days from the start date over the days
    in the month; a cancelled service is charged through the end of the month in which the cancellation was requested,
    and a discharge ends it on the discharge date. A recurring service is charged only while the account is open.
    A service month is charged once per service.
  eligibility:
  - id: open_only
    applies_to:
    - ancillary_recurring_charge
    kind: state
    condition: A recurring service is charged only while the account is open.
    evidence_fields:
    - ancillary_accounts.ancillary_account_id
    - ancillary_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ancillary_accounts.ancillary_account_id
      action_bindings:
        ancillary_accounts.ancillary_account_id: ancillary_account_id
    state_contract:
      field: ancillary_accounts.status
      allowed:
      - open
  - id: month_once
    applies_to:
    - ancillary_recurring_charge
    kind: dedup
    condition: A service month is charged once per service.
    evidence_fields:
    - ancillary_ledger.ancillary_account_id
    - ancillary_ledger.service_month
    - ancillary_ledger.recurring_service
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ancillary_ledger.ancillary_account_id
      action_bindings:
        ancillary_ledger.ancillary_account_id: ancillary_account_id
    dedup_contract:
      table: ancillary_ledger
      mode: separate_record
      object_bindings:
        ancillary_account_id: ancillary_account_id
        service_month: service_month
        recurring_service: recurring_service
      duplicate_filters:
        event_type:
        - ancillary_recurring_charge
      distinct_fields: []
  params:
    cable_tv_monthly_usd: =cable_tv_monthly_usd
    telephone_monthly_usd: =telephone_monthly_usd
    recurring_start_proration: =recurring_start_proration
    recurring_cancel_effective: =recurring_cancel_effective
    billing_cycle: =billing_cycle
- id: ancillary_evt_part_b
  subject:
  - ancillary_part_b_share
  - ancillary_payer_claim
  rule: 'For a resident in the Part B tier, a covered ancillary item is claimed to Medicare Part B and the resident
    is charged only the Part B cost sharing on the paid claim: first any part of the year''s Part B deductible not
    yet met, then the Part B coinsurance percent of the remaining approved amount. The deductible of the calendar
    year of the service date applies. A claim''s resident share is charged once.'
  eligibility:
  - id: share_once
    applies_to:
    - ancillary_part_b_share
    kind: dedup
    condition: A claim's resident share is charged once.
    evidence_fields:
    - ancillary_ledger.claim_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ancillary_ledger.claim_entry_id
      action_bindings:
        ancillary_ledger.claim_entry_id: claim_entry_id
    dedup_contract:
      table: ancillary_ledger
      mode: separate_record
      object_bindings:
        claim_entry_id: claim_entry_id
      duplicate_filters:
        event_type:
        - ancillary_part_b_share
      distinct_fields: []
  params:
    per_tier:
      Ancillary Account, Medicare Part A Consolidated Billing:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
      Ancillary Account, Medicare Part B:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
      Ancillary Account, Medical Assistance:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
      Ancillary Account, Private Pay:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
      Ancillary Account, Medicare Advantage:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
      Ancillary Account, Hospice Election:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
    part_b_annual_deductible_by_year: =part_b_annual_deductible_by_year
    part_b_covered_categories: =part_b_covered_categories
  measures:
  - ancillary_msr_part_b_deductible_met
- id: ancillary_evt_payments_credits
  subject:
  - ancillary_payment
  - ancillary_credit
  rule: A payment names the charge it pays and is applied only up to its open balance; a transfer from the resident's
    trust account is posted only on the per-bill authorization recorded with the trust account. A charge billed
    for an item the payer covers, bundled under consolidated billing, related to a hospice terminal illness, never
    requested, or priced wrongly is credited in full or for the excess, naming the charge. A resident may dispute
    a charge within the dispute window days after the statement date, and a dispute is resolved within the dispute
    resolution business days; a dispute decided for the resident is credited as dispute_upheld. A charge is credited
    once per reason.
  eligibility:
  - id: credit_once
    applies_to:
    - ancillary_credit
    kind: dedup
    condition: A charge is credited once per reason.
    evidence_fields:
    - ancillary_ledger.charge_entry_id
    - ancillary_ledger.credit_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ancillary_ledger.charge_entry_id
      action_bindings:
        ancillary_ledger.charge_entry_id: charge_entry_id
    dedup_contract:
      table: ancillary_ledger
      mode: separate_record
      object_bindings:
        charge_entry_id: charge_entry_id
        credit_reason: credit_reason
      duplicate_filters:
        event_type:
        - ancillary_credit
      distinct_fields: []
  params:
    accepted_payment_methods: =accepted_payment_methods
    statement_day_of_month: =statement_day_of_month
    payment_due_days: =payment_due_days
    dispute_window_days: =dispute_window_days
    dispute_resolution_business_days: =dispute_resolution_business_days
  formula:
    applied_amount: min(amount, ancillary_msr_open_charge_balance)
  measures:
  - ancillary_msr_open_charge_balance
- id: ancillary_account_lifecycle
  subject:
  - ancillary_account_activate
  - ancillary_account_update
  - ancillary_account_close
  rule: 'The tier follows the payer source of the resident''s stay on the date of service: a Part A episode places
    the account in the consolidated billing tier, a Medicaid eligible case in the Medical Assistance tier, a hospice
    election in the hospice tier, a Medicare Advantage stay in that tier, and a private-pay or Medicaid-pending
    stay in the Part B tier when the resident has Part B and otherwise the private pay tier. An account is closed
    only when its balance is zero.'
  eligibility:
  - id: zero_to_close
    applies_to:
    - ancillary_account_close
    kind: authorization
    condition: An account is closed only when its balance is zero.
    evidence_fields:
    - ancillary_accounts.ancillary_account_id
    - ancillary_accounts.account_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ancillary_accounts.ancillary_account_id
      action_bindings:
        ancillary_accounts.ancillary_account_id: ancillary_account_id
  params:
    per_tier:
      Ancillary Account, Medicare Part A Consolidated Billing:
        payer_class: =payer_class
      Ancillary Account, Medicare Part B:
        payer_class: =payer_class
      Ancillary Account, Medical Assistance:
        payer_class: =payer_class
      Ancillary Account, Private Pay:
        payer_class: =payer_class
      Ancillary Account, Medicare Advantage:
        payer_class: =payer_class
      Ancillary Account, Hospice Election:
        payer_class: =payer_class
    close_requires_zero_balance: =close_requires_zero_balance
