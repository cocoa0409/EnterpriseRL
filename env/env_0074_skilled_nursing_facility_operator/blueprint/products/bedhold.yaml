events:
- type: bedhold_reservation_open
  target: bedhold_reservations
  mutation: create
  meaning: A leave begins and a bed-hold reservation is opened for it.
  grain: one row per leave (one hospitalization or one therapeutic leave)
  fields:
    customer_id: the resident
    variant_name: tier from the stay's payer source and the leave type
    leave_start_date: date the resident left
    transfer_at: date and time of departure
    transfer_type: planned or emergency
    destination_name: hospital or host as told to the center
    room_tier_held: private pay tier of the room being held
    room_number_held: room and bed held
  triggers: []
- type: bedhold_hold_elected
  target: bedhold_reservations
  mutation:
    transition:
      from: notice_pending
      to: held
  meaning: The hold takes effect on the resident's election (or automatically for payer-covered reserved days).
  grain: one row per transaction
  fields:
    hold_elected_date: date of the written election, or of the notice for an automatic payer hold
    private_hold_start_date: first privately paid held day; empty when only payer days are held
  triggers: []
- type: bedhold_hold_declined
  target: bedhold_reservations
  mutation:
    transition:
      from: notice_pending
      to: declined
  meaning: The resident or representative declines the hold.
  grain: one row per transaction
  fields:
    end_date: date declined
    end_reason: declined
  triggers: []
- type: bedhold_extension_elected
  target: bedhold_reservations
  mutation: update
  meaning: The resident elects to keep holding the bed privately after payer-covered days are used, or renews a
    private hold.
  grain: one row per transaction
  fields:
    private_hold_start_date: first privately paid day of the extension
    hold_elected_date: date of the written election
  triggers: []
- type: bedhold_returned
  target: bedhold_reservations
  mutation:
    transition:
      from: held
      to: returned
  meaning: The resident returns while the hold is in force.
  grain: one row per transaction
  fields:
    return_date: date back in the center
    end_date: last held day
  triggers: []
- type: bedhold_released
  target: bedhold_reservations
  mutation:
    transition:
      from: held
      to: released
  meaning: The resident or representative releases the held bed.
  grain: one row per transaction
  fields:
    release_date: date of release
    end_date: last held day
  triggers: []
- type: bedhold_expired
  target: bedhold_reservations
  mutation:
    transition:
      from: held
      to: expired
  meaning: The hold ends without a return.
  grain: one row per transaction
  fields:
    end_date: last held day
    end_reason: payer_days_used_no_extension, hospital_discharged_elsewhere, unpaid_private_hold or private_hold_max_reached
  triggers: []
- type: bedhold_day_booked
  target: bedhold_ledger
  meaning: Held leave days of one service month and one day payer are booked.
  grain: one row per reservation, service month and day payer
  distinguish_by:
  - service_month
  - day_payer
  fields:
    service_month: YYYY-MM
    day_payer: payer_reserved or resident_private
    from_date: first held day
    to_date: last held day
    day_count: days
    entry_date: posting date
  account: reserved_days
  direction: in
  triggers:
  - event: bedhold:bedhold_charge
    when:
      day_payer: resident_private
    map:
      days_entry_id: bedhold_entry_id
      service_month: service_month
      day_count: day_count
      from_date: from_date
- type: bedhold_day_reversed
  target: bedhold_ledger
  meaning: Booked held days are taken back.
  grain: one row per booked entry, first reversed date and reason
  distinguish_by:
  - days_entry_id
  - from_date
  - adjustment_reason
  fields:
    days_entry_id: booked entry reversed
    day_payer: payer of that entry
    from_date: first reversed day
    day_count: days reversed
    adjustment_reason: returned_earlier, hospital_discharged_elsewhere, payer_days_available or billing_error
    entry_date: posting date
  account: reserved_days
  direction: out
  triggers:
  - event: bedhold:bedhold_adjustment
    when:
      day_payer: resident_private
    map:
      days_entry_id: days_entry_id
      adjustment_reason: adjustment_reason
- type: bedhold_charge
  target: bedhold_ledger
  meaning: Privately held days of one booked entry are charged.
  grain: one row per booked resident_private entry
  distinguish_by:
  - days_entry_id
  fields:
    days_entry_id: booked entry priced
    service_month: YYYY-MM
    from_date: first day
    day_count: days charged
    daily_rate: bed-hold daily rate applied
    amount: charge (positive)
    entry_date: posting date
  account: bedhold_receivable
  direction: in
  triggers: []
- type: bedhold_payment
  target: bedhold_ledger
  meaning: A payment is applied to one bed-hold charge.
  grain: one row per receipt applied to one charge
  distinguish_by:
  - charge_entry_id
  - entry_date
  - payment_method
  fields:
    charge_entry_id: charge paid
    payment_method: check, ach, card or trust_transfer
    amount: amount applied (positive)
    entry_date: date received
  account: bedhold_receivable
  direction: out
  triggers: []
- type: bedhold_adjustment
  target: bedhold_ledger
  meaning: A bed-hold charge is reduced.
  grain: one row per charge and reason
  distinguish_by:
  - charge_entry_id
  - adjustment_reason
  fields:
    charge_entry_id: charge reduced
    days_entry_id: booked entry behind it
    adjustment_reason: returned_earlier, hospital_discharged_elsewhere, payer_days_available, notice_not_given or
      billing_error
    amount: reduction (positive)
    entry_date: posting date
  account: bedhold_receivable
  direction: out
  triggers: []
- type: bedhold_notice_delivered
  target: bedhold_ledger
  meaning: A written bed-hold notice is delivered.
  grain: one row per notice type and delivery
  distinguish_by:
  - notice_type
  - delivered_at
  fields:
    notice_type: transfer_notice or unpaid_hold_notice
    delivered_to: resident or representative
    delivered_at: date and time delivered
    entry_date: delivery date
  triggers: []
measures:
- id: bedhold_msr_payer_therapeutic_days_year
  window: the calendar year of the held day, across all of the resident's therapeutic leave reservations
  measure: sum of day_count over bedhold_day_booked with day_payer payer_reserved minus bedhold_day_reversed of
    those entries
- id: bedhold_msr_payer_hospital_days
  window: the one hospitalization the reservation covers, from the departure date
  measure: sum of day_count over bedhold_day_booked with day_payer payer_reserved on the reservation minus reversals
    of those entries
- id: bedhold_msr_open_charge_balance
  window: the life of one bed-hold charge, as of the posting date
  measure: amount of the named bedhold_charge minus bedhold_payment and bedhold_adjustment amounts naming it
policies:
- id: bedhold_agg_multi_holding
  subject:
  - bedhold_reservation_open
  rule: A resident may have any number of bed-hold reservations over time, one per leave, but only one that is notice_pending
    or held at a time; a leave that runs straight from one hospital to another is the same hospitalization and the
    same reservation. A new reservation is opened only when the resident has no other reservation that is notice_pending
    or held.
  eligibility:
  - id: one_open_reservation
    applies_to:
    - bedhold_reservation_open
    kind: dedup
    condition: A new reservation is opened only when the resident has no other reservation that is notice_pending
      or held.
    evidence_fields:
    - bedhold_reservations.customer_id
    - bedhold_reservations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bedhold_reservations.customer_id
      action_bindings:
        bedhold_reservations.customer_id: customer_id
    dedup_contract:
      table: bedhold_reservations
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - notice_pending
        - held
      distinct_fields: []
  params:
    max_per_customer: null
    hospitalization_basis: =hospitalization_basis
- id: bedhold_agg_payer_day_limits
  subject:
  - bedhold_day_booked
  rule: 'Payer-covered reserved days are counted across reservations: Medicaid hospital reserved days count per
    hospitalization, consecutively from the departure date, up to the per-hospitalization limit; Medicaid therapeutic
    leave days count across every therapeutic reservation of the resident in the calendar year, up to the per-calendar-year
    limit. A day is booked as payer_reserved only while the applicable limit still has room; every later held day
    of the leave is resident_private and is held only under a private extension. Medicare Part A never pays a held
    day.'
  eligibility: []
  params:
    per_tier:
      Medicaid Hospital Leave Reserved Bed:
        payer_reserved_days_per_hospitalization: =payer_reserved_days_per_hospitalization
        payer_reserved_days_per_calendar_year: =payer_reserved_days_per_calendar_year
      Medicaid Therapeutic Leave Reserved Bed:
        payer_reserved_days_per_hospitalization: =payer_reserved_days_per_hospitalization
        payer_reserved_days_per_calendar_year: =payer_reserved_days_per_calendar_year
      Private Pay Hospital Leave Bed Hold:
        payer_reserved_days_per_hospitalization: =payer_reserved_days_per_hospitalization
        payer_reserved_days_per_calendar_year: =payer_reserved_days_per_calendar_year
      Private Pay Therapeutic Leave Bed Hold:
        payer_reserved_days_per_hospitalization: =payer_reserved_days_per_hospitalization
        payer_reserved_days_per_calendar_year: =payer_reserved_days_per_calendar_year
      Medicare Skilled Stay Hospital Leave Bed Hold:
        payer_reserved_days_per_hospitalization: =payer_reserved_days_per_hospitalization
        payer_reserved_days_per_calendar_year: =payer_reserved_days_per_calendar_year
      Medicare Skilled Stay Therapeutic Leave Bed Hold:
        payer_reserved_days_per_hospitalization: =payer_reserved_days_per_hospitalization
        payer_reserved_days_per_calendar_year: =payer_reserved_days_per_calendar_year
    therapeutic_year_basis: =therapeutic_year_basis
    medicare_days_billable: =medicare_days_billable
  formula:
    payer_days_left: max(0, payer_reserved_days_per_hospitalization - bedhold_msr_payer_hospital_days) + max(0,
      payer_reserved_days_per_calendar_year - bedhold_msr_payer_therapeutic_days_year)
  measures:
  - bedhold_msr_payer_hospital_days
  - bedhold_msr_payer_therapeutic_days_year
- id: bedhold_evt_notice
  subject:
  - bedhold_notice_delivered
  - bedhold_reservation_open
  rule: The written bed-hold policy is given at admission, and a written bed-hold notice stating how long the bed
    is held, who pays and at what rate, and the return rights is given to the resident and the representative at
    the time of transfer. For an emergency transfer, the notice reaches the resident or representative within the
    emergency transfer notice hours after the departure time. No day held before the transfer notice was delivered
    is ever charged to the resident. A notice of each type is recorded once per delivery time.
  eligibility: []
  params:
    policy_notice_at_admission: =policy_notice_at_admission
    transfer_notice_required: =transfer_notice_required
    emergency_transfer_notice_hours: =emergency_transfer_notice_hours
    charge_before_notice_allowed: =charge_before_notice_allowed
    notice_recipients: =notice_recipients
- id: bedhold_election
  subject:
  - bedhold_hold_elected
  - bedhold_hold_declined
  - bedhold_extension_elected
  rule: Holding the bed is the resident's choice. Payer-covered reserved days are held without a written election
    unless the resident or representative declines, and Medicaid therapeutic leave days are held only with a physician
    order for the leave on the care plan. A private hold is recorded only on the resident's or representative's
    written election. An election made within the election window hours after the transfer notice was delivered
    holds the bed from the departure date; a later election holds it only from the day of election. Once payer-covered
    days are used up, the bed stays held only if the tier allows a private extension and the resident elects it;
    a private hold runs at most the private hold maximum days before it must be renewed in writing.
  eligibility:
  - id: written_election
    applies_to:
    - bedhold_hold_elected
    - bedhold_extension_elected
    kind: authorization
    condition: A private hold is recorded only on the resident's or representative's written election.
    evidence_fields:
    - bedhold_elections.bedhold_reservation_id
    - bedhold_elections.election_type
    - bedhold_elections.elected_by
    - bedhold_elections.effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bedhold_elections.bedhold_reservation_id
      action_bindings:
        bedhold_elections.bedhold_reservation_id: bedhold_reservation_id
  params:
    per_tier:
      Medicaid Hospital Leave Reserved Bed:
        payer_days_reserved_automatically: =payer_days_reserved_automatically
        private_extension_allowed: =private_extension_allowed
        private_hold_max_days: =private_hold_max_days
        physician_order_required: =physician_order_required
        resident_pays_all_held_days: =resident_pays_all_held_days
      Medicaid Therapeutic Leave Reserved Bed:
        payer_days_reserved_automatically: =payer_days_reserved_automatically
        private_extension_allowed: =private_extension_allowed
        private_hold_max_days: =private_hold_max_days
        physician_order_required: =physician_order_required
        resident_pays_all_held_days: =resident_pays_all_held_days
      Private Pay Hospital Leave Bed Hold:
        payer_days_reserved_automatically: =payer_days_reserved_automatically
        private_extension_allowed: =private_extension_allowed
        private_hold_max_days: =private_hold_max_days
        physician_order_required: =physician_order_required
        resident_pays_all_held_days: =resident_pays_all_held_days
      Private Pay Therapeutic Leave Bed Hold:
        payer_days_reserved_automatically: =payer_days_reserved_automatically
        private_extension_allowed: =private_extension_allowed
        private_hold_max_days: =private_hold_max_days
        physician_order_required: =physician_order_required
        resident_pays_all_held_days: =resident_pays_all_held_days
      Medicare Skilled Stay Hospital Leave Bed Hold:
        payer_days_reserved_automatically: =payer_days_reserved_automatically
        private_extension_allowed: =private_extension_allowed
        private_hold_max_days: =private_hold_max_days
        physician_order_required: =physician_order_required
        resident_pays_all_held_days: =resident_pays_all_held_days
      Medicare Skilled Stay Therapeutic Leave Bed Hold:
        payer_days_reserved_automatically: =payer_days_reserved_automatically
        private_extension_allowed: =private_extension_allowed
        private_hold_max_days: =private_hold_max_days
        physician_order_required: =physician_order_required
        resident_pays_all_held_days: =resident_pays_all_held_days
    election_window_hours: =election_window_hours
    late_election_hold_start: =late_election_hold_start
    therapeutic_leave_purposes: =therapeutic_leave_purposes
- id: bedhold_evt_day_counting
  subject:
  - bedhold_day_booked
  - bedhold_day_reversed
  rule: 'Leave days follow the midnight census: a day is a leave day when the resident is away at midnight, so the
    departure day counts when the resident is gone at midnight, the return day never counts, and an emergency-room
    visit or outing ending before midnight creates no leave day; a night in hospital observation counts as hospital
    leave. Held days are booked per service month and day payer at month end or when the leave ends. Held days are
    booked only while the reservation is held, returned, released or expired. A booked day later found to fall after
    the return, after a hospital discharge to another setting, inside payer-covered room, or booked in error is
    reversed against its booked entry. A booked entry is reversed only for dates and a reason not already reversed
    on it.'
  eligibility:
  - id: bookable_state
    applies_to:
    - bedhold_day_booked
    kind: state
    condition: Held days are booked only while the reservation is held, returned, released or expired.
    evidence_fields:
    - bedhold_reservations.bedhold_reservation_id
    - bedhold_reservations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bedhold_reservations.bedhold_reservation_id
      action_bindings:
        bedhold_reservations.bedhold_reservation_id: bedhold_reservation_id
    state_contract:
      field: bedhold_reservations.status
      allowed:
      - held
      - returned
      - released
      - expired
  - id: reverse_once
    applies_to:
    - bedhold_day_reversed
    kind: dedup
    condition: A booked entry is reversed only for dates and a reason not already reversed on it.
    evidence_fields:
    - bedhold_ledger.days_entry_id
    - bedhold_ledger.from_date
    - bedhold_ledger.adjustment_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bedhold_ledger.days_entry_id
      action_bindings:
        bedhold_ledger.days_entry_id: days_entry_id
    dedup_contract:
      table: bedhold_ledger
      mode: separate_record
      object_bindings:
        days_entry_id: days_entry_id
      duplicate_filters:
        event_type:
        - bedhold_day_reversed
      distinct_fields:
      - from_date
      - adjustment_reason
  params:
    leave_day_rule: =leave_day_rule
    departure_day_is_leave_day: =departure_day_is_leave_day
    return_day_is_leave_day: =return_day_is_leave_day
    same_day_return_is_leave: =same_day_return_is_leave
    observation_counts_as_hospital_leave: =observation_counts_as_hospital_leave
    day_booking_cycle: =day_booking_cycle
- id: bedhold_evt_charges
  subject:
  - bedhold_charge
  rule: 'Each booked resident_private entry is charged once: the days times the bed-hold daily rate, rounded half
    up to the cent. The bed-hold daily rate is the tier''s bed-hold percent of the private pay schedule''s daily
    rate in effect on those days for the tier of the room held, whatever payer source covers the resident''s stay
    otherwise. Payer-covered reserved days are never billed to the resident, and Medicaid patient pay is unchanged
    for a month with reserved days. Bed-hold charges for a month are billed on the statement day of the following
    month and are due within the payment due days; they carry no late charge. A booked entry is charged once.'
  eligibility:
  - id: charge_once
    applies_to:
    - bedhold_charge
    kind: dedup
    condition: A booked entry is charged once.
    evidence_fields:
    - bedhold_ledger.days_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bedhold_ledger.days_entry_id
      action_bindings:
        bedhold_ledger.days_entry_id: days_entry_id
    dedup_contract:
      table: bedhold_ledger
      mode: separate_record
      object_bindings:
        days_entry_id: days_entry_id
      duplicate_filters:
        event_type:
        - bedhold_charge
      distinct_fields: []
  params:
    per_tier:
      Medicaid Hospital Leave Reserved Bed:
        bedhold_rate_pct: =bedhold_rate_pct
        medicaid_patient_pay_unchanged: =medicaid_patient_pay_unchanged
      Medicaid Therapeutic Leave Reserved Bed:
        bedhold_rate_pct: =bedhold_rate_pct
        medicaid_patient_pay_unchanged: =medicaid_patient_pay_unchanged
      Private Pay Hospital Leave Bed Hold:
        bedhold_rate_pct: =bedhold_rate_pct
        medicaid_patient_pay_unchanged: =medicaid_patient_pay_unchanged
      Private Pay Therapeutic Leave Bed Hold:
        bedhold_rate_pct: =bedhold_rate_pct
        medicaid_patient_pay_unchanged: =medicaid_patient_pay_unchanged
      Medicare Skilled Stay Hospital Leave Bed Hold:
        bedhold_rate_pct: =bedhold_rate_pct
        medicaid_patient_pay_unchanged: =medicaid_patient_pay_unchanged
      Medicare Skilled Stay Therapeutic Leave Bed Hold:
        bedhold_rate_pct: =bedhold_rate_pct
        medicaid_patient_pay_unchanged: =medicaid_patient_pay_unchanged
    bedhold_rate_basis: =bedhold_rate_basis
    charge_rounding: =charge_rounding
    payer_days_never_billed_to_resident: =payer_days_never_billed_to_resident
    billing_cycle: =billing_cycle
    statement_day_of_month: =statement_day_of_month
    payment_due_days: =payment_due_days
    late_charge_allowed: =late_charge_allowed
  formula:
    amount: round(day_count * daily_rate * bedhold_rate_pct / 100, 2)
- id: bedhold_evt_payments_adjustments
  subject:
  - bedhold_payment
  - bedhold_adjustment
  rule: A payment names the bed-hold charge it pays and is applied only up to its open balance, by one of the accepted
    methods; a transfer from the resident's trust account is posted only on the resident's authorization recorded
    with the trust account. A charge is reduced when its days are reversed, when it covers days held before the
    transfer notice was delivered (notice_not_given), when the payer still had covered days for them (payer_days_available),
    or for a billing error; each reduction names the charge and never exceeds its open balance. Charges on an ended
    reservation stay due until paid, and prepaid held days after a release are refunded. A charge is reduced once
    per reason.
  eligibility:
  - id: adjust_once
    applies_to:
    - bedhold_adjustment
    kind: dedup
    condition: A charge is reduced once per reason.
    evidence_fields:
    - bedhold_ledger.charge_entry_id
    - bedhold_ledger.adjustment_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bedhold_ledger.charge_entry_id
      action_bindings:
        bedhold_ledger.charge_entry_id: charge_entry_id
    dedup_contract:
      table: bedhold_ledger
      mode: separate_record
      object_bindings:
        charge_entry_id: charge_entry_id
        adjustment_reason: adjustment_reason
      duplicate_filters:
        event_type:
        - bedhold_adjustment
      distinct_fields: []
  params:
    accepted_payment_methods: =accepted_payment_methods
    held_days_refundable_after_release: =held_days_refundable_after_release
    close_requires_zero_balance: =close_requires_zero_balance
    charge_before_notice_allowed: =charge_before_notice_allowed
  formula:
    applied_amount: min(amount, bedhold_msr_open_charge_balance)
  measures:
  - bedhold_msr_open_charge_balance
- id: bedhold_hold_end
  subject:
  - bedhold_returned
  - bedhold_released
  - bedhold_expired
  rule: A resident who returns while the hold is in force goes back to the same room, which is never assigned to
    anyone else during the hold. A release is the resident's or representative's own decision, needs no advance
    notice and stops charges after the day of release. A hold expires when payer-covered days are used up with no
    private extension, when the hospital discharges the resident to another setting, when the private hold maximum
    is reached without a renewal, or for an unpaid private hold. A private hold is ended for nonpayment only when
    a charge is at least the unpaid hold past-due days past due and the unpaid-hold notice was delivered at least
    the unpaid hold release notice days before, counted in calendar days with the day after delivery as day 1. After
    a hold ends, a Medicaid-eligible resident returns to the first available bed in a semi-private room and any
    other resident to the next available bed; if the center will not readmit, it must issue a facility-initiated
    discharge notice. For a skilled stay, a return within the Part A interrupted-stay window resumes the same skilled
    stay.
  eligibility:
  - id: unpaid_notice_ran
    applies_to:
    - bedhold_expired
    kind: time
    condition: A private hold is ended for nonpayment only when a charge is at least the unpaid hold past-due days
      past due and the unpaid-hold notice was delivered at least the unpaid hold release notice days before, counted
      in calendar days with the day after delivery as day 1.
    evidence_fields:
    - bedhold_ledger.bedhold_reservation_id
    - bedhold_ledger.notice_type
    - bedhold_ledger.entry_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bedhold_ledger.bedhold_reservation_id
      action_bindings:
        bedhold_ledger.bedhold_reservation_id: bedhold_reservation_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the unpaid-hold notice was delivered
      anchor_source: bedhold_ledger.entry_date
      relation: not_before
      duration_source: variants.unpaid_hold_release_notice_days
      unit: calendar_days
      counting_rule: counted in calendar days with the day after delivery as day 1
      boundary: inclusive
  params:
    per_tier:
      Medicaid Hospital Leave Reserved Bed:
        readmission_right_after_hold: =readmission_right_after_hold
        part_a_interrupted_stay_applies: =part_a_interrupted_stay_applies
      Medicaid Therapeutic Leave Reserved Bed:
        readmission_right_after_hold: =readmission_right_after_hold
        part_a_interrupted_stay_applies: =part_a_interrupted_stay_applies
      Private Pay Hospital Leave Bed Hold:
        readmission_right_after_hold: =readmission_right_after_hold
        part_a_interrupted_stay_applies: =part_a_interrupted_stay_applies
      Private Pay Therapeutic Leave Bed Hold:
        readmission_right_after_hold: =readmission_right_after_hold
        part_a_interrupted_stay_applies: =part_a_interrupted_stay_applies
      Medicare Skilled Stay Hospital Leave Bed Hold:
        readmission_right_after_hold: =readmission_right_after_hold
        part_a_interrupted_stay_applies: =part_a_interrupted_stay_applies
      Medicare Skilled Stay Therapeutic Leave Bed Hold:
        readmission_right_after_hold: =readmission_right_after_hold
        part_a_interrupted_stay_applies: =part_a_interrupted_stay_applies
    readmission_right_within_hold: =readmission_right_within_hold
    hold_room_reassignment_allowed: =hold_room_reassignment_allowed
    readmission_refusal_requires_discharge_notice: =readmission_refusal_requires_discharge_notice
    release_effective_basis: =release_effective_basis
    release_notice_days: =release_notice_days
    unpaid_hold_release_notice_days: =unpaid_hold_release_notice_days
    unpaid_hold_past_due_days: =unpaid_hold_past_due_days
    hold_ends_on_hospital_discharge_elsewhere: =hold_ends_on_hospital_discharge_elsewhere
