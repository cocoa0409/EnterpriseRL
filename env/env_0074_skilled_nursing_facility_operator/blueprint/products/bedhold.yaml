category: bedhold
display_name: Bed-Hold and Leave Reservations
binding:
  holding_table: bedhold_reservations
  event_tables:
  - bedhold_ledger
  intake_tables:
  - bedhold_elections
  status_field: status
  variant_field: variant_name
  quantity_fields:
    held_days: reserved_days
    charge_balance: bedhold_receivable
lifecycle:
  states:
  - notice_pending
  - held
  - declined
  - returned
  - released
  - expired
  transitions:
  - from: notice_pending
    to: held
    by: user
    means: The resident or representative elects in writing to hold the bed.
  - from: notice_pending
    to: held
    by: agent
    means: Payer-covered reserved days start without a written election because the resident did not decline.
  - from: notice_pending
    to: declined
    by: user
    means: The resident or representative declines to hold the bed.
  - from: held
    to: returned
    by: agent
    means: The resident comes back to the center while the hold is in force.
  - from: held
    to: released
    by: user
    means: The resident or representative releases the held bed.
  - from: held
    to: expired
    by: agent
    means: 'The hold ends without a return: payer days used with no extension, hospital discharge elsewhere, unpaid
      private hold, or the private hold maximum reached without renewal.'
accounts:
- key: reserved_days
  unit: days
  meaning: Leave days held on the reservation, by payer; booked days add, reversed days subtract.
- key: bedhold_receivable
  unit: USD
  meaning: Bed-hold charges the resident owes on the reservation; charges add, payments and adjustments subtract.
parameter_schema:
  payer_class: 'Payer source of the stay during which the leave occurs (enum: medicaid, private_pay, medicare_part_a).'
  leave_type: 'Kind of leave (enum: hospital = inpatient or observation stay at a hospital; therapeutic = home or
    community visit under the care plan).'
  payer_reserved_days_per_hospitalization: Consecutive reserved bed days the Pennsylvania Medical Assistance program
    pays per hospitalization, as stated in the center's Medicaid bed-hold notice (integer; 0 where the payer pays
    none).
  payer_reserved_days_per_calendar_year: Therapeutic leave days the Pennsylvania Medical Assistance program pays
    per calendar year, as stated in the center's Medicaid bed-hold notice (integer; 0 where the payer pays none).
  payer_days_reserved_automatically: Whether payer-covered reserved days are held without a written election unless
    the resident or representative declines (boolean).
  resident_pays_all_held_days: Whether every held day is the resident's own charge (boolean; true where the payer
    pays no reserved days).
  private_extension_allowed: Whether the resident may keep holding the bed at private expense once payer-covered
    days are used up (boolean).
  private_hold_max_days: Most consecutive privately paid hold days one reservation may carry before the hold must
    be renewed in writing (integer).
  physician_order_required: Whether a physician order for the leave must be on the care plan before days are reserved
    (boolean).
  medicare_days_billable: Whether held days may be billed to Medicare Part A (boolean; leave days are never Part
    A days).
  bedhold_rate_basis: 'What a privately held day costs (enum: private_daily_rate_of_room_tier_held = the private
    pay schedule''s daily rate in effect on that day for the tier of the room held).'
  bedhold_rate_pct: Percent of that daily rate charged per privately held day (percent).
  leave_day_rule: 'How a leave day is counted (enum: absent_at_midnight_census).'
  departure_day_is_leave_day: Whether the day the resident leaves is a leave day when the resident is away at midnight
    (boolean).
  return_day_is_leave_day: Whether the day the resident comes back is a leave day (boolean).
  same_day_return_is_leave: Whether an emergency-room visit or outing ending before midnight creates a leave day
    (boolean).
  observation_counts_as_hospital_leave: Whether a night in hospital outpatient observation is a hospital leave day
    (boolean).
  policy_notice_at_admission: Whether the written bed-hold policy is given at admission (boolean; 42 CFR 483.15(d)(1)).
  transfer_notice_required: Whether a written bed-hold notice stating the hold duration and cost is given at the
    time of transfer (boolean; 42 CFR 483.15(d)(2)).
  emergency_transfer_notice_hours: Hours after an emergency transfer within which the written bed-hold notice reaches
    the resident or representative (integer; CMS guidance F625).
  charge_before_notice_allowed: Whether a day held before the transfer notice was delivered may be charged to the
    resident (boolean).
  notice_recipients: Who receives the bed-hold notice (list).
  election_window_hours: Hours after the transfer notice is delivered within which a private hold must be elected
    for days from the departure date to be held (integer).
  late_election_hold_start: 'From when a private hold elected after the election window runs (enum: day_of_election).'
  hold_room_reassignment_allowed: Whether a held bed may be assigned to another resident while the hold is in force
    (boolean).
  readmission_right_within_hold: 'Where a resident returns while the hold is in force (enum: same_room).'
  readmission_right_after_hold: 'Where a resident whose hold ended returns (enum: first_available_bed_in_semi_private_room
    for Medicaid-eligible residents per 42 CFR 483.15(e)(1); next_available_bed otherwise).'
  readmission_refusal_requires_discharge_notice: Whether the center must issue a facility-initiated discharge notice
    if it does not readmit (boolean).
  release_effective_basis: 'When a release stops charges (enum: day_after_release = the day of release is the last
    held day).'
  release_notice_days: Advance notice a resident must give to release a hold (integer days; none required).
  unpaid_hold_release_notice_days: Calendar days of written notice before the center may end a private hold whose
    charges are past due (integer).
  unpaid_hold_past_due_days: Days a private hold charge must be past due before the unpaid-hold notice may issue
    (integer).
  held_days_refundable_after_release: Whether prepaid hold days after the release date are refunded (boolean).
  day_booking_cycle: 'How held days are booked (enum: per_service_month_and_day_payer, posted at month end or when
    the leave ends).'
  charge_rounding: 'Rounding of bed-hold charges (enum: half_up_cents_per_row).'
  billing_cycle: 'When bed-hold charges are billed (enum: monthly_in_arrears).'
  statement_day_of_month: Day of the month on which bed-hold charges for the prior month are billed (integer).
  payment_due_days: Calendar days after the statement date by which bed-hold charges are due (integer).
  accepted_payment_methods: Methods accepted for bed-hold charges (list).
  late_charge_allowed: Whether late charges are assessed on bed-hold charges (boolean).
  therapeutic_leave_purposes: Purposes for which therapeutic leave is granted (list).
  therapeutic_year_basis: 'Year over which therapeutic days are counted (enum: calendar_year).'
  hospitalization_basis: 'What one hospitalization is for the per-hospitalization count (enum: continuous_absence_from_transfer_to_return).'
  payer_days_never_billed_to_resident: Whether reserved days the payer pays are ever billed to the resident (boolean).
  medicaid_patient_pay_unchanged: Whether Medicaid patient pay is unchanged during reserved days (boolean).
  part_a_interrupted_stay_applies: Whether a return within the Part A interrupted-stay window resumes the same skilled
    stay (boolean).
  hold_ends_on_hospital_discharge_elsewhere: Whether a hold ends when the hospital discharges the resident to another
    setting instead of back to the center (boolean).
  close_requires_zero_balance: Whether an ended reservation is complete only when its bed-hold charges are settled
    (boolean).
