category: medicaid
display_name: Medical Assistance Nursing Facility Coverage
binding:
  holding_table: medicaid_cases
  event_tables:
  - medicaid_ledger
  intake_tables:
  - medicaid_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    patient_pay_balance: patient_pay_receivable
    pending_balance: pending_receivable
lifecycle:
  states:
  - application_preparing
  - pending
  - eligible
  - denied
  - fair_hearing
  - closed
  transitions:
  - from: application_preparing
    to: pending
    by: agent
    means: The signed application is submitted to the County Assistance Office.
  - from: application_preparing
    to: closed
    by: user
    means: The resident or legal representative decides not to apply.
  - from: pending
    to: eligible
    by: system
    means: The County Assistance Office approves nursing facility Medical Assistance.
  - from: pending
    to: denied
    by: system
    means: The County Assistance Office denies the application.
  - from: denied
    to: fair_hearing
    by: user
    means: The resident or representative requests a fair hearing on the denial.
  - from: fair_hearing
    to: eligible
    by: system
    means: The hearing decision grants eligibility.
  - from: fair_hearing
    to: closed
    by: system
    means: The hearing decision upholds the denial.
  - from: denied
    to: closed
    by: agent
    means: The denial stands with no timely hearing request and the case is closed.
  - from: eligible
    to: closed
    by: agent
    means: Eligibility ends by discharge, death or a closing notice and the case is settled.
accounts:
- key: patient_pay_receivable
  unit: USD
  meaning: Patient pay (estimated while pending, actual once approved) the resident owes the center; charges and
    refunds paid out add, payments and adjustments subtract.
- key: pending_receivable
  unit: USD
  meaning: 'Medicaid-pending balance: room and board accrued at the private daily rate for pending months, awaiting
    the eligibility outcome; accruals add, settlements subtract.'
parameter_schema:
  personal_needs_allowance_monthly: Personal needs allowance the resident keeps from monthly income under the Pennsylvania
    Medical Assistance post-eligibility rules (USD per month).
  va_pension_protected_monthly: VA pension amount excluded from patient pay for a Medicaid nursing facility resident
    whose VA pension is reduced under 38 U.S.C. 5503(d) (USD per month; 0 where not applicable).
  community_spouse_allowance_applies: Whether the community spouse monthly income allowance on the case is deducted
    when estimating patient pay (boolean).
  family_allowance_applies: Whether the dependent family allowance on the case is deducted when estimating patient
    pay (boolean).
  home_maintenance_allowance_applies: Whether the home maintenance allowance on the case is deducted when estimating
    patient pay (boolean).
  home_maintenance_max_months: Months for which a home maintenance allowance may be deducted once a physician certifies
    a likely return home (integer; 0 where not applicable).
  health_insurance_premium_deduction: Whether health insurance premiums the resident pays (Medicare Part B, Part
    D, Medigap) are deducted when estimating patient pay (boolean).
  hospice_room_board_pct_of_nf_rate: Share of the nursing facility Medicaid rate the state pays the hospice for
    room and board (percent; federal minimum 95).
  patient_pay_collected_by: 'Who collects the resident''s patient pay (enum: nursing_facility).'
  lookback_months: Months before the application date reviewed for transfers of assets for less than fair market
    value (federal 60-month look-back).
  retroactive_months: Months before the application month for which eligibility may be granted if the resident was
    eligible then (integer).
  eligibility_start_rule: 'Day within a month on which nursing facility eligibility begins (enum: first_day_of_month).'
  application_processing_standard_days: Days within which the County Assistance Office must decide an application
    (federal timeliness standard, non-disability).
  disability_processing_standard_days: Days within which an application requiring a disability determination must
    be decided (integer).
  level_of_care_assessment_required: Whether a nursing facility clinical eligibility determination must be on file
    before approval (boolean).
  verification_document_types: Verification documents the business office gathers for the County Assistance Office
    (list of controlled values).
  verification_forward_days: Business days after receiving a verification document within which the business office
    forwards it to the County Assistance Office (integer; Monday-Friday excluding center holidays).
  application_signers: Who may sign the Medical Assistance application (list).
  center_authorized_representative_allowed: Whether the center may act as the applicant's authorized representative
    once the resident signs the designation (boolean).
  fair_hearing_request_days: Calendar days after the notice date within which a fair hearing must be requested (integer).
  benefits_continue_appeal_days: Calendar days after a notice reducing or ending existing eligibility within which
    an appeal keeps the prior benefit in place (integer).
  renewal_interval_months: Months between eligibility renewals (integer).
  patient_pay_change_effective: 'When a redetermined patient pay applies (enum: first_day_of_month_named_on_notice).'
  annual_cola_effective_month: Calendar month in which Social Security cost-of-living increases change patient pay
    (integer).
  pending_estimate_basis: 'How estimated patient pay is computed while an application is pending (enum: income_on_application_less_allowances).'
  pending_estimate_due_day: Day of the service month by which the estimated or actual patient pay for that month
    is due (integer).
  pending_accrual_rate_basis: 'Rate at which the Medicaid-pending balance accrues (enum: private_daily_rate_of_occupied_room).'
  pending_accrual_cycle: 'Period for which the pending balance accrues (enum: calendar_month).'
  pending_collection_hold: Whether the pending balance is held from collection, late charges and nonpayment discharge
    while the application is pending (boolean).
  trueup_days: Calendar days after the approval notice within which estimated patient pay is reconciled to the actual
    amount (integer).
  trueup_basis: 'How the reconciliation is computed (enum: actual_patient_pay_per_month_less_estimates_paid).'
  cost_of_care_cap: Whether a month's patient pay may never exceed that month's cost of care at the Medicaid daily
    rate (boolean).
  partial_month_basis: 'Patient pay in a month of admission, discharge or death (enum: lesser_of_patient_pay_and_days_times_ma_daily_rate).'
  ma_payment_in_full: Whether the Medicaid payment plus patient pay is accepted as payment in full for covered days
    (boolean; 42 CFR 447.15).
  covered_item_resident_charge_allowed: Whether a Medicaid resident may be charged for items and services the Medicaid
    per diem covers (boolean).
  transfer_penalty_private_liability: Whether the resident owes the private rate for days inside a transfer-of-assets
    penalty period (boolean).
  penalty_period_start_rule: 'When a transfer penalty period starts (enum: date_otherwise_eligible_for_institutional_care).'
  spousal_resource_snapshot: 'Date on which spousal resources are counted (enum: start_of_first_continuous_institutionalization).'
  accepted_payment_methods: Methods accepted for patient pay (list).
  rep_payee_transfer_day: Day of the month on which patient pay is transferred from funds the center receives as
    representative payee (integer).
  late_charge_on_patient_pay: Whether late charges are assessed on patient pay (boolean).
  past_due_notice_days: Calendar days after the due date before a written past-due patient pay notice is sent (integer).
  refund_days: Calendar days after a patient pay credit arises within which it is refunded (integer).
  refund_payee_on_death: 'Payee of a patient pay refund after death (enum: estate).'
  bed_hold_patient_pay_unchanged: Whether patient pay is unchanged for a month with Medicaid reserved bed days (boolean).
  hospice_patient_pay_credit: Whether patient pay collected for a hospice room-and-board resident is credited against
    the hospice's room-and-board payment rather than the Medicaid per diem (boolean).
  close_requires_zero_balances: Whether a case may be closed only with zero patient pay and pending balances (boolean).
  withdrawal_by: 'Who may withdraw an application in preparation (enum: resident_or_legal_representative).'
  estimate_rounding: 'Rounding of estimated and partial-month patient pay (enum: half_up_cents).'
