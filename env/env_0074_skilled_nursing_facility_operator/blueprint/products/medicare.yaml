category: medicare
display_name: Medicare Part A Skilled Nursing Facility Coverage
binding:
  holding_table: medicare_coverages
  event_tables:
  - medicare_ledger
  intake_tables:
  - medicare_appeal_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    covered_days_used: benefit_days
    coinsurance_balance: coinsurance_receivable
lifecycle:
  states:
  - pending_verification
  - active
  - notice_issued
  - under_appeal
  - coverage_ended
  - closed
  - not_eligible
  transitions:
  - from: pending_verification
    to: active
    by: agent
    means: The business office confirms the qualifying stay and remaining benefit days from the Medicare eligibility
      response and starts Part A billing.
  - from: pending_verification
    to: not_eligible
    by: agent
    means: The qualifying stay, the transfer window or the remaining benefit days fail, so the admission is not
      a Part A covered stay.
  - from: active
    to: notice_issued
    by: agent
    means: The Notice of Medicare Non-Coverage is delivered because skilled services are ending.
  - from: notice_issued
    to: under_appeal
    by: user
    means: The resident or representative asks the Quality Improvement Organization for an expedited determination.
  - from: under_appeal
    to: active
    by: system
    means: The QIO reverses the termination and Part A coverage continues.
  - from: under_appeal
    to: coverage_ended
    by: system
    means: The QIO upholds the termination and coverage ends.
  - from: notice_issued
    to: coverage_ended
    by: system
    means: The last covered date on the notice passes without a timely appeal.
  - from: active
    to: coverage_ended
    by: agent
    means: Coverage ends without a NOMNC because the benefit days are used up, the resident leaves the center, or
      a hospital transfer is not followed by a return within the interrupted-stay window.
  - from: coverage_ended
    to: closed
    by: agent
    means: Every coinsurance share of the ended coverage is settled and the account is closed.
accounts:
- key: benefit_days
  unit: days
  meaning: Part A SNF benefit days used by this coverage episode; booked covered days add, reversed days subtract.
- key: coinsurance_receivable
  unit: USD
  meaning: Open coinsurance owed on this coverage by every liable party (resident, Medigap carrier, Medicaid crossover);
    charges add, payments and adjustments subtract, returned payments add back.
parameter_schema:
  qualifying_inpatient_midnights_min: Minimum consecutive inpatient hospital midnights (Medicare 3-day qualifying
    stay; integer count of midnights as a formally admitted inpatient).
  observation_midnights_count: 'Whether midnights spent in outpatient observation status count toward the qualifying
    stay (boolean; Medicare rule: they do not).'
  qualifying_admission_window_days: Calendar days after the qualifying hospital discharge date within which the
    SNF admission must occur (Medicare 30-day transfer rule).
  snf_readmission_window_days: Calendar days after a covered SNF discharge within which a readmission needs no new
    qualifying hospital stay (Medicare 30-day readmission rule).
  interrupted_stay_return_days: Consecutive calendar days within which a return to the same center continues the
    same coverage episode (PDPM interrupted stay policy, return by 12:00 a.m. of the third day).
  benefit_period_break_days: Consecutive days without inpatient hospital or SNF care that end a Medicare benefit
    period.
  benefit_period_day_limit: SNF days Medicare Part A covers per benefit period (integer days).
  full_coverage_day_limit: Last benefit-period day number with no beneficiary coinsurance (days 1 through this number
    are paid in full by Part A).
  coinsurance_rate_by_year: Medicare SNF daily coinsurance for benefit days 21-100, keyed by the calendar year in
    which the day of service falls (USD per day, CMS-published).
  midnight_census_day_rule: 'How a covered day is counted (enum: present_at_midnight = a day counts when the resident
    is in the center at the midnight census).'
  admission_day_counts: Whether the day of admission counts as a covered day (boolean).
  discharge_day_counts: Whether the day of discharge counts as a covered day (boolean).
  loa_day_covered: Whether a leave-of-absence day (resident away at midnight but not admitted to a hospital) is
    a Part A covered day (boolean).
  loa_day_counts_toward_benefit: Whether a leave-of-absence day uses a benefit-period day (boolean).
  hospital_leave_day_covered: Whether a day on which the resident is an inpatient at a hospital at midnight is a
    SNF covered day (boolean).
  skilled_nursing_days_per_week_min: Days per week skilled nursing must be needed and provided to meet the Medicare
    daily-skilled-services requirement (integer).
  skilled_rehab_days_per_week_min: Days per week skilled rehabilitation must be provided to meet the Medicare daily-skilled-services
    requirement when rehabilitation is the only skilled service (integer).
  initial_recertification_day: 'Covered-day number by which the first physician recertification must be signed (Medicare:
    no later than day 14).'
  recertification_interval_days: 'Maximum calendar days between subsequent physician recertifications (Medicare:
    at least every 30 days).'
  uncertified_days_resident_liable: Whether days falling after a lapsed certification may be billed to the resident
    (boolean; they are provider liable).
  nomnc_lead_days: Calendar days before the last covered day by which the Notice of Medicare Non-Coverage (CMS-10123)
    must be delivered (integer).
  nomnc_required_on_benefit_exhaustion: Whether a NOMNC is required when coverage ends because the 100 benefit days
    are used up (boolean).
  nomnc_required_on_resident_initiated_discharge: Whether a NOMNC is required when the resident chooses to leave
    the center (boolean).
  qio_request_deadline_days_before: Calendar days before the last covered date on which the expedited QIO review
    request deadline falls (integer; 1 = the day before).
  qio_request_deadline_hour: Local clock hour on the deadline day by which an expedited QIO review must be requested
    (24-hour clock; 12 = noon).
  late_appeal_liability_protection: Whether a resident who requests QIO review after the deadline is protected from
    liability for days after the last covered date while the review is pending (boolean).
  upheld_last_covered_basis: 'How the last covered date is fixed when a timely expedited appeal is upheld (enum:
    later_of_nomnc_date_and_qio_decision_date).'
  snfabn_required_before_noncovered_care: Whether the Skilled Nursing Facility Advance Beneficiary Notice (CMS-10055)
    must be delivered before non-covered extended care is billed to the resident (boolean).
  snfabn_options: The three choices printed on the SNF ABN (list of controlled values).
  option_1_demand_bill_required: Whether choosing SNF ABN Option 1 obliges the center to submit a demand bill to
    Medicare (boolean).
  resident_coinsurance_share_pct: Percent of each coinsurance day billed to the resident (percent).
  secondary_coinsurance_share_pct: Percent of each coinsurance day billed to the secondary payer (percent).
  secondary_liable_party: 'Liable party that receives the secondary share (enum: none, medigap_carrier, medicaid_crossover).'
  eligible_medigap_plan_letters: Medigap plan letters on file that place a coverage in this tier (list; NONE = no
    Medigap policy).
  qmb_status_required: Whether a verified Qualified Medicare Beneficiary status is required for this tier (boolean).
  balance_billing_prohibited: Whether federal law bars billing the resident for any Medicare cost sharing (boolean;
    QMB protection).
  secondary_claim_route: 'How the secondary share is claimed (enum: none, coba_crossover = Medicare''s automatic
    crossover to the Medigap carrier, state_medicaid_crossover).'
  secondary_followup_days: Calendar days after the secondary charge is posted before the business office follows
    up an unpaid secondary share (integer; 0 = no secondary payer).
  secondary_denial_rebill_to_resident: Whether a share the secondary payer denies is rebilled to the resident (boolean).
  medigap_change_effective_basis: 'Date from which a newly reported Medigap policy changes the cost-sharing split
    (enum: carrier_policy_effective_date).'
  qmb_effective_month_offset: Months after the month of the state's QMB determination in which QMB protection takes
    effect (integer; QMB is effective the first day of the following month).
  resident_statement_issued: Whether a monthly coinsurance statement is issued to the resident (boolean).
  statement_day_of_month: Calendar day of the month on which coinsurance statements for the prior service month
    are issued (integer).
  payment_due_days: Calendar days after the statement date by which the resident share is due (integer).
  coinsurance_rounding: 'Rounding basis for coinsurance amounts (enum: half_up_cents_per_row = each charge row rounded
    half up to the cent).'
  accepted_resident_payment_methods: Methods by which a resident or representative may pay a coinsurance share (list
    of controlled values).
  card_payment_max_usd: Largest single card payment the business office accepts (USD).
  returned_payment_limit: Returned (dishonored) payments within the lookback after which only certified funds are
    accepted (integer).
  returned_payment_lookback_months: Rolling lookback in calendar months for counting returned payments (integer).
  certified_funds_methods: Payment methods accepted once certified funds are required (list).
  days_booking_cycle: 'Period for which covered days are booked and billed (enum: calendar_month, closed early at
    the last covered date).'
  part_b_therapy_after_exhaustion: Whether medically necessary therapy may continue under Medicare Part B after
    Part A SNF days end (boolean).
  coverage_close_requires_zero_balance: Whether an ended coverage may be closed only once every coinsurance share
    is settled (boolean).
