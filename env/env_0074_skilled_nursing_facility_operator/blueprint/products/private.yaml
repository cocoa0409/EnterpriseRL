events:
- type: private_agreement_open
  target: private_agreements
  mutation: create
  meaning: A private-pay admission agreement is signed for a tier.
  grain: one row per admission agreement
  fields:
    customer_id: the resident
    variant_name: tier contracted
    agreement_signed_date: signing date
    admission_date: planned admission date
  triggers: []
- type: private_admission
  target: private_agreements
  mutation:
    transition:
      from: pending_admission
      to: active
  meaning: The resident arrives and private-pay billing starts.
  grain: one row per transaction
  fields:
    admission_date: actual admission date
  triggers:
  - event: private:private_room_board_charge
    map:
      from_date: admission_date
      charge_basis: first_month_partial
- type: private_admission_cancel
  target: private_agreements
  mutation:
    transition:
      from: pending_admission
      to: cancelled
  meaning: A planned admission is cancelled before arrival.
  grain: one row per transaction
  fields:
    closed_date: cancellation date
  triggers: []
- type: private_room_change
  target: private_agreements
  mutation: update
  meaning: The resident moves to a room of another tier.
  grain: one row per transaction
  fields:
    variant_name: new tier
    last_room_change_date: move date
    isolation_placement: true when the center directed the move for infection control
  triggers: []
- type: private_rate_notice_delivered
  target: private_agreements
  mutation: update
  meaning: The written notice of a scheduled private-pay rate change is delivered.
  grain: one row per transaction
  fields:
    rate_notice_delivered_date: delivery date of the notice
  triggers: []
- type: private_discharge_notice
  target: private_agreements
  mutation:
    transition:
      from: active
      to: notice_period
  meaning: A facility-initiated written discharge notice is issued.
  grain: one row per transaction
  fields:
    discharge_notice_date: date the notice was delivered
    planned_discharge_date: discharge date stated on the notice
    discharge_notice_reason: regulatory reason on the notice
  triggers: []
- type: private_notice_rescinded
  target: private_agreements
  mutation:
    transition:
      from: notice_period
      to: active
  meaning: A discharge notice is withdrawn and the stay continues.
  grain: one row per transaction
  fields:
    planned_discharge_date: cleared
  triggers: []
- type: private_notice_discharge
  target: private_agreements
  mutation:
    transition:
      from: notice_period
      to: discharged
  meaning: The resident leaves under a facility-initiated notice.
  grain: one row per transaction
  fields:
    discharge_date: date the resident left
    discharge_type: facility_initiated
  triggers:
  - event: private:private_adjustment
    map:
      adjustment_reason: discharge_proration
- type: private_discharge
  target: private_agreements
  mutation:
    transition:
      from: active
      to: discharged
  meaning: The resident leaves the center without a facility-initiated notice.
  grain: one row per transaction
  fields:
    discharge_date: date the resident left or died
    discharge_type: resident_initiated, deceased or hospital_no_return
  triggers:
  - event: private:private_adjustment
    map:
      adjustment_reason: death_proration
    when:
      discharge_type: deceased
  - event: private:private_adjustment
    map:
      adjustment_reason: discharge_proration
    when:
      discharge_type:
        not: deceased
- type: private_payer_conversion
  target: private_agreements
  mutation:
    transition:
      from: active
      to: payer_converted
  meaning: Another payer source takes over the stay.
  grain: one row per transaction
  fields:
    conversion_date: first day billed to the other payer source
    converted_to: medicaid_pending, medicaid, medicare_part_a or hospice_room_board
  triggers:
  - event: private:private_adjustment
    map:
      adjustment_reason: payer_conversion_credit
- type: private_payer_reversion
  target: private_agreements
  mutation:
    transition:
      from: payer_converted
      to: active
  meaning: Private-pay billing resumes after the other payer source ends or is denied.
  grain: one row per transaction
  fields:
    conversion_date: first day billed privately again
  triggers: []
- type: private_converted_close
  target: private_agreements
  mutation:
    transition:
      from: payer_converted
      to: closed
  meaning: A converted agreement with nothing left on it is closed.
  grain: one row per transaction
  fields:
    closed_date: closing date
  triggers: []
- type: private_close
  target: private_agreements
  mutation:
    transition:
      from: discharged
      to: closed
  meaning: A discharged agreement is settled and closed.
  grain: one row per transaction
  fields:
    closed_date: closing date
  triggers: []
- type: private_room_board_charge
  target: private_ledger
  meaning: Room, board and routine nursing for a span of one service month at one tier and rate is charged.
  grain: one row per service month, tier, rate and charge basis span
  distinguish_by:
  - service_month
  - from_date
  - accommodation_tier
  - charge_basis
  fields:
    service_month: YYYY-MM
    from_date: first charged day
    to_date: last charged day
    day_count: chargeable days
    accommodation_tier: tier whose rate applies
    daily_rate: rate applied
    charge_basis: standard, first_month_partial, isolation_rate or prior_rate_notice_hold
    amount: charge (positive)
    entry_date: posting date
  account: resident_account
  direction: in
  triggers: []
- type: private_fee_charge
  target: private_ledger
  meaning: A late charge or returned-payment fee is charged.
  grain: one row per fee type and service month (or per returned payment)
  distinguish_by:
  - fee_type
  - service_month
  - payment_entry_id
  fields:
    fee_type: late_charge or returned_payment_fee
    service_month: month the late charge is assessed for
    payment_entry_id: the dishonored payment, for a returned-payment fee
    amount: fee (positive)
    entry_date: posting date
  account: resident_account
  direction: in
  triggers: []
- type: private_payment
  target: private_ledger
  meaning: A payment is applied to one charge.
  grain: one row per payment receipt applied to one charge
  distinguish_by:
  - charge_entry_id
  - entry_date
  - payment_method
  fields:
    charge_entry_id: charge paid
    payment_method: check, certified_check, money_order, ach, card or deposit_application
    payment_source: resident, representative, ltc_insurance_assignment, resident_trust_transfer or security_deposit
    amount: amount applied (positive)
    entry_date: date received
  account: resident_account
  direction: out
  triggers: []
- type: private_payment_reversal
  target: private_ledger
  meaning: A dishonored payment is taken back.
  grain: one row per reversed payment
  distinguish_by:
  - payment_entry_id
  fields:
    payment_entry_id: dishonored payment
    charge_entry_id: charge it had paid
    amount: amount reinstated (positive)
    entry_date: date of the return notice
  account: resident_account
  direction: in
  triggers:
  - event: private:private_fee_charge
    map:
      fee_type: returned_payment_fee
      payment_entry_id: payment_entry_id
- type: private_adjustment
  target: private_ledger
  meaning: 'A charge is credited: proration after discharge, death or payer conversion, late rate notice, room change
    or billing error.'
  grain: one row per charge and adjustment reason
  distinguish_by:
  - charge_entry_id
  - adjustment_reason
  fields:
    charge_entry_id: charge credited
    adjustment_reason: discharge_proration, death_proration, payer_conversion_credit, rate_notice_late, room_change_proration
      or billing_error
    from_date: first credited day
    day_count: days credited
    amount: credit (positive)
    entry_date: posting date
  account: resident_account
  direction: out
  triggers: []
- type: private_refund
  target: private_ledger
  meaning: A credit balance is refunded.
  grain: one row per refund issued
  distinguish_by:
  - entry_date
  - refund_payee
  fields:
    refund_payee: resident, representative or estate
    payment_method: check or ach
    amount: refund (positive)
    entry_date: issue date
  account: resident_account
  direction: in
  triggers: []
- type: private_deposit_received
  target: private_ledger
  meaning: A security deposit is received.
  grain: one row per deposit receipt
  distinguish_by:
  - entry_date
  fields:
    payment_method: method used
    amount: deposit (positive)
    entry_date: date received
  account: security_deposit
  direction: in
  triggers: []
- type: private_deposit_disposition
  target: private_ledger
  meaning: The security deposit is applied to the balance or refunded.
  grain: one row per disposition kind
  distinguish_by:
  - deposit_disposition
  fields:
    deposit_disposition: applied_to_balance or refunded
    refund_payee: payee of a refunded deposit
    amount: amount disposed (positive)
    entry_date: date
  account: security_deposit
  direction: out
  triggers:
  - event: private:private_payment
    when:
      deposit_disposition: applied_to_balance
    map:
      amount: amount
      payment_method: deposit_application
      payment_source: security_deposit
- type: private_collection_referral
  target: private_ledger
  meaning: A past-due balance is referred to the outside collection agency.
  grain: one row per referral
  distinguish_by:
  - entry_date
  fields:
    amount: balance referred (positive)
    entry_date: referral date
  triggers: []
measures:
- id: private_msr_open_charge_balance
  window: the life of one charge, as of the posting date
  measure: amount of the named private_room_board_charge or private_fee_charge minus private_payment and private_adjustment
    amounts naming it plus private_payment_reversal amounts naming it
- id: private_msr_past_due_room_board
  window: every service month of the agreement whose due date is more than late_charge_grace_days calendar days
    before the assessment date
  measure: sum of private_msr_open_charge_balance over private_room_board_charge entries of those months (fees and
    late charges excluded)
- id: private_msr_returned_payments
  window: rolling returned_payment_lookback_months calendar months ending on the payment date, across all of the
    resident's agreements
  measure: count of private_payment_reversal entries
- id: private_msr_oldest_unpaid_due_days
  window: as of the handling date
  measure: calendar days from the due date (payment_due_day_of_month of the service month) of the oldest private_room_board_charge
    with an open balance to the handling date
policies:
- id: private_agg_multi_holding
  subject:
  - private_agreement_open
  rule: A resident may hold successive private-pay agreements, one per admission (a readmission after discharge
    signs a new agreement), but only one agreement may be pending_admission, active, notice_period or payer_converted
    at a time. A new agreement is opened only when no other agreement of the resident is still open.
  eligibility:
  - id: one_open_agreement
    applies_to:
    - private_agreement_open
    kind: dedup
    condition: A new agreement is opened only when no other agreement of the resident is still open.
    evidence_fields:
    - private_agreements.customer_id
    - private_agreements.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.customer_id
      action_bindings:
        private_agreements.customer_id: customer_id
    dedup_contract:
      table: private_agreements
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending_admission
        - active
        - notice_period
        - payer_converted
      distinct_fields: []
  params:
    max_per_customer: null
- id: private_agg_resident_balance
  subject:
  - private_refund
  - private_payment
  - private_collection_referral
  rule: 'Balances are settled across all of a resident''s private-pay agreements: before any credit balance on one
    agreement is refunded, it is applied to open charges on the resident''s other agreements, oldest service month
    first, and only the remainder is refunded. Collection referral looks at the resident''s combined past-due balance
    across agreements.'
  eligibility: []
  params:
    payment_application_order: =payment_application_order
- id: private_rate_schedule
  subject:
  - private_room_board_charge
  - private_rate_notice_delivered
  rule: Each charged day is priced at the tier's scheduled daily rate in effect for that day. A scheduled rate takes
    effect for an agreement on the later of the schedule's effective date and the rate notice delivery date plus
    the rate change notice days; until then the earlier scheduled rate applies, and days billed at a new rate before
    it took effect are credited with reason rate_notice_late. A rate that has not been noticed at all never applies.
    Charges priced at a rate held back for a late notice carry the charge basis prior_rate_notice_hold. The amount
    of a span is its chargeable days times the daily rate, rounded to the cent.
  eligibility: []
  params:
    per_tier:
      Semi-Private Long-Term Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Semi-Private Secure Memory Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Private Long-Term Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Private Secure Memory Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Private Bariatric Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Private Suite with Sitting Area:
        daily_rate_schedule: =daily_rate_schedule
    rate_change_notice_days: =rate_change_notice_days
    rate_effective_basis: =rate_effective_basis
  formula:
    amount: round(day_count * daily_rate, 2)
- id: private_evt_room_board_billing
  subject:
  - private_room_board_charge
  rule: 'Room and board is billed per calendar month in advance: the statement for a service month issues on the
    statement day of the prior month and the month''s charge is due on the payment due day of the service month.
    Chargeable days follow the midnight census: the day of admission is charged and the day of discharge or death
    is not. The admission month is charged from the admission date to month end. A month in which the tier or the
    rate changes is split into one span per tier and rate. Room and board is charged only while the agreement is
    active or notice_period. When the center itself moves the resident into a room for infection control, the span
    is priced at the isolation billing tier''s rate with charge basis isolation_rate for as long as the isolation
    placement lasts; a move the resident requested is priced at the new tier''s own rate.'
  eligibility:
  - id: billable_state
    applies_to:
    - private_room_board_charge
    kind: state
    condition: Room and board is charged only while the agreement is active or notice_period.
    evidence_fields:
    - private_agreements.private_agreement_id
    - private_agreements.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
    state_contract:
      field: private_agreements.status
      allowed:
      - active
      - notice_period
  params:
    per_tier:
      Semi-Private Long-Term Care Room:
        isolation_billing_tier: =isolation_billing_tier
      Semi-Private Secure Memory Care Room:
        isolation_billing_tier: =isolation_billing_tier
      Private Long-Term Care Room:
        isolation_billing_tier: =isolation_billing_tier
      Private Secure Memory Care Room:
        isolation_billing_tier: =isolation_billing_tier
      Private Bariatric Care Room:
        isolation_billing_tier: =isolation_billing_tier
      Private Suite with Sitting Area:
        isolation_billing_tier: =isolation_billing_tier
    billing_cycle: =billing_cycle
    statement_day_of_prior_month: =statement_day_of_prior_month
    payment_due_day_of_month: =payment_due_day_of_month
    admission_day_charged: =admission_day_charged
    discharge_day_charged: =discharge_day_charged
    death_day_charged: =death_day_charged
    charge_day_rule: =charge_day_rule
    first_month_basis: =first_month_basis
- id: private_tier_placement
  subject:
  - private_room_change
  rule: A resident moves into a secure memory care tier only with a dementia diagnosis on the care plan, and into
    the bariatric room only with a documented weight at or above the tier's bariatric weight threshold; the clinical
    criteria are confirmed at each care-plan review within the care-plan review days, and a resident who no longer
    meets them moves to the matching standard tier. A move the resident requests reprices from the move date and
    needs no advance rate-change notice. A move the center directs for infection control is recorded with isolation
    placement true and does not by itself change what the resident pays. Only an open, active agreement changes
    tier; a move within a month splits that month's charge at the move date and credits any advance charge for the
    remaining days at the old tier with reason room_change_proration.
  eligibility: []
  params:
    per_tier:
      Semi-Private Long-Term Care Room:
        room_type: =room_type
        beds_per_room: =beds_per_room
        secure_unit: =secure_unit
        dementia_diagnosis_required: =dementia_diagnosis_required
        bariatric_weight_threshold_lb: =bariatric_weight_threshold_lb
      Semi-Private Secure Memory Care Room:
        room_type: =room_type
        beds_per_room: =beds_per_room
        secure_unit: =secure_unit
        dementia_diagnosis_required: =dementia_diagnosis_required
        bariatric_weight_threshold_lb: =bariatric_weight_threshold_lb
      Private Long-Term Care Room:
        room_type: =room_type
        beds_per_room: =beds_per_room
        secure_unit: =secure_unit
        dementia_diagnosis_required: =dementia_diagnosis_required
        bariatric_weight_threshold_lb: =bariatric_weight_threshold_lb
      Private Secure Memory Care Room:
        room_type: =room_type
        beds_per_room: =beds_per_room
        secure_unit: =secure_unit
        dementia_diagnosis_required: =dementia_diagnosis_required
        bariatric_weight_threshold_lb: =bariatric_weight_threshold_lb
      Private Bariatric Care Room:
        room_type: =room_type
        beds_per_room: =beds_per_room
        secure_unit: =secure_unit
        dementia_diagnosis_required: =dementia_diagnosis_required
        bariatric_weight_threshold_lb: =bariatric_weight_threshold_lb
      Private Suite with Sitting Area:
        room_type: =room_type
        beds_per_room: =beds_per_room
        secure_unit: =secure_unit
        dementia_diagnosis_required: =dementia_diagnosis_required
        bariatric_weight_threshold_lb: =bariatric_weight_threshold_lb
    care_plan_review_days: =care_plan_review_days
    room_change_rate_basis: =room_change_rate_basis
    room_change_notice_required: =room_change_notice_required
- id: private_evt_payments
  subject:
  - private_payment
  - private_payment_reversal
  - private_fee_charge
  rule: A payment names the charge it pays and is applied only up to that charge's open balance; a payment without
    instructions is applied oldest service month first, room and board before fees. The business office accepts
    the listed payment methods; a single card payment may not exceed the card payment maximum. Payments may come
    from the resident, the representative, a long-term care insurer under an assignment of benefits, a transfer
    from the resident's own trust account that the resident authorized, or the security deposit at disposition.
    A dishonored payment is reversed against the payment entry it came from for the full amount applied, and a returned-payment
    fee from the operator's fee schedule is charged for it. A payment entry is reversed at most once. Once the resident
    has had the returned-payment limit of dishonored payments within the rolling lookback months, only certified
    funds are accepted on any of the resident's agreements.
  eligibility:
  - id: reverse_once
    applies_to:
    - private_payment_reversal
    kind: dedup
    condition: A payment entry is reversed at most once.
    evidence_fields:
    - private_ledger.payment_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_ledger.payment_entry_id
      action_bindings:
        private_ledger.payment_entry_id: payment_entry_id
    dedup_contract:
      table: private_ledger
      mode: separate_record
      object_bindings:
        payment_entry_id: payment_entry_id
      duplicate_filters:
        event_type:
        - private_payment_reversal
      distinct_fields: []
  params:
    accepted_payment_methods: =accepted_payment_methods
    card_payment_max_usd: =card_payment_max_usd
    returned_payment_fee_usd: =returned_payment_fee_usd
    returned_payment_limit: =returned_payment_limit
    returned_payment_lookback_months: =returned_payment_lookback_months
    certified_funds_methods: =certified_funds_methods
    payment_application_order: =payment_application_order
  formula:
    applied_amount: min(amount, private_msr_open_charge_balance)
    certified_funds_only: private_msr_returned_payments >= returned_payment_limit
  measures:
  - private_msr_open_charge_balance
  - private_msr_returned_payments
- id: private_evt_late_charge
  subject:
  - private_fee_charge
  rule: A late charge is the past-due room-and-board balance times the monthly late charge rate, rounded to the
    cent; a room-and-board month becomes past due once the late charge grace days have run from its due date. No
    late charge is assessed on fees or on earlier late charges, and none is assessed when the past-due room-and-board
    balance is below the late charge minimum. A late charge is assessed only while the agreement is active, notice_period
    or discharged. Nothing is assessed while the stay is converted to another payer source, and nothing for any
    month the converted payer source covers. At most the monthly maximum of late charges is assessed per agreement
    per calendar month. A returned-payment fee is charged once per dishonored payment at the operator's fee schedule
    amount.
  eligibility:
  - id: late_charge_state
    applies_to:
    - private_fee_charge
    kind: state
    condition: A late charge is assessed only while the agreement is active, notice_period or discharged.
    evidence_fields:
    - private_agreements.private_agreement_id
    - private_agreements.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
    state_contract:
      field: private_agreements.status
      allowed:
      - active
      - notice_period
      - discharged
  - id: one_late_charge_per_month
    applies_to:
    - private_fee_charge
    kind: dedup
    condition: At most the monthly maximum of late charges is assessed per agreement per calendar month.
    evidence_fields:
    - private_ledger.private_agreement_id
    - private_ledger.fee_type
    - private_ledger.service_month
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_ledger.private_agreement_id
      action_bindings:
        private_ledger.private_agreement_id: private_agreement_id
    dedup_contract:
      table: private_ledger
      mode: separate_record
      object_bindings:
        private_agreement_id: private_agreement_id
        service_month: service_month
      duplicate_filters:
        fee_type:
        - late_charge
      distinct_fields:
      - payment_entry_id
  params:
    late_charge_rate_pct_monthly: =late_charge_rate_pct_monthly
    late_charge_grace_days: =late_charge_grace_days
    late_charge_min_past_due_usd: =late_charge_min_past_due_usd
    late_charge_basis: =late_charge_basis
    late_charge_max_per_month: =late_charge_max_per_month
    late_charge_suppressed_while_converted: =late_charge_suppressed_while_converted
    returned_payment_fee_usd: =returned_payment_fee_usd
  formula:
    when: private_msr_past_due_room_board >= late_charge_min_past_due_usd
    amount: round(private_msr_past_due_room_board * late_charge_rate_pct_monthly / 100, 2)
  measures:
  - private_msr_past_due_room_board
- id: private_discharge_rules
  subject:
  - private_discharge_notice
  - private_notice_rescinded
  - private_notice_discharge
  rule: 'The center may discharge a resident only for a reason the federal rules allow: nonpayment, needs the center
    cannot meet, health improved so the resident no longer needs the services, the safety or health of individuals
    endangered, or the center closing. A facility-initiated discharge notice states a discharge date at least the
    discharge notice days after the notice date, unless the notice reason is one of the discharge notice exception
    reasons, in which case notice is given as soon as practicable; a resident who has lived in the center fewer
    than the short residence days may also be given notice as soon as practicable. A notice for nonpayment issues
    only when the oldest unpaid room-and-board charge is at least the nonpayment minimum days past due and no Medicaid
    application of the resident is pending. A resident whose Medicaid application has been submitted is not in nonpayment
    status, and a notice already issued for nonpayment is rescinded when the application is submitted or the past-due
    balance is paid. Every notice is copied to the State Long-Term Care Ombudsman. The resident is not discharged
    under the notice while a timely appeal is pending, unless the notice reason is safety_endangered or health_endangered;
    an appeal decided for the resident rescinds the notice.'
  eligibility:
  - id: notice_period_met
    applies_to:
    - private_discharge_notice
    kind: authorization
    condition: A facility-initiated discharge notice states a discharge date at least the discharge notice days
      after the notice date, unless the notice reason is one of the discharge notice exception reasons, in which
      case notice is given as soon as practicable; a resident who has lived in the center fewer than the short residence
      days may also be given notice as soon as practicable.
    evidence_fields:
    - private_agreements.private_agreement_id
    - private_agreements.discharge_notice_date
    - private_agreements.planned_discharge_date
    - private_agreements.discharge_notice_reason
    - private_agreements.admission_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
  - id: nonpayment_basis
    applies_to:
    - private_discharge_notice
    kind: authorization
    condition: A notice for nonpayment issues only when the oldest unpaid room-and-board charge is at least the
      nonpayment minimum days past due and no Medicaid application of the resident is pending.
    evidence_fields:
    - private_agreements.private_agreement_id
    - private_ledger.service_month
    - medicaid_cases.status
    - medicaid_cases.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
  - id: appeal_stays_discharge
    applies_to:
    - private_notice_discharge
    kind: authorization
    condition: The resident is not discharged under the notice while a timely appeal is pending, unless the notice
      reason is safety_endangered or health_endangered; an appeal decided for the resident rescinds the notice.
    evidence_fields:
    - private_agreements.private_agreement_id
    - private_agreements.discharge_appeal_filed_date
    - private_agreements.discharge_notice_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
  params:
    discharge_notice_days: =discharge_notice_days
    discharge_notice_exception_reasons: =discharge_notice_exception_reasons
    short_residence_days: =short_residence_days
    nonpayment_min_days_past_due: =nonpayment_min_days_past_due
    medicaid_application_blocks_nonpayment_discharge: =medicaid_application_blocks_nonpayment_discharge
    discharge_stayed_during_appeal: =discharge_stayed_during_appeal
    ombudsman_copy_required: =ombudsman_copy_required
  measures:
  - private_msr_oldest_unpaid_due_days
- id: private_evt_discharge_refund
  subject:
  - private_discharge
  - private_adjustment
  - private_refund
  rule: 'When the resident leaves, dies or is converted to another payer source, room and board already billed for
    days after the last chargeable day is credited against the charge that billed them: discharge_proration on a
    discharge, death_proration on a death and payer_conversion_credit on a conversion; the credit is the credited
    days times the daily rate of that charge, rounded to the cent. The day of discharge or death is not chargeable.
    Bed-hold days the resident elected while away are charged under the bed-hold reservation, not under this agreement.
    Prepaid charges are refunded regardless of any minimum-stay or discharge-notice term, and the agreement never
    charges for missing notice of a voluntary move-out. A refund is issued only from a credit balance remaining
    after the deposit disposition and after open charges on the resident''s other agreements are paid. The credit
    balance is refunded within the credit refund days after discharge, to the resident or the representative designated
    on the request on file, and after a death to the estate. A charge is credited once per adjustment reason.'
  eligibility:
  - id: refund_from_credit
    applies_to:
    - private_refund
    kind: authorization
    condition: A refund is issued only from a credit balance remaining after the deposit disposition and after open
      charges on the resident's other agreements are paid.
    evidence_fields:
    - private_agreements.private_agreement_id
    - private_agreements.account_balance
    - private_agreements.deposit_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
  - id: credit_once
    applies_to:
    - private_adjustment
    kind: dedup
    condition: A charge is credited once per adjustment reason.
    evidence_fields:
    - private_ledger.charge_entry_id
    - private_ledger.adjustment_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_ledger.charge_entry_id
      action_bindings:
        private_ledger.charge_entry_id: charge_entry_id
    dedup_contract:
      table: private_ledger
      mode: separate_record
      object_bindings:
        charge_entry_id: charge_entry_id
        adjustment_reason: adjustment_reason
      duplicate_filters:
        event_type:
        - private_adjustment
      distinct_fields: []
  params:
    discharge_day_charged: =discharge_day_charged
    death_day_charged: =death_day_charged
    refund_regardless_of_notice: =refund_regardless_of_notice
    minimum_stay_charge_allowed: =minimum_stay_charge_allowed
    credit_refund_days: =credit_refund_days
    refund_payee_on_death: =refund_payee_on_death
    final_statement_days: =final_statement_days
  formula:
    credit_amount: round(day_count * daily_rate, 2)
- id: private_deposit
  subject:
  - private_deposit_received
  - private_deposit_disposition
  - private_agreement_open
  rule: A refundable security deposit of the security deposit days times the tier's daily rate in effect on the
    admission date is collected on a private-pay agreement. A deposit is collected only while the agreement is pending_admission
    or active, and never from a resident whose stay is billed to Medicare Part A or Medicaid, including Medicaid
    pending. Within the deposit disposition days after discharge, or after conversion to a payer source for which
    no deposit may be held, the deposit is applied to the agreement's open balance and any remainder is refunded
    to the resident, the designated representative, or the estate after a death.
  eligibility:
  - id: deposit_state
    applies_to:
    - private_deposit_received
    kind: state
    condition: A deposit is collected only while the agreement is pending_admission or active, and never from a
      resident whose stay is billed to Medicare Part A or Medicaid, including Medicaid pending.
    evidence_fields:
    - private_agreements.private_agreement_id
    - private_agreements.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
    state_contract:
      field: private_agreements.status
      allowed:
      - pending_admission
      - active
  params:
    per_tier:
      Semi-Private Long-Term Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Semi-Private Secure Memory Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Private Long-Term Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Private Secure Memory Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Private Bariatric Care Room:
        daily_rate_schedule: =daily_rate_schedule
      Private Suite with Sitting Area:
        daily_rate_schedule: =daily_rate_schedule
    security_deposit_days: =security_deposit_days
    deposit_prohibited_payer_sources: =deposit_prohibited_payer_sources
    deposit_disposition_days: =deposit_disposition_days
    deposit_application_order: =deposit_application_order
  formula:
    deposit_amount: round(security_deposit_days * daily_rate, 2)
- id: private_payer_source_change
  subject:
  - private_payer_conversion
  - private_payer_reversion
  - private_admission
  rule: 'The stay converts away from private pay on the first day another payer source covers: for Medicaid pending,
    the eligibility start date requested on the submitted Medicaid application; for Medicare Part A, the coverage
    start date of the Part A episode; for hospice room and board, the hospice election date. Advance room and board
    billed for days on or after the conversion date is credited with reason payer_conversion_credit. If the other
    payer source is denied or ends while the resident stays, private-pay billing resumes: after a Medicaid denial,
    the denied pending period is charged again at the private rate from the original conversion date; after Part
    A coverage ends, from the day after the last covered date. A private admission begins private-pay billing on
    the admission date.'
  eligibility: []
  params:
    deposit_prohibited_payer_sources: =deposit_prohibited_payer_sources
    late_charge_suppressed_while_converted: =late_charge_suppressed_while_converted
- id: private_evt_collections
  subject:
  - private_collection_referral
  rule: A past-due balance is referred to the outside collection agency only when the oldest unpaid room-and-board
    charge's due date is at least the collection referral days past due before the referral date, counted in calendar
    days from the day after the due date, and the combined past-due balance is at least the collection referral
    minimum. No balance is referred while the stay is converted to Medicaid pending or while a discharge appeal
    is pending, and nothing the converted payer source covers is ever referred.
  eligibility:
  - id: referral_age
    applies_to:
    - private_collection_referral
    kind: time
    condition: A past-due balance is referred to the outside collection agency only when the oldest unpaid room-and-board
      charge's due date is at least the collection referral days past due before the referral date, counted in calendar
      days from the day after the due date, and the combined past-due balance is at least the collection referral
      minimum.
    evidence_fields:
    - private_ledger.private_agreement_id
    - private_ledger.service_month
    - private_agreements.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_ledger.private_agreement_id
      action_bindings:
        private_ledger.private_agreement_id: private_agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the oldest unpaid room-and-board charge's due date
      anchor_source: private_ledger.service_month
      relation: not_before
      duration_source: variants.collection_referral_days_past_due
      unit: calendar_days
      counting_rule: counted in calendar days from the day after the due date
      boundary: inclusive
  params:
    collection_referral_days_past_due: =collection_referral_days_past_due
    collection_referral_min_usd: =collection_referral_min_usd
    payment_due_day_of_month: =payment_due_day_of_month
  measures:
  - private_msr_oldest_unpaid_due_days
- id: private_agreement_closure
  subject:
  - private_close
  - private_converted_close
  - private_admission_cancel
  rule: An agreement is closed only when its account balance and its deposit balance are both zero. A converted
    agreement stays open while any private charge, credit or deposit remains on it. A cancelled admission refunds
    any advance payment and deposit in full, because no day was charged.
  eligibility:
  - id: settled_to_close
    applies_to:
    - private_close
    - private_converted_close
    kind: authorization
    condition: An agreement is closed only when its account balance and its deposit balance are both zero.
    evidence_fields:
    - private_agreements.private_agreement_id
    - private_agreements.account_balance
    - private_agreements.deposit_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
  params:
    close_requires_zero_balance: =close_requires_zero_balance
