events:
- type: therapy_plan_open
  target: therapy_plans
  mutation: create
  meaning: A therapy referral is registered.
  grain: one row per plan of care
  fields:
    customer_id: the resident
    variant_name: tier from payer and discipline
    referral_date: date of the order for evaluation
  triggers: []
- type: therapy_plan_certify
  target: therapy_plans
  mutation:
    transition:
      from: referred
      to: active
  meaning: The plan of care is signed and treatment starts.
  grain: one row per transaction
  fields:
    evaluation_date: evaluation date
    certification_date: date the plan was signed
    certification_through_date: last day the signed plan covers
    authorized_visits: visits the payer authorized, where authorization applies
    ma_copay_per_visit: Medicare Advantage copay per visit from the plan's authorization
  triggers: []
- type: therapy_plan_not_indicated
  target: therapy_plans
  mutation:
    transition:
      from: referred
      to: not_indicated
  meaning: The evaluation finds therapy is not needed.
  grain: one row per transaction
  fields:
    evaluation_date: evaluation date
    closed_date: closing date
  triggers: []
- type: therapy_plan_recertify
  target: therapy_plans
  mutation: update
  meaning: The plan of care is recertified or its authorization extended.
  grain: one row per transaction
  fields:
    certification_date: recertification date
    certification_through_date: new last covered day
    authorized_visits: updated authorized visits
    ma_copay_per_visit: updated copay
  triggers: []
- type: therapy_plan_hold
  target: therapy_plans
  mutation:
    transition:
      from: active
      to: on_hold
  meaning: Treatment pauses during a hospitalization.
  grain: one row per transaction
  fields:
    hold_start_date: first day on hold
  triggers: []
- type: therapy_plan_resume
  target: therapy_plans
  mutation:
    transition:
      from: on_hold
      to: active
  meaning: Treatment resumes after the hold.
  grain: one row per transaction
  fields:
    hold_start_date: cleared
  triggers: []
- type: therapy_plan_discharge
  target: therapy_plans
  mutation:
    transition:
      from: active
      to: discharged
  meaning: The resident is discharged from therapy.
  grain: one row per transaction
  fields:
    discharge_date: date of discharge from therapy
    discharge_reason: goals_met, plateau, resident_declined or payer_authorization_ended
  triggers: []
- type: therapy_hold_discharge
  target: therapy_plans
  mutation:
    transition:
      from: on_hold
      to: discharged
  meaning: A plan on hold past the hold limit is discharged.
  grain: one row per transaction
  fields:
    discharge_date: date of discharge
    discharge_reason: hold_exceeded
  triggers: []
- type: therapy_plan_close
  target: therapy_plans
  mutation:
    transition:
      from: discharged
      to: closed
  meaning: A discharged plan is settled and closed.
  grain: one row per transaction
  fields:
    closed_date: closing date
  triggers: []
- type: therapy_visit
  target: therapy_ledger
  meaning: A treatment visit or evaluation is furnished and claimed.
  grain: one row per plan, service date and procedure
  distinguish_by:
  - service_date
  - procedure_type
  fields:
    service_date: date furnished
    procedure_type: procedure
    minutes: total timed minutes
    units: billable units
    allowed_amount: payer allowed amount for the line
    kx_modifier: whether the KX modifier was attached
    entry_date: claim date
  triggers: []
- type: therapy_late_cancellation
  target: therapy_ledger
  meaning: A scheduled private-pay visit is cancelled late or missed.
  grain: one row per scheduled visit date
  distinguish_by:
  - service_date
  fields:
    service_date: scheduled date
    entry_date: date recorded
  triggers: []
- type: therapy_resident_charge
  target: therapy_ledger
  meaning: A resident share of a visit or a fee is charged.
  grain: one row per visit (or cancellation) and charge type
  distinguish_by:
  - visit_entry_id
  - charge_type
  fields:
    visit_entry_id: visit or cancellation charged
    charge_type: part_b_deductible, part_b_coinsurance, ma_copay, private_rate or late_cancel_fee
    service_date: date of service
    amount: charge (positive)
    entry_date: posting date
  account: therapy_receivable
  direction: in
  triggers: []
- type: therapy_payment
  target: therapy_ledger
  meaning: A payment is applied to one therapy charge.
  grain: one row per receipt applied to one charge
  distinguish_by:
  - charge_entry_id
  - entry_date
  - payment_method
  fields:
    charge_entry_id: charge paid
    payment_method: check, ach, card or trust_transfer
    amount: amount applied (positive)
    entry_date: date received
  account: therapy_receivable
  direction: out
  triggers: []
- type: therapy_credit
  target: therapy_ledger
  meaning: A therapy charge is credited.
  grain: one row per charge and reason
  distinguish_by:
  - charge_entry_id
  - credit_reason
  fields:
    charge_entry_id: charge credited
    credit_reason: part_a_overlap, no_valid_abn, uncertified_visit, progress_report_overdue, deductible_recalculated
      or billing_error
    amount: credit (positive)
    entry_date: posting date
  account: therapy_receivable
  direction: out
  triggers: []
- type: therapy_abn_delivered
  target: therapy_ledger
  meaning: An Advance Beneficiary Notice of Non-coverage is delivered and the option chosen recorded.
  grain: one row per delivery and first service described
  distinguish_by:
  - entry_date
  - service_date
  fields:
    abn_option: option_1_bill_medicare, option_2_no_bill or option_3_decline_service
    service_date: first service the notice describes
    entry_date: delivery date
  triggers: []
- type: therapy_progress_report
  target: therapy_ledger
  meaning: A progress report is completed for the plan.
  grain: one row per report
  distinguish_by:
  - entry_date
  fields:
    entry_date: report date
    units: visits covered since the last report
  triggers: []
measures:
- id: therapy_msr_kx_allowed_ytd
  window: the calendar year of the service date, across all of the resident's Part B therapy plans in the same KX
    threshold group
  measure: sum of allowed_amount over therapy_visit entries of those plans
- id: therapy_msr_visits_since_report
  window: from the day after the plan's latest therapy_progress_report (or its certification date) to the visit
    date
  measure: count of therapy_visit service dates on the plan
- id: therapy_msr_open_charge_balance
  window: the life of one charge, as of the posting date
  measure: amount of the named therapy_resident_charge minus therapy_payment and therapy_credit amounts naming it
policies:
- id: therapy_agg_multi_holding
  subject:
  - therapy_plan_open
  rule: A resident may have several therapy plans at once, one per discipline, and successive plans over time. A
    new plan is opened only when the resident has no other plan of the same tier that is referred, active or on_hold.
  eligibility:
  - id: one_per_discipline
    applies_to:
    - therapy_plan_open
    kind: dedup
    condition: A new plan is opened only when the resident has no other plan of the same tier that is referred,
      active or on_hold.
    evidence_fields:
    - therapy_plans.customer_id
    - therapy_plans.variant_name
    - therapy_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - therapy_plans.customer_id
      action_bindings:
        therapy_plans.customer_id: customer_id
    dedup_contract:
      table: therapy_plans
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        variant_name: variant_name
      duplicate_filters:
        status:
        - referred
        - active
        - on_hold
      distinct_fields: []
  params:
    max_per_customer: null
- id: therapy_agg_kx_threshold
  subject:
  - therapy_visit
  - therapy_resident_charge
  rule: 'Allowed amounts count toward the KX threshold per calendar year across all of the resident''s Part B plans
    in the same threshold group: physical therapy and speech-language pathology together, occupational therapy alone.
    Once a group''s allowed amounts for the year exceed the KX threshold of that year, further visits in the group
    are covered only with medical-necessity documentation in the record and the KX modifier attached; past the targeted
    medical review threshold, claims may be reviewed. The annual Part B deductible is one deductible shared with
    every other Part B service at the center.'
  eligibility: []
  params:
    per_tier:
      Medicare Part B Physical Therapy Plan of Care:
        kx_threshold_group: =kx_threshold_group
        kx_threshold_resident_notice: =kx_threshold_resident_notice
      Medicare Part B Occupational Therapy Plan of Care:
        kx_threshold_group: =kx_threshold_group
        kx_threshold_resident_notice: =kx_threshold_resident_notice
      Medicare Part B Speech-Language Pathology Plan of Care:
        kx_threshold_group: =kx_threshold_group
        kx_threshold_resident_notice: =kx_threshold_resident_notice
      Medicare Advantage Outpatient Therapy Plan of Care:
        kx_threshold_group: =kx_threshold_group
        kx_threshold_resident_notice: =kx_threshold_resident_notice
      Medical Assistance Therapy Plan of Care:
        kx_threshold_group: =kx_threshold_group
        kx_threshold_resident_notice: =kx_threshold_resident_notice
      Private Pay Therapy Plan of Care:
        kx_threshold_group: =kx_threshold_group
        kx_threshold_resident_notice: =kx_threshold_resident_notice
    kx_threshold_by_year: =kx_threshold_by_year
    targeted_medical_review_threshold_usd: =targeted_medical_review_threshold_usd
    kx_requires_documentation: =kx_requires_documentation
    deductible_source: =deductible_source
  formula:
    kx_required: therapy_msr_kx_allowed_ytd > 0
  measures:
  - therapy_msr_kx_allowed_ytd
- id: therapy_plan_certification
  subject:
  - therapy_plan_certify
  - therapy_plan_not_indicated
  - therapy_plan_recertify
  rule: Treatment starts only after an evaluation and a plan of care signed by the physician or practitioner within
    the initial certification days after the evaluation. A plan runs at most the plan certification maximum before
    it must be recertified. Medicare Advantage visits need the plan's authorization, with more visits requested
    when the authorized visits remaining fall to the reauthorization lead; Medical Assistance visits need prior
    authorization. Therapy to maintain function is covered when skilled care is needed, even without expected improvement.
    An evaluation that finds no skilled need ends the referral as not_indicated.
  eligibility: []
  params:
    per_tier:
      Medicare Part B Physical Therapy Plan of Care:
        ma_authorization_required: =ma_authorization_required
        ma_reauthorization_lead_visits: =ma_reauthorization_lead_visits
        medicaid_prior_authorization_required: =medicaid_prior_authorization_required
      Medicare Part B Occupational Therapy Plan of Care:
        ma_authorization_required: =ma_authorization_required
        ma_reauthorization_lead_visits: =ma_reauthorization_lead_visits
        medicaid_prior_authorization_required: =medicaid_prior_authorization_required
      Medicare Part B Speech-Language Pathology Plan of Care:
        ma_authorization_required: =ma_authorization_required
        ma_reauthorization_lead_visits: =ma_reauthorization_lead_visits
        medicaid_prior_authorization_required: =medicaid_prior_authorization_required
      Medicare Advantage Outpatient Therapy Plan of Care:
        ma_authorization_required: =ma_authorization_required
        ma_reauthorization_lead_visits: =ma_reauthorization_lead_visits
        medicaid_prior_authorization_required: =medicaid_prior_authorization_required
      Medical Assistance Therapy Plan of Care:
        ma_authorization_required: =ma_authorization_required
        ma_reauthorization_lead_visits: =ma_reauthorization_lead_visits
        medicaid_prior_authorization_required: =medicaid_prior_authorization_required
      Private Pay Therapy Plan of Care:
        ma_authorization_required: =ma_authorization_required
        ma_reauthorization_lead_visits: =ma_reauthorization_lead_visits
        medicaid_prior_authorization_required: =medicaid_prior_authorization_required
    evaluation_required: =evaluation_required
    initial_certification_days: =initial_certification_days
    plan_certification_max_days: =plan_certification_max_days
    maintenance_therapy_covered: =maintenance_therapy_covered
    reevaluation_on_significant_change: =reevaluation_on_significant_change
- id: therapy_evt_visits
  subject:
  - therapy_visit
  - therapy_progress_report
  - therapy_late_cancellation
  rule: Timed minutes on a date convert to units by the eight-minute rule, with fewer than the unit minimum producing
    no billable unit; one visit per discipline per day is billed, a co-treated session splits its units between
    the disciplines, and a group session is billed once per resident. Visits are billed only while the plan is active.
    A progress report is due after each progress report interval of visits; visits after an overdue report, and
    visits outside a signed current plan, are not billable to anyone. No Part B therapy is billed for a day the
    resident is in a Part A covered stay, because therapy is part of the Part A per diem. A late cancellation is
    recorded only for a private-pay visit cancelled with less than the late cancel notice hours or missed.
  eligibility:
  - id: active_plan
    applies_to:
    - therapy_visit
    kind: state
    condition: Visits are billed only while the plan is active.
    evidence_fields:
    - therapy_plans.therapy_plan_id
    - therapy_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - therapy_plans.therapy_plan_id
      action_bindings:
        therapy_plans.therapy_plan_id: therapy_plan_id
    state_contract:
      field: therapy_plans.status
      allowed:
      - active
  params:
    timed_unit_minutes: =timed_unit_minutes
    unit_rule: =unit_rule
    unit_minimum_minutes: =unit_minimum_minutes
    visits_per_day_per_discipline: =visits_per_day_per_discipline
    cotreatment_billing: =cotreatment_billing
    group_therapy_billing: =group_therapy_billing
    progress_report_interval_visits: =progress_report_interval_visits
    progress_report_late_visits_billable: =progress_report_late_visits_billable
    uncertified_visits_billable: =uncertified_visits_billable
    part_a_overlap_billable: =part_a_overlap_billable
    late_cancel_notice_hours: =late_cancel_notice_hours
  measures:
  - therapy_msr_visits_since_report
- id: therapy_evt_resident_charges
  subject:
  - therapy_resident_charge
  rule: 'What the resident owes for a visit depends on the tier: under Part B, any unmet part of the year''s shared
    Part B deductible, then the Part B coinsurance percent of the rest of the allowed amount; under Medicare Advantage,
    the per-visit copay recorded from the plan''s authorization; under Medical Assistance, the tier''s resident
    copay, which is zero for a nursing facility resident; and under private pay, the evaluation or re-evaluation
    fee, the unit rate per unit, or the group session charge. A late cancellation fee applies only to the private
    pay tier. Each visit is charged once per charge type, rounded half up to the cent.'
  eligibility:
  - id: charge_once
    applies_to:
    - therapy_resident_charge
    kind: dedup
    condition: Each visit is charged once per charge type, rounded half up to the cent.
    evidence_fields:
    - therapy_ledger.visit_entry_id
    - therapy_ledger.charge_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - therapy_ledger.visit_entry_id
      action_bindings:
        therapy_ledger.visit_entry_id: visit_entry_id
    dedup_contract:
      table: therapy_ledger
      mode: separate_record
      object_bindings:
        visit_entry_id: visit_entry_id
        charge_type: charge_type
      duplicate_filters:
        event_type:
        - therapy_resident_charge
      distinct_fields: []
  params:
    per_tier:
      Medicare Part B Physical Therapy Plan of Care:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
        ma_copay_basis: =ma_copay_basis
        medicaid_resident_copay_usd: =medicaid_resident_copay_usd
        private_evaluation_fee_usd: =private_evaluation_fee_usd
        private_reevaluation_fee_usd: =private_reevaluation_fee_usd
        private_unit_rate_usd: =private_unit_rate_usd
        private_group_session_usd: =private_group_session_usd
        late_cancel_fee_usd: =late_cancel_fee_usd
      Medicare Part B Occupational Therapy Plan of Care:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
        ma_copay_basis: =ma_copay_basis
        medicaid_resident_copay_usd: =medicaid_resident_copay_usd
        private_evaluation_fee_usd: =private_evaluation_fee_usd
        private_reevaluation_fee_usd: =private_reevaluation_fee_usd
        private_unit_rate_usd: =private_unit_rate_usd
        private_group_session_usd: =private_group_session_usd
        late_cancel_fee_usd: =late_cancel_fee_usd
      Medicare Part B Speech-Language Pathology Plan of Care:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
        ma_copay_basis: =ma_copay_basis
        medicaid_resident_copay_usd: =medicaid_resident_copay_usd
        private_evaluation_fee_usd: =private_evaluation_fee_usd
        private_reevaluation_fee_usd: =private_reevaluation_fee_usd
        private_unit_rate_usd: =private_unit_rate_usd
        private_group_session_usd: =private_group_session_usd
        late_cancel_fee_usd: =late_cancel_fee_usd
      Medicare Advantage Outpatient Therapy Plan of Care:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
        ma_copay_basis: =ma_copay_basis
        medicaid_resident_copay_usd: =medicaid_resident_copay_usd
        private_evaluation_fee_usd: =private_evaluation_fee_usd
        private_reevaluation_fee_usd: =private_reevaluation_fee_usd
        private_unit_rate_usd: =private_unit_rate_usd
        private_group_session_usd: =private_group_session_usd
        late_cancel_fee_usd: =late_cancel_fee_usd
      Medical Assistance Therapy Plan of Care:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
        ma_copay_basis: =ma_copay_basis
        medicaid_resident_copay_usd: =medicaid_resident_copay_usd
        private_evaluation_fee_usd: =private_evaluation_fee_usd
        private_reevaluation_fee_usd: =private_reevaluation_fee_usd
        private_unit_rate_usd: =private_unit_rate_usd
        private_group_session_usd: =private_group_session_usd
        late_cancel_fee_usd: =late_cancel_fee_usd
      Private Pay Therapy Plan of Care:
        part_b_coinsurance_pct: =part_b_coinsurance_pct
        ma_copay_basis: =ma_copay_basis
        medicaid_resident_copay_usd: =medicaid_resident_copay_usd
        private_evaluation_fee_usd: =private_evaluation_fee_usd
        private_reevaluation_fee_usd: =private_reevaluation_fee_usd
        private_unit_rate_usd: =private_unit_rate_usd
        private_group_session_usd: =private_group_session_usd
        late_cancel_fee_usd: =late_cancel_fee_usd
    charge_rounding: =charge_rounding
    deductible_source: =deductible_source
  formula:
    part_b_coinsurance: round(allowed_amount * part_b_coinsurance_pct / 100, 2)
    private_units_charge: round(units * private_unit_rate_usd, 2)
- id: therapy_abn
  subject:
  - therapy_abn_delivered
  rule: Before a Part B therapy service Medicare is expected to deny as not reasonable and necessary is furnished
    at the resident's wish, the Advance Beneficiary Notice of Non-coverage is delivered and the beneficiary checks
    one of its options; the choice is the beneficiary's and is recorded as checked. Without a valid ABN, the resident
    is never billed for a denied service. The ABN is not used for services Medicare never covers or for tiers other
    than Part B. One notice is recorded per delivery date and first service described.
  eligibility: []
  params:
    per_tier:
      Medicare Part B Physical Therapy Plan of Care:
        abn_required_for_noncovered: =abn_required_for_noncovered
      Medicare Part B Occupational Therapy Plan of Care:
        abn_required_for_noncovered: =abn_required_for_noncovered
      Medicare Part B Speech-Language Pathology Plan of Care:
        abn_required_for_noncovered: =abn_required_for_noncovered
      Medicare Advantage Outpatient Therapy Plan of Care:
        abn_required_for_noncovered: =abn_required_for_noncovered
      Medical Assistance Therapy Plan of Care:
        abn_required_for_noncovered: =abn_required_for_noncovered
      Private Pay Therapy Plan of Care:
        abn_required_for_noncovered: =abn_required_for_noncovered
    abn_options: =abn_options
    no_abn_resident_liable: =no_abn_resident_liable
- id: therapy_evt_payments_credits
  subject:
  - therapy_payment
  - therapy_credit
  rule: A payment names the charge it pays and is applied only up to its open balance; a trust account transfer
    is posted only on the resident's per-bill authorization recorded with the trust account. A charge for a day
    in a Part A stay, for a denied service without a valid ABN, for a visit outside a signed plan or after an overdue
    progress report, for a deductible already met elsewhere, or billed in error is credited, naming the charge.
    Charges are billed monthly in arrears on the statement day and are due within the payment due days. A charge
    is credited once per reason.
  eligibility:
  - id: credit_once
    applies_to:
    - therapy_credit
    kind: dedup
    condition: A charge is credited once per reason.
    evidence_fields:
    - therapy_ledger.charge_entry_id
    - therapy_ledger.credit_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - therapy_ledger.charge_entry_id
      action_bindings:
        therapy_ledger.charge_entry_id: charge_entry_id
    dedup_contract:
      table: therapy_ledger
      mode: separate_record
      object_bindings:
        charge_entry_id: charge_entry_id
        credit_reason: credit_reason
      duplicate_filters:
        event_type:
        - therapy_credit
      distinct_fields: []
  params:
    accepted_payment_methods: =accepted_payment_methods
    billing_cycle: =billing_cycle
    statement_day_of_month: =statement_day_of_month
    payment_due_days: =payment_due_days
  formula:
    applied_amount: min(amount, therapy_msr_open_charge_balance)
  measures:
  - therapy_msr_open_charge_balance
- id: therapy_plan_hold_discharge
  subject:
  - therapy_plan_hold
  - therapy_plan_resume
  - therapy_plan_discharge
  - therapy_hold_discharge
  - therapy_plan_close
  rule: A plan is put on hold while the resident is hospitalized and resumes on return within the hold maximum days;
    past that, it is discharged as hold_exceeded and a new evaluation is needed. The resident may decline further
    therapy at any time and the plan is then discharged as resident_declined; a resident discharged from therapy
    is referred to the restorative nursing program at no charge. A discharged plan is closed only when its balance
    is zero.
  eligibility:
  - id: zero_to_close
    applies_to:
    - therapy_plan_close
    kind: authorization
    condition: A discharged plan is closed only when its balance is zero.
    evidence_fields:
    - therapy_plans.therapy_plan_id
    - therapy_plans.account_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - therapy_plans.therapy_plan_id
      action_bindings:
        therapy_plans.therapy_plan_id: therapy_plan_id
  params:
    hold_on_hospitalization: =hold_on_hospitalization
    hold_max_days: =hold_max_days
    resident_may_stop_therapy: =resident_may_stop_therapy
    restorative_referral_on_discharge: =restorative_referral_on_discharge
    close_requires_zero_balance: =close_requires_zero_balance
