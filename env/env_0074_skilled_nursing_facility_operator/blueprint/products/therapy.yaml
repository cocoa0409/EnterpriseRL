category: therapy
display_name: Outpatient and Part B Therapy Services
binding:
  holding_table: therapy_plans
  event_tables:
  - therapy_ledger
  intake_tables:
  - therapy_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    account_balance: therapy_receivable
lifecycle:
  states:
  - referred
  - active
  - on_hold
  - discharged
  - closed
  - not_indicated
  transitions:
  - from: referred
    to: active
    by: agent
    means: After the evaluation, the physician or practitioner signs the plan of care and treatment starts.
  - from: referred
    to: not_indicated
    by: agent
    means: The evaluation finds no need for skilled therapy.
  - from: active
    to: on_hold
    by: agent
    means: Treatment pauses while the resident is hospitalized.
  - from: on_hold
    to: active
    by: agent
    means: Treatment resumes after the resident returns within the hold limit.
  - from: active
    to: discharged
    by: agent
    means: Goals are met, progress plateaus, the payer's authorization ends, or the resident declines further therapy.
  - from: on_hold
    to: discharged
    by: agent
    means: The hold limit passes and the plan is discharged.
  - from: discharged
    to: closed
    by: agent
    means: Resident charges for the plan are settled and it is closed.
accounts:
- key: therapy_receivable
  unit: USD
  meaning: Therapy charges the resident owes (Part B cost sharing, Medicare Advantage copays, private-pay charges
    and fees); charges add, payments and credits subtract.
parameter_schema:
  payer_class: 'Payer of the plan''s visits (enum: medicare_part_b, medicare_advantage, medicaid, private_pay).'
  discipline_scope: 'Disciplines the tier''s plan covers (enum: physical_therapy, occupational_therapy, speech_language_pathology,
    any_discipline).'
  part_b_coinsurance_pct: Resident share of the Part B allowed amount after the deductible (percent; 0 where Part
    B is not the payer).
  kx_threshold_by_year: Medicare therapy KX modifier threshold by calendar year (USD of allowed amounts; CMS-published;
    one amount for PT and SLP combined and the same amount separately for OT).
  kx_threshold_group: 'Which KX threshold the tier''s allowed amounts count toward (enum: pt_slp_combined, ot, none).'
  targeted_medical_review_threshold_usd: Allowed amount per threshold group per year above which claims are subject
    to targeted medical review (USD).
  kx_requires_documentation: Whether services above the KX threshold are covered only with medical-necessity documentation
    in the record (boolean).
  abn_required_for_noncovered: Whether the Advance Beneficiary Notice of Non-coverage (CMS-R-131) must be delivered
    before a service Medicare is expected to deny is billed to the resident (boolean).
  maintenance_therapy_covered: Whether skilled therapy to maintain function or slow decline is covered when skilled
    care is needed (boolean; Jimmo settlement).
  part_a_overlap_billable: Whether therapy may be billed under Part B on a day the resident is in a Part A covered
    stay (boolean; it is in the Part A per diem).
  evaluation_required: Whether an evaluation is required before treatment starts (boolean).
  initial_certification_days: Days after the evaluation within which the physician or practitioner must sign the
    plan of care (integer).
  plan_certification_max_days: Longest period a certified plan of care may run before recertification (integer days).
  progress_report_interval_visits: Treatment visits after which a progress report is due (integer).
  reevaluation_on_significant_change: Whether a significant change in condition requires a re-evaluation (boolean).
  timed_unit_minutes: Minutes in one timed treatment unit (integer).
  unit_rule: 'How total timed minutes convert to units (enum: eight_minute_rule = 8-22 minutes one unit, 23-37 two
    units, each further 15 minutes one more unit).'
  unit_minimum_minutes: Minimum total timed minutes for one billable unit (integer).
  ma_authorization_required: Whether visits need the Medicare Advantage plan's authorization on file (boolean).
  ma_reauthorization_lead_visits: Authorized visits remaining at which the business office requests more visits
    from the plan (integer; 0 where not applicable).
  ma_copay_basis: 'How a Medicare Advantage visit copay is set (enum: copay_on_plan_record = the per-visit copay
    recorded from the plan''s authorization; not_applicable).'
  medicaid_prior_authorization_required: Whether Medical Assistance prior authorization must be on file before visits
    (boolean).
  medicaid_resident_copay_usd: Copay charged to a nursing facility resident on Medical Assistance per visit (USD;
    institutionalized residents pay none).
  private_evaluation_fee_usd: Private-pay evaluation fee (USD; 0 where not private pay).
  private_reevaluation_fee_usd: Private-pay re-evaluation fee (USD; 0 where not private pay).
  private_unit_rate_usd: Private-pay charge per timed treatment unit (USD; 0 where not private pay).
  private_group_session_usd: Private-pay charge per group therapy session (USD; 0 where not private pay).
  late_cancel_notice_hours: Hours of notice needed to cancel a scheduled private-pay visit without a fee (integer).
  late_cancel_fee_usd: Fee for a private-pay visit cancelled late or missed (USD; 0 where not charged).
  cotreatment_billing: 'How a session two disciplines treat together is billed (enum: units_split_between_disciplines).'
  group_therapy_billing: 'How group therapy is billed (enum: one_group_session_per_resident_per_session).'
  hold_on_hospitalization: Whether a plan is put on hold while the resident is hospitalized (boolean).
  hold_max_days: Days a plan may stay on hold before it is discharged and a new evaluation is needed (integer).
  resident_may_stop_therapy: Whether the resident may decline further therapy and have the plan discharged (boolean).
  restorative_referral_on_discharge: Whether a resident discharged from therapy is referred to the restorative nursing
    program at no charge (boolean).
  billing_cycle: 'When resident therapy charges are billed (enum: monthly_in_arrears).'
  statement_day_of_month: Day of the month on which the prior month's resident therapy charges are billed (integer).
  payment_due_days: Calendar days after the statement date by which charges are due (integer).
  accepted_payment_methods: Methods accepted for therapy charges (list).
  charge_rounding: 'Rounding of resident therapy charges (enum: half_up_cents_per_row).'
  deductible_source: 'Which annual Part B deductible applies (enum: shared_part_b_deductible = the one deductible
    of the ancillary services charter, met across all Part B services at the center).'
  abn_options: Choices printed on the ABN (list of controlled values).
  no_abn_resident_liable: Whether the resident may be billed for a denied service when no valid ABN was delivered
    (boolean).
  progress_report_late_visits_billable: Whether visits after an overdue progress report remain billable to the payer
    and the resident (boolean).
  uncertified_visits_billable: Whether visits outside a signed, current plan of care may be billed to the payer
    or the resident (boolean).
  close_requires_zero_balance: Whether a discharged plan is closed only with a zero balance (boolean).
  visits_per_day_per_discipline: Billable treatment visits per discipline per day (integer).
  kx_threshold_resident_notice: Whether the resident is told when allowed amounts reach the KX threshold (boolean).
