    the tier of the room held, whatever payer source covers the resident's stay otherwise, rounded half up to the cent; each
    of those five entries is priced by its own schedule. This schedule prices the hospital stay entry, the resident-private
    entry of a Private Pay Hospital Leave Bed Hold whose leave has ended with a single resident-private entry on the reservation.
    A reservation carries one resident-private entry per service month, so the hospital stay entry is a single entry, its
    days as booked counted net of any of them reversed against it; the resident or representative signs the private bed-hold
    charge agreement for it, and the signed charge is what posts. For the hospital stay charge, the private-pay agreement
    read is the resident's current one, the agreement that is active, else in its notice period, else converted to another
    payer source, and a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery
    to the representative. The hospital stay charge is the hospital stay entry's charged days times the hospital stay daily
    charge, rounded half up to the cent once on the total. The hospital stay daily charge is the schedule daily rate for the
    tier of the room held, the prior schedule pricing the entry's days dated before the current schedule's schedule date and
    the current schedule the rest. The prior and current schedule rates of each room tier that price the hospital stay charge
    are the figures this schedule restates from the private pay schedule, the current schedule taking effect on its schedule
    date. The hospital stay entry's charged days are its days less any of them held before the transfer notice was delivered,
    those days being the entry's days dated before the delivery date, or all of its days where no transfer notice is on file.
    For the hospital stay daily charge, the current schedule reaches a private-pay agreement signed before the schedule date
    only through the written rate notice: where such an agreement's rate notice was delivered fewer than the agreement's rate-change
    notice days before the schedule date, or on or after the schedule date, the current schedule prices the calendar days
    from the later of the schedule date and the date falling those notice days after the delivery through the hospital stay
    entry's last day, never more than the entry's days, and the prior schedule prices the entry's remaining days; where such
    an agreement carries no rate notice, the prior schedule prices every day of the entry; otherwise the current schedule
    prices the calendar days from the schedule date through the entry's last day, never more than the entry's days, and the
    prior schedule the rest. The hospital stay daily charge follows the extended-hold schedule on the leave's privately held
    days already charged, counted as the days recorded on the bed-hold charges posted on the reservation, together with the
    hospital stay entry's days: more than the long-hold threshold days take the long-hold percent of the rate, at least the
    mid-hold threshold days and no more than the long-hold threshold days take the mid-hold percent, and fewer than the mid-hold
    threshold days take the full-rate percent. Meals are not prepared for a resident on leave, so the hospital stay daily
    charge carries a dietary credit keyed to the bed held as the reservation records it and to the leave's length from the
    departure date through the hospital stay entry's last day, both days counted: a leave of at least the dietary-credit minimum
    leave days takes the memory-unit dietary credit for a bed held on a secure memory care tier and the standard dietary credit
    for a bed held on any other tier, and a shorter leave takes none. The room held counts as an isolation placement when
    the resident's private-pay agreement carries an isolation placement and the agreement's tier is the tier of the room held,
    the agreement's last room change, the center's infection-control move, being dated no later than the departure date; such
    a room is priced at its isolation billing tier, as the private-pay agreement prices that room's room and board: a private
    secure memory care room at the semi-private secure memory care tier and any other private room at the semi-private long-term
    care tier; any other room held is priced at its own tier. The return day never counts as a leave day: where the reservation's
    return date falls on one of the hospital stay entry's days, that day is not charged; where the return date falls after
    the entry's last day, or no return is recorded, no day is taken off for it. No day after the hold ended is charged: where
    the resident returned, the entry's days dated after the return date; where the bed was released, the entry's days dated
    after the release date, the day of release being the last held day; where the hold expired because the hospital discharged
    the resident to another setting, the entry's days dated after the hold's last held day; where the hold ended after the
    entry's last day, or has not ended, none. The hospital stay figures are combined in this order: each schedule rate is
    first taken to the applicable percent, any per-day credit is then subtracted from that reduced rate, and each resulting
    daily charge is multiplied by the charged days it applies to; the days not charged at the start of the entry are its first
    days, the days not charged at the end of the entry are its last days, and the current-schedule days are counted back from
    the entry's last day; the charge is the sum, rounded half up to the cent once on the total.
