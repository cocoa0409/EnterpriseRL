  - ho_room: F('room_tier_held')
  - ho_sched: K('current_schedule_date')
  - ho_from: F('private_hold_start_date')
  - ho_to: >-
      LATEST('bedhold_ledger', 'to_date', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private',
      from_date=ho_from)
  - ho_entry: >-
      LATEST('bedhold_ledger', 'bedhold_entry_id', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private',
      from_date=ho_from)
  - ho_days: >-
      SUM('bedhold_ledger', 'day_count', event_type='bedhold_day_booked', day_payer='resident_private', from_date=ho_from)
      - SUM('bedhold_ledger', 'day_count', event_type='bedhold_day_reversed', days_entry_id=ho_entry)
  - ho_notice_res: >-
      LATEST('bedhold_ledger', 'entry_date', date_field='delivered_at', event_type='bedhold_notice_delivered', notice_type='transfer_notice',
      delivered_to='resident')
  - ho_notice_rep: >-
      LATEST('bedhold_ledger', 'entry_date', date_field='delivered_at', event_type='bedhold_notice_delivered', notice_type='transfer_notice',
      delivered_to='representative')
  - ho_notice: MN(ho_notice_res or ho_notice_rep or '', ho_notice_rep or ho_notice_res or '')
  - ho_unnoticed: >-
      MN(ho_days, DAYS(ho_from, ho_notice)) if (ho_notice and ho_notice > ho_from) else (ho_days if (not ho_notice and ho_days
      > 0) else 0)
  - ho_state: >-
      'active' if EXISTS('private', status='active') else ('notice_period' if EXISTS('private', status='notice_period') else
      'payer_converted')
  - ho_signed: CFIELD('private', 'agreement_signed_date', status=ho_state)
  - ho_rate_notice: CFIELD('private', 'rate_notice_delivered_date', status=ho_state)
  - ho_notice_run: CPARAM('private', 'rate_change_notice_days', status=ho_state) or 0
  - ho_cur_days: >-
      MX(0, MN(ho_days, DAYS(ho_sched, ho_to) - MX(0, DAYS(ho_sched, ho_rate_notice) + ho_notice_run) + 1)) if (ho_rate_notice
      and (ho_signed or ho_sched) < ho_sched and DAYS(ho_sched, ho_rate_notice) + ho_notice_run > 0) else (0 if (not ho_rate_notice
      and (ho_signed or ho_sched) < ho_sched) else MX(0, MN(ho_days, DAYS(ho_sched, ho_to) + 1)))
  - ho_charged_before: SUM('bedhold_ledger', 'day_count', event_type='bedhold_charge')
  - ho_run: ho_charged_before + ho_days
  - ho_pct: >-
      K('long_hold_pct') if ho_run > K('long_hold_threshold_days') else (K('mid_hold_pct') if ho_run >= K('mid_hold_threshold_days')
      else K('full_rate_pct'))
  - ho_leave: DAYS(dep, ho_to) + 1
  - ho_meal: >-
      K('memory_unit_dietary_credit') if ((ho_room == 'Semi-Private Secure Memory Care Room' or ho_room == 'Private Secure
      Memory Care Room') and ho_leave >= K('dietary_credit_min_leave_days')) else (K('standard_dietary_credit') if (ho_room
      != 'Semi-Private Secure Memory Care Room' and ho_room != 'Private Secure Memory Care Room' and ho_leave >= K('dietary_credit_min_leave_days'))
      else 0)
  - ho_agr_iso: CFIELD('private', 'isolation_placement', status=ho_state)
  - ho_agr_tier: CFIELD('private', 'variant_name', status=ho_state)
  - ho_agr_move: CFIELD('private', 'last_room_change_date', status=ho_state)
  - ho_dep_tier: >-
      'Semi-Private Secure Memory Care Room' if (ho_agr_iso == True and ho_agr_move and DAYS(ho_agr_move, dep) >= 0 and ho_agr_tier
      == ho_room and ho_room == 'Private Secure Memory Care Room') else ('Semi-Private Long-Term Care Room' if (ho_agr_iso
      == True and ho_agr_move and DAYS(ho_agr_move, dep) >= 0 and ho_agr_tier == ho_room and (ho_room == 'Private Long-Term
      Care Room' or ho_room == 'Private Bariatric Care Room' or ho_room == 'Private Suite with Sitting Area')) else ho_room)
  - ho_ma: >-
      MX(0, MN(ho_days, P('payer_reserved_days_per_hospitalization') - DAYS(dep, ho_from))) if (P('payer_reserved_days_per_hospitalization')
      and DAYS(dep, ho_from) < P('payer_reserved_days_per_hospitalization')) else (0 if P('payer_reserved_days_per_hospitalization')
      else 0)
  - ho_prior_rate: >-
      K('prior_rate_semi_private_ltc') if ho_dep_tier == 'Semi-Private Long-Term Care Room' else (K('prior_rate_semi_private_memory')
      if ho_dep_tier == 'Semi-Private Secure Memory Care Room' else (K('prior_rate_private_ltc') if ho_dep_tier == 'Private
      Long-Term Care Room' else (K('prior_rate_private_memory') if ho_dep_tier == 'Private Secure Memory Care Room' else (K('prior_rate_private_bariatric')
      if ho_dep_tier == 'Private Bariatric Care Room' else (K('prior_rate_private_suite'))))))
  - ho_cur_rate: >-
      K('current_rate_semi_private_ltc') if ho_dep_tier == 'Semi-Private Long-Term Care Room' else (K('current_rate_semi_private_memory')
      if ho_dep_tier == 'Semi-Private Secure Memory Care Room' else (K('current_rate_private_ltc') if ho_dep_tier == 'Private
      Long-Term Care Room' else (K('current_rate_private_memory') if ho_dep_tier == 'Private Secure Memory Care Room' else
      (K('current_rate_private_bariatric') if ho_dep_tier == 'Private Bariatric Care Room' else (K('current_rate_private_suite'))))))
  - ho_start_off: MX(ho_unnoticed, ho_ma)
  - ho_end_off: '0'
  - ho_charged: MX(0, ho_days - ho_start_off - ho_end_off)
  - ho_cur: MX(0, MN(ho_charged, ho_cur_days - ho_end_off))
  - ho_prior: ho_charged - ho_cur
  - ho_prior_daily: ho_prior_rate * ho_pct / K('full_rate_pct') - ho_meal
  - ho_cur_daily: ho_cur_rate * ho_pct / K('full_rate_pct') - ho_meal
  - result: RND(ho_prior * ho_prior_daily + ho_cur * ho_cur_daily + 0.000000001, 2)
  compute_basis:
    dep: from the departure date
    ho_room: the schedule daily rate for the tier of the room held
    ho_sched: the current schedule taking effect on its schedule date
    ho_from: the resident-private entry beginning on the reservation's recorded first privately held day
    ho_to: through the hospital opening entry's last day
    ho_entry: so the hospital opening entry is a single entry
    ho_days: its days as booked counted net of any of them reversed against it
    ho_notice_res: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    ho_notice_rep: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    ho_notice: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    ho_unnoticed: >-
      The hospital opening entry's charged days are its days less any of them held before the transfer notice was delivered,
      those days being the entry's days dated before the delivery date, or all of its days where no transfer notice is on
      file.
    ho_state: >-
      the private-pay agreement read is the resident's current one, the agreement that is active, else in its notice period,
      else converted to another payer source
    ho_signed: >-
      the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice
    ho_rate_notice: >-
      the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice
    ho_notice_run: the date falling those notice days after the delivery
    ho_cur_days: >-
      where such an agreement's rate notice was delivered fewer than the agreement's rate-change notice days before the schedule
      date, or on or after the schedule date, the current schedule prices the calendar days from the later of the schedule
      date and the date falling those notice days after the delivery through the hospital opening entry's last day, never
      more than the entry's days, and the prior schedule prices the entry's remaining days; where such an agreement carries
      no rate notice, the prior schedule prices every day of the entry; otherwise the current schedule prices the calendar
      days from the schedule date through the entry's last day, never more than the entry's days, and the prior schedule the
      rest
    ho_charged_before: >-
      the leave's privately held days already charged, counted as the days recorded on the bed-hold charges posted on the
      reservation
    ho_run: together with the hospital opening entry's days
    ho_pct: >-
      more than the long-hold threshold days take the long-hold percent of the rate, at least the mid-hold threshold days
      and no more than the long-hold threshold days take the mid-hold percent, and fewer than the mid-hold threshold days
      take the full-rate percent.
    ho_leave: >-
      the leave's length from the departure date through the hospital opening entry's last day, both days counted
    ho_meal: >-
      a leave of at least the dietary-credit minimum leave days takes the memory-unit dietary credit for a bed held on a secure
      memory care tier and the standard dietary credit for a bed held on any other tier, and a shorter leave takes none.
    ho_agr_iso: the resident's private-pay agreement carries an isolation placement
    ho_agr_tier: the agreement's tier is the tier of the room held
    ho_dep_tier: >-
      a private secure memory care room at the semi-private secure memory care tier and any other private room at the semi-private
      long-term care tier; any other room held is priced at its own tier.
    ho_ma: >-
      the hospital opening entry's days that fall within that many days of the departure date, the departure date counted
      as the first, are payer-covered and are not charged, however the entry was booked; where the entry begins after that,
      or the tier has no per-hospitalization payer days, none are
    ho_prior_rate: >-
      The prior and current schedule rates of each room tier that price the hospital opening charge are the figures this schedule
      restates from the private pay schedule, the current schedule taking effect on its schedule date.
    ho_cur_rate: >-
      The prior and current schedule rates of each room tier that price the hospital opening charge are the figures this schedule
      restates from the private pay schedule, the current schedule taking effect on its schedule date.
    ho_start_off: as many as the larger of those held before the notice and those payer-covered
    ho_end_off: the days not charged at the end of the entry are its last days
    ho_charged: >-
      The hospital opening charge is the hospital opening entry's charged days times the hospital opening daily charge
    ho_cur: the current-schedule days are counted back from the entry's last day
    ho_prior: each resulting daily charge is multiplied by the charged days it applies to
    ho_prior_daily: >-
      each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted from that reduced
      rate
    ho_cur_daily: >-
      each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted from that reduced
      rate
    result: the charge is the sum, rounded half up to the cent once on the total.
    ho_agr_move: >-
      the agreement's last room change, the center's infection-control move, being dated no later than the departure date
  factors:
  - id: ho_rate_binding
    effect: method
    decides: ho_cur_days
    bindings:
    - ho_signed
    - ho_rate_notice
    - ho_notice_run
    - ho_cur_days
    ladder:
    - when: >-
        the agreement was signed before the schedule date and its rate notice was delivered fewer than the rate-change notice
        days before the schedule date, or on or after it
      method: >-
        split at the later of the schedule date and the notice-plus-notice-days date (a later-of pick on the notice date)
    - when: the agreement was signed before the schedule date and carries no rate notice
      method: the prior schedule's rate on every day of the entry (no split)
    - when: otherwise
      method: split at the schedule date
    baseline:
      ho_cur_days: MX(0, MN(ho_days, DAYS(ho_sched, ho_to) + 1))
    evidence:
    - cross_category
    - date
    cross_difficulty: private
  - id: ho_extended_hold
    effect: parameter
    decides: ho_pct
    bindings:
    - ho_charged_before
    - ho_run
    - ho_pct
    ladder:
    - when: more than the long-hold threshold days charged before and on the entry
      value: K('long_hold_pct')
    - when: at least the mid-hold threshold days and no more than the long-hold threshold days
      value: K('mid_hold_pct')
    - when: otherwise
      value: K('full_rate_pct')
    baseline:
      ho_pct: K('full_rate_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: ho_dietary_credit
    effect: parameter
    decides: ho_meal
    bindings:
    - ho_leave
    - ho_meal
    ladder:
    - when: >-
        the leave runs at least the dietary-credit minimum leave days and the bed held is on a secure memory care tier
      value: K('memory_unit_dietary_credit')
    - when: the leave runs at least the dietary-credit minimum leave days and the bed held is on any other tier
      value: K('standard_dietary_credit')
    - when: otherwise (a shorter leave)
      value: '0'
    baseline:
      ho_meal: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: ho_isolation_rate
    effect: parameter
    decides: ho_dep_tier
    bindings:
    - ho_agr_iso
    - ho_agr_move
    - ho_agr_tier
    - ho_dep_tier
    ladder:
    - when: >-
        the agreement carries an isolation placement recorded no later than the departure date on the tier of the room held,
        a private secure memory care room
      value: '''Semi-Private Secure Memory Care Room'''
    - when: >-
        the agreement carries an isolation placement recorded no later than the departure date on the tier of the room held,
        any other private room
      value: '''Semi-Private Long-Term Care Room'''
    - when: >-
        otherwise (no isolation placement, one recorded after the departure date, or the room held is not the agreement's
        room)
      value: ho_room
    baseline:
      ho_dep_tier: ho_room
    evidence:
    - cross_category
    - date
    cross_difficulty: private
  - id: ho_reserved_days
    effect: parameter
    decides: ho_ma
    bindings:
    - ho_ma
    ladder:
    - when: the entry begins within the per-hospitalization limit days of the departure date
      value: MX(0, MN(ho_days, P('payer_reserved_days_per_hospitalization') - DAYS(dep, ho_from)))
    - when: the entry begins after the per-hospitalization limit
      value: '0'
    - when: otherwise (a tier with no per-hospitalization payer days)
      value: '0'
    baseline:
      ho_ma: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The hospital opening charge is the hospital opening entry's charged days times the hospital opening daily charge, rounded
      half up to the cent once on the total. The hospital opening daily charge is the schedule daily rate for the tier of
      the room held, the prior schedule pricing the entry's days dated before the current schedule's schedule date and the
      current schedule the rest. The prior and current schedule rates of each room tier that price the hospital opening charge
      are the figures this schedule restates from the private pay schedule, the current schedule taking effect on its schedule
      date. The hospital opening entry's charged days are its days less any of them held before the transfer notice was delivered,
      those days being the entry's days dated before the delivery date, or all of its days where no transfer notice is on
      file.
    params:
    - current_rate_semi_private_ltc
    - current_rate_semi_private_memory
    - current_rate_private_ltc
    - current_rate_private_memory
    - current_rate_private_bariatric
    - current_rate_private_suite
    - prior_rate_semi_private_ltc
    - prior_rate_semi_private_memory
    - prior_rate_private_ltc
    - prior_rate_private_memory
    - prior_rate_private_bariatric
    - prior_rate_private_suite
    - current_schedule_date
  inputs:
    history:
    - table: bedhold_ledger
      aggregate: latest
      field: to_date
      filters:
        event_type: bedhold_day_booked
        day_payer: resident_private
    - table: bedhold_ledger
      aggregate: sum
      field: day_count
      filters:
        event_type: bedhold_day_reversed
    - table: bedhold_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: bedhold_notice_delivered
        notice_type: transfer_notice
    - table: bedhold_ledger
      aggregate: sum
      field: day_count
      filters:
        event_type: bedhold_charge
    cross_category:
    - private
- id: bedhold_ext_hospital_closing_charge
  base_policy_refs:
  - bedhold_evt_charges
  - bedhold_evt_notice
  - bedhold_evt_day_counting
  - bedhold_hold_end
  - bedhold_agg_payer_day_limits
  overwrite:
  - base_policy: bedhold_evt_charges
    superseded_clause: >-
      Each booked resident_private entry is charged once: the days times the bed-hold daily rate, rounded half up to the cent.
      The bed-hold daily rate is the tier's bed-hold percent of the private pay schedule's daily rate in effect on those days
      for the tier of the room held, whatever payer source covers the resident's stay otherwise.
    replaced_by: >-
      Outside the opening entry and the closing entry of a released Private Pay Therapeutic Leave Bed Hold that carries more
      than one resident-private entry, the resident-private entry of a Private Pay Hospital Leave Bed Hold that carries a
      single resident-private entry, and the opening entry and the closing entry of a Medicaid Hospital Leave Reserved Bed
      hold that carries more than one resident-private entry, each booked resident-private entry is charged once at its days
      times the bed-hold daily rate, the tier's bed-hold percent of the private pay schedule's daily rate in effect on those
      days for the tier of the room held, whatever payer source covers the resident's stay otherwise, rounded half up to the
      cent; each of those five entries is priced by its own schedule.
  trigger: on_request
  subject:
  - bedhold_charge
  computes: amount
  target_tool: sign_hospital_closing_charge_702d4c7f
  params:
    prior_rate_semi_private_ltc: 384.0
    current_rate_semi_private_ltc: 398.0
    prior_rate_semi_private_memory: 412.0
    current_rate_semi_private_memory: 427.0
    prior_rate_private_ltc: 421.0
    current_rate_private_ltc: 436.0
    prior_rate_private_memory: 449.0
    current_rate_private_memory: 465.0
    prior_rate_private_bariatric: 466.0
    current_rate_private_bariatric: 482.0
    prior_rate_private_suite: 497.0
    current_rate_private_suite: 514.0
    current_schedule_date: '2026-07-01'
    full_rate_pct: 100
    mid_hold_pct: 95
    long_hold_pct: 85
    mid_hold_threshold_days: 15
    long_hold_threshold_days: 30
    dietary_credit_min_leave_days: 4
    standard_dietary_credit: 14.1
    memory_unit_dietary_credit: 16.8
  rule: >-
    Outside the opening entry and the closing entry of a released Private Pay Therapeutic Leave Bed Hold that carries more
    than one resident-private entry, the resident-private entry of a Private Pay Hospital Leave Bed Hold that carries a single
    resident-private entry, and the opening entry and the closing entry of a Medicaid Hospital Leave Reserved Bed hold that
    carries more than one resident-private entry, each booked resident-private entry is charged once at its days times the
    bed-hold daily rate, the tier's bed-hold percent of the private pay schedule's daily rate in effect on those days for
    the tier of the room held, whatever payer source covers the resident's stay otherwise, rounded half up to the cent; each
    of those five entries is priced by its own schedule. This schedule prices the hospital closing entry, the closing resident-private
    entry of a Medicaid Hospital Leave Reserved Bed hold that carries more than one resident-private entry and whose leave
    has ended: the resident-private entry with the latest last day on the reservation, when it is not also the opening entry.
    A reservation carries one resident-private entry per service month, so the hospital closing entry is a single entry, its
    days as booked counted net of any of them reversed against it; the resident or representative signs the private bed-hold
    charge agreement for it, and the signed charge is what posts. For the hospital closing charge, the private-pay agreement
    read is the resident's current one, the agreement that is active, else in its notice period, else converted to another
    payer source, and a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery
    to the representative. The hospital closing charge is worked out only after the opening entry of the hold carries its
    bed-hold charge. The hospital closing charge is the hospital closing entry's charged days times the hospital closing daily
    charge, rounded half up to the cent once on the total. The hospital closing daily charge is the schedule daily rate for
    the tier of the room held, the prior schedule pricing the entry's days dated before the current schedule's schedule date
    and the current schedule the rest. The prior and current schedule rates of each room tier that price the hospital closing
    charge are the figures this schedule restates from the private pay schedule, the current schedule taking effect on its
    schedule date. The hospital closing entry's charged days are its days less any of them held before the transfer notice
    was delivered, those days being the entry's days dated before the delivery date, or all of its days where no transfer
    notice is on file. For the hospital closing daily charge, the current schedule reaches a private-pay agreement signed
    before the schedule date only through the written rate notice: where such an agreement's rate notice was delivered fewer
    than the agreement's rate-change notice days before the schedule date, or on or after the schedule date, the current schedule
    prices the calendar days from the later of the schedule date and the date falling those notice days after the delivery
    through the hospital closing entry's last day, never more than the entry's days, and the prior schedule prices the entry's
    remaining days; where such an agreement carries no rate notice, the prior schedule prices every day of the entry; otherwise
    the current schedule prices the calendar days from the schedule date through the entry's last day, never more than the
    entry's days, and the prior schedule the rest. The hospital closing daily charge follows the extended-hold schedule on
    the leave's privately held days already charged, counted as the days recorded on the bed-hold charges posted on the reservation,
    together with the hospital closing entry's days: more than the long-hold threshold days take the long-hold percent of
    the rate, at least the mid-hold threshold days and no more than the long-hold threshold days take the mid-hold percent,
    and fewer than the mid-hold threshold days take the full-rate percent. Meals are not prepared for a resident on leave,
    so the hospital closing daily charge carries a dietary credit keyed to the bed held as the reservation records it and
    to the leave's length from the departure date through the hospital closing entry's last day, both days counted: a leave
    of at least the dietary-credit minimum leave days takes the memory-unit dietary credit for a bed held on a secure memory
    care tier and the standard dietary credit for a bed held on any other tier, and a shorter leave takes none. The room held
    counts as an isolation placement when the resident's private-pay agreement carries an isolation placement and the agreement's
    tier is the tier of the room held, the agreement's last room change, the center's infection-control move, being dated
    no later than the departure date; such a room is priced at its isolation billing tier, as the private-pay agreement prices
    that room's room and board: a private secure memory care room at the semi-private secure memory care tier and any other
    private room at the semi-private long-term care tier; any other room held is priced at its own tier. The return day never
    counts as a leave day: where the reservation's return date falls on one of the hospital closing entry's days, that day
    is not charged; where the return date falls after the entry's last day, or no return is recorded, no day is taken off
    for it. No day after the hold ended is charged: where the resident returned, the entry's days dated after the return date;
    where the bed was released, the entry's days dated after the release date, the day of release being the last held day;
    where the hold expired because the hospital discharged the resident to another setting, the entry's days dated after the
    hold's last held day; where the hold ended after the entry's last day, or has not ended, none. The hospital closing figures
    are combined in this order: each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted
    from that reduced rate, and each resulting daily charge is multiplied by the charged days it applies to; the days not
    charged at the start of the entry are its first days, the days not charged at the end of the entry are its last days,
    and the current-schedule days are counted back from the entry's last day; the charge is the sum, rounded half up to the
    cent once on the total.
  prerequisite:
  - problem: bedhold_ext_hospital_opening_charge
    kind: value_input
    gate: hc_charged_before
    form: state
    policy_source: >-
      The hospital closing charge is worked out only after the opening entry of the hold carries its bed-hold charge.
    condition: >-
      The reservation's ledger carries a bedhold_charge row whose days_entry_id is the resident-private entry beginning on
      the reservation's recorded first privately held day.
    resolved_by: post_hospital_opening_charge_991dca72
    effect: >-
      hc_charged_before counts the days recorded on that charge, which moves hc_run and with it the extended-hold percent
      of the hospital closing daily charge.
  cross_category:
  - category: private
    as: branch
    reads:
    - status
    - agreement_signed_date
    - rate_notice_delivered_date
    - rate_change_notice_days
    - isolation_placement
    - variant_name
    - last_room_change_date
    note: The rate-binding and isolation factors read the resident's current private-pay agreement.
  compute:
  - dep: F('leave_start_date')
  - hc_room: F('room_tier_held')
  - hc_sched: K('current_schedule_date')
  - hc_to: >-
      LATEST('bedhold_ledger', 'to_date', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - hc_from: >-
      LATEST('bedhold_ledger', 'from_date', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - hc_entry: >-
      LATEST('bedhold_ledger', 'bedhold_entry_id', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - hc_days: >-
      SUM('bedhold_ledger', 'day_count', event_type='bedhold_day_booked', day_payer='resident_private', to_date=hc_to) - SUM('bedhold_ledger',
      'day_count', event_type='bedhold_day_reversed', days_entry_id=hc_entry)
  - hc_notice_res: >-
      LATEST('bedhold_ledger', 'entry_date', date_field='delivered_at', event_type='bedhold_notice_delivered', notice_type='transfer_notice',
      delivered_to='resident')
  - hc_notice_rep: >-
      LATEST('bedhold_ledger', 'entry_date', date_field='delivered_at', event_type='bedhold_notice_delivered', notice_type='transfer_notice',
      delivered_to='representative')
  - hc_notice: MN(hc_notice_res or hc_notice_rep or '', hc_notice_rep or hc_notice_res or '')
  - hc_unnoticed: >-
      MN(hc_days, DAYS(hc_from, hc_notice)) if (hc_notice and hc_notice > hc_from) else (hc_days if (not hc_notice and hc_days
      > 0) else 0)
  - hc_state: >-
      'active' if EXISTS('private', status='active') else ('notice_period' if EXISTS('private', status='notice_period') else
      'payer_converted')
  - hc_signed: CFIELD('private', 'agreement_signed_date', status=hc_state)
  - hc_rate_notice: CFIELD('private', 'rate_notice_delivered_date', status=hc_state)
  - hc_notice_run: CPARAM('private', 'rate_change_notice_days', status=hc_state) or 0
  - hc_cur_days: >-
      MX(0, MN(hc_days, DAYS(hc_sched, hc_to) - MX(0, DAYS(hc_sched, hc_rate_notice) + hc_notice_run) + 1)) if (hc_rate_notice
      and (hc_signed or hc_sched) < hc_sched and DAYS(hc_sched, hc_rate_notice) + hc_notice_run > 0) else (0 if (not hc_rate_notice
      and (hc_signed or hc_sched) < hc_sched) else MX(0, MN(hc_days, DAYS(hc_sched, hc_to) + 1)))
  - hc_charged_before: SUM('bedhold_ledger', 'day_count', event_type='bedhold_charge')
  - hc_run: hc_charged_before + hc_days
  - hc_pct: >-
      K('long_hold_pct') if hc_run > K('long_hold_threshold_days') else (K('mid_hold_pct') if hc_run >= K('mid_hold_threshold_days')
      else K('full_rate_pct'))
  - hc_leave: DAYS(dep, hc_to) + 1
  - hc_meal: >-
      K('memory_unit_dietary_credit') if ((hc_room == 'Semi-Private Secure Memory Care Room' or hc_room == 'Private Secure
      Memory Care Room') and hc_leave >= K('dietary_credit_min_leave_days')) else (K('standard_dietary_credit') if (hc_room
      != 'Semi-Private Secure Memory Care Room' and hc_room != 'Private Secure Memory Care Room' and hc_leave >= K('dietary_credit_min_leave_days'))
      else 0)
  - hc_agr_iso: CFIELD('private', 'isolation_placement', status=hc_state)
  - hc_agr_tier: CFIELD('private', 'variant_name', status=hc_state)
  - hc_agr_move: CFIELD('private', 'last_room_change_date', status=hc_state)
  - hc_dep_tier: >-
      'Semi-Private Secure Memory Care Room' if (hc_agr_iso == True and hc_agr_move and DAYS(hc_agr_move, dep) >= 0 and hc_agr_tier
      == hc_room and hc_room == 'Private Secure Memory Care Room') else ('Semi-Private Long-Term Care Room' if (hc_agr_iso
      == True and hc_agr_move and DAYS(hc_agr_move, dep) >= 0 and hc_agr_tier == hc_room and (hc_room == 'Private Long-Term
      Care Room' or hc_room == 'Private Bariatric Care Room' or hc_room == 'Private Suite with Sitting Area')) else hc_room)
  - hc_ret: F('return_date')
  - hc_ret_day: >-
      1 if (hc_ret and DAYS(hc_from, hc_ret) >= 0 and DAYS(hc_ret, hc_to) >= 0) else (0 if (hc_ret and DAYS(hc_ret, hc_to)
      < 0) else 0)
  - hc_rel: F('release_date')
  - hc_end: F('end_date')
  - hc_end_reason: F('end_reason')
  - hc_after: >-
      MX(0, MN(hc_days, DAYS(hc_ret, hc_to))) if (hc_ret and hc_ret <= hc_to) else (MX(0, MN(hc_days, DAYS(hc_rel, hc_to)))
      if (hc_rel and hc_rel < hc_to) else (MX(0, MN(hc_days, DAYS(hc_end, hc_to))) if (hc_end_reason == 'hospital_discharged_elsewhere'
      and hc_end and hc_end < hc_to) else 0))
  - hc_prior_rate: >-
      K('prior_rate_semi_private_ltc') if hc_dep_tier == 'Semi-Private Long-Term Care Room' else (K('prior_rate_semi_private_memory')
      if hc_dep_tier == 'Semi-Private Secure Memory Care Room' else (K('prior_rate_private_ltc') if hc_dep_tier == 'Private
      Long-Term Care Room' else (K('prior_rate_private_memory') if hc_dep_tier == 'Private Secure Memory Care Room' else (K('prior_rate_private_bariatric')
      if hc_dep_tier == 'Private Bariatric Care Room' else (K('prior_rate_private_suite'))))))
  - hc_cur_rate: >-
      K('current_rate_semi_private_ltc') if hc_dep_tier == 'Semi-Private Long-Term Care Room' else (K('current_rate_semi_private_memory')
      if hc_dep_tier == 'Semi-Private Secure Memory Care Room' else (K('current_rate_private_ltc') if hc_dep_tier == 'Private
      Long-Term Care Room' else (K('current_rate_private_memory') if hc_dep_tier == 'Private Secure Memory Care Room' else
      (K('current_rate_private_bariatric') if hc_dep_tier == 'Private Bariatric Care Room' else (K('current_rate_private_suite'))))))
  - hc_start_off: hc_unnoticed
  - hc_end_off: hc_ret_day + hc_after
  - hc_charged: MX(0, hc_days - hc_start_off - hc_end_off)
  - hc_cur: MX(0, MN(hc_charged, hc_cur_days - hc_end_off))
  - hc_prior: hc_charged - hc_cur
  - hc_prior_daily: hc_prior_rate * hc_pct / K('full_rate_pct') - hc_meal
  - hc_cur_daily: hc_cur_rate * hc_pct / K('full_rate_pct') - hc_meal
  - result: RND(hc_prior * hc_prior_daily + hc_cur * hc_cur_daily + 0.000000001, 2)
  compute_basis:
    dep: from the departure date
    hc_room: the schedule daily rate for the tier of the room held
    hc_sched: the current schedule taking effect on its schedule date
    hc_to: >-
      the resident-private entry with the latest last day on the reservation, when it is not also the opening entry
    hc_from: the entry's days dated before the delivery date
    hc_entry: so the hospital closing entry is a single entry
    hc_days: its days as booked counted net of any of them reversed against it
    hc_notice_res: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    hc_notice_rep: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    hc_notice: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    hc_unnoticed: >-
      The hospital closing entry's charged days are its days less any of them held before the transfer notice was delivered,
      those days being the entry's days dated before the delivery date, or all of its days where no transfer notice is on
      file.
    hc_state: >-
      the private-pay agreement read is the resident's current one, the agreement that is active, else in its notice period,
      else converted to another payer source
    hc_signed: >-
      the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice
    hc_rate_notice: >-
      the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice
    hc_notice_run: the date falling those notice days after the delivery
    hc_cur_days: >-
      where such an agreement's rate notice was delivered fewer than the agreement's rate-change notice days before the schedule
      date, or on or after the schedule date, the current schedule prices the calendar days from the later of the schedule
      date and the date falling those notice days after the delivery through the hospital closing entry's last day, never
      more than the entry's days, and the prior schedule prices the entry's remaining days; where such an agreement carries
      no rate notice, the prior schedule prices every day of the entry; otherwise the current schedule prices the calendar
      days from the schedule date through the entry's last day, never more than the entry's days, and the prior schedule the
      rest
    hc_charged_before: >-
      the leave's privately held days already charged, counted as the days recorded on the bed-hold charges posted on the
      reservation
    hc_run: together with the hospital closing entry's days
    hc_pct: >-
      more than the long-hold threshold days take the long-hold percent of the rate, at least the mid-hold threshold days
      and no more than the long-hold threshold days take the mid-hold percent, and fewer than the mid-hold threshold days
      take the full-rate percent.
    hc_leave: >-
      the leave's length from the departure date through the hospital closing entry's last day, both days counted
    hc_meal: >-
      a leave of at least the dietary-credit minimum leave days takes the memory-unit dietary credit for a bed held on a secure
      memory care tier and the standard dietary credit for a bed held on any other tier, and a shorter leave takes none.
    hc_agr_iso: the resident's private-pay agreement carries an isolation placement
    hc_agr_tier: the agreement's tier is the tier of the room held
    hc_dep_tier: >-
      a private secure memory care room at the semi-private secure memory care tier and any other private room at the semi-private
      long-term care tier; any other room held is priced at its own tier.
    hc_ret: where the reservation's return date falls on one of
    hc_ret_day: >-
      where the reservation's return date falls on one of the hospital closing entry's days, that day is not charged; where
      the return date falls after the entry's last day, or no return is recorded, no day is taken off for it
    hc_rel: where the bed was released
    hc_end: the hold's last held day
    hc_end_reason: where the hold expired because the hospital discharged the resident to another setting
    hc_after: >-
      where the resident returned, the entry's days dated after the return date; where the bed was released, the entry's days
      dated after the release date, the day of release being the last held day; where the hold expired because the hospital
      discharged the resident to another setting, the entry's days dated after the hold's last held day; where the hold ended
      after the entry's last day, or has not ended, none
    hc_prior_rate: >-
      The prior and current schedule rates of each room tier that price the hospital closing charge are the figures this schedule
      restates from the private pay schedule, the current schedule taking effect on its schedule date.
    hc_cur_rate: >-
      The prior and current schedule rates of each room tier that price the hospital closing charge are the figures this schedule
      restates from the private pay schedule, the current schedule taking effect on its schedule date.
    hc_start_off: the days not charged at the start of the entry are its first days
    hc_end_off: the days not charged at the end of the entry are its last days
    hc_charged: >-
      The hospital closing charge is the hospital closing entry's charged days times the hospital closing daily charge
    hc_cur: the current-schedule days are counted back from the entry's last day
    hc_prior: each resulting daily charge is multiplied by the charged days it applies to
    hc_prior_daily: >-
      each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted from that reduced
      rate
    hc_cur_daily: >-
      each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted from that reduced
      rate
    result: the charge is the sum, rounded half up to the cent once on the total.
    hc_agr_move: >-
      the agreement's last room change, the center's infection-control move, being dated no later than the departure date
  factors:
  - id: hc_rate_binding
    effect: method
    decides: hc_cur_days
    bindings:
    - hc_signed
    - hc_rate_notice
    - hc_notice_run
    - hc_cur_days
    ladder:
    - when: >-
        the agreement was signed before the schedule date and its rate notice was delivered fewer than the rate-change notice
        days before the schedule date, or on or after it
      method: >-
        split at the later of the schedule date and the notice-plus-notice-days date (a later-of pick on the notice date)
    - when: the agreement was signed before the schedule date and carries no rate notice
      method: the prior schedule's rate on every day of the entry (no split)
    - when: otherwise
      method: split at the schedule date
    baseline:
      hc_cur_days: MX(0, MN(hc_days, DAYS(hc_sched, hc_to) + 1))
    evidence:
    - cross_category
    - date
    cross_difficulty: private
  - id: hc_extended_hold
    effect: parameter
    decides: hc_pct
    bindings:
    - hc_charged_before
    - hc_run
    - hc_pct
    ladder:
    - when: more than the long-hold threshold days charged before and on the entry
      value: K('long_hold_pct')
    - when: at least the mid-hold threshold days and no more than the long-hold threshold days
      value: K('mid_hold_pct')
    - when: otherwise
      value: K('full_rate_pct')
    baseline:
      hc_pct: K('full_rate_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: hc_dietary_credit
    effect: parameter
    decides: hc_meal
    bindings:
    - hc_leave
    - hc_meal
    ladder:
    - when: >-
        the leave runs at least the dietary-credit minimum leave days and the bed held is on a secure memory care tier
      value: K('memory_unit_dietary_credit')
    - when: the leave runs at least the dietary-credit minimum leave days and the bed held is on any other tier
      value: K('standard_dietary_credit')
    - when: otherwise (a shorter leave)
      value: '0'
    baseline:
      hc_meal: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: hc_isolation_rate
    effect: parameter
    decides: hc_dep_tier
    bindings:
    - hc_agr_iso
    - hc_agr_move
    - hc_agr_tier
    - hc_dep_tier
    ladder:
    - when: >-
        the agreement carries an isolation placement recorded no later than the departure date on the tier of the room held,
        a private secure memory care room
      value: '''Semi-Private Secure Memory Care Room'''
    - when: >-
        the agreement carries an isolation placement recorded no later than the departure date on the tier of the room held,
        any other private room
      value: '''Semi-Private Long-Term Care Room'''
    - when: >-
        otherwise (no isolation placement, one recorded after the departure date, or the room held is not the agreement's
        room)
      value: hc_room
    baseline:
      hc_dep_tier: hc_room
    evidence:
    - cross_category
    - date
    cross_difficulty: private
  - id: hc_return_day
    effect: parameter
    decides: hc_ret_day
    bindings:
    - hc_ret_day
    ladder:
    - when: the return date falls on one of the entry's days
      value: '1'
    - when: the return date falls after the entry's last day
      value: '0'
    - when: otherwise (no return recorded)
      value: '0'
    baseline:
      hc_ret_day: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: hc_after_hold_end
    effect: parameter
    decides: hc_after
    bindings:
    - hc_rel
    - hc_end
    - hc_end_reason
    - hc_after
    ladder:
    - when: the resident returned on or before the entry's last day
      value: MX(0, MN(hc_days, DAYS(hc_ret, hc_to)))
    - when: the bed was released before the entry's last day
      value: MX(0, MN(hc_days, DAYS(hc_rel, hc_to)))
    - when: the hold expired on a hospital discharge to another setting before the entry's last day
      value: MX(0, MN(hc_days, DAYS(hc_end, hc_to)))
    - when: otherwise (the hold ended after the entry, or has not ended)
      value: '0'
    baseline:
      hc_after: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The hospital closing charge is the hospital closing entry's charged days times the hospital closing daily charge, rounded
      half up to the cent once on the total. The hospital closing daily charge is the schedule daily rate for the tier of
      the room held, the prior schedule pricing the entry's days dated before the current schedule's schedule date and the
      current schedule the rest. The prior and current schedule rates of each room tier that price the hospital closing charge
      are the figures this schedule restates from the private pay schedule, the current schedule taking effect on its schedule
      date. The hospital closing entry's charged days are its days less any of them held before the transfer notice was delivered,
      those days being the entry's days dated before the delivery date, or all of its days where no transfer notice is on
      file.
    params:
    - current_rate_semi_private_ltc
    - current_rate_semi_private_memory
    - current_rate_private_ltc
    - current_rate_private_memory
    - current_rate_private_bariatric
    - current_rate_private_suite
    - prior_rate_semi_private_ltc
    - prior_rate_semi_private_memory
    - prior_rate_private_ltc
    - prior_rate_private_memory
    - prior_rate_private_bariatric
    - prior_rate_private_suite
    - current_schedule_date
  inputs:
    history:
    - table: bedhold_ledger
      aggregate: latest
      field: to_date
      filters:
        event_type: bedhold_day_booked
        day_payer: resident_private
    - table: bedhold_ledger
      aggregate: sum
      field: day_count
      filters:
        event_type: bedhold_day_reversed
    - table: bedhold_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: bedhold_notice_delivered
        notice_type: transfer_notice
    - table: bedhold_ledger
      aggregate: sum
      field: day_count
      filters:
        event_type: bedhold_charge
    cross_category:
    - private
