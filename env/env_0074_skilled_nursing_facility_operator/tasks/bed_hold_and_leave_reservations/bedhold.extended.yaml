    evidence:
    - history
    cross_difficulty: null
  - id: tc_dietary_credit
    effect: parameter
    decides: tc_meal
    bindings:
    - tc_leave
    - tc_meal
    ladder:
    - when: >-
        the leave runs at least the dietary-credit minimum leave days and the bed held is on a secure memory care tier
      value: K('memory_unit_dietary_credit')
    - when: the leave runs at least the dietary-credit minimum leave days and the bed held is on any other tier
      value: K('standard_dietary_credit')
    - when: otherwise (a shorter leave)
      value: '0'
    baseline:
      tc_meal: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: tc_isolation_rate
    effect: parameter
    decides: tc_dep_tier
    bindings:
    - tc_agr_iso
    - tc_agr_move
    - tc_agr_tier
    - tc_dep_tier
    ladder:
    - when: >-
        the agreement carries an isolation placement recorded no later than the departure date on the tier of the room held,
        a private secure memory care room
      value: '''Semi-Private Secure Memory Care Room'''
    - when: >-
        the agreement carries an isolation placement recorded no later than the departure date on the tier of the room held,
        any other private room
      value: '''Semi-Private Long-Term Care Room'''
    - when: >-
        otherwise (no isolation placement, one recorded after the departure date, or the room held is not the agreement's
        room)
      value: tc_room
    baseline:
      tc_dep_tier: tc_room
    evidence:
    - cross_category
    - date
    cross_difficulty: private
  - id: tc_after_hold_end
    effect: parameter
    decides: tc_after
    bindings:
    - tc_rel
    - tc_end
    - tc_end_reason
    - tc_after
    ladder:
    - when: the resident returned on or before the entry's last day
      value: MX(0, MN(tc_days, DAYS(tc_ret, tc_to)))
    - when: the bed was released before the entry's last day
      value: MX(0, MN(tc_days, DAYS(tc_rel, tc_to)))
    - when: the hold expired on a hospital discharge to another setting before the entry's last day
      value: MX(0, MN(tc_days, DAYS(tc_end, tc_to)))
    - when: otherwise (the hold ended after the entry, or has not ended)
      value: '0'
    baseline:
      tc_after: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The therapeutic closing charge is the therapeutic closing entry's charged days times the therapeutic closing daily charge,
      rounded half up to the cent once on the total. The therapeutic closing daily charge is the schedule daily rate for the
      tier of the room held, the prior schedule pricing the entry's days dated before the current schedule's schedule date
      and the current schedule the rest. The prior and current schedule rates of each room tier that price the therapeutic
      closing charge are the figures this schedule restates from the private pay schedule, the current schedule taking effect
      on its schedule date. The therapeutic closing entry's charged days are its days less any of them held before the transfer
      notice was delivered, those days being the entry's days dated before the delivery date, or all of its days where no
      transfer notice is on file.
