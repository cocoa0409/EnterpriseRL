  computes: amount
  target_tool: post_hospital_opening_charge_991dca72
  params:
    prior_rate_semi_private_ltc: 384.0
    current_rate_semi_private_ltc: 398.0
    prior_rate_semi_private_memory: 412.0
    current_rate_semi_private_memory: 427.0
    prior_rate_private_ltc: 421.0
    current_rate_private_ltc: 436.0
    prior_rate_private_memory: 449.0
    current_rate_private_memory: 465.0
    prior_rate_private_bariatric: 466.0
    current_rate_private_bariatric: 482.0
    prior_rate_private_suite: 497.0
    current_rate_private_suite: 514.0
    current_schedule_date: '2026-07-01'
    full_rate_pct: 100
    mid_hold_pct: 95
    long_hold_pct: 85
    mid_hold_threshold_days: 15
    long_hold_threshold_days: 30
    dietary_credit_min_leave_days: 4
    standard_dietary_credit: 14.1
    memory_unit_dietary_credit: 16.8
  rule: >-
    Outside the opening entry and the closing entry of a released Private Pay Therapeutic Leave Bed Hold that carries more
    than one resident-private entry, the resident-private entry of a Private Pay Hospital Leave Bed Hold that carries a single
    resident-private entry, and the opening entry and the closing entry of a Medicaid Hospital Leave Reserved Bed hold that
    carries more than one resident-private entry, each booked resident-private entry is charged once at its days times the
    bed-hold daily rate, the tier's bed-hold percent of the private pay schedule's daily rate in effect on those days for
    the tier of the room held, whatever payer source covers the resident's stay otherwise, rounded half up to the cent; each
    of those five entries is priced by its own schedule. This schedule prices the hospital opening entry, the opening resident-private
    entry of a Medicaid Hospital Leave Reserved Bed hold that carries more than one resident-private entry: the resident-private
    entry beginning on the reservation's recorded first privately held day. A reservation carries one resident-private entry
    per service month, so the hospital opening entry is a single entry, its days as booked counted net of any of them reversed
    against it; the business office posts the hospital opening charge once the entry is booked. For the hospital opening charge,
    the private-pay agreement read is the resident's current one, the agreement that is active, else in its notice period,
    else converted to another payer source, and a transfer notice counts from the earlier of its latest delivery to the resident
    and its latest delivery to the representative. The hospital opening charge is the hospital opening entry's charged days
    times the hospital opening daily charge, rounded half up to the cent once on the total. The hospital opening daily charge
    is the schedule daily rate for the tier of the room held, the prior schedule pricing the entry's days dated before the
    current schedule's schedule date and the current schedule the rest. The prior and current schedule rates of each room
    tier that price the hospital opening charge are the figures this schedule restates from the private pay schedule, the
    current schedule taking effect on its schedule date. The hospital opening entry's charged days are its days less any of
    them held before the transfer notice was delivered, those days being the entry's days dated before the delivery date,
    or all of its days where no transfer notice is on file. For the hospital opening daily charge, the current schedule reaches
    a private-pay agreement signed before the schedule date only through the written rate notice: where such an agreement's
    rate notice was delivered fewer than the agreement's rate-change notice days before the schedule date, or on or after
    the schedule date, the current schedule prices the calendar days from the later of the schedule date and the date falling
    those notice days after the delivery through the hospital opening entry's last day, never more than the entry's days,
    and the prior schedule prices the entry's remaining days; where such an agreement carries no rate notice, the prior schedule
    prices every day of the entry; otherwise the current schedule prices the calendar days from the schedule date through
    the entry's last day, never more than the entry's days, and the prior schedule the rest. The hospital opening daily charge
    follows the extended-hold schedule on the leave's privately held days already charged, counted as the days recorded on
    the bed-hold charges posted on the reservation, together with the hospital opening entry's days: more than the long-hold
    threshold days take the long-hold percent of the rate, at least the mid-hold threshold days and no more than the long-hold
    threshold days take the mid-hold percent, and fewer than the mid-hold threshold days take the full-rate percent. Meals
    are not prepared for a resident on leave, so the hospital opening daily charge carries a dietary credit keyed to the bed
    held as the reservation records it and to the leave's length from the departure date through the hospital opening entry's
    last day, both days counted: a leave of at least the dietary-credit minimum leave days takes the memory-unit dietary credit
    for a bed held on a secure memory care tier and the standard dietary credit for a bed held on any other tier, and a shorter
    leave takes none. The room held counts as an isolation placement when the resident's private-pay agreement carries an
    isolation placement and the agreement's tier is the tier of the room held, the agreement's last room change, the center's
    infection-control move, being dated no later than the departure date; such a room is priced at its isolation billing tier,
    as the private-pay agreement prices that room's room and board: a private secure memory care room at the semi-private
    secure memory care tier and any other private room at the semi-private long-term care tier; any other room held is priced
    at its own tier. Medicaid hospital reserved days count per hospitalization, consecutively from the departure date, up
    to the tier's per-hospitalization limit, and are never billed to the resident: the hospital opening entry's days that
    fall within that many days of the departure date, the departure date counted as the first, are payer-covered and are not
    charged, however the entry was booked; where the entry begins after that, or the tier has no per-hospitalization payer
    days, none are. The hospital opening figures are combined in this order: each schedule rate is first taken to the applicable
    percent, any per-day credit is then subtracted from that reduced rate, and each resulting daily charge is multiplied by
    the charged days it applies to; the days not charged at the start of the entry, as many as the larger of those held before
    the notice and those payer-covered, are its first days, the days not charged at the end of the entry are its last days,
    and the current-schedule days are counted back from the entry's last day; the charge is the sum, rounded half up to the
    cent once on the total.
