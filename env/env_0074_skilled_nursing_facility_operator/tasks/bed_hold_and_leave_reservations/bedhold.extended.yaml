      LATEST('bedhold_ledger', 'from_date', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - hs_entry: >-
      LATEST('bedhold_ledger', 'bedhold_entry_id', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - hs_days: >-
      SUM('bedhold_ledger', 'day_count', event_type='bedhold_day_booked', day_payer='resident_private', to_date=hs_to) - SUM('bedhold_ledger',
      'day_count', event_type='bedhold_day_reversed', days_entry_id=hs_entry)
  - hs_notice_res: >-
      LATEST('bedhold_ledger', 'entry_date', date_field='delivered_at', event_type='bedhold_notice_delivered', notice_type='transfer_notice',
      delivered_to='resident')
  - hs_notice_rep: >-
      LATEST('bedhold_ledger', 'entry_date', date_field='delivered_at', event_type='bedhold_notice_delivered', notice_type='transfer_notice',
      delivered_to='representative')
  - hs_notice: MN(hs_notice_res or hs_notice_rep or '', hs_notice_rep or hs_notice_res or '')
  - hs_unnoticed: >-
      MN(hs_days, DAYS(hs_from, hs_notice)) if (hs_notice and hs_notice > hs_from) else (hs_days if (not hs_notice and hs_days
      > 0) else 0)
  - hs_state: >-
      'active' if EXISTS('private', status='active') else ('notice_period' if EXISTS('private', status='notice_period') else
      'payer_converted')
  - hs_signed: CFIELD('private', 'agreement_signed_date', status=hs_state)
  - hs_rate_notice: CFIELD('private', 'rate_notice_delivered_date', status=hs_state)
  - hs_notice_run: CPARAM('private', 'rate_change_notice_days', status=hs_state) or 0
  - hs_cur_days: >-
      MX(0, MN(hs_days, DAYS(hs_sched, hs_to) - MX(0, DAYS(hs_sched, hs_rate_notice) + hs_notice_run) + 1)) if (hs_rate_notice
      and (hs_signed or hs_sched) < hs_sched and DAYS(hs_sched, hs_rate_notice) + hs_notice_run > 0) else (0 if (not hs_rate_notice
      and (hs_signed or hs_sched) < hs_sched) else MX(0, MN(hs_days, DAYS(hs_sched, hs_to) + 1)))
  - hs_charged_before: SUM('bedhold_ledger', 'day_count', event_type='bedhold_charge')
  - hs_run: hs_charged_before + hs_days
  - hs_pct: >-
      K('long_hold_pct') if hs_run > K('long_hold_threshold_days') else (K('mid_hold_pct') if hs_run >= K('mid_hold_threshold_days')
      else K('full_rate_pct'))
  - hs_leave: DAYS(dep, hs_to) + 1
  - hs_meal: >-
      K('memory_unit_dietary_credit') if ((hs_room == 'Semi-Private Secure Memory Care Room' or hs_room == 'Private Secure
      Memory Care Room') and hs_leave >= K('dietary_credit_min_leave_days')) else (K('standard_dietary_credit') if (hs_room
      != 'Semi-Private Secure Memory Care Room' and hs_room != 'Private Secure Memory Care Room' and hs_leave >= K('dietary_credit_min_leave_days'))
      else 0)
  - hs_agr_iso: CFIELD('private', 'isolation_placement', status=hs_state)
  - hs_agr_tier: CFIELD('private', 'variant_name', status=hs_state)
  - hs_agr_move: CFIELD('private', 'last_room_change_date', status=hs_state)
  - hs_dep_tier: >-
      'Semi-Private Secure Memory Care Room' if (hs_agr_iso == True and hs_agr_move and DAYS(hs_agr_move, dep) >= 0 and hs_agr_tier
      == hs_room and hs_room == 'Private Secure Memory Care Room') else ('Semi-Private Long-Term Care Room' if (hs_agr_iso
      == True and hs_agr_move and DAYS(hs_agr_move, dep) >= 0 and hs_agr_tier == hs_room and (hs_room == 'Private Long-Term
      Care Room' or hs_room == 'Private Bariatric Care Room' or hs_room == 'Private Suite with Sitting Area')) else hs_room)
  - hs_ret: F('return_date')
  - hs_ret_day: >-
      1 if (hs_ret and DAYS(hs_from, hs_ret) >= 0 and DAYS(hs_ret, hs_to) >= 0) else (0 if (hs_ret and DAYS(hs_ret, hs_to)
      < 0) else 0)
  - hs_rel: F('release_date')
  - hs_end: F('end_date')
  - hs_end_reason: F('end_reason')
  - hs_after: >-
      MX(0, MN(hs_days, DAYS(hs_ret, hs_to))) if (hs_ret and hs_ret <= hs_to) else (MX(0, MN(hs_days, DAYS(hs_rel, hs_to)))
      if (hs_rel and hs_rel < hs_to) else (MX(0, MN(hs_days, DAYS(hs_end, hs_to))) if (hs_end_reason == 'hospital_discharged_elsewhere'
      and hs_end and hs_end < hs_to) else 0))
  - hs_prior_rate: >-
      K('prior_rate_semi_private_ltc') if hs_dep_tier == 'Semi-Private Long-Term Care Room' else (K('prior_rate_semi_private_memory')
      if hs_dep_tier == 'Semi-Private Secure Memory Care Room' else (K('prior_rate_private_ltc') if hs_dep_tier == 'Private
      Long-Term Care Room' else (K('prior_rate_private_memory') if hs_dep_tier == 'Private Secure Memory Care Room' else (K('prior_rate_private_bariatric')
      if hs_dep_tier == 'Private Bariatric Care Room' else (K('prior_rate_private_suite'))))))
  - hs_cur_rate: >-
      K('current_rate_semi_private_ltc') if hs_dep_tier == 'Semi-Private Long-Term Care Room' else (K('current_rate_semi_private_memory')
      if hs_dep_tier == 'Semi-Private Secure Memory Care Room' else (K('current_rate_private_ltc') if hs_dep_tier == 'Private
      Long-Term Care Room' else (K('current_rate_private_memory') if hs_dep_tier == 'Private Secure Memory Care Room' else
      (K('current_rate_private_bariatric') if hs_dep_tier == 'Private Bariatric Care Room' else (K('current_rate_private_suite'))))))
  - hs_start_off: hs_unnoticed
  - hs_end_off: hs_ret_day + hs_after
  - hs_charged: MX(0, hs_days - hs_start_off - hs_end_off)
  - hs_cur: MX(0, MN(hs_charged, hs_cur_days - hs_end_off))
  - hs_prior: hs_charged - hs_cur
  - hs_prior_daily: hs_prior_rate * hs_pct / K('full_rate_pct') - hs_meal
  - hs_cur_daily: hs_cur_rate * hs_pct / K('full_rate_pct') - hs_meal
  - result: RND(hs_prior * hs_prior_daily + hs_cur * hs_cur_daily + 0.000000001, 2)
  compute_basis:
    dep: from the departure date
    hs_room: the schedule daily rate for the tier of the room held
    hs_sched: the current schedule taking effect on its schedule date
    hs_to: >-
      This schedule prices the hospital stay entry, the resident-private entry of a Private Pay Hospital Leave Bed Hold whose
      leave has ended with a single resident-private entry on the reservation
    hs_from: the entry's days dated before the delivery date
    hs_entry: so the hospital stay entry is a single entry
    hs_days: its days as booked counted net of any of them reversed against it
    hs_notice_res: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    hs_notice_rep: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    hs_notice: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    hs_unnoticed: >-
      The hospital stay entry's charged days are its days less any of them held before the transfer notice was delivered,
      those days being the entry's days dated before the delivery date, or all of its days where no transfer notice is on
      file.
    hs_state: >-
      the private-pay agreement read is the resident's current one, the agreement that is active, else in its notice period,
      else converted to another payer source
    hs_signed: >-
      the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice
    hs_rate_notice: >-
      the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice
    hs_notice_run: the date falling those notice days after the delivery
    hs_cur_days: >-
      where such an agreement's rate notice was delivered fewer than the agreement's rate-change notice days before the schedule
      date, or on or after the schedule date, the current schedule prices the calendar days from the later of the schedule
      date and the date falling those notice days after the delivery through the hospital stay entry's last day, never more
      than the entry's days, and the prior schedule prices the entry's remaining days; where such an agreement carries no
      rate notice, the prior schedule prices every day of the entry; otherwise the current schedule prices the calendar days
      from the schedule date through the entry's last day, never more than the entry's days, and the prior schedule the rest
    hs_charged_before: >-
      the leave's privately held days already charged, counted as the days recorded on the bed-hold charges posted on the
      reservation
    hs_run: together with the hospital stay entry's days
    hs_pct: >-
      more than the long-hold threshold days take the long-hold percent of the rate, at least the mid-hold threshold days
      and no more than the long-hold threshold days take the mid-hold percent, and fewer than the mid-hold threshold days
      take the full-rate percent.
    hs_leave: >-
      the leave's length from the departure date through the hospital stay entry's last day, both days counted
    hs_meal: >-
      a leave of at least the dietary-credit minimum leave days takes the memory-unit dietary credit for a bed held on a secure
      memory care tier and the standard dietary credit for a bed held on any other tier, and a shorter leave takes none.
    hs_agr_iso: the resident's private-pay agreement carries an isolation placement
    hs_agr_tier: the agreement's tier is the tier of the room held
    hs_dep_tier: >-
      a private secure memory care room at the semi-private secure memory care tier and any other private room at the semi-private
      long-term care tier; any other room held is priced at its own tier.
    hs_ret: where the reservation's return date falls on one of
    hs_ret_day: >-
      where the reservation's return date falls on one of the hospital stay entry's days, that day is not charged; where the
      return date falls after the entry's last day, or no return is recorded, no day is taken off for it
    hs_rel: where the bed was released
    hs_end: the hold's last held day
    hs_end_reason: where the hold expired because the hospital discharged the resident to another setting
    hs_after: >-
      where the resident returned, the entry's days dated after the return date; where the bed was released, the entry's days
      dated after the release date, the day of release being the last held day; where the hold expired because the hospital
      discharged the resident to another setting, the entry's days dated after the hold's last held day; where the hold ended
      after the entry's last day, or has not ended, none
    hs_prior_rate: >-
      The prior and current schedule rates of each room tier that price the hospital stay charge are the figures this schedule
      restates from the private pay schedule, the current schedule taking effect on its schedule date.
    hs_cur_rate: >-
      The prior and current schedule rates of each room tier that price the hospital stay charge are the figures this schedule
      restates from the private pay schedule, the current schedule taking effect on its schedule date.
    hs_start_off: the days not charged at the start of the entry are its first days
    hs_end_off: the days not charged at the end of the entry are its last days
    hs_charged: >-
      The hospital stay charge is the hospital stay entry's charged days times the hospital stay daily charge
    hs_cur: the current-schedule days are counted back from the entry's last day
    hs_prior: each resulting daily charge is multiplied by the charged days it applies to
    hs_prior_daily: >-
      each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted from that reduced
      rate
    hs_cur_daily: >-
      each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted from that reduced
      rate
    result: the charge is the sum, rounded half up to the cent once on the total.
    hs_agr_move: >-
      the agreement's last room change, the center's infection-control move, being dated no later than the departure date
  factors:
  - id: hs_rate_binding
    effect: method
    decides: hs_cur_days
    bindings:
    - hs_signed
    - hs_rate_notice
    - hs_notice_run
    - hs_cur_days
    ladder:
    - when: >-
        the agreement was signed before the schedule date and its rate notice was delivered fewer than the rate-change notice
        days before the schedule date, or on or after it
      method: >-
        split at the later of the schedule date and the notice-plus-notice-days date (a later-of pick on the notice date)
    - when: the agreement was signed before the schedule date and carries no rate notice
      method: the prior schedule's rate on every day of the entry (no split)
    - when: otherwise
      method: split at the schedule date
    baseline:
      hs_cur_days: MX(0, MN(hs_days, DAYS(hs_sched, hs_to) + 1))
    evidence:
    - cross_category
    - date
    cross_difficulty: private
  - id: hs_extended_hold
    effect: parameter
    decides: hs_pct
    bindings:
    - hs_charged_before
    - hs_run
    - hs_pct
    ladder:
    - when: more than the long-hold threshold days charged before and on the entry
      value: K('long_hold_pct')
    - when: at least the mid-hold threshold days and no more than the long-hold threshold days
      value: K('mid_hold_pct')
    - when: otherwise
      value: K('full_rate_pct')
    baseline:
      hs_pct: K('full_rate_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: hs_dietary_credit
    effect: parameter
    decides: hs_meal
    bindings:
    - hs_leave
    - hs_meal
    ladder:
    - when: >-
        the leave runs at least the dietary-credit minimum leave days and the bed held is on a secure memory care tier
      value: K('memory_unit_dietary_credit')
    - when: the leave runs at least the dietary-credit minimum leave days and the bed held is on any other tier
      value: K('standard_dietary_credit')
    - when: otherwise (a shorter leave)
      value: '0'
    baseline:
      hs_meal: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: hs_isolation_rate
    effect: parameter
    decides: hs_dep_tier
    bindings:
    - hs_agr_iso
    - hs_agr_move
    - hs_agr_tier
    - hs_dep_tier
    ladder:
    - when: >-
        the agreement carries an isolation placement recorded no later than the departure date on the tier of the room held,
        a private secure memory care room
      value: '''Semi-Private Secure Memory Care Room'''
    - when: >-
        the agreement carries an isolation placement recorded no later than the departure date on the tier of the room held,
        any other private room
      value: '''Semi-Private Long-Term Care Room'''
    - when: >-
        otherwise (no isolation placement, one recorded after the departure date, or the room held is not the agreement's
        room)
      value: hs_room
    baseline:
      hs_dep_tier: hs_room
    evidence:
    - cross_category
    - date
    cross_difficulty: private
  - id: hs_return_day
    effect: parameter
    decides: hs_ret_day
    bindings:
    - hs_ret_day
    ladder:
    - when: the return date falls on one of the entry's days
      value: '1'
    - when: the return date falls after the entry's last day
      value: '0'
    - when: otherwise (no return recorded)
      value: '0'
    baseline:
      hs_ret_day: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: hs_after_hold_end
    effect: parameter
    decides: hs_after
    bindings:
    - hs_rel
    - hs_end
    - hs_end_reason
    - hs_after
    ladder:
    - when: the resident returned on or before the entry's last day
      value: MX(0, MN(hs_days, DAYS(hs_ret, hs_to)))
    - when: the bed was released before the entry's last day
      value: MX(0, MN(hs_days, DAYS(hs_rel, hs_to)))
    - when: the hold expired on a hospital discharge to another setting before the entry's last day
      value: MX(0, MN(hs_days, DAYS(hs_end, hs_to)))
    - when: otherwise (the hold ended after the entry, or has not ended)
      value: '0'
    baseline:
      hs_after: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The hospital stay charge is the hospital stay entry's charged days times the hospital stay daily charge, rounded half
      up to the cent once on the total. The hospital stay daily charge is the schedule daily rate for the tier of the room
      held, the prior schedule pricing the entry's days dated before the current schedule's schedule date and the current
      schedule the rest. The prior and current schedule rates of each room tier that price the hospital stay charge are the
      figures this schedule restates from the private pay schedule, the current schedule taking effect on its schedule date.
      The hospital stay entry's charged days are its days less any of them held before the transfer notice was delivered,
      those days being the entry's days dated before the delivery date, or all of its days where no transfer notice is on
      file.
    params:
    - current_rate_semi_private_ltc
    - current_rate_semi_private_memory
    - current_rate_private_ltc
    - current_rate_private_memory
    - current_rate_private_bariatric
    - current_rate_private_suite
    - prior_rate_semi_private_ltc
    - prior_rate_semi_private_memory
    - prior_rate_private_ltc
    - prior_rate_private_memory
    - prior_rate_private_bariatric
    - prior_rate_private_suite
    - current_schedule_date
  inputs:
    history:
    - table: bedhold_ledger
      aggregate: latest
      field: to_date
      filters:
        event_type: bedhold_day_booked
        day_payer: resident_private
    - table: bedhold_ledger
      aggregate: sum
      field: day_count
      filters:
        event_type: bedhold_day_reversed
    - table: bedhold_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: bedhold_notice_delivered
        notice_type: transfer_notice
    - table: bedhold_ledger
      aggregate: sum
      field: day_count
      filters:
        event_type: bedhold_charge
    cross_category:
    - private
- id: bedhold_ext_therapeutic_closing_charge
  base_policy_refs:
  - bedhold_evt_charges
  - bedhold_evt_notice
  - bedhold_evt_day_counting
  - bedhold_hold_end
  - bedhold_agg_payer_day_limits
  overwrite:
  - base_policy: bedhold_evt_charges
    superseded_clause: >-
      Each booked resident_private entry is charged once: the days times the bed-hold daily rate, rounded half up to the cent.
      The bed-hold daily rate is the tier's bed-hold percent of the private pay schedule's daily rate in effect on those days
      for the tier of the room held, whatever payer source covers the resident's stay otherwise.
    replaced_by: >-
      Outside the opening entry and the closing entry of a released Private Pay Therapeutic Leave Bed Hold that carries more
      than one resident-private entry, the resident-private entry of a Private Pay Hospital Leave Bed Hold that carries a
      single resident-private entry, and the opening entry and the closing entry of a Medicaid Hospital Leave Reserved Bed
      hold that carries more than one resident-private entry, each booked resident-private entry is charged once at its days
      times the bed-hold daily rate, the tier's bed-hold percent of the private pay schedule's daily rate in effect on those
      days for the tier of the room held, whatever payer source covers the resident's stay otherwise, rounded half up to the
      cent; each of those five entries is priced by its own schedule.
  trigger: on_request
  subject:
  - bedhold_charge
  computes: amount
  target_tool: sign_therapeutic_closing_charge_194aeb06
  params:
    prior_rate_semi_private_ltc: 384.0
    current_rate_semi_private_ltc: 398.0
    prior_rate_semi_private_memory: 412.0
    current_rate_semi_private_memory: 427.0
    prior_rate_private_ltc: 421.0
    current_rate_private_ltc: 436.0
    prior_rate_private_memory: 449.0
    current_rate_private_memory: 465.0
    prior_rate_private_bariatric: 466.0
    current_rate_private_bariatric: 482.0
    prior_rate_private_suite: 497.0
    current_rate_private_suite: 514.0
    current_schedule_date: '2026-07-01'
    full_rate_pct: 100
    mid_hold_pct: 95
    long_hold_pct: 85
    mid_hold_threshold_days: 15
    long_hold_threshold_days: 30
    dietary_credit_min_leave_days: 4
    standard_dietary_credit: 14.1
    memory_unit_dietary_credit: 16.8
  rule: >-
    Outside the opening entry and the closing entry of a released Private Pay Therapeutic Leave Bed Hold that carries more
    than one resident-private entry, the resident-private entry of a Private Pay Hospital Leave Bed Hold that carries a single
    resident-private entry, and the opening entry and the closing entry of a Medicaid Hospital Leave Reserved Bed hold that
    carries more than one resident-private entry, each booked resident-private entry is charged once at its days times the
    bed-hold daily rate, the tier's bed-hold percent of the private pay schedule's daily rate in effect on those days for
    the tier of the room held, whatever payer source covers the resident's stay otherwise, rounded half up to the cent; each
    of those five entries is priced by its own schedule. This schedule prices the therapeutic closing entry, the closing entry
    of a released Private Pay Therapeutic Leave Bed Hold that carries more than one resident-private entry: the resident-private
    entry with the latest last day on the reservation, when it is not also the opening entry. A reservation carries one resident-private
    entry per service month, so the therapeutic closing entry is a single entry, its days as booked counted net of any of
    them reversed against it; the resident or representative signs the private bed-hold charge agreement for it, and the signed
    charge is what posts. For the therapeutic closing charge, the private-pay agreement read is the resident's current one,
    the agreement that is active, else in its notice period, else converted to another payer source, and a transfer notice
    counts from the earlier of its latest delivery to the resident and its latest delivery to the representative. The therapeutic
    closing charge is fixed only after the opening entry of the leave carries its bed-hold charge. The therapeutic closing
    charge is not posted until the resident-private entry of every earlier private-pay hospital leave of the resident that
    carried a single resident-private entry carries its own bed-hold charge. The therapeutic closing charge is the therapeutic
    closing entry's charged days times the therapeutic closing daily charge, rounded half up to the cent once on the total.
    The therapeutic closing daily charge is the schedule daily rate for the tier of the room held, the prior schedule pricing
    the entry's days dated before the current schedule's schedule date and the current schedule the rest. The prior and current
    schedule rates of each room tier that price the therapeutic closing charge are the figures this schedule restates from
    the private pay schedule, the current schedule taking effect on its schedule date. The therapeutic closing entry's charged
    days are its days less any of them held before the transfer notice was delivered, those days being the entry's days dated
    before the delivery date, or all of its days where no transfer notice is on file. For the therapeutic closing daily charge,
    the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice:
    where such an agreement's rate notice was delivered fewer than the agreement's rate-change notice days before the schedule
    date, or on or after the schedule date, the current schedule prices the calendar days from the later of the schedule date
    and the date falling those notice days after the delivery through the therapeutic closing entry's last day, never more
    than the entry's days, and the prior schedule prices the entry's remaining days; where such an agreement carries no rate
    notice, the prior schedule prices every day of the entry; otherwise the current schedule prices the calendar days from
    the schedule date through the entry's last day, never more than the entry's days, and the prior schedule the rest. The
    therapeutic closing daily charge follows the extended-hold schedule on the leave's privately held days already charged,
    counted as the days recorded on the bed-hold charges posted on the reservation, together with the therapeutic closing
    entry's days: more than the long-hold threshold days take the long-hold percent of the rate, at least the mid-hold threshold
    days and no more than the long-hold threshold days take the mid-hold percent, and fewer than the mid-hold threshold days
    take the full-rate percent. Meals are not prepared for a resident on leave, so the therapeutic closing daily charge carries
    a dietary credit keyed to the bed held as the reservation records it and to the leave's length from the departure date
    through the therapeutic closing entry's last day, both days counted: a leave of at least the dietary-credit minimum leave
    days takes the memory-unit dietary credit for a bed held on a secure memory care tier and the standard dietary credit
    for a bed held on any other tier, and a shorter leave takes none. The room held counts as an isolation placement when
    the resident's private-pay agreement carries an isolation placement and the agreement's tier is the tier of the room held,
    the agreement's last room change, the center's infection-control move, being dated no later than the departure date; such
    a room is priced at its isolation billing tier, as the private-pay agreement prices that room's room and board: a private
    secure memory care room at the semi-private secure memory care tier and any other private room at the semi-private long-term
    care tier; any other room held is priced at its own tier. No day after the hold ended is charged: where the resident returned,
    the entry's days dated after the return date; where the bed was released, the entry's days dated after the release date,
    the day of release being the last held day; where the hold expired because the hospital discharged the resident to another
    setting, the entry's days dated after the hold's last held day; where the hold ended after the entry's last day, or has
    not ended, none. The therapeutic closing figures are combined in this order: each schedule rate is first taken to the
    applicable percent, any per-day credit is then subtracted from that reduced rate, and each resulting daily charge is multiplied
    by the charged days it applies to; the days not charged at the start of the entry are its first days, the days not charged
    at the end of the entry are its last days, and the current-schedule days are counted back from the entry's last day; the
    charge is the sum, rounded half up to the cent once on the total.
  prerequisite:
  - problem: bedhold_ext_therapeutic_opening_charge
    kind: value_input
    gate: tc_charged_before
    form: state
    policy_source: >-
      The therapeutic closing charge is fixed only after the opening entry of the leave carries its bed-hold charge.
    condition: >-
      The reservation's ledger carries a bedhold_charge row whose days_entry_id is the resident-private entry beginning on
      the reservation's recorded first privately held day.
    resolved_by: post_therapeutic_opening_charge_78fe9a0a
    effect: >-
      tc_charged_before counts the days recorded on that charge, which moves tc_run and with it the extended-hold percent
      of the therapeutic closing daily charge.
  - problem: bedhold_ext_hospital_stay_charge
    kind: state_gate
    gate: bedhold_ledger.days_entry_id
    form: state
    policy_source: >-
      The therapeutic closing charge is not posted until the resident-private entry of every earlier private-pay hospital
      leave of the resident that carried a single resident-private entry carries its own bed-hold charge.
    condition: >-
      Every bedhold_day_booked row with day_payer resident_private on the resident's ended Private Pay Hospital Leave Bed
      Hold reservations that carry a single resident-private entry is named by the days_entry_id of a bedhold_charge row.
    resolved_by: sign_hospital_stay_charge_56dfc7d9
    effect: >-
      The gate on the therapeutic closing charge holds: no earlier single-entry private-pay hospital leave of the resident
      carries an uncharged resident-private entry.
  cross_category:
  - category: private
    as: branch
    reads:
    - status
    - agreement_signed_date
    - rate_notice_delivered_date
    - rate_change_notice_days
    - isolation_placement
    - variant_name
    - last_room_change_date
    note: The rate-binding and isolation factors read the resident's current private-pay agreement.
  compute:
  - dep: F('leave_start_date')
  - tc_room: F('room_tier_held')
  - tc_sched: K('current_schedule_date')
  - tc_to: >-
      LATEST('bedhold_ledger', 'to_date', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - tc_from: >-
      LATEST('bedhold_ledger', 'from_date', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - tc_entry: >-
      LATEST('bedhold_ledger', 'bedhold_entry_id', date_field='to_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - tc_days: >-
      SUM('bedhold_ledger', 'day_count', event_type='bedhold_day_booked', day_payer='resident_private', to_date=tc_to) - SUM('bedhold_ledger',
      'day_count', event_type='bedhold_day_reversed', days_entry_id=tc_entry)
  - tc_notice_res: >-
      LATEST('bedhold_ledger', 'entry_date', date_field='delivered_at', event_type='bedhold_notice_delivered', notice_type='transfer_notice',
      delivered_to='resident')
  - tc_notice_rep: >-
      LATEST('bedhold_ledger', 'entry_date', date_field='delivered_at', event_type='bedhold_notice_delivered', notice_type='transfer_notice',
      delivered_to='representative')
  - tc_notice: MN(tc_notice_res or tc_notice_rep or '', tc_notice_rep or tc_notice_res or '')
  - tc_unnoticed: >-
      MN(tc_days, DAYS(tc_from, tc_notice)) if (tc_notice and tc_notice > tc_from) else (tc_days if (not tc_notice and tc_days
      > 0) else 0)
  - tc_state: >-
      'active' if EXISTS('private', status='active') else ('notice_period' if EXISTS('private', status='notice_period') else
      'payer_converted')
  - tc_signed: CFIELD('private', 'agreement_signed_date', status=tc_state)
  - tc_rate_notice: CFIELD('private', 'rate_notice_delivered_date', status=tc_state)
  - tc_notice_run: CPARAM('private', 'rate_change_notice_days', status=tc_state) or 0
  - tc_cur_days: >-
      MX(0, MN(tc_days, DAYS(tc_sched, tc_to) - MX(0, DAYS(tc_sched, tc_rate_notice) + tc_notice_run) + 1)) if (tc_rate_notice
      and (tc_signed or tc_sched) < tc_sched and DAYS(tc_sched, tc_rate_notice) + tc_notice_run > 0) else (0 if (not tc_rate_notice
      and (tc_signed or tc_sched) < tc_sched) else MX(0, MN(tc_days, DAYS(tc_sched, tc_to) + 1)))
  - tc_charged_before: SUM('bedhold_ledger', 'day_count', event_type='bedhold_charge')
  - tc_run: tc_charged_before + tc_days
  - tc_pct: >-
      K('long_hold_pct') if tc_run > K('long_hold_threshold_days') else (K('mid_hold_pct') if tc_run >= K('mid_hold_threshold_days')
      else K('full_rate_pct'))
  - tc_leave: DAYS(dep, tc_to) + 1
  - tc_meal: >-
      K('memory_unit_dietary_credit') if ((tc_room == 'Semi-Private Secure Memory Care Room' or tc_room == 'Private Secure
      Memory Care Room') and tc_leave >= K('dietary_credit_min_leave_days')) else (K('standard_dietary_credit') if (tc_room
      != 'Semi-Private Secure Memory Care Room' and tc_room != 'Private Secure Memory Care Room' and tc_leave >= K('dietary_credit_min_leave_days'))
      else 0)
  - tc_agr_iso: CFIELD('private', 'isolation_placement', status=tc_state)
  - tc_agr_tier: CFIELD('private', 'variant_name', status=tc_state)
  - tc_agr_move: CFIELD('private', 'last_room_change_date', status=tc_state)
  - tc_dep_tier: >-
      'Semi-Private Secure Memory Care Room' if (tc_agr_iso == True and tc_agr_move and DAYS(tc_agr_move, dep) >= 0 and tc_agr_tier
      == tc_room and tc_room == 'Private Secure Memory Care Room') else ('Semi-Private Long-Term Care Room' if (tc_agr_iso
      == True and tc_agr_move and DAYS(tc_agr_move, dep) >= 0 and tc_agr_tier == tc_room and (tc_room == 'Private Long-Term
      Care Room' or tc_room == 'Private Bariatric Care Room' or tc_room == 'Private Suite with Sitting Area')) else tc_room)
  - tc_ret: F('return_date')
  - tc_rel: F('release_date')
  - tc_end: F('end_date')
  - tc_end_reason: F('end_reason')
  - tc_after: >-
      MX(0, MN(tc_days, DAYS(tc_ret, tc_to))) if (tc_ret and tc_ret <= tc_to) else (MX(0, MN(tc_days, DAYS(tc_rel, tc_to)))
      if (tc_rel and tc_rel < tc_to) else (MX(0, MN(tc_days, DAYS(tc_end, tc_to))) if (tc_end_reason == 'hospital_discharged_elsewhere'
      and tc_end and tc_end < tc_to) else 0))
  - tc_prior_rate: >-
      K('prior_rate_semi_private_ltc') if tc_dep_tier == 'Semi-Private Long-Term Care Room' else (K('prior_rate_semi_private_memory')
      if tc_dep_tier == 'Semi-Private Secure Memory Care Room' else (K('prior_rate_private_ltc') if tc_dep_tier == 'Private
      Long-Term Care Room' else (K('prior_rate_private_memory') if tc_dep_tier == 'Private Secure Memory Care Room' else (K('prior_rate_private_bariatric')
      if tc_dep_tier == 'Private Bariatric Care Room' else (K('prior_rate_private_suite'))))))
  - tc_cur_rate: >-
      K('current_rate_semi_private_ltc') if tc_dep_tier == 'Semi-Private Long-Term Care Room' else (K('current_rate_semi_private_memory')
      if tc_dep_tier == 'Semi-Private Secure Memory Care Room' else (K('current_rate_private_ltc') if tc_dep_tier == 'Private
      Long-Term Care Room' else (K('current_rate_private_memory') if tc_dep_tier == 'Private Secure Memory Care Room' else
      (K('current_rate_private_bariatric') if tc_dep_tier == 'Private Bariatric Care Room' else (K('current_rate_private_suite'))))))
  - tc_start_off: tc_unnoticed
  - tc_end_off: tc_after
  - tc_charged: MX(0, tc_days - tc_start_off - tc_end_off)
  - tc_cur: MX(0, MN(tc_charged, tc_cur_days - tc_end_off))
  - tc_prior: tc_charged - tc_cur
  - tc_prior_daily: tc_prior_rate * tc_pct / K('full_rate_pct') - tc_meal
  - tc_cur_daily: tc_cur_rate * tc_pct / K('full_rate_pct') - tc_meal
  - result: RND(tc_prior * tc_prior_daily + tc_cur * tc_cur_daily + 0.000000001, 2)
  compute_basis:
    dep: from the departure date
    tc_room: the schedule daily rate for the tier of the room held
    tc_sched: the current schedule taking effect on its schedule date
    tc_to: >-
      the resident-private entry with the latest last day on the reservation, when it is not also the opening entry
    tc_from: the entry's days dated before the delivery date
    tc_entry: so the therapeutic closing entry is a single entry
    tc_days: its days as booked counted net of any of them reversed against it
    tc_notice_res: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    tc_notice_rep: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    tc_notice: >-
      a transfer notice counts from the earlier of its latest delivery to the resident and its latest delivery to the representative
    tc_unnoticed: >-
      The therapeutic closing entry's charged days are its days less any of them held before the transfer notice was delivered,
      those days being the entry's days dated before the delivery date, or all of its days where no transfer notice is on
      file.
    tc_state: >-
      the private-pay agreement read is the resident's current one, the agreement that is active, else in its notice period,
      else converted to another payer source
    tc_signed: >-
      the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice
    tc_rate_notice: >-
      the current schedule reaches a private-pay agreement signed before the schedule date only through the written rate notice
    tc_notice_run: the date falling those notice days after the delivery
    tc_cur_days: >-
      where such an agreement's rate notice was delivered fewer than the agreement's rate-change notice days before the schedule
      date, or on or after the schedule date, the current schedule prices the calendar days from the later of the schedule
      date and the date falling those notice days after the delivery through the therapeutic closing entry's last day, never
      more than the entry's days, and the prior schedule prices the entry's remaining days; where such an agreement carries
      no rate notice, the prior schedule prices every day of the entry; otherwise the current schedule prices the calendar
      days from the schedule date through the entry's last day, never more than the entry's days, and the prior schedule the
      rest
    tc_charged_before: >-
      the leave's privately held days already charged, counted as the days recorded on the bed-hold charges posted on the
      reservation
    tc_run: together with the therapeutic closing entry's days
    tc_pct: >-
      more than the long-hold threshold days take the long-hold percent of the rate, at least the mid-hold threshold days
      and no more than the long-hold threshold days take the mid-hold percent, and fewer than the mid-hold threshold days
      take the full-rate percent.
    tc_leave: >-
      the leave's length from the departure date through the therapeutic closing entry's last day, both days counted
    tc_meal: >-
      a leave of at least the dietary-credit minimum leave days takes the memory-unit dietary credit for a bed held on a secure
      memory care tier and the standard dietary credit for a bed held on any other tier, and a shorter leave takes none.
    tc_agr_iso: the resident's private-pay agreement carries an isolation placement
    tc_agr_tier: the agreement's tier is the tier of the room held
    tc_dep_tier: >-
      a private secure memory care room at the semi-private secure memory care tier and any other private room at the semi-private
      long-term care tier; any other room held is priced at its own tier.
    tc_ret: where the resident returned
    tc_rel: where the bed was released
    tc_end: the hold's last held day
    tc_end_reason: where the hold expired because the hospital discharged the resident to another setting
    tc_after: >-
      where the resident returned, the entry's days dated after the return date; where the bed was released, the entry's days
      dated after the release date, the day of release being the last held day; where the hold expired because the hospital
      discharged the resident to another setting, the entry's days dated after the hold's last held day; where the hold ended
      after the entry's last day, or has not ended, none
    tc_prior_rate: >-
      The prior and current schedule rates of each room tier that price the therapeutic closing charge are the figures this
      schedule restates from the private pay schedule, the current schedule taking effect on its schedule date.
    tc_cur_rate: >-
      The prior and current schedule rates of each room tier that price the therapeutic closing charge are the figures this
      schedule restates from the private pay schedule, the current schedule taking effect on its schedule date.
    tc_start_off: the days not charged at the start of the entry are its first days
    tc_end_off: the days not charged at the end of the entry are its last days
    tc_charged: >-
      The therapeutic closing charge is the therapeutic closing entry's charged days times the therapeutic closing daily charge
    tc_cur: the current-schedule days are counted back from the entry's last day
    tc_prior: each resulting daily charge is multiplied by the charged days it applies to
    tc_prior_daily: >-
      each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted from that reduced
      rate
    tc_cur_daily: >-
      each schedule rate is first taken to the applicable percent, any per-day credit is then subtracted from that reduced
      rate
    result: the charge is the sum, rounded half up to the cent once on the total.
    tc_agr_move: >-
      the agreement's last room change, the center's infection-control move, being dated no later than the departure date
  factors:
  - id: tc_rate_binding
    effect: method
    decides: tc_cur_days
    bindings:
    - tc_signed
    - tc_rate_notice
    - tc_notice_run
    - tc_cur_days
    ladder:
    - when: >-
        the agreement was signed before the schedule date and its rate notice was delivered fewer than the rate-change notice
        days before the schedule date, or on or after it
      method: >-
        split at the later of the schedule date and the notice-plus-notice-days date (a later-of pick on the notice date)
    - when: the agreement was signed before the schedule date and carries no rate notice
      method: the prior schedule's rate on every day of the entry (no split)
    - when: otherwise
      method: split at the schedule date
    baseline:
      tc_cur_days: MX(0, MN(tc_days, DAYS(tc_sched, tc_to) + 1))
    evidence:
    - cross_category
    - date
