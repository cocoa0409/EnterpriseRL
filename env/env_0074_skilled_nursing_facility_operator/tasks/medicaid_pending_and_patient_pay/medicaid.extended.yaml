      medicaid_days: Each schedule below changes that standard pricing for the months it names, either by taking days out of the month, which then carry no cost, or by setting the price of a kind of day; every day that neither the standard pricing nor a schedule takes out or prices stays a day at the Medicaid daily rate, never fewer than zero such days, each kind of day is priced and rounded half up to the cent, and the priced kinds are added to give the cost of care a reconciled estimate month carries.
