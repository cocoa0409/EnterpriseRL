- id: medicaid_case_maintenance
  subject:
  - medicaid_case_update
  - medicaid_eligible_close
  rule: 'The tier of a case follows the allowances on the County Assistance Office notice or worksheet: a community
    spouse allowance places it in the community spouse tier, a dependent family allowance in the dependent family
    tier, a VA pension reduced to the protected amount in the VA tier, a home maintenance allowance in the home
    maintenance tier for no longer than the home maintenance maximum months, a hospice election in the hospice room
    and board tier, and otherwise the standard tier. The Medicaid daily rate is updated from each new center rate
    letter. Renewals fall due every renewal interval. An eligible case is closed only when its patient pay balance
    and pending balance are both zero.'
  eligibility:
  - id: settled_to_close
    applies_to:
    - medicaid_eligible_close
    kind: authorization
    condition: An eligible case is closed only when its patient pay balance and pending balance are both zero.
    evidence_fields:
    - medicaid_cases.medicaid_case_id
    - medicaid_cases.patient_pay_balance
    - medicaid_cases.pending_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_cases.medicaid_case_id
      action_bindings:
        medicaid_cases.medicaid_case_id: medicaid_case_id
  params:
    per_tier:
      Medical Assistance Nursing Facility Care, Standard Patient Pay:
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Nursing Facility Care, Community Spouse Allowance:
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Nursing Facility Care, Dependent Family Allowance:
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Nursing Facility Care, VA Reduced Pension:
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Nursing Facility Care, Home Maintenance Allowance:
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Hospice Room and Board:
        home_maintenance_max_months: =home_maintenance_max_months
    renewal_interval_months: =renewal_interval_months
    spousal_resource_snapshot: =spousal_resource_snapshot
    close_requires_zero_balances: =close_requires_zero_balances
extended_policies:
  - id: medicaid_ext_actual_month_cost_cap
    base_policy_refs:
    - medicaid_evt_patient_pay_actual
    - medicaid_case_maintenance
    overwrite:
    - base_policy: medicaid_evt_patient_pay_actual
      superseded_clause: patient pay never exceeds the month's cost of care.
      replaced_by: For an actual-billed month that the actual-month review prices, a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, the month's cost of care is the cost of care that review's own schedules give, and only for such a month; every other month remains under the base rule, where the month's cost of care is the days in the center times the Medicaid daily rate.
    trigger: state_due
    subject:
    - medicaid_patient_pay_adjustment
    computes: amount
    target_tool: post_cost_of_care_reduction_89ef8a19
    params: {}
    rule: 'Once a calendar month billed on the County Assistance Office notice has closed, the business office reviews that month''s actual charge against the month''s cost of care. The review covers the calendar month before the current month and the case''s patient pay charge with charge basis actual_notice for that service month; the actual charge for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed the reduction is zero. Patient pay never exceeds the month''s cost of care. For an actual-billed month that the actual-month review prices, a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, the month''s cost of care is the cost of care that review''s own schedules give, and only for such a month; every other month remains under the base rule, where the month''s cost of care is the days in the center times the Medicaid daily rate. A month of admission, discharge or death stays under the partial-month rule, by which in a month of admission, discharge or death, patient pay is the lesser of the monthly patient pay and the days in the center times the Medicaid daily rate, with charge basis partial_month, and any amount already billed above that is reduced with reason cost_of_care_cap. The actual-month review covers a resident who holds exactly one funds account and exactly one Medicare coverage episode, each counted in every status, and no bed-hold reservation that ended because the hospital discharged the resident elsewhere; for any other resident it posts no reduction, and the partial-month rule and the base rule on the month''s cost of care apply as restated above. The actual-month review posts no reduction for a month that carries a patient pay charge with charge basis partial_month or a reduction with reason cost_of_care_cap for that service month, in which the case closed on the resident''s discharge or death, in which the resident''s funds account records the resident''s discharge or death as the start of conveyance, or in which the resident''s Medicare coverage ended because the resident was discharged from the center, transferred to a hospital without returning or died. The actual-month review prices any other month it covers where the bed-hold days booked for the month all belong to one bed-hold reservation, no Medicare coverage of the resident in status coverage_ended or closed has its last covered date after the month, that reservation''s last held day falls before any span the schedule on days after Part A coverage reads and before a hospice election inside the month, and no day away with no bed held falls in a month that schedule reads, and, where the hospice was elected inside the month, no Part A day is booked for the month on or after the election day, no day away with no bed held falls in the month and any span the schedule on days after Part A coverage reads starts before the election day; for any other such month the cost of care stays the days in the center times the Medicaid daily rate, rounded half up to the cent, the days in the center being the month''s calendar days less the bed-hold days booked for it and less the days away with no bed held counted as the standard pricing counts them, never fewer than zero. The cost of care an actual-billed month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month''s bookings) carry no cost, the days the resident was away with no bed held carry no cost (for every bed-hold reservation of the resident in status declined, from its leave start, in status released, from the day after its release, and in status expired, from the day after its last held day, each up to the day before its return, or to the month''s end where the resident has not come back, never fewer than zero in all), and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them. The reduction for an actual-billed month is the actual charge for the month less that cost of care, never below zero, rounded half up to the cent, and it is posted against that charge with reason cost_of_care_cap. Each schedule below changes that standard pricing for the months it names, either by taking days out of the month, which then carry no cost, or by setting the price of a kind of day; every day that neither the standard pricing nor a schedule takes out or prices stays a day at the Medicaid daily rate, never fewer than zero such days, each kind of day is priced and rounded half up to the cent, and the priced kinds are added to give the cost of care an actual-billed month carries. The price of a Part A coinsurance day in an actual-billed month follows who is billed the coinsurance for the month: where the month''s coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer, nothing, since the Medigap plan and the resident bear that coinsurance and the Medicare billing record charges it to them; where it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate, the Medicaid daily rate, since the program''s crossover payment for a day never exceeds what it pays for a Medicaid day; otherwise the highest daily coinsurance booked for the month. The first day of an actual-billed month priced at the hospice room-and-board share: where the case is on the Medical Assistance Hospice Room and Board tier and the hospice was elected before the month began, the month''s first day; where the case is on that tier and the hospice election date falls inside the month, the election date; otherwise none (the first day of the next month). From that first day the month''s Medicaid days, but never more than the days from that first day to the month''s end, are priced at the tier''s room-and-board share of the Medicaid daily rate, which is what the program pays the hospice for them and against which patient pay is credited. Days of an actual-billed month after Part A coverage ended that the resident pays, or that Medicare is still deciding: where the resident''s coverage in status coverage_ended or closed with the latest last covered date ended inside the month and the latest Skilled Nursing Facility Advance Beneficiary Notice, by delivery date, recorded on it has the resident''s choice of option 1 or option 2 (the care goes on and the resident pays for it), the days of the month from the first non-covered date it names; where the resident''s coverage in status under_appeal has its last covered date before the month''s end, the days of the month after that last covered date, which are not billed while the timely expedited review is pending; otherwise none (option 3, no notice, or no coverage ending), since those days are Medicaid days. Either span stops at the day before a hospice election inside the month. The first privately paid held day of an actual-billed month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out. Where two records share the latest date a schedule reads by, the one posted first is read.'
    prerequisite: []
    cross_category:
    - category: medicare
      as: history
      reads:
      - end_reason
      - last_covered_date
      - medicare_ledger.abn_option
      - medicare_ledger.adjustment_reason
      - medicare_ledger.daily_coinsurance_rate
      - medicare_ledger.day_band
      - medicare_ledger.day_count
      - medicare_ledger.entry_date
      - medicare_ledger.from_date
      - medicare_ledger.liable_party
      - medicare_ledger.to_date
      - status
      note: The Part A days booked and reversed for the month, the payers billed its coinsurance, the latest ended coverage with its advance notice and a pending review decide the coinsurance day price, the days after Part A coverage and the months the partial-month rule settles.
    - category: bedhold
      as: history
      reads:
      - bedhold_ledger.day_count
      - bedhold_ledger.day_payer
      - bedhold_ledger.bedhold_reservation_id
      - resident_pays_all_held_days
      - leave_start_date
      - private_hold_start_date
      - end_date
      - status
      - return_date
      - release_date
      - end_reason
      note: The month's booked held days, the reservation they belong to with its tier and dates, and the resident's declined, released and ended reservations decide the privately paid held days and the days away with no bed held.
    - category: trust
      as: history
      reads:
      - conveyance_reason
      - conveyance_trigger_date
      - status
      note: A conveyance the resident's funds account started on a discharge or death marks a month the partial-month rule settles.
    compute:
    - month_index: MONTHS('2000-01-01', NOW) - 1
    - month_key: ('%d' % (2000 + month_index // 12)) + '-' + ('%02d' % (month_index % 12 + 1))
    - first_day: month_key + '-01'
    - next_first_day: ('%d' % (2000 + (month_index + 1) // 12)) + '-' + ('%02d' % ((month_index + 1) % 12 + 1)) + '-01'
    - actual_charge: SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_charge', charge_basis='actual_notice', service_month=month_key) - SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_adjustment', service_month=month_key)
    - calendar_days: DAYS(first_day, next_first_day)
    - daily_rate: F('ma_daily_rate')
    - full_coverage_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', day_band='days_1_20', service_month=month_key) - XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', day_band='days_1_20', service_month=month_key)
    - coinsurance_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', day_band='days_21_100', service_month=month_key) - XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', day_band='days_21_100', service_month=month_key)
    - lapsed_certification_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', adjustment_reason='uncertified_day', service_month=month_key)
    - booked_coinsurance_rate: XMAX('medicare', 'medicare_ledger', 'daily_coinsurance_rate', event_type='medicare_days_booked', day_band='days_21_100', service_month=month_key)
    - crossover_charge_rows: XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='medicaid_crossover', service_month=month_key)
    - private_share_rows: XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', service_month=month_key) + XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='medigap_carrier', service_month=month_key)
    - coinsurance_day_price: 0 if (private_share_rows > 0 and crossover_charge_rows == 0) else (daily_rate if (crossover_charge_rows > 0 and booked_coinsurance_rate > daily_rate) else booked_coinsurance_rate)
    - payer_held_rows: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', day_payer='payer_reserved', service_month=month_key)
    - private_held_rows: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', day_payer='resident_private', service_month=month_key)
    - payer_hold: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_reservation_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='payer_reserved', service_month=month_key)
    - private_hold: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_reservation_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='resident_private', service_month=month_key)
    - month_hold: private_hold or payer_hold
    - one_hold: payer_held_rows <= 1 and private_held_rows <= 1 and (payer_hold == None or private_hold == None or payer_hold == private_hold)
    - held_days_booked: XSUM('bedhold', 'bedhold_ledger', 'day_count', event_type='bedhold_day_booked', service_month=month_key)
    - hold_last_held: CFIELD('bedhold', 'end_date', bedhold_reservation_id=month_hold) or ''
    - hold_pays_all: CPARAM('bedhold', 'resident_pays_all_held_days', bedhold_reservation_id=month_hold) == True
    - hold_leave_start: CFIELD('bedhold', 'leave_start_date', bedhold_reservation_id=month_hold) or '9999-12-31'
    - hold_private_start: CFIELD('bedhold', 'private_hold_start_date', bedhold_reservation_id=month_hold) or ''
    - hold_end_offset: MN(DAYS(first_day, hold_last_held) + 1, calendar_days) if hold_last_held != '' else calendar_days
    - privately_held_start: hold_leave_start if (month_hold != None and hold_pays_all) else (hold_private_start if (month_hold != None and hold_private_start != '') else next_first_day)
    - privately_held_days: MX(0, hold_end_offset - MX(0, DAYS(first_day, privately_held_start)))
    - this_month_prefix: month_key + '-'
