    factors:
    - id: pending_coinsurance_day_price
      effect: parameter
      decides: coinsurance_day_price
      bindings:
      - crossover_charge_rows
      - private_share_rows
      - coinsurance_day_price
      ladder:
      - when: the month's coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer
        value: '0'
      - when: it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate
        value: F('ma_daily_rate')
      - when: otherwise
        value: the highest daily coinsurance booked for the month
      baseline:
        coinsurance_day_price: booked_coinsurance_rate
      evidence:
      - cross_category
      - history
      cross_difficulty: medicare
    - id: pending_privately_held_start
      effect: parameter
      decides: privately_held_start
      bindings:
      - hold_pays_all
      - hold_private_start
      - privately_held_start
      - privately_held_days
      ladder:
      - when: the reservation the month's booked held days belong to is a hold whose every held day is the resident's own charge (a private-pay hold or a hold during a Medicare skilled stay)
        value: its leave start date
      - when: it is a Medicaid reserved bed whose private extension has begun
        value: its private hold start date
      - when: otherwise (a Medicaid reserved bed with no private extension, or no held day booked)
        value: none (the first day of the next month)
      baseline:
        privately_held_start: next_first_day
      evidence:
      - cross_category
      - date
      cross_difficulty: bedhold
    - id: pending_declined_hold_days
      effect: method
      decides: declined_days_out
      bindings:
