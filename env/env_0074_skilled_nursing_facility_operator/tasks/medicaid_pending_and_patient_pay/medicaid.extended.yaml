events:
- type: medicaid_case_open
  target: medicaid_cases
  mutation: create
  meaning: The business office opens a Medical Assistance case to prepare an application.
  grain: one row per application case
  fields:
    customer_id: the resident
    variant_name: expected eligibility tier
    requested_eligibility_date: first day of the month eligibility is requested from
    monthly_gross_income: gross monthly income on the application
    health_insurance_premiums: monthly health insurance premiums the resident pays
    community_spouse_allowance: monthly community spouse allowance on the worksheet
    family_allowance: monthly dependent family allowance on the worksheet
    home_maintenance_allowance: monthly home maintenance allowance on the worksheet
  triggers: []
- type: medicaid_application_submitted
  target: medicaid_cases
  mutation:
    transition:
      from: application_preparing
      to: pending
  meaning: The signed application is submitted to the County Assistance Office.
  grain: one row per transaction
  fields:
    application_date: date submitted
    requested_eligibility_date: requested start of eligibility
  triggers: []
- type: medicaid_application_withdrawn
  target: medicaid_cases
  mutation:
    transition:
      from: application_preparing
      to: closed
  meaning: The resident or legal representative withdraws the application before submission.
  grain: one row per transaction
  fields:
    closed_date: withdrawal date
    close_reason: withdrawn
  triggers: []
- type: medicaid_eligibility_approved
  target: medicaid_cases
  mutation:
    transition:
      from: pending
      to: eligible
  meaning: The County Assistance Office approves eligibility.
  grain: one row per transaction
  fields:
    eligibility_start_date: first eligible day
    patient_pay_amount: monthly patient pay on the notice
    patient_pay_effective_date: date that patient pay applies from
    decision_notice_date: date of the notice
    transfer_penalty_end_date: last day of any transfer penalty period on the notice
    next_renewal_date: renewal due date
  triggers:
  - event: medicaid:medicaid_pending_settlement
    map:
      settlement_type: approved_ma_covered
- type: medicaid_eligibility_denied
  target: medicaid_cases
  mutation:
    transition:
      from: pending
      to: denied
  meaning: The County Assistance Office denies the application.
  grain: one row per transaction
  fields:
    decision_notice_date: date of the notice
    denial_reason: reason on the notice
  triggers: []
- type: medicaid_hearing_requested
  target: medicaid_cases
  mutation:
    transition:
      from: denied
      to: fair_hearing
  meaning: A fair hearing on the denial is requested by the resident or representative.
  grain: one row per transaction
  fields:
    hearing_request_date: date the request was made
  triggers: []
- type: medicaid_hearing_granted
  target: medicaid_cases
  mutation:
    transition:
      from: fair_hearing
      to: eligible
  meaning: The hearing decision grants eligibility.
  grain: one row per transaction
  fields:
    eligibility_start_date: first eligible day
    patient_pay_amount: monthly patient pay
    patient_pay_effective_date: effective date
    decision_notice_date: decision date
  triggers:
  - event: medicaid:medicaid_pending_settlement
    map:
      settlement_type: approved_ma_covered
- type: medicaid_hearing_upheld
  target: medicaid_cases
  mutation:
    transition:
      from: fair_hearing
      to: closed
  meaning: The hearing decision upholds the denial.
  grain: one row per transaction
  fields:
    decision_notice_date: decision date
    closed_date: closing date
    close_reason: denial_upheld
  triggers:
  - event: medicaid:medicaid_pending_settlement
    map:
      settlement_type: denied_moved_to_private
- type: medicaid_denied_close
  target: medicaid_cases
  mutation:
    transition:
      from: denied
      to: closed
  meaning: A denied case with no timely hearing request is closed.
  grain: one row per transaction
  fields:
    closed_date: closing date
    close_reason: denial_final
  triggers:
  - event: medicaid:medicaid_pending_settlement
    map:
      settlement_type: denied_moved_to_private
- type: medicaid_eligible_close
  target: medicaid_cases
  mutation:
    transition:
      from: eligible
      to: closed
  meaning: An eligible case ends by discharge, death or a closing notice.
  grain: one row per transaction
  fields:
    closed_date: closing date
    close_reason: discharged, deceased or eligibility_ended
  triggers: []
- type: medicaid_case_update
  target: medicaid_cases
  mutation: update
  meaning: A new County Assistance Office notice, rate letter or worksheet changes the case's figures or tier.
  grain: one row per transaction
  fields:
    variant_name: tier now in effect
    patient_pay_amount: new monthly patient pay
    patient_pay_effective_date: date it applies from
    ma_daily_rate: Medicaid daily rate in effect for the center
    monthly_gross_income: updated income
    health_insurance_premiums: updated premiums
    next_renewal_date: next renewal due date
    hospice_election_date: hospice election date, for hospice room and board
  triggers: []
- type: medicaid_patient_pay_charge
  target: medicaid_ledger
  meaning: Patient pay for one service month is billed (estimated while pending, actual once approved, or a reconciliation
    increase).
  grain: one row per service month and charge basis
  distinguish_by:
  - service_month
  - charge_basis
  fields:
    service_month: YYYY-MM
    charge_basis: estimated_pending, actual_notice, partial_month or trueup_increase
    day_count: days in the center that month (partial months)
    daily_rate: Medicaid daily rate used for a partial-month cap
    amount: patient pay billed (positive)
    entry_date: posting date
  account: patient_pay_receivable
  direction: in
  triggers: []
- type: medicaid_patient_pay_payment
  target: medicaid_ledger
  meaning: A patient pay payment is applied to one patient pay charge.
  grain: one row per receipt applied to one charge
  distinguish_by:
  - charge_entry_id
  - entry_date
  - payment_method
  fields:
    charge_entry_id: charge paid
    payment_method: check, money_order, ach, trust_transfer or rep_payee_transfer
    amount: amount applied (positive)
    entry_date: date received
  account: patient_pay_receivable
  direction: out
  triggers: []
- type: medicaid_patient_pay_adjustment
  target: medicaid_ledger
  meaning: 'A patient pay charge is reduced: reconciliation, redetermination, month not eligible, cost-of-care cap
    or billing error.'
  grain: one row per charge and reason
  distinguish_by:
  - charge_entry_id
  - adjustment_reason
  fields:
    charge_entry_id: charge reduced
    adjustment_reason: trueup_decrease, patient_pay_redetermined, not_eligible_month, cost_of_care_cap or billing_error
    amount: reduction (positive)
    entry_date: posting date
  account: patient_pay_receivable
  direction: out
  triggers: []
- type: medicaid_patient_pay_refund
  target: medicaid_ledger
  meaning: A patient pay credit balance is refunded.
  grain: one row per refund
  distinguish_by:
  - entry_date
  - refund_payee
  fields:
    refund_payee: resident, representative or estate
    amount: refund (positive)
    entry_date: issue date
  account: patient_pay_receivable
  direction: in
  triggers: []
- type: medicaid_pending_accrual
  target: medicaid_ledger
  meaning: Room and board for one pending service month accrues to the Medicaid-pending balance.
  grain: one row per service month
  distinguish_by:
  - service_month
  fields:
    service_month: YYYY-MM
    day_count: days in the center
    daily_rate: private daily rate of the occupied room
    amount: accrual (positive)
    entry_date: posting date
  account: pending_receivable
  direction: in
  triggers: []
- type: medicaid_pending_settlement
  target: medicaid_ledger
  meaning: A pending accrual is settled by the eligibility outcome.
  grain: one row per accrual and settlement type
  distinguish_by:
  - accrual_entry_id
  - settlement_type
  fields:
    accrual_entry_id: accrual settled
    settlement_type: approved_ma_covered, denied_moved_to_private or penalty_period_private
    amount: amount settled (positive)
    entry_date: posting date
  account: pending_receivable
  direction: out
  triggers: []
- type: medicaid_verification_forwarded
  target: medicaid_ledger
  meaning: A verification document is forwarded to the County Assistance Office.
  grain: one row per document type and forwarding date
  distinguish_by:
  - document_type
  - entry_date
  fields:
    document_type: type of document
    entry_date: date forwarded
  triggers: []
- type: medicaid_past_due_notice
  target: medicaid_ledger
  meaning: A written past-due patient pay notice is sent.
  grain: one row per charge noticed
  distinguish_by:
  - charge_entry_id
  fields:
    charge_entry_id: past-due charge
    entry_date: date sent
  triggers: []
measures:
- id: medicaid_msr_open_charge_balance
  window: the life of one patient pay charge, as of the posting date
  measure: amount of the named medicaid_patient_pay_charge minus medicaid_patient_pay_payment and medicaid_patient_pay_adjustment
    amounts naming it
- id: medicaid_msr_estimates_billed_for_month
  window: one service month of the case
  measure: sum of medicaid_patient_pay_charge amounts with charge_basis estimated_pending for that month minus medicaid_patient_pay_adjustment
    amounts naming those charges
policies:
- id: medicaid_agg_multi_holding
  subject:
  - medicaid_case_open
  rule: A resident may have successive Medical Assistance cases over time (a new application after a denial or after
    a closed eligibility), but only one case that is not closed at a time. A new case is opened only when every
    earlier case of the resident is closed.
  eligibility:
  - id: one_open_case
    applies_to:
    - medicaid_case_open
    kind: dedup
    condition: A new case is opened only when every earlier case of the resident is closed.
    evidence_fields:
    - medicaid_cases.customer_id
    - medicaid_cases.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_cases.customer_id
      action_bindings:
        medicaid_cases.customer_id: customer_id
    dedup_contract:
      table: medicaid_cases
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - application_preparing
        - pending
        - eligible
        - denied
        - fair_hearing
      distinct_fields: []
  params:
    max_per_customer: null
- id: medicaid_agg_case_balances
  subject:
  - medicaid_patient_pay_refund
  - medicaid_patient_pay_payment
  rule: 'Patient pay is settled across all of a resident''s cases: a credit balance on one case is applied to open
    patient pay on the resident''s other case, oldest service month first, before any of it is refunded, and only
    the remainder is refunded.'
  eligibility: []
  params:
    refund_days: =refund_days
- id: medicaid_application
  subject:
  - medicaid_case_open
  - medicaid_application_submitted
  - medicaid_application_withdrawn
  rule: 'The Medical Assistance application is the resident''s own: it is signed by the resident, an agent under
    power of attorney or a court-appointed guardian, and the center may act as authorized representative only after
    the resident or legal representative signs the designation. An application is submitted only after the resident
    or legal representative has signed it. Eligibility may be requested from the first day of a month up to the
    retroactive months before the application month when the resident already met the rules then. The requested
    eligibility date is no earlier than the first day of the month that falls the retroactive months before the
    application month. Transfers of assets made within the look-back months before the application date are reported
    on the application. An application still in preparation can be withdrawn only by the resident or legal representative,
    never by the center.'
  eligibility:
  - id: signed_application
    applies_to:
    - medicaid_application_submitted
    kind: authorization
    condition: An application is submitted only after the resident or legal representative has signed it.
    evidence_fields:
    - medicaid_requests.medicaid_case_id
    - medicaid_requests.request_type
    - medicaid_requests.signer_role
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_requests.medicaid_case_id
      action_bindings:
        medicaid_requests.medicaid_case_id: medicaid_case_id
  - id: retro_limit
    applies_to:
    - medicaid_application_submitted
    kind: authorization
    condition: The requested eligibility date is no earlier than the first day of the month that falls the retroactive
      months before the application month.
    evidence_fields:
    - medicaid_cases.medicaid_case_id
    - medicaid_cases.requested_eligibility_date
    - medicaid_cases.application_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_cases.medicaid_case_id
      action_bindings:
        medicaid_cases.medicaid_case_id: medicaid_case_id
  params:
    application_signers: =application_signers
    center_authorized_representative_allowed: =center_authorized_representative_allowed
    retroactive_months: =retroactive_months
    eligibility_start_rule: =eligibility_start_rule
    lookback_months: =lookback_months
    withdrawal_by: =withdrawal_by
- id: medicaid_evt_verification
  subject:
  - medicaid_verification_forwarded
  rule: The business office gathers the verification documents the County Assistance Office lists and forwards each
    one within the verification forward days of receiving it, counting business days Monday through Friday excluding
    center holidays; bank statements cover the whole look-back period. A clinical eligibility determination for
    nursing facility care must be on file before the case can be approved. A document type is forwarded once per
    forwarding date.
  eligibility: []
  params:
    verification_document_types: =verification_document_types
    verification_forward_days: =verification_forward_days
    lookback_months: =lookback_months
    level_of_care_assessment_required: =level_of_care_assessment_required
    application_processing_standard_days: =application_processing_standard_days
    disability_processing_standard_days: =disability_processing_standard_days
- id: medicaid_evt_pending_estimate
  subject:
  - medicaid_patient_pay_charge
  rule: 'While the application is pending, and while a denial is under a fair hearing, the resident pays an estimated
    patient pay each month: gross monthly income less the personal needs allowance, less health insurance premiums
    the resident pays, less the protected VA pension amount for the VA tier, and less the community spouse, dependent
    family or home maintenance allowance on the worksheet when the tier applies it, never below zero, rounded half
    up to the cent. Patient pay is billed only while the case is pending, eligible or fair_hearing. Estimated or
    actual patient pay for a month is due on the due day of that month. No late charge is ever assessed on patient
    pay.'
  eligibility:
  - id: billable_state
    applies_to:
    - medicaid_patient_pay_charge
    kind: state
    condition: Patient pay is billed only while the case is pending, eligible or fair_hearing.
    evidence_fields:
    - medicaid_cases.medicaid_case_id
    - medicaid_cases.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_cases.medicaid_case_id
      action_bindings:
        medicaid_cases.medicaid_case_id: medicaid_case_id
    state_contract:
      field: medicaid_cases.status
      allowed:
      - pending
      - eligible
      - fair_hearing
  params:
    per_tier:
      Medical Assistance Nursing Facility Care, Standard Patient Pay:
        va_pension_protected_monthly: =va_pension_protected_monthly
        community_spouse_allowance_applies: =community_spouse_allowance_applies
        family_allowance_applies: =family_allowance_applies
        home_maintenance_allowance_applies: =home_maintenance_allowance_applies
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Nursing Facility Care, Community Spouse Allowance:
        va_pension_protected_monthly: =va_pension_protected_monthly
        community_spouse_allowance_applies: =community_spouse_allowance_applies
        family_allowance_applies: =family_allowance_applies
        home_maintenance_allowance_applies: =home_maintenance_allowance_applies
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Nursing Facility Care, Dependent Family Allowance:
        va_pension_protected_monthly: =va_pension_protected_monthly
        community_spouse_allowance_applies: =community_spouse_allowance_applies
        family_allowance_applies: =family_allowance_applies
        home_maintenance_allowance_applies: =home_maintenance_allowance_applies
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Nursing Facility Care, VA Reduced Pension:
        va_pension_protected_monthly: =va_pension_protected_monthly
        community_spouse_allowance_applies: =community_spouse_allowance_applies
        family_allowance_applies: =family_allowance_applies
        home_maintenance_allowance_applies: =home_maintenance_allowance_applies
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Nursing Facility Care, Home Maintenance Allowance:
        va_pension_protected_monthly: =va_pension_protected_monthly
        community_spouse_allowance_applies: =community_spouse_allowance_applies
        family_allowance_applies: =family_allowance_applies
        home_maintenance_allowance_applies: =home_maintenance_allowance_applies
        home_maintenance_max_months: =home_maintenance_max_months
      Medical Assistance Hospice Room and Board:
        va_pension_protected_monthly: =va_pension_protected_monthly
        community_spouse_allowance_applies: =community_spouse_allowance_applies
        family_allowance_applies: =family_allowance_applies
        home_maintenance_allowance_applies: =home_maintenance_allowance_applies
        home_maintenance_max_months: =home_maintenance_max_months
    personal_needs_allowance_monthly: =personal_needs_allowance_monthly
    health_insurance_premium_deduction: =health_insurance_premium_deduction
    pending_estimate_basis: =pending_estimate_basis
    pending_estimate_due_day: =pending_estimate_due_day
    late_charge_on_patient_pay: =late_charge_on_patient_pay
    estimate_rounding: =estimate_rounding
  formula:
    allowances: (community_spouse_allowance if community_spouse_allowance_applies else 0) + (family_allowance if
      family_allowance_applies else 0) + (home_maintenance_allowance if home_maintenance_allowance_applies else
      0)
    estimated_patient_pay: max(0, round(monthly_gross_income - personal_needs_allowance_monthly - health_insurance_premiums
      - va_pension_protected_monthly - allowances, 2))
- id: medicaid_evt_patient_pay_actual
  subject:
  - medicaid_patient_pay_charge
  - medicaid_patient_pay_adjustment
  rule: 'Once eligibility is approved, each eligible month is billed the patient pay amount on the County Assistance
    Office notice in effect for that month, with charge basis actual_notice; a redetermined amount, including the
    January change from the Social Security cost-of-living increase, applies from the first day of the month the
    notice names. In a month of admission, discharge or death, patient pay is the lesser of the monthly patient
    pay and the days in the center times the Medicaid daily rate, with charge basis partial_month, and any amount
    already billed above that is reduced with reason cost_of_care_cap; patient pay never exceeds the month''s cost
    of care. Patient pay is unchanged for a month with Medicaid reserved bed days. Within the trueup days after
    the approval notice, every month billed as an estimate is reconciled: where the actual patient pay exceeds the
    estimates billed for the month, the difference is billed with charge basis trueup_increase, and where it is
    lower, the estimate is reduced by the difference with reason trueup_decrease. Estimates billed for months before
    the eligibility start date are reduced with reason not_eligible_month, because those months are private-pay
    months. For the hospice tier, patient pay collected is credited against the hospice''s room-and-board payment.
    The Medicaid payment plus patient pay is payment in full: a Medicaid resident is never charged for items or
    services the Medicaid per diem covers. A charge is reduced once per adjustment reason.'
  eligibility:
  - id: adjust_once
    applies_to:
    - medicaid_patient_pay_adjustment
    kind: dedup
    condition: A charge is reduced once per adjustment reason.
    evidence_fields:
    - medicaid_ledger.charge_entry_id
    - medicaid_ledger.adjustment_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_ledger.charge_entry_id
      action_bindings:
        medicaid_ledger.charge_entry_id: charge_entry_id
    dedup_contract:
      table: medicaid_ledger
      mode: separate_record
      object_bindings:
        charge_entry_id: charge_entry_id
        adjustment_reason: adjustment_reason
      duplicate_filters:
        event_type:
        - medicaid_patient_pay_adjustment
      distinct_fields: []
  params:
    per_tier:
      Medical Assistance Nursing Facility Care, Standard Patient Pay:
        hospice_room_board_pct_of_nf_rate: =hospice_room_board_pct_of_nf_rate
        hospice_patient_pay_credit: =hospice_patient_pay_credit
      Medical Assistance Nursing Facility Care, Community Spouse Allowance:
        hospice_room_board_pct_of_nf_rate: =hospice_room_board_pct_of_nf_rate
        hospice_patient_pay_credit: =hospice_patient_pay_credit
      Medical Assistance Nursing Facility Care, Dependent Family Allowance:
        hospice_room_board_pct_of_nf_rate: =hospice_room_board_pct_of_nf_rate
        hospice_patient_pay_credit: =hospice_patient_pay_credit
      Medical Assistance Nursing Facility Care, VA Reduced Pension:
        hospice_room_board_pct_of_nf_rate: =hospice_room_board_pct_of_nf_rate
        hospice_patient_pay_credit: =hospice_patient_pay_credit
      Medical Assistance Nursing Facility Care, Home Maintenance Allowance:
        hospice_room_board_pct_of_nf_rate: =hospice_room_board_pct_of_nf_rate
        hospice_patient_pay_credit: =hospice_patient_pay_credit
      Medical Assistance Hospice Room and Board:
        hospice_room_board_pct_of_nf_rate: =hospice_room_board_pct_of_nf_rate
        hospice_patient_pay_credit: =hospice_patient_pay_credit
    patient_pay_change_effective: =patient_pay_change_effective
    annual_cola_effective_month: =annual_cola_effective_month
    partial_month_basis: =partial_month_basis
    cost_of_care_cap: =cost_of_care_cap
    trueup_days: =trueup_days
    trueup_basis: =trueup_basis
    bed_hold_patient_pay_unchanged: =bed_hold_patient_pay_unchanged
    ma_payment_in_full: =ma_payment_in_full
    covered_item_resident_charge_allowed: =covered_item_resident_charge_allowed
    patient_pay_collected_by: =patient_pay_collected_by
  formula:
    partial_month_patient_pay: min(patient_pay_amount, round(day_count * daily_rate, 2))
    trueup_difference: patient_pay_amount - medicaid_msr_estimates_billed_for_month
  measures:
  - medicaid_msr_estimates_billed_for_month
- id: medicaid_evt_pending_balance
  subject:
  - medicaid_pending_accrual
  - medicaid_pending_settlement
  rule: 'For each month a case is pending, the room and board the resident would owe privately accrues to the Medicaid-pending
    balance: the days in the center times the private daily rate of the occupied room under the private pay schedule.
    A pending accrual is posted only while the case is pending, denied or fair_hearing. The pending balance is never
    billed to the resident while the outcome is open: it carries no late charge, is never sent to collections and
    is never a ground for a nonpayment discharge. When eligibility is approved, accruals for days on or after the
    eligibility start date and after the end of any transfer penalty period settle as approved_ma_covered and are
    never billed to the resident; accruals for days before the eligibility start date settle as denied_moved_to_private,
    and days inside a transfer penalty period settle as penalty_period_private, because the resident owes the private
    rate for them. When the denial becomes final, every open accrual settles as denied_moved_to_private and is billed
    under the private-pay agreement. An accrual is settled once per settlement type.'
  eligibility:
  - id: accrual_state
    applies_to:
    - medicaid_pending_accrual
    kind: state
    condition: A pending accrual is posted only while the case is pending, denied or fair_hearing.
    evidence_fields:
    - medicaid_cases.medicaid_case_id
    - medicaid_cases.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_cases.medicaid_case_id
      action_bindings:
        medicaid_cases.medicaid_case_id: medicaid_case_id
    state_contract:
      field: medicaid_cases.status
      allowed:
      - pending
      - denied
      - fair_hearing
  - id: settle_once
    applies_to:
    - medicaid_pending_settlement
    kind: dedup
    condition: An accrual is settled once per settlement type.
    evidence_fields:
    - medicaid_ledger.accrual_entry_id
    - medicaid_ledger.settlement_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_ledger.accrual_entry_id
      action_bindings:
        medicaid_ledger.accrual_entry_id: accrual_entry_id
    dedup_contract:
      table: medicaid_ledger
      mode: separate_record
      object_bindings:
        accrual_entry_id: accrual_entry_id
        settlement_type: settlement_type
      duplicate_filters:
        event_type:
        - medicaid_pending_settlement
      distinct_fields: []
  params:
    pending_accrual_rate_basis: =pending_accrual_rate_basis
    pending_accrual_cycle: =pending_accrual_cycle
    pending_collection_hold: =pending_collection_hold
    transfer_penalty_private_liability: =transfer_penalty_private_liability
    penalty_period_start_rule: =penalty_period_start_rule
  formula:
    accrual_amount: round(day_count * daily_rate, 2)
- id: medicaid_evt_payments
  subject:
  - medicaid_patient_pay_payment
  - medicaid_patient_pay_refund
  - medicaid_past_due_notice
  rule: A patient pay payment names the charge it pays and is applied only up to that charge's open balance; an
    unallocated payment is applied oldest service month first. Patient pay is accepted by the listed methods; a
    transfer from the resident's trust account is posted only on the resident's authorization recorded with the
    trust account, and where the center is the resident's representative payee, patient pay is transferred on the
    representative payee transfer day each month. A written past-due notice is sent once for a charge still unpaid
    the past-due notice days after its due date. A patient pay credit balance is refunded within the refund days,
    to the resident or representative, or to the estate after a death.
  eligibility:
  - id: notice_once
    applies_to:
    - medicaid_past_due_notice
    kind: dedup
    condition: A written past-due notice is sent once for a charge still unpaid the past-due notice days after its
      due date.
    evidence_fields:
    - medicaid_ledger.charge_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_ledger.charge_entry_id
      action_bindings:
        medicaid_ledger.charge_entry_id: charge_entry_id
    dedup_contract:
      table: medicaid_ledger
      mode: separate_record
      object_bindings:
        charge_entry_id: charge_entry_id
      duplicate_filters:
        event_type:
        - medicaid_past_due_notice
      distinct_fields: []
  params:
    accepted_payment_methods: =accepted_payment_methods
    rep_payee_transfer_day: =rep_payee_transfer_day
    past_due_notice_days: =past_due_notice_days
    refund_days: =refund_days
    refund_payee_on_death: =refund_payee_on_death
  formula:
    applied_amount: min(amount, medicaid_msr_open_charge_balance)
  measures:
  - medicaid_msr_open_charge_balance
- id: medicaid_eligibility_decision
  subject:
  - medicaid_eligibility_approved
  - medicaid_eligibility_denied
  - medicaid_hearing_requested
  - medicaid_hearing_granted
  - medicaid_hearing_upheld
  - medicaid_denied_close
  rule: 'Eligibility decisions are the County Assistance Office''s and are recorded exactly as the notice states:
    eligibility start date, patient pay, effective date, any transfer penalty period and the next renewal date.
    Only the resident or legal representative can request a fair hearing on a denial; the center records the request
    but never files it. A fair hearing request is accepted as timely only when it is made no later than the fair
    hearing request days after the decision notice date, counted in calendar days with the day after the notice
    date as day 1. A denied case is closed only after the hearing window has run out without a timely request. A
    hearing decision that grants eligibility is recorded like an approval; one that upholds the denial closes the
    case.'
  eligibility:
  - id: hearing_timely
    applies_to:
    - medicaid_hearing_requested
    kind: time
    condition: A fair hearing request is accepted as timely only when it is made no later than the fair hearing
      request days after the decision notice date, counted in calendar days with the day after the notice date as
      day 1.
    evidence_fields:
    - medicaid_cases.medicaid_case_id
    - medicaid_cases.decision_notice_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicaid_cases.medicaid_case_id
      action_bindings:
