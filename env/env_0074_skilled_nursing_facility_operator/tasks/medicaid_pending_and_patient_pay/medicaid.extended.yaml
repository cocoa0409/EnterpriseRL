      baseline:
        days_outside_stay: '0'
      evidence:
      - date
    baseline:
      rule: The review covers the calendar month before the current month on a case that is pending, and the case's patient pay charge with charge basis estimated_pending for that service month; the estimate for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed, or the case is not in status pending, the reduction is zero. The cost of care a pending estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them. The reduction for a pending estimate month is the estimate for the month less that cost of care, never below zero, rounded half up to the cent, and it is posted against that estimate with reason cost_of_care_cap.
      params:
      - cost_of_care_cap
      - pending_estimate_basis
    inputs:
      history:
      - table: medicaid_ledger
        aggregate: sum
        field: amount
        filters:
          event_type: medicaid_patient_pay_charge
          charge_basis: estimated_pending
      - table: medicaid_ledger
        aggregate: sum
        field: amount
        filters:
          event_type: medicaid_patient_pay_adjustment
      - category: medicare
        table: medicare_ledger
        aggregate: sum
        field: day_count
        filters:
          event_type: medicare_days_booked
      - category: bedhold
        table: bedhold_ledger
        aggregate: sum
        field: day_count
        filters:
          event_type: bedhold_day_booked
      - table: medicaid_ledger
        aggregate: sum
        field: day_count
        filters:
          event_type: medicaid_pending_accrual
      cross_category:
      - medicare
      - bedhold
  - id: medicaid_ext_pending_advance_payment
    base_policy_refs:
    - medicaid_evt_payments
    - medicaid_agg_case_balances
    - medicaid_evt_pending_estimate
    overwrite:
    - base_policy: medicaid_evt_pending_estimate
      superseded_clause: gross monthly income less the personal needs allowance, less health insurance premiums the resident pays, less the protected VA pension amount for the VA tier, and less the community spouse, dependent family or home maintenance allowance on the worksheet when the tier applies it, never below zero, rounded half up to the cent.
      replaced_by: 'For an advance toward a coming pending month, and only for such an advance, the estimated patient pay is the base estimate figure as the schedules below change it; every estimate the business office bills remains under the base rule: gross monthly income less the personal needs allowance, less health insurance premiums the resident pays, less the protected VA pension amount for the VA tier, and less the community spouse, dependent family or home maintenance allowance on the worksheet when the tier applies it, never below zero, rounded half up to the cent.'
    - base_policy: medicaid_evt_payments
      superseded_clause: A patient pay credit balance is refunded within the refund days, to the resident or representative, or to the estate after a death.
      replaced_by: A patient pay credit balance is refunded within the refund days, to the resident or representative, or to the estate after a death; when the representative of a pending case pays toward the coming month while a credit that arose from a reduction posted within the refund days stands on the case, that credit is instead applied to the coming month up to the base estimate figure, and only for such a payment; a payment toward a coming month on an approved case takes the rule for approved cases, and every other credit balance is refunded under the base rule.
    trigger: on_request
    subject:
    - medicaid_patient_pay_payment
    computes: amount
    target_tool: pay_pending_patient_pay_advance_fe3c809e
    params:
      coinsurance_2026: 217.0
      coinsurance_2025: 209.5
      part_b_standard_premium: 202.9
    rule: 'While an application is pending, a resident or representative may pay toward the coming month''s estimated patient pay; the advance under this rule is figured for a case in status pending, and for a case in any other status it is nothing, and a figure the case does not record counts as zero; where two records share the latest date a schedule reads by, the one posted first is read; the payment is posted as a patient pay payment by ACH that names no charge, and it is applied, oldest service month first, when the coming month''s estimate is billed. The advance toward a coming pending month is the estimated patient pay that month will carry, never below zero, rounded half up to the cent. The estimated patient pay a coming pending month will carry is worked out with the base estimate rule from the case''s figures: gross monthly income less the personal needs allowance, less the health insurance premiums on the case, less the protected VA pension amount for the VA tier, and less the community spouse, dependent family or home maintenance allowance on the worksheet when the case''s tier applies it, a home maintenance allowance only while the coming month falls within the home maintenance maximum months counted from the requested eligibility month (from the coming month where no requested eligibility date is recorded), never below zero. The advance toward a coming pending month is worked out only after the estimate of the last closed month stands at no more than that month''s cost of care. For an advance toward a coming pending month, and only for such an advance, the estimated patient pay is the base estimate figure as the schedules below change it; every estimate the business office bills remains under the base rule: gross monthly income less the personal needs allowance, less health insurance premiums the resident pays, less the protected VA pension amount for the VA tier, and less the community spouse, dependent family or home maintenance allowance on the worksheet when the tier applies it, never below zero, rounded half up to the cent. A patient pay credit balance is refunded within the refund days, to the resident or representative, or to the estate after a death; when the representative of a pending case pays toward the coming month while a credit that arose from a reduction posted within the refund days stands on the case, that credit is instead applied to the coming month up to the base estimate figure, and only for such a payment; a payment toward a coming month on an approved case takes the rule for approved cases, and every other credit balance is refunded under the base rule. The resident''s Medicare coverage is the resident''s coverage in status active, and the resident''s funds account is the resident''s account in status active. Each schedule below sets or changes one figure of that standard for the cases it names and says where that figure enters: figures entering the estimate change it before its floor at zero, and figures entering the advance are subtracted from or added to the estimate after that floor; the advance is never below zero and is rounded half up to the cent. The resident''s own Medicare coinsurance deducted from a coming pending month''s estimate, read from the resident''s Medicare coverage: where the benefit days past the twentieth left at the start of the coming month are at least the coming month''s days, every day of the coming month; where some but fewer are left, only the days left; in either case those days are priced at the Medicare daily skilled nursing coinsurance of the coming month''s calendar year (the 2026 figure for a 2026 month, the 2025 figure for a 2025 month, and otherwise the daily coinsurance most recently booked on that coverage, nothing where none was booked) times the resident share percent of that coverage''s cost-sharing tier divided by 100, rounded half up to the cent; otherwise, including a coverage no longer active, nothing. The benefit days past the twentieth left at the start of the coming month are 100 less the larger of 20 and the total of the benefit days already used in the benefit period (the coverage''s prior skilled nursing days in the period, none where not recorded, plus its covered days used) and the days from the first day of the current month to the first day of the coming month, never below zero. The premiums counted in a coming pending month''s estimate: where the resident''s Medicare coverage is verified for Qualified Medicare Beneficiary status, the premiums on the case less the Medicare Part B standard premium, which the state then pays; where that coverage is not verified for that status and no health insurance card has yet been forwarded to the County Assistance Office for the case, only the Medicare Part B standard premium, which Social Security withholds; otherwise the premiums on the case. The interest counted as income in a coming pending month''s estimate: where interest was credited to the resident''s funds account within the last month, the latest interest credit; where interest was credited within the last three months but not within the last month, one third of the interest credited in those three months, rounded half up to the cent; otherwise none. The funds subtracted from an advance toward a coming pending month, read from the resident''s funds account: where the account is a non-Medicaid self-directed or guardianship account carrying a standing authorization for Medicaid patient pay and a pension was deposited into it within the last two months, the latest pension deposit; where the account is a non-Medicaid representative payee account and a Social Security benefit was received as payee within the last two months, the latest benefit received less the personal needs allowance, never below zero, which the payee leaves for the resident''s personal needs; otherwise nothing. The pending case balance added to an advance on a pending case: where the case''s patient pay balance is owed, that balance is added, since the payment is applied to the open months first; where the balance is a credit and a reduction was posted on the case within the refund days, the credit is subtracted, but never more than the base estimate figure; otherwise, including a credit with no reduction posted within the refund days, which is owed back as a refund, nothing is carried. The pending case''s patient pay balance is the patient pay charges and refunds on the case less the payments and reductions posted to it.'
    prerequisite:
    - problem: medicaid_ext_pending_estimate_cost_cap
      kind: value_input
      gate: pending_balance_carried
      form: state
      policy_source: The advance toward a coming pending month is worked out only after the estimate of the last closed month stands at no more than that month's cost of care.
      condition: The estimated_pending charge of the calendar month before the current month carries a cost_of_care_cap reduction bringing it down to the month's cost of care, wherever that cost is below the estimate.
      resolved_by: post_pending_cost_of_care_reduction_7ee4a52a
      effect: The cost-of-care reduction lowers the pending case's patient pay balance by the reduction amount, which changes the pending case balance carried into the advance by the same amount.
    cross_category:
    - category: medicare
      as: branch
      reads:
      - covered_days_used
      - prior_snf_days_in_period
      - qmb_status
      - status
      - resident_coinsurance_share_pct
      - medicare_ledger.daily_coinsurance_rate
      note: The active coverage's days used, tier share and QMB verification decide the coinsurance deducted and the premiums counted.
    - category: trust
      as: history
      reads:
      - variant_name
      - standing_authorization
      - trust_ledger.amount
      - trust_ledger.deposit_source
      - trust_ledger.event_type
      note: Interest credits decide the interest counted; the account tier, its standing authorization and its deposits decide the funds applied.
    compute:
    - now_index: MONTHS('2000-01-01', NOW)
    - current_first_day: ('%d' % (2000 + now_index // 12)) + '-' + ('%02d' % (now_index % 12 + 1)) + '-01'
    - coming_first_day: ('%d' % (2000 + (now_index + 1) // 12)) + '-' + ('%02d' % ((now_index + 1) % 12 + 1)) + '-01'
    - case_income: F('monthly_gross_income') or 0
    - case_premiums: F('health_insurance_premiums') or 0
    - allowance_months_run: MONTHS(F('requested_eligibility_date') or coming_first_day, coming_first_day)
    - tier_allowance: (F('home_maintenance_allowance') or 0) if (F('variant_name') == 'Medical Assistance Nursing Facility Care, Home Maintenance Allowance' and allowance_months_run < P('home_maintenance_max_months')) else ((F('community_spouse_allowance') or 0) if F('variant_name') == 'Medical Assistance Nursing Facility Care, Community Spouse Allowance' else ((F('family_allowance') or 0) if F('variant_name') == 'Medical Assistance Nursing Facility Care, Dependent Family Allowance' else 0))
    - coming_month_days: DAYS(coming_first_day, ('%d' % (2000 + (now_index + 2) // 12)) + '-' + ('%02d' % ((now_index + 2) % 12 + 1)) + '-01')
    - active_coverage: CFIELD('medicare', 'medicare_coverage_id', status='active')
    - active_days_used: (CFIELD('medicare', 'covered_days_used', medicare_coverage_id=active_coverage) + (CFIELD('medicare', 'prior_snf_days_in_period', medicare_coverage_id=active_coverage) or 0)) if CFIELD('medicare', 'covered_days_used', medicare_coverage_id=active_coverage) != None else None
    - coinsurance_days_left: MX(0, 100 - MX(20, (active_days_used or 0) + DAYS(current_first_day, coming_first_day))) if active_days_used != None else 0
    - latest_booked_coinsurance: XLATEST('medicare', 'medicare_ledger', 'daily_coinsurance_rate', date_field='entry_date', event_type='medicare_days_booked', day_band='days_21_100', medicare_coverage_id=active_coverage) or 0
    - coming_year: 2000 + (now_index + 1) // 12
    - coming_coinsurance_rate: K('coinsurance_2026') if coming_year == 2026 else (K('coinsurance_2025') if coming_year == 2025 else latest_booked_coinsurance)
    - active_share_pct: CPARAM('medicare', 'resident_coinsurance_share_pct', medicare_coverage_id=active_coverage) or 0
    - projected_coinsurance: RND(coming_month_days * coming_coinsurance_rate * active_share_pct / 100 + 0.000000001, 2) if coinsurance_days_left >= coming_month_days else (RND(coinsurance_days_left * coming_coinsurance_rate * active_share_pct / 100 + 0.000000001, 2) if coinsurance_days_left > 0 else 0)
    - active_qmb: CFIELD('medicare', 'qmb_status', medicare_coverage_id=active_coverage)
    - card_forwarded: COUNT('medicaid_ledger', event_type='medicaid_verification_forwarded', document_type='health_insurance_card')
    - premiums_counted: (case_premiums - K('part_b_standard_premium')) if active_qmb == True else (K('part_b_standard_premium') if (active_qmb == False and card_forwarded == 0) else case_premiums)
    - interest_last_month: XCOUNT('trust', 'trust_ledger', within_months=1, date_field='entry_date', event_type='trust_interest_credit')
    - interest_three_months: XSUM('trust', 'trust_ledger', 'amount', within_months=3, date_field='entry_date', event_type='trust_interest_credit')
    - latest_interest: XLATEST('trust', 'trust_ledger', 'amount', date_field='entry_date', event_type='trust_interest_credit') or 0
    - interest_counted: latest_interest if interest_last_month > 0 else (RND(interest_three_months / 3 + 0.000000001, 2) if interest_three_months > 0 else 0)
    - pending_estimate: MX(0, case_income + interest_counted - P('personal_needs_allowance_monthly') - premiums_counted - P('va_pension_protected_monthly') - tier_allowance - projected_coinsurance)
    - funds_tier: CFIELD('trust', 'variant_name', status='active')
    - funds_authorization: CFIELD('trust', 'standing_authorization', status='active')
    - pension_recent: XCOUNT('trust', 'trust_ledger', within_months=2, date_field='entry_date', event_type='trust_deposit', deposit_source='pension_direct_deposit')
    - latest_pension: XLATEST('trust', 'trust_ledger', 'amount', date_field='entry_date', event_type='trust_deposit', deposit_source='pension_direct_deposit') or 0
    - payee_recent: XCOUNT('trust', 'trust_ledger', within_months=2, date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee')
    - latest_payee: XLATEST('trust', 'trust_ledger', 'amount', date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee') or 0
    - funds_applied: latest_pension if ((funds_tier == 'Resident Funds Account, Non-Medicaid Self-Directed' or funds_tier == 'Resident Funds Account, Non-Medicaid Guardianship') and funds_authorization == 'medicaid_patient_pay' and pension_recent > 0) else (MX(0, latest_payee - P('personal_needs_allowance_monthly')) if (funds_tier == 'Resident Funds Account, Non-Medicaid Representative Payee' and payee_recent > 0) else 0)
    - base_estimate: MX(0, case_income - P('personal_needs_allowance_monthly') - case_premiums - P('va_pension_protected_monthly') - tier_allowance)
    - case_balance: SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_charge') + SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_refund') - SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_payment') - SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_adjustment')
    - latest_reduction_on: LATEST('medicaid_ledger', 'entry_date', date_field='entry_date', event_type='medicaid_patient_pay_adjustment') or '0000-00-00'
    - pending_balance_carried: case_balance if case_balance > 0 else ((0 - MN(0 - case_balance, base_estimate)) if (case_balance < 0 and latest_reduction_on != '0000-00-00' and DAYS(latest_reduction_on, NOW) <= P('refund_days')) else 0)
    - result: 0 if F('status') != 'pending' else RND(MX(0, pending_estimate - funds_applied + pending_balance_carried) + 0.000000001, 2)
