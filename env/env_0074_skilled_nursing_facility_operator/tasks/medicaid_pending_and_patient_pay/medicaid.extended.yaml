      case_balance: The pending case's patient pay balance is the patient pay charges and refunds on the case less the payments and reductions posted to it.
      latest_reduction_on: where the balance is a credit and a reduction was posted on the case within the refund days, the credit is subtracted, but never more than the base estimate figure;
      pending_balance_carried: 'The pending case balance added to an advance on a pending case: where the case''s patient pay balance is owed, that balance is added, since the payment is applied to the open months first; where the balance is a credit and a reduction was posted on the case within the refund days, the credit is subtracted, but never more than the base estimate figure; otherwise, including a credit with no reduction posted within the refund days, which is owed back as a refund, nothing is carried. The pending case''s patient pay balance is the patient pay charges and refunds on the case less the payments and reductions posted to it.'
      result: 'The resident''s Medicare coverage is the resident''s coverage in status active, and the resident''s funds account is the resident''s account in status active. Each schedule below sets or changes one figure of that standard for the cases it names and says where that figure enters: figures entering the estimate change it before its floor at zero, and figures entering the advance are subtracted from or added to the estimate after that floor; the advance is never below zero and is rounded half up to the cent.'
      active_coverage: The resident's Medicare coverage is the resident's coverage in status active, and the resident's funds account is the resident's account in status active.
      base_estimate: 'The estimated patient pay a coming pending month will carry is worked out with the base estimate rule from the case''s figures:'
    factors:
    - id: pending_projected_coinsurance
      effect: method
      decides: projected_coinsurance
      bindings:
      - coming_month_days
      - active_days_used
      - coinsurance_days_left
      - coming_year
      - coming_coinsurance_rate
      - active_share_pct
      - projected_coinsurance
      ladder:
      - when: the active Medicare coverage has at least the coming month's days of benefit days past the twentieth left
        method: every day of the coming month is priced at the year's daily coinsurance times the tier's resident share percent
      - when: it has some but fewer benefit days past the twentieth left
        method: only the days left are priced that way
      - when: otherwise (no active coverage, or no such days left)
        method: no coinsurance is deducted
      baseline:
        projected_coinsurance: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: medicare
    - id: pending_premiums_counted
      effect: parameter
      decides: premiums_counted
      bindings:
      - active_qmb
      - card_forwarded
      - premiums_counted
      ladder:
      - when: the active Medicare coverage is verified for Qualified Medicare Beneficiary status
        value: the premiums on the case less K('part_b_standard_premium')
      - when: the active Medicare coverage is not so verified and no health insurance card has been forwarded to the County Assistance Office for the case
        value: K('part_b_standard_premium')
      - when: otherwise
        value: F('health_insurance_premiums')
      baseline:
        premiums_counted: case_premiums
      evidence:
      - cross_category
      - history
      cross_difficulty: medicare
    - id: pending_interest_counted
      effect: parameter
      decides: interest_counted
      bindings:
      - interest_last_month
      - interest_three_months
      - latest_interest
      - interest_counted
      ladder:
      - when: interest was credited to the resident's funds account within the last month
        value: the latest interest credit
      - when: interest was credited within the last three months but not within the last month
        value: one third of the interest credited in those three months
      - when: otherwise
        value: '0'
      baseline:
        interest_counted: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: trust
    - id: pending_funds_applied
      effect: parameter
      decides: funds_applied
      bindings:
      - pension_recent
      - latest_pension
      - payee_recent
      - latest_payee
      - funds_applied
      ladder:
      - when: a non-Medicaid self-directed or guardianship funds account with a standing authorization for Medicaid patient pay and a pension deposited within the last two months
        value: the latest pension deposit
      - when: a non-Medicaid representative payee funds account with a Social Security benefit received as payee within the last two months
        value: the latest benefit received less P('personal_needs_allowance_monthly'), never below zero
      - when: otherwise
        value: '0'
      baseline:
        funds_applied: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: trust
    - id: pending_balance_carried_in
      effect: method
      decides: pending_balance_carried
      bindings:
      - case_balance
      - latest_reduction_on
      - pending_balance_carried
      ladder:
      - when: the pending case's patient pay balance is owed
        method: the owed balance is added
      - when: the balance is a credit and a reduction was posted on the case within the refund days
        method: the credit is subtracted, capped at the base estimate figure
      - when: otherwise (no balance, or a credit with no reduction within the refund days, owed back as a refund)
        method: nothing is carried
      baseline:
        pending_balance_carried: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: 'The advance toward a coming pending month is the estimated patient pay that month will carry, never below zero, rounded half up to the cent. The estimated patient pay a coming pending month will carry is worked out with the base estimate rule from the case''s figures: gross monthly income less the personal needs allowance, less the health insurance premiums on the case, less the protected VA pension amount for the VA tier, and less the community spouse, dependent family or home maintenance allowance on the worksheet when the case''s tier applies it, a home maintenance allowance only while the coming month falls within the home maintenance maximum months counted from the requested eligibility month (from the coming month where no requested eligibility date is recorded), never below zero.'
      params:
      - personal_needs_allowance_monthly
      - pending_estimate_basis
      - home_maintenance_max_months
    inputs:
      history:
      - table: medicaid_ledger
        aggregate: count
        field: document_type
        filters:
          event_type: medicaid_verification_forwarded
          document_type: health_insurance_card
      - table: medicaid_ledger
        aggregate: sum
        field: amount
        filters:
          event_type: medicaid_patient_pay_payment
      - category: trust
        table: trust_ledger
        aggregate: sum
        field: amount
        within_months: 3
        filters:
          event_type: trust_interest_credit
      - category: trust
        table: trust_ledger
        aggregate: latest
        field: amount
        filters:
          event_type: trust_deposit
          deposit_source: pension_direct_deposit
      cross_category:
      - medicare
      - trust
