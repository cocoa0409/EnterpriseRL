      - released_days_out
      ladder:
      - when: the resident's latest released reservation and latest private hold that ended unpaid or at its maximum both fall in part inside the month
        method: the days after the release and the days after that private hold's last held day, each up to the day before its return, are both taken out
      - when: only that released reservation does
        method: the days after the release up to the day before its return (to the month's end where the resident has not come back) are taken out
      - when: only that private hold does
