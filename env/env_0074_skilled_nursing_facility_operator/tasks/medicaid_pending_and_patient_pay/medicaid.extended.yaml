    compute_basis:
      month_index: The review covers the calendar month before the current month and the case's patient pay charge with charge basis actual_notice for that service month; the actual charge for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed the reduction is zero.
      month_key: The review covers the calendar month before the current month and the case's patient pay charge with charge basis actual_notice for that service month; the actual charge for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed the reduction is zero.
      first_day: The review covers the calendar month before the current month and the case's patient pay charge with charge basis actual_notice for that service month; the actual charge for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed the reduction is zero.
      next_first_day: The review covers the calendar month before the current month and the case's patient pay charge with charge basis actual_notice for that service month; the actual charge for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed the reduction is zero.
      actual_charge: The review covers the calendar month before the current month and the case's patient pay charge with charge basis actual_notice for that service month; the actual charge for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed the reduction is zero.
      calendar_days: The cost of care an actual-billed month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, the days the resident was away with no bed held carry no cost (for every bed-hold reservation of the resident in status declined, from its leave start, in status released, from the day after its release, and in status expired, from the day after its last held day, each up to the day before its return, or to the month's end where the resident has not come back, never fewer than zero in all), and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them.
