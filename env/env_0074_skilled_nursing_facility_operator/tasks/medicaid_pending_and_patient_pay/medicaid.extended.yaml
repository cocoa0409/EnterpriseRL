      crossover_charge_rows: 'The price of a Part A coinsurance day in a reconciled estimate month follows who is billed the coinsurance for the month: where the month''s coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer, nothing, since the Medigap plan and the resident bear that coinsurance and the Medicare billing record charges it to them; where it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate, the Medicaid daily rate, since the program''s crossover payment for a day never exceeds what it pays for a Medicaid day; otherwise the highest daily coinsurance booked for the month.'
