    factors:
    - id: actual_coinsurance_day_price
      effect: parameter
      decides: coinsurance_day_price
      bindings:
      - crossover_charge_rows
      - private_share_rows
      - coinsurance_day_price
      ladder:
      - when: the month's coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer
        value: '0'
      - when: it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate
        value: F('ma_daily_rate')
      - when: otherwise
        value: the highest daily coinsurance booked for the month
      baseline:
        coinsurance_day_price: booked_coinsurance_rate
      evidence:
      - cross_category
      - history
      cross_difficulty: medicare
    - id: actual_hospice_share_start
      effect: parameter
      decides: hospice_share_start
      bindings:
      - on_hospice_tier
      - hospice_share_start
      - hospice_share_days
      ladder:
      - when: the case is on the Medical Assistance Hospice Room and Board tier and the hospice was elected before the month began
        value: the month's first day
      - when: the case is on that tier and the hospice election date falls inside the month
        value: the hospice election date
      - when: otherwise
        value: none (the first day of the next month)
      baseline:
        hospice_share_start: next_first_day
      evidence:
      - date
    - id: actual_days_after_coverage
      effect: method
      decides: days_after_coverage_out
      bindings:
      - resident_pays_after
      - review_pending
      - days_after_coverage_out
      ladder:
      - when: the coverage with the latest last covered date ended inside the month and the latest Skilled Nursing Facility Advance Beneficiary Notice on it has option 1 or option 2 chosen
        method: the days of the month from the first non-covered date it names, up to the day before a hospice election inside the month, are taken out
      - when: the resident's coverage in status under_appeal has its last covered date before the month's end
        method: the days of the month after that last covered date, up to the day before a hospice election inside the month, are taken out
      - when: otherwise (option 3, no advance notice, or no coverage ending)
        method: no day is taken out
      baseline:
        days_after_coverage_out: '0'
      evidence:
      - date
    - id: actual_privately_held_start
      effect: parameter
      decides: privately_held_start
      bindings:
      - hold_pays_all
      - hold_private_start
      - privately_held_start
      - privately_held_days
      ladder:
      - when: the reservation the month's booked held days belong to is a hold whose every held day is the resident's own charge (a private-pay hold or a hold during a Medicare skilled stay)
        value: its leave start date
      - when: it is a Medicaid reserved bed whose private extension has begun
        value: its private hold start date
      - when: otherwise (a Medicaid reserved bed with no private extension, or no held day booked)
        value: none (the first day of the next month)
      baseline:
        privately_held_start: next_first_day
      evidence:
      - cross_category
      - date
      cross_difficulty: bedhold
    baseline:
      rule: The review covers the calendar month before the current month and the case's patient pay charge with charge basis actual_notice for that service month; the actual charge for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed the reduction is zero. The cost of care an actual-billed month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, the days the resident was away with no bed held carry no cost (for every bed-hold reservation of the resident in status declined, from its leave start, in status released, from the day after its release, and in status expired, from the day after its last held day, each up to the day before its return, or to the month's end where the resident has not come back, never fewer than zero in all), and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them. The reduction for an actual-billed month is the actual charge for the month less that cost of care, never below zero, rounded half up to the cent, and it is posted against that charge with reason cost_of_care_cap.
      params:
      - cost_of_care_cap
    inputs:
      history:
      - table: medicaid_ledger
        aggregate: sum
        field: amount
        filters:
          event_type: medicaid_patient_pay_charge
          charge_basis: actual_notice
      - table: medicaid_ledger
        aggregate: sum
        field: amount
        filters:
          event_type: medicaid_patient_pay_adjustment
      - category: medicare
        table: medicare_ledger
        aggregate: sum
        field: day_count
        filters:
          event_type: medicare_days_booked
      - category: bedhold
        table: bedhold_ledger
        aggregate: sum
        field: day_count
        filters:
          event_type: bedhold_day_booked
      - table: medicaid_ledger
        aggregate: count
        filters:
          event_type: medicaid_patient_pay_charge
          charge_basis: partial_month
      cross_category:
      - medicare
      - bedhold
      - trust
  - id: medicaid_ext_estimate_month_trueup
    base_policy_refs:
    - medicaid_evt_patient_pay_actual
    - medicaid_evt_pending_estimate
    - medicaid_case_maintenance
    overwrite:
    - base_policy: medicaid_evt_patient_pay_actual
      superseded_clause: where it is lower, the estimate is reduced by the difference with reason trueup_decrease.
      replaced_by: 'Where the actual patient pay of the month is lower than the estimates billed for it, the estimate is reduced by the difference with reason trueup_decrease, the actual patient pay of a reconciled estimate month being the lesser of the patient pay the notice sets for that month and the month''s cost of care; this holds for the latest month billed as an estimate, by service month, on a case whose eligibility has been approved (a case in status eligible; on a case in any other status this reconciliation reduces nothing), and only for such a month; every other reconciliation remains under the base rule: within the trueup days after the approval notice, where the actual patient pay exceeds the estimates billed for the month the difference is billed with charge basis trueup_increase, and where it is lower the estimate is reduced by the difference with reason trueup_decrease.'
    - base_policy: medicaid_evt_patient_pay_actual
      superseded_clause: patient pay never exceeds the month's cost of care.
      replaced_by: For an actual-billed month that the actual-month review prices, a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, the month's cost of care is the cost of care that review's own schedules give, and only for such a month; every other month remains under the base rule, where the month's cost of care is the days in the center times the Medicaid daily rate.
    - base_policy: medicaid_evt_patient_pay_actual
      superseded_clause: In a month of admission, discharge or death, patient pay is the lesser of the monthly patient pay and the days in the center times the Medicaid daily rate, with charge basis partial_month, and any amount already billed above that is reduced with reason cost_of_care_cap
      replaced_by: 'For a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, a month of admission, discharge or death takes the cost of care that review''s own schedules give in place of the days in the center times the Medicaid daily rate, and only for such a month; every other month of admission, discharge or death remains under the base rule: In a month of admission, discharge or death, patient pay is the lesser of the monthly patient pay and the days in the center times the Medicaid daily rate, with charge basis partial_month, and any amount already billed above that is reduced with reason cost_of_care_cap.'
    trigger: state_due
    subject:
    - medicaid_patient_pay_adjustment
    computes: amount
    target_tool: post_trueup_decrease_6ec57e06
    params: {}
    rule: 'Once eligibility is approved, every month billed as an estimate is reconciled to the actual patient pay of the month. Where the actual patient pay of the month is lower than the estimates billed for it, the estimate is reduced by the difference with reason trueup_decrease, the actual patient pay of a reconciled estimate month being the lesser of the patient pay the notice sets for that month and the month''s cost of care; this holds for the latest month billed as an estimate, by service month, on a case whose eligibility has been approved (a case in status eligible; on a case in any other status this reconciliation reduces nothing), and only for such a month; every other reconciliation remains under the base rule: within the trueup days after the approval notice, where the actual patient pay exceeds the estimates billed for the month the difference is billed with charge basis trueup_increase, and where it is lower the estimate is reduced by the difference with reason trueup_decrease. The estimates billed for the month are the amount of the month''s patient pay charges with charge basis estimated_pending less the reductions already posted for that service month. The patient pay the notice sets for a reconciled estimate month is the patient pay on the case''s current notice when that notice took effect on or before the first day of the month (a current notice with no effective date recorded counts as taking effect after the first day of the month); when the current notice took effect after the first day of the month, it is the amount of the actual_notice charge billed for the month that follows the reconciled month (the amount the earlier notice set), or the current notice amount where no such charge was billed. For an actual-billed month that the actual-month review prices, a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, the month''s cost of care is the cost of care that review''s own schedules give, and only for such a month; every other month remains under the base rule, where the month''s cost of care is the days in the center times the Medicaid daily rate. For a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, a month of admission, discharge or death takes the cost of care that review''s own schedules give in place of the days in the center times the Medicaid daily rate, and only for such a month; every other month of admission, discharge or death remains under the base rule: In a month of admission, discharge or death, patient pay is the lesser of the monthly patient pay and the days in the center times the Medicaid daily rate, with charge basis partial_month, and any amount already billed above that is reduced with reason cost_of_care_cap. The estimate reconciliation prices the month it covers where the bed-hold days booked for the month all belong to one bed-hold reservation, the month''s Part A days were all booked by the resident''s coverage with the latest coverage start, and every day of the month is accounted for once: the days in the center that the pending accrual posted for the month counts, the bed-hold days booked for the month less the days reversed from those bookings, the days with no bed held that the two schedules on days away read, the days before a skilled admission inside the month and the days after a held bed''s last held day inside the month where the hospital discharged the resident elsewhere add up to the month''s calendar days; for any other month the cost of care stays the days in the center times the Medicaid daily rate, rounded half up to the cent, the days in the center being those the month''s pending accrual counts, or every calendar day where no accrual was posted, and a month of admission, discharge or death takes its patient pay under the partial-month rule restated above. The cost of care a reconciled estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month''s bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them. The reconciliation reduction is the estimates billed for the month less the actual patient pay of the month, never below zero, rounded half up to the cent. Each schedule below changes that standard pricing for the months it names, either by taking days out of the month, which then carry no cost, or by setting the price of a kind of day; every day that neither the standard pricing nor a schedule takes out or prices stays a day at the Medicaid daily rate, never fewer than zero such days, each kind of day is priced and rounded half up to the cent, and the priced kinds are added to give the cost of care a reconciled estimate month carries. The price of a Part A coinsurance day in a reconciled estimate month follows who is billed the coinsurance for the month: where the month''s coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer, nothing, since the Medigap plan and the resident bear that coinsurance and the Medicare billing record charges it to them; where it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate, the Medicaid daily rate, since the program''s crossover payment for a day never exceeds what it pays for a Medicaid day; otherwise the highest daily coinsurance booked for the month. The first privately paid held day of a reconciled estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out. Days of a reconciled estimate month away after a bed was declined or ran out: where the resident''s latest reservation in status declined, by leave start, and the resident''s latest reservation that ended because the payer''s reserved days were used with no private extension, by end date, both fall in part inside the month, the days of the month from the declined leave''s start up to the day before its return and the days after that other reservation''s last held day up to the day before its return are both taken out; where only that declined leave does, the days from its leave start up to the day before its return (to the month''s end where the resident has not come back); where only that other reservation does, the days after its last held day up to the day before its return; otherwise none. Days of a reconciled estimate month away after a held bed was given up: where the resident''s latest reservation in status released, by release date, and the resident''s latest private hold that ended unpaid or at its maximum, by end date, both fall in part inside the month, the days after the release up to the day before that reservation''s return and the days after that private hold''s last held day up to the day before its return are both taken out; where only that released reservation does, the days after the release up to the day before its return (to the month''s end where the resident has not come back); where only that private hold does, the days after its last held day up to the day before its return; otherwise none. Where a hold that ended unpaid and one that ended at its maximum share the latest end date, the one that ended unpaid is read. Days of a reconciled estimate month outside the stay: where the resident''s Medicare coverage with the latest coverage start date began inside the month on the day its qualifying hospital stay ended, a skilled admission, and the resident''s bed-hold reservation that ended because the hospital discharged the resident elsewhere, the one with the latest end date, had its last held day inside the month, the days of the month before that admission and the days after that last held day are both taken out; where only that admission fell inside the month, the days of the month before it; where only that last held day fell inside the month, the days of the month after it; otherwise none. Where two records share the latest date a schedule reads by, the one posted first is read.'
    prerequisite: []
    cross_category:
    - category: medicare
      as: history
      reads:
      - medicare_ledger.day_count
      - medicare_ledger.day_band
      - medicare_ledger.adjustment_reason
      - medicare_ledger.daily_coinsurance_rate
      - medicare_ledger.liable_party
      - coverage_start_date
      - qualifying_discharge_date
      - medicare_ledger.medicare_coverage_id
      note: The Part A days booked and reversed for the month, the payers billed its coinsurance and the latest skilled admission decide the coinsurance day price, the days outside the stay and whether the month is priced.
    - category: bedhold
      as: history
      reads:
      - bedhold_ledger.day_count
      - bedhold_ledger.day_payer
      - bedhold_ledger.bedhold_reservation_id
      - resident_pays_all_held_days
      - leave_start_date
      - private_hold_start_date
      - end_date
      - status
      - return_date
      - release_date
      - end_reason
      - bedhold_ledger.days_entry_id
      note: The month's booked held days, the reservation they belong to with its tier and dates, and the resident's declined, released and ended reservations decide the privately paid held days and the days away with no bed held.
    compute:
    - month_key: LATEST('medicaid_ledger', 'service_month', date_field='service_month', event_type='medicaid_patient_pay_charge', charge_basis='estimated_pending')
    - month_index: MONTHS('2000-01-01', month_key + '-01')
    - first_day: month_key + '-01'
    - next_month_key: ('%d' % (2000 + (month_index + 1) // 12)) + '-' + ('%02d' % ((month_index + 1) % 12 + 1))
    - next_first_day: next_month_key + '-01'
    - estimates_billed: SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_charge', charge_basis='estimated_pending', service_month=month_key) - SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_adjustment', service_month=month_key)
    - notice_patient_pay: F('patient_pay_amount') if (F('patient_pay_effective_date') or '9999-12-31') <= first_day else (LATEST('medicaid_ledger', 'amount', date_field='entry_date', event_type='medicaid_patient_pay_charge', charge_basis='actual_notice', service_month=next_month_key) or F('patient_pay_amount'))
    - calendar_days: DAYS(first_day, next_first_day)
    - daily_rate: F('ma_daily_rate')
    - full_coverage_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', day_band='days_1_20', service_month=month_key) - XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', day_band='days_1_20', service_month=month_key)
    - coinsurance_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', day_band='days_21_100', service_month=month_key) - XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', day_band='days_21_100', service_month=month_key)
    - lapsed_certification_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', adjustment_reason='uncertified_day', service_month=month_key)
    - booked_coinsurance_rate: XMAX('medicare', 'medicare_ledger', 'daily_coinsurance_rate', event_type='medicare_days_booked', day_band='days_21_100', service_month=month_key)
    - crossover_charge_rows: XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='medicaid_crossover', service_month=month_key)
    - private_share_rows: XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', service_month=month_key) + XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='medigap_carrier', service_month=month_key)
    - coinsurance_day_price: 0 if (private_share_rows > 0 and crossover_charge_rows == 0) else (daily_rate if (crossover_charge_rows > 0 and booked_coinsurance_rate > daily_rate) else booked_coinsurance_rate)
    - payer_held_rows: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', day_payer='payer_reserved', service_month=month_key)
    - private_held_rows: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', day_payer='resident_private', service_month=month_key)
    - payer_hold: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_reservation_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='payer_reserved', service_month=month_key)
    - private_hold: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_reservation_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='resident_private', service_month=month_key)
    - month_hold: private_hold or payer_hold
    - one_hold: payer_held_rows <= 1 and private_held_rows <= 1 and (payer_hold == None or private_hold == None or payer_hold == private_hold)
    - held_days_booked: XSUM('bedhold', 'bedhold_ledger', 'day_count', event_type='bedhold_day_booked', service_month=month_key)
    - hold_last_held: CFIELD('bedhold', 'end_date', bedhold_reservation_id=month_hold) or ''
    - hold_pays_all: CPARAM('bedhold', 'resident_pays_all_held_days', bedhold_reservation_id=month_hold) == True
    - hold_leave_start: CFIELD('bedhold', 'leave_start_date', bedhold_reservation_id=month_hold) or '9999-12-31'
    - hold_private_start: CFIELD('bedhold', 'private_hold_start_date', bedhold_reservation_id=month_hold) or ''
    - hold_end_offset: MN(DAYS(first_day, hold_last_held) + 1, calendar_days) if hold_last_held != '' else calendar_days
    - privately_held_start: hold_leave_start if (month_hold != None and hold_pays_all) else (hold_private_start if (month_hold != None and hold_private_start != '') else next_first_day)
    - privately_held_days: MX(0, hold_end_offset - MX(0, DAYS(first_day, privately_held_start)))
    - declined_start: XLATEST('bedhold', 'bedhold_reservations', 'leave_start_date', date_field='leave_start_date', status='declined') or '9999-12-31'
    - declined_return: XLATEST('bedhold', 'bedhold_reservations', 'return_date', date_field='leave_start_date', status='declined') or next_first_day
    - ran_out_last_held: XLATEST('bedhold', 'bedhold_reservations', 'end_date', date_field='end_date', end_reason='payer_days_used_no_extension') or '9999-12-30'
    - ran_out_return: XLATEST('bedhold', 'bedhold_reservations', 'return_date', date_field='end_date', end_reason='payer_days_used_no_extension') or next_first_day
    - released_on: XLATEST('bedhold', 'bedhold_reservations', 'release_date', date_field='release_date', status='released') or '9999-12-30'
    - released_return: XLATEST('bedhold', 'bedhold_reservations', 'return_date', date_field='release_date', status='released') or next_first_day
    - unpaid_last_held: XLATEST('bedhold', 'bedhold_reservations', 'end_date', date_field='end_date', end_reason='unpaid_private_hold') or '0001-01-01'
    - maxed_last_held: XLATEST('bedhold', 'bedhold_reservations', 'end_date', date_field='end_date', end_reason='private_hold_max_reached') or '0001-01-01'
    - private_end_last_held: MX(unpaid_last_held, maxed_last_held) if MX(unpaid_last_held, maxed_last_held) != '0001-01-01' else '9999-12-30'
    - private_end_return: (XLATEST('bedhold', 'bedhold_reservations', 'return_date', date_field='end_date', end_reason=('unpaid_private_hold' if unpaid_last_held >= maxed_last_held else 'private_hold_max_reached')) or next_first_day) if private_end_last_held != '9999-12-30' else next_first_day
    - declined_span: MN(DAYS(first_day, declined_return), calendar_days) - MX(0, DAYS(first_day, declined_start))
    - ran_out_span: MN(DAYS(first_day, ran_out_return), calendar_days) - MX(0, DAYS(first_day, ran_out_last_held) + 1)
    - released_span: MN(DAYS(first_day, released_return), calendar_days) - MX(0, DAYS(first_day, released_on) + 1)
    - private_end_span: MN(DAYS(first_day, private_end_return), calendar_days) - MX(0, DAYS(first_day, private_end_last_held) + 1)
    - declined_in_month: declined_span > 0
    - ran_out_in_month: ran_out_span > 0
    - declined_days_out: ((MN(DAYS(first_day, declined_return), calendar_days) - MX(0, DAYS(first_day, declined_start))) + (MN(DAYS(first_day, ran_out_return), calendar_days) - MX(0, DAYS(first_day, ran_out_last_held) + 1))) if (declined_in_month and ran_out_in_month) else ((MN(DAYS(first_day, declined_return), calendar_days) - MX(0, DAYS(first_day, declined_start))) if declined_in_month else ((MN(DAYS(first_day, ran_out_return), calendar_days) - MX(0, DAYS(first_day, ran_out_last_held) + 1)) if ran_out_in_month else 0))
    - released_in_month: released_span > 0
    - private_end_in_month: private_end_span > 0
    - released_days_out: ((MN(DAYS(first_day, released_return), calendar_days) - MX(0, DAYS(first_day, released_on) + 1)) + (MN(DAYS(first_day, private_end_return), calendar_days) - MX(0, DAYS(first_day, private_end_last_held) + 1))) if (released_in_month and private_end_in_month) else ((MN(DAYS(first_day, released_return), calendar_days) - MX(0, DAYS(first_day, released_on) + 1)) if released_in_month else ((MN(DAYS(first_day, private_end_return), calendar_days) - MX(0, DAYS(first_day, private_end_last_held) + 1)) if private_end_in_month else 0))
    - latest_coverage_start: XLATEST('medicare', 'medicare_coverages', 'coverage_start_date', date_field='coverage_start_date') or '0001-01-01'
    - admission_qualifying_discharge: XLATEST('medicare', 'medicare_coverages', 'qualifying_discharge_date', date_field='coverage_start_date') or ''
    - latest_coverage: XLATEST('medicare', 'medicare_coverages', 'medicare_coverage_id', date_field='coverage_start_date')
    - discharged_elsewhere_last_held: XLATEST('bedhold', 'bedhold_reservations', 'end_date', date_field='end_date', end_reason='hospital_discharged_elsewhere') or '0001-01-01'
    - admission_span: DAYS(first_day, latest_coverage_start)
    - departure_span: DAYS(discharged_elsewhere_last_held, next_first_day) - 1
    - admitted_in_month: latest_coverage_start >= first_day and latest_coverage_start < next_first_day and latest_coverage_start == admission_qualifying_discharge
    - left_in_month: discharged_elsewhere_last_held >= first_day and discharged_elsewhere_last_held < next_first_day
    - days_outside_stay: (DAYS(first_day, latest_coverage_start) + DAYS(discharged_elsewhere_last_held, next_first_day) - 1) if (admitted_in_month and left_in_month) else (DAYS(first_day, latest_coverage_start) if admitted_in_month else ((DAYS(discharged_elsewhere_last_held, next_first_day) - 1) if left_in_month else 0))
    - accrual_rows: COUNT('medicaid_ledger', event_type='medicaid_pending_accrual', service_month=month_key)
    - accrual_days: SUM('medicaid_ledger', 'day_count', event_type='medicaid_pending_accrual', service_month=month_key)
    - days_in_center: accrual_days if accrual_rows > 0 else calendar_days
    - payer_held_entry: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_entry_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='payer_reserved', service_month=month_key)
    - private_held_entry: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_entry_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='resident_private', service_month=month_key)
    - held_days_reversed: (XSUM('bedhold', 'bedhold_ledger', 'day_count', event_type='bedhold_day_reversed', days_entry_id=payer_held_entry) if payer_held_entry else 0) + (XSUM('bedhold', 'bedhold_ledger', 'day_count', event_type='bedhold_day_reversed', days_entry_id=private_held_entry) if private_held_entry else 0)
    - month_bookings: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', service_month=month_key)
    - latest_coverage_bookings: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', service_month=month_key, medicare_coverage_id=latest_coverage)
    - away_accounted: MX(0, declined_span) + MX(0, ran_out_span) + MX(0, released_span) + MX(0, private_end_span) + (MX(0, admission_span) if (latest_coverage_start >= first_day and latest_coverage_start < next_first_day and latest_coverage_start == admission_qualifying_discharge) else 0) + (MX(0, departure_span) if (discharged_elsewhere_last_held >= first_day and discharged_elsewhere_last_held < next_first_day) else 0)
    - month_priced: accrual_rows > 0 and one_hold and month_bookings == latest_coverage_bookings and (days_in_center + held_days_booked - held_days_reversed + away_accounted == calendar_days)
    - medicaid_days: MX(0, calendar_days - full_coverage_days - lapsed_certification_days - coinsurance_days - privately_held_days - declined_days_out - released_days_out - days_outside_stay)
    - month_cost_of_care: RND(medicaid_days * daily_rate + 0.000000001, 2) + RND(coinsurance_days * coinsurance_day_price + 0.000000001, 2)
    - base_cost_of_care: RND(days_in_center * daily_rate + 0.000000001, 2)
    - cost_applied: month_cost_of_care if month_priced else base_cost_of_care
    - actual_patient_pay: MN(notice_patient_pay, cost_applied)
    - result: 0 if F('status') != 'eligible' else RND(MX(0, estimates_billed - actual_patient_pay) + 0.000000001, 2)
    compute_basis:
