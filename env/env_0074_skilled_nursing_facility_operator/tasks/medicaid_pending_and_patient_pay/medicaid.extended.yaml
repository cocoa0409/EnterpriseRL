      cost_applied: 'The estimate reconciliation prices the month it covers where the bed-hold days booked for the month all belong to one bed-hold reservation, the month''s Part A days were all booked by the resident''s coverage with the latest coverage start, and every day of the month is accounted for once: the days in the center that the pending accrual posted for the month counts, the bed-hold days booked for the month less the days reversed from those bookings, the days with no bed held that the two schedules on days away read, the days before a skilled admission inside the month and the days after a held bed''s last held day inside the month where the hospital discharged the resident elsewhere add up to the month''s calendar days; for any other month the cost of care stays the days in the center times the Medicaid daily rate, rounded half up to the cent, the days in the center being those the month''s pending accrual counts, or every calendar day where no accrual was posted, and a month of admission, discharge or death takes its patient pay under the partial-month rule restated above.'
      actual_patient_pay: 'Where the actual patient pay of the month is lower than the estimates billed for it, the estimate is reduced by the difference with reason trueup_decrease, the actual patient pay of a reconciled estimate month being the lesser of the patient pay the notice sets for that month and the month''s cost of care; this holds for the latest month billed as an estimate, by service month, on a case whose eligibility has been approved (a case in status eligible; on a case in any other status this reconciliation reduces nothing), and only for such a month; every other reconciliation remains under the base rule: within the trueup days after the approval notice, where the actual patient pay exceeds the estimates billed for the month the difference is billed with charge basis trueup_increase, and where it is lower the estimate is reduced by the difference with reason trueup_decrease.'
      result: The reconciliation reduction is the estimates billed for the month less the actual patient pay of the month, never below zero, rounded half up to the cent.
    factors:
    - id: reconciled_coinsurance_day_price
      effect: parameter
      decides: coinsurance_day_price
      bindings:
      - crossover_charge_rows
      - private_share_rows
      - coinsurance_day_price
      ladder:
      - when: the month's coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer
        value: '0'
      - when: it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate
        value: F('ma_daily_rate')
      - when: otherwise
        value: the highest daily coinsurance booked for the month
      baseline:
        coinsurance_day_price: booked_coinsurance_rate
      evidence:
      - cross_category
      - history
      cross_difficulty: medicare
    - id: reconciled_privately_held_start
      effect: parameter
      decides: privately_held_start
      bindings:
      - hold_pays_all
      - hold_private_start
      - privately_held_start
      - privately_held_days
      ladder:
      - when: the reservation the month's booked held days belong to is a hold whose every held day is the resident's own charge (a private-pay hold or a hold during a Medicare skilled stay)
        value: its leave start date
      - when: it is a Medicaid reserved bed whose private extension has begun
        value: its private hold start date
      - when: otherwise (a Medicaid reserved bed with no private extension, or no held day booked)
        value: none (the first day of the next month)
      baseline:
        privately_held_start: next_first_day
      evidence:
      - cross_category
      - date
      cross_difficulty: bedhold
    - id: reconciled_declined_hold_days
      effect: method
      decides: declined_days_out
      bindings:
      - declined_in_month
      - ran_out_in_month
      - declined_days_out
      ladder:
      - when: the resident's latest declined reservation and latest reservation that ended because the payer's reserved days were used with no private extension both fall in part inside the month
        method: the days from the declined leave's start and the days after the other reservation's last held day, each up to the day before its return, are both taken out
      - when: only that declined reservation does
        method: the days from its leave start up to the day before its return (to the month's end where the resident has not come back) are taken out
      - when: only that other reservation does
        method: the days after its last held day up to the day before its return are taken out
      - when: otherwise
        method: no day is taken out
      baseline:
        declined_days_out: '0'
      evidence:
      - date
    - id: reconciled_released_hold_days
      effect: method
      decides: released_days_out
      bindings:
      - released_in_month
      - private_end_in_month
      - released_days_out
      ladder:
      - when: the resident's latest released reservation and latest private hold that ended unpaid or at its maximum both fall in part inside the month
        method: the days after the release and the days after that private hold's last held day, each up to the day before its return, are both taken out
      - when: only that released reservation does
        method: the days after the release up to the day before its return (to the month's end where the resident has not come back) are taken out
      - when: only that private hold does
        method: the days after its last held day up to the day before its return are taken out
      - when: otherwise
        method: no day is taken out
      baseline:
        released_days_out: '0'
      evidence:
      - date
    - id: reconciled_days_outside_stay
      effect: method
      decides: days_outside_stay
      bindings:
      - admitted_in_month
      - left_in_month
      - days_outside_stay
      ladder:
      - when: a skilled admission (the latest coverage start, on the day its qualifying hospital stay ended) and the last held day of a bed the hospital's discharge elsewhere ended both fall inside the month
        method: the days before that admission and the days after that last held day are both taken out
      - when: only that admission falls inside the month
        method: the days of the month before it are taken out
      - when: only that last held day falls inside the month
        method: the days of the month after it are taken out
      - when: otherwise
        method: no day is taken out
      baseline:
        days_outside_stay: '0'
      evidence:
      - date
    baseline:
      rule: The estimates billed for the month are the amount of the month's patient pay charges with charge basis estimated_pending less the reductions already posted for that service month. The patient pay the notice sets for a reconciled estimate month is the patient pay on the case's current notice when that notice took effect on or before the first day of the month (a current notice with no effective date recorded counts as taking effect after the first day of the month); when the current notice took effect after the first day of the month, it is the amount of the actual_notice charge billed for the month that follows the reconciled month (the amount the earlier notice set), or the current notice amount where no such charge was billed. The cost of care a reconciled estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them. The reconciliation reduction is the estimates billed for the month less the actual patient pay of the month, never below zero, rounded half up to the cent.
      params:
      - trueup_basis
      - trueup_days
    inputs:
      history:
      - table: medicaid_ledger
        aggregate: sum
        field: amount
        filters:
          event_type: medicaid_patient_pay_charge
          charge_basis: estimated_pending
      - table: medicaid_ledger
        aggregate: sum
        field: amount
        filters:
          event_type: medicaid_patient_pay_adjustment
      - category: medicare
        table: medicare_ledger
        aggregate: sum
        field: day_count
        filters:
          event_type: medicare_days_booked
      - category: bedhold
        table: bedhold_ledger
        aggregate: sum
        field: day_count
        filters:
          event_type: bedhold_day_booked
      - table: medicaid_ledger
        aggregate: sum
        field: day_count
        filters:
          event_type: medicaid_pending_accrual
      cross_category:
      - medicare
      - bedhold
  - id: medicaid_ext_eligible_advance_payment
    base_policy_refs:
    - medicaid_evt_payments
    - medicaid_agg_case_balances
    overwrite:
    - base_policy: medicaid_evt_payments
      superseded_clause: A patient pay credit balance is refunded within the refund days, to the resident or representative, or to the estate after a death.
      replaced_by: A patient pay credit balance is refunded within the refund days, to the resident or representative, or to the estate after a death; when the representative of an approved case pays toward the coming month while a credit that arose from a reduction posted within the refund days stands on the case, that credit is instead applied to the coming month up to the patient pay the coming month will carry, and only for such a payment; a payment toward a coming pending month takes the rule for pending cases, and every other credit balance is refunded under the base rule.
    trigger: on_request
    subject:
    - medicaid_patient_pay_payment
    computes: amount
    target_tool: pay_patient_pay_advance_e93eb0b7
    params: {}
    rule: 'A resident or representative of an approved case may pay toward the coming month''s patient pay; the payment is posted as a patient pay payment by ACH that names no charge, and it is applied, oldest service month first, when the coming month is billed. The advance a representative sends for the coming month is the patient pay the coming month will carry less the benefit the resident''s funds account applies as representative payee, never below zero, rounded half up to the cent. The patient pay the coming month will carry is the patient pay on the County Assistance Office notice in effect for that month: the current notice amount when the current notice takes effect on or before the first day of the coming month; otherwise the amount billed on the latest actual-notice charge by service month; and where the case carries no actual-notice charge and the current notice takes effect after the first day of the coming month, the amount of the latest estimate charge by service month, or nothing where the case carries no estimate charge either; a current notice with no effective date recorded counts as taking effect after the first day of the coming month. The benefit the funds account applies as representative payee is the latest Social Security benefit, by posting date, received as payee into the resident''s funds account, or nothing where none was received. The advance under this rule is figured for a case in status eligible; for a case in any other status it is nothing. An allowance the case does not record counts as zero. Where two records share the latest date a schedule reads by, the one posted first is read. The advance is fixed only after the actual charge of the last closed month stands at no more than that month''s cost of care. The advance is not fixed until the latest month billed as an estimate stands reconciled to the actual patient pay of that month. A patient pay credit balance is refunded within the refund days, to the resident or representative, or to the estate after a death; when the representative of an approved case pays toward the coming month while a credit that arose from a reduction posted within the refund days stands on the case, that credit is instead applied to the coming month up to the patient pay the coming month will carry, and only for such a payment; a payment toward a coming pending month takes the rule for pending cases, and every other credit balance is refunded under the base rule. The resident''s funds account is the resident''s account in status active, and the funds it applies to an advance are the benefit it applies as representative payee. Each schedule below sets one figure of that standard, or a figure it adds or keeps back, for the cases it names, and says where that figure enters: figures entering the funds the account applies are combined first, never below zero, and that total is subtracted from the patient pay the coming month will carry; a figure entering the advance itself is added after that; the advance is never below zero and is rounded half up to the cent. The benefit applied as representative payee for an advance: where more than one Social Security benefit was received as payee within the last month, the larger of the latest of them and the others together, so that the month''s regular benefit is applied whichever deposit was posted last; where no benefit was received as payee within the last two months, nothing, since the payments have stopped; otherwise the latest benefit received. The pension added to the funds the account applies to an advance under a standing authorization: where the resident''s funds account is a Medicaid self-directed or guardianship account carrying a standing authorization for Medicaid patient pay and a pension was deposited into it within the last two months, the latest pension deposit less the personal needs allowance, which the resident keeps from it; where the account is a Medicaid representative payee account carrying such an authorization and a pension was deposited into it within the last two months, the whole latest pension deposit, since the allowance is kept from the benefit; otherwise nothing. The amount kept back from the funds the account applies to an advance: where the resident''s funds account is a Medicaid representative payee account that keeps the personal needs allowance in the account and the case''s tier deducts a community spouse, dependent family or home maintenance allowance, the personal needs allowance plus the allowances on the case that the tier deducts, which the payee pays out of the benefit; where it is such an account on any other tier, the personal needs allowance, which stays in the account (a protected VA pension amount is not paid into a payee account, so nothing more is kept for it); otherwise nothing. The case balance added to an advance on an approved case: where the case''s patient pay balance is owed, that balance is added, since the payment is applied to the open months first; where the balance is a credit and a reduction was posted on the case within the refund days, the credit is subtracted, but never more than the patient pay the coming month will carry; otherwise, including a credit with no reduction posted within the refund days, which is owed back as a refund, nothing is carried. The case''s patient pay balance is the patient pay charges and refunds on the case less the payments and reductions posted to it.'
    prerequisite:
    - problem: medicaid_ext_actual_month_cost_cap
      kind: value_input
      gate: balance_carried
      form: state
      policy_source: The advance is fixed only after the actual charge of the last closed month stands at no more than that month's cost of care.
      condition: The actual_notice charge of the calendar month before the current month carries a cost_of_care_cap reduction bringing its net amount down to the month's cost of care, wherever that cost is below the charge.
      resolved_by: post_cost_of_care_reduction_89ef8a19
      effect: The cost-of-care reduction lowers the case's patient pay balance by the reduction amount, which changes the case balance carried into the advance by the same amount.
    - problem: medicaid_ext_estimate_month_trueup
      kind: value_input
      gate: balance_carried
      form: state
      policy_source: The advance is not fixed until the latest month billed as an estimate stands reconciled to the actual patient pay of that month.
      condition: The estimated_pending charge of the latest month billed as an estimate carries a trueup_decrease reduction bringing the estimates billed for that month down to the actual patient pay of the month, wherever that patient pay is below them.
      resolved_by: post_trueup_decrease_6ec57e06
      effect: The reconciliation reduction lowers the case's patient pay balance by the reduction amount, which changes the case balance carried into the advance by the same amount.
    cross_category:
    - category: trust
      as: history
      reads:
      - variant_name
      - standing_authorization
      - trust_ledger.amount
      - trust_ledger.deposit_source
      - trust_ledger.entry_date
      note: The funds account tier, its standing authorization and its payee benefit and pension deposits decide the benefit applied, the pension applied and the amount kept.
    compute:
    - now_index: MONTHS('2000-01-01', NOW)
    - current_first_day: ('%d' % (2000 + now_index // 12)) + '-' + ('%02d' % (now_index % 12 + 1)) + '-01'
    - coming_first_day: ('%d' % (2000 + (now_index + 1) // 12)) + '-' + ('%02d' % ((now_index + 1) % 12 + 1)) + '-01'
    - latest_actual_amount: LATEST('medicaid_ledger', 'amount', date_field='service_month', event_type='medicaid_patient_pay_charge', charge_basis='actual_notice')
    - latest_estimate_amount: LATEST('medicaid_ledger', 'amount', date_field='service_month', event_type='medicaid_patient_pay_charge', charge_basis='estimated_pending')
    - coming_patient_pay: F('patient_pay_amount') if (F('patient_pay_effective_date') or '9999-12-31') <= coming_first_day else (latest_actual_amount if latest_actual_amount else (latest_estimate_amount or 0))
    - payee_last_month: XCOUNT('trust', 'trust_ledger', within_months=1, date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee')
    - payee_two_months: XCOUNT('trust', 'trust_ledger', within_months=2, date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee')
    - recent_benefits_total: XSUM('trust', 'trust_ledger', 'amount', within_months=1, date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee')
    - latest_benefit: XLATEST('trust', 'trust_ledger', 'amount', date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee') or 0
    - payee_benefit_applied: MX(latest_benefit, recent_benefits_total - latest_benefit) if payee_last_month > 1 else (0 if payee_two_months == 0 else latest_benefit)
    - funds_tier: CFIELD('trust', 'variant_name', status='active')
    - funds_authorization: CFIELD('trust', 'standing_authorization', status='active')
    - pension_recent: XCOUNT('trust', 'trust_ledger', within_months=2, date_field='entry_date', event_type='trust_deposit', deposit_source='pension_direct_deposit')
    - latest_pension: XLATEST('trust', 'trust_ledger', 'amount', date_field='entry_date', event_type='trust_deposit', deposit_source='pension_direct_deposit') or 0
    - pension_applied: (latest_pension - P('personal_needs_allowance_monthly')) if ((funds_tier == 'Resident Funds Account, Medicaid Self-Directed' or funds_tier == 'Resident Funds Account, Medicaid Guardianship') and funds_authorization == 'medicaid_patient_pay' and pension_recent > 0) else (latest_pension if (funds_tier == 'Resident Funds Account, Medicaid Representative Payee' and funds_authorization == 'medicaid_patient_pay' and pension_recent > 0) else 0)
    - kept_pna_retained: CPARAM('trust', 'medicaid_pna_retained', status='active') == True
    - kept_allowances: (F('community_spouse_allowance') or 0 if P('community_spouse_allowance_applies') else 0) + (F('family_allowance') or 0 if P('family_allowance_applies') else 0) + (F('home_maintenance_allowance') or 0 if P('home_maintenance_allowance_applies') else 0)
    - amount_kept: (P('personal_needs_allowance_monthly') + kept_allowances) if (kept_pna_retained and funds_tier == 'Resident Funds Account, Medicaid Representative Payee' and kept_allowances > 0) else (P('personal_needs_allowance_monthly') if (kept_pna_retained and funds_tier == 'Resident Funds Account, Medicaid Representative Payee') else 0)
    - case_balance: SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_charge') + SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_refund') - SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_payment') - SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_adjustment')
    - latest_reduction_on: LATEST('medicaid_ledger', 'entry_date', date_field='entry_date', event_type='medicaid_patient_pay_adjustment') or '0000-00-00'
    - balance_carried: case_balance if case_balance > 0 else ((0 - MN(0 - case_balance, coming_patient_pay)) if (case_balance < 0 and latest_reduction_on != '0000-00-00' and DAYS(latest_reduction_on, NOW) <= P('refund_days')) else 0)
    - funds_part: MX(0, payee_benefit_applied + pension_applied - amount_kept)
    - result: 0 if F('status') != 'eligible' else RND(MX(0, coming_patient_pay - funds_part + balance_carried) + 0.000000001, 2)
    compute_basis:
      coming_first_day: A resident or representative of an approved case may pay toward the coming month's patient pay; the payment is posted as a patient pay payment by ACH that names no charge, and it is applied, oldest service month first, when the coming month is billed.
      latest_actual_amount: 'The patient pay the coming month will carry is the patient pay on the County Assistance Office notice in effect for that month: the current notice amount when the current notice takes effect on or before the first day of the coming month; otherwise the amount billed on the latest actual-notice charge by service month; and where the case carries no actual-notice charge and the current notice takes effect after the first day of the coming month, the amount of the latest estimate charge by service month, or nothing where the case carries no estimate charge either; a current notice with no effective date recorded counts as taking effect after the first day of the coming month.'
      latest_estimate_amount: 'The patient pay the coming month will carry is the patient pay on the County Assistance Office notice in effect for that month: the current notice amount when the current notice takes effect on or before the first day of the coming month; otherwise the amount billed on the latest actual-notice charge by service month; and where the case carries no actual-notice charge and the current notice takes effect after the first day of the coming month, the amount of the latest estimate charge by service month, or nothing where the case carries no estimate charge either; a current notice with no effective date recorded counts as taking effect after the first day of the coming month.'
      coming_patient_pay: 'The patient pay the coming month will carry is the patient pay on the County Assistance Office notice in effect for that month: the current notice amount when the current notice takes effect on or before the first day of the coming month; otherwise the amount billed on the latest actual-notice charge by service month; and where the case carries no actual-notice charge and the current notice takes effect after the first day of the coming month, the amount of the latest estimate charge by service month, or nothing where the case carries no estimate charge either; a current notice with no effective date recorded counts as taking effect after the first day of the coming month.'
      payee_last_month: where more than one Social Security benefit was received as payee within the last month, the larger of the latest of them and the others together,
      payee_two_months: where no benefit was received as payee within the last two months, nothing, since the payments have stopped;
      recent_benefits_total: where more than one Social Security benefit was received as payee within the last month, the larger of the latest of them and the others together,
      latest_benefit: The benefit the funds account applies as representative payee is the latest Social Security benefit, by posting date, received as payee into the resident's funds account, or nothing where none was received. The advance under this rule is figured for a case in status eligible; for a case in any other status it is nothing. An allowance the case does not record counts as zero. Where two records share the latest date a schedule reads by, the one posted first is read.
      payee_benefit_applied: 'The benefit applied as representative payee for an advance: where more than one Social Security benefit was received as payee within the last month, the larger of the latest of them and the others together, so that the month''s regular benefit is applied whichever deposit was posted last; where no benefit was received as payee within the last two months, nothing, since the payments have stopped; otherwise the latest benefit received.'
      pension_recent: 'The pension added to the funds the account applies to an advance under a standing authorization: where the resident''s funds account is a Medicaid self-directed or guardianship account carrying a standing authorization for Medicaid patient pay and a pension was deposited into it within the last two months, the latest pension deposit less the personal needs allowance, which the resident keeps from it; where the account is a Medicaid representative payee account carrying such an authorization and a pension was deposited into it within the last two months, the whole latest pension deposit, since the allowance is kept from the benefit; otherwise nothing.'
      latest_pension: 'The pension added to the funds the account applies to an advance under a standing authorization: where the resident''s funds account is a Medicaid self-directed or guardianship account carrying a standing authorization for Medicaid patient pay and a pension was deposited into it within the last two months, the latest pension deposit less the personal needs allowance, which the resident keeps from it; where the account is a Medicaid representative payee account carrying such an authorization and a pension was deposited into it within the last two months, the whole latest pension deposit, since the allowance is kept from the benefit; otherwise nothing.'
      pension_applied: 'The pension added to the funds the account applies to an advance under a standing authorization: where the resident''s funds account is a Medicaid self-directed or guardianship account carrying a standing authorization for Medicaid patient pay and a pension was deposited into it within the last two months, the latest pension deposit less the personal needs allowance, which the resident keeps from it; where the account is a Medicaid representative payee account carrying such an authorization and a pension was deposited into it within the last two months, the whole latest pension deposit, since the allowance is kept from the benefit; otherwise nothing.'
      amount_kept: 'The amount kept back from the funds the account applies to an advance: where the resident''s funds account is a Medicaid representative payee account that keeps the personal needs allowance in the account and the case''s tier deducts a community spouse, dependent family or home maintenance allowance, the personal needs allowance plus the allowances on the case that the tier deducts, which the payee pays out of the benefit; where it is such an account on any other tier, the personal needs allowance, which stays in the account (a protected VA pension amount is not paid into a payee account, so nothing more is kept for it); otherwise nothing.'
      case_balance: The case's patient pay balance is the patient pay charges and refunds on the case less the payments and reductions posted to it.
      latest_reduction_on: where the balance is a credit and a reduction was posted on the case within the refund days, the credit is subtracted, but never more than the patient pay the coming month will carry;
      balance_carried: 'The case balance added to an advance on an approved case: where the case''s patient pay balance is owed, that balance is added, since the payment is applied to the open months first; where the balance is a credit and a reduction was posted on the case within the refund days, the credit is subtracted, but never more than the patient pay the coming month will carry; otherwise, including a credit with no reduction posted within the refund days, which is owed back as a refund, nothing is carried. The case''s patient pay balance is the patient pay charges and refunds on the case less the payments and reductions posted to it.'
      funds_part: 'Each schedule below sets one figure of that standard, or a figure it adds or keeps back, for the cases it names, and says where that figure enters: figures entering the funds the account applies are combined first, never below zero, and that total is subtracted from the patient pay the coming month will carry; a figure entering the advance itself is added after that; the advance is never below zero and is rounded half up to the cent.'
      result: 'The resident''s funds account is the resident''s account in status active, and the funds it applies to an advance are the benefit it applies as representative payee. Each schedule below sets one figure of that standard, or a figure it adds or keeps back, for the cases it names, and says where that figure enters: figures entering the funds the account applies are combined first, never below zero, and that total is subtracted from the patient pay the coming month will carry; a figure entering the advance itself is added after that; the advance is never below zero and is rounded half up to the cent.'
      funds_tier: The resident's funds account is the resident's account in status active, and the funds it applies to an advance are the benefit it applies as representative payee.
      funds_authorization: The resident's funds account is the resident's account in status active, and the funds it applies to an advance are the benefit it applies as representative payee.
      kept_pna_retained: where the resident's funds account is a Medicaid representative payee account that keeps the personal needs allowance in the account
      kept_allowances: the personal needs allowance plus the allowances on the case that the tier deducts, which the payee pays out of the benefit;
    factors:
    - id: approved_payee_benefit_applied
      effect: method
      decides: payee_benefit_applied
      bindings:
      - payee_last_month
      - payee_two_months
      - recent_benefits_total
      - latest_benefit
      - payee_benefit_applied
      ladder:
      - when: more than one Social Security benefit was received as payee within the last month
        method: the larger of the latest benefit and the others of that month together is applied
      - when: no benefit was received as payee within the last two months
        method: nothing is applied
      - when: otherwise
        method: the latest benefit received is applied
      baseline:
        payee_benefit_applied: latest_benefit
      evidence:
      - cross_category
      - history
      cross_difficulty: trust
    - id: approved_authorized_pension
      effect: parameter
      decides: pension_applied
      bindings:
      - pension_recent
      - latest_pension
      - pension_applied
      ladder:
      - when: a Medicaid self-directed or guardianship funds account with a standing authorization for Medicaid patient pay and a pension deposited within the last two months
        value: the latest pension deposit less P('personal_needs_allowance_monthly')
      - when: a Medicaid representative payee funds account with such an authorization and a pension deposited within the last two months
        value: the whole latest pension deposit
      - when: otherwise
        value: '0'
      baseline:
        pension_applied: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: trust
    - id: approved_amount_kept
      effect: parameter
      decides: amount_kept
      bindings:
      - kept_pna_retained
      - kept_allowances
      - amount_kept
      ladder:
      - when: a Medicaid representative payee funds account that keeps the personal needs allowance, on a case whose tier deducts a community spouse, dependent family or home maintenance allowance
        value: P('personal_needs_allowance_monthly') plus the allowances on the case that the tier deducts
      - when: such an account on any other tier
        value: P('personal_needs_allowance_monthly')
      - when: otherwise
        value: '0'
      baseline:
        amount_kept: '0'
      evidence:
      - cross_category
      cross_difficulty: trust
    - id: approved_balance_carried
      effect: method
      decides: balance_carried
      bindings:
      - case_balance
      - latest_reduction_on
      - balance_carried
      ladder:
      - when: the case's patient pay balance is owed
        method: the owed balance is added
      - when: the balance is a credit and a reduction was posted on the case within the refund days
        method: the credit is subtracted, capped at the patient pay the coming month will carry
      - when: otherwise (no balance, or a credit with no reduction within the refund days, owed back as a refund)
        method: nothing is carried
      baseline:
        balance_carried: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: 'The advance a representative sends for the coming month is the patient pay the coming month will carry less the benefit the resident''s funds account applies as representative payee, never below zero, rounded half up to the cent. The patient pay the coming month will carry is the patient pay on the County Assistance Office notice in effect for that month: the current notice amount when the current notice takes effect on or before the first day of the coming month; otherwise the amount billed on the latest actual-notice charge by service month; and where the case carries no actual-notice charge and the current notice takes effect after the first day of the coming month, the amount of the latest estimate charge by service month, or nothing where the case carries no estimate charge either; a current notice with no effective date recorded counts as taking effect after the first day of the coming month. The benefit the funds account applies as representative payee is the latest Social Security benefit, by posting date, received as payee into the resident''s funds account, or nothing where none was received. The advance under this rule is figured for a case in status eligible; for a case in any other status it is nothing. An allowance the case does not record counts as zero. Where two records share the latest date a schedule reads by, the one posted first is read.'
      params:
      - accepted_payment_methods
    inputs:
      history:
      - table: medicaid_ledger
        aggregate: latest
        field: amount
        filters:
          event_type: medicaid_patient_pay_charge
          charge_basis: actual_notice
      - table: medicaid_ledger
        aggregate: sum
        field: amount
        filters:
          event_type: medicaid_patient_pay_payment
      - category: trust
        table: trust_ledger
        aggregate: sum
        field: amount
        within_months: 1
        filters:
          event_type: trust_deposit
          deposit_source: ssa_benefit_as_payee
      - category: trust
        table: trust_ledger
        aggregate: count
        within_months: 1
        filters:
          event_type: trust_deposit
          deposit_source: ssa_benefit_as_payee
      cross_category:
      - trust
  - id: medicaid_ext_pending_estimate_cost_cap
    base_policy_refs:
    - medicaid_evt_patient_pay_actual
    - medicaid_evt_pending_estimate
    - medicaid_case_maintenance
    overwrite:
    - base_policy: medicaid_evt_patient_pay_actual
      superseded_clause: patient pay never exceeds the month's cost of care.
      replaced_by: For an actual-billed month that the actual-month review prices, a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, the month's cost of care is the cost of care that review's own schedules give, and only for such a month; every other month remains under the base rule, where the month's cost of care is the days in the center times the Medicaid daily rate.
    - base_policy: medicaid_evt_patient_pay_actual
      superseded_clause: In a month of admission, discharge or death, patient pay is the lesser of the monthly patient pay and the days in the center times the Medicaid daily rate, with charge basis partial_month, and any amount already billed above that is reduced with reason cost_of_care_cap
      replaced_by: 'For a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, a month of admission, discharge or death takes the cost of care that review''s own schedules give in place of the days in the center times the Medicaid daily rate, and only for such a month; every other month of admission, discharge or death remains under the base rule: In a month of admission, discharge or death, patient pay is the lesser of the monthly patient pay and the days in the center times the Medicaid daily rate, with charge basis partial_month, and any amount already billed above that is reduced with reason cost_of_care_cap.'
    trigger: state_due
    subject:
    - medicaid_patient_pay_adjustment
    computes: amount
    target_tool: post_pending_cost_of_care_reduction_7ee4a52a
    params: {}
    rule: 'While an application is pending, the business office reviews each closed month billed as an estimate against the month''s cost of care. The review covers the calendar month before the current month on a case that is pending, and the case''s patient pay charge with charge basis estimated_pending for that service month; the estimate for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed, or the case is not in status pending, the reduction is zero. Patient pay never exceeds the month''s cost of care. For an actual-billed month that the actual-month review prices, a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, the month''s cost of care is the cost of care that review''s own schedules give, and only for such a month; every other month remains under the base rule, where the month''s cost of care is the days in the center times the Medicaid daily rate. For a reconciled estimate month that the estimate reconciliation prices and a pending estimate month that the pending-month review prices, a month of admission, discharge or death takes the cost of care that review''s own schedules give in place of the days in the center times the Medicaid daily rate, and only for such a month; every other month of admission, discharge or death remains under the base rule: In a month of admission, discharge or death, patient pay is the lesser of the monthly patient pay and the days in the center times the Medicaid daily rate, with charge basis partial_month, and any amount already billed above that is reduced with reason cost_of_care_cap. The pending-month review prices the month it covers where the bed-hold days booked for the month all belong to one bed-hold reservation, the month''s Part A days were all booked by the resident''s coverage with the latest coverage start, and every day of the month is accounted for once: the days in the center that the pending accrual posted for the month counts, the bed-hold days booked for the month less the days reversed from those bookings, the days with no bed held that the two schedules on days away read, the days before a skilled admission inside the month and the days after a held bed''s last held day inside the month where the hospital discharged the resident elsewhere add up to the month''s calendar days; for any other month the cost of care stays the days in the center times the Medicaid daily rate, rounded half up to the cent, the days in the center being those the month''s pending accrual counts, or every calendar day where no accrual was posted, and a month of admission, discharge or death takes its patient pay under the partial-month rule restated above. The cost of care a pending estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month''s bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them. The reduction for a pending estimate month is the estimate for the month less that cost of care, never below zero, rounded half up to the cent, and it is posted against that estimate with reason cost_of_care_cap. Each schedule below changes that standard pricing for the months it names, either by taking days out of the month, which then carry no cost, or by setting the price of a kind of day; every day that neither the standard pricing nor a schedule takes out or prices stays a day at the Medicaid daily rate, never fewer than zero such days, each kind of day is priced and rounded half up to the cent, and the priced kinds are added to give the cost of care a pending estimate month carries. The price of a Part A coinsurance day in a pending estimate month follows who is billed the coinsurance for the month: where the month''s coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer, nothing, since the Medigap plan and the resident bear that coinsurance and the Medicare billing record charges it to them; where it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate, the Medicaid daily rate, since the program''s crossover payment for a day never exceeds what it pays for a Medicaid day; otherwise the highest daily coinsurance booked for the month. The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out. Days of a pending estimate month away after a bed was declined or ran out: where the resident''s latest reservation in status declined, by leave start, and the resident''s latest reservation that ended because the payer''s reserved days were used with no private extension, by end date, both fall in part inside the month, the days of the month from the declined leave''s start up to the day before its return and the days after that other reservation''s last held day up to the day before its return are both taken out; where only that declined leave does, the days from its leave start up to the day before its return (to the month''s end where the resident has not come back); where only that other reservation does, the days after its last held day up to the day before its return; otherwise none. Days of a pending estimate month away after a held bed was given up: where the resident''s latest reservation in status released, by release date, and the resident''s latest private hold that ended unpaid or at its maximum, by end date, both fall in part inside the month, the days after the release up to the day before that reservation''s return and the days after that private hold''s last held day up to the day before its return are both taken out; where only that released reservation does, the days after the release up to the day before its return (to the month''s end where the resident has not come back); where only that private hold does, the days after its last held day up to the day before its return; otherwise none. Where a hold that ended unpaid and one that ended at its maximum share the latest end date, the one that ended unpaid is read. Days of a pending estimate month outside the stay: where the resident''s Medicare coverage with the latest coverage start date began inside the month on the day its qualifying hospital stay ended, a skilled admission, and the resident''s bed-hold reservation that ended because the hospital discharged the resident elsewhere, the one with the latest end date, had its last held day inside the month, the days of the month before that admission and the days after that last held day are both taken out; where only that admission fell inside the month, the days of the month before it; where only that last held day fell inside the month, the days of the month after it; otherwise none. Where two records share the latest date a schedule reads by, the one posted first is read.'
    prerequisite: []
    cross_category:
    - category: medicare
      as: history
      reads:
      - medicare_ledger.day_count
      - medicare_ledger.day_band
      - medicare_ledger.adjustment_reason
      - medicare_ledger.daily_coinsurance_rate
      - medicare_ledger.liable_party
      - coverage_start_date
      - qualifying_discharge_date
      - medicare_ledger.medicare_coverage_id
      note: The Part A days booked and reversed for the month, the payers billed its coinsurance and the latest skilled admission decide the coinsurance day price, the days outside the stay and whether the month is priced.
    - category: bedhold
      as: history
      reads:
      - bedhold_ledger.day_count
      - bedhold_ledger.day_payer
      - bedhold_ledger.bedhold_reservation_id
      - resident_pays_all_held_days
      - leave_start_date
      - private_hold_start_date
      - end_date
      - status
      - return_date
      - release_date
      - end_reason
      - bedhold_ledger.days_entry_id
      note: The month's booked held days, the reservation they belong to with its tier and dates, and the resident's declined, released and ended reservations decide the privately paid held days and the days away with no bed held.
    compute:
    - month_index: MONTHS('2000-01-01', NOW) - 1
    - month_key: ('%d' % (2000 + month_index // 12)) + '-' + ('%02d' % (month_index % 12 + 1))
    - first_day: month_key + '-01'
    - next_first_day: ('%d' % (2000 + (month_index + 1) // 12)) + '-' + ('%02d' % ((month_index + 1) % 12 + 1)) + '-01'
    - estimate_billed: SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_charge', charge_basis='estimated_pending', service_month=month_key) - SUM('medicaid_ledger', 'amount', event_type='medicaid_patient_pay_adjustment', service_month=month_key)
    - calendar_days: DAYS(first_day, next_first_day)
    - daily_rate: F('ma_daily_rate')
    - full_coverage_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', day_band='days_1_20', service_month=month_key) - XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', day_band='days_1_20', service_month=month_key)
    - coinsurance_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', day_band='days_21_100', service_month=month_key) - XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', day_band='days_21_100', service_month=month_key)
    - lapsed_certification_days: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_reversed', adjustment_reason='uncertified_day', service_month=month_key)
    - booked_coinsurance_rate: XMAX('medicare', 'medicare_ledger', 'daily_coinsurance_rate', event_type='medicare_days_booked', day_band='days_21_100', service_month=month_key)
    - crossover_charge_rows: XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='medicaid_crossover', service_month=month_key)
    - private_share_rows: XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', service_month=month_key) + XCOUNT('medicare', 'medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='medigap_carrier', service_month=month_key)
    - coinsurance_day_price: 0 if (private_share_rows > 0 and crossover_charge_rows == 0) else (daily_rate if (crossover_charge_rows > 0 and booked_coinsurance_rate > daily_rate) else booked_coinsurance_rate)
    - payer_held_rows: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', day_payer='payer_reserved', service_month=month_key)
    - private_held_rows: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', day_payer='resident_private', service_month=month_key)
    - payer_hold: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_reservation_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='payer_reserved', service_month=month_key)
    - private_hold: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_reservation_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='resident_private', service_month=month_key)
    - month_hold: private_hold or payer_hold
    - one_hold: payer_held_rows <= 1 and private_held_rows <= 1 and (payer_hold == None or private_hold == None or payer_hold == private_hold)
    - held_days_booked: XSUM('bedhold', 'bedhold_ledger', 'day_count', event_type='bedhold_day_booked', service_month=month_key)
    - hold_last_held: CFIELD('bedhold', 'end_date', bedhold_reservation_id=month_hold) or ''
    - hold_pays_all: CPARAM('bedhold', 'resident_pays_all_held_days', bedhold_reservation_id=month_hold) == True
    - hold_leave_start: CFIELD('bedhold', 'leave_start_date', bedhold_reservation_id=month_hold) or '9999-12-31'
    - hold_private_start: CFIELD('bedhold', 'private_hold_start_date', bedhold_reservation_id=month_hold) or ''
    - hold_end_offset: MN(DAYS(first_day, hold_last_held) + 1, calendar_days) if hold_last_held != '' else calendar_days
    - privately_held_start: hold_leave_start if (month_hold != None and hold_pays_all) else (hold_private_start if (month_hold != None and hold_private_start != '') else next_first_day)
    - privately_held_days: MX(0, hold_end_offset - MX(0, DAYS(first_day, privately_held_start)))
    - declined_start: XLATEST('bedhold', 'bedhold_reservations', 'leave_start_date', date_field='leave_start_date', status='declined') or '9999-12-31'
    - declined_return: XLATEST('bedhold', 'bedhold_reservations', 'return_date', date_field='leave_start_date', status='declined') or next_first_day
    - ran_out_last_held: XLATEST('bedhold', 'bedhold_reservations', 'end_date', date_field='end_date', end_reason='payer_days_used_no_extension') or '9999-12-30'
    - ran_out_return: XLATEST('bedhold', 'bedhold_reservations', 'return_date', date_field='end_date', end_reason='payer_days_used_no_extension') or next_first_day
    - released_on: XLATEST('bedhold', 'bedhold_reservations', 'release_date', date_field='release_date', status='released') or '9999-12-30'
    - released_return: XLATEST('bedhold', 'bedhold_reservations', 'return_date', date_field='release_date', status='released') or next_first_day
    - unpaid_last_held: XLATEST('bedhold', 'bedhold_reservations', 'end_date', date_field='end_date', end_reason='unpaid_private_hold') or '0001-01-01'
    - maxed_last_held: XLATEST('bedhold', 'bedhold_reservations', 'end_date', date_field='end_date', end_reason='private_hold_max_reached') or '0001-01-01'
    - private_end_last_held: MX(unpaid_last_held, maxed_last_held) if MX(unpaid_last_held, maxed_last_held) != '0001-01-01' else '9999-12-30'
    - private_end_return: (XLATEST('bedhold', 'bedhold_reservations', 'return_date', date_field='end_date', end_reason=('unpaid_private_hold' if unpaid_last_held >= maxed_last_held else 'private_hold_max_reached')) or next_first_day) if private_end_last_held != '9999-12-30' else next_first_day
    - declined_span: MN(DAYS(first_day, declined_return), calendar_days) - MX(0, DAYS(first_day, declined_start))
    - ran_out_span: MN(DAYS(first_day, ran_out_return), calendar_days) - MX(0, DAYS(first_day, ran_out_last_held) + 1)
    - released_span: MN(DAYS(first_day, released_return), calendar_days) - MX(0, DAYS(first_day, released_on) + 1)
    - private_end_span: MN(DAYS(first_day, private_end_return), calendar_days) - MX(0, DAYS(first_day, private_end_last_held) + 1)
    - declined_in_month: declined_span > 0
    - ran_out_in_month: ran_out_span > 0
    - declined_days_out: ((MN(DAYS(first_day, declined_return), calendar_days) - MX(0, DAYS(first_day, declined_start))) + (MN(DAYS(first_day, ran_out_return), calendar_days) - MX(0, DAYS(first_day, ran_out_last_held) + 1))) if (declined_in_month and ran_out_in_month) else ((MN(DAYS(first_day, declined_return), calendar_days) - MX(0, DAYS(first_day, declined_start))) if declined_in_month else ((MN(DAYS(first_day, ran_out_return), calendar_days) - MX(0, DAYS(first_day, ran_out_last_held) + 1)) if ran_out_in_month else 0))
    - released_in_month: released_span > 0
    - private_end_in_month: private_end_span > 0
    - released_days_out: ((MN(DAYS(first_day, released_return), calendar_days) - MX(0, DAYS(first_day, released_on) + 1)) + (MN(DAYS(first_day, private_end_return), calendar_days) - MX(0, DAYS(first_day, private_end_last_held) + 1))) if (released_in_month and private_end_in_month) else ((MN(DAYS(first_day, released_return), calendar_days) - MX(0, DAYS(first_day, released_on) + 1)) if released_in_month else ((MN(DAYS(first_day, private_end_return), calendar_days) - MX(0, DAYS(first_day, private_end_last_held) + 1)) if private_end_in_month else 0))
    - latest_coverage_start: XLATEST('medicare', 'medicare_coverages', 'coverage_start_date', date_field='coverage_start_date') or '0001-01-01'
    - admission_qualifying_discharge: XLATEST('medicare', 'medicare_coverages', 'qualifying_discharge_date', date_field='coverage_start_date') or ''
    - latest_coverage: XLATEST('medicare', 'medicare_coverages', 'medicare_coverage_id', date_field='coverage_start_date')
    - discharged_elsewhere_last_held: XLATEST('bedhold', 'bedhold_reservations', 'end_date', date_field='end_date', end_reason='hospital_discharged_elsewhere') or '0001-01-01'
    - admission_span: DAYS(first_day, latest_coverage_start)
    - departure_span: DAYS(discharged_elsewhere_last_held, next_first_day) - 1
    - admitted_in_month: latest_coverage_start >= first_day and latest_coverage_start < next_first_day and latest_coverage_start == admission_qualifying_discharge
    - left_in_month: discharged_elsewhere_last_held >= first_day and discharged_elsewhere_last_held < next_first_day
    - days_outside_stay: (DAYS(first_day, latest_coverage_start) + DAYS(discharged_elsewhere_last_held, next_first_day) - 1) if (admitted_in_month and left_in_month) else (DAYS(first_day, latest_coverage_start) if admitted_in_month else ((DAYS(discharged_elsewhere_last_held, next_first_day) - 1) if left_in_month else 0))
    - accrual_rows: COUNT('medicaid_ledger', event_type='medicaid_pending_accrual', service_month=month_key)
    - accrual_days: SUM('medicaid_ledger', 'day_count', event_type='medicaid_pending_accrual', service_month=month_key)
    - days_in_center: accrual_days if accrual_rows > 0 else calendar_days
    - payer_held_entry: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_entry_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='payer_reserved', service_month=month_key)
    - private_held_entry: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_entry_id', date_field='entry_date', event_type='bedhold_day_booked', day_payer='resident_private', service_month=month_key)
    - held_days_reversed: (XSUM('bedhold', 'bedhold_ledger', 'day_count', event_type='bedhold_day_reversed', days_entry_id=payer_held_entry) if payer_held_entry else 0) + (XSUM('bedhold', 'bedhold_ledger', 'day_count', event_type='bedhold_day_reversed', days_entry_id=private_held_entry) if private_held_entry else 0)
    - month_bookings: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', service_month=month_key)
    - latest_coverage_bookings: XSUM('medicare', 'medicare_ledger', 'day_count', event_type='medicare_days_booked', service_month=month_key, medicare_coverage_id=latest_coverage)
    - away_accounted: MX(0, declined_span) + MX(0, ran_out_span) + MX(0, released_span) + MX(0, private_end_span) + (MX(0, admission_span) if (latest_coverage_start >= first_day and latest_coverage_start < next_first_day and latest_coverage_start == admission_qualifying_discharge) else 0) + (MX(0, departure_span) if (discharged_elsewhere_last_held >= first_day and discharged_elsewhere_last_held < next_first_day) else 0)
    - month_priced: accrual_rows > 0 and one_hold and month_bookings == latest_coverage_bookings and (days_in_center + held_days_booked - held_days_reversed + away_accounted == calendar_days)
    - medicaid_days: MX(0, calendar_days - full_coverage_days - lapsed_certification_days - coinsurance_days - privately_held_days - declined_days_out - released_days_out - days_outside_stay)
    - month_cost_of_care: RND(medicaid_days * daily_rate + 0.000000001, 2) + RND(coinsurance_days * coinsurance_day_price + 0.000000001, 2)
    - base_cost_of_care: RND(days_in_center * daily_rate + 0.000000001, 2)
    - cost_applied: month_cost_of_care if month_priced else base_cost_of_care
    - result: 0 if F('status') != 'pending' else RND(MX(0, estimate_billed - cost_applied) + 0.000000001, 2)
    compute_basis:
      month_index: The review covers the calendar month before the current month on a case that is pending, and the case's patient pay charge with charge basis estimated_pending for that service month; the estimate for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed, or the case is not in status pending, the reduction is zero.
      month_key: The review covers the calendar month before the current month on a case that is pending, and the case's patient pay charge with charge basis estimated_pending for that service month; the estimate for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed, or the case is not in status pending, the reduction is zero.
      first_day: The review covers the calendar month before the current month on a case that is pending, and the case's patient pay charge with charge basis estimated_pending for that service month; the estimate for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed, or the case is not in status pending, the reduction is zero.
      next_first_day: The review covers the calendar month before the current month on a case that is pending, and the case's patient pay charge with charge basis estimated_pending for that service month; the estimate for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed, or the case is not in status pending, the reduction is zero.
      estimate_billed: The review covers the calendar month before the current month on a case that is pending, and the case's patient pay charge with charge basis estimated_pending for that service month; the estimate for the month is the amount billed on that charge less the reductions already posted for that service month, and where no such charge was billed, or the case is not in status pending, the reduction is zero.
      calendar_days: The cost of care a pending estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them.
      daily_rate: The cost of care a pending estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them.
      full_coverage_days: The cost of care a pending estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them.
      coinsurance_days: The cost of care a pending estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them.
      lapsed_certification_days: The cost of care a pending estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them.
      booked_coinsurance_rate: The cost of care a pending estimate month carries is every calendar day of the month priced at the Medicaid daily rate on the case, except that the Part A days Medicare covers in full (days booked for the month in benefit days 1 through 20, less the days reversed from those bookings) and the days a lapsed physician certification leaves to the center (days reversed as uncertified_day from the month's bookings) carry no cost, and the Part A coinsurance days (days booked for the month in benefit days 21 through 100, less the days reversed from those bookings) are priced at the highest daily coinsurance booked for them.
      crossover_charge_rows: 'The price of a Part A coinsurance day in a pending estimate month follows who is billed the coinsurance for the month: where the month''s coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer, nothing, since the Medigap plan and the resident bear that coinsurance and the Medicare billing record charges it to them; where it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate, the Medicaid daily rate, since the program''s crossover payment for a day never exceeds what it pays for a Medicaid day; otherwise the highest daily coinsurance booked for the month.'
      private_share_rows: 'The price of a Part A coinsurance day in a pending estimate month follows who is billed the coinsurance for the month: where the month''s coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer, nothing, since the Medigap plan and the resident bear that coinsurance and the Medicare billing record charges it to them; where it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate, the Medicaid daily rate, since the program''s crossover payment for a day never exceeds what it pays for a Medicaid day; otherwise the highest daily coinsurance booked for the month.'
      coinsurance_day_price: 'The price of a Part A coinsurance day in a pending estimate month follows who is billed the coinsurance for the month: where the month''s coinsurance is billed to the Medigap carrier or the resident and none of it to the Medical Assistance program as crossover payer, nothing, since the Medigap plan and the resident bear that coinsurance and the Medicare billing record charges it to them; where it is billed to the program as crossover payer and the highest daily coinsurance booked for the month is above the Medicaid daily rate, the Medicaid daily rate, since the program''s crossover payment for a day never exceeds what it pays for a Medicaid day; otherwise the highest daily coinsurance booked for the month.'
      payer_held_rows: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      private_held_rows: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      payer_hold: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      private_hold: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      month_hold: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      one_hold: 'The pending-month review prices the month it covers where the bed-hold days booked for the month all belong to one bed-hold reservation, the month''s Part A days were all booked by the resident''s coverage with the latest coverage start, and every day of the month is accounted for once: the days in the center that the pending accrual posted for the month counts, the bed-hold days booked for the month less the days reversed from those bookings, the days with no bed held that the two schedules on days away read, the days before a skilled admission inside the month and the days after a held bed''s last held day inside the month where the hospital discharged the resident elsewhere add up to the month''s calendar days; for any other month the cost of care stays the days in the center times the Medicaid daily rate, rounded half up to the cent, the days in the center being those the month''s pending accrual counts, or every calendar day where no accrual was posted, and a month of admission, discharge or death takes its patient pay under the partial-month rule restated above.'
      held_days_booked: 'The pending-month review prices the month it covers where the bed-hold days booked for the month all belong to one bed-hold reservation, the month''s Part A days were all booked by the resident''s coverage with the latest coverage start, and every day of the month is accounted for once: the days in the center that the pending accrual posted for the month counts, the bed-hold days booked for the month less the days reversed from those bookings, the days with no bed held that the two schedules on days away read, the days before a skilled admission inside the month and the days after a held bed''s last held day inside the month where the hospital discharged the resident elsewhere add up to the month''s calendar days; for any other month the cost of care stays the days in the center times the Medicaid daily rate, rounded half up to the cent, the days in the center being those the month''s pending accrual counts, or every calendar day where no accrual was posted, and a month of admission, discharge or death takes its patient pay under the partial-month rule restated above.'
      hold_last_held: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      hold_pays_all: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      hold_leave_start: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      hold_private_start: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      hold_end_offset: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      privately_held_start: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      privately_held_days: 'The first privately paid held day of a pending estimate month, reading the bed-hold reservation the month''s booked held days belong to: where that reservation is a hold whose every held day is the resident''s own charge (a private-pay hold or a hold during a Medicare skilled stay), its leave start; where it is a Medicaid reserved bed whose private extension has begun, its private hold start; otherwise none (the first day of the next month), since the program pays the reserved days and patient pay is unchanged for them. The days of the month from that first day through the reservation''s last held day (through the month''s end where the bed is still held) are taken out.'
      declined_start: 'Days of a pending estimate month away after a bed was declined or ran out: where the resident''s latest reservation in status declined, by leave start, and the resident''s latest reservation that ended because the payer''s reserved days were used with no private extension, by end date, both fall in part inside the month, the days of the month from the declined leave''s start up to the day before its return and the days after that other reservation''s last held day up to the day before its return are both taken out; where only that declined leave does, the days from its leave start up to the day before its return (to the month''s end where the resident has not come back); where only that other reservation does, the days after its last held day up to the day before its return; otherwise none.'
      declined_return: 'Days of a pending estimate month away after a bed was declined or ran out: where the resident''s latest reservation in status declined, by leave start, and the resident''s latest reservation that ended because the payer''s reserved days were used with no private extension, by end date, both fall in part inside the month, the days of the month from the declined leave''s start up to the day before its return and the days after that other reservation''s last held day up to the day before its return are both taken out; where only that declined leave does, the days from its leave start up to the day before its return (to the month''s end where the resident has not come back); where only that other reservation does, the days after its last held day up to the day before its return; otherwise none.'
      ran_out_last_held: 'Days of a pending estimate month away after a bed was declined or ran out: where the resident''s latest reservation in status declined, by leave start, and the resident''s latest reservation that ended because the payer''s reserved days were used with no private extension, by end date, both fall in part inside the month, the days of the month from the declined leave''s start up to the day before its return and the days after that other reservation''s last held day up to the day before its return are both taken out; where only that declined leave does, the days from its leave start up to the day before its return (to the month''s end where the resident has not come back); where only that other reservation does, the days after its last held day up to the day before its return; otherwise none.'
