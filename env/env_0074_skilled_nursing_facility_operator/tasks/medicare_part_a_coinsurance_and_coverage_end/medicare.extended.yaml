    pay_fig:
    - The bank draft adds, over the days it counts, the daily rate times the share each day takes, divides the sum
      by 100 and rounds it half up to the cent once.
    - The bank draft counts the settled block's covered days, which are its booked days less every day reversed
      against its booked-days entry; the rounded figure less the payments already applied to the resident's charge,
      net of any returned payments, is the bank draft, never less than nothing.
    - 'For a block that passes its record test, the resident coinsurance charge, the card payment, the rate-year
      correction, the reduction for reversed covered days and the bank draft each count the days before the supplemental
      effective date as their own policies state, and only for such a block; for every other block, the tier that
      sets the split is the one in effect on the days of service: a Medigap policy changes the split from the carrier''s
      policy effective date and QMB protection from the first day of the month after the state''s QMB determination,
      so days before the supplemental effective date keep the earlier split, and none of these five figures is priced
      for it.'
    chg_amt_x: A bank draft worked out above the resident's charge's open balance, which is its amount less the
      payments and adjustments posted against it plus any returned payments, shows that the charge was billed below
      what its days call for; the bank draft is then not taken under this policy, and any payment the payer sends
      is applied only up to that open balance, the remainder being returned.
    chg_adj_x: A bank draft worked out above the resident's charge's open balance, which is its amount less the
      payments and adjustments posted against it plus any returned payments, shows that the charge was billed below
      what its days call for; the bank draft is then not taken under this policy, and any payment the payer sends
      is applied only up to that open balance, the remainder being returned.
    open_x: A bank draft worked out above the resident's charge's open balance, which is its amount less the payments
      and adjustments posted against it plus any returned payments, shows that the charge was billed below what
      its days call for; the bank draft is then not taken under this policy, and any payment the payer sends is
      applied only up to that open balance, the remainder being returned.
  factors:
  - id: f_year_rate
    effect: parameter
    decides: yr_rate
    bindings:
    - yr_rate
    ladder:
    - when: the settled block's last service date falls in calendar year 2025
      value: K('rate_2025') = 209.50 a day
    - when: the settled block's last service date falls in calendar year 2024
      value: K('rate_2024') = 204.00 a day
    - when: otherwise
      value: K('rate_2026') = 217.00 a day
    baseline:
      yr_rate: K('rate_2026')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: f_carried_split
    effect: parameter
    decides: early_share
    bindings:
    - cs_n
    - cs_amt
    - cs_days
    - cs_rate
    - cs_sec
    - cs_pct
    - early_share
    ladder:
    - when: the block before the settled block has a resident charge billing half of that charge's own days times
        its own daily rate (within half a percentage point)
      value: K('share_k') = 50 percent
    - when: that resident charge bills a quarter of its own days times its own daily rate (within half a percentage
        point)
      value: K('share_l') = 25 percent
    - when: the block before the settled block carries a secondary charge and no resident charge
      value: K('share_full') = 0 percent
    - when: otherwise
      value: K('share_none') = 100 percent
    baseline:
      early_share: K('share_none')
    evidence:
    - history
    cross_difficulty: null
  - id: f_held_nights
    effect: method
    decides: held_off
    bindings:
    - hn_n
    - hn_from
    - hn_to
    - hn_s
    - hn_e
    - held_off
    ladder:
    - when: the bed-hold records book a leave for the settled block's service month AND its last held night inside
        the settled block falls before the supplemental effective date
      method: take off every held night of it inside the settled block
    - when: the bed-hold records book a leave for the settled block's service month AND the supplemental effective
        date falls after its first held night inside the settled block and on or before its last
      method: take off its held nights from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      held_off: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: bedhold
  - id: f_hospital_reversal
    effect: method
    decides: hosp_off
    bindings:
    - hosp_off
    ladder:
    - when: the settled block's booked-days entry carries a hospital-day reversal AND its last reversed day inside
        the settled block falls before the supplemental effective date
      method: take off every reversed day of it inside the settled block
    - when: the settled block's booked-days entry carries a hospital-day reversal AND the supplemental effective
        date falls after its first reversed day inside the settled block and on or before its last
      method: take off its reversed days from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      hosp_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: f_absence_reversal
    effect: method
    decides: abs_off
    bindings:
    - abs_off
    ladder:
    - when: the settled block's booked-days entry carries a leave-of-absence reversal AND its last reversed day
        inside the settled block falls before the supplemental effective date
      method: take off every reversed day of it inside the settled block
    - when: the settled block's booked-days entry carries a leave-of-absence reversal AND the supplemental effective
        date falls after its first reversed day inside the settled block and on or before its last
      method: take off its reversed days from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      abs_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: f_uncertified_days
    effect: method
    decides: unc_off
    bindings:
    - unc_span
    - unc_lv
    - unc_hd
    - unc_ld
    - unc_off
    ladder:
    - when: the settled block's booked-days entry carries an uncertified-day reversal AND the last day of its span
        falls before the supplemental effective date
      method: take off every day of its span less the held nights and the hospital-day and leave-of-absence days
        inside it
    - when: the settled block's booked-days entry carries an uncertified-day reversal AND the supplemental effective
        date falls after the first day of its span and on or before its last
      method: take off the days of its span up to the day before the date, less the held nights and the hospital-day
        and leave-of-absence days inside that part
    - when: otherwise
      method: take off nothing
    baseline:
      unc_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The bank draft prices each day it counts at the daily coinsurance rate of 217.00, and days before the
      supplemental effective date take the earlier share of 100 percent. The bank draft counts the settled block''s
      covered days, which are its booked days less every day reversed against its booked-days entry; the rounded
      figure less the payments already applied to the resident''s charge, net of any returned payments, is the bank
      draft, never less than nothing. The days the bank draft counts before the supplemental effective date are
      first its calendar days of the settled block before that date: when the date falls after the settled block''s
      first service date and on or before its last, the days from the first service date up to the day before the
      date; when it falls after the last service date, every calendar day of the settled block; otherwise none.
      Days the bank draft counts before the supplemental effective date take the earlier share; every other day
      it counts takes the resident share of the tier on file. The bank draft adds, over the days it counts, the
      daily rate times the share each day takes, divides the sum by 100 and rounds it half up to the cent once.'
    params:
    - rate_2026
    - share_none
  inputs:
    history:
    - table: medicare_ledger
      aggregate: latest
      field: day_count
      filters:
        event_type: medicare_days_booked
        day_band: days_21_100
    - table: medicare_ledger
      aggregate: latest
      field: from_date
      filters:
        event_type: medicare_days_reversed
    - table: medicare_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: medicare_coinsurance_charge
        liable_party: resident
    - category: bedhold
      table: bedhold_ledger
      aggregate: latest
      field: from_date
      filters:
        event_type: bedhold_day_booked
    - category: bedhold
      table: bedhold_ledger
      aggregate: count
      field: bedhold_entry_id
      filters:
        event_type: bedhold_day_booked
    cross_category:
    - bedhold
