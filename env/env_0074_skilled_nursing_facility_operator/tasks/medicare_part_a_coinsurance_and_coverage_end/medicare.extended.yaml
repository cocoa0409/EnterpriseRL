    chg_id: A card payment the resident or representative makes during the call is applied to the resident's original
      coinsurance charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days
      entries in the band of benefit days 21 through 100 the one whose last service date is the latest, and it settles
      the resident's share of the days that charge prices less the payments already applied to that charge.
    chg_paid: The card payment counts the paid block's covered days, which are its booked days less every day reversed
      against its booked-days entry, once the resident's charge for the paid block stands, and no day before it
      stands; the rounded figure less the payments already applied to that charge, net of any returned payments,
      is the card payment, never less than nothing and never more than the card payment maximum of 5000.00.
    chg_returned: The card payment counts the paid block's covered days, which are its booked days less every day
      reversed against its booked-days entry, once the resident's charge for the paid block stands, and no day before
