  factors:
  - id: f_year_rate
    effect: parameter
    decides: yr_rate
    bindings:
    - yr_rate
    ladder:
    - when: the corrected block's last service date falls in 2026 or later
      value: K('rate_2026') = 217.00 a day
    - when: the corrected block's last service date falls in calendar year 2025
      value: K('rate_2025') = 209.50 a day
    - when: otherwise (the record test leaves a last service date in 2024)
      value: K('rate_2024') = 204.00 a day
    baseline:
      yr_rate: K('rate_2024')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: f_carried_split
    effect: parameter
    decides: early_share
    bindings:
    - cs_n
    - cs_amt
    - cs_days
    - cs_rate
    - cs_sec
    - cs_pct
    - early_share
    ladder:
    - when: the block before the corrected block has a resident charge billing half of that charge's own days times
        its own daily rate (within half a percentage point)
      value: K('share_k') = 50 percent
    - when: that resident charge bills a quarter of its own days times its own daily rate (within half a percentage
        point)
      value: K('share_l') = 25 percent
    - when: the block before the corrected block carries a secondary charge and no resident charge
      value: K('share_full') = 0 percent
    - when: otherwise
      value: K('share_none') = 100 percent
    baseline:
      early_share: K('share_none')
    evidence:
    - history
    cross_difficulty: null
  - id: f_held_nights
    effect: method
    decides: held_off
    bindings:
    - hn_n
    - hn_from
    - hn_to
    - hn_s
    - hn_e
    - held_off
    ladder:
    - when: the bed-hold records book a leave for the corrected block's service month AND its last held night inside
        the corrected block falls before the supplemental effective date
      method: take off every held night of it inside the corrected block
    - when: the bed-hold records book a leave for the corrected block's service month AND the supplemental effective
        date falls after its first held night inside the corrected block and on or before its last
      method: take off its held nights from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      held_off: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: bedhold
  - id: f_hospital_reversal
    effect: method
    decides: hosp_off
    bindings:
    - hosp_off
    ladder:
    - when: the corrected block's booked-days entry carries a hospital-day reversal posted on or before the date
        the charge was posted AND its last reversed day inside the corrected block falls before the supplemental
        effective date
      method: take off every reversed day of it inside the corrected block
    - when: the corrected block's booked-days entry carries a hospital-day reversal posted on or before the date
        the charge was posted AND the supplemental effective date falls after its first reversed day inside the
        corrected block and on or before its last
      method: take off its reversed days from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      hosp_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: f_absence_reversal
    effect: method
    decides: abs_off
    bindings:
    - abs_off
    ladder:
    - when: the corrected block's booked-days entry carries a leave-of-absence reversal posted on or before the
        date the charge was posted AND its last reversed day inside the corrected block falls before the supplemental
        effective date
      method: take off every reversed day of it inside the corrected block
    - when: the corrected block's booked-days entry carries a leave-of-absence reversal posted on or before the
        date the charge was posted AND the supplemental effective date falls after its first reversed day inside
        the corrected block and on or before its last
      method: take off its reversed days from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      abs_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The rate-year correction prices each day it counts at the daily coinsurance rate of 204.00 as the year-of-service
      rate, and days before the supplemental effective date take the earlier share of 100 percent. The rate-year
      correction counts the days the resident''s charge prices and works the figure twice, once at the daily rate
      that charge records and once at the year-of-service rate; the correction is the first rounded figure less
      the second, never less than nothing and never more than the charge''s open balance, which is its amount less
      the payments and adjustments posted against it plus any returned payments. The days the rate-year correction
      counts before the supplemental effective date are first its calendar days of the corrected block before that
      date: when the date falls after the corrected block''s first service date and on or before its last, the days
      from the first service date up to the day before the date; when it falls after the last service date, every
      calendar day of the corrected block; otherwise none. Days the rate-year correction counts before the supplemental
      effective date take the earlier share; every other day it counts takes the resident share of the tier on file.
      The rate-year correction adds, over the days it counts, the daily rate times the share each day takes, divides
      the sum by 100 and rounds it half up to the cent once.'
    params:
    - rate_2024
    - share_none
  inputs:
    history:
    - table: medicare_ledger
      aggregate: latest
      field: day_count
      filters:
        event_type: medicare_days_booked
        day_band: days_21_100
    - table: medicare_ledger
      aggregate: latest
      field: from_date
      filters:
        event_type: medicare_days_reversed
    - table: medicare_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: medicare_coinsurance_charge
        liable_party: resident
    - category: bedhold
      table: bedhold_ledger
      aggregate: latest
      field: from_date
      filters:
        event_type: bedhold_day_booked
    - category: bedhold
      table: bedhold_ledger
      aggregate: count
      field: bedhold_entry_id
      filters:
        event_type: bedhold_day_booked
    cross_category:
    - bedhold
- id: medicare_ext_reversed_day_reduction
  base_policy_refs:
  - medicare_evt_secondary_and_qmb
  - medicare_evt_day_counting
  - medicare_evt_coinsurance
  - medicare_coverage_tier_change
  overwrite:
  - base_policy: medicare_evt_coinsurance
    superseded_clause: 'The tier that sets the split is the one in effect on the days of service: a Medigap policy
      changes the split from the carrier''s policy effective date and QMB protection from the first day of the month
      after the state''s QMB determination, so days before the supplemental effective date keep the earlier split.'
    replaced_by: 'For a block that passes its record test, the resident coinsurance charge, the card payment, the
      rate-year correction, the reduction for reversed covered days and the bank draft each count the days before
      the supplemental effective date as their own policies state, and only for such a block; for every other block,
      the tier that sets the split is the one in effect on the days of service: a Medigap policy changes the split
      from the carrier''s policy effective date and QMB protection from the first day of the month after the state''s
      QMB determination, so days before the supplemental effective date keep the earlier split, and none of these
      five figures is priced for it.'
  trigger: state_due
  subject:
  - medicare_coinsurance_adjustment
  computes: amount
  target_tool: reduce_coinsurance_for_reversed_days_0894f336
  params:
    rate_2026: 217.0
    rate_2025: 209.5
    rate_2024: 204.0
    share_none: 100
    share_k: 50
    share_l: 25
    share_full: 0
  rule: >-
    The reduction for reversed covered days on a resident coinsurance charge applies to the resident's original
    coinsurance charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days
    entries in the band of benefit days 21 through 100 the one whose last service date is the latest, and it prices
    the days of the uncertified-day reversal posted against that booked-days entry after the charge was posted,
    under that reversal's own reason. A reduction for reversed covered days on a resident coinsurance charge is
    fixed only after the records carry a rate-year correction against that charge whenever the charge's recorded
    daily rate is above the rate of the year in which its days were furnished and its days take a resident share
    above nothing under the split in effect on them. The reduction for reversed covered days is worked out only
    for a lapse's block that passes this record test: its service month carries one booked-days entry in the band
    of benefit days 21 through 100; at most one such entry of the coverage has the last benefit day just before
    the lapse's block's first benefit day; the bed-hold records book at most one leave for its service month and
    take back none of that leave's held days; its booked-days entry carries at most one day reversal for each reason
    and none for a booking error; no hospital-day or leave-of-absence reversal on it covers a held night of that
    leave, and each such reversal counts every day of its span; an uncertified-day reversal on it counts every day
    of its span except the held nights and the hospital-day and leave-of-absence days inside the span; and, when
    the supplemental effective date falls after the lapse's block's first service date, the block before it either
    has a resident charge billing exactly 100, 50 or 25 percent of that charge's own days times its own daily rate,
    to within half a percentage point, or carries a secondary charge and no resident charge; and, when the resident's
    charge for the lapse's block stands, its day count equals the lapse's block's booked days less the days of every
    day reversal posted against its booked-days entry on or before the date that charge was posted; and the lapse's
    block's last service date falls in 2024 or later, and the charge's open balance is above nothing. For a block
    that passes its record test, the resident coinsurance charge, the card payment, the rate-year correction, the
    reduction for reversed covered days and the bank draft each count the days before the supplemental effective
    date as their own policies state, and only for such a block; for every other block, the tier that sets the split
    is the one in effect on the days of service: a Medigap policy changes the split from the carrier's policy effective
    date and QMB protection from the first day of the month after the state's QMB determination, so days before
    the supplemental effective date keep the earlier split, and none of these five figures is priced for it. The
    reduction for reversed covered days prices each reversed day at the daily rate the resident's charge records,
    and reversed days before the supplemental effective date take the earlier share of 100 percent. The daily rate
    the reduction for reversed covered days applies is the rate the charge stands at: when the records carry a rate-year
    correction against the charge and the lapse's block has its last service date in 2025, 209.50 a day; when they
    carry one and that date falls in 2024, 204.00 a day; when they carry one and that date falls in 2026 or later,
    217.00 a day; and otherwise the daily rate the charge records. The supplemental effective date the reduction
    for reversed covered days reads is the one recorded on the coverage; a coverage that records none has the tier
    on file in effect on every day of the lapse's block. The reduction for reversed covered days counts the reversal's
    day count, and it never exceeds the charge's open balance, which is its amount less the payments and adjustments
    posted against it plus any returned payments. The reversed days the reduction for reversed covered days counts
    before the supplemental effective date are first the days of the reversal's span before that date: all of the
    span when its last day falls before the date, the days from its first day up to the day before the date when
    the date falls after its first day and on or before its last, and none otherwise. Each kind of day named below
    that lies inside that part of the span, and that the lapse therefore did not reverse, is taken off those days,
    never leaving fewer than none nor more than the reversal's day count; the reversal's other days fall from the
    date. Reversed days the reduction for reversed covered days counts before the supplemental effective date take
    the earlier share; every other reversed day takes the resident share of the tier on file. The block before the
    lapse's block is the coverage's booked-days entry in the band of benefit days 21 through 100 whose last benefit
    day is the day before the lapse's block's first benefit day; its resident charge is the resident coinsurance
    charge posted for it that is not a rebill of a denied secondary share. The earlier share the reduction for reversed
    covered days applies is read from the block before: 50 percent when its resident charge bills half of that charge's
    own days times its own daily rate, to within half a percentage point; 25 percent when it bills a quarter, to
    within half a percentage point; 0 percent when the block before carries a secondary charge and no resident charge;
    and 100 percent otherwise. A held night of the bed-hold leave booked for the lapse's block's service month is
    not a day the uncertified lapse reverses: the held nights that lie inside the reversal's span come off the lapse's
    days before the supplemental effective date, all of that overlap when its last day falls before the date, the
    overlap from its first day up to the day before the date when the date falls after its first day and on or before
    its last, and none otherwise or when there is no such record. A day already reversed as a hospital day on the
    lapse's block is not a day the uncertified lapse reverses: the days of the hospital-day reversal that lie inside
    the reversal's span come off the lapse's days before the supplemental effective date, all of that overlap when
    its last day falls before the date, the overlap from its first day up to the day before the date when the date
    falls after its first day and on or before its last, and none otherwise or when there is no such record. A day
    already reversed as a leave-of-absence day on the lapse's block is not a day the uncertified lapse reverses:
    the days of the leave-of-absence reversal that lie inside the reversal's span come off the lapse's days before
    the supplemental effective date, all of that overlap when its last day falls before the date, the overlap from
    its first day up to the day before the date when the date falls after its first day and on or before its last,
    and none otherwise or when there is no such record. The reduction for reversed covered days adds, over the days
    it counts, the daily rate times the share each day takes, divides the sum by 100 and rounds it half up to the
    cent once. When the tier on file prohibits balance billing, as the QMB Medicaid Crossover tier does, the reduction
    for reversed covered days bills the resident nothing for any day on or after the tier's supplemental effective
    date, those days taking the tier's resident share of nothing, while days before that date keep the earlier split,
    QMB protection not reaching back before it.
  prerequisite:
  - problem: medicare_ext_resident_rate_year_correction
    kind: value_input
    gate: red_rate
    form: state
    policy_source: A reduction for reversed covered days on a resident coinsurance charge is fixed only after the
      records carry a rate-year correction against that charge whenever the charge's recorded daily rate is above
      the rate of the year in which its days were furnished and its days take a resident share above nothing under
      the split in effect on them.
    condition: medicare_ledger carries a medicare_coinsurance_adjustment with adjustment_reason rate_year_correction
      naming the resident charge of the latest booked days_21_100 entry, whenever that charge's daily_coinsurance_rate
      is above the rate of its year of service and its days take a resident share above zero under the split in
      effect on them
    resolved_by: correct_coinsurance_rate_feac0074
    effect: once a rate-year correction stands against the charge, red_rate reads the year-of-service rate instead
      of the rate the charge records, so each reversed day is priced at the rate the charge now stands at
  cross_category:
  - category: bedhold
    as: history
    reads:
    - bedhold_ledger.from_date
    - bedhold_ledger.to_date
    - bedhold_ledger.service_month
    - bedhold_ledger.bedhold_entry_id
    - bedhold_ledger.days_entry_id
    note: f_held_in_lapse reads the held nights the bed-hold ledger books for the lapse's block's service month
  compute:
  - blk_id: LATEST('medicare_ledger', 'medicare_entry_id', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_from: LATEST('medicare_ledger', 'from_date', date_field='to_date', event_type='medicare_days_booked', day_band='days_21_100')
  - blk_to: LATEST('medicare_ledger', 'to_date', date_field='to_date', event_type='medicare_days_booked', day_band='days_21_100')
  - blk_month: LATEST('medicare_ledger', 'service_month', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_first: LATEST('medicare_ledger', 'first_benefit_day', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_booked: LATEST('medicare_ledger', 'day_count', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_cnt: COUNT('medicare_ledger', event_type='medicare_days_booked', day_band='days_21_100', service_month=blk_month)
  - eff_on_file: F('supplemental_effective_date')
  - eff_cut: eff_on_file if (eff_on_file != None and eff_on_file != '') else '1900-01-01'
  - cal_before: DAYS(blk_from, eff_cut) if (DAYS(blk_from, eff_cut) > 0 and DAYS(eff_cut, blk_to) >= 0) else (DAYS(blk_from,
      blk_to) + 1 if DAYS(eff_cut, blk_to) < 0 else 0)
  - tier_share: P('resident_coinsurance_share_pct')
  - prev_cnt: COUNT('medicare_ledger', event_type='medicare_days_booked', day_band='days_21_100', last_benefit_day=blk_first
      - 1)
  - prev_blk: LATEST('medicare_ledger', 'medicare_entry_id', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100', last_benefit_day=blk_first - 1)
  - prev_res_n: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', days_entry_id=prev_blk,
      charge_entry_id='')
  - prev_res_amt: SUM('medicare_ledger', 'amount', event_type='medicare_coinsurance_charge', liable_party='resident',
      days_entry_id=prev_blk, charge_entry_id='')
  - prev_res_days: LATEST('medicare_ledger', 'day_count', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - prev_res_rate: LATEST('medicare_ledger', 'daily_coinsurance_rate', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - prev_sec: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medigap_carrier')
      + COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medicaid_crossover')
  - prev_pct: (prev_res_amt * 100 / (prev_res_days * prev_res_rate)) if (prev_res_n == 1 and prev_blk != None) else
      -1
  - prev_ok: (prev_pct > 99.5 and prev_pct < 100.5) or (prev_pct > 49.5 and prev_pct < 50.5) or (prev_pct > 24.5
      and prev_pct < 25.5) or (prev_blk != None and prev_res_n == 0 and prev_sec > 0)
  - lv_n: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', service_month=blk_month)
  - lv_from_r: XLATEST('bedhold', 'bedhold_ledger', 'from_date', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_to_r: XLATEST('bedhold', 'bedhold_ledger', 'to_date', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_id: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_entry_id', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_rev: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_reversed', days_entry_id=lv_id) if lv_id
      != None else 0
  - lv_s: MX(lv_from_r, blk_from) if lv_from_r != None else '2999-12-31'
  - lv_e: MN(lv_to_r, blk_to) if lv_to_r != None else '1900-01-01'
  - hd_n: COUNT('medicare_ledger', event_type='medicare_days_reversed', days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_from_r: LATEST('medicare_ledger', 'from_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_to_r: LATEST('medicare_ledger', 'to_date', date_field='from_date', event_type='medicare_days_reversed', days_entry_id=blk_id,
      adjustment_reason='hospital_day')
  - hd_days_r: LATEST('medicare_ledger', 'day_count', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_f: hd_from_r if hd_from_r != None else '2999-12-31'
  - hd_t: hd_to_r if hd_to_r != None else '1900-01-01'
  - hd_days: hd_days_r if hd_days_r != None else 0
  - hd_s: MX(hd_f, blk_from)
  - hd_e: MN(hd_t, blk_to)
  - ld_n: COUNT('medicare_ledger', event_type='medicare_days_reversed', days_entry_id=blk_id, adjustment_reason='leave_of_absence_day')
  - ld_from_r: LATEST('medicare_ledger', 'from_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='leave_of_absence_day')
