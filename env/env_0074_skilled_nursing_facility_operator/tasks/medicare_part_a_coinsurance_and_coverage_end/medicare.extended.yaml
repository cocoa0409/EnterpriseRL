    chg_id: The reduction for reversed covered days on a resident coinsurance charge applies to the resident's original
      coinsurance charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days
      entries in the band of benefit days 21 through 100 the one whose last service date is the latest, and it prices
      the days of the uncertified-day reversal posted against that booked-days entry after the charge was posted,
      under that reversal's own reason.
    chg_paid: The reduction for reversed covered days counts the reversal's day count, and it never exceeds the
      charge's open balance, which is its amount less the payments and adjustments posted against it plus any returned
      payments.
    chg_returned: The reduction for reversed covered days counts the reversal's day count, and it never exceeds
      the charge's open balance, which is its amount less the payments and adjustments posted against it plus any
      returned payments.
