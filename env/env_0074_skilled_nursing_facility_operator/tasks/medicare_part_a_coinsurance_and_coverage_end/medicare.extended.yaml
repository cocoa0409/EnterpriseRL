  factors:
  - id: f_year_rate
    effect: parameter
    decides: yr_rate
    bindings:
    - yr_rate
    ladder:
    - when: the charged block's last service date falls in calendar year 2025
      value: K('rate_2025') = 209.50 a day
    - when: the charged block's last service date falls in calendar year 2024
      value: K('rate_2024') = 204.00 a day
    - when: otherwise
      value: K('rate_2026') = 217.00 a day
    baseline:
      yr_rate: K('rate_2026')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: f_carried_split
    effect: parameter
    decides: early_share
    bindings:
    - cs_n
    - cs_amt
    - cs_days
    - cs_rate
    - cs_sec
    - cs_pct
    - early_share
    ladder:
    - when: the block before the charged block has a resident charge billing half of that charge's own days times
        its own daily rate (within half a percentage point)
      value: K('share_k') = 50 percent
    - when: that resident charge bills a quarter of its own days times its own daily rate (within half a percentage
        point)
      value: K('share_l') = 25 percent
    - when: the block before the charged block carries a secondary charge and no resident charge
      value: K('share_full') = 0 percent
    - when: otherwise
      value: K('share_none') = 100 percent
    baseline:
      early_share: K('share_none')
    evidence:
    - history
    cross_difficulty: null
  - id: f_held_nights
    effect: method
    decides: held_off
    bindings:
    - hn_n
    - hn_from
    - hn_to
    - hn_s
    - hn_e
    - held_off
    ladder:
    - when: the bed-hold records book a leave for the charged block's service month AND its last held night inside
        the charged block falls before the supplemental effective date
      method: take off every held night of it inside the charged block
    - when: the bed-hold records book a leave for the charged block's service month AND the supplemental effective
        date falls after its first held night inside the charged block and on or before its last
      method: take off its held nights from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      held_off: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: bedhold
  - id: f_hospital_reversal
    effect: method
    decides: hosp_off
    bindings:
    - hosp_off
    ladder:
    - when: the charged block's booked-days entry carries a hospital-day reversal AND its last reversed day inside
        the charged block falls before the supplemental effective date
      method: take off every reversed day of it inside the charged block
    - when: the charged block's booked-days entry carries a hospital-day reversal AND the supplemental effective
        date falls after its first reversed day inside the charged block and on or before its last
      method: take off its reversed days from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      hosp_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: f_uncertified_days
    effect: method
    decides: unc_off
    bindings:
    - unc_span
    - unc_lv
    - unc_hd
    - unc_ld
    - unc_off
    ladder:
    - when: the charged block's booked-days entry carries an uncertified-day reversal AND the last day of its span
        falls before the supplemental effective date
      method: take off every day of its span less the held nights and the hospital-day and leave-of-absence days
        inside it
    - when: the charged block's booked-days entry carries an uncertified-day reversal AND the supplemental effective
        date falls after the first day of its span and on or before its last
      method: take off the days of its span up to the day before the date, less the held nights and the hospital-day
        and leave-of-absence days inside that part
    - when: otherwise
      method: take off nothing
    baseline:
      unc_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The resident coinsurance charge prices each day it counts at the daily coinsurance rate of 217.00, and
      days before the supplemental effective date take the earlier share of 100 percent. The resident coinsurance
      charge counts the charged block''s covered days, which are its booked days less every day reversed against
      its booked-days entry. The days the resident coinsurance charge counts before the supplemental effective date
      are first its calendar days of the charged block before that date: when the date falls after the charged block''s
      first service date and on or before its last, the days from the first service date up to the day before the
      date; when it falls after the last service date, every calendar day of the charged block; otherwise none.
      Days the resident coinsurance charge counts before the supplemental effective date take the earlier share;
      every other day it counts takes the resident share of the tier on file. The resident coinsurance charge adds,
      over the days it counts, the daily rate times the share each day takes, divides the sum by 100 and rounds
      it half up to the cent once.'
    params:
    - rate_2026
    - share_none
