  - lv_s: MX(lv_from_r, blk_from) if lv_from_r != None else '2999-12-31'
  - lv_e: MN(lv_to_r, blk_to) if lv_to_r != None else '1900-01-01'
  - hd_n: COUNT('medicare_ledger', event_type='medicare_days_reversed', days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_from_r: LATEST('medicare_ledger', 'from_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_to_r: LATEST('medicare_ledger', 'to_date', date_field='from_date', event_type='medicare_days_reversed', days_entry_id=blk_id,
      adjustment_reason='hospital_day')
  - hd_days_r: LATEST('medicare_ledger', 'day_count', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_f: hd_from_r if hd_from_r != None else '2999-12-31'
  - hd_t: hd_to_r if hd_to_r != None else '1900-01-01'
  - hd_days: hd_days_r if hd_days_r != None else 0
  - hd_s: MX(hd_f, blk_from)
  - hd_e: MN(hd_t, blk_to)
  - ld_n: COUNT('medicare_ledger', event_type='medicare_days_reversed', days_entry_id=blk_id, adjustment_reason='leave_of_absence_day')
  - ld_from_r: LATEST('medicare_ledger', 'from_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='leave_of_absence_day')
  - ld_to_r: LATEST('medicare_ledger', 'to_date', date_field='from_date', event_type='medicare_days_reversed', days_entry_id=blk_id,
      adjustment_reason='leave_of_absence_day')
  - ld_days_r: LATEST('medicare_ledger', 'day_count', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='leave_of_absence_day')
  - ld_f: ld_from_r if ld_from_r != None else '2999-12-31'
  - ld_t: ld_to_r if ld_to_r != None else '1900-01-01'
  - ld_days: ld_days_r if ld_days_r != None else 0
  - ld_s: MX(ld_f, blk_from)
  - ld_e: MN(ld_t, blk_to)
  - un_n: COUNT('medicare_ledger', event_type='medicare_days_reversed', days_entry_id=blk_id, adjustment_reason='uncertified_day')
  - un_from_r: LATEST('medicare_ledger', 'from_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='uncertified_day')
  - un_to_r: LATEST('medicare_ledger', 'to_date', date_field='from_date', event_type='medicare_days_reversed', days_entry_id=blk_id,
      adjustment_reason='uncertified_day')
  - un_days_r: LATEST('medicare_ledger', 'day_count', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='uncertified_day')
  - un_f: un_from_r if un_from_r != None else '2999-12-31'
  - un_t: un_to_r if un_to_r != None else '1900-01-01'
  - un_days: un_days_r if un_days_r != None else 0
  - un_s: MX(un_f, blk_from)
  - un_e: MN(un_t, blk_to)
  - bk_n: COUNT('medicare_ledger', event_type='medicare_days_reversed', days_entry_id=blk_id, adjustment_reason='booking_error')
  - lv_hd: MX(0, DAYS(MX(lv_s, hd_s), MN(lv_e, hd_e)) + 1)
  - lv_ld: MX(0, DAYS(MX(lv_s, ld_s), MN(lv_e, ld_e)) + 1)
  - un_full_lv: MX(0, DAYS(MX(un_f, lv_s), MN(un_t, lv_e)) + 1)
  - un_full_hd: MX(0, DAYS(MX(un_f, hd_f), MN(un_t, hd_t)) + 1)
  - un_full_ld: MX(0, DAYS(MX(un_f, ld_f), MN(un_t, ld_t)) + 1)
  - tc_n: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', days_entry_id=blk_id,
      charge_entry_id='')
  - tc_days: LATEST('medicare_ledger', 'day_count', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=blk_id, charge_entry_id='')
  - tc_post: LATEST('medicare_ledger', 'entry_date', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=blk_id, charge_entry_id='')
  - tc_hp: LATEST('medicare_ledger', 'entry_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='hospital_day')
  - tc_hd: LATEST('medicare_ledger', 'day_count', date_field='from_date', event_type='medicare_days_reversed', days_entry_id=blk_id,
      adjustment_reason='hospital_day')
  - tc_lp: LATEST('medicare_ledger', 'entry_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='leave_of_absence_day')
  - tc_ld: LATEST('medicare_ledger', 'day_count', date_field='from_date', event_type='medicare_days_reversed', days_entry_id=blk_id,
      adjustment_reason='leave_of_absence_day')
  - tc_up: LATEST('medicare_ledger', 'entry_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='uncertified_day')
  - tc_ud: LATEST('medicare_ledger', 'day_count', date_field='from_date', event_type='medicare_days_reversed', days_entry_id=blk_id,
      adjustment_reason='uncertified_day')
  - tc_pre: (tc_hd if (tc_hd != None and tc_hp != None and tc_post != None and DAYS(tc_hp, tc_post) >= 0) else 0)
      + (tc_ld if (tc_ld != None and tc_lp != None and tc_post != None and DAYS(tc_lp, tc_post) >= 0) else 0) +
      (tc_ud if (tc_ud != None and tc_up != None and tc_post != None and DAYS(tc_up, tc_post) >= 0) else 0)
  - chg_ok: tc_n == 0 or (tc_n == 1 and tc_days == blk_booked - tc_pre)
  - in_scope: blk_cnt == 1 and prev_cnt <= 1 and lv_n <= 1 and lv_rev == 0 and hd_n <= 1 and ld_n <= 1 and un_n
      <= 1 and bk_n == 0 and lv_hd == 0 and lv_ld == 0 and (hd_n == 0 or hd_days == DAYS(hd_f, hd_t) + 1) and (ld_n
      == 0 or ld_days == DAYS(ld_f, ld_t) + 1) and (un_n == 0 or un_days == DAYS(un_f, un_t) + 1 - un_full_lv -
      un_full_hd - un_full_ld) and (cal_before == 0 or prev_ok) and chg_ok and DAYS('2024-01-01', blk_to) >= 0
  - chg_id: LATEST('medicare_ledger', 'medicare_entry_id', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=blk_id, charge_entry_id='')
  - chg_paid: SUM('medicare_ledger', 'amount', event_type='medicare_coinsurance_payment', charge_entry_id=chg_id)
  - chg_returned: SUM('medicare_ledger', 'amount', event_type='medicare_payment_reversal', charge_entry_id=chg_id)
  - yr_rate: K('rate_2025') if (DAYS('2025-01-01', blk_to) >= 0 and DAYS(blk_to, '2025-12-31') >= 0) else (K('rate_2024')
      if (DAYS('2024-01-01', blk_to) >= 0 and DAYS(blk_to, '2024-12-31') >= 0) else K('rate_2026'))
  - cs_n: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', days_entry_id=prev_blk,
      charge_entry_id='')
  - cs_amt: SUM('medicare_ledger', 'amount', event_type='medicare_coinsurance_charge', liable_party='resident',
      days_entry_id=prev_blk, charge_entry_id='')
  - cs_days: LATEST('medicare_ledger', 'day_count', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - cs_rate: LATEST('medicare_ledger', 'daily_coinsurance_rate', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - cs_sec: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medigap_carrier')
      + COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medicaid_crossover')
  - cs_pct: (cs_amt * 100 / (cs_days * cs_rate)) if (cs_n == 1 and prev_blk != None) else -1
  - early_share: K('share_k') if (cs_pct > 49.5 and cs_pct < 50.5) else (K('share_l') if (cs_pct > 24.5 and cs_pct
      < 25.5) else (K('share_full') if (prev_blk != None and cs_n == 0 and cs_sec > 0) else K('share_none')))
  - hn_n: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', service_month=blk_month)
  - hn_from: XLATEST('bedhold', 'bedhold_ledger', 'from_date', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - hn_to: XLATEST('bedhold', 'bedhold_ledger', 'to_date', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - hn_s: MX(hn_from, blk_from) if hn_from != None else '2999-12-31'
  - hn_e: MN(hn_to, blk_to) if hn_to != None else '1900-01-01'
  - held_off: (DAYS(hn_s, hn_e) + 1) if (hn_n > 0 and DAYS(hn_e, eff_cut) > 0 and DAYS(hn_s, hn_e) >= 0) else (DAYS(hn_s,
      eff_cut) if (hn_n > 0 and DAYS(hn_s, eff_cut) > 0 and DAYS(hn_s, hn_e) >= 0) else 0)
  - hosp_off: (DAYS(hd_s, hd_e) + 1) if (hd_n > 0 and DAYS(hd_e, eff_cut) > 0 and DAYS(hd_s, hd_e) >= 0) else (DAYS(hd_s,
      eff_cut) if (hd_n > 0 and DAYS(hd_s, eff_cut) > 0 and DAYS(hd_s, hd_e) >= 0) else 0)
  - abs_off: (DAYS(ld_s, ld_e) + 1) if (ld_n > 0 and DAYS(ld_e, eff_cut) > 0 and DAYS(ld_s, ld_e) >= 0) else (DAYS(ld_s,
      eff_cut) if (ld_n > 0 and DAYS(ld_s, eff_cut) > 0 and DAYS(ld_s, ld_e) >= 0) else 0)
  - unc_span: (DAYS(un_s, un_e) + 1) if (un_n > 0 and DAYS(un_e, eff_cut) > 0 and DAYS(un_s, un_e) >= 0) else (DAYS(un_s,
      eff_cut) if (un_n > 0 and DAYS(un_s, eff_cut) > 0 and DAYS(un_s, un_e) >= 0) else 0)
  - unc_lv: (DAYS(MX(lv_s, un_s), MN(lv_e, un_e)) + 1) if (lv_n > 0 and DAYS(MN(lv_e, un_e), eff_cut) > 0 and DAYS(MX(lv_s,
      un_s), MN(lv_e, un_e)) >= 0) else (DAYS(MX(lv_s, un_s), eff_cut) if (lv_n > 0 and DAYS(MX(lv_s, un_s), eff_cut)
      > 0 and DAYS(MX(lv_s, un_s), MN(lv_e, un_e)) >= 0) else 0)
  - unc_hd: (DAYS(MX(hd_s, un_s), MN(hd_e, un_e)) + 1) if (hd_n > 0 and DAYS(MN(hd_e, un_e), eff_cut) > 0 and DAYS(MX(hd_s,
      un_s), MN(hd_e, un_e)) >= 0) else (DAYS(MX(hd_s, un_s), eff_cut) if (hd_n > 0 and DAYS(MX(hd_s, un_s), eff_cut)
      > 0 and DAYS(MX(hd_s, un_s), MN(hd_e, un_e)) >= 0) else 0)
  - unc_ld: (DAYS(MX(ld_s, un_s), MN(ld_e, un_e)) + 1) if (ld_n > 0 and DAYS(MN(ld_e, un_e), eff_cut) > 0 and DAYS(MX(ld_s,
      un_s), MN(ld_e, un_e)) >= 0) else (DAYS(MX(ld_s, un_s), eff_cut) if (ld_n > 0 and DAYS(MX(ld_s, un_s), eff_cut)
      > 0 and DAYS(MX(ld_s, un_s), MN(ld_e, un_e)) >= 0) else 0)
  - unc_off: MX(0, unc_span - unc_lv - unc_hd - unc_ld) if unc_span > 0 else 0
  - net_paid: RND(chg_paid - chg_returned, 2)
  - rev_all: SUM('medicare_ledger', 'day_count', event_type='medicare_days_reversed', days_entry_id=blk_id)
  - cnt_days: (blk_booked - rev_all) if tc_n > 0 else 0
  - early_days: MX(0, MN(cal_before - held_off - hosp_off - abs_off - unc_off, cnt_days))
  - chg_amt_x: LATEST('medicare_ledger', 'amount', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=blk_id, charge_entry_id='')
  - chg_adj_x: SUM('medicare_ledger', 'amount', event_type='medicare_coinsurance_adjustment', charge_entry_id=chg_id)
  - open_x: RND((chg_amt_x if chg_amt_x != None else 0) - chg_paid - chg_adj_x + chg_returned, 2)
  - pay_fig: MN(MX(0, RND(RND((yr_rate * (early_days * early_share + (cnt_days - early_days) * tier_share)) / 100
      + 0.000000001, 2) - net_paid, 2)), K('card_max'))
  - result: pay_fig if (in_scope and pay_fig <= open_x) else 0
  compute_basis:
    blk_id: A card payment the resident or representative makes during the call is applied to the resident's original
