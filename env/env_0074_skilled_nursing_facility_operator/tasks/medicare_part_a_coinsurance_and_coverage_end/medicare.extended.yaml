- id: medicare_evt_payment_posting
  subject:
  - medicare_coinsurance_payment
  - medicare_payment_reversal
  rule: Every payment is applied to one named coinsurance charge and only up to that charge's open balance; a payment
    meant for several charges is split one row per charge, oldest service month first, and any remainder beyond
    the open charges is not posted but returned to the payer. A resident or representative pays by one of the accepted
    resident payment methods; a single card payment may not exceed the card payment maximum, and an amount above
    it must be split across another accepted method. Carrier and state remittances post with medigap_remittance
    or medicaid_crossover_remittance against the secondary charge. A dishonored payment is reversed against the
    payment entry it came from for the full amount that entry applied, which reinstates the charge. A payment entry
    is reversed at most once. Once the resident has had the returned-payment limit of dishonored payments within
    the rolling lookback of calendar months ending on the payment date, only certified funds are accepted from the
    resident on any coverage episode. Statements for the prior service month issue on the statement day of the month
    to tiers that issue resident statements, and the resident amount is due within the payment due days after the
    statement date; Part A coinsurance carries no late charge.
  eligibility:
  - id: reverse_payment_once
    applies_to:
    - medicare_payment_reversal
    kind: dedup
    condition: A payment entry is reversed at most once.
    evidence_fields:
    - medicare_ledger.payment_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_ledger.payment_entry_id
      action_bindings:
        medicare_ledger.payment_entry_id: payment_entry_id
    dedup_contract:
      table: medicare_ledger
      mode: separate_record
      object_bindings:
        payment_entry_id: payment_entry_id
      duplicate_filters:
        event_type:
        - medicare_payment_reversal
      distinct_fields: []
  params:
    per_tier:
      Medicare Part A Without Supplemental Coverage:
        resident_statement_issued: =resident_statement_issued
      Medicare Part A with Medigap Plan A or B:
        resident_statement_issued: =resident_statement_issued
      Medicare Part A with Medigap Plan K:
        resident_statement_issued: =resident_statement_issued
      Medicare Part A with Medigap Plan L:
        resident_statement_issued: =resident_statement_issued
      Medicare Part A with Full-Coinsurance Medigap:
        resident_statement_issued: =resident_statement_issued
      Medicare Part A with QMB Medicaid Crossover:
        resident_statement_issued: =resident_statement_issued
    accepted_resident_payment_methods: =accepted_resident_payment_methods
    card_payment_max_usd: =card_payment_max_usd
    returned_payment_limit: =returned_payment_limit
    returned_payment_lookback_months: =returned_payment_lookback_months
    certified_funds_methods: =certified_funds_methods
    statement_day_of_month: =statement_day_of_month
    payment_due_days: =payment_due_days
  formula:
    applied_amount: min(amount, medicare_msr_open_charge_balance)
    certified_funds_only: medicare_msr_returned_payments >= returned_payment_limit
  measures:
  - medicare_msr_open_charge_balance
  - medicare_msr_returned_payments
- id: medicare_coverage_notice
  subject:
  - medicare_nomnc_delivered
  - medicare_notice_expired
  - medicare_coverage_end
  rule: When skilled services end while Part A days remain, coverage ends only through a Notice of Medicare Non-Coverage.
    Skilled services end when the resident no longer needs skilled nursing on the skilled nursing days per week
    minimum, or skilled rehabilitation on the skilled rehab days per week minimum when rehabilitation is the only
    skilled service. The NOMNC is delivered at least the NOMNC lead days before the last covered date, counting
    calendar days with the delivery date as day 0; a notice delivered later moves the last covered date to the NOMNC
    lead days after the delivery date, and the center, not the resident, bears the days in between. No NOMNC is
    required when coverage ends because the benefit-period day limit is reached (benefit_days_exhausted), when the
    resident chooses to leave the center (discharged_from_center), when a hospital transfer is not followed by a
    return within the interrupted-stay window (hospital_transfer_no_return) or on the resident's death (resident_deceased);
    those endings post directly from active. A notice whose last covered date passes without a timely appeal ends
    coverage with end_reason skilled_need_ended. After Part A days are used up, medically necessary therapy may
    continue under Medicare Part B as a separate therapy plan of care.
  eligibility: []
  params:
    nomnc_lead_days: =nomnc_lead_days
    nomnc_required_on_benefit_exhaustion: =nomnc_required_on_benefit_exhaustion
    nomnc_required_on_resident_initiated_discharge: =nomnc_required_on_resident_initiated_discharge
    skilled_nursing_days_per_week_min: =skilled_nursing_days_per_week_min
    skilled_rehab_days_per_week_min: =skilled_rehab_days_per_week_min
    interrupted_stay_return_days: =interrupted_stay_return_days
    part_b_therapy_after_exhaustion: =part_b_therapy_after_exhaustion
- id: medicare_appeal
  subject:
  - medicare_appeal_requested
  - medicare_appeal_reversed
  - medicare_appeal_upheld
  rule: Only the resident or the resident's representative can ask the Quality Improvement Organization for an expedited
    determination; the business office logs the request the resident makes and never files it on the resident's
    behalf. A request is timely when it is made no later than the QIO request deadline hour, local time, on the
    calendar day that falls the QIO request deadline days before the last covered date printed on the NOMNC. A timely
    request moves the coverage to under_appeal, and the resident is not billed for days after the last covered date
    while the review is pending; a late request is logged as submitted_late, leaves the coverage in notice_issued
    and gives no protection from liability. If the QIO reverses, coverage returns to active, the last covered date
    is cleared and booking continues. If the QIO upholds a timely request, coverage ends on the later of the NOMNC's
    last covered date and the QIO decision date.
  eligibility: []
  params:
    qio_request_deadline_hour: =qio_request_deadline_hour
    qio_request_deadline_days_before: =qio_request_deadline_days_before
    late_appeal_liability_protection: =late_appeal_liability_protection
    upheld_last_covered_basis: =upheld_last_covered_basis
- id: medicare_evt_snfabn
  subject:
  - medicare_snfabn_delivered
  rule: Before extended care that Medicare is not expected to cover is billed to the resident, such as skilled care
    the center keeps providing after the last covered date of a NOMNC, the SNF Advance Beneficiary Notice is delivered
    and the beneficiary checks one of its three options; the choice is the beneficiary's own and is recorded exactly
    as checked. Option 1 keeps the care going and obliges the center to submit a demand bill to Medicare; the resident
    pays while the claim is pending and is refunded if Medicare pays. Option 2 keeps the care going with no claim
    to Medicare, and the resident pays. Option 3 stops the non-covered care, and nothing is billed for it. Without
    a delivered SNF ABN the center may not bill the resident for that care. No SNF ABN is needed when coverage ends
    because the benefit-period day limit is reached. One notice is recorded per delivery date and first non-covered
    date.
  eligibility: []
  params:
    snfabn_required_before_noncovered_care: =snfabn_required_before_noncovered_care
    snfabn_options: =snfabn_options
    option_1_demand_bill_required: =option_1_demand_bill_required
- id: medicare_coverage_closure
  subject:
  - medicare_coverage_close
  - medicare_coverage_decline
  rule: An ended coverage is closed only when its coinsurance balance is zero across every liable party. Open secondary
    shares are followed up rather than closed out, and a resident share is never written off to close a coverage.
    A coverage declined as not_eligible is never reopened; a later qualifying admission opens a new episode.
  eligibility:
  - id: zero_balance
    applies_to:
    - medicare_coverage_close
    kind: authorization
    condition: An ended coverage is closed only when its coinsurance balance is zero across every liable party.
    evidence_fields:
    - medicare_coverages.medicare_coverage_id
    - medicare_coverages.coinsurance_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_coverages.medicare_coverage_id
      action_bindings:
        medicare_coverages.medicare_coverage_id: medicare_coverage_id
  params:
    coverage_close_requires_zero_balance: =coverage_close_requires_zero_balance
- id: medicare_coverage_tier_change
  subject:
  - medicare_coverage_update
  - medicare_coverage_open
  rule: 'The tier of a coverage follows the Medigap plan letter and QMB status on file, never what the caller believes
    the policy pays: verified QMB status places the coverage in the QMB tier whatever Medigap is on file; otherwise
    plan letter A or B, K, L, or C, D, F, G, M or N places it in the matching tier, and no Medigap policy places
    it in the tier without supplemental coverage. A newly reported Medigap policy is recorded with the carrier''s
    policy effective date as the supplemental effective date, and a new QMB determination with the first day of
    the month after the determination month. A signed physician recertification is recorded as the last certification
    date.'
  eligibility: []
  params:
    per_tier:
      Medicare Part A Without Supplemental Coverage:
        eligible_medigap_plan_letters: =eligible_medigap_plan_letters
        qmb_status_required: =qmb_status_required
      Medicare Part A with Medigap Plan A or B:
        eligible_medigap_plan_letters: =eligible_medigap_plan_letters
        qmb_status_required: =qmb_status_required
      Medicare Part A with Medigap Plan K:
        eligible_medigap_plan_letters: =eligible_medigap_plan_letters
        qmb_status_required: =qmb_status_required
      Medicare Part A with Medigap Plan L:
        eligible_medigap_plan_letters: =eligible_medigap_plan_letters
        qmb_status_required: =qmb_status_required
      Medicare Part A with Full-Coinsurance Medigap:
        eligible_medigap_plan_letters: =eligible_medigap_plan_letters
        qmb_status_required: =qmb_status_required
      Medicare Part A with QMB Medicaid Crossover:
        eligible_medigap_plan_letters: =eligible_medigap_plan_letters
        qmb_status_required: =qmb_status_required
extended_policies:
- id: medicare_ext_resident_block_share
  base_policy_refs:
  - medicare_evt_coinsurance
  - medicare_evt_secondary_and_qmb
  - medicare_coverage_tier_change
  - medicare_evt_day_counting
  overwrite:
  - base_policy: medicare_evt_coinsurance
    superseded_clause: 'The tier that sets the split is the one in effect on the days of service: a Medigap policy
      changes the split from the carrier''s policy effective date and QMB protection from the first day of the month
      after the state''s QMB determination, so days before the supplemental effective date keep the earlier split.'
    replaced_by: 'For a block that passes its record test, the resident coinsurance charge, the card payment, the
      rate-year correction, the reduction for reversed covered days and the bank draft each count the days before
      the supplemental effective date as their own policies state, and only for such a block; for every other block,
      the tier that sets the split is the one in effect on the days of service: a Medigap policy changes the split
      from the carrier''s policy effective date and QMB protection from the first day of the month after the state''s
      QMB determination, so days before the supplemental effective date keep the earlier split, and none of these
      five figures is priced for it.'
  trigger: state_due
  subject:
  - medicare_coinsurance_charge
  computes: amount
  target_tool: post_coinsurance_charge_97c12690
  params:
    rate_2026: 217.0
    rate_2025: 209.5
    rate_2024: 204.0
    share_none: 100
    share_k: 50
    share_l: 25
    share_full: 0
  rule: >-
    The resident coinsurance charge for a block prices one booked coinsurance block: among the coverage's booked-days
    entries in the band of benefit days 21 through 100, the one whose last service date is the latest. The resident
    coinsurance charge is worked out only for a charged block that passes this record test: its service month carries
    one booked-days entry in the band of benefit days 21 through 100; at most one such entry of the coverage has
    the last benefit day just before the charged block's first benefit day; the bed-hold records book at most one
    leave for its service month and take back none of that leave's held days; its booked-days entry carries at most
    one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence reversal
    on it covers a held night of that leave, and each such reversal counts every day of its span; an uncertified-day
    reversal on it counts every day of its span except the held nights and the hospital-day and leave-of-absence
    days inside the span; and, when the supplemental effective date falls after the charged block's first service
    date, the block before it either has a resident charge billing exactly 100, 50 or 25 percent of that charge's
    own days times its own daily rate, to within half a percentage point, or carries a secondary charge and no resident
    charge; and, when the resident's charge for the charged block stands, its day count equals the charged block's
    booked days less the days of every day reversal posted against its booked-days entry on or before the date that
    charge was posted; and the charged block's last service date falls in 2024 or later. For a block that passes
    its record test, the resident coinsurance charge, the card payment, the rate-year correction, the reduction
    for reversed covered days and the bank draft each count the days before the supplemental effective date as their
    own policies state, and only for such a block; for every other block, the tier that sets the split is the one
    in effect on the days of service: a Medigap policy changes the split from the carrier's policy effective date
    and QMB protection from the first day of the month after the state's QMB determination, so days before the supplemental
    effective date keep the earlier split, and none of these five figures is priced for it. The resident coinsurance
    charge prices each day it counts at the daily coinsurance rate of 217.00, and days before the supplemental effective
    date take the earlier share of 100 percent. The daily rate the resident coinsurance charge applies follows the
    calendar year in which the charged block's days were furnished: a charged block whose last service date falls
    in 2025 is charged at 209.50 a day, a charged block whose last service date falls in 2024 at 204.00 a day, and
    any other charged block at 217.00 a day. The supplemental effective date the resident coinsurance charge reads
    is the one recorded on the coverage; a coverage that records none has the tier on file in effect on every day
    of the charged block. The resident coinsurance charge counts the charged block's covered days, which are its
    booked days less every day reversed against its booked-days entry. The days the resident coinsurance charge
    counts before the supplemental effective date are first its calendar days of the charged block before that date:
    when the date falls after the charged block's first service date and on or before its last, the days from the
    first service date up to the day before the date; when it falls after the last service date, every calendar
    day of the charged block; otherwise none. Each kind of day named below that is not a covered day is taken off
    those days, never leaving fewer than none nor more than the days the resident coinsurance charge counts. Days
    the resident coinsurance charge counts before the supplemental effective date take the earlier share; every
    other day it counts takes the resident share of the tier on file. The block before the charged block is the
    coverage's booked-days entry in the band of benefit days 21 through 100 whose last benefit day is the day before
    the charged block's first benefit day; its resident charge is the resident coinsurance charge posted for it
    that is not a rebill of a denied secondary share. The earlier share the resident coinsurance charge applies
    is read from the block before: 50 percent when its resident charge bills half of that charge's own days times
    its own daily rate, to within half a percentage point; 25 percent when it bills a quarter, to within half a
    percentage point; 0 percent when the block before carries a secondary charge and no resident charge; and 100
    percent otherwise. A night away at midnight on a bed-hold leave is not a covered day: when the bed-hold records
    book a leave for the charged block's service month, its held nights inside the charged block come off the days
    the resident coinsurance charge counts before the supplemental effective date, all of them when the last such
    night falls before that date, those from the first such night up to the day before the date when the date falls
    after the first such night and on or before the last, and none otherwise; when the month books no leave, none
    come off. A day reversed as a hospital day is not a covered day: when the charged block's booked-days entry
    carries a hospital-day reversal, its reversed days inside the charged block come off the days the resident coinsurance
    charge counts before the supplemental effective date, all of them when its last reversed day falls before that
    date, those from its first reversed day up to the day before the date when the date falls after its first reversed
    day and on or before its last, and none otherwise; without such a reversal, none come off. A day reversed as
    a leave-of-absence day is not a covered day: when the charged block's booked-days entry carries a leave-of-absence
    reversal, its reversed days inside the charged block come off the days the resident coinsurance charge counts
    before the supplemental effective date, all of them when its last reversed day falls before that date, those
    from its first reversed day up to the day before the date when the date falls after its first reversed day and
    on or before its last, and none otherwise; without such a reversal, none come off. A day reversed as an uncertified
    day is not a covered day: when the charged block's booked-days entry carries an uncertified-day reversal, the
    days of its span before the supplemental effective date come off the days the resident coinsurance charge counts
    before that date, all of the span when its last day falls before the date, the days from its first day up to
    the day before the date when the date falls after its first day and on or before its last, and none otherwise,
    in each case less the held nights and the hospital-day and leave-of-absence days inside that part of the span,
    which the reversal did not reverse; without such a reversal, none come off. The resident coinsurance charge
    adds, over the days it counts, the daily rate times the share each day takes, divides the sum by 100 and rounds
    it half up to the cent once. When the tier on file prohibits balance billing, as the QMB Medicaid Crossover
    tier does, the resident coinsurance charge bills the resident nothing for any day on or after the tier's supplemental
    effective date, those days taking the tier's resident share of nothing, while days before that date keep the
    earlier split, QMB protection not reaching back before it.
  prerequisite: []
  cross_category:
  - category: bedhold
    as: history
    reads:
    - bedhold_ledger.from_date
    - bedhold_ledger.to_date
    - bedhold_ledger.service_month
    - bedhold_ledger.bedhold_entry_id
    - bedhold_ledger.days_entry_id
    note: f_held_nights reads the held nights the bed-hold ledger books for the charged block's service month
  compute:
  - blk_id: LATEST('medicare_ledger', 'medicare_entry_id', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_from: LATEST('medicare_ledger', 'from_date', date_field='to_date', event_type='medicare_days_booked', day_band='days_21_100')
  - blk_to: LATEST('medicare_ledger', 'to_date', date_field='to_date', event_type='medicare_days_booked', day_band='days_21_100')
  - blk_month: LATEST('medicare_ledger', 'service_month', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_first: LATEST('medicare_ledger', 'first_benefit_day', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_booked: LATEST('medicare_ledger', 'day_count', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_cnt: COUNT('medicare_ledger', event_type='medicare_days_booked', day_band='days_21_100', service_month=blk_month)
  - eff_on_file: F('supplemental_effective_date')
  - eff_cut: eff_on_file if (eff_on_file != None and eff_on_file != '') else '1900-01-01'
  - cal_before: DAYS(blk_from, eff_cut) if (DAYS(blk_from, eff_cut) > 0 and DAYS(eff_cut, blk_to) >= 0) else (DAYS(blk_from,
      blk_to) + 1 if DAYS(eff_cut, blk_to) < 0 else 0)
  - tier_share: P('resident_coinsurance_share_pct')
  - prev_cnt: COUNT('medicare_ledger', event_type='medicare_days_booked', day_band='days_21_100', last_benefit_day=blk_first
      - 1)
  - prev_blk: LATEST('medicare_ledger', 'medicare_entry_id', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100', last_benefit_day=blk_first - 1)
  - prev_res_n: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', days_entry_id=prev_blk,
      charge_entry_id='')
  - prev_res_amt: SUM('medicare_ledger', 'amount', event_type='medicare_coinsurance_charge', liable_party='resident',
      days_entry_id=prev_blk, charge_entry_id='')
  - prev_res_days: LATEST('medicare_ledger', 'day_count', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - prev_res_rate: LATEST('medicare_ledger', 'daily_coinsurance_rate', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - prev_sec: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medigap_carrier')
      + COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medicaid_crossover')
  - prev_pct: (prev_res_amt * 100 / (prev_res_days * prev_res_rate)) if (prev_res_n == 1 and prev_blk != None) else
      -1
  - prev_ok: (prev_pct > 99.5 and prev_pct < 100.5) or (prev_pct > 49.5 and prev_pct < 50.5) or (prev_pct > 24.5
      and prev_pct < 25.5) or (prev_blk != None and prev_res_n == 0 and prev_sec > 0)
  - lv_n: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', service_month=blk_month)
  - lv_from_r: XLATEST('bedhold', 'bedhold_ledger', 'from_date', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_to_r: XLATEST('bedhold', 'bedhold_ledger', 'to_date', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_id: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_entry_id', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_rev: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_reversed', days_entry_id=lv_id) if lv_id
      != None else 0
  - lv_s: MX(lv_from_r, blk_from) if lv_from_r != None else '2999-12-31'
  - lv_e: MN(lv_to_r, blk_to) if lv_to_r != None else '1900-01-01'
  - hd_n: COUNT('medicare_ledger', event_type='medicare_days_reversed', days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_from_r: LATEST('medicare_ledger', 'from_date', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_to_r: LATEST('medicare_ledger', 'to_date', date_field='from_date', event_type='medicare_days_reversed', days_entry_id=blk_id,
      adjustment_reason='hospital_day')
  - hd_days_r: LATEST('medicare_ledger', 'day_count', date_field='from_date', event_type='medicare_days_reversed',
      days_entry_id=blk_id, adjustment_reason='hospital_day')
  - hd_f: hd_from_r if hd_from_r != None else '2999-12-31'
  - hd_t: hd_to_r if hd_to_r != None else '1900-01-01'
  - hd_days: hd_days_r if hd_days_r != None else 0
  - hd_s: MX(hd_f, blk_from)
  - hd_e: MN(hd_t, blk_to)
  - ld_n: COUNT('medicare_ledger', event_type='medicare_days_reversed', days_entry_id=blk_id, adjustment_reason='leave_of_absence_day')
  - ld_from_r: LATEST('medicare_ledger', 'from_date', date_field='from_date', event_type='medicare_days_reversed',
