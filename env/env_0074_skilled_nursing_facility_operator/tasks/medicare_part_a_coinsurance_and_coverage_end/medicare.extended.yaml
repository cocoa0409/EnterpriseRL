  compute_basis:
    blk_id: The rate-year correction on a resident coinsurance charge applies to the resident's original coinsurance
      charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days entries
      in the band of benefit days 21 through 100 the one whose last service date is the latest, and it takes back
      what that charge billed above the daily rate of the year in which the corrected block's days were furnished.
    blk_from: The rate-year correction on a resident coinsurance charge applies to the resident's original coinsurance
      charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days entries
      in the band of benefit days 21 through 100 the one whose last service date is the latest, and it takes back
      what that charge billed above the daily rate of the year in which the corrected block's days were furnished.
    blk_to: The rate-year correction on a resident coinsurance charge applies to the resident's original coinsurance
      charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days entries
      in the band of benefit days 21 through 100 the one whose last service date is the latest, and it takes back
      what that charge billed above the daily rate of the year in which the corrected block's days were furnished.
    blk_month: The rate-year correction on a resident coinsurance charge applies to the resident's original coinsurance
      charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days entries
      in the band of benefit days 21 through 100 the one whose last service date is the latest, and it takes back
      what that charge billed above the daily rate of the year in which the corrected block's days were furnished.
    blk_first: The rate-year correction on a resident coinsurance charge applies to the resident's original coinsurance
      charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days entries
      in the band of benefit days 21 through 100 the one whose last service date is the latest, and it takes back
      what that charge billed above the daily rate of the year in which the corrected block's days were furnished.
    blk_cnt: 'The rate-year correction is worked out only for a corrected block that passes this record test: its
      service month carries one booked-days entry in the band of benefit days 21 through 100; at most one such entry
      of the coverage has the last benefit day just before the corrected block''s first benefit day; the bed-hold
      records book at most one leave for its service month and take back none of that leave''s held days; its booked-days
      entry carries at most one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence
      reversal on it covers a held night of that leave, and each such reversal counts every day of its span; an
      uncertified-day reversal on it counts every day of its span except the held nights and the hospital-day and
      leave-of-absence days inside the span; and, when the supplemental effective date falls after the corrected
      block''s first service date, the block before it either has a resident charge billing exactly 100, 50 or 25
      percent of that charge''s own days times its own daily rate, to within half a percentage point, or carries
      a secondary charge and no resident charge; and, when the resident''s charge for the corrected block stands,
      its day count equals the corrected block''s booked days less the days of every day reversal posted against
      its booked-days entry on or before the date that charge was posted; and the corrected block''s last service
      date falls in 2024 or later.'
    eff_on_file: The supplemental effective date the rate-year correction reads is the one recorded on the coverage;
      a coverage that records none has the tier on file in effect on every day of the corrected block.
    eff_cut: The supplemental effective date the rate-year correction reads is the one recorded on the coverage;
      a coverage that records none has the tier on file in effect on every day of the corrected block.
    cal_before: 'The days the rate-year correction counts before the supplemental effective date are first its calendar
      days of the corrected block before that date: when the date falls after the corrected block''s first service
      date and on or before its last, the days from the first service date up to the day before the date; when it
      falls after the last service date, every calendar day of the corrected block; otherwise none.'
    tier_share:
    - Days the rate-year correction counts before the supplemental effective date take the earlier share; every
      other day it counts takes the resident share of the tier on file.
    - When the tier on file prohibits balance billing, as the QMB Medicaid Crossover tier does, the rate-year correction
      bills the resident nothing for any day on or after the tier's supplemental effective date, those days taking
      the tier's resident share of nothing, while days before that date keep the earlier split, QMB protection not
      reaching back before it.
    prev_cnt: 'The rate-year correction is worked out only for a corrected block that passes this record test: its
      service month carries one booked-days entry in the band of benefit days 21 through 100; at most one such entry
      of the coverage has the last benefit day just before the corrected block''s first benefit day; the bed-hold
      records book at most one leave for its service month and take back none of that leave''s held days; its booked-days
      entry carries at most one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence
      reversal on it covers a held night of that leave, and each such reversal counts every day of its span; an
      uncertified-day reversal on it counts every day of its span except the held nights and the hospital-day and
      leave-of-absence days inside the span; and, when the supplemental effective date falls after the corrected
      block''s first service date, the block before it either has a resident charge billing exactly 100, 50 or 25
      percent of that charge''s own days times its own daily rate, to within half a percentage point, or carries
      a secondary charge and no resident charge; and, when the resident''s charge for the corrected block stands,
      its day count equals the corrected block''s booked days less the days of every day reversal posted against
      its booked-days entry on or before the date that charge was posted; and the corrected block''s last service
      date falls in 2024 or later.'
    prev_blk: The block before the corrected block is the coverage's booked-days entry in the band of benefit days
      21 through 100 whose last benefit day is the day before the corrected block's first benefit day; its resident
      charge is the resident coinsurance charge posted for it that is not a rebill of a denied secondary share.
    prev_res_n: The block before the corrected block is the coverage's booked-days entry in the band of benefit
      days 21 through 100 whose last benefit day is the day before the corrected block's first benefit day; its
      resident charge is the resident coinsurance charge posted for it that is not a rebill of a denied secondary
      share.
    prev_res_amt: The block before the corrected block is the coverage's booked-days entry in the band of benefit
      days 21 through 100 whose last benefit day is the day before the corrected block's first benefit day; its
      resident charge is the resident coinsurance charge posted for it that is not a rebill of a denied secondary
      share.
    prev_res_days: The block before the corrected block is the coverage's booked-days entry in the band of benefit
      days 21 through 100 whose last benefit day is the day before the corrected block's first benefit day; its
      resident charge is the resident coinsurance charge posted for it that is not a rebill of a denied secondary
      share.
    prev_res_rate: The block before the corrected block is the coverage's booked-days entry in the band of benefit
      days 21 through 100 whose last benefit day is the day before the corrected block's first benefit day; its
      resident charge is the resident coinsurance charge posted for it that is not a rebill of a denied secondary
      share.
    prev_sec: 'The earlier share the rate-year correction applies is read from the block before: 50 percent when
      its resident charge bills half of that charge''s own days times its own daily rate, to within half a percentage
      point; 25 percent when it bills a quarter, to within half a percentage point; 0 percent when the block before
      carries a secondary charge and no resident charge; and 100 percent otherwise.'
    prev_pct: 'The earlier share the rate-year correction applies is read from the block before: 50 percent when
      its resident charge bills half of that charge''s own days times its own daily rate, to within half a percentage
      point; 25 percent when it bills a quarter, to within half a percentage point; 0 percent when the block before
      carries a secondary charge and no resident charge; and 100 percent otherwise.'
    prev_ok: 'The rate-year correction is worked out only for a corrected block that passes this record test: its
      service month carries one booked-days entry in the band of benefit days 21 through 100; at most one such entry
