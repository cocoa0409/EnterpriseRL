  factors:
  - id: f_reduction_rate
    effect: parameter
    decides: red_rate
    bindings:
    - red_rate
    ladder:
    - when: the records carry a rate-year correction against the charge AND the lapse's block has its last service
        date in 2025
      value: K('rate_2025') = 209.50 a day
    - when: the records carry a rate-year correction against the charge AND that date falls in 2024
      value: K('rate_2024') = 204.00 a day
    - when: the records carry a rate-year correction against the charge AND that date falls in 2026 or later
      value: K('rate_2026') = 217.00 a day
    - when: otherwise
      value: the daily rate the charge records
    baseline:
      red_rate: chg_rate
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: f_carried_split
    effect: parameter
    decides: early_share
    bindings:
    - cs_n
    - cs_amt
    - cs_days
    - cs_rate
    - cs_sec
    - cs_pct
    - early_share
    ladder:
    - when: the block before the lapse's block has a resident charge billing half of that charge's own days times
        its own daily rate (within half a percentage point)
      value: K('share_k') = 50 percent
    - when: that resident charge bills a quarter of its own days times its own daily rate (within half a percentage
        point)
      value: K('share_l') = 25 percent
    - when: the block before the lapse's block carries a secondary charge and no resident charge
      value: K('share_full') = 0 percent
    - when: otherwise
      value: K('share_none') = 100 percent
    baseline:
      early_share: K('share_none')
    evidence:
    - history
    cross_difficulty: null
  - id: f_held_in_lapse
    effect: method
    decides: ovl_lv
    bindings:
    - hl_n
    - hl_from
    - hl_to
    - hl_s
    - hl_e
    - ovl_lv
    ladder:
    - when: the month books a bed-hold leave AND the last held night inside the reversal's span falls before the
        supplemental effective date
      method: take off every held night inside the span
    - when: the month books a bed-hold leave AND the supplemental effective date falls after the first held night
        inside the span and on or before the last
      method: take off the held nights inside the span up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      ovl_lv: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: bedhold
  - id: f_hospital_in_lapse
    effect: method
    decides: ovl_hd
    bindings:
    - ovl_hd
    ladder:
    - when: the block carries a hospital-day reversal AND its last day inside the uncertified span falls before
        the supplemental effective date
      method: take off every hospital-day reversed day inside the span
    - when: the block carries a hospital-day reversal AND the supplemental effective date falls after its first
        day inside the span and on or before its last
      method: take off those days up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      ovl_hd: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The reduction for reversed covered days prices each reversed day at the daily rate the resident''s charge
      records, and reversed days before the supplemental effective date take the earlier share of 100 percent. The
      reduction for reversed covered days counts the reversal''s day count, and it never exceeds the charge''s open
      balance, which is its amount less the payments and adjustments posted against it plus any returned payments.
      The reversed days the reduction for reversed covered days counts before the supplemental effective date are
      first the days of the reversal''s span before that date: all of the span when its last day falls before the
      date, the days from its first day up to the day before the date when the date falls after its first day and
      on or before its last, and none otherwise. Reversed days the reduction for reversed covered days counts before
      the supplemental effective date take the earlier share; every other reversed day takes the resident share
      of the tier on file. The reduction for reversed covered days adds, over the days it counts, the daily rate
      times the share each day takes, divides the sum by 100 and rounds it half up to the cent once.'
    params:
    - share_none
  inputs:
    history:
    - table: medicare_ledger
      aggregate: latest
      field: day_count
      filters:
        event_type: medicare_days_booked
        day_band: days_21_100
    - table: medicare_ledger
      aggregate: latest
      field: from_date
      filters:
        event_type: medicare_days_reversed
    - table: medicare_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: medicare_coinsurance_charge
        liable_party: resident
    - category: bedhold
      table: bedhold_ledger
      aggregate: latest
      field: from_date
      filters:
        event_type: bedhold_day_booked
    - category: bedhold
      table: bedhold_ledger
      aggregate: count
      field: bedhold_entry_id
      filters:
        event_type: bedhold_day_booked
    cross_category:
    - bedhold
