    chg_id: A bank-draft payment the resident or representative makes during the call is applied to the resident's
      original coinsurance charge for the coverage's latest booked coinsurance block, that is, among the coverage's
      booked-days entries in the band of benefit days 21 through 100 the one whose last service date is the latest,
      and it settles the resident's share of the settled block's covered days less the payments already applied
      to that charge.
    chg_paid: The bank draft counts the settled block's covered days, which are its booked days less every day reversed
      against its booked-days entry; the rounded figure less the payments already applied to the resident's charge,
      net of any returned payments, is the bank draft, never less than nothing.
    chg_returned: The bank draft counts the settled block's covered days, which are its booked days less every day
      reversed against its booked-days entry; the rounded figure less the payments already applied to the resident's
      charge, net of any returned payments, is the bank draft, never less than nothing.
