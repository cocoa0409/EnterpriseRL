  factors:
  - id: f_year_rate
    effect: parameter
    decides: yr_rate
    bindings:
    - yr_rate
    ladder:
    - when: the paid block's last service date falls in calendar year 2025
      value: K('rate_2025') = 209.50 a day
    - when: the paid block's last service date falls in calendar year 2024
      value: K('rate_2024') = 204.00 a day
    - when: otherwise
      value: K('rate_2026') = 217.00 a day
    baseline:
      yr_rate: K('rate_2026')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: f_carried_split
    effect: parameter
    decides: early_share
    bindings:
    - cs_n
    - cs_amt
    - cs_days
    - cs_rate
    - cs_sec
    - cs_pct
    - early_share
    ladder:
    - when: the block before the paid block has a resident charge billing half of that charge's own days times its
        own daily rate (within half a percentage point)
      value: K('share_k') = 50 percent
    - when: that resident charge bills a quarter of its own days times its own daily rate (within half a percentage
        point)
      value: K('share_l') = 25 percent
    - when: the block before the paid block carries a secondary charge and no resident charge
      value: K('share_full') = 0 percent
    - when: otherwise
      value: K('share_none') = 100 percent
    baseline:
      early_share: K('share_none')
    evidence:
    - history
    cross_difficulty: null
  - id: f_held_nights
    effect: method
    decides: held_off
    bindings:
    - hn_n
    - hn_from
    - hn_to
    - hn_s
    - hn_e
    - held_off
    ladder:
    - when: the bed-hold records book a leave for the paid block's service month AND its last held night inside
        the paid block falls before the supplemental effective date
      method: take off every held night of it inside the paid block
    - when: the bed-hold records book a leave for the paid block's service month AND the supplemental effective
        date falls after its first held night inside the paid block and on or before its last
      method: take off its held nights from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      held_off: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: bedhold
  - id: f_hospital_reversal
    effect: method
    decides: hosp_off
    bindings:
    - hosp_off
    ladder:
    - when: the paid block's booked-days entry carries a hospital-day reversal AND its last reversed day inside
        the paid block falls before the supplemental effective date
      method: take off every reversed day of it inside the paid block
    - when: the paid block's booked-days entry carries a hospital-day reversal AND the supplemental effective date
        falls after its first reversed day inside the paid block and on or before its last
      method: take off its reversed days from the first up to the day before the supplemental effective date
    - when: otherwise
      method: take off nothing
    baseline:
      hosp_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: f_uncertified_days
    effect: method
    decides: unc_off
    bindings:
    - unc_span
    - unc_lv
    - unc_hd
    - unc_ld
    - unc_off
    ladder:
    - when: the paid block's booked-days entry carries an uncertified-day reversal AND the last day of its span
        falls before the supplemental effective date
      method: take off every day of its span less the held nights and the hospital-day and leave-of-absence days
        inside it
    - when: the paid block's booked-days entry carries an uncertified-day reversal AND the supplemental effective
        date falls after the first day of its span and on or before its last
      method: take off the days of its span up to the day before the date, less the held nights and the hospital-day
        and leave-of-absence days inside that part
    - when: otherwise
      method: take off nothing
    baseline:
      unc_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The card payment prices each day it counts at the daily coinsurance rate of 217.00, and days before the
      supplemental effective date take the earlier share of 100 percent. The card payment counts the paid block''s
      covered days, which are its booked days less every day reversed against its booked-days entry, once the resident''s
      charge for the paid block stands, and no day before it stands; the rounded figure less the payments already
      applied to that charge, net of any returned payments, is the card payment, never less than nothing and never
      more than the card payment maximum of 5000.00. The days the card payment counts before the supplemental effective
      date are first its calendar days of the paid block before that date: when the date falls after the paid block''s
      first service date and on or before its last, the days from the first service date up to the day before the
      date; when it falls after the last service date, every calendar day of the paid block; otherwise none. Days
      the card payment counts before the supplemental effective date take the earlier share; every other day it
      counts takes the resident share of the tier on file. The card payment adds, over the days it counts, the daily
      rate times the share each day takes, divides the sum by 100 and rounds it half up to the cent once.'
    params:
    - rate_2026
    - share_none
  inputs:
    history:
    - table: medicare_ledger
      aggregate: latest
      field: day_count
      filters:
        event_type: medicare_days_booked
        day_band: days_21_100
    - table: medicare_ledger
      aggregate: latest
      field: from_date
      filters:
        event_type: medicare_days_reversed
    - table: medicare_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: medicare_coinsurance_charge
        liable_party: resident
    - category: bedhold
      table: bedhold_ledger
      aggregate: latest
      field: from_date
      filters:
        event_type: bedhold_day_booked
    - category: bedhold
      table: bedhold_ledger
      aggregate: count
      field: bedhold_entry_id
      filters:
        event_type: bedhold_day_booked
    cross_category:
    - bedhold
- id: medicare_ext_resident_rate_year_correction
  base_policy_refs:
  - medicare_evt_coinsurance
  - medicare_evt_secondary_and_qmb
  - medicare_coverage_tier_change
  - medicare_evt_day_counting
  overwrite:
  - base_policy: medicare_evt_coinsurance
    superseded_clause: 'The tier that sets the split is the one in effect on the days of service: a Medigap policy
      changes the split from the carrier''s policy effective date and QMB protection from the first day of the month
      after the state''s QMB determination, so days before the supplemental effective date keep the earlier split.'
    replaced_by: 'For a block that passes its record test, the resident coinsurance charge, the card payment, the
      rate-year correction, the reduction for reversed covered days and the bank draft each count the days before
      the supplemental effective date as their own policies state, and only for such a block; for every other block,
      the tier that sets the split is the one in effect on the days of service: a Medigap policy changes the split
      from the carrier''s policy effective date and QMB protection from the first day of the month after the state''s
      QMB determination, so days before the supplemental effective date keep the earlier split, and none of these
      five figures is priced for it.'
  trigger: state_due
  subject:
  - medicare_coinsurance_adjustment
  computes: amount
  target_tool: correct_coinsurance_rate_feac0074
  params:
    rate_2026: 217.0
    rate_2025: 209.5
    rate_2024: 204.0
    share_none: 100
    share_k: 50
    share_l: 25
    share_full: 0
  rule: >-
    The rate-year correction on a resident coinsurance charge applies to the resident's original coinsurance charge
    for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days entries in the
    band of benefit days 21 through 100 the one whose last service date is the latest, and it takes back what that
    charge billed above the daily rate of the year in which the corrected block's days were furnished. The rate-year
    correction is worked out only for a corrected block that passes this record test: its service month carries
    one booked-days entry in the band of benefit days 21 through 100; at most one such entry of the coverage has
    the last benefit day just before the corrected block's first benefit day; the bed-hold records book at most
    one leave for its service month and take back none of that leave's held days; its booked-days entry carries
    at most one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence reversal
    on it covers a held night of that leave, and each such reversal counts every day of its span; an uncertified-day
    reversal on it counts every day of its span except the held nights and the hospital-day and leave-of-absence
    days inside the span; and, when the supplemental effective date falls after the corrected block's first service
    date, the block before it either has a resident charge billing exactly 100, 50 or 25 percent of that charge's
    own days times its own daily rate, to within half a percentage point, or carries a secondary charge and no resident
    charge; and, when the resident's charge for the corrected block stands, its day count equals the corrected block's
    booked days less the days of every day reversal posted against its booked-days entry on or before the date that
    charge was posted; and the corrected block's last service date falls in 2024 or later. For a block that passes
    its record test, the resident coinsurance charge, the card payment, the rate-year correction, the reduction
    for reversed covered days and the bank draft each count the days before the supplemental effective date as their
    own policies state, and only for such a block; for every other block, the tier that sets the split is the one
    in effect on the days of service: a Medigap policy changes the split from the carrier's policy effective date
    and QMB protection from the first day of the month after the state's QMB determination, so days before the supplemental
    effective date keep the earlier split, and none of these five figures is priced for it. The rate-year correction
    prices each day it counts at the daily coinsurance rate of 204.00 as the year-of-service rate, and days before
    the supplemental effective date take the earlier share of 100 percent. The year-of-service rate the rate-year
    correction compares against follows the calendar year in which the corrected block's days were furnished: a
    corrected block whose last service date falls in 2026 or later is compared against 217.00 a day, a corrected
    block whose last service date falls in 2025 against 209.50 a day, and any other corrected block, which the record
    test limits to one whose last service date falls in 2024, against 204.00 a day. The supplemental effective date
    the rate-year correction reads is the one recorded on the coverage; a coverage that records none has the tier
    on file in effect on every day of the corrected block. The rate-year correction counts the days the resident's
    charge prices and works the figure twice, once at the daily rate that charge records and once at the year-of-service
    rate; the correction is the first rounded figure less the second, never less than nothing and never more than
    the charge's open balance, which is its amount less the payments and adjustments posted against it plus any
    returned payments. The days the rate-year correction counts before the supplemental effective date are first
    its calendar days of the corrected block before that date: when the date falls after the corrected block's first
    service date and on or before its last, the days from the first service date up to the day before the date;
    when it falls after the last service date, every calendar day of the corrected block; otherwise none. Each kind
    of day named below that is not a covered day is taken off those days, never leaving fewer than none nor more
    than the days the rate-year correction counts. Days the rate-year correction counts before the supplemental
    effective date take the earlier share; every other day it counts takes the resident share of the tier on file.
    The block before the corrected block is the coverage's booked-days entry in the band of benefit days 21 through
    100 whose last benefit day is the day before the corrected block's first benefit day; its resident charge is
    the resident coinsurance charge posted for it that is not a rebill of a denied secondary share. The earlier
    share the rate-year correction applies is read from the block before: 50 percent when its resident charge bills
    half of that charge's own days times its own daily rate, to within half a percentage point; 25 percent when
    it bills a quarter, to within half a percentage point; 0 percent when the block before carries a secondary charge
    and no resident charge; and 100 percent otherwise. A night away at midnight on a bed-hold leave is not a covered
    day: when the bed-hold records book a leave for the corrected block's service month, its held nights inside
    the corrected block come off the days the rate-year correction counts before the supplemental effective date,
    all of them when the last such night falls before that date, those from the first such night up to the day before
    the date when the date falls after the first such night and on or before the last, and none otherwise; when
    the month books no leave, none come off. A day reversed as a hospital day is not a covered day: when the corrected
    block's booked-days entry carries a hospital-day reversal posted on or before the date the charge was posted,
    its reversed days inside the corrected block come off the days the rate-year correction counts before the supplemental
    effective date, all of them when its last reversed day falls before that date, those from its first reversed
    day up to the day before the date when the date falls after its first reversed day and on or before its last,
    and none otherwise; without such a reversal, none come off. A day reversed as a leave-of-absence day is not
    a covered day: when the corrected block's booked-days entry carries a leave-of-absence reversal posted on or
    before the date the charge was posted, its reversed days inside the corrected block come off the days the rate-year
    correction counts before the supplemental effective date, all of them when its last reversed day falls before
    that date, those from its first reversed day up to the day before the date when the date falls after its first
    reversed day and on or before its last, and none otherwise; without such a reversal, none come off. A day reversed
    as an uncertified day is not a covered day: when the corrected block's booked-days entry carries an uncertified-day
    reversal posted on or before the date the charge was posted, the days of its span before the supplemental effective
    date come off the days the rate-year correction counts before that date, all of the span when its last day falls
    before the date, the days from its first day up to the day before the date when the date falls after its first
    day and on or before its last, and none otherwise, in each case less the held nights and the hospital-day and
    leave-of-absence days inside that part of the span, which the reversal did not reverse; without such a reversal,
    none come off. The rate-year correction adds, over the days it counts, the daily rate times the share each day
    takes, divides the sum by 100 and rounds it half up to the cent once. When the tier on file prohibits balance
    billing, as the QMB Medicaid Crossover tier does, the rate-year correction bills the resident nothing for any
    day on or after the tier's supplemental effective date, those days taking the tier's resident share of nothing,
    while days before that date keep the earlier split, QMB protection not reaching back before it.
  prerequisite: []
  cross_category:
  - category: bedhold
    as: history
    reads:
    - bedhold_ledger.from_date
    - bedhold_ledger.to_date
    - bedhold_ledger.service_month
    - bedhold_ledger.bedhold_entry_id
    - bedhold_ledger.days_entry_id
    note: f_held_nights reads the held nights the bed-hold ledger books for the corrected block's service month
  compute:
  - blk_id: LATEST('medicare_ledger', 'medicare_entry_id', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_from: LATEST('medicare_ledger', 'from_date', date_field='to_date', event_type='medicare_days_booked', day_band='days_21_100')
  - blk_to: LATEST('medicare_ledger', 'to_date', date_field='to_date', event_type='medicare_days_booked', day_band='days_21_100')
  - blk_month: LATEST('medicare_ledger', 'service_month', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_first: LATEST('medicare_ledger', 'first_benefit_day', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_booked: LATEST('medicare_ledger', 'day_count', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_cnt: COUNT('medicare_ledger', event_type='medicare_days_booked', day_band='days_21_100', service_month=blk_month)
  - eff_on_file: F('supplemental_effective_date')
  - eff_cut: eff_on_file if (eff_on_file != None and eff_on_file != '') else '1900-01-01'
  - cal_before: DAYS(blk_from, eff_cut) if (DAYS(blk_from, eff_cut) > 0 and DAYS(eff_cut, blk_to) >= 0) else (DAYS(blk_from,
      blk_to) + 1 if DAYS(eff_cut, blk_to) < 0 else 0)
  - tier_share: P('resident_coinsurance_share_pct')
  - prev_cnt: COUNT('medicare_ledger', event_type='medicare_days_booked', day_band='days_21_100', last_benefit_day=blk_first
      - 1)
  - prev_blk: LATEST('medicare_ledger', 'medicare_entry_id', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100', last_benefit_day=blk_first - 1)
  - prev_res_n: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', days_entry_id=prev_blk,
      charge_entry_id='')
  - prev_res_amt: SUM('medicare_ledger', 'amount', event_type='medicare_coinsurance_charge', liable_party='resident',
      days_entry_id=prev_blk, charge_entry_id='')
  - prev_res_days: LATEST('medicare_ledger', 'day_count', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - prev_res_rate: LATEST('medicare_ledger', 'daily_coinsurance_rate', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - prev_sec: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medigap_carrier')
      + COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medicaid_crossover')
  - prev_pct: (prev_res_amt * 100 / (prev_res_days * prev_res_rate)) if (prev_res_n == 1 and prev_blk != None) else
