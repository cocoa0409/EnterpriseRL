      to that charge.
    blk_month: A bank-draft payment the resident or representative makes during the call is applied to the resident's
      original coinsurance charge for the coverage's latest booked coinsurance block, that is, among the coverage's
      booked-days entries in the band of benefit days 21 through 100 the one whose last service date is the latest,
      and it settles the resident's share of the settled block's covered days less the payments already applied
      to that charge.
    blk_first: A bank-draft payment the resident or representative makes during the call is applied to the resident's
      original coinsurance charge for the coverage's latest booked coinsurance block, that is, among the coverage's
      booked-days entries in the band of benefit days 21 through 100 the one whose last service date is the latest,
      and it settles the resident's share of the settled block's covered days less the payments already applied
      to that charge.
    blk_booked: The bank draft counts the settled block's covered days, which are its booked days less every day
      reversed against its booked-days entry; the rounded figure less the payments already applied to the resident's
      charge, net of any returned payments, is the bank draft, never less than nothing.
    blk_cnt: 'The bank draft is worked out only for a settled block that passes this record test: its service month
      carries one booked-days entry in the band of benefit days 21 through 100; at most one such entry of the coverage
      has the last benefit day just before the settled block''s first benefit day; the bed-hold records book at
      most one leave for its service month and take back none of that leave''s held days; its booked-days entry
      carries at most one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence
      reversal on it covers a held night of that leave, and each such reversal counts every day of its span; an
      uncertified-day reversal on it counts every day of its span except the held nights and the hospital-day and
      leave-of-absence days inside the span; and, when the supplemental effective date falls after the settled block''s
      first service date, the block before it either has a resident charge billing exactly 100, 50 or 25 percent
      of that charge''s own days times its own daily rate, to within half a percentage point, or carries a secondary
      charge and no resident charge; and, when the resident''s charge for the settled block stands, its day count
      equals the settled block''s booked days less the days of every day reversal posted against its booked-days
      entry on or before the date that charge was posted; and no hospital-day or leave-of-absence reversal on that
      entry was posted after the date that charge was posted; and the settled block''s last service date falls in
      2024 or later, and the charge''s open balance is above nothing.'
    eff_on_file: The supplemental effective date the bank draft reads is the one recorded on the coverage; a coverage
      that records none has the tier on file in effect on every day of the settled block.
    eff_cut: The supplemental effective date the bank draft reads is the one recorded on the coverage; a coverage
      that records none has the tier on file in effect on every day of the settled block.
    cal_before: 'The days the bank draft counts before the supplemental effective date are first its calendar days
      of the settled block before that date: when the date falls after the settled block''s first service date and
      on or before its last, the days from the first service date up to the day before the date; when it falls after
      the last service date, every calendar day of the settled block; otherwise none.'
    tier_share:
    - Days the bank draft counts before the supplemental effective date take the earlier share; every other day
      it counts takes the resident share of the tier on file.
    - When the tier on file prohibits balance billing, as the QMB Medicaid Crossover tier does, the bank draft bills
      the resident nothing for any day on or after the tier's supplemental effective date, those days taking the
      tier's resident share of nothing, while days before that date keep the earlier split, QMB protection not reaching
      back before it.
