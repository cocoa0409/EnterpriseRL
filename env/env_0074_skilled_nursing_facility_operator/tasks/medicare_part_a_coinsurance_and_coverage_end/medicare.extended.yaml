    blk_first: 'The resident coinsurance charge for a block prices one booked coinsurance block: among the coverage''s
      booked-days entries in the band of benefit days 21 through 100, the one whose last service date is the latest.'
    blk_booked: The resident coinsurance charge counts the charged block's covered days, which are its booked days
      less every day reversed against its booked-days entry.
    blk_cnt: 'The resident coinsurance charge is worked out only for a charged block that passes this record test:
      its service month carries one booked-days entry in the band of benefit days 21 through 100; at most one such
      entry of the coverage has the last benefit day just before the charged block''s first benefit day; the bed-hold
      records book at most one leave for its service month and take back none of that leave''s held days; its booked-days
      entry carries at most one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence
      reversal on it covers a held night of that leave, and each such reversal counts every day of its span; an
      uncertified-day reversal on it counts every day of its span except the held nights and the hospital-day and
      leave-of-absence days inside the span; and, when the supplemental effective date falls after the charged block''s
      first service date, the block before it either has a resident charge billing exactly 100, 50 or 25 percent
      of that charge''s own days times its own daily rate, to within half a percentage point, or carries a secondary
      charge and no resident charge; and, when the resident''s charge for the charged block stands, its day count
      equals the charged block''s booked days less the days of every day reversal posted against its booked-days
      entry on or before the date that charge was posted; and the charged block''s last service date falls in 2024
      or later.'
    eff_on_file: The supplemental effective date the resident coinsurance charge reads is the one recorded on the
      coverage; a coverage that records none has the tier on file in effect on every day of the charged block.
    eff_cut: The supplemental effective date the resident coinsurance charge reads is the one recorded on the coverage;
      a coverage that records none has the tier on file in effect on every day of the charged block.
    cal_before: 'The days the resident coinsurance charge counts before the supplemental effective date are first
      its calendar days of the charged block before that date: when the date falls after the charged block''s first
      service date and on or before its last, the days from the first service date up to the day before the date;
      when it falls after the last service date, every calendar day of the charged block; otherwise none.'
    tier_share:
    - Days the resident coinsurance charge counts before the supplemental effective date take the earlier share;
      every other day it counts takes the resident share of the tier on file.
    - When the tier on file prohibits balance billing, as the QMB Medicaid Crossover tier does, the resident coinsurance
      charge bills the resident nothing for any day on or after the tier's supplemental effective date, those days
      taking the tier's resident share of nothing, while days before that date keep the earlier split, QMB protection
      not reaching back before it.
