  rule: >-
    A card payment the resident or representative makes during the call is applied to the resident's original coinsurance
    charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days entries
    in the band of benefit days 21 through 100 the one whose last service date is the latest, and it settles the
    resident's share of the days that charge prices less the payments already applied to that charge. A card payment
    toward a coinsurance block is taken only after the records carry a resident coinsurance charge for the coverage's
    latest booked coinsurance block, whenever that block's covered days take a resident share above nothing under
    the split in effect on them. The card payment is worked out only for a paid block that passes this record test:
    its service month carries one booked-days entry in the band of benefit days 21 through 100; at most one such
    entry of the coverage has the last benefit day just before the paid block's first benefit day; the bed-hold
    records book at most one leave for its service month and take back none of that leave's held days; its booked-days
    entry carries at most one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence
    reversal on it covers a held night of that leave, and each such reversal counts every day of its span; an uncertified-day
    reversal on it counts every day of its span except the held nights and the hospital-day and leave-of-absence
    days inside the span; and, when the supplemental effective date falls after the paid block's first service date,
    the block before it either has a resident charge billing exactly 100, 50 or 25 percent of that charge's own
    days times its own daily rate, to within half a percentage point, or carries a secondary charge and no resident
    charge; and, when the resident's charge for the paid block stands, its day count equals the paid block's booked
    days less the days of every day reversal posted against its booked-days entry on or before the date that charge
    was posted; and the paid block's last service date falls in 2024 or later. For a block that passes its record
    test, the resident coinsurance charge, the card payment, the rate-year correction, the reduction for reversed
    covered days and the bank draft each count the days before the supplemental effective date as their own policies
    state, and only for such a block; for every other block, the tier that sets the split is the one in effect on
    the days of service: a Medigap policy changes the split from the carrier's policy effective date and QMB protection
    from the first day of the month after the state's QMB determination, so days before the supplemental effective
    date keep the earlier split, and none of these five figures is priced for it. The card payment prices each day
    it counts at the daily coinsurance rate of 217.00, and days before the supplemental effective date take the
    earlier share of 100 percent. The daily rate the card payment settles follows the calendar year in which the
    paid block's days were furnished: a paid block whose last service date falls in 2025 is settled at 209.50 a
    day, a paid block whose last service date falls in 2024 at 204.00 a day, and any other paid block at 217.00
    a day. The supplemental effective date the card payment reads is the one recorded on the coverage; a coverage
    that records none has the tier on file in effect on every day of the paid block. The card payment counts the
    paid block's covered days, which are its booked days less every day reversed against its booked-days entry,
    once the resident's charge for the paid block stands, and no day before it stands; the rounded figure less the
    payments already applied to that charge, net of any returned payments, is the card payment, never less than
    nothing and never more than the card payment maximum of 5000.00. The days the card payment counts before the
    supplemental effective date are first its calendar days of the paid block before that date: when the date falls
    after the paid block's first service date and on or before its last, the days from the first service date up
    to the day before the date; when it falls after the last service date, every calendar day of the paid block;
    otherwise none. Each kind of day named below that is not a covered day is taken off those days, never leaving
    fewer than none nor more than the days the card payment counts. Days the card payment counts before the supplemental
    effective date take the earlier share; every other day it counts takes the resident share of the tier on file.
    The block before the paid block is the coverage's booked-days entry in the band of benefit days 21 through 100
    whose last benefit day is the day before the paid block's first benefit day; its resident charge is the resident
    coinsurance charge posted for it that is not a rebill of a denied secondary share. The earlier share the card
    payment applies is read from the block before: 50 percent when its resident charge bills half of that charge's
    own days times its own daily rate, to within half a percentage point; 25 percent when it bills a quarter, to
    within half a percentage point; 0 percent when the block before carries a secondary charge and no resident charge;
    and 100 percent otherwise. A night away at midnight on a bed-hold leave is not a covered day: when the bed-hold
    records book a leave for the paid block's service month, its held nights inside the paid block come off the
    days the card payment counts before the supplemental effective date, all of them when the last such night falls
    before that date, those from the first such night up to the day before the date when the date falls after the
    first such night and on or before the last, and none otherwise; when the month books no leave, none come off.
    A day reversed as a hospital day is not a covered day: when the paid block's booked-days entry carries a hospital-day
    reversal, its reversed days inside the paid block come off the days the card payment counts before the supplemental
    effective date, all of them when its last reversed day falls before that date, those from its first reversed
    day up to the day before the date when the date falls after its first reversed day and on or before its last,
    and none otherwise; without such a reversal, none come off. A day reversed as a leave-of-absence day is not
    a covered day: when the paid block's booked-days entry carries a leave-of-absence reversal, its reversed days
    inside the paid block come off the days the card payment counts before the supplemental effective date, all
    of them when its last reversed day falls before that date, those from its first reversed day up to the day before
    the date when the date falls after its first reversed day and on or before its last, and none otherwise; without
    such a reversal, none come off. A day reversed as an uncertified day is not a covered day: when the paid block's
    booked-days entry carries an uncertified-day reversal, the days of its span before the supplemental effective
    date come off the days the card payment counts before that date, all of the span when its last day falls before
    the date, the days from its first day up to the day before the date when the date falls after its first day
    and on or before its last, and none otherwise, in each case less the held nights and the hospital-day and leave-of-absence
    days inside that part of the span, which the reversal did not reverse; without such a reversal, none come off.
    The card payment adds, over the days it counts, the daily rate times the share each day takes, divides the sum
    by 100 and rounds it half up to the cent once. A card payment worked out above the resident's charge's open
    balance, which is its amount less the payments and adjustments posted against it plus any returned payments,
    shows that the charge was billed below what its days call for; the card payment is then not taken under this
    policy, and any payment the payer sends is applied only up to that open balance, the remainder being returned.
    Whether a card payment may be taken at all is settled by the base posting rule, which this policy leaves unchanged:
    once the resident has had the returned-payment limit of dishonored payments within the rolling lookback of calendar
    months ending on the payment date, only certified funds are accepted from the resident on any coverage episode,
    so no card payment is taken; this policy prices the card payment only where one may be taken. When the tier
    on file prohibits balance billing, as the QMB Medicaid Crossover tier does, the card payment bills the resident
    nothing for any day on or after the tier's supplemental effective date, those days taking the tier's resident
    share of nothing, while days before that date keep the earlier split, QMB protection not reaching back before
    it.
  prerequisite:
  - problem: medicare_ext_resident_block_share
    kind: value_input
    gate: cnt_days
    form: state
    policy_source: A card payment toward a coinsurance block is taken only after the records carry a resident coinsurance
      charge for the coverage's latest booked coinsurance block, whenever that block's covered days take a resident
      share above nothing under the split in effect on them.
    condition: medicare_ledger carries a medicare_coinsurance_charge with liable_party resident and an empty charge_entry_id
      naming the coverage's latest booked days_21_100 entry, whenever that block's covered days take a resident
      share above zero under the split in effect on them
    resolved_by: post_coinsurance_charge_97c12690
    effect: once the resident's charge for the latest block stands, cnt_days reads the block's covered days instead
      of none, so the card payment prices those days
  cross_category:
  - category: bedhold
    as: history
    reads:
    - bedhold_ledger.from_date
    - bedhold_ledger.to_date
    - bedhold_ledger.service_month
    - bedhold_ledger.bedhold_entry_id
    - bedhold_ledger.days_entry_id
    note: f_held_nights reads the held nights the bed-hold ledger books for the paid block's service month
  compute:
  - blk_id: LATEST('medicare_ledger', 'medicare_entry_id', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_from: LATEST('medicare_ledger', 'from_date', date_field='to_date', event_type='medicare_days_booked', day_band='days_21_100')
  - blk_to: LATEST('medicare_ledger', 'to_date', date_field='to_date', event_type='medicare_days_booked', day_band='days_21_100')
  - blk_month: LATEST('medicare_ledger', 'service_month', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_first: LATEST('medicare_ledger', 'first_benefit_day', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_booked: LATEST('medicare_ledger', 'day_count', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100')
  - blk_cnt: COUNT('medicare_ledger', event_type='medicare_days_booked', day_band='days_21_100', service_month=blk_month)
  - eff_on_file: F('supplemental_effective_date')
  - eff_cut: eff_on_file if (eff_on_file != None and eff_on_file != '') else '1900-01-01'
  - cal_before: DAYS(blk_from, eff_cut) if (DAYS(blk_from, eff_cut) > 0 and DAYS(eff_cut, blk_to) >= 0) else (DAYS(blk_from,
      blk_to) + 1 if DAYS(eff_cut, blk_to) < 0 else 0)
  - tier_share: P('resident_coinsurance_share_pct')
  - prev_cnt: COUNT('medicare_ledger', event_type='medicare_days_booked', day_band='days_21_100', last_benefit_day=blk_first
      - 1)
  - prev_blk: LATEST('medicare_ledger', 'medicare_entry_id', date_field='to_date', event_type='medicare_days_booked',
      day_band='days_21_100', last_benefit_day=blk_first - 1)
  - prev_res_n: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', liable_party='resident', days_entry_id=prev_blk,
      charge_entry_id='')
  - prev_res_amt: SUM('medicare_ledger', 'amount', event_type='medicare_coinsurance_charge', liable_party='resident',
      days_entry_id=prev_blk, charge_entry_id='')
  - prev_res_days: LATEST('medicare_ledger', 'day_count', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - prev_res_rate: LATEST('medicare_ledger', 'daily_coinsurance_rate', date_field='entry_date', event_type='medicare_coinsurance_charge',
      liable_party='resident', days_entry_id=prev_blk, charge_entry_id='')
  - prev_sec: COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medigap_carrier')
      + COUNT('medicare_ledger', event_type='medicare_coinsurance_charge', days_entry_id=prev_blk, liable_party='medicaid_crossover')
  - prev_pct: (prev_res_amt * 100 / (prev_res_days * prev_res_rate)) if (prev_res_n == 1 and prev_blk != None) else
      -1
  - prev_ok: (prev_pct > 99.5 and prev_pct < 100.5) or (prev_pct > 49.5 and prev_pct < 50.5) or (prev_pct > 24.5
      and prev_pct < 25.5) or (prev_blk != None and prev_res_n == 0 and prev_sec > 0)
  - lv_n: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_booked', service_month=blk_month)
  - lv_from_r: XLATEST('bedhold', 'bedhold_ledger', 'from_date', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_to_r: XLATEST('bedhold', 'bedhold_ledger', 'to_date', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_id: XLATEST('bedhold', 'bedhold_ledger', 'bedhold_entry_id', date_field='from_date', event_type='bedhold_day_booked',
      service_month=blk_month)
  - lv_rev: XCOUNT('bedhold', 'bedhold_ledger', event_type='bedhold_day_reversed', days_entry_id=lv_id) if lv_id
