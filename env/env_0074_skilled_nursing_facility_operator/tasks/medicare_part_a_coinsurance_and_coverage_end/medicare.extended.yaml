    kind: state_gate
    gate: medicare_ledger.adjustment_reason
    form: state
    policy_source: A bank-draft payment toward a resident coinsurance charge is not taken until the records carry,
      against that charge, a reduction for every uncertified-day reversal posted against its booked-days entry after
      the charge itself was posted and taking back days that take a resident share above nothing under the split
      in effect on them.
    condition: for every medicare_days_reversed entry with adjustment_reason uncertified_day naming the booked-days
      entry of the resident charge with an entry_date after that charge's entry_date and taking back days that take
      a resident share above zero under the split in effect on them, medicare_ledger carries a medicare_coinsurance_adjustment
      naming that charge with adjustment_reason uncertified_day
    resolved_by: reduce_coinsurance_for_reversed_days_0894f336
    effect: once the reduction for each uncertified-day reversal posted after the charge stands against it, the
      bank-draft payment toward that charge may be taken
