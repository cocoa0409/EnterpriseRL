    hl_e: 'A held night of the bed-hold leave booked for the lapse''s block''s service month is not a day the uncertified
      lapse reverses: the held nights that lie inside the reversal''s span come off the lapse''s days before the
      supplemental effective date, all of that overlap when its last day falls before the date, the overlap from
      its first day up to the day before the date when the date falls after its first day and on or before its last,
      and none otherwise or when there is no such record.'
    ovl_lv: 'A held night of the bed-hold leave booked for the lapse''s block''s service month is not a day the
      uncertified lapse reverses: the held nights that lie inside the reversal''s span come off the lapse''s days
      before the supplemental effective date, all of that overlap when its last day falls before the date, the overlap
      from its first day up to the day before the date when the date falls after its first day and on or before
      its last, and none otherwise or when there is no such record.'
    ovl_hd: 'A day already reversed as a hospital day on the lapse''s block is not a day the uncertified lapse reverses:
      the days of the hospital-day reversal that lie inside the reversal''s span come off the lapse''s days before
      the supplemental effective date, all of that overlap when its last day falls before the date, the overlap
      from its first day up to the day before the date when the date falls after its first day and on or before
      its last, and none otherwise or when there is no such record.'
    ovl_ld: 'A day already reversed as a leave-of-absence day on the lapse''s block is not a day the uncertified
      lapse reverses: the days of the leave-of-absence reversal that lie inside the reversal''s span come off the
      lapse''s days before the supplemental effective date, all of that overlap when its last day falls before the
      date, the overlap from its first day up to the day before the date when the date falls after its first day
      and on or before its last, and none otherwise or when there is no such record.'
    u_early: Each kind of day named below that lies inside that part of the span, and that the lapse therefore did
      not reverse, is taken off those days, never leaving fewer than none nor more than the reversal's day count;
      the reversal's other days fall from the date.
    result:
    - The reduction for reversed covered days adds, over the days it counts, the daily rate times the share each
      day takes, divides the sum by 100 and rounds it half up to the cent once.
    - The reduction for reversed covered days counts the reversal's day count, and it never exceeds the charge's
      open balance, which is its amount less the payments and adjustments posted against it plus any returned payments.
    - 'For a block that passes its record test, the resident coinsurance charge, the card payment, the rate-year
      correction, the reduction for reversed covered days and the bank draft each count the days before the supplemental
      effective date as their own policies state, and only for such a block; for every other block, the tier that
      sets the split is the one in effect on the days of service: a Medigap policy changes the split from the carrier''s
      policy effective date and QMB protection from the first day of the month after the state''s QMB determination,
      so days before the supplemental effective date keep the earlier split, and none of these five figures is priced
      for it.'
    - 'The reduction for reversed covered days is worked out only for a lapse''s block that passes this record test:
      its service month carries one booked-days entry in the band of benefit days 21 through 100; at most one such
      entry of the coverage has the last benefit day just before the lapse''s block''s first benefit day; the bed-hold
      records book at most one leave for its service month and take back none of that leave''s held days; its booked-days
      entry carries at most one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence
      reversal on it covers a held night of that leave, and each such reversal counts every day of its span; an
      uncertified-day reversal on it counts every day of its span except the held nights and the hospital-day and
      leave-of-absence days inside the span; and, when the supplemental effective date falls after the lapse''s
      block''s first service date, the block before it either has a resident charge billing exactly 100, 50 or 25
      percent of that charge''s own days times its own daily rate, to within half a percentage point, or carries
      a secondary charge and no resident charge; and, when the resident''s charge for the lapse''s block stands,
      its day count equals the lapse''s block''s booked days less the days of every day reversal posted against
      its booked-days entry on or before the date that charge was posted; and the lapse''s block''s last service
      date falls in 2024 or later, and the charge''s open balance is above nothing.'
