  trigger: on_request
  subject:
  - medicare_coinsurance_payment
  computes: amount
  target_tool: pay_coinsurance_by_bank_draft_32bb229d
  params:
    rate_2026: 217.0
    rate_2025: 209.5
    rate_2024: 204.0
    share_none: 100
    share_k: 50
    share_l: 25
    share_full: 0
  rule: >-
    A bank-draft payment the resident or representative makes during the call is applied to the resident's original
    coinsurance charge for the coverage's latest booked coinsurance block, that is, among the coverage's booked-days
    entries in the band of benefit days 21 through 100 the one whose last service date is the latest, and it settles
    the resident's share of the settled block's covered days less the payments already applied to that charge. A
    bank-draft payment toward a resident coinsurance charge is not taken until the records carry, against that charge,
    a reduction for every uncertified-day reversal posted against its booked-days entry after the charge itself
    was posted and taking back days that take a resident share above nothing under the split in effect on them.
    The bank draft is worked out only for a settled block that passes this record test: its service month carries
    one booked-days entry in the band of benefit days 21 through 100; at most one such entry of the coverage has
    the last benefit day just before the settled block's first benefit day; the bed-hold records book at most one
    leave for its service month and take back none of that leave's held days; its booked-days entry carries at most
    one day reversal for each reason and none for a booking error; no hospital-day or leave-of-absence reversal
    on it covers a held night of that leave, and each such reversal counts every day of its span; an uncertified-day
    reversal on it counts every day of its span except the held nights and the hospital-day and leave-of-absence
    days inside the span; and, when the supplemental effective date falls after the settled block's first service
    date, the block before it either has a resident charge billing exactly 100, 50 or 25 percent of that charge's
    own days times its own daily rate, to within half a percentage point, or carries a secondary charge and no resident
    charge; and, when the resident's charge for the settled block stands, its day count equals the settled block's
    booked days less the days of every day reversal posted against its booked-days entry on or before the date that
    charge was posted; and no hospital-day or leave-of-absence reversal on that entry was posted after the date
    that charge was posted; and the settled block's last service date falls in 2024 or later, and the charge's open
    balance is above nothing. For a block that passes its record test, the resident coinsurance charge, the card
    payment, the rate-year correction, the reduction for reversed covered days and the bank draft each count the
    days before the supplemental effective date as their own policies state, and only for such a block; for every
    other block, the tier that sets the split is the one in effect on the days of service: a Medigap policy changes
    the split from the carrier's policy effective date and QMB protection from the first day of the month after
    the state's QMB determination, so days before the supplemental effective date keep the earlier split, and none
    of these five figures is priced for it. The bank draft prices each day it counts at the daily coinsurance rate
    of 217.00, and days before the supplemental effective date take the earlier share of 100 percent. The daily
    rate the bank draft settles follows the calendar year in which the settled block's days were furnished: a settled
    block whose last service date falls in 2025 is settled at 209.50 a day, a settled block whose last service date
    falls in 2024 at 204.00 a day, and any other settled block at 217.00 a day. The supplemental effective date
    the bank draft reads is the one recorded on the coverage; a coverage that records none has the tier on file
    in effect on every day of the settled block. The bank draft counts the settled block's covered days, which are
    its booked days less every day reversed against its booked-days entry; the rounded figure less the payments
    already applied to the resident's charge, net of any returned payments, is the bank draft, never less than nothing.
    The days the bank draft counts before the supplemental effective date are first its calendar days of the settled
    block before that date: when the date falls after the settled block's first service date and on or before its
    last, the days from the first service date up to the day before the date; when it falls after the last service
    date, every calendar day of the settled block; otherwise none. Each kind of day named below that is not a covered
    day is taken off those days, never leaving fewer than none nor more than the days the bank draft counts. Days
    the bank draft counts before the supplemental effective date take the earlier share; every other day it counts
    takes the resident share of the tier on file. The block before the settled block is the coverage's booked-days
    entry in the band of benefit days 21 through 100 whose last benefit day is the day before the settled block's
    first benefit day; its resident charge is the resident coinsurance charge posted for it that is not a rebill
    of a denied secondary share. The earlier share the bank draft applies is read from the block before: 50 percent
    when its resident charge bills half of that charge's own days times its own daily rate, to within half a percentage
    point; 25 percent when it bills a quarter, to within half a percentage point; 0 percent when the block before
    carries a secondary charge and no resident charge; and 100 percent otherwise. A night away at midnight on a
    bed-hold leave is not a covered day: when the bed-hold records book a leave for the settled block's service
    month, its held nights inside the settled block come off the days the bank draft counts before the supplemental
    effective date, all of them when the last such night falls before that date, those from the first such night
    up to the day before the date when the date falls after the first such night and on or before the last, and
    none otherwise; when the month books no leave, none come off. A day reversed as a hospital day is not a covered
    day: when the settled block's booked-days entry carries a hospital-day reversal, its reversed days inside the
    settled block come off the days the bank draft counts before the supplemental effective date, all of them when
    its last reversed day falls before that date, those from its first reversed day up to the day before the date
    when the date falls after its first reversed day and on or before its last, and none otherwise; without such
    a reversal, none come off. A day reversed as a leave-of-absence day is not a covered day: when the settled block's
    booked-days entry carries a leave-of-absence reversal, its reversed days inside the settled block come off the
    days the bank draft counts before the supplemental effective date, all of them when its last reversed day falls
    before that date, those from its first reversed day up to the day before the date when the date falls after
    its first reversed day and on or before its last, and none otherwise; without such a reversal, none come off.
    A day reversed as an uncertified day is not a covered day: when the settled block's booked-days entry carries
    an uncertified-day reversal, the days of its span before the supplemental effective date come off the days the
    bank draft counts before that date, all of the span when its last day falls before the date, the days from its
    first day up to the day before the date when the date falls after its first day and on or before its last, and
    none otherwise, in each case less the held nights and the hospital-day and leave-of-absence days inside that
    part of the span, which the reversal did not reverse; without such a reversal, none come off. The bank draft
    adds, over the days it counts, the daily rate times the share each day takes, divides the sum by 100 and rounds
    it half up to the cent once. A bank draft worked out above the resident's charge's open balance, which is its
    amount less the payments and adjustments posted against it plus any returned payments, shows that the charge
    was billed below what its days call for; the bank draft is then not taken under this policy, and any payment
    the payer sends is applied only up to that open balance, the remainder being returned. Whether a bank draft
    may be taken at all is settled by the base posting rule, which this policy leaves unchanged: once the resident
    has had the returned-payment limit of dishonored payments within the rolling lookback of calendar months ending
    on the payment date, only certified funds are accepted from the resident on any coverage episode, so no bank
    draft is taken; this policy prices the bank draft only where one may be taken. When the tier on file prohibits
    balance billing, as the QMB Medicaid Crossover tier does, the bank draft bills the resident nothing for any
    day on or after the tier's supplemental effective date, those days taking the tier's resident share of nothing,
    while days before that date keep the earlier split, QMB protection not reaching back before it.
  prerequisite:
