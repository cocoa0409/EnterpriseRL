      and it prices the days of the uncertified-day reversal posted against that booked-days entry after the charge
      was posted, under that reversal's own reason.
    blk_cnt: 'The reduction for reversed covered days is worked out only for a lapse''s block that passes this record
      test: its service month carries one booked-days entry in the band of benefit days 21 through 100; at most
      one such entry of the coverage has the last benefit day just before the lapse''s block''s first benefit day;
      the bed-hold records book at most one leave for its service month and take back none of that leave''s held
      days; its booked-days entry carries at most one day reversal for each reason and none for a booking error;
      no hospital-day or leave-of-absence reversal on it covers a held night of that leave, and each such reversal
      counts every day of its span; an uncertified-day reversal on it counts every day of its span except the held
      nights and the hospital-day and leave-of-absence days inside the span; and, when the supplemental effective
      date falls after the lapse''s block''s first service date, the block before it either has a resident charge
      billing exactly 100, 50 or 25 percent of that charge''s own days times its own daily rate, to within half
      a percentage point, or carries a secondary charge and no resident charge; and, when the resident''s charge
      for the lapse''s block stands, its day count equals the lapse''s block''s booked days less the days of every
      day reversal posted against its booked-days entry on or before the date that charge was posted; and the lapse''s
      block''s last service date falls in 2024 or later, and the charge''s open balance is above nothing.'
    eff_on_file: The supplemental effective date the reduction for reversed covered days reads is the one recorded
      on the coverage; a coverage that records none has the tier on file in effect on every day of the lapse's block.
    eff_cut: The supplemental effective date the reduction for reversed covered days reads is the one recorded on
      the coverage; a coverage that records none has the tier on file in effect on every day of the lapse's block.
    cal_before: 'The reversed days the reduction for reversed covered days counts before the supplemental effective
      date are first the days of the reversal''s span before that date: all of the span when its last day falls
      before the date, the days from its first day up to the day before the date when the date falls after its first
      day and on or before its last, and none otherwise.'
    tier_share:
    - Reversed days the reduction for reversed covered days counts before the supplemental effective date take the
      earlier share; every other reversed day takes the resident share of the tier on file.
    - When the tier on file prohibits balance billing, as the QMB Medicaid Crossover tier does, the reduction for
      reversed covered days bills the resident nothing for any day on or after the tier's supplemental effective
      date, those days taking the tier's resident share of nothing, while days before that date keep the earlier
      split, QMB protection not reaching back before it.
