events:
- type: medicare_coverage_open
  target: medicare_coverages
  mutation: create
  meaning: A skilled admission is registered for Part A coverage review.
  grain: one row per coverage episode (one admission's Part A spell)
  fields:
    customer_id: the resident
    variant_name: tier fixed from the Medigap plan letter and QMB status on file
    qualifying_admit_date: inpatient admission date of the qualifying hospital stay
    qualifying_discharge_date: hospital discharge date
    qualifying_inpatient_midnights: consecutive inpatient midnights
    benefit_period_start_date: start of the benefit period from the Medicare eligibility response
    prior_snf_days_in_period: SNF days already used in this benefit period per the eligibility response
    coverage_start_date: SNF admission date
    medigap_plan_letter: Medigap plan letter on file
    qmb_status: verified QMB status
    secondary_payer_name: secondary payer as printed on the card
  triggers: []
- type: medicare_coverage_activate
  target: medicare_coverages
  mutation:
    transition:
      from: pending_verification
      to: active
  meaning: Part A coverage is confirmed and billing starts.
  grain: one row per transaction
  fields:
    status: becomes active
  triggers: []
- type: medicare_coverage_decline
  target: medicare_coverages
  mutation:
    transition:
      from: pending_verification
      to: not_eligible
  meaning: The admission is found not to qualify for Part A SNF coverage.
  grain: one row per transaction
  fields:
    status: becomes not_eligible
    end_reason: why coverage was declined
    closed_date: decision date
  triggers: []
- type: medicare_coverage_update
  target: medicare_coverages
  mutation: update
  meaning: Supplemental coverage, QMB status or certification facts on the coverage are updated.
  grain: one row per transaction
  fields:
    variant_name: re-derived tier
    medigap_plan_letter: updated plan letter
    qmb_status: updated QMB status
    supplemental_effective_date: date the new cost-sharing split takes effect
    secondary_payer_name: updated secondary payer
    last_certification_date: date of the most recent signed physician (re)certification
  triggers: []
- type: medicare_nomnc_delivered
  target: medicare_coverages
  mutation:
    transition:
      from: active
      to: notice_issued
  meaning: The Notice of Medicare Non-Coverage is delivered to the resident or representative.
  grain: one row per transaction
  fields:
    nomnc_delivered_date: date the signed NOMNC was delivered
    last_covered_date: last covered date printed on the notice
  triggers: []
- type: medicare_appeal_requested
  target: medicare_coverages
  mutation:
    transition:
      from: notice_issued
      to: under_appeal
  meaning: The resident's expedited QIO review request is logged.
  grain: one row per transaction
  fields:
    status: becomes under_appeal
  triggers: []
- type: medicare_appeal_reversed
  target: medicare_coverages
  mutation:
    transition:
      from: under_appeal
      to: active
  meaning: The QIO decides coverage must continue.
  grain: one row per transaction
  fields:
    last_covered_date: cleared because coverage continues
    qio_decision_date: QIO decision date
  triggers: []
- type: medicare_appeal_upheld
  target: medicare_coverages
  mutation:
    transition:
      from: under_appeal
      to: coverage_ended
  meaning: The QIO upholds the end of coverage.
  grain: one row per transaction
  fields:
    last_covered_date: final last covered date
    qio_decision_date: QIO decision date
    end_reason: qio_upheld
  triggers: []
- type: medicare_notice_expired
  target: medicare_coverages
  mutation:
    transition:
      from: notice_issued
      to: coverage_ended
  meaning: The NOMNC's last covered date passes without a timely appeal.
  grain: one row per transaction
  fields:
    end_reason: skilled_need_ended
  triggers: []
- type: medicare_coverage_end
  target: medicare_coverages
  mutation:
    transition:
      from: active
      to: coverage_ended
  meaning: Coverage ends without a NOMNC.
  grain: one row per transaction
  fields:
    last_covered_date: last covered date
    end_reason: benefit_days_exhausted, discharged_from_center, hospital_transfer_no_return or resident_deceased
  triggers: []
- type: medicare_coverage_close
  target: medicare_coverages
  mutation:
    transition:
      from: coverage_ended
      to: closed
  meaning: A settled, ended coverage is closed.
  grain: one row per transaction
  fields:
    closed_date: closing date
  triggers: []
- type: medicare_days_booked
  target: medicare_ledger
  meaning: Covered days of one service month and one cost-sharing band are booked to the benefit period.
  grain: one row per coverage, service month and day band
  distinguish_by:
  - service_month
  - day_band
  fields:
    service_month: service month YYYY-MM
    day_band: days_1_20 or days_21_100
    day_count: covered days in the block
    first_benefit_day: benefit-period day number of the first day
    last_benefit_day: benefit-period day number of the last day
    from_date: first service date
    to_date: last service date
    entry_date: posting date
  account: benefit_days
  direction: in
  triggers:
  - event: medicare:medicare_coinsurance_charge
    when:
      day_band: days_21_100
    map:
      service_month: service_month
      day_count: day_count
      days_entry_id: medicare_entry_id
- type: medicare_days_reversed
  target: medicare_ledger
  meaning: Booked covered days are taken back (leave-of-absence day, hospital day, uncertified day or booking error).
  grain: one row per reversed day block of one booked row and reason
  distinguish_by:
  - days_entry_id
  - from_date
  - adjustment_reason
  fields:
    days_entry_id: the booked-days entry being reversed
    service_month: service month of that entry
    day_band: band of that entry
    day_count: days reversed
    from_date: first reversed date
    to_date: last reversed date
    adjustment_reason: leave_of_absence_day, hospital_day, uncertified_day or booking_error
    entry_date: posting date
  account: benefit_days
  direction: out
  triggers:
  - event: medicare:medicare_coinsurance_adjustment
    when:
      day_band: days_21_100
    map:
      service_month: service_month
      adjustment_reason: adjustment_reason
      days_entry_id: days_entry_id
- type: medicare_coinsurance_charge
  target: medicare_ledger
  meaning: A coinsurance share for coinsurance days of one service month is billed to one liable party.
  grain: one row per booked-days entry and liable party
  distinguish_by:
  - days_entry_id
  - liable_party
  - charge_entry_id
  fields:
    days_entry_id: the booked days-21-100 entry the charge prices
    service_month: service month
    day_count: coinsurance days priced
    daily_coinsurance_rate: rate for the year of service
    liable_party: resident, medigap_carrier or medicaid_crossover
    amount: share billed (positive)
    entry_date: posting date
    charge_entry_id: for a rebill after a secondary denial, the denied secondary charge being rebilled; empty otherwise
  account: coinsurance_receivable
  direction: in
  triggers: []
- type: medicare_coinsurance_payment
  target: medicare_ledger
  meaning: A payment is applied to one coinsurance charge.
  grain: one row per payment receipt applied to one charge
  distinguish_by:
  - charge_entry_id
  - entry_date
  - payment_method
  fields:
    charge_entry_id: the coinsurance charge paid
    liable_party: party that paid
    payment_method: check, certified_check, ach, card, medigap_remittance or medicaid_crossover_remittance
    amount: amount applied (positive)
    entry_date: date received
  account: coinsurance_receivable
  direction: out
  triggers: []
- type: medicare_coinsurance_adjustment
  target: medicare_ledger
  meaning: 'A coinsurance charge is reduced: QMB balance-billing write-off, day or rate correction, share correction,
    or reversal of days.'
  grain: one row per charge and adjustment reason
  distinguish_by:
  - charge_entry_id
  - adjustment_reason
  fields:
    charge_entry_id: the coinsurance charge adjusted
    days_entry_id: the booked-days entry behind it
    service_month: service month
    adjustment_reason: qmb_balance_billing_prohibited, rate_year_correction, secondary_share_correction, secondary_denial,
      leave_of_absence_day, hospital_day, uncertified_day or booking_error
    amount: reduction (positive)
    entry_date: posting date
  account: coinsurance_receivable
  direction: out
  triggers: []
- type: medicare_payment_reversal
  target: medicare_ledger
  meaning: A previously applied payment is dishonored and taken back.
  grain: one row per reversed payment
  distinguish_by:
  - payment_entry_id
  fields:
    payment_entry_id: the payment entry dishonored
    charge_entry_id: the charge it had paid
    amount: amount reinstated (positive)
    entry_date: date of the return notice
  account: coinsurance_receivable
  direction: in
  triggers: []
- type: medicare_snfabn_delivered
  target: medicare_ledger
  meaning: A Skilled Nursing Facility Advance Beneficiary Notice is delivered and the beneficiary's chosen option
    recorded.
  grain: one row per notice delivery date
  distinguish_by:
  - entry_date
  - from_date
  fields:
    abn_option: option_1_bill_medicare, option_2_no_bill or option_3_stop_services
    entry_date: delivery date
    from_date: first date of the non-covered care the notice describes
  triggers: []
measures:
- id: medicare_msr_episode_days_booked
  window: the coverage episode, every service date before the first day of the block being booked
  measure: sum of day_count over medicare_days_booked minus sum of day_count over medicare_days_reversed on the
    same medicare_coverage_id
- id: medicare_msr_open_charge_balance
  window: the life of one coinsurance charge, as of the posting date
  measure: amount of the named medicare_coinsurance_charge minus medicare_coinsurance_payment and medicare_coinsurance_adjustment
    amounts naming it as charge_entry_id plus medicare_payment_reversal amounts naming it
- id: medicare_msr_returned_payments
  window: rolling returned_payment_lookback_months calendar months ending on the payment date, across all of the
    resident's coverage episodes
  measure: count of medicare_payment_reversal entries
policies:
- id: medicare_agg_multi_holding
  subject:
  - medicare_coverage_open
  rule: A resident may hold any number of Part A coverage episodes over time, one per skilled admission, but only
    one episode may be open at a time; an episode is open while its status is pending_verification, active, notice_issued
    or under_appeal. A new episode is opened only when no other episode of the resident is open. A return to the
    center within the interrupted-stay window continues the open episode and opens nothing new; a return after that
    window opens a new episode once the earlier one has ended.
  eligibility:
  - id: one_open_episode
    applies_to:
    - medicare_coverage_open
    kind: dedup
    condition: A new episode is opened only when no other episode of the resident is open.
    evidence_fields:
    - medicare_coverages.customer_id
    - medicare_coverages.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_coverages.customer_id
      action_bindings:
        medicare_coverages.customer_id: customer_id
    dedup_contract:
      table: medicare_coverages
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending_verification
        - active
        - notice_issued
        - under_appeal
      distinct_fields: []
  params:
    max_per_customer: null
    interrupted_stay_return_days: =interrupted_stay_return_days
- id: medicare_agg_benefit_period
  subject:
  - medicare_coverage_open
  - medicare_days_booked
  rule: 'Benefit days are counted per benefit period across every coverage episode of the resident, never per episode.
    The benefit period of an episode is the one on the Medicare eligibility response at admission: it began with
    the inpatient admission recorded as the benefit period start date and ends only after the resident has gone
    the benefit-period break of consecutive days without inpatient hospital or SNF care. The benefit-period day
    number of a covered day is the SNF days already used in the period before the episode, plus the net covered
    days booked earlier in the same episode, plus one; because the eligibility response already includes earlier
    episodes of the same period in the prior SNF days, those days are never added a second time. A day is booked
    only when its benefit-period day number does not exceed the benefit-period day limit. Days past the limit are
    not Part A days at all; they belong to whatever payer source covers the stay afterwards.'
  eligibility:
  - id: within_day_limit
    applies_to:
    - medicare_days_booked
    kind: authorization
    condition: A day is booked only when its benefit-period day number does not exceed the benefit-period day limit.
    evidence_fields:
    - medicare_coverages.medicare_coverage_id
    - medicare_coverages.prior_snf_days_in_period
    - medicare_coverages.covered_days_used
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_coverages.medicare_coverage_id
      action_bindings:
        medicare_coverages.medicare_coverage_id: medicare_coverage_id
  params:
    benefit_period_break_days: =benefit_period_break_days
    benefit_period_day_limit: =benefit_period_day_limit
  formula:
    first_benefit_day: prior_snf_days_in_period + medicare_msr_episode_days_booked + 1
    last_benefit_day: first_benefit_day + day_count - 1
  measures:
  - medicare_msr_episode_days_booked
- id: medicare_qualifying_stay
  subject:
  - medicare_coverage_activate
  - medicare_coverage_decline
  rule: 'Part A covers a SNF admission only after a qualifying hospital stay. The qualifying stay counts consecutive
    midnights as a formally admitted hospital inpatient; midnights in outpatient observation status never count.
    Coverage is activated only when the qualifying inpatient midnights are at least the qualifying minimum. Coverage
    is activated only when the SNF admission date is no later than the qualifying admission window after the qualifying
    hospital discharge date, counted in calendar days with the day after hospital discharge as day 1. A resident
    readmitted within the SNF readmission window after the last covered date of an earlier episode in the same benefit
    period needs no new qualifying stay: the earlier qualifying stay stands and the two dates are not re-tested.
    Coverage is activated only when the benefit period still has at least one unused benefit day. When any of these
    fails, the episode is declined as not_eligible with end_reason no_qualifying_stay, outside_transfer_window or
    no_benefit_days_remaining, in that order of testing; the decline itself bills nobody, and the stay is billed
    under whichever other payer source applies.'
  eligibility:
  - id: qualifying_midnights
    applies_to:
    - medicare_coverage_activate
    kind: authorization
    condition: Coverage is activated only when the qualifying inpatient midnights are at least the qualifying minimum.
    evidence_fields:
    - medicare_coverages.medicare_coverage_id
    - medicare_coverages.qualifying_inpatient_midnights
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_coverages.medicare_coverage_id
      action_bindings:
        medicare_coverages.medicare_coverage_id: medicare_coverage_id
  - id: transfer_window
    applies_to:
    - medicare_coverage_activate
    kind: authorization
    condition: Coverage is activated only when the SNF admission date is no later than the qualifying admission
      window after the qualifying hospital discharge date, counted in calendar days with the day after hospital
      discharge as day 1.
    evidence_fields:
    - medicare_coverages.medicare_coverage_id
    - medicare_coverages.coverage_start_date
    - medicare_coverages.qualifying_discharge_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_coverages.medicare_coverage_id
      action_bindings:
        medicare_coverages.medicare_coverage_id: medicare_coverage_id
  - id: days_remaining
    applies_to:
    - medicare_coverage_activate
    kind: authorization
    condition: Coverage is activated only when the benefit period still has at least one unused benefit day.
    evidence_fields:
    - medicare_coverages.medicare_coverage_id
    - medicare_coverages.prior_snf_days_in_period
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_coverages.medicare_coverage_id
      action_bindings:
        medicare_coverages.medicare_coverage_id: medicare_coverage_id
  params:
    qualifying_inpatient_midnights_min: =qualifying_inpatient_midnights_min
    observation_midnights_count: =observation_midnights_count
    qualifying_admission_window_days: =qualifying_admission_window_days
    snf_readmission_window_days: =snf_readmission_window_days
    benefit_period_day_limit: =benefit_period_day_limit
- id: medicare_evt_day_counting
  subject:
  - medicare_days_booked
  - medicare_days_reversed
  rule: 'Covered days are counted by the midnight census: a day counts when the resident is in the center at midnight,
    so the day of admission counts and the day of discharge does not. A leave-of-absence day, when the resident
    is away at midnight without being admitted to a hospital, is neither a covered day nor a benefit day, and a
    day the resident is a hospital inpatient at midnight is not a SNF day either. Days are booked per calendar month
    of service, closed early at the last covered date, one row per band: benefit-period days 1 through the full-coverage
    day limit are the days_1_20 band and later days up to the benefit-period day limit are the days_21_100 band,
    so a month that crosses the boundary is booked as two rows. Days are booked only while the coverage is active,
    notice_issued, under_appeal or coverage_ended. The first physician recertification is due by the initial recertification
    day and each later one within the recertification interval; days after a lapsed certification are provider liable,
    are reversed as uncertified_day and are never billed to the resident. A booked day later found to be a leave-of-absence
    day, a hospital day, an uncertified day or a booking error is reversed against the booked-days entry it came
    from, never by editing that entry, and reversing days of the days_21_100 band reduces the coinsurance charged
    on them. A booked-days entry is reversed only for dates and a reason not already reversed on it.'
  eligibility:
  - id: coverage_bookable
    applies_to:
    - medicare_days_booked
    kind: state
    condition: Days are booked only while the coverage is active, notice_issued, under_appeal or coverage_ended.
    evidence_fields:
    - medicare_coverages.medicare_coverage_id
    - medicare_coverages.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_coverages.medicare_coverage_id
      action_bindings:
        medicare_coverages.medicare_coverage_id: medicare_coverage_id
    state_contract:
      field: medicare_coverages.status
      allowed:
      - active
      - notice_issued
      - under_appeal
      - coverage_ended
  - id: reverse_once
    applies_to:
    - medicare_days_reversed
    kind: dedup
    condition: A booked-days entry is reversed only for dates and a reason not already reversed on it.
    evidence_fields:
    - medicare_ledger.days_entry_id
    - medicare_ledger.from_date
    - medicare_ledger.adjustment_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_ledger.days_entry_id
      action_bindings:
        medicare_ledger.days_entry_id: days_entry_id
    dedup_contract:
      table: medicare_ledger
      mode: separate_record
      object_bindings:
        days_entry_id: days_entry_id
      duplicate_filters:
        event_type:
        - medicare_days_reversed
      distinct_fields:
      - from_date
      - adjustment_reason
  params:
    midnight_census_day_rule: =midnight_census_day_rule
    admission_day_counts: =admission_day_counts
    discharge_day_counts: =discharge_day_counts
    loa_day_covered: =loa_day_covered
    loa_day_counts_toward_benefit: =loa_day_counts_toward_benefit
    hospital_leave_day_covered: =hospital_leave_day_covered
    full_coverage_day_limit: =full_coverage_day_limit
    benefit_period_day_limit: =benefit_period_day_limit
    initial_recertification_day: =initial_recertification_day
    recertification_interval_days: =recertification_interval_days
    uncertified_days_resident_liable: =uncertified_days_resident_liable
    days_booking_cycle: =days_booking_cycle
- id: medicare_evt_coinsurance
  subject:
  - medicare_coinsurance_charge
  rule: 'Each booked days_21_100 block is priced at the daily coinsurance rate of the calendar year in which those
    days of service fall, never at the rate of the posting date or of the admission year; a block that spans two
    years is booked as separate service months and priced month by month. The block total is the day count times
    that rate. The total is split by the tier''s coinsurance shares: the resident amount is the block total times
    the resident share percent, rounded half up to the cent, and the secondary amount is the block total minus the
    resident amount, billed to the tier''s secondary liable party; one charge row is posted per liable party with
    a non-zero amount, and a zero amount is not posted. The tier that sets the split is the one in effect on the
    days of service: a Medigap policy changes the split from the carrier''s policy effective date and QMB protection
    from the first day of the month after the state''s QMB determination, so days before the supplemental effective
    date keep the earlier split. Days 1 through the full-coverage day limit carry no coinsurance and are never charged.
    A block is charged once per liable party, apart from a rebill of a denied secondary share.'
  eligibility:
  - id: charge_once
    applies_to:
    - medicare_coinsurance_charge
    kind: dedup
    condition: A block is charged once per liable party, apart from a rebill of a denied secondary share.
    evidence_fields:
    - medicare_ledger.days_entry_id
    - medicare_ledger.liable_party
    - medicare_ledger.charge_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_ledger.days_entry_id
        - medicare_ledger.liable_party
      action_bindings:
        medicare_ledger.days_entry_id: days_entry_id
        medicare_ledger.liable_party: liable_party
    dedup_contract:
      table: medicare_ledger
      mode: separate_record
      object_bindings:
        days_entry_id: days_entry_id
        liable_party: liable_party
      duplicate_filters:
        event_type:
        - medicare_coinsurance_charge
      distinct_fields:
      - charge_entry_id
  params:
    per_tier:
      Medicare Part A Without Supplemental Coverage:
        resident_coinsurance_share_pct: =resident_coinsurance_share_pct
        secondary_coinsurance_share_pct: =secondary_coinsurance_share_pct
        secondary_liable_party: =secondary_liable_party
      Medicare Part A with Medigap Plan A or B:
        resident_coinsurance_share_pct: =resident_coinsurance_share_pct
        secondary_coinsurance_share_pct: =secondary_coinsurance_share_pct
        secondary_liable_party: =secondary_liable_party
      Medicare Part A with Medigap Plan K:
        resident_coinsurance_share_pct: =resident_coinsurance_share_pct
        secondary_coinsurance_share_pct: =secondary_coinsurance_share_pct
        secondary_liable_party: =secondary_liable_party
      Medicare Part A with Medigap Plan L:
        resident_coinsurance_share_pct: =resident_coinsurance_share_pct
        secondary_coinsurance_share_pct: =secondary_coinsurance_share_pct
        secondary_liable_party: =secondary_liable_party
      Medicare Part A with Full-Coinsurance Medigap:
        resident_coinsurance_share_pct: =resident_coinsurance_share_pct
        secondary_coinsurance_share_pct: =secondary_coinsurance_share_pct
        secondary_liable_party: =secondary_liable_party
      Medicare Part A with QMB Medicaid Crossover:
        resident_coinsurance_share_pct: =resident_coinsurance_share_pct
        secondary_coinsurance_share_pct: =secondary_coinsurance_share_pct
        secondary_liable_party: =secondary_liable_party
    coinsurance_rate_by_year: =coinsurance_rate_by_year
    full_coverage_day_limit: =full_coverage_day_limit
    coinsurance_rounding: =coinsurance_rounding
    medigap_change_effective_basis: =medigap_change_effective_basis
    qmb_effective_month_offset: =qmb_effective_month_offset
  formula:
    block_total: round(day_count * daily_coinsurance_rate, 2)
    resident_amount: round(block_total * resident_coinsurance_share_pct / 100, 2)
    secondary_amount: block_total - resident_amount
- id: medicare_evt_secondary_and_qmb
  subject:
  - medicare_coinsurance_adjustment
  - medicare_coinsurance_charge
  rule: 'When the tier prohibits balance billing, the resident is never billed any Medicare cost sharing: once the
    Medicaid crossover remittance for a charge has posted, whatever part of that crossover share the state did not
    pay is written off against the charge with reason qmb_balance_billing_prohibited, and no resident charge is
    ever raised for it. A QMB write-off is posted only after the Medicaid crossover remittance for that charge has
    posted. When a Medigap carrier denies its share and the tier rebills secondary denials to the resident, the
    carrier''s charge is reduced with reason secondary_denial and the same amount is charged to the resident as
    a new resident charge naming the denied charge; when the tier does not rebill denials, the share stays with
    the secondary payer and is followed up after the tier''s secondary follow-up days. A charge priced at the wrong
    year''s rate is corrected with reason rate_year_correction by the difference, and a split posted under a tier
    not in effect on the days of service is corrected with reason secondary_share_correction. Reversed covered days
    reduce the coinsurance charged on them with the day reversal''s own reason. An adjustment always names the charge
    it reduces and never exceeds that charge''s open balance.'
  eligibility:
  - id: crossover_posted
    applies_to:
    - medicare_coinsurance_adjustment
    kind: authorization
    condition: A QMB write-off is posted only after the Medicaid crossover remittance for that charge has posted.
    evidence_fields:
    - medicare_ledger.charge_entry_id
    - medicare_ledger.payment_method
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medicare_ledger.charge_entry_id
      action_bindings:
        medicare_ledger.charge_entry_id: charge_entry_id
  params:
    per_tier:
      Medicare Part A Without Supplemental Coverage:
        balance_billing_prohibited: =balance_billing_prohibited
        secondary_denial_rebill_to_resident: =secondary_denial_rebill_to_resident
        secondary_followup_days: =secondary_followup_days
