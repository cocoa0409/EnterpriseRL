      is the card payment, never less than nothing and never more than the card payment maximum of 5000.00.
    yr_rate: 'The daily rate the card payment settles follows the calendar year in which the paid block''s days
      were furnished: a paid block whose last service date falls in 2025 is settled at 209.50 a day, a paid block
      whose last service date falls in 2024 at 204.00 a day, and any other paid block at 217.00 a day.'
