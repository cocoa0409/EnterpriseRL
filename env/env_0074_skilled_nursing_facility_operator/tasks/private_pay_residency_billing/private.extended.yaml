    chg_id: >-
      This policy settles the conversion credit on the room-and-board charge of an agreement whose span begins latest, the
      one posted first where two begin on the same day, of an agreement whose stay another payer source took over, that
      charge being an advance billed for days the other payer source covered: one posted before the conversion date recorded
      on the agreement and carrying no payer-conversion credit yet; any other charge is owed no conversion credit.
    chg_from: >-
      The converted days run from the first converted day through the last day of the charge's span, or through the day
      before a move to another tier the agreement records on or after its conversion date inside that span, both days included,
      and are none where the first converted day falls after the day they stop.
    chg_to: >-
      The converted days run from the first converted day through the last day of the charge's span, or through the day
      before a move to another tier the agreement records on or after its conversion date inside that span, both days included,
      and are none where the first converted day falls after the day they stop.
    chg_tier: >-
      The moved days are the days from the later of the move date and the first day of the charge's span through the day
      before the first credited day, on an agreement that records a move to another tier dated before its recorded conversion
      date where that later day falls before the first credited day; otherwise there are none.
    chg_basis: >-
      The conversion credit schedule follows how the charge was priced: where the charge carries the standard charge basis
      and was posted on or after the current private pay schedule's effective date, it is the current schedule; where the
      charge carries the prior-rate notice-hold charge basis, it is the preceding schedule; otherwise the conversion credit
      schedule follows the standard method.
