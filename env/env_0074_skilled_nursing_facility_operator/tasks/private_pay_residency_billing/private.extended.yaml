    conv_cr: >-
      The re-charge span equals the re-charge days less the re-charge leave days that fall on or after the first re-charged
      day and on or before the last re-charge day, never below zero, times the re-charge rate, rounded half up to the cent
      once, on the final figure; where it is zero no span is posted.
    pa_id: >-
      Under this policy the Part A coverage episode read is the resident's episode whose booked days run latest, its booked
      block that begins latest deciding, and the SNF Advance Beneficiary Notice read is the one most recently delivered
      for that episode.
    last_cov: >-
      The re-charge days follow how Medicare's liability ended: where an SNF Advance Beneficiary Notice on file describes
