  rule: >-
    This policy settles the span charged for a resident's new room after a move inside a month whose advance charge was
    posted for the room the resident left, that advance being the agreement's room-and-board charge whose span begins latest,
    the one posted first where two begin on the same day: a charge for a tier other than the agreement's current tier where
    the agreement carries no isolation placement, or without the isolation charge basis where it carries one, whose span
    ends on or after the move date recorded on the agreement; any other charge is owed no new-room span, and none is posted
    on an agreement that records a conversion to another payer source whose recorded conversion date falls on or after the
    first day of that advance's span and after the move date recorded on the agreement, the payer-conversion credit and
    the span re-charging the days after that payer's coverage settling that month. Until then the earlier scheduled rate
    applies, save that the span this policy posts for a room the resident asked to move into is priced at the current private
    pay schedule from its first day, a move the resident requests needing no advance rate-change notice, and only that span;
    every other charged day stays under that rule. A move the resident requests reprices from the move date, save that a
    requested move into a tier whose daily rate under the current private pay schedule is higher than that of the tier the
    resident left, where the resident's latest room-change request was logged on or before the move date recorded on the
    agreement and names a later date inside the span of the advance charge billed for the room the resident left, reprices
    from that requested date, the resident not being charged the higher rate before the date asked for, and both the room-change
    credit on that advance and the new room's span reprice from it; every other move reprices from the move date. The new
    room's span charge equals the new room's span days less the new room's leave days that fall on or after the first and
    on or before the last of the new room's span days, never below zero, times the daily rate of the new room's priced tier
    under the new room's schedule, rounded half up to the cent once, on the final figure; where it is zero no span is posted.
    The span is entered for the service month of that charge, from the first of the new room's span days through the last
    of them, at that daily rate, for that tier, with the new room's span days less the new room's leave days as its day
    count, and with the charge basis isolation_rate where the agreement carries an isolation placement and the charge basis
    standard otherwise. The leave window begins on the move date recorded on the agreement and ends on the last day of that
    charge's span. In the standard method, the new room's span days run from the move date recorded on the agreement through
    the last day of the span, both days included. In the standard method, the new room's leave days are none. In the standard
    method, the new room's priced tier is the tier of the charge the span is split from. In the standard method, the new
    room's schedule is the one in effect for the agreement on the move date recorded on the agreement: the current private
    pay schedule where the agreement's rate notice took effect on or before that date, and the preceding schedule otherwise.
    The span for the resident's new room is not posted until the charge for the room the resident left carries its room-change
    credit. The new room's span days follow the credits on the charge it is split from: where that charge carries a room-change
    credit, they are the days that credit takes off, from its first credited day; where it carries none and the agreement
    records the move before the first day of that charge's span, they run from the first day of the span through its last
    day; otherwise they follow the standard method. The new room's leave days follow how the bed was kept: where the latest
    booking of resident-private bed-hold days (the one whose first booked day is latest, the one posted first where two
    share that day) start inside the leave window, they are those booked days less the days reversed against that booking,
    the remaining days counted in a row from the first booked day; where no such booked days start there and a private bed
    hold of the resident is in force with its first privately paid day inside the leave window, they are the days held so
    far, from that first day through the day before the span is worked out; otherwise they follow the standard method. The
    new room's priced tier follows the agreement: where the agreement carries an isolation placement, it is the agreement's
    isolation billing tier; where it carries none and the agreement's tier is not the tier of the charge the span is split
    from, it is the agreement's tier; otherwise it follows the standard method. The new room's schedule follows how the
    move came about: where the resident's latest room-change request was logged on or before the move date recorded on the
    agreement, the move being one the resident asked for, the new room's schedule is the current private pay schedule; where
    it was not and no rate notice delivery date is recorded on the agreement, it is the preceding schedule, a rate never
    noticed never applying; otherwise it follows the standard method. The resident's latest room-change request is the one
    logged latest, the one entered first where two were logged at the same moment.
