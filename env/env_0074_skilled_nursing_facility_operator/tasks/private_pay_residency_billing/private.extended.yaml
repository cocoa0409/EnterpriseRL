category: private
display_name: Private Pay Long-Term Care Residency
binding:
  holding_table: private_agreements
  event_tables:
  - private_ledger
  intake_tables:
  - private_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    account_balance: resident_account
    deposit_balance: security_deposit
lifecycle:
  states:
  - pending_admission
  - active
  - notice_period
  - payer_converted
  - discharged
  - closed
  - cancelled
  transitions:
  - from: pending_admission
    to: active
    by: agent
    means: The resident arrives and private-pay billing starts on the admission date.
  - from: pending_admission
    to: cancelled
    by: agent
    means: The planned admission does not take place.
  - from: active
    to: notice_period
    by: agent
    means: The center issues a written facility-initiated discharge notice.
  - from: notice_period
    to: active
    by: agent
    means: The discharge notice is rescinded (balance cured, Medicaid application submitted, or appeal decided for
      the resident).
  - from: notice_period
    to: discharged
    by: agent
    means: The resident leaves on or after the noticed discharge date.
  - from: active
    to: discharged
    by: agent
    means: The resident leaves the center (own choice, death, or hospital transfer with no return).
  - from: active
    to: payer_converted
    by: agent
    means: Another payer source (Medicaid pending, Medicaid, Medicare Part A or hospice room and board) takes over
      the stay.
  - from: payer_converted
    to: active
    by: agent
    means: The other payer source ends or is denied and private-pay billing resumes.
  - from: payer_converted
    to: closed
    by: agent
    means: A converted agreement with no private balance or deposit left is closed.
  - from: discharged
    to: closed
    by: agent
    means: The final statement is settled, the deposit disposed of and any credit refunded.
accounts:
- key: resident_account
  unit: USD
  meaning: Private-pay balance the resident owes; room-and-board charges, fees, refunds paid out and returned payments
    add, payments and credits subtract (negative = credit balance).
- key: security_deposit
  unit: USD
  meaning: Refundable security deposit held for the agreement; deposits received add, applications and refunds subtract.
parameter_schema:
  daily_rate_schedule: Private-pay daily room, board and routine nursing rate keyed by the schedule effective date
    (USD per day; map of YYYY-MM-DD -> rate).
  room_type: 'Accommodation type of the tier (enum: semi_private, private, suite).'
  beds_per_room: Licensed beds in a room of this tier (integer).
  secure_unit: Whether the room is on a secured memory care unit (boolean).
  dementia_diagnosis_required: Whether a dementia diagnosis on the care plan is required to occupy the tier (boolean).
  bariatric_weight_threshold_lb: Minimum documented weight in pounds that qualifies for the bariatric room; 0 where
    the tier has no weight criterion (integer).
  isolation_billing_tier: Tier whose rate applies when the center itself moves the resident into this room for infection
    control (official tier name).
  care_plan_review_days: Maximum days between care-plan reviews that confirm the tier's clinical criteria (integer;
    quarterly MDS cycle).
  rate_change_notice_days: Calendar days of written notice required before a change in the private-pay rate takes
    effect (42 CFR 483.10(g)(18)).
  rate_effective_basis: 'How the effective date of a scheduled rate is fixed for one agreement (enum: later_of_schedule_date_and_notice_plus_notice_days).'
  billing_cycle: 'Billing period for room and board (enum: calendar_month_in_advance).'
  statement_day_of_prior_month: Day of the prior month on which the advance statement for a service month issues
    (integer).
  payment_due_day_of_month: Day of the service month by which that month's advance charge is due (integer).
  admission_day_charged: Whether the day of admission is a chargeable day (boolean).
  discharge_day_charged: Whether the day of discharge is a chargeable day (boolean).
  death_day_charged: Whether the day of death is a chargeable day (boolean).
  charge_day_rule: 'How chargeable days are counted (enum: midnight_census).'
  first_month_basis: 'How the admission month is charged (enum: daily_rate_times_days_from_admission_to_month_end).'
  room_change_rate_basis: 'From when a resident-requested room change reprices (enum: new_tier_rate_from_move_date).'
  room_change_notice_required: Whether a resident-requested move to another tier needs the advance rate-change notice
    (boolean).
  security_deposit_days: Days of the tier's current daily rate collected as a refundable security deposit at private-pay
    admission (integer).
  deposit_prohibited_payer_sources: Payer sources for which no deposit may be requested or held (list; Medicare
    and Medicaid conditions of participation).
  deposit_disposition_days: Calendar days after discharge or payer conversion within which the deposit is applied
    or refunded (integer).
  deposit_application_order: 'How a deposit is disposed of (enum: apply_to_open_balance_then_refund_remainder).'
  credit_refund_days: Calendar days after discharge within which a credit balance is refunded (integer).
  refund_payee_on_death: 'Payee of a refund after the resident''s death (enum: estate, paid to the personal representative
    named in letters).'
  refund_regardless_of_notice: Whether prepaid charges for days after discharge are refunded regardless of any minimum-stay
    or discharge-notice term (boolean; 42 CFR 483.10(g)(18)(v)).
  minimum_stay_charge_allowed: Whether the agreement may charge for a minimum stay or for missing discharge notice
    (boolean).
  payment_application_order: 'Order in which an unallocated payment is applied (enum: oldest_service_month_first).'
  accepted_payment_methods: Methods the business office accepts for private-pay balances (list of controlled values).
  card_payment_max_usd: Largest single card payment accepted on a private-pay balance (USD).
  returned_payment_fee_usd: Fee charged for each dishonored payment under the operator's fee schedule (USD).
  returned_payment_limit: Dishonored payments within the lookback after which only certified funds are accepted
    (integer).
  returned_payment_lookback_months: Rolling lookback in calendar months for counting dishonored payments (integer).
  certified_funds_methods: Methods accepted once certified funds are required (list).
  late_charge_rate_pct_monthly: Late charge on the past-due room-and-board balance, per month (percent).
  late_charge_grace_days: Calendar days after the due date before an unpaid month becomes past due for late charges
    (integer).
  late_charge_min_past_due_usd: Smallest past-due balance on which a late charge is assessed (USD).
  late_charge_basis: 'What the late charge is computed on (enum: past_due_room_board_only = no late charge on fees
    or on earlier late charges).'
  late_charge_max_per_month: Late charges that may be assessed on one agreement per calendar month (integer).
  late_charge_suppressed_while_converted: Whether no late charge is assessed while the stay is converted to a pending
    or approved Medicaid payer source (boolean).
  collection_referral_days_past_due: Days a balance must be past due before it may be referred to the outside collection
    agency (integer).
  collection_referral_min_usd: Smallest past-due balance referred to collections (USD).
  discharge_notice_days: Calendar days of written notice before a facility-initiated discharge (42 CFR 483.15(c)(4)).
  discharge_notice_exception_reasons: Notice reasons that allow notice as soon as practicable instead of the full
    notice period (list).
  short_residence_days: Residence shorter than this many days allows notice as soon as practicable (integer).
  nonpayment_min_days_past_due: Days a charge must be past due before a discharge notice for nonpayment may issue
    (integer).
  medicaid_application_blocks_nonpayment_discharge: Whether a submitted Medicaid application means the resident
    is not in nonpayment status for discharge purposes (boolean).
  discharge_stayed_during_appeal: Whether a facility-initiated discharge waits while the resident's timely state
    appeal is pending (boolean).
  ombudsman_copy_required: Whether a copy of every facility-initiated discharge notice goes to the State Long-Term
    Care Ombudsman (boolean).
  final_statement_days: Calendar days after discharge within which the final statement issues (integer).
  close_requires_zero_balance: Whether an agreement may be closed only with a zero balance and a disposed deposit
    (boolean).
