  - co_tier: >-
      co_chg_tier if co_chg_tier != agr_tier else (P('isolation_billing_tier') if chg_basis == 'isolation_rate' else agr_tier)
  - co_notice_in: >-
      (DAYS(notice_date, moved_on) >= P('rate_change_notice_days') and moved_on >= '2026-07-01') if (notice_date and moved_on)
