    form: state
    policy_source: >-
      The span for the resident's new room is not posted until the charge for the room the resident left carries its room-change
      credit.
    condition: >-
      The room-and-board charge for the room the resident left carries an adjustment with reason room_change_proration posted
      against it, whose first credited day starts the new room's span.
    resolved_by: credit_room_change_days_09a50cb9
    effect: >-
      Once the room-change credit stands on the old room's charge, the new room's span days are the days that credit takes
      off, from its first credited day, instead of running from the move date recorded on the agreement.
  cross_category:
  - category: bedhold
    as: history
    reads:
    - bedhold_ledger.bedhold_entry_id
    - bedhold_ledger.day_count
    - bedhold_ledger.day_payer
    - bedhold_ledger.days_entry_id
    - bedhold_ledger.from_date
    - private_hold_start_date
    - status
    note: >-
      the leave factor reads the resident-private days booked for the latest leave, or a private hold in force
  compute:
  - chg_id: >-
      LATEST('private_ledger','private_entry_id', date_field='from_date', event_type='private_room_board_charge')
  - chg_from: LATEST('private_ledger','from_date', date_field='from_date', event_type='private_room_board_charge')
  - chg_to: LATEST('private_ledger','to_date', date_field='from_date', event_type='private_room_board_charge')
  - chg_basis: >-
      LATEST('private_ledger','charge_basis', date_field='from_date', event_type='private_room_board_charge')
  - chg_tier: >-
      LATEST('private_ledger','accommodation_tier', date_field='from_date', event_type='private_room_board_charge')
  - agr_tier: F('variant_name')
  - moved_on: F('last_room_change_date')
  - iso_on: F('isolation_placement')
  - notice_date: F('rate_notice_delivered_date')
  - conv_rec: F('converted_to')
  - conv_on: F('conversion_date')
  - conv_back: >-
      True if (conv_rec and conv_on and moved_on and DAYS(moved_on, conv_on) > 0 and conv_on >= chg_from) else False
  - subj: >-
      True if (moved_on and DAYS(moved_on, chg_to) >= 0 and ((chg_tier != agr_tier and not iso_on) or (iso_on and chg_basis
      != 'isolation_rate')) and not conv_back) else False
  - rc_n: >-
      COUNT('private_ledger', event_type='private_adjustment', adjustment_reason='room_change_proration', charge_entry_id=chg_id)
  - rc_from: >-
      LATEST('private_ledger','from_date', date_field='entry_date', event_type='private_adjustment', adjustment_reason='room_change_proration',
      charge_entry_id=chg_id)
  - sp_first: rc_from if rc_n > 0 else (chg_from if (moved_on and moved_on < chg_from) else moved_on)
  - rc_cnt: >-
      SUM('private_ledger','day_count', event_type='private_adjustment', adjustment_reason='room_change_proration', charge_entry_id=chg_id)
  - new_span_days: rc_cnt if rc_n > 0 else (MX(0, DAYS(sp_first, chg_to) + 1) if sp_first else 0)
  - lv_id: >-
      XLATEST('bedhold','bedhold_ledger','bedhold_entry_id', date_field='from_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - lv_from: >-
      XLATEST('bedhold','bedhold_ledger','from_date', date_field='from_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - lv_booked: >-
      XLATEST('bedhold','bedhold_ledger','day_count', date_field='from_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - lv_rev: >-
      XSUM('bedhold','bedhold_ledger','day_count', event_type='bedhold_day_reversed', days_entry_id=lv_id) if lv_id else
      0
  - win_from: moved_on
  - hf_from: CFIELD('bedhold','private_hold_start_date', status='held')
  - span_leave_days: >-
      MX(0, lv_booked - (lv_rev or 0)) if (lv_from and win_from and lv_from >= win_from and lv_from <= chg_to) else (MX(0,
      DAYS(hf_from, NOW)) if (hf_from and win_from and hf_from >= win_from and hf_from <= chg_to) else 0)
  - lv_start: lv_from if (lv_from and win_from and lv_from >= win_from and lv_from <= chg_to) else hf_from
  - leave_in: >-
      MX(0, MN(span_leave_days, DAYS(lv_start, sp_first) + new_span_days) - MX(0, DAYS(lv_start, sp_first))) if (span_leave_days
      and sp_first and lv_start) else 0
  - b_chg_tier: >-
      LATEST('private_ledger','accommodation_tier', date_field='from_date', event_type='private_room_board_charge')
  - b_tier: P('isolation_billing_tier') if iso_on else (agr_tier if agr_tier != b_chg_tier else b_chg_tier)
  - b_req_at: LATEST('private_requests','created_at', date_field='created_at', request_type='room_change_request')
  - notice_in_force: >-
      (DAYS(notice_date, moved_on) >= P('rate_change_notice_days') and moved_on >= '2026-07-01') if (notice_date and moved_on)
      else False
  - b_current: >-
      True if (b_req_at and moved_on and DAYS(b_req_at, moved_on) >= 0) else (False if not notice_date else notice_in_force)
  - result: >-
      RND(MX(0, new_span_days - leave_in) * ((K('r26_semi_ltc') if b_current else K('r25_semi_ltc')) if b_tier == 'Semi-Private
      Long-Term Care Room' else ((K('r26_semi_mc') if b_current else K('r25_semi_mc')) if b_tier == 'Semi-Private Secure
      Memory Care Room' else ((K('r26_priv_ltc') if b_current else K('r25_priv_ltc')) if b_tier == 'Private Long-Term Care
      Room' else ((K('r26_priv_mc') if b_current else K('r25_priv_mc')) if b_tier == 'Private Secure Memory Care Room' else
      ((K('r26_bariatric') if b_current else K('r25_bariatric')) if b_tier == 'Private Bariatric Care Room' else (K('r26_suite')
      if b_current else K('r25_suite'))))))) + 0.000000001, 2) if subj else 0
  compute_basis:
