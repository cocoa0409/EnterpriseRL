    span_leave_days: >-
      The new room's leave days follow how the bed was kept: where the latest booking of resident-private bed-hold days
      (the one whose first booked day is latest, the one posted first where two share that day) start inside the leave window,
      they are those booked days less the days reversed against that booking, the remaining days counted in a row from the
      first booked day; where no such booked days start there and a private bed hold of the resident is in force with its
      first privately paid day inside the leave window, they are the days held so far, from that first day through the day
      before the span is worked out; otherwise they follow the standard method.
    lv_start: >-
      The new room's span charge equals the new room's span days less the new room's leave days that fall on or after the
      first and on or before the last of the new room's span days, never below zero, times the daily rate of the new room's
      priced tier under the new room's schedule, rounded half up to the cent once, on the final figure; where it is zero
      no span is posted.
    leave_in: >-
      The new room's span charge equals the new room's span days less the new room's leave days that fall on or after the
      first and on or before the last of the new room's span days, never below zero, times the daily rate of the new room's
      priced tier under the new room's schedule, rounded half up to the cent once, on the final figure; where it is zero
      no span is posted.
    b_chg_tier: >-
      The new room's priced tier follows the agreement: where the agreement carries an isolation placement, it is the agreement's
      isolation billing tier; where it carries none and the agreement's tier is not the tier of the charge the span is split
      from, it is the agreement's tier; otherwise it follows the standard method.
    b_tier: >-
      The new room's priced tier follows the agreement: where the agreement carries an isolation placement, it is the agreement's
      isolation billing tier; where it carries none and the agreement's tier is not the tier of the charge the span is split
      from, it is the agreement's tier; otherwise it follows the standard method.
    b_req_at: >-
      The new room's schedule follows how the move came about: where the resident's latest room-change request was logged
      on or before the move date recorded on the agreement, the move being one the resident asked for, the new room's schedule
      is the current private pay schedule; where it was not and no rate notice delivery date is recorded on the agreement,
      it is the preceding schedule, a rate never noticed never applying; otherwise it follows the standard method.
    notice_in_force: >-
      In the standard method, the new room's schedule is the one in effect for the agreement on the move date recorded on
      the agreement: the current private pay schedule where the agreement's rate notice took effect on or before that date,
      and the preceding schedule otherwise.
    b_current: >-
      The new room's schedule follows how the move came about: where the resident's latest room-change request was logged
      on or before the move date recorded on the agreement, the move being one the resident asked for, the new room's schedule
      is the current private pay schedule; where it was not and no rate notice delivery date is recorded on the agreement,
      it is the preceding schedule, a rate never noticed never applying; otherwise it follows the standard method.
    result: >-
      The new room's span charge equals the new room's span days less the new room's leave days that fall on or after the
      first and on or before the last of the new room's span days, never below zero, times the daily rate of the new room's
      priced tier under the new room's schedule, rounded half up to the cent once, on the final figure; where it is zero
      no span is posted.
  factors:
  - id: span_start_rule
    effect: method
    decides: sp_first
    bindings:
    - rc_n
    - rc_from
    - rc_cnt
    - sp_first
    - new_span_days
    ladder:
    - when: the charge the span is split from carries a room-change credit
      method: the days that credit takes off, from its first credited day
    - when: >-
        that charge carries none and the agreement records the move before the first day of that charge's span
      method: the whole span from its first day
    - when: otherwise
      method: from the move date recorded on the agreement through the last day of the span
    baseline:
      sp_first: moved_on
      new_span_days: MX(0, DAYS(moved_on, chg_to) + 1) if moved_on else 0
    evidence:
    - history
    cross_difficulty: null
  - id: span_leave_rule
    effect: method
    decides: span_leave_days
    bindings:
    - lv_id
    - lv_from
    - lv_booked
    - lv_rev
    - hf_from
    - span_leave_days
    ladder:
    - when: >-
        the latest booking of resident-private bed-hold days (latest first booked day) start inside the leave window
      method: >-
        those booked days less the days reversed against that booking, the rest counted from the first booked day
    - when: >-
        no such booked days start there and a private bed hold is in force with its first privately paid day inside the
        leave window
      method: the days held so far
    - when: otherwise
      method: none
    baseline:
      span_leave_days: '0'
    evidence:
    - cross_category
    cross_difficulty: bedhold
  - id: priced_tier_rule
    effect: parameter
    decides: b_tier
    bindings:
    - b_chg_tier
    - b_tier
    ladder:
    - when: the agreement carries an isolation placement
      value: the agreement's isolation billing tier
    - when: >-
        the agreement carries no isolation placement and its tier is not the tier of the charge the span is split from
      value: the agreement's tier
    - when: otherwise
      value: the tier of the charge the span is split from
    baseline:
      b_tier: chg_tier
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: schedule_choice
    effect: parameter
    decides: b_current
    bindings:
    - b_req_at
    - notice_in_force
    - b_current
    ladder:
    - when: >-
        the resident's latest room-change request was logged on or before the recorded move date (a move the resident asked
        for)
      value: the current private pay schedule
    - when: it was not and no rate notice delivery date is recorded on the agreement
      value: the preceding schedule
    - when: otherwise
      value: >-
        the schedule in effect for the agreement on the recorded move date (current once the agreement's rate notice has
        taken effect, preceding before)
    baseline:
      b_current: notice_in_force
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The new room's span charge equals the new room's span days less the new room's leave days that fall on or after the
      first and on or before the last of the new room's span days, never below zero, times the daily rate of the new room's
      priced tier under the new room's schedule, rounded half up to the cent once, on the final figure; where it is zero
      no span is posted. The span is entered for the service month of that charge, from the first of the new room's span
      days through the last of them, at that daily rate, for that tier, with the new room's span days less the new room's
