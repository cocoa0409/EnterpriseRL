      method: their total divided by three
    - when: one or two were
      method: the latest item charge
    - when: otherwise
      method: nothing
    baseline:
      item: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ancillary
  baseline:
    rule: >-
      The additional deposit equals the deposit days times the per-day deposit rate, plus the recurring-service allowance
      and the personal-item allowance, less the deposit balance recorded on the agreement, never below zero, rounded half
      up to the cent once, on the final figure; it is paid into the agreement's security deposit by the resident or representative,
      and where it is zero nothing is paid. The recurring-service allowance and the personal-item allowance secure one month
      of the ancillary charges the center bills the resident in arrears on the resident's ancillary account. The per-day
      deposit rate is the daily rate of the deposit tier under the deposit schedule less the insurer's daily benefit, never
      below zero, the benefit being taken off the daily rate before the rate is multiplied by the deposit days. Within the
      last given number of months means that fewer than that many whole calendar months separate the entry's date from the
      day the deposit is worked out. In the standard method, the deposit days are the security deposit days of the agreement's
      tier. In the standard method, the deposit tier is the tier of the agreement's admission-month charge, the tier the
      deposit was first set for. In the standard method, the deposit schedule is the one in effect on the agreement's admission
      date: the current private pay schedule for an admission on or after its effective date, and the preceding schedule
      otherwise. In the standard method, the insurer's daily benefit is nothing, the deposit being figured on the full daily
      rate. In the standard method, the recurring-service allowance is one month of every recurring service billed to the
      resident within the last twelve months, at the price schedule's monthly charge for that service. In the standard method,
      the personal-item allowance is nothing.
    params:
