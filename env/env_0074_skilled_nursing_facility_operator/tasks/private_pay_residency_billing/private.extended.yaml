      after the first day of the span, it is the later of that admission date and the first day of the span; otherwise the
      first hospital day follows the standard method.
    hosp_days: >-
      The hospital days run from the first hospital day through the day before the Part A coverage start date, and are none
      where there is no first hospital day or it does not fall before that date.
    mv_days: >-
      The moved days are the days from the later of the move date and the first day of the charge's span through the day
      before the first credited day, on an agreement that records a move to another tier dated before its recorded conversion
      date where that later day falls before the first credited day; otherwise there are none.
    mv_chg_tier: >-
      The moved-day rate follows the room the resident moved into: where the agreement carries no isolation placement and
      its tier's daily rate under the current private pay schedule is lower than that of the tier the charge was posted
      for, it is the difference between the two, the resident never paying the dearer room for nights spent in the cheaper
      one; where the agreement carries an isolation placement and the isolation billing tier's daily rate under the current
      schedule is lower than that of the tier the charge was posted for, it is that difference; otherwise the moved-day
      rate follows the standard method.
    mv_rate: >-
      The moved-day rate follows the room the resident moved into: where the agreement carries no isolation placement and
      its tier's daily rate under the current private pay schedule is lower than that of the tier the charge was posted
      for, it is the difference between the two, the resident never paying the dearer room for nights spent in the cheaper
      one; where the agreement carries an isolation placement and the isolation billing tier's daily rate under the current
      schedule is lower than that of the tier the charge was posted for, it is that difference; otherwise the moved-day
      rate follows the standard method.
    n_all: >-
      The resident's bed-hold reservations are counted kind by kind and status by status, the first reservation on file
      of each kind and status counting as one, and the count stands only where every bed-hold transfer notice on file names
      a counted reservation; the hospital kinds are the Medicaid hospital leave reserved bed, the private-pay hospital leave
      bed hold and the Medicare skilled-stay hospital leave bed hold.
    n_counted: >-
      The resident's bed-hold reservations are counted kind by kind and status by status, the first reservation on file
      of each kind and status counting as one, and the count stands only where every bed-hold transfer notice on file names
      a counted reservation; the hospital kinds are the Medicaid hospital leave reserved bed, the private-pay hospital leave
      bed hold and the Medicare skilled-stay hospital leave bed hold.
    h_count: >-
      The resident's bed-hold reservations are counted kind by kind and status by status, the first reservation on file
      of each kind and status counting as one, and the count stands only where every bed-hold transfer notice on file names
      a counted reservation; the hospital kinds are the Medicaid hospital leave reserved bed, the private-pay hospital leave
      bed hold and the Medicare skilled-stay hospital leave bed hold.
    in_scope: >-
      Advance room and board billed for days on or after the conversion date is credited with reason payer_conversion_credit,
      and every such credit other than the conversion credit this policy figures stays under that rule; this policy figures
      the conversion credit, as set out below, on an agreement whose stay's departure is on file as set out below or whose
      resident holds no hospital bed-hold reservation, and on every other agreement the advance billed for days on or after
      the conversion date is credited with reason payer_conversion_credit at the daily rate of that charge, rounded to the
      cent, the conversion date being the first day another payer source took over the stay: the Part A coverage start date
      where the agreement is active again with Medicare Part A recorded as the payer source it was last converted to, the
      first day of the charge's span where it is active again with another payer source recorded and an earlier charge already
      carries a payer-conversion credit, and the conversion date recorded on the agreement otherwise.
    hs_dep: >-
      Under this policy the Part A coverage episode read is the resident's episode whose booked days run latest, its booked
      block that begins latest deciding, and the stay's departure is the leave start date of the resident's hospital bed-hold
      reservation, of any hospital kind and any status, whose leave began on that episode's qualifying hospital admission
      date, or else of the one returned on the Part A coverage start date, or else, where the resident holds exactly one
      hospital bed-hold reservation as counted below, of that reservation, a night in hospital observation counting as a
      night away.
    base_cr: >-
      Advance room and board billed for days on or after the conversion date is credited with reason payer_conversion_credit,
      and every such credit other than the conversion credit this policy figures stays under that rule; this policy figures
      the conversion credit, as set out below, on an agreement whose stay's departure is on file as set out below or whose
      resident holds no hospital bed-hold reservation, and on every other agreement the advance billed for days on or after
      the conversion date is credited with reason payer_conversion_credit at the daily rate of that charge, rounded to the
      cent, the conversion date being the first day another payer source took over the stay: the Part A coverage start date
      where the agreement is active again with Medicare Part A recorded as the payer source it was last converted to, the
      first day of the charge's span where it is active again with another payer source recorded and an earlier charge already
      carries a payer-conversion credit, and the conversion date recorded on the agreement otherwise.
    dep_q: >-
      Under this policy the Part A coverage episode read is the resident's episode whose booked days run latest, its booked
      block that begins latest deciding, and the stay's departure is the leave start date of the resident's hospital bed-hold
      reservation, of any hospital kind and any status, whose leave began on that episode's qualifying hospital admission
      date, or else of the one returned on the Part A coverage start date, or else, where the resident holds exactly one
      hospital bed-hold reservation as counted below, of that reservation, a night in hospital observation counting as a
      night away.
    dep_r: >-
      Under this policy the Part A coverage episode read is the resident's episode whose booked days run latest, its booked
      block that begins latest deciding, and the stay's departure is the leave start date of the resident's hospital bed-hold
      reservation, of any hospital kind and any status, whose leave began on that episode's qualifying hospital admission
      date, or else of the one returned on the Part A coverage start date, or else, where the resident holds exactly one
      hospital bed-hold reservation as counted below, of that reservation, a night in hospital observation counting as a
      night away.
    base_on: >-
      Advance room and board billed for days on or after the conversion date is credited with reason payer_conversion_credit,
      and every such credit other than the conversion credit this policy figures stays under that rule; this policy figures
      the conversion credit, as set out below, on an agreement whose stay's departure is on file as set out below or whose
      resident holds no hospital bed-hold reservation, and on every other agreement the advance billed for days on or after
      the conversion date is credited with reason payer_conversion_credit at the daily rate of that charge, rounded to the
      cent, the conversion date being the first day another payer source took over the stay: the Part A coverage start date
      where the agreement is active again with Medicare Part A recorded as the payer source it was last converted to, the
      first day of the charge's span where it is active again with another payer source recorded and an earlier charge already
      carries a payer-conversion credit, and the conversion date recorded on the agreement otherwise.
  factors:
  - id: first_converted_day_rule
    effect: method
    decides: x_first
    bindings:
    - pa_back
    - pa_cov
    - prior_cc
    - x_first
    ladder:
    - when: >-
        the agreement is active again with Medicare Part A recorded as the payer source it was last converted to, and the
        resident's Part A coverage start date falls on or before the last day of the charge's span
      method: the later of that coverage start date and the first day of the span
    - when: >-
        the agreement is active again with another payer source recorded as the one it was last converted to, and an earlier
        charge already carries a payer-conversion credit
      method: the first day of the charge's span
    - when: otherwise
      method: the later of the conversion date recorded on the agreement and the first day of the charge's span
    baseline:
      x_first: MX(conv_on or '9999-12-31', chg_from)
    evidence:
    - holdings
    - cross_category
    - history
    cross_difficulty: medicare
  - id: hospital_days_rule
    effect: method
    decides: hd_from
    bindings:
    - dep_q
    - dep_r
    - hs_dep
    - hd_from
    ladder:
    - when: >-
        the stay's departure is on file (the hospital reservation begun on the qualifying admission, or the one returned
        on the coverage start, or the resident's only hospital reservation), on or before the span's last day, coverage
        starting after the span's first day
      method: >-
        from the later of the departure date and the span start, the departure night counting as a night away under the
        midnight census
    - when: >-
        the resident holds no hospital bed-hold reservation, the qualifying admission falls on or before the span's last
        day and coverage starts after its first day
      method: >-
        from the later of the qualifying admission date and the span start, counted by the inpatient admission
    - when: otherwise
      method: no hospital days
    baseline:
      hd_from: None
    evidence:
    - cross_category
    - date
    cross_difficulty: bedhold
  - id: moved_day_rate_rule
    effect: parameter
    decides: mv_rate
    bindings:
    - mv_chg_tier
    - mv_rate
    ladder:
    - when: >-
        no isolation placement and the agreement's tier is cheaper on the current schedule than the tier the charge was
        posted for
      value: the difference between the two tiers' current daily rates
    - when: >-
        an isolation placement and the isolation billing tier is cheaper on the current schedule than the tier the charge
        was posted for
      value: the difference between those two current daily rates
    - when: otherwise
      value: none
    baseline:
      mv_rate: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: credit_tier_rule
    effect: parameter
    decides: x_tier
    bindings:
    - x_chg_tier
    - x_tier
    ladder:
    - when: >-
        the agreement's tier is not the tier the charge was posted for and the agreement carries no isolation placement
      value: the tier the charge was posted for
    - when: the agreement carries an isolation placement
      value: the isolation billing tier of the agreement's tier
    - when: otherwise
      value: the agreement's own tier
    baseline:
      x_tier: agr_tier
    evidence:
    - holdings
    - history
    cross_difficulty: null
  - id: credit_schedule_rule
    effect: parameter
    decides: x_cur
    bindings:
    - x_ran
    - x_cur
    ladder:
    - when: >-
        the charge carries the standard charge basis and was posted on or after the current schedule's effective date
      value: the current private pay schedule
    - when: the charge carries the prior-rate notice-hold charge basis
      value: the preceding schedule
    - when: otherwise
      value: the schedule in effect for the agreement on the first day of the charge's span
    baseline:
      x_cur: x_ran and chg_from >= '2026-07-01'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: netted_step_rule
    effect: method
    decides: ns
    bindings:
    - ns_gap
    - ns
    ladder:
    - when: >-
        a rate notice delivery date is recorded, the span begins on or after the current schedule's effective date and the
        notice had not run the rate change notice days by its first day
      method: the current schedule's daily rate for the charge's tier less the preceding schedule's
    - when: that is not so and the charge carries credits
      method: the total of those credits divided by their days
    - when: otherwise
      method: the charge's daily rate
    baseline:
      ns: chg_rate
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The conversion credit equals the credited days times the conversion credit rate, plus the moved days times the moved-day
      rate, less the netted days times the netted per-day amount and less the netted amount of the other credits, the whole
      never below zero and rounded half up to the cent once, on the final figure; where it is zero no entry is made. The
      credited days are the converted days plus the hospital days. The conversion credit rate is the daily rate of the conversion
      credit tier under the conversion credit schedule. The converted days run from the first converted day through the
      last day of the charge's span, or through the day before a move to another tier the agreement records on or after
      its conversion date inside that span, both days included, and are none where the first converted day falls after the
      day they stop. The hospital days run from the first hospital day through the day before the Part A coverage start
      date, and are none where there is no first hospital day or it does not fall before that date. The first credited day
      is the first hospital day where there are hospital days, and the first converted day otherwise. The credit is entered
      against the charge with reason payer_conversion_credit, from the first credited day, with the credited days as its
      day count. The moved days are the days from the later of the move date and the first day of the charge's span through
      the day before the first credited day, on an agreement that records a move to another tier dated before its recorded
      conversion date where that later day falls before the first credited day; otherwise there are none. The netted days
      are the days of the late-notice credit on the charge, running consecutively from its first credited day, that fall
      on or after the first credited day and on or before the last converted day; the netted amount of the other credits
      is, for each room-change or billing-error credit on the charge, its days running consecutively from its first credited
      day that fall in that same stretch, times its amount divided by its days. In the standard method, the first converted
      day is the later of the conversion date recorded on the agreement and the first day of the charge's span. In the standard
      method, there is no first hospital day. In the standard method, the moved-day rate is none. In the standard method,
      the conversion credit tier is the agreement's own tier. In the standard method, the conversion credit schedule is
      the one in effect for the agreement on the first day of the charge's span: the current private pay schedule once the
      agreement's rate notice had run the rate change notice days by that day and the span begins on or after the current
      schedule's effective date, and the preceding schedule otherwise. In the standard method, the netted per-day amount
      is the charge's daily rate, an earlier credit being taken to have removed whole days as a discharge, death or conversion
      credit does.
    params:
    - rate_change_notice_days
    - isolation_billing_tier
    - r25_semi_ltc
    - r26_semi_ltc
    - r25_semi_mc
    - r26_semi_mc
    - r25_priv_ltc
    - r26_priv_ltc
    - r25_priv_mc
    - r26_priv_mc
    - r25_bariatric
    - r26_bariatric
    - r25_suite
    - r26_suite
