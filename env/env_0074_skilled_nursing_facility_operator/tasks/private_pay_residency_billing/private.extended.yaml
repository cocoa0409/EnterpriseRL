      carries the schedule the new-room rule sets and is owed no late-notice credit; a charge that already carries a late-notice
      credit is owed none, a charge being credited once per adjustment reason.
    ln_done: >-
      This policy settles the late-notice credit on the room-and-board charge of an agreement whose span begins latest,
