  baseline:
    rule: >-
      The late-notice credit equals the late-notice days less the late-notice leave days, never below zero, times the gap
      between the late-notice billed rate and the late-notice earlier rate, the whole never below zero and rounded half
      up to the cent once, on the final figure; where it is zero no entry is made. The credit is entered against that charge
      from the first day of its span, with the late-notice days less the late-notice leave days, never below zero, as its
      day count. The day the new rate took effect for the agreement is the later of the current schedule's effective date
      and the rate notice delivery date plus the rate change notice days; where no notice is recorded the new rate has not
      taken effect. In the standard method, the late-notice days are the days of the charge's span that fall before the
      effective date of the current private pay schedule, counted from the first day of the span and never more than the
      span's days. In the standard method, the late-notice leave days are none. In the standard method, the late-notice
      billed rate is the current schedule's daily rate for the agreement's own tier, and the late-notice earlier rate is
      the preceding schedule's daily rate for the agreement's own tier.
