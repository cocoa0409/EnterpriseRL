- id: private_ext_resumed_recharge
  base_policy_refs:
  - private_payer_source_change
  - private_evt_room_board_billing
  - private_rate_schedule
  - private_tier_placement
  overwrite:
  - base_policy: private_payer_source_change
    superseded_clause: >-
      If the other payer source is denied or ends while the resident stays, private-pay billing resumes: after a Medicaid
      denial, the denied pending period is charged again at the private rate from the original conversion date; after Part
      A coverage ends, from the day after the last covered date.
    replaced_by: >-
      If the other payer source is denied or ends while the resident stays, private-pay billing resumes: after a Medicaid
      denial, the denied pending period is charged again at the private rate from the original conversion date; after Part
      A coverage ends, from the day after the last covered date, save that a late SNF Advance Beneficiary Notice moves the
      first re-charged day and a pending expedited review holds every day, as this policy sets out; only the span this policy
      figures does so, and every other resumption stays under the base rule.
  trigger: state_due
  subject:
  - private_room_board_charge
  computes: amount
  target_tool: post_resumed_recharge_e6f5843a
  params:
    r25_semi_ltc: 384.0
    r26_semi_ltc: 398.0
    r25_semi_mc: 412.0
    r26_semi_mc: 427.0
    r25_priv_ltc: 421.0
    r26_priv_ltc: 436.0
    r25_priv_mc: 449.0
    r26_priv_mc: 465.0
    r25_bariatric: 466.0
    r26_bariatric: 482.0
    r25_suite: 497.0
    r26_suite: 514.0
  rule: >-
    This policy settles the span that charges again, at the private rate, the days after another payer source's coverage
    ended that an advance charge of the agreement no longer bills, that advance being the agreement's room-and-board charge
    whose span begins latest, the one posted first where two begin on the same day; an agreement that is not active again,
    still billed to the other payer source, is owed no re-charge span. If the other payer source is denied or ends while
    the resident stays, private-pay billing resumes: after a Medicaid denial, the denied pending period is charged again
    at the private rate from the original conversion date; after Part A coverage ends, from the day after the last covered
    date, save that a late SNF Advance Beneficiary Notice moves the first re-charged day and a pending expedited review
    holds every day, as this policy sets out; only the span this policy figures does so, and every other resumption stays
    under the base rule. The re-charge span equals the re-charge days less the re-charge leave days that fall on or after
    the first re-charged day and on or before the last re-charge day, never below zero, times the re-charge rate, rounded
    half up to the cent once, on the final figure; where it is zero no span is posted. The re-charge rate is the daily rate
    of the re-charge tier under the re-charge schedule. The re-charge days run from the first re-charged day through the
    last day of the advance's span, or through the day before a move to another tier the agreement records on or after its
    conversion date inside that span, the new room's span charging the later days, and they count only where the advance
    carries a payer-conversion credit; where it carries none, the advance still bills those days and no day is re-charged.
    The span is entered for the advance's service month, from the first re-charged day through the last re-charge day, at
    the re-charge rate, for the re-charge tier, with the re-charge days less the re-charge leave days as its day count and
    with the charge basis standard. In the standard method, the first re-charged day is the conversion date recorded on
    the agreement when private-pay billing resumed, and the re-charge days count that day and every later day of the span.
    In the standard method, the re-charge leave days are none. In the standard method, the re-charge tier is the tier the
    advance was posted for. In the standard method, the re-charge schedule is the one in effect for the agreement on the
    first day of the advance's span: the current private pay schedule once the agreement's rate notice had run the rate
    change notice days by that day and the span begins on or after the current schedule's effective date, and the preceding
    schedule otherwise. Under this policy the Part A coverage episode read is the resident's episode whose booked days run
    latest, its booked block that begins latest deciding, and the SNF Advance Beneficiary Notice read is the one most recently
    delivered for that episode. The span re-charging the days after the other payer source's coverage ended is posted only
    after the advance charge billed for those days carries its payer-conversion credit. The re-charge days follow how Medicare's
    liability ended: where an SNF Advance Beneficiary Notice on file describes care from a day after the Part A last covered
    date, was delivered after the first day of the care it describes, and records option 1 or option 2, the first re-charged
    day is the notice's delivery date, the center bearing the days before it; where no such notice is on file and an expedited
    review of the episode is pending, no day is re-charged, the resident not being billed while the review is pending; otherwise
    the re-charge days follow the standard method. The re-charge leave days follow how the bed was kept: where the latest
    booking of resident-private bed-hold days (the one whose first booked day is latest, the one posted first where two
    share that day) start on or after the conversion date recorded on the agreement and on or before the last day of the
    advance's span, they are those booked days less the days reversed against that booking, the remaining days counted in
    a row from the first booked day; where no such booked days start there and a private bed hold of the resident is in
    force with its first privately paid day on or after that conversion date, they are the days held so far, from that first
    day through the day before the span is worked out; otherwise the re-charge leave days follow the standard method. The
    re-charge tier follows where the resident lives now: where the agreement records a move to another tier dated before
    the conversion date recorded on the agreement, and carries no isolation placement, the re-charge tier is the agreement's
    own tier, the resident living in that room now and the payer-conversion credit having given the advance back; where
    the agreement carries an isolation placement, it is the isolation billing tier of the agreement's tier; otherwise the
    re-charge tier follows the standard method. The re-charge schedule follows the agreement's rate notice: where the notice
    had not run the rate change notice days by the first day of the advance's span but had run them by the conversion date
    recorded on the agreement, that date falling on or after the current schedule's effective date, it is the current private
    pay schedule; where a rate notice delivery date is recorded and the notice had not run the rate change notice days by
    the conversion date recorded on the agreement, it is the preceding schedule; otherwise the re-charge schedule follows
    the standard method.
