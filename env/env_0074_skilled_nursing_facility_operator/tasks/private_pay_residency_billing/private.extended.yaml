      the day the new rate took effect; otherwise the late-notice leave days follow the standard method.
    bt_basis: >-
      The late-notice billed rate follows the tier the charge was posted for: where the charge's tier is not the agreement's
      current tier, it is the current schedule's daily rate for the charge's tier; where the charge is the agreement's tier
      and carries the isolation charge basis, it is the current schedule's daily rate for the isolation billing tier; otherwise
      the late-notice billed rate follows the standard method.
    billed_rate: >-
      The late-notice billed rate follows the tier the charge was posted for: where the charge's tier is not the agreement's
      current tier, it is the current schedule's daily rate for the charge's tier; where the charge is the agreement's tier
      and carries the isolation charge basis, it is the current schedule's daily rate for the isolation billing tier; otherwise
      the late-notice billed rate follows the standard method.
    held_n: >-
      The late-notice earlier rate follows the agreement's billing history: where the agreement carries room-and-board charges
      posted for the charge's tier with the prior-rate notice-hold charge basis, it is the daily rate of the one of those
      whose span begins latest; where it carries none and the agreement's admission date is on or after the schedule's effective
      date, it equals the late-notice billed rate of the standard method, there being no earlier rate to restore; otherwise
      the late-notice earlier rate follows the standard method.
    held_rate: >-
      The late-notice earlier rate follows the agreement's billing history: where the agreement carries room-and-board charges
      posted for the charge's tier with the prior-rate notice-hold charge basis, it is the daily rate of the one of those
      whose span begins latest; where it carries none and the agreement's admission date is on or after the schedule's effective
