- id: private_ext_new_room_span
  base_policy_refs:
  - private_evt_room_board_billing
  - private_rate_schedule
  - private_tier_placement
  overwrite:
  - base_policy: private_rate_schedule
    superseded_clause: until then the earlier scheduled rate applies
    replaced_by: >-
      Until then the earlier scheduled rate applies, save that the span this policy posts for a room the resident asked
      to move into is priced at the current private pay schedule from its first day, a move the resident requests needing
      no advance rate-change notice, and only that span; every other charged day stays under that rule.
  - base_policy: private_tier_placement
    superseded_clause: A move the resident requests reprices from the move date
    replaced_by: >-
      A move the resident requests reprices from the move date, save that a requested move into a tier whose daily rate
      under the current private pay schedule is higher than that of the tier the resident left, where the resident's latest
      room-change request was logged on or before the move date recorded on the agreement and names a later date inside
      the span of the advance charge billed for the room the resident left, reprices from that requested date, the resident
