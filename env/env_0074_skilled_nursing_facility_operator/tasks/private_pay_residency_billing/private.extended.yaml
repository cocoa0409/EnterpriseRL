  overwrite:
  - base_policy: private_deposit
    superseded_clause: >-
      A refundable security deposit of the security deposit days times the tier's daily rate in effect on the admission
      date is collected on a private-pay agreement.
    replaced_by: >-
      A refundable security deposit of the security deposit days times the tier's daily rate in effect on the admission
      date is collected on a private-pay agreement at admission; on an agreement that records no conversion to another payer
      source, the additional deposit owed after a move to a room of another tier is figured by the additional-deposit rule,
      and on an agreement that records a conversion and is active again, the resumption deposit owed once private-pay billing
      resumes is figured by the resumption-deposit rule; every other deposit stays under the admission rule.
  trigger: on_request
  subject:
  - private_deposit_received
  computes: amount
  target_tool: pay_additional_deposit_f9f00bc8
  params:
    days_after_late_charge: 45
    days_certified_funds: 60
    averaging_days: 91
    r25_semi_ltc: 384.0
    r26_semi_ltc: 398.0
    r25_semi_mc: 412.0
    r26_semi_mc: 427.0
