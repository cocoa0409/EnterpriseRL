  - co_current: >-
      True if (chg_basis == 'standard' and chg_from >= '2026-07-01') else (False if chg_basis == 'prior_rate_notice_hold'
      else co_notice_in)
  - come_off_rate: >-
      ((K('r26_semi_ltc') if co_current else K('r25_semi_ltc')) if co_tier == 'Semi-Private Long-Term Care Room' else ((K('r26_semi_mc')
      if co_current else K('r25_semi_mc')) if co_tier == 'Semi-Private Secure Memory Care Room' else ((K('r26_priv_ltc')
      if co_current else K('r25_priv_ltc')) if co_tier == 'Private Long-Term Care Room' else ((K('r26_priv_mc') if co_current
      else K('r25_priv_mc')) if co_tier == 'Private Secure Memory Care Room' else ((K('r26_bariatric') if co_current else
      K('r25_bariatric')) if co_tier == 'Private Bariatric Care Room' else (K('r26_suite') if co_current else K('r25_suite')))))))
  - ln_n: >-
      COUNT('private_ledger', event_type='private_adjustment', adjustment_reason='rate_notice_late', charge_entry_id=chg_id)
  - ln_from: >-
      LATEST('private_ledger','from_date', date_field='entry_date', event_type='private_adjustment', adjustment_reason='rate_notice_late',
      charge_entry_id=chg_id)
  - ln_days: >-
      SUM('private_ledger','day_count', event_type='private_adjustment', adjustment_reason='rate_notice_late', charge_entry_id=chg_id)
  - ln_amt: >-
      SUM('private_ledger','amount', event_type='private_adjustment', adjustment_reason='rate_notice_late', charge_entry_id=chg_id)
  - be_n: >-
      COUNT('private_ledger', event_type='private_adjustment', adjustment_reason='billing_error', charge_entry_id=chg_id)
  - be_from: >-
      LATEST('private_ledger','from_date', date_field='entry_date', event_type='private_adjustment', adjustment_reason='billing_error',
      charge_entry_id=chg_id)
  - be_days: >-
      SUM('private_ledger','day_count', event_type='private_adjustment', adjustment_reason='billing_error', charge_entry_id=chg_id)
  - chg_rate: >-
      LATEST('private_ledger','daily_rate', date_field='from_date', event_type='private_room_board_charge')
  - net_any: COUNT('private_ledger', event_type='private_adjustment', charge_entry_id=chg_id)
  - net_sel: 3 if net_any == 0 else (1 if ln_n > 0 else (2 if be_n > 0 else 3))
  - ln_net: MX(0, ln_days - MX(0, DAYS(ln_from, move_date))) if (ln_n > 0 and move_date) else 0
  - be_net: MX(0, be_days - MX(0, DAYS(be_from, move_date))) if (be_n > 0 and move_date) else 0
  - pre_amt: >-
      (ln_net * (ln_amt / ln_days if ln_days else 0) + be_net * chg_rate) if net_sel == 1 else (be_net * chg_rate if net_sel
      == 2 else 0)
  - result: RND(MX(0, days_moved * come_off_rate - pre_amt) + 0.000000001, 2) if (subj and not in_conv) else 0
