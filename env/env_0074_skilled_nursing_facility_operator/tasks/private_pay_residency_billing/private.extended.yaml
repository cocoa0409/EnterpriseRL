  factors:
  - id: deposit_days_record
    effect: parameter
    decides: dep_days
    bindings:
    - rp_12
    - lc_12
    - dep_days
    ladder:
    - when: >-
        at least the returned-payment limit of payments on the agreement were dishonored within the last twelve months
      value: K('days_certified_funds')
    - when: fewer were dishonored and a late charge was assessed on the agreement within the last twelve months
      value: K('days_after_late_charge')
    - when: otherwise
      value: P('security_deposit_days')
    baseline:
      dep_days: P('security_deposit_days')
    evidence:
    - history
    cross_difficulty: null
  - id: deposit_tier_rule
    effect: parameter
    decides: dep_tier
    bindings:
    - span_tier
    - adm_tier
    - dep_tier
    ladder:
    - when: >-
        no isolation placement, a move date recorded, and the span that begins latest (the one posted first where two begin
        on the same day) is for a tier other than the admission-month charge's tier
      value: that span's tier
    - when: the agreement carries an isolation placement
      value: the isolation billing tier of the agreement's tier
    - when: otherwise
      value: the admission-month charge's tier
    baseline:
      dep_tier: adm_tier
    evidence:
    - history
    cross_difficulty: null
  - id: deposit_schedule_rule
    effect: parameter
    decides: dep_current
    bindings:
    - notice_date
    - notice_live
    - adm_current
    - dep_current
    ladder:
    - when: >-
        a rate notice delivery date is recorded and the notice has taken effect by the day the deposit is worked out
      value: the current private pay schedule
    - when: a rate notice delivery date is recorded and the notice has not yet taken effect
      value: the preceding schedule
    - when: otherwise
      value: the schedule in effect on the agreement's admission date
    baseline:
      dep_current: adm_current
    evidence:
    - date
    cross_difficulty: null
  - id: insurer_benefit_rule
    effect: method
    decides: ins_daily
    bindings:
    - ins_3
    - ins_amt
    - ins_chg
    - ins_chg_days
    - ins_sum_3
    - ins_daily
    ladder:
    - when: >-
        a long-term care insurer paid on the agreement under an assignment of benefits at least three times within the last
        three months
      method: >-
        the insurer's most recent payment divided by the days of the charge that payment paid (nothing where that charge
        shows no days)
    - when: the insurer paid on the agreement within the last three months but fewer than three times
      method: the insurer's payments within the last three months divided by the averaging days
    - when: otherwise
      method: nothing is taken off the daily rate
    baseline:
      ins_daily: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: recurring_allowance_rule
    effect: method
    decides: rec
    bindings:
    - rc_n
    - rc_s
    - rc_m
    - rc_ms
    - cab_12
    - tel_12
    - oxy_12
    - rec_std
    - cab_w
    - cab_all
    - tel_w
    - tel_all
    - oxy_w
    - oxy_all
    - cab_lm
    - tel_lm
    - oxy_lm
    - rc_est
    - rec
    ladder:
    - when: >-
        recurring charges posted within the last three months, every service among them also charged before those three
        months and in the latest service month billed
      method: their total divided by three
    - when: >-
        recurring charges posted within the last three months, a service among them not running through the whole period
      method: >-
        the total of all the recurring charges billed for the latest service month (the service month of the recurring charge
        posted latest)
    - when: otherwise
