  rule: >-
    A refundable security deposit of the security deposit days times the tier's daily rate in effect on the admission date
    is collected on a private-pay agreement at admission; on an agreement that records no conversion to another payer source,
    the additional deposit owed after a move to a room of another tier is figured by the additional-deposit rule, and on
    an agreement that records a conversion and is active again, the resumption deposit owed once private-pay billing resumes
    is figured by the resumption-deposit rule; every other deposit stays under the admission rule. The additional deposit
    equals the deposit days times the per-day deposit rate, plus the recurring-service allowance and the personal-item allowance,
    less the deposit balance recorded on the agreement, never below zero, rounded half up to the cent once, on the final
    figure; it is paid into the agreement's security deposit by the resident or representative, and where it is zero nothing
    is paid. The recurring-service allowance and the personal-item allowance secure one month of the ancillary charges the
    center bills the resident in arrears on the resident's ancillary account. The per-day deposit rate is the daily rate
    of the deposit tier under the deposit schedule less the insurer's daily benefit, never below zero, the benefit being
    taken off the daily rate before the rate is multiplied by the deposit days. Within the last given number of months means
    that fewer than that many whole calendar months separate the entry's date from the day the deposit is worked out. In
    the standard method, the deposit days are the security deposit days of the agreement's tier. In the standard method,
    the deposit tier is the tier of the agreement's admission-month charge, the tier the deposit was first set for. In the
    standard method, the deposit schedule is the one in effect on the agreement's admission date: the current private pay
    schedule for an admission on or after its effective date, and the preceding schedule otherwise. In the standard method,
    the insurer's daily benefit is nothing, the deposit being figured on the full daily rate. In the standard method, the
    recurring-service allowance is one month of every recurring service billed to the resident within the last twelve months,
    at the price schedule's monthly charge for that service. In the standard method, the personal-item allowance is nothing.
    The additional deposit is worked out only after the agreement carries the room-and-board span charged for the resident's
    new room. The deposit days follow the agreement's payment record: where at least the returned-payment limit of payments
    on the agreement were dishonored within the last twelve months, they are the days set for an agreement on certified
    funds; where fewer were and a late charge was assessed on the agreement within the last twelve months, they are the
    days set for an agreement with a recent late charge; otherwise the deposit days follow the standard method. The deposit
    tier follows the room the resident now occupies: where the agreement carries no isolation placement, records a move
    date, and its room-and-board span that begins latest (the one posted first where two begin on the same day) is for a
    tier other than the admission-month charge's tier, the deposit tier is that span's tier; where the agreement carries
    an isolation placement, it is the isolation billing tier of the agreement's tier, what the resident pays while placed
    there; otherwise the deposit tier follows the standard method. The deposit schedule follows the agreement's rate notice:
    where a rate notice delivery date is recorded and the notice has taken effect on or before the day the deposit is worked
    out, it is the current private pay schedule; where a delivery date is recorded and the notice has not yet taken effect,
    it is the preceding schedule; otherwise the deposit schedule follows the standard method. The insurer's daily benefit
    follows the agreement's assignment of benefits: where a long-term care insurer has paid on the agreement under an assignment
    of benefits at least three times within the last three months, it is the insurer's most recent payment on the agreement
    (the one posted first where two share a date) divided by the days of the charge that payment paid, nothing where that
    charge shows no days; where the insurer has paid on the agreement within the last three months but fewer than three
    times, it is the insurer's payments on the agreement within the last three months divided by the averaging days; otherwise
    the insurer's daily benefit follows the standard method. The recurring-service allowance follows the resident's recurring
    charges: where recurring charges were posted to the resident's ancillary account within the last three months and every
    recurring service among them was also charged before those three months and in the latest service month billed, the
    services having run through the whole period, it is the total of those charges divided by three; where recurring charges
    were posted within the last three months but a service among them did not run through the whole period, it is the total
    of all the recurring charges billed for the latest service month (the service month of the recurring charge posted latest,
    the charge posted first deciding where two share that posting date); otherwise the recurring-service allowance follows
    the standard method. The personal-item allowance follows the resident's personal items: where at least three item charges
    were posted to the resident's ancillary account within the last three months, it is their total divided by three; where
    one or two were, it is the latest item charge (the one posted first where two share a posting date); otherwise the personal-item
    allowance follows the standard method.
