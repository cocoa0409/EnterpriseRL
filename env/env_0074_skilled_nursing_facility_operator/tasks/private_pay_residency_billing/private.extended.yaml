- id: private_ext_room_change_credit
  base_policy_refs:
  - private_evt_discharge_refund
  - private_evt_room_board_billing
  - private_tier_placement
  overwrite:
  - base_policy: private_tier_placement
    superseded_clause: >-
      a move within a month splits that month's charge at the move date and credits any advance charge for the remaining
      days at the old tier with reason room_change_proration.
    replaced_by: >-
      A move within a month splits that month's charge at the move date and credits any advance charge for the remaining
      days at the old tier with reason room_change_proration, save that, on an agreement that records a conversion to another
      payer source whose recorded conversion date falls on or after the first day of the advance's span and after the move
      date recorded on the agreement, no room-change credit is posted, the payer-conversion credit and the span re-charging
      the days after that payer's coverage settling the advance; every other move stays under that rule.
  - base_policy: private_tier_placement
    superseded_clause: A move the resident requests reprices from the move date
    replaced_by: >-
      A move the resident requests reprices from the move date, save that a requested move into a tier whose daily rate
      under the current private pay schedule is higher than that of the tier the resident left, where the resident's latest
      room-change request was logged on or before the move date recorded on the agreement and names a later date inside
      the span of the advance charge billed for the room the resident left, reprices from that requested date, the resident
      not being charged the higher rate before the date asked for, and both the room-change credit on that advance and the
      new room's span reprice from it; every other move reprices from the move date.
  trigger: state_due
  subject:
  - private_adjustment
  computes: amount
  target_tool: credit_room_change_days_09a50cb9
  params:
    r25_semi_ltc: 384.0
    r26_semi_ltc: 398.0
    r25_semi_mc: 412.0
    r26_semi_mc: 427.0
    r25_priv_ltc: 421.0
    r26_priv_ltc: 436.0
    r25_priv_mc: 449.0
    r26_priv_mc: 465.0
    r25_bariatric: 466.0
    r26_bariatric: 482.0
    r25_suite: 497.0
    r26_suite: 514.0
  rule: >-
    This policy settles the room-change credit on the room-and-board charge of an agreement whose span begins latest, the
    one posted first where two begin on the same day, the charge billed for the room the resident left: a charge for a tier
    other than the agreement's current tier, or for the agreement's current tier with the isolation charge basis, whose
    span ends on or after the move date recorded on the agreement and which carries no room-change credit yet; any other
    charge is owed no room-change credit. A move within a month splits that month's charge at the move date and credits
    any advance charge for the remaining days at the old tier with reason room_change_proration, save that, on an agreement
    that records a conversion to another payer source whose recorded conversion date falls on or after the first day of
    the advance's span and after the move date recorded on the agreement, no room-change credit is posted, the payer-conversion
    credit and the span re-charging the days after that payer's coverage settling the advance; every other move stays under
    that rule. A move the resident requests reprices from the move date, save that a requested move into a tier whose daily
    rate under the current private pay schedule is higher than that of the tier the resident left, where the resident's
    latest room-change request was logged on or before the move date recorded on the agreement and names a later date inside
    the span of the advance charge billed for the room the resident left, reprices from that requested date, the resident
    not being charged the higher rate before the date asked for, and both the room-change credit on that advance and the
    new room's span reprice from it; every other move reprices from the move date. The room-change credit equals the days
    moved off the charge times the come-off rate, less the netted amount, the whole never below zero and rounded half up
    to the cent once, on the final figure; where it is zero no entry is made. The come-off rate is the daily rate of the
    come-off tier under the come-off schedule. The credit is entered against that charge from the move date, with the days
    moved off the charge as its day count. The days moved off the charge run from the move date through the last day of
    the charge's span, both days included, the move day itself being charged to the new room, and are never below zero.
    The netted days of an earlier credit are its days, running consecutively from its first credited day, that fall on or
    after the move date. In the standard method, the move date is the move date recorded on the agreement. In the standard
    method, the come-off tier is the agreement's own tier, and the come-off schedule is the private pay schedule that governed
    the agreement's own rate on the move date recorded on the agreement: the current schedule once the agreement's rate
    notice had run its notice days by that date and that date falls on or after the current schedule's effective date, and
    the preceding schedule otherwise. In the standard method, the netting names no credit, and the netted amount is none.
    Before the room-change credit on a charge is fixed, that charge must carry the late-notice credit owed on it. The move
    date follows the agreement's records: where the move reprices from the date named by the resident's latest room-change
    request under the rule on requested moves, the move date is that requested date; where it does not and the agreement
    records the move before the first day of the charge's span, the move date is the first day of the span; otherwise the
    move date follows the standard method. The come-off tier follows the charge itself: where the charge's tier is not the
    agreement's current tier, the come-off tier is the charge's tier; where the charge is for the agreement's current tier
    and carries the isolation charge basis, it is the agreement's isolation billing tier; otherwise the come-off tier follows
    the standard method. The come-off schedule follows how the charge was priced: where the charge carries the standard
    charge basis and its span begins on or after the current private pay schedule's effective date, it is the current schedule;
    where the charge carries the prior-rate notice-hold charge basis, it is the preceding schedule; otherwise the come-off
    schedule follows the standard method. The netting follows the credits already posted against the charge: where the charge
    carries a late-notice credit, the netting names that credit and any billing-error credit on the charge, and the netted
    amount is the late-notice credit's netted days times its amount divided by its days plus the billing-error credit's
    netted days times the charge's daily rate; where it carries no late-notice credit but carries a billing-error credit,
    the netting names that credit and the netted amount is its netted days times the charge's daily rate, a billing-error
    credit having taken whole days off; otherwise the netting follows the standard method. The resident's latest room-change
    request is the one logged latest, the one entered first where two were logged at the same moment.
  prerequisite:
  - problem: private_ext_late_notice_credit
    kind: value_input
    gate: ln_net
    form: state
    policy_source: >-
      Before the room-change credit on a charge is fixed, that charge must carry the late-notice credit owed on it.
    condition: >-
      The room-and-board charge being credited for the move carries an adjustment with reason rate_notice_late posted against
      it for the days billed at the new rate before the rate took effect for the agreement.
    resolved_by: credit_late_notice_days_45589810
    effect: >-
      Once the late-notice credit stands on the charge, the netting names it: its days on or after the move date are netted
      at its amount divided by its days, together with any billing-error credit's days on or after the move date at the
      charge's daily rate.
