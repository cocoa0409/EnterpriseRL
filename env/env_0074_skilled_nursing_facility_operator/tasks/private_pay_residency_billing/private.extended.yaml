    - lv_from
    - lv_booked
    - lv_rev
    - lv_in_span
    - hf_from
    - hf_in_span
    - away_days
    ladder:
    - when: >-
        the latest booking of resident-private bed-hold days (latest first booked day) start inside the charge's span
      method: >-
        those booked days less the days reversed against that booking, counted from the first booked day, falling before
        the day the new rate took effect for the agreement
    - when: >-
        no such booked days start inside the span and a private bed hold is in force with its first privately paid day inside
