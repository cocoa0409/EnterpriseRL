  - s_ran_conv: (DAYS(notice, conv_on) >= P('rate_change_notice_days')) if (notice and conv_on) else False
  - s_cur: >-
      True if (s_ran_conv and not s_ran_start and conv_on >= '2026-07-01') else (False if (notice and not s_ran_conv) else
      (s_ran_start and adv_from >= '2026-07-01'))
