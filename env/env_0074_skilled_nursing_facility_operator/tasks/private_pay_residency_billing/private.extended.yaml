      ((K('r26_semi_ltc') if s_cur else K('r25_semi_ltc')) if s_tier == 'Semi-Private Long-Term Care Room' else ((K('r26_semi_mc')
      if s_cur else K('r25_semi_mc')) if s_tier == 'Semi-Private Secure Memory Care Room' else ((K('r26_priv_ltc') if s_cur
      else K('r25_priv_ltc')) if s_tier == 'Private Long-Term Care Room' else ((K('r26_priv_mc') if s_cur else K('r25_priv_mc'))
      if s_tier == 'Private Secure Memory Care Room' else ((K('r26_bariatric') if s_cur else K('r25_bariatric')) if s_tier
      == 'Private Bariatric Care Room' else (K('r26_suite') if s_cur else K('r25_suite')))))))
  - result: RND(MX(0, rc_days - leave_in) * s_rate + 0.000000001, 2)
  compute_basis:
    adv_id: >-
      This policy settles the span that charges again, at the private rate, the days after another payer source's coverage
      ended that an advance charge of the agreement no longer bills, that advance being the agreement's room-and-board charge
      whose span begins latest, the one posted first where two begin on the same day; an agreement that is not active again,
      still billed to the other payer source, is owed no re-charge span.
    adv_from: >-
      In the standard method, the re-charge schedule is the one in effect for the agreement on the first day of the advance's
      span: the current private pay schedule once the agreement's rate notice had run the rate change notice days by that
      day and the span begins on or after the current schedule's effective date, and the preceding schedule otherwise.
    adv_to: >-
      The re-charge span equals the re-charge days less the re-charge leave days that fall on or after the first re-charged
      day and on or before the last re-charge day, never below zero, times the re-charge rate, rounded half up to the cent
      once, on the final figure; where it is zero no span is posted.
    adv_month: >-
      The re-charge span equals the re-charge days less the re-charge leave days that fall on or after the first re-charged
      day and on or before the last re-charge day, never below zero, times the re-charge rate, rounded half up to the cent
      once, on the final figure; where it is zero no span is posted.
    adv_tier: In the standard method, the re-charge tier is the tier the advance was posted for.
    agr_tier: >-
      The re-charge tier follows where the resident lives now: where the agreement records a move to another tier dated
      before the conversion date recorded on the agreement, and carries no isolation placement, the re-charge tier is the
      agreement's own tier, the resident living in that room now and the payer-conversion credit having given the advance
      back; where the agreement carries an isolation placement, it is the isolation billing tier of the agreement's tier;
      otherwise the re-charge tier follows the standard method.
    conv_on: >-
      In the standard method, the first re-charged day is the conversion date recorded on the agreement when private-pay
      billing resumed, and the re-charge days count that day and every later day of the span.
    notice: >-
      The re-charge schedule follows the agreement's rate notice: where the notice had not run the rate change notice days
      by the first day of the advance's span but had run them by the conversion date recorded on the agreement, that date
      falling on or after the current schedule's effective date, it is the current private pay schedule; where a rate notice
      delivery date is recorded and the notice had not run the rate change notice days by the conversion date recorded on
      the agreement, it is the preceding schedule; otherwise the re-charge schedule follows the standard method.
    moved_on: >-
      The re-charge tier follows where the resident lives now: where the agreement records a move to another tier dated
      before the conversion date recorded on the agreement, and carries no isolation placement, the re-charge tier is the
      agreement's own tier, the resident living in that room now and the payer-conversion credit having given the advance
      back; where the agreement carries an isolation placement, it is the isolation billing tier of the agreement's tier;
      otherwise the re-charge tier follows the standard method.
    iso: >-
      The re-charge tier follows where the resident lives now: where the agreement records a move to another tier dated
      before the conversion date recorded on the agreement, and carries no isolation placement, the re-charge tier is the
      agreement's own tier, the resident living in that room now and the payer-conversion credit having given the advance
