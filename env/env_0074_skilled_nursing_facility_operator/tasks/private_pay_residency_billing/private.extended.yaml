  factors:
  - id: notice_anchor
    effect: method
    decides: late_days
    bindings:
    - notice_short
    - notice_end_days
    - late_days
    ladder:
    - when: no rate notice delivery date is recorded on the agreement
      method: every day of the charge's span is a late-notice day
    - when: >-
        a rate notice delivery date is recorded and it falls fewer than the rate change notice days before the schedule's
        effective date, or on or after that date
      method: >-
        the late-notice days are the days of the span before the delivery date plus the rate change notice days
    - when: otherwise
      method: the late-notice days are the days of the span before the schedule's effective date
    baseline:
      late_days: MX(0, MN(span_days, DAYS(chg_from, '2026-07-01')))
    evidence:
    - date
    cross_difficulty: null
  - id: leave_kind
