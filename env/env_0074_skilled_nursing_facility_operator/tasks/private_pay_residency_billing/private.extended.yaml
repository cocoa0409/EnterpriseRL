      timing: pre_action
      correlation_keys:
      - - private_agreements.private_agreement_id
      action_bindings:
        private_agreements.private_agreement_id: private_agreement_id
  params:
    close_requires_zero_balance: =close_requires_zero_balance
extended_policies:
- id: private_ext_late_notice_credit
  base_policy_refs:
  - private_rate_schedule
  - private_evt_discharge_refund
  - private_evt_room_board_billing
  overwrite:
  - base_policy: private_rate_schedule
    superseded_clause: days billed at a new rate before it took effect are credited with reason rate_notice_late.
    replaced_by: >-
      Days billed at a new rate before it took effect are credited with reason rate_notice_late, every such credit other
      than the late-notice credit this policy figures staying under that rule; the late-notice credit this policy figures
      leaves out the days the resident spent away on a resident-private bed hold, those days being charged under the bed-hold
      reservation and not under this agreement, and is owed on no span posted for a room the resident asked to move into.
  trigger: state_due
  subject:
  - private_adjustment
  computes: amount
  target_tool: credit_late_notice_days_45589810
  params:
    r25_semi_ltc: 384.0
    r26_semi_ltc: 398.0
    r25_semi_mc: 412.0
    r26_semi_mc: 427.0
    r25_priv_ltc: 421.0
    r26_priv_ltc: 436.0
    r25_priv_mc: 449.0
    r26_priv_mc: 465.0
    r25_bariatric: 466.0
    r26_bariatric: 482.0
    r25_suite: 497.0
    r26_suite: 514.0
  rule: >-
    This policy settles the late-notice credit on the room-and-board charge of an agreement whose span begins latest, the
    one posted first where two begin on the same day, the charge whose span the credit corrects; a span posted for a room
    the resident asked to move into, one whose tier is the agreement's own and, where a move date is recorded on the agreement,
    whose first day is that recorded move date or the date named by the resident's latest room-change request, carries the
    schedule the new-room rule sets and is owed no late-notice credit; a charge that already carries a late-notice credit
    is owed none, a charge being credited once per adjustment reason. Days billed at a new rate before it took effect are
    credited with reason rate_notice_late, every such credit other than the late-notice credit this policy figures staying
    under that rule; the late-notice credit this policy figures leaves out the days the resident spent away on a resident-private
    bed hold, those days being charged under the bed-hold reservation and not under this agreement, and is owed on no span
    posted for a room the resident asked to move into. The late-notice credit equals the late-notice days less the late-notice
    leave days, never below zero, times the gap between the late-notice billed rate and the late-notice earlier rate, the
    whole never below zero and rounded half up to the cent once, on the final figure; where it is zero no entry is made.
    The credit is entered against that charge from the first day of its span, with the late-notice days less the late-notice
    leave days, never below zero, as its day count. The day the new rate took effect for the agreement is the later of the
    current schedule's effective date and the rate notice delivery date plus the rate change notice days; where no notice
    is recorded the new rate has not taken effect. In the standard method, the late-notice days are the days of the charge's
    span that fall before the effective date of the current private pay schedule, counted from the first day of the span
    and never more than the span's days. In the standard method, the late-notice leave days are none. In the standard method,
    the late-notice billed rate is the current schedule's daily rate for the agreement's own tier, and the late-notice earlier
    rate is the preceding schedule's daily rate for the agreement's own tier. The late-notice days follow the notice the
    agreement records: where no rate notice delivery date is recorded on the agreement, every day of the span is a late-notice
    day; where the notice was delivered fewer than the rate change notice days before the schedule's effective date, or
    on or after that date, the late-notice days are the days of the span before the delivery date plus the rate change notice
    days; otherwise the late-notice days follow the standard method. The late-notice leave days follow how the bed was kept:
    where the latest booking of resident-private bed-hold days (the one whose first booked day is latest, the one posted
    first where two share that day) start inside the charge's span, the late-notice leave days are those booked days less
    the days reversed against that booking, counted from the first booked day, that fall before the day the new rate took
    effect for the agreement; where no such booked days start inside the span and a private bed hold of the resident is
    in force with its first privately paid day inside the span, they are the days held so far, from that first day through
    the day before the credit is worked out, that fall before the day the new rate took effect; otherwise the late-notice
    leave days follow the standard method. The late-notice billed rate follows the tier the charge was posted for: where
    the charge's tier is not the agreement's current tier, it is the current schedule's daily rate for the charge's tier;
    where the charge is the agreement's tier and carries the isolation charge basis, it is the current schedule's daily
    rate for the isolation billing tier; otherwise the late-notice billed rate follows the standard method. The late-notice
    earlier rate follows the agreement's billing history: where the agreement carries room-and-board charges posted for
    the charge's tier with the prior-rate notice-hold charge basis, it is the daily rate of the one of those whose span
    begins latest; where it carries none and the agreement's admission date is on or after the schedule's effective date,
    it equals the late-notice billed rate of the standard method, there being no earlier rate to restore; otherwise the
    late-notice earlier rate follows the standard method.
  prerequisite: []
  cross_category:
  - category: bedhold
    as: history
    reads:
    - bedhold_ledger.bedhold_entry_id
    - bedhold_ledger.day_count
    - bedhold_ledger.day_payer
    - bedhold_ledger.days_entry_id
    - bedhold_ledger.from_date
    - private_hold_start_date
    - status
    note: >-
      the leave factor reads the resident-private days booked for the latest leave, or a private hold in force
  compute:
  - chg_id: >-
      LATEST('private_ledger','private_entry_id', date_field='from_date', event_type='private_room_board_charge')
  - chg_from: LATEST('private_ledger','from_date', date_field='from_date', event_type='private_room_board_charge')
  - chg_to: LATEST('private_ledger','to_date', date_field='from_date', event_type='private_room_board_charge')
  - chg_tier: >-
      LATEST('private_ledger','accommodation_tier', date_field='from_date', event_type='private_room_board_charge')
  - span_days: DAYS(chg_from, chg_to) + 1
  - agr_tier: F('variant_name')
  - moved_on: F('last_room_change_date')
  - req_on: >-
      LATEST('private_requests','requested_date', date_field='created_at', request_type='room_change_request')
  - excl: >-
      True if (chg_tier == agr_tier and moved_on and (chg_from == moved_on or (req_on and chg_from == req_on))) else False
  - ln_done: >-
      COUNT('private_ledger', event_type='private_adjustment', adjustment_reason='rate_notice_late', charge_entry_id=chg_id)
  - std_billed_rate: >-
      (K('r26_semi_ltc') if agr_tier == 'Semi-Private Long-Term Care Room' else (K('r26_semi_mc') if agr_tier == 'Semi-Private
      Secure Memory Care Room' else (K('r26_priv_ltc') if agr_tier == 'Private Long-Term Care Room' else (K('r26_priv_mc')
      if agr_tier == 'Private Secure Memory Care Room' else (K('r26_bariatric') if agr_tier == 'Private Bariatric Care Room'
      else K('r26_suite'))))))
  - std_earlier_rate: >-
      (K('r25_semi_ltc') if agr_tier == 'Semi-Private Long-Term Care Room' else (K('r25_semi_mc') if agr_tier == 'Semi-Private
      Secure Memory Care Room' else (K('r25_priv_ltc') if agr_tier == 'Private Long-Term Care Room' else (K('r25_priv_mc')
      if agr_tier == 'Private Secure Memory Care Room' else (K('r25_bariatric') if agr_tier == 'Private Bariatric Care Room'
      else K('r25_suite'))))))
  - notice_date: F('rate_notice_delivered_date')
  - notice_short: (DAYS(notice_date, '2026-07-01') < P('rate_change_notice_days')) if notice_date else False
  - notice_end_days: (DAYS(chg_from, notice_date) + P('rate_change_notice_days')) if notice_date else 0
  - late_days: >-
      span_days if not notice_date else (MX(0, MN(span_days, notice_end_days)) if notice_short else MX(0, MN(span_days,
      DAYS(chg_from, '2026-07-01'))))
  - lv_id: >-
      XLATEST('bedhold','bedhold_ledger','bedhold_entry_id', date_field='from_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - lv_from: >-
      XLATEST('bedhold','bedhold_ledger','from_date', date_field='from_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - lv_booked: >-
      XLATEST('bedhold','bedhold_ledger','day_count', date_field='from_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - lv_in_span: (lv_from >= chg_from and lv_from <= chg_to) if lv_from else False
  - hf_from: CFIELD('bedhold','private_hold_start_date', status='held')
  - hf_in_span: (hf_from >= chg_from and hf_from <= chg_to) if hf_from else False
  - lv_rev: >-
      XSUM('bedhold','bedhold_ledger','day_count', event_type='bedhold_day_reversed', days_entry_id=lv_id) if lv_id else
      0
  - away_days: >-
      MX(0, MN(MX(0, lv_booked - (lv_rev or 0)), (MX(DAYS(lv_from, '2026-07-01'), P('rate_change_notice_days') - DAYS(notice_date,
      lv_from)) if notice_date else 999))) if lv_in_span else ((MX(0, MN(DAYS(hf_from, NOW), (MX(DAYS(hf_from, '2026-07-01'),
      P('rate_change_notice_days') - DAYS(notice_date, hf_from)) if notice_date else 999)))) if hf_in_span else 0)
  - bt_basis: >-
      LATEST('private_ledger','charge_basis', date_field='from_date', event_type='private_room_board_charge')
  - billed_rate: >-
      ((K('r26_semi_ltc') if chg_tier == 'Semi-Private Long-Term Care Room' else (K('r26_semi_mc') if chg_tier == 'Semi-Private
      Secure Memory Care Room' else (K('r26_priv_ltc') if chg_tier == 'Private Long-Term Care Room' else (K('r26_priv_mc')
      if chg_tier == 'Private Secure Memory Care Room' else (K('r26_bariatric') if chg_tier == 'Private Bariatric Care Room'
      else K('r26_suite')))))) if chg_tier != agr_tier else ((K('r26_semi_ltc') if P('isolation_billing_tier') == 'Semi-Private
      Long-Term Care Room' else K('r26_semi_mc')) if bt_basis == 'isolation_rate' else std_billed_rate))
  - held_n: >-
      COUNT('private_ledger', event_type='private_room_board_charge', charge_basis='prior_rate_notice_hold', accommodation_tier=chg_tier)
  - held_rate: >-
      LATEST('private_ledger','daily_rate', date_field='from_date', event_type='private_room_board_charge', charge_basis='prior_rate_notice_hold',
      accommodation_tier=chg_tier)
  - earlier_rate: >-
      held_rate if held_n > 0 else (std_billed_rate if F('admission_date') >= '2026-07-01' else std_earlier_rate)
  - result: >-
      0 if (excl or ln_done > 0) else RND(MX(0, MX(0, late_days - away_days) * (billed_rate - earlier_rate)) + 0.000000001,
      2)
  compute_basis:
    chg_from: >-
      The credit is entered against that charge from the first day of its span, with the late-notice days less the late-notice
      leave days, never below zero, as its day count.
    chg_to: >-
      In the standard method, the late-notice days are the days of the charge's span that fall before the effective date
      of the current private pay schedule, counted from the first day of the span and never more than the span's days.
    chg_tier: >-
      The late-notice billed rate follows the tier the charge was posted for: where the charge's tier is not the agreement's
      current tier, it is the current schedule's daily rate for the charge's tier; where the charge is the agreement's tier
      and carries the isolation charge basis, it is the current schedule's daily rate for the isolation billing tier; otherwise
      the late-notice billed rate follows the standard method.
    span_days: >-
      In the standard method, the late-notice days are the days of the charge's span that fall before the effective date
