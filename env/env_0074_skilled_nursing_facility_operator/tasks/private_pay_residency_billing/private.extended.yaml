- id: private_ext_conversion_credit
  base_policy_refs:
  - private_payer_source_change
  - private_evt_discharge_refund
  - private_rate_schedule
  - private_evt_room_board_billing
  overwrite:
  - base_policy: private_payer_source_change
    superseded_clause: >-
      Advance room and board billed for days on or after the conversion date is credited with reason payer_conversion_credit.
    replaced_by: >-
      Advance room and board billed for days on or after the conversion date is credited with reason payer_conversion_credit,
      and every such credit other than the conversion credit this policy figures stays under that rule; this policy figures
      the conversion credit, as set out below, on an agreement whose stay's departure is on file as set out below or whose
      resident holds no hospital bed-hold reservation, and on every other agreement the advance billed for days on or after
      the conversion date is credited with reason payer_conversion_credit at the daily rate of that charge, rounded to the
      cent, the conversion date being the first day another payer source took over the stay: the Part A coverage start date
      where the agreement is active again with Medicare Part A recorded as the payer source it was last converted to, the
      first day of the charge's span where it is active again with another payer source recorded and an earlier charge already
      carries a payer-conversion credit, and the conversion date recorded on the agreement otherwise.
  - base_policy: private_evt_discharge_refund
    superseded_clause: the credit is the credited days times the daily rate of that charge, rounded to the cent.
    replaced_by: >-
      The credit is the credited days times the daily rate of that charge, rounded to the cent, for every discharge, death
      or conversion credit other than the conversion credit this policy figures; only that conversion credit, on an advance
      charge billed for days the other payer source covered, nets out the earlier credits standing on the charge, as set
      out below.
  trigger: state_due
  subject:
  - private_adjustment
  computes: amount
  target_tool: credit_converted_days_12618703
  params:
    r25_semi_ltc: 384.0
    r26_semi_ltc: 398.0
    r25_semi_mc: 412.0
    r26_semi_mc: 427.0
    r25_priv_ltc: 421.0
    r26_priv_ltc: 436.0
    r25_priv_mc: 449.0
    r26_priv_mc: 465.0
    r25_bariatric: 466.0
    r26_bariatric: 482.0
    r25_suite: 497.0
    r26_suite: 514.0
  rule: >-
    This policy settles the conversion credit on the room-and-board charge of an agreement whose span begins latest, the
    one posted first where two begin on the same day, of an agreement whose stay another payer source took over, that charge
    being an advance billed for days the other payer source covered: one posted before the conversion date recorded on the
    agreement and carrying no payer-conversion credit yet; any other charge is owed no conversion credit. Advance room and
    board billed for days on or after the conversion date is credited with reason payer_conversion_credit, and every such
    credit other than the conversion credit this policy figures stays under that rule; this policy figures the conversion
    credit, as set out below, on an agreement whose stay's departure is on file as set out below or whose resident holds
    no hospital bed-hold reservation, and on every other agreement the advance billed for days on or after the conversion
    date is credited with reason payer_conversion_credit at the daily rate of that charge, rounded to the cent, the conversion
    date being the first day another payer source took over the stay: the Part A coverage start date where the agreement
    is active again with Medicare Part A recorded as the payer source it was last converted to, the first day of the charge's
    span where it is active again with another payer source recorded and an earlier charge already carries a payer-conversion
    credit, and the conversion date recorded on the agreement otherwise. The credit is the credited days times the daily
    rate of that charge, rounded to the cent, for every discharge, death or conversion credit other than the conversion
    credit this policy figures; only that conversion credit, on an advance charge billed for days the other payer source
    covered, nets out the earlier credits standing on the charge, as set out below. The conversion credit equals the credited
    days times the conversion credit rate, plus the moved days times the moved-day rate, less the netted days times the
    netted per-day amount and less the netted amount of the other credits, the whole never below zero and rounded half up
    to the cent once, on the final figure; where it is zero no entry is made. The credited days are the converted days plus
    the hospital days. The conversion credit rate is the daily rate of the conversion credit tier under the conversion credit
    schedule. The converted days run from the first converted day through the last day of the charge's span, or through
    the day before a move to another tier the agreement records on or after its conversion date inside that span, both days
    included, and are none where the first converted day falls after the day they stop. Under this policy the Part A coverage
    episode read is the resident's episode whose booked days run latest, its booked block that begins latest deciding, and
    the stay's departure is the leave start date of the resident's hospital bed-hold reservation, of any hospital kind and
    any status, whose leave began on that episode's qualifying hospital admission date, or else of the one returned on the
    Part A coverage start date, or else, where the resident holds exactly one hospital bed-hold reservation as counted below,
    of that reservation, a night in hospital observation counting as a night away. The resident's bed-hold reservations
    are counted kind by kind and status by status, the first reservation on file of each kind and status counting as one,
    and the count stands only where every bed-hold transfer notice on file names a counted reservation; the hospital kinds
    are the Medicaid hospital leave reserved bed, the private-pay hospital leave bed hold and the Medicare skilled-stay
    hospital leave bed hold. The hospital days run from the first hospital day through the day before the Part A coverage
    start date, and are none where there is no first hospital day or it does not fall before that date. The first credited
    day is the first hospital day where there are hospital days, and the first converted day otherwise. The credit is entered
    against the charge with reason payer_conversion_credit, from the first credited day, with the credited days as its day
    count. The moved days are the days from the later of the move date and the first day of the charge's span through the
    day before the first credited day, on an agreement that records a move to another tier dated before its recorded conversion
    date where that later day falls before the first credited day; otherwise there are none. The netted days are the days
    of the late-notice credit on the charge, running consecutively from its first credited day, that fall on or after the
    first credited day and on or before the last converted day; the netted amount of the other credits is, for each room-change
    or billing-error credit on the charge, its days running consecutively from its first credited day that fall in that
    same stretch, times its amount divided by its days. In the standard method, the first converted day is the later of
    the conversion date recorded on the agreement and the first day of the charge's span. In the standard method, there
    is no first hospital day. In the standard method, the moved-day rate is none. In the standard method, the conversion
    credit tier is the agreement's own tier. In the standard method, the conversion credit schedule is the one in effect
    for the agreement on the first day of the charge's span: the current private pay schedule once the agreement's rate
    notice had run the rate change notice days by that day and the span begins on or after the current schedule's effective
    date, and the preceding schedule otherwise. In the standard method, the netted per-day amount is the charge's daily
    rate, an earlier credit being taken to have removed whole days as a discharge, death or conversion credit does. The
    first converted day follows how the agreement left the other payer source: where the agreement is active again with
    Medicare Part A recorded as the payer source it was last converted to, and the resident's Part A coverage start date
    falls on or before the last day of the charge's span, the first converted day is the later of that coverage start date
    and the first day of the span; where the agreement is active again with another payer source recorded as the one it
    was last converted to and an earlier charge of the agreement already carries a payer-conversion credit, the first converted
    day is the first day of the span; otherwise the first converted day follows the standard method. The first hospital
    day follows the records of the stay that qualified the Part A episode: where the stay's departure is on file, falls
    on or before the last day of the charge's span and the coverage start date falls after the first day of the span, it
    is the later of that departure date and the first day of the span, the departure day being a day away under the midnight
    census whether or not the bed was held; where the resident holds no hospital bed-hold reservation, the qualifying hospital
    admission date falls on or before the last day of the span and the coverage start date falls after the first day of
    the span, it is the later of that admission date and the first day of the span; otherwise the first hospital day follows
    the standard method. The moved-day rate follows the room the resident moved into: where the agreement carries no isolation
    placement and its tier's daily rate under the current private pay schedule is lower than that of the tier the charge
    was posted for, it is the difference between the two, the resident never paying the dearer room for nights spent in
    the cheaper one; where the agreement carries an isolation placement and the isolation billing tier's daily rate under
    the current schedule is lower than that of the tier the charge was posted for, it is that difference; otherwise the
    moved-day rate follows the standard method. The conversion credit tier follows the room the charge was billed for: where
    the agreement's tier is not the tier the charge was posted for and the agreement carries no isolation placement, the
    conversion credit tier is the tier the charge was posted for; where the agreement carries an isolation placement, it
    is the isolation billing tier of the agreement's tier; otherwise the conversion credit tier follows the standard method.
    The conversion credit schedule follows how the charge was priced: where the charge carries the standard charge basis
    and was posted on or after the current private pay schedule's effective date, it is the current schedule; where the
    charge carries the prior-rate notice-hold charge basis, it is the preceding schedule; otherwise the conversion credit
    schedule follows the standard method. The netted per-day amount follows why the charge was credited before: where a
    rate notice delivery date is recorded on the agreement, the charge's span begins on or after the current private pay
    schedule's effective date and the notice had not run the rate change notice days by the first day of the span, it is
    the current schedule's daily rate for the tier the charge was posted for less the preceding schedule's daily rate for
    that tier; where that is not so and the charge carries credits, it is the total of those credits divided by their days;
    otherwise the netted per-day amount follows the standard method.
