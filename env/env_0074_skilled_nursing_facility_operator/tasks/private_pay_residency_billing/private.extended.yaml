  - s_days: (MX(0, DAYS(s_first, moved_on)) if mv_after else MX(0, DAYS(s_first, adv_to) + 1)) if s_first else 0
  - agr_status: F('status')
  - rc_days: s_days if (conv_cr > 0 and agr_status == 'active') else 0
  - bh_id: >-
      XLATEST('bedhold','bedhold_ledger','bedhold_entry_id', date_field='from_date', event_type='bedhold_day_booked', day_payer='resident_private')
  - bh_from: >-
