      the day the new rate took effect; otherwise the late-notice leave days follow the standard method.
    lv_booked: >-
      The late-notice leave days follow how the bed was kept: where the latest booking of resident-private bed-hold days
      (the one whose first booked day is latest, the one posted first where two share that day) start inside the charge's
      span, the late-notice leave days are those booked days less the days reversed against that booking, counted from the
      first booked day, that fall before the day the new rate took effect for the agreement; where no such booked days start
      inside the span and a private bed hold of the resident is in force with its first privately paid day inside the span,
