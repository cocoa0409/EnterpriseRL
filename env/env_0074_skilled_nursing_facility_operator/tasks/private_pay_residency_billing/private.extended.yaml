  compute:
  - conv_to: F('converted_to')
  - status: F('status')
  - held: F('deposit_balance')
  - conv_on: F('conversion_date')
  - iso: F('isolation_placement')
  - notice: F('rate_notice_delivered_date')
  - agr_tier: F('variant_name')
  - sp_tier: >-
      LATEST('private_ledger','accommodation_tier', date_field='from_date', event_type='private_room_board_charge')
  - adm_tier: >-
      LATEST('private_ledger','accommodation_tier', date_field='from_date', event_type='private_room_board_charge', charge_basis='first_month_partial')
  - r_sp_from: LATEST('private_ledger','from_date', date_field='from_date', event_type='private_room_board_charge')
  - r_tier: >-
      sp_tier if (conv_on and r_sp_from and r_sp_from >= conv_on) else (P('isolation_billing_tier') if iso else adm_tier)
  - rp_12: >-
      COUNT('private_ledger', within_months=12, date_field='entry_date', event_type='private_payment_reversal')
  - lc_12: >-
      COUNT('private_ledger', within_months=12, date_field='entry_date', event_type='private_fee_charge', fee_type='late_charge')
  - r_days: >-
      K('days_certified_funds') if rp_12 >= P('returned_payment_limit') else (K('days_after_late_charge') if (rp_12 < P('returned_payment_limit')
      and lc_12 > 0) else P('security_deposit_days'))
  - r_ran: (DAYS(notice, conv_on) >= P('rate_change_notice_days')) if (notice and conv_on) else False
  - r_cur: >-
      True if (r_ran and conv_on >= '2026-07-01') else (False if notice else (F('admission_date') >= '2026-07-01'))
  - ins_3: >-
      COUNT('private_ledger', within_months=3, date_field='entry_date', event_type='private_payment', payment_source='ltc_insurance_assignment')
  - ins_amt: >-
      LATEST('private_ledger','amount', date_field='entry_date', event_type='private_payment', payment_source='ltc_insurance_assignment')
  - ins_chg: >-
      LATEST('private_ledger','charge_entry_id', date_field='entry_date', event_type='private_payment', payment_source='ltc_insurance_assignment')
  - ins_chg_days: >-
      LATEST('private_ledger','day_count', date_field='from_date', event_type='private_room_board_charge', private_entry_id=ins_chg)
      if ins_chg else 0
  - ins_sum_3: >-
      SUM('private_ledger','amount', within_months=3, date_field='entry_date', event_type='private_payment', payment_source='ltc_insurance_assignment')
  - r_ins: >-
      ((ins_amt / ins_chg_days) if ins_chg_days else 0) if ins_3 >= 3 else ((ins_sum_3 / K('averaging_days')) if ins_3 >
      0 else 0)
  - r_rate: >-
      ((K('r26_semi_ltc') if r_cur else K('r25_semi_ltc')) if r_tier == 'Semi-Private Long-Term Care Room' else ((K('r26_semi_mc')
      if r_cur else K('r25_semi_mc')) if r_tier == 'Semi-Private Secure Memory Care Room' else ((K('r26_priv_ltc') if r_cur
      else K('r25_priv_ltc')) if r_tier == 'Private Long-Term Care Room' else ((K('r26_priv_mc') if r_cur else K('r25_priv_mc'))
      if r_tier == 'Private Secure Memory Care Room' else ((K('r26_bariatric') if r_cur else K('r25_bariatric')) if r_tier
      == 'Private Bariatric Care Room' else (K('r26_suite') if r_cur else K('r25_suite')))))))
  - r_rc_n: >-
      XCOUNT('ancillary','ancillary_ledger', within_months=3, date_field='entry_date', event_type='ancillary_recurring_charge')
  - r_rc_s: >-
      XSUM('ancillary','ancillary_ledger','amount', within_months=3, date_field='entry_date', event_type='ancillary_recurring_charge')
  - r_rc_m: >-
      XLATEST('ancillary','ancillary_ledger','service_month', date_field='entry_date', event_type='ancillary_recurring_charge')
  - r_rc_ms: >-
      XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_recurring_charge', service_month=r_rc_m) if r_rc_m
      else 0
  - r_cab_12: >-
      XCOUNT('ancillary','ancillary_ledger', within_months=12, date_field='entry_date', event_type='ancillary_recurring_charge',
      recurring_service='cable_tv')
  - r_tel_12: >-
      XCOUNT('ancillary','ancillary_ledger', within_months=12, date_field='entry_date', event_type='ancillary_recurring_charge',
