  - hf_from: CFIELD('bedhold','private_hold_start_date', status='held')
  - bh_rev: >-
      XSUM('bedhold','bedhold_ledger','day_count', event_type='bedhold_day_reversed', days_entry_id=bh_id) if bh_id else
      0
  - s_leave: >-
      MX(0, bh_priv - (bh_rev or 0)) if (bh_from and conv_on and bh_from >= conv_on and bh_from <= adv_to) else (MX(0, DAYS(hf_from,
      NOW)) if (hf_from and conv_on and hf_from >= conv_on) else 0)
  - lv_start: bh_from if (bh_from and conv_on and bh_from >= conv_on and bh_from <= adv_to) else hf_from
  - leave_in: >-
      MX(0, MN(s_leave, DAYS(lv_start, s_first) + rc_days) - MX(0, DAYS(lv_start, s_first))) if (s_leave and s_first and
      lv_start) else 0
  - s_tier: >-
      agr_tier if (moved_on and conv_on and DAYS(moved_on, conv_on) > 0 and not iso) else (P('isolation_billing_tier') if
      iso else adv_tier)
