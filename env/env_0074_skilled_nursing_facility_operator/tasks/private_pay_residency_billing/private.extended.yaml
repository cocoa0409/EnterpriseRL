  factors:
  - id: resumption_days_rule
    effect: parameter
    decides: r_days
    bindings:
    - rp_12
    - lc_12
    - r_days
    ladder:
    - when: >-
        at least the returned-payment limit of payments on the agreement were dishonored within the last twelve months
      value: K('days_certified_funds')
    - when: fewer were and a late charge was assessed on the agreement within the last twelve months
      value: K('days_after_late_charge')
    - when: otherwise
      value: P('security_deposit_days')
    baseline:
      r_days: P('security_deposit_days')
    evidence:
    - history
    cross_difficulty: null
  - id: resumption_tier_rule
    effect: parameter
    decides: r_tier
    bindings:
    - r_sp_from
    - r_tier
    ladder:
    - when: >-
        the room-and-board span that begins latest begins on or after the conversion date recorded on the agreement
      value: that span's tier
    - when: no such span is posted and the agreement carries an isolation placement
      value: the isolation billing tier of the agreement's tier
    - when: otherwise
      value: the tier of the agreement's admission-month charge
    baseline:
      r_tier: adm_tier
    evidence:
    - history
    - holdings
    cross_difficulty: null
  - id: resumption_schedule_rule
    effect: parameter
    decides: r_cur
    bindings:
    - r_ran
    - r_cur
    ladder:
    - when: >-
        a rate notice delivery date is recorded and the notice had run the rate change notice days by the conversion date
        recorded on the agreement, that date falling on or after the current schedule's effective date
      value: the current private pay schedule
    - when: a delivery date is recorded and that is not so
      value: the preceding schedule
    - when: otherwise
      value: the schedule in effect on the agreement's admission date
    baseline:
      r_cur: F('admission_date') >= '2026-07-01'
    evidence:
    - date
    - holdings
    cross_difficulty: null
  - id: resumption_insurer_rule
    effect: method
    decides: r_ins
    bindings:
    - ins_3
    - ins_amt
    - ins_chg
    - ins_chg_days
    - ins_sum_3
    - r_ins
    ladder:
    - when: >-
        a long-term care insurer paid on the agreement under an assignment of benefits at least three times within the last
        three months
      method: its most recent payment divided by the days of the charge that payment paid
    - when: the insurer paid within the last three months but fewer than three times
      method: its payments within the last three months divided by the averaging days
    - when: otherwise
      method: nothing
    baseline:
      r_ins: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: r_recurring_allowance_rule
    effect: method
    decides: r_rec
    bindings:
    - r_rc_n
    - r_rc_s
    - r_rc_m
    - r_rc_ms
    - r_cab_12
    - r_tel_12
    - r_oxy_12
    - r_rec_std
    - r_cab_w
    - r_cab_all
    - r_tel_w
    - r_tel_all
    - r_oxy_w
    - r_oxy_all
    - r_cab_lm
    - r_tel_lm
    - r_oxy_lm
    - r_rc_est
    - r_rec
    ladder:
    - when: >-
        recurring charges posted within the last three months, every service among them also charged before those three
        months and in the latest service month billed
      method: their total divided by three
    - when: >-
        recurring charges posted within the last three months, a service among them not running through the whole period
      method: >-
        the total of all the recurring charges billed for the latest service month (the service month of the recurring charge
        posted latest)
    - when: otherwise
      method: >-
        one month of every recurring service billed within twelve months at the price schedule's monthly charge
    baseline:
      r_rec: r_rec_std
    evidence:
    - cross_category
    - history
    cross_difficulty: ancillary
  - id: r_item_allowance_rule
    effect: method
    decides: r_item
    bindings:
    - r_it_n
    - r_it_s
    - r_it_last
    - r_item
    ladder:
    - when: at least three item charges posted within the last three months
      method: their total divided by three
    - when: one or two were
      method: the latest item charge
    - when: otherwise
      method: nothing
    baseline:
      r_item: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ancillary
  baseline:
    rule: >-
      The resumption deposit equals the resumption deposit days times the resumption per-day amount, plus the resumption
      recurring-service allowance and the resumption personal-item allowance, less the deposit balance recorded on the agreement,
      never below zero, rounded half up to the cent once, on the final figure; it is paid into the agreement's security
      deposit by the resident or representative, and where it is zero nothing is paid. The resumption recurring-service
      allowance and the resumption personal-item allowance secure one month of the ancillary charges the center bills the
      resident in arrears on the resident's ancillary account. The resumption per-day amount is the daily rate of the resumption
      deposit tier under the resumption deposit schedule less the resumption insurer share, never below zero, the share
      being taken off the rate before the rate is multiplied by the resumption deposit days. Within the last given number
      of months means that fewer than that many whole calendar months separate the entry's date from the day the resumption
      deposit is worked out. In the standard method, the resumption deposit days are the security deposit days of the agreement's
      tier. In the standard method, the resumption deposit tier is the tier of the agreement's admission-month charge. In
      the standard method, the resumption deposit schedule is the one in effect on the agreement's admission date: the current
      private pay schedule for an admission on or after its effective date, and the preceding schedule otherwise. In the
      standard method, the resumption insurer share is nothing. In the standard method, the resumption recurring-service
      allowance is one month of every recurring service billed to the resident within the last twelve months, at the price
      schedule's monthly charge for that service. In the standard method, the resumption personal-item allowance is nothing.
    params:
    - security_deposit_days
    - r25_semi_ltc
    - r26_semi_ltc
    - r25_semi_mc
    - r26_semi_mc
    - r25_priv_ltc
    - r26_priv_ltc
    - r25_priv_mc
    - r26_priv_mc
    - r25_bariatric
    - r26_bariatric
    - r25_suite
    - r26_suite
  inputs:
    history:
    - table: private_ledger
      aggregate: count
      within_months: 12
      filters:
        event_type: private_payment_reversal
    - table: private_ledger
      aggregate: count
      within_months: 12
      filters:
        event_type: private_fee_charge
        fee_type: late_charge
    - table: private_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: private_payment
        payment_source: ltc_insurance_assignment
    - table: private_ledger
      aggregate: latest
      field: accommodation_tier
      filters:
        event_type: private_room_board_charge
    cross_category:
    - category: ancillary
      as: history
      reads:
      - ancillary_ledger.amount
      - ancillary_ledger.service_month
      - ancillary_ledger.recurring_service
      - ancillary_ledger.entry_date
      - cable_tv_monthly_usd
      - telephone_monthly_usd
      - oxygen_concentrator_monthly_usd
      note: >-
        the two allowances read the resident's ancillary recurring and item charges and the ancillary account's monthly
        price schedule
