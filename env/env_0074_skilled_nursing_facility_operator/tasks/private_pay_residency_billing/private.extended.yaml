      before the span is worked out; otherwise they follow the standard method.
    win_from: >-
      The leave window begins on the move date recorded on the agreement and ends on the last day of that charge's span.
    hf_from: >-
      The new room's leave days follow how the bed was kept: where the latest booking of resident-private bed-hold days
      (the one whose first booked day is latest, the one posted first where two share that day) start inside the leave window,
      they are those booked days less the days reversed against that booking, the remaining days counted in a row from the
