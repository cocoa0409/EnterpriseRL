  - rate_2025: ((K('semi_private_rate_2025') if tier_priced == 'Semi-Private Long-Term Care Room' else (K('semi_private_memory_care_rate_2025') if tier_priced == 'Semi-Private Secure Memory Care Room' else (K('private_rate_2025') if tier_priced == 'Private Long-Term Care Room' else (K('private_memory_care_rate_2025') if tier_priced == 'Private Secure Memory Care Room' else (K('bariatric_rate_2025') if tier_priced == 'Private Bariatric Care Room' else (K('suite_rate_2025') if tier_priced == 'Private Suite with Sitting Area' else 0)))))) or charge_rate)
