- id: trust_ext_patient_pay_transfer
  base_policy_refs:
  - trust_evt_bill_transfers
  overwrite: []
  trigger: state_due
  subject:
  - trust_bill_transfer
  computes: amount
  target_tool: post_patient_pay_transfer_45809d6d
  params: {}
  rule: 'A standing authorization for Medicaid patient pay is honored by a transfer for the patient pay charge of the latest service month on the resident''s Medical Assistance case (of two charges for the same month, the one recorded first), posted on the charge''s due day or, where the account lacks the available funds that day, on the first day the funds are available. The standing patient pay transfer pays the named month''s patient pay less the patient pay credit that reaches the named charge and less the payments already naming that charge, never more than the named charge''s open balance or the available balance (for a Medicaid representative payee account, the available balance less the personal needs allowance of the resident''s Medical Assistance case, because for a Medicaid payee account the personal needs allowance stays in the account) and never below zero, rounded half up to the cent once, on the final amount only; the named charge''s open balance is the charge less the payments and reductions naming it. The available balance is the account balance, which is the deposits, interest credits and returns on the account''s ledger less its withdrawals, bill transfers and conveyances, less every deposit whose available date is after today, because a check deposit still on hold is not available. The named month''s patient pay follows the month''s standing on the case: for a month the approval left out it is nothing, because estimates billed for months before the eligibility start date are reduced in full; for an eligible month it is the month''s patient pay amount; for any other month it is the charge as billed. The patient pay credit that reaches the named charge is the payments on the case other than those naming the named charge, plus the reductions posted on the other patient pay charges for reasons other than a trueup decrease or a not-eligible month, plus the credited reconciliation amount, plus the credited not-eligible amount, less the amounts of those other charges, never below zero; it is figured on the other charges taken together, so a credit from one month first settles what another month still owes. A reduction posted on the named charge itself records the same difference the named month''s patient pay already reflects and changes nothing here. Under the standard method every month''s patient pay is the charge as billed, the month''s patient pay amount is the charge as billed, and the credited reconciliation amount and the credited not-eligible amount are the trueup decreases and the not-eligible-month reductions already posted on the other charges. The month''s standing on the case follows the eligibility start date: where the case is eligible and its eligibility start date falls after the last day of the named month, the approval left that month out; where the case is eligible and its eligibility start date falls on or before the last day of the named month, the month is eligible, because the month in which eligibility starts is billed at the notice''s patient pay; otherwise the month keeps the charge as billed. The month''s patient pay amount follows the charge and the notice: where the charge was billed as a partial month, the lesser of the case''s patient pay and the charge''s days in the center times the case''s Medicaid daily rate; where the case''s patient pay takes effect on or before the first day of the named month, the case''s patient pay; otherwise the charge as billed. The credited reconciliation amount follows the case''s standing as the approval fixes it, so that the transfer does not change with how far the business office has posted the reconciliation it owes within the trueup days: where the case is eligible and every estimate billed while the case was pending is the same amount, that estimate less the case''s patient pay, never below zero, for each month from the eligibility start date''s month up to the month before the named month, because the reconciliation reduces each of those months by that much; where the case is eligible and those estimates differ, the trueup decreases posted on the other charges; otherwise nothing. The credited not-eligible amount follows the months the approval left out, read the same way: where the case is eligible, every estimate billed while the case was pending is the same amount and the application was made in a month before the eligibility start date''s month, that estimate for each month from the application date''s month up to the month before the eligibility start date''s month, because an estimate is billed for each month the application is pending and the reconciliation reduces each of those months in full; where the case is eligible and those estimates differ, the not-eligible-month reductions posted on the other charges; otherwise nothing.'
  prerequisite: []
  cross_category:
  - category: medicaid
    as: history
    reads:
    - status
    - eligibility_start_date
    - patient_pay_amount
    - patient_pay_effective_date
    - ma_daily_rate
    - medicaid_ledger.amount
    - medicaid_ledger.charge_basis
    - medicaid_ledger.service_month
    - medicaid_ledger.day_count
    - medicaid_ledger.charge_entry_id
    - medicaid_ledger.adjustment_reason
    - application_date
    note: The case and its ledger decide the named month's patient pay and the credit that reaches the named charge.
  compute:
  - pp_charge: XLATEST('medicaid','medicaid_ledger','medicaid_entry_id', date_field='service_month', event_type='medicaid_patient_pay_charge')
  - pp_amt: XLATEST('medicaid','medicaid_ledger','amount', date_field='service_month', medicaid_entry_id=pp_charge) or 0
  - pp_basis: XLATEST('medicaid','medicaid_ledger','charge_basis', date_field='service_month', medicaid_entry_id=pp_charge)
  - pp_month: XLATEST('medicaid','medicaid_ledger','service_month', date_field='service_month', medicaid_entry_id=pp_charge) or ''
  - pp_first: (pp_month + '-01') if pp_month else ''
  - pp_days: XLATEST('medicaid','medicaid_ledger','day_count', date_field='service_month', medicaid_entry_id=pp_charge) or 0
  - case_eligible: EXISTS('medicaid', status='eligible')
  - elig_start: CFIELD('medicaid','eligibility_start_date', status='eligible')
  - case_pp: CFIELD('medicaid','patient_pay_amount', status='eligible') or 0
  - pp_effective: CFIELD('medicaid','patient_pay_effective_date', status='eligible')
  - ma_rate: CFIELD('medicaid','ma_daily_rate', status='eligible') or 0
  - elig_lag: ((0 - MONTHS(pp_first, elig_start)) if (elig_start and pp_first) else 0)
  - month_standing: ('left_out' if (EXISTS('medicaid', status='eligible') and elig_start and pp_first and MONTHS(pp_first, elig_start) > 0) else ('eligible' if (EXISTS('medicaid', status='eligible') and elig_start and pp_first) else 'as_billed'))
  - month_amount: (MN(case_pp, pp_days * ma_rate) if (pp_basis == 'partial_month' and EXISTS('medicaid', status='eligible')) else (case_pp if (CFIELD('medicaid','patient_pay_effective_date', status='eligible') and pp_first and DAYS(pp_effective, pp_first) >= 0) else pp_amt))
  - month_pp: (0 if month_standing == 'left_out' else (month_amount if month_standing == 'eligible' else pp_amt))
  - other_charged: XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_charge') - pp_amt
  - paid_all: XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_payment')
  - paid_named: XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_payment', charge_entry_id=pp_charge)
  - other_paid: paid_all - paid_named
  - red_all: XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_adjustment') - XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_adjustment', charge_entry_id=pp_charge)
  - tu_other: XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_adjustment', adjustment_reason='trueup_decrease') - XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_adjustment', adjustment_reason='trueup_decrease', charge_entry_id=pp_charge)
  - tu_n: XCOUNT('medicaid','medicaid_ledger', event_type='medicaid_patient_pay_adjustment', adjustment_reason='trueup_decrease') - XCOUNT('medicaid','medicaid_ledger', event_type='medicaid_patient_pay_adjustment', adjustment_reason='trueup_decrease', charge_entry_id=pp_charge)
  - ne_other: XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_adjustment', adjustment_reason='not_eligible_month') - XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_adjustment', adjustment_reason='not_eligible_month', charge_entry_id=pp_charge)
  - ne_n: XCOUNT('medicaid','medicaid_ledger', event_type='medicaid_patient_pay_adjustment', adjustment_reason='not_eligible_month') - XCOUNT('medicaid','medicaid_ledger', event_type='medicaid_patient_pay_adjustment', adjustment_reason='not_eligible_month', charge_entry_id=pp_charge)
  - other_red: MX(0, red_all - tu_other - ne_other)
  - est_max: XMAX('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_charge', charge_basis='estimated_pending')
  - est_count: XCOUNT('medicaid','medicaid_ledger', event_type='medicaid_patient_pay_charge', charge_basis='estimated_pending')
  - est_sum: XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_charge', charge_basis='estimated_pending')
  - est_same: (est_count > 0 and ABS(est_count * est_max - est_sum) < 0.005)
  - app_date: CFIELD('medicaid','application_date', status='eligible') or ''
  - ne_months: ((MONTHS(pp_first, elig_start) - MONTHS(pp_first, app_date)) if (app_date and elig_start and pp_first) else 0)
  - recon_credit: ((elig_lag * MX(0, est_max - case_pp)) if (case_eligible and est_same and elig_lag > 0) else (tu_other if (case_eligible and tu_n > 0) else 0))
  - ne_credit: ((ne_months * est_max) if (case_eligible and est_same and ne_months > 0) else (ne_other if (case_eligible and ne_n > 0) else 0))
  - credit_reaching: MX(0, other_paid + other_red + recon_credit + ne_credit - other_charged)
  - balance_now: SUM('trust_ledger','amount', event_type='trust_deposit') + SUM('trust_ledger','amount', event_type='trust_interest_credit') + SUM('trust_ledger','amount', event_type='trust_reversal') - SUM('trust_ledger','amount', event_type='trust_withdrawal') - SUM('trust_ledger','amount', event_type='trust_bill_transfer') - SUM('trust_ledger','amount', event_type='trust_conveyance')
  - held_deposits: SUM('trust_ledger','amount', event_type='trust_deposit') - SUM('trust_ledger','amount', within_months=100000, date_field='available_date', event_type='trust_deposit')
  - available: balance_now - held_deposits
  - pna_left: ((CPARAM('medicaid','personal_needs_allowance_monthly', status='eligible') or 0) if (P('center_is_representative_payee') and P('medicaid_pna_retained')) else 0)
  - reduced_named: XSUM('medicaid','medicaid_ledger','amount', event_type='medicaid_patient_pay_adjustment', charge_entry_id=pp_charge)
  - open_named: MX(0, pp_amt - paid_named - reduced_named)
  - result: RND(MX(0, MN(MX(0, available - pna_left), open_named, month_pp - credit_reaching - paid_named)) + 0.000000001, 2)
  compute_basis:
    pp_charge: for the patient pay charge of the latest service month on the resident's Medical Assistance case (of two charges for the same month, the one recorded first)
    pp_amt: otherwise the charge as billed
    pp_basis: where the charge was billed as a partial month
    pp_month: the named month
    pp_first: the first day of the named month
    pp_days: the charge's days in the center
    case_eligible: where the case is eligible
    elig_start: its eligibility start date
    case_pp: the case's patient pay
    pp_effective: where the case's patient pay takes effect on or before the first day of the named month
    ma_rate: the case's Medicaid daily rate
    elig_lag: for each month from the eligibility start date's month up to the month before the named month
    month_standing: 'The month''s standing on the case follows the eligibility start date: where the case is eligible and its eligibility start date falls after the last day of the named month, the approval left that month out; where the case is eligible and its eligibility start date falls on or before the last day of the named month, the month is eligible, because the month in which eligibility starts is billed at the notice''s patient pay; otherwise the month keeps the charge as billed.'
    month_amount: 'The month''s patient pay amount follows the charge and the notice: where the charge was billed as a partial month, the lesser of the case''s patient pay and the charge''s days in the center times the case''s Medicaid daily rate; where the case''s patient pay takes effect on or before the first day of the named month, the case''s patient pay; otherwise the charge as billed.'
    month_pp: 'The named month''s patient pay follows the month''s standing on the case: for a month the approval left out it is nothing, because estimates billed for months before the eligibility start date are reduced in full; for an eligible month it is the month''s patient pay amount; for any other month it is the charge as billed.'
    other_charged: less the amounts of those other charges
    paid_all: the payments on the case other than those naming the named charge
    paid_named: less the payments already naming that charge
    other_paid: the payments on the case other than those naming the named charge
    red_all: the reductions posted on the other patient pay charges
    tu_other: the trueup decreases posted on the other charges
    ne_other: the not-eligible-month reductions posted on the other charges
    other_red: plus the reductions posted on the other patient pay charges for reasons other than a trueup decrease or a not-eligible month
    est_max: every estimate billed while the case was pending is the same amount
    est_count: every estimate billed while the case was pending is the same amount
    est_sum: every estimate billed while the case was pending is the same amount
    est_same: every estimate billed while the case was pending is the same amount
    recon_credit: 'The credited reconciliation amount follows the case''s standing as the approval fixes it, so that the transfer does not change with how far the business office has posted the reconciliation it owes within the trueup days: where the case is eligible and every estimate billed while the case was pending is the same amount, that estimate less the case''s patient pay, never below zero, for each month from the eligibility start date''s month up to the month before the named month, because the reconciliation reduces each of those months by that much; where the case is eligible and those estimates differ, the trueup decreases posted on the other charges; otherwise nothing.'
    ne_credit: 'The credited not-eligible amount follows the months the approval left out, read the same way: where the case is eligible, every estimate billed while the case was pending is the same amount and the application was made in a month before the eligibility start date''s month, that estimate for each month from the application date''s month up to the month before the eligibility start date''s month, because an estimate is billed for each month the application is pending and the reconciliation reduces each of those months in full; where the case is eligible and those estimates differ, the not-eligible-month reductions posted on the other charges; otherwise nothing.'
    credit_reaching: The patient pay credit that reaches the named charge is the payments on the case other than those naming the named charge, plus the reductions posted on the other patient pay charges for reasons other than a trueup decrease or a not-eligible month, plus the credited reconciliation amount, plus the credited not-eligible amount, less the amounts of those other charges, never below zero
    balance_now: The available balance is the account balance, which is the deposits, interest credits and returns on the account's ledger less its withdrawals, bill transfers and conveyances
    available: The available balance is the account balance, which is the deposits, interest credits and returns on the account's ledger less its withdrawals, bill transfers and conveyances, less every deposit whose available date is after today, because a check deposit still on hold is not available.
    reduced_named: the named charge's open balance is the charge less the payments and reductions naming it
    open_named: the named charge's open balance is the charge less the payments and reductions naming it
    result: The standing patient pay transfer pays the named month's patient pay less the patient pay credit that reaches the named charge and less the payments already naming that charge, never more than the named charge's open balance or the available balance (for a Medicaid representative payee account, the available balance less the personal needs allowance of the resident's Medical Assistance case, because for a Medicaid payee account the personal needs allowance stays in the account) and never below zero, rounded half up to the cent once, on the final amount only
    ne_months: that estimate for each month from the application date's month up to the month before the eligibility start date's month
    app_date: the application date's month
    held_deposits: less every deposit whose available date is after today, because a check deposit still on hold is not available
    pna_left: for a Medicaid representative payee account, the available balance less the personal needs allowance of the resident's Medical Assistance case, because for a Medicaid payee account the personal needs allowance stays in the account
    tu_n: where the case is eligible and those estimates differ, the trueup decreases posted on the other charges
    ne_n: where the case is eligible and those estimates differ, the not-eligible-month reductions posted on the other charges
  factors:
  - id: named_month_standing
    effect: method
    decides: month_standing
    bindings:
    - month_standing
    ladder:
    - when: the case is eligible and its eligibility start date falls after the last day of the named month
      method: 'the named month is left out: its patient pay is nothing'
    - when: the case is eligible and its eligibility start date falls on or before the last day of the named month
      method: 'the named month is eligible: its patient pay is the month''s patient pay amount'
    - when: otherwise
      method: the named month keeps the charge as billed
    baseline:
      month_standing: '''as_billed'''
    evidence:
    - cross_category
    - date
    cross_difficulty: medicaid
  - id: named_month_amount
    effect: parameter
    decides: month_amount
    bindings:
    - month_amount
    ladder:
    - when: the charge was billed as a partial month
      value: the lesser of the case's patient pay and the charge's days in the center times the case's Medicaid daily rate
    - when: the case's patient pay takes effect on or before the first day of the named month
      value: the case's patient pay
    - when: otherwise
      value: the charge as billed
    baseline:
      month_amount: pp_amt
    evidence:
    - cross_category
    - date
    cross_difficulty: medicaid
  - id: credited_reconciliation_amount
    effect: parameter
    decides: recon_credit
    bindings:
    - tu_other
    - tu_n
    - recon_credit
    ladder:
    - when: the case is eligible and every estimate billed while pending is the same amount
      value: that estimate less the case's patient pay, never below zero, for each month from the eligibility start date's month up to the month before the named month
    - when: the case is eligible and those estimates differ
      value: the trueup decreases posted on the other charges
    - when: otherwise
      value: '0'
    baseline:
      recon_credit: tu_other
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: medicaid
  - id: credited_not_eligible_amount
    effect: parameter
    decides: ne_credit
    bindings:
    - ne_other
    - ne_n
    - ne_credit
    ladder:
    - when: the case is eligible, every estimate billed while pending is the same amount and the application was made in a month before the eligibility start date's month
      value: that estimate for each month from the application date's month up to the month before the eligibility start date's month
    - when: the case is eligible and those estimates differ
      value: the not-eligible-month reductions posted on the other charges
    - when: otherwise
      value: '0'
    baseline:
      ne_credit: ne_other
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: medicaid
