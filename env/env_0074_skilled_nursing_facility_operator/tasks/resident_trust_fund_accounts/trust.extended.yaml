  factors:
  - id: center_borne_days
    effect: parameter
    decides: unc_read
    bindings:
    - cov_start
    - last_cert
    - recert_day
    - unc_read
    - lapse_off
    ladder:
    - when: the coverage office has reversed days of the block as uncertified days
      value: those days
    - when: no certification is recorded on the episode after its coverage start date and the initial recertification day has passed
      value: the block's days after that day, through the covered end
    - when: otherwise
      value: '0'
    baseline:
      unc_read: '0'
      lapse_off: '100000'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: medicare
  - id: block_plan_share
    effect: parameter
    decides: plan_pct
    bindings:
    - plan_letter
    - qmb_on_file
    - plan_pct
    ladder:
    - value: K('plan_k_share_pct')
      when: Medigap Plan K with no QMB status
    - value: K('plan_l_share_pct')
      when: Medigap Plan L with no QMB status
    - value: '0'
      when: a full-coinsurance Medigap plan (C, D, F, G, M or N) or QMB status
    - value: K('whole_coinsurance_pct')
      when: otherwise
    baseline:
      plan_pct: K('whole_coinsurance_pct')
    evidence:
    - cross_category
    cross_difficulty: medicare
  - id: service_year_rate
    effect: parameter
    decides: rate_due
    bindings:
    - service_from
    - rate_due
    ladder:
    - when: the block's days of service fall in 2026
      value: K('daily_coinsurance_2026')
    - when: the block's days of service fall in 2025
      value: K('daily_coinsurance_2025')
    - when: otherwise
      value: the charge's own daily rate
    baseline:
      rate_due: charge_rate
    evidence:
    - cross_category
    - date
    cross_difficulty: medicare
  - id: coinsurance_paid_part
    effect: parameter
    decides: paid_by
    cross_difficulty: medicare
    evidence:
    - cross_category
    - history
    - date
    bindings:
    - applied_n
    - auth_amt
    - auth_n
    - paid_by
    baseline:
      paid_by: xfer_amount
    ladder:
    - value: the ACH payment the Medicare ledger applied to the charge on the transfer's date, never more than the transfer
      when: the Medicare ledger carries an ACH payment naming the charge on the transfer's date
    - value: the amount the most recent per-bill authorization naming the charge states
      when: it carries none and a per-bill authorization names the charge
    - value: the whole transfer
      when: otherwise
  - id: coinsurance_refund_order
    effect: method
    decides: refund_mode
    bindings:
    - pay_last
    - same_day_other
    - refund_mode
    ladder:
    - when: a payment other than the transfer named the charge on a later date than the transfer
      method: the other payments are refunded first; the transfer's portion is what remains of the excess
    - when: another payment named the charge on the transfer's own date
      method: the excess times the transfer's paid part over the paid part plus the other payments
    - when: otherwise
      method: the whole excess
    baseline:
      refund_mode: '''transfer_first'''
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: medicare
