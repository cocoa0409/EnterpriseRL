category: trust
display_name: Resident Trust Fund Accounts
binding:
  holding_table: trust_accounts
  event_tables:
  - trust_ledger
  intake_tables:
  - trust_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    account_balance: resident_funds
lifecycle:
  states:
  - authorization_pending
  - active
  - conveyance_pending
  - closed
  - declined
  transitions:
  - from: authorization_pending
    to: active
    by: user
    means: The resident or legal representative signs the written authorization for the center to hold funds.
  - from: authorization_pending
    to: declined
    by: user
    means: The resident or legal representative declines to deposit funds with the center.
  - from: active
    to: conveyance_pending
    by: agent
    means: The resident is discharged or dies and the final accounting and conveyance begin.
  - from: conveyance_pending
    to: closed
    by: agent
    means: All funds and the final accounting have been conveyed.
  - from: active
    to: closed
    by: user
    means: A resident who stays withdraws all funds and closes the account.
accounts:
- key: resident_funds
  unit: USD
  meaning: The resident's own money the center holds in trust; deposits, interest and reversed charges add, withdrawals,
    bill transfers and conveyance subtract.
parameter_schema:
  interest_bearing_threshold_usd: 'Balance above which a resident''s funds must be held in an interest-bearing account,
    with interest credited to the resident (USD; 42 CFR 483.10(f)(10)(ii): $50 for Medicaid residents, $100 for
    others).'
  interest_rate_schedule: Annual interest rate the center's depository pays on the pooled resident funds account,
    keyed by effective date (percent per year; map of YYYY-MM-DD -> rate), as published in the resident funds disclosure.
  interest_basis: 'Balance that earns interest (enum: average_daily_balance_above_threshold).'
  interest_day_count: 'Day-count convention for interest (enum: actual_365).'
  interest_credit_cycle: 'When interest is credited (enum: monthly_on_last_day).'
  interest_rounding: 'Rounding of an interest credit (enum: half_up_cents).'
  interest_min_credit_usd: Smallest monthly interest credit posted (USD).
  written_authorization_required: Whether the center holds funds only on the resident's or legal representative's
    written authorization (boolean).
  deposit_condition_of_admission: Whether depositing funds with the center may be required (boolean; it may not).
  accepted_deposit_sources: Sources from which deposits are accepted (list).
  check_deposit_hold_business_days: Business days a deposited personal check is held before it can be withdrawn
    (integer; Monday-Friday excluding bank holidays).
  benefit_posting_business_days: Business days after receipt within which a benefit received as representative payee
    is posted (integer).
  petty_cash_max_per_withdrawal_usd: Largest cash withdrawal paid from the business office petty cash fund in one
    transaction (USD).
  petty_cash_hours: 'When petty cash withdrawals are paid (enum: weekdays_0900_1630).'
  check_withdrawal_business_days: Business days within which a withdrawal above the petty cash maximum is paid by
    check (integer).
  withdrawal_authorized_by: 'Who may authorize a withdrawal (enum: resident_or_power_of_attorney, center_as_payee_on_resident_request,
    guardian).'
  guardian_authorization_required: Whether every withdrawal or transfer needs the guardian's written authorization
    (boolean).
  guardian_court_report_annual: Whether an annual accounting is prepared for the guardian's report to the Orphans'
    Court (boolean).
  center_is_representative_payee: Whether the center receives the resident's Social Security benefits as SSA representative
    payee (boolean).
  payee_current_needs_first: Whether benefits received as payee are applied first to the resident's current maintenance,
    then saved for the resident (boolean; SSA payee rules).
  payee_annual_accounting: Whether the center files the annual representative payee accounting with SSA (boolean).
  payee_monthly_bill_applied: 'Which center bill benefits received as payee pay each month (enum: none, medicaid_patient_pay,
    private_room_board).'
  standing_authorization_allowed_for: Center bills a resident may authorize the center to pay from the account every
    month with one standing authorization (list).
  per_bill_authorization_required_for: Center bills that need a written authorization naming the specific charge
    (list).
  charge_for_payer_covered_items: Whether items or services Medicare or Medicaid pays for may be charged against
    the account (boolean; they may not).
  allowable_charge_categories: Items and services that may be charged to the account at the resident's request (list;
    42 CFR 483.10(f)(11)(ii)).
  resident_request_required_for_optional_items: Whether an optional item may be charged only when the resident or
    representative requested it (boolean).
  trust_management_fee_allowed: Whether any fee may be charged for holding or managing the account (boolean).
  resource_notice_applies: Whether the resource-limit notice applies (boolean; Medicaid residents only).
  ssi_resource_limit_usd: SSI resource limit for an individual that the resource-limit notice is measured against
    (USD).
  resource_notice_margin_usd: Amount below the SSI resource limit at which a Medicaid resident is notified (USD;
    42 CFR 483.10(f)(10)(iv)).
  statement_frequency: 'How often account statements issue (enum: quarterly).'
  statement_days_after_quarter_end: Calendar days after a calendar quarter ends within which its statement issues
    (integer).
  statement_on_request_business_days: Business days within which a statement requested by the resident or representative
    is provided (integer).
  statement_recipients: Who receives statements (list).
  conveyance_days: Calendar days after discharge or death within which funds and a final accounting are conveyed
    (integer; 42 CFR 483.10(f)(10)(v)).
  conveyance_payee_on_discharge: 'Payee of funds on discharge (enum: resident_or_legal_representative).'
  conveyance_payee_on_death: 'Payee of funds after death (enum: estate = the personal representative holding letters
    from the Register of Wills).'
  poa_authority_ends_at_death: Whether a power of attorney stops authorizing transactions at the resident's death
    (boolean).
  conveyance_method: 'How funds are conveyed (enum: check).'
  overdraw_allowed: Whether a withdrawal or transfer may exceed the available balance (boolean).
  improper_charge_reversal_business_days: Business days within which a charge found improper is returned to the
    account (integer).
  withdrawal_receipt_signature_required: Whether the person receiving cash signs a receipt (boolean).
  interest_bearing_account_separate: Whether resident funds are kept apart from the center's operating accounts
    (boolean).
  transfer_cap_basis: 'Most a transfer to a center bill may pay (enum: open_balance_of_named_charge).'
  resident_may_close_account: Whether a resident who stays may withdraw everything and close the account (boolean).
  medicaid_pna_retained: Whether, for a Medicaid payee account, the personal needs allowance stays in the account
    after patient pay is transferred (boolean).
  payee_transfer_requires_resident_request: Whether a payee transfer to a monthly center bill needs a resident request
    (boolean; false = the payee applies benefits to current maintenance).
