  - leave_ended: (res_status == 'returned' or res_status == 'released' or res_status == 'expired')
  - agreement_priced: ((res_variant == 'Private Pay Hospital Leave Bed Hold' and private_entries == 1 and leave_ended) or (res_variant == 'Medicaid Hospital Leave Reserved Bed' and private_entries > 1 and (entry_from == first_private or (leave_ended and entry_to == last_entry_to))) or (res_variant == 'Private Pay Therapeutic Leave Bed Hold' and res_status == 'released' and private_entries > 1 and (entry_from == first_private or entry_to == last_entry_to)))
