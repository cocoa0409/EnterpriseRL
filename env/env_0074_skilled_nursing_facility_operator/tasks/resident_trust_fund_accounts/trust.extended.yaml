    bh_old_nights: and the schedule taking effect 2025-07-01 for earlier nights
    bh_new_nights: the schedule taking effect 2026-07-01 for nights from that date
    rate_2026: The bed-hold rate of a night is the room tier's scheduled private daily rate in effect that night
    rate_2025: The bed-hold rate of a night is the room tier's scheduled private daily rate in effect that night
    bh_kept: 'The bed-hold bills kept follow the bed-hold reservations: where a private-pay hold, a Medicare skilled-stay hold or a Medicaid hospital-leave reserved bed is in progress, the open balance of every bed-hold charge plus the hold''s nights so far not yet charged beyond the nights the payer reserves for it, each at the bed-hold rate of the room tier held (a reservation that records no room tier prices no night); where no such hold is in progress and bed-hold charges carry an open balance, that open balance; otherwise nothing.'
    result: The spare amount is the available balance less the resident's allowance kept, less the coming patient pay kept, less the ancillary bills kept, less the recurring services kept and less the bed-hold bills kept, never below zero, rounded half up to the cent once, on the final amount only.
