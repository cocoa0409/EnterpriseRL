    allowance_kept: 'The resident''s allowance kept follows the resident''s Medical Assistance case: where the case is eligible in the VA reduced pension tier, the personal needs allowance plus the protected VA pension of that tier; where the case is eligible in any other tier, the personal needs allowance of the case''s tier; otherwise nothing.'
    standing: where the account's standing authorization names Medicaid patient pay
    case_pp: the case's patient pay
    income_recent: no pension or benefit deposit has been posted in the last two months counted back from today
    pension_on: the most recent pension or benefit deposit, whichever of the two kinds was posted later (of two posted the same day, the pension)
    benefit_on: the most recent pension or benefit deposit, whichever of the two kinds was posted later (of two posted the same day, the pension)
    income_last: the most recent pension or benefit deposit, whichever of the two kinds was posted later (of two posted the same day, the pension)
    coming_pp_kept: 'The coming patient pay kept follows the standing authorization and the income paid into the account: where the account''s standing authorization names Medicaid patient pay and no pension or benefit deposit has been posted in the last two months counted back from today, the case''s patient pay; where the standing authorization names Medicaid patient pay and such a deposit has been posted, the case''s patient pay less the most recent pension or benefit deposit, whichever of the two kinds was posted later (of two posted the same day, the pension), never below zero; otherwise nothing.'
    svc_start_at: The recurring services kept follow the resident's most recent request to start a recurring service on the ancillary account (of two made at the same moment, the one recorded first)
    svc_item: The recurring services kept follow the resident's most recent request to start a recurring service on the ancillary account (of two made at the same moment, the one recorded first)
    svc_cancel_at: The recurring services kept follow the resident's most recent request to start a recurring service on the ancillary account (of two made at the same moment, the one recorded first)
    svc_price: the monthly price of that service on the ancillary account's tier
    svc_last_charge: the amount of that service's most recent monthly charge
    services_kept: 'The recurring services kept follow the resident''s most recent request to start a recurring service on the ancillary account (of two made at the same moment, the one recorded first): where it was made within the last thirty days and no later request cancels a recurring service, the monthly price of that service on the ancillary account''s tier; where it was made earlier and no later request cancels a recurring service, the amount of that service''s most recent monthly charge; otherwise nothing.'
    anc_balance: where the ancillary account otherwise carries an open balance, that open balance
    anc_auth_charge: the most recent per-bill authorization naming an ancillary charge (of two signed at the same moment, the one recorded first)
    anc_auth_amt: authorizes less than its charge's open balance
    anc_auth_paid: where that authorization awaits its transfer
    anc_auth_open: authorizes less than its charge's open balance
    anc_kept: 'The ancillary bills kept follow the ancillary account and the most recent per-bill authorization naming an ancillary charge (of two signed at the same moment, the one recorded first): where that authorization awaits its transfer and authorizes less than its charge''s open balance, the account''s open balance less the part of that charge the authorization leaves out, because the representative pays that part another way; where the ancillary account otherwise carries an open balance, that open balance; otherwise nothing.'
