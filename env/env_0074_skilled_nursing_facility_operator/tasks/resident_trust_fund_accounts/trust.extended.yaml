    - isolation_placement
    note: The private-pay agreement's room tier prices the nights where the reservation records no room tier.
  compute:
  - xfer_id: LATEST('trust_ledger','trust_entry_id', date_field='entry_date', event_type='trust_bill_transfer', bill_category='bed_hold')
  - xfer_amount: LATEST('trust_ledger','amount', date_field='entry_date', event_type='trust_bill_transfer', bill_category='bed_hold') or 0
  - xfer_date: LATEST('trust_ledger','entry_date', date_field='entry_date', event_type='trust_bill_transfer', bill_category='bed_hold')
  - charge_id: LATEST('trust_ledger','bill_entry_id', date_field='entry_date', event_type='trust_bill_transfer', bill_category='bed_hold')
  - charge_amount: XLATEST('bedhold','bedhold_ledger','amount', date_field='entry_date', bedhold_entry_id=charge_id) or 0
  - charge_from: XLATEST('bedhold','bedhold_ledger','from_date', date_field='entry_date', bedhold_entry_id=charge_id)
  - charge_nights: XLATEST('bedhold','bedhold_ledger','day_count', date_field='entry_date', bedhold_entry_id=charge_id) or 0
  - charge_rate: XLATEST('bedhold','bedhold_ledger','daily_rate', date_field='entry_date', bedhold_entry_id=charge_id) or 0
  - charge_billed: XLATEST('bedhold','bedhold_ledger','entry_date', date_field='entry_date', bedhold_entry_id=charge_id) or ''
  - res_id: XLATEST('bedhold','bedhold_ledger','bedhold_reservation_id', date_field='entry_date', bedhold_entry_id=charge_id)
  - res_variant: CFIELD('bedhold','variant_name', bedhold_reservation_id=res_id) or ''
  - res_status: CFIELD('bedhold','status', bedhold_reservation_id=res_id) or ''
  - entry_id: XLATEST('bedhold','bedhold_ledger','days_entry_id', date_field='entry_date', bedhold_entry_id=charge_id)
  - private_entries: XCOUNT('bedhold','bedhold_ledger', event_type='bedhold_day_booked', day_payer='resident_private', bedhold_reservation_id=res_id)
  - entry_from: XLATEST('bedhold','bedhold_ledger','from_date', date_field='entry_date', bedhold_entry_id=entry_id) or ''
  - entry_to: XLATEST('bedhold','bedhold_ledger','to_date', date_field='entry_date', bedhold_entry_id=entry_id) or ''
