  compute:
  - xfer_id: LATEST('trust_ledger','trust_entry_id', date_field='entry_date', event_type='trust_bill_transfer', bill_category='ancillary_charge')
  - xfer_amount: SUM('trust_ledger','amount', event_type='trust_bill_transfer', trust_entry_id=xfer_id)
  - xfer_date: LATEST('trust_ledger','entry_date', date_field='entry_date', event_type='trust_bill_transfer', bill_category='ancillary_charge')
  - charge_id: LATEST('trust_ledger','bill_entry_id', date_field='entry_date', event_type='trust_bill_transfer', bill_category='ancillary_charge')
  - charge_amount: XLATEST('ancillary','ancillary_ledger','amount', date_field='entry_date', ancillary_entry_id=charge_id) or 0
  - charge_kind: XLATEST('ancillary','ancillary_ledger','event_type', date_field='entry_date', ancillary_entry_id=charge_id)
