    gate: balance_now
    form: state
    policy_source: The amount a new per-bill authorization covers is fixed only after the account's ledger carries a payer-covered return for the most recent transfer to an ancillary charge, where part of that transfer paid for days a payer covers.
    condition: The trust ledger carries a trust_reversal with reason payer_covered_item naming the most recent trust_bill_transfer to an ancillary charge, where the transfer's portion of the part of that charge a payer covers is above zero.
    resolved_by: return_improper_transfer_e2970e4f
    effect: The payer-covered return raises the account balance by the improper part returned, so the spare balance the authorization amount is capped by is higher by that return.
  cross_category:
  - category: ancillary
    as: history
    reads:
    - ancillary_ledger.amount
    - ancillary_ledger.event_type
    - ancillary_ledger.entry_date
    note: The named one-time item charge and its payments and credits give its open balance.
  - category: medicare
    as: history
    reads:
    - status
    - coverage_start_date
    - last_covered_date
    - prior_snf_days_in_period
    - medigap_plan_letter
    - supplemental_effective_date
    - qmb_status
    - medicare_ledger.to_date
    - medicare_ledger.day_count
    - medicare_ledger.daily_coinsurance_rate
    note: The active episode, its booked blocks and its supplemental coverage decide the coinsurance run-up.
  - category: bedhold
    as: history
    reads:
    - status
    - leave_start_date
    - variant_name
    - room_tier_held
    - bedhold_ledger.day_count
    - private_hold_start_date
    - bedhold_ledger.entry_date
    - bedhold_ledger.event_type
    - bedhold_ledger.notice_type
    note: A hold in progress ends the covered run, and its uncharged nights from the first night its transfer notice allows build up at the room tier's bed-hold rate.
  - category: private
    as: branch
    reads:
    - variant_name
    - isolation_placement
    note: The private-pay agreement's room tier prices the held nights where the reservation records no room tier.
  - as: branch
    category: medicaid
    reads:
    - status
    note: For a Medicaid representative payee account, the eligible case's personal needs allowance stays in the account.
  compute:
  - charge_id: XLATEST('ancillary','ancillary_ledger','ancillary_entry_id', date_field='entry_date', event_type='ancillary_item_charge')
  - charge_amt: XLATEST('ancillary','ancillary_ledger','amount', date_field='entry_date', ancillary_entry_id=charge_id) or 0
  - charge_paid: XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_payment', charge_entry_id=charge_id)
  - charge_credited: XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_credit', charge_entry_id=charge_id)
  - open_charge: MX(0, charge_amt - charge_paid - charge_credited)
  - balance_now: SUM('trust_ledger','amount', event_type='trust_deposit') + SUM('trust_ledger','amount', event_type='trust_interest_credit') + SUM('trust_ledger','amount', event_type='trust_reversal') - SUM('trust_ledger','amount', event_type='trust_withdrawal') - SUM('trust_ledger','amount', event_type='trust_bill_transfer') - SUM('trust_ledger','amount', event_type='trust_conveyance')
  - held_deposits: SUM('trust_ledger','amount', event_type='trust_deposit') - SUM('trust_ledger','amount', within_months=100000, date_field='available_date', event_type='trust_deposit')
  - pna_left: ((CPARAM('medicaid','personal_needs_allowance_monthly', status='eligible') or 0) if (P('center_is_representative_payee') and P('medicaid_pna_retained')) else 0)
  - episode_active: EXISTS('medicare', status='active')
  - cover_start: CFIELD('medicare','coverage_start_date', status='active')
  - episode_id: CFIELD('medicare','medicare_coverage_id', status='active')
  - last_block_end: XLATEST('medicare','medicare_ledger','to_date', date_field='to_date', event_type='medicare_days_booked', medicare_coverage_id=episode_id)
  - start_off: ((((DAYS(cover_start, last_block_end) + 1) if last_block_end else 0)) if (episode_active and cover_start) else 0)
  - hold_start: CFIELD('bedhold','leave_start_date', status='held')
  - cover_last: CFIELD('medicare','last_covered_date', status='active')
  - run_last_off: ((DAYS(cover_start, cover_last) if (cover_last and DAYS(cover_last, NOW) > 0) else ((DAYS(cover_start, hold_start) - 1) if hold_start else (DAYS(cover_start, NOW) - 1))) if cover_start else 0)
  - run_days: (MX(0, run_last_off - start_off + 1) if (episode_active and cover_start) else 0)
  - prior_days: CFIELD('medicare','prior_snf_days_in_period', status='active') or 0
  - booked_net: XSUM('medicare','medicare_ledger','day_count', event_type='medicare_days_booked', medicare_coverage_id=episode_id) - XSUM('medicare','medicare_ledger','day_count', event_type='medicare_days_reversed', medicare_coverage_id=episode_id)
  - booked_before: (booked_net if start_off > 0 else 0)
  - full_limit: CPARAM('medicare','full_coverage_day_limit', status='active') or 0
  - period_limit: CPARAM('medicare','benefit_period_day_limit', status='active') or 0
  - c0: MN(run_days, MX(0, full_limit - prior_days - booked_before))
  - c1: MN(run_days, MX(0, period_limit - prior_days - booked_before))
  - y25: (MN(run_days, MX(0, DAYS(cover_start, '2025-01-01') - start_off)) if cover_start else 0)
  - y26: (MN(run_days, MX(0, DAYS(cover_start, '2026-01-01') - start_off)) if cover_start else 0)
  - y27: (MN(run_days, MX(0, DAYS(cover_start, '2027-01-01') - start_off)) if cover_start else 0)
  - latest_rate: XLATEST('medicare','medicare_ledger','daily_coinsurance_rate', date_field='entry_date', event_type='medicare_coinsurance_charge', medicare_coverage_id=episode_id) or 0
  - plan_letter: CFIELD('medicare','medigap_plan_letter', status='active') or ''
  - qmb_on_file: CFIELD('medicare','qmb_status', status='active')
  - plan_effective: CFIELD('medicare','supplemental_effective_date', status='active') or ''
  - share_pct: (K('resident_share_plan_k_pct') if (plan_letter == 'K' and not qmb_on_file) else (K('resident_share_plan_l_pct') if (plan_letter == 'L' and not qmb_on_file) else (0 if (qmb_on_file or plan_letter == 'C' or plan_letter == 'D' or plan_letter == 'F' or plan_letter == 'G' or plan_letter == 'M' or plan_letter == 'N') else K('resident_share_full_pct'))))
  - p0: (100000 if not (plan_effective and cover_start) else MX(0, DAYS(cover_start, plan_effective) - start_off))
  - coins_o1: MX(0, MN(c1, y25) - MX(c0, 0))
  - plan_o1: MX(0, MN(c1, y25) - MX(c0, 0, p0))
  - coins_25: MX(0, MN(c1, y26) - MX(c0, y25))
  - plan_25: MX(0, MN(c1, y26) - MX(c0, y25, p0))
  - coins_26: MX(0, MN(c1, y27) - MX(c0, y26))
  - plan_26: MX(0, MN(c1, y27) - MX(c0, y26, p0))
  - coins_o2: MX(0, MN(c1, run_days) - MX(c0, y27))
  - plan_o2: MX(0, MN(c1, run_days) - MX(c0, y27, p0))
  - run_up_raw: (K('coinsurance_rate_2025') * ((coins_25 - plan_25) * K('resident_share_full_pct') + plan_25 * share_pct) + K('coinsurance_rate_2026') * ((coins_26 - plan_26) * K('resident_share_full_pct') + plan_26 * share_pct) + latest_rate * ((coins_o1 - plan_o1 + coins_o2 - plan_o2) * K('resident_share_full_pct') + (plan_o1 + plan_o2) * share_pct)) / 100
  - run_up: run_up_raw
  - hold_id: CFIELD('bedhold','bedhold_reservation_id', status='held')
  - hold_variant: CFIELD('bedhold','variant_name', status='held') or ''
  - reserved_nights: CPARAM('bedhold','payer_reserved_days_per_hospitalization', status='held') or 0
  - charged_nights: XSUM('bedhold','bedhold_ledger','day_count', event_type='bedhold_charge', bedhold_reservation_id=hold_id)
  - nights_so_far: (DAYS(hold_start, NOW) if hold_start else 0)
  - hold_first: (CFIELD('bedhold','private_hold_start_date', status='held') or hold_start)
  - notice_on: XLATEST('bedhold','bedhold_ledger','entry_date', date_field='entry_date', event_type='bedhold_notice_delivered', bedhold_reservation_id=hold_id, notice_type='transfer_notice')
  - first_allowed: (notice_on if (notice_on and hold_first and notice_on > hold_first) else ('9999-12-31' if (hold_start and not notice_on) else hold_first))
  - first_off: (MX(0, DAYS(hold_start, hold_first)) if (hold_start and hold_first) else 0)
  - notice_off: (MX(0, DAYS(hold_start, first_allowed)) if (hold_start and first_allowed) else 0)
  - held_from: (charged_nights if (hold_start and (hold_variant == 'Medicare Skilled Stay Hospital Leave Bed Hold' or hold_variant == 'Medicare Skilled Stay Therapeutic Leave Bed Hold' or hold_variant == 'Private Pay Hospital Leave Bed Hold' or hold_variant == 'Private Pay Therapeutic Leave Bed Hold')) else ((reserved_nights + charged_nights) if (hold_start and hold_variant == 'Medicaid Hospital Leave Reserved Bed') else nights_so_far))
  - held_eff: MX(held_from, notice_off)
  - old_nights: (MX(0, MN(nights_so_far, DAYS(hold_start, '2026-07-01')) - held_eff) if hold_start else 0)
  - new_nights: (MX(0, nights_so_far - MX(held_eff, MN(nights_so_far, MX(0, DAYS(hold_start, '2026-07-01'))))) if hold_start else 0)
  - agreement_tier: CFIELD('private','variant_name') or ''
  - tier_held: CFIELD('bedhold','room_tier_held', status='held') or ''
  - isolation_on: CFIELD('private','isolation_placement')
  - isolation_tier: CPARAM('private','isolation_billing_tier') or ''
  - tier_priced: (tier_held if tier_held else (isolation_tier if isolation_on else agreement_tier))
  - rate_2026: (K('semi_private_rate_2026') if tier_priced == 'Semi-Private Long-Term Care Room' else (K('semi_private_memory_care_rate_2026') if tier_priced == 'Semi-Private Secure Memory Care Room' else (K('private_rate_2026') if tier_priced == 'Private Long-Term Care Room' else (K('private_memory_care_rate_2026') if tier_priced == 'Private Secure Memory Care Room' else (K('bariatric_rate_2026') if tier_priced == 'Private Bariatric Care Room' else (K('suite_rate_2026') if tier_priced == 'Private Suite with Sitting Area' else 0))))))
  - rate_2025: (K('semi_private_rate_2025') if tier_priced == 'Semi-Private Long-Term Care Room' else (K('semi_private_memory_care_rate_2025') if tier_priced == 'Semi-Private Secure Memory Care Room' else (K('private_rate_2025') if tier_priced == 'Private Long-Term Care Room' else (K('private_memory_care_rate_2025') if tier_priced == 'Private Secure Memory Care Room' else (K('bariatric_rate_2025') if tier_priced == 'Private Bariatric Care Room' else (K('suite_rate_2025') if tier_priced == 'Private Suite with Sitting Area' else 0))))))
  - held_accrual: old_nights * rate_2025 + new_nights * rate_2026
  - spare: balance_now - held_deposits - pna_left - run_up - held_accrual
  - result: RND(MN(open_charge, MX(0, spare)) + 0.000000001, 2)
  compute_basis:
    charge_id: A per-bill authorization for an ancillary charge names the most recent one-time item charge on the ancillary account (of two on the same date, the one recorded first)
    charge_amt: the named charge's open balance is the charge less the payments and credits naming it
    charge_paid: the named charge's open balance is the charge less the payments and credits naming it
    charge_credited: the named charge's open balance is the charge less the payments and credits naming it
    open_charge: the named charge's open balance is the charge less the payments and credits naming it
    balance_now: The spare balance is the account balance, which is the deposits, interest credits and returns on the account's ledger less its withdrawals, bill transfers and conveyances
    episode_active: The run is the days of the active Part A episode from the run's first day through the run's end.
    cover_start: where no block is booked yet, the episode's coverage start date
    episode_id: where a block of the active episode is booked
    last_block_end: where a block of the active episode is booked, the day after the last day of its most recent booked block
    hold_start: where no such date is set and a bed hold is in progress because the resident is away, it ends on the day before the leave began
    cover_last: where the active episode carries a last covered date before today, the run ends on that last covered date
    run_last_off: 'The run''s end follows the stay: where the active episode carries a last covered date before today, the run ends on that last covered date; where no such date is set and a bed hold is in progress because the resident is away, it ends on the day before the leave began; otherwise it ends yesterday.'
    run_days: The run is the days of the active Part A episode from the run's first day through the run's end.
    prior_days: the SNF days already used in the benefit period before the episode
    booked_net: plus the net covered days booked in the episode
    full_limit: only the days numbered above the full-coverage day limit
    period_limit: and not above the benefit-period day limit are coinsurance days
    c0: only the days numbered above the full-coverage day limit and not above the benefit-period day limit are coinsurance days
    c1: only the days numbered above the full-coverage day limit and not above the benefit-period day limit are coinsurance days
    y25: a day in 2025 takes the 2025 rate
    y26: a day in 2026 takes the 2026 rate
    y27: a day in any other year takes the rate of the episode's most recent coinsurance charge
    latest_rate: a day in any other year takes the rate of the episode's most recent coinsurance charge
    plan_letter: Medigap Plan K with no QMB status, the Plan K resident share
    qmb_on_file: or QMB status, nothing
    plan_effective: Which coinsurance days take that share follows the date the supplemental coverage took effect
    share_pct: 'The share percent of a coinsurance day follows the supplemental coverage on the active Part A episode: Medigap Plan K with no QMB status, the Plan K resident share; Medigap Plan L with no QMB status, the Plan L resident share; a full-coinsurance Medigap plan (C, D, F, G, M or N) or QMB status, nothing; any other case, the whole coinsurance.'
    p0: 'Which coinsurance days take that share follows the date the supplemental coverage took effect: where it took effect on or before the run''s first day, every coinsurance day of the run; where it took effect after the run''s first day, the run''s coinsurance days from that date, the earlier ones keeping the whole coinsurance, because days before the supplemental effective date keep the earlier split; where no supplemental effective date is recorded, none, every coinsurance day keeping the whole coinsurance.'
    coins_o1: a day in any other year takes the rate of the episode's most recent coinsurance charge
    plan_o1: times the share percent that applies to it
    coins_25: a day in 2025 takes the 2025 rate
    plan_25: times the share percent that applies to it
    coins_26: a day in 2026 takes the 2026 rate
    plan_26: times the share percent that applies to it
    coins_o2: a day in any other year takes the rate of the episode's most recent coinsurance charge
    plan_o2: times the share percent that applies to it
    run_up_raw: 'The coinsurance run-up is the resident''s share of the coinsurance on the coinsurance days of the run: each such day at the daily coinsurance rate due for it times the share percent that applies to it, over one hundred.'
    run_up: every day of the run is reserved as a day in the center, a night away included
    hold_id: the hold in progress
    hold_variant: a private-pay or Medicare skilled-stay hold builds up its nights so far not yet charged
    reserved_nights: beyond the reserved nights per hospitalization
    charged_nights: not yet charged
    nights_so_far: the hold's nights so far
    held_from: 'The held nights follow the hold in progress: a private-pay or Medicare skilled-stay hold builds up its nights so far not yet charged; a Medicaid hospital-leave reserved bed builds up only its nights so far beyond the reserved nights per hospitalization not yet charged; any other case, including no hold in progress, builds up no night.'
    old_nights: and the schedule taking effect 2025-07-01 for earlier nights
    new_nights: the schedule taking effect 2026-07-01 for nights from that date
    agreement_tier: otherwise the room tier of the resident's private-pay agreement
    tier_held: where the reservation records the room tier held, that tier
    isolation_on: where it records none and the resident's private-pay agreement records an isolation placement the center directed
    isolation_tier: the agreement's isolation billing tier
    tier_priced: 'The room tier priced follows the hold in progress: where the reservation records the room tier held, that tier, because a held bed is priced at the tier of the room held; where it records none and the resident''s private-pay agreement records an isolation placement the center directed, the agreement''s isolation billing tier; otherwise the room tier of the resident''s private-pay agreement; where neither records a room tier, no night is priced.'
    rate_2026: each at the bed-hold rate of the room tier priced in effect that night
    rate_2025: each at the bed-hold rate of the room tier priced in effect that night
    held_accrual: 'The held-bed charges building up are the hold''s nights so far, from the first night allowed, not yet charged, each at the bed-hold rate of the room tier priced in effect that night: the schedule taking effect 2026-07-01 for nights from that date, and the schedule taking effect 2025-07-01 for earlier nights.'
    spare: The spare balance is the account balance, which is the deposits, interest credits and returns on the account's ledger less its withdrawals, bill transfers and conveyances, less every deposit whose available date is after today, because a transfer never exceeds the available balance and a check deposit still on hold is not available, less the personal needs allowance of the resident's Medical Assistance case where the account is a Medicaid representative payee account, because for a Medicaid payee account the personal needs allowance stays in the account, less the coinsurance run-up and less the held-bed charges building up.
    result: The amount a new per-bill authorization covers is the lesser of the named charge's open balance and the account's spare balance, never below zero, rounded half up to the cent once, on the final amount only
    hold_first: The hold's first held day is the private hold start date the reservation records, or its leave start date where it records none.
    notice_on: where the latest transfer notice recorded for the reservation was delivered after the hold's first held day, the delivery date
    first_allowed: 'The first night allowed follows the transfer notice for the hold in progress, because no night held before the transfer notice was delivered is ever charged: where the latest transfer notice recorded for the reservation was delivered after the hold''s first held day, the delivery date; where no transfer notice is recorded for the reservation, no night is allowed; otherwise the hold''s first held day. The hold''s first held day is the private hold start date the reservation records, or its leave start date where it records none.'
    first_off: otherwise the hold's first held day
    notice_off: 'The first night allowed follows the transfer notice for the hold in progress, because no night held before the transfer notice was delivered is ever charged: where the latest transfer notice recorded for the reservation was delivered after the hold''s first held day, the delivery date; where no transfer notice is recorded for the reservation, no night is allowed; otherwise the hold''s first held day. The hold''s first held day is the private hold start date the reservation records, or its leave start date where it records none.'
    held_eff: from the first night allowed, not yet charged
    held_deposits: less every deposit whose available date is after today, because a transfer never exceeds the available balance and a check deposit still on hold is not available
    pna_left: less the personal needs allowance of the resident's Medical Assistance case where the account is a Medicaid representative payee account, because for a Medicaid payee account the personal needs allowance stays in the account
    start_off: 'The run''s first day follows the episode''s bookings, because the reserve covers only the days the coverage office has not booked yet and it books an episode''s days block by block: where a block of the active episode is booked, the day after the last day of its most recent booked block; where no block is booked yet, the episode''s coverage start date; where no Part A episode is active, there is no run.'
    booked_before: plus the net covered days booked in the episode before the run's first day, plus one
  factors:
  - id: covered_run_end
    effect: method
    decides: run_last_off
    bindings:
    - cover_last
    - run_last_off
    ladder:
    - when: the active episode carries a last covered date before today
      method: the run ends on that last covered date
    - when: no such date is set and a bed hold is in progress because the resident is away
      method: the run ends on the day before the leave began
    - when: otherwise
      method: the run ends yesterday
    baseline:
      run_last_off: (DAYS(cover_start, NOW) - 1) if cover_start else 0
    evidence:
    - cross_category
    - date
    cross_difficulty: medicare
  - id: coinsurance_share
    effect: parameter
    decides: share_pct
    bindings:
    - plan_letter
    - qmb_on_file
    - share_pct
    ladder:
    - when: Medigap Plan K with no QMB status
      value: K('resident_share_plan_k_pct')
    - when: Medigap Plan L with no QMB status
      value: K('resident_share_plan_l_pct')
    - when: a full-coinsurance Medigap plan (C, D, F, G, M or N) or QMB status
      value: '0'
    - when: otherwise
      value: K('resident_share_full_pct')
    baseline:
      share_pct: K('resident_share_full_pct')
    evidence:
    - cross_category
    cross_difficulty: medicare
  - id: run_start_day
    effect: method
    decides: start_off
    cross_difficulty: medicare
    evidence:
    - cross_category
    - history
    - date
    bindings:
    - last_block_end
    - start_off
    baseline:
      start_off: '0'
    ladder:
    - method: the run starts the day after the last day of the episode's most recent booked block
      when: a block of the active episode is booked
    - method: the run starts on the episode's coverage start date
      when: no block of the active episode is booked yet
    - method: there is no run
      when: no Part A episode is active
  - id: hold_first_night
    effect: method
    decides: notice_off
    cross_difficulty: bedhold
    evidence:
    - cross_category
    - history
    - date
    bindings:
    - notice_on
    - first_allowed
    - notice_off
    baseline:
      notice_off: first_off
    ladder:
    - method: the first night allowed is the delivery date
      when: the latest transfer notice recorded for the reservation was delivered after the hold's first held day
    - method: no night is allowed
      when: no transfer notice is recorded for the reservation
    - method: the first night allowed is the hold's first held day
      when: otherwise
  - id: held_room_tier
    effect: parameter
    decides: tier_priced
    bindings:
    - agreement_tier
    - tier_held
    - isolation_on
    - isolation_tier
    - tier_priced
    ladder:
    - when: the reservation in progress records the room tier held
      value: that room tier
    - when: it records none and the private-pay agreement records a center-directed isolation placement
      value: the agreement's isolation billing tier
    - when: otherwise
      value: the room tier of the resident's private-pay agreement
    baseline:
      tier_priced: agreement_tier
    evidence:
    - cross_category
    cross_difficulty: bedhold
  baseline:
    rule: 'The amount a new per-bill authorization covers is the lesser of the named charge''s open balance and the account''s spare balance, never below zero, rounded half up to the cent once, on the final amount only; the named charge''s open balance is the charge less the payments and credits naming it. The spare balance is the account balance, which is the deposits, interest credits and returns on the account''s ledger less its withdrawals, bill transfers and conveyances, less every deposit whose available date is after today, because a transfer never exceeds the available balance and a check deposit still on hold is not available, less the personal needs allowance of the resident''s Medical Assistance case where the account is a Medicaid representative payee account, because for a Medicaid payee account the personal needs allowance stays in the account, less the coinsurance run-up and less the held-bed charges building up. The coinsurance run-up is the resident''s share of the coinsurance on the coinsurance days of the run: each such day at the daily coinsurance rate due for it times the share percent that applies to it, over one hundred. The daily coinsurance rate due for a run day is the rate of the calendar year the day falls in: a day in 2026 takes the 2026 rate; a day in 2025 takes the 2025 rate; a day in any other year takes the rate of the episode''s most recent coinsurance charge. The run is the days of the active Part A episode from the run''s first day through the run''s end. For the reserve the run''s days are numbered in turn in the benefit period from the days the coverage office has booked: the first day of the run is the SNF days already used in the benefit period before the episode, plus the net covered days booked in the episode before the run''s first day, plus one; only the days numbered above the full-coverage day limit and not above the benefit-period day limit are coinsurance days. The run-up is a reserve for what the run will cost the resident: every day of the run is reserved as a day in the center, a night away included, because a night away during a Part A stay is billed instead as a held night at the private rate of the room held, which is never less than the coinsurance reserved for it. A held night is reserved at the full bed-hold rate, the most a held night can bill, because an extended-hold percent or a dietary credit that a bed-hold charge agreement applies once the leave has ended depends on the leave''s final length. The held-bed charges building up are the hold''s nights so far, from the first night allowed, not yet charged, each at the bed-hold rate of the room tier priced in effect that night: the schedule taking effect 2026-07-01 for nights from that date, and the schedule taking effect 2025-07-01 for earlier nights. The hold''s first held day is the private hold start date the reservation records, or its leave start date where it records none. Under the standard method the run starts on the episode''s coverage start date and ends yesterday, every day of the episode from that date counted in it, every coinsurance day of the run is at the whole coinsurance, the room tier priced is the room tier of the resident''s private-pay agreement, and the first night allowed is the hold''s first held day. Which coinsurance days take that share follows the date the supplemental coverage took effect: where it took effect on or before the run''s first day, every coinsurance day of the run; where it took effect after the run''s first day, the run''s coinsurance days from that date, the earlier ones keeping the whole coinsurance, because days before the supplemental effective date keep the earlier split; where no supplemental effective date is recorded, none, every coinsurance day keeping the whole coinsurance. The held nights follow the hold in progress: a private-pay or Medicare skilled-stay hold builds up its nights so far not yet charged; a Medicaid hospital-leave reserved bed builds up only its nights so far beyond the reserved nights per hospitalization not yet charged; any other case, including no hold in progress, builds up no night.'
    params:
    - resident_share_full_pct
  inputs:
    history:
    - table: trust_ledger
      aggregate: sum
      field: amount
