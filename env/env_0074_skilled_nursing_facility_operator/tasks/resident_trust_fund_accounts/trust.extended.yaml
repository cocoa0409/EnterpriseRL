  - covered_days: (days_from_start if (part_a_active or ma_eligible) else 0)
  - returned_void: COUNT('trust_ledger', event_type='trust_reversal', withdrawal_entry_id=xfer_id, reversal_reason='unauthorized') + COUNT('trust_ledger', event_type='trust_reversal', withdrawal_entry_id=xfer_id, reversal_reason='duplicate')
  - returned_wrong: SUM('trust_ledger','amount', event_type='trust_reversal', withdrawal_entry_id=xfer_id, reversal_reason='amount_error')
  - applied_pay: XLATEST('ancillary','ancillary_ledger','amount', date_field='entry_date', event_type='ancillary_payment', charge_entry_id=charge_id, payment_method='trust_transfer', entry_date=xfer_date) or 0
  - applied_n: XCOUNT('ancillary','ancillary_ledger', event_type='ancillary_payment', charge_entry_id=charge_id, payment_method='trust_transfer', entry_date=xfer_date)
  - auth_amt: LATEST('trust_requests','amount', date_field='created_at', request_type='bill_payment_authorization', bill_category='ancillary_charge', bill_entry_id=charge_id) or 0
  - auth_n: COUNT('trust_requests', request_type='bill_payment_authorization', bill_category='ancillary_charge', bill_entry_id=charge_id)
  - paid_by: (MN(applied_pay, xfer_amount - returned_wrong) if applied_n > 0 else (auth_amt if auth_n > 0 else xfer_amount))
  - paid_part: (0 if returned_void > 0 else paid_by)
  - paid_on_charge: XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_payment', charge_entry_id=charge_id)
  - all_credits: XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_credit', charge_entry_id=charge_id)
  - anc_tier: CFIELD('ancillary','variant_name', status='open') or ''
  - cb_credits: XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_credit', charge_entry_id=charge_id, credit_reason='consolidated_billing_item')
  - pc_credits: XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_credit', charge_entry_id=charge_id, credit_reason='payer_covered_item')
  - hs_credits: XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_credit', charge_entry_id=charge_id, credit_reason='hospice_related_item')
  - counted_credits: ((all_credits - cb_credits) if anc_tier == 'Ancillary Account, Medicare Part A Consolidated Billing' else ((all_credits - pc_credits) if (anc_tier == 'Ancillary Account, Medical Assistance' or anc_tier == 'Ancillary Account, Medicare Part B' or anc_tier == 'Ancillary Account, Medicare Advantage') else ((all_credits - hs_credits) if anc_tier == 'Ancillary Account, Hospice Election' else all_credits)))
  - unpaid_balance: MX(0, charge_amount - paid_on_charge - counted_credits)
  - improper_part: (charge_amount * covered_days / charged_days) if charged_days else 0
  - refundable: MX(0, improper_part - unpaid_balance)
  - other_paid: paid_on_charge - XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_payment', charge_entry_id=charge_id, payment_method='trust_transfer')
  - check_last: XLATEST('ancillary','ancillary_ledger','entry_date', date_field='entry_date', event_type='ancillary_payment', charge_entry_id=charge_id, payment_method='check')
  - ach_last: XLATEST('ancillary','ancillary_ledger','entry_date', date_field='entry_date', event_type='ancillary_payment', charge_entry_id=charge_id, payment_method='ach')
  - card_last: XLATEST('ancillary','ancillary_ledger','entry_date', date_field='entry_date', event_type='ancillary_payment', charge_entry_id=charge_id, payment_method='card')
  - other_last: MX(check_last or '', ach_last or '', card_last or '')
  - same_day_other: XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_payment', charge_entry_id=charge_id, entry_date=xfer_date) - XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_payment', charge_entry_id=charge_id, entry_date=xfer_date, payment_method='trust_transfer')
  - refund_mode: ('others_first' if (other_last and xfer_date and other_last > xfer_date) else ('pro_rata' if same_day_other > 0 else 'transfer_first'))
  - portion: (MX(0, refundable - other_paid) if refund_mode == 'others_first' else ((refundable * paid_part / (paid_part + other_paid)) if (refund_mode == 'pro_rata' and paid_part + other_paid > 0) else refundable))
  - result: RND(MX(0, MN(paid_part, portion)) + 0.000000001, 2)
