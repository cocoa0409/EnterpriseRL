- id: trust_ext_ancillary_authorization_amount
  base_policy_refs:
  - trust_evt_bill_transfers
  overwrite: []
  trigger: on_request
  subject:
  - trust_bill_transfer
  computes: amount
  target_tool: sign_bill_payment_authorization_74e4ddf9
  params:
    resident_share_plan_k_pct: 50
