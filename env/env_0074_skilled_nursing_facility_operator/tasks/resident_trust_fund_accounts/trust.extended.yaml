events:
- type: trust_account_open
  target: trust_accounts
  mutation: create
  meaning: A resident funds account is set up for the resident's authorization.
  grain: one row per account
  fields:
    customer_id: the resident
    variant_name: tier from Medicaid status and who directs the funds
    guardian_name: guardian of the estate, when one is appointed
  triggers: []
- type: trust_authorization_signed
  target: trust_accounts
  mutation:
    transition:
      from: authorization_pending
      to: active
  meaning: The written authorization to hold funds is signed.
  grain: one row per transaction
  fields:
    authorization_date: date signed
  triggers: []
- type: trust_authorization_declined
  target: trust_accounts
  mutation:
    transition:
      from: authorization_pending
      to: declined
  meaning: The resident declines to deposit funds with the center.
  grain: one row per transaction
  fields:
    closed_date: date declined
  triggers: []
- type: trust_account_update
  target: trust_accounts
  mutation: update
  meaning: Medicaid status, payee appointment, guardianship or standing authorization on the account changes.
  grain: one row per transaction
  fields:
    variant_name: tier now in effect
    tier_effective_date: date the tier took effect
    standing_authorization: monthly bill the resident authorized the center to pay
    guardian_name: guardian of the estate
  triggers: []
- type: trust_conveyance_started
  target: trust_accounts
  mutation:
    transition:
      from: active
      to: conveyance_pending
  meaning: Discharge or death starts the conveyance of the account.
  grain: one row per transaction
  fields:
    conveyance_trigger_date: discharge date or date of death
    conveyance_reason: discharged or deceased
  triggers:
  - event: trust:trust_statement_issued
    map:
      statement_type: final_accounting
- type: trust_conveyance_completed
  target: trust_accounts
  mutation:
    transition:
      from: conveyance_pending
      to: closed
  meaning: The account is closed after conveyance.
  grain: one row per transaction
  fields:
    closed_date: closing date
  triggers: []
- type: trust_resident_closed
  target: trust_accounts
  mutation:
    transition:
      from: active
      to: closed
  meaning: A resident who stays closes the account.
  grain: one row per transaction
  fields:
    closed_date: closing date
  triggers: []
- type: trust_deposit
  target: trust_ledger
  meaning: Money is deposited to the account.
  grain: one row per deposit receipt
  distinguish_by:
  - entry_date
  - deposit_source
  - amount
  fields:
    deposit_source: resident_cash, family_check, ssa_benefit_as_payee, pension_direct_deposit or refund_from_center
    amount: deposit (positive)
    entry_date: date received
    available_date: date the deposit can be withdrawn
  account: resident_funds
  direction: in
  triggers: []
- type: trust_interest_credit
  target: trust_ledger
  meaning: A month's interest on the pooled account is credited.
  grain: one row per account and month
  distinguish_by:
  - interest_month
  fields:
    interest_month: YYYY-MM
    average_daily_balance: average daily balance for the month
    day_count: days in the month
    annual_rate_pct: rate in effect
    amount: interest (positive)
    entry_date: last day of the month
  account: resident_funds
  direction: in
  triggers: []
- type: trust_withdrawal
  target: trust_ledger
  meaning: Money is paid out to or for the resident on a written request.
  grain: one row per withdrawal request paid
  distinguish_by:
  - trust_request_id
  fields:
    trust_request_id: written request paid
    withdrawal_method: petty_cash or check
    purpose_category: spending purpose
    amount: withdrawal (positive)
    entry_date: date paid
  account: resident_funds
  direction: out
  triggers: []
- type: trust_bill_transfer
  target: trust_ledger
  meaning: Money is transferred to pay one center charge.
  grain: one row per center charge paid
  distinguish_by:
  - bill_category
  - bill_entry_id
  fields:
    bill_category: medicaid_patient_pay, private_room_board, bed_hold, ancillary_charge or medicare_coinsurance
    bill_entry_id: the charge on the center's billing record
    trust_request_id: standing or per-bill authorization relied on; empty for a payee application of benefits
    amount: transfer (positive)
    entry_date: date transferred
  account: resident_funds
  direction: out
  triggers: []
- type: trust_reversal
  target: trust_ledger
  meaning: A withdrawal or transfer found improper is returned to the account.
  grain: one row per original entry and reason
  distinguish_by:
  - withdrawal_entry_id
  - reversal_reason
  fields:
    withdrawal_entry_id: withdrawal or transfer returned
    reversal_reason: payer_covered_item, unauthorized, duplicate or amount_error
    amount: amount returned (positive)
    entry_date: date returned
  account: resident_funds
  direction: in
  triggers: []
- type: trust_conveyance
  target: trust_ledger
  meaning: Remaining funds are conveyed after discharge or death.
  grain: one row per conveyance check
  distinguish_by:
  - entry_date
  - conveyance_payee
  fields:
    conveyance_payee: resident, legal_representative or estate
    amount: amount conveyed (positive)
    entry_date: date conveyed
  account: resident_funds
  direction: out
  triggers: []
- type: trust_statement_issued
  target: trust_ledger
  meaning: An account statement or final accounting is issued.
  grain: one row per statement
  distinguish_by:
  - statement_type
  - statement_quarter
  - entry_date
  fields:
    statement_type: quarterly, on_request or final_accounting
    statement_quarter: YYYY-Qn for a quarterly statement
    entry_date: issue date
  triggers: []
- type: trust_resource_notice
  target: trust_ledger
  meaning: A Medicaid resident is notified that the balance has reached the resource notice level.
  grain: one row per notice
  distinguish_by:
  - entry_date
  fields:
    amount: balance on the notice date
    entry_date: date sent
  triggers: []
measures:
- id: trust_msr_available_balance
  window: as of the payment date
  measure: account balance minus trust_deposit amounts whose available_date is after the payment date
- id: trust_msr_bill_open_balance
  window: as of the transfer date
  measure: open balance of the named center charge on its own billing record (charge amount less payments and credits
    naming it)
policies:
- id: trust_agg_multi_holding
  subject:
  - trust_account_open
  rule: A resident has at most one resident funds account that is not closed or declined; a resident readmitted
    after an earlier account was closed authorizes a new one. A new account is set up only when the resident has
    no other account that is authorization_pending, active or conveyance_pending.
  eligibility:
  - id: one_account
    applies_to:
    - trust_account_open
    kind: dedup
    condition: A new account is set up only when the resident has no other account that is authorization_pending,
      active or conveyance_pending.
    evidence_fields:
    - trust_accounts.customer_id
    - trust_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trust_accounts.customer_id
      action_bindings:
        trust_accounts.customer_id: customer_id
    dedup_contract:
      table: trust_accounts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - authorization_pending
        - active
        - conveyance_pending
      distinct_fields: []
  params:
    max_per_customer: 1
- id: trust_opening_authorization
  subject:
  - trust_authorization_signed
  - trust_authorization_declined
  - trust_account_open
  rule: 'The center holds a resident''s money only on the written authorization of the resident or legal representative,
    and depositing funds with the center can never be required as a condition of admission; a resident may decline
    and manage money personally. The tier follows the records: a Medicaid resident is one whose Medical Assistance
    case is eligible, the representative payee tiers apply while the center is the resident''s SSA representative
    payee, and the guardianship tiers apply while a court-appointed guardian of the estate is on file. Funds are
    kept apart from the center''s operating accounts, and no fee is ever charged for holding or managing them.'
  eligibility: []
  params:
    per_tier:
      Resident Funds Account, Medicaid Self-Directed:
        withdrawal_authorized_by: =withdrawal_authorized_by
      Resident Funds Account, Medicaid Representative Payee:
        withdrawal_authorized_by: =withdrawal_authorized_by
      Resident Funds Account, Medicaid Guardianship:
        withdrawal_authorized_by: =withdrawal_authorized_by
      Resident Funds Account, Non-Medicaid Self-Directed:
        withdrawal_authorized_by: =withdrawal_authorized_by
      Resident Funds Account, Non-Medicaid Representative Payee:
        withdrawal_authorized_by: =withdrawal_authorized_by
      Resident Funds Account, Non-Medicaid Guardianship:
        withdrawal_authorized_by: =withdrawal_authorized_by
    written_authorization_required: =written_authorization_required
    deposit_condition_of_admission: =deposit_condition_of_admission
    interest_bearing_account_separate: =interest_bearing_account_separate
    trust_management_fee_allowed: =trust_management_fee_allowed
- id: trust_evt_deposits
  subject:
  - trust_deposit
  rule: Deposits are accepted from the listed sources. A deposited personal check becomes available for withdrawal
    after the check deposit hold business days, counting Monday through Friday and excluding bank holidays; cash,
    direct deposits and benefits are available on the day posted. Benefits the center receives as representative
    payee are posted within the benefit posting business days and are applied first to the resident's current maintenance
    and then saved in the account. A deposit is posted only while the account is active.
  eligibility:
  - id: active_only
    applies_to:
    - trust_deposit
    kind: state
    condition: A deposit is posted only while the account is active.
    evidence_fields:
    - trust_accounts.trust_account_id
    - trust_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trust_accounts.trust_account_id
      action_bindings:
        trust_accounts.trust_account_id: trust_account_id
    state_contract:
      field: trust_accounts.status
      allowed:
      - active
  params:
    per_tier:
      Resident Funds Account, Medicaid Self-Directed:
        center_is_representative_payee: =center_is_representative_payee
        payee_current_needs_first: =payee_current_needs_first
      Resident Funds Account, Medicaid Representative Payee:
        center_is_representative_payee: =center_is_representative_payee
        payee_current_needs_first: =payee_current_needs_first
      Resident Funds Account, Medicaid Guardianship:
        center_is_representative_payee: =center_is_representative_payee
        payee_current_needs_first: =payee_current_needs_first
      Resident Funds Account, Non-Medicaid Self-Directed:
        center_is_representative_payee: =center_is_representative_payee
        payee_current_needs_first: =payee_current_needs_first
      Resident Funds Account, Non-Medicaid Representative Payee:
        center_is_representative_payee: =center_is_representative_payee
        payee_current_needs_first: =payee_current_needs_first
      Resident Funds Account, Non-Medicaid Guardianship:
        center_is_representative_payee: =center_is_representative_payee
        payee_current_needs_first: =payee_current_needs_first
    accepted_deposit_sources: =accepted_deposit_sources
    check_deposit_hold_business_days: =check_deposit_hold_business_days
    benefit_posting_business_days: =benefit_posting_business_days
- id: trust_evt_interest
  subject:
  - trust_interest_credit
  rule: Funds above the tier's interest-bearing threshold earn interest in the pooled account and the interest belongs
    to the resident. Each month's credit is the month's average daily balance above the threshold times the annual
    rate in effect for the month, times the days in the month over 365, rounded half up to the cent and posted on
    the last day of the month; a month whose credit rounds below the minimum posts nothing. The threshold of the
    tier in effect on the last day of the month applies, so a resident whose Medicaid eligibility began during the
    month earns interest above the Medicaid threshold for that whole month. A month is credited once.
  eligibility:
  - id: credit_once
    applies_to:
    - trust_interest_credit
    kind: dedup
    condition: A month is credited once.
    evidence_fields:
    - trust_ledger.trust_account_id
    - trust_ledger.interest_month
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trust_ledger.trust_account_id
      action_bindings:
        trust_ledger.trust_account_id: trust_account_id
    dedup_contract:
      table: trust_ledger
      mode: separate_record
      object_bindings:
        trust_account_id: trust_account_id
        interest_month: interest_month
      duplicate_filters:
        event_type:
        - trust_interest_credit
      distinct_fields: []
  params:
    per_tier:
      Resident Funds Account, Medicaid Self-Directed:
        interest_bearing_threshold_usd: =interest_bearing_threshold_usd
      Resident Funds Account, Medicaid Representative Payee:
        interest_bearing_threshold_usd: =interest_bearing_threshold_usd
      Resident Funds Account, Medicaid Guardianship:
        interest_bearing_threshold_usd: =interest_bearing_threshold_usd
      Resident Funds Account, Non-Medicaid Self-Directed:
        interest_bearing_threshold_usd: =interest_bearing_threshold_usd
      Resident Funds Account, Non-Medicaid Representative Payee:
        interest_bearing_threshold_usd: =interest_bearing_threshold_usd
      Resident Funds Account, Non-Medicaid Guardianship:
        interest_bearing_threshold_usd: =interest_bearing_threshold_usd
    interest_rate_schedule: =interest_rate_schedule
    interest_basis: =interest_basis
    interest_day_count: =interest_day_count
    interest_credit_cycle: =interest_credit_cycle
    interest_rounding: =interest_rounding
    interest_min_credit_usd: =interest_min_credit_usd
  formula:
    amount: round(max(0, average_daily_balance - interest_bearing_threshold_usd) * annual_rate_pct / 100 * day_count
      / 365, 2)
    when: amount >= interest_min_credit_usd
- id: trust_evt_withdrawals
  subject:
  - trust_withdrawal
  rule: 'Money leaves the account only on a written request signed by the person the tier names: the resident or
    an agent under power of attorney for self-directed accounts, the resident''s request honored by the center as
    payee for payee accounts, and the guardian for guardianship accounts. A withdrawal is paid only against a written
    request signed by the person the tier authorizes. A power of attorney authorizes nothing after the resident''s
    death. Cash up to the petty cash maximum is paid from petty cash during petty cash hours, and a larger amount
    is paid by check within the check withdrawal business days. A withdrawal never exceeds the available balance;
    a check deposit still on hold is not available. The person receiving cash signs a receipt.'
  eligibility:
  - id: signed_request
    applies_to:
    - trust_withdrawal
    kind: authorization
    condition: A withdrawal is paid only against a written request signed by the person the tier authorizes.
    evidence_fields:
    - trust_requests.trust_request_id
    - trust_requests.request_type
    - trust_requests.requested_by
    - trust_requests.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trust_requests.trust_request_id
      action_bindings:
        trust_requests.trust_request_id: trust_request_id
  - id: within_balance
    applies_to:
    - trust_withdrawal
    kind: authorization
    condition: A withdrawal never exceeds the available balance; a check deposit still on hold is not available.
    evidence_fields:
    - trust_accounts.trust_account_id
    - trust_accounts.account_balance
    - trust_ledger.available_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trust_accounts.trust_account_id
      action_bindings:
        trust_accounts.trust_account_id: trust_account_id
  params:
    per_tier:
      Resident Funds Account, Medicaid Self-Directed:
        withdrawal_authorized_by: =withdrawal_authorized_by
        guardian_authorization_required: =guardian_authorization_required
      Resident Funds Account, Medicaid Representative Payee:
        withdrawal_authorized_by: =withdrawal_authorized_by
        guardian_authorization_required: =guardian_authorization_required
      Resident Funds Account, Medicaid Guardianship:
        withdrawal_authorized_by: =withdrawal_authorized_by
        guardian_authorization_required: =guardian_authorization_required
      Resident Funds Account, Non-Medicaid Self-Directed:
        withdrawal_authorized_by: =withdrawal_authorized_by
        guardian_authorization_required: =guardian_authorization_required
      Resident Funds Account, Non-Medicaid Representative Payee:
        withdrawal_authorized_by: =withdrawal_authorized_by
        guardian_authorization_required: =guardian_authorization_required
      Resident Funds Account, Non-Medicaid Guardianship:
        withdrawal_authorized_by: =withdrawal_authorized_by
        guardian_authorization_required: =guardian_authorization_required
    petty_cash_max_per_withdrawal_usd: =petty_cash_max_per_withdrawal_usd
    petty_cash_hours: =petty_cash_hours
    check_withdrawal_business_days: =check_withdrawal_business_days
    poa_authority_ends_at_death: =poa_authority_ends_at_death
    overdraw_allowed: =overdraw_allowed
    withdrawal_receipt_signature_required: =withdrawal_receipt_signature_required
  measures:
  - trust_msr_available_balance
- id: trust_evt_bill_transfers
  subject:
  - trust_bill_transfer
  rule: 'Money moves from the account to a center charge only with the resident''s written authority: a standing
    authorization covers the monthly bill it names (Medicaid patient pay or private room and board) every month,
    while a bed-hold, ancillary or Medicare coinsurance charge needs a per-bill authorization naming that charge.
    A bill transfer is made only under a standing authorization covering its bill category or a per-bill authorization
    naming the charge. For a representative payee account, benefits are applied to the tier''s monthly bill without
    a monthly request, and for a Medicaid payee account the personal needs allowance stays in the account. A transfer
    pays at most the open balance of the named charge and never exceeds the available balance. Nothing Medicare
    or Medicaid pays for is ever paid from the account, and an optional item or service is paid only when the resident
    or representative asked for it.'
  eligibility:
  - id: authorized_transfer
    applies_to:
    - trust_bill_transfer
    kind: authorization
    condition: A bill transfer is made only under a standing authorization covering its bill category or a per-bill
      authorization naming the charge.
    evidence_fields:
    - trust_accounts.trust_account_id
    - trust_accounts.standing_authorization
    - trust_requests.request_type
    - trust_requests.bill_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trust_accounts.trust_account_id
      action_bindings:
        trust_accounts.trust_account_id: trust_account_id
  params:
    per_tier:
      Resident Funds Account, Medicaid Self-Directed:
        payee_monthly_bill_applied: =payee_monthly_bill_applied
        medicaid_pna_retained: =medicaid_pna_retained
        payee_transfer_requires_resident_request: =payee_transfer_requires_resident_request
      Resident Funds Account, Medicaid Representative Payee:
        payee_monthly_bill_applied: =payee_monthly_bill_applied
        medicaid_pna_retained: =medicaid_pna_retained
        payee_transfer_requires_resident_request: =payee_transfer_requires_resident_request
      Resident Funds Account, Medicaid Guardianship:
        payee_monthly_bill_applied: =payee_monthly_bill_applied
        medicaid_pna_retained: =medicaid_pna_retained
        payee_transfer_requires_resident_request: =payee_transfer_requires_resident_request
      Resident Funds Account, Non-Medicaid Self-Directed:
        payee_monthly_bill_applied: =payee_monthly_bill_applied
        medicaid_pna_retained: =medicaid_pna_retained
        payee_transfer_requires_resident_request: =payee_transfer_requires_resident_request
      Resident Funds Account, Non-Medicaid Representative Payee:
        payee_monthly_bill_applied: =payee_monthly_bill_applied
        medicaid_pna_retained: =medicaid_pna_retained
        payee_transfer_requires_resident_request: =payee_transfer_requires_resident_request
      Resident Funds Account, Non-Medicaid Guardianship:
        payee_monthly_bill_applied: =payee_monthly_bill_applied
        medicaid_pna_retained: =medicaid_pna_retained
        payee_transfer_requires_resident_request: =payee_transfer_requires_resident_request
    standing_authorization_allowed_for: =standing_authorization_allowed_for
    per_bill_authorization_required_for: =per_bill_authorization_required_for
    transfer_cap_basis: =transfer_cap_basis
    charge_for_payer_covered_items: =charge_for_payer_covered_items
    allowable_charge_categories: =allowable_charge_categories
    resident_request_required_for_optional_items: =resident_request_required_for_optional_items
  formula:
    transfer_amount: min(amount, trust_msr_bill_open_balance, trust_msr_available_balance)
  measures:
  - trust_msr_bill_open_balance
  - trust_msr_available_balance
- id: trust_evt_reversals
  subject:
  - trust_reversal
  rule: A withdrawal or transfer that paid for something Medicare or Medicaid covers, that lacked the required authorization,
    that duplicated an earlier entry or that was for the wrong amount is returned to the account within the improper
    charge reversal business days, for the improper part only, naming the original entry. An entry is returned once
    per reason.
  eligibility:
  - id: return_once
    applies_to:
    - trust_reversal
    kind: dedup
    condition: An entry is returned once per reason.
    evidence_fields:
    - trust_ledger.withdrawal_entry_id
    - trust_ledger.reversal_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trust_ledger.withdrawal_entry_id
      action_bindings:
        trust_ledger.withdrawal_entry_id: withdrawal_entry_id
    dedup_contract:
      table: trust_ledger
      mode: separate_record
      object_bindings:
        withdrawal_entry_id: withdrawal_entry_id
        reversal_reason: reversal_reason
      duplicate_filters:
        event_type:
        - trust_reversal
      distinct_fields: []
  params:
    improper_charge_reversal_business_days: =improper_charge_reversal_business_days
    charge_for_payer_covered_items: =charge_for_payer_covered_items
- id: trust_evt_statements_notices
  subject:
  - trust_statement_issued
  - trust_resource_notice
  rule: A statement for each calendar quarter issues to the resident and representative within the statement days
    after the quarter ends, and a statement asked for in between is provided within the on-request business days.
    A final accounting issues when conveyance starts. A Medicaid resident is notified in writing when the account
    balance reaches the SSI resource limit less the notice margin, and told that a balance above the resource limit
    can end Medicaid eligibility; a further notice is sent only after the balance has fallen below that level and
    reached it again. Non-Medicaid tiers receive no resource notice.
  eligibility: []
  params:
    per_tier:
      Resident Funds Account, Medicaid Self-Directed:
        resource_notice_applies: =resource_notice_applies
      Resident Funds Account, Medicaid Representative Payee:
        resource_notice_applies: =resource_notice_applies
      Resident Funds Account, Medicaid Guardianship:
        resource_notice_applies: =resource_notice_applies
      Resident Funds Account, Non-Medicaid Self-Directed:
        resource_notice_applies: =resource_notice_applies
      Resident Funds Account, Non-Medicaid Representative Payee:
        resource_notice_applies: =resource_notice_applies
      Resident Funds Account, Non-Medicaid Guardianship:
        resource_notice_applies: =resource_notice_applies
    ssi_resource_limit_usd: =ssi_resource_limit_usd
    resource_notice_margin_usd: =resource_notice_margin_usd
    statement_frequency: =statement_frequency
    statement_days_after_quarter_end: =statement_days_after_quarter_end
    statement_on_request_business_days: =statement_on_request_business_days
    statement_recipients: =statement_recipients
  formula:
    notice_level: ssi_resource_limit_usd - resource_notice_margin_usd
- id: trust_conveyance_rules
  subject:
  - trust_conveyance_started
  - trust_conveyance
  - trust_conveyance_completed
  - trust_resident_closed
  rule: 'When the resident is discharged or dies, the remaining funds and a final accounting are conveyed within
    the conveyance days: on discharge to the resident or legal representative, and after a death to the estate,
    through the personal representative holding letters from the Register of Wills; a power of attorney gives no
    authority after death. A resident who stays may withdraw everything and close the account at any time. An account
    is closed only when its balance is zero.'
  eligibility:
  - id: zero_to_close
    applies_to:
    - trust_conveyance_completed
    - trust_resident_closed
    kind: authorization
    condition: An account is closed only when its balance is zero.
    evidence_fields:
    - trust_accounts.trust_account_id
    - trust_accounts.account_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trust_accounts.trust_account_id
      action_bindings:
        trust_accounts.trust_account_id: trust_account_id
  params:
    conveyance_days: =conveyance_days
    conveyance_payee_on_discharge: =conveyance_payee_on_discharge
    conveyance_payee_on_death: =conveyance_payee_on_death
    poa_authority_ends_at_death: =poa_authority_ends_at_death
    conveyance_method: =conveyance_method
    resident_may_close_account: =resident_may_close_account
- id: trust_account_changes
  subject:
  - trust_account_update
  rule: 'The tier changes when the records change: Medicaid eligibility moves the account to the matching Medicaid
    tier from the eligibility start date, the end of eligibility moves it back, an SSA payee appointment or a guardianship
    order moves it to the payee or guardianship tier from the date of appointment or order, and a revoked payee
    appointment or discharged guardianship moves it back to self-directed. The tier effective date records when
    the change applies. A standing authorization is recorded only from the written authorization the resident or
    legal representative signed, and the guardian''s name is recorded exactly as in the court order.'
  eligibility: []
  params:
    per_tier:
      Resident Funds Account, Medicaid Self-Directed:
        guardian_court_report_annual: =guardian_court_report_annual
        payee_annual_accounting: =payee_annual_accounting
        center_is_representative_payee: =center_is_representative_payee
      Resident Funds Account, Medicaid Representative Payee:
        guardian_court_report_annual: =guardian_court_report_annual
        payee_annual_accounting: =payee_annual_accounting
        center_is_representative_payee: =center_is_representative_payee
      Resident Funds Account, Medicaid Guardianship:
        guardian_court_report_annual: =guardian_court_report_annual
        payee_annual_accounting: =payee_annual_accounting
        center_is_representative_payee: =center_is_representative_payee
      Resident Funds Account, Non-Medicaid Self-Directed:
        guardian_court_report_annual: =guardian_court_report_annual
        payee_annual_accounting: =payee_annual_accounting
        center_is_representative_payee: =center_is_representative_payee
      Resident Funds Account, Non-Medicaid Representative Payee:
        guardian_court_report_annual: =guardian_court_report_annual
        payee_annual_accounting: =payee_annual_accounting
        center_is_representative_payee: =center_is_representative_payee
      Resident Funds Account, Non-Medicaid Guardianship:
        guardian_court_report_annual: =guardian_court_report_annual
        payee_annual_accounting: =payee_annual_accounting
        center_is_representative_payee: =center_is_representative_payee
extended_policies:
- id: trust_ext_covered_service_return
  base_policy_refs:
  - trust_evt_reversals
  overwrite: []
  trigger: state_due
  subject:
  - trust_reversal
  computes: amount
  target_tool: return_improper_transfer_e2970e4f
  params: {}
  rule: 'When the resident''s payer covers an item or service on the ancillary account that a transfer from this account paid, the improper part of that transfer is returned to the account with the reason payer-covered item, naming the transfer, within the improper charge reversal business days. The transfer returned is the most recent transfer to an ancillary charge, and the charge it named is the charge the return is figured on; of two such transfers on the same date, the one recorded first is taken. The return for a covered service is figured in this order: the improper part of the charge is the charge times its covered days over its charged days; the refundable part is the improper part of the charge less the charge''s unpaid balance, never below zero; the refundable part is then shared between the transfer and the charge''s other payments in the refund order; and the return is the transfer''s portion, never more than the transfer''s paid part and never below zero, rounded half up to the cent once, on the final amount only. A recurring service charge''s charged days are the days it bills, counted from its first billed day; a one-time item charge is one charged day, dated on its service date. The covered days are the charged days counted from the payer''s start where the resident has a payer, and none where no Part A episode is active and no Medical Assistance case is eligible, because then no payer covers the charge. The charge''s unpaid balance is the charge less the payments naming it and less the credits counted against it, never below zero. The charge''s other payments are the payments naming it by check, ACH or card. Under the standard method the days counted from the payer''s start are every charged day, every credit naming the charge is counted against it, the transfer''s paid part is the whole transfer, and the refund order gives the transfer the whole refundable part. The days counted from the payer''s start follow the resident''s payer: where a Medicare Part A episode is active, they are the charged days on or after the episode''s coverage start date; where no Part A episode is active and the Medical Assistance case is eligible, they are the charged days on or after the eligibility start date; where the resident has neither payer, they are every charged day, and the covered days below are then none. A one-time item counts its one day only when its service date falls on or after that start. The credits counted against the charge follow the ancillary account''s tier, because a credit for the coverage of the payer that tier follows records the improper part this return gives back, while a credit for another payer''s coverage settled the charge for days that payer covered, like any other credit: in the consolidated billing tier, every credit naming the charge except a credit for a consolidated billing item; in the Medical Assistance, Part B or Medicare Advantage tier, every credit naming the charge except a credit for a payer-covered item; in the hospice tier, every credit naming the charge except a credit for a hospice-related item; in any other tier, every credit naming the charge. The transfer''s paid part follows how the transfer reached the charge: where the ancillary ledger carries a payment by trust transfer naming the charge on the transfer''s date, that payment, never more than the transfer less the wrong-amount returns already made from it, because the ancillary account applies a payment only up to the charge''s open balance; where it carries none and a per-bill authorization names the charge, the amount the most recent such authorization states, because a transfer pays no more than its authorization and any excess is returned as a wrong amount; otherwise the whole transfer. A transfer already returned for lacking authorization or as a duplicate has no paid part left to return. The refund order follows when the charge''s other payments were made: where a payment other than the transfer named the charge on a later date than the transfer, the other payments are refunded first and the transfer''s portion is what remains of the refundable part after them; where another payment named the charge on the transfer''s own date, the transfer''s portion is the refundable part times the transfer''s paid part over the paid part plus the other payments; otherwise the transfer''s portion is the whole refundable part.'
  prerequisite: []
  cross_category:
  - category: medicare
    as: branch
    reads:
    - status
