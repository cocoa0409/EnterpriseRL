  baseline:
    rule: 'The transfer returned is the most recent transfer to a bed-hold charge (of two on the same date, the one recorded first), and the charge it named is the charge the return is figured on. The return for a bed-hold overcharge is figured in this order: the nights due are the charge''s nights from the hold''s first chargeable night through the hold''s last held day; the amount due is each night due at the nightly rate due for that night; the excess is the charge less the amount due, never below zero; the excess is then shared between the transfer and the charge''s other payments in the bed-hold refund order; and the return is the transfer''s portion, never more than the transfer and never below zero, rounded half up to the cent once, on the final amount only. Where a bed-hold charge agreement prices the charge — the single resident-private entry of a Private Pay Hospital Leave hold whose leave has ended; the opening entry of a Medicaid Hospital Leave Reserved Bed hold carrying more than one resident-private entry, or its closing entry once the leave has ended; the opening or the closing entry of a released Private Pay Therapeutic Leave hold carrying more than one resident-private entry — the hold''s own rules are that agreement, whose priced figure is the charge posted on the entry, so the amount due is the charge itself. The hold''s first chargeable night is the latest of the charge''s first night, the first night the notice rule allows and the private hold start date the bed-hold office recorded on the reservation, because a later election holds the bed only from the day of election. The hold''s last held day is the end date recorded on the reservation where it falls inside the charge''s nights, because a returned, released or expired hold records its last held day as its end date; otherwise it is the charge''s last night. The nightly rate due for a night is the private daily rate that the rate schedule applying to that night sets for the room tier priced; where no room tier can be priced, the charge''s own daily rate is the nightly rate due. The charge''s other payments are the payments naming it less the transfers from this account naming it. Under the standard method the notice rule allows every night the charge bills, the room tier priced is the room tier of the resident''s private-pay agreement, every night is priced at the schedule in effect on the date the charge was billed (the charge''s own daily rate where it was billed before 2025-07-01), and the bed-hold refund order gives the transfer the whole excess.'
    params:
    - semi_private_rate_2025
    - semi_private_rate_2026
    - private_rate_2025
    - private_rate_2026
  inputs:
    history:
    - table: trust_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: trust_bill_transfer
        bill_category: bed_hold
    - category: bedhold
      table: bedhold_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: bedhold_payment
    cross_category:
    - bedhold
    - private
- id: trust_ext_coinsurance_return
  base_policy_refs:
  - trust_evt_reversals
  overwrite: []
  trigger: state_due
  subject:
  - trust_reversal
  computes: amount
  target_tool: return_coinsurance_overcharge_2cf6d12d
  params:
    plan_k_share_pct: 50
    plan_l_share_pct: 25
    whole_coinsurance_pct: 100
    daily_coinsurance_2025: 209.5
    daily_coinsurance_2026: 217.0
  rule: 'When a transfer from this account paid a resident coinsurance charge in full and the charge billed more coinsurance than the resident owes for the block it priced, the coverage office can no longer reduce that charge, so the part of the transfer that paid the excess is returned to the account with the reason wrong amount, naming the transfer, within the improper charge reversal business days. The transfer returned is the most recent transfer to a Medicare coinsurance charge (of two on the same date, the one recorded first), and the charge it named, with the block of booked days that charge priced, is what the return is figured on. The return for a coinsurance overcharge is figured in this order: the block''s owed days are the block''s days through its covered end, less the days the coverage office has reversed on the block as leave-of-absence or hospital days, less the days it has reversed as booking errors that fall on or before the covered end, and less the block''s center-borne days, never below zero; the coinsurance owed is the daily coinsurance rate due times the owed days, each owed day at the share the block''s supplemental coverage sets for it, over one hundred; the excess is the charge less the coinsurance owed, never below zero; the excess is then shared between the transfer and the charge''s other payments in the refund order; and the return is the transfer''s portion, never more than the transfer''s paid part and never below zero, rounded half up to the cent once, on the final amount only. Where the coverage office has reversed more than one stretch of the block as booking errors, the owed days are instead the block''s days less every day reversed on it for any reason, never more than its days through the covered end, because its own reversals then settle the block. The charge''s other payments are the payments naming it less the payment the transfer made on the Medicare ledger. A transfer from this account posts on the Medicare ledger on the transfer''s date as an ACH payment naming the charge, the coverage office''s list of payment methods naming no other method for it. Under the standard method no day is center-borne, every owed day is at the whole coinsurance, the daily coinsurance rate due is the charge''s own daily rate, the transfer''s paid part is the whole transfer, and the refund order gives the transfer the whole excess. The block''s covered end follows how the episode ended: where the episode ended because the Quality Improvement Organization upheld its notice, the owed days run through the later of the last covered date and the organization''s decision date; where the episode carries any other last covered date, they run through that last covered date, never past the block''s last day; where it carries none, every day the charge priced runs to the covered end. The block''s center-borne days follow the episode''s certifications, because days after a lapsed certification are provider liable and never billed to the resident: where the coverage office has reversed days of the block as uncertified days, those days; where no certification is recorded on the episode after its coverage start date and the initial recertification day has passed, the block''s days after that day, through the covered end; otherwise none. The share the block''s supplemental coverage sets follows the coverage recorded on the episode: Medigap Plan K with no QMB status, the Plan K resident share; Medigap Plan L with no QMB status, the Plan L resident share; a full-coinsurance Medigap plan (C, D, F, G, M or N) or QMB status, nothing; otherwise the whole coinsurance. Which owed days take that share follows the date the coverage took effect: where it took effect on or before the block''s first day, every owed day; where it took effect after the block''s first day and on or before its last day, the days the coverage office charged the secondary party for on the block, the block''s other owed days keeping the whole coinsurance, because days before the supplemental effective date keep the earlier split; otherwise none, every owed day keeping the whole coinsurance. The daily coinsurance rate due follows the calendar year of the block''s days of service: for a block in 2026, the 2026 daily coinsurance rate; for a block in 2025, the 2025 daily coinsurance rate; otherwise the charge''s own daily rate. The transfer''s paid part follows how the transfer reached the charge: where the Medicare ledger carries an ACH payment naming the charge on the transfer''s date (of two that day, the one recorded first), that payment, never more than the transfer, because the coverage office applies a payment only up to the charge''s open balance and returns any remainder to the payer; where it carries none and a per-bill authorization names the charge, the amount the most recent such authorization states; otherwise the whole transfer. The refund order follows when the charge''s other payments were made: where a payment other than the transfer named the charge on a later date than the transfer, the other payments are refunded first and the transfer''s portion is what remains of the excess after them; where another payment named the charge on the transfer''s own date, the transfer''s portion is the excess times the transfer''s paid part over the paid part plus the other payments; otherwise the transfer''s portion is the whole excess.'
  prerequisite: []
  cross_category:
  - category: medicare
    as: history
    reads:
    - last_covered_date
    - end_reason
    - qio_decision_date
    - medigap_plan_letter
    - qmb_status
    - supplemental_effective_date
    - medicare_ledger.amount
    - medicare_ledger.day_count
    - medicare_ledger.daily_coinsurance_rate
    - medicare_ledger.from_date
    - medicare_ledger.to_date
    - medicare_ledger.entry_date
    - medicare_ledger.adjustment_reason
    - medicare_ledger.liable_party
    - coverage_start_date
    - last_certification_date
    - medicare_ledger.payment_method
    note: The named charge, the block it priced, the days reversed on it, the episode's supplemental coverage and the charge's payments decide what the resident owed.
  compute:
  - xfer_id: LATEST('trust_ledger','trust_entry_id', date_field='entry_date', event_type='trust_bill_transfer', bill_category='medicare_coinsurance')
  - xfer_amount: SUM('trust_ledger','amount', event_type='trust_bill_transfer', trust_entry_id=xfer_id)
  - xfer_date: LATEST('trust_ledger','entry_date', date_field='entry_date', event_type='trust_bill_transfer', bill_category='medicare_coinsurance')
  - charge_id: LATEST('trust_ledger','bill_entry_id', date_field='entry_date', event_type='trust_bill_transfer', bill_category='medicare_coinsurance')
  - charge_amount: XLATEST('medicare','medicare_ledger','amount', date_field='entry_date', medicare_entry_id=charge_id) or 0
  - charge_days: XLATEST('medicare','medicare_ledger','day_count', date_field='entry_date', medicare_entry_id=charge_id) or 0
  - charge_rate: XLATEST('medicare','medicare_ledger','daily_coinsurance_rate', date_field='entry_date', medicare_entry_id=charge_id) or 0
  - block_id: XLATEST('medicare','medicare_ledger','days_entry_id', date_field='entry_date', medicare_entry_id=charge_id)
  - episode_id: XLATEST('medicare','medicare_ledger','medicare_coverage_id', date_field='entry_date', medicare_entry_id=charge_id)
  - block_from: XLATEST('medicare','medicare_ledger','from_date', date_field='entry_date', medicare_entry_id=block_id)
  - block_to: XLATEST('medicare','medicare_ledger','to_date', date_field='entry_date', medicare_entry_id=block_id)
  - cover_last: CFIELD('medicare','last_covered_date', medicare_coverage_id=episode_id)
  - end_why: CFIELD('medicare','end_reason', medicare_coverage_id=episode_id)
  - qio_on: CFIELD('medicare','qio_decision_date', medicare_coverage_id=episode_id)
  - covered_through: (MX(cover_last or '', qio_on or '') if end_why == 'qio_upheld' else (cover_last if cover_last else block_to))
  - days_to_end: (MX(0, MN(charge_days, DAYS(block_from, covered_through) + 1)) if (covered_through and block_from) else charge_days)
  - reversed_off: XSUM('medicare','medicare_ledger','day_count', event_type='medicare_days_reversed', days_entry_id=block_id, adjustment_reason='leave_of_absence_day') + XSUM('medicare','medicare_ledger','day_count', event_type='medicare_days_reversed', days_entry_id=block_id, adjustment_reason='hospital_day')
  - bk_n: XCOUNT('medicare','medicare_ledger', event_type='medicare_days_reversed', days_entry_id=block_id, adjustment_reason='booking_error')
  - bk_from: XLATEST('medicare','medicare_ledger','from_date', date_field='entry_date', event_type='medicare_days_reversed', days_entry_id=block_id, adjustment_reason='booking_error') or ''
  - bk_to: XLATEST('medicare','medicare_ledger','to_date', date_field='entry_date', event_type='medicare_days_reversed', days_entry_id=block_id, adjustment_reason='booking_error') or ''
  - all_reversed: XSUM('medicare','medicare_ledger','day_count', event_type='medicare_days_reversed', days_entry_id=block_id)
  - cov_start: CFIELD('medicare','coverage_start_date', medicare_coverage_id=episode_id)
  - last_cert: CFIELD('medicare','last_certification_date', medicare_coverage_id=episode_id) or ''
  - recert_day: CPARAM('medicare','initial_recertification_day', medicare_coverage_id=episode_id) or 0
  - unc_read: (XSUM('medicare','medicare_ledger','day_count', event_type='medicare_days_reversed', days_entry_id=block_id, adjustment_reason='uncertified_day') if XCOUNT('medicare','medicare_ledger', event_type='medicare_days_reversed', days_entry_id=block_id, adjustment_reason='uncertified_day') > 0 else 0)
  - lapse_off: (DAYS(block_from, cov_start) + recert_day if (unc_read == 0 and cov_start and block_from and (not last_cert or last_cert <= cov_start) and DAYS(cov_start, NOW) >= recert_day) else 100000)
  - center_days: unc_read + MX(0, days_to_end - MX(0, lapse_off))
  - owed_days: (MX(0, MN(days_to_end, charge_days - all_reversed)) if bk_n > 1 else MX(0, days_to_end - reversed_off - center_days - ((MX(0, DAYS(MX(bk_from, block_from), MN(bk_to, covered_through)) + 1)) if (bk_n == 1 and bk_from and bk_to and covered_through and block_from) else 0)))
  - plan_letter: CFIELD('medicare','medigap_plan_letter', medicare_coverage_id=episode_id) or ''
  - qmb_on_file: CFIELD('medicare','qmb_status', medicare_coverage_id=episode_id)
  - plan_eff: CFIELD('medicare','supplemental_effective_date', medicare_coverage_id=episode_id) or ''
  - sec_days: (XLATEST('medicare','medicare_ledger','day_count', date_field='entry_date', event_type='medicare_coinsurance_charge', days_entry_id=block_id, liable_party='medigap_carrier') or XLATEST('medicare','medicare_ledger','day_count', date_field='entry_date', event_type='medicare_coinsurance_charge', days_entry_id=block_id, liable_party='medicaid_crossover') or 0)
  - plan_pct: (K('plan_k_share_pct') if (plan_letter == 'K' and not qmb_on_file) else (K('plan_l_share_pct') if (plan_letter == 'L' and not qmb_on_file) else (0 if (qmb_on_file or plan_letter == 'C' or plan_letter == 'D' or plan_letter == 'F' or plan_letter == 'G' or plan_letter == 'M' or plan_letter == 'N') else K('whole_coinsurance_pct'))))
  - share_days: (charge_days if (plan_eff and block_from and plan_eff <= block_from) else (sec_days if (plan_eff and block_from and block_to and plan_eff > block_from and plan_eff <= block_to) else 0))
  - share_pct: (plan_pct if share_days > 0 else K('whole_coinsurance_pct'))
  - weighted_days: MX(0, owed_days - MN(owed_days, share_days)) * K('whole_coinsurance_pct') + MN(owed_days, share_days) * share_pct
  - service_from: XLATEST('medicare','medicare_ledger','from_date', date_field='entry_date', medicare_entry_id=block_id)
  - rate_due: (K('daily_coinsurance_2026') if (service_from and service_from >= '2026-01-01' and service_from < '2027-01-01') else (K('daily_coinsurance_2025') if (service_from and service_from >= '2025-01-01' and service_from < '2026-01-01') else charge_rate))
  - coinsurance_owed: rate_due * weighted_days / 100
  - excess: MX(0, charge_amount - coinsurance_owed)
  - pay_last: XLATEST('medicare','medicare_ledger','entry_date', date_field='entry_date', event_type='medicare_coinsurance_payment', charge_entry_id=charge_id)
  - applied_pay: XLATEST('medicare','medicare_ledger','amount', date_field='entry_date', event_type='medicare_coinsurance_payment', charge_entry_id=charge_id, payment_method='ach', entry_date=xfer_date) or 0
  - applied_n: XCOUNT('medicare','medicare_ledger', event_type='medicare_coinsurance_payment', charge_entry_id=charge_id, payment_method='ach', entry_date=xfer_date)
  - auth_amt: LATEST('trust_requests','amount', date_field='created_at', request_type='bill_payment_authorization', bill_category='medicare_coinsurance', bill_entry_id=charge_id) or 0
  - auth_n: COUNT('trust_requests', request_type='bill_payment_authorization', bill_category='medicare_coinsurance', bill_entry_id=charge_id)
  - paid_by: (MN(applied_pay, xfer_amount) if applied_n > 0 else (auth_amt if auth_n > 0 else xfer_amount))
  - other_paid: MX(0, XSUM('medicare','medicare_ledger','amount', event_type='medicare_coinsurance_payment', charge_entry_id=charge_id) - applied_pay)
  - same_day_other: XSUM('medicare','medicare_ledger','amount', event_type='medicare_coinsurance_payment', charge_entry_id=charge_id, entry_date=xfer_date) - applied_pay
  - refund_mode: ('others_first' if (pay_last and xfer_date and pay_last > xfer_date) else ('pro_rata' if same_day_other > 0 else 'transfer_first'))
  - portion: (MX(0, excess - other_paid) if refund_mode == 'others_first' else ((excess * paid_by / (paid_by + other_paid)) if (refund_mode == 'pro_rata' and paid_by + other_paid > 0) else excess))
  - result: RND(MX(0, MN(paid_by, portion)) + 0.000000001, 2)
