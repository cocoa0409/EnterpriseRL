  - notice_from: (notice_on if (notice_on and departed_on and notice_on > departed_on) else ('9999-12-31' if not notice_on else (departed_on or charge_from)))
  - private_from: CFIELD('bedhold','private_hold_start_date', bedhold_reservation_id=res_id) or ''
  - start_on: MX(charge_from or '', notice_from or '', private_from)
