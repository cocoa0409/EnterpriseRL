  rule: 'When the resident or legal representative asks to withdraw what the account can spare, the withdrawal request asks for the spare amount, and the money is paid afterwards under the withdrawal rules, by check where it is more than the petty cash maximum. The spare amount is not worked out until the account''s ledger carries a transfer naming the patient pay charge of the latest service month that a standing authorization for patient pay covers, where that month''s patient pay is not yet settled and the account has funds available for it. The spare amount is fixed only after the account''s ledger carries a wrong-amount return for the most recent transfer to a bed-hold charge, where part of that transfer paid more than the hold''s own rules let the charge bill. Before the spare amount is worked out, the account''s ledger must carry a wrong-amount return for the most recent transfer to a Medicare coinsurance charge, where part of that transfer paid coinsurance the resident did not owe for the block the charge priced. The spare amount is the available balance less the resident''s allowance kept, less the coming patient pay kept, less the ancillary bills kept, less the recurring services kept and less the bed-hold bills kept, never below zero, rounded half up to the cent once, on the final amount only. The available balance is the account balance, which is the deposits, interest credits and returns on the account''s ledger less its withdrawals, bill transfers and conveyances, less every deposit whose available date is after today, because a check deposit still on hold is not available. Under the standard method nothing is kept back: the resident''s allowance kept, the coming patient pay kept, the ancillary bills kept, the recurring services kept and the bed-hold bills kept are each nothing. The resident''s allowance kept follows the resident''s Medical Assistance case: where the case is eligible in the VA reduced pension tier, the personal needs allowance plus the protected VA pension of that tier; where the case is eligible in any other tier, the personal needs allowance of the case''s tier; otherwise nothing. The coming patient pay kept follows the standing authorization and the income paid into the account: where the account''s standing authorization names Medicaid patient pay and no pension or benefit deposit has been posted in the last two months counted back from today, the case''s patient pay; where the standing authorization names Medicaid patient pay and such a deposit has been posted, the case''s patient pay less the most recent pension or benefit deposit, whichever of the two kinds was posted later (of two posted the same day, the pension), never below zero; otherwise nothing. The ancillary bills kept follow the ancillary account and the most recent per-bill authorization naming an ancillary charge (of two signed at the same moment, the one recorded first): where that authorization awaits its transfer and authorizes less than its charge''s open balance, the account''s open balance less the part of that charge the authorization leaves out, because the representative pays that part another way; where the ancillary account otherwise carries an open balance, that open balance; otherwise nothing. The recurring services kept follow the resident''s most recent request to start a recurring service on the ancillary account (of two made at the same moment, the one recorded first): where it was made within the last thirty days and no later request cancels a recurring service, the monthly price of that service on the ancillary account''s tier; where it was made earlier and no later request cancels a recurring service, the amount of that service''s most recent monthly charge; otherwise nothing. The bed-hold bills kept follow the bed-hold reservations: where a private-pay hold, a Medicare skilled-stay hold or a Medicaid hospital-leave reserved bed is in progress, the open balance of every bed-hold charge plus the hold''s nights so far not yet charged beyond the nights the payer reserves for it, each at the bed-hold rate of the room tier held (a reservation that records no room tier prices no night); where no such hold is in progress and bed-hold charges carry an open balance, that open balance; otherwise nothing. The bed-hold rate of a night is the room tier''s scheduled private daily rate in effect that night: the schedule taking effect 2026-07-01 for nights from that date, and the schedule taking effect 2025-07-01 for earlier nights. A held night is kept at the full bed-hold rate, the most a held night can bill, because an extended-hold percent or a dietary credit that a bed-hold charge agreement applies once the leave has ended depends on the leave''s final length.'
  prerequisite:
  - problem: trust_ext_patient_pay_transfer
    kind: value_input
    gate: balance_now
    form: state
    policy_source: The spare amount is not worked out until the account's ledger carries a transfer naming the patient pay charge of the latest service month that a standing authorization for patient pay covers, where that month's patient pay is not yet settled and the account has funds available for it.
    condition: The trust ledger carries a trust_bill_transfer naming the patient pay charge of the latest service month on the Medical Assistance case, where the account's standing authorization names Medicaid patient pay, that month's patient pay is not yet settled and the available balance is above zero.
    resolved_by: post_patient_pay_transfer_45809d6d
    effect: The standing patient pay transfer lowers the account balance by the named month's patient pay less the credit reaching the charge, so the available balance the spare amount starts from is lower by that transfer.
  - problem: trust_ext_bed_hold_return
    kind: value_input
    gate: balance_now
    form: state
    policy_source: The spare amount is fixed only after the account's ledger carries a wrong-amount return for the most recent transfer to a bed-hold charge, where part of that transfer paid more than the hold's own rules let the charge bill.
    condition: The trust ledger carries a trust_reversal with reason amount_error naming the most recent trust_bill_transfer to a bed-hold charge, where the transfer's portion of that charge's excess over the amount the hold allowed is above zero.
    resolved_by: return_bed_hold_overcharge_0789df0a
    effect: The bed-hold return raises the account balance by the transfer's portion of the excess, so the available balance the spare amount starts from is higher by that return.
  - problem: trust_ext_coinsurance_return
    kind: value_input
    gate: balance_now
    form: state
    policy_source: Before the spare amount is worked out, the account's ledger must carry a wrong-amount return for the most recent transfer to a Medicare coinsurance charge, where part of that transfer paid coinsurance the resident did not owe for the block the charge priced.
    condition: The trust ledger carries a trust_reversal with reason amount_error naming the most recent trust_bill_transfer to a Medicare coinsurance charge, where the transfer's portion of that charge's excess over the coinsurance owed is above zero.
    resolved_by: return_coinsurance_overcharge_2cf6d12d
    effect: The coinsurance return raises the account balance by the transfer's portion of the excess, so the available balance the spare amount starts from is higher by that return.
  cross_category:
  - category: medicaid
    as: history
    reads:
    - status
    - variant_name
    - patient_pay_amount
    note: The eligible case's tier and patient pay decide the allowance kept and the coming patient pay kept.
  - category: ancillary
    as: history
    reads:
    - account_balance
    - ancillary_requests.request_type
    - ancillary_requests.item_category
    - ancillary_requests.created_at
    - ancillary_ledger.amount
    - ancillary_ledger.event_type
    note: The ancillary account balance and its recurring-service requests decide the ancillary amounts kept.
  - category: bedhold
    as: history
    reads:
    - status
    - variant_name
    - leave_start_date
    - room_tier_held
    - bedhold_ledger.amount
    - bedhold_ledger.event_type
    - bedhold_ledger.day_count
    note: Open bed-hold charges, and the uncharged nights of a hold in progress at the room tier's bed-hold rate, are kept.
  compute:
  - balance_now: SUM('trust_ledger','amount', event_type='trust_deposit') + SUM('trust_ledger','amount', event_type='trust_interest_credit') + SUM('trust_ledger','amount', event_type='trust_reversal') - SUM('trust_ledger','amount', event_type='trust_withdrawal') - SUM('trust_ledger','amount', event_type='trust_bill_transfer') - SUM('trust_ledger','amount', event_type='trust_conveyance')
  - held_deposits: SUM('trust_ledger','amount', event_type='trust_deposit') - SUM('trust_ledger','amount', within_months=100000, date_field='available_date', event_type='trust_deposit')
  - available: balance_now - held_deposits
  - case_eligible: EXISTS('medicaid', status='eligible')
  - case_tier: CFIELD('medicaid','variant_name', status='eligible') or ''
  - allowance_kept: (((CPARAM('medicaid','personal_needs_allowance_monthly', status='eligible') or 0) + (CPARAM('medicaid','va_pension_protected_monthly', status='eligible') or 0)) if (case_eligible and case_tier == 'Medical Assistance Nursing Facility Care, VA Reduced Pension') else ((CPARAM('medicaid','personal_needs_allowance_monthly', status='eligible') or 0) if case_eligible else 0))
  - standing: F('standing_authorization')
  - case_pp: CFIELD('medicaid','patient_pay_amount', status='eligible') or 0
  - income_recent: COUNT('trust_ledger', within_months=2, date_field='entry_date', event_type='trust_deposit', deposit_source='pension_direct_deposit') + COUNT('trust_ledger', within_months=2, date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee')
  - pension_on: LATEST('trust_ledger','entry_date', date_field='entry_date', event_type='trust_deposit', deposit_source='pension_direct_deposit')
  - benefit_on: LATEST('trust_ledger','entry_date', date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee')
  - income_last: ((LATEST('trust_ledger','amount', date_field='entry_date', event_type='trust_deposit', deposit_source='pension_direct_deposit') or 0) if (pension_on and (not benefit_on or pension_on >= benefit_on)) else (LATEST('trust_ledger','amount', date_field='entry_date', event_type='trust_deposit', deposit_source='ssa_benefit_as_payee') or 0))
  - coming_pp_kept: (case_pp if (standing == 'medicaid_patient_pay' and income_recent == 0) else (MX(0, case_pp - income_last) if standing == 'medicaid_patient_pay' else 0))
  - svc_start_at: XLATEST('ancillary','ancillary_requests','created_at', date_field='created_at', request_type='recurring_start')
  - svc_item: XLATEST('ancillary','ancillary_requests','item_category', date_field='created_at', request_type='recurring_start')
  - svc_cancel_at: XLATEST('ancillary','ancillary_requests','created_at', date_field='created_at', request_type='recurring_cancel')
  - svc_price: ((CPARAM('ancillary','cable_tv_monthly_usd', status='open') or 0) if svc_item == 'cable_tv' else ((CPARAM('ancillary','telephone_monthly_usd', status='open') or 0) if svc_item == 'telephone' else (CPARAM('ancillary','oxygen_concentrator_monthly_usd', status='open') or 0)))
  - svc_last_charge: XLATEST('ancillary','ancillary_ledger','amount', date_field='entry_date', event_type='ancillary_recurring_charge', recurring_service=svc_item) or 0
  - services_kept: (svc_price if (svc_start_at and (not svc_cancel_at or svc_cancel_at < svc_start_at) and DAYS(svc_start_at, NOW) < 30) else (svc_last_charge if (svc_start_at and (not svc_cancel_at or svc_cancel_at < svc_start_at)) else 0))
  - anc_balance: CFIELD('ancillary','account_balance', status='open') or 0
  - anc_auth_charge: LATEST('trust_requests','bill_entry_id', date_field='created_at', request_type='bill_payment_authorization', bill_category='ancillary_charge')
  - anc_auth_amt: LATEST('trust_requests','amount', date_field='created_at', request_type='bill_payment_authorization', bill_category='ancillary_charge') or 0
  - anc_auth_paid: ((COUNT('trust_ledger', event_type='trust_bill_transfer', bill_entry_id=anc_auth_charge) > 0) if anc_auth_charge else False)
  - anc_auth_open: (MX(0, XSUM('ancillary','ancillary_ledger','amount', ancillary_entry_id=anc_auth_charge) - XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_payment', charge_entry_id=anc_auth_charge) - XSUM('ancillary','ancillary_ledger','amount', event_type='ancillary_credit', charge_entry_id=anc_auth_charge)) if anc_auth_charge else 0)
  - anc_kept: (MX(0, anc_balance - (anc_auth_open - anc_auth_amt)) if (anc_auth_charge and not anc_auth_paid and anc_auth_amt < anc_auth_open) else (anc_balance if anc_balance > 0 else 0))
  - bh_open_all: MX(0, XSUM('bedhold','bedhold_ledger','amount', event_type='bedhold_charge') - XSUM('bedhold','bedhold_ledger','amount', event_type='bedhold_payment') - XSUM('bedhold','bedhold_ledger','amount', event_type='bedhold_adjustment'))
  - bh_hold_id: CFIELD('bedhold','bedhold_reservation_id', status='held')
  - bh_hold_start: CFIELD('bedhold','leave_start_date', status='held')
  - bh_variant: CFIELD('bedhold','variant_name', status='held') or ''
  - room_held: CFIELD('bedhold','room_tier_held', status='held') or ''
  - bh_reserved: CPARAM('bedhold','payer_reserved_days_per_hospitalization', status='held') or 0
  - bh_charged: XSUM('bedhold','bedhold_ledger','day_count', event_type='bedhold_charge', bedhold_reservation_id=bh_hold_id)
  - bh_nights: (DAYS(bh_hold_start, NOW) if bh_hold_start else 0)
  - bh_off: (bh_charged if (bh_variant == 'Medicare Skilled Stay Hospital Leave Bed Hold' or bh_variant == 'Medicare Skilled Stay Therapeutic Leave Bed Hold' or bh_variant == 'Private Pay Hospital Leave Bed Hold' or bh_variant == 'Private Pay Therapeutic Leave Bed Hold') else (bh_reserved + bh_charged))
  - bh_old_nights: (MX(0, MN(bh_nights, DAYS(bh_hold_start, '2026-07-01')) - bh_off) if bh_hold_start else 0)
  - bh_new_nights: MX(0, bh_nights - MX(bh_off, MN(bh_nights, MX(0, DAYS(bh_hold_start, '2026-07-01')))) ) if bh_hold_start else 0
  - rate_2026: (K('semi_private_rate_2026') if room_held == 'Semi-Private Long-Term Care Room' else (K('semi_private_memory_care_rate_2026') if room_held == 'Semi-Private Secure Memory Care Room' else (K('private_rate_2026') if room_held == 'Private Long-Term Care Room' else (K('private_memory_care_rate_2026') if room_held == 'Private Secure Memory Care Room' else (K('bariatric_rate_2026') if room_held == 'Private Bariatric Care Room' else (K('suite_rate_2026') if room_held == 'Private Suite with Sitting Area' else 0))))))
  - rate_2025: (K('semi_private_rate_2025') if room_held == 'Semi-Private Long-Term Care Room' else (K('semi_private_memory_care_rate_2025') if room_held == 'Semi-Private Secure Memory Care Room' else (K('private_rate_2025') if room_held == 'Private Long-Term Care Room' else (K('private_memory_care_rate_2025') if room_held == 'Private Secure Memory Care Room' else (K('bariatric_rate_2025') if room_held == 'Private Bariatric Care Room' else (K('suite_rate_2025') if room_held == 'Private Suite with Sitting Area' else 0))))))
  - bh_kept: ((bh_open_all + bh_old_nights * rate_2025 + bh_new_nights * rate_2026) if (bh_hold_start and (bh_variant == 'Medicare Skilled Stay Hospital Leave Bed Hold' or bh_variant == 'Medicare Skilled Stay Therapeutic Leave Bed Hold' or bh_variant == 'Private Pay Hospital Leave Bed Hold' or bh_variant == 'Private Pay Therapeutic Leave Bed Hold' or bh_variant == 'Medicaid Hospital Leave Reserved Bed')) else (bh_open_all if bh_open_all > 0 else 0))
  - result: RND(MX(0, available - allowance_kept - coming_pp_kept - anc_kept - services_kept - bh_kept) + 0.000000001, 2)
  compute_basis:
