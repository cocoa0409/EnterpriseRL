    available: The available balance is the account balance, which is the deposits, interest credits and returns on the account's ledger less its withdrawals, bill transfers and conveyances, less every deposit whose available date is after today, because a check deposit still on hold is not available.
    case_eligible: where the case is eligible in any other tier
