  - before_2025: (MX(0, MN(last_off, DAYS(charge_from, cut_2025)) - off_start) if charge_from else 0)
  - nights_2026: MX(0, nights_due - before_2026)
  - nights_2025: MX(0, MN(nights_due, before_2026) - before_2025)
  - nights_older: MN(nights_due, before_2025)
