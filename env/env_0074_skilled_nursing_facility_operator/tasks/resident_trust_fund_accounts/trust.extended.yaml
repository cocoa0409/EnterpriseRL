- id: trust_ext_bed_hold_return
  base_policy_refs:
  - trust_evt_reversals
  overwrite: []
  trigger: state_due
  subject:
  - trust_reversal
  computes: amount
  target_tool: return_bed_hold_overcharge_0789df0a
  params:
    semi_private_rate_2025: 384.0
    semi_private_rate_2026: 398.0
    semi_private_memory_care_rate_2025: 412.0
    semi_private_memory_care_rate_2026: 427.0
    private_rate_2025: 421.0
    private_rate_2026: 436.0
    private_memory_care_rate_2025: 449.0
    private_memory_care_rate_2026: 465.0
    bariatric_rate_2025: 466.0
    bariatric_rate_2026: 482.0
    suite_rate_2025: 497.0
    suite_rate_2026: 514.0
  rule: 'When a transfer from this account paid a bed-hold charge in full and the charge billed more than the hold''s own rules let it bill, the bed-hold office can no longer reduce that charge, so the part of the transfer that paid the excess is returned to the account with the reason wrong amount, naming the transfer, within the improper charge reversal business days. The transfer returned is the most recent transfer to a bed-hold charge (of two on the same date, the one recorded first), and the charge it named is the charge the return is figured on. The return for a bed-hold overcharge is figured in this order: the nights due are the charge''s nights from the hold''s first chargeable night through the hold''s last held day; the amount due is each night due at the nightly rate due for that night; the excess is the charge less the amount due, never below zero; the excess is then shared between the transfer and the charge''s other payments in the bed-hold refund order; and the return is the transfer''s portion, never more than the transfer and never below zero, rounded half up to the cent once, on the final amount only. Where a bed-hold charge agreement prices the charge — the single resident-private entry of a Private Pay Hospital Leave hold whose leave has ended; the opening entry of a Medicaid Hospital Leave Reserved Bed hold carrying more than one resident-private entry, or its closing entry once the leave has ended; the opening or the closing entry of a released Private Pay Therapeutic Leave hold carrying more than one resident-private entry — the hold''s own rules are that agreement, whose priced figure is the charge posted on the entry, so the amount due is the charge itself. The hold''s first chargeable night is the latest of the charge''s first night, the first night the notice rule allows and the private hold start date the bed-hold office recorded on the reservation, because a later election holds the bed only from the day of election. The hold''s last held day is the end date recorded on the reservation where it falls inside the charge''s nights, because a returned, released or expired hold records its last held day as its end date; otherwise it is the charge''s last night. The nightly rate due for a night is the private daily rate that the rate schedule applying to that night sets for the room tier priced; where no room tier can be priced, the charge''s own daily rate is the nightly rate due. The charge''s other payments are the payments naming it less the transfers from this account naming it. Under the standard method the notice rule allows every night the charge bills, the room tier priced is the room tier of the resident''s private-pay agreement, every night is priced at the schedule in effect on the date the charge was billed (the charge''s own daily rate where it was billed before 2025-07-01), and the bed-hold refund order gives the transfer the whole excess. The first night the notice rule allows follows the transfer notice recorded for the reservation: where the latest transfer notice was delivered after the departure date, it is that delivery date, because no day held before the transfer notice was delivered is ever charged; where no transfer notice is recorded for the reservation, no night is allowed; otherwise it is the departure date. The room tier priced follows the hold: where the reservation records the room tier held, that tier, because a held bed is priced at the tier of the room held; where it records none and the resident''s private-pay agreement records an isolation placement the center directed, the agreement''s isolation billing tier; otherwise the room tier of the resident''s private-pay agreement. The rate schedule applying to a night follows the date of each night due: nights from 2026-07-01 take the schedule taking effect 2026-07-01; nights from 2025-07-01 to 2026-06-30 take the schedule taking effect 2025-07-01; earlier nights take the schedule in effect on the date the charge was billed, and a charge billed before 2025-07-01, before either schedule this policy prices, keeps the charge''s own daily rate. The bed-hold refund order follows when the charge''s other payments were made: where a payment other than the transfer named the charge on a later date than the transfer, the other payments are refunded first and the transfer''s portion is what remains of the excess after them; where another payment named the charge on the transfer''s own date, the transfer''s portion is the excess times the transfer over the transfer plus the other payments; otherwise the transfer''s portion is the whole excess.'
  prerequisite: []
  cross_category:
