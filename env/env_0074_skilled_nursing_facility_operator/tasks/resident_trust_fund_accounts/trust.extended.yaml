  rule: 'A per-bill authorization for an ancillary charge names the most recent one-time item charge on the ancillary account (of two on the same date, the one recorded first) and states the amount the account will pay toward it; the business office posts the transfer on the second business day after the authorization is signed, so signing it moves no money that day. The amount a new per-bill authorization covers is fixed only after the account''s ledger carries a payer-covered return for the most recent transfer to an ancillary charge, where part of that transfer paid for days a payer covers. The amount a new per-bill authorization covers is the lesser of the named charge''s open balance and the account''s spare balance, never below zero, rounded half up to the cent once, on the final amount only; the named charge''s open balance is the charge less the payments and credits naming it. The spare balance is the account balance, which is the deposits, interest credits and returns on the account''s ledger less its withdrawals, bill transfers and conveyances, less every deposit whose available date is after today, because a transfer never exceeds the available balance and a check deposit still on hold is not available, less the personal needs allowance of the resident''s Medical Assistance case where the account is a Medicaid representative payee account, because for a Medicaid payee account the personal needs allowance stays in the account, less the coinsurance run-up and less the held-bed charges building up. The coinsurance run-up is the resident''s share of the coinsurance on the coinsurance days of the run: each such day at the daily coinsurance rate due for it times the share percent that applies to it, over one hundred. The daily coinsurance rate due for a run day is the rate of the calendar year the day falls in: a day in 2026 takes the 2026 rate; a day in 2025 takes the 2025 rate; a day in any other year takes the rate of the episode''s most recent coinsurance charge. The run is the days of the active Part A episode from the run''s first day through the run''s end. The run''s first day follows the episode''s bookings, because the reserve covers only the days the coverage office has not booked yet and it books an episode''s days block by block: where a block of the active episode is booked, the day after the last day of its most recent booked block; where no block is booked yet, the episode''s coverage start date; where no Part A episode is active, there is no run. For the reserve the run''s days are numbered in turn in the benefit period from the days the coverage office has booked: the first day of the run is the SNF days already used in the benefit period before the episode, plus the net covered days booked in the episode before the run''s first day, plus one; only the days numbered above the full-coverage day limit and not above the benefit-period day limit are coinsurance days. The run-up is a reserve for what the run will cost the resident: every day of the run is reserved as a day in the center, a night away included, because a night away during a Part A stay is billed instead as a held night at the private rate of the room held, which is never less than the coinsurance reserved for it. A held night is reserved at the full bed-hold rate, the most a held night can bill, because an extended-hold percent or a dietary credit that a bed-hold charge agreement applies once the leave has ended depends on the leave''s final length. The held-bed charges building up are the hold''s nights so far, from the first night allowed, not yet charged, each at the bed-hold rate of the room tier priced in effect that night: the schedule taking effect 2026-07-01 for nights from that date, and the schedule taking effect 2025-07-01 for earlier nights. The first night allowed follows the transfer notice for the hold in progress, because no night held before the transfer notice was delivered is ever charged: where the latest transfer notice recorded for the reservation was delivered after the hold''s first held day, the delivery date; where no transfer notice is recorded for the reservation, no night is allowed; otherwise the hold''s first held day. The hold''s first held day is the private hold start date the reservation records, or its leave start date where it records none. Under the standard method the run starts on the episode''s coverage start date and ends yesterday, every day of the episode from that date counted in it, every coinsurance day of the run is at the whole coinsurance, the room tier priced is the room tier of the resident''s private-pay agreement, and the first night allowed is the hold''s first held day. The run''s end follows the stay: where the active episode carries a last covered date before today, the run ends on that last covered date; where no such date is set and a bed hold is in progress because the resident is away, it ends on the day before the leave began; otherwise it ends yesterday. The share percent of a coinsurance day follows the supplemental coverage on the active Part A episode: Medigap Plan K with no QMB status, the Plan K resident share; Medigap Plan L with no QMB status, the Plan L resident share; a full-coinsurance Medigap plan (C, D, F, G, M or N) or QMB status, nothing; any other case, the whole coinsurance. Which coinsurance days take that share follows the date the supplemental coverage took effect: where it took effect on or before the run''s first day, every coinsurance day of the run; where it took effect after the run''s first day, the run''s coinsurance days from that date, the earlier ones keeping the whole coinsurance, because days before the supplemental effective date keep the earlier split; where no supplemental effective date is recorded, none, every coinsurance day keeping the whole coinsurance. The held nights follow the hold in progress: a private-pay or Medicare skilled-stay hold builds up its nights so far not yet charged; a Medicaid hospital-leave reserved bed builds up only its nights so far beyond the reserved nights per hospitalization not yet charged; any other case, including no hold in progress, builds up no night. The room tier priced follows the hold in progress: where the reservation records the room tier held, that tier, because a held bed is priced at the tier of the room held; where it records none and the resident''s private-pay agreement records an isolation placement the center directed, the agreement''s isolation billing tier; otherwise the room tier of the resident''s private-pay agreement; where neither records a room tier, no night is priced.'
