    - bedhold_ledger.entry_date
    - bedhold_ledger.payment_method
    - bedhold_ledger.notice_type
    - variant_name
    - status
    - bedhold_ledger.days_entry_id
    - bedhold_ledger.to_date
    - bedhold_ledger.day_payer
    - bedhold_ledger.event_type
    note: The named charge, its reservation, the reservation's transfer notice and the charge's payments give the nights due, the room tier held and the other payments.
  - category: private
    as: branch
    reads:
