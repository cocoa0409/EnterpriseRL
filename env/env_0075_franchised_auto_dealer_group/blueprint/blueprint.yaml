# Blueprint of env_0075_franchised_auto_dealer_group (output of erl-scenario-blueprint).
name: env_0075_franchised_auto_dealer_group
company: Kessler Automotive Group

background: |
  Kessler Automotive Group is a family-owned franchised dealer group in the Dayton, Springfield and Richmond corridor of southwest Ohio and east Indiana, with six rooftops: Kessler Toyota of Dayton, Kessler Honda Beavercreek, Kessler Ford Springfield, Kessler Chevrolet Fairborn, Kessler Hyundai Richmond and the Kessler Commercial Vehicle Center. It sells new, certified pre-owned and used vehicles to households and to small and mid-sized business fleets, runs service departments at every store, and operates a central sales, service and finance support desk that answers calls for all six stores in a plain, courteous Midwestern tone.
  Vehicle sales are written as Vehicle Purchase Agreements of six deal types: Value Line Used Vehicle Purchase, Used Vehicle Retail Purchase, Certified Pre-Owned Vehicle Purchase, New Vehicle Retail Purchase, New Vehicle Factory Order Purchase and Fleet Vehicle Purchase Agreement.
  A deal opens when a buyer leaves a reservation deposit on a vehicle and is booked through deposits, posted charges, payments, lender funding and refunds until the vehicle is delivered and the deal is closed, cancelled, released or unwound.
  Every customer who has work done holds one service account at one of six tiers: Service Guest Account, Kessler Owner Rewards Silver, Kessler Owner Rewards Gold, Kessler Owner Rewards Platinum, Commercial Fleet Account - Net 15 and Commercial Fleet Account - Net 30.
  Each service account carries a running ledger of repair order lines — diagnostic fees, labor, parts, shop fees, credits, payments and late fees — together with an Owner Rewards points balance.
  The finance office sells Kessler Care Prepaid Maintenance Plans (Kessler Care Essentials 2-Visit, Kessler Care Essentials 4-Visit, Kessler Care Plus 6-Visit, Kessler Care Plus 8-Visit, Kessler Care Premium 10-Visit and Kessler Care Fleet 12-Visit), whose prepaid visits are loaded at sale and used one at a time on repair orders.
  It also sells Kessler Shield Vehicle Service Contracts at six coverage levels (Kessler Shield Powertrain, Kessler Shield Powertrain Plus, Kessler Shield Select, Kessler Shield Preferred, Kessler Shield Exclusionary and Kessler Shield Exclusionary Wrap), each booking claims paid against its life and a refund if it is cancelled.
  Financed buyers can add a Kessler GAP Waiver addendum to their installment contract — Kessler GAP Waiver 125, Kessler GAP Used Vehicle 140, Kessler GAP Waiver 150, Kessler GAP Plus 150, Kessler GAP Plus 175 or Kessler GAP Commercial 130 — which books total-loss benefits and cancellation or early-payoff refunds.
  Each vehicle also carries its warranty and recall coverages — Kessler Used Vehicle Limited Warranty, Factory Complimentary Maintenance, Factory Basic Limited Warranty, Factory Powertrain Limited Warranty, Certified Pre-Owned Powertrain Warranty, Federal Emissions Performance Warranty and Safety Recall Remedy Coverage — whose claims, recall notices and remedies are recorded by repair order.
  Customers waiting on repairs drive Courtesy Transportation Agreements under the Same-Day Courtesy Loaner, Courtesy Loaner - Compact, Courtesy Loaner - Midsize, Courtesy Loaner - SUV, Warranty Rental Loaner and Fleet Replacement Unit programs, each agreement booking its own charges and payments.
  Most callers are individual owners who bought a vehicle from one of the stores and hold a service account alongside some mix of a maintenance plan, a service contract and a GAP waiver on that vehicle, often financed on the same installment contract.
  Fleet callers are contractors, landscapers, delivery firms and property managers who buy work trucks and vans through the Commercial Vehicle Center, run commercial fleet service accounts on net terms and keep fleet maintenance plans on their units.
  Callers typically bring a recent history with them: a deposit on a vehicle still on hold, a delivery that slipped, a repair order with a diagnostic fee and an estimate, a maintenance visit just used, a service contract claim decision, a total loss being settled by their insurer, or a product they now want to cancel after selling or trading the vehicle.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: vehicle_purchase_deals
    claim:
      categories: [purchase]
      event_types: [purchase_deal_reserved, purchase_hold_extended, purchase_deal_contracted, purchase_vehicle_delivered, purchase_spot_delivered, purchase_spot_unwound, purchase_exchange_unwound, purchase_reservation_cancelled, purchase_contract_cancelled, purchase_hold_released, purchase_title_applied, purchase_deposit_received, purchase_deposit_applied, purchase_deposit_refunded, purchase_deposit_forfeited, purchase_charge_posted, purchase_payment_posted, purchase_payment_returned, purchase_payment_refunded, purchase_charge_reversed]
    summary: >
      Callers are retail buyers holding one or more purchase deals of the six deal types — a deposit on a stock unit, a factory order waiting on its build, a contracted vehicle whose delivery slipped, a spot delivery still waiting on the lender, a vehicle delivered days ago that they want to return — and fleet buyers holding several Fleet Vehicle Purchase Agreements under a commercial service account; the same caller usually also holds a service account, and retail buyers often have a service contract, maintenance plan or GAP waiver written on the same deal, so their requests cut across deal type, deal status, how many deals are open and what has already been posted, paid, returned or refunded.
      The records are the deal itself (deal type, status, hold expiry and extensions, contract and delivery dates, cash price, trade figures, financing type, lender buy rate and APR, delivery method and distance, odometer at delivery), the deal's transaction history (deposits with their methods, charges by charge code and billing month, payments, returned payments, refunds and reversals with the original transaction each acts on) and the buyer's signed cancellation and exchange-return requests; the governing rules are state gates on which deal statuses allow a deposit, an extension, a contract, a delivery, a cancellation, an exchange or a close, time windows counted from the reservation, contract, delivery, appraisal and returned-payment dates (purchase_evt_hold_extension, purchase_evt_hold_lapse, purchase_evt_exchange, purchase_evt_spot_delivery, purchase_evt_trade_and_equity, purchase_evt_late_balance, purchase_evt_returned_payment), and per-deal-type amounts — deposit limits and card caps (purchase_evt_deposit), retained amounts on cancellation with the late-delivery waiver (purchase_evt_buyer_cancellation), the documentary fee as the lesser of the store fee and the price ceiling (purchase_evt_doc_fee), home delivery fees (purchase_evt_home_delivery), exchange restocking and mileage charges, negative equity, late balance fees and the fleet incentive (purchase_evt_fleet_incentive).
      In the domain's natural course a deal is reserved, may be extended, is contracted, is delivered (finally or on a spot basis) and is closed, with deposits applied at delivery, while cancellations, lapses and unwinds lead to deposit refunds or forfeitures; cross-category facts bear on it — the buyer's commercial fleet service account standing governs fleet net terms (purchase_combo_fleet_terms) and open recall records in the warranty coverages govern whether a certified or new vehicle may be delivered (purchase_evt_delivery_gate).
      The agent performs the store-side service actions — recording extensions, contracts, deliveries and title filings, posting deposits, charges, payments, refunds, forfeitures and reversals, and processing a cancellation, release or unwind — while only the buyer can sign a reservation cancellation, a contract cancellation or an exchange-return request, which the agent hands to the buyer as a user action before processing it.
      Requests no rule decides — renegotiating an agreed price or trade allowance, a deposit or exchange dispute outside the published windows that the caller wants overridden, a lender's refusal to buy the contract, a complaint about a salesperson, or any legal claim against the store — have no policy path and are handed to a human representative as POLICY_NOT_COVERED.
  - name: service_repair_orders
    claim:
      categories: [service]
      event_types: [service_account_opened, service_tier_changed, service_account_hold, service_account_reinstated, service_account_closed, service_diagnostic_fee_charged, service_labor_charged, service_parts_charged, service_shop_fee_charged, service_line_credited, service_payment_received, service_payment_returned, service_late_fee_charged, service_points_earned, service_points_redeemed, service_points_expired]
    summary: >
      Callers are retail owners on a Service Guest Account or an Owner Rewards tier and fleet businesses on Commercial Fleet net-terms accounts, asking about a repair order — why a diagnostic fee was charged or not credited, whether the bill exceeded the estimate, what the shop fees are, whether a repeat repair is a comeback, how many rewards points they earned, can redeem or lost, why a fleet invoice drew a late fee or the account went on credit hold — and the same owners usually also hold a vehicle purchase deal, a prepaid maintenance plan whose visits are used on these repair orders, a service contract or warranty coverage paying part of the work, and sometimes a loaner agreement.
      The records are the service account (tier, status, credit limit, balance, points), its repair order lines (diagnostic, labor and parts rows with hours, posted labor rate, list and net amounts, shop fees by fee code, credits by reason with the line they credit, payments, returned payments, late fees by billing month, points rows) and the customer's estimate decisions per repair order line; the rules are tiered labor and parts discounts with a per-repair-order discount cap (service_evt_labor_pricing, service_evt_parts_pricing), the diagnostic fee and its tiered credit window (service_evt_diagnostic), the estimate tolerance and fleet pre-authorization (service_evt_estimate), shop supplies, hazardous waste, tire, storage and mobile fees (service_evt_shop_fees), net terms, early-payment discounts, late fees and credit hold (service_evt_payment_terms), points earning, redemption caps and month-end expiry (service_evt_rewards_points), the annual tier review (service_evt_tier_review), the repair warranty for comebacks counted in months and miles (service_evt_comeback) and the goodwill authority limit (service_evt_goodwill).
      The natural order of the domain is check-in, diagnosis, estimate, the customer's decision, repair, invoice and payment, with points credited after payment; which source pays each line follows the coverage priority across recall, warranty, service contract and maintenance plan records (service_combo_coverage_priority), so the agent reads those other records before deciding what the customer owes here.
      The agent posts charges, credits, payments, late fees, points and account changes on a verified account, while authorizing or declining a written estimate is the customer's own decision, handed to the customer as a user action.
      A goodwill request above the desk's limit, a dispute about workmanship or damage done in the shop, a demand for compensation for lost time or a rental the customer arranged elsewhere, and a fleet customer's request for a higher credit limit fall outside every rule and go to a human representative as POLICY_NOT_COVERED.
  - name: prepaid_maintenance_plans
    claim:
      categories: [maintenance]
      event_types: [maintenance_plan_sold, maintenance_vehicle_substituted, maintenance_plan_fulfilled, maintenance_plan_expired, maintenance_plan_cancelled, maintenance_visits_loaded, maintenance_visit_redeemed, maintenance_visit_reinstated, maintenance_visits_expired, maintenance_visits_cancelled, maintenance_refund_calculated, maintenance_refund_paid]
    summary: >
      Callers are individual owners holding a Kessler Care Essentials, Plus or Premium plan on one or more vehicles and fleet businesses holding many Kessler Care Fleet 12-Visit plans, asking whether a visit should have been used, why a visit was charged on customer pay, whether a mistaken redemption can be restored, what happens to unused visits at expiry, or how much they get back after selling, trading or totaling the vehicle; these customers also hold service accounts whose repair orders carry the visits, purchase deals the plans were often sold on, and factory coverages that may pay the same service first.
      The records are the plan (plan name, status, vehicle, selling store and deal, sale and expiration dates, odometer at sale and expiration odometer, price paid, financing and lienholder, visits remaining, refund due), its ledger (visits loaded, redeemed with visit number, repair order, store and odometer, reinstated, expired or cancelled, refunds computed and paid) and the holder's signed cancellation requests; the rules are sale eligibility and the bundle and fleet volume prices (maintenance_evt_sale, maintenance_agg_fleet_volume), the visit conditions — active plan, term or grace by date and mileage, interval spacing by miles or days, store scope and per-visit inclusions (maintenance_evt_visit_redemption) — the reinstatement window (maintenance_evt_visit_reinstatement), expiry without refund (maintenance_evt_expiration), and the refund computation with free look, unwound-deal full refund, retail-value deduction or pro-rata unused visits, fees and the total-loss waiver (maintenance_evt_cancellation_refund) paid to the holder or the lienholder (maintenance_evt_refund_payment).
      Visits follow the natural order of sale, loading, redemption visit by visit and fulfilment, expiry or cancellation; cross-category records shape the outcome — the vehicle's Factory Complimentary Maintenance coverage defers plan visits (maintenance_combo_factory_maintenance), the purchase deal shows whether the plan was bundled or the deal unwound, and the service repair orders show the visits' dates and odometers.
      The agent redeems, reinstates, expires, computes and pays refunds and records fleet substitutions on a verified plan, while cancelling a plan is the holder's own signed request, handed to the holder as a user action before the agent processes it.
      Requests to extend a term, roll unused visits into a new plan, transfer a retail plan to a buyer of the vehicle, or refund visits that expired unused have no policy path and go to a human representative as POLICY_NOT_COVERED.
  - name: service_contract_claims
    claim:
      categories: [vsc]
      event_types: [vsc_contract_sold, vsc_contract_cancelled, vsc_contract_expired, vsc_claim_paid, vsc_claim_denied, vsc_claim_reversed, vsc_refund_calculated, vsc_refund_paid]
    summary: >
      Callers are individual owners holding a Kessler Shield contract at one of six coverage levels on a used, certified or new vehicle, asking why a claim line was denied or paid less than the repair order, what deductible and labor-rate difference they owe, whether rental, towing or trip interruption is payable, or how much they get back after selling, trading or totaling the vehicle or unwinding the deal; they also hold the purchase deal the contract was usually sold on, a service account whose repair orders the claims pay, a maintenance plan or service history that proves maintenance, warranty coverages that may pay first, and often a GAP waiver on the same financing.
      The records are the contract (coverage level, status, sale date, term start date and odometer, term months and miles, expiration date and odometer, deductible option, price, financing and lienholder, claims paid, refund due), its ledger (claim lines paid or denied by claim number, line type and component group with hours, labor rate paid, parts, deductible and days, reversals, refunds computed and paid) and the holder's signed cancellation requests; the rules are sale eligibility and term construction (vsc_evt_sale), the waiting period by days and miles with its waiver for contracts sold on the deal (vsc_evt_waiting_period), covered component groups, the labor-rate cap, the deductible basis and the selling-dealer waiver (vsc_evt_claim_payment), per-day benefit limits (vsc_evt_claim_benefits), maintenance proof (vsc_evt_maintenance_proof), the aggregate claim limit (vsc_agg_vehicle_and_limit), reversals (vsc_evt_claim_reversal), and the cancellation refund with free look, unwound-deal flat refund, lesser-of-time-or-mileage or time-only pro rata share, fee and total-loss waiver (vsc_evt_cancellation_refund) paid to the holder or lienholder (vsc_evt_refund_payment).
      The domain runs from sale through claims during the term to expiry or cancellation; the manufacturer warranty and recall records decide whether the factory pays a failure before the contract does (vsc_combo_factory_warranty), and the purchase deal decides the waiting-period waiver and the unwound-deal refund.
      The agent decides and records claim lines, reversals, refund computations and refund payments on a verified contract, while cancelling the contract is the holder's own signed request, handed to the holder as a user action.
      Disputes over a teardown finding of pre-existing damage, requests to pay a repair done at an outside shop without authorization, requests to upgrade coverage mid-term or to transfer the contract to a private buyer have no policy path and go to a human representative as POLICY_NOT_COVERED.
  - name: gap_waiver_claims
    claim:
      categories: [gap]
      event_types: [gap_waiver_sold, gap_lien_payoff_recorded, gap_waiver_claim_settled, gap_waiver_cancelled, gap_waiver_terminated, gap_waiver_expired, gap_benefit_paid, gap_claim_denied, gap_benefit_reversed, gap_refund_calculated, gap_refund_paid]
    summary: >
      Callers are financed buyers — individuals and, for Kessler GAP Commercial 130, fleet businesses — whose vehicle was declared a total loss and who want to know what the waiver will pay toward the loan, why the benefit came out lower than the shortfall, whether a replacement vehicle credit applies, or what refund they get after paying the loan off early, refinancing, unwinding the deal or simply cancelling; the same customers hold the financed purchase deal behind the waiver and frequently a service contract or maintenance plan financed on the same contract, whose refunds feed into the benefit.
      The records are the waiver (waiver name, status, sale date, loan term and expiration, price, amount financed, vehicle value basis, lienholder, loan payoff date, benefits paid, refund due), its ledger (benefit lines paid or denied with the loss date, settlement date, payoff at loss, insurer ACV and deductible, past-due amounts, late fees, deferred payments, add-on refunds, negative equity and retained salvage, reversals, refunds computed and paid) and the holder's signed cancellation requests; the rules are sale eligibility (gap_evt_sale), the benefit computation with the covered-deductible cap, per-waiver exclusion switches, the loan-to-value reduction and the benefit caps (gap_evt_benefit_calculation), claim timing and loss conditions with notice counted from the insurer's settlement date (gap_evt_claim_conditions), the replacement credit window (gap_evt_replacement_credit), reversals (gap_evt_benefit_reversal), and refunds with free look, unwound-deal flat refund, daily pro rata share, fee and payoff fee waiver (gap_evt_cancellation_refund) paid to the lienholder while the loan is open or to the holder after payoff (gap_evt_refund_payment).
      The domain runs from sale with the financed deal through either a total-loss claim that settles the waiver or an early payoff, refinance, cancellation or maturity; the purchase deal supplies the financing, negative equity and unwind facts, and the service contract and maintenance plan charters supply the add-on refunds the benefit subtracts (gap_combo_addon_products).
      The agent records payoff dates, benefit lines, denials, reversals, settlements, terminations, refund computations and payments on a verified waiver, while cancelling a waiver is the holder's own signed request, handed to the holder as a user action.
      A dispute over the insurer's ACV figure, a request to cover a partial loss or a mechanical breakdown, a request to pay any part of the GAP balance benefit to the holder instead of the lienholder, or a request to move the waiver to a refinanced loan has no policy path and goes to a human representative as POLICY_NOT_COVERED.
