events:
- type: gap_waiver_sold
  target: gap_waivers
  mutation: create
  meaning: A GAP waiver addendum is sold on a financed vehicle purchase deal.
  grain: One row per waiver.
  fields:
    customer_id: holder
    vehicle_id: financed vehicle
    purchase_deal_id: financed deal
    variant_name: waiver
    waiver_number: addendum number
    sale_date: contract date
    loan_term_months: contract term
    expiration_date: sale date plus loan term
    retail_price: price
    amount_financed: amount financed
    vehicle_value_basis: MSRP or NADA retail value at sale
    lienholder_name: lender
  triggers: []
- type: gap_lien_payoff_recorded
  target: gap_waivers
  mutation: update
  meaning: The lienholder reports the contract paid in full or refinanced away, and the payoff date is recorded.
  grain: One update per waiver.
  fields: {loan_payoff_date: payoff date reported by the lienholder}
  triggers: []
- type: gap_waiver_claim_settled
  target: gap_waivers
  mutation:
    transition: {from: active, to: claim_settled}
  meaning: The GAP balance benefit for a total loss is paid and the waiver ends.
  grain: One transition per waiver.
  fields: {closed_date: date the benefit was paid}
  triggers: []
- type: gap_waiver_cancelled
  target: gap_waivers
  mutation:
    transition: {from: active, to: cancelled}
  meaning: The waiver is cancelled on the holder's signed request.
  grain: One transition per waiver.
  fields: {closed_date: effective cancellation date (the request date)}
  triggers:
  - event: gap:gap_refund_calculated
    map: {entry_date: closed_date}
- type: gap_waiver_terminated
  target: gap_waivers
  mutation:
    transition: {from: active, to: terminated}
  meaning: The waiver ends early because the contract was paid off or refinanced away.
  grain: One transition per waiver.
  fields: {closed_date: the loan payoff date}
  triggers:
  - event: gap:gap_refund_calculated
    map: {entry_date: closed_date}
- type: gap_waiver_expired
  target: gap_waivers
  mutation:
    transition: {from: active, to: expired}
  meaning: The waiver term ends at the contract's scheduled maturity.
  grain: One transition per waiver.
  fields: {closed_date: expiration date}
  triggers: []
- type: gap_benefit_paid
  target: gap_ledger
  meaning: A GAP benefit line of a total-loss claim is paid (the GAP balance to the lienholder, or the replacement vehicle credit).
  grain: One entry per claim benefit line.
  distinguish_by: [claim_number, benefit_line_type]
  fields:
    entry_date: payment date
    claim_number: claim number
    benefit_line_type: benefit paid
    loss_type: kind of loss
    loss_date: loss date
    settlement_date: insurer settlement date
    payoff_at_loss: payoff at loss
    insurance_acv_settlement: insurer ACV
    insurance_deductible: insurer deductible
    past_due_amounts: past-due payments
    late_fees_and_charges: late fees
    deferred_payments: deferred payments
    addon_refunds_credited: add-on refunds
    negative_equity_amount: carried negative equity
    salvage_retention_value: retained salvage value
    amount: benefit paid
    denial_reason: not_applicable
    cancel_method: not_applicable
    refund_payee: not_applicable
  account: gap_benefits_paid
  direction: in
  triggers: []
- type: gap_claim_denied
  target: gap_ledger
  meaning: A GAP claim benefit line is denied, with its reason.
  grain: One entry per denied claim line per decision.
  distinguish_by: [claim_number, benefit_line_type, entry_date]
  fields:
    entry_date: decision date
    claim_number: claim number
    benefit_line_type: benefit denied
    loss_type: kind of loss
    loss_date: loss date
    settlement_date: insurer settlement date
    amount: 0.0
    denial_reason: reason
    cancel_method: not_applicable
    refund_payee: not_applicable
  triggers: []
- type: gap_benefit_reversed
  target: gap_ledger
  meaning: A benefit paid in error (the insurer reopened the settlement, or the vehicle was recovered before the settlement) is reversed.
  grain: One entry per benefit line reversed.
  distinguish_by: [source_entry_id]
  fields: {entry_date: reversal date, claim_number: claim number of the line, source_entry_id: the paid line reversed, amount: amount reversed, denial_reason: not_applicable, cancel_method: not_applicable, refund_payee: not_applicable}
  account: gap_benefits_paid
  direction: out
  triggers: []
- type: gap_refund_calculated
  target: gap_ledger
  meaning: The refund owed on a cancelled or terminated waiver is computed and recorded as due.
  grain: One entry per cancellation or termination.
  distinguish_by: [entry_date]
  fields: {entry_date: effective date (request date or loan payoff date), cancel_method: basis of the refund, amount: refund due, denial_reason: not_applicable, refund_payee: not_applicable}
  account: gap_refund_due
  direction: in
  triggers: []
- type: gap_refund_paid
  target: gap_ledger
  meaning: The refund is paid to the holder or the lienholder.
  grain: One entry per refund payment.
  distinguish_by: [source_entry_id, refund_payee]
  fields: {entry_date: payment date, source_entry_id: the refund calculation paid, refund_payee: who was paid, amount: amount paid, denial_reason: not_applicable, cancel_method: not_applicable}
  account: gap_refund_due
  direction: out
  triggers: []
measures:
- id: gap_msr_ltv_cap_amount
  window: The waiver as sold.
  measure: ltv_cap_pct times the waiver's vehicle_value_basis, rounded to the cent (the most that may be financed without reducing the benefit).
- id: gap_msr_ltv_factor
  window: The waiver as sold.
  measure: The lesser of 1 and gap_msr_ltv_cap_amount divided by the waiver's amount_financed.
- id: gap_msr_excess_financed
  window: The waiver as sold.
  measure: The waiver's amount_financed less gap_msr_ltv_cap_amount, floored at 0.00.
- id: gap_msr_unused_term_share
  window: The waiver term, measured at the effective date of the cancellation or termination.
  measure: Calendar days from the effective date to expiration_date divided by calendar days from sale_date to expiration_date, floored at 0.
policies:
- id: gap_agg_multi_holding
  subject: [gap_waiver_sold]
  rule: A customer may hold GAP waivers on any number of financed vehicles, one waiver per financed deal; how waivers on one vehicle and claims under one waiver combine is governed by gap_agg_vehicle_and_claims.
  eligibility: []
  params: {max_per_customer: null}
- id: gap_agg_vehicle_and_claims
  subject: [gap_waiver_sold, gap_benefit_paid]
  rule: A vehicle carries at most max_waivers_per_vehicle active waiver. A vehicle that already has an active GAP waiver cannot be sold another. One waiver pays at most claims_count_limit total-loss claims, and its GAP balance benefit is the only GAP benefit on that loss; waivers held by the same customer on other vehicles never contribute to the loss.
  eligibility:
  - id: one_waiver_per_vehicle
    applies_to: [gap_waiver_sold]
    kind: dedup
    condition: A vehicle that already has an active GAP waiver cannot be sold another.
    evidence_fields: [gap_waivers.vehicle_id, gap_waivers.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_waivers.vehicle_id]
      action_bindings: {gap_waivers.vehicle_id: vehicle_id}
    dedup_contract:
      table: gap_waivers
      mode: separate_record
      object_bindings: {vehicle_id: vehicle_id}
      duplicate_filters: {status: [active]}
      distinct_fields: [gap_waiver_id]
- id: gap_evt_sale
  subject: [gap_waiver_sold]
  rule: A waiver is sold only on a purchase deal financed by a dealer-arranged installment contract; a cash deal, an outside-lender deal, a fleet net-terms deal and a lease cannot carry one (lease_eligible is false). The vehicle's condition must be in eligible_vehicle_conditions and its age at sale (sale year minus model year) may not exceed max_vehicle_age_years; a vehicle in commercial use is covered only where commercial_use_eligible is true. The contract term must lie between min_term_months and max_term_months, and where term_match_loan_required is true the waiver term equals the contract term. The amount financed must lie between min_amount_financed_usd and max_amount_financed_usd, and the price may not exceed max_retail_price_usd. The vehicle value basis is the vehicle's MSRP for a new vehicle and its NADA retail value at sale for a used or certified vehicle, limited to the source the waiver's vehicle_value_source names.
  eligibility: []
- id: gap_evt_benefit_calculation
  subject: [gap_benefit_paid]
  rule: The payoff at loss is figured on the waiver's payoff_interest_basis and the ACV is taken on its acv_basis. The GAP balance benefit starts from the lienholder's payoff at the loss date (payoff_at_loss, simple interest accrued to the loss date) less the primary insurer's ACV settlement before its deductible. The insurer's deductible is covered up to deductible_covered_cap_usd; any deductible above that cap is subtracted. Then the payoff items the waiver excludes are subtracted, each only where its switch is true — past-due payments (exclude_past_due_payments), late fees and charges (exclude_late_fees), deferred or extended payments (exclude_deferred_payments), refunds of cancelled financed products (exclude_addon_refunds), negative trade equity carried into the contract (exclude_negative_equity) and a salvage value deducted for an owner-retained vehicle (exclude_salvage_retention). Financing above the loan-to-value cap then reduces the result according to the waiver's excess_ltv_method — under proportional_reduction the result is multiplied by gap_msr_ltv_factor, under exclude_excess_amount gap_msr_excess_financed is subtracted. The benefit is that result rounded to the cent, floored at 0.00 and capped at the lesser of max_benefit_usd and max_benefit_pct_of_acv times the ACV settlement. It is paid to the gap_benefit_payee, and paying it settles the waiver.
  eligibility: []
  params:
    per_tier:
      Kessler GAP Waiver 125: {ltv_cap_pct: =ltv_cap_pct, deductible_covered_cap_usd: =deductible_covered_cap_usd, max_benefit_usd: =max_benefit_usd, max_benefit_pct_of_acv: =max_benefit_pct_of_acv}
      Kessler GAP Used Vehicle 140: {ltv_cap_pct: =ltv_cap_pct, deductible_covered_cap_usd: =deductible_covered_cap_usd, max_benefit_usd: =max_benefit_usd, max_benefit_pct_of_acv: =max_benefit_pct_of_acv}
      Kessler GAP Waiver 150: {ltv_cap_pct: =ltv_cap_pct, deductible_covered_cap_usd: =deductible_covered_cap_usd, max_benefit_usd: =max_benefit_usd, max_benefit_pct_of_acv: =max_benefit_pct_of_acv}
      Kessler GAP Plus 150: {ltv_cap_pct: =ltv_cap_pct, deductible_covered_cap_usd: =deductible_covered_cap_usd, max_benefit_usd: =max_benefit_usd, max_benefit_pct_of_acv: =max_benefit_pct_of_acv}
      Kessler GAP Plus 175: {ltv_cap_pct: =ltv_cap_pct, deductible_covered_cap_usd: =deductible_covered_cap_usd, max_benefit_usd: =max_benefit_usd, max_benefit_pct_of_acv: =max_benefit_pct_of_acv}
      Kessler GAP Commercial 130: {ltv_cap_pct: =ltv_cap_pct, deductible_covered_cap_usd: =deductible_covered_cap_usd, max_benefit_usd: =max_benefit_usd, max_benefit_pct_of_acv: =max_benefit_pct_of_acv}
  formula:
    deductible_excess: max(0, insurance_deductible - deductible_covered_cap_usd)
    base_gap: payoff_at_loss - insurance_acv_settlement - deductible_excess - past_due_amounts - late_fees_and_charges - addon_refunds_credited - salvage_retention_value
    benefit_cap: min(max_benefit_usd, max_benefit_pct_of_acv * insurance_acv_settlement)
    proportional_benefit: min(benefit_cap, max(0, round(base_gap * gap_msr_ltv_factor, 2)))
  measures: [gap_msr_ltv_factor, gap_msr_excess_financed, gap_msr_ltv_cap_amount]
- id: gap_evt_claim_conditions
  subject: [gap_benefit_paid, gap_claim_denied]
  rule: A GAP balance benefit is paid only on a waiver in active status, and a replacement vehicle credit only on a waiver in claim_settled status. Only a total loss is covered where partial_loss_excluded is true, a vehicle declared a loss for mechanical breakdown is excluded where mechanical_breakdown_excluded is true, and where require_primary_insurance is true there must be a primary physical-damage insurance total-loss settlement. A claim is accepted only when it is reported within claim_notice_days calendar days after the primary insurer's settlement date. The required documents (settlement letter, payoff letter, payment history, the installment contract) must arrive within claim_documents_days calendar days after the claim is reported, and an approved benefit is paid within claim_payment_days after the last document. A theft claim is paid only after the vehicle has stayed unrecovered for theft_waiting_days calendar days after the loss date. A denied line names its denial_reason; the holder may submit new evidence within claim_denial_appeal_days calendar days after the denial, and a review that overturns the denial pays the line as a new gap_benefit_paid entry. Calendar days are added to the settlement date (day 0); a report on the last day is in time.
  eligibility:
  - id: active_at_loss
    applies_to: [gap_benefit_paid]
    kind: state
    condition: A GAP balance benefit is paid only on a waiver in active status, and a replacement vehicle credit only on a waiver in claim_settled status.
    evidence_fields: [gap_waivers.status, gap_waivers.gap_waiver_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_waivers.gap_waiver_id]
      action_bindings: {gap_waivers.gap_waiver_id: gap_waiver_id}
    state_contract: {field: gap_waivers.status, allowed: [active, claim_settled]}
  - id: notice_in_time
    applies_to: [gap_benefit_paid]
    kind: time
    condition: A claim is accepted only when it is reported within claim_notice_days calendar days after the primary insurer's settlement date.
    evidence_fields: [gap_ledger.settlement_date, gap_ledger.claim_number]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_ledger.claim_number]
      action_bindings: {gap_ledger.claim_number: claim_number}
    temporal_basis:
      clock: frozen_time
      anchor_event: the primary insurer's settlement date
      anchor_source: gap_ledger.settlement_date
      relation: not_after
      duration_source: variants.claim_notice_days
      unit: calendar_days
      counting_rule: Calendar days are added to the settlement date (day 0); a report on the last day is in time.
      boundary: inclusive
- id: gap_evt_replacement_credit
  subject: [gap_benefit_paid]
  rule: Where replacement_vehicle_credit_usd is above 0.00, a holder whose GAP balance benefit has been paid receives that credit toward a replacement vehicle bought from a group store, as a gap_benefit_paid entry with benefit_line_type replacement_vehicle_credit under the same claim number. The replacement vehicle credit is given only when the replacement vehicle's buyer's order is signed within replacement_credit_window_days calendar days after the GAP balance benefit was paid. The credit is paid to the store that sells the replacement vehicle on the holder's behalf and is honored at the stores replacement_credit_store_scope names and is never paid in cash; it is given at most once per claim. Calendar days are added to the entry_date of the paid gap_balance line (day 0), and the replacement deal's contract_date must fall on or before the last day.
  eligibility:
  - id: replacement_within_window
    applies_to: [gap_benefit_paid]
    kind: time
    condition: The replacement vehicle credit is given only when the replacement vehicle's buyer's order is signed within replacement_credit_window_days calendar days after the GAP balance benefit was paid.
    evidence_fields: [gap_ledger.entry_date, purchase_deals.contract_date, purchase_deals.customer_id, gap_ledger.claim_number]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_ledger.claim_number]
      action_bindings: {gap_ledger.claim_number: claim_number}
    temporal_basis:
      clock: frozen_time
      anchor_event: the GAP balance benefit was paid
      anchor_source: gap_ledger.entry_date
      relation: not_after
      duration_source: variants.replacement_credit_window_days
      unit: calendar_days
      counting_rule: Calendar days are added to the entry_date of the paid gap_balance line (day 0), and the replacement deal's contract_date must fall on or before the last day.
      boundary: inclusive
- id: gap_evt_benefit_reversal
  subject: [gap_benefit_reversed]
  rule: A benefit paid in error is reversed in full by one gap_benefit_reversed entry pointing at the paid line; a benefit line is reversed at most once. A benefit is paid in error when the primary insurer reopens or withdraws its total-loss settlement, or a stolen vehicle is recovered before the insurer settles. A reversal does not reopen the waiver.
  eligibility:
  - id: reverse_once
    applies_to: [gap_benefit_reversed]
    kind: dedup
    condition: A benefit paid in error is reversed in full by one gap_benefit_reversed entry pointing at the paid line; a benefit line is reversed at most once.
    evidence_fields: [gap_ledger.source_entry_id, gap_ledger.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_ledger.source_entry_id]
      action_bindings: {gap_ledger.source_entry_id: source_entry_id}
    dedup_contract:
      table: gap_ledger
      mode: separate_record
      object_bindings: {source_entry_id: source_entry_id}
      duplicate_filters: {event_type: [gap_benefit_reversed]}
      distinct_fields: [entry_date]
- id: gap_evt_cancellation_refund
  subject: [gap_waiver_cancelled, gap_waiver_terminated, gap_refund_calculated]
  rule: The holder may cancel an active waiver at any time by a signed cancellation request; the cancellation is effective on the request date. A waiver is cancelled only from active status. A waiver is cancelled only on the holder's signed cancellation request recorded for the waiver. Where refund_on_payoff_automatic is true, a waiver whose contract the lienholder reports paid off or, where refinance_terminates_waiver is true, refinanced away is terminated with its loan_payoff_date as the effective date and its refund computed without any request. Free look — a waiver cancelled within free_look_days calendar days after its sale date is refunded its full retail_price (cancel_method flat_free_look). Unwound deal — where deal_unwind_flat_cancel is true, a waiver on a purchase deal that has been unwound is refunded its full retail_price (cancel_method flat_deal_unwound). Otherwise the refund follows the waiver's refund_method, pro_rata_daily (cancel_method pro_rata) — retail_price times gap_msr_unused_term_share, rounded to the cent, less cancellation_fee_usd; no fee is deducted on a termination where cancellation_fee_waived_on_payoff is true. A computed refund below 0.00 is 0.00. A waiver whose GAP balance benefit has been paid is settled and earns no refund.
  eligibility:
  - id: active_to_end
    applies_to: [gap_waiver_cancelled, gap_waiver_terminated]
    kind: state
    condition: A waiver is cancelled only from active status.
    evidence_fields: [gap_waivers.status, gap_waivers.gap_waiver_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_waivers.gap_waiver_id]
      action_bindings: {gap_waivers.gap_waiver_id: gap_waiver_id}
    state_contract: {field: gap_waivers.status, allowed: [active]}
  - id: signed_request
    applies_to: [gap_waiver_cancelled]
    kind: authorization
    condition: A waiver is cancelled only on the holder's signed cancellation request recorded for the waiver.
    evidence_fields: [gap_cancellation_requests.gap_waiver_id, gap_cancellation_requests.cancel_reason, gap_cancellation_requests.request_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_cancellation_requests.gap_waiver_id]
      action_bindings: {gap_cancellation_requests.gap_waiver_id: gap_waiver_id}
  params:
    per_tier:
      Kessler GAP Waiver 125: {free_look_days: =free_look_days, cancellation_fee_usd: =cancellation_fee_usd, cancellation_fee_waived_on_payoff: =cancellation_fee_waived_on_payoff}
      Kessler GAP Used Vehicle 140: {free_look_days: =free_look_days, cancellation_fee_usd: =cancellation_fee_usd, cancellation_fee_waived_on_payoff: =cancellation_fee_waived_on_payoff}
      Kessler GAP Waiver 150: {free_look_days: =free_look_days, cancellation_fee_usd: =cancellation_fee_usd, cancellation_fee_waived_on_payoff: =cancellation_fee_waived_on_payoff}
      Kessler GAP Plus 150: {free_look_days: =free_look_days, cancellation_fee_usd: =cancellation_fee_usd, cancellation_fee_waived_on_payoff: =cancellation_fee_waived_on_payoff}
      Kessler GAP Plus 175: {free_look_days: =free_look_days, cancellation_fee_usd: =cancellation_fee_usd, cancellation_fee_waived_on_payoff: =cancellation_fee_waived_on_payoff}
      Kessler GAP Commercial 130: {free_look_days: =free_look_days, cancellation_fee_usd: =cancellation_fee_usd, cancellation_fee_waived_on_payoff: =cancellation_fee_waived_on_payoff}
  measures: [gap_msr_unused_term_share]
- id: gap_evt_refund_payment
  subject: [gap_refund_paid, gap_lien_payoff_recorded]
  rule: A computed refund is paid within refund_payment_days calendar days after the cancellation or termination is processed, in one payment for the full amount due. Where refund_to_lienholder_while_lien_open is true and the waiver's loan_payoff_date is empty (the loan is still open), the refund is paid to the lienholder and reduces the loan; once the lienholder has reported the loan paid off, the refund is paid to the holder. A refund of 0.00 is not paid. A refund is paid only once per refund calculation. The payoff date is recorded only as the lienholder reports it; a holder's own statement that the loan is paid does not change the payee.
  eligibility:
  - id: pay_once
    applies_to: [gap_refund_paid]
    kind: dedup
    condition: A refund is paid only once per refund calculation.
    evidence_fields: [gap_ledger.source_entry_id, gap_ledger.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_ledger.source_entry_id]
      action_bindings: {gap_ledger.source_entry_id: source_entry_id}
    dedup_contract:
      table: gap_ledger
      mode: separate_record
      object_bindings: {source_entry_id: source_entry_id}
      duplicate_filters: {event_type: [gap_refund_paid]}
      distinct_fields: [entry_date]
- id: gap_evt_expiration
  subject: [gap_waiver_expired, gap_waiver_claim_settled]
  rule: A waiver expires at the end of its expiration_date when the contract runs to maturity, and it earns no refund at expiry. A waiver is expired or settled only from active status. A waiver whose GAP balance benefit is paid is settled on the payment date. Where transfer_on_assumption_allowed is false, a contract assumed by another borrower ends the waiver as a termination under gap_evt_cancellation_refund rather than passing it to the new borrower.
  eligibility:
  - id: active_to_close
    applies_to: [gap_waiver_expired, gap_waiver_claim_settled]
    kind: state
    condition: A waiver is expired or settled only from active status.
    evidence_fields: [gap_waivers.status, gap_waivers.gap_waiver_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [gap_waivers.gap_waiver_id]
      action_bindings: {gap_waivers.gap_waiver_id: gap_waiver_id}
    state_contract: {field: gap_waivers.status, allowed: [active]}
- id: gap_combo_addon_products
  subject: [gap_benefit_paid]
  rule: Holding other products financed on the same installment contract changes the GAP benefit. Where exclude_addon_refunds is true, the refunds of a Kessler Shield service contract or a Kessler Care maintenance plan financed on the same purchase deal are subtracted as addon_refunds_credited, because after a total loss those products are cancelled and their refunds go to the lienholder; the amount subtracted is the refund each product's own charter computes with the loss date as the effective cancellation date, whether or not the cancellation has yet been processed. Products bought for cash or outside the deal are not subtracted. Negative equity carried into the deal is read from the purchase deal (trade_payoff_amount less trade_in_allowance) and is subtracted only where exclude_negative_equity is true.
  eligibility: []
