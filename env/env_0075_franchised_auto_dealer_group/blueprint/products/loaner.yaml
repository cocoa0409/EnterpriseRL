events:
- type: loaner_dispatched
  target: loaner_agreements
  mutation: create
  meaning: A loaner is issued to a customer under a signed loaner agreement.
  grain: One row per agreement.
  fields:
    customer_id: driver
    store_id: issuing store
    loaner_vehicle_id: loaner unit
    repair_order_number: RO the loaner supports
    variant_name: program
    agreement_number: agreement number
    pay_basis: who pays the days
    daily_allowance_usd: paying program's daily allowance
    out_date: issue date
    due_date: due date
    extension_count: 0
    odometer_out: odometer at issue
    fuel_out_eighths: fuel at issue
  triggers: []
- type: loaner_due_date_extended
  target: loaner_agreements
  mutation: update
  meaning: The loaner's due date is extended while the customer's repair is delayed.
  grain: One update per extension.
  fields: {due_date: new due date, extension_count: previous count plus 1}
  triggers: []
- type: loaner_returned
  target: loaner_agreements
  mutation:
    transition: {from: out, to: returned}
  meaning: The loaner is checked back in.
  grain: One transition per agreement.
  fields: {return_date: check-in date, odometer_in: odometer at return, fuel_in_eighths: fuel at return}
  triggers: []
- type: loaner_closed
  target: loaner_agreements
  mutation:
    transition: {from: returned, to: closed}
  meaning: The agreement is closed once its balance is settled.
  grain: One transition per agreement.
  fields: {closed_date: closing date}
  triggers: []
- type: loaner_charge_posted
  target: loaner_charges
  meaning: A charge is posted on the agreement (rental days, allowance shortfall, excess mileage, fuel, late return, cleaning, smoking, pet hair, toll or citation administration, damage deductible, lost key, other-store return).
  grain: One entry per charge code per agreement (per toll or citation reference for those charges).
  distinguish_by: [charge_code, toll_reference]
  fields: {charge_date: posting date, charge_code: what is charged, quantity: units charged, unit_rate: rate per unit, amount: charge amount, toll_reference: toll or citation number, payment_method: not_applicable}
  account: loaner_receivable
  direction: in
  triggers: []
- type: loaner_charge_waived
  target: loaner_charges
  meaning: A posted charge is waived in whole or part.
  grain: One entry per charge waived.
  distinguish_by: [source_charge_id]
  fields: {charge_date: waiver date, source_charge_id: the charge waived, charge_code: charge code of the waived charge, amount: amount waived, payment_method: not_applicable}
  account: loaner_receivable
  direction: out
  triggers: []
- type: loaner_payment_received
  target: loaner_charges
  meaning: A payment is received on the agreement.
  grain: One entry per payment.
  distinguish_by: [charge_date, payment_method, amount]
  fields: {charge_date: date received, payment_method: how paid, amount: payment amount, charge_code: not_applicable}
  account: loaner_receivable
  direction: out
  triggers: []
measures:
- id: loaner_msr_charged_days
  window: The agreement from out_date to return_date.
  measure: Calendar dates from out_date to return_date, both included, less the courtesy days the agreement carries (courtesy_days_included plus any rewards bonus days) for dealer_courtesy agreements, floored at 0.
- id: loaner_msr_open_agreements
  window: Point in time at the frozen handling date.
  measure: Count of the customer's loaner_agreements of the same program in out status.
policies:
- id: loaner_agg_multi_holding
  subject: [loaner_dispatched]
  rule: A customer may have loaner agreements over time without limit; how many may be out at once is governed by loaner_agg_open_agreements.
  eligibility: []
  params: {max_per_customer: null}
- id: loaner_agg_open_agreements
  subject: [loaner_dispatched]
  rule: A customer may have at most max_open_agreements_per_customer agreements of one program out at the same time, counted by loaner_msr_open_agreements before the new one is issued; a retail customer with a loaner still out receives no second loaner until the first is returned. One repair order supports at most one courtesy or warranty loaner at a time.
  eligibility: []
  formula:
    issue_allowed: loaner_msr_open_agreements < max_open_agreements_per_customer
  measures: [loaner_msr_open_agreements]
- id: loaner_evt_issue
  subject: [loaner_dispatched]
  rule: A loaner is issued only to a driver at least min_driver_age years old with a valid license and, where proof_of_insurance_required is true, proof of the customer's own auto insurance, which is primary for the loaner; no damage waiver is sold where damage_waiver_available is false. A dealer-courtesy loaner requires a repair order with at least min_ro_labor_hours_for_courtesy labor hours sold and, where courtesy_requires_appointment is true, a service appointment reserved reservation_lead_days ahead. A second named driver of at least additional_driver_min_age years may be added only where additional_driver_allowed is true. The pay basis must be one of the program's eligible_pay_bases. The loaner leaves with at least fuel_level_out_min_eighths of a tank, and a card hold of security_deposit_hold_usd is placed where it is above 0.00. The due date is the out date plus the courtesy days for a dealer-courtesy loaner, or the date the repair is promised otherwise, never beyond max_loaner_days.
  eligibility: []
- id: loaner_evt_daily_cost
  subject: [loaner_charge_posted]
  rule: Rental days are counted by charge_day_basis. A dealer-courtesy loaner is free for courtesy_days_included days, plus rewards_bonus_courtesy_days days when the customer holds a Kessler Owner Rewards Gold or Kessler Owner Rewards Platinum service account in active status; days beyond them are charged at daily_rate_usd as charge_code daily_rental. A customer-rental loaner is charged daily_rate_usd for every day. A warranty or service contract loaner is paid by that program's daily_allowance_usd; where allowance_shortfall_billed is true, the daily rate above the allowance is billed to the customer as charge_code allowance_shortfall for each day the program pays, and days beyond the program's day limit are charged at daily_rate_usd. A fleet replacement unit is billed at daily_rate_usd to the fleet account on payment_due_days terms.
  eligibility: []
  params:
    per_tier:
      Same-Day Courtesy Loaner: {daily_rate_usd: =daily_rate_usd, courtesy_days_included: =courtesy_days_included, rewards_bonus_courtesy_days: =rewards_bonus_courtesy_days}
      Courtesy Loaner - Compact: {daily_rate_usd: =daily_rate_usd, courtesy_days_included: =courtesy_days_included, rewards_bonus_courtesy_days: =rewards_bonus_courtesy_days}
      Courtesy Loaner - Midsize: {daily_rate_usd: =daily_rate_usd, courtesy_days_included: =courtesy_days_included, rewards_bonus_courtesy_days: =rewards_bonus_courtesy_days}
      Courtesy Loaner - SUV: {daily_rate_usd: =daily_rate_usd, courtesy_days_included: =courtesy_days_included, rewards_bonus_courtesy_days: =rewards_bonus_courtesy_days}
      Warranty Rental Loaner: {daily_rate_usd: =daily_rate_usd, courtesy_days_included: =courtesy_days_included, rewards_bonus_courtesy_days: =rewards_bonus_courtesy_days}
      Fleet Replacement Unit: {daily_rate_usd: =daily_rate_usd, courtesy_days_included: =courtesy_days_included, rewards_bonus_courtesy_days: =rewards_bonus_courtesy_days}
  formula: {rental_charge: 'round(loaner_msr_charged_days * daily_rate_usd, 2)'}
  measures: [loaner_msr_charged_days]
- id: loaner_evt_return_charges
  subject: [loaner_returned, loaner_charge_posted]
  rule: At return the miles driven (odometer_in less odometer_out) are compared with mileage_allowance_per_day times the days of the agreement (courtesy and charged days alike); miles above the allowance plus excess_mileage_free_buffer_miles are charged at excess_mileage_rate_usd each. Fuel returned below the issue level is charged fuel_charge_per_eighth_usd per eighth short plus fuel_service_fee_usd once. A loaner returned after the due date plus late_return_grace_days calendar days is charged late_return_fee_per_day_usd for each further day, for at most late_fee_max_days days. The cleaning_fee_usd, smoking_fee_usd and pet_hair_fee_usd apply only when the check-in inspection records the condition; pets and smoking are not allowed where pets_allowed and smoking_allowed are false. A loaner returned to another group store where same_store_return_required is false is charged other_store_return_fee_usd; where it is true, the loaner must come back to the issuing store. Where after_hours_return_allowed is true a loaner dropped after hours is returned on the date it is checked in the next business morning; where it is false an after-hours drop counts as returned only at check-in during opening hours. Each charge code is posted once per agreement.
  eligibility: []
  formula:
    excess_miles_charge: round(max(0, odometer_in - odometer_out - mileage_allowance_per_day * loaner_msr_charged_days - excess_mileage_free_buffer_miles) * excess_mileage_rate_usd, 2)
    fuel_charge: round(max(0, fuel_out_eighths - fuel_in_eighths) * fuel_charge_per_eighth_usd, 2)
  measures: [loaner_msr_charged_days]
- id: loaner_evt_tolls_damage
  subject: [loaner_charge_posted]
  rule: Tolls and citations incurred during the agreement are passed on at their face amount through the toll authority or court and carry toll_admin_fee_usd per toll or citation_admin_fee_usd per citation, one entry per toll or citation reference. Damage to the loaner during the agreement is claimed first on the customer's own insurance; the customer owes at most damage_deductible_usd per agreement. A lost or unreturned key fob is charged lost_key_fee_usd. Use for ride-hailing or delivery platforms is prohibited where rideshare_use_prohibited is true, towing only where tow_hitch_use_allowed is true, business use only where commercial_use_allowed is true, and travel beyond max_trip_radius_miles is never allowed, while leaving the issuing store's state is allowed only where out_of_state_travel_allowed is true. Where toll_transponder_included is true tolls are recorded by the transponder; otherwise they are billed by plate through the toll authority, with the same administrative fee.
  eligibility: []
- id: loaner_evt_extension
  subject: [loaner_due_date_extended]
  rule: The due date is extended only on an agreement in out status. Where extension_requires_open_ro is true, an extension is granted only while the supported repair order is still open (the repair is delayed by parts or diagnosis), never for the customer's convenience once the repair is complete. An agreement may be extended at most max_due_date_extensions times, and never beyond max_loaner_days after the out date. A loaner still out unreturned_vehicle_report_days calendar days after its due date is reported to police as an unreturned vehicle.
  eligibility:
  - id: out_to_extend
    applies_to: [loaner_due_date_extended]
    kind: state
    condition: The due date is extended only on an agreement in out status.
    evidence_fields: [loaner_agreements.status, loaner_agreements.loaner_agreement_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loaner_agreements.loaner_agreement_id]
      action_bindings: {loaner_agreements.loaner_agreement_id: loaner_agreement_id}
    state_contract: {field: loaner_agreements.status, allowed: [out]}
  formula: {extension_allowed: extension_count < max_due_date_extensions}
- id: loaner_evt_settlement
  subject: [loaner_payment_received, loaner_charge_waived, loaner_closed]
  rule: Retail balances are paid at return; a fleet replacement unit's balance is due payment_due_days calendar days after return. A charge caused by the store (a loaner issued below the fuel level recorded, a late return because the store had not finished the repair by the due date it set) is waived in full by one loaner_charge_waived entry pointing at it. An agreement is closed only when it is in returned status and its balance is 0.00.
  eligibility:
  - id: returned_to_close
    applies_to: [loaner_closed]
    kind: state
    condition: An agreement is closed only when it is in returned status and its balance is 0.00.
    evidence_fields: [loaner_agreements.status, loaner_agreements.open_balance, loaner_agreements.loaner_agreement_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loaner_agreements.loaner_agreement_id]
      action_bindings: {loaner_agreements.loaner_agreement_id: loaner_agreement_id}
    state_contract: {field: loaner_agreements.status, allowed: [returned]}
