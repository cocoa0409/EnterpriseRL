category: loaner
display_name: Courtesy Transportation Agreements
binding:
  holding_table: loaner_agreements
  event_tables: [loaner_charges]
  status_field: status
  variant_field: variant_name
  quantity_fields: {open_balance: loaner_receivable}
lifecycle: {states: [out, returned, closed], transitions: [{from: out, to: returned, by: agent, means: The loaner is checked back in with its odometer and fuel level recorded.}, {from: returned, to: closed, by: agent, means: Every charge on the agreement is settled and the agreement is closed.}]}
accounts:
- key: loaner_receivable
  unit: USD
  meaning: Amount the customer owes on one loaner agreement; charges increase it, waivers and payments reduce it.
parameter_schema:
  daily_rate_usd: Daily rate charged when the customer pays for the loaner, USD per calendar day.
  courtesy_days_included: Calendar days of a dealer-courtesy loaner provided free of charge per repair order.
  min_ro_labor_hours_for_courtesy: Least labor hours sold on the repair order for a dealer-courtesy loaner.
  courtesy_requires_appointment: Switch (true/false) — whether a dealer-courtesy loaner requires a scheduled service appointment.
  reservation_lead_days: Calendar days ahead a loaner must be reserved with the appointment.
  rewards_bonus_courtesy_days: Extra courtesy days given to holders of a Kessler Owner Rewards Gold or Platinum service account.
  eligible_pay_bases: List of pay_basis values the program may be issued under.
  allowance_shortfall_billed: Switch (true/false) — whether the daily rate above a warranty or service contract allowance is billed to the customer.
  charge_day_basis: How rental days are counted (calendar_day = every calendar date from out date to return date, both included).
  max_loaner_days: Most days one agreement may run, including extensions.
  max_due_date_extensions: Most times the due date may be extended.
  extension_requires_open_ro: Switch (true/false) — whether the due date is extended only while the repair order is still open.
  mileage_allowance_per_day: Miles per charged or courtesy day included free.
  excess_mileage_free_buffer_miles: Miles above the allowance not charged.
  excess_mileage_rate_usd: Charge per mile above the allowance and buffer, USD.
  fuel_level_out_min_eighths: Least fuel level (eighths of a tank) at which the loaner is issued.
  fuel_charge_per_eighth_usd: Charge per eighth of a tank returned below the issue level, USD.
  fuel_service_fee_usd: Flat refueling service fee added when a fuel charge applies, USD.
  late_return_grace_days: Calendar days after the due date before late return is charged.
  late_return_fee_per_day_usd: Charge per calendar day returned late beyond the grace, USD.
  late_fee_max_days: Most late days charged on one agreement.
  unreturned_vehicle_report_days: Calendar days after the due date at which an unreturned loaner is reported to police as unreturned.
  cleaning_fee_usd: Fee for a loaner returned needing more than ordinary cleaning, USD.
  smoking_fee_usd: Fee for smoking in the loaner, USD.
  pet_hair_fee_usd: Fee for pet hair removal, USD.
  toll_admin_fee_usd: Administrative fee per toll transaction passed on, USD.
  citation_admin_fee_usd: Administrative fee per parking or traffic citation passed on, USD.
  damage_deductible_usd: Most the customer owes for damage to the loaner during the agreement, USD.
  lost_key_fee_usd: Fee for a lost or unreturned key fob, USD.
  security_deposit_hold_usd: Card authorization hold placed at issue, USD; 0.00 means none.
  min_driver_age: Least age of the driver.
  proof_of_insurance_required: Switch (true/false) — whether the customer's own auto insurance must be shown and is primary for the loaner.
  damage_waiver_available: Switch (true/false) — whether a damage waiver can be bought.
  additional_driver_allowed: Switch (true/false) — whether a second named driver may be added.
  additional_driver_min_age: Least age of an additional driver.
  out_of_state_travel_allowed: Switch (true/false) — whether the loaner may leave the issuing store's state.
  max_trip_radius_miles: Greatest distance from the issuing store the loaner may be driven.
  pets_allowed: Switch (true/false) — whether pets may ride in the loaner.
  smoking_allowed: Switch (true/false) — whether smoking is allowed in the loaner.
  tow_hitch_use_allowed: Switch (true/false) — whether towing with the loaner is allowed.
  commercial_use_allowed: Switch (true/false) — whether the loaner may be used for business deliveries or hauling.
  rideshare_use_prohibited: Switch (true/false) — whether use for ride-hailing or delivery platforms is prohibited.
  toll_transponder_included: Switch (true/false) — whether the loaner carries a toll transponder.
  same_store_return_required: Switch (true/false) — whether the loaner must be returned to the issuing store.
  other_store_return_fee_usd: Fee when the loaner is returned to another group store, USD.
  after_hours_return_allowed: Switch (true/false) — whether the loaner may be dropped after hours (return date is the next business morning's check-in date).
  max_open_agreements_per_customer: Most agreements of the program one customer may have out at once.
  payment_due_days: Calendar days after return within which the balance must be paid (0 = at return).
