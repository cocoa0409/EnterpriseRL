category: purchase
display_name: Vehicle Purchase Agreements
binding:
  holding_table: purchase_deals
  event_tables: [purchase_transactions]
  intake_tables: [purchase_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deposit_held_balance: deposit_held, balance_due: deal_receivable}
lifecycle: {states: [reserved, contracted, conditionally_delivered, delivered, closed, cancelled, released, unwound], transitions: [{from: reserved, to: contracted, by: agent, means: 'The buyer''s signed buyer''s order (and installment contract, if financed) is recorded against the reserved vehicle.'}, {from: contracted, to: delivered, by: agent, means: The buyer takes final delivery with financing approved or funds in hand.}, {from: contracted, to: conditionally_delivered, by: agent, means: The buyer takes possession on a spot delivery while the installment contract still awaits lender approval.}, {from: conditionally_delivered, to: delivered, by: system, means: 'The assigned lender approves the installment contract as written, making the delivery final.'}, {from: conditionally_delivered, to: unwound, by: agent, means: 'No lender approved the contract within the spot-delivery window, so the vehicle is returned and the deal is unwound.'}, {from: delivered, to: unwound, by: user, means: The buyer returns the delivered vehicle under the exchange policy by signing an exchange-return request.}, {from: delivered, to: closed, by: system, means: 'Every charge is paid or funded and the balance due reaches 0.00, so the deal is finalized.'}, {from: reserved, to: cancelled, by: user, means: The buyer signs a reservation cancellation releasing the held vehicle.}, {from: contracted, to: cancelled, by: user, means: The buyer signs a contract cancellation before taking delivery.}, {from: reserved, to: released, by: system, means: 'The hold lapses at the end of its last hold day without a signed buyer''s order, and the vehicle returns to stock.'}]}
accounts:
- key: deposit_held
  unit: USD
  meaning: Deposit money the store holds against one deal before it is applied to the deal at delivery, refunded or forfeited.
- key: deal_receivable
  unit: USD
  meaning: Amount the buyer or the buyer's lender still owes on one deal; posted charges and returned or refunded payments increase it, payments, credits and charge reversals reduce it.
parameter_schema:
  deposit_min_usd: Smallest reservation deposit the store accepts to place a vehicle on hold, USD.
  deposit_max_usd: Largest total deposit the store holds on one deal before contract, USD.
  deposit_methods_allowed: List of payment methods (payment_method enum values) accepted for a deposit.
  deposit_card_max_usd: Largest part of the deposits on one deal that may be paid by credit card, USD.
  deal_card_payment_cap_usd: Largest total paid by credit card on one deal across deposits and payments, USD.
  deposit_nonrefundable_portion_usd: Part of the deposit that becomes non-refundable once the reservation is placed (the order is transmitted to the factory), USD; 0.00 means fully refundable.
  deposit_refund_days: Calendar days after the triggering cancellation, release or unwind within which a deposit refund is issued.
  deposit_forfeit_on_hold_lapse: Switch (true/false) — whether the non-refundable portion is kept when the hold lapses without contract.
  hold_requires_deposit: Switch (true/false) — whether a vehicle hold can be placed only with a deposit received the same day.
  vehicle_hold_days: Calendar days a reserved vehicle is held, counted from the reservation date (the reservation date is day 0).
  hold_extension_days: Calendar days one hold extension adds to the current hold expiry date.
  max_hold_extensions: Largest number of hold extensions one deal may receive.
  max_open_reservations_per_customer: Largest number of deals of this deal type one customer may have in reserved status at the same time.
  doc_fee_by_store_usd: Per-store mapping (store_code -> USD) of the documentary service fee posted by each store.
  doc_fee_price_pct_ceiling: Ceiling on the documentary service fee as a fraction of the cash price (e.g. 0.10 = 10 percent).
  doc_fee_waived: Switch (true/false) — whether the documentary service fee is waived for this deal type.
  electronic_filing_fee_usd: Flat electronic title and registration filing service fee per deal, USD.
  title_application_days: Calendar days after delivery within which the store files the buyer's title application.
  delivery_window_days: Calendar days after the contract date within which the store must deliver the vehicle.
  late_delivery_cancel_waives_fee: Switch (true/false) — whether a contract cancellation after a missed delivery window is free of the cancellation fee and the non-refundable portion.
  contract_cancellation_fee_usd: Amount retained from the deposit when a contracted but undelivered deal is cancelled by the buyer, USD.
  home_delivery_available: Switch (true/false) — whether home delivery is offered for this deal type.
  home_delivery_free_radius_miles: One-way miles from the store within which home delivery is free.
  home_delivery_per_mile_usd: Charge per one-way mile beyond the free radius, USD.
  home_delivery_min_fee_usd: Minimum home delivery fee once the distance exceeds the free radius, USD.
  home_delivery_max_miles: Greatest one-way distance to which the store will deliver.
  buyers_guide_type: Warranty box checked on the FTC Used Car Buyers Guide (as_is_no_dealer_warranty / dealer_limited_warranty / manufacturer_certified_warranty) or not_applicable_new_vehicle.
  exchange_window_days: Calendar days after delivery within which a delivered vehicle may be returned for exchange; 0 means no exchange.
  exchange_mile_limit: Greatest miles driven since delivery at which an exchange return is accepted.
  exchange_free_miles: Miles driven since delivery that are not charged on an exchange return.
  exchange_mileage_charge_per_mile_usd: Charge per mile driven beyond the free miles on an exchange return, USD.
  exchange_restocking_fee_usd: Flat restocking fee posted on an exchange return, USD.
  trade_appraisal_valid_days: Calendar days after the appraisal date during which a trade-in appraisal is honored.
  trade_appraisal_mile_tolerance: Miles the trade-in may be driven after appraisal before the appraisal must be redone.
  trade_payoff_business_days: Business days (Monday to Friday excluding US federal holidays) after delivery within which the store pays off the trade-in lien.
  trade_payoff_late_reimbursement: Switch (true/false) — whether the store reimburses lender late charges caused by a payoff made after the payoff deadline.
  negative_equity_due_days: Calendar days after delivery within which negative trade equity not financed must be paid.
  spot_delivery_allowed: Switch (true/false) — whether spot delivery before lender approval is offered.
  spot_delivery_window_days: Calendar days after the delivery date within which a lender must approve a spot-delivered contract.
  spot_delivery_mileage_charge_allowed: Switch (true/false) — whether miles driven during a failed spot delivery may be charged.
  rate_markup_cap_points: Largest number of APR percentage points by which the contract APR may exceed the lender buy rate.
  balance_due_days_after_delivery: Calendar days after delivery by which any balance due must be paid.
  late_balance_assess_after_days: Calendar days after the delivery date after which a balance still unpaid draws a late balance fee (the balance due days plus the grace allowed).
  late_balance_fee_pct_per_month: Late balance fee as a fraction of the balance due, per calendar month assessed.
  late_balance_min_fee_usd: Minimum late balance fee per assessment, USD.
  returned_payment_fee_usd: Fee posted when a check or ACH payment is returned unpaid, USD.
  returned_payment_certified_funds_days: Calendar days after a returned payment during which further payments must be cash, cashier's check or debit card.
  fleet_volume_min_units: Fleet units the customer must take delivery of in the calendar year for the fleet incentive to apply; 0 means no fleet incentive.
  fleet_incentive_per_unit_usd: Manufacturer fleet incentive credited per qualifying unit, USD.
  open_recall_delivery_block: Switch (true/false) — whether a vehicle with an open safety recall without a completed remedy may not be delivered.
