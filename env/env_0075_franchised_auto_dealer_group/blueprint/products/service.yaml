events:
- type: service_account_opened
  target: service_accounts
  mutation: create
  meaning: A customer's service account is opened at a tier (one account per customer, used at every store).
  grain: One row per customer.
  fields: {customer_id: account holder, home_store_id: opening store, variant_name: tier opened, account_number: account number, opened_date: opening date, credit_limit: approved credit limit (0.00 for retail tiers)}
  triggers:
  - event: service:service_points_earned
    when: {variant_name: Kessler Owner Rewards Silver}
    map: {line_date: opened_date, line_letter: not_applicable}
- type: service_tier_changed
  target: service_accounts
  mutation: update
  meaning: The account's tier is changed at the annual Owner Rewards review, on enrollment, or on approval of a fleet credit application.
  grain: One update per tier change.
  fields: {variant_name: new tier, credit_limit: credit limit of the new tier}
  triggers: []
- type: service_account_hold
  target: service_accounts
  mutation:
    transition: {from: active, to: credit_hold}
  meaning: A fleet account is placed on credit hold for a past-due invoice.
  grain: One transition per hold episode.
  fields: {status: credit_hold}
  triggers: []
- type: service_account_reinstated
  target: service_accounts
  mutation:
    transition: {from: credit_hold, to: active}
  meaning: A fleet account on credit hold is reinstated after its past-due balance is paid.
  grain: One transition per hold episode.
  fields: {status: active}
  triggers: []
- type: service_account_closed
  target: service_accounts
  mutation:
    transition: {from: active, to: closed}
  meaning: The account is closed at the account holder's request.
  grain: One transition per account.
  fields: {closed_date: closing date, variant_name: tier held at closing (unchanged by the closure), rewards_points_balance: points still available at closing}
  triggers:
  - event: service:service_points_expired
    when:
      variant_name: [Kessler Owner Rewards Silver, Kessler Owner Rewards Gold, Kessler Owner Rewards Platinum]
      rewards_points_balance: {not: 0}
    map: {line_date: closed_date, line_letter: not_applicable}
- type: service_diagnostic_fee_charged
  target: service_ro_lines
  meaning: A customer-pay diagnostic fee is charged for diagnosing one concern line.
  grain: One row per concern line diagnosed on customer pay.
  distinguish_by: [repair_order_number, line_letter]
  fields:
    store_id: store
    vehicle_id: vehicle
    repair_order_number: RO number
    line_letter: concern line
    line_date: diagnosis date
    pay_type: customer_pay
    labor_hours: diagnostic hours
    labor_rate: store labor rate
    list_amount: hours times rate
    amount: diagnostic fee
    odometer_in: odometer at check-in
  account: service_receivable
  direction: in
  triggers: []
- type: service_labor_charged
  target: service_ro_lines
  meaning: Labor the customer owes on one concern line is charged (customer-pay work, or a deductible owed on covered work).
  grain: One row per concern line labor operation.
  distinguish_by: [repair_order_number, line_letter]
  fields:
    store_id: store
    vehicle_id: vehicle
    repair_order_number: RO number
    line_letter: concern line
    line_date: line close date
    pay_type: basis on which the customer owes the row
    labor_hours: flat-rate hours
    labor_rate: store labor rate
    list_amount: hours times rate
    amount: labor charged after discount
    odometer_in: odometer at check-in
  account: service_receivable
  direction: in
  triggers: []
- type: service_parts_charged
  target: service_ro_lines
  meaning: Parts the customer owes on one concern line are charged.
  grain: One row per concern line parts total.
  distinguish_by: [repair_order_number, line_letter]
  fields:
    store_id: store
    vehicle_id: vehicle
    repair_order_number: RO number
    line_letter: concern line
    line_date: line close date
    pay_type: basis on which the customer owes the row
    list_amount: parts list price total
    amount: parts charged after discount
    odometer_in: odometer at check-in
  account: service_receivable
  direction: in
  triggers: []
- type: service_shop_fee_charged
  target: service_ro_lines
  meaning: A repair-order-level shop fee is charged (shop supplies, hazardous waste, tire disposal, storage, mobile service trip, returned payment, parts restocking or special-order deposit).
  grain: One row per fee code per repair order.
  distinguish_by: [repair_order_number, fee_code]
  fields:
    store_id: store
    vehicle_id: vehicle
    repair_order_number: RO number
    line_letter: not_applicable
    line_date: posting date
    pay_type: customer_pay
    amount: fee amount
    quantity: tires or storage days the fee counts
    fee_code: which fee
  account: service_receivable
  direction: in
  triggers: []
- type: service_line_credited
  target: service_ro_lines
  meaning: A credit reduces what the customer owes on a repair order (diagnostic applied to repair, estimate overage, comeback repair, goodwill, rewards redemption, early-payment discount).
  grain: One row per credit reason per source charge.
  distinguish_by: [source_line_id, credit_reason]
  fields:
    repair_order_number: RO number
    line_letter: concern line of the source charge (not_applicable for RO-level credits)
    line_date: credit date
    source_line_id: the charge row credited
    credit_reason: why the credit was given
    amount: credit amount
  account: service_receivable
  direction: out
  triggers: []
- type: service_payment_received
  target: service_ro_lines
  meaning: A payment is received against a repair order.
  grain: One row per payment received.
  distinguish_by: [repair_order_number, line_date, payment_method, amount]
  fields: {repair_order_number: RO number paid, line_letter: not_applicable, line_date: date received, payment_method: how paid, amount: payment amount}
  account: service_receivable
  direction: out
  triggers: []
- type: service_payment_returned
  target: service_ro_lines
  meaning: A check or ACH payment is returned unpaid and its credit is taken back.
  grain: One row per returned payment.
  distinguish_by: [source_line_id]
  fields: {repair_order_number: RO number of the payment, line_letter: not_applicable, line_date: date the return was received, source_line_id: the payment row returned, payment_method: method of the returned payment, amount: returned amount}
  account: service_receivable
  direction: in
  triggers:
  - event: service:service_shop_fee_charged
    when: {payment_method: [check, ach]}
    map: {repair_order_number: repair_order_number, line_date: line_date, fee_code: returned_payment, line_letter: not_applicable}
- type: service_late_fee_charged
  target: service_ro_lines
  meaning: A monthly late fee is assessed on a fleet account's past-due balance.
  grain: One row per account per billing month.
  distinguish_by: [billing_month]
  fields: {line_letter: not_applicable, line_date: assessment date, billing_month: month assessed, amount: late fee}
  account: service_receivable
  direction: in
  triggers: []
- type: service_points_earned
  target: service_ro_lines
  meaning: Owner Rewards points are credited for a paid customer-pay repair order or as an enrollment bonus.
  grain: One row per repair order (or one enrollment bonus per account).
  distinguish_by: [repair_order_number, line_date]
  fields:
    repair_order_number: RO number earning the points (empty for the enrollment bonus)
    line_letter: not_applicable
    line_date: date credited
    points: points credited
  account: rewards_points
  direction: in
  triggers: []
- type: service_points_redeemed
  target: service_ro_lines
  meaning: Owner Rewards points are redeemed toward a repair order.
  grain: One row per redemption.
  distinguish_by: [repair_order_number, line_date]
  fields: {repair_order_number: RO number paid with points, line_letter: not_applicable, line_date: redemption date, points: points redeemed, amount: dollar value of the points redeemed}
  account: rewards_points
  direction: out
  triggers:
  - event: service:service_line_credited
    map: {repair_order_number: repair_order_number, line_date: line_date, amount: amount, credit_reason: rewards_redemption, line_letter: not_applicable}
- type: service_points_expired
  target: service_ro_lines
  meaning: Unredeemed points expire at month end after their expiry period, or are forfeited when the account closes.
  grain: One row per account per expiry month.
  distinguish_by: [billing_month, line_date]
  fields: {line_letter: not_applicable, line_date: expiry or forfeiture date, billing_month: month in which the points expired, points: points removed}
  account: rewards_points
  direction: out
  triggers: []
measures:
- id: service_msr_rolling_customer_pay_spend
  window: The tier_review_window_months calendar months ending on the day before the review date (the anniversary of opened_date).
  measure: Sum of amount over the account's service_labor_charged and service_parts_charged rows with pay_type customer_pay and line_date inside the window, less the amount of service_line_credited rows pointing at those rows.
- id: service_msr_ro_customer_pay_total
  window: One repair order.
  measure: Sum of amount over the repair order's service_labor_charged and service_parts_charged rows with pay_type customer_pay, less service_line_credited rows on those rows other than rewards_redemption and early_payment_discount.
- id: service_msr_expiring_points
  window: Points earned in calendar months whose expiry (points_expiry_months after the month earned) has ended by the frozen handling date.
  measure: Points of service_points_earned rows in those months, less all points ever redeemed or expired on the account (redemptions and expiries consume the oldest points first), floored at 0.
- id: service_msr_oldest_past_due_days
  window: Point in time at the frozen handling date.
  measure: Calendar days between the due date (line_date plus payment_due_days) of the oldest repair order that still has an unpaid customer-pay balance and the frozen handling date; 0 when nothing is past due.
policies:
- id: service_agg_multi_holding
  subject: [service_account_opened]
  rule: A customer holds at most one service account, and it is used at every store of the group; a tier change updates the existing account rather than opening a second one. A customer who already has a service account that is not closed cannot open another.
  eligibility:
  - id: one_account_per_customer
    applies_to: [service_account_opened]
    kind: dedup
    condition: A customer who already has a service account that is not closed cannot open another.
    evidence_fields: [service_accounts.customer_id, service_accounts.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_accounts.customer_id]
      action_bindings: {service_accounts.customer_id: customer_id}
    dedup_contract:
      table: service_accounts
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters: {status: [active, credit_hold]}
      distinct_fields: [service_account_id]
  params: {max_per_customer: 1}
- id: service_evt_labor_pricing
  subject: [service_labor_charged]
  rule: Customer-pay labor is billed at flat-rate hours times the posted labor rate of the store that wrote the repair order (labor_rate_by_store_usd, looked up by store_code), giving list_amount. The tier's labor_discount_pct is applied to list_amount and the result is rounded to the cent; the labor discount in dollars on one repair order may not exceed max_labor_discount_usd_per_ro, and any discount beyond the cap is not given. A deductible owed on covered work is posted as a labor row with pay_type service_contract_deductible or warranty_deductible, 0.0 hours and the deductible amount, and receives no discount. Work paid by a manufacturer warranty, a recall, a service contract or a maintenance plan is never billed to the customer here; it is recorded in that program's own records.
  eligibility: []
  params:
    per_tier:
      Service Guest Account: {labor_discount_pct: =labor_discount_pct, max_labor_discount_usd_per_ro: =max_labor_discount_usd_per_ro}
      Kessler Owner Rewards Silver: {labor_discount_pct: =labor_discount_pct, max_labor_discount_usd_per_ro: =max_labor_discount_usd_per_ro}
      Kessler Owner Rewards Gold: {labor_discount_pct: =labor_discount_pct, max_labor_discount_usd_per_ro: =max_labor_discount_usd_per_ro}
      Kessler Owner Rewards Platinum: {labor_discount_pct: =labor_discount_pct, max_labor_discount_usd_per_ro: =max_labor_discount_usd_per_ro}
      Commercial Fleet Account - Net 15: {labor_discount_pct: =labor_discount_pct, max_labor_discount_usd_per_ro: =max_labor_discount_usd_per_ro}
      Commercial Fleet Account - Net 30: {labor_discount_pct: =labor_discount_pct, max_labor_discount_usd_per_ro: =max_labor_discount_usd_per_ro}
  formula: {list_amount: 'round(labor_hours * labor_rate, 2)', labor_amount: 'round(list_amount * (1 - labor_discount_pct), 2)'}
- id: service_evt_parts_pricing
  subject: [service_parts_charged, service_shop_fee_charged]
  rule: Customer-pay parts are billed at parts list price less the tier's parts_discount_pct, rounded to the cent per concern line; where discount_excludes_tires is true, tires are billed at list price with no discount. Parts the customer supplies are installed only where the tier's customer_supplied_parts_allowed is true, are not billed, and carry no repair warranty. A special-order part (not stocked, ordered for this customer) requires a deposit of special_order_parts_deposit_pct of its price when ordered, posted as fee_code special_order_deposit and applied to the part when installed; a special-order part the customer cancels after it is ordered is charged special_order_parts_restocking_pct of its price as fee_code parts_restocking, and the rest of the deposit is credited back.
  eligibility: []
  formula: {parts_amount: 'round(list_amount * (1 - parts_discount_pct), 2)'}
- id: service_evt_diagnostic
  subject: [service_diagnostic_fee_charged, service_line_credited]
  rule: Diagnosing a customer concern on customer pay is charged at diagnostic_fee_hours times the store's posted labor rate, rounded to the cent, with no tier discount; one diagnostic fee is charged per concern line. Where diagnostic_fee_waived_when_covered is true and the diagnosed failure is then repaired under a recall, the manufacturer warranty or a service contract, no diagnostic fee is charged, and a fee already posted for that line is credited in full. Where the tier's diagnostic_credit_on_repair is true, the diagnostic fee is credited at diagnostic_credit_pct when the customer authorizes the customer-pay repair of the same concern line. A diagnostic credit is given only when the repair is authorized within diagnostic_credit_window_days calendar days after the diagnosis date. A declined estimate, or an authorization after the window, leaves the diagnostic fee owed in full. A diagnostic fee is credited at most once. Calendar days are added to the line_date of the diagnostic fee row (the diagnosis date is day 0), and the authorization's decided_date must fall on or before the last day.
  eligibility:
  - id: authorized_within_window
    applies_to: [service_line_credited]
    kind: time
    condition: A diagnostic credit is given only when the repair is authorized within diagnostic_credit_window_days calendar days after the diagnosis date.
    evidence_fields: [service_ro_lines.line_date, service_repair_authorizations.decided_date, service_repair_authorizations.decision, service_ro_lines.repair_order_number, service_ro_lines.line_letter]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_ro_lines.repair_order_number, service_ro_lines.line_letter]
      action_bindings: {service_ro_lines.repair_order_number: repair_order_number, service_ro_lines.line_letter: line_letter}
    temporal_basis:
      clock: frozen_time
      anchor_event: the diagnosis date
      anchor_source: service_ro_lines.line_date
      relation: not_after
      duration_source: variants.diagnostic_credit_window_days
      unit: calendar_days
      counting_rule: Calendar days are added to the line_date of the diagnostic fee row (the diagnosis date is day 0), and the authorization's decided_date must fall on or before the last day.
      boundary: inclusive
  - id: one_diagnostic_credit
    applies_to: [service_line_credited]
    kind: dedup
    condition: A diagnostic fee is credited at most once.
    evidence_fields: [service_ro_lines.source_line_id, service_ro_lines.credit_reason]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_ro_lines.source_line_id]
      action_bindings: {service_ro_lines.source_line_id: source_line_id}
    dedup_contract:
      table: service_ro_lines
      mode: separate_record
      object_bindings: {source_line_id: source_line_id}
      duplicate_filters: {credit_reason: [diagnostic_applied_to_repair]}
      distinct_fields: [line_date]
  params:
    per_tier:
      Service Guest Account: {diagnostic_fee_hours: =diagnostic_fee_hours, diagnostic_credit_pct: =diagnostic_credit_pct, diagnostic_credit_window_days: =diagnostic_credit_window_days}
      Kessler Owner Rewards Silver: {diagnostic_fee_hours: =diagnostic_fee_hours, diagnostic_credit_pct: =diagnostic_credit_pct, diagnostic_credit_window_days: =diagnostic_credit_window_days}
      Kessler Owner Rewards Gold: {diagnostic_fee_hours: =diagnostic_fee_hours, diagnostic_credit_pct: =diagnostic_credit_pct, diagnostic_credit_window_days: =diagnostic_credit_window_days}
      Kessler Owner Rewards Platinum: {diagnostic_fee_hours: =diagnostic_fee_hours, diagnostic_credit_pct: =diagnostic_credit_pct, diagnostic_credit_window_days: =diagnostic_credit_window_days}
      Commercial Fleet Account - Net 15: {diagnostic_fee_hours: =diagnostic_fee_hours, diagnostic_credit_pct: =diagnostic_credit_pct, diagnostic_credit_window_days: =diagnostic_credit_window_days}
      Commercial Fleet Account - Net 30: {diagnostic_fee_hours: =diagnostic_fee_hours, diagnostic_credit_pct: =diagnostic_credit_pct, diagnostic_credit_window_days: =diagnostic_credit_window_days}
  formula: {diagnostic_fee: 'round(diagnostic_fee_hours * labor_rate, 2)', diagnostic_credit: 'round(diagnostic_credit_pct * amount, 2)'}
- id: service_evt_estimate
  subject: [service_labor_charged, service_parts_charged, service_line_credited]
  rule: Customer-pay work on a concern line expected to exceed estimate_required_threshold_usd is done only after the customer authorizes a written estimate for that line; the authorization is the customer's own decision, recorded as a repair authorization with decision authorized. Customer-pay work above the estimate threshold is billed only on a line the customer has authorized. A fleet account authorizes in advance any concern line up to fleet_preauthorized_repair_limit_usd and needs no separate decision below that amount. The customer-pay labor and parts billed on an authorized line may exceed the authorized estimate_amount by at most estimate_overage_tolerance_pct of it; anything billed beyond that tolerance without a further authorization is credited back as credit_reason estimate_overage. A declined line is not worked and is not billed beyond its diagnostic fee.
  eligibility:
  - id: line_authorized
    applies_to: [service_labor_charged, service_parts_charged]
    kind: authorization
    condition: Customer-pay work above the estimate threshold is billed only on a line the customer has authorized.
    evidence_fields: [service_repair_authorizations.repair_order_number, service_repair_authorizations.line_letter, service_repair_authorizations.decision]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_repair_authorizations.repair_order_number, service_repair_authorizations.line_letter]
      action_bindings: {service_repair_authorizations.repair_order_number: repair_order_number, service_repair_authorizations.line_letter: line_letter}
- id: service_evt_shop_fees
  subject: [service_shop_fee_charged]
  rule: Repair-order-level shop fees are charged once per repair order per fee_code. Shop supplies are shop_supplies_pct of the repair order's customer-pay labor amount after discount, rounded to the cent and capped at shop_supplies_cap_usd; no shop supplies fee is charged on a repair order without customer-pay labor. The hazardous waste fee hazardous_waste_fee_usd is charged once on a repair order with a customer-pay oil, fluid or filter service. The tire disposal fee is tire_disposal_fee_per_tire_usd times the number of scrap tires removed on customer-pay tire replacement, with quantity recording the tires. Storage is charged when a finished vehicle is not collected within storage_free_days calendar days after the completion notice; the fee is storage_fee_per_day_usd times each further calendar day up to the day of pickup, with quantity recording the chargeable days. Mobile service is offered within mobile_service_radius_miles of the store and carries the trip fee mobile_service_fee_usd per visit. A fee whose amount works out to 0.00 is not posted.
  eligibility: []
  params:
    per_tier:
      Service Guest Account: {shop_supplies_pct: =shop_supplies_pct, shop_supplies_cap_usd: =shop_supplies_cap_usd, hazardous_waste_fee_usd: =hazardous_waste_fee_usd, mobile_service_fee_usd: =mobile_service_fee_usd}
      Kessler Owner Rewards Silver: {shop_supplies_pct: =shop_supplies_pct, shop_supplies_cap_usd: =shop_supplies_cap_usd, hazardous_waste_fee_usd: =hazardous_waste_fee_usd, mobile_service_fee_usd: =mobile_service_fee_usd}
      Kessler Owner Rewards Gold: {shop_supplies_pct: =shop_supplies_pct, shop_supplies_cap_usd: =shop_supplies_cap_usd, hazardous_waste_fee_usd: =hazardous_waste_fee_usd, mobile_service_fee_usd: =mobile_service_fee_usd}
      Kessler Owner Rewards Platinum: {shop_supplies_pct: =shop_supplies_pct, shop_supplies_cap_usd: =shop_supplies_cap_usd, hazardous_waste_fee_usd: =hazardous_waste_fee_usd, mobile_service_fee_usd: =mobile_service_fee_usd}
      Commercial Fleet Account - Net 15: {shop_supplies_pct: =shop_supplies_pct, shop_supplies_cap_usd: =shop_supplies_cap_usd, hazardous_waste_fee_usd: =hazardous_waste_fee_usd, mobile_service_fee_usd: =mobile_service_fee_usd}
      Commercial Fleet Account - Net 30: {shop_supplies_pct: =shop_supplies_pct, shop_supplies_cap_usd: =shop_supplies_cap_usd, hazardous_waste_fee_usd: =hazardous_waste_fee_usd, mobile_service_fee_usd: =mobile_service_fee_usd}
  formula: {tire_disposal_fee: 'round(quantity * tire_disposal_fee_per_tire_usd, 2)', storage_fee: 'round(quantity * storage_fee_per_day_usd, 2)'}
- id: service_evt_payment_terms
  subject: [service_payment_received, service_line_credited, service_late_fee_charged, service_account_hold, service_account_reinstated]
  rule: Retail tiers pay each repair order in full at pickup by a method in the tier's payment_methods_allowed. A fleet repair order is invoiced on its line date and is due payment_due_days calendar days later. A fleet invoice paid in full within early_pay_discount_days calendar days after its line date earns an early-payment discount of early_pay_discount_pct of its customer-pay total, rounded to the cent and credited as credit_reason early_payment_discount; a partial payment earns none. A late fee is assessed only when the handling date is later than the due date of the oldest unpaid invoice plus late_fee_grace_days calendar days. The late fee is late_fee_pct_per_month times the past-due balance at assessment, rounded to the cent, never less than late_fee_min_usd, assessed at most once per calendar month (billing_month). A fleet account goes on credit hold when service_msr_oldest_past_due_days reaches credit_hold_days_past_due, or when open_balance exceeds credit_limit; while on credit hold, new repair orders are written only for payment at pickup. Where reinstatement_requires_full_payment is true, a credit-hold account is reinstated only once its entire past-due balance is paid. The due date is the invoice line_date plus payment_due_days calendar days; late_fee_grace_days calendar days are added to the due date and a late fee can be assessed from the following calendar day.
  eligibility:
  - id: late_fee_after_grace
    applies_to: [service_late_fee_charged]
    kind: time
    condition: A late fee is assessed only when the handling date is later than the due date of the oldest unpaid invoice plus late_fee_grace_days calendar days.
    evidence_fields: [service_ro_lines.line_date, service_ro_lines.service_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_ro_lines.service_account_id]
      action_bindings: {service_ro_lines.service_account_id: service_account_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the due date of the oldest unpaid invoice
      anchor_source: service_ro_lines.line_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: The due date is the invoice line_date plus payment_due_days calendar days; late_fee_grace_days calendar days are added to the due date and a late fee can be assessed from the following calendar day.
      boundary: exclusive
  - id: reinstate_from_hold
    applies_to: [service_account_reinstated]
    kind: state
    condition: Where reinstatement_requires_full_payment is true, a credit-hold account is reinstated only once its entire past-due balance is paid.
    evidence_fields: [service_accounts.status, service_accounts.open_balance, service_accounts.service_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_accounts.service_account_id]
      action_bindings: {service_accounts.service_account_id: service_account_id}
    state_contract: {field: service_accounts.status, allowed: [credit_hold]}
  formula:
    early_payment_discount: round(early_pay_discount_pct * amount, 2)
    late_fee: max(late_fee_min_usd, round(late_fee_pct_per_month * service_receivable, 2))
  measures: [service_msr_oldest_past_due_days]
- id: service_evt_returned_payment
  subject: [service_payment_returned, service_shop_fee_charged]
  rule: When the bank returns a check or ACH payment, its credit is taken back by a service_payment_returned row pointing at the payment row and returned_payment_fee_usd is charged on the same repair order as fee_code returned_payment. A disputed card payment is taken back the same way but draws no returned payment fee. A returned payment fee is charged once per returned payment.
  eligibility: []
- id: service_evt_rewards_points
  subject: [service_points_earned, service_points_redeemed, service_points_expired, service_line_credited]
  rule: A repair order earns points_earn_per_usd points per whole dollar of customer-pay labor and parts actually paid (service_msr_ro_customer_pay_total, cents dropped), up to max_points_per_ro per repair order; shop fees, late fees and deductibles earn nothing, and where points_earn_on_covered_lines is false no work paid by warranty, recall, service contract, maintenance plan or goodwill earns points. Points are credited when the repair order is paid in full. Points are redeemed in whole points of at least points_min_redemption, each worth points_value_usd, and may pay at most points_max_redemption_pct_of_ro of the repair order's customer-pay labor and parts total; the tier labor and parts discounts apply first and points pay part of what remains. A redemption is credited to the repair order as credit_reason rewards_redemption. Points expire at the end of the calendar month that is points_expiry_months after the month they were earned, oldest points used first (service_msr_expiring_points). The enrollment bonus enrollment_bonus_points is credited once when an account opens at a tier that carries one. Tiers whose points_earn_per_usd is 0 neither earn nor redeem points.
  eligibility: []
  formula:
    max_redeem_value: round(points_max_redemption_pct_of_ro * service_msr_ro_customer_pay_total, 2)
    points_earned: min(max_points_per_ro, points_earn_per_usd * service_msr_ro_customer_pay_total)
  measures: [service_msr_ro_customer_pay_total, service_msr_expiring_points]
- id: service_evt_tier_review
  subject: [service_tier_changed]
  rule: Owner Rewards tiers are reviewed once a year on the anniversary of the account's opened_date. At the review the account is placed in the highest Owner Rewards tier whose tier_qualifying_spend_usd is met by service_msr_rolling_customer_pay_spend, and never below Kessler Owner Rewards Silver once enrolled; upgrades and downgrades take effect on the review date. A Service Guest Account becomes Kessler Owner Rewards Silver only on the customer's signed rewards enrollment. Commercial fleet tiers change only on an approved credit application, and the account's credit_limit is set to the tier's credit_limit_usd, and are never placed in a rewards tier. Points already earned are kept across a tier change and expire under the expiry period of the tier held when they expire.
  eligibility: []
  measures: [service_msr_rolling_customer_pay_spend]
- id: service_evt_comeback
  subject: [service_line_credited, service_labor_charged, service_parts_charged]
  rule: A customer-pay repair performed by any store of the group carries the store's repair warranty for comeback_warranty_months months from its line date or comeback_warranty_miles miles beyond its odometer_in, whichever ends first. A repeat failure of the same repair inside the repair warranty is a comeback. A comeback credit is given only when the repeat repair falls within the repair warranty of the original customer-pay repair. On a comeback the replacement parts are not billed and the labor is credited at comeback_labor_covered_pct as credit_reason comeback_repair pointing at the repeat labor row. Repairs made with customer-supplied parts, damage from collision, abuse or lack of maintenance, and failures of parts the original repair did not replace are not comebacks and are billed normally. Calendar months are added to the line_date of the original repair; when the resulting month has no such day the warranty ends on that month's last day, and the mileage limit is checked separately against the original odometer_in plus comeback_warranty_miles.
  eligibility:
  - id: within_repair_warranty
    applies_to: [service_line_credited]
    kind: time
    condition: A comeback credit is given only when the repeat repair falls within the repair warranty of the original customer-pay repair.
    evidence_fields: [service_ro_lines.line_date, service_ro_lines.odometer_in, service_ro_lines.source_line_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_ro_lines.source_line_id]
      action_bindings: {service_ro_lines.source_line_id: source_line_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the original customer-pay repair
      anchor_source: service_ro_lines.line_date
      relation: not_after
      duration_source: variants.comeback_warranty_months
      unit: calendar_months
      counting_rule: Calendar months are added to the line_date of the original repair; when the resulting month has no such day the warranty ends on that month's last day, and the mileage limit is checked separately against the original odometer_in plus comeback_warranty_miles.
      boundary: inclusive
  formula: {comeback_credit: 'round(comeback_labor_covered_pct * amount, 2)'}
- id: service_evt_goodwill
  subject: [service_line_credited]
  rule: A goodwill credit is a discretionary concession on a customer-pay repair order where the customer's concern is reasonable but no warranty, contract or comeback covers it. The desk may grant goodwill on one repair order up to the tier's goodwill_approval_limit_usd, as credit_reason goodwill pointing at the charge it reduces. A goodwill request above that limit needs a service manager's decision, which the desk cannot make; such a request is handed to a human representative. Goodwill is never granted on deductibles, shop fees, late fees or returned payment fees.
  eligibility: []
- id: service_evt_account_close
  subject: [service_account_closed, service_points_expired]
  rule: An account holder may close their service account. Where account_close_requires_zero_balance is true, an account is closed only when nothing is owed on it. An account is closed only from active status; an account on credit hold must first be reinstated. Where account_close_points_forfeit is true, every unredeemed point is forfeited on the closing date by a service_points_expired row. A closed account is not reopened; a later visit opens a new Service Guest Account.
  eligibility:
  - id: active_for_close
    applies_to: [service_account_closed]
    kind: state
    condition: An account is closed only from active status; an account on credit hold must first be reinstated.
    evidence_fields: [service_accounts.status, service_accounts.service_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_accounts.service_account_id]
      action_bindings: {service_accounts.service_account_id: service_account_id}
    state_contract: {field: service_accounts.status, allowed: [active]}
  formula: {closable: service_receivable == 0}
- id: service_combo_coverage_priority
  subject: [service_labor_charged, service_parts_charged, service_diagnostic_fee_charged]
  rule: Holding a coverage changes who pays a repair line. Each concern line is paid under exactly one source, chosen in this order of priority — an open safety recall campaign for the failed part, then an in-force manufacturer or dealer warranty coverage that covers the component at the repair odometer and date, then an active vehicle service contract that covers it (subject to its deductible and waiting period), then a prepaid maintenance plan visit for a covered maintenance service, and only then customer pay. A line paid by a recall, warranty, service contract or maintenance plan is recorded in that program's records and never billed here, except the contract or warranty deductible, which is billed here as pay_type service_contract_deductible or warranty_deductible. A customer cannot choose to pay a line on customer pay to preserve a coverage that applies, and a line is never split between two sources except for that deductible.
  eligibility: []
