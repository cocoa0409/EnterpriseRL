events:
- type: vsc_contract_sold
  target: vsc_contracts
  mutation: create
  meaning: A vehicle service contract is sold on a vehicle, on its purchase deal or later on its own.
  grain: One row per contract.
  fields:
    customer_id: holder
    vehicle_id: covered vehicle
    purchase_deal_id: deal sold on (empty if standalone)
    selling_store_id: selling store
    variant_name: coverage level
    contract_number: contract number
    sale_date: sale date
    term_start_date: term start per the coverage level's term_start_basis
    term_start_odometer: term start odometer
    odometer_at_sale: odometer at sale
    term_months: chosen term months
    term_miles: chosen term miles
    expiration_date: term start date plus term months
    expiration_odometer: term start odometer plus term miles
    deductible_option: chosen deductible
    retail_price: price paid
    financed_on_contract: whether financed
    lienholder_name: financing lender
  triggers: []
- type: vsc_contract_cancelled
  target: vsc_contracts
  mutation:
    transition: {from: active, to: cancelled}
  meaning: The contract is cancelled on the holder's signed request.
  grain: One transition per contract.
  fields: {closed_date: effective cancellation date (the request date)}
  triggers:
  - event: vsc:vsc_refund_calculated
    map: {entry_date: closed_date}
- type: vsc_contract_expired
  target: vsc_contracts
  mutation:
    transition: {from: active, to: expired}
  meaning: The term ends by date or by mileage.
  grain: One transition per contract.
  fields: {closed_date: date the term ended}
  triggers: []
- type: vsc_claim_paid
  target: vsc_ledger
  meaning: One benefit line of an authorized claim is paid (a covered component repair, rental, towing or trip interruption).
  grain: One entry per claim line (per component group for repairs, per benefit type otherwise).
  distinguish_by: [claim_number, claim_line_type, component_group]
  fields:
    entry_date: authorization date
    claim_number: claim number
    repair_order_number: RO paid
    claim_line_type: benefit paid
    component_group: component group repaired
    odometer: RO odometer
    labor_hours: hours allowed
    labor_rate_paid: rate paid
    parts_amount: parts paid
    deductible_applied: deductible taken
    days: rental or trip days
    amount: amount paid
    denial_reason: not_applicable
    cancel_method: not_applicable
    refund_payee: not_applicable
  account: claims_paid
  direction: in
  triggers: []
- type: vsc_claim_denied
  target: vsc_ledger
  meaning: One benefit line of a claim is denied, with its reason.
  grain: One entry per denied claim line.
  distinguish_by: [claim_number, claim_line_type, component_group]
  fields:
    entry_date: decision date
    claim_number: claim number
    repair_order_number: RO
    claim_line_type: benefit denied
    component_group: component group
    odometer: RO odometer
    amount: 0.0
    denial_reason: reason
    cancel_method: not_applicable
    refund_payee: not_applicable
  triggers: []
- type: vsc_claim_reversed
  target: vsc_ledger
  meaning: A paid claim line found paid in error (not covered, duplicate, or covered by the factory warranty) is reversed.
  grain: One entry per claim line reversed.
  distinguish_by: [source_entry_id]
  fields: {entry_date: reversal date, claim_number: claim number of the line, source_entry_id: the paid line reversed, amount: amount reversed, denial_reason: not_applicable, cancel_method: not_applicable, refund_payee: not_applicable}
  account: claims_paid
  direction: out
  triggers: []
- type: vsc_refund_calculated
  target: vsc_ledger
  meaning: The cancellation refund owed on a cancelled contract is computed and recorded as due.
  grain: One entry per cancellation.
  distinguish_by: [entry_date]
  fields: {entry_date: effective cancellation date, odometer: odometer certified on the request, cancel_method: basis of the refund, amount: refund due, denial_reason: not_applicable, refund_payee: not_applicable}
  account: vsc_refund_due
  direction: in
  triggers: []
- type: vsc_refund_paid
  target: vsc_ledger
  meaning: The cancellation refund is paid to the holder or the lienholder.
  grain: One entry per refund payment.
  distinguish_by: [source_entry_id, refund_payee]
  fields: {entry_date: payment date, source_entry_id: the refund calculation paid, refund_payee: who was paid, amount: amount paid, denial_reason: not_applicable, cancel_method: not_applicable}
  account: vsc_refund_due
  direction: out
  triggers: []
measures:
- id: vsc_msr_claims_paid_to_date
  window: Life of the contract up to the frozen handling date.
  measure: Sum of amount over the contract's vsc_claim_paid entries less the amount of its vsc_claim_reversed entries (the claims_paid account).
- id: vsc_msr_deductibles_on_visit
  window: One repair order.
  measure: Count of deductibles already taken on the repair order's paid component_repair lines (deductible_applied above 0.00).
- {id: vsc_msr_rental_days_paid_on_claim, window: One claim number., measure: Sum of days over the claim's paid rental lines.}
- id: vsc_msr_pro_rata_refund_base
  window: The contract term, measured at the effective cancellation date and the odometer certified on the cancellation request.
  measure: retail_price times the unused share defined in vsc_evt_cancellation_refund (lesser of the time and mileage shares, or the time share alone, per the coverage level's refund_basis), rounded to the cent, less claims paid where claims_deducted_from_refund is true.
policies:
- id: vsc_agg_multi_holding
  subject: [vsc_contract_sold]
  rule: A customer may hold service contracts on any number of vehicles; how contracts on one vehicle and claims across a contract's life combine is governed by vsc_agg_vehicle_and_limit.
  eligibility: []
  params: {max_per_customer: null}
- id: vsc_agg_vehicle_and_limit
  subject: [vsc_contract_sold, vsc_claim_paid]
  rule: A vehicle that already has an active service contract cannot be sold another. Claims under one contract are aggregated over its whole life — the total paid, measured by vsc_msr_claims_paid_to_date after reversals, may never exceed the coverage level's aggregate_claim_limit_usd; a claim line that would pass the limit is paid only up to the remaining limit, and once the limit is reached further lines are denied with denial_reason aggregate_limit_reached. Two contracts held by the same customer on different vehicles never share a limit or pay each other's claims.
  eligibility:
  - id: one_contract_per_vehicle
    applies_to: [vsc_contract_sold]
    kind: dedup
    condition: A vehicle that already has an active service contract cannot be sold another.
    evidence_fields: [vsc_contracts.vehicle_id, vsc_contracts.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_contracts.vehicle_id]
      action_bindings: {vsc_contracts.vehicle_id: vehicle_id}
    dedup_contract:
      table: vsc_contracts
      mode: separate_record
      object_bindings: {vehicle_id: vehicle_id}
      duplicate_filters: {status: [active]}
      distinct_fields: [vsc_contract_id]
  formula: {payable_cap: aggregate_claim_limit_usd - claims_paid}
  measures: [vsc_msr_claims_paid_to_date]
- id: vsc_evt_sale
  subject: [vsc_contract_sold]
  rule: A contract is sold only on a vehicle whose vehicle_condition is in the coverage level's eligible_vehicle_conditions, whose age at sale (sale year minus model year) does not exceed max_vehicle_age_years and whose odometer at sale does not exceed max_odometer_at_sale, with a clean title. A vehicle registered for commercial use is not covered where commercial_use_eligible is false. The term is one of term_options_months combined with one of term_options_miles, counted from the date and odometer the term_start_basis names, so expiration_date is the term start date plus term_months calendar months (a month without that day ends on its last day) and expiration_odometer is the term start odometer plus term_miles; coverage ends at whichever comes first. The deductible is one of deductible_options_usd, and the price may not exceed max_retail_price_usd.
  eligibility: []
- id: vsc_evt_claim_payment
  subject: [vsc_claim_paid, vsc_claim_denied]
  rule: A claim is paid only on a contract in active status. A covered failure is paid only when the repair order's date is on or before expiration_date and its odometer is at or below expiration_odometer. A failure is covered only when its component group's switch is true for the coverage level — covers_engine, covers_transmission, covers_drive_axle, covers_cooling, covers_fuel_system, covers_electrical, covers_air_conditioning, covers_steering, covers_suspension, covers_brakes, covers_high_tech_electronics or covers_seals_and_gaskets; wear and maintenance items are not covered where wear_items_covered is false, and failures present before the sale are excluded where pre_existing_condition_excluded is true (denial_reason component_not_covered or pre_existing_condition). Where prior_authorization_required is true, a repair begun before a claim number was issued is not paid (denial_reason no_prior_authorization). Labor is paid at the allowed hours times labor_rate_paid, which is the store's posted customer-pay labor rate capped at labor_rate_cap_usd; the hourly difference above the cap is owed by the customer to the store. Covered parts are paid at the store's list price. The deductible chosen at sale is taken under the coverage level's deductible_basis (once per repair visit for per_visit, once per component group repaired for per_repair, counted by vsc_msr_deductibles_on_visit), and where disappearing_deductible_at_selling_dealer is true no deductible is taken when the repair is done at the selling store. The line pays labor plus parts less the deductible, rounded to the cent, and never more than the remaining aggregate limit. Diagnosis and teardown time is paid with the line where diagnostic_teardown_paid_if_covered is true and the failure is covered. The repair order date is compared with expiration_date itself (no days added); a repair on the expiration date is covered, and the odometer limit is checked separately.
  eligibility:
  - id: active_contract_for_claim
    applies_to: [vsc_claim_paid]
    kind: state
    condition: A claim is paid only on a contract in active status.
    evidence_fields: [vsc_contracts.status, vsc_contracts.vsc_contract_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_contracts.vsc_contract_id]
      action_bindings: {vsc_contracts.vsc_contract_id: vsc_contract_id}
    state_contract: {field: vsc_contracts.status, allowed: [active]}
  - id: within_term
    applies_to: [vsc_claim_paid]
    kind: time
    condition: A covered failure is paid only when the repair order's date is on or before expiration_date and its odometer is at or below expiration_odometer.
    evidence_fields: [vsc_contracts.expiration_date, vsc_contracts.expiration_odometer, vsc_contracts.vsc_contract_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_contracts.vsc_contract_id]
      action_bindings: {vsc_contracts.vsc_contract_id: vsc_contract_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: expiration_date
      anchor_source: vsc_contracts.expiration_date
      relation: not_after
      duration_source: params.term_end_offset_days
      unit: calendar_days
      counting_rule: The repair order date is compared with expiration_date itself (no days added); a repair on the expiration date is covered, and the odometer limit is checked separately.
      boundary: inclusive
  params:
    term_end_offset_days: 0
    per_tier:
      Kessler Shield Powertrain: {labor_rate_cap_usd: =labor_rate_cap_usd, deductible_basis: =deductible_basis, disappearing_deductible_at_selling_dealer: =disappearing_deductible_at_selling_dealer}
      Kessler Shield Powertrain Plus: {labor_rate_cap_usd: =labor_rate_cap_usd, deductible_basis: =deductible_basis, disappearing_deductible_at_selling_dealer: =disappearing_deductible_at_selling_dealer}
      Kessler Shield Select: {labor_rate_cap_usd: =labor_rate_cap_usd, deductible_basis: =deductible_basis, disappearing_deductible_at_selling_dealer: =disappearing_deductible_at_selling_dealer}
      Kessler Shield Preferred: {labor_rate_cap_usd: =labor_rate_cap_usd, deductible_basis: =deductible_basis, disappearing_deductible_at_selling_dealer: =disappearing_deductible_at_selling_dealer}
      Kessler Shield Exclusionary: {labor_rate_cap_usd: =labor_rate_cap_usd, deductible_basis: =deductible_basis, disappearing_deductible_at_selling_dealer: =disappearing_deductible_at_selling_dealer}
      Kessler Shield Exclusionary Wrap: {labor_rate_cap_usd: =labor_rate_cap_usd, deductible_basis: =deductible_basis, disappearing_deductible_at_selling_dealer: =disappearing_deductible_at_selling_dealer}
  formula:
    line_paid: round(labor_hours * labor_rate_paid + parts_amount - deductible_applied, 2)
    rate_paid: min(labor_rate_paid, labor_rate_cap_usd)
  measures: [vsc_msr_deductibles_on_visit]
- id: vsc_evt_waiting_period
  subject: [vsc_claim_paid, vsc_claim_denied]
  rule: A failure is covered only after the waiting period, which ends once both waiting_period_days calendar days have passed since the sale date and the vehicle has been driven waiting_period_miles beyond the odometer at sale. A failure first reported on a repair order dated within the waiting period, or at an odometer within the waiting miles, is denied with denial_reason waiting_period. Where waiting_period_waived_when_sold_with_vehicle is true there is no waiting period on a contract sold on the vehicle's purchase deal (purchase_deal_id is filled). Towing and roadside assistance follow the same waiting period as the repair they relate to. Calendar days are added to the sale date (day 0), and a failure reported after that day is outside the waiting period; the mileage condition is checked separately and both must be met.
  eligibility:
  - id: waiting_period_over
    applies_to: [vsc_claim_paid]
    kind: time
    condition: A failure is covered only after the waiting period, which ends once both waiting_period_days calendar days have passed since the sale date and the vehicle has been driven waiting_period_miles beyond the odometer at sale.
    evidence_fields: [vsc_contracts.sale_date, vsc_contracts.odometer_at_sale, vsc_contracts.purchase_deal_id, vsc_contracts.vsc_contract_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_contracts.vsc_contract_id]
      action_bindings: {vsc_contracts.vsc_contract_id: vsc_contract_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the sale date
      anchor_source: vsc_contracts.sale_date
      relation: not_before
      duration_source: variants.waiting_period_days
      unit: calendar_days
      counting_rule: Calendar days are added to the sale date (day 0), and a failure reported after that day is outside the waiting period; the mileage condition is checked separately and both must be met.
      boundary: exclusive
- id: vsc_evt_claim_benefits
  subject: [vsc_claim_paid, vsc_claim_denied]
  rule: Benefits beyond the repair are paid only together with a covered component repair under the same claim number. Rental is reimbursed at rental_per_day_usd per calendar day the vehicle is at the store for the covered repair, from the day the repair order is opened to the day the repair is completed, up to rental_max_days_per_claim days per claim (vsc_msr_rental_days_paid_on_claim); a courtesy loaner the store provides free of charge is not reimbursed. Towing to the nearest authorized repair facility is paid up to towing_per_occurrence_usd per breakdown. Where the breakdown happens at least trip_interruption_min_miles_from_home miles from the holder's home ZIP, lodging and meals are paid up to trip_interruption_per_day_usd per day for at most trip_interruption_max_days days. A benefit whose per-day amount or day limit is 0 is not part of the coverage level, and a request for it is denied with denial_reason component_not_covered. Where roadside_assistance_included is true, jump starts, lockouts, fuel delivery and flat-tire changes are arranged through the 24-hour roadside line at no charge. No deductible is taken on rental, towing or trip interruption lines.
  eligibility: []
  formula:
    rental_paid: rental_per_day_usd * min(days, rental_max_days_per_claim)
    trip_paid: trip_interruption_per_day_usd * min(days, trip_interruption_max_days)
  measures: [vsc_msr_rental_days_paid_on_claim]
- id: vsc_evt_maintenance_proof
  subject: [vsc_claim_paid, vsc_claim_denied]
  rule: A claim for a failure of an internally lubricated component (engine, transmission, drive axle) requires proof that manufacturer-scheduled oil and fluid services were done during the maintenance_proof_lookback_months months before the failure. Repair orders and prepaid maintenance plan visits recorded at any group store count as proof, as do receipts from other shops the holder supplies; the holder may not be required to use the selling store. A lubricated-component claim with no qualifying service in the lookback window, where the failure is of a kind caused by lack of lubrication, is denied with denial_reason lack_of_maintenance. Failures of components that are not lubricated never need maintenance proof.
  eligibility: []
- id: vsc_evt_claim_reversal
  subject: [vsc_claim_reversed]
  rule: A paid claim line found paid in error is reversed in full by one vsc_claim_reversed entry pointing at the paid line; a line is reversed at most once. A line is paid in error when the failure was covered by the manufacturer's warranty or a recall at the repair date and odometer, when the same repair was paid twice, or when the claim paperwork was not completed within claim_submission_days_after_repair calendar days after the repair order closed. A reversal returns its amount to the remaining aggregate limit.
  eligibility:
  - id: reverse_once
    applies_to: [vsc_claim_reversed]
    kind: dedup
    condition: A paid claim line found paid in error is reversed in full by one vsc_claim_reversed entry pointing at the paid line; a line is reversed at most once.
    evidence_fields: [vsc_ledger.source_entry_id, vsc_ledger.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_ledger.source_entry_id]
      action_bindings: {vsc_ledger.source_entry_id: source_entry_id}
    dedup_contract:
      table: vsc_ledger
      mode: separate_record
      object_bindings: {source_entry_id: source_entry_id}
      duplicate_filters: {event_type: [vsc_claim_reversed]}
      distinct_fields: [entry_date]
- id: vsc_evt_cancellation_refund
  subject: [vsc_contract_cancelled, vsc_refund_calculated]
  rule: The holder may cancel an active contract at any time by a signed cancellation request stating the reason and certifying the odometer; the cancellation is effective on the request date. A contract is cancelled only from active status. A contract is cancelled only on the holder's signed cancellation request recorded for the contract. Free look — a contract cancelled within free_look_days calendar days after its sale date with no claim paid is refunded its full retail_price (cancel_method flat_free_look). Unwound deal — where deal_unwind_flat_cancel is true, a contract sold on a purchase deal that has been unwound is refunded its full retail_price whatever was claimed (cancel_method flat_deal_unwound). Otherwise the refund is pro rata (cancel_method pro_rata) — retail_price times the unused share, rounded to the cent, less cancellation_fee_usd, and less claims paid only where claims_deducted_from_refund is true. Under refund_basis lesser_of_time_or_mileage the unused share is the lesser of the unused time share (days from the effective date to expiration_date over days from term_start_date to expiration_date) and the unused mileage share (miles from the certified odometer to expiration_odometer over term_miles); under pro_rata_time only the time share is used; a share below 0 counts as 0 and, for a term counted from the in-service date, time and miles before the sale date count as used. Where cancellation_fee_waived_on_total_loss is true no fee is deducted when the reason is total_loss. A computed refund below 0.00 is 0.00. The flat refunds take precedence over the pro-rata refund and are never combined with it.
  eligibility:
  - id: active_to_cancel
    applies_to: [vsc_contract_cancelled]
    kind: state
    condition: A contract is cancelled only from active status.
    evidence_fields: [vsc_contracts.status, vsc_contracts.vsc_contract_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_contracts.vsc_contract_id]
      action_bindings: {vsc_contracts.vsc_contract_id: vsc_contract_id}
    state_contract: {field: vsc_contracts.status, allowed: [active]}
  - id: signed_request
    applies_to: [vsc_contract_cancelled]
    kind: authorization
    condition: A contract is cancelled only on the holder's signed cancellation request recorded for the contract.
    evidence_fields: [vsc_cancellation_requests.vsc_contract_id, vsc_cancellation_requests.cancel_reason, vsc_cancellation_requests.request_date, vsc_cancellation_requests.odometer_at_request]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_cancellation_requests.vsc_contract_id]
      action_bindings: {vsc_cancellation_requests.vsc_contract_id: vsc_contract_id}
  params:
    per_tier:
      Kessler Shield Powertrain: {free_look_days: =free_look_days, refund_basis: =refund_basis, cancellation_fee_usd: =cancellation_fee_usd}
      Kessler Shield Powertrain Plus: {free_look_days: =free_look_days, refund_basis: =refund_basis, cancellation_fee_usd: =cancellation_fee_usd}
      Kessler Shield Select: {free_look_days: =free_look_days, refund_basis: =refund_basis, cancellation_fee_usd: =cancellation_fee_usd}
      Kessler Shield Preferred: {free_look_days: =free_look_days, refund_basis: =refund_basis, cancellation_fee_usd: =cancellation_fee_usd}
      Kessler Shield Exclusionary: {free_look_days: =free_look_days, refund_basis: =refund_basis, cancellation_fee_usd: =cancellation_fee_usd}
      Kessler Shield Exclusionary Wrap: {free_look_days: =free_look_days, refund_basis: =refund_basis, cancellation_fee_usd: =cancellation_fee_usd}
  formula: {pro_rata_refund: 'max(0, vsc_msr_pro_rata_refund_base - cancellation_fee_usd)'}
  measures: [vsc_msr_pro_rata_refund_base, vsc_msr_claims_paid_to_date]
- id: vsc_evt_refund_payment
  subject: [vsc_refund_paid]
  rule: A computed refund is paid within refund_payment_days calendar days after the cancellation is processed, in one payment for the full amount due. Where refund_to_lienholder_when_financed is true and the contract was financed on the installment contract (financed_on_contract is 'true'), the refund is paid to the lienholder named on the contract; otherwise it is paid to the holder. A refund of 0.00 is not paid. A refund is paid only once per refund calculation.
  eligibility:
  - id: pay_once
    applies_to: [vsc_refund_paid]
    kind: dedup
    condition: A refund is paid only once per refund calculation.
    evidence_fields: [vsc_ledger.source_entry_id, vsc_ledger.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_ledger.source_entry_id]
      action_bindings: {vsc_ledger.source_entry_id: source_entry_id}
    dedup_contract:
      table: vsc_ledger
      mode: separate_record
      object_bindings: {source_entry_id: source_entry_id}
      duplicate_filters: {event_type: [vsc_refund_paid]}
      distinct_fields: [entry_date]
- id: vsc_evt_expiration
  subject: [vsc_contract_expired]
  rule: A contract expires at the end of its expiration_date or when a repair order or check-in records an odometer above its expiration_odometer, whichever happens first. A contract is expired only from active status. An expired contract carries no refund and no further claims; a failure that occurred before expiry and was reported on a repair order dated on or before the expiration date is still paid.
  eligibility:
  - id: active_to_expire
    applies_to: [vsc_contract_expired]
    kind: state
    condition: A contract is expired only from active status.
    evidence_fields: [vsc_contracts.status, vsc_contracts.vsc_contract_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vsc_contracts.vsc_contract_id]
      action_bindings: {vsc_contracts.vsc_contract_id: vsc_contract_id}
    state_contract: {field: vsc_contracts.status, allowed: [active]}
- id: vsc_combo_factory_warranty
  subject: [vsc_claim_paid, vsc_claim_denied]
  rule: Holding a manufacturer warranty coverage changes what the service contract pays. A failure covered at the repair date and odometer by an in-force manufacturer warranty coverage or an open recall in the warranty records is paid by that coverage, not by the service contract; the service contract pays only for components or for date and mileage the factory coverage does not reach, and a line the factory coverage pays is never also paid by the contract. A Kessler Shield Exclusionary Wrap contract and the factory powertrain warranty run side by side; for a powertrain failure inside the factory powertrain coverage the factory warranty pays and the wrap pays nothing.
  eligibility: []
