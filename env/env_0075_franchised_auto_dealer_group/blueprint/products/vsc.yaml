category: vsc
display_name: Kessler Shield Vehicle Service Contracts
binding:
  holding_table: vsc_contracts
  event_tables: [vsc_ledger]
  intake_tables: [vsc_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {claims_paid_total: claims_paid, refund_due_balance: vsc_refund_due}
lifecycle: {states: [active, cancelled, expired], transitions: [{from: active, to: cancelled, by: user, means: The contract holder cancels the contract by a signed cancellation request.}, {from: active, to: expired, by: system, means: The term ends by date or by mileage.}]}
accounts:
- key: claims_paid
  unit: USD
  meaning: Total the contract has paid on claims; claim payments increase it and claim reversals reduce it; it counts against the aggregate claim limit.
- key: vsc_refund_due
  unit: USD
  meaning: Cancellation refund computed for one contract and not yet paid out.
parameter_schema:
  term_options_months: List of term lengths in months that may be sold.
  term_options_miles: List of term mileages that may be sold.
  term_start_basis: Date and odometer the term counts from (sale_date = sale date and odometer at sale; vehicle_in_service_date = the vehicle's in-service date and odometer 0).
  max_vehicle_age_years: Greatest vehicle age at sale (sale year minus model year).
  max_odometer_at_sale: Greatest odometer at sale.
  eligible_vehicle_conditions: List of vehicle_condition values the coverage may be sold on.
  commercial_use_eligible: Switch (true/false) — whether a vehicle in commercial use may be covered.
  max_retail_price_usd: Highest price at which the coverage may be sold, USD.
  deductible_options_usd: List of deductibles (whole USD) that may be chosen at sale.
  deductible_basis: Whether the deductible is taken once per repair visit (per_visit) or once per component group repaired (per_repair).
  disappearing_deductible_at_selling_dealer: Switch (true/false) — whether no deductible is taken when the covered repair is done at the selling store.
  waiting_period_days: Calendar days after the sale date before a failure is covered.
  waiting_period_miles: Miles beyond the odometer at sale before a failure is covered.
  waiting_period_waived_when_sold_with_vehicle: Switch (true/false) — whether there is no waiting period on a contract sold on the vehicle's purchase deal.
  prior_authorization_required: Switch (true/false) — whether a repair must be authorized by claim number before work begins.
  claim_submission_days_after_repair: Calendar days after the repair order closes within which the claim paperwork must be completed.
  labor_rate_cap_usd: Highest hourly labor rate the contract pays, USD; the store rate above it is owed by the customer.
  aggregate_claim_limit_usd: Most the contract pays over its life across all claims, USD.
  covers_engine: Switch (true/false) — internally lubricated engine parts are covered.
  covers_transmission: Switch (true/false) — transmission and transfer case are covered.
  covers_drive_axle: Switch (true/false) — front and rear drive axle assemblies are covered.
  covers_cooling: Switch (true/false) — water pump, radiator and thermostat are covered.
  covers_fuel_system: Switch (true/false) — fuel pump, injectors and fuel pressure regulator are covered.
  covers_electrical: Switch (true/false) — alternator, starter, power window and lock motors and wiring harnesses are covered.
  covers_air_conditioning: Switch (true/false) — compressor, condenser and evaporator are covered.
  covers_steering: Switch (true/false) — steering gear, rack and power steering pump are covered.
  covers_suspension: Switch (true/false) — control arms, ball joints and bushings are covered.
  covers_brakes: Switch (true/false) — master cylinder, calipers and ABS module are covered (pads, shoes and rotors never).
  covers_high_tech_electronics: Switch (true/false) — infotainment, navigation, camera and driver-assist modules are covered.
  covers_seals_and_gaskets: Switch (true/false) — seals and gaskets of covered components are covered.
  wear_items_covered: Switch (true/false) — whether wear and maintenance items are covered.
  pre_existing_condition_excluded: Switch (true/false) — whether failures present before the contract sale are excluded.
  diagnostic_teardown_paid_if_covered: Switch (true/false) — whether diagnosis and teardown are paid when the failure is covered.
  maintenance_proof_lookback_months: Months of maintenance history (manufacturer-scheduled oil and fluid services) the holder must be able to show on a claim for a lubricated component.
  rental_per_day_usd: Rental reimbursement per day while the vehicle is at the shop for a covered repair, USD; 0.00 means no rental benefit.
  rental_max_days_per_claim: Most rental days paid per claim.
  towing_per_occurrence_usd: Most paid for towing to a repair facility per breakdown, USD.
  trip_interruption_per_day_usd: Lodging and meals paid per day when a covered breakdown happens far from home, USD; 0.00 means no benefit.
  trip_interruption_max_days: Most trip-interruption days paid per breakdown.
  trip_interruption_min_miles_from_home: Least distance from the holder's home ZIP at which a breakdown qualifies for trip interruption.
  roadside_assistance_included: Switch (true/false) — whether 24-hour roadside assistance (jump start, lockout, fuel delivery, flat tire) is included.
  free_look_days: Calendar days after the sale date within which a contract with no claims paid is cancelled for a full refund.
  refund_basis: How the unused share is measured after the free look (lesser_of_time_or_mileage / pro_rata_time).
  cancellation_fee_usd: Fee deducted from a refund after the free look, USD.
  cancellation_fee_waived_on_total_loss: Switch (true/false) — whether no fee is deducted when the vehicle is a total loss.
  claims_deducted_from_refund: Switch (true/false) — whether claims paid are deducted from a pro-rata refund.
  deal_unwind_flat_cancel: Switch (true/false) — whether a contract sold on a purchase deal that is unwound is cancelled flat with a full refund.
  refund_to_lienholder_when_financed: Switch (true/false) — whether a refund on a financed contract is paid to the lienholder.
  refund_payment_days: Calendar days after the cancellation is processed within which the refund is paid.
