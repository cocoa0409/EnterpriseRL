category: warranty
display_name: Warranty and Safety Recall Coverage
binding:
  holding_table: warranty_coverages
  event_tables: [warranty_claims]
  status_field: status
  variant_field: variant_name
  quantity_fields: {claims_paid_total: warranty_claims_paid}
lifecycle: {states: [active, expired, voided], transitions: [{from: active, to: expired, by: system, means: The coverage reaches its expiration date or expiration odometer.}, {from: active, to: voided, by: system, means: The coverage is voided because the vehicle's title is branded or its odometer was found altered.}]}
accounts:
- key: warranty_claims_paid
  unit: USD
  meaning: Amount paid under one coverage on claims, remedies, reimbursements and rentals; paid claims increase it and debits reduce it.
parameter_schema:
  term_months_by_brand: Per-brand mapping (oem_brand -> months) of the coverage term; 0 means the brand does not offer the coverage (or, for the dealer's warranty, that term_days applies).
  term_miles_by_brand: Per-brand mapping (oem_brand -> miles) of the coverage mileage; 0 means no mileage limit.
  term_days: Coverage term in days for a coverage counted in days; 0 for coverages counted in months.
  term_start_basis: Date and odometer the term counts from (in_service_date with odometer 0, or delivery_date with the delivery odometer).
  deductible_by_brand_usd: Per-brand mapping (oem_brand -> USD) of the deductible owed by the customer on a covered repair.
  deductible_basis: How the deductible is taken (per_visit, per_repair or none).
  transferable: Switch (true/false) — whether the coverage passes to a later owner of the vehicle.
  subsequent_owner_term_months_by_brand: Per-brand mapping of the term months that apply once the vehicle has a later owner.
  subsequent_owner_term_miles_by_brand: Per-brand mapping of the term miles that apply once the vehicle has a later owner (0 = no mileage limit).
  reduced_term_applies_to_commercial_use: Switch (true/false) — whether a vehicle in commercial use gets the subsequent-owner term even under its original owner.
  labor_rate_reimbursed_by_store_usd: Per-store mapping (store_code -> USD per hour) of the warranty labor rate the manufacturer reimburses the store.
  parts_markup_reimbursed_pct: Markup over dealer cost on warranty parts the manufacturer reimburses, as a fraction.
  covers_engine: Switch (true/false) — engine internal parts are covered.
  covers_transmission: Switch (true/false) — transmission and transaxle are covered.
  covers_drive_axle: Switch (true/false) — front and rear drive systems are covered.
  covers_electrical: Switch (true/false) — electrical components and modules are covered.
  covers_air_conditioning: Switch (true/false) — air conditioning system is covered.
  covers_suspension: Switch (true/false) — suspension components are covered.
  covers_brakes: Switch (true/false) — brake system components other than pads and rotors are covered.
  covers_infotainment: Switch (true/false) — audio, navigation and connectivity units are covered.
  covers_emission_components: Switch (true/false) — emission control components (catalytic converter, engine control module, onboard diagnostic device) are covered.
  covers_hybrid_battery: Switch (true/false) — hybrid or electric drive battery is covered.
  covers_scheduled_maintenance: Switch (true/false) — factory-scheduled maintenance services are covered.
  covers_safety_recall_defect: Switch (true/false) — the remedy of a safety recall campaign is covered.
  maintenance_visits_included_by_brand: Per-brand mapping of factory complimentary maintenance visits included.
  maintenance_interval_miles_by_brand: Per-brand mapping of the mileage interval of complimentary maintenance visits (0 = a single visit with no interval).
  roadside_assistance_months_by_brand: Per-brand mapping of months of factory roadside assistance from the in-service date.
  rental_allowance_per_day_by_brand_usd: Per-brand mapping of the daily rental allowance while a covered repair keeps the vehicle overnight, USD.
  rental_max_days: Most rental days paid per covered repair.
  goodwill_window_months_after_expiry: Months after the expiration date within which the manufacturer considers a goodwill adjustment.
  goodwill_window_miles_after_expiry: Miles beyond the expiration odometer within which the manufacturer considers a goodwill adjustment.
  goodwill_max_share_pct: Largest share of a repair the manufacturer pays as goodwill, as a fraction.
  owner_reimbursement_claim_days_after_notice: Calendar days after the owner notification date within which an owner may claim reimbursement for a remedy repair paid before the notice.
  recall_max_vehicle_age_years: Years after the first retail sale beyond which a recall remedy is not owed free of charge.
  recall_remedy_free_of_charge: Switch (true/false) — whether the recall remedy is performed at no charge to the owner.
  do_not_drive_recall_alternate_transportation: Switch (true/false) — whether alternate transportation is provided while a do-not-drive recall remedy awaits parts.
  claim_submission_days: Calendar days after the repair order closes within which the store submits the claim.
  chargeback_audit_window_days: Calendar days after payment within which the manufacturer may debit a claim on audit.
  voided_by_title_brands: List of title brands (title_brand enum values) that void the coverage.
  odometer_tamper_voids: Switch (true/false) — whether an altered or inoperative odometer voids the coverage.
  aftermarket_parts_do_not_void: Switch (true/false) — whether the use of aftermarket or recycled parts leaves the coverage in force (a claim is refused only for a failure that part caused).
  independent_maintenance_accepted: Switch (true/false) — whether maintenance done by any shop or by the owner, with records, satisfies the maintenance requirement.
  diagnostic_paid_when_covered: Switch (true/false) — whether diagnosis is paid by the coverage when the failure is covered.
  cpo_inspection_required: Switch (true/false) — whether a passed certification inspection is required to register the coverage.
  cpo_max_vehicle_age_years_by_brand: Per-brand mapping of the greatest vehicle age at certification.
  cpo_max_odometer_by_brand: Per-brand mapping of the greatest odometer at certification.
  emissions_inspection_failure_covered: Switch (true/false) — whether a repair needed to pass a state emissions inspection is covered.
  wear_items_excluded: Switch (true/false) — whether wear items (pads, rotors, wiper blades, tires, filters) are excluded.
  environmental_damage_excluded: Switch (true/false) — whether hail, flood, fire and road-salt damage are excluded.
