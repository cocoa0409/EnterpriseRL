    deductible_by_brand_usd: {Toyota: 0.0, Honda: 0.0, Ford: 0.0, Chevrolet: 0.0, Hyundai: 0.0}
    deductible_basis: none
    transferable: true
    subsequent_owner_term_months_by_brand: {Toyota: 180, Honda: 180, Ford: 180, Chevrolet: 180, Hyundai: 180}
    subsequent_owner_term_miles_by_brand: {Toyota: 0, Honda: 0, Ford: 0, Chevrolet: 0, Hyundai: 0}
    reduced_term_applies_to_commercial_use: false
    labor_rate_reimbursed_by_store_usd: *id001
    parts_markup_reimbursed_pct: 0.4
    covers_engine: false
    covers_transmission: false
    covers_drive_axle: false
    covers_electrical: false
    covers_air_conditioning: false
    covers_suspension: false
    covers_brakes: false
    covers_infotainment: false
    covers_emission_components: false
    covers_hybrid_battery: false
    covers_scheduled_maintenance: false
    covers_safety_recall_defect: true
    maintenance_visits_included_by_brand: {Toyota: 0, Honda: 0, Ford: 0, Chevrolet: 0, Hyundai: 0}
    maintenance_interval_miles_by_brand: {Toyota: 0, Honda: 0, Ford: 0, Chevrolet: 0, Hyundai: 0}
    roadside_assistance_months_by_brand: {Toyota: 0, Honda: 0, Ford: 0, Chevrolet: 0, Hyundai: 0}
    rental_allowance_per_day_by_brand_usd: {Toyota: 0.0, Honda: 0.0, Ford: 0.0, Chevrolet: 0.0, Hyundai: 0.0}
    rental_max_days: 0
    goodwill_window_months_after_expiry: 0
    goodwill_window_miles_after_expiry: 0
    goodwill_max_share_pct: 0.0
    owner_reimbursement_claim_days_after_notice: 365
    recall_max_vehicle_age_years: 15
    recall_remedy_free_of_charge: true
    do_not_drive_recall_alternate_transportation: true
    claim_submission_days: 30
    chargeback_audit_window_days: 365
    voided_by_title_brands: []
    odometer_tamper_voids: false
    aftermarket_parts_do_not_void: true
    independent_maintenance_accepted: true
    diagnostic_paid_when_covered: true
    cpo_inspection_required: false
    cpo_max_vehicle_age_years_by_brand: {Toyota: 0, Honda: 0, Ford: 0, Chevrolet: 0, Hyundai: 0}
    cpo_max_odometer_by_brand: {Toyota: 0, Honda: 0, Ford: 0, Chevrolet: 0, Hyundai: 0}
    emissions_inspection_failure_covered: false
    wear_items_excluded: true
    environmental_damage_excluded: true
events:
- type: warranty_coverage_registered
  target: warranty_coverages
  mutation: create
  meaning: A coverage is registered on a vehicle (factory coverages at its first retail delivery, the certified coverage at certified delivery, the dealer's used-vehicle warranty at a used retail delivery).
  grain: One row per coverage type per vehicle.
  fields: {customer_id: owner, vehicle_id: vehicle, variant_name: coverage type, coverage_start_date: term start, coverage_start_odometer: term start odometer, expiration_date: term end date, expiration_odometer: term end odometer (0 for no limit), owner_sequence: original or subsequent owner}
  triggers: []
- type: warranty_owner_changed
  target: warranty_coverages
  mutation: update
  meaning: A transferable coverage passes to the vehicle's new owner, and the subsequent-owner term is applied where it is shorter.
  grain: One update per coverage per change of owner.
  fields: {customer_id: new owner, owner_sequence: subsequent_owner, expiration_date: term end under the subsequent-owner term, expiration_odometer: term end odometer under the subsequent-owner term}
  triggers: []
- type: warranty_coverage_expired
  target: warranty_coverages
  mutation:
    transition: {from: active, to: expired}
  meaning: The coverage reaches its end date or end odometer.
  grain: One transition per coverage.
  fields: {closed_date: date the term ended}
  triggers: []
- type: warranty_coverage_voided
  target: warranty_coverages
  mutation:
    transition: {from: active, to: voided}
  meaning: The coverage is voided for a branded title or an altered odometer.
  grain: One transition per coverage.
  fields: {closed_date: date voided}
  triggers: []
- type: warranty_recall_notice_recorded
  target: warranty_claims
  meaning: A manufacturer safety recall campaign is recorded against the vehicle's VIN, with the owner notification date.
  grain: One entry per campaign per vehicle.
  distinguish_by: [campaign_number]
  fields: {claim_date: date recorded, claim_type: recall_notice, campaign_number: campaign, notice_date: owner notification date, component_group: safety_recall_part, amount: 0.0, reject_reason: not_applicable}
  triggers: []
- type: warranty_claim_paid
  target: warranty_claims
  meaning: A claim under the coverage is paid (warranty repair, recall remedy, owner reimbursement, goodwill adjustment, complimentary maintenance visit or rental).
  grain: One entry per claim type per component group per repair order (per campaign for recall entries).
  distinguish_by: [repair_order_number, claim_type, component_group, campaign_number]
  fields:
    claim_date: decision date
    repair_order_number: RO
    store_id: store
    claim_type: what is paid
    campaign_number: campaign (recall entries)
    notice_date: owner notification date (recall entries)
    component_group: component
    odometer: odometer
    labor_hours: hours allowed
    labor_rate_reimbursed: rate
    parts_amount: parts
    deductible_charged: customer deductible
    amount: amount paid
    reject_reason: not_applicable
  account: warranty_claims_paid
  direction: in
  triggers: []
- type: warranty_claim_rejected
  target: warranty_claims
  meaning: A claim under the coverage is rejected with its reason; the work becomes customer pay unless another coverage applies.
  grain: One entry per rejected claim type per component group per repair order.
  distinguish_by: [repair_order_number, claim_type, component_group]
  fields: {claim_date: decision date, repair_order_number: RO, store_id: store, claim_type: what was claimed, component_group: component, odometer: odometer, amount: 0.0, reject_reason: reason}
  triggers: []
- type: warranty_claim_debited
  target: warranty_claims
  meaning: The manufacturer takes back a paid claim on audit.
  grain: One entry per paid claim debited.
  distinguish_by: [source_claim_id]
  fields: {claim_date: debit date, source_claim_id: the paid claim, claim_type: claim type of the paid claim, amount: amount debited, reject_reason: reason found on audit}
  account: warranty_claims_paid
  direction: out
  triggers: []
measures:
- id: warranty_msr_open_recalls
  window: Point in time at the frozen handling date.
  measure: Campaign numbers of the vehicle's warranty_recall_notice_recorded entries that have no warranty_claim_paid entry of claim_type recall_remedy with the same campaign number.
- id: warranty_msr_complimentary_visits_used
  window: Life of the Factory Complimentary Maintenance coverage.
  measure: Count of the coverage's warranty_claim_paid entries of claim_type complimentary_maintenance less any of them debited.
policies:
- id: warranty_agg_multi_holding
  subject: [warranty_coverage_registered]
  rule: A vehicle carries several coverages at once, one of each coverage type, and an owner holds the coverages of every vehicle they own; how coverages on one vehicle combine on one failure is governed by warranty_agg_coverage_priority.
  eligibility: []
  params: {max_per_customer: null}
- id: warranty_agg_coverage_priority
  subject: [warranty_coverage_registered, warranty_claim_paid, warranty_claim_rejected]
  rule: A vehicle that already has an active coverage of a coverage type cannot be registered for that type again. When more than one coverage on a vehicle covers the same failure, exactly one pays, in this order — Safety Recall Remedy Coverage for a recalled part, then Factory Basic Limited Warranty, then Factory Powertrain Limited Warranty or Federal Emissions Performance Warranty for their components, then Certified Pre-Owned Powertrain Warranty, then Kessler Used Vehicle Limited Warranty; only the paying coverage's deductible applies. A failure no in-force coverage pays is customer pay or falls to a service contract under that product's own charter.
  eligibility:
  - id: one_per_type_per_vehicle
    applies_to: [warranty_coverage_registered]
    kind: dedup
    condition: A vehicle that already has an active coverage of a coverage type cannot be registered for that type again.
    evidence_fields: [warranty_coverages.vehicle_id, warranty_coverages.variant_name, warranty_coverages.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [warranty_coverages.vehicle_id, warranty_coverages.variant_name]
      action_bindings: {warranty_coverages.vehicle_id: vehicle_id, warranty_coverages.variant_name: variant_name}
    dedup_contract:
      table: warranty_coverages
      mode: separate_record
      object_bindings: {vehicle_id: vehicle_id, variant_name: variant_name}
      duplicate_filters: {status: [active]}
      distinct_fields: [warranty_coverage_id]
- id: warranty_evt_registration
  subject: [warranty_coverage_registered]
  rule: A coverage's term is the months and miles its brand mapping gives (term_months_by_brand and term_miles_by_brand, looked up by the vehicle make), or term_days days where term_days is above 0, counted from the date and odometer of its term_start_basis; a month without the start day ends on its last day, and a mileage of 0 means no mileage limit. A brand whose term months are 0 (and whose term_days is 0) does not offer that coverage, and no coverage is registered. The Certified Pre-Owned Powertrain Warranty is registered only on a certified_pre_owned vehicle that passed its certification inspection where cpo_inspection_required is true, whose age does not exceed cpo_max_vehicle_age_years_by_brand and whose odometer does not exceed cpo_max_odometer_by_brand at certification. Factory roadside assistance runs for the brand's roadside_assistance_months_by_brand months from the in-service date. Where reduced_term_applies_to_commercial_use is true, a vehicle registered for commercial use gets the subsequent-owner term from the start.
  eligibility: []
- id: warranty_evt_claim_coverage
  subject: [warranty_claim_paid, warranty_claim_rejected]
  rule: A claim is paid only under a coverage in active status. A failure is paid only when the repair order date is on or before expiration_date and, where expiration_odometer is above 0, its odometer is at or below expiration_odometer. The failed part's component group must be covered by the coverage's switch for it — covers_engine, covers_transmission, covers_drive_axle, covers_electrical, covers_air_conditioning, covers_suspension, covers_brakes, covers_infotainment, covers_emission_components, covers_hybrid_battery, covers_scheduled_maintenance or covers_safety_recall_defect. The store is reimbursed the manufacturer's labor time at its rate in labor_rate_reimbursed_by_store_usd and parts at dealer cost plus parts_markup_reimbursed_pct; diagnosis is paid with the claim where diagnostic_paid_when_covered is true. The customer owes only the coverage's deductible from deductible_by_brand_usd, taken under deductible_basis, and nothing else for covered work. Where the brand's rental_allowance_per_day_by_brand_usd is above 0.00, a covered repair that keeps the vehicle overnight pays a rental of that allowance per day for at most rental_max_days days. A claim is submitted within claim_submission_days calendar days after the repair order closes, and a later submission is rejected with reject_reason late_submission.
  eligibility:
  - id: active_coverage
    applies_to: [warranty_claim_paid]
    kind: state
    condition: A claim is paid only under a coverage in active status.
    evidence_fields: [warranty_coverages.status, warranty_coverages.warranty_coverage_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [warranty_coverages.warranty_coverage_id]
      action_bindings: {warranty_coverages.warranty_coverage_id: warranty_coverage_id}
    state_contract: {field: warranty_coverages.status, allowed: [active]}
  params:
    per_tier:
      Kessler Used Vehicle Limited Warranty: {deductible_basis: =deductible_basis, rental_max_days: =rental_max_days, parts_markup_reimbursed_pct: =parts_markup_reimbursed_pct}
      Factory Complimentary Maintenance: {deductible_basis: =deductible_basis, rental_max_days: =rental_max_days, parts_markup_reimbursed_pct: =parts_markup_reimbursed_pct}
      Factory Basic Limited Warranty: {deductible_basis: =deductible_basis, rental_max_days: =rental_max_days, parts_markup_reimbursed_pct: =parts_markup_reimbursed_pct}
      Factory Powertrain Limited Warranty: {deductible_basis: =deductible_basis, rental_max_days: =rental_max_days, parts_markup_reimbursed_pct: =parts_markup_reimbursed_pct}
      Certified Pre-Owned Powertrain Warranty: {deductible_basis: =deductible_basis, rental_max_days: =rental_max_days, parts_markup_reimbursed_pct: =parts_markup_reimbursed_pct}
      Federal Emissions Performance Warranty: {deductible_basis: =deductible_basis, rental_max_days: =rental_max_days, parts_markup_reimbursed_pct: =parts_markup_reimbursed_pct}
      Safety Recall Remedy Coverage: {deductible_basis: =deductible_basis, rental_max_days: =rental_max_days, parts_markup_reimbursed_pct: =parts_markup_reimbursed_pct}
  formula:
    claim_paid: round(labor_hours * labor_rate_reimbursed + parts_amount - deductible_charged, 2)
- id: warranty_evt_exclusions
  subject: [warranty_claim_rejected]
  rule: Where wear_items_excluded is true, wear items (brake pads and rotors, wiper blades, tires, filters, bulbs) are not covered. Where environmental_damage_excluded is true, damage from hail, flood, fire or road salt is not covered, nor is damage from collision, abuse or neglect. Where aftermarket_parts_do_not_void is true, installing aftermarket or recycled parts never voids a coverage; a claim is rejected for an aftermarket part only when that part caused the failure (reject_reason aftermarket_part_caused_failure). Where independent_maintenance_accepted is true, maintenance done at any shop or by the owner satisfies the maintenance requirement when it is documented; a claim is never rejected because the maintenance was not done at a group store.
  eligibility: []
- id: warranty_evt_recall
  subject: [warranty_recall_notice_recorded, warranty_claim_paid]
  rule: A safety recall campaign applies to the vehicles the manufacturer lists by VIN, and its owner notification date is recorded with it. Where recall_remedy_free_of_charge is true, the remedy is performed at no charge to the owner, provided the vehicle's first retail sale was no more than recall_max_vehicle_age_years years before the notification date; the remedy is owed to whoever owns the vehicle, whatever the title brand. An owner who paid for a repair of the recalled defect before the notification date is reimbursed the amount paid for that repair, as claim_type owner_reimbursement. An owner reimbursement is paid only when it is claimed within owner_reimbursement_claim_days_after_notice calendar days after the notification date. Where do_not_drive_recall_alternate_transportation is true and the manufacturer has designated the campaign do-not-drive with remedy parts not yet available, alternate transportation is provided until the remedy is performed. An open recall is one with no recall_remedy claim for its campaign (warranty_msr_open_recalls). Calendar days are added to the notification date (day 0); a claim on the last day is in time.
  eligibility:
  - id: reimbursement_window
    applies_to: [warranty_claim_paid]
    kind: time
    condition: An owner reimbursement is paid only when it is claimed within owner_reimbursement_claim_days_after_notice calendar days after the notification date.
    evidence_fields: [warranty_claims.notice_date, warranty_claims.campaign_number]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [warranty_claims.campaign_number]
      action_bindings: {warranty_claims.campaign_number: campaign_number}
    temporal_basis:
      clock: frozen_time
      anchor_event: the notification date
      anchor_source: warranty_claims.notice_date
      relation: not_after
      duration_source: variants.owner_reimbursement_claim_days_after_notice
      unit: calendar_days
      counting_rule: Calendar days are added to the notification date (day 0); a claim on the last day is in time.
      boundary: inclusive
  measures: [warranty_msr_open_recalls]
- id: warranty_evt_goodwill
  subject: [warranty_claim_paid]
  rule: After a coverage expires, the manufacturer may consider a goodwill adjustment for a failure of a component the coverage covered, within goodwill_window_months_after_expiry months after the expiration date and goodwill_window_miles_after_expiry miles beyond the expiration odometer, paying at most goodwill_max_share_pct of the repair. A goodwill adjustment is the manufacturer's decision; the store can request it but cannot promise it, and it is recorded as claim_type goodwill_adjustment only once the manufacturer approves it. Coverages whose goodwill share is 0.00 are never considered.
  eligibility: []
- id: warranty_evt_complimentary_maintenance
  subject: [warranty_claim_paid]
  rule: Factory Complimentary Maintenance pays the brand's maintenance_visits_included_by_brand factory-scheduled services, one at each maintenance_interval_miles_by_brand interval (a single visit where the interval is 0), within the coverage term; each visit is recorded as claim_type complimentary_maintenance and counted by warranty_msr_complimentary_visits_used. Services beyond the included visits or outside the factory schedule are customer pay or fall to a prepaid maintenance plan.
  eligibility: []
  measures: [warranty_msr_complimentary_visits_used]
- id: warranty_evt_void_and_transfer
  subject: [warranty_coverage_voided, warranty_owner_changed, warranty_coverage_expired]
  rule: A coverage is voided when the vehicle's title_brand is one of its voided_by_title_brands, or, where odometer_tamper_voids is true, when the odometer is found altered or inoperative; a void is only made from active status. A coverage whose transferable switch is true passes to a later owner, with the subsequent-owner term from subsequent_owner_term_months_by_brand and subsequent_owner_term_miles_by_brand where it ends earlier than the original term; a non-transferable coverage ends at the change of owner. A coverage expires at the end of its expiration date or at the first repair order whose odometer is above a non-zero expiration odometer.
  eligibility:
  - id: active_to_void
    applies_to: [warranty_coverage_voided, warranty_coverage_expired]
    kind: state
    condition: a void is only made from active status
    evidence_fields: [warranty_coverages.status, vehicles.title_brand, warranty_coverages.warranty_coverage_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [warranty_coverages.warranty_coverage_id]
      action_bindings: {warranty_coverages.warranty_coverage_id: warranty_coverage_id}
    state_contract: {field: warranty_coverages.status, allowed: [active]}
- id: warranty_evt_chargeback
  subject: [warranty_claim_debited]
  rule: The manufacturer may debit a paid claim found on audit to be unsupported (not covered, outside the term, or performed without the required documentation) within chargeback_audit_window_days calendar days after its payment; a claim is debited at most once and only in full. A debit never becomes a charge to the customer for work the store performed as covered.
  eligibility:
  - id: debit_once
    applies_to: [warranty_claim_debited]
    kind: dedup
    condition: a claim is debited at most once and only in full
    evidence_fields: [warranty_claims.source_claim_id, warranty_claims.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [warranty_claims.source_claim_id]
      action_bindings: {warranty_claims.source_claim_id: source_claim_id}
    dedup_contract:
      table: warranty_claims
      mode: separate_record
      object_bindings: {source_claim_id: source_claim_id}
      duplicate_filters: {event_type: [warranty_claim_debited]}
      distinct_fields: [claim_date]
- id: warranty_evt_emissions
  subject: [warranty_claim_paid]
  rule: The Federal Emissions Performance Warranty covers emission control components and the hybrid drive battery for its term; where emissions_inspection_failure_covered is true it also covers a repair needed for the vehicle to pass a state emissions inspection, provided the vehicle has been maintained and operated as the manufacturer specifies. Components covered by the Factory Basic Limited Warranty are paid under that coverage while it is in force.
  eligibility: []
