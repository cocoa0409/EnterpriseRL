- id: gap_evt_cancellation_refund
  subject:
  - gap_waiver_cancelled
  - gap_waiver_terminated
  - gap_refund_calculated
  rule: The holder may cancel an active waiver at any time by a signed cancellation request; the cancellation is effective on the request date. A waiver is cancelled only from active status. A waiver is cancelled only on the holder's signed cancellation request recorded for the waiver. Where refund_on_payoff_automatic is true, a waiver whose contract the lienholder reports paid off or, where refinance_terminates_waiver is true, refinanced away is terminated with its loan_payoff_date as the effective date and its refund computed without any request. Free look — a waiver cancelled within free_look_days calendar days after its sale date is refunded its full retail_price (cancel_method flat_free_look). Unwound deal — where deal_unwind_flat_cancel is true, a waiver on a purchase deal that has been unwound is refunded its full retail_price (cancel_method flat_deal_unwound). Otherwise the refund follows the waiver's refund_method, pro_rata_daily (cancel_method pro_rata) — retail_price times gap_msr_unused_term_share, rounded to the cent, less cancellation_fee_usd; no fee is deducted on a termination where cancellation_fee_waived_on_payoff is true. A computed refund below 0.00 is 0.00. A waiver whose GAP balance benefit has been paid is settled and earns no refund.
