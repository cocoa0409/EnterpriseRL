  subject:
  - gap_benefit_paid
  - gap_waiver_claim_settled
  computes: amount
  target_tool: pay_gap_balance_0b87221e
  params:
    theft_deductible_cover: 1500.0
    early_collision_cover: 1250.0
    past_due_allow_two_years: 400.0
    past_due_allow_one_year: 200.0
    late_allow_theft: 75.0
    late_allow_slow_settlement: 50.0
