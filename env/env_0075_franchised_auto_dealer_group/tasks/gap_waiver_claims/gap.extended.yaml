  rule: 'This policy prices the GAP balance line paid on a total-loss claim under an active waiver; the replacement vehicle credit is outside it. The claim figures are those recorded on the waiver''s most recent claim line for the GAP balance, whether that line was paid or denied: the payoff at loss, ACV settlement, insurer deductible, past-due payments, late fees and charges, deferred payments, add-on refunds, negative trade equity carried into the deal and retained salvage value. The loss type and the loss date the ladders of this rule read are those recorded on the same claim line. For a GAP balance line priced under this policy, and only for such a line, negative equity carried into the deal is the negative trade equity recorded on the claim line, which the claim file takes from the purchase deal, and is subtracted only where exclude_negative_equity is true; every other GAP benefit reads negative equity from the purchase deal (trade_payoff_amount less trade_in_allowance). A waiver with no claim line for the GAP balance on file has no claim figures, and its GAP balance line is 0.00. For a GAP balance line priced under this policy, and only for such a line, the refunds of cancelled financed products subtracted are the add-on refunds recorded on the claim line, the refunds credited or due to the payoff as the lienholder''s payoff letter shows them when the claim is figured; every other GAP benefit subtracts the refund each product''s own charter computes with the loss date as the effective cancellation date, whether or not the cancellation has yet been processed. The GAP balance starts from the payoff at loss less the ACV settlement. The insurer''s deductible above deductible_covered_cap_usd is subtracted. Past-due payments, late fees and charges, deferred payments, add-on refunds, negative trade equity carried into the deal (as recorded on the claim line) and retained salvage value are each subtracted in full where the waiver''s switch for that item is true. Financing above the loan-to-value cap, ltv_cap_pct times the waiver''s vehicle_value_basis rounded half up to the cent, then reduces the result by the waiver''s excess_ltv_method: under proportional_reduction the result is multiplied by the lesser of 1 and the cap amount over the amount financed, under exclude_excess_amount the amount financed above the cap is subtracted. The GAP balance benefit is that result rounded half up to the cent, floored at 0.00 and capped at the lesser of max_benefit_usd and max_benefit_pct_of_acv times the ACV settlement. For a GAP balance line priced under this policy, and only for such a line, the insurer''s deductible is covered up to the amount the ladders of this rule select, and any deductible above that amount is subtracted. For a GAP balance line priced under this policy, and only for such a line, the payoff items the waiver excludes are subtracted only where their switch is true, each as the ladders of this rule treat it, and in full where no ladder treats it. For a GAP balance line priced under this policy, and only for such a line, the loan-to-value cap amount is ltv_cap_pct times the value basis the ladders of this rule select, rounded half up to the cent, and financing above it reduces the result by the reduction method those ladders select. The waiver''s months in force at the loss are whole calendar months from sale_date to the loss date. In counting the months a GAP waiver was in force at its loss, a whole calendar month counts each time the start date''s day of the month is reached; a loss date on an earlier day of the month does not complete the month, and there is no month-end adjustment. Deductible ladder: where the loss is a total_loss_theft and the waiver had been in force 12 or more months at the loss, the covered deductible is the greater of deductible_covered_cap_usd and theft_deductible_cover; where the loss is a total_loss_collision and the waiver had been in force fewer than 12 months at the loss, the covered deductible
    is the greater of deductible_covered_cap_usd and early_collision_cover; in every other case the covered deductible is deductible_covered_cap_usd. Past-due allowance ladder: where the waiver had been in force 24 or more months at the loss, the past-due allowance is past_due_allow_two_years; where it had been in force 12 to 23 months, the past-due allowance is past_due_allow_one_year; where it had been in force fewer than 12 months, there is no past-due allowance; only past-due payments above the allowance are subtracted. Late-charge allowance ladder: where the loss is a total_loss_theft, the late-charge allowance is late_allow_theft; where the loss is not a theft and the insurer''s settlement date recorded on the claim line is more than 30 calendar days after the loss date, the late-charge allowance is late_allow_slow_settlement; in every other case there is no late-charge allowance; only late fees and charges above the allowance are subtracted. Deferral ladder: where the loss is a total_loss_theft, deferred payments are not subtracted; where the loss is a total_loss_collision and the waiver had been in force 12 or more months at the loss, only deferred payments above deferral_allowance are subtracted where the waiver''s switch for deferred payments is true; in every other case, any other loss type or a collision in the first 12 months, deferred payments are subtracted in full where that switch is true. Cap-basis ladder: where the purchase deal is a Used Vehicle Retail Purchase or a Value Line Used Vehicle Purchase and its cash_price is below the waiver''s vehicle_value_basis, the cap basis is that cash_price; where the purchase deal is a Certified Pre-Owned Vehicle Purchase, the cap basis is the vehicle_value_basis plus cpo_certification_allowance; in every other case the cap basis is the vehicle_value_basis. Loan-to-value ladder: reading the recorded cap amount, ltv_cap_pct times the waiver''s vehicle_value_basis rounded half up to the cent, where the waiver''s excess_ltv_method is proportional_reduction, the purchase deal carried negative trade equity (its trade_payoff_amount above its trade_in_allowance) and the amount financed is above the recorded cap amount, the amount financed above the loan-to-value cap amount is subtracted instead; where the deal carried no negative trade equity and the amount financed is above the recorded cap amount by no more than ltv_tolerance_pct of the recorded cap amount, there is no reduction; in every other case the waiver''s excess_ltv_method applies. The GAP balance line is assembled in this order: the substitutions above replace the standard figures first, the subtractions are taken, the loan-to-value reduction is applied, and the result is rounded half up to the cent, floored at 0.00 and capped last.'
  prerequisite: []
  cross_category:
  - category: purchase
    as: branch
    reads:
    - trade_payoff_amount
    - trade_in_allowance
    - variant_name
    - cash_price
    note: The loan-to-value ladder reads the deal's negative trade equity, the cap-basis ladder reads its deal type and cash price.
  compute:
  - claim_on_file: COUNT('gap_ledger', benefit_line_type='gap_balance') > 0
  - loss_type: LATEST('gap_ledger', 'loss_type', date_field='entry_date', benefit_line_type='gap_balance')
  - loss_date: LATEST('gap_ledger', 'loss_date', date_field='entry_date', benefit_line_type='gap_balance') or F('sale_date')
  - settlement_date: LATEST('gap_ledger', 'settlement_date', date_field='entry_date', benefit_line_type='gap_balance') or F('sale_date')
  - payoff: float(LATEST('gap_ledger', 'payoff_at_loss', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - acv: float(LATEST('gap_ledger', 'insurance_acv_settlement', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - deductible: float(LATEST('gap_ledger', 'insurance_deductible', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - past_due: float(LATEST('gap_ledger', 'past_due_amounts', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - late_fees: float(LATEST('gap_ledger', 'late_fees_and_charges', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - deferred: float(LATEST('gap_ledger', 'deferred_payments', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - addon_refunds: float(LATEST('gap_ledger', 'addon_refunds_credited', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - salvage: float(LATEST('gap_ledger', 'salvage_retention_value', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - covered_deductible: MX(P('deductible_covered_cap_usd'), K('theft_deductible_cover')) if (loss_type == 'total_loss_theft' and MONTHS(F('sale_date'), loss_date) >= 12) else (MX(P('deductible_covered_cap_usd'), K('early_collision_cover')) if (loss_type == 'total_loss_collision' and MONTHS(F('sale_date'), loss_date) < 12) else P('deductible_covered_cap_usd'))
  - past_due_allowance: K('past_due_allow_two_years') if MONTHS(F('sale_date'), loss_date) >= 24 else (K('past_due_allow_one_year') if MONTHS(F('sale_date'), loss_date) >= 12 else 0.0)
  - late_charge_allowance: K('late_allow_theft') if loss_type == 'total_loss_theft' else (K('late_allow_slow_settlement') if DAYS(loss_date, settlement_date) > 30 else 0.0)
  - deferral_cut: 0.0 if loss_type == 'total_loss_theft' else ((MX(0.0, deferred - K('deferral_allowance')) if P('exclude_deferred_payments') else 0.0) if (loss_type == 'total_loss_collision' and MONTHS(F('sale_date'), loss_date) >= 12) else (deferred if P('exclude_deferred_payments') else 0.0))
  - cap_deal_type: CFIELD('purchase', 'variant_name', purchase_deal_id=F('purchase_deal_id'))
  - cap_deal_cash: float(CFIELD('purchase', 'cash_price', purchase_deal_id=F('purchase_deal_id')) or 0)
  - cap_basis: cap_deal_cash if ((cap_deal_type == 'Used Vehicle Retail Purchase' or cap_deal_type == 'Value Line Used Vehicle Purchase') and cap_deal_cash < F('vehicle_value_basis')) else (F('vehicle_value_basis') + K('cpo_certification_allowance') if cap_deal_type == 'Certified Pre-Owned Vehicle Purchase' else F('vehicle_value_basis'))
  - ltv_trade_payoff: float(CFIELD('purchase', 'trade_payoff_amount', purchase_deal_id=F('purchase_deal_id')) or 0)
  - ltv_trade_allowance: float(CFIELD('purchase', 'trade_in_allowance', purchase_deal_id=F('purchase_deal_id')) or 0)
  - recorded_cap_amount: RND(P('ltv_cap_pct') * F('vehicle_value_basis') + 0.000000001, 2)
  - ltv_method: '''exclude_excess_amount'' if (ltv_trade_payoff > ltv_trade_allowance and F(''amount_financed'') > recorded_cap_amount and P(''excess_ltv_method'') == ''proportional_reduction'') else (''no_reduction'' if (ltv_trade_payoff <= ltv_trade_allowance and F(''amount_financed'') > recorded_cap_amount and F(''amount_financed'') <= recorded_cap_amount * (1 + K(''ltv_tolerance_pct''))) else P(''excess_ltv_method''))'
  - negative_equity: MX(0.0, float(LATEST('gap_ledger', 'negative_equity_amount', date_field='entry_date', benefit_line_type='gap_balance') or 0))
  - deductible_excess: MX(0.0, deductible - covered_deductible)
  - past_due_cut: MX(0.0, past_due - past_due_allowance) if P('exclude_past_due_payments') else 0.0
  - late_cut: MX(0.0, late_fees - late_charge_allowance) if P('exclude_late_fees') else 0.0
  - other_cuts: (addon_refunds if P('exclude_addon_refunds') else 0.0) + (negative_equity if P('exclude_negative_equity') else 0.0) + (salvage if P('exclude_salvage_retention') else 0.0)
  - gap_before_ltv: payoff - acv - deductible_excess - past_due_cut - late_cut - deferral_cut - other_cuts
  - cap_amount: RND(P('ltv_cap_pct') * cap_basis + 0.000000001, 2)
  - after_ltv: gap_before_ltv * MN(1.0, cap_amount / F('amount_financed')) if ltv_method == 'proportional_reduction' else ((gap_before_ltv - MX(0.0, F('amount_financed') - cap_amount)) if ltv_method == 'exclude_excess_amount' else gap_before_ltv)
  - benefit_cap: MN(P('max_benefit_usd'), P('max_benefit_pct_of_acv') * acv)
  - result: MN(benefit_cap, RND(MX(0.0, after_ltv) + 0.000000001, 2)) if claim_on_file else 0.0
  compute_basis:
    claim_on_file: A waiver with no claim line for the GAP balance on file has no claim figures, and its GAP balance line is 0.00.
    loss_type: The loss type and the loss date the ladders of this rule read are those recorded on the same claim line.
    loss_date: The loss type and the loss date the ladders of this rule read are those recorded on the same claim line.
    settlement_date: 'Late-charge allowance ladder: where the loss is a total_loss_theft, the late-charge allowance is late_allow_theft; where the loss is not a theft and the insurer''s settlement date recorded on the claim line is more than 30 calendar days after the loss date, the late-charge allowance is late_allow_slow_settlement; in every other case there is no late-charge allowance; only late fees and charges above the allowance are subtracted.'
    payoff: The GAP balance starts from the payoff at loss less the ACV settlement.
    acv: The GAP balance starts from the payoff at loss less the ACV settlement.
    deductible: The insurer's deductible above deductible_covered_cap_usd is subtracted.
    past_due: only past-due payments above the allowance are subtracted
    late_fees: only late fees and charges above the allowance are subtracted
    deferred: Past-due payments, late fees and charges, deferred payments, add-on refunds, negative trade equity carried into the deal (as recorded on the claim line) and retained salvage value are each subtracted in full where the waiver's switch for that item is true.
    addon_refunds: Past-due payments, late fees and charges, deferred payments, add-on refunds, negative trade equity carried into the deal (as recorded on the claim line) and retained salvage value are each subtracted in full where the waiver's switch for that item is true.
    salvage: Past-due payments, late fees and charges, deferred payments, add-on refunds, negative trade equity carried into the deal (as recorded on the claim line) and retained salvage value are each subtracted in full where the waiver's switch for that item is true.
    covered_deductible: 'Deductible ladder: where the loss is a total_loss_theft and the waiver had been in force 12 or more months at the loss, the covered deductible is the greater of deductible_covered_cap_usd and theft_deductible_cover; where the loss is a total_loss_collision and the waiver had been in force fewer than 12 months at the loss, the covered deductible is the greater of deductible_covered_cap_usd and early_collision_cover; in every other case the covered deductible is deductible_covered_cap_usd.'
    past_due_allowance: 'Past-due allowance ladder: where the waiver had been in force 24 or more months at the loss, the past-due allowance is past_due_allow_two_years; where it had been in force 12 to 23 months, the past-due allowance is past_due_allow_one_year; where it had been in force fewer than 12 months, there is no past-due allowance; only past-due payments above the allowance are subtracted.'
    late_charge_allowance: 'Late-charge allowance ladder: where the loss is a total_loss_theft, the late-charge allowance is late_allow_theft; where the loss is not a theft and the insurer''s settlement date recorded on the claim line is more than 30 calendar days after the loss date, the late-charge allowance is late_allow_slow_settlement; in every other case there is no late-charge allowance; only late fees and charges above the allowance are subtracted.'
