    - covered_deductible
    ladder:
    - when: a total_loss_theft with the waiver in force 12 or more months at the loss
      value: MX(P('deductible_covered_cap_usd'), K('theft_deductible_cover'))
    - when: a total_loss_collision with the waiver in force fewer than 12 months at the loss
      value: MX(P('deductible_covered_cap_usd'), K('early_collision_cover'))
    - when: otherwise
      value: P('deductible_covered_cap_usd')
    baseline:
      covered_deductible: P('deductible_covered_cap_usd')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: past_due_allowance_tier
    effect: parameter
    decides: past_due_allowance
    bindings:
    - past_due_allowance
    ladder:
    - when: in force 24 or more months at the loss
      value: K('past_due_allow_two_years')
    - when: in force 12 to 23 months at the loss
      value: K('past_due_allow_one_year')
    - when: in force fewer than 12 months at the loss
      value: '0.00'
    baseline:
      past_due_allowance: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: late_charge_allowance_tier
    effect: parameter
    decides: late_charge_allowance
    bindings:
    - settlement_date
    - late_charge_allowance
    ladder:
    - when: the loss is a total_loss_theft
      value: K('late_allow_theft')
    - when: the loss is not a theft and the insurer settled more than 30 calendar days after the loss date
      value: K('late_allow_slow_settlement')
    - when: otherwise
      value: '0.00'
    baseline:
      late_charge_allowance: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: deferral_treatment
    effect: method
    decides: deferral_cut
    bindings:
    - deferral_cut
    ladder:
    - when: the loss is a total_loss_theft
      method: deferred payments are not subtracted
    - when: the loss is a total_loss_collision and the waiver had been in force 12 or more months at the loss
      method: only deferred payments above deferral_allowance are subtracted, where the waiver's deferred-payment switch is true
    - when: any other loss type, or a collision in the first 12 months
      method: deferred payments are subtracted in full where the waiver's deferred-payment switch is true
    baseline:
      deferral_cut: deferred if P('exclude_deferred_payments') else 0.0
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: cap_basis_tier
    effect: parameter
    decides: cap_basis
    bindings:
    - cap_deal_type
    - cap_deal_cash
    - cap_basis
    ladder:
    - when: a Used Vehicle Retail Purchase or Value Line Used Vehicle Purchase whose cash_price is below the vehicle_value_basis
      value: the deal's cash_price
    - when: a Certified Pre-Owned Vehicle Purchase
      value: F('vehicle_value_basis') + K('cpo_certification_allowance')
    - when: otherwise
      value: F('vehicle_value_basis')
    baseline:
      cap_basis: F('vehicle_value_basis')
    evidence:
    - cross_category
    cross_difficulty: purchase
  - id: ltv_reduction_tier
    effect: method
    decides: ltv_method
    bindings:
    - ltv_trade_payoff
    - ltv_trade_allowance
    - recorded_cap_amount
    - ltv_method
    ladder:
    - when: the waiver's excess_ltv_method is proportional_reduction, the deal carried negative trade equity and the amount financed is above ltv_cap_pct times the vehicle_value_basis
      method: the amount financed above the cap amount is subtracted instead of the proportional reduction
    - when: the deal carried no negative trade equity and the amount financed is above ltv_cap_pct times the vehicle_value_basis by no more than ltv_tolerance_pct of that figure
      method: no loan-to-value reduction
    - when: otherwise
      method: the waiver's excess_ltv_method
    baseline:
      ltv_method: P('excess_ltv_method')
    evidence:
    - cross_category
    cross_difficulty: purchase
  baseline:
    rule: 'A waiver with no claim line for the GAP balance on file has no claim figures, and its GAP balance line is 0.00. The GAP balance starts from the payoff at loss less the ACV settlement. The insurer''s deductible above deductible_covered_cap_usd is subtracted. Past-due payments, late fees and charges, deferred payments, add-on refunds, negative trade equity carried into the deal (as recorded on the claim line) and retained salvage value are each subtracted in full where the waiver''s switch for that item is true. Financing above the loan-to-value cap, ltv_cap_pct times the waiver''s vehicle_value_basis rounded half up to the cent, then reduces the result by the waiver''s excess_ltv_method: under proportional_reduction the result is multiplied by the lesser of 1 and the cap amount over the amount financed, under exclude_excess_amount the amount financed above the cap is subtracted. The GAP balance benefit is that result rounded half up to the cent, floored at 0.00 and capped at the lesser of max_benefit_usd and max_benefit_pct_of_acv times the ACV settlement.'
    params:
    - deductible_covered_cap_usd
    - ltv_cap_pct
    - excess_ltv_method
    - max_benefit_usd
    - max_benefit_pct_of_acv
  inputs:
    history:
    - table: gap_ledger
      aggregate: latest
      field: payoff_at_loss
      filters:
        benefit_line_type: gap_balance
    cross_category:
    - purchase
- id: gap_ext_addon_overpayment_recovery
  base_policy_refs:
  - gap_evt_benefit_reversal
  overwrite:
  - base_policy: gap_evt_benefit_reversal
    superseded_clause: A benefit is paid in error when the primary insurer reopens or withdraws its total-loss settlement, or a stolen vehicle is recovered before the insurer settles.
    replaced_by: For a paid GAP balance line reversed under this policy, and only for such a line, the benefit is paid in error to the extent of the add-on overpayment reversal worked out here; every other benefit is paid in error when the primary insurer reopens or withdraws its total-loss settlement, or a stolen vehicle is recovered before the insurer settles.
  - base_policy: gap_evt_benefit_reversal
    superseded_clause: A benefit paid in error is reversed in full by one gap_benefit_reversed entry pointing at the paid line
    replaced_by: For a paid GAP balance line reversed under this policy, and only for such a line, the reversal is one gap_benefit_reversed entry pointing at the paid line for the add-on overpayment reversal rather than the full line; every other benefit paid in error is reversed in full by one gap_benefit_reversed entry pointing at the paid line.
  trigger: state_due
  subject:
  - gap_benefit_reversed
  computes: amount
  target_tool: recover_benefit_overpayment_99b30941
  params:
    admin_error_absorb: 50.0
    stale_payoff_waiver: 30.0
    late_refund_waiver: 15.0
    recovery_floor_usd: 60.0
    late_pay_rate: 0.08
    late_pay_rate_high: 0.12
  rule: 'This policy prices the reversal of the overpaid part of a paid GAP balance line whose holder''s Kessler Shield service contract or Kessler Care maintenance plan financed on the same purchase deal was cancelled with its refund paid to the lienholder; a reopened or withdrawn insurer settlement and a recovered stolen vehicle are outside it. The paid line is the waiver''s most recent paid GAP balance line, with its amount paid, its loss date, the date it was paid and the add-on refunds recorded on it. The add-on refunds received are the refunds of a Kessler Shield service contract and of a Kessler Care maintenance plan financed on the waiver''s purchase deal that were paid to the lienholder, each taken at the amount paid. The uncredited add-on refund is the add-on refunds received less the add-on refunds recorded on the paid line, floored at 0.00. The overpayment is the uncredited add-on refund, never more than the benefits standing on the claim, the amounts on the claim''s paid and denied lines (a denied line carries 0.00) less any benefit already reversed on it. The add-on overpayment reversal is the overpayment rounded half up to the cent. A waiver with no paid GAP balance line on file has no add-on overpayment reversal. Where the paid line paid no more than recovery_floor_usd, or the refunds of a Kessler Shield service contract or Kessler Care maintenance plan financed on the same deal and cancelled on or after the loss date, as paid to the lienholder, exceed the add-on refunds recorded on the paid line by no more than recovery_floor_usd, nothing is reversed. For a paid GAP balance line reversed under this policy, and only for such a line, the benefit is paid in error to the extent of the add-on overpayment reversal worked out here; every other benefit is paid in error when the primary insurer reopens or withdraws its total-loss settlement, or a stolen vehicle is recovered before the insurer settles. For a paid GAP balance line reversed under this policy, and only for such a line, the reversal is one gap_benefit_reversed entry pointing at the paid line for the add-on overpayment reversal rather than the full line; every other benefit paid in error is reversed in full by one gap_benefit_reversed entry pointing at the paid line. Plan timing ladder for an overpayment reversal: where the plan''s cancellation took effect before the loss date, its refund is not counted as received; where it took effect on or after the loss date and before the date the paid line was paid, its refund is counted less admin_error_absorb, but never less than half of that refund; where it took effect on or after the date the paid line was paid, its refund is counted in full. Contract restatement ladder for an overpayment reversal: where the service contract''s cancellation took effect before the loss date, its refund is not counted as received; where it took effect after the loss date, its refund is counted restated to the loss date, the refund received times calendar days from the loss date to the contract''s expiration_date over calendar days from its effective cancellation date to that expiration_date; where it took effect on the loss date, its refund is counted as received. Fee add-back ladder for an overpayment reversal: reading each add-on''s reason from its completed cancellation request and counting only an add-on whose refund was paid to the lienholder, where both the plan and the service contract were cancelled on or after the loss date for the reason customer_request or vehicle_sold_or_traded and both refunds were paid to the lienholder, the plan''s cancellation_fee_usd and the contract''s cancellation_fee_usd are added to the counted refunds; where only one of them was so cancelled with its refund paid to the lienholder, that product''s cancellation_fee_usd is added; in every other case nothing is added. Prompt-payment interest ladder for an overpayment reversal: where the paid line was paid more than twice claim_payment_days calendar days
    after the insurer''s settlement date recorded on it, the late-payment interest owed on it runs at late_pay_rate_high a year; where it was paid more than claim_payment_days but no more than twice claim_payment_days calendar days after that date, it runs at late_pay_rate; where it was paid within claim_payment_days calendar days of that date, no late-payment interest is owed; the late-payment interest owed, set against the overpayment, is the amount paid on the line times the late-payment rate times the calendar days past claim_payment_days after the settlement date over 365, rounded half up to the cent. Stale-payoff waiver ladder for an overpayment reversal: reading, for each add-on cancelled on or after the loss date, the date its refund was last paid to the lienholder, where the earlier of those dates is before the paid line was paid, stale_payoff_waiver is waived from the overpayment; where that earlier date falls within claim_payment_days calendar days after the payment, late_refund_waiver is waived; in every other case nothing is waived. The add-on overpayment reversal is assembled in this order: each product''s refund is counted as the ladders of this rule count it and any amount those ladders add to the counted refunds is added, the uncredited add-on refund and the overpayment are worked out from those counts, every amount the ladders set against the overpayment is subtracted but never takes it below one half of the overpayment, and the result is rounded half up to the cent.'
  prerequisite: []
  cross_category:
  - category: maintenance
    as: branch
    reads:
    - maintenance_plan_id
    - closed_date
    - refund paid entries
    - cancellation requests
    - cancellation_fee_usd
    note: The plan refund received, the plan timing, fee add-back and stale-payoff ladders and the floor test read the Kessler Care plan financed on the same deal, its lienholder refund payment, its cancellation request and its cancellation fee.
  - category: vsc
    as: branch
    reads:
    - vsc_contract_id
    - closed_date
    - expiration_date
    - refund paid entries
    - cancellation requests
    - cancellation_fee_usd
    note: The contract refund received, the contract restatement, fee add-back and stale-payoff ladders and the floor test read the Kessler Shield contract financed on the same deal, its lienholder refund payment, its cancellation request and its cancellation fee.
  compute:
  - line_on_file: COUNT('gap_ledger', event_type='gap_benefit_paid', benefit_line_type='gap_balance') > 0
  - line_paid: float(LATEST('gap_ledger', 'amount', date_field='entry_date', event_type='gap_benefit_paid', benefit_line_type='gap_balance') or 0)
  - line_paid_date: LATEST('gap_ledger', 'entry_date', date_field='entry_date', event_type='gap_benefit_paid', benefit_line_type='gap_balance') or NOW
  - line_loss_date: LATEST('gap_ledger', 'loss_date', date_field='entry_date', event_type='gap_benefit_paid', benefit_line_type='gap_balance') or NOW
  - line_settlement_date: LATEST('gap_ledger', 'settlement_date', date_field='entry_date', event_type='gap_benefit_paid', benefit_line_type='gap_balance') or NOW
  - line_credited: float(LATEST('gap_ledger', 'addon_refunds_credited', date_field='entry_date', event_type='gap_benefit_paid', benefit_line_type='gap_balance') or 0)
  - claim_no: LATEST('gap_ledger', 'claim_number', date_field='entry_date', event_type='gap_benefit_paid', benefit_line_type='gap_balance')
  - claim_standing: SUM('gap_ledger', 'amount', claim_number=claim_no) - 2 * SUM('gap_ledger', 'amount', claim_number=claim_no, event_type='gap_benefit_reversed')
  - plan_id: CFIELD('maintenance', 'maintenance_plan_id', purchase_deal_id=F('purchase_deal_id'), financed_on_contract='true')
  - plan_refund: XSUM('maintenance', 'maintenance_plan_ledger', 'amount', event_type='maintenance_refund_paid', refund_payee='lienholder', maintenance_plan_id=plan_id)
  - plan_closed: CFIELD('maintenance', 'closed_date', purchase_deal_id=F('purchase_deal_id'), financed_on_contract='true') or '9999-12-31'
  - contract_id: CFIELD('vsc', 'vsc_contract_id', purchase_deal_id=F('purchase_deal_id'), financed_on_contract='true')
  - contract_refund: XSUM('vsc', 'vsc_ledger', 'amount', event_type='vsc_refund_paid', refund_payee='lienholder', vsc_contract_id=contract_id)
  - contract_closed: CFIELD('vsc', 'closed_date', purchase_deal_id=F('purchase_deal_id'), financed_on_contract='true') or '9999-12-31'
  - floor_excess: (plan_refund if DAYS(line_loss_date, plan_closed) >= 0 else 0.0) + (contract_refund if DAYS(line_loss_date, contract_closed) >= 0 else 0.0) - line_credited
  - plan_counted: 0.0 if DAYS(line_loss_date, plan_closed) < 0 else (MX(plan_refund / 2.0, plan_refund - K('admin_error_absorb')) if DAYS(plan_closed, line_paid_date) > 0 else plan_refund)
  - contract_counted: (0.0 if contract_closed < line_loss_date else (contract_refund * DAYS(line_loss_date, CFIELD('vsc', 'expiration_date', purchase_deal_id=F('purchase_deal_id'), financed_on_contract='true')) / MX(1, DAYS(contract_closed, CFIELD('vsc', 'expiration_date', purchase_deal_id=F('purchase_deal_id'), financed_on_contract='true'))) if contract_closed > line_loss_date else contract_refund)) if contract_refund > 0 else 0.0
  - plan_reason: XLATEST('maintenance', 'maintenance_cancellation_requests', 'cancel_reason', date_field='request_date', maintenance_plan_id=plan_id, request_status='completed')
  - contract_reason: XLATEST('vsc', 'vsc_cancellation_requests', 'cancel_reason', date_field='request_date', vsc_contract_id=contract_id, request_status='completed')
  - fee_addback: (CPARAM('maintenance', 'cancellation_fee_usd', purchase_deal_id=F('purchase_deal_id'), financed_on_contract='true') if (plan_refund > 0 and DAYS(line_loss_date, plan_closed) >= 0 and (plan_reason == 'customer_request' or plan_reason == 'vehicle_sold_or_traded')) else 0.0) + (CPARAM('vsc', 'cancellation_fee_usd', purchase_deal_id=F('purchase_deal_id'), financed_on_contract='true') if (contract_refund > 0 and DAYS(line_loss_date, contract_closed) >= 0 and (contract_reason == 'customer_request' or contract_reason == 'vehicle_sold_or_traded')) else 0.0)
  - uncredited: MX(0.0, plan_counted + contract_counted + fee_addback - line_credited)
  - overpayment: MN(claim_standing, uncredited)
  - late_pay_rate: K('late_pay_rate_high') if DAYS(line_settlement_date, line_paid_date) > 2 * P('claim_payment_days') else (K('late_pay_rate') if DAYS(line_settlement_date, line_paid_date) > P('claim_payment_days') else 0.0)
  - late_pay_credit: RND(line_paid * late_pay_rate * MX(0, DAYS(line_settlement_date, line_paid_date) - P('claim_payment_days')) / 365.0 + 0.000000001, 2)
  - first_refund_paid: MN((XLATEST('maintenance', 'maintenance_plan_ledger', 'entry_date', date_field='entry_date', event_type='maintenance_refund_paid', refund_payee='lienholder', maintenance_plan_id=plan_id) or '9999-12-31') if DAYS(line_loss_date, plan_closed) >= 0 else '9999-12-31', (XLATEST('vsc', 'vsc_ledger', 'entry_date', date_field='entry_date', event_type='vsc_refund_paid', refund_payee='lienholder', vsc_contract_id=contract_id) or '9999-12-31') if DAYS(line_loss_date, contract_closed) >= 0 else '9999-12-31')
  - stale_waiver: K('stale_payoff_waiver') if first_refund_paid < line_paid_date else (K('late_refund_waiver') if (first_refund_paid != '9999-12-31' and DAYS(line_paid_date, first_refund_paid) <= P('claim_payment_days')) else 0.0)
  - result: RND(MX(overpayment / 2.0, overpayment - late_pay_credit - stale_waiver) + 0.000000001, 2) if (line_on_file and line_paid > K('recovery_floor_usd') and floor_excess > K('recovery_floor_usd')) else 0.0
  compute_basis:
