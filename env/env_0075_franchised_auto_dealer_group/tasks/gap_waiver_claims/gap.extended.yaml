  baseline:
    rule: The lienholder release pays the refund due, which is the amount of the refund calculation entry on the waiver's ledger. The effective date of the cancellation is the waiver's closing date, or the release date where the waiver carries none. The late window of a lienholder release starts on the effective date of the cancellation. Where the release is made more than refund_payment_days calendar days after the late window starts, late-release interest is added on the refund due at standard_late_rate a year for each calendar day past refund_payment_days after the window start, counted on a 365-day year and rounded half up to the cent. The lienholder release amount is the refund due plus the late-release interest, rounded half up to the cent. A lienholder release is not made for a refund due of 0.00.
