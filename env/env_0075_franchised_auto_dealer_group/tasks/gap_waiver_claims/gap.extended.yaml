category: gap
display_name: Kessler GAP Waiver Addenda
binding:
  holding_table: gap_waivers
  event_tables:
  - gap_ledger
  intake_tables:
  - gap_cancellation_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    benefits_paid_total: gap_benefits_paid
    refund_due_balance: gap_refund_due
lifecycle:
  states:
  - active
  - claim_settled
  - cancelled
  - terminated
  - expired
  transitions:
  - from: active
    to: claim_settled
    by: agent
    means: The GAP benefit for a total loss is paid, which ends the waiver.
  - from: active
    to: cancelled
    by: user
    means: The holder cancels the waiver by a signed cancellation request.
  - from: active
    to: terminated
    by: system
    means: The lienholder reports the installment contract paid in full or refinanced away before the waiver term ends.
  - from: active
    to: expired
    by: system
    means: The waiver term ends with the contract's scheduled maturity.
accounts:
- key: gap_benefits_paid
  unit: USD
  meaning: GAP benefits paid under one waiver; benefit payments increase it and reversals reduce it.
- key: gap_refund_due
  unit: USD
  meaning: Cancellation or termination refund computed for one waiver and not yet paid out.
parameter_schema:
  ltv_cap_pct: Loan-to-value cap as a fraction of the vehicle value basis (1.25 = 125 percent); financing above it reduces the benefit.
  excess_ltv_method: How financing above the cap reduces the benefit (proportional_reduction = benefit times cap amount over amount financed; exclude_excess_amount = the excess is subtracted).
  vehicle_value_source: Value the cap is measured against (msrp for new vehicles, nada_retail for used vehicles, msrp_or_nada_retail by condition).
  max_benefit_usd: Most the waiver pays on the GAP balance, USD.
  max_benefit_pct_of_acv: Most the waiver pays on the GAP balance as a fraction of the primary insurer's ACV settlement; 1.00 means no such cap.
  deductible_covered_cap_usd: Part of the primary insurer's deductible the waiver covers, USD; any deductible above it is subtracted from the benefit.
  replacement_vehicle_credit_usd: Credit toward a replacement vehicle bought from a group store after a paid total-loss claim, USD; 0.00 means none.
  replacement_credit_window_days: Calendar days after the GAP benefit is paid within which the replacement vehicle must be contracted.
  replacement_credit_store_scope: Stores where the replacement credit is honored (all_group_stores).
  min_term_months: Shortest installment contract term the waiver may be sold on.
  max_term_months: Longest installment contract term the waiver may be sold on.
  term_match_loan_required: Switch (true/false) — whether the waiver term must equal the installment contract term.
  min_amount_financed_usd: Smallest amount financed the waiver may be sold on, USD.
  max_amount_financed_usd: Largest amount financed the waiver may be sold on, USD.
  eligible_vehicle_conditions: List of vehicle_condition values the waiver may be sold on.
  max_vehicle_age_years: Greatest vehicle age at sale (sale year minus model year).
  commercial_use_eligible: Switch (true/false) — whether a vehicle in commercial use may be covered.
  lease_eligible: Switch (true/false) — whether the waiver may be attached to a lease.
  max_retail_price_usd: Highest price at which the waiver may be sold, USD.
  max_waivers_per_vehicle: Most active waivers on one vehicle.
  claims_count_limit: Most total-loss claims one waiver pays.
  payoff_interest_basis: How the payoff at loss is figured (simple_interest_daily = the lienholder's net payoff with simple interest accrued to the loss date).
  acv_basis: Which insurer figure is the ACV (primary_insurer_settlement_before_deductible).
  require_primary_insurance: Switch (true/false) — whether a primary physical-damage insurance settlement is required for a benefit.
  partial_loss_excluded: Switch (true/false) — whether only total losses are covered.
  mechanical_breakdown_excluded: Switch (true/false) — whether a vehicle declared a loss for mechanical breakdown is excluded.
  exclude_past_due_payments: Switch (true/false) — whether past-due payments are subtracted from the benefit.
  exclude_late_fees: Switch (true/false) — whether late fees and charges are subtracted from the benefit.
  exclude_deferred_payments: Switch (true/false) — whether deferred or extended payments are subtracted from the benefit.
  exclude_addon_refunds: Switch (true/false) — whether refunds of cancelled financed products are subtracted from the benefit.
  exclude_negative_equity: Switch (true/false) — whether negative trade equity carried into the contract is subtracted from the benefit.
  exclude_salvage_retention: Switch (true/false) — whether a salvage value deducted for an owner-retained vehicle is subtracted from the benefit.
  gap_benefit_payee: Who receives the GAP balance benefit (lienholder).
  claim_notice_days: Calendar days after the primary insurer's settlement date within which the claim must be reported.
  claim_documents_days: Calendar days after the claim is reported within which the required documents must be supplied.
  theft_waiting_days: Calendar days a stolen vehicle must remain unrecovered before a theft claim is paid.
  claim_payment_days: Calendar days after the last required document within which an approved benefit is paid.
  claim_denial_appeal_days: Calendar days after a denial within which the holder may submit new evidence for review.
  free_look_days: Calendar days after the sale date within which a waiver is cancelled for a full refund.
  refund_method: How the refund after the free look is computed (pro_rata_daily = unused days of the term over total days of the term).
  cancellation_fee_usd: Fee deducted from a refund after the free look, USD.
  cancellation_fee_waived_on_payoff: Switch (true/false) — whether no fee is deducted on a termination for early payoff or refinance.
  refund_on_payoff_automatic: Switch (true/false) — whether the refund is computed automatically when the lienholder reports the loan paid off.
  refinance_terminates_waiver: Switch (true/false) — whether refinancing the contract with another lender ends the waiver.
  deal_unwind_flat_cancel: Switch (true/false) — whether a waiver on an unwound deal is cancelled flat with a full refund.
  refund_to_lienholder_while_lien_open: Switch (true/false) — whether a refund is paid to the lienholder while the loan is open.
  refund_payment_days: Calendar days after the cancellation or termination is processed within which the refund is paid.
  transfer_on_assumption_allowed: Switch (true/false) — whether the waiver follows the contract when another borrower assumes it.
