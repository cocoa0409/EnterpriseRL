    ltv_trade_payoff: 'Loan-to-value ladder: reading the recorded cap amount, ltv_cap_pct times the waiver''s vehicle_value_basis rounded half up to the cent, where the waiver''s excess_ltv_method is proportional_reduction, the purchase deal carried negative trade equity (its trade_payoff_amount above its trade_in_allowance) and the amount financed is above the recorded cap amount, the amount financed above the loan-to-value cap amount is subtracted instead; where the deal carried no negative trade equity and the amount financed is above the recorded cap amount by no more than ltv_tolerance_pct of the recorded cap amount, there is no reduction; in every other case the waiver''s excess_ltv_method applies.'
