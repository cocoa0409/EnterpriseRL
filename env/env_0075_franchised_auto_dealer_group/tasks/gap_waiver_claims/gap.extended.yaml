  overwrite:
  - base_policy: gap_evt_cancellation_refund
    superseded_clause: the cancellation is effective on the request date
    replaced_by: For a holder's cancellation priced under this policy, and only for such a cancellation, the effective date is the one the ladders of this rule select; every other cancellation stays effective on the request date.
  - base_policy: gap_evt_cancellation_refund
    superseded_clause: Otherwise the refund follows the waiver's refund_method, pro_rata_daily (cancel_method pro_rata) — retail_price times gap_msr_unused_term_share, rounded to the cent, less cancellation_fee_usd;
    replaced_by: For a holder's cancellation priced under this policy, and only for such a cancellation, the refund is assembled in the order this rule states; a termination after a lienholder payoff report is outside this sentence, and any other ending of a waiver that neither this rule nor the termination rule prices keeps the retail_price times gap_msr_unused_term_share, rounded half up to the cent, less cancellation_fee_usd.
  - base_policy: gap_evt_cancellation_refund
    superseded_clause: Where refund_on_payoff_automatic is true, a waiver whose contract the lienholder reports paid off or, where refinance_terminates_waiver is true, refinanced away is terminated with its loan_payoff_date as the effective date and its refund computed without any request.
    replaced_by: For an active waiver that carries a submitted signed cancellation request, and only for such a waiver, the holder's cancellation ends the waiver even where its lienholder has reported the contract paid off or refinanced away; every other waiver whose contract the lienholder reports paid off, or refinanced away where refinance_terminates_waiver is true, is terminated with its refund computed without any request where refund_on_payoff_automatic is true.
  trigger: state_due
  subject:
  - gap_waiver_cancelled
  - gap_refund_calculated
  computes: refund_amount
  target_tool: confirm_gap_cancellation_0d8763f7
  params:
    mail_grace_days: 7
    admin_portion_new: 40.0
    admin_portion_used: 60.0
    charge_second_year: 25.0
    early_charge_first_year: 75.0
    early_charge_second_year: 35.0
    bundle_recapture_contract: 50.0
    bundle_recapture_plan: 25.0
  rule: 'This policy prices the cancellation refund booked when the holder confirms the submitted signed cancellation request recorded for an active waiver. An active waiver that carries a submitted signed cancellation request recorded for it ends by the holder''s cancellation, whether or not its lienholder has reported a loan payoff date; an active waiver with a loan_payoff_date on file and no submitted signed cancellation request ends by termination. The cancellation refund starts from the waiver''s retail_price. The effective date of the cancellation is the request date the holder signed on the request recorded for the waiver. A waiver with no submitted signed cancellation request on file is not cancelled under this policy, and its cancellation refund is 0.00. A cancellation whose effective date falls within free_look_days calendar days after the sale date, or whose purchase deal has been unwound, is refunded the full retail_price. Otherwise the cancellation refund is the retail_price times the unused share, which is calendar days from the signed request date to expiration_date over calendar days from sale_date to expiration_date, rounded half up to the cent, less cancellation_fee_usd. A cancellation refund below 0.00 is 0.00. For a holder''s cancellation priced under this policy, and only for such a cancellation, the effective date is the one the ladders of this rule select; every other cancellation stays effective on the request date. For a holder''s cancellation priced under this policy, and only for such a cancellation, the refund is assembled in the order this rule states; a termination after a lienholder payoff report is outside this sentence, and any other ending of a waiver that neither this rule nor the termination rule prices keeps the retail_price times gap_msr_unused_term_share, rounded half up to the cent, less cancellation_fee_usd. The cancellation refund is assembled in this order: any reduction of the price that a ladder of this rule makes comes off the retail_price before the unused share is applied, the unused share is applied and that result rounded half up to the cent, every amount a ladder adds to or takes off the refund, each rounded half up to the cent, is applied next, and the result is floored at 0.00. The waiver''s months in force are whole calendar months from sale_date to the request date the holder signed. In counting a cancelled waiver''s whole calendar months, both the months it was in force and its unused months, a whole calendar month counts each time the start date''s day of the month is reached; an end date on an earlier day of the month does not complete the month, and there is no month-end adjustment. For an active waiver that carries a submitted signed cancellation request, and only for such a waiver, the holder''s cancellation ends the waiver even where its lienholder has reported the contract paid off or refinanced away; every other waiver whose contract the lienholder reports paid off, or refinanced away where refinance_terminates_waiver is true, is terminated with its refund computed without any request where refund_on_payoff_automatic is true. Effective-date ladder for a cancellation: where the lienholder''s reported loan payoff date is earlier than the signed request date, the cancellation is effective on that payoff date and the refund adds the retail_price times calendar days from that payoff date to the signed request date over calendar days from sale_date to expiration_date; where no such payoff date is on file and the request was recorded more than mail_grace_days calendar days after the holder signed it, the cancellation is effective on the date the request was recorded and the refund gives up the retail_price times calendar days from the signed request date to that recorded date over calendar days from sale_date to expiration_date; in every other case the cancellation is effective on the signed request date and the refund is neither added to nor reduced. Share ladder for a cancellation:
    where the contract term is 72 months or longer and the waiver has been in force 12 or more months, the unused share is whole calendar months from the signed request date to expiration_date over the term months; where the contract term is 60 months or shorter and the waiver has been in force fewer than 12 months, the unused share is the sum-of-the-digits share, unused whole months times unused whole months plus one over term months times term months plus one; in every other case the unused share is the calendar-day share. Cancellation-charge ladder: where the waiver has been in force 24 or more months and the request states the reason customer_request, no cancellation charge is taken; where the waiver has been in force 12 to 23 months and the request states the reason customer_request, the cancellation charge is charge_second_year; in every other case the cancellation charge is cancellation_fee_usd. Administrator-portion ladder: where the waiver''s purchase deal is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, admin_portion_new is withheld from the price; where it is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase, admin_portion_used is withheld from the price; in every other case nothing is withheld from the price. Early-cancellation ladder: where the waiver has been in force fewer than 12 months, the early cancellation charge is early_charge_first_year; where it has been in force 12 to 23 months, the early cancellation charge is early_charge_second_year; where it has been in force 24 or more months, there is no early cancellation charge. Bundle-recapture ladder: where a Kessler Shield service contract sold on the same purchase deal is in active status, bundle_recapture_contract is recaptured from the cancellation refund; where no such contract is active and a Kessler Care maintenance plan sold on the same purchase deal is in active status, bundle_recapture_plan is recaptured; in every other case nothing is recaptured.'
  prerequisite: []
  cross_category:
  - category: purchase
    as: branch
    reads:
    - variant_name
    - status
    note: The administrator-portion ladder reads the deal type of the waiver's purchase deal, and the unwound-deal refund reads its status.
  - category: vsc
    as: branch
    reads:
    - status
    note: The bundle-recapture ladder reads whether a service contract sold on the same deal is active.
  - category: maintenance
    as: branch
    reads:
    - status
    note: The bundle-recapture ladder reads whether a maintenance plan sold on the same deal is active.
  compute:
  - request_on_file: COUNT('gap_cancellation_requests', request_status='submitted') > 0
  - signed_date: LATEST('gap_cancellation_requests', 'request_date', date_field='request_date', request_status='submitted') or NOW
  - recorded_stamp: LATEST('gap_cancellation_requests', 'created_at', date_field='request_date', request_status='submitted') or NOW
  - request_reason: LATEST('gap_cancellation_requests', 'cancel_reason', date_field='request_date', request_status='submitted')
  - payoff_before_signing: (F('loan_payoff_date') or '9999-12-31') < signed_date
  - effective_date: F('loan_payoff_date') if payoff_before_signing else (recorded_stamp if (DAYS(signed_date, recorded_stamp) > K('mail_grace_days')) else signed_date)
  - cancel_charge: 0.0 if (MONTHS(F('sale_date'), signed_date) >= 24 and request_reason == 'customer_request') else (K('charge_second_year') if (MONTHS(F('sale_date'), signed_date) >= 12 and request_reason == 'customer_request') else P('cancellation_fee_usd'))
  - deal_type: CFIELD('purchase', 'variant_name', purchase_deal_id=F('purchase_deal_id'))
  - admin_portion: K('admin_portion_new') if (deal_type == 'New Vehicle Retail Purchase' or deal_type == 'New Vehicle Factory Order Purchase') else (K('admin_portion_used') if (deal_type == 'Used Vehicle Retail Purchase' or deal_type == 'Certified Pre-Owned Vehicle Purchase' or deal_type == 'Value Line Used Vehicle Purchase') else 0.0)
  - early_charge: K('early_charge_first_year') if MONTHS(F('sale_date'), signed_date) < 12 else (K('early_charge_second_year') if MONTHS(F('sale_date'), signed_date) < 24 else 0.0)
  - contract_status: EXISTS('vsc', purchase_deal_id=F('purchase_deal_id'), status='active')
  - plan_status: EXISTS('maintenance', purchase_deal_id=F('purchase_deal_id'), status='active')
  - bundle_recapture: K('bundle_recapture_contract') if contract_status else (K('bundle_recapture_plan') if plan_status else 0.0)
  - deal_status: CFIELD('purchase', 'status', purchase_deal_id=F('purchase_deal_id'))
  - term_days: DAYS(F('sale_date'), F('expiration_date'))
  - eff_adjustment: RND(MX(0.0, F('retail_price') * DAYS(effective_date, signed_date) / term_days) + 0.000000001, 2) - RND(MX(0.0, F('retail_price') * DAYS(signed_date, effective_date) / term_days) + 0.000000001, 2)
  - unused_days: MX(0, DAYS(signed_date, F('expiration_date')))
  - unused_months: MX(0, MONTHS(signed_date, F('expiration_date')))
  - unused_share: (unused_months / F('loan_term_months')) if (F('loan_term_months') >= 72 and MONTHS(F('sale_date'), signed_date) >= 12) else ((unused_months * (unused_months + 1)) / (F('loan_term_months') * (F('loan_term_months') + 1)) if (F('loan_term_months') <= 60 and MONTHS(F('sale_date'), signed_date) < 12) else unused_days / term_days)
  - flat_refund: DAYS(F('sale_date'), effective_date) <= P('free_look_days') or deal_status == 'unwound'
  - shared_refund: RND((F('retail_price') - admin_portion) * unused_share + 0.000000001, 2)
  - result: (RND(F('retail_price') + 0.000000001, 2) if flat_refund else RND(MX(0.0, shared_refund + eff_adjustment - cancel_charge - early_charge - bundle_recapture) + 0.000000001, 2)) if request_on_file else 0.0
  compute_basis:
    request_on_file: A waiver with no submitted signed cancellation request on file is not cancelled under this policy, and its cancellation refund is 0.00.
    signed_date: The effective date of the cancellation is the request date the holder signed on the request recorded for the waiver.
    recorded_stamp: where no such payoff date is on file and the request was recorded more than mail_grace_days calendar days after the holder signed it, the cancellation is effective on the date the request was recorded
    request_reason: where the waiver has been in force 12 to 23 months and the request states the reason customer_request, the cancellation charge is charge_second_year
    payoff_before_signing: where the lienholder's reported loan payoff date is earlier than the signed request date, the cancellation is effective on that payoff date
    effective_date: 'Effective-date ladder for a cancellation: where the lienholder''s reported loan payoff date is earlier than the signed request date, the cancellation is effective on that payoff date and the refund adds the retail_price times calendar days from that payoff date to the signed request date over calendar days from sale_date to expiration_date; where no such payoff date is on file and the request was recorded more than mail_grace_days calendar days after the holder signed it, the cancellation is effective on the date the request was recorded and the refund gives up the retail_price times calendar days from the signed request date to that recorded date over calendar days from sale_date to expiration_date; in every other case the cancellation is effective on the signed request date and the refund is neither added to nor reduced.'
    cancel_charge: 'Cancellation-charge ladder: where the waiver has been in force 24 or more months and the request states the reason customer_request, no cancellation charge is taken; where the waiver has been in force 12 to 23 months and the request states the reason customer_request, the cancellation charge is charge_second_year; in every other case the cancellation charge is cancellation_fee_usd.'
    deal_type: where the waiver's purchase deal is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, admin_portion_new is withheld from the price
    admin_portion: 'Administrator-portion ladder: where the waiver''s purchase deal is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, admin_portion_new is withheld from the price; where it is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase, admin_portion_used is withheld from the price; in every other case nothing is withheld from the price.'
    early_charge: 'Early-cancellation ladder: where the waiver has been in force fewer than 12 months, the early cancellation charge is early_charge_first_year; where it has been in force 12 to 23 months, the early cancellation charge is early_charge_second_year; where it has been in force 24 or more months, there is no early cancellation charge.'
    contract_status: where a Kessler Shield service contract sold on the same purchase deal is in active status, bundle_recapture_contract is recaptured from the cancellation refund
    plan_status: where no such contract is active and a Kessler Care maintenance plan sold on the same purchase deal is in active status, bundle_recapture_plan is recaptured
    bundle_recapture: 'Bundle-recapture ladder: where a Kessler Shield service contract sold on the same purchase deal is in active status, bundle_recapture_contract is recaptured from the cancellation refund; where no such contract is active and a Kessler Care maintenance plan sold on the same purchase deal is in active status, bundle_recapture_plan is recaptured; in every other case nothing is recaptured.'
    deal_status: A cancellation whose effective date falls within free_look_days calendar days after the sale date, or whose purchase deal has been unwound, is refunded the full retail_price.
    term_days: Otherwise the cancellation refund is the retail_price times the unused share, which is calendar days from the signed request date to expiration_date over calendar days from sale_date to expiration_date, rounded half up to the cent, less cancellation_fee_usd.
    unused_days: Otherwise the cancellation refund is the retail_price times the unused share, which is calendar days from the signed request date to expiration_date over calendar days from sale_date to expiration_date, rounded half up to the cent, less cancellation_fee_usd.
    unused_months: 'Share ladder for a cancellation: where the contract term is 72 months or longer and the waiver has been in force 12 or more months, the unused share is whole calendar months from the signed request date to expiration_date over the term months; where the contract term is 60 months or shorter and the waiver has been in force fewer than 12 months, the unused share is the sum-of-the-digits share, unused whole months times unused whole months plus one over term months times term months plus one; in every other case the unused share is the calendar-day share.'
    unused_share: 'Share ladder for a cancellation: where the contract term is 72 months or longer and the waiver has been in force 12 or more months, the unused share is whole calendar months from the signed request date to expiration_date over the term months; where the contract term is 60 months or shorter and the waiver has been in force fewer than 12 months, the unused share is the sum-of-the-digits share, unused whole months times unused whole months plus one over term months times term months plus one; in every other case the unused share is the calendar-day share.'
    flat_refund: A cancellation whose effective date falls within free_look_days calendar days after the sale date, or whose purchase deal has been unwound, is refunded the full retail_price.
    shared_refund: 'The cancellation refund is assembled in this order: any reduction of the price that a ladder of this rule makes comes off the retail_price before the unused share is applied, the unused share is applied and that result rounded half up to the cent, every amount a ladder adds to or takes off the refund, each rounded half up to the cent, is applied next, and the result is floored at 0.00.'
    result: 'The cancellation refund is assembled in this order: any reduction of the price that a ladder of this rule makes comes off the retail_price before the unused share is applied, the unused share is applied and that result rounded half up to the cent, every amount a ladder adds to or takes off the refund, each rounded half up to the cent, is applied next, and the result is floored at 0.00.'
    eff_adjustment: 'Effective-date ladder for a cancellation: where the lienholder''s reported loan payoff date is earlier than the signed request date, the cancellation is effective on that payoff date and the refund adds the retail_price times calendar days from that payoff date to the signed request date over calendar days from sale_date to expiration_date; where no such payoff date is on file and the request was recorded more than mail_grace_days calendar days after the holder signed it, the cancellation is effective on the date the request was recorded and the refund gives up the retail_price times calendar days from the signed request date to that recorded date over calendar days from sale_date to expiration_date; in every other case the cancellation is effective on the signed request date and the refund is neither added to nor reduced.'
  factors:
  - id: eff_date_rule
    effect: method
    decides: eff_adjustment
    bindings:
    - recorded_stamp
    - payoff_before_signing
    - effective_date
    - eff_adjustment
    ladder:
    - when: the lienholder's reported loan payoff date is earlier than the signed request date
      method: effective on the payoff date; the refund adds retail_price x days from the payoff date to the signed date over the term days
    - when: no earlier payoff date and the request recorded more than mail_grace_days after signing
      method: effective on the recorded date; the refund gives up retail_price x days from the signed date to the recorded date over the term days
    - when: otherwise
      method: effective on the signed request date; no adjustment
    baseline:
      effective_date: signed_date
      eff_adjustment: '0.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: share_convention
    effect: method
    decides: unused_share
    bindings:
    - unused_months
    - unused_share
    ladder:
    - when: contract term of 72 months or longer and the waiver in force 12 or more months
      method: whole calendar months from the signed request date to expiration_date over the term months
    - when: contract term of 60 months or shorter and the waiver in force fewer than 12 months
      method: 'sum-of-the-digits share: unused whole months times unused whole months plus one over term months times term months plus one'
    - when: otherwise
      method: calendar days from the signed request date to expiration_date over calendar days from sale_date to expiration_date
    baseline:
      unused_share: unused_days / term_days
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: cancel_charge_tier
    effect: parameter
    decides: cancel_charge
    bindings:
    - request_reason
    - cancel_charge
    ladder:
    - when: in force 24 or more months and the request states the reason customer_request
      value: '0.00'
    - when: in force 12 to 23 months and the request states the reason customer_request
      value: K('charge_second_year')
    - when: otherwise
      value: P('cancellation_fee_usd')
    baseline:
      cancel_charge: P('cancellation_fee_usd')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: admin_portion_tier
    effect: parameter
    decides: admin_portion
    bindings:
    - deal_type
    - admin_portion
    ladder:
    - when: the purchase deal is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase
      value: K('admin_portion_new')
    - when: the purchase deal is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase
      value: K('admin_portion_used')
    - when: otherwise
      value: '0.00'
    baseline:
      admin_portion: '0.0'
    evidence:
    - cross_category
    cross_difficulty: purchase
  - id: early_charge_tier
    effect: parameter
    decides: early_charge
    bindings:
    - early_charge
    ladder:
    - when: in force fewer than 12 months
      value: K('early_charge_first_year')
    - when: in force 12 to 23 months
      value: K('early_charge_second_year')
    - when: in force 24 or more months
      value: '0.00'
    baseline:
      early_charge: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: bundle_recapture_tier
    effect: parameter
    decides: bundle_recapture
    bindings:
    - contract_status
    - plan_status
    - bundle_recapture
    ladder:
    - when: a Kessler Shield service contract sold on the same purchase deal is in active status
      value: K('bundle_recapture_contract')
    - when: no such contract is active and a Kessler Care maintenance plan sold on the same purchase deal is in active status
      value: K('bundle_recapture_plan')
    - when: otherwise
      value: '0.00'
    baseline:
      bundle_recapture: '0.0'
    evidence:
    - cross_category
    cross_difficulty: vsc
  baseline:
    rule: The cancellation refund starts from the waiver's retail_price. The effective date of the cancellation is the request date the holder signed on the request recorded for the waiver. A waiver with no submitted signed cancellation request on file is not cancelled under this policy, and its cancellation refund is 0.00. A cancellation whose effective date falls within free_look_days calendar days after the sale date, or whose purchase deal has been unwound, is refunded the full retail_price. Otherwise the cancellation refund is the retail_price times the unused share, which is calendar days from the signed request date to expiration_date over calendar days from sale_date to expiration_date, rounded half up to the cent, less cancellation_fee_usd. A cancellation refund below 0.00 is 0.00.
    params:
    - free_look_days
    - cancellation_fee_usd
  inputs:
    history:
    - table: gap_cancellation_requests
      aggregate: latest
      field: request_date
      filters:
        request_status: submitted
    cross_category:
    - purchase
    - vsc
    - maintenance
- id: gap_ext_lienholder_refund_release
  base_policy_refs:
  - gap_evt_refund_payment
  overwrite:
  - base_policy: gap_evt_refund_payment
    superseded_clause: A computed refund is paid within refund_payment_days calendar days after the cancellation or termination is processed, in one payment for the full amount due.
    replaced_by: For a cancellation refund released to the lienholder under this policy, and only for such a release, the release is one payment of the amount this rule assembles; a refund released to the holder is outside this sentence, and every other computed refund is paid within refund_payment_days calendar days after the cancellation or termination is processed, in one payment for the full amount due.
  trigger: state_due
  subject:
  - gap_refund_paid
  computes: amount_paid
  target_tool: release_refund_lienholder_c4427cd3
  params:
    standard_late_rate: 0.05
    apr_ceiling_rate: 0.09
    mail_grace_days: 7
    premium_31_to_60_days: 0.01
    premium_over_60_days: 0.02
    courtesy_unprocessed_request: 25.0
    courtesy_late_release: 10.0
  rule: 'This policy prices the release of a cancellation refund to the lienholder while the waiver''s loan is still open (loan_payoff_date empty); every release to the holder is outside it. A refund computed on a waiver whose loan_payoff_date is empty is released to the lienholder; a refund computed on a waiver whose loan_payoff_date is on file, whether a termination refund or a cancellation refund, is released to the holder. A lienholder refund release is made only after the waiver stands cancelled with a refund calculation entry for that cancellation on its ledger. A lienholder refund release is not made until no other waiver of the same holder financed by the same lienholder has, as its most recent GAP balance line, a denial for the theft waiting period whose waiting period has run. The lienholder release pays the refund due, which is the amount of the refund calculation entry on the waiver''s ledger. The effective date of the cancellation is the waiver''s closing date, or the release date where the waiver carries none. The late window of a lienholder release starts on the effective date of the cancellation. Where the release is made more than refund_payment_days calendar days after the late window starts, late-release interest is added on the refund due at standard_late_rate a year for each calendar day past refund_payment_days after the window start, counted on a 365-day year and rounded half up to the cent. The lienholder release amount is the refund due plus the late-release interest, rounded half up to the cent. A lienholder release is not made for a refund due of 0.00. For a cancellation refund released to the lienholder under this policy, and only for such a release, the release is one payment of the amount this rule assembles; a refund released to the holder is outside this sentence, and every other computed refund is paid within refund_payment_days calendar days after the cancellation or termination is processed, in one payment for the full amount due. The signed request a lienholder release reads is the waiver''s completed cancellation request, and a contract APR is read as a yearly rate (the printed APR divided by 100). Late-rate ladder for a lienholder release: where the waiver''s purchase deal carries a contract APR above apr_ceiling_rate, the late-release interest runs at apr_ceiling_rate; where its contract APR is above standard_late_rate and no more than apr_ceiling_rate, the interest runs at that contract APR; where its contract APR is standard_late_rate or less, 0.00 included, or no contract APR is on the deal, the interest runs at standard_late_rate. Late-window ladder for a lienholder release: where the signed request states the reason deal_unwound and the waiver''s purchase deal stands unwound, the late window starts on that deal''s closed_date, the date it was unwound; where the signed request states the reason customer_request and was recorded more than mail_grace_days calendar days after the holder signed it, the late window starts on the signed request date; in every other case the late window starts on the effective date of the cancellation. Rate-premium ladder for a lienholder release: where the release is made more than 60 calendar days after the effective date, premium_over_60_days is added to the interest rate; where it is made 31 to 60 calendar days after the effective date, premium_31_to_60_days is added; where it is made within 30 calendar days, nothing is added. Courtesy-credit ladder for a lienholder release: where the signed request was recorded more than refund_payment_days calendar days before the release date, courtesy_unprocessed_request is added to the release; where it was recorded 15 to refund_payment_days calendar days before the release date, courtesy_late_release is added; where it was recorded within 14 calendar days of the release date, or no completed cancellation request is on file, no courtesy credit is added. The lienholder release is assembled in this order: the late-release
    interest is the refund due times the yearly interest rate, with any addition a ladder of this rule makes to that rate, times the days past refund_payment_days after the late window starts over 365, rounded half up to the cent; it is added to the refund due, every amount a ladder adds to the release follows, and the total is rounded half up to the cent.'
  prerequisite:
  - problem: gap_ext_holder_cancellation_refund
    kind: value_input
    gate: refund_due
    form: state
    policy_source: A lienholder refund release is made only after the waiver stands cancelled with a refund calculation entry for that cancellation on its ledger.
    condition: The waiver's status is cancelled, its closed_date holds the effective date, and its ledger carries a gap_refund_calculated entry for that cancellation.
    resolved_by: confirm_gap_cancellation_0d8763f7
    effect: The refund due read by the release changes from 0.00 (no refund calculation entry) to the cancellation refund booked when the holder confirms the cancellation, and the effective date the interest days count from becomes the cancellation's effective date.
  - problem: gap_ext_balance_benefit
    kind: state_gate
    gate: gap_ledger.event_type
    form: state
    policy_source: A lienholder refund release is not made until no other waiver of the same holder financed by the same lienholder has, as its most recent GAP balance line, a denial for the theft waiting period whose waiting period has run.
    condition: No other waiver of the holder whose lienholder_name equals this waiver's lienholder_name has, as its most recent gap_balance ledger line, a gap_claim_denied entry with denial_reason theft_waiting_period whose loss_date plus theft_waiting_days is on or before today.
    resolved_by: pay_gap_balance_0b87221e
    effect: Paying the GAP balance benefit on the other waiver books a paid GAP balance line that becomes its most recent GAP balance line, so no same-lienholder waiver is left with a run theft-waiting-period denial as its latest line and the release may be made.
  cross_category:
  - category: purchase
    as: branch
    reads:
    - contract_apr
    - status
    - closed_date
    note: The late-rate ladder reads the contract APR of the waiver's purchase deal; the late-window ladder reads whether that deal stands unwound and its closed_date.
  compute:
  - refund_due: SUM('gap_ledger', 'amount', event_type='gap_refund_calculated')
  - payee_lienholder: (F('loan_payoff_date') or '') == ''
  - effective_date: F('closed_date') or NOW
  - signed_date: LATEST('gap_cancellation_requests', 'request_date', date_field='request_date', request_status='completed') or effective_date
  - recorded_stamp: LATEST('gap_cancellation_requests', 'created_at', date_field='request_date', request_status='completed') or effective_date
  - request_reason: LATEST('gap_cancellation_requests', 'cancel_reason', date_field='request_date', request_status='completed')
  - deal_apr: float(CFIELD('purchase', 'contract_apr', purchase_deal_id=F('purchase_deal_id')) or 0) / 100.0
  - interest_rate: K('apr_ceiling_rate') if deal_apr > K('apr_ceiling_rate') else (deal_apr if deal_apr > K('standard_late_rate') else K('standard_late_rate'))
  - window_start: (CFIELD('purchase', 'closed_date', purchase_deal_id=F('purchase_deal_id')) or effective_date) if (request_reason == 'deal_unwound' and CFIELD('purchase', 'status', purchase_deal_id=F('purchase_deal_id')) == 'unwound') else (signed_date if (request_reason == 'customer_request' and DAYS(signed_date, recorded_stamp) > K('mail_grace_days')) else effective_date)
  - late_days: MX(0, DAYS(window_start, NOW) - P('refund_payment_days'))
  - rate_premium: K('premium_over_60_days') if DAYS(effective_date, NOW) > 60 else (K('premium_31_to_60_days') if DAYS(effective_date, NOW) > 30 else 0.0)
  - courtesy_credit: (K('courtesy_unprocessed_request') if DAYS(recorded_stamp, NOW) > P('refund_payment_days') else (K('courtesy_late_release') if DAYS(recorded_stamp, NOW) >= 15 else 0.0)) if COUNT('gap_cancellation_requests', request_status='completed') > 0 else 0.0
  - late_interest: RND(refund_due * (interest_rate + rate_premium) * late_days / 365.0 + 0.000000001, 2)
  - result: RND(refund_due + late_interest + courtesy_credit + 0.000000001, 2) if (refund_due > 0 and payee_lienholder) else 0.0
  compute_basis:
    refund_due: The lienholder release pays the refund due, which is the amount of the refund calculation entry on the waiver's ledger.
    effective_date: The effective date of the cancellation is the waiver's closing date, or the release date where the waiver carries none.
    signed_date: The signed request a lienholder release reads is the waiver's completed cancellation request, and a contract APR is read as a yearly rate (the printed APR divided by 100).
    recorded_stamp: The signed request a lienholder release reads is the waiver's completed cancellation request, and a contract APR is read as a yearly rate (the printed APR divided by 100).
    request_reason: 'Late-window ladder for a lienholder release: where the signed request states the reason deal_unwound and the waiver''s purchase deal stands unwound, the late window starts on that deal''s closed_date, the date it was unwound; where the signed request states the reason customer_request and was recorded more than mail_grace_days calendar days after the holder signed it, the late window starts on the signed request date; in every other case the late window starts on the effective date of the cancellation.'
    deal_apr: The signed request a lienholder release reads is the waiver's completed cancellation request, and a contract APR is read as a yearly rate (the printed APR divided by 100).
    interest_rate: 'Late-rate ladder for a lienholder release: where the waiver''s purchase deal carries a contract APR above apr_ceiling_rate, the late-release interest runs at apr_ceiling_rate; where its contract APR is above standard_late_rate and no more than apr_ceiling_rate, the interest runs at that contract APR; where its contract APR is standard_late_rate or less, 0.00 included, or no contract APR is on the deal, the interest runs at standard_late_rate.'
    window_start: 'Late-window ladder for a lienholder release: where the signed request states the reason deal_unwound and the waiver''s purchase deal stands unwound, the late window starts on that deal''s closed_date, the date it was unwound; where the signed request states the reason customer_request and was recorded more than mail_grace_days calendar days after the holder signed it, the late window starts on the signed request date; in every other case the late window starts on the effective date of the cancellation.'
    late_days: Where the release is made more than refund_payment_days calendar days after the late window starts, late-release interest is added on the refund due at standard_late_rate a year for each calendar day past refund_payment_days after the window start, counted on a 365-day year and rounded half up to the cent.
    rate_premium: 'Rate-premium ladder for a lienholder release: where the release is made more than 60 calendar days after the effective date, premium_over_60_days is added to the interest rate; where it is made 31 to 60 calendar days after the effective date, premium_31_to_60_days is added; where it is made within 30 calendar days, nothing is added.'
    courtesy_credit: 'Courtesy-credit ladder for a lienholder release: where the signed request was recorded more than refund_payment_days calendar days before the release date, courtesy_unprocessed_request is added to the release; where it was recorded 15 to refund_payment_days calendar days before the release date, courtesy_late_release is added; where it was recorded within 14 calendar days of the release date, or no completed cancellation request is on file, no courtesy credit is added.'
    late_interest: 'The lienholder release is assembled in this order: the late-release interest is the refund due times the yearly interest rate, with any addition a ladder of this rule makes to that rate, times the days past refund_payment_days after the late window starts over 365, rounded half up to the cent; it is added to the refund due, every amount a ladder adds to the release follows, and the total is rounded half up to the cent.'
    result: 'The lienholder release is assembled in this order: the late-release interest is the refund due times the yearly interest rate, with any addition a ladder of this rule makes to that rate, times the days past refund_payment_days after the late window starts over 365, rounded half up to the cent; it is added to the refund due, every amount a ladder adds to the release follows, and the total is rounded half up to the cent.'
    payee_lienholder: A refund computed on a waiver whose loan_payoff_date is empty is released to the lienholder; a refund computed on a waiver whose loan_payoff_date is on file, whether a termination refund or a cancellation refund, is released to the holder.
  factors:
  - id: release_rate_source
    effect: parameter
    decides: interest_rate
    bindings:
    - deal_apr
    - interest_rate
    ladder:
    - when: contract APR above apr_ceiling_rate
      value: K('apr_ceiling_rate')
    - when: contract APR above standard_late_rate and no more than apr_ceiling_rate
      value: the contract APR
    - when: contract APR of standard_late_rate or less (0.00 included) or none on the deal
      value: K('standard_late_rate')
    baseline:
      interest_rate: K('standard_late_rate')
    evidence:
