    - when: it took effect on or after the loss date and before the paid line was paid
      method: its refund less admin_error_absorb, never less than half of it
    - when: otherwise (effective on or after the payment date)
      method: its refund in full
    baseline:
      plan_counted: plan_refund
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: contract_restatement
    effect: method
    decides: contract_counted
    bindings:
    - contract_counted
    ladder:
    - when: the service contract's cancellation took effect before the loss date
      method: its refund is not counted
    - when: it took effect after the loss date
      method: its refund times days from the loss date to its expiration over days from its effective date to its expiration
    - when: otherwise (effective on the loss date)
      method: its refund as received
    baseline:
      contract_counted: contract_refund
    evidence:
    - cross_category
    - date
    cross_difficulty: vsc
  - id: stale_payoff_tier
    effect: parameter
    decides: stale_waiver
    bindings:
    - first_refund_paid
    - stale_waiver
    ladder:
    - when: the earlier of the add-ons' last lienholder refund payments falls before the paid line was paid
      value: K('stale_payoff_waiver')
    - when: that earlier date falls within claim_payment_days after the payment
      value: K('late_refund_waiver')
    - when: otherwise
      value: '0.00'
    baseline:
      stale_waiver: '0.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: maintenance
  - id: fee_addback_tier
    effect: parameter
    decides: fee_addback
    bindings:
    - plan_reason
    - contract_reason
    - fee_addback
    ladder:
    - when: both add-ons cancelled on or after the loss date for customer_request or vehicle_sold_or_traded (their completed requests) with both refunds paid to the lienholder
      value: the plan's and the contract's cancellation_fee_usd
    - when: exactly one add-on so cancelled with its refund paid to the lienholder
      value: that product's cancellation_fee_usd
    - when: otherwise
      value: '0.00'
    baseline:
      fee_addback: '0.0'
    evidence:
    - cross_category
    cross_difficulty: maintenance
  - id: prompt_pay_rate_tier
    effect: parameter
    decides: late_pay_credit
    bindings:
    - line_settlement_date
    - late_pay_rate
    - late_pay_credit
    ladder:
    - when: line paid more than twice claim_payment_days after the settlement date
      value: interest owed at K('late_pay_rate_high')
    - when: paid more than claim_payment_days but no more than twice that after the settlement date
      value: interest owed at K('late_pay_rate')
    - when: paid within claim_payment_days of the settlement date
      value: '0.00'
    baseline:
      late_pay_credit: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The paid line is the waiver's most recent paid GAP balance line, with its amount paid, its loss date, the date it was paid and the add-on refunds recorded on it. The add-on refunds received are the refunds of a Kessler Shield service contract and of a Kessler Care maintenance plan financed on the waiver's purchase deal that were paid to the lienholder, each taken at the amount paid. The uncredited add-on refund is the add-on refunds received less the add-on refunds recorded on the paid line, floored at 0.00. The overpayment is the uncredited add-on refund, never more than the benefits standing on the claim, the amounts on the claim's paid and denied lines (a denied line carries 0.00) less any benefit already reversed on it. The add-on overpayment reversal is the overpayment rounded half up to the cent. A waiver with no paid GAP balance line on file has no add-on overpayment reversal. Where the paid line paid no more than recovery_floor_usd, or the refunds of a Kessler Shield service contract or Kessler Care maintenance plan financed on the same deal and cancelled on or after the loss date, as paid to the lienholder, exceed the add-on refunds recorded on the paid line by no more than recovery_floor_usd, nothing is reversed.
    params:
    - recovery_floor_usd
  inputs:
    history:
    - table: gap_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: gap_benefit_paid
        benefit_line_type: gap_balance
    cross_category:
    - maintenance
    - vsc
- id: gap_ext_payoff_termination_refund
  base_policy_refs:
  - gap_evt_cancellation_refund
  overwrite:
  - base_policy: gap_evt_cancellation_refund
    superseded_clause: Where refund_on_payoff_automatic is true, a waiver whose contract the lienholder reports paid off or, where refinance_terminates_waiver is true, refinanced away is terminated with its loan_payoff_date as the effective date and its refund computed without any request.
    replaced_by: For a termination priced under this policy, and only for such a termination, the waiver is terminated and its refund computed without any request where refund_on_payoff_automatic is true, with the effective date the ladders of this rule select; a waiver that carries a submitted signed cancellation request is not terminated by this sentence and ends by the holder's cancellation.
  - base_policy: gap_evt_cancellation_refund
    superseded_clause: Otherwise the refund follows the waiver's refund_method, pro_rata_daily (cancel_method pro_rata) — retail_price times gap_msr_unused_term_share, rounded to the cent, less cancellation_fee_usd;
    replaced_by: For a termination priced under this policy, and only for such a termination, the termination refund is assembled in the order this rule states; a holder's cancellation is outside this sentence, and any other ending of a waiver that neither this rule nor the cancellation rule prices keeps the retail_price times gap_msr_unused_term_share, rounded half up to the cent, less cancellation_fee_usd.
  trigger: state_due
  subject:
  - gap_waiver_terminated
  - gap_refund_calculated
  computes: refund_amount
  target_tool: terminate_paid_off_waiver_88a68523
  params:
    trade_window_days: 30
    term_charge_three_years: 15.0
    term_charge_two_years: 30.0
    term_admin_new: 30.0
    term_admin_used: 45.0
    trade_credit_new: 50.0
    trade_credit_used: 25.0
    term_bundle_contract: 40.0
    term_bundle_plan: 20.0
  rule: 'This policy prices the termination refund booked when an active waiver whose loan the lienholder has reported paid off or refinanced away is terminated. An active waiver that carries a submitted signed cancellation request recorded for it ends by the holder''s cancellation, whether or not its lienholder has reported a loan payoff date; an active waiver with a loan_payoff_date on file and no submitted signed cancellation request ends by termination. The termination refund starts from the waiver''s retail_price. The effective date of the termination is the waiver''s loan_payoff_date. The termination refund is the retail_price times the unused termination share, which is calendar days from the loan_payoff_date to expiration_date over calendar days from sale_date to expiration_date, rounded half up to the cent, less cancellation_fee_usd, and no fee is deducted where cancellation_fee_waived_on_payoff is true. Where deal_unwind_flat_cancel is true, a waiver whose purchase deal has been unwound is refunded its full retail_price on termination, with cancel_method flat_deal_unwound; every other termination refund has cancel_method pro_rata. A termination refund below 0.00 is 0.00. A waiver with no loan_payoff_date on file, or one carrying a submitted signed cancellation request, is not terminated under this policy, and its termination refund is 0.00. For a termination priced under this policy, and only for such a termination, the waiver is terminated and its refund computed without any request where refund_on_payoff_automatic is true, with the effective date the ladders of this rule select; a waiver that carries a submitted signed cancellation request is not terminated by this sentence and ends by the holder''s cancellation. For a termination priced under this policy, and only for such a termination, the termination refund is assembled in the order this rule states; a holder''s cancellation is outside this sentence, and any other ending of a waiver that neither this rule nor the cancellation rule prices keeps the retail_price times gap_msr_unused_term_share, rounded half up to the cent, less cancellation_fee_usd. The termination''s months in force are whole calendar months from sale_date to the loan_payoff_date. In counting a terminated waiver''s months, a whole calendar month counts each time the start date''s day of the month is reached; an end date on an earlier day of the month does not complete the month, and there is no month-end adjustment. The holder''s replacement purchase is the holder''s most recently signed group purchase deal, the deal whose vehicle price was charged last (of two charged the same day, the one recorded first), where that deal stands in contracted status; its trade-in is its trade_in_allowance. Termination share ladder: where the contract term is 72 months or longer, the unused termination share is whole calendar months from the loan_payoff_date to expiration_date over the term months; where the contract term is 48 months or shorter, the unused termination share is the sum-of-the-digits share, unused whole months times unused whole months plus one over term months times term months plus one; in every other case the unused termination share is the calendar-day share. Backdating ladder for a termination: where the loan_payoff_date falls within free_look_days calendar days after the sale date, the termination is effective on the sale date and the backdating credit is the retail_price times calendar days from the sale date to the loan_payoff_date over calendar days from sale_date to expiration_date; where it does not and the holder''s replacement purchase carries a trade-in and was signed on or before the loan_payoff_date and no more than trade_window_days calendar days before it, the termination is effective on that purchase''s contract_date and the backdating credit is the retail_price times calendar days from that contract_date to the loan_payoff_date over calendar days from sale_date to expiration_date;
    in every other case the termination is effective on the loan_payoff_date and there is no backdating credit. Termination-charge ladder: where cancellation_fee_waived_on_payoff is false and the termination''s months in force are 36 or more, the termination charge is term_charge_three_years; where that switch is false and the months in force are 24 to 35, the termination charge is term_charge_two_years; in every other case the termination charge is cancellation_fee_usd, or nothing where cancellation_fee_waived_on_payoff is true. Termination administrator-portion ladder: where the waiver''s purchase deal is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, term_admin_new is withheld from the price; where it is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase, term_admin_used is withheld from the price; in every other case nothing is withheld from the price. Trade-in credit ladder for a termination: where the holder''s replacement purchase carries a trade-in and is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, trade_credit_new is added to the termination refund; where it carries a trade-in and is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase, trade_credit_used is added; in every other case no trade-in credit is added. Termination bundle-recapture ladder: where a Kessler Shield service contract sold on the waiver''s purchase deal is in active status, term_bundle_contract is recaptured from the termination refund; where no such contract is active and a Kessler Care maintenance plan sold on that deal is in active status, term_bundle_plan is recaptured; in every other case nothing is recaptured. The termination refund is assembled in this order: any reduction of the price that a ladder of this rule makes comes off the retail_price before the unused termination share is applied, the unused termination share is applied and that result rounded half up to the cent, any charge a ladder selects takes the place of cancellation_fee_usd, every other amount a ladder takes off or adds, each rounded half up to the cent, is applied next, and the result is floored at 0.00; an unwound deal''s full retail_price replaces all of this.'
  prerequisite: []
  cross_category:
  - category: purchase
    as: branch
    reads:
    - variant_name
    - status
    - contract_date
    - trade_in_allowance
    - vehicle_price charges
    note: The administrator-portion ladder reads the waiver's deal type; the backdating and trade-in ladders read the holder's most recently signed deal in contracted status.
  - category: vsc
    as: branch
    reads:
    - status
    note: The bundle-recapture ladder reads whether a service contract sold on the same deal is active.
  - category: maintenance
    as: branch
    reads:
    - status
    note: The bundle-recapture ladder reads whether a maintenance plan sold on the same deal is active.
  compute:
  - in_scope: (F('loan_payoff_date') or '') != '' and COUNT('gap_cancellation_requests', request_status='submitted') == 0
  - payoff_date: F('loan_payoff_date') or NOW
  - repl_id: XLATEST('purchase', 'purchase_transactions', 'purchase_deal_id', date_field='txn_date', event_type='purchase_charge_posted', charge_code='vehicle_price')
  - repl_contracted: CFIELD('purchase', 'status', purchase_deal_id=repl_id) == 'contracted'
  - repl_trade: float(CFIELD('purchase', 'trade_in_allowance', purchase_deal_id=repl_id) or 0) if repl_contracted else 0.0
  - term_days: DAYS(F('sale_date'), F('expiration_date'))
  - repl_signed: (CFIELD('purchase', 'contract_date', purchase_deal_id=repl_id) or '9999-12-31') if repl_contracted else '9999-12-31'
  - effective_date: F('sale_date') if DAYS(F('sale_date'), payoff_date) <= P('free_look_days') else (repl_signed if (repl_trade > 0 and repl_signed <= payoff_date and DAYS(repl_signed, payoff_date) <= K('trade_window_days')) else payoff_date)
  - backdate_credit: RND(F('retail_price') * DAYS(effective_date, payoff_date) / term_days + 0.000000001, 2)
  - months_in_force: MONTHS(F('sale_date'), payoff_date)
  - unused_days: MX(0, DAYS(payoff_date, F('expiration_date')))
  - unused_months: MX(0, MONTHS(payoff_date, F('expiration_date')))
  - term_months: F('loan_term_months')
  - term_share: (unused_months / term_months) if term_months >= 72 else ((unused_months * (unused_months + 1)) / (term_months * (term_months + 1)) if term_months <= 48 else unused_days / term_days)
  - term_charge: K('term_charge_three_years') if ((not P('cancellation_fee_waived_on_payoff')) and months_in_force >= 36) else (K('term_charge_two_years') if ((not P('cancellation_fee_waived_on_payoff')) and months_in_force >= 24) else (0.0 if P('cancellation_fee_waived_on_payoff') else P('cancellation_fee_usd')))
  - waiver_deal_type: CFIELD('purchase', 'variant_name', purchase_deal_id=F('purchase_deal_id'))
  - term_admin_portion: K('term_admin_new') if (waiver_deal_type == 'New Vehicle Retail Purchase' or waiver_deal_type == 'New Vehicle Factory Order Purchase') else (K('term_admin_used') if (waiver_deal_type == 'Used Vehicle Retail Purchase' or waiver_deal_type == 'Certified Pre-Owned Vehicle Purchase' or waiver_deal_type == 'Value Line Used Vehicle Purchase') else 0.0)
  - repl_type: CFIELD('purchase', 'variant_name', purchase_deal_id=repl_id) if repl_contracted else None
  - trade_credit: K('trade_credit_new') if (repl_trade > 0 and (repl_type == 'New Vehicle Retail Purchase' or repl_type == 'New Vehicle Factory Order Purchase')) else (K('trade_credit_used') if (repl_trade > 0 and (repl_type == 'Used Vehicle Retail Purchase' or repl_type == 'Certified Pre-Owned Vehicle Purchase' or repl_type == 'Value Line Used Vehicle Purchase')) else 0.0)
  - term_bundle: K('term_bundle_contract') if EXISTS('vsc', purchase_deal_id=F('purchase_deal_id'), status='active') else (K('term_bundle_plan') if EXISTS('maintenance', purchase_deal_id=F('purchase_deal_id'), status='active') else 0.0)
  - deal_unwound: P('deal_unwind_flat_cancel') and CFIELD('purchase', 'status', purchase_deal_id=F('purchase_deal_id')) == 'unwound'
  - shared_refund: RND((F('retail_price') - term_admin_portion) * term_share + 0.000000001, 2)
  - result: (RND(F('retail_price') + 0.000000001, 2) if deal_unwound else RND(MX(0.0, shared_refund - term_charge - term_bundle + backdate_credit + trade_credit) + 0.000000001, 2)) if in_scope else 0.0
  compute_basis:
    in_scope: A waiver with no loan_payoff_date on file, or one carrying a submitted signed cancellation request, is not terminated under this policy, and its termination refund is 0.00.
    payoff_date: The effective date of the termination is the waiver's loan_payoff_date.
    repl_id: The holder's replacement purchase is the holder's most recently signed group purchase deal, the deal whose vehicle price was charged last (of two charged the same day, the one recorded first), where that deal stands in contracted status; its trade-in is its trade_in_allowance.
    repl_contracted: The holder's replacement purchase is the holder's most recently signed group purchase deal, the deal whose vehicle price was charged last (of two charged the same day, the one recorded first), where that deal stands in contracted status; its trade-in is its trade_in_allowance.
    repl_trade: The holder's replacement purchase is the holder's most recently signed group purchase deal, the deal whose vehicle price was charged last (of two charged the same day, the one recorded first), where that deal stands in contracted status; its trade-in is its trade_in_allowance.
    term_days: The termination refund is the retail_price times the unused termination share, which is calendar days from the loan_payoff_date to expiration_date over calendar days from sale_date to expiration_date, rounded half up to the cent, less cancellation_fee_usd, and no fee is deducted where cancellation_fee_waived_on_payoff is true.
    repl_signed: 'Backdating ladder for a termination: where the loan_payoff_date falls within free_look_days calendar days after the sale date, the termination is effective on the sale date and the backdating credit is the retail_price times calendar days from the sale date to the loan_payoff_date over calendar days from sale_date to expiration_date; where it does not and the holder''s replacement purchase carries a trade-in and was signed on or before the loan_payoff_date and no more than trade_window_days calendar days before it, the termination is effective on that purchase''s contract_date and the backdating credit is the retail_price times calendar days from that contract_date to the loan_payoff_date over calendar days from sale_date to expiration_date; in every other case the termination is effective on the loan_payoff_date and there is no backdating credit.'
    effective_date: 'Backdating ladder for a termination: where the loan_payoff_date falls within free_look_days calendar days after the sale date, the termination is effective on the sale date and the backdating credit is the retail_price times calendar days from the sale date to the loan_payoff_date over calendar days from sale_date to expiration_date; where it does not and the holder''s replacement purchase carries a trade-in and was signed on or before the loan_payoff_date and no more than trade_window_days calendar days before it, the termination is effective on that purchase''s contract_date and the backdating credit is the retail_price times calendar days from that contract_date to the loan_payoff_date over calendar days from sale_date to expiration_date; in every other case the termination is effective on the loan_payoff_date and there is no backdating credit.'
    backdate_credit: 'Backdating ladder for a termination: where the loan_payoff_date falls within free_look_days calendar days after the sale date, the termination is effective on the sale date and the backdating credit is the retail_price times calendar days from the sale date to the loan_payoff_date over calendar days from sale_date to expiration_date; where it does not and the holder''s replacement purchase carries a trade-in and was signed on or before the loan_payoff_date and no more than trade_window_days calendar days before it, the termination is effective on that purchase''s contract_date and the backdating credit is the retail_price times calendar days from that contract_date to the loan_payoff_date over calendar days from sale_date to expiration_date; in every other case the termination is effective on the loan_payoff_date and there is no backdating credit.'
    months_in_force: The termination's months in force are whole calendar months from sale_date to the loan_payoff_date.
    unused_days: The termination refund is the retail_price times the unused termination share, which is calendar days from the loan_payoff_date to expiration_date over calendar days from sale_date to expiration_date, rounded half up to the cent, less cancellation_fee_usd, and no fee is deducted where cancellation_fee_waived_on_payoff is true.
    unused_months: 'Termination share ladder: where the contract term is 72 months or longer, the unused termination share is whole calendar months from the loan_payoff_date to expiration_date over the term months; where the contract term is 48 months or shorter, the unused termination share is the sum-of-the-digits share, unused whole months times unused whole months plus one over term months times term months plus one; in every other case the unused termination share is the calendar-day share.'
    term_months: 'Termination share ladder: where the contract term is 72 months or longer, the unused termination share is whole calendar months from the loan_payoff_date to expiration_date over the term months; where the contract term is 48 months or shorter, the unused termination share is the sum-of-the-digits share, unused whole months times unused whole months plus one over term months times term months plus one; in every other case the unused termination share is the calendar-day share.'
    term_share: 'Termination share ladder: where the contract term is 72 months or longer, the unused termination share is whole calendar months from the loan_payoff_date to expiration_date over the term months; where the contract term is 48 months or shorter, the unused termination share is the sum-of-the-digits share, unused whole months times unused whole months plus one over term months times term months plus one; in every other case the unused termination share is the calendar-day share.'
    term_charge: 'Termination-charge ladder: where cancellation_fee_waived_on_payoff is false and the termination''s months in force are 36 or more, the termination charge is term_charge_three_years; where that switch is false and the months in force are 24 to 35, the termination charge is term_charge_two_years; in every other case the termination charge is cancellation_fee_usd, or nothing where cancellation_fee_waived_on_payoff is true.'
    waiver_deal_type: 'Termination administrator-portion ladder: where the waiver''s purchase deal is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, term_admin_new is withheld from the price; where it is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase, term_admin_used is withheld from the price; in every other case nothing is withheld from the price.'
    term_admin_portion: 'Termination administrator-portion ladder: where the waiver''s purchase deal is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, term_admin_new is withheld from the price; where it is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase, term_admin_used is withheld from the price; in every other case nothing is withheld from the price.'
    repl_type: 'Trade-in credit ladder for a termination: where the holder''s replacement purchase carries a trade-in and is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, trade_credit_new is added to the termination refund; where it carries a trade-in and is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase, trade_credit_used is added; in every other case no trade-in credit is added.'
    trade_credit: 'Trade-in credit ladder for a termination: where the holder''s replacement purchase carries a trade-in and is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase, trade_credit_new is added to the termination refund; where it carries a trade-in and is a Used Vehicle Retail Purchase, a Certified Pre-Owned Vehicle Purchase or a Value Line Used Vehicle Purchase, trade_credit_used is added; in every other case no trade-in credit is added.'
    term_bundle: 'Termination bundle-recapture ladder: where a Kessler Shield service contract sold on the waiver''s purchase deal is in active status, term_bundle_contract is recaptured from the termination refund; where no such contract is active and a Kessler Care maintenance plan sold on that deal is in active status, term_bundle_plan is recaptured; in every other case nothing is recaptured.'
    deal_unwound: Where deal_unwind_flat_cancel is true, a waiver whose purchase deal has been unwound is refunded its full retail_price on termination, with cancel_method flat_deal_unwound; every other termination refund has cancel_method pro_rata.
    shared_refund: 'The termination refund is assembled in this order: any reduction of the price that a ladder of this rule makes comes off the retail_price before the unused termination share is applied, the unused termination share is applied and that result rounded half up to the cent, any charge a ladder selects takes the place of cancellation_fee_usd, every other amount a ladder takes off or adds, each rounded half up to the cent, is applied next, and the result is floored at 0.00; an unwound deal''s full retail_price replaces all of this.'
    result: 'The termination refund is assembled in this order: any reduction of the price that a ladder of this rule makes comes off the retail_price before the unused termination share is applied, the unused termination share is applied and that result rounded half up to the cent, any charge a ladder selects takes the place of cancellation_fee_usd, every other amount a ladder takes off or adds, each rounded half up to the cent, is applied next, and the result is floored at 0.00; an unwound deal''s full retail_price replaces all of this.'
  factors:
  - id: termination_share_rule
    effect: method
    decides: term_share
    bindings:
    - term_months
    - unused_months
    - term_share
    ladder:
    - when: contract term 72 months or longer
      method: whole calendar months from the loan_payoff_date to expiration_date over the term months
    - when: contract term 48 months or shorter
      method: sum-of-the-digits share of the unused whole months
    - when: otherwise
      method: calendar days from the loan_payoff_date to expiration_date over calendar days from sale_date to expiration_date
    baseline:
      term_share: unused_days / term_days
    evidence:
    - tier_param
    - date
    cross_difficulty: null
  - id: termination_backdating
    effect: method
    decides: backdate_credit
    bindings:
    - repl_signed
    - effective_date
    - backdate_credit
    ladder:
    - when: loan_payoff_date within free_look_days after the sale date
      method: effective on the sale date; credit = retail_price x days from the sale date to the payoff date over the term days
    - when: not in the free look; the replacement purchase carries a trade-in and was signed on or before the payoff date and no more than trade_window_days before it
      method: effective on that purchase's contract_date; credit = retail_price x days from that contract_date to the payoff date over the term days
    - when: otherwise
      method: effective on the loan_payoff_date; no credit
    baseline:
      effective_date: payoff_date
      backdate_credit: '0.0'
    evidence:
    - date
    - cross_category
    cross_difficulty: purchase
  - id: termination_charge_tier
    effect: parameter
    decides: term_charge
    bindings:
    - months_in_force
    - term_charge
    ladder:
    - when: fee switch false and 36 or more months in force
      value: K('term_charge_three_years')
    - when: fee switch false and 24 to 35 months in force
      value: K('term_charge_two_years')
    - when: otherwise
      value: P('cancellation_fee_usd'), or 0.00 where cancellation_fee_waived_on_payoff is true
    baseline:
      term_charge: 0.0 if P('cancellation_fee_waived_on_payoff') else P('cancellation_fee_usd')
    evidence:
    - tier_param
    - date
    cross_difficulty: null
  - id: termination_admin_tier
    effect: parameter
    decides: term_admin_portion
    bindings:
    - waiver_deal_type
    - term_admin_portion
    ladder:
    - when: the waiver deal is a new-vehicle purchase
      value: K('term_admin_new')
    - when: the waiver deal is a used, certified or value-line purchase
      value: K('term_admin_used')
    - when: otherwise
      value: '0.00'
    baseline:
      term_admin_portion: '0.0'
    evidence:
    - cross_category
    cross_difficulty: purchase
  - id: trade_in_credit_tier
    effect: parameter
    decides: trade_credit
    bindings:
    - repl_type
    - trade_credit
    ladder:
    - when: replacement purchase with a trade-in, new-vehicle deal
      value: K('trade_credit_new')
    - when: replacement purchase with a trade-in, used, certified or value-line deal
      value: K('trade_credit_used')
    - when: otherwise
      value: '0.00'
    baseline:
      trade_credit: '0.0'
    evidence:
    - cross_category
    cross_difficulty: purchase
  - id: termination_bundle_tier
    effect: parameter
    decides: term_bundle
    bindings:
    - term_bundle
    ladder:
    - when: a Kessler Shield contract sold on the waiver deal is active
      value: K('term_bundle_contract')
    - when: no such contract active, a Kessler Care plan sold on that deal active
      value: K('term_bundle_plan')
    - when: otherwise
      value: '0.00'
    baseline:
      term_bundle: '0.0'
    evidence:
    - cross_category
    cross_difficulty: vsc
  baseline:
    rule: The termination refund starts from the waiver's retail_price. The effective date of the termination is the waiver's loan_payoff_date. The termination refund is the retail_price times the unused termination share, which is calendar days from the loan_payoff_date to expiration_date over calendar days from sale_date to expiration_date, rounded half up to the cent, less cancellation_fee_usd, and no fee is deducted where cancellation_fee_waived_on_payoff is true. Where deal_unwind_flat_cancel is true, a waiver whose purchase deal has been unwound is refunded its full retail_price on termination, with cancel_method flat_deal_unwound; every other termination refund has cancel_method pro_rata. A termination refund below 0.00 is 0.00. A waiver with no loan_payoff_date on file, or one carrying a submitted signed cancellation request, is not terminated under this policy, and its termination refund is 0.00.
    params:
    - cancellation_fee_usd
    - cancellation_fee_waived_on_payoff
    - deal_unwind_flat_cancel
  inputs:
    history:
    - table: gap_cancellation_requests
      aggregate: count
      field: gap_cancel_request_id
      filters:
        request_status: submitted
    cross_category:
    - purchase
    - vsc
    - maintenance
- id: gap_ext_holder_refund_release
  base_policy_refs:
  - gap_evt_refund_payment
  overwrite:
  - base_policy: gap_evt_refund_payment
    superseded_clause: A computed refund is paid within refund_payment_days calendar days after the cancellation or termination is processed, in one payment for the full amount due.
    replaced_by: For a refund released to the holder under this policy, and only for such a release, the release is one payment of the amount this rule assembles; a cancellation refund released to the lienholder is outside this sentence, and every other computed refund is paid within refund_payment_days calendar days after the cancellation or termination is processed, in one payment for the full amount due.
  trigger: state_due
  subject:
  - gap_refund_paid
  computes: amount_paid
  target_tool: release_refund_holder_bc39910a
  params:
    holder_late_rate: 0.05
    holder_rate_ceiling: 0.09
    holder_premium_over_45: 0.02
    holder_premium_21_to_45: 0.01
    holder_courtesy_over_10: 20.0
    holder_courtesy_4_to_10: 10.0
    holder_goodwill_three_years: 15.0
    holder_goodwill_two_years: 8.0
  rule: 'This policy prices every release of a refund to the holder, a termination refund or a cancellation refund, once the lienholder has reported the waiver''s loan paid off (loan_payoff_date on file); releases to the lienholder are outside it. A refund computed on a waiver whose loan_payoff_date is empty is released to the lienholder; a refund computed on a waiver whose loan_payoff_date is on file, whether a termination refund or a cancellation refund, is released to the holder. A termination refund is not released to the holder until the waiver stands terminated with a refund calculation entry for that termination on its ledger. The holder release pays the refund due, which is the amount of the refund calculation entry on the waiver''s ledger. The effective date of the waiver''s ending, by termination or by cancellation, is the waiver''s closing date, or the release date where the waiver carries none. The late window of a holder release starts on the effective date of the waiver''s ending. Where the holder release is made more than refund_payment_days calendar days after the late window starts, holder late interest is added on the refund due at holder_late_rate a year for each calendar day past refund_payment_days after the window start, counted on a 365-day year and rounded half up to the cent. The holder release amount is the refund due plus the holder late interest, rounded half up to the cent. A holder release is not made for a refund due of 0.00. For a refund released to the holder under this policy, and only for such a release, the release is one payment of the amount this rule assembles; a cancellation refund released to the lienholder is outside this sentence, and every other computed refund is paid within refund_payment_days calendar days after the cancellation or termination is processed, in one payment for the full amount due. The holder''s tenure is whole calendar months from sale_date to the effective date of the waiver''s ending; a whole calendar month counts each time the sale date''s day of the month is reached, an end date on an earlier day of the month does not complete the month, and there is no month-end adjustment. A contract APR read by a holder release is a yearly rate, the printed APR divided by 100. Holder late-rate ladder: where the waiver''s purchase deal carries a contract APR above holder_rate_ceiling, the holder late interest runs at holder_rate_ceiling; where its contract APR is above holder_late_rate and no more than holder_rate_ceiling, it runs at that contract APR; where its contract APR is holder_late_rate or less, 0.00 included, or no contract APR is on the deal, it runs at holder_late_rate. Holder late-window ladder: where the waiver''s purchase deal stands unwound, the late window starts on that deal''s closed_date, the date it was unwound; where the deal is not unwound and the effective date of the waiver''s ending is earlier than the loan_payoff_date, the late window starts on the loan_payoff_date, the day the lienholder''s payoff report reached the waiver; in every other case the late window starts on the effective date of the waiver''s ending. Holder rate-premium ladder: where the holder release is made more than 45 calendar days after the effective date, holder_premium_over_45 is added to the interest rate; where it is made 21 to 45 calendar days after the effective date, holder_premium_21_to_45 is added; where it is made within 20 calendar days, nothing is added. Payoff courtesy ladder: where the loan_payoff_date is more than 10 calendar days before the release date, holder_courtesy_over_10 is added to the holder release; where it is 4 to 10 calendar days before, holder_courtesy_4_to_10 is added; in every other case no payoff courtesy credit is added. Tenure goodwill ladder: where the holder''s tenure is 36 months or more, holder_goodwill_three_years is added to the holder release; where it is 24 to 35 months, holder_goodwill_two_years is added; where it is under 24 months, no tenure
    goodwill credit is added. The holder release is assembled in this order: the holder late interest is the refund due times the yearly interest rate, with any addition a ladder of this rule makes to that rate, times the days past refund_payment_days after the late window starts over 365, rounded half up to the cent; it is added to the refund due, every amount a ladder adds to the release follows, and the total is rounded half up to the cent.'
  prerequisite:
  - problem: gap_ext_payoff_termination_refund
    kind: value_input
    gate: refund_due
    form: state
    policy_source: A termination refund is not released to the holder until the waiver stands terminated with a refund calculation entry for that termination on its ledger.
    condition: The waiver's status is terminated, its closed_date holds the termination's effective date, and its ledger carries a gap_refund_calculated entry for that termination.
    resolved_by: terminate_paid_off_waiver_88a68523
    effect: The refund due read by the holder release changes from 0.00 (no refund calculation entry) to the termination refund booked by the termination, and the effective date the late window and the rate premium count from becomes the termination's effective date instead of the release date.
  cross_category:
  - category: purchase
    as: branch
    reads:
    - contract_apr
    - status
    - closed_date
    note: The holder late-rate ladder reads the contract APR of the waiver's purchase deal; the late-window ladder reads whether that deal stands unwound.
  compute:
  - refund_due: SUM('gap_ledger', 'amount', event_type='gap_refund_calculated')
  - payee_holder: (F('loan_payoff_date') or '') != ''
  - effective_date: F('closed_date') or NOW
  - payoff_date: F('loan_payoff_date') or NOW
  - deal_apr: float(CFIELD('purchase', 'contract_apr', purchase_deal_id=F('purchase_deal_id')) or 0) / 100.0
  - holder_rate: K('holder_rate_ceiling') if deal_apr > K('holder_rate_ceiling') else (deal_apr if deal_apr > K('holder_late_rate') else K('holder_late_rate'))
  - window_start: (CFIELD('purchase', 'closed_date', purchase_deal_id=F('purchase_deal_id')) or effective_date) if CFIELD('purchase', 'status', purchase_deal_id=F('purchase_deal_id')) == 'unwound' else (payoff_date if effective_date < payoff_date else effective_date)
  - late_days: MX(0, DAYS(window_start, NOW) - P('refund_payment_days'))
  - holder_premium: K('holder_premium_over_45') if DAYS(effective_date, NOW) > 45 else (K('holder_premium_21_to_45') if DAYS(effective_date, NOW) >= 21 else 0.0)
  - payoff_courtesy: K('holder_courtesy_over_10') if DAYS(payoff_date, NOW) > 10 else (K('holder_courtesy_4_to_10') if DAYS(payoff_date, NOW) >= 4 else 0.0)
  - holder_tenure: MONTHS(F('sale_date'), effective_date)
  - tenure_goodwill: K('holder_goodwill_three_years') if holder_tenure >= 36 else (K('holder_goodwill_two_years') if holder_tenure >= 24 else 0.0)
  - holder_interest: RND(refund_due * (holder_rate + holder_premium) * late_days / 365.0 + 0.000000001, 2)
  - result: RND(refund_due + holder_interest + payoff_courtesy + tenure_goodwill + 0.000000001, 2) if (refund_due > 0 and payee_holder) else 0.0
  compute_basis:
    refund_due: The holder release pays the refund due, which is the amount of the refund calculation entry on the waiver's ledger.
    effective_date: The effective date of the waiver's ending, by termination or by cancellation, is the waiver's closing date, or the release date where the waiver carries none.
    payoff_date: 'Holder late-window ladder: where the waiver''s purchase deal stands unwound, the late window starts on that deal''s closed_date, the date it was unwound; where the deal is not unwound and the effective date of the waiver''s ending is earlier than the loan_payoff_date, the late window starts on the loan_payoff_date, the day the lienholder''s payoff report reached the waiver; in every other case the late window starts on the effective date of the waiver''s ending.'
    deal_apr: A contract APR read by a holder release is a yearly rate, the printed APR divided by 100.
    holder_rate: 'Holder late-rate ladder: where the waiver''s purchase deal carries a contract APR above holder_rate_ceiling, the holder late interest runs at holder_rate_ceiling; where its contract APR is above holder_late_rate and no more than holder_rate_ceiling, it runs at that contract APR; where its contract APR is holder_late_rate or less, 0.00 included, or no contract APR is on the deal, it runs at holder_late_rate.'
    window_start: 'Holder late-window ladder: where the waiver''s purchase deal stands unwound, the late window starts on that deal''s closed_date, the date it was unwound; where the deal is not unwound and the effective date of the waiver''s ending is earlier than the loan_payoff_date, the late window starts on the loan_payoff_date, the day the lienholder''s payoff report reached the waiver; in every other case the late window starts on the effective date of the waiver''s ending.'
    late_days: Where the holder release is made more than refund_payment_days calendar days after the late window starts, holder late interest is added on the refund due at holder_late_rate a year for each calendar day past refund_payment_days after the window start, counted on a 365-day year and rounded half up to the cent.
    holder_premium: 'Holder rate-premium ladder: where the holder release is made more than 45 calendar days after the effective date, holder_premium_over_45 is added to the interest rate; where it is made 21 to 45 calendar days after the effective date, holder_premium_21_to_45 is added; where it is made within 20 calendar days, nothing is added.'
    payoff_courtesy: 'Payoff courtesy ladder: where the loan_payoff_date is more than 10 calendar days before the release date, holder_courtesy_over_10 is added to the holder release; where it is 4 to 10 calendar days before, holder_courtesy_4_to_10 is added; in every other case no payoff courtesy credit is added.'
    holder_tenure: The holder's tenure is whole calendar months from sale_date to the effective date of the waiver's ending; a whole calendar month counts each time the sale date's day of the month is reached, an end date on an earlier day of the month does not complete the month, and there is no month-end adjustment.
    tenure_goodwill: 'Tenure goodwill ladder: where the holder''s tenure is 36 months or more, holder_goodwill_three_years is added to the holder release; where it is 24 to 35 months, holder_goodwill_two_years is added; where it is under 24 months, no tenure goodwill credit is added.'
    holder_interest: 'The holder release is assembled in this order: the holder late interest is the refund due times the yearly interest rate, with any addition a ladder of this rule makes to that rate, times the days past refund_payment_days after the late window starts over 365, rounded half up to the cent; it is added to the refund due, every amount a ladder adds to the release follows, and the total is rounded half up to the cent.'
    result: 'The holder release is assembled in this order: the holder late interest is the refund due times the yearly interest rate, with any addition a ladder of this rule makes to that rate, times the days past refund_payment_days after the late window starts over 365, rounded half up to the cent; it is added to the refund due, every amount a ladder adds to the release follows, and the total is rounded half up to the cent.'
    payee_holder: A refund computed on a waiver whose loan_payoff_date is empty is released to the lienholder; a refund computed on a waiver whose loan_payoff_date is on file, whether a termination refund or a cancellation refund, is released to the holder.
  factors:
  - id: holder_rate_source
    effect: parameter
    decides: holder_rate
    bindings:
    - deal_apr
    - holder_rate
    ladder:
    - when: contract APR above holder_rate_ceiling
      value: K('holder_rate_ceiling')
    - when: contract APR above holder_late_rate and no more than holder_rate_ceiling
      value: the contract APR
    - when: contract APR of holder_late_rate or less (0.00 included) or none on the deal
      value: K('holder_late_rate')
    baseline:
      holder_rate: K('holder_late_rate')
    evidence:
    - cross_category
    cross_difficulty: purchase
  - id: holder_late_window
    effect: method
    decides: window_start
    bindings:
    - window_start
    ladder:
    - when: the waiver's purchase deal stands unwound
      method: the late window starts on that deal's closed_date
    - when: the deal is not unwound and the effective date of the waiver's ending is earlier than the loan_payoff_date
      method: the late window starts on the loan_payoff_date
    - when: otherwise
      method: the late window starts on the effective date of the waiver's ending
    baseline:
      window_start: effective_date
    evidence:
    - date
    - cross_category
    cross_difficulty: purchase
  - id: holder_rate_premium
    effect: parameter
    decides: holder_premium
    bindings:
    - holder_premium
    ladder:
    - when: release more than 45 calendar days after the effective date
      value: K('holder_premium_over_45')
    - when: release 21 to 45 calendar days after the effective date
      value: K('holder_premium_21_to_45')
    - when: release within 20 calendar days
      value: '0.00'
    baseline:
      holder_premium: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: payoff_courtesy_tier
    effect: parameter
    decides: payoff_courtesy
    bindings:
    - payoff_courtesy
    ladder:
    - when: loan_payoff_date more than 10 calendar days before the release date
      value: K('holder_courtesy_over_10')
    - when: 4 to 10 calendar days before
      value: K('holder_courtesy_4_to_10')
    - when: otherwise
      value: '0.00'
    baseline:
      payoff_courtesy: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: tenure_goodwill_tier
    effect: parameter
    decides: tenure_goodwill
    bindings:
    - holder_tenure
    - tenure_goodwill
    ladder:
    - when: holder's tenure 36 months or more
      value: K('holder_goodwill_three_years')
    - when: 24 to 35 months
      value: K('holder_goodwill_two_years')
    - when: under 24 months
      value: '0.00'
    baseline:
      tenure_goodwill: '0.0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The holder release pays the refund due, which is the amount of the refund calculation entry on the waiver's ledger. The effective date of the waiver's ending, by termination or by cancellation, is the waiver's closing date, or the release date where the waiver carries none. The late window of a holder release starts on the effective date of the waiver's ending. Where the holder release is made more than refund_payment_days calendar days after the late window starts, holder late interest is added on the refund due at holder_late_rate a year for each calendar day past refund_payment_days after the window start, counted on a 365-day year and rounded half up to the cent. The holder release amount is the refund due plus the holder late interest, rounded half up to the cent. A holder release is not made for a refund due of 0.00.
    params:
    - holder_late_rate
    - refund_payment_days
  inputs:
    history:
    - table: gap_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: gap_refund_calculated
    cross_category:
    - purchase
- id: gap_ext_replacement_credit
  base_policy_refs:
  - gap_agg_vehicle_and_claims
  - gap_evt_benefit_calculation
  - gap_evt_claim_conditions
  - gap_evt_replacement_credit
  - gap_combo_addon_products
  overwrite:
  - base_policy: gap_evt_replacement_credit
    superseded_clause: Where replacement_vehicle_credit_usd is above 0.00, a holder whose GAP balance benefit has been paid receives that credit toward a replacement vehicle bought from a group store, as a gap_benefit_paid entry with benefit_line_type replacement_vehicle_credit under the same claim number.
    replaced_by: For a replacement vehicle credit applied under this policy, and only for such a credit, a holder whose GAP balance benefit has been paid receives the replacement vehicle credit assembled here as a gap_benefit_paid entry with benefit_line_type replacement_vehicle_credit under the same claim number, where replacement_vehicle_credit_usd is above 0.00; every other holder whose GAP balance benefit has been paid receives replacement_vehicle_credit_usd toward a replacement vehicle bought from a group store in the same way.
  trigger: on_request
  subject:
  - gap_benefit_paid
  computes: credit_amount
  target_tool: apply_replacement_allowance_cdefd282
  params:
    prompt_days: 30
    bonus_new_prompt: 500.0
    bonus_new_later: 250.0
    store_trade_bonus: 300.0
    store_bonus: 150.0
    reimburse_collision: 250.0
    reimburse_other: 150.0
    price_high_usd: 40000.0
    price_mid_usd: 25000.0
    price_bonus_high: 200.0
    price_bonus_mid: 100.0
  rule: 'This policy prices the replacement vehicle credit the holder applies to a replacement purchase that stands in contracted status at a group store (a signed buyer''s order awaiting delivery); a credit toward a replacement in any other status is replacement_vehicle_credit_usd. A replacement vehicle credit is fixed only after the claim''s paid GAP balance line carries a reversal entry wherever that line paid more than 60.00 and the refunds of a Kessler Shield service contract or Kessler Care maintenance plan financed on the same deal and cancelled on or after the loss date, as paid to the lienholder, exceed the add-on refunds recorded on that line by more than 60.00. A replacement vehicle credit is not applied until every other waiver of the holder whose loan was reported paid off on or after the replacement purchase''s contract date has left active status with no refund due on it. The paid line is the waiver''s most recent paid GAP balance line. A waiver whose replacement_vehicle_credit_usd is 0.00 receives no replacement vehicle credit. The replacement vehicle credit starts from replacement_vehicle_credit_usd. The overpayment set-off is the total of the benefit reversal entries on the waiver''s ledger. The credit already given is the total of the amounts on the waiver''s replacement vehicle credit lines, a denied line carrying 0.00. The replacement vehicle credit is the starting credit less the overpayment set-off and less the credit already given, rounded half up to the cent and floored at 0.00. A waiver with no paid GAP balance line on file receives no replacement vehicle credit. For a replacement vehicle credit applied under this policy, and only for such a credit, a holder whose GAP balance benefit has been paid receives the replacement vehicle credit assembled here as a gap_benefit_paid entry with benefit_line_type replacement_vehicle_credit under the same claim number, where replacement_vehicle_credit_usd is above 0.00; every other holder whose GAP balance benefit has been paid receives replacement_vehicle_credit_usd toward a replacement vehicle bought from a group store in the same way. The replacement purchase is the holder''s most recently signed group purchase deal, the deal whose vehicle price was charged last (of two charged the same day, the one recorded first), where that deal stands in contracted status; a credit is priced under this policy only toward such a purchase. The credit loss-age is whole calendar months from sale_date to the loss date of the paid line; a whole calendar month counts each time the sale date''s day of the month is reached, a loss date on an earlier day of the month does not complete the month, and there is no month-end adjustment. New-vehicle bonus ladder for a replacement credit: where the replacement purchase is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase signed within prompt_days calendar days after the date the paid line was paid, bonus_new_prompt is added; where it is such a new-vehicle purchase signed more than prompt_days calendar days after that date, bonus_new_later is added; in every other case no new-vehicle bonus is added. Credit-age ladder: where the credit loss-age is 36 months or more, the starting credit is replacement_vehicle_credit_usd times the unused waiver share at the loss, calendar days from the loss date to expiration_date over calendar days from sale_date to expiration_date; where the credit loss-age is 24 to 35 months, the starting credit is the lesser of replacement_vehicle_credit_usd and the waiver''s retail_price; where it is under 24 months, the starting credit is replacement_vehicle_credit_usd. Return-store bonus ladder: where the replacement purchase is at the store that sold the waiver''s purchase deal and carries a trade-in (trade_in_allowance above 0.00), store_trade_bonus is added; where it is at that store and carries no trade-in, store_bonus is added; in every other case no return-store bonus is added. Deductible reimbursement
    ladder: reading the loss type and the insurer''s deductible on the waiver''s most recent GAP balance claim line, paid or denied, where the loss is a total_loss_collision and that deductible is above deductible_covered_cap_usd, reimburse_collision is added; where the loss is of any other type and that deductible is above deductible_covered_cap_usd, reimburse_other is added; where the deductible is not above deductible_covered_cap_usd, no deductible reimbursement is added. Replacement-price bonus ladder: where the replacement purchase''s cash_price is price_high_usd or more, price_bonus_high is added; where it is price_mid_usd or more but below price_high_usd, price_bonus_mid is added; where it is below price_mid_usd, no replacement-price bonus is added. The replacement vehicle credit is assembled in this order: any starting credit a ladder of this rule substitutes replaces replacement_vehicle_credit_usd first, every amount a ladder adds is added next, the overpayment set-off and the credit already given are subtracted, and the result is rounded half up to the cent and floored at 0.00.'
  prerequisite:
  - problem: gap_ext_addon_overpayment_recovery
    kind: value_input
    gate: setoff
    form: state
    policy_source: A replacement vehicle credit is fixed only after the claim's paid GAP balance line carries a reversal entry wherever that line paid more than 60.00 and the refunds of a Kessler Shield service contract or Kessler Care maintenance plan financed on the same deal and cancelled on or after the loss date, as paid to the lienholder, exceed the add-on refunds recorded on that line by more than 60.00.
    condition: Where the paid GAP balance line's amount is above 60.00 and the lienholder's refunds of the deal's Kessler Shield contract and Kessler Care plan cancelled on or after the loss date exceed the line's addon_refunds_credited by more than 60.00, the line has a gap_benefit_reversed entry pointing at it.
    resolved_by: recover_benefit_overpayment_99b30941
    effect: The overpayment set-off read by the credit changes from 0.00 (no reversal entry on the ledger) to the add-on overpayment reversal booked on the claim's paid line.
  - problem: gap_ext_holder_refund_release
    kind: state_gate
    gate: gap_waivers.refund_due_balance
    form: state
    policy_source: A replacement vehicle credit is not applied until every other waiver of the holder whose loan was reported paid off on or after the replacement purchase's contract date has left active status with no refund due on it.
    condition: Every other waiver of the holder whose loan_payoff_date is on or after the replacement purchase's contract_date has a status other than active and refund_due_balance 0.00.
    resolved_by: release_refund_holder_bc39910a
    effect: Releasing the termination refund to the holder clears the paid-off waiver's refund due to 0.00 on a terminated waiver, so no such waiver stays active or owes a refund and the credit may be applied.
  cross_category:
  - category: purchase
    as: branch
    reads:
    - variant_name
    - contract_date
    - store_id
    - trade_in_allowance
    - cash_price
    - status
    note: The new-vehicle, return-store and replacement-price ladders read the holder's group purchase deal in contracted status and the store of the waiver's own purchase deal.
  compute:
  - line_on_file: COUNT('gap_ledger', event_type='gap_benefit_paid', benefit_line_type='gap_balance') > 0
  - line_paid_date: LATEST('gap_ledger', 'entry_date', date_field='entry_date', event_type='gap_benefit_paid', benefit_line_type='gap_balance') or NOW
  - line_loss_type: LATEST('gap_ledger', 'loss_type', date_field='entry_date', benefit_line_type='gap_balance')
  - line_loss_date: LATEST('gap_ledger', 'loss_date', date_field='entry_date', event_type='gap_benefit_paid', benefit_line_type='gap_balance') or F('sale_date')
  - line_deductible: float(LATEST('gap_ledger', 'insurance_deductible', date_field='entry_date', benefit_line_type='gap_balance') or 0)
  - setoff: SUM('gap_ledger', 'amount', event_type='gap_benefit_reversed')
  - repl_id: XLATEST('purchase', 'purchase_transactions', 'purchase_deal_id', date_field='txn_date', event_type='purchase_charge_posted', charge_code='vehicle_price')
  - credit_given: SUM('gap_ledger', 'amount', benefit_line_type='replacement_vehicle_credit')
  - repl_type: CFIELD('purchase', 'variant_name', purchase_deal_id=repl_id) if CFIELD('purchase', 'status', purchase_deal_id=repl_id) == 'contracted' else None
  - repl_signed: CFIELD('purchase', 'contract_date', purchase_deal_id=repl_id) or '9999-12-31'
  - credit_age: MONTHS(F('sale_date'), line_loss_date) if line_on_file else 0
  - starting_credit: P('replacement_vehicle_credit_usd') * DAYS(line_loss_date, F('expiration_date')) / DAYS(F('sale_date'), F('expiration_date')) if credit_age >= 36 else (MN(P('replacement_vehicle_credit_usd'), F('retail_price')) if credit_age >= 24 else P('replacement_vehicle_credit_usd'))
  - new_vehicle_bonus: K('bonus_new_prompt') if ((repl_type == 'New Vehicle Retail Purchase' or repl_type == 'New Vehicle Factory Order Purchase') and 0 <= DAYS(line_paid_date, repl_signed) <= K('prompt_days')) else (K('bonus_new_later') if ((repl_type == 'New Vehicle Retail Purchase' or repl_type == 'New Vehicle Factory Order Purchase') and DAYS(line_paid_date, repl_signed) > K('prompt_days')) else 0.0)
  - repl_store: CFIELD('purchase', 'store_id', purchase_deal_id=repl_id)
  - waiver_store: CFIELD('purchase', 'store_id', purchase_deal_id=F('purchase_deal_id'))
  - repl_trade: float(CFIELD('purchase', 'trade_in_allowance', purchase_deal_id=repl_id) or 0)
  - store_bonus: K('store_trade_bonus') if (repl_store == waiver_store and repl_trade > 0) else (K('store_bonus') if repl_store == waiver_store else 0.0)
  - deductible_reimbursement: K('reimburse_collision') if (line_loss_type == 'total_loss_collision' and line_deductible > P('deductible_covered_cap_usd')) else (K('reimburse_other') if line_deductible > P('deductible_covered_cap_usd') else 0.0)
  - repl_cash: float(CFIELD('purchase', 'cash_price', purchase_deal_id=repl_id) or 0)
  - price_bonus: K('price_bonus_high') if repl_cash >= K('price_high_usd') else (K('price_bonus_mid') if repl_cash >= K('price_mid_usd') else 0.0)
  - result: (RND(MX(0.0, starting_credit + new_vehicle_bonus + store_bonus + deductible_reimbursement + price_bonus - setoff - credit_given) + 0.000000001, 2) if repl_type else P('replacement_vehicle_credit_usd')) if (line_on_file and P('replacement_vehicle_credit_usd') > 0) else 0.0
  compute_basis:
    line_on_file: A waiver with no paid GAP balance line on file receives no replacement vehicle credit.
    line_paid_date: 'New-vehicle bonus ladder for a replacement credit: where the replacement purchase is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase signed within prompt_days calendar days after the date the paid line was paid, bonus_new_prompt is added; where it is such a new-vehicle purchase signed more than prompt_days calendar days after that date, bonus_new_later is added; in every other case no new-vehicle bonus is added.'
    line_loss_type: 'Deductible reimbursement ladder: reading the loss type and the insurer''s deductible on the waiver''s most recent GAP balance claim line, paid or denied, where the loss is a total_loss_collision and that deductible is above deductible_covered_cap_usd, reimburse_collision is added; where the loss is of any other type and that deductible is above deductible_covered_cap_usd, reimburse_other is added; where the deductible is not above deductible_covered_cap_usd, no deductible reimbursement is added.'
    line_loss_date: The credit loss-age is whole calendar months from sale_date to the loss date of the paid line; a whole calendar month counts each time the sale date's day of the month is reached, a loss date on an earlier day of the month does not complete the month, and there is no month-end adjustment.
    line_deductible: 'Deductible reimbursement ladder: reading the loss type and the insurer''s deductible on the waiver''s most recent GAP balance claim line, paid or denied, where the loss is a total_loss_collision and that deductible is above deductible_covered_cap_usd, reimburse_collision is added; where the loss is of any other type and that deductible is above deductible_covered_cap_usd, reimburse_other is added; where the deductible is not above deductible_covered_cap_usd, no deductible reimbursement is added.'
    setoff: The overpayment set-off is the total of the benefit reversal entries on the waiver's ledger.
    credit_given: The credit already given is the total of the amounts on the waiver's replacement vehicle credit lines, a denied line carrying 0.00.
    repl_type: The replacement purchase is the holder's most recently signed group purchase deal, the deal whose vehicle price was charged last (of two charged the same day, the one recorded first), where that deal stands in contracted status; a credit is priced under this policy only toward such a purchase.
    repl_signed: 'New-vehicle bonus ladder for a replacement credit: where the replacement purchase is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase signed within prompt_days calendar days after the date the paid line was paid, bonus_new_prompt is added; where it is such a new-vehicle purchase signed more than prompt_days calendar days after that date, bonus_new_later is added; in every other case no new-vehicle bonus is added.'
    credit_age: The credit loss-age is whole calendar months from sale_date to the loss date of the paid line; a whole calendar month counts each time the sale date's day of the month is reached, a loss date on an earlier day of the month does not complete the month, and there is no month-end adjustment.
    starting_credit: 'Credit-age ladder: where the credit loss-age is 36 months or more, the starting credit is replacement_vehicle_credit_usd times the unused waiver share at the loss, calendar days from the loss date to expiration_date over calendar days from sale_date to expiration_date; where the credit loss-age is 24 to 35 months, the starting credit is the lesser of replacement_vehicle_credit_usd and the waiver''s retail_price; where it is under 24 months, the starting credit is replacement_vehicle_credit_usd.'
    new_vehicle_bonus: 'New-vehicle bonus ladder for a replacement credit: where the replacement purchase is a New Vehicle Retail Purchase or a New Vehicle Factory Order Purchase signed within prompt_days calendar days after the date the paid line was paid, bonus_new_prompt is added; where it is such a new-vehicle purchase signed more than prompt_days calendar days after that date, bonus_new_later is added; in every other case no new-vehicle bonus is added.'
    repl_store: 'Return-store bonus ladder: where the replacement purchase is at the store that sold the waiver''s purchase deal and carries a trade-in (trade_in_allowance above 0.00), store_trade_bonus is added; where it is at that store and carries no trade-in, store_bonus is added; in every other case no return-store bonus is added.'
    waiver_store: 'Return-store bonus ladder: where the replacement purchase is at the store that sold the waiver''s purchase deal and carries a trade-in (trade_in_allowance above 0.00), store_trade_bonus is added; where it is at that store and carries no trade-in, store_bonus is added; in every other case no return-store bonus is added.'
    repl_trade: 'Return-store bonus ladder: where the replacement purchase is at the store that sold the waiver''s purchase deal and carries a trade-in (trade_in_allowance above 0.00), store_trade_bonus is added; where it is at that store and carries no trade-in, store_bonus is added; in every other case no return-store bonus is added.'
    store_bonus: 'Return-store bonus ladder: where the replacement purchase is at the store that sold the waiver''s purchase deal and carries a trade-in (trade_in_allowance above 0.00), store_trade_bonus is added; where it is at that store and carries no trade-in, store_bonus is added; in every other case no return-store bonus is added.'
    deductible_reimbursement: 'Deductible reimbursement ladder: reading the loss type and the insurer''s deductible on the waiver''s most recent GAP balance claim line, paid or denied, where the loss is a total_loss_collision and that deductible is above deductible_covered_cap_usd, reimburse_collision is added; where the loss is of any other type and that deductible is above deductible_covered_cap_usd, reimburse_other is added; where the deductible is not above deductible_covered_cap_usd, no deductible reimbursement is added.'
    repl_cash: 'Replacement-price bonus ladder: where the replacement purchase''s cash_price is price_high_usd or more, price_bonus_high is added; where it is price_mid_usd or more but below price_high_usd, price_bonus_mid is added; where it is below price_mid_usd, no replacement-price bonus is added.'
    price_bonus: 'Replacement-price bonus ladder: where the replacement purchase''s cash_price is price_high_usd or more, price_bonus_high is added; where it is price_mid_usd or more but below price_high_usd, price_bonus_mid is added; where it is below price_mid_usd, no replacement-price bonus is added.'
    result: 'The replacement vehicle credit is assembled in this order: any starting credit a ladder of this rule substitutes replaces replacement_vehicle_credit_usd first, every amount a ladder adds is added next, the overpayment set-off and the credit already given are subtracted, and the result is rounded half up to the cent and floored at 0.00.'
    repl_id: The replacement purchase is the holder's most recently signed group purchase deal, the deal whose vehicle price was charged last (of two charged the same day, the one recorded first), where that deal stands in contracted status; a credit is priced under this policy only toward such a purchase.
  factors:
  - id: new_vehicle_bonus_tier
    effect: parameter
    decides: new_vehicle_bonus
    bindings:
    - line_paid_date
    - repl_signed
    - new_vehicle_bonus
    ladder:
    - when: new-vehicle replacement purchase signed within prompt_days calendar days after the paid line date
      value: K('bonus_new_prompt')
    - when: new-vehicle replacement purchase signed more than prompt_days calendar days after that date
      value: K('bonus_new_later')
    - when: otherwise
      value: '0.00'
    baseline:
      new_vehicle_bonus: '0.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: purchase
  - id: credit_age_rule
    effect: method
    decides: starting_credit
    bindings:
    - line_loss_date
    - credit_age
    - starting_credit
    ladder:
    - when: credit loss-age 36 months or more
      method: replacement_vehicle_credit_usd times the unused waiver share at the loss (calendar days)
    - when: credit loss-age 24 to 35 months
      method: the lesser of replacement_vehicle_credit_usd and the waiver's retail_price
    - when: under 24 months
      method: replacement_vehicle_credit_usd
    baseline:
      starting_credit: P('replacement_vehicle_credit_usd')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: return_store_bonus_tier
    effect: parameter
    decides: store_bonus
    bindings:
    - repl_store
    - waiver_store
    - repl_trade
    - store_bonus
    ladder:
    - when: replacement purchase at the store that sold the waiver's deal and carrying a trade-in
      value: K('store_trade_bonus')
    - when: at that store with no trade-in
      value: K('store_bonus')
    - when: otherwise
      value: '0.00'
    baseline:
      store_bonus: '0.0'
    evidence:
    - cross_category
    cross_difficulty: purchase
  - id: deductible_reimbursement_tier
    effect: parameter
    decides: deductible_reimbursement
    bindings:
    - line_loss_type
    - line_deductible
    - deductible_reimbursement
    ladder:
    - when: total_loss_collision with the insurer deductible above deductible_covered_cap_usd
      value: K('reimburse_collision')
    - when: any other loss type with the deductible above deductible_covered_cap_usd
      value: K('reimburse_other')
    - when: deductible not above deductible_covered_cap_usd
      value: '0.00'
    baseline:
      deductible_reimbursement: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: replacement_price_tier
    effect: parameter
    decides: price_bonus
    bindings:
    - repl_cash
    - price_bonus
    ladder:
    - when: replacement cash_price price_high_usd or more
      value: K('price_bonus_high')
    - when: price_mid_usd or more but below price_high_usd
      value: K('price_bonus_mid')
    - when: below price_mid_usd
      value: '0.00'
    baseline:
      price_bonus: '0.0'
    evidence:
    - cross_category
    cross_difficulty: purchase
  baseline:
    rule: The paid line is the waiver's most recent paid GAP balance line. A waiver whose replacement_vehicle_credit_usd is 0.00 receives no replacement vehicle credit. The replacement vehicle credit starts from replacement_vehicle_credit_usd. The overpayment set-off is the total of the benefit reversal entries on the waiver's ledger. The credit already given is the total of the amounts on the waiver's replacement vehicle credit lines, a denied line carrying 0.00. The replacement vehicle credit is the starting credit less the overpayment set-off and less the credit already given, rounded half up to the cent and floored at 0.00. A waiver with no paid GAP balance line on file receives no replacement vehicle credit.
    params:
    - replacement_vehicle_credit_usd
  inputs:
    history:
    - table: gap_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: gap_benefit_reversed
    - table: gap_ledger
      aggregate: sum
      field: amount
      filters:
        benefit_line_type: replacement_vehicle_credit
    cross_category:
    - purchase
