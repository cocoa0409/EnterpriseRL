  overwrite:
  - base_policy: gap_evt_benefit_calculation
    superseded_clause: The insurer's deductible is covered up to deductible_covered_cap_usd; any deductible above that cap is subtracted.
    replaced_by: For a GAP balance line priced under this policy, and only for such a line, the insurer's deductible is covered up to the amount the ladders of this rule select, and any deductible above that amount is subtracted.
  - base_policy: gap_evt_benefit_calculation
    superseded_clause: Then the payoff items the waiver excludes are subtracted, each only where its switch is true — past-due payments (exclude_past_due_payments), late fees and charges (exclude_late_fees), deferred or extended payments (exclude_deferred_payments), refunds of cancelled financed products (exclude_addon_refunds), negative trade equity carried into the contract (exclude_negative_equity) and a salvage value deducted for an owner-retained vehicle (exclude_salvage_retention).
    replaced_by: For a GAP balance line priced under this policy, and only for such a line, the payoff items the waiver excludes are subtracted only where their switch is true, each as the ladders of this rule treat it, and in full where no ladder treats it.
  - base_policy: gap_evt_benefit_calculation
    superseded_clause: Financing above the loan-to-value cap then reduces the result according to the waiver's excess_ltv_method — under proportional_reduction the result is multiplied by gap_msr_ltv_factor, under exclude_excess_amount gap_msr_excess_financed is subtracted.
    replaced_by: For a GAP balance line priced under this policy, and only for such a line, the loan-to-value cap amount is ltv_cap_pct times the value basis the ladders of this rule select, rounded half up to the cent, and financing above it reduces the result by the reduction method those ladders select.
  - base_policy: gap_combo_addon_products
    superseded_clause: the amount subtracted is the refund each product's own charter computes with the loss date as the effective cancellation date, whether or not the cancellation has yet been processed
    replaced_by: For a GAP balance line priced under this policy, and only for such a line, the refunds of cancelled financed products subtracted are the add-on refunds recorded on the claim line, the refunds credited or due to the payoff as the lienholder's payoff letter shows them when the claim is figured; every other GAP benefit subtracts the refund each product's own charter computes with the loss date as the effective cancellation date, whether or not the cancellation has yet been processed.
  - base_policy: gap_combo_addon_products
    superseded_clause: Negative equity carried into the deal is read from the purchase deal (trade_payoff_amount less trade_in_allowance) and is subtracted only where exclude_negative_equity is true.
    replaced_by: For a GAP balance line priced under this policy, and only for such a line, negative equity carried into the deal is the negative trade equity recorded on the claim line, which the claim file takes from the purchase deal, and is subtracted only where exclude_negative_equity is true; every other GAP benefit reads negative equity from the purchase deal (trade_payoff_amount less trade_in_allowance).
