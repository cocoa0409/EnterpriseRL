      action_bindings:
        gap_waivers.gap_waiver_id: gap_waiver_id
    state_contract:
      field: gap_waivers.status
      allowed:
      - active
      - claim_settled
  - id: notice_in_time
    applies_to:
    - gap_benefit_paid
    kind: time
    condition: A claim is accepted only when it is reported within claim_notice_days calendar days after the primary insurer's settlement date.
    evidence_fields:
    - gap_ledger.settlement_date
    - gap_ledger.claim_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - gap_ledger.claim_number
      action_bindings:
        gap_ledger.claim_number: claim_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the primary insurer's settlement date
      anchor_source: gap_ledger.settlement_date
      relation: not_after
      duration_source: variants.claim_notice_days
      unit: calendar_days
      counting_rule: Calendar days are added to the settlement date (day 0); a report on the last day is in time.
      boundary: inclusive
- id: gap_evt_replacement_credit
  subject:
  - gap_benefit_paid
  rule: Where replacement_vehicle_credit_usd is above 0.00, a holder whose GAP balance benefit has been paid receives that credit toward a replacement vehicle bought from a group store, as a gap_benefit_paid entry with benefit_line_type replacement_vehicle_credit under the same claim number. The replacement vehicle credit is given only when the replacement vehicle's buyer's order is signed within replacement_credit_window_days calendar days after the GAP balance benefit was paid. The credit is paid to the store that sells the replacement vehicle on the holder's behalf and is honored at the stores replacement_credit_store_scope names and is never paid in cash; it is given at most once per claim. Calendar days are added to the entry_date of the paid gap_balance line (day 0), and the replacement deal's contract_date must fall on or before the last day.
