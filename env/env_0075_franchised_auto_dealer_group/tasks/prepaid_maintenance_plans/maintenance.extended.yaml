events:
- type: maintenance_plan_sold
  target: maintenance_plans
  mutation: create
  meaning: A prepaid maintenance plan is sold on a vehicle, alone or on the vehicle's purchase deal.
  grain: One row per plan contract.
  fields:
    customer_id: plan holder
    vehicle_id: covered vehicle
    selling_store_id: selling store
    purchase_deal_id: deal sold with (empty if standalone)
    variant_name: plan
    plan_number: contract number
    sale_date: sale date
    expiration_date: sale date plus term months
    odometer_at_sale: odometer at sale
    expiration_odometer: odometer at sale plus term miles
    purchase_price: price paid after discounts
    financed_on_contract: whether financed on the deal
    lienholder_name: financing lender
  triggers:
  - event: maintenance:maintenance_visits_loaded
    map: {entry_date: sale_date}
- type: maintenance_vehicle_substituted
  target: maintenance_plans
  mutation: update
  meaning: A fleet plan is moved from a retired fleet unit to its replacement vehicle.
  grain: One update per substitution.
  fields: {vehicle_id: replacement vehicle}
  triggers: []
- type: maintenance_plan_fulfilled
  target: maintenance_plans
  mutation:
    transition: {from: active, to: fulfilled}
  meaning: The last included visit has been redeemed.
  grain: One transition per plan.
  fields: {closed_date: date of the last redemption}
  triggers: []
- type: maintenance_plan_expired
  target: maintenance_plans
  mutation:
    transition: {from: active, to: expired}
  meaning: The plan term ends by date or mileage with visits unused.
  grain: One transition per plan.
  fields: {closed_date: date the term ended}
  triggers:
  - event: maintenance:maintenance_visits_expired
    map: {entry_date: closed_date}
- type: maintenance_plan_cancelled
  target: maintenance_plans
  mutation:
    transition: {from: active, to: cancelled}
  meaning: The plan is cancelled on the holder's signed request.
  grain: One transition per plan.
  fields: {closed_date: effective date of the cancellation (the request date)}
  triggers:
  - event: maintenance:maintenance_visits_cancelled
    map: {entry_date: closed_date}
  - event: maintenance:maintenance_refund_calculated
    map: {entry_date: closed_date}
- type: maintenance_visits_loaded
  target: maintenance_plan_ledger
  meaning: The plan's included visits are loaded at sale.
  grain: One entry per plan sale.
  distinguish_by: [entry_date]
  fields: {entry_date: sale date, visits: visits included, cancel_reason: not_applicable, refund_payee: not_applicable}
  account: plan_visits
  direction: in
  triggers: []
- type: maintenance_visit_redeemed
  target: maintenance_plan_ledger
  meaning: One plan visit is used on a repair order.
  grain: One entry per visit used.
  distinguish_by: [visit_number, repair_order_number]
  fields: {entry_date: visit date, visits: 1, visit_number: sequence number of the visit, repair_order_number: RO of the visit, store_id: store, odometer: odometer at the visit, cancel_reason: not_applicable, refund_payee: not_applicable}
  account: plan_visits
  direction: out
  triggers: []
- type: maintenance_visit_reinstated
  target: maintenance_plan_ledger
  meaning: A redemption recorded in error (service not performed, or paid by another coverage) is reversed and the visit returned.
  grain: One entry per redemption reversed.
  distinguish_by: [source_entry_id]
  fields: {entry_date: reinstatement date, visits: 1, source_entry_id: the redemption reversed, cancel_reason: not_applicable, refund_payee: not_applicable}
  account: plan_visits
  direction: in
  triggers: []
- type: maintenance_visits_expired
  target: maintenance_plan_ledger
  meaning: Visits unused when the term ends are removed.
  grain: One entry per plan expiration.
  distinguish_by: [entry_date]
  fields: {entry_date: date the term ended, visits: visits remaining at expiry, cancel_reason: not_applicable, refund_payee: not_applicable}
  account: plan_visits
  direction: out
  triggers: []
- type: maintenance_visits_cancelled
  target: maintenance_plan_ledger
  meaning: Visits unused at cancellation are removed.
  grain: One entry per plan cancellation.
  distinguish_by: [entry_date]
  fields: {entry_date: effective cancellation date, visits: visits remaining at cancellation, cancel_reason: reason on the request, refund_payee: not_applicable}
  account: plan_visits
  direction: out
  triggers: []
- type: maintenance_refund_calculated
  target: maintenance_plan_ledger
  meaning: The cancellation refund owed on a cancelled plan is computed and recorded as due.
  grain: One entry per plan cancellation.
  distinguish_by: [entry_date]
  fields: {entry_date: effective cancellation date, amount: refund due, odometer: odometer certified on the request, cancel_reason: reason on the request, refund_payee: not_applicable}
  account: cancellation_refund_due
  direction: in
  triggers: []
- type: maintenance_refund_paid
  target: maintenance_plan_ledger
  meaning: The cancellation refund is paid to the holder or to the lienholder.
  grain: One entry per refund payment.
  distinguish_by: [refund_payee, source_entry_id]
  fields: {entry_date: payment date, amount: amount paid, source_entry_id: the refund calculation paid, refund_payee: who was paid, cancel_reason: reason on the cancellation}
  account: cancellation_refund_due
  direction: out
  triggers: []
measures:
- id: maintenance_msr_visits_used
  window: Life of the plan up to the frozen handling date.
  measure: Count of the plan's maintenance_visit_redeemed entries less the count of its maintenance_visit_reinstated entries.
- id: maintenance_msr_last_visit
  window: Life of the plan up to the frozen handling date.
  measure: The entry_date and odometer of the plan's latest maintenance_visit_redeemed entry that has not been reinstated; the sale date and odometer_at_sale when there is none.
- id: maintenance_msr_active_fleet_plans
  window: Point in time at the frozen handling date.
  measure: Count of the customer's maintenance_plans of variant Kessler Care Fleet 12-Visit in active status, plus the plan being sold.
policies:
- id: maintenance_agg_multi_holding
  subject: [maintenance_plan_sold]
  rule: A customer may hold any number of maintenance plans, one per vehicle; each plan's visits belong to its own vehicle and are never pooled or moved between a customer's plans, except a fleet substitution under maintenance_evt_fleet_substitution.
  eligibility: []
  params: {max_per_customer: null}
- id: maintenance_agg_fleet_volume
  subject: [maintenance_plan_sold]
  rule: Fleet plans are priced on the customer's fleet volume. When the customer's active Kessler Care Fleet 12-Visit plans, counted by maintenance_msr_active_fleet_plans including the plan being sold, reach fleet_volume_min_plans, the new plan is sold at plan_price_usd less fleet_volume_discount_pct, rounded to the cent. Plans sold before the threshold was reached are not repriced. Tiers whose fleet_volume_min_plans is 0 carry no fleet volume discount, and the fleet volume discount is not combined with the bundle discount (fleet plans carry no bundle discount).
  eligibility: []
  formula:
    when_not: maintenance_msr_active_fleet_plans < fleet_volume_min_plans or fleet_volume_min_plans == 0
    fleet_price: round(plan_price_usd * (1 - fleet_volume_discount_pct), 2)
  measures: [maintenance_msr_active_fleet_plans]
- id: maintenance_evt_sale
  subject: [maintenance_plan_sold, maintenance_visits_loaded]
  rule: A plan is sold only on a vehicle whose vehicle_condition is in the plan's eligible_vehicle_conditions, whose age at sale (sale year minus model year) does not exceed max_vehicle_age_years, and whose odometer at sale does not exceed max_odometer_at_sale; diesel-engine vehicles only where diesel_eligible is true. A vehicle carries at most max_plans_per_vehicle active plan. A vehicle that already has an active maintenance plan cannot be sold another. A plan sold on the vehicle's purchase deal is priced at plan_price_usd less bundled_with_purchase_discount_pct, rounded to the cent; a plan bought on its own is priced at plan_price_usd and is offered only where standalone_sale_allowed is true. The term ends at expiration_date (sale date plus term_months calendar months; a month without that day ends on its last day) or at expiration_odometer (odometer at sale plus term_miles), whichever comes first. On sale, visits_included visits are loaded to the plan.
  eligibility:
  - id: one_plan_per_vehicle
    applies_to: [maintenance_plan_sold]
    kind: dedup
    condition: A vehicle that already has an active maintenance plan cannot be sold another.
    evidence_fields: [maintenance_plans.vehicle_id, maintenance_plans.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plans.vehicle_id]
      action_bindings: {maintenance_plans.vehicle_id: vehicle_id}
    dedup_contract:
      table: maintenance_plans
      mode: separate_record
      object_bindings: {vehicle_id: vehicle_id}
      duplicate_filters: {status: [active]}
      distinct_fields: [maintenance_plan_id]
  formula:
    bundled_price: round(plan_price_usd * (1 - bundled_with_purchase_discount_pct), 2)
- id: maintenance_evt_visit_redemption
  subject: [maintenance_visit_redeemed, maintenance_plan_fulfilled]
  rule: A plan visit is redeemed only on a plan in active status. A visit is redeemed only while the plan term is running or within the expiration grace. The term is running while the visit date is on or before expiration_date and the visit odometer is at or below expiration_odometer; a visit booked before expiration is still honored within expiration_grace_days calendar days after expiration_date and within expiration_grace_miles beyond expiration_odometer. A visit is accepted once the vehicle has been driven at least service_interval_miles minus interval_tolerance_miles since the last visit (maintenance_msr_last_visit) or at least min_days_between_visits calendar days have passed since it; otherwise the service is customer pay. Visits are honored at the selling store only or at every group store as honoring_store_scope states. Each redemption uses one visit with the next visit_number and includes the services the plan lists for that visit number — an oil and filter change with oil_quarts_included quarts of the plan's oil_type, a tire rotation where tire_rotation_included, a multi-point inspection where multipoint_inspection_included, a battery test where battery_test_included, fluid top-off where fluid_topoff_included, tire balancing where tire_balance_included and a wash where car_wash_included; a cabin air filter at the visit numbers in cabin_filter_included_visits, an engine air filter at those in engine_air_filter_included_visits and wiper blades at those in wiper_blades_included_visits; one brake fluid exchange during the term where brake_fluid_service_included, one coolant exchange where coolant_service_included and one alignment check per plan year where alignment_check_included; oil beyond oil_quarts_included is billed on customer pay at extra_quart_charge_usd per quart, and a conventional plan on a vehicle that requires full synthetic oil pays synthetic_upgrade_surcharge_usd on customer pay. When the last visit is redeemed the plan becomes fulfilled. Calendar days are added to the expiration date; the visit date may fall on the last grace day, and mileage is checked separately against expiration_odometer plus expiration_grace_miles.
  eligibility:
  - id: active_plan
    applies_to: [maintenance_visit_redeemed]
    kind: state
    condition: A plan visit is redeemed only on a plan in active status.
    evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plans.maintenance_plan_id]
      action_bindings: {maintenance_plans.maintenance_plan_id: maintenance_plan_id}
    state_contract: {field: maintenance_plans.status, allowed: [active]}
  - id: within_term_or_grace
    applies_to: [maintenance_visit_redeemed]
    kind: time
    condition: A visit is redeemed only while the plan term is running or within the expiration grace.
    evidence_fields: [maintenance_plans.expiration_date, maintenance_plans.expiration_odometer, maintenance_plans.maintenance_plan_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plans.maintenance_plan_id]
      action_bindings: {maintenance_plans.maintenance_plan_id: maintenance_plan_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the plan term
      anchor_source: maintenance_plans.expiration_date
      relation: not_after
      duration_source: variants.expiration_grace_days
      unit: calendar_days
      counting_rule: Calendar days are added to the expiration date; the visit date may fall on the last grace day, and mileage is checked separately against expiration_odometer plus expiration_grace_miles.
      boundary: inclusive
  measures: [maintenance_msr_last_visit, maintenance_msr_visits_used]
- id: maintenance_evt_visit_reinstatement
  subject: [maintenance_visit_reinstated]
  rule: A redemption recorded in error — the service was not performed, or the work was paid by a recall, warranty or factory complimentary maintenance coverage — is reversed and its visit returned. A redemption is reinstated only within visit_reinstatement_window_days calendar days after its entry date. A redemption is reinstated at most once. A reinstatement on a plan that has since expired or been cancelled is not made; the visit is instead counted in the cancellation or expiry as unused. Calendar days are added to the redemption's entry_date (day 0); reinstatement is possible through the last day.
  eligibility:
  - id: reinstatement_window
    applies_to: [maintenance_visit_reinstated]
    kind: time
    condition: A redemption is reinstated only within visit_reinstatement_window_days calendar days after its entry date.
    evidence_fields: [maintenance_plan_ledger.entry_date, maintenance_plan_ledger.source_entry_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plan_ledger.source_entry_id]
      action_bindings: {maintenance_plan_ledger.source_entry_id: source_entry_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: its entry date
      anchor_source: maintenance_plan_ledger.entry_date
      relation: not_after
      duration_source: variants.visit_reinstatement_window_days
      unit: calendar_days
      counting_rule: Calendar days are added to the redemption's entry_date (day 0); reinstatement is possible through the last day.
      boundary: inclusive
  - id: one_reinstatement
    applies_to: [maintenance_visit_reinstated]
    kind: dedup
    condition: A redemption is reinstated at most once.
    evidence_fields: [maintenance_plan_ledger.source_entry_id, maintenance_plan_ledger.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plan_ledger.source_entry_id]
      action_bindings: {maintenance_plan_ledger.source_entry_id: source_entry_id}
    dedup_contract:
      table: maintenance_plan_ledger
      mode: separate_record
      object_bindings: {source_entry_id: source_entry_id}
      duplicate_filters: {event_type: [maintenance_visit_reinstated]}
      distinct_fields: [entry_date]
- id: maintenance_evt_expiration
  subject: [maintenance_plan_expired, maintenance_visits_expired]
  rule: A plan expires when its term ends — at the end of expiration_date, or at the first visit or check-in whose odometer is above expiration_odometer plus expiration_grace_miles, whichever happens first — while visits remain. A plan is expired only from active status. Visits unused at expiry are removed by one maintenance_visits_expired entry; because expired_visit_refund is false for every plan, unused visits at expiry are never refunded or extended. A plan whose last visit has been redeemed is fulfilled, not expired.
  eligibility:
  - id: active_to_expire
    applies_to: [maintenance_plan_expired]
    kind: state
    condition: A plan is expired only from active status.
    evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plans.maintenance_plan_id]
      action_bindings: {maintenance_plans.maintenance_plan_id: maintenance_plan_id}
    state_contract: {field: maintenance_plans.status, allowed: [active]}
- id: maintenance_evt_cancellation_refund
  subject: [maintenance_plan_cancelled, maintenance_visits_cancelled, maintenance_refund_calculated]
  rule: The plan holder may cancel an active plan at any time by a signed cancellation request stating the reason and certifying the odometer; the cancellation is effective on the request date. A plan is cancelled only from active status. A plan is cancelled only on the holder's signed cancellation request recorded for the plan. The refund is computed as of the effective date. Free look — a plan cancelled within free_look_days calendar days after its sale date with no visit used (maintenance_msr_visits_used is 0) is refunded its full purchase_price. Unwound deal — where deal_unwind_full_refund is true, a plan sold on a purchase deal that has been unwound is refunded its full purchase_price whatever visits were used. Otherwise the refund follows the plan's refund_method; under retail_value_deduction it is purchase_price less retail_value_per_visit_usd for each visit used, less cancellation_fee_usd; under pro_rata_unused_visits it is purchase_price times visits remaining divided by visits_included, rounded to the cent, less cancellation_fee_usd. Where cancel_fee_waived_on_total_loss is true no cancellation fee is deducted when the reason is total_loss. A computed refund below 0.00 is 0.00 and, since cancel_shortfall_billed is false, nothing is billed to the holder. Free look and unwound-deal refunds take precedence over the refund method; they are never combined with it.
  eligibility:
  - id: active_to_cancel
    applies_to: [maintenance_plan_cancelled]
    kind: state
    condition: A plan is cancelled only from active status.
    evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plans.maintenance_plan_id]
      action_bindings: {maintenance_plans.maintenance_plan_id: maintenance_plan_id}
    state_contract: {field: maintenance_plans.status, allowed: [active]}
  - id: signed_request
    applies_to: [maintenance_plan_cancelled]
    kind: authorization
    condition: A plan is cancelled only on the holder's signed cancellation request recorded for the plan.
    evidence_fields: [maintenance_cancellation_requests.maintenance_plan_id, maintenance_cancellation_requests.cancel_reason, maintenance_cancellation_requests.request_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_cancellation_requests.maintenance_plan_id]
      action_bindings: {maintenance_cancellation_requests.maintenance_plan_id: maintenance_plan_id}
  params:
    per_tier:
      Kessler Care Essentials 2-Visit: {refund_method: =refund_method, retail_value_per_visit_usd: =retail_value_per_visit_usd, cancellation_fee_usd: =cancellation_fee_usd, free_look_days: =free_look_days}
      Kessler Care Essentials 4-Visit: {refund_method: =refund_method, retail_value_per_visit_usd: =retail_value_per_visit_usd, cancellation_fee_usd: =cancellation_fee_usd, free_look_days: =free_look_days}
      Kessler Care Plus 6-Visit: {refund_method: =refund_method, retail_value_per_visit_usd: =retail_value_per_visit_usd, cancellation_fee_usd: =cancellation_fee_usd, free_look_days: =free_look_days}
      Kessler Care Plus 8-Visit: {refund_method: =refund_method, retail_value_per_visit_usd: =retail_value_per_visit_usd, cancellation_fee_usd: =cancellation_fee_usd, free_look_days: =free_look_days}
      Kessler Care Premium 10-Visit: {refund_method: =refund_method, retail_value_per_visit_usd: =retail_value_per_visit_usd, cancellation_fee_usd: =cancellation_fee_usd, free_look_days: =free_look_days}
      Kessler Care Fleet 12-Visit: {refund_method: =refund_method, retail_value_per_visit_usd: =retail_value_per_visit_usd, cancellation_fee_usd: =cancellation_fee_usd, free_look_days: =free_look_days}
  formula:
    refund_retail_value: max(0, purchase_price - maintenance_msr_visits_used * retail_value_per_visit_usd - cancellation_fee_usd)
    refund_pro_rata: max(0, round(purchase_price * plan_visits / visits_included, 2) - cancellation_fee_usd)
  measures: [maintenance_msr_visits_used]
- id: maintenance_evt_refund_payment
  subject: [maintenance_refund_paid]
  rule: A computed cancellation refund is paid within refund_payment_days calendar days after the cancellation is processed, in one payment for the full amount due. Where refund_to_lienholder_when_financed is true and the plan was financed on the installment contract (financed_on_contract is 'true'), the refund is paid to the lienholder named on the plan; otherwise it is paid to the plan holder. A refund of 0.00 is not paid and no payment entry is made. A refund is paid only once per refund calculation.
  eligibility:
  - id: one_payment
    applies_to: [maintenance_refund_paid]
    kind: dedup
    condition: A refund is paid only once per refund calculation.
    evidence_fields: [maintenance_plan_ledger.source_entry_id, maintenance_plan_ledger.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plan_ledger.source_entry_id]
      action_bindings: {maintenance_plan_ledger.source_entry_id: source_entry_id}
    dedup_contract:
      table: maintenance_plan_ledger
      mode: separate_record
      object_bindings: {source_entry_id: source_entry_id}
      duplicate_filters: {event_type: [maintenance_refund_paid]}
      distinct_fields: [entry_date]
- id: maintenance_combo_factory_maintenance
  subject: [maintenance_visit_redeemed]
  rule: Holding a factory complimentary maintenance coverage changes when plan visits are used. Where defer_while_factory_maintenance_active is true, a plan visit is not redeemed for a service that the vehicle's in-force Factory Complimentary Maintenance coverage (warranty records) pays at that visit's date and odometer; that service is recorded under the factory coverage and the plan's visits stay unused. Services the factory coverage does not include at that visit are redeemed from the plan as usual. The plan term is not extended for the deferred period.
  eligibility: []
- id: maintenance_evt_fleet_substitution
  subject: [maintenance_vehicle_substituted]
  rule: A fleet plan whose vehicle is retired from the fleet may be moved to the replacement vehicle where fleet_substitution_max_per_plan is above 0, at most that many times per plan. The replacement vehicle must itself be eligible under maintenance_evt_sale and must not already have an active plan. The plan keeps its sale date, expiration date, visits remaining and price; its expiration odometer is not reset. A fleet plan is moved only while it is active.
  eligibility:
  - id: active_to_move
    applies_to: [maintenance_vehicle_substituted]
    kind: state
    condition: A fleet plan is moved only while it is active.
    evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [maintenance_plans.maintenance_plan_id]
      action_bindings: {maintenance_plans.maintenance_plan_id: maintenance_plan_id}
    state_contract: {field: maintenance_plans.status, allowed: [active]}
extended_policies:
- id: maintenance_ext_fleet_addendum_price
  base_policy_refs: [maintenance_agg_fleet_volume, maintenance_evt_sale, maintenance_agg_multi_holding]
  overwrite:
  - base_policy: maintenance_agg_fleet_volume
    superseded_clause: >-
      When the customer's active Kessler Care Fleet 12-Visit plans, counted by maintenance_msr_active_fleet_plans including the plan being sold, reach fleet_volume_min_plans, the new plan is sold at plan_price_usd less fleet_volume_discount_pct, rounded to the cent.
    replaced_by: >-
      For a fleet addendum within this policy's scope, and only for such an addendum, this policy replaces the fleet volume threshold with the fleet addendum price set out here, while plans sold earlier are still not repriced, fleet plans still carry no bundle discount, and every other fleet plan sale keeps the fleet volume threshold.
  - base_policy: maintenance_evt_sale
    superseded_clause: >-
      a plan bought on its own is priced at plan_price_usd
    replaced_by: >-
      For the same fleet addendum this policy also replaces the price of a plan bought on its own, while every other fleet plan bought on its own is still priced at plan_price_usd (less fleet_volume_discount_pct where the fleet volume threshold is reached), the addendum is still offered only where standalone_sale_allowed is true and a retail Kessler Care plan bought on its own is outside this policy.
  trigger: on_request
  subject: [maintenance_plan_sold]
  computes: purchase_price
  target_tool: sign_fleet_care_addendum_ac106112
  params:
    standing_rate_net30: 0.03
    standing_rate_net15: 0.015
    enrollment_days_near: 30
    enrollment_days_far: 90
    enrollment_allowance_near: 40.0
    enrollment_allowance_far: 20.0
    tenure_months_long: 96
    tenure_months_mid: 36
    tenure_credit_long: 30.0
    tenure_credit_mid: 15.0
    replacement_credit_recent: 60.0
    replacement_credit_earlier: 30.0
    spend_high: 5000.0
    spend_mid: 500.0
    spend_credit_high: 40.0
    spend_credit_mid: 20.0
  rule: >-
    This policy prices a Kessler Care Fleet 12-Visit plan addendum that a fleet customer buys on its own for the unit delivered on its single Kessler Fleet Vehicle Purchase Agreement that stands in delivered status (the unit being enrolled), and only such an addendum; an addendum for any other unit, or for a customer holding more than one agreement in delivered status, is outside this policy and is priced like every other fleet plan bought on its own: at plan_price_usd, less fleet_volume_discount_pct where the customer's active Kessler Care Fleet 12-Visit plans, including it, reach fleet_volume_min_plans, rounded to the cent.
    For a fleet addendum within this policy's scope, and only for such an addendum, this policy replaces the fleet volume threshold with the fleet addendum price set out here, while plans sold earlier are still not repriced, fleet plans still carry no bundle discount, and every other fleet plan sale keeps the fleet volume threshold.
    For the same fleet addendum this policy also replaces the price of a plan bought on its own, while every other fleet plan bought on its own is still priced at plan_price_usd (less fleet_volume_discount_pct where the fleet volume threshold is reached), the addendum is still offered only where standalone_sale_allowed is true and a retail Kessler Care plan bought on its own is outside this policy.
    The pricing date is the day the addendum is signed.
    A fleet plan addendum is priced from the addendum's basis price, which is the plan's plan_price_usd.
    The fleet addendum price is that basis price rounded half up to the cent.
    Where a rate applies to the addendum it reduces the basis price once; dollar credits that apply are then added together and subtracted from that reduced price; a result below 0.00 is 0.00, so the credits never make the price negative; the fleet addendum price is rounded half up to the cent only at the end.
    The addendum's basis price follows the factory maintenance coverage of the unit being enrolled, because plan visits are not used while that coverage pays: where the unit has an active Factory Complimentary Maintenance coverage with a mileage limit, the basis price is plan_price_usd times the greater of the plan's term months left after that coverage ends (term_months less the whole months from the pricing date to the coverage's expiration_date, never below 0) over term_months and the plan's term miles left after that coverage ends (term_miles less the coverage's expiration_odometer minus the unit's odometer at delivery on its agreement, never below 0) over term_miles; where the unit has an active Factory Complimentary Maintenance coverage with no mileage limit (expiration_odometer 0), it is plan_price_usd times the term months left after that coverage ends over term_months; where the unit has no active Factory Complimentary Maintenance coverage, it is plan_price_usd.
    The account standing rate reads the customer's service account: a Commercial Fleet Account - Net 30 with no late fee whose line date falls fewer than 12 whole months before the pricing date takes standing_rate_net30; a Commercial Fleet Account - Net 15 with no such late fee takes standing_rate_net15; any other account, or a fleet account with such a late fee, takes no account standing rate.
    The new-unit enrollment allowance counts the calendar days from the delivery date on the agreement of the unit being enrolled to the pricing date: enrollment_days_near days or fewer earns enrollment_allowance_near; more than enrollment_days_near and up to enrollment_days_far days earns enrollment_allowance_far; a longer span earns no enrollment allowance.
    The fleet tenure credit counts the whole months from the opening date of the customer's service account to the pricing date: tenure_months_long months or more earns tenure_credit_long; tenure_months_mid months or more but fewer than tenure_months_long earns tenure_credit_mid; a shorter tenure earns no fleet tenure credit.
    The total-loss replacement credit reads the total-loss cancellation entry of the Kessler Care Fleet 12-Visit plan named on the customer's most recent signed total-loss cancellation request (by request date, and on the same date by the time the request was registered), by the date of that entry: dated fewer than 1 whole month before the pricing date it earns replacement_credit_recent; dated 1 or more but fewer than 3 whole months before it earns replacement_credit_earlier; an older one, or none, earns no total-loss replacement credit.
    The fleet service spend credit adds up the labor and parts amounts charged with pay type customer pay on the customer's repair orders with a line date fewer than 12 whole months before the pricing date, as charged and before any credit, deductible lines owed on covered work not counted: spend_high or more earns spend_credit_high; spend_mid or more but less than spend_high earns spend_credit_mid; less earns no fleet service spend credit.
    The fleet addendum price is fixed only after every Kessler Care plan of the customer that carries a signed total-loss cancellation request stands cancelled.
    A fleet plan addendum is not written until every Kessler Care Fleet 12-Visit plan of the customer that carries a signed cancellation request for a reason other than a total loss stands cancelled.
    The addendum is written for the store on the agreement of the unit being enrolled, with no purchase deal attached, not financed and with no lienholder; it is dated the day it is signed, its term ends at the sale date plus term_months calendar months and at the odometer at signing plus term_miles, and visits_included visits are loaded.
  prerequisite:
  - problem: maintenance_ext_total_loss_refund
    kind: value_input
    gate: replacement_credit
    form: state
    policy_source: >-
      The fleet addendum price is fixed only after every Kessler Care plan of the customer that carries a signed total-loss cancellation request stands cancelled.
    condition: >-
      Every maintenance plan of the customer with a maintenance_cancellation_requests row whose cancel_reason is total_loss shows status cancelled, with a maintenance_visits_cancelled entry carrying cancel_reason total_loss.
    resolved_by: process_total_loss_cancellation_8f67308a
    effect: >-
      Once the total-loss cancellation is booked, the plan named on the customer's most recent signed total-loss request carries a total-loss cancellation entry dated the pricing date, so the total-loss replacement credit binding moves from 0.00 to replacement_credit_recent.
  - problem: maintenance_ext_fleet_cancel_refund
    kind: state_gate
    gate: maintenance_plans.status
    form: state
    policy_source: >-
      A fleet plan addendum is not written until every Kessler Care Fleet 12-Visit plan of the customer that carries a signed cancellation request for a reason other than a total loss stands cancelled.
    condition: >-
      Every Kessler Care Fleet 12-Visit plan of the customer with a maintenance_cancellation_requests row whose cancel_reason is not total_loss shows status cancelled.
    resolved_by: process_fleet_plan_cancellation_44bd9d69
    effect: >-
      Once the fleet cancellation is processed, the plan carrying the signed non-total-loss request stands cancelled and the addendum may be written.
  cross_category:
  - category: warranty
    as: branch
    reads: [variant_name, status, vehicle_id, expiration_date, expiration_odometer]
    note: The unit basis factor reads the enrolled unit's active Factory Complimentary Maintenance coverage and its expiration date and mileage.
  - category: purchase
    as: branch
    reads: [vehicle_id, delivery_date, odometer_at_delivery, status, variant_name]
    note: The unit basis and enrollment factors read the agreement in delivered status of the unit being enrolled.
  - category: service
    as: history
    reads: [variant_name, opened_date, service_ro_lines.event_type, service_ro_lines.amount, service_ro_lines.pay_type]
    note: The standing factor reads the account tier and late fees of the last 12 months; the tenure factor reads the opening date; the spend factor adds customer-pay labor and parts of the last 12 months.
  compute:
  - basis_unit: "CFIELD('purchase', 'vehicle_id', variant_name='Fleet Vehicle Purchase Agreement', status='delivered')"
  - basis_unit_odometer: "float(CFIELD('purchase', 'odometer_at_delivery', variant_name='Fleet Vehicle Purchase Agreement', status='delivered') or 0)"
  - basis_fcm_expiry: "(CFIELD('warranty', 'expiration_date', vehicle_id=basis_unit, variant_name='Factory Complimentary Maintenance', status='active') if basis_unit else None)"
  - basis_fcm_odometer: "(float(CFIELD('warranty', 'expiration_odometer', vehicle_id=basis_unit, variant_name='Factory Complimentary Maintenance', status='active') or 0) if basis_fcm_expiry else 0)"
  - basis_months_share: "(MX(0, P('term_months') - MX(0, MONTHS(NOW, basis_fcm_expiry))) / P('term_months') if basis_fcm_expiry else 1)"
  - basis_miles_share: "(MX(0, P('term_miles') - MX(0, basis_fcm_odometer - basis_unit_odometer)) / P('term_miles') if basis_fcm_odometer > 0 else 0)"
  - basis_price: "((P('plan_price_usd') * MX(basis_months_share, basis_miles_share)) if (basis_fcm_expiry and basis_fcm_odometer > 0) else ((P('plan_price_usd') * basis_months_share) if basis_fcm_expiry else P('plan_price_usd')))"
  - standing_tier: "CFIELD('service', 'variant_name')"
  - standing_late_fees: "XCOUNT('service', 'service_ro_lines', within_months=12, date_field='line_date', event_type='service_late_fee_charged')"
  - standing_rate: "(K('standing_rate_net30') if (standing_tier == 'Commercial Fleet Account - Net 30' and standing_late_fees == 0) else (K('standing_rate_net15') if (standing_tier == 'Commercial Fleet Account - Net 15' and standing_late_fees == 0) else 0))"
  - enrollment_delivery_date: "CFIELD('purchase', 'delivery_date', variant_name='Fleet Vehicle Purchase Agreement', status='delivered')"
  - enrollment_days: "(MX(0, DAYS(enrollment_delivery_date, NOW)) if enrollment_delivery_date else 99999)"
  - enrollment_allowance: "(K('enrollment_allowance_near') if enrollment_days <= K('enrollment_days_near') else (K('enrollment_allowance_far') if enrollment_days <= K('enrollment_days_far') else 0))"
  - tenure_opened: "CFIELD('service', 'opened_date')"
  - tenure_months: "(MONTHS(tenure_opened, NOW) if tenure_opened else 0)"
  - tenure_credit: "(K('tenure_credit_long') if tenure_months >= K('tenure_months_long') else (K('tenure_credit_mid') if tenure_months >= K('tenure_months_mid') else 0))"
  - replacement_recent: "COUNT('maintenance_plan_ledger', within_months=1, date_field='entry_date', event_type='maintenance_visits_cancelled', cancel_reason='total_loss')"
  - replacement_earlier: "COUNT('maintenance_plan_ledger', within_months=3, date_field='entry_date', event_type='maintenance_visits_cancelled', cancel_reason='total_loss')"
  - replacement_credit: "(K('replacement_credit_recent') if replacement_recent > 0 else (K('replacement_credit_earlier') if replacement_earlier > 0 else 0))"
  - spend_total: "XSUM('service', 'service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay') + XSUM('service', 'service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay')"
  - spend_credit: "(K('spend_credit_high') if spend_total >= K('spend_high') else (K('spend_credit_mid') if spend_total >= K('spend_mid') else 0))"
  - credit_total: "enrollment_allowance + tenure_credit + replacement_credit + spend_credit"
  - result: "RND(MX(0, basis_price * (1 - standing_rate) - credit_total) + 0.000000001, 2)"
  compute_basis:
    basis_unit: "This policy prices a Kessler Care Fleet 12-Visit plan addendum that a fleet customer buys on its own for the unit delivered on its single Kessler Fleet Vehicle Purchase Agreement that stands in delivered status (the unit being enrolled), and only such an addendum"
    basis_unit_odometer: "term_miles less the coverage's expiration_odometer minus the unit's odometer at delivery on its agreement, never below 0"
    basis_fcm_expiry: "where the unit has an active Factory Complimentary Maintenance coverage with a mileage limit"
    basis_fcm_odometer: "where the unit has an active Factory Complimentary Maintenance coverage with no mileage limit (expiration_odometer 0)"
    basis_months_share: "term_months less the whole months from the pricing date to the coverage's expiration_date, never below 0"
    basis_miles_share: "term_miles less the coverage's expiration_odometer minus the unit's odometer at delivery on its agreement, never below 0"
    basis_price: "The addendum's basis price follows the factory maintenance coverage of the unit being enrolled, because plan visits are not used while that coverage pays: where the unit has an active Factory Complimentary Maintenance coverage with a mileage limit, the basis price is plan_price_usd times the greater of the plan's term months left after that coverage ends (term_months less the whole months from the pricing date to the coverage's expiration_date, never below 0) over term_months and the plan's term miles left after that coverage ends (term_miles less the coverage's expiration_odometer minus the unit's odometer at delivery on its agreement, never below 0) over term_miles; where the unit has an active Factory Complimentary Maintenance coverage with no mileage limit (expiration_odometer 0), it is plan_price_usd times the term months left after that coverage ends over term_months; where the unit has no active Factory Complimentary Maintenance coverage, it is plan_price_usd."
    standing_tier: "The account standing rate reads the customer's service account"
    standing_late_fees: "no late fee whose line date falls fewer than 12 whole months before the pricing date"
    standing_rate: "a Commercial Fleet Account - Net 30 with no late fee whose line date falls fewer than 12 whole months before the pricing date takes standing_rate_net30; a Commercial Fleet Account - Net 15 with no such late fee takes standing_rate_net15; any other account, or a fleet account with such a late fee, takes no account standing rate."
    enrollment_delivery_date: "The new-unit enrollment allowance counts the calendar days from the delivery date on the agreement of the unit being enrolled to the pricing date"
    enrollment_days: "The new-unit enrollment allowance counts the calendar days from the delivery date on the agreement of the unit being enrolled to the pricing date"
    enrollment_allowance: "enrollment_days_near days or fewer earns enrollment_allowance_near; more than enrollment_days_near and up to enrollment_days_far days earns enrollment_allowance_far; a longer span earns no enrollment allowance."
    tenure_opened: "The fleet tenure credit counts the whole months from the opening date of the customer's service account to the pricing date"
    tenure_months: "The fleet tenure credit counts the whole months from the opening date of the customer's service account to the pricing date"
    tenure_credit: "tenure_months_long months or more earns tenure_credit_long; tenure_months_mid months or more but fewer than tenure_months_long earns tenure_credit_mid; a shorter tenure earns no fleet tenure credit."
    replacement_recent: "dated fewer than 1 whole month before the pricing date it earns replacement_credit_recent"
    replacement_earlier: "dated 1 or more but fewer than 3 whole months before it earns replacement_credit_earlier"
    replacement_credit: "The total-loss replacement credit reads the total-loss cancellation entry of the Kessler Care Fleet 12-Visit plan named on the customer's most recent signed total-loss cancellation request (by request date, and on the same date by the time the request was registered), by the date of that entry: dated fewer than 1 whole month before the pricing date it earns replacement_credit_recent; dated 1 or more but fewer than 3 whole months before it earns replacement_credit_earlier; an older one, or none, earns no total-loss replacement credit."
    spend_total: "The fleet service spend credit adds up the labor and parts amounts charged with pay type customer pay on the customer's repair orders with a line date fewer than 12 whole months before the pricing date, as charged and before any credit, deductible lines owed on covered work not counted"
    spend_credit: "spend_high or more earns spend_credit_high; spend_mid or more but less than spend_high earns spend_credit_mid; less earns no fleet service spend credit."
    credit_total: "dollar credits that apply are then added together and subtracted from that reduced price"
    result: "Where a rate applies to the addendum it reduces the basis price once; dollar credits that apply are then added together and subtracted from that reduced price; a result below 0.00 is 0.00, so the credits never make the price negative; the fleet addendum price is rounded half up to the cent only at the end."
  factors:
  - id: unit_basis
    effect: method
    decides: basis_price
    bindings: [basis_unit, basis_unit_odometer, basis_fcm_expiry, basis_fcm_odometer, basis_months_share, basis_miles_share, basis_price]
    ladder:
    - when: "the unit being enrolled has an active Factory Complimentary Maintenance coverage with a mileage limit"
      method: "basis price = plan_price_usd times the greater of the term-months share and the term-miles share left after the factory coverage ends"
    - when: "the unit has an active Factory Complimentary Maintenance coverage with no mileage limit"
      method: "basis price = plan_price_usd times the term-months share left after the factory coverage ends"
    - when: "otherwise"
      method: "basis price = plan_price_usd"
    baseline:
      basis_price: "P('plan_price_usd')"
    evidence: [cross_category, date]
    cross_difficulty: warranty
  - id: account_standing
    effect: parameter
    decides: standing_rate
    bindings: [standing_tier, standing_late_fees, standing_rate]
    ladder:
    - when: "service account is a Commercial Fleet Account - Net 30 and no late fee was charged fewer than 12 whole months before the pricing date"
      value: "K('standing_rate_net30')"
    - when: "service account is a Commercial Fleet Account - Net 15 and no late fee was charged fewer than 12 whole months before the pricing date"
      value: "K('standing_rate_net15')"
    - when: "otherwise"
      value: "0"
    baseline:
      standing_rate: "0"
    evidence: [cross_category, history]
    cross_difficulty: service
  - id: new_unit_enrollment
    effect: parameter
    decides: enrollment_allowance
    bindings: [enrollment_delivery_date, enrollment_days, enrollment_allowance]
    ladder:
    - when: "the unit was delivered enrollment_days_near calendar days or fewer before the pricing date"
      value: "K('enrollment_allowance_near')"
    - when: "the unit was delivered more than enrollment_days_near and up to enrollment_days_far calendar days before the pricing date"
      value: "K('enrollment_allowance_far')"
    - when: "otherwise"
      value: "0"
    baseline:
      enrollment_allowance: "0"
    evidence: [cross_category, date]
    cross_difficulty: purchase
  - id: account_tenure
    effect: parameter
    decides: tenure_credit
    bindings: [tenure_opened, tenure_months, tenure_credit]
    ladder:
    - when: "service account opened tenure_months_long whole months or more before the pricing date"
      value: "K('tenure_credit_long')"
    - when: "service account opened tenure_months_mid or more but fewer than tenure_months_long whole months before the pricing date"
      value: "K('tenure_credit_mid')"
    - when: "otherwise"
      value: "0"
    baseline:
      tenure_credit: "0"
    evidence: [cross_category, date]
    cross_difficulty: service
  - id: loss_replacement
    effect: parameter
    decides: replacement_credit
    bindings: [replacement_recent, replacement_earlier, replacement_credit]
    ladder:
    - when: "the total-loss cancellation entry of the fleet plan named on the customer's most recent signed total-loss request is dated fewer than 1 whole month before the pricing date"
      value: "K('replacement_credit_recent')"
    - when: "that entry is dated 1 or more but fewer than 3 whole months before"
      value: "K('replacement_credit_earlier')"
    - when: "otherwise"
      value: "0"
    baseline:
      replacement_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: service_spend
    effect: parameter
    decides: spend_credit
    bindings: [spend_total, spend_credit]
    ladder:
    - when: "labor and parts charged with pay type customer pay in the last 12 whole months total spend_high or more"
      value: "K('spend_credit_high')"
    - when: "they total spend_mid or more but less than spend_high"
      value: "K('spend_credit_mid')"
    - when: "otherwise"
      value: "0"
    baseline:
      spend_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: service
  baseline:
    rule: >-
      A fleet plan addendum is priced from the addendum's basis price, which is the plan's plan_price_usd.
      The fleet addendum price is that basis price rounded half up to the cent.
    params: [plan_price_usd]
  inputs:
    history:
    - {table: maintenance_plan_ledger, aggregate: count, field: visits, within_months: 3, filters: {event_type: maintenance_visits_cancelled, cancel_reason: total_loss}}
    - {category: service, table: service_ro_lines, aggregate: count, field: amount, within_months: 12, filters: {event_type: service_late_fee_charged}}
    - {category: service, table: service_ro_lines, aggregate: sum, field: amount, within_months: 12, filters: {event_type: service_labor_charged, pay_type: customer_pay}}
    cross_category: [warranty, purchase, service]
- id: maintenance_ext_fleet_cancel_refund
  base_policy_refs: [maintenance_evt_cancellation_refund]
  overwrite:
  - base_policy: maintenance_evt_cancellation_refund
    superseded_clause: >-
      under pro_rata_unused_visits it is purchase_price times visits remaining divided by visits_included, rounded to the cent, less cancellation_fee_usd
    replaced_by: >-
      For a Kessler Care Fleet 12-Visit plan cancelled for a reason other than a total loss on a request processed on its own request date, and only for such a plan, this policy replaces the pro-rata refund of the refund method with the fleet cancellation refund set out here, while the free look and unwound-deal full refunds still take precedence, the refund is still computed as of the effective date (the request date), and a refund below 0.00 is still 0.00 with nothing billed; a retail plan and a total-loss cancellation are outside this policy, and a fleet plan cancelled on a request processed on a later day is outside it too and is still refunded purchase_price times visits remaining divided by visits_included, rounded to the cent, less cancellation_fee_usd.
  trigger: state_due
  subject: [maintenance_plan_cancelled, maintenance_visits_cancelled, maintenance_refund_calculated]
  computes: refund_amount
  target_tool: process_fleet_plan_cancellation_44bd9d69
  params:
    fee_net30: 10.0
    fee_net15: 15.0
    filter_visit_first: 6
    filter_visit_last: 12
    filter_deduction_one: 45.0
    filter_deduction_both: 90.0
    recapture_months_full: 12
    recapture_months_half: 24
    recapture_rate_full: 1.0
    recapture_rate_half: 0.5
    tenure_refund_months_long: 60
    tenure_refund_months_mid: 24
    tenure_refund_credit_long: 20.0
    tenure_refund_credit_mid: 10.0
    unit_lines_high: 3
    unit_service_credit_high: 30.0
    unit_service_credit_low: 15.0
  rule: >-
    For a Kessler Care Fleet 12-Visit plan cancelled for a reason other than a total loss on a request processed on its own request date, and only for such a plan, this policy replaces the pro-rata refund of the refund method with the fleet cancellation refund set out here, while the free look and unwound-deal full refunds still take precedence, the refund is still computed as of the effective date (the request date), and a refund below 0.00 is still 0.00 with nothing billed; a retail plan and a total-loss cancellation are outside this policy, and a fleet plan cancelled on a request processed on a later day is outside it too and is still refunded purchase_price times visits remaining divided by visits_included, rounded to the cent, less cancellation_fee_usd.
    Because the request is processed on its request date, every span this policy counts ends on the effective date, which is the day the refund is worked out.
    The fleet cancellation refund is the plan's purchase_price times the fleet refund share, rounded half up to the cent, less the fleet cancellation fee.
    The fleet refund share is the plan's unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included, and the fleet cancellation fee is cancellation_fee_usd.
    Deductions that apply are subtracted from, and credits that apply are added to, the rounded share amount; the fleet cancellation refund is floored at 0.00 at the end, and a free look or unwound-deal refund replaces the whole computation.
    The fleet refund share depends on how the unit was used: where the unit has a repair-order check-in more than service_interval_miles above the plan's last recorded visit reading, which is the highest odometer on the plan's redemption entries (reinstated or not) or odometer_at_sale where that is higher or there is no such entry, the share is the lesser of the unused-visit share and the unused-mile share, the unused miles being expiration_odometer less the highest check-in odometer (never below 0) over term_miles; otherwise, where the plan has no redemption entry (reinstated or not) dated fewer than 12 whole months before the effective date, the share is the lesser of the unused-visit share and the unused-day share, the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date; otherwise the share is the unused-visit share.
    The fleet cancellation fee follows the net terms of the customer's service account: a Commercial Fleet Account - Net 30 pays fee_net30; a Commercial Fleet Account - Net 15 pays fee_net15; any other account pays cancellation_fee_usd.
    The filter-visit deduction reads the plan's net visits used (visits redeemed less visits reinstated), the plan including cabin and engine air filters at visits filter_visit_first and filter_visit_last: net visits used of filter_visit_last or more deduct filter_deduction_both; net visits used of filter_visit_first or more but fewer than filter_visit_last deduct filter_deduction_one; fewer deduct nothing.
    The volume discount recapture rate applies to a plan sold below plan_price_usd and counts the whole months from sale_date to the effective date: fewer than recapture_months_full months takes recapture_rate_full; recapture_months_full months or more but fewer than recapture_months_half takes recapture_rate_half; a longer time in force, or a plan sold at plan_price_usd, takes no recapture; the recapture deducted is that rate times the difference between plan_price_usd and purchase_price, rounded half up to the cent.
    The fleet tenure refund credit counts the whole months from the opening date of the customer's service account to the effective date: tenure_refund_months_long months or more earns tenure_refund_credit_long; tenure_refund_months_mid months or more but fewer than tenure_refund_months_long earns tenure_refund_credit_mid; a shorter tenure earns no fleet tenure refund credit.
    The unit service credit counts the labor lines charged with pay type customer pay at the group on the plan's unit, deductible lines owed on covered work not counted: unit_lines_high or more earn unit_service_credit_high; one or more but fewer than unit_lines_high earn unit_service_credit_low; none earns no unit service credit.
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads: [variant_name, opened_date, service_ro_lines.odometer_in, service_ro_lines.event_type, service_ro_lines.vehicle_id, service_ro_lines.pay_type]
    note: The share factor reads the unit's repair-order check-ins; the fee reads the account tier; the tenure credit reads the opening date; the unit service credit counts the unit's labor lines.
  - category: purchase
    as: branch
    reads: [status]
    note: The unwound-deal test reads the status of the plan's own deal.
  compute:
  - visits_loaded: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visits_loaded')"
  - visits_redeemed: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_redeemed')"
  - visits_reinstated: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_reinstated')"
  - visits_unused: "MX(0, visits_loaded - visits_redeemed + visits_reinstated)"
  - visit_share: "visits_unused / P('visits_included')"
  - last_visit_reading: "MX(MAX('maintenance_plan_ledger', 'odometer', event_type='maintenance_visit_redeemed'), float(F('odometer_at_sale')))"
  - share_checkin: "XMAX('service', 'service_ro_lines', 'odometer_in', vehicle_id=F('vehicle_id'))"
  - share_recent_entries: "COUNT('maintenance_plan_ledger', within_months=12, date_field='entry_date', event_type='maintenance_visit_redeemed')"
  - share_mile: "MX(0, F('expiration_odometer') - share_checkin) / P('term_miles')"
  - share_day: "MX(0, DAYS(NOW, F('expiration_date'))) / DAYS(F('sale_date'), F('expiration_date'))"
  - refund_share: "(MN(visit_share, share_mile) if share_checkin > last_visit_reading + P('service_interval_miles') else (MN(visit_share, share_day) if share_recent_entries == 0 else visit_share))"
  - fee_tier: "CFIELD('service', 'variant_name')"
  - cancel_fee: "(K('fee_net30') if fee_tier == 'Commercial Fleet Account - Net 30' else (K('fee_net15') if fee_tier == 'Commercial Fleet Account - Net 15' else P('cancellation_fee_usd')))"
  - filter_net_used: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_redeemed') - SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_reinstated')"
  - filter_deduction: "(K('filter_deduction_both') if filter_net_used >= K('filter_visit_last') else (K('filter_deduction_one') if filter_net_used >= K('filter_visit_first') else 0))"
  - recapture_months: "MONTHS(F('sale_date'), NOW)"
  - recapture_rate: "(K('recapture_rate_full') if (F('purchase_price') < P('plan_price_usd') and recapture_months < K('recapture_months_full')) else (K('recapture_rate_half') if (F('purchase_price') < P('plan_price_usd') and recapture_months < K('recapture_months_half')) else 0))"
  - recapture_amount: "RND(recapture_rate * (P('plan_price_usd') - F('purchase_price')) + 0.000000001, 2)"
  - tenure_refund_months: "(MONTHS(CFIELD('service', 'opened_date'), NOW) if CFIELD('service', 'opened_date') else 0)"
  - tenure_refund_credit: "(K('tenure_refund_credit_long') if tenure_refund_months >= K('tenure_refund_months_long') else (K('tenure_refund_credit_mid') if tenure_refund_months >= K('tenure_refund_months_mid') else 0))"
  - unit_labor_lines: "XCOUNT('service', 'service_ro_lines', vehicle_id=F('vehicle_id'), event_type='service_labor_charged', pay_type='customer_pay')"
  - unit_service_credit: "(K('unit_service_credit_high') if unit_labor_lines >= K('unit_lines_high') else (K('unit_service_credit_low') if unit_labor_lines >= 1 else 0))"
  - free_look: "(DAYS(F('sale_date'), NOW) <= P('free_look_days') and visits_redeemed - visits_reinstated == 0)"
  - deal_unwound: "((P('deal_unwind_full_refund') and CFIELD('purchase', 'status', purchase_deal_id=F('purchase_deal_id')) == 'unwound') if F('purchase_deal_id') else False)"
  - share_amount: "RND(F('purchase_price') * refund_share + 0.000000001, 2)"
  - result: "(F('purchase_price') if (free_look or deal_unwound) else MX(0, RND(share_amount - cancel_fee - filter_deduction - recapture_amount + tenure_refund_credit + unit_service_credit + 0.000000001, 2)))"
  compute_basis:
    visits_loaded: "The fleet refund share is the plan's unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included"
    visits_redeemed: "The fleet refund share is the plan's unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included"
    visits_reinstated: "The fleet refund share is the plan's unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included"
    visit_share: "The fleet refund share is the plan's unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included"
    last_visit_reading: "which is the highest odometer on the plan's redemption entries (reinstated or not) or odometer_at_sale where that is higher or there is no such entry"
    share_checkin: "the unused miles being expiration_odometer less the highest check-in odometer (never below 0) over term_miles"
    share_recent_entries: "where the plan has no redemption entry (reinstated or not) dated fewer than 12 whole months before the effective date"
    share_mile: "the unused miles being expiration_odometer less the highest check-in odometer (never below 0) over term_miles"
    share_day: "the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date"
    refund_share: "The fleet refund share depends on how the unit was used: where the unit has a repair-order check-in more than service_interval_miles above the plan's last recorded visit reading, which is the highest odometer on the plan's redemption entries (reinstated or not) or odometer_at_sale where that is higher or there is no such entry, the share is the lesser of the unused-visit share and the unused-mile share, the unused miles being expiration_odometer less the highest check-in odometer (never below 0) over term_miles; otherwise, where the plan has no redemption entry (reinstated or not) dated fewer than 12 whole months before the effective date, the share is the lesser of the unused-visit share and the unused-day share, the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date; otherwise the share is the unused-visit share."
    fee_tier: "The fleet cancellation fee follows the net terms of the customer's service account"
    cancel_fee: "a Commercial Fleet Account - Net 30 pays fee_net30; a Commercial Fleet Account - Net 15 pays fee_net15; any other account pays cancellation_fee_usd."
    filter_net_used: "The filter-visit deduction reads the plan's net visits used (visits redeemed less visits reinstated)"
    filter_deduction: "net visits used of filter_visit_last or more deduct filter_deduction_both; net visits used of filter_visit_first or more but fewer than filter_visit_last deduct filter_deduction_one; fewer deduct nothing."
    recapture_months: "counts the whole months from sale_date to the effective date"
    recapture_rate: "The volume discount recapture rate applies to a plan sold below plan_price_usd and counts the whole months from sale_date to the effective date: fewer than recapture_months_full months takes recapture_rate_full; recapture_months_full months or more but fewer than recapture_months_half takes recapture_rate_half; a longer time in force, or a plan sold at plan_price_usd, takes no recapture"
    recapture_amount: "the recapture deducted is that rate times the difference between plan_price_usd and purchase_price, rounded half up to the cent."
    tenure_refund_months: "The fleet tenure refund credit counts the whole months from the opening date of the customer's service account to the effective date"
    tenure_refund_credit: "tenure_refund_months_long months or more earns tenure_refund_credit_long; tenure_refund_months_mid months or more but fewer than tenure_refund_months_long earns tenure_refund_credit_mid; a shorter tenure earns no fleet tenure refund credit."
    unit_labor_lines: "The unit service credit counts the labor lines charged with pay type customer pay at the group on the plan's unit, deductible lines owed on covered work not counted"
    unit_service_credit: "unit_lines_high or more earn unit_service_credit_high; one or more but fewer than unit_lines_high earn unit_service_credit_low; none earns no unit service credit."
    free_look: "while the free look and unwound-deal full refunds still take precedence"
    deal_unwound: "while the free look and unwound-deal full refunds still take precedence"
    share_amount: "The fleet cancellation refund is the plan's purchase_price times the fleet refund share, rounded half up to the cent, less the fleet cancellation fee."
    result: "Deductions that apply are subtracted from, and credits that apply are added to, the rounded share amount; the fleet cancellation refund is floored at 0.00 at the end, and a free look or unwound-deal refund replaces the whole computation."
  factors:
  - id: usage_share
    effect: method
    decides: refund_share
    bindings: [last_visit_reading, share_checkin, share_recent_entries, share_mile, share_day, refund_share]
    ladder:
    - when: "the unit has a repair-order check-in more than service_interval_miles above the plan's last recorded visit reading"
      method: "share = the lesser of the unused-visit share and the unused-mile share measured to the highest check-in"
    - when: "no such check-in, and the plan has no redemption entry dated fewer than 12 whole months before the effective date"
      method: "share = the lesser of the unused-visit share and the unused-day share measured from the effective date"
    - when: "otherwise"
      method: "share = the unused-visit share"
    baseline:
      refund_share: "visit_share"
    evidence: [cross_category, history]
    cross_difficulty: service
  - id: net_terms_fee
    effect: parameter
    decides: cancel_fee
    bindings: [fee_tier, cancel_fee]
    ladder:
    - when: "service account is a Commercial Fleet Account - Net 30"
      value: "K('fee_net30')"
    - when: "service account is a Commercial Fleet Account - Net 15"
      value: "K('fee_net15')"
    - when: "otherwise"
      value: "P('cancellation_fee_usd')"
    baseline:
      cancel_fee: "P('cancellation_fee_usd')"
    evidence: [cross_category]
    cross_difficulty: service
  - id: filter_visits
    effect: parameter
    decides: filter_deduction
    bindings: [filter_net_used, filter_deduction]
    ladder:
    - when: "net visits used of filter_visit_last or more"
      value: "K('filter_deduction_both')"
    - when: "net visits used of filter_visit_first or more but fewer than filter_visit_last"
      value: "K('filter_deduction_one')"
    - when: "otherwise"
      value: "0"
    baseline:
      filter_deduction: "0"
    evidence: [history]
    cross_difficulty: null
  - id: discount_recapture
    effect: parameter
    decides: recapture_rate
    bindings: [recapture_months, recapture_rate]
    ladder:
    - when: "plan sold below plan_price_usd and in force fewer than recapture_months_full whole months"
      value: "K('recapture_rate_full')"
    - when: "plan sold below plan_price_usd and in force recapture_months_full or more but fewer than recapture_months_half whole months"
      value: "K('recapture_rate_half')"
    - when: "otherwise"
      value: "0"
    baseline:
      recapture_rate: "0"
    evidence: [date]
    cross_difficulty: null
  - id: fleet_tenure_refund
    effect: parameter
    decides: tenure_refund_credit
    bindings: [tenure_refund_months, tenure_refund_credit]
    ladder:
    - when: "service account opened tenure_refund_months_long whole months or more before the effective date"
      value: "K('tenure_refund_credit_long')"
    - when: "opened tenure_refund_months_mid or more but fewer than tenure_refund_months_long whole months before"
      value: "K('tenure_refund_credit_mid')"
    - when: "otherwise"
      value: "0"
    baseline:
      tenure_refund_credit: "0"
    evidence: [cross_category, date]
    cross_difficulty: service
  - id: unit_service_history
    effect: parameter
    decides: unit_service_credit
    bindings: [unit_labor_lines, unit_service_credit]
    ladder:
    - when: "unit_lines_high or more labor lines with pay type customer pay on the plan's unit"
      value: "K('unit_service_credit_high')"
    - when: "one or more but fewer than unit_lines_high such lines"
      value: "K('unit_service_credit_low')"
    - when: "otherwise"
      value: "0"
    baseline:
      unit_service_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: service
  baseline:
    rule: >-
      The fleet cancellation refund is the plan's purchase_price times the fleet refund share, rounded half up to the cent, less the fleet cancellation fee.
      The fleet refund share is the plan's unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included, and the fleet cancellation fee is cancellation_fee_usd.
    params: [visits_included, cancellation_fee_usd]
  inputs:
    history:
    - {table: maintenance_plan_ledger, aggregate: sum, field: visits, filters: {event_type: maintenance_visit_redeemed}}
    - {table: maintenance_plan_ledger, aggregate: count, field: visits, within_months: 12, filters: {event_type: maintenance_visit_redeemed}}
    - {category: service, table: service_ro_lines, aggregate: max, field: odometer_in, filters: {}}
    - {category: service, table: service_ro_lines, aggregate: count, field: amount, filters: {event_type: service_labor_charged, pay_type: customer_pay}}
    cross_category: [service, purchase]
- id: maintenance_ext_total_loss_refund
  base_policy_refs: [maintenance_evt_cancellation_refund]
  overwrite:
  - base_policy: maintenance_evt_cancellation_refund
    superseded_clause: >-
      Otherwise the refund follows the plan's refund_method
    replaced_by: >-
      For any Kessler Care plan cancelled because its vehicle is a total loss on a request processed on its own request date, and only for such a plan, this policy replaces the refund that follows the plan's refund_method with the total-loss refund set out here, while the free look and unwound-deal full refunds still take precedence, no cancellation fee is deducted, the refund is computed as of the effective date (the request date), and a refund below 0.00 is still 0.00 with nothing billed; a cancellation for any other reason is outside this policy, and a total-loss cancellation on a request processed on a later day is outside it too and is still refunded by the plan's refund_method with no cancellation fee.
  trigger: state_due
  subject: [maintenance_plan_cancelled, maintenance_visits_cancelled, maintenance_refund_calculated]
  computes: refund_amount
  target_tool: process_total_loss_cancellation_8f67308a
  params:
    loss_unit_months: 12
    loss_plan_months: 12
    courtesy_fleet_good: 25.0
    courtesy_other: 10.0
    bonus_near: 30.0
    bonus_far: 15.0
    relationship_deal: 20.0
    relationship_service: 10.0
  rule: >-
    For any Kessler Care plan cancelled because its vehicle is a total loss on a request processed on its own request date, and only for such a plan, this policy replaces the refund that follows the plan's refund_method with the total-loss refund set out here, while the free look and unwound-deal full refunds still take precedence, no cancellation fee is deducted, the refund is computed as of the effective date (the request date), and a refund below 0.00 is still 0.00 with nothing billed; a cancellation for any other reason is outside this policy, and a total-loss cancellation on a request processed on a later day is outside it too and is still refunded by the plan's refund_method with no cancellation fee.
    Because the request is processed on its request date, every span this policy counts ends on the effective date, which is the day the refund is worked out.
    The total-loss refund is the plan's standard refund rounded half up to the cent.
    The standard refund is, for a plan whose refund_method is pro_rata_unused_visits, purchase_price times its unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included, and, for a plan whose refund_method is retail_value_deduction, purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated).
    Credits that apply are added to the rounded refund, and that sum is then floored at 0.00 and capped at purchase_price, in that order, at the end.
    The total-loss share method looks at the plan's unit and its Kessler purchase deal standing in delivered or closed status: where that deal delivered the unit fewer than loss_unit_months whole months before the effective date, the refund before credits is purchase_price times the average of the unused-visit share and the unused-mile share, rounded half up to the cent, the unused miles being expiration_odometer less the unit's highest recorded reading (the greater of its highest repair-order check-in odometer and its odometer at delivery on that deal), never below 0, over term_miles; otherwise, where the plan was sold fewer than loss_plan_months whole months before the effective date, it is purchase_price times the average of the unused-visit share and the unused-day share, rounded half up to the cent, the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date; otherwise it is the standard refund.
    The total-loss courtesy credit reads the customer's service account: a Commercial Fleet Account (Net 15 or Net 30) with no late fee whose line date falls fewer than 12 whole months before the effective date earns courtesy_fleet_good; a Commercial Fleet Account with such a late fee, or a Kessler Owner Rewards Gold or Platinum account, earns courtesy_other; any other account earns no courtesy credit.
    The replacement purchase bonus counts the vehicle price charges posted on the customer's Kessler vehicle purchase deals, less vehicle price charges reversed: one or more dated fewer than 1 whole month before the effective date earn bonus_near; otherwise one or more dated fewer than 3 whole months before earn bonus_far; none earns no replacement purchase bonus.
    The plan relationship credit reads the plan and its unit: a plan sold on a Kessler vehicle purchase deal earns relationship_deal; a plan bought on its own for a unit with at least one repair-order line at the group earns relationship_service; any other plan earns no plan relationship credit.
    The total-loss refund on a plan is worked out only after the plan stands on a unit whose title the records show branded salvage, rebuilt or flood.
  prerequisite:
  - problem: maintenance_ext_fleet_transfer_odometer
    kind: value_input
    gate: loss_refund
    form: state
    policy_source: >-
      The total-loss refund on a plan is worked out only after the plan stands on a unit whose title the records show branded salvage, rebuilt or flood.
    condition: >-
      The plan carrying the signed total-loss request shows as its vehicle_id a vehicle whose title_brand is salvage, rebuilt or flood.
    resolved_by: move_fleet_plan_badb11fe
    effect: >-
      Once the fleet plan stands on its salvage-titled replacement unit, the share method reads that unit's Kessler delivery, its recorded readings and the re-based expiration odometer, so the refund before credits moves from the standard refund to the visit/mile average, and the relationship credit reads that unit's repair-order lines.
  cross_category:
  - category: purchase
    as: history
    reads: [delivery_date, odometer_at_delivery, vehicle_id, status, purchase_transactions.charge_code, purchase_transactions.event_type]
    note: The share method reads the unit's Kessler deal; the replacement bonus counts vehicle price charges on the customer's deals.
  - category: service
    as: history
    reads: [variant_name, service_ro_lines.odometer_in, service_ro_lines.event_type, service_ro_lines.vehicle_id]
    note: The share method reads the unit's repair-order check-ins; the courtesy credit reads the account tier and late fees; the relationship credit counts the unit's repair-order lines.
  compute:
  - tl_loaded: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visits_loaded')"
  - tl_redeemed: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_redeemed')"
  - tl_reinstated: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_reinstated')"
  - tl_unused: "MX(0, tl_loaded - tl_redeemed + tl_reinstated)"
  - tl_used: "MX(0, tl_redeemed - tl_reinstated)"
  - standard_refund: "(RND(F('purchase_price') * tl_unused / P('visits_included') + 0.000000001, 2) if P('refund_method') == 'pro_rata_unused_visits' else RND(F('purchase_price') - tl_used * P('retail_value_per_visit_usd') + 0.000000001, 2))"
  - loss_unit_delivery: "(CFIELD('purchase', 'delivery_date', vehicle_id=F('vehicle_id'), status='closed') or CFIELD('purchase', 'delivery_date', vehicle_id=F('vehicle_id'), status='delivered'))"
  - loss_unit_delivery_odometer: "float(CFIELD('purchase', 'odometer_at_delivery', vehicle_id=F('vehicle_id'), status='closed') or CFIELD('purchase', 'odometer_at_delivery', vehicle_id=F('vehicle_id'), status='delivered') or 0)"
  - loss_unit_age: "(MONTHS(loss_unit_delivery, NOW) if loss_unit_delivery else 9999)"
  - loss_checkin: "XMAX('service', 'service_ro_lines', 'odometer_in', vehicle_id=F('vehicle_id'))"
  - loss_reading: "MX(loss_checkin, loss_unit_delivery_odometer)"
  - loss_mile_share: "MX(0, F('expiration_odometer') - loss_reading) / P('term_miles')"
  - loss_day_share: "MX(0, DAYS(NOW, F('expiration_date'))) / DAYS(F('sale_date'), F('expiration_date'))"
  - loss_plan_age: "MONTHS(F('sale_date'), NOW)"
  - loss_refund: "(RND(F('purchase_price') * (tl_unused / P('visits_included') + loss_mile_share) / 2 + 0.000000001, 2) if loss_unit_age < K('loss_unit_months') else (RND(F('purchase_price') * (tl_unused / P('visits_included') + loss_day_share) / 2 + 0.000000001, 2) if loss_plan_age < K('loss_plan_months') else standard_refund))"
  - courtesy_tier: "CFIELD('service', 'variant_name')"
  - courtesy_late_fees: "XCOUNT('service', 'service_ro_lines', within_months=12, date_field='line_date', event_type='service_late_fee_charged')"
  - courtesy_credit: "(K('courtesy_fleet_good') if ((courtesy_tier == 'Commercial Fleet Account - Net 30' or courtesy_tier == 'Commercial Fleet Account - Net 15') and courtesy_late_fees == 0) else (K('courtesy_other') if (((courtesy_tier == 'Commercial Fleet Account - Net 30' or courtesy_tier == 'Commercial Fleet Account - Net 15') and courtesy_late_fees > 0) or courtesy_tier == 'Kessler Owner Rewards Gold' or courtesy_tier == 'Kessler Owner Rewards Platinum') else 0))"
  - bonus_recent: "XCOUNT('purchase', 'purchase_transactions', within_months=1, date_field='txn_date', event_type='purchase_charge_posted', charge_code='vehicle_price') - XCOUNT('purchase', 'purchase_transactions', within_months=1, date_field='txn_date', event_type='purchase_charge_reversed', charge_code='vehicle_price')"
  - bonus_earlier: "XCOUNT('purchase', 'purchase_transactions', within_months=3, date_field='txn_date', event_type='purchase_charge_posted', charge_code='vehicle_price') - XCOUNT('purchase', 'purchase_transactions', within_months=3, date_field='txn_date', event_type='purchase_charge_reversed', charge_code='vehicle_price')"
  - purchase_bonus: "(K('bonus_near') if bonus_recent > 0 else (K('bonus_far') if bonus_earlier > 0 else 0))"
  - relationship_lines: "XCOUNT('service', 'service_ro_lines', vehicle_id=F('vehicle_id'))"
  - relationship_credit: "(K('relationship_deal') if F('purchase_deal_id') else (K('relationship_service') if relationship_lines > 0 else 0))"
  - tl_free_look: "(DAYS(F('sale_date'), NOW) <= P('free_look_days') and tl_used == 0)"
  - tl_unwound: "((P('deal_unwind_full_refund') and CFIELD('purchase', 'status', purchase_deal_id=F('purchase_deal_id')) == 'unwound') if F('purchase_deal_id') else False)"
  - result: "(F('purchase_price') if (tl_free_look or tl_unwound) else MN(F('purchase_price'), MX(0, RND(loss_refund + courtesy_credit + purchase_bonus + relationship_credit + 0.000000001, 2))))"
  compute_basis:
    tl_loaded: "purchase_price times its unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included"
    tl_redeemed: "purchase_price times its unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included"
    tl_reinstated: "purchase_price times its unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included"
    tl_used: "purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated)"
    standard_refund: "The standard refund is, for a plan whose refund_method is pro_rata_unused_visits, purchase_price times its unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included, and, for a plan whose refund_method is retail_value_deduction, purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated)."
    loss_unit_delivery: "The total-loss share method looks at the plan's unit and its Kessler purchase deal standing in delivered or closed status"
    loss_unit_delivery_odometer: "the greater of its highest repair-order check-in odometer and its odometer at delivery on that deal"
    loss_unit_age: "where that deal delivered the unit fewer than loss_unit_months whole months before the effective date"
    loss_checkin: "the greater of its highest repair-order check-in odometer and its odometer at delivery on that deal"
    loss_reading: "the unused miles being expiration_odometer less the unit's highest recorded reading (the greater of its highest repair-order check-in odometer and its odometer at delivery on that deal), never below 0, over term_miles"
    loss_mile_share: "the unused miles being expiration_odometer less the unit's highest recorded reading (the greater of its highest repair-order check-in odometer and its odometer at delivery on that deal), never below 0, over term_miles"
    loss_day_share: "the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date"
    loss_plan_age: "where the plan was sold fewer than loss_plan_months whole months before the effective date"
    loss_refund: "The total-loss share method looks at the plan's unit and its Kessler purchase deal standing in delivered or closed status: where that deal delivered the unit fewer than loss_unit_months whole months before the effective date, the refund before credits is purchase_price times the average of the unused-visit share and the unused-mile share, rounded half up to the cent, the unused miles being expiration_odometer less the unit's highest recorded reading (the greater of its highest repair-order check-in odometer and its odometer at delivery on that deal), never below 0, over term_miles; otherwise, where the plan was sold fewer than loss_plan_months whole months before the effective date, it is purchase_price times the average of the unused-visit share and the unused-day share, rounded half up to the cent, the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date; otherwise it is the standard refund."
    courtesy_tier: "The total-loss courtesy credit reads the customer's service account"
    courtesy_late_fees: "with no late fee whose line date falls fewer than 12 whole months before the effective date"
    courtesy_credit: "a Commercial Fleet Account (Net 15 or Net 30) with no late fee whose line date falls fewer than 12 whole months before the effective date earns courtesy_fleet_good; a Commercial Fleet Account with such a late fee, or a Kessler Owner Rewards Gold or Platinum account, earns courtesy_other; any other account earns no courtesy credit."
    bonus_recent: "one or more dated fewer than 1 whole month before the effective date earn bonus_near"
    bonus_earlier: "otherwise one or more dated fewer than 3 whole months before earn bonus_far"
    purchase_bonus: "The replacement purchase bonus counts the vehicle price charges posted on the customer's Kessler vehicle purchase deals, less vehicle price charges reversed: one or more dated fewer than 1 whole month before the effective date earn bonus_near; otherwise one or more dated fewer than 3 whole months before earn bonus_far; none earns no replacement purchase bonus."
    relationship_lines: "a plan bought on its own for a unit with at least one repair-order line at the group earns relationship_service"
    relationship_credit: "The plan relationship credit reads the plan and its unit: a plan sold on a Kessler vehicle purchase deal earns relationship_deal; a plan bought on its own for a unit with at least one repair-order line at the group earns relationship_service; any other plan earns no plan relationship credit."
    tl_free_look: "while the free look and unwound-deal full refunds still take precedence"
    tl_unwound: "while the free look and unwound-deal full refunds still take precedence"
    result: "Credits that apply are added to the rounded refund, and that sum is then floored at 0.00 and capped at purchase_price, in that order, at the end."
  factors:
  - id: loss_share
    effect: method
    decides: loss_refund
    bindings: [loss_unit_delivery, loss_unit_delivery_odometer, loss_unit_age, loss_checkin, loss_reading, loss_mile_share, loss_day_share, loss_plan_age, loss_refund]
    ladder:
    - when: "the plan's unit was delivered on its Kessler deal (delivered or closed) fewer than loss_unit_months whole months before the effective date"
      method: "refund before credits = purchase_price times the average of the unused-visit share and the unused-mile share"
    - when: "the unit was not so delivered, and the plan was sold fewer than loss_plan_months whole months before the effective date"
      method: "refund before credits = purchase_price times the average of the unused-visit share and the unused-day share"
    - when: "otherwise"
      method: "refund before credits = the standard refund"
    baseline:
      loss_refund: "standard_refund"
    evidence: [cross_category, date]
    cross_difficulty: purchase
  - id: loss_courtesy
    effect: parameter
    decides: courtesy_credit
    bindings: [courtesy_tier, courtesy_late_fees, courtesy_credit]
    ladder:
    - when: "Commercial Fleet Account (Net 15 or Net 30) and no late fee fewer than 12 whole months before the effective date"
      value: "K('courtesy_fleet_good')"
    - when: "Commercial Fleet Account with such a late fee, or Kessler Owner Rewards Gold or Platinum"
      value: "K('courtesy_other')"
    - when: "otherwise"
      value: "0"
    baseline:
      courtesy_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: service
  - id: replacement_purchase
    effect: parameter
    decides: purchase_bonus
    bindings: [bonus_recent, bonus_earlier, purchase_bonus]
    ladder:
    - when: "a net vehicle price charge on a Kessler deal dated fewer than 1 whole month before the effective date"
      value: "K('bonus_near')"
    - when: "none within 1 month, but one dated fewer than 3 whole months before"
      value: "K('bonus_far')"
    - when: "otherwise"
      value: "0"
    baseline:
      purchase_bonus: "0"
    evidence: [cross_category, history]
    cross_difficulty: purchase
  - id: plan_relationship
    effect: parameter
