    ladder:
    - when: "the plan was sold on a Kessler vehicle purchase deal"
      value: "K('relationship_deal')"
    - when: "the plan was bought on its own and its unit has at least one repair-order line at the group"
      value: "K('relationship_service')"
    - when: "otherwise"
      value: "0"
    baseline:
