- id: maintenance_ext_fleet_transfer_odometer
  base_policy_refs: [maintenance_evt_fleet_substitution]
  overwrite:
  - base_policy: maintenance_evt_fleet_substitution
    superseded_clause: >-
      its expiration odometer is not reset
    replaced_by: >-
      For a Kessler Care Fleet 12-Visit plan moved, within this policy's scope, onto the unit that replaced its retired unit, and only for such a move, this policy re-bases the expiration odometer as set out here, while the plan still keeps its sale date, expiration date, visits remaining and price, and every other move keeps its expiration odometer.
  trigger: state_due
  subject: [maintenance_vehicle_substituted]
  computes: expiration_odometer
  target_tool: move_fleet_plan_badb11fe
  params:
    transfer_miles_net30: 1000
    transfer_miles_net15: 500
    remaining_visits_high: 6
    remaining_visits_mid: 3
    remaining_miles_high: 3000
    remaining_miles_mid: 1500
    delay_days_near: 30
    delay_days_far: 60
    delay_miles_near: 1000
    delay_miles_far: 2000
  rule: >-
    This policy re-bases a fleet plan whose unit is no longer registered to the customer when the holder names as its replacement the unit delivered on the customer's single Kessler Fleet Vehicle Purchase Agreement that stands in closed status (the replacement unit); a move onto any other unit, or for a customer holding more than one agreement in closed status, is outside this policy.
    For a Kessler Care Fleet 12-Visit plan moved, within this policy's scope, onto the unit that replaced its retired unit, and only for such a move, this policy re-bases the expiration odometer as set out here, while the plan still keeps its sale date, expiration date, visits remaining and price, and every other move keeps its expiration odometer.
    The moved plan's expiration odometer is the replacement unit's starting reading plus the miles left on the plan, in whole miles.
    The miles left are the plan's expiration_odometer less the retired unit's closing reading, never below 0.
    The retired unit's closing reading is the plan's last recorded visit reading, which is the highest odometer on the plan's redemption entries (reinstated or not) or odometer_at_sale where that is higher or there is no such entry, and the replacement unit's starting reading is its odometer at delivery on that agreement.
    Mileage allowances that apply are added to that sum.
    The retired unit's closing reading follows the latest evidence of its use: where the retired unit has a repair-order check-in above the plan's last recorded visit reading, the closing reading is its highest check-in odometer; otherwise, where a claim under the retired unit's Factory Basic Limited Warranty records an odometer above that reading, it is the highest such claim odometer; otherwise it is the plan's last recorded visit reading.
    The replacement unit's starting reading follows its own records: where the replacement has a repair-order check-in, it is the highest check-in odometer; otherwise, where it was delivered by home delivery, it is the odometer at delivery less the delivery distance in miles, never below 0; otherwise it is the odometer at delivery.
    The transfer mileage allowance reads the customer's service account: a Commercial Fleet Account - Net 30 adds transfer_miles_net30; a Commercial Fleet Account - Net 15 adds transfer_miles_net15; any other account adds no transfer mileage allowance.
    The remaining-visit mileage allowance reads the plan's unused visits (visits loaded, less visits redeemed, plus visits reinstated): remaining_visits_high or more add remaining_miles_high; remaining_visits_mid or more but fewer than remaining_visits_high add remaining_miles_mid; fewer add no remaining-visit mileage allowance.
    The booking-delay allowance counts the calendar days from the replacement's delivery date to the day the move is recorded: more than delay_days_far days adds delay_miles_far; more than delay_days_near and up to delay_days_far days adds delay_miles_near; delay_days_near days or fewer adds no booking-delay allowance.
  prerequisite: []
  cross_category:
  - category: purchase
    as: branch
    reads: [vehicle_id, odometer_at_delivery, delivery_method, delivery_distance_miles, delivery_date, status, variant_name]
    note: The starting reading and the booking-delay allowance read the closed Kessler Fleet Vehicle Purchase Agreement that delivered the replacement.
  - category: service
    as: history
    reads: [variant_name, service_ro_lines.odometer_in, service_ro_lines.vehicle_id]
    note: The readings take repair-order check-ins of the retired and replacement units; the transfer allowance reads the account tier.
  - category: warranty
    as: history
    reads: [warranty_coverage_id, vehicle_id, variant_name, warranty_claims.odometer]
    note: The closing reading can take the odometer of a claim under the retired unit's Factory Basic Limited Warranty.
  compute:
  - rep_vehicle: "CFIELD('purchase', 'vehicle_id', variant_name='Fleet Vehicle Purchase Agreement', status='closed')"
  - rep_delivery_odometer: "float(CFIELD('purchase', 'odometer_at_delivery', variant_name='Fleet Vehicle Purchase Agreement', status='closed') or 0)"
  - last_visit_reading: "MX(MAX('maintenance_plan_ledger', 'odometer', event_type='maintenance_visit_redeemed'), float(F('odometer_at_sale')))"
  - closing_checkin: "XMAX('service', 'service_ro_lines', 'odometer_in', vehicle_id=F('vehicle_id'))"
  - closing_basic_coverage: "CFIELD('warranty', 'warranty_coverage_id', vehicle_id=F('vehicle_id'), variant_name='Factory Basic Limited Warranty')"
  - closing_claim: "(XMAX('warranty', 'warranty_claims', 'odometer', warranty_coverage_id=closing_basic_coverage) if closing_basic_coverage else 0)"
  - closing_reading: "(closing_checkin if closing_checkin > last_visit_reading else (closing_claim if closing_claim > last_visit_reading else last_visit_reading))"
  - starting_checkin: "(XMAX('service', 'service_ro_lines', 'odometer_in', vehicle_id=rep_vehicle) if rep_vehicle else 0)"
  - starting_method: "CFIELD('purchase', 'delivery_method', variant_name='Fleet Vehicle Purchase Agreement', status='closed')"
  - starting_distance: "float(CFIELD('purchase', 'delivery_distance_miles', variant_name='Fleet Vehicle Purchase Agreement', status='closed') or 0)"
  - starting_reading: "(starting_checkin if starting_checkin > 0 else (MX(0, rep_delivery_odometer - starting_distance) if starting_method == 'home_delivery' else rep_delivery_odometer))"
  - miles_left: "MX(0, F('expiration_odometer') - closing_reading)"
  - transfer_tier: "CFIELD('service', 'variant_name')"
  - transfer_miles: "(K('transfer_miles_net30') if transfer_tier == 'Commercial Fleet Account - Net 30' else (K('transfer_miles_net15') if transfer_tier == 'Commercial Fleet Account - Net 15' else 0))"
  - remaining_unused: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visits_loaded') - SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_redeemed') + SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_reinstated')"
  - remaining_miles: "(K('remaining_miles_high') if remaining_unused >= K('remaining_visits_high') else (K('remaining_miles_mid') if remaining_unused >= K('remaining_visits_mid') else 0))"
  - delay_delivery_date: "CFIELD('purchase', 'delivery_date', variant_name='Fleet Vehicle Purchase Agreement', status='closed')"
  - delay_days: "(MX(0, DAYS(delay_delivery_date, NOW)) if delay_delivery_date else 0)"
  - delay_miles: "(K('delay_miles_far') if delay_days > K('delay_days_far') else (K('delay_miles_near') if delay_days > K('delay_days_near') else 0))"
  - result: "int(starting_reading + miles_left + transfer_miles + remaining_miles + delay_miles)"
  compute_basis:
    rep_vehicle: "This policy re-bases a fleet plan whose unit is no longer registered to the customer when the holder names as its replacement the unit delivered on the customer's single Kessler Fleet Vehicle Purchase Agreement that stands in closed status (the replacement unit)"
    rep_delivery_odometer: "the replacement unit's starting reading is its odometer at delivery on that agreement."
    last_visit_reading: "The retired unit's closing reading is the plan's last recorded visit reading, which is the highest odometer on the plan's redemption entries (reinstated or not) or odometer_at_sale where that is higher or there is no such entry"
    closing_checkin: "where the retired unit has a repair-order check-in above the plan's last recorded visit reading, the closing reading is its highest check-in odometer"
    closing_basic_coverage: "where a claim under the retired unit's Factory Basic Limited Warranty records an odometer above that reading, it is the highest such claim odometer"
    closing_claim: "where a claim under the retired unit's Factory Basic Limited Warranty records an odometer above that reading, it is the highest such claim odometer"
    closing_reading: "The retired unit's closing reading follows the latest evidence of its use: where the retired unit has a repair-order check-in above the plan's last recorded visit reading, the closing reading is its highest check-in odometer; otherwise, where a claim under the retired unit's Factory Basic Limited Warranty records an odometer above that reading, it is the highest such claim odometer; otherwise it is the plan's last recorded visit reading."
    starting_checkin: "where the replacement has a repair-order check-in, it is the highest check-in odometer"
    starting_method: "where it was delivered by home delivery, it is the odometer at delivery less the delivery distance in miles, never below 0"
    starting_distance: "where it was delivered by home delivery, it is the odometer at delivery less the delivery distance in miles, never below 0"
    starting_reading: "The replacement unit's starting reading follows its own records: where the replacement has a repair-order check-in, it is the highest check-in odometer; otherwise, where it was delivered by home delivery, it is the odometer at delivery less the delivery distance in miles, never below 0; otherwise it is the odometer at delivery."
    miles_left: "The miles left are the plan's expiration_odometer less the retired unit's closing reading, never below 0."
    transfer_tier: "The transfer mileage allowance reads the customer's service account"
    transfer_miles: "a Commercial Fleet Account - Net 30 adds transfer_miles_net30; a Commercial Fleet Account - Net 15 adds transfer_miles_net15; any other account adds no transfer mileage allowance."
    remaining_unused: "The remaining-visit mileage allowance reads the plan's unused visits (visits loaded, less visits redeemed, plus visits reinstated)"
    remaining_miles: "remaining_visits_high or more add remaining_miles_high; remaining_visits_mid or more but fewer than remaining_visits_high add remaining_miles_mid; fewer add no remaining-visit mileage allowance."
    delay_delivery_date: "The booking-delay allowance counts the calendar days from the replacement's delivery date to the day the move is recorded"
    delay_days: "The booking-delay allowance counts the calendar days from the replacement's delivery date to the day the move is recorded"
    delay_miles: "more than delay_days_far days adds delay_miles_far; more than delay_days_near and up to delay_days_far days adds delay_miles_near; delay_days_near days or fewer adds no booking-delay allowance."
    result: "The moved plan's expiration odometer is the replacement unit's starting reading plus the miles left on the plan, in whole miles."
  factors:
  - id: closing_reading_source
    effect: method
    decides: closing_reading
    bindings: [closing_checkin, closing_basic_coverage, closing_claim, closing_reading]
    ladder:
    - when: "the retired unit has a repair-order check-in above the plan's last recorded visit reading"
      method: "closing reading = the retired unit's highest check-in odometer"
    - when: "no such check-in, and a claim under its Factory Basic Limited Warranty records an odometer above that reading"
      method: "closing reading = the highest such claim odometer"
    - when: "otherwise"
      method: "closing reading = the plan's last recorded visit reading"
    baseline:
      closing_reading: "last_visit_reading"
    evidence: [cross_category, history]
    cross_difficulty: service
  - id: starting_reading_source
    effect: method
    decides: starting_reading
    bindings: [starting_checkin, starting_method, starting_distance, starting_reading]
    ladder:
    - when: "the replacement has a repair-order check-in"
      method: "starting reading = the highest check-in odometer"
    - when: "no check-in, and the replacement was delivered by home delivery"
      method: "starting reading = odometer at delivery less the delivery distance, never below 0"
    - when: "otherwise"
      method: "starting reading = odometer at delivery"
    baseline:
      starting_reading: "rep_delivery_odometer"
    evidence: [cross_category, history]
    cross_difficulty: service
  - id: account_transfer_allowance
    effect: parameter
    decides: transfer_miles
    bindings: [transfer_tier, transfer_miles]
    ladder:
    - when: "service account is a Commercial Fleet Account - Net 30"
      value: "K('transfer_miles_net30')"
    - when: "service account is a Commercial Fleet Account - Net 15"
      value: "K('transfer_miles_net15')"
    - when: "otherwise"
      value: "0"
    baseline:
      transfer_miles: "0"
    evidence: [cross_category]
    cross_difficulty: service
  - id: unused_visit_allowance
    effect: parameter
    decides: remaining_miles
    bindings: [remaining_unused, remaining_miles]
    ladder:
    - when: "remaining_visits_high or more unused visits"
      value: "K('remaining_miles_high')"
    - when: "remaining_visits_mid or more but fewer than remaining_visits_high unused visits"
      value: "K('remaining_miles_mid')"
    - when: "otherwise"
      value: "0"
    baseline:
      remaining_miles: "0"
    evidence: [history]
    cross_difficulty: null
  - id: booking_delay
    effect: parameter
    decides: delay_miles
    bindings: [delay_delivery_date, delay_days, delay_miles]
    ladder:
    - when: "the replacement was delivered more than delay_days_far calendar days before the move is recorded"
      value: "K('delay_miles_far')"
    - when: "delivered more than delay_days_near and up to delay_days_far days before"
      value: "K('delay_miles_near')"
    - when: "otherwise"
      value: "0"
    baseline:
      delay_miles: "0"
    evidence: [cross_category, date]
    cross_difficulty: purchase
  baseline:
    rule: >-
      The moved plan's expiration odometer is the replacement unit's starting reading plus the miles left on the plan, in whole miles.
      The miles left are the plan's expiration_odometer less the retired unit's closing reading, never below 0.
      The retired unit's closing reading is the plan's last recorded visit reading, which is the highest odometer on the plan's redemption entries (reinstated or not) or odometer_at_sale where that is higher or there is no such entry, and the replacement unit's starting reading is its odometer at delivery on that agreement.
    params: []
  inputs:
    history:
    - {table: maintenance_plan_ledger, aggregate: max, field: odometer, filters: {event_type: maintenance_visit_redeemed}}
    - {table: maintenance_plan_ledger, aggregate: sum, field: visits, filters: {event_type: maintenance_visit_redeemed}}
    - {category: service, table: service_ro_lines, aggregate: max, field: odometer_in, filters: {}}
    cross_category: [purchase, service, warranty]
- id: maintenance_ext_retail_plan_price
  base_policy_refs: [maintenance_evt_sale, maintenance_agg_multi_holding, maintenance_agg_fleet_volume]
  overwrite:
  - base_policy: maintenance_evt_sale
    superseded_clause: >-
      a plan bought on its own is priced at plan_price_usd and is offered only where standalone_sale_allowed is true
    replaced_by: >-
      For a replacement purchase within this policy's scope, and only for such a purchase, this policy replaces its price with the retail plan price set out here, while the plan is still offered only where standalone_sale_allowed is true, every other retail plan bought on its own is still priced at plan_price_usd, and a fleet addendum is outside this policy.
  trigger: on_request
  subject: [maintenance_plan_sold]
  computes: purchase_price
  target_tool: sign_care_plan_contract_c0d53aa0
  params:
    rewards_rate_platinum: 0.06
    rewards_rate_gold: 0.04
    rewards_rate_silver: 0.02
    owner_days_near: 30
    owner_days_far: 90
    owner_allowance_near: 30.0
    owner_allowance_far: 15.0
    trade_credit_with_deal: 50.0
    trade_credit_without_deal: 25.0
  rule: >-
    This policy prices a replacement purchase: a Kessler Care Essentials, Plus or Premium plan bought on its own for the vehicle on the customer's single Kessler vehicle purchase deal that stands in delivered status (the vehicle being covered), carrying the same plan name as the replaced plan; the replaced plan is the Essentials, Plus or Premium plan named on the customer's most recent signed cancellation request for a vehicle sold or traded (by request date), and where two such requests share that most recent date, or there is none, the purchase is not a replacement purchase; any other retail plan bought on its own is outside this policy.
    For a replacement purchase within this policy's scope, and only for such a purchase, this policy replaces its price with the retail plan price set out here, while the plan is still offered only where standalone_sale_allowed is true, every other retail plan bought on its own is still priced at plan_price_usd, and a fleet addendum is outside this policy.
    The pricing date is the day the plan is signed, and every plan parameter named here is that of the plan name bought.
    A replacement purchase is priced from the retail basis price, which is the plan's plan_price_usd.
    The retail plan price is that retail basis price rounded half up to the cent.
    Where a rate applies to the plan it reduces the retail basis price once; credits that apply are then added together and subtracted from that reduced price; a result below 0.00 is 0.00, so the credits never make the price negative; the retail plan price is rounded half up to the cent only at the end.
    The retail basis price follows the factory maintenance coverage of the vehicle being covered, because plan visits are not used while that coverage pays: where the vehicle has an active Factory Complimentary Maintenance coverage with a mileage limit, the retail basis price is plan_price_usd times the greater of the plan's term months left after that coverage ends (term_months less the whole months from the pricing date to the coverage's expiration_date, never below 0) over term_months and the plan's term miles left after that coverage ends (term_miles less the coverage's expiration_odometer minus the vehicle's odometer at delivery on its deal, never below 0) over term_miles; where the vehicle has an active Factory Complimentary Maintenance coverage with no mileage limit (expiration_odometer 0), it is plan_price_usd times the term months left after that coverage ends over term_months; where it has no active Factory Complimentary Maintenance coverage, it is plan_price_usd.
    The Owner Rewards rate reads the customer's service account: Kessler Owner Rewards Platinum takes rewards_rate_platinum; Kessler Owner Rewards Gold takes rewards_rate_gold; Kessler Owner Rewards Silver takes rewards_rate_silver; any other account takes no Owner Rewards rate.
    The new-owner enrollment allowance counts the calendar days from the delivery date on the deal of the vehicle being covered to the pricing date: owner_days_near days or fewer earns owner_allowance_near; more than owner_days_near and up to owner_days_far days earns owner_allowance_far; a longer span earns no new-owner enrollment allowance.
    The trade-cycle credit reads the replaced plan's cancellation entries dated fewer than 3 whole months before the pricing date together with how the replaced plan was bought: a cancellation entry for a vehicle sold or traded on a replaced plan that was sold on a Kessler vehicle purchase deal earns trade_credit_with_deal; such an entry on a replaced plan bought on its own earns trade_credit_without_deal; no such entry earns no trade-cycle credit.
    The retail plan price is fixed only after every Kessler Care Essentials, Plus or Premium plan of the customer that carries a signed cancellation request for a vehicle sold or traded stands cancelled.
    The plan is written for the store on the deal of the vehicle being covered, with no purchase deal attached, not financed and with no lienholder; it is dated the day it is signed, its term ends at the sale date plus term_months calendar months and at the odometer at signing plus term_miles, and visits_included visits are loaded.
  prerequisite:
  - problem: maintenance_ext_retail_cancel_refund
    kind: value_input
    gate: trade_credit
    form: state
    policy_source: >-
      The retail plan price is fixed only after every Kessler Care Essentials, Plus or Premium plan of the customer that carries a signed cancellation request for a vehicle sold or traded stands cancelled.
    condition: >-
      Every Essentials, Plus or Premium plan of the customer with a maintenance_cancellation_requests row whose cancel_reason is vehicle_sold_or_traded shows status cancelled, with a maintenance_visits_cancelled entry carrying cancel_reason vehicle_sold_or_traded.
    resolved_by: process_care_plan_cancellation_e800fe25
    effect: >-
      Once the retail cancellation is booked, the replaced plan's ledger carries a maintenance_visits_cancelled entry with cancel_reason vehicle_sold_or_traded inside the window, so the trade-cycle credit binding moves from 0.00 to trade_credit_with_deal.
  cross_category:
  - category: purchase
    as: branch
    reads: [vehicle_id, delivery_date, odometer_at_delivery, status]
    note: The basis and new-owner factors read the deal in delivered status of the vehicle being covered; the trade-cycle credit reads the replaced plan's own Kessler deal.
  - category: warranty
    as: branch
    reads: [variant_name, status, vehicle_id, expiration_date, expiration_odometer]
    note: The basis factor reads the covered vehicle's active Factory Complimentary Maintenance coverage, its expiration date and mileage.
  - category: service
    as: branch
    reads: [variant_name]
    note: The Owner Rewards rate reads the tier of the customer's service account.
  compute:
  - retail_vehicle: "CFIELD('purchase', 'vehicle_id', status='delivered')"
  - retail_vehicle_odometer: "float(CFIELD('purchase', 'odometer_at_delivery', status='delivered') or 0)"
  - retail_fcm_expiry: "(CFIELD('warranty', 'expiration_date', vehicle_id=retail_vehicle, variant_name='Factory Complimentary Maintenance', status='active') if retail_vehicle else None)"
  - retail_fcm_odometer: "(float(CFIELD('warranty', 'expiration_odometer', vehicle_id=retail_vehicle, variant_name='Factory Complimentary Maintenance', status='active') or 0) if retail_fcm_expiry else 0)"
  - retail_months_share: "(MX(0, P('term_months') - MX(0, MONTHS(NOW, retail_fcm_expiry))) / P('term_months') if retail_fcm_expiry else 1)"
  - retail_miles_share: "(MX(0, P('term_miles') - MX(0, retail_fcm_odometer - retail_vehicle_odometer)) / P('term_miles') if retail_fcm_odometer > 0 else 0)"
  - retail_basis_price: "((P('plan_price_usd') * MX(retail_months_share, retail_miles_share)) if (retail_fcm_expiry and retail_fcm_odometer > 0) else ((P('plan_price_usd') * retail_months_share) if retail_fcm_expiry else P('plan_price_usd')))"
  - rewards_tier: "CFIELD('service', 'variant_name')"
  - rewards_rate: "(K('rewards_rate_platinum') if rewards_tier == 'Kessler Owner Rewards Platinum' else (K('rewards_rate_gold') if rewards_tier == 'Kessler Owner Rewards Gold' else (K('rewards_rate_silver') if rewards_tier == 'Kessler Owner Rewards Silver' else 0)))"
  - owner_delivery_date: "CFIELD('purchase', 'delivery_date', status='delivered')"
  - owner_days: "(MX(0, DAYS(owner_delivery_date, NOW)) if owner_delivery_date else 99999)"
  - owner_allowance: "(K('owner_allowance_near') if owner_days <= K('owner_days_near') else (K('owner_allowance_far') if owner_days <= K('owner_days_far') else 0))"
  - trade_cancellations: "COUNT('maintenance_plan_ledger', within_months=3, date_field='entry_date', event_type='maintenance_visits_cancelled', cancel_reason='vehicle_sold_or_traded')"
  - trade_deal: "((CFIELD('purchase', 'deal_number', purchase_deal_id=F('purchase_deal_id')) or '') != '') if F('purchase_deal_id') else False"
  - trade_credit: "(K('trade_credit_with_deal') if (trade_cancellations > 0 and trade_deal) else (K('trade_credit_without_deal') if (trade_cancellations > 0 and not trade_deal) else 0))"
  - credit_total: "owner_allowance + trade_credit"
  - result: "RND(MX(0, retail_basis_price * (1 - rewards_rate) - credit_total) + 0.000000001, 2)"
  compute_basis:
    retail_vehicle: "This policy prices a replacement purchase: a Kessler Care Essentials, Plus or Premium plan bought on its own for the vehicle on the customer's single Kessler vehicle purchase deal that stands in delivered status (the vehicle being covered)"
    retail_vehicle_odometer: "term_miles less the coverage's expiration_odometer minus the vehicle's odometer at delivery on its deal, never below 0"
    retail_fcm_expiry: "where the vehicle has an active Factory Complimentary Maintenance coverage with a mileage limit"
    retail_fcm_odometer: "where the vehicle has an active Factory Complimentary Maintenance coverage with no mileage limit (expiration_odometer 0)"
    retail_months_share: "term_months less the whole months from the pricing date to the coverage's expiration_date, never below 0"
    retail_miles_share: "term_miles less the coverage's expiration_odometer minus the vehicle's odometer at delivery on its deal, never below 0"
    retail_basis_price: "The retail basis price follows the factory maintenance coverage of the vehicle being covered, because plan visits are not used while that coverage pays: where the vehicle has an active Factory Complimentary Maintenance coverage with a mileage limit, the retail basis price is plan_price_usd times the greater of the plan's term months left after that coverage ends (term_months less the whole months from the pricing date to the coverage's expiration_date, never below 0) over term_months and the plan's term miles left after that coverage ends (term_miles less the coverage's expiration_odometer minus the vehicle's odometer at delivery on its deal, never below 0) over term_miles; where the vehicle has an active Factory Complimentary Maintenance coverage with no mileage limit (expiration_odometer 0), it is plan_price_usd times the term months left after that coverage ends over term_months; where it has no active Factory Complimentary Maintenance coverage, it is plan_price_usd."
    rewards_tier: "The Owner Rewards rate reads the customer's service account"
    rewards_rate: "Kessler Owner Rewards Platinum takes rewards_rate_platinum; Kessler Owner Rewards Gold takes rewards_rate_gold; Kessler Owner Rewards Silver takes rewards_rate_silver; any other account takes no Owner Rewards rate."
    owner_delivery_date: "The new-owner enrollment allowance counts the calendar days from the delivery date on the deal of the vehicle being covered to the pricing date"
    owner_days: "The new-owner enrollment allowance counts the calendar days from the delivery date on the deal of the vehicle being covered to the pricing date"
    owner_allowance: "owner_days_near days or fewer earns owner_allowance_near; more than owner_days_near and up to owner_days_far days earns owner_allowance_far; a longer span earns no new-owner enrollment allowance."
    trade_cancellations: "The trade-cycle credit reads the replaced plan's cancellation entries dated fewer than 3 whole months before the pricing date together with how the replaced plan was bought"
    trade_deal: "a cancellation entry for a vehicle sold or traded on a replaced plan that was sold on a Kessler vehicle purchase deal earns trade_credit_with_deal"
    trade_credit: "a cancellation entry for a vehicle sold or traded on a replaced plan that was sold on a Kessler vehicle purchase deal earns trade_credit_with_deal; such an entry on a replaced plan bought on its own earns trade_credit_without_deal; no such entry earns no trade-cycle credit."
    credit_total: "credits that apply are then added together and subtracted from that reduced price"
    result: "Where a rate applies to the plan it reduces the retail basis price once; credits that apply are then added together and subtracted from that reduced price; a result below 0.00 is 0.00, so the credits never make the price negative; the retail plan price is rounded half up to the cent only at the end."
  factors:
  - id: retail_basis
    effect: method
    decides: retail_basis_price
    bindings: [retail_vehicle, retail_vehicle_odometer, retail_fcm_expiry, retail_fcm_odometer, retail_months_share, retail_miles_share, retail_basis_price]
    ladder:
    - when: "the vehicle being covered has an active Factory Complimentary Maintenance coverage with a mileage limit"
      method: "retail basis price = plan_price_usd times the greater of the term-months share and the term-miles share left after the factory coverage ends"
    - when: "the vehicle has an active Factory Complimentary Maintenance coverage with no mileage limit"
      method: "retail basis price = plan_price_usd times the term-months share left after the factory coverage ends"
    - when: "otherwise"
      method: "retail basis price = plan_price_usd"
    baseline:
      retail_basis_price: "P('plan_price_usd')"
    evidence: [cross_category, date]
    cross_difficulty: warranty
  - id: owner_rewards
    effect: parameter
    decides: rewards_rate
    bindings: [rewards_tier, rewards_rate]
    ladder:
    - when: "Kessler Owner Rewards Platinum"
      value: "K('rewards_rate_platinum')"
    - when: "Kessler Owner Rewards Gold"
      value: "K('rewards_rate_gold')"
    - when: "Kessler Owner Rewards Silver"
      value: "K('rewards_rate_silver')"
    - when: "otherwise"
      value: "0"
    baseline:
      rewards_rate: "0"
    evidence: [cross_category]
    cross_difficulty: service
  - id: new_owner_enrollment
    effect: parameter
    decides: owner_allowance
    bindings: [owner_delivery_date, owner_days, owner_allowance]
    ladder:
    - when: "the vehicle was delivered owner_days_near calendar days or fewer before the pricing date"
      value: "K('owner_allowance_near')"
    - when: "delivered more than owner_days_near and up to owner_days_far days before"
      value: "K('owner_allowance_far')"
    - when: "otherwise"
      value: "0"
    baseline:
      owner_allowance: "0"
    evidence: [cross_category, date]
    cross_difficulty: purchase
  - id: trade_cycle
    effect: parameter
    decides: trade_credit
    bindings: [trade_cancellations, trade_deal, trade_credit]
    ladder:
    - when: "a cancellation entry of the replaced plan for a vehicle sold or traded dated fewer than 3 whole months before the pricing date, and the replaced plan was sold on a Kessler vehicle purchase deal"
      value: "K('trade_credit_with_deal')"
    - when: "such a cancellation entry, and the replaced plan was bought on its own"
      value: "K('trade_credit_without_deal')"
    - when: "otherwise"
      value: "0"
    baseline:
      trade_credit: "0"
    evidence: [history, cross_category]
    cross_difficulty: purchase
  baseline:
    rule: >-
      A replacement purchase is priced from the retail basis price, which is the plan's plan_price_usd.
      The retail plan price is that retail basis price rounded half up to the cent.
    params: [plan_price_usd]
  inputs:
    history:
    - {table: maintenance_plan_ledger, aggregate: count, field: visits, within_months: 3, filters: {event_type: maintenance_visits_cancelled, cancel_reason: vehicle_sold_or_traded}}
    cross_category: [purchase, warranty, service]
- id: maintenance_ext_retail_cancel_refund
  base_policy_refs: [maintenance_evt_cancellation_refund]
  overwrite:
  - base_policy: maintenance_evt_cancellation_refund
    superseded_clause: >-
      under retail_value_deduction it is purchase_price less retail_value_per_visit_usd for each visit used, less cancellation_fee_usd
    replaced_by: >-
      For a Kessler Care Essentials, Plus or Premium plan cancelled for a reason other than a total loss on a request processed on its own request date, and only for such a plan, this policy replaces the retail-value refund of the refund method with the retail cancellation refund set out here, while the free look and unwound-deal full refunds still take precedence, the refund is still computed as of the effective date (the request date), and a refund below 0.00 is still 0.00 with nothing billed; a fleet plan and a total-loss cancellation are outside this policy, and a retail plan cancelled on a request processed on a later day is outside it too and is still refunded purchase_price less retail_value_per_visit_usd for each visit used, less cancellation_fee_usd.
  trigger: state_due
  subject: [maintenance_plan_cancelled, maintenance_visits_cancelled, maintenance_refund_calculated]
  computes: refund_amount
  target_tool: process_care_plan_cancellation_e800fe25
  params:
    retail_fee_waived: 0.0
    retail_fee_reduced: 35.0
    bundle_months_full: 24
    bundle_months_partial: 48
    bundle_rate_full: 1.0
    bundle_rate_partial: 0.4
    rewards_credit_platinum: 30.0
    rewards_credit_gold: 20.0
    rewards_credit_silver: 10.0
  rule: >-
    For a Kessler Care Essentials, Plus or Premium plan cancelled for a reason other than a total loss on a request processed on its own request date, and only for such a plan, this policy replaces the retail-value refund of the refund method with the retail cancellation refund set out here, while the free look and unwound-deal full refunds still take precedence, the refund is still computed as of the effective date (the request date), and a refund below 0.00 is still 0.00 with nothing billed; a fleet plan and a total-loss cancellation are outside this policy, and a retail plan cancelled on a request processed on a later day is outside it too and is still refunded purchase_price less retail_value_per_visit_usd for each visit used, less cancellation_fee_usd.
    Because the request is processed on its request date, every span this policy counts ends on the effective date, which is the day the refund is worked out.
    The retail cancellation refund starts from the retail-value amount, which is purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated), and the retail cancellation fee of cancellation_fee_usd is deducted from it.
    The fee and any deductions that apply are subtracted from the refund amount and credits that apply are added to it; the retail cancellation refund is rounded half up to the cent and floored at 0.00 at the end, and a free look or unwound-deal refund replaces the whole computation.
    The retail refund method looks at how the plan was paid for and how much of its term has run: a plan financed on the vehicle's installment contract refunds pro rata, purchase_price times its unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included, rounded half up to the cent; a plan not so financed whose term has more than half run (more calendar days from sale_date to the effective date than from the effective date to expiration_date) refunds the lesser of the retail-value amount and purchase_price times the unused-day share (the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date), rounded half up to the cent; any other plan refunds the retail-value amount.
    The retail cancellation fee follows the customer's latest vehicle purchase with the group: where a vehicle price charge (net of vehicle price charges reversed) is posted on one of the customer's Kessler vehicle purchase deals fewer than 1 whole month before the effective date, the fee is retail_fee_waived; otherwise, where one is posted fewer than 3 whole months before, the fee is retail_fee_reduced; otherwise the fee is cancellation_fee_usd.
    The bundle discount recapture rate applies to a plan sold on a Kessler vehicle purchase deal below plan_price_usd and counts the whole months from sale_date to the effective date: fewer than bundle_months_full months takes bundle_rate_full; bundle_months_full months or more but fewer than bundle_months_partial takes bundle_rate_partial; a longer time in force, or a plan not sold below plan_price_usd on a deal, takes no recapture; the recapture deducted is that rate times the difference between plan_price_usd and purchase_price, rounded half up to the cent.
    The Owner Rewards refund credit reads the customer's service account: Kessler Owner Rewards Platinum earns rewards_credit_platinum; Kessler Owner Rewards Gold earns rewards_credit_gold; Kessler Owner Rewards Silver earns rewards_credit_silver; any other account earns no Owner Rewards refund credit.
  prerequisite: []
  cross_category:
  - category: purchase
    as: history
    reads: [status, purchase_transactions.charge_code, purchase_transactions.event_type, purchase_transactions.txn_date]
    note: The fee factor counts vehicle price charges on the customer's deals; the unwound-deal test reads the plan's deal status.
  - category: service
    as: branch
    reads: [variant_name]
    note: The Owner Rewards refund credit reads the service account tier.
  compute:
  - rv_redeemed: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_redeemed')"
  - rv_reinstated: "SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_reinstated')"
  - rv_used: "MX(0, rv_redeemed - rv_reinstated)"
  - retail_value_amount: "F('purchase_price') - rv_used * P('retail_value_per_visit_usd')"
  - basis_unused: "MX(0, SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visits_loaded') - SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_redeemed') + SUM('maintenance_plan_ledger', 'visits', event_type='maintenance_visit_reinstated'))"
  - basis_days_run: "DAYS(F('sale_date'), NOW)"
  - basis_days_left: "MX(0, DAYS(NOW, F('expiration_date')))"
  - basis_day_amount: "RND(F('purchase_price') * basis_days_left / DAYS(F('sale_date'), F('expiration_date')) + 0.000000001, 2)"
  - method_amount: "(RND(F('purchase_price') * basis_unused / P('visits_included') + 0.000000001, 2) if F('financed_on_contract') == 'true' else (MN(retail_value_amount, basis_day_amount) if basis_days_run > basis_days_left else retail_value_amount))"
  - fee_recent: "XCOUNT('purchase', 'purchase_transactions', within_months=1, date_field='txn_date', event_type='purchase_charge_posted', charge_code='vehicle_price') - XCOUNT('purchase', 'purchase_transactions', within_months=1, date_field='txn_date', event_type='purchase_charge_reversed', charge_code='vehicle_price')"
  - fee_earlier: "XCOUNT('purchase', 'purchase_transactions', within_months=3, date_field='txn_date', event_type='purchase_charge_posted', charge_code='vehicle_price') - XCOUNT('purchase', 'purchase_transactions', within_months=3, date_field='txn_date', event_type='purchase_charge_reversed', charge_code='vehicle_price')"
  - retail_fee: "(K('retail_fee_waived') if fee_recent > 0 else (K('retail_fee_reduced') if fee_earlier > 0 else P('cancellation_fee_usd')))"
  - bundle_months: "MONTHS(F('sale_date'), NOW)"
  - bundle_rate: "(K('bundle_rate_full') if (F('purchase_deal_id') and F('purchase_price') < P('plan_price_usd') and bundle_months < K('bundle_months_full')) else (K('bundle_rate_partial') if (F('purchase_deal_id') and F('purchase_price') < P('plan_price_usd') and bundle_months < K('bundle_months_partial')) else 0))"
  - bundle_recapture: "RND(bundle_rate * (P('plan_price_usd') - F('purchase_price')) + 0.000000001, 2)"
  - rewards_tier: "CFIELD('service', 'variant_name')"
  - rewards_credit: "(K('rewards_credit_platinum') if rewards_tier == 'Kessler Owner Rewards Platinum' else (K('rewards_credit_gold') if rewards_tier == 'Kessler Owner Rewards Gold' else (K('rewards_credit_silver') if rewards_tier == 'Kessler Owner Rewards Silver' else 0)))"
  - rv_free_look: "(DAYS(F('sale_date'), NOW) <= P('free_look_days') and rv_used == 0)"
  - rv_unwound: "((P('deal_unwind_full_refund') and CFIELD('purchase', 'status', purchase_deal_id=F('purchase_deal_id')) == 'unwound') if F('purchase_deal_id') else False)"
  - result: "(F('purchase_price') if (rv_free_look or rv_unwound) else MX(0, RND(method_amount - retail_fee - bundle_recapture + rewards_credit + 0.000000001, 2)))"
  compute_basis:
    rv_redeemed: "which is purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated)"
    rv_reinstated: "which is purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated)"
    rv_used: "which is purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated)"
    retail_value_amount: "The retail cancellation refund starts from the retail-value amount, which is purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated), and the retail cancellation fee of cancellation_fee_usd is deducted from it."
    basis_unused: "purchase_price times its unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included, rounded half up to the cent"
    basis_days_run: "a plan not so financed whose term has more than half run (more calendar days from sale_date to the effective date than from the effective date to expiration_date)"
    basis_days_left: "a plan not so financed whose term has more than half run (more calendar days from sale_date to the effective date than from the effective date to expiration_date)"
    basis_day_amount: "purchase_price times the unused-day share (the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date), rounded half up to the cent"
    method_amount: "The retail refund method looks at how the plan was paid for and how much of its term has run: a plan financed on the vehicle's installment contract refunds pro rata, purchase_price times its unused visits (visits loaded, less visits redeemed, plus visits reinstated) divided by visits_included, rounded half up to the cent; a plan not so financed whose term has more than half run (more calendar days from sale_date to the effective date than from the effective date to expiration_date) refunds the lesser of the retail-value amount and purchase_price times the unused-day share (the calendar days from the effective date to expiration_date over the calendar days from sale_date to expiration_date), rounded half up to the cent; any other plan refunds the retail-value amount."
    fee_recent: "where a vehicle price charge (net of vehicle price charges reversed) is posted on one of the customer's Kessler vehicle purchase deals fewer than 1 whole month before the effective date, the fee is retail_fee_waived"
    fee_earlier: "otherwise, where one is posted fewer than 3 whole months before, the fee is retail_fee_reduced"
    retail_fee: "The retail cancellation fee follows the customer's latest vehicle purchase with the group: where a vehicle price charge (net of vehicle price charges reversed) is posted on one of the customer's Kessler vehicle purchase deals fewer than 1 whole month before the effective date, the fee is retail_fee_waived; otherwise, where one is posted fewer than 3 whole months before, the fee is retail_fee_reduced; otherwise the fee is cancellation_fee_usd."
    bundle_months: "counts the whole months from sale_date to the effective date"
    bundle_rate: "The bundle discount recapture rate applies to a plan sold on a Kessler vehicle purchase deal below plan_price_usd and counts the whole months from sale_date to the effective date: fewer than bundle_months_full months takes bundle_rate_full; bundle_months_full months or more but fewer than bundle_months_partial takes bundle_rate_partial; a longer time in force, or a plan not sold below plan_price_usd on a deal, takes no recapture"
    bundle_recapture: "the recapture deducted is that rate times the difference between plan_price_usd and purchase_price, rounded half up to the cent."
    rewards_tier: "The Owner Rewards refund credit reads the customer's service account"
    rewards_credit: "Kessler Owner Rewards Platinum earns rewards_credit_platinum; Kessler Owner Rewards Gold earns rewards_credit_gold; Kessler Owner Rewards Silver earns rewards_credit_silver; any other account earns no Owner Rewards refund credit."
    rv_free_look: "while the free look and unwound-deal full refunds still take precedence"
    rv_unwound: "while the free look and unwound-deal full refunds still take precedence"
    result: "The fee and any deductions that apply are subtracted from the refund amount and credits that apply are added to it; the retail cancellation refund is rounded half up to the cent and floored at 0.00 at the end, and a free look or unwound-deal refund replaces the whole computation."
  factors:
  - id: retail_refund_basis
    effect: method
    decides: method_amount
    bindings: [basis_unused, basis_days_run, basis_days_left, basis_day_amount, method_amount]
    ladder:
    - when: "the plan was financed on the vehicle's installment contract"
      method: "refund amount = purchase_price times unused visits divided by visits_included (pro rata)"
    - when: "the plan was not so financed and its term has more than half run"
      method: "refund amount = the lesser of the retail-value amount and purchase_price times the unused-day share"
    - when: "otherwise"
      method: "refund amount = the retail-value amount"
    baseline:
      method_amount: "retail_value_amount"
    evidence: [history, date]
    cross_difficulty: null
  - id: trade_up_fee
    effect: parameter
    decides: retail_fee
    bindings: [fee_recent, fee_earlier, retail_fee]
    ladder:
    - when: "a net vehicle price charge on one of the customer's Kessler deals dated fewer than 1 whole month before the effective date"
      value: "K('retail_fee_waived')"
    - when: "none within 1 month, but one dated fewer than 3 whole months before"
      value: "K('retail_fee_reduced')"
    - when: "otherwise"
      value: "P('cancellation_fee_usd')"
    baseline:
      retail_fee: "P('cancellation_fee_usd')"
    evidence: [cross_category, history]
    cross_difficulty: purchase
  - id: bundle_recapture_rate
    effect: parameter
    decides: bundle_rate
    bindings: [bundle_months, bundle_rate]
    ladder:
    - when: "plan sold on a deal below plan_price_usd and in force fewer than bundle_months_full whole months"
      value: "K('bundle_rate_full')"
    - when: "plan sold on a deal below plan_price_usd and in force bundle_months_full or more but fewer than bundle_months_partial whole months"
      value: "K('bundle_rate_partial')"
    - when: "otherwise"
      value: "0"
    baseline:
      bundle_rate: "0"
    evidence: [date]
    cross_difficulty: null
  - id: rewards_refund
    effect: parameter
    decides: rewards_credit
    bindings: [rewards_tier, rewards_credit]
    ladder:
    - when: "Kessler Owner Rewards Platinum"
      value: "K('rewards_credit_platinum')"
    - when: "Kessler Owner Rewards Gold"
      value: "K('rewards_credit_gold')"
    - when: "Kessler Owner Rewards Silver"
      value: "K('rewards_credit_silver')"
    - when: "otherwise"
      value: "0"
    baseline:
      rewards_credit: "0"
    evidence: [cross_category]
    cross_difficulty: service
  baseline:
    rule: >-
      The retail cancellation refund starts from the retail-value amount, which is purchase_price less retail_value_per_visit_usd for each visit used (visits redeemed less visits reinstated), and the retail cancellation fee of cancellation_fee_usd is deducted from it.
    params: [retail_value_per_visit_usd, cancellation_fee_usd]
  inputs:
    history:
    - {table: maintenance_plan_ledger, aggregate: sum, field: visits, filters: {event_type: maintenance_visit_redeemed}}
    - {category: purchase, table: purchase_transactions, aggregate: count, field: amount, within_months: 3, filters: {event_type: purchase_charge_posted, charge_code: vehicle_price}}
    cross_category: [purchase, service]
