category: maintenance
display_name: Kessler Care Prepaid Maintenance Plans
binding:
  holding_table: maintenance_plans
  event_tables: [maintenance_plan_ledger]
  intake_tables: [maintenance_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {visits_remaining: plan_visits, refund_due_balance: cancellation_refund_due}
lifecycle: {states: [active, fulfilled, expired, cancelled], transitions: [{from: active, to: fulfilled, by: system, means: The last included visit is redeemed and the plan is used up.}, {from: active, to: expired, by: system, means: The plan term ends by date or by mileage with visits unused.}, {from: active, to: cancelled, by: user, means: The plan holder cancels the plan by a signed cancellation request.}]}
accounts:
- key: plan_visits
  unit: visits
  meaning: Prepaid maintenance visits still available on one plan; loaded at sale and reinstatement, used by redemption, expiry and cancellation.
- key: cancellation_refund_due
  unit: USD
  meaning: Cancellation refund computed for one plan and not yet paid out; raised when the refund is calculated and reduced when it is paid.
parameter_schema:
  plan_price_usd: Retail price of the plan before any bundle or fleet volume discount, USD.
  visits_included: Number of maintenance visits the plan includes.
  term_months: Plan term in months from the sale date.
  term_miles: Plan term in miles beyond the odometer at sale.
  service_interval_miles: Miles between scheduled plan visits.
  interval_tolerance_miles: Miles before the next interval at which a visit is still accepted.
  min_days_between_visits: Fewest calendar days between two redeemed visits when the mileage interval has not been reached.
  oil_type: Engine oil included in each visit (conventional_or_blend / full_synthetic).
  oil_quarts_included: Quarts of oil included per visit.
  extra_quart_charge_usd: Customer-pay charge per quart beyond the included quarts, USD.
  synthetic_upgrade_surcharge_usd: Customer-pay surcharge when a full synthetic oil is required or requested on a conventional plan, USD.
  tire_rotation_included: Switch (true/false) — whether each visit includes a tire rotation.
  multipoint_inspection_included: Switch (true/false) — whether each visit includes a multi-point inspection.
  battery_test_included: Switch (true/false) — whether each visit includes a battery test.
  fluid_topoff_included: Switch (true/false) — whether each visit includes fluid top-off.
  cabin_filter_included_visits: List of visit numbers at which a cabin air filter is included.
  engine_air_filter_included_visits: List of visit numbers at which an engine air filter is included.
  wiper_blades_included_visits: List of visit numbers at which front wiper blades are included.
  brake_fluid_service_included: Switch (true/false) — whether one brake fluid exchange is included during the term.
  coolant_service_included: Switch (true/false) — whether one coolant exchange is included during the term.
  tire_balance_included: Switch (true/false) — whether tire balancing is included with each rotation.
  alignment_check_included: Switch (true/false) — whether an alignment check is included once a year.
  car_wash_included: Switch (true/false) — whether each visit includes a complimentary wash.
  honoring_store_scope: Where visits are honored (selling_store_only / all_group_stores).
  expiration_grace_days: Calendar days after the expiration date during which a visit booked before expiration is still honored.
  expiration_grace_miles: Miles beyond the expiration odometer within which a visit is still honored.
  eligible_vehicle_conditions: List of vehicle_condition values the plan may be sold on.
  max_vehicle_age_years: Greatest vehicle age at sale (sale year minus model year).
  max_odometer_at_sale: Greatest odometer at sale.
  diesel_eligible: Switch (true/false) — whether diesel-engine vehicles may be covered.
  standalone_sale_allowed: Switch (true/false) — whether the plan may be bought without a vehicle purchase deal.
  bundled_with_purchase_discount_pct: Discount on the plan price when sold on the vehicle's purchase deal, as a fraction.
  max_plans_per_vehicle: Most plans that may be active on one vehicle at once.
  fleet_volume_min_plans: Active fleet plans (including the new one) a customer must hold for the fleet volume discount; 0 means no fleet volume discount.
  fleet_volume_discount_pct: Fleet volume discount on the plan price, as a fraction.
  fleet_substitution_max_per_plan: Times a fleet plan may be moved to a replacement vehicle; 0 means not allowed.
  defer_while_factory_maintenance_active: Switch (true/false) — whether a plan visit is not used for a service an in-force factory complimentary maintenance coverage pays.
  visit_reinstatement_window_days: Calendar days after a redemption within which a redemption recorded in error is reinstated.
  free_look_days: Calendar days after the sale date within which an unused plan is cancelled for a full refund.
  refund_method: How a cancellation refund is computed after the free look (retail_value_deduction / pro_rata_unused_visits).
  retail_value_per_visit_usd: Retail value deducted per redeemed visit under the retail_value_deduction method, USD.
  cancellation_fee_usd: Fee deducted from a cancellation refund after the free look, USD.
  cancel_fee_waived_on_total_loss: Switch (true/false) — whether the cancellation fee is waived when the vehicle is a total loss.
  deal_unwind_full_refund: Switch (true/false) — whether a plan sold on a purchase deal that is unwound is refunded in full.
  refund_to_lienholder_when_financed: Switch (true/false) — whether a refund on a financed plan is paid to the lienholder.
  refund_payment_days: Calendar days after the cancellation is processed within which the refund is paid.
  cancel_shortfall_billed: Switch (true/false) — whether a negative computed refund is billed to the holder.
  expired_visit_refund: Switch (true/false) — whether visits unused at expiration are refunded.
