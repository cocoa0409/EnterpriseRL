- id: vsc_ext_coverage_denial_reimbursement
  base_policy_refs: *id001
  overwrite:
  - base_policy: vsc_evt_claim_payment
    superseded_clause: Labor is paid at the allowed hours times labor_rate_paid, which is the store's posted customer-pay labor rate capped at labor_rate_cap_usd; the hourly difference above the cap is owed by the customer to the store.
    replaced_by: 'For a coverage re-decision line, and only for such a line, the labor repaid follows how the store billed the repaired line''s labor: where the store charged it below its list amount, the labor charged, never more than the standard labor amount; where it was charged at its list amount and the store credited part of it as a comeback repair, the list amount less that comeback credit, never more than the standard labor amount; otherwise the standard labor amount; a waiting-period re-decision line and a maintenance re-decision line take the labor their own rules set, and every other claim line is paid labor at the allowed hours times the rate paid, the store''s posted customer-pay labor rate capped at the coverage level''s labor-rate cap, the hourly difference above the cap owed by the customer to the store.'
  - base_policy: vsc_evt_claim_payment
    superseded_clause: Covered parts are paid at the store's list price.
    replaced_by: 'For a coverage re-decision line, and only for such a line, the parts repaid follow how the repaired line''s parts were billed: where they were charged below list, the parts charged; where they were charged at list and the store gave a goodwill credit on the repaired line, the list amount less that goodwill credit; otherwise the list amount; a waiting-period re-decision line and a maintenance re-decision line take the parts their own rules set, and every other claim line is paid its covered parts at the store''s list price.'
  - base_policy: vsc_evt_claim_payment
    superseded_clause: Diagnosis and teardown time is paid with the line where diagnostic_teardown_paid_if_covered is true and the failure is covered.
    replaced_by: 'For a coverage re-decision line, and only for such a line, the diagnostic fee repaid is the part of it the holder was left to pay: where the store credited the repaired line''s diagnostic fee in part, the uncredited part; where it credited that fee in full, nothing; otherwise the whole fee; a waiting-period re-decision line and a maintenance re-decision line take the diagnostic fee their own rules set, and every other claim line has its diagnosis and teardown time paid with the line where the coverage level pays diagnosis and teardown on a covered failure and the failure is covered.'
  - base_policy: vsc_evt_claim_payment
    superseded_clause: The line pays labor plus parts less the deductible, rounded to the cent, and never more than the remaining aggregate limit.
    replaced_by: For a coverage re-decision line, and only for such a line, every amount repaid on the repaired concern line and the repair order is added and the deductible taken is subtracted; that total is never below 0.00, is then capped at the part of the coverage level's aggregate claim limit the contract has not paid out (claims paid less reversals), and is rounded half up to the cent; a waiting-period re-decision line and a maintenance re-decision line take their totals as their own rules set, and every other claim line pays its labor plus parts less the deductible, rounded half up to the cent, never more than the remaining aggregate limit.
  trigger: state_due
  subject:
  - vsc_claim_paid
  computes: amount
  target_tool: reimburse_coverage_denial_repair_73971dca
  params: {}
  rule: 'This policy applies to the contract''s latest component repair line denied as not covered (by decision date; where several were decided on the same day, the one that appears first in the contract''s claim history), where the line''s component group is not an internally lubricated one (engine, transmission or drive axle), so that no maintenance proof is needed, and its coverage switch is true for the coverage level, the waiting period is over or waived (the contract was sold on its vehicle''s purchase deal under a coverage level that waives it for such a contract, or the diagnosis date is more than the waiting-period days after the sale date and the line''s odometer is at least the waiting miles beyond the odometer at sale), the repair order''s diagnosis date is on or before the expiration date and the line''s odometer is at or below the expiration odometer, the repair order carries a diagnostic fee on exactly one concern line and the store''s customer-pay labor on that concern line, not wholly credited back as a comeback repair, and that labor was closed on or after the day the contract decided the line, which the records take as the repair not having begun before the claim number was issued (a coverage re-decision line), and only to such a line: the contract repays the holder once, as one paid component-repair line under the same claim number, repair order and component group at the repair order''s odometer, and a denied line already repaid this way is not repaid again, while the base rules on active status, the deductible and the aggregate claim limit still apply. For a coverage re-decision line, the repaired concern line is the concern line of that repair order that carries the repair order''s diagnostic fee, and the amounts read are the store''s customer-pay lines of that concern line on that repair order. The standard coverage re-decision repayment is the repaired concern line''s labor at the hours billed times the store''s posted labor rate capped at the coverage level''s labor-rate cap, rounded half up to the cent, plus its parts at list price, plus its diagnostic fee, less the deductible chosen at sale, which is taken once for the visit and is not taken where the repair order was written at the store that sold the contract under a coverage level carrying the disappearing deductible, or where another component-repair line the contract paid on that repair order already took it under a coverage level that takes its deductible once per visit; shop fees on the repair order are not repaid. For a coverage re-decision line, and only for such a line, the labor repaid follows how the store billed the repaired line''s labor: where the store charged it below its list amount, the labor charged, never more than the standard labor amount; where it was charged at its list amount and the store credited part of it as a comeback repair, the list amount less that comeback credit, never more than the standard labor amount; otherwise the standard labor amount; a waiting-period re-decision line and a maintenance re-decision line take the labor their own rules set, and every other claim line is paid labor at the allowed hours times the rate paid, the store''s posted customer-pay labor rate capped at the coverage level''s labor-rate cap, the hourly difference above the cap owed by the customer to the store. For a coverage re-decision line, and only for such a line, the parts repaid follow how the repaired line''s parts were billed: where they were charged below list, the parts charged; where they were charged at list and the store gave a goodwill credit on the repaired line, the list amount less that goodwill credit; otherwise the list amount; a waiting-period re-decision line and a maintenance re-decision line take the parts their own rules set, and every other claim line is paid its covered parts at the store''s list price. For a coverage re-decision line, and only for such a line, the diagnostic fee repaid is the part of it the holder was left to pay: where the store credited the repaired line''s diagnostic fee in part, the uncredited part; where it credited that fee in full, nothing; otherwise the whole fee; a waiting-period re-decision line and a maintenance re-decision line take the diagnostic fee their own rules set, and every other claim line has its diagnosis and teardown time paid with the line where the coverage level pays diagnosis and teardown on a covered failure and the failure is covered. For a coverage re-decision line, the shop supplies fee repaid follows the labor on the repair order: where a shop supplies fee was charged and every customer-pay labor charge on the repair order belongs to the repaired concern line, the whole fee; where a shop supplies fee was charged and the repair order also carries customer-pay labor on other concern lines, the fee in the proportion the repaired line''s labor charge bears to all customer-pay labor charged on the repair order, rounded half up to the cent; otherwise none. For a coverage re-decision line, the hazardous-waste fee repaid follows the system repaired: where the repaired component is in the air-conditioning or cooling system and every customer-pay labor charge on the repair order belongs to the repaired concern line, the whole hazardous-waste fee charged; where the repaired component is in one of those systems and the repair order also carries customer-pay labor on other concern lines, that fee in the proportion the repaired line''s labor charge bears to all customer-pay labor charged on the repair order, rounded half up to the cent; otherwise none. For a coverage re-decision line, and only for such a line, every amount repaid on the repaired concern line and the repair order is added and the deductible taken is subtracted; that total is never below 0.00, is then capped at the part of the coverage level''s aggregate claim limit the contract has not paid out (claims paid less reversals), and is rounded half up to the cent; a waiting-period re-decision line and a maintenance re-decision line take their totals as their own rules set, and every other claim line pays its labor plus parts less the deductible, rounded half up to the cent, never more than the remaining aggregate limit.'
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads:
    - service_ro_lines.line_letter
    - service_ro_lines.store_id
    - service_ro_lines.labor_hours
    - service_ro_lines.labor_rate
    - service_ro_lines.list_amount
    - service_ro_lines.amount
    - service_ro_lines.credit_reason
    - service_ro_lines.fee_code
    note: The store's customer-pay repair-order lines decide the labor, parts, diagnostic and shop-fee tiers.
  compute:
  - cover_denials: COUNT('vsc_ledger', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='component_not_covered')
  - denied_claim: LATEST('vsc_ledger','claim_number', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='component_not_covered')
  - ro: LATEST('vsc_ledger','repair_order_number', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='component_not_covered')
  - denied_group: LATEST('vsc_ledger','component_group', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='component_not_covered')
  - already_repaid: COUNT('vsc_ledger', event_type='vsc_claim_paid', claim_line_type='component_repair', claim_number=denied_claim, repair_order_number=ro, component_group=denied_group)
  - group_switch_on: 1 if ((denied_group == 'engine' and P('covers_engine')) or (denied_group == 'transmission' and P('covers_transmission')) or (denied_group == 'drive_axle' and P('covers_drive_axle')) or (denied_group == 'cooling' and P('covers_cooling')) or (denied_group == 'fuel_system' and P('covers_fuel_system')) or (denied_group == 'electrical' and P('covers_electrical')) or (denied_group == 'air_conditioning' and P('covers_air_conditioning')) or (denied_group == 'steering' and P('covers_steering')) or (denied_group == 'suspension' and P('covers_suspension')) or (denied_group == 'brakes' and P('covers_brakes')) or (denied_group == 'high_tech_electronics' and P('covers_high_tech_electronics')) or (denied_group == 'seals_and_gaskets' and P('covers_seals_and_gaskets'))) else 0
  - deny_day: LATEST('vsc_ledger','entry_date', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='component_not_covered')
  - deny_odometer: LATEST('vsc_ledger','odometer', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='component_not_covered')
  - ro_diag_day: XLATEST('service','service_ro_lines','line_date', date_field='line_date', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - diag_lines: XCOUNT('service','service_ro_lines', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - in_term: 1 if (ro_diag_day and ro_diag_day <= F('expiration_date') and float(deny_odometer or 0) <= F('expiration_odometer')) else 0
  - lube_group: 1 if (denied_group == 'engine' or denied_group == 'transmission' or denied_group == 'drive_axle') else 0
  - waiting_over: 1 if ((F('purchase_deal_id') or '') != '' and P('waiting_period_waived_when_sold_with_vehicle')) or (ro_diag_day and DAYS(F('sale_date'), ro_diag_day) > P('waiting_period_days') and float(deny_odometer or 0) - F('odometer_at_sale') >= P('waiting_period_miles')) else 0
  - covered_line: XLATEST('service','service_ro_lines','line_letter', date_field='line_date', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - labor_hours_billed: XSUM('service','service_ro_lines','labor_hours', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - posted_rate: XLATEST('service','service_ro_lines','labor_rate', date_field='line_date', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - standard_labor: RND(labor_hours_billed * MN(float(posted_rate or 0), P('labor_rate_cap_usd')) + 0.000000001, 2)
  - labor_charged: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - labor_close_day: XLATEST('service','service_ro_lines','line_date', date_field='line_date', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - begun_after_claim: 1 if (labor_close_day and deny_day and labor_close_day >= deny_day) else 0
  - labor_list: XSUM('service','service_ro_lines','list_amount', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - comeback_credit: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_line_credited', credit_reason='comeback_repair')
  - labor_repaid: MN(labor_charged, standard_labor) if labor_charged < labor_list else (MN(labor_list - comeback_credit, standard_labor) if comeback_credit > 0 else standard_labor)
  - parts_list: XSUM('service','service_ro_lines','list_amount', repair_order_number=ro, line_letter=covered_line, event_type='service_parts_charged', pay_type='customer_pay')
  - parts_charged: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_parts_charged', pay_type='customer_pay')
  - goodwill_credit: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_line_credited', credit_reason='goodwill')
  - parts_repaid: parts_charged if parts_charged < parts_list else (parts_list - goodwill_credit if goodwill_credit > 0 else parts_list)
  - diag_fee: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_diagnostic_fee_charged')
  - diag_credit: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_line_credited', credit_reason='diagnostic_applied_to_repair')
  - diag_repaid: (diag_fee - diag_credit) if (diag_credit > 0 and diag_credit < diag_fee) else (0.0 if (diag_fee > 0 and diag_credit >= diag_fee) else diag_fee)
  - ro_store: XLATEST('service','service_ro_lines','store_id', date_field='line_date', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - deductible_chosen: float(F('deductible_option'))
  - visit_deductibles: COUNT('vsc_ledger', event_type='vsc_claim_paid', claim_line_type='component_repair', repair_order_number=ro, deductible_applied=deductible_chosen)
  - deductible_taken: 0.0 if ((ro_store == F('selling_store_id') and P('disappearing_deductible_at_selling_dealer')) or (P('deductible_basis') == 'per_visit' and visit_deductibles > 0)) else deductible_chosen
  - ro_labor_all: XSUM('service','service_ro_lines','amount', repair_order_number=ro, event_type='service_labor_charged', pay_type='customer_pay')
  - supplies_fee: XSUM('service','service_ro_lines','amount', repair_order_number=ro, event_type='service_shop_fee_charged', fee_code='shop_supplies')
  - supplies_repaid: supplies_fee if (supplies_fee > 0 and ro_labor_all <= labor_charged) else (RND(supplies_fee * labor_charged / ro_labor_all + 0.000000001, 2) if supplies_fee > 0 else 0.0)
  - waste_fee: XSUM('service','service_ro_lines','amount', repair_order_number=ro, event_type='service_shop_fee_charged', fee_code='hazardous_waste')
  - waste_repaid: waste_fee if ((denied_group == 'air_conditioning' or denied_group == 'cooling') and ro_labor_all <= labor_charged) else (RND(waste_fee * labor_charged / ro_labor_all + 0.000000001, 2) if (denied_group == 'air_conditioning' or denied_group == 'cooling') else 0.0)
  - claims_net: SUM('vsc_ledger','amount', event_type='vsc_claim_paid') - SUM('vsc_ledger','amount', event_type='vsc_claim_reversed')
  - limit_left: P('aggregate_claim_limit_usd') - claims_net
  - result: RND(MN(MX(0.0, labor_repaid + parts_repaid + diag_repaid + supplies_repaid + waste_repaid - deductible_taken), limit_left) + 0.000000001, 2) if (cover_denials > 0 and group_switch_on == 1 and already_repaid == 0 and lube_group == 0 and waiting_over == 1 and in_term == 1 and diag_lines == 1 and labor_charged - comeback_credit > 0 and begun_after_claim == 1) else 0.0
  compute_basis:
