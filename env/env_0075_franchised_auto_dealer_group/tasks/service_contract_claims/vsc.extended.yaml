  factors:
  - id: rental_window_start
    effect: method
    decides: start_day
    bindings:
    - loaner_out
    - denial_day
    - start_day
    ladder:
    - when: the loaner went out after the day of the repair order's diagnosis
      method: the window starts on the day the loaner went out
    - when: the loaner went out on the day of the diagnosis and a line of the claim was denied after that day
      method: the window starts on the day of the claim's latest denial (by decision date)
    - when: otherwise
      method: the window starts on the day of the repair order's diagnosis
    baseline:
      start_day: diag_day
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: null
  - id: rental_window_end
    effect: method
    decides: end_day
    bindings:
    - loaner_back
    - ro_diag_lines
    - covered_last
    - ro_last
    - end_day
    ladder:
    - when: the loaner came back before the covered concern line's last labor line
      method: the window ends on the day the loaner came back
    - when: the loaner did not come back earlier and the covered concern line's last labor line came before the repair order's last labor line
      method: the window ends on the day of the covered concern line's last labor line
    - when: otherwise
      method: the window ends on the day of the repair order's last labor line
    baseline:
      end_day: ro_last
    evidence:
    - cross_category
    - date
    cross_difficulty: service
  - id: free_courtesy_days
    effect: parameter
    decides: free_days
    bindings:
    - courtesy_days
    - bonus_days
    - account_tier
    - account_status
    - free_days
    ladder:
    - when: a dealer-courtesy loaner under a program with courtesy days and a Kessler Owner Rewards Gold or Platinum service account in active status
      value: the program's courtesy days plus its rewards bonus days
    - when: a dealer-courtesy loaner under a program with courtesy days and no such account
      value: the program's courtesy days
    - when: otherwise
      value: '0'
    baseline:
      free_days: '0'
    evidence:
    - cross_category
    cross_difficulty: service
  - id: rental_day_amount
    effect: parameter
    decides: day_amount
    bindings:
    - loaner_id
    - charged_rate
    - allowance
    - day_amount
    ladder:
    - when: the loaner was issued under a service-contract allowance with a daily allowance above zero
      value: the agreement's daily allowance
    - when: the holder was charged a daily rental rate below the coverage level's rental amount per day
      value: that daily rental rate
    - when: otherwise
      value: the coverage level's rental amount per day
    baseline:
      day_amount: P('rental_per_day_usd')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The standard rental is the coverage level's rental amount per day times the calendar days from the day of the repair order's diagnosis to the day of its last labor line, both days counted, up to the coverage level's most rental days per claim.
    params:
    - rental_per_day_usd
    - rental_max_days_per_claim
    - aggregate_claim_limit_usd
  inputs:
    history:
    - table: vsc_ledger
      aggregate: latest
      field: claim_number
      filters:
        event_type: vsc_claim_paid
        claim_line_type: component_repair
    - table: vsc_ledger
      aggregate: sum
      field: days
      filters:
        event_type: vsc_claim_paid
        claim_line_type: rental
    - category: service
      table: service_ro_lines
      aggregate: latest
      field: line_date
      filters:
        event_type: service_labor_charged
    - category: loaner
      table: loaner_charges
      aggregate: latest
      field: unit_rate
      filters:
        charge_code: daily_rental
    cross_category:
    - service
    - loaner
- id: vsc_ext_kept_vehicle_refund
  base_policy_refs:
  - vsc_evt_cancellation_refund
  overwrite:
  - base_policy: vsc_evt_cancellation_refund
    superseded_clause: Otherwise the refund is pro rata (cancel_method pro_rata) — retail_price times the unused share, rounded to the cent, less cancellation_fee_usd, and less claims paid only where claims_deducted_from_refund is true.
    replaced_by: For a kept-vehicle refund, and only for such a refund, the pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the cancellation fee, never below 0.00, with no claims deducted, and it is recorded under the pro-rata basis; a traded-vehicle refund is fixed by its own rule, and every other pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the coverage level's cancellation fee (none on a total loss where the coverage level waives it), and less claims paid only where the coverage level deducts them, recorded under the pro-rata basis.
  - base_policy: vsc_evt_cancellation_refund
    superseded_clause: Under refund_basis lesser_of_time_or_mileage the unused share is the lesser of the unused time share (days from the effective date to expiration_date over days from term_start_date to expiration_date) and the unused mileage share (miles from the certified odometer to expiration_odometer over term_miles); under pro_rata_time only the time share is used; a share below 0 counts as 0 and, for a term counted from the in-service date, time and miles before the sale date count as used.
    replaced_by: 'For a kept-vehicle refund, and only for such a refund, the unused share is the lesser of the unused time share and the unused mileage share as measured here (the unused time share alone for a coverage level that refunds on time alone): the used days are the measured elapsed days less the credited days, never below zero, the unused time share is the days from the term start date to the expiration date less the used days over those days, the unused mileage share is the starting odometer plus the term miles less the reading over the term miles, a share below zero counts as zero, and for a term counted from the in-service date the time and miles before the sale date count as used; a traded-vehicle refund measures its unused share under its own rule, and every other refund''s unused share is, under the lesser-of basis, the lesser of the unused time share (the days from the effective date to the expiration date over the days from the term start date to the expiration date) and the unused mileage share (the miles from the certified odometer to the expiration odometer over the term miles), the time share alone under the time basis, a share below zero counting as zero and, for a term counted from the in-service date, time and miles before the sale date counting as used.'
  trigger: on_request
  subject:
  - vsc_contract_cancelled
  - vsc_refund_calculated
  computes: refund_amount
  target_tool: accept_kept_vehicle_cancellation_d270783c
  params:
    kessler_care_holder_fee: 25.0
  rule: 'This policy applies to a contract its holder cancels while keeping the vehicle, on a signed cancellation request that gives the holder''s own request as the reason (a kept-vehicle cancellation), and only to such a cancellation: when the holder accepts the cancellation, the request is completed, the contract moves to cancelled effective on the request date, and the refund is recorded as due on that date at the odometer certified on the request under the refund basis that applies. The refund on such a cancellation is fixed only after the contract''s latest component repair line denied for the waiting period (by decision date; on a same-day tie, the one that appears first in the claim history) has been re-decided and whatever that re-decision owes the holder has been paid, wherever that line was denied while the contract was sold on its vehicle''s purchase deal, its component group is not an internally lubricated one (engine, transmission or drive axle) and has its coverage switch true, the repair order''s diagnosis date and the line''s odometer fall within the term, and that repair order carries a diagnostic fee on exactly one concern line together with the store''s customer-pay labor on that concern line, not wholly credited back as a comeback repair, closed on or after the day the line was decided. The refund on such a cancellation is not computed until the rental benefit of the claim of the contract''s latest component-repair line, paid or denied (by entry date; on a same-day tie, the one that appears first in the claim history), has been settled and whatever rental it owes the holder has been paid, wherever the first loaner agreement the loaner records list for that claim''s repair order is a Kessler loaner on which the holder was charged daily rental and the coverage level''s rental amount per day and rental day limit are both above zero. For a kept-vehicle refund, a contract cancelled within the coverage level''s free-look days after its sale date with no claim paid (claims paid less reversals at zero) is refunded its full retail price, a contract sold on a purchase deal that has been unwound is refunded its full retail price, and these flat refunds take precedence over the pro-rata refund. The standard kept-vehicle refund is the retail price times the unused share, rounded half up to the cent, less the coverage level''s cancellation fee and never below 0.00; the unused share is the lesser of the unused time share, the days from the effective date to the expiration date over the days from the term start date to the expiration date, and the unused mileage share, the miles from the certified odometer to the expiration odometer over the term miles; a coverage level that refunds on time alone uses the unused time share only, and a share below zero counts as zero. For a kept-vehicle refund, the unused mileage share is measured at a reading: where the latest repair order a group store wrote for the vehicle (the one whose labor was closed last; where two closed labor on the same day, the one listed first in the service records) records an odometer above the certified one, that repair-order odometer; where no such repair order does and the latest visit redeemed on the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan), where it has not been reinstated, records an odometer above the certified one, that visit odometer; otherwise the certified odometer. For a kept-vehicle refund, the term miles run from a starting odometer: where the contract''s term counts from its sale date and it was sold on a purchase deal delivered after the contract''s sale date with a delivery odometer above the odometer at sale, that delivery odometer; where its term counts from its sale date and it was sold on a purchase deal delivered to the holder''s address on or before the sale date, the odometer at sale plus the deal''s one-way delivery distance; otherwise, including every term counted from the vehicle''s in-service date, the term start odometer. For a kept-vehicle refund, the elapsed days of the term, the calendar days from the term start date to the effective date, are counted as the contract form of the coverage level sets: under a Kessler Shield Exclusionary or Kessler Shield Exclusionary Wrap form, in whole 30-day periods completed, a part period not counted; under a Kessler Shield Preferred or Kessler Shield Select form, in 30-day periods with a started period counted as a whole one; otherwise as counted. For a kept-vehicle refund, days of the term the holder could not use are credited: where the contract was sold on a purchase deal delivered after the contract''s sale date, the days from the sale date to the delivery date; where the contract was sold on its own with no purchase deal, the coverage level''s waiting-period days; otherwise none. For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken. For a kept-vehicle refund, and only for such a refund, the unused share is the lesser of the unused time share and the unused mileage share as measured here (the unused time share alone for a coverage level that refunds on time alone): the used days are the measured elapsed days less the credited days, never below zero, the unused time share is the days from the term start date to the expiration date less the used days over those days, the unused mileage share is the starting odometer plus the term miles less the reading over the term miles, a share below zero counts as zero, and for a term counted from the in-service date the time and miles before the sale date count as used; a traded-vehicle refund measures its unused share under its own rule, and every other refund''s unused share is, under the lesser-of basis, the lesser of the unused time share (the days from the effective date to the expiration date over the days from the term start date to the expiration date) and the unused mileage share (the miles from the certified odometer to the expiration odometer over the term miles), the time share alone under the time basis, a share below zero counting as zero and, for a term counted from the in-service date, time and miles before the sale date counting as used. For a kept-vehicle refund, and only for such a refund, the pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the cancellation fee, never below 0.00, with no claims deducted, and it is recorded under the pro-rata basis; a traded-vehicle refund is fixed by its own rule, and every other pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the coverage level''s cancellation fee (none on a total loss where the coverage level waives it), and less claims paid only where the coverage level deducts them, recorded under the pro-rata basis.'
  prerequisite:
  - problem: vsc_ext_waiting_denial_reimbursement
    kind: value_input
    gate: redecided_count
    form: action
    policy_source: The refund on such a cancellation is fixed only after the contract's latest component repair line denied for the waiting period (by decision date; on a same-day tie, the one that appears first in the claim history) has been re-decided and whatever that re-decision owes the holder has been paid, wherever that line was denied while the contract was sold on its vehicle's purchase deal, its component group is not an internally lubricated one (engine, transmission or drive axle) and has its coverage switch true, the repair order's diagnosis date and the line's odometer fall within the term, and that repair order carries a diagnostic fee on exactly one concern line together with the store's customer-pay labor on that concern line, not wholly credited back as a comeback repair, closed on or after the day the line was decided.
    condition: 'For the contract''s latest vsc_claim_denied component_repair line with denial_reason waiting_period (first listed on a same-day tie), where purchase_deal_id is filled, its group is not engine/transmission/drive_axle with its covers_ switch true, the RO diagnosis date <= expiration_date and its odometer <= expiration_odometer, and the RO carries exactly one service_diagnostic_fee_charged row and customer-pay labor on that line, net of comeback credit above zero, closed on or after the denial''s entry_date: the re-decision is made, leaving a vsc_claim_paid component_repair line under its claim number where it owes a positive amount and no line where it owes nothing. A latest waiting_period denial outside those tests is outside the wait.'
    resolved_by: reimburse_waiting_denial_repair_5808cf06
    effect: Once the denied line is paid on re-decision, a claim stands paid (no flat free-look refund) and the latest denied claim line has a paid component-repair line, which sets the cancellation fee to none inside the free-look window counted from the delivery date.
    fallback_reason: A re-decision that repays nothing books no line, so no record state tells a decided line from an undecided one; the wait can only be stated as the re-decision itself being completed.
  - problem: vsc_ext_claim_rental_reimbursement
    kind: state_gate
    gate: vsc_ledger.claim_line_type
    form: action
    policy_source: The refund on such a cancellation is not computed until the rental benefit of the claim of the contract's latest component-repair line, paid or denied (by entry date; on a same-day tie, the one that appears first in the claim history), has been settled and whatever rental it owes the holder has been paid, wherever the first loaner agreement the loaner records list for that claim's repair order is a Kessler loaner on which the holder was charged daily rental and the coverage level's rental amount per day and rental day limit are both above zero.
    condition: 'For the claim of the contract''s latest component_repair ledger line (paid or denied; first listed on a same-day tie), where the first loaner_agreements row for its RO has a loaner_charge_posted daily_rental charge and rental_per_day_usd and rental_max_days_per_claim are above zero: the rental benefit is settled — a vsc_claim_paid rental line stands under that claim number where the benefit owes a positive amount (only once the claim carries a vsc_claim_paid component_repair line), and no line where it owes nothing. Any other claim is outside the wait.'
    resolved_by: pay_claim_rental_line_3f5378a0
    effect: Once the claim's rental line stands paid, nothing the contract owes on its claims remains open, so the cancellation can be processed and the contract stops paying claims.
    fallback_reason: A rental benefit that pays nothing books no rental line, so no record state tells a settled rental from an unsettled one; the wait can only be stated as the rental benefit itself being settled.
  cross_category:
  - category: purchase
    as: branch
    reads:
    - status
    - delivery_date
    - odometer_at_delivery
    - delivery_method
    - delivery_distance_miles
    - financing_type
    note: The deal the contract was sold on decides the starting odometer, the credited days, the elapsed-time measure and the fee window.
  - category: service
    as: history
    reads:
    - service_ro_lines.odometer_in
    note: The latest group repair order's odometer decides the reading tier.
  - category: maintenance
    as: history
    reads:
    - maintenance_plan_id
    - status
    - maintenance_plan_ledger.odometer
    note: The Kessler Care plan on the vehicle decides the visit-reading tier and the Kessler Care holder fee tier.
  compute:
  - request_day: LATEST('vsc_cancellation_requests','request_date', date_field='request_date', request_status='submitted', cancel_reason='customer_request')
  - certified: float(LATEST('vsc_cancellation_requests','odometer_at_request', date_field='request_date', request_status='submitted', cancel_reason='customer_request') or 0)
  - claims_net: SUM('vsc_ledger','amount', event_type='vsc_claim_paid') - SUM('vsc_ledger','amount', event_type='vsc_claim_reversed')
  - deal_status: CFIELD('purchase','status', purchase_deal_id=F('purchase_deal_id'))
  - deal_delivery: CFIELD('purchase','delivery_date', purchase_deal_id=F('purchase_deal_id'))
  - delivered_late: deal_delivery != None and deal_delivery > F('sale_date')
  - ro_reading: XLATEST('service','service_ro_lines','odometer_in', date_field='line_date', vehicle_id=F('vehicle_id'), event_type='service_labor_charged')
  - plan_id: (CFIELD('maintenance','maintenance_plan_id', purchase_deal_id=F('purchase_deal_id'))) if (F('purchase_deal_id') or '') != '' else None
  - visit_reading: XLATEST('maintenance','maintenance_plan_ledger','odometer', date_field='entry_date', maintenance_plan_id=plan_id, event_type='maintenance_visit_redeemed')
  - visit_entry: XLATEST('maintenance','maintenance_plan_ledger','maintenance_entry_id', date_field='entry_date', maintenance_plan_id=plan_id, event_type='maintenance_visit_redeemed')
  - visit_reinstated: XCOUNT('maintenance','maintenance_plan_ledger', maintenance_plan_id=plan_id, event_type='maintenance_visit_reinstated', source_entry_id=visit_entry)
  - reading: float(ro_reading) if (ro_reading != None and float(ro_reading) > certified) else (float(visit_reading) if (plan_id and visit_reading != None and visit_reinstated == 0 and float(visit_reading) > certified) else certified)
  - deal_odometer: CFIELD('purchase','odometer_at_delivery', purchase_deal_id=F('purchase_deal_id'))
  - deal_method: CFIELD('purchase','delivery_method', purchase_deal_id=F('purchase_deal_id'))
  - deal_distance: CFIELD('purchase','delivery_distance_miles', purchase_deal_id=F('purchase_deal_id'))
  - run_from: float(deal_odometer) if (P('term_start_basis') == 'sale_date' and delivered_late and float(deal_odometer or 0) > F('odometer_at_sale')) else (F('odometer_at_sale') + float(deal_distance or 0) if (P('term_start_basis') == 'sale_date' and deal_method == 'home_delivery' and deal_delivery != None and deal_delivery <= F('sale_date')) else F('term_start_odometer'))
  - mileage_share: MX(0.0, (run_from + F('term_miles') - reading) / F('term_miles'))
  - term_days: DAYS(F('term_start_date'), F('expiration_date'))
  - elapsed_days: MX(0, DAYS(F('term_start_date'), request_day))
  - elapsed_measured: int(elapsed_days / 30) * 30 if (F('variant_name') == 'Kessler Shield Exclusionary' or F('variant_name') == 'Kessler Shield Exclusionary Wrap') else (((elapsed_days + 29) // 30) * 30 if (F('variant_name') == 'Kessler Shield Preferred' or F('variant_name') == 'Kessler Shield Select') else elapsed_days)
  - credited_days: DAYS(F('sale_date'), deal_delivery) if delivered_late else (P('waiting_period_days') if (F('purchase_deal_id') == '' or F('purchase_deal_id') == None) else 0)
  - used_days: MX(0, elapsed_measured - credited_days)
  - time_share: MX(0.0, (term_days - used_days) / term_days)
  - unused_share: time_share if P('refund_basis') == 'pro_rata_time' else MN(time_share, mileage_share)
  - window_from: deal_delivery if delivered_late else F('sale_date')
  - denied_claim: LATEST('vsc_ledger','claim_number', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair')
  - denied_ro: LATEST('vsc_ledger','repair_order_number', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair')
  - denied_group: LATEST('vsc_ledger','component_group', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair')
  - denied_day: LATEST('vsc_ledger','entry_date', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair')
  - repaid_day: LATEST('vsc_ledger','entry_date', date_field='entry_date', event_type='vsc_claim_paid', claim_line_type='component_repair', claim_number=denied_claim, repair_order_number=denied_ro, component_group=denied_group)
  - redecided_count: COUNT('vsc_ledger', event_type='vsc_claim_paid', claim_line_type='component_repair', claim_number=denied_claim, repair_order_number=denied_ro, component_group=denied_group) if (repaid_day and denied_day and repaid_day >= denied_day) else 0
  - plan_status: CFIELD('maintenance','status', vehicle_id=F('vehicle_id'), status='active')
  - cancel_fee: 0.0 if (DAYS(window_from, request_day) <= P('free_look_days') and redecided_count > 0) else (K('kessler_care_holder_fee') if plan_status == 'active' else P('cancellation_fee_usd'))
  - flat_look: DAYS(F('sale_date'), request_day) <= P('free_look_days') and claims_net <= 0.005
  - result: F('retail_price') if (deal_status == 'unwound' or flat_look) else RND(MX(0.0, RND(F('retail_price') * unused_share + 0.000000001, 2) - cancel_fee) + 0.000000001, 2)
