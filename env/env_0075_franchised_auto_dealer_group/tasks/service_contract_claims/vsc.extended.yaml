    unused_share: 'For a kept-vehicle refund, and only for such a refund, the unused share is the lesser of the unused time share and the unused mileage share as measured here (the unused time share alone for a coverage level that refunds on time alone): the used days are the measured elapsed days less the credited days, never below zero, the unused time share is the days from the term start date to the expiration date less the used days over those days, the unused mileage share is the starting odometer plus the term miles less the reading over the term miles, a share below zero counts as zero, and for a term counted from the in-service date the time and miles before the sale date count as used; a traded-vehicle refund measures its unused share under its own rule, and every other refund''s unused share is, under the lesser-of basis, the lesser of the unused time share (the days from the effective date to the expiration date over the days from the term start date to the expiration date) and the unused mileage share (the miles from the certified odometer to the expiration odometer over the term miles), the time share alone under the time basis, a share below zero counting as zero and, for a term counted from the in-service date, time and miles before the sale date counting as used.'
    window_from: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    denied_claim: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    redecided_count: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    plan_status: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    cancel_fee: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    flat_look: For a kept-vehicle refund, a contract cancelled within the coverage level's free-look days after its sale date with no claim paid (claims paid less reversals at zero) is refunded its full retail price, a contract sold on a purchase deal that has been unwound is refunded its full retail price, and these flat refunds take precedence over the pro-rata refund.
    result: For a kept-vehicle refund, and only for such a refund, the pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the cancellation fee, never below 0.00, with no claims deducted, and it is recorded under the pro-rata basis; a traded-vehicle refund is fixed by its own rule, and every other pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the coverage level's cancellation fee (none on a total loss where the coverage level waives it), and less claims paid only where the coverage level deducts them, recorded under the pro-rata basis.
    visit_entry: 'For a kept-vehicle refund, the unused mileage share is measured at a reading: where the latest repair order a group store wrote for the vehicle (the one whose labor was closed last; where two closed labor on the same day, the one listed first in the service records) records an odometer above the certified one, that repair-order odometer; where no such repair order does and the latest visit redeemed on the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan), where it has not been reinstated, records an odometer above the certified one, that visit odometer; otherwise the certified odometer.'
    visit_reinstated: 'For a kept-vehicle refund, the unused mileage share is measured at a reading: where the latest repair order a group store wrote for the vehicle (the one whose labor was closed last; where two closed labor on the same day, the one listed first in the service records) records an odometer above the certified one, that repair-order odometer; where no such repair order does and the latest visit redeemed on the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan), where it has not been reinstated, records an odometer above the certified one, that visit odometer; otherwise the certified odometer.'
    denied_ro: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    denied_group: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    denied_day: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    repaid_day: 'For a kept-vehicle refund, the cancellation fee follows how the cancellation came about: where the request date falls within the coverage level''s free-look days counted from the later of the sale date and the purchase deal''s delivery date, and the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder keeps a Kessler Care plan in active status on the vehicle, the Kessler Care holder fee is taken; otherwise the coverage level''s cancellation fee is taken.'
  factors:
  - id: mileage_reading_tier
    effect: parameter
    decides: reading
    bindings:
    - ro_reading
    - plan_id
    - visit_reading
    - visit_entry
    - visit_reinstated
    - reading
    ladder:
    - when: 'the latest repair order a group store wrote for the vehicle (labor closed last; same-day tie: first listed) records an odometer above the certified one'
      value: that repair-order odometer
    - when: no such repair order does and the latest visit redeemed on the Kessler Care plan sold on the contract's purchase deal, not reinstated, records an odometer above the certified one
      value: that visit odometer
    - when: otherwise
      value: the certified odometer
    baseline:
      reading: certified
    evidence:
    - cross_category
    - history
    cross_difficulty: maintenance
  - id: term_miles_start
    effect: parameter
    decides: run_from
    bindings:
    - deal_odometer
    - deal_method
    - deal_distance
    - run_from
    ladder:
    - when: the contract's term counts from its sale date and it was sold on a purchase deal delivered after the contract's sale date with a delivery odometer above the odometer at sale
      value: the deal's delivery odometer
    - when: the contract's term counts from its sale date and it was sold on a purchase deal delivered to the holder's address on or before the sale date
      value: the odometer at sale plus the deal's one-way delivery distance
    - when: otherwise
      value: the term start odometer
    baseline:
      run_from: F('term_start_odometer')
    evidence:
    - cross_category
    - date
    cross_difficulty: purchase
  - id: elapsed_term_measure
    effect: method
    decides: elapsed_measured
    bindings:
    - elapsed_days
    - elapsed_measured
    ladder:
    - when: the contract is on the Kessler Shield Exclusionary or Kessler Shield Exclusionary Wrap form
      method: elapsed days counted in whole 30-day periods completed, a part period not counted
    - when: the contract is on the Kessler Shield Preferred or Kessler Shield Select form
      method: elapsed days counted in 30-day periods, a started period counted as a whole one
    - when: otherwise
      method: the calendar days from the term start date to the effective date as counted
    baseline:
      elapsed_measured: elapsed_days
    evidence:
    - tier_param
    - date
    cross_difficulty: null
  - id: unusable_days_credit
    effect: parameter
    decides: credited_days
    bindings:
    - credited_days
    ladder:
    - when: the contract was sold on a purchase deal delivered after the contract's sale date
      value: the days from the sale date to the delivery date
    - when: the contract was sold on its own with no purchase deal
      value: the coverage level's waiting-period days
    - when: otherwise
      value: '0'
    baseline:
      credited_days: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: cancel_fee_standing
    effect: parameter
    decides: cancel_fee
    bindings:
    - window_from
    - denied_claim
    - denied_ro
    - denied_group
    - denied_day
    - repaid_day
    - redecided_count
    - plan_status
    - cancel_fee
    ladder:
    - when: 'the request date is within the free-look days counted from the later of the sale date and the deal''s delivery date, and the contract''s latest denied component-repair line (same-day tie: first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (on or after the day of that denial)'
      value: '0.00'
    - when: not that, and the holder keeps a Kessler Care plan in active status on the vehicle
      value: the Kessler Care holder fee
    - when: otherwise
      value: the coverage level's cancellation fee
    baseline:
      cancel_fee: P('cancellation_fee_usd')
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: maintenance
  baseline:
    rule: The standard kept-vehicle refund is the retail price times the unused share, rounded half up to the cent, less the coverage level's cancellation fee and never below 0.00; the unused share is the lesser of the unused time share, the days from the effective date to the expiration date over the days from the term start date to the expiration date, and the unused mileage share, the miles from the certified odometer to the expiration odometer over the term miles; a coverage level that refunds on time alone uses the unused time share only, and a share below zero counts as zero.
    params:
    - cancellation_fee_usd
    - free_look_days
    - refund_basis
  inputs:
    history:
    - table: vsc_cancellation_requests
      aggregate: latest
      field: request_date
      filters:
        request_status: submitted
        cancel_reason: customer_request
    - table: vsc_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: vsc_claim_paid
    - category: service
      table: service_ro_lines
      aggregate: latest
      field: odometer_in
      filters: {}
    - category: maintenance
      table: maintenance_plan_ledger
      aggregate: latest
      field: odometer
      filters:
        event_type: maintenance_visit_redeemed
    cross_category:
    - purchase
    - service
    - maintenance
- id: vsc_ext_maintenance_denial_reimbursement
  base_policy_refs: &id001
  - vsc_agg_vehicle_and_limit
  - vsc_evt_claim_payment
  - vsc_evt_waiting_period
  - vsc_evt_claim_benefits
  - vsc_evt_maintenance_proof
  - vsc_combo_factory_warranty
  overwrite:
  - base_policy: vsc_evt_claim_payment
    superseded_clause: Labor is paid at the allowed hours times labor_rate_paid, which is the store's posted customer-pay labor rate capped at labor_rate_cap_usd; the hourly difference above the cap is owed by the customer to the store.
    replaced_by: 'For a maintenance re-decision line, and only for such a line, the labor repaid follows how the store billed the repaired line''s labor: where the store charged it below its list amount, the labor charged, never more than the standard labor amount; where it was charged at its list amount and the store credited part of it as a comeback repair, the list amount less that comeback credit, never more than the standard labor amount; otherwise the standard labor amount; a waiting-period re-decision line and a coverage re-decision line take the labor their own rules set, and every other claim line is paid labor at the allowed hours times the rate paid, the store''s posted customer-pay labor rate capped at the coverage level''s labor-rate cap, the hourly difference above the cap owed by the customer to the store.'
  - base_policy: vsc_evt_claim_payment
    superseded_clause: Covered parts are paid at the store's list price.
    replaced_by: 'For a maintenance re-decision line, and only for such a line, the parts repaid follow how the repaired line''s parts were billed: where they were charged below list, the parts charged; where they were charged at list and the store gave a goodwill credit on the repaired line, the list amount less that goodwill credit; otherwise the list amount; a waiting-period re-decision line and a coverage re-decision line take the parts their own rules set, and every other claim line is paid its covered parts at the store''s list price.'
  - base_policy: vsc_evt_claim_payment
    superseded_clause: Diagnosis and teardown time is paid with the line where diagnostic_teardown_paid_if_covered is true and the failure is covered.
    replaced_by: 'For a maintenance re-decision line, and only for such a line, the diagnostic fee repaid is the part of it the holder was left to pay: where the store credited the repaired line''s diagnostic fee in part, the uncredited part; where it credited that fee in full, nothing; otherwise the whole fee; a waiting-period re-decision line and a coverage re-decision line take the diagnostic fee their own rules set, and every other claim line has its diagnosis and teardown time paid with the line where the coverage level pays diagnosis and teardown on a covered failure and the failure is covered.'
  - base_policy: vsc_evt_claim_payment
    superseded_clause: The deductible chosen at sale is taken under the coverage level's deductible_basis (once per repair visit for per_visit, once per component group repaired for per_repair, counted by vsc_msr_deductibles_on_visit), and where disappearing_deductible_at_selling_dealer is true no deductible is taken when the repair is done at the selling store.
    replaced_by: 'For a maintenance re-decision line, and only for such a line, the deductible taken follows the visit''s record: where the repair order was written at the store that sold the contract and the coverage level carries the disappearing deductible, none; where that is not so and the coverage level takes its deductible once per repair visit, the deductible chosen at sale less the contract deductibles the store already billed the holder on that repair order, never below zero; otherwise the deductible chosen at sale once; a waiting-period re-decision line follows its own deductible rule, and every other claim line takes the deductible chosen at sale under the coverage level''s deductible basis (once per repair visit, or once per component group repaired), with none taken where the coverage level carries the disappearing deductible and the repair is done at the selling store.'
  - base_policy: vsc_evt_claim_payment
    superseded_clause: The line pays labor plus parts less the deductible, rounded to the cent, and never more than the remaining aggregate limit.
    replaced_by: For a maintenance re-decision line, and only for such a line, every amount repaid on the repaired concern line and the repair order is added and the deductible taken is subtracted; that total is never below 0.00, is then capped at the part of the coverage level's aggregate claim limit the contract has not paid out (claims paid less reversals), and is rounded half up to the cent; a waiting-period re-decision line and a coverage re-decision line take their totals as their own rules set, and every other claim line pays its labor plus parts less the deductible, rounded half up to the cent, never more than the remaining aggregate limit.
  trigger: state_due
  subject:
  - vsc_claim_paid
  computes: amount
  target_tool: reimburse_maintenance_denial_repair_6315e699
  params: {}
  rule: 'This policy applies to the contract''s latest component repair line denied for lack of maintenance (by decision date; where several were decided on the same day, the one that appears first in the contract''s claim history), where the line''s component group is an internally lubricated one (engine, transmission or drive axle) whose coverage switch is true for the coverage level, the latest visit redeemed on the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan) has not been reinstated and is dated on or before the repair order''s diagnosis date and fewer than the coverage level''s maintenance look-back months before it (the months counted as the difference between the two dates'' calendar months, less one where the diagnosis date''s day of the month is earlier than the visit''s), the waiting period is over or waived (the contract was sold on its vehicle''s purchase deal under a coverage level that waives it for such a contract, or the diagnosis date is more than the waiting-period days after the sale date and the line''s odometer is at least the waiting miles beyond the odometer at sale), the repair order''s diagnosis date is on or before the expiration date and the line''s odometer is at or below the expiration odometer, the repair order carries a diagnostic fee on exactly one concern line and the store''s customer-pay labor on that concern line, not wholly credited back as a comeback repair, and that labor was closed on or after the day the contract decided the line, which the records take as the repair not having begun before the claim number was issued (a maintenance re-decision line), and only to such a line: the contract repays the holder once, as one paid component-repair line under the same claim number, repair order and component group at the repair order''s odometer, and a denied line already repaid this way is not repaid again, while the base rules on active status and the aggregate claim limit still apply. For a maintenance re-decision line, the repaired concern line is the concern line of that repair order that carries the repair order''s diagnostic fee, and the amounts read are the store''s customer-pay lines of that concern line on that repair order. The standard maintenance re-decision repayment is the repaired concern line''s labor at the hours billed times the store''s posted labor rate capped at the coverage level''s labor-rate cap, rounded half up to the cent, plus its parts at list price, plus its diagnostic fee, less the deductible chosen at sale taken once for the visit; shop fees on the repair order are not repaid. For a maintenance re-decision line, and only for such a line, the labor repaid follows how the store billed the repaired line''s labor: where the store charged it below its list amount, the labor charged, never more than the standard labor amount; where it was charged at its list amount and the store credited part of it as a comeback repair, the list amount less that comeback credit, never more than the standard labor amount; otherwise the standard labor amount; a waiting-period re-decision line and a coverage re-decision line take the labor their own rules set, and every other claim line is paid labor at the allowed hours times the rate paid, the store''s posted customer-pay labor rate capped at the coverage level''s labor-rate cap, the hourly difference above the cap owed by the customer to the store. For a maintenance re-decision line, and only for such a line, the parts repaid follow how the repaired line''s parts were billed: where they were charged below list, the parts charged; where they were charged at list and the store gave a goodwill credit on the repaired line, the list amount less that goodwill credit; otherwise the list amount; a waiting-period re-decision line and a coverage re-decision line take the parts their own rules set, and every other claim line is paid its covered parts at the store''s list price. For a maintenance re-decision line, and only for such a line, the diagnostic fee repaid is the part of it the holder was left to pay: where the store credited the repaired line''s diagnostic fee in part, the uncredited part; where it credited that fee in full, nothing; otherwise the whole fee; a waiting-period re-decision line and a coverage re-decision line take the diagnostic fee their own rules set, and every other claim line has its diagnosis and teardown time paid with the line where the coverage level pays diagnosis and teardown on a covered failure and the failure is covered. For a maintenance re-decision line, and only for such a line, the deductible taken follows the visit''s record: where the repair order was written at the store that sold the contract and the coverage level carries the disappearing deductible, none; where that is not so and the coverage level takes its deductible once per repair visit, the deductible chosen at sale less the contract deductibles the store already billed the holder on that repair order, never below zero; otherwise the deductible chosen at sale once; a waiting-period re-decision line follows its own deductible rule, and every other claim line takes the deductible chosen at sale under the coverage level''s deductible basis (once per repair visit, or once per component group repaired), with none taken where the coverage level carries the disappearing deductible and the repair is done at the selling store. For a maintenance re-decision line, the shop supplies fee repaid follows the labor on the repair order: where a shop supplies fee was charged and every customer-pay labor charge on the repair order belongs to the repaired concern line, the whole fee; where a shop supplies fee was charged and the repair order also carries customer-pay labor on other concern lines, the fee in the proportion the repaired line''s labor charge bears to all customer-pay labor charged on the repair order, rounded half up to the cent; otherwise none. For a maintenance re-decision line, the hazardous-waste fee repaid follows the labor on the repair order: where a hazardous-waste fee was charged and every customer-pay labor charge on the repair order belongs to the repaired concern line, the whole fee; where a hazardous-waste fee was charged and the repair order also carries customer-pay labor on other concern lines, the fee in the proportion the repaired line''s labor charge bears to all customer-pay labor charged on the repair order, rounded half up to the cent; otherwise none. For a maintenance re-decision line, and only for such a line, every amount repaid on the repaired concern line and the repair order is added and the deductible taken is subtracted; that total is never below 0.00, is then capped at the part of the coverage level''s aggregate claim limit the contract has not paid out (claims paid less reversals), and is rounded half up to the cent; a waiting-period re-decision line and a coverage re-decision line take their totals as their own rules set, and every other claim line pays its labor plus parts less the deductible, rounded half up to the cent, never more than the remaining aggregate limit.'
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads:
    - service_ro_lines.line_letter
    - service_ro_lines.line_date
    - service_ro_lines.store_id
    - service_ro_lines.labor_hours
    - service_ro_lines.labor_rate
    - service_ro_lines.list_amount
    - service_ro_lines.amount
    - service_ro_lines.credit_reason
    - service_ro_lines.fee_code
    note: The store's customer-pay repair-order lines date the repair and decide the labor, parts, diagnostic, deductible and shop-fee tiers.
  - category: maintenance
    as: history
    reads:
    - maintenance_plan_id
    - maintenance_plan_ledger.entry_date
    note: The Kessler Care visits on the vehicle decide whether the lack-of-maintenance denial falls in scope.
  compute:
  - maint_denials: COUNT('vsc_ledger', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='lack_of_maintenance')
  - denied_claim: LATEST('vsc_ledger','claim_number', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='lack_of_maintenance')
  - ro: LATEST('vsc_ledger','repair_order_number', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='lack_of_maintenance')
  - denied_group: LATEST('vsc_ledger','component_group', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='lack_of_maintenance')
  - already_repaid: COUNT('vsc_ledger', event_type='vsc_claim_paid', claim_line_type='component_repair', claim_number=denied_claim, repair_order_number=ro, component_group=denied_group)
  - lube_group: 1 if (denied_group == 'engine' or denied_group == 'transmission' or denied_group == 'drive_axle') else 0
  - ro_diag_day: XLATEST('service','service_ro_lines','line_date', date_field='line_date', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - plan_id: (CFIELD('maintenance','maintenance_plan_id', purchase_deal_id=F('purchase_deal_id'))) if (F('purchase_deal_id') or '') != '' else None
  - visit_day: XLATEST('maintenance','maintenance_plan_ledger','entry_date', date_field='entry_date', maintenance_plan_id=plan_id, event_type='maintenance_visit_redeemed')
  - visit_entry: XLATEST('maintenance','maintenance_plan_ledger','maintenance_entry_id', date_field='entry_date', maintenance_plan_id=plan_id, event_type='maintenance_visit_redeemed')
  - visit_reinstated: XCOUNT('maintenance','maintenance_plan_ledger', maintenance_plan_id=plan_id, event_type='maintenance_visit_reinstated', source_entry_id=visit_entry)
  - visit_proof: 1 if (plan_id and visit_day and ro_diag_day and visit_reinstated == 0 and visit_day <= ro_diag_day and MONTHS(visit_day, ro_diag_day) < P('maintenance_proof_lookback_months')) else 0
  - deny_day: LATEST('vsc_ledger','entry_date', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='lack_of_maintenance')
  - deny_odometer: LATEST('vsc_ledger','odometer', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair', denial_reason='lack_of_maintenance')
  - group_switch_on: 1 if ((denied_group == 'engine' and P('covers_engine')) or (denied_group == 'transmission' and P('covers_transmission')) or (denied_group == 'drive_axle' and P('covers_drive_axle')) or (denied_group == 'cooling' and P('covers_cooling')) or (denied_group == 'fuel_system' and P('covers_fuel_system')) or (denied_group == 'electrical' and P('covers_electrical')) or (denied_group == 'air_conditioning' and P('covers_air_conditioning')) or (denied_group == 'steering' and P('covers_steering')) or (denied_group == 'suspension' and P('covers_suspension')) or (denied_group == 'brakes' and P('covers_brakes')) or (denied_group == 'high_tech_electronics' and P('covers_high_tech_electronics')) or (denied_group == 'seals_and_gaskets' and P('covers_seals_and_gaskets'))) else 0
  - diag_lines: XCOUNT('service','service_ro_lines', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - in_term: 1 if (ro_diag_day and ro_diag_day <= F('expiration_date') and float(deny_odometer or 0) <= F('expiration_odometer')) else 0
  - waiting_over: 1 if ((F('purchase_deal_id') or '') != '' and P('waiting_period_waived_when_sold_with_vehicle')) or (ro_diag_day and DAYS(F('sale_date'), ro_diag_day) > P('waiting_period_days') and float(deny_odometer or 0) - F('odometer_at_sale') >= P('waiting_period_miles')) else 0
  - covered_line: XLATEST('service','service_ro_lines','line_letter', date_field='line_date', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - labor_hours_billed: XSUM('service','service_ro_lines','labor_hours', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - posted_rate: XLATEST('service','service_ro_lines','labor_rate', date_field='line_date', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - standard_labor: RND(labor_hours_billed * MN(float(posted_rate or 0), P('labor_rate_cap_usd')) + 0.000000001, 2)
  - labor_charged: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - labor_close_day: XLATEST('service','service_ro_lines','line_date', date_field='line_date', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - begun_after_claim: 1 if (labor_close_day and deny_day and labor_close_day >= deny_day) else 0
  - labor_list: XSUM('service','service_ro_lines','list_amount', repair_order_number=ro, line_letter=covered_line, event_type='service_labor_charged', pay_type='customer_pay')
  - comeback_credit: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_line_credited', credit_reason='comeback_repair')
  - labor_repaid: MN(labor_charged, standard_labor) if labor_charged < labor_list else (MN(labor_list - comeback_credit, standard_labor) if comeback_credit > 0 else standard_labor)
  - parts_list: XSUM('service','service_ro_lines','list_amount', repair_order_number=ro, line_letter=covered_line, event_type='service_parts_charged', pay_type='customer_pay')
  - parts_charged: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_parts_charged', pay_type='customer_pay')
  - goodwill_credit: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_line_credited', credit_reason='goodwill')
  - parts_repaid: parts_charged if parts_charged < parts_list else (parts_list - goodwill_credit if goodwill_credit > 0 else parts_list)
  - diag_fee: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_diagnostic_fee_charged')
  - diag_credit: XSUM('service','service_ro_lines','amount', repair_order_number=ro, line_letter=covered_line, event_type='service_line_credited', credit_reason='diagnostic_applied_to_repair')
  - diag_repaid: (diag_fee - diag_credit) if (diag_credit > 0 and diag_credit < diag_fee) else (0.0 if (diag_fee > 0 and diag_credit >= diag_fee) else diag_fee)
  - ro_store: XLATEST('service','service_ro_lines','store_id', date_field='line_date', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - deductible_chosen: float(F('deductible_option'))
  - billed_deductibles: XSUM('service','service_ro_lines','amount', repair_order_number=ro, event_type='service_labor_charged', pay_type='service_contract_deductible')
  - deductible_taken: 0.0 if (ro_store == F('selling_store_id') and P('disappearing_deductible_at_selling_dealer')) else (MX(0.0, deductible_chosen - billed_deductibles) if P('deductible_basis') == 'per_visit' else deductible_chosen)
  - ro_labor_all: XSUM('service','service_ro_lines','amount', repair_order_number=ro, event_type='service_labor_charged', pay_type='customer_pay')
  - supplies_fee: XSUM('service','service_ro_lines','amount', repair_order_number=ro, event_type='service_shop_fee_charged', fee_code='shop_supplies')
  - supplies_repaid: supplies_fee if (supplies_fee > 0 and ro_labor_all <= labor_charged) else (RND(supplies_fee * labor_charged / ro_labor_all + 0.000000001, 2) if supplies_fee > 0 else 0.0)
  - waste_fee: XSUM('service','service_ro_lines','amount', repair_order_number=ro, event_type='service_shop_fee_charged', fee_code='hazardous_waste')
  - waste_repaid: waste_fee if (waste_fee > 0 and ro_labor_all <= labor_charged) else (RND(waste_fee * labor_charged / ro_labor_all + 0.000000001, 2) if waste_fee > 0 else 0.0)
  - claims_net: SUM('vsc_ledger','amount', event_type='vsc_claim_paid') - SUM('vsc_ledger','amount', event_type='vsc_claim_reversed')
  - limit_left: P('aggregate_claim_limit_usd') - claims_net
  - result: RND(MN(MX(0.0, labor_repaid + parts_repaid + diag_repaid + supplies_repaid + waste_repaid - deductible_taken), limit_left) + 0.000000001, 2) if (maint_denials > 0 and lube_group == 1 and visit_proof == 1 and already_repaid == 0 and group_switch_on == 1 and waiting_over == 1 and in_term == 1 and diag_lines == 1 and labor_charged - comeback_credit > 0 and begun_after_claim == 1) else 0.0
  compute_basis:
    maint_denials: 'This policy applies to the contract''s latest component repair line denied for lack of maintenance (by decision date; where several were decided on the same day, the one that appears first in the contract''s claim history), where the line''s component group is an internally lubricated one (engine, transmission or drive axle) whose coverage switch is true for the coverage level, the latest visit redeemed on the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan) has not been reinstated and is dated on or before the repair order''s diagnosis date and fewer than the coverage level''s maintenance look-back months before it (the months counted as the difference between the two dates'' calendar months, less one where the diagnosis date''s day of the month is earlier than the visit''s), the waiting period is over or waived (the contract was sold on its vehicle''s purchase deal under a coverage level that waives it for such a contract, or the diagnosis date is more than the waiting-period days after the sale date and the line''s odometer is at least the waiting miles beyond the odometer at sale), the repair order''s diagnosis date is on or before the expiration date and the line''s odometer is at or below the expiration odometer, the repair order carries a diagnostic fee on exactly one concern line and the store''s customer-pay labor on that concern line, not wholly credited back as a comeback repair, and that labor was closed on or after the day the contract decided the line, which the records take as the repair not having begun before the claim number was issued (a maintenance re-decision line), and only to such a line: the contract repays the holder once, as one paid component-repair line under the same claim number, repair order and component group at the repair order''s odometer, and a denied line already repaid this way is not repaid again, while the base rules on active status and the aggregate claim limit still apply.'
