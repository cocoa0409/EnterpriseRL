  factors:
  - id: lube_labor_rule
    effect: method
    decides: labor_repaid
    bindings:
    - labor_list
    - comeback_credit
    - labor_repaid
    ladder:
    - when: for a maintenance re-decision line, the repaired line's labor was charged below its list amount
      method: the labor charged, never more than the standard labor amount (a lesser-of pick against the charged labor)
    - when: for a maintenance re-decision line, the labor was charged at list and part of it was credited as a comeback repair
      method: the list amount less the comeback credit, never more than the standard labor amount
    - when: otherwise
      method: 'the standard labor amount: hours billed times the posted rate capped at the coverage level''s labor-rate cap'
    baseline:
      labor_repaid: standard_labor
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: lube_parts_rule
    effect: parameter
    decides: parts_repaid
    bindings:
    - parts_list
    - parts_charged
    - goodwill_credit
    - parts_repaid
    ladder:
    - when: for a maintenance re-decision line, the repaired line's parts were charged below list
      value: the parts charged
    - when: for a maintenance re-decision line, the parts were charged at list and the store gave a goodwill credit on the repaired line
      value: the list amount less the goodwill credit
    - when: otherwise
      value: the list amount
    baseline:
      parts_repaid: parts_list
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: lube_diag_share
    effect: parameter
    decides: diag_repaid
    bindings:
    - diag_fee
    - diag_credit
    - diag_repaid
    ladder:
    - when: for a maintenance re-decision line, the store credited the repaired line's diagnostic fee in part
      value: the uncredited part of the fee
    - when: for a maintenance re-decision line, the store credited that fee in full
      value: '0.00'
    - when: otherwise
      value: the whole diagnostic fee
    baseline:
      diag_repaid: diag_fee
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: lube_visit_deductible
    effect: method
    decides: deductible_taken
    bindings:
    - ro_store
    - billed_deductibles
    - deductible_taken
    ladder:
    - when: for a maintenance re-decision line, the repair order was written at the store that sold the contract and the coverage level carries the disappearing deductible
      method: no deductible is taken
    - when: for a maintenance re-decision line, not that, and the coverage level takes its deductible once per repair visit
      method: the deductible chosen at sale less the contract deductibles the store already billed on that repair order, never below zero
    - when: otherwise
      method: the deductible chosen at sale taken once
    baseline:
      deductible_taken: deductible_chosen
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: service
  - id: lube_supplies_share
    effect: method
    decides: supplies_repaid
    bindings:
    - supplies_fee
    - supplies_repaid
    ladder:
    - when: for a maintenance re-decision line, a shop supplies fee was charged and every customer-pay labor charge on the repair order belongs to the repaired concern line
      method: the whole shop supplies fee
    - when: for a maintenance re-decision line, a shop supplies fee was charged and the repair order also carries customer-pay labor on other concern lines
      method: the fee times the repaired line's labor charge over all customer-pay labor charged, rounded to the cent
    - when: otherwise
      method: '0.00'
    baseline:
      supplies_repaid: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: lube_waste_share
    effect: method
    decides: waste_repaid
    bindings:
    - waste_fee
    - waste_repaid
    ladder:
    - when: for a maintenance re-decision line, a hazardous-waste fee was charged and every customer-pay labor charge on the repair order belongs to the repaired concern line
      method: the whole hazardous-waste fee
    - when: for a maintenance re-decision line, a hazardous-waste fee was charged and the repair order also carries customer-pay labor on other concern lines
      method: the fee times the repaired line's labor charge over all customer-pay labor charged, rounded to the cent
    - when: otherwise
      method: '0.00'
    baseline:
      waste_repaid: '0.0'
