    denied_group: 'For a traded-vehicle refund, the cancellation fee follows the holder''s standing with the group: where the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder holds a Kessler Owner Rewards Silver, Gold or Platinum service account in active status, the trade loyalty fee is taken; otherwise the coverage level''s cancellation fee is taken.'
