  factors:
  - id: cover_labor_rule
    effect: method
    decides: labor_repaid
    bindings:
    - labor_list
    - comeback_credit
    - labor_repaid
    ladder:
    - when: for a coverage re-decision line, the repaired line's labor was charged below its list amount
      method: the labor charged, never more than the standard labor amount (a lesser-of pick against the charged labor)
    - when: for a coverage re-decision line, the labor was charged at list and part of it was credited as a comeback repair
      method: the list amount less the comeback credit, never more than the standard labor amount
    - when: otherwise
      method: 'the standard labor amount: hours billed times the posted rate capped at the coverage level''s labor-rate cap'
    baseline:
      labor_repaid: standard_labor
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: cover_parts_rule
    effect: parameter
    decides: parts_repaid
    bindings:
    - parts_list
    - parts_charged
    - goodwill_credit
    - parts_repaid
    ladder:
    - when: for a coverage re-decision line, the repaired line's parts were charged below list
      value: the parts charged
    - when: for a coverage re-decision line, the parts were charged at list and the store gave a goodwill credit on the repaired line
      value: the list amount less the goodwill credit
    - when: otherwise
      value: the list amount
    baseline:
      parts_repaid: parts_list
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: cover_diag_share
    effect: parameter
    decides: diag_repaid
    bindings:
    - diag_fee
    - diag_credit
    - diag_repaid
    ladder:
    - when: for a coverage re-decision line, the store credited the repaired line's diagnostic fee in part
      value: the uncredited part of the fee
    - when: for a coverage re-decision line, the store credited that fee in full
      value: '0.00'
    - when: otherwise
      value: the whole diagnostic fee
    baseline:
      diag_repaid: diag_fee
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: cover_supplies_share
    effect: method
    decides: supplies_repaid
    bindings:
    - supplies_fee
    - supplies_repaid
    ladder:
    - when: for a coverage re-decision line, a shop supplies fee was charged and every customer-pay labor charge on the repair order belongs to the repaired concern line
      method: the whole shop supplies fee
    - when: for a coverage re-decision line, a shop supplies fee was charged and the repair order also carries customer-pay labor on other concern lines
      method: the fee times the repaired line's labor charge over all customer-pay labor charged, rounded to the cent
    - when: otherwise
      method: '0.00'
    baseline:
      supplies_repaid: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: cover_waste_share
    effect: method
    decides: waste_repaid
    bindings:
    - waste_fee
    - waste_repaid
    ladder:
    - when: for a coverage re-decision line, the repaired component is in the air-conditioning or cooling system and every customer-pay labor charge on the repair order belongs to the repaired concern line
      method: the whole hazardous-waste fee
    - when: for a coverage re-decision line, the repaired component is in the air-conditioning or cooling system and the repair order also carries customer-pay labor on other concern lines
      method: the fee times the repaired line's labor charge over all customer-pay labor charged, rounded to the cent
    - when: otherwise
      method: '0.00'
    baseline:
      waste_repaid: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  baseline:
    rule: The standard coverage re-decision repayment is the repaired concern line's labor at the hours billed times the store's posted labor rate capped at the coverage level's labor-rate cap, rounded half up to the cent, plus its parts at list price, plus its diagnostic fee, less the deductible chosen at sale, which is taken once for the visit and is not taken where the repair order was written at the store that sold the contract under a coverage level carrying the disappearing deductible, or where another component-repair line the contract paid on that repair order already took it under a coverage level that takes its deductible once per visit; shop fees on the repair order are not repaid.
    params:
    - labor_rate_cap_usd
    - aggregate_claim_limit_usd
  inputs:
    history:
    - table: vsc_ledger
      aggregate: latest
      field: repair_order_number
      filters:
        event_type: vsc_claim_denied
        claim_line_type: component_repair
        denial_reason: component_not_covered
    - table: vsc_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: vsc_claim_paid
    - category: service
      table: service_ro_lines
      aggregate: sum
      field: amount
      filters:
        pay_type: customer_pay
    cross_category:
    - service
- id: vsc_ext_traded_vehicle_refund
  base_policy_refs:
  - vsc_evt_cancellation_refund
  overwrite:
  - base_policy: vsc_evt_cancellation_refund
    superseded_clause: Otherwise the refund is pro rata (cancel_method pro_rata) — retail_price times the unused share, rounded to the cent, less cancellation_fee_usd, and less claims paid only where claims_deducted_from_refund is true.
    replaced_by: For a traded-vehicle refund, and only for such a refund, the pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the cancellation fee, never below 0.00, with no claims deducted, and it is recorded under the pro-rata basis; a kept-vehicle refund is fixed by its own rule, and every other pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the coverage level's cancellation fee (none on a total loss where the coverage level waives it), and less claims paid only where the coverage level deducts them, recorded under the pro-rata basis.
  - base_policy: vsc_evt_cancellation_refund
    superseded_clause: Under refund_basis lesser_of_time_or_mileage the unused share is the lesser of the unused time share (days from the effective date to expiration_date over days from term_start_date to expiration_date) and the unused mileage share (miles from the certified odometer to expiration_odometer over term_miles); under pro_rata_time only the time share is used; a share below 0 counts as 0 and, for a term counted from the in-service date, time and miles before the sale date count as used.
    replaced_by: 'For a traded-vehicle refund, and only for such a refund, the unused share is the lesser of the unused time share and the unused mileage share as measured here (the unused time share alone for a coverage level that refunds on time alone): the elapsed days are the calendar days from the term start date to the measuring day, the used days are the elapsed days less the credited days, never below zero, the unused time share is the days from the term start date to the expiration date less the used days over those days, the unused mileage share is the starting odometer plus the term miles less the reading over the term miles, a share below zero counts as zero, and for a term counted from the in-service date the time and miles before the sale date count as used; a kept-vehicle refund measures its unused share under its own rule, and every other refund''s unused share is, under the lesser-of basis, the lesser of the unused time share (the days from the effective date to the expiration date over the days from the term start date to the expiration date) and the unused mileage share (the miles from the certified odometer to the expiration odometer over the term miles), the time share alone under the time basis, a share below zero counting as zero and, for a term counted from the in-service date, time and miles before the sale date counting as used.'
  trigger: on_request
  subject:
  - vsc_contract_cancelled
  - vsc_refund_calculated
  computes: refund_amount
  target_tool: accept_traded_vehicle_cancellation_f71aca80
  params:
    trade_loyalty_fee: 25.0
  rule: 'This policy applies to a contract its holder cancels because the vehicle was sold or traded, on a signed cancellation request that gives that reason (a traded-vehicle cancellation), and only to such a cancellation: when the holder accepts the cancellation, the request is completed, the contract moves to cancelled effective on the request date, and the refund is recorded as due on that date at the odometer certified on the request under the refund basis that applies. The refund on a traded-vehicle cancellation is not computed until the contract''s latest component repair line denied for lack of maintenance (by decision date; on a same-day tie, the one that appears first in the claim history) has been re-decided and whatever that re-decision owes the holder has been paid, wherever that line is on an engine, transmission or drive axle whose coverage switch is true, the latest visit redeemed on the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan) is not reinstated and is dated on or before that line''s repair-order diagnosis and fewer than the coverage level''s maintenance look-back months before it (the difference between the two dates'' calendar months, less one where the diagnosis date''s day of the month is earlier than the visit''s), the waiting period is over or waived (the contract was sold on its vehicle''s purchase deal under a coverage level that waives it for such a contract, or the diagnosis date is more than the waiting-period days after the sale date and the line''s odometer is at least the waiting miles beyond the odometer at sale), the repair order''s diagnosis date and the line''s odometer fall within the term, and that repair order carries a diagnostic fee on exactly one concern line together with the store''s customer-pay labor on that concern line, not wholly credited back as a comeback repair, closed on or after the day the line was decided. The refund on a traded-vehicle cancellation is fixed only after the contract''s latest component repair line denied as not covered (by decision date; on a same-day tie, the one that appears first in the claim history) has been re-decided and whatever that re-decision owes the holder has been paid, wherever that line is on a component group that is not an internally lubricated one (engine, transmission or drive axle) and whose coverage switch is true, the waiting period is over or waived (the contract was sold on its vehicle''s purchase deal under a coverage level that waives it for such a contract, or the diagnosis date is more than the waiting-period days after the sale date and the line''s odometer is at least the waiting miles beyond the odometer at sale), the repair order''s diagnosis date and the line''s odometer fall within the term, and that repair order carries a diagnostic fee on exactly one concern line together with the store''s customer-pay labor on that concern line, not wholly credited back as a comeback repair, closed on or after the day the line was decided. For a traded-vehicle refund, a contract cancelled within the coverage level''s free-look days after its sale date with no claim paid (claims paid less reversals at zero) is refunded its full retail price, a contract sold on a purchase deal that has been unwound is refunded its full retail price, and these flat refunds take precedence over the pro-rata refund. The standard traded-vehicle refund is the retail price times the unused share, rounded half up to the cent, less the coverage level''s cancellation fee and never below 0.00; the unused share is the lesser of the unused time share, the days from the effective date to the expiration date over the days from the term start date to the expiration date, and the unused mileage share, the miles from the certified odometer to the expiration odometer over the term miles; a coverage level that refunds on time alone uses the unused time share only, and a share below zero counts as zero. For a traded-vehicle refund, the term is used up to a measuring day: where the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan) carries a refund calculated on a cancellation for the vehicle being sold or traded, dated after this contract''s sale date and on or before the request date, the date of that refund calculation (where several exist, the latest; on a same-day tie, the one listed first); where none does and the GAP waiver sold on the contract''s purchase deal (a contract sold on its own has none) records the loan paid off on a date after this contract''s sale date and on or before the request date, that payoff date; otherwise the effective date. For a traded-vehicle refund, the unused mileage share is measured at a reading: where the latest refund calculated on a cancellation for the vehicle being sold or traded of the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan) records an odometer above the certified one, that odometer; where none does and the latest repair order a group store wrote for the vehicle (the one whose labor was closed last; where two closed labor on the same day, the one listed first in the service records) records an odometer above the certified one, that repair-order odometer; otherwise the certified odometer. For a traded-vehicle refund, the term miles run from a starting odometer: where the contract''s term counts from its sale date and it was sold on a purchase deal delivered after the contract''s sale date with a delivery odometer above the odometer at sale, that delivery odometer; where its term counts from its sale date and it was sold on a purchase deal delivered to the holder''s address on or before the sale date, the odometer at sale plus the deal''s one-way delivery distance; otherwise, including every term counted from the vehicle''s in-service date, the term start odometer. For a traded-vehicle refund, days of the term the holder could not use are credited: where the contract was sold on a purchase deal delivered after the contract''s sale date, the days from the sale date to the delivery date; where the contract was sold on its own with no purchase deal, the coverage level''s waiting-period days; otherwise none. For a traded-vehicle refund, the cancellation fee follows the holder''s standing with the group: where the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder holds a Kessler Owner Rewards Silver, Gold or Platinum service account in active status, the trade loyalty fee is taken; otherwise the coverage level''s cancellation fee is taken. For a traded-vehicle refund, and only for such a refund, the unused share is the lesser of the unused time share and the unused mileage share as measured here (the unused time share alone for a coverage level that refunds on time alone): the elapsed days are the calendar days from the term start date to the measuring day, the used days are the elapsed days less the credited days, never below zero, the unused time share is the days from the term start date to the expiration date less the used days over those days, the unused mileage share is the starting odometer plus the term miles less the reading over the term miles, a share below zero counts as zero, and for a term counted from the in-service date the time and miles before the sale date count as used; a kept-vehicle refund measures its unused share under its own rule, and every other refund''s unused share is, under the lesser-of basis, the lesser of the unused time share (the days from the effective date to the expiration date over the days from the term start date to the expiration date) and the unused mileage share (the miles from the certified odometer to the expiration odometer over the term miles), the time share alone under the time basis, a share below zero counting as zero and, for a term counted from the in-service date, time and miles before the sale date counting as used. For a traded-vehicle refund, and only for such a refund, the pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the cancellation fee, never below 0.00, with no claims deducted, and it is recorded under the pro-rata basis; a kept-vehicle refund is fixed by its own rule, and every other pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the coverage level''s cancellation fee (none on a total loss where the coverage level waives it), and less claims paid only where the coverage level deducts them, recorded under the pro-rata basis.'
  prerequisite:
  - problem: vsc_ext_maintenance_denial_reimbursement
    kind: value_input
    gate: redecided_count
    form: action
    policy_source: The refund on a traded-vehicle cancellation is not computed until the contract's latest component repair line denied for lack of maintenance (by decision date; on a same-day tie, the one that appears first in the claim history) has been re-decided and whatever that re-decision owes the holder has been paid, wherever that line is on an engine, transmission or drive axle whose coverage switch is true, the latest visit redeemed on the Kessler Care plan sold on the contract's purchase deal (a contract sold on its own has no such plan) is not reinstated and is dated on or before that line's repair-order diagnosis and fewer than the coverage level's maintenance look-back months before it (the difference between the two dates' calendar months, less one where the diagnosis date's day of the month is earlier than the visit's), the waiting period is over or waived (the contract was sold on its vehicle's purchase deal under a coverage level that waives it for such a contract, or the diagnosis date is more than the waiting-period days after the sale date and the line's odometer is at least the waiting miles beyond the odometer at sale), the repair order's diagnosis date and the line's odometer fall within the term, and that repair order carries a diagnostic fee on exactly one concern line together with the store's customer-pay labor on that concern line, not wholly credited back as a comeback repair, closed on or after the day the line was decided.
    condition: 'For the contract''s latest vsc_claim_denied component_repair line with denial_reason lack_of_maintenance (first listed on a same-day tie), where its group is engine/transmission/drive_axle with its covers_ switch true, the latest non-reinstated maintenance_visit_redeemed entry of the plan sold on the contract''s deal is dated on or before the RO diagnosis date with MONTHS(visit, diagnosis) < maintenance_proof_lookback_months, the waiting period is over or waived, the RO is within the term and carries exactly one service_diagnostic_fee_charged row and customer-pay labor on that line, net of comeback credit above zero, closed on or after the denial''s entry_date: the re-decision is made, leaving a vsc_claim_paid component_repair line under its claim number where it owes a positive amount and no line where it owes nothing. A latest lack_of_maintenance denial outside those tests is outside the wait.'
    resolved_by: reimburse_maintenance_denial_repair_6315e699
    effect: Once the lack-of-maintenance line is repaid, the contract's latest denied claim line carries a paid component-repair line, which sets the traded-vehicle cancellation fee to none instead of the trade loyalty fee.
    fallback_reason: A re-decision that repays nothing books no line, so no record state tells a decided line from an undecided one; the wait can only be stated as the re-decision itself being completed.
  - problem: vsc_ext_coverage_denial_reimbursement
    kind: state_gate
    gate: vsc_ledger.claim_line_type
    form: action
    policy_source: The refund on a traded-vehicle cancellation is fixed only after the contract's latest component repair line denied as not covered (by decision date; on a same-day tie, the one that appears first in the claim history) has been re-decided and whatever that re-decision owes the holder has been paid, wherever that line is on a component group that is not an internally lubricated one (engine, transmission or drive axle) and whose coverage switch is true, the waiting period is over or waived (the contract was sold on its vehicle's purchase deal under a coverage level that waives it for such a contract, or the diagnosis date is more than the waiting-period days after the sale date and the line's odometer is at least the waiting miles beyond the odometer at sale), the repair order's diagnosis date and the line's odometer fall within the term, and that repair order carries a diagnostic fee on exactly one concern line together with the store's customer-pay labor on that concern line, not wholly credited back as a comeback repair, closed on or after the day the line was decided.
    condition: 'For the contract''s latest vsc_claim_denied component_repair line with denial_reason component_not_covered (first listed on a same-day tie), where its group is not engine/transmission/drive_axle and its covers_ switch is true, the waiting period is over or waived, the RO is within the term and carries exactly one service_diagnostic_fee_charged row and customer-pay labor on that line, net of comeback credit above zero, closed on or after the denial''s entry_date: the re-decision is made, leaving a vsc_claim_paid component_repair line under its claim number where it owes a positive amount and no line where it owes nothing. A latest component_not_covered denial outside those tests is outside the wait.'
    resolved_by: reimburse_coverage_denial_repair_73971dca
    effect: Once the wrongly denied covered line is repaid, no line the contract owes on its claims remains open, so the cancellation can be processed and the contract stops paying claims.
    fallback_reason: A re-decision that repays nothing books no line, so no record state tells a decided line from an undecided one; the wait can only be stated as the re-decision itself being completed.
  cross_category:
  - category: purchase
    as: branch
    reads:
    - status
    - delivery_date
    - odometer_at_delivery
    - delivery_method
    - delivery_distance_miles
    note: The deal the contract was sold on decides the starting odometer and the credited days.
  - category: service
    as: history
    reads:
    - service_ro_lines.odometer_in
    - variant_name
    - status
    note: The latest group repair order's odometer is the second reading tier; the Owner Rewards account decides the loyalty fee tier.
  - category: maintenance
    as: history
    reads:
    - maintenance_plan_id
    - maintenance_plan_ledger.entry_date
    - maintenance_plan_ledger.odometer
    - maintenance_plan_ledger.cancel_reason
    note: The sold-or-traded cancellation of the Kessler Care plan sold on the contract's deal decides the measuring day and the first reading tier.
  - category: gap
    as: branch
    reads:
    - loan_payoff_date
    note: A loan payoff recorded on the GAP waiver sold on the contract's deal is the second measuring-day tier.
  compute:
  - request_day: LATEST('vsc_cancellation_requests','request_date', date_field='request_date', request_status='submitted', cancel_reason='vehicle_sold_or_traded')
  - certified: float(LATEST('vsc_cancellation_requests','odometer_at_request', date_field='request_date', request_status='submitted', cancel_reason='vehicle_sold_or_traded') or 0)
  - claims_net: SUM('vsc_ledger','amount', event_type='vsc_claim_paid') - SUM('vsc_ledger','amount', event_type='vsc_claim_reversed')
  - deal_status: CFIELD('purchase','status', purchase_deal_id=F('purchase_deal_id'))
  - plan_id: (CFIELD('maintenance','maintenance_plan_id', purchase_deal_id=F('purchase_deal_id'))) if (F('purchase_deal_id') or '') != '' else None
  - plan_cancel_day: XLATEST('maintenance','maintenance_plan_ledger','entry_date', date_field='entry_date', maintenance_plan_id=plan_id, event_type='maintenance_refund_calculated', cancel_reason='vehicle_sold_or_traded')
  - gap_payoff_day: (CFIELD('gap','loan_payoff_date', purchase_deal_id=F('purchase_deal_id'))) if (F('purchase_deal_id') or '') != '' else None
  - measure_day: plan_cancel_day if (plan_cancel_day and plan_cancel_day > F('sale_date') and plan_cancel_day <= request_day) else (gap_payoff_day if (gap_payoff_day and gap_payoff_day > F('sale_date') and gap_payoff_day <= request_day) else request_day)
  - reading_plan: (CFIELD('maintenance','maintenance_plan_id', purchase_deal_id=F('purchase_deal_id'))) if (F('purchase_deal_id') or '') != '' else None
  - cancel_odometer: XLATEST('maintenance','maintenance_plan_ledger','odometer', date_field='entry_date', maintenance_plan_id=reading_plan, event_type='maintenance_refund_calculated', cancel_reason='vehicle_sold_or_traded')
  - ro_reading: XLATEST('service','service_ro_lines','odometer_in', date_field='line_date', vehicle_id=F('vehicle_id'), event_type='service_labor_charged')
  - reading: float(cancel_odometer) if ((cancel_odometer != None and cancel_odometer != '') and float(cancel_odometer) > certified) else (float(ro_reading) if ((ro_reading != None and ro_reading != '') and float(ro_reading) > certified) else certified)
  - deal_delivery: CFIELD('purchase','delivery_date', purchase_deal_id=F('purchase_deal_id'))
  - delivered_late: (deal_delivery != None and deal_delivery != '') and deal_delivery > F('sale_date')
  - deal_odometer: CFIELD('purchase','odometer_at_delivery', purchase_deal_id=F('purchase_deal_id'))
  - deal_method: CFIELD('purchase','delivery_method', purchase_deal_id=F('purchase_deal_id'))
  - deal_distance: CFIELD('purchase','delivery_distance_miles', purchase_deal_id=F('purchase_deal_id'))
  - run_from: float(deal_odometer) if (P('term_start_basis') == 'sale_date' and delivered_late and float(deal_odometer or 0) > F('odometer_at_sale')) else (F('odometer_at_sale') + float(deal_distance or 0) if (P('term_start_basis') == 'sale_date' and deal_method == 'home_delivery' and (deal_delivery != None and deal_delivery != '') and deal_delivery <= F('sale_date')) else F('term_start_odometer'))
  - mileage_share: MX(0.0, (run_from + F('term_miles') - reading) / F('term_miles'))
  - credited_days: DAYS(F('sale_date'), deal_delivery) if delivered_late else (P('waiting_period_days') if (F('purchase_deal_id') == '' or F('purchase_deal_id') == None) else 0)
  - term_days: DAYS(F('term_start_date'), F('expiration_date'))
  - elapsed_days: MX(0, DAYS(F('term_start_date'), measure_day))
  - used_days: MX(0, elapsed_days - credited_days)
  - time_share: MX(0.0, (term_days - used_days) / term_days)
  - unused_share: time_share if P('refund_basis') == 'pro_rata_time' else MN(time_share, mileage_share)
  - denied_claim: LATEST('vsc_ledger','claim_number', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair')
  - denied_ro: LATEST('vsc_ledger','repair_order_number', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair')
  - denied_group: LATEST('vsc_ledger','component_group', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair')
  - denied_day: LATEST('vsc_ledger','entry_date', date_field='entry_date', event_type='vsc_claim_denied', claim_line_type='component_repair')
  - repaid_day: LATEST('vsc_ledger','entry_date', date_field='entry_date', event_type='vsc_claim_paid', claim_line_type='component_repair', claim_number=denied_claim, repair_order_number=denied_ro, component_group=denied_group)
  - redecided_count: COUNT('vsc_ledger', event_type='vsc_claim_paid', claim_line_type='component_repair', claim_number=denied_claim, repair_order_number=denied_ro, component_group=denied_group) if (repaid_day and denied_day and repaid_day >= denied_day) else 0
  - account_tier: CFIELD('service','variant_name', status='active')
  - cancel_fee: 0.0 if redecided_count > 0 else (K('trade_loyalty_fee') if (account_tier == 'Kessler Owner Rewards Silver' or account_tier == 'Kessler Owner Rewards Gold' or account_tier == 'Kessler Owner Rewards Platinum') else P('cancellation_fee_usd'))
  - flat_look: DAYS(F('sale_date'), request_day) <= P('free_look_days') and claims_net <= 0.005
  - result: F('retail_price') if (deal_status == 'unwound' or flat_look) else RND(MX(0.0, RND(F('retail_price') * unused_share + 0.000000001, 2) - cancel_fee) + 0.000000001, 2)
