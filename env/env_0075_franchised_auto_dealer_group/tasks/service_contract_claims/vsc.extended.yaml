    unused_share: 'For a traded-vehicle refund, and only for such a refund, the unused share is the lesser of the unused time share and the unused mileage share as measured here (the unused time share alone for a coverage level that refunds on time alone): the elapsed days are the calendar days from the term start date to the measuring day, the used days are the elapsed days less the credited days, never below zero, the unused time share is the days from the term start date to the expiration date less the used days over those days, the unused mileage share is the starting odometer plus the term miles less the reading over the term miles, a share below zero counts as zero, and for a term counted from the in-service date the time and miles before the sale date count as used; a kept-vehicle refund measures its unused share under its own rule, and every other refund''s unused share is, under the lesser-of basis, the lesser of the unused time share (the days from the effective date to the expiration date over the days from the term start date to the expiration date) and the unused mileage share (the miles from the certified odometer to the expiration odometer over the term miles), the time share alone under the time basis, a share below zero counting as zero and, for a term counted from the in-service date, time and miles before the sale date counting as used.'
    denied_claim: 'For a traded-vehicle refund, the cancellation fee follows the holder''s standing with the group: where the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder holds a Kessler Owner Rewards Silver, Gold or Platinum service account in active status, the trade loyalty fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    redecided_count: 'For a traded-vehicle refund, the cancellation fee follows the holder''s standing with the group: where the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder holds a Kessler Owner Rewards Silver, Gold or Platinum service account in active status, the trade loyalty fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    account_tier: 'For a traded-vehicle refund, the cancellation fee follows the holder''s standing with the group: where the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder holds a Kessler Owner Rewards Silver, Gold or Platinum service account in active status, the trade loyalty fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    cancel_fee: 'For a traded-vehicle refund, the cancellation fee follows the holder''s standing with the group: where the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder holds a Kessler Owner Rewards Silver, Gold or Platinum service account in active status, the trade loyalty fee is taken; otherwise the coverage level''s cancellation fee is taken.'
    flat_look: For a traded-vehicle refund, a contract cancelled within the coverage level's free-look days after its sale date with no claim paid (claims paid less reversals at zero) is refunded its full retail price, a contract sold on a purchase deal that has been unwound is refunded its full retail price, and these flat refunds take precedence over the pro-rata refund.
    result: For a traded-vehicle refund, and only for such a refund, the pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the cancellation fee, never below 0.00, with no claims deducted, and it is recorded under the pro-rata basis; a kept-vehicle refund is fixed by its own rule, and every other pro-rata refund is the retail price times the unused share, rounded half up to the cent, less the coverage level's cancellation fee (none on a total loss where the coverage level waives it), and less claims paid only where the coverage level deducts them, recorded under the pro-rata basis.
    gap_payoff_day: 'For a traded-vehicle refund, the term is used up to a measuring day: where the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan) carries a refund calculated on a cancellation for the vehicle being sold or traded, dated after this contract''s sale date and on or before the request date, the date of that refund calculation (where several exist, the latest; on a same-day tie, the one listed first); where none does and the GAP waiver sold on the contract''s purchase deal (a contract sold on its own has none) records the loan paid off on a date after this contract''s sale date and on or before the request date, that payoff date; otherwise the effective date.'
    reading_plan: 'For a traded-vehicle refund, the unused mileage share is measured at a reading: where the latest refund calculated on a cancellation for the vehicle being sold or traded of the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan) records an odometer above the certified one, that odometer; where none does and the latest repair order a group store wrote for the vehicle (the one whose labor was closed last; where two closed labor on the same day, the one listed first in the service records) records an odometer above the certified one, that repair-order odometer; otherwise the certified odometer.'
    cancel_odometer: 'For a traded-vehicle refund, the unused mileage share is measured at a reading: where the latest refund calculated on a cancellation for the vehicle being sold or traded of the Kessler Care plan sold on the contract''s purchase deal (a contract sold on its own has no such plan) records an odometer above the certified one, that odometer; where none does and the latest repair order a group store wrote for the vehicle (the one whose labor was closed last; where two closed labor on the same day, the one listed first in the service records) records an odometer above the certified one, that repair-order odometer; otherwise the certified odometer.'
