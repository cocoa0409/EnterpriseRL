    diag_fee: 'For a maintenance re-decision line, and only for such a line, the diagnostic fee repaid is the part of it the holder was left to pay: where the store credited the repaired line''s diagnostic fee in part, the uncredited part; where it credited that fee in full, nothing; otherwise the whole fee; a waiting-period re-decision line and a coverage re-decision line take the diagnostic fee their own rules set, and every other claim line has its diagnosis and teardown time paid with the line where the coverage level pays diagnosis and teardown on a covered failure and the failure is covered.'
    diag_credit: 'For a maintenance re-decision line, and only for such a line, the diagnostic fee repaid is the part of it the holder was left to pay: where the store credited the repaired line''s diagnostic fee in part, the uncredited part; where it credited that fee in full, nothing; otherwise the whole fee; a waiting-period re-decision line and a coverage re-decision line take the diagnostic fee their own rules set, and every other claim line has its diagnosis and teardown time paid with the line where the coverage level pays diagnosis and teardown on a covered failure and the failure is covered.'
    diag_repaid: 'For a maintenance re-decision line, and only for such a line, the diagnostic fee repaid is the part of it the holder was left to pay: where the store credited the repaired line''s diagnostic fee in part, the uncredited part; where it credited that fee in full, nothing; otherwise the whole fee; a waiting-period re-decision line and a coverage re-decision line take the diagnostic fee their own rules set, and every other claim line has its diagnosis and teardown time paid with the line where the coverage level pays diagnosis and teardown on a covered failure and the failure is covered.'
    ro_store: 'For a maintenance re-decision line, and only for such a line, the deductible taken follows the visit''s record: where the repair order was written at the store that sold the contract and the coverage level carries the disappearing deductible, none; where that is not so and the coverage level takes its deductible once per repair visit, the deductible chosen at sale less the contract deductibles the store already billed the holder on that repair order, never below zero; otherwise the deductible chosen at sale once; a waiting-period re-decision line follows its own deductible rule, and every other claim line takes the deductible chosen at sale under the coverage level''s deductible basis (once per repair visit, or once per component group repaired), with none taken where the coverage level carries the disappearing deductible and the repair is done at the selling store.'
    deductible_chosen: The standard maintenance re-decision repayment is the repaired concern line's labor at the hours billed times the store's posted labor rate capped at the coverage level's labor-rate cap, rounded half up to the cent, plus its parts at list price, plus its diagnostic fee, less the deductible chosen at sale taken once for the visit; shop fees on the repair order are not repaid.
    deductible_taken: 'For a maintenance re-decision line, and only for such a line, the deductible taken follows the visit''s record: where the repair order was written at the store that sold the contract and the coverage level carries the disappearing deductible, none; where that is not so and the coverage level takes its deductible once per repair visit, the deductible chosen at sale less the contract deductibles the store already billed the holder on that repair order, never below zero; otherwise the deductible chosen at sale once; a waiting-period re-decision line follows its own deductible rule, and every other claim line takes the deductible chosen at sale under the coverage level''s deductible basis (once per repair visit, or once per component group repaired), with none taken where the coverage level carries the disappearing deductible and the repair is done at the selling store.'
    ro_labor_all: 'For a maintenance re-decision line, the shop supplies fee repaid follows the labor on the repair order: where a shop supplies fee was charged and every customer-pay labor charge on the repair order belongs to the repaired concern line, the whole fee; where a shop supplies fee was charged and the repair order also carries customer-pay labor on other concern lines, the fee in the proportion the repaired line''s labor charge bears to all customer-pay labor charged on the repair order, rounded half up to the cent; otherwise none.'
