    deny_day: 'This policy applies to the contract''s latest component repair line denied for the waiting period (by decision date; where several were decided on the same day, the one that appears first in the contract''s claim history), where the contract was sold on its vehicle''s purchase deal, the line''s component group is not an internally lubricated one (engine, transmission or drive axle) and its coverage switch is true for the coverage level, the repair order''s diagnosis date is on or before the expiration date and the line''s odometer is at or below the expiration odometer, the repair order carries a diagnostic fee on exactly one concern line and the store''s customer-pay labor on that concern line, not wholly credited back as a comeback repair, and that labor was closed on or after the day the contract decided the line, which the records take as the repair not having begun before the claim number was issued (a waiting-period re-decision line), and only to such a line: the contract pays the holder back once, as one paid component-repair line under the same claim number, repair order and component group at the repair order''s odometer, and a denied line already paid this way is not paid again, while the base rules on active status and the aggregate claim limit still apply.'
