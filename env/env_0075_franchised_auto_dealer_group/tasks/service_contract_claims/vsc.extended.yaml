    deductible_taken: 'For a waiting-period re-decision line, and only for such a line, the deductible taken follows the visit''s own record: where the repair order was written at the store that sold the contract and the coverage level carries the disappearing deductible, none; where that is not so and the coverage level takes its deductible once per repair visit, the deductible chosen at sale less the contract deductibles the store already billed the holder on that repair order, never below zero; otherwise the deductible chosen at sale once; a maintenance re-decision line follows its own deductible rule, and every other claim line takes the deductible chosen at sale under the coverage level''s deductible basis (once per repair visit, or once per component group repaired), with none taken where the coverage level carries the disappearing deductible and the repair is done at the selling store.'
    ro_labor_all: 'For a waiting-period re-decision line, the shop supplies fee reimbursed follows the labor on the repair order: where a shop supplies fee was charged and every customer-pay labor charge on the repair order belongs to the covered concern line, the fee is reimbursed in full; where a shop supplies fee was charged and the repair order also carries customer-pay labor on other concern lines, the fee is reimbursed in the proportion the covered concern line''s labor charge bears to all customer-pay labor charged on the repair order, rounded half up to the cent; otherwise no shop supplies fee is reimbursed.'
    supplies_fee: 'For a waiting-period re-decision line, the shop supplies fee reimbursed follows the labor on the repair order: where a shop supplies fee was charged and every customer-pay labor charge on the repair order belongs to the covered concern line, the fee is reimbursed in full; where a shop supplies fee was charged and the repair order also carries customer-pay labor on other concern lines, the fee is reimbursed in the proportion the covered concern line''s labor charge bears to all customer-pay labor charged on the repair order, rounded half up to the cent; otherwise no shop supplies fee is reimbursed.'
