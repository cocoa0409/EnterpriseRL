    hazwaste_reimbursed: 'For a waiting-period re-decision line, the hazardous-waste fee reimbursed follows the system repaired: where the covered repair is on the air-conditioning or cooling system and every customer-pay labor charge on the repair order belongs to the covered concern line, the hazardous-waste fee charged is reimbursed in full; where the covered repair is on one of those systems and the repair order also carries customer-pay labor on other concern lines, that fee is reimbursed in the proportion the covered concern line''s labor charge bears to all customer-pay labor charged on the repair order, rounded half up to the cent; otherwise no hazardous-waste fee is reimbursed.'
