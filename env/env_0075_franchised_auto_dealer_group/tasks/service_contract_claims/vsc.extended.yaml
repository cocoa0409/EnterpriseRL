  factors:
  - id: covered_labor_basis
    effect: method
    decides: labor_reimbursed
    bindings:
    - labor_list
    - comeback_credit
    - labor_reimbursed
    ladder:
    - when: the covered labor was charged below its list amount
      method: the labor actually charged, never more than the standard labor amount (a lesser-of pick against the charged labor)
    - when: the covered labor was charged at its list amount and carries a comeback credit
      method: the list amount less the comeback credit, never more than the standard labor amount
    - when: otherwise
      method: 'the standard labor amount: hours billed times the posted rate capped at the coverage level''s labor-rate cap'
    baseline:
      labor_reimbursed: standard_labor
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: covered_parts_basis
    effect: parameter
    decides: parts_reimbursed
    bindings:
    - parts_list
    - parts_charged
    - goodwill_credit
    - parts_reimbursed
    ladder:
    - when: the covered parts were charged below list
      value: the parts actually charged
    - when: the covered parts were charged at list and a goodwill credit was given on the covered concern line
      value: the list amount less the goodwill credit
    - when: otherwise
      value: the list amount
    baseline:
      parts_reimbursed: parts_list
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: diagnostic_credit_share
    effect: parameter
    decides: diag_reimbursed
    bindings:
    - diag_fee
    - diag_credit
    - diag_reimbursed
    ladder:
    - when: the store credited the covered concern line's diagnostic fee in full
      value: '0.00'
    - when: the store credited part of the diagnostic fee
      value: the uncredited part of the fee
    - when: otherwise
      value: the whole diagnostic fee
    baseline:
      diag_reimbursed: diag_fee
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: visit_deductible_rule
    effect: method
    decides: deductible_taken
    bindings:
    - ro_store
    - billed_deductibles
    - deductible_taken
    ladder:
    - when: for a waiting-period re-decision line, the repair order was written at the store that sold the contract and the coverage level carries the disappearing deductible
      method: no deductible is taken
    - when: for a waiting-period re-decision line, not that, and the coverage level takes its deductible once per repair visit
      method: the deductible chosen at sale less the contract deductibles the store already billed on that repair order, never below zero
    - when: otherwise
      method: the deductible chosen at sale taken once
    baseline:
      deductible_taken: deductible_chosen
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: service
  - id: shop_supplies_share
    effect: method
    decides: supplies_reimbursed
    bindings:
    - supplies_fee
    - supplies_reimbursed
    ladder:
    - when: a shop supplies fee was charged and every customer-pay labor charge on the repair order belongs to the covered concern line
      method: the shop supplies fee charged
    - when: a shop supplies fee was charged and the repair order also carries customer-pay labor on other concern lines
      method: the fee times the covered concern line's labor charge over all customer-pay labor charged, rounded to the cent
    - when: otherwise
      method: '0.00'
    baseline:
      supplies_reimbursed: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: hazwaste_fee_share
    effect: method
    decides: hazwaste_reimbursed
    bindings:
    - hazwaste_fee
    - hazwaste_reimbursed
    ladder:
    - when: the covered repair is on the air-conditioning or cooling system and every customer-pay labor charge on the repair order belongs to the covered concern line
      method: the hazardous-waste fee charged
    - when: the covered repair is on the air-conditioning or cooling system and the repair order also carries customer-pay labor on other concern lines
      method: the fee times the covered concern line's labor charge over all customer-pay labor charged, rounded to the cent
    - when: otherwise
      method: '0.00'
    baseline:
      hazwaste_reimbursed: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  baseline:
    rule: The standard waiting-period re-decision reimbursement is the covered concern line's labor at the hours billed times the store's posted labor rate capped at the coverage level's labor-rate cap, rounded half up to the cent, plus its parts at list price, plus its diagnostic fee, less the deductible chosen at sale taken once for the visit; shop fees on the repair order are not reimbursed.
    params:
    - labor_rate_cap_usd
    - aggregate_claim_limit_usd
  inputs:
    history:
    - table: vsc_ledger
      aggregate: latest
      field: repair_order_number
      filters:
        event_type: vsc_claim_denied
        claim_line_type: component_repair
        denial_reason: waiting_period
    - table: vsc_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: vsc_claim_paid
    - category: service
      table: service_ro_lines
      aggregate: sum
      field: amount
      filters:
        pay_type: customer_pay
    cross_category:
    - service
- id: vsc_ext_claim_rental_reimbursement
  base_policy_refs:
  - vsc_agg_vehicle_and_limit
  - vsc_evt_claim_payment
  - vsc_evt_waiting_period
  - vsc_evt_claim_benefits
  - vsc_evt_maintenance_proof
  - vsc_combo_factory_warranty
  overwrite:
  - base_policy: vsc_evt_claim_benefits
    superseded_clause: Rental is reimbursed at rental_per_day_usd per calendar day the vehicle is at the store for the covered repair, from the day the repair order is opened to the day the repair is completed, up to rental_max_days_per_claim days per claim (vsc_msr_rental_days_paid_on_claim); a courtesy loaner the store provides free of charge is not reimbursed.
    replaced_by: For a rental line this policy pays, and only for such a line, the days paid are the days from the start day to the end day, both counted, less the days the store gave free, never below zero, then capped at the coverage level's most rental days per claim less the rental days already paid on the claim; the line pays the amount per day times the days paid, never more than the part of the coverage level's aggregate claim limit the contract has not paid out (claims paid less reversals), rounded half up to the cent; every rental this policy does not price — on any other claim, under a loaner agreement other than the first one listed for the repair order, on a loaner the holder was not charged for, or from outside the group — is reimbursed at the coverage level's rental amount per day for each calendar day the vehicle is at the store for the covered repair, from the day the repair order is opened to the day the repair is completed, up to the coverage level's most rental days per claim counting the rental days already paid on the claim, and a courtesy loaner the store provides free of charge is not reimbursed.
  trigger: state_due
  subject:
  - vsc_claim_paid
  computes: amount
  target_tool: pay_claim_rental_line_3f5378a0
  params: {}
  rule: 'This policy applies to the rental benefit of the claim of the contract''s latest component-repair line, paid or denied (by entry date; where several were entered on the same day, the one that appears first in the contract''s claim history), where the first loaner agreement the loaner records list for its repair order is a Kessler loaner on which the holder was charged daily rental, and only to such a claim: where that claim carries a paid component-repair line, the rental is paid as one rental line under the same claim number and repair order at the repair order''s odometer, recording the days paid, with no deductible; where it carries none, its rental benefit is settled with nothing owed and no rental line is booked, since benefits beyond the repair are paid only together with a covered component repair; and a coverage level whose rental amount per day or rental day limit is 0 has no rental benefit. A rental line is booked only after the records carry a paid component-repair line under the same claim number. The standard rental is the coverage level''s rental amount per day times the calendar days from the day of the repair order''s diagnosis to the day of its last labor line, both days counted, up to the coverage level''s most rental days per claim. Rental days are counted from a start day: where the loaner went out after the day of the repair order''s diagnosis, the day the loaner went out; where the loaner went out on that day and a line of the claim was denied after it, the day of the claim''s latest denial (by decision date; several lines denied on that same day share it); otherwise the day of the repair order''s diagnosis. Rental days are counted to an end day: where the loaner came back before the last labor line of the claim''s covered concern line (the one concern line of that repair order that carries its diagnostic fee, where exactly one does), the day the loaner came back; where it did not and that concern line''s last labor line came before the repair order''s last labor line, the day of that concern line''s last labor line; otherwise the day of the repair order''s last labor line. Days the store gave free are not reimbursed: where the loaner was a dealer-courtesy loaner under a program that includes courtesy days and the holder''s service account is a Kessler Owner Rewards Gold or Kessler Owner Rewards Platinum account in active status, the program''s courtesy days plus its rewards bonus days; where the loaner was a dealer-courtesy loaner under a program that includes courtesy days and no such account applies, the program''s courtesy days; otherwise none. The amount per day follows what the loaner cost: where the loaner was issued under a service-contract allowance with a daily allowance above zero, that daily allowance; where the holder was charged a daily rental rate below the coverage level''s rental amount per day, that daily rate; otherwise the coverage level''s rental amount per day. For a rental line this policy pays, and only for such a line, the days paid are the days from the start day to the end day, both counted, less the days the store gave free, never below zero, then capped at the coverage level''s most rental days per claim less the rental days already paid on the claim; the line pays the amount per day times the days paid, never more than the part of the coverage level''s aggregate claim limit the contract has not paid out (claims paid less reversals), rounded half up to the cent; every rental this policy does not price — on any other claim, under a loaner agreement other than the first one listed for the repair order, on a loaner the holder was not charged for, or from outside the group — is reimbursed at the coverage level''s rental amount per day for each calendar day the vehicle is at the store for the covered repair, from the day the repair order is opened to the day the repair is completed, up to the coverage level''s most rental days per claim counting the rental days already paid on the claim, and a courtesy loaner the store provides free of charge is not reimbursed.'
  prerequisite:
  - problem: vsc_ext_waiting_denial_reimbursement
    kind: state_gate
    gate: vsc_ledger.claim_line_type
    form: state
    policy_source: A rental line is booked only after the records carry a paid component-repair line under the same claim number.
    condition: The contract's ledger carries a vsc_claim_paid entry with claim_line_type component_repair under the claim number the rental line will carry.
    resolved_by: reimburse_waiting_denial_repair_5808cf06
    effect: Once the component-repair line of the claim stands paid, the claim qualifies for its rental line; before it, a rental line has no paid covered repair to accompany.
  cross_category:
  - category: service
    as: history
    reads:
    - service_ro_lines.line_date
    - service_ro_lines.line_letter
    - service_accounts.variant_name
    - service_accounts.status
    note: The repair order's diagnosis and labor dates fix the rental window, and the Owner Rewards tier decides the free courtesy days.
  - category: loaner
    as: branch
    reads:
    - out_date
    - return_date
    - pay_basis
    - daily_allowance_usd
    - loaner_agreement_id
    - loaner_charges.unit_rate
    note: The loaner agreement on the repair order decides the start and end days, the free courtesy days and the daily amount.
  compute:
  - claim: LATEST('vsc_ledger','claim_number', date_field='entry_date', claim_line_type='component_repair')
  - ro: LATEST('vsc_ledger','repair_order_number', date_field='entry_date', claim_line_type='component_repair')
  - repair_paid: COUNT('vsc_ledger', event_type='vsc_claim_paid', claim_line_type='component_repair', claim_number=claim)
  - diag_day: XLATEST('service','service_ro_lines','line_date', date_field='line_date', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - covered_line: XLATEST('service','service_ro_lines','line_letter', date_field='line_date', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - loaner_out: CFIELD('loaner','out_date', repair_order_number=ro)
  - denial_day: LATEST('vsc_ledger','entry_date', date_field='entry_date', event_type='vsc_claim_denied', claim_number=claim)
  - start_day: loaner_out if (loaner_out and diag_day and loaner_out > diag_day) else (denial_day if (loaner_out and diag_day and loaner_out == diag_day and denial_day and denial_day > diag_day) else diag_day)
  - loaner_back: CFIELD('loaner','return_date', repair_order_number=ro)
  - ro_diag_lines: XCOUNT('service','service_ro_lines', repair_order_number=ro, event_type='service_diagnostic_fee_charged')
  - covered_last: XLATEST('service','service_ro_lines','line_date', date_field='line_date', repair_order_number=ro, event_type='service_labor_charged', line_letter=covered_line) if ro_diag_lines == 1 else None
  - ro_last: XLATEST('service','service_ro_lines','line_date', date_field='line_date', repair_order_number=ro, event_type='service_labor_charged')
  - end_day: loaner_back if (loaner_back and covered_last and loaner_back < covered_last) else (covered_last if (covered_last and ro_last and covered_last < ro_last) else ro_last)
  - days_counted: MX(0, DAYS(start_day, end_day) + 1) if (start_day and end_day) else 0
  - loaner_basis: CFIELD('loaner','pay_basis', repair_order_number=ro)
  - courtesy_days: CPARAM('loaner','courtesy_days_included', repair_order_number=ro) or 0
  - bonus_days: CPARAM('loaner','rewards_bonus_courtesy_days', repair_order_number=ro) or 0
  - account_tier: CFIELD('service','variant_name', status='active')
  - account_status: CFIELD('service','status', status='active')
  - free_days: (courtesy_days + bonus_days) if (loaner_basis == 'dealer_courtesy' and courtesy_days > 0 and account_status == 'active' and (account_tier == 'Kessler Owner Rewards Gold' or account_tier == 'Kessler Owner Rewards Platinum')) else (courtesy_days if (loaner_basis == 'dealer_courtesy' and courtesy_days > 0) else 0)
  - loaner_id: CFIELD('loaner','loaner_agreement_id', repair_order_number=ro)
  - charged_rate: XLATEST('loaner','loaner_charges','unit_rate', date_field='charge_date', loaner_agreement_id=loaner_id, event_type='loaner_charge_posted', charge_code='daily_rental')
  - allowance: CFIELD('loaner','daily_allowance_usd', repair_order_number=ro)
  - day_amount: float(allowance) if (loaner_basis == 'service_contract_allowance' and float(allowance or 0) > 0) else (float(charged_rate) if (charged_rate != None and float(charged_rate) < P('rental_per_day_usd')) else P('rental_per_day_usd'))
  - rental_agreement: CFIELD('loaner','loaner_agreement_id', repair_order_number=ro)
  - charged_rental_days: XSUM('loaner','loaner_charges','quantity', loaner_agreement_id=rental_agreement, event_type='loaner_charge_posted', charge_code='daily_rental')
  - days_already: SUM('vsc_ledger','days', event_type='vsc_claim_paid', claim_line_type='rental', claim_number=claim)
  - days_paid: MN(MX(0, days_counted - free_days), MX(0, P('rental_max_days_per_claim') - days_already))
  - claims_net: SUM('vsc_ledger','amount', event_type='vsc_claim_paid') - SUM('vsc_ledger','amount', event_type='vsc_claim_reversed')
  - limit_left: P('aggregate_claim_limit_usd') - claims_net
  - result: RND(MN(day_amount * days_paid, limit_left) + 0.000000001, 2) if (repair_paid > 0 and rental_agreement and charged_rental_days > 0 and P('rental_per_day_usd') > 0 and P('rental_max_days_per_claim') > 0) else 0.0
  compute_basis:
    claim: 'This policy applies to the rental benefit of the claim of the contract''s latest component-repair line, paid or denied (by entry date; where several were entered on the same day, the one that appears first in the contract''s claim history), where the first loaner agreement the loaner records list for its repair order is a Kessler loaner on which the holder was charged daily rental, and only to such a claim: where that claim carries a paid component-repair line, the rental is paid as one rental line under the same claim number and repair order at the repair order''s odometer, recording the days paid, with no deductible; where it carries none, its rental benefit is settled with nothing owed and no rental line is booked, since benefits beyond the repair are paid only together with a covered component repair; and a coverage level whose rental amount per day or rental day limit is 0 has no rental benefit.'
