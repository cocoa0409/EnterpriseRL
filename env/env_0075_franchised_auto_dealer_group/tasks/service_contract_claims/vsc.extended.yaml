    covered_line: For a maintenance re-decision line, the repaired concern line is the concern line of that repair order that carries the repair order's diagnostic fee, and the amounts read are the store's customer-pay lines of that concern line on that repair order.
    labor_hours_billed: The standard maintenance re-decision repayment is the repaired concern line's labor at the hours billed times the store's posted labor rate capped at the coverage level's labor-rate cap, rounded half up to the cent, plus its parts at list price, plus its diagnostic fee, less the deductible chosen at sale taken once for the visit; shop fees on the repair order are not repaid.
    posted_rate: The standard maintenance re-decision repayment is the repaired concern line's labor at the hours billed times the store's posted labor rate capped at the coverage level's labor-rate cap, rounded half up to the cent, plus its parts at list price, plus its diagnostic fee, less the deductible chosen at sale taken once for the visit; shop fees on the repair order are not repaid.
    standard_labor: The standard maintenance re-decision repayment is the repaired concern line's labor at the hours billed times the store's posted labor rate capped at the coverage level's labor-rate cap, rounded half up to the cent, plus its parts at list price, plus its diagnostic fee, less the deductible chosen at sale taken once for the visit; shop fees on the repair order are not repaid.
    labor_charged: For a maintenance re-decision line, the repaired concern line is the concern line of that repair order that carries the repair order's diagnostic fee, and the amounts read are the store's customer-pay lines of that concern line on that repair order.
    labor_list: 'For a maintenance re-decision line, and only for such a line, the labor repaid follows how the store billed the repaired line''s labor: where the store charged it below its list amount, the labor charged, never more than the standard labor amount; where it was charged at its list amount and the store credited part of it as a comeback repair, the list amount less that comeback credit, never more than the standard labor amount; otherwise the standard labor amount; a waiting-period re-decision line and a coverage re-decision line take the labor their own rules set, and every other claim line is paid labor at the allowed hours times the rate paid, the store''s posted customer-pay labor rate capped at the coverage level''s labor-rate cap, the hourly difference above the cap owed by the customer to the store.'
    comeback_credit: 'For a maintenance re-decision line, and only for such a line, the labor repaid follows how the store billed the repaired line''s labor: where the store charged it below its list amount, the labor charged, never more than the standard labor amount; where it was charged at its list amount and the store credited part of it as a comeback repair, the list amount less that comeback credit, never more than the standard labor amount; otherwise the standard labor amount; a waiting-period re-decision line and a coverage re-decision line take the labor their own rules set, and every other claim line is paid labor at the allowed hours times the rate paid, the store''s posted customer-pay labor rate capped at the coverage level''s labor-rate cap, the hourly difference above the cap owed by the customer to the store.'
    labor_repaid: 'For a maintenance re-decision line, and only for such a line, the labor repaid follows how the store billed the repaired line''s labor: where the store charged it below its list amount, the labor charged, never more than the standard labor amount; where it was charged at its list amount and the store credited part of it as a comeback repair, the list amount less that comeback credit, never more than the standard labor amount; otherwise the standard labor amount; a waiting-period re-decision line and a coverage re-decision line take the labor their own rules set, and every other claim line is paid labor at the allowed hours times the rate paid, the store''s posted customer-pay labor rate capped at the coverage level''s labor-rate cap, the hourly difference above the cap owed by the customer to the store.'
    parts_list: 'For a maintenance re-decision line, and only for such a line, the parts repaid follow how the repaired line''s parts were billed: where they were charged below list, the parts charged; where they were charged at list and the store gave a goodwill credit on the repaired line, the list amount less that goodwill credit; otherwise the list amount; a waiting-period re-decision line and a coverage re-decision line take the parts their own rules set, and every other claim line is paid its covered parts at the store''s list price.'
    parts_charged: 'For a maintenance re-decision line, and only for such a line, the parts repaid follow how the repaired line''s parts were billed: where they were charged below list, the parts charged; where they were charged at list and the store gave a goodwill credit on the repaired line, the list amount less that goodwill credit; otherwise the list amount; a waiting-period re-decision line and a coverage re-decision line take the parts their own rules set, and every other claim line is paid its covered parts at the store''s list price.'
