    repaid_day: 'For a traded-vehicle refund, the cancellation fee follows the holder''s standing with the group: where the contract''s latest denied component-repair line (by decision date; on a same-day tie, the one that appears first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (a paid line entered on or after the day of that denial counts as later), no fee is taken; where that is not so and the holder holds a Kessler Owner Rewards Silver, Gold or Platinum service account in active status, the trade loyalty fee is taken; otherwise the coverage level''s cancellation fee is taken.'
  factors:
  - id: trade_measure_day
    effect: method
    decides: measure_day
    bindings:
    - plan_id
    - plan_cancel_day
    - gap_payoff_day
    - measure_day
    ladder:
    - when: for a traded-vehicle refund, the Kessler Care plan sold on the contract's purchase deal carries a refund calculated on a sold-or-traded cancellation dated after the sale date and on or before the request date
      method: the term is used up to the date of that refund calculation
    - when: for a traded-vehicle refund, none does and the GAP waiver sold on the contract's purchase deal records the loan paid off after the sale date and on or before the request date
      method: the term is used up to the loan payoff date
    - when: otherwise
      method: the term is used up to the effective date
    baseline:
      measure_day: request_day
    evidence:
    - cross_category
    - date
    cross_difficulty: maintenance
  - id: trade_reading
    effect: parameter
    decides: reading
    bindings:
    - reading_plan
    - cancel_odometer
    - ro_reading
    - reading
    ladder:
    - when: for a traded-vehicle refund, the latest sold-or-traded refund calculation of the Kessler Care plan sold on the contract's purchase deal records an odometer above the certified one
      value: that odometer
    - when: 'for a traded-vehicle refund, none does and the latest repair order a group store wrote for the vehicle (labor closed last; same-day tie: first listed) records an odometer above the certified one'
      value: that repair-order odometer
    - when: otherwise
      value: the certified odometer
    baseline:
      reading: certified
    evidence:
    - cross_category
    - history
    cross_difficulty: maintenance
  - id: trade_miles_start
    effect: parameter
    decides: run_from
    bindings:
    - deal_odometer
    - deal_method
    - deal_distance
    - run_from
    ladder:
    - when: for a traded-vehicle refund, the contract's term counts from its sale date and it was sold on a purchase deal delivered after its sale date with a delivery odometer above the odometer at sale
      value: the deal's delivery odometer
    - when: for a traded-vehicle refund, the contract's term counts from its sale date and it was sold on a purchase deal delivered to the holder's address on or before the sale date
      value: the odometer at sale plus the deal's one-way delivery distance
    - when: otherwise
      value: the term start odometer
    baseline:
      run_from: F('term_start_odometer')
    evidence:
    - cross_category
    - date
    cross_difficulty: purchase
  - id: trade_credit_days
    effect: parameter
    decides: credited_days
    bindings:
    - credited_days
    ladder:
    - when: for a traded-vehicle refund, the contract was sold on a purchase deal delivered after its sale date
      value: the days from the sale date to the delivery date
    - when: for a traded-vehicle refund, the contract was sold on its own with no purchase deal
      value: the coverage level's waiting-period days
    - when: otherwise
      value: '0'
    baseline:
      credited_days: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: trade_fee_rule
    effect: parameter
    decides: cancel_fee
    bindings:
    - denied_claim
    - denied_ro
    - denied_group
    - denied_day
    - repaid_day
    - redecided_count
    - account_tier
    - cancel_fee
    ladder:
    - when: 'for a traded-vehicle refund, the contract''s latest denied component-repair line (same-day tie: first in the claim history) was later paid as a component-repair line on the same claim number, repair order and component group (on or after the day of that denial)'
      value: '0.00'
    - when: for a traded-vehicle refund, not that, and the holder holds a Kessler Owner Rewards Silver, Gold or Platinum service account in active status
      value: the trade loyalty fee
    - when: otherwise
      value: the coverage level's cancellation fee
    baseline:
      cancel_fee: P('cancellation_fee_usd')
    evidence:
    - history
    - cross_category
    cross_difficulty: service
  baseline:
    rule: The standard traded-vehicle refund is the retail price times the unused share, rounded half up to the cent, less the coverage level's cancellation fee and never below 0.00; the unused share is the lesser of the unused time share, the days from the effective date to the expiration date over the days from the term start date to the expiration date, and the unused mileage share, the miles from the certified odometer to the expiration odometer over the term miles; a coverage level that refunds on time alone uses the unused time share only, and a share below zero counts as zero.
    params:
    - cancellation_fee_usd
    - free_look_days
    - refund_basis
  inputs:
    history:
    - table: vsc_cancellation_requests
      aggregate: latest
      field: request_date
      filters:
        request_status: submitted
        cancel_reason: vehicle_sold_or_traded
    - table: vsc_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: vsc_claim_paid
    - category: service
      table: service_ro_lines
      aggregate: latest
      field: odometer_in
      filters: {}
    - category: maintenance
      table: maintenance_plan_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: maintenance_refund_calculated
    cross_category:
    - purchase
    - service
    - maintenance
    - gap
