  - id: supplies_refund
    effect: parameter
    decides: supplies_refund_rate
    bindings:
    - supplies_fee_posted
    - supplies_refund_rate
    ladder:
    - when: a shop supplies fee stands on the paid repair order and the account is at Kessler Owner Rewards Gold or Platinum
      value: P('shop_supplies_pct')
    - when: a shop supplies fee stands on the paid repair order and the account is at another tier
      value: K('supplies_refund_share_other') * P('shop_supplies_pct')
    - when: otherwise
      value: '0'
    baseline:
      supplies_refund_rate: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The overage is reviewed when a repair order is paid: the paid repair order is the repair order of the latest payment received on the account, and the line reviewed is the concern line of its latest authorized estimate decision. The billed amount of the line is its customer-pay labor and parts charges. The overage credit is the billed amount less the authorized amount increased by the estimate tolerance, never below zero, rounded half up to the cent. The authorized amount is the estimate amount of the line''s latest authorized decision. The estimate tolerance is estimate_overage_tolerance_pct.'
    params:
    - estimate_overage_tolerance_pct
  inputs:
    history:
    - table: service_ro_lines
      aggregate: latest
      field: repair_order_number
      filters:
        event_type: service_payment_received
    - table: service_repair_authorizations
      aggregate: sum
      field: estimate_amount
      filters:
        decision: authorized
    - table: service_ro_lines
      aggregate: sum
      field: amount
      filters:
        event_type: service_labor_charged
        pay_type: customer_pay
    - table: service_ro_lines
      aggregate: count
      field: service_line_id
      filters:
        event_type: service_shop_fee_charged
        fee_code: shop_supplies
    cross_category:
    - purchase
- id: service_ext_paid_ro_points
  base_policy_refs:
  - service_evt_rewards_points
  overwrite:
  - base_policy: service_evt_rewards_points
    superseded_clause: A repair order earns points_earn_per_usd points per whole dollar of customer-pay labor and parts actually paid (service_msr_ro_customer_pay_total, cents dropped), up to max_points_per_ro per repair order; shop fees, late fees and deductibles earn nothing, and where points_earn_on_covered_lines is false no work paid by warranty, recall, service contract, maintenance plan or goodwill earns points.
    replaced_by: For a retail rewards account, this policy sets the points a repair order earns when it is paid in full, and only for such an account; on any other account a repair order still earns points_earn_per_usd points per whole dollar of customer-pay labor and parts actually paid, cents dropped, up to max_points_per_ro per repair order, and on every account shop fees, late fees and deductibles earn nothing and, where points_earn_on_covered_lines is false, no work paid by warranty, recall, service contract, maintenance plan or goodwill earns points.
  trigger: state_due
  subject:
  - service_points_earned
  computes: points
  target_tool: credit_paid_ro_points_b77dd6a9
  params:
    financed_owner_rate: 2
    owner_rate: 1
    contract_labor_rate_upper: 2
    contract_labor_rate_silver: 1
    late_payment_days: 30
    visit_bonus_payments: 3
    visit_bonus_upper: 250
    visit_bonus_silver: 100
    care_bonus_upper: 150
    care_bonus_silver: 75
    tenure_months: 60
    tenure_multiplier_upper: 1.25
    tenure_multiplier_silver: 1.1
  rule: 'For a retail rewards account, this policy sets the points a repair order earns when it is paid in full, and only for such an account; on any other account a repair order still earns points_earn_per_usd points per whole dollar of customer-pay labor and parts actually paid, cents dropped, up to max_points_per_ro per repair order, and on every account shop fees, late fees and deductibles earn nothing and, where points_earn_on_covered_lines is false, no work paid by warranty, recall, service contract, maintenance plan or goodwill earns points. The paid repair order, whose points are being credited, is the repair order of the latest payment received on the account, and its vehicle is the vehicle on its labor charges. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts. The paid repair order is paid in full when its charges, customer-pay and deductible alike, less every credit on it, less the payments received on it, plus any payment returned on it, come to zero or less, and a repair order not paid in full earns no points. The paid labor and parts total is the paid repair order''s customer-pay labor and parts charges less the estimate overage, comeback and goodwill credits standing on that repair order. The points credited for the paid repair order are the earning rate times the earning dollars, never more than max_points_per_ro. The earning rate is points_earn_per_usd points per dollar. The earning dollars are the paid labor and parts total with the cents dropped. The earning rate follows how the vehicle was bought and the tier: where the vehicle has a closed purchase deal with the group financed on a dealer-arranged installment contract and the account is at Kessler Owner Rewards Gold or Platinum, the earning rate is points_earn_per_usd plus financed_owner_rate points per dollar; where the vehicle has a closed purchase deal paid in cash or through an outside lender and the account is at Kessler Owner Rewards Gold or Platinum, the earning rate is points_earn_per_usd plus owner_rate points per dollar; otherwise the earning rate is points_earn_per_usd. The earning dollars follow how the repair order was paid: where a rewards redemption credit stands on the paid repair order and its payment was received no more than late_payment_days calendar days after its labor was closed, the earning dollars are the paid labor and parts total less that rewards redemption credit, cents dropped, because the part paid with points earns nothing; where the payment was received more than late_payment_days calendar days after the labor was closed, the earning dollars are the customer-pay labor charges alone, cents dropped, and parts earn nothing; otherwise the earning dollars are the paid labor and parts total, cents dropped. The service contract labor bonus follows the vehicle''s Kessler Shield contract and the tier: where the vehicle carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, each whole dollar of customer-pay labor charged on the paid repair order earns contract_labor_rate_upper more points; where it carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Silver, each whole dollar of that labor earns contract_labor_rate_silver more points; otherwise labor earns no bonus. The tenure multiplier follows how long the account has been open and the tier: where the account was opened at least tenure_months whole months before the crediting date and is at Kessler Owner Rewards Gold or Platinum, the points are multiplied by tenure_multiplier_upper; where it was opened at least tenure_months whole months before and is at Kessler Owner Rewards Silver, they are multiplied by tenure_multiplier_silver; otherwise they are not multiplied. The visit bonus follows the account''s payment history and tier: where at least visit_bonus_payments payments were received on the account within the last twelve whole months and the account is at Kessler Owner Rewards Gold or Platinum, visit_bonus_upper points are added; where at least visit_bonus_payments payments were received within the last twelve whole months and the account is at Kessler Owner Rewards Silver, visit_bonus_silver points are added; otherwise none are added. The Kessler Care member bonus follows the customer''s maintenance plans and tier: where the customer holds an active Kessler Care maintenance plan on any vehicle and the account is at Kessler Owner Rewards Gold or Platinum, care_bonus_upper points are added; where the customer holds one and the account is at Kessler Owner Rewards Silver, care_bonus_silver points are added; otherwise none are added. The points are assembled in this order: first the earning rate is applied to the earning dollars, every per-dollar labor bonus this policy sets out is applied to the whole dollars of customer-pay labor charged on the paid repair order, and the two are added; then every multiplier this policy sets out is applied to that sum and the fraction is dropped; then every fixed number of points this policy sets out is added; and the total is held to max_points_per_ro. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the crediting date, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on the crediting date count. The points for a paid repair order are fixed only after the records carry the overage credit owed on every line of it billed beyond its estimate tolerance. The points are booked as one points-earned entry for the paid repair order, dated on the crediting date. Where no payment has been received on the account there is no paid repair order and no points are credited. A repair order whose customer-pay labor charges, less the estimate overage, comeback, goodwill and rewards redemption credits standing on it, come to less than one dollar earns no points.'
  prerequisite:
  - problem: service_ext_estimate_overage_credit
    kind: value_input
    gate: paid_credits
    form: state
    policy_source: The points for a paid repair order are fixed only after the records carry the overage credit owed on every line of it billed beyond its estimate tolerance.
    condition: Every authorized line of the paid repair order whose customer-pay labor and parts exceed the authorized amount plus its tolerance carries an estimate overage credit.
    resolved_by: credit_estimate_overage_3db3cf5c
    effect: Booking the overage credit lowers the paid labor and parts total, so the earning dollars and the points credited fall.
  cross_category:
  - category: purchase
    as: branch
    reads:
    - financing_type
    - status
    - vehicle_id
    note: The earning rate reads how the paid repair order's vehicle was bought from the group (dealer-arranged installment, cash or outside lender).
  - category: vsc
    as: branch
    reads:
    - status
    - vehicle_id
    note: The service contract labor bonus reads whether the vehicle carries an active Kessler Shield contract.
  - category: maintenance
    as: branch
    reads:
    - status
    note: The Kessler Care member bonus reads whether the customer holds an active Kessler Care plan.
  compute:
  - paid_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_payment_received')
  - review_open: paid_ro != None
  - paid_vehicle: LATEST('service_ro_lines', 'vehicle_id', date_field='line_date', event_type='service_labor_charged', repair_order_number=paid_ro)
  - paid_labor: SUM('service_ro_lines', 'amount', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=paid_ro)
  - paid_parts: SUM('service_ro_lines', 'amount', event_type='service_parts_charged', pay_type='customer_pay', repair_order_number=paid_ro)
  - paid_credits: SUM('service_ro_lines', 'amount', event_type='service_line_credited', credit_reason='estimate_overage', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_line_credited', credit_reason='comeback_repair', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_line_credited', credit_reason='goodwill', repair_order_number=paid_ro)
  - ro_balance: SUM('service_ro_lines', 'amount', event_type='service_diagnostic_fee_charged', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_labor_charged', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_parts_charged', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_shop_fee_charged', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_payment_returned', repair_order_number=paid_ro) - SUM('service_ro_lines', 'amount', event_type='service_line_credited', repair_order_number=paid_ro) - SUM('service_ro_lines', 'amount', event_type='service_payment_received', repair_order_number=paid_ro)
  - paid_in_full: ro_balance <= 0.004
  - paid_total: paid_labor + paid_parts - paid_credits
  - upper_tier: F('variant_name') == 'Kessler Owner Rewards Gold' or F('variant_name') == 'Kessler Owner Rewards Platinum'
  - silver_tier: F('variant_name') == 'Kessler Owner Rewards Silver'
  - deal_financing: CFIELD('purchase', 'financing_type', vehicle_id=paid_vehicle, status='closed')
  - earn_rate: P('points_earn_per_usd') + K('financed_owner_rate') if (deal_financing == 'dealer_arranged_installment' and upper_tier) else (P('points_earn_per_usd') + K('owner_rate') if ((deal_financing == 'cash' or deal_financing == 'outside_lender') and upper_tier) else P('points_earn_per_usd'))
  - redeemed_on_ro: SUM('service_ro_lines', 'amount', event_type='service_line_credited', credit_reason='rewards_redemption', repair_order_number=paid_ro)
  - payment_lag_days: DAYS((LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_labor_charged', repair_order_number=paid_ro) or NOW), (LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_payment_received', repair_order_number=paid_ro) or NOW))
  - earning_dollars: int(paid_total - redeemed_on_ro) if (redeemed_on_ro > 0 and payment_lag_days <= K('late_payment_days')) else (int(paid_labor) if payment_lag_days > K('late_payment_days') else int(paid_total))
  - vehicle_contract_active: CFIELD('vsc', 'status', vehicle_id=paid_vehicle, status='active') == 'active'
  - contract_labor_rate: K('contract_labor_rate_upper') if (vehicle_contract_active and upper_tier) else (K('contract_labor_rate_silver') if (vehicle_contract_active and silver_tier) else 0)
  - months_open: MONTHS(F('opened_date'), NOW)
  - tenure_multiplier: K('tenure_multiplier_upper') if (months_open >= K('tenure_months') and upper_tier) else (K('tenure_multiplier_silver') if (months_open >= K('tenure_months') and silver_tier) else 1)
  - payments_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_payment_received')
  - visit_bonus: K('visit_bonus_upper') if (payments_12m >= K('visit_bonus_payments') and upper_tier) else (K('visit_bonus_silver') if (payments_12m >= K('visit_bonus_payments') and silver_tier) else 0)
  - care_plan_active: CFIELD('maintenance', 'status', status='active') == 'active'
  - care_bonus: K('care_bonus_upper') if (care_plan_active and upper_tier) else (K('care_bonus_silver') if (care_plan_active and silver_tier) else 0)
  - labor_net_of_credits: paid_labor - paid_credits - SUM('service_ro_lines', 'amount', event_type='service_line_credited', credit_reason='rewards_redemption', repair_order_number=paid_ro)
  - earns_points: labor_net_of_credits >= 1
  - result: (MN(P('max_points_per_ro'), int((earn_rate * earning_dollars + contract_labor_rate * int(paid_labor)) * tenure_multiplier) + visit_bonus + care_bonus) if (paid_in_full and earns_points) else 0) if review_open else 0
  compute_basis:
    paid_ro: The paid repair order, whose points are being credited, is the repair order of the latest payment received on the account, and its vehicle is the vehicle on its labor charges. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts. The paid repair order is paid in full when its charges, customer-pay and deductible alike, less every credit on it, less the payments received on it, plus any payment returned on it, come to zero or less, and a repair order not paid in full earns no points.
    paid_vehicle: The paid repair order, whose points are being credited, is the repair order of the latest payment received on the account, and its vehicle is the vehicle on its labor charges. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts. The paid repair order is paid in full when its charges, customer-pay and deductible alike, less every credit on it, less the payments received on it, plus any payment returned on it, come to zero or less, and a repair order not paid in full earns no points.
    paid_labor: The paid labor and parts total is the paid repair order's customer-pay labor and parts charges less the estimate overage, comeback and goodwill credits standing on that repair order.
    paid_parts: The paid labor and parts total is the paid repair order's customer-pay labor and parts charges less the estimate overage, comeback and goodwill credits standing on that repair order.
    paid_credits: The paid labor and parts total is the paid repair order's customer-pay labor and parts charges less the estimate overage, comeback and goodwill credits standing on that repair order.
    deal_financing: where the vehicle has a closed purchase deal with the group financed on a dealer-arranged installment contract and the account is at Kessler Owner Rewards Gold or Platinum, the earning rate is points_earn_per_usd plus financed_owner_rate points per dollar
    earn_rate: 'The earning rate follows how the vehicle was bought and the tier: where the vehicle has a closed purchase deal with the group financed on a dealer-arranged installment contract and the account is at Kessler Owner Rewards Gold or Platinum, the earning rate is points_earn_per_usd plus financed_owner_rate points per dollar; where the vehicle has a closed purchase deal paid in cash or through an outside lender and the account is at Kessler Owner Rewards Gold or Platinum, the earning rate is points_earn_per_usd plus owner_rate points per dollar; otherwise the earning rate is points_earn_per_usd.'
    redeemed_on_ro: where a rewards redemption credit stands on the paid repair order and its payment was received no more than late_payment_days calendar days after its labor was closed, the earning dollars are the paid labor and parts total less that rewards redemption credit, cents dropped, because the part paid with points earns nothing
    payment_lag_days: where the payment was received more than late_payment_days calendar days after the labor was closed, the earning dollars are the customer-pay labor charges alone, cents dropped, and parts earn nothing
    earning_dollars: 'The earning dollars follow how the repair order was paid: where a rewards redemption credit stands on the paid repair order and its payment was received no more than late_payment_days calendar days after its labor was closed, the earning dollars are the paid labor and parts total less that rewards redemption credit, cents dropped, because the part paid with points earns nothing; where the payment was received more than late_payment_days calendar days after the labor was closed, the earning dollars are the customer-pay labor charges alone, cents dropped, and parts earn nothing; otherwise the earning dollars are the paid labor and parts total, cents dropped.'
    vehicle_contract_active: where the vehicle carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, each whole dollar of customer-pay labor charged on the paid repair order earns contract_labor_rate_upper more points
    contract_labor_rate: 'The service contract labor bonus follows the vehicle''s Kessler Shield contract and the tier: where the vehicle carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, each whole dollar of customer-pay labor charged on the paid repair order earns contract_labor_rate_upper more points; where it carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Silver, each whole dollar of that labor earns contract_labor_rate_silver more points; otherwise labor earns no bonus.'
    months_open: where the account was opened at least tenure_months whole months before the crediting date and is at Kessler Owner Rewards Gold or Platinum, the points are multiplied by tenure_multiplier_upper
    tenure_multiplier: 'The tenure multiplier follows how long the account has been open and the tier: where the account was opened at least tenure_months whole months before the crediting date and is at Kessler Owner Rewards Gold or Platinum, the points are multiplied by tenure_multiplier_upper; where it was opened at least tenure_months whole months before and is at Kessler Owner Rewards Silver, they are multiplied by tenure_multiplier_silver; otherwise they are not multiplied.'
    payments_12m: A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the crediting date, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on the crediting date count.
    visit_bonus: 'The visit bonus follows the account''s payment history and tier: where at least visit_bonus_payments payments were received on the account within the last twelve whole months and the account is at Kessler Owner Rewards Gold or Platinum, visit_bonus_upper points are added; where at least visit_bonus_payments payments were received within the last twelve whole months and the account is at Kessler Owner Rewards Silver, visit_bonus_silver points are added; otherwise none are added.'
    care_plan_active: where the customer holds an active Kessler Care maintenance plan on any vehicle and the account is at Kessler Owner Rewards Gold or Platinum, care_bonus_upper points are added
    care_bonus: 'The Kessler Care member bonus follows the customer''s maintenance plans and tier: where the customer holds an active Kessler Care maintenance plan on any vehicle and the account is at Kessler Owner Rewards Gold or Platinum, care_bonus_upper points are added; where the customer holds one and the account is at Kessler Owner Rewards Silver, care_bonus_silver points are added; otherwise none are added.'
    result: 'The points are assembled in this order: first the earning rate is applied to the earning dollars, every per-dollar labor bonus this policy sets out is applied to the whole dollars of customer-pay labor charged on the paid repair order, and the two are added; then every multiplier this policy sets out is applied to that sum and the fraction is dropped; then every fixed number of points this policy sets out is added; and the total is held to max_points_per_ro. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the crediting date, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on the crediting date count.'
    ro_balance: The paid repair order is paid in full when its charges, customer-pay and deductible alike, less every credit on it, less the payments received on it, plus any payment returned on it, come to zero or less, and a repair order not paid in full earns no points.
    paid_in_full: The paid repair order is paid in full when its charges, customer-pay and deductible alike, less every credit on it, less the payments received on it, plus any payment returned on it, come to zero or less, and a repair order not paid in full earns no points.
    review_open: Where no payment has been received on the account there is no paid repair order and no points are credited. A repair order whose customer-pay labor charges, less the estimate overage, comeback, goodwill and rewards redemption credits standing on it, come to less than one dollar earns no points.
    labor_net_of_credits: A repair order whose customer-pay labor charges, less the estimate overage, comeback, goodwill and rewards redemption credits standing on it, come to less than one dollar earns no points.
    earns_points: A repair order whose customer-pay labor charges, less the estimate overage, comeback, goodwill and rewards redemption credits standing on it, come to less than one dollar earns no points.
  factors:
  - id: owner_earning_rate
