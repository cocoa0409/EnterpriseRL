  baseline:
    rule: The paid repair order, whose points are being credited, is the repair order of the latest payment received on the account, and its vehicle is the vehicle on its labor charges. The paid repair order is paid in full when its charges, customer-pay and deductible alike, less every credit on it, less the payments received on it, plus any payment returned on it, come to zero or less, and a repair order not paid in full earns no points. The paid labor and parts total is the paid repair order's customer-pay labor and parts charges less the estimate overage, comeback and goodwill credits standing on that repair order. The points credited for the paid repair order are the earning rate times the earning dollars, never more than max_points_per_ro. The earning rate is points_earn_per_usd points per dollar. The earning dollars are the paid labor and parts total with the cents dropped.
    params:
    - points_earn_per_usd
    - max_points_per_ro
