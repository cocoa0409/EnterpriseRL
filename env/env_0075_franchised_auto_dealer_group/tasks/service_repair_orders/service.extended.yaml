    months_open: 'The tenure addition follows how long the account has been open and the terms: where the account was opened at least tenure_months whole months before the payment date and is at Commercial Fleet Account - Net 30, tenure_addon_net30 is added to the rate; where it was opened at least that long before and is at Commercial Fleet Account - Net 15, tenure_addon_net15 is added; otherwise nothing is added.'
    tenure_addon: 'The tenure addition follows how long the account has been open and the terms: where the account was opened at least tenure_months whole months before the payment date and is at Commercial Fleet Account - Net 30, tenure_addon_net30 is added to the rate; where it was opened at least that long before and is at Commercial Fleet Account - Net 15, tenure_addon_net15 is added; otherwise nothing is added.'
    unit_plan_active: 'The discountable total follows how the invoice was paid and the unit''s maintenance record: where the latest payment was made by credit card, the discountable total is the customer-pay labor charges less the credits on the invoice, and parts earn no discount; where the latest payment was made by ACH or check and the unit carries an active Kessler Care maintenance plan, the discountable total is the customer-pay labor and parts charges plus the shop supplies fee, less the credits on the invoice; otherwise it is the customer-pay labor and parts charges less the credits on the invoice.'
    discountable_total: 'The discountable total follows how the invoice was paid and the unit''s maintenance record: where the latest payment was made by credit card, the discountable total is the customer-pay labor charges less the credits on the invoice, and parts earn no discount; where the latest payment was made by ACH or check and the unit carries an active Kessler Care maintenance plan, the discountable total is the customer-pay labor and parts charges plus the shop supplies fee, less the credits on the invoice; otherwise it is the customer-pay labor and parts charges less the credits on the invoice.'
    late_fees_12m: A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the day the discount is worked out, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on that day count.
    returned_12m: A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the day the discount is worked out, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on that day count.
    standing_share: 'The discount standing share follows the account''s payment record: where a late fee was assessed on the account within the last twelve whole months and no payment was returned in that time, the discount is multiplied by late_fee_share; where a payment was returned on the account within the last twelve whole months, the discount is multiplied by returned_payment_share; otherwise it is not reduced.'
    discount_due: No discount is given on an invoice whose customer-pay labor charges exceed the comeback, estimate overage and goodwill credits on it by less than min_discount_labor_usd.
    result: 'The discount is figured in this order: first every addition this policy sets out is added to the discount rate, giving one rate; then that rate is applied once to the discountable total; then every share this policy sets out that reduces the discount is applied; and the result is rounded half up to the cent once, at the end. No discount is given on an invoice whose customer-pay labor charges exceed the comeback, estimate overage and goodwill credits on it by less than min_discount_labor_usd. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the day the discount is worked out, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on that day count.'
    review_open: Where no payment has been received on the account, or the paid repair order carries no customer-pay labor charge, there is no invoice to review and no discount.
  baseline:
    rule: The invoice reviewed is the repair order of the latest payment received on the account; its invoice date is the latest line date of its labor charges, its payment date is the date of that latest payment, and its unit is the vehicle on its labor charges. The invoice is paid in full when its charges, customer-pay and deductible alike, less every credit on it, less the payments received on it, plus any payment returned on it, come to zero or less. The early-payment discount is the discount rate times the discountable total, rounded half up to the cent, and is given only when the invoice is paid in full no more than the discount window of calendar days after its invoice date; otherwise there is no discount. The discount rate is early_pay_discount_pct. The discount window is early_pay_discount_days calendar days. The discountable total is the invoice's customer-pay labor and parts charges less the comeback, estimate overage and goodwill credits on it.
    params:
    - early_pay_discount_pct
    - early_pay_discount_days
  inputs:
    history:
    - table: service_ro_lines
      aggregate: latest
      field: repair_order_number
      filters:
        event_type: service_payment_received
    - table: service_ro_lines
      aggregate: sum
      field: amount
      filters:
        event_type: service_line_credited
    - table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 12
      filters:
        event_type: service_payment_received
    - table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 12
      filters:
        event_type: service_late_fee_charged
    cross_category:
    - purchase
    - maintenance
- id: service_ext_repeat_repair_estimate
  base_policy_refs:
  - service_evt_diagnostic
  - service_combo_coverage_priority
  - service_evt_comeback
  overwrite: []
  trigger: on_request
  subject:
  - service_diagnostic_fee_charged
  computes: estimate_amount
  target_tool: authorize_repair_estimate_690e2aa2
  params:
    allowance_months: 24
    allowance_miles: 24000
    extended_allowance_months: 36
    allowance_share: 0.5
    extended_allowance_share: 0.75
    maintained_miles: 15000
    maintained_share_high: 0.88
    maintained_share_low: 0.8
    index_long_months: 24
    index_short_months: 12
    index_long: 0.06
    index_short: 0.03
    full_overlap_hours: 1.0
    parts_volume_high_usd: 10000.0
    parts_volume_low_usd: 5000.0
    parts_volume_high_pct: 0.05
    parts_volume_low_pct: 0.03
  rule: 'This policy prices the written estimate for a diagnosed concern line whose failure repeats the latest customer-pay parts repair recorded on the same vehicle; the estimate is the customer-pay labor and parts amount the customer authorizes, before shop fees. The line estimated is the line of the latest diagnostic fee charged on the account, its posted labor rate is the one on that diagnostic fee, and its vehicle and odometer are those on that fee. The earlier repair is the repair order and concern line of the latest customer-pay parts charge recorded on the same vehicle, with every customer-pay parts and labor charge on that line. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts. The estimate is the labor amount plus the parts amount, rounded half up to the cent. The labor amount is the repair hours times the labor rate, less the tier''s labor_discount_pct of that product, the discount never more than max_labor_discount_usd_per_ro. The repair hours are the hours of the earlier repair''s latest customer-pay labor charge. The labor rate is the posted labor rate on the diagnostic fee. The parts amount is the total list price of the earlier repair''s customer-pay parts charges less the tier''s parts_discount_pct. The labor rate follows where the two repairs were written, the estimate''s repair order being written at the store on the diagnostic fee: where the estimate''s repair order is written away from the account''s home store and the earlier repair was written at the home store, the labor rate is the earlier repair''s posted labor rate; where the estimate''s repair order is written away from the home store and the earlier repair was also written away from it, the labor rate is the lesser of the two posted rates; otherwise the labor rate is the posted labor rate on the diagnostic fee. The repair hours follow the diagnosis and the earlier repair''s labor: where the diagnostic fee was charged for at least full_overlap_hours hour and the earlier repair''s line carries a single labor charge, the repair hours are that charge''s hours less the diagnostic hours, because the diagnosis already covered the teardown; where the earlier repair''s line carries two or more labor charges, the repair hours are the sum of their hours less the diagnostic hours; otherwise the repair hours are the hours of the earlier repair''s latest labor charge. The repeat allowance follows how recent the earlier repair is: where the earlier repair''s line date is no more than allowance_months whole months before the diagnosis and the vehicle has been driven no more than allowance_miles miles since, the labor amount is multiplied by allowance_share; where the earlier repair is no more than extended_allowance_months whole months before the diagnosis and the first case does not hold, it is multiplied by extended_allowance_share; otherwise the labor amount is not reduced. The maintained-vehicle allowance follows the vehicle''s Kessler Care plan and the miles since the earlier repair: where the vehicle carries an active Kessler Care maintenance plan and has been driven more than maintained_miles miles since the earlier repair, the labor amount is multiplied by maintained_share_high; where it carries an active plan and has been driven no more than maintained_miles miles since, by maintained_share_low; otherwise it is not reduced. The parts price index follows the age of the earlier repair: where the earlier repair''s line date is at least index_long_months whole months before the diagnosis, the earlier parts list price is raised by index_long of itself; where it is at least index_short_months and fewer than index_long_months whole months before, by index_short; otherwise the earlier list price is used as recorded. The parts volume discount follows the account''s customer-pay parts purchases: where the account''s customer-pay parts charges dated within the last twelve whole months come to at least parts_volume_high_usd, parts_volume_high_pct more is taken off the indexed parts price together with the tier''s parts discount; where they come to at least parts_volume_low_usd and less than parts_volume_high_usd, parts_volume_low_pct more is taken off; otherwise nothing more is taken off. The estimate is figured in this order: first the repair hours are multiplied by the labor rate and the tier discount, within its cap, is taken off; then every allowance this policy sets out is applied to that labor amount; then every index this policy sets out is applied to the earlier parts list price, and the indexed price is reduced once by the tier''s parts discount and every further parts discount this policy sets out, added into one rate; and the labor and parts amounts are added and rounded half up to the cent once, at the end. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the day the estimate is priced, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on that day count. The estimate is recorded as the customer''s own authorized decision on the diagnosed concern line, dated on the day the customer gives it. Where the account carries no diagnostic fee, or the vehicle on it has no earlier customer-pay parts charge, there is no repeat repair for this policy to price and it prices nothing. Where the diagnosis date is on or before the day comeback_warranty_months calendar months after the earlier repair''s line date (that month''s last day where it has no such day) and the vehicle''s odometer on the diagnostic fee is no more than comeback_warranty_miles miles beyond the earlier repair''s odometer, the failure is a comeback inside the store''s repair warranty, its replacement parts are not billed and this policy prices nothing. Where the earlier repair''s line carries no customer-pay labor charge, it is a parts sale rather than a repair the store performed, the failure does not repeat a repair, and this policy prices nothing.'
  prerequisite: []
  cross_category:
  - category: maintenance
    as: branch
    reads:
    - status
    - vehicle_id
    note: The maintained-vehicle allowance reads whether the vehicle carries an active Kessler Care maintenance plan.
  compute:
  - est_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_diagnostic_fee_charged')
  - est_line: LATEST('service_ro_lines', 'line_letter', date_field='line_date', event_type='service_diagnostic_fee_charged')
  - est_date: (LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_diagnostic_fee_charged') or NOW)
  - est_rate: (LATEST('service_ro_lines', 'labor_rate', date_field='line_date', event_type='service_diagnostic_fee_charged') or 0)
  - est_store: LATEST('service_ro_lines', 'store_id', date_field='line_date', event_type='service_diagnostic_fee_charged')
  - est_unit: LATEST('service_ro_lines', 'vehicle_id', date_field='line_date', event_type='service_diagnostic_fee_charged')
  - est_odometer: (LATEST('service_ro_lines', 'odometer_in', date_field='line_date', event_type='service_diagnostic_fee_charged') or 0)
  - diag_hours: (LATEST('service_ro_lines', 'labor_hours', date_field='line_date', event_type='service_diagnostic_fee_charged') or 0)
  - prior_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay', vehicle_id=est_unit)
  - prior_line: LATEST('service_ro_lines', 'line_letter', date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay', vehicle_id=est_unit)
  - prior_date: (LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay', vehicle_id=est_unit) or NOW)
  - prior_odometer: (LATEST('service_ro_lines', 'odometer_in', date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay', vehicle_id=est_unit) or 0)
  - prior_parts_list: SUM('service_ro_lines', 'list_amount', event_type='service_parts_charged', pay_type='customer_pay', repair_order_number=prior_ro, line_letter=prior_line)
  - prior_hours: (LATEST('service_ro_lines', 'labor_hours', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=prior_ro, line_letter=prior_line) or 0)
  - prior_rate: (LATEST('service_ro_lines', 'labor_rate', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=prior_ro, line_letter=prior_line) or 0)
  - prior_store: LATEST('service_ro_lines', 'store_id', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=prior_ro, line_letter=prior_line)
  - prior_labor_amount: SUM('service_ro_lines', 'amount', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=prior_ro, line_letter=prior_line)
  - in_repair_warranty: prior_ro != None and -MONTHS(est_date, prior_date) <= P('comeback_warranty_months') and est_odometer - prior_odometer <= P('comeback_warranty_miles')
  - review_open: est_ro != None and prior_ro != None and prior_labor_amount > 0 and not in_repair_warranty
  - miles_since_prior: est_odometer - prior_odometer
  - labor_rate_used: prior_rate if (est_store != F('home_store_id') and prior_store == F('home_store_id')) else (MN(est_rate, prior_rate) if (est_store != F('home_store_id') and prior_store != F('home_store_id')) else est_rate)
  - prior_labor_rows: COUNT('service_ro_lines', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=prior_ro, line_letter=prior_line)
  - repair_hours: prior_hours - diag_hours if (diag_hours >= K('full_overlap_hours') and prior_labor_rows == 1) else (SUM('service_ro_lines', 'labor_hours', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=prior_ro, line_letter=prior_line) - diag_hours if prior_labor_rows >= 2 else prior_hours)
  - labor_list: repair_hours * labor_rate_used
  - labor_net: labor_list - MN(P('max_labor_discount_usd_per_ro'), labor_list * P('labor_discount_pct'))
  - repeat_allowance: K('allowance_share') if (MONTHS(prior_date, est_date) <= K('allowance_months') and miles_since_prior <= K('allowance_miles')) else (K('extended_allowance_share') if (MONTHS(prior_date, est_date) <= K('extended_allowance_months') and not (MONTHS(prior_date, est_date) <= K('allowance_months') and miles_since_prior <= K('allowance_miles'))) else 1)
  - unit_plan_active: CFIELD('maintenance', 'status', vehicle_id=est_unit, status='active') == 'active'
  - maintained_allowance: K('maintained_share_high') if (unit_plan_active and miles_since_prior > K('maintained_miles')) else (K('maintained_share_low') if (unit_plan_active and miles_since_prior <= K('maintained_miles')) else 1)
  - parts_index: K('index_long') if MONTHS(prior_date, est_date) >= K('index_long_months') else (K('index_short') if MONTHS(prior_date, est_date) >= K('index_short_months') else 0)
  - parts_12m: SUM('service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay')
  - parts_volume_pct: K('parts_volume_high_pct') if parts_12m >= K('parts_volume_high_usd') else (K('parts_volume_low_pct') if (parts_12m >= K('parts_volume_low_usd') and parts_12m < K('parts_volume_high_usd')) else 0)
  - result: (RND(labor_net * repeat_allowance * maintained_allowance + prior_parts_list * (1 + parts_index) * (1 - P('parts_discount_pct') - parts_volume_pct) + 0.000000001, 2)) if review_open else 0
  factors:
  - id: rate_lock_rule
    effect: parameter
    decides: labor_rate_used
    bindings:
    - est_store
    - prior_store
    - prior_rate
    - labor_rate_used
    ladder:
    - when: the estimate's repair order is written away from the account's home store and the earlier repair was written at the home store
      value: prior_rate
    - when: the estimate's repair order is written away from the home store and the earlier repair was also written away from it
      value: MN(est_rate, prior_rate)
    - when: otherwise
      value: est_rate
    baseline:
      labor_rate_used: est_rate
    evidence:
    - history
    cross_difficulty: null
  - id: diagnosis_overlap_hours
    effect: method
    decides: repair_hours
    bindings:
    - prior_labor_rows
    - repair_hours
    ladder:
    - when: the diagnostic fee was charged for at least full_overlap_hours hour and the earlier repair's line carries a single labor charge
      method: that labor charge's hours less the diagnostic hours
    - when: the earlier repair's line carries two or more labor charges
      method: the sum of the line's labor hours less the diagnostic hours
    - when: otherwise
      method: the hours of the earlier repair's latest labor charge
    baseline:
      repair_hours: prior_hours
    evidence:
    - history
    cross_difficulty: null
  - id: repeat_labor_allowance
    effect: parameter
    decides: repeat_allowance
    bindings:
    - repeat_allowance
    ladder:
    - when: the earlier repair is no more than allowance_months whole months before the diagnosis and the vehicle has been driven no more than allowance_miles miles since
      value: K('allowance_share')
    - when: the earlier repair is no more than extended_allowance_months whole months before the diagnosis and the first case does not hold
      value: K('extended_allowance_share')
    - when: otherwise
      value: '1'
    baseline:
      repeat_allowance: '1'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: maintained_vehicle_allowance
    effect: parameter
    decides: maintained_allowance
    bindings:
    - unit_plan_active
    - maintained_allowance
    ladder:
    - when: the vehicle carries an active Kessler Care maintenance plan and has been driven more than maintained_miles miles since the earlier repair
      value: K('maintained_share_high')
    - when: the vehicle carries an active Kessler Care maintenance plan and has been driven no more than maintained_miles miles since the earlier repair
      value: K('maintained_share_low')
    - when: otherwise
      value: '1'
    baseline:
      maintained_allowance: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: maintenance
  - id: parts_price_index
    effect: parameter
    decides: parts_index
    bindings:
    - parts_index
    ladder:
    - when: the earlier repair's line date is at least index_long_months whole months before the diagnosis
      value: K('index_long')
    - when: the earlier repair's line date is at least index_short_months and fewer than index_long_months whole months before the diagnosis
      value: K('index_short')
    - when: otherwise
      value: '0'
    baseline:
      parts_index: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: parts_volume_discount
    effect: parameter
    decides: parts_volume_pct
    bindings:
    - parts_12m
    - parts_volume_pct
    ladder:
    - when: the account's customer-pay parts charges dated within the last twelve whole months come to at least parts_volume_high_usd
      value: K('parts_volume_high_pct')
    - when: the account's customer-pay parts charges dated within the last twelve whole months come to at least parts_volume_low_usd and less than parts_volume_high_usd
      value: K('parts_volume_low_pct')
    - when: otherwise
      value: '0'
    baseline:
      parts_volume_pct: '0'
    evidence:
    - history
    cross_difficulty: null
