- id: service_ext_month_end_points_expiry
  base_policy_refs:
  - service_evt_rewards_points
  - service_evt_account_close
  overwrite:
  - base_policy: service_evt_rewards_points
    superseded_clause: Points expire at the end of the calendar month that is points_expiry_months after the month they were earned, oldest points used first (service_msr_expiring_points).
    replaced_by: For the month-end expiry of an open retail rewards account, this policy sets the points expiring, and only for such an expiry; any other expiry still removes the points earned in calendar months whose expiry period, points_expiry_months after the month earned, has ended at the end of that calendar month, oldest points used first.
  trigger: state_due
  subject:
  - service_points_expired
  computes: points
  target_tool: expire_owner_points_a6cb3dc9
  params:
    plan_extension_upper: 6
    plan_extension_silver: 3
    contract_extension_upper: 3
    contract_extension_silver: 2
    recent_redemption_months: 6
    reserve_months: 60
    reserve_upper: 500
    reserve_silver: 250
  rule: 'For the month-end expiry of an open retail rewards account, this policy sets the points expiring, and only for such an expiry; any other expiry still removes the points earned in calendar months whose expiry period, points_expiry_months after the month earned, has ended at the end of that calendar month, oldest points used first. The points expiring at a month-end run are the aged points less the points already used, never below zero. A point is aged once more than the expiry period has passed since the date it was earned, counted in whole months from that date to the day the run is made (a whole month is complete on the same day of the following month, or on the first day of the month after it where that month has no such day), the expiry period being points_expiry_months months; the points already used are every point ever redeemed and every point already expired on the account. The expiry period follows the customer''s Kessler Care plans and the tier: where the customer holds an active Kessler Care maintenance plan and the account is at Kessler Owner Rewards Gold or Platinum, the expiry period is lengthened by plan_extension_upper months; where the customer holds one and the account is at Kessler Owner Rewards Silver, it is lengthened by plan_extension_silver months; otherwise it is not lengthened by a plan. The expiry period also follows the customer''s Kessler Shield contracts and the tier: where the customer holds an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, the expiry period is lengthened by contract_extension_upper months; where the customer holds one and the account is at Kessler Owner Rewards Silver, it is lengthened by contract_extension_silver months; otherwise it is not lengthened by a contract. The points already used follow the account''s recent activity: where the account is at Kessler Owner Rewards Gold or Platinum and points were redeemed within the last recent_redemption_months whole months, the redemptions of those months are drawn from points earned since and are not set against the aged points, so the points already used are every point already expired plus the points redeemed before that window; where the account is below Kessler Owner Rewards Gold and a returned payment was posted within the last twelve whole months, the points earned on the repair order of the latest returned payment are treated as used as well (wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts), so the points already used are every point already expired, every point redeemed and those points; otherwise the points already used are every point expired and every point redeemed. The protected reserve follows how long the account has been open and the tier: where the account was opened at least reserve_months whole months before the day the run is made and is at Kessler Owner Rewards Gold or Platinum, reserve_upper aged points are protected; where it was opened at least reserve_months whole months before and is at Kessler Owner Rewards Silver, reserve_silver aged points are protected; otherwise no points are protected. The points expiring are figured in this order: first the aged points are found under the expiry period as every lengthening this policy sets out extends it; then the points already used are taken off; then every number of protected points this policy sets out is taken off; and the result is never below zero and never more than the points balance on file. A record falls within the last whole months named when fewer than that many whole months separate its date from the day the run is made, so records dated on that day count. The month-end run for a calendar month is due on that month''s last day; a run not made on that day is made on the day it is made, and in either case points are aged, and every window and every count of whole months is taken, to the day the run is made; the expiry is booked as one points-expired entry dated on the day the run is made, carrying the month the run is for as its billing month; a run that finds no points expiring is made without an entry.'
  prerequisite: []
  cross_category:
  - category: maintenance
    as: branch
    reads:
    - status
    note: The plan extension of the expiry period reads whether the customer holds an active Kessler Care plan.
  - category: vsc
    as: branch
    reads:
    - status
    note: The contract extension of the expiry period reads whether the customer holds an active Kessler Shield contract.
  compute:
  - upper_tier: F('variant_name') == 'Kessler Owner Rewards Gold' or F('variant_name') == 'Kessler Owner Rewards Platinum'
  - silver_tier: F('variant_name') == 'Kessler Owner Rewards Silver'
  - plan_active: CFIELD('maintenance', 'status', status='active') == 'active'
  - plan_extension: K('plan_extension_upper') if (plan_active and upper_tier) else (K('plan_extension_silver') if (plan_active and silver_tier) else 0)
  - contract_active: CFIELD('vsc', 'status', status='active') == 'active'
  - contract_extension: K('contract_extension_upper') if (contract_active and upper_tier) else (K('contract_extension_silver') if (contract_active and silver_tier) else 0)
  - expiry_months: P('points_expiry_months') + plan_extension + contract_extension
  - earned_points: SUM('service_ro_lines', 'points', event_type='service_points_earned')
  - unaged_points: SUM('service_ro_lines', 'points', within_months=expiry_months + 1, date_field='line_date', event_type='service_points_earned')
  - aged_points: earned_points - unaged_points
  - redeemed_points: SUM('service_ro_lines', 'points', event_type='service_points_redeemed')
  - expired_points: SUM('service_ro_lines', 'points', event_type='service_points_expired')
  - recent_redeemed: SUM('service_ro_lines', 'points', within_months=K('recent_redemption_months'), date_field='line_date', event_type='service_points_redeemed')
  - returned_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_payment_returned')
  - returned_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_payment_returned')
  - returned_ro_points: SUM('service_ro_lines', 'points', event_type='service_points_earned', repair_order_number=returned_ro)
  - used_points: expired_points + redeemed_points - recent_redeemed if (upper_tier and recent_redeemed > 0) else (expired_points + redeemed_points + returned_ro_points if (not upper_tier and returned_12m >= 1) else expired_points + redeemed_points)
  - months_open: MONTHS(F('opened_date'), NOW)
  - protected_reserve: K('reserve_upper') if (upper_tier and months_open >= K('reserve_months')) else (K('reserve_silver') if (silver_tier and months_open >= K('reserve_months')) else 0)
  - result: MN(F('rewards_points_balance'), MX(0, aged_points - used_points - protected_reserve))
  compute_basis:
    plan_active: where the customer holds an active Kessler Care maintenance plan and the account is at Kessler Owner Rewards Gold or Platinum, the expiry period is lengthened by plan_extension_upper months
    plan_extension: 'The expiry period follows the customer''s Kessler Care plans and the tier: where the customer holds an active Kessler Care maintenance plan and the account is at Kessler Owner Rewards Gold or Platinum, the expiry period is lengthened by plan_extension_upper months; where the customer holds one and the account is at Kessler Owner Rewards Silver, it is lengthened by plan_extension_silver months; otherwise it is not lengthened by a plan.'
    contract_active: where the customer holds an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, the expiry period is lengthened by contract_extension_upper months
    contract_extension: 'The expiry period also follows the customer''s Kessler Shield contracts and the tier: where the customer holds an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, the expiry period is lengthened by contract_extension_upper months; where the customer holds one and the account is at Kessler Owner Rewards Silver, it is lengthened by contract_extension_silver months; otherwise it is not lengthened by a contract.'
    earned_points: A point is aged once more than the expiry period has passed since the date it was earned, counted in whole months from that date to the day the run is made (a whole month is complete on the same day of the following month, or on the first day of the month after it where that month has no such day), the expiry period being points_expiry_months months; the points already used are every point ever redeemed and every point already expired on the account.
    unaged_points: A point is aged once more than the expiry period has passed since the date it was earned, counted in whole months from that date to the day the run is made (a whole month is complete on the same day of the following month, or on the first day of the month after it where that month has no such day), the expiry period being points_expiry_months months; the points already used are every point ever redeemed and every point already expired on the account.
    redeemed_points: A point is aged once more than the expiry period has passed since the date it was earned, counted in whole months from that date to the day the run is made (a whole month is complete on the same day of the following month, or on the first day of the month after it where that month has no such day), the expiry period being points_expiry_months months; the points already used are every point ever redeemed and every point already expired on the account.
    expired_points: A point is aged once more than the expiry period has passed since the date it was earned, counted in whole months from that date to the day the run is made (a whole month is complete on the same day of the following month, or on the first day of the month after it where that month has no such day), the expiry period being points_expiry_months months; the points already used are every point ever redeemed and every point already expired on the account.
    recent_redeemed: A record falls within the last whole months named when fewer than that many whole months separate its date from the day the run is made, so records dated on that day count.
    returned_12m: A record falls within the last whole months named when fewer than that many whole months separate its date from the day the run is made, so records dated on that day count.
    returned_ro: where the account is below Kessler Owner Rewards Gold and a returned payment was posted within the last twelve whole months, the points earned on the repair order of the latest returned payment are treated as used as well (wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts), so the points already used are every point already expired, every point redeemed and those points
    returned_ro_points: where the account is below Kessler Owner Rewards Gold and a returned payment was posted within the last twelve whole months, the points earned on the repair order of the latest returned payment are treated as used as well (wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts), so the points already used are every point already expired, every point redeemed and those points
    used_points: 'The points already used follow the account''s recent activity: where the account is at Kessler Owner Rewards Gold or Platinum and points were redeemed within the last recent_redemption_months whole months, the redemptions of those months are drawn from points earned since and are not set against the aged points, so the points already used are every point already expired plus the points redeemed before that window; where the account is below Kessler Owner Rewards Gold and a returned payment was posted within the last twelve whole months, the points earned on the repair order of the latest returned payment are treated as used as well (wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts), so the points already used are every point already expired, every point redeemed and those points; otherwise the points already used are every point expired and every point redeemed.'
    months_open: where the account was opened at least reserve_months whole months before the day the run is made and is at Kessler Owner Rewards Gold or Platinum, reserve_upper aged points are protected
    protected_reserve: 'The protected reserve follows how long the account has been open and the tier: where the account was opened at least reserve_months whole months before the day the run is made and is at Kessler Owner Rewards Gold or Platinum, reserve_upper aged points are protected; where it was opened at least reserve_months whole months before and is at Kessler Owner Rewards Silver, reserve_silver aged points are protected; otherwise no points are protected.'
    result: 'The points expiring are figured in this order: first the aged points are found under the expiry period as every lengthening this policy sets out extends it; then the points already used are taken off; then every number of protected points this policy sets out is taken off; and the result is never below zero and never more than the points balance on file. A record falls within the last whole months named when fewer than that many whole months separate its date from the day the run is made, so records dated on that day count.'
  factors:
  - id: care_plan_extension
    effect: parameter
    decides: plan_extension
    bindings:
    - plan_active
    - plan_extension
    ladder:
    - when: the customer holds an active Kessler Care maintenance plan and the account is at Kessler Owner Rewards Gold or Platinum
      value: K('plan_extension_upper')
    - when: the customer holds an active Kessler Care maintenance plan and the account is at Kessler Owner Rewards Silver
      value: K('plan_extension_silver')
    - when: otherwise
      value: '0'
    baseline:
      plan_extension: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: maintenance
  - id: shield_contract_extension
    effect: parameter
    decides: contract_extension
    bindings:
    - contract_active
    - contract_extension
    ladder:
    - when: the customer holds an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum
      value: K('contract_extension_upper')
    - when: the customer holds an active Kessler Shield service contract and the account is at Kessler Owner Rewards Silver
      value: K('contract_extension_silver')
    - when: otherwise
      value: '0'
    baseline:
      contract_extension: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: vsc
  - id: used_points_order
    effect: method
    decides: used_points
    bindings:
    - recent_redeemed
    - returned_12m
    - returned_ro
    - returned_ro_points
    - used_points
    ladder:
    - when: the account is at Kessler Owner Rewards Gold or Platinum and points were redeemed within the last recent_redemption_months whole months
      method: every point already expired plus the points redeemed before that window
    - when: the account is below Kessler Owner Rewards Gold and a returned payment was posted within the last twelve whole months
      method: every point already expired, every point redeemed, and the points earned on the repair order of the latest returned payment
    - when: otherwise
      method: every point already expired and every point redeemed
    baseline:
      used_points: expired_points + redeemed_points
    evidence:
    - history
    cross_difficulty: null
  - id: long_member_reserve
    effect: parameter
    decides: protected_reserve
    bindings:
    - months_open
    - protected_reserve
    ladder:
    - when: the account was opened at least reserve_months whole months before the day the run is made and is at Kessler Owner Rewards Gold or Platinum
      value: K('reserve_upper')
    - when: the account was opened at least reserve_months whole months before the day the run is made and is at Kessler Owner Rewards Silver
      value: K('reserve_silver')
    - when: otherwise
      value: '0'
    baseline:
      protected_reserve: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The points expiring at a month-end run are the aged points less the points already used, never below zero. A point is aged once more than the expiry period has passed since the date it was earned, counted in whole months from that date to the day the run is made (a whole month is complete on the same day of the following month, or on the first day of the month after it where that month has no such day), the expiry period being points_expiry_months months; the points already used are every point ever redeemed and every point already expired on the account. The month-end run for a calendar month is due on that month's last day; a run not made on that day is made on the day it is made, and in either case points are aged, and every window and every count of whole months is taken, to the day the run is made; the expiry is booked as one points-expired entry dated on the day the run is made, carrying the month the run is for as its billing month; a run that finds no points expiring is made without an entry.
    params:
    - points_expiry_months
  inputs:
    history:
    - table: service_ro_lines
      aggregate: sum
      field: points
      filters:
        event_type: service_points_earned
    - table: service_ro_lines
      aggregate: sum
      field: points
      filters:
        event_type: service_points_redeemed
    - table: service_ro_lines
      aggregate: sum
      field: points
      filters:
        event_type: service_points_expired
    - table: service_ro_lines
      aggregate: sum
      field: points
      within_months: 6
      filters:
        event_type: service_points_redeemed
    cross_category:
    - maintenance
    - vsc
- id: service_ext_owner_points_redemption
  base_policy_refs:
  - service_evt_rewards_points
  overwrite:
  - base_policy: service_evt_rewards_points
    superseded_clause: Points are redeemed in whole points of at least points_min_redemption, each worth points_value_usd, and may pay at most points_max_redemption_pct_of_ro of the repair order's customer-pay labor and parts total; the tier labor and parts discounts apply first and points pay part of what remains.
    replaced_by: For a redemption of the whole redeemable points balance toward the open repair order of a retail rewards account, this policy sets the redemption credit, and only for such a redemption; every other redemption is still made in whole points of at least points_min_redemption, each worth points_value_usd, and may pay at most points_max_redemption_pct_of_ro of the repair order's customer-pay labor and parts total, with the tier labor and parts discounts applied first and points paying part of what remains.
  trigger: on_request
  subject:
  - service_points_redeemed
  computes: credit_amount
  target_tool: redeem_owner_points_3e3ce956
  params:
    long_member_months: 60
    long_member_value_upper: 0.0125
    long_member_value_silver: 0.011
    owner_plan_bonus_pct: 0.16
    owner_bonus_pct: 0.1
    contract_bonus_upper: 0.05
    contract_bonus_silver: 0.03
    returned_payment_hold_points: 1000
    new_member_months: 12
    home_store_credit_upper: 10.0
    home_store_credit_silver: 5.0
    frequent_visit_payments: 4
    frequent_visit_credit_upper: 15.0
    frequent_visit_credit_silver: 8.0
  rule: 'For a redemption of the whole redeemable points balance toward the open repair order of a retail rewards account, this policy sets the redemption credit, and only for such a redemption; every other redemption is still made in whole points of at least points_min_redemption, each worth points_value_usd, and may pay at most points_max_redemption_pct_of_ro of the repair order''s customer-pay labor and parts total, with the tier labor and parts discounts applied first and points paying part of what remains. The open repair order is the repair order of the latest labor charge on the account, and the redeeming vehicle is the vehicle on that labor charge. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts. The redemption credit is the redeemable points times the value of a redeemed point, never more than points_max_redemption_pct_of_ro of the open repair order''s customer-pay labor and parts charges, rounded half up to the cent. The redeemable points are the whole points balance on file. A redeemed point is worth points_value_usd. The value of a redeemed point follows the tier and how long the account has been open: an account at Kessler Owner Rewards Gold or Kessler Owner Rewards Platinum opened at least long_member_months whole months before the redemption date is credited long_member_value_upper per point; an account at Kessler Owner Rewards Silver opened at least long_member_months whole months before the redemption date is credited long_member_value_silver per point; any other account is credited points_value_usd per point. The owner redemption bonus follows the redeeming vehicle''s records with the group: where the redeeming vehicle has a closed purchase deal and an active Kessler Care maintenance plan, the bonus is owner_plan_bonus_pct; where it has a closed purchase deal and no active Kessler Care maintenance plan, the bonus is owner_bonus_pct; otherwise there is no owner redemption bonus. The service contract bonus follows the redeeming vehicle''s Kessler Shield contract and the tier: where the redeeming vehicle carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, the bonus is contract_bonus_upper; where it carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Silver, the bonus is contract_bonus_silver; otherwise there is no service contract bonus. The redeemable points follow the account''s payment record and age: where a returned payment was posted on the account within the last twelve whole months and the account is below Kessler Owner Rewards Platinum, returned_payment_hold_points points stay held and the redeemable points are the points balance less that hold, never below zero; where no returned payment was posted within the last twelve whole months and the account was opened fewer than new_member_months whole months before the redemption date, enrollment bonus points (points credited without a repair order) stay held and the redeemable points are the points balance less those bonus points, never below zero; otherwise the redeemable points are the whole points balance. The home store credit follows where the open repair order was written and the tier: where it was written at the account''s home store and the account is at Kessler Owner Rewards Gold or Platinum, home_store_credit_upper dollars are added; where it was written at the home store and the account is at Kessler Owner Rewards Silver, home_store_credit_silver dollars are added; otherwise nothing is added. The frequent visit credit follows the account''s payment history and tier: where at least frequent_visit_payments payments were received on the account within the last twelve whole months and the account is at Kessler Owner Rewards Gold or Platinum, frequent_visit_credit_upper dollars are added; where at least frequent_visit_payments payments were received within the last twelve whole months and the account is at Kessler Owner Rewards Silver, frequent_visit_credit_silver dollars are added; otherwise nothing is added. The amounts are assembled in this order: first every bonus rate this policy sets out is added into one rate and applied once to the redeemable points times the value of a redeemed point; then every dollar credit this policy sets out is added; then the cap on the open repair order is applied to that sum; and the result is rounded half up to the cent once, at the end. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the redemption date, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on the redemption date count. The redemption credit is fixed only after the records carry the points earned for every repair order on the account that has been paid in full and whose customer-pay labor charges, less the estimate overage, comeback, goodwill and rewards redemption credits on it, come to at least one dollar. The redemption credit is not fixed until the month-end points expiry run for the latest calendar month whose last day falls on or before the redemption date has been made. The redemption is booked as one points redemption of the redeemable points for the redemption credit, together with its rewards redemption credit on the open repair order. Where the account carries no labor charge there is no open repair order and no redemption credit.'
  prerequisite:
  - problem: service_ext_paid_ro_points
    kind: value_input
    gate: points_on_file
    form: state
    policy_source: The redemption credit is fixed only after the records carry the points earned for every repair order on the account that has been paid in full and whose customer-pay labor charges, less the estimate overage, comeback, goodwill and rewards redemption credits on it, come to at least one dollar.
    condition: Every repair order of the account paid in full whose customer-pay labor charges, less the estimate overage, comeback, goodwill and rewards redemption credits on it, come to at least one dollar carries its points-earned entry.
    resolved_by: credit_paid_ro_points_b77dd6a9
    effect: Booking the points earned for the paid repair order raises the points balance on file, so the redeemable points and the redemption credit rise.
  - problem: service_ext_month_end_points_expiry
    kind: value_input
    gate: points_on_file
    form: action
    policy_source: The redemption credit is not fixed until the month-end points expiry run for the latest calendar month whose last day falls on or before the redemption date has been made.
    condition: 'The month-end run for the latest calendar month whose last day falls on or before the redemption date has been made: where it expires points, the records carry its points-expired entry with that billing month; where it expires none, no entry is due.'
    resolved_by: expire_owner_points_a6cb3dc9
    effect: Booking the month-end expiry lowers the points balance on file, so the redeemable points and the redemption credit fall.
    fallback_reason: A month-end run that finds no points expiring books no entry (an expiry entry always carries at least one point), so in such a month no record-visible state shows that the run was made; the wait is therefore stated on the run itself, which in such a month is made by working it out at no points.
  cross_category:
  - category: purchase
    as: branch
    reads:
    - status
    - vehicle_id
    note: The owner redemption bonus reads whether the redeeming vehicle has a closed purchase deal with the group.
  - category: maintenance
    as: branch
    reads:
    - status
    - vehicle_id
    note: The owner redemption bonus reads whether the redeeming vehicle has an active Kessler Care maintenance plan.
  - category: vsc
    as: branch
    reads:
    - status
    - vehicle_id
    note: The service contract bonus reads whether the redeeming vehicle carries an active Kessler Shield service contract.
  compute:
  - open_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_labor_charged')
  - review_open: open_ro != None
  - redeeming_vehicle: LATEST('service_ro_lines', 'vehicle_id', date_field='line_date', event_type='service_labor_charged')
  - open_ro_store: LATEST('service_ro_lines', 'store_id', date_field='line_date', event_type='service_labor_charged')
  - open_ro_labor_parts: SUM('service_ro_lines', 'amount', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=open_ro) + SUM('service_ro_lines', 'amount', event_type='service_parts_charged', pay_type='customer_pay', repair_order_number=open_ro)
  - points_on_file: F('rewards_points_balance')
  - months_open: MONTHS(F('opened_date'), NOW)
  - upper_tier: F('variant_name') == 'Kessler Owner Rewards Gold' or F('variant_name') == 'Kessler Owner Rewards Platinum'
  - silver_tier: F('variant_name') == 'Kessler Owner Rewards Silver'
  - returned_payments_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_payment_returned')
  - enrollment_bonus_points: SUM('service_ro_lines', 'points', event_type='service_points_earned', repair_order_number='')
  - payments_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_payment_received')
  - vehicle_deal_closed: CFIELD('purchase', 'status', vehicle_id=redeeming_vehicle, status='closed') == 'closed'
  - vehicle_plan_active: CFIELD('maintenance', 'status', vehicle_id=redeeming_vehicle, status='active') == 'active'
  - vehicle_contract_active: CFIELD('vsc', 'status', vehicle_id=redeeming_vehicle, status='active') == 'active'
  - point_value: K('long_member_value_upper') if (upper_tier and months_open >= K('long_member_months')) else (K('long_member_value_silver') if (silver_tier and months_open >= K('long_member_months')) else P('points_value_usd'))
  - owner_redemption_bonus: K('owner_plan_bonus_pct') if (vehicle_deal_closed and vehicle_plan_active) else (K('owner_bonus_pct') if (vehicle_deal_closed and not vehicle_plan_active) else 0)
  - contract_bonus: K('contract_bonus_upper') if (vehicle_contract_active and upper_tier) else (K('contract_bonus_silver') if (vehicle_contract_active and silver_tier) else 0)
  - enrollment_age_months: MONTHS(F('opened_date'), NOW)
  - redeemable_points: MX(0, points_on_file - K('returned_payment_hold_points')) if (returned_payments_12m >= 1 and F('variant_name') != 'Kessler Owner Rewards Platinum') else (MX(0, points_on_file - enrollment_bonus_points) if (returned_payments_12m == 0 and enrollment_age_months < K('new_member_months')) else points_on_file)
  - home_store_credit: K('home_store_credit_upper') if (open_ro_store == F('home_store_id') and upper_tier) else (K('home_store_credit_silver') if (open_ro_store == F('home_store_id') and silver_tier) else 0)
  - frequent_visit_credit: K('frequent_visit_credit_upper') if (payments_12m >= K('frequent_visit_payments') and upper_tier) else (K('frequent_visit_credit_silver') if (payments_12m >= K('frequent_visit_payments') and silver_tier) else 0)
  - result: (RND(MN(P('points_max_redemption_pct_of_ro') * open_ro_labor_parts, redeemable_points * point_value * (1 + owner_redemption_bonus + contract_bonus) + home_store_credit + frequent_visit_credit) + 0.000000001, 2)) if review_open else 0
  compute_basis:
    open_ro: The open repair order is the repair order of the latest labor charge on the account, and the redeeming vehicle is the vehicle on that labor charge. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts.
    redeeming_vehicle: The open repair order is the repair order of the latest labor charge on the account, and the redeeming vehicle is the vehicle on that labor charge. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts.
    open_ro_store: where it was written at the account's home store and the account is at Kessler Owner Rewards Gold or Platinum, home_store_credit_upper dollars are added
    open_ro_labor_parts: The redemption credit is the redeemable points times the value of a redeemed point, never more than points_max_redemption_pct_of_ro of the open repair order's customer-pay labor and parts charges, rounded half up to the cent.
    points_on_file: The redeemable points are the whole points balance on file.
    months_open: an account at Kessler Owner Rewards Gold or Kessler Owner Rewards Platinum opened at least long_member_months whole months before the redemption date is credited long_member_value_upper per point
    returned_payments_12m: A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the redemption date, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on the redemption date count.
    enrollment_bonus_points: enrollment bonus points (points credited without a repair order) stay held and the redeemable points are the points balance less those bonus points, never below zero
    payments_12m: A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the redemption date, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on the redemption date count.
    vehicle_deal_closed: where the redeeming vehicle has a closed purchase deal and an active Kessler Care maintenance plan, the bonus is owner_plan_bonus_pct
    vehicle_plan_active: where the redeeming vehicle has a closed purchase deal and an active Kessler Care maintenance plan, the bonus is owner_plan_bonus_pct; where it has a closed purchase deal and no active Kessler Care maintenance plan, the bonus is owner_bonus_pct
    vehicle_contract_active: where the redeeming vehicle carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, the bonus is contract_bonus_upper
    point_value: 'The value of a redeemed point follows the tier and how long the account has been open: an account at Kessler Owner Rewards Gold or Kessler Owner Rewards Platinum opened at least long_member_months whole months before the redemption date is credited long_member_value_upper per point; an account at Kessler Owner Rewards Silver opened at least long_member_months whole months before the redemption date is credited long_member_value_silver per point; any other account is credited points_value_usd per point.'
    owner_redemption_bonus: 'The owner redemption bonus follows the redeeming vehicle''s records with the group: where the redeeming vehicle has a closed purchase deal and an active Kessler Care maintenance plan, the bonus is owner_plan_bonus_pct; where it has a closed purchase deal and no active Kessler Care maintenance plan, the bonus is owner_bonus_pct; otherwise there is no owner redemption bonus.'
    contract_bonus: 'The service contract bonus follows the redeeming vehicle''s Kessler Shield contract and the tier: where the redeeming vehicle carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum, the bonus is contract_bonus_upper; where it carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Silver, the bonus is contract_bonus_silver; otherwise there is no service contract bonus.'
    redeemable_points: 'The redeemable points follow the account''s payment record and age: where a returned payment was posted on the account within the last twelve whole months and the account is below Kessler Owner Rewards Platinum, returned_payment_hold_points points stay held and the redeemable points are the points balance less that hold, never below zero; where no returned payment was posted within the last twelve whole months and the account was opened fewer than new_member_months whole months before the redemption date, enrollment bonus points (points credited without a repair order) stay held and the redeemable points are the points balance less those bonus points, never below zero; otherwise the redeemable points are the whole points balance.'
    home_store_credit: 'The home store credit follows where the open repair order was written and the tier: where it was written at the account''s home store and the account is at Kessler Owner Rewards Gold or Platinum, home_store_credit_upper dollars are added; where it was written at the home store and the account is at Kessler Owner Rewards Silver, home_store_credit_silver dollars are added; otherwise nothing is added.'
    frequent_visit_credit: 'The frequent visit credit follows the account''s payment history and tier: where at least frequent_visit_payments payments were received on the account within the last twelve whole months and the account is at Kessler Owner Rewards Gold or Platinum, frequent_visit_credit_upper dollars are added; where at least frequent_visit_payments payments were received within the last twelve whole months and the account is at Kessler Owner Rewards Silver, frequent_visit_credit_silver dollars are added; otherwise nothing is added.'
    result: 'The amounts are assembled in this order: first every bonus rate this policy sets out is added into one rate and applied once to the redeemable points times the value of a redeemed point; then every dollar credit this policy sets out is added; then the cap on the open repair order is applied to that sum; and the result is rounded half up to the cent once, at the end. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the redemption date, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on the redemption date count.'
    review_open: Where the account carries no labor charge there is no open repair order and no redemption credit.
    enrollment_age_months: 'The redeemable points follow the account''s payment record and age: where a returned payment was posted on the account within the last twelve whole months and the account is below Kessler Owner Rewards Platinum, returned_payment_hold_points points stay held and the redeemable points are the points balance less that hold, never below zero; where no returned payment was posted within the last twelve whole months and the account was opened fewer than new_member_months whole months before the redemption date, enrollment bonus points (points credited without a repair order) stay held and the redeemable points are the points balance less those bonus points, never below zero; otherwise the redeemable points are the whole points balance.'
  factors:
  - id: tenure_point_value
    effect: parameter
    decides: point_value
    bindings:
    - months_open
    - point_value
    ladder:
    - when: the account is at Kessler Owner Rewards Gold or Platinum and was opened at least long_member_months whole months before the redemption date
      value: K('long_member_value_upper')
    - when: the account is at Kessler Owner Rewards Silver and was opened at least long_member_months whole months before the redemption date
      value: K('long_member_value_silver')
    - when: otherwise
      value: P('points_value_usd')
    baseline:
      point_value: P('points_value_usd')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: owner_vehicle_bonus
    effect: parameter
    decides: owner_redemption_bonus
    bindings:
    - vehicle_deal_closed
    - vehicle_plan_active
    - owner_redemption_bonus
    ladder:
    - when: the redeeming vehicle has a closed purchase deal and an active Kessler Care maintenance plan
      value: K('owner_plan_bonus_pct')
    - when: the redeeming vehicle has a closed purchase deal and no active Kessler Care maintenance plan
      value: K('owner_bonus_pct')
    - when: otherwise
      value: '0'
    baseline:
      owner_redemption_bonus: '0'
    evidence:
    - cross_category
    cross_difficulty: purchase
  - id: shield_holder_bonus
    effect: parameter
    decides: contract_bonus
    bindings:
    - vehicle_contract_active
    - contract_bonus
    ladder:
    - when: the redeeming vehicle carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Gold or Platinum
      value: K('contract_bonus_upper')
    - when: the redeeming vehicle carries an active Kessler Shield service contract and the account is at Kessler Owner Rewards Silver
      value: K('contract_bonus_silver')
    - when: otherwise
      value: '0'
    baseline:
      contract_bonus: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: vsc
  - id: held_points_rule
    effect: method
    decides: redeemable_points
    bindings:
    - enrollment_age_months
    - returned_payments_12m
    - enrollment_bonus_points
    - redeemable_points
    ladder:
    - when: a returned payment was posted on the account within the last twelve whole months and the account is below Kessler Owner Rewards Platinum
      method: the points balance less a hold of returned_payment_hold_points points, never below zero
    - when: no returned payment was posted within the last twelve whole months and the account was opened fewer than new_member_months whole months before the redemption date
      method: the points balance less the enrollment bonus points credited without a repair order, never below zero
    - when: otherwise
      method: the whole points balance
    baseline:
      redeemable_points: points_on_file
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: home_store_redemption_credit
    effect: parameter
    decides: home_store_credit
    bindings:
    - open_ro_store
    - home_store_credit
    ladder:
    - when: the open repair order was written at the account's home store and the account is at Kessler Owner Rewards Gold or Platinum
      value: K('home_store_credit_upper')
    - when: the open repair order was written at the account's home store and the account is at Kessler Owner Rewards Silver
      value: K('home_store_credit_silver')
    - when: otherwise
      value: '0'
    baseline:
      home_store_credit: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: frequent_visit_redemption_credit
    effect: parameter
    decides: frequent_visit_credit
    bindings:
    - payments_12m
    - frequent_visit_credit
    ladder:
    - when: at least frequent_visit_payments payments were received on the account within the last twelve whole months and the account is at Kessler Owner Rewards Gold or Platinum
      value: K('frequent_visit_credit_upper')
    - when: at least frequent_visit_payments payments were received within the last twelve whole months and the account is at Kessler Owner Rewards Silver
      value: K('frequent_visit_credit_silver')
    - when: otherwise
      value: '0'
    baseline:
      frequent_visit_credit: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The open repair order is the repair order of the latest labor charge on the account, and the redeeming vehicle is the vehicle on that labor charge. The redemption credit is the redeemable points times the value of a redeemed point, never more than points_max_redemption_pct_of_ro of the open repair order's customer-pay labor and parts charges, rounded half up to the cent. The redeemable points are the whole points balance on file. A redeemed point is worth points_value_usd.
    params:
    - points_value_usd
    - points_max_redemption_pct_of_ro
  inputs:
    history:
    - table: service_ro_lines
      aggregate: latest
      field: repair_order_number
      filters:
        event_type: service_labor_charged
    - table: service_ro_lines
      aggregate: sum
      field: amount
      filters:
        event_type: service_labor_charged
        pay_type: customer_pay
    - table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 12
      filters:
        event_type: service_payment_returned
    - table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 12
      filters:
        event_type: service_payment_received
    - table: service_ro_lines
      aggregate: sum
      field: points
      filters:
        event_type: service_points_earned
        repair_order_number: ''
    cross_category:
    - purchase
    - maintenance
    - vsc
- id: service_ext_comeback_labor_credit
  base_policy_refs:
  - service_evt_comeback
  - service_evt_diagnostic
  - service_evt_estimate
  - service_evt_payment_terms
  - service_evt_rewards_points
  - service_evt_goodwill
  overwrite:
  - base_policy: service_evt_comeback
    superseded_clause: On a comeback the replacement parts are not billed and the labor is credited at comeback_labor_covered_pct as credit_reason comeback_repair pointing at the repeat labor row.
    replaced_by: For a comeback on a commercial fleet account, this policy sets the comeback credit, and only for such an account; on every account the replacement parts of a comeback are still not billed, and on any other account the labor is credited at comeback_labor_covered_pct as credit_reason comeback_repair pointing at the repeat labor row.
  trigger: state_due
  subject:
  - service_line_credited
  computes: credit_amount
  target_tool: credit_comeback_labor_f15915d4
  params:
    aged_repair_months: 6
    late_repair_months: 9
    late_repair_share: 0.7
    aged_share_other: 0.8
    wear_miles: 8000
    wear_deduction_no_plan: 0.15
    wear_deduction_plan: 0.05
    declined_major_usd: 500.0
    declined_share_major: 0.85
    declined_share_minor: 0.9
  rule: 'For a comeback on a commercial fleet account, this policy sets the comeback credit, and only for such an account; on every account the replacement parts of a comeback are still not billed, and on any other account the labor is credited at comeback_labor_covered_pct as credit_reason comeback_repair pointing at the repeat labor row. Comebacks are reviewed when a repair order is paid: the paid repair order is the repair order of the latest payment received on the account, the repeat labor charge is its latest customer-pay labor charge, and the unit is the vehicle on that charge. The original repair is the latest customer-pay parts replacement recorded on the same unit, and its labor charge is the total of the customer-pay labor charges on the same repair order and concern line as that parts charge. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts. Whole months are counted from one date to another, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day. The repeat falls inside the store''s repair warranty when the repeat labor charge''s line date is on or before the day comeback_warranty_months calendar months after the original repair''s line date (that month''s last day where it has no such day) and the repeat repair''s odometer is no more than comeback_warranty_miles miles beyond the original repair''s odometer. The comeback credit is the credit basis times the covered labor share, rounded half up to the cent; it is owed only for a repeat inside the store''s repair warranty and only when the original repair is on another repair order, and otherwise there is no comeback credit. The credit basis is the repeat labor charge. The covered labor share is comeback_labor_covered_pct. On a commercial fleet account, the covered labor share follows the age of the original repair: where the original repair''s line date is at least late_repair_months whole months before the repeat labor charge, the share is late_repair_share; where it is at least aged_repair_months and fewer than late_repair_months whole months before, the share is aged_share_other; otherwise the share is comeback_labor_covered_pct. On a commercial fleet account, the credit basis follows where the two repairs were done: where the original repair was written at a different store of the group from the repeat, the basis is the original repair''s labor charge, because the repair warranty refunds the labor of the job it covers; where both were written at the same store and the repeat labor charge is larger than the original labor charge, the basis is the original labor charge plus half of the amount by which the repeat labor charge exceeds it, the store and the customer sharing the extra time the repeat took; otherwise the basis is the repeat labor charge. On a commercial fleet account, the wear deduction follows the miles between the repairs and the unit''s maintenance record: where the repeat repair''s odometer is more than wear_miles miles beyond the original repair''s odometer and the unit has no active Kessler Care maintenance plan, the credit is reduced by wear_deduction_no_plan of itself; where it is more than wear_miles miles beyond and the unit has an active Kessler Care maintenance plan, the credit is reduced by wear_deduction_plan of itself; otherwise there is no wear deduction. On a commercial fleet account, the declined-work share follows the original repair order''s declined estimate decisions: where the original repair order carries a declined estimate decision for at least declined_major_usd, the credit is multiplied by declined_share_major; where it carries one or more declined estimate decisions and every one of them is for less than declined_major_usd, by declined_share_minor; otherwise it is not reduced. On a commercial fleet account, the shop fee refund follows the fees the customer already paid on the original repair, so that no fee is charged twice for the same job: where the original repair order carried both a shop supplies fee and a hazardous waste fee, the shop supplies and hazardous waste fees charged on the repeat repair order are added to the credit; where it carried a shop supplies fee and no hazardous waste fee, the shop supplies fee charged on the repeat repair order is added; otherwise no fee is added. On a commercial fleet account the credit is assembled in this order: first the credit basis is multiplied by the covered labor share; then every deduction this policy sets out is taken off that amount as a share of itself; then every share this policy sets out is applied to it; then every fee refund this policy sets out is added; and the result is rounded half up to the cent once, at the end. On any other account the credit is the repeat labor charge times comeback_labor_covered_pct, rounded half up to the cent, owed on the same warranty and repair order terms. The comeback credit is booked against the repeat labor charge as credit_reason comeback_repair. Where no payment has been received on the account, or the paid repair order carries no customer-pay labor charge, there is no repeat repair to review and no comeback credit. On every account, an original repair line that carries no customer-pay labor charge is a parts sale rather than a repair the store performed, carries no repair warranty, and no comeback credit is owed against it.'
  prerequisite: []
  cross_category:
  - category: maintenance
    as: branch
    reads:
    - status
    - vehicle_id
    note: The wear deduction reads whether the unit carries an active Kessler Care maintenance plan.
  compute:
  - paid_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_payment_received')
  - repeat_labor: (LATEST('service_ro_lines', 'amount', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=paid_ro) or 0)
  - review_open: paid_ro != None and repeat_labor > 0
  - repeat_unit: LATEST('service_ro_lines', 'vehicle_id', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=paid_ro)
  - repeat_date: (LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=paid_ro) or NOW)
  - repeat_odometer: (LATEST('service_ro_lines', 'odometer_in', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=paid_ro) or 0)
  - original_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay', vehicle_id=repeat_unit)
  - original_line: LATEST('service_ro_lines', 'line_letter', date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay', vehicle_id=repeat_unit)
  - original_date: (LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay', vehicle_id=repeat_unit) or NOW)
  - original_odometer: (LATEST('service_ro_lines', 'odometer_in', date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay', vehicle_id=repeat_unit) or 0)
  - original_labor: SUM('service_ro_lines', 'amount', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=original_ro, line_letter=original_line)
  - in_warranty: original_ro != None and original_ro != paid_ro and original_labor > 0 and -MONTHS(repeat_date, original_date) <= P('comeback_warranty_months') and repeat_odometer - original_odometer <= P('comeback_warranty_miles')
  - fleet_account: F('variant_name') == 'Commercial Fleet Account - Net 15' or F('variant_name') == 'Commercial Fleet Account - Net 30'
  - repair_age_months: MONTHS(original_date, repeat_date) if original_ro != None else 0
  - covered_share: K('late_repair_share') if repair_age_months >= K('late_repair_months') else (K('aged_share_other') if (repair_age_months >= K('aged_repair_months') and repair_age_months < K('late_repair_months')) else P('comeback_labor_covered_pct'))
  - repeat_store: LATEST('service_ro_lines', 'store_id', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=paid_ro)
  - original_store: LATEST('service_ro_lines', 'store_id', date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=original_ro, line_letter=original_line)
  - credit_basis: original_labor if original_store != repeat_store else ((original_labor + (repeat_labor - original_labor) * 0.5) if (original_store == repeat_store and repeat_labor > original_labor) else repeat_labor)
  - unit_plan_active: CFIELD('maintenance', 'status', vehicle_id=repeat_unit, status='active') == 'active'
  - wear_deduction: K('wear_deduction_no_plan') if (repeat_odometer - original_odometer > K('wear_miles') and not unit_plan_active) else (K('wear_deduction_plan') if (repeat_odometer - original_odometer > K('wear_miles') and unit_plan_active) else 0)
  - declined_on_original: COUNT('service_repair_authorizations', repair_order_number=original_ro, decision='declined')
  - declined_largest: MAX('service_repair_authorizations', 'estimate_amount', repair_order_number=original_ro, decision='declined')
  - declined_share: K('declined_share_major') if (declined_on_original >= 1 and declined_largest >= K('declined_major_usd')) else (K('declined_share_minor') if (declined_on_original >= 1 and declined_largest < K('declined_major_usd')) else 1)
  - orig_supplies_fees: COUNT('service_ro_lines', event_type='service_shop_fee_charged', fee_code='shop_supplies', repair_order_number=original_ro)
  - orig_hazard_fees: COUNT('service_ro_lines', event_type='service_shop_fee_charged', fee_code='hazardous_waste', repair_order_number=original_ro)
  - repeat_supplies_fee: SUM('service_ro_lines', 'amount', event_type='service_shop_fee_charged', fee_code='shop_supplies', repair_order_number=paid_ro)
  - repeat_hazard_fee: SUM('service_ro_lines', 'amount', event_type='service_shop_fee_charged', fee_code='hazardous_waste', repair_order_number=paid_ro)
  - fee_refund: repeat_supplies_fee + repeat_hazard_fee if (orig_supplies_fees >= 1 and orig_hazard_fees >= 1) else (repeat_supplies_fee if (orig_supplies_fees >= 1 and orig_hazard_fees == 0) else 0)
  - result: (RND(credit_basis * covered_share * (1 - wear_deduction) * declined_share + fee_refund + 0.000000001, 2) if fleet_account else RND(repeat_labor * P('comeback_labor_covered_pct') + 0.000000001, 2)) if (in_warranty and review_open) else 0
  factors:
  - id: aged_repair_share
    effect: parameter
    decides: covered_share
    bindings:
    - repair_age_months
    - covered_share
    ladder:
    - when: the original repair's line date is at least late_repair_months whole months before the repeat labor charge
      value: K('late_repair_share')
    - when: the original repair's line date is at least aged_repair_months and fewer than late_repair_months whole months before the repeat labor charge
      value: K('aged_share_other')
    - when: otherwise
      value: P('comeback_labor_covered_pct')
    baseline:
      covered_share: P('comeback_labor_covered_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: original_store_basis
    effect: method
    decides: credit_basis
    bindings:
    - repeat_store
    - original_store
    - credit_basis
    ladder:
    - when: the original repair was written at a different store of the group from the repeat
      method: the original repair's labor charge
    - when: both repairs were written at the same store and the repeat labor charge is larger than the original labor charge
      method: the original labor charge plus half of the amount by which the repeat labor charge exceeds it
    - when: otherwise
      method: the repeat labor charge
    baseline:
      credit_basis: repeat_labor
    evidence:
    - history
    cross_difficulty: null
  - id: wear_deduction_rule
    effect: parameter
    decides: wear_deduction
    bindings:
    - unit_plan_active
    - wear_deduction
    ladder:
    - when: the repeat repair's odometer is more than wear_miles miles beyond the original repair's odometer and the unit has no active Kessler Care maintenance plan
      value: K('wear_deduction_no_plan')
    - when: the repeat repair's odometer is more than wear_miles miles beyond the original repair's odometer and the unit has an active Kessler Care maintenance plan
      value: K('wear_deduction_plan')
    - when: otherwise
      value: '0'
    baseline:
      wear_deduction: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: maintenance
  - id: declined_work_share
    effect: parameter
    decides: declined_share
    bindings:
    - declined_on_original
    - declined_largest
    - declined_share
    ladder:
    - when: the original repair order carries a declined estimate decision for at least declined_major_usd
      value: K('declined_share_major')
    - when: the original repair order carries one or more declined estimate decisions and every one of them is for less than declined_major_usd
      value: K('declined_share_minor')
    - when: otherwise
      value: '1'
    baseline:
      declined_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: repeat_fee_refund
    effect: method
    decides: fee_refund
    bindings:
    - orig_supplies_fees
    - orig_hazard_fees
    - repeat_supplies_fee
    - repeat_hazard_fee
    - fee_refund
    ladder:
    - when: the original repair order carried both a shop supplies fee and a hazardous waste fee
      method: the shop supplies and hazardous waste fees charged on the repeat repair order are added to the credit
    - when: the original repair order carried a shop supplies fee and no hazardous waste fee
      method: the shop supplies fee charged on the repeat repair order is added to the credit
    - when: otherwise
      method: no fee is added
    baseline:
      fee_refund: '0'
    evidence:
    - history
    cross_difficulty: null
  compute_basis:
