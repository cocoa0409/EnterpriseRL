category: service
display_name: Service Accounts and Repair Orders
binding:
  holding_table: service_accounts
  event_tables: [service_ro_lines]
  intake_tables: [service_repair_authorizations]
  status_field: status
  variant_field: variant_name
  quantity_fields: {open_balance: service_receivable, rewards_points_balance: rewards_points}
lifecycle: {states: [active, credit_hold, closed], transitions: [{from: active, to: credit_hold, by: system, means: A commercial fleet account with an invoice unpaid past the credit-hold threshold is placed on credit hold.}, {from: credit_hold, to: active, by: agent, means: The past-due balance is paid and the fleet account is reinstated.}, {from: active, to: closed, by: agent, means: The account is closed at the account holder's request once nothing is owed.}]}
accounts:
- key: service_receivable
  unit: USD
  meaning: Amount the account holder owes on repair orders; customer-pay charges, shop fees, late fees and returned payments increase it, payments and credits reduce it.
- key: rewards_points
  unit: points
  meaning: Owner Rewards points available to the account holder; points earned increase it, points redeemed or expired reduce it.
parameter_schema:
  labor_rate_by_store_usd: Per-store mapping (store_code -> USD per hour) of the posted customer-pay labor rate.
  labor_discount_pct: Discount on customer-pay labor for the tier, as a fraction (0.10 = 10 percent).
  parts_discount_pct: Discount on customer-pay parts list price for the tier, as a fraction.
  discount_excludes_tires: Switch (true/false) — whether tires are excluded from the parts discount.
  max_labor_discount_usd_per_ro: Largest labor discount in dollars on one repair order, USD.
  diagnostic_fee_hours: Labor hours charged for a customer-pay diagnosis of one concern line.
  diagnostic_credit_on_repair: Switch (true/false) — whether a diagnostic fee is credited when the customer authorizes the repair it diagnosed.
  diagnostic_credit_window_days: Calendar days after the diagnosis within which the repair must be authorized for the diagnostic credit.
  diagnostic_credit_pct: Fraction of the diagnostic fee credited on an authorized repair.
  diagnostic_fee_waived_when_covered: Switch (true/false) — whether no diagnostic fee is charged when the diagnosed failure is repaired under a recall, warranty or service contract.
  shop_supplies_pct: Shop supplies fee as a fraction of customer-pay labor on the repair order.
  shop_supplies_cap_usd: Largest shop supplies fee per repair order, USD.
  hazardous_waste_fee_usd: Flat hazardous waste disposal fee per repair order with a customer-pay fluid or filter service, USD.
  tire_disposal_fee_per_tire_usd: Disposal fee per scrap tire removed on a customer-pay tire replacement, USD.
  storage_free_days: Calendar days after the completion notice a finished vehicle may stay at the store free of charge.
  storage_fee_per_day_usd: Storage fee per calendar day beyond the free days, USD.
  mobile_service_radius_miles: One-way miles from the store within which mobile service is offered.
  mobile_service_fee_usd: Flat trip fee per mobile service visit, USD.
  estimate_required_threshold_usd: Customer-pay amount above which a written estimate must be presented and authorized before work, USD.
  estimate_overage_tolerance_pct: Fraction by which final customer-pay charges of a line may exceed its authorized estimate without a new authorization.
  fleet_preauthorized_repair_limit_usd: Customer-pay amount per concern line that a fleet account authorizes in advance without a separate estimate decision, USD.
  customer_supplied_parts_allowed: Switch (true/false) — whether the store installs parts the customer supplies.
  comeback_warranty_months: Months the store's repair warranty covers a customer-pay repair, from the line date.
  comeback_warranty_miles: Miles beyond the repair odometer the store's repair warranty covers.
  comeback_labor_covered_pct: Fraction of labor credited on a comeback repair inside the repair warranty.
  goodwill_approval_limit_usd: Largest goodwill credit a service advisor or the desk may grant on one repair order without a manager, USD.
  special_order_parts_deposit_pct: Fraction of a special-order part's price collected as a deposit when it is ordered.
  special_order_parts_restocking_pct: Fraction of a special-order part's price charged when the customer cancels it after it has been ordered.
  payment_methods_allowed: List of payment methods (payment_method enum values) accepted on repair orders.
  payment_due_days: Calendar days after the repair order line date by which a fleet invoice is due; 0 means due at pickup.
  early_pay_discount_days: Calendar days after the line date within which full payment earns the early-payment discount.
  early_pay_discount_pct: Early-payment discount as a fraction of the invoice's customer-pay total.
  late_fee_grace_days: Calendar days after the due date before a late fee is assessed.
  late_fee_pct_per_month: Late fee as a fraction of the past-due balance, per calendar month assessed.
  late_fee_min_usd: Minimum late fee per assessment, USD.
  credit_hold_days_past_due: Days past the due date of the oldest unpaid invoice at which a fleet account goes on credit hold.
  credit_limit_usd: Open-account credit limit granted at the tier, USD.
  reinstatement_requires_full_payment: Switch (true/false) — whether a credit-hold account is reinstated only when its entire past-due balance is paid.
  returned_payment_fee_usd: Fee posted when a check or ACH payment is returned unpaid, USD.
  points_earn_per_usd: Owner Rewards points earned per whole dollar of customer-pay labor and parts paid.
  points_value_usd: Dollar value of one point when redeemed, USD.
  points_min_redemption: Fewest points that may be redeemed at one time.
  points_max_redemption_pct_of_ro: Largest fraction of a repair order's customer-pay labor and parts total that points may pay.
  max_points_per_ro: Most points one repair order can earn.
  points_expiry_months: Months after the month earned at whose end unredeemed points expire.
  points_earn_on_covered_lines: Switch (true/false) — whether lines paid by warranty, recall, service contract, maintenance plan or goodwill earn points.
  enrollment_bonus_points: Points credited once when an account is opened at the tier.
  account_close_points_forfeit: Switch (true/false) — whether unredeemed points are forfeited when the account is closed.
  account_close_requires_zero_balance: Switch (true/false) — whether an account may be closed only with nothing owed.
  tier_qualifying_spend_usd: Customer-pay spend over the review window needed to hold the tier at the annual review, USD.
  tier_review_window_months: Months of customer-pay history looked back on at the annual tier review.
