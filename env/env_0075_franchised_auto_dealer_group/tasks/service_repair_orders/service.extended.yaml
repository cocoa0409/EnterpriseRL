    maintained_allowance: 'The maintained-vehicle allowance follows the vehicle''s Kessler Care plan and the miles since the earlier repair: where the vehicle carries an active Kessler Care maintenance plan and has been driven more than maintained_miles miles since the earlier repair, the labor amount is multiplied by maintained_share_high; where it carries an active plan and has been driven no more than maintained_miles miles since, by maintained_share_low; otherwise it is not reduced.'
    parts_index: 'The parts price index follows the age of the earlier repair: where the earlier repair''s line date is at least index_long_months whole months before the diagnosis, the earlier parts list price is raised by index_long of itself; where it is at least index_short_months and fewer than index_long_months whole months before, by index_short; otherwise the earlier list price is used as recorded.'
    result: 'The estimate is figured in this order: first the repair hours are multiplied by the labor rate and the tier discount, within its cap, is taken off; then every allowance this policy sets out is applied to that labor amount; then every index this policy sets out is applied to the earlier parts list price, and the indexed price is reduced once by the tier''s parts discount and every further parts discount this policy sets out, added into one rate; and the labor and parts amounts are added and rounded half up to the cent once, at the end. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the day the estimate is priced, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on that day count.'
    parts_12m: A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the day the estimate is priced, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on that day count.
    parts_volume_pct: 'The parts volume discount follows the account''s customer-pay parts purchases: where the account''s customer-pay parts charges dated within the last twelve whole months come to at least parts_volume_high_usd, parts_volume_high_pct more is taken off the indexed parts price together with the tier''s parts discount; where they come to at least parts_volume_low_usd and less than parts_volume_high_usd, parts_volume_low_pct more is taken off; otherwise nothing more is taken off.'
    review_open: Where the account carries no diagnostic fee, or the vehicle on it has no earlier customer-pay parts charge, there is no repeat repair for this policy to price and it prices nothing.
    in_repair_warranty: Where the diagnosis date is on or before the day comeback_warranty_months calendar months after the earlier repair's line date (that month's last day where it has no such day) and the vehicle's odometer on the diagnostic fee is no more than comeback_warranty_miles miles beyond the earlier repair's odometer, the failure is a comeback inside the store's repair warranty, its replacement parts are not billed and this policy prices nothing.
    prior_labor_amount: Where the earlier repair's line carries no customer-pay labor charge, it is a parts sale rather than a repair the store performed, the failure does not repeat a repair, and this policy prices nothing.
  baseline:
    rule: The line estimated is the line of the latest diagnostic fee charged on the account, its posted labor rate is the one on that diagnostic fee, and its vehicle and odometer are those on that fee. The earlier repair is the repair order and concern line of the latest customer-pay parts charge recorded on the same vehicle, with every customer-pay parts and labor charge on that line. The estimate is the labor amount plus the parts amount, rounded half up to the cent. The labor amount is the repair hours times the labor rate, less the tier's labor_discount_pct of that product, the discount never more than max_labor_discount_usd_per_ro. The repair hours are the hours of the earlier repair's latest customer-pay labor charge. The labor rate is the posted labor rate on the diagnostic fee. The parts amount is the total list price of the earlier repair's customer-pay parts charges less the tier's parts_discount_pct.
    params:
    - labor_discount_pct
    - max_labor_discount_usd_per_ro
    - parts_discount_pct
  inputs:
    history:
    - table: service_ro_lines
      aggregate: latest
      field: repair_order_number
      filters:
        event_type: service_diagnostic_fee_charged
    - table: service_ro_lines
      aggregate: latest
      field: line_date
      filters:
        event_type: service_parts_charged
        pay_type: customer_pay
    - table: service_ro_lines
      aggregate: sum
      field: list_amount
      filters:
        event_type: service_parts_charged
        pay_type: customer_pay
    - table: service_ro_lines
      aggregate: count
      field: service_line_id
      filters:
        event_type: service_labor_charged
        pay_type: customer_pay
    - table: service_ro_lines
      aggregate: sum
      field: amount
      filters:
        event_type: service_parts_charged
        pay_type: customer_pay
    cross_category:
    - maintenance
- id: service_ext_diagnostic_credit
  base_policy_refs:
  - service_evt_diagnostic
  - service_evt_estimate
  - service_evt_payment_terms
  - service_evt_rewards_points
  - service_evt_comeback
  - service_evt_goodwill
  overwrite:
  - base_policy: service_evt_diagnostic
    superseded_clause: Where the tier's diagnostic_credit_on_repair is true, the diagnostic fee is credited at diagnostic_credit_pct when the customer authorizes the customer-pay repair of the same concern line.
    replaced_by: For a commercial fleet account, this policy sets the diagnostic credit, and only for such an account; on any other account, where the tier's diagnostic_credit_on_repair is true, the diagnostic fee is still credited at diagnostic_credit_pct when the customer authorizes the customer-pay repair of the same concern line.
  - base_policy: service_evt_diagnostic
    superseded_clause: A diagnostic credit is given only when the repair is authorized within diagnostic_credit_window_days calendar days after the diagnosis date.
    replaced_by: On every account the repair counts as authorized on the date of the latest authorized decision on the diagnosed line, a later decision superseding an earlier one, and a diagnostic credit is given only when that date falls within diagnostic_credit_window_days calendar days after the diagnosis date, the diagnosis date being day 0.
  trigger: state_due
  subject:
  - service_line_credited
  computes: credit_amount
  target_tool: credit_diagnostic_fee_eae01e67
  params:
    spend_full_credit_usd: 15000.0
    major_repair_usd: 1500.0
    away_share_plan: 0.9
    away_share_no_plan: 0.75
    slow_decision_days: 14
    late_decision_days: 7
    slow_decision_share: 0.5
    late_decision_share: 0.75
    late_fee_share: 0.75
    returned_payment_share: 0.5
  rule: 'For a commercial fleet account, this policy sets the diagnostic credit, and only for such an account; on any other account, where the tier''s diagnostic_credit_on_repair is true, the diagnostic fee is still credited at diagnostic_credit_pct when the customer authorizes the customer-pay repair of the same concern line. The diagnostic fee credited is the latest diagnostic fee charged on the account, and the line is its repair order and concern line. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts. The authorized estimate is the estimate amount of the latest authorized decision on that repair order and concern line, and the decision date is that decision''s date. The diagnostic credit is the diagnostic fee times the diagnostic credit share, rounded half up to the cent, and is given only when the decision date falls within diagnostic_credit_window_days calendar days after the diagnosis date; otherwise there is no credit. On every account the repair counts as authorized on the date of the latest authorized decision on the diagnosed line, a later decision superseding an earlier one, and a diagnostic credit is given only when that date falls within diagnostic_credit_window_days calendar days after the diagnosis date, the diagnosis date being day 0. The diagnostic credit share is diagnostic_credit_pct. On a commercial fleet account, the diagnostic credit share follows the account''s twelve-month spend and the size of the authorized repair, the twelve-month spend being the account''s customer-pay labor and parts charges dated within the last twelve whole months less the comeback, estimate overage, goodwill and early-payment discount credits dated within those months: where the authorized estimate is at least major_repair_usd and the twelve-month spend is below spend_full_credit_usd, the share is diagnostic_credit_pct times the twelve-month spend divided by spend_full_credit_usd; where the authorized estimate is below major_repair_usd and the twelve-month spend is below spend_full_credit_usd, the share is diagnostic_credit_pct times the authorized estimate divided by major_repair_usd; otherwise the share is diagnostic_credit_pct. On a commercial fleet account, the away-store share follows where the diagnosis was done and the maintenance record of the vehicle on the diagnostic fee: where the diagnostic fee was charged at a store other than the account''s home store and that vehicle carries an active Kessler Care maintenance plan, the credit is multiplied by away_share_plan; where it was charged away from the home store and that vehicle carries no active Kessler Care maintenance plan, by away_share_no_plan; otherwise it is not reduced. On a commercial fleet account, the decision share follows how long the customer took to authorize: where the authorized decision came more than slow_decision_days calendar days after the diagnosis date, the credit is multiplied by slow_decision_share; where it came more than late_decision_days and no more than slow_decision_days calendar days after, by late_decision_share; otherwise it is not reduced. On a commercial fleet account, the diagnostic standing share follows the account''s payment record: where a late fee was assessed on the account within the last twelve whole months and no payment was returned in that time, the credit is multiplied by late_fee_share; where a payment was returned on the account within the last twelve whole months, by returned_payment_share; otherwise it is not reduced. On a commercial fleet account the credit is figured in this order: first the diagnostic credit share is applied to the diagnostic fee; then every share this policy sets out that reduces the credit is applied; and the result is rounded half up to the cent once, at the end. On any other account the credit is the diagnostic fee times diagnostic_credit_pct where the tier''s diagnostic_credit_on_repair is true, and nothing where it is false, rounded half up to the cent, on the same window terms. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the day the credit is worked out, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on that day count. A diagnostic credit on a line whose vehicle carries an earlier customer-pay parts repair, with a customer-pay labor charge on its line and its store repair warranty ended by the diagnosis date, is not booked until the records carry the customer''s authorized decision on the written estimate for the same concern line. The diagnostic credit is fixed only after the records carry the early-payment discount owed on every fleet invoice of the account paid in full inside its discount window whose customer-pay labor charges exceed the comeback, estimate overage and goodwill credits on it by at least ten dollars. The diagnostic credit is booked against the diagnostic fee as credit_reason diagnostic_applied_to_repair. Where the account carries no diagnostic fee there is no diagnostic credit.'
  prerequisite:
  - problem: service_ext_repeat_repair_estimate
    kind: value_input
    gate: authorized_estimate
    form: state
    policy_source: A diagnostic credit on a line whose vehicle carries an earlier customer-pay parts repair, with a customer-pay labor charge on its line and its store repair warranty ended by the diagnosis date, is not booked until the records carry the customer's authorized decision on the written estimate for the same concern line.
    condition: Where the diagnosed vehicle's latest earlier customer-pay parts repair carries a customer-pay labor charge on its line and is outside the store's repair warranty at the diagnosis date, the diagnosed concern line carries the customer's authorized decision on the written estimate.
    resolved_by: authorize_repair_estimate_690e2aa2
    effect: The customer's authorized decision opens the credit and its estimate amount and date decide the diagnostic credit share and the decision share.
  - problem: service_ext_early_payment_discount
    kind: value_input
    gate: spend_12m
    form: state
    policy_source: The diagnostic credit is fixed only after the records carry the early-payment discount owed on every fleet invoice of the account paid in full inside its discount window whose customer-pay labor charges exceed the comeback, estimate overage and goodwill credits on it by at least ten dollars.
    condition: Every fleet invoice of the account paid in full inside its discount window whose customer-pay labor charges exceed the comeback, estimate overage and goodwill credits on it by at least ten dollars carries its early-payment discount credit.
    resolved_by: credit_early_payment_discount_b0e7362c
    effect: Booking the early-payment discount lowers the twelve-month spend, so the diagnostic credit share and the diagnostic credit fall.
  cross_category:
  - category: maintenance
    as: branch
    reads:
    - status
    - vehicle_id
    note: The away-store share reads whether the diagnosed unit carries an active Kessler Care maintenance plan.
  compute:
  - diag_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_diagnostic_fee_charged')
  - diag_line: LATEST('service_ro_lines', 'line_letter', date_field='line_date', event_type='service_diagnostic_fee_charged')
  - review_open: diag_ro != None
  - diag_fee: SUM('service_ro_lines', 'amount', event_type='service_diagnostic_fee_charged', repair_order_number=diag_ro, line_letter=diag_line)
  - diag_date: (LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_diagnostic_fee_charged') or NOW)
  - fleet_account: F('variant_name') == 'Commercial Fleet Account - Net 15' or F('variant_name') == 'Commercial Fleet Account - Net 30'
  - diag_store: LATEST('service_ro_lines', 'store_id', date_field='line_date', event_type='service_diagnostic_fee_charged')
  - diag_unit: LATEST('service_ro_lines', 'vehicle_id', date_field='line_date', event_type='service_diagnostic_fee_charged')
  - authorized_estimate: LATEST('service_repair_authorizations', 'estimate_amount', date_field='decided_date', repair_order_number=diag_ro, line_letter=diag_line, decision='authorized') or 0
  - decision_date: LATEST('service_repair_authorizations', 'decided_date', date_field='decided_date', repair_order_number=diag_ro, line_letter=diag_line, decision='authorized') or diag_date
  - days_to_decision: DAYS(diag_date, decision_date)
  - spend_12m: SUM('service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay') + SUM('service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay') - SUM('service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_line_credited', credit_reason='comeback_repair') - SUM('service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_line_credited', credit_reason='estimate_overage') - SUM('service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_line_credited', credit_reason='goodwill') - SUM('service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_line_credited', credit_reason='early_payment_discount')
  - credit_share: P('diagnostic_credit_pct') * spend_12m / K('spend_full_credit_usd') if (authorized_estimate >= K('major_repair_usd') and spend_12m < K('spend_full_credit_usd')) else (P('diagnostic_credit_pct') * authorized_estimate / K('major_repair_usd') if (authorized_estimate < K('major_repair_usd') and spend_12m < K('spend_full_credit_usd')) else P('diagnostic_credit_pct'))
  - unit_plan_active: CFIELD('maintenance', 'status', vehicle_id=diag_unit, status='active') == 'active'
  - away_share: K('away_share_plan') if (diag_store != F('home_store_id') and unit_plan_active) else (K('away_share_no_plan') if (diag_store != F('home_store_id') and not unit_plan_active) else 1)
  - decision_share: K('slow_decision_share') if DAYS(diag_date, decision_date) > K('slow_decision_days') else (K('late_decision_share') if DAYS(diag_date, decision_date) > K('late_decision_days') else 1)
  - late_fees_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_late_fee_charged')
  - returned_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_payment_returned')
  - standing_share: K('late_fee_share') if (late_fees_12m >= 1 and returned_12m == 0) else (K('returned_payment_share') if returned_12m >= 1 else 1)
  - in_window: authorized_estimate > 0 and days_to_decision <= P('diagnostic_credit_window_days')
  - result: ((RND(diag_fee * credit_share * away_share * decision_share * standing_share + 0.000000001, 2) if fleet_account else (RND(diag_fee * P('diagnostic_credit_pct') + 0.000000001, 2) if P('diagnostic_credit_on_repair') else 0)) if in_window else 0) if review_open else 0
  factors:
  - id: spend_scaled_share
    effect: method
    decides: credit_share
    bindings:
    - spend_12m
    - credit_share
    ladder:
    - when: the authorized estimate is at least major_repair_usd and the twelve-month spend is below spend_full_credit_usd
      method: diagnostic_credit_pct times the twelve-month spend divided by spend_full_credit_usd
    - when: the authorized estimate is below major_repair_usd and the twelve-month spend is below spend_full_credit_usd
      method: diagnostic_credit_pct times the authorized estimate divided by major_repair_usd
    - when: otherwise
      method: diagnostic_credit_pct
    baseline:
      credit_share: P('diagnostic_credit_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: away_store_share_rule
    effect: parameter
    decides: away_share
    bindings:
    - diag_store
    - diag_unit
    - unit_plan_active
    - away_share
    ladder:
    - when: the diagnostic fee was charged at a store other than the account's home store and the vehicle on the diagnostic fee carries an active Kessler Care maintenance plan
      value: K('away_share_plan')
    - when: the diagnostic fee was charged at a store other than the account's home store and the vehicle on the diagnostic fee carries no active Kessler Care maintenance plan
      value: K('away_share_no_plan')
    - when: otherwise
      value: '1'
    baseline:
      away_share: '1'
    evidence:
    - history
    - cross_category
    cross_difficulty: maintenance
  - id: decision_speed_share
    effect: parameter
    decides: decision_share
    bindings:
    - decision_share
    ladder:
    - when: the authorized decision came more than slow_decision_days calendar days after the diagnosis date
      value: K('slow_decision_share')
    - when: the authorized decision came more than late_decision_days and no more than slow_decision_days calendar days after the diagnosis date
      value: K('late_decision_share')
    - when: otherwise
      value: '1'
    baseline:
      decision_share: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: diagnostic_standing_share
    effect: parameter
    decides: standing_share
    bindings:
    - late_fees_12m
    - returned_12m
    - standing_share
    ladder:
    - when: a late fee was assessed on the account within the last twelve whole months and no payment was returned in that time
      value: K('late_fee_share')
    - when: a payment was returned on the account within the last twelve whole months
      value: K('returned_payment_share')
    - when: otherwise
      value: '1'
    baseline:
      standing_share: '1'
    evidence:
    - history
    cross_difficulty: null
