    - date
    cross_difficulty: null
  - id: owner_overage_courtesy
    effect: parameter
    decides: owner_courtesy
    bindings:
    - line_vehicle
    - deal_financing
    - owner_courtesy
    ladder:
    - when: the vehicle on the line's labor charge has a closed purchase deal financed on a dealer-arranged installment contract and the account is at Kessler Owner Rewards Gold or Platinum
      value: K('courtesy_financed')
    - when: the vehicle on the line's labor charge has a closed purchase deal paid in cash or through an outside lender and the account is at Kessler Owner Rewards Gold or Platinum
      value: K('courtesy_owner')
    - when: otherwise
      value: '0'
    baseline:
      owner_courtesy: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: purchase
  - id: late_completion_courtesy
    effect: parameter
    decides: late_close_courtesy
    bindings:
    - late_close_courtesy
    ladder:
    - when: the line's labor closed more than late_close_days calendar days after the latest authorized decision and the account is at Kessler Owner Rewards Gold or Platinum
      value: K('late_close_upper')
    - when: the line's labor closed more than late_close_days calendar days after the latest authorized decision and the account is at another tier
      value: K('late_close_other')
