    net30: 'The discount window follows how the invoice was paid and the terms: where the latest payment on the invoice was made by ACH and the account is at Commercial Fleet Account - Net 30, the window is ach_window_net30 calendar days; where it was made by ACH and the account is at Commercial Fleet Account - Net 15, the window is ach_window_net15 calendar days; otherwise the window is early_pay_discount_days.'
