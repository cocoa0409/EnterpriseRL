    declined_largest: 'On a commercial fleet account, the declined-work share follows the original repair order''s declined estimate decisions: where the original repair order carries a declined estimate decision for at least declined_major_usd, the credit is multiplied by declined_share_major; where it carries one or more declined estimate decisions and every one of them is for less than declined_major_usd, by declined_share_minor; otherwise it is not reduced.'
    declined_share: 'On a commercial fleet account, the declined-work share follows the original repair order''s declined estimate decisions: where the original repair order carries a declined estimate decision for at least declined_major_usd, the credit is multiplied by declined_share_major; where it carries one or more declined estimate decisions and every one of them is for less than declined_major_usd, by declined_share_minor; otherwise it is not reduced.'
    result: 'On a commercial fleet account the credit is assembled in this order: first the credit basis is multiplied by the covered labor share; then every deduction this policy sets out is taken off that amount as a share of itself; then every share this policy sets out is applied to it; then every fee refund this policy sets out is added; and the result is rounded half up to the cent once, at the end. On any other account the credit is the repeat labor charge times comeback_labor_covered_pct, rounded half up to the cent, owed on the same warranty and repair order terms.'
    review_open: Where no payment has been received on the account, or the paid repair order carries no customer-pay labor charge, there is no repeat repair to review and no comeback credit.
    orig_supplies_fees: 'On a commercial fleet account, the shop fee refund follows the fees the customer already paid on the original repair, so that no fee is charged twice for the same job: where the original repair order carried both a shop supplies fee and a hazardous waste fee, the shop supplies and hazardous waste fees charged on the repeat repair order are added to the credit; where it carried a shop supplies fee and no hazardous waste fee, the shop supplies fee charged on the repeat repair order is added; otherwise no fee is added.'
    orig_hazard_fees: 'On a commercial fleet account, the shop fee refund follows the fees the customer already paid on the original repair, so that no fee is charged twice for the same job: where the original repair order carried both a shop supplies fee and a hazardous waste fee, the shop supplies and hazardous waste fees charged on the repeat repair order are added to the credit; where it carried a shop supplies fee and no hazardous waste fee, the shop supplies fee charged on the repeat repair order is added; otherwise no fee is added.'
    repeat_supplies_fee: 'On a commercial fleet account, the shop fee refund follows the fees the customer already paid on the original repair, so that no fee is charged twice for the same job: where the original repair order carried both a shop supplies fee and a hazardous waste fee, the shop supplies and hazardous waste fees charged on the repeat repair order are added to the credit; where it carried a shop supplies fee and no hazardous waste fee, the shop supplies fee charged on the repeat repair order is added; otherwise no fee is added.'
    repeat_hazard_fee: 'On a commercial fleet account, the shop fee refund follows the fees the customer already paid on the original repair, so that no fee is charged twice for the same job: where the original repair order carried both a shop supplies fee and a hazardous waste fee, the shop supplies and hazardous waste fees charged on the repeat repair order are added to the credit; where it carried a shop supplies fee and no hazardous waste fee, the shop supplies fee charged on the repeat repair order is added; otherwise no fee is added.'
    fee_refund: 'On a commercial fleet account, the shop fee refund follows the fees the customer already paid on the original repair, so that no fee is charged twice for the same job: where the original repair order carried both a shop supplies fee and a hazardous waste fee, the shop supplies and hazardous waste fees charged on the repeat repair order are added to the credit; where it carried a shop supplies fee and no hazardous waste fee, the shop supplies fee charged on the repeat repair order is added; otherwise no fee is added.'
  baseline:
    rule: 'Comebacks are reviewed when a repair order is paid: the paid repair order is the repair order of the latest payment received on the account, the repeat labor charge is its latest customer-pay labor charge, and the unit is the vehicle on that charge. The original repair is the latest customer-pay parts replacement recorded on the same unit, and its labor charge is the total of the customer-pay labor charges on the same repair order and concern line as that parts charge. The repeat falls inside the store''s repair warranty when the repeat labor charge''s line date is on or before the day comeback_warranty_months calendar months after the original repair''s line date (that month''s last day where it has no such day) and the repeat repair''s odometer is no more than comeback_warranty_miles miles beyond the original repair''s odometer. The comeback credit is the credit basis times the covered labor share, rounded half up to the cent; it is owed only for a repeat inside the store''s repair warranty and only when the original repair is on another repair order, and otherwise there is no comeback credit. The credit basis is the repeat labor charge. The covered labor share is comeback_labor_covered_pct.'
    params:
    - comeback_labor_covered_pct
    - comeback_warranty_months
    - comeback_warranty_miles
  inputs:
    history:
    - table: service_ro_lines
      aggregate: latest
      field: repair_order_number
      filters:
        event_type: service_payment_received
    - table: service_ro_lines
      aggregate: latest
      field: line_date
      filters:
        event_type: service_parts_charged
        pay_type: customer_pay
    - table: service_ro_lines
      aggregate: sum
      field: amount
      filters:
        event_type: service_labor_charged
        pay_type: customer_pay
    - table: service_repair_authorizations
      aggregate: count
      field: service_auth_id
      filters:
        decision: declined
    - table: service_repair_authorizations
      aggregate: max
      field: estimate_amount
      filters:
        decision: declined
    - table: service_ro_lines
      aggregate: sum
      field: amount
      filters:
        event_type: service_shop_fee_charged
    cross_category:
    - maintenance
- id: service_ext_early_payment_discount
  base_policy_refs:
  - service_evt_payment_terms
  - service_evt_diagnostic
  - service_evt_estimate
  - service_evt_rewards_points
  - service_evt_comeback
  - service_evt_goodwill
  overwrite:
  - base_policy: service_evt_payment_terms
    superseded_clause: A fleet invoice paid in full within early_pay_discount_days calendar days after its line date earns an early-payment discount of early_pay_discount_pct of its customer-pay total, rounded to the cent and credited as credit_reason early_payment_discount; a partial payment earns none.
    replaced_by: For a fleet invoice paid in full, this policy sets the early-payment discount, and only for such an invoice; it is still credited as credit_reason early_payment_discount, rounded half up to the cent, and a partial payment earns none.
  trigger: state_due
  subject:
  - service_line_credited
  computes: credit_amount
  target_tool: credit_early_payment_discount_b0e7362c
  params:
    ach_window_net30: 15
    ach_window_net15: 12
    fleet_deal_pct_net30: 0.025
    fleet_deal_pct_net15: 0.015
    prompt_payer_payments: 8
    prompt_payer_addon_net30: 0.005
    prompt_payer_addon_net15: 0.0025
    tenure_months: 60
    tenure_addon_net30: 0.005
    tenure_addon_net15: 0.0025
    late_fee_share: 0.5
    returned_payment_share: 0.25
    min_discount_labor_usd: 10.0
  rule: 'For a fleet invoice paid in full, this policy sets the early-payment discount, and only for such an invoice; it is still credited as credit_reason early_payment_discount, rounded half up to the cent, and a partial payment earns none. The invoice reviewed is the repair order of the latest payment received on the account; its invoice date is the latest line date of its labor charges, its payment date is the date of that latest payment, and its unit is the vehicle on its labor charges. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts. The invoice is paid in full when its charges, customer-pay and deductible alike, less every credit on it, less the payments received on it, plus any payment returned on it, come to zero or less. The early-payment discount is the discount rate times the discountable total, rounded half up to the cent, and is given only when the invoice is paid in full no more than the discount window of calendar days after its invoice date; otherwise there is no discount. The discount rate is early_pay_discount_pct. The discount window is early_pay_discount_days calendar days. The discountable total is the invoice''s customer-pay labor and parts charges less the comeback, estimate overage and goodwill credits on it. The discount window follows how the invoice was paid and the terms: where the latest payment on the invoice was made by ACH and the account is at Commercial Fleet Account - Net 30, the window is ach_window_net30 calendar days; where it was made by ACH and the account is at Commercial Fleet Account - Net 15, the window is ach_window_net15 calendar days; otherwise the window is early_pay_discount_days. The discount rate follows how the invoice''s unit was bought and the terms: where the unit was bought under a Fleet Vehicle Purchase Agreement and the account is at Commercial Fleet Account - Net 30, the rate is fleet_deal_pct_net30; where it was bought under a Fleet Vehicle Purchase Agreement and the account is at Commercial Fleet Account - Net 15, the rate is fleet_deal_pct_net15; otherwise the rate is early_pay_discount_pct. The prompt-payer addition follows the account''s payment history and terms: where at least prompt_payer_payments payments were received on the account within the last twelve whole months and the account is at Commercial Fleet Account - Net 30, prompt_payer_addon_net30 is added to the rate; where at least that many were received and the account is at Commercial Fleet Account - Net 15, prompt_payer_addon_net15 is added; otherwise nothing is added. The tenure addition follows how long the account has been open and the terms: where the account was opened at least tenure_months whole months before the payment date and is at Commercial Fleet Account - Net 30, tenure_addon_net30 is added to the rate; where it was opened at least that long before and is at Commercial Fleet Account - Net 15, tenure_addon_net15 is added; otherwise nothing is added. The discountable total follows how the invoice was paid and the unit''s maintenance record: where the latest payment was made by credit card, the discountable total is the customer-pay labor charges less the credits on the invoice, and parts earn no discount; where the latest payment was made by ACH or check and the unit carries an active Kessler Care maintenance plan, the discountable total is the customer-pay labor and parts charges plus the shop supplies fee, less the credits on the invoice; otherwise it is the customer-pay labor and parts charges less the credits on the invoice. The discount standing share follows the account''s payment record: where a late fee was assessed on the account within the last twelve whole months and no payment was returned in that time, the discount is multiplied by late_fee_share; where a payment was returned on the account within the last twelve whole months, the discount is multiplied by returned_payment_share; otherwise it is not reduced. The discount is figured in this order: first every addition this policy sets out is added to the discount rate, giving one rate; then that rate is applied once to the discountable total; then every share this policy sets out that reduces the discount is applied; and the result is rounded half up to the cent once, at the end. No discount is given on an invoice whose customer-pay labor charges exceed the comeback, estimate overage and goodwill credits on it by less than min_discount_labor_usd. A record falls within the last twelve whole months when fewer than twelve whole months separate its date from the day the discount is worked out, a whole month being complete on the same day of a later month, or on the first day of the month after it where that month has no such day, so records dated on that day count. The early-payment discount on an invoice is not fixed until the records carry the comeback credit owed on every repeat repair on that invoice that falls inside the repair warranty and whose original repair line carries a customer-pay labor charge. The discount is booked against the invoice''s latest customer-pay labor charge as credit_reason early_payment_discount. Where no payment has been received on the account, or the paid repair order carries no customer-pay labor charge, there is no invoice to review and no discount.'
  prerequisite:
  - problem: service_ext_comeback_labor_credit
    kind: value_input
    gate: invoice_credits
    form: state
    policy_source: The early-payment discount on an invoice is not fixed until the records carry the comeback credit owed on every repeat repair on that invoice that falls inside the repair warranty and whose original repair line carries a customer-pay labor charge.
    condition: Every customer-pay labor charge on the invoice that repeats, inside the repair warranty, the unit's latest customer-pay parts repair whose line carries a customer-pay labor charge carries a comeback credit.
    resolved_by: credit_comeback_labor_f15915d4
    effect: Booking the comeback credit lowers the discountable total, so the early-payment discount falls.
  cross_category:
  - category: purchase
    as: branch
    reads:
    - variant_name
    - status
    - vehicle_id
    note: The discount rate reads whether the invoice's unit was bought under a Fleet Vehicle Purchase Agreement.
  - category: maintenance
    as: branch
    reads:
    - status
    - vehicle_id
    note: The discountable total reads whether the unit carries an active Kessler Care maintenance plan.
  compute:
  - paid_ro: LATEST('service_ro_lines', 'repair_order_number', date_field='line_date', event_type='service_payment_received')
  - invoice_date: (LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_labor_charged', repair_order_number=paid_ro) or NOW)
  - payment_date: (LATEST('service_ro_lines', 'line_date', date_field='line_date', event_type='service_payment_received', repair_order_number=paid_ro) or NOW)
  - invoice_unit: LATEST('service_ro_lines', 'vehicle_id', date_field='line_date', event_type='service_labor_charged', repair_order_number=paid_ro)
  - invoice_labor: SUM('service_ro_lines', 'amount', event_type='service_labor_charged', pay_type='customer_pay', repair_order_number=paid_ro)
  - review_open: paid_ro != None and invoice_labor > 0
  - invoice_parts: SUM('service_ro_lines', 'amount', event_type='service_parts_charged', pay_type='customer_pay', repair_order_number=paid_ro)
  - invoice_supplies: SUM('service_ro_lines', 'amount', event_type='service_shop_fee_charged', fee_code='shop_supplies', repair_order_number=paid_ro)
  - invoice_credits: SUM('service_ro_lines', 'amount', event_type='service_line_credited', credit_reason='comeback_repair', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_line_credited', credit_reason='estimate_overage', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_line_credited', credit_reason='goodwill', repair_order_number=paid_ro)
  - invoice_balance: SUM('service_ro_lines', 'amount', event_type='service_diagnostic_fee_charged', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_labor_charged', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_parts_charged', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_shop_fee_charged', repair_order_number=paid_ro) + SUM('service_ro_lines', 'amount', event_type='service_payment_returned', repair_order_number=paid_ro) - SUM('service_ro_lines', 'amount', event_type='service_line_credited', repair_order_number=paid_ro) - SUM('service_ro_lines', 'amount', event_type='service_payment_received', repair_order_number=paid_ro)
  - net30: F('variant_name') == 'Commercial Fleet Account - Net 30'
  - net15: F('variant_name') == 'Commercial Fleet Account - Net 15'
  - discount_window: K('ach_window_net30') if (LATEST('service_ro_lines', 'payment_method', date_field='line_date', event_type='service_payment_received', repair_order_number=paid_ro) == 'ach' and net30) else (K('ach_window_net15') if (LATEST('service_ro_lines', 'payment_method', date_field='line_date', event_type='service_payment_received', repair_order_number=paid_ro) == 'ach' and net15) else P('early_pay_discount_days'))
  - unit_fleet_deal: CFIELD('purchase', 'variant_name', vehicle_id=invoice_unit, status='closed') == 'Fleet Vehicle Purchase Agreement'
  - discount_rate: K('fleet_deal_pct_net30') if (unit_fleet_deal and net30) else (K('fleet_deal_pct_net15') if (unit_fleet_deal and net15) else P('early_pay_discount_pct'))
  - payments_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_payment_received')
  - prompt_payer_addon: K('prompt_payer_addon_net30') if (payments_12m >= K('prompt_payer_payments') and net30) else (K('prompt_payer_addon_net15') if (payments_12m >= K('prompt_payer_payments') and net15) else 0)
  - months_open: MONTHS(F('opened_date'), payment_date)
  - tenure_addon: K('tenure_addon_net30') if (months_open >= K('tenure_months') and net30) else (K('tenure_addon_net15') if (months_open >= K('tenure_months') and net15) else 0)
  - unit_plan_active: CFIELD('maintenance', 'status', vehicle_id=invoice_unit, status='active') == 'active'
  - discountable_total: invoice_labor - invoice_credits if LATEST('service_ro_lines', 'payment_method', date_field='line_date', event_type='service_payment_received', repair_order_number=paid_ro) == 'credit_card' else (invoice_labor + invoice_parts + invoice_supplies - invoice_credits if ((LATEST('service_ro_lines', 'payment_method', date_field='line_date', event_type='service_payment_received', repair_order_number=paid_ro) == 'ach' or LATEST('service_ro_lines', 'payment_method', date_field='line_date', event_type='service_payment_received', repair_order_number=paid_ro) == 'check') and unit_plan_active) else invoice_labor + invoice_parts - invoice_credits)
  - late_fees_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_late_fee_charged')
  - returned_12m: COUNT('service_ro_lines', within_months=12, date_field='line_date', event_type='service_payment_returned')
  - standing_share: K('late_fee_share') if (late_fees_12m >= 1 and returned_12m == 0) else (K('returned_payment_share') if returned_12m >= 1 else 1)
  - discount_due: invoice_balance <= 0.004 and DAYS(invoice_date, payment_date) <= discount_window and invoice_labor - invoice_credits >= K('min_discount_labor_usd')
  - result: (RND((discount_rate + prompt_payer_addon + tenure_addon) * discountable_total * standing_share + 0.000000001, 2) if discount_due else 0) if review_open else 0
  factors:
  - id: ach_window_rule
    effect: parameter
    decides: discount_window
    bindings:
    - discount_window
    ladder:
    - when: the latest payment on the invoice was made by ACH and the account is at Commercial Fleet Account - Net 30
      value: K('ach_window_net30')
    - when: the latest payment on the invoice was made by ACH and the account is at Commercial Fleet Account - Net 15
      value: K('ach_window_net15')
    - when: otherwise
      value: P('early_pay_discount_days')
    baseline:
      discount_window: P('early_pay_discount_days')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: fleet_deal_rate
    effect: parameter
    decides: discount_rate
    bindings:
    - unit_fleet_deal
    - discount_rate
    ladder:
    - when: the invoice's unit was bought under a Fleet Vehicle Purchase Agreement and the account is at Commercial Fleet Account - Net 30
      value: K('fleet_deal_pct_net30')
    - when: the invoice's unit was bought under a Fleet Vehicle Purchase Agreement and the account is at Commercial Fleet Account - Net 15
      value: K('fleet_deal_pct_net15')
    - when: otherwise
      value: P('early_pay_discount_pct')
    baseline:
      discount_rate: P('early_pay_discount_pct')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: purchase
  - id: prompt_payer_addition
    effect: parameter
    decides: prompt_payer_addon
    bindings:
    - payments_12m
    - prompt_payer_addon
    ladder:
    - when: at least prompt_payer_payments payments were received within the last twelve whole months and the account is at Commercial Fleet Account - Net 30
      value: K('prompt_payer_addon_net30')
    - when: at least prompt_payer_payments payments were received within the last twelve whole months and the account is at Commercial Fleet Account - Net 15
      value: K('prompt_payer_addon_net15')
    - when: otherwise
      value: '0'
    baseline:
      prompt_payer_addon: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: account_tenure_addition
    effect: parameter
    decides: tenure_addon
    bindings:
    - months_open
    - tenure_addon
    ladder:
    - when: the account was opened at least tenure_months whole months before the payment date and is at Commercial Fleet Account - Net 30
      value: K('tenure_addon_net30')
    - when: the account was opened at least tenure_months whole months before the payment date and is at Commercial Fleet Account - Net 15
      value: K('tenure_addon_net15')
    - when: otherwise
      value: '0'
    baseline:
      tenure_addon: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: discountable_base_rule
    effect: method
    decides: discountable_total
    bindings:
    - unit_plan_active
    - discountable_total
    ladder:
    - when: the latest payment was made by credit card
      method: the customer-pay labor charges less the credits on the invoice (parts earn no discount)
    - when: the latest payment was made by ACH or check and the unit carries an active Kessler Care maintenance plan
      method: the customer-pay labor and parts charges plus the shop supplies fee, less the credits on the invoice
    - when: otherwise
      method: the customer-pay labor and parts charges less the credits on the invoice
    baseline:
      discountable_total: invoice_labor + invoice_parts - invoice_credits
    evidence:
    - history
    - cross_category
    cross_difficulty: maintenance
  - id: payment_standing_share
    effect: parameter
    decides: standing_share
    bindings:
    - late_fees_12m
    - returned_12m
    - standing_share
    ladder:
    - when: a late fee was assessed on the account within the last twelve whole months and no payment was returned in that time
      value: K('late_fee_share')
    - when: a payment was returned on the account within the last twelve whole months
      value: K('returned_payment_share')
    - when: otherwise
      value: '1'
    baseline:
      standing_share: '1'
    evidence:
    - history
    cross_difficulty: null
  compute_basis:
    paid_ro: The invoice reviewed is the repair order of the latest payment received on the account; its invoice date is the latest line date of its labor charges, its payment date is the date of that latest payment, and its unit is the vehicle on its labor charges. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts.
    invoice_date: The invoice reviewed is the repair order of the latest payment received on the account; its invoice date is the latest line date of its labor charges, its payment date is the date of that latest payment, and its unit is the vehicle on its labor charges. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts.
    payment_date: The invoice reviewed is the repair order of the latest payment received on the account; its invoice date is the latest line date of its labor charges, its payment date is the date of that latest payment, and its unit is the vehicle on its labor charges. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts.
    invoice_unit: The invoice reviewed is the repair order of the latest payment received on the account; its invoice date is the latest line date of its labor charges, its payment date is the date of that latest payment, and its unit is the vehicle on its labor charges. Wherever a record is chosen as the latest of its kind and two such records share that date, the one listed first in the records counts.
