    part_payment_share: 'A buyer who has paid down the deal earns a part-payment share: the buyer''s own payments on the deal are every payment posted other than an applied deposit (deposit_transfer), lender funding (lender_funding) or a manufacturer incentive (manufacturer_incentive), less any payment returned unpaid; where they total at least part_paid_high_ratio of the cash_price the share is part_paid_high_share; where they total at least part_paid_mid_ratio but less than part_paid_high_ratio of the cash_price the share is part_paid_mid_share; otherwise no part-payment share applies.'
    early_pay_credits_12m: 'A buyer who pays service invoices early earns an early-payment record share: where the buyer''s service ledger shows at least early_pay_many_count early-payment discount credits in the last 12 whole months before the handling date the share is early_pay_many_share; where it shows one or more but fewer than early_pay_many_count the share is early_pay_some_share; otherwise no early-payment record share applies.'
    early_pay_share: 'A buyer who pays service invoices early earns an early-payment record share: where the buyer''s service ledger shows at least early_pay_many_count early-payment discount credits in the last 12 whole months before the handling date the share is early_pay_many_share; where it shows one or more but fewer than early_pay_many_count the share is early_pay_some_share; otherwise no early-payment record share applies.'
    deposits_applied: 'A buyer who put money down on the deal earns a down-payment share: where the deposits applied to the deal at delivery (purchase_deposit_applied entries) total at least down_high_ratio of the vehicle price charged on the deal the share is down_high_share; where they total at least down_mid_ratio but less than down_high_ratio of it the share is down_mid_share; otherwise no down-payment share applies.'
    down_price_charged: 'A buyer who put money down on the deal earns a down-payment share: where the deposits applied to the deal at delivery (purchase_deposit_applied entries) total at least down_high_ratio of the vehicle price charged on the deal the share is down_high_share; where they total at least down_mid_ratio but less than down_high_ratio of it the share is down_mid_share; otherwise no down-payment share applies.'
    down_payment_share: 'A buyer who put money down on the deal earns a down-payment share: where the deposits applied to the deal at delivery (purchase_deposit_applied entries) total at least down_high_ratio of the vehicle price charged on the deal the share is down_high_share; where they total at least down_mid_ratio but less than down_high_ratio of it the share is down_mid_share; otherwise no down-payment share applies.'
    monthly_rate: Any add-on to the monthly rate is added to it first; the resulting rate multiplies the fee basis; each share then multiplies that product in turn; the product is rounded to the cent, and the minimum fee is compared last.
    fee_before_rounding: Any add-on to the monthly rate is added to it first; the resulting rate multiplies the fee basis; each share then multiplies that product in turn; the product is rounded to the cent, and the minimum fee is compared last.
    base_scope_fee: For a Fleet Vehicle Purchase Agreement whose buyer's service account is not on credit hold this policy sets the late balance fee, and only for such a deal; a fleet deal whose buyer's service account is on credit hold, and every other deal type, keeps the base fee of late_balance_fee_pct_per_month times the balance_due standing at the moment of assessment, rounded to the cent and never less than late_balance_min_fee_usd, together with the base assessment timing, and every late balance fee, this one included, is posted under charge_code late_balance_fee with the calendar month of assessment as billing_month.
    result: The fleet late balance fee is rounded to the cent, half up, and is never less than the deal type's late_balance_min_fee_usd; while the balance_due is 0.00 or less no late balance fee is assessed and the minimum does not apply. Any add-on to the monthly rate is added to it first; the resulting rate multiplies the fee basis; each share then multiplies that product in turn; the product is rounded to the cent, and the minimum fee is compared last.
  factors:
  - id: payment_standing_rate
    effect: parameter
    decides: standing_rate
    bindings:
    - standing_account
    - fleet_account_held
    - service_returns_24m
    - standing_rate
    ladder:
    - when: Net 15 or Net 30 commercial account in active status and no returned service payment in the last 24 whole months
      value: K('standing_good_rate')
    - when: such an account in active status and one or more returned service payments in the last 24 whole months
      value: K('standing_returned_rate')
    - when: otherwise
      value: P('late_balance_fee_pct_per_month')
    baseline:
      standing_rate: P('late_balance_fee_pct_per_month')
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: open_credit_use
    effect: parameter
    decides: credit_use_addon
    bindings:
    - service_open_balance
    - service_credit_limit
    - credit_use_ratio
    - credit_use_addon
    ladder:
    - when: open_balance more than credit_use_high_ratio of credit_limit
      value: K('credit_use_high_addon')
    - when: open_balance at least credit_use_mid_ratio and not more than credit_use_high_ratio of credit_limit
      value: K('credit_use_mid_addon')
    - when: otherwise (lower use or no credit limit)
      value: '0'
    baseline:
      credit_use_addon: '0'
    evidence:
    - cross_category
    cross_difficulty: service
  - id: late_fee_history_basis
    effect: method
    decides: fee_basis
    bindings:
    - earlier_late_fee_count
    - earlier_late_fee_total
    - latest_late_fee_date
    - latest_ach_paid
    - latest_check_paid
    - latest_cashiers_paid
    - paid_since_latest_fee
    - days_after_assessment_day
    - fee_basis
    ladder:
    - when: no earlier late balance fee on the deal
      method: balance_due prorated by the calendar days after the assessment day over prorate_month_days, never more than the whole balance
    - when: an earlier late balance fee and a buyer check, cashier's check or ACH payment dated later than the latest one
      method: balance_due less the earlier late balance fees posted on the deal, net of their reversals
    - when: otherwise
      method: the whole balance_due
    baseline:
      fee_basis: deal_balance
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: paid_down_share
    effect: parameter
    decides: part_payment_share
    bindings:
    - buyer_payments
    - part_payment_share
    ladder:
    - when: buyer's own payments at least part_paid_high_ratio of cash_price
      value: K('part_paid_high_share')
    - when: at least part_paid_mid_ratio and less than part_paid_high_ratio of cash_price
      value: K('part_paid_mid_share')
    - when: otherwise
      value: '1'
    baseline:
      part_payment_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: service_early_payer
    effect: parameter
    decides: early_pay_share
    bindings:
    - early_pay_credits_12m
    - early_pay_share
    ladder:
    - when: at least early_pay_many_count early-payment discount credits in the last 12 whole months
      value: K('early_pay_many_share')
    - when: one or more but fewer than early_pay_many_count
      value: K('early_pay_some_share')
    - when: otherwise
      value: '1'
    baseline:
      early_pay_share: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: down_payment_record
    effect: parameter
    decides: down_payment_share
    bindings:
    - deposits_applied
    - down_price_charged
    - down_payment_share
    ladder:
    - when: deposits applied at delivery at least down_high_ratio of the vehicle price charged
      value: K('down_high_share')
    - when: at least down_mid_ratio and less than down_high_ratio of the vehicle price charged
      value: K('down_mid_share')
    - when: otherwise
      value: '1'
    baseline:
      down_payment_share: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The fleet late balance fee for a billing month is the deal type's late_balance_fee_pct_per_month times the fee basis. The fee basis is the balance_due standing on the deal at assessment. The fleet late balance fee is rounded to the cent, half up, and is never less than the deal type's late_balance_min_fee_usd; while the balance_due is 0.00 or less no late balance fee is assessed and the minimum does not apply.
    params:
    - late_balance_fee_pct_per_month
    - late_balance_min_fee_usd
  inputs:
    history:
    - table: purchase_transactions
      aggregate: sum
      field: amount
      within_months: null
      filters:
        event_type: purchase_payment_posted
    - category: service
      table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 24
      filters:
        event_type: service_payment_returned
    - category: service
      table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 12
      filters:
        event_type: service_line_credited
        credit_reason: early_payment_discount
    cross_category:
    - service
- id: purchase_ext_fleet_order_deposit
  base_policy_refs:
  - purchase_evt_deposit
  overwrite: []
  trigger: on_request
  subject:
  - purchase_deposit_received
  computes: deposit_amount
  target_tool: pay_fleet_order_deposit_c9caca35
  params:
    standard_order_deposit_rate: 0.1
    established_order_deposit_rate: 0.05
    newer_account_order_deposit_rate: 0.075
    standing_long_months: 60
    late_history_high_addon: 0.05
    late_history_one_addon: 0.025
    held_long_days: 7
    held_long_addon: 0.035
    held_short_addon: 0.02
    check_funds_high_addon: 0.02
    check_funds_one_addon: 0.01
  rule: 'For a reserved Fleet Vehicle Purchase Agreement this policy sets the order deposit the buyer adds to the reservation deposit, and only for such a deal; every deposit, this one included, keeps the deal''s deposits within the deal type''s deposit_max_usd in total, is paid only by a method in its deposit_methods_allowed, and is taken only while the deal is in reserved or contracted status. A fleet order deposit is not taken on a reserved unit until every delivered Fleet Vehicle Purchase Agreement of the buyer that is past its late balance assessment day with a balance still due above 0.00 carries a late balance fee for the current billing month. The fleet order deposit to collect is the order deposit required on the unit less the deposit_held_balance already held on the deal. The order deposit required is the order deposit rate times the unit''s cash_price, the order deposit rate being standard_order_deposit_rate. The fleet order deposit to collect is rounded to the cent, half up, and where the deposit_held_balance already covers the order deposit required no order deposit is collected. Every add-on to the order deposit rate is added to it first; the resulting rate then gives the order deposit required; the deposit_held_balance is subtracted last, and the result is rounded to the cent. The buyer''s active service account is the buyer''s service account in active status, identified by its tier (variant_name). The order deposit rate follows the buyer''s commercial standing: a buyer holding a Commercial Fleet Account - Net 30 in active status opened at least standing_long_months whole months before the handling date pays established_order_deposit_rate; a buyer holding a Commercial Fleet Account - Net 15 in active status, or a Commercial Fleet Account - Net 30 in active status opened fewer than standing_long_months whole months before the handling date, pays newer_account_order_deposit_rate; every other buyer pays standard_order_deposit_rate. A buyer whose service ledger shows late fees adds a late-history rate to the order deposit rate: two or more service late fees charged in the last 24 whole months before the handling date add late_history_high_addon; exactly one adds late_history_one_addon; none adds nothing. A service late fee falls in the last 24 whole months when fewer than 24 whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached). A unit held beyond the deal type''s standard hold adds a held-unit rate to the order deposit rate, by the calendar days from the reserved_date to the hold_expires_date beyond the deal type''s vehicle_hold_days: more than held_long_days such days add held_long_addon; from one to held_long_days such days add held_short_addon; a unit on its standard hold adds nothing. Deposits paid by check add a check-funds rate to the order deposit rate: two or more deposits on the deal received with payment_method check add check_funds_high_addon; exactly one adds check_funds_one_addon; none adds nothing. What the rate is applied to depends on the buyer''s service account: for a buyer whose service account is on credit hold, the order deposit required is the rate times the cash_price plus the whole open_balance of that account; for a buyer whose service account is a Commercial Fleet Account - Net 15 or Commercial Fleet Account - Net 30 in active status carrying an open_balance above 0.00, the order deposit required is the rate times the sum of the cash_price and that open_balance; for every other buyer it is the rate times the cash_price.'
  prerequisite:
  - problem: purchase_ext_fleet_late_balance_fee
    kind: state_gate
    gate: purchase_transactions.billing_month
    form: state
    policy_source: A fleet order deposit is not taken on a reserved unit until every delivered Fleet Vehicle Purchase Agreement of the buyer that is past its late balance assessment day with a balance still due above 0.00 carries a late balance fee for the current billing month.
    condition: every delivered Fleet Vehicle Purchase Agreement of the buyer whose handling date is later than its delivery date plus late_balance_assess_after_days calendar days and whose balance_due is above 0.00 has a purchase_charge_posted row with charge_code late_balance_fee and billing_month equal to the handling month.
    resolved_by: post_fleet_late_fee_7ed43dd7
    effect: the order-deposit gate on the reserved unit holds once each such delivered fleet deal carries its late balance fee for the current billing month; the deposit amount itself is unchanged.
  cross_category:
  - category: service
    as: branch
    reads:
    - variant_name
    - status
    - opened_date
    - open_balance
    - service_ro_lines.event_type
    - service_ro_lines.line_date
    note: the standing rate reads the commercial account tier, status and opening date; the late-history rate reads service late fees of the last 24 whole months; the exposure rule reads the account status and open balance.
  compute:
  - held_deposit: F('deposit_held_balance')
  - unit_price: F('cash_price')
  - order_account: CFIELD('service', 'variant_name', status='active')
  - order_account_opened: CFIELD('service', 'opened_date', status='active')
  - account_age_months: MONTHS(order_account_opened, NOW) if order_account_opened != None else 0
  - order_deposit_rate: K('established_order_deposit_rate') if (order_account == 'Commercial Fleet Account - Net 30' and account_age_months >= K('standing_long_months')) else (K('newer_account_order_deposit_rate') if (order_account == 'Commercial Fleet Account - Net 15' or (order_account == 'Commercial Fleet Account - Net 30' and account_age_months < K('standing_long_months'))) else K('standard_order_deposit_rate'))
  - service_late_fees_24m: XCOUNT('service', 'service_ro_lines', within_months=24, date_field='line_date', event_type='service_late_fee_charged')
  - late_history_addon: K('late_history_high_addon') if service_late_fees_24m >= 2 else (K('late_history_one_addon') if service_late_fees_24m == 1 else 0)
  - days_beyond_standard_hold: DAYS(F('reserved_date'), F('hold_expires_date')) - P('vehicle_hold_days')
  - held_unit_addon: K('held_long_addon') if days_beyond_standard_hold > K('held_long_days') else (K('held_short_addon') if days_beyond_standard_hold >= 1 else 0)
  - check_deposits: COUNT('purchase_transactions', event_type='purchase_deposit_received', payment_method='check')
  - check_funds_addon: K('check_funds_high_addon') if check_deposits >= 2 else (K('check_funds_one_addon') if check_deposits == 1 else 0)
  - deposit_rate_total: order_deposit_rate + late_history_addon + held_unit_addon + check_funds_addon
  - hold_account_balance: CFIELD('service', 'open_balance', status='credit_hold')
  - exposure_balance: CFIELD('service', 'open_balance', status='active')
  - order_deposit_required: deposit_rate_total * unit_price + hold_account_balance if hold_account_balance != None else (deposit_rate_total * (unit_price + exposure_balance) if ((order_account == 'Commercial Fleet Account - Net 15' or order_account == 'Commercial Fleet Account - Net 30') and exposure_balance > 0) else deposit_rate_total * unit_price)
  - result: RND(MX(0, order_deposit_required - held_deposit) + 0.000000001, 2)
  compute_basis:
    held_deposit: The fleet order deposit to collect is the order deposit required on the unit less the deposit_held_balance already held on the deal.
    unit_price: The order deposit required is the order deposit rate times the unit's cash_price, the order deposit rate being standard_order_deposit_rate.
    order_account: The buyer's active service account is the buyer's service account in active status, identified by its tier (variant_name).
    order_account_opened: 'The order deposit rate follows the buyer''s commercial standing: a buyer holding a Commercial Fleet Account - Net 30 in active status opened at least standing_long_months whole months before the handling date pays established_order_deposit_rate; a buyer holding a Commercial Fleet Account - Net 15 in active status, or a Commercial Fleet Account - Net 30 in active status opened fewer than standing_long_months whole months before the handling date, pays newer_account_order_deposit_rate; every other buyer pays standard_order_deposit_rate.'
    account_age_months: 'The order deposit rate follows the buyer''s commercial standing: a buyer holding a Commercial Fleet Account - Net 30 in active status opened at least standing_long_months whole months before the handling date pays established_order_deposit_rate; a buyer holding a Commercial Fleet Account - Net 15 in active status, or a Commercial Fleet Account - Net 30 in active status opened fewer than standing_long_months whole months before the handling date, pays newer_account_order_deposit_rate; every other buyer pays standard_order_deposit_rate.'
    order_deposit_rate: 'The order deposit rate follows the buyer''s commercial standing: a buyer holding a Commercial Fleet Account - Net 30 in active status opened at least standing_long_months whole months before the handling date pays established_order_deposit_rate; a buyer holding a Commercial Fleet Account - Net 15 in active status, or a Commercial Fleet Account - Net 30 in active status opened fewer than standing_long_months whole months before the handling date, pays newer_account_order_deposit_rate; every other buyer pays standard_order_deposit_rate.'
    service_late_fees_24m: 'A buyer whose service ledger shows late fees adds a late-history rate to the order deposit rate: two or more service late fees charged in the last 24 whole months before the handling date add late_history_high_addon; exactly one adds late_history_one_addon; none adds nothing. A service late fee falls in the last 24 whole months when fewer than 24 whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached).'
    late_history_addon: 'A buyer whose service ledger shows late fees adds a late-history rate to the order deposit rate: two or more service late fees charged in the last 24 whole months before the handling date add late_history_high_addon; exactly one adds late_history_one_addon; none adds nothing.'
    days_beyond_standard_hold: 'A unit held beyond the deal type''s standard hold adds a held-unit rate to the order deposit rate, by the calendar days from the reserved_date to the hold_expires_date beyond the deal type''s vehicle_hold_days: more than held_long_days such days add held_long_addon; from one to held_long_days such days add held_short_addon; a unit on its standard hold adds nothing.'
    held_unit_addon: 'A unit held beyond the deal type''s standard hold adds a held-unit rate to the order deposit rate, by the calendar days from the reserved_date to the hold_expires_date beyond the deal type''s vehicle_hold_days: more than held_long_days such days add held_long_addon; from one to held_long_days such days add held_short_addon; a unit on its standard hold adds nothing.'
    check_deposits: 'Deposits paid by check add a check-funds rate to the order deposit rate: two or more deposits on the deal received with payment_method check add check_funds_high_addon; exactly one adds check_funds_one_addon; none adds nothing.'
    check_funds_addon: 'Deposits paid by check add a check-funds rate to the order deposit rate: two or more deposits on the deal received with payment_method check add check_funds_high_addon; exactly one adds check_funds_one_addon; none adds nothing.'
    deposit_rate_total: Every add-on to the order deposit rate is added to it first; the resulting rate then gives the order deposit required; the deposit_held_balance is subtracted last, and the result is rounded to the cent.
    hold_account_balance: 'What the rate is applied to depends on the buyer''s service account: for a buyer whose service account is on credit hold, the order deposit required is the rate times the cash_price plus the whole open_balance of that account; for a buyer whose service account is a Commercial Fleet Account - Net 15 or Commercial Fleet Account - Net 30 in active status carrying an open_balance above 0.00, the order deposit required is the rate times the sum of the cash_price and that open_balance; for every other buyer it is the rate times the cash_price.'
    exposure_balance: 'What the rate is applied to depends on the buyer''s service account: for a buyer whose service account is on credit hold, the order deposit required is the rate times the cash_price plus the whole open_balance of that account; for a buyer whose service account is a Commercial Fleet Account - Net 15 or Commercial Fleet Account - Net 30 in active status carrying an open_balance above 0.00, the order deposit required is the rate times the sum of the cash_price and that open_balance; for every other buyer it is the rate times the cash_price.'
    order_deposit_required: 'What the rate is applied to depends on the buyer''s service account: for a buyer whose service account is on credit hold, the order deposit required is the rate times the cash_price plus the whole open_balance of that account; for a buyer whose service account is a Commercial Fleet Account - Net 15 or Commercial Fleet Account - Net 30 in active status carrying an open_balance above 0.00, the order deposit required is the rate times the sum of the cash_price and that open_balance; for every other buyer it is the rate times the cash_price.'
    result: The fleet order deposit to collect is the order deposit required on the unit less the deposit_held_balance already held on the deal. The order deposit required is the order deposit rate times the unit's cash_price, the order deposit rate being standard_order_deposit_rate. The fleet order deposit to collect is rounded to the cent, half up, and where the deposit_held_balance already covers the order deposit required no order deposit is collected.
  factors:
  - id: commercial_standing_rate
    effect: parameter
    decides: order_deposit_rate
    bindings:
    - order_account_opened
    - account_age_months
    - order_deposit_rate
    ladder:
    - when: Commercial Fleet Account - Net 30 in active status opened at least standing_long_months whole months ago
      value: K('established_order_deposit_rate')
    - when: Commercial Fleet Account - Net 15 in active status, or Net 30 in active status opened fewer than standing_long_months whole months ago
      value: K('newer_account_order_deposit_rate')
    - when: otherwise
      value: K('standard_order_deposit_rate')
    baseline:
      order_deposit_rate: K('standard_order_deposit_rate')
    evidence:
    - cross_category
    - date
    cross_difficulty: service
  - id: service_late_history
    effect: parameter
    decides: late_history_addon
    bindings:
    - service_late_fees_24m
    - late_history_addon
    ladder:
    - when: two or more service late fees in the last 24 whole months
      value: K('late_history_high_addon')
    - when: exactly one
      value: K('late_history_one_addon')
    - when: otherwise (none)
      value: '0'
    baseline:
      late_history_addon: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: extended_hold_rate
    effect: parameter
    decides: held_unit_addon
    bindings:
    - days_beyond_standard_hold
    - held_unit_addon
    ladder:
    - when: more than held_long_days days beyond the standard hold
      value: K('held_long_addon')
    - when: one to held_long_days days beyond the standard hold
      value: K('held_short_addon')
    - when: otherwise (standard hold)
      value: '0'
    baseline:
      held_unit_addon: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: check_funds_rate
    effect: parameter
    decides: check_funds_addon
    bindings:
    - check_deposits
    - check_funds_addon
    ladder:
    - when: two or more deposits on the deal with payment_method check
      value: K('check_funds_high_addon')
    - when: exactly one
      value: K('check_funds_one_addon')
    - when: otherwise (none)
      value: '0'
    baseline:
      check_funds_addon: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: account_exposure_base
    effect: method
    decides: order_deposit_required
    bindings:
    - hold_account_balance
    - exposure_balance
    - order_deposit_required
    ladder:
    - when: the buyer's service account is on credit hold
      method: the rate times the cash_price, plus the account's whole open_balance
    - when: a Net 15 or Net 30 commercial account in active status with an open_balance above 0.00
      method: the rate times the sum of the cash_price and the open_balance
    - when: otherwise
      method: the rate times the cash_price
    baseline:
      order_deposit_required: deposit_rate_total * unit_price
    evidence:
    - cross_category
    cross_difficulty: service
  baseline:
    rule: The fleet order deposit to collect is the order deposit required on the unit less the deposit_held_balance already held on the deal. The order deposit required is the order deposit rate times the unit's cash_price, the order deposit rate being standard_order_deposit_rate. The fleet order deposit to collect is rounded to the cent, half up, and where the deposit_held_balance already covers the order deposit required no order deposit is collected.
    params:
    - standard_order_deposit_rate
  inputs:
    history:
    - table: purchase_transactions
      aggregate: count
      field: purchase_txn_id
      within_months: null
      filters:
        event_type: purchase_deposit_received
        payment_method: check
    - category: service
      table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 24
      filters:
        event_type: service_late_fee_charged
    cross_category:
    - service
- id: purchase_ext_extension_deposit
  base_policy_refs:
  - purchase_evt_deposit
  - purchase_evt_hold_extension
  overwrite:
  - base_policy: purchase_evt_hold_extension
    superseded_clause: Extensions carry no fee and leave the deposit unchanged.
    replaced_by: For a reserved deal of any deal type other than Fleet Vehicle Purchase Agreement whose hold extension is asked for on a day after its reserved_date a hold extension carries no fee, and the buyer adds the extension deposit this policy sets, which is held against the deal like any other deposit, and only for such a deal; for a Fleet Vehicle Purchase Agreement, and for a hold extension asked for on the deal's reserved_date, a hold extension carries no fee and leaves the deposit unchanged.
  trigger: on_request
  subject:
  - purchase_deposit_received
  computes: deposit_amount
  target_tool: pay_extension_deposit_9124466d
  params:
    standard_extension_deposit_rate: 0.05
    platinum_extension_rate: 0.03
    gold_extension_rate: 0.04
    returned_high_addon: 0.02
    returned_one_addon: 0.01
    hold_late_days: 2
    hold_mid_days: 4
    hold_late_addon: 0.01
    hold_mid_addon: 0.005
    spend_high_usd: 1000.0
    spend_mid_usd: 500.0
    spend_high_share: 0.9
    spend_mid_share: 0.95
    resv_high_ratio: 0.05
    resv_mid_ratio: 0.02
    resv_high_share: 0.85
    resv_mid_share: 0.95
    check_clearing_days: 10
    min_extension_deposit_usd: 250.0
    max_credit_share: 0.6
  rule: 'For a reserved deal of any deal type other than Fleet Vehicle Purchase Agreement whose hold extension is asked for on a day after its reserved_date this policy sets the extension deposit a buyer adds to hold the vehicle longer, and only for such a deal; every deposit, this one included, keeps the deal''s deposits within the deal type''s deposit_max_usd in total, is paid only by a method in its deposit_methods_allowed, keeps credit card deposits within deposit_card_max_usd, and is taken only while the deal is in reserved or contracted status. For a reserved deal of any deal type other than Fleet Vehicle Purchase Agreement whose hold extension is asked for on a day after its reserved_date a hold extension carries no fee, and the buyer adds the extension deposit this policy sets, which is held against the deal like any other deposit, and only for such a deal; for a Fleet Vehicle Purchase Agreement, and for a hold extension asked for on the deal''s reserved_date, a hold extension carries no fee and leaves the deposit unchanged. On such a deal, a deposit the buyer adds on a day after the reserved_date is the extension deposit, taken at the amount this policy sets. The extension deposit to collect is the extension deposit required less the deposits credited toward it. The extension deposit required is the extension deposit rate times the deal''s cash_price, the extension deposit rate being standard_extension_deposit_rate. Every deposit received on the deal and still held (deposit_held_balance) is credited toward the extension deposit required, but the deposits credited never exceed max_credit_share of the extension deposit required, so part of every extension deposit is new money. The extension deposit to collect is rounded to the cent, half up, and is never less than min_extension_deposit_usd. Every add-on to the extension deposit rate is added to it first; the resulting rate gives the extension deposit required on the cash_price; each share then multiplies the extension deposit required in turn; the deposits credited are subtracted next, the minimum is compared after that, and rounding to the cent comes last. The extension deposit rate follows the buyer''s Owner Rewards standing: a buyer whose service account is Kessler Owner Rewards Platinum in active status pays platinum_extension_rate; a buyer whose service account is Kessler Owner Rewards Gold in active status pays gold_extension_rate; every other buyer pays standard_extension_deposit_rate. Returned payments on the buyer''s service account add a returned-payment rate to the extension deposit rate: two or more check or ACH payments returned unpaid in the last 24 whole months before the handling date add returned_high_addon; exactly one adds returned_one_addon; none adds nothing. A service ledger entry falls in the last 12 or 24 whole months when fewer than that many whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached). The time left on the hold when the extension deposit is taken adds a hold-timing rate to the extension deposit rate: with hold_late_days calendar days or fewer from the handling date to the hold_expires_date the add-on is hold_late_addon; with more than hold_late_days but not more than hold_mid_days calendar days it is hold_mid_addon; with more than hold_mid_days calendar days left there is no hold-timing add-on. The buyer''s customer-pay service spend sets a service-spend share: where the customer-pay labor and parts charged on the buyer''s service account in the last 12 whole months before the handling date total at least spend_high_usd the share is spend_high_share; where they total at least spend_mid_usd but less than spend_high_usd the share is spend_mid_share; otherwise no service-spend share applies. The deposits received on the deal set a deposit-received share: where the deposits received on the deal total at least resv_high_ratio of the cash_price the share is resv_high_share; where they total at least resv_mid_ratio but less than resv_high_ratio of the cash_price the share is resv_mid_share; otherwise no deposit-received share applies. Which deposits are credited toward the extension deposit required depends on how they were paid: where any deposit on the deal was paid by credit card, the credit card deposits still held (received less refunded) are not credited and only the rest of the deposit_held_balance is, never less than 0.00; where no credit card deposit is still held but a deposit with payment_method check was received check_clearing_days calendar days or fewer before the handling date, no deposit is credited until that check clears; otherwise the whole deposit_held_balance is credited.'
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads:
    - variant_name
    - status
    - service_ro_lines.event_type
    - service_ro_lines.payment_method
    - service_ro_lines.amount
    - service_ro_lines.line_date
    note: the tier rate reads the rewards tier and status; the returned-payment rate counts returned check/ACH service payments in 24 whole months; the service-spend share sums customer-pay labor and parts in 12 whole months.
  compute:
  - cash_price_reserved: F('cash_price')
  - held_deposits: F('deposit_held_balance')
  - rewards_account: CFIELD('service', 'variant_name', status='active')
  - tier_rate: K('platinum_extension_rate') if rewards_account == 'Kessler Owner Rewards Platinum' else (K('gold_extension_rate') if rewards_account == 'Kessler Owner Rewards Gold' else K('standard_extension_deposit_rate'))
  - returned_bank_payments: XCOUNT('service', 'service_ro_lines', within_months=24, date_field='line_date', event_type='service_payment_returned', payment_method='check') + XCOUNT('service', 'service_ro_lines', within_months=24, date_field='line_date', event_type='service_payment_returned', payment_method='ach')
  - returned_addon: K('returned_high_addon') if returned_bank_payments >= 2 else (K('returned_one_addon') if returned_bank_payments == 1 else 0)
  - days_left_on_hold: DAYS(NOW, F('hold_expires_date'))
  - hold_timing_addon: K('hold_late_addon') if days_left_on_hold <= K('hold_late_days') else (K('hold_mid_addon') if days_left_on_hold <= K('hold_mid_days') else 0)
  - extension_rate: tier_rate + returned_addon + hold_timing_addon
  - extension_required: extension_rate * cash_price_reserved
  - service_spend_12m: XSUM('service', 'service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay') + XSUM('service', 'service_ro_lines', 'amount', within_months=12, date_field='line_date', event_type='service_parts_charged', pay_type='customer_pay')
  - spend_share: K('spend_high_share') if service_spend_12m >= K('spend_high_usd') else (K('spend_mid_share') if service_spend_12m >= K('spend_mid_usd') else 1)
  - deposits_received: SUM('purchase_transactions', 'amount', event_type='purchase_deposit_received')
  - deposit_received_share: K('resv_high_share') if deposits_received >= K('resv_high_ratio') * cash_price_reserved else (K('resv_mid_share') if deposits_received >= K('resv_mid_ratio') * cash_price_reserved else 1)
  - card_deposits: SUM('purchase_transactions', 'amount', event_type='purchase_deposit_received', payment_method='credit_card') - SUM('purchase_transactions', 'amount', event_type='purchase_deposit_refunded', payment_method='credit_card')
  - latest_check_deposit: LATEST('purchase_transactions', 'txn_date', date_field='txn_date', event_type='purchase_deposit_received', payment_method='check')
  - credited_deposits: MX(0, held_deposits - card_deposits) if card_deposits > 0 else (0 if (latest_check_deposit != None and DAYS(latest_check_deposit, NOW) <= K('check_clearing_days')) else held_deposits)
  - credit_applied: MN(credited_deposits, K('max_credit_share') * extension_required)
  - requested_on_reserved_date: F('reserved_date') == NOW
  - result: 0 if requested_on_reserved_date else RND(MX(K('min_extension_deposit_usd'), extension_required * spend_share * deposit_received_share - credit_applied) + 0.000000001, 2)
  compute_basis:
    cash_price_reserved: The extension deposit required is the extension deposit rate times the deal's cash_price, the extension deposit rate being standard_extension_deposit_rate.
    held_deposits: Every deposit received on the deal and still held (deposit_held_balance) is credited toward the extension deposit required, but the deposits credited never exceed max_credit_share of the extension deposit required, so part of every extension deposit is new money.
    rewards_account: 'The extension deposit rate follows the buyer''s Owner Rewards standing: a buyer whose service account is Kessler Owner Rewards Platinum in active status pays platinum_extension_rate; a buyer whose service account is Kessler Owner Rewards Gold in active status pays gold_extension_rate; every other buyer pays standard_extension_deposit_rate.'
    tier_rate: 'The extension deposit rate follows the buyer''s Owner Rewards standing: a buyer whose service account is Kessler Owner Rewards Platinum in active status pays platinum_extension_rate; a buyer whose service account is Kessler Owner Rewards Gold in active status pays gold_extension_rate; every other buyer pays standard_extension_deposit_rate.'
    returned_bank_payments: 'Returned payments on the buyer''s service account add a returned-payment rate to the extension deposit rate: two or more check or ACH payments returned unpaid in the last 24 whole months before the handling date add returned_high_addon; exactly one adds returned_one_addon; none adds nothing. A service ledger entry falls in the last 12 or 24 whole months when fewer than that many whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached).'
    returned_addon: 'Returned payments on the buyer''s service account add a returned-payment rate to the extension deposit rate: two or more check or ACH payments returned unpaid in the last 24 whole months before the handling date add returned_high_addon; exactly one adds returned_one_addon; none adds nothing.'
    days_left_on_hold: 'The time left on the hold when the extension deposit is taken adds a hold-timing rate to the extension deposit rate: with hold_late_days calendar days or fewer from the handling date to the hold_expires_date the add-on is hold_late_addon; with more than hold_late_days but not more than hold_mid_days calendar days it is hold_mid_addon; with more than hold_mid_days calendar days left there is no hold-timing add-on.'
    hold_timing_addon: 'The time left on the hold when the extension deposit is taken adds a hold-timing rate to the extension deposit rate: with hold_late_days calendar days or fewer from the handling date to the hold_expires_date the add-on is hold_late_addon; with more than hold_late_days but not more than hold_mid_days calendar days it is hold_mid_addon; with more than hold_mid_days calendar days left there is no hold-timing add-on.'
    extension_rate: Every add-on to the extension deposit rate is added to it first; the resulting rate gives the extension deposit required on the cash_price; each share then multiplies the extension deposit required in turn; the deposits credited are subtracted next, the minimum is compared after that, and rounding to the cent comes last.
    extension_required: The extension deposit required is the extension deposit rate times the deal's cash_price, the extension deposit rate being standard_extension_deposit_rate.
    service_spend_12m: 'The buyer''s customer-pay service spend sets a service-spend share: where the customer-pay labor and parts charged on the buyer''s service account in the last 12 whole months before the handling date total at least spend_high_usd the share is spend_high_share; where they total at least spend_mid_usd but less than spend_high_usd the share is spend_mid_share; otherwise no service-spend share applies.'
    spend_share: 'The buyer''s customer-pay service spend sets a service-spend share: where the customer-pay labor and parts charged on the buyer''s service account in the last 12 whole months before the handling date total at least spend_high_usd the share is spend_high_share; where they total at least spend_mid_usd but less than spend_high_usd the share is spend_mid_share; otherwise no service-spend share applies.'
    deposits_received: 'The deposits received on the deal set a deposit-received share: where the deposits received on the deal total at least resv_high_ratio of the cash_price the share is resv_high_share; where they total at least resv_mid_ratio but less than resv_high_ratio of the cash_price the share is resv_mid_share; otherwise no deposit-received share applies.'
    deposit_received_share: 'The deposits received on the deal set a deposit-received share: where the deposits received on the deal total at least resv_high_ratio of the cash_price the share is resv_high_share; where they total at least resv_mid_ratio but less than resv_high_ratio of the cash_price the share is resv_mid_share; otherwise no deposit-received share applies.'
    card_deposits: 'Which deposits are credited toward the extension deposit required depends on how they were paid: where any deposit on the deal was paid by credit card, the credit card deposits still held (received less refunded) are not credited and only the rest of the deposit_held_balance is, never less than 0.00; where no credit card deposit is still held but a deposit with payment_method check was received check_clearing_days calendar days or fewer before the handling date, no deposit is credited until that check clears; otherwise the whole deposit_held_balance is credited.'
    latest_check_deposit: 'Which deposits are credited toward the extension deposit required depends on how they were paid: where any deposit on the deal was paid by credit card, the credit card deposits still held (received less refunded) are not credited and only the rest of the deposit_held_balance is, never less than 0.00; where no credit card deposit is still held but a deposit with payment_method check was received check_clearing_days calendar days or fewer before the handling date, no deposit is credited until that check clears; otherwise the whole deposit_held_balance is credited.'
    credited_deposits: 'Which deposits are credited toward the extension deposit required depends on how they were paid: where any deposit on the deal was paid by credit card, the credit card deposits still held (received less refunded) are not credited and only the rest of the deposit_held_balance is, never less than 0.00; where no credit card deposit is still held but a deposit with payment_method check was received check_clearing_days calendar days or fewer before the handling date, no deposit is credited until that check clears; otherwise the whole deposit_held_balance is credited.'
    result: The extension deposit to collect is rounded to the cent, half up, and is never less than min_extension_deposit_usd. Every add-on to the extension deposit rate is added to it first; the resulting rate gives the extension deposit required on the cash_price; each share then multiplies the extension deposit required in turn; the deposits credited are subtracted next, the minimum is compared after that, and rounding to the cent comes last.
    requested_on_reserved_date: For a reserved deal of any deal type other than Fleet Vehicle Purchase Agreement whose hold extension is asked for on a day after its reserved_date a hold extension carries no fee, and the buyer adds the extension deposit this policy sets, which is held against the deal like any other deposit, and only for such a deal; for a Fleet Vehicle Purchase Agreement, and for a hold extension asked for on the deal's reserved_date, a hold extension carries no fee and leaves the deposit unchanged.
    credit_applied: Every deposit received on the deal and still held (deposit_held_balance) is credited toward the extension deposit required, but the deposits credited never exceed max_credit_share of the extension deposit required, so part of every extension deposit is new money.
  factors:
  - id: rewards_tier_rate
    effect: parameter
    decides: tier_rate
    bindings:
    - rewards_account
    - tier_rate
    ladder:
    - when: Kessler Owner Rewards Platinum in active status
      value: K('platinum_extension_rate')
    - when: Kessler Owner Rewards Gold in active status
      value: K('gold_extension_rate')
    - when: otherwise
      value: K('standard_extension_deposit_rate')
    baseline:
      tier_rate: K('standard_extension_deposit_rate')
    evidence:
    - cross_category
    cross_difficulty: service
  - id: returned_bank_payment_rate
    effect: parameter
    decides: returned_addon
    bindings:
    - returned_bank_payments
    - returned_addon
    ladder:
    - when: two or more check or ACH service payments returned in the last 24 whole months
      value: K('returned_high_addon')
    - when: exactly one
      value: K('returned_one_addon')
    - when: otherwise (none)
      value: '0'
    baseline:
      returned_addon: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: hold_time_left_rate
    effect: parameter
    decides: hold_timing_addon
    bindings:
    - days_left_on_hold
    - hold_timing_addon
    ladder:
    - when: hold_late_days calendar days or fewer left on the hold
      value: K('hold_late_addon')
    - when: more than hold_late_days and not more than hold_mid_days days left
      value: K('hold_mid_addon')
    - when: otherwise (more than hold_mid_days days left)
      value: '0'
    baseline:
      hold_timing_addon: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: service_spend_record
    effect: parameter
    decides: spend_share
    bindings:
    - service_spend_12m
    - spend_share
    ladder:
    - when: customer-pay labor and parts in the last 12 whole months at least spend_high_usd
      value: K('spend_high_share')
    - when: at least spend_mid_usd and less than spend_high_usd
      value: K('spend_mid_share')
    - when: otherwise
      value: '1'
    baseline:
      spend_share: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: deposit_received_record
    effect: parameter
    decides: deposit_received_share
    bindings:
    - deposits_received
    - deposit_received_share
    ladder:
    - when: deposits received at least resv_high_ratio of cash_price
      value: K('resv_high_share')
    - when: at least resv_mid_ratio and less than resv_high_ratio of cash_price
      value: K('resv_mid_share')
    - when: otherwise
      value: '1'
    baseline:
      deposit_received_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: deposit_funds_credit
    effect: method
    decides: credited_deposits
    bindings:
    - card_deposits
    - latest_check_deposit
    - credited_deposits
    ladder:
    - when: a credit card deposit still held on the deal
      method: deposit_held_balance less the credit card deposits still held, never below 0.00
    - when: no credit card deposit still held and a check deposit received check_clearing_days days or fewer ago
      method: nothing credited until the check clears
    - when: otherwise
      method: the whole deposit_held_balance
    baseline:
      credited_deposits: held_deposits
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The extension deposit to collect is the extension deposit required less the deposits credited toward it. The extension deposit required is the extension deposit rate times the deal's cash_price, the extension deposit rate being standard_extension_deposit_rate. Every deposit received on the deal and still held (deposit_held_balance) is credited toward the extension deposit required, but the deposits credited never exceed max_credit_share of the extension deposit required, so part of every extension deposit is new money. The extension deposit to collect is rounded to the cent, half up, and is never less than min_extension_deposit_usd.
    params:
    - standard_extension_deposit_rate
    - min_extension_deposit_usd
    - max_credit_share
  inputs:
    history:
    - table: purchase_transactions
      aggregate: sum
      field: amount
      within_months: null
      filters:
        event_type: purchase_deposit_received
    - category: service
      table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 24
      filters:
        event_type: service_payment_returned
    - category: service
      table: service_ro_lines
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        pay_type: customer_pay
    cross_category:
    - service
- id: purchase_ext_hold_extension_days
  base_policy_refs:
  - purchase_evt_hold_extension
  overwrite:
  - base_policy: purchase_evt_hold_extension
    superseded_clause: Each extension moves hold_expires_date forward by hold_extension_days calendar days counted from the current hold_expires_date (never from the request date), and raises hold_extension_count by one.
    replaced_by: For a reserved deal of any deal type other than Fleet Vehicle Purchase Agreement whose hold extension is asked for on a day after its reserved_date this policy sets how far one hold extension moves the hold, and only for such a deal; a Fleet Vehicle Purchase Agreement, and a deal whose hold extension is asked for on its reserved_date, keeps the base extension of hold_extension_days calendar days counted from the current hold_expires_date, and every extension, this one included, raises hold_extension_count by one and is never counted from the request date.
  trigger: on_request
  subject:
  - purchase_hold_extended
  computes: extension_days
  target_tool: extend_vehicle_hold_21e7c68f
  params:
    cover_high_ratio: 0.075
    cover_mid_ratio: 0.05
    cover_high_days: 2
    cover_mid_days: 1
    visits_high_count: 4
    visits_mid_count: 2
    visits_high_days: 2
    visits_mid_days: 1
    tenure_long_months_ext: 120
    tenure_mid_months_ext: 60
    tenure_long_days: 2
    tenure_mid_days: 1
    check_clearing_days_ext: 10
  rule: 'For a reserved deal of any deal type other than Fleet Vehicle Purchase Agreement whose hold extension is asked for on a day after its reserved_date this policy sets how far one hold extension moves the hold, and only for such a deal; a Fleet Vehicle Purchase Agreement, and a deal whose hold extension is asked for on its reserved_date, keeps the base extension of hold_extension_days calendar days counted from the current hold_expires_date, and every extension, this one included, raises hold_extension_count by one and is never counted from the request date. Each request a buyer makes is handled as one extension of the hold; a further extension needs a further request. The extension days are not worked out until a deposit received on the handling date stands on the deal. One hold extension moves the hold forward by the extension length counted from the current hold_expires_date. The extension length is the deal type''s hold_extension_days calendar days. The extension days passed are the calendar days from the current hold_expires_date to the new hold expiry date. Every added day is added to the deal type''s hold_extension_days first, giving the extension length; the extension length is then counted from the extension''s starting day, and the extension days passed are the calendar days from the current hold_expires_date to the resulting date. A buyer whose deposits cover a larger part of the price is held longer: where the deposit_held_balance is at least cover_high_ratio of the cash_price and the deal still holds collected funds (deposits with payment_method cash, cashiers_check or debit_card, less any of them refunded), the extension length takes cover_high_days added days; where the deposit_held_balance is at least cover_mid_ratio but less than cover_high_ratio of the cash_price and the deal still holds such collected funds, it takes cover_mid_days added days; otherwise no deposit-cover days are added. A buyer who services a vehicle with the group is held longer: where the buyer''s service account shows at least visits_high_count repair orders with a customer-pay concern line A closed in the last 12 whole months before the handling date, visits_high_days days are added to the extension length; where it shows at least visits_mid_count but fewer than visits_high_count, visits_mid_days days are added; otherwise no service-visit days are added. A service repair order falls in the last 12 whole months when fewer than 12 whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached). A long-standing service customer is held longer: where the buyer''s active service account was opened at least tenure_long_months_ext whole months before the handling date, tenure_long_days days are added to the extension length; where it was opened at least tenure_mid_months_ext but fewer than tenure_long_months_ext whole months before, tenure_mid_days days are added; otherwise no tenure days are added. The extension''s starting day depends on how the hold stands: where the current hold_expires_date falls on a Saturday or a Sunday, the extension starts from the Monday that follows it; where it falls on a weekday but a deposit with payment_method check was received check_clearing_days_ext calendar days or fewer before the handling date, the extension starts from the day that check clears, check_clearing_days_ext calendar days after it was received, or from the current hold_expires_date if that is later; otherwise the extension starts from the current hold_expires_date.'
  prerequisite:
  - problem: purchase_ext_extension_deposit
    kind: value_input
    gate: deposit_cover_days
    form: state
    policy_source: The extension days are not worked out until a deposit received on the handling date stands on the deal.
    condition: the deal's purchase_transactions include a purchase_deposit_received row whose txn_date is the handling date, which is later than the deal's reserved_date (on such a deal only the extension deposit is added after the reservation date).
    resolved_by: pay_extension_deposit_9124466d
    effect: deposit_held_balance rises by the extension deposit received that day, which can move the deposit-cover tier and so the added days.
  cross_category:
  - category: service
    as: history
    reads:
    - opened_date
    - status
    - service_ro_lines.event_type
    - service_ro_lines.line_letter
    - service_ro_lines.pay_type
    - service_ro_lines.line_date
    note: service-visit days count customer-pay line-A repair orders in 12 whole months; tenure days read the active account's opened_date.
  compute:
  - held_on_deal: F('deposit_held_balance')
  - collected_funds: SUM('purchase_transactions', 'amount', event_type='purchase_deposit_received', payment_method='cash') + SUM('purchase_transactions', 'amount', event_type='purchase_deposit_received', payment_method='cashiers_check') + SUM('purchase_transactions', 'amount', event_type='purchase_deposit_received', payment_method='debit_card') - SUM('purchase_transactions', 'amount', event_type='purchase_deposit_refunded', payment_method='cash') - SUM('purchase_transactions', 'amount', event_type='purchase_deposit_refunded', payment_method='cashiers_check') - SUM('purchase_transactions', 'amount', event_type='purchase_deposit_refunded', payment_method='debit_card')
  - deposit_cover_days: K('cover_high_days') if (held_on_deal >= K('cover_high_ratio') * F('cash_price') and collected_funds > 0) else (K('cover_mid_days') if (held_on_deal >= K('cover_mid_ratio') * F('cash_price') and collected_funds > 0) else 0)
  - service_visits_12m: XCOUNT('service', 'service_ro_lines', within_months=12, date_field='line_date', event_type='service_labor_charged', pay_type='customer_pay', line_letter='A')
  - visit_days: K('visits_high_days') if service_visits_12m >= K('visits_high_count') else (K('visits_mid_days') if service_visits_12m >= K('visits_mid_count') else 0)
  - service_opened: CFIELD('service', 'opened_date', status='active')
  - service_months: MONTHS(service_opened, NOW) if service_opened != None else 0
  - tenure_days: K('tenure_long_days') if service_months >= K('tenure_long_months_ext') else (K('tenure_mid_days') if service_months >= K('tenure_mid_months_ext') else 0)
  - extension_length: P('hold_extension_days') + deposit_cover_days + visit_days + tenure_days
  - expiry_weekday: DAYS('2000-01-03', F('hold_expires_date')) % 7
  - latest_check_received: LATEST('purchase_transactions', 'txn_date', date_field='txn_date', event_type='purchase_deposit_received', payment_method='check')
  - start_offset: 7 - expiry_weekday if expiry_weekday >= 5 else (MX(0, DAYS(F('hold_expires_date'), latest_check_received) + K('check_clearing_days_ext')) if (latest_check_received != None and DAYS(latest_check_received, NOW) <= K('check_clearing_days_ext')) else 0)
  - requested_on_reserved_date: F('reserved_date') == NOW
  - result: P('hold_extension_days') if requested_on_reserved_date else start_offset + extension_length
  compute_basis:
    held_on_deal: 'A buyer whose deposits cover a larger part of the price is held longer: where the deposit_held_balance is at least cover_high_ratio of the cash_price and the deal still holds collected funds (deposits with payment_method cash, cashiers_check or debit_card, less any of them refunded), the extension length takes cover_high_days added days; where the deposit_held_balance is at least cover_mid_ratio but less than cover_high_ratio of the cash_price and the deal still holds such collected funds, it takes cover_mid_days added days; otherwise no deposit-cover days are added.'
    collected_funds: 'A buyer whose deposits cover a larger part of the price is held longer: where the deposit_held_balance is at least cover_high_ratio of the cash_price and the deal still holds collected funds (deposits with payment_method cash, cashiers_check or debit_card, less any of them refunded), the extension length takes cover_high_days added days; where the deposit_held_balance is at least cover_mid_ratio but less than cover_high_ratio of the cash_price and the deal still holds such collected funds, it takes cover_mid_days added days; otherwise no deposit-cover days are added.'
    deposit_cover_days: 'A buyer whose deposits cover a larger part of the price is held longer: where the deposit_held_balance is at least cover_high_ratio of the cash_price and the deal still holds collected funds (deposits with payment_method cash, cashiers_check or debit_card, less any of them refunded), the extension length takes cover_high_days added days; where the deposit_held_balance is at least cover_mid_ratio but less than cover_high_ratio of the cash_price and the deal still holds such collected funds, it takes cover_mid_days added days; otherwise no deposit-cover days are added.'
    service_visits_12m: 'A buyer who services a vehicle with the group is held longer: where the buyer''s service account shows at least visits_high_count repair orders with a customer-pay concern line A closed in the last 12 whole months before the handling date, visits_high_days days are added to the extension length; where it shows at least visits_mid_count but fewer than visits_high_count, visits_mid_days days are added; otherwise no service-visit days are added. A service repair order falls in the last 12 whole months when fewer than 12 whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached).'
    visit_days: 'A buyer who services a vehicle with the group is held longer: where the buyer''s service account shows at least visits_high_count repair orders with a customer-pay concern line A closed in the last 12 whole months before the handling date, visits_high_days days are added to the extension length; where it shows at least visits_mid_count but fewer than visits_high_count, visits_mid_days days are added; otherwise no service-visit days are added.'
    service_opened: 'A long-standing service customer is held longer: where the buyer''s active service account was opened at least tenure_long_months_ext whole months before the handling date, tenure_long_days days are added to the extension length; where it was opened at least tenure_mid_months_ext but fewer than tenure_long_months_ext whole months before, tenure_mid_days days are added; otherwise no tenure days are added.'
    service_months: 'A long-standing service customer is held longer: where the buyer''s active service account was opened at least tenure_long_months_ext whole months before the handling date, tenure_long_days days are added to the extension length; where it was opened at least tenure_mid_months_ext but fewer than tenure_long_months_ext whole months before, tenure_mid_days days are added; otherwise no tenure days are added.'
    tenure_days: 'A long-standing service customer is held longer: where the buyer''s active service account was opened at least tenure_long_months_ext whole months before the handling date, tenure_long_days days are added to the extension length; where it was opened at least tenure_mid_months_ext but fewer than tenure_long_months_ext whole months before, tenure_mid_days days are added; otherwise no tenure days are added.'
    extension_length: Every added day is added to the deal type's hold_extension_days first, giving the extension length; the extension length is then counted from the extension's starting day, and the extension days passed are the calendar days from the current hold_expires_date to the resulting date.
    expiry_weekday: 'The extension''s starting day depends on how the hold stands: where the current hold_expires_date falls on a Saturday or a Sunday, the extension starts from the Monday that follows it; where it falls on a weekday but a deposit with payment_method check was received check_clearing_days_ext calendar days or fewer before the handling date, the extension starts from the day that check clears, check_clearing_days_ext calendar days after it was received, or from the current hold_expires_date if that is later; otherwise the extension starts from the current hold_expires_date.'
    latest_check_received: 'The extension''s starting day depends on how the hold stands: where the current hold_expires_date falls on a Saturday or a Sunday, the extension starts from the Monday that follows it; where it falls on a weekday but a deposit with payment_method check was received check_clearing_days_ext calendar days or fewer before the handling date, the extension starts from the day that check clears, check_clearing_days_ext calendar days after it was received, or from the current hold_expires_date if that is later; otherwise the extension starts from the current hold_expires_date.'
    start_offset: 'The extension''s starting day depends on how the hold stands: where the current hold_expires_date falls on a Saturday or a Sunday, the extension starts from the Monday that follows it; where it falls on a weekday but a deposit with payment_method check was received check_clearing_days_ext calendar days or fewer before the handling date, the extension starts from the day that check clears, check_clearing_days_ext calendar days after it was received, or from the current hold_expires_date if that is later; otherwise the extension starts from the current hold_expires_date.'
    result: The extension days passed are the calendar days from the current hold_expires_date to the new hold expiry date. Every added day is added to the deal type's hold_extension_days first, giving the extension length; the extension length is then counted from the extension's starting day, and the extension days passed are the calendar days from the current hold_expires_date to the resulting date.
    requested_on_reserved_date: For a reserved deal of any deal type other than Fleet Vehicle Purchase Agreement whose hold extension is asked for on a day after its reserved_date this policy sets how far one hold extension moves the hold, and only for such a deal; a Fleet Vehicle Purchase Agreement, and a deal whose hold extension is asked for on its reserved_date, keeps the base extension of hold_extension_days calendar days counted from the current hold_expires_date, and every extension, this one included, raises hold_extension_count by one and is never counted from the request date.
  factors:
  - id: deposit_cover
    effect: parameter
    decides: deposit_cover_days
    bindings:
    - held_on_deal
    - collected_funds
    - deposit_cover_days
    ladder:
    - when: deposit_held_balance at least cover_high_ratio of cash_price and a collected-funds deposit held
      value: K('cover_high_days')
    - when: deposit_held_balance at least cover_mid_ratio and below cover_high_ratio of cash_price and a collected-funds deposit held
      value: K('cover_mid_days')
    - when: otherwise
      value: '0'
    baseline:
      deposit_cover_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: service_visit_record
    effect: parameter
    decides: visit_days
    bindings:
    - service_visits_12m
    - visit_days
    ladder:
    - when: at least visits_high_count customer-pay line-A repair orders in the last 12 whole months
      value: K('visits_high_days')
    - when: at least visits_mid_count and fewer than visits_high_count
      value: K('visits_mid_days')
    - when: otherwise
      value: '0'
    baseline:
      visit_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: service_tenure_days
    effect: parameter
    decides: tenure_days
    bindings:
    - service_opened
    - service_months
    - tenure_days
    ladder:
    - when: active service account opened at least tenure_long_months_ext whole months before
      value: K('tenure_long_days')
    - when: opened at least tenure_mid_months_ext and fewer than tenure_long_months_ext whole months before
      value: K('tenure_mid_days')
    - when: otherwise
      value: '0'
    baseline:
      tenure_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: service
  - id: extension_start_day
    effect: method
    decides: start_offset
    bindings:
    - expiry_weekday
    - latest_check_received
    - start_offset
    ladder:
    - when: current hold_expires_date falls on a Saturday or a Sunday
      method: start from the following Monday (offset = days from the expiry weekday to Monday)
    - when: a weekday expiry and a check deposit received check_clearing_days_ext days or fewer ago
      method: start from the day that check clears, or the current expiry if later
    - when: otherwise
      method: start from the current hold_expires_date
    baseline:
      start_offset: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: One hold extension moves the hold forward by the extension length counted from the current hold_expires_date. The extension length is the deal type's hold_extension_days calendar days. The extension days passed are the calendar days from the current hold_expires_date to the new hold expiry date.
    params:
    - hold_extension_days
  inputs:
    history:
    - table: purchase_transactions
      aggregate: sum
      field: amount
      within_months: null
      filters:
        event_type: purchase_deposit_received
    - category: service
      table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 12
      filters:
        event_type: service_labor_charged
        line_letter: A
    cross_category:
    - service
