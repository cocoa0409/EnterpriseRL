events:
- type: purchase_deal_reserved
  target: purchase_deals
  mutation: create
  meaning: A buyer places a vehicle on hold with a reservation deposit, opening a deal in reserved status.
  grain: One row per deal (one buyer, one vehicle, one buyer's order).
  fields:
    customer_id: buyer
    store_id: selling store
    vehicle_id: vehicle held
    variant_name: deal type
    deal_number: deal number on the buyer's order
    reserved_date: reservation date (day 0 of the hold)
    hold_expires_date: reservation date plus the hold days of the deal type
    hold_extension_count: 0 at opening
    cash_price: agreed selling price
    financing_type: planned payment arrangement
    delivery_method: planned delivery method
    delivery_distance_miles: quoted one-way distance (0 for showroom)
  triggers: []
- type: purchase_hold_extended
  target: purchase_deals
  mutation: update
  meaning: The hold on a reserved vehicle is extended once.
  grain: One update per extension granted.
  fields: {hold_expires_date: previous hold expiry date plus the extension days, hold_extension_count: previous count plus 1}
  triggers: []
- type: purchase_deal_contracted
  target: purchase_deals
  mutation:
    transition: {from: reserved, to: contracted}
  meaning: The buyer's signed buyer's order (and installment contract, if financed) is recorded.
  grain: One transition per deal.
  fields:
    contract_date: date the buyer's order was signed
    cash_price: final agreed selling price
    trade_in_allowance: trade allowance (0.00 if none)
    trade_payoff_amount: quoted lien payoff on the trade (0.00 if none)
    trade_appraisal_date: appraisal date of the trade
    trade_appraisal_odometer: trade odometer at appraisal
    financing_type: payment arrangement
    lienholder_name: lender named on the contract
    amount_financed: amount financed
    lender_buy_rate: lender buy rate
    contract_apr: contract APR
  triggers: []
- type: purchase_vehicle_delivered
  target: purchase_deals
  mutation:
    transition: {from: contracted, to: delivered}
  meaning: The buyer takes final delivery of the vehicle.
  grain: One transition per deal.
  fields: {delivery_date: date possession passed, odometer_at_delivery: odometer on the disclosure statement, delivery_method: showroom or home delivery as performed, delivery_distance_miles: one-way miles driven to the delivery address}
  triggers:
  - event: purchase:purchase_deposit_applied
    map: {txn_date: delivery_date}
- type: purchase_spot_delivered
  target: purchase_deals
  mutation:
    transition: {from: contracted, to: conditionally_delivered}
  meaning: The buyer takes possession on a spot delivery before the lender has approved the installment contract.
  grain: One transition per deal.
  fields: {delivery_date: date possession passed, odometer_at_delivery: odometer on the disclosure statement, delivery_method: showroom or home delivery as performed, delivery_distance_miles: one-way miles driven to the delivery address}
  triggers:
  - event: purchase:purchase_deposit_applied
    map: {txn_date: delivery_date}
- type: purchase_financing_confirmed
  target: purchase_deals
  mutation:
    transition: {from: conditionally_delivered, to: delivered}
  meaning: The lender approves the spot-delivered contract as written and the delivery becomes final.
  grain: One transition per deal.
  fields: {lienholder_name: approving lender, lender_buy_rate: approved buy rate, contract_apr: contract APR as approved}
  triggers: []
- type: purchase_spot_unwound
  target: purchase_deals
  mutation:
    transition: {from: conditionally_delivered, to: unwound}
  meaning: No lender approved the spot-delivered contract within the window, so the vehicle comes back and the deal is unwound.
  grain: One transition per deal.
  fields: {closed_date: date the vehicle was returned and the deal unwound}
  triggers: []
- type: purchase_exchange_unwound
  target: purchase_deals
  mutation:
    transition: {from: delivered, to: unwound}
  meaning: A delivered vehicle is returned under the exchange policy on the buyer's signed exchange-return request.
  grain: One transition per deal.
  fields: {closed_date: date the returned vehicle was checked in}
  triggers: []
- type: purchase_deal_closed
  target: purchase_deals
  mutation:
    transition: {from: delivered, to: closed}
  meaning: The deal is finalized once every charge is paid or funded.
  grain: One transition per deal.
  fields: {closed_date: date the balance due reached 0.00}
  triggers: []
- type: purchase_reservation_cancelled
  target: purchase_deals
  mutation:
    transition: {from: reserved, to: cancelled}
  meaning: The buyer cancels a reservation by signed request and the held vehicle is released.
  grain: One transition per deal.
  fields: {closed_date: date the cancellation was processed}
  triggers: []
- type: purchase_contract_cancelled
  target: purchase_deals
  mutation:
    transition: {from: contracted, to: cancelled}
  meaning: The buyer cancels a signed but undelivered deal by signed request.
  grain: One transition per deal.
  fields: {closed_date: date the cancellation was processed}
  triggers: []
- type: purchase_hold_released
  target: purchase_deals
  mutation:
    transition: {from: reserved, to: released}
  meaning: The hold lapses without a signed buyer's order and the vehicle returns to stock.
  grain: One transition per deal.
  fields: {closed_date: first calendar day after the hold expiry date}
  triggers: []
- type: purchase_title_applied
  target: purchase_deals
  mutation: update
  meaning: The store files the buyer's title and registration application with the state.
  grain: One update per deal.
  fields: {title_application_date: date the application was filed}
  triggers: []
- type: purchase_deposit_received
  target: purchase_transactions
  meaning: A deposit is received from the buyer and held against the deal.
  grain: One row per deposit payment received.
  distinguish_by: [txn_date, amount, payment_method]
  fields: {txn_date: date received, amount: deposit amount, payment_method: how the deposit was paid, charge_code: not_applicable}
  account: deposit_held
  direction: in
  triggers: []
- type: purchase_deposit_applied
  target: purchase_transactions
  meaning: The deposits held are applied to the deal at delivery.
  grain: One row per deposit applied.
  distinguish_by: [source_txn_id]
  fields: {txn_date: delivery date, amount: deposit amount applied, source_txn_id: the deposit row applied, payment_method: deposit_transfer, charge_code: not_applicable}
  account: deposit_held
  direction: out
  triggers:
  - event: purchase:purchase_payment_posted
    map: {txn_date: txn_date, amount: amount, payment_method: deposit_transfer, source_txn_id: source_txn_id}
- type: purchase_deposit_refunded
  target: purchase_transactions
  meaning: All or part of a held deposit is refunded to the buyer after a cancellation, release or unwind.
  grain: One row per deposit refunded.
  distinguish_by: [source_txn_id, txn_date]
  fields: {txn_date: refund date, amount: amount refunded, source_txn_id: the deposit row refunded, payment_method: original method of the deposit, charge_code: not_applicable}
  account: deposit_held
  direction: out
  triggers: []
- type: purchase_deposit_forfeited
  target: purchase_transactions
  meaning: Part of a held deposit is retained by the store under the cancellation or lapse rules.
  grain: One row per deposit forfeiture.
  distinguish_by: [source_txn_id]
  fields: {txn_date: forfeiture date, amount: amount retained, source_txn_id: the deposit row partly or wholly retained, payment_method: not_applicable, charge_code: not_applicable}
  account: deposit_held
  direction: out
  triggers: []
- type: purchase_charge_posted
  target: purchase_transactions
  meaning: A charge is posted to the deal (price, taxes, fees, negative equity, late balance fee, returned payment fee, exchange charges).
  grain: One row per charge of one charge code (per billing month for the late balance fee).
  distinguish_by: [charge_code, billing_month, txn_date]
  fields: {txn_date: posting date, amount: charge amount, charge_code: what the charge is for, billing_month: month assessed (late balance fee only), odometer_miles: return odometer (exchange mileage charge only), payment_method: not_applicable}
  account: deal_receivable
  direction: in
  triggers: []
- type: purchase_payment_posted
  target: purchase_transactions
  meaning: A payment or credit is applied to the deal (buyer payment, lender funding, applied deposit, manufacturer fleet incentive).
  grain: One row per payment or credit received.
  distinguish_by: [txn_date, payment_method, amount, source_txn_id]
  fields: {txn_date: date received, amount: payment amount, payment_method: how it was paid, source_txn_id: the deposit row when this is an applied deposit, charge_code: not_applicable}
  account: deal_receivable
  direction: out
  triggers: []
- type: purchase_payment_returned
  target: purchase_transactions
  meaning: A check or ACH payment is returned unpaid by the bank and its credit is taken back.
  grain: One row per returned payment.
  distinguish_by: [source_txn_id]
  fields: {txn_date: date the return was received, amount: amount of the returned payment, source_txn_id: the payment row returned, payment_method: method of the returned payment, charge_code: not_applicable}
  account: deal_receivable
  direction: in
  triggers:
  - event: purchase:purchase_charge_posted
    when: {payment_method: [check, ach]}
    map: {txn_date: txn_date, charge_code: returned_payment_fee, payment_method: not_applicable}
- type: purchase_payment_refunded
  target: purchase_transactions
  meaning: A payment the buyer made on the deal is paid back to the buyer on an unwind or exchange return.
  grain: One row per payment refunded.
  distinguish_by: [source_txn_id]
  fields: {txn_date: refund date, amount: amount refunded, source_txn_id: the payment row refunded, payment_method: method used for the refund, charge_code: not_applicable}
  account: deal_receivable
  direction: in
  triggers: []
- type: purchase_charge_reversed
  target: purchase_transactions
  meaning: A posted charge is reversed in whole or part (an unwind, a correction of an over-ceiling fee, a waived late fee).
  grain: One row per charge reversal.
  distinguish_by: [source_txn_id, txn_date]
  fields: {txn_date: reversal date, amount: amount reversed, source_txn_id: the charge row reversed, charge_code: charge code of the original charge, payment_method: not_applicable}
  account: deal_receivable
  direction: out
  triggers: []
measures:
- id: purchase_msr_open_reservations
  window: Point in time at the frozen handling date.
  measure: Count of the customer's purchase_deals of the same variant_name with status reserved.
- id: purchase_msr_fleet_units_delivered_ytd
  window: Calendar year (January 1 through December 31) containing the delivery date being evaluated.
  measure: Count of the customer's purchase_deals of variant Fleet Vehicle Purchase Agreement whose delivery_date falls in that calendar year and whose status is delivered or closed, including the deal being evaluated.
- id: purchase_msr_credit_card_total_on_deal
  window: Life of the deal up to the frozen handling date.
  measure: Sum of amount over the deal's purchase_deposit_received and purchase_payment_posted rows with payment_method credit_card, less the amount of any purchase_payment_returned or purchase_payment_refunded row pointing at one of those rows.
- id: purchase_msr_last_returned_payment_date
  window: Life of all of the customer's deals up to the frozen handling date.
  measure: Latest txn_date among the customer's purchase_payment_returned rows; empty when there is none.
policies:
- id: purchase_agg_multi_holding
  subject: [purchase_deal_reserved]
  rule: A customer may hold any number of purchase deals over time, and deals of different deal types are held side by side; each deal stands on its own for deposits, charges, payments and balance. How many deals one customer may have open in reserved status at the same time is governed by purchase_agg_open_reservations.
  eligibility: []
  params: {max_per_customer: null}
- id: purchase_agg_open_reservations
  subject: [purchase_deal_reserved]
  rule: A new reservation is opened only while the customer's open reservations of the same deal type stay within the limit. The count of the customer's deals of the requested deal type in reserved status, taken before the new deal is opened (purchase_msr_open_reservations), must be lower than the deal type's max_open_reservations_per_customer. A vehicle that already has a deal in reserved, contracted or conditionally_delivered status cannot be reserved for another deal. Where the deal type's hold_requires_deposit is true, the hold is placed only together with a deposit received on the reservation date, and the hold runs vehicle_hold_days calendar days with the reservation date as day 0, ending at the end of the last day.
  eligibility:
  - id: one_open_deal_per_vehicle
    applies_to: [purchase_deal_reserved]
    kind: dedup
    condition: A vehicle that already has a deal in reserved, contracted or conditionally_delivered status cannot be reserved for another deal.
    evidence_fields: [purchase_deals.vehicle_id, purchase_deals.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.vehicle_id]
      action_bindings: {purchase_deals.vehicle_id: vehicle_id}
    dedup_contract:
      table: purchase_deals
      mode: separate_record
      object_bindings: {vehicle_id: vehicle_id}
      duplicate_filters: {status: [reserved, contracted, conditionally_delivered]}
      distinct_fields: [purchase_deal_id]
  formula:
    reservation_allowed: purchase_msr_open_reservations < max_open_reservations_per_customer
  measures: [purchase_msr_open_reservations]
- id: purchase_evt_deposit
  subject: [purchase_deposit_received]
  rule: A deposit is accepted only on a deal in reserved or contracted status. The first deposit on a deal must be at least the deal type's deposit_min_usd, and the total of all deposits received on the deal, including the new one, may not exceed deposit_max_usd. Only the payment methods listed in the deal type's deposit_methods_allowed are accepted. Credit card deposits on one deal may not total more than deposit_card_max_usd, and credit card money on the deal across deposits and payments, measured by purchase_msr_credit_card_total_on_deal including the new deposit, may not exceed deal_card_payment_cap_usd. During the certified-funds period of purchase_evt_returned_payment only cash, cashier's check or debit card deposits are accepted. A deposit that would break any of these limits is refused as a whole; the store does not substitute a smaller amount on its own.
  eligibility:
  - id: deal_open_for_deposit
    applies_to: [purchase_deposit_received]
    kind: state
    condition: A deposit is accepted only on a deal in reserved or contracted status.
    evidence_fields: [purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.status, allowed: [reserved, contracted]}
  formula:
    card_within_cap: purchase_msr_credit_card_total_on_deal <= deal_card_payment_cap_usd
    deposit_within_max: deposit_held + amount <= deposit_max_usd
  measures: [purchase_msr_credit_card_total_on_deal]
- id: purchase_evt_hold_extension
  subject: [purchase_hold_extended]
  rule: A hold extension is granted only on a deal in reserved status. A deal may receive at most the deal type's max_hold_extensions extensions in total. Each extension moves hold_expires_date forward by hold_extension_days calendar days counted from the current hold_expires_date (never from the request date), and raises hold_extension_count by one. Extensions carry no fee and leave the deposit unchanged. A request beyond the extension limit is declined and the hold runs out on its current expiry date.
  eligibility:
  - id: reserved_for_extension
    applies_to: [purchase_hold_extended]
    kind: state
    condition: A hold extension is granted only on a deal in reserved status.
    evidence_fields: [purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.status, allowed: [reserved]}
  formula: {extension_allowed: hold_extension_count < max_hold_extensions}
- id: purchase_evt_hold_lapse
  subject: [purchase_hold_released, purchase_deposit_refunded, purchase_deposit_forfeited]
  rule: A reserved deal whose hold has run out without a signed buyer's order is released, and the vehicle returns to stock. A hold is released only on or after the first calendar day following the deal's hold expiry date. On release, where the deal type's deposit_forfeit_on_hold_lapse is true the store retains deposit_nonrefundable_portion_usd (never more than the deposit held), booked as one purchase_deposit_forfeited row against the earliest deposit row, and refunds the rest; where it is false the whole deposit held is refunded. Each deposit row is refunded by its own purchase_deposit_refunded row carrying the payment method of that deposit, issued within deposit_refund_days calendar days after the release date. Calendar days are added to the hold expiry date; the hold covers the whole expiry date, so release is possible from the next calendar day onward.
  eligibility:
  - id: hold_has_lapsed
    applies_to: [purchase_hold_released]
    kind: time
    condition: A hold is released only on or after the first calendar day following the deal's hold expiry date.
    evidence_fields: [purchase_deals.hold_expires_date, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the deal's hold expiry date
      anchor_source: purchase_deals.hold_expires_date
      relation: not_before
      duration_source: params.release_lag_days
      unit: calendar_days
      counting_rule: Calendar days are added to the hold expiry date; the hold covers the whole expiry date, so release is possible from the next calendar day onward.
      boundary: inclusive
  params: {release_lag_days: 1}
  formula: {forfeited: 'min(deposit_held, deposit_nonrefundable_portion_usd)'}
- id: purchase_evt_buyer_cancellation
  subject: [purchase_reservation_cancelled, purchase_contract_cancelled, purchase_deposit_refunded, purchase_deposit_forfeited]
  rule: A buyer may cancel a deal that has not been delivered; the cancellation is the buyer's own signed request (request_type reservation_cancellation for a reserved deal, contract_cancellation for a contracted deal) and takes effect when the store processes it. A buyer cancellation is processed only for a deal in reserved or contracted status. A cancellation is processed only on the buyer's signed request recorded for the deal. The amount retained is deposit_nonrefundable_portion_usd for a reserved deal, and deposit_nonrefundable_portion_usd plus contract_cancellation_fee_usd for a contracted deal; it never exceeds the deposit held, and nothing beyond the deposit held is billed to the buyer. Late-delivery waiver — where the deal type's late_delivery_cancel_waives_fee is true and a contracted deal has not been delivered by the end of the delivery window (delivery_window_days calendar days after the contract date, the contract date being day 0), the cancellation retains nothing. The retained amount is booked as purchase_deposit_forfeited rows against the deposit rows in date order (earliest first), and every remaining deposit amount is refunded by one purchase_deposit_refunded row per deposit row with that deposit's payment method, within deposit_refund_days calendar days after the processing date. A delivered deal cannot be cancelled; its only return path is purchase_evt_exchange.
  eligibility:
  - id: undelivered_deal
    applies_to: [purchase_reservation_cancelled, purchase_contract_cancelled]
    kind: state
    condition: A buyer cancellation is processed only for a deal in reserved or contracted status.
    evidence_fields: [purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.status, allowed: [reserved, contracted]}
  - id: signed_cancellation_request
    applies_to: [purchase_reservation_cancelled, purchase_contract_cancelled]
    kind: authorization
    condition: A cancellation is processed only on the buyer's signed request recorded for the deal.
    evidence_fields: [purchase_cancellation_requests.purchase_deal_id, purchase_cancellation_requests.request_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_cancellation_requests.purchase_deal_id]
      action_bindings: {purchase_cancellation_requests.purchase_deal_id: purchase_deal_id}
  params:
    per_tier:
      Value Line Used Vehicle Purchase: {contract_cancellation_fee_usd: =contract_cancellation_fee_usd, deposit_nonrefundable_portion_usd: =deposit_nonrefundable_portion_usd}
      Used Vehicle Retail Purchase: {contract_cancellation_fee_usd: =contract_cancellation_fee_usd, deposit_nonrefundable_portion_usd: =deposit_nonrefundable_portion_usd}
      Certified Pre-Owned Vehicle Purchase: {contract_cancellation_fee_usd: =contract_cancellation_fee_usd, deposit_nonrefundable_portion_usd: =deposit_nonrefundable_portion_usd}
      New Vehicle Retail Purchase: {contract_cancellation_fee_usd: =contract_cancellation_fee_usd, deposit_nonrefundable_portion_usd: =deposit_nonrefundable_portion_usd}
      New Vehicle Factory Order Purchase: {contract_cancellation_fee_usd: =contract_cancellation_fee_usd, deposit_nonrefundable_portion_usd: =deposit_nonrefundable_portion_usd}
      Fleet Vehicle Purchase Agreement: {contract_cancellation_fee_usd: =contract_cancellation_fee_usd, deposit_nonrefundable_portion_usd: =deposit_nonrefundable_portion_usd}
  formula:
    retained_contracted: min(deposit_held, deposit_nonrefundable_portion_usd + contract_cancellation_fee_usd)
    retained_reserved: min(deposit_held, deposit_nonrefundable_portion_usd)
- id: purchase_evt_contract_signing
  subject: [purchase_deal_contracted, purchase_charge_posted]
  rule: A buyer's order is recorded only for a deal in reserved status. On the contract date the store posts the agreed cash_price under charge_code vehicle_price, the documentary and electronic filing fees under purchase_evt_doc_fee, the state title, registration and sales tax amounts under purchase_evt_title, and any negative trade equity under purchase_evt_trade_and_equity. A financed deal names its lienholder, amount financed, lender buy rate and contract APR on the contract; a cash deal leaves them empty or 0.00.
  eligibility:
  - id: reserved_for_contract
    applies_to: [purchase_deal_contracted]
    kind: state
    condition: A buyer's order is recorded only for a deal in reserved status.
    evidence_fields: [purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.status, allowed: [reserved]}
- id: purchase_evt_doc_fee
  subject: [purchase_deal_contracted, purchase_charge_posted, purchase_charge_reversed]
  rule: The documentary service fee is posted once per deal on the contract date under charge_code documentary_fee. Its amount is the lesser of the selling store's fee in doc_fee_by_store_usd (looked up by the store_code of the deal's store) and doc_fee_price_pct_ceiling times the deal's cash_price, rounded to the cent (half up). Where the deal type's doc_fee_waived is true no documentary fee is posted. The flat electronic_filing_fee_usd is posted once per deal on the contract date under charge_code electronic_filing_fee. A documentary fee already posted on a deal is not posted again. A documentary fee found posted above the amount computed here is corrected by one purchase_charge_reversed row for the excess, pointing at the original charge row; a fee posted at or below the computed amount is left as posted.
  eligibility:
  - id: one_doc_fee_per_deal
    applies_to: [purchase_charge_posted]
    kind: dedup
    condition: A documentary fee already posted on a deal is not posted again.
    evidence_fields: [purchase_transactions.purchase_deal_id, purchase_transactions.charge_code, purchase_transactions.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_transactions.purchase_deal_id]
      action_bindings: {purchase_transactions.purchase_deal_id: purchase_deal_id}
    dedup_contract:
      table: purchase_transactions
      mode: separate_record
      object_bindings: {purchase_deal_id: purchase_deal_id}
      duplicate_filters: {charge_code: [documentary_fee], event_type: [purchase_charge_posted]}
      distinct_fields: [txn_date]
  formula:
    documentary_fee: round(min(doc_fee_by_store_usd, doc_fee_price_pct_ceiling * cash_price), 2)
- id: purchase_evt_home_delivery
  subject: [purchase_vehicle_delivered, purchase_charge_posted]
  rule: Home delivery is offered only where the deal type's home_delivery_available is true and the one-way delivery distance does not exceed home_delivery_max_miles; otherwise the buyer takes delivery at the showroom. The distance is the deal's delivery_distance_miles as recorded at delivery. Within home_delivery_free_radius_miles the delivery is free and no fee is posted. Beyond it the home delivery fee is the miles beyond the free radius times home_delivery_per_mile_usd, rounded to the cent, and never less than home_delivery_min_fee_usd; it is posted once per deal under charge_code home_delivery_fee on the delivery date. A redelivery the store causes (a vehicle not ready or not as ordered) carries no second fee.
  eligibility: []
  params:
    per_tier:
      Value Line Used Vehicle Purchase: {home_delivery_free_radius_miles: =home_delivery_free_radius_miles, home_delivery_per_mile_usd: =home_delivery_per_mile_usd, home_delivery_min_fee_usd: =home_delivery_min_fee_usd}
      Used Vehicle Retail Purchase: {home_delivery_free_radius_miles: =home_delivery_free_radius_miles, home_delivery_per_mile_usd: =home_delivery_per_mile_usd, home_delivery_min_fee_usd: =home_delivery_min_fee_usd}
      Certified Pre-Owned Vehicle Purchase: {home_delivery_free_radius_miles: =home_delivery_free_radius_miles, home_delivery_per_mile_usd: =home_delivery_per_mile_usd, home_delivery_min_fee_usd: =home_delivery_min_fee_usd}
      New Vehicle Retail Purchase: {home_delivery_free_radius_miles: =home_delivery_free_radius_miles, home_delivery_per_mile_usd: =home_delivery_per_mile_usd, home_delivery_min_fee_usd: =home_delivery_min_fee_usd}
      New Vehicle Factory Order Purchase: {home_delivery_free_radius_miles: =home_delivery_free_radius_miles, home_delivery_per_mile_usd: =home_delivery_per_mile_usd, home_delivery_min_fee_usd: =home_delivery_min_fee_usd}
      Fleet Vehicle Purchase Agreement: {home_delivery_free_radius_miles: =home_delivery_free_radius_miles, home_delivery_per_mile_usd: =home_delivery_per_mile_usd, home_delivery_min_fee_usd: =home_delivery_min_fee_usd}
  formula:
    when_not: delivery_distance_miles <= home_delivery_free_radius_miles
    home_delivery_fee: max(home_delivery_min_fee_usd, round((delivery_distance_miles - home_delivery_free_radius_miles) * home_delivery_per_mile_usd, 2))
- id: purchase_evt_late_balance
  subject: [purchase_charge_posted]
  rule: Any balance due on a delivered deal is payable within the deal type's balance_due_days_after_delivery calendar days after the delivery date. A late balance fee is assessed only when the handling date is later than the delivery date plus late_balance_assess_after_days calendar days. The fee is late_balance_fee_pct_per_month times the balance_due standing at the moment of assessment, rounded to the cent, and never less than late_balance_min_fee_usd; it is posted under charge_code late_balance_fee with the calendar month of assessment as billing_month. A billing month already assessed on a deal is not assessed again. No late balance fee is assessed when balance_due is 0.00 or less, nor on a deal that is unwound, cancelled or closed. Under purchase_combo_fleet_terms a fleet deal whose net terms were withdrawn is due on the delivery date and its late balance fee is assessed after late_balance_assess_after_days minus balance_due_days_after_delivery calendar days instead. Calendar days are added to the delivery date (the delivery date is day 0); the fee can be assessed from the calendar day after that sum, never on the boundary day itself.
  eligibility:
  - id: past_assessment_day
    applies_to: [purchase_charge_posted]
    kind: time
    condition: A late balance fee is assessed only when the handling date is later than the delivery date plus late_balance_assess_after_days calendar days.
    evidence_fields: [purchase_deals.delivery_date, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the delivery date
      anchor_source: purchase_deals.delivery_date
      relation: not_before
      duration_source: variants.late_balance_assess_after_days
      unit: calendar_days
      counting_rule: Calendar days are added to the delivery date (the delivery date is day 0); the fee can be assessed from the calendar day after that sum, never on the boundary day itself.
      boundary: exclusive
  - id: one_late_fee_per_month
    applies_to: [purchase_charge_posted]
    kind: dedup
    condition: A billing month already assessed on a deal is not assessed again.
    evidence_fields: [purchase_transactions.purchase_deal_id, purchase_transactions.charge_code, purchase_transactions.billing_month]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_transactions.purchase_deal_id, purchase_transactions.billing_month]
      action_bindings: {purchase_transactions.purchase_deal_id: purchase_deal_id, purchase_transactions.billing_month: billing_month}
    dedup_contract:
      table: purchase_transactions
      mode: separate_record
      object_bindings: {purchase_deal_id: purchase_deal_id, billing_month: billing_month}
      duplicate_filters: {charge_code: [late_balance_fee]}
      distinct_fields: [txn_date]
  formula:
    when_not: deal_receivable <= 0
    late_balance_fee: max(late_balance_min_fee_usd, round(late_balance_fee_pct_per_month * deal_receivable, 2))
- id: purchase_evt_returned_payment
  subject: [purchase_payment_returned, purchase_charge_posted, purchase_payment_posted]
  rule: When the bank returns a check or ACH payment, its credit is taken back by a purchase_payment_returned row pointing at the payment row, and returned_payment_fee_usd is posted under charge_code returned_payment_fee on the same date. A disputed card payment (chargeback) is taken back the same way but draws no returned payment fee. After a returned payment the customer enters a certified-funds period on all of their deals. During the certified-funds period, a payment by check, ACH or credit card is accepted only when the handling date is later than the latest returned payment date plus returned_payment_certified_funds_days calendar days. Payments in cash, by cashier's check or by debit card are accepted at any time. Calendar days are added to the txn_date of the customer's latest purchase_payment_returned row; the period covers the boundary day, so such payments are accepted from the next calendar day.
  eligibility:
  - id: certified_funds_period
    applies_to: [purchase_payment_posted]
    kind: time
    condition: During the certified-funds period, a payment by check, ACH or credit card is accepted only when the handling date is later than the latest returned payment date plus returned_payment_certified_funds_days calendar days.
    evidence_fields: [purchase_transactions.txn_date, purchase_transactions.event_type, purchase_transactions.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_transactions.customer_id]
      action_bindings: {purchase_transactions.customer_id: customer_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the latest returned payment date
      anchor_source: purchase_transactions.txn_date
      relation: not_before
      duration_source: variants.returned_payment_certified_funds_days
      unit: calendar_days
      counting_rule: Calendar days are added to the txn_date of the customer's latest purchase_payment_returned row; the period covers the boundary day, so such payments are accepted from the next calendar day.
      boundary: exclusive
  measures: [purchase_msr_last_returned_payment_date]
- id: purchase_evt_exchange
  subject: [purchase_vehicle_delivered, purchase_exchange_unwound, purchase_charge_posted, purchase_charge_reversed, purchase_payment_refunded]
  rule: A delivered vehicle may be returned under the exchange policy only on the buyer's signed exchange-return request (request_type exchange_return). An exchange return is accepted only on a deal in delivered status. An exchange return must be requested within exchange_window_days calendar days after the delivery date. The miles driven since delivery, being the request's odometer_miles minus the deal's odometer_at_delivery, may not exceed exchange_mile_limit. A deal type whose exchange_window_days is 0 has no exchange right, and a vehicle returned damaged beyond normal use is not accepted. On an accepted return the store posts exchange_restocking_fee_usd under charge_code exchange_restocking_fee and, for the miles driven beyond exchange_free_miles, an exchange mileage charge of those miles times exchange_mileage_charge_per_mile_usd under charge_code exchange_mileage_charge (nothing is posted when the miles do not exceed the free miles); every other charge on the deal is reversed in full, lender funding is returned to the lender, and the buyer's own payments are refunded less the two exchange charges. The exchange right is the store's own policy; it is separate from any cancellation right of the protection products sold with the vehicle, which follow their own charters. Calendar days are added to the delivery date (the delivery date is day 0); the window includes the whole last day.
  eligibility:
  - id: delivered_for_exchange
    applies_to: [purchase_exchange_unwound]
    kind: state
    condition: An exchange return is accepted only on a deal in delivered status.
    evidence_fields: [purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.status, allowed: [delivered]}
  - id: exchange_window
    applies_to: [purchase_exchange_unwound]
    kind: time
    condition: An exchange return must be requested within exchange_window_days calendar days after the delivery date.
    evidence_fields: [purchase_deals.delivery_date, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the delivery date
      anchor_source: purchase_deals.delivery_date
      relation: not_after
      duration_source: variants.exchange_window_days
      unit: calendar_days
      counting_rule: Calendar days are added to the delivery date (the delivery date is day 0); the window includes the whole last day.
      boundary: inclusive
  - id: signed_exchange_request
    applies_to: [purchase_exchange_unwound]
    kind: authorization
    condition: A delivered vehicle may be returned under the exchange policy only on the buyer's signed exchange-return request (request_type exchange_return).
    evidence_fields: [purchase_cancellation_requests.purchase_deal_id, purchase_cancellation_requests.request_type, purchase_cancellation_requests.odometer_miles]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_cancellation_requests.purchase_deal_id]
      action_bindings: {purchase_cancellation_requests.purchase_deal_id: purchase_deal_id}
  params:
    per_tier:
      Value Line Used Vehicle Purchase: {exchange_window_days: =exchange_window_days, exchange_mile_limit: =exchange_mile_limit, exchange_restocking_fee_usd: =exchange_restocking_fee_usd}
      Used Vehicle Retail Purchase: {exchange_window_days: =exchange_window_days, exchange_mile_limit: =exchange_mile_limit, exchange_restocking_fee_usd: =exchange_restocking_fee_usd}
      Certified Pre-Owned Vehicle Purchase: {exchange_window_days: =exchange_window_days, exchange_mile_limit: =exchange_mile_limit, exchange_restocking_fee_usd: =exchange_restocking_fee_usd}
      New Vehicle Retail Purchase: {exchange_window_days: =exchange_window_days, exchange_mile_limit: =exchange_mile_limit, exchange_restocking_fee_usd: =exchange_restocking_fee_usd}
      New Vehicle Factory Order Purchase: {exchange_window_days: =exchange_window_days, exchange_mile_limit: =exchange_mile_limit, exchange_restocking_fee_usd: =exchange_restocking_fee_usd}
      Fleet Vehicle Purchase Agreement: {exchange_window_days: =exchange_window_days, exchange_mile_limit: =exchange_mile_limit, exchange_restocking_fee_usd: =exchange_restocking_fee_usd}
  formula:
    miles_within_limit: odometer_miles - odometer_at_delivery <= exchange_mile_limit
    exchange_mileage_charge: round(max(0, odometer_miles - odometer_at_delivery - exchange_free_miles) * exchange_mileage_charge_per_mile_usd, 2)
- id: purchase_evt_spot_delivery
  subject: [purchase_spot_delivered, purchase_financing_confirmed, purchase_spot_unwound, purchase_deposit_refunded, purchase_payment_refunded, purchase_charge_reversed]
  rule: Spot delivery is offered only where the deal type's spot_delivery_allowed is true. Spot delivery is available only on a deal financed by a dealer-arranged installment contract. The delivery becomes final only if a lender approves the contract as written within spot_delivery_window_days calendar days after the delivery date. A spot-delivered deal is unwound only when the handling date is later than the delivery date plus spot_delivery_window_days calendar days without lender approval. On an unwind every deposit and payment the buyer made is returned in full, every charge is reversed, and the trade-in vehicle is handed back; miles driven during the spot delivery are not charged because spot_delivery_mileage_charge_allowed is false for every deal type. A buyer who prefers to sign a new contract on terms a lender has approved does so as a new deal; the unwound deal is not rewritten. Calendar days are added to the delivery date (the delivery date is day 0); the lender has the whole last day, so an unwind is possible from the next calendar day.
  eligibility:
  - id: dealer_arranged_financing
    applies_to: [purchase_spot_delivered]
    kind: state
    condition: Spot delivery is available only on a deal financed by a dealer-arranged installment contract.
    evidence_fields: [purchase_deals.financing_type, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.financing_type, allowed: [dealer_arranged_installment]}
  - id: spot_window_elapsed
    applies_to: [purchase_spot_unwound]
    kind: time
    condition: A spot-delivered deal is unwound only when the handling date is later than the delivery date plus spot_delivery_window_days calendar days without lender approval.
    evidence_fields: [purchase_deals.delivery_date, purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the delivery date
      anchor_source: purchase_deals.delivery_date
      relation: not_before
      duration_source: variants.spot_delivery_window_days
      unit: calendar_days
      counting_rule: Calendar days are added to the delivery date (the delivery date is day 0); the lender has the whole last day, so an unwind is possible from the next calendar day.
      boundary: exclusive
- id: purchase_evt_rate_markup
  subject: [purchase_deal_contracted, purchase_financing_confirmed]
  rule: On a dealer-arranged installment contract the contract APR may exceed the lender's buy rate by no more than the deal type's rate_markup_cap_points percentage points; a contract whose markup would exceed the cap is written at the buy rate plus the cap. Cash, outside-lender and fleet net-terms deals carry no dealer-arranged APR and this rule does not apply to them. A lender approval at a different buy rate re-applies the cap to the new buy rate.
  eligibility: []
  formula: {max_contract_apr: lender_buy_rate + rate_markup_cap_points}
- id: purchase_evt_trade_and_equity
  subject: [purchase_deal_contracted, purchase_charge_posted]
  rule: A trade-in appraisal is honored only when the buyer's order is signed no later than trade_appraisal_valid_days calendar days after the appraisal date. The appraisal also lapses once the trade-in has been driven more than trade_appraisal_mile_tolerance miles beyond the appraisal odometer; a lapsed appraisal is redone before the allowance is written. Negative equity, being the trade_payoff_amount minus the trade_in_allowance when that difference is above 0.00, is posted under charge_code negative_equity on the contract date; it is payable within negative_equity_due_days calendar days after delivery unless it is included in the amount financed. The store pays off the trade-in lien within trade_payoff_business_days business days after delivery (Monday to Friday excluding US federal holidays); where trade_payoff_late_reimbursement is true, late charges the trade lender assesses because of a later payoff are reimbursed by the store. Calendar days are added to the appraisal date (the appraisal date is day 0); signing on the last day is still within validity.
  eligibility:
  - id: appraisal_current
    applies_to: [purchase_deal_contracted]
    kind: time
    condition: A trade-in appraisal is honored only when the buyer's order is signed no later than trade_appraisal_valid_days calendar days after the appraisal date.
    evidence_fields: [purchase_deals.trade_appraisal_date, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the appraisal date
      anchor_source: purchase_deals.trade_appraisal_date
      relation: not_after
      duration_source: variants.trade_appraisal_valid_days
      unit: calendar_days
      counting_rule: Calendar days are added to the appraisal date (the appraisal date is day 0); signing on the last day is still within validity.
      boundary: inclusive
  formula: {negative_equity: 'max(0, trade_payoff_amount - trade_in_allowance)'}
- id: purchase_evt_delivery_gate
  subject: [purchase_vehicle_delivered, purchase_spot_delivered, purchase_deposit_applied]
  rule: A vehicle is delivered only from a deal in contracted status. The store delivers within delivery_window_days calendar days after the contract date; the buyer's remedy when it does not is the late-delivery waiver of purchase_evt_buyer_cancellation. Where the deal type's open_recall_delivery_block is true, a vehicle with an open safety recall campaign that has no remedy-performed record in the warranty records is not delivered until the remedy is performed; for deal types where it is false an open recall is disclosed to the buyer in writing and does not block delivery. The Buyers Guide box checked for a used vehicle is the deal type's buyers_guide_type; a Used Vehicle Retail Purchase is delivered with the store's Kessler Used Vehicle Limited Warranty, whose terms are those of the warranty charter, a Value Line vehicle is sold as-is with no dealer warranty, and certified and new vehicles carry the manufacturer's coverages. On the delivery date every deposit held is applied to the deal, one purchase_deposit_applied row per deposit row.
  eligibility:
  - id: contracted_for_delivery
    applies_to: [purchase_vehicle_delivered, purchase_spot_delivered]
    kind: state
    condition: A vehicle is delivered only from a deal in contracted status.
    evidence_fields: [purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.status, allowed: [contracted]}
- id: purchase_evt_fleet_incentive
  subject: [purchase_payment_posted]
  rule: A fleet deal earns the manufacturer fleet incentive of fleet_incentive_per_unit_usd once the customer's delivered fleet units in the calendar year of the deal's delivery, counted by purchase_msr_fleet_units_delivered_ytd including the deal itself, reach fleet_volume_min_units; units delivered earlier in the same calendar year are credited too once the threshold is reached. The incentive is credited to each qualifying deal as a purchase_payment_posted row with payment_method manufacturer_incentive. The fleet incentive is credited at most once per deal. Deal types whose fleet_volume_min_units is 0 earn no fleet incentive, and an unwound or cancelled deal neither counts toward the units nor keeps an incentive.
  eligibility:
  - id: one_incentive_per_deal
    applies_to: [purchase_payment_posted]
    kind: dedup
    condition: The fleet incentive is credited at most once per deal.
    evidence_fields: [purchase_transactions.purchase_deal_id, purchase_transactions.payment_method]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_transactions.purchase_deal_id]
      action_bindings: {purchase_transactions.purchase_deal_id: purchase_deal_id}
    dedup_contract:
      table: purchase_transactions
      mode: separate_record
      object_bindings: {purchase_deal_id: purchase_deal_id}
      duplicate_filters: {payment_method: [manufacturer_incentive]}
      distinct_fields: [txn_date]
  formula:
    incentive_earned: purchase_msr_fleet_units_delivered_ytd >= fleet_volume_min_units and fleet_volume_min_units > 0
  measures: [purchase_msr_fleet_units_delivered_ytd]
- id: purchase_combo_fleet_terms
  subject: [purchase_deal_contracted, purchase_charge_posted]
  rule: 'Net terms on a fleet deal depend on the buyer''s service account standing. A Fleet Vehicle Purchase Agreement may be written with financing_type fleet_net_terms only while the buyer holds a Commercial Fleet Account - Net 15 or Commercial Fleet Account - Net 30 service account in active status. A buyer without such an account, or whose account is in credit_hold, pays by cash, check, ACH or a lender instead. A fleet deal already contracted on net terms whose buyer''s service account goes into credit_hold before delivery loses its net terms: its balance is due on the delivery date, and its late balance fee follows the withdrawn-terms timing of purchase_evt_late_balance. Retail deal types never carry net terms.'
  eligibility:
  - id: fleet_account_active
    applies_to: [purchase_deal_contracted]
    kind: state
    condition: A Fleet Vehicle Purchase Agreement may be written with financing_type fleet_net_terms only while the buyer holds a Commercial Fleet Account - Net 15 or Commercial Fleet Account - Net 30 service account in active status.
    evidence_fields: [service_accounts.status, service_accounts.variant_name, service_accounts.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [service_accounts.customer_id]
      action_bindings: {service_accounts.customer_id: customer_id}
    state_contract: {field: service_accounts.status, allowed: [active]}
- id: purchase_evt_title
  subject: [purchase_title_applied, purchase_charge_posted]
  rule: A title application is filed only for a deal in delivered or closed status. The store files the buyer's title and registration application within title_application_days calendar days after the delivery date. Title, registration and sales tax are collected at the exact amounts the state assesses and are posted under charge_codes title_registration_fee and sales_tax with no store markup; any difference found when the state assesses is posted or reversed for the exact difference.
  eligibility:
  - id: delivered_for_title
    applies_to: [purchase_title_applied]
    kind: state
    condition: A title application is filed only for a deal in delivered or closed status.
    evidence_fields: [purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.status, allowed: [delivered, closed]}
- id: purchase_evt_deal_close
  subject: [purchase_deal_closed]
  rule: A deal is closed only from delivered status. A deal is closed only when its balance due is 0.00 and its deposit held is 0.00. A delivered deal that still carries a balance remains delivered and continues under purchase_evt_late_balance; a credit balance below 0.00 is refunded to the buyer before closing.
  eligibility:
  - id: delivered_for_close
    applies_to: [purchase_deal_closed]
    kind: state
    condition: A deal is closed only from delivered status.
    evidence_fields: [purchase_deals.status, purchase_deals.purchase_deal_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [purchase_deals.purchase_deal_id]
      action_bindings: {purchase_deals.purchase_deal_id: purchase_deal_id}
    state_contract: {field: purchase_deals.status, allowed: [delivered]}
  formula: {closable: deal_receivable == 0 and deposit_held == 0}
extended_policies:
- id: purchase_ext_fleet_delivery_fee
  base_policy_refs:
  - purchase_evt_doc_fee
  - purchase_evt_exchange
  - purchase_evt_spot_delivery
  - purchase_evt_home_delivery
  overwrite:
  - base_policy: purchase_evt_home_delivery
    superseded_clause: Beyond it the home delivery fee is the miles beyond the free radius times home_delivery_per_mile_usd, rounded to the cent, and never less than home_delivery_min_fee_usd; it is posted once per deal under charge_code home_delivery_fee on the delivery date.
    replaced_by: For a Fleet Vehicle Purchase Agreement delivered by home delivery beyond the deal type's home_delivery_free_radius_miles, this policy sets the home delivery fee, and only for such a deal; every other deal type keeps its base fee of the miles beyond the free radius times home_delivery_per_mile_usd, rounded to the cent and never less than home_delivery_min_fee_usd, and every home delivery fee, this one included, is posted once per deal under charge_code home_delivery_fee on the delivery date.
  trigger: state_due
  subject:
  - purchase_charge_reversed
  computes: reversal_amount
  target_tool: reverse_fleet_delivery_fee_7a0a59bd
  params:
    standing_share_net30_clean: 0.8
    standing_share_net15_clean: 0.9
    heavy_unit_min_price_usd: 60000.0
    mid_unit_min_price_usd: 45000.0
    heavy_unit_rate_per_mile_usd: 1.6
    mid_unit_rate_per_mile_usd: 1.45
    saturday_delivery_surcharge_usd: 45.0
    sunday_delivery_surcharge_usd: 85.0
    late_delivery_long_days: 15
    late_long_cap_miles: 50
    late_credit_miles_per_day: 4
    late_floor_share: 0.5
    tenure_long_months: 60
    tenure_mid_months: 24
    tenure_long_share: 0.85
    tenure_mid_share: 0.95
  rule: 'For a Fleet Vehicle Purchase Agreement delivered by home delivery beyond the deal type''s home_delivery_free_radius_miles, this policy sets the home delivery fee, and only for such a deal; every other deal type keeps its base fee of the miles beyond the free radius times home_delivery_per_mile_usd, rounded to the cent and never less than home_delivery_min_fee_usd, and every home delivery fee, this one included, is posted once per deal under charge_code home_delivery_fee on the delivery date. The fleet home delivery fee is figured from the deal''s recorded one-way delivery distance (delivery_distance_miles). The chargeable delivery miles are the miles of that distance beyond the deal type''s home_delivery_free_radius_miles. The delivery mileage charge is the chargeable delivery miles times the deal type''s home_delivery_per_mile_usd. The fleet home delivery fee is the delivery mileage charge rounded to the cent, half up. A fleet delivery whose distance does not exceed the deal type''s home_delivery_free_radius_miles is free, and its fleet home delivery fee is 0.00. The excess reversed is the home delivery fee posted on the deal, less any part of it already reversed, less the fleet home delivery fee. A home delivery fee found posted on such a fleet deal above the fleet home delivery fee is corrected by one purchase_charge_reversed entry under charge_code home_delivery_fee for the excess, pointing at the posted fee charge; a fee posted at or below the fleet home delivery fee is left as posted. Where an amount is added to the delivery mileage charge and shares apply to the fee, the addition is made first, each share then multiplies that sum in turn, and rounding to the cent comes last. A buyer in good commercial standing pays a standing share of the fee: a buyer whose service account is a Commercial Fleet Account - Net 30 in active status and whose service ledger shows no late fee charged in the last 12 whole months before the handling date carries a share of standing_share_net30_clean; a buyer whose service account is a Commercial Fleet Account - Net 15 in active status and whose service ledger shows no late fee charged in those 12 whole months carries a share of standing_share_net15_clean; every other buyer pays the whole fee. A service late fee falls in the last 12 whole months when fewer than 12 whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached). The per-mile delivery rate for a fleet unit follows the vehicle price charged on the deal (the amount posted under charge_code vehicle_price): a unit whose vehicle price charged is at least heavy_unit_min_price_usd is charged heavy_unit_rate_per_mile_usd per chargeable delivery mile; a unit whose vehicle price charged is at least mid_unit_min_price_usd and below heavy_unit_min_price_usd is charged mid_unit_rate_per_mile_usd per chargeable delivery mile; every other unit is charged the deal type''s home_delivery_per_mile_usd. A fleet delivery made on a weekend carries a weekend delivery surcharge: a unit whose delivery_date is a Saturday carries saturday_delivery_surcharge_usd, a unit whose delivery_date is a Sunday carries sunday_delivery_surcharge_usd, and a unit delivered Monday through Friday carries no weekend delivery surcharge. How the chargeable delivery miles are counted depends on when the unit was delivered against its delivery window, which ends delivery_window_days calendar days after the contract_date (the contract date being day 0): for a unit delivered more than late_delivery_long_days days after the last day of that window the chargeable delivery miles are late_floor_share of the miles beyond the free radius, never more than late_long_cap_miles; for a unit delivered from one to late_delivery_long_days days after the last day of the window they are the miles beyond the free radius less late_credit_miles_per_day for each day past the window, never fewer than late_floor_share of the miles beyond the free radius; for a unit delivered within its window they are the miles beyond the free radius. A long-standing commercial customer pays a tenure share of the fee set by the age of the buyer''s active service account: an account opened at least tenure_long_months whole months before the handling date carries a share of tenure_long_share; an account opened at least tenure_mid_months but fewer than tenure_long_months whole months before carries a share of tenure_mid_share; a newer account, or a buyer without an active service account, pays the whole fee.'
  prerequisite: []
  cross_category:
  - category: service
    as: branch
    reads:
    - variant_name
    - status
    - opened_date
    - service_ro_lines.event_type
    - service_ro_lines.line_date
    note: the standing share reads the commercial account tier, status and service late fees of the last 12 whole months; the tenure share reads the active account's opened_date.
  compute:
  - distance: F('delivery_distance_miles')
  - beyond_radius_miles: MX(0, distance - P('home_delivery_free_radius_miles'))
  - days_past_window: DAYS(F('contract_date'), F('delivery_date')) - P('delivery_window_days')
  - chargeable_miles: MN(K('late_floor_share') * beyond_radius_miles, K('late_long_cap_miles')) if days_past_window > K('late_delivery_long_days') else (MX(K('late_floor_share') * beyond_radius_miles, beyond_radius_miles - K('late_credit_miles_per_day') * days_past_window) if days_past_window >= 1 else beyond_radius_miles)
  - vehicle_price_charged: SUM('purchase_transactions', 'amount', event_type='purchase_charge_posted', charge_code='vehicle_price')
  - mile_rate: K('heavy_unit_rate_per_mile_usd') if vehicle_price_charged >= K('heavy_unit_min_price_usd') else (K('mid_unit_rate_per_mile_usd') if vehicle_price_charged >= K('mid_unit_min_price_usd') else P('home_delivery_per_mile_usd'))
  - mileage_charge: chargeable_miles * mile_rate
  - weekday_index: DAYS('2000-01-03', F('delivery_date')) % 7
  - weekend_surcharge: K('saturday_delivery_surcharge_usd') if weekday_index == 5 else (K('sunday_delivery_surcharge_usd') if weekday_index == 6 else 0)
  - fleet_account: CFIELD('service', 'variant_name', status='active')
  - service_late_fees_12m: XCOUNT('service', 'service_ro_lines', within_months=12, date_field='line_date', event_type='service_late_fee_charged')
  - standing_share: K('standing_share_net30_clean') if (fleet_account == 'Commercial Fleet Account - Net 30' and service_late_fees_12m == 0) else (K('standing_share_net15_clean') if (fleet_account == 'Commercial Fleet Account - Net 15' and service_late_fees_12m == 0) else 1)
  - account_opened: CFIELD('service', 'opened_date', status='active')
  - account_months: MONTHS(account_opened, NOW) if account_opened != None else 0
  - tenure_share: K('tenure_long_share') if account_months >= K('tenure_long_months') else (K('tenure_mid_share') if account_months >= K('tenure_mid_months') else 1)
  - fleet_delivery_fee: RND((mileage_charge + weekend_surcharge) * standing_share * tenure_share + 0.000000001, 2) if beyond_radius_miles > 0 else 0
  - posted_delivery_fee: SUM('purchase_transactions', 'amount', event_type='purchase_charge_posted', charge_code='home_delivery_fee') - SUM('purchase_transactions', 'amount', event_type='purchase_charge_reversed', charge_code='home_delivery_fee')
  - result: RND(MX(0, posted_delivery_fee - fleet_delivery_fee) + 0.000000001, 2)
  compute_basis:
    distance: The fleet home delivery fee is figured from the deal's recorded one-way delivery distance (delivery_distance_miles).
    beyond_radius_miles: The chargeable delivery miles are the miles of that distance beyond the deal type's home_delivery_free_radius_miles.
    days_past_window: 'How the chargeable delivery miles are counted depends on when the unit was delivered against its delivery window, which ends delivery_window_days calendar days after the contract_date (the contract date being day 0): for a unit delivered more than late_delivery_long_days days after the last day of that window the chargeable delivery miles are late_floor_share of the miles beyond the free radius, never more than late_long_cap_miles; for a unit delivered from one to late_delivery_long_days days after the last day of the window they are the miles beyond the free radius less late_credit_miles_per_day for each day past the window, never fewer than late_floor_share of the miles beyond the free radius; for a unit delivered within its window they are the miles beyond the free radius.'
    chargeable_miles: 'How the chargeable delivery miles are counted depends on when the unit was delivered against its delivery window, which ends delivery_window_days calendar days after the contract_date (the contract date being day 0): for a unit delivered more than late_delivery_long_days days after the last day of that window the chargeable delivery miles are late_floor_share of the miles beyond the free radius, never more than late_long_cap_miles; for a unit delivered from one to late_delivery_long_days days after the last day of the window they are the miles beyond the free radius less late_credit_miles_per_day for each day past the window, never fewer than late_floor_share of the miles beyond the free radius; for a unit delivered within its window they are the miles beyond the free radius.'
    vehicle_price_charged: 'The per-mile delivery rate for a fleet unit follows the vehicle price charged on the deal (the amount posted under charge_code vehicle_price): a unit whose vehicle price charged is at least heavy_unit_min_price_usd is charged heavy_unit_rate_per_mile_usd per chargeable delivery mile; a unit whose vehicle price charged is at least mid_unit_min_price_usd and below heavy_unit_min_price_usd is charged mid_unit_rate_per_mile_usd per chargeable delivery mile; every other unit is charged the deal type''s home_delivery_per_mile_usd.'
    mile_rate: 'The per-mile delivery rate for a fleet unit follows the vehicle price charged on the deal (the amount posted under charge_code vehicle_price): a unit whose vehicle price charged is at least heavy_unit_min_price_usd is charged heavy_unit_rate_per_mile_usd per chargeable delivery mile; a unit whose vehicle price charged is at least mid_unit_min_price_usd and below heavy_unit_min_price_usd is charged mid_unit_rate_per_mile_usd per chargeable delivery mile; every other unit is charged the deal type''s home_delivery_per_mile_usd.'
    mileage_charge: The delivery mileage charge is the chargeable delivery miles times the deal type's home_delivery_per_mile_usd.
    weekday_index: 'A fleet delivery made on a weekend carries a weekend delivery surcharge: a unit whose delivery_date is a Saturday carries saturday_delivery_surcharge_usd, a unit whose delivery_date is a Sunday carries sunday_delivery_surcharge_usd, and a unit delivered Monday through Friday carries no weekend delivery surcharge.'
    weekend_surcharge: 'A fleet delivery made on a weekend carries a weekend delivery surcharge: a unit whose delivery_date is a Saturday carries saturday_delivery_surcharge_usd, a unit whose delivery_date is a Sunday carries sunday_delivery_surcharge_usd, and a unit delivered Monday through Friday carries no weekend delivery surcharge.'
    fleet_account: 'A buyer in good commercial standing pays a standing share of the fee: a buyer whose service account is a Commercial Fleet Account - Net 30 in active status and whose service ledger shows no late fee charged in the last 12 whole months before the handling date carries a share of standing_share_net30_clean; a buyer whose service account is a Commercial Fleet Account - Net 15 in active status and whose service ledger shows no late fee charged in those 12 whole months carries a share of standing_share_net15_clean; every other buyer pays the whole fee.'
    service_late_fees_12m: 'A buyer in good commercial standing pays a standing share of the fee: a buyer whose service account is a Commercial Fleet Account - Net 30 in active status and whose service ledger shows no late fee charged in the last 12 whole months before the handling date carries a share of standing_share_net30_clean; a buyer whose service account is a Commercial Fleet Account - Net 15 in active status and whose service ledger shows no late fee charged in those 12 whole months carries a share of standing_share_net15_clean; every other buyer pays the whole fee. A service late fee falls in the last 12 whole months when fewer than 12 whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached).'
    standing_share: 'A buyer in good commercial standing pays a standing share of the fee: a buyer whose service account is a Commercial Fleet Account - Net 30 in active status and whose service ledger shows no late fee charged in the last 12 whole months before the handling date carries a share of standing_share_net30_clean; a buyer whose service account is a Commercial Fleet Account - Net 15 in active status and whose service ledger shows no late fee charged in those 12 whole months carries a share of standing_share_net15_clean; every other buyer pays the whole fee.'
    account_opened: 'A long-standing commercial customer pays a tenure share of the fee set by the age of the buyer''s active service account: an account opened at least tenure_long_months whole months before the handling date carries a share of tenure_long_share; an account opened at least tenure_mid_months but fewer than tenure_long_months whole months before carries a share of tenure_mid_share; a newer account, or a buyer without an active service account, pays the whole fee.'
    account_months: 'A long-standing commercial customer pays a tenure share of the fee set by the age of the buyer''s active service account: an account opened at least tenure_long_months whole months before the handling date carries a share of tenure_long_share; an account opened at least tenure_mid_months but fewer than tenure_long_months whole months before carries a share of tenure_mid_share; a newer account, or a buyer without an active service account, pays the whole fee.'
    tenure_share: 'A long-standing commercial customer pays a tenure share of the fee set by the age of the buyer''s active service account: an account opened at least tenure_long_months whole months before the handling date carries a share of tenure_long_share; an account opened at least tenure_mid_months but fewer than tenure_long_months whole months before carries a share of tenure_mid_share; a newer account, or a buyer without an active service account, pays the whole fee.'
    fleet_delivery_fee: The fleet home delivery fee is the delivery mileage charge rounded to the cent, half up. A fleet delivery whose distance does not exceed the deal type's home_delivery_free_radius_miles is free, and its fleet home delivery fee is 0.00.
    posted_delivery_fee: The excess reversed is the home delivery fee posted on the deal, less any part of it already reversed, less the fleet home delivery fee.
    result: The excess reversed is the home delivery fee posted on the deal, less any part of it already reversed, less the fleet home delivery fee. A home delivery fee found posted on such a fleet deal above the fleet home delivery fee is corrected by one purchase_charge_reversed entry under charge_code home_delivery_fee for the excess, pointing at the posted fee charge; a fee posted at or below the fleet home delivery fee is left as posted.
  factors:
  - id: commercial_standing_share
    effect: parameter
    decides: standing_share
    bindings:
    - fleet_account
    - service_late_fees_12m
    - standing_share
    ladder:
    - when: Commercial Fleet Account - Net 30 in active status and no service late fee in the last 12 whole months
      value: K('standing_share_net30_clean')
    - when: Commercial Fleet Account - Net 15 in active status and no service late fee in the last 12 whole months
      value: K('standing_share_net15_clean')
    - when: otherwise
      value: '1'
    baseline:
      standing_share: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: price_class_mile_rate
    effect: parameter
    decides: mile_rate
    bindings:
    - vehicle_price_charged
    - mile_rate
    ladder:
    - when: vehicle price charged at least heavy_unit_min_price_usd
      value: K('heavy_unit_rate_per_mile_usd')
    - when: vehicle price charged at least mid_unit_min_price_usd and below heavy_unit_min_price_usd
      value: K('mid_unit_rate_per_mile_usd')
    - when: otherwise
      value: P('home_delivery_per_mile_usd')
    baseline:
      mile_rate: P('home_delivery_per_mile_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: weekend_delivery
    effect: parameter
    decides: weekend_surcharge
    bindings:
    - weekday_index
    - weekend_surcharge
    ladder:
    - when: delivery_date is a Saturday
      value: K('saturday_delivery_surcharge_usd')
    - when: delivery_date is a Sunday
      value: K('sunday_delivery_surcharge_usd')
    - when: otherwise (Monday through Friday)
      value: '0'
    baseline:
      weekend_surcharge: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: late_delivery_miles
    effect: method
    decides: chargeable_miles
    bindings:
    - days_past_window
    - chargeable_miles
    ladder:
    - when: delivered more than late_delivery_long_days days after the last day of the delivery window
      method: late_floor_share of the miles beyond the free radius, never more than late_long_cap_miles
    - when: delivered one to late_delivery_long_days days after the last day of the delivery window
      method: the miles beyond the free radius less late_credit_miles_per_day per day past the window, never fewer than late_floor_share of those miles
    - when: otherwise (delivered within the window)
      method: the miles beyond the free radius
    baseline:
      chargeable_miles: beyond_radius_miles
    evidence:
    - date
    cross_difficulty: null
  - id: account_tenure_share
    effect: parameter
    decides: tenure_share
    bindings:
    - account_opened
    - account_months
    - tenure_share
    ladder:
    - when: active service account opened at least tenure_long_months whole months before the handling date
      value: K('tenure_long_share')
    - when: opened at least tenure_mid_months and fewer than tenure_long_months whole months before
      value: K('tenure_mid_share')
    - when: otherwise (newer account or no active account)
      value: '1'
    baseline:
      tenure_share: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: service
  baseline:
    rule: The fleet home delivery fee is figured from the deal's recorded one-way delivery distance (delivery_distance_miles). The chargeable delivery miles are the miles of that distance beyond the deal type's home_delivery_free_radius_miles. The delivery mileage charge is the chargeable delivery miles times the deal type's home_delivery_per_mile_usd. The fleet home delivery fee is the delivery mileage charge rounded to the cent, half up. The excess reversed is the home delivery fee posted on the deal, less any part of it already reversed, less the fleet home delivery fee.
    params:
    - home_delivery_free_radius_miles
    - home_delivery_per_mile_usd
  inputs:
    history:
    - table: purchase_transactions
      aggregate: sum
      field: amount
      within_months: null
      filters:
        charge_code: vehicle_price
    - table: purchase_transactions
      aggregate: sum
      field: amount
      within_months: null
      filters:
        charge_code: home_delivery_fee
    - category: service
      table: service_ro_lines
      aggregate: count
      field: service_line_id
      within_months: 12
      filters:
        event_type: service_late_fee_charged
    cross_category:
    - service
- id: purchase_ext_fleet_unit_incentive
  base_policy_refs:
  - purchase_evt_fleet_incentive
  - purchase_evt_returned_payment
  overwrite:
  - base_policy: purchase_evt_fleet_incentive
    superseded_clause: A fleet deal earns the manufacturer fleet incentive of fleet_incentive_per_unit_usd once the customer's delivered fleet units in the calendar year of the deal's delivery, counted by purchase_msr_fleet_units_delivered_ytd including the deal itself, reach fleet_volume_min_units; units delivered earlier in the same calendar year are credited too once the threshold is reached.
    replaced_by: A qualifying fleet deal is a Fleet Vehicle Purchase Agreement in delivered or closed status whose customer's delivered fleet units in the calendar year of the deal's delivery, counted including the deal itself, reach the deal type's fleet_volume_min_units, units delivered earlier in that calendar year being credited too once the threshold is reached; for such a deal this policy sets the fleet unit incentive, and only for such a deal, and deal types whose fleet_volume_min_units is 0 earn none.
  trigger: state_due
  subject:
  - purchase_payment_posted
  computes: incentive_amount
  target_tool: credit_fleet_incentive_b735a70c
  params:
    class_heavy_min_price_usd: 60000.0
    class_mid_min_price_usd: 45000.0
    class_heavy_incentive_usd: 2150.0
    class_mid_incentive_usd: 1650.0
    q3_program_cash_usd: 500.0
    q2_program_cash_usd: 250.0
    order_long_days: 30
    order_short_days: 15
    order_long_bonus_usd: 300.0
    order_short_bonus_usd: 150.0
    fleet_size_bonus_net30_usd: 350.0
    fleet_size_bonus_net15_usd: 150.0
    report_prompt_days: 10
    report_late_per_day_usd: 25.0
    report_floor_share: 0.5
  rule: 'A qualifying fleet deal is a Fleet Vehicle Purchase Agreement in delivered or closed status whose customer''s delivered fleet units in the calendar year of the deal''s delivery, counted including the deal itself, reach the deal type''s fleet_volume_min_units, units delivered earlier in that calendar year being credited too once the threshold is reached; for such a deal this policy sets the fleet unit incentive, and only for such a deal, and deal types whose fleet_volume_min_units is 0 earn none. The fleet unit incentive credited on a qualifying deal is the deal type''s fleet_incentive_per_unit_usd. The fleet unit incentive is rounded to the cent, half up, and credited once to the deal as a payment with payment_method manufacturer_incentive dated the handling date. Every amount added to the per-unit amount is added first, giving the summed incentive; any adjustment to the summed incentive comes next, and rounding to the cent comes last. The per-unit amount follows the unit''s price class, read from the vehicle price charged on the deal (the amount posted under charge_code vehicle_price): a unit whose vehicle price charged is at least class_heavy_min_price_usd earns class_heavy_incentive_usd; a unit whose vehicle price charged is at least class_mid_min_price_usd and below class_heavy_min_price_usd earns class_mid_incentive_usd; every other unit earns the deal type''s fleet_incentive_per_unit_usd. The manufacturer''s quarterly fleet program adds program cash by the calendar quarter of the unit''s delivery_date: a unit delivered in July, August or September earns q3_program_cash_usd; a unit delivered in April, May or June earns q2_program_cash_usd; a unit delivered in any other month earns no program cash. A unit ordered ahead of delivery earns an order-bank bonus by the calendar days from its contract_date to its delivery_date: more than order_long_days days earn order_long_bonus_usd; from order_short_days to order_long_days days earn order_short_bonus_usd; fewer than order_short_days days earn no order-bank bonus. The size of the buyer''s registered fleet, shown by the buyer''s commercial service account, adds a fleet-size bonus: a buyer holding a Commercial Fleet Account - Net 30 in active status earns fleet_size_bonus_net30_usd; a buyer holding a Commercial Fleet Account - Net 15 in active status earns fleet_size_bonus_net15_usd; every other buyer earns no fleet-size bonus. How promptly the unit''s registration was reported sets how the summed incentive is adjusted: for a unit whose title_application_date is more than report_prompt_days calendar days after its delivery_date, the summed incentive is reduced by report_late_per_day_usd for each day of that lag beyond report_prompt_days; for a unit with no title application filed yet, it is reduced by report_late_per_day_usd for each calendar day from the delivery_date to the handling date beyond report_prompt_days; neither reduction takes the incentive below report_floor_share of the summed incentive; a unit whose title application was filed report_prompt_days calendar days or fewer after delivery keeps the summed incentive.'
  prerequisite: []
  cross_category:
  - category: service
    as: branch
    reads:
    - variant_name
    - status
    note: the fleet-size bonus reads the buyer's commercial account tier and status.
  compute:
  - class_price_charged: SUM('purchase_transactions', 'amount', event_type='purchase_charge_posted', charge_code='vehicle_price')
  - unit_class_amount: K('class_heavy_incentive_usd') if class_price_charged >= K('class_heavy_min_price_usd') else (K('class_mid_incentive_usd') if class_price_charged >= K('class_mid_min_price_usd') else P('fleet_incentive_per_unit_usd'))
  - delivery_month_index: MONTHS('2000-01-01', F('delivery_date')) % 12
  - program_cash: K('q3_program_cash_usd') if (delivery_month_index >= 6 and delivery_month_index <= 8) else (K('q2_program_cash_usd') if (delivery_month_index >= 3 and delivery_month_index <= 5) else 0)
  - order_lead_days: DAYS(F('contract_date'), F('delivery_date'))
  - order_bank_bonus: K('order_long_bonus_usd') if order_lead_days > K('order_long_days') else (K('order_short_bonus_usd') if order_lead_days >= K('order_short_days') else 0)
  - commercial_account: CFIELD('service', 'variant_name', status='active')
  - fleet_size_bonus: K('fleet_size_bonus_net30_usd') if commercial_account == 'Commercial Fleet Account - Net 30' else (K('fleet_size_bonus_net15_usd') if commercial_account == 'Commercial Fleet Account - Net 15' else 0)
  - summed_incentive: unit_class_amount + program_cash + order_bank_bonus + fleet_size_bonus
  - report_lag_days: DAYS(F('delivery_date'), F('title_application_date')) if F('title_application_date') != None else -1
  - days_since_delivery: DAYS(F('delivery_date'), NOW)
  - reported_incentive: MX(K('report_floor_share') * summed_incentive, summed_incentive - K('report_late_per_day_usd') * (report_lag_days - K('report_prompt_days'))) if report_lag_days > K('report_prompt_days') else (MX(K('report_floor_share') * summed_incentive, summed_incentive - K('report_late_per_day_usd') * MX(0, days_since_delivery - K('report_prompt_days'))) if report_lag_days < 0 else summed_incentive)
  - result: RND(reported_incentive + 0.000000001, 2)
  compute_basis:
    class_price_charged: 'The per-unit amount follows the unit''s price class, read from the vehicle price charged on the deal (the amount posted under charge_code vehicle_price): a unit whose vehicle price charged is at least class_heavy_min_price_usd earns class_heavy_incentive_usd; a unit whose vehicle price charged is at least class_mid_min_price_usd and below class_heavy_min_price_usd earns class_mid_incentive_usd; every other unit earns the deal type''s fleet_incentive_per_unit_usd.'
    unit_class_amount: 'The per-unit amount follows the unit''s price class, read from the vehicle price charged on the deal (the amount posted under charge_code vehicle_price): a unit whose vehicle price charged is at least class_heavy_min_price_usd earns class_heavy_incentive_usd; a unit whose vehicle price charged is at least class_mid_min_price_usd and below class_heavy_min_price_usd earns class_mid_incentive_usd; every other unit earns the deal type''s fleet_incentive_per_unit_usd.'
    delivery_month_index: 'The manufacturer''s quarterly fleet program adds program cash by the calendar quarter of the unit''s delivery_date: a unit delivered in July, August or September earns q3_program_cash_usd; a unit delivered in April, May or June earns q2_program_cash_usd; a unit delivered in any other month earns no program cash.'
    program_cash: 'The manufacturer''s quarterly fleet program adds program cash by the calendar quarter of the unit''s delivery_date: a unit delivered in July, August or September earns q3_program_cash_usd; a unit delivered in April, May or June earns q2_program_cash_usd; a unit delivered in any other month earns no program cash.'
    order_lead_days: 'A unit ordered ahead of delivery earns an order-bank bonus by the calendar days from its contract_date to its delivery_date: more than order_long_days days earn order_long_bonus_usd; from order_short_days to order_long_days days earn order_short_bonus_usd; fewer than order_short_days days earn no order-bank bonus.'
    order_bank_bonus: 'A unit ordered ahead of delivery earns an order-bank bonus by the calendar days from its contract_date to its delivery_date: more than order_long_days days earn order_long_bonus_usd; from order_short_days to order_long_days days earn order_short_bonus_usd; fewer than order_short_days days earn no order-bank bonus.'
    commercial_account: 'The size of the buyer''s registered fleet, shown by the buyer''s commercial service account, adds a fleet-size bonus: a buyer holding a Commercial Fleet Account - Net 30 in active status earns fleet_size_bonus_net30_usd; a buyer holding a Commercial Fleet Account - Net 15 in active status earns fleet_size_bonus_net15_usd; every other buyer earns no fleet-size bonus.'
    fleet_size_bonus: 'The size of the buyer''s registered fleet, shown by the buyer''s commercial service account, adds a fleet-size bonus: a buyer holding a Commercial Fleet Account - Net 30 in active status earns fleet_size_bonus_net30_usd; a buyer holding a Commercial Fleet Account - Net 15 in active status earns fleet_size_bonus_net15_usd; every other buyer earns no fleet-size bonus.'
    summed_incentive: Every amount added to the per-unit amount is added first, giving the summed incentive; any adjustment to the summed incentive comes next, and rounding to the cent comes last.
    report_lag_days: 'How promptly the unit''s registration was reported sets how the summed incentive is adjusted: for a unit whose title_application_date is more than report_prompt_days calendar days after its delivery_date, the summed incentive is reduced by report_late_per_day_usd for each day of that lag beyond report_prompt_days; for a unit with no title application filed yet, it is reduced by report_late_per_day_usd for each calendar day from the delivery_date to the handling date beyond report_prompt_days; neither reduction takes the incentive below report_floor_share of the summed incentive; a unit whose title application was filed report_prompt_days calendar days or fewer after delivery keeps the summed incentive.'
    days_since_delivery: 'How promptly the unit''s registration was reported sets how the summed incentive is adjusted: for a unit whose title_application_date is more than report_prompt_days calendar days after its delivery_date, the summed incentive is reduced by report_late_per_day_usd for each day of that lag beyond report_prompt_days; for a unit with no title application filed yet, it is reduced by report_late_per_day_usd for each calendar day from the delivery_date to the handling date beyond report_prompt_days; neither reduction takes the incentive below report_floor_share of the summed incentive; a unit whose title application was filed report_prompt_days calendar days or fewer after delivery keeps the summed incentive.'
    reported_incentive: 'How promptly the unit''s registration was reported sets how the summed incentive is adjusted: for a unit whose title_application_date is more than report_prompt_days calendar days after its delivery_date, the summed incentive is reduced by report_late_per_day_usd for each day of that lag beyond report_prompt_days; for a unit with no title application filed yet, it is reduced by report_late_per_day_usd for each calendar day from the delivery_date to the handling date beyond report_prompt_days; neither reduction takes the incentive below report_floor_share of the summed incentive; a unit whose title application was filed report_prompt_days calendar days or fewer after delivery keeps the summed incentive.'
    result: The fleet unit incentive is rounded to the cent, half up, and credited once to the deal as a payment with payment_method manufacturer_incentive dated the handling date. Every amount added to the per-unit amount is added first, giving the summed incentive; any adjustment to the summed incentive comes next, and rounding to the cent comes last.
  factors:
  - id: unit_price_class
    effect: parameter
    decides: unit_class_amount
    bindings:
    - class_price_charged
    - unit_class_amount
    ladder:
    - when: vehicle price charged at least class_heavy_min_price_usd
      value: K('class_heavy_incentive_usd')
    - when: vehicle price charged at least class_mid_min_price_usd and below class_heavy_min_price_usd
      value: K('class_mid_incentive_usd')
    - when: otherwise
      value: P('fleet_incentive_per_unit_usd')
    baseline:
      unit_class_amount: P('fleet_incentive_per_unit_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: quarterly_program
    effect: parameter
    decides: program_cash
    bindings:
    - delivery_month_index
    - program_cash
    ladder:
    - when: delivery_date in July, August or September
      value: K('q3_program_cash_usd')
    - when: delivery_date in April, May or June
      value: K('q2_program_cash_usd')
    - when: otherwise
      value: '0'
    baseline:
      program_cash: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: order_bank_lead
    effect: parameter
    decides: order_bank_bonus
    bindings:
    - order_lead_days
    - order_bank_bonus
    ladder:
    - when: more than order_long_days days from contract_date to delivery_date
      value: K('order_long_bonus_usd')
    - when: order_short_days to order_long_days days
      value: K('order_short_bonus_usd')
    - when: otherwise (fewer than order_short_days days)
      value: '0'
    baseline:
      order_bank_bonus: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: registered_fleet_size
    effect: parameter
    decides: fleet_size_bonus
    bindings:
    - commercial_account
    - fleet_size_bonus
    ladder:
    - when: Commercial Fleet Account - Net 30 in active status
      value: K('fleet_size_bonus_net30_usd')
    - when: Commercial Fleet Account - Net 15 in active status
      value: K('fleet_size_bonus_net15_usd')
    - when: otherwise
      value: '0'
    baseline:
      fleet_size_bonus: '0'
    evidence:
    - cross_category
    cross_difficulty: service
  - id: registration_report_timing
    effect: method
    decides: reported_incentive
    bindings:
    - report_lag_days
    - days_since_delivery
    - reported_incentive
    ladder:
    - when: title_application_date more than report_prompt_days days after delivery
      method: summed incentive less report_late_per_day_usd per day of the filing lag beyond report_prompt_days, never below report_floor_share of it
    - when: no title application filed yet
      method: summed incentive less report_late_per_day_usd per day from delivery to the handling date beyond report_prompt_days, never below report_floor_share of it
    - when: otherwise (filed within report_prompt_days days)
      method: the summed incentive unchanged
    baseline:
      reported_incentive: summed_incentive
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The fleet unit incentive credited on a qualifying deal is the deal type's fleet_incentive_per_unit_usd. The fleet unit incentive is rounded to the cent, half up, and credited once to the deal as a payment with payment_method manufacturer_incentive dated the handling date.
    params:
    - fleet_incentive_per_unit_usd
  inputs:
    history:
    - table: purchase_transactions
      aggregate: sum
      field: amount
      within_months: null
      filters:
        charge_code: vehicle_price
    cross_category:
    - service
- id: purchase_ext_fleet_late_balance_fee
  base_policy_refs:
  - purchase_evt_contract_signing
  - purchase_evt_doc_fee
  - purchase_evt_home_delivery
  - purchase_evt_late_balance
  - purchase_evt_returned_payment
  - purchase_evt_exchange
  - purchase_evt_trade_and_equity
  - purchase_combo_fleet_terms
  - purchase_evt_title
  overwrite:
  - base_policy: purchase_evt_late_balance
    superseded_clause: The fee is late_balance_fee_pct_per_month times the balance_due standing at the moment of assessment, rounded to the cent, and never less than late_balance_min_fee_usd; it is posted under charge_code late_balance_fee with the calendar month of assessment as billing_month.
    replaced_by: For a Fleet Vehicle Purchase Agreement whose buyer's service account is not on credit hold this policy sets the late balance fee, and only for such a deal; a fleet deal whose buyer's service account is on credit hold, and every other deal type, keeps the base fee of late_balance_fee_pct_per_month times the balance_due standing at the moment of assessment, rounded to the cent and never less than late_balance_min_fee_usd, together with the base assessment timing, and every late balance fee, this one included, is posted under charge_code late_balance_fee with the calendar month of assessment as billing_month.
  trigger: state_due
  subject:
  - purchase_charge_posted
  computes: fee_amount
  target_tool: post_fleet_late_fee_7ed43dd7
  params:
    standing_good_rate: 0.01
    standing_returned_rate: 0.0175
    credit_use_high_ratio: 0.6
    credit_use_mid_ratio: 0.4
    credit_use_high_addon: 0.0025
    credit_use_mid_addon: 0.001
    prorate_month_days: 30
    part_paid_high_ratio: 0.5
    part_paid_mid_ratio: 0.25
    part_paid_high_share: 0.8
    part_paid_mid_share: 0.9
    early_pay_many_count: 3
    early_pay_many_share: 0.85
    early_pay_some_share: 0.95
    down_high_ratio: 0.1
    down_mid_ratio: 0.04
    down_high_share: 0.85
    down_mid_share: 0.95
  rule: 'For a Fleet Vehicle Purchase Agreement whose buyer''s service account is not on credit hold this policy sets the late balance fee, and only for such a deal; a fleet deal whose buyer''s service account is on credit hold, and every other deal type, keeps the base fee of late_balance_fee_pct_per_month times the balance_due standing at the moment of assessment, rounded to the cent and never less than late_balance_min_fee_usd, together with the base assessment timing, and every late balance fee, this one included, is posted under charge_code late_balance_fee with the calendar month of assessment as billing_month. The fleet late balance fee is fixed only after the home delivery fee posted on the deal has been checked against the fleet home delivery fee and any excess reversed. The fleet late balance fee is not worked out until the manufacturer fleet incentive owed on a qualifying unit stands credited on the deal. The fleet late balance fee for a billing month is the deal type''s late_balance_fee_pct_per_month times the fee basis. The fee basis is the balance_due standing on the deal at assessment. The fleet late balance fee is rounded to the cent, half up, and is never less than the deal type''s late_balance_min_fee_usd; while the balance_due is 0.00 or less no late balance fee is assessed and the minimum does not apply. Any add-on to the monthly rate is added to it first; the resulting rate multiplies the fee basis; each share then multiplies that product in turn; the product is rounded to the cent, and the minimum fee is compared last. The monthly rate follows the buyer''s payment standing: a buyer holding a Commercial Fleet Account - Net 15 or Commercial Fleet Account - Net 30 in active status whose service ledger shows no returned payment in the last 24 whole months before the handling date pays standing_good_rate per month; a buyer holding such an account in active status whose service ledger shows one or more returned payments in those 24 whole months pays standing_returned_rate per month; every other buyer pays the deal type''s late_balance_fee_pct_per_month. A service ledger entry falls in the last 12 or 24 whole months when fewer than that many whole calendar months have passed from its line_date to the handling date (a month is whole once the same day of the month is reached). A fleet buyer drawing on the service account''s open credit pays a credit-use add-on to the monthly rate: where the active service account''s open_balance is more than credit_use_high_ratio of its credit_limit the add-on is credit_use_high_addon; where it is at least credit_use_mid_ratio but not more than credit_use_high_ratio of the credit_limit the add-on is credit_use_mid_addon; below that, or where the account carries no credit limit, there is no add-on. How the fee basis is taken depends on the deal''s late balance fee history: on a deal that carries no earlier late balance fee, the fee basis is the balance_due prorated by the calendar days elapsed after the assessment day (the delivery date plus late_balance_assess_after_days calendar days; none elapsed counts as zero) over prorate_month_days days, never more than the whole balance_due; on a deal that carries an earlier late balance fee and on which the buyer has paid by check, cashier''s check or ACH on a later date than the latest such fee, the fee basis is the balance_due less the earlier late balance fees posted on the deal, net of any part of them already reversed; on any other deal the fee basis is the whole balance_due. An earlier late balance fee counts here once posted, whether or not it was later reversed. A buyer who has paid down the deal earns a part-payment share: the buyer''s own payments on the deal are every payment posted other than an applied deposit (deposit_transfer), lender funding (lender_funding) or a manufacturer incentive (manufacturer_incentive), less any payment returned unpaid; where they total at least part_paid_high_ratio of the cash_price the share is part_paid_high_share; where they total at least part_paid_mid_ratio but less than part_paid_high_ratio of the cash_price the share is part_paid_mid_share; otherwise no part-payment share applies. A buyer who pays service invoices early earns an early-payment record share: where the buyer''s service ledger shows at least early_pay_many_count early-payment discount credits in the last 12 whole months before the handling date the share is early_pay_many_share; where it shows one or more but fewer than early_pay_many_count the share is early_pay_some_share; otherwise no early-payment record share applies. A buyer who put money down on the deal earns a down-payment share: where the deposits applied to the deal at delivery (purchase_deposit_applied entries) total at least down_high_ratio of the vehicle price charged on the deal the share is down_high_share; where they total at least down_mid_ratio but less than down_high_ratio of it the share is down_mid_share; otherwise no down-payment share applies.'
  prerequisite:
  - problem: purchase_ext_fleet_delivery_fee
    kind: value_input
    gate: deal_balance
    form: action
    policy_source: The fleet late balance fee is fixed only after the home delivery fee posted on the deal has been checked against the fleet home delivery fee and any excess reversed.
    fallback_reason: 'The check leaves a record only when it finds an excess: a home delivery fee posted at or below the fleet home delivery fee is left as posted and gets no entry, so a deal whose fee was checked and a deal whose fee was never checked carry the same records; whether an excess exists is the fleet home delivery fee computation itself, not a state any record shows. The dependency can therefore only be stated as the action.'
    condition: the home delivery fee charged on the deal (purchase_charge_posted rows with charge_code home_delivery_fee less purchase_charge_reversed rows with that charge code) is not above the fleet home delivery fee, which is the state the check-and-reverse action leaves.
    resolved_by: reverse_fleet_delivery_fee_7a0a59bd
    effect: deal_balance (balance_due) falls by any excess reversed, which lowers the fee basis and so the late balance fee.
  - problem: purchase_ext_fleet_unit_incentive
    kind: value_input
    gate: deal_balance
    form: state
    policy_source: The fleet late balance fee is not worked out until the manufacturer fleet incentive owed on a qualifying unit stands credited on the deal.
    condition: purchase_transactions holds a purchase_payment_posted row with payment_method manufacturer_incentive for the deal whenever the deal is a qualifying fleet deal.
    resolved_by: credit_fleet_incentive_b735a70c
    effect: deal_balance (balance_due) falls by the fleet unit incentive, which lowers the fee basis and so the late balance fee.
  cross_category:
  - category: service
    as: history
    reads:
    - variant_name
    - status
    - open_balance
    - credit_limit
    - service_ro_lines.event_type
    - service_ro_lines.credit_reason
    - service_ro_lines.line_date
    note: the scope test reads the account status; standing_rate (returned payments 24 months), credit use (open balance over credit limit) and early-payment record (credits 12 months) read the buyer's service account and ledger.
  compute:
  - deal_balance: F('balance_due')
  - credit_hold_account: CFIELD('service', 'variant_name', status='credit_hold')
  - standing_account: CFIELD('service', 'variant_name', status='active')
  - fleet_account_held: standing_account == 'Commercial Fleet Account - Net 15' or standing_account == 'Commercial Fleet Account - Net 30'
  - service_returns_24m: XCOUNT('service', 'service_ro_lines', within_months=24, date_field='line_date', event_type='service_payment_returned')
  - standing_rate: K('standing_good_rate') if (fleet_account_held and service_returns_24m == 0) else (K('standing_returned_rate') if (fleet_account_held and service_returns_24m >= 1) else P('late_balance_fee_pct_per_month'))
  - service_open_balance: CFIELD('service', 'open_balance', status='active')
  - service_credit_limit: CFIELD('service', 'credit_limit', status='active')
  - credit_use_ratio: (service_open_balance / service_credit_limit) if (service_credit_limit != None and service_credit_limit > 0) else 0
  - credit_use_addon: K('credit_use_high_addon') if credit_use_ratio > K('credit_use_high_ratio') else (K('credit_use_mid_addon') if credit_use_ratio >= K('credit_use_mid_ratio') else 0)
  - earlier_late_fee_count: COUNT('purchase_transactions', event_type='purchase_charge_posted', charge_code='late_balance_fee')
  - earlier_late_fee_total: SUM('purchase_transactions', 'amount', event_type='purchase_charge_posted', charge_code='late_balance_fee') - SUM('purchase_transactions', 'amount', event_type='purchase_charge_reversed', charge_code='late_balance_fee')
  - latest_late_fee_date: LATEST('purchase_transactions', 'txn_date', date_field='txn_date', event_type='purchase_charge_posted', charge_code='late_balance_fee')
  - latest_ach_paid: LATEST('purchase_transactions', 'txn_date', date_field='txn_date', event_type='purchase_payment_posted', payment_method='ach')
  - latest_check_paid: LATEST('purchase_transactions', 'txn_date', date_field='txn_date', event_type='purchase_payment_posted', payment_method='check')
  - latest_cashiers_paid: LATEST('purchase_transactions', 'txn_date', date_field='txn_date', event_type='purchase_payment_posted', payment_method='cashiers_check')
  - paid_since_latest_fee: latest_late_fee_date != None and ((latest_ach_paid != None and latest_ach_paid > latest_late_fee_date) or (latest_check_paid != None and latest_check_paid > latest_late_fee_date) or (latest_cashiers_paid != None and latest_cashiers_paid > latest_late_fee_date))
  - days_after_assessment_day: MX(0, DAYS(F('delivery_date'), NOW) - P('late_balance_assess_after_days'))
  - fee_basis: deal_balance * MN(1, days_after_assessment_day / K('prorate_month_days')) if earlier_late_fee_count == 0 else ((deal_balance - earlier_late_fee_total) if paid_since_latest_fee else deal_balance)
  - buyer_payments: SUM('purchase_transactions', 'amount', event_type='purchase_payment_posted') - SUM('purchase_transactions', 'amount', event_type='purchase_payment_posted', payment_method='deposit_transfer') - SUM('purchase_transactions', 'amount', event_type='purchase_payment_posted', payment_method='lender_funding') - SUM('purchase_transactions', 'amount', event_type='purchase_payment_posted', payment_method='manufacturer_incentive') - SUM('purchase_transactions', 'amount', event_type='purchase_payment_returned')
  - part_payment_share: K('part_paid_high_share') if buyer_payments >= K('part_paid_high_ratio') * F('cash_price') else (K('part_paid_mid_share') if buyer_payments >= K('part_paid_mid_ratio') * F('cash_price') else 1)
  - early_pay_credits_12m: XCOUNT('service', 'service_ro_lines', within_months=12, date_field='line_date', event_type='service_line_credited', credit_reason='early_payment_discount')
  - early_pay_share: K('early_pay_many_share') if early_pay_credits_12m >= K('early_pay_many_count') else (K('early_pay_some_share') if early_pay_credits_12m >= 1 else 1)
  - deposits_applied: SUM('purchase_transactions', 'amount', event_type='purchase_deposit_applied')
  - down_price_charged: SUM('purchase_transactions', 'amount', event_type='purchase_charge_posted', charge_code='vehicle_price')
  - down_payment_share: K('down_high_share') if deposits_applied >= K('down_high_ratio') * down_price_charged else (K('down_mid_share') if deposits_applied >= K('down_mid_ratio') * down_price_charged else 1)
  - monthly_rate: standing_rate + credit_use_addon
  - fee_before_rounding: fee_basis * monthly_rate * part_payment_share * early_pay_share * down_payment_share
  - base_scope_fee: MX(P('late_balance_min_fee_usd'), RND(P('late_balance_fee_pct_per_month') * deal_balance + 0.000000001, 2))
  - result: 0 if deal_balance <= 0 else (base_scope_fee if credit_hold_account != None else MX(P('late_balance_min_fee_usd'), RND(fee_before_rounding + 0.000000001, 2)))
  compute_basis:
    deal_balance: The fee basis is the balance_due standing on the deal at assessment.
    credit_hold_account: For a Fleet Vehicle Purchase Agreement whose buyer's service account is not on credit hold this policy sets the late balance fee, and only for such a deal; a fleet deal whose buyer's service account is on credit hold, and every other deal type, keeps the base fee of late_balance_fee_pct_per_month times the balance_due standing at the moment of assessment, rounded to the cent and never less than late_balance_min_fee_usd, together with the base assessment timing, and every late balance fee, this one included, is posted under charge_code late_balance_fee with the calendar month of assessment as billing_month.
