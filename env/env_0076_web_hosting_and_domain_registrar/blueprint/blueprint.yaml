name: env_0076_web_hosting_and_domain_registrar
company: Harborline Hosting & Domains
background: |
  Harborline Hosting & Domains is an ICANN-accredited domain registrar and web host headquartered in Austin, Texas, serving about 1.4 million customer accounts across the United States and Canada through phone, chat and ticket support with a plain-spoken, practical tone.
  Every customer has one Harborline account, held as a Harborline Personal Account, a Harborline Business Account or one of the reseller levels Harborline Reseller Bronze, Harborline Reseller Silver, Harborline Reseller Gold and Harborline Reseller Platinum, and the account carries a prepaid account credit balance that deposits, refunds and service credits add to and purchases draw down.
  Domain names are held one registration at a time under the products .us Domain Registration, .ca Domain Registration, .com Domain Registration, .org Domain Registration, .net Domain Registration, .co Domain Registration and .io Domain Registration, and each registration is billed for registrations, inbound transfers, renewals, auto-renew charges, redemption restores and registry lock years.
  Web hosting is sold as Harborline Starter, Harborline Plus, Harborline Pro and Harborline Business shared plans and the Harborline Cloud 4 and Harborline Cloud 8 cloud plans, each held for one primary domain on a 1, 12, 24 or 36-month term and billed per term, per renewal and per mid-term upgrade.
  SSL/TLS certificates are subscriptions to Harborline DV Single Domain, Harborline DV Multi-Domain, Harborline DV Wildcard, Harborline OV Single Domain, Harborline OV Wildcard, Harborline EV Single Domain or Harborline EV Multi-Domain, issued by a partner certificate authority and reissued within the subscription as each certificate approaches its validity limit.
  Professional email is sold per seat as Harborline Mail Starter, Harborline Mail Plus and Harborline Mail Pro, or as the resold Microsoft 365 Business Basic, Microsoft 365 Business Standard and Microsoft 365 Business Premium, each subscription serving one email domain on an annual or monthly billing plan.
  Developers and agencies also run Harborline VPS 2 GB, Harborline VPS 4 GB, Harborline VPS 8 GB and Harborline VPS 16 GB virtual servers and Harborline Dedicated Standard and Harborline Dedicated Enterprise machines billed per term with add-ons and monthly bandwidth overage, and protect sites with the website security plans Harborline SiteGuard Essentials, Harborline SiteGuard Plus, Harborline SiteGuard Pro, Harborline SiteGuard Business, Harborline SiteGuard Ecommerce and Harborline SiteGuard Enterprise, which scan, clean and shield one site each.
  Every product a customer holds is a live contract with its own lifecycle, and the account's billing history records each charge, refund and credit line by line with its order number and payment method.
  Callers range from hobbyists with a single .com and a Starter plan to small businesses running a domain, a Pro or Business hosting plan, a certificate and a handful of Microsoft 365 seats, up to resellers managing hundreds of client domains from one account.
  Typical history on an account includes auto-renew charges taken from a card or from account credit, reminders and declined renewal attempts, expired domains sliding into grace or redemption, upgrades bought mid-term, mailboxes added and removed, certificates validated and reissued, and refunds or credits issued after earlier disputes, so customers usually call around a renewal date, a failed or unexpected charge, a transfer to or from another registrar, a plan change, an expiring certificate or a lost sign-in.
logs:
  verification_log_table: identity_verifications
  handoff_log_table: support_handoffs
difficulties:
  - name: domain_renewals_and_transfers
    claim:
      categories: [domain]
      event_types: [domain_renewal_charge, domain_restore_charge, domain_refund, domain_expiry_update, domain_grace_renew, domain_restore, domain_auth_code_issue, domain_settings_update, domain_registrant_change, domain_agp_delete, domain_transfer_out_decision]
    summary: >
      Domain holders, from individuals with one .com to resellers with large portfolios, call about expiring or expired names, unexpected auto-renew charges, renewals of several domains at once, restoring a name that slipped into redemption, moving a domain to another registrar, changing the registrant or switching privacy, lock and auto-renew settings, and their situation varies by TLD product, by whether the domain is active, on hold, in grace or in redemption, by how and when it was acquired, by its auto-renew and decline history and by what else they hold with Harborline.
      The records involved are the domain holding with its expiry, lock, registrant and redemption dates, the domain billing lines with their charge types, order numbers and payment methods, the service history of notices, declines and authorisation codes, and the customer's account record, whose tier sets the domain discounts and whose state affects transfers; the governing rules are the per-TLD renewal, restore and refund windows and prices in domain_renewal_pricing, domain_grace_renewal, domain_redemption_restore and domain_refunds, the bulk and tier discount stacking in domain_agg_bulk_renewal, the auto-renew schedule in domain_auto_renew, the transfer locks in domain_outbound_transfer and the change-of-registrant rules in domain_registrant_change_rules.
      In the natural course of the business a registration expires, passes through grace and redemption and is finally deleted, renewals extend from the current expiry, and a transfer runs from code issuance through the gaining registrar's request to completion.
      The agent books renewals, restores, refunds and expiry changes, issues authorisation codes and records settings changes on a verified account, while giving up a name inside its add grace period and approving or rejecting an outbound transfer are the registrant's own decisions that the customer performs.
      Requests no domain rule decides, such as recovering a name already purged and re-registered by a third party, overriding a registry's rejection, or disputes about trademark rights in a name, lie outside policy and call for a POLICY_NOT_COVERED handoff.
  - name: hosting_plans_and_billing
    claim:
      categories: [hosting]
      event_types: [hosting_upgrade_charge, hosting_upgrade, hosting_renewal_charge, hosting_term_renew, hosting_refund, hosting_term_rollback, hosting_cancel_immediate, hosting_cancel_schedule, hosting_cancel_withdraw, hosting_service_charge, hosting_reactivate, hosting_sla_credit, hosting_settings_update]
    summary: >
      Hosting customers call to upgrade a plan that has outgrown its limits, question a renewal price that is far above their introductory price, ask for a refund of an auto-renew charge or a money-back cancellation, reactivate a site suspended for non-payment, overuse or malware, restore files from a backup or claim credit for an outage, and their setting varies with the tier and term, whether the plan is in its first term, how far into the term they are, whether it is active, suspended or scheduled to cancel, and what domains, certificates and other plans they hold.
      The records involved are the hosting plan with its term dates, first-term flag, usage and suspension details, the hosting billing lines that paid each term, the service history of declines, resource notices, uptime reports and restores, any scheduled change request, the domain registered free with the plan and the account tier; the rules are the term pricing and renewal rates in hosting_term_pricing and hosting_renewal, the proration in hosting_upgrade_proration, the money-back guarantee with its bundled-domain deduction and per-customer limit in hosting_money_back and hosting_agg_money_back_limit, the auto-renew refund in hosting_auto_renew_refund, suspension and reactivation in hosting_suspension, restores in hosting_backups and uptime credits in hosting_sla_credits.
      A plan naturally runs from order and provisioning through renewals at the end of each term, with upgrades taking effect at once and downgrades only at renewal.
      The agent bills upgrades, renewals, restores and reactivations, issues refunds, rollbacks and uptime credits, and records auto-renew changes on a verified account, while cancelling a plan immediately or at term end is the customer's own decision that the customer performs.
      Requests no hosting rule decides, such as recovering data after termination, compensation for lost business, or refunds for a term outside every refund rule on grounds of dissatisfaction, require a POLICY_NOT_COVERED handoff.
  - name: ssl_certificate_lifecycle
    claim:
      categories: [ssl]
      event_types: [ssl_purchase_charge, ssl_order, ssl_renewal_charge, ssl_subscription_extend, ssl_names_charge, ssl_names_update, ssl_refund, ssl_revoke, ssl_issuance, ssl_cert_update, ssl_install_charge, ssl_settings_update, ssl_order_cancel]
    summary: >
      Certificate customers call to buy or renew a certificate, add names to a multi-domain certificate, get a reissue after a server move or key compromise, understand why a certificate expires long before their subscription ends, chase a stalled validation, have a certificate installed or obtain a refund, and their setting varies with the validation level and coverage of the product, the subscription and certificate dates, the age of their last domain and organisation validations, whether the covered domain and hosting plan are Harborline's, and their account tier and other orders.
      The records involved are the certificate subscription with its validation and certificate dates, the certificate billing lines, the validation and issuance history, the linked domain holding with its nameservers and registrant change date, the linked hosting plan and the account tier; the rules are pricing and volume stacking in ssl_pricing and ssl_agg_volume_and_org_reuse, validation in ssl_validation, issuance limits and validation reuse in ssl_issuance_and_reissue, renewals in ssl_renewal, added names in ssl_names, refunds in ssl_refunds and installation in ssl_installation.
      A subscription naturally moves from order through validation to its first certificate, then through reissues inside the subscription and renewals that extend its end date.
      The agent places orders and renewals, bills added names and installations, records issuances, validations, refunds and revocations on a verified account, while cancelling an order before issuance is the customer's own decision that the customer performs.
      Requests no certificate rule decides, such as a warranty claim against the certificate authority, issuing for a name the customer cannot validate, or extending a certificate beyond the industry validity limit, require a POLICY_NOT_COVERED handoff.
  - name: professional_email_seats
    claim:
      categories: [email]
      event_types: [email_seat_charge, email_seat_update, email_refund, email_plan_change, email_settings_update, email_cancel_immediate, email_cancel_schedule, email_renewal_charge, email_expired_renew, email_reactivate, email_mailbox_restore]
    summary: >
      Email customers, mostly small businesses, call to add or remove seats, move up to a richer Microsoft 365 or Harborline Mail product, schedule a smaller plan for renewal, cancel shortly after a purchase or renewal, renew an expired subscription, restore a deleted mailbox or get mail flowing again after a suspension, and their setting varies with the product family and tier, the billing plan, how many hours or days have passed since the term began, the seat counts across their subscriptions, the subscription state and the domain the mail runs on.
      The records involved are the email subscription with its seats, billing plan, term and scheduled changes, the email billing lines, the deletion and restore history, the linked domain holding and the account tier; the rules are seat pricing in email_pricing, renewals and instalments in email_renewal_and_instalments, seat additions and the reduction window in email_seat_changes, the combined Microsoft 365 seat cap in email_agg_m365_seat_cap, upgrades and scheduled downgrades in email_plan_changes, cancellation refunds in email_cancellation, retention in email_suspension_and_retention and mailbox restores in email_mailboxes.
      A subscription naturally runs annual or monthly terms in which seats can be added at any time, while reductions and downgrades wait for the renewal unless made inside the window.
      The agent bills seats, upgrades and renewals, records seat counts, scheduled changes, refunds, reactivations and mailbox restores on a verified account, while cancelling a subscription immediately or at term end is the customer's own decision that the customer performs.
      Requests no email rule decides, such as recovering a mailbox deleted beyond retention, Microsoft licensing exceptions, or moving between Harborline Mail and Microsoft 365 without a new subscription, require a POLICY_NOT_COVERED handoff.
  - name: account_credit_and_recovery
    claim:
      categories: [account]
      event_types: [account_credit_deposit, account_credit_apply, account_credit_withdraw, account_credit_refund, account_goodwill_credit, account_balance_sync, account_tier_change, account_security_update, account_unlock, account_close, account_reopen]
    summary: >
      Account holders call to deposit or withdraw account credit, have a refund placed on credit, pay for something from their balance, ask for goodwill after a service failure, move to a reseller tier, regain access after losing their sign-in email or two-factor device, unlock an account after a charge-back, or close or reopen the account, and their setting varies with the account tier and state, the deposits, refunds, credits and purchases on the ledger, the recovery requests on file and every product they still hold in the other categories.
      The records involved are the account with its tier, state, balance, security settings and recovery waiting period, the credit ledger entries with their origins and source references, the account history, the recovery requests, and the customer's domain, hosting, certificate, email, server and security holdings and charges; the rules are deposits in account_deposits, spending order in account_credit_spending, withdrawable amounts and windows in account_withdrawals, goodwill limits in account_goodwill, refund and service credits in account_refund_credit, tier qualification in account_tier_qualification, recovery waiting periods in account_recovery, security changes in account_security_rules, locks in account_chargeback_and_lock and closure in account_closure.
      Credit naturally flows in from deposits, refunds and credits and out through purchases, withdrawals and charge-backs, while recovery runs from request through review and a waiting period to the reset.
      The agent books deposits, credit spending, withdrawals, refund and goodwill credits, tier changes, unlocks, reopenings and applied security changes on a verified account, while closing the account is the holder's own decision that the customer performs.
      Requests no account rule decides, such as cashing out goodwill or refund credit, transferring credit to another customer's account, releasing a recovery hold early, or resolving a bank dispute on the bank's behalf, require a POLICY_NOT_COVERED handoff.
