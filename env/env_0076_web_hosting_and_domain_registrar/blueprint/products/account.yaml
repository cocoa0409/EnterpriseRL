events:
- type: account_open
  target: account_holdings
  mutation: create
  meaning: A person or business signs up for a Harborline account.
  grain: One row per account sign-up.
  fields:
    variant_name: Harborline Personal Account or Harborline Business Account at sign-up; reseller tiers are reached
      only by tier change.
    login_email: Sign-in email chosen at sign-up, verbatim.
    two_factor: Two-factor method at sign-up (none unless set up during sign-up).
    credit_balance: 0.00 at sign-up.
    opened_date: Sign-up date.
  triggers: []
- type: account_activate
  target: account_holdings
  mutation:
    transition:
      from: unverified
      to: active
  meaning: The sign-up verification email is confirmed.
  grain: One row per transaction.
  fields:
    opened_date: Unchanged.
  triggers: []
- type: account_purge_unverified
  target: account_holdings
  mutation:
    transition:
      from: unverified
      to: closed
  meaning: An account never confirmed within the verification window is purged.
  grain: One row per transaction.
  fields:
    closed_date: Purge date.
  triggers: []
- type: account_recovery_hold
  target: account_holdings
  mutation:
    transition:
      from: active
      to: recovery_hold
  meaning: An approved recovery request places the account in its recovery waiting period.
  grain: One row per transaction.
  fields:
    recovery_hold_until: 'Moment the waiting period ends: the approval moment plus the tier''s recovery_hold_hours.'
  triggers:
  - event: account:account_security_notice
    map:
      notice_kind: recovery_approved
- type: account_recovery_release
  target: account_holdings
  mutation:
    transition:
      from: recovery_hold
      to: active
  meaning: The recovery waiting period ends and the approved reset takes effect.
  grain: One row per transaction.
  fields:
    recovery_hold_until: Cleared to empty.
  triggers:
  - event: account:account_security_update
- type: account_lock
  target: account_holdings
  mutation:
    transition:
      from: active
      to: locked
  meaning: The account is locked after a charge-back or a suspected compromise.
  grain: One row per transaction.
  fields:
    lock_reason: chargeback or suspected_compromise.
  triggers: []
- type: account_unlock
  target: account_holdings
  mutation:
    transition:
      from: locked
      to: active
  meaning: A locked account is unlocked once its cause is resolved.
  grain: One row per transaction.
  fields:
    lock_reason: Reset to none.
  triggers: []
- type: account_close
  target: account_holdings
  mutation:
    transition:
      from: active
      to: closed
  meaning: The account holder closes the account.
  grain: One row per transaction.
  fields:
    closed_date: Closure date.
  triggers: []
- type: account_reopen
  target: account_holdings
  mutation:
    transition:
      from: closed
      to: active
  meaning: A closed account is reopened inside the reopening window.
  grain: One row per transaction.
  fields:
    closed_date: Cleared to empty.
  triggers: []
- type: account_tier_change
  target: account_holdings
  mutation: update
  meaning: The account moves to another tier after an application, an automatic review or a downgrade.
  grain: One row per tier change.
  fields:
    variant_name: New official tier name.
    tier_changed_date: Date of this tier change.
  triggers: []
- type: account_security_update
  target: account_holdings
  mutation: update
  meaning: The sign-in email or the two-factor method on the account changes, either by the holder or by an applied
    recovery.
  grain: One row per security setting change.
  fields:
    login_email: Sign-in email after the change, verbatim.
    two_factor: Two-factor method after the change.
    last_security_change_date: Date of this change.
  triggers:
  - event: account:account_security_notice
    map:
      notice_kind: security_change
- type: account_balance_sync
  target: account_holdings
  mutation: update
  meaning: The account's credit balance view is brought to the sum of all its credit ledger entries after a new
    entry.
  grain: One row per ledger entry posted.
  fields:
    credit_balance: 'New balance: the previous balance plus the signed amount of the entry just posted.'
  triggers: []
- type: account_credit_deposit
  target: account_credit_ledger
  meaning: The customer deposits funds into account credit.
  grain: One row per deposit transaction.
  distinguish_by:
  - entry_date
  - funding_method
  - amount
  fields:
    amount: Deposited amount, USD, positive.
    entry_date: Deposit date.
    funding_method: card, paypal or bank_transfer.
    credit_origin: Set to deposit.
  account: account_credit
  direction: in
  triggers:
  - event: account:account_balance_sync
- type: account_credit_refund
  target: account_credit_ledger
  meaning: A refund of a product charge is credited to account credit at the customer's election or because the
    charge was paid from credit.
  grain: One row per refunded product charge.
  distinguish_by:
  - source_charge_ref
  fields:
    customer_id: Customer credited.
    amount: Refunded amount, USD, positive.
    entry_date: Date credited.
    source_category: Category of the refunded charge.
    source_charge_ref: Reference number of the refunded product charge.
    credit_origin: Set to refund.
  account: account_credit
  direction: in
  triggers:
  - event: account:account_balance_sync
- type: account_service_credit
  target: account_credit_ledger
  meaning: A contractual service credit, such as a hosting uptime credit, is added to account credit.
  grain: One row per service credit issued by a product.
  distinguish_by:
  - source_charge_ref
  fields:
    customer_id: Customer credited.
    amount: Credited amount, USD, positive.
    entry_date: Date credited.
    source_category: Category issuing the credit.
    source_charge_ref: Reference number of the product credit line.
    credit_origin: Set to service_credit.
  account: account_credit
  direction: in
  triggers:
  - event: account:account_balance_sync
- type: account_goodwill_credit
  target: account_credit_ledger
  meaning: Support grants goodwill credit for a documented Harborline service failure.
  grain: One row per goodwill grant.
  distinguish_by:
  - entry_date
  - source_charge_ref
  fields:
    amount: Granted amount, USD, positive.
    entry_date: Grant date.
    source_category: Category of the product affected by the service failure.
    source_charge_ref: Reference number of the affected product holding or charge the failure concerned.
    credit_origin: Set to goodwill.
  account: account_credit
  direction: in
  triggers:
  - event: account:account_balance_sync
- type: account_credit_apply
  target: account_credit_ledger
  meaning: Account credit pays for a Harborline purchase, renewal or auto-renew charge.
  grain: One row per product charge paid from credit.
  distinguish_by:
  - source_charge_ref
  fields:
    customer_id: Customer whose credit pays the charge.
    amount: Amount applied, USD, negative.
    entry_date: Date applied.
    source_category: Category of the charge paid.
    source_charge_ref: Reference number of the product charge paid.
    credit_origin: Set to purchase.
  account: account_credit
  direction: out
  triggers:
  - event: account:account_balance_sync
- type: account_credit_withdraw
  target: account_credit_ledger
  meaning: Unused deposited credit is returned to the deposit's original payment method.
  grain: One row per withdrawal against one deposit.
  distinguish_by:
  - original_credit_entry_id
  fields:
    amount: Amount withdrawn, USD, negative.
    entry_date: Withdrawal date.
    original_credit_entry_id: Reference of the deposit being withdrawn.
    funding_method: Original method of that deposit.
    credit_origin: Set to withdrawal.
  account: account_credit
  direction: out
  triggers:
  - event: account:account_balance_sync
- type: account_chargeback_debit
  target: account_credit_ledger
  meaning: A card or PayPal deposit is charged back by the payer's bank and the disputed amount plus the charge-back
    fee is debited from credit.
  grain: One row per charged-back deposit.
  distinguish_by:
  - original_credit_entry_id
  fields:
    amount: Debited amount, USD, negative (disputed amount plus fee); the balance may go below zero.
    entry_date: Date of the charge-back notice.
    original_credit_entry_id: Reference of the charged-back deposit.
    funding_method: Method of the charged-back deposit.
    credit_origin: Set to chargeback.
  account: account_credit
  direction: out
  triggers:
  - event: account:account_balance_sync
  - event: account:account_lock
    map:
      lock_reason: chargeback
- type: account_security_notice
  target: account_events
  meaning: A security notice is emailed to the account's previous and current sign-in emails.
  grain: One row per notice sent.
  distinguish_by:
  - notice_kind
  - event_at
  fields:
    notice_kind: security_change, recovery_approved, recovery_rejected or lockout.
    event_at: Moment sent.
  triggers: []
- type: account_login_lockout
  target: account_events
  meaning: Repeated failed sign-ins trigger a temporary sign-in lockout.
  grain: One row per lockout.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment the lockout began.
    lockout_ends_at: Moment the lockout ends.
  triggers:
  - event: account:account_security_notice
    map:
      notice_kind: lockout
- type: account_tier_review
  target: account_events
  meaning: The automatic tier qualification review records its result.
  grain: One row per review.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment of the review.
    review_result: qualified, grace_started or downgrade_due.
  triggers:
  - event: account:account_tier_change
    when:
      review_result: downgrade_due
measures:
- id: account_msr_deposits_365d
  window: Trailing 365 calendar days ending today, today included.
  measure: Sum of amount over account_credit_deposit entries of the account with entry_date in the window, less
    the deposit amount of any of those deposits that has an account_chargeback_debit entry.
- id: account_msr_goodwill_365d
  window: Trailing 365 calendar days ending today, today included.
  measure: Sum of amount over account_goodwill_credit entries of the account with entry_date in the window.
- id: account_msr_recovery_requests_30d
  window: Trailing 30 calendar days ending today, today included.
  measure: Count of account_recovery_requests rows of the account whose submitted_at date falls in the window, whatever
    their outcome.
- id: account_msr_withdrawable_deposit
  window: All credit ledger entries of the account up to now.
  measure: 'For one deposit: the remaining deposited credit (credit_balance minus the unspent non-cash credit, where
    unspent non-cash credit is the sum of refund, service credit and goodwill entries less the sum of purchase entries,
    floored at zero) allocated to deposits newest first, capped at that deposit''s amount less any withdrawal already
    made against it, and zero for a deposit older than withdrawal_window_days.'
policies:
- id: account_agg_multi_holding
  subject:
  - account_open
  rule: Each customer profile has exactly one Harborline account, which holds every product the customer buys. A
    new account may be opened only when the customer has no account in any status, and a closed account is reopened
    rather than replaced.
  eligibility:
  - id: one_account_per_customer
    applies_to:
    - account_open
    kind: dedup
    condition: A new account may be opened only when the customer has no account in any status, and a closed account
      is reopened rather than replaced.
    evidence_fields:
    - account_holdings.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.customer_id
      action_bindings:
        account_holdings.customer_id: customer_id
    dedup_contract:
      table: account_holdings
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - unverified
        - active
        - recovery_hold
        - locked
        - closed
      distinct_fields: []
  params:
    max_per_customer: 1
- id: account_tier_qualification
  subject:
  - account_tier_change
  - account_tier_review
  rule: 'A tier change may be made only while the account status is active. An account qualifies for a tier when
    its customer profile meets tier_requires_business_profile, the Harborline Reseller Agreement is accepted where
    reseller_agreement_required is true, and account_msr_deposits_365d is at least the tier''s tier_min_deposits_365d.
    An upgrade takes effect on the day it is requested and qualified, and a request for a tier the account does
    not qualify for is declined without any change. Every tier_review_cycle_days after the tier_changed_date the
    tier is reviewed: a qualifying account keeps its tier and restarts the cycle, while a non-qualifying account
    keeps its tier for tier_downgrade_grace_days and, if still not qualified when that grace ends, moves down to
    the highest tier it qualifies for. A business profile never drops below Harborline Business Account and an individual
    profile is always Harborline Personal Account. A tier change never re-prices charges already billed; the new
    tier''s figures apply from the next charge.'
  eligibility:
  - id: tier_change_active
    applies_to:
    - account_tier_change
    kind: state
    condition: A tier change may be made only while the account status is active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Harborline Personal Account:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Business Account:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Reseller Bronze:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Reseller Silver:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Reseller Gold:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Reseller Platinum:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
  formula:
    qualifies: account_msr_deposits_365d >= tier_min_deposits_365d
  measures:
  - account_msr_deposits_365d
- id: account_tier_benefits
  subject:
  - account_tier_change
  rule: The account tier sets the percentage discounts each product's pricing rule applies (domain_registration_discount_pct,
    domain_renewal_discount_pct, hosting_discount_pct, ssl_discount_pct, email_discount_pct, server_discount_pct,
    security_discount_pct), together with team, API, support and credit limits. A tier discount applies to the list
    or renewal price component of a charge only; it never applies to ICANN fees, domain restore fees, setup fees,
    proration lines, refunds or Microsoft 365 seats. When a product's own promotion or volume discount could also
    apply to the same price component, only the single higher percentage applies and percentages are never added
    or compounded. Discounted components are rounded half up to the cent (credit_rounding) before fees are added.
    Benefits follow the tier recorded on the account on the charge date.
  eligibility: []
  params:
    per_tier:
      Harborline Personal Account:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Business Account:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Reseller Bronze:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Reseller Silver:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Reseller Gold:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Reseller Platinum:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
- id: account_deposits
  subject:
  - account_credit_deposit
  - account_balance_sync
  rule: A deposit may be accepted only while the account status is active. A single deposit must be at least min_deposit_amount
    and at most max_deposit_per_transaction, must use one of the tier's deposit_methods, and a bank transfer must
    be at least bank_transfer_min_amount. A deposit that would raise credit_balance above max_credit_balance is
    refused in full, never accepted in part. After every credit ledger entry the account's credit_balance is set
    to the previous balance plus the entry's signed amount, so it always equals the sum of the account's ledger
    entries. Deposited credit never expires and carries no interest.
  eligibility:
  - id: deposit_active
    applies_to:
    - account_credit_deposit
    kind: state
    condition: A deposit may be accepted only while the account status is active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
  formula:
    new_balance: credit_balance + amount
- id: account_credit_spending
  subject:
  - account_credit_apply
  rule: Account credit may pay for a charge only while the account status is active or recovery_hold. Credit pays
    a charge only when credit_balance covers the whole charge, since credit_partial_application_allowed is false,
    and otherwise the charge goes to the default card in full. Every auto-renew charge in any category tries credit
    first where credit_first_for_auto_renew is true, while for a purchase made in conversation credit is used only
    when the customer chooses it. Spending consumes refund, service and goodwill credit before deposited credit,
    and deposited credit oldest deposit first. Each paid charge is recorded once, with the reference number of the
    product charge it paid.
  eligibility:
  - id: spend_status
    applies_to:
    - account_credit_apply
    kind: state
    condition: Account credit may pay for a charge only while the account status is active or recovery_hold.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
      - recovery_hold
  - id: one_application_per_charge
    applies_to:
    - account_credit_apply
    kind: dedup
    condition: Each paid charge is recorded once, with the reference number of the product charge it paid.
    evidence_fields:
    - account_credit_ledger.source_charge_ref
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.source_charge_ref
      action_bindings:
        account_credit_ledger.source_charge_ref: source_charge_ref
    dedup_contract:
      table: account_credit_ledger
      mode: separate_record
      object_bindings:
        source_charge_ref: source_charge_ref
      duplicate_filters:
        credit_origin:
        - purchase
      distinct_fields: []
- id: account_withdrawals
  subject:
  - account_credit_withdraw
  rule: A withdrawal may be made only while the account status is active. A withdrawal returns unused deposited
    credit from one deposit to that deposit's original payment method, and each deposit may be withdrawn against
    only once. A deposit may be withdrawn only on or before the entry date of the deposit being withdrawn plus withdrawal_window_days
    calendar days. The window adds whole calendar days to the deposit date, counting the day after the deposit as
    day 1, and the last day is included. The amount withdrawn is the deposit's account_msr_withdrawable_deposit,
    and a withdrawal below withdrawal_min_amount is not made. Credit that came from refunds, service credits or
    goodwill is never withdrawable (refund_credit_withdrawable, goodwill_credit_withdrawable), and bank transfer
    deposits are returned by bank transfer. The funds reach the payment method within withdrawal_processing_business_days
    business days, counted Monday to Friday excluding US federal holidays.
  eligibility:
  - id: withdraw_active
    applies_to:
    - account_credit_withdraw
    kind: state
    condition: A withdrawal may be made only while the account status is active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
  - id: one_withdrawal_per_deposit
    applies_to:
    - account_credit_withdraw
    kind: dedup
    condition: A withdrawal returns unused deposited credit from one deposit to that deposit's original payment
      method, and each deposit may be withdrawn against only once.
    evidence_fields:
    - account_credit_ledger.original_credit_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.original_credit_entry_id
      action_bindings:
        account_credit_ledger.original_credit_entry_id: original_credit_entry_id
    dedup_contract:
      table: account_credit_ledger
      mode: separate_record
      object_bindings:
        original_credit_entry_id: original_credit_entry_id
      duplicate_filters:
        credit_origin:
        - withdrawal
        - chargeback
      distinct_fields: []
  - id: withdrawal_window
    applies_to:
    - account_credit_withdraw
    kind: time
    condition: A deposit may be withdrawn only on or before the entry date of the deposit being withdrawn plus withdrawal_window_days
      calendar days.
    evidence_fields:
    - account_credit_ledger.credit_entry_id
    - account_credit_ledger.entry_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.credit_entry_id
      action_bindings:
        account_credit_ledger.credit_entry_id: original_credit_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the entry date of the deposit being withdrawn
      anchor_source: account_credit_ledger.entry_date
      relation: not_after
      duration_source: variants.withdrawal_window_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the deposit date, counting the day after the deposit
        as day 1, and the last day is included.
      boundary: inclusive
  measures:
  - account_msr_withdrawable_deposit
- id: account_goodwill
  subject:
  - account_goodwill_credit
  rule: Goodwill credit may be granted only while the account status is active. Goodwill credit may be granted only
    for a Harborline service failure that is shown in the customer's records, such as a provisioning that missed
    its deadline or a duplicate charge, never for an outage already credited under a product's uptime rule, and
    never for the customer's own missed renewal or deadline. One grant may be made per affected holding or charge
    reference. A grant may not exceed the tier's goodwill_max_per_case, nor bring account_msr_goodwill_365d above
    goodwill_max_per_365d, and a request beyond either limit is granted only up to the remaining limit. Goodwill
    credit is spendable on any Harborline product but is never withdrawable.
  eligibility:
  - id: goodwill_active
    applies_to:
    - account_goodwill_credit
    kind: state
    condition: Goodwill credit may be granted only while the account status is active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
  - id: one_grant_per_reference
    applies_to:
    - account_goodwill_credit
    kind: dedup
    condition: One grant may be made per affected holding or charge reference.
    evidence_fields:
    - account_credit_ledger.source_charge_ref
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.source_charge_ref
      action_bindings:
        account_credit_ledger.source_charge_ref: source_charge_ref
    dedup_contract:
      table: account_credit_ledger
      mode: separate_record
      object_bindings:
        source_charge_ref: source_charge_ref
      duplicate_filters:
        credit_origin:
        - goodwill
      distinct_fields: []
  formula:
    grant: min(goodwill_max_per_case, goodwill_max_per_365d - account_msr_goodwill_365d)
  measures:
  - account_msr_goodwill_365d
- id: account_refund_credit
  subject:
  - account_credit_refund
  - account_service_credit
  rule: A refund is credited to account credit when the product rule allows it and the customer elects credit, or
    always when the refunded charge was itself paid from credit. A refund may be credited only while the account
    status is active, recovery_hold or locked, and a refund due on a closed account goes to the original payment
    method instead. The credited amount equals the refunded amount of the product charge, unchanged by any tier
    figure. Each refunded product charge is credited only once. A contractual service credit issued by a product
    rule, such as a hosting uptime credit, is added for exactly the amount that rule computes and is likewise posted
    once per product credit line.
  eligibility:
  - id: credit_refund_status
    applies_to:
    - account_credit_refund
    kind: state
    condition: A refund may be credited only while the account status is active, recovery_hold or locked, and a
      refund due on a closed account goes to the original payment method instead.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
      - recovery_hold
      - locked
  - id: one_credit_per_refund
    applies_to:
    - account_credit_refund
    kind: dedup
    condition: Each refunded product charge is credited only once.
    evidence_fields:
    - account_credit_ledger.source_charge_ref
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.source_charge_ref
      action_bindings:
        account_credit_ledger.source_charge_ref: source_charge_ref
    dedup_contract:
      table: account_credit_ledger
      mode: separate_record
      object_bindings:
        source_charge_ref: source_charge_ref
      duplicate_filters:
        credit_origin:
        - refund
      distinct_fields: []
- id: account_recovery
  subject:
  - account_recovery_hold
  - account_recovery_release
  - account_security_notice
  rule: 'A customer who has lost access to the sign-in email or the two-factor method may request recovery through
    one of the tier''s recovery_methods: email_link to the profile contact email, pin_and_card proving the support
    PIN together with the last four card digits and billing postal code, or government_id reviewed by Trust and
    Safety. A recovery request may be submitted only when account_msr_recovery_requests_30d is below max_recovery_requests_30d
    and no rejection was decided in the last recovery_rejection_cooldown_days calendar days. Trust and Safety decides
    each request within recovery_review_business_days business days, counted Monday to Friday excluding US federal
    holidays, and an approved request puts the account in recovery_hold. The approved reset may take effect only
    at or after the moment the recovery request was approved plus recovery_hold_hours elapsed hours. The hold is
    counted in full 24-hour periods of elapsed time from the approval moment, never in calendar days. During recovery_hold
    the holder cannot change security settings, withdraw credit, close the account or obtain a domain authorisation
    code, while renewals and auto-renew charges continue. A request withdrawn by the holder before the hold ends
    releases the hold without applying the reset, and every approval, rejection and applied reset is notified to
    the previous and current sign-in emails where security_notice_to_previous_email is true.'
  eligibility:
  - id: hold_elapsed
    applies_to:
    - account_recovery_release
    kind: time
    condition: The approved reset may take effect only at or after the moment the recovery request was approved
      plus recovery_hold_hours elapsed hours.
    evidence_fields:
    - account_recovery_requests.outcome
    - account_recovery_requests.recovery_request_id
    - account_recovery_requests.decided_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_recovery_requests.recovery_request_id
      action_bindings:
        account_recovery_requests.recovery_request_id: recovery_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the recovery request was approved
      anchor_source: account_recovery_requests.decided_at
      relation: not_before
      duration_source: variants.recovery_hold_hours
      unit: elapsed_hours
      counting_rule: The hold is counted in full 24-hour periods of elapsed time from the approval moment, never
        in calendar days.
      boundary: inclusive
  measures:
  - account_msr_recovery_requests_30d
- id: account_security_rules
  subject:
  - account_security_update
  - account_login_lockout
  rule: The holder may change the sign-in email or the two-factor method only while the account status is active.
    On a tier where two_factor_required is true the holder may not switch two-factor to none, and a recovery that
    removed it obliges the holder to enrol a new method at the next sign-in before any purchase. Every change is
    notified to the previous sign-in email where security_notice_to_previous_email is true. failed_login_threshold
    consecutive failed sign-ins start a temporary lockout of login_lockout_minutes, which does not change the account
    status and ends by itself.
  eligibility:
  - id: security_change_active
    applies_to:
    - account_security_update
    kind: state
    condition: The holder may change the sign-in email or the two-factor method only while the account status is
      active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
- id: account_chargeback_and_lock
  subject:
  - account_chargeback_debit
  - account_lock
  - account_unlock
  rule: When a card or PayPal deposit is charged back, its disputed amount plus chargeback_fee is debited from credit
    even if the balance goes below zero, and the account is locked where chargeback_locks_account is true. Trust
    and Safety may also lock an account for a suspected compromise. A charge-back lock may be lifted only when the
    account's credit balance is zero or above or the payer's bank has withdrawn the dispute. A suspected-compromise
    lock is lifted only after the caller passes identity verification and the sign-in password has been reset. While
    locked, no purchase, deposit, withdrawal or goodwill can be made, but refunds may still be credited and existing
    products keep running.
  eligibility:
  - id: chargeback_repaid
    applies_to:
    - account_unlock
    kind: authorization
    condition: A charge-back lock may be lifted only when the account's credit balance is zero or above or the payer's
      bank has withdrawn the dispute.
    evidence_fields:
    - account_holdings.credit_balance
    - account_holdings.lock_reason
    - account_holdings.account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
- id: account_closure
  subject:
  - account_close
  - account_reopen
  - account_purge_unverified
  - account_activate
  - account_open
  rule: An account may be closed only when every domain holding of the customer is deleted, transferred_out or cancelled.
    An account may be closed only when every hosting plan of the customer is cancelled or terminated. An account
    may be closed only when every certificate subscription of the customer is expired, revoked or cancelled. An
    account may be closed only when every email subscription of the customer is cancelled. An account may be closed
    only when every server of the customer is cancelled or terminated. An account may be closed only when every
    website security plan of the customer is cancelled, as closure_requires_no_live_holdings requires for every
    product. At closure the unused deposited credit is returned to the original payment methods where closure_refunds_deposit_credit
    is true, and refund, service and goodwill credit is forfeited. A closed account may be reopened only on or before
    the closure date plus closure_reopen_window_days calendar days. The window adds whole calendar days to the closure
    date, counting the day after closure as day 1, and the last day is included. A new sign-up must confirm its
    verification email within email_verification_link_hours of the link being sent, and an account still unverified
    unverified_purge_days after sign-up is purged.
  eligibility:
  - id: no_live_domains
    applies_to:
    - account_close
    kind: state
    condition: An account may be closed only when every domain holding of the customer is deleted, transferred_out
      or cancelled.
