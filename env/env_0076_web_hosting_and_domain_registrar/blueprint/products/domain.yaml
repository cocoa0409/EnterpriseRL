events:
- type: domain_register
  target: domain_holdings
  mutation: create
  meaning: A customer orders a new registration of an available domain name through Harborline.
  grain: One row per domain registration order line (one domain name).
  fields:
    domain_name: Fully qualified domain name being registered, lowercase, as the customer spelled it.
    variant_name: Official TLD registration product matching the domain's extension.
    acquisition_type: Set to new_registration.
    registered_date: Date of the registration order (today).
    expiry_date: Registration date plus the registered years.
    auto_renew: Initial auto-renew setting (the TLD default unless the customer asks otherwise).
    privacy_enabled: Initial WHOIS privacy setting.
    transfer_lock: Initial registrar transfer lock setting.
    registrant_name: Registrant contact name, verbatim.
    registrant_org: Registrant organisation, verbatim; empty for individuals.
    bundled_hosting_id: Hosting plan whose free-domain entitlement covers this registration; null when paid.
  triggers:
  - event: domain:domain_purchase_charge
    map:
      charge_type: registration
- type: domain_transfer_in
  target: domain_holdings
  mutation: create
  meaning: A customer submits an inbound transfer of a domain registered elsewhere, supplying its authorisation
    code.
  grain: One row per inbound transfer request (one domain name).
  fields:
    domain_name: Domain name being transferred in, lowercase.
    variant_name: Official TLD registration product matching the domain's extension.
    acquisition_type: Set to transfer_in.
    registered_date: Date the transfer order was placed (today).
    expiry_date: Expiry date currently on record at the registry, before the transfer extension.
    auto_renew: Initial auto-renew setting.
    privacy_enabled: Initial WHOIS privacy setting.
    registrant_name: Registrant contact name, verbatim.
    registrant_org: Registrant organisation, verbatim; empty for individuals.
  triggers:
  - event: domain:domain_purchase_charge
    map:
      charge_type: transfer_in
- type: domain_activate
  target: domain_holdings
  mutation:
    transition:
      from: pending
      to: active
  meaning: The registry confirms the registration or the inbound transfer completes.
  grain: One row per transaction.
  fields:
    registered_date: For a new registration the registration date; unchanged for a transfer.
    transfer_in_date: Completion date of an inbound transfer; left empty for a new registration.
    expiry_date: For a transfer, the prior expiry plus the transfer extension.
  triggers: []
- type: domain_cancel
  target: domain_holdings
  mutation:
    transition:
      from: pending
      to: cancelled
  meaning: A registration is rejected by the registry, or an inbound transfer is rejected or times out.
  grain: One row per transaction.
  fields:
    closed_date: Date the order was cancelled.
  triggers:
  - event: domain:domain_refund
    map:
      refund_destination: original_payment_method
- type: domain_hold
  target: domain_holdings
  mutation:
    transition:
      from: active
      to: on_hold
  meaning: The registrant verification deadline passes unverified and the domain is put on registrar hold.
  grain: One row per transaction.
  fields:
    registrant_verified: Remains false.
  triggers: []
- type: domain_release_hold
  target: domain_holdings
  mutation:
    transition:
      from: on_hold
      to: active
  meaning: The registrant verifies the contact details and the registrar hold is lifted.
  grain: One row per transaction.
  fields:
    registrant_verified: Set to true.
  triggers: []
- type: domain_expire
  target: domain_holdings
  mutation:
    transition:
    - from: active
      to: grace
    - from: on_hold
      to: grace
  meaning: The expiry date passes without a renewal and the domain enters the renewal grace period.
  grain: One row per transaction.
  fields:
    expiry_date: Unchanged; the date that passed.
  triggers:
  - event: domain:domain_expiry_notice
    map:
      notice_kind: post_expiry
- type: domain_grace_renew
  target: domain_holdings
  mutation:
    transition:
      from: grace
      to: active
  meaning: A renewal charged during the grace period reactivates the domain.
  grain: One row per transaction.
  fields:
    expiry_date: Original expiry plus the renewed years.
  triggers: []
- type: domain_enter_redemption
  target: domain_holdings
  mutation:
    transition:
      from: grace
      to: redemption
  meaning: The grace period ends unrenewed and the registry places the domain in redemption.
  grain: One row per transaction.
  fields:
    redemption_date: Date the domain entered redemption.
  triggers: []
- type: domain_restore
  target: domain_holdings
  mutation:
    transition:
      from: redemption
      to: active
  meaning: A paid restore brings the domain back out of redemption.
  grain: One row per transaction.
  fields:
    expiry_date: Original expiry plus the renewal years included in the restore.
    redemption_date: Cleared to empty once restored.
  triggers: []
- type: domain_pending_delete
  target: domain_holdings
  mutation:
    transition:
      from: redemption
      to: pending_delete
  meaning: The redemption period ends unrestored and the registry schedules the name for deletion.
  grain: One row per transaction.
  fields:
    redemption_date: Unchanged.
  triggers: []
- type: domain_purge
  target: domain_holdings
  mutation:
    transition:
      from: pending_delete
      to: deleted
  meaning: The registry purges the name and the holding is closed.
  grain: One row per transaction.
  fields:
    closed_date: Date the name was purged.
  triggers: []
- type: domain_agp_delete
  target: domain_holdings
  mutation:
    transition:
      from: active
      to: deleted
  meaning: The registrant deletes a newly registered domain inside the add grace period, giving up the name for
    a refund.
  grain: One row per transaction.
  fields:
    closed_date: Date of the deletion.
  triggers:
  - event: domain:domain_refund
    map:
      charge_type: registration
- type: domain_transfer_out
  target: domain_holdings
  mutation:
    transition:
    - from: active
      to: transferred_out
    - from: grace
      to: transferred_out
  meaning: An outbound transfer to another registrar completes and Harborline no longer manages the domain.
  grain: One row per transaction.
  fields:
    closed_date: Date the transfer completed.
  triggers: []
- type: domain_expiry_update
  target: domain_holdings
  mutation: update
  meaning: The registration expiry date moves because a renewal or restore was charged, or a renewal was refunded
    and rolled back.
  grain: One row per expiry change.
  fields:
    expiry_date: 'New expiry date: extended by the renewed years, or reduced by the years of a refunded renewal.'
  triggers: []
- type: domain_verification_update
  target: domain_holdings
  mutation: update
  meaning: The domain's registrant verification flag is set once the registrant confirms the verification email.
  grain: One row per verification flag change.
  fields:
    registrant_verified: Set to true.
  triggers: []
- type: domain_settings_update
  target: domain_holdings
  mutation: update
  meaning: 'The registrant changes a domain setting: auto-renew, WHOIS privacy, registrar transfer lock, registry
    lock or nameservers.'
  grain: One row per settings change.
  fields:
    auto_renew: Auto-renew switch after the change.
    privacy_enabled: WHOIS privacy switch after the change.
    transfer_lock: Registrar transfer lock after the change.
    registry_lock: Registry lock after the change.
    nameservers: Nameserver set after the change.
  triggers: []
- type: domain_registrant_change
  target: domain_holdings
  mutation: update
  meaning: The registrant name or organisation on the domain is changed (a change of registrant).
  grain: One row per change of registrant.
  fields:
    registrant_name: New registrant name, verbatim.
    registrant_org: New registrant organisation, verbatim.
    last_registrant_change_date: Date of this change.
    change_lock_opt_out: Whether the registrant opted out of the change-of-registrant transfer lock at this change.
    registrant_verified: Reset to false where the TLD requires verification.
  triggers: []
- type: domain_purchase_charge
  target: domain_charges
  meaning: A new registration or an inbound transfer is billed.
  grain: One row per billed registration or transfer order line.
  distinguish_by:
  - charge_type
  - charge_date
  - order_ref
  fields:
    charge_type: registration or transfer_in.
    amount: Amount billed, USD, positive.
    years: Registration years covered.
    charge_date: Date billed.
    order_ref: Harborline order number the line belongs to.
    payment_method: 'Funding source: card, paypal, account_credit or bundle_credit.'
  account: domain_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: domain_renewal_charge
  target: domain_charges
  meaning: 'A renewal is billed: a manual renewal, an auto-renew charge or a renewal during the grace period.'
  grain: One row per billed renewal of one domain.
  distinguish_by:
  - charge_type
  - charge_date
  - order_ref
  fields:
    charge_type: renewal, auto_renew or grace_renewal.
    amount: Amount billed, USD, positive.
    years: Years renewed.
    charge_date: Date billed.
    order_ref: Harborline order number (one order may renew several domains).
    payment_method: 'Funding source: card, paypal or account_credit.'
  account: domain_billed
  direction: in
  triggers:
  - event: domain:domain_expiry_update
    when:
      charge_type:
      - renewal
      - auto_renew
  - event: domain:domain_grace_renew
    when:
      charge_type: grace_renewal
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: domain_restore_charge
  target: domain_charges
  meaning: A redemption restore is billed (restore fee plus the mandatory renewal year).
  grain: One row per billed restore.
  distinguish_by:
  - charge_date
  - order_ref
  fields:
    charge_type: restore.
    amount: Amount billed, USD, positive.
    years: Renewal years included.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: 'Funding source: card, paypal or account_credit.'
  account: domain_billed
  direction: in
  triggers:
  - event: domain:domain_restore
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: domain_lock_charge
  target: domain_charges
  meaning: The annual registry lock service is billed.
  grain: One row per billed registry lock year.
  distinguish_by:
  - charge_date
  - order_ref
  fields:
    charge_type: registry_lock.
    amount: Amount billed, USD, positive.
    years: Service years covered.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: 'Funding source: card, paypal or account_credit.'
  account: domain_billed
  direction: in
  triggers:
  - event: domain:domain_settings_update
    map:
      registry_lock: true
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: domain_refund
  target: domain_charges
  meaning: A previously billed domain charge is refunded in full.
  grain: One row per refunded original charge.
  distinguish_by:
  - original_domain_charge_id
  fields:
    original_domain_charge_id: Reference of the charge being refunded.
    charge_type: Charge type of the refunded charge, copied from it.
    amount: Refunded amount, USD, negative (minus the original amount).
    charge_date: Date the refund was issued.
    refund_destination: original_payment_method or account_credit.
  account: domain_billed
  direction: out
  triggers:
  - event: domain:domain_expiry_update
    when:
      charge_type:
      - renewal
      - auto_renew
      - grace_renewal
  - event: account:account_credit_refund
    when:
      refund_destination: account_credit
    map:
      customer_id: customer_id
- type: domain_auth_code_issue
  target: domain_events
  meaning: A transfer authorisation (EPP) code is generated and sent to the registrant.
  grain: One row per code issued.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment the code was issued.
    auth_code_expires_date: Issue date plus the code validity.
  triggers:
  - event: domain:domain_settings_update
    map:
      transfer_lock: unlocked
- type: domain_transfer_out_decision
  target: domain_events
  meaning: 'The gaining registrar''s outbound transfer request is recorded together with its resolution: still pending,
    approved by the registrant, rejected by the registrant, or auto-approved when the waiting period lapsed.'
  grain: One row per transfer request and decision state.
  distinguish_by:
  - event_at
  - transfer_decision
  fields:
    event_at: Moment the request or decision was recorded.
    gaining_registrar: Name of the gaining registrar, verbatim from the registry notice.
    transfer_decision: pending, approved, rejected or auto_approved.
  triggers:
  - event: domain:domain_transfer_out
    when:
      transfer_decision:
      - approved
      - auto_approved
- type: domain_expiry_notice
  target: domain_events
  meaning: A renewal reminder or post-expiry notice is emailed to the registrant.
  grain: One row per notice sent.
  distinguish_by:
  - notice_kind
  - event_at
  fields:
    notice_kind: pre_expiry_30, pre_expiry_7 or post_expiry.
    event_at: Moment sent.
  triggers: []
- type: domain_auto_renew_decline
  target: domain_events
  meaning: An auto-renew charge attempt is declined by every funding source.
  grain: One row per declined attempt.
  distinguish_by:
  - attempt_number
  - event_at
  fields:
    attempt_number: 1 for the first attempt, 2-4 for the retries.
    event_at: Moment of the declined attempt.
  triggers: []
- type: domain_registrant_verification
  target: domain_events
  meaning: The registrant confirms the contact verification email.
  grain: One row per completed verification.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment the verification link was confirmed.
  triggers:
  - event: domain:domain_verification_update
    map:
      registrant_verified: true
measures:
- id: domain_msr_order_domain_count
  window: The single manual renewal order identified by one order_ref.
  measure: Count of distinct domain_id values among domain_renewal_charge rows with charge_type renewal that carry
    that order_ref for the same customer.
- id: domain_msr_cycle_declines
  window: 'The current auto-renew cycle: from the first attempt day (expiry date minus auto_renew_first_attempt_days_before_expiry)
    up to and including the expiry date of the domain''s current expiry.'
  measure: Count of domain_auto_renew_decline rows for the domain whose event_at falls in the window.
policies:
- id: domain_agg_multi_holding
  subject:
  - domain_register
  - domain_transfer_in
  rule: A customer may hold any number of domains, each domain name being a separate holding, and there is no per-customer
    cap. A new registration or inbound transfer may be opened only when no other holding of the same domain name
    is in status pending, active, on_hold, grace, redemption or pending_delete. A name whose earlier holding ended
    as deleted, transferred_out or cancelled may be registered or transferred in again as a new holding.
  eligibility:
  - id: one_live_holding_per_name
    applies_to:
    - domain_register
    - domain_transfer_in
    kind: dedup
    condition: A new registration or inbound transfer may be opened only when no other holding of the same domain
      name is in status pending, active, on_hold, grace, redemption or pending_delete.
    evidence_fields:
    - domain_holdings.status
    - domain_holdings.domain_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_name
      action_bindings:
        domain_holdings.domain_name: domain_name
    dedup_contract:
      table: domain_holdings
      mode: separate_record
      object_bindings:
        domain_name: domain_name
      duplicate_filters:
        status:
        - pending
        - active
        - on_hold
        - grace
        - redemption
        - pending_delete
      distinct_fields: []
  params:
    max_per_customer: null
- id: domain_purchase_pricing
  subject:
  - domain_purchase_charge
  - domain_register
  - domain_transfer_in
  rule: A new registration is billed at the TLD's registration_price for the first year plus the renewal_price for
    each additional year, plus the icann_fee_per_year for every year registered. The number of years must be at
    least min_registration_years, and the resulting expiry date may lie no more than max_registration_years after
    the registration date. An inbound transfer is billed once at the TLD's transfer_in_price plus one icann_fee_per_year.
    A registration covered by a hosting plan's free-domain entitlement under domain_hosting_bundle is billed at
    zero with payment method bundle_credit for free_with_hosting_years, and any further years at the renewal_price
    plus the ICANN fee. The registration_price and additional-year components of a paid new registration are reduced
    by the domain_registration_discount_pct of the customer's account tier under the account charter, while transfers,
    bundled lines and the ICANN fee are never discounted. All amounts are rounded half up to the cent (price_rounding).
    An order whose registrant declares that they meet the presence_requirement of the TLD may be placed, and an
    order whose registrant cannot declare a United States nexus category for .us or a Canadian Presence Requirements
    category for .ca is not placed. Purchase charges are billed when the order is placed, while the holding is still
    pending.
  eligibility:
  - id: presence_declared
    applies_to:
    - domain_register
    - domain_transfer_in
    kind: caller_fact
    condition: An order whose registrant declares that they meet the presence_requirement of the TLD may be placed,
      and an order whose registrant cannot declare a United States nexus category for .us or a Canadian Presence
      Requirements category for .ca is not placed.
    evidence_fields:
    - customers.country
    - customers.customer_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: purchase_billed_while_pending
    applies_to:
    - domain_purchase_charge
    kind: state
    condition: Purchase charges are billed when the order is placed, while the holding is still pending.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - pending
  params:
    account_registration_discount_pct: account charter parameter domain_registration_discount_pct of the customer's
      account tier
  formula:
    registration_amount: round((registration_price + renewal_price * (years - 1)) * (100 - account_registration_discount_pct)
      / 100, 2) + icann_fee_per_year * years
    transfer_amount: transfer_in_price + icann_fee_per_year
- id: domain_renewal_pricing
  subject:
  - domain_renewal_charge
  - domain_expiry_update
  rule: Every renewal of a domain, whether manual, auto-renew or during the renewal grace period, is billed at the
    TLD's renewal_price per year renewed plus the icann_fee_per_year per year, and no late surcharge applies during
    the grace period. A renewal must be for at least min_renewal_years whole years. The new expiry date is the current
    expiry date plus the years renewed, never the payment date plus the years, including during the grace period.
    A renewal is refused if its new expiry date would lie more than max_registration_years after today's date. A
    renewal may be charged only while the domain status is active, on_hold or grace. The renewal_price component
    of every renewal line is reduced by the domain_renewal_discount_pct of the customer's account tier under the
    account charter, a manual multi-domain order may instead receive the bulk discount as domain_agg_bulk_renewal
    states, and the ICANN fee is never discounted. Amounts are rounded half up to the cent (price_rounding).
  eligibility:
  - id: renewable_status
    applies_to:
    - domain_renewal_charge
    kind: state
    condition: A renewal may be charged only while the domain status is active, on_hold or grace.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - active
      - on_hold
      - grace
  params:
    account_renewal_discount_pct: account charter parameter domain_renewal_discount_pct of the customer's account
      tier
  formula:
    renewal_amount: round(renewal_price * years * (100 - account_renewal_discount_pct) / 100, 2) + icann_fee_per_year
      * years
- id: domain_agg_bulk_renewal
  subject:
  - domain_renewal_charge
  rule: When one manual renewal order renews several distinct domains held by the same customer, the renewal_price
    component of every domain line in that order is discounted by the highest step of bulk_renewal_discount_ladder
    whose min_domains does not exceed domain_msr_order_domain_count, and the ICANN fee is never discounted. Only
    charge_type renewal lines count toward and receive the bulk discount; auto-renew charges are billed one domain
    per order, and grace-period renewals and restores never receive it. When the customer's account tier also grants
    a domain_renewal_discount_pct under the account charter, the single higher of the two percentages applies to
    the renewal_price component of that line and the two are never added together. The discounted component is rounded
    half up to the cent per domain line before the ICANN fee is added.
  eligibility: []
  params:
    ladder: =bulk_renewal_discount_ladder
  measures:
  - domain_msr_order_domain_count
- id: domain_auto_renew
  subject:
  - domain_renewal_charge
  - domain_auto_renew_decline
  rule: 'Auto-renew runs only for a domain whose auto_renew setting is true. An auto-renew charge may be attempted
    only while the domain status is active or on_hold. The first attempt runs auto_renew_first_attempt_days_before_expiry
    calendar days before the expiry date and, if declined, retries run on each day listed in auto_renew_retry_days_before_expiry,
    every declined attempt being recorded with its attempt number. Each attempt renews auto_renew_term_years at
    the price set by domain_renewal_pricing, booked as charge_type auto_renew, and tries the funding sources in
    auto_renew_funding_order: account credit is used only if the credit balance covers the whole amount, otherwise
    the default card is charged, and a charge is never split between sources. Once the last scheduled retry has
    declined (domain_msr_cycle_declines equals one plus the number of retry days), no further automatic attempt
    is made in that cycle and the domain expires normally on its expiry date, after which it can still be renewed
    manually under domain_grace_renewal. Switching auto-renew off stops the remaining attempts of the cycle but
    never reverses a charge already made, and switching it on after the first attempt day makes the next scheduled
    retry day the next attempt. Auto-renew is set to auto_renew_default_on on every new registration and inbound
    transfer.'
  eligibility:
  - id: auto_renew_switched_on
    applies_to:
    - domain_renewal_charge
    - domain_auto_renew_decline
    kind: state
    condition: Auto-renew runs only for a domain whose auto_renew setting is true.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.auto_renew
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.auto_renew
      allowed:
      - true
  - id: auto_renew_status
    applies_to:
    - domain_renewal_charge
    - domain_auto_renew_decline
    kind: state
    condition: An auto-renew charge may be attempted only while the domain status is active or on_hold.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - active
      - on_hold
  measures:
  - domain_msr_cycle_declines
- id: domain_grace_renewal
  subject:
  - domain_renewal_charge
  - domain_grace_renew
  rule: A grace-period renewal may be charged only while the domain status is grace. It is billed at the price set
    by domain_renewal_pricing, booked as charge_type grace_renewal, and returns the domain to active. A grace-period
    renewal is allowed only on or before the registration expiry date recorded on the domain plus renewal_grace_days
    calendar days. The window adds whole calendar days to the expiry date, counting the day after the expiry date
    as day 1, and the last day of the window is included. From the expired_dns_parking_start_day after expiry the
    domain's DNS points to the Harborline renewal notice page until it is renewed, and the renewal restores the
    previous DNS. After the window closes the domain can no longer be renewed and passes to redemption, where only
    a restore under domain_redemption_restore brings it back.
  eligibility:
  - id: in_grace
    applies_to:
    - domain_renewal_charge
    kind: state
    condition: A grace-period renewal may be charged only while the domain status is grace.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - grace
  - id: grace_window
    applies_to:
    - domain_renewal_charge
    kind: time
    condition: A grace-period renewal is allowed only on or before the registration expiry date recorded on the
      domain plus renewal_grace_days calendar days.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.expiry_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the registration expiry date recorded on the domain
      anchor_source: domain_holdings.expiry_date
      relation: not_after
      duration_source: variants.renewal_grace_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the expiry date, counting the day after the expiry date
        as day 1, and the last day of the window is included.
      boundary: inclusive
- id: domain_redemption_restore
  subject:
  - domain_restore_charge
  - domain_restore
  rule: A restore may be charged only while the domain status is redemption. A restore is allowed only on or before
    the date the domain entered redemption plus redemption_days calendar days. The window adds whole calendar days
    to the redemption date, counting the day after it as day 1, and the last day is included. A restore is billed
    as the restore_fee plus restore_includes_renewal_years at the renewal_price plus the icann_fee_per_year for
    each of those years, and the new expiry date is the original expiry date plus those years. Restore is offered
    only where restore_available is true, and once the domain reaches pending_delete it cannot be restored or renewed
    by anyone and the name is released after pending_delete_days. A restore charge is never refundable, and no account-tier
    or bulk discount applies to any part of it.
  eligibility:
  - id: in_redemption
    applies_to:
    - domain_restore_charge
    kind: state
    condition: A restore may be charged only while the domain status is redemption.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - redemption
  - id: redemption_window
    applies_to:
    - domain_restore_charge
    kind: time
    condition: A restore is allowed only on or before the date the domain entered redemption plus redemption_days
      calendar days.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.redemption_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the domain entered redemption
      anchor_source: domain_holdings.redemption_date
      relation: not_after
      duration_source: variants.redemption_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the redemption date, counting the day after it as day
        1, and the last day is included.
      boundary: inclusive
  params:
    per_tier:
      .us Domain Registration:
        restore_fee: =restore_fee
        renewal_price: =renewal_price
        redemption_days: =redemption_days
      .ca Domain Registration:
        restore_fee: =restore_fee
        renewal_price: =renewal_price
        redemption_days: =redemption_days
      .com Domain Registration:
        restore_fee: =restore_fee
        renewal_price: =renewal_price
        redemption_days: =redemption_days
      .org Domain Registration:
        restore_fee: =restore_fee
        renewal_price: =renewal_price
        redemption_days: =redemption_days
      .net Domain Registration:
        restore_fee: =restore_fee
        renewal_price: =renewal_price
        redemption_days: =redemption_days
      .co Domain Registration:
        restore_fee: =restore_fee
        renewal_price: =renewal_price
        redemption_days: =redemption_days
      .io Domain Registration:
        restore_fee: =restore_fee
        renewal_price: =renewal_price
        redemption_days: =redemption_days
  formula:
    restore_amount: restore_fee + renewal_price * restore_includes_renewal_years + icann_fee_per_year * restore_includes_renewal_years
- id: domain_outbound_transfer
  subject:
  - domain_auth_code_issue
  - domain_transfer_out_decision
  - domain_transfer_out
  rule: An authorisation code may be issued only while the domain status is active or grace. A domain in grace qualifies
    only where transfer_out_allowed_in_grace is true for its TLD. An authorisation code may be issued only after
    the registration date of the domain plus post_registration_transfer_lock_days calendar days. For a domain acquired
    by inbound transfer, an authorisation code may be issued only after the date the inbound transfer completed
    plus post_transfer_in_lock_days calendar days. After a change of registrant on which the registrant did not
    opt out, an authorisation code may be issued only after the date of the last change of registrant plus registrant_change_lock_days
    calendar days. Each lock adds whole calendar days to its anchor date, counting the day after the anchor as day
    1, and the code may first be issued on the day after the last locked day. An authorisation code may be issued
    only while no registry lock is in force on the domain. An authorisation code may be issued only while the customer's
    Harborline account status is active. Issuing the code also removes the registrar transfer lock, the code is
    valid for auth_code_validity_days, and a new code replaces any earlier one. When a gaining registrar requests
    the transfer, the registrant may approve or reject it, and if neither happens within transfer_out_auto_approve_days
    calendar days of the request the transfer is approved automatically; a TLD whose value is 0 completes on the
    request itself. A rejected request ends that transfer and the domain stays with Harborline, while an approved
    or auto-approved request completes the transfer and closes the holding without any refund of the remaining registration
    term.
  eligibility:
  - id: transferable_status
    applies_to:
    - domain_auth_code_issue
    kind: state
    condition: An authorisation code may be issued only while the domain status is active or grace.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - active
      - grace
  - id: post_registration_lock
    applies_to:
    - domain_auth_code_issue
    kind: time
    condition: An authorisation code may be issued only after the registration date of the domain plus post_registration_transfer_lock_days
      calendar days.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.registered_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the registration date of the domain
      anchor_source: domain_holdings.registered_date
      relation: not_before
      duration_source: variants.post_registration_transfer_lock_days
      unit: calendar_days
      counting_rule: Each lock adds whole calendar days to its anchor date, counting the day after the anchor as
        day 1, and the code may first be issued on the day after the last locked day.
      boundary: exclusive
  - id: post_transfer_in_lock
    applies_to:
    - domain_auth_code_issue
    kind: time
    condition: For a domain acquired by inbound transfer, an authorisation code may be issued only after the date
      the inbound transfer completed plus post_transfer_in_lock_days calendar days.
    evidence_fields:
    - domain_holdings.acquisition_type
    - domain_holdings.domain_id
    - domain_holdings.transfer_in_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the inbound transfer completed
      anchor_source: domain_holdings.transfer_in_date
      relation: not_before
      duration_source: variants.post_transfer_in_lock_days
      unit: calendar_days
      counting_rule: Each lock adds whole calendar days to its anchor date, counting the day after the anchor as
        day 1, and the code may first be issued on the day after the last locked day.
      boundary: exclusive
  - id: registrant_change_lock
    applies_to:
    - domain_auth_code_issue
    kind: time
    condition: After a change of registrant on which the registrant did not opt out, an authorisation code may be
      issued only after the date of the last change of registrant plus registrant_change_lock_days calendar days.
    evidence_fields:
    - domain_holdings.change_lock_opt_out
    - domain_holdings.domain_id
    - domain_holdings.last_registrant_change_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date of the last change of registrant
      anchor_source: domain_holdings.last_registrant_change_date
      relation: not_before
      duration_source: variants.registrant_change_lock_days
      unit: calendar_days
      counting_rule: Each lock adds whole calendar days to its anchor date, counting the day after the anchor as
        day 1, and the code may first be issued on the day after the last locked day.
      boundary: exclusive
  - id: no_registry_lock
    applies_to:
    - domain_auth_code_issue
    kind: state
    condition: An authorisation code may be issued only while no registry lock is in force on the domain.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.registry_lock
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.registry_lock
      allowed:
      - false
  - id: account_not_held
    applies_to:
    - domain_auth_code_issue
    kind: state
    condition: An authorisation code may be issued only while the customer's Harborline account status is active.
    evidence_fields:
    - account_holdings.customer_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.customer_id
      action_bindings:
        account_holdings.customer_id: customer_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
- id: domain_transfer_in_handling
  subject:
  - domain_transfer_in
  - domain_activate
  - domain_cancel
  rule: 'An inbound transfer requires the authorisation code issued by the losing registrar and the domain to be
    unlocked there, and the registry decides eligibility: a domain still inside a post-registration or post-transfer
    lock at the losing registrar, or in redemption there while transfer_in_eligible_in_redemption is false, is rejected.
    A transfer that the losing registrar or registry rejects, or that does not complete, is cancelled and, where
    transfer_in_refund_on_failure is true, its purchase charge is refunded in full to the original payment method.
    On completion the expiry date becomes the prior expiry plus transfer_in_years_added, except that the registry
    adds no time beyond max_registration_years from the completion date, and the post_transfer_in_lock_days lock
    starts from the completion date. A new registration is activated as soon as the registry confirms it, and is
    cancelled with a full refund if the registry rejects it. Privacy is switched on at activation where privacy_auto_enabled
    is true, and the registrar transfer lock follows registrar_lock_default_on.'
  eligibility: []
- id: domain_refunds
  subject:
  - domain_refund
  - domain_agp_delete
  rule: A refund always returns the full amount of one original charge, identified by its charge reference and including
    the ICANN fee, and partial or prorated domain refunds are not given. A charge may be refunded only once. A new
    registration may be refunded, by the registrant deleting the domain, only on or before the charge date of the
    original charge plus new_registration_refund_days calendar days. A manual or grace-period renewal may be refunded
    only on or before the charge date of the original renewal plus renewal_refund_days calendar days. An auto-renew
    charge may be refunded only on or before the charge date of the original auto-renew charge plus auto_renew_refund_days
    calendar days. Each window adds whole calendar days to the charge date, counting the day after the charge as
    day 1, and the last day is included; a TLD whose window is 0 never refunds that charge type. A restore charge
    is never refunded (restore_fee_refundable), a registry lock charge is not refunded once the lock is in force,
    and an inbound transfer charge is refunded only when the transfer is cancelled. Refunding a renewal, grace-period
    renewal or auto-renew charge rolls the expiry date back by the years that charge covered, and a registration
    is refunded only through the registrant's deletion of the domain. A refund goes to refund_destination_default
    unless the customer elects account credit where refund_to_credit_allowed is true; a charge paid from account
    credit is always refunded to account credit, and a bundle_credit line has nothing to refund.
  eligibility:
  - id: refund_once
    applies_to:
    - domain_refund
    kind: dedup
    condition: A charge may be refunded only once.
    evidence_fields:
    - domain_charges.original_domain_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_charges.original_domain_charge_id
      action_bindings:
        domain_charges.original_domain_charge_id: original_domain_charge_id
    dedup_contract:
      table: domain_charges
      mode: separate_record
      object_bindings:
        original_domain_charge_id: original_domain_charge_id
      duplicate_filters:
        event_type:
        - domain_refund
      distinct_fields: []
  - id: registration_refund_window
    applies_to:
    - domain_agp_delete
    - domain_refund
    kind: time
    condition: A new registration may be refunded, by the registrant deleting the domain, only on or before the
      charge date of the original charge plus new_registration_refund_days calendar days.
    evidence_fields:
    - domain_charges.charge_type
    - domain_charges.domain_charge_id
    - domain_charges.charge_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_charges.domain_charge_id
      action_bindings:
        domain_charges.domain_charge_id: original_domain_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the charge date of the original charge
      anchor_source: domain_charges.charge_date
      relation: not_after
      duration_source: variants.new_registration_refund_days
      unit: calendar_days
      counting_rule: Each window adds whole calendar days to the charge date, counting the day after the charge
        as day 1, and the last day is included; a TLD whose window is 0 never refunds that charge type.
      boundary: inclusive
  - id: renewal_refund_window
    applies_to:
    - domain_refund
    kind: time
    condition: A manual or grace-period renewal may be refunded only on or before the charge date of the original
      renewal plus renewal_refund_days calendar days.
    evidence_fields:
    - domain_charges.charge_type
    - domain_charges.domain_charge_id
    - domain_charges.charge_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_charges.domain_charge_id
      action_bindings:
        domain_charges.domain_charge_id: original_domain_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the charge date of the original renewal
      anchor_source: domain_charges.charge_date
      relation: not_after
      duration_source: variants.renewal_refund_days
      unit: calendar_days
      counting_rule: Each window adds whole calendar days to the charge date, counting the day after the charge
        as day 1, and the last day is included; a TLD whose window is 0 never refunds that charge type.
      boundary: inclusive
  - id: auto_renew_refund_window
    applies_to:
    - domain_refund
    kind: time
    condition: An auto-renew charge may be refunded only on or before the charge date of the original auto-renew
      charge plus auto_renew_refund_days calendar days.
    evidence_fields:
    - domain_charges.charge_type
    - domain_charges.domain_charge_id
    - domain_charges.charge_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_charges.domain_charge_id
      action_bindings:
        domain_charges.domain_charge_id: original_domain_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the charge date of the original auto-renew charge
      anchor_source: domain_charges.charge_date
      relation: not_after
