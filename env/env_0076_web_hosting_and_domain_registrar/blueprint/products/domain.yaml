        renewal_refund_days: =renewal_refund_days
        auto_renew_refund_days: =auto_renew_refund_days
      .io Domain Registration:
        registration_refund_days: =new_registration_refund_days
        renewal_refund_days: =renewal_refund_days
        auto_renew_refund_days: =auto_renew_refund_days
- id: domain_registrant_change_rules
  subject:
  - domain_registrant_change
  - domain_registrant_verification
  - domain_verification_update
  - domain_hold
  - domain_release_hold
  rule: A change of registrant may be made only while the domain status is active. A change of registrant may be
    made only while no registry lock is in force on the domain. Where registrant_change_lock_days is above 0, the
    change starts a transfer lock of that many days unless the registrant opts out at the time of the change and
    registrant_change_lock_opt_out is true for the TLD, and an opt-out cannot be added afterwards. Where registrant_verification_days
    is above 0, a new registration or a change of registrant must be confirmed through the verification email within
    that many calendar days of the registration or change date, and where suspend_on_unverified is true a domain
    still unverified after the last day is placed on registrar hold the next day. Confirming the verification email
    at any time marks the registrant verified and lifts a registrar hold the same day, and a hold never changes
    the expiry date or any renewal deadline. The change of registrant is requested by the current registrant, and
    the new registrant's name and organisation are recorded verbatim as given.
  eligibility:
  - id: change_while_active
    applies_to:
    - domain_registrant_change
    kind: state
    condition: A change of registrant may be made only while the domain status is active.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - active
  - id: change_no_registry_lock
    applies_to:
    - domain_registrant_change
    kind: state
    condition: A change of registrant may be made only while no registry lock is in force on the domain.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.registry_lock
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.registry_lock
      allowed:
      - false
  params:
    per_tier:
      .us Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .ca Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .com Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .org Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .net Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .co Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .io Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
- id: domain_settings_rules
  subject:
  - domain_settings_update
  - domain_lock_charge
  rule: A settings change may be made only while the domain status is active, on_hold or grace. WHOIS privacy may
    be switched on only where privacy_available is true for the TLD and is billed at privacy_annual_fee; .us registrations
    may never carry privacy, and .ca registrations rely on the registry's own disclosure rules. Registry lock may
    be ordered only where registry_lock_available is true, and is billed registry_lock_annual_fee per year aligned
    to the domain's expiry date. While a registry lock is in force, the registrar transfer lock stays on and no
    change of registrant, nameserver change or authorisation code is possible, and releasing the lock takes registry_lock_release_business_days
    business days, counted Monday to Friday excluding US federal holidays, from the registrant's authorised request.
    The registrar transfer lock is on by default (registrar_lock_default_on), and the registrant may switch it off
    or on at any time outside a registry lock. Nameserver changes take effect at the registry immediately, and DNSSEC
    may be enabled only on Harborline DNS where dnssec_supported is true.
  eligibility:
  - id: settings_status
    applies_to:
    - domain_settings_update
    kind: state
    condition: A settings change may be made only while the domain status is active, on_hold or grace.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - active
      - on_hold
      - grace
- id: domain_hosting_bundle
  subject:
  - domain_register
  - domain_purchase_charge
  rule: A customer whose hosting plan includes a free domain under the hosting charter may register one domain free
    for free_with_hosting_years against that plan, provided the TLD's free_with_hosting_eligible is true. The free
    registration may be applied only while the hosting plan named as bundled_hosting_id has status provisioning
    or active. Each hosting plan covers at most one free registration in its lifetime. A plan that already has a
    domain holding pointing to it as bundled_hosting_id cannot cover another, even if that domain was later deleted
    or transferred out, while a cancelled registration does not use up the entitlement. Renewals of a bundled domain
    are billed at the normal renewal price, and inbound transfers never qualify. If the hosting plan is refunded
    under its money-back guarantee while the customer keeps the domain, the bundle_registration_value of the domain's
    TLD is deducted from that hosting refund as the hosting charter states, and the domain registration itself is
    never refunded on that account.
  eligibility:
  - id: bundling_plan_live
    applies_to:
    - domain_register
    - domain_purchase_charge
    kind: state
    condition: The free registration may be applied only while the hosting plan named as bundled_hosting_id has
      status provisioning or active.
    evidence_fields:
    - hosting_holdings.hosting_id
    - domain_holdings.bundled_hosting_id
    - hosting_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.bundled_hosting_id
      action_bindings:
        domain_holdings.bundled_hosting_id: bundled_hosting_id
    state_contract:
      field: hosting_holdings.status
      allowed:
      - provisioning
      - active
  - id: one_free_domain_per_plan
    applies_to:
    - domain_register
    kind: dedup
    condition: Each hosting plan covers at most one free registration in its lifetime.
    evidence_fields:
    - domain_holdings.bundled_hosting_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.bundled_hosting_id
      action_bindings:
        domain_holdings.bundled_hosting_id: bundled_hosting_id
    dedup_contract:
      table: domain_holdings
      mode: separate_record
      object_bindings:
        bundled_hosting_id: bundled_hosting_id
      duplicate_filters:
        status:
        - pending
        - active
        - on_hold
        - grace
        - redemption
        - pending_delete
        - deleted
        - transferred_out
      distinct_fields: []
- id: domain_lifecycle_clock
  subject:
  - domain_expire
  - domain_enter_redemption
  - domain_pending_delete
  - domain_purge
  - domain_expiry_notice
  rule: A domain whose expiry date has passed without renewal moves to grace on the day after the expiry date. A
    domain in grace that is not renewed by the last day of renewal_grace_days moves to redemption on the following
    day, and that day is recorded as its redemption date. A domain in redemption that is not restored by the last
    day of redemption_days moves to pending_delete on the following day and is purged after pending_delete_days.
    Renewal reminders are emailed on each day listed in expiry_notice_days_before, and a post-expiry notice is sent
    within post_expiry_notice_within_days after the expiry date; a reminder is skipped when the domain has already
    been renewed past that expiry, and notices are sent whether or not auto-renew is on. Expiry, redemption and
    deletion follow the recorded dates alone, and a customer's statement that they meant to renew does not change
    them.
