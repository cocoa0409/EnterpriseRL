# Product charter — Domain Registrations (category: domain). Single registry of every quantified policy of this category.
category: domain
display_name: Domain Registrations
binding:
  holding_table: domain_holdings
  event_tables:
  - domain_charges
  - domain_events
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - pending
  - active
  - on_hold
  - grace
  - redemption
  - pending_delete
  - deleted
  - transferred_out
  - cancelled
  transitions:
  - from: pending
    to: active
    by: system
    means: The registry confirms the new registration, or the inbound transfer completes, and the domain becomes
      live under Harborline.
  - from: pending
    to: cancelled
    by: system
    means: The registry rejects the registration, or the losing registrar or registry rejects or times out the inbound
      transfer, so the order is cancelled.
  - from: active
    to: on_hold
    by: system
    means: The registrant contact verification deadline passes unverified and the domain is placed on registrar
      hold (it stops resolving).
  - from: on_hold
    to: active
    by: system
    means: The registrant completes contact verification and the registrar hold is lifted.
  - from: active
    to: grace
    by: system
    means: The registration expiry date passes without renewal and the domain enters the renewal grace period.
  - from: on_hold
    to: grace
    by: system
    means: The expiry date passes while the domain is still on registrar hold.
  - from: grace
    to: active
    by: agent
    means: A renewal is charged during the renewal grace period and the domain is reactivated.
  - from: grace
    to: redemption
    by: system
    means: The renewal grace period ends unrenewed and the registry places the domain in its Redemption Grace Period.
  - from: redemption
    to: active
    by: agent
    means: A redemption restore is charged and the registry restores the domain.
  - from: redemption
    to: pending_delete
    by: system
    means: The redemption period ends unrestored and the registry places the domain in pending delete.
  - from: pending_delete
    to: deleted
    by: system
    means: The registry purges the name and it returns to the public pool.
  - from: active
    to: deleted
    by: user
    means: The registrant deletes a newly registered domain inside its add grace period, giving up the name.
  - from: active
    to: transferred_out
    by: system
    means: An outbound transfer to another registrar completes.
  - from: grace
    to: transferred_out
    by: system
    means: An outbound transfer of an expired domain completes during the renewal grace period.
accounts:
- key: domain_billed
  unit: USD
  meaning: 'Net amount billed for one domain holding: every purchase, renewal, restore and registry-lock charge
    adds to it and every refund takes away from it.'
parameter_schema:
  registration_price: First-year registration price, USD, excluding the ICANN fee
  renewal_price: Price of each renewal year and of each additional year beyond the first in a multi-year registration,
    USD, excluding the ICANN fee
  transfer_in_price: Inbound transfer price including the one-year extension, USD, excluding the ICANN fee
  restore_fee: Redemption Grace Period restore fee, USD, charged in addition to the mandatory renewal year
  icann_fee_per_year: ICANN transaction fee per registration year passed through on gTLD purchases, renewals, transfers
    and restores, USD (0.00 where the TLD is not ICANN-contracted)
  registry_lock_annual_fee: Annual fee for registry-level lock service, USD (0.00 where the service is unavailable)
  privacy_annual_fee: Annual price of WHOIS privacy protection, USD
  bundle_registration_value: Value of a first-year registration obtained free with a hosting plan, deducted from
    a hosting money-back refund when the customer keeps the domain, USD
  min_registration_years: Minimum years per new registration, integer
  max_registration_years: Maximum years an expiry date may lie beyond the current date after any registration, renewal,
    transfer or restore, integer
  min_renewal_years: Minimum years per renewal order, integer
  transfer_in_years_added: Years added to the current expiry by a completed inbound transfer, integer
  auto_renew_default_on: Whether auto-renew is switched on by default for a new registration or inbound transfer,
    boolean
  auto_renew_first_attempt_days_before_expiry: Calendar days before the expiry date on which the first auto-renew
    charge attempt runs, integer
  auto_renew_retry_days_before_expiry: Calendar days before the expiry date on which the retry attempts run after
    a declined first attempt, list of integers
  auto_renew_term_years: Years renewed by each auto-renew charge, integer
  auto_renew_funding_order: Order in which funding sources are tried for an auto-renew charge, list
  renewal_grace_days: Calendar days after the expiry date during which the domain can still be renewed at the standard
    renewal price
  redemption_days: Calendar days of the registry Redemption Grace Period counted from the date the domain entered
    redemption
  pending_delete_days: Calendar days of registry pending delete before the name is purged
  expired_dns_parking_start_day: Day after the expiry date (1 = the first day) from which the domain's DNS points
    to the Harborline renewal notice page, integer
  transfer_out_allowed_in_grace: Whether an outbound transfer may be started while the domain is in the renewal
    grace period, boolean
  restore_available: Whether the registry offers a paid restore during the redemption period, boolean
  restore_includes_renewal_years: Renewal years charged together with, and added by, a restore, integer
  new_registration_refund_days: Calendar days after the registration charge date within which a new registration
    can be deleted for a full refund (0 = never refundable)
  renewal_refund_days: Calendar days after the charge date within which a manual or grace-period renewal can be
    refunded (0 = never refundable)
  auto_renew_refund_days: Calendar days after the charge date within which an auto-renew charge can be refunded
    (0 = never refundable)
  restore_fee_refundable: Whether a restore charge can ever be refunded, boolean
  transfer_in_refund_on_failure: Whether the inbound transfer charge is refunded in full when the transfer is cancelled,
    boolean
  refund_destination_default: 'Where a refund is returned when the customer states no preference: original_payment_method'
  refund_to_credit_allowed: Whether the customer may elect to take a refund of a card or PayPal charge as Harborline
    account credit instead, boolean
  post_registration_transfer_lock_days: Calendar days after the registration date during which the domain cannot
    be transferred to another registrar
  post_transfer_in_lock_days: Calendar days after an inbound transfer completes during which the domain cannot be
    transferred out again
  registrant_change_lock_days: Calendar days after a change of registrant during which outbound transfer is blocked
    unless the registrant opted out at the time of the change (0 = no such lock)
  registrant_change_lock_opt_out: Whether the registrant may opt out of the change-of-registrant transfer lock at
    the time of the change, boolean
  auth_code_validity_days: Calendar days an issued transfer authorisation (EPP) code stays valid
  transfer_out_auto_approve_days: Calendar days after the gaining registrar's request after which a pending outbound
    transfer is approved automatically if the registrant has not rejected it
  transfer_in_eligible_in_redemption: Whether a domain that is in redemption at the losing registrar can be accepted
    as an inbound transfer, boolean
  registrant_verification_days: Calendar days after a new registration or change of registrant within which the
    registrant must confirm the verification email (0 = not required)
  suspend_on_unverified: Whether the domain is placed on registrar hold when the verification deadline is missed,
    boolean
  privacy_available: Whether WHOIS privacy protection may be enabled on the domain, boolean
  privacy_auto_enabled: Whether privacy is switched on automatically at registration or transfer-in where available,
    boolean
  registry_lock_available: Whether registry-level lock can be ordered for the TLD, boolean
  registry_lock_release_business_days: Business days (Monday-Friday, US federal holidays excluded) needed to release
    a registry lock after the registrant's authorised request (0 = not applicable)
  registrar_lock_default_on: Whether the registrar transfer lock is switched on by default, boolean
  presence_requirement: 'Registry eligibility rule for the registrant: none, us_nexus or canadian_presence'
  dnssec_supported: Whether DNSSEC signing can be enabled on Harborline DNS for the TLD, boolean
  expiry_notice_days_before: Calendar days before the expiry date on which renewal reminder emails are sent, list
    of integers
  post_expiry_notice_within_days: Calendar days after the expiry date within which the post-expiry notice is sent
  free_with_hosting_eligible: Whether the TLD may be taken as the free first-year domain bundled with a hosting
    plan, boolean
  free_with_hosting_years: Registration years covered free under the hosting bundle, integer
  bulk_renewal_discount_ladder: Discount on the renewal-price component of a single manual renewal order by the
    number of distinct domains of the same customer renewed in that order; list of {min_domains, discount_pct},
    highest qualifying step applies
  price_rounding: 'Rounding applied to every computed domain amount: half_up_to_cent'
