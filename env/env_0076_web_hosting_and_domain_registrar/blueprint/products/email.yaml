events:
- type: email_order
  target: email_holdings
  mutation: create
  meaning: A customer orders an email subscription for a domain with a number of seats on a billing plan.
  grain: One row per subscription ordered.
  fields:
    variant_name: Official email product ordered.
    email_domain: Domain the mailboxes use, lowercase, verbatim.
    seat_count: Seats ordered.
    billing_plan: annual_prepaid, annual_monthly_billing or monthly.
    term_start_date: Order date.
    term_end_date: Order date plus 12 months, or plus 1 month for a monthly plan.
    auto_renew: Initial renewal setting.
    domain_id: Harborline domain holding of the email domain; null when registered elsewhere.
    opened_date: Order date.
  triggers:
  - event: email:email_subscription_charge
    map:
      charge_type: new_subscription
- type: email_activate
  target: email_holdings
  mutation:
    transition:
      from: provisioning
      to: active
  meaning: The mail organisation is provisioned.
  grain: One row per transaction.
  fields:
    opened_date: Unchanged.
  triggers: []
- type: email_provision_fail
  target: email_holdings
  mutation:
    transition:
      from: provisioning
      to: cancelled
  meaning: The order fails payment or fraud screening.
  grain: One row per transaction.
  fields:
    closed_date: Date abandoned.
  triggers:
  - event: email:email_refund
    map:
      charge_type: new_subscription
- type: email_suspend
  target: email_holdings
  mutation:
    transition:
      from: active
      to: suspended
  meaning: Access is suspended for an unpaid instalment or renewal.
  grain: One row per transaction.
  fields:
    suspended_date: Suspension date.
  triggers: []
- type: email_reactivate
  target: email_holdings
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The overdue amount is paid and access restored.
  grain: One row per transaction.
  fields:
    suspended_date: Cleared to empty.
  triggers: []
- type: email_cancel_schedule
  target: email_holdings
  mutation:
    transition:
      from: active
      to: cancel_pending
  meaning: The customer turns renewal off so the subscription ends at the term end.
  grain: One row per transaction.
  fields:
    auto_renew: Set to false.
  triggers: []
- type: email_cancel_withdraw
  target: email_holdings
  mutation:
    transition:
      from: cancel_pending
      to: active
  meaning: A scheduled cancellation is withdrawn.
  grain: One row per transaction.
  fields:
    auto_renew: Set to true.
  triggers: []
- type: email_term_expire
  target: email_holdings
  mutation:
    transition:
      from: cancel_pending
      to: expired
  meaning: The term ends unrenewed and the subscription becomes read-only.
  grain: One row per transaction.
  fields:
    expired_date: The term end date.
  triggers: []
- type: email_expired_renew
  target: email_holdings
  mutation:
    transition:
      from: expired
      to: active
  meaning: An expired subscription is renewed inside its expired grace days.
  grain: One row per transaction.
  fields:
    expired_date: Cleared to empty.
  triggers: []
- type: email_deprovision
  target: email_holdings
  mutation:
    transition:
    - from: expired
      to: cancelled
    - from: suspended
      to: cancelled
  meaning: The retention period lapses and the mail organisation and all mailboxes are deleted.
  grain: One row per transaction.
  fields:
    closed_date: Deletion date.
  triggers: []
- type: email_cancel_immediate
  target: email_holdings
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: The customer cancels with immediate effect.
  grain: One row per transaction.
  fields:
    closed_date: Cancellation date.
  triggers: []
- type: email_seat_update
  target: email_holdings
  mutation: update
  meaning: The live seat count changes (seats added, or reduced inside the window or at renewal).
  grain: One row per seat change.
  fields:
    seat_count: Seats after the change.
  triggers: []
- type: email_plan_change
  target: email_holdings
  mutation: update
  meaning: The subscription moves to another product (an upgrade mid-term or a scheduled change at renewal).
  grain: One row per product change.
  fields:
    variant_name: New official product name.
  triggers: []
- type: email_term_renew
  target: email_holdings
  mutation: update
  meaning: A paid renewal starts the next term, applying any scheduled seat count and product change.
  grain: One row per renewal.
  fields:
    term_start_date: Previous term end date.
    term_end_date: New term start plus 12 months, or 1 month for a monthly plan.
    billing_plan: Billing plan of the new term.
    seat_count: Seats for the new term (the scheduled count when one is set).
    scheduled_seat_count: Reset to 0.
    scheduled_variant: Reset to none.
  triggers: []
- type: email_settings_update
  target: email_holdings
  mutation: update
  meaning: The customer changes renewal, schedules a seat count or product for the next renewal.
  grain: One row per change.
  fields:
    auto_renew: Renewal setting after the change.
    scheduled_seat_count: Seats to apply at the next renewal; 0 for none.
    scheduled_variant: Product to apply at the next renewal; none for no change.
  triggers: []
- type: email_subscription_charge
  target: email_charges
  meaning: The first term or first instalment of a new subscription is billed.
  grain: One row per subscription purchase.
  distinguish_by:
  - charge_date
  - order_ref
  fields:
    charge_type: new_subscription.
    amount: Amount billed, USD, positive.
    seats: Seats billed.
    period_start: First day covered.
    period_end: Last day covered.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: email_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: email_renewal_charge
  target: email_charges
  meaning: A renewal term, or a monthly instalment of an annual term billed monthly, is billed.
  grain: One row per billed period.
  distinguish_by:
  - charge_type
  - period_start
  fields:
    charge_type: renewal, auto_renew or monthly_instalment.
    amount: Amount billed, USD, positive.
    seats: Seats billed.
    period_start: First day covered.
    period_end: Last day covered.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: email_billed
  direction: in
  triggers:
  - event: email:email_term_renew
    when:
      charge_type:
      - renewal
      - auto_renew
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: email_seat_charge
  target: email_charges
  meaning: Seats added mid-term, or a mid-term upgrade, are billed prorated to the term end.
  grain: One row per seat addition or upgrade order.
  distinguish_by:
  - charge_type
  - charge_date
  - order_ref
  fields:
    charge_type: added_seats or upgrade_proration.
    amount: Prorated amount, USD, positive.
    seats: Seats added, or seats upgraded.
    target_variant: Product upgraded to; none for added seats.
    period_start: Date of the change.
    period_end: Term end date.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: email_billed
  direction: in
  triggers:
  - event: email:email_seat_update
    when:
      charge_type: added_seats
  - event: email:email_plan_change
    when:
      charge_type: upgrade_proration
    map:
      variant_name: target_variant
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: email_refund
  target: email_charges
  meaning: A charge is refunded inside the cancellation window, in full or prorated, for a cancellation, a seat
    reduction or a failed order.
  grain: One row per refunded original charge.
  distinguish_by:
  - original_email_charge_id
  fields:
    original_email_charge_id: Reference of the charge refunded.
    charge_type: Charge type of the refunded charge, copied from it.
    seats: Seats the refund covers.
    amount: Refunded amount, USD, negative.
    charge_date: Refund date.
    refund_destination: original_payment_method or account_credit.
  account: email_billed
  direction: out
  triggers:
  - event: account:account_credit_refund
    when:
      refund_destination: account_credit
    map:
      customer_id: customer_id
- type: email_renewal_decline
  target: email_events
  meaning: A renewal or instalment charge attempt is declined.
  grain: One row per declined attempt.
  distinguish_by:
  - attempt_number
  - event_at
  fields:
    attempt_number: Attempt number in the cycle.
    event_at: Moment of the attempt.
  triggers: []
- type: email_mailbox_delete
  target: email_events
  meaning: A mailbox is deleted by the customer's administrator; it stays restorable for the retention days.
  grain: One row per mailbox deletion.
  distinguish_by:
  - mailbox_address
  - event_at
  fields:
    mailbox_address: Mailbox deleted, verbatim.
    event_at: Moment deleted.
  triggers: []
- type: email_mailbox_restore
  target: email_events
  meaning: A deleted mailbox is restored with its content.
  grain: One row per restore.
  distinguish_by:
  - mailbox_address
  - event_at
  fields:
    mailbox_address: Mailbox restored, verbatim.
    event_at: Moment restored.
    deleted_at: Moment the mailbox had been deleted, copied from the deletion record.
  triggers: []
measures:
- id: email_msr_m365_seats_total
  window: Current state of the customer's portfolio.
  measure: Sum of seat_count over the customer's email subscriptions whose variant_name is a Microsoft 365 Business
    product and whose status is provisioning, active, suspended, cancel_pending or expired.
- id: email_msr_cycle_declines
  window: 'The current billing cycle: from the first attempt day of the charge due up to and including its due date.'
  measure: Count of email_renewal_decline rows of the subscription whose event_at falls in the window.
policies:
- id: email_agg_multi_holding
  subject:
  - email_order
  rule: A customer may hold several email subscriptions, one per email domain. A new subscription may be ordered
    for an email domain only when no other subscription for that domain is in status provisioning, active, suspended,
    cancel_pending or expired.
  eligibility:
  - id: one_subscription_per_domain
    applies_to:
    - email_order
    kind: dedup
    condition: A new subscription may be ordered for an email domain only when no other subscription for that domain
      is in status provisioning, active, suspended, cancel_pending or expired.
    evidence_fields:
    - email_holdings.email_domain
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_domain
      action_bindings:
        email_holdings.email_domain: email_domain
    dedup_contract:
      table: email_holdings
      mode: separate_record
      object_bindings:
        email_domain: email_domain
      duplicate_filters:
        status:
        - provisioning
        - active
        - suspended
        - cancel_pending
        - expired
      distinct_fields: []
  params:
    max_per_customer: null
- id: email_agg_m365_seat_cap
  subject:
  - email_order
  - email_seat_charge
  - email_term_renew
  rule: All of a customer's Microsoft 365 subscriptions belong to one Microsoft 365 organisation, so their Business
    seats are counted together. An order, seat addition or renewal seat count may be accepted only when email_msr_m365_seats_total
    after the change does not exceed the max_seats of the Microsoft 365 Business products. Harborline Mail subscriptions
    are counted per subscription against their own max_seats and never toward the Microsoft 365 total.
  eligibility:
  - id: m365_cap
    applies_to:
    - email_order
    - email_seat_charge
    - email_term_renew
    kind: authorization
    condition: An order, seat addition or renewal seat count may be accepted only when email_msr_m365_seats_total
      after the change does not exceed the max_seats of the Microsoft 365 Business products.
    evidence_fields:
    - email_holdings.seat_count
    - email_holdings.variant_name
    - email_holdings.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.customer_id
      action_bindings:
        email_holdings.customer_id: customer_id
  measures:
  - email_msr_m365_seats_total
- id: email_pricing
  subject:
  - email_subscription_charge
  - email_order
  rule: 'A new subscription is billed seats times the product''s seat price for the billing plan chosen: seat_price_annual_prepaid
    times 12 for annual_prepaid, or one month at seat_price_annual_monthly_billing or seat_price_monthly for the
    first instalment or month. Only plans in billing_plans_offered can be chosen, and seats must lie between min_seats
    and max_seats. Where account_discount_applies is true the seat price is reduced by the account tier''s email_discount_pct
    under the account charter, and Microsoft 365 seats are never discounted. Amounts are rounded half up to the
    cent (price_rounding). A new subscription is billed when ordered, while it is provisioning.'
  eligibility:
  - id: billed_provisioning
    applies_to:
    - email_subscription_charge
    kind: state
    condition: A new subscription is billed when ordered, while it is provisioning.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    state_contract:
      field: email_holdings.status
      allowed:
      - provisioning
  params:
    account_email_discount_pct: account charter parameter email_discount_pct of the customer's account tier, applied
      only where account_discount_applies is true (else 0)
    per_tier:
      Harborline Mail Starter:
        annual: =seat_price_annual_prepaid
        annual_monthly: =seat_price_annual_monthly_billing
        monthly: =seat_price_monthly
      Harborline Mail Plus:
        annual: =seat_price_annual_prepaid
        annual_monthly: =seat_price_annual_monthly_billing
        monthly: =seat_price_monthly
      Harborline Mail Pro:
        annual: =seat_price_annual_prepaid
        annual_monthly: =seat_price_annual_monthly_billing
        monthly: =seat_price_monthly
      Microsoft 365 Business Basic:
        annual: =seat_price_annual_prepaid
        annual_monthly: =seat_price_annual_monthly_billing
        monthly: =seat_price_monthly
      Microsoft 365 Business Standard:
        annual: =seat_price_annual_prepaid
        annual_monthly: =seat_price_annual_monthly_billing
        monthly: =seat_price_monthly
      Microsoft 365 Business Premium:
        annual: =seat_price_annual_prepaid
        annual_monthly: =seat_price_annual_monthly_billing
        monthly: =seat_price_monthly
  formula:
    annual_prepaid_amount: round(seats * seat_price_annual_prepaid * 12 * (100 - account_email_discount_pct) / 100,
      2)
    annual_monthly_amount: round(seats * seat_price_annual_monthly_billing * (100 - account_email_discount_pct)
      / 100, 2)
    monthly_amount: round(seats * seat_price_monthly * (100 - account_email_discount_pct) / 100, 2)
- id: email_renewal_and_instalments
  subject:
  - email_renewal_charge
  - email_renewal_decline
  - email_term_renew
  - email_expired_renew
  rule: A renewal or instalment may be charged only while the subscription status is active, suspended or expired.
    Renewals and instalments use the product's current seat price for the billing plan, fixed for the whole annual
    term where price_protected_for_term is true, and apply any scheduled seat count and scheduled product at the
    renewal. An annual term billed monthly is charged a monthly_instalment on the instalment day each month (instalment_day_rule),
    and a monthly plan renews each month. Where auto_renew is true the first attempt runs auto_renew_days_before_end
    days before the term end date and retries run on each day in auto_renew_retry_days_before_end, and a scheduled
    cancellation stops renewal. An amount still unpaid payment_grace_days calendar days after its due date suspends
    the subscription the next day. An expired subscription may be renewed only on or before the expired date plus
    expired_grace_days calendar days. The window adds whole calendar days to the expired date, counting the next
    day as day 1, and the last day is included, and the renewed term starts on the original term end date.
  eligibility:
  - id: chargeable_status
    applies_to:
    - email_renewal_charge
    kind: state
    condition: A renewal or instalment may be charged only while the subscription status is active, suspended or
      expired.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    state_contract:
      field: email_holdings.status
      allowed:
      - active
      - suspended
      - expired
  - id: expired_grace_window
    applies_to:
    - email_expired_renew
    kind: time
    condition: An expired subscription may be renewed only on or before the expired date plus expired_grace_days
      calendar days.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.expired_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the expired date
      anchor_source: email_holdings.expired_date
      relation: not_after
      duration_source: variants.expired_grace_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the expired date, counting the next day as day 1, and
        the last day is included, and the renewed term starts on the original term end date.
      boundary: inclusive
  params:
    per_tier:
      Harborline Mail Starter:
        grace: =payment_grace_days
        expired_grace: =expired_grace_days
      Harborline Mail Plus:
        grace: =payment_grace_days
        expired_grace: =expired_grace_days
      Harborline Mail Pro:
        grace: =payment_grace_days
        expired_grace: =expired_grace_days
      Microsoft 365 Business Basic:
        grace: =payment_grace_days
        expired_grace: =expired_grace_days
      Microsoft 365 Business Standard:
        grace: =payment_grace_days
        expired_grace: =expired_grace_days
      Microsoft 365 Business Premium:
        grace: =payment_grace_days
        expired_grace: =expired_grace_days
  measures:
  - email_msr_cycle_declines
- id: email_seat_changes
  subject:
  - email_seat_charge
  - email_seat_update
  - email_refund
  - email_settings_update
  rule: 'Seats may be added or reduced only while the subscription status is active. Added seats take effect at
    once and are billed prorated_daily to the term end: seats added times the seat price for the billing plan times
    the months of the plan, times the calendar days from today to the term end date divided by the calendar days
    of the term, rounded half up to the cent. A seat reduction takes effect at once with a refund only before the
    start of the current annual term plus cancellation_window_hours elapsed hours. The hours are counted in full
    60-minute periods from 00:00 on the term start date, and reaching the last hour closes the window. Inside the
    window, removed seats are refunded in full where refund_basis_in_window is full, or prorated by the unused days
    of the term where it is prorated_daily. Outside the window, or on a monthly plan, a reduction is scheduled as
    the seat count for the next renewal and nothing is refunded. A subscription can never go below seat_minimum_reduction_floor
    seats, and each charge is refunded only once.'
  eligibility:
  - id: seat_change_active
    applies_to:
    - email_seat_charge
    - email_seat_update
    kind: state
    condition: Seats may be added or reduced only while the subscription status is active.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    state_contract:
      field: email_holdings.status
      allowed:
      - active
  - id: reduction_window
    applies_to:
    - email_refund
    kind: time
    condition: A seat reduction takes effect at once with a refund only before the start of the current annual term
      plus cancellation_window_hours elapsed hours.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.term_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the start of the current annual term
      anchor_source: email_holdings.term_start_date
      relation: not_after
      duration_source: variants.cancellation_window_hours
      unit: elapsed_hours
      counting_rule: The hours are counted in full 60-minute periods from 00:00 on the term start date, and reaching
        the last hour closes the window.
      boundary: exclusive
  - id: refund_once
    applies_to:
    - email_refund
    kind: dedup
    condition: A subscription can never go below seat_minimum_reduction_floor seats, and each charge is refunded
      only once.
    evidence_fields:
    - email_charges.original_email_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_charges.original_email_charge_id
      action_bindings:
        email_charges.original_email_charge_id: original_email_charge_id
    dedup_contract:
      table: email_charges
      mode: separate_record
      object_bindings:
        original_email_charge_id: original_email_charge_id
      duplicate_filters:
        event_type:
        - email_refund
      distinct_fields: []
  params:
    remaining_days: calendar days from today to term_end_date
    term_days: calendar days from term_start_date to term_end_date
    per_tier:
      Harborline Mail Starter:
        window_hours: =cancellation_window_hours
        refund_basis: =refund_basis_in_window
      Harborline Mail Plus:
        window_hours: =cancellation_window_hours
        refund_basis: =refund_basis_in_window
      Harborline Mail Pro:
        window_hours: =cancellation_window_hours
        refund_basis: =refund_basis_in_window
      Microsoft 365 Business Basic:
        window_hours: =cancellation_window_hours
        refund_basis: =refund_basis_in_window
      Microsoft 365 Business Standard:
        window_hours: =cancellation_window_hours
        refund_basis: =refund_basis_in_window
      Microsoft 365 Business Premium:
        window_hours: =cancellation_window_hours
        refund_basis: =refund_basis_in_window
  formula:
    added_seats_annual: round(seats * seat_price_annual_prepaid * 12 * remaining_days / term_days, 2)
- id: email_cancellation
  subject:
  - email_cancel_immediate
  - email_cancel_schedule
  - email_cancel_withdraw
  - email_term_expire
  - email_refund
  rule: Only the customer can cancel, either immediately or by turning renewal off so the subscription ends at the
    term end, and a scheduled cancellation may be withdrawn before the term end date. An immediate cancellation
    of an annual term is refunded only before the start of the current annual term plus cancellation_window_hours
    elapsed hours. The hours are counted in full 60-minute periods from 00:00 on the term start date, and reaching
    the last hour closes the window. Inside the window the term's charges are refunded in full where refund_basis_in_window
    is full, or by the unused calendar days of the term over its calendar days where it is prorated_daily, rounded
    half up to the cent. Outside the window an immediate cancellation ends the subscription without any refund,
    and a month-to-month charge is never refunded (monthly_plan_refundable). A refund goes to the original payment
    method, or to account credit where the customer elects it or the charge was paid from credit.
  eligibility:
  - id: cancellation_window
    applies_to:
    - email_refund
    - email_cancel_immediate
    kind: time
    condition: An immediate cancellation of an annual term is refunded only before the start of the current annual
      term plus cancellation_window_hours elapsed hours.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.term_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the start of the current annual term
      anchor_source: email_holdings.term_start_date
      relation: not_after
      duration_source: variants.cancellation_window_hours
      unit: elapsed_hours
      counting_rule: The hours are counted in full 60-minute periods from 00:00 on the term start date, and reaching
        the last hour closes the window.
      boundary: exclusive
  params:
    unused_days: calendar days from today to term_end_date
    term_days: calendar days from term_start_date to term_end_date
  formula:
    prorated_refund: round(amount * unused_days / term_days, 2)
- id: email_plan_changes
  subject:
  - email_seat_charge
  - email_plan_change
  - email_settings_update
  rule: A product change may be made only while the subscription status is active. A move up to one of the product's
    upgrade_targets takes effect at once where upgrade_mid_term_allowed is true and is billed as the price difference
    per seat for the billing plan times the seats times the months of the plan, times the remaining calendar days
    of the term over its calendar days, rounded half up to the cent. A move down is only scheduled for the next
    renewal (downgrade_at_renewal_only), and where retention_on_downgrade is true each mailbox must already fit
    the lower product's mailbox_storage_gb when the renewal runs, otherwise the change is skipped at that renewal.
    Moving between Harborline Mail and Microsoft 365 is never a product change (cross_family_change_allowed) but
    a new subscription with migration, offered free from migration_assistance_min_seats seats and otherwise at migration_fee_per_mailbox.
  eligibility:
  - id: change_active
    applies_to:
    - email_plan_change
    - email_seat_charge
    kind: state
    condition: A product change may be made only while the subscription status is active.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    state_contract:
      field: email_holdings.status
      allowed:
      - active
  params:
    price_difference: target product seat price minus current seat price for the billing plan
    remaining_days: calendar days from today to term_end_date
    term_days: calendar days from term_start_date to term_end_date
    per_tier:
      Harborline Mail Starter:
        targets: =upgrade_targets
      Harborline Mail Plus:
        targets: =upgrade_targets
      Harborline Mail Pro:
        targets: =upgrade_targets
      Microsoft 365 Business Basic:
        targets: =upgrade_targets
      Microsoft 365 Business Standard:
        targets: =upgrade_targets
      Microsoft 365 Business Premium:
        targets: =upgrade_targets
  formula:
    upgrade_amount_annual: round(price_difference * seats * 12 * remaining_days / term_days, 2)
- id: email_suspension_and_retention
  subject:
  - email_suspend
  - email_reactivate
  - email_deprovision
  - email_activate
  - email_provision_fail
  rule: A paid order is provisioned at once, and an order that fails payment or fraud screening is cancelled and
    refunded in full. A suspended subscription is reactivated as soon as the overdue amount is paid, and its term
    dates are unchanged. A suspended subscription may be reactivated only on or before the suspension date plus
    suspension_retention_days calendar days. The window adds whole calendar days to the suspension date, counting
    the next day as day 1, and the last day is included; after it, as after the expired grace days, the mail organisation
    and every mailbox are deleted and cannot be recovered.
  eligibility:
  - id: retention_window
    applies_to:
    - email_reactivate
    kind: time
    condition: A suspended subscription may be reactivated only on or before the suspension date plus suspension_retention_days
      calendar days.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.suspended_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the suspension date
      anchor_source: email_holdings.suspended_date
      relation: not_after
      duration_source: variants.suspension_retention_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the suspension date, counting the next day as day 1,
        and the last day is included; after it, as after the expired grace days, the mail organisation and every
        mailbox are deleted and cannot be recovered.
      boundary: inclusive
- id: email_mailboxes
  subject:
  - email_mailbox_delete
  - email_mailbox_restore
  rule: Deleting a mailbox frees its seat but does not reduce the billed seat count. A deleted mailbox may be restored
    only on or before the moment the mailbox was deleted plus deleted_mailbox_retention_days calendar days. The
    window adds whole calendar days to the deletion date, counting the next day as day 1, and the last day is included.
    A restore costs mailbox_restore_fee, needs a free seat on the subscription, and is possible only while the subscription
    status is active. Mailbox storage, attachment size, send limits, aliases and quarantine follow mailbox_storage_gb,
    max_attachment_mb, daily_send_limit, aliases_per_mailbox and spam_quarantine_days, with a warning at storage_warning_pct
    and sending blocked at full where send_block_at_full is true.
  eligibility:
  - id: restore_window
    applies_to:
    - email_mailbox_restore
    kind: time
    condition: A deleted mailbox may be restored only on or before the moment the mailbox was deleted plus deleted_mailbox_retention_days
      calendar days.
    evidence_fields:
    - email_events.email_event_id
    - email_events.event_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_events.email_event_id
      action_bindings:
        email_events.email_event_id: email_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the mailbox was deleted
      anchor_source: email_events.event_at
      relation: not_after
      duration_source: variants.deleted_mailbox_retention_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the deletion date, counting the next day as day 1, and
        the last day is included.
      boundary: inclusive
  - id: restore_active
    applies_to:
    - email_mailbox_restore
    kind: state
    condition: A restore costs mailbox_restore_fee, needs a free seat on the subscription, and is possible only
      while the subscription status is active.
    evidence_fields:
    - email_holdings.email_plan_id
    - email_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.email_plan_id
      action_bindings:
        email_holdings.email_plan_id: email_plan_id
    state_contract:
      field: email_holdings.status
      allowed:
      - active
- id: email_domain_integration
  subject:
  - email_order
  - email_activate
  rule: Where dns_auto_config_with_harborline_dns is true and the subscription's domain_id names a Harborline domain
    that is active and on harborline_dns, the MX, SPF, DKIM and autodiscover records are set at activation; otherwise
    the customer sets them at their DNS provider. Once the subscription takes over the domain's MX, any cPanel mailboxes
    of a Harborline hosting plan for the same domain stop receiving mail (hosting_mailbox_coexistence), so the two
    never run side by side for one domain. A domain that is expired, in redemption or transferred out stops delivering
    mail for every subscription that uses it, without changing the subscription's billing.
  eligibility: []
